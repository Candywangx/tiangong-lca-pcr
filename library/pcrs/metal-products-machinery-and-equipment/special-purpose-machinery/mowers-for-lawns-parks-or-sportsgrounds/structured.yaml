system_boundary:
  rules:
    - rule_id: boundary_gate
      applies_to: "product system"
      rule: "Include upstream production and inbound transport of recorded inputs, attributable in-house fabrication, assembly, acceptance test and gate packaging; stop at factory gate."
      source_ids:
        - ramboll-husqvarna-2022
        - chalmers-lan-liu-2010
    - rule_id: boundary_downstream
      applies_to: "downstream use"
      rule: "Keep customer mowing fuel or electricity, maintenance, distribution after factory gate and end-of-life outside this production inventory; model them in separately declared downstream stages."
      source_ids:
        - ramboll-husqvarna-2022
    - rule_id: boundary_no_double_count
      applies_to: "purchased components"
      rule: "A purchased painted part or moulded housing includes its supplier production upstream; do not also count its constituent sheet or resin as this factory's input."
      source_ids:
        - ramboll-husqvarna-2022
        - chalmers-lan-liu-2010
