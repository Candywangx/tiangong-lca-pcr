allocation_rules:
  - rule_id: allocate_subdivide
    applies_to: "shared manufacturing"
    rule: "First isolate model or line-specific material, energy, test and waste records; preserve direct measurements."
    source_ids:
      - eu-pef-2021
  - rule_id: allocate_causal
    applies_to: "shared manufacturing"
    rule: "If subdivision is impossible, use a documented physical driver such as equipment operating time for electricity or measured material throughput for scrap; demonstrate causation and disclose denominator and sensitivity."
    source_ids:
      - eu-pef-2021
  - rule_id: allocate_recycling
    applies_to: "outgoing scrap"
    rule: "Record segregated scrap mass and actual destination; do not claim avoided virgin-material credit inside this production inventory without an explicitly declared downstream method."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "mower_manufacture"
      flow_role: "finished reference machine"
      record_type: "calibrated weighing and acceptance record"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each sampled accepted configuration"
      temporal_coverage: "reporting year"
      site_scope: "final acceptance at site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "scale calibration and acceptance record"
    - protocol_id: cp_bom
      process_id: "mower_manufacture"
      flow_role: "sheet, resin and purchased components"
      record_type: "controlled bill of materials and receiving weights"
      raw_fields: "model; configuration; part number; material; received mass; accepted machine count"
      collection_method: "Reconcile purchased or consumed component mass with the accepted-model bill of materials and stock movements."
      unit: "kg"
      frequency: "each production batch"
      temporal_coverage: "reporting year"
      site_scope: "manufacturing site and tier-one suppliers"
      aggregation_rule: "attributable material mass / accepted machines"
      quality_evidence: "signed BOM revision and receiving records"
    - protocol_id: cp_battery
      process_id: "mower_manufacture"
      flow_role: "installed lithium-ion battery"
      record_type: "serialised BOM and assembly record"
      raw_fields: "model; battery part number; chemistry; capacity; installed item count; accepted machine count"
      collection_method: "Count complete installed batteries against serialised acceptance and supplier records."
      unit: "Item(s)"
      frequency: "each production batch"
      temporal_coverage: "reporting year"
      site_scope: "battery-equipped route"
      aggregation_rule: "installed battery items / accepted machines"
      quality_evidence: "battery BOM and acceptance record"
    - protocol_id: cp_engine_count
      process_id: "mower_manufacture"
      flow_role: "installed diesel engine"
      record_type: "engine BOM and acceptance record"
      raw_fields: "model; engine part number; rated power; installed item count; accepted machine count"
      collection_method: "Count complete installed diesel engines against the signed BOM and acceptance record."
      unit: "Item(s)"
      frequency: "each production batch"
      temporal_coverage: "reporting year"
      site_scope: "diesel-powered route"
      aggregation_rule: "installed engine items / accepted machines"
      quality_evidence: "engine BOM and acceptance record"
    - protocol_id: cp_energy
      process_id: "mower_manufacture"
      flow_role: "site electricity"
      record_type: "meter and production log"
      raw_fields: "meter interval; kWh; line hours; accepted machine count"
      collection_method: "Meter attributable factory electricity; subdivide by line or use documented causal operating hours for shared meters."
      unit: "MJ"
      frequency: "monthly"
      temporal_coverage: "reporting year"
      site_scope: "manufacturing site"
      aggregation_rule: "attributable electricity / accepted machines"
      quality_evidence: "calibrated meter, utility bill and production hours"
    - protocol_id: cp_test
      process_id: "mower_manufacture"
      flow_role: "gasoline or diesel acceptance test"
      record_type: "fuel issue and test record"
      raw_fields: "fuel type; fuel mass; test run; model; accepted machine count"
      collection_method: "Weigh or trace gasoline or diesel issued to acceptance tests, net of returned fuel."
      unit: "kg"
      frequency: "each test campaign"
      temporal_coverage: "reporting year"
      site_scope: "gasoline or diesel route at manufacturing site"
      aggregation_rule: "test fuel mass / accepted machines"
      quality_evidence: "fuel issue and acceptance log"
    - protocol_id: cp_pack
      process_id: "mower_manufacture"
      flow_role: "corrugated box"
      record_type: "packaging BOM and issue record"
      raw_fields: "box specification; dry mass; box count; accepted machine count"
      collection_method: "Weigh the actual corrugated box and reconcile issued boxes to accepted machines."
      unit: "kg"
      frequency: "each production batch"
      temporal_coverage: "reporting year"
      site_scope: "gate packaging"
      aggregation_rule: "corrugated box mass / accepted machines"
      quality_evidence: "packaging specification and issue record"
    - protocol_id: cp_scrap
      process_id: "mower_manufacture"
      flow_role: "separate steel and ABS scrap"
      record_type: "waste weighing and segregation record"
      raw_fields: "waste code; material; weighed mass; batch; accepted machine count"
      collection_method: "Weigh steel and ABS scrap separately before transfer; reconcile batch origin and destination."
      unit: "kg"
      frequency: "each waste transfer"
      temporal_coverage: "reporting year"
      site_scope: "on-site fabrication"
      aggregation_rule: "attributable segregated scrap / accepted machines"
      quality_evidence: "calibrated weighbridge ticket and waste transfer record"
  calculation_rules:
    - id: electricity_mj
      applies_to: "site_electricity"
      rule: "Attributable MJ = metered kWh × 3.6 after documented shared-meter allocation."
      inputs:
        - "metered kWh"
        - "accepted machine count"
        - "causal line hours when shared"
      output: "MJ per accepted machine"
      source_ids:
        - eu-pef-2021
    - id: activity_per_machine
      applies_to: "recorded inputs and wastes"
      rule: "Attribute the measured batch quantity to the declared model and divide by accepted machines of that model; retain rejected units and rework in the batch balance."
      inputs:
        - "batch quantities"
        - "accepted machine count"
        - "model records"
      output: "exchange per accepted machine"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_configuration
      applies_to: "all rows"
      requirement: "Match every source record to the same model, route, configuration and reporting period as the reference machine."
      evidence: "BOM revision, serial and acceptance records."
    - id: dq_mass
      applies_to: "reference and materials"
      requirement: "Measure net mass M and reconcile major material or component quantities without merging shipping packaging into the machine."
      evidence: "scale record, BOM and packaging records."
    - id: dq_route
      applies_to: "conditional rows"
      requirement: "State why each gasoline, diesel, electric, battery, purchased-housing and in-house fabrication row applies or is absent."
      evidence: "route and process records."
    - id: dq_gap
      applies_to: "unresolved rows and quantities"
      requirement: "Keep UUID and range evidence gaps visible; do not substitute a proxy identity or a case value for a category benchmark."
      evidence: "lookup review and foreground records."
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Confirm one accepted complete CPC 44121 mower output, the exact reference UUID and M kg for the same configuration."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_material_route
    applies_to: "inventory"
    rule: "Reconcile purchased components against in-house sheet and resin routes; reject duplicate counting and record each condition as present or absent."
    source_ids:
      - ramboll-husqvarna-2022
      - chalmers-lan-liu-2010
  - rule_id: validate_utilities
    applies_to: "electricity and test fuel"
    rule: "Confirm metered electricity, any gasoline or diesel test use, their units and a causal shared-site allocation; disclose exhaust modelling without counting customer use."
    source_ids:
      - eu-pef-2021
      - ramboll-husqvarna-2022
  - rule_id: validate_scrap
    applies_to: "waste"
    rule: "Match steel and ABS waste masses with separate transfer records and declared treatment; unresolved ABS flow UUID remains blank."
    source_ids:
      - ramboll-husqvarna-2022
      - chalmers-lan-liu-2010
published_dataset_profile:
