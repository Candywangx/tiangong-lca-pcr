allocation_rules:
  - rule_id: avoid_allocation
    applies_to: "all processes"
    rule: "First isolate configuration production lines and causal meters. Allocate mixed runs and residual shared services by measured driver appropriate to the service (time, metered load, handled mass or wastewater load); disclose rejected/reworked burden assigned to accepted output. Do not default every utility to product mass."
    source_ids: []
  - rule_id: scrap_treatment
    applies_to: "steel_scrap; abs_scrap; paint_residue; r290_recovery"
    rule: "Internal returns cancel paired transfers but retain repeated process burden. External recycling/disposal uses actual destination and a declared consistent allocation convention. No automatic avoided-primary-material credit or arbitrary negative burden. Separate any sold co-product by actual sale, quality and quantity."
    source_ids: []
