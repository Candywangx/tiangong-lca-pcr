  how_long_or_cycle: "One factory production period; household operating cycles and lifetime excluded"
  reference_flow_link: "final_product"
system_boundary:
  rules:
    - rule_id: factory_only
      applies_to: "all processes"
      rule: "Include actual fabrication, surface work, assembly, charge if present, factory acceptance/rework, packaging and attributable controls; later installation, consumer water/energy/detergent and end-of-life are separate scenarios. Consumer energy labels never become factory factors."
      source_ids:
        - bosch-dryers-2021
        - speedqueen-home-stack
    - rule_id: make_buy_once
      applies_to: "all processes"
      rule: "For every tub/drum, motor, pump, board, harness, seal, heating unit and refrigeration circuit, record delivered state and one mutually exclusive make/buy path. Bought finished parts include upstream materials/processes; in-house paths replace them with actual atomic inputs and processes. Charged circuit excludes a second initial fill; uncharged circuit requires actual factory fill."
      source_ids:
        - bosch-heatpump-r290
    - rule_id: site_completion
      applies_to: "all processes"
      rule: "Cards are conditional evidence-guided starting points, not a complete default BOM. Add every actually present grade, compound, purchased part, fuel, transport interface, refrigerant, chemical, waste and elementary species separately before dataset validation; retain unknown versus demonstrated not_applicable."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual received sheet, resin or completed purchased component, with supplier operations and retained initial fill declared"
  starting_condition_role: "Supplier material/component interface"
  product_classification_scope: "Reviewed complete household washing/drying/dishwashing category"
  recursive_input_rule: "Purchased same-category subassembly or returned unit retains upstream manufacture once; internal rework cancels only transfer quantities"
  upstream_dataset_requirement: "Actual material, completed component, utility, transport and waste providers; gaps cannot mean zero"
  disclosure: "Model/BOM, make/buy, operations omitted as supplier-completed, charges, site, period and gate; infrastructure/maintenance cutoffs justified"
