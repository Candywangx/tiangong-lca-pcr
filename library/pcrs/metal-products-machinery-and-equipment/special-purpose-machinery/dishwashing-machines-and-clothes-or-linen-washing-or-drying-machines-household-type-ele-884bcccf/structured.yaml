  calculation_rules:
    - id: normalize_mass
      applies_to: "stainless_sheet; galvanized_sheet; abs_resin; pp_resin; concrete_ballast; fabrication_power; steel_scrap; abs_scrap; sodium_hydroxide; epoxy_powder; isopropanol; surface_power; natural_gas; paint_residue; spent_solvent; ipa_air; wash_motor; dishwash_pump; dishwash_arm; drain_pump; control_board; wire_harness; epdm_seal; manual_crank; assembly_power; resistance_heater; dryer_blower; gas_burner; condenser; charged_heatpump; uncharged_heatpump; r290_fill; r290_recovery; r290_air; drying_power; test_water; test_detergent; test_power; test_wastewater; rejected_machine; carton; eps; residual_power; steam; condensate_return; makeup_water; sludge; water_vapour; co2; co; no2"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: traceability
      applies_to: "all inventory rows"
      requirement: "Actual configuration, supplier completion, grade/recipe, gate and provider geography/time; every actual exchange atomic and localized; no unsupported UUID substitutes."
      evidence: "BOM; drawings; certificates; direct identities; provider records"
    - id: closure
      applies_to: "physical materials and species"
      requirement: "Close each metal/polymer/chemical on its own species and wet/dry basis: external input plus opening stock and documented formation equals accepted product, external scrap/sludge/wastewater/release, closing stock and actual reaction/destruction. Each term uses its own assay; oxygen/reagent uptake and reaction products retained. Pair internal returns; never count gross mass as contained metal. Close actual water including input moisture, stocks, evaporation, product carryover, discharge and reaction. Every wet input, product, opening/closing stock, sludge, wastewater and waste uses its own measured water fraction and wet/dry basis; volume terms use their own measured density. Retain paired return transfers and investigate closure against actual combined measurement, sampling and allocation uncertainty."
      evidence: "Matched weighings; assays; moisture; reaction and stock records"
    - id: solvent_charge
      applies_to: "isopropanol; spent_solvent; ipa_air; r290_fill; r290_recovery; r290_air"
      requirement: "Separate product retention, recovery, capture media, stocks, actual destruction and every air/non-air residual. Capture is not destruction and recovered mass is not zero release. An unexplained balance residual is not automatically an air emission; investigate non-air retained material, waste, water and stock terms first, without assigning an unsupported fate. Investigate closure with actual combined sampling, measurement and allocation uncertainty; no universal tolerance."
      evidence: "Charge/cylinder tare; capture/recovery assays; destruction receipt; species balance"
    - id: utility_reconcile
      applies_to: "all utility rows"
      requirement: "Each service reconciles the same period/units: imports plus actual generation less exports and storage change equals assigned process use and unassigned residual. Shared services carry only residual; actual onsite generation replaces purchased service for that fraction and adds its own fuel/controls. Investigate negative residual against meter/time/allocation uncertainty; never clip."
      evidence: "Imports/generation/export/storage and submeters; causal allocation"
validation_rules:
  - rule_id: identity_scope
    applies_to: "final_product"
    rule: "Reject appliance/service confusion, mismatched configuration or unsupported classification assignment. Household centrifugation and borderline marketed capacities require explicit review; no automatic mapping from HS or supplier marketing."
    source_ids:
      - unsd-cpc3
      - thomas-spin
  - rule_id: measurement_complete
    applies_to: "all inventory rows"
    rule: "Require positive N/D, calibrated cp_mass, same configuration and period, supported normalize_mass for every applicable input/output and original Q records. Reject packaging/reject mass in D, double counted bought components/charge or consumer factors."
    source_ids: []
  - rule_id: balances
    applies_to: "physical balances"
    rule: "Require separate gross and contained-species/water/solvent/charge/energy closure with stocks and internal-return cancellation. Unexplained discrepancy beyond actual combined uncertainty requires investigation; no invented default yield or threshold."
    source_ids: []
  - rule_id: gaps
    applies_to: "all exchanges"
    rule: "Unavailable UUID/provider/recipe/measurement is unknown, not zero/not_applicable. Add every actual conditional route exchange before downstream use; report checks performed/skipped and remaining limitations. Candidate methodology does not satisfy publication identity/evidence gates by itself."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset; process; lifecyclemodel"
  allowed_use: "Actual declared household appliance factory manufacture; downstream lifecycle with separately evidenced use/end-of-life"
  excluded_use: "Laundry/dishwashing service; generic appliance functional comparison; automatic commercial or spin-dryer assignment"
  required_metadata: "All reference qualifiers, model/BOM, N/D/M, Q and providers, make/buy, charge, factory boundaries, allocation and actual exclusions"
  required_quality_disclosure: "Measured coverage, route evidence, identity/provider gaps, site period and actual uncertainty; no invented ranges"
  update_trigger: "Changed configuration, supplier, grade/recipe, heating/refrigerant route, gate, acceptance or measured service allocation"
