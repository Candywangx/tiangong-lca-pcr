review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_inventory_uuids: Except finished appliance, conditional CN ABS procurement and customer-side medium-voltage electricity, atomic components, grade-specific materials, chemistry, wastes and species need direct identities matching actual state and provider. Unresolved is not zero.
  unresolved_provider_links: Every concrete supplier, energy geography/year/voltage and waste-treatment destination needs actual provider evidence. Adopted product identities do not establish providers.
  unresolved_quantitative_ranges: No generic BOM, accepted machine mass, yield, factory energy, test load, refrigerant charge, pollutant factor, life or empirical range is adopted. Collect same-configuration period records.
  unresolved_classification_boundaries: Current CPC3 notes distinguish 44622 machinery and 44911 centrifugal clothes driers; model assignment requires principal design, marketed use and classification review. Household spinning is not automatically excluded. Capacity or HS adjacency alone is not decisive.
  unresolved_route_evidence: Manufacturer documents establish architecture examples, not factory operations, material grades or make/buy. Manual dryer and non-electric dishwasher configurations require actual delivered-design evidence; remain eligible conditional variants rather than invented default routes.
  unresolved_source_access: Speed Queen residential and commercial HTML acquisitions returned HTTP403; original official home stack washer/gas-electric dryer PDF used instead. Original WonderWash page conflicts in dimension and mass statements; no numerical value adopted. Bosch WTR88T81GB sheet has blank parameter cells and ambiguous No refrigerant entry; no absence or factor inferred.
  identity_rejections:
    - Cold Rolled Plate b28b440d has contradictory official Chinese alloy-rod label and generic chemistry; Steel Sheet 13082a6a Chinese label is silver sheet; neither establishes stainless grade.
    - ABS source-specific monitor/telephone proxy identities rejected; CN granulate identity only conditional on actual CN procurement and correct grade.
    - Voltage transformation service is not purchased electricity; waste-incineration Electricity b989a649 is not factory grid supply.
    - Propane refrigerant search returned cypermethrin elementary identities; reject all, preserve R290 supply/release identity gap.
