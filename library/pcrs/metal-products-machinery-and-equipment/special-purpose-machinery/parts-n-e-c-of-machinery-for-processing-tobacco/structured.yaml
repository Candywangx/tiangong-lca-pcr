validation_rules:
  - rule_id: validate_part
    applies_to: "reference output"
    rule: "Reject a dataset without the compatible tobacco-processing machine, part identifier, accepted configuration and measured net mass M."
    source_ids:
      - un-cpc-3-2025-notes
  - rule_id: validate_exchange
    applies_to: "every inventory row"
    rule: "Verify direction, physical flow type, property, unit, inclusion condition, collection protocol and one accepted-unit basis; keep an unresolved UUID blank until exact identity is confirmed."
    source_ids:
      - eu-pef-2021-annex-i
  - rule_id: validate_balance
    applies_to: "metal route"
    rule: "Reconcile recorded alloy-steel input, accepted part mass, chips, rejects and stock change without inventing a yield or scrap range."
    source_ids:
      - us-epa-clean-lines-2007
  - rule_id: validate_waste
    applies_to: "conditional oil route"
    rule: "Include spent cutting oil only when the documented wet-machining route produces it; retain treatment evidence and avoid duplicate chip or oil accounting."
    source_ids:
      - us-epa-clean-lines-2007
