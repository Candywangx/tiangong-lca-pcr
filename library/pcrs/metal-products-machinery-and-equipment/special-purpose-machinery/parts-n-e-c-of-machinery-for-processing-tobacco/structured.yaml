allocation_rules:
  - rule_id: allocation_direct
    applies_to: "part fabrication"
    rule: "Assign measured material, energy, packaging and waste directly to the part configuration wherever the records permit."
    source_ids:
      - eu-pef-2021-annex-i
  - rule_id: allocation_shared
    applies_to: "shared equipment and meters"
    rule: "For a shared record, document the physical driver and accepted-unit denominator; retain the unallocated total and reconciliation before attributing the exchange to this part."
    source_ids:
      - eu-pef-2021-annex-i
  - rule_id: allocation_scrap
    applies_to: "chips and spent oil"
    rule: "Record the outgoing waste mass and its actual treatment route; do not silently subtract a recycling credit or count the same chip mass as both retained product and waste."
    source_ids:
      - eu-pef-2021-annex-i
      - us-epa-clean-lines-2007
