    explanation: Direct-read Product flow, manufactured finished product at plant, Mass reference and official bilingual names support blade output; general comment wording does not define a working earthmoving service. Actual delivery configuration, geography and manufacturer remain required.
  unresolved_inventory_uuids: Grade-specific plate, wire, gas, chemicals, bought components, packaging, wastes and emission species remain candidates pending exact direct identity checks. Mixed-metal Steel Plate candidate has contradictory Chinese name and pipe-mill supply state and is rejected for AR400. Only reference blade and conditional CN medium-voltage user electricity UUIDs are adopted.
  unresolved_quantitative_ranges: No universal blade mass, energy, yield, lifetime, coating recipe or emission range is established. Actual same-configuration foreground collection is required.
  evidence_limitations: Manufacturer variants and original patent disclosure support alternative blade boundaries/routes, not universal factories. Caterpillar OEM component page was inspected as original public web content; a retained local download was unavailable. Detached wear parts require separate classification review. Supplier-specific completed operations and grades remain explicit make/buy and collection decisions.
