allocation_rules:
  - rule_id: allocation_separate
    applies_to: "foreground_burden_allocation"
    rule: "First separate by same-configuration work orders and submeters; allocate shared services by measured causal drivers and disclose other lines. Blade capacity or host power does not substitute for measurement."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "foreground_burden_allocation"
    rule: "Retain reject, rework, cutting-loss and captured-waste burdens; reject and packaging mass are excluded from accepted-net-mass denominator. Recycling uses actual waste/provider links, with no default virgin-substitution credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "test_pack"
      flow_role: "reference_product"
      record_type: "weighing_record"
      raw_fields: "model; configuration; serial number; accepted net mass M; accepted count N"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "per accepted unit"
      temporal_coverage: "same production period"
      site_scope: "declared delivered blade, not host"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "calibration, tare, configuration and acceptance records"
    - protocol_id: cp_fabrication
      process_id: "fabrication"
      flow_role: "atomic_exchanges"
      record_type: "production_record"
      raw_fields: "exchange identity; Q; N; configuration; meter units; stock opening/closing; wet/dry basis; own assay; route; period; provider"
      collection_method: "Meters, weighing, procurement, work orders, sampling and provider records; retain reject/rework burdens."
      unit: "MJ for energy; kg for mass"
      frequency: "per batch and meter interval"
      temporal_coverage: "same production period"
      site_scope: "actual plant and delivered configuration"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration, sampling, stocks, allocation and uncertainty evidence"
    - protocol_id: cp_surface
      process_id: "surface"
      flow_role: "atomic_exchanges"
      record_type: "production_record"
      raw_fields: "exchange identity; Q; N; configuration; meter units; stock opening/closing; wet/dry basis; own assay; route; period; provider"
      collection_method: "Meters, weighing, procurement, work orders, sampling and provider records; retain reject/rework burdens."
      unit: "MJ for energy; kg for mass"
      frequency: "per batch and meter interval"
      temporal_coverage: "same production period"
      site_scope: "actual plant and delivered configuration"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration, sampling, stocks, allocation and uncertainty evidence"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "atomic_exchanges"
      record_type: "production_record"
      raw_fields: "exchange identity; Q; N; configuration; meter units; stock opening/closing; wet/dry basis; own assay; route; period; provider"
      collection_method: "Meters, weighing, procurement, work orders, sampling and provider records; retain reject/rework burdens."
      unit: "MJ for energy; kg for mass"
      frequency: "per batch and meter interval"
      temporal_coverage: "same production period"
      site_scope: "actual plant and delivered configuration"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration, sampling, stocks, allocation and uncertainty evidence"
    - protocol_id: cp_test_pack
      process_id: "test_pack"
      flow_role: "atomic_exchanges"
      record_type: "production_record"
      raw_fields: "exchange identity; Q; N; configuration; meter units; stock opening/closing; wet/dry basis; own assay; route; period; provider"
      collection_method: "Meters, weighing, procurement, work orders, sampling and provider records; retain reject/rework burdens."
      unit: "MJ for energy; kg for mass"
      frequency: "per batch and meter interval"
      temporal_coverage: "same production period"
      site_scope: "actual plant and delivered configuration"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration, sampling, stocks, allocation and uncertainty evidence"
    - protocol_id: cp_shared
      process_id: "shared"
      flow_role: "atomic_exchanges"
      record_type: "production_record"
      raw_fields: "exchange identity; Q; N; configuration; meter units; stock opening/closing; wet/dry basis; own assay; route; period; provider"
      collection_method: "Meters, weighing, procurement, work orders, sampling and provider records; retain reject/rework burdens."
      unit: "MJ for energy; kg for mass"
      frequency: "per batch and meter interval"
      temporal_coverage: "same production period"
      site_scope: "actual plant and delivered configuration"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration, sampling, stocks, allocation and uncertainty evidence"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all exchanges"
      requirement: "Actual type, chemical/component identity, delivery state, geography, units and provider interface; no mixed-metal candidate substitutes for an exact steel grade."
      evidence: "certificates, SDS and direct identity review"
    - id: quality_complete
      applies_to: "data package"
      requirement: "Disclose collected/calculated/not-applicable/unknown/missing state per row, UUID/range gaps; unknown is not zero."
      evidence: "route matrix, raw records, measurements and uncertainty"
validation_rules:
  - rule_id: validate_configuration
    applies_to: "foreground_dataset_conformance"
    rule: "Reference product, acceptance, mass denominator and inventory must share one delivered configuration; verify excluded host/parts and supplied-option status."
    source_ids:
      - dymax-dozer-guide
      - un-cpc3-blades
  - rule_id: validate_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile atomic exchanges, upstream counted once, water/species/metal balances, shared residual, stocks and rework against measured uncertainty; no invented universal range."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Adopt UUID only with directly confirmed type, official bilingual name, property/unit, state/interface and geography. CN medium-voltage user power is conditional; disclose unresolved identities/ranges for prepublication review."
    source_ids: []
  - rule_id: validate_denominator
    applies_to: "foreground_dataset_conformance"
    rule: "For each configuration and matched period, retain attributable Q including reject/rework burdens; N is accepted delivered blades and M is sum of calibrated accepted net blade masses / N. q_item = Q/N and q_ref = Q/sum of accepted net masses. Exclude packaging/reject mass and other blade configurations from denominator; align stocks and work in progress."
    source_ids: []
  - rule_id: validate_utility_residual
    applies_to: "foreground_dataset_conformance"
    rule: "Use the same site period and units to reconcile purchased imports plus actual on-site generation minus exports and storage change against assigned fabrication/surface/assembly/test demand plus shared residual and evidenced conversion losses. Shared rows include only unassigned residual. Investigate negative residual with period, calibration, allocation and combined uncertainty, never clip. Record generation fuel/water/emissions once and cancel paired internal transfers."
    source_ids: []
  - rule_id: validate_water_closure
    applies_to: "foreground_dataset_conformance"
    rule: "For each water-bearing input and output use its own actual water content and wet/dry basis: input moisture, fresh/dilution/quench/cleaning water, product/fluid retention, wet scrap/sludge, wastewater, evaporation, opening/closing stocks and actual reaction water production/consumption. Cancel paired internal returns. Investigate closure against combined measurement/sampling/allocation uncertainty; no universal tolerance."
    source_ids: []
  - rule_id: validate_contained_species
    applies_to: "foreground_dataset_conformance"
    rule: "For every metal/chemical species, match each term independently with its own grade assay, concentration, amount and wet/dry conversion for inputs, product, scrap, slag, captured dust, sludge, wastewater, releases and opening/closing stocks. Include actual species reactions and cancel paired internal returns. Gross steel/wastewater mass never equals contained iron/species mass. Closure uses combined measurement/sampling/allocation uncertainty, not invented yield."
    source_ids: []
  - rule_id: validate_solvent_emissions
    applies_to: "foreground_dataset_conformance"
    rule: "Balance each actual solvent supplied inside paint separately from added thinner against product retention, recovery, capture-media content, stocks, actual destruction and non-air wastes before assigning measured species-resolved air release. Captured/recovered solvent is not air emission. Fuel carbon balance may support actual CO2 with matched fuel carbon and other carbon outputs, but never establishes CO, NOx or metal aerosol; use separate applicable species evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing data for same delivered configuration, projected to process/lifecyclemodel"
  excluded_use: "Earthmoving service, host manufacture, universal capacity equivalence or unreviewed separately sold part substitution"
  required_metadata: "model, delivered BOM, make/buy, routes, net mass, period, plant, supply interfaces and collection protocols"
  required_quality_disclosure: "unresolved UUIDs, missing empirical ranges, conditional routes, allocation and uncertainty"
  update_trigger: "design, grade, wear package, provider, route, geography or voltage change"
