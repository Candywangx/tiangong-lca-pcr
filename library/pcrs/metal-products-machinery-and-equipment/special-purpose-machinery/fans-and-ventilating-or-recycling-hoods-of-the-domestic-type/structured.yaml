system_boundary:
  rules:
    - rule_id: boundary_make_buy
      applies_to: "all processes"
      rule: "Make/buy matrix by configuration: complete purchased motor, populated controller, filter or lighting module carries embedded copper/steel/resin/chemicals and supplier production once. Own fabrication instead records individual feedstocks and operations; partial purchased motor identifies completed winding/lamination. Do not add embedded inputs again. Include outsourced operations and transport once."
