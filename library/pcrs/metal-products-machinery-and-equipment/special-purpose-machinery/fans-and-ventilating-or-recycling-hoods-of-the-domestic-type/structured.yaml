  calculation_rules:
    - id: period_denominator
      applies_to: "all inventory rows"
      rule: "D is the sum of calibrated accepted net masses for one configuration and period; N is accepted count; M=D/N. Q is attributable exchange quantity including reject/rework burden, excluding paired internal transfers. First q_item=Q/N; then q_ref=Q/D=q_item/M. Never average across configurations or include packaging/rejected mass in D."
      inputs:
        - Q
        - N
        - D
        - cp_mass
      output: "per 1 kg reference flow"
      source_ids: []
    - id: utility_reconcile
      applies_to: "physical utility meter records"
      rule: "For each same-period/unit site balance, available=imports+actual generation-exports-storage increase, adjusted for measured return/recovery interface; residual=available-sum already assigned process consumption. Allocate only residual causally; never add site total on top of submeters. Investigate negative residual using synchronization, units and combined measurement uncertainty; do not clip. In-house energy uses actual fuel/emissions and internal output, without duplicating purchased power."
      inputs:
        - imports
        - generation
        - exports
        - storage
        - "assigned meters"
      output: "reconciled residual"
      source_ids: []
    - id: water_balance
      applies_to: "physical water records"
      rule: "Water entering plus opening water stocks plus reaction formation equals water in product, wet scrap/sludge/wastewater, measured evaporation, closing stocks and reaction consumption. Use each term own moisture and basis, paired internal return/circulation cancellation. Unknown residual stays a gap; investigate combined sampling/meter/allocation uncertainty, no universal tolerance."
      inputs:
        - water
        - moisture
        - stocks
        - reactions
        - returns
      output: "water closure"
      source_ids: []
    - id: species_balance
      applies_to: "physical material and species records"
      rule: "For each actual contained Cu/Fe/Cr/Ni/Al/carbon or chemical species use that term own matched assay and wet/dry basis in feed, accepted product, scrap, sludge, wastewater and releases, including stocks/reactions and paired transfers. Gross stainless/ABS-GF/wire mass does not equal contained element; provider-embedded purchased components are not repeated foreground feeds."
      inputs:
        - "term-specific mass"
        - assay
        - moisture
        - stocks
        - reactions
      output: "species closure"
      source_ids: []
    - id: solvent_balance
      applies_to: "physical solvent records"
      rule: "Actual solvent input plus opening stock/reaction formation equals retained product, recovered usable solvent, solvent in spent liquid/capture media, verified actual destruction, measured air/water release, closing stocks/reaction consumption. Capture is not destruction; unknown residual cannot become air release. Measure solvent concentration separately in each term and investigate uncertainty."
      inputs:
        - "solvent quantities"
        - "own concentrations"
        - capture
        - destruction
        - stock
      output: "solvent closure"
      source_ids: []
  data_quality_requirements:
    - id: dq_route
      applies_to: "all processes"
      requirement: "Configuration-specific actual make/buy and material specification; none of these conditional exemplars establishes a factory recipe. Distinguish measured zero, not applicable and unknown."
      evidence: "BOM; supplier certificates; work orders"
    - id: dq_sources
      applies_to: "all processes"
      requirement: "Examples do not supply intensity ranges. Complete temporal/spatial/technological coverage and uncertainty; any unsupported UUID/provider/range remains explicit before dataset use."
      evidence: "Actual site meters and supplier data"
validation_rules:
  - rule_id: validate_identity
    applies_to: "all processes"
    rule: "Require every qualifier, atomic flow identity, actual provider and finished physical configuration; unresolved input identity is not a zero amount. Full category output UUID does not imply all models share a BOM."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "all processes"
    rule: "Audit purchased versus own motor/controller/filter routes and embedded burdens once; shipped optional carbon/lighting confirmed; downstream cooking pollutants and operating watts never substituted for factory production."
    source_ids:
      - bosch-hood
      - panasonic-abs-gf
      - dyson-cf1
  - rule_id: validate_mass
    applies_to: "physical balances"
    rule: "Verify same configuration D, accepted N, calibrated net M, period Q/N then Q/D, all own-term water/species/solvent balances, stocks/reactions/returns and measured uncertainty. Investigate unexplained residuals, missing inputs and assay mismatches; no invented yield or tolerance."
    source_ids: []
  - rule_id: validate_utilities
    applies_to: "utility and emission records"
    rule: "Reconcile same-period process and residual loads with import/generation/export/storage, actual steam energy interface and return once; verify species/compartment-specific emissions and treatment. Negative residuals or unknown closure block dataset completeness until investigation."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset; process; lifecyclemodel"
  allowed_use: "Production of the explicitly declared domestic appliance configuration at gate"
  excluded_use: "Whole-life comparison, default household power/lifetime, unsupported model or principal industrial/purifier/HVAC substitution"
  required_metadata: "domestic principal function; fan mounting/hidden impeller or hood ducted/recirculating mode; model/BOM/drawing revision; net delivered contents; installed grease/carbon filter and lighting; motor AC/DC/control technology; material grades and ABS-GF fibre loading; voltage, rated operation and acceptance test; make/buy; site/year/provider/gate"
  required_quality_disclosure: "Provider gaps; make/buy; omitted exchanges; uncertainty; period; allocation; boundary and unresolved UUID/ranges"
  update_trigger: "BOM/motor/filter/material or process/provider change; new measured data; scope review"
data_sources:
  - id: "bosch-hood"
    type: "handbook"
    reference: "Bosch, Operating and installation instructions, document9000022567, undated: https://media3.bosch-home.com/Documents/9000022567_A.pdf"
    used_for: "Pages2–4: actual domestic ducted/recirculating architecture, conditional grease/carbon filters and lighting; older multi-model example, no factory factor"
