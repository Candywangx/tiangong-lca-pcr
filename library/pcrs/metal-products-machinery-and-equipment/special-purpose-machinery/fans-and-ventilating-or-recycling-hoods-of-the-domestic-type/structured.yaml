    reference: "Panasonic Malaysia, F-M96JHVBWH product page, undated: https://fan.my.panasonic.com/ceiling-fan/ceilingfan-F-M96JHVBWH"
    used_for: "Features: glass-fibre-reinforced ABS blades, DC motor and control counterexample; no fibre fraction or recipe"
