allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared factory processes"
    rule: "First use separate meters, material issues, work orders and product-specific labor or machine hours. Allocate only unavoidable shared electricity and heat by recorded activity hours for the same site and period; disclose the driver."
    source_ids:
      - swegon-casa-hood-epd-2022
  - rule_id: allocation_scrap
    applies_to: "fabrication waste"
    rule: "Keep documented internal regrind or rework inside the process. Record externally transferred offcuts as waste and disclose any economic credit separately; never credit the same mass twice."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "final_assembly"
      flow_role: "accepted reference product"
      record_type: "weighing record"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each model/configuration sample and every change"
      temporal_coverage: "reporting year"
      site_scope: "reporting factory"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration certificate; signed acceptance record"
    - protocol_id: cp_fabrication_materials
      process_id: "component_fabrication"
      flow_role: "steel sheet and polypropylene input"
      record_type: "issue and return ledger"
      raw_fields: "material grade; issued mass; returned mass; model; accepted count"
      collection_method: "Reconcile weighed material issues, returns and bill of materials to accepted output."
      unit: "kg"
      frequency: "each production batch"
      temporal_coverage: "reporting year"
      site_scope: "on-site fabrication"
      aggregation_rule: "attributable net material mass / accepted machines"
      quality_evidence: "purchase and batch issue records"
    - protocol_id: cp_fabrication_waste
      process_id: "component_fabrication"
      flow_role: "segregated steel and polypropylene waste"
      record_type: "waste transfer ledger"
      raw_fields: "material identity; gross scrap mass; internal return mass; accepted count"
      collection_method: "Weigh each separated waste stream and reconcile documented internal reuse and external transfer."
      unit: "kg"
      frequency: "each production batch"
      temporal_coverage: "reporting year"
      site_scope: "on-site fabrication"
      aggregation_rule: "external waste mass / accepted machines"
      quality_evidence: "scale and transfer records"
    - protocol_id: cp_purchased_parts
      process_id: "final_assembly"
      flow_role: "purchased motor"
      record_type: "supplier and issue record"
      raw_fields: "motor specification; supplier mass; issued quantity; accepted count"
      collection_method: "Match motor specification and supplier mass to the accepted configuration and issue records."
      unit: "kg"
      frequency: "each model or supplier change"
      temporal_coverage: "reporting year"
      site_scope: "reporting factory"
      aggregation_rule: "attributable motor mass / accepted machines"
      quality_evidence: "supplier bill of materials; receiving record"
    - protocol_id: cp_electricity
      process_id: "final_assembly"
      flow_role: "grid electricity"
      record_type: "meter record"
      raw_fields: "meter start; meter end; test cycle; accepted count; allocation driver"
      collection_method: "Read calibrated electricity meters for assembly, test and packaging, then reconcile any shared-meter allocation."
      unit: "kWh"
      frequency: "monthly and each production batch"
      temporal_coverage: "reporting year"
      site_scope: "reporting factory"
      aggregation_rule: "attributable electricity / accepted machines"
      quality_evidence: "meter calibration; work-order hours"
    - protocol_id: cp_packaging
      process_id: "final_assembly"
      flow_role: "corrugated box"
      record_type: "packing bill of materials"
      raw_fields: "box specification; box mass; issued count; reuse count; accepted count"
      collection_method: "Weigh or use traceable supplier mass for each box issued to accepted products."
      unit: "kg"
      frequency: "each packaging specification change"
      temporal_coverage: "reporting year"
      site_scope: "reporting factory"
      aggregation_rule: "attributable corrugated box mass / accepted machines"
      quality_evidence: "packing record; supplier mass certificate"
  calculation_rules:
    - id: accepted_unit_average
      applies_to: "all inventory rows except finished_domestic_fan_or_hood"
      rule: "Per-machine amount = attributable batch amount divided by the count of accepted machines of the same configuration; deduct documented internal returns before division."
      inputs:
        - "attributable batch amount"
        - "accepted machine count"
      output: "per-machine exchange"
      source_ids:
        - swegon-casa-hood-epd-2022
  data_quality_requirements:
    - id: dq_bom
      applies_to: "all purchased materials and parts"
      requirement: "Reconcile the full model-specific bill of materials, including motors, electronics, filters, glass and packaging where present; add each missing exchange as a separate concrete flow before dataset release."
      evidence: "approved bill of materials; receiving records"
    - id: dq_route
      applies_to: "conditional fabrication and motor rows"
      requirement: "Demonstrate the actual site route and accepted configuration; document omitted conditional rows as absent, not zero by default."
      evidence: "routing sheet; product specification"
    - id: dq_mass
      applies_to: "reference product"
      requirement: "Verify M for the same accepted configuration and exclude transport packaging."
      evidence: "calibrated weighing and acceptance record"
    - id: dq_period
      applies_to: "all foreground quantities"
      requirement: "Use one reporting period and site; document any supplier or meter gaps and allocation drivers."
      evidence: "dated ledgers; meter logs; supplier statements"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Reject a dataset without a confirmed finished CPC 44815 product identity, one accepted configuration, measured net mass M in kg, and an output row of M kg."
    source_ids:
      - swegon-casa-hood-epd-2022
  - rule_id: validate_inventory
    applies_to: "foreground inventory"
    rule: "Check every included material, energy, packaging and waste stream against the model bill of materials and site route; preserve one atomic exchange per flow."
    source_ids:
      - swegon-casa-hood-epd-2022
      - eu-residential-ventilation-2009
  - rule_id: validate_balance
    applies_to: "fabrication and release"
    rule: "Reconcile material issue, internal return, finished-product mass and externally transferred scrap; explain residual differences without forcing a fixed yield."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for a complete domestic fan or hood at factory gate."
  downstream_use: "secondary_dataset; background_dataset for product-specific downstream process or lifecyclemodel."
  allowed_use: "Use only for the declared model/configuration, factory route, geography and reporting year, or disclose representativeness limits."
  excluded_use: "Do not infer use-stage performance, service life impacts or end-of-life from this factory-gate inventory."
  required_metadata: "Product kind; model; accepted M; motor configuration; airflow; ventilation/recirculation route; fabrication route; site; year; included packaging."
  required_quality_disclosure: "BOM completeness; meter and weighing evidence; allocation drivers; unresolved flow UUIDs; missing upstream datasets."
  update_trigger: "Model, motor, material, supplier, site, route, energy mix or packaging change."
