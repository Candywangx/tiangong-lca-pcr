allocation_rules:
  - rule_id: allocation_causal
    applies_to: "all processes"
    rule: "Separate configurations and actual processes first. Assign direct BOM, work orders and process meters; allocate only measured shared residual by documented causal driver such as process time/load. Accepted mass normalizes a fixed configuration; it does not justify mixing fan and hood models. Retain rejection/rework burdens."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "physical residue records"
    rule: "Measure segregated scrap and actual destination/provider. Internal recycling is paired transfer, not a new coproduct credit. Distinguish waste treatment from a genuine sold coproduct; justify any allocation and recycling convention, show pre-allocation balance, never assume avoided virgin material credit."
    source_ids: []
