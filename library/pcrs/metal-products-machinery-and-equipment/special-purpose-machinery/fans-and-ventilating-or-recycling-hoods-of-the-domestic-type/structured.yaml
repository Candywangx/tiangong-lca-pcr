        - bosch-hood
        - panasonic-abs-gf
    - rule_id: boundary_routes
      applies_to: "all processes"
      rule: "Select actual route without narrowing family: polymer or metal blade, stamped hood/canopy, axial or centrifugal impeller, guard/mount, own or bought AC/DC motor, oscillation/control, assembly/test and actual factory treatment. Air Multiplier still has a physical impeller; bladeless marketing does not remove that BOM. A hood needs its actual grease-filter technology; carbon filter enters manufacture only when actually supplied. Add every actual grade, additive, chemical, fuel, waste and species as its own atomic row."
      source_ids:
        - bosch-hood
        - panasonic-abs-gf
        - dyson-cf1
    - rule_id: boundary_downstream
      applies_to: "all processes"
      rule: "Factory acceptance electricity/airflow tests belong here; rated watts, household airflow, extracted kitchen vapours/grease and consumer filter washing/replacement belong to later use. No consumer captured residue is a default factory waste. Installation ducts beyond delivered BOM, operation and end of life remain outside gate; disclose capital/maintenance policy."
      source_ids:
        - bosch-hood
