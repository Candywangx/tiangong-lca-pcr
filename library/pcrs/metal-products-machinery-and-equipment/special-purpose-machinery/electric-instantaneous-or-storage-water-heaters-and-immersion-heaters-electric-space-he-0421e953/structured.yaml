system_boundary:
  rules:
    - rule_id: boundary_factory
      applies_to: "foreground"
      rule: "Include actual fabrication, coating/enamelling, polymer processing, heater or electronics manufacture, assembly, accepted and rejected test/rework loads, packaging and attributable services. Retain external upstream supply and waste treatment."
      source_ids:
        - rangemaster-quick-guide
    - rule_id: boundary_use
      applies_to: "factory versus use"
      rule: "Include factory electrical/pressure/cooking test energy and media; exclude customer heat generation, food/crop inputs and service life from this reference. Factory water drains are measured, not retained as sold heat or drinking water."
      source_ids: []
    - rule_id: boundary_uncertain
      applies_to: "hybrid and unusual architectures"
      rule: "Hold item-specific selection pending principal-function review; do not force omission, generic-reference substitution or a universal industrial classification. If confirmed in scope, add actual compressor, refrigerant and heat exchanger or other distinct modules as atomic exchanges."
