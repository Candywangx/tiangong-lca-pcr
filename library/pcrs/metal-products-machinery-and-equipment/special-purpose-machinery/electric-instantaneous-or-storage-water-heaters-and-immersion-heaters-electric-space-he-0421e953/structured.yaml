allocation_rules:
  - rule_id: allocation_direct
    applies_to: "factory outputs"
    rule: "Separate configuration-specific lines and meters first. Allocate remaining common loads using measured causal drivers such as occupied test time or machine cycle energy; document driver and period. Never average different apparatus configurations by unit count alone."
    source_ids: []
  - rule_id: allocation_reject
    applies_to: "rejects and rework"
    rule: "Accepted-product production carries attributable reject/rework/test burden. Scrap is a separate waste or evidenced co-product at its actual interface, not negative virgin metal or an automatic avoided-burden credit. Declare allocation method if a genuine saleable co-product exists."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "test"
      flow_role: "reference output"
      record_type: "foreground records"
      raw_fields: "model; configuration; serial number; accepted net mass M; accepted count N; calibration; acceptance date"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each lot and meter interval"
      temporal_coverage: "same complete reconciled production period"
      site_scope: "actual site and one configuration"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration, source records, sampling and uncertainty"
    - protocol_id: cp_exchange
      process_id: "all"
      flow_role: "physical exchanges"
      record_type: "foreground records"
      raw_fields: "lot; supplier; BOM line; grade; recipe; supplied state; gross/net mass; own assay; moisture; stocks; rejected quantity; return; upstream boundary"
      collection_method: "Reconcile calibrated scales, invoice/stock movement and complete supplier BOM; sample each physical material stream on its own basis. Record each actual unlisted atomic input/output separately."
      unit: "kg"
      frequency: "each lot and meter interval"
      temporal_coverage: "same complete reconciled production period"
      site_scope: "actual site and one configuration"
      aggregation_rule: "attributable exchange / accepted machines"
      quality_evidence: "calibration, source records, sampling and uncertainty"
    - protocol_id: cp_utility
      process_id: "all"
      flow_role: "electricity"
      record_type: "foreground records"
      raw_fields: "site import; generation; export; storage change; every process/test meter; meter units; calibration; period; voltage; provider; causal driver"
      collection_method: "Read synchronized calibrated site and submeter records; reconcile already assigned loads and allocate only unassigned residual. Investigate negative residuals against period, units and combined uncertainty; never clip them to zero."
      unit: "MJ"
      frequency: "each lot and meter interval"
      temporal_coverage: "same complete reconciled production period"
      site_scope: "actual site and one configuration"
      aggregation_rule: "attributable electricity / accepted machines"
      quality_evidence: "calibration, source records, sampling and uncertainty"
    - protocol_id: cp_water
      process_id: "all"
      flow_role: "water streams"
      record_type: "foreground records"
      raw_fields: "each volume; own temperature and density; each moisture; opening/closing stock; paired internal return; reaction water; evaporation; discharge; each stream assay"
      collection_method: "Measure all applicable water inputs and outlets with calibrated meters/scales and stream-specific sampling; close water including wet materials, reactions and inventories. Internal test recirculation is one paired transfer, not repeated purchase."
      unit: "kg"
      frequency: "each lot and meter interval"
      temporal_coverage: "same complete reconciled production period"
      site_scope: "actual site and one configuration"
      aggregation_rule: "attributable water exchange / accepted machines"
      quality_evidence: "calibration, source records, sampling and uncertainty"
    - protocol_id: cp_solvent
      process_id: "fabrication"
      flow_role: "acetone"
      record_type: "foreground records"
      raw_fields: "input purity; stocks; product retention; recovered solvent; capture-media mass and own loading; actual destruction; wastewater solvent; stack/fugitive species"
      collection_method: "Measure acetone on each own stream basis. Capture into carbon is not destruction; recovery and retained liquid/sludge are non-air destinations. Measure after-control stack acetone as its own concentration × synchronized matching dry/wet gas flow × sampling period, plus independently measured or reviewed fugitive release. Record gas basis, control outlet, units, calibration and uncertainty for each term; never label unexplained mass residual as air emissions."
      unit: "kg"
      frequency: "each lot and meter interval"
      temporal_coverage: "same complete reconciled production period"
      site_scope: "actual site and one configuration"
      aggregation_rule: "attributable solvent exchange / accepted machines"
      quality_evidence: "calibration, source records, sampling and uncertainty"
    - protocol_id: cp_heat
      process_id: "services"
      flow_role: "purchased heat"
      record_type: "foreground records"
      raw_fields: "supply mass; supply enthalpy; return mass; return enthalpy; common enthalpy datum; gross/net meter status; meter and allocation evidence"
      collection_method: "Meter supply and return independently: each own kg times own MJ/kg on a common datum. For gross imported heat subtract actual return energy once; retain certified net supplied heat without another return subtraction."
      unit: "MJ"
      frequency: "each lot and meter interval"
      temporal_coverage: "same complete reconciled production period"
      site_scope: "actual site and one configuration"
      aggregation_rule: "attributable heat / accepted machines"
      quality_evidence: "calibration, source records, sampling and uncertainty"
    - protocol_id: cp_fuel
      process_id: "services"
      flow_role: "natural gas"
      record_type: "foreground records"
      raw_fields: "fuel mass or metered volume; own pressure/temperature/density; composition; calorific basis; burner; control; stock"
      collection_method: "Record actual on-site combustion and fuel provider; purchased heat upstream fuel belongs in its supplier dataset. Preserve each fuel separately."
      unit: "kg"
      frequency: "each lot and meter interval"
      temporal_coverage: "same complete reconciled production period"
      site_scope: "actual site and one configuration"
      aggregation_rule: "attributable fuel / accepted machines"
      quality_evidence: "calibration, source records, sampling and uncertainty"
    - protocol_id: cp_emissions
      process_id: "all"
      flow_role: "species releases"
      record_type: "foreground records"
      raw_fields: "species; outlet/compartment; concentration; dry/wet gas flow; period; sampling; control; oxygen/reference corrections; species mass versus equivalent reporting; uncertainty"
      collection_method: "Use synchronized species-specific measured concentration and gas flow or independently reviewed route-specific evidence. Separate NO, NO2 and NOx-equivalent; carbon balance closes carbon but does not infer CO/NOx."
      unit: "kg"
      frequency: "each lot and meter interval"
      temporal_coverage: "same complete reconciled production period"
      site_scope: "actual site and one configuration"
      aggregation_rule: "attributable species release / accepted machines"
      quality_evidence: "calibration, source records, sampling and uncertainty"
    - protocol_id: cp_transport
      process_id: "dispatch"
      flow_role: "freight"
      record_type: "foreground records"
      raw_fields: "net shipped payload; each distance; truck; actual leg; load factor evidence; duplicate supplier transport boundary"
      collection_method: "Use actual shipping documentation and route distance, payload mass times distance; avoid a leg already included by supplier. Packaging transport mass is separate from net reference denominator."
      unit: "t·km"
      frequency: "each lot and meter interval"
      temporal_coverage: "same complete reconciled production period"
      site_scope: "actual site and one configuration"
      aggregation_rule: "attributable freight / accepted machines"
      quality_evidence: "calibration, source records, sampling and uncertainty"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: dq_period_normalization
      applies_to: "raw period collection and all applicable exchanges"
      requirement: "For the SAME configuration and reconciled period collect Qattr (each attributable exchange including reject/rework/test burden), Naccepted (accepted complete units) and Dnet (sum of calibrated accepted net masses). M = Dnet/Naccepted; q_item = Qattr/Naccepted; q_ref = Qattr/Dnet. Reject, packaging and test-water mass are excluded from Dnet. Retain raw Qattr native numerator units and exact conversions; never average across configurations."
      evidence: "synchronized meter/stock, calibrated serial-mass and acceptance records"
    - id: dq_configuration
      applies_to: "whole inventory"
      requirement: "Retain drawing/BOM/test/configuration linkage, complete make/buy ledger and actual grade/provider. No cross-configuration denominator."
      evidence: "acceptance and supplier records"
    - id: dq_uncertainty
      applies_to: "physical balances and utility residuals"
      requirement: "Investigate closure with actual combined measurement, sampling and allocation uncertainty. No universal tolerance, assumed yield or unmeasured loss-to-air. Match assays separately for product, scrap, slag, sludge, wastewater and release when present; account reactions/stocks and cancel paired internal transfers."
      evidence: "balance workbook and uncertainty budget"
    - id: dq_gaps
      applies_to: "identity and range gaps"
      requirement: "Specific chemical recipes, grades, bought module supply providers, wastes and elementary UUIDs remain unresolved until direct-read qualified. No empirical mass, factor or range is adopted. Conditional absence requires actual architecture evidence; unknown remains unknown."
      evidence: "qualified data and gap disclosure"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference identity"
    rule: "Confirm full product function and actual architecture; resolve uncertain industrial/hybrid principal-function assignment. Generic UUID does not prove every variant."
    source_ids:
      - unsd-cpc3-2025
      - stiebel-storage-hybrid
  - rule_id: validate_mass
    applies_to: "reference output"
    rule: "Validate calibrated accepted net masses and count in one configuration/period, output 1 kg, and all applicable exchange conversions; packaging/rejects excluded from denominator but their attributable burdens included."
    source_ids: []
  - rule_id: validate_routes
    applies_to: "make/buy and conditions"
    rule: "Trace all actual modules/grades/recipes and missing atomic cards. Complete purchased module and its embedded material/process burdens are counted once; actual other electrical architectures require review and collection, not silent exclusion."
    source_ids:
      - ti-induction-2013
      - tdk-ptc-2026
  - rule_id: validate_balances
    applies_to: "physical materials/water/solvent"
    rule: "Reconcile each own assay/density/moisture/reaction/stock and paired return. Include retained/recovered/captured/destroyed solvent and all non-air destinations; capture is not destruction and residual is not an emission. Investigate mismatch against measured combined uncertainty."
    source_ids: []
  - rule_id: validate_utilities
    applies_to: "all process and shared meters"
    rule: "Reconcile same-site-period purchased imports, generation, exports, storage and process/test loads. Residual-only services cannot add whole-site totals again. Heat gross/net status and independent own supply/return enthalpies must be documented."
    source_ids: []
  - rule_id: validate_species
    applies_to: "direct releases"
    rule: "Match species/compartment and controls; NOx-equivalent cannot masquerade as NO2 mass. CO and NOx require independent species evidence beyond fuel carbon. Missing identity, provider or amount blocks a complete concrete data package."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground equipment-production data package; process and lifecyclemodel are downstream projections"
  downstream_use: "secondary_dataset; background_dataset after qualified review"
  allowed_use: "Same specified apparatus/configuration, production route, supplier interface, site and period"
  excluded_use: "Generic use-phase heat/food service or lifetime comparisons; unsupported cross-route substitution"
  required_metadata: "All reference qualifiers; boundary/make-buy ledger; test/reject basis; upstream/waste providers; allocation; measurement records"
  required_quality_disclosure: "Candidate status; unresolved classifications, UUIDs, grade/recipe/provider and empirical ranges; conditional not-applicable evidence; combined uncertainty"
  update_trigger: "Design, mechanism, supplier grade/recipe, site, meter interface, test requirement or category evidence changes"
