measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete machine of the same configuration in kg; collect using cp_mass."
  - id: physical_species
    applies_to: "physical material and species records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Each material/species balance term uses its own composition, assay and wet/dry basis. Gross steel, solder or sludge mass is not contained Fe, Cu, Ni or solvent mass. Electricity and transport are outside this material-assay rule."
  - id: water_basis
    applies_to: "water-bearing physical records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert each measured water volume using its own temperature-dependent measured or documented density; retain input moisture, opening/closing stocks, evaporation, discharge and reaction water. Paired internal return transfers cancel once."
  - id: utility_basis
    applies_to: "energy records"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve meter units and conversion evidence, voltage, geography and supplier interface. Heat supply and return each use their own mass and specific enthalpy on one datum; subtract returns once only from a gross supply meter, never again from already-net heat."
  - id: emission_species
    applies_to: "direct elementary emissions"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Species, compartment and control outlet must match. NOx expressed as NO2-equivalent requires speciation or a matching reviewed NOx flow, not relabelling all as measured NO2. Fuel carbon alone cannot establish CO or NOx."
