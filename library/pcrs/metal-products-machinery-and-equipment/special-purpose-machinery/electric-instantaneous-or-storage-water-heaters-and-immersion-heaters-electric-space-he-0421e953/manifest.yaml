  unresolved_identity:
    - Specific supplier/grade/recipe/module/waste and elementary flow UUIDs require actual qualified direct read before data package completion; generic reference identity does not replace those interfaces.
    - Purchased electricity UUID is conditional on actual CN 1–35 kV consumption-to-user supply; other interfaces require their own qualified flow and provider.
  unresolved_ranges:
    - No numeric machine mass, recipe, yield, energy, emission, lifetime or empirical range is adopted; actual configuration-specific foreground distributions and uncertainties are required.
  unresolved_source_scope:
    - CPC3 original printed pages239–240 gives the complete44817title and domestic-electric parent without detailed leaf note. The PCR methodology conditionally covers industrial and light-commercial electric water, space, soil and cooking heating configurations beyond that domestic parent, so the classification reference is broader; this does not establish classification membership for those extensions. Industrial/commercial, microwave, heatpump or solar/indirect hybrid selection remains pending item-specific principal-function and boundary review.
    - Manufacturer originals support architecture and counterexamples only; actual material grades, PTC dopants, foam recipe, radiator oil formulation and module supply providers are not universal or finalized.
    - Infineon original acquisition returned empty202 response and is not evidence; local ST download returned challenge HTML and is not retained as a publisher PDF; actually inspected Texas Instruments SPRABT2 April2013 original PDF provides independent induction-architecture support.
  uuid_decisions:
    - cfcc8dd6-19dd-4174-95d3-7cccd44431c3 direct read confirms full44817finished manufactured at-plant Product flow, official bilingual baseName and reference Mass; generic family identity is adopted with actual configuration qualifiers.
    - 3d76981f-964a-4865-b588-0e067a2a1163 direct read confirms CN1–35kV consumption-to-user Product flow and energy reference; conditional use requires actual compatible supply provider.
    - Generic source-specific incineration or biomass generation is not adopted as factory purchased electricity; heater housing or element parts cannot replace the full finished reference output.
    - Actual bounded UUID search covers all74inventory cards through68distinct basic-identity queries; repeated compatible electricity and water identities reuse one direct read. Unmatched complete modules, chemicals, grades, waste destinations and species remain explicit collection gaps, never zero or exclusions.
    - Additional state100 native-Mass identities are conditionally adopted for ABS granulate, carbon black, polyether polyol, barium carbonate, supplied tap water, post-industrial steel scrap, China populated-board scrap, magnet wire, corrugated cardboard, LDPE foil and outside-air fossil CO2/CO, acetone and water vapour; actual supplier, composition and compartment must match. Purchased-heat UUID remains unresolved because the found sanitation/hot-water route and gross-calorific reference do not establish the actual factory supply interface.
    - Nichrome Carbon-content reference, contradictory steel/stainless/copper metadata, indoor emissions, long-term CO2, perfluorocyclopentene versus cyclopentane, pigment versus ceramic grade, mattress foam waste, OSB adhesive recipe and state20 pipeline gas are not forced into incompatible cards. Actual NO2 and NO cannot be replaced by nitrite, N2O or NOx-equivalent.
    - Wafer-production acetone is rejected for metal cleaning; accepted polyol route requires actual propylene-oxide block polymerization, cardboard requires matching C/E/F fiber≥80% recycled-containing construction, ABS procurement requires actual CN interface, and magnet wire requires independently verified copper/enamel composition.
