      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh as-delivered formulation or exported solution. Volume records require evidenced density, temperature and explicit conversion; concentrate, dilution water, retained fill and spent solution remain distinct."
  - id: groundwater_volume
