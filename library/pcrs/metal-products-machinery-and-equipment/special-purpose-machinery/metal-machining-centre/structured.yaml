  collection_protocols:
    - protocol_id: cp_mass
      process_id: "factory_test"
      flow_role: "finished_machine"
      record_type: "calibrated weighing and acceptance"
      raw_fields: "model; configuration; serial number; accepted net mass M; installed options; fluid/drain state; excluded spares/packaging"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each unit or justified configuration-specific sample"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration; installed BOM; fluid state; acceptance; sampling"
    - protocol_id: cp_configuration
      process_id: "all_processes"
      flow_role: "actual route"
      record_type: "BOM and route review"
      raw_fields: "model; axes; spindle; changer/magazine; BOM revision; supplier completeness; make-or-buy; work orders; rework; accepted count; gates"
      collection_method: "Crosswalk every actual item and operation to one row or justified exclusion. Reconcile installed options, blank or finished-base alternatives, included motors/drives and factory fluid condition. Record model-specific geometric and functional acceptance tolerances/results without assuming universal accuracy."
      unit: "record"
      frequency: "each configuration change and batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "one coherent configured route record"
      quality_evidence: "BOM; suppliers; routing; acceptance; outsourced gates"
    - protocol_id: cp_material
      process_id: "fabrication_finishing_assembly_factory_test_packout"
      flow_role: "individual stock/formulation"
      record_type: "stock issue and weighing"
      raw_fields: "single product; grade/state; formulation; issue/return; stock/WIP; volume/density/temperature; accepted count"
      collection_method: "Weigh net attributable issues and reconcile returns, WIP and recovery. Retain supplier blank treatment and coolant/oil formulation. Concentrate and dilution water are separate; ready-mixed fluid is not counted twice. Volume conversion needs actual evidenced density/temperature."
      unit: "kg"
      frequency: "each issue and batch balance"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable net material mass / accepted machines of the same configuration"
      quality_evidence: "scale; ledger; SDS; recipe; supplier declaration; density"
    - protocol_id: cp_parts
      process_id: "assembly"
      flow_role: "single finished component"
      record_type: "receipt/weighing/build list"
      raw_fields: "part number; one design; supplier; count; mass; included subparts; installed status; accepted count"
      collection_method: "Use actual delivered mass or verified lot-specific count-to-mass records. Identify complete spindle, changer, cabinet, pump, guide and axis interfaces, included motors/bearings and installed options; prevent duplicate stock or included internals. No power/travel/capacity-to-mass factor."
      unit: "kg"
      frequency: "each supply lot and build batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable installed component mass / accepted machines of the same configuration"
      quality_evidence: "scale; supplier inclusion; installed BOM; verified lot mass"
    - protocol_id: cp_tool
      process_id: "fabrication_factory_test"
      flow_role: "single carbide end mill"
      record_type: "tool replacement and serviced-order ledger"
      raw_fields: "one WC-Co design; measured replacement/consumption mass; reuse; orders served; causal cutting-work driver; accepted count"
      collection_method: "Track actual tool consumption across served work orders and allocate measured mass using an evidenced causal cutting-work driver. Reconcile reused tool stock, replaced exported tools and wear; no assumed wear factor or full new tool per machine."
      unit: "kg"
      frequency: "each replacement and serviced batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable tool consumption mass / accepted machines of the same configuration"
      quality_evidence: "tool scale; replacements; served orders; driver reconciliation"
    - protocol_id: cp_energy
      process_id: "fabrication_finishing_assembly_factory_test"
      flow_role: "electricity"
      record_type: "meter and causal driver ledger"
      raw_fields: "stage; voltage/source; meter kWh; interval; shared total; driver; idle/rework; accepted count"
      collection_method: "Meter each actual stage; convert kWh to MJ using 1 kWh = 3.6 MJ. Retain measured allocation-driver totals and reconcile shared meters, idle, rejected work and retests. Factory test duty is not customer use duty."
      unit: "MJ"
      frequency: "each meter interval and batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable electrical energy / accepted machines of the same configuration"
      quality_evidence: "calibration; bills; stage/driver records"
    - protocol_id: cp_waste
      process_id: "fabrication_finishing_factory_test"
      flow_role: "single exported waste"
      record_type: "container/weighbridge balance"
      raw_fields: "individual waste; composition; wet/dry; contamination; mass; recovery; receiver; accepted count"
      collection_method: "Weigh segregated exports and reconcile internal recovery and stock. Keep grey-iron chips, collected dust, clean steel offcuts, spent emulsion, spent oil and abrasive disc separate. Retain receiver/treatment evidence; volume-only waste records need evidenced mass conversion."
      unit: "kg"
      frequency: "each export and batch balance"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable exported waste mass / accepted machines of the same configuration"
      quality_evidence: "scale; composition; receiver receipts; treatment boundary"
    - protocol_id: cp_emission
      process_id: "fabrication"
      flow_role: "single air substance"
      record_type: "post-control outlet monitoring"
      raw_fields: "substance; composition; concentration/unit; exhaust volume; interval; moisture/temperature/pressure; control; size; medium/submedium; accepted count"
      collection_method: "Calculate one substance mass from post-control concentration and exhaust volume measured on the same interval, retaining conversion and sampling basis. Distinguish mineral oil from water aerosol, size fraction, collected solids and actual air subcompartment; no mandatory release or zero from missing monitoring."
      unit: "kg"
      frequency: "representative actual emitting intervals"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable measured substance mass / accepted machines of the same configuration"
      quality_evidence: "monitoring; calibration; sampling; speciation and conversion"
    - protocol_id: cp_water_resource
      process_id: "fabrication"
      flow_role: "groundwater abstraction"
      record_type: "well meter and site record"
      raw_fields: "well; freshwater origin; country/location; m3; interval; stage use; reuse; accepted count"
      collection_method: "Read calibrated well volume meter for actual factory freshwater groundwater abstraction. Reconcile stage withdrawals without treating recirculation as new abstraction; retain location and separately account for pumping/treatment."
      unit: "m3"
      frequency: "each interval and batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable abstracted water volume / accepted machines of the same configuration"
      quality_evidence: "meter; well/source; location; stage water balance"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "all inventory rows"
      requirement: "M, stock/component quantities, energy and accepted count share one configuration and period. Reconcile supplier inclusion, installed options, blanks versus bought structures, internal WIP, test stock, fill/drain, waste, rejects and returns. Retain instrument uncertainty and justified mass-sampling representativeness."
      evidence: "cp_mass; cp_configuration; cp_material; cp_parts; cp_waste"
    - id: quality_coverage
      applies_to: "inventory_and_links"
      requirement: "Disclose missing UUIDs, BOM items, foreground measurements, causal allocation and upstream/transport/treatment links. Report non-applicable operations with a route reason; missing data are not zero. No universal manufacturing amount, machine mass, lifetime, coolant ratio, chip yield or emission factor is adopted."
      evidence: "cp_configuration; cp_energy; cp_tool; cp_emission; cp_water_resource"
    - id: quality_sources
      applies_to: "design_evidence"
      requirement: "DMG MORI defines the category, not factory manufacturing quantities. The URL filename mentions2024 while verified PDF metadata indicates2023 creation; printed edition is not established. Haas November2013 sheet1 is a historical base-assembly example only, not proof of current BOM, alloy/treatment, universal hardware counts or production amounts. Verify actual suppliers and factory records."
      evidence: "dmg-machining-centre-whitepaper; haas-base-assembly-2013"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference_flow"
    rule: "Require positive measured M, one declared accepted configuration, retained-fill and installed-option boundary, and 1kg finished_machine. Every other row explicitly uses normalize_mass with its own kg, MJ or m3 numerator."
    source_ids: []
  - rule_id: validation_bom
    applies_to: "inventory"
    rule: "Reconcile the full actual base/column, spindle, axes, guide/table, changer/magazine, CNC/drives, guard/interlock and fluid systems. Verify make-or-buy, included subparts, actual acceptance, tool attribution, rejects/rework and receiver gates. Incomplete initial cards or missing links require disclosed expansion, never a completeness claim."
    source_ids: []
  - rule_id: validation_identity
    applies_to: "all inventory rows"
    rule: "Check public flow type, grade/state/concentration, geography/route, environmental medium/submedium, actual reference property/unit group and official localization. Keep collected oil waste separate from elementary oil mist, tap water from freshwater abstraction, and Aluminium content from total waste mass."
    source_ids: []
  - rule_id: validation_claims
    applies_to: "dataset_claims"
    rule: "No complete cradle-to-gate claim until supplier/transport/treatment and actual route coverage are established. Manufacturing mass cannot establish machining-service equivalence, customer part yield, lifetime, statutory compliance or scientific methodology approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured foreground metal machining-centre manufacturing module; this profile heading does not assert PCR publication"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same complete declared configuration manufacturing, scaled by measured M with separately disclosed supplier, transport and treatment links"
  excluded_use: "Customer machining service/part yield, use energy/coolant, maintenance, lifetime, transfer-line manufacture, separately delivered spare bundles or methodology approval"
  required_metadata: "All reference qualifiers; configuration/BOM; axes/spindle/changer/control; installed options; purchased assembly completeness; fluid/packaging/spare boundary; measured M; site/period/gates; acceptance; measurement/allocation; supplier/receiver links"
  required_quality_disclosure: "Sampling/measurement uncertainty; actual BOM/route coverage; unresolved identities, allocation and upstream; monitoring gaps; historical source limits; rejects/rework inclusion"
  update_trigger: "Axis/spindle/changer/control, supplier completeness, make-or-buy, alloy/treatment, option, fluid state, acceptance plan, site/period/route, energy source or allocation change"
