product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.special-purpose-machinery.metal-machining-centre"
  classification_refs: "CPC 3.0 44212; narrower candidate boundary; no accepted mapping asserted"
  covered_products: "Complete configured CNC metal machining centres with automatic tool changing"
  excluded_products: "Unit-construction/transfer machines; stand-alone mills, lathes, components and customer machining service"
  representative_product: "One declared vertical three-axis CNC centre; five-axis or horizontal variants require their own configuration and M"
  production_route: "Receipt and make-or-buy reconciliation; actual structural machining/cover fabrication; optional finishing; spindle/axis/tool-changer/CNC integration; geometric and functional acceptance; optional packout"
  market_state: "Accepted complete machine at declared factory gate with declared retained fluid and installed options"
functional_unit:
  what: "Manufacture one complete declared metal machining-centre configuration"
  how_much: "1 kg accepted net configured machine; measured M kg represents one actual machine"
  how_well: "Meet the actual model-specific dimensional/geometric, spindle/axis, tool-change, electrical, guarding and functional acceptance plan; retain tolerances and results, without universal accuracy or production-capacity thresholds"
  how_long_or_cycle: "One manufacturing delivery; no service life or operating cycle imposed"
  reference_flow_link: "finished_machine"
system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "manufacturing"
      rule: "Include receipt/configuration control, actual datum machining, sheet cutting/bending, actual joining/deburring/cleaning/coating, configured alignment and wiring, acceptance, attributable rework/rejects and packout. Purchasing stress-relieved castings does not establish an on-site foundry or heat-treatment furnace. If performed or outsourced, expand their specific flows and gates."
      source_ids: []
    - rule_id: boundary_bom
      applies_to: "all inventory rows"
      rule: "Crosswalk every actual BOM item and operation to one atomic exchange or justified exclusion. Add separate installed covers, seals, wipers, hoses, fittings, couplings, nuts/washers, cables, sensors, interlocks, filters, chip conveyor or rotary-axis modules where present. Add actual welding filler/gas, cleaners/rinse water, pneumatic air, hydraulic oil, grease, fuel, treatment chemicals and each waste/release as separate rows when used. Initial cards are conditional designs, not a universal complete BOM."
      source_ids: []
    - rule_id: boundary_test
      applies_to: "factory_test"
      rule: "Include actual geometry/positioning, spindle rotation, tool-change, controller/interlock and acceptance work with measured factory energy, fill/drain, test stock and waste. Record dry/wet proof-cut scope only if performed. Expand cutting-test chips and measured releases as distinct exchanges if generated. No customer workpiece production, idle-use profile, universal test duration or lifetime."
      source_ids: []
    - rule_id: boundary_semantic
      applies_to: "reference_product"
      rule: "At least three CNC axes plus automatic tool changing and magazine distinguish the selected machining-centre boundary. Existing drilling/boring/milling and lathe PCRs exclude this centre boundary. Do not normalize an entire transfer line or robot cell by one machine M."
      source_ids:
        - dmg-machining-centre-whitepaper
boundary_abstraction:
  declared_starting_condition: "Specified stock/blanks and separately specified finished assemblies received at the machine factory"
  starting_condition_role: "Foreground manufacturing-module inputs, with supplier production and incoming transport separately linked"
  product_classification_scope: "Machining-centre subset of CPC44212; excludes unit-construction and transfer machines"
  recursive_input_rule: "A purchased complete machining centre is supplier-gated input, not a repeated factory module. Bought finished base, spindle or cabinet replaces its local blank/component manufacture"
  upstream_dataset_requirement: "Match grade, blank treatment, component completeness, coolant chemistry/state, voltage/source, geography, transport and waste-treatment gates; disclose unlinked activities"
  disclosure: "Foreground manufacture alone is not complete cradle-to-gate. Declare actual operations, make-or-buy alternatives, outsourced gates, overhead attribution, packaging and missing upstream/transport/treatment links"
