allocation_rules:
  - rule_id: allocation_direct
    applies_to: "shared_operations"
    rule: "Subdivide by actual work order, stage and configuration first. Assign traceable component/stock issues, machining, rework and acceptance directly. Three-axis and five-axis configurations cannot share an assumed per-machine quantity."
    source_ids: []
  - rule_id: allocation_physical
    applies_to: "shared_energy_tools_support"
    rule: "Collect a causal physical driver from measured records: actual power profile with machining/assembly/test hours, tool cutting-work served, curing-batch load or coolant change/use. Reconcile assignments to measured shared totals and accepted configuration counts. Unsupported drivers remain unresolved with sensitivity; no generic mass split, equal-count split or economic percentage."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "waste_and_rework"
    rule: "Include attributable rejected parts, failed tests and rework in quantities per accepted same-configuration output and period. Net internal stock returns/recovery. Classify exported scrap and receiver treatment explicitly without automatic avoided-primary-metal credits. Genuine co-products require documented market and boundary decisions, not scrap presence alone."
    source_ids: []
