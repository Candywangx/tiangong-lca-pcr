measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete machine of the same configuration in kg; collect using cp_mass."
  - id: electricity_energy
    applies_to: "electricity_fabrication; electricity_finishing; electricity_assembly; electricity_factory_test"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain metered kWh and the exact conversion 1 kWh = 3.6 MJ. Match supply below1kV and grid-average sourcing; electricity is not mass."
  - id: liquid_mass
    applies_to: "coolant_concentrate_fabrication; coolant_concentrate_factory_test; tap_water_fabrication; tap_water_factory_test; guideway_oil; spent_emulsion_fabrication; spent_emulsion_factory_test; spent_guideway_oil"
