    evidence_needs:
      - Actual configured manufacturing quantities, positive measured M,
        supplier completeness/grades and treatment, coolant recipes, tool
        consumption, causal allocation and monitoring must come from foreground
        records. Design originals do not provide manufacturing factors.
      - Reconcile full actual BOM/routes and upstream, incoming transport and
        receiver treatment before complete cradle-to-gate claims. Haas2013 is a
        historical assembly illustration only; DMG printed edition is not
        established.
