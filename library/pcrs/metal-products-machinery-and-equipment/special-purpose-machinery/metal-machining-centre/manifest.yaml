review_metadata:
  semantic_boundary_decision: "Narrower CNC metal machining-centre boundary: at
    least three controlled axes with automatic tool changer and magazine,
    excluding single-station unit-construction and multi-station transfer
    machines. Existing material drilling/boring/milling and lathe PCRs
    explicitly exclude this machining-centre boundary. New semantic identity;
    old CPC44212 scaffold and retired id remain read-only. No classification
    mapping acceptance asserted."
  scientific_review: pending independent methodology review
