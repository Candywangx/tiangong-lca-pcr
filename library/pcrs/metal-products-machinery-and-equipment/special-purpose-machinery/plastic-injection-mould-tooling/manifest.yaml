review_metadata:
  semantic_boundary_decision: "Narrower CPC44916 boundary: new complete configured
    steel thermoplastic injection moulds, one fixed/moving-half set;
    conventional inserts/cold runner, installed hot runner conditional. Excludes
    standalone bases/inserts/spares, other mould technologies/material routes,
    aluminium/additive routes, refurbishment, injection machines and customer
    part production/use. Existing metal-machining-centre owns delivered machines
    and excludes custom-part manufacturing; agricultural-plough mouldboard is
    different. No existing material record covers this complete mould in
    baseline. Old scaffold/id read-only; no mapping acceptance asserted."
  scientific_review: pending independent methodology review
  unresolved:
    inventory_flow_uuids:
      - row_id: p20_stock
        reason_code: identity_not_established
        explanation: Generic steel, conflicting bilingual rolled-product candidates and
          not-further-worked alloy bars do not establish certified P20
          prehardening and block delivery state.
      - row_id: h13_stock
        reason_code: identity_not_established
        explanation: Bounded H13/tool-steel searches did not establish the specified
          annealed grade/block state; carbon steel and high-speed steel are
          different.
      - row_id: oily_p20_chips
        reason_code: identity_not_established
        explanation: 7f46756b explicitly specifies clean machining scrap; it cannot
          identify this oil-contaminated export.
      - row_id: copper_electrode
        reason_code: identity_not_established
        explanation: Cathode/electrodeposited copper is refinery stock, not a delivered
          shaped sinker-EDM electrode; no compatible finished design
          established.
      - row_id: graphite_electrode
        reason_code: identity_not_established
        explanation: 51fda92d specifies mechanically recycled EAF steelmaking
          electrodes, not this shaped fine-grain EDM electrode; battery graphite
          and primary graphite are not substitutes.
      - row_id: brass_wire
        reason_code: identity_not_established
        explanation: e422cfbf is classified as copper bars/rods/profiles, not electrode
          wire; steel wire and copper foil cannot identify uncoated brass EDM
          wire.
      - row_id: dielectric
        reason_code: identity_not_established
        explanation: Insulation-oil candidate describes electrical-equipment insulation
          and does not establish the actual EDM formulation/flash-point/delivery
          state.
      - row_id: filter
        reason_code: identity_not_established
        explanation: No compatible finished cellulose EDM oil-filter cartridge
          established; generic paper, fuel cartridges and whole filters do not
          prove design.
      - row_id: spent_dielectric
        reason_code: identity_not_established
        explanation: No contained EDM mineral-oil dielectric Waste identity established;
          waste cutting-fluid and contamination-site oil sludge have different
          routes/composition.
      - row_id: spent_edm_water
        reason_code: identity_not_established
        explanation: No compatible contained wire-EDM water export to off-site treatment
          established; elemental/resource water and oil waste do not identify
          this solution.
      - row_id: spent_filter
        reason_code: identity_not_established
        explanation: No spent cellulose EDM oil filter with retained oil/metal
          contamination Waste identity established.
      - row_id: nitrogen
        reason_code: identity_not_established
        explanation: English and Chinese searches returned liquid nitrogen or elementary
          N2/N2O, not verified supplied gaseous nitrogen at the intended
          technosphere gate.
      - row_id: diamond_paste
        reason_code: identity_not_established
        explanation: Bounded searches did not establish the specified
          diamond/mineral-oil formulated paste concentration and delivery state;
          raw diamond is not paste.
      - row_id: abrasive_disc
        reason_code: identity_not_established
        explanation: No specific finished aluminium-oxide disc established; raw alumina
          and generic abrasive tools are not this design.
      - row_id: captured_dust
        reason_code: identity_not_established
        explanation: No matching contained tool-steel polishing-dust Waste identity
          established; airborne particulate cannot identify the collected waste.
