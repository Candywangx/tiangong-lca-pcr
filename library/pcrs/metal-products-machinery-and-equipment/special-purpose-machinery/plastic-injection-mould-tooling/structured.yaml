functional_unit:
  what: "Manufacture one declared complete steel thermoplastic injection-mould configuration"
  how_much: "1 kg accepted net complete mould; one complete unit is represented by its physically measured M kg"
  how_well: "Meet the actual drawing-specific dimensional, parting/ejection/assembly, cooling leak and applicable hot-runner electrical and tryout acceptance plan. Record actual criteria/results; no universal hardness, roughness, pressure or shot count"
  how_long_or_cycle: "One manufacturing delivery; no customer moulding cycle or lifetime inferred"
  reference_flow_link: "finished_mould"
system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "manufacturing"
      rule: "Include actual receipt inspection, sawing/milling/drilling, conditional sinker/wire EDM, grade-specific heat treatment and surface finishing, dimensional checks, fitting, guiding/ejector/cooling/gate assembly, applicable electrical and leak checks, actual factory tryout, acceptance and attributable rejects/rework. Prehardened stock does not force heat treatment; the supplier delivery state controls the local route. Expand actual washing, solvent/coating, corrosion protection, local electrode making, pumping/deionisation or outsourced service exchanges if present before coverage claims. Initial cards are not a universal BOM."
      source_ids:
        - uddeholm-plastic-moulding-2021
    - rule_id: boundary_tryout
      applies_to: "tryout"
      rule: "Acceptance remains required, but physical injection tryout is included only as actually performed. Record press/tool/resin identity, measured feed/energy, cycle count, sample/runner/reject exports, recovered resin and cooling water. Customer production trials after the declared gate are outside. Trial samples are separate outputs; their polymer is never mould mass. No fixed shot count, resin dose or mould lifetime adopted."
      source_ids: []
    - rule_id: boundary_semantic
      applies_to: "reference_product"
      rule: "Existing metal-machining-centre methodology covers the delivered machine and excludes custom-part manufacture. Mouldboard wording in agricultural ploughs refers to a plough component, not injection moulds. No existing material PCR in this baseline covers this complete mould boundary. Keep old classification scaffold/id read-only; this record does not assert mapping acceptance."
      source_ids: []
