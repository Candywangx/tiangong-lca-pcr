allocation_rules:
  - rule_id: allocation_causal
    applies_to: "shared_operations"
    rule: "Separate orders/routes by direct measurement first. Reconcile shared measured CNC/EDM/finishing and assembly/tryout utility totals using actual stage time/load and material issues with documented causal drivers, including idle, rejects and rework. For a real thermal batch, record loaded steel mass, grade/recipe and actual furnace cycle; justify allocation to served orders, not a universal furnace factor. Report uncertainty and sensitivity where the driver is imperfect."
    source_ids: []
  - rule_id: allocation_trial
    applies_to: "tryout"
    rule: "Actual acceptance tryout belongs to this mould manufacturing order. Track samples, runner/reject waste, recovered resin and cooling-fluid reuse separately; no automatic commercial co-product or avoided-polymer credit. If samples have a real commercial function, declare the changed multi-output boundary and evidence-based allocation before use. Reusable electrodes/filter life and retained fluid are attributed from actual replacement/served-order records, not one full item consumed per mould."
    source_ids: []
  - rule_id: allocation_balance
    applies_to: "manufacturing_batch"
    rule: "Reconcile received stock, finished installed mass, exports, WIP and internal recovery for the same period/configuration. Attribute rework/reject burden to accepted complete units. Scrap exits at its recorded receiver gate; no automatic substitution credit, equal-per-unit or sales-value allocation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "tryout"
      flow_role: "reference_product"
      record_type: "calibrated net weighing"
      raw_fields: "serial; configuration; accepted net mass M; both halves/options; scale/tare; acceptance; drained state; excluded packaging"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each complete accepted configuration"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared tooling manufacturing site"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "scale calibration; net weigh ticket; complete-set acceptance"
    - protocol_id: cp_configuration
      process_id: "assembly_tryout"
      flow_role: "configuration"
      record_type: "drawing/BOM and route ledger"
      raw_fields: "serial; cavity/core/base; grade/heat certificates; cavity count; guidance/ejection/cooling/gate; runner/options; make-or-buy; actual finish/acceptance; site/period"
      collection_method: "Crosswalk every actual drawing/BOM item and operation to an atomic exchange or justified exclusion. Verify supplier internals and the complete fixed/moving-half set, not brochure component counts. Record actual tolerances, hardness/surface and test results without universal thresholds."
      unit: "kg"
      frequency: "each drawing/build revision"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared tooling manufacturing site"
      aggregation_rule: "one traceable complete configuration"
      quality_evidence: "drawing; certificates; signed routing/BOM and inspection"
    - protocol_id: cp_material
      process_id: "machining_edm_thermal_finishing_assembly_tryout_packout"
      flow_role: "individual stock/consumable"
      record_type: "net issues and weighing"
      raw_fields: "one material/design; grade/state/formulation; delivered mass; issues/returns; reuse; density/temperature/pressure if volume; served orders; accepted count"
      collection_method: "Weigh actual net stock, fluids, electrodes, abrasive, grease, resin and protection separately. Record composition/state and actual reuse/replacement. Convert volume only with actual evidenced density/conditions; exclude constituents of bought mixtures. Trial resin feed and returned material are measured, not inferred from shots."
      unit: "kg"
      frequency: "each issue/return and production batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared tooling manufacturing site"
      aggregation_rule: "attributable net material mass / accepted units of the same configuration"
      quality_evidence: "scale; certificates/SDS; inventory and served-order ledger"
    - protocol_id: cp_parts
      process_id: "assembly"
      flow_role: "individual installed component"
      record_type: "weighing and supplier completeness"
      raw_fields: "part/design; steel state; mass; supplier-included internals; installed count; accepted count; CNC-only route if selected"
      collection_method: "Weigh supplied finished components or verify actual lot-specific part mass/count records. Reconcile base, separate CNC inserts, guidance/ejection, seals/cooling, gate and installed hot runner. Exclude parts included in purchased assemblies and local WIP; no standard catalogue component-mass factor."
      unit: "kg"
      frequency: "each supplied lot and build batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared tooling manufacturing site"
      aggregation_rule: "attributable installed component mass / accepted units of the same configuration"
      quality_evidence: "scale; supplier boundary; part certificates and actual BOM"
    - protocol_id: cp_energy
      process_id: "machining_edm_thermal_finishing_assembly_tryout"
      flow_role: "electricity"
      record_type: "meter and causal-driver ledger"
      raw_fields: "stage; source/voltage; metered kWh; interval; shared total; actual load/time; idle/rework; accepted count"
      collection_method: "Meter actual stages and press/tool tryout only as performed. Convert1 kWh =3.6 MJ. Attribute shared totals with measured causal drivers and reconcile idle/rework/rejects. Rated power or supplier machining-time examples are not energy quantities."
      unit: "MJ"
      frequency: "each actual stage interval/batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared tooling manufacturing site"
      aggregation_rule: "attributable electrical energy / accepted units of the same configuration"
      quality_evidence: "meter calibration; bills; stage/load allocation records"
    - protocol_id: cp_waste
      process_id: "machining_edm_finishing_tryout"
      flow_role: "individual exported waste"
      record_type: "segregated weighing and receiver receipts"
      raw_fields: "one waste; alloy/composition; wet/dry; oil/water contamination; exported mass; internal recovery; receiver/treatment; accepted count"
      collection_method: "Weigh each actual alloy offcut, clean/oily chip, spent fluid/filter/disc, captured dust, PP runner/reject and contained test water separately. Retain actual concentration/contamination and treatment gate. Clean-chip identity excludes oily chips; selected PP waste requires mechanical-recycling receiver. Reuse is not export; measured direct discharge needs individual species/medium expansion."
      unit: "kg"
      frequency: "each export and reconciled batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared tooling manufacturing site"
      aggregation_rule: "attributable exported waste mass / accepted units of the same configuration"
      quality_evidence: "scale; composition; receiver/treatment receipts"
    - protocol_id: cp_emission
      process_id: "finishing"
      flow_role: "single air particulate"
      record_type: "post-control monitoring"
      raw_fields: "substance; medium/submedium; particle size; concentration; exhaust volume; sampling basis; interval; background; accepted count"
      collection_method: "Only actual post-control emitted particulate: pair mass concentration and exhaust volume on the same sampling basis, with corrections and uncertainty. Confirm unspecified size/air medium for this UUID. Captured dust is not emission. Expand a specific fraction or other measured substance separately; no mandatory release factor."
      unit: "kg"
      frequency: "representative actual emitting intervals"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared tooling manufacturing site"
      aggregation_rule: "attributable measured particulate mass / accepted units of the same configuration"
      quality_evidence: "monitoring; sampler/flow calibration; medium and size evidence"
    - protocol_id: cp_water_resource
      process_id: "machining"
      flow_role: "groundwater"
      record_type: "well meter and source record"
      raw_fields: "aquifer renewability/freshwater; site/country; m3; interval; pumping/treatment; stage use/reuse; accepted count"
      collection_method: "Meter actual renewable freshwater groundwater at the factory; verify aquifer qualification and separately expand pumping/treatment. Internal circulation is not abstraction; the same water cannot also be a tap-water purchase."
      unit: "m3"
      frequency: "each metered interval/batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared tooling manufacturing site"
      aggregation_rule: "attributable abstracted water volume / accepted units of the same configuration"
      quality_evidence: "meter; aquifer/site record; stage water balance"
    - protocol_id: cp_trial_output
      process_id: "tryout"
      flow_role: "one actual PP acceptance-sample output"
      record_type: "separate weighing and disposition"
      raw_fields: "sample shape/resin grade; batch; actual exported kg; retained samples; runner/reject separation; receiver; accepted count"
      collection_method: "Weigh the single specified acceptance-sample product leaving this module; record actual customer/inspection/archive gate. Retained sample WIP and exported PP waste are separate. No sample mass is included in mould M and no commercial output function is inferred."
      unit: "kg"
      frequency: "each actual acceptance-sample export"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared tooling manufacturing site"
      aggregation_rule: "attributable exported sample mass / accepted units of the same configuration"
      quality_evidence: "scale; resin/sample identity; acceptance and disposition record"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "all inventory rows"
      requirement: "Use identical configuration, period and accepted count for positive measured M and exchange numerators. Reconcile fixed/moving halves, installed inserts/runner/options, supplied internals and make-or-buy. Retain grade/state, actual finish/acceptance, trial feeds/samples/recovery, drained delivery and uncertainty."
      evidence: "cp_configuration; cp_mass; cp_parts; cp_material; cp_trial_output"
    - id: quality_coverage
      applies_to: "inventory_and_links"
      requirement: "Disclose missing BOM items/routes, measurements, UUIDs and supplier/transport/treatment links. Site evidence controls optional EDM/thermal/finishing/physical tryout. No universal material grade, machining yield, heat recipe, resin dose, shot count, emission or lifetime factor."
      evidence: "cp_configuration; cp_energy; cp_waste; cp_emission; cp_water_resource"
    - id: quality_sources
      applies_to: "design_evidence"
      requirement: "Uddeholm Edition17 March2021 pp.10–12 provides historical supplier-grade machining/thermal/finishing examples, not current universal prescriptions. HASCO undated one-page poster shows one two-cavity hot-runner tool; PDF creation metadata is not publication date. Neither fixes actual BOM quantities, steel chemistry, required hot runner, measured M or life."
      evidence: "uddeholm-plastic-moulding-2021; hasco-injection-mould-nut"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference_flow"
    rule: "Require one complete fixed/moving-half configuration, positive physically measured M in kg and cp_mass weighing/acceptance record. Reference output is1kg; normalize every other kg, MJ or m3 exchange using normalize_mass. Keep drained-state and delivery exclusions explicit."
    source_ids: []
  - rule_id: validation_bom
    applies_to: "inventory"
    rule: "Check every actual steel stock or finished base/insert, guide/ejector, cooling/seal/gating and installed hot-runner item against BOM and route records. Check local/bought alternatives, exact CNC-only selected route, fluid/electrode reuse, sample/waste balances, rejects/rework and receiver gates. Expand absent actual cards before asserting complete coverage."
    source_ids: []
  - rule_id: validation_identity
    applies_to: "all inventory rows"
    rule: "Verify public flow type, grade/formulation, reference property/unit group, actual state/route/completeness and official localized name. Clean chips exclude oily chips; graphite steelmaking electrodes exclude EDM electrodes; liquid nitrogen excludes gaseous product. Groundwater resource, purchased process water and contained wastewater are distinct. Air particulate is not captured dust."
    source_ids: []
  - rule_id: validation_claims
    applies_to: "dataset_claims"
    rule: "No complete cradle-to-gate claim without actual route and linked supplier/transport/receiver coverage. Tool manufacturing mass does not prove cavity throughput, plastic-part equivalence, lifetime, regulatory conformity or methodology approval. Independent scientific review remains pending."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured foreground complete steel plastic-injection mould manufacturing module; heading does not assert publication"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same complete configured tooling manufacture scaled by measured M; linked upstream/transport/treatment separately disclosed"
  excluded_use: "Customer plastic-part manufacture, use/lifetime, standalone components, other mould technologies/material routes and methodology approval"
  required_metadata: "All reference qualifiers; drawing/BOM/cavity/runner revision; steel certificates/heat states; actual make-or-buy and supplied internals; EDM/thermal/finish/tryout routes; measured complete-set M and delivery exclusions; actual criteria/results; trial resin/sample/waste/recovery; site/period/gates, causal allocation and linked suppliers/receivers"
  required_quality_disclosure: "Missing identities/measurements/BOM/routes/links; uncertainty, actual reuse/rejects/rework, allocation and historical/undated source limitations"
  update_trigger: "Tool/cavity/runner/BOM, steel delivery state, supplier completeness, machining/EDM/thermal/finish route, make-or-buy, tryout/acceptance, site/period, reuse or allocation change"
data_sources:
  - id: "uddeholm-plastic-moulding-2021"
    type: "handbook"
    reference: "Uddeholm, TOOL STEELS FOR PLASTIC MOULDING, Edition17,03.2021 (edition statement physical p.2); physical/printed pp.10–12. https://www.uddeholm.com/app/uploads/sites/230/2024/05/Tech-Uddeholm-Steel-for-moulds-EN-1.pdf"
    used_for: "Historical manufacturer-grade delivery/machining choice, prehardened versus soft-annealed thermal distinction, finish dependence and conditional EDM surface effects. Wire-EDM example concerns extrusion dies, not proof every injection mould needs wire EDM. No temperatures, hardness, distortion, costs, processing quantities, net mould mass or life adopted. URL folder date is not edition date."
  - id: "hasco-injection-mould-nut"
    type: "handbook"
    reference: "HASCO, 2-cavity injection moulding tool “Nut”, undated one-page annotated poster, physical p.1 (unnumbered). https://media.hasco.com/marketing/Content/Mediathek/Poster/Form/Form_POST_EN.pdf"
    used_for: "One specific fixed/moving-half, guide/ejector/base and hot-runner component example. Used to identify configuration questions, not universal BOM counts/chemistries, mandatory hot runner, factory inputs, mould mass or life. PDF creation metadata2022 is not asserted as publication year."
