    applies_to: "delivery configuration"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Include both mould halves, specified inserts and installed options plus retained delivery lubrication in drained state. Exclude packaging, transport braces/fixtures, removable trial couplings, samples/polymer/test water and separate spares/controllers. If dispatched apart, retain the original accepted complete-set weighing and traceable identity of every included half/part; shipping weights and catalogue masses cannot replace net weighing."
  - id: electricity_energy
    applies_to: "electricity_machining; electricity_edm; electricity_thermal; electricity_finishing; electricity_assembly; electricity_tryout"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain metered kWh; convert1 kWh =3.6 MJ. Record source/voltage, stage and actual time/load. Rated press power or invented machining hours cannot establish factory consumption."
  - id: fluid_mass
    applies_to: "coolant; dielectric; nitrogen; diwater; tap_water_machining; tap_water_tryout; spent_emulsion; spent_dielectric; spent_edm_water; test_wastewater"
