  reference_flow_identity:
    status: unresolved
    unresolved_support_fields:
      - reference_product_flow_uuid
  unresolved_reference_flow_uuid: Full residual category product flow unresolved after direct searches; EoL batteries, adjacent household categories and hand-operated articles rejected. Mass property and kg support verified; one vacuum is not a category proxy.
  unresolved_inventory_uuids: Only explicit UUID-bearing cards have adopted direct-read identities. All other searched cards retain actual unmatched grade, delivered-state, chemistry, property, treatment or compartment gaps; no missing identity forces category exclusion.
  unresolved_battery_chemistry: Dyson V11 source does not state chemistry. Philips S7885/50 states Li-ion but not subchemistry. Obtain actual pack/cell specification and provider; unknown does not mean absent or NMC.
  unresolved_factory_recipe_and_provider: Sources describe product architecture, not factory recipes. Actual BOM make/buy, grade/formulation, acceptance tests, supplier interface/geography, energy delivery and treatment remain foreground collection requirements.
  unresolved_quantitative_ranges: No source model weight, nominal power, shipping weight, consumer water/electricity, performance, lifetime, factory yield or energy factor is adopted as a production default.
  unresolved_source_access: Initial hairdryer and Braun catalogue URLs returned404; initial disposer URL returned HTML and product403. Only inspected alternative originals retained. Coffee water-flow control does not prove pump design; full architecture range requires actual configuration records.
  identity_rejections:
    - PC and ABS are separate source construction entries, not proof of PC/ABS blend.
    - Waste battery, hand-operated articles and washing/refrigeration/sewing categories are not category output.
    - German35–330kV power is wrong generic factory delivery interface and contains account/publication conflicts. Chinese customer-side medium-voltage grid identity is conditional on actual 1–35kV delivery/provider/year; it is not an all-site default.
    - Heater/cartridge candidates use CTUe, nichrome carbon-content, mains cable/NiMH NCV, and gas state20 or GCV-only/project-specific references; these do not establish the authored interface. A verified same gas with a Volume reference may use native m3 and its own supported state-specific conversion, never a universal density.
    - Steel and stainless candidates have contradictory bilingual names; only the independently read further-worked flat stainless card is adopted under its actual supplied-state condition.
    - Printer/toy motor, manganese-slag wastewater, mixed precision-balance scrap, camera insert and specific Jiangsu fuel/steam examples do not establish this factory interface.
    - Cotton candidate is labelled water-treatment chemical; generic plastic film is not a finished PE bag; cardboard sheet is not a finished box; raw mica is not a finished insulation sheet.
    - NO2 searches returned nitrite; preserve exact NO2 identity gap. IPA indoor and water/freshwater or CO/soil identities rejected in favor of actually read unspecified-air species.
    - Source-specific incineration power, transmission services and US point-of-use pump-and-treat flow do not establish universal factory power.
