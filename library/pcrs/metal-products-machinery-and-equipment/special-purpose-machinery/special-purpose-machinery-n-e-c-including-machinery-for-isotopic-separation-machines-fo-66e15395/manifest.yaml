  unresolved_inventory_uuids: Bounded actual identity queries do not establish a compatible whole-category finished reference or every specific grade/completion/interface/receiver. Intermediate modules, mismatched bilingual identities, unpublished fuel, lamp-fitting versus empty envelope and wafer-specific waste are not substitutes. Unknown is not absent or zero.
  unresolved_factory_recipe: Manufacturer architecture and observed constructions do not establish a universal BOM, glass/lamp/rope recipe, machine net mass, power-hours, throughput, lifetime, test consumption or isotope separation parameters. Actual factory records required.
  unresolved_category_cases: Complete isotopic separation, glass-envelope lamp assembly, glass/glassware manufacturing and rope/cable-making machines; other residual machines only after actual function and no more-specific category review. Independent parts, utilities, furnaces, cold-working glass machines and textile braiding require individual boundary review.
