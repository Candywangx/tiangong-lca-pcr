          description: "Only actual independently measured nickel to air after configured local controls, CAS/species/origin and ordinary unspecified-air compartment matched to concentration × simultaneous flow/time with state/unit correction plus fugitives. Captured sludge/wastewater/stocks and unexplained residuals are non-air. Own contained element differs from gross oxide/salt/alloy. Generic metal-and-ion flow requires preference for separately matched individual species when the actual LCIA method differentiates them."
          amount:
            expression: "Measured attributable native-unit amount divided by accepted configured-part net mass."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "process_output"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_emissions
              source_ids: []
            ranges: []
allocation_rules:
  - rule_id: allocate_configuration
    applies_to: "foreground_burden_allocation"
    rule: "Separate actual configurations/site/process meters first. Allocate common-period residual by measured causal service demand or work, not catalogue food throughput. Include attributable failed trials/rework/rejects in accepted-part burdens. Cancel paired internal transfers; disclose reusable returned test food, saleable co-products and receiver allocation/treatment without invented avoided burdens."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "accepted part"
      record_type: "foreground_record"
      raw_fields: "model/configuration/serial; net mass; Naccepted; Dnet; included hardware/fills; excluded packing/spares"
      collection_method: "Calibrated traceable weighings reconcile accepted complete parts with actual order/BOM within one configuration/period. Sum accepted net mass excluding packing/spare stock/rejects/consumed trials. Include only actually retained shipped fill."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_materials
      process_id: "fabrication"
      flow_role: "local stock and chemical ingredients"
      record_type: "foreground_record"
      raw_fields: "Qattr; own gross mass/assay/moisture/density; alloy/formulation; stocks/returns/reactions/retained parts; actual local route"
      collection_method: "Weigh actual supplied stock and each local finishing/joining/cleaning ingredient; reconcile own-stream element/moisture/chemical contents with retained hardware, reaction products, baths/recovery/waste/stocks/returns. Actual surface alloy or sanitary approval is specific to the contacted part, never every frame. Embedded complete-module materials stay upstream once."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_modules
      process_id: "assembly"
      flow_role: "completed hardware and retained fill"
      record_type: "foreground_record"
      raw_fields: "Qattr; BOM/completion/options; hardware mass/length; separate fill formula/assay/T/P/density; receipts/installed/returns/stocks"
      collection_method: "Hardware branch weighs actual completed received/installed/returned assemblies and cable lengths, documenting remaining local work. Chemical branch independently measures local fill/lubricant/gas in its own native units and own composition/moisture/T/P/density, stocks/reactions/retention/returns. Complete bought modules embed their chemicals upstream once; whole hardware mass never substitutes chemical amount. First retained supply fill is distinct from trial consumption and customer maintenance."
      unit: "native unit"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_tests
      process_id: "test"
      flow_role: "observed factory trial media"
      record_type: "foreground_record"
      raw_fields: "Qattr; actual acceptance order/trial/repeat/reject; water/food/gas receipts; own composition/state; returned/reused/sold/discarded stocks"
      collection_method: "Meter actual attributed factory tests and repeated/failed trials, using each food/chemical/water/gas own measured amount and composition. Record returned/reused/recovered and saleable food independently, never as disappearance. Exclude normal customer production, catalogue recipe/capacity, R&D demonstrations or customer commissioning unless an explicit declared manufacturing attribution is evidenced."
      unit: "native unit"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_utilities
      process_id: "services"
      flow_role: "each unassigned utility"
      record_type: "foreground_record"
      raw_fields: "Qattr; common period/site/import/self-generation/export/storage; assigned meters; gross/net heat datum; independent return; T/P/humidity/density"
      collection_method: "Reconcile each common-period imported and actually generated utility minus exports/storage with assigned local/test meters; allocate only residual once. Cable/energy/volume units remain native. Gross heat deducts separately measured same-datum return once; net heat never twice. Process water/DI/service water and internally circulated cooling flows are independent interfaces; paired returns cancel."
      unit: "native unit"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_dispatch
      process_id: "dispatch"
      flow_role: "each packaging item"
      record_type: "foreground_record"
      raw_fields: "Qattr; packing grade/moisture/dimensions; dispatch receipts; returns/reuse/stocks; packing outside Dnet"
      collection_method: "Weigh actual board/foil/pallet independently and reconcile dispatch/returns/reuse/stocks within the accepted configuration/period. No generic packaging ratio or catalogue shipping gross mass establishes net part mass."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_wastes
      process_id: "residues"
      flow_role: "each outgoing waste stream"
      record_type: "foreground_record"
      raw_fields: "Qattr; transfer weight; own composition/assay/moisture/density; stocks/returns/recovery; receiver/transport/treatment route"
      collection_method: "Measure each outgoing waste independently at its actual handover state; retain own-stream wet/dry/composition and chemical/metal contents, returned stock and receiver route. Wastewater/sludge/spent solvent/captured dust/food/oil remain separate. Treatment is distinct from direct environmental discharge; captured material is not air. Missing compatible identity remains a gap rather than wrong-origin waste proxy."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_emissions
      process_id: "residues"
      flow_role: "each direct emitted species"
      record_type: "foreground_record"
      raw_fields: "Qattr; CAS/species/origin/compartment; post-control concentration; simultaneous flow/time; T/P/wet-dry/O2 correction; fugitive sampling; capture/reaction/byproducts"
      collection_method: "Use independently observed post-control concentration times matched actual flow and time with unit/state correction plus separately sampled fugitives. Reconcile input/retained/recovered/destroyed/sludge/wastewater/stocks by own assays; capture is not destruction and non-air/unexplained residuals never infer air. Molecular NO2 differs from NOx-equivalent; contained Cr(VI)/Ni/Cu differs from total metal/oxide/salt/alloy and avoids PM overlap."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Within one actual configuration/period divide attributable native-unit total by the sum of calibrated accepted complete-part net masses. Retain per-part quantities and actual denominator evidence."
      inputs:
        - Qattr
        - Dnet
        - Naccepted
        - cp_mass
      output: "native-unit amount per kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_qnd
      applies_to: "all inventory rows"
      requirement: "Same configuration/period Qattr includes attributable manufacture/assembly/tests/reject/rework burden. Naccepted counts accepted parts; Dnet sums their calibrated net masses. M=Dnet/Naccepted; q_item=Qattr/Naccepted; q_ref=Qattr/Dnet. Catalogue empty/gross mass or food throughput is not a denominator."
      evidence: "calibrated configuration-specific accepted ledger"
    - id: quality_physical
      applies_to: "all inventory rows"
      requirement: "Every element/chemical term uses its own gross mass, assay/moisture/wet-dry basis, reactions/stocks/returns/retention. Alloy/sludge/solution mass differs from contained element/active chemical. Each water stream requires own water fraction/density at actual temperature, independent reaction/retained fill/evaporation/discharge/stocks; internal returns pair and cancel."
      evidence: "own-stream assays and state/stock/reaction records"
    - id: quality_solvent
      applies_to: "ipa; spentipa; ipair; wastewater"
      requirement: "Reconcile each solvent own assay, stocks/reactions/retained/recovered/captured/destroyed/wastewater/spent-media terms against independently measured air. Capture differs from destruction; non-air and unexplained residual cannot become emitted IPA."
      evidence: "independent measured fate and air records"
    - id: quality_scope
      applies_to: "reference product"
      requirement: "Maintain all three named host part families with actual host-function, dedicated-interface and NEW manufactured state review. Food-contact grade/approval is component-specific, not a whole-frame claim. Catalogue option, empty/gross mass, customer recipe/yield/utility demand, marketing savings and maintenance consumables are not factory manufacture defaults."
      evidence: "actual order/BOM/acceptance and primary original technical body"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Match actual published100/type/native reference internal ID/property/unitgroup and official bilingual names with full chemistry/CAS/grade/phase/provider/completion/compartment. Add every actual unlisted material, ingredient/fuel/fill/module/test food, transport, waste and emitted species as independently queried atomic measured exchanges. Unresolved identities remain gaps; missing differs from zero and not-applicable requires physical evidence."
      evidence: "own full direct and supplier/interface review"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Require the accepted dedicated new part, actual cleaner/milling/food-drink-fats-oils host/function/drawing/interface, one-kg net reference and disclosed completion/new-versus-returned state. Reject whole-host, general machinery, ordinary material/tool or food proxies."
    source_ids:
      - cpc
      - anderson-sub
      - meatec
  - rule_id: validate_makebuy
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual supplied order/BOM, part-specific food-contact approval, exclusive raw-ingredient versus bought-complete branches and actual trial attribution. Reject catalogue alloy/binder recipes/weights/energy/customer yield/lifetime replacement defaults; include attributable rejects/rework/failed trials."
    source_ids:
      - cpc
      - cimbria
      - jtrolls
      - buhler-plansifter
      - buhler-roll
      - anderson-sub
      - anderson-rebuild
      - meatec
      - gea-valvematerials
      - gea-oldguide
  - rule_id: validate_balances
    applies_to: "foreground_dataset_conformance"
    rule: "Require each stream own assay/water/density/stocks/returns/reactions and measured non-air solvent fates; each emission actual species/origin/compartment and post-control concentration times matched flow/time/state plus independent fugitives. Utility imports/actual generation/exports/storage reconcile assigned meters and residual once, with independent same-datum gross heat return deducted once."
    source_ids: []
  - rule_id: validate_species
    applies_to: "foreground_dataset_conformance"
    rule: "Require molecular NO2 not NOx-equivalent, Cr(VI) not total Cr, contained Ni/Cu not gross salts/oxides and non-overlapping PM. Prefer matched individual species where the actual LCIA method differentiates them. Fossil versus biogenic trial-food carbon and measured air versus captured/liquid fates remain separate. Report performed/skipped checks, findings and actual completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset; process; lifecyclemodel"
  allowed_use: "Actual accepted configured new seed-cleaner, milling and food/drink/fats/oils dedicated-part manufacture"
  excluded_use: "Whole-host/general-component/material/customer-food proxies, catalogue mass/process recipe or universal factory assumption"
  required_metadata: "All reference qualifiers; Qattr/Naccepted/Dnet; native units/own assays/state; order/BOM/makebuy/actual tests/providers/receiver/allocation/gaps"
  required_quality_disclosure: "Measured/estimated/missing, calibration/sampling/uncertainty, residuals, identity/scope gaps and performed/skipped check completeness"
  update_trigger: "Principal function/order/configuration/contact alloy/chemical phase/provider/makebuy/site/period/acceptance/treatment change"
data_sources:
  - id: "cpc"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Whole dedicated parts for seed/grain/dry-legume cleaning/sorting/grading and44513/44516 hosts; parts are distinct from whole hosts and44523 tobacco parts."
  - id: "cimbria"
    type: "handbook"
    reference: "https://www.cimbria.com/en/products/processing/screen-cleaner/"
    used_for: "Actual dedicated screens and screen-cleaning rubber balls; Ducol wear armour is limited to named Delta models. Bearings/belts retain their general product identities; dry plastic-recycling machine configuration is outside automatic seed-host scope."
  - id: "jtrolls"
    type: "handbook"
    reference: "https://www.jtrolls.com/flour-mill-rolls"
    used_for: "Ni-Cr-Mo alloy shell/grey-iron core, centrifugal composite casting and machined journals/flutes/balancing establish a possible local manufacture route. Hardness, layer thickness, zero porosity and life/yield claims are not universal assays or factors."
  - id: "buhler-plansifter"
    type: "handbook"
    reference: "https://www.buhlergroup.com/global/en/product-families/Plansifters.html"
    used_for: "NovaPur/NovaTec stainless steel and polyurethane, no wood/screw fasteners near product, and dedicated sieve-cleaner/frame examples apply only to actually supplied models. Catalogue capacity increases are not manufacturing values."
  - id: "buhler-roll"
    type: "handbook"
    reference: "https://www.buhlergroup.com/global/en/stories/inspiration-hub/roll-refurbishment.html"
    used_for: "Fluted/smooth/grinding rolls and sieve framing/tensioning require the actual grain/cocoa/food host. Returned-roll reconditioning and non-food ink/battery/feed applications require distinct starting state and scope; customer energy savings are not factory factors."
  - id: "anderson-sub"
    type: "handbook"
    reference: "https://www.andersonintl.com/the-advantages-of-screw-press-subassemblies/"
    used_for: "Oilseed press barrel liners/knife bars/bolts, shaft interrupted worm flights and choke jaws/die plates are actual subassemblies; completed parts and rebuilt returned assemblies require separate supply states."
  - id: "anderson-rebuild"
    type: "handbook"
    reference: "https://www.andersonintl.com/?p=9640"
    used_for: "Actual used-machine teardown/cleaning/rebuild tools and tolerances are a reconditioning counterexample, not a default new-part route or2/3tonne part mass."
  - id: "meatec"
    type: "handbook"
    reference: "https://www.meatec.co.uk/"
    used_for: "Dedicated food forming plates/moulds and knockout assemblies/blocks/cups follow the actual supported host, part drawing and order. R&D sample tools or customer food trials do not establish factory manufacturing load."
  - id: "gea-valvematerials"
    type: "handbook"
    reference: "https://efps.gr/wp-content/uploads/2023/06/GEA_Homogenizing-valve_LR-244290-1.pdf"
    used_for: "Actual Standard/Re+VALVE WC or Si3N4/ZrO2, NanoVALVE NVHC WC and NVHP WC or ceramic depend on model/order. Finished insert versus local raw powder/sintering is separate; no cobalt binder recipe or pharmaceutical certification inferred."
  - id: "gea-oldguide"
    type: "handbook"
    reference: "https://cdn.gea.com/-/media/migratedfromtridion/stories/homogenization-guide-brochure-71437.pdf?rev=ecd54d06a70c4deb9faa476c531a8379"
    used_for: "Compression block and homogenizing-valve assemblies are configurable and serve food and non-food applications;3-A/FDA declarations are not every part/alloy/use approval. Customer energy/water/steam saving packages are outside default manufacture."
