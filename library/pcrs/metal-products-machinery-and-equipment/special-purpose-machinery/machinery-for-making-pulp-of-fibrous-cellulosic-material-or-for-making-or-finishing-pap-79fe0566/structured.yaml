allocation_rules:
  - rule_id: allocation_actual
    applies_to: "foreground_burden_allocation"
    rule: "Prefer measured configuration/process segregation. Shared fabrication and services use documented causal drivers and an explicitly justified allocation if unavoidable; retain reject/rework/test burden in accepted production. Allocate only unassigned shared residual and investigate negative residual without clipping."
    source_ids: []
  - rule_id: allocation_recycling
    applies_to: "foreground_burden_allocation"
    rule: "Separate internal returns from external waste treatment; disclose recycling method and treatment provider. Avoid arbitrary recycling credits, displacement, free coproduct assumptions or reuse-life factors."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "accepted configured machine"
      record_type: "foreground_record"
      raw_fields: "model/configuration; serial/BOM; calibrated accepted net mass; Naccepted; Dnet; gate; period; installed first set and fills; excluded packing/loose spares/test stocks"
      collection_method: "Use calibrated weighing or traceable weighing records for exactly the accepted delivered configuration; sum actual accepted net masses to Dnet and match accepted count. Transport-disassembled sets retain one nonduplicated complete BOM."
      unit: "kg"
      frequency: "each batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; receipts; own assays; BOM/acceptance; uncertainty"
    - protocol_id: cp_inputs
      process_id: "fabrication"
      flow_role: "each actual material/component"
      record_type: "foreground_record"
      raw_fields: "atomic identity; supplied state; native amount Qattr; own chemistry/assay/moisture; stocks; returns; onsite reaction; retained material; supplier/transport; make/buy; configuration/period"
      collection_method: "Reconcile calibrated receipts, actual BOM/issues, stock change and returns; each stream own gross mass and assay, not alloy/sludge gross mass as contained Fe/Cu. Separate finished versus partial modules and actual local operations."
      unit: "native"
      frequency: "each batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; receipts; own assays; BOM/acceptance; uncertainty"
    - protocol_id: cp_utilities
      process_id: "utilities"
      flow_role: "each metered utility"
      record_type: "foreground_record"
      raw_fields: "native Qattr; import/generation/export/storage; fabrication/casting/finish/assembly/test/dispatch meters; unassigned residual; heat datum; separate supplied/return kg and MJ/kg; actual T/P/density; provider/configuration/period"
      collection_method: "Match one period/site; reconcile imports plus generation minus exports and storage with process loads. Assign shared services only from unassigned residual. Independently measure gross supply and return on one enthalpy datum; gross return deducted once, already-net heat never deducted twice; physical steam mass separate."
      unit: "native"
      frequency: "each batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; receipts; own assays; BOM/acceptance; uncertainty"
    - protocol_id: cp_test
      process_id: "test"
      flow_role: "each actual factory test medium"
      record_type: "foreground_record"
      raw_fields: "trial/acceptance/rework log; Qattr; medium own assay/moisture/water fraction; load source; delivered/consumed/returned fractions; stocks; actual T density; runoff/evaporation/retention/reaction; configuration/period"
      collection_method: "Measure actual factory trials with separate meters and transfers; record consumed/returned test pulp/paper/adhesives separately, never user throughput, rated duty or a simulated mill recipe. Each water stream uses own water fraction, density and measured losses/stocks."
      unit: "native"
      frequency: "each batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; receipts; own assays; BOM/acceptance; uncertainty"
    - protocol_id: cp_waste
      process_id: "residues"
      flow_role: "each waste handover"
      record_type: "foreground_record"
      raw_fields: "identity; Qattr wet gross mass; own moisture/water fraction; each contaminant assay; treatment/provider; retained rework and internal transfers; stocks/configuration/period"
      collection_method: "Use weighed transfer manifests and own stream sampling; retain gross mass distinct from contained elements/water and pair returns. External provider emissions stay in provider process."
      unit: "kg"
      frequency: "each batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; receipts; own assays; BOM/acceptance; uncertainty"
    - protocol_id: cp_emissions
      process_id: "residues"
      flow_role: "each elementary species"
      record_type: "foreground_record"
      raw_fields: "species/CAS/origin/compartment; Qattr; measured post-control concentration; matched gas/liquid flow; same time interval; T/P/wet-dry/oxygen/unit correction; independent fugitive basis; capture/recovery/destruction; stocks"
      collection_method: "Measure each species after actual controls using matched concentration × gas/liquid flow × same period with measured state/unit corrections, plus independently measured fugitives; unexplained mass residual or carbon closure cannot create an emission."
      unit: "kg"
      frequency: "each batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; receipts; own assays; BOM/acceptance; uncertainty"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For one configuration and period divide each attributable native-unit exchange total by the sum of accepted configured-machine net masses; keep raw amounts, units and uncertainty."
      inputs:
        - Qattr
        - Dnet
        - cp_mass
      output: "native-unit amount per kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_qnd
      applies_to: "all inventory rows"
      requirement: "For one configuration/period Qattr includes attributable rejects, rework and factory tests; Naccepted counts precisely the accepted net configured machines in Dnet. Per-machine exchange=Qattr/Naccepted; mean net mass=Dnet/Naccepted; per-kg exchange=Qattr/Dnet. Equivalent per-machine conversion uses measured mean net mass, never a catalogue weight or an invented fixed machine mass."
      evidence: "matched calibrated net-mass and acceptance ledger"
    - id: quality_balances
      applies_to: "all inventory rows"
      requirement: "Each physical element/species term uses own gross mass and own assay, wet/dry basis and moisture with stocks, reactions, retained product, internal returns and external waste; gross alloy/sludge is not contained element. Each water stream uses own water fraction and measured density at actual temperature, with reaction generation/consumption, retention, evaporation, discharge and stocks; pair circulation returns."
      evidence: "stream-specific assays, stock and reaction ledger"
    - id: quality_solvent
      applies_to: "ipa; spentipa; ipair"
      requirement: "Use each stream own IPA assay for stock-adjusted input, retained product, captured/recovered liquid, wastewater/spent media, destruction and measured air release. Capture differs from destruction; non-air fates never become air and unexplained residual remains unresolved."
      evidence: "independent fate/assay and emission measurements"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Match actual state/type, reference property/native unit, alloy/polymer/chemical, supplied completion, provider/geography and elementary compartment. Conditional identity UUIDs are no numeric defaults. Add every actual unlisted fastener, valve, coating reagent, welding gas, test stock, transport service, steam/return or waste species as an atomic queried and measured row. Unknown is not zero; absent requires proof."
      evidence: "actual procurement/BOM/process/provider and gap disclosure"
    - id: quality_category
      applies_to: "reference product"
      requirement: "Full category remains broader than a single refiner/headbox/folder-gluer model. Independently classified dryers, printing, bookbinding, generic equipment and spare parts need supplied-state/principal-function review. Pressure-vessel chemistry, envelope/creping/calendering and unobserved configurations require item-specific primary architecture; examples never imply universal material grades, operating recipes, speed, lifetime or efficiency."
      evidence: "original configuration and classification decision"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require complete declared accepted configured BOM, positive Dnet/Naccepted and actual principal-function review; reject a pulp/paper product or one unrelated partial component as full reference. Both languages use the same native numerator and one-kg net reference."
    source_ids:
      - un-cpc3
  - rule_id: validate_interfaces
    applies_to: "foreground_dataset_conformance"
    rule: "Reject duplicate bought-module manufacture, embedded-material double counting, uncancelled internal returns, assumed supplied fills/clothing, or customer mill use quantities presented as factory burdens. Actual factory trial/reject/rework loads remain attributable."
    source_ids:
      - andritz-cast
      - valmet-headbox
      - bhs-corrugator
      - holweg-bag
  - rule_id: validate_physics
    applies_to: "foreground_dataset_conformance"
    rule: "Require own stream element/water/solvent fate closure, measured post-control concentration with matched flow/time/state and independently measured fugitives. Reconcile utilities from imports/generation/exports/storage and actual process loads, allocate only unassigned residual; investigate negatives without clipping. Gross heat=supplied measured kg×its own MJ/kg minus independently measured return kg×its own MJ/kg on one datum, deducted once; already-net heat never deducts return again. Physical steam and heat separate; supplier boiler is upstream."
    source_ids: []
  - rule_id: validate_species
    applies_to: "foreground_dataset_conformance"
    rule: "Carbon closure cannot infer CO or NO2; NOx as NO2-equivalent is not pure molecular NO2. Ordinary-air emissions cannot use stratospheric/indoor/water flows. State20 and wrong reference property are unavailable. Report performed/skipped checks, missing records, findings and completeness."
    source_ids: []
