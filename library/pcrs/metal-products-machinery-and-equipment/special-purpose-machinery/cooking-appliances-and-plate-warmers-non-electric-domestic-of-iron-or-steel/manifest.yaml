  reference_flow_identity:
    status: unresolved
    unresolved_support_fields:
      - reference_product_flow_uuid
  unresolved_reference_flow_uuid: Full domestic non-electric iron/steel cooking and plate-warming product interface is not confirmed; no representative gas/wood/oil model UUID substitutes for the category.
  unresolved_inventory_uuids: All specific actual alloy grades, formulations, purchased components, utilities, fuel interfaces, wastes and emissions require matching direct identities; category remains physically explicit without invented UUIDs.
  unresolved_provider_links: Actual grade, treatment state, fuel composition, geography and waste-treatment interface require site/supplier evidence.
  unresolved_recipe_evidence: Conditional chemical, glass, refractory, seal, metal and coating cards require actual supplier specifications and make/buy matrix; no universal recipe or grade is asserted.
  unresolved_quantitative_ranges: No measured machine weight, lifetime, fuel use, yield, energy, emission factor or empirical range is adopted; calibrated factory-period collection is mandatory.
  unresolved_plate_warmer_evidence: Standalone domestic non-electric plate warmers retain full category scope; actual construction, heat source and acceptance specification need supplier/site evidence before a concrete dataset.
  unresolved_hybrid_classification: Actual cooking/heating combinations and electric thermal hybrids need principal-function authority and classification review; auxiliary electric ignition/control is not itself electric cooking heat.
  unresolved_source_access: Legacy AGA oil instruction PDF returned 404; actual publisher Rayburn HTML supplies oil/gas cooking configuration alternative. Rangemaster PDF editions are undated; filenames do not establish publication date.
  identity_rejections:
    - Hot-rolled steel product mix direct read has unresolved forms/grades and is not a complete cooker output or grade-specific appliance sheet input.
    - Methane search direct read is elementary flow and cannot establish factory supplied fuel or a complete cooking appliance.
    - No electric induction or electric-oven brochure model is adopted as non-electric cooking reference.
