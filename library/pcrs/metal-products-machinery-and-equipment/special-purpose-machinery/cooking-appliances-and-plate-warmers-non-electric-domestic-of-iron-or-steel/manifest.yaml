review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved:
    inventory_flow_uuids:
      - row_id: steel_sheet_input
        reason_code: no_exact_candidate
        explanation: Public candidates did not jointly establish cold-rolled non-alloy steel sheet; English and Chinese identities or product form conflicted.
      - row_id: domestic_gas_burner_input
        reason_code: no_exact_candidate
        explanation: Public candidates represented industrial furnace burners, broad furnace equipment or unrelated material, not a domestic gas hob burner assembly.
    range_evidence_needs:
      - row_id: steel_sheet_input
        explanation: Obtain two independent, product- and boundary-compatible factory observations before proposing a general sheet-input range; collect the actual bill of materials meanwhile.
      - row_id: fabrication_electricity
        explanation: Obtain two independent, route-matched factory electricity inventories before proposing a screening interval; use metered foreground energy meanwhile.
      - row_id: steel_scrap_output
        explanation: Obtain two independent comparable sheet-fabrication yield studies before proposing an offcut range; use weighed foreground scrap meanwhile.
      - row_id: powder_coating_input
        explanation: Obtain two independent comparable powder-coating observations for the declared surface route; use issue and return records meanwhile.
      - row_id: acceptance_test_natural_gas
        explanation: Obtain two independent comparable test-protocol inventories before proposing a gas-use range; use the factory test meter meanwhile.
      - row_id: corrugated_box_input
        explanation: Obtain two independent comparable packaging specifications for the same appliance sale state; use weighed boxes meanwhile.
