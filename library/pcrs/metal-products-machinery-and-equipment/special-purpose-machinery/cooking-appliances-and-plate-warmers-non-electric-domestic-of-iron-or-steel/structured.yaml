  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Use each attributable period exchange Q / D; preserve original numerator units; reference_product = 1 kg."
      inputs:
        - Q
        - D
        - cp_mass
      output: "q_ref"
      source_ids:
        - rangemaster-manufacture
  data_quality_requirements:
    - id: identity
      applies_to: "all applicable rows"
      requirement: "Confirm actual UUID/property/unit, grade/formulation, fuel, supply state/geography and downstream waste treatment interface; unresolved is explicit, not a generic substitute."
      evidence: "Actual supplier/site records and direct identity reads"
    - id: coverage
      applies_to: "all exchanges"
      requirement: "Same configuration/BOM/period and tests; actual route absence documented. Missing actual quantities, ranges or recipes remain unknown, not zero; no factory default inferred from brochure use specifications."
      evidence: "Measured raw records, route matrix and uncertainty"
validation_rules:
  - rule_id: reference_check
    applies_to: "reference_product"
    rule: "Require positive D and N, calibrated accepted net same-configuration mass, and same-period Q including rejects/rework; 1 kg output and Q/D must reconcile. Cooking/heating hybrids require principal-function/classification authority evidence."
    source_ids:
      - esse-cookers
      - aga-rayburn
  - rule_id: water_closure
    applies_to: "physical water and moisture records"
    rule: "Each wet stream uses its own measured moisture and wet/dry basis, including product, sludge, wastewater and residuals. External water plus input moisture plus beginning stock and reaction-generated water equal retained product moisture plus end stock, evaporation, discharge and reaction consumption. Pair internal returns; do not count circulation repeatedly. Investigate residual using actual combined meter/sampling/allocation uncertainty, not universal tolerance."
    source_ids:
      - rangemaster-manufacture
      - jrc-foundry-2024
  - rule_id: metal_species_closure
    applies_to: "physical material and species records"
    rule: "For each actual element/species, every input, product, scrap, slag, sludge, wastewater and release uses its OWN matched assay and wet/dry basis. Include beginning/end stocks, reaction transformations, retention and paired internal return cancellation. Gross material mass is not contained iron/chromium/nickel; investigate closure with actual combined measurement, sampling and allocation uncertainty."
    source_ids:
      - jrc-foundry-2024
  - rule_id: solvent_closure
    applies_to: "physical solvent records"
    rule: "For each actual solvent, reconcile fresh input and beginning stock against end stock, retained product, recovered solvent, solvent in capture media, verified destruction, air releases and non-air residues. Unknown solvent residual is not automatically an air emission. Recovery/capture is not destruction; paired returned solvent cancels once. Investigate residual against actual combined uncertainty; no assumed solvent for absent route."
    source_ids:
      - rangemaster-manufacture
  - rule_id: utility_closure
    applies_to: "utility records"
    rule: "Process and shared-service rows reconcile SAME measured site period and units; shared service is only the unassigned residual. Do not add whole-factory meter totals to assigned submeters. Reconcile imports, actual onsite generation, exports, storage changes and steam/condensate returns; investigate negative residual using matched meter, sampling, period, stock and allocation uncertainty, never clip. Bought power is not source-specific incineration output; generation fuel is not purchased power."
    source_ids:
      - rangemaster-manufacture
  - rule_id: emission_evidence
    applies_to: "elementary emissions and fuel records"
    rule: "Factory combustion/firing releases remain production; customer use remains separate. Fuel carbon closes total carbon but cannot prove CO, NO or NO2 amounts. Require species-specific measured/factor evidence, actual compartments and fossil/biogenic split. NOx as NO2 equivalent is a convention, not pure NO2; measured size-resolved PM10/PM2.5 are distinct, do not infer from unsized dust. Capture media and treatment residues need their own assays."
    source_ids:
      - jrc-foundry-2024
      - esse-cookers
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing supply of declared configuration; downstream process/lifecyclemodel projection with independently defined cooking service"
  excluded_use: "Universal cooker fuel/lifetime or equivalence defaults; unresolved hybrid classification; use-phase claims from factory mass"
  required_metadata: "Qualifiers, D/N/M and raw Q, period, make/buy, actual routes, provider links, acceptance and downstream service boundary"
  required_quality_disclosure: "Unresolved UUIDs, recipes, quantities, standalone plate-warmer evidence and classification hybrids; measurement/allocation uncertainty and completeness"
  update_trigger: "Model/BOM/fuel/finish/supplier/test/route change or resolved evidence/identity gap"
data_sources:
