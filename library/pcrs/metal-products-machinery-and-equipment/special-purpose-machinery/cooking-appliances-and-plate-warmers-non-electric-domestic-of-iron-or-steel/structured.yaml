allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared factory processes"
    rule: "First separate metered process lines, production periods and product configurations; retain directly traceable sheet, scrap, coating, burner, test gas and box records."
    source_ids:
      - us-epa-metal-fabrication-2007
      - eu-jrc-cooking-appliances-2020
  - rule_id: allocation_shared
    applies_to: "remaining shared energy and waste"
    rule: "If direct measurement cannot separate a shared process, allocate by a documented physical driver tied to that process, such as measured machine time; disclose the driver, denominator and sensitivity."
    source_ids:
      - us-epa-metal-fabrication-2007
  - rule_id: scrap_no_credit
    applies_to: "steel scrap output"
    rule: "Record steel scrap as an output; do not subtract an assumed recycling credit inside the factory-gate foreground inventory."
    source_ids:
      - us-epa-metal-fabrication-2007
