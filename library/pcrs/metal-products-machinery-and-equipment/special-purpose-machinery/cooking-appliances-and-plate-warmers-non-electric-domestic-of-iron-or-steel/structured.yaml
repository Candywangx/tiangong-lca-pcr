system_boundary:
  rules:
    - rule_id: gate
      applies_to: "foreground_system_boundary"
      rule: "Include actual factory operations, supplier inputs, cleaning, finishes, acceptance repeat tests, rejects/rework, residues and packing. Exclude installation, user cooking fuel, customer food and lifetime heat service; incidental heat does not change product identity without review."
      source_ids:
        - esse-cookers
        - aga-rayburn
    - rule_id: make_buy
      applies_to: "foreground_system_boundary"
      rule: "For every body/hotplate/support/burner/valve/control item, record whether fabricated here or purchased at the actual completion state. Bought enamelled body includes casting and enamel once; bought burner includes motor/pump/metals once; bought valve includes its alloy once. Do not combine finished purchase with its embedded in-house recipe. A partly processed bought item receives only remaining operations."
      source_ids:
        - rangemaster-manufacture
        - aga-sustainability
    - rule_id: conditional_routes
      applies_to: "foreground_system_boundary"
      rule: "Do not force casting, enamelling, solvents, electric heaters or one fuel on every product. Add atomic grade/chemistry/component/fuel/waste/emission cards for actual unlisted exchanges and recheck; evidence-backed absence is not_applicable, unknown is not zero."
      source_ids:
        - esse-cookers
        - rangemaster-gas
        - aga-rayburn
