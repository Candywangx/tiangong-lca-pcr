    rule: "Separate model/configuration and fuel/material routes; subdivide measured operations first. Allocate remaining shared work using documented causal machine-hours, treated area, measured heat or test cycles. Retain reject/rework Q with accepted D. Record actual scrap/waste/co-product status and consistent upstream recycling allocation; no automatic avoided burden or credit for paired internal returns."
    source_ids:
      - jrc-foundry-2024
      - aga-sustainability
