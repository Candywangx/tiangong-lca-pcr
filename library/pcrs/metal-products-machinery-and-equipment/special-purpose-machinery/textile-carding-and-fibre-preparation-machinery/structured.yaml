system_boundary:
  rules:
    - rule_id: boundary_foreground
      applies_to: "all processes"
      rule: "Include actual manufacture, assembly, first fill, attributable factory trials and rework. Exclude customer mill installation, use, fibre/yarn output, central extraction service, maintenance and end of life."
