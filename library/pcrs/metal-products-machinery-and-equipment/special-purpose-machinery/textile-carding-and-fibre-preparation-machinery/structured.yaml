  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_bom
      applies_to: "all components"
      requirement: "Reconcile every installed frame, fibre-working surface, roller/cylinder, clothing, drive, controller, guard and first fill against configured BOM and supplier completeness; avoid bare/clothed assembly and internal-transfer duplication."
      evidence: "configuration BOM and supplier scope"
    - id: quality_balance
      applies_to: "mass and utilities"
      requirement: "Reconcile stock, component masses, M, retained grease, exported wastes, trial-fibre returns and rework; retain scale/meter calibration and composition/state conversions. Establish site QA limits from measured records, not brochure machine capacity, fibre yield or assumed material losses."
      evidence: "weighing, meter, stock and trial receipts"
    - id: quality_coverage
      applies_to: "all processes"
      requirement: "Report period/geography, model coverage, actual/absent conditional stages, outsourcing, identity/quantity gaps, uncertainty and upstream links. Historical equipment/factory examples provide no current factory intensities or universal tolerances."
      evidence: "order coverage and evidence register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Require positive measured M, complete functional preparation machine, explicit working mechanism, clothing/module and drive/control inclusion, net tare and factory acceptance. Do not substitute fibre/yarn output or throughput services for machine manufacture."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "inventory rows"
    rule: "Require one physically defined exchange with matching public identity, reference property, unit group, route and medium. Steel wire is not finished card clothing, PET is not any synthetic staple, process water is not wastewater, and a product scrap flow is not automatically a waste transfer. Keep incompatible UUIDs blank until dataset completion."
    source_ids: []
  - rule_id: validate_conversion
    applies_to: "inventory rows"
    rule: "Check cp_mass and normalize_mass against the same accepted configuration and period, exact gas meter conditions and electricity units. Reject duplication of complete-module constituents, fibre returns and first fills."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "elementary rows"
    rule: "Fossil CO2 requires attributable actual factory combustion measurements and air-unspecified subcompartment. Any other demonstrated substance and medium gets its own card; no universal emissions from machining, coating or fibre trials."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured staple-fibre preparation machine foreground manufacture dataset"
  downstream_use: "secondary_dataset; background_dataset after qualified review and explicit upstream coverage"
  allowed_use: "Manufacturing supply-chain modelling for matching function/configuration, state, gate, site and period"
  excluded_use: "Fibre/yarn production, lifetime service comparison, equal-mass preparation equivalence, other textile functions and complete cradle-to-gate claims with missing upstream stages"
  required_metadata: "Reference qualifiers, configuration BOM, measured M, supplier scope, actual operations/trials, site/period/gates, collection/allocation evidence and upstream links"
  required_quality_disclosure: "Missing identities/quantities, uncertainty, inactive cards, added BOM exchanges, historical evidence limits and unlinked outsourced/upstream stages"
  update_trigger: "Function, working width, mechanism/clothing, module/drive/control options, supplier completeness, M/first fill, finishing route, factory period/geography or resolved evidence gap changes"
data_sources:
  - id: "rieter-card"
    type: "literature"
    reference: "[Rieter C 81 Card, 3586-v1 en 2305](https://www.rieter.com/fileadmin/user_upload/products/documents/systems/fiber-preparation/c-81/rieter-c-81-card-brochure-3586-v1-98697-en.pdf)"
    used_for: "May 2023 brochure, PDF/printed page 11, Carding Gap Control and Automatic distance adjustment, option footnote: cylinder clothing/flat-wire interfaces and optional control example. Historical configuration only; no universal gap, clothing specification, manufacturing intensity, mass or life adopted."
  - id: "dmg-factory"
    type: "literature"
    reference: "[DMG MORI Technology Excellence 01–2022](https://en.dmgmori.com/resource/blob/626730/cde70e4767e83788dd7d9fd44f6c05b0/j221en-data.pdf)"
    used_for: "PDF/printed page 56, Trützschler Textile Machinery Shanghai case: historical manufacture/assembly of blow rooms, cards and draw frames using machining centres. Example of in-house part machining and configured assembly only; no compulsory machine-tool brand, current factory activity, coating recipe, efficiency or machine mass."
  - id: "truetz-preparation"
    type: "literature"
    reference: "[Trützschler Ring spinning applications](https://www.truetzschler.com/en/spinning/applications/ring-spinning/)"
    used_for: "Combed cotton, Carded cotton/pure man-made fibres, Material blends and Overview of our solutions sections: opening/blending/card/draw-frame/lap/comber alternatives in staple preparation; retrieved 2026-10-04 UTC. Product-boundary evidence only, not ring-spinning machine manufacture, fibre trial recipe, yields or manufacturing quantities."
