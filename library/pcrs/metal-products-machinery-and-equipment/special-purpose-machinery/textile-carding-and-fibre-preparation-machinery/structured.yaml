    rule: "Separate function/model, working width, mechanism, clothing and installed options by work order. Directly assign issues, returns, station meters, trials and rework first. For inseparable shared manufacturing resources, use measured causal station time or load; share = order driver / sum of all covered order drivers, documenting causal justification, period and denominator. No unexplained equal-count allocation across card, draw-frame and opener models."
    source_ids: []
  - rule_id: allocation_reuse
    applies_to: "scrap and trials"
    rule: "Internal stock/fibre reuse is a transfer, not repeated fresh input. Exported chips, residues and trial fibres retain measured quantity and destination without automatic avoided-product credit. Identify saleable trial sliver or other co-products separately and obtain reviewed residual allocation after direct separation. Rejected/reworked machine burdens belong to the recorded accepted-output period; reconcile unfinished stock."
    source_ids: []
