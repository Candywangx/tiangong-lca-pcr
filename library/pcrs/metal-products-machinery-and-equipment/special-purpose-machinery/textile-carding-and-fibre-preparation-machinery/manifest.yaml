review_metadata:
  scientific_review: "pending"
  semantic_boundary_decision: "Manufacture of new complete staple-fibre spinning-preparation equipment whose function is bale/tuft opening, cleaning, blending, carding into sliver, combing preparation/combing or sliver drawing/coiling. Functions/configurations are separate data records; not equal-mass substitutes. Exclude fibre extrusion/drawing/texturing, final yarn spinning/twisting/winding/warping/sizing, weaving/knitting, nonwoven web-forming/bonding lines, stand-alone parts/card clothing, central mill utilities, used/refurbished machinery and fibre/yarn production services. Narrower CPC 44611 context only. Weaving PCR covers warp/weft interlacing and explicitly excludes yarn preparation; other related directories remain empty scaffolds. Distinct precision fibre-working surfaces, configured modules, drive/control integration and manufacturing acceptance require new methodology."
