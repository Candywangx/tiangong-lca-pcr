system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "all_processes"
      rule: "Include actual receipt, staged chassis/power/crop/cab/control integration, filling/leak checks, actual factory commissioning and final complete acceptance, including attributable setup/idle/reject/rework. Optional washing, solvent cleaning and crating require actual operation evidence. Designs in cited sources justify module distinctions, not mandatory manufacturing recipes."
