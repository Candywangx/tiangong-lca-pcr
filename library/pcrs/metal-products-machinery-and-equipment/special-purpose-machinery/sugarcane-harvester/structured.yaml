allocation_rules:
  - rule_id: allocation_direct
    applies_to: "shared operations"
    rule: "First subdivide actual BOM/job/meter/supplier records by configuration. Attribute shared hoist/integration/test loads using observed operation time and measured load/setup/idle records; wash/fill services use actual batch and formulation records. Any alternative physical or economic share requires actual causal evidence, documented basis and sensitivity; no universal mass share."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "returns rework and waste"
    rule: "Retain consumed rejects/rework and actual test resources in the campaign numerator divided by accepted same-configuration units. Supplier returns and reusable drained fluid are stock/return, not automatic waste. Actual saleable scrap requires contract/state evidence and documented co-product treatment; no simultaneous scrap sale benefit and avoided-production credit for the same mass."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted complete machine"
      record_type: "calibrated complete-machine weighing"
      raw_fields: "model; configuration; serial; accepted net mass M; calibration; gross/tare; retained fills; acceptance signature"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted complete machine"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable integration supply gates"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original readings/calibration and signed configuration balance"
    - protocol_id: cp_parts
      process_id: "all_processes"
      flow_role: "specific supplied assembly"
      record_type: "supplier and net mass records"
      raw_fields: "one part model/drawing/serial; counts; supplied net kg; issue/return/stock; supplier included parts/fluids; accepted count"
      collection_method: "Weigh actual net supplied or installed assembly kg and reconcile issued/returned/stock and supplied inclusion boundary with current BOM. Measure engine kg independently even though engine exchange uses item count. Same-spec parts may be summed, not unlike modules."
      unit: "kg"
      frequency: "each receipt/issue/return and campaign"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable integration supply gates"
      aggregation_rule: "actual attributable component kg / accepted units of the same configuration"
      quality_evidence: "original weighing, signed BOM/supplier inclusion and stock records"
    - protocol_id: cp_engine
      process_id: "power"
      flow_role: "supplied non-road engine count"
      record_type: "serial-controlled engine issue"
      raw_fields: "engine model/serial/emissions; supplied installed count Item(s); actual independent engine kg; prefilled oil/coolant; issue/return; accepted count"
      collection_method: "Count actual supplied installed same-model engine units with serial reconciliation and supplier assembly/prefill boundary; returned reusable engines excluded from net issue. Retain separate calibrated supplied engine kg for M reconciliation, not a count-to-mass default factor."
      unit: "Item(s)"
      frequency: "each supplied engine and campaign"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable integration supply gates"
      aggregation_rule: "actual attributable engine Item(s) / accepted units of the same configuration"
      quality_evidence: "engine serial/count originals and independent calibrated weighing"
    - protocol_id: cp_hydraulic
      process_id: "filling"
      flow_role: "external hydraulic oil volume"
      record_type: "calibrated oil volume and retention records"
      raw_fields: "SDS/grade; temperature; supplied/returned m3; measured density at same temperature; retained kg; module prefill; accepted count"
      collection_method: "Meter actual net external oil supply m3 with calibrated volume instrument at recorded temperature; reconcile returns, internal circulation and supplier prefill. Retained oil kg is independently weighed or calculated from actual matching measured volume and density for physical inclusion only."
      unit: "m3"
      frequency: "each actual fill/return and campaign"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable integration supply gates"
      aggregation_rule: "actual attributable oil m3 / accepted units of the same configuration"
      quality_evidence: "original calibrated volume/density/weighing and SDS balance"
    - protocol_id: cp_stock
      process_id: "all_processes"
      flow_role: "specific fluid or crate"
      record_type: "net issue/return records"
      raw_fields: "named formulation/crate; supplier/SDS/assay; net kg; issue/return/retention/waste; prefill; accepted count"
      collection_method: "Weigh each actual named external product net kg excluding containers, reconcile stock/issues/returns and actual retained supply. Actual fuel fossil fraction and coolant chemistry require supplier evidence, not assumed density or generic mixture."
      unit: "kg"
      frequency: "each issue/return and campaign"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable integration supply gates"
      aggregation_rule: "actual attributable input kg / accepted units of the same configuration"
      quality_evidence: "actual stock/calibration/SDS and issue/return balances"
    - protocol_id: cp_energy
      process_id: "all_processes"
      flow_role: "stage electricity"
      record_type: "calibrated user-side meters"
      raw_fields: "stage; kWh; voltage/provider/geography; actual work/test/idle/rework; causal shared loads; accepted count"
      collection_method: "Read calibrated stage user-side electricity meters and actual causal load records, including assembly/hoists/control/test equipment once. Convert kWh by3.6 MJ/kWh before per-unit collection; hydraulic output/engine rating is not electricity input."
      unit: "MJ"
      frequency: "actual representative campaign"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable integration supply gates"
      aggregation_rule: "actual attributable electricity MJ / accepted units of the same configuration"
      quality_evidence: "meter calibration, work logs and actual provider evidence"
    - protocol_id: cp_waste
      process_id: "all_processes"
      flow_role: "specific exported waste"
      record_type: "receiver weighing and analysis"
      raw_fields: "one waste; kg/tare; wet/dry composition; actual receiver; returns/recovery; accepted count"
      collection_method: "Weigh each actually exported segregated waste net kg, with own assay/state and receiver. Distinguish internal reuse, supplier return and retained fluids; collected wastewater is a technosphere transfer, not direct freshwater release."
      unit: "kg"
      frequency: "each export/campaign"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable integration supply gates"
      aggregation_rule: "actual exported waste kg / accepted units of the same configuration"
      quality_evidence: "net weighing/analysis and receiver manifests"
    - protocol_id: cp_exhaust
      process_id: "testing"
      flow_role: "individual observed exhaust species"
      record_type: "compound-specific post-control outlet measurements"
      raw_fields: "test fuel fossil fraction; CAS; air submedium; post-control concentration; exhaust flow/time; collected/retained carbon; uncertainty; accepted count"
      collection_method: "Measure actual post-control outdoor exhaust species kg from matched compound concentration, calibrated flow and actual test time; trace fossil carbon separately. Record actual exhaust capture/aftertreatment and detection/unknown/absence distinctions. No total NOx assigned to NO or NO2, no fuel-carbon-only NO factor."
      unit: "kg"
      frequency: "actual representative test/control period"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable integration supply gates"
      aggregation_rule: "actual released species kg / accepted units of the same configuration"
      quality_evidence: "original sampling/lab/calibration, actual test/fuel carbon records"
    - protocol_id: cp_solvent
      process_id: "cleaning"
      flow_role: "observed IPA release"
      record_type: "compound measurement or closed IPA balance"
      raw_fields: "CAS67-63-0; concentration/airflow/time; actual submedium; issue/recovery/residue/retention; detection/uncertainty; accepted count"
      collection_method: "Measure actual residual outdoor IPA by matched sampling or documented closed issue/recovery/residue/retention balance. No unexplained residual automatically becomes air emission or full evaporation."
      unit: "kg"
      frequency: "actual representative cleaning period"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable integration supply gates"
      aggregation_rule: "actual released kg / accepted units of the same configuration"
      quality_evidence: "sampling/calibration and solvent balance"
    - protocol_id: cp_configuration
      process_id: "all_processes"
      flow_role: "as-built complete harvester"
      record_type: "controlled BOM and actual factory acceptance"
      raw_fields: "model/serial/configuration; full BOM and supplier prefill scope; crop/drive/cab/HVAC/controls; actual leak/function/commissioning results; net delivery state"
      collection_method: "Trace current approved drawings and actual component inclusions, chronological assembly and factory inspection/test disposition. Record actual safeguards, crop-drive/brake/steering/hydraulic/electrical functions checked under current approved acceptance plan; no universal threshold, duration or load test is inferred from brochures."
      unit: "kg"
      frequency: "each machine/configuration change"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable integration supply gates"
      aggregation_rule: "qualifiers accompany each accepted same-configuration unit"
      quality_evidence: "signed drawing/BOM/test/disposition records"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: mass_provenance
      applies_to: "cp_mass"
      requirement: "Use a current calibrated vehicle/platform scale or weighbridge suitable for the complete machine actual mass/footprint with traceable capacity/resolution/calibration, original zero/tare/net readings and signed same-serial configuration. No imaginary bench scale. Weigh after actual delivered fills; any removed part needs independently measured same-unit add/remove corrections and original configuration state. Independently reconcile engine kg, supplied module kg and retained fuel/oil/coolant kg to complete positive M. No brochure operating weight, rated capacity, inferred density or invented average machine mass substitutes."
      evidence: "cp_mass; cp_parts; cp_engine; cp_hydraulic; cp_stock"
    - id: net_configuration
      applies_to: "finished_harvester"
      requirement: "M includes all actual installed permanent components and retained delivery fluids exactly once; installed engine/gearbox/cab/HVAC/battery prefill is within its supplied mass. Separate plant makeup enters only outside that supply boundary. Exclude operator, crop, payload, temporary test fixtures, packaging, loose spares/tools and separately delivered accessories. Record retained fuel state explicitly, not arbitrary full-tank mass."
      evidence: "cp_configuration; cp_parts; cp_engine; cp_stock; cp_mass"
    - id: period_collection
      applies_to: "all protocols"
      requirement: "For each same-configuration actual campaign, attribute actual exchange total using primary causal records and divide by actual accepted unit count to collect q_item in its original kg, MJ, m3 or Item(s). Retain consumed rejects/rework in numerator; never silently pool different engine/track/crop/HVAC or delivered-fluid configurations. Complete accepted M corresponds to the same population/state."
      evidence: "cp_configuration; actual counts; original records"
    - id: completeness_balance
      applies_to: "all exchanges"
      requirement: "Expand the full actual BOM and operation register before claiming complete plant coverage: additional roller/drive specifications, air intake, exhaust, lights, brackets, grease, gear oil, HVAC recharge, compressed air/heat, test crop and its residues, wipe/packaging fractions each need their own physically specific exchanges. Match all upstream/transport/receiver links. Close stock-to-installed/returned/rejected/waste and fluid issue/retention/drain/recovery/emission balances with actual uncertainty, no default yield or unexplained-residual emission."
      evidence: "all collection protocols and actual job/supplier/receiver records"
    - id: source_limits
      applies_to: "external sources"
      requirement: "Deere page currently has a CH750 heading and CH570 descriptive text; retain it only as publisher-retained CH570 crop-module examples, not verified contemporary CH750 specifications. Case offers bolted modular chassis and wheeled/tracked alternatives, showing that welding and one running gear are not universal necessities. Both are promotional architecture evidence only, not plant quantities or independently audited factory production. Current controlled foreground drawings, work records and independent scientific review remain required."
      evidence: "deere-cane-architecture; case-austoft-architecture"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference_flow"
    rule: "Verify exact reference name equals finished_harvester, complete declared tracked non-road diesel billet configuration and physically measured positive net M kg. Generic44129 machinery-and-parts identity does not independently establish this complete configuration."
    source_ids: []
  - rule_id: validation_configuration
    applies_to: "all_processes"
    rule: "Verify actual supplier boundaries, engine serial and count/independent kg, hydraulic actual m3/temperature/density retention, prefilled versus plant added fluids, complete permanent BOM and actual chronological commissioning/acceptance. Reject duplicated motors/blades/cab refrigerant or engine oil within complete modules. Actual engine classification must be non-road agricultural, not road-vehicle or aircraft propulsion."
    source_ids: []
  - rule_id: validation_identity
    applies_to: "all flow rows"
    rule: "Verify public state100 type, actual reference property/group/unit, route/state and exact official bilingual names. Preserve Number, Volume and Energy; do not relabel Mass. Match each emission chemical/fossil fraction and immediate actual air submedium; NO/NO2/N2O, direct resource water and collected effluent remain distinct. Retain specific blank identity gaps until resolved."
    source_ids: []
  - rule_id: validation_claims
    applies_to: "claims"
    rule: "Mechanical PCR pass verifies declared consistency only, not actual factory measurements, complete cradle-to-gate coverage, scientific approval or field performance. Declare remaining BOM/identity/measurement/link/independent evidence gaps and actual unknown/not-applicable/below-detection status."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured complete tracked sugarcane-harvester final integration manufacturing foreground; heading implies no publication"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same declared configured complete machine manufacturing scaled by actual M with actual linked component and supply gates"
  excluded_use: "Harvest services, crop yields, farm use fuel, lifetime comparisons, unrelated harvesters/tractors/parts and unsupported configurations"
  required_metadata: "Full as-built BOM/model/serial, tracked route, engine/emission/serial/count and independent kg, crop/drive/cab/HVAC/electrical configuration, module fluid inclusions and actual retained fills, complete calibrated M and original weights, actual plant/period/provider/work/acceptance records, allocation, upstream/receiver links"
  required_quality_disclosure: "Identity/measurement/BOM/source/link gaps, actual returns/rejects/rework and fluid recovery; detection/uncertainty/cutoffs and allocation sensitivity"
  update_trigger: "Engine/emission, chassis/track/crop module, supply/prefill, actual fluid/formulation, control/HVAC/acceptance, delivery state or plant/provider/period changes"
data_sources:
  - id: "deere-cane-architecture"
    type: "handbook"
    reference: "John Deere Australia, CH750 Track Cane Harvester (page title retains CH570 wording), undated official page, Hydrostatic basecutter and chopper; Elevator and cleaning system. https://www.deere.com.au/en/harvesting/sugar-cane-harvester/ch750-track-sugar-cane-harvester/"
    used_for: "Publisher-retained CH570 example: distinct hydraulic basecutter/chopper, extractor and elevator modules. No numerical weight, productivity, lifetime or universal factory recipe transferred."
