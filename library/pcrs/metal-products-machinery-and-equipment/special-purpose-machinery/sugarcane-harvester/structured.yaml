        - deere-cane-architecture
        - case-austoft-architecture
    - rule_id: boundary_exclusions
      applies_to: "use and earlier manufacture"
      rule: "Keep earlier component production linked upstream and actual field harvesting, crop yield, farm diesel, cultivation, transport service and service end-of-life outside this manufacturing reference. Factory commissioning is a manufacturing operation only when actually performed before release; any actual test cane and resulting residues need their own measured crop/waste exchanges before coverage can be complete."
