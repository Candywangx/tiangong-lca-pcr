review_metadata:
  semantic_boundary_decision: New narrower complete tracked non-road diesel
    sugarcane billet-harvester final integration boundary. Existing
    combine-thresher, root/tuber harvester and tractor PCRs differ in crop path
    and complete machine function; no equivalent sugarcane manufacturing
    material record found. Completed-component supply gates explicitly require
    earlier fabrication/coating/module/engine datasets even for same-site
    manufacture. Exclude other44129 parts, whole-stalk/wheeled routes without
    evidence extension and crop/farm service lifecycle. Narrow route is
    author-selected, not a universal manufacturer requirement. Legacy scaffold
    read-only; no mapping accepted.
  scientific_review: pending independent methodology review
