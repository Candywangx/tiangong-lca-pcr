      explanation: Welded-frame candidate b3090009 describes fabricated assembled
        structural frame/chassis; actual harvester main-chassis supplied finish
        and welded versus bolted modular scope are not established. Keep
        specific configured steel chassis blank pending supplier scope, not a
        rejection solely by classification label.
