dataset_production:
  collection_protocols:
    - protocol_id: cp_machine_mass
      process_id: "loom_build"
      flow_role: "accepted machine"
      record_type: "acceptance and weighing record"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted machine"
      temporal_coverage: "reference period"
      site_scope: "producing plant"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "scale record; acceptance certificate"
    - protocol_id: cp_bom
      process_id: "loom_build"
      flow_role: "frame, motor and controller"
      record_type: "BOM and receiving or transfer record"
      raw_fields: "part ID; supplier; configuration; installed count; measured unit mass"
      collection_method: "Reconcile installed parts to the accepted serial and weigh or use traceable mass records for the same configuration."
      unit: "kg"
      frequency: "each accepted machine"
      temporal_coverage: "reference period"
      site_scope: "producing plant and supplier"
      aggregation_rule: "installed mass / accepted machines"
      quality_evidence: "BOM revision; receiving and weighing records"
    - protocol_id: cp_first_fill
      process_id: "loom_build"
      flow_role: "installed oil"
      record_type: "fill record"
      raw_fields: "oil specification; filled mass or calibrated volume and density; spill"
      collection_method: "Weigh oil retained in the machine or convert calibrated fill volume using measured density."
      unit: "kg"
      frequency: "each accepted machine"
      temporal_coverage: "reference period"
      site_scope: "producing plant"
      aggregation_rule: "retained oil / accepted machines"
      quality_evidence: "fill sheet; calibration"
    - protocol_id: cp_electricity
      process_id: "loom_build"
      flow_role: "assembly and test electricity"
      record_type: "meter and production log"
      raw_fields: "meter readings; model; test hours; accepted and rejected counts"
      collection_method: "Meter relevant operations and remove unrelated loads; partition shared loads by recorded machine-hours."
      unit: "kWh"
      frequency: "batch or shift"
      temporal_coverage: "reference period"
      site_scope: "producing plant"
      aggregation_rule: "attributable electricity / accepted machines"
      quality_evidence: "meter record; allocation worksheet"
    - protocol_id: cp_scrap
      process_id: "loom_build"
      flow_role: "machining steel scrap"
      record_type: "waste weighing record"
      raw_fields: "mass; steel grade; job; treatment route; accepted count"
      collection_method: "Weigh segregated machining steel scrap attributable to the model."
      unit: "kg"
      frequency: "batch or shift"
      temporal_coverage: "reference period"
      site_scope: "producing plant"
      aggregation_rule: "attributable scrap / accepted machines"
      quality_evidence: "scale and transfer tickets"
  calculation_rules:
    - id: allocate_shared
      applies_to: "assembly_electricity, machining_steel_scrap"
      rule: "Attributable quantity per accepted loom = measured model-assigned quantity / accepted looms of that model; document physical allocation and rework."
      inputs:
        - cp_electricity
        - cp_scrap
        - "accepted count"
        - "allocation worksheet"
      output: "kWh or kg per accepted loom"
      source_ids:
        - epd-hub-core-pcr-2026
    - id: mass_check
      applies_to: "finished_loom"
      rule: "Compare M with installed component and first-fill masses, fitting losses and weighing uncertainty; investigate unexplained differences."
      inputs:
        - cp_machine_mass
        - cp_bom
        - cp_first_fill
        - cp_scrap
      output: "documented mass reconciliation"
      source_ids:
        - epd-hub-core-pcr-2026
  data_quality_requirements:
    - id: dq_configuration
      applies_to: "all rows"
      requirement: "Use one accepted configuration and traceable batch or serial; disclose make-or-buy and test yield."
      evidence: "BOM; production and acceptance records"
    - id: dq_completeness
      applies_to: "all rows"
      requirement: "Reconcile actual configured BOM and operations; add missing exchanges as atomic flows and disclose data gaps."
