review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved:
    inventory_flow_uuids:
      - row_id: drive_motor
        reason_code: manual_review_required
        explanation: "Generic public electric motor candidates cannot be assigned to the configured loom drive without a supplier motor specification; two direct reads have indistinguishable public identity fields."
      - row_id: electronic_controller
        reason_code: no_exact_candidate
        explanation: "The bounded public search returned no electronic loom controller or control unit; review the configured control hardware and repeat identity search."
      - row_id: loom_lubricating_oil
        reason_code: manual_review_required
        explanation: "Two generic lubricating-oil records have indistinguishable public identity fields and neither establishes the required first-fill mineral specification."
      - row_id: assembly_electricity
        reason_code: property_or_unit_mismatch
        explanation: "Returned electricity candidates use Net calorific value in MJ or are transmission services; no confirmed electrical-energy kWh flow."
    range_evidence_needs:
      - row_id: frame_parts
        need: "Independent boundary-compatible measurements of frame or full component mass per accepted complete loom."
      - row_id: drive_motor
        need: "Independent configuration-compatible motor mass observations per accepted complete loom."
      - row_id: loom_lubricating_oil
        need: "Independent first-fill oil mass observations for comparable loom technology."
      - row_id: assembly_electricity
        need: "At least two independent factory-gate assembly and acceptance-test electricity sources on the same per-machine basis."
      - row_id: machining_steel_scrap
        need: "Independent route-compatible machining scrap observations per accepted complete loom."
