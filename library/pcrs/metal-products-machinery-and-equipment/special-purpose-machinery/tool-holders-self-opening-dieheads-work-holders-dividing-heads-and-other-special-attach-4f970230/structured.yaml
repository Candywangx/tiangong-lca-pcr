      markdown: "## 5. System Boundary\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `gate` | foreground | Include actual receipt, site fabrication, mechanical/control assembly, integration, factory test/rework, common services, waste and packing through accepted release. |  |\n| `make_buy` | supplier_interface | For each component choose its actual make/buy state: complete bought toolholder/chuck/diehead/indexing/guide/cutting-head assembly includes embedded inputs once; own fabrication uses actual feedstocks and operations instead. Charge only subsequent site work. Pair internal transfers; do not list site-made intermediates as purchased imports. |  |\n| `factory_use` | production | Include actual factory dimensional/material/hardness/motion and actually applicable safety acceptance and documented manufacturing qualification trials, actual test media, cleaning water, electricity and consumed lubricant. Recovered trial materials uses measured returns and stocks. Customer machined/formed products and downstream host operation are not dedicated part manufacturing output. |  |\n| `bom_extension` | route | Cards are specific conditional anchors, not universal recipes. Audit actual BOM, formulations, test media, packaging, fuels, waste and species. Add each missing atomic actual exchange; document not_applicable only with absence evidence, unknown differs from zero. Unknown actual alloy, heat-treatment medium, coating, adhesive or trial-media formulation requires actual supplied-state evidence. |  |\n| `upstream` | links | Link supplier production and transport at actual grade, state, delivery geography/voltage and period; external treatment after measured waste transfer is distinct from site emissions. Without completed providers this factory package is not a complete cradle-to-gate result. |  |\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual input supplied grade/state/delivery interface |\n| starting_condition_role | Factory receipt boundary |\n| product_classification_scope | FULL tool holders, self-opening dieheads, work holders, dividing heads and special machine-tool attachments; holders for ANY handworking tool; other parts/accessories across ALL4421 hosts |\n| recursive_input_rule | Same-category bought precursor upstream once; subsequent site operations only; pair/cancel internal transfers |\n| upstream_dataset_requirement | Actual supplier/receiver grade/state/formulation/geography/technology/period; gaps explicit |\n| disclosure | Actual part supplied list/make-buy/fill-accessory versus trial-media roles/conditional exclusions/denominator/uncertainty |\n\n### Part architecture and supplied-interface matrix\n\n| Configuration | Actual interface | Limits |\n| --- | --- | --- |\n| Tool holder and any hand-tool holder | Actual taper/thread/SDS/collet/jaw interface, mechanical or closed hydraulic actuation | Held cutting tool separate; no universal oil fill/steel/carbide recipe |\n| Self-opening diehead | Actual head/trigger/slide/spring/host interface and supplied die status | Independent dies separate; automatic/manual cases and sets evidenced |\n| Workholder/indexing attachment | Actual chuck/jaw/cylinder or worm/gear/drive/controller and host fit | External host hardware not automatically shipped; grade/AC/DC/synthetic lubricant actual |\n| Laser/EDM/waterjet or other beam host part | Actual dedicated mechanical guide/head/cassette interface across full44211 | Independent optics/jewels/ceramics/electrode wire not automaticreference |\n| Metal machining/forming/nonremoving host parts | Actual dedicated clamp/crowning/slide/guide/part interface across44212–44218 | Independent cutting/forming tools/moulds and generic hardware separate |\n| New/repair supply and make/buy | Actual drawing/revision starting material/completion and accepted complete supplied part | Repair service not newpart recipe; no host/customer output denominator |\n\n"
