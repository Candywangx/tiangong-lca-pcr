allocation_rules:
  - rule_id: a_cohort
    applies_to: "all processes"
    rule: "Keep each model/configuration and its actual accepted output separate. Allocate shared factory operations by measured causal activity (machine time, actual load or area-time), disclose the basis and reconcile to the original period totals. Do not average different heater/control/textile configurations."
    source_ids: []
  - rule_id: a_scrap
    applies_to: "physical material records"
    rule: "Internal offcut or rework returns cancel as paired transfers, not free external inputs or coproduct credits. Include scrap conditioning and all rejected/reworked burden. External recycling or treatment uses documented receiver and allocation convention; do not assume avoided virgin material."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "reference product"
      record_type: "weighing"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted unit"
      temporal_coverage: "one production cohort"
      site_scope: "declared factory"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration; acceptance and inclusion list"
    - protocol_id: cp_material
      process_id: "all_processes"
      flow_role: "specific material/component/waste"
      record_type: "stock and batch records"
      raw_fields: "grade; fibre blend; supplier; delivered form; batch; opening/closing stock; issues; returns; scrap; reject; actual wet/dry mass; own species assay; destination; configuration; Q; N"
      collection_method: "Reconcile weighed receipts/issues/stocks, actual BOM, route and counted parts with calibrated batch weight. Each material/species has its own assay for each product/waste/release term. Pair internal return transfers. Count complete purchased component upstream once."
      unit: "kg"
      frequency: "each batch and period close"
      temporal_coverage: "same production period"
      site_scope: "actual factory operation and supplier interface"
      aggregation_rule: "attributable exchange / accepted units"
      quality_evidence: "weighbridge/scale; supplier composition; stock reconciliation; receiver evidence"
    - protocol_id: cp_utility
      process_id: "all_processes"
      flow_role: "electricity"
      record_type: "meter records"
      raw_fields: "site; period; units; voltage; imports; generation; exports; storage; returns; all submeters; configuration; causal allocation; Q; N"
      collection_method: "Read calibrated same-period meters and invoices. Assign actual textile/heater/assembly/test/dispatch loads first; shared service is only the unassigned site residual. Reconcile imports, actual generation, exports and storage changes without double counting. Investigate negative residuals with period/unit/combined meter uncertainty; never clip to zero. On-site generation needs its own fuel and species-specific release rows."
      unit: "kWh"
      frequency: "each test batch and period"
      temporal_coverage: "same production period"
      site_scope: "factory utility boundary"
      aggregation_rule: "attributable exchange / accepted units"
      quality_evidence: "meter calibration; bills; allocation and site reconciliation"
    - protocol_id: cp_chemistry
      process_id: "assembly"
      flow_role: "individual adhesive/solvent/species"
      record_type: "chemical and sampling records"
      raw_fields: "chemical grade; formulation; purity; wet/dry basis; actual inputs; stock changes; retained product; recovered solvent; capture media; measured destruction; waste liquid; actual air release; Q; N"
      collection_method: "Measure species mass for each term using its own matched assay; balance inputs plus reaction production against product retention, stocks, recovered material, captures, liquid/solid waste, actual destruction/reaction consumption and measured releases. Capture is not destruction; unexplained residual is not automatically air. Resolve closure against actual combined sampling, meter and allocation uncertainty."
      unit: "kg"
      frequency: "each batch and sampled campaign"
      temporal_coverage: "same production period"
      site_scope: "actual chemical use boundary"
      aggregation_rule: "attributable exchange / accepted units"
      quality_evidence: "SDS/formulation; assays; capture/treatment records; sampling method and uncertainty"
    - protocol_id: cp_water
      process_id: "test"
      flow_role: "water and wet-test discharge"
      record_type: "meter and moisture records"
      raw_fields: "purchased water; feed moisture; opening/closing water stocks; actual product moisture; evaporation; discharge; reaction production/consumption; paired internal returns; discharge assays; Q; N"
      collection_method: "Measure all actual water-bearing inputs, outputs and stock changes on matched period/basis. Each feed, product, scrap, sludge, wastewater and opening/closing stock term uses its own measured water fraction/moisture; each liquid volume conversion uses its own measured density. Gross wet-waste mass is not water mass; never apply one moisture percentage to all terms. Include reaction water and pair internal returns; independently measure discharge/evaporation where available and investigate residual against combined uncertainty. Pollutant mass uses each discharge species concentration and actual water quantity; do not infer pollutant amount from water alone."
      unit: "kg"
      frequency: "each wet-test batch and period"
      temporal_coverage: "same production period"
      site_scope: "factory wet operation"
      aggregation_rule: "attributable exchange / accepted units"
      quality_evidence: "meters; moisture samples; laboratory assay; treatment contract"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
    - id: water_balance
      applies_to: "test_water; test_wastewater; evaporated_water"
      rule: "Fresh water + feed moisture + opening water stock + reaction water generation = product moisture + scrap water + sludge water + external discharge water + evaporation + closing water stock + reaction water consumption. Each actual feed/product/scrap/sludge/wastewater/stock term uses its own measured water fraction and wet/dry basis; each liquid volume uses its own measured density. Gross wet waste is not water mass. Paired internal returns cancel. Reconcile the actual raw period before normalization and investigate closure with combined measurement, sampling and allocation uncertainty; no universal tolerance."
      inputs:
        - cp_water
        - "actual water fractions"
        - "actual liquid densities"
        - "matched raw-period water and reaction/stock records"
      output: "Closed actual raw-period water account"
      source_ids: []
  data_quality_requirements:
    - id: dq_trace
      applies_to: "all processes"
      requirement: "Retain actual model-specific BOM, make/buy matrix, test acceptance, raw totals, uncertainty, supplier interfaces and missing/zero/absent distinctions. Source patents are architecture examples; public product pages establish no factory operating factors."
      evidence: "Signed factory and supplier records"
    - id: dq_balance
      applies_to: "physical material and species records"
      requirement: "Material/species inputs plus reaction production equal outputs plus stock increase and reaction consumption after paired internal transfers cancel. Each product/scrap/sludge/wastewater/release term uses its own actual assay and wet/dry basis; never apply one alloy fraction to all terms. Investigate imbalance against measured combined uncertainty with no universal tolerance. Fuel carbon alone does not determine CO or NOx."
      evidence: "Assays; stock/reaction records; closure and uncertainty report"
validation_rules:
  - rule_id: v_reference
    applies_to: "reference product"
    rule: "Require actual domestic principal function, model/configuration qualifiers, accepted complete delivered inclusion list and calibrated net masses. N and D must cover the same accepted cohort; M = D/N; reconcile Q/N then q_item/M to Q/D. Do not mix configurations or include packaging/reject mass in D."
    source_ids: []
  - rule_id: v_routes
    applies_to: "all processes"
    rule: "Every actual heater conductor, insulation layer, textile, controller/sensor, cord/connector, adhesive and auxiliary has one evidenced make/buy interface. Complete purchased modules and their embedded inputs cannot coexist. Conditional alternatives require BOM evidence; not_applicable needs verified absence. All actual exchanges have atomic physical/chemical identities, matched unit support and provider interfaces; unresolved fields remain gaps."
    source_ids: []
  - rule_id: v_balances
    applies_to: "physical material and species records"
    rule: "Close each material/species and water account with matched own assays, moisture, stocks, reactions, product, scrap, waste liquid/solid, measured releases and paired internal returns. Distinguish recovery, capture and actual destruction. Investigate residual and uncertainty; missing composition or fate makes affected validation inconclusive."
    source_ids: []
  - rule_id: v_energy
    applies_to: "utility records"
    rule: "Same-period site reconciliation binds imports, generation, exports/storage and all assigned process loads. Shared services include only unassigned residual, with causal allocation. Negative residuals need investigation; consumer power/time, product-webpage mass and an incineration-specific electricity UUID are not factory defaults."
    source_ids: []
