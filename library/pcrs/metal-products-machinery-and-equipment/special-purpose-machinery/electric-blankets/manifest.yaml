  unresolved_inventory_uuids: Actual textile grade, heater architecture, insulation formulation, control and connection assemblies, chemicals, packaging, waste and elementary exchanges require direct-read matching identities; no broad substitute is adopted.
  unresolved_provider_links: Reference identity is a manufactured plant-gate product with no specified geography; actual supplier/site geography, grid voltage and provider technology must be collected.
  unresolved_route_recipe_evidence: Public sources establish example architectures only. Actual conductor alloy, separator/jacket resin formulation, textile fibre blend, controller electronics and make/buy decisions require factory BOM/drawings and supplier evidence.
  unresolved_quantitative_ranges: No factory yield, energy, process mass, lifetime or emission range is adopted. Collect actual configuration-specific period records.
  unresolved_classification_extensions: Passive blankets, medical therapy pads, seat heaters and heated clothing are outside this domestic-blanket boundary; broader technical patent examples do not establish classification membership.
