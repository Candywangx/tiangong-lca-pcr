allocation_rules:
  - rule_id: allocation_separate
    applies_to: "foreground_burden_allocation"
    rule: "First separate by configuration work orders and submeters; allocate shared demand by measured causal drivers. Rated host power, blade capacity and moved-soil quantity do not substitute for factory measurements."
    source_ids: []
  - rule_id: allocation_losses
    applies_to: "foreground_burden_allocation"
    rule: "Retain reject/rework, production scrap and captured-waste burdens; accepted denominator excludes rejects, packaging and unmatched configurations. Link wastes to actual providers; no default avoided virgin material credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "test_pack"
      flow_role: "reference_product"
      record_type: "weighing_record"
      raw_fields: "model; configuration; serial number; accepted net mass M; accepted count N"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "per accepted unit"
      temporal_coverage: "same production period"
      site_scope: "actual shipped host, installed equipment and specified retained fluids"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration, tare, configuration, retained fluid and acceptance records"
    - protocol_id: cp_fabrication
      process_id: "fabrication"
      flow_role: "atomic_exchanges"
      record_type: "production_record"
      raw_fields: "exchange identity; Q; N; configuration; period; meter units; opening/closing stock; own assay; wet/dry basis; provider; route"
      collection_method: "Meters, calibrated weighing, procurement, work orders, sampling and provider records; include reject/rework, separate test fuel/charging and retained fill."
      unit: "MJ for energy; kg for mass"
      frequency: "per batch and meter interval"
      temporal_coverage: "same production period"
      site_scope: "same factory/delivered configuration"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "measurements, sampling, stocks, allocation, supply and uncertainty"
    - protocol_id: cp_surface
      process_id: "surface"
      flow_role: "atomic_exchanges"
      record_type: "production_record"
      raw_fields: "exchange identity; Q; N; configuration; period; meter units; opening/closing stock; own assay; wet/dry basis; provider; route"
      collection_method: "Meters, calibrated weighing, procurement, work orders, sampling and provider records; include reject/rework, separate test fuel/charging and retained fill."
      unit: "MJ for energy; kg for mass"
      frequency: "per batch and meter interval"
      temporal_coverage: "same production period"
      site_scope: "same factory/delivered configuration"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "measurements, sampling, stocks, allocation, supply and uncertainty"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "atomic_exchanges"
      record_type: "production_record"
      raw_fields: "exchange identity; Q; N; configuration; period; meter units; opening/closing stock; own assay; wet/dry basis; provider; route"
      collection_method: "Meters, calibrated weighing, procurement, work orders, sampling and provider records; include reject/rework, separate test fuel/charging and retained fill."
      unit: "MJ for energy; kg for mass"
      frequency: "per batch and meter interval"
      temporal_coverage: "same production period"
      site_scope: "same factory/delivered configuration"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "measurements, sampling, stocks, allocation, supply and uncertainty"
    - protocol_id: cp_test_pack
      process_id: "test_pack"
      flow_role: "atomic_exchanges"
      record_type: "production_record"
