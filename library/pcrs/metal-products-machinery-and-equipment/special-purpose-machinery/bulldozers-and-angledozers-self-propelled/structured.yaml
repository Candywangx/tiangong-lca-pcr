validation_rules:
  - rule_id: validate_configuration
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm self-propelled dozer semantics, crawler/wheel and propulsion architecture; reference/inventory share shipped BOM; separate sold blades and later use."
    source_ids:
      - un-cpc3-dozers
      - cat-d6xe
      - komatsu-d61
      - shantui-de17
  - rule_id: validate_measurement
    applies_to: "foreground_dataset_conformance"
    rule: "Require positive accepted count/mass, finite exchanges and explicit conversion; verify rework/loss, term-specific water/species balances, shared residual and actual uncertainty."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Adopt UUIDs only with direct type, official bilingual name, reference property/unit, state/supply interface and geography confirmation; disclose unresolved identities/ranges for prepublication review."
    source_ids: []
  - rule_id: validate_denominator
    applies_to: "foreground_dataset_conformance"
    rule: "For each configuration/period Q retains reject/rework burden, N is accepted count, D is sum of calibrated accepted net masses, M = D/N, q_item = Q/N and q_ref = Q/D; denominator excludes packaging/rejects/other configurations and stocks/WIP use the same period."
    source_ids: []
  - rule_id: validate_utility_residual
    applies_to: "foreground_dataset_conformance"
    rule: "Same period/units: imports plus actual on-site generation minus exports/storage change equal assigned fabrication/treatment/assembly/test/dispatch plus unassigned residual and conversion losses; shared rows allocate only residual. Never add site meter to submeters; investigate negative residual/calibration/combined uncertainty without clipping."
    source_ids: []
  - rule_id: validate_charging_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Test charging reconciles imported energy, recuperated/exported energy, storage change and actual conversion losses. Diesel-electric is not battery-electric; capacity/rated charging power cannot replace meters; internal transfers cancel and on-site generation fuel/emissions count once."
    source_ids: []
  - rule_id: validate_water_closure
    applies_to: "foreground_dataset_conformance"
    rule: "Actual input moisture and dilution/cleaning/coolant water reconcile with product/fluid retention, wet scrap/sludge water, wastewater, evaporation and stocks, adjusted for reaction water production/consumption; paired returns cancel, each term uses its own water content and differences are investigated against actual combined sampling/measurement uncertainty."
    source_ids: []
  - rule_id: validate_contained_species
    applies_to: "foreground_dataset_conformance"
    rule: "For each metal/species apply each term’s own measured assay, concentration and wet/dry conversion to its own amount for input/product/scrap/slag/dust/sludge/wastewater/releases/stocks, including reactions changing species; gross mass is not element mass. No universal tolerance."
    source_ids: []
  - rule_id: validate_solvent_combustion
    applies_to: "foreground_dataset_conformance"
    rule: "Solvent supply reconciles retention/recovery/capture-media/stocks/actual destruction/non-air residual before confirming species air release. Actual fuel carbon closure cannot establish CO or NOx; each requires species test measurement or applicable evidenced factor and declared species convention."
    source_ids: []
  - rule_id: validate_foreground_route
    applies_to: "foreground_dataset_conformance"
    rule: "OEM equipment establishes architecture options, not factory grades or manufacturing recipes. Make/buy, each grade, cut/weld/thermal/coating route and actual test need work orders, certificates, SDS, supplier and foreground measurement evidence; not_applicable is distinct from unknown/zero."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing foreground package and process/lifecyclemodel projections of declared configuration"
  excluded_use: "Earthmoving service or universal power/capacity/lifetime equivalence; unreviewed configuration substitution"
  required_metadata: "shipped BOM; propulsion/running gear; each make/buy choice; net mass/fluids; plant/period; energy interfaces; tests/acceptance"
  required_quality_disclosure: "unknown UUIDs/ranges; source conflicts; route gaps; measurement/allocation uncertainty"
  update_trigger: "architecture, configuration, supplier, chemistry/grade, plant route or energy-interface change"
