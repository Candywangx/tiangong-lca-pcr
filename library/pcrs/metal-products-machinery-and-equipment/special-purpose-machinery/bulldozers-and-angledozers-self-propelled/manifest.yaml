    explanation: Direct-read Product flow is manufactured finished self-propelled bulldozer or angledozer at plant with Mass reference and exact official bilingual names. Generic comment wording does not override manufactured-product state. Concrete configuration, factory and supply geography remain required.
  unresolved_inventory_uuids: Only complete dozer reference, conditional bought complete blade and matching CN medium-voltage user electricity identities are adopted after direct reads. Grade-specific materials, bought host systems, chemicals, fuels, wastes and emission species remain explicit identity gaps pending exact checks. A confirmed blade flow cannot substitute for host output. Generic hot-rolled plate direct read lists Q345/Q355 and does not confirm S355J2 or AR400; no exact-grade adoption. Diesel search candidate is an Elementary flow with Mass reference, not purchased ULSD product fuel, and is rejected for test-fuel input.
  unresolved_quantitative_ranges: No universal machine mass, factory energy, yield, lifetime, soil-moving performance or species emission range is established. Require measured same-configuration period exchanges and accepted net mass.
  evidence_limitations: OEM examples support distinct architectures and actual equipment options, not universal manufacturing recipes or quantitative inventory. Shantui battery-energy narrative and table conflict; no capacity number adopted. Wheel configuration is supported by original 824 equipment tables, while each actual wheel configuration and true battery-hybrid configuration still requires its own BOM evidence rather than inferred track or battery architecture. Manufacturer sources do not establish actual factory tests or material grades; foreground records remain mandatory.
