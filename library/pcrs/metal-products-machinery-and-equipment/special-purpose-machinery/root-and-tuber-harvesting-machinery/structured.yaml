  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_config
      applies_to: "all rows"
      requirement: "Trace each input and test to exact configuration; reconcile supplier assembly boundaries, crop intake and self-propelled options."
      evidence: "configuration BOM and serials"
    - id: quality_balance
      applies_to: "material and utility records"
      requirement: "Reconcile input stock, net output, waste and losses; explain unmatched quantities, meter coverage, density/reference-state conversions and uncertainty. No unsupported loss factor is allowed."
      evidence: "weighing/stock ledger and meter records"
    - id: quality_coverage
      applies_to: "all processes"
      requirement: "Cover declared site and continuous reporting period; disclose start/end, outsourcing, missing months, omissions and excluded stages. Establish QA limits from actual configuration records; public model descriptions supply no intensity range."
      evidence: "order coverage, calibration and completeness reconciliation"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Require complete delivered lifting configuration, positive measured M with cp_mass, empty cargo bunker and stated fill/tare; reject payload capacity as machine mass and incomplete-kit outputs."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Verify one atomic exchange, correct direction/type, property, unit, route and public identity; separate treatment wastewater from resource water and emitted pollutants. Blank UUIDs require explicit identity resolution before release of a fully linked dataset."
    source_ids: []
  - rule_id: validate_amount
    applies_to: "all inventory rows"
    rule: "Check cp links and normalization against accepted output, stock and rework. Require independent meter coverage and no duplicate supplier assembly or internal-transfer burden. Unknown quantity is pending evidence, not zero."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "combustion rows"
    rule: "Activate only when actual factory combustion and attributable measured emission mass exist; verify fossil/biogenic source and air subcompartment. Add other measured pollutants as separate substance/medium rows; never identify NO as NO2 or N2O."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing process dataset for declared complete machinery"
  downstream_use: "secondary_dataset; background_dataset, only after qualified review and with disclosed upstream coverage"
  allowed_use: "Manufacturing supply-chain modelling for the same configured product, declared gate, mass property and production period"
  excluded_use: "Per-hectare crop comparisons, lifetime harvesting efficiency, soil-impact inference, incomplete machines, other crop intakes without reconfiguration, complete cradle-to-gate claims without linked upstream coverage"
  required_metadata: "Exact product configuration and qualifiers; geography/site/period; measured M; supplier boundaries; process route; collection/normalization records; background links; allocation and exclusions"
  required_quality_disclosure: "Missing identities and amounts, measurement uncertainty, route-specific inactive rows, actual BOM extensions, historical source limits, outsourced and unlinked upstream stages"
  update_trigger: "Configuration/intake or powertrain change; supplier assembly boundary or coating change; revised M/fill state; changed site energy supply or reporting period; resolved evidence gaps"
data_sources:
  - id: "grimme-manufacturing-history"
