allocation_rules:
  - rule_id: allocation_separate
    applies_to: "shared production"
    rule: "Separate orders by configuration and use direct meters, issue records and work orders first. For inseparable shared utility use measured machine-hours or metered load with documented causal basis; calculate order share as its measured driver divided by the sum of all covered order drivers. Do not use machine count across different configurations as an unexplained proxy."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "waste outputs"
    rule: "Internal reused offcuts, powder and process water are internal transfers with fresh-input and stock reconciliation. Record exported waste quantity and destination; no automatic avoided virgin steel or disposal credit. If a valuable co-product exists, document status, separate process burdens where possible and scientifically review any residual allocation before claiming comparability."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted net machine"
      record_type: "weighing_record"
      raw_fields: "serial; model; configuration; accepted net mass M; scale_id; fill_state; packaging_tare"
      collection_method: "Weigh the accepted complete machine using a calibrated platform scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each machine or representative configuration batch"
      temporal_coverage: "same manufacturing period as orders"
      site_scope: "declared manufacturing site and configuration"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "scale calibration, tare and acceptance record"
    - protocol_id: cp_fabrication
