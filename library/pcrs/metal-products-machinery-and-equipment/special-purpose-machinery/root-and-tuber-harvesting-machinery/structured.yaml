system_boundary:
  rules:
    - rule_id: boundary_routes
      applies_to: "all processes"
      rule: "Include actual in-house operations and factory acceptance; retain subcontracted finishing as a linked service only with supplier boundary and allocated exchange evidence. Required integration does not require making every component in-house."
      source_ids:
        - grimme-manufacturing-history
    - rule_id: boundary_extension
      applies_to: "all inventory rows"
      rule: "Expand the actual BOM and process list into additional atomic exchanges, including fitted axles, fasteners, sensors, specific first-fill coolant and refrigerant, actual welding gas and wastes when present. Every absence needs configuration/process evidence; unknown is not zero."
      source_ids:
        - grimme-multicrop
    - rule_id: boundary_exclusions
      applies_to: "reference product"
      rule: "Exclude lifetime farm operation, crop outputs, agronomic effects and separately supplied tractor; distinguish factory test consumption from retained dispatch fill and subsequent operation."
      source_ids:
        - ropa-tiger
