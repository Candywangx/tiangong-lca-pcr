review_metadata:
  scientific_review: "pending"
  semantic_boundary_decision: "New complete root/tuber soil-lifting harvesting machinery, configured with crop separation/conveying; trailed/mounted/self-propelled configurations kept separate. Excludes standalone pickup-cleaner-loaders, farm harvesting services, crop yields and separately supplied tractors. No overlapping material machinery PCR found; retired leaf identity is not reused. Classification reference is context, not an accepted mapping."
  unresolved_flow_uuids:
    - row_id: "fabrication_power"
      flow: "Grid alternating-current electricity at factory intake"
      reason: "Meter fabrication electricity at declared intake voltage and supply geography. The retrieved 35–330 kV flow is not assigned to unspecified voltage."
    - row_id: "joining_power"
      flow: "Grid alternating-current electricity at factory intake"
      reason: "Measure welding-cell and attributable ventilation electricity without re-counting the fabrication meter."
    - row_id: "welding_slag"
      flow: "Solid carbon-steel flux-cored welding slag"
      reason: "Only collected welding slag; weigh and record composition and treatment route. Do not use smelting slag as identity."
    - row_id: "blasting_shot"
      flow: "Cast steel spherical blasting shot"
      reason: "Only if spherical steel shot is consumed; record make-up mass and exclude internal circulating stock. The mixed shot/grit display is not an exact identity."
    - row_id: "finishing_power"
      flow: "Grid alternating-current electricity at factory intake"
      reason: "Meter actual blasting, washing and coating electricity with route-specific submeter coverage."
    - row_id: "powder_residue"
      flow: "Unrecovered solid coating powder overspray"
      reason: "Only powder overspray leaving for treatment; subtract internal recovery, record resin and destination. Retrieved public waste is China-site limited."
    - row_id: "rinse_wastewater"
      flow: "Metal-part cleaning rinse wastewater sent to treatment"
      reason: "Only wastewater transferred to treatment; record contamination and outlet quantity. Do not substitute resource water or a direct-to-water emission."
    - row_id: "lifting_share"
      flow: "Finished steel root-crop lifting share"
      reason: "Only bought-in finished steel lifting share of declared geometry and heat treatment; internally fabricated shares are tracked through fabrication."
    - row_id: "sieving_bar"
      flow: "Finished steel sieving-web rod"
      reason: "Only installed bought-in steel rod of declared pitch and surface treatment; exclude rods already inside a purchased complete web."
    - row_id: "conveyor_belt"
      flow: "Vulcanized rubber crop conveyor belt"
      reason: "Only installed conveyor belt; record reinforcement, rubber grade and mass. Broad conveyor/transmission class is not assigned as a specific belt identity."
    - row_id: "separator_finger"
      flow: "Vulcanized rubber crop separator finger"
      reason: "Only installed rubber separator finger; declare geometry, rubber specification and weighed mass."
    - row_id: "ball_bearing"
      flow: "Finished steel ball bearing"
      reason: "Only fitted steel ball bearing; record designation and supplier mass, distinct from roller bearings."
    - row_id: "drive_gearbox"
      flow: "Finished agricultural-harvester mechanical gearbox"
      reason: "Only installed mechanical gearbox; declare ratio, housing and fill boundary; a wind-turbine gearbox is not suitable."
    - row_id: "hydraulic_cylinder"
      flow: "Finished double-acting hydraulic cylinder"
      reason: "Only fitted hydraulic cylinder; declare bore, stroke and rated pressure; do not substitute pneumatic-cylinder class."
    - row_id: "hydraulic_pump"
      flow: "Finished agricultural-machine hydraulic pump"
      reason: "Only fitted on-machine hydraulic pump; state displacement and included motor boundary. Tractor hydraulic supply is outside product manufacture."
    - row_id: "hydraulic_motor"
      flow: "Finished hydraulic crop-web drive motor"
      reason: "Only installed hydraulic drive motor, with displacement and supplier assembly boundary."
    - row_id: "copper_cable"
      flow: "Insulated copper control cable"
      reason: "Only installed copper control cable; collect weighed mass and insulation type. Retrieved energy-property cable cannot represent this mass exchange."
    - row_id: "electronic_controller"
      flow: "Agricultural-harvester electronic control module"
      reason: "Only installed specific controller module; record hardware revision and mass. Machine-tool PLC/cabinet collection is not a harvester module identity."
    - row_id: "diesel_engine"
      flow: "Finished non-road diesel engine for self-propelled harvester"
      reason: "Only installed self-propelled engine; record model, emission configuration and measured net assembly mass. Retrieved engine has Number of items, not a verified mass property."
    - row_id: "pneumatic_tyre"
      flow: "New pneumatic rubber agricultural tyre"
      reason: "Only fitted agricultural pneumatic rubber tyre; record size, construction and weighed mass. Generic Tire has count basis and unspecified rubber/metal identity."
    - row_id: "steel_rim"
      flow: "Steel agricultural-harvester wheel rim"
      reason: "Only fitted wheel rim; record dimensions and load rating. Public trailer rim does not cover an unspecified self-propelled rim."
    - row_id: "operator_cab"
      flow: "Agricultural-harvester operator cab assembly"
      reason: "Only fitted bought-in cab; record glazing and fittings included. Add refrigerant charge as a separate chemical-specific row if actual air conditioning is installed."
    - row_id: "assembly_power"
      flow: "Grid alternating-current electricity at factory intake"
      reason: "Meter assembly and factory functional-test electricity; exclude duplicated utility totals and field operating energy."
  unresolved_quantity_ranges:
    - "No verified manufacturing exchange intensity or machine-mass ranges in acquired manufacturer evidence; collect site-specific amounts and M, and establish configuration-specific QA limits after scientific review."
  evidence_limitations:
    - "2015 retained GRIMME brochure supports historical process example only; no universal route, lifetime, weight or numerical factor inferred."
    - "GRIMME EVO 280 and ROPA Tiger 6S descriptions support configuration distinction, not factory exchange amounts."
    - "Manufacturer statements of performance are not accepted as quantitative inventory or methodology approval."
