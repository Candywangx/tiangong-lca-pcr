review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  reference_flow_identity:
    status: unresolved
    unresolved_support_fields:
      - reference_product_flow_uuid
  unresolved_reference_flow_uuid: Full rubber/plastics machinery category identity remains unresolved. Mass/kg methodology is explicit; neither parts, one subtype, polymer outputs nor EOL treatment may replace it.
  unresolved_inventory_uuids: All distinct atomic identities actually searched; only explicitly UUID-bearing cards have adopted direct-read identities. Specific completed modules, furnace charge, CrO3, PET sheet, SBR/carbon black, HDPE, grease, plating/cleaning wastes and trial PP scrap retain actual identity gaps. Wrong classification, supplied completion, chemistry, type/state or native interface is not overridden.
  unresolved_factory_recipe: Primary originals establish qualitative alternative architectures, not BOM/formulation/quantity. Actual supplied scope, mould inclusion, make/buy, alloys, hard-surface/nitriding or plating route, insulation, trial media/additives/cure, retained fills and providers need factory evidence. Conditional cards are not universal recipes.
  conditional_sulfur_interface: Sulphur anchor applies only to actual compatible CN conventional sulphur-curing tyre-rubber compound factory trials and matching supplied elemental sulphur interface; other compounds/sulphur systems or incompatible providers cannot use that UUID.
  unresolved_provider_links: Each upstream and receiver dataset must match actual grade, completion, technology, geography, time and interface. A factory foreground package without completed links is not a complete cradle-to-gate footprint.
  unresolved_quantitative_ranges: No machine mass, power, throughput, cycle, energy saving, yield, lifetime or user product weight is a manufacturing default.
  identity_rejections:
    - Plastic/rubber finished products, hard-material machine tools44222 and machinery parts44949 do not match full reference machinery.
    - Conflicting metal bilingual identities, iron-ore-classified cast iron, organic-classified chromium trioxide and graphite-preparation-classified carbon black remain unresolved.
    - PET resin/granulate is not actual thermoforming sheet; SBR sealing cover, SBS and latex are not a generic primary SBR charge.
    - Cable with Energy/MJ is rejected; adopted low-voltage cable uses native Length/m and own measured linear density if mass conversion needed.
    - State20 PP Waste is not an adopted published Waste identity; generic sludge, anode-refining residue or unconditioned Sb/Cr mixed scrap is not Cr plating sludge.
    - PAO fully synthetic lubricant is not mineral lubricating oil. Wax/solvent lubricant is not generic grease; wind gearbox/rotor, parts/blanks, air service and generic CTUe/cardinality proxies are not completed modules.
