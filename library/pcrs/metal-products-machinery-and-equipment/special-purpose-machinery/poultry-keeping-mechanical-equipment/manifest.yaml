      reason: "English/Chinese searches did not establish one finished polypropylene poultry pan body; PP resin is not the finished component."
    - row_id: "nylon_support"
      flow: "Finished nylon poultry-feed pan top support"
      reason: "Polyamide resin candidates do not establish the finished support and the product sheet does not specify nylon grade."
