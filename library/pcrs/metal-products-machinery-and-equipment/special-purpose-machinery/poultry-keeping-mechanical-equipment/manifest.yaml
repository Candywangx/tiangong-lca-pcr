  scientific_review: "pending"
  semantic_boundary_decision: "New complete automatic poultry dry-feed conveying/distribution equipment, auger/pan and chain/trough configurations separately recorded. No existing material PCR with this boundary found; related incubator/brooder and animal-feed preparation leaves are scaffolds, excluded. Excludes drinking, manure/egg handling and house climate. Suggested semantic slug retained with explicitly narrower content scope; does not claim all 44194 covered, no accepted mapping written and retired poultry-keeping-machinery id not promoted."
  unresolved_flow_uuids:
    - row_id: "galvanized_sheet"
      flow: "Hot-dip-zinc-coated carbon-steel sheet"
      reason: "Directly read hot-dip-galvanizing flow represents coating fabricated steel, not the specified flat sheet stock; corrugated sheet and frames are different products."
    - row_id: "carbon_strip"
      flow: "Uncoated cold-rolled carbon-steel strip for feed auger forming"
      reason: "Directly read strip candidate declares a hot-rolling route and contains conflicting cold-roll prose; the specified cold-rolled stock identity is not established."
    - row_id: "zinc_steel_offcut"
      flow: "Zinc-coated carbon-steel cutting offcuts"
      reason: "Bounded English and Chinese searches did not establish zinc-coated offcuts with matching composition; uncoated steel scrap or stainless steel are not substituted."
    - row_id: "pa6_resin"
      flow: "Unfilled polyamide-6 molding granulate"
      reason: "Direct public PA6 candidates describe representative insulation polymers or an example polymer mix potentially different from nylon 6; matching actual unfilled PA6 feedstock identity remains unresolved."
    - row_id: "pa6_scrap"
      flow: "Segregated polyamide-6 molding scrap"
      reason: "Bounded searches returned nylon product/fabric records, not a PA6 molding-scrap waste identity with this outlet boundary."
    - row_id: "cooling_effluent"
      flow: "Molding cooling-water blowdown sent to treatment"
      reason: "Directly read wastewater candidate is washing effluent from electrolytic manganese-slag materials; its route does not match molding cooling-water blowdown."
    - row_id: "galvanized_tube"
      flow: "Finished galvanized-steel poultry-feed conveying tube"
      reason: "Directly read steel-pipe candidate establishes welded pipe but no galvanizing or poultry-feed tube finish/completeness."
    - row_id: "conveying_auger"
      flow: "Finished steel poultry-feed conveying auger"
      reason: "Refined auger searches retrieved underground conveyors or dryer subassemblies, not the declared finished feed spiral."
    - row_id: "feed_chain"
      flow: "Finished steel poultry-feed conveying chain"
      reason: "English/Chinese searches retrieved conveyor services, rubber belts or component collections, not one specified feed-conveying steel chain."
    - row_id: "feed_hopper"
      flow: "Finished galvanized-steel poultry-feed inlet hopper"
      reason: "Searches retrieved feed material or whole poultry machinery, not the specified purchased hopper."
    - row_id: "feed_trough"
