allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared operations"
    rule: "Separate orders by line architecture and exact layout/BOM. Prefer directly measured stock, molding cycles and utility records. For a shared operation, collect and justify a causal order driver such as actual metered load or machine-hours, and allocate the attributable total in proportion to each order driver divided by the complete covered driver sum. Preserve all covered orders and unfinished stock; do not use unmeasured birds served as a driver."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "regrind and waste"
    rule: "Reconcile internal resin regrind and metal returns without treating each circulation as fresh purchase. Exported offcuts/purge carry actual mass and destination; no automatic avoided-material credit is assigned. Separately identify any saleable co-product, first divide physical operations where possible, and review residual allocation with the collected basis."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted net equipment set"
      record_type: "weighing_record"
      raw_fields: "model; configuration; serial number; accepted net mass M; layout_BOM; sectional_delivery; scale_id; packing_tare; completeness; acceptance_id"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each set or representative same-configuration batch"
      temporal_coverage: "same continuous reporting manufacturing period"
      site_scope: "declared factory and same configured delivery set"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibrated weighing, tare, complete sectional BOM and acceptance receipts"
    - protocol_id: cp_metal
      process_id: "metal"
      flow_role: "each specific atomic exchange"
      record_type: "measured_order_record"
      raw_fields: "order; serial/layout; exact_item/grade; supplier_boundary; issues; returns; stock_change; exchange_amount; accepted_count; part_mass; meter_unit; waste_destination; shared_driver"
      collection_method: "Weigh drawing-specific sheet/strip issues and returns, reconcile good part mass and separately collected coated/uncoated offcuts; meter cutting/forming stations."
      unit: "kg or MJ as the row declares"
      frequency: "each order and batch"
      temporal_coverage: "declared continuous manufacturing period"
      site_scope: "Sheet fabrication and auger forming"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "part weighing, order BOM, calibrated meters and outlet receipts"
    - protocol_id: cp_molding
      process_id: "molding"
      flow_role: "each specific atomic exchange"
      record_type: "measured_order_record"
      raw_fields: "order; serial/layout; exact_item/grade; supplier_boundary; issues; returns; stock_change; exchange_amount; accepted_count; part_mass; meter_unit; waste_destination; shared_driver"
      collection_method: "Record mold/cavity, polymer grade, fresh resin issues, internal regrind, good parts, purge/trim waste and reject mass by resin; meter press/drying power and only fresh treated cooling-water makeup and actual effluent."
      unit: "kg or MJ as the row declares"
      frequency: "each order and batch"
      temporal_coverage: "declared continuous manufacturing period"
      site_scope: "Polymer part molding"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "part weighing, order BOM, calibrated meters and outlet receipts"
    - protocol_id: cp_mechanical
      process_id: "mechanical"
      flow_role: "each specific atomic exchange"
      record_type: "measured_order_record"
      raw_fields: "order; serial/layout; exact_item/grade; supplier_boundary; issues; returns; stock_change; exchange_amount; accepted_count; part_mass; meter_unit; waste_destination; shared_driver"
      collection_method: "Trace supplier module boundaries, quantities and measured net part masses to the layout BOM; reconcile in-house transfers separately from purchases, fastener issues and actual assembly power."
      unit: "kg or MJ as the row declares"
      frequency: "each order and batch"
      temporal_coverage: "declared continuous manufacturing period"
      site_scope: "Feed-distribution mechanical assembly"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "part weighing, order BOM, calibrated meters and outlet receipts"
    - protocol_id: cp_controls
      process_id: "controls"
      flow_role: "each specific atomic exchange"
      record_type: "measured_order_record"
      raw_fields: "order; serial/layout; exact_item/grade; supplier_boundary; issues; returns; stock_change; exchange_amount; accepted_count; part_mass; meter_unit; waste_destination; shared_driver"
      collection_method: "Record electronics revision and supplier completeness, copper cable construction and actual mass, terminal/connector additions and electrical test records; distinguish embedded controls already in the drive from separately supplied controls."
      unit: "kg or MJ as the row declares"
      frequency: "each order and batch"
      temporal_coverage: "declared continuous manufacturing period"
      site_scope: "Dedicated controls and wiring integration"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "part weighing, order BOM, calibrated meters and outlet receipts"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "each specific atomic exchange"
      record_type: "measured_order_record"
      raw_fields: "order; serial/layout; exact_item/grade; supplier_boundary; issues; returns; stock_change; exchange_amount; accepted_count; part_mass; meter_unit; waste_destination; shared_driver"
      collection_method: "Collect serialized or order-linked factory test results and measured electricity; weigh all delivered equipment components with calibrated scales and packing tare records, reconcile exact layout and reject/rework records."
      unit: "kg or MJ as the row declares"
      frequency: "each order and batch"
      temporal_coverage: "declared continuous manufacturing period"
      site_scope: "Factory acceptance and completeness reconciliation"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "part weighing, order BOM, calibrated meters and outlet receipts"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "each specific atomic exchange"
      record_type: "measured_order_record"
      raw_fields: "order; serial/layout; exact_item/grade; supplier_boundary; issues; returns; stock_change; exchange_amount; accepted_count; part_mass; meter_unit; waste_destination; shared_driver"
      collection_method: "Weigh supplied timber and LDPE film per dispatch set and record returns; distinguish equipment supports from transport supports."
      unit: "kg or MJ as the row declares"
      frequency: "each order and batch"
      temporal_coverage: "declared continuous manufacturing period"
      site_scope: "Dispatch packaging"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "part weighing, order BOM, calibrated meters and outlet receipts"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "all rows"
      requirement: "Trace full layout, feed-point count, delivered sections, polymer grades, metal coatings and module completeness. Retain unresolved supplier material specifications as gaps rather than assuming a universal recipe."
      evidence: "drawings, BOM and supplier specifications"
    - id: quality_balance
      applies_to: "stock and utilities"
      requirement: "Reconcile metal, polymer, purchased assemblies, accepted net mass, regrind, rejects, waste and stock change. Explain uncertainty and measured length/density conversions. Account for drive/control tests without counting farm power."
      evidence: "weighing, issues/returns, meters and waste transfer"
    - id: quality_coverage
      applies_to: "all processes"
      requirement: "State site and continuous period, provider links and outsourced gates. Establish configuration-specific QA limits from measured records; these product descriptions provide no manufacturing intensity or net equipment mass range. Missing important amounts remain pending collection."
      evidence: "order coverage, calibration, boundary and gap list"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Require complete configured automatic dry-feed equipment, positive measured M and all declared delivered sections/supports. Reject incomplete spares and other poultry-keeping functions. Disclose unperformed site tests and exclude feed/packaging from net equipment mass."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Require one atomic physical exchange and matching public flow identity, property, unit, polymer grade, metal finish and component completeness. Do not substitute generic resin for a finished part, galvanizing for sheet stock, or energy-property cable for cable mass. Resolve absent identities before releasing a fully linked dataset."
    source_ids: []
  - rule_id: validate_collection
    applies_to: "all inventory rows"
    rule: "Verify linked protocols, q_item/M normalization, same layout denominator, stock/rework allocation and utility meter coverage. Purchased complete modules and internal molding/fabrication transfers are not double counted; extend the inventory to every actual omitted atomic input/output."
    source_ids: []
  - rule_id: validate_release
    applies_to: "measured environmental releases"
    rule: "Add demonstrated manufacturing releases individually with substance, fossil/biogenic origin where relevant, receiving medium/subcompartment and measured quantity or verified applicable factor. Treatment wastewater is a technosphere outlet; poultry manure and farm dust are outside this manufacture gate. No inferred zero for unmeasured relevant releases."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground configured automatic poultry dry-feed equipment manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset after qualified review and explicit upstream coverage"
  allowed_use: "Supply-chain manufacture for matching layout, polymer/metal specification, module completeness, site/period and gates"
  excluded_use: "Per-bird feed/yield comparison; installed house-service equivalence; drinking/manure/egg/climate/incubation proxy; complete cradle-to-gate without supplier linkage"
  required_metadata: "Reference qualifiers; measured M; layout and sectional delivery completeness; supplier material grades and boundaries; factory/site-test evidence; actual route, period/gates, collection/allocation and background links"
  required_quality_disclosure: "Missing identities/amounts, measurement uncertainty, inactive routes, untested site functions, source date/scope, outsourcing and upstream gaps"
  update_trigger: "Changed layout/feed-point count, drive/control architecture, polymer grade or metal coating, module completeness, measured M, site/supply or resolved evidence gaps"
data_sources:
  - id: "bd-feeder"
    type: "handbook"
    reference: "[AugerMatic — The feeding system for successful poultry growing](https://cdn.bigdutchman.com/fileadmin/content/poultry/products/en/poultry-growing-Augermatic-Big-Dutchman-en.pdf)"
    used_for: "en 11/2015, PDF page 2 component list/diagram: hopper, tube/auger, pan, drive/sensor and suspension. Historical configuration example only; no current capacity, farm benefit, net machine weight or manufacturing amount inferred."
  - id: "roxell-pan"
    type: "handbook"
    reference: "[Boozzter technical information](https://www.roxell.com/sites/default/files/roxell/TD_Boozzter_EN.pdf)"
    used_for: "Undated sheet, PDF creation metadata 2025-02-10; PDF page 1 Technical info material rows identify a PP pan, nylon support and galvanized steel tube. Grade/formulation, manufacturing quantities and complete-equipment mass are not supplied. Feed contents and animal weights are not equipment mass."
  - id: "roxell-chain"
    type: "literature"
    reference: "[Fortena chain feeding system for broiler breeders](https://www.roxell.com/fortena-chain-feeding-system)"
    used_for: "Named management/support, trough-connector and corner-wheel paragraphs: separate chain/trough architecture, polyamide connectors, bearing corner units and control/support options. Product example, not universal PA6 grade, maintenance prescription or manufacturing range."
  - id: "roxell-factory"
    type: "literature"
    reference: "[Innovation, a cornerstone of Roxell’s corporate culture](https://www.roxell.com/innovation)"
    used_for: "Infrastructure for innovation: injection molding and molds in the development facility. Candidate technique only; no claim of mandatory commercial molding, machine energy intensity or industry production recipe."
