allocation_rules:
  - rule_id: allocation_rejects
    applies_to: "all inventory rows"
    rule: "Assign specific jobs and meters before allocation. Keep all attributable rejects, rework and repeated factory tests in Q; denominator includes only N accepted units of one configuration and their calibrated net masses. Do not pool unlike families or use packaging/reject mass. For shared processing use measured machine time, test duration or another documented physical cause, with complete reconciliation."
    source_ids: []
  - rule_id: scrap_transfer
    applies_to: "swarf; weld_dust; coat_sludge"
    rule: "Record each external recovery/treatment transfer, composition and actual destination. Internal rework and reusable oil transfers cancel as paired internal records. Do not credit avoided virgin metal or energy without an explicitly evidenced, separately disclosed downstream method."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "release"
      flow_role: "reference_product"
      record_type: "acceptance/weighing"
      raw_fields: "model; configuration; serial number; accepted net mass M; accepted N; summed accepted mass D; weighing tare; retained delivery fill"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted machine"
      temporal_coverage: "same accepted cohort and Q period"
      site_scope: "accepted configuration at factory gate"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "scale calibration, tare, module/BOM reconciliation and acceptance signature"
    - protocol_id: cp_material
      process_id: "all"
      flow_role: "specific raw stock/module/chemical"
      record_type: "material issue/BOM"
      raw_fields: "row id; grade; formulation; composition; moisture; supplier state; opening/closing stock; purchase/issue/return; serial/job; Q; N; D"
      collection_method: "Reconcile received stock, issues and returns to jobs and make/buy BOM; weigh actual modules and material, retain reject/rework quantities. Each material balance term carries its own assay and wet/dry basis; no utility is subjected to a material assay. Q is attributable period exchange including rejects/rework; derive q_item = Q/N and M = D/N only for this configuration."
      unit: "kg"
      frequency: "each issue and period closure"
      temporal_coverage: "matched production and acceptance period"
      site_scope: "actual performed factory stages and supplier interface"
      aggregation_rule: "attributable material / accepted machines"
      quality_evidence: "certificates, SDS, receipts, calibrated weighing, stock reconciliation"
    - protocol_id: cp_energy
      process_id: "all"
      flow_role: "individual electricity/fuel exchange"
      record_type: "meter/fuel ledger"
      raw_fields: "row id; import/generation/export; voltage/grid/year; submeter; site meter; period; Q; job/load duration; storage change; N; D"
      collection_method: "Read calibrated process meters and same-period site balances; retain measured test and rework load. Convert kWh to MJ with verified unit group; fuel retains actual mass/volume and measured calorific value. Allocate only residual unassigned services by measured causal activity. Q includes attributable reject/rework load; q_item = Q/N for same configuration."
      unit: "MJ"
      frequency: "continuous meters and each test/job"
      temporal_coverage: "same period as N and D"
      site_scope: "factory meter boundary; actual supplier voltage and geography"
      aggregation_rule: "attributable electricity / accepted machines"
      quality_evidence: "meter calibration, electricity invoices, fuel certificates and full site reconciliation"
    - protocol_id: cp_water
      process_id: "all"
      flow_role: "each water exchange"
      record_type: "water meter/bath record"
      raw_fields: "row id; source/treatment; density/temperature; input moisture of each material; retained water; stock; return; effluent; evaporation; actual reaction water; Q; N; D"
      collection_method: "Meter each external supply and discharge; convert actual volume using measured density. Sample moisture for each physical term independently; maintain paired internal returns and actual stock/reaction records. No assumption of universal water density. Q includes attributable reject/rework demand for same configuration; q_item = Q/N."
      unit: "kg"
      frequency: "each batch/test and matched period"
      temporal_coverage: "same period as material and accepted mass"
      site_scope: "actual factory supply, test circuit and treatment transfer"
      aggregation_rule: "attributable water / accepted machines"
      quality_evidence: "meter calibration, measured density, moisture samples and closure uncertainty"
    - protocol_id: cp_waste
      process_id: "all"
      flow_role: "one specific residue per row"
      record_type: "waste consignment/weighing"
      raw_fields: "row id; gross/wet/dry mass; moisture; each contained-element assay; attached oil; opening/closing stock; paired rework return; destination; Q; N; D"
      collection_method: "Weigh external transfer and retain receiver treatment interface; separately sample moisture, oil and actual metals for each residue, including sludge and effluent. Internally returned scrap/oil is paired and not an external credit. Q is attributable period external waste including rejects; q_item = Q/N."
      unit: "kg"
      frequency: "each consignment and period stock"
      temporal_coverage: "same production period"
      site_scope: "factory-to-treatment transfer"
      aggregation_rule: "attributable waste / accepted machines"
      quality_evidence: "weighbridge calibration, laboratory assays, moisture basis and receiver receipts"
    - protocol_id: cp_emission
      process_id: "all"
      flow_role: "one elementary species and compartment"
      record_type: "species measurement/balance"
      raw_fields: "species; compartment; stack/fugitive point; sampling method; gas flow/time; capture/destruction; fuel composition; own fractions; stock; non-air residual; Q; N; D"
      collection_method: "Use actual species-resolved sampling and measured gas volume/time, or a documented applicable species factor/balance with uncertainty. Include own solvent fractions, retained product, recovery, capture medium, actual destruction and residues; CO and NO2 require independent species evidence. Q is attributable measured period release including test/rework; q_item = Q/N."
      unit: "kg"
      frequency: "representative operating conditions and each relevant test"
      temporal_coverage: "matched production period"
      site_scope: "actual controlled/fugitive factory boundary"
      aggregation_rule: "attributable emissions / accepted machines"
      quality_evidence: "sampling calibration, species identity, factor applicability and combined uncertainty"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
    - id: water_balance
      applies_to: "dilution_water; coat_water; test_water; service_water"
      rule: "For one matched period close water inputs plus input moisture, opening stock and actual reaction formation against retained product water, each waste moisture, effluent water, evaporation, closing stock and actual reaction consumption. Use the moisture of each actual term, cancel paired internal coolant/test-water returns, and retain combined meter, sampling, density and allocation uncertainty. Investigate residuals beyond that evidence; no universal tolerance or clipping."
      inputs:
        - cp_water
        - cp_material
        - cp_waste
      output: "water closure and uncertainty"
      source_ids: []
    - id: metal_balance
      applies_to: "plate; forged_blank; swarf; weld_dust; coat_sludge"
      rule: "Close each actual metal separately using the own matched assay and wet/dry basis of every input, accepted product, scrap, dust, sludge, effluent, release and opening/closing stock; include actual reaction partitioning and cancel paired internal transfers. Product BOM metal mass and waste gross mass are never automatically contained Fe, Mn, Ni or other element. Compare residual with combined weighing, assay, sampling and allocation uncertainty; investigate, do not invent yield."
      inputs:
        - cp_material
        - cp_waste
        - cp_emission
        - cp_mass
      output: "each contained-metal closure and uncertainty"
      source_ids: []
    - id: solvent_oil_balance
      applies_to: "mek; epoxy; hydraulic_fill; test_oil"
      rule: "Balance each actual solvent and oil separately with own composition fractions, retained product, opening/closing stocks, recovered returns, capture media, actual destruction and non-air residues. Internal recovered fluid is paired, not new external input or fictitious waste. A total VOC result cannot establish MEK; disclose unresolved species."
      inputs:
        - cp_material
        - cp_waste
        - cp_emission
      output: "species closure and uncertainty"
      source_ids: []
    - id: utility_balance
      applies_to: "all inventory rows"
      rule: "For identical period and units reconcile purchased imports plus measured on-site generation and storage discharge against assigned fabrication/treatment/integration/assembly/test/dispatch load, exports, storage charge and only unassigned residual shared services. Apply measured causal allocation only to residual. Never add factory total to submeters; investigate negative residuals with meter and timing uncertainty, do not clip. Fuel, actual generation and stack species are separate; carbon balance cannot alone establish CO or NO2."
      inputs:
        - cp_energy
        - cp_water
      output: "reconciled allocation of assigned and residual loads"
      source_ids: []
  data_quality_requirements:
    - id: configuration_records
      applies_to: "all inventory rows"
      requirement: "Retain independent family/module state, actual supplier data and the make/buy ledger; product identity is not supplier evidence"
      evidence: "Drawing, BOM, purchase order and direct identity"
    - id: period_completeness
      applies_to: "all inventory rows"
      requirement: "Disclose every missing exchange, provider and quantity; no default ranges or zero substitution. Verify total utility assignments and each physical closure with actual combined uncertainty"
      evidence: "Calibrated logs, samples, closure ledgers and gap register"
validation_rules:
  - rule_id: accepted_denominator
    applies_to: "all inventory rows"
    rule: "Verify family/configuration, accepted N > 0, traceable calibrated net masses and acceptance records match Q period and BOM; normalize_mass is applied to each non-reference row; 1 kg output contains no transport package or rejects. Missing mass or allocation is unknown, not zero."
