published_dataset_profile:
  dataset_role: "Foreground manufacturing data package"
  downstream_use: "secondary_dataset; background_dataset; process and lifecyclemodel projections retain same boundary"
  allowed_use: "Configuration-qualified factory manufacture and explicitly linked upstream production; separately evidenced downstream scenario"
  excluded_use: "Per-kg mass alone as equivalent excavation service; unexplained fleet average; lifetime impact without operating scenario; complete upstream claim with unresolved providers"
  required_metadata: "Required qualifiers; supplier/make-buy gates; N, D and M; Q period; actual routes; acceptance and uncertainty"
  required_quality_disclosure: "Every unresolved UUID/provider, omitted exchange, source/recipe and quantitative gap; not_applicable/zero/unknown distinctions and measured closure"
  update_trigger: "Change of family/model/BOM, supplier or treatment state, test boundary, voltage/geography, factory route or acceptance criteria"
data_sources:
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 Explanatory Notes (30 June 2025), p.234, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Full category and adjacent independent underground conveyors and earthmoving machinery; title establishes classification, not a recipe"
  - id: "sandvik-cutting-2024"
    type: "handbook"
    reference: "Sandvik Cutting Catalogue 2024, 2024, https://www.rocktechnology.sandvik/siteassets/product-documents/rock-tools/cutting/sandvik_cutting_catalog_2024.pdf"
    used_for: "Printed p.13 / PDF p.7: continuous/bolter/borer miners and roadheaders; integral track, cutter and control alternatives; no numerical defaults"
  - id: "sandvik-zeltweg-manufacturing"
    type: "handbook"
    reference: "Sandvik Zeltweg Contract Manufacturing, publisher brochure; acquired 2026-10-02, https://www.mining.sandvik/globalassets/products/mechanical-cutting-equipment/pdf/lohnfertigung-brochure-english.pdf"
    used_for: "Undated brochure, pp.3 and 6: actual machining, welding, treatment and assembly capability; site examples are conditional, not universal"
  - id: "herrenknecht-double-shield"
    type: "handbook"
    reference: "Herrenknecht Double Shield TBM, snapshot 2026-10-02, https://www.herrenknecht.com/en/products/productdetail/double-shield-tbm/"
    used_for: "Architecture, internal belt versus external transport, shields/thrust/bearing and erector; operational water/lining is not factory input by default"
  - id: "herrenknecht-raise-2024"
    type: "handbook"
    reference: "Herrenknecht Full Range Raise Boring, 05.2024 / HK3774, https://www.herrenknecht.com/?eID=file_download&file=fileadmin%2Fuser_upload%2FMain_Website%2F03_Produkte%2F02_Mining%2F02_Raise-Boring-Rig%2F02_Content%2FHK3774_DB_Mining_RBR_Full_Range_Raise_Borig_GB_20240514_MidRes.pdf"
    used_for: "05.2024 HK3774 p.1: modular raise-boring and variable-frequency drives/rod handling; counterexample to tunnel-only architecture"
  - id: "herrenknecht-vsm"
    type: "handbook"
    reference: "Herrenknecht Vertical Shaft Sinking Machine VSM, snapshot 2026-10-02, https://www.herrenknecht.com/en/products/productdetail/vertical-shaft-sinking-machine-vsm/"
    used_for: "Shaft-sinking boom, pump and lowering architecture; separate site separation and shaft lining uses"
  - id: "sandvik-testing-2026"
    type: "handbook"
    reference: "Sandvik 175 years at mining’s cutting edge, 20 March 2026, https://www.mining.sandvik/en/solid-ground/sandvik-perspective/2026/03/175-years-at-minings-cutting-edge/"
    used_for: "20 March 2026: dedicated factory machine validation and cutting test facility; no measured consumption default"
  - id: "herrenknecht-follo-2018"
    type: "handbook"
    reference: "Herrenknecht Double Breakthrough on the Follo Line, publisher press release; acquired 2026-10-02, https://www.herrenknecht.com/fileadmin/user_upload/Herrenknecht_Press_Release__Double_Breakthrough_on_the_Follo_Line.pdf"
    used_for: "28 September 2018 press release p.2: factory acceptance precedes site assembly and tunnelling; project cutter mass/performance not adopted"
