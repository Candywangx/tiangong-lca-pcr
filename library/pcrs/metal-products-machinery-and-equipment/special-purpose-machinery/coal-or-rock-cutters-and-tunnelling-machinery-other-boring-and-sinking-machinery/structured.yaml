  classification_refs: "CPC 3.0 44412; reviewed complete-machine boundary; code is not a canonical identity"
  covered_products: "Coal cutters; continuous, bolter and borer miners; rock-cutting roadheaders; open/gripper and shield TBMs; raise, boxhole and downward boring rigs; shaft sinking and other boring machines with actual declared delivery configuration"
  excluded_products: "Independent underground conveyors/elevators; cranes and independent hauling vehicles; independently supplied site separation plants; excavators/loaders; separately supplied spare parts or cutting tools; metalworking boring machine-tools; drilling/excavation services; tunnel lining manufacture and mine production"
  representative_product: "An accepted complete double-shield TBM with explicitly declared cutterhead, drive, shields and included back-up; illustrative, not a mass or recipe default"
  production_route: "Supplier-qualified raw stock and bought modules; actual fabrication, machining and conditional treatment; family integration, electrical/hydraulic assembly, factory testing and dispatch"
  market_state: "Accepted new finished machine at plant, including documented initial fill and installed tools; shipping split modules reconcile to the same complete configuration"
functional_unit:
  what: "Provide one configuration-qualified machine capable of its declared cutting, tunnelling, boring or sinking function"
  how_much: "1 kg accepted net complete-machine output; report accepted unit count and measured mass alongside"
  how_well: "Meets actual purchase drawing, cutting/boring architecture, interface, controls and recorded factory acceptance criteria"
  how_long_or_cycle: "One manufacturing and factory acceptance cycle; operating lifetime, excavation distance and output remain separately evidenced downstream scenarios"
  reference_flow_link: "reference_product"
system_boundary:
  rules:
    - rule_id: factory_gate
      applies_to: "all inventory rows"
      rule: "Include upstream supply once and all attributable factory operations through acceptance, correction, initial fill and packing. Exclude transport after declared gate, installation/excavation energy, mined coal/rock, routine cutter replacement, tunnel segments, grout and lifetime service unless explicitly modelled as a separate downstream scenario. Factory test materials and energy remain included."
      source_ids:
        - sandvik-testing-2026
        - herrenknecht-follo-2018
    - rule_id: configuration_boundary
      applies_to: "reference_product"
      rule: "Integral carrier, gathering mechanism, machine belt and installed handling equipment belong only when accepted in the same complete-machine BOM. Independently sold conveyors, cranes, transport vehicles, separation plants and tools have separate identity. A supplied VSM lowering/winch/control/separation module explicitly included in the accepted modular product BOM is retained once as a manufacturing input; its downstream shaft-water, rock/slurry and lining service is excluded. A self-propelled cutter does not become an excavator merely because it has tracks. For ambiguous integrated systems verify drawing, sales object and classification before mapping; no silent scope change."
      source_ids:
        - un-cpc-2025
        - sandvik-cutting-2024
        - herrenknecht-double-shield
        - herrenknecht-vsm
    - rule_id: make_buy_once
      applies_to: "all inventory rows"
      rule: "For each serial/configuration build a make/buy matrix for structure, shields, cutterhead/drum, motor, gears, bearing, hydraulics and controls. Purchased completed modules carry embedded material, processing, motor and supplied oil once; no parallel raw inputs for those burdens. For actual in-house fabrication use material/consumable/energy/output records, not a second purchased completed module. Partial supplier state retains only completed upstream steps."
      source_ids:
        - sandvik-zeltweg-manufacturing
boundary_abstraction:
  declared_starting_condition: "Factory receipt of composition- and state-qualified raw stock or completed supplier modules"
  starting_condition_role: "Foreground manufacturing starting state; upstream production remains required"
  product_classification_scope: "Complete machines in reviewed category; supplied integrated configuration must be declared"
  recursive_input_rule: "A purchased same-category completed machine used as a base is an explicit upstream input with inherited manufacture once; model only actual incremental work; never recursively create its full manufacturing inventory again"
  upstream_dataset_requirement: "Supplier processes match grade, module state, voltage, geography and delivery interface; unresolved providers remain disclosed and block a complete burden claim"
  disclosure: "Actual factory and gate; routes performed; subcontract steps; bought modules; included carrier/back-up; meter period; acceptance/reject/rework; gaps and downstream exclusions"
