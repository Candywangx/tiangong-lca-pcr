  unresolved_provider_links: Adopted product UUIDs do not establish supplier processes; exact supplier geography, grade, completed treatment and delivered
    interface must be established for the concrete configuration. CN medium-voltage electricity is conditional only.
  unresolved_quantitative_ranges: No unit mass, grade, yield, energy intensity, emissions, lifetime or empirical intervals adopted; calibrated foreground
    records and actual recipes required.
  unresolved_route_evidence: OEM examples establish architectural alternatives and actual manufacturing capability, not the complete recipe of every cutter,
    drilling or sinking configuration. Actual site drawings, BOM and recipe evidence and all missing atomic exchanges are required.
  unresolved_source_access: Epiroc raise-boring webpage and original Robbins 34RH PDF returned 403; neither search snippet is adopted. Actually inspected
    Herrenknecht raise-boring and VSM originals supplement boring/sinking coverage.
  identity_rejections:
    - Motor 014f80a3-c257-425b-9b75-3e5a18573695 is tied to conveyors/washing and expert estimate; not exact industrial cutting drive.
    - Hydraulic fluid 30691a38-a947-4b41-991e-194f6c9aa88f has volume reference and generic mineral-or-synthetic basis, no actual oil grade; not adopted.
    - Tap water 3a8411b6-e476-4f98-9d77-0d492661a07f is Hong Kong volume-reference with screening mass density; not adopted as generic kg factory water.
    - Electricity b989a649-ca09-44b8-abab-a069148d0b1e is incineration generation and not generic purchased factory power.
