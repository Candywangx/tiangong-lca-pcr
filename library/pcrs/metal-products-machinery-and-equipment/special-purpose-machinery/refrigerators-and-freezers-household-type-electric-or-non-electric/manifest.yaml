review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_inventory_uuids: "Unresolved atomic row identities: steel_sheet, stainless_sheet, copper_tube, aluminium_evaporator, polyol, pmdi, foam_kit, cyclopentane, isopentane, hfc245fa, cabinet, liner, compressor, compression_module, condenser, absorption_module, peltier, heatsink, fan, controller, harness, burner, heater, gasket, shelf, basket, hinge, light, r600a, r290, r134a, ammonia, hydrogen, chromate, oil, test_propane, reusable_r600a, recovered_r600a, nitrogen_dioxide, heat, carton, wastewater, sludge, spent_carbon, foam_waste. Actual component state, grade/formulation, supply interface, waste contamination/treatment and missing NO2 identity require review; retain specific non-UUID rows. Adopted utility/material identities apply only to their stated supply conditions."
  unresolved_quantitative_ranges: No default mass, refrigerant charge, recipe, density,
    yield, leakage, GWP, manufacturing energy or lifetime. Factory records and measurement
    uncertainty are required.
  unresolved_source_evidence: Original Dometic evidence verifies portable/RV absorption
    and thermoelectric/compressor alternatives, not that every cooler is household
    refrigeration. Product principal function and classification, factory make/buy
    BOM, actual grades/chemical recipe and supplier evidence need review. DOE undated
    prepublication RFI is historical narrower regulatory counterevidence only.
  unresolved_provider_links: Factory geography/year, actual supply interface and provider
    upstream scope are not determined by a generic reference UUID.
  classification_boundary: Retains full household-type electric/non-electric refrigerator/freezer
    scope. Commercial refrigeration, passive ice boxes, air conditioning, standalone
    spare cooling modules and RV/portable products require actual principal-function/supplied-state
    classification review; no mapping accepted here.
