review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved:
    inventory_flow_uuids:
      - row_id: steel_sheet
        reason_code: manual_review_required
        explanation: "The directly read Steel Sheet candidate has conflicting English and Chinese names; other candidates have a different rolling, coating, or shape state."
      - row_id: polystyrene_sheet
        reason_code: property_or_unit_mismatch
        explanation: "The PS Plate candidate has an area property, while this mass-based input needs kg; other candidates are film or waste."
      - row_id: pu_foam
        reason_code: no_exact_candidate
        explanation: "Polyfoam and polyurethane filler candidates do not establish rigid polyurethane insulation foam."
      - row_id: r600a_charge
        reason_code: no_exact_candidate
        explanation: "Searches returned mixed C4-C5 isoparaffins and an unrelated copolymer, not pure R600a isobutane refrigerant."
      - row_id: factory_electricity
        reason_code: manual_review_required
        explanation: "Alternating-current candidates lack a distinguishing voltage and grid supply context for the metered manufacturing input."
      - row_id: steel_scrap
        reason_code: manual_review_required
        explanation: "Several public steel-scrap waste records share the same identity facts without a distinguishing route or comment."
      - row_id: r600a_air
        reason_code: classification_mismatch
        explanation: "Isobutane elementary candidates are indoor air, other atmosphere compartments, soil, or water, not outdoor ambient air."
    range_evidence_needs:
      - row_id: finished_appliance
        explanation: "Collect measured net mass M; no two independent boundary-compatible sources support a category mass range."
      - row_id: steel_sheet
        explanation: "Collect route-specific cabinet steel input and offcuts; no compatible independent empirical range is verified."
      - row_id: polystyrene_sheet
        explanation: "Collect inner-liner polystyrene input; no compatible independent empirical range is verified."
      - row_id: pu_foam
        explanation: "Collect insulation input by the actual foam route; no compatible independent empirical range is verified."
      - row_id: copper_tubing
        explanation: "Collect copper tubing for the declared cooling circuit; no compatible independent empirical range is verified."
      - row_id: r600a_charge
        explanation: "Collect first fill and losses for applicable compression models; no compatible independent empirical range is verified."
      - row_id: ammonia_charge
        explanation: "Collect ammonia first fill for applicable absorption models; no compatible independent empirical range is verified."
      - row_id: propane_test
        explanation: "Collect propane consumed in applicable factory tests; no compatible independent empirical range is verified."
      - row_id: factory_electricity
        explanation: "Collect metered electricity attributable to production and testing; no compatible independent empirical range is verified."
      - row_id: corrugated_box
        explanation: "Collect packaging mass for the declared product configuration; no compatible independent empirical range is verified."
      - row_id: steel_scrap
        explanation: "Collect actual steel offcut waste; no compatible independent empirical range is verified."
      - row_id: r600a_air
        explanation: "Collect measured or reconciled outdoor R600a losses; no compatible independent empirical range is verified."
