allocation_rules:
  - rule_id: al_subdivide
    applies_to: "shared manufacturing"
    rule: "First subdivide shared forming, assembly or testing unit processes and meter their inputs and outputs directly."
    source_ids:
      - bis-iso14044-2006
  - rule_id: al_physical
    applies_to: "remaining shared loads"
    rule: "If subdivision is infeasible, allocate shared electricity and materials using a causally related physical driver; record driver, total and accepted-machine count, and reconcile allocated totals."
    source_ids:
      - bis-iso14044-2006
  - rule_id: al_disclose
    applies_to: "scrap and co-products"
    rule: "Report steel scrap and other co-products separately; do not silently treat them as negative manufacturing inputs. Disclose destination and any recycling allocation choice."
    source_ids:
      - bis-iso14044-2006
