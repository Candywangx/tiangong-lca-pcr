system_boundary:
  rules:
    - rule_id: b_factory
      applies_to: "foreground_system_boundary"
      rule: "Include attributable receipt, actual forming/moulding/foaming, assembly, charging, drying/vacuum, tests, rejects/rework, treatment and dispatch packaging. Exclude downstream foods, consumer use energy, distribution and disposal from this production package."
