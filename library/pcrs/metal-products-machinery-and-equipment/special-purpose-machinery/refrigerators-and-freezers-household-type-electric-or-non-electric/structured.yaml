allocation_rules:
  - rule_id: a_causal
    applies_to: "foreground_burden_allocation"
    rule: "Avoid allocation by metering or subdividing actual configuration and operations. Otherwise use documented causal machine-hours, metered test load or measured material throughput for the specific shared service. Do not use accepted appliance mass for every utility by default; reconcile shares to the same period and service total."
    source_ids: []
  - rule_id: a_reject
    applies_to: "foreground_burden_allocation"
    rule: "Assign attributable rejects/rework and quality-test burden to accepted output of the same configuration. Report scrap as physical waste with treatment interface, without automatic avoided-metal credit. Internal reuse cancels paired transfers, not upstream acquisitions twice."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "services_dispatch"
      flow_role: "finished"
      record_type: "weighing"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted unit"
      temporal_coverage: "matched production period"
      site_scope: "same factory and configuration"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration; tare; acceptance/BOM reconciliation"
    - protocol_id: cp_exchange
      process_id: "all"
      flow_role: "atomic physical exchange"
      record_type: "weighing; assay"
      raw_fields: "period; batch; supplier; grade; phase; species; gross/net mass; moisture; own assay; density/temperature; stocks; returns; rejects; nitrogen gas volume/temperature/pressure/density; N"
      collection_method: "Measure each actual atomic exchange crossing its process boundary, use own solution density and concentration for volume-to-mass/species conversion; reconcile inventory and reaction/return records. For nitrogen use native gas volume at declared conditions; net cylinder mass is divided by each batch's measured gas density at those same conditions before aggregation; retain both mass and volume records. Q includes attributable reject/rework consumption; N is accepted units of the same configuration."
      unit: "kg; m3"
      frequency: "each batch and period"
      temporal_coverage: "matched production period"
      site_scope: "selected process/configuration"
      aggregation_rule: "attributable exchange / accepted machines"
      quality_evidence: "calibrated balances/meters; actual SDS/assay; transfer manifests"
    - protocol_id: cp_utilities
      process_id: "all"
      flow_role: "atomic utility"
      record_type: "metering"
      raw_fields: "period; meter start/end; process/test assignment; imports; generation; export; storage change; supply/return mass; supply/return enthalpy; N"
      collection_method: "Use actual process and test meters for assigned loads. Shared services include only unassigned residual after assigned loads. Reconcile all to same site period/units, investigate negative residual and measurement uncertainty without clipping. Independent heat supply and return each use kg times own MJ/kg relative to common zero; record gross/net interface. For gross supply, subtract independently measured return once; a provider amount already net of return is used directly without a second subtraction."
      unit: "kWh; MJ"
      frequency: "meter interval and period"
      temporal_coverage: "matched production period"
      site_scope: "same site service with causal configuration share"
      aggregation_rule: "attributable utility / accepted machines"
      quality_evidence: "meter calibration; reconciliation; causal allocation evidence"
    - protocol_id: cp_emissions
      process_id: "all"
      flow_role: "each actual air-emission species"
      record_type: "synchronized sampling/metering"
      raw_fields: "period; species; compartment; concentration; dry gas flow; time; temperature; pressure; moisture; abatement inlet/outlet; stock; allocation; N"
      collection_method: "Measure species concentration with synchronized dry exhaust flow and time at the same declared standard conditions; convert concentration to kg per volume before integrating. Use actual abatement outlet for discharged mass; do not subtract capture again from an already post-abatement measurement. Fugitive refrigerant/solvent release requires species-specific charge/stock/recovery/non-air-residual evidence, not unexplained remainder labelled air. CO2 carbon accounting includes actual fuel carbon, reaction formation, product retention, CO and every other supported carbon sink; CO and NO2 require independent species measurement. NOx as NO2 equivalent is not actual NO2."
      unit: "kg"
      frequency: "each test interval and production period"
      temporal_coverage: "matched production period"
      site_scope: "actual outlet/fugitive compartment and same configuration"
      aggregation_rule: "attributable exchange / accepted machines"
      quality_evidence: "calibrated flow/analyser; blanks; synchronized records; conditions; abatement and sampling uncertainty"
  calculation_rules:
    - id: normalize_mass
      applies_to: "steel_sheet; stainless_sheet; copper_tube; aluminium_evaporator; hips_resin; abs_resin; polyol; pmdi; foam_kit; cyclopentane; isopentane; hfc245fa; cabinet; liner; steel_scrap; compressor; compression_module; condenser; absorption_module; peltier; heatsink; fan; controller; harness; burner; heater; gasket; shelf; basket; hinge; light; r600a; r290; r134a; ammonia; hydrogen; working_water; chromate; nitrogen; oil; isobutane_air; ammonia_air; recovered_r600a; test_power; test_propane; test_water; carbon_dioxide; carbon_monoxide; nitrogen_dioxide; factory_power; residual_power; heat; process_water; ipa; ipa_air; wastewater; sludge; spent_carbon; foam_waste; carton; film; reusable_r600a"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Q is attributable period exchange including assigned reject/rework burden; N is accepted unit count of the same configuration; D is the sum of calibrated accepted net masses excluding packaging/rejects/test loads; M = D/N; q_item = Q/N; q_ref = Q/D. Preserve actual period totals and numerator units; finished = 1 kg."
      inputs:
        - Q
        - N
        - D
        - M
        - cp_mass
        - cp_exchange
        - cp_utilities
        - cp_emissions
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference and every selected input"
      requirement: "Match actual product state, grade, species, supply interface, property/unit and provider scope; a UUID is identity, not a manufacturing factor."
      evidence: "BOM; supplier original; direct dataset read"
    - id: dq_balance
      applies_to: "physical materials and species"
      requirement: "Use opening stock + receipts + reaction formation = closing stock + accepted retention + rejects/scrap + recovery/return exports + wastewater/sludge + measured releases + reaction consumption. Every contained species term uses its own assay on matching wet/dry basis. Gross metal mass is not elemental mass. Internal paired transfers cancel; recovery is not destruction."
      evidence: "weighing; each stream assay; stock/reaction/transfer evidence"
    - id: dq_water
      applies_to: "actual water"
      requirement: "Close water receipts and input moisture with stock change, water retained in product/waste, evaporation, discharge and reaction water; own moisture assays and paired internal returns, not circulation counted as fresh supply."
      evidence: "water meters; moisture; discharge; reaction records"
    - id: dq_solvent
      applies_to: "actual solvent/blowing/working-fluid species"
      requirement: "Separate retained product, recovered/exported fluid, capture-media retention, verified destruction and non-air residual. Do not declare air emissions as all unexplained residual. Investigate closure using actual combined measurement, sampling and allocation uncertainty; no universal tolerance."
      evidence: "species stock/charge/recovery logs; assay; sampling uncertainty"
validation_rules:
  - rule_id: v_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Require household principal-function evidence, declared complete configuration and route; gaps remain candidate review, never force absorption/thermoelectric exclusion because UUID is missing."
    source_ids:
      - dometic-technologies
      - doe-refrigeration-rfi
  - rule_id: v_mass
    applies_to: "foreground_dataset_conformance"
    rule: "Require positive N and calibrated D for same configuration, M = D/N, accepted output and q_item/M conversion for each applicable exchange; include reject/rework burden, not reject mass in denominator."
    source_ids: []
  - rule_id: v_makebuy
    applies_to: "foreground_dataset_conformance"
    rule: "Reject duplicated bought module/component upstream burdens and its embedded initial charge, resin/hardener or oil. Verify each actual refrigerant, working-fluid and foaming-agent species separately with charge/retention/leak/recovery evidence; no universal default."
    source_ids:
      - dometic-rm2350
  - rule_id: v_utilities
    applies_to: "foreground_dataset_conformance"
    rule: "Require same-period process/test/service reconciliation with only unassigned residual, imports/generation/export/storage balance and investigation of negative residual; verify supply/return heat independent masses and own enthalpies, return subtraction once."
    source_ids: []
  - rule_id: v_species
    applies_to: "foreground_dataset_conformance"
    rule: "Require physical water and each contained species closure including own assays, stocks, reactions, scrap/sludge/wastewater/releases and paired internal returns. Fuel carbon balance alone cannot establish CO or NOx; NO2 is not NOx equivalent. Missing actual species or unknown destruction is incomplete data, not zero."
    source_ids: []
