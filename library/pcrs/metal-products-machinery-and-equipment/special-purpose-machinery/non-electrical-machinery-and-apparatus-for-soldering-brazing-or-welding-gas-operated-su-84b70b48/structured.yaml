  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For one configuration and period divide each attributable native-unit exchange total by the sum of accepted configured-apparatus net masses; keep raw amounts, units and uncertainty."
      inputs:
        - Qattr
        - Dnet
        - cp_mass
      output: "native-unit amount per kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_qnd
      applies_to: "all inventory rows"
      requirement: "Qattr includes attributable reject/rework/test burdens for one configuration and common period; Naccepted counts accepted apparatus whose masses form Dnet. Per-item exchange=Qattr/Naccepted; measured mean net mass=Dnet/Naccepted; per-kg exchange=Qattr/Dnet. Count conversion uses measured same-configuration mean mass, never rated heat/gas consumption/workpiece capacity or catalogue machine weight."
      evidence: "calibrated net masses and acceptance ledger"
    - id: quality_physical
      applies_to: "all inventory rows"
      requirement: "Each element/species term uses its own gross mass and own assay/moisture/wet-dry basis, stocks, reactions, retained product, returns and waste. Gross alloy/sludge is not contained element. Each water stream uses own water fraction and measured/documented density at actual temperature, reactions/retention/evaporation/discharge/stocks; pair and cancel internal returns."
      evidence: "stream-specific assay and stock/reaction records"
    - id: quality_solvent
      applies_to: "ipa; spentipa; ipair"
      requirement: "Reconcile own IPA assay in inputs, stocks, retained product, recovery/capture, wastewater/spent media, destruction and independently measured air. Capture is not destruction and non-air fates never become air residual."
      evidence: "independent fate measurements and assays"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Match state/type, native reference property/unit, metal/polymer/chemical/species, completed supplied state, provider/geography and elementary compartment. Add every actual unlisted transport service, titanium/stainless/plastic feedstock, torch mixer, cartridge shell, tank/heat exchanger/drive, joining alloy/flux ingredient, supplied refrigerant, test media, gas, waste or emission as a separately queried measured atomic row. Missing differs from zero; absence requires proof."
      evidence: "original supplier/BOM and disclosed identity gaps"
    - id: quality_scope
      applies_to: "reference product"
      requirement: "Unobserved non-electric joining mechanisms and mixed cutting/joining, furnace or gas/electric architectures need item-specific primary principal-function review. Flame-hardening examples do not prove every surface-tempering apparatus. Supplied controls/pumps remain auxiliary to actual gas heat. Replacement lists do not prove shipment, empty cylinders exclude assumed fuel fill and a cooling/quench tank does not prove delivered liquid or glycol. Examples never impose a universal operating recipe or factory load."
      evidence: "primary configuration and semantic review"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual non-electrical principal joining or gas-operated surface-tempering function and full supplied BOM. Reject spare torch/nozzle/hose, unrelated furnace, electric heat-source apparatus or treated customer workpiece as complete reference. Both languages use the same one-kg net reference and native numerator."
    source_ids:
      - un-cpc3
  - rule_id: validate_interfaces
    applies_to: "foreground_dataset_conformance"
    rule: "Reject duplicated bought-module manufacture, unpaired internal returns, assumed accessory/fill inclusion and customer lifetime operation presented as factory loads; retain actual attributable factory test rejects/rework."
    source_ids:
      - harris-catalog
      - sievert-kit
      - sievert-promatic
      - flame-machines
  - rule_id: validate_balances
    applies_to: "foreground_dataset_conformance"
    rule: "Require own-stream element/water/solvent balances and measured post-control species concentration × matched flow/time/state plus independent fugitives. Reconcile utilities common-period imports/actual generation/exports/storage and assigned process loads; only unassigned residual shared services. Gross heat deducts independently measured return on same datum once; already-net heat never deducts twice."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "foreground_dataset_conformance"
    rule: "NOx as NO2-equivalent differs from molecular NO2; gross metal oxide/fume differs from contained elemental species and PM must not overlap constituent reporting. State20, wrong reference property/compartment and unqueried identities are unavailable. Report accepted input, performed/skipped checks, findings, missing evidence and completeness."
    source_ids: []
