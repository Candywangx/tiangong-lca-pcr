allocation_rules:
  - rule_id: allocate_burdens
    applies_to: "foreground_burden_allocation"
    rule: "Separate configuration/site/common-period records first. Direct component/operation/test records precede allocation; shared services use a documented causal metered basis only for unassigned residual. Attributable reject/rework/test burden remains; do not dilute with total unrelated plant output."
    source_ids: []
  - rule_id: allocate_scrap
    applies_to: "foreground_burden_allocation"
    rule: "Retained recoverable materials are stock/paired returns; actual external coproducts need explicit allocation/substitution method and compatible output state. Waste transfer receives no automatic avoided-primary-metal credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "accepted configured reference"
      record_type: "foreground_record"
      raw_fields: "configuration; serial/BOM; Naccepted; each calibrated accepted net mass; Dnet; included accessories/fills; excluded packing/spares/reject/test loads"
      collection_method: "Use calibrated weighing/traceable weighing records for accepted complete apparatus of same configuration; reconcile acceptance and actual supplied BOM. For disassembled shipment sum each included module once."
      unit: "kg"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_materials
      process_id: "fabrication"
      flow_role: "each actual material/formulation"
      record_type: "foreground_record"
      raw_fields: "identity/grade; gross Qattr; own assay/water fraction; stocks; reactions; returns; local operations; bought completion; uncertainty"
      collection_method: "Weigh each purchase/use stream and measure own chemistry/water fraction; reconcile supplied finish and stock-adjusted local fabrication, gas-path fabrication, surface finish, reject/rework."
      unit: "kg"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_modules
      process_id: "assembly"
      flow_role: "each completed component and retained fill"
      record_type: "foreground_record"
      raw_fields: "part/serial; native Qattr; compatibility; supplier/BOM; embedded materials/operations; included torch/regulator/hose/cylinder/motion/quench/control/fill; rejected/reworked amounts"
      collection_method: "Use actual receipts and measured masses of each supplied hardware unit; installed count converts through same-unit measured mass. Retained gas charges preserve native mass/volume and actual T/P/density, supplier completion and stocks; no hardware mass is a gas amount. Bought completed modules embed manufacture once. Local torch or quench-assembly manufacture requires its own atomic route and actual upstream replacements."
      unit: "native unit"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_tests
      process_id: "test"
      flow_role: "each actual factory test exchange"
      record_type: "foreground_record"
      raw_fields: "configuration; test programme; actual performed intervals; measured Qattr; gas inlet/return/vent and actual auxiliary electrical load; media/coupon consumption and returns; coolant stocks; acceptance/reject/rework"
      collection_method: "Meter actual gas-path leak/pressure/control/ignition or functional weld/solder/braze/surface-heat/quench trials; retain all attributable failed/repeated tests. Distinguish retained first-set hardware/fills from consumed media and user lifetime quantities. Leak-only checks do not invent joining filler or surface-quench consumption; validate actual performed test state only."
      unit: "native unit"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_utilities
      process_id: "services"
      flow_role: "each actual utility meter"
      record_type: "foreground_record"
      raw_fields: "native Qattr; common-period imports/actual onsite energy generation/exports/storage; process/test assigned meters; residual shared services; voltage/provider; gas T/P/humidity/density; gross/net heat and returns"
      collection_method: "Reconcile actual imports/generation/exports/storage with assigned fabrication/assembly/finish/test/dispatch loads; allocate only unassigned residual, investigate negatives/uncertainty without clipping. Gross heat kg×its own MJ/kg less independent return kg×its own MJ/kg on one datum, deducted once; already-net heat excludes second return deduction. Physical steam/condensate mass is separate from energy; upstream heat provider boiler excluded from onsite fuel."
      unit: "native unit"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_dispatch
      process_id: "dispatch"
      flow_role: "each packaging and finished output"
      record_type: "foreground_record"
      raw_fields: "accepted configuration/BOM/net output; packaging Qattr; actual polymer/board/pallet grade; return share; external transport native activity"
      collection_method: "Weigh actual dispatch packaging separately from accepted net apparatus; retain supplier/transport interface and actual returned packaging, never a standard packaging ratio."
      unit: "kg"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_wastes
      process_id: "residues"
      flow_role: "each actual waste stream"
      record_type: "foreground_record"
      raw_fields: "gross Qattr; own water/element/chemical assays; stocks/internal returns/recovery; actual external transfer/provider and treatment"
      collection_method: "Use weighed transfer manifests and own stream samples; whole sludge/alloy/wastewater differs from contained species. Captured dust/solvent stay non-air until measured release; external provider emissions belong to provider."
      unit: "kg"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_emissions
      process_id: "residues"
      flow_role: "each elementary species"
      record_type: "foreground_record"
      raw_fields: "CAS/origin/compartment; Qattr; actual post-control concentration; matched gas/liquid flow and time; T/P/wet-dry/oxygen/unit correction; independent fugitive basis; retention/capture/destruction"
      collection_method: "Measure species after actual controls using measured concentration × matched flow × same period with state/unit corrections plus independent fugitive measurement. Element/species assay is distinct from gross dust/oxide; prevent overlapping total PM/component emissions. Unexplained mass residual and carbon closure cannot infer CO/NO2."
      unit: "kg"
