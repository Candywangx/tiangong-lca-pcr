review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved:
    inventory_flow_uuids:
      - row_id: galvanized_sheet
        reason_code: no_exact_candidate
        explanation: No public state-100 product flow resolved to flat Sendzimir galvanized steel sheet; corrugated iron and generic steel are not exact.
      - row_id: cold_rolled_sheet
        reason_code: manual_review_required
        explanation: Candidate steel-sheet records have conflicting English and Chinese identities or the wrong stock form; database identity review is required.
      - row_id: fan_motor
        reason_code: no_exact_candidate
        explanation: The returned pneumatic conveying module is not a purchased motor-driven air circulation fan assembly.
      - row_id: hydronic_exchanger
        reason_code: no_exact_candidate
        explanation: No returned public flow names a copper-aluminium hydronic air heat exchanger assembly.
      - row_id: gas_exchanger
        reason_code: no_exact_candidate
        explanation: Returned tube and fitting flows do not identify an aluminized-steel gas heat exchanger tube assembly.
      - row_id: gas_burner
        reason_code: no_exact_candidate
        explanation: Returned industrial furnace burner parts or subassemblies do not establish a unit air heater gas burner assembly.
    range_evidence_needs:
      - row_id: galvanized_sheet
        explanation: Obtain at least two independent, route-compatible factory records for galvanized steel sheet per accepted heater before specifying a category range.
      - row_id: cold_rolled_sheet
        explanation: Obtain independent gas-route factory records for cold-rolled cabinet sheet per accepted heater.
      - row_id: fan_motor
        explanation: Obtain independent configuration-matched fan assembly mass records; one hydronic EPD and one modeled gas case are not a compatible range.
      - row_id: hydronic_exchanger
        explanation: Obtain independent hydronic heater component records on the same one-unit boundary.
      - row_id: gas_exchanger
        explanation: Obtain independent gas-fired heater component records; the NIST modeled case is one non-empirical example.
      - row_id: gas_burner
        explanation: Obtain independent gas-fired burner assembly records with a consistent component boundary.
      - row_id: factory_electricity
        explanation: Obtain two independent factory electricity observations with matching product and unit boundaries; do not use one model's grid mix as a use range.
      - row_id: test_natural_gas
        explanation: Obtain independent metered factory test-gas records for gas-fired units; the NIST bill of materials contains no manufacturing fuel quantity.
      - row_id: corrugated_box
        explanation: Obtain two independent, compatible carton-mass observations before assigning a packaging range.
      - row_id: finished_heater
        explanation: Measure M for each actual configuration; source model masses do not establish a category mass interval.
      - row_id: steel_scrap
        explanation: Obtain independent weighed fabrication scrap records; no comparable output interval is verified.
