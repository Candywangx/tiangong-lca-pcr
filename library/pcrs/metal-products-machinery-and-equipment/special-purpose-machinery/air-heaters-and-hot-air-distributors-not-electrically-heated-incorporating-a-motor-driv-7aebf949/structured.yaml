allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "shared plant"
    rule: "Prefer subdivision and metering, then justified physical causality. Allocation drivers reflect actual forming hours, coated area, cure load or test runtime, not assumed identical heat output. Other/economic allocation requires consistent prices, period and sensitivity with unallocated totals retained."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_scrap_rework
    applies_to: "rework and scrap"
    rule: "Retain repeat processing/test burdens; recovered powder and internal scrap reuse are internal transfers, not new virgin inputs or credits. External steel/aluminium scrap and coating residues carry measured destination and treatment; sale does not prove co-product status and no automatic avoided-material credit is allowed. Disclose selected recycling convention."
    source_ids:
      - ef-allocation-2021
