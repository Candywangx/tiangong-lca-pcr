  calculation_rules:
    - id: period_allocation
      applies_to: "all inventory rows"
      rule: "Allocate reconciled reporting-period external exchanges to accepted machines of the same configuration; use actual accepted count. Keep rejects/rework in numerator. Product output is M kg for one accepted machine."
      inputs:
        - "row protocols"
        - "accepted count"
        - cp_mass
      output: "per one accepted finished machine"
      source_ids: []
    - id: material_balance
      applies_to: "metal_fabrication; assembly"
      rule: "For each material grade, opening stock + external receipts = closing stock + incorporated material + external scrap/waste + documented actual losses. Pair internal recovery generation and reuse by batch/process and cancel the matching transfer quantities at plant boundary; recovered material is never a fresh external receipt. Reconcile complete-machine mass to actual BOM and retained coating/fluids; purchased-component mass is counted once. Fe-element balance uses grade-specific assays, never gross steel mass."
      inputs:
        - weighing
        - BOM
        - stocks
        - waste
        - assays
      output: "Balance residual and measurement uncertainty"
      source_ids: []
    - id: coating_balance
      applies_to: "surface_finish"
      rule: "Account formulation solids and each solvent separately: opening stock + external receipts = closing stock + retained formulation constituents + externally recovered material/waste + direct air releases. Match and cancel internal powder/solvent recovery and reuse; do not count them as external receipts or external recovered outputs. Quantify captured waste separately from residual air releases; no generic VOC factor."
      inputs:
        - formulation
        - "application/capture records"
        - stocks
      output: "Component-specific closure"
      source_ids:
        - epa-other-metal-coating
    - id: energy_balance
      applies_to: "utilities; factory_acceptance"
      rule: "Process and allocated auxiliary electricity totals reconcile to supply meters; document distribution losses. Test fuel carbon/energy balance uses actual measured fuel and test record; useful test heat, exhaust and losses remain distinguishable. Lifetime heat demand is outside this balance."
      inputs:
        - "electric meters"
        - "fuel NCV/carbon"
        - "test records"
      output: "Measured energy/closure, no invented tolerance"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "reference and components"
      requirement: "model and configuration; iron/steel housing and heat-transfer material grades; direct-fired, indirect-fired, hydronic/steam-coil or supplied-hot-air distribution technology; actual fuel or heat-transfer medium; fan/blower and motor specification; burner and heat exchanger presence; declared airflow with test conditions; actual heater rated thermal output, not_applicable for a supplied-hot-air distributor without a heat source; controls and safety equipment; factory acceptance procedure; coating; gate state; site and reporting period; measured net mass M; supplier geography/year"
      evidence: "BOM; drawings; model; supplier records; factory acceptance"
    - id: applicability
      applies_to: "all rows"
      requirement: "Distinguish measured zero, absent route, unknown and measured amount. Resolve flow type, material formulation, property/unit, geography/year and emission compartment before finalized data."
      evidence: "Route audit; direct flow records; QA evidence"
    - id: representativeness
      applies_to: "production"
      requirement: "Stratify actual technology/model/metal grades and purchased-versus-site fabrication; disclose weighting, uncertainty, omitted exchanges and evidence limitations. No empirical intensity range is imposed."
      evidence: "Period totals and configuration production shares"
validation_rules:
  - rule_id: validation_mass
    applies_to: "reference and inventory"
    rule: "Reference M must trace to cp_mass for the same configuration and exclude packaging. Every row uses the same one-accepted-machine denominator and a declared protocol; no assumed equipment weight."
    source_ids: []
  - rule_id: validation_route
    applies_to: "factory_acceptance"
    rule: "Check heat-source and component configuration; no mandatory burner, welding/brazing or combustion QA for all models. No missing fuel or direct emission when actual factory combustion occurs; no lifetime-use energy in manufacturing."
    source_ids:
      - reznor-udx-specification
      - dantherm-direct-indirect
      - reznor-hydronic-manual
  - rule_id: validation_balance
    applies_to: "all processes"
    rule: "Reconcile material, stock, coating, energy and rework balances with uncertainty; verify supplier burdens, transport and waste fate exactly once. Unknown UUID or insufficient species evidence remains an explicit gap rather than an invented match. No generic incinerator power dataset as factory supply."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing equipment inputs to process/lifecyclemodel with separate installation and use scenarios"
  excluded_use: "Standalone lifetime heating assessment; equipment kg as equivalent delivered heat; uncontrolled cross-technology average"
  required_metadata: "model and configuration; iron/steel housing and heat-transfer material grades; direct-fired, indirect-fired, hydronic/steam-coil or supplied-hot-air distribution technology; actual fuel or heat-transfer medium; fan/blower and motor specification; burner and heat exchanger presence; declared airflow with test conditions; actual heater rated thermal output, not_applicable for a supplied-hot-air distributor without a heat source; controls and safety equipment; factory acceptance procedure; coating; gate state; site and reporting period; measured net mass M; supplier geography/year"
  required_quality_disclosure: "Route coverage; supplier starting state; unresolved identities; empirical range gaps; acceptance evidence; uncertainty and allocation"
  update_trigger: "Changed technology/BOM, heat source, manufacturing route, supplier, coating, acceptance tests or reference mass"
data_sources:
  - id: "unsd-cpc3-air-heaters"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0, subclass 44824 and class 4482. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/44824"
    used_for: "Identity qualifiers: iron/steel, non-electrical heating and motor-driven fan/blower; adjacent subclasses distinguish radiators and boilers. Classification does not prescribe a burner, mass, efficiency or manufacturing route."
  - id: "reznor-udx-specification"
    type: "extension_guidance"
    reference: "Reznor, Model UDX Sample Specification, heat exchanger, burner and controls sections. https://assets.reznorhvac.com/download/150e5cee-9ce7-11ed-bfcb-0016e1e579b9"
    used_for: "One indirect gas-fired heater architecture: steel exchanger, axial fan, gas burner, valve and electronic controls. Press-fabricated exchanger explicitly avoids welding/brazing: joining is conditional, not universal. Manufacturer specifications are not category-wide intensities."
  - id: "dantherm-direct-indirect"
    type: "extension_guidance"
    reference: "Dantherm Group, Heating for large-scale construction projects, direct versus indirect-fired heaters. https://www.danthermgroup.com/uk/solutions/construction/heating-for-large-scale-construction-projects"
    used_for: "Independent manufacturer distinguishes direct combustion into air from indirect heat exchanger separation; does not establish universal factory test time, fuel, mass or lifetime performance."
  - id: "reznor-hydronic-manual"
    type: "handbook"
    reference: "Reznor, UWS Hydronic Unit Heater. https://www.reznorhvac.com/product/uws/"
    used_for: "Hydronic hot-water heater counterexample uses copper rather than steel heat-exchanger tubes; establishes non-burner supply and material-route variability only. Iron/steel category applicability needs actual housing/product records. No operating figures adopted."
  - id: "epa-other-metal-coating"
    type: "official_guidance"
    reference: "US EPA, AP-42 section 4.2.2.4 Other Metal Coating, 1995. https://www.epa.gov/sites/default/files/2020-10/documents/c4s02_2d.pdf"
    used_for: "Conditional liquid/powder coating and solvent loss pathways; use actual formulation and capture fate rather than historical generic factors."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Subdivision and justified physical/other allocation hierarchy; no claim of complete PEF conformance."
