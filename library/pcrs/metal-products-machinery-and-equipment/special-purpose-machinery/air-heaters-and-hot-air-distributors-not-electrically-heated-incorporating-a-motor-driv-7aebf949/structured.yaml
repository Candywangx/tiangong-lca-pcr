  - id: component_mass
    applies_to: "metal/component accounting"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record actual composite steel, aluminium, purchased component and retained coating masses separately. Gross steel product mass is not elemental Fe mass; any element balance needs assays. Exclude packaging from M."
  - id: energy_units
    applies_to: "electricity and fuels"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Keep electricity kWh and fuel NCV MJ distinct; 1 kWh = 3.6 MJ. Fuel volume conversion requires actual temperature/pressure, density and calorific basis."
process_map:
  - id: metal_fabrication
    name: "Receipt, cutting, forming and heat-transfer fabrication"
    inclusion: "conditional"
    inclusion_condition: "For site-fabricated housing, ducts or exchanger: sheet/tube preparation, punching, bending, pressing, machining and actual joining. Purchased assemblies bypass only supplier-completed operations."
    role: "Foreground manufacturing"
    quantitative_reference: "per one accepted finished machine"
  - id: surface_finish
    name: "Surface preparation, coating and curing"
    inclusion: "conditional"
    inclusion_condition: "Actual degreasing, rinse, abrasive cleaning, liquid or powder coating and cure; purchased finished parts retain supplier finishing burden."
    role: "Foreground manufacturing"
    quantitative_reference: "per one accepted finished machine"
  - id: assembly
    name: "Fan, heat-source and controls assembly"
    inclusion: "required"
    inclusion_condition: "Fit actual fan/blower, motor, guards, fasteners, wiring and controls; burner and heat exchanger only if present. Supplied-hot-air distributor may have neither burner nor exchanger."
    role: "Foreground manufacturing"
    quantitative_reference: "per one accepted finished machine"
  - id: factory_acceptance
    name: "Factory acceptance and rework"
    inclusion: "required"
    inclusion_condition: "Document actual fan/controls/electrical and dimensional checks. Leak/pressure testing applies to sealed fuel/heat-transfer circuits; combustion QA only to fired configurations actually tested at this factory. No universal testing duration or fuel."
    role: "Foreground manufacturing"
    quantitative_reference: "per one accepted finished machine"
  - id: dispatch
    name: "Packaging and factory gate release"
    inclusion: "required"
    inclusion_condition: "Release one accepted complete declared configuration; separate protective packaging from net machine mass."
    role: "Foreground manufacturing"
    quantitative_reference: "per one accepted finished machine"
  - id: site_services
    name: "Shared utilities and pollution control"
    inclusion: "required"
    inclusion_condition: "Attribute actual maintenance, compressed-air generation, water treatment and exhaust capture once; no duplication in process meters."
    role: "Foreground manufacturing"
    quantitative_reference: "per one accepted finished machine"
