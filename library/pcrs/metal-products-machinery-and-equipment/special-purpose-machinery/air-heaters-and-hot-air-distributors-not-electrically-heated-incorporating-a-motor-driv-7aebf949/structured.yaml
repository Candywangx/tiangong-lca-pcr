system_boundary:
  rules:
    - rule_id: boundary_factory
      applies_to: "all processes"
      rule: "Include actual fabrication, surface finish, assembly, QA/repeated tests, rework, packaging, utilities and pollution controls before gate. Purchased finished components retain upstream material and production burdens; internal intermediate transfers cancel."
      source_ids:
        - reznor-udx-specification
    - rule_id: boundary_use
      applies_to: "factory_acceptance"
      rule: "Only factory test energy/emissions belong here. Installation, field commissioning, lifetime fuel/fan power, maintenance replacement and end-of-life are excluded and require separate downstream scenarios. A supplied-hot-air distributor does not produce its heat upstream at this factory unless actual test heat is supplied."
      source_ids:
        - dantherm-direct-indirect
    - rule_id: boundary_atomic
      applies_to: "site audit"
      rule: "Add every actual distinct fuel, solvent, joining alloy, purchased component, waste and emission species as an atomic row. These candidate rows require route audit; no omitted-as-zero. If cure combustion, purchased test steam/heat, direct water withdrawal or other services occur, add their individual exchanges and matched upstream/direct emissions."
      source_ids: []
