  production_route: "Received stock/parts → conditional on-site molding, sheet fabrication, frame welding and coating → configuration-controlled assembly → factory acceptance/rework → dispatch."
  market_state: "New complete accepted appliance, dry and empty of eggs/chicks/test water; supplied detachable parts included; shipping packaging recorded separately."
functional_unit:
  what: "Manufacturing delivery of a complete appliance for declared electric poultry egg incubation/hatching or electric brooding; biological operation is outside the dataset."
  how_much: "1 kg of accepted net complete machine of one specified configuration; a normalized share of the complete product, not an independently usable kilogram component."
  how_well: "Conforms to released BOM/drawings and actual model acceptance criteria for installed heat/control, air circulation, turning, humidity provision and electrical safety. Do not substitute an egg-hatching trial or chick outcome for machine conformity."
  how_long_or_cycle: "One manufacturing and acceptance cycle; no service life, number of incubation batches or brooding weeks specified."
  reference_flow_link: "finished_machine"
system_boundary:
  rules:
    - rule_id: boundary_manufacturing
      applies_to: "foreground"
      rule: "Include actual site receipt-to-release activities, attributable utilities, losses and rework. Conditional processes apply only when work orders show they occur."
      source_ids: []
    - rule_id: boundary_configuration
      applies_to: "complete_machine"
      rule: "Include all supplied parts, including incubator trays/link/covers and brooder panel/adjustable legs/matched power unit. Model-specific instructions illustrate supply boundaries; no universal materials or quantities transferred."
      source_ids:
        - brinsea-ovation
        - brinsea-ecoglow
    - rule_id: boundary_exclusions
      applies_to: "downstream"
      rule: "Exclude incubation/brooding operating energy, eggs/chicks, mortality, litter, feed, cleaning between farm cycles and animal emissions. Record actual factory test burdens only; test eggs or artificial loads used by a site need separate measured specific exchanges."
      source_ids: []
    - rule_id: boundary_emissions
      applies_to: "elementary_outputs"
      rule: "Record actual measured substances and receiving media after controls. Waste liquid sent to treatment is a waste exchange, not water-resource consumption or receiving-water discharge; unknown quantities are gaps, not zero."
      source_ids: []
