review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: "New complete electric poultry egg incubator/hatcher and electric contact/radiant brooder manufacturing category. Existing domestic fan/hood and non-electric fan-driven space-heater material records do not cover this dedicated poultry appliance. Exclude gas brooders, general building heating/ventilation, poultry keeping/feed/water equipment, separately sold parts and biological services. Narrower CPC context; classification acceptance separate. Old scaffold retained read-only and its identity not promoted."
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  evidence_limitations:
    - "Historical Brinsea model instructions support supplied-part and electric-heating architecture only; actual current BOM and foreground work/test instructions govern manufacturing."
    - "No universal product mass, polymer grade, heater rating, lifetime, factory consumption, hatchability or brooding outcome is prescribed."
    - "Inventory starting set requires completion against actual BOM, chemical and waste ledgers; unresolved identities and providers remain gaps."
  unresolved_flow_identities:
    - row_id: abs_trim
      selected_flow: "Discarded ABS molding trim"
      reason: "Search candidates do not verify discarded ABS trimming waste with the stated composition and mass reference."
    - row_id: stainless_sheet
      selected_flow: "Cold-rolled stainless-steel sheet"
      reason: "Direct Stainless Steel has contradictory official Chinese non-alloy angle-section identity; generic Steel Sheet is carbon-steel with conflicting Chinese silver name, not this sheet."
    - row_id: carbon_plate
      selected_flow: "Hot-rolled carbon-steel plate"
      reason: "Search plate candidates have conflicting material identities or pipe-mill-specific routes; no applicable carbon-plate identity verified."
    - row_id: stainless_offcuts
      selected_flow: "Untreated stainless-steel sheet offcuts"
      reason: "Returned raw steel identities do not verify alloy-specific untreated stainless offcut waste."
    - row_id: powder_waste
      selected_flow: "Discarded polyester coating powder"
      reason: "Returned powder-waste identities have different location or reference-property restrictions; unrestricted polyester powder waste mass identity not verified."
    - row_id: cabinet
      selected_flow: "Finished incubator enclosure"
      reason: "Returned ovens, air-conditioning subassemblies and heater housings do not identify a finished poultry incubator enclosure."
    - row_id: heater
      selected_flow: "Finished electric resistance heater module"
      reason: "Direct public Electric heating element uses Comparative Toxic Unit for ecosystems (CTUe) as its reference property, not Mass; reject this identity for the measured component kg exchange."
    - row_id: brooder_panel
      selected_flow: "Finished low-voltage brooder heating panel"
      reason: "Electric heating element and whole space-heater categories do not identify the sealed complete low-voltage brooder panel."
    - row_id: fan
      selected_flow: "Finished incubator circulation fan assembly"
      reason: "Search and refined search returned a pneumatic conveying module containing blower/piping/filter, not an incubator circulation fan."
    - row_id: turner
      selected_flow: "Finished egg-turning geared drive"
      reason: "Wind-turbine gearboxes, handheld-tool motors and unspecified CN motor modules do not identify the complete egg-turning geared drive."
    - row_id: egg_tray
      selected_flow: "Finished polypropylene egg tray"
      reason: "Returned polypropylene resin/recycling/waste or the entire incubator category cannot identify a finished egg tray."
    - row_id: controller
      selected_flow: "Finished temperature-control electronic board"
      reason: "English and Chinese controller searches returned unrelated elementary chemicals; no applicable assembled temperature-control board verified."
    - row_id: sensor
      selected_flow: "Finished temperature-and-relative-humidity sensor module"
      reason: "English and Chinese searches returned unrelated substances rather than a combined physical sensor module."
    - row_id: power_supply
      selected_flow: "Finished mains-to-low-voltage brooder power supply"
      reason: "Search returned photovoltaic panels and rated distribution transformers, not the supplied mains-to-low-voltage brooder power unit."
    - row_id: harness
      selected_flow: "Finished insulated copper wiring harness"
      reason: "Connectorized intermediate leads, 20-pin dishwashing ribbon proxies and winding wire do not establish the specified finished copper harness."
    - row_id: legs
      selected_flow: "Finished adjustable brooder support leg"
      reason: "Returned mounting/support categories do not establish an adjustable brooder corner leg and its actual material."
    - row_id: water_pan
      selected_flow: "Finished polypropylene incubator water pan"
      reason: "Returned glass-fibre-reinforced plastic tank is not a finished polypropylene incubator pan; integral base channels must not be duplicated."
    - row_id: gasket
      selected_flow: "Finished silicone-rubber door gasket"
      reason: "Returned CN sealing-element category does not specify silicone rubber or the door-gasket shape; supply geography and material are unresolved."
    - row_id: bolt
      selected_flow: "Finished steel hexagon bolt"
      reason: "Returned aluminium bottle screw-cap closure is not a steel hexagon bolt."
    - row_id: test_wastewater
      selected_flow: "Spent incubator humidification-test water"
      reason: "Search returned Chemical Oxygen Demand, an oxygen-demand indicator rather than bulk humidification-test wastewater; resource or tap-water identities cannot stand for this waste liquid."
