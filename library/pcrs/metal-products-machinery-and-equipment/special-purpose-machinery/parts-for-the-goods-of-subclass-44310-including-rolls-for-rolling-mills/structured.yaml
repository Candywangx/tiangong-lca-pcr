system_boundary:
  rules:
    - rule_id: gate
      applies_to: "foreground"
      rule: "Include actual receipt, site fabrication, mechanical/control assembly, integration, factory test/rework, common services, waste and packing through accepted release."
      source_ids: []
    - rule_id: make_buy
      applies_to: "supplier_interface"
      rule: "For each component choose its actual make/buy state: complete bought roll blank, copper plate, trunnion ring, ladle mechanism, roller jacket/shaft/bearing unit or hydraulic cylinder includes embedded inputs once; own fabrication uses actual feedstocks and operations instead. Charge only subsequent site work. Pair internal transfers; do not list site-made intermediates as purchased imports."
