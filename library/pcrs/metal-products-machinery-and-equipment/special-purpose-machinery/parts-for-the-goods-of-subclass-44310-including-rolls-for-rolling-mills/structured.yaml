    - rule_id: factory_use
      applies_to: "production"
      rule: "Include actual factory dimensional/material/NDT/motion/pressure/leak acceptance and documented manufacturing qualification trials, actual test media, cleaning water, electricity and consumed lubricant. Recovered trial materials uses measured returns and stocks. Customer molten metal, cast products or rolled steel and downstream plant operation are not dedicated part manufacturing output."
      source_ids: []
