      applies_to: "route"
      rule: "Cards are specific conditional anchors, not universal recipes. Audit actual BOM, formulations, test media, packaging, fuels, waste and species. Add each missing atomic actual exchange; document not_applicable only with absence evidence, unknown differs from zero. Unknown alloy, mould binder, weld overlay, plating or spray-feed formulation requires actual supplied-state evidence."
      source_ids: []
    - rule_id: upstream
      applies_to: "links"
      rule: "Link supplier production and transport at actual grade, state, delivery geography/voltage and period; external treatment after measured waste transfer is distinct from site emissions. Without completed providers this factory package is not a complete cradle-to-gate result."
      source_ids: []
