  unresolved_category_cases: 'Parts solely or principally for actual44918 hosts: boule/wafer/device/IC/FPD fabrication, mask/reticle manufacture or repair, device/IC assembly and dedicated handling. Separately review ceramic machinery parts chapter69, technical glass parts7019/7020 or laboratory7017, general-purpose components, infrastructure and consumables; semiconductor application alone is insufficient.'
