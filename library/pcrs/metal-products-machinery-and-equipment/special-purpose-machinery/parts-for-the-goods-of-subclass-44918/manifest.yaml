  unresolved_inventory_uuids: Bounded directed queries do not confirm every specific alloy/blank/ceramic/resin/target/electrode/gas or outgoing waste. Generic name, wrong active classification, customer wafer purpose, wrong supplied completion or chemistry does not establish compatible identity. Unknown is not absent or zero.
