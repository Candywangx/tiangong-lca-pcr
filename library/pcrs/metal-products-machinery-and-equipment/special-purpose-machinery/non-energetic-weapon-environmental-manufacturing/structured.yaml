  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Require positive net M kg with current complete delivered configuration, physical provenance, calibration/tare and controlled release. Same-configuration accepted quantity must agree with these originals. Controlled acceptance records are only the collection interface, not proof without original physical metrology. No catalogue or group-total mass estimate. Missing source records requires data/scientific review."
      evidence: "actual physical method/readings, calibration/tare, mass closure and acceptance"
    - id: quality_speciation
      applies_to: "current chemicals, wastewater and sludge"
      requirement: "Preserve actual chemical/formulation, CAS where established, phase, wet/dry basis and analytical speciation. Total chromium is not CrVI or CrIII; hexavalent compound is not chromium metal. Chemical feed, captured sludge, gross wastewater and actually released dissolved species require separate identities and balances. Historical groundwater release or substitution intent is not current production evidence; never assume chromium-free state."
      evidence: "current SDS/analysis definitions and receiver/species records"
    - id: quality_balance
      applies_to: "materials, recovery, water and meters"
      requirement: "Reconcile actual new-supply versus internal recovery and opening/closing stocks, product/reject and final waste without double-counting. Separate technosphere water from natural-resource abstraction and effluent, treatment service from contained resources, and shared from stage meters. Preserve meter failures, substitutions/estimates and uncertainty; HK2024 notes a water-meter anomaly, not a product consumption default."
      evidence: "current environmental reconciliations, anomaly records and causal drivers"
    - id: quality_completeness
      applies_to: "actual dataset, both product families and providers"
      requirement: "Audit the whole current non-operational environmental interface register beyond candidate rows, with measured/calculated/missing/evidenced not_applicable distinguished. A shared method does not establish shared material recipe or emissions. Disclose supplier/outsourcing/withheld scope and excluded functional-testing/capital/later lifecycle contributions. Missing current records is a gap, not zero. No complete cradle-to-gate or scientific approval claim from contract checking."
      evidence: "current complete environmental records and transparent coverage gaps"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference and accepted_product"
    rule: "Exact reference name equals accepted_product output. Require one complete new non-energetic accepted unit, current configuration/net M kg under cp_mass, physical provenance and normalize_mass. Blank candidate reference UUID is registered at that exact row in unresolved_flow_identities. Independent parts, energetic content and gross shipping mass cannot substitute."
    source_ids: []
  - rule_id: validate_identity_basis
    applies_to: "all rows and both languages"
    rule: "Verify lawful matching lowercase identifiers and actual projected row/protocol/rule links, per-unit q_item/M kg and accepted-count aggregation. Preserve actual public reference properties/units, official localized UUID names, atomic exchanges and chemical/media/supply qualifiers. CrVI/CrIII/waste/species distinctions cannot be replaced by generic chromium totals."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "actual interface and dataset use"
    rule: "Require current environmental-only scope evidence and independently reviewed make/buy, recovery/receiver and mass closure before claiming complete foreground coverage. Historical remediation and public group totals are not current unit burdens. Uniform reporting across families conveys no functional equivalence or common default emissions. Candidate science review remains pending."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset and background_dataset after actual data completion and review"
  downstream_use: "Environmental manufacture input for a separately declared non-energetic product lifecycle, with omitted stages explicitly visible"
  allowed_use: "Manufacturing environmental accounts/comparisons within matching actual configuration, delivered state, environmental gate and disclosed coverage; no automatic cross-family comparison"
  excluded_use: "Ammunition and energetic materials/charges or their processing; products with inseparable energetic contents; independently supplied parts; ceremonial/edged arms; used/refurbished products and restoration; use, functional/live-fire testing, deployment, storage after gate and end of life. An actual excluded factory activity is a disclosed coverage gap, not zero burden."
  required_metadata: "neutral product family/configuration and accepted release identifier; complete new non-energetic delivery state; producer/site/reporting period; actual accepted quantity; positive net M kg, physical mass provenance and controlled acceptance record; packaging/fixture exclusion; environmental make/buy and subcontractor gates; chemical supply/SDS state and chromium analytical speciation when applicable; actual new-supply versus recovery/stock balances; wastewater/sludge/oily-chip receiver and wet/dry basis; causal shared allocation; omitted/withheld/excluded activities and upstream uncertainty"
  required_quality_disclosure: "Current records, M provenance, chemical speciation/wet-dry basis, receiver/recovery/stock and allocation evidence, unresolved identities, withheld/omitted upstream and excluded stages; scientific review pending"
  update_trigger: "Product completion/configuration, actual supply/chemical/waste state, chromium replacement status, recovery loop, site/provider/receiver, metrology or allocation changes"
data_sources:
  - id: "hk"
    type: "literature"
    reference: "[Heckler & Koch Nachhaltigkeitsbericht2024](https://www.heckler-koch.com/Downloads/Investor%20Relations/Abschl%C3%BCsse/2024/Abschlussbericht/Nachhaltigkeitsbericht%202024.pdf)"
    used_for: "Printed/PDF11 and13: disclosed water/waste monitoring, water-meter anomaly and energy records. Facility/group reporting-year context only, not classification proof, current product closure, unit mass/intensity or universal process requirement. No numeric totals/factors adopted."
  - id: "nydec"
    type: "literature"
    reference: "[NYDEC official Watervliet Periodic Review Report](https://extapps.dec.ny.gov/data/DecDocs/401034A/Report.RCRA.401034A.2019-03-13.2018%20Final%20PRR.pdf)"
    used_for: "Actual document March6 2019 revision1 (URL label2018), PDF5/printed1 section2.1 and adjacent remediation summary: heavy-product context and solvent, chromium wastewater, oily-metal waste interfaces mixing current/past activities. Historical context only; not actual current delivery/M, mandatory chemistry, production factors, completed CrIII conversion or routine-manufacture allocation of remediation. No dimensions, quantities or technical manufacture details adopted."
  - id: "epa"
    type: "extension_guidance"
    reference: "[US EPA TRI Overview](https://www.epa.gov/enviro/tri-overview)"
    used_for: "TRI Overview first chemical-management paragraph: distinguish reported chemical management/recycling/treatment from environmental releases. General US reporting context only; no universal legal applicability/threshold, product class or process emission factor adopted."
