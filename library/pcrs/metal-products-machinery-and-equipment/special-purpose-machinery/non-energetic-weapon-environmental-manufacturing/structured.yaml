allocation_rules:
  - rule_id: allocation_shared
    applies_to: "shared resources and families"
    rule: "Directly assign measured exchanges where possible. Allocate residual shared burden using a current causal driver: share = covered configuration driver / sum of covered drivers. Require actual records of meter scope, usage/load/occupied service and accepted counts; preserve period, denominator, standby, driver rationale and sensitivity. Different heavy/small families need separate actual drivers; corporate totals divided by catalogue product weights or sales counts are not acceptable."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "actual recovery, stock and waste"
    rule: "Track incoming new supply, internal recovered material, stock change, final product/reject and final waste once. Internal recovered solvent/oil/water is not new purchased supply or an automatic virgin-production credit. Preserve actual recovery and treatment resource burden. Wet slurry and contained chromium are different bases, and CrIII/CrVI shares do not create two copies of one wastewater stream."
    source_ids: []
  - rule_id: allocation_coproduct
    applies_to: "scrap and other outputs"
    rule: "Trace actual receivers and material status. Waste recyclability alone does not establish co-product status or credits. Any co-product allocation requires actual causal/economic records and sensitivity. Rejected/reworked units retain attributed burden in accepted production scope; no default yield, shared quota or recovery efficiency."
    source_ids: []
