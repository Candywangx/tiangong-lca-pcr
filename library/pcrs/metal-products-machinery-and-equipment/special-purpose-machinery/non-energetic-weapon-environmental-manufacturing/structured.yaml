system_boundary:
  rules:
    - rule_id: boundary_accounts
      applies_to: "all partitions"
      rule: "Collect actual production environmental burdens, rework and rejects, shared controls and outsourced treatment at non-operational gates. Long-lived infrastructure/tooling and independent R&D are excluded from core operating foreground and disclosed. Functional/energetic tests and later lifecycle burdens are excluded with actual omissions disclosed; no silent complete-LCI claim."
      source_ids:
        - hk
        - nydec
    - rule_id: boundary_interface_audit
      applies_to: "all actual exchanges"
      rule: "Cards are conditional atomic starting examples, not a weapon material recipe or complete inventory. Independently review every current safe environmental interface; add each actual supply, chemical, waste or released species separately with its physical identity. Undisclosed inputs cannot be omitted as zero. Do not disclose structure, technical settings, manufacture/assembly methods or functionality."
      source_ids: []
    - rule_id: boundary_water_waste
      applies_to: "treatment, recovery and receivers"
      rule: "Supplied water is technosphere input, not natural-water withdrawal or effluent. Track actual recovery/reuse internally and each final wastewater/sludge/oily-chip transfer at the receiving boundary. Discharged chemical species are distinct from gross waste. Historical contaminated groundwater, legacy soil remediation and indoor-air mitigation are separate activities, not current unit manufacturing emissions."
      source_ids:
        - nydec
        - epa
