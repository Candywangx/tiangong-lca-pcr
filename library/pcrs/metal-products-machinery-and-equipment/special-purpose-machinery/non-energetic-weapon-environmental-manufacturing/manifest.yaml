review_metadata:
  scientific_review: pending
  semantic_boundary_decision: One classification-independent complete new
    non-energetic weapon/firearm environmental-accounting record, shared across
    candidate CPC44720 and44730 context, not two military/civil duplicates.
    HK2024 supports disclosed small-arms facility monitoring and anomalies, not
    product classification; NYDEC2019 section2.1 supports mixed
    historical/current heavy-system solvent/chromium-water/oily-chip
    environmental interfaces, not current unit intensity or accepted completion
    proof. Material need is complete-product procurement/acceptance/mass
    closure, species/receiver/recovery accounting and conditional family
    interfaces, with current records required. Existing44740 ammunition
    methodology has a different product boundary; alloy-stock PCRs are upstream;
    metal-treatment/coating service is an empty scaffold and cannot replace
    whole-product closure. Both CPC relationships remain proxy/review candidate
    context; no accepted mapping created.
  classification_relationships_review: Both contexts are candidate proxy
    relationships requiring product-state/scope review; no positive mapping or
    automatic coverage acceptance.
