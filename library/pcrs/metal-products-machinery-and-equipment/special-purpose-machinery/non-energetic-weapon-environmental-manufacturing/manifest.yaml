  unresolved_quantity_ranges:
    - No current per-unit M or factory resource/waste/emission q values,
      chromium speciation, supplier interfaces, recovery/allocation originals
      obtained. Current physical/acceptance and environmental records must be
      collected; no numerical defaults or cross-family equivalence.
  evidence_limitations:
    - HK2024 supports disclosed facility monitoring/anomaly only, not44720/44730
      product classification or current unit closure.
    - NYDEC2019 supports heavy-product environmental interface background mixing
      current/past operations; not current product quantities, mandatory
      chromium route, complete supply state or remediation-to-production
      allocation.
    - Army2024 chromium-substitution and FY24 IAP originals inaccessible403; not
      adopted as verified evidence or current conversion claim.
    - Common complete-product environmental method is
      classification-independent; actual configuration,
      chemistry/recovery/receiver and positive physical M records required. No
      functional/technical weapon content.
    - Receipt-to-accepted operating foreground excludes declared capital,
      functional testing and later stages; not complete cradle-to-gate without
      reviewed upstream and coverage.
