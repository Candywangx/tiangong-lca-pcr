  reference_flow_link: "final_product"
system_boundary:
  rules:
    - rule_id: boundary_machine
      applies_to: "all processes"
      rule: "Include actual machine manufacture through accepted factory gate. Factory-test substrate, ink, adhesive, washing solvent and test power are included only before this gate; subsequent commercial printing/binding, customer utilities, installation, maintenance and end of life are separate scenarios."
      source_ids:
        - un-cpc3-2025
        - heidelberg-manufacture-2007
    - rule_id: boundary_makebuy
      applies_to: "receipt, foundry, fabrication, assembly"
      rule: "Maintain a BOM make/buy matrix with supplied state, operations and provider. A purchased finished motor/cabinet/cylinder includes its embedded materials and manufacture once; never additionally enter its embedded steel, copper, electronics, oil or supplier energy as new assembly inputs. When manufactured in house replace that purchased interface with actual raw inputs and operations. Outsourced casting/plating/coating must not disappear."
      source_ids:
        - heidelberg-production
    - rule_id: boundary_atomic
      applies_to: "all rows"
      rule: "These conditional cards are candidate exchanges, not a universal BOM. Add each actual grade, formulation, plating chemical, fuel, refrigerant, packaging item, waste and emission separately after site audit. Record integrated compressed air as its actual upstream electricity/fuel service, without simultaneously counting purchased air and its full generating electricity. Justify proportional infrastructure/capital and maintenance coverage."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Received actual raw materials, semi-finished castings and completed components with supplier operations disclosed"
  starting_condition_role: "Supplier product inputs linked to complete upstream burdens"
  product_classification_scope: "Bookbinding machinery, machinery for type-setting and the like, printing machinery and machines for uses ancillary to printing (except office type sheet-fed offset printing machinery)"
  recursive_input_rule: "Purchased same-category modules carry their supplier burdens once; cancel internal returns and never give automatic substitution credits"
  upstream_dataset_requirement: "Link actual material/component manufacture, transport, electricity/provider, each chemical/fuel and actual waste treatment; missing coverage is disclosed"
  disclosure: "machine family and model; serial/configuration and BOM revision; sheet/web/object substrate interface and format; offset/letterpress/flexographic/gravure/screen/electrostatic or digital imaging technology; colour-unit count and feeder/delivery architecture; plate/cylinder preparation method; binder sewing/gluing mechanism and selected tank; drive/control and hydraulic/pneumatic circuits; dryer/UV/laser options; accepted net mass and test configuration; factory gate state and included modules; geography, supplier interface and reporting period"
