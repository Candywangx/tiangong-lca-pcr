  calculation_rules:
    - id: normalize_mass
      applies_to: "frame, cylinder, roller, anilox, motor, cabinet, laser, printhead, glue_tank, needle, bearing, pump, valve, cable, iron_charge, silica_sand, phenolic_binder, slag, spent_sand, steel_plate, steel_bar, aluminium, wire, argon, cutting_oil, steel_chips, aluminium_offcuts, spent_oil, naoh, steel_grit, powder, xylene, powder_waste, spent_grit, xylene_air, hydraulic_oil, grease, paper, plate, offset_ink, lep_ink, toner, eva, pur, ipa, book_sections, test_book_waste, rejected_press, rejected_binder, rejected_platesetter, test_paper_waste, test_eva_waste, test_pur_waste, ipa_air, wood, film, strap, electricity, natural_gas, purchased_water, wastewater, sludge, co2, co, no2, pm, water_vapour, iron_water"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: configuration
      applies_to: "machine"
      requirement: "machine family and model; serial/configuration and BOM revision; sheet/web/object substrate interface and format; offset/letterpress/flexographic/gravure/screen/electrostatic or digital imaging technology; colour-unit count and feeder/delivery architecture; plate/cylinder preparation method; binder sewing/gluing mechanism and selected tank; drive/control and hydraulic/pneumatic circuits; dryer/UV/laser options; accepted net mass and test configuration; factory gate state and included modules; geography, supplier interface and reporting period"
      evidence: "BOM; supplier state; drawings; test/acceptance records"
    - id: physical_closure
      applies_to: "physical materials/species only"
      requirement: "For each physical material and contained species, reconcile external input and opening stocks with accepted product, closing stocks, external scrap, slag, sludge, wastewater and air/water releases; apply the matched species assay and wet/dry basis to EVERY term, including product and purchased inputs. Never equate wet waste, oxide or alloy mass to contained metal. Include reaction production/consumption, sample uncertainty and paired return transfers. Close actual water using external makeup, inlet moisture, opening/closing storage, retained product moisture, evaporation, discharge, transfers and reaction water; density conversions must be measured or sourced. Close each solvent separately including retained coating/product, recovered solvent, capture-media loading, verified destruction, wastewater and solid residues. Internal paired returns cancel across the chosen boundary while rework energy and losses remain. Investigate residuals against actual combined measurement, sampling and allocation uncertainty; no universal tolerance."
      evidence: "Matched assays and measurement/sampling/allocation uncertainty"
    - id: provider_identity
      applies_to: "all exchanges"
      requirement: "Resolve actual atomic flow, chemical species/state, property/unit, provider geography/year and release compartment. Candidate guidance does not complete private factory evidence or resolve unverified UUIDs."
      evidence: "manifest review_metadata"
    - id: empirical_ranges
      applies_to: "all inputs and outputs"
      requirement: "No universal intensity, mass, yield or empirical range established; collect actual records, disclose uncertainty and obtain independent compatible evidence before adopting a guardrail."
      evidence: "Site records and reviewed public evidence"
validation_rules:
  - rule_id: validate_scope
    applies_to: "machine"
    rule: "Check function and excluded countercategories, actual configuration, accepted net output, all required qualifiers and correct reference UUID; industrial digital press is not an office peripheral by assumption."
    source_ids:
      - un-cpc3-2025
  - rule_id: validate_normalization
    applies_to: "all rows"
    rule: "Check positive N, D and M for same BOM/test configuration; verify every conversion against accepted output including rejects/rework only in numerator."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "physical material/species records"
    rule: "For each physical material and contained species, reconcile external input and opening stocks with accepted product, closing stocks, external scrap, slag, sludge, wastewater and air/water releases; apply the matched species assay and wet/dry basis to EVERY term, including product and purchased inputs. Never equate wet waste, oxide or alloy mass to contained metal. Include reaction production/consumption, sample uncertainty and paired return transfers. Close actual water using external makeup, inlet moisture, opening/closing storage, retained product moisture, evaporation, discharge, transfers and reaction water; density conversions must be measured or sourced. Close each solvent separately including retained coating/product, recovered solvent, capture-media loading, verified destruction, wastewater and solid residues. Internal paired returns cancel across the chosen boundary while rework energy and losses remain. Investigate residuals against actual combined measurement, sampling and allocation uncertainty; no universal tolerance."
    source_ids: []
  - rule_id: validate_completion
    applies_to: "dataset"
    rule: "Check conditional make/buy routes, every external atomic exchange, upstream component coverage once, utilities without duplication, waste fate and species-specific post-control emissions. Unresolved mandatory UUID, quantity, supplier coverage or unit conversion blocks a complete dataset. Unknown is not zero and machinery methodology is not a conformance certificate."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "process; lifecyclemodel"
  allowed_use: "Manufacturing one declared machine configuration with linked upstream burdens"
  excluded_use: "Printed products, customer operation, office/textile equipment, standalone spare-parts datasets or unqualified cross-family comparison"
  required_metadata: "machine family and model; serial/configuration and BOM revision; sheet/web/object substrate interface and format; offset/letterpress/flexographic/gravure/screen/electrostatic or digital imaging technology; colour-unit count and feeder/delivery architecture; plate/cylinder preparation method; binder sewing/gluing mechanism and selected tank; drive/control and hydraulic/pneumatic circuits; dryer/UV/laser options; accepted net mass and test configuration; factory gate state and included modules; geography, supplier interface and reporting period"
  required_quality_disclosure: "Make/buy scope, provider and source limitations, unresolved identities/quantities/ranges, uncertainty, allocation and waste destination"
  update_trigger: "Machine function/configuration/BOM, production route, acceptance, supplier or gate-state change"
