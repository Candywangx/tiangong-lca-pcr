allocation_rules:
  - rule_id: allocation_causality
    applies_to: "shared manufacturing"
    rule: "First subdivide configuration and process records; otherwise justify measured physical-causality drivers such as loaded machine hours, energy meters, coating area or furnace load and cycle. Mass allocation must explain different configuration/process burdens. Economic fallback requires consistent prices/period and sensitivity. Retain unallocated totals and reconcile allocations to them."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rejects, scrap and internal returns"
    rule: "Accepted net output denominator excludes rejects but attributable production includes their material, repeated work and treatment burdens. Paired internal return quantities cancel; energy and losses do not. Measure external scrap/fate separately; sale is not alone co-product proof, and no avoided-metal credit is assumed."
    source_ids: []
