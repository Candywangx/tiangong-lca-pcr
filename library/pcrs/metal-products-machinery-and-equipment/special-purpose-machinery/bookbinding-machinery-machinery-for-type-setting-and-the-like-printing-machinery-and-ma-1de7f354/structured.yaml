functional_unit:
  what: "Provide an accepted machine with declared printing, imaging or binding function"
  how_much: "1 kg of accepted complete machine; also disclose one-machine accepted net mass M"
  how_well: "Actual contracted model, safety/functional acceptance and configuration; no cross-family performance equivalence"
