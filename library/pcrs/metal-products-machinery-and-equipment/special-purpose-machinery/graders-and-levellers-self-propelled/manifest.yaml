    explanation: Published Product flow exact complete manufactured CPC44422, Mass reference; both own correctly-directed output queries returned it and own full getter/native support confirm. Concrete shipped scope and factory remain required.
  unresolved_inventory_uuids: Complete industrial engine Items, generic purchased diesel Mass, conditional CN below1kV user electricity, actual treated process water, wooden load board, untreated industrial steel scrap, compatible factory spent oil and ordinary-air fossil CO2/CO are qualified conditionally. Other explicit row identities remain gaps after actual correct-role bounded queries. Reject conflicting bilingual/classified steel, artists paint, wind-farm coolant, automobile tyre, generic pump for specified piston role and nitrite for NO2. Unresolved does not mean zero or absent.
  unresolved_quantitative_ranges: No universal BOM, recipe, machine net mass, factory load, tests, fill, loss, emission factor, lifetime or performance range. Require actual same-configuration measurement and foreground evidence.
  evidence_limitations: CPC supports full category; independent Deere and Komatsu original equipment bodies support conventional wheeled diesel examples and distinct circle/transmission architecture, not actual factory BOM/make-buy/tests. Other self-propelled leveller and propulsion routes require item-specific evidence without excluding the category. OEM operating mass includes full fuel and operator, refill capacity is not actual factory fill. Failed Cat fetch is not adopted.
