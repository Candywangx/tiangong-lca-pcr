allocation_rules:
  - rule_id: allocation_direct
    applies_to: "foreground_burden_allocation"
    rule: "Assign measured work-order exchanges directly to configuration; split shared causally using measured machine-hours/work/orders where justified. State driver, scope, uncertainty and alternatives; no universal mass or value allocation factor."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "foreground_burden_allocation"
    rule: "Keep attributable reject/rework/test burden with accepted output; rejected product and consumed test medium are not accepted denominator. Waste outputs receive no automatic substitution credit; disclose recovery boundary."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "test_pack"
      flow_role: "accepted_reference"
      record_type: "weighing_record"
      raw_fields: "model; configuration; serial; accepted net mass M; Naccepted; Dnet; retained fill; scale; acceptance"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted unit"
      temporal_coverage: "same production period"
      site_scope: "same factory/configuration"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration, serial and acceptance evidence"
    - protocol_id: cp_fabrication
      process_id: "fabrication"
      flow_role: "atomic_exchanges"
      record_type: "production_record"
      raw_fields: "exchange; Qattr; configuration; period; Naccepted; native units; provider; opening/closing stocks; WIP; returns; make/buy; retention; own assay"
      collection_method: "Use calibrated weighing/meters, actual BOM, certificates/SDS, work orders and supplier interfaces; measure each retained fill separately from burned/drained test consumption and recirculation. Preserve engine item count and actual complete scope."
      unit: "kg; Item(s); MJ"
      frequency: "batch and meter interval"
      temporal_coverage: "same production period"
      site_scope: "same factory/configuration"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "meters, calibration, certificates, stocks, sampling, allocation uncertainty"
    - protocol_id: cp_surface
      process_id: "surface"
      flow_role: "atomic_exchanges"
      record_type: "production_record"
      raw_fields: "exchange; Qattr; configuration; period; Naccepted; native units; provider; opening/closing stocks; WIP; returns; make/buy; retention; own assay"
      collection_method: "Use calibrated weighing/meters, actual BOM, certificates/SDS, work orders and supplier interfaces; measure each retained fill separately from burned/drained test consumption and recirculation. Preserve engine item count and actual complete scope."
      unit: "kg; Item(s); MJ"
      frequency: "batch and meter interval"
      temporal_coverage: "same production period"
      site_scope: "same factory/configuration"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "meters, calibration, certificates, stocks, sampling, allocation uncertainty"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "atomic_exchanges"
      record_type: "production_record"
      raw_fields: "exchange; Qattr; configuration; period; Naccepted; native units; provider; opening/closing stocks; WIP; returns; make/buy; retention; own assay"
      collection_method: "Use calibrated weighing/meters, actual BOM, certificates/SDS, work orders and supplier interfaces; measure each retained fill separately from burned/drained test consumption and recirculation. Preserve engine item count and actual complete scope."
      unit: "kg; Item(s); MJ"
      frequency: "batch and meter interval"
      temporal_coverage: "same production period"
      site_scope: "same factory/configuration"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "meters, calibration, certificates, stocks, sampling, allocation uncertainty"
    - protocol_id: cp_test_pack
      process_id: "test_pack"
      flow_role: "atomic_exchanges"
      record_type: "production_record"
      raw_fields: "exchange; Qattr; configuration; period; Naccepted; native units; provider; opening/closing stocks; WIP; returns; make/buy; retention; own assay"
      collection_method: "Use calibrated weighing/meters, actual BOM, certificates/SDS, work orders and supplier interfaces; measure each retained fill separately from burned/drained test consumption and recirculation. Preserve engine item count and actual complete scope."
      unit: "kg; Item(s); MJ"
      frequency: "batch and meter interval"
      temporal_coverage: "same production period"
      site_scope: "same factory/configuration"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "meters, calibration, certificates, stocks, sampling, allocation uncertainty"
    - protocol_id: cp_shared
      process_id: "shared"
      flow_role: "atomic_exchanges"
      record_type: "production_record"
      raw_fields: "exchange; Qattr; configuration; period; Naccepted; native units; provider; opening/closing stocks; WIP; returns; make/buy; retention; own assay"
      collection_method: "Use calibrated weighing/meters, actual BOM, certificates/SDS, work orders and supplier interfaces; measure each retained fill separately from burned/drained test consumption and recirculation. Preserve engine item count and actual complete scope."
      unit: "kg; Item(s); MJ"
      frequency: "batch and meter interval"
      temporal_coverage: "same production period"
      site_scope: "same factory/configuration"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "meters, calibration, certificates, stocks, sampling, allocation uncertainty"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_denominator
      applies_to: "reference and inventory"
      requirement: "For one configuration/common period Qattr includes attributable reject/rework/test burdens; Naccepted is accepted complete count; Dnet sums calibrated accepted net masses; M = Dnet/Naccepted; q_item = Qattr/Naccepted; q_ref = Qattr/Dnet. Exclude packaging, operator, rejected units, consumed test load/media and other configurations from Dnet; reconcile WIP and stocks."
      evidence: "Actual same-period BOM, meters, calibrated weighing, assays, stocks, work orders and supplier evidence"
    - id: quality_make_buy
      applies_to: "each BOM item"
      requirement: "Reconcile actual part number, delivered completion/grade/assay, provider and make/buy. Bought engine/cab/axle/blade embeds supplier materials/processes/fills once; partial parts record remaining actual operations. Pair/cancel internal transfers and reconcile accepted retained BOM plus scrap, rework, returns and stocks; no invented material shares."
      evidence: "Actual same-period BOM, meters, calibrated weighing, assays, stocks, work orders and supplier evidence"
    - id: quality_fills
      applies_to: "first fill and tests"
      requirement: "Each fuel/oil/coolant/refrigerant/DEF identity reconciles own incoming mass/volume, supplier embedded prefill, opening/closing stocks, retained delivery, measured factory consumption, recovered/drained material and release. Retained delivery and burned test fuel are distinct fates; never apply service refill capacity as actual factory charge."
      evidence: "Actual same-period BOM, meters, calibrated weighing, assays, stocks, work orders and supplier evidence"
    - id: quality_utilities
      applies_to: "meters and shared services"
      requirement: "Same-period imports plus actual on-site generation minus exports/storage changes reconcile assigned fabrication/treatment/assembly/test/dispatch, evidenced conversion losses and unassigned residual. Shared rows only allocate the residual; never add total meters to subprocess meters or clip negative residuals. Investigate period/unit/calibration/allocation uncertainty. Internal energy transfers cancel; supplier boiler fuel is not fictional on-site combustion."
      evidence: "Actual same-period BOM, meters, calibrated weighing, assays, stocks, work orders and supplier evidence"
    - id: quality_water
      applies_to: "each physical water stream"
      requirement: "Each stream uses own measured gross mass, water fraction and documented density at actual temperature if collected by volume. Reconcile input moisture/process/coolant water with retained water, wet scrap/sludge, wastewater, evaporation, stocks and reaction water production/consumption. Paired returns cancel; investigate combined sampling/measurement uncertainty, no universal tolerance."
      evidence: "Actual same-period BOM, meters, calibrated weighing, assays, stocks, work orders and supplier evidence"
    - id: quality_species
      applies_to: "each material and emission species"
      requirement: "Each element/species term uses its own gross mass and own assay/concentration, wet/dry basis, stocks, reaction and returns. Gross steel/sludge is not contained iron/carbon. Solvent retention, recovery, capture-media/wastewater and actual destruction are distinct non-air fates; an unexplained residual never becomes air. Species-specific post-control concentration times matched gas/liquid flow over same period needs actual state/unit corrections and independent fugitive evidence. Carbon closure cannot derive CO/NOx; molecular NO2 differs from NOx as NO2 equivalent."
      evidence: "Actual same-period BOM, meters, calibrated weighing, assays, stocks, work orders and supplier evidence"
    - id: quality_identity
      applies_to: "each exchange"
      requirement: "Declare actual collected/calculated/not_applicable/unknown/missing status and each identity/source/range gap. Match type, supplied state, chemistry/CAS, classification, native property/unit and exact official bilingual name; generic label does not prove grade. No universal mass, recipe, loss, factor or service life."
      evidence: "Actual same-period BOM, meters, calibrated weighing, assays, stocks, work orders and supplier evidence"
