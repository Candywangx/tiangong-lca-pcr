review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: Environmental foreground account for surface
    finishing of one supplied new complete uncoated non-live motorized armoured
    vehicle. The factory receives a physically complete unit, records its
    procurement gate and actual environmental configuration identity, attributes
    actual conditional cleaning and supplied coating consumption,
    environmental-control electricity, water, collected wastes and measured
    releases, then records environmental quality acceptance, independent
    complete net mass and dispatch. Earlier vehicle and component construction
    is upstream. This PCR specifies environmental accounting and general
    metrology only; it provides no vehicle or weapon design, manufacture
    parameters, assembly sequence, functional details or performance
    optimization. No material armoured-vehicle environmental method found in the
    current-worktree manifest scan; old44710 scaffold is not promoted. Ordinary
    vehicle/tractor methods offer reusable environmental metering and
    normalization controls but do not establish this supplied complete uncoated
    non-live starting state and finish-only whole-vehicle reference boundary.
    This candidate is narrowly bounded by the procurement gate and observed
    environmental stages, not classification code alone; independent
    overlap/scientific review remains pending. Military manufacturing or
    security services are excluded, and no other author unfrozen canonical
    content was read.
  reference_identity_basis: Public44710 manufactured finished product has Mass/kg
    and permits complete motorized vehicle. Restrict this category identity to
    one complete non-live finished vehicle; parts and live loads excluded.
    Incoming uncoated state remains a distinct unresolved intermediate identity.
  evidence_limitations: Army August2021 life-cycle EA environmental passages are
    historical qualitative context only, not current factory quantities,
    mandated recipe, performance standard, universal low-impact finding or proof
    of any pollutant presence. EPA2026 official overview distinguishes
    industrial effluent applicability but does not impose a universal discharge
    limit. Actual current supplier SDS, measured environmental records and
    complete net mass originals are required; scientific review pending.
  unresolved_flow_identities:
    - row_id: incoming_vehicle
      selected_flow: Supplied complete uncoated non-live motorized armoured vehicle
      reason: Finished manufactured44710 flow is suitable for finished output, but
        does not establish the incoming uncoated intermediate supply state. No
        same-stage double counting.
    - row_id: cleaner
      selected_flow: Single supplied aqueous industrial cleaning formulation
      reason: Generic surfactant detergent does not establish the single actual
        industrial formulation/concentration; Liquid Detergent original is
        laundry use. Actual supplier SDS identity remains required.
    - row_id: cleaning_effluent
      selected_flow: Collected aqueous cleaning effluent sent to industrial treatment
      reason: Public cleaning-wastewater original explicitly models unspecified
        discharge to water; generic Wastewater original specifies manganese-slag
        washing route. Neither establishes actual collected vehicle-cleaning
        liquid to treatment.
    - row_id: primer
      selected_flow: Single supplied industrial vehicle primer formulation
      reason: Primer original discusses walls and cosmetics; Industrial Maintenance
        Coatings describes broad maintenance surfaces, not the actual single
        supplied new-vehicle primer formulation. No exact supplier SDS
        qualification established.
    - row_id: finish_coating
      selected_flow: Single supplied industrial vehicle finishing-coating formulation
      reason: Solvent-based Coatings original discusses PTFE floors/oxidative paint;
        Paint original discusses oil/alkyd paint; Water-based coating is
        indoor-decoration route. None establishes this actual single supplied
        vehicle finishing formulation; no chemistry inferred.
    - row_id: filter_pad
      selected_flow: Finished glass-fibre paint-exhaust filter pad
      reason: E-glass original is raw slivers/rovings/yarn/chopped strands, not
        supplied finished environmental filter pad; exact finished medium state
        remains unresolved.
    - row_id: spent_filter
      selected_flow: Paint-contaminated spent glass-fibre filter pad
      reason: Spent abrasive combines abrasives and filtration residues; Filter
        residue original is Product flow for filter-pulp solids. Neither
        identifies this single specified paint-contaminated spent glass-fibre
        pad.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
