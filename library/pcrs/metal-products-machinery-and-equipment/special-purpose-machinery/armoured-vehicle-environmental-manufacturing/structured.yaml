allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all processes"
    rule: "Separate configuration work orders, original meters, issue/return/stock and waste ledgers first. Attribute actual rework/reject environmental burden to accepted same-configuration output; ordered/started count is not accepted count. Prior whole vehicle manufacture not duplicated."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "shared utilities"
    rule: "Use measured causal environmental equipment time or submetered demand, document actual denominator and uncertainty. If physical allocation genuinely unavailable justify economic basis and sensitivity. No fixed scrap credit or unmeasured generic ratio."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "accepted complete output"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Use traceable weighing records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "each accepted whole vehicle"
      temporal_coverage: "matching finishing acceptance period"
      site_scope: "actual suitable complete-unit weighing facility"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "calibration/tare/raw whole-unit readings and independent incoming-plus-retained-additions mass closure"
    - protocol_id: cp_prepare
      process_id: "prepare"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "environmental configuration ID; supplier SDS/lot/supply state; original kg issue/return/stock/waste; original kWh and sampling/time/medium; same-configuration accepted count"
      collection_method: "Record actual individual supplier formulation or physical exchange, original calibrated utility meters and post-control species measurement only if present. Preserve stock/return/accepted-count closure, environmental work-order attribution and waste recipient; no inferred functional operations."
      unit: "kg; MJ"
      frequency: "per unit and full actual period"
      temporal_coverage: "same-configuration finishing acceptance cycle"
      site_scope: "actual environmental factory boundary"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "actual formulation identity, calibrated readings, uncertainty and stock/count closure"
    - protocol_id: cp_finish
      process_id: "finish"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "environmental configuration ID; supplier SDS/lot/supply state; original kg issue/return/stock/waste; original kWh and sampling/time/medium; same-configuration accepted count"
      collection_method: "Record actual individual supplier formulation or physical exchange, original calibrated utility meters and post-control species measurement only if present. Preserve stock/return/accepted-count closure, environmental work-order attribution and waste recipient; no inferred functional operations."
      unit: "kg; MJ"
      frequency: "per unit and full actual period"
      temporal_coverage: "same-configuration finishing acceptance cycle"
      site_scope: "actual environmental factory boundary"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "actual formulation identity, calibrated readings, uncertainty and stock/count closure"
    - protocol_id: cp_dispatch
      process_id: "dispatch"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "environmental configuration ID; supplier SDS/lot/supply state; original kg issue/return/stock/waste; original kWh and sampling/time/medium; same-configuration accepted count"
      collection_method: "Record actual individual supplier formulation or physical exchange, original calibrated utility meters and post-control species measurement only if present. Preserve stock/return/accepted-count closure, environmental work-order attribution and waste recipient; no inferred functional operations."
      unit: "kg; MJ"
      frequency: "per unit and full actual period"
      temporal_coverage: "same-configuration finishing acceptance cycle"
      site_scope: "actual environmental factory boundary"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "actual formulation identity, calibrated readings, uncertainty and stock/count closure"
  calculation_rules:
    - id: normalize_mass
      applies_to: "incoming_vehicle; water; cleaner; cleaning_effluent; primer; finish_coating; filter_pad; paint_residue; spent_filter; particle_air; xylene_air; prepare_power; finish_power; dispatch_power; film"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass
      applies_to: "finished_machine"
      requirement: "Use actual calibrated suitable whole-unit weighing facility with original serial/date/configuration/readings/tare/repeat uncertainty. Do not invent a vehicle scale or net weight. M contains the same complete supplied non-live unit, retained dry finish and explicitly declared permanently retained supplied fluids counted once. Exclude operational fuel/live or test payload, temporary test/support equipment, external packaging and loose spares. Independently reconcile incoming whole net mass plus actual retained additions minus measured removals with finished M. Catalogue/combat/capacity/gross shipping mass cannot replace physical net records."
      evidence: "actual original whole-unit metrology and independent environmental mass balance"
    - id: quality_supply
      applies_to: "incoming_vehicle; primer; finish_coating; cleaner"
      requirement: "Trace actual complete incoming uncoated procurement state and environmental ID without describing internal systems. Each received chemical is one actual identified supplier formulation, SDS/version/lot/wet supply state and issue/return balance. A broad wall/cosmetic primer or PTFE/alkyd coating original does not establish vehicle industrial formulation. Separate individually supplied components, but never publish mixing ratios or use instructions. No duplicated complete vehicle plus component inventory."
      evidence: "actual supplier gate/SDS/batch ledger; waste-environment"
    - id: quality_emissions
      applies_to: "particle_air; xylene_air"
      requirement: "Only actual measured post-control mass/time/species/medium with original method, detection limit and uncertainty. CAS1330-20-7 identifies all-isomer xylene; total VOC, indoor exposure or long-term soil flows are not substitutions. Particle size unspecified only when genuinely unspecified. Captured filters/residue are waste, not airborne release. Historical2021 environmental report includes VOHAP-free coatings; it is not proof any xylene occurs. Zero, below-detection and unmeasured are distinguished. Background electricity emissions not local releases."
      evidence: "air-environment; actual species-specific sampling originals"
    - id: quality_water_waste
      applies_to: "water; cleaning_effluent; paint_residue; spent_filter"
      requirement: "Record actual supplied water and mass/volume metrology separately from contaminated collected liquids, wet paint residue and spent physical filter. Do not assume1kg/L for an industrial contaminated liquid; any volume-to-mass conversion requires measured same-stream density. Each waste composition/state, actual kg, recipient and treatment boundary independent. Direct discharge and treatment transfer differ. No universal EPA limit or pooled waste."
      evidence: "water-environment; waste-environment; discharge-environment"
    - id: quality_complete
      applies_to: "dataset"
      requirement: "Reconcile all real supplier/chemical stock, electricity and water meters, waste transfer and same-configuration accepted counts/rework. Add each actually present additional chemical, wiping medium, waste and packaging separately with identity evidence; do not omit a real exchange because no UUID matches. Process map is environmental bookkeeping, not a manufacturing instruction or assertion of mandatory cleaning/coating technology. Actual complete-unit physical and environmental originals required before dataset use; scientific review remains pending."
      evidence: "actual complete original ledgers and qualification"
