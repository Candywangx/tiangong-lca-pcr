      record_type: "foreground_record"
      raw_fields: "single supplier item/environmental configuration; physical-unit or batch trace IDs; supplier SDS/lot/supply state; kg issues/returns/waste; original water/electricity meters; same-configuration accepted count"
      collection_method: "Record actual one-item batch and each separate received formulation/physical exchange, calibrated utility meters, issue/return/stock/waste recipient and accepted/reject/reclean count. No part-function, weapon engineering or process-setting detail."
      unit: "kg; MJ"
      frequency: "per unit/batch and full actual period"
      temporal_coverage: "same-configuration final-cleaning cycle"
      site_scope: "actual environmental factory gate"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "item-state/stock/count closure, calibrated original uncertainty and waste qualification"
  calculation_rules:
    - id: normalize_mass
      applies_to: "incoming_component; water; cleaner; filter; cleaning_effluent; cleaning_sludge; spent_filter; wipe_cloth; spent_cloth; rejected_component; prepare_power; clean_power; acceptance_power; dispatch_power; film"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass
      applies_to: "finished_machine"
      requirement: "Use actual calibrated suitable part balance, original tare/readings/date/physical ID/configuration/repeats/uncertainty. M is one complete accepted dry inert component only; exclude cleaning/rinse liquid not retained in delivery, racks/fixtures, loose additions, external packaging and test loads. Independently reconcile received individual component net mass and measured removal/retained addition with output M, no assumed1:1. Same-item batch sampling requires validated homogeneity, actual weighed population and uncertainty; otherwise weigh each part. Serial field may be a traceable internal physical weighing-record ID, not an invented manufacturer serial. No catalogue weight or invented per-part mass."
      evidence: "actual original individual-part net metrology and independent received/finished balance"
    - id: quality_supply
      applies_to: "incoming_component; cleaner; filter; wipe_cloth"
      requirement: "Supplier records confirm one physically complete inert non-energetic metal item, environmental revision and gate without publishing its function or geometry. Separate actual formulation/SDS/lot/supplied state and each filter/textile identity. Thermal-route intermediate public identity is not proof of this supplied finished state; do not add processing to match UUID. Raw cotton or water-treatment fabric is not actual wiping cloth. A fresh membrane is not finished cartridge or spent waste."
      evidence: "actual supplier qualification and original supply-state records"
    - id: quality_water_waste
      applies_to: "water; cleaning_effluent; cleaning_sludge; spent_filter; spent_cloth; rejected_component"
      requirement: "Actual incoming treated municipal water metrology separate from collected spent bath/rinse, oily sludge and physical filters/textiles. Preserve wet versus dry mass and measured composition, recipient and treatment gate; no assumed polluted-liquid density1kg/L or oil/water ranges. Direct-release and transfer-to-treatment differ. Waste quantities include actual retained contamination once, not duplicated captured material as an environmental emission. Rejected item is waste not useful output, no automatic recovery credit."
      evidence: "epa-environment; actual original waste transfer/composition records"
    - id: quality_emissions
      applies_to: "dataset"
      requirement: "No air pollutant or water resource is assumed from final aqueous cleaning. Actual elementary releases, if present, require distinct post-control species, measured amount/time, CAS and exact environmental medium/submedium with uncertainty; add separate identified rows. Collected effluent and captured sludge/filter solids are technosphere waste, not freshwater or airborne emissions. No unmeasured release reported as zero; disclose monitoring coverage/gaps."
      evidence: "actual current environmental monitoring and waste records"
    - id: quality_complete
      applies_to: "dataset"
      requirement: "Close actual supplier-item accepted/reject/reclean/batch counts, water/electricity meters, formulation issues/returns/stock, waste transfers and packaging. Add each real additional input/waste/species separately; missing UUID is not a reason to omit a real flow. Optional filter/sludge/wiping rows not assertions of mandatory equipment or process. Current safe one-item supply and physical/environmental originals required before actual data use, with scientific review pending."
      evidence: "actual complete current environmental ledger and applicability records"
