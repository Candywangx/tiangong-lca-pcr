allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all processes"
    rule: "First separate actual item/configuration work orders, cleaning batches, meters and issue/return/stock/waste records. Same-item accepted count receives actual rejection/recleaning environmental burden; produced/ordered count is not accepted count. No prior component manufacture duplicated."
    source_ids:
      - ghg-allocation
  - rule_id: allocation_shared
    applies_to: "shared environmental utilities"
    rule: "When separation unavailable use measured causal cleaning-time/load or submetered environmental demand. Actual rack occupancy/accepted item counts and batch rejects must close; mass alone not automatically causal for shared demand. Justify economic/other allocation only after physical relationship cannot be established, with sensitivity. No fixed credit or generic ratio."
    source_ids:
      - ghg-allocation
