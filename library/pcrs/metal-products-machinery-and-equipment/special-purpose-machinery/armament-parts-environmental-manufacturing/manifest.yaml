  semantic_boundary_decision: Environmental foreground account for the final
    aqueous cleaning, environmental acceptance and packaging of one individually
    supplied complete inert metal armament component. A dataset represents one
    actual supplier item and environmental configuration, not an assorted parts
    pool. Earlier technical fabrication is entirely upstream. Record the actual
    procurement gate, water, single supplied detergent formulation,
    environmental electricity, separately identified cleaning wastes, accepted
    component count and independent dry net part mass. This account provides no
    weapon design, technical manufacturing parameters, geometry, functional
    details, optimization, operating or assembly tutorial. Applicability
    requires current records confirming this non-energetic single-component
    route; an industry label does not establish it. Current-worktree material
    manifest scan and scope reads found no exact inert armament-component
    final-cleaning method; old44760 remains empty scaffold. Safe general
    material/metrology rules are reusable. The previously completed own44710
    environmental method addresses supplied whole non-live vehicles and coating
    formulations; it is prior methodology, but component-level
    accepted-count/independent dry part M, batch cleaning-stock and
    collected-liquid/filter/textile waste closure are a different
    procurement/output boundary. This candidate adds no weapon construction
    method; actual single supplier item, inert state and final-cleaning gate
    define the bounded refinement, not the classification code. Independent
    overlap/applicability scientific review remains pending; no other author
    unfrozen canonical read or accepted mapping claimed.
  reference_identity_basis: Public44760 heat-treated firearm-parts original is a
    specific thermal-route intermediate with incomplete primary inventory
    context, not this safe final-cleaning-only supplied complete inert
    component. Actual upstream thermal route not assumed. Other whole
    weapons/energetic systems excluded. Preserve precise component
    reference/output name and exact finished_machine fallback; no property or
    UUID forced. Reference product and precise finished_machine output names
    match in both languages; candidate authored-methodology fallback only.
  evidence_limitations: EPA2026 official overview lists ordnance among broad
    metal-products sectors and distinguishes direct oily discharges versus
    related categories; not current factory process proof, mandatory recipe or
    universal legal limit. WRI/WBCSD2011 published product GHG guidance supports
    allocation hierarchy only, not weapons-specific manufacturing evidence,
    updated legislation or full LCA certification. No actual factory/supplier
    dataset provided; current inert single-item supply and local final-cleaning
    environmental records/net weighing required before data use.
  unresolved_flow_identities:
    - row_id: incoming_component
      selected_flow: Single supplied complete inert metal armament component before
        final cleaning
      reason: Unfinished machined-part original is an input specifically to thermal
        processing and suggests assumed1:1 mass; neither its unfinished supply
        state nor assumption establishes the actual supplied complete inert
        component at the final-cleaning gate.
    - row_id: cleaner
      selected_flow: Single supplied aqueous synthetic industrial detergent formulation
      reason: Generic surfactant Detergent is relevant but does not establish the
        actual single industrial formulation/concentration; laundry detergent
        and soap are not substitutions.
    - row_id: filter
      selected_flow: Finished polypropylene aqueous-cleaning cartridge filter
      reason: Polypropylene diaphragm original is a membrane, not a supplied finished
        cartridge filter; polymer name does not establish finished physical
        form/supply state.
    - row_id: cleaning_effluent
      selected_flow: Collected aqueous component-cleaning effluent sent to treatment
      reason: Cleaning-wastewater original explicitly models discharge to water;
        generic Wastewater original specifically uses manganese-slag washing and
        other candidates municipal treatment. Not evidence for this collected
        component-cleaning waste to treatment.
    - row_id: cleaning_sludge
      selected_flow: Oily sludge from the aqueous component-cleaning tank
      reason: Oil Sludge original specifies contamination-site mechanically separated
        recyclable material and concentration ranges; generic Sludge original is
        sewage/water-treatment route; actual tank sludge
        composition/state/destination not established and no candidate ranges
        adopted.
    - row_id: spent_filter
      selected_flow: Oil-contaminated spent polypropylene cleaning cartridge filter
      reason: Fresh polypropylene diaphragm is Product flow; PP waste original
        specifies mechanical recycling without actual oily-cartridge
        contamination/recipient qualification. Neither establishes the actual
        spent cartridge Waste state.
    - row_id: wipe_cloth
      selected_flow: Plain woven cotton wiping fabric
      reason: Cotton Fabric original is water-treatment route; another Cotton fabric
        original classified raw ginned cotton not woven fabric. Exact supplied
        wiping-fabric form/route unresolved, not a unit-property rejection.
    - row_id: spent_cloth
      selected_flow: Detergent-and-oil-contaminated spent cotton wiping cloth
      reason: Fresh cloth Product flow does not establish contaminated spent textile
        Waste identity; actual waste composition and receiver required.
    - row_id: rejected_component
      selected_flow: Rejected single inert metal armament component sent to external recovery
      reason: Unfinished or finished component Product identity cannot be used as
        rejected component Waste identity. Actual metal formulation/recovery
        supply state unresolved.
    - row_id: finished_machine
      selected_flow: Single accepted complete inert metal armament component after
        final aqueous cleaning
      reason: Public44760 heat-treated firearm-parts original is a specific
        thermal-route intermediate with incomplete primary inventory context,
        not this safe final-cleaning-only supplied complete inert component.
        Actual upstream thermal route not assumed. Other whole weapons/energetic
        systems excluded. Preserve precise component reference/output name and
        exact finished_machine fallback; no property or UUID forced.
