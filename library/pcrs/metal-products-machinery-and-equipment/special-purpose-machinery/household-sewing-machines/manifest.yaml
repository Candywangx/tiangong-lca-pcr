review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_inventory_uuids: Specific frames, housings, mechanisms, motors, control
    boards, chemicals, fuels, test textiles, packaging, wastes and emissions need
    direct-read matching identities; only explicitly UUID-bearing cards are adopted.
  unresolved_provider_links: Reference flow is generic manufactured at-plant product
    without supplier geography; match actual technology, delivered configuration,
    region, period and upstream delivery interfaces. Electricity identity applies
    only below 1 kV user-side supply.
  unresolved_quantitative_ranges: No machine mass, yield, manufacturing energy, emission,
    lifetime or empirical range is adopted; all amounts require calibrated site-period
    measurements.
  unresolved_route_recipe_evidence: Public product sources establish supplied architecture,
    not factory BOM, alloy grades, polymer formulations, coating chemistry, casting
    or winding location. Activate conditional manufacturing routes only with actual
    design and factory evidence.
  unresolved_source_access: Janome product HTML direct download returned forbidden;
    original 712T PDF was acquired, extracted and visually inspected. Product-page
    explicit table-not-included statement was read through browser; dataset independently
    verifies actual sale configuration.
  identity_rejections:
    - Industrial sewing flow 9744fffe-2c8c-4fb9-b05f-486605652e8c excludes household
      machines; not adopted.
    - Mixed textile machinery parts flow contains contradictory weapons comment and
      does not establish a specific bought module; not adopted.
    - Transmission-service and project-specific biomass power cannot represent factory
      purchased electricity.
