  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: species_emission
      applies_to: "physical emissions records"
      requirement: "Integrate each measured species concentration with synchronized dry gas flow and time at matched standard conditions; account for actual abatement inlet/outlet and uncertainty. CO2 may use own fuel carbon with actual oxidation, retained carbon and other carbon sinks; carbon balance alone cannot establish CO or NO2. NOx expressed as NO2 equivalent is not measured molecular NO2. Unknown emissions remain unknown, not zero."
      evidence: "Synchronized species sampling and flow records / 同步物种采样及流量记录"
    - id: same_configuration
      applies_to: "reference_product"
      requirement: "Keep accepted serial ledger, BOM/configuration, supplied accessories and calibrated net weighing on the same period; D is sum of accepted net product masses, N accepted units, M=D/N. Exclude packaging, rejects, test fabric and externally owned table from D."
      evidence: "Calibration and acceptance ledger / 校准及验收台账"
    - id: period_conversion
      applies_to: "inventory"
      requirement: "For each exchange collect attributable period Q including reject/rework burden; q_item=Q/N then q_ref=q_item/M=Q/D for the same configuration. The finite normalize_mass rule below implements this conversion; do not derive M from advertised weights or average different configurations."
      evidence: "Period numerator and denominator ledger / 期间分子分母台账"
    - id: physical_assays
      applies_to: "physical material records"
      requirement: "For each metal/species balance preserve input, accepted product, scrap, slag, sludge, wastewater, release and stock masses with EACH term own matched assay and wet/dry basis. Add actual reaction creation/consumption; paired internal returns cancel. Gross compound mass never equals contained metal or solvent. Volumetric conversion uses each stream own measured density at its conditions."
      evidence: "Matched sampling and stock records / 匹配采样及库存记录"
    - id: water_balance
      applies_to: "physical water records"
      requirement: "Close purchased/abstracted water plus each input moisture and opening stock against product/waste moisture, evaporation, discharge and closing stock; include actual reaction water and paired internal returns. Match density/temperature for each volume; no zero-loss assumption."
      evidence: "Water meters, moisture samples and stock / 水表、含水采样及库存"
    - id: solvent_balance
      applies_to: "physical solvent records"
      requirement: "For EACH solvent species separately close input and stock against retained product, recovered solvent, capture media, actual destruction, wastewater, other non-air outputs and measured air release. Capture does not establish destruction, and unexplained residual is not an air emission."
      evidence: "Solvent assays and treatment evidence / 溶剂化验及处理证据"
    - id: uncertainty
      applies_to: "balances"
      requirement: "Investigate closure against combined actual weighing, sampling, stock, meter and allocation uncertainty and known reactions; no universal numerical tolerance, yield or loss. Maintain unknown versus measured zero versus evidenced not_applicable."
      evidence: "Uncertainty budget / 不确定性预算"
    - id: providers
      applies_to: "upstream"
      requirement: "Match actual component processing state, grade, polymer formulation, electricity voltage, supply geography and period, heat return convention, transport and waste-treatment provider; disclose substitutions and incomplete linkage. No product source establishes a provider."
      evidence: "Supplier declarations / 供应商声明"
validation_rules:
  - rule_id: scope
    applies_to: "reference_product"
    rule: "Confirm household manufacturer design and actual principal function, domestic embroidery/overlock conditions and supplied configuration; industrial or separate furniture/parts cannot use this output."
    source_ids:
      - janome-712t
      - singer-4423
      - brother-se725
      - brother-1034d
      - juki-ddl8700
  - rule_id: measurement
    applies_to: "inventory"
    rule: "Verify calibrated same-configuration mass, accepted N/D, attributed Q, q_item and normalize_mass applications on every non-reference row; missing finite conversion or any skipped relationship is incomplete."
    source_ids: []
  - rule_id: double_count
    applies_to: "make_buy"
    rule: "Check conditional make/buy matrix, complete supplier modules versus raw embedded materials, internal-transfer cancellation, residual utilities and purchased heat return accounting once."
    source_ids: []
  - rule_id: balance
    applies_to: "physical records"
    rule: "Validate EACH material/species own assay/moisture, water stocks/reactions/returns and solvent recovery/capture/destruction/non-air destinations; unexplained closure and absent species evidence require review."
    source_ids: []
  - rule_id: utility_species
    applies_to: "utilities and releases"
    rule: "Reject operating-watt manufacturing estimates, carbon-only CO/NOx inference, generic project-specific generation substituted for purchased grid supply, whole-site plus submeter summation and zero-clipped negative residuals."
    source_ids: []
  - rule_id: completeness
    applies_to: "dataset"
    rule: "Require actual route atomic exchanges, every unresolved identity/provider/range disclosure, acceptance/reject/test records and source applicability. Measurement-contract pass does not verify observed factory data or establish reviewed publication readiness."
    source_ids: []
published_dataset_profile:
  dataset_role: "primary_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Configuration-specific household machine factory production; downstream models with explicit upstream and scenario links"
  excluded_use: "Garment sewing service, lifetime operating energy or claimed functional equivalence of different stitch mechanisms"
  required_metadata: "Reference qualifiers; Q/N/D; make/buy and route applicability; actual test/utility/provider states"
  required_quality_disclosure: "Missing identities and providers; coverage; uncertainty; no sector ranges; allocation and exclusion evidence"
  update_trigger: "Changed configuration, BOM, material grade, site route, supply interface, test or allocation evidence"
data_sources:
  - id: "janome-712t"
    type: "handbook"
    reference: "Janome Model 712T Instruction Book, 749-800-011 (E-N), Printed in Taiwan, undated; pages 2–4, 9 and final installation page. https://www.janome.com/wp-content/uploads/2014/10/Inst-book-712T-En.pdf"
    used_for: "Pedal-driven mechanism, accessories and required external treadle table; no factory quantities"
  - id: "singer-4423"
    type: "official_guidance"
    reference: "SINGER Heavy Duty 4423 Sewing Machine, publisher product body snapshot 2026-10-02. https://www.singer.com/products/singer-4423-heavy-duty-sewing-machine"
    used_for: "Electric mechanical configuration, metal frame and stainless bedplate; no specific frame grade or factory route"
  - id: "brother-se725"
    type: "official_guidance"
    reference: "Brother SE725 Computerized Sewing and Embroidery Machine, publisher product body snapshot 2026-10-02. https://www.brother-usa.com/p/sewing-embroidery/SE725"
    used_for: "Domestic sewing/embroidery combination, electronic control and supplied embroidery frame"
  - id: "brother-1034d"
    type: "official_guidance"
    reference: "Brother 1034D Serger, publisher product body snapshot 2026-10-02. https://www.brother-usa.com/p/sergers-coverstitch/1034D"
    used_for: "Household overlock, differential feed, looper and supplied foot control"
  - id: "juki-ddl8700"
    type: "official_guidance"
    reference: "JUKI DDL-8700 1-needle Lockstitch Machine, industrial product body snapshot 2026-10-02. https://juki.com/apparel/ddl-8700"
    used_for: "Industrial counterexample; lockstitch alone does not establish household scope"
