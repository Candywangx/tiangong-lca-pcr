allocation_rules:
  - rule_id: subdivide
    applies_to: "all processes"
    rule: "Subdivide routes and configuration-specific production before allocation; trace direct BOM issues, machine hours, tests and meters. No cross-configuration averaging."
    source_ids: []
  - rule_id: reject_rework
    applies_to: "accepted_output"
    rule: "Retain all attributable failed tests, scrap, reject and rework burden in period numerator Q; N counts accepted units only. Sold scrap is a documented separate waste/co-product treatment, not an automatic avoided-primary-metal credit."
    source_ids: []
  - rule_id: shared_residual
    applies_to: "services"
    rule: "For each utility reconcile same site/period/units purchased imports plus actual onsite generation minus exports and net storage change with assigned fabrication, assembly, test and dispatch loads. Shared service is only the remaining unassigned consumption allocated by measured causal driver. Never add whole-site meter totals on top of process submeters. Investigate negative residuals with meter, period and uncertainty evidence; never clip to zero."
    source_ids: []
  - rule_id: heat_return
    applies_to: "heat"
    rule: "Purchased heat is independently measured delivered Energy MJ. If derived, use actual supply and return mass in kg times their own enthalpy in MJ/kg at measured pressure/temperature with common zero; distinguish gross supply from already-net provider convention and subtract returns once. Onsite boiler heat is internal output; fuel, electricity, water and emissions carry actual burdens once."
    source_ids: []
