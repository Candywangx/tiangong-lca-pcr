product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.special-purpose-machinery.household-sewing-machines"
  classification_refs: "CPC 3.0 44814"
  covered_products: "Household complete machine configurations; manually powered heads may require disclosed external drive"
  excluded_products: "Industrial sewing/embroidery machines; book-sewing machines; separately sold furniture, parts and needles; garments and sewing services"
  representative_product: "Declared accepted household sewing-machine configuration; no single model represents all routes"
  production_route: "Actual make/buy frame, housing, stitch mechanism and drive/control; finishing, assembly, factory tests and packing"
  market_state: "Accepted manufactured machine at plant; supplied accessories and deferred installation declared"
functional_unit:
  what: "Supply household stitch-forming equipment, with actual sewing, embroidery or overlock capability"
  how_much: "1 kg of accepted net supplied machine configuration"
  how_well: "Pass documented factory stitch/feed checks and applicable electric safety acceptance; declare speed, stitch and configuration"
  how_long_or_cycle: "One manufacturing and acceptance period; no service lifetime or garment-output equivalence"
  reference_flow_link: "reference_product"
system_boundary:
  rules:
    - rule_id: factory_gate
      applies_to: "foreground"
      rule: "Include receipt, actual component manufacture, finishing, assembly, adjustment, acceptance tests, rework, rejects, site utilities and packing through accepted release. Manufacturing gate does not include later sewing services."
      source_ids: []
    - rule_id: household_identity
      applies_to: "category"
      rule: "Cover household mechanical, electronic, non-electric hand/treadle, sewing/embroidery combination and domestic overlock machines according to actual principal function and manufacturer household design. Industrial machines remain outside this PCR regardless of home installation; do not impose an invented stitch-speed threshold."
      source_ids:
        - janome-712t
        - singer-4423
        - brother-se725
        - brother-1034d
        - juki-ddl8700
    - rule_id: supplied_configuration
      applies_to: "reference_product"
      rule: "Declare actual supplied head, power interface, pedal, hoop, feet, durable case, first-fill and integrated table. A required externally owned treadle table is not automatically supplied product. Separately sold furniture, spare needles, repair parts and industrial embroidery machinery are excluded outputs."
      source_ids:
        - janome-712t
        - brother-se725
        - brother-1034d
    - rule_id: make_buy
      applies_to: "upstream"
      rule: "Keep exact BOM make/buy and processing-state matrix. Bought finished motor, board, frame, gears, needle, foot and hook/looper modules carry upstream manufacture once; exclude duplicate embedded wire, resin, casting and machining. In-house alternatives require raw materials and actual process inventory. Cancel paired internal transfers; purchased same-category head keeps supplier history once without recursive expansion."
      source_ids: []
    - rule_id: conditional_routes
      applies_to: "actual_design"
      rule: "Cast aluminum, cast iron, stamped steel and polymer housing are design-specific alternatives; retain exact alloy grade, supplied finish and molding recipe. Neither metal-frame advertising nor classification establishes alloy, onsite foundry, winding, electronics fabrication or coating chemistry. not_applicable means evidenced absence; missing record is unknown, never zero. Add every actually used atomic material, utility, chemical, waste and emission beyond these conditional anchors."
      source_ids:
        - singer-4423
    - rule_id: test_scope
      applies_to: "test"
      rule: "Record actual factory test cycles, metered electricity, exact thread/fabric issued minus documented reusable returns, trim waste, rejected machines and all rework. Test textiles are not delivered garments and never enter machine net mass denominator. Operating nameplate watts, customer stitch demand and advertised life cannot establish manufacturing energy or factory consumption."
      source_ids: []
    - rule_id: life_cycle_links
      applies_to: "dataset"
      rule: "Primary factory inventory requires separate links for actual upstream supply, freight and external waste treatment before complete cradle-to-gate use; declare missing providers. Consumer electricity, garments, maintenance and end of life are downstream scenarios, not this reference output."
      source_ids: []
