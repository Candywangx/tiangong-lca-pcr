  unresolved_reference_flow_uuid: No bounded direct-read candidate established a full agricultural-dryer equipment flow; verified Mass/kg support is retained without narrowing to grain or substituting a drying service.
  unresolved_inventory_uuids: All non-UUID cards require actual grade/formulation/species/component/waste/elementary identity direct reads before dataset use. Only CN<1kV user-side purchased alternating current has adopted identity.
  unresolved_provider_links: Actual supplier, geography, completed state and delivery interface must match each flow and upstream dataset; electricity UUID alone does not establish a plant provider.
  unresolved_quantitative_ranges: No measured machine weight, factory BOM, yield, recipe, energy, emission factor or empirical range adopted. Actual period/configuration collection required.
  unresolved_route_recipe_evidence: Candidate grades, tree species, polymer, coatings, chemicals, leaf-product and hybrid designs require actual drawing/SDS/supplier evidence. Conditional cards are not default composition.
  unresolved_mixed_use_boundary: Actual principal purpose, delivered assembly and classification decision required for mixed agricultural/nonagricultural equipment. Pure nonagricultural dryers excluded.
  source_limitations: Cimbria operational brochure does not prove factory quantities. OPICO layout footer is not independently established publication date. FAO solar architecture is not universal factory recipe. EPA February2002 document has a1998 characterization appendix and explicitly incomplete coating detail.
