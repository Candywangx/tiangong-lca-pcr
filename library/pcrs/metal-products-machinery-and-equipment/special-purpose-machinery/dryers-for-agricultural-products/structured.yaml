allocation_rules:
  - rule_id: subdivide
    applies_to: "shared production"
    rule: "Use configuration-specific lots and disjoint process meters first. Allocate only unassigned shared residual with measured causal machine-time/load or another documented physical driver; keep numerator and accepted output within the same period."
    source_ids: []
  - rule_id: scrap
    applies_to: "recovery"
    rule: "Track actual external segregated scrap and documented treatment with one disclosed compatible recovery model; sale alone creates no avoided virgin-material credit. Internal paired returns cancel mass transfers while retaining rework burdens."
    source_ids: []
  - rule_id: test_crop
    applies_to: "returned test crop"
    rule: "Distinguish returned customer test material from real coproduct sales. No automatic crop credit or throughput allocation. For a real coproduct first subdivide, then justify measured physical relationship or a documented alternative with sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "accepted net equipment"
      record_type: "matched period records"
      raw_fields: "model; configuration; serial number; accepted net mass M; N; included modules; retained charge; tare; acceptance date"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each lot/interval and configuration"
      temporal_coverage: "complete same reporting period including rejects/rework"
      site_scope: "declared factory and provider interfaces"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration; acceptance; assays; provider state; sampling uncertainty"
    - protocol_id: cp_material
      process_id: "actual_applicable_process"
      flow_role: "one physical input"
      record_type: "matched period records"
      raw_fields: "grade; species/formulation; provider; incoming and issued quantity; return; opening/closing stocks; own assay/moisture; completed supply state"
      collection_method: "Calibrated weighing and actual supplier certificates; identify make/buy and material-specific composition independently."
      unit: "kg"
      frequency: "each lot/interval and configuration"
      temporal_coverage: "complete same reporting period including rejects/rework"
      site_scope: "declared factory and provider interfaces"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibration; acceptance; assays; provider state; sampling uncertainty"
    - protocol_id: cp_energy
      process_id: "actual_applicable_process"
      flow_role: "one utility"
      record_type: "matched period records"
      raw_fields: "meter; interval; imports; generation; exports; storage; assignments; fuel mass/composition/NCV; delivered steam mass P/T/quality and own enthalpy; separate returned condensate mass/T and own enthalpy; shared driver"
      collection_method: "Use calibrated disjoint meters and supply invoices for same output period. Purchased steam: delivered kg × its own MJ/kg at measured pressure/temperature/quality minus separately measured return kg × its own return MJ/kg using the same enthalpy reference, or calibrated net heat meter. No assumed enthalpy, kg-as-MJ or own-boiler fuel duplication."
      unit: "MJ"
      frequency: "each lot/interval and configuration"
      temporal_coverage: "complete same reporting period including rejects/rework"
      site_scope: "declared factory and provider interfaces"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibration; acceptance; assays; provider state; sampling uncertainty"
    - protocol_id: cp_water
      process_id: "actual_water_using_process"
      flow_role: "one supplied water"
      record_type: "matched period records"
      raw_fields: "meter; period; supplied water; own measured density/temperature; moisture in material; retained stock; evaporation; discharge; recycle; reactions"
      collection_method: "Measure matched incoming, retained and discharged water and material moisture; paired recycle transfers cancel; volume conversion uses actual density."
      unit: "kg"
      frequency: "each lot/interval and configuration"
      temporal_coverage: "complete same reporting period including rejects/rework"
      site_scope: "declared factory and provider interfaces"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibration; acceptance; assays; provider state; sampling uncertainty"
    - protocol_id: cp_waste
      process_id: "actual_applicable_process"
      flow_role: "one waste"
      record_type: "matched period records"
      raw_fields: "identity; grade; tare/net; own moisture; dry/wet basis; element/chemical assay; stock; receiver; actual treatment; trial-crop destination"
      collection_method: "Calibrated segregated weighing and matched representative analysis of each stream including sludge/wastewater; retain provider receipts."
      unit: "kg"
      frequency: "each lot/interval and configuration"
      temporal_coverage: "complete same reporting period including rejects/rework"
      site_scope: "declared factory and provider interfaces"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibration; acceptance; assays; provider state; sampling uncertainty"
    - protocol_id: cp_emission
      process_id: "actual_release_point"
      flow_role: "one species/compartment"
      record_type: "matched period records"
      raw_fields: "species; compartment; concentration; air/liquid flow; duration; own moisture/assay; sampling; capture; stocks; detection limit; uncertainty"
      collection_method: "Use post-control species-specific monitoring and fugitive assessment; any factor/model must match actual fuel, equipment, control and species. Retain release and non-air residual records."
      unit: "kg"
      frequency: "each lot/interval and configuration"
      temporal_coverage: "complete same reporting period including rejects/rework"
      site_scope: "declared factory and provider interfaces"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibration; acceptance; assays; provider state; sampling uncertainty"
    - protocol_id: cp_pack
      process_id: "dispatch"
      flow_role: "one package"
      record_type: "matched period records"
      raw_fields: "component; polymer/species/grade; mass; reusable stock; returned quantity; shipments; accepted configuration"
      collection_method: "Weigh actual packaging components separately; track reuse service and returns without entering machine denominator."
      unit: "kg"
      frequency: "each lot/interval and configuration"
      temporal_coverage: "complete same reporting period including rejects/rework"
      site_scope: "declared factory and provider interfaces"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibration; acceptance; assays; provider state; sampling uncertainty"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
    - id: period_accounting
      applies_to: "same configuration and period"
      rule: "Q = attributable period exchange including reject/rework burden; N = accepted complete units of one configuration; mean net machine mass = sum of calibrated accepted net masses / N; per-machine exchange = Q/N; final per-kg exchange = Q/sum of those accepted net masses. No rejected-machine, packaging, test-crop or drained-water mass in denominator."
      inputs:
        - cp_mass
        - cp_material
        - cp_energy
        - cp_water
        - cp_waste
        - cp_emission
        - cp_pack
      output: "matched per-item raw totals and per-kg inventory"
      source_ids: []
    - id: utility_residual
      applies_to: "cp_energy"
      rule: "Residual = imports + actual onsite generation - exports - net storage increase - already assigned fabrication/solar/finish/assembly/test/dispatch loads, all in same measured period and units. Allocate only residual with measured causal driver. Investigate negative residual against units, period, meter topology and combined uncertainty; never clip it to zero. Own generation has its fuel/emission inventory; do not add purchased power for that same generated quantity."
      inputs:
        - cp_energy
      output: "residual utility"
      source_ids: []
    - id: species_balance
      applies_to: "physical material/species"
      rule: "For each material/contained element or chemical use each term's OWN matched assay and dry/wet basis on incoming stock, product, scrap, sludge, wastewater, releases and closing stocks; include reaction uptake/sinks and paired internal-transfer cancellation. Close actual water with supplied water, material moisture, reactions, retained stocks, evaporation and discharge. Do not equate gross alloy/compound/sludge mass with species mass."
      inputs:
        - cp_material
        - cp_mass
        - cp_water
        - cp_waste
        - cp_emission
      output: "balance residual"
      source_ids: []
    - id: water_balance
      applies_to: "physical water and moisture records"
      rule: "Fresh water inputs + input material moisture + opening water stocks + reaction-generated water = product-retained water + water in wet wastes and sludge + water in external wastewater/discharge + evaporation + closing water stocks + reaction-consumed water. EACH wet input, product, waste, sludge, wastewater and stock term uses its OWN measured moisture/water fraction, density where volume is collected, and matched wet/dry basis. Cancel paired internal water returns while retaining pumping and treatment energy. Investigate closure against actual combined measurement, sampling and allocation uncertainty; no assumed water losses or universal tolerance."
      inputs:
        - cp_material
        - cp_mass
        - cp_water
        - cp_waste
        - cp_emission
      output: "finite water balance residual with uncertainty"
      source_ids: []
    - id: solvent_balance
      applies_to: "actual solvent species"
      rule: "Account solvent inputs/opening stock, retained product, recovered solvent, captured-media content, wastewater/sludge content, closing stock, verified actual destruction and species-specific air release. Capture is not destruction; no unexplained balance residual is assigned to air."
      inputs:
        - cp_material
        - cp_waste
        - cp_emission
      output: "solvent closure"
      source_ids:
        - epa-metal-coating-2002
    - id: combustion_species
      applies_to: "test emissions"
      rule: "Fuel carbon balance may constrain fossil CO2 only with own carbon composition and oxidized-carbon allocation; CO/NO/NO2 require their own monitored or validated technology-specific evidence. Preserve NOx-as-NO2 conventions separately; no assumption of complete destruction."
      inputs:
        - cp_energy
        - cp_emission
      output: "species release"
      source_ids: []
  data_quality_requirements:
    - id: same_config
      applies_to: "reference"
      requirement: "Trace drawing/revision, modules, crop suitability, principal intended use, acceptance and calibrated net mass; no universal machine weight."
      evidence: "BOM, make/buy and acceptance records"
    - id: coverage
      applies_to: "active routes"
      requirement: "Extend atomic cards for actual missing alloy/polymer/wood species, reagents, residues, providers and emission compartments. Actual formulations and route activation need evidence; unknown is not zero."
      evidence: "supplier certificates, SDS, routes and waste receipts"
    - id: uncertainty
      applies_to: "all quantities"
      requirement: "Investigate closure using actual combined measurement, sampling and allocation uncertainty. No universal tolerance, default yield, recipe, energy, lifetime or empirical range is supplied."
      evidence: "calibration and representative sampling"
validation_rules:
  - rule_id: identity
    applies_to: "reference"
    rule: "Require all qualifiers and actual agricultural principal purpose; reject other-material purpose, drying service or crop output as equipment identity. Missing actual category reference UUID stays unresolved."
    source_ids:
      - un-cpc-3-0
  - rule_id: denominator
    applies_to: "inventory"
    rule: "Require positive accepted net mass and unit count for one configuration and same period, calibrated net scope and explicit normalization on every applicable row; inspect test/packaging/reject exclusions."
    source_ids: []
  - rule_id: boundary
    applies_to: "make/buy and utilities"
    rule: "Reconcile upstream modules once, actual supplied scope, paired transfers, retained charge, separate purchased/own generation and no whole-site totals added above submeters; purchased steam uses actual net enthalpy."
    source_ids: []
  - rule_id: closure
    applies_to: "physical species and routes"
    rule: "Require own matched assays on product/waste/sludge/wastewater/stocks, actual water/solvent and species-specific emission closure. Investigate residuals against actual combined uncertainty without invented losses, air residual or destruction."
    source_ids: []
  - rule_id: completeness
    applies_to: "dataset"
    rule: "Report collected inputs, performed/skipped checks, findings and completeness. Missing quantity, identity, provider, required recipe or unsupported relationship is inconclusive; no unqualified claim of validation or publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground dataset-production guidance"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Factory-gate production of the declared equipment configuration and downstream process/lifecyclemodel projections with disclosed readiness"
  excluded_use: "Crop drying service; field energy; equal service/lifetime comparisons from kg alone; universal recipe or published claims while gaps remain"
  required_metadata: "All reference qualifiers, boundaries, period/geography, supply states, BOM, make/buy matrix and allocation"
  required_quality_disclosure: "UUID/provider, route/formulation and empirical-range gaps; calibration/sampling/closure uncertainty; missing or not-applicable exchanges"
  update_trigger: "Design, supplied module, heating architecture, principal purpose, grade/formulation, provider, meter topology or evidence change"
