measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete machine of the same configuration in kg; collect using cp_mass."
  - id: material_basis
    applies_to: "physical material/species records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use actual grade, chemical/species and measured moisture/assay on each term. Gross steel, coating, wet sludge or wastewater is not contained iron, zinc, solvent or dry matter."
  - id: energy_basis
    applies_to: "utility and test energy"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Retain measured kWh and convert electricity by 3.6 MJ/kWh; each fuel uses its own measured quantity and calorific basis. Net purchased steam energy follows cp_energy; never assume kg equals MJ."
