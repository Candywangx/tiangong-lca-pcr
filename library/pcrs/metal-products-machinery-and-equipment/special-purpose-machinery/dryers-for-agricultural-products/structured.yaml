  market_state: "Factory-gate complete equipment including stated supplied modules and retained initial charge"
functional_unit:
  what: "Provide complete agricultural-product drying equipment"
  how_much: "1 kg of accepted equipment net mass, normalized from actual machines"
  how_well: "Conform to declared crop compatibility, chamber/column geometry, heating/airflow design, supplied controls and acceptance specification; no performance equivalence across configurations"
  how_long_or_cycle: "One manufacture-to-factory-gate delivery; service life and field duty are separate declared scenarios"
  reference_flow_link: "finished_dryer"
system_boundary:
  rules:
    - rule_id: factory_gate
      applies_to: "all processes"
      rule: "Include incoming upstream supplies, actual transport, factory fabrication/finish/assembly, acceptance testing, rejects, rework, controls, waste treatment and packaging through gate; later crop-drying operations excluded."
      source_ids: []
    - rule_id: make_buy
      applies_to: "components"
      rule: "Record make/buy matrix below. Complete purchased assemblies include embodied materials/motors/charges once; own-making records constituent inputs, process energy and wastes instead."
      source_ids: []
    - rule_id: test_scope
      applies_to: "test"
      rule: "Separate actual consumed test fuel/crop/water from measured retained initial charge. Heat rating, crop throughput and moisture removal are operating descriptors, never factory energy or equipment-mass factors."
      source_ids:
        - cimbria-drying-2024
        - opico-installations-v2
boundary_abstraction:
  declared_starting_condition: "Actual incoming grade-specific stock and completed purchased modules at documented supplier processing state"
  starting_condition_role: "foreground input boundary"
  product_classification_scope: "Principally agricultural-product drying equipment; other-material and unresolved mixed-purpose equipment separately reviewed"
  recursive_input_rule: "A purchased completed agricultural-dryer module carries its supplier dataset once; do not recursively duplicate its fabrication, fan, burner, motor, coating or charge."
  upstream_dataset_requirement: "Match actual flow grade/state, supplier geography, technology and delivery interface; an unresolved UUID is not an upstream provider."
  disclosure: "Define supplied module list, factory gate, transport legs, test boundary, excluded site civil works, net mass and reporting period"
