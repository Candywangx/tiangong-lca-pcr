    inventory_flow_uuids:
      - row_id: plate
        reason_code: no_exact_candidate
        explanation: "The five public candidates do not establish hot-rolled carbon steel plate with matching Chinese identity and flat-product classification; collect the actual steel grade and mass, then review flow identity."
      - row_id: wire
        reason_code: no_exact_candidate
        explanation: "Candidates are a welding service, flux-cored variant without row-grade proof, steel rod, copper wire, or unrelated fittings; collect the actual steel welding-wire specification before creating or selecting a flow."
      - row_id: power
        reason_code: property_or_unit_mismatch
        explanation: "Public electricity candidates use Net calorific value in MJ and do not establish the row's metered medium-voltage kWh grid-electricity property; retain kWh collection and resolve flow identity before publication."
      - row_id: scrap
        reason_code: manual_review_required
        explanation: "Two post-industrial steel-scrap candidates have indistinguishable public identity and do not establish segregated carbon-steel cutting origin; manual identity review is required before adopting either UUID."
      - row_id: purchased_bowl
        reason_code: internal_intermediate_needs_new_flow
        explanation: "No public candidate is a fabricated scraper bowl for earthmoving machinery; the purchased bowl is a distinct complete component and needs an exact flow identity."
      - row_id: tire
        reason_code: no_exact_candidate
        explanation: "The public candidates are diesel, passenger-car or motorcycle/bicycle tires, and retreaded tires; none identifies a new pneumatic off-road tire installed on this machine."
