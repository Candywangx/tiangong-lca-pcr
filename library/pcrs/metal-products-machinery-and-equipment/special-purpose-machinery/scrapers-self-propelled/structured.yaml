allocation_rules:
  - rule_id: alloc_subdivide
    applies_to: "shared fabrication or assembly lines"
    rule: "First separate directly metered processes and batches; assign measured material, electricity, fuel, scrap and emission records to the represented machine/configuration where possible."
    source_ids:
      - ec-pef-method-2021
  - rule_id: alloc_shared
    applies_to: "unavoidable common site inputs"
    rule: "If subdivision is impossible, use a documented causal physical driver such as metered process hours or component mass; disclose the driver, denominators and sensitivity."
    source_ids:
      - ec-pef-method-2021
  - rule_id: alloc_scrap
    applies_to: "steel scrap"
    rule: "Record carbon steel cutting scrap and its real destination separately; do not silently subtract sale receipts or assumed recycling credits from gross material input."
    source_ids:
      - epa-clean-lines-metal-fabrication-2007
      - ec-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
