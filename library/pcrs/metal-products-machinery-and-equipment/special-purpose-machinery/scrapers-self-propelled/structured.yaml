      frequency: "each accepted machine"
      temporal_coverage: "declared production period"
      site_scope: "reporting site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration and signed acceptance record"
    - protocol_id: cp_material
      process_id: "fabrication"
      flow_role: "plate and wire input"
      record_type: "issue, purchase and return records"
      raw_fields: "material grade; kg issued; kg returned; machine or batch id"
      collection_method: "Reconcile material issues and returns to the actual scraper structural fabrication batch."
      unit: "kg"
      frequency: "each fabrication batch"
      temporal_coverage: "declared production period"
      site_scope: "reporting site"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "stock ledger and batch traveler"
    - protocol_id: cp_energy
      process_id: "fabrication"
      flow_role: "grid electricity"
      record_type: "submeter and production log"
      raw_fields: "kWh; meter id; machine hours; configuration"
      collection_method: "Read submeter for fabrication; if shared, apply the disclosed physical allocation driver."
      unit: "kWh"
      frequency: "each batch or shift"
      temporal_coverage: "declared production period"
      site_scope: "reporting site"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "meter and allocation record"
    - protocol_id: cp_waste
      process_id: "fabrication"
