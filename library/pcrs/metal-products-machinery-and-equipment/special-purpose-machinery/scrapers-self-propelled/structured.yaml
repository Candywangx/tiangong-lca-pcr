validation_rules:
  - rule_id: val_identity
    applies_to: "reference product"
    rule: "Require the finished scraper UUID, exact machine configuration and measured M kg to agree with the accepted machine; no component-only flow may replace the output."
    source_ids:
      - un-cpc-3-2025
      - cat-657-2020
  - rule_id: val_basis
    applies_to: "all inventory rows"
    rule: "Require one accepted finished scraper as the denominator for every material, energy, waste and test emission amount; test fuel and retained fuel are separate."
    source_ids:
      - ec-pef-method-2021
  - rule_id: val_route
    applies_to: "fabrication and purchased bowl"
    rule: "Require route evidence and prohibit counting the same bowl through both on-site steel fabrication and a purchased complete bowl."
    source_ids:
      - epa-clean-lines-metal-fabrication-2007
      - cat-657-2020
  - rule_id: val_gaps
    applies_to: "unresolved identity and ranges"
    rule: "Disclose unresolved flow UUIDs and missing independent range evidence; do not substitute proxy UUIDs or model-specific brochure values."
    source_ids:
      - ec-pef-method-2021
