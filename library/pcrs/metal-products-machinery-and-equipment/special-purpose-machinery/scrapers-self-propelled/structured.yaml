      evidence: "dated records and supplier metadata (ec-pef-method-2021)"
    - id: dq_mass_balance
      applies_to: "material and waste"
      requirement: "Reconcile steel issued, steel retained in the machine and separately weighed steel scrap; explain unresolved differences."
