  unresolved:
    - code: classification_scope_review
      severity: review_required
      detail: CPC3 44818 is under domestic appliances with bare leaf label. Semantic scope retains actual non-carbon industrial/ceramic principal-heater conditional families; a broader relation is proposed, not proof each industrial design belongs to the leaf. SiC/chemically combined-carbon requires separate carbon-boundary and classification review before extension.
    - code: specific_inventory_identity
      severity: review_required
      detail: Except finished output and explicitly conditional CN medium-voltage AC, atomic inventory identities remain unresolved by grade, chemistry, component completion state, physical state, supplier/geography, treatment and compartment. Generic Electric heating element 6ace18b7-9ba4-45d4-b39b-5f7131352af3 was rejected because its reference property is CTUe, not physical mass. Non-heating resistor and unrelated housing are not substitutes for heater conductors.
    - code: empirical_ranges_recipe
      severity: review_required
      detail: No universal consumption, mass, resistance, wire length, heat output, operating temperature, yield, lifetime, recipe proportions or emission ranges supported. Manufacturer architecture/patent examples are qualitative conditional evidence; each actual factory supplies calibrated quantities, own assays, reaction and stock records plus uncertainty.
    - code: supplier_provider_completion
      severity: review_required
      detail: Supplier-specific upstream material/module, utility and treatment providers and actual factory formulation/dopant/binder/contact-grade cards remain package-specific gaps; foreground records alone do not establish complete cradle-to-gate modelling.
