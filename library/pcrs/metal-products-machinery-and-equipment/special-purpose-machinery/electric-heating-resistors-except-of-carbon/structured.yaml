    applies_to: "foreground_burden_allocation"
    rule: "Prefer route/configuration subdivision and direct attributable records. Rework and rejects retain actual process and utility burden in the accepted-output cohort; do not normalize by total started or rejected mass."
    source_ids: []
  - rule_id: shared
    applies_to: "foreground_burden_allocation"
    rule: "Allocate only measured unassigned shared residual by demonstrated causal driver, such as occupied furnace time with load/temperature evidence, calibrated machine meter or actual treatment load. Same-period assigned totals plus residual reconcile to the site ledger; disclose driver and uncertainty, no universal allocation fraction."
    source_ids: []
  - rule_id: scrap
    applies_to: "foreground_burden_allocation"
    rule: "Internal recovered wire, powder, solvent and water are paired transfers with no avoided-production credit. Exported graded scrap and rejects retain measured composition and destination; disclose consistent recycling/provider convention, allocate genuine co-products only after physical causal subdivision is exhausted. Do not assign scrap sale value as automatic negative burden."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "test"
      flow_role: "reference product"
      record_type: "weighing"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each batch and reconciled reporting period"
      temporal_coverage: "same actual representative period; disclose outages and abnormal batches"
      site_scope: "declared site and same model/configuration cohort"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "calibration; traceable records; own assays; sampling and attribution uncertainty"
    - protocol_id: cp_material
      process_id: "all"
      flow_role: "each atomic bought material or component"
      record_type: "stock and BOM ledger"
      raw_fields: "grade; supplier; incoming state; opening/closing stocks; weighed receipts/issues; internal returns; configuration; N; D"
      collection_method: "Collect dated scale/BOM/invoice records; net actual period consumption with stock change, paired returns and reject/rework use as attributable Q; q_item = Q/N for same accepted cohort then Q/D per 1 kg reference flow. Purchased part mass carries embedded materials only once."
      unit: "kg"
      frequency: "each batch and reconciled reporting period"
      temporal_coverage: "same actual representative period; disclose outages and abnormal batches"
      site_scope: "declared site and same model/configuration cohort"
      aggregation_rule: "attributable exchange / accepted units"
      quality_evidence: "calibration; traceable records; own assays; sampling and attribution uncertainty"
    - protocol_id: cp_energy
      process_id: "all"
      flow_role: "each atomic utility supply and residual"
      record_type: "meter and provider ledger"
      raw_fields: "meter ID; interval; kWh/MJ; source voltage/geography; imports; generation; exports; storage; assigned/residual; steam kg; pressure; temperature; dryness; supply/return enthalpy; fuel conditions; N; D"
      collection_method: "Read calibrated site and process meters over same period. Assign process Q then only causal common residual; reconcile generation/exports/storage/loss. Steam delivered Energy/MJ independently follows mass times actual own enthalpy with shared zero for returns, gross/net convention once. Preserve gas composition/state/heating value; actual Q/N then Q/D."
      unit: "MJ"
      frequency: "each batch and reconciled reporting period"
      temporal_coverage: "same actual representative period; disclose outages and abnormal batches"
      site_scope: "declared site and same model/configuration cohort"
      aggregation_rule: "attributable exchange / accepted units"
      quality_evidence: "calibration; traceable records; own assays; sampling and attribution uncertainty"
    - protocol_id: cp_water
      process_id: "all"
      flow_role: "water input, discharge and evaporation"
      record_type: "meter, stock and moisture ledger"
      raw_fields: "water meter; fresh quantity; moisture each stream; openings/closings; discharge; evaporation; reaction water; return transfer; N; D"
      collection_method: "Measure own supply/discharge and each actual stream moisture; independent water closure includes storage, evaporation and reaction production/consumption. Cancel paired internal transfers. Allocate actual Q to same cohort before Q/N and Q/D."
      unit: "kg"
      frequency: "each batch and reconciled reporting period"
      temporal_coverage: "same actual representative period; disclose outages and abnormal batches"
      site_scope: "declared site and same model/configuration cohort"
      aggregation_rule: "attributable exchange / accepted units"
      quality_evidence: "calibration; traceable records; own assays; sampling and attribution uncertainty"
    - protocol_id: cp_waste
      process_id: "all"
      flow_role: "one specific exported physical waste"
      record_type: "manifest and sampled assay"
      raw_fields: "destination; wet/dry mass; species own assays; moisture; opening/closing stores; internal returns; N; D"
      collection_method: "Weigh each segregated exported waste; pair sample concentration with its own stream/date/basis, never assume product alloy assay for sludge/wastewater. Track disposal/recycling provider and stocks; Q/N then Q/D."
      unit: "kg"
      frequency: "each batch and reconciled reporting period"
      temporal_coverage: "same actual representative period; disclose outages and abnormal batches"
      site_scope: "declared site and same model/configuration cohort"
      aggregation_rule: "attributable exchange / accepted units"
      quality_evidence: "calibration; traceable records; own assays; sampling and attribution uncertainty"
    - protocol_id: cp_solvent
      process_id: "assembly_services"
      flow_role: "each solvent and capture fate"
      record_type: "solvent stock/fate ledger"
      raw_fields: "chemical grade; solution mass; own assay; inventory; retained product; waste liquid; recovered output; capture medium; verified destruction; non-air residues; air measurement; N; D"
      collection_method: "Measure each own species fraction and all actual fate terms. Resolve stock/reaction/non-air residues; capture is not destruction and residual is not automatic air emission. Attribute actual Q with uncertainty then Q/N and Q/D."
      unit: "kg"
      frequency: "each batch and reconciled reporting period"
      temporal_coverage: "same actual representative period; disclose outages and abnormal batches"
      site_scope: "declared site and same model/configuration cohort"
      aggregation_rule: "attributable exchange / accepted units"
      quality_evidence: "calibration; traceable records; own assays; sampling and attribution uncertainty"
    - protocol_id: cp_emission
      process_id: "all"
      flow_role: "one species to one compartment"
      record_type: "emission measurement and reaction evidence"
      raw_fields: "species; source; compartment; concentration; gas volume/state; treatment inlet/outlet; time; assay conversion; carbon stocks; uncertainty; N; D"
      collection_method: "Measure source-specific residual after treatment or verified technology/species factor with actual activity. For carbonate CO2 use actual reaction extent/assays and residual carbonate/stocks; fuel CO/NOx require independent evidence. Actual species Q/N then Q/D."
      unit: "kg"
      frequency: "each batch and reconciled reporting period"
      temporal_coverage: "same actual representative period; disclose outages and abnormal batches"
      site_scope: "declared site and same model/configuration cohort"
      aggregation_rule: "attributable exchange / accepted units"
      quality_evidence: "calibration; traceable records; own assays; sampling and attribution uncertainty"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: configuration
      applies_to: "all inventory rows"
      requirement: "Bind route, BOM, test and net mass to one actual accepted cohort; site integration does not mix configurations."
      evidence: "release record and cp_mass"
    - id: completeness
      applies_to: "all inventory rows"
      requirement: "Record each actually present atomic exchange; applicability evidence for absent branches; no unsupported numerical range, recipe, yield, resistance, wire length or heating-service default."
      evidence: "route ledger; supplier and reaction records"
    - id: acceptance
      applies_to: "test"
      requirement: "Record calibrated resistance measurement with actual measurement temperature and tolerance, voltage/current/power under the specified load and thermal interface, insulation resistance and dielectric test settings, dimensional checks, pass/fail and retest/rework by serial/batch. These records bind the same accepted cohort and factory test energy; do not turn nominal power or resistance into measured manufacturing consumption."
      evidence: "instrument calibration; actual drawing/specification; electrical test and release records"
    - id: provider
      applies_to: "upstream linked exchange"
      requirement: "Verify actual supplier state, boundary, unit and technology/region/time; maintain UUID, range and provider gaps explicitly until independently resolved."
      evidence: "provider documentation; identity direct read"
    - id: uncertainty
      applies_to: "physical balances"
      requirement: "Use each stream own assay and moisture, measured stocks, reaction terms and paired returns; investigate combined measurement/sampling/allocation uncertainty."
      evidence: "cp_material; cp_water; cp_solvent; cp_waste; cp_emission"
validation_rules:
  - rule_id: identity
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm principal heating function, complete incoming/outgoing interface, same configuration and actual conductor grade. Validate every adopted flow UUID, property/unit, physical state, supply geography and contradictory comments; the generic output is an identity, not an empirical mix or heating-service performance claim."
    source_ids: []
  - rule_id: denominator
    applies_to: "foreground_dataset_conformance"
    rule: "For the same configuration and period, D is sum of calibrated accepted complete unit net masses, N is accepted count, M = D/N and Q is attributable exchange including reject/rework burden. Form q_item = Q/N before q_ref = q_item/M = Q/D. Same accepted cohort, BOM, test and weighing records govern every row; packaging/reject mass never enters D."
    source_ids: []
  - rule_id: element_balance
    applies_to: "foreground_dataset_conformance"
    rule: "For each physical material and contained element/species, independently use its own matched assay/purity, moisture basis and sampling date in feedstock, product, scrap, powder, slag if present, sludge, wastewater, releases and opening/closing stocks. Gross alloy/solution mass is not contained Ni/Cr/Fe/Ba/Ti/Mo/W/Y/Si mass. Include measured reactions, deposition and paired returns; input plus opening stock and net reaction production equals output plus closing stock and reaction consumption on the same element basis. No common assay applied to every term."
    source_ids: []
  - rule_id: water_balance
    applies_to: "foreground_dataset_conformance"
    rule: "For actual water, include fresh supply, incoming powder/solution moisture and opening stocks; compare with retained product/scrap/sludge/wastewater moisture, evaporation, discharge and closing stocks plus actual reaction generation/consumption. Pair internal recovered rinse/cooling/condensate transfers so they cancel. Resolve leaks and sampling uncertainty; water mass is distinct from wet stream gross mass. Each measured volume converts with that stream own measured density and temperature; each wet stream uses its own sampled water fraction, never gross wet mass as water."
    source_ids: []
  - rule_id: solvent_fate
    applies_to: "foreground_dataset_conformance"
    rule: "For each actual solvent, measure own species fraction in receipts, stocks, retained product, recovered output, waste liquid, capture medium and releases. Include verified chemical destruction with products separately; captured or recovered solvent is not destroyed. Residual input imbalance is not automatically air VOC: resolve non-air residues, spills, stock changes, reactions, detection limits and combined uncertainty."
    source_ids: []
  - rule_id: energy_ledger
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile same-period purchased imports plus own generation minus exports and storage increase against assigned metal/etch/ceramic/assembly/test loads plus measured common residual and documented losses. Common services contain only residual after assignments, not whole factory totals again. Negative residual requires investigation of period, units and meter uncertainty; never clip to zero. Internal generated electricity/steam is a transfer; external fuel/own generation emissions counted once."
    source_ids: []
  - rule_id: steam_basis
    applies_to: "foreground_dataset_conformance"
    rule: "Steam Energy/MJ is independent of mass/kg. Record delivered mass, own pressure/temperature/dryness and specific enthalpy; if net delivered heat uses condensate return, both supply and return enthalpies share one explicit reference zero. Calculate gross delivery from independently measured supply kg times its own MJ/kg, and net delivery subtracts independently measured return kg times its own MJ/kg at the common datum. Record gross supplied versus net heat provider convention; subtract return once for a gross provider and never deduct a second return from an already-net provider; never use boiler input fuel heat or a universal MJ/kg factor as delivered steam heat."
    source_ids: []
  - rule_id: emissions
    applies_to: "foreground_dataset_conformance"
    rule: "Match each source, measured species and receiving compartment. Carbonate reaction CO2 is separated from fossil-fuel CO2. CO/NOx cannot be derived from fuel carbon closure alone; include technology-specific evidence, own abatement and measured residuals. Record actual measured NO2 separately from total NOx reported as NO2-equivalent; an equivalent-mass total is not measured NO2 and does not establish an assumed NO/NO2 split. The nitrogen-dioxide card accepts actual NO2 only; unresolved total-NOx speciation stays an explicit measurement gap. Unknown composition or missing treatment provider blocks a claim of complete physical closure."
    source_ids: []
  - rule_id: uncertainty
    applies_to: "foreground_dataset_conformance"
    rule: "Investigate closure discrepancies against actual combined measurement, sampling, period attribution and allocation uncertainty with analytical detection limits; no universal tolerance, yield or loss fraction. Require all actual exchanges and route-negative evidence; conditional absence, zero measurement and unknown are distinct. Record unresolved UUID/range/provider/classification gaps honestly before downstream validation or publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual matched element supply as input to appliance/process packages and downstream process/lifecyclemodel projections."
  excluded_use: "Heating service, appliance operation, comparative service performance or a claim of universal lifetime."
  required_metadata: "Configuration; chemistry; route and make/buy state; net mass denominator; acceptance performance; site period; classification decision; provider interface; exclusions and allocation."
  required_quality_disclosure: "Coverage, measurement and own assays; stocks/reaction/returns closure; uncertainty; missing UUID/ranges/providers; classification limits; qualitative sources are not empirical inventory."
  update_trigger: "Change to heater function, chemistry, component completion state, route, supply region, abatement, acceptance or measured cohort."
data_sources:
  - id: "cpc-3-notes"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed p240; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Leaf identity, hierarchy and adjacent-appliance boundary; no industrial assignment inferred."
  - id: "watlow-tubular"
    type: "handbook"
    reference: "Watlow Heating Solutions online original catalog, viewer p61 / printed p57, edition unspecified; https://watlow.cld.bz/Watlow-Heating-Solutions/61/"
    used_for: "Tubular NiCr/MgO/sheath/terminal architecture; qualitative only."
  - id: "watlow-cartridge"
    type: "handbook"
    reference: "Watlow original online catalog, viewer p419 / printed p415, edition unspecified; https://watlow.cld.bz/Watlow-Heating-Solutions/419/"
    used_for: "Conditional HT cartridge sheath, coil, insulation and lead architecture."
  - id: "watlow-flexible"
    type: "handbook"
    reference: "Watlow original online catalog, viewer p114 / printed p110, edition unspecified; https://watlow.cld.bz/Watlow-Heating-Solutions/114/"
    used_for: "Wire-wound fiberglass and etched nickel-alloy foil, polyimide/silicone conditional routes; no fixed foil grade or etchant recipe."
  - id: "tdk-ptc"
    type: "handbook"
    reference: "TDK Electronics, PTC Thermistors General technical information, April 2026, pp2 and4; https://www.tdk-electronics.tdk.com/download/539366/728d0d379187d1dfa0831555b8c93202/pdf-general-technical-information.pdf"
    used_for: "PTC principal-heater versus protection/sensor distinctions; carbonate/oxide, forming, firing and contacting routes, no universal proportions."
  - id: "kanthal-super"
    type: "handbook"
    reference: "Kanthal, High power heating elements for furnace productivity — Kanthal Super, S-KA018-B-ENG 06.2021, p2; https://www.kanthal.com/globalassets/kanthal-global/downloads/high-power-heating-elements-for-furnace-productivity-kanthal-super_b_eng_lr.pdf"
    used_for: "MoSi2 industrial heating body counterexample to all household coil or MgO architecture."
  - id: "kanthal-a1"
    type: "handbook"
    reference: "Kanthal A-1 resistance-heating wire datasheet, updated2026-08-27 13:30; https://prodshop.kanthal.com/en/products/datasheets/material-datasheets/wire/resistance-heating-wire-and-resistance-wire/kanthal_a_1/"
    used_for: "Specific FeCrAl grade counterexample to all NiCr; no copied operating-temperature default."
  - id: "molytun-elements"
    type: "handbook"
    reference: "Molytun, Heating elements, original HTML snapshot2026-10-02; https://molytun.com/produkte/heating-elements/?lang=en"
    used_for: "Tungsten/molybdenum/tantalum rod, strip, spiral and assembly interfaces; qualitative supplier scope only."
  - id: "epo-silicide"
    type: "literature"
    reference: "European Patent Office EP2921469B1, granted publication30January2019, paragraphs0027–0028; https://data.epo.org/publication-server/rest/v1.0/publication-dates/20190130/patents/EP2921469NWB1/document.pdf"
    used_for: "One tungsten-containing silicide mixing/extrusion/debinding/firing example; binder identity and actual recipe require foreground records, patent numbers not defaults."
