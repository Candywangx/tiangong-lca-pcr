product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.special-purpose-machinery.electric-heating-resistors-except-of-carbon"
  classification_refs: "CPC 3.0 44818"
  covered_products: "Complete principal-heater metal-alloy, PTC ceramic, MoSi2 or refractory-metal elements; conditional industrial scope requires classification review."
  excluded_products: "Carbon/graphite heating bodies; complete appliances/furnaces; non-heating resistors and protection/sensor PTC; heat service."
  representative_product: "Declared finished NiCr tubular element; an architecture example, not the only permitted family."
  production_route: "Own conductor/ceramic preparation and assembly, or assembly from purchased bodies; declare every actual route."
  market_state: "Accepted complete solid element at plant, terminals/insulation included where specified; transport packaging separate."
functional_unit:
  what: "Supply a specified complete resistive heating element for integration; no thermal-service equivalence claim."
  how_much: "1 kg accepted net element output of one configuration."
  how_well: "Actual rated voltage/power, resistance tolerance and measurement temperature, insulation test, geometry, conductor grade, thermal interface, atmosphere and acceptance specification."
  how_long_or_cycle: "One production acceptance and dispatch cycle; no lifetime or service operating time default."
  reference_flow_link: "finished"
system_boundary:
  rules:
    - rule_id: scope
      applies_to: "foreground_system_boundary"
      rule: "Complete non-carbon resistive heating elements whose principal designed function is heat generation are covered. Metal-alloy coil, tubular/cartridge, etched-foil, barium-titanate heater PTC, MoSi2 and refractory-metal designs are distinct conditional families. Exclude carbon/graphite heat-generating bodies; carbon in polymer insulation or carbonate feedstock does not by itself trigger that exclusion."
      source_ids:
        - cpc-3-notes
        - tdk-ptc
        - kanthal-super
        - molytun-elements
    - rule_id: classification
      applies_to: "foreground_system_boundary"
      rule: "CPC3 places 44818 under domestic appliances but gives no detailed leaf note. Do not infer that every industrial or ceramic element is accepted into 44818. Keep actual principal function, conductor chemistry, apparatus versus element interface and classification decision; this methodology intentionally retains industrial conditional routes pending coordinate review. SiC and other chemically combined-carbon conductors require explicit carbon-boundary and classification review before extension; they are not silently treated as graphite or included as proved non-carbon."
      source_ids:
        - cpc-3-notes
    - rule_id: exclusion
      applies_to: "foreground_system_boundary"
      rule: "Exclude complete appliances, industrial furnaces, supplied useful heat and operating service. Exclude non-heating resistor, protection-fuse, sensing and motor-start PTC unless the delivered product is evidenced as a principal heater. Factory powered acceptance is included; later appliance use, lifetime, replacement and end-of-life are outside this production dataset."
      source_ids:
        - tdk-ptc
        - cpc-3-notes
    - rule_id: make_buy
      applies_to: "foreground_system_boundary"
      rule: "For each conductor, sheath, terminal, substrate, insulation and electronic sensor, declare bought completion state versus own steps. Complete bought module carries embedded metal/powder/sintering/etching once in its upstream dataset. Own manufacture takes specific feedstocks and actual operations, removing the equivalent bought module. Partial bought bodies include only downstream steps actually performed; internal intermediate transfers cancel, never a second external input."
      source_ids:
        - watlow-tubular
        - watlow-flexible
        - tdk-ptc
        - epo-silicide
    - rule_id: extension
      applies_to: "foreground_system_boundary"
      rule: "Cards below are concrete conditional interface examples, not a compulsory BOM. For every actual grade, dopant, binder, coating, contact metallization, solvent, fuel, cooling chemical, coolant, packaging and waste absent from these examples, create a separate atomic card with verified identity and protocol. Do not place plural materials, unspecified chemicals or an all-material basket in one exchange. Missing actual identity or measurement is unknown, not zero; not_applicable needs route evidence."
      source_ids:
        - tdk-ptc
        - epo-silicide
    - rule_id: upstream
      applies_to: "foreground_system_boundary"
      rule: "Include incoming supply and actual inbound transport; upstream provider must match chemistry, component completion state, electricity voltage/geography, steam gross/net return convention and waste treatment route. Foreground logs do not imply a complete cradle-to-gate result without these providers. Record each actual transport mode and tonne-kilometre leg separately; no shipment distance defaults."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual incoming grade-specific conductor/powder or purchased body/module completion state."
