measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: normalize_inventory
    applies_to: "all inventory rows"
    required_property_ref:
      name: "row-specific"
      uuid: ""
    required_unit: "row-specific"
    rule: "Every applicable non-reference amount uses normalize_mass; mass refers only to the product denominator, never converts an energy numerator to mass."
  - id: physical_assay
    applies_to: "physical material and species records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep gross physical mass and contained-species mass separate using each record own assay and wet/dry basis; no rule applies this assay to electricity or transport."
  - id: energy_units
    applies_to: "utility records"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Retain metered kWh and convert by 3.6 MJ/kWh; actual gas volume requires own conditions/composition/heating value. Steam mass cannot substitute for delivered heat."
