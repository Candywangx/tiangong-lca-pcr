  unresolved_inventory_uuids: All atomic rows queried; unmatched grade, formulation, delivered-state, property and provider interfaces retained explicitly. Only adopted direct-read identities carry UUIDs.
  unresolved_factory_records: Sources establish conditional architecture and boundaries, not factory recipes, masses, yields, test charges, emissions or generic lifecycle benefits. Obtain actual BOM, make/buy, alloy/lining/coating specifications, supplier delivery, treatment and calibrated common-period records.
  unresolved_function_review: Cook/heater hybrids, whole-house boiler functions, motor-fan hot-air distributors and ambiguous ceramic/aluminium appliances require principal-function/category review; they cannot silently inherit this category.
