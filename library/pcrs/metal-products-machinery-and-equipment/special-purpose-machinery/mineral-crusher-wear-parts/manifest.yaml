  semantic_boundary_decision: "Existing material mineral-crushing-and-screening-machinery PCR has complete electrically driven machine output and explicitly excludes standalone spare-part manufacture. Basic alloy/ferromanganese records describe upstream stock, not part-specific mould/heat trace, solution/quench metallurgy and finished jaw-plate fit. Create narrower new unpainted sand-cast austenitic manganese-steel jaw-plate manufacturing route with electric melt/heat and actual physical acceptance. Exclude complete crusher, cone/other liners, high-chromium iron/composites, coated state and use-phase wear. Old44462 scaffold and all mappings remain read-only; no retired ID promoted."
