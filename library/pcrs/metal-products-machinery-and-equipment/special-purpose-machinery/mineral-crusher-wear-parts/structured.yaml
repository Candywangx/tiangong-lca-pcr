allocation_rules:
  - rule_id: allocation_heat
    applies_to: "heat/batch and shared resources"
    rule: "Directly assign charge and mould/finishing jobs where possible. For shared heat metal, record chemistry-compatible total metal transfers, internal returns and accepted plate/reject inventories with actual attributable metal balance. Shared furnace/thermal/extraction resources use measured causal charge/load, furnace occupation and actual cycle: share = order driver / sum of covered order drivers. Preserve period, denominator, standby and sensitivity; never distribute by catalogue weight or assume uniform yield."
    source_ids: []
  - rule_id: allocation_returns
    applies_to: "internal metal/sand loops"
    rule: "Internal gates, risers, rejects, chips and reclaimed sand remain controlled internal transfers, with actual stock and losses; do not create a second purchase or avoided-virgin-material credit. Carry actual remelt/reclamation energy and wear. External charge and final waste transfers stay distinct. Rework and rejected production affect accepted-output denominator; no universal return fraction or recycled-content claim from input totals alone."
    source_ids: []
  - rule_id: allocation_coproduct
    applies_to: "saleable co-products and qualification"
    rule: "Trace each actual exported slag/scrap and destination once. Co-product status/allocation requires actual contractual, causal/economic evidence and sensitivity, not recyclability alone. Actual batch qualification tests are attributed to covered production with traced sampling scope/driver; destroyed test material is not accepted output. Independent R&D is separate; no assumed test frequency or tooling life."
    source_ids: []
