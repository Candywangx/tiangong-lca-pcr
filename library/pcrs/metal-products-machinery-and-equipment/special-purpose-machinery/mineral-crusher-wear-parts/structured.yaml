    - rule_id: boundary_actual_exchanges
      applies_to: "complete actual heat route"
      rule: "Cards are starting exchanges requiring actual recipe/route applicability, not a complete universal bill. Add each actual binder constituent/catalyst/coating, flux/alloy, furnace atmosphere, tool/coolant, blast medium, NDT chemical, repair-weld consumable, filtered residue and measured species with exact identity when performed. Thermal/mechanical defects or fume cannot be assigned invented quantities. Record missing versus evidenced not_applicable; no complete LCI claim until actual heat/material/operation balances reconcile."
      source_ids: []
