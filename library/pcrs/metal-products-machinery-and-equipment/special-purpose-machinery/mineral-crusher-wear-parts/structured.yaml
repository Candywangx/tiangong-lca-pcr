  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Require mass_record_provenance actual calibrated physical finished-plate weighing, same drawing/grade/supply state and positive net M kg. Retain heat/part trace and measured tare; excludes gates/risers, rejects, chips, removed scale, fixtures and packaging. No melt charge, blank mass, density estimate or complete-crusher mass substitutes. Actual accepted counts must agree with mass/configuration originals. Missing originals requires scientific/data review."
      evidence: "actual part weighing/calibration/tare and signed release"
    - id: quality_identity
      applies_to: "all exchanges"
      requirement: "Verify one chemical/physical exchange and actual supply grade/state. Ferromanganese is not silicomanganese or elemental manganese; graphite recarburizer is not coal or activated carbon; refractory brick/disc is not pure alumina; actual sand binder solution is not dry powder. Waste dust/sand/slag is not an elementary environmental emission. Preserve actual reference property/unit and phase/medium; unresolved identities stay precise."
      evidence: "supplier assay/recipe/SDS and public identity/unit originals"
    - id: quality_metallurgy
      applies_to: "cp_melting; cp_thermal; cp_acceptance"
      requirement: "Trace part to heat charge chemistry, residuals and actual qualified solution/quench cycle. Retain furnace calibration/loading, temperature/time and transfer/quench records plus actual metallurgical/dimensional acceptance reports. Thermal logs alone do not establish austenitic condition; use producer-required examination with actual sampling/specification. No universal chemical range, hardness, magnetic-test criterion, carbide threshold or heat curve inferred. Repair weld or later thermal exposure requires actual qualified evidence, not an assumed equivalent condition."
      evidence: "actual heat/part chemical, thermal, metallurgical and release originals"
    - id: quality_balance
      applies_to: "metal, sand, water, energy and species"
      requirement: "Reconcile external charge, internal circulation, accepted metal, rejects/returns, slag/scale/chips and actual inventory changes by heat/period; do not assume yield=1. Sand balance separates fresh make-up, reclaimed loops and final disposal. Water supply/recirculation/purge and evaporation need actual records, no automatic resource/wastewater equivalence. Quartz-air requires actual crystalline-quartz CAS14808-60-7 released fraction and medium; amorphous silica, total dust and captured residue are not substitutes. Other metal/oxide or combustion emissions require individual chemistry and actual evidence before adding identities."
      evidence: "actual heat/material/sand/water/species balances and transfers"
    - id: quality_coverage
      applies_to: "actual dataset and upstream links"
      requirement: "Distinguish measured/calculated/missing/evidenced not_applicable. Audit actual whole process map, recipes and machining/inspection consumables beyond candidate cards, supplier boundaries, outsourced processing, capital exclusions, allocation and uncertainty. Verified compatible upstream links are needed for full cradle-to-gate. Contract checking does not establish factory data completion, performance validation or scientific approval."
      evidence: "actual complete heat/operation records and transparent gaps"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference and finished_plate"
    rule: "Exact reference product name equals finished_plate output. Use actual positive M kg with cp_mass and normalize_mass. Blank candidate reference UUID registers that precise row in unresolved_flow_identities. Verify one complete accepted jaw plate, actual grade/profile/heat and unpainted gate, excluding other parts/protection."
    source_ids: []
  - rule_id: validate_basis
    applies_to: "all rows/protocols"
    rule: "Check ordered bilingual lawful lowercase row/rule/protocol IDs and actual projected references, per-unit q_item, M kg and same-configuration counts. Unit means one jaw plate throughout. Preserve real public Number/Area/Energy properties; compatible conversions require original metrology, never relabel as Mass."
    source_ids: []
  - rule_id: validate_route
    applies_to: "heat/mould/finish records"
    rule: "Require actual selected electric sand-cast solution/water-quench route, heat chemistry/mould recipe, part/heat tracing, actual finished metallurgy/fit and physical mass originals. Internal returns are not external purchases; spent sand and capture dust are not air releases. Missing records or unqualified repair/exposure requires review."
    source_ids: []
  - rule_id: validate_use
    applies_to: "dataset use"
    rule: "Disclose exact part/grade/heat/profile/gate, weighing/thermal/metallurgy originals, missing exchanges and unresolved identity/upstream gaps. Equal kg cannot prove equal wear life, impact toughness or crusher throughput. Candidate remains unpublished with scientific review pending."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset and background_dataset after actual data completion/review"
  downstream_use: "Specified new crusher jaw-plate input to separately bounded machine assembly or replacement lifecycle"
  allowed_use: "Manufacturing comparisons for matching grade, profile, heat-treated state and supply gate with actual mass and upstream links disclosed"
  excluded_use: "Exclude complete crushers, jawstocks/frames, cone mantles/concaves, screens, general cast stock, high-chromium white iron, martensitic/Q&T steel, ceramic or carbide inserts and other composite parts, painted/coated supply states, refurbished/repaired used liners, standalone pattern/tool manufacture, site installation, mineral throughput, use-phase work hardening/wear/replacement and end of life. Gas-fired or undeclared melting/heat routes need separate assessment."
  required_metadata: "producer/foundry/site/period; part number/drawing revision, tooth profile, mounting/fit geometry and individual serial/batch/heat; actual steel grade and C/Mn/Cr/residual assay; furnace types, external charge versus internal gates/risers/returns, actual mould sand/binder recipe and reclamation; recorded casting/solution/quench cycle and metallurgy; actual finishing and unpainted complete state; controlled inspection/sampling and release; positive physically measured M kg, calibration/tare/uncertainty and packaging exclusion; material/water/energy/waste/species balances, causal allocation and upstream gaps"
  required_quality_disclosure: "Measured/calculated/missing records, actual net weighing/heat/metallurgy/fit originals, identity and upstream gaps, capital exclusion, allocation and uncertainty; candidate scientific review pending"
  update_trigger: "Part/drawing/tooth/fit profile, grade/charge/binder, furnace/casting/solution/quench route, repair/finish/coat state, physical mass/acceptance, site or upstream change"
data_sources:
  - id: "metso"
    type: "literature"
    reference: "[Metso Crushing and Screening Handbook, edition7](https://www.metso.com/globalassets/insights/ebooks/metso-crushing-and-screening-handbook-edition7-en-web.pdf)"
    used_for: "Wear parts–crushers, printed168–169: casting in sand moulds, thermal control and final machining context. Manufacturer account, not current plant recipe or mandatory electric furnace/binder choice. General material and work-hardening statements do not establish this plate grade, net mass or service life. No numerical manufacturing factors or universal thermal limits adopted."
  - id: "amsted"
    type: "extension_guidance"
    reference: "[Amsted: manganese-steel wear parts selection](https://www.amstedglobal.com/what-to-consider-when-buying-your-manganese-steel-wear-parts-for-your-crusher/)"
    used_for: "Article dated1October2021, test-certificate and heat-treatment paragraphs: traceability, chemistry/dimensions and caution that thermal logs alone do not establish properties. Historical manufacturer guidance only; cone-liner geometry, alloy percentages, temperature, hardness, magnetic/sample checks and wear life are not universal jaw-plate requirements. Actual producer specifications and metallurgical acceptance required."
