  unresolved_inventory_uuids: Every atomic identity actually queried with correct type and direction; only explicitly UUID-bearing conditional cards are adopted direct-read identities. Other cards retain real grade, supplied completion, chemistry or provider gaps; generic resin/parts/transport service/customer-product proxies are not forced.
