allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "all processes"
    rule: "Investigate subdivision and system expansion before allocation. For a declared attributional factory-gate product inventory, prefer dedicated records; allocate remaining shared totals using a measured relevant physical driver. If using another relationship, explain why physical causality was inadequate and document price period/sensitivity."
    source_ids:
      - eu-ef-2021
  - rule_id: allocation_residues
    applies_to: "all waste rows"
    rule: "Keep recoverable scrap, hazardous waste and co-products distinct. No automatic avoided virgin-material credit; state the chosen recycling/treatment convention and provider boundary. Transfers and internal recirculation cannot create environmental credits by themselves."
    source_ids:
      - eu-ef-2021
