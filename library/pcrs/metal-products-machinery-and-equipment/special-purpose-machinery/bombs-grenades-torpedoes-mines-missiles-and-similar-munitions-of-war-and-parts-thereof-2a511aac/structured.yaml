  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For each applicable atomic exchange, divide the reconciled attributable reporting-period total by same-period accepted net product mass D. Record allocation and conversions separately; the reference output is 1 kg."
      inputs:
        - "period exchange total"
        - D
        - cp_accepted_article
      output: "normalized exchange"
      source_ids: []
    - id: generic_mass_closure
      applies_to: "site_environment"
      rule: "Reconcile external mass inputs and opening stocks with accepted output, rejects, waste, identified emissions and closing stocks using consistent wet/dry and constituent definitions. Include reaction-related external mass where relevant; paired internal transfers cancel. Explain residual discrepancy against measurement uncertainty without inventing a universal tolerance."
      inputs:
        - "reconciled external mass records"
        - stocks
        - assays
      output: "documented mass closure"
      source_ids: []
    - id: species_release
      applies_to: "lead_air; copper_water"
      rule: "Multiply the measured concentration of the named species by the corresponding sampled release quantity with documented units and coverage; sum same-species same-compartment observations and normalize with D. Do not convert gross mixture mass into constituent mass without matching assay."
      inputs:
        - "laboratory concentration"
        - "corresponding flow"
        - period
        - D
      output: "species mass per reference flow"
      source_ids:
        - epa-tri-reporting
    - id: water_closure
      applies_to: "purchased_water; metal_sludge; offsite_effluent"
      rule: "Reconcile same-period external water input, input moisture, opening water stocks and actual reaction-related water with closing water stocks, measured discharge, actual evaporation, retained product moisture and water in wet wastes. Verify paired water/condensate returns at their actual external gates and cancel internal recirculation transfers. Convert volume using documented state-appropriate density with units; propagate meter, assay, density and stock uncertainty into the residual assessment. Do not assign residual loss automatically to evaporation or invent a tolerance."
      inputs:
        - "water meters"
        - "input/product/waste moisture assays"
        - "water stocks"
        - "actual reaction water evidence"
        - "discharge and evaporation evidence"
        - returns
        - "density and uncertainty"
      output: "documented water closure"
      source_ids: []
    - id: contained_species_closure
      applies_to: "empty_brass_case; unfilled_steel_casing; brass_scrap; metal_sludge; lead_air; copper_water; accepted_article"
      rule: "For each identified conserved metal, reconcile its contained mass on EACH product, input, scrap, sludge, stock and release term using that term's own matching assay and wet/dry basis. Include opening/closing stocks, paired internal transfers and actual additional input/output terms; track species transformations separately from elemental conservation. Do not multiply all terms by one common alloy or sludge assay, and do not equate gross carrier mass with constituent mass."
      inputs:
        - "individually matched assays"
        - "carrier masses"
        - "opening/closing stocks"
        - "constituent/species definitions"
        - "environmental interface register"
      output: "documented contained-metal and species reconciliation"
      source_ids: []
    - id: utility_reconciliation
      applies_to: "grid_electricity; purchased_steam; natural_gas; diesel; fossil_co2; carbon_monoxide; nitrogen_dioxide"
      rule: "Reconcile each actual energy carrier separately: external imports plus measured on-site generation and opening stored energy against allocated measured site demand, exports, measured closing stored energy and evidenced losses. Record conversions and meter uncertainty; do not infer unidentified carriers or losses from a residual. An internally generated electricity/heat service and its generating fuel cannot both enter as independent external purchased supplies. The generating fuel's upstream provider burden and site releases are counted once; purchased heat/electricity provider burdens stay upstream."
      inputs:
        - "import/generation/export/demand meters"
        - "storage records"
        - "carrier-specific conversions"
        - "loss evidence"
        - "provider coverage"
        - "allocation and uncertainty"
      output: "carrier-specific utility residual and no-duplication assessment"
      source_ids: []
    - id: steam_energy_interface
      applies_to: "purchased_steam"
      rule: "Prefer verified measured delivered MJ. Otherwise multiply measured steam mass in kg by specific enthalpy difference in MJ/kg at the actual supplied state and declared common energy reference; subtract measured condensate-return mass times its own enthalpy difference using the same reference. kg × MJ/kg = MJ. Document actual supplied/return state, provider boundary, calorimetric/thermodynamic source, mass meters and uncertainty. Do not prescribe steam operating settings or duplicate supplier fuel and stack emissions."
      inputs:
        - "measured steam/condensate masses"
        - "state-specific enthalpy evidence"
        - "common reference"
        - "provider gate and uncertainty"
      output: "net delivered purchased-steam MJ for normalization"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all rows"
      requirement: "Verify delivered-state/type, unit/property, provider and geography before selecting any UUID; unresolved identity remains a candidate gap."
      evidence: "direct-read identity and supplier records"
    - id: coverage
      applies_to: "all processes"
      requirement: "Document actual make/buy gates and every material/service/waste/species; independently review confidential supporting environmental evidence. An inaccessible essential interface makes the dataset incomplete."
      evidence: "environmental interface register and reviewer coverage statement"
    - id: period
      applies_to: "all protocols"
      requirement: "Use consistent period, output family/state and allocation driver; reconcile meters, stocks, acceptance and invoices. Quantify uncertainty, missing periods and detection limits."
      evidence: "calibration, laboratory QA and audit records"
    - id: ranges
      applies_to: "all rows"
      requirement: "No verified independent boundary-compatible empirical range exists here. Collect foreground data; do not replace gaps with recipe-based estimates or universal mass/energy/emission factors."
      evidence: "site records and explicit uncertainty"
validation_rules:
  - rule_id: validation_reference
    applies_to: "accepted_article"
    rule: "Require one family and delivery state, positive accepted net denominator D, packaging separation and complete qualifiers; category UUID gap remains disclosed."
    source_ids:
      - un-cpc3-2025
  - rule_id: validation_boundary
    applies_to: "all processes"
    rule: "Check make/buy coverage, supplier burdens once and no internal-transfer duplication; separate later use/remediation and external waste treatment from direct environmental releases."
    source_ids:
      - epa-munitions-environment
      - epa-tri-reporting
  - rule_id: validation_species
    applies_to: "all emissions and wastes"
    rule: "Validate species, compartment, assay basis, reporting-period coverage and nondetect treatment. CO and NO2 require independent species evidence; transferred waste and retained sludge are not direct releases."
    source_ids:
      - epa-tri-reporting
  - rule_id: validation_completeness
    applies_to: "all exchanges"
    rule: "Any unreviewable essential supplier/site interface, unknown quantity or incompatible UUID yields incomplete dataset coverage. Passing finite normalization checks does not prove all production burdens are covered or that publication gates are satisfied."
    source_ids: []
  - rule_id: validation_closures
    applies_to: "all exchanges"
    rule: "Require water closure including moisture, stocks, reaction water, evaporation, discharge, wet wastes and paired returns; contained-species reconciliation with a matched assay on EACH term; carrier-specific utility imports/generation/exports/storage reconciliation; and a verified steam energy/condensate interface. Assess residuals using documented measurement uncertainty; no blanket tolerance, common assay, assumed loss or unreported-zero rule."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared-family factory-gate environmental inventory and downstream process/lifecyclemodel projection with preserved boundaries."
  excluded_use: "Manufacturing instructions; performance comparison across families; operational design; undisclosed complete LCA claims; use/range/remediation estimates without separate evidence."
  required_metadata: "Reference qualifiers; period and site; reporting gates; supplier dataset coverage; environmental interfaces; allocation; units/conversions; confidentiality; omitted life stages."
  required_quality_disclosure: "Unresolved flow identities; no empirical defaults; sampling/detection limits; confidential-interface review coverage; quantitative and boundary gaps; representativeness and uncertainty."
  update_trigger: "Changed family/delivery state, make/buy gates, provider geography/year, environmental controls, inventory evidence or accepted identity."
