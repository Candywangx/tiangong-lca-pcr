      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete machine of the same configuration in kg; collect using cp_mass."
  - id: count_engine
    applies_to: "diesel_engine"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Retain actual installed engine count as the exchange numerator. Separately weigh its specified assembly for BOM mass reconciliation; no generic item-to-kg conversion is allowed."
  - id: meter_units
    applies_to: "electricity, natural gas and liquids"
    required_property_ref:
      name: "Net calorific value; Volume; Mass"
      uuid: ""
    required_unit: "MJ; m3; kg"
    rule: "Preserve each exchange property. Verified energy unit-group conversion is 3.6 MJ/kWh; any liquid/gas mass-volume conversion requires measured density, composition and reference conditions. A property meanValue of 1 is not a fluid density."
