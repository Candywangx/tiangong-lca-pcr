allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared manufacture"
    rule: "Separate orders by exact drivetrain and delivery configuration; use direct stock issues, measurements and work orders first. When shared operations cannot be directly separated, collect a causal driver such as actual machine-hours or metered load and assign the order share as its driver divided by all covered order drivers. Record justification and covered denominator; unexplained cross-model machine-count allocation is not permitted."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "waste and internal reuse"
    rule: "Reconcile internal reuse with stock, fresh input and returned powder/offcuts; do not count recirculation as repeated fresh purchase. Exported wastes carry measured quantity and destination without an automatic avoided virgin-material credit. Any valuable co-product requires separate status and reviewed residual allocation after direct process separation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted net tractor"
      record_type: "weighing_record"
      raw_fields: "model; configuration; serial number; accepted net mass M; scale_id; fill_state; ballast; excluded_implements; packaging_tare"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each machine or representative same-configuration batch"
      temporal_coverage: "same reporting manufacturing period as orders"
      site_scope: "declared manufacturing site/configuration"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "scale calibration, tare, configuration and acceptance receipts"
    - protocol_id: cp_fabrication
      process_id: "fabrication"
      flow_role: "each defined atomic exchange"
      record_type: "measured_order_record"
      raw_fields: "order; serial/configuration; item/grade; issues; returns; stock_change; exchange_amount; installed_count; part_mass; supplier_scope; meter_unit/state; accepted_count; waste_outlet; allocation_driver; emission_mass"
      collection_method: "Use item-specific BOM weights/counts and issue-return-stock reconciliation; calibrated utilities submeters and measured reference states; segregated waste weighing/receipts; attributable measured emissions for active combustion rows. Keep traceable part and supplier scope evidence."
      unit: "kg, MJ, m3 or Item(s) as the row declares"
      frequency: "each order, aggregated per batch"
      temporal_coverage: "declared continuous manufacturing period"
      site_scope: "Structural fabrication and housing machining"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "BOM, meter calibration, waste transfer and test records"
    - protocol_id: cp_joining
      process_id: "joining"
