  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "all rows"
      requirement: "Trace product, installed options and component completeness to serial/configuration; reconcile first fills and bought-in assembly inclusion to avoid duplicate mass or inputs."
      evidence: "configuration BOM and supplier boundaries"
    - id: quality_balance
      applies_to: "stock and utilities"
      requirement: "Reconcile raw stock, parts, accepted net mass, reject/waste and inventory change; explain losses and density/reference-state conversions with measured evidence. No unsupported yield factor."
      evidence: "weighing, stock, meter and transfer records"
    - id: quality_coverage
      applies_to: "all processes"
      requirement: "Cover the stated site and continuous period; disclose start/end, outsource gaps, missing quantities and inactive routes. Set configuration-specific QA limits from measured records; manufacturer descriptions provide no manufacturing intensity range."
      evidence: "order coverage, calibration and completeness reconciliation"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Require a complete ride-on wheeled traction unit with positive measured M, configured delivery fills/ballast and explicit excluded implements/tare. Reject a track/pedestrian tractor or incomplete kit under this reference."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Check one atomic exchange, public flow identity, reference property/unit group, numerator unit and route. Engine count is not mass; battery capacity is not pack mass; water resource is not treatment wastewater. Resolve blank identities before a fully linked dataset is released."
    source_ids: []
  - rule_id: validate_amount
    applies_to: "all inventory rows"
    rule: "Require linked collection and normalization evidence for accepted output; no duplicate supplier components or internal transfers. Verify actual BOM extensions, stock/rework allocation and meter coverage. Unknown is pending evidence, not zero."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "combustion rows"
    rule: "Activate fossil CO2 only with attributable measured factory combustion emissions in the stated air subcompartment; no field operation or biogenic CO2 substitution. Other demonstrated emissions require separate substance and medium cards; NO, NO2 and N2O are different identities."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground configured wheeled agricultural tractor manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset after qualified review with explicit upstream coverage"
  allowed_use: "Supply-chain manufacture modelling for the same configuration, property, gate, site and period"
  excluded_use: "Hectare/crop-yield or lifetime-energy comparison; equal-mass traction equivalence; crawler/pedestrian tractor proxy; complete cradle-to-gate claim without upstream linkage"
  required_metadata: "Reference qualifiers; measured M and acceptance/fill state; exact propulsion and transmission; full BOM and supplier scopes; site/period/gates; actual process route; collection, allocation and background links"
  required_quality_disclosure: "Missing flow identities/quantities; measurement uncertainty; inactive alternatives; actual added exchanges; historic source conditions; outsourcing and unlinked upstream stages"
  update_trigger: "Drivetrain, wheel, operator-station or implement-interface change; supplier completeness or coating/fill change; revised measured M; site/period/supply change; resolved evidence gap"
data_sources:
  - id: "fendt-factory"
    type: "literature"
    reference: "[Fendt Brand — Factory network](https://www.fendt.com/au/about-us/locations)"
    used_for: "Named tractor factory/cab-production paragraphs: metal processing, joining, body painting, wheel and cab installation. Factory examples only, not universal process recipes or amounts; sections about mowers and forage harvesters are excluded."
  - id: "mf-factory"
    type: "handbook"
    reference: "[A classic visit with Massey Ferguson](https://www.masseyferguson.com/content/dam/public/masseyfergusonglobal/markets/en/assets/discover-mf/manufacturing/beauvais/brochure/17756_MF_Factory_tour_brochure_PDF_V11B_Angl_UB.pdf)"
    used_for: "A-A-17756, 2023 English; PDF page 4, factory-tour paragraph identifies GIMA transmission production and tractor assembly lines. Historical site example only; no schedule, capacity, energy or machine mass inferred."
  - id: "fendt-electric"
    type: "literature"
    reference: "[Fully battery-electric: The Fendt e100 V Vario](https://www.fendt.com/us/fully-battery-electric-the-fendt-e100-v-vario-pc-23)"
    used_for: "2023-11-12 model announcement, e107 V Vario drivetrain paragraph; historical battery/motor/transmission configuration alternative. Does not establish current availability, cell chemistry, manufacturing quantities, net mass or lifetime."
