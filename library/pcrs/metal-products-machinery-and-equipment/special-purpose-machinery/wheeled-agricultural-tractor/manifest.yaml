  unresolved_quantity_ranges:
    - No verified configuration-specific manufacturing exchange intensity or net
      machine mass ranges acquired; measured foreground records and scientific
      review must establish QA limits.
  evidence_limitations:
    - Fendt factory text is a site/process example only; cannot prescribe
      universal coating recipes, energy supply or production quantities.
    - MF factory-tour brochure is 2023 historical line-identification evidence
      only; Fendt 2023 model announcement establishes historical electric
      configuration, not current availability or battery chemistry.
    - Fendt and Massey Ferguson are both AGCO brands; these sources are not two
      independent manufacturer organizations. Scientific review and additional
      independent manufacturing evidence remain pending.
    - Cached Deere tour browser original contains navigation/template content
      and does not establish manufacturing detail; discovered Deere coating PDF
      returned HTTP 404 and was not adopted.
