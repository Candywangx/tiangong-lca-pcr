review_metadata:
  scientific_review: pending
  semantic_boundary_decision: New complete ride-on wheeled agricultural traction
    units, diesel and battery-electric configurations separately declared.
    Adjacent material PCRs cover track-laying and pedestrian-controlled tractors
    and are excluded. Half-track conversions/hybrids and externally supplied
    implements excluded; 44149 reference is narrower classification context
    only, not accepted mapping. Retired other-agricultural-tractors identity not
    reused.
  unresolved_flow_uuids:
    - row_id: housing_blank
      flow: Grey-cast-iron tractor transmission housing blank
      reason: Searches retrieved cast-iron metal or unrelated parts, not a grey-iron
        tractor transmission housing blank with matching assembly scope.
    - row_id: iron_chips
      flow: Grey-cast-iron machining chips
      reason: The directly read iron-chips candidate has site-specific scope and does
        not establish the declared grey-cast-iron grade; steel chips are a
        different material.
    - row_id: welding_slag
      flow: Solid carbon-steel flux-cored welding slag
      reason: Bounded welding-slag searches did not establish a public identity for
        this collected carbon-steel flux-cored welding slag; steelmaking slag is
        outside scope.
    - row_id: epoxy_ecoat
      flow: Waterborne epoxy electrodeposition coating formulation
      reason: Retrieved electrodeposition-primer candidates do not establish the
        specified waterborne epoxy formulation; a phenolic baking primer is not
        the same resin identity.
    - row_id: powder_overspray
      flow: Unrecovered solid resin powder-coating overspray
      reason: The directly read powder-coating waste candidate is site-specific and
        does not establish the actual resin and unrecovered overspray boundary.
    - row_id: ecoat_sludge
      flow: Epoxy electrodeposition paint sludge
      reason: Bounded searches did not establish a public identity for segregated
        epoxy electrodeposition sludge with specified water/solids content.
    - row_id: rinse_wastewater
      flow: Metal-part cleaning rinse wastewater sent to treatment
      reason: Retrieved wastewater candidates do not establish the metal-cleaning
        rinse composition and outlet scope; municipal or paper-mill wastewater
        is outside scope.
    - row_id: transmission
      flow: Finished wheeled-tractor transmission assembly
      reason: Retrieved gearbox/tractor-component candidates do not establish a
        finished wheeled-tractor transmission assembly with matching
        completeness; component collections are not atomic assemblies.
    - row_id: drive_axle
      flow: Finished wheeled-tractor drive axle assembly
      reason: The directly read generic axle assembly does not specify a driven
        agricultural-tractor axle, differential/final-reduction completeness or
        applicable supplier geography; other retrieved trailer running gear is
        outside scope.
    - row_id: traction_battery
      flow: Complete tractor lithium-ion traction battery pack
      reason: The directly read battery-pack candidate has an energy reference
        property and a different application scope; no measured mass conversion
        or matching tractor pack was established.
    - row_id: traction_motor
      flow: Electric wheeled-tractor traction motor assembly
      reason: The directly read traction-motor candidate is for rail/tram stock, not
        the declared wheeled-tractor assembly.
    - row_id: traction_inverter
      flow: Wheeled-tractor traction-motor inverter assembly
      reason: The directly read motor-drive inverter candidate is for industrial-robot
        servo drive, not the tractor propulsion inverter.
    - row_id: pneumatic_tyre
      flow: New pneumatic rubber agricultural tractor tyre
      reason: The directly read tyre candidate has an item-count reference and a broad
        rubber-or-metal definition; no matching agricultural pneumatic rubber
        tyre mass identity was established.
    - row_id: steel_rim
      flow: Steel agricultural tractor wheel rim
      reason: The directly read steel-rim candidate is for a trailer; the tractor
        wheel load/configuration scope is not established.
    - row_id: steering_gear
      flow: Agricultural tractor steering gear assembly
      reason: Retrieved steering candidates do not establish a complete
        agricultural-tractor steering gear; trailer landing gear and axle
        collections are outside scope.
    - row_id: brake_assembly
      flow: Agricultural tractor disc brake assembly
      reason: The directly read generic brake assembly does not specify disc-brake
        construction, agricultural-tractor application or axle-supplier
        completeness; the defined assembly identity remains unresolved.
    - row_id: cab_assembly
      flow: Agricultural tractor operator cab assembly
      reason: Bounded searches did not establish a complete agricultural-tractor cab
        with the declared glazing/HVAC/seat supplier boundary.
    - row_id: operator_seat
      flow: Agricultural tractor operator seat assembly
      reason: Bounded searches did not establish the declared agricultural-tractor
        seat and suspension assembly boundary.
    - row_id: protection_frame
      flow: Steel agricultural tractor rollover protection frame
      reason: Bounded searches did not establish a tractor rollover protection frame;
        generic steel frames and reinforcing bar cannot establish this assembly
        identity.
    - row_id: hitch
      flow: Steel tractor three-point hitch assembly
      reason: Retrieved trailer-hitch candidates are outside the tractor three-point
        linkage boundary.
    - row_id: pto
      flow: Tractor power-take-off shaft assembly
      reason: Bounded searches did not establish the installed tractor PTO unit
        distinguished from an external implement drive shaft.
    - row_id: hydraulic_pump
      flow: Agricultural tractor hydraulic pump assembly
      reason: Retrieved pump or hydraulic-power-unit candidates do not establish the
        specified agricultural-tractor hydraulic pump and circuit type.
    - row_id: hydraulic_cylinder
      flow: Double-acting tractor hydraulic cylinder
      reason: Retrieved hydraulic-and-pneumatic cylinder collections do not establish
        the specified double-acting hydraulic tractor cylinder.
    - row_id: control_cable
      flow: Insulated copper tractor control cable
      reason: Directly read cable candidates have length or energy reference
        properties and/or an unspecified conductor; the mass-based insulated
        copper control cable identity remains unresolved.
    - row_id: controller
      flow: Agricultural tractor electronic control module
      reason: The directly read electronic-control-unit candidate covers machine-tool
        PLC/sensor/cabinet internals, not one tractor electronic module.
    - row_id: engine_oil
      flow: Refined mineral engine lubricating oil
      reason: The directly read lubricating-oil candidate is a synthetic PAO route,
        not the declared refined mineral engine oil; a matching first-fill grade
        was not established.
    - row_id: coolant
      flow: Ethylene-glycol aqueous tractor cooling fluid
      reason: The directly read antifreeze candidate does not establish the declared
        ethylene-glycol aqueous blend and measured concentration; pure glycol is
        not the blend.
    - row_id: fabrication_power
