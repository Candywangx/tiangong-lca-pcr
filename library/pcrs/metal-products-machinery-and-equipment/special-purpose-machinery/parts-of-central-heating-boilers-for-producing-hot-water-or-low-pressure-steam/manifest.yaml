  unresolved_inventory_uuids: All distinct atomic identities actually queried. Unmatched exact component state, alloy/formulation, gas interface, waste treatment and elementary species remain explicit; qualified UUIDs do not establish default activity amounts.
  unresolved_part_classification: Actual output must be eligible central-heating boiler parts for hot water or low-pressure steam. Dedicated fit alone cannot override independent burner, blower, valve, pump, control, sensor, fastener or generic material classification.
  unresolved_factory_records: Obtain actual part drawings, alloy certificates, make/buy and completion state, retained versus consumed test media, BOM, calibrated same-configuration net masses, common-period attributable meters, waste assays and species emissions.
  unresolved_configuration_evidence: Primary examples support cast sections and specific burner/exchanger service interfaces; actual welded water-tube, aluminium/stainless condensing blocks, electric or solid-fuel-host variants require their own drawings and factory records. No category narrowing or imposed recipe.
  unresolved_quantitative_defaults: No catalogue weight, pressure, efficiency, power, fuel consumption, warranty or replacement interval is a factory or service-life default.
