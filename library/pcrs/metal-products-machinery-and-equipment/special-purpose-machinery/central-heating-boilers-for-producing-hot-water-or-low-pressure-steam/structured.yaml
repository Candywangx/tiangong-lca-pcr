allocation_rules:
  - rule_id: allocation
    applies_to: "foreground_burden_allocation"
    rule: "Separate configurations and routes; use measured causal machine hours, heat, test cycles or treated area for shared work. Retain reject/rework burden in Q for accepted production. Internal returns cancel paired transfers; no automatic avoided-burden credit for scrap. Declare actual waste/coproduct status and consistent upstream recycling allocation."
    source_ids:
      - jrc-foundry-2024
