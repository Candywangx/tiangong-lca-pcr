validation_rules:
  - rule_id: reference_check
    applies_to: "foreground_dataset_conformance"
    rule: "Require positive D and N, same accepted configuration and calibrated net masses; reconcile reference output 1 kg, Q/D and retained reject/rework."
    source_ids:
      - acv-electric
  - rule_id: water_closure
    applies_to: "foreground_dataset_conformance"
    rule: "Close actual water: external water and input moisture plus beginning stock and reaction generation equal retained product water, end stock, evaporation, discharge and reaction consumption. Pair internal returns; test recirculation is not repeated purchased water. Investigate residual with actual combined meter/sampling/allocation uncertainty; no universal tolerance."
    source_ids:
      - acv-electric
  - rule_id: metal_closure
    applies_to: "foreground_dataset_conformance"
    rule: "For each contained metal/species, apply its own matched assay on every input, product, scrap, slag, sludge, wastewater and release; include beginning/end stocks, reaction transformations and paired transfers. Gross material mass never equals contained element. Investigate closure against actual combined measurement/sampling/allocation uncertainty."
    source_ids:
      - jrc-foundry-2024
  - rule_id: solvent_closure
    applies_to: "foreground_dataset_conformance"
    rule: "For each actual solvent close input and stock change against product retention, recovered solvent, capture media, actual destruction, air releases and non-air residuals; distinguish capture from destruction. Use combined actual uncertainty."
    source_ids:
      - acv-electric
  - rule_id: utility_check
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile all process/test/dispatch assigned loads and unassigned shared residual to same measured site balance, period and units. Do not add whole-factory totals on submeters. Investigate negative residuals against actual meter/sampling/allocation uncertainty, never clip them; reconcile imports, actual generation, fuel, exports and stock interfaces without counting the same carrier twice. Fuel carbon alone cannot establish CO/NOx; require species-specific evidence and fossil/biogenic split. NOx as NO2 is a reporting-equivalence convention, not pure NO2 identity; preserve actual NO/NO2 measurement and convention. Particle emissions require actual sampling definition and size fraction; measured PM10/PM2.5 are separate exchanges and never inferred from unknown-size dust. Factory firing emissions and condensate remain production exchanges; later use is separate."
    source_ids:
      - weil-80
      - viessmann-condensing
