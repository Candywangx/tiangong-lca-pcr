  reference_flow_identity:
    status: unresolved
    unresolved_support_fields:
      - reference_product_flow_uuid
  unresolved_reference_flow_uuid: Direct search returned industrial process heat and
    steam, not a delivered heating boiler; no generic reference product adopted. Verified
    mass property and kg unit do not establish boiler flow identity.
  unresolved_inventory_uuids: Each grade-specific metal, component, reagent, utility
    supply interface, waste treatment and elementary species requires actual direct-read
    identity before dataset construction; no input UUID adopted.
  unresolved_quantitative_ranges: No universal unit mass, pressure, efficiency, yield,
    fuel, lifetime or empirical manufacturing inventory adopted; matched factory records
    are required.
  unresolved_source_evidence: Product originals establish cast iron, steel electric
    and stainless condensing alternatives, not every factory recipe. Biomass design
    is supported by manufacturer product information; factory firing applies only
    when performed. Actual grades, phosphating chemistry, coating formulation and
    foundry recipe remain collection requirements.
  classification_boundary: CPC 3.0 parent 4482 covers domestic cooking/heating equipment,
    non-electric. This independent methodology also retains electric heating boilers
    and therefore is broader than leaf 44825; electric equipment classification needs
    separate actual-function review, no new edge is established.
  unresolved_provider_links: Site/geography, fuel composition, heat/steam supply and
    provider boundaries require actual supplier evidence.
