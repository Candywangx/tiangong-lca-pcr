  - id: "cpc"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Full not-ADP-connectable photocopier/label-barcode/similar-printer/blueprinter/fax scope and ADP/MFP exclusions, original242."
  - id: "brother-h110"
    type: "handbook"
    reference: "https://www.brother.com.au/en/labellers/all-labellers/pt-h110"
    used_for: "Actual PT-H110 non-PC/Mac-connectability and model-specific box contents; page snapshot is not universal supply or manufacturing BOM. Generic driver menu does not override explicit non-connectability."
  - id: "brother-manual"
    type: "handbook"
    reference: "https://download.brother.com/welcome/docp100243/pth110_areng_ug_d00nvg001.pdf"
    used_for: "D00NVG001 actual head/cassette/cutter/feed interface, repeated copies of entered label, batteries and optional adaptor;400g excludes batteries/cassette. Replacement accessories do not prove first included supply or factory consumption."
  - id: "brother-tape"
    type: "handbook"
    reference: "https://www.brother.com.au/-/media/ap2/australia/supplies/pdf/tze_tapes_technical_data.pdf?rev=55b1f034e9754734965019cea8a12248"
    used_for: "Laminated label layer diagram and thermal-transfer interface only; diagram PET conflicts with prose polyethylene laminate. Preserve supplier confirmation gap; do not infer pure film/adhesive recipes or use label durability tests as equipment factory factors."
  - id: "navy-blueprinter"
    type: "handbook"
    reference: "https://files.eric.ed.gov/fulltext/ED249091.pdf"
    used_for: "Historical Navy1982 primary Model842 mechanical feed/glass exposure/lamp/pump/aqueous-ammonia developer architecture and actual grade requirement; not current availability/default fill/recipe or every blueprinter. Operating media and rates are user operation, not factory trial quantities."
  - id: "fax-study"
    type: "handbook"
    reference: "https://files.eric.ed.gov/fulltext/ED032075.pdf"
    used_for: "Primary Nevada/CLR1966 trial of Magnavox/Xerox transceivers+telephone couplers; send/receive carbon-set interface. Internal scanning/marking is part of fax transmission; independent copying/scan-to-file/PC print must still be checked for the actual delivered model. Historical46lb/page-time/transmission counts are not manufacture factors."
