allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Subdivide actual manufacturing configurations and directly assigned meters/records first. Allocate only remaining common burden by evidenced causal manufacturing drivers. Include attributable rejects, failed trials and rework; Naccepted excludes rejects and Dnet includes only same-configuration accepted equipment. Internal recycled media/parts cancel paired transfers, not negative purchases or double upstream credit. External waste receiver treatment/transport follows actual route and declared boundary; recycling credit cannot be presumed. Retained supplied cartridge/media is distinct from consumed trial material and customer lifetime replacements."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "reference product"
      record_type: "calibrated acceptance ledger"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted unit"
      temporal_coverage: "declared period"
      site_scope: "same configuration site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration and accepted serial list"
    - protocol_id: cp_materials
      process_id: "fabrication_local"
      flow_role: "local raw material and ingredient"
      record_type: "receipts/issues/cuts/assay/stock/reaction record"
      raw_fields: "grade/form/CAS/full chemistry/assay/moisture; delivered gross quantity; stocks/returns; reactions/retained/recovered/non-air fates; model/order/provider"
      collection_method: "Measure each actual physical raw/chemical stream independently; use its own calibration/density/T/P/assay and measured cut/reaction/retention. Purchased complete hardware’s embedded ingredients remain upstream once."
      unit: "actual native unit"
      frequency: "each lot/run/period"
      temporal_coverage: "declared period"
      site_scope: "same configuration/site"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibrated raw records and independent reconciliation"
    - protocol_id: cp_modules
      process_id: "assembly"
      flow_role: "completed hardware or retained supplied chemical/media"
      record_type: "supply drawing/order/BOM/acceptance ledger"
      raw_fields: "hardware completion/interface/order/provider/native quantity/installed stocks/returns; separately chemical/media formulation/assay/moisture/T/P/density/reacted/retained/returns"
      collection_method: "Hardware branch: weigh/count/measure actual completed receipts and configured installation, upstream ingredients once. Ingredient/media branch: its own actual physical native quantity, composition/state/assay/water/stocks/reactions/retention/returns; complete cartridge/cassette embeds consumable manufacture once, remaining content and tests reconcile without duplicate purchase. Whole hardware mass is not chemical content."
      unit: "actual native unit"
      frequency: "each lot/run/period"
      temporal_coverage: "declared period"
      site_scope: "same configuration/site"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibrated raw records and independent reconciliation"
    - protocol_id: cp_tests
      process_id: "test"
      flow_role: "actual factory trial media"
      record_type: "acceptance run/issue/return/reuse record"
      raw_fields: "test purpose/configuration/time; actual issued/reused/drained/returned/consumed; native quantity; own state/assay/media grade; rejects/rework"
      collection_method: "Measure attributable factory acceptance and failed/rework trials, distinct from customer operation and shipped retained supply; reusable battery energy services and fresh consumed cells must not double count. No source pages/minute, lifetime yield, six-cell requirement or historic developer operating recipe sets test quantity."
      unit: "actual native unit"
      frequency: "each lot/run/period"
      temporal_coverage: "declared period"
      site_scope: "same configuration/site"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibrated raw records and independent reconciliation"
    - protocol_id: cp_utilities
      process_id: "services"
      flow_role: "unassigned residual utilities"
      record_type: "import/generation/export/storage/meter ledger"
      raw_fields: "actual imported/generated/exported/storage delta; assigned process meters; residual driver; same-datum heat supply/return; voltage/provider/mix; water/air T/P/density"
      collection_method: "Reconcile actual imports and generation minus exports/storage/assigned meters; allocate remaining measured residual once. Actual water/air native state/normalization is declared. Heat supply and independently measured return use same datum and return is deducted once; purchased heat and locally generated fuel burden cannot overlap. Electricity kWh to MJ uses3.6, not invented efficiency."
      unit: "actual native unit"
      frequency: "each lot/run/period"
      temporal_coverage: "declared period"
      site_scope: "same configuration/site"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibrated raw records and independent reconciliation"
    - protocol_id: cp_dispatch
      process_id: "dispatch"
      flow_role: "actual packaging and accepted shipment"
      record_type: "packing/weigh/return/reuse ledger"
      raw_fields: "configured accepted unit; actual board/film/pallet count/net mass; shared pack/returns/reuse cycles"
      collection_method: "Measure actual packaging independently from equipment Dnet. Convert native counts/area with actual individual mass/gauge/area, allocate evidenced shared reusable packaging by actual use history; no one-pallet-per-machine assumption."
      unit: "actual native unit"
      frequency: "each lot/run/period"
      temporal_coverage: "declared period"
      site_scope: "same configuration/site"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibrated raw records and independent reconciliation"
    - protocol_id: cp_wastes
      process_id: "residues"
      flow_role: "actual outgoing waste"
      record_type: "transfer weigh/receiver/assay/stock record"
      raw_fields: "own outgoing gross/native amount/composition/moisture/hazard; receiver route; stocks/returns/capture/liquid fates; internal recycle"
      collection_method: "Measure transferred waste independently with own composition/water/native state/period stocks and actual receiver/transport/treatment; separate internal returns from outgoing waste and direct released species. Generic service/other-waste labels do not resolve specific toner/ribbon/cartridge/battery/solvent/wastewater identity."
      unit: "actual native unit"
      frequency: "each lot/run/period"
      temporal_coverage: "declared period"
      site_scope: "same configuration/site"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibrated raw records and independent reconciliation"
    - protocol_id: cp_air
      process_id: "residues"
      flow_role: "actual emitted species"
      record_type: "post-control sampling/flow/time/fugitive record"
      raw_fields: "actual species/valence/CAS/carbon origin/compartment; own concentration and matched flow/time/T/P/moisture; control capture/destruction; fugitive measurement; uncertainty"
      collection_method: "Post-control species concentration times matched exhaust flow and duration/state plus separately measured fugitives; captured/liquid/retained/destroyed material is not air. Select actual compartment/time horizon and non-overlapping particle sizes; oxide/salt gross mass differs from contained Cu/Sn, and NOx-as-NO2 differs from molecular NO2."
      unit: "actual native unit"
      frequency: "each lot/run/period"
      temporal_coverage: "declared period"
      site_scope: "same configuration/site"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibrated raw records and independent reconciliation"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_scope
      applies_to: "reference product"
      requirement: "Require full four-family actual non-ADP and independent-function review including real interface/options and supplied completion. Modern standalone mode, accessory listing or historic example cannot qualify every product."
      evidence: "model interface/function declarations, original manual/order and acceptance"
    - id: quality_qnd
      applies_to: "all inventory rows"
      requirement: "For one declared configuration/period Qattr includes attributable manufacture/assembly/trials/reject/rework. Naccepted counts accepted complete machines, Dnet sums their calibrated configured net masses. M=Dnet/Naccepted; q_item=Qattr/Naccepted; q_ref=Qattr/Dnet. Retain per-machine quantities and actual included accessories/media; catalogue400g excluding batteries/cassette,46lb historical empty/gross fields and customer pages are not interchangeable denominators."
      evidence: "calibrated same-configuration acceptance records"
    - id: quality_physical
      applies_to: "all inventory rows"
      requirement: "Every own physical stream has grade/form/assay/moisture/T/P/density/stocks/returns/reactions/retention. Whole solution/chemical/alloy/module mass differs from active ingredient/contained element. Each water stream uses its own water fraction/density/temperature and independent reaction/fill/evaporation/discharge/stocks, with paired internal returns. Battery Item(s) stays physical count, not assumed mass or charge energy."
      evidence: "own supplier assays, native meter/state and stock records"
    - id: quality_solvent
      applies_to: "ipa; wipa; ipair; ww"
      requirement: "IPA own assay/stock/returns/reaction/retained/recovered/captured/destroyed/spent-solvent/wastewater terms reconcile independently measured air; missing residual is not all evaporated. Ammonia solution own NH3 and water fractions reconcile residual developer/retained/discharge and independent NH3 air, no automatic25% assumption."
      evidence: "independently measured fate balances"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Match published100/type/full supplier/chemistry/CAS/completion/native reference internalID/property/group/unit/official bilingual identity. Reject forced ADP machines/parts or wrong-grade/formulation/phase/class/species/compartment proxies. Add every actual unlisted supplied material/ingredient/transport/retained/test/waste/emitted species as individually queried measured atomic rows. Gap differs from zero; not-applicable requires actual absence evidence."
      evidence: "fresh full direct/native review and physical supplier record"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual complete NEW accepted non-ADP equipment and full function/interface/options review. Internal fax scanning/marking or repeated label print alone is not independent copy/scan; actual independent two-function machines/PC-connectable printers are excluded."
    source_ids:
      - cpc
      - brother-h110
      - brother-manual
      - fax-study
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require accepted configured net machine mass, included/excluded retained supply list and same Qattr/Naccepted/Dnet basis; catalogue empty/gross weights and page/transmission yield cannot supply M or trial amounts."
    source_ids:
      - brother-manual
      - canon-pc150-page20
      - fax-study
  - rule_id: validate_makebuy
    applies_to: "foreground_dataset_conformance"
    rule: "Require exclusive bought complete module versus locally used ingredients, actual failed/rework tests and retained fill/media separated. Reject default toner/ribbon chemistry, battery count, media lifetime/operating recipes and PET-vs-PE tape inference."
    source_ids:
      - brother-manual
      - brother-tape
      - navy-blueprinter
  - rule_id: validate_balances
    applies_to: "foreground_dataset_conformance"
    rule: "Require own physical assays/water/T/P/density/stocks/returns/reaction and measured non-air fates; actual utility imports/generation/exports/storage/assigned meters/residual reconcile once, heat actual same-datum supply/return return once. Direct air uses actual post-control species concentration times matched flow/time/state plus independent fugitives, molecular species/valence/carbon origin and actual compartment/PM non-overlap. Report actual findings/performed/skipped checks and completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset; process; lifecyclemodel"
  allowed_use: "Actual qualified configured complete stand-alone equipment manufacture"
  excluded_use: "ADP/MFP/general part/media/repair/customer lifetime proxies or catalogue factory factors"
  required_metadata: "Reference qualifiers; actual function/interface/order/BOM/makebuy/acceptance; Qattr/Naccepted/Dnet/M; native units/assays/providers/receiver/allocation/gaps"
  required_quality_disclosure: "Measured/estimated/missing; calibration/sampling/uncertainty/fate balances; source date/partial archive limits and performed/skipped checks"
  update_trigger: "Function/connectivity/option/configuration/supplied media/chemical/provider/makebuy/site/period/acceptance/treatment change"
