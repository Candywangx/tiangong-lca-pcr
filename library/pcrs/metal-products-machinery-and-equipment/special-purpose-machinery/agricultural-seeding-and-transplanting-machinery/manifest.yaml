      reason: "Public candidates have conflicting Chinese identities or pipe-mill-specific supply routes; neither safely identifies this carbon-steel plate."
    - row_id: hollow_section
      selected_flow: "Rectangular carbon-steel hollow section"
      reason: "Returned tube or enclosure candidates do not establish the specified section, grade and supply route."
    - row_id: cutting_fluid
      selected_flow: "Mineral-oil cutting-fluid concentrate"
      reason: "Generic Cutting Fluid includes gas and several formulations; a mineral-oil concentrate identity is not confirmed."
    - row_id: solid_welding_wire
      selected_flow: "Carbon-steel solid welding wire"
      reason: "Direct-read Solid Wire is for building power transmission, not welding; generic steel wire does not confirm welding grade."
    - row_id: argon_shield
      selected_flow: "Argon shielding gas"
      reason: "Two searches returned unrelated pharmaceutical flows; no applicable public argon product identity verified."
    - row_id: co2_shield
      selected_flow: "Carbon dioxide shielding gas"
      reason: "Searches returned elementary CO2 flows; these cannot identify purchased industrial shielding gas."
    - row_id: welding_filter_dust
      selected_flow: "Captured carbon-steel welding filter dust"
      reason: "Returned filter-dust candidates do not establish carbon-steel welding residue composition."
    - row_id: liquid_paint
      selected_flow: "Formulated polyurethane topcoat base"
      reason: "Searches returned wood topcoat, filler, film or resin, not the specified formulated polyurethane coating base."
    - row_id: powder_waste
      selected_flow: "Discarded polyester coating powder"
      reason: "Public powder-waste rows are China-specific or have Aluminium content as reference property; a geographically unrestricted polyester-only mass identity remains unverified."
    - row_id: pretreatment_wastewater
      selected_flow: "Spent aqueous alkaline-degreasing rinse water"
      reason: "Direct-read candidate is specific to washing electrolytic manganese slag; fresh-water elementary flows cannot substitute for this waste stream."
    - row_id: opener_disc
      selected_flow: "Finished carbon-steel seed-furrow opener disc"
      reason: "No applicable finished agricultural opener-disc identity in searched candidates."
    - row_id: seed_meter
      selected_flow: "Finished seed-metering unit"
      reason: "No verified seed-metering component identity; agricultural input bundles are not substitutes."
    - row_id: seed_hopper
      selected_flow: "Finished HDPE seed hopper"
      reason: "Public HDPE candidates identify resin, not a finished hopper."
    - row_id: seed_tube
      selected_flow: "Finished polyurethane seed-delivery tube"
      reason: "Candidate hose may have a different route; no seed-delivery-grade applicability verified."
    - row_id: ball_bearing
      selected_flow: "Finished steel ball bearing"
      reason: "Public broad ball-or-roller category does not resolve the steel ball-bearing specification; retained as a concrete unresolved exchange."
    - row_id: steel_bolt
      selected_flow: "Finished steel hexagon bolt"
      reason: "Generic fastener candidates do not confirm the finished hexagon-bolt material and treatment."
    - row_id: hydraulic_cylinder
      selected_flow: "Finished hydraulic cylinder"
      reason: "Search returns cylinder parts and kits, not a verified complete agricultural hydraulic cylinder."
    - row_id: wiring_harness
      selected_flow: "Finished insulated copper wiring harness"
      reason: "Candidates do not establish the finished agricultural control-harness boundary."
    - row_id: controller
      selected_flow: "Finished planter electronic control unit"
      reason: "No verified planter-specific complete controller identity."
    - row_id: electric_drive
      selected_flow: "Finished electric seed-meter drive motor"
      reason: "Direct candidates are conveyor/washing-specific or China-specific unspecified machinery modules."
    - row_id: transplant_claw
      selected_flow: "Finished steel seedling-transplanting claw"
      reason: "No applicable finished seedling-transplanting claw candidate verified."
    - row_id: seedling_rack
      selected_flow: "Finished steel seedling-tray support rack"
      reason: "Search did not verify a finished seedling-tray support rack."
    - row_id: hydrostatic_drive
      selected_flow: "Finished hydrostatic transmission unit"
      reason: "Candidate does not verify the specified complete HST boundary."
    - row_id: test_no2
      selected_flow: "Nitrogen dioxide emitted to outdoor air, subcompartment unspecified"
      reason: "Repeated searches returned nitrogen, nitrite or product NOx; no species- and compartment-matching elementary NO2 identity directly verified."
    - row_id: spent_cutting_fluid
      selected_flow: "Spent mineral-oil cutting-fluid emulsion"
      reason: "Returned waste-oil and coolant flows do not verify this emulsion composition and treatment-transfer state."
    - row_id: polyisocyanate_hardener
