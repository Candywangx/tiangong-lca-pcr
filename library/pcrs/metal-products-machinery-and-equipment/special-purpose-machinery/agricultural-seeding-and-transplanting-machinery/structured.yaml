allocation_rules:
  - rule_id: allocation_direct
    applies_to: "manufacturing"
    rule: "Use directly metered or work-order-issued exchanges first. Under cp_allocation, partition remaining shared utility by measured causal driver: machining/welding machine operating time with measured power; coating loaded area with measured batch consumption; assembly/test station time with measured station demand. Document driver coverage and reconcile total allocated plus excluded demand to the original meter."
    source_ids: []
  - rule_id: allocation_variants
    applies_to: "product_mix"
    rule: "Do not allocate all production by machine count when variants have different energy demand or configurations. A fallback mass or economic basis needs documented foreground justification, sensitivity and review; it is not a default imposed by this PCR."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "steel_offcuts"
    rule: "Keep virgin/material inputs and separately measured scrap outputs without an automatic avoided-steel credit. Report scrap price and destination when relevant; any co-product classification or recycling credit requires a separately declared reviewed model to prevent double credit. Recovered powder recirculated internally is not a saleable co-product."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "finished_machine"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted configuration and sampled serial with traceable coverage"
      temporal_coverage: "same manufacturing period as activity records"
      site_scope: "accepted complete supply at one declared site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "scale calibration; empty hopper; retained fluid state; detachable-part weights; acceptance sign-off"
    - protocol_id: cp_fabrication
      process_id: "fabrication"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "part/grade; stock issues/returns; chips/offcuts; cutting-fluid mass; kWh; work orders"
      collection_method: "Weigh each stock/consumable and outgoing steel fraction separately; meter each operation; reconcile input stock, internal parts, retained material and waste."
      unit: "kg; MJ"
      frequency: "each batch/work order; each test; reconcile monthly"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same period as accepted counts"
      site_scope: "same site and configuration; include outsourced-work boundary explicitly"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock reconciliation; accepted count; excluded demand; missing-record disclosure"
    - protocol_id: cp_welding
      process_id: "welding"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "wire grade; spool issue/return; cylinder gas mass; kWh; filter dust; outdoor particulate analysis; operating time"
      collection_method: "Use welding work-order records, calibrated meters, gas-cylinder weights and actual emission sampling after controls. Preserve unknown particle size; retain filter waste records separately."
      unit: "kg; MJ"
      frequency: "each batch/work order; each test; reconcile monthly"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same period as accepted counts"
      site_scope: "same site and configuration; include outsourced-work boundary explicitly"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock reconciliation; accepted count; excluded demand; missing-record disclosure"
    - protocol_id: cp_coating
      process_id: "coating"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "formulation; concentration; fresh powder; reclaim return; topcoat base; hardener; mixing ratio; rinse water mass; MJ; gas m3 and conditions; liquid-waste mass; fossil carbon analysis"
      collection_method: "Record separate chemical batches and consumption, fresh water, oven electricity/fuel, waste removal and actual monitored emissions. Reclaim loops are internal; reconcile coating retained on parts, losses and stock."
      unit: "kg; m3; MJ"
      frequency: "each batch/work order; each test; reconcile monthly"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same period as accepted counts"
      site_scope: "same site and configuration; include outsourced-work boundary explicitly"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock reconciliation; accepted count; excluded demand; missing-record disclosure"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "BOM part number; supplier boundary; installed count; each part net mass; installed fluid volume/density; returned parts; kWh; configuration"
      collection_method: "Use configuration-controlled BOM and issued/returned purchased part records. Weigh each relevant component type; preserve Item(s) for engines and tyres and m3 for hydraulic fluid; retain electrical and hydraulic acceptance requirements."
      unit: "kg; m3; Item(s); MJ"
      frequency: "each batch/work order; each test; reconcile monthly"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same period as accepted counts"
      site_scope: "same site and configuration; include outsourced-work boundary explicitly"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock reconciliation; accepted count; excluded demand; missing-record disclosure"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "serial/configuration; drawing revision; test method/duration; pass/fail; rework; MJ; diesel kg; fuel fossil carbon; separately measured NO2 kg; M"
      collection_method: "Retain signed acceptance records for metering/transplanting mechanism, folding/hydraulics and installed controls as applicable; meter bench energy and fuel, record actual exhaust species and rework. Separate field demonstration from factory acceptance."
      unit: "kg; MJ"
      frequency: "each batch/work order; each test; reconcile monthly"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same period as accepted counts"
      site_scope: "same site and configuration; include outsourced-work boundary explicitly"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock reconciliation; accepted count; excluded demand; missing-record disclosure"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "polyethylene film mass; corrugated board grade/fiber/recycled content; issues/returns; serial shipment"
      collection_method: "Weigh each actually used packaging component separately, reconcile returns and dispatched configuration, and exclude packaging mass from M. Additional wood/steel protectors need their own individual rows."
      unit: "kg"
      frequency: "each batch/work order; each test; reconcile monthly"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same period as accepted counts"
      site_scope: "same site and configuration; include outsourced-work boundary explicitly"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock reconciliation; accepted count; excluded demand; missing-record disclosure"
    - protocol_id: cp_allocation
      process_id: "manufacturing"
      flow_role: "shared_demand"
      record_type: "measurement"
      raw_fields: "total utility; measured power/load; operating time; coated area; accepted configuration counts; excluded demand"
      collection_method: "Submeter where possible; measure load and causal drivers for shared machines/ovens/stations and document why the driver represents each shared exchange."
      unit: "MJ; h; m2"
      frequency: "each shared batch and monthly reconciliation"
      temporal_coverage: "same production interval"
      site_scope: "all consuming products and excluded operations at this site"
      aggregation_rule: "partition total by measured causal demand; then aggregate attributable amount / accepted machines"
      quality_evidence: "submeter agreement; total closure; driver uncertainty; sensitivity; approval record"
  calculation_rules:
    - id: normalize_mass
      applies_to: "carbon_plate; hollow_section; cutting_fluid; fabrication_power; steel_offcuts; selfshielded_wire; solid_welding_wire; argon_shield; co2_shield; welding_power; welding_filter_dust; welding_pm_air; powder_paint; liquid_paint; caustic_30; wash_water; coating_power; curing_gas; powder_waste; pretreatment_wastewater; curing_co2; opener_disc; seed_meter; seed_hopper; seed_tube; ball_bearing; steel_bolt; tyre; hydraulic_hose; hydraulic_cylinder; hydraulic_fluid; wiring_harness; controller; electric_drive; diesel_engine; transplant_claw; seedling_rack; hydrostatic_drive; assembly_power; test_power; test_diesel; test_co2; test_no2; pe_film; corrugated_board; dilution_water; spent_cutting_fluid; polyisocyanate_hardener; purchased_main_frame; purchased_row_frame"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all_flows"
      requirement: "Match actual part/material grade, supplied state, concentration, geography, reference property and units. A UUID is identity only, not amount evidence or a provider dataset. Resolve blanks before treating an exchange as fully linked."
      evidence: "supplier sheet; flow/property/unit records; identity review"
    - id: quality_completeness
      applies_to: "complete_machine"
      requirement: "Reconcile all configured BOM components, fluids and detachable items to M; inventory actual utilities, chemicals, each waste and emission. Measure missing parts rather than infer them as the residual of M. Report coverage and any unlinked provider."
      evidence: "BOM revision; weigh sheets; material balances; missing-data register"
    - id: quality_period
      applies_to: "production_records"
      requirement: "Use one declared factory and complete representative period; record model changes, seasonality, idle demand, outsourcing and rework; quantify primary coverage and uncertainty. Historic product cases cannot substitute for current production records."
      evidence: "work orders; acceptance ledger; meter calibration; source limits"
    - id: quality_test
      applies_to: "acceptance"
      requirement: "Use actual released acceptance criteria for seed-meter rotation/singulation or seedling-placement mechanism, drives, hydraulic circuits and electronics as installed; no arbitrary field performance or durability threshold."
      evidence: "signed test plan and serial/configuration-linked test results"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_machine"
    rule: "Require 1 kg reference output, measured M from cp_mass, complete configuration, empty crop hoppers, packaging exclusion and identical retained fluid state. Missing acceptance/mass evidence prevents a complete dataset claim."
    source_ids: []
  - rule_id: validation_normalization
    applies_to: "inventory"
    rule: "Every applicable non-reference row uses normalize_mass and a declared protocol; check q_item and M share configuration/period, correct division direction and preserved energy/volume/item numerator units."
    source_ids: []
  - rule_id: validation_route
    applies_to: "processes"
    rule: "Match make-or-buy, welding method and coating route to work orders. No double counting of steel and finished fabricated parts, purchased assemblies and their included parts, internal reclaim or tyre/engine count and mass."
    source_ids:
      - greatplains-corporate-1602e
  - rule_id: validation_species
    applies_to: "elementary_flows"
    rule: "Check fossil/biogenic carbon, NO2 versus NO/NOx/N2O, particle size, outdoor air subcompartment and control boundary. Unknown species or media remain gaps; wastewater treatment transfer is not a freshwater emission."
    source_ids: []
  - rule_id: validation_coverage
    applies_to: "dataset"
    rule: "Disclose measured, calculated, estimated, excluded, not-applicable and missing quantities distinctly; reconcile accepted outputs, scrap, stock and allocation closure. A method check or valid projection does not approve scientific methodology or establish cradle-to-gate completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_manufacturing_module"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "A documented manufacturing module for the exact configured machine and period; upstream-connected assessment only after supplier/transport/treatment coverage is established."
  excluded_use: "Per-hectare planting service, crop yield comparison, lifespan-normalized claims, generic equivalence between seeders and transplanters, and unsupported complete cradle-to-gate claims."
  required_metadata: "PCR id; model/configuration/BOM and serial scope; measured M and fluid state; acceptance standard; site/period; make-or-buy and process route; reference basis; providers and transport; packaging; allocation; data sources; version."
  required_quality_disclosure: "Measured coverage, missing identities/providers and quantities, route exclusions, source age/limits, conversion conditions, allocation evidence, emissions monitoring gaps, uncertainty and independent review status."
  update_trigger: "BOM or configuration change; revised acceptance test; changed supplier/process/coating or energy supply; new representative production period; resolved identity or evidence gap."
data_sources:
  - id: "greatplains-corporate-1602e"
    type: "handbook"
    reference: "Great Plains Manufacturing, corporate brochure 1602E-CORP, undated edition containing 2017 events, PDF p.11 (unnumbered Salina manufacturing page). https://cdn-assets.greatplainsmfg.com/ag_files/1602e-corp-corporate-brochure-web.pdf"
    used_for: "Historical planter manufacturing example: fabrication, lasers/plasma, welding, CNC, coating and assembly. No facility count, yield, current route, mass or consumption requirement is adopted."
  - id: "kubota-transplanter-2020"
    type: "literature"
    reference: "Kubota Technical Report No.53, January 2020, Development of Diesel Rice Transplanter NW6S/8S for Domestic Market, printed/PDF pp.21–28; p.24 §4.1.1 and Figs.3–5. https://www.kubota.com/innovation/report/no53/data/tech_report_no53_en.pdf"
    used_for: "Model-specific frame, resin-part and drivetrain changes show why BOM/configuration and actual mass must be retained. No historical weight savings, lifetime, field performance or fertilizer savings are transferred to the manufacturing reference."
