      inputs:
        - cp_fabrication
        - cp_surface
        - cp_assembly
        - cp_test_pack
        - cp_shared
      output: "actual species closure"
      source_ids: []
    - id: solvent_closure
      applies_to: "actual solvent records"
      rule: "Reconcile paint-embedded and added solvent, product retention, recovery, capture media, stock change, actual destruction and non-air residual separately; capture is not destruction and unexplained residual cannot be assigned to air. Species air release requires measurement or applicable evidence; fuel carbon closure cannot replace CO or NOx species measurement."
