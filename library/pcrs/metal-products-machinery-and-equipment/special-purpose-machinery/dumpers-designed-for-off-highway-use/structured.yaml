    - id: utility_closure
      applies_to: "site utility records"
      rule: "Same-period/unit imports plus actual on-site output minus exports and storage change equal assigned fabrication, treatment, assembly, test/dispatch demand plus unassigned residual and actual conversion losses. Shared rows allocate residual only. Investigate negative residual against periods, units, meter calibration and actual combined measurement/sampling/allocation uncertainty without clipping; paired internal transfers cancel and generation is not also purchased."
