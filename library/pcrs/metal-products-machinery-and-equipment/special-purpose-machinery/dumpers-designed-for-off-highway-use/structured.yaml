validation_rules:
  - rule_id: validate_configuration
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm rigid/articulated/compact dumper principal function, shipped body and propulsion; road freight or water service does not match merely through chassis."
    source_ids:
      - volvo-a40-2025
      - wacker-dw15e
      - cat-777f
  - rule_id: validate_measurement
    applies_to: "foreground_dataset_conformance"
    rule: "For same configuration/period Q includes reject/rework burden, N accepted units, D summed calibrated accepted net mass, M = D/N, q_item = Q/N and q_ref = Q/D; exclude packaging, payload and rejected mass."
    source_ids: []
  - rule_id: validate_utility
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile same-period/unit imports, actual generation, exports/storage changes with assigned demand, residual and actual losses; no additive site-meter double count. Investigate negative residual against calibration/sampling/allocation uncertainty without clipping. Test charging reconciles imports, recovery/exports and storage changes."
    source_ids: []
  - rule_id: validate_water_species
    applies_to: "foreground_dataset_conformance"
    rule: "Each physical/species balance term uses its own moisture/assay and wet/dry basis for input, product, scrap, sludge, wastewater, releases, stocks and reactions; paired returns cancel. Explain closure against actual combined uncertainty; gross mass is not contained element and no universal tolerance applies."
    source_ids: []
  - rule_id: validate_solvent
    applies_to: "foreground_dataset_conformance"
    rule: "Distinguish solvent retention, recovery, capture media, stocks, actual destruction and non-air residual; capture is not destruction and residual is not air release. Carbon closure cannot determine CO/NOx; require species test or applicable evidence."
