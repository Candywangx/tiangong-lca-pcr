  - rule_id: validate_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Adopt UUID only after direct type, official bilingual name, reference property/unit, state and supply/geography interface match; avoid module/embedded-input duplication. Disclose missing UUID, formulation, factory or range evidence rather than zero; review publication after actual foreground completion."
