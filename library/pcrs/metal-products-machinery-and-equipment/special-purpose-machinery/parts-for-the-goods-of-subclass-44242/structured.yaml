    - rule_id: factory_use
      applies_to: "production"
      rule: "Include actual factory part pressure/leak/function and documented joining or flame/quench trials, actual test materials, cleaning water, electricity and consumed lubricant. Recovered trial materials uses measured returns and stocks. Customer joined or surface-treated workpieces and downstream plant operation are not dedicated part manufacturing output."
