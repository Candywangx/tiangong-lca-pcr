      rule: "For each component choose its actual make/buy state: complete bought dedicated mixer/flame head/quench or motion subassembly/motor/controller includes embedded inputs once; own fabrication uses actual feedstocks and operations instead. Charge only subsequent site work. Pair internal transfers; do not list site-made intermediates as purchased imports."
