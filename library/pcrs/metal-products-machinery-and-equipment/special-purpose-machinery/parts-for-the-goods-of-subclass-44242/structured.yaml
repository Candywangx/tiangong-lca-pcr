      applies_to: "route"
      rule: "Cards are specific conditional anchors, not universal recipes. Audit actual BOM, formulations, test media, packaging, fuels, waste and species. Add each missing atomic actual exchange; document not_applicable only with absence evidence, unknown differs from zero. Unknown gas-path/quench-head joining or treatment formulation requires actual supplied-state evidence."
