    - rule_id: factory_use
      applies_to: "production"
      rule: "Include actual factory dimensional/material/hardness/motion and actually applicable safety acceptance and documented manufacturing qualification trials, actual test media, cleaning water, electricity and consumed lubricant. Recovered trial materials uses measured returns and stocks. Customer pulp, paper or paperboard and downstream plant operation are not dedicated part manufacturing output."
      source_ids: []
    - rule_id: bom_extension
      applies_to: "route"
      rule: "Cards are specific conditional anchors, not universal recipes. Audit actual BOM, formulations, test media, packaging, fuels, waste and species. Add each missing atomic actual exchange; document not_applicable only with absence evidence, unknown differs from zero. Unknown actual alloy, heat-treatment medium, coating, adhesive or trial-media formulation requires actual supplied-state evidence."
      source_ids: []
    - rule_id: upstream
      applies_to: "links"
      rule: "Link supplier production and transport at actual grade, state, delivery geography/voltage and period; external treatment after measured waste transfer is distinct from site emissions. Without completed providers this factory package is not a complete cradle-to-gate result."
      source_ids: []
