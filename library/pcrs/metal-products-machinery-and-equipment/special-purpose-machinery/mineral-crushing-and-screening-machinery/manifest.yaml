    code: "44440"
    title: Machinery for sorting, screening, separating, washing, crushing,
      grinding, mixing or kneading earth, stone, ores or other mineral
      substances, in solid form; machinery for agglomerating, shaping or
      moulding solid mineral fuels, ceramic paste, unhardened cements,
