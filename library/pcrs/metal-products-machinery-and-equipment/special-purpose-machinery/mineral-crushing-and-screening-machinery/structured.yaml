allocation_rules:
  - rule_id: allocation_direct
    applies_to: "manufacturing"
    rule: "Prefer direct work-order issues and submeters. Partition shared machine/crane/extraction/coating/bench demand under cp_allocation using measured load and time or measured batch-specific demand; validate causal driver for each exchange and reconcile allocated plus excluded demand to original total. No fixed percentage or universal mass allocation prescribed."
    source_ids: []
  - rule_id: allocation_variants
    applies_to: "product_mix"
    rule: "Keep jaw and screen configurations separate. Do not allocate all shared burdens by machine count when mass, fabrication or test demand differs. A fallback mass/economic basis needs measured justification, uncertainty and sensitivity; review before reuse."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "waste_and_test_media"
    rule: "Retain stock input and actual waste output without automatic avoided-metal/mineral credits. Internal reused stock/test stone remains internal. If test mineral output is genuinely sold as product, disclose independent output quality/quantity and justified co-product method instead of relabelling all residue waste."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "finished_machine"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted serial/configuration"
      temporal_coverage: "same manufacturing period"
      site_scope: "same manufacturer and fitted supply boundary"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration; BOM; fluid fill; component closure; signed release"
    - protocol_id: cp_fabrication
      process_id: "fabrication"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "steel grade/thickness; casting supplied condition; issues/returns; work orders; kWh; chips/dust; measured post-control particle mass"
      collection_method: "Weigh actual issues, valid stock returns and separately handled chip/dust streams; meter machine/extraction demand and monitor emitted mass with documented period, controls and size coverage."
      unit: "kg; MJ"
      frequency: "each batch/work order/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same as accepted counts"
      site_scope: "same site/configuration; outsourcing declared"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock/accepted-count closure; missing records"
    - protocol_id: cp_welding
      process_id: "welding"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "WPS/joint map; wire alloy/form; shielding gas composition; cylinder issue/return mass; kWh; rejects/rework; fume capture/monitoring"
      collection_method: "Confirm actual welded versus bolted site route; weigh consumables and returned gas and meter actual welding/extraction; add individual fume and residue rows from actual monitoring."
      unit: "kg; MJ"
      frequency: "each batch/work order/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same as accepted counts"
      site_scope: "same site/configuration; outsourcing declared"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock/accepted-count closure; missing records"
    - protocol_id: cp_coating
      process_id: "coating"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "primer components/solids/solvent purity; water mass or temperature/density/volume; issues/returns; retained coating; kWh; recovery; residue/effluent; xylene emitted mass"
      collection_method: "Retain supplier formulation and actual recipe; measure stock/returns, film retention, capture and waste; meter utilities. Species-specific monitoring or closed xylene balance must subtract documented recovery/retained/waste, without universal evaporated fraction or treating all VOC as xylene."
      unit: "kg; MJ"
      frequency: "each batch/work order/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same as accepted counts"
      site_scope: "same site/configuration; outsourcing declared"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock/accepted-count closure; missing records"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "BOM/supplier; supplied included-part boundaries; each part mass/type; motor/frame route; separate grease and fluid volume/temperature; retained fill mass; kWh; serial"
      collection_method: "Use traceable receipts/issues/returns and weigh each physical supplied part; measure oil volume and retained mass separately, reconcile included bearings and lubricant and meter fitting/connection demand."
      unit: "kg; MJ; m3"
      frequency: "each batch/work order/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same as accepted counts"
      site_scope: "same site/configuration; outsourcing declared"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock/accepted-count closure; missing records"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
