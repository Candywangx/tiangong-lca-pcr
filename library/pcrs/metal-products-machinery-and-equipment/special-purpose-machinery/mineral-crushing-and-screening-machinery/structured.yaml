    - id: normalize_mass
      applies_to: "steel_plate; frame_casting; fabrication_power; steel_offcuts; captured_dust; machining_pm; welding_wire; shield_argon; welding_power; wash_water; epoxy_primer; xylene_thinner; coating_power; wash_effluent; paint_residue; xylene_air; frame_finished; eccentric_shaft; pitman; jaw_plate; toggle_plate; flywheel; screen_mesh; exciter; bearing; motor; spring; belt; steel_bolt; guard; control; hydraulic_unit; hydraulic_oil; grease; assembly_power; test_power; test_stone; test_stone_waste; film; timber"
