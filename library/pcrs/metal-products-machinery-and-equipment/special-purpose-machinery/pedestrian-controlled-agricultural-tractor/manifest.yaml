review_metadata:
  semantic_boundary_decision: New semantic candidate for complete
    pedestrian-controlled agricultural traction power units, excluding
    detachable implements. Existing material mower PCR is defined by cutting
    output; industrial platform tractors are works trucks. No material
    agricultural walking-tractor PCR found. Old pedestrian-controlled-tractors
    scaffold remains read-only; no legacy identity promotion or accepted
    mapping.
  scientific_review: pending independent methodology review
  unresolved:
    inventory_flow_uuids:
      - row_id: steel_sheet
        reason_code: identity_not_established
        explanation: Candidate ce3ac926 has non-alloy name/classification but an
          alloy-steel comment; no consistent identity adopted.
      - row_id: round_steel_tube
        reason_code: identity_not_established
        explanation: Inspected searches mix non-circular sections, generic pipes and
          inconsistent bilingual identities; no verified circular welded
          handlebar-stock identity.
      - row_id: welding_wire
        reason_code: identity_not_established
        explanation: English and Chinese queries return generic steel wire, flux-cored
          wire, welding services or electrical wire; no compatible solid steel
          welding-consumable identity.
      - row_id: grinding_dust
        reason_code: identity_not_established
        explanation: No compatible collected steel grinding-dust Waste flow established;
          airborne particulate cannot substitute.
      - row_id: sodium_carbonate
        reason_code: identity_not_established
        explanation: Generic candidates are hydrometallurgical-route flows; 2099dae8 is
          95% natural-alkali product with organic-acid classification and
          unspecified hydration. Compatibility with anhydrous cleaning reagent
          is unresolved.
      - row_id: powder_waste
        reason_code: identity_not_established
        explanation: 363302a6 actual reference property is Aluminium content, not Mass;
          9aa53a82 is CN-specific, unsuitable for unspecified factory geography.
      - row_id: cleaning_wastewater
        reason_code: identity_not_established
        explanation: Search wastewater candidates describe direct discharge to water or
          incompatible treatment/industrial route; no compatible
          external-treatment Waste flow established.
      - row_id: petrol_engine
        reason_code: identity_not_established
        explanation: 139afa12 is mass-based but its direct comment restricts the input
          to mower assembly; aircraft engines and machined engine parts do not
          match.
      - row_id: diesel_engine
        reason_code: identity_not_established
        explanation: d3ac8612 actual reference property UUID01846770 is not Mass; no
          verified mass-reference finished small diesel engine identity.
      - row_id: transmission
        reason_code: identity_not_established
        explanation: Queries return wind-turbine gearboxes or pooled tractor
          subassemblies, not the declared mechanical transmission assembly.
      - row_id: dry_clutch
        reason_code: identity_not_established
        explanation: No compatible public complete dry agricultural clutch identity;
          generic asbestos textile and shaft candidates are not the assembly.
      - row_id: wet_clutch
        reason_code: identity_not_established
        explanation: No matching public complete oil-bath hydraulic-clutch identity
          established.
      - row_id: handlebar
        reason_code: identity_not_established
        explanation: No matching finished tractor handlebar identity in English/Chinese
          searches.
      - row_id: throttle_cable
        reason_code: identity_not_established
        explanation: Search did not establish the specified mechanical control-cable
          assembly; generic electrical cable cannot substitute.
      - row_id: agricultural_tyre
        reason_code: identity_not_established
        explanation: Candidate tyres are motorcycle/bicycle, car or retreaded tyres;
          tractor traction compatibility is not established.
      - row_id: steel_rim
        reason_code: identity_not_established
        explanation: c111cb85 explicitly describes trailer rims; no verified tractor
          traction-wheel rim identity.
      - row_id: steel_bolt
        reason_code: identity_not_established
        explanation: Generic screw/fastener candidates do not verify hexagonal-head bolt
          grade and coating.
      - row_id: engine_oil
        reason_code: identity_not_established
        explanation: Candidates include PAO synthetic oil, furfural-refined base stock,
          or ambiguous viscosity above5W30; no compatible finished mineral-base
          engine-oil identity.
      - row_id: gear_oil
        reason_code: identity_not_established
        explanation: English and Chinese gear-oil searches returned waste oils, fuels or
          generic/synthetic lubricant, not a verified finished gear-oil
          formulation.
      - row_id: starter_battery
        reason_code: identity_not_established
        explanation: f854fcea reference property is energy, not mass, and comment
          describes grid BESS; other industrial batteries have incompatible
          application/completeness.
      - row_id: test_no2
        reason_code: identity_not_established
        explanation: English air, Chinese and plain nitrogen-dioxide searches return
          product NOx, nitrogen, urea or nitrite; no verified individual NO2
          Elementary flow to unspecified air.
      - row_id: spent_engine_oil
        reason_code: identity_not_established
        explanation: Candidate2a68e97a is limited to metal machining/maintenance waste;
          factory acceptance-run drained engine oil scope not established.
    evidence_needs:
      - Manufacturer design examples are not quantitative factory observations.
        All actual quantities, M, route, make-or-buy, acceptance and physical
        allocation require foreground records; no machine mass, lifetime,
        density, emission factor or category-wide range invented.
      - Resolve all actual BOM items, upstream/transport/treatment links and
        measurement gaps before a complete dataset claim. Historical Action
        design evidence does not establish current manufacturing practice.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
