allocation_rules:
  - rule_id: allocation_direct
    applies_to: "shared_operations"
    rule: "First subdivide by work order, stage and configuration. Assign actual stock issues, purchased components, test fuel and measured releases to their own model before allocating shared services."
    source_ids: []
  - rule_id: allocation_physical
    applies_to: "shared_energy_and_support"
    rule: "Use measured driver relationships: machine electricity profiles times actual machine hours, curing-load energy, test-bench metering and test time, or weighed stock throughput where causal. Collect driver totals and reconcile allocated sums to meters; do not allocate different engine/clutch configurations equally by count or by catalogue mass. If no physical relationship is established, disclose unresolved allocation and sensitivity; no universal economic split is imposed."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "waste_rework"
    rule: "Include attributable failed tests, rework and rejects in the accepted output denominator for the same configuration and period. Exports of scrap and spent oil are explicit waste at the receiver gate; no automatic avoided-production credit. Record actual receiver route and any co-product decision separately with evidence."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "assembly"
      flow_role: "finished_machine"
      record_type: "calibrated weighing and acceptance"
      raw_fields: "model; configuration; serial number; accepted net mass M; fluid state; excluded implements and packaging"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each unit or justified configuration-specific representative sample"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site only"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration; build list; acceptance; sample coverage"
    - protocol_id: cp_configuration
      process_id: "all_processes"
      flow_role: "actual route"
      record_type: "BOM and work-order review"
      raw_fields: "model; BOM revision; supplier part completeness; operation ledger; reject/rework; accepted count; outsourced gates"
      collection_method: "Crosswalk every actual part and operation to inventory or justified exclusion. Distinguish purchased complete assemblies from site manufacture and document engine/clutch/wheel alternatives separately."
      unit: "record"
      frequency: "each configuration change and production batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site only"
      aggregation_rule: "one coherent configuration record"
      quality_evidence: "signed BOM; routing; purchase specifications; gate evidence"
    - protocol_id: cp_material
      process_id: "fabrication_finishing_assembly_packout"
      flow_role: "stock; formulation; liquid; packaging"
      record_type: "stock ledger and weighing"
      raw_fields: "individual material; grade/formulation; issue; return; stock change; liquid volume/density/temperature; accepted count"
      collection_method: "Weigh each net material issue, reconcile inventory changes, recovered material and WIP; retain batch density if volume is converted to mass. Record lubricant first fills separately from supplier-prefilled components."
      unit: "kg"
      frequency: "each issue and batch reconciliation"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site only"
      aggregation_rule: "attributable net material mass / accepted machines of the same configuration"
      quality_evidence: "scales; issue ledger; SDS; supplier density; recipe"
    - protocol_id: cp_parts
      process_id: "assembly"
      flow_role: "purchased component"
      record_type: "component receipt and build record"
      raw_fields: "individual part number; supplier; design; count; measured mass; included fluids/subparts; installed count; accepted count"
      collection_method: "Use actual delivered component mass or lot-specific verified count-to-mass records; disclose uncertainty and avoid duplicating included components. No generic per-engine or per-wheel mass."
      unit: "kg"
      frequency: "each supplier lot and batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site only"
      aggregation_rule: "attributable installed component mass / accepted machines of the same configuration"
      quality_evidence: "calibrated scale; lot mass; supplier completeness; build list"
    - protocol_id: cp_energy
      process_id: "fabrication_finishing_assembly_factory_test"
      flow_role: "electricity"
      record_type: "meter and driver ledger"
      raw_fields: "stage; supply voltage/source; meter kWh; interval; driver; shared total; accepted count"
      collection_method: "Meter stages and distinguish test rig from engine fuel. Convert kWh to MJ with1kWh=3.6MJ. Retain measured allocation driver, idle/rework inclusion and reconcile totals."
      unit: "MJ"
      frequency: "each meter interval and batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site only"
      aggregation_rule: "attributable electrical energy / accepted machines of the same configuration"
      quality_evidence: "meter calibration; bills; driver logs"
    - protocol_id: cp_fuel
      process_id: "factory_test"
      flow_role: "individual test fuel"
      record_type: "fuel balance and test record"
      raw_fields: "engine configuration; fuel grade; fossil/biogenic attribution; issued mass; returned/residual mass; test duration/load; accepted count"
      collection_method: "Weigh actual fuel consumed by each corresponding acceptance test. Retain initial/final tank content and returns; convert volume only using evidenced density and temperature. Separate delivered residual fuel and supplier test fuel."
      unit: "kg"
      frequency: "each powered run and fuel balance"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site only"
      aggregation_rule: "attributable test fuel mass / accepted machines of the same configuration"
      quality_evidence: "scale; test logs; supplier grade and source; density"
    - protocol_id: cp_waste
      process_id: "fabrication_finishing_factory_test"
      flow_role: "individual waste"
      record_type: "weighbridge or container balance"
      raw_fields: "individual waste; composition; contamination; mass; internal recovery; receiver; treatment gate; accepted count"
      collection_method: "Weigh segregated actual exports, reconcile recovery and stock changes, retain receiver records and avoid mixing captured dust with air releases or wastewater with tap water."
      unit: "kg"
      frequency: "each shipment and batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site only"
      aggregation_rule: "attributable exported waste mass / accepted machines of the same configuration"
      quality_evidence: "scale; receiver receipt; composition; waste classification"
    - protocol_id: cp_emission
      process_id: "fabrication_factory_test"
      flow_role: "individual air substance"
      record_type: "outlet monitoring and calculation"
      raw_fields: "individual substance; concentration/unit; gas volume/flow; time; temperature/pressure; moisture basis; controls; particle fraction; medium; carbon origin; accepted count"
      collection_method: "Determine individual substance mass from same-interval post-control concentration and measured exhaust volume, retaining unit conversion, moisture/temperature basis and sampling coverage. Species-specific measurement is required for NO and NO2; no universal emission factor or zero for missing monitoring."
      unit: "kg"
      frequency: "representative actual operating intervals"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site only"
      aggregation_rule: "attributable measured substance mass / accepted machines of the same configuration"
      quality_evidence: "sampling report; calibration; speciation; origin evidence; unit calculation"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
