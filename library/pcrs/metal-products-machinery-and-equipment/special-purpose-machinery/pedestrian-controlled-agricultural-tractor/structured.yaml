system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "factory_gate"
      rule: "Include receipt checks, all performed stock cutting/forming/drilling/welding/machining, applicable finishing, assembly, adjustments, acceptance, attributable rework and dispatch protection. Hydraulics, heat treatment and foundry operations are included only if actually performed; no on-site casting is presumed from a purchased housing."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "actual_configuration"
      rule: "Crosswalk every actual BOM and operation to one atomic exchange or documented exclusion. Add actual housing blanks, gears, shafts, brakes, belts, seals, grips, nuts, washers, hoses, clutch oil, cutting-fluid formulation, shielding gas, treatment residues and measured emissions separately. These starting cards are not a universal complete BOM. Hydrostatic or belt transmissions require their actual components and operations."
      source_ids: []
    - rule_id: boundary_test
      applies_to: "factory_test"
      rule: "Factory powered-run fuel and measured releases are inside the gate; later farm fuel and crop production are outside. Supplier engine tests remain upstream unless repeated at this factory. Record test-fuel consumption separately from any fuel retained for delivery."
      source_ids: []
    - rule_id: boundary_implements
      applies_to: "reference_product"
      rule: "The traction unit is separate from detachable implements. Do not normalize a bundled tiller/mower by the power-unit M or use a mower PCR for this tractor. Reconcile combined sale mass to separately measured products and packaging."
      source_ids:
        - bcs-powersafe
        - bcs-action-historical
