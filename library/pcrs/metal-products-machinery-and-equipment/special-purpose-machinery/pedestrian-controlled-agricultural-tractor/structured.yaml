  what: "Manufacture one specified pedestrian-controlled agricultural traction power unit; no field-service amount is supplied"
  how_much: "1 kg share of accepted net complete unit; actual machine scaling uses measured M"
  how_well: "Pass the declared configuration-specific factory acceptance for propulsion, direction/PTO controls, handlebar adjustment, clutch, braking and installed protective/safety devices; functions only where fitted"
