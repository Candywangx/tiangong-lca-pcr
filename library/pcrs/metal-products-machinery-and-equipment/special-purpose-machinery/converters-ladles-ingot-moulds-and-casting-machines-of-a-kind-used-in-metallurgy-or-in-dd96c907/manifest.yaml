  reference_flow_identity:
    status: unresolved
    unresolved_support_fields:
      - reference_product_flow_uuid
  unresolved_reference_flow_uuid: No direct-read flow establishes the full five-family configured equipment reference; retained Mass and kg support does not resolve product identity.
  unresolved_inventory_uuids: All concrete conditional input, waste and elementary exchange UUIDs remain unresolved pending exact grade, state, type, compartment and provider interface verification. No material UUID substitutes for equipment output.
  unresolved_provider_links: Actual supplier technology, geography, processing/lining/coating/fill state and delivered supply interface require order-specific datasets.
  unresolved_route_recipe_evidence: Actual alloys, sand/core binders, refractory recipes, painting and NiB/chromium/HVOF chemistry, factory test media and all actual alternatives need factory/SDS/order evidence. Named cards are conditional specific examples, not default recipes.
  unresolved_quantitative_ranges: No empirical mass, recipe, yield, energy, emissions, temperature, lifetime or GWP range/factor adopted. Factory measurement and combined uncertainty are required.
  unresolved_source_access: SMS original manufacturing/mill and ANSSEN mould pages returned forbidden; MAMPL returned not acceptable; old Primetals PDF URLs returned HTML instead of PDFs and are not relied on. Current original Primetals HTML supplies converter/mill/copper architecture. Historical ingot chapter edition/date remains unestablished and supplies only cast-iron steel-ingot example.
  identity_rejections:
    - Hot rolled strip candidate has hot-rolling labels but cold-rolling/pickling comment; ambiguous input state and not an equipment reference.
    - Steel Sheet candidate official Chinese baseName is 银板材 while English says steel; bilingual contradiction, not adopted.
    - Steel/rebar/billet/mill-scale/tea matches cannot represent a complete converter, ladle, ingot mould, casting machine or rolling mill.
    - Source-specific incineration or biomass electricity cannot replace factory purchased supply.
  methodology_review:
    state: pending_independent_review
