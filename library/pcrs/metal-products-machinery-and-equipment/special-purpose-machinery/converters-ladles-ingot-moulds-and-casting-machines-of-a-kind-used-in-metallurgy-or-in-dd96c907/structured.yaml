allocation_rules:
  - rule_id: subdivide
    applies_to: "shared processes"
    rule: "First trace order/serial/lot and subdivide material issues and process meters."
    source_ids:
      - ef-allocation-2021
  - rule_id: causal_residual
    applies_to: "unassigned shared burdens"
    rule: "Allocate only remaining burden using measured causal machine-time/load, weld-time, treated area or furnace load as appropriate. Document denominator and uncertainty; do not default all utilities to equipment mass. Other relationship needs justified sensitivity."
    source_ids:
      - ef-allocation-2021
  - rule_id: scrap_returns
    applies_to: "scrap and internal returns"
    rule: "Pair and cancel internal transfers at aggregate boundary; retain rework energy and losses. External scrap/recovered solvent remains named output with actual receiving route; no automatic avoided-primary-material credit."
    source_ids: []
  - rule_id: services_once
    applies_to: "utilities"
    rule: "Reconcile site-period purchased imports + actual on-site generation + opening energy storage = assigned fabrication/foundry/heat/machining/lining/surface/assembly/dispatch use + remaining shared-services use + exports + closing storage + documented distribution losses. Services carries only the measured unassigned residual and measured causal allocation; same intervals/units, no whole-site total added to submeters. Investigate negative residual against timing, units and meter/allocation uncertainty; do not clip it to zero. Purchased steam/heat, individual fuels and generation inputs require separate actual cards if present, not duplicate purchased electricity and generation output."
    source_ids: []
