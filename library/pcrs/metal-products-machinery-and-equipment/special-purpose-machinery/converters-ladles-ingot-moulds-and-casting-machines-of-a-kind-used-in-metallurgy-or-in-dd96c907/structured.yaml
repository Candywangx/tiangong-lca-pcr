measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete machine of the same configuration in kg; collect using cp_mass."
  - id: normalize_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Row-specific property preserved"
      uuid: ""
    required_unit: "per 1 kg reference flow"
    rule: "Apply normalize_mass to each attributable per-machine exchange; numerator units remain kg, m3, kWh or MJ as declared."
  - id: physical_species
    applies_to: "physical material, chemical, waste and elementary species records"
    required_property_ref:
      name: "Own gross mass and matched contained-species assay"
      uuid: ""
    required_unit: "kg"
    rule: "For each contained element/species independently (Fe, Cu, Ni, Cr, W and actual refractory carbon/alumina as applicable): sum external input mass times its own matched assay + opening species stock + actual reaction generation = accepted equipment/components times their own assay + external scrap/chips/slag/dust/sludge/wastewater/releases times each term's own assay + closing species stock + actual reaction consumption. Retain wet/dry and dissolved/particulate bases; paired internal runners, chips, plating returns and rework cancel without removing reprocessing burden. Gross alloy, hydrated salt, oxide scale and wet sludge never equal contained metal. At elemental level reactions change chemical form, not create/destroy the element; retain species stoichiometry only when verified. Review closure with combined weighing, sampling, assay, detection-limit and allocation uncertainty, not forced yield or clipping."
  - id: water_basis
    applies_to: "physical water, moisture and water-stock records"
    required_property_ref:
      name: "Volume and measured mass conversion"
      uuid: ""
    required_unit: "m3; kg"
    rule: "For actual physical water terms: fresh purchased/abstracted makeup + input moisture + opening water stock + reaction-produced water = exported liquid water + water in exported wet waste/sludge + treated discharge + evaporation + retained equipment moisture + closing stock + reaction-consumed water. Measure each loop and test drain separately. Every wet/slurry/sludge/wastewater/product/stock term uses its own measured moisture or density, temperature where relevant and stated wet/dry basis; no shared moisture assumption across terms. Paired internal recirculation/return transfers cancel at factory boundary but pumping and treatment remain; never treat total recirculating flow as withdrawal. Investigate residual against combined flowmeter, scale, moisture-sampling, evaporation-estimation and allocation uncertainty; no universal tolerance."
process_map:
  - id: receipt
    name: "Receipt and configuration tracing"
    inclusion: "required"
    inclusion_condition: "Identify one supplied family, order scope and component make/buy state."
    role: "foreground"
    quantitative_reference: "1 kg reference flow"
  - id: body_fabrication
    name: "Vessel shell and fabricated frame manufacture"
    inclusion: "conditional"
    inclusion_condition: "Cut/form plate and weld converter/ladle shells or fabricated mould/frame when made here; purchased shells bypass only completed supplier operations. Record weld procedure, gas, wire and NDT."
    role: "foreground"
    quantitative_reference: "1 kg reference flow"
  - id: foundry
    name: "Equipment casting and finishing"
    inclusion: "conditional"
    inclusion_condition: "Only on-site cast ingot mould or housing/roll: actual furnace charge, alloy treatment, mould/core making, pouring, cooling, shakeout, removal of runners and finishing. This makes equipment, not the customer ingot."
    role: "foreground"
    quantitative_reference: "1 kg reference flow"
  - id: forge_heat
    name: "Forging and heat treatment"
    inclusion: "conditional"
    inclusion_condition: "Actual on-site forging of shaft/roll/trunnion and specified stress relief, anneal, quench/temper; purchased forgings link supplier heat-treatment state and only remaining work."
    role: "foreground"
    quantitative_reference: "1 kg reference flow"
  - id: machining
    name: "Machining and dimensional finishing"
    inclusion: "conditional"
    inclusion_condition: "Actual drilling/boring/turning/milling/grinding of bodies, roll journals, bearing seats or copper mould; trace each alloy and fluid separately."
    role: "foreground"
    quantitative_reference: "1 kg reference flow"
  - id: lining
    name: "Initial refractory and insulation installation"
    inclusion: "conditional"
    inclusion_condition: "Only retained initial lining/insulation supplied by manufacturer: install actual purchased brick/precast/drop-in liner OR actual castable, mix/place/cure/dry it here. Bare vessel remains valid; customer relining/preheating excluded."
    role: "foreground"
    quantitative_reference: "1 kg reference flow"
  - id: surface
    name: "Conditional protective coating and copper treatment"
    inclusion: "conditional"
    inclusion_condition: "Actual blast/clean/paint/cure; new caster copper may have a specified electrolytic Ni/NiB/Cr route or HVOF hard coating. Purchased coated copper embeds supplier plating once; no default all-coatings recipe."
    role: "foreground"
    quantitative_reference: "1 kg reference flow"
  - id: assembly
    name: "Configured assembly and factory acceptance"
    inclusion: "required"
    inclusion_condition: "Assemble supplied shell/support/tilt system, ladle handling, mould, caster modules or mill stands/drives to actual contract; inspect alignment/NDT and perform actual dry or loaded factory tests. Declare test-fluid drain/retention."
    role: "foreground"
    quantitative_reference: "1 kg reference flow"
  - id: services
    name: "Residual shared utilities and pollution control"
    inclusion: "required"
    inclusion_condition: "Only unassigned residual site loads after fabrication, machining, lining, coating, assembly and dispatch meters. Treat water and actual emission/waste controls; never add whole-factory electricity again."
    role: "foreground"
    quantitative_reference: "1 kg reference flow"
  - id: dispatch
    name: "Gate packaging and dispatch"
    inclusion: "required"
    inclusion_condition: "Protect and package accepted configured equipment. Supply as shipped modules may form one documented accepted set; reconcile all serials and masses."
    role: "foreground"
    quantitative_reference: "1 kg reference flow"
