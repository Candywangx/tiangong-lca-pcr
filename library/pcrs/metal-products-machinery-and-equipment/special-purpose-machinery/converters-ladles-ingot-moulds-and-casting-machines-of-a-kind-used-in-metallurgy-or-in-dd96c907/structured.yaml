  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: route_identity
      applies_to: "all supplied interfaces"
      requirement: "One family/configuration, actual make/buy matrix and supplier completed-state; expand every actual recipe/species before complete foreground release."
      evidence: "contract; drawings; BOM; route sheets; provider data"
    - id: water_closure
      applies_to: "physical water records"
      requirement: "For actual physical water terms: fresh purchased/abstracted makeup + input moisture + opening water stock + reaction-produced water = exported liquid water + water in exported wet waste/sludge + treated discharge + evaporation + retained equipment moisture + closing stock + reaction-consumed water. Measure each loop and test drain separately. Every wet/slurry/sludge/wastewater/product/stock term uses its own measured moisture or density, temperature where relevant and stated wet/dry basis; no shared moisture assumption across terms. Paired internal recirculation/return transfers cancel at factory boundary but pumping and treatment remain; never treat total recirculating flow as withdrawal. Investigate residual against combined flowmeter, scale, moisture-sampling, evaporation-estimation and allocation uncertainty; no universal tolerance."
      evidence: "loop meter, moisture, stocks, reaction and sampling records"
    - id: species_closure
      applies_to: "physical material/species records"
      requirement: "For each contained element/species independently (Fe, Cu, Ni, Cr, W and actual refractory carbon/alumina as applicable): sum external input mass times its own matched assay + opening species stock + actual reaction generation = accepted equipment/components times their own assay + external scrap/chips/slag/dust/sludge/wastewater/releases times each term's own assay + closing species stock + actual reaction consumption. Retain wet/dry and dissolved/particulate bases; paired internal runners, chips, plating returns and rework cancel without removing reprocessing burden. Gross alloy, hydrated salt, oxide scale and wet sludge never equal contained metal. At elemental level reactions change chemical form, not create/destroy the element; retain species stoichiometry only when verified. Review closure with combined weighing, sampling, assay, detection-limit and allocation uncertainty, not forced yield or clipping."
      evidence: "each term own assay; mass/stocks; paired return records"
    - id: solvent_closure
      applies_to: "solvent records"
      requirement: "For each actual solvent such as xylene: external solvent in resin/thinner/cleaner + opening stock = product-retained solvent + closing stock + exported recovered solvent + solvent in uncured coating/other waste + solvent retained on capture media + measured destruction + post-control stack/fugitive air releases. Account for solvent in wastewater and other non-air residues, reaction products and internal recovery returns. Capture alone is not destruction: distinguish solvent transferred to capture media from measured destruction or verified chemical conversion, with their own retained stocks and products; do not subtract capture and destruction twice. Never assign an unexplained balance residual automatically to air. Total VOC is not automatically one named species. Examine balance residual with actual formulation assay, sampling, metering, controls and allocation uncertainty; no assumed evaporation fraction."
      evidence: "SDS/formulation assays; recovery/destruction; post-control monitoring"
    - id: utility_closure
      applies_to: "utility records"
      requirement: "Reconcile site-period purchased imports + actual on-site generation + opening energy storage = assigned fabrication/foundry/heat/machining/lining/surface/assembly/dispatch use + remaining shared-services use + exports + closing storage + documented distribution losses. Services carries only the measured unassigned residual and measured causal allocation; same intervals/units, no whole-site total added to submeters. Investigate negative residual against timing, units and meter/allocation uncertainty; do not clip it to zero. Purchased steam/heat, individual fuels and generation inputs require separate actual cards if present, not duplicate purchased electricity and generation output."
      evidence: "same site-period reconciliation and measured causal allocation"
    - id: uncertainty
      applies_to: "all records"
      requirement: "Disclose period, calibration, sampling, measurement/conversion/allocation uncertainty, unresolved provider/UUID/recipe/range evidence and material exclusions. Not applicable, zero, below detection and unknown are distinct."
      evidence: "raw records; uncertainty budget; gap register"
validation_rules:
  - rule_id: reference_scope
    applies_to: "reference product"
    rule: "Confirm measured M and accepted mass/count, supplied modules, lining/fill and test denominator match one configuration; no packaging/reject or user molten-metal mass."
    source_ids: []
  - rule_id: route_completeness
    applies_to: "all inventory rows"
    rule: "Validate family architecture, grade and each conditional make/buy route; unsupported recipe/UUID remains a gap, not exclusion or a positive zero. Reject combined exchanges and duplicate embedded burdens."
    source_ids: []
  - rule_id: balance_validation
    applies_to: "physical balances"
    rule: "Require own matched assays and unit/basis, water/solvent stocks and actual reactions, paired internal transfers, measured external residues/releases. Investigate residual under combined actual uncertainty and disclose unresolved closure."
    source_ids: []
  - rule_id: utility_validation
    applies_to: "utility rows"
    rule: "Reconcile site-period purchased imports + actual on-site generation + opening energy storage = assigned fabrication/foundry/heat/machining/lining/surface/assembly/dispatch use + remaining shared-services use + exports + closing storage + documented distribution losses. Services carries only the measured unassigned residual and measured causal allocation; same intervals/units, no whole-site total added to submeters. Investigate negative residual against timing, units and meter/allocation uncertainty; do not clip it to zero. Purchased steam/heat, individual fuels and generation inputs require separate actual cards if present, not duplicate purchased electricity and generation output."
    source_ids: []
  - rule_id: emission_validation
    applies_to: "elementary releases"
    rule: "Verify named species, physical state, destination compartment and after-control measurements. No CO/NOx from fuel carbon alone, no Ni from total sludge, no automatic VOC-to-xylene mapping."
    source_ids: []
  - rule_id: uuid_validation
    applies_to: "all adopted identities"
    rule: "Before actual dataset release/publication require direct-read public type/state, bilingual official name, property/unit linkage, state/interface and provider conditions; resolve present gaps without substituting a narrower reference family."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturer-gate equipment production data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same declared equipment family/configuration/supplied scope and representative manufacture; process/lifecyclemodel downstream projection with upstream provider links"
  excluded_use: "Cross-family performance comparison, user metal output inventory, automatic cradle-to-grave lifetime, standalone spare part, refurbishment or universal average machine"
  required_metadata: "family and technology (BOF/AOD/nonferrous converter; ladle alloy duty; ingot mould metal duty; caster type; hot/cold rolling mill); model/drawing; capacity and geometry; alloy/grade certificates; bare vessel versus supplied liner and insulation; support/drive/roll/copper/hydraulic/electric/automation configuration; supplied auxiliary list; make/buy matrix and upstream completed operations; initial retained fill; acceptance tests; net mass and module reconciliation; site, period, geography and supplier interfaces"
  required_quality_disclosure: "Primary coverage, calibration, sampling, uncertainty, balance residuals, allocations, supplier state, conditional applicability, missing UUIDs/recipes/provider links/ranges and exclusions"
  update_trigger: "Family/configuration, supplied liner/fill/drive/copper/roll, make/buy, metallurgy/coating recipe, factory test, provider, energy supply or allocation changes"
data_sources:
  - id: "pyrotek-ladle"
    type: "extension_guidance"
    reference: "Pyrotek, Ladles and Crucibles, undated publisher page. https://www.pyrotek.com/primary-solutions/aluminium/casthouse/metal-transfer-casthouse/ladles-and-crucibles"
    used_for: "Ladle shell, precast or cast-in-place liner and conditional lid/backup insulation; aluminium example, no default refractory recipe."
  - id: "mifco-mould"
    type: "extension_guidance"
    reference: "MIFCO, Ingot Molds / Charging Tongs, undated publisher page. https://mifco.com/foundry-accessories/ingot-molds-charging-tongs/"
    used_for: "Mild-steel ingot mould for aluminium/brass, explicitly not bronze; counterexample to all-moulds-cast-iron assumption. No catalogue weight adopted."
  - id: "ingot-design"
    type: "literature"
    reference: "Ingot Metallurgy Forum technical library, Design of Ingot Moulds, Ingot Technology-11, printed page43. Historical undated chapter; edition/date not established. https://virteomdevcdn.blob.core.windows.net/site-ingotmetallurgyforum-com/uploaded_media/ingotmetallurgyforum_com/Technical_Library/Chapter_11_-_Design_of_Ingot_Molds.pdf"
    used_for: "Historical cast-iron steel-ingot mould example and handling/shape distinction only; no contemporary material mandate, geometry, lifetime or yield adopted."
  - id: "primetals-converter"
    type: "extension_guidance"
    reference: "Primetals Technologies, Stainless Steelmaking with the AOD Converter, undated publisher page. https://www.primetals.com/en/portfolio/solutions/steelmaking/aod-converter/"
    used_for: "Converter suspension, drive/damper and tuyere interfaces; these supplied systems differ from operating gas and molten feed."
  - id: "primetals-converter-manufacture"
    type: "extension_guidance"
    reference: "Primetals Technologies and ArcelorMittal Complete Converter Revamp in Eisenhuettenstadt, 28 April 2026. https://www.primetals.com/en/news/primetals-technologies-and-arcelormittal-complete-converter-revamp-in-eisenhuettenstadt/"
    used_for: "Distinct equipment manufacture/supply and later construction/commissioning interfaces; revamp example does not mandate a new-equipment configuration."
  - id: "primetals-copper"
    type: "extension_guidance"
    reference: "Primetals Technologies, Continuous Caster Mold Copper Repair & Coatings, undated publisher page. https://www.primetals.com/en/portfolio/solutions/continuous-casting/continuous-caster-mold-copper-repair-and-coatings/"
    used_for: "New/used copper machining; separate nickel-sulfamate, nickel-boron, chrome and HVOF tungsten-carbide alternatives; mould water/grease/hydraulic testing. Refurbishment excluded from new-equipment reference."
  - id: "primetals-mill"
    type: "extension_guidance"
    reference: "Primetals Technologies, Plate Mills, Plate Mill Stand section, undated publisher page. https://www.primetals.com/en/portfolio/solutions/hot-rolling/plate-mill/"
    used_for: "Single/multi-piece housing, work/backup rolls, hydraulic gap control and drive spindle; wider line ancillaries conditional on supplied equipment contract."
  - id: "jrc-foundry-2024"
    type: "official_guidance"
    reference: "JRC, Smitheries and Foundries Industry BAT Reference Document, EUR40127, 2024, DOI10.2760/4805267, section2.2.1.1, printed67-68. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2024-12/SF_BREF_2024-bref.pdf"
    used_for: "Equipment component foundry route: melt/treat, prepare mould, pour/cool/shakeout and finish; purchased casting bypasses supplier operations. No empirical factors adopted."
  - id: "jrc-metalworking-2020"
    type: "official_guidance"
    reference: "JRC, Best Environmental Management Practice in the Fabricated Metal Products manufacturing sector, EUR30025EN, 2020, DOI10.2760/894966, printed190 section4.1. https://publications.jrc.ec.europa.eu/repository/bitstream/JRC119281/jrc119281_jrc_bemp_fabricated_metal_product_manufacturing_report.pdf"
    used_for: "Separate straight cutting oil and water-soluble concentrate with dilution water, actual forming/cutting/grinding applicability."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU)2021/2279, AnnexI section4.5. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Subdivision and physical-causality allocation hierarchy; no complete environmental-footprint conformance claim."
  - id: "frech-cold"
    type: "extension_guidance"
    reference: "FRECH, Cold Chamber Die Casting Machines, undated publisher page. https://www.frech.com/en/cold-chamber.html"
    used_for: "Cold-chamber three-platen clamping and hydraulic/control architecture, no clamping force or operating-performance data adopted."
  - id: "frech-hot"
    type: "extension_guidance"
    reference: "FRECH, Hot Chamber Die Casting Machines, undated publisher page. https://www.frech.com/en/hot-chamber.html"
    used_for: "Hot-chamber supplied furnace-to-casting-system interface, no customer melting energy or cycle parameters adopted."
