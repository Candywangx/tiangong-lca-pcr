    used_for: "Model configuration only; no mandatory factory route, manufacturing intensity, catalogue mass or lifetime is adopted."
  - id: "bavelloni-ve-configuration"
    type: "handbook"
    reference: "Bavelloni, VE Series straight-line edging machines, undated retained brochure with 2015 PDF creation metadata, PDF p.11 / printed p.11, VE SERIES 11 and Tools Configuration. https://www.bavelloni.com/wp-content/uploads/2016/03/VERTICAL-EDGERS-VE-SERIES-ITA-ENG.pdf"
    used_for: "Historical/model-specific float or laminated glass edging, wheel and conveyor configuration only; no universal thickness threshold, factory energy or life is prescribed."
