  unresolved_inventory_uuids: All atomic rows queried; unmatched grade, formulation, delivered-state, property and provider interfaces retained explicitly. Only adopted direct-read identities carry UUIDs.
  unresolved_factory_records: Sources establish conditional dedicated parts, architecture and supplied states, not factory recipes, masses, yields, test charges, emissions or generic lifecycle benefits. Obtain actual BOM, make/buy, alloy/lining/coating specifications, supplier delivery, treatment and calibrated common-period records.
  unresolved_part_classification: Dedicated glass/seal/refractory/valve modules require documented principal use and item-specific review; general-use fasteners/raw materials/chemicals are not category output.
  unresolved_function_review: Cook/heater hybrids and ambiguous dedicated glass/seal/valve/liner kits require principal-use/category review. Complete appliances, electric-host, industrial-furnace and central-boiler parts cannot silently inherit this category.
  unresolved_quantitative_defaults: No brochure weight, rated output, efficiency, fuel-consumption rate, recycled fraction, warranty or service-life claim is a production default.
