system_boundary:
  rules:
    - rule_id: gate
      applies_to: "foreground"
      rule: "Include actual receipt, site fabrication, fuel-specific burner/grate integration, integration, factory test/rework, common services, waste and packing through accepted release."
      source_ids:
        - jotul-manufacture
        - weber-parts
    - rule_id: make_buy
      applies_to: "supplier_interface"
      rule: "For each component choose its actual make/buy state: complete bought casting/burner/valve/window/lining module includes embedded inputs once; own fabrication uses actual feedstocks and operations instead. Charge only subsequent site work. Pair internal transfers; do not list site-made intermediates as purchased imports."
      source_ids:
        - jotul-manufacture
        - jotul-cast-iron
    - rule_id: factory_use
      applies_to: "production"
      rule: "Actual factory fuels, leak-test gases, cleaning water and test electricity are production burdens when consumed; reusable fixtures need stock/reuse records. Separate actual factory burner-test exhaust/ash from household lifetime combustion, chimney/building installation and installer commissioning. The latter are downstream, not manufacturing defaults."
      source_ids:
        - weber-parts
    - rule_id: bom_extension
      applies_to: "route"
      rule: "Cards are specific conditional anchors, not universal recipes. Audit actual BOM, formulations, test media, packaging, fuels, waste and species. Add each missing atomic actual exchange; document not_applicable only with absence evidence, unknown differs from zero. Unresolved actual lining/coating chemistry retains the relevant architecture and requires a specific matched identity."
      source_ids:
        - jotul-parts
        - weber-schematic
    - rule_id: upstream
      applies_to: "links"
      rule: "Link supplier production and transport at actual grade, state, delivery geography/voltage and period; external treatment after measured waste transfer is distinct from site emissions. Without completed providers this factory package is not a complete cradle-to-gate result."
      source_ids: []
