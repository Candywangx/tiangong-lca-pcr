  data_quality_requirements:
    - id: configuration_mass
      applies_to: "cp_mass; finished_ceremonial_set"
      requirement: "Complete unit here means the sword plus one matched scabbard. Independently weigh each supplied component and the accepted complete set on scales of suitable actual capacity/resolution, with calibration and zero/tare/net originals. Reconcile installed component kg plus actual retained additions to positive M kg; packaging/display fixtures are excluded. No catalogue mass, assumed per-unit weight or functional geometry substitutes. Declare included supplier coatings/residues and avoid counting twice."
