    - id: actual_period
      applies_to: "all protocols"
      requirement: "Use actual accepted counts of the same configuration and declared period to collect q_item. Retain rejected/reworked consumption in numerator; paired M is physically measured for that population. Record stock changes and nonproduction utility attribution; do not pool materially different configurations."
      evidence: "actual job/count/meter records"
    - id: balance_coverage
      applies_to: "all exchanges"
      requirement: "Reconcile each physical supplied component to accepted retained kg, returns, stock change and specific waste; reconcile solvent issue/recovery/retention/residue/release with uncertainty. Additional actual glue, lubricant, wiping cloth, plating/coating inputs, heat, compressed air or other physical waste/release requires individual specified exchanges and evidence. No missing stage is treated as zero, and no mandatory process is inferred from a catalogue. This boundary does not offer a manufacturing recipe."
      evidence: "actual plant activity register and balances"
    - id: source_limits
      applies_to: "external evidence"
      requirement: "UNSD printed/PDF239 provides broad44750 title only. Windlass undated About Us supports dress-product and separate refurbishment context, not factory measurements. WKC publisher-retained historical catalogue PDF3 is a historical ceremonial sword/scabbard supply example only; no present process, quality certification, quantity or lifetime transferred. The finished-component boundary is an authored modelling choice requiring actual supplier records. Upstream PE film use requires actual material and supply-route matching."
      evidence: "unsd-cpc3; windlass-scope; wkc-historical"
