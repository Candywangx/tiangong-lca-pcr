allocation_rules:
  - rule_id: allocation_causal
    applies_to: "all_processes"
    rule: "Avoid allocation by separate job/utility/stock records for each accepted configuration. Shared actual consumption uses documented causal metering, observed machine time/load or handling records; accepted counts only when comparable actual loads justify it. Record total, driver, denominator, assigned shares and sensitivity; no default mass or economic allocation between sword and scabbard delivered as one reference set."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "specific waste"
    rule: "Rejected/reworked consumption remains attributed to accepted production; unknown quantities are not zero. Waste transfers carry no automatic avoided-production credit. If actual co-products exist, document substitution-free allocation and receivers in a separate specified model before application."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "finished_ceremonial_set"
      record_type: "calibrated scale and acceptance records"
      raw_fields: "configuration; accepted net mass M; independent supplied component kg; zero/tare/net; scale capacity/resolution/calibration; acceptance count"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each configuration and accepted unit"
      temporal_coverage: "actual declared period"
      site_scope: "declared site and supplied-component gates"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original scale/component/completeness records"
    - protocol_id: cp_stock
      process_id: "all_processes"
      flow_role: "specific supplied input"
      record_type: "original issue/return and supplier records"
      raw_fields: "one physical specification; composition/supply state; measured net kg; issue/return/stock change; accepted count"
      collection_method: "Measure each actual supplied input kg, including retained supplied residues once; reconcile returns and stock changes. Water volume conversion requires actual density evidence, not assumed1 kg/L."
      unit: "kg"
      frequency: "each transfer and actual period"
      temporal_coverage: "actual declared period"
      site_scope: "declared site and supplied-component gates"
      aggregation_rule: "actual attributed input kg / accepted units of the same configuration"
      quality_evidence: "scale/supplier/SDS/stock records"
    - protocol_id: cp_energy
      process_id: "all_processes"
