review_metadata:
  semantic_boundary_decision: "Narrower44750 ceremonial sword with one matched
    scabbard: environmental accounting only, from declared finished-component
    supply gates to accepted product packing. Existing knife/scissor and
    food/table-cutlery methods have distinct cutting/food handling boundaries.
    Matched delivery scope and independent component/complete net-M
    reconciliation require this specific method. Earlier manufacture is linked,
    not omitted; representative completed-component sourcing is conditional on
    actual records, not manufacturer-wide inference. No weapon parameters,
    functional performance or instructions; no accepted mapping or old scaffold
    changes."
  scientific_review: pending independent methodology review
