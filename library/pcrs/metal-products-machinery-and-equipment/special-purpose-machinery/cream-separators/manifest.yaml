  unresolved_reference_flow_uuid: Direct cream-separator search returned unrelated battery separator scrap and petroleum condensates; no verified complete category product identity was found. Mass property and kg unit linkage are verified separately.
  unresolved_inventory_uuids: Actual grade, finished component scope, motor, manual drive, sanitary module, polymer, seal compound, utility supply, chemicals, wastes and compartment-specific emissions require matching direct-read flow identities; no inventory product UUID has been adopted.
  unresolved_provider_interfaces: Obtain actual provider geography, period, grade, physical and chemical state, completed operations, embedded components and delivery interface for every supplied material and assembly.
  unresolved_route_evidence: Industrial and small machine sources establish conditional architecture; actual forging, welding, passivation, anodizing, coating and polymer recipe activation requires supplier or factory route records. Conditional cards never assert every manufacturer uses those routes.
  unresolved_quantitative_ranges: No universal machine mass, material yield, utility intensity, lifetime, emission factor, performance or empirical range is adopted; measured factory data is required.
  identity_rejections:
    - Battery separator scrap is not a complete cream-separation machine.
    - Generic centrifuge and downstream milk-separation performance cannot establish this product reference.
    - Source-specific generated power and grid transport services cannot substitute purchased factory electricity.
    - Brazilian user-side medium-voltage electricity identity has Brazil geography and unresolved background provider; it is not a category-wide factory electricity interface.
