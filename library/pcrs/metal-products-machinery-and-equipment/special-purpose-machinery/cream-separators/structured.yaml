allocation_rules:
  - rule_id: product_separation
    applies_to: "configuration groups"
    rule: "Separate manual, small electric and industrial configurations before allocation. Allocate shared measured production burdens by documented causal machine time, heat demand or work orders; retain driver, total, recipient and uncertainty. Do not average across configurations."
    source_ids: []
  - rule_id: scrap
    applies_to: "external recovered material"
    rule: "Record actual scrap destination and retained oil/metal content. No automatic avoided virgin-metal credit; disclose any recycling model separately. Internal return is a paired transfer, not an external coproduct."
    source_ids: []
  - rule_id: test_products
    applies_to: "factory test outputs"
