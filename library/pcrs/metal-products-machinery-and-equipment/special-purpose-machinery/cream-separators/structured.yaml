validation_rules:
  - rule_id: identity
    applies_to: "reference product and BOM"
    rule: "Verify one complete accepted cream-separation machine, actual configuration, calibrated net mass, delivered fill, manual/electric architecture and BOM make/buy interfaces. Exclude packaging, rejected machines and downstream milk throughput from denominator."
    source_ids: []
  - rule_id: physical_mass
    applies_to: "physical material streams"
    rule: "For the same configuration and period reconcile external inputs plus opening stock plus reaction addition with accepted product, rejects, scraps, slag/dross, sludge, wastewater, releases and closing stock. Pair each internal return by transfer id and quantity; no double counted recycle."
    source_ids: []
  - rule_id: contained_species
    applies_to: "contained metal and chemical species records"
    rule: "For each actual Al, Fe, Cr, Ni, Mo, carbon, fat or bath species, multiply each term by that term's OWN matched measured assay and wet/dry basis. Include accepted product, scrap, scale, dross, sludge, wastewater and emissions plus stocks, reaction sources/sinks and paired returns. Gross alloy mass is never contained-element mass; nominal feed alloy assay cannot stand for residue/product assay."
    source_ids: []
  - rule_id: water_closure
    applies_to: "physical water and moisture records"
    rule: "Reconcile supplied water and input moisture plus opening stock and reaction formation against product/fill moisture, wet scrap/sludge, liquid effluent, evaporation, reaction consumption and closing stock. Pair recirculation, rinses and condensate returns; Each wet input, product/fill, scrap, sludge, wastewater and opening/closing stock term uses its OWN measured moisture or water fraction, density where volume is converted, and matched wet/dry basis; gross wastewater is not its contained water."
    source_ids: []
  - rule_id: solvent_closure
    applies_to: "actual solvent-bearing material records"
    rule: "For each actual solvent reconcile fresh plus opening stock and generation against retained product, recovered external solvent, closing stock, air release, captured-media solvent, wastewater solvent and actual destruction/reaction products. Capture is transfer, not destruction; non-air residuals cannot default to air. Unexplained balance residual must not automatically be assigned to air, including unmeasured losses; investigate it using actual combined measurement, sampling, stock and allocation uncertainty."
    source_ids: []
  - rule_id: utilities_closure
    applies_to: "utility energy and service-media records"
    rule: "Reconcile all process loads and unassigned residual services to same-period site meters in matching units: purchased imports plus actual site generation plus opening storage/returns equal attributed loads plus exports, losses and closing storage. Allocate only unassigned residual; never add whole-factory imports atop submeters. Investigate negative residuals using period, unit and combined uncertainty; never clip."
    source_ids: []
  - rule_id: emission_species
    applies_to: "actual combustion and release species records"
    rule: "Fossil carbon balance does not determine CO or NOx. Keep measured NO, NO2 and NOx reported as NO2-equivalent distinct, with actual reporting convention and molecular-mass conversion; never treat an aggregate convention as an individual-species identity. Each claimed emission needs own measured species, actual compartment and sampling/flow integration; characterize wastewater species without treating external treatment as direct elementary discharge."
    source_ids: []
  - rule_id: closure_uncertainty
    applies_to: "physical balance residuals"
    rule: "Investigate closure residuals against actual combined scale/meter, sampling/assay, stock, reaction and allocation uncertainty and record corrective evidence. No universal tolerance, invented loss, default yield or balancing plug is permitted. Distinguish not_applicable with absence evidence, measured zero and unknown."
    source_ids: []
  - rule_id: provider
    applies_to: "external flow links"
    rule: "Verify exact flow type, reference property, unit, physical/chemical state and supply interface before binding any UUID; incompatible generic centrifuge, battery separator scrap or source-specific generated power cannot substitute. Resolve candidate identity and quantitative gaps before publication."
    source_ids: []
