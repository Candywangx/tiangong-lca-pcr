system_boundary:
  rules:
    - rule_id: factory_gate
      applies_to: "all processes"
      rule: "Collect actual manufacture to accepted manufacturer gate including scrap, rework, factory lubrication and qualification. Operation at the dairy, installation, replacement and end of life are separate downstream stages."
      source_ids: []
    - rule_id: make_buy
      applies_to: "BOM interfaces"
      rule: "For every bowl, disc, drive, bearing, hygienic connection, housing, skid and control item record make/buy, supplied state, actual alloy/polymer/compound and included operations. Charge either upstream finished component plus local assembly, or raw input plus actual manufacture; never both."
      source_ids:
        - tetrapak-h7c-2025
        - janschitz-separator-architectures
    - rule_id: route_gate
      applies_to: "actual route"
      rule: "Casting, forging, heat treatment, machining, forming, welding, passivation, anodizing, coating and polymer molding activate only on actual supplier/site route evidence. Product material does not prove its fabrication route; declared optional cards are not default recipes."
      source_ids:
        - jrc-smitheries-foundries-2024
        - jrc-fabricated-metals-2020
    - rule_id: extensions
      applies_to: "actual exchanges"
      rule: "Anchor cards are conditional examples. Add each actual grade, chemical, gas, waste, utility and emission as its own specific exchange, including super-duplex, shaft steel, seals, belt, sensors, auxiliary box and oil if independently supplied. Missing identity is an explicit gap, never exclusion or zero."
      source_ids: []
    - rule_id: upstream
      applies_to: "external interfaces"
      rule: "Match provider geography, period, supply state and completed processes; add input transport and external waste treatment links. Cancel paired internal material/utility transfers without erasing their operating burdens. Incomplete upstream links prohibit an undisclosed complete cradle-to-gate claim."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "Bought finished versus actual blank processing; aluminium, duplex, super-duplex and stainless grades separate; do not infer forging from material"
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "Actual configuration only; embedded lubrication/electrical controls charged once; manual machine without motor has no motor input"
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "Container, outlets, seals, connections, cast/molded part by drawing/material declaration; generic plastic/elastomer does not establish exact compound"
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "Actual supplied frame, sensors, PLC, auxiliary box and service kit; verify component inclusion and exclude unsupplied options"
      source_ids: []
