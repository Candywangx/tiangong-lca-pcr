ound/finished sleeve/completed roller interfaces separate. NBR conventional-oil and EPDM UV compatibility are variant-specific; no PFA=PTFE, VMQ=silicone oil, PI=aramid, fixed filler or coating-thickness assumption. Measure local fabrication/joining/tests/rework/rejects and dispatch; upstream completed parts are counted once. | boettcher-compound; boettcher-faq; kb-materials; kb-sponges |\n\n\n"
