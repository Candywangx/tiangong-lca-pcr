        - cat320-boom
        - cat311-historical
    - rule_id: boundary_supply
      applies_to: "finished_boom"
      rule: "Acceptance is an independently supplied passive boom, not successful whole-machine digging. Declare frame root pivot, stick-end pivot, boom-cylinder and stick-cylinder attachment interfaces separately. Drawing/BOM decides fitted bushes, liners, retained pins and plugs; cylinder rod-eye bearings inside a bought actuator are not automatically boom parts. Exclude cylinders, hoses and complete power groups even when shown next to the boom."
      source_ids:
        - catboom-supply
        - catbushing-interface
    - rule_id: boundary_emissions
      applies_to: "elementary rows"
      rule: "Only actual species-specific releases crossing the foreground environment boundary are elementary exchanges. Captured weld dust/spatter and washing liquids are collected wastes; upstream power emissions remain upstream. No compulsory welding emission species or solvent evaporation factor. Expand actual fume chemistry and outdoor submedium only with measurement or matched source evidence."
