allocation_rules:
  - rule_id: allocation_direct
    applies_to: "shared manufacture"
    rule: "First subdivide by actual drawing/revision and job/meter/stock records. Attribute shared cutting/weld/bore/hoist/inspection loads using observed machine time and actual setup/idle/load evidence, not boom sales mass by default. Supplier prepared-part burdens use that supplier boundary. If subdivision fails, document the actual physical causal basis; economic allocation requires actual prices/period and sensitivity, never a fixed author percentage."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rejects scrap returns"
    rule: "Consumed rejects and rework remain in actual campaign exchange totals divided by accepted same-configuration units. Segregate reusable offcuts and supplier returns from waste. Document scrap legal/product status and receiver route; no automatic avoided virgin-steel credit, no simultaneous coproduct allocation and duplicate recycling benefit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "finished_boom"
      record_type: "original calibrated net weights and signed acceptance"
      raw_fields: "configuration; accepted net mass M; drawing/revision/serial; installed bush/pin scope; calibrated scale capacity/resolution; zero/tare/net M kg; independent welded-box kg; acceptance state"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted unit/configuration"
      temporal_coverage: "actual declared representative period"
      site_scope: "declared boom plant and actual supply gates"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original calibration/weights/acceptance"
    - protocol_id: cp_stock
      process_id: "all_processes"
      flow_role: "stock chemical gas"
      record_type: "actual issue return stock and SDS records"
      raw_fields: "drawing/job; one plate or chemical/gas specification; composition/state; calibrated issue/return kg; stock change; accepted count"
      collection_method: "Measure net material issued after returns and stock correction in kg. Preserve actual premix scope and SDS concentration; for metered water/gas retain original volume, conditions and independently documented matched mass conversion."
      unit: "kg"
      frequency: "actual attributable campaign"
      temporal_coverage: "actual declared representative period"
      site_scope: "declared boom plant and actual supply gates"
      aggregation_rule: "actual attributed input kg / accepted units of the same configuration"
      quality_evidence: "stock balance/SDS/meter and scale calibration"
    - protocol_id: cp_parts
      process_id: "all_processes"
      flow_role: "supplied pivot components"
      record_type: "supplier BOM and original independent component weights"
      raw_fields: "drawing/revision/serial; boss/bushing/pin specification; liner/finish/prefill; actual installed kg and count; returns; accepted count"
      collection_method: "Weigh supplied physical components and record installed kg independently of counts. Reconcile supplier inclusions, same drawing interface, retained versus temporary/loose parts and separate supplied lubricant."
      unit: "kg"
      frequency: "each delivery and configuration"
      temporal_coverage: "actual declared representative period"
      site_scope: "declared boom plant and actual supply gates"
      aggregation_rule: "actual installed supplied kg / accepted units of the same configuration"
      quality_evidence: "part certificates/BOM/original weights"
    - protocol_id: cp_energy
      process_id: "all_processes"
      flow_role: "electricity"
      record_type: "actual calibrated operation meters"
      raw_fields: "job/process; meter voltage/provider; kWh start/end; setup/idle/rework/extraction; observed time/load; accepted count"
      collection_method: "Read actual meter coverage; convert kWh to MJ using3.6 MJ/kWh and attribute shared consumption once using documented causal operation records."
      unit: "MJ"
      frequency: "actual campaign and each shared load change"
      temporal_coverage: "actual declared representative period"
      site_scope: "declared boom plant and actual supply gates"
      aggregation_rule: "actual attributed MJ / accepted units of the same configuration"
      quality_evidence: "meter calibration and allocation observations"
    - protocol_id: cp_waste
      process_id: "all_processes"
      flow_role: "segregated specific waste"
      record_type: "original receiver manifests and weights"
      raw_fields: "one steel/solvent/effluent fraction; measured composition; net kg; drainage/recovery; legal status/receiver; accepted count"
      collection_method: "Weigh each distinct waste fraction after controlled tare; record retained fluid, receiver and stock/recovery separately. Effluent is collected waste, not elementary water."
      unit: "kg"
      frequency: "each transfer and actual campaign"
      temporal_coverage: "actual declared representative period"
      site_scope: "declared boom plant and actual supply gates"
      aggregation_rule: "actual transferred waste kg / accepted units of the same configuration"
      quality_evidence: "scale records/composition/receiver receipts"
    - protocol_id: cp_emission
      process_id: "cleaning"
      flow_role: "ipa_air"
      record_type: "matched species sampling or closed solvent balance"
      raw_fields: "CAS67-63-0; concentration/flow/time; actual air submedium; issue/recovery/retention/residue; detection/uncertainty; accepted count"
      collection_method: "Measure actual outdoor residual IPA by matched species sampling or documented closed issue/recovery/residue/retention balance. Unexplained residual is not assumed air release."
      unit: "kg"
      frequency: "actual cleaning campaign"
      temporal_coverage: "actual declared representative period"
      site_scope: "declared boom plant and actual supply gates"
      aggregation_rule: "actual released kg / accepted units of the same configuration"
      quality_evidence: "sampling calibration and complete solvent balance"
    - protocol_id: cp_configuration
      process_id: "all_processes"
      flow_role: "complete accepted passive boom"
      record_type: "controlled drawings inspection and supply acceptance"
      raw_fields: "drawing/revision/serial; box/baffle geometry; actual certificates; root/stick/cylinder interface dimensions; fitted bush/pin/liner inclusions; approved weld/machining/inspection disposition"
      collection_method: "Reconcile current drawing and supplied BOM to actual manufactured box, post-weld interface dimensions and accepted installed components. Collect only tests/criteria actually required by the current approved plan; no universal proof load or weld acceptance threshold inferred from brochures."
      unit: "kg"
      frequency: "each drawing/configuration and accepted unit"
      temporal_coverage: "actual declared representative period"
      site_scope: "declared boom plant and actual supply gates"
      aggregation_rule: "qualifiers accompany each accepted unit"
      quality_evidence: "signed drawing/BOM/inspection disposition"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: net_mass_configuration
      applies_to: "cp_mass; finished_boom"
      requirement: "Here complete unit means the independently accepted boom, not the excavator. Use a calibrated scale suitable for actual boom mass/geometry with original capacity/resolution/calibration and zero/tare/net records. Independently weigh the welded box and installed bushes/pins; reconcile box kg plus actual retained components/residues to positive complete M kg. Exclude packaging, lifting fixtures, temporary test pins, loose installation pins, spares, cylinders, hoses and power group. No assumed dry mass, catalogue shipping mass, dimensions-times-default-density or whole-machine weight substitutes."
      evidence: "cp_mass; cp_parts; cp_configuration"
    - id: interfaces_acceptance
      applies_to: "finished_boom"
      requirement: "Declare distinct root-frame pivot, stick pivot and each cylinder attachment interface using current drawing/revision, bore/axis/fit records and signed disposition. Record actual weld-inspection coverage/method and post-weld machining state; additional load/proof/NDT/stress-relief processes apply only if actually specified and performed. No universal steel grade, weld parameter, test load, treatment temperature or life is prescribed."
      evidence: "actual drawing, approved procedure and original acceptance"
    - id: period_collection
      applies_to: "all protocols"
      requirement: "Attribute actual campaign totals to a single drawing/configuration using causal records; divide by actual accepted units to collect q_item in original kg or MJ. Consumed rejects/rework stay in numerator. Corresponding complete M is physically measured for the same population and supplied state; do not pool different box, bearing or pin configurations."
      evidence: "actual accepted counts/job/meter/stock records"
    - id: mass_and_chemical_balance
      applies_to: "all exchanges"
      requirement: "Close purchased stock/parts/wire to accepted installed mass, returns, stock change and individually segregated waste, with actual uncertainty. Reconcile machining emulsion and IPA issue/recovery/residue/retention/release separately. No fixed yield, hidden zero, full evaporation or unexplained-residual emission. Expand additional actual seals, retaining clips, lubricants, abrasives, inspection reagents, compressed air/heat and captured fume fractions as their own concrete exchanges before claiming full plant coverage."
      evidence: "all primary protocols and actual operation register"
    - id: evidence_limits
      applies_to: "external evidence"
      requirement: "Cat320 exact boom paragraphs support welded steel box architecture; mixed322 wording elsewhere is not adopted. Historical311C supports a historical construction example only. Cat605-3310 supports separate catalogue supply, but contains generic sleeve-bearing prose and cannot certify its supplied pin/cylinder scope. Cat384-2393 supports an interface example; its mini-excavator dimensions/material statements are not transferred to another boom. UNSD printed/PDF235 gives broad44461 parts identity, not an explicit boom-only classification decision. No source provides measured manufacturing inventory; original foreground records and independent scientific review remain required."
      evidence: "cat320-boom; cat311-historical; catboom-supply; catbushing-interface; unsd-cpc3"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference_flow"
    rule: "Verify exact reference name equals finished_boom, same drawing/configuration and physically measured positive complete M kg. Reconcile independent welded-box mass and installed component additions; verify excluded loose pins and actuators."
    source_ids: []
  - rule_id: validation_boundary
    applies_to: "all_processes"
    rule: "Verify actual plate route/certificates, prepared-part supply gates, weld/machining order, interface records and uncoated acceptance state. If coating or other downstream stages are included in a product claim, their actual linked burdens and matching gate are mandatory before that claim."
    source_ids: []
  - rule_id: validation_identity
    applies_to: "all flow rows"
    rule: "Verify actual public state100 type/reference property/group/unit and official bilingual names. Match chemical/state/route and elementary actual immediate outdoor air submedium; supplied industrial water and collected wastewater are distinct. Reject crane body plus hydraulic system as passive excavator boom, generic sleeve as specified bearing, and flux-cored wire as solid wire. Keep specific unresolved rows, never force a UUID."
    source_ids: []
  - rule_id: validation_claims
    applies_to: "claims"
    rule: "PCR mechanical pass verifies authored consistency, not actual plant measurements, whole-machine performance, complete cradle-to-gate coverage, publication or scientific approval. Disclose BOM/identity/link/measurement/source gaps and distinguish unknown, not-applicable and below-detection."
    source_ids: []
published_dataset_profile:
  dataset_role: "Independently accepted passive steel excavator box-boom manufacturing foreground before coating/packing; heading implies no publication"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Matching configured independent boom manufacture or linked supplied boom input to a complete excavator model, scaled by actual M"
  excluded_use: "Bucket or whole excavator manufacture, digging service, hydraulic power system, generic building steel structure, repair and lifetime claims"
  required_metadata: "Drawing/revision/model/serial, root/stick/cylinder interfaces, actual material/part certificates, box and complete net M, installed bushes/pins/liners/prefill scope, uncoated gate, actual weld/machining/inspection records, plant/period/accepted count/allocation, upstream and waste receivers"
  required_quality_disclosure: "All identity, original measurement, actual BOM/utility, supplier/receiver and independent scientific-evidence gaps; yield/rework/balance uncertainty and allocation sensitivity"
  update_trigger: "Drawing/interface/material/weld or bore route, bushing/pin supply state, coating gate, plant/provider/meter/acceptance changes"
data_sources:
  - id: "unsd-cpc3"
    type: "official_guidance"
    reference: "UNSD, CPC Version3.0 Explanatory Notes,30June2025, printed/PDF235:44461; printed/PDF226:43580. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Broad parts identity; bucket separately named. Narrow boom interpretation remains authored and review-required."
  - id: "cat320-boom"
    type: "handbook"
    reference: "Caterpillar,320D3 Hydraulic Excavator, official undated page, Designed For Uptime and High Productivity boom paragraphs. https://www.cat.com/en_IN/products/new/equipment/excavators/medium-excavators/129160.html"
    used_for: "Robotically welded boom and steel box with internal baffles; no grade/parameter/quantity/lifetime transferred."
  - id: "cat311-historical"
    type: "handbook"
    reference: "Caterpillar,Cat311C Utility, publisher-retained historical-model page, Boom and Boom and Stick Construction. https://h-cpc.cat.com/cmms/v2?cid=406&f=product&gid=265&it=product&lid=nl&nc=1&pid=752135&sc=L120"
    used_for: "Historical upper/lower/side plate and welded box example only, not present universal route."
  - id: "catboom-supply"
    type: "handbook"
    reference: "Caterpillar Parts Store,605-3310 Boom Assembly-Bearing, official undated page, heavy fabrication category and Compatible Models. https://parts.cat.com/en/catcorp/product/605-3310"
    used_for: "Independent supplied boom catalogue example; generic bearing prose and supplier completeness limitations; no catalogue kg reused."
  - id: "catbushing-interface"
    type: "handbook"
    reference: "Caterpillar Parts Store,384-2393 Boom Linkage Bushing, official undated page, Description and Applications. https://parts.cat.com/en/catcorp/product/384-2393"
    used_for: "Mating pin/bushing/mounting-surface interface example; mini-excavator dimensions and liner construction not generalized."
