system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "all_processes"
      rule: "Include attributable receipt, cutting, actual forming, weld fit-up/welding, handling/extraction, post-weld bore machining, dimensional/weld inspection, installed pivot assembly, actual cleaning and final acceptance; include consumed rejects/rework. Do not impose robot welding, stress relief or heat treatment from promotional prose. If actually required by the drawing/procedure, add and measure their concrete inputs/outputs."
