review_metadata:
  semantic_boundary_decision: New narrower independently delivered passive welded
    steel hydraulic-excavator box-boom assembly manufacturing methodology.43580
    bucket is an existing distinct accepted boundary and was not duplicated.
    Whole excavator and42190 structural-metal records exclude
    independent/machinery-specific assemblies. Need specific root/stick/cylinder
    interfaces, supply completeness and independent box/installed-part/net-M
    reconciliation. Manufacturer originals support architecture/supply/interface
    examples, not a universal BOM or measured factory recipe. Representative
    uncoated solid-wire route is author-selected and requires actual approved
    drawing/procedure. No accepted mapping or old scaffold changed.
  scientific_review: pending independent methodology review
