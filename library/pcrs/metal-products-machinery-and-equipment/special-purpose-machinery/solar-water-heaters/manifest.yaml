        explanation: The public candidates do not verify low-alloy sheet grade and state; several have conflicting English and Chinese labels.
      - row_id: c_flat_glass
        reason_code: no_exact_candidate
        explanation: Plate glass candidates do not verify low-iron solar glazing grade; photovoltaic glass is a different product.
      - row_id: c_glass_tube
        reason_code: product_state_mismatch
        explanation: The borosilicate candidate is classified as unworked glass in rods or tubes, not a finished evacuated collector tube.
      - row_id: t_steel_sheet
        reason_code: no_exact_candidate
        explanation: The public candidates do not verify low-alloy sheet grade and state; several have conflicting English and Chinese labels.
      - row_id: t_test_water_waste
        reason_code: product_state_mismatch
        explanation: Wastewater candidates assert direct discharge to water without a verified hydrostatic-test origin or treatment state.
      - row_id: a_pump
        reason_code: no_exact_candidate
        explanation: The only public candidate is a generic pump without a confirmed circulation-pump function.
      - row_id: a_glycol
        reason_code: no_exact_candidate
        explanation: Candidates identify propene, humectant, antifreeze or other chemicals, not verified propane-1,2-diol heat-transfer fluid.
