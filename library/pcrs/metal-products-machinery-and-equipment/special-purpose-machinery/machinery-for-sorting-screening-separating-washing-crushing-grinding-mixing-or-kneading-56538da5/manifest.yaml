review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: "The existing PCR ID is retained and its existing methodology upgraded
    in place. The scoped CPC mapping is accepted; scientific approval, translation review and
    publication retain their separately recorded states. Classification rationale: Stationary
    mineral jaw crushers/dry screens fit 8474.10/.20; other mixing/forming machinery and mobile
    service outputs are outside the accepted subset. Historical author assessment:
    docs/reviews/pcr149-original-ids-20261127/44440.json."
  unresolved_flow_identities:
    - row_id: frame_casting
      selected_flow: Prepared cast-steel crusher frame section
      reason: Steel slabs, liquid metal, shot and cast pipe candidates do not establish a prepared
        crusher-frame casting.
      query_evidence: castRefined
    - row_id: captured_dust
      selected_flow: Captured low-alloy steel grinding dust
      reason: Generic dust/waste particulate or ore candidates do not identify captured low-alloy grinding
        dust composition.
      query_evidence: dustWaste
    - row_id: welding_wire
      selected_flow: Solid low-alloy steel welding wire
      reason: Returned flux-cored wire, plain steel wire and unrelated compounds do not verify solid
        low-alloy welding wire specification.
      query_evidence: wireRefined
    - row_id: shield_argon
      selected_flow: Compressed gaseous argon
      reason: Direct liquid-argon product is cryogenic liquid, not compressed gas; refinement returned
        unrelated chemical candidates.
      query_evidence: argonRefined
    - row_id: epoxy_primer
      selected_flow: Solvent-based epoxy primer formulation
      reason: Broad primer/industrial-coating records do not verify the supplied epoxy formulation and
        component boundary.
      query_evidence: epoxy
    - row_id: wash_effluent
      selected_flow: Aqueous steel-part washing effluent
      reason: Generic wastewater, steel-production wastewater and untreated product-flow records do not
        verify steel-part washing composition and treatment handoff.
      query_evidence: wastewater
    - row_id: paint_residue
      selected_flow: Discarded solvent-based epoxy primer residue
      reason: Generic paint sludge or liquid waste identities do not establish this primer-specific
        supplied waste composition.
      query_evidence: paintWaste
    - row_id: frame_finished
      selected_flow: Finished cast-steel crusher frame
      reason: Processed mineral outputs and raw steel candidates do not identify a finished crusher frame.
      query_evidence: casting
    - row_id: eccentric_shaft
      selected_flow: Finished alloy-steel eccentric crusher shaft
      reason: Wind turbine shaft/drive identities do not establish a finished crusher eccentric shaft.
      query_evidence: shaftRefined
    - row_id: pitman
      selected_flow: Finished cast-steel crusher pitman body
      reason: Returned processed minerals and raw inputs do not identify the finished pitman body.
      query_evidence: pitman
    - row_id: jaw_plate
      selected_flow: Finished cast manganese-steel jaw plate
      reason: Manganese ore, ferroalloy and liquid silico-manganese steel do not identify finished cast
        wear plates.
      query_evidence: jawRefined
    - row_id: toggle_plate
      selected_flow: Finished steel crusher toggle plate
      reason: Crushed mineral outputs and abrasives do not identify a finished steel toggle plate.
      query_evidence: toggle
    - row_id: flywheel
      selected_flow: Finished cast-iron crusher flywheel
      reason: Cast-iron stock and wind-turbine pitch components do not establish finished crusher flywheel
        state.
      query_evidence: flywheel
    - row_id: exciter
      selected_flow: Finished vibrating-screen exciter assembly
      reason: Motor/rotor/refrigeration compressor candidates do not verify a complete screen exciter.
      query_evidence: exciterRefined
    - row_id: motor
      selected_flow: Finished three-phase induction motor
      reason: Direct candidates are CN-unspecified type or conveyor/washing expert-estimate modules; no
        compatible unrestricted three-phase motor identity verified.
      query_evidence: motor
    - row_id: spring
      selected_flow: Finished steel helical compression spring
      reason: Returned broad candidates do not verify the specified finished steel compression spring.
      query_evidence: spring
    - row_id: guard
      selected_flow: Finished steel drive guard
      reason: Raw steel/blank or unrelated boiler identities do not establish a finished drive guard.
      query_evidence: guard
    - row_id: control
      selected_flow: Finished steel motor-control cabinet with electronics
      reason: Direct steel control-cabinet record has Energy reference property, not Mass, and CN scope;
        rejected for the kg component row.
      query_evidence: control
    - row_id: hydraulic_unit
      selected_flow: Finished hydraulic jaw-setting power unit
      reason: Hydraulic/refrigeration broad components do not verify a complete jaw-setting unit.
      query_evidence: hydraulic
    - row_id: grease
      selected_flow: Formulated lithium-soap lubricating grease
      reason: Hydroxide, wax/oil/elementary lubricant candidates do not verify the supplied lithium-soap
        grease formulation.
      query_evidence: greaseRefined
    - row_id: test_stone
      selected_flow: Crushed limestone acceptance-test feed
      reason: Direct limestone candidate is for mill feed after primary crushing; target unspecified
        factory-test preparation/use does not establish that route.
      query_evidence: testStone
    - row_id: test_stone_waste
      selected_flow: Discarded crushed limestone test residue
      reason: Returned limestone product identities are not discarded acceptance-test residue waste.
      query_evidence: testWaste
  inventory_contract:
