  evidence_limitations:
    - "Manufacturer architecture evidence: Metso April2024 and Sandvik2025 historical editions, plus
      Metso CVB webpage updated Aug2026; model-specific conditions only, not current universal
      component recipes or tests."
    - No per-machine mass, service life, capacity, manufacturing consumption, emission factor or
      loss range adopted from brochures. Actual future foreground measurement/collection is
      required.
    - Narrower stationary electric jaw crusher and dry vibrating screen scope; no complete
      cradle-to-gate claim or accepted classification mapping. Scientific methodology review
      pending.
