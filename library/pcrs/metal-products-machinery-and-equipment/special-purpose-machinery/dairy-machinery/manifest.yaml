  unresolved_inventory_uuids: Grade-specific metal, welding, chemical, module, utility, packaging, waste and direct-release identities require matched direct reads; only the complete dairy-machinery reference UUID is adopted.
  unresolved_provider_links: Actual supplier geography, technology, supply state and included burdens require foreground supplier evidence.
  unresolved_quantitative_ranges: No generic machine mass, yield, factory energy, throughput, lifetime, GWP or empirical range is adopted; actual calibrated and sampled foreground data are mandatory.
  unresolved_recipe_evidence: Actual sanitary grade, passivation or finishing chemistry, seal polymer, lubricant and test recipe require drawing/SDS/site evidence. Listed conditional cards are not default recipes.
  unresolved_classification_review: Dual-function or separately supplied heating and ancillary assemblies require actual main-function and commercial supply evidence; dairy destination alone is insufficient.
  identity_rejections:
    - H7C centrifugal skimming or standardisation apparatus is adjacent cream-separator evidence, not the dairy-machinery output or a source of generic fabrication quantities.
    - Broad stainless AISI304 search returned chemical elementary records rather than a matching sheet product; none is adopted.
