  classification_refs: "CPC 3.0: 44132"
  covered_products: "Complete dedicated dairy machinery; actual cheese-vat, curd-handling, butter-churn or continuous butter-worker configuration"
  excluded_products: "Milking machines; cream separators; separately supplied parts; independently dispatched generic food heaters; dairy products; processing services"
  representative_product: "The declared delivered machine model; no narrower representative fixes category identity"
  production_route: "Drawing and make/buy verification; conditional sanitary fabrication and finish; module assembly; actual acceptance; dispatch"
  market_state: "Accepted complete factory-gate machine with declared options, factory fill and supply exclusions"
functional_unit:
  what: "Manufacture and supply the declared complete dairy machine configuration"
  how_much: "1 kg reference flow; same-configuration item records are normalized by measured net machine mass"
  how_well: "Passed documented mechanical, electrical, sanitary finish and functional acceptance requirements for the declared machine"
  how_long_or_cycle: "One manufacture and factory release; no assumed use lifetime or dairy service performance equivalence"
  reference_flow_link: "finished"
system_boundary:
  rules:
    - rule_id: boundary_gate
      applies_to: "foreground_system_boundary"
      rule: "Include attributable upstream supplies, inbound freight, rejects/rework, manufacturing, finishing, assembly, factory acceptance, cleaning, waste treatment and packaging to factory gate. Include inbound transport as separate actual mode/load/distance rows in the concrete data package."
      source_ids:
        - tetra-sh6-2024
        - gea-bue-2026
    - rule_id: boundary_routes
      applies_to: "foreground_system_boundary"
      rule: "Record make, buy or not_applicable for body/jacket, shaft/knife/paddle/auger, vat/curd conveyor, texturizer, drive, pump, seal, PLC and supplied ancillary system; a bought complete unit replaces its embedded material and fabrication entries. Supplier casting/forging and heat treatment stay in upstream boundary unless genuinely performed here, when add actual separate process records. Other actual alloys, polymers, coatings, fuels and chemicals require one species/grade-specific card each; the listed alternatives are not a mandatory recipe."
      source_ids:
        - tetra-sh6-2024
        - gea-cheese-2024
        - gea-bue-2026
    - rule_id: boundary_use
      applies_to: "foreground_system_boundary"
      rule: "Keep milk-to-cheese/butter processing as machine function only; actual test media are burden-bearing test inputs, never a dairy product reference output. A functionally combined stretcher has a specific working mechanism; a separate generic heater is not automatically included."
      source_ids:
        - un-cpc3-2025
        - gea-cheese-2024
boundary_abstraction:
  declared_starting_condition: "Actual supplied sheet, tube, wire, chemicals and separately specified bought modules at receiving gate"
  starting_condition_role: "foreground_start"
  product_classification_scope: "Dedicated dairy-machine manufacture; classify multifunction or separately dispatched modules by actual design and supply boundary"
  recursive_input_rule: "A bought complete same-category machine or module is an upstream supplied input with its own boundary; do not unfold its embodied inputs again in assembly"
  upstream_dataset_requirement: "Link actual supplier-specific grade, technology, location, delivery and included operations once; unresolved providers remain explicit"
  disclosure: "Declare family, site/period, supplied options, exclusions, factory test and make/buy matrix"
