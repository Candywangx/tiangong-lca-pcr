allocation_rules:
  - rule_id: allocate_once
    applies_to: "foreground_burden_allocation"
    rule: "Assign job-specific inputs directly; allocate shared period inputs using measured causal machine hours, weld/finish area or metered work. Preserve rejects and rework attributable to accepted production; do not remove their burden from the numerator. Distinct configurations have distinct measured denominators."
    source_ids: []
  - rule_id: scrap_boundary
    applies_to: "foreground_burden_allocation"
    rule: "Record sold segregated scrap and actual treatment destinations separately; disclose the chosen recycling allocation model consistently with upstream suppliers. No undocumented avoided-production credit, and internal metal recirculation cancels in paired transfers."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "finished"
      record_type: "weighing"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "Each accepted machine"
      temporal_coverage: "Same attributable production period and accepted configuration"
      site_scope: "Manufacturer site and actual supplier interface"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "Calibration; lot/SDS/BOM; acceptance; sampling and uncertainty records"
    - protocol_id: cp_material
      process_id: "fabrication_surface_test_dispatch"
      flow_role: "material input"
      record_type: "ledger"
      raw_fields: "grade; supplier; lot; SDS concentration; delivered state; receipts; issues; returns; opening and closing stocks; attributable period Q; accepted count N"
      collection_method: "Reconcile actual weighed receipts and job issues with returns, stocks and BOM; split carrier water and identified formulation constituents without double counting solution mass."
      unit: "kg"
      frequency: "Each batch and period"
      temporal_coverage: "Same attributable production period and accepted configuration"
      site_scope: "Manufacturer site and actual supplier interface"
      aggregation_rule: "attributable period exchange / accepted machines"
      quality_evidence: "Calibration; lot/SDS/BOM; acceptance; sampling and uncertainty records"
    - protocol_id: cp_bom
      process_id: "assembly"
      flow_role: "bought module"
      record_type: "BOM"
      raw_fields: "drawing revision; make/buy; supplier boundary; delivered module mass; included motor/material/oil; N; Q"
      collection_method: "Match delivered module identifiers, weighed mass and supplier scope to acceptance BOM; include upstream burden once and only site additions separately."
      unit: "kg"
      frequency: "Each delivered lot"
      temporal_coverage: "Same attributable production period and accepted configuration"
      site_scope: "Manufacturer site and actual supplier interface"
      aggregation_rule: "attributable period exchange / accepted machines"
      quality_evidence: "Calibration; lot/SDS/BOM; acceptance; sampling and uncertainty records"
    - protocol_id: cp_utility
      process_id: "fabrication_assembly_test_services"
      flow_role: "electricity"
      record_type: "meter"
      raw_fields: "period and units; imports; on-site generation; exports; opening/closing storage; assigned fabrication/assembly/test/dispatch meters; residual; causal driver; Q; N"
      collection_method: "Use synchronized calibrated site meters and submeters; calculate shared service residual after already assigned consumption, with measured causal allocation. Reconcile source-specific imports, generation, exports and storage; investigate negative residual using actual combined measurement uncertainty, never clip to zero."
      unit: "kWh"
      frequency: "Each meter interval"
      temporal_coverage: "Same attributable production period and accepted configuration"
      site_scope: "Manufacturer site and actual supplier interface"
      aggregation_rule: "attributable period exchange / accepted machines"
      quality_evidence: "Calibration; lot/SDS/BOM; acceptance; sampling and uncertainty records"
    - protocol_id: cp_steam
      process_id: "test"
      flow_role: "purchased steam"
      record_type: "meter"
      raw_fields: "delivered kg; own delivered enthalpy MJ/kg; delivered pressure temperature quality; independently measured return kg; own return enthalpy MJ/kg; return pressure temperature; time/boundary; Q; N"
      collection_method: "Meter delivered steam and returned condensate separately at the same supplier interface. Obtain each term's own enthalpy from its measured state and traceable thermodynamic method using the same common enthalpy reference datum. Q in MJ = delivered kg times own delivered MJ/kg minus independently measured return kg times own return MJ/kg; no assumed enthalpy or unmeasured equal return mass. In-house steam uses actual boiler fuel and auxiliaries instead of a purchased-steam upstream burden."
      unit: "MJ"
      frequency: "Each recorded test"
      temporal_coverage: "Same attributable production period and accepted configuration"
      site_scope: "Manufacturer site and actual supplier interface"
      aggregation_rule: "attributable period exchange / accepted machines"
      quality_evidence: "Calibration; lot/SDS/BOM; acceptance; sampling and uncertainty records"
    - protocol_id: cp_gas
      process_id: "fabrication_test_services"
      flow_role: "gas input"
      record_type: "meter"
      raw_fields: "identified gas; composition; supplied property; calibrated quantity; pressure; temperature; reference volume state; density; boundary; Q; N"
      collection_method: "Convert gas volume to mass only using its own documented state-specific density; compressed-air reference conditions must match provider; no rated consumption substitutes for measured amount."
      unit: "kg; m3"
      frequency: "Each batch and meter interval"
      temporal_coverage: "Same attributable production period and accepted configuration"
      site_scope: "Manufacturer site and actual supplier interface"
      aggregation_rule: "attributable period exchange / accepted machines"
      quality_evidence: "Calibration; lot/SDS/BOM; acceptance; sampling and uncertainty records"
    - protocol_id: cp_water
      process_id: "surface_test_services"
      flow_role: "water balance"
      record_type: "meter"
      raw_fields: "supply; moisture of each input; return transfers; opening/closing bath and tank stocks; water in product/scrap/sludge/wastewater; evaporation; reaction water; actual destination; Q; N"
      collection_method: "Meter make-up separately from internal circulation; convert liquid volumes using own temperature/density and every wet material using its own moisture measurement. Cancel paired internal transfers and reconcile all terms at the actual site-period boundary."
      unit: "kg"
      frequency: "Each batch and period"
      temporal_coverage: "Same attributable production period and accepted configuration"
      site_scope: "Manufacturer site and actual supplier interface"
      aggregation_rule: "attributable period exchange / accepted machines"
      quality_evidence: "Calibration; lot/SDS/BOM; acceptance; sampling and uncertainty records"
    - protocol_id: cp_waste
      process_id: "fabrication_surface_test"
      flow_role: "waste"
      record_type: "weighing and assay"
      raw_fields: "separate stream; wet/dry mass; own moisture and species assay; recovered solvent; capture media loading; treatment/transfer destination; stocks; Q; N"
      collection_method: "Weigh each waste shipment and retained stock; sample the actual matrix. Resolve contained Fe, Cr, Ni or identified solvent using each stream's own matched assay and wet/dry basis, not feed composition. Record actual completed treatment boundary and do not count an off-site treatment release as direct factory emission."
      unit: "kg"
      frequency: "Each batch/shipment"
      temporal_coverage: "Same attributable production period and accepted configuration"
      site_scope: "Manufacturer site and actual supplier interface"
      aggregation_rule: "attributable period exchange / accepted machines"
      quality_evidence: "Calibration; lot/SDS/BOM; acceptance; sampling and uncertainty records"
    - protocol_id: cp_species
      process_id: "surface_services"
      flow_role: "species release"
      record_type: "sampling"
      raw_fields: "species and chemical form; compartment; stack/fugitive/discharge volume; own concentration; wet/dry and reference conditions; capture; destruction evidence; stock; uncertainty; Q; N"
      collection_method: "Use species-specific sampled releases or validated actual formulation balance at matching boundary. Capture into media is retention, not destruction; destruction needs actual performance evidence. Unexplained solvent residual is unresolved, not air. Carbon balance cannot establish CO or NOx. Separate CO2, CO, each NOx convention and each actual released metal form in the concrete dataset."
      unit: "kg"
      frequency: "Each relevant test and period"
      temporal_coverage: "Same attributable production period and accepted configuration"
      site_scope: "Manufacturer site and actual supplier interface"
      aggregation_rule: "attributable period exchange / accepted machines"
      quality_evidence: "Calibration; lot/SDS/BOM; acceptance; sampling and uncertainty records"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: period_basis
      applies_to: "physical production records"
      requirement: "For each configuration collect attributable period exchange Q including rejects/rework, accepted count N and sum of calibrated accepted net masses. Define M as this sum divided by N; derive item amount as Q/N and reference amount as Q divided by that same mass sum. No mixed-configuration average; reject, package and drained test-medium mass never enter denominator. Protocol aggregation per reference flow retains these raw-period fields."
      evidence: "cp_mass; cp_material; cp_bom"
    - id: own_assay
      applies_to: "physical material and species records"
      requirement: "For each contained Fe, Cr, Ni or other actual species, use EACH term's own matched assay and wet/dry basis for inputs, product, scrap, slag if present, sludge, wastewater, releases and stocks. Include measured reaction generation/consumption and cancel internal paired transfers; gross alloy mass is never contained-element mass. This rule does not impose composition assays on electricity or freight."
      evidence: "cp_material; cp_waste; cp_species"
    - id: closure_uncertainty
      applies_to: "material, water, solvent and utility balances"
      requirement: "Include opening stock plus inputs and measured reaction generation; reconcile product, each waste/release/return/export, closing stocks and reaction consumption. Water includes each input moisture, product/waste moisture, evaporation and wastewater; solvent includes retained product, recovered solvent, capture-media loading, independently evidenced destruction and all non-air destinations. Investigate closure against actual combined weighing, metering, sampling and allocation uncertainty, never universal tolerance or invented yield."
      evidence: "cp_water; cp_waste; cp_species; cp_utility"
    - id: route_state
      applies_to: "all conditional records"
      requirement: "Maintain applicability ledger: measured zero, documented not_applicable and unknown are different. Conditional actual species or grades absent from this candidate need an additional atomic card and matching provider identity; unresolved UUID or provider prevents final dataset use, not unsupported forced route exclusion."
      evidence: "BOM; route sheets; supplier boundary"
    - id: sanitary_scope
      applies_to: "supplied configuration and factory acceptance"
      requirement: "Retain actual food-contact grade, surface roughness/finish specification, weld and passivation procedure, seal approval and acceptance record. Brochure physical anti-sticking treatment is a counterexample to mandatory PTFE coating; select actual finish, not a generic coating assumption. Separate closed-loop service circulation from imported make-up."
      evidence: "tetra-sh6-2024; gea-cheese-2024"
validation_rules:
  - rule_id: validate_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual designed dairy function, complete supplied machine, declared modules, current accepted BOM and correct factory-gate reference; reject adjacent cream separator, generic heater, dairy product and service substitutions."
    source_ids:
      - un-cpc3-2025
  - rule_id: validate_mass
    applies_to: "foreground_dataset_conformance"
    rule: "Require calibrated accepted net mass and configuration/period correspondence for Q, N and mass sum; audit every conversion and retain rejects/rework in numerator."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "foreground_dataset_conformance"
    rule: "Enforce own_assay and closure_uncertainty for every actual physical material/species, water, solvent and stock balance. Investigate missing destinations and negative utility residuals using actual combined uncertainty; unresolved closure cannot be reported as zero or an inferred air emission."
    source_ids: []
  - rule_id: validate_upstream
    applies_to: "foreground_dataset_conformance"
    rule: "Check each make/buy substitution, actual provider boundary and utility source; eliminate embedded material/module duplicates, purchased steam/in-house boiler duplicates and total-meter/submeter duplicates. Steam delivered and returned terms have independent mass and own enthalpy at identical interface."
    source_ids: []
  - rule_id: validate_test
    applies_to: "foreground_dataset_conformance"
    rule: "Only actual factory test milk, water, cleaner and utilities are included; reject nameplate power, customer throughput and operating consumption as manufacturing defaults. Report each applicability, missing identity, missing factor and completeness honestly."
    source_ids:
      - tetra-sh6-2024
      - gea-bue-2026
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual same-configuration machine manufacture datasets and downstream process/lifecyclemodel projections with declared supply boundary"
  excluded_use: "Dairy-product production; milk-processing service; use-phase comparative performance; unresolved category substitution"
  required_metadata: "All reference qualifiers, route applicability, make/buy matrix, measured period denominators and provider links"
  required_quality_disclosure: "Unresolved UUIDs and providers; missing empirical ranges; route evidence; actual balance uncertainty and allocation; limitations of brochure evidence"
  update_trigger: "Design, BOM, sanitary finish, supplier, module scope, site/period, test recipe or utility source changes"
data_sources:
  - id: "un-cpc3-2025"
