    used_for: "Configured grinder/mixer, screen, PTO, dust collector and auger example only. Historical/model-specific operation facts; no factory intensity, generic mass, lifetime or universal configuration."
  - id: "kuhn-profile-configuration"
    type: "handbook"
    reference: "KUHN, PROFILE 2 CS mixer wagon, Exclusive KUHN mixing auger and Weighing system sections. https://www.kuhn.com/en/livestock/trailed-tmr-mixers/twin-auger-vertical-mixers/profile-2-cs"
    used_for: "Configured mixing auger, knives, drive and weighing options; no universal alloy, net mass or manufacturing quantities. Operational mixing test is not adopted as factory acceptance threshold."
  - id: "ghg-product-allocation-2011"
    type: "official_guidance"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), chapter9, printed p.63 / PDF p.65, tables9.1–9.2. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Historical allocation hierarchy only; no current comprehensive standard conformance assertion."
