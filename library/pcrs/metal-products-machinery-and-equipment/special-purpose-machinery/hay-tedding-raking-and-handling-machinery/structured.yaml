allocation_rules:
  - rule_id: allocation_measure
    applies_to: "shared_operations"
    rule: "Under cp_energy and cp_material, first separate by work order, meter and actual component routing. Where separation is infeasible, use recorded machine/tool time for energy and weighed stock/component issues for material; document the physical driver, covered products and reconciliation to total records. No equal-by-count allocation across dissimilar machine configurations without evidence."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "waste_outputs"
    rule: "Retain measured waste outputs and disclose treatment links separately; do not assume substitution credits or negative steel inputs from scrap sale. If a scrap stream is declared a saleable co-product, report its status and allocation separately with evidence and sensitivity; this PCR fixes no market-value ratio."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "assembly"
      flow_role: "finished_machine"
      record_type: "weighing"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each represented configuration and acceptance lot"
      temporal_coverage: "same production period"
      site_scope: "final acceptance station"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "scale calibration; weighing ticket; configuration list"
    - protocol_id: cp_configuration
      process_id: "assembly"
      flow_role: "route_and_completeness"
      record_type: "build records"
      raw_fields: "model; lot; BOM revision; serial; included options; acceptance count; routing; outsourced supplier gates"
      collection_method: "Reconcile purchase orders, work orders, signed BOM and acceptance records for exactly the declared configuration."
      unit: "record"
      frequency: "each lot"
      temporal_coverage: "same production period"
      site_scope: "factory and named suppliers"
      aggregation_rule: "accepted complete machines by configuration; rejects and rework retained separately"
      quality_evidence: "signed release and routing records"
    - protocol_id: cp_material
      process_id: "fabrication_finishing_assembly_packout"
      flow_role: "individual_material_input"
      record_type: "weighing and issue ledger"
      raw_fields: "row_id; grade; batch; issue mass; returns; stock change; job; accepted machine count; density for metered tap water; purity"
      collection_method: "Use calibrated scales, net issue/return ledgers and supplier specifications for each separate row. Include attributable rework. Metered water volume needs measured or supplier-confirmed density; retain raw unit and conversion."
      unit: "kg"
      frequency: "each issue and lot; water by meter interval"
      temporal_coverage: "representative production period declared with start/end dates"
      site_scope: "actual included operation; no cross-stage duplication"
      aggregation_rule: "attributable individual input mass / accepted machines of the same configuration"
      quality_evidence: "calibration; bills; stock reconciliation; density and composition evidence"
    - protocol_id: cp_parts
      process_id: "assembly"
      flow_role: "individual_finished_component"
      record_type: "BOM and weighing"
      raw_fields: "row_id; component part number; supplier; specification; installed count; net component mass; embodied lubricant; acceptance count"
      collection_method: "Match one specific component design to the BOM, weigh installed component deliveries and verify included subcomponents to prevent duplication. Retain counts as support, not as a substitute for kg."
      unit: "kg"
      frequency: "each component design and lot"
      temporal_coverage: "same production period"
      site_scope: "receiving and assembly"
      aggregation_rule: "attributable installed component mass / accepted machines of the same configuration"
      quality_evidence: "supplier drawings; weighing tickets; configuration reconciliation"
    - protocol_id: cp_energy
      process_id: "fabrication_finishing_assembly"
      flow_role: "individual_stage_electricity"
      record_type: "meter and operation log"
      raw_fields: "row_id; meter; voltage; energy kWh; interval; idle/rework; machine hours; allocated share; acceptance count"
      collection_method: "Use submetered readings; where shared, assign recorded machine time with reconciled measured load. Convert kWh to MJ using 3.6; reconcile stage totals to purchased supply and include pumping/air extraction where within the declared boundary."
      unit: "MJ"
      frequency: "meter interval and work order"
      temporal_coverage: "same production period"
      site_scope: "included factory operations"
      aggregation_rule: "attributable individual stage electricity / accepted machines of the same configuration"
      quality_evidence: "meter calibration; bills; allocation driver; balance"
    - protocol_id: cp_waste
      process_id: "fabrication_finishing"
      flow_role: "individual_exported_waste"
      record_type: "waste weighing and transfer"
      raw_fields: "row_id; composition; contamination; mass; recovery; destination; treatment gate; accepted machine count"
      collection_method: "Weigh each segregated waste exported to receiver, deduct internal returns, retain wastewater chemical analysis and identify treatment state. Do not infer environmental emissions from waste mass."
      unit: "kg"
      frequency: "each transfer and production lot"
      temporal_coverage: "same production period"
      site_scope: "actual generating operation"
      aggregation_rule: "attributable individual waste mass / accepted machines of the same configuration"
      quality_evidence: "transfer tickets; scales; composition tests; destination receipts"
    - protocol_id: cp_emission
      process_id: "fabrication"
      flow_role: "air_particulate"
      record_type: "outlet monitoring"
      raw_fields: "outlet concentration; exhaust volume; operating time; air medium; subcompartment; particle fraction; control; acceptance count"
      collection_method: "Measure actual post-control outlet concentration and exhaust volume for matched intervals. Calculate mass with retained units and sampling coverage; leave absence of measurement explicit, never fabricate an emission factor."
      unit: "kg"
      frequency: "representative operating intervals"
      temporal_coverage: "same production period with sampling gaps disclosed"
      site_scope: "actual outlet only"
      aggregation_rule: "attributable measured particulate mass / accepted machines of the same configuration"
      quality_evidence: "sampling report; calibration; unit calculation; applicability"
    - protocol_id: cp_groundwater
      process_id: "finishing"
      flow_role: "groundwater"
      record_type: "well meter"
      raw_fields: "well; country; aquifer; withdrawal m3; use; pumping energy; accepted machine count"
      collection_method: "Meter actual freshwater abstraction for included cleaning; separate supplied water and internal recirculation. Attribute pumping to cp_energy without duplicating delivered-water production."
      unit: "m3"
      frequency: "each meter interval"
      temporal_coverage: "same production period"
      site_scope: "factory freshwater well"
      aggregation_rule: "attributable groundwater withdrawal / accepted machines of the same configuration"
      quality_evidence: "meter calibration; abstraction licence; location and water identity"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_config
      applies_to: "all inventory rows"
      requirement: "Use the same accepted model/configuration and period throughout. Reconcile delivered component mass and stock issues to net machine mass, waste, returns and WIP changes; explain deviations, never force balance by inventing emissions."
      evidence: "cp_mass; cp_configuration; cp_material; cp_parts; cp_waste"
    - id: quality_coverage
      applies_to: "all inventory rows"
      requirement: "Reconcile every actual BOM item and operation to an atomic exchange or verified exclusion. Disclose missing UUIDs, suppliers, measurements, upstream links and temporal gaps. No universal cut-off percentage is set."
      evidence: "cp_configuration; cp_material; cp_parts; cp_energy"
    - id: quality_sources
      applies_to: "product_configuration"
      requirement: "Manufacturer examples establish only designs and possible routes, not general weights, lifetime, emissions or industry amounts. Older model documents are used as explicitly dated design examples."
      evidence: "kuhn-gf-13003-2023; kuhn-hay-parts; krone-vendro; krone-swadro"
validation_rules:
  - rule_id: validation_mass
    applies_to: "reference_flow"
    rule: "Require cp_mass with positive measured net M, exact configuration match and 1 kg finished_machine output. Every per-machine non-reference row applies normalize_mass in its native numerator unit."
    source_ids: []
  - rule_id: validation_route
    applies_to: "inventory_completeness"
    rule: "Check required assembly/acceptance and every actual conditional operation against routing. Check weights, counters, stock change, rework and stage energy reconciliation. Missing or unresolved evidence yields incomplete coverage, not a verified zero or methodology approval."
    source_ids: []
  - rule_id: validation_identity
    applies_to: "all inventory rows"
    rule: "Use exactly one physical exchange per row; verify UUID property, unit, route, concentration, fossil/biogenic origin and environmental medium. Check official Chinese names and English/Chinese row/rule identity parity. An identity gap blocks claims of a fully resolved dataset."
    source_ids: []
  - rule_id: validation_boundary
    applies_to: "dataset_claims"
    rule: "Reject a full cradle-to-gate claim without demonstrated compatible upstream, transport and treatment coverage. Reject a comparative field-service claim based only on equal machine mass."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured foreground machine-manufacturing module; this heading describes later dataset delivery, not PCR publication status."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply manufacturing inventory to an explicitly configured machine model; scale by measured net M only for that same configuration."
  excluded_use: "Hay yield, field-service comparisons, farm fuel, maintenance or lifetime estimates; full cradle-to-gate without documented upstream coverage; use as methodology approval."
  required_metadata: "All qualifiers, site and period, gates, detailed route, component supply and completeness, reference quantity, weighing and allocation protocols, upstream/treatment links."
  required_quality_disclosure: "Measurement uncertainty, sampling gaps, unresolved identities, missing links, rework/reject handling, omissions and proxy sensitivity."
  update_trigger: "Configuration/BOM, supply voltage or source, coating route, supplier gate, allocation driver or weighing protocol changes."
