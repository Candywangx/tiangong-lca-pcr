review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  semantic_boundary_decision: New semantic record for non-cutting tedding, raking
    and swath handling. Existing material baler PCR explicitly excludes other
    haymaking machinery. The old other-haymaking-machinery scaffold is read-only
    and is not promoted. No accepted classification mapping is asserted.
  scientific_review: pending independent methodology review
  unresolved:
    inventory_flow_uuids:
      - row_id: steel_sheet
        reason_code: identity_not_established
        explanation: The candidate ce3ac926 has a non-alloy name/classification but an
          alloy-steel general comment; other candidates confuse sheet, sections,
          alloy or bilingual identity. No unambiguous sheet identity adopted.
      - row_id: welding_wire
        reason_code: identity_not_established
        explanation: English and Chinese searches return generic wire, flux-cored wire,
          welding service or electrically conducting solid wire, not verified
          solid steel arc-welding consumable.
      - row_id: argon
        reason_code: identity_not_established
        explanation: Argon and 氩气 searches returned unrelated chemicals; no public
          product-flow identity was verified for pure argon shielding gas.
      - row_id: steel_grinding_dust
        reason_code: identity_not_established
        explanation: No compatible public solid steel-grinding-dust waste identity
          established; search candidates cannot substitute airborne particulate
          or mixed hazardous waste.
      - row_id: sodium_carbonate
        reason_code: identity_not_established
        explanation: Candidate 6827e314 is a hydrometallurgical-recycling-route flow;
          direct read does not establish compatibility with general purchased
          cleaning reagent hydration/purity and route.
      - row_id: powder_waste
        reason_code: identity_not_established
        explanation: Public generic candidate 363302a6 has reference property UUID
          d6b6a36c (Aluminium content), not Mass, despite its short-description
          label. Candidate 9aa53a82 is CN-specific; a generic factory scope
          cannot assume that geography.
      - row_id: cleaning_wastewater
        reason_code: identity_not_established
        explanation: Candidate 4f1a3f41 is publicly typed Product flow rather than Waste
          flow; other wastewater candidates have incompatible industrial routes
          or treatment states.
      - row_id: spring_tine
        reason_code: identity_not_established
        explanation: No verified finished haymaking spring-steel tine product identity;
          generic wire and baling wire do not represent this component.
      - row_id: rotor_gearbox
        reason_code: identity_not_established
        explanation: Search returned wind-turbine gearboxes or generic transmission
          candidates, not a verified haymaking rotor gearbox.
      - row_id: steel_bolt
        reason_code: identity_not_established
        explanation: Generic fastener and screw candidates do not establish
          hexagonal-head bolt type, grade and coating identity.
      - row_id: agricultural_tyre
        reason_code: identity_not_established
        explanation: Inspected public tyre candidates are motorcycle, bicycle,
          passenger-car or retreaded tyres; agricultural machinery compatibility
          not established.
      - row_id: pto_shaft
        reason_code: identity_not_established
        explanation: No compatible guarded agricultural PTO shaft identity; search
          candidates concern complete equipment, axles or unrelated compounds.
      - row_id: hydraulic_cylinder
        reason_code: identity_not_established
        explanation: Candidates are cylinder blanks, machined parts or aggregated
          subcomponent kits, not a complete hydraulic folding cylinder.
      - row_id: assembly_grease
        reason_code: identity_not_established
        explanation: No candidate establishes both mineral-oil origin and lithium-soap
          thickener; generic lubricant and textile-oil flows are incompatible.
      - row_id: polyethylene_film
        reason_code: identity_not_established
        explanation: Candidate e64eb06c names polyethylene film but is classified as
          luggage/handbags; source identity inconsistency and fossil-origin
          compatibility remain unresolved.
    evidence_needs:
      - No manufacturer source establishes factory inventory amounts or
        category-wide ranges. All applicable quantities require foreground
        collection; no weight, lifetime, loss or emission factor is invented.
      - Factory-specific BOM, actual route completeness, supply voltage, missing
        upstream/transport/treatment links and allocation drivers require
        dataset-level evidence before a complete manufacturing dataset claim.
