allocation_rules:
  - rule_id: allocation_causal
    applies_to: "foreground_burden_allocation"
    rule: "Subdivide configuration, route and meter records first. Allocate unavoidable shared shop electricity, air, heat and rejects by documented causal machine-hours/load; never by nameplate rating alone. Retain before/after allocation totals and sensitivity. This is a foreground collection requirement."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "foreground_burden_allocation"
    rule: "Segregate steel swarf, foundry returns, coating recovery and discarded modules. Cancel paired internal transfers; record external recoverable scrap and treatment once under the declared recycling model, without unsupported avoided-product credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "test_pack"
      flow_role: "reference output"
      record_type: "weighing"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each configuration and release"
      temporal_coverage: "production reporting period"
      site_scope: "declared plant gate"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration and weighing certificate"
    - protocol_id: cp_fabrication
      process_id: "fabrication"
      flow_role: "atomic exchanges"
      record_type: "factory records"
      raw_fields: "row_id; material/specification; gross/contained amount; meter; batch; inventory opening/closing; accepted count; allocation driver; test load and duration; recipient"
      collection_method: "Reconcile issue/return ledgers, calibrated meters, BOM revision, waste manifests and accepted serial numbers. Derive each attributable raw amount per accepted machine of the same configuration; retain shared period totals and causal allocation."
      unit: "row unit"
      frequency: "batch and monthly reconciliation"
      temporal_coverage: "same production reporting period"
      site_scope: "declared route at plant"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "purchase/SDS/grade certificates; meters; stock reconciliation; acceptance logs"
    - protocol_id: cp_foundry
      process_id: "foundry"
      flow_role: "atomic exchanges"
      record_type: "factory records"
      raw_fields: "row_id; material/specification; gross/contained amount; meter; batch; inventory opening/closing; accepted count; allocation driver; test load and duration; recipient"
      collection_method: "Reconcile issue/return ledgers, calibrated meters, BOM revision, waste manifests and accepted serial numbers. Derive each attributable raw amount per accepted machine of the same configuration; retain shared period totals and causal allocation."
      unit: "row unit"
      frequency: "batch and monthly reconciliation"
      temporal_coverage: "same production reporting period"
      site_scope: "declared route at plant"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "purchase/SDS/grade certificates; meters; stock reconciliation; acceptance logs"
    - protocol_id: cp_surface
      process_id: "surface"
      flow_role: "atomic exchanges"
      record_type: "factory records"
      raw_fields: "row_id; material/specification; gross/contained amount; meter; batch; inventory opening/closing; accepted count; allocation driver; test load and duration; recipient"
      collection_method: "Reconcile issue/return ledgers, calibrated meters, BOM revision, waste manifests and accepted serial numbers. Derive each attributable raw amount per accepted machine of the same configuration; retain shared period totals and causal allocation."
      unit: "row unit"
      frequency: "batch and monthly reconciliation"
      temporal_coverage: "same production reporting period"
      site_scope: "declared route at plant"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "purchase/SDS/grade certificates; meters; stock reconciliation; acceptance logs"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "atomic exchanges"
      record_type: "factory records"
      raw_fields: "row_id; material/specification; gross/contained amount; meter; batch; inventory opening/closing; accepted count; allocation driver; test load and duration; recipient"
      collection_method: "Reconcile issue/return ledgers, calibrated meters, BOM revision, waste manifests and accepted serial numbers. Derive each attributable raw amount per accepted machine of the same configuration; retain shared period totals and causal allocation."
      unit: "row unit"
      frequency: "batch and monthly reconciliation"
      temporal_coverage: "same production reporting period"
      site_scope: "declared route at plant"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "purchase/SDS/grade certificates; meters; stock reconciliation; acceptance logs"
    - protocol_id: cp_test_pack
      process_id: "test_pack"
      flow_role: "atomic exchanges"
      record_type: "factory records"
      raw_fields: "row_id; material/specification; gross/contained amount; meter; batch; inventory opening/closing; accepted count; allocation driver; test load and duration; recipient"
      collection_method: "Reconcile issue/return ledgers, calibrated meters, BOM revision, waste manifests and accepted serial numbers. Derive each attributable raw amount per accepted machine of the same configuration; retain shared period totals and causal allocation."
      unit: "row unit"
      frequency: "batch and monthly reconciliation"
      temporal_coverage: "same production reporting period"
      site_scope: "declared route at plant"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "purchase/SDS/grade certificates; meters; stock reconciliation; acceptance logs"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: configuration
      applies_to: "all inventory rows"
      requirement: "Never pool dobby/Jacquard or different module/drive counts without disclosed separate configurations. Every bought assembly versus fabricated material is mutually reconciled."
      evidence: "drawings; approved make/buy BOM"
    - id: balances
      applies_to: "material, chemical and species records"
      requirement: "For each actual material and chemical species close inputs plus opening stocks against accepted product, rejected product, external scrap, treatment transfers, emissions and closing stocks, including measured reaction formation/consumption. Measure moisture and the relevant metal/species assay separately on EACH applicable term: feedstock, product, swarf, dust, slag, sludge and residual solution; do not impose one common assay or equate gross metal/sludge mass with contained element. Paired internal transfers cancel only with matched material, species, period and quantity. Report residual and combined uncertainty from actual weighing, sampling, assays, meters and allocation; investigate significant disagreement using that documented uncertainty, never an invented universal tolerance."
      evidence: "weighing; assays; stock records"
    - id: water_closure
      applies_to: "water and moisture records"
      requirement: "Close purchased and extracted make-up water, input moisture and opening liquid stocks against shipped moisture, wastewater, sludge/sand moisture, test discharge, evaporation and closing stocks; include reaction water formed/consumed when relevant. Internal cooling, dilution and return water cancel as paired transfers, not fresh inputs. Use actual evaporation measurement or independently supported calculation and quantify its uncertainty."
      evidence: "water meters; moisture samples; stock and reaction records"
    - id: solvent_closure
      applies_to: "actual solvent or organic coating records"
      requirement: "For each actual solvent species, reconcile charged amount and opening stock to retained film, recovered solvent, capture media, wastewater, sludge, air release and closing stock; destruction requires actual control-device destruction evidence and reaction products. Capture is not destruction, and non-air residuals do not disappear. Keep uncertainties from flow, composition and control performance explicit."
      evidence: "SDS; species assays; control reports; residue manifests"
    - id: emissions
      applies_to: "emission species records"
      requirement: "Add each actual species and air/water/soil compartment separately. Fuel carbon balance cannot prove CO, NOx or coating solvent emissions; use species-specific measured/factor evidence and controls. No default empirical range is supplied."
      evidence: "test reports; SDS; factor provenance"
    - id: coverage
      applies_to: "all inventory rows"
      requirement: "Document present, absent, not applicable and unknown separately. Unknown grade, UUID, provider or amount is a gap, not zero. Include actual scrap, rework, packaging and pre-gate test textile/utility media."
      evidence: "route coverage and gap register"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Verify complete auxiliary delivery boundary and actual host interface; reject main-machine, spare-part or textile-product reference substitution."
    source_ids:
      - un-cpc3-textile
      - un-hs844811
  - rule_id: validate_measurement
    applies_to: "foreground_dataset_conformance"
    rule: "Require positive measured same-configuration net mass, accepted output linkage, every row protocol and explicit q_item/M conversion; packaging excluded from M. Factory metering rather than rated power establishes consumption."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "foreground_dataset_conformance"
    rule: "Check full route/make-buy coverage, stock balances and upstream burdens once. Require supplier identity for each concrete dataset and species-specific emissions. Unresolved generic output identity blocks finalized identity/publication even when measurement contract passes."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing datasets for the declared complete auxiliary configuration and downstream process/lifecyclemodel projections."
  excluded_use: "Textile mill operation, host-loom manufacture, generic accessory production or mass-only comparisons of function."
  required_metadata: "Family, model, interfaces, module/shaft count, included components, make/buy route, plant/year, measured net mass and acceptance."
  required_quality_disclosure: "UUID/provider and chemical-grade gaps, actual measured values, allocation, exclusions and source limits. No invented lifetime or efficiency."
  update_trigger: "BOM/configuration, route, supplier, controller/selection mechanism or acceptance test changes."
data_sources:
  - id: "un-cpc3-textile"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Explanatory Notes (30 June 2025), pp. 237–238. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Current auxiliary/main-machine/parts boundary."
  - id: "un-hs844811"
    type: "official_guidance"
    reference: "UNSD HS 2012 844811. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/32/844811"
    used_for: "Dobby/Jacquard and card machinery examples; correspondence expressly CPC2.1, corroborative only."
  - id: "staubli-s3200"
    type: "handbook"
    reference: "Stäubli Rotary dobby series S3200, public product specification. https://www.staubli.com/global/en/textile/products/dobby-machine/rotary-dobby-series-s3200.html"
    used_for: "Housing, transmission, control and conditional cooling configuration; no grade or factory energy defaults."
  - id: "staubli-sx-pro"
    type: "handbook"
    reference: "Stäubli SX PRO, public product specification. https://www.staubli.com/global/en/textile/products/jacquard-machine/flat-terry-technical-fabric-sx-pro.html"
    used_for: "Knife/selection modules, integrated power, controller, ventilation and configured harness; counterexample to universal dobby recipe."
  - id: "bonas-ji"
    type: "handbook"
    reference: "BONAS Ji Jacquards, Product tour. https://bonas.be/components/ji-jacquards"
    used_for: "Independent electronic microselection, double-cam drive, controller and customized harness technology. No manufacturing mass/energy factor."
