  unresolved_reference_flow_uuid: Finished configuration-specific textile auxiliary identity remains unresolved; textile products, complete looms and spare parts cannot substitute. Mass property and kg unit linkage verified.
  unresolved_inventory_uuids: Only Chinese user-side medium-voltage Alternating current has a directly verified adopted UUID. Grade-specific metals, bought auxiliaries, fluids, electronics, test yarn, wastes and elementary species need actual site-specific identity checks.
  unresolved_quantitative_ranges: No machine weight, factory power, efficiency, lifetime, yield or emission range is adopted. Collect actual BOM, same-configuration accepted net mass, route records and factory test consumption.
  unresolved_recipe_and_provider_evidence: Material-grade and chemical cards are conditional examples, not manufacturer BOM claims. Actual supplier grade, bath/coating formulation, foundry charge, refrigerant, hydraulic medium and emission species must be established; add each actual atomic exchange.
  unresolved_source_access: Direct Stäubli HTML acquisition returned 403; public original web sections were inspected for S3200 and SX PRO configuration features. BONAS acquired original supplies independent Jacquard evidence. No detailed supplier factory recipe was recovered.
  mapping_review: CPC3 44614 label and adjacent complete-machine/parts boundaries verified. HS844811 correspondence is CPC2.1 corroboration only. Other auxiliary families require delivered apparatus evidence; no blanket extension from spare-part examples.
  identity_rejections:
    - Textile/fabric search results are textile products, not auxiliary equipment.
    - Broad steel candidates with contradictory EN/ZH forms or missing actual grade are not adopted.
    - Waste-incineration electricity and Brazil-specific user electricity are not Chinese grid inputs.
