allocation_rules:
  - rule_id: allocation_direct
    applies_to: "shared_operations"
    rule: "Subdivide by actual work order, stage and single configuration before allocation. Assign material/component issues, rework and acceptance measurements directly where traceable; water-pressure presses and electric mills do not share an assumed per-unit factor."
    source_ids: []
  - rule_id: allocation_physical
    applies_to: "shared_energy_water_support"
    rule: "Collect physical drivers with an evidenced causal relation: measured machine-power profiles times machining/welding hours, cure-batch loads, test rig meter/time or actual cleaning-bath use. Reconcile assigned quantities to metered totals and accepted configuration counts. If no relationship is established, retain unresolved allocation and sensitivity; no generic equal-count or mass split or economic percentage."
    source_ids: []
  - rule_id: allocation_waste_rejects
    applies_to: "exports_and_rework"
    rule: "Include attributable rejects, failed tests and repeated finishing in quantities per accepted output for the same configuration and period. Identify exported scrap/waste and receiver route; internal returns/recovery are netted in records. No automatic avoided virgin-metal or waste-treatment credit. Any genuine co-product designation needs a documented market and boundary decision, not the presence of scrap alone."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "factory_test"
      flow_role: "finished_machine"
      record_type: "calibrated weighing and acceptance"
      raw_fields: "model; configuration; serial number; accepted net mass M; installed accessories; fluid/drain state; excluded spares/packaging"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each unit or justified configuration-specific sample"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration; installed BOM; drain/fill; acceptance; sampling"
    - protocol_id: cp_configuration
      process_id: "all_processes"
      flow_role: "actual route"
      record_type: "BOM and routing review"
      raw_fields: "single design; BOM revision; supplier completeness; alloy/compound; food-contact declaration; work orders; rework; accepted count; outsourced gates"
      collection_method: "Crosswalk each actual item and operation to a row or justified exclusion. Separate water-pressure and electric-mill designs, installed accessories and loose spares, and purchased finished assemblies from site-made parts."
      unit: "record"
      frequency: "each configuration change and batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "one coherent configured route record"
      quality_evidence: "BOM; purchase specification; supplier declarations; gate and work records"
    - protocol_id: cp_material
      process_id: "fabrication_finishing_factory_test_packout"
      flow_role: "individual stock/reagent/liquid/packaging"
      record_type: "stock issue and weighing"
      raw_fields: "individual substance/product; grade/formulation; purity; issue/return; stock/WIP change; volume/density/temperature; accepted count"
      collection_method: "Weigh net attributable issues and reconcile stocks, returns and internal recovery. Retain density/temperature for liquid volume conversion; weigh 40% nitric solution as solution and solid NaOH as delivered, with dilution water separate. Keep test water inside manufacturing and operating water outside."
      unit: "kg"
      frequency: "each issue and batch reconciliation"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable net material mass / accepted machines of the same configuration"
      quality_evidence: "scale; stock ledger; supplier specification; SDS; recipe; density"
    - protocol_id: cp_parts
      process_id: "assembly"
      flow_role: "single finished component"
      record_type: "receipt, weighing and build list"
      raw_fields: "part number; one design; supplier; count; measured mass; included fittings/subparts; installed status; accepted count"
      collection_method: "Use actual delivered mass or lot-specific verified count-to-mass data for each single component. Document supplied basket, bag, screens, membrane or rotor completeness and prevent duplicate stock/subpart accounting. No catalogue power/volume-to-mass factor."
      unit: "kg"
      frequency: "each supply lot and assembly batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable installed component mass / accepted machines of the same configuration"
      quality_evidence: "scale; supplier inclusion; lot mass; installed BOM"
    - protocol_id: cp_energy
      process_id: "fabrication_finishing_assembly_factory_test"
      flow_role: "electricity"
      record_type: "meter and causal driver ledger"
      raw_fields: "stage; voltage/source; meter kWh; interval; shared total; driver; idle/rework; accepted count"
      collection_method: "Meter each actual stage; convert kWh to MJ using 1 kWh = 3.6 MJ. Retain measured allocation-driver totals and reconcile shared meters, idle and rework. Water-driven product does not imply zero factory energy."
      unit: "MJ"
      frequency: "each meter interval and batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable electrical energy / accepted machines of the same configuration"
      quality_evidence: "meter calibration; electricity bills; stage/driver records"
    - protocol_id: cp_waste
      process_id: "fabrication_finishing_factory_test"
      flow_role: "single exported waste"
      record_type: "container or weighbridge balance"
      raw_fields: "individual waste; composition; contamination; mass; recovery; receiver gate; accepted count"
      collection_method: "Weigh segregated actual exports and reconcile stocks/recovery. Distinguish acid and alkaline baths, dry collected dust, spent abrasive discs and airborne releases; retain receiver and treatment records. Volume-only records require evidenced mass conversion."
      unit: "kg"
      frequency: "each export and batch balance"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable exported waste mass / accepted machines of the same configuration"
      quality_evidence: "scale; receiver receipts; composition; treatment boundary"
    - protocol_id: cp_emission
      process_id: "fabrication"
      flow_role: "single air substance"
      record_type: "post-control outlet monitoring"
      raw_fields: "species; concentration/unit; gas flow/volume; interval; moisture/temperature/pressure; control; particle-size fraction; medium/submedium; accepted count"
      collection_method: "Calculate one substance mass from post-control concentration and exhaust volume measured on the same interval, retaining unit conversion, moisture/temperature basis and sampling coverage. Specify actual particle fraction and medium; do not infer gaseous metal emissions, mandatory release or zero from missing data."
      unit: "kg"
      frequency: "representative actual emitting intervals"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable measured substance mass / accepted machines of the same configuration"
      quality_evidence: "monitoring report; calibration; sample coverage; conversion"
    - protocol_id: cp_water_resource
      process_id: "finishing"
      flow_role: "groundwater abstraction"
      record_type: "well meter and site record"
      raw_fields: "well; freshwater origin; country/location; m3; interval; stage use; internal reuse; accepted count"
      collection_method: "Read calibrated well volume meter for actual factory freshwater groundwater abstraction; subdivide stage use and reconcile withdrawals without counting recirculation as new abstraction. Retain country/location and separately inventory pumping/treatment."
      unit: "m3"
      frequency: "each meter interval and batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable abstracted water volume / accepted machines of the same configuration"
      quality_evidence: "meter; well/source evidence; country; stage water balance"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "all inventory rows"
      requirement: "Use one design/configuration and period for M, quantities and accepted count; reconcile installed BOM, factory fill/drain, stock/WIP changes, waste and returns. Do not mix membrane press and motorised mill by equal mass."
      evidence: "cp_mass; cp_configuration; cp_material; cp_parts; cp_waste"
    - id: quality_coverage
      applies_to: "inventory_and_links"
      requirement: "Disclose missing identity, component, upstream/transport/treatment links, causal allocation, weighing and monitoring coverage. Quantities require actual primary records, not manufacturer brochure factors. No universal cutoff, machine mass, lifetime, purity conversion or emission factor."
      evidence: "cp_configuration; cp_energy; cp_emission; cp_water_resource"
    - id: quality_sources
      applies_to: "design_examples"
      requirement: "Two manufacturers provide independent design documentation but not quantitative factory measurements. Speidel supports a model-specific natural-rubber water-pressure press; Voran 3/18 supports only historical mill configuration and AISI304 example. Do not use apparent mislabelled technical rows for power or assume current availability, generic alloy, operating demand or regulatory compliance."
