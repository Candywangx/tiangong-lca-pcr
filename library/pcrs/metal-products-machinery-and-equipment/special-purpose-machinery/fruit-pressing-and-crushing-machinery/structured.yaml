product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.special-purpose-machinery.fruit-pressing-and-crushing-machinery"
  classification_refs: "CPC 3.0 44191; candidate narrower semantic boundary; no accepted mapping"
  covered_products: "New complete configured fruit presses and fruit crushers/mills"
  excluded_products: "Beverages, cultivation, standalone washing/lifting/thermal/filling equipment, non-fruit crushers and separately sold parts"
  representative_product: "One declared water-pressure diaphragm press; a separately declared electric centrifugal fruit mill is an alternative configuration, not the same reference product"
  production_route: "Receipt and make-or-buy control; actual metal fabrication; route-specific finishing; working mechanism/support/control fitting; acceptance; optional packaging"
  market_state: "Accepted complete machine at declared factory gate, loose spares and packaging excluded from net machine mass"
functional_unit:
  what: "Manufacture one declared complete fruit press or crusher; no beverage-processing service"
  how_much: "1 kg of accepted net complete configured machine; multiply by measured M for one actual unit"
  how_well: "Meet declared model-specific dimensional, food-contact material/surface and factory functional acceptance, including pressure/leak/relief function for fitted press hardware or rotor clearance/guards/start-stop checks for the actual mill; no generic pressure, throughput or juice yield"
  how_long_or_cycle: "One manufacturing delivery; no operating lifetime or litres of juice assigned"
  reference_flow_link: "finished_machine"
system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "manufacturing"
      rule: "Include receipt checks, actually performed cutting/forming/drilling/machining/welding/grinding, route-specific surface treatment, configured assembly, inspection/acceptance, attributable rework/rejects and packout. Buying a motor, moulded membrane or cast cover does not establish site motor manufacture, rubber moulding or casting. Outsourced fabrication requires explicit supplier gates."
      source_ids: []
    - rule_id: boundary_actual_bom
      applies_to: "inventory"
      rule: "Reconcile every actual BOM item and operation to an atomic exchange or documented exclusion. Add separate actual covers, juice channels, stand, wheels, hoses, connectors, bolts/nuts/washers, drive couplings, guards, interlocks, actuator, hydraulic pump/oil, cutting-fluid recipe, treatment reagents/residues and measured releases where present. A water-pressure diaphragm does not require an oil-hydraulic cylinder or electric drive. Initial cards are not a universal complete BOM."
      source_ids: []
    - rule_id: boundary_factory_test
      applies_to: "factory_test"
      rule: "Include actual factory pressure test or powered acceptance energy, water and recorded wastes. Water-pressure design establishes operating principle, not continuous factory water demand. Later fruit processing, yields and cleaning belong to use. A fruit-loaded acceptance test, if actually performed, expands fruit input and each specific output/waste at this gate with test records; it is not presumed for every machine."
      source_ids: []
    - rule_id: boundary_product_split
      applies_to: "reference_product"
      rule: "Keep standalone fruit presses and mills separate from beverage products and container filling/packaging equipment. Declare included installed accessories; model a separately delivered spare screen or upstream washer separately and never divide a combined line by one machine M."
      source_ids:
        - speidel-hydropress-2025
        - voran-fruit-mills-2018
boundary_abstraction:
  declared_starting_condition: "Declared stock and separately specified finished components received at machine factory"
  starting_condition_role: "Inputs to a foreground manufacturing module; supplier production and incoming transport separately linked"
  product_classification_scope: "Configured complete fruit pressing/crushing machine within CPC44191; not a beverage production system"
  recursive_input_rule: "A bought complete machine is a supplier-gated input; do not duplicate this factory module recursively. Purchased baskets and rotors replace their site fabrication route."
  upstream_dataset_requirement: "Match alloy, finished component completeness, chemistry, concentration, electricity source/voltage, transport, geography and waste treatment; disclose missing links"
  disclosure: "Declare actual operations, outsourced gates, overhead allocation, packaging and supplier links. This foreground-only module does not establish complete cradle-to-gate coverage without compatible upstream, transport and treatment activities."
