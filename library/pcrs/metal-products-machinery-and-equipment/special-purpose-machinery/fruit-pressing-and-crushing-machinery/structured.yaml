  - id: electricity_energy
    applies_to: "electricity_fabrication; electricity_finishing; electricity_assembly; electricity_factory_test"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain metered kWh; exact conversion 1 kWh = 3.6 MJ. Match supply below 1 kV and grid-average sourcing; do not convert electricity to mass."
