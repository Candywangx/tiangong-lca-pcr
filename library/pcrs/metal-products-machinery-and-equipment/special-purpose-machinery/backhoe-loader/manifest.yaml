review_metadata:
  semantic_boundary_decision: Narrower complete wheeled backhoe-loader
    manufacturing boundary integrates front loading, rear limited-swing backhoe
    and stabilizers on one self-propelled chassis. Excludes front-loader-only
    and360-degree revolving excavators and other n.e.c. CPC44427 machinery.
    Existing material independent-bucket PCR excludes host machine; agricultural
    tractor and cylinder PCRs own different delivered units. New semantic
    identity; old scaffold/id remains read-only. No accepted classification
    mapping asserted.
  scientific_review: pending independent methodology review
