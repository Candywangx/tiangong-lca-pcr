allocation_rules:
  - rule_id: allocation_direct
    applies_to: "shared_operations"
    rule: "Subdivide by work order, stage and configuration first. Assign traceable stock/component issues, fabrication, rework and tests directly. Different cab, bucket, drivetrain and option configurations cannot share an assumed per-machine inventory."
    source_ids: []
  - rule_id: allocation_physical
    applies_to: "shared_energy_support"
    rule: "Use measured causal drivers: actual load/power with fabrication or assembly/test hours, coating-batch load, consumable use across served orders, or fuel issues/burn/retention. Reconcile assignments to measured totals and accepted same-configuration count. Unsupported relationships require review/sensitivity; no default mass split, equal-count split or economic percentage."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "rejects_waste"
    rule: "Include attributable failed units, rejected parts, rework and retests per accepted same-configuration output in the same period. Net documented returns and internal recovery. Waste exports do not automatically earn avoided-primary-material credits. Genuine co-products need documented market/boundary decisions."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "factory_test"
      flow_role: "finished_machine"
      record_type: "calibrated weighing and acceptance"
      raw_fields: "model; configuration; serial number; accepted net mass M; installed buckets/options; retained fluid/fuel; operator/soil/packaging exclusion"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each unit or justified configuration-specific sample"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration; installed BOM; fill state; acceptance; sampling"
    - protocol_id: cp_configuration
      process_id: "all_processes"
      flow_role: "actual route"
      record_type: "BOM and route review"
      raw_fields: "single configuration; BOM revision; supplier completeness; make-or-buy; each cylinder/tyre/bucket design; acceptance count; gates; rejects/rework"
      collection_method: "Crosswalk every actual item and operation to one row or justified exclusion; reconcile front/rear working equipment, stabilizers, operator station, drivetrain, hydraulic/control systems and installed options. Retain configuration-specific acceptance limits/results and fill/retention state."
      unit: "record"
      frequency: "each change and batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "one coherent configuration record"
      quality_evidence: "BOM; suppliers; routing; acceptance; outsourcing"
    - protocol_id: cp_material
      process_id: "fabrication_finishing_assembly_packout"
      flow_role: "individual material"
      record_type: "weighed stock/formulation issues"
      raw_fields: "one grade/design/formulation; net issue/return; WIP; recovery; concentration/basis; density/temperature; accepted count"
      collection_method: "Weigh attributable net issues and reconcile stock, returns, recovery and served orders. Retain supplier chemistry and delivered state. Convert volume only with evidenced actual density/temperature; account for supplier fill and exclude ingredients inside bought ready mixtures. No standard consumption or dilution factor."
      unit: "kg"
      frequency: "each issue and batch balance"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable net material mass / accepted machines of the same configuration"
      quality_evidence: "scale; ledger; SDS; recipe; certificate; density"
    - protocol_id: cp_parts
      process_id: "assembly"
      flow_role: "single finished component"
      record_type: "receipt weighing and build list"
      raw_fields: "one part number/design; actual count; mass; included subparts; delivered fill; installed state; accepted count"
      collection_method: "Use measured delivered mass or verified lot-specific count-to-mass records. Reconcile each design of cylinder, tyre/rim, bucket and drivetrain, included subparts and installation. No engine power, bucket volume or hydraulic displacement-to-mass factor; a purchased assembly excludes its internal parts from additional issues."
      unit: "kg"
      frequency: "each lot and build batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable installed component mass / accepted machines of the same configuration"
      quality_evidence: "scale; supplier inclusion; installed BOM; lot mass"
    - protocol_id: cp_energy
      process_id: "fabrication_finishing_assembly_factory_test"
      flow_role: "electricity"
      record_type: "meter and causal driver ledger"
      raw_fields: "stage; voltage/source; meter kWh; interval; shared total; driver; idle/rework; accepted count"
      collection_method: "Meter actual stages; convert kWh to MJ using1 kWh =3.6 MJ. Reconcile measured shared totals, actual load/time drivers, idle, rejects and retests. No rated-power-times-invented-hours quantity."
      unit: "MJ"
      frequency: "each interval and batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable electrical energy / accepted machines of the same configuration"
      quality_evidence: "meter calibration; bills; driver/time records"
    - protocol_id: cp_fuel
      process_id: "factory_test"
      flow_role: "diesel"
      record_type: "fuel issue/burn/retention balance"
      raw_fields: "fuel certificate/origin/blend; issued/returned mass; initial/final tanks; burned test fuel; retained delivery fuel; density/temperature; accepted count"
      collection_method: "Weigh attributable net factory fuel issues and reconcile actual test burn, returns, tank changes and final delivery retention. Retain actual density for litres conversion and fossil-only certificate for this row. Delivered retained fuel is included once in M and is not burned for emission calculation."
      unit: "kg"
      frequency: "each test unit and batch balance"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable net issued diesel mass / accepted machines of the same configuration"
      quality_evidence: "scale; fuel ledger; supplier certificate; tanks; actual burn"
    - protocol_id: cp_waste
      process_id: "fabrication_finishing_factory_test"
      flow_role: "individual exported waste"
      record_type: "segregated weighing and receiver receipts"
      raw_fields: "individual waste; composition; wet/dry; oil contamination; mass; recovery; receiver/treatment; accepted count"
      collection_method: "Weigh segregated exports and reconcile stock and recovery. Keep clean steel offcuts, collected steel dust, spent abrasive disc, overspray, oil and washing solution separate. Retain receiver gate/composition and evidenced mass conversion. Internal circulation and retained machine fill are not exported waste."
      unit: "kg"
      frequency: "each export and batch balance"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable exported waste mass / accepted machines of the same configuration"
      quality_evidence: "scale; composition; receiver/treatment evidence"
    - protocol_id: cp_emission
      process_id: "fabrication_factory_test"
      flow_role: "single air substance"
      record_type: "post-control monitoring/speciation"
      raw_fields: "substance; source; concentration; exhaust volume; interval; temperature/pressure/moisture; medium/submedium; size; control; actual fuel/carbon terms; accepted count"
      collection_method: "Calculate one substance mass from same-interval post-control concentration and exhaust volume with evidenced conversion/sampling. A fuel-specific carbon balance must document actual burned fuel carbon, fossil origin, carbon in other outputs and uncertainty; no universal factor. NO, NO2, N2O and NOx equivalents are not interchangeable. Separate captured solids and retained fuel; missing measurements are not zero."
      unit: "kg"
      frequency: "representative actual emitting intervals"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable measured substance mass / accepted machines of the same configuration"
      quality_evidence: "monitoring; calibration; speciation; carbon balance; conversion"
    - protocol_id: cp_water_resource
      process_id: "finishing"
      flow_role: "groundwater"
      record_type: "well meter and site record"
      raw_fields: "freshwater source; well; country/site; m3; interval; stage use; reuse; accepted count"
      collection_method: "Read calibrated well volume meter for actual factory freshwater groundwater abstraction. Retain location, reconcile stage water use and separately account for pumping/treatment. Do not count recirculation as new abstraction or the same resource as supplied tap water."
      unit: "m3"
      frequency: "each interval and batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable abstracted water volume / accepted machines of the same configuration"
      quality_evidence: "meter; source/location; stage water balance"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "all inventory rows"
      requirement: "Use the same configuration and period for positive M, exchange numerators and accepted count. Reconcile installed buckets/options, supplier internals/fills, stock versus finished modules, fuel burn/retention, WIP, rejects and recovery; retain measurement/sampling uncertainty."
      evidence: "cp_mass; cp_configuration; cp_parts; cp_material; cp_fuel"
