system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "manufacturing"
      rule: "Include receipt inspection and actual plate cutting/forming, joining, pivot/interface machining, grinding/cleaning/finishing, drivetrain/hydraulic/working-equipment assembly, wiring, first fill, acceptance, attributable rejects/rework and dispatch protection. Welding at JCB2015 does not require robot welding at every factory. Do not infer an on-site foundry, heat treatment, cylinder manufacture or engine manufacture from bought parts; actual local/outsourced routes need their own exchanges and gates."
      source_ids:
        - jcb-backhoe-loader-2015
    - rule_id: boundary_bom
      applies_to: "all inventory rows"
      rule: "Crosswalk every actual BOM item and operation to one atomic exchange or justified exclusion. Expand separately supplied cooling radiator, fuel tank, exhaust aftertreatment, filters, seals, pins, hoses/fittings, wiring/sensors, brakes, steering, seat, glazing and counterweights where present; never duplicate internals inside bought engine/cab/axle modules. Add each actual cleaner, welding-gas constituent, heat fuel, DEF formulation, test fixture consumable, waste and monitored release individually. Initial cards are not a universal complete BOM."
      source_ids: []
    - rule_id: boundary_test
      applies_to: "factory_test"
      rule: "Record actual steering/braking, hydraulic leak/pressure, loader/backhoe motions, stabilizers, controls and functional acceptance; retain applied load, test duration and results from the actual plan. Include factory engine running, electrical support, fill/makeup/drain and retests only as performed. Factory test fuel is not an operating-life profile; no universal test duration or excavation cycle."
      source_ids: []
    - rule_id: boundary_semantic
      applies_to: "reference_product"
      rule: "Independent bucket PCR owns separately delivered attachments and excludes host machine; agricultural tractor PCR owns agricultural traction units; cylinder PCR owns separately supplied cylinders. This integrated front/rear backhoe-loader manufacturing boundary does not duplicate those products. Keep the old classification scaffold/id unchanged and assert no accepted mapping."
      source_ids: []
