allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "foreground_burden_allocation"
    rule: "Avoid allocation by metering fabrication, coating, assembly, testing and treatment operations separately for the declared product family wherever practicable."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "foreground_burden_allocation"
    rule: "When shared operations cannot be subdivided, allocate measured burdens using the causal driver recorded for that operation, such as machine time, coated area, weld length or measured energy; use mass only when no more causal record exists and disclose the sensitivity."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "foreground_burden_allocation"
    rule: "Report scrap and other waste at the point it leaves the foreground. Do not subtract an avoided virgin-material burden inside the manufacturing inventory; identify the chosen recycling or treatment modelling convention separately so downstream models can avoid double counting."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "foreground_burden_allocation"
    rule: "Assign rework and rejected-part burdens to the conforming output of the same production period unless the rejected material leaves as a separately modelled co-product; disclose any alternative treatment."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "material_fabrication_surface_coating_final_assembly_testing"
      flow_role: "Purchased materials, welding consumables, paint, process chemicals and installed fluid"
      record_type: "Weigh tickets, purchase receipts, supplier invoices, issue ledgers, unused-material returns and opening/closing usable stock"
      raw_fields: "exact material identity; grade or formulation; supplier; receipts; supplier returns; outbound unused material; opening usable stock; closing usable stock; issue quantity when an issue-ledger boundary is used; product model; period"
      collection_method: "Choose one stock boundary. For a storeroom balance use receipts and usable-stock changes; for a process-issue balance use issues less unused returns. Never add opening stock to issues or count the same transfer in both equations."
      unit: "kg"
      frequency: "Each receipt or issue; reconcile monthly"
      temporal_coverage: "At least one representative production year, with shorter campaigns disclosed"
      site_scope: "All manufacturing sites in the dataset"
      aggregation_rule: "Storeroom consumption = receipts + opening usable stock − closing usable stock − supplier returns − outbound unused material. Process-issue consumption = issues − returns to storeroom. Reconcile the two but use only one as the exchange quantity."
      quality_evidence: "Calibrated scale records, invoices, stock reconciliation, issue logs and material specifications"
    - protocol_id: cp_component_schedule
      process_id: "final_assembly_testing"
      flow_role: "Exact purchased or internally transferred assemblies and components"
      record_type: "Model BOM, part drawings, supplier invoices, receiving weights, calibrated part weights and internal transfer records"
      raw_fields: "part number; exact component name; material or composition; supplier or upstream process; piece count; mass per piece; installed mass; rejected count; opening and closing WIP; model and serial or batch"
      collection_method: "Reconcile every component in the declared model schedule. Record a purchased component as a technosphere input; record a site-made component as an internal transfer backed by its material and processing records; never do both."
      unit: "kg with piece count retained"
      frequency: "Each production batch; verify each model revision"
      temporal_coverage: "Full period and every included model configuration"
      site_scope: "Assembly line and every supplying foreground process"
      aggregation_rule: "Installed component mass = accepted count × verified mass per piece. Purchased receipts and internal transfers are separate ledgers; their model-specific installed masses shall reconcile to the finished-product BOM."
      quality_evidence: "Approved BOM revision, supplier specification, receiving or part weights, transfer traveller and assembly completion record"
    - protocol_id: cp_energy_records
      process_id: "material_fabrication_surface_coating_final_assembly_testing"
      flow_role: "Process-specific electricity, natural gas and diesel fuel"
      record_type: "Utility meters, process submeters, fuel issue records, oven logs and test logs"
      raw_fields: "meter identifier; process; opening and closing readings; unit; reference conditions for gas; fuel issued and recovered; retained versus combusted fuel; equipment load; operating time; product output"
      collection_method: "Prefer separate fabrication, coating and assembly/test submetering. Otherwise reconcile the site meter once and allocate each non-overlapping process share by measured load and operating time."
      unit: "MJ; kWh; m3; kg"
      frequency: "Meter interval or each fuel issue; aggregate monthly"
      temporal_coverage: "At least one representative production year"
      site_scope: "All included fabrication, coating, assembly and test areas"
      aggregation_rule: "Each process energy share is calculated once and all process shares plus excluded documented uses reconcile to the site total. Report delivered fuel fill separately from combusted fuel."
      quality_evidence: "Meter calibration, invoices, issue logs, burner or test logs and reconciliation to site totals"
    - protocol_id: cp_water_records
      process_id: "material_fabrication_surface_coating"
      flow_role: "Closed-loop make-up, single-pass supply, bath solution and specific liquid outputs"
      record_type: "Water meters, bath-volume records, tank inventories, discharge meters and transfer manifests"
      raw_fields: "source; stage; opening and closing tank stock; make-up; fresh supply; internal recirculation; evaporation estimate or measurement; drag-out; exact bath dump or rinse output; density; destination; product output"
      collection_method: "Build a stage-specific water balance. Internal recirculation is not consumption. Fabrication may use the minimum closed-loop make-up row only when records prove no liquid process output; every coating bath dump and rinse discharge is separately identified."
      unit: "kg or m3 with documented density conversion"
      frequency: "Meter interval, bath dump or batch; reconcile monthly"
      temporal_coverage: "At least one representative production year"
      site_scope: "Every included wet stage"
      aggregation_rule: "Fresh supply + opening liquid stock = closing liquid stock + exact liquid outputs + measured or justified evaporation + water retained in product or waste. Investigate the balance gap and do not hide it in generic wastewater."
      quality_evidence: "Meter calibration, bath log, density record, discharge or transfer record and water-balance closure"
    - protocol_id: cp_waste_records
      process_id: "material_fabrication_surface_coating_final_assembly_testing"
      flow_role: "Each exact generated waste, including steel scrap, welding slag, waste paint, waste alkaline liquor and rinse discharge"
      record_type: "Weigh tickets, dedicated bin or tank inventories, manifests and treatment receipts"
      raw_fields: "exact waste identity; source stage; physical state; mass; opening and closing waste stock; internal recovery; outbound transfer; destination; treatment route; hazardous classification"
      collection_method: "Weigh or meter at transfer, keep each waste identity separate and reconcile its accumulation without mixing purchased input stock"
      unit: "kg"
      frequency: "Each transfer; reconcile monthly"
      temporal_coverage: "At least one representative production year"
      site_scope: "All included production and treatment areas"
      aggregation_rule: "Waste generated = outbound transfer + closing waste stock − opening waste stock + documented internal recovery from that waste stock. Exported waste = outbound transfer only. Report both and use generated waste as the process-output exchange unless the modelling convention explicitly requires the exported boundary."
      quality_evidence: "Calibrated scales or meters, signed manifests, treatment receipts and waste-classification records"
    - protocol_id: cp_direct_emissions
      process_id: "material_fabrication_surface_coating_final_assembly_testing"
      flow_role: "PM10, NMVOC, combustion carbon dioxide and shielding-gas carbon dioxide released to air"
      record_type: "Stack or room-exhaust measurements, continuous monitoring, formulation balances, fuel-carbon records, supplier carbon-origin certificates and gas-cylinder inventories"
      raw_fields: "pollutant identity; fossil or biogenic origin; release compartment; flow and concentration or mass; sampling period; control status; formulation VOC; captured waste; supplied shielding-gas mass and cylinder residual; fuel consumed; fuel unit and, when needed, density at stated reference conditions; carbon mass fraction; carbon-origin fraction; oxidation fraction or carbon in incomplete-combustion products and retained carbon; production output"
      collection_method: "Use validated direct measurements when available. For supplied shielding carbon dioxide and coating constituents that remain the same substance, use an unchanged-species loss balance only when every input, return, recovery, retention, captured output, destruction term and stock change is documented. For carbon dioxide formed by fuel combustion, use the separate combustion-carbon calculation and never treat reacted fuel as destroyed pollutant. Split fossil and biogenic carbon, keep fabrication heat, coating-oven and factory-test sources separate, and do not mix release compartments."
      unit: "kg"
      frequency: "Each compliance test, gas issue or representative campaign; continuous data aggregated monthly"
      temporal_coverage: "Representative operating modes across the production year"
      site_scope: "Every included release point and fugitive source"
      aggregation_rule: "Sum post-control releases by substance, origin, source and actual compartment, then divide by net kg conforming product. Calculate unchanged-species loss and combustion formation separately; do not count formed combustion products again in a supplied-substance balance."
      quality_evidence: "Sampling report, calibration, detection limits, fuel or gas certificate, cylinder reconciliation, control-efficiency evidence and balance closure"
    - protocol_id: cp_finished_product_mass
      process_id: "final_assembly_testing"
      flow_role: "Finished reference product"
      record_type: "Final inspection and shipping mass records"
      raw_fields: "serial or batch; model; configuration; included accessories; installed fluid; gross mass; packaging or fixture tare; net mass; release date"
      collection_method: "Weigh complete released product or use verified model-specific mass with periodic scale confirmation"
      unit: "kg"
      frequency: "Each unit or statistically justified lot"
      temporal_coverage: "Full production period represented by the inventory"
      site_scope: "Every included model and site"
      aggregation_rule: "Sum net conforming finished-product mass; normalize inventory to 1 kg"
      quality_evidence: "Calibrated scale certificate, product specification and release record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "Normalized amount = process-period exchange amount / net conforming finished-product mass for the same period."
      inputs:
        - "exchange amount"
        - "net conforming finished-product mass"
      output: "exchange per 1 kg finished machinery"
      source_ids: []
    - id: calc_purchased_input_consumption
      applies_to: "Purchased materials, components and fuels"
      rule: "Storeroom-basis consumption = receipts + opening usable stock − closing usable stock − supplier returns − outbound unused material. If the process boundary instead uses an issue ledger, process consumption = issues − unused returns to storeroom. Reconcile the ledgers and select one quantity; never add opening stock to issues."
      inputs:
        - receipts
        - "usable opening and closing stock"
        - "supplier returns"
        - "outbound unused material"
        - issues
        - "returns to storeroom"
      output: "one non-duplicated consumed-input amount"
      source_ids: []
    - id: calc_internal_component_transfer
      applies_to: "Site-made components transferred between foreground processes"
      rule: "Upstream transfer out + opening in-transit or WIP = downstream transfer in + closing in-transit or WIP + separately identified transfer loss. A site-made component is not also a purchased input."
      inputs:
        - "upstream transfer"
        - "downstream receipt"
        - "opening and closing WIP or in-transit stock"
        - "exact transfer loss"
      output: "reconciled internal movement and disclosed gap"
      source_ids: []
    - id: calc_waste_generation
      applies_to: "Each exact waste identity"
      rule: "Waste generated = outbound waste + closing dedicated waste stock − opening dedicated waste stock + documented internal recovery from that waste stock. Exported waste = outbound waste only. Do not enter exported waste a second time as generation."
      inputs:
        - "outbound transfer"
        - "opening and closing waste stock"
        - "internal recovery"
      output: "generated waste and separately disclosed exported waste"
      source_ids: []
    - id: calc_shared_operation_allocation
      applies_to: "Shared fabrication, coating, assembly or testing"
      rule: "Allocate the reconciled shared amount by the documented causal driver for the same period; the shares shall sum to one."
      inputs:
        - "shared amount"
        - "product-specific causal-driver totals"
      output: "product-specific exchange amount"
      source_ids: []
    - id: calc_emission_release
      applies_to: "Supplied shielding carbon dioxide and coating constituents released unchanged to air"
      rule: "Unchanged-species post-control release = supplied substance + opening usable stock − closing usable stock − returned or recovered − retained in product − captured in waste − destroyed by documented control. Apply by substance, fossil or biogenic origin and actual compartment. Do not apply this loss balance to fuel combustion, because combustion forms carbon dioxide from fuel carbon. Do not use the balance if any material term is unmeasured."
      inputs:
        - "supplied substance"
        - "opening and closing usable stock"
        - origin
        - "retained amount"
        - "returned or recovered amount"
        - "captured amount"
        - "documented control destruction"
        - compartment
      output: "unchanged post-control substance mass by origin and compartment"
      source_ids:
        - us-epa-ap42-electric-arc-welding-1995
        - us-epa-misc-metal-surface-coating-tsd-2001
    - id: calc_combustion_carbon_dioxide
      applies_to: "Carbon dioxide formed by fabrication heat, coating-oven and factory-test fuel combustion"
      rule: "Prefer a validated direct carbon-dioxide measurement. Otherwise, for each source and carbon origin, formed carbon dioxide = consumed fuel mass × verified fuel carbon mass fraction × verified fossil or biogenic origin fraction × documented oxidation fraction × 44/12. When fuel is recorded by volume, convert it to mass only with a measured or supplier-specific density at stated reference conditions. As an alternative to an oxidation fraction, subtract carbon measured in carbon monoxide, methane, soot or ash, product retention and other documented unoxidized destinations from consumed fuel carbon before multiplying by 44/12; never use both adjustments for the same carbon, subtract reacted fuel as destroyed pollution, or count the formed carbon dioxide in another balance. Report each source in its actual compartment."
      inputs:
        - "consumed fuel mass or measured volume and density"
        - "carbon mass fraction"
        - "fossil or biogenic origin fraction"
        - "oxidation fraction or carbon in incomplete-combustion and retained destinations"
        - "direct measurement"
        - source
        - compartment
      output: "formed carbon-dioxide mass by source, origin and compartment"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Demonstrate that the complete product is residual CPC 44119 and not one of the named CPC 44111–44115 products or a separately supplied part."
      evidence: "Product specification, catalogue description, engineering drawing and classification rationale"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Reconcile the declared model-specific component schedule, purchased materials, internal component transfers, product output, exact wastes and direct releases. For the representative roller, verify every manual-listed part family and its count; for another CPC 44119 model, replace the schedule with its complete atomic BOM rather than adding an umbrella component row."
      evidence: "Approved bill of materials, part-count reconciliation, purchase and internal-transfer records, waste manifests, water balance and documented mass-balance gap"
    - id: dq_temporal
      applies_to: "All foreground records"
      requirement: "Use a representative production year or full campaign; disclose ramp-up, shutdown, prototype or abnormal production and explain exclusions."
      evidence: "Dated meters, production logs and reconciliation period"
    - id: dq_technology
      applies_to: "Conditional routes"
      requirement: "Declare welding process and consumable, removable slag, shielding-gas carbon origin and loss, coating formulation and control, coating energy and oven fuel, wet-stage bath and rinse closure, hydraulic configuration, testing fuel and release-point configuration."
      evidence: "Process specifications, gas-origin certificates, formulation and bath sheets, equipment, BOM and control-system records"
    - id: dq_geography
      applies_to: "Upstream links and direct releases"
      requirement: "Match electricity mix, fuels, materials, water and treatment datasets to the manufacturing geography and record the actual elementary-flow compartment."
      evidence: "Supplier geography, utility contract, treatment destination and release-point record"
    - id: dq_uncertainty
      applies_to: "Allocated or calculated values"
      requirement: "Preserve raw values, conversion factors, allocation drivers and uncertainty or data-quality limitations; do not replace missing records with the provisional range needs in the manifest."
      evidence: "Calculation workbook or machine-readable derivation and reviewer trace"
validation_rules:
  - rule_id: validation_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that the reference product is a complete CPC 44119 product, the Tiangong reference UUID is used, and all required product qualifiers are present."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_reference_mass
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that net conforming product mass is positive, the inventory is normalized to exactly 1 kg output, and packaging or reusable fixture tare is treated consistently."
    source_ids: []
  - rule_id: validation_process_coverage
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that all required processes are represented and that each conditional process or row is either included with data or explicitly marked not applicable with evidence. Coating shall close electricity or thermal energy, direct combustion, aqueous chemical, bath, rinse and water-balance routes; fabrication shall close fuel combustion, shielding-gas origin and release, welding slag and wet-route outputs."
    source_ids: []
  - rule_id: validation_atomic_inventory
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that every inventory card is one physical, chemical, waste or elementary exchange. Verify every part family in the representative or replacement model-specific component schedule, and reject umbrella fastener, component, energy, water, wastewater, waste or emissions rows."
    source_ids:
      - agri-fab-steel-tow-roller-45-01791
  - rule_id: validation_uuid_property
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm each populated Tiangong UUID by public state-100 identity, flow type, classification, property and unit group; keep fabrication_pm10_air unresolved until an exact release-compartment identity is available."
    source_ids: []
  - rule_id: validation_reconciliation
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm the purchased-input, issue-ledger, internal-transfer, waste-generation, exported-waste, water and emission equations close separately for the declared period. Verify unchanged supplied-substance loss separately from combustion-product formation, including the 44/12 carbon-to-carbon-dioxide conversion and either oxidation fraction or incomplete-combustion carbon destinations. Confirm that reacted fuel is not subtracted as destroyed pollution and that opening inventory, issues, generated waste, outbound waste and formed combustion products are not double-counted; investigate and disclose unexplained gaps rather than forcing balance."
    source_ids: []
  - rule_id: validation_double_counting
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that upstream datasets exclude foreground operations already recorded and that recycling credits, outsourced services and transport are not counted twice."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for complete other soil machinery, n.e.c."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product-system modelling of declared CPC 44119 machinery when product configuration, factory-gate boundary, geography, technology and period are compatible"
  excluded_use: "Direct representation of ploughs, harrows, cultivators, seeders, planters, transplanters, manure spreaders, fertilizer distributors, separately sold parts, self-propelled earth-moving machinery, use-phase service, maintenance or end-of-life"
  required_metadata: "PCR id and version; CPC rationale; manufacturer and model; function and configuration; net mass; working width or capacity; drive interface; complete model-specific component schedule and part masses; principal material grades; welding and coating routes; included accessories and fluids; site and year; upstream geography; allocation; treatment and release compartments"
  required_quality_disclosure: "Foreground coverage; purchased-input, internal-transfer, waste and water reconciliations; allocation shares; proxy datasets; omitted flows; mass-balance gap; measurement uncertainty; conditional-route evidence; all unresolved inventory UUIDs and unresolved quantitative range evidence"
  update_trigger: "Change in product classification, bill of materials, model mass, manufacturing site, principal process technology, welding consumable, coating system, energy supply, testing route, allocation method, waste treatment, emission controls or availability of an exact unresolved flow identity"
