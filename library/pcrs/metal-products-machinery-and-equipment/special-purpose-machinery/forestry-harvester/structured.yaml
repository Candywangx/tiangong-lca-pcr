allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared resources"
    rule: "Directly attribute serialized BOM, job issues/returns, stage meters and commissioning including actual rework. Inseparable resources use measured causal station/machine occupation and actual load: share = order driver / sum of covered order drivers. Document covered period, standby and denominator; equal machine counts, catalogue mass or rated hydraulic power are not automatic drivers."
    source_ids: []
  - rule_id: allocation_tests
    applies_to: "production commissioning and qualification"
    rule: "Actual unit commissioning is attributed to that accepted unit. Separate independent R&D/prototype or forestry demonstrations from production. Shared qualification requires original applicability, covered orders, actual causal driver and sensitivity. Destroyed units and reject assemblies are not accepted output; no assumed factory test schedule or amortized service life."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "scrap and rework"
    rule: "Trace each actual scrap, recovered fluid and waste transfer once. Internal rework remains with production and stock balances. No avoided-metal credit solely for recyclability; actual saleable co-product allocation requires original causal/economic evidence and sensitivity. No wood product co-output from forest harvesting is in this manufacturing reference."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "reference_product"
      record_type: "accepted physical weighing record"
      raw_fields: "model; configuration; serial number; accepted net mass M; part number/revision; complete machine scale reading; fixture tare; head/boom/wheel configuration; installed fluid and free fuel state; calibration/uncertainty; drawing; signed release"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted unit"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared complete-machine acceptance gate"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "actual calibrated physical complete-machine weighing, measured tare and controlled drawing/release"
    - protocol_id: cp_structure
      process_id: "structure"
      flow_role: "inventory"
      record_type: "actual stage exchange records"
      raw_fields: "model; configuration; serial/batch; part/revision; exact exchange/SDS; net issues/returns/stocks; kg; metered kWh; waste destination; emission method; actual shared driver"
      collection_method: "Read actual drawings, stock issues/returns, fabrication orders, qualified joining procedure, meters and segregated waste transfers"
      unit: "kg for Mass rows; MJ for electrical-energy rows"
      frequency: "each accepted unit and actual production batch"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared factory/subcontractor gates"
      aggregation_rule: "attribute measured period exchange / accepted units of the same configuration"
      quality_evidence: "original jobs/drawings/SDS, calibrated scales/meters, acceptance and transfers"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "inventory"
      record_type: "actual stage exchange records"
      raw_fields: "model; configuration; serial/batch; part/revision; exact exchange/SDS; net issues/returns/stocks; kg; metered kWh; waste destination; emission method; actual shared driver"
      collection_method: "Read serialized BOM, supplier configurations, assembly/fill/flush jobs, calibrated issues and meters"
      unit: "kg for Mass rows; MJ for electrical-energy rows"
      frequency: "each accepted unit and actual production batch"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared factory/subcontractor gates"
      aggregation_rule: "attribute measured period exchange / accepted units of the same configuration"
