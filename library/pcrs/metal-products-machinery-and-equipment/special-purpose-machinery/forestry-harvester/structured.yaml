  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Require mass_record_provenance actual physical configured machine weighing with matched head/boom, calibrated suitable scale, measured tare and positive M kg. Reconcile serial/BOM, installed fluids and removed free fuel, timber, protection and fixtures. Detached delivered assemblies need actual non-overlapping physical records. Catalogue minimum/typical weight or operating mass cannot establish this M. Missing actual originals requires scientific/data review."
      evidence: "actual weighing, tare/calibration, serialized configuration and signed acceptance"
    - id: quality_identity
      applies_to: "all exchanges"
      requirement: "Check one precise physical/chemical identity, supplied completeness, route and actual public reference property/unit. Complete head is not generic agricultural machinery; mineral formulated oil is not elementary crude oil; free test fuel is not installed lubricant; technical water is not a natural resource or wastewater. Preserve species/media and actual concentration. Keep unmatched identities specific and unresolved."
      evidence: "actual supplier BOM/specification/SDS and public flow/property/unit originals"
    - id: quality_configuration
      applies_to: "cp_assembly; cp_head; cp_acceptance"
      requirement: "Require matching head/rotator/boom, carrier axle/wheel configuration, power/hydraulic/control compatibility and actual producer release criteria. Preserve inspection and calibration originals and actual rework. A catalogue lists possible equipment, not an accepted BOM; head dry mass and power rating cannot proxy configured net mass or test consumption. No universal safety/load/pressure threshold or test timber demand inferred."
      evidence: "actual configuration/BOM, factory test, calibration and release"
    - id: quality_balance
      applies_to: "material, fluids, fuel, water and species"
      requirement: "Reconcile measured stock and issues/returns with incorporated assemblies, fabrication losses, rework and waste. Separate oil incorporated in M, factory flush waste and operational consumption. Test fuel accounting needs measured stock/returns and declared fossil/biogenic fraction. Actual exhaust carbon dioxide, nitrogen oxides and particles require separate measured chemical species/media before adding identities; no NOx as NO2 or all diesel as emitted CO2. IPA-air requires actual species measurement or closed solvent balance after recovery and retention. Water supply and treatment effluent are separate."
      evidence: "actual stage material/solvent/fuel/species balances and waste destinations"
    - id: quality_coverage
      applies_to: "dataset and upstream links"
      requirement: "Distinguish measured, calculated, missing and evidenced not_applicable. Reconcile actual entire BOM and operations including painting, fills, refrigerants, batteries, tools and exhaust when present, not merely these candidate cards. Disclose capital exclusion, allocation and uncertainties. Full cradle-to-gate requires verified compatible upstream datasets. Contract checking does not establish completed actual factory data or scientific approval."
      evidence: "actual complete BOM/operations and transparent gap register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference and finished_harvester"
    rule: "Exact reference-product name equals finished_harvester output. Positive current same-configuration M kg uses cp_mass and normalize_mass. Blank candidate UUID must register that precise output row in unresolved_flow_identities. Physical net mass records and complete matching head/boom configuration are required; no catalogue mass."
    source_ids: []
  - rule_id: validate_basis
    applies_to: "all rows/protocols"
    rule: "Require identical ordered lower-case row/rule/protocol IDs and actual projected references in both languages. Explicit q_item per accepted unit, M kg, same-configuration counts and conversion must agree. Do not rewrite a public Number/Area/Energy property as Mass to force identity."
    source_ids: []
  - rule_id: validate_route
    applies_to: "assembly and tests"
    rule: "Require actual supplier-contained BOM and fabrication scope, off-road diesel hydraulic route, matching head/rotator and actual commissioning/release records. Test fuel and individual exhaust exchanges only with evidence. Manufacturer catalogue context is not this factory empirical inventory. Missing route or metrology originals requires review."
    source_ids: []
  - rule_id: validate_use
    applies_to: "dataset use"
    rule: "Disclose configuration, net-mass evidence, supply gates, missing actual exchanges, unresolved identities and upstream compatibility. Equal kg does not mean equal cutting capability, forest productivity, safety or service life. Candidate is neither published nor scientifically approved."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset and background_dataset after actual completion and review"
  downstream_use: "Configured forestry-harvester manufacturing input to separately bounded lifecycle models"
  allowed_use: "Manufacturing comparisons of matching configuration/supply gates with actual M and upstream gaps disclosed"
  excluded_use: "Exclude forwarders and skidders, crop harvesters, complete agricultural tractors, stand-alone heads and replacement parts, excavator-only attachment carriers, tracked feller-bunchers, chippers, battery/electric or undeclared power routes, refurbished machinery, forest harvesting/log yield, use-phase fuel/emissions, transport services, maintenance and end of life. Purchased finished subassemblies are inputs, not a claim to have measured their manufacturing foreground."
  required_metadata: "manufacturer/model/site/period; machine serial and BOM revision; wheel/axle/tyre configuration and optional tracks; engine fuel/power route and supplied auxiliaries; chassis/boom/head/rotator revision and supplied completeness; actual hydraulics, cab, controls, installed fluid grades and charges; fabrication versus received components and subcontractor gates; actual acceptance and calibration; measured same-configuration net M kg, scale/tare/uncertainty and fuel/payload/protection exclusions; stock/meter/test/waste balances; actual allocation drivers and upstream-link gaps"
  required_quality_disclosure: "Measured/calculated/missing data, actual weighing/acceptance and BOM originals, identity/metrology gaps, capital exclusion, allocation and uncertainty; candidate with scientific review pending"
  update_trigger: "Actual chassis/boom/head/rotator/wheel or power route, supplied completeness, oil/fuel recipe, commissioning/mass method, factory gate or upstream changes"
