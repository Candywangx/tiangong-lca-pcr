measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: mass_record_provenance
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Physically weigh the accepted complete configured machine with head/boom on a suitable calibrated vehicle/platform weighing system; retain actual readouts, calibration, uncertainty, measured tare, serial/BOM, installed fluids and signed release. If detached head/boom is separately weighed for delivery, retain each actual physical measurement and a non-overlapping mass reconciliation to the same accepted complete unit. Remove free test fuel or quantify actual separately measured tare; do not subtract catalogue capacity times guessed density. Same-configuration aggregation needs actual accepted counts and traceable unit mass originals."
  - id: energy_units
    applies_to: "each electricity row"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Use verified energy-unit conversion 1 kWh = 3.6 MJ. Retain actual supply/provider and meter boundary for assembly, machining and commissioning; no nameplate power or guessed utilization substitutes for measurement."
