  semantic_boundary_decision: No inspected material PCR covers the same complete
    single-grip wheeled forestry-harvester output. Agricultural tractors,
    combine harvesters and full-slewing excavators have different
    output/function and attachment boundaries; basic steel/component methodology
    is upstream. Choose complete wheeled diesel-hydraulic cut-to-length
    harvester with matched head/boom, excluding forwarder/skidder, standalone
    head, tracked feller-buncher and field forestry service. Old 44198 leaf
    remains read-only; no retired identity or mapping promoted.
