system_boundary:
  rules:
    - rule_id: boundary_foreground
      applies_to: "all processes"
      rule: "Include actual site manufacture, assembly, first fills, rework and attributable acceptance tests. Exclude customer-site excavation, commissioning services, distribution beyond the gate, maintenance and end of life. Factory testing fuel must not use a jobsite service consumption rate."
      source_ids:
        - volvo-factory
    - rule_id: boundary_completeness
      applies_to: "supplier assemblies"
      rule: "Map full configured BOM to purchased components or internal manufacture, once only. Crawler and wheeled layouts are separate; do not infer hydraulic-cylinder, track-shoe or counterweight manufacturing inside the assembly site."
