allocation_rules:
  - rule_id: allocation_order
    applies_to: "shared operations"
    rule: "Separate model, chassis, attachment, power and fill configurations by work order; directly assign issues, returns, meters and rework first. Unseparated shared stations use measured causal station time or metered load, with order driver divided by all covered order drivers; document causal justification, period and denominator. No unexplained equal-count allocation across differently sized models."
    source_ids: []
  - rule_id: allocation_reuse
    applies_to: "material recovery"
    rule: "Internal reuse is a stock transfer, not repeated fresh input. Exported steel scrap, drained fluid and paint residue carry measured quantities and destinations without automatic avoided-product credit. Identify valuable co-products separately and obtain reviewed residual allocation after direct separation. Include test/reject/rework burdens in accepted output for the recorded period; disclose unfinished stock."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
