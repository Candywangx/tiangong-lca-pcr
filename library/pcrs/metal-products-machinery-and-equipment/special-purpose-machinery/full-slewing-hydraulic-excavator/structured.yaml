      requirement: "Reconcile every installed structure, actuator, drive, cab, power system and first fill to configuration BOM and supplier boundary; avoid part/stock and prefilled-fluid duplication."
      evidence: "serial BOM and supplier scope"
    - id: quality_balance
      applies_to: "mass and utilities"
      requirement: "Reconcile stock, parts, installed M, exported waste, retained fluids, test consumption and rework; measure density/temperature for actual liquid conversion. Establish site/configuration QA limits from measured records rather than assumed yield or brochure operating weight."
      evidence: "stock, weighing, meter and test receipts"
