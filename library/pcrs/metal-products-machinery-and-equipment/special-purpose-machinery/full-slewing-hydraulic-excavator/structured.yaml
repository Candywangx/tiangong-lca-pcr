validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Require a positive measured M for the accepted full-slewing diesel hydraulic machine with explicit chassis, boom/stick/bucket, counterweight, supplier completeness and delivery fills. Reject operating-service, infrastructure amortization or dismantling flow substitution."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Require one physically defined exchange and matching public identity, actual reference property, unit group, route and medium. Leave conflicting identities unresolved until data completion; item count is not mass, coolant is not neat glycol, treatment effluent is not direct water emission."
    source_ids: []
  - rule_id: validate_conversion
    applies_to: "all inventory rows"
    rule: "Check collection scope and normalize_mass against the same accepted configuration and M; require no duplicate internal transfers, purchased complete-module components or retained/test fuel. Unknown exchanges need evidence, not zero defaults."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "elementary exchanges"
    rule: "Fossil CO2 requires attributable measured factory combustion and air-unspecified medium; separately identify any other demonstrated substance/medium. Do not substitute biogenic carbon, service-phase fuel rates or NO/NO2/N2O identities."
    source_ids: []
