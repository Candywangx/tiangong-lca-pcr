system_boundary:
  rules:
    - rule_id: host_and_state
      applies_to: "foreground_system_boundary"
      rule: "Actual principal function, dedicated interface and completed-item review control full44949. Supplementary HS robot/publicworks/woodpress/metal-treatment or other residual listings do not automatically override other specific CPC part classes. Rope OR cable-making eligibility depends on host function, not vendor label. Independent moulds/tools/ceramic/glass and isotopic parts require separate classification review."
      source_ids:
        - cpc
        - census
    - rule_id: stock_and_treatment
      applies_to: "foreground_system_boundary"
      rule: "Reiloy distinguishes4000-series/Nitralloy/tool and PM stock, gas nitriding versus ion nitriding, cobalt/nickel hardfacing, and nitrided/bimetal/tool-lined barrels. Measure actual supplied form and local operations; bought PM stock embeds atomization/HIP upstream once. Catalogue temperatures/cycles/thickness and named alloy examples establish no default recipe."
      source_ids:
        - reiloy-handbook
        - reiloy-stock
    - rule_id: mechanism_and_composite
      applies_to: "foreground_system_boundary"
      rule: "Troester roll/nip/tempering-media variants, Emhart aluminium-bronze bearing/seal/PPC/dummy-plate/neckring cap and split-gear options, and carbon-fibre/epoxy flyer bows follow actual drawings and orders. Guides may be ceramic/WC/zirconia; raw powder differs from finished insert. A seal trade name does not define a polyurethane recipe. Historic Falma cam/turret/chain/burner architecture is not current BOM or factory fuel proof."
      source_ids:
        - troester-calender
        - emhart-plunger
        - emhart-neckring
        - wire-bows
        - falma-lamp
