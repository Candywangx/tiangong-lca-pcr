allocation_rules:
  - rule_id: allocate_configuration
    applies_to: "foreground_burden_allocation"
    rule: "Separate actual configurations/site/process meters first. Allocate common-period residual by measured causal service demand or work, not catalogue customer throughput. Include attributable failed trials/rework/rejects in accepted-part burdens. Cancel paired internal transfers; disclose returned/reusable trial media, saleable co-products and receiver allocation/treatment without invented avoided burdens."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "accepted part"
      record_type: "foreground_record"
      raw_fields: "model/configuration/serial; net mass; Naccepted; Dnet; included hardware/fills; excluded packing/spares"
      collection_method: "Calibrated traceable weighings reconcile accepted complete parts with actual order/BOM within one configuration/period. Sum accepted net mass excluding packing/spare stock/rejects/consumed trials. Include only actually retained shipped fill."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_materials
      process_id: "fabrication"
      flow_role: "local stock and chemical ingredients"
      record_type: "foreground_record"
      raw_fields: "Qattr; own gross mass/assay/moisture/density; alloy/formulation; stocks/returns/reactions/retained parts; actual local route"
      collection_method: "Weigh actual supplied stock and each local finishing/joining/cleaning ingredient; reconcile own-stream element/moisture/chemical contents with retained hardware, reaction products, baths/recovery/waste/stocks/returns. Actual contact alloy or polymer compatibility is specific to the contacted part, never every frame. Embedded complete-module materials stay upstream once."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_modules
      process_id: "assembly"
      flow_role: "completed hardware and retained fill"
      record_type: "foreground_record"
      raw_fields: "Qattr; BOM/completion/options; hardware mass/length; separate fill formula/assay/T/P/density; receipts/installed/returns/stocks"
      collection_method: "Hardware branch weighs actual completed received/installed/returned assemblies and cable lengths, documenting remaining local work. Chemical branch independently measures local fill/lubricant/gas in its own native units and own composition/moisture/T/P/density, stocks/reactions/retention/returns. Complete bought modules embed their chemicals upstream once; whole hardware mass never substitutes chemical amount. First retained supply fill is distinct from trial consumption and customer maintenance."
      unit: "native unit"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_tests
      process_id: "test"
      flow_role: "observed factory trial media"
      record_type: "foreground_record"
      raw_fields: "Qattr; actual acceptance order/trial/repeat/reject; water/wire/gas receipts; own composition/state; returned/reused/sold/discarded stocks"
      collection_method: "Meter actual attributed factory tests and repeated/failed trials, using each actually consumed wire/chemical/water/gas own measured amount and composition. Record returned/reused/recovered and saleable trial products independently, never as disappearance. Exclude normal customer production, catalogue recipe/capacity, R&D demonstrations or customer commissioning unless an explicit declared manufacturing attribution is evidenced."
      unit: "native unit"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_utilities
      process_id: "services"
      flow_role: "each unassigned utility"
      record_type: "foreground_record"
      raw_fields: "Qattr; common period/site/import/self-generation/export/storage; assigned meters; gross/net heat datum; independent return; T/P/humidity/density"
      collection_method: "Reconcile each common-period imported and actually generated utility minus exports/storage with assigned local/test meters; allocate only residual once. Cable/energy/volume units remain native. Gross heat deducts separately measured same-datum return once; net heat never twice. Process water/DI/service water and internally circulated cooling flows are independent interfaces; paired returns cancel."
      unit: "native unit"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_dispatch
      process_id: "dispatch"
      flow_role: "each packaging item"
      record_type: "foreground_record"
      raw_fields: "Qattr; packing grade/moisture/dimensions; dispatch receipts; returns/reuse/stocks; packing outside Dnet"
      collection_method: "Weigh actual board/foil/pallet independently and reconcile dispatch/returns/reuse/stocks within the accepted configuration/period. No generic packaging ratio or catalogue shipping gross mass establishes net part mass."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_wastes
      process_id: "residues"
      flow_role: "each outgoing waste stream"
      record_type: "foreground_record"
      raw_fields: "Qattr; transfer weight; own composition/assay/moisture/density; stocks/returns/recovery; receiver/transport/treatment route"
      collection_method: "Measure each outgoing waste independently at its actual handover state; retain own-stream wet/dry/composition and chemical/metal contents, returned stock and receiver route. Wastewater/sludge/spent solvent/captured dust/composite/hardmetal/oil remain separate. Treatment is distinct from direct environmental discharge; captured material is not air. Missing compatible identity remains a gap rather than wrong-origin waste proxy."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_emissions
      process_id: "residues"
      flow_role: "each direct emitted species"
      record_type: "foreground_record"
      raw_fields: "Qattr; CAS/species/origin/compartment; post-control concentration; simultaneous flow/time; T/P/wet-dry/O2 correction; fugitive sampling; capture/reaction/byproducts"
      collection_method: "Use independently observed post-control concentration times matched actual flow and time with unit/state correction plus separately sampled fugitives. Reconcile input/retained/recovered/destroyed/sludge/wastewater/stocks by own assays; capture is not destruction and non-air/unexplained residuals never infer air. Molecular NO2 differs from NOx-equivalent; contained Cr(VI)/Ni/Cu/Co differs from total metal/oxide/salt/alloy and avoids PM overlap."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Within one actual configuration/period divide attributable native-unit total by the sum of calibrated accepted complete-part net masses. Retain per-part quantities and actual denominator evidence."
      inputs:
        - Qattr
        - Dnet
        - Naccepted
        - cp_mass
      output: "native-unit amount per kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_qnd
      applies_to: "all inventory rows"
      requirement: "Same configuration/period Qattr includes attributable manufacture/assembly/tests/reject/rework burden. Naccepted counts accepted parts; Dnet sums their calibrated net masses. M=Dnet/Naccepted; q_item=Qattr/Naccepted; q_ref=Qattr/Dnet. Catalogue empty/gross mass or customer throughput is not a denominator."
      evidence: "calibrated configuration-specific accepted ledger"
    - id: quality_physical
      applies_to: "all inventory rows"
      requirement: "Every element/chemical term uses its own gross mass, assay/moisture/wet-dry basis, reactions/stocks/returns/retention. Alloy/sludge/solution mass differs from contained element/active chemical. Each water stream requires own water fraction/density at actual temperature, independent reaction/retained fill/evaporation/discharge/stocks; internal returns pair and cancel."
      evidence: "own-stream assays and state/stock/reaction records"
    - id: quality_solvent
      applies_to: "ipa; ethanol; acetone; spentipa; ipair; ethanolair; acetoneair; wastewater"
      requirement: "Reconcile each solvent own assay, stocks/reactions/retained/recovered/captured/destroyed/wastewater/spent-media terms against independently measured air. Capture differs from destruction; non-air and unexplained residual cannot become emitted IPA."
      evidence: "independent measured fate and air records"
    - id: quality_scope
      applies_to: "reference product"
      requirement: "Maintain full rubber/plastics and other eligible residual special-purpose host parts with actual host-function, dedicated-interface and NEW manufactured state review. Chemical/thermal/electrical-contact compatibility is component-specific, not a whole-frame claim. Catalogue option, empty/gross mass, customer recipe/yield/utility demand, marketing savings and maintenance consumables are not factory manufacture defaults."
      evidence: "actual order/BOM/acceptance and primary original technical body"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Match actual published100/type/native reference internal ID/property/unitgroup and official bilingual names with full chemistry/CAS/grade/phase/provider/completion/compartment. Add every actual unlisted material, ingredient/fuel/fill/module/test media, transport, waste and emitted species as independently queried atomic measured exchanges. Unresolved identities remain gaps; missing differs from zero and not-applicable requires physical evidence."
      evidence: "own full direct and supplier/interface review"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Require the accepted dedicated new part, actual rubber/plastics or eligible residual host/function/drawing/interface, one-kg net reference and disclosed completion/new-versus-returned state. Reject whole-host, general machinery, ordinary material/tool or consumable proxies."
    source_ids:
      - cpc
      - census
      - reiloy-stock
  - rule_id: validate_makebuy
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual supplied order/BOM, part-specific chemical/thermal/electrical-contact compatibility, exclusive raw-ingredient versus bought-complete branches and actual trial attribution. Reject catalogue alloy/binder recipes/weights/energy/customer yield/lifetime replacement defaults; include attributable rejects/rework/failed trials."
    source_ids:
      - cpc
      - census
      - reiloy-handbook
      - reiloy-stock
      - troester-calender
      - emhart-parts
      - emhart-plunger
      - emhart-neckring
      - wire-bows
      - falma-lamp
  - rule_id: validate_balances
    applies_to: "foreground_dataset_conformance"
    rule: "Require each stream own assay/water/density/stocks/returns/reactions and measured non-air solvent fates; each emission actual species/origin/compartment and post-control concentration times matched flow/time/state plus independent fugitives. Utility imports/actual generation/exports/storage reconcile assigned meters and residual once, with independent same-datum gross heat return deducted once."
    source_ids: []
  - rule_id: validate_species
    applies_to: "foreground_dataset_conformance"
    rule: "Require molecular NO2 not NOx-equivalent, Cr(VI) not total Cr, contained Ni/Cu/Co not gross salts/oxides and non-overlapping PM. Prefer matched individual species where the actual LCIA method differentiates them. Fossil versus biogenic carbon and measured air versus captured/liquid fates remain separate. Report performed/skipped checks, findings and actual completeness."
    source_ids: []
