data_sources:
  - id: "cpc"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Full44915 rubber/plastics parts and other n.e.c special-purpose parts44949; explicit8475.90/8477.90/8479.90 versus independent moulds44916 and other explicit part classes.44930 isotopic machine listing does not add unlisted8401.40 parts."
  - id: "census"
    type: "official_guidance"
    reference: "https://www.census.gov/foreign-trade/schedules/b/2022/c84.html"
    used_for: "Supplementary chapter84 notes, glass/lamp8475.90, full rubber/plastics8477.90 and rope OR cable8479.40/residual8479.90. Broad HS hosts and ceramic/glass/independent tool articles require actual CPC completed-item review, not mechanical inheritance."
  - id: "reiloy-handbook"
    type: "handbook"
    reference: "https://reiloyusa.com/assets/template/Medien/Dateien/reiloy-usa-11th-screw-barrel-hdbk-0819.pdf"
    used_for: "Actual screw stock grades/nitriding and ion-nitriding, PM stock and encapsulation, cobalt/nickel hardface variants and nitrided/bimetal/tool-lined barrel routes. No fixed alloy recipe, cycle, powder quantity, hardness or layer thickness; upstream stock differs from local production."
  - id: "reiloy-stock"
    type: "handbook"
    reference: "https://reiloyusa.com/assets/template/Medien/Dateien/reiloy-usa-stocking-program-2023.pdf"
    used_for: "Actual approved-print new manufacture versus used screw/barrel inspection/repair and identified shipment.01/2019 footer edition differs from2023 filename; no stock quantity or part mass default."
  - id: "troester-calender"
    type: "handbook"
    reference: "https://www.troester.de/product/calender/"
    used_for: "Calender roll/bearing/crossing/bending and hydraulic/electromechanical nip architecture, actual material/surface and tempering-media variants. Whole-host technical list does not establish delivered part count, alloy or fill."
  - id: "emhart-parts"
    type: "handbook"
    reference: "https://www.emhartglass.com/Products/LifecycleSolutions/OriginalParts/OriginalParts"
    used_for: "Original dedicated spare/wear-part supply portfolio; replacement availability does not prove first included delivery, recipe or testing quantities."
  - id: "emhart-plunger"
    type: "handbook"
    reference: "https://emhartglass.com/sites/default/files/publications/2020-11/TNB292%20-4000%20Series%20Plunger%20Mechanism.pdf"
    used_for: "4000-series AIS/IS plunger configured packer/interface, aluminium-bronze floating bearings, lubrication lines and PPC versus dummy-plate interfaces. No default geometry, test amount or bronze composition."
  - id: "emhart-neckring"
    type: "handbook"
    reference: "https://emhartglass.com/sites/default/files/publications/2021-05/TNB295%20-%20Roller%20Bearing%20Neckring%20Mechanism.pdf"
    used_for: "Roller-bearing neckring sealing/bracket/cap/split-gear and exhaust architecture; independently machined caps and options follow actual order. Trade-name seal label does not establish a polymer recipe or mass."
  - id: "wire-bows"
    type: "handbook"
    reference: "https://www.wire-machine.com/buncher-bows/products/"
    used_for: "Custom carbon-fibre/epoxy flyer-bow architecture plus ceramic/WC/zirconia guide and roller/heat-treated wear-strip variants. Actual rope/cable principal function is required; no universal fibre/binder ratio, material density or savings."
  - id: "falma-lamp"
    type: "handbook"
    reference: "https://www.lamptech.co.uk/Documents/Machines/Falma%20-%20Lamp%20Machinery%20-%201995%20EU.pdf"
    used_for: "Historical manufacturer brochure in an independent archive: incandescent-lamp indexed turret/cam/roller/chain and flare-cutting burner architectures only. No current availability, fixed BOM/test-fuel quantity or customer lamp-production recipe."
