      collection_method: "Measure species after actual controls using measured concentration × matched flow × same period with state/unit corrections plus independent fugitive measurement. Element/species assay is distinct from gross dust/oxide; prevent overlapping total PM/component emissions. Unexplained mass residual and carbon closure cannot infer CO/NO2/ozone."
