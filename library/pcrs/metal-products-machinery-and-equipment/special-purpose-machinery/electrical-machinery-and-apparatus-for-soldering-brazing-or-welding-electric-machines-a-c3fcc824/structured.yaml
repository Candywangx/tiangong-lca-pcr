        - Qattr
        - Dnet
        - cp_mass
      output: "native-unit amount per kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_qnd
      applies_to: "all inventory rows"
      requirement: "Qattr includes attributable reject/rework/test burdens for one configuration and common period; Naccepted counts accepted apparatus whose masses form Dnet. Per-item exchange=Qattr/Naccepted; measured mean net mass=Dnet/Naccepted; per-kg exchange=Qattr/Dnet. Count conversion uses measured same-configuration mean mass, never rated output/current/duty-cycle or catalogue machine weight."
      evidence: "calibrated net masses and acceptance ledger"
    - id: quality_physical
      applies_to: "all inventory rows"
      requirement: "Each element/species term uses its own gross mass and own assay/moisture/wet-dry basis, stocks, reactions, retained product, returns and waste. Gross alloy/sludge is not contained element. Each water stream uses own water fraction and measured/documented density at actual temperature, reactions/retention/evaporation/discharge/stocks; pair and cancel internal returns."
      evidence: "stream-specific assay and stock/reaction records"
    - id: quality_solvent
      applies_to: "ipa; spentipa; ipair"
      requirement: "Reconcile own IPA assay in inputs, stocks, retained product, recovery/capture, wastewater/spent media, destruction and independently measured air. Capture is not destruction and non-air fates never become air residual."
      evidence: "independent fate measurements and assays"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Match state/type, native reference property/unit, metal/polymer/chemical/species, completed supplied state, provider/geography and elementary compartment. Add every actual unlisted transport service, copper tube, coil brazing alloy, core insulation/hardener, electronics/powder feeder, filled refrigerant, powder metal, test media, gas, waste or emission as a separately queried measured atomic row. Missing differs from zero; absence requires proof."
      evidence: "original supplier/BOM and disclosed identity gaps"
    - id: quality_scope
      applies_to: "reference product"
      requirement: "Unobserved resistance seam/projection/butt, resistance/induction soldering, robotic and other electric joining variants need item-specific primary architecture. A replacement parts list never proves shipped accessories; optional cooler does not imply compressor or glycol; electric spray system with handheld gun remains reviewed whole-system scope. Examples do not imply universal recipe, alloy, operating lifetime or factory load."
      evidence: "primary configuration and semantic review"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual electrical principal joining/hot-spray function and full supplied BOM. Reject one spare torch/core/robot, non-electrical apparatus or coated output as complete reference. Both languages use the same one-kg net reference and native numerator."
    source_ids:
      - un-cpc3
  - rule_id: validate_interfaces
    applies_to: "foreground_dataset_conformance"
    rule: "Reject duplicated bought-module manufacture, unpaired internal returns, assumed accessory/fill inclusion and customer lifetime operation presented as factory loads; retain actual attributable factory test rejects/rework."
    source_ids:
      - fronius-inverter
      - telwin-resistance
      - hakko-spec
      - metco-equipment
  - rule_id: validate_balances
    applies_to: "foreground_dataset_conformance"
    rule: "Require own-stream element/water/solvent balances and measured post-control species concentration × matched flow/time/state plus independent fugitives. Reconcile utilities common-period imports/actual generation/exports/storage and assigned process loads; only unassigned residual shared services. Gross heat deducts independently measured return on same datum once; already-net heat never deducts twice."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "foreground_dataset_conformance"
    rule: "NOx as NO2-equivalent differs from molecular NO2; gross metal oxide/fume differs from contained elemental species and PM must not overlap constituent reporting. State20, wrong reference property/compartment and unqueried identities are unavailable. Report accepted input, performed/skipped checks, findings, missing evidence and completeness."
    source_ids: []
