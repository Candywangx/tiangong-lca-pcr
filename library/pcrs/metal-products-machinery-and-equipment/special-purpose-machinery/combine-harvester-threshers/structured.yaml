system_boundary:
  rules:
    - rule_id: factory_gate
      applies_to: "all processes"
      rule: "Include actual receiving, manufacture, assembly, filling, acceptance, handling, pollution control and delivery preparation through gate. Later harvesting service, farm fuel, crop yield, wear replacement and end-of-life are separately modelled downstream."
      source_ids: []
    - rule_id: make_buy
      applies_to: "assembly"
      rule: "Maintain BOM make/buy matrix for every physical subsystem: supplied module boundary, own inputs/processes, retained fill, and shipped configuration. Bought engine/motor/transmission carries embedded metals, machining and supplier fills once; do not also add constituent raw material. Internally made cab, feeder, tank or separation systems require their actual material, part and process cards. Every additional motor, gear, sensor, tyre, bearing or chemical crossing separately gets a named atomic row; assembly names cannot conceal purchased parts."
      source_ids:
        - deere-s-series-4592208
        - claas-trion-walker
        - claas-trion-hybrid
    - rule_id: paint_kit_boundary
      applies_to: "joining_coating"
      rule: "Record base resin and hardener separately only when they cross separately: liquid is base resin excluding hardener. If a complete two-component kit is the supplied product, replace both separate cards with one kit card whose amount and upstream boundary include its actual hardener once. Bought pre-coated modules include coating upstream once; validate kit/base/hardener mutual exclusion against procurement and composition."
      source_ids: []
    - rule_id: delivery_configuration
      applies_to: "dispatch"
      rule: "Declare header included/absent; tracks versus mounted wheels, slope equipment, cab/HVAC and controls, aftertreatment and fluids. Trailed configuration includes actual drawbar/PTO, excludes supplying tractor and later tractor fuel; do not force a diesel engine or cab on it. Reusable dispatch fixture is excluded from M but its attributable service, loss and maintenance burden is included. Capital exclusions require stated rationale and coverage."
      source_ids:
        - claas-history
        - deere-s-series-4592208
