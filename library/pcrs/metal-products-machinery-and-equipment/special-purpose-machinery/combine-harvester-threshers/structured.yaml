  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all exchanges"
      requirement: "Actual product/species/provider/compartment identity and units must be resolved before dataset completion; no generic basket, unknown-as-zero or UUID-hit-driven scope restriction."
      evidence: "Supplier specification; direct flow identity; BOM"
    - id: finite_balance
      applies_to: "physical streams"
      requirement: "For each contained metal/species j separately, calculate each stream mass times its OWN matched assay on a declared wet/dry basis. Include purchased material, opening/closing stock, accepted product, scrap, dust, slag, sludge, wastewater and environmental releases plus reaction transformation. Never equate gross scrap/sludge mass with contained metal or reuse feed assay for product/waste. Close actual water: external water plus input moisture and opening stocks plus reaction-generated water equals shipped retained water, waste/effluent moisture, measured evaporation, reaction-consumed water and closing stocks. Pair and cancel internal return transfers. Each moisture term has its own matched assay, basis and uncertainty; circulating water is not external input. Close each actual solvent species with formulation assays for purchased input, stocks, retained coating, recovered solvent, capture media, waste/liquid transfers, actual destruction and measured air releases. An unexplained residual is investigated, never automatically an air emission. Use combined measurement, sampling and allocation uncertainty, not a universal closure tolerance."
      evidence: "Own assay per term; stocks; reaction and uncertainty records"
    - id: no_defaults
      applies_to: "all rows"
      requirement: "Collect measured site/configuration quantities; no universal machine weight, manufacturing energy, yield, operating productivity, lifetime or emission factor. Not-applicable needs route evidence and differs from measured zero/unknown."
      evidence: "Full representative period; route register; retained records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "combine_harvester"
    rule: "Verify N>0, D>0 and M same period/configuration, calibrated net acceptance, declared shipped header/fills, matching reference and denominator; reject weight/productivity proxies."
    source_ids: []
  - rule_id: validate_physical
    applies_to: "physical water/material/species rows"
    rule: "For each contained metal/species j separately, calculate each stream mass times its OWN matched assay on a declared wet/dry basis. Include purchased material, opening/closing stock, accepted product, scrap, dust, slag, sludge, wastewater and environmental releases plus reaction transformation. Never equate gross scrap/sludge mass with contained metal or reuse feed assay for product/waste. Close actual water: external water plus input moisture and opening stocks plus reaction-generated water equals shipped retained water, waste/effluent moisture, measured evaporation, reaction-consumed water and closing stocks. Pair and cancel internal return transfers. Each moisture term has its own matched assay, basis and uncertainty; circulating water is not external input. Close each actual solvent species with formulation assays for purchased input, stocks, retained coating, recovered solvent, capture media, waste/liquid transfers, actual destruction and measured air releases. An unexplained residual is investigated, never automatically an air emission. Use combined measurement, sampling and allocation uncertainty, not a universal closure tolerance."
    source_ids: []
  - rule_id: validate_energy
    applies_to: "utility rows"
    rule: "Reconcile each utility in one site period/unit: purchased imports plus actual generation plus opening storage equals assigned fabrication/coating/assembly/test/dispatch use plus unassigned residual plus exports and closing storage/loss. Shared services carry only causal share of unassigned residual. Verify negative residual against period, unit, stock and meter uncertainty; never clip it to zero. Purchased heat, own fuel generation and recovery transfers are distinct. Meter actual recovered test-cabin heat and paired internal transfer; cancel internal transfer on site aggregation. Reduce actual external heat requirement only through its measured resulting meter consumption; do not add an avoided-power credit or a second avoided-heat credit. Exports, if any, need separate measured destination and allocation."
    source_ids: []
  - rule_id: validate_test
    applies_to: "filling_testing"
    rule: "Separate retained diesel/oil/refrigerant from actual factory consumption, recovery and leak; resolve CO, NO and NO2 with species-specific evidence, not fuel carbon alone. Include actual pre-gate test crop and waste, exclude later farm use/yield."
    source_ids:
      - kappa-claas-test
  - rule_id: validate_coverage
    applies_to: "dataset"
    rule: "Audit all actual routes/BOM/exchanges and upstream links. Incomplete UUID, amount, conversion, species or compartment prevents complete dataset status; candidate methodology finite check is not publication or factual factory verification."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "process; lifecyclemodel"
  allowed_use: "Declared combine manufacturing with qualified upstream links"
  excluded_use: "Full harvest service comparison without downstream modelling; standalone threshers/parts/tractors"
  required_metadata: "factory and period; model/configuration; self-propelled or trailed; crop and harvesting attachment; delivered header inclusion; rotary, walker or hybrid architecture; wheel/track and slope system; engine or PTO drive; cab, HVAC, controls and battery; delivered fills; net accepted mass; test protocol; make/buy boundary; packaging"
  required_quality_disclosure: "Make/buy, route, quantity/identity gaps, uncertainty, allocation, upstream coverage and waste fate"
  update_trigger: "Configuration, supplier, fabrication/coating/test route, acceptance or delivery state change"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Structure, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "44122 and adjacent 44121–44129 identity; no manufacturing quantities."
  - id: "un-cpc-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC 3.0 Explanatory Notes, 30 June 2025, PDF/printed page 229. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Complete combine label and adjacent n.e.c. machinery/parts. No subclass-specific explanatory paragraph; exclusion of standalone threshers follows semantic integrated-machine boundary review, not an explicit quoted exclusion."
  - id: "deere-s-series-4592208"
    type: "handbook"
    reference: "John Deere, S-Series Combines, brochure 4592208, PDF created February 2024, pp. 6, 14, 22–23. https://www.deere.com/assets/pdfs/region-4/products/harvesting/s-series-combines/4592208-s-series-combines.pdf"
    used_for: "Rotary engine/feeding/cleaning/grain-handling, cab/controls and tyres/tracks; base specification excludes header. No mass, capacity or fuel-intensity default adopted; source mass text has a malformed value."
  - id: "claas-trion-walker"
    type: "handbook"
    reference: "CLAAS, TRION 600 / 500, original HTML snapshot 2 October 2026, APS WALKER and straw walker sections. https://www.claas.com/en-gb/agricultural-machinery/combine-harvesters/trion-600"
    used_for: "Walker configuration counterexample to rotary-only scope; no performance factor adopted."
  - id: "claas-trion-hybrid"
    type: "handbook"
    reference: "CLAAS, TRION 700, original HTML snapshot 2 October 2026, APS HYBRID SYSTEM. https://www.claas.com/en-gb/agricultural-machinery/combine-harvesters/trion-700"
    used_for: "Tangential threshing and axial secondary separation; no performance factor adopted."
  - id: "claas-history"
    type: "handbook"
    reference: "CLAAS, History, original HTML snapshot 2 October 2026. https://www.claas.com/en-ca/about-claas/history-light"
    used_for: "Historical trailed SUPER and subsequent self-propelled combines support propulsion boundary, not present-day sales mix or manufacturing intensity."
  - id: "new-holland-permit-1995"
    type: "official_guidance"
    reference: "Pennsylvania DEP, Operating Permit 36-2028, New Holland North America Inc., issued 17 October 1995, original PDF pp. 2–3. https://www.epa.gov/sites/default/files/2017-08/documents/new_holland_north_america.pdf"
    used_for: "Historical agricultural-equipment metal cleaning, liquid spray, water curtain/dry filter and drying ovens; composition/use/waste records. Not proof every combine factory uses these operations or named formulations; no permit limit used as an emission factor."
  - id: "kappa-claas-test"
    type: "handbook"
    reference: "Kappa Filter Systems, Future-proof test bench technology at CLAAS, original supplier case HTML snapshot 2 October 2026. https://www.kappa-fs.com/en/blog/stories-5/lufttechnik-fur-agrarmaschinen-49"
    used_for: "Actual factory test case: function testing, diesel exhaust capture, demand-controlled cabin ventilation and waste-heat recovery. No universal duration, fuel, efficiency or emission factor."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Allocation hierarchy only; no claim of complete PEF compliance."
