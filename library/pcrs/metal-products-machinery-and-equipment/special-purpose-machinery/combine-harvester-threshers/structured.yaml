allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint manufacturing"
    rule: "Subdivide first; otherwise use demonstrated physical causality (operation time, treated area, machine/test loads). Economic fallback requires consistent period/price and sensitivity. Preserve unallocated totals; do not allocate purely by machine mass without explaining configuration differences."
    source_ids:
      - ef-allocation-2021
  - rule_id: rework_waste
    applies_to: "all rows"
    rule: "Q includes rejected/reworked machine processing and retesting; N and D contain accepted output only. Cancel internal transfers, retain repeated energy/material losses. Account actual external scrap and treatment once; no automatic avoided-metal credits. Test grain/straw are test outputs, not default machine coproducts or agricultural yield."
    source_ids:
      - ef-allocation-2021
  - rule_id: shared_residual
    applies_to: "utilities"
    rule: "Reconcile each utility in one site period/unit: purchased imports plus actual generation plus opening storage equals assigned fabrication/coating/assembly/test/dispatch use plus unassigned residual plus exports and closing storage/loss. Shared services carry only causal share of unassigned residual. Verify negative residual against period, unit, stock and meter uncertainty; never clip it to zero. Purchased heat, own fuel generation and recovery transfers are distinct. Meter actual recovered test-cabin heat and paired internal transfer; cancel internal transfer on site aggregation. Reduce actual external heat requirement only through its measured resulting meter consumption; do not add an avoided-power credit or a second avoided-heat credit. Exports, if any, need separate measured destination and allocation."
    source_ids: []
