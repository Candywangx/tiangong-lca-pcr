measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "M = accepted net mass of one complete machine of the same configuration in kg; collect using cp_mass."
  - id: species_basis
    applies_to: "physical material and species records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For each contained metal/species j separately, calculate each stream mass times its OWN matched assay on a declared wet/dry basis. Include purchased material, opening/closing stock, accepted product, scrap, dust, slag, sludge, wastewater and environmental releases plus reaction transformation. Never equate gross scrap/sludge mass with contained metal or reuse feed assay for product/waste."
  - id: water_balance
    applies_to: "physical water and moisture records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Close actual water: external water plus input moisture and opening stocks plus reaction-generated water equals shipped retained water, waste/effluent moisture, measured evaporation, reaction-consumed water and closing stocks. Pair and cancel internal return transfers. Each moisture term has its own matched assay, basis and uncertainty; circulating water is not external input."
  - id: carrier_conversion
    applies_to: "energy rows"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh; MJ"
    rule: "Retain metered electricity separately; 1 kWh = 3.6 MJ. Gas volume requires actual composition, NCV and reference temperature/pressure; fluid volumes need actual density. Do not apply material assays to electricity/transport."
