measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete machine of the same configuration in kg; collect using cp_mass."
  - id: net_scope
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Include delivered incorporated accessories and initial fluid charge; exclude transport packaging. Do not use a brochure empty weight for another configuration or mix dry/gross mass."
  - id: composition
    applies_to: "chemical and metal rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record formulation mass and measured active/contained-element fraction separately; assay all balance terms and measure wet/dry basis."
  - id: utilities
    applies_to: "energy and water"
    required_property_ref:
      name: "Energy; Volume"
      uuid: ""
    required_unit: "kWh; MJ; m3"
    rule: "Preserve actual reference property and calibrated raw unit. kWh × 3.6 = MJ; fuel uses actual NCV, water density is source-specific."
process_map:
  - id: fabrication
    name: "Chamber, pan, frame and fluid-path fabrication"
    inclusion: "conditional"
    inclusion_condition: "Only actual in-house operations: cut, bend, machine and join certified sheet, tube and fittings; purchased completed vessels bypass supplier operations. Identify grade, joining procedure, scrap and food-contact finish."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow; collected per one accepted finished machine"
  - id: surface_finish
    name: "Conditional cleaning, passivation and protective finish"
    inclusion: "conditional"
    inclusion_condition: "Actual degreasing, weld cleaning, passivation or exterior coating only. Record bath identity/concentration, rinse and curing; no universal acid, solvent or coating recipe."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow; collected per one accepted finished machine"
  - id: thermal_assembly
    name: "Configured thermal and fluid-system assembly"
    inclusion: "required"
    inclusion_condition: "Assemble only the selected product route: gas/oil burner and heat exchanger for non-electric bakery ovens; actual hot-water/steam boiler, resistance/ceramic heater or supplied-steam interface for beverage/cooking machines. Retain pumps, valves and safety devices actually fitted."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow; collected per one accepted finished machine"
  - id: electromechanical
    name: "Drives, controls and configured refrigeration assembly"
    inclusion: "required"
    inclusion_condition: "Install actual wiring, controller, sensors and motor/fan/grinder/tilting mechanism. Cooling units are optional: define included delivered module, compressor and refrigerant only when part of the product."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow; collected per one accepted finished machine"
  - id: factory_acceptance
    name: "Factory leak, safety and functional acceptance"
    inclusion: "required"
    inclusion_condition: "Include actual pressure/leak, electrical safety, heating, circulation and control trials plus repeat tests and cleaning. Test limits follow approved design and applicable specification; tests are not lifetime customer operation."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow; collected per one accepted finished machine"
  - id: dispatch
    name: "Accepted release and transport packaging"
    inclusion: "required"
    inclusion_condition: "Release the complete accepted machine at factory gate with declared accessories and installed initial fluid charge. Weigh packaging separately and preserve net mass basis."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow; collected per one accepted finished machine"
  - id: shared_services
    name: "Shared factory utilities and pollution controls"
    inclusion: "required"
    inclusion_condition: "Reconcile allocated utilities, treatment and waste handling once across selected manufacture and factory tests; separately document purchased versus generated energy."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow; collected per one accepted finished machine"
