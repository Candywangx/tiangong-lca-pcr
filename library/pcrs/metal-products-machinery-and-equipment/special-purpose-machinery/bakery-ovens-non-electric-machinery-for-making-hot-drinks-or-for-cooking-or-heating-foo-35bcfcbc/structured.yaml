allocation_rules:
  - rule_id: allocation_causal
    applies_to: "shared manufacture"
    rule: "Prefer subdivision; if shared, document physical causality using measured duty/load and matching period. Mass alone is not sufficient for unequal furnace cycles, test times or cooling duties. Other relationships require justification and sensitivity; retain unallocated totals and ensure allocations sum to one."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_rejects
    applies_to: "rework and residues"
    rule: "Retain all attributable rejected and repeated-test burdens in accepted-machine production. Exclude rejected count from N. Cancel internal transfers; exported scrap/waste has actual treatment once. Revenue does not itself establish co-product status and no avoided-metal credit is assumed."
    source_ids:
      - ef-allocation-2021
