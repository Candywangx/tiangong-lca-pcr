  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
    - id: physical_balance
      applies_to: "site"
      rule: "Close each material/contained-element balance using opening stock + external inputs + reaction formation = closing stock + accepted product + external rejects/scrap + sludge/wastewater constituent + airborne species + reaction consumption. Apply measured assay to every corresponding stock/input/output term; gross steel mass is not chromium or nickel mass. Pair and cancel each internal transfer/recovery in the integrated boundary; internal return is not a new upstream purchase. For water use measured density and actual water fractions of wet product, sludge and residue: include make-up, test/cleaning feed, stock, retained moisture, evaporation, discharged water and reaction water; recirculation is paired, not consumption. For solvent retain fresh/recovered species, bath stock, residues, export, emissions and chemical reaction. Preserve residual and combined measurement/assay uncertainty; investigate unexplained closure, with no invented tolerance."
      inputs:
        - Stocks
        - assays
        - "calibrated meters"
        - "reaction and return records"
        - uncertainty
      output: "Closure residual and uncertainty"
      source_ids: []
    - id: energy_units
      applies_to: "utilities"
      rule: "kWh × 3.6 = MJ. Fuel mass × measured net calorific value = MJ. Net purchased steam energy E_net = m_steam × h_in - m_return × h_return: each measured kg is multiplied by matched specific enthalpy in MJ/kg at the actual pressure/temperature and common reference state. Retain actual return fraction and period/stock correspondence. In-house steam generation records its fuel, water and emissions instead of a second purchased-steam provider burden; do not duplicate generation fuel and supplied heat."
      inputs:
        - "Calibrated meters"
        - "supplier NCV and state"
        - "condensate return"
      output: "MJ"
      source_ids: []
  data_quality_requirements:
    - id: configuration
      applies_to: "final_product"
      requirement: "manufacturer; model and serial/configuration; non-domestic intended duty; bakery oven versus beverage/cooking/heating function; main heating technology and actual fuel; capacity, food-contact and pressure ratings; steel and elastomer grades; make/buy components; burner, heat exchanger, boiler, heater, pumps, fan, grinder and controls actually fitted; included cooling and other add-ons; initial fluid charge; delivered net mass M and acceptance state; factory site, period and supplier geography; factory test duty and test consumables"
      evidence: "Order; approved drawings/BOM; supplier certificates; actual acceptance"
    - id: identity_gaps
      applies_to: "all cards"
      requirement: "Resolve actual flow/provider/property and environmental compartment before complete dataset delivery. Generic sheet with no grade/state, Hong Kong water in a different region and source-specific biomass/incineration electricity do not establish these interfaces."
      evidence: "manifest review_metadata"
    - id: ranges
      applies_to: "all rows"
      requirement: "No universal empirical range is supported. Retain actual records, signed applicability, calibration and uncertainty; unknown mandatory amount blocks completeness, while demonstrated absence is not_applicable."
      evidence: "Factory and independently compatible source evidence"
validation_rules:
  - rule_id: validate_reference
    applies_to: "final_product"
    rule: "Verify category branch, non-domestic use, main heating technology, positive measured M and N, same delivered configuration, 1 kg reference and full qualifier coverage. No equivalent cooking-service comparison by machine mass alone."
    source_ids:
      - un-cpc3-2025
  - rule_id: validate_balance
    applies_to: "all processes"
    rule: "Close each material/contained-element balance using opening stock + external inputs + reaction formation = closing stock + accepted product + external rejects/scrap + sludge/wastewater constituent + airborne species + reaction consumption. Apply measured assay to every corresponding stock/input/output term; gross steel mass is not chromium or nickel mass. Pair and cancel each internal transfer/recovery in the integrated boundary; internal return is not a new upstream purchase. For water use measured density and actual water fractions of wet product, sludge and residue: include make-up, test/cleaning feed, stock, retained moisture, evaporation, discharged water and reaction water; recirculation is paired, not consumption. For solvent retain fresh/recovered species, bath stock, residues, export, emissions and chemical reaction. Preserve residual and combined measurement/assay uncertainty; investigate unexplained closure, with no invented tolerance."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "all applicable rows"
    rule: "Verify every actual route/external atomic flow, make/buy exclusivity, stocks, rejects/rework, causal utilities, normalization and species-specific post-control emissions. Unknown UUID/mandatory quantity or unsupported conversion blocks a complete dataset. This candidate methodology is not a certification or lifetime LCA."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset; process; lifecyclemodel"
  allowed_use: "Declared complete-equipment manufacture with verified upstream links"
  excluded_use: "Customer food-production inventory, domestic machines, electric industrial bakery ovens or unsupported full-service equivalence"
  required_metadata: "manufacturer; model and serial/configuration; non-domestic intended duty; bakery oven versus beverage/cooking/heating function; main heating technology and actual fuel; capacity, food-contact and pressure ratings; steel and elastomer grades; make/buy components; burner, heat exchanger, boiler, heater, pumps, fan, grinder and controls actually fitted; included cooling and other add-ons; initial fluid charge; delivered net mass M and acceptance state; factory site, period and supplier geography; factory test duty and test consumables"
  required_quality_disclosure: "Route and make/buy coverage; unresolved identities/ranges; measurement and balance uncertainty; allocations; supplier geography/year; waste fate"
  update_trigger: "Design/heating technology, supplier/grade, included cooling/add-ons, acceptance test, site or manufacturing route changes"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed pages 225–236, subclasses 43420/43430 and 44515/44516/44518. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Identity and adjacent product/part exclusions; classification alone is not manufacturing evidence."
  - id: "miwe-rack-oven"
    type: "handbook"
    reference: "MIWE roll-in e+ product information, PI RIE3.0/en/1909, pages 3–4. https://www.miwe.com/media/docs/produkte/prospekt/en/produktinformation-roll-in-eplus-3-0-en.pdf"
    used_for: "Oil/gas versus electric oven alternatives; stainless heat exchanger, steam system, insulated glass, controls and optional door drive. No BOM grade, fabrication recipe or energy intensity established."
  - id: "franke-a800"
    type: "handbook"
    reference: "Franke A800 product leaflet, 590.0690.071/09.23/CH-EN, pages 1–2. https://www.franke.com/content/dam/franke/language-masters/en/coffee-systems/documents/factsheets/en/EN_A800_Franke_CS_Product_Leaflet.pdf"
    used_for: "Commercial coffee-machine boiler, grinder, brewing/control architecture and configuration-dependent cooling add-ons; electrical beverage counterexample to extending oven qualifier to every machine. Brochure mass/power are not defaults."
  - id: "rational-ivario"
    type: "handbook"
    reference: "RATIONAL, iVario The Game Changer, Restaurant brochure, pages 8–9. https://hcms.rational-online.com/hcms/v1.7/entity/brochure/166028/storage/MDE2NjAyOC8wL3BkZi1wcmV2aWV3LTE1MHBwaS1wcmludHNoZWV0/download/20_720_brochure_ivario_pro_restaurant_letter-en_ca.pdf"
    used_for: "Electric ceramic heater and stainless pan-base configuration in commercial cooking; model-specific architecture, not factory consumption or food-production inventory."
  - id: "epa-fabricated-metal"
    type: "official_guidance"
    reference: "US EPA, Industrial Stormwater Fact Sheet Sector AA, EPA 833-F-06-042, Table 1 page 2. https://www.epa.gov/sites/default/files/2015-10/documents/sector_aa_fabmetal.pdf"
    used_for: "Generic fabrication countercheck for cutting, bending, welding, cleaning and associated residues. The sector explicitly excludes machinery: used only to prompt actual route verification, never to assert every route or an emission factor."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Subdivision and causal allocation hierarchy; no claim of complete PEF conformance."
