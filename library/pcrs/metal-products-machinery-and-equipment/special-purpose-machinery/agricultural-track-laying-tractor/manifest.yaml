review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: "New semantic record for complete agricultural track-laying tractors manufacturing; neighboring tractor records are empty scaffolds and no overlapping material tractor PCR was identified. Construction crawler dozers and separately sold implements are excluded. The retained leaf scaffold is not promoted. Classification acceptance remains separate."
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  evidence_limitations:
    - "Historical manufacturer documents support route/configuration examples only; current supplier specifications and measured foreground records govern each dataset."
    - "No universal machine mass, manufacturing loss, coating recipe, lifetime or emissions factor established."
    - "Inventory is a process-specific starting set; actual BOM, utilities, consumables, losses and species records must be reconciled and expanded before any completeness claim."
  unresolved_flow_identities:
    - row_id: carbon_plate
      selected_flow: "Hot-rolled carbon-steel plate"
      reason: "Public candidates have conflicting Chinese identities or pipe-mill-specific supply routes; neither safely identifies this carbon-steel plate."
    - row_id: hollow_section
      selected_flow: "Rectangular carbon-steel hollow section"
      reason: "Returned tube or enclosure candidates do not establish the specified section, grade and supply route."
    - row_id: cutting_fluid
      selected_flow: "Mineral-oil cutting-fluid concentrate"
      reason: "Generic Cutting Fluid includes gas and several formulations; a mineral-oil concentrate identity is not confirmed."
    - row_id: powder_waste
      selected_flow: "Discarded polyester coating powder"
      reason: "Public powder-waste rows are China-specific or have Aluminium content as reference property; a geographically unrestricted polyester-only mass identity remains unverified."
    - row_id: pretreatment_wastewater
      selected_flow: "Spent aqueous alkaline-degreasing rinse water"
      reason: "Direct-read candidate is specific to washing electrolytic manganese slag; fresh-water elementary flows cannot substitute for this waste stream."
    - row_id: test_no2
      selected_flow: "Nitrogen dioxide emitted to outdoor air, subcompartment unspecified"
      reason: "Repeated searches returned nitrogen, nitrite or product NOx; no species- and compartment-matching elementary NO2 identity directly verified."
    - row_id: spent_cutting_fluid
      selected_flow: "Spent mineral-oil cutting-fluid emulsion"
      reason: "Returned waste-oil and coolant flows do not verify this emulsion composition and treatment-transfer state."
    - row_id: purchased_chassis
      selected_flow: "Finished steel agricultural tractor chassis"
      reason: "Search candidates do not verify an agricultural track-tractor chassis boundary."
    - row_id: tractor_transmission
      selected_flow: "Finished agricultural tractor transmission"
      reason: "Returned wind-turbine gearboxes and shafts are not tractor transmissions."
    - row_id: final_drive
      selected_flow: "Finished crawler tractor final-drive assembly"
      reason: "Returned brake and press hydraulic assemblies do not establish a crawler final drive."
    - row_id: rubber_track
      selected_flow: "Finished reinforced rubber agricultural crawler track belt"
      reason: "Public results are conveyor belting, uncured belt intermediates and complete tractors, not this crawler belt."
    - row_id: steel_track
      selected_flow: "Finished steel crawler track-chain and shoe assembly"
      reason: "Two searches returned footwear or garment assemblies; no crawler track-chain/shoe identity verified."
    - row_id: track_idler
      selected_flow: "Finished crawler track idler wheel"
      reason: "Search does not establish an agricultural track idler finished-product identity."
    - row_id: track_roller
      selected_flow: "Finished crawler track support roller"
      reason: "Returned industrial rollers do not confirm agricultural crawler support roller configuration."
    - row_id: operator_cab
      selected_flow: "Finished agricultural tractor operator cab"
      reason: "Truck-base vehicles and generic assembly flows cannot stand for the specified tractor cab."
    - row_id: rear_hitch
      selected_flow: "Finished agricultural tractor three-point hitch"
      reason: "No matching tractor three-point-hitch identity verified."
    - row_id: radiator
      selected_flow: "Finished tractor engine coolant radiator"
      reason: "Candidate heat exchangers do not confirm a complete tractor coolant radiator."
    - row_id: wiring_harness
      selected_flow: "Finished insulated copper tractor wiring harness"
      reason: "Search does not confirm the specified complete tractor harness."
    - row_id: controller
      selected_flow: "Finished agricultural tractor electronic control unit"
      reason: "Generic controller categories do not establish tractor ECU applicability."
    - row_id: engine_coolant
      selected_flow: "Formulated premixed ethylene-glycol engine coolant"
      reason: "No applicable premixed concentration-specific coolant identity verified."
    - row_id: engine_oil
      selected_flow: "Formulated diesel-engine lubricating oil"
      reason: "Generic oil categories do not establish formulated diesel-engine lubricant grade."
    - row_id: ac_refrigerant
      selected_flow: "1,1,1,2-tetrafluoroethane factory refrigerant charge"
      reason: "Direct public R134a candidate is at-use leakage/top-up in fishing onboard cooling, not factory tractor AC charge."
    - row_id: housing_blank
      selected_flow: "Unmachined cast-iron tractor transmission housing"
      reason: "Search returned cast iron material, balls and pipe fittings; no verified shaped transmission-housing blank."
