  unresolved:
    inventory_flow_uuids:
      - row_id: drive_motor
        reason_code: manual_review_required
        explanation: Two public Electric motor candidates have indistinguishable identity facts; underground-duty technology remains unverified.
      - row_id: lubricating_oil
        reason_code: manual_review_required
        explanation: Two public lubricating-oil candidates are indistinguishable and actual grade remains unverified.
      - row_id: idler_roller
        reason_code: no_exact_candidate
        explanation: Reviewed candidates are bearings, other components, or unrelated products rather than complete conveyor idler roller assemblies.
      - row_id: steel_chain
        reason_code: no_exact_candidate
        explanation: Reviewed candidates do not identify an armored face conveyor steel chain assembly.
      - row_id: factory_electricity
        reason_code: manual_review_required
        explanation: Public alternating-current candidates are indistinguishable and the electricity supply mix is unresolved.
    range_evidence_needs:
      - row_id: steel_plate
        need: Independent, boundary-compatible foreground evidence for structural steel input per accepted underground machine.
      - row_id: flux_wire
        need: Independent, boundary-compatible evidence for flux-cored welding wire consumption per accepted underground machine.
      - row_id: drive_motor
        need: Independent, boundary-compatible evidence for drive motor mass by underground conveyor configuration.
      - row_id: lubricating_oil
        need: Independent, boundary-compatible evidence for initial lubricant charge by underground conveyor drive configuration.
      - row_id: rubber_belt
        need: Independent, boundary-compatible evidence for installed belt mass by underground conveyor configuration.
      - row_id: idler_roller
        need: Independent, boundary-compatible evidence for installed idler assembly mass by belt-route configuration.
      - row_id: steel_chain
        need: Independent, boundary-compatible evidence for installed chain assembly mass by chain-route configuration.
      - row_id: factory_electricity
        need: Independent, boundary-compatible evidence for fabrication and assembly electricity per accepted underground machine.
      - row_id: steel_scrap
        need: Independent, boundary-compatible evidence for structural fabrication scrap per accepted underground machine.
      - row_id: finished_machine
        need: Independent comparable product-mass evidence for an external screening range; actual output M remains a required foreground measurement.
