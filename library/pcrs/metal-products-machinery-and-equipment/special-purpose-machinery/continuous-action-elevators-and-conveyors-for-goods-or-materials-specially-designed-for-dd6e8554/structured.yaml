measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete machine of the same configuration in kg; collect using cp_mass."
  - id: physical_species
    applies_to: "physical material and species records only"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Each material uses its own wet/dry basis, moisture and assay; retained first-fill belongs to machine mass, packaging and rejects do not. Gross mass is not contained Fe, Cr, Mn, Zn, solvent or oil mass."
  - id: utility_units
    applies_to: "utility records"
    required_property_ref:
      name: "Recorded delivered property"
      uuid: ""
    required_unit: "native meter unit"
    rule: "Keep electricity kWh, heat MJ and gas volume/state separate; 1 kWh = 3.6 MJ is an exact conversion, not an electricity emission factor."
