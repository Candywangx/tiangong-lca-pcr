system_boundary:
  rules:
    - rule_id: b_manufacture
      applies_to: "foreground"
      rule: "Include attributable receipt, actual manufacture, finishing, assembly, first fill, testing, rejects/rework, factory waste/emissions and dispatch."
      source_ids: []
    - rule_id: b_makebuy
      applies_to: "all processes"
      rule: "Use the matrix below: bought finished components retain upstream burdens once; in-house raw inputs replace bought finished equivalents. Internal transfer cancels in consolidated inventory."
      source_ids:
        - komatsu-longwall-2023
    - rule_id: b_later
      applies_to: "foreground"
      rule: "Separate underground installation, use-stage transport energy, maintenance and end of life; no crusher/cutter/roof support is a reference conveyor."
