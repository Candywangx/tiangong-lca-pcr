allocation_rules:
  - rule_id: a_direct
    applies_to: "shared operations"
    rule: "Prefer physical subdivision, work orders and submeters; retain rejected/reworked production burdens in the attributable period Q."
    source_ids: []
  - rule_id: a_causal
    applies_to: "residual shared services"
    rule: "Allocate only measured unassigned residual using justified machine-hours, heat demand, coated area or other measured causal driver; disclose numerator and denominator."
    source_ids:
      - jrc-metal-2020
  - rule_id: a_scrap
    applies_to: "scrap and residues"
    rule: "Report actual waste outputs and treatment interfaces; no avoided virgin-metal credit in this foreground inventory. Internal return metal is not purchased recycled metal."
    source_ids: []
  - rule_id: a_unresolved
    applies_to: "inseparable products"
    rule: "No revenue or mass allocation by default; require causal evidence and sensitivity review if subdivision cannot resolve joint burdens."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "assembly"
      flow_role: "finished_underground_conveyor"
      record_type: "calibrated weighing"
      raw_fields: "model; configuration; serial; accepted net mass M; accepted count N; total accepted net mass; tare; acceptance"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each lot and reporting period"
      temporal_coverage: "one stated period"
      site_scope: "declared factory and suppliers"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration; invoices; signed records; sample chain; uncertainty"
    - protocol_id: cp_physical
      process_id: "receipt_fabrication_casting_chain_belt_finish_assembly_services"
      flow_role: "physical mass inputs and outputs"
      record_type: "stores and scale records"
      raw_fields: "row identity; grade; batch; issued; returned; opening and closing stocks; gross/tare/net; wet/dry; own moisture and species assay; internal transfer pair; Q; N; configuration"
      collection_method: "Trace calibrated scales, issue/return, manifests and samples to the same configuration-period; capture rejects and rework burdens."
      unit: "kg"
      frequency: "each lot and reporting period"
      temporal_coverage: "one stated period"
      site_scope: "declared factory and suppliers"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "calibration; invoices; signed records; sample chain; uncertainty"
    - protocol_id: cp_components
      process_id: "receipt_assembly"
      flow_role: "purchased complete components"
      record_type: "supplier and installation records"
      raw_fields: "part/serial; supplier; actual grade; supply state; count; verified net part mass; prefill; BOM; Q; N"
      collection_method: "Reconcile actual accepted BOM and supplier weights; verify length-to-mass including splices, joints and surplus, not nominal average."
      unit: "kg"
      frequency: "each lot and reporting period"
      temporal_coverage: "one stated period"
      site_scope: "declared factory and suppliers"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "calibration; invoices; signed records; sample chain; uncertainty"
    - protocol_id: cp_electricity
      process_id: "receipt_fabrication_casting_chain_belt_finish_assembly_services"
      flow_role: "electricity rows"
      record_type: "meter and load records"
      raw_fields: "row_id; meter; opening/closing; imports; generation; exports; storage; assigned subprocess loads; residual; causal driver; Q; N"
      collection_method: "Reconcile each meter and allocated residual with one site period; retain kWh and uncertainty."
      unit: "kWh"
      frequency: "each lot and reporting period"
      temporal_coverage: "one stated period"
      site_scope: "declared factory and suppliers"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "calibration; invoices; signed records; sample chain; uncertainty"
    - protocol_id: cp_water
      process_id: "fabrication_casting_chain_belt_finish_assembly"
      flow_role: "water and aqueous discharge"
      record_type: "water meter and sampling"
      raw_fields: "makeup; constituent moisture; opening/closing water stocks; recycled pairs; evaporation; reaction water; discharge; own water fraction; Q; N"
      collection_method: "Meter all external water and sample aqueous outputs on their own wet/dry basis; paired reuse is internal."
      unit: "kg"
      frequency: "each lot and reporting period"
      temporal_coverage: "one stated period"
      site_scope: "declared factory and suppliers"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "calibration; invoices; signed records; sample chain; uncertainty"
    - protocol_id: cp_fuel
      process_id: "casting_chain_belt_finish"
      flow_role: "natural gas"
      record_type: "fuel meter and certificate"
      raw_fields: "delivered volume; temperature; pressure; standard state; composition; lower heating value; carbon; Q; N"
      collection_method: "Retain delivery conditions and convert volume only using actual state/composition; record attributable thermal load."
      unit: "m3"
      frequency: "each lot and reporting period"
      temporal_coverage: "one stated period"
      site_scope: "declared factory and suppliers"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "calibration; invoices; signed records; sample chain; uncertainty"
    - protocol_id: cp_emission
      process_id: "casting_chain_belt_finish"
      flow_role: "species-specific air outputs"
      record_type: "stack and fugitive sampling"
      raw_fields: "species; compartment; concentration; gasflow; duration; capture; retained; recovered; destroyed; nonair; stocks; uncertainty; Q; N"
      collection_method: "Use species-resolved measured released mass or verified closed species balance; capture is not destruction."
      unit: "kg"
      frequency: "each lot and reporting period"
      temporal_coverage: "one stated period"
      site_scope: "declared factory and suppliers"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "calibration; invoices; signed records; sample chain; uncertainty"
    - protocol_id: cp_transport
      process_id: "receipt"
      flow_role: "inbound_road"
      record_type: "shipment records"
      raw_fields: "shipment; mode; payload; distance; vehicle class; returns; Q; N"
      collection_method: "Match actual shipment payload and travelled distance; empty return only with service boundary evidence."
      unit: "t km"
      frequency: "each lot and reporting period"
      temporal_coverage: "one stated period"
      site_scope: "declared factory and suppliers"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "calibration; invoices; signed records; sample chain; uncertainty"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "configuration"
      requirement: "Retain actual underground design, acceptance, BOM, make/buy and supplier physical state"
      evidence: "drawings; certificates; route ledger"
    - id: dq_period
      applies_to: "records"
      requirement: "Match representative period and configuration; include rejects/rework; explain trials and product mix"
      evidence: "production ledger; time logs"
    - id: dq_closure
      applies_to: "physical balances"
      requirement: "Complete balances with own measured fractions and combined uncertainty; missing is unresolved"
      evidence: "calibration; laboratory chain; closure workbook"
    - id: dq_supply
      applies_to: "upstream"
      requirement: "Match physical provider interface and geography; no source-specific US electricity or biomass incineration substituted as generic factory power"
      evidence: "supplier contracts; dataset comments; sensitivity"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference"
    rule: "Verify complete underground continuous design, architecture, safety and acceptance qualifiers; reject generic surface conveyors or conveying service."
    source_ids: []
  - rule_id: v_denominator
    applies_to: "all inventory rows"
    rule: "Verify same configuration-period Q, N and accepted calibrated net masses; output 1 kg and every row has the supported conversion. Reject packaging/reject denominator or cross-configuration average."
    source_ids: []
  - rule_id: v_routes
    applies_to: "make/buy matrix"
    rule: "Prove each conditional exchange present or not_applicable; unknown is not zero. Bought/made, belt/chain/bucket and electric/gas routes cannot be added indiscriminately."
    source_ids: []
  - rule_id: v_balance
    applies_to: "physical materials and species"
    rule: "Close total mass, own-assay contained species, water and solvent with stocks/reactions/internal pairs; compare residual with actual combined uncertainty and investigate, never universal tolerance."
    source_ids: []
  - rule_id: v_utility
    applies_to: "utility rows"
    rule: "Reconcile process submeters plus only unassigned residual to the same net site-period supply, including generation, exports/storage; investigate negative residual, never clip."
    source_ids:
      - jrc-metal-2020
  - rule_id: v_identity
    applies_to: "upstream and emission rows"
    rule: "Require actual type/property/state/provider/geography/compartment compatibility; unresolved UUIDs and empirical factors remain declared gaps, no fabricated substitutions. Fuel carbon alone cannot establish CO or NOx."
    source_ids: []
  - rule_id: v_balance_materials
    applies_to: "physical materials and species records"
    rule: "For each actual material identity: external input + opening stock + reaction generation = accepted retained material + reject/scrap + slag + sludge + wastewater-carried material + captured residue + released species + closing stock + reaction consumption. Internal return input/output pairs cancel; follow rework into accepted outputs or waste. Resolve totals using actual weighing and process chemistry, not assumed yield."
    source_ids: []
  - rule_id: v_balance_contained_species
    applies_to: "physical materials and species records"
    rule: "For each Fe/Cr/Mn/Zn or actual species k, term_k = each term dry mass × its own matched dry-basis assay (or wet mass × its own wet-basis concentration). Product, scrap, slag, dust, sludge, wastewater and release each require their own assay, moisture and sample coverage. Add species stocks and actual reactions/transformation; never apply input steel assay to all outputs or equate gross waste to contained metal."
    source_ids: []
  - rule_id: v_balance_water
    applies_to: "physical materials and species records"
    rule: "External makeup + incoming material/coating/fluid moisture + opening water stocks + reaction-generated water = retained product/first-fill water + evaporated water + discharge water + waste moisture + closing water stocks + reaction-consumed water. Every wet stream uses its own water fraction; internally recirculated cooling/test water is a paired transfer, not new supply. Distinguish purchased water and direct extraction with its actual resource compartment."
    source_ids: []
  - rule_id: v_balance_solvent
    applies_to: "physical materials and species records"
    rule: "For each actual solvent: external fresh input + formulation-contained solvent + opening solvent stocks = retained solvent in product + recovered solvent exported + solvent in waste/capture medium/wastewater + measured species destruction + released solvent to air + closing stocks. Internally recovered/reused solvent cancels as paired transfer. A capture efficiency is not destruction; missing non-air terms cannot be assigned to air. Split every actual solvent species and quantify oxidizer reaction products separately."
    source_ids: []
  - rule_id: v_balance_utilities
    applies_to: "utility records"
    rule: "On the same site period and units: net available electricity = purchased imports + measured onsite generation + storage discharge - exports - storage charging/losses. Assigned process loads + unassigned residual must reconcile to that amount; services receive only the measured residual and their attributable causal share. Do not add whole-factory total over subprocess meters. Treat compressed air and recirculated heat as internal transfers, meter compressor/generation inputs once. Keep onsite fuel and species emissions separate from purchased utility upstream. Investigate negative residuals, overlapping meters or uncertain storage using original readings, never clip."
    source_ids: []
  - rule_id: v_balance_uncertainty
    applies_to: "physical materials and species records"
    rule: "For each residual propagate actual scale, meter, sampling, assay, allocation and stock uncertainty with recorded correlation where known. Investigate statistically meaningful residuals and possible missing flows or mismatched period/state; retain unexplained residual as a quality gap. No universal numerical tolerance, invented loss factor or default emission factor applies. Fuel-carbon reconciliation cannot alone establish CO, NOx or particulate emissions; obtain species/compartment-specific evidence and add atomic rows."
    source_ids: []
  - rule_id: v_period_accounting
    applies_to: "all inventory rows"
    rule: "For each same configuration-period, Q is attributable exchange including reject/rework burden; N is accepted complete units; M = sum of calibrated accepted net masses / N; q_item = Q / N; q_ref = q_item / M = Q / sum of accepted net masses. Exclude packaging and reject mass from denominator; never pool different configurations. Retained installed first-fill is included in accepted net mass."
    source_ids: []
  - rule_id: v_architecture_makebuy
    applies_to: "actual route records"
    rule: "AFC cast-side sections and fabricated abrasion plates are distinct operations; only actual in-house casting/chain forming-welding-hardening has foreground inputs. Purchased castings, heat-treated chain, gears and motors carry embedded manufacture once. Belt/PVC solid-woven impregnation-plasticization, rubber calendering-vulcanization and actual PVG covering are distinct conditional routes, not one common recipe. Purchased belts have upstream burden and only actual installation/splicing here. Actual underground bucket/other design needs project evidence and actual cut/form/join or bought-element supply state. No compulsory alloy, temperature, compound recipe or safety certification is inferred."
    source_ids:
      - komatsu-longwall-2023
      - fenner-pvc
      - fenner-pvg
      - fenner-production
published_dataset_profile:
  dataset_role: "Configuration-specific foreground manufacturing package"
  downstream_use: "secondary_dataset; background_dataset; process; lifecyclemodel"
  allowed_use: "Manufacture/procurement studies with matching underground architecture and declared functional capacity"
  excluded_use: "Direct equivalence per kg between unlike conveyors; conveying-service lifecycle without added use/installation stages"
  required_metadata: "PCR/version; configuration; accepted BOM; actual supplier/make/buy; Q/N/M; site/period; safety; drive/element; boundary; packaging; allocation; stocks; assays; uncertainties; proxies"
  required_quality_disclosure: "Coverage, missing records/UUIDs/ranges, calibration, residuals, sample uncertainty, conditional absences and unresolved source evidence"
  update_trigger: "Architecture, capacity, grade/formulation, chain/belt, drive, supplier/site/utility, safety, process or boundary change"
