    - id: dq_upstream
      applies_to: "purchased inputs"
      requirement: "Record supplier material grade, component specification, geography, data year and upstream dataset identity."
      evidence: "supplier documentation and dataset metadata"
    - id: dq_completeness
      applies_to: "all rows"
      requirement: "Record zero or not applicable explicitly for absent conditional routes; do not omit applicable waste or electricity."
      evidence: "route declaration and reconciled logs"
    - id: dq_mass
