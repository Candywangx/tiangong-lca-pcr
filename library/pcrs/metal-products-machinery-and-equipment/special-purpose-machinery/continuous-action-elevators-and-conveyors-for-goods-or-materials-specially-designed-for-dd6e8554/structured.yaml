allocation_rules:
  - rule_id: allocation_direct
    applies_to: "material_and_component_inputs"
    rule: "Assign BOM and purchase records to the accepted configuration before applying any shared-shop allocation."
    source_ids:
      - djordjevic-2018-conveyor-lca
  - rule_id: allocation_energy
    applies_to: "shared_factory_electricity"
    rule: "Submeter where possible; otherwise allocate period electricity by recorded machine-hours for the same included operations, and divide by accepted machines of that configuration. Report the rule and denominator."
    source_ids:
      - djordjevic-2018-conveyor-lca
  - rule_id: allocation_scrap
    applies_to: "steel_scrap"
    rule: "Record segregated steel scrap as waste output; any recycling credit belongs in a separately declared downstream model."
    source_ids:
      - djordjevic-2018-conveyor-lca
