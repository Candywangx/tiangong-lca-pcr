      temporal_coverage: "acceptance event"
      site_scope: "manufacturing site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "traceable weighing and acceptance records"
  calculation_rules:
    - id: energy_per_machine
      applies_to: "factory_electricity"
      rule: "Attributable period electricity divided by accepted machines of the same configuration, after documented machine-hour attribution."
      inputs:
        - "period meter MJ"
        - machine-hours
        - "accepted count"
        - cp_factory_electricity
      output: "MJ per accepted machine"
      source_ids:
        - djordjevic-2018-conveyor-lca
    - id: scrap_fraction_check
      applies_to: "steel_scrap"
      rule: "Divide measured steel scrap by measured steel plate issued to the same configuration for a non-normative quality check."
      inputs:
        - steel_scrap
        - steel_plate
        - cp_frame_scrap
        - cp_frame_materials
      output: "scrap fraction"
      source_ids:
