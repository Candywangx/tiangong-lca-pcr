validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_product"
    rule: "Require CPC 44411 underground-duty machine identity, accepted configuration and matching reference-flow UUID."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_mass
    applies_to: "all_inventory_rows"
    rule: "Verify every amount is per the same one accepted finished machine and output is measured M kg."
    source_ids:
      - djordjevic-2018-conveyor-lca
  - rule_id: validate_routes
    applies_to: "belt_and_chain_rows"
    rule: "Verify exactly the declared belt or chain route rows are applicable and their component specifications are disclosed."
    source_ids:
      - cowan-1975-face-haulage
  - rule_id: validate_evidence
    applies_to: "external_ranges"
    rule: "Do not substitute case-study values for underground equipment ranges; obtain independent compatible originals before any external range is adopted."
    source_ids:
      - djordjevic-2018-conveyor-lca
