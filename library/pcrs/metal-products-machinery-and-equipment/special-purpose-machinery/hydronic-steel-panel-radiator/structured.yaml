process_map:
  - id: forming
    name: "Steel blanking and panel/fin pressing"
    inclusion: "required"
    inclusion_condition: "Actual manufacturer forming of pressure-panel steel and declared fins; bought-in formed parts replace the matching site stock/operations. Supplier steelmaking/cold rolling stays upstream."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: joining
    name: "Panel seam and convector joining"
    inclusion: "required"
    inclusion_condition: "Actual released seam/spot-weld route and fitting integration; no assumed filler wire/shield gas for resistance welding. Alternative welds and outsourced work require their own measured inventories."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: testing
    name: "Leak/pressure testing and draining"
    inclusion: "required"
    inclusion_condition: "Current model-specific accepted test procedure determines medium, pressure, duration and pass criteria. Hydrostatic water is conditional; air testing has measured compressor demand. Reject/rework included."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: pretreatment
    name: "Cleaning and conversion pretreatment"
    inclusion: "conditional"
    inclusion_condition: "Actual site cleaning/pretreatment recipe only; no universal zinc phosphate or alkaline cleaner prescribed. Record real bath chemistry and water/heat carriers separately."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: coating
    name: "Primer, powder application and cure"
    inclusion: "required"
    inclusion_condition: "Declared surface coating route; actual supplier-finished part replaces local coating. Primer is conditional and powder formulation, cure carrier and recovery are site-specific."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: release
    name: "Fitted accessory assembly and release"
    inclusion: "required"
    inclusion_condition: "Fit declared covers/plugs/vent/valve, inspect finish and connections, reconcile accepted dry complete configuration and weigh net M."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: packing
    name: "Transport protection and dispatch"
    inclusion: "conditional"
    inclusion_condition: "Actual film/board/protection only; detached mounting kit separately disclosed; packaging excluded from M."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
