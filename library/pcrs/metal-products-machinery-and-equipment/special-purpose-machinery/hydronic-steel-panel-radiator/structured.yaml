allocation_rules:
  - rule_id: allocation_direct
    applies_to: "manufacturing"
    rule: "Prefer work-order issues/submeters. Under cp_allocation split shared press/weld/bath/oven/compressor demand using measured causal demand or load/time, justify each driver and reconcile allocated plus excluded demand to the total. No fixed ratio or automatic mass allocation from EPD cases."
    source_ids: []
  - rule_id: allocation_variants
    applies_to: "configurations"
    rule: "Separate panel/fin counts, dimensions, surface areas, primer and cure routes. Accepted count alone need not explain shared energy. A mass/economic fallback requires measured causal justification, sensitivity and review."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "waste"
    rule: "Track actual steel scrap and bath/powder waste without automatic avoided-steel or module-D credits. Internal reusable stock/powder/water remain internal. Genuine independent marketable outputs require disclosed quality/quantity and justified co-product treatment."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "release"
      flow_role: "finished_machine"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted configuration/serial or traceable homogeneous batch"
      temporal_coverage: "same manufacturing period"
      site_scope: "same site and dry fitted supply"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "calibration; dry/drained state; fitted BOM; signed release"
    - protocol_id: cp_forming
      process_id: "forming"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "steel grade/thickness/route and sheet area; issues/returns; panel/fin dimensions/count; actual press/cut time/load/kWh; forming oil recipe; trim scrap mass"
      collection_method: "Weigh each coil issue/valid return and separate trim scrap; trace actual panel/fin nesting and forming yield; meter press/tool demand. No assumed sheet thickness, standard radiator weight or residual BOM mass."
      unit: "kg; MJ"
      frequency: "each work order/batch/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; matched accepted count"
      site_scope: "same site/configuration; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier records; stock/count closure; missing data"
    - protocol_id: cp_joining
      process_id: "joining"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "weld route/map/current/time; fittings alloy/thread/mass; joint rework/rejects; kWh; electrode wear and other consumables"
      collection_method: "Trace joint work orders and fitting issues; submeter seam/spot welding and actual extraction; record electrode replacement and each actual alternative weld consumable separately."
      unit: "kg; MJ"
      frequency: "each work order/batch/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; matched accepted count"
      site_scope: "same site/configuration; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier records; stock/count closure; missing data"
    - protocol_id: cp_testing
      process_id: "testing"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "model/serial; signed test medium/pressure/time/criteria; calibrated gauge; leak results/rework; new water and purge masses; compressor/pump/dryer kWh; drained state"
      collection_method: "Retain actual released test plan/results; meter water make-up and energy, separate recirculation and treatment-bound purge with contamination/handler; confirm empty dry product before M weighing. No universal pressure or duration."
      unit: "kg; MJ"
      frequency: "each work order/batch/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; matched accepted count"
      site_scope: "same site/configuration; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier records; stock/count closure; missing data"
    - protocol_id: cp_pretreatment
      process_id: "pretreatment"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "bath recipe/SDS; NaOH supplied concentration and mass; conversion solution composition; water mass/temperature/density/volume; net issues/returns; bath replacement; wet sludge mass/dry solids; effluent quality/handler; kWh"
      collection_method: "Measure each chemical as actual solution mass and net make-up, retain supplier composition; weigh sludge with moisture basis and meter treatment-bound effluent separately. Shared bath heating/pumps allocated on measured demand; no universal concentration/consumption."
      unit: "kg; MJ"
      frequency: "each work order/batch/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; matched accepted count"
      site_scope: "same site/configuration; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier records; stock/count closure; missing data"
    - protocol_id: cp_coating
      process_id: "coating"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "powder/primer formulation/SDS/colour/solids; net issues/returns/recovery; dry retained film; actual cure route/time; kWh; gas meter reference temperature/pressure/supplier composition; waste powder; outlet PM and fossil-carbon balance"
      collection_method: "Weigh each actual formulated coating and unreused waste, keep internal powder recovery; meter oven/fans by actual carrier. Measure post-control outlet particulate with matched gas volume/time/size; use measured fossil-carbon input, retention and other outputs or direct monitoring for CO2, no assumed factor."
      unit: "kg; MJ; m3"
      frequency: "each work order/batch/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; matched accepted count"
      site_scope: "same site/configuration; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier records; stock/count closure; missing data"
    - protocol_id: cp_release
      process_id: "release"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "model/BOM/serial; panel/fin/cover/connection supply; plugs/vent/valve/gaskets and included boundaries; dry coating/retained state; dimensions/weld/leak/finish acceptance; kWh; M; detached-kit boundary"
      collection_method: "Trace actual fitted parts and weigh mass, reconcile supplier-contained components and dry film; inspect current acceptance records and meter final fitting/inspection demand. Detached hardware is separate supplied product, not radiator weight."
      unit: "kg; MJ"
      frequency: "each work order/batch/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; matched accepted count"
      site_scope: "same site/configuration; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier records; stock/count closure; missing data"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "PE recipe/thickness/recycled fraction and mass; board flute/fiber/recycled specification and mass; issues/returns; shipment configuration; detached hardware list"
      collection_method: "Weigh each actual packing material separately and exclude from M; record net issues and separate hardware supply. Add actual timber/foam/tape as individual exchanges, no generic packaging mix."
      unit: "kg"
      frequency: "each work order/batch/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; matched accepted count"
      site_scope: "same site/configuration; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier records; stock/count closure; missing data"
    - protocol_id: cp_allocation
      process_id: "manufacturing"
      flow_role: "shared_demand"
      record_type: "measurement"
      raw_fields: "total meter demand; submeter load/time; served variants; excluded loads"
      collection_method: "Submeter or measure exchange-specific causal load and actual time, justify driver and reconcile to total supplied demand."
      unit: "MJ; m3; h"
      frequency: "each shared batch; monthly closure"
      temporal_coverage: "same manufacturing period"
      site_scope: "all served variants and excluded operations"
      aggregation_rule: "partition by measured causal demand; attributable amount / accepted units"
      quality_evidence: "closure; submeter comparison; sensitivity; uncertainty"
  calculation_rules:
    - id: normalize_mass
      applies_to: "panel_steel; fin_steel; forming_oil; forming_electricity; steel_scrap; steel_connection; joining_electricity; test_water; testing_electricity; test_effluent; wash_water; sodium_hydroxide; zinc_phosphate_solution; pretreatment_electricity; wash_effluent; phosphate_sludge; epoxy_primer; powder_paint; coating_electricity; natural_gas; powder_waste; powder_air; fossil_co2_air; brass_plug; brass_vent; integrated_valve; top_grille; side_cover; epdm_gasket; release_electricity; pe_film; corrugated_board"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "flows"
      requirement: "Verify steel grade/rolled state, solution concentration/resin formulation, fitted supply, gas quality/reference state and environmental medium; public identity and provider inventories are distinct."
      evidence: "supplier sheets; state100 identity/property/unit audit"
    - id: quality_complete
      applies_to: "radiator"
      requirement: "Reconcile dry fitted BOM and coating to M, all actual stock/utility/chemical inputs and losses/rework/tests, and detached-kit disclosure. Never fill unknown component masses as residual."
      evidence: "calibrated weigh; stock/bath balances; signed release"
    - id: quality_period
      applies_to: "records"
      requirement: "Declare site/complete period, variants, outsourcing, utility routes, setup/idle load, primary coverage and uncertainty. EPD historical site quantities and cut-offs are not current universal data."
      evidence: "work orders; calibration; coverage; source limits"
    - id: quality_acceptance
      applies_to: "release"
      requirement: "Retain actual model-specific dimensions, weld/leak/pressure tests, finish and fitted supply acceptance; actual performance declaration conditions if cited. No inferred universal EN442 numerical limits or certified status."
      evidence: "released specification; gauges; serial/batch test sheets"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_machine"
    rule: "Require1kg output and cp_mass measured dry complete-unit M, reconciled exact panel/fin/fitted accessory supply; no pressure-test water, packaging or detached hardware in M."
    source_ids: []
  - rule_id: validation_normalization
    applies_to: "inventory"
    rule: "All applicable non-reference rows explicitly use normalize_mass and declared collection protocol; check same accepted count/period/configuration and numerator units."
    source_ids: []
  - rule_id: validation_routes
    applies_to: "manufacturing"
    rule: "Match forming/joining/test/pretreatment/coating to actual plant records; avoid bought-in-part/site-stock and powder-recovery duplication. Missing actual chemistry, media or carrier remain gaps."
    source_ids: []
  - rule_id: validation_species
    applies_to: "elementary_flows"
    rule: "Verify unspecified-size post-control outdoor-air particulate and immediate fossil CO2 to unspecified air. Long-term/high-stack flows, biogenic CO2, total NOx, captured powder and treatment effluent are not equivalent. Add actual combustion species individually when measured; do not assume all NOx is NO2."
    source_ids: []
  - rule_id: validation_coverage
    applies_to: "dataset"
    rule: "Distinguish measured/calculated/estimated/excluded/not-applicable/missing; reconcile accepted dry output, material/bath loops and allocated demand. Check pass does not approve science, inherit EPD verification or establish complete cradle-to-gate coverage."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_manufacturing_module"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing module for exact dry hydronic steel-panel configuration/site/period; upstream-connected assessment only after separately establishing suppliers/transport/treatment coverage."
  excluded_use: "Building heat-service, operating water/heat, generic radiator thermal equivalence, lifetime-normalized comparisons and unsupported complete cradle-to-gate/EPD claims."
  required_metadata: "PCR id; model/BOM/panel/fin/dimensions; dry fitted net M and detached-kit boundary; test/finish/performance conditions; site/period; steel/chemical suppliers and make-or-buy; cure/gas/electricity/bath routes; providers/transport/waste; packing; allocation; sources/version."
  required_quality_disclosure: "Primary measured coverage; unresolved identity/provider/amount; omitted routes; bath/water/powder loops; source age/version limits; allocation/corrections; emissions evidence; uncertainty/review status."
  update_trigger: "Panel/fin/dimension/fitted-supply change; weld/test/coating/bath/utility revision; supplier/gas change; new representative period; resolved evidence/identity gap."
data_sources:
  - id: "purmo-hub2894"
