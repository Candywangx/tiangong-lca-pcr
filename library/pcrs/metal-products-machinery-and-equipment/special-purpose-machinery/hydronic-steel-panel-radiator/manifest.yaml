review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: "Passive non-electrically-heated hydronic radiators
    made from welded steel pressure panels, in one declared complete dry
    configuration. Declare panel count, convector-fin count,
    dimensions/orientation, surface finish, fitted top grille/side covers and
    factory-fitted plugs, air vent and integrated valve when present. This
    narrower category is within CPC44823; it does not cover all iron/steel
    radiator constructions. Manufacturing delivery is the reference function,
    not heating a room or delivering a kWh of heat. Cast-iron sectional, steel
    tubular/column, aluminium and electric/fan-assisted radiators; independent
    valves, thermostatic heads, brackets and installation hardware; heat
    pumps/boilers, distribution piping, installation/service work, customer
    operating heat/water/electricity, building heat loss, maintenance, lifetime
    and end-of-life. A detached mounting kit packed alongside the radiator is a
    separate supplied product outside radiator net M; disclose it rather than
    silently include or omit its manufacture. Transport packing and test fluid
    are outside M. Canonical material manifests inspected: boiler methodology
    covers heat generation, not passive room emitters. Old radiator leaf is
    read-only empty scaffold. New identity independent of classification, no
    mapping accepted or old identity promoted."
