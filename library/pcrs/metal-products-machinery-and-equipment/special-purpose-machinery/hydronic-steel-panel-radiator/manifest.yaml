  evidence_limitations:
    - Purmo HUB-2894 published2025 documents Yangzhou manufacturing2023 and
      polyester-epoxy cold-rolled panel architecture; site-specific EPD
      allocation, energy quantities, mass, recycled share and lifecycle
      scenarios are not adopted.
    - Stelrad downloaded retained edition EPD-IES-0025108:001 dated10August2025
      differs from catalogue edition003; only verified configuration/accessory
      facts on original page4 used, not latest methodology or quantities.
    - Current factory chemistry, welding, test medium and parameters, coating
      cure and utility conditions require released specifications and measured
      foreground records. No default machine mass, emissions, consumption ranges
      or lifetime invented.
    - Narrower passive welded steel panel radiator manufacturing scope; detached
      mounting kit separately disclosed outside dry net M. Foreground module is
      not complete cradle-to-gate; no accepted mapping or scientific approval
      claimed.
