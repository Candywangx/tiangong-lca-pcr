product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.special-purpose-machinery.parts-of-soil-machinery"
  classification_refs: "CPC 3.0: 44115, Parts of soil machinery"
  covered_products: "Finished original-equipment or replacement parts chiefly identifiable as for soil preparation or cultivation machinery or lawn/sports-ground rollers"
  excluded_products: "Complete machines; independently traded general-purpose components; parts of other agricultural machinery; electrical or hydraulic modules not chiefly identifiable as soil-machinery parts"
  representative_product: "A quality-accepted iron or steel soil-engaging part or dedicated subassembly manufactured to a declared drawing and material specification"
  production_route: "Declared fabricated carbon-steel plate, closed-die alloy-steel forging, or cast-iron green-sand route; machining/heat treatment as applicable; liquid coating conditional; other variants require explicit extension"
  market_state: "Finished, quality-accepted, unpackaged part at the manufacturing-site gate; coating state and OEM/replacement status declared"
functional_unit:
  what: "A finished part that provides a declared structural, soil-engaging, adjustment, transmission, or rolling function within specified soil-preparation or cultivation machinery"
  how_much: "1 kg of accepted finished part"
  how_well: "Conforms to the declared drawing, material grade, dimensions/tolerances, hardness or heat-treatment state, and coating specification where applicable"
  how_long_or_cycle: "One manufacturing lot released at the factory gate; no service-life equivalence is asserted"
  reference_flow_link: "reference_product"
system_boundary:
  rules:
    - rule_id: boundary_cradle_to_gate
      applies_to: "Product system"
      rule: "Include upstream production of all delivered inputs and all foreground material preparation, forming/forging/casting, heat treatment, machining, cleaning, coating when applied, inspection, direct emissions, and exported wastes through release of the unpackaged finished part. Exclude use, maintenance, distribution after the facility gate, and end-of-life unless separately modelled and disclosed."
      source_ids:
        - eu-jrc-smitheries-foundries-bref-2024
        - un-cpc-3-0-structure-2025
    - rule_id: boundary_route_declaration
      applies_to: "Manufacturing route"
      rule: "Select only the actual fabricated, forged, or cast route and include every on-site or outsourced step needed to reach the declared product state; do not treat an unreported route as zero."
      source_ids:
        - eu-jrc-smitheries-foundries-bref-2024
    - rule_id: boundary_representative_variants
      applies_to: "Manufacturing route"
      rule: "The fabricated variant uses carbon-steel plate; the forging variant is closed-die alloy-steel forging with flash trimming and scale management; the casting variant is cast iron in green-sand moulds with silica sand, bentonite, and coal dust when actually present. A different alloy, open-die process, non-sand or chemically bonded mould, or non-ferrous casting requires an explicit inventory extension and shall not inherit inapplicable rows."
      source_ids:
        - eu-jrc-smitheries-foundries-bref-2024
    - rule_id: boundary_outsourced_operations
      applies_to: "Outsourced forming, heat treatment, machining, or coating"
      rule: "When an operation is outsourced, include its supplier-specific or representative upstream process in the incoming intermediate, mark the corresponding on-site input, waste, and emission rows not applicable with purchase-order and supplier evidence, and do not report the outsourced exchange as a zero-valued on-site flow."
      source_ids:
        - eu-jrc-smitheries-foundries-bref-2024
    - rule_id: boundary_coating_condition
      applies_to: "Pretreatment and coating"
      rule: "Include pretreatment, paint application, flash-off, curing, relevant capture/control, direct NMVOC, wastes, and rinse streams when liquid coating is applied; otherwise document coating as not applicable."
      source_ids:
        - us-epa-misc-metal-coating-tsd
        - us-epa-sector-aa-fabricated-metal-2021
    - rule_id: boundary_direct_exchanges
      applies_to: "Foreground facility"
      rule: "Record direct stack and fugitive releases and each physically distinct exported waste stream; upstream electricity emissions remain in the electricity dataset and are not duplicated as foreground emissions."
      source_ids:
        - us-epa-misc-metal-coating-tsd
        - us-epa-sector-aa-fabricated-metal-2021
boundary_abstraction:
  declared_starting_condition: "Purchased metal stock or foundry charge, electricity, fuels, gases, water, and process auxiliaries delivered to the reporting facility, each linked to a geographically and technologically representative upstream dataset"
  starting_condition_role: "Foreground gate input for cradle-to-gate production"
  product_classification_scope: "Finished CPC 44115 parts chiefly identifiable as for soil preparation/cultivation machinery or lawn/sports-ground rollers"
  recursive_input_rule: "A purchased CPC 44115 subassembly is recorded once as an input with a distinct upstream dataset; do not recursively apply this PCR to the same foreground manufacture"
  upstream_dataset_requirement: "Supplier-specific data where available; otherwise disclose the selected regional/technology dataset, product state, recycled content, and delivery boundary"
  disclosure: "Declare included sites, route, outsourced operations, coating state, internal recycling loops, cut-offs, allocation, accepted and rejected output, and whether packaging is outside the unpackaged reference state"
