  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory exchange"
      rule: "normalized quantity = covered-lot exchange quantity / covered-lot accepted finished-part mass"
      inputs:
        - "atomic exchange quantity"
        - "accepted mass from cp_final_release"
      output: "quantity per 1 kg accepted finished part"
      source_ids: []
    - id: calc_active_sodium_hydroxide
      applies_to: "sodium_hydroxide"
      rule: "active NaOH mass = supplied cleaner mass × verified NaOH mass fraction"
      inputs:
        - "cleaner issue mass"
        - "concentration certificate or test"
      output: "kg active sodium hydroxide"
      source_ids: []
    - id: calc_stock_consumption
      applies_to: "metal stock, foundry materials, paint, and cutting fluid"
      rule: "Choose and document exactly one accounting basis for each atomic flow. External-stock basis: new boundary input = opening externally sourced stock + external receipts - closing externally sourced stock - returns to supplier; internal circulation is outside this equation and cancels inside the product system. Gross-charge basis: new material charged = gross process charge - the internal reclaimed or recirculated charge included in that gross quantity; do not subtract the same internal quantity again through stock accounting. QA example: 10 kg external new sand plus 90 kg internally circulated sand, with unchanged stock, gives 10 kg new boundary input under either basis, never -80 kg."
      inputs:
        - "stock and external transaction records"
        - "gross charge records when used"
        - "separately identified internal circulation"
        - "selected accounting basis"
      output: "net boundary input by atomic flow without double subtraction"
      source_ids: []
    - id: calc_route_transfer
      applies_to: "uncoated and coated intermediates and final release"
      rule: "On raw lot masses, reconcile manufacturing output to coating input or uncoated release input plus route-specific exported rejects, internal rework/return, and stock change; reconcile each coated product form to its matching final-release input; reconcile final-release input to accepted reference product plus exported final reject, internal rework return, and stock change. Apply calc_reference_normalization only after these balances."
      inputs:
        - "lot genealogy"
        - "intermediate masses by product form"
        - "route-specific rejects"
        - "final rejects"
        - "internal rework or return"
        - "stock change"
      output: "route-transfer reconciliation before single final-mass normalization"
      source_ids: []
    - id: calc_alkaline_bath_balance
      applies_to: "spent_alkaline_cleaning_bath"
      rule: "Define one control volume containing the cleaning bath, connected hold tanks and any on-site regeneration unit. For each campaign: opening bath inventory + external chemical and water additions = closing bath inventory + exported spent bath + separately measured bath carryover to rinse wastewater + other measured boundary losses. Transfers to and from on-site regeneration are paired internal movements that cancel; retained or regenerated liquor appears once in closing inventory and is not subtracted again. If regeneration is outside the product-system boundary, record the outbound and return transfers explicitly rather than netting them."
      inputs:
        - "opening and closing bath inventory"
        - "external chemical and water additions"
        - "paired internal-transfer records"
        - "off-site transfers if any"
        - "spent-bath dispatch"
        - "bath carryover in rinse records"
        - "measured losses"
      output: "mass-conserving alkaline-bath control-volume balance by campaign"
      source_ids: []
    - id: calc_foundry_additive_carbon_fate
      applies_to: "foundry_carbon_monoxide_to_air, foundry_fossil_carbon_dioxide_to_air, foundry_benzene_to_air, foundry_toluene_to_air, and foundry_xylene_to_air"
      rule: "On a raw campaign basis, reconcile opening in-boundary additive carbon + external additive carbon = closing in-boundary additive carbon + carbon retained in accepted castings + carbon exported in spent sand or other separately identified residues + carbon destroyed and converted to explicitly reported products + residual direct carbon species + other measured boundary loss. Internal sand circulation and on-site capture/return transfers are paired and cancel. Report CO, fossil CO2, benzene, toluene, and xylene as separate exchanges when applicable; do not force an unclosed difference into any named emission or an unknown-emissions row."
      inputs:
        - "additive formulation and fossil/biogenic carbon fractions"
        - "opening and closing sand-system carbon inventory"
        - "accepted casting and residue analyses"
        - "capture and destruction records"
        - "species-specific direct releases"
      output: "closed additive-carbon fate balance and separately reported residual emissions before final-mass normalization"
      source_ids:
        - eu-jrc-smitheries-foundries-bref-2024
    - id: calc_energy_to_mj
      applies_to: "electricity recorded in kWh"
      rule: "MJ = kWh × 3.6"
      inputs:
        - "original electricity record"
      output: "MJ purchased electricity"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Retain drawing/revision, machine compatibility, material certificate, route, dimensions, heat-treatment/hardness, coating state, lot, and release status."
      evidence: "drawing; certificate; inspection and lot-genealogy records"
    - id: dq_route_completeness
      applies_to: "Process map"
      requirement: "Demonstrate that each on-site and outsourced step required for the declared state is included or linked to an upstream process; explain every non-applicable conditional row."
      evidence: "route sheet; purchase orders; subcontractor records"
    - id: dq_temporal_coverage
      applies_to: "All foreground data"
      requirement: "Cover every lot represented by the dataset over the declared reporting period; justify gaps, shutdowns, abnormal campaigns, and shorter periods."
      evidence: "production calendar; meter coverage; exception log"
    - id: dq_mass_reconciliation
      applies_to: "Metal, foundry sand and additives, paint, alkaline bath, fluids, products, and wastes"
      requirement: "Reconcile opening stock, inputs, outputs, internal returns or rework, inventory change, and documented losses without using allocation to hide imbalance."
      evidence: "signed balance worksheet; stock, reclamation, rework, bath, and dispatch records"
    - id: dq_energy_coverage
      applies_to: "Electricity and natural gas"
      requirement: "Match meter/invoice periods to production periods; disclose shared-load allocation and excluded loads."
      evidence: "meter map; invoices; allocation worksheet"
    - id: dq_emission_method
      applies_to: "Direct emissions"
      requirement: "Identify source locations, monitoring or calculation method, aggregation, control-device treatment, and uncertainty; prevent duplicate upstream or aggregate/speciated emissions. For the green-sand variant, retain formulation evidence, distinguish absent additives, carbon retained in products/sand/residues, controlled destruction, and residual named releases, and explain any unclosed additive-carbon difference without assigning it to an umbrella flow."
      evidence: "monitoring QA, permits/reports, formulation and residue records, control logs, carbon-fate calculation file"
    - id: dq_upstream_selection
      applies_to: "Delivered inputs"
      requirement: "Record supplier/product state, geography, technology, recycled content where relevant, and delivery boundary for every upstream dataset."
      evidence: "supplier documentation and dataset selection log"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Reference flow"
    rule: "Fail if any required qualifier, accepted mass, coating state, manufacturing route, site, reporting period, or lot coverage is absent."
    source_ids:
      - un-cpc-3-0-structure-2025
      - china-mof-serbia-tariff-2024
  - rule_id: validate_route
    applies_to: "Process inventory"
    rule: "Fail if the dataset combines incompatible fabricated, closed-die-forged, or cast-iron green-sand inputs without route shares; silently assigns zero to an applicable auxiliary, residue, reject, or direct emission; or applies these bounded rows to a different route without explicit extension."
    source_ids:
      - eu-jrc-smitheries-foundries-bref-2024
  - rule_id: validate_internal_loop_balance
    applies_to: "Stock, reclamation, recirculation, and alkaline-bath balances"
    rule: "Fail if external-receipt and gross-charge accounting bases are mixed, if the same internal circulation is subtracted twice, if a paired on-site transfer does not cancel within the declared control volume, or if retained/regenerated bath is both included in closing inventory and deducted separately."
    source_ids: []
  - rule_id: validate_foundry_additive_fate
    applies_to: "Cast-iron green-sand additive releases"
    rule: "Fail when coal dust or a carbonaceous substitute is used but actual formulation, capture/control, retained/exported carbon, and applicable residual carbon monoxide, fossil carbon dioxide, benzene, toluene, and xylene are not assessed separately; a particulate-only, fuel-CO2-only, CO-surrogate, or umbrella unknown-emissions record is incomplete."
    source_ids:
      - eu-jrc-smitheries-foundries-bref-2024
  - rule_id: validate_outsourcing
    applies_to: "Process inventory"
    rule: "Fail if an outsourced operation is omitted rather than linked to an upstream process, or if its on-site rows are marked not applicable without purchase-order and supplier evidence."
    source_ids:
      - eu-jrc-smitheries-foundries-bref-2024
  - rule_id: validate_atomic_flows
    applies_to: "Inventory rows"
    rule: "Fail if metal forms, energy carriers, process chemicals, wastes, wastewater streams, or direct emissions are combined into an umbrella exchange."
    source_ids:
      - us-epa-sector-aa-fabricated-metal-2021
  - rule_id: validate_transfer_balance
    applies_to: "Intermediate product flows"
    rule: "Fail if raw uncoated, coated-subassembly, coated-individual, or final-release masses cannot be reconciled to the matching input, accepted output, atomic exported rejects, internal rework or return, and stock change before one normalization to accepted final mass."
    source_ids: []
  - rule_id: validate_bath_balance
    applies_to: "Alkaline cleaning"
    rule: "Fail if spent concentrated alkaline bath, retained or regenerated bath, process loss, and alkaline rinse wastewater are not separately identified and reconciled."
    source_ids:
      - us-epa-sector-aa-fabricated-metal-2021
  - rule_id: validate_boundary_and_double_counting
    applies_to: "Energy and emissions"
    rule: "Fail if upstream electricity or fuel-chain emissions are duplicated as direct emissions, or if NMVOC is double counted with separately included species."
    source_ids:
      - us-epa-misc-metal-coating-tsd
  - rule_id: validate_unresolved_uuid
    applies_to: "UUID-empty rows"
    rule: "Report every UUID-empty identity listed in manifest review metadata, including route-specific coal dust, forging flash, foundry slag, rejected castings, coated individual intermediates, final rejects, and the original unresolved rows; do not substitute a proxy UUID."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific cradle-to-gate foreground production dataset for a declared finished soil-machinery part"
  downstream_use: "secondary_dataset; background_dataset after methodology, representativeness, and unresolved identities are reviewed"
  allowed_use: "LCA or carbon-footprint modelling of machinery systems whose part identity, route, material, coating state, geography, technology, and time match the declared dataset"
  excluded_use: "Complete soil machinery; generic machinery parts; service-life comparison without functional equivalence; use or end-of-life modelling; substitution for a different material/forming/coating route"
  required_metadata: "PCR id/version; part and drawing identity; compatible machine; material/grade; route; coating; accepted mass; site/geography; reporting period; lot coverage; allocation; upstream dataset choices; unresolved UUIDs"
  required_quality_disclosure: "meter and stock coverage; allocation drivers; route completeness; mass reconciliation; waste destinations; emission methods and uncertainty; outsourced steps; cut-offs; deviations"
  update_trigger: "Change in drawing or material grade, primary forming route, heat treatment, coating system, site, energy supply, allocation, waste destination, emission control, or reporting-period representativeness"
