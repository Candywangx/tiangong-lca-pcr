allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared production lines and utilities"
    rule: "Subdivide by route, line, product family, or batch and use direct meters, issue records, machine time, or causal engineering drivers before allocation."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "Exported metal scrap, forging flash, scale, slag, chips, and rejected parts"
    rule: "Report each atomic exported output separately and disclose mass, material or alloy, contamination, revenue, destination, and any internal return. Do not subtract an avoided primary-material credit inside the foreground inventory unless the declared study method explicitly requires it."
    source_ids: []
  - rule_id: allocation_multioutput
    applies_to: "Unavoidable shared burdens"
    rule: "Use a documented physical causal relation where defensible; if none exists, use economic allocation based on a consistent reporting-period price basis and disclose sensitivity. Never allocate solely to eliminate an imbalance."
    source_ids: []
  - rule_id: allocation_internal_recycling
    applies_to: "Internal metal, sand, paint, water, bath, and fluid loops"
    rule: "Do not count internally recirculated or reworked material as both new input and waste output. Record only make-up input, inventory change, losses, exported outputs, and material crossing the product-system boundary."
    source_ids: []
