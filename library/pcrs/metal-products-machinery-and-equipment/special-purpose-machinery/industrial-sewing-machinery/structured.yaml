allocation_rules:
  - rule_id: allocation_direct
    applies_to: "manufacturing"
    rule: "Prefer serial/work-order issues and submeters. Under cp_allocation partition shared machining, extraction, cure and test-bench demand by measured causal demand or measured load and time; justify each driver and reconcile allocated plus excluded consumption to the total. No fixed share or universal mass allocation."
    source_ids: []
  - rule_id: allocation_variants
    applies_to: "configurations"
    rule: "Keep drive/head/table/test configurations separate; machine count alone is not a causal driver for unlike machining or test demands. Any fallback mass/economic method needs measured justification, sensitivity and explicit review."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "scrap_and_tests"
    rule: "Track actual scrap/test specimen outputs without automatic avoided-steel/textile credit. Valid component returns and internally reused test cloth are internal loops, not new purchases and external co-products. If an independently marketable output exists, declare its quality/amount and justified co-product treatment."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "finished_machine"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted serial/configuration"
      temporal_coverage: "same manufacturing period"
      site_scope: "same manufacturer and fitted supply boundary"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration; complete supply BOM; retained fill; signed release"
    - protocol_id: cp_fabrication
      process_id: "fabrication"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "casting/bar grade and supplied state; net issues/returns; actual machine-tool time/load; kWh; dry steel/iron chip masses; capture and outlet PM monitoring; coolant/tool records"
      collection_method: "Weigh each stock/return/scrap separately; meter actual machining demand. Measure outlet particulate concentration with matched standard-condition dry gas flow/time, controls and particle-size basis; document uncertainty, no assumed release fraction."
      unit: "kg; MJ"
      frequency: "each work order/batch/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; matched accepted count"
      site_scope: "same site/configuration; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock/count closure; missing records"
    - protocol_id: cp_finishing
      process_id: "finishing"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "polyester powder formulation/SDS; net issues/recovery; liquid isopropanol purity/mass; kWh; cure route; cotton-wipe wet mass; unreused overspray; measured CAS-specific air release"
      collection_method: "Weigh each chemical and waste; meter actual route and shared demand. Measure CAS-specific post-control release or a validated matched solvent balance with liquid/solid retention and recovery; total VOC cannot be labelled isopropanol."
      unit: "kg; MJ"
      frequency: "each work order/batch/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; matched accepted count"
      site_scope: "same site/configuration; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock/count closure; missing records"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "model/BOM/serial; supplied component boundaries; net issues/returns; needle/hook/feed matching; drive/control/table/stand mass; oil grade and filled/dry state; retained oil mass; kWh"
      collection_method: "Trace each actual supplied component and weigh mass; avoid motor-contained electronics/head-contained parts duplication. Weigh factory oil issues/returns/retained fill separately and reconcile empty/filled shipping; meter tools and connections."
      unit: "kg; MJ"
      frequency: "each work order/batch/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; matched accepted count"
      site_scope: "same site/configuration; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock/count closure; missing records"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "serial/configuration; current signed test plan; needle system; fabric fiber/weave/finish and thread specification; stitch quality/timing results; guard/electrical/drive checks; actual test time/kWh; new fabric/thread and removed specimen masses; rejects/rework; M"
      collection_method: "Record actual model tests and meter setup/rework/test demand; weigh net new test textile consumption and discarded stitched specimens with known composition. Trace reusable cloth inventory separately; no universal stitch speed or operating break-in factor."
      unit: "kg; MJ"
      frequency: "each work order/batch/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; matched accepted count"
      site_scope: "same site/configuration; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock/count closure; missing records"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "PE film recipe/thickness and mass; board flute/fiber/recycled specification and mass; issues/returns; serial/dispatch complete-part checklist"
      collection_method: "Weigh each packing material separately and exclude from M; reconcile all required workstation parts after disassembly. Actual additional foam/timber/tape materials each need an added atomic row."
      unit: "kg"
      frequency: "each work order/batch/test; monthly reconciliation"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; matched accepted count"
      site_scope: "same site/configuration; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock/count closure; missing records"
    - protocol_id: cp_allocation
      process_id: "manufacturing"
      flow_role: "shared_demand"
      record_type: "measurement"
      raw_fields: "total utility; submeter demand; measured load/time; work orders/products served; excluded consumption"
      collection_method: "Submeter or measure causal shared load and actual operating time; justify exchange-specific driver and reconcile against total supply."
      unit: "MJ; h"
      frequency: "each shared batch; monthly reconciliation"
      temporal_coverage: "same manufacturing period"
      site_scope: "all served configurations and excluded operations"
      aggregation_rule: "partition by measured causal demand; attributable amount / accepted machines"
      quality_evidence: "closure; submeter comparison; uncertainty; sensitivity"
  calculation_rules:
    - id: normalize_mass
      applies_to: "iron_head_blank; steel_shaft_blank; fabrication_electricity; steel_scrap; iron_chips; captured_steel_dust; particulate_air; polyester_powder; isopropanol_liquid; finishing_electricity; polyester_powder_waste; ipa_wipes; isopropanol_air; finished_body; main_shaft; rotary_hook; needle; bobbin; presser_foot; feed_dog; servo_motor; control_box; table_top; steel_stand; pedal; thread_stand; rubber_belt; steel_screws; lubricating_oil; assembly_electricity; test_cotton; test_thread; acceptance_electricity; test_swatches; pe_film; corrugated_board"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "flows"
      requirement: "Verify supplied material/grade/phase/composition, reference property/unit, route/geography and exact environmental medium. Flow identity does not establish supplier impacts or amount."
      evidence: "supplier sheets; identity/property/unit audit"
    - id: quality_complete
      applies_to: "workstation"
      requirement: "Reconcile fitted supply and retained fluids to measured M, all actual manufacturing consumables/utilities, losses and tests. Do not fill missing part mass from residual."
      evidence: "BOM; calibrated complete weigh; stock balances; signed release"
    - id: quality_period
      applies_to: "records"
      requirement: "Disclose representative complete period, site, supplier/outsourcing coverage, route changes, idle/setup demand and uncertainty. Historical manuals provide model cases only, not current LCI or universal tests."
      evidence: "work orders; meter sheets; source limitations"
    - id: quality_acceptance
      applies_to: "release"
      requirement: "Retain model-specific stitch-test materials/conditions and signed functional/electrical/guard acceptance. Record false starts and rework; do not infer factory limits from customer operating instructions."
      evidence: "current released test plan; serial result; calibration"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_machine"
    rule: "Require1kg output, measured cp_mass M for the complete supplied workstation, installed table/stand/drive/control/guards and retained lubricant. No head-only catalogue mass or test textiles in M."
    source_ids: []
  - rule_id: validation_normalization
    applies_to: "inventory"
    rule: "Every applicable non-reference row links normalize_mass and its declared protocol; check denominator direction, exchange units, matching configuration/period and accepted counts."
    source_ids: []
  - rule_id: validation_routes
    applies_to: "processes"
    rule: "Match machining/cleaning/coating and direct/belt drive to actual work orders/BOM. Supplier-finished head/body or integrated motor driver must replace contained inputs; missing actual routes remain gaps."
    source_ids: []
  - rule_id: validation_species
    applies_to: "elementary_flows"
    rule: "Check measured unspecified-size particulate and CAS67-63-0 isopropanol outdoor-air unspecified subcompartment. Indoor exposure, total VOC, captured dust/wipes and aqueous effluent are different exchanges. No assumed emission fraction."
    source_ids: []
  - rule_id: validation_coverage
    applies_to: "dataset"
    rule: "Distinguish measured/calculated/estimated/excluded/not-applicable/missing, reconcile material/output and allocated demand, and disclose unresolved identities/providers. Structural/measurement pass does not approve methodology or establish complete cradle-to-gate coverage."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_manufacturing_module"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing module for exact supplied industrial lockstitch workstation/site/period; expanded assessment only with independently established upstream/transport/treatment coverage."
  excluded_use: "Customer seam or textile-production service, operating/lifetime energy, generic stitch-machine equivalence, head-only product accounting and unsupported complete cradle-to-gate claims."
  required_metadata: "PCR id; model/configuration/BOM and supplied head/table/stand/drive/control boundary; measured M/retained oil; test plan/materials; site/period; make-or-buy and routes; suppliers/providers/transport; utilities; packing; allocation and sources/version."
  required_quality_disclosure: "Primary measured coverage, unresolved identities/amounts/providers, excluded and missing routes, historic source limits, conversion/allocation justification, emissions monitoring, uncertainty and review state."
  update_trigger: "Supply/BOM/drive/table change; material/coating/oil/test-plan revision; supplier/utility change; new representative period; resolved identity/evidence gap."
data_sources:
  - id: "juki-ddl8700"
    type: "handbook"
    reference: "JUKI DDL-8700 Instruction Manual English, retained historical edition with PDF modification metadata2013; sections2,3,5,6; PDFpp.3–5, printedpp.1–3. https://www.juki.co.jp/industrial_j/download_j/manual_j/ddl8700/menu/ddl8700/pdf/instruction_eg.pdf"
    used_for: "Model-specific table/head/oil-pan, belt cover and thread-stand architecture; no numerical speed, break-in, oil demand, mass, manufacturing route or lifetime inferred."
  - id: "brother-s7100a"
    type: "handbook"
    reference: "Brother S-7100A Instruction Manual, retained historical PDF2015 metadata; machine specifications and installation sections2-2 to2-4; PDFpp.11–17, printedpp.1–7. https://download.brother.com/pub/com/ism/pdf/s7100a_in.pdf"
    used_for: "Independent maker direct-drive servo, table/head/control connection and oil-tank configuration example. Approximate head weight/oil volume, nameplate power and table thickness are not adopted; current site supply and measured amounts govern."
