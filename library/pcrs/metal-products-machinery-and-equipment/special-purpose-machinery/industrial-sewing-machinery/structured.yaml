process_map:
  - id: fabrication
    name: "Body and shaft machining"
    inclusion: "conditional"
    inclusion_condition: "Only actual site machining of declared incoming casting/bar; supplier casting and finished-component manufacture are upstream. Add actual coolant, tools, abrasives and other operations before claiming completeness."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: finishing
    name: "Surface cleaning and coating"
    inclusion: "conditional"
    inclusion_condition: "Only actual site cleaning/coating with identified formulation and utility carrier; finished supplier coating substitutes this operation. Listed polyester powder and isopropanol are optional examples, not prescribed recipes."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: assembly
    name: "Sewing mechanism and workstation assembly"
    inclusion: "required"
    inclusion_condition: "Fit actual needle/rotary hook/bobbin/feed/presser mechanism, drive/control, table/stand/foot control, thread stand and guards within declared supply. Reconcile make-or-buy and lubricant retained state."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: acceptance
    name: "Adjustment, testing and release"
    inclusion: "required"
    inclusion_condition: "Use current model-specific factory test plan, including actual stitch testing when prescribed; record test fabric/thread, energy, rejects and rework, then weigh the accepted complete workstation."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: packing
    name: "Transport packing and dispatch"
    inclusion: "conditional"
    inclusion_condition: "Only actual packing/protection; excludes packing from M and reconciles all required delivered parts after any transport disassembly."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
