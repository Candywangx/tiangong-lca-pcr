  evidence_limitations:
    - JUKI retained historical manual PDF2013 metadata and Brother retained
      historical manual PDF2015 metadata establish model-specific
      supply/drive/lubrication architecture only. They do not establish current
      factory test parameters, manufacturing routes, material recipes or
      numerical LCI.
    - No head mass, approximate oil amount, nameplate power, operating break-in,
      service life, emission fraction or loss range imported. All actual amounts
      and quality limits require declared foreground measurements and current
      released specifications.
    - Narrower complete electrically driven single-needle flatbed lockstitch
      workstation scope; head-only deliveries excluded. No accepted
      classification mapping or complete cradle-to-gate coverage claimed;
      scientific review pending.
