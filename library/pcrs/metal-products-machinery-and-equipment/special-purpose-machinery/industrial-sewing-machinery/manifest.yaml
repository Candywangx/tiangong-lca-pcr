review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: "Complete electrically driven industrial
    single-needle flatbed lockstitch sewing workstations in one declared
    supplied configuration: sewing head, installed drive and control, table top
    and load-bearing stand, foot control, thread stand, required fitted guards
    and retained lubricants. Direct-drive and belt-drive configurations are
    separate variants. This narrower category covers only this manufacturing
    boundary within CPC44621, not all industrial sewing machines. Household and
    book-sewing machines; overlock, coverstitch, chainstitch, embroidery,
    buttonhole and programmable pattern machines; knitting/weaving machinery;
    head-only delivery, independently sold table/stand/motor/control or spare
    parts; customer sewing production, operating electricity, textile output,
    maintenance/lubrication replenishment, lifetime needle replacement and
    end-of-life. Installation/service contracts and factory building manufacture
    are outside this module. Extra spare needles/bobbins and separately bottled
    accessories require separate supplied-product accounting. Actual material
    manifests checked: sewing-thread and hand-needle records cover upstream
    components/consumables, not complete workstation manufacture. Existing
    industrial-machine leaf is a read-only empty scaffold. No retired identity
    or classification mapping promoted."
