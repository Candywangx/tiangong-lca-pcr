allocation_rules:
  - rule_id: actual_attribution
    applies_to: "foreground_burden_allocation"
    rule: "First separate configuration and process meters/records; allocate only actual common-period unassigned residual services using a documented causal driver. Include attributable scrap, reject, repair and repeated test burdens in accepted production; do not allocate them away as usable co-products. Record scrap recipient and treatment; no automatic avoided-production credit."
    source_ids:
      - jrc-metal-2020
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "test_dispatch"
      flow_role: "reference product"
      record_type: "weighing"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "Each accepted serial"
      temporal_coverage: "Same production period"
      site_scope: "Declared factory"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "Calibration; serial-linked acceptance; supplied-content list"
    - protocol_id: cp_inventory
      process_id: "all"
      flow_role: "atomic exchanges"
      record_type: "foreground records"
      raw_fields: "row identity; issued/returned amount; stocks; meters; Naccepted; reject/rework/test logs; native unit; assay; receiver"
      collection_method: "Measure actual atomic exchanges by calibrated scales/meters and traceable invoices, supplier interfaces and test logs; record each absent route as not_applicable with evidence; unknown is not zero."
      unit: "kg; MJ"
      frequency: "Each batch and test"
      temporal_coverage: "Same production period"
      site_scope: "Declared factory"
      aggregation_rule: "attributable exchange / accepted machines"
      quality_evidence: "Calibration; supplier scope; bills; stock and test reconciliation"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
        - cp_inventory
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: same_period
      applies_to: "all inventory rows"
      requirement: "Use one configuration and period: Qattr includes its attributable reject/rework/test burden, Naccepted counts complete accepted loaders, Dnet sums calibrated accepted net masses, M=Dnet/Naccepted, q_item=Qattr/Naccepted and q_ref=Qattr/Dnet. Exclude transport packaging, reject mass and consumed test-load material from Dnet. Keep distinct configurations separate or disclose justified weighting."
      evidence: "cp_mass; cp_inventory; actual supplier, stock, test, measurement and receiver records"
    - id: bom_completeness
      applies_to: "all inventory rows"
      requirement: "Reconcile actual serial-linked BOM and supplied configuration: frame/arms, bucket and coupler, traction/steering/brakes, wheels or crawler, operator protection/cab, hydraulics and controls, engine/cooling/aftertreatment or battery/motor/inverter/thermal system, auxiliary power, fasteners, fills and delivered accessories. Every additionally present grade, module, coating component, fuel, gas, packing or waste requires its own atomic row and qualified identity. No example list is a universal recipe."
      evidence: "cp_mass; cp_inventory; actual supplier, stock, test, measurement and receiver records"
    - id: element_balance
      applies_to: "all inventory rows"
      requirement: "Each physical element balance uses each stream measured gross mass multiplied by its own composition/assay, moisture and wet/dry basis, with stocks, reactions, retained content and returns. Gross alloy, contaminated swarf or sludge is not contained Fe or C. Cancel paired internal transfers. Independently reconcile bought-module contents with actual net mass without expanding supplier burdens twice."
      evidence: "cp_mass; cp_inventory; actual supplier, stock, test, measurement and receiver records"
    - id: water_balance
      applies_to: "all inventory rows"
      requirement: "Each inlet, coolant/solution, wet sludge and discharge has its own water fraction and measured/documented density at actual temperature; reconcile retention, evaporation, reaction water, return and stock. Count gross water returns once."
      evidence: "cp_mass; cp_inventory; actual supplier, stock, test, measurement and receiver records"
    - id: solvent_fate
      applies_to: "all inventory rows"
      requirement: "Species-specific solvent input equals actual retained, recovered, captured, destroyed, wastewater/media, air and stock-change fates with uncertainty. Capture is not destruction; unexplained residual is never assigned to air. Use post-control measured species concentration and matched gas flow in the same period/state with actual unit corrections and independent fugitive evidence. Carbon closure cannot derive CO or NOx."
      evidence: "cp_mass; cp_inventory; actual supplier, stock, test, measurement and receiver records"
    - id: utility_balance
      applies_to: "all inventory rows"
      requirement: "Reconcile common-period purchased electricity plus actual onsite generation minus exports and storage change against fabrication, assembly, test and dispatch meters. Shared services are only unassigned residual; investigate negative residuals and uncertainty without clipping. Thermal net input is supply mass times its own specific enthalpy minus independently measured return mass times its own specific enthalpy on one datum. Deduct gross return once; already-net supply is not reduced twice. Physical steam/return mass is separate from heat."
      evidence: "cp_mass; cp_inventory; actual supplier, stock, test, measurement and receiver records"
    - id: test_accounting
      applies_to: "all inventory rows"
      requirement: "Collect actual acceptance test duration/load, fuel, charging, oil/coolant and leaks; include failed tests and repairs. Initial/final delivered fuel and battery state are stocks, not assumed consumption. Actual battery cooling/heating is distinct from motor/transmission cooling. Catalogue operating weight, tank capacity, battery rating, productivity, fuel savings and refrigerant service charge do not prescribe factory mass, energy, recipes or emissions."
      evidence: "cp_mass; cp_inventory; actual supplier, stock, test, measurement and receiver records"
    - id: identity_gaps
      applies_to: "all inventory rows"
      requirement: "Unresolved identities remain explicit candidate gaps. Before dataset use, verify each actual supply or release type, chemistry, supplied state, class, reference property/unit, provider/geography and elementary compartment; reject conflicting identities. Missing data is unknown, absent route is evidenced not_applicable, and measured zero is a separate recorded fact."
      evidence: "cp_mass; cp_inventory; actual supplier, stock, test, measurement and receiver records"
validation_rules:
  - rule_id: complete_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require complete accepted machine identity, declared configuration and calibrated net M with explicit per-item to per-kg relationship in both languages. Reject a component, one model proxy, packed weight or downstream performance as the reference."
    source_ids:
      - un-cpc-2025
  - rule_id: inventory_closure
    applies_to: "foreground_dataset_conformance"
    rule: "Verify all present routes and atomic exchanges, make/buy cancellation, reject/test attribution, material/water/solvent/utility reconciliation, native-unit conversions and evidence. Report performed and skipped checks, errors and unresolved coverage; no gap may silently pass as zero."
    source_ids:
      - jrc-metal-2020
      - volvo-l120-electric
      - cat-track-loaders
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Configuration-qualified factory production dataset for compatible process or lifecyclemodel projection."
  excluded_use: "Unqualified universal loader recipe, comparative lifetime loading service, operating-fuel benchmark, or candidate identity treated as reviewed truth."
  required_metadata: "Configuration; geography; period; net mass; actual interfaces; supplied state; production/test boundary; upstream identities."
  required_quality_disclosure: "Missing identities and measurements; assumptions; uncertainty; exclusions; allocation; reconciliation and native conversion evidence."
  update_trigger: "Changed principal function, power architecture, chemistry, supplier boundary, make/buy route, test protocol or evidence."
data_sources:
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Explanatory Notes, 30 June 2025, pp. 234–235. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Full complete-loader scope, excavator and part neighbours; no BOM quantities."
  - id: "volvo-l120-electric"
    type: "handbook"
    reference: "Volvo Construction Equipment, Product Guide L120 Electric, document 22-20064945-A, pp. 4–5, 8–9; undated manufacturer edition. https://www.volvoce.com/-/media/aprimo/pdf/electric-large-wheel-loaders/l120-electric-c2/product-guide-l120-electric-en-22-20064945-a.pdf?v=R9J1Pw"
    used_for: "Actual wheel-loader electric, drivetrain, hydraulic, cab/fill and equipment architecture; model specifications are not production defaults."
  - id: "cat-track-loaders"
    type: "handbook"
    reference: "Caterpillar, Cat Track Loaders 953 - 963 - 973, ©2023, pp. 14–15; manufacturer document retained by authorised dealer Gmmco. https://api.gmmco.in/uploads/CM_20231025_a9814_5f435_944b5263ce.pdf"
    used_for: "Crawler/diesel and actual conditional aftertreatment, bucket and operator-protection architecture; no catalogue inventory factors."
  - id: "jrc-metal-2020"
    type: "literature"
    reference: "European Commission JRC, Best Environmental Management Practice in the Fabricated Metal Products sector, EUR 30025 EN, 2020, DOI 10.2760/894966, printed pp. 26, 121. https://publications.jrc.ec.europa.eu/repository/bitstream/JRC119281/jrc119281_jrc_bemp_fabricated_metal_product_manufacturing_report.pdf"
    used_for: "Conditional metal fabrication, welding, coating and source-control processes; industry practices do not establish one loader factory recipe."
