review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: Manufacture by assembly of a new standalone modular
    two-level vacuum workholding pod for a stationary CNC stone machining table.
    The defined route receives individually finished top/base plates, structural
    and air-distribution posts, friction pad, upper/lower perimeter seals,
    interface O-rings, straight push-in fitting and separate ordinary/vented
    screws. It includes incoming geometry/identity inspection, conditional
    qualified local minor preparation, matched assembly/seal seating/torque,
    upper/lower vacuum-path and geometric acceptance, independent complete net
    weighing and dispatch. Actual drawing, compound/material, interface and
    included component configuration are declared for each pod; a source
    illustration does not identify material alloy or polymer chemistry. Existing
    mineral-and-cold-glass-working-machine-tools covers complete hosts and
    expressly excludes separately sold components. Existing broad
    tool/work-holder methodology covers broad dedicated holders and offers
    reusable make/buy, normalization and acceptance controls; it is relevant
    prior methodology, not an absent record. This narrower modular stone-pod
    assembly case needs independent matched two-level seal protrusion/contact
    datum, solid versus vented screw and air-post circuit routing, installed
    pad/compound/supplier scope, table-side versus workpiece-side leak
    acceptance and frame-free standalone net M. General chuck/closed hydraulic
    expansion rules do not establish these interface facts. The new candidate is
    a bounded subroute refinement, not another universal work-holder PCR or
    code-only duplicate. Mapping/category placement between44251 workholders
    and44252 host-specific accessories is unresolved scientific review; no
    accepted mapping claimed. No other author unfrozen canonical content
    inspected.
  reference_identity_basis: Direct public44252 finished-parts Mass/kg and44251
    broad workholder Mass/kg are relevant category candidates, but neither
    establishes this exact independently supplied sealed two-level pod. Host
    versus workholder classification/application requires scientific review;
    preserve precise one-pod output and do not force broad assorted parts or
    change properties. Exact reference product and finished_machine selected
    name agree; precise candidate gap registered.
  evidence_limitations: BLICK current undated product/about HTML and dated2022
    anatomy/2024 service diagram are manufacturer architectural evidence only.
    Different round/square models are not one BOM; illustrated metal does not
    identify aluminium/steel or polymer recipe. No2022 dimensions/screw counts,
    advertised precision tolerance, operating pressure, current material grade,
    holding capacity, lifetime or ghosting marketing/service output adopted as
    universal constraint. Actual drawing/supplier content/complete net weighing
    and independent two-surface acceptance originals required.
