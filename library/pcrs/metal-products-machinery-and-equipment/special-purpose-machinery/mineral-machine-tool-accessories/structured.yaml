published_dataset_profile:
  dataset_role: "foreground_manufacturing_module"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacture by assembly of a new standalone modular two-level vacuum workholding pod for a stationary CNC stone machining table. The defined route receives individually finished top/base plates, structural and air-distribution posts, friction pad, upper/lower perimeter seals, interface O-rings, straight push-in fitting and separate ordinary/vented screws. It includes incoming geometry/identity inspection, conditional qualified local minor preparation, matched assembly/seal seating/torque, upper/lower vacuum-path and geometric acceptance, independent complete net weighing and dispatch. Actual drawing, compound/material, interface and included component configuration are declared for each pod; a source illustration does not identify material alloy or polymer chemistry."
  excluded_use: "Exclude complete stone CNC machines, general vacuum pumps/generators/manifolds/hoses, lifting/handling suction cups, whole clamping tables or sets, independently sold replacement seals/pads/repair kits, refurbishment and customer stone-cutting services. Bought complete-pod resale/testing-only, integral one-piece or other host/material architecture requires separate applicability. Plate/post machining, casting and finishing, pad/seal compounding/moulding/vulcanization and screw/fitting production are upstream supplied-part processes, not implicit local operations. External host, workpiece, table, pump, test fixture and packaging excluded from product M. Actual manufacturing test support and rework burdens included; no operating life, holding capacity, machining yield or full cradle-to-gate assertion."
  required_metadata: "pod model/serial/drawing revision/shape/height; designated stone-CNC table interface and workpiece contact datum; top/base/post/air-post actual supplied geometry/grade/coating; pad and each seal compound/hardness/profile and supplier lot; actual connector tube/thread/gasket inclusion; separate solid/vented screws and torque/vent routing; actual upper/lower cavity connectivity and leak test rig, vacuum/hold time/instrument criteria from current plan; whole fitted clean dry pod original net M kg and independent part-mass closure; period/site/accepted same-configuration count/rework/support allocation; supplier gates and unresolved flow/upstream/classification gaps"
  required_quality_disclosure: "Candidate scientific review pending; actual matched supplied component material/compound/gates, geometry/dual-side circuit original acceptance, net M/uncertainty/independent mass closure, site/period/accepted count and support/rework attribution, all missing IDs/upstream/transport/treatment and unresolved category placement. Per-kg accessory assembly not comparable holding service or full cradle-to-gate."
  update_trigger: "Part supplier/material/compound/interface, pad/seal/vent routing, height/datum/test plan, configuration/make-buy gate/site/period, new flow identities/source evidence or classification review outcome."
