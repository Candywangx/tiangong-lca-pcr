  data_quality_requirements:
    - id: quality_mass
      applies_to: "finished_machine"
      requirement: "Original same-configuration whole pod weighing with all installed specified plates/posts/pad/seals/O-rings/fitting/screws and any retained adhesive. Use calibrated suitable-capacity balance, controlled fixture tare, date/serial/configuration/repeats/uncertainty. Exclude host/table/pump/manifold/hoses/workpiece/test plate/temporary fixtures/packaging and loose spares. Independently sum actual installed supplied part masses and actual retained additions versus M; count/ship mass/catalog dimensions cannot replace physical originals."
      evidence: "actual complete-unit weighing, supplier/part independent mass balance"
    - id: quality_geometry
      applies_to: "prepare; acceptance"
      requirement: "Current approved matched plate/post heights, assembly datum, top/base contact parallelism and flatness, pad seating/friction-surface cleanliness and sealed perimeter geometry. Preserve actual drawing acceptance criterion and measured readings; one historical square200x200 anatomy and current round page are different products. Advertised+0.05/-0.00 tolerance is manufacturer case only, not universal pass criterion."
      evidence: "anatomy-pod-method; about-pod-method; current drawing/metrology originals"
    - id: quality_seal
      applies_to: "assembly; acceptance"
      requirement: "Trace individual actual pad, top/bottom seal and interface O-ring material/compound/lot/profile, compression/protrusion/seating and compatibility with declared table/workpiece and cleaning media. Do not infer NBR/PU/silicone from colour or hard-rubber class from generic seal. Bought finished seals upstream, actual adhesive/grease/cleaner additions separately identified and counted once. Damaged/incorrect seats/rework documented; service notice supports checking seal/fitting condition but supplies no factory hardness/pressure threshold."
      evidence: "anatomy-pod-method; ghost-pod-method; actual supplier compound/assembly records"
    - id: quality_circuit
      applies_to: "assembly; acceptance"
      requirement: "Verify original air-post ports and supplied fitting type/thread/tube OD/internal included seal. Distinguish top and base ordinary/vented screws; bore/torque/restriction cannot be collapsed into generic screws. Independently test every declared table-side/workpiece-side path, vacuum isolation and leak/hold performance at original plan pressure/time/limit with calibrated gauges and validated rig blank leak. Record actual support energy/test plate reuse; no lifting safety or stone-cut throughput claim."
      evidence: "anatomy-pod-method; ghost-pod-method; original current circuit/leak/torque tests"
    - id: quality_identity
      applies_to: "all flows"
      requirement: "Public44252 finished parts and44251 workholders are relevant broad category candidates, not exact supplied modular pod proof. Classification placement reviewed independently from chemical/form/state applicability. Sealing-elements vulcanized/hard-rubber class does not prove actual specified compound; Steel screw does not prove source-specific grade/coating/vent state. Preserve actual property/unit chain; do not adopt component set/complete pump or vacuum service as one physical part."
      evidence: "public originals/property-unit chain and actual supplier qualification"
    - id: quality_emission
      applies_to: "particle_air"
      requirement: "Only actual documented conditional dry touch-up post-control unspecified-size particulate to immediate unspecified air. No emission inferred from inspection/assembly/wet cleaning; captured debris, aqueous contamination and any measured size/species each separate correctly identified waste/elementary medium. Municipal water is technosphere product, not freshwater resource or wastewater; background electricity emissions not local air."
      evidence: "actual post-control sampling and liquid/solid waste records"
    - id: quality_complete
      applies_to: "dataset"
      requirement: "Close actual supplier BOM/issues/returns/stock and accepted count. Add any real separate adhesive, grease, cleaner formulation, wiping cloth, rejected part/material, spent liquid, captured debris, test coupon consumed and each packaging material when present; every row one actual physical part or chemical/media species. No pooled materials/waste, assumed quantity, solder/casting/rubber cure at assembly factory, or claimed complete upstream coverage. Scientific review pending; actual factory dataset originals required before use."
      evidence: "actual complete stock/BOM/meter/test closure"
