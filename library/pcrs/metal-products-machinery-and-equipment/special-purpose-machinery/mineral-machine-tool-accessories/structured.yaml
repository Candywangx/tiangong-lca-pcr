    used_for: "Historical modular top/base/pad/seals/post/air-post/fitting/O-ring/solid versus vented screw anatomy only. No current mandatory dimensions/counts/alloy/compound or complete commercial included-kit assumption. Actual drawing and supply gate govern."
  - id: "ghost-pod-method"
    type: "handbook"
    reference: "BLICK, Vacuum Pod Ghost Mark Information, retained April2024 manufacturer service document, PDFpage1 seal and fitting condition; page2 customer tubing/pod placement not manufacturing consumption. https://www.blickindustries.com/wp-content/uploads/2024/04/BI_Vacuum-Pod_Ghost-Mark_Info.pdf"
    used_for: "Service-condition counterevidence shows seal/fitting condition and actual leakage matter; motivates independent declared factory interface tests without importing customer throughput/placement, ghost-mark diagnosis, pressure/hardness threshold or certification."
