  recursive_input_rule: "Finished supplied plate/post machining/coating, elastomer production and hardware fabrication upstream. No raw alloy/resin inputs charged again with bought parts. Bought complete pod resale excluded; external CNC/pump not retained output."
  upstream_dataset_requirement: "Match actual finished-part drawing/material/compound/coat/gate and supplied content, power voltage and actual transport/support/waste treatment before boundary extension. Unknown component chemistry/flow IDs disclosed."
