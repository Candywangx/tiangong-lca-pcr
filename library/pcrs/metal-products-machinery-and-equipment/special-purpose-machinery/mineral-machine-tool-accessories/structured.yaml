product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.special-purpose-machinery.mineral-machine-tool-accessories"
  classification_refs: "CPC:3.0:44252; narrower; candidate placement review, no accepted mapping"
  covered_products: "Manufacture by assembly of a new standalone modular two-level vacuum workholding pod for a stationary CNC stone machining table. The defined route receives individually finished top/base plates, structural and air-distribution posts, friction pad, upper/lower perimeter seals, interface O-rings, straight push-in fitting and separate ordinary/vented screws. It includes incoming geometry/identity inspection, conditional qualified local minor preparation, matched assembly/seal seating/torque, upper/lower vacuum-path and geometric acceptance, independent complete net weighing and dispatch. Actual drawing, compound/material, interface and included component configuration are declared for each pod; a source illustration does not identify material alloy or polymer chemistry."
  excluded_products: "Exclude complete stone CNC machines, general vacuum pumps/generators/manifolds/hoses, lifting/handling suction cups, whole clamping tables or sets, independently sold replacement seals/pads/repair kits, refurbishment and customer stone-cutting services. Bought complete-pod resale/testing-only, integral one-piece or other host/material architecture requires separate applicability. Plate/post machining, casting and finishing, pad/seal compounding/moulding/vulcanization and screw/fitting production are upstream supplied-part processes, not implicit local operations. External host, workpiece, table, pump, test fixture and packaging excluded from product M. Actual manufacturing test support and rework burdens included; no operating life, holding capacity, machining yield or full cradle-to-gate assertion."
  representative_product: "One independently accepted modular stone-table workholding pod of one declared geometry/height/seal/circuit configuration; BLICK anatomy illustrates a historical square model, product page a separate round model."
  production_route: "Incoming finished-part verification and conditional preparation; Matched pod mechanical and seal assembly; Geometric and two-surface vacuum acceptance; Complete pod weighing and separate packaging"
  market_state: "New complete fitted clean dry pod sold alone. External pump/manifold/tubes/table/workpiece not fitted output, protective packaging separate."
functional_unit:
  what: "Manufacture and independently accept one configured stone-CNC vacuum pod accessory."
  how_much: "1kg accepted complete net pod output using actual M kg per same-configuration unit. One unit means one fitted pod, not cup set/table/host or workpiece load."
  how_well: "Released geometry/material/compound and supplied content, installed upper/lower seals/pad/posts/fitting/solid-vented screws, dimensional and separate declared circuit leakage results from the actual current plan. No universal vacuum, holding force, tolerance or fatigue threshold."
  how_long_or_cycle: "One manufacturing acceptance and delivery cycle; no operational lifetime or stone-cutting service."
  reference_flow_link: "finished_machine"
system_boundary:
  rules:
    - rule_id: boundary_supply
      applies_to: "prepare; assembly"
      rule: "One actual component per row; supplied machined metal-looking plates/posts need original grade/coating records, no image-to-alloy inference. Finished pad/seals require individual compound/profile and actual adhesive if used as separate formulation."
      source_ids:
        - anatomy-pod-method
    - rule_id: boundary_support
      applies_to: "acceptance"
      rule: "Table-side and workpiece-side reference surfaces, external pump, hose, gauge and test plate are reusable test support, not shipped pod. Meter actual demand; document support reuse and attribution. No routine customer slab cutting or ghosting waste counted."
      source_ids:
        - ghost-pod-method
    - rule_id: boundary_qualification
      applies_to: "acceptance"
      rule: "Test configured upper/lower circuits according to original current plan; historical anatomy dimensions/quantity and advertised precision not universal criteria. Exact contemporary approved tolerances/vacuum/time/leak limit must have traceable drawing/test origin."
      source_ids:
        - about-pod-method
        - anatomy-pod-method
boundary_abstraction:
  declared_starting_condition: "Individually finished matched plate/post/pad/seal/fitting/screw inputs received; incoming qualification, actual conditional preparation, assembly, independent geometric/sealed-circuit acceptance and complete pod dispatch."
