review_metadata:
  semantic_boundary_decision: "The existing PCR ID is retained and its existing methodology upgraded
    in place. The scoped CPC mapping is accepted; scientific approval, translation review and
    publication retain their separately recorded states. Classification rationale: Complete fruit
    presses/crushers for beverage manufacture fit 8435.10; fruit and beverage output itself is not
    the reference product. Historical author assessment:
    docs/reviews/pcr149-original-ids-20261127/44191.json."
  scientific_review: pending independent methodology review
  unresolved:
    inventory_flow_uuids:
      - row_id: stainless_sheet
        reason_code: identity_not_established
        explanation: add37984 is further-worked stainless flat-rolled stock, not declared cold-rolled stock
          without further processing; other candidates have conflicting bilingual alloy identities.
      - row_id: stainless_tube
        reason_code: identity_not_established
        explanation: English and Chinese searches do not establish the declared welded circular AISI304
          stock identity.
      - row_id: welding_wire
        reason_code: identity_not_established
        explanation: Searches return unrelated steel wire, generic welding service or incompatible
          consumables; no verified 308L solid-wire identity.
      - row_id: argon
        reason_code: identity_not_established
        explanation: English and Chinese queries did not establish a compatible pure argon shielding-gas
          identity.
      - row_id: grinding_dust
        reason_code: identity_not_established
        explanation: No compatible collected stainless grinding-dust Waste identity; elementary airborne
          particulate cannot substitute.
      - row_id: abrasive_disc
        reason_code: identity_not_established
        explanation: Search establishes no compatible finished aluminium-oxide abrasive disc; raw alumina
          candidates do not represent the product.
      - row_id: powder_waste
        reason_code: identity_not_established
        explanation: 363302a6 direct reference is Aluminium content, not Mass; cannot use its kg aluminium
          quantity as kg waste paint.
      - row_id: alkaline_wastewater
        reason_code: identity_not_established
        explanation: Search does not establish the declared untreated alkaline bath as a Waste flow for
          external treatment; tap water or elementary discharge is not compatible.
      - row_id: acid_wastewater
        reason_code: identity_not_established
        explanation: No compatible untreated nitric-acid passivation bath Waste identity; industrial
          treatment or elementary water-release candidates have different boundaries.
      - row_id: press_basket
        reason_code: identity_not_established
        explanation: No compatible finished fruit-press basket identity; stainless stock and mill screens
          are different products.
      - row_id: natural_rubber_membrane
        reason_code: identity_not_established
        explanation: No compatible finished natural-rubber hydropress diaphragm; raw rubber and
          polypropylene diaphragm candidates are incompatible.
      - row_id: relief_valve
        reason_code: identity_not_established
        explanation: No verified complete water-pressure relief valve with gauge; generic valves lack the
          specified assembly/medium boundary.
      - row_id: press_filter_bag
        reason_code: identity_not_established
        explanation: No compatible finished polyester fruit-press filter bag; generic fabric is not the
          made-up product.
      - row_id: mill_screen
        reason_code: identity_not_established
        explanation: No compatible finished perforated fruit-mill screen identity; flat stainless stock or
          unrelated screening machinery cannot substitute.
      - row_id: mill_rotor
        reason_code: identity_not_established
        explanation: Search does not establish the specified finished fruit-mill cutting rotor; unrelated
          rotor or metal stock is incompatible.
      - row_id: electric_motor
        reason_code: identity_not_established
        explanation: 014f80a3 direct comment restricts the purchased motor to conveyor/washing modules with
          expert estimates; not a verified fruit-mill motor identity.
      - row_id: start_stop_switch
        reason_code: identity_not_established
        explanation: No compatible single start-stop switch assembly; pooled electrical/control parts are
          not atomic substitutes.
      - row_id: stainless_bolt
        reason_code: identity_not_established
        explanation: Search does not verify the specified finished stainless hexagonal bolt; mixed fasteners
          are not compatible.
      - row_id: epdm_gasket
        reason_code: identity_not_established
        explanation: No compatible declared food-contact finished EPDM gasket; generic rubber is not the
          finished seal.
      - row_id: factory_test_water_waste
        reason_code: identity_not_established
        explanation: No compatible external-treatment Waste flow for the actual spent factory water-test
          liquid; tap water and elementary freshwater do not match.
    evidence_needs:
      - Design sources do not supply primary manufacturing quantities, M, recipe, measured
        allocation drivers or factory emission observations. Obtain configured foreground records
        without inventing generic mass, lifetime, concentration, operating demand or range.
      - Reconcile actual BOM/route and upstream, incoming transport and waste-treatment coverage
        before claiming a complete cradle-to-gate dataset. Voran3/18 is historical design evidence
        only.
