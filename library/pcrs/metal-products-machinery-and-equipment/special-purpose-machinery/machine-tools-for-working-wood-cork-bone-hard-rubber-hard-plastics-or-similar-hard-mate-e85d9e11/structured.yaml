allocation_rules:
  - rule_id: causal
    applies_to: "site"
    rule: "Separate configurations and subdivisions first; allocate common residual by measured causal load, operating time or appropriate physical driver, retain numerator and denominator records and uncertainty. Do not average unrelated machine models or use machine mass automatically for every utility."
    source_ids: []
  - rule_id: rejects
    applies_to: "accepted"
    rule: "Include actual rejects, rework and qualification burdens in attributable Q for accepted output; only accepted net mass/count enters denominator. Segregate recycling transfer and treatment; do not assume avoided-product credits or zero upstream recycled burden."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "reference product"
      record_type: "weighing"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted lot"
      temporal_coverage: "common manufacturing period"
      site_scope: "same configuration/site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration/tare/included accessories/acceptance"
    - protocol_id: cp_material
      process_id: "all"
      flow_role: "actual inputs"
      record_type: "meter_issue"
      raw_fields: "specific species/grade; supplied state; issue; each moisture/density/assay; make/buy; stocks; Q; N"
      collection_method: "Reconcile each exchange metering/stores/recipe and paired returns in common period; Q includes rejects/rework and each term own assay."
      unit: "kg"
      frequency: "each batch or continuous meter"
      temporal_coverage: "common manufacturing period"
      site_scope: "same configuration/site and supplier"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "grade/composition tests/meters/stocks"
    - protocol_id: cp_energy
      process_id: "all"
      flow_role: "electricity and heat"
      record_type: "meter"
      raw_fields: "process meters; gross imports; actual generation; exports; storage; each supply/return steam mass pressure temperature enthalpy; net invoice; Q; N"
      collection_method: "Reconcile process meters in same period/units; shared services only unassigned residual, investigate negative residual. Each steam supply/return uses own kg and MJ/kg/common zero, return deducted once."
      unit: "MJ"
      frequency: "continuous meters/each test"
      temporal_coverage: "common manufacturing period"
      site_scope: "same configuration/site"
      aggregation_rule: "attributable energy / accepted machines"
      quality_evidence: "calibrated meters/delivery interface/thermodynamics/allocation uncertainty"
    - protocol_id: cp_waste
      process_id: "all"
      flow_role: "specific waste"
      record_type: "transfer"
      raw_fields: "each stream mass and own moisture/assay; beginning/end stocks; internal return; external treatment; Q; N"
      collection_method: "Weigh/sample treatment transfers, distinguish return/reuse/recycling/disposal without assumed substitution credit."
      unit: "kg"
      frequency: "each transfer lot"
      temporal_coverage: "common manufacturing period"
      site_scope: "same configuration/site and treatment interface"
      aggregation_rule: "attributable waste / accepted machines"
      quality_evidence: "waste tickets/sampling/stocks"
    - protocol_id: cp_emission
      process_id: "all"
      flow_role: "specific species/compartment"
      record_type: "species_measurement"
      raw_fields: "actual species/compartment; concentration; exhaust or liquid flow; wet/dry temperature/pressure; capture/destruction; own assays; Q; N"
      collection_method: "Use matched species/compartment measured or verified actual technology factors; investigate closure, capture not destruction, residual not air emission."
      unit: "kg"
      frequency: "actual tests/emission periods"
      temporal_coverage: "common manufacturing period"
      site_scope: "same configuration/site boundary"
      aggregation_rule: "attributable emission / accepted machines"
      quality_evidence: "sampling/flow/combined uncertainty"
    - protocol_id: cp_volume
      process_id: "all"
      flow_role: "specific supplied gas/fluid/bulk woodchips"
      record_type: "meter"
      raw_fields: "gas/fluid/bulk woodchips identity; delivered volume; actual T/P or standard conditions; density; Q; N"
      collection_method: "Meter native volume at actual state: gas T/P, liquid temperature or documented bulk-chip packing/moisture basis. Mass conversion uses that actual stream measured density, not generic factors."
      unit: "m3"
      frequency: "each batch/continuous meter"
      temporal_coverage: "common manufacturing period"
      site_scope: "same configuration/supply interface"
      aggregation_rule: "attributable volume / accepted machines"
      quality_evidence: "T/P/flow/density/calibration"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: complete_bom
      applies_to: "actual configuration"
      requirement: "Cover all actual exchanges; separate make/buy/accessories/fills/test charges; gaps explicit"
      evidence: "actual BOM/routes/suppliers"
    - id: mass_period
      applies_to: "cohort"
      requirement: "Same configuration/period/acceptance, calibrated mass/stocks; no cross-family mean"
      evidence: "calibration/period ledger"
    - id: balance_uncertainty
      applies_to: "physical balances"
      requirement: "Own water fraction/density/assay/reactions/paired returns; compare combined uncertainty"
      evidence: "measurement/sampling/reaction/allocation evidence"
    - id: cohort_raw
      applies_to: "cohort"
      requirement: "Naccepted, Dnet and Qattr share configuration/period. Dnet sums calibrated accepted net masses; M=Dnet/Naccepted, q_item=Qattr/Naccepted, q_ref=Qattr/Dnet. Qattr includes rejects/rework/factory tests; Dnet excludes packing/rejects/consumed trial charge. Preserve each native numerator unit."
      evidence: "calibration/actual-period ledgers"
    - id: species_sampling
      applies_to: "emissions"
      requirement: "Post-control species concentration times matched same-period gas/liquid flow and duration with T/P/wet-dry/unit corrections; fugitives independently measured. Unknown residual not air release, capture not destruction; each metal/chemical/water term uses own assay/water fraction/density/stocks/reactions/paired returns."
      evidence: "actual concentration/flow/period/state records"
    - id: contained_assay
      applies_to: "physical balances"
      requirement: "Each input/product/scrap/sludge/liquid/release uses own measured gross mass times own assay and wet/dry basis; gross alloy/sludge is not contained metal. Every water term uses own water fraction and density at actual temperature, including product retention/reaction/evaporation/discharge/beginning-end stocks; internal returns pair/cancel."
      evidence: "term-specific measurement/assay/moisture/stocks"
    - id: solvent_fates
      applies_to: "solvent records"
      requirement: "Record recovered return/product retention/captured liquid or media/demonstrated destruction/wastewater separately. Recovered/retained/captured and wastewater/media are non-air fates; capture not destruction. Investigate unknown residual, never turn it into air release."
      evidence: "actual material/sampling/abatement records"
    - id: utility_residual
      applies_to: "energy"
      requirement: "Reconcile common-period imports plus actual generation minus exports/storage changes against fabrication/finish/integration/test/dispatch loads; shared row ONLY unassigned residual. Investigate negative residual against period/units/combined uncertainty without clipping."
      evidence: "calibrated subprocess/site meters"
    - id: heat_return
      applies_to: "thermal interface"
      requirement: "Gross heat equals measured supply kg times own MJ/kg minus independently measured return kg times return own MJ/kg, with common datum and actual T/P. Gross supply deducts return once; already-net bill never deducts again. Physical steam/condensate mass separate from heat; supplier boiler fuel not onsite combustion."
      evidence: "separate supply/return metering/thermodynamic state/invoice"
    - id: cohort
      applies_to: "all inventory rows"
      requirement: "Same configuration/common period Qattr includes attributable reject/rework/test; Naccepted counts accepted complete machines; Dnet sums calibrated accepted net masses including actual supplied installed tools/retained fills/accessories, excluding packing/rejects/consumed test charge. M=Dnet/Naccepted; q_item=Qattr/Naccepted; q_ref=Qattr/Dnet. Preserve each numerator native unit and explicit conversion; no mixed configurations."
      evidence: "calibrated net mass/supplied list/acceptance/cohort raw-period records"
    - id: provider_gaps
      applies_to: "links"
      requirement: "Each actual upstream/treatment matches state/geography/period; unverified not complete footprint"
      evidence: "direct records/substitution disclosure"
validation_rules:
  - rule_id: identity
    applies_to: "dataset"
    rule: "Confirm principal function, stationary hard-material/boardpress/woodtreating function, model/revision, delivered configuration and activated architecture. Every actual exchange needs matching identity/property/unit/provider; absent, zero and unknown remain distinct."
    source_ids: []
  - rule_id: denominator
    applies_to: "all inventory rows"
    rule: "All inventory uses the same accepted cohort and common period. Verify calibrated accepted net mass and N; reject and packaging mass excluded. Check q_item=Q/N then normalization by same mean M; mixed configurations are invalid."
    source_ids: []
  - rule_id: double_count
    applies_to: "make_buy"
    rule: "Reconcile complete bought modules versus own materials and operations, retained fills/accessories versus factory consumption, paired internal transfers and external inputs. Count each actual burden once."
    source_ids: []
  - rule_id: water_close
    applies_to: "physical water records"
    rule: "For each term use its own measured water fraction, density and wet/dry basis: fresh and input moisture plus reaction water and beginning stocks minus final stocks, retained product, discharge and evaporation; internal returns cancel paired. Investigate measured closure against combined sampling/meter/allocation uncertainty; no universal tolerance."
    source_ids: []
  - rule_id: species_close
    applies_to: "material and chemical records"
    rule: "Close each contained metal/chemical separately using each input, product, scrap, sludge, liquid and release own matched assay and dry/wet basis, reaction stoichiometry and stocks. Gross mass is not contained element. No all-inventory mass rule applies to energy or transport."
    source_ids: []
  - rule_id: solvent_close
    applies_to: "solvent records"
    rule: "Distinguish retained solvent, recovered return, captured liquid/media, demonstrated destruction, wastewater/non-air residual and actual species air release. Capture is not destruction; an unexplained residual must be investigated, not assigned to air."
    source_ids: []
  - rule_id: utility_close
    applies_to: "energy records"
    rule: "Reconcile purchased imports, actual on-site generation, exports and storage changes with assigned fabrication/finish/integration/test/dispatch loads in the same period and units. Shared row ONLY unassigned residual; investigate negative residual against period, unit and combined measurement uncertainty without clipping."
    source_ids: []
  - rule_id: steam_close
    applies_to: "steam and condensate"
    rule: "Use supply kg times supply own MJ/kg and return kg times return own MJ/kg at measured pressure/temperature relative to common zero. If gross supply, subtract return once; if already-net invoice, do not subtract again. Keep physical steam/condensate mass balance independent from energy."
    source_ids: []
  - rule_id: species_emissions
    applies_to: "air releases"
    rule: "Validate every emitted species and compartment independently. Fuel carbon balance cannot alone establish CO or NOx. NO2 mass is not NOx reported as NO2 equivalent; keep reporting conventions and actual species identities distinct."
    source_ids: []
