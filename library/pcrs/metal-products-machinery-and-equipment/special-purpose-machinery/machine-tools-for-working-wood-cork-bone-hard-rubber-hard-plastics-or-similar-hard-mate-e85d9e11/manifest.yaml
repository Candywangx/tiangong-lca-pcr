    unresolved_support_fields: []
  unresolved_inventory_uuids: Every distinct atomic identity actually searched. Unadopted supplied grade, component completion, chemistry, type, native-property or provider identities remain item-specific gaps before publication; unknown is not zero or absence.
  unresolved_factory_recipe: Primary originals establish qualitative full category and alternative architecture, not factory recipe. Actual BOM, make/buy, pressure design, tool grade, test plan/media, retained fills, supplied scope and suppliers required. Hardrubber/bone/cork and other treatment variants retain actual physical collection rather than wood defaults.
  unresolved_quantitative_ranges: No catalogue power, weight, pressure rating, throughput, energy savings, lifetime, factory yield or operational chemical recipe is a manufacturing default.
  identity_rejections:
    - PEfilm luggage classification and PVAcglue conflictingCAS unavailable.
    - Whole machines and generic rawstock not completed pressplatens, nailsheads or finishedframes.
    - Windturbine parts and project-specific generators not generic machine motors/gearsets.
    - Indoor, soil, water and long-term elementary compartments not ordinary unspecified air.
    - Count-based motors/bearings do not establish authored mass interface without explicit actual conversion.
