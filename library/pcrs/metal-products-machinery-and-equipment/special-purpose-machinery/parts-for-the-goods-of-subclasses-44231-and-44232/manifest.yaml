  unresolved_inventory_uuids: Every atomic identity has actual bounded type/direction queries. Specific alloy ingot/blank, reinforced-polyamide/TPE compound, dedicated housing/gear/rotor vane/lamination/brush/controller/grease and outgoing polymer/cleaning/solvent Waste remain unconfirmed. Wrong host, completion, chemistry, active classification or receiver cannot substitute. Unknown is not absence or zero.
  unresolved_factory_recipe: OEM exploded drawings, supplied kits and actual housing/casting examples establish conditional architecture, not universal BOM, polymer/metal grade, part mass, kit count, recipe, lifetime, test power-hours or customer operation. Collect actual accepted part configuration, make/buy route and manufacturing cohort.
  unresolved_category_cases: Both44231 pneumatic/hydraulic/self-contained non-electric motor and44232 self-contained electric motor handheld hosts preserved. Complete tools, independent toolholders44251, interchangeable cutting tools, general motors/engine parts, bearings/switches/batteries/chargers and other separately classified goods require individual supplied-item review; catalogue spare/accessory label alone is insufficient.
