        end:
          offset: 13198
          line: 102
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual external raw/compound/completed subpart receipt by observed make/buy interface |\n| starting_condition_role | foreground_start |\n| product_classification_scope | Dedicated parts across actual44231 and44232 host scope, individual supplycompletion/generalgoods/holder/cuttingtool exclusion review |\n| recursive_input_rule | Bought completion embeds upstream once, own raw/operations separate; same-category completed subpart supply conditional, no recursive constituent duplication; internal transfers paired |\n| upstream_dataset_requirement | Actual supply grade/formulation/completion/geography/period/treatment matched |\n| disclosure | Factory manufacturing foreground, no complete cradle-to-gate footprint claim with unfinished upstream links |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `gate` | foreground | Actual dedicated-part receipt/fabrication/moulding/finish/integration/cleaning/acceptance, attributable rejects/rework, packing/wastes/common manufacturingservices throughrelease. |  |\n| `make_buy` | supplier_interface | Bought finished housings/castblanks/modules embed upstream once; own rawcasting/moulding/winding records each actual input/operation instead. Pair internal transfers; tooling allocated from actual service records, not mould steel as partBOM. |  |\n| `factory_use` | production | Only observed partfactory/fixture acceptance and test burdens, not customer cutting/ratedair/oil/fuel/endusercycles. Consumed tests outsideDnet, actual retained shipmentfills separately proven. |  |\n| `bom_extension` | route | Conditional cards require actual grade/formulation/completion/provider. Every additional actual component/polymer/metal/coating/medium/Waste/emitted species has its own bounded correctrole query and measured nativequantity. Unknown is not zero/absence. |  |\n| `upstream` | links | Actual supplied type/geography/completion/period and external Waste receiver require matching upstreamlinks. Unfinishedlinks discloseforeground only, no completefootprint; general goods/toolholders/cuttingtools remain separately reviewed. |  |\n\n### Actual architectures and supplied variants\n\n| variant | actual_configuration | scope_condition |\n| --- | --- | --- |\n| Electrictool dedicatedparts | Actual corded/battery housings/gearing/reciprocating linkage/electricalintegration with ownhost/model fit | Generic motor/switch/bearing/battery/charger/holder notautomaticreference; boughtmodule embeds constituent once |\n| Air/hydraulic dedicatedparts | Actual airrotor/vane/cylinder/shaft/valvebody and hydraulic flowsleeve/accumulator/footcompletion | Own vane/seal/diaphragm grades unspecified by source, no graphite/NBR default; complete-only kit supply reconciled |\n| Petrolhost dedicatedparts | Actual hostdedicated crankcase/piston/cylinder/guard configuration and inclusion sets | Engine/filter/ignition separatelyclassified review; no rated fuel/power as factorytest or mass |\n| Manufacturedhousing/guard | Actual aluminiumHPDC wheelguard/impeller or reinforcednylon/TPE overmoulding with own supplies | No fixed alloy/PA/filler/TPErecipe; machine/compressor examples excluded; mouldmaterial notpartmaterial |\n| Factoryrelease | Same configured accepted dedicatedpart netcohort, observed factorytests | Packing/testconsumption/hosttool/customeroperation separate, retainedfill independentlymeasured |\n\n"
