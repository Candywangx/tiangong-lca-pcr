system_boundary:
  rules:
    - rule_id: boundary_scope
      applies_to: "foreground_system_boundary"
      rule: "A part must be dedicated to a reviewed electric solder/braze/weld or electric metal/carbide hot-spray host. Generic purchased goods and consumable feed are inputs only, not automatically reference parts; auxiliary controls do not establish principal heating function."
      source_ids:
        - cpc
    - rule_id: boundary_makebuy
      applies_to: "foreground_system_boundary"
      rule: "Use actual complete bought modules once, excluding their embedded stock and manufacture. Actual local manufacture uses separately queried ingredients/operations; partial bought states disclose remaining work. Replacement listing never proves included host or spare shipment."
      source_ids:
        - cpc
        - hakko-parts
        - hakko-tip
        - metco-nozzles
        - metco-spares
        - castolin-parts
        - resistance-parts
        - coil-actual
    - rule_id: boundary_test
      applies_to: "foreground_system_boundary"
      rule: "Include attributable observed part manufacture, finishing, failed/repeated factory tests and dispatch. Separate retained shipped components/fills from consumed trial coupons/fillers/gases/coolant and customer lifetime operation; leak-only inspection invents no spraying/welding recipe."
      source_ids:
        - coil-actual
        - metco-nozzles
        - hakko-tip
