allocation_rules:
  - rule_id: allocate_burdens
    applies_to: "foreground_burden_allocation"
    rule: "Separate configuration/site/common-period records first. Direct component/operation/test records precede allocation; shared services use a documented causal metered basis only for unassigned residual. Attributable reject/rework/test burden remains; do not dilute with total unrelated plant output."
    source_ids: []
  - rule_id: allocate_scrap
    applies_to: "foreground_burden_allocation"
    rule: "Retained recoverable materials are stock/paired returns; actual external coproducts need explicit allocation/substitution method and compatible output state. Waste transfer receives no automatic avoided-primary-metal credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "accepted configured reference"
      record_type: "foreground_record"
      raw_fields: "configuration; serial/BOM; Naccepted; each calibrated accepted net mass; Dnet; included accessories/fills; excluded packing/spares/reject/test loads"
      collection_method: "Use calibrated weighing/traceable weighing records for accepted configured finished part of same configuration; reconcile acceptance and actual supplied BOM. For disassembled shipment sum each included module once."
      unit: "kg"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_materials
      process_id: "fabrication"
      flow_role: "each actual material/formulation"
      record_type: "foreground_record"
      raw_fields: "identity/grade; gross Qattr; own assay/water fraction; stocks; reactions; returns; local operations; bought completion; uncertainty"
      collection_method: "Weigh each purchase/use stream and measure own chemistry/water fraction; reconcile supplied finish and stock-adjusted local fabrication, conductive/coil/insulation fabrication, surface finish, reject/rework."
      unit: "kg"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_modules
      process_id: "assembly"
      flow_role: "each completed hardware component, local joining ingredient and retained fill"
      record_type: "foreground_record"
      raw_fields: "part/serial; native Qattr; chemical formulation/assay/moisture; actual gas temperature/pressure/density; stocks/reactions/part retention/returns; compatibility; supplier/BOM; embedded materials/operations; included conductor/coil/liner/nozzle/electrode/insulation/board/cooling/fill; rejected/reworked amounts"
      collection_method: "Hardware branch: use actual receipts and measured masses of each supplied hardware unit; installed count converts through same-unit measured mass. Retained gas charges preserve native mass/volume and actual T/P/density, supplier completion and stocks; no hardware mass is a gas amount. Chemical-ingredient branch: independently measure actual local joining filler, flux and gas in native physical units, with own supplied formulation/contained fraction, moisture, gas temperature/pressure/density, stocks, reactions, accepted-part retention and returns. Whole hardware mass is not chemical amount. Bought completed modules embed manufacture and their included chemicals once; actual local joining has its separately measured ingredients. Local coil, contact, insulation or dedicated control assembly requires its own atomic route and actual upstream replacements."
      unit: "native unit"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_tests
      process_id: "test"
      flow_role: "each actual factory test exchange"
      record_type: "foreground_record"
      raw_fields: "configuration; test programme; actual performed intervals; measured Qattr; gas inlet/return/vent and actual auxiliary electrical load; media/coupon consumption and returns; coolant stocks; acceptance/reject/rework"
      collection_method: "Meter actual dimensional/electrical/insulation/leak/feeding or functional weld/solder/braze/electric-spray part trials; retain all attributable failed/repeated tests. Distinguish retained first-set hardware/fills from consumed media and user lifetime quantities. Leak-only checks do not invent joining filler or electric-spray consumption; validate actual performed test state only."
      unit: "native unit"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_utilities
      process_id: "services"
      flow_role: "each actual utility meter"
      record_type: "foreground_record"
      raw_fields: "native Qattr; common-period imports/actual onsite energy generation/exports/storage; process/test assigned meters; residual shared services; voltage/provider; gas T/P/humidity/density; gross/net heat and returns"
      collection_method: "Reconcile actual imports/generation/exports/storage with assigned fabrication/assembly/finish/test/dispatch loads; allocate only unassigned residual, investigate negatives/uncertainty without clipping. Gross heat kg×its own MJ/kg less independent return kg×its own MJ/kg on one datum, deducted once; already-net heat excludes second return deduction. Physical steam/condensate mass is separate from energy; upstream heat provider boiler excluded from onsite fuel."
      unit: "native unit"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_dispatch
      process_id: "dispatch"
      flow_role: "each packaging and finished output"
      record_type: "foreground_record"
      raw_fields: "accepted configuration/BOM/net output; packaging Qattr; actual polymer/board/pallet grade; return share; external transport native activity"
      collection_method: "Weigh actual dispatch packaging separately from accepted configured-part net mass; retain supplier/transport interface and actual returned packaging, never a standard packaging ratio."
      unit: "kg"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_wastes
      process_id: "residues"
      flow_role: "each actual waste stream"
      record_type: "foreground_record"
      raw_fields: "gross Qattr; own water/element/chemical assays; stocks/internal returns/recovery; actual external transfer/provider and treatment"
      collection_method: "Use weighed transfer manifests and own stream samples; whole sludge/alloy/wastewater differs from contained species. Captured dust/solvent stay non-air until measured release; external provider emissions belong to provider."
      unit: "kg"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_emissions
      process_id: "residues"
      flow_role: "each elementary species"
      record_type: "foreground_record"
      raw_fields: "CAS/origin/compartment; Qattr; actual post-control concentration; matched gas/liquid flow and time; T/P/wet-dry/oxygen/unit correction; independent fugitive basis; retention/capture/destruction"
      collection_method: "Measure species after actual controls using measured concentration × matched flow × same period with state/unit corrections plus independent fugitive measurement. Element/species assay is distinct from gross dust/oxide; prevent overlapping total PM/component emissions. Unexplained mass residual and carbon closure cannot infer CO/NO2."
      unit: "kg"
      frequency: "each actual batch and matched meter interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For one configuration and period divide each attributable native-unit exchange total by the sum of accepted configured-part net masses; keep raw amounts, units and uncertainty."
      inputs:
        - Qattr
        - Dnet
        - cp_mass
      output: "native-unit amount per kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_qnd
      applies_to: "all inventory rows"
      requirement: "For one identical part configuration and period, Qattr includes attributable manufacture/finish/reject/rework/factory-test burdens; Naccepted counts accepted parts whose calibrated masses sum to Dnet. Per-part exchange=Qattr/Naccepted; measured mean net part mass=Dnet/Naccepted; per-kg exchange=Qattr/Dnet. Native numerator remains unchanged and no catalogue host/part/workpiece mass, life or test throughput is assumed."
      evidence: "calibrated net masses and same-configuration acceptance ledger"
    - id: quality_physical
      applies_to: "all inventory rows"
      requirement: "Each physical element/species term uses own gross mass, assay, moisture/wet-dry basis, stocks, reactions, retained part, returns and waste. Gross alloy/sludge/solution differs from contained Cu/Fe/Ni/Cr/W/tin/chemical mass. Each water stream uses own water fraction and measured/documented density at actual temperature, reaction/retention/evaporation/discharge/stocks; pair/cancel internal returns."
      evidence: "own stream assays and stock/reaction measurements"
    - id: quality_solvent
      applies_to: "ipa; spentipa; ipair"
      requirement: "Reconcile own IPA assays across inputs, stock, retained part, recovery/capture, wastewater/spent media, destruction and independent measured air. Capture is not destruction; non-air fates and unexplained residual never become air."
      evidence: "independent fate measurements and own assays"
    - id: quality_native
      applies_to: "cable"
      requirement: "Retain actual cable construction and measured received/cut/installed/returned Length in m, stock and actual losses. If mass closure needs conversion, measure same-construction kg/m independently; a cable Energy or capacity reference cannot establish physical cable mass."
      evidence: "original cable supplier and length/mass records"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Match publication state100/type, native reference internal-ID/property/unitgroup, chemistry/CAS/hydrate/grade, supplied completion/provider/geography and elementary species/origin/compartment. Add every actual unlisted dedicated power/control/cooling/feeder part, magnetic stock/winding/insulation/plating ingredient, gas/fuel/refrigerant/fill, transport, waste or emission as a separately queried measured atomic exchange. Generic electronic collection, raw stock and complete host are not dedicated-part proxies. Missing differs from zero; not-applicable requires physical evidence."
      evidence: "original supplier/BOM and explicit identity gaps"
    - id: quality_scope
      applies_to: "reference product"
      requirement: "Review each dedicated host and exact part completion, including electrical resistance/arc/inverter/transformer joining, induction brazing and electric plasma/arc hot-spray architectures. HAKKO layer exception models and Metco optional tungsten lining remain item-specific. Catalogue spare availability, gas compatibility/power/lifetime claims and maximum workpiece/host ratings prove no universal shipment, factory chemistry, part mass or trial recipe."
      evidence: "primary original configuration and principal-function review"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Require exact dedicated part and reviewed electric joining/electric metal-carbide hot-spray host compatibility, full supplied state and identical bilingual one-kg net reference. Reject complete host, generic component, consumable powder/wire, nonelectric dedicated part or ordinary paint-spray item as category reference."
    source_ids:
      - cpc
  - rule_id: validate_makebuy
    applies_to: "foreground_dataset_conformance"
    rule: "Reject duplicated completed bought-module manufacture, unpaired internal transfers, assumed replacement shipment/fill or customer use presented as factory load. Retain actual attributable failed/repeated tests/rework; coatings and bought electronics must match actual completed state."
    source_ids:
      - cpc
      - hakko-parts
      - hakko-tip
      - metco-nozzles
      - metco-spares
      - castolin-parts
      - resistance-parts
      - coil-actual
  - rule_id: validate_balances
    applies_to: "foreground_dataset_conformance"
    rule: "Require own-stream element/water/solvent balances, post-control species-specific concentration × matched flow/time/state plus independent fugitive basis. Utility common-period imports/actual generation/exports/storage reconcile assigned process loads and only unassigned residual. Gross heat deducts independent return once on same datum; net heat never deducts twice."
    source_ids: []
  - rule_id: validate_species
    applies_to: "foreground_dataset_conformance"
    rule: "Total Cr differs from Cr(VI); gross oxide/fume differs from contained element; PM10 includes finer fractions and must not duplicate constituent emission accounting. Molecular NO2 differs from NOx as NO2-equivalent. State20, CTUe or cable-Energy physical proxies, conflicting grades/routes/compartments and unqueried identities are unavailable. Report accepted input/performed/skipped checks/findings/completeness truthfully."
    source_ids: []
