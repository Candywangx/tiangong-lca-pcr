review_metadata:
  semantic_boundary_decision: "Narrower CPC44622 manufacturing boundary: complete
    water-based washer-extractors and electric vented tumble dryers, including
    factory-integrated stacks only when every included functional module
    exceeds10kg dry linen on its declared rating basis. Excludes solvent
    dry-cleaning, gas/steam-heated and heat-pump routes, tunnel lines and small
    machines. Commercial warewashing covers tableware, industrial
    fans/centrifuges exclude clothes dryers and own component boundaries;
    heat-pump equipment is distinct. One complete configured net M for stacks.
    Old scaffold/id remains read-only; no accepted mapping asserted."
  scientific_review: pending independent methodology review
