allocation_rules:
  - rule_id: allocation_separate
    applies_to: "shared_operations"
    rule: "Separate metered batches and designs first. Attribute shared cutting, finishing, assembly and tests using measured operation time/load or net material issues with evidenced causal drivers; reconcile to the shared total including idle and rework. Do not use blanket equal-per-machine or sales-value allocation without an evidenced relationship and sensitivity."
    source_ids: []
  - rule_id: allocation_reuse
    applies_to: "test_cloth_and_water"
    rule: "Reusable cotton test loads are factory tools, not delivered mass or one full load consumed per machine. Attribute measured replacement to actually served orders using documented reuse records. Recycled test water is internal circulation; count only actual make-up input and exported drain. A stack is one declared whole product; do not split/double its M by function."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "manufacturing_batch"
    rule: "Retain rejected units, rework, retests, WIP changes and recovered stock in the same period/configuration balance. Normalize attributable burden to accepted complete machines. Exported scrap/waste leaves at its recorded receiver gate without automatic avoided-primary-material credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_configuration
      process_id: "assembly_factory_test"
      flow_role: "configured machine"
      record_type: "configuration/BOM crosswalk"
      raw_fields: "model; functional modules; individual capacity/fabric/fill basis; heating/water/exhaust; BOM; supplier internals; actual route; acceptance; rejects/WIP"
      collection_method: "Reconcile the actual installed design and make-or-buy for every item and operation. Retain each module rating basis and one whole-unit acceptance/M for stacks. Capacity, power and catalogue weight are configuration only, not manufacturing exchange factors."
      unit: "kg"
      frequency: "each configuration and revision"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "one configured build record per accepted machine"
      quality_evidence: "BOM; supplier inclusion; drawings; rating and acceptance records"
    - protocol_id: cp_mass
      process_id: "factory_test"
      flow_role: "reference product"
      record_type: "calibrated net machine weighing"
      raw_fields: "model; configuration; serial; accepted net mass M; drained/dried state; retained lubricant; exclusions; accepted count"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted configuration and representative units"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "scale calibration; net weigh ticket; configuration; acceptance"
    - protocol_id: cp_material
      process_id: "fabrication_finishing_assembly_factory_test_packout"
      flow_role: "single delivered material"
      record_type: "issue/return and inventory balance"
      raw_fields: "single grade/formulation/state; net issues/returns; recovery; density/temperature; served orders; accepted count"
      collection_method: "Weigh net attributable stock, wire, gas, abrasive, coating, cleaner, lubricant, tap water or specified protection individually. Keep each alloy and supplied mixture separate; retain actual density/temperature for volume conversion and exclude supplier-included fills. Purchased ready mixture is not counted again by ingredients. No dilution, yield or standard-water factor."
      unit: "kg"
      frequency: "each issue and reconciled batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable net material mass / accepted machines of the same configuration"
      quality_evidence: "scale; issue ledger; SDS; composition and concentration; density"
    - protocol_id: cp_parts
      process_id: "assembly"
      flow_role: "single finished component"
      record_type: "receipt weighing and installed build list"
      raw_fields: "one part design; supplier completeness; count; delivered mass; installed quantity; accepted count"
      collection_method: "Measure the delivered mass or verify actual lot-specific count-to-mass records for each design. Reconcile drums/tubs, drives, suspension, valves, heaters/blower, doors and controls. A purchased complete blower includes its declared motor; exclude panel/drive/heater internals already included. No capacity, power, airflow or catalogue-machine-weight component factor."
      unit: "kg"
      frequency: "each supplied lot and build batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable installed component mass / accepted machines of the same configuration"
      quality_evidence: "scale; supplier inclusion; actual part BOM and lot mass"
    - protocol_id: cp_energy
      process_id: "fabrication_finishing_assembly_factory_test"
      flow_role: "electricity"
      record_type: "meter and causal-driver ledger"
      raw_fields: "stage; source/voltage; metered kWh; interval; measured shared total; driver; idle/retest; accepted count"
      collection_method: "Meter actual operations including actual washer heating, dryer heater/blower and wet-load tests only as performed. Convert1 kWh =3.6 MJ. Attribute measured shared totals by actual causal load/time records and reconcile idle/rework/rejects. Manufacturer operating energy is not factory-test consumption; rated power times invented hours is prohibited."
      unit: "MJ"
      frequency: "each actual stage interval and batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable electrical energy / accepted machines of the same configuration"
      quality_evidence: "meter calibration; bills; stage/driver and acceptance records"
    - protocol_id: cp_waste
      process_id: "fabrication_finishing_factory_test"
      flow_role: "individual exported waste"
      record_type: "segregated weighing and receiver receipts"
      raw_fields: "single waste; alloy/composition; wet/dry; contamination; exported mass; recovery; receiver/treatment; accepted count"
      collection_method: "Weigh actual segregated exports and reconcile internal recovery and WIP. Keep non-alloy/galvanized/stainless offcuts, captured dust, spent discs, powder overspray, cleaner solution and leak-test water separate. Retain actual solution concentration and receiver gate. Reused water is not export; discharge after treatment requires individual measured elementary species/medium and its own boundary."
      unit: "kg"
      frequency: "each export and reconciled batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable exported waste mass / accepted machines of the same configuration"
      quality_evidence: "scale; composition; treatment/receiver receipts"
    - protocol_id: cp_emission
      process_id: "fabrication_factory_test"
      flow_role: "single air substance"
      record_type: "post-control monitoring or water balance"
      raw_fields: "substance; medium/submedium; size; concentration; flow; interval; humidity/temperature/pressure; background; wet/dry cloth; water in/drain/condensate/retention; accepted count"
      collection_method: "For actual particulate releases, pair post-control concentration and air volume with sampling/size evidence. For actual wet dryer tests, establish incremental water vapour from paired inlet/outlet humidity and dry-air flow, or an evidenced load-water balance including drains/condensate/retention. Retain conversion and uncertainty; exclude inlet moisture and captured solids. No assumed emission, mandatory wet test or operating evaporation factor."
      unit: "kg"
      frequency: "representative actual emitting/test intervals"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable measured substance mass / accepted machines of the same configuration"
      quality_evidence: "monitoring; sampling; humidity/flow or full water balance"
    - protocol_id: cp_water_resource
      process_id: "finishing_factory_test"
      flow_role: "groundwater"
      record_type: "well volume meter and site record"
      raw_fields: "freshwater source; well/site/country; m3; interval; stage use; reuse; accepted count"
      collection_method: "Meter actual freshwater groundwater abstraction at the declared factory; reconcile actual use and keep pumping/treatment as separate inputs. Internal circulation is not abstraction and the same resource cannot also be a tap-water purchase."
      unit: "m3"
      frequency: "each metered interval and batch"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable abstracted water volume / accepted machines of the same configuration"
      quality_evidence: "meter; source/site; stage water balance"
    - protocol_id: cp_test_load
      process_id: "factory_test"
      flow_role: "specific dry cotton test cloth"
      record_type: "reuse/replacement ledger and weighing"
      raw_fields: "cotton cloth design; dry mass; wet-load states; reuse; replaced mass; served test orders; accepted count"
      collection_method: "Measure actual replacement of the specified reusable dry cotton cloth and allocate to served orders using actual reuse records. Track wet-load water separately. Do not count a full reusable load as consumed per unit, do not include cloth in M, and do not infer replacement from rated dry-linen capacity."
      unit: "kg"
      frequency: "each actual loaded-test/replacement period"
      temporal_coverage: "same declared production period; gaps disclosed"
      site_scope: "declared manufacturing site"
      aggregation_rule: "attributable replacement cloth mass / accepted machines of the same configuration"
      quality_evidence: "dry weighing; cloth identity; reuse and served-order ledger"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "all inventory rows"
      requirement: "Use the same configuration, period and accepted count for positive measured M and exchange numerators. Verify every module rating basis, stack completeness, supplier subparts and make-or-buy. Reconcile actual stock, retained lubricant, water/test-cloth reuse, drain, rejects/retests and WIP; retain uncertainty."
      evidence: "cp_configuration; cp_mass; cp_parts; cp_material; cp_test_load"
    - id: quality_coverage
      applies_to: "inventory_and_links"
      requirement: "Disclose missing BOM/route items, UUIDs, measurements and supplier/transport/treatment links. Actual route evidence establishes optional stages and exclusions. No universal alloy, mass, capacity-to-mass, manufacturing yield, test cycle, lifetime or emission factor."
      evidence: "cp_configuration; cp_energy; cp_waste; cp_emission; cp_water_resource"
    - id: quality_sources
      applies_to: "design_evidence"
      requirement: "Electrolux2022.10.07 and Speed Queen AO22-0021©2022 are historical manufacturer examples. General/special-fabric capacities, alternative heating interfaces, operating quantities and net/shipping weights vary by model and condition; none supplies factory quantities, measured M, material grade, lifespan or universally mandatory operations. Verify actual design and foreground data."
      evidence: "electrolux-lagoon-2022; speedqueen-stack-2022"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference_flow"
    rule: "Require each included functional module dry-linen rating above10kg on its declared basis and one positive measured complete-machine M with actual installed options/retained lubrication. Stack mass is counted once. Reference output is1kg; all other rows explicitly normalize kg, MJ or m3 numerators using normalize_mass."
    source_ids: []
  - rule_id: validation_bom
    applies_to: "inventory"
    rule: "Check actual drum/tub/frame, drive/suspension, water/drain or air/heating circuit, doors/controls and all installed options against the configured BOM. Verify purchased internals, local/outsourced routes, test reuse/drain, rejects/retests and receiver gates. Expand initial cards for actual completeness before any full boundary claim."
    source_ids: []
  - rule_id: validation_identity
    applies_to: "all inventory rows"
    rule: "Check public type, delivery grade/concentration/state/completeness, route/geography, actual reference property/unit group and official localized names. Groundwater resource is not purchased water or wastewater; contained exported solution is not direct environmental discharge; immediate unspecified-air water vapour is not long-term air or liquid water. Energy/area cannot identify total component mass."
    source_ids: []
  - rule_id: validation_claims
    applies_to: "dataset_claims"
    rule: "No complete cradle-to-gate claim without actual route and linked supplier/transport/treatment coverage. Manufacturing mass cannot establish laundry-service equivalence, energy efficiency, life, regulatory conformity or methodology approval. Independent scientific review remains required."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured foreground commercial laundry-machine manufacturing module; heading does not assert publication"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same complete configuration manufacturing scaled by measured M with separately declared upstream/transport/treatment links"
  excluded_use: "Customer laundry service, textile output, use-phase water/detergent/energy, lifetime, dry-cleaning/gas/steam/heat-pump routes or methodology approval"
  required_metadata: "All reference qualifiers; each module rating basis; complete BOM/options; supply completeness and make-or-buy; actual M and drained/dried state; stack whole-unit boundary; acceptance/test plan; site/period/gates; actual exchanges, allocation, reuse/drain and linked suppliers/receivers"
  required_quality_disclosure: "Missing identities/measurements/links, route coverage, uncertainty, causal allocation, actual rejects/retests, historical-source limitations"
  update_trigger: "Module/configuration/capacity-rating basis, heating/ventilation or water circuit, drive/suspension/control, supplier completeness, material recipe, make-or-buy, acceptance/test plan, site/period, reuse or allocation change"
