system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "manufacturing"
      rule: "Include receipt inspection and actual sheet cutting/punching, drum perforating/forming, joining, interface machining, grinding/cleaning/finishing, mechanical/water/electrical integration, balancing/alignment, actual factory acceptance, attributable rejects/rework and protection. In-house casting, motor winding, heat treatment or polymer manufacture cannot be inferred from bought parts; an actual local route requires expanded atomic inputs/outputs. No universal stainless grade or coating route."
      source_ids: []
    - rule_id: boundary_bom
      applies_to: "inventory"
      rule: "Crosswalk each actual BOM item/operation to one atomic exchange or justified exclusion. Expand separately supplied shafts, pulleys, dampers, springs, door/glazing/seals, valves, pump, drains/hoses, lint filter, heating assembly, thermostat, sensors, electronics/wiring, insulation, fasteners and installed dispensing options where present. Do not duplicate purchased panel, blower or drive internals. Each actual design, alloy, chemical concentration and waste is separate; initial cards are not a complete universal BOM."
      source_ids: []
    - rule_id: boundary_test
      applies_to: "factory_test"
      rule: "Use actual model-specific inspection and acceptance records for drum balance/alignment, electrical/control/interlocks, water fill/leak/drain or dryer airflow/heating. A loaded washing/drying cycle is included only when actually performed. Record duration, load/fabric, inlet conditions, result, retests, water reuse/drain and electric meters; no prescribed full cycle, detergent dose or test-cloth replacement rate. Customer operating data do not supply factory quantities."
      source_ids:
        - electrolux-lagoon-2022
        - speedqueen-stack-2022
    - rule_id: boundary_semantic
      applies_to: "reference_product"
      rule: "Existing commercial warewashing PCR owns tableware, not textiles. Existing industrial fans/centrifuges PCR excludes clothes dryers and may describe separately bought blower components. Heat-pump equipment has a distinct delivered unit and this route excludes heat-pump dryers. Keep the old classification scaffold/id read-only; this semantic identity asserts no mapping acceptance."
      source_ids: []
