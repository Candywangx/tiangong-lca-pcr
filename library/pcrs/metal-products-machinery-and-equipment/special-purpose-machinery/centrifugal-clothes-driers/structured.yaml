product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.special-purpose-machinery.centrifugal-clothes-driers"
  classification_refs: "CPC 3.0 44911"
  covered_products: "Complete standalone household or commercial/industrial centrifugal clothes extractors"
  excluded_products: "Integrated washing functions, heated drying devices, unrelated centrifuges and parts"
  representative_product: "One configured accepted basket extractor with supplied motor, enclosure, drive, suspension, controls and safety system"
  production_route: "Purchased-subassembly assembly or actual conditional site fabrication, finish and motor production, followed by factory tests and dispatch"
  market_state: "Finished tested complete device at manufacturer gate; installation foundations and downstream laundry operation separate"
functional_unit:
  what: "Supply a complete standalone clothes-water extraction device"
  how_much: "Manufacturing inventory per 1 kg accepted net device mass"
  how_well: "Actual specified dry-laundry capacity, spin speed, imbalance/safety and drain acceptance; no universal moisture performance"
  how_long_or_cycle: "One manufacturing reporting period through accepted gate; service life and subsequent spin cycles are separate study parameters"
  reference_flow_link: "finished"
system_boundary:
  rules:
    - rule_id: gate
      applies_to: "foreground"
      rule: "Include actual delivered-input receipt through fabrication, finish, motor make when present, assembly, balancing/acceptance, rework, rejects, residual utilities and packing before release."
      source_ids: []
    - rule_id: make_buy
      applies_to: "component state"
      rule: "Each bought motor, drum, shaft, bearing housing, drive or control carries completed upstream production once; do not add embedded metals, resin, copper, oil or component-factory energy again. Site make instead uses actual raw inputs and stages; paired internal part transfers cancel but processing burdens remain."
      source_ids: []
    - rule_id: factory_test
      applies_to: "testing"
      rule: "Include electricity, actual consumed cloth/water, pneumatic-lock compressor load and rejects from the actual factory spin, vibration, lid-lock, braking, electrical and drain/leak plan. Model raw wet-cloth moisture and retained returns; consumer instructions demonstrate function, not a mandatory factory test recipe."
      source_ids:
        - thomas-instructions
        - ifb-inc100
    - rule_id: downstream
      applies_to: "later use"
      rule: "Exclude customer laundry electricity, washing detergent/water, subsequent tumble drying, operation replacements, installation concrete and end of life from the manufacturing foreground; retain separate downstream links when study requires them. No heated drying process is inferred from the word drier."
      source_ids:
        - un-cpc-3-0
        - thomas-centri
    - rule_id: route_audit
      applies_to: "specific exchanges"
      rule: "Each card is conditional on documented recipe/BOM, not a universal materials basket. Add every actual alloy, polymer, purchased part, utility, formulation constituent, packaging, treatment and emission as its own exchange. not_applicable requires absence evidence; unknown never equals zero. External transport and upstream/treatment links remain explicit."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual delivered sheet, finished parts, motor, drive, control and packaging at documented supplier processing states"
  starting_condition_role: "Foreground primary-production receipt boundary"
  product_classification_scope: "Standalone centrifugal clothes-water extraction; household size alone does not make it a washer or heated dryer"
  recursive_input_rule: "Same-category bought complete device for actual refurbishment uses its delivered-state dataset once and a separately declared refurbishment gate; never represent new production by recursively purchasing itself"
  upstream_dataset_requirement: "Exact material, completed operations, component interface, geography/period and voltage; missing providers disclosed"
  disclosure: "Complete BOM/make-buy matrix, delivered configuration, test plan, net output period, allocation, upstream transport/treatment and missing data"
