allocation_rules:
  - rule_id: subdivide
    applies_to: "shared loads"
    rule: "Subdivide by production lot, component state and process submeter first. Allocate only remaining measured residual using demonstrated causal equipment time/load. Do not add a whole factory meter to already charged process/test electricity."
    source_ids: []
  - rule_id: reject_rework
    applies_to: "accepted denominator"
    rule: "Retain actual setup, rework, rejected-device and test failure burdens in Q; rejected device, scrap and packaging masses do not increase accepted denominator D. Separate configurations and net output periods."
    source_ids: []
  - rule_id: scrap
    applies_to: "recovery/co-products"
    rule: "Internal returns cancel paired physical transfers only; recovery energy remains. Scrap sales do not automatically grant avoided virgin-material credits. For actual co-products first subdivide, then document physical allocation or justify another relationship with sensitivity and compatible upstream treatment."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_air
      process_id: "test"
      flow_role: "externally purchased compressed air"
      record_type: "measurement and ledger"
      raw_fields: "provider; actual volume; temperature; absolute pressure; standard or actual basis; period; Q"
      collection_method: "Meter externally supplied air at documented pressure/temperature and preserve volume convention; do not duplicate in-house compressor electricity."
      unit: "m3"
      frequency: "each lot or matched interval"
      temporal_coverage: "complete same configuration reporting period including rework and rejects"
      site_scope: "declared manufacturer and actual external interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; acceptance; representative assays; provider records; uncertainty"
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "reference output"
      record_type: "measurement and ledger"
      raw_fields: "model; configuration; serial number; calibrated accepted net mass; N accepted; D sum net kg; rejects; tare; dry test state"
      collection_method: "Weigh each accepted complete device on a calibrated scale excluding transport packaging and test moisture; reconcile acceptance ledger and same supplied configuration. Do not substitute rated laundry capacity."
      unit: "kg"
      frequency: "each lot or matched interval"
      temporal_coverage: "complete same configuration reporting period including rework and rejects"
      site_scope: "declared manufacturer and actual external interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; acceptance; representative assays; provider records; uncertainty"
    - protocol_id: cp_material
      process_id: "active_processes"
      flow_role: "one input"
      record_type: "measurement and ledger"
      raw_fields: "component/grade; supplier processing state; make/buy; batch; issued; returned; opening/closing stock; wet/dry; each assay; Q"
      collection_method: "Calibrated weighing and actual BOM/recipe issue records, linked supplier evidence; bought completed parts versus site raw inputs are disjoint."
      unit: "kg"
      frequency: "each lot or matched interval"
      temporal_coverage: "complete same configuration reporting period including rework and rejects"
      site_scope: "declared manufacturer and actual external interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; acceptance; representative assays; provider records; uncertainty"
    - protocol_id: cp_energy
      process_id: "active_processes_shared"
      flow_role: "each utility"
      record_type: "measurement and ledger"
      raw_fields: "meter; period; stage; imported kWh; on-site generation; exported test regeneration; storage change; submeter allocations; residual driver; fuel kg and NCV; Q"
      collection_method: "Matched interval calibrated meters and bills; measure motor/test/compressor load before shared residual. Keep purchased supply versus on-site generation separate. Match fuel measurement to oven tests."
      unit: "MJ"
      frequency: "each lot or matched interval"
      temporal_coverage: "complete same configuration reporting period including rework and rejects"
      site_scope: "declared manufacturer and actual external interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; acceptance; representative assays; provider records; uncertainty"
    - protocol_id: cp_water
      process_id: "finish_test"
      flow_role: "water balance"
      record_type: "measurement and ledger"
      raw_fields: "supply; added water; input/test-cloth moisture; wet/dry mass; stock change; evaporation; discharge; reaction water; retained product water; paired recycle; Q"
      collection_method: "Meter supplied water and weigh wet/dry test cloth; sample moisture, meter effluent and account stock/return transfers. Volume-to-mass conversion uses actual temperature/density."
      unit: "kg"
      frequency: "each lot or matched interval"
      temporal_coverage: "complete same configuration reporting period including rework and rejects"
      site_scope: "declared manufacturer and actual external interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; acceptance; representative assays; provider records; uncertainty"
    - protocol_id: cp_waste
      process_id: "active_processes"
      flow_role: "one waste"
      record_type: "measurement and ledger"
      raw_fields: "stream; receiver; gross/tare/net; water fraction; each separate metal/species assay; stocks; internal returns; Q"
      collection_method: "Segregated calibrated weighing with representative wet/dry and species assays plus destination/treatment receipts."
      unit: "kg"
      frequency: "each lot or matched interval"
      temporal_coverage: "complete same configuration reporting period including rework and rejects"
      site_scope: "declared manufacturer and actual external interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; acceptance; representative assays; provider records; uncertainty"
    - protocol_id: cp_emission
      process_id: "release_points"
      flow_role: "one species and compartment"
      record_type: "measurement and ledger"
      raw_fields: "species; compartment; post-control concentration; air/water flow; duration; assay; capture; recovery/destruction; detection limit; uncertainty; Q"
      collection_method: "Representative post-control monitoring or documented species-specific model with flow/time and actual operating/abatement conditions; no invented balance-closing release."
      unit: "kg"
      frequency: "each lot or matched interval"
      temporal_coverage: "complete same configuration reporting period including rework and rejects"
      site_scope: "declared manufacturer and actual external interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; acceptance; representative assays; provider records; uncertainty"
    - protocol_id: cp_pack
      process_id: "dispatch"
      flow_role: "each package"
      record_type: "measurement and ledger"
      raw_fields: "material; component net mass; dispatch count; reusable stock; returns; actual trips; replacement; Q"
      collection_method: "Weigh each packaging component, reconcile issue/return and dispatch; packaging never enters device denominator."
      unit: "kg"
      frequency: "each lot or matched interval"
      temporal_coverage: "complete same configuration reporting period including rework and rejects"
      site_scope: "declared manufacturer and actual external interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; acceptance; representative assays; provider records; uncertainty"
  calculation_rules:
    - id: normalize
      applies_to: "all inventory rows"
      rule: "Each attributable external period quantity Q is divided by calibrated accepted net device mass D of the same configuration and period; retain the numerator physical unit and direction. Finished output is 1 kg."
      inputs:
        - cp_mass
        - cp_material
        - cp_energy
        - cp_air
        - cp_water
        - cp_waste
        - cp_emission
        - cp_pack
      output: "amount per 1 kg reference flow"
      source_ids: []
    - id: water_close
      applies_to: "physical water terms"
      rule: "Supplied water + incoming material/cloth moisture + opening stock + reaction water formed + incoming internal returns = discharged water + evaporated water + product/cloth retained water + closing stock + reaction water consumed + outgoing internal returns. Cancel only paired return terms. Investigate residual against combined measurement/sampling/allocation uncertainty; no fixed tolerance."
      inputs:
        - cp_water
        - cp_mass
        - cp_material
        - cp_waste
        - cp_emission
      output: "water residual and uncertainty"
      source_ids: []
    - id: metal_close
      applies_to: "each contained metal"
      rule: "For each separate Fe, Cr, Ni, Zn, Cu and other actual element, multiply each input/product/scrap/chip/sludge/wastewater/release/stock term by its OWN matched assay and wet/dry conversion. Include reaction transformations and paired returns. Total alloy mass cannot close an elemental balance; investigate uncertainty, do not invent emissions."
      inputs:
        - cp_material
        - cp_mass
        - cp_waste
        - cp_emission
      output: "each elemental residual"
      source_ids: []
    - id: solvent_close
      applies_to: "each solvent species"
      rule: "Opening solvent + actual inputs + incoming internal return = retained product + closing solvent + recovered outgoing solvent + solvent in capture media + measured destruction + wastewater/non-air residue + uncaptured air release + outgoing internal return. Every term has its own species assay; paired returns cancel. Actual destruction is not air release. Investigate combined uncertainty before using residual."
      inputs:
        - cp_material
        - cp_waste
        - cp_emission
      output: "species solvent residual"
      source_ids: []
    - id: utility_residual
      applies_to: "metered utility site period"
      rule: "In identical units and intervals reconcile purchased imports + actual on-site generation + storage withdrawals against assigned fabrication/finish/motor/assembly/test/dispatch loads + unassigned shared residual + exports + storage charging and verified delivery losses. Meter factory-test regeneration separately. Negative residual requires interval/unit/calibration and combined uncertainty investigation, never clipping to zero. Allocate ONLY residual; compressor tests are included once."
      inputs:
        - cp_energy
      output: "reconciled residual allocation"
      source_ids: []
    - id: combustion
      applies_to: "fuel species"
      rule: "Fuel carbon accounting can constrain fossil CO2 using actual composition, oxidation and retained carbon; it cannot establish CO, NO or NO2. Each emission requires matched technology/control concentration or a valid independent species-specific factor; total NOx convention is separately disclosed."
      inputs:
        - cp_energy
        - cp_emission
      output: "verified species release"
      source_ids: []
    - id: transfer_cancel
      applies_to: "internal parts and returns"
      rule: "Match quantity, configuration, lot, state and opening/closing work-in-progress across both sides of each internal transfer; cancel only paired transfers while retaining all actual extra processing energy, rejects and external wastes."
      inputs:
        - cp_material
        - cp_mass
        - cp_water
        - cp_waste
      output: "no duplicate burden"
      source_ids: []
  data_quality_requirements:
    - id: configuration
      applies_to: "device"
      requirement: "Actual model/delivered BOM and drive/suspension/safety drawing override marketing conflicts; do not extrapolate one industrial or household recipe."
      evidence: "drawings; nameplates; acceptance"
    - id: period
      applies_to: "all exchanges"
      requirement: "Complete common period, setup, idle, test, rework/reject and stocks; disjoint assigned utilities and causal residual allocation."
      evidence: "meter/lot reconciliation"
    - id: uncertainty
      applies_to: "physical quantities"
      requirement: "Retain calibration, representative moisture/species sampling, detection limits and allocation uncertainty. No empirical unit mass, yield, energy, lifetime or emission range is supplied."
      evidence: "measurement and laboratory records"
    - id: links
      applies_to: "upstream and treatment"
      requirement: "Resolve actual provider technology, delivered processing state, geography and treatment separately; a flow UUID is not an upstream footprint."
      evidence: "supplier and treatment receipts"
validation_rules:
  - rule_id: identity
    applies_to: "reference product"
    rule: "Require standalone clothes-water extraction, every qualifier, complete delivered device and correct reference link; distinguish household laundry capacity from net device mass and washing/heated-drying categories."
    source_ids: []
  - rule_id: denominator
    applies_to: "all inventory"
    rule: "Require positive N and D from calibrated accepted same-configuration records, verify Q includes rework/reject, and q_ref = Q/D = (Q/N)/(D/N); reject package/test-water/reject mass or cross-configuration means."
    source_ids: []
  - rule_id: buy_once
    applies_to: "component state"
    rule: "Verify every completed purchased motor/drum/control and embedded materials/upstream burdens once; actual site-made components activate full recipes and stages; match paired transfers."
    source_ids: []
  - rule_id: balances
    applies_to: "physical water, metal and solvent"
    rule: "Execute water_close, metal_close and solvent_close for applicable records including all stocks, reactions, wet/dry and own-term assays plus paired returns. Explain residual against actual combined uncertainty, not an arbitrary universal tolerance or invented loss."
    source_ids: []
  - rule_id: utilities
    applies_to: "site meters"
    rule: "Execute utility_residual with same site interval/unit and disjoint test/process loads; imports, generation, exports/regeneration and storage must reconcile. Reject whole-factory-plus-submeter double charge and unexplained negative residual."
    source_ids: []
  - rule_id: species
    applies_to: "actual emissions"
    rule: "Captured material is waste, not emitted metal; separate actual species and receiving compartment. CO/NO/NO2 require their own evidence; solvent destruction and recovery differ from air release."
    source_ids: []
  - rule_id: coverage
    applies_to: "data package"
    rule: "Report accepted input, checks performed/skipped, findings and completeness; unknown UUID/provider/amount is incomplete, not zero. Conditional absence needs actual BOM/test evidence. Resolve all applicable additional exchange gaps before unqualified secondary use."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground primary unit-process data package for one complete configured extractor through manufacturer gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing input to the same delivered device with reviewed upstream/treatment links; later use model separately"
  excluded_use: "Standalone complete cradle-to-gate claim with missing providers; functional laundry equivalence, default lifetime or operating savings; washer/heated-dryer substitution"
  required_metadata: "All qualifiers; factory period and N/D/Q; make/buy; active/absent routes; acceptance/test load; measured utility reconciliation; supplier/transport/treatment links; allocation and source editions"
  required_quality_disclosure: "UUID/provider and recipe gaps; source conflict; no empirical ranges; measured uncertainty; skipped/inconclusive checks; absence evidence and substitutions"
  update_trigger: "Changed model/BOM, motor/drive/suspension/safety, materials/finish, make/buy, acceptance, site utility, calibration, allocation or supplier state"
data_sources:
  - id: "un-cpc3-notes"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0 explanatory notes, 30 June2025, pp.239 and241. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Current original44812 household washing/drying and44911 centrifugal title only; household individual assignment requires actual classification review."
  - id: "wco-hs2022-84"
    type: "official_guidance"
    reference: "WCO HS Nomenclature 2022, Chapter84 note2 and headings8421/8450/8451, PDF pp.1,9,19–20. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/1684_2022e.pdf?la=en"
    used_for: "Primary nomenclature distinguishes centrifugal dryers from built-in washing/drying; not a current CPC3 crosswalk or individual device ruling."
  - id: "un-cpc-3-0"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 structure, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "44911 centrifugal category; neighboring 44622 laundry machines and 44812 household washing/drying. Labels support scope comparison, not a manufacturing recipe."
  - id: "thomas-centri"
    type: "handbook"
    reference: "Robert Thomas, CENTRI 776 SEK, original product page, accessed 2026-10-02. https://thomas-germany.com/en-uk/THOMAS-Spin-dryer-CENTRI-776-SEK/"
    used_for: "Household standalone stainless drum, safety lid/one-hand control, device versus boxed mass distinction; no numeric mass or operating intensity adopted."
  - id: "thomas-instructions"
    type: "handbook"
    reference: "Robert Thomas, CENTRI instructions 188417, English pp.9–10. https://thomas-germany.com/media/8f/46/d4/1734441270/188417%20%281%29.pdf"
    used_for: "Water spout, wet-cloth loading, lid stop safeguard and flexible motor/drum suspension; user operation does not prove factory test recipe."
  - id: "fabcare-extractor"
    type: "handbook"
    reference: "Fabcare, Hydro Extractor (Direct Drive), original description, accessed 2026-10-02. https://fabcare.com/shop/hydro-extractor/hydro-extractordirect-drive/"
    used_for: "Industrial clothes extractor, 304 basket/drum, galvanized base, self-balancing, timed DC-injection/direct-drive variant; no default laundry capacity or energy."
  - id: "swastik-extractor"
    type: "handbook"
    reference: "Swastik, Hydro Extractors, scanned original PDF p.2. https://www.swastiktextile.com/Download%20Catalogue/hydro_extractor.pdf"
    used_for: "Stainless basket/housing, cast-iron bearing housing, steel shaft/springs, roller/thrust bearings and VFD; counterexample to universal brake/clutch, optional loading device and mains regeneration. No empirical factory factors."
  - id: "ifb-inc100"
    type: "handbook"
    reference: "IFB Industries, INC100 Hydro Extractor, construction and safety specifications, accessed 2026-10-02. https://www.ifbappliances.com/inc-100"
    used_for: "Industrial stainless construction, casting frame, three-phase motor, pneumatic lock, timer and safety switch; non-coaxial headline conflicts with direct-drive summary so BOM verification required. No example weight or energy default."
