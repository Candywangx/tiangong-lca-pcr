measurement_rules:
  - id: net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Collect using cp_mass: calibrated weighing of accepted complete devices, excluding transport packaging, wet test cloth, retained water and installation foundations; preserve same model/configuration and acceptance record."
  - id: period_basis
    applies_to: "physical exchange normalization"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For the same configuration and period N is accepted units, D is sum of their calibrated net masses, M = D/N, Q is attributable external period quantity including setup, rework and rejected production. q_item = Q/N and q_ref = q_item/M = Q/D. N and D must be positive; no mass mixing across configurations."
  - id: physical_assay
    applies_to: "physical material and chemical species records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Match wet/dry basis, moisture and each individual species/metal assay on every material, stock, product, waste and release term; gross alloy or sludge mass is not contained Fe, Cr or Ni mass. This rule does not assign mass assays to electricity or transport."
  - id: energy_basis
    applies_to: "energy records"
    required_property_ref:
      name: "Delivered energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve measured kWh, convert using 1 kWh = 3.6 MJ. Fuel remains specific kg with measured composition/NCV; regeneration exported during actual factory tests is separately metered, never an assumed use-phase saving."
