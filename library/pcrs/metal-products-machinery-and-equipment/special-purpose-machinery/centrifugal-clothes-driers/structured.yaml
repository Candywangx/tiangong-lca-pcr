allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared factory activities"
    rule: "Prefer product- and operation-specific bills, meters and waste records to separate the drier route from other products before allocating shared burdens."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_physical
    applies_to: "inseparable shared activities"
    rule: "Where subdivision is impossible, use a documented causal physical driver such as measured machine-hours for shared electricity; record numerator, denominator, period and sensitivity. Do not use a fixed category factor."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_scrap
    applies_to: "sheet offcuts"
    rule: "Report actual offcut mass and destination as an outgoing waste flow. Model recycling or disposal in the receiving system and disclose any separate credit method; do not silently net waste against sheet input."
    source_ids:
      - ec-pef-2021
