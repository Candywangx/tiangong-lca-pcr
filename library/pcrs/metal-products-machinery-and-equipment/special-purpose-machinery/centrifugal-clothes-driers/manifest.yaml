review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  boundary_rationale: "Complete stand-alone machines mechanically extract water from clothes by centrifugal rotation. The cited laundry study distinguishes separate centrifugal extractors from integrated washer extraction and thermal tumble drying. Identity/path review found neighboring household and large-textile drying records are empty scaffolds and the material general centrifuge record expressly excludes clothes dryers."
  unresolved:
    inventory_flow_uuids:
      - row_id: drum_stainless_sheet
        reason_code: manual_review_required
        explanation: "Search candidates have conflicting bilingual material names or non-sheet classifications; confirm an exact stainless sheet grade and product state before assigning a UUID."
      - row_id: assembly_ac_electricity
        reason_code: manual_review_required
        explanation: "Three public AC-electricity flows share names, classification and energy unit without a distinguishing grid-voltage or geography qualifier."
      - row_id: drum_steel_offcuts
        reason_code: manual_review_required
        explanation: "Several public ferrous scrap flows are indistinguishable and do not identify the stainless alloy or treatment route of the offcuts."
    range_evidence_needs:
      - row_id: drum_stainless_sheet
        explanation: "Need at least two independent, boundary-compatible complete-machine material records for a defensible sheet-input range; collect actual bill-of-material and issue data meanwhile."
      - row_id: assembly_motor
        explanation: "Need independent comparable motor-mass evidence by machine configuration; collect installed motor mass meanwhile."
      - row_id: assembly_ac_electricity
        explanation: "Need independent comparable factory electricity records normalized to complete accepted machines; meter actual use meanwhile."
      - row_id: drum_steel_offcuts
        explanation: "Need independent comparable fabrication scrap yields for the same sheet route; weigh offcuts meanwhile."
      - row_id: assembly_corrugated_box
        explanation: "Need independent comparable packaged-machine carton masses; collect packing records meanwhile."
