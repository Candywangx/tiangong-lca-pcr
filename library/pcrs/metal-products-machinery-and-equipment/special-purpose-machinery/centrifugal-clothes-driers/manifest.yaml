review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_inventory_uuids: Specific basket, enclosure, drive motor, shaft, bearings, spring/damper, controls, lock, polymer lid, materials, coatings, fluids, wastes, packaging and species require actual direct-read identities; only explicit UUID cards adopted.
  unresolved_provider_links: Generic category reference identifies finished device only; each upstream supplier state, geography/period and treatment provider must be verified. Adopted electricity is conditional CN customer-side <1 kV only.
  unresolved_route_recipe_evidence: Actual alloy/polymer, coating, casting, molding, galvanizing, in-house motor winding and any loading mechanism require site BOM/recipe. Conditional cards do not assert universal recipe.
  unresolved_quantitative_ranges: No empirical mass, yield, factory electricity, emissions, useful life, laundry capacity or use-phase saving is adopted. Collect actual quantities.
  unresolved_factory_test_evidence: Actual factory spin/leak/vibration/safety test plan and consumed cloth/water/air require site records; OEM user instructions support function only.
  unresolved_classification_boundary: Methodology includes physically evidenced standalone household and industrial centrifugal extraction, but no automatic individual household CPC44911 assignment. Current CPC3 names44812 household drying and44911 centrifugal driers without detailed correspondence in reviewed originals. Actual design/principal function/marketed use and authoritative classification review are required; historical CPC2.1-HS correspondence is not current proof.
  source_conflicts: IFB INC100 non-coaxial headline conflicts with direct-drive summary; actual drawing/nameplate determines drive. Swastik VFD variant omits separate mechanical brake/clutch.
  identity_rejections:
    - Dryer mechanical subassembly is incomplete process dryer, not finished clothes extractor.
    - Generic Electric motor 014f80a3-c257-425b-9b75-3e5a18573695 describes conveyor/washing module expert estimate and lacks spin-extractor-specific interface.
    - Stainless-steel search returned unrelated elementary chemical species; none adopted.
    - Source-specific incineration/biomass generation and grid delivery-service flows cannot replace purchased factory power.
