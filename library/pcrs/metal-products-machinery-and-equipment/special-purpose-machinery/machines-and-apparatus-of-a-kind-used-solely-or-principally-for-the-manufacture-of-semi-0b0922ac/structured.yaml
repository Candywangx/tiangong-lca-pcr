allocation_rules:
  - rule_id: allocate_configuration
    applies_to: "foreground_burden_allocation"
    rule: "Separate configurations, fabrication/assembly/test meters and actual accepted outputs first; same-period allocation uses causal measured machine-hours or service demand, never generic catalogue throughput. Include attributable failed trials/rejects/rework in accepted-equipment burdens; paired internal transfers cancel. Recovered sale products and receiver treatment disclose separate allocation without invented avoided burdens."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "accepted configured machine"
      record_type: "foreground_record"
      raw_fields: "model; configuration; serial; calibrated accepted net masses; Naccepted; Dnet; included options/fills"
      collection_method: "Use calibrated traceable weighing of the accepted complete machine and its actual supplied configuration, excluding packaging, extra spare stock, rejects and consumed trials; reconcile accepted ledger and sum net masses within one configuration/period."
      unit: "kg"
      frequency: "each actual batch and matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_materials
      process_id: "fabrication"
      flow_role: "local stock and ingredients"
      record_type: "foreground_record"
      raw_fields: "Qattr; own gross mass/assay/moisture/density; stock; returns; reactions; retained hardware; bath/coat/cleaning route"
      collection_method: "Weigh actual own stock/chemical receipts, use own grade/formulation and each stream assay to reconcile cutting/retention/reaction/recovery/waste stocks and returns; upstream embedded complete-module materials are excluded."
      unit: "kg"
      frequency: "each actual batch and matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_modules
      process_id: "assembly"
      flow_role: "hardware and retained ingredient interfaces"
      record_type: "foreground_record"
      raw_fields: "Qattr; BOM; completion; hardware mass/length; included options/software; separate chemical formula/assay/phase; stock/return/retained fill"
      collection_method: "Hardware branch weighs or measures actual completed received/installed/returned modules and cable lengths, then documents remaining local work; embedded chemical manufacture is upstream once. Chemical-ingredient branch measures each local added gas/fill/flux separately in its own native units, with own composition/moisture/T/P/density, stocks/reactions/retention/returns. Whole module hardware mass never establishes a chemical amount; actual local joining ingredients remain separate."
      unit: "native unit"
      frequency: "each actual batch and matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_tests
      process_id: "test"
      flow_role: "actual acceptance media"
      record_type: "foreground_record"
      raw_fields: "Qattr; test purpose/configuration; trials/repeats/failures; own chemical/gas/substrate purity/phase/provider; amount/stocks/returns; source/deposition/etch/bond/dice/growth load"
      collection_method: "Meter or weigh only observed attributable factory acceptance media and utilities, including failed/repeated tests. Measure each species, retained shipment fill and consumed/recovered/returned media independently. Supplier architecture/media listings provide no factory recipe; customer processing and later maintenance remain outside equipment manufacture."
      unit: "native unit"
      frequency: "each actual batch and matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_utilities
      process_id: "services"
      flow_role: "factory utilities"
      record_type: "foreground_record"
      raw_fields: "Qattr; common-period imports; actual generation; exports; storage; process meters; supply/return state/enthalpy"
      collection_method: "Reconcile common-period imported and actual generated utilities against exports/storage and measured fabrication/assembly/cleanroom/test/dispatch loads; services allocate only unassigned residual. Investigate negative balances without clipping. Gross heat subtracts independently measured return mass times its own enthalpy once on the same datum; net heat never deducts twice. Keep physical water/steam separate from energy and supplier boiler fuel upstream."
      unit: "native unit"
      frequency: "each actual batch and matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_dispatch
      process_id: "dispatch"
      flow_role: "supplied machine and packing"
      record_type: "foreground_record"
      raw_fields: "Qattr; accepted BOM/net mass; packing stock/reuse/returns; supplier/transport; actual included hardware/fill"
      collection_method: "Measure actual supplied configuration net hardware/fill through cp_mass and weigh each packing material separately with own reuse/return basis. No catalogue option, replacement list or customer operating consumable establishes shipment."
      unit: "kg"
      frequency: "each actual batch and matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_wastes
      process_id: "residues"
      flow_role: "actual non-air transfers"
      record_type: "foreground_record"
      raw_fields: "Qattr; weighed transfers; own composition/moisture/species; stock/returns; receiver; treatment route; water fraction/density"
      collection_method: "Measure each actual external waste separately, reconcile own wet/dry/composition stocks/reuse/returns and receiver route; contained metals/fluoride differ from gross waste. Actual wastewater uses its own fraction/density/dissolved/suspended load and discharge interface. Captured/dissolved media remain non-air; external receiver emissions are upstream treatment, not fictional site releases."
      unit: "kg"
      frequency: "each actual batch and matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
    - protocol_id: cp_emissions
      process_id: "residues"
      flow_role: "each observed emitted species"
      record_type: "foreground_record"
      raw_fields: "Qattr; CAS/species/origin/compartment; post-control concentration; matched flow/time; T/P/wet-dry/O2/unit correction; fugitive sampling; control/byproducts"
      collection_method: "Measure actual species after configured controls as concentration times matched gas/liquid flow and same-period time with actual state corrections plus independent fugitives. Actual inlet/deposited/retained/recovered/destruction/scrubber/sludge stocks are independent; catalogue DRE and unexplained residuals never infer air. Molecular NO2 differs from NOx-equivalent; own elemental assay differs from gross oxide/PM and prevents overlap."
      unit: "kg"
      frequency: "each actual batch and matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration and sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original receipts; own assays; acceptance/BOM; uncertainty"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Within one actual configuration/period divide each attributable native-unit exchange total by the sum of calibrated accepted complete-machine net masses; retain raw quantities and uncertainty."
      inputs:
        - Qattr
        - Dnet
        - cp_mass
      output: "native-unit amount per kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_qnd
      applies_to: "all inventory rows"
      requirement: "Same configuration/period Qattr includes attributable stock/assembly/cleanroom/test/reject/rework burdens; Naccepted counts accepted complete machines and Dnet sums their calibrated net masses. Per-machine exchange=Qattr/Naccepted; actual mean net mass=Dnet/Naccepted; per-kg exchange=Qattr/Dnet. Keep native numerator; no catalogue weight, process throughput or trial duration is a default."
      evidence: "same-configuration calibrated weighing and accepted ledger"
    - id: quality_physical
      applies_to: "all inventory rows"
      requirement: "Every element/species term uses its own gross mass, assay, moisture/wet-dry basis, stocks/reactions/retention/returns; alloy/sludge/solution mass differs from contained elements/chemicals. Each water stream uses own water fraction/density at actual temperature, reactions, retained fill, evaporation, discharge and stocks; paired internal returns cancel."
      evidence: "own stream assay/stock/reaction/state measurements"
    - id: quality_solvent
      applies_to: "ipa; acetone; spentipa; ipair; acetair; wastewater"
      requirement: "Reconcile each solvent’s own assays and stock/retained/recovered/captured/destruction/wastewater/spent-media fates against independent actual air measurement. Capture differs from destruction; non-air and unexplained residual cannot become air."
      evidence: "independent fate measurements"
    - id: quality_gases
      applies_to: "all inventory rows"
      requirement: "Each factory-test gas/precursor requires actual CAS/species, phase/purity/provider/container/vaporisation and cylinder/line stock/return records. Own reaction/byproduct retention and wet-scrubber fates are independent of inlet gas or catalogue DRE. Industrial O2/protective N2 are not electronic-grade by default; electronic supply listing is not factory consumption evidence."
      evidence: "actual suppliers/assays/test and control records"
    - id: quality_scope
      applies_to: "reference product"
      requirement: "Retain entire boule/wafer/device/IC/display principal-function boundary and actual supplied hardware/options/software/retained fills. PVA32-inch crucible is a size; its without-magnet weight is not general Dnet. General DI recycling/chillers/pumps/metrology and independently supplied parts require adjacent review."
      evidence: "actual order/BOM and primary technical originals"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Match actual published state100/type/native reference internal ID/property/unitgroup, official bilingual name, full classification/chemistry/grade/phase/provider/geography and elementary origin/compartment. Add every actual unlisted material, chemical gas/fuel/refrigerant/fill, module, blade/filter/resin, transport, waste and emission as an independently queried atomic measured exchange. Unresolved reference/components/chemicals/wastes remain gaps; missing differs from zero and not-applicable requires physical evidence."
      evidence: "own full direct identity and supplier/configuration evidence"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual complete configured machine’s principal semiconductor boule/wafer/device/IC/display manufacturing function and equivalent bilingual one-kg net reference; reject graphite hotzone/Al-Si-Ag mixture, independent utility or customer product as full machinery proxy."
    source_ids:
      - cpc
  - rule_id: validate_makebuy
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual completed supply/configured BOM and local makebuy/cleanroom/test boundary; reject duplicated embedded module manufacture, assumed catalogue fill/options, customer recipes and lifetime consumables as factory burden. Include attributable failed/repeated trials and rework."
    source_ids:
      - cpc
      - pva-cz
      - pva-cgs
      - ulvac-display
      - evg-bond
      - asml-manufacture
      - asml-products
      - asml-euv
      - tel-product
      - oxford-deposition
      - oxford-etch
      - disco-dicer
      - disco-water
      - edwards-atlas
      - edwards-proteus
      - airliquide-gases
      - linde-gases
  - rule_id: validate_balances
    applies_to: "foreground_dataset_conformance"
    rule: "Require own-stream element/water/solvent balances and post-control species concentration × matched flow/time/state plus independent fugitives. Utility common-period imports/actual generation/exports/storage reconcile assigned meters and only unassigned residual; gross heat deducts independent same-datum return once and net heat never twice."
    source_ids: []
  - rule_id: validate_species
    applies_to: "foreground_dataset_conformance"
    rule: "Require molecular NO2 rather than NOx-equivalent, actual Cr(VI) rather than total Cr, own contained metal rather than gross salts/oxides, and non-overlapping PM/element accounting. Prefer individually differentiated Ni/Cu species for applicable LCIA methods. Catalogue DRE and chemistry name cannot establish destruction, supply phase, purity or emitted species; captured/dissolved species stay non-air. Report actual performed/skipped checks, findings and completeness."
    source_ids:
      - edwards-atlas
      - edwards-proteus
