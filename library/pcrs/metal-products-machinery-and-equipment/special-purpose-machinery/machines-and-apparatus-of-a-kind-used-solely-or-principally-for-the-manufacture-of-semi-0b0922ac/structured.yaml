system_boundary:
  rules:
    - rule_id: boundary_makebuy
      applies_to: "foreground_system_boundary"
      rule: "Separate complete bought power/optics/vacuum/robot/control/thermal-field modules from local stock fabrication. Component classification does not establish complete machine identity; a bought partly processed item states remaining work. Embedded module chemicals remain upstream once; local assembly ingredients are separate."
      source_ids:
        - asml-manufacture
        - pva-cz
        - pva-cgs
    - rule_id: boundary_test
      applies_to: "foreground_system_boundary"
      rule: "Include attributable observed manufacture, cleanroom integration, inspection and actual failed/repeated acceptance trials. Separately meter retained shipped fills, consumed/returned test water/gas/chemicals/substrates and customer use. No catalogue recipe, process throughput or stated power × assumed hours establishes factory burden."
      source_ids:
        - asml-manufacture
        - pva-cz
        - linde-gases
    - rule_id: boundary_supply
      applies_to: "foreground_system_boundary"
      rule: "PVA CGS1218 is a semiconductor example; solar-only1000PV requires review. The hotzone is 32-inch crucible capacity, not 32 crucibles; separate hotzone licence/software and included/available/excluded hardware follow actual order. Example 23000kg is without magnet and excludes concrete pedestal. DISCO DAD weight/power are example ratings; blade inclusion is actual receipt-specific. DWR1722 is an independently supplied DI accessory with optional RO and separate chiller water, not automatic complete44918 equipment; no default99.5% recovery or zero wastewater."
      source_ids:
        - pva-cz
        - pva-cgs
        - disco-dicer
        - disco-water
    - rule_id: boundary_gases
      applies_to: "foreground_system_boundary"
      rule: "Air Liquide booklet concerns Research Centres and Universities and Linde lists electronic gases/supply modes. They establish possible chemical identities and supply distinctions, not factory trial adoption or recipe. Actual provider, purity, gas/liquid/solution phase, containers/vaporisation and trial records are required; industrial nitrogen/oxygen cannot automatically replace high-purity electronics gases."
      source_ids:
        - airliquide-gases
        - linde-gases
    - rule_id: boundary_controls
      applies_to: "foreground_system_boundary"
      rule: "Atlas combustion and Proteus plasma are contrasting controls. Proteus does not require hydrocarbon/natural gas; destruction may yield acids captured in wet scrubbers and NOx may occur. Use actual configured control and measured species/byproducts/water/sludge; no catalogue DRE, universal fuel, disappearance assumption or captured-as-destroyed balance."
      source_ids:
        - edwards-atlas
        - edwards-proteus
