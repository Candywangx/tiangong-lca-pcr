        - iza-zinc-sheet-environmental-profile
        - nist-circular-395-zinc-and-alloys
        - unido-techmart-91-zinc-wire
    - rule_id: boundary_upstream_inputs
      applies_to: "Purchased products and energy"
      rule: "Model primary zinc production, purchased recycled material preparation, electricity, natural gas, water and alloying-material production with upstream datasets rather than inside the foreground fabrication process."
      source_ids:
        - iza-zinc-sheet-environmental-profile
    - rule_id: boundary_internal_recycling
      applies_to: "Internal zinc returns"
      rule: "Track internal scrap recirculation as an internal transfer and do not count it as both an external input and an exported waste."
