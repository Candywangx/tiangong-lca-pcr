system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "Foreground system"
      rule: "Include operations from receipt of purchased zinc-bearing and alloying inputs through conforming bare semi-product at the declared fabrication-facility gate."
      source_ids:
        - iza-zinc-sheet-environmental-profile
    - rule_id: boundary_route_selection
      applies_to: "Process inclusion"
      rule: "Include only the casting, rolling, extrusion, drawing, thermal-conditioning, slitting and cutting operations actually used for the declared product route; disclose purchased intermediate stock and omitted operations."
