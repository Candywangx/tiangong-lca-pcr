allocation_rules:
  - rule_id: allocation_subdivide_routes
    applies_to: "Multiple product forms or routes"
    rule: "Prefer subdivision by production line, batch, route and product form. Do not combine rolling, extrusion and drawing into an unlabelled average."
    source_ids: []
  - rule_id: allocation_internal_scrap
    applies_to: "Internally recirculated zinc"
    rule: "Treat internal returns as transfers inside the foreground system: retain their mass in the zinc balance but assign no new upstream zinc burden and no exported-waste credit."
    source_ids: []
  - rule_id: allocation_exported_scrap
    applies_to: "Zinc scrap and dross leaving the boundary"
    rule: "Report physical output and destination separately. Apply substitution, avoided burden or end-of-life credit only when required by the declared LCA method, and disclose the method, quality loss and substituted product."
    source_ids: []
  - rule_id: allocation_shared_energy
    applies_to: "Shared meters and services"
    rule: "Allocate shared electricity, natural gas and water using measured sub-metering where available; otherwise use a documented causal driver such as equipment operating time, throughput and rated load, and test materiality."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "melting_casting"
      flow_role: "Purchased SHG zinc, external zinc scrap and alloying additions"
      record_type: "Weighbridge, batch scale, goods receipt, recipe and certificate record"
      raw_fields: "material identity; supplier; received mass; accepted mass; charge mass; zinc, copper, titanium and aluminium fractions; moisture; contamination; batch id"
      collection_method: "Reconcile accepted receipts and batch charges to inventory movement and supplier certificates"
      unit: "kg; mass fraction"
      frequency: "Each receipt and batch"
      temporal_coverage: "Complete reporting period with opening and closing stock"
      site_scope: "All zinc-semi-product lines inside the facility boundary"
      aggregation_rule: "Sum accepted and charged quantities by material and product batch; calculate elemental content without merging supplier products"
      quality_evidence: "Scale calibration; certificates of analysis; goods receipts; stock reconciliation"
    - protocol_id: cp_energy_meters
      process_id: "melting_casting_forming_finishing"
      flow_role: "Electricity and natural gas"
      record_type: "Revenue meter, process sub-meter and fuel invoice"
      raw_fields: "meter id; opening and closing reading; interval use; gas reference conditions; net calorific value; process assignment; operating hours"
      collection_method: "Prefer process sub-meters; reconcile to facility invoices and allocate residual shared use causally"
      unit: "MJ; m3"
      frequency: "Continuous or monthly"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included equipment and shared services"
      aggregation_rule: "Sum by process and route; convert gas to MJ separately; normalize after reconciliation"
      quality_evidence: "Meter calibration; invoices; allocation workbook; energy balance"
    - protocol_id: cp_internal_stock_transfer
      process_id: "melting_casting_forming_finishing"
      flow_role: "Internal cast-stock output and input"
      record_type: "Production execution and calibrated scale record"
      raw_fields: "batch id; alloy; stock form; transfer mass; timestamp; origin process; receiving process; opening and closing work in progress"
      collection_method: "Match each released cast-stock record to a receiving forming record and reconcile work-in-progress changes"
      unit: "kg"
      frequency: "Each transfer"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included cast and forming lines"
      aggregation_rule: "Sum matched transfers by batch; output minus input shall equal documented work-in-progress change and measured loss"
      quality_evidence: "Scale calibration; batch genealogy; work-in-progress reconciliation"
    - protocol_id: cp_waste_records
      process_id: "melting_casting_forming_finishing"
      flow_role: "Zinc dross and exported zinc scrap"
      record_type: "Calibrated scale, waste manifest and composition test"
      raw_fields: "waste identity; batch; gross and tare mass; net mass; moisture; zinc content; contamination; destination; internal or external disposition"
      collection_method: "Weigh each outgoing stream and keep dross, clean scrap and internal returns separate"
      unit: "kg"
      frequency: "Each movement"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included lines and storage points"
      aggregation_rule: "Sum net dry mass by waste identity, alloy and destination; exclude internal returns from exported waste"
      quality_evidence: "Scale calibration; manifests; laboratory result; receiver record"
    - protocol_id: cp_direct_emissions
      process_id: "melting_casting_forming_finishing"
      flow_role: "Direct fossil carbon dioxide"
      record_type: "Facility emissions register supported by monitoring or accepted fuel-carbon balance"
      raw_fields: "source id; fuel use; carbon content or emission factor; oxidation basis; measured emissions; method; period"
      collection_method: "Use regulated facility method or direct monitoring and assign only onsite-combustion emissions to the applicable foreground process"
