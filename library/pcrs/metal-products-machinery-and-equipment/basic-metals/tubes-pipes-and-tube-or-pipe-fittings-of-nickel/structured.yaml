allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared operations"
    rule: "Prefer subdivision, separate metering, production-order records, or physically traceable consumption so the declared nickel product receives its measured inputs and outputs without allocation."
    source_ids: []
  - rule_id: allocation_shared_services
    applies_to: "unavoidable shared utilities and services"
    rule: "When subdivision is not practicable, allocate shared electricity, fuel, water, and common services using the causal physical driver documented for that operation, such as machine time, furnace occupancy, processed mass, or tested length. Disclose the driver and sensitivity."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "nickel-alloy fabrication scrap"
    rule: "Record scrap mass and destination separately. Do not subtract scrap from feedstock input or credit avoided primary nickel inside the gate-to-gate inventory. If a study applies a recycling allocation or substitution credit, report it outside the uncredited foreground inventory and disclose the method."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_records
      process_id: "integrated_nickel_product_manufacture"
      flow_role: "nickel-bearing feedstock"
      record_type: "weighbridge, scale, goods-receipt, stock, and production-order records"
      raw_fields: "material grade; product form; supplier; lot; gross mass; tare; returned mass; route"
      collection_method: "reconcile calibrated mass records to production orders and inventory movements"
      unit: "kg"
      frequency: "each receipt and production lot"
      temporal_coverage: "representative continuous 12-month period or all lots in a shorter declared campaign"
      site_scope: "all foreground manufacturing operations"
      aggregation_rule: "sum net consumed mass by atomic feedstock row, then normalize by accepted-product mass"
      quality_evidence: "scale calibration; material certificates; purchase and stock reconciliation; lot traceability"
    - protocol_id: cp_electricity_records
      process_id: "integrated_nickel_product_manufacture"
      flow_role: "electricity"
      record_type: "submeter and facility meter records"
      raw_fields: "meter id; opening and closing readings; kWh; production order; allocation driver"
      collection_method: "use submetered consumption first; reconcile to facility totals and document any allocation"
      unit: "kWh and MJ"
      frequency: "each shift or production lot; monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or declared campaign"
      site_scope: "all included equipment and attributable auxiliaries"
      aggregation_rule: "convert kWh to MJ, allocate only unavoidable shared use, and normalize by accepted-product mass"
      quality_evidence: "meter calibration; invoices; reconciliation and allocation worksheet"
    - protocol_id: cp_natural_gas_records
      process_id: "integrated_nickel_product_manufacture"
      flow_role: "natural gas and direct fossil CO2"
      record_type: "gas meter, invoice, fuel analysis, and production records"
      raw_fields: "volume; pressure; temperature; dry or wet basis; carbon content or calorific value; oxidation basis; furnace; production order"
      collection_method: "reconcile meters and invoices; retain the factor source used for direct CO2 calculation"
      unit: "m3 and kg CO2"
      frequency: "each production lot or monthly with production-order allocation"
      temporal_coverage: "representative continuous 12-month period or declared campaign"
      site_scope: "on-site combustion within the foreground boundary"
      aggregation_rule: "correct volume to the declared condition, allocate by causal furnace driver, calculate direct CO2, and normalize by accepted-product mass"
      quality_evidence: "meter calibration; invoices; gas specification; factor document; calculation worksheet"
    - protocol_id: cp_process_water_records
      process_id: "integrated_nickel_product_manufacture"
      flow_role: "process water"
      record_type: "water meters, tank records, and operating logs"
      raw_fields: "inlet volume or mass; return; discharge; density; operation; production order"
      collection_method: "meter make-up and separately metered return; document density conversion where used"
      unit: "kg and m3"
      frequency: "each shift or production lot; monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or declared campaign"
      site_scope: "all included wet operations"
      aggregation_rule: "calculate net boundary-crossing process water and normalize by accepted-product mass"
      quality_evidence: "meter calibration; water balance; density basis; operating log"
    - protocol_id: cp_argon_records
      process_id: "integrated_nickel_product_manufacture"
      flow_role: "industrial argon"
      record_type: "gas meter, cylinder stock, and invoice records"
      raw_fields: "gas identity; purity; cylinder capacity; opening and closing stock; receipts; pressure; temperature; production order"
      collection_method: "meter or reconcile cylinder stock and purchases, excluding other shielding gases"
      unit: "m3"
      frequency: "each production lot; monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or declared campaign"
      site_scope: "welding or protected-atmosphere operations that use argon"
      aggregation_rule: "correct to the declared volume condition and normalize by accepted-product mass"
      quality_evidence: "gas certificate; meter calibration or cylinder reconciliation; invoices"
    - protocol_id: cp_accepted_product_records
      process_id: "integrated_nickel_product_manufacture"
      flow_role: "accepted product"
      record_type: "calibrated scale, production, inspection, and test records"
      raw_fields: "product form; grade; dimensions; route; lot; measured mass; disposition; test status"
      collection_method: "sum only accepted saleable product mass linked to the declared lot"
      unit: "kg"
      frequency: "each production lot"
      temporal_coverage: "all represented lots"
      site_scope: "factory-gate accepted product"
      aggregation_rule: "divide every included exchange by accepted mass and multiply by 1,000 kg"
      quality_evidence: "scale calibration; inspection release; test certificate; lot reconciliation"
    - protocol_id: cp_scrap_records
      process_id: "integrated_nickel_product_manufacture"
      flow_role: "nickel-alloy fabrication scrap"
      record_type: "scrap scales, bins, transfer notes, and disposition records"
      raw_fields: "grade family; source operation; mass; destination; recovery status; lot"
      collection_method: "weigh segregated metallic scrap and prevent mixing with slag or non-nickel waste"
      unit: "kg"
      frequency: "each bin transfer and production lot"
      temporal_coverage: "representative continuous 12-month period or declared campaign"
      site_scope: "all included fabrication and finishing operations"
      aggregation_rule: "sum segregated scrap by grade family and normalize by accepted-product mass"
      quality_evidence: "scale calibration; bin identification; transfer note; mass-balance reconciliation"
    - protocol_id: cp_wastewater_records
      process_id: "integrated_nickel_product_manufacture"
      flow_role: "nickel-bearing process wastewater"
      record_type: "discharge meter, tank, treatment, and laboratory records"
      raw_fields: "volume; source operation; nickel concentration; other declared constituents; treatment; destination; lot"
      collection_method: "meter the separately characterized stream and retain representative analyses"
      unit: "m3"
      frequency: "each discharge or daily total; analysis at the documented compliance frequency"
      temporal_coverage: "representative continuous 12-month period or declared campaign"
      site_scope: "wet operations within the foreground boundary"
      aggregation_rule: "sum only the qualifying stream leaving the boundary and normalize by accepted-product mass"
      quality_evidence: "meter calibration; sampling plan; laboratory report; treatment and discharge record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = lot amount / accepted-product mass × 1,000 kg"
      inputs:
        - "atomic lot amount"
        - "measured accepted-product mass"
      output: "amount per 1,000 kg accepted product"
      source_ids: []
    - id: calc_gas_volume
      applies_to: "natural gas and industrial argon"
      rule: "Convert recorded volume to the declared pressure, temperature, and moisture reference condition before aggregation; retain the conversion inputs and equation."
      inputs:
        - "recorded volume"
        - pressure
        - temperature
        - "moisture basis"
        - "declared reference condition"
      output: "corrected m3"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "direct fossil carbon dioxide"
      rule: "Multiply corrected natural-gas use by the documented carbon-content or emission factor and oxidation basis; exclude upstream supply emissions."
      inputs:
        - "corrected gas use"
        - "factor and unit"
        - "oxidation basis"
      output: "kg fossil CO2 per 1,000 kg accepted product"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "nickel-bearing material balance"
      rule: "Reconcile feedstock mass with accepted product, segregated scrap, returned material, documented stock change, and other individually recorded nickel-bearing outputs. Investigate and disclose unexplained differences."
      inputs:
        - feedstock
        - product
        - scrap
        - returns
        - "stock change"
        - "other nickel-bearing outputs"
      output: "lot-level mass-balance difference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and nickel-bearing material rows"
      requirement: "Preserve product form, grade or UNS designation, specification, dimensions, route, heat-treatment condition, and lot linkage; do not use a generic nickel proxy without disclosure."
      evidence: "material certificates; purchase records; production order; inspection release"
    - id: dq_measurement
      applies_to: "mass, energy, gas, and water records"
      requirement: "Use calibrated meters or reconciled business records, retain unit conversions, and explain allocation of unavoidable shared records."
      evidence: "calibration records; invoices; meter reconciliation; conversion worksheet"
    - id: dq_temporal
      applies_to: "foreground dataset"
      requirement: "Prefer a continuous representative 12-month period. A shorter campaign is allowed only when all represented lots are included and seasonality, maintenance, and start-up effects are disclosed."
      evidence: "dated production, utility, maintenance, and shutdown records"
    - id: dq_completeness
      applies_to: "foreground exchanges"
      requirement: "Reconcile purchase, meter, stock, scrap, wastewater, and emission records. Add actual unlisted exchanges as separate atomic rows and document any cut-off with its quantitative significance."
      evidence: "mass and energy balances; waste manifests; discharge records; completeness checklist"
    - id: dq_source_match
      applies_to: "background datasets"
      requirement: "Match feedstock grade family, product form, recycled-content claim, geography, technology, and delivery boundary; document every proxy and expected bias."
      evidence: "dataset metadata and proxy assessment"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm that the accepted output is a nickel or nickel-alloy tube, pipe, or wrought tube or pipe fitting within the declared scope; verify that grade, form, route, dimensions, condition, test specification, and factory-gate state are present."
    source_ids:
      - unsd-cpc-3-0-structure-2025
      - astm-b161-25
      - astm-b619-b619m-19r23
      - astm-b366-b366m-25
  - rule_id: validate_route
    applies_to: "process model"
    rule: "Confirm that only performed route operations are included and that seamless, welded, and wrought-fitting alternatives have not been combined into one fictitious production route."
    source_ids:
      - astm-b161-25
      - astm-b619-b619m-19r23
      - astm-b366-b366m-25
  - rule_id: validate_reference_amount
    applies_to: "normalized inventory"
