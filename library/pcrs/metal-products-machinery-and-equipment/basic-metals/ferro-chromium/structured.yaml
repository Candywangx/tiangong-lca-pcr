      evidence: "dataset identifiers; supplier specifications; proxy rationale"
    - id: dq_uuid_status
      applies_to: "all inventory rows"
      requirement: "Treat all blank Tiangong UUIDs as unresolved identities; no UUID may be added until hybrid discovery and a public state_code=100 direct read confirm semantic, property, unit, state, geography, and technology suitability."
      evidence: "UUID audit record"
    - id: dq_range_status
      applies_to: "important flows"
      requirement: "Use foreground records without an external numeric QA range until two independent, original-text, boundary-compatible sources support synthesis; retain the manifest evidence need."
      evidence: "source review and range synthesis record"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference_product"
    rule: "Reject a package that omits ferro-chromium grade, chromium and carbon contents, production route, physical form, dry-mass basis, or the link to output_ferrochromium."
    source_ids:
      - cpc-3-0-official-2025
      - samr-gbt-5683-2024
  - rule_id: validation_route
    applies_to: "process_map"
    rule: "Require at least one alloy-production route and every applicable preparation, refining, abatement, and finishing process; reject invented operations and unexplained conditional exclusions."
    source_ids:
      - eu-jrc-nfm-bref-2017
      - us-epa-ap42-ferroalloy-1986
  - rule_id: validation_atomic_inventory
    applies_to: "process_inventory"
    rule: "Require each row to represent one atomic exchange and keep electricity, fuels, water, raw materials, wastes, recovered gas, and each elementary emission separate."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validation_internal_balance
    applies_to: "internal_transfers"
    rule: "Flag unmatched internal transfers of prepared burden, molten alloy, recovered metal, slag, dust, or furnace gas and require an explanation for material-balance differences."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validation_release_control
    applies_to: "emissions_and_residues"
    rule: "Require captured dust and slag to remain explicit and require released CO2, CO, and particulate matter after control to be reported separately when applicable."
    source_ids:
      - eu-jrc-nfm-bref-2017
      - us-epa-ap42-ferroalloy-1986
  - rule_id: validation_allocation
    applies_to: "coproducts_and_waste"
    rule: "Reject duplicate credits for internal recycle and reject undisclosed allocation for exported gas or recovered metal; require waste/product status and destination for slag and dust."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validation_uuid_and_range_gaps
    applies_to: "review_readiness"
    rule: "Keep the PCR in review-required status while UUIDs and independent range evidence remain unresolved; absence of those references does not authorize a proxy UUID or invented range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset that may become a secondary_dataset or background_dataset only after review and publication"
  downstream_use: "Cradle-to-gate product systems requiring ferro-chromium alloy input, including stainless and alloy-steel production when grade and geography are compatible"
  allowed_use: "Use for the declared ferro-chromium grade, route, facility geography, technology, product state, and reporting period; aggregation across sites requires transparent weighting"
  excluded_use: "Chromium metal, silico-chromium as product, other ferro-alloys, secondary-residue recovery without an approved extension, or a grade/route/geography materially different from the dataset"
  required_metadata: "canonical PCR id; CPC context; product grade and composition; route and equipment; furnace closure; off-gas fate; water and slag management; reference-product state; facility geography; period; allocation; background dataset identifiers; unresolved UUID and range status"
  required_quality_disclosure: "meter and scale coverage; moisture and assay methods; monitoring coverage and detection limits; mass-balance difference; internal recycle; conditional-process exclusions; proxy datasets; allocation rationale; review limitations"
  update_trigger: "Change in ore type, reductant, grade, furnace or refining route, furnace closure, off-gas fate, abatement, water loop, slag recovery, allocation, product form, geography, or representative reporting period"
