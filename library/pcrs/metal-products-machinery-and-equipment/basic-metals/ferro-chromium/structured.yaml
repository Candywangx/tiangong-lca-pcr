  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground exchanges"
      rule: "normalized exchange = reporting-period exchange × 1,000 kg / accepted dry marketable ferro-chromium"
      inputs:
        - "exchange amount"
        - "accepted product mass"
        - "product moisture"
      output: "exchange per 1,000 kg net dry product"
      source_ids: []
    - id: calc_dry_product_mass
      applies_to: "reference product"
      rule: "dry product mass = net accepted product mass × (1 − measured free-moisture mass fraction)"
      inputs:
        - "net product mass"
        - "moisture fraction"
      output: "kg dry marketable ferro-chromium"
      source_ids:
        - samr-gbt-5683-2024
    - id: calc_internal_transfer
      applies_to: "internal intermediates"
      rule: "Pair supplying-process output and receiving-process input; aggregated boundary amount is zero for the matched internal transfer, while losses remain explicit"
      inputs:
        - "paired transfer masses"
        - "inventory change"
        - "loss records"
      output: "reconciled internal transfer and unexplained difference"
      source_ids:
        - eu-jrc-nfm-bref-2017
    - id: calc_furnace_gas_energy
      applies_to: "cleaned furnace gas"
      rule: "recovered-gas energy = measured dry gas volume × measured lower heating value"
      inputs:
        - "dry gas volume"
        - "lower heating value"
      output: "MJ recovered furnace gas"
      source_ids:
        - eu-jrc-nfm-bref-2017
    - id: calc_monitored_release
      applies_to: "monitored air emission"
      rule: "released mass = time-integral of pollutant concentration × dry gas flow, with unit and reference-condition conversion"
      inputs:
        - concentration
        - "gas flow"
        - time
        - "reference conditions"
      output: "kg pollutant released"
      source_ids:
        - us-epa-ap42-ferroalloy-1986
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain product specification, lot or campaign, chromium and carbon assays, physical form, size class, and dry-mass basis."
      evidence: "certificate of analysis; sampling and moisture method; dispatch record"
    - id: dq_route_identity
      applies_to: "all processes"
      requirement: "Declare which preparation, furnace, refining, off-gas, water, and slag-recovery configurations operated; explain every conditional process marked not applicable."
      evidence: "process flow diagram; equipment list; campaign log"
    - id: dq_temporal_alignment
      applies_to: "all exchanges"
