allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "multi_process_facility"
    rule: "Prefer physical subdivision and direct metering for burden preparation, smelting, refining, finishing, gas use, dust control, and slag recovery before allocating shared burdens."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_internal_recycle
    applies_to: "internal_recycle"
    rule: "Recycled dust, recovered metal, slag returns, and furnace gas used within the assessed foreground system carry their measured internal transfer and shall not create an additional external product credit or duplicate burden."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_exported_coproduct
    applies_to: "exported_coproducts"
    rule: "For exported recovered metal or cleaned furnace gas, first expand the system when a documented displaced function is supportable; otherwise use a documented physical relationship such as energy content for furnace gas or metal mass for recovered alloy. Do not apply an undisclosed economic allocation."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_waste_status
    applies_to: "slag_and_dust"
    rule: "Treat slag and dust as waste unless the dataset documents product status, destination, and function. Waste treatment burdens remain assigned to ferro-chromium production through the point where the waste-management system accepts the flow."
    source_ids:
      - eu-jrc-nfm-bref-2017
      - us-epa-ap42-ferroalloy-1986
dataset_production:
  collection_protocols:
    - protocol_id: cp_charge_preparation
      process_id: "charge_preparation"
      flow_role: "material, water, fuel, electricity, and prepared burden"
      record_type: "scales, meters, invoices, stock records"
      raw_fields: "opening stock; receipts; closing stock; dry matter; meter readings; prepared burden mass"
      collection_method: "Reconcile calibrated scales and meters to batch and monthly production logs"
      unit: "kg, m3, kWh, MJ"
      frequency: "batch or daily, aggregated monthly"
      temporal_coverage: "at least one representative reporting year or complete campaign"
      site_scope: "all on-site preparation lines serving the product"
      aggregation_rule: "Sum net consumed input and output by line, then normalize to prepared burden and reference product"
      quality_evidence: "calibration records; moisture tests; stock reconciliation; meter coverage"
    - protocol_id: cp_charge_emissions
      process_id: "charge_preparation"
      flow_role: "released particulate matter"
      record_type: "stack tests, continuous monitors, fugitive survey"
      raw_fields: "concentration; dry gas flow; operating time; capture state; fugitive estimate"
      collection_method: "Apply site-approved monitoring method to controlled and quantified fugitive releases"
      unit: "kg, mg/Nm3, Nm3"
      frequency: "monitoring-plan frequency and after material change"
      temporal_coverage: "same period as production records"
      site_scope: "all relevant preparation release points"
      aggregation_rule: "Integrate concentration and flow over operating time and reconcile capture status"
      quality_evidence: "sampling report; detection limits; operating log; control-device status"
    - protocol_id: cp_smelting_inputs
      process_id: "carbothermic_smelting"
      flow_role: "furnace materials, electricity, and cooling-water make-up"
      record_type: "scales, charge sheets, meters, stock records"
      raw_fields: "dry charged mass by material; composition; electricity; make-up water; furnace hours"
      collection_method: "Reconcile charge sheets, calibrated meters, and inventory movements to each furnace campaign"
      unit: "kg, kWh, m3"
      frequency: "batch or shift, aggregated monthly"
      temporal_coverage: "complete campaign and reporting period"
      site_scope: "every furnace producing the declared alloy"
      aggregation_rule: "Sum by furnace and route; exclude internal recirculation; normalize to tapped alloy and reference product"
      quality_evidence: "scale calibration; meter coverage; assays; stock reconciliation"
    - protocol_id: cp_smelting_outputs
      process_id: "carbothermic_smelting"
      flow_role: "tapped alloy, slag, captured dust, and recovered furnace gas"
      record_type: "ladle scales, residue scales, gas meters, gas analysis"
      raw_fields: "tapped metal; slag; dust by destination; dry gas volume; gas composition; heating value"
      collection_method: "Reconcile tapped mass and residue destinations; calculate gas energy from measured volume and heating value"
      unit: "kg, Nm3, MJ"
      frequency: "tap or shift, aggregated monthly"
      temporal_coverage: "same period as furnace inputs"
      site_scope: "furnace, gas cleaning, and residue handling serving the product"
      aggregation_rule: "Sum outputs; reconcile internal transfers and mass-balance differences"
      quality_evidence: "scale calibration; laboratory assays; gas-meter calibration; destination records"
    - protocol_id: cp_smelting_emissions
      process_id: "carbothermic_smelting"
      flow_role: "direct CO2, CO, and particulate releases"
      record_type: "stack and fugitive monitoring plus carbon-balance records"
      raw_fields: "concentration; gas flow; operating time; carbon inputs; exported gas; flare use; capture state"
      collection_method: "Quantify monitored releases; where CO2 uses a carbon balance, retain every carbon input and output term"
      unit: "kg, kg C, mg/Nm3, Nm3"
      frequency: "monitoring-plan frequency, aggregated monthly"
      temporal_coverage: "same period as furnace inputs and outputs"
      site_scope: "all primary and secondary smelting release points"
      aggregation_rule: "Integrate measured releases and reconcile carbon balance without double counting recovered gas"
      quality_evidence: "monitoring reports; calibration; carbon assays; flare and control logs"
    - protocol_id: cp_refining_inputs
      process_id: "medium_low_carbon_refining"
