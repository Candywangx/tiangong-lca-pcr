allocation_rules:
  - rule_id: allocation_avoid_subdivide
    applies_to: "Shared rolling, conditioning, and finishing operations"
    rule: "Prefer lot-, line-, or route-specific metering and subdivision so the declared product bears its measured operations and allocation is avoided."
    source_ids: []
  - rule_id: allocation_recycled_scrap
    applies_to: "Nickel-bearing scrap sent outside the foreground boundary"
    rule: "Report scrap mass, composition, destination, and any revenue separately. Do not subtract an avoided-primary-nickel credit inside the foreground inventory; apply the declared study-wide recycling method downstream."
    source_ids: []
  - rule_id: allocation_shared_utilities
    applies_to: "Utilities that cannot be subdivided"
    rule: "Allocate only the residual shared amount using a documented physical driver such as metered operating time, equipment load, or processed mass; disclose the driver and test sensitivity when it materially affects the result."
