        - "metered kWh"
      output: "Electricity in MJ"
      source_ids: []
    - id: reconcile_nickel_mass
      applies_to: "Each process material balance"
      rule: "nickel-bearing input = intermediate or product output + segregated scrap + other measured nickel-bearing outputs + closing work in process − opening work in process + investigated balance difference"
      inputs:
        - input
        - output
        - scrap
        - "other nickel outputs"
        - "work-in-process change"
      output: "Reconciled mass balance and disclosed difference"
      source_ids: []
    - id: convert_water_volume_to_mass
      applies_to: "Process-water and wastewater rows"
      rule: "mass = measured volume × measured density at the recorded temperature; do not assume density when concentration materially changes it"
