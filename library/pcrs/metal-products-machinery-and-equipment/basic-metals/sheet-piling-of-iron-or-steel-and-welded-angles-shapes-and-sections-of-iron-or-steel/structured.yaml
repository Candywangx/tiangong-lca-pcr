  calculation_rules:
    - id: normalize
      applies_to: "all inventory"
      rule: "q_i = attributed external period amount_i / D; allocation precedes normalization. D excludes repeated rework output."
      inputs:
        - cp_final_product
        - "each cp_i"
      output: "amount per 1 kg reference flow"
      source_ids: []
    - id: element_balance
      applies_to: "steel and coating"
      rule: "For each measured element e: sum external input gross mass_i * measured fraction_e_i + opening element stock = accepted body element + coating element + exported residues element + measured releases element + closing stock. Same-element assays apply to every term; dissolved effluent uses compatible concentration * volume. Report residual against propagated measurement uncertainty; never impose a common Fe/alloy fraction."
      inputs:
        - mass
        - assays
        - stocks
        - "release records"
      output: "Separate elemental closures"
      source_ids: []
    - id: water_balance
      applies_to: "controls"
      rule: "Makeup + opening water stock + reaction-generated water = discharge + evaporation + product/waste carryover + closing stock + reaction-consumed water. Internal recirculation cancels; reconcile water carried by solutions without double counting."
      inputs:
        - meters
        - stock
        - moisture
        - "reaction records"
      output: "Water closure"
      source_ids: []
    - id: chemical_balance
      applies_to: "welding and surface"
      rule: "Close each active chemical/weld-flux/coating component with measured inputs, stocks, reacted/retained mass, recovery and residue. Separate carbon and alloy oxidation, oxygen uptake and gas reaction products; shield-gas CO2 release is distinct from fuel combustion CO2."
      inputs:
        - formulation
        - consumption
        - stock
        - composition
        - "reaction records"
      output: "Component and reaction closures"
      source_ids: []
    - id: coating_conversion
      applies_to: "surface_gate"
      rule: "When coverage is collected by area or length, use measured area/length and actual accepted coated mass; dry retained mass is separately measured. No coating density, thickness, transfer efficiency or weld deposition yield is prescribed."
      inputs:
        - area
        - length
        - mass
        - "coating records"
      output: "Measured conversion to D"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all flows"
      requirement: "Match product/waste/elementary type, property, supply interface, route, formulation, geography and state before assigning UUID; classification code or baseName alone cannot prove identity."
      evidence: "Direct qualified record and supplier documents"
    - id: coverage
      applies_to: "all data"
      requirement: "Same representative period, route and site; trace meters, lot genealogy, offsite work and stocks. Report missing data and uncertainty; absence needs evidence."
      evidence: "Audit and calibration records"
    - id: ranges
      applies_to: "all quantities"
      requirement: "Collect actual foreground amounts. No generic yield, energy, weld consumption, alloy fraction or coating factor. Numeric defaults/guardrails require independent originals with matching route/boundary/unit conditions; unresolved evidence remains a gap."
      evidence: "Primary observations and source applicability review"
validation_rules:
  - rule_id: validate_reference
    applies_to: "final_product"
    rule: "Require D > 0, finite kg and every qualifier; distinguish accepted steel body, weld metal, coating/sealant and packing."
    source_ids: []
  - rule_id: validate_route
    applies_to: "all processes"
    rule: "Verify hot/cold sheet-pile and welded-section modules against records; bypass only completed supplier operations with burden links. Reject installed-service or unqualified-grade substitutions."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "all exchanges"
    rule: "Check gross mass and every measured same-element balance separately, water/chemical/weld-flux/coating closure, stock matching, internal transfers and rework energy; investigate residuals beyond measured uncertainty. Never enforce pure Fe or fixed alloy fractions."
    source_ids: []
  - rule_id: validate_exchange
    applies_to: "inventory"
    rule: "Require atomic exchanges, dimensionally supported units, matched reporting period and explicit supplier/treatment links; keep missing UUIDs or quantities unresolved, not zero or guessed."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Route/grade/surface-qualified product supply inventory and downstream process/lifecyclemodel projection"
  excluded_use: "Installed wall performance or lifetime comparisons; other sections or unqualified grades; generic electricity or unqualified steel substitution"
  required_metadata: "product family and interlock/section geometry; hot-rolled or cold-formed sheet-pile route; welded built-up section route; specification and edition; grade and heat chemistry; thickness and length; delivered net unit mass; weld procedure, filler and shielding system; acceptance tests; coating system and coating mass; supplier feed form and completed upstream operations; site, period, electricity interface and geography"
  required_quality_disclosure: "Site/period/route, measurements, allocation, balances, upstream linkage, uncertainty and unresolved identities/ranges"
  update_trigger: "Grade, geometry, route, weld/coating system, supplier interface or representative period changes"
data_sources:
  - id: "ec-fmp-bref-2022"
    type: "official_guidance"
    reference: "European Commission JRC. Ferrous Metals Processing BREF, 2022, DOI 10.2760/196475. https://doi.org/10.2760/196475"
    used_for: "Section 2.2.1.5, printed pp.47–50 and Figs.2.10/2.13: section and sheet-pile rolling; sections 2.2.17–18: water circuits and residues. General mill facts, no product-specific numeric factors."
  - id: "arcelormittal-cold-piles-2025"
    type: "literature"
    reference: "ArcelorMittal. Manufacturing cold formed sheet piles, 20 January 2025. https://constructalia.arcelormittal.com/en/news_center/2025/01/cold-formed-steel-sheet-piles"
    used_for: "Producer description verifies hot-rolled coil as cold-formed sheet-pile feed; promotional efficiency claims supply no yield range."
  - id: "twi-saw"
    type: "handbook"
    reference: "TWI. What is Submerged-arc Welding? https://www.twi-global.com/technical-knowledge/faqs/faq-what-is-submerged-arc-welding"
    used_for: "Wire/flux/slag and absence of external shielding gas for SAW; no welding quantities prescribed."
  - id: "twi-mag"
    type: "handbook"
    reference: "TWI. What is Gas Metal Arc Welding? https://www.twi-global.com/technical-knowledge/faqs/faq-what-is-mig-mag-welding"
    used_for: "Gas-shielded wire-welding distinction; gas identity/amount remains procedure-specific."
  - id: "epa-fabricated-metal-2021"
    type: "official_guidance"
    reference: "US EPA. Sector AA: Fabricated Metal Products Manufacturing Facilities, EPA 833-F-06-042, February 2021, Table 1 p.2. https://www.epa.gov/sites/default/files/2015-10/documents/sector_aa_fabmetal.pdf"
    used_for: "Independent qualitative cross-check for preparation, painting, galvanizing and waste omissions; broad stormwater-sector scope, not evidence that every product uses every operation."
  - id: "ec-pef-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, consolidated 30 December 2021, section 4.5 pp.87–88. https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX%3A02021H2279-20211230"
    used_for: "Allocation hierarchy; study-specific application and explicit recycling boundary."
