allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "shared processes"
    rule: "First isolate product and route by batch metering/subdivision; where unavoidable allocate by demonstrated physical causation (machine time, weld work, heated load or treated area). Explain other relationships with sensitivity; mass alone is not automatically appropriate across different routes."
    source_ids:
      - ec-pef-2021
  - rule_id: scrap_and_rework
    applies_to: "metal residues"
    rule: "Keep rejects, internal rework, external scrap and actual saleable co-products distinct. Retain waste treatment/transport; no automatic avoided-steel credit inside this foreground package. Declare recycling method and end-of-waste boundary separately for any full LCA."
    source_ids:
      - ec-pef-2021
