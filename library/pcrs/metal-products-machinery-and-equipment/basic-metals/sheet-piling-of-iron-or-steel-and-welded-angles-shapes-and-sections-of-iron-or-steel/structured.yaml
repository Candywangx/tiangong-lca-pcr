        - "batch exchange amount"
        - "accepted net finished mass"
      output: "amount per 1 kg reference flow"
      source_ids: []
    - id: energy_conversion
      applies_to: "hot_electricity_in, cold_electricity_in, weld_electricity_in"
      rule: "If meter records are in kWh, convert at 1 kWh = 3.6 MJ before reporting; do not mix net and gross calorific bases."
      inputs:
        - "meter reading"
        - unit
      output: "MJ"
      source_ids: []
