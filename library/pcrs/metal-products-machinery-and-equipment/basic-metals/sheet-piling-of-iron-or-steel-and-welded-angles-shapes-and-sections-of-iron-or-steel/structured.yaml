measurement_rules:
  - id: reference_mass
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "cp_final_product measures D; each attributable period exchange is divided by D."
  - id: conversion
    applies_to: "all exchanges"
    required_property_ref:
      name: "Row-specific property"
      uuid: ""
    required_unit: "kg; m3; kWh; MJ"
    rule: "Retain raw units and conversion evidence; 1 kWh = 3.6 MJ. Gas volume requires temperature/pressure, purity and density or NCV; wet residue requires moisture and element assays."
  - id: balances
    applies_to: "steel, weld, coating, water and chemicals"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Never sum gross steel kg with contained-Fe kg. For each actual element e, measured gross mass times its own same-element assay defines every feed, weld, steel body, scrap, scale, slag, sludge, effluent, release and opening/closing stock term. Include nonsteel contributions where present; close each element separately. Carbon/alloy-element oxidation, oxygen uptake and water/chemical reactions require separate measured reaction balances; no pure-iron or fixed-alloy conversion. Cancel internal rework but retain repeated energy and consumables."
process_map:
  - id: receipt
    name: "Steel receipt and route preparation"
    inclusion: "required"
    inclusion_condition: "Trace heat/coil/plate identity and actual starting condition; crop or slit only when performed here."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
  - id: hot_pile
    name: "Hot rolling of sheet piling"
    inclusion: "conditional"
    inclusion_condition: "Only hot-rolled sheet piling from bloom/billet/beam blank: reheat, descale, rough and finish with interlock profiles, cool."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
  - id: cold_pile
    name: "Cold forming of sheet piling"
    inclusion: "conditional"
    inclusion_condition: "Only cold-formed sheet piling: uncoil hot-rolled strip, slit if needed, roll-form or bend the declared sheet-pile/interlock shape and cut. Coil hot rolling stays upstream."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
  - id: welding
    name: "Welded-section fabrication and sheet-pile assembly"
    inclusion: "conditional"
    inclusion_condition: "Cut/prepare plate, strip or profiles, fit and tack, weld the built-up angle/shape/section or actual sheet-pile assembly; record SAW, MAG, FCAW or actual procedure, preheat and weld repairs."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
  - id: heat_treatment
    name: "Conditional delivery heat treatment"
    inclusion: "conditional"
    inclusion_condition: "Only actual anneal, normalize, quench/temper or solution treatment required by declared grade/order; record every furnace pass, atmosphere, cooling medium and stock state; no generic treatment cycle."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
  - id: acceptance
    name: "Straightening, machining and acceptance"
    inclusion: "required"
    inclusion_condition: "Straighten, cut to length, drill/punch as ordered, inspect dimensions and interlocks, perform specified mechanical and weld tests, segregate rejects and mark accepted lots."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
  - id: surface_gate
    name: "Declared surface system and dispatch"
    inclusion: "required"
    inclusion_condition: "Record bare state or actual blast/paint/galvanize/sealant treatment before the declared gate, including outsourced work and transport; weigh accepted product separately from packaging."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
  - id: controls
    name: "Water circuits and pollution controls"
    inclusion: "required"
    inclusion_condition: "Record makeup, circulation, blowdown, treatment, captured solids and actual direct releases; allocate shared pumps and extraction once."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
