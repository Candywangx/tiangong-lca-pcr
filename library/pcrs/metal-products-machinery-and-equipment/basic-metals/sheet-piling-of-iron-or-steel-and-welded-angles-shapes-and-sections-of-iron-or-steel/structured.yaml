  - rule_id: allocation_residual
    applies_to: "shared_operations"
    rule: "For inseparable shared burdens, allocate using a verified physical relationship; document the relationship, data and sensitivity."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: scrap_accounting
    applies_to: "steel_scrap"
    rule: "Record mass and destination of exported or internally reused scrap; do not double count internal recirculation as external scrap input or end-of-life credit."
    source_ids:
