validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "The reference output must equal 1,000 kg net conforming uncoated and unpackaged circular-section seamless steel tube, and all required qualifiers must be present."
    source_ids:
      - unsd-cpc-3-0-structure-2025
  - rule_id: validate_process_applicability
    applies_to: "process map"
    rule: "Hot forming must be included. Heat treatment and cold finishing must agree with the declared delivery state, and excluded processes must carry no foreground amounts."
    source_ids:
      - ec-jrc-fmp-bref-2022
  - rule_id: validate_atomic_energy
    applies_to: "furnace and electricity inputs"
    rule: "Natural gas, heavy fuel oil, and alternating-current electricity must remain separate rows; only fuels actually used by the declared process may have amounts."
    source_ids:
      - ec-jrc-fmp-bref-2022
  - rule_id: validate_mass_balance
    applies_to: "each process"
    rule: "Input and output mass records must reconcile after accounting for conforming output, steel scrap, mill scale where applicable, and inventory change; unexplained imbalance requires review."
    source_ids: []
  - rule_id: validate_direct_emissions
    applies_to: "fossil carbon dioxide and nitrogen oxides"
    rule: "Direct furnace emissions must reconcile to site fuel and stack records and must exclude upstream electricity or fuel-supply emissions."
    source_ids:
      - ec-jrc-fmp-bref-2022
  - rule_id: validate_uuid_gaps
    applies_to: "unresolved product flows"
    rule: "Do not replace the unresolved reference product, steel billet, or interprocess tube UUIDs with an excluded sibling, grade-specific proxy, or non-ferrous flow."
    source_ids:
      - unsd-cpc-3-0-structure-2025
published_dataset_profile:
  dataset_role: "Gate-to-gate secondary_dataset or background_dataset for declared circular-section seamless steel tube production"
  downstream_use: "Linked production input for process and lifecyclemodel construction where upstream semi-finished steel and utility datasets are added separately"
  allowed_use: "Studies matching the declared steel grade, dimensions, hot- or cold-finished state, heat-treatment route, furnace fuel, site geography, time period, and uncoated unpackaged factory-gate boundary"
  excluded_use: "Seamless oil or gas line pipe; drilling casing, tubing, or drill pipe; welded, cast, non-circular, coated, packaged, or non-ferrous tube; cradle-to-gate use without upstream links"
  required_metadata: "PCR id and version; product and grade specification; dimensions; delivery condition; process applicability; furnace fuels; input state; geography; technology; period; allocation; upstream dataset links; unresolved UUID disclosure"
  required_quality_disclosure: "Meter and scale coverage; mass-balance closure; stack method; fuel reference conditions; water conversion; missing-data treatment; route and grade coverage; proxy use; recovery destinations"
  update_trigger: "Change in steel grade family, input form or temperature, piercing or rolling technology, heat-treatment or cold-finishing route, furnace fuel, site, reporting period, allocation method, or any material input, waste, emission, or exact UUID evidence"
