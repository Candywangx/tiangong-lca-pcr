validation_rules:
  - rule_id: validate_reference_and_identity
    applies_to: "reference_flow"
    rule: "Confirm that the 1 kg reference output, core/cladding identities, layer mass fractions, product form, bond route, and market state describe one covered semi-manufactured clad-metal product."
    source_ids:
      - un-cpc-3-0-2025
      - china-mof-research-goods-2026
  - rule_id: validate_atomic_inventory
    applies_to: "process_inventory"
    rule: "Confirm that every exchange is one atomic product, waste, or elementary flow; every conditional input is either supported by the declared route or marked not applicable; and every UUID-empty row remains registered unresolved."
    source_ids: []
  - rule_id: validate_metal_balance
    applies_to: "metal_mass_balance"
    rule: "Confirm separate copper and silver input records and reconcile product, composite offcuts, recovered residues, and measured losses for the same lot."
    source_ids: []
  - rule_id: validate_units_and_reference_conditions
    applies_to: "measurement_records"
    rule: "Confirm mass normalization, kWh-to-MJ conversion, gas reference conditions, wastewater density conversion, and pallet reuse calculation from retained raw records."
    source_ids: []
  - rule_id: validate_boundary_and_destinations
    applies_to: "system_boundary"
    rule: "Confirm that upstream supply burdens are linked rather than duplicated; direct on-site combustion is included; and offcuts, spent acid, and wastewater have declared treatment or recovery destinations."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_source_and_period
    applies_to: "data_quality"
    rule: "Confirm that source ids resolve, foreground records cover the declared production period, and any deviation from the representative Ag/Cu route is disclosed."
    source_ids:
      - ding-et-al-ag-cu-2025
      - eu-jrc-nfm-bref-2017
published_dataset_profile:
  dataset_role: "Foreground production dataset for one declared semi-manufactured silver-clad or platinum-clad metal construction"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product carbon footprint, LCA, eco-design, procurement, and downstream fabrication studies when product identity, route, geography, time, and allocation are compatible"
  excluded_use: "Electroplated coatings, finished articles, homogeneous precious-metal alloys, another undeclared core/cladding pair, or a platinum route represented by unmodified Ag/Cu inventory"
  required_metadata: "Core and cladding identity and grade; layer fractions; dimensions; product form; bond and rolling route; annealing atmosphere and schedule; recycled content; facility geography; data period; product yield; utility mix; cleaning route; waste destinations; allocation; packaging and pallet reuse"
  required_quality_disclosure: "Primary-data coverage; meter and scale calibration; metal mass-balance reconciliation; allocation shares; supplier dataset substitutions; unresolved UUIDs; unresolved range evidence; excluded abnormal operations; uncertainty and data gaps"
  update_trigger: "Change in core or cladding metal, layer fraction, bond technology, rolling or annealing route, furnace fuel, protective atmosphere, surface treatment, packaging, scrap recovery, wastewater treatment, supplier mix, facility, or production period that materially affects the inventory"
