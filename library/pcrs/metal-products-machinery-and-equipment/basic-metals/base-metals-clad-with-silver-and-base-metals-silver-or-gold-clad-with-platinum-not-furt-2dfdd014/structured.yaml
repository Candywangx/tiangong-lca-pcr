allocation_rules:
  - rule_id: allocation_avoid_by_lot
    applies_to: "core_cladding_and_product"
    rule: "Avoid allocation by maintaining one lot-level bill of materials for one declared core/cladding construction and by separately metering or calculating its product, offcuts, utilities, and emissions."
    source_ids: []
  - rule_id: allocation_shared_line
    applies_to: "shared_line_inputs"
    rule: "Where a meter serves several products, allocate electricity, gases, water, and line auxiliaries using measured run time and equipment load; use mass throughput only when it represents the physical driver and disclose the sensitivity."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_scrap_recovery
    applies_to: "composite_offcuts"
    rule: "Report composite offcuts as a waste output with measured Ag/Cu composition and destination. Do not credit avoided primary metal inside the foreground inventory; any recycling credit or burden shall be applied consistently in the downstream model and disclosed."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_reusable_packaging
    applies_to: "wooden_pallets"
    rule: "Allocate reusable pallet production by documented expected or observed trips, include losses and non-returns, and report the use-share calculation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_and_packaging_inputs
      process_id: "integrated_ag_cu_clad_strip_line"
      flow_role: "Metal stock, rolling oil, acid, water, film, and pallet inputs"
      record_type: "Weigh tickets, purchase issues, tank or water meters, packaging issue records, and pallet-reuse log"
      raw_fields: "lot_id; flow identity; supplier; metal grade or chemical concentration; gross and tare mass; meter opening and closing; recycled content; pallet trips; timestamp"
      collection_method: "Reconcile accepted receipts and inventory changes to the declared lot; exclude internal recirculation that does not cross the boundary"
      unit: "kg"
      frequency: "Each lot, with monthly inventory reconciliation"
      temporal_coverage: "Complete production campaign and any start-up or changeover assigned to it"
      site_scope: "All equipment and storage supplying the foreground line"
      aggregation_rule: "Sum net boundary-crossing quantity by atomic flow and normalize by conforming product output"
      quality_evidence: "Calibrated scale or meter record, purchase issue, signed material reconciliation, and exception log"
    - protocol_id: cp_energy_and_gas_inputs
      process_id: "integrated_ag_cu_clad_strip_line"
      flow_role: "Electricity, natural gas, nitrogen, and hydrogen"
      record_type: "Utility meters, submeter historian, fuel invoice, and gas flowmeter"
      raw_fields: "lot_id; meter_id; opening and closing reading; unit; voltage; temperature; pressure; dry or wet basis; gas composition or purity; allocation driver; timestamp"
      collection_method: "Use line submeter totals; where shared, apply the declared physical allocation driver and retain both total and allocated values"
      unit: "MJ or m3"
      frequency: "Continuous or per batch, reconciled monthly"
      temporal_coverage: "Complete production campaign including heating, holding, rolling, ventilation, and shutdown energy assigned to the lot"
      site_scope: "Foreground line and directly serving utilities"
      aggregation_rule: "Subtract verified non-production use, allocate shared meters, then normalize by conforming product output"
      quality_evidence: "Meter calibration, historian extract, invoice reconciliation, reference-condition calculation, and allocation worksheet"
    - protocol_id: cp_product_waste_and_water_outputs
      process_id: "integrated_ag_cu_clad_strip_line"
      flow_role: "Product, composite offcuts, spent acid, and cleaning wastewater"
      record_type: "Product scale, scrap scale, acid tank transfer, wastewater meter, laboratory analysis, and transfer manifest"
      raw_fields: "lot_id; stream identity; gross and tare mass or volume; density; Cu and Ag content; pH; acid concentration; destination; timestamp"
      collection_method: "Measure each output at the line boundary and retain separate records for product, composite offcuts, spent acid, and wastewater"
      unit: "kg"
      frequency: "Each lot or each transfer, reconciled monthly"
      temporal_coverage: "Complete production campaign and all waste transfers attributable to it"
      site_scope: "Foreground production line before downstream treatment or recovery"
      aggregation_rule: "Sum each atomic output; convert measured volume using documented density; normalize by net conforming product"
      quality_evidence: "Calibrated records, mass-balance reconciliation, laboratory report, and waste or recovery manifest"
    - protocol_id: cp_fuel_and_direct_emissions
      process_id: "integrated_ag_cu_clad_strip_line"
      flow_role: "Direct fossil carbon dioxide"
      record_type: "Stack measurement or fuel meter plus supplier carbon-content record"
      raw_fields: "lot_id; natural_gas_volume; reference_conditions; fuel_composition; carbon_content; oxidation_basis; measured_stack_co2; timestamp"
      collection_method: "Prefer compliant direct measurement; otherwise calculate fossil CO2 from collected fuel quantity and documented carbon content without including upstream emissions"
