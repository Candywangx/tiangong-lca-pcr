      frequency: "Each lot or reporting period aligned to fuel use"
      temporal_coverage: "Complete campaign including start-up and shutdown combustion allocated to the lot"
      site_scope: "On-site combustion units inside the foreground boundary"
      aggregation_rule: "Calculate or aggregate direct fossil CO2, reconcile to fuel records, and normalize by product output"
