product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.basic-metals.wire-of-copper"
  classification_refs: "CPC 3.0 41513, Wire of copper"
  covered_products: "Uninsulated individual round or profiled wire of copper or copper alloy, in hard-drawn, intermediate, annealed, or soft temper, before stranding or incorporation into a downstream component; metallic surface treatment only when explicitly declared and inventoried"
  excluded_products: "Copper wire rod; stranded, bunched, roped, or cabled conductor; insulated or enamelled wire and cable; winding, cable-core, harness, busbar, photovoltaic-cable, charging-cable, and other downstream assemblies"
  representative_product: "Uncoated bare individual copper wire produced from copper wire rod by drawing, with annealing included when required by the declared temper"
  production_route: "Purchased or transferred copper/copper-alloy wire rod; conditional surface preparation; rod breakdown and intermediate or fine drawing; conditional annealing; cleaning, inspection, spooling, and packaging"
  market_state: "Bare individual wire on coil, reel, or spool at the manufacturing factory gate, before stranding, insulation, or component assembly"
functional_unit:
  what: "Conforming uninsulated individual copper or copper-alloy wire with the declared grade, dimensions, temper, surface state, and manufacturing route"
  how_much: "1,000 kg net mass of conforming wire at the factory gate, excluding reel, spool, and packaging mass"
  how_well: "Meets the declared product specification for composition or purity, dimensions and tolerances, temper, surface condition, and applicable electrical and mechanical properties"
  how_long_or_cycle: "Production during the declared reporting period; no use-phase service is included"
  reference_flow_link: "Factory-gate output of finishing_inspection_and_packaging"
system_boundary:
  rules:
    - rule_id: boundary_start_at_wire_rod
      applies_to: "Foreground starting condition"
      rule: "Start at receipt or internal transfer of copper or copper-alloy wire rod and disclose grade, source facility or supplier, production route, and primary/recycled-content basis where available."
      source_ids:
        - astm-b250-2026
        - asm-copper-wire-cable-1998
    - rule_id: boundary_include_foreground_operations
      applies_to: "Foreground manufacturing"
      rule: "Include surface preparation when used, all drawing passes represented by the dataset, conditional annealing, cleaning, cooling, inspection, spooling, packaging, utilities, auxiliaries, yield losses, wastes, and onsite treatment attributable to the wire."
      source_ids:
        - bechem-wire-drawing
        - asm-copper-wire-cable-1998
    - rule_id: boundary_recursive_wire_input
      applies_to: "Same-category input"
      rule: "If purchased or transferred drawn wire already classified in CPC 41513 is an input, record it as a disclosed product input and do not recursively reproduce its drawing operations in the receiving foreground process."
      source_ids:
        - unsd-cpc-3-0-2025
    - rule_id: boundary_upstream_wire_rod
      applies_to: "Upstream supply"
      rule: "Link wire rod to an upstream dataset matching grade or composition, geography, technology, and declared primary/secondary route; do not substitute a narrow or contradictory identity merely to obtain a UUID."
      source_ids:
        - ica-copper-environmental-profile-2023
        - aoyama-copper-wire-annealing-1989
    - rule_id: boundary_exclude_downstream_products
      applies_to: "Product-category end point"
      rule: "End at uninsulated individual wire before stranding, bunching, cabling, insulation, winding-component fabrication, cable-core manufacture, or harness assembly. Do not extrapolate a bare-wire dataset to these downstream products."
      source_ids:
        - unsd-cpc-3-0-2025
        - astm-b8-2023
        - iec-60228-2023
    - rule_id: boundary_surface_variant
      applies_to: "Surface treatment"
      rule: "Treat uncoated bare wire as representative. Include metallic surface treatment only when explicitly declared and inventoried; exclude polymeric, enamel, or other electrical insulation."
      source_ids:
        - astm-b1-2018
        - astm-b3-2024
boundary_abstraction:
  declared_starting_condition: "copper_or_copper_alloy_wire_rod_at_receipt_or_internal_transfer"
  starting_condition_role: "disclosed_foreground_input_and_upstream_link"
  product_classification_scope: "CPC 3.0 41513, individual wire of copper; ends before CPC 42942 stranded copper products and CPC group 463 insulated wire and cable"
  recursive_input_rule: "A same-category drawn-wire input is recorded as a declared product input with supplier and product qualifiers; its prior drawing is represented only by the linked upstream dataset."
  upstream_dataset_requirement: "Match the rod's grade or composition, source geography, technology, primary/secondary route, and reference period; document any proxy and its expected direction of bias."
  disclosure: "Declare rod supplier or internal source, rod grade and dimensions, cathode/secondary route information where available, surface preparation, drawing sequence, annealing state, surface treatment, and the exact factory gate."
