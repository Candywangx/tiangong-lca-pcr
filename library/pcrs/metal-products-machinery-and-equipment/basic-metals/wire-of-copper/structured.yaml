            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_waste_and_recovery_records
              source_ids:
                - iso-14044-2006
            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Multi-product lines"
    rule: "Prefer submetering, batch records, and subdivision by drawing line, diameter family, alloy, and temper before applying allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_shared_utilities_physical
    applies_to: "Shared electricity, fuel, water, and auxiliaries"
    rule: "Allocate residual shared inputs by a documented physical driver that reflects consumption, such as machine operating time and load, metered line demand, or mass throughput; do not default to revenue."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_internal_scrap_closed_loop
    applies_to: "Internal copper return"
    rule: "Track internally returned copper separately and do not count it as both an external waste output and a new external raw-material input. Include remelting or reprocessing utilities and losses when they occur inside the declared boundary."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_exported_scrap_no_avoided_burden
    applies_to: "Copper scrap leaving the boundary"
    rule: "Report exported scrap by mass, composition, condition, and destination. Do not apply an avoided-burden credit by default; any alternative allocation shall be separately declared and sensitivity-tested."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rework
    applies_to: "Reworked off-specification wire"
    rule: "Assign the additional drawing, annealing, finishing, and handling inputs to the product system that generates the rework, using recorded rework mass and operations."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_rod_input_records
      process_id: "rod_receipt_and_preparation"
      flow_role: "Copper or copper-alloy wire rod"
      record_type: "receiving or internal-transfer record"
      raw_fields: "lot id; supplier or source; grade; composition or purity; diameter; mass; date; primary/recycled-content basis if claimed"
      collection_method: "calibrated scale or weighbridge reconciled to inventory"
      unit: "kg"
      frequency: "per lot or transfer"
      temporal_coverage: "full reporting period"
      site_scope: "all represented wire-production sites"
      aggregation_rule: "sum matching lots; preserve grade and route strata; normalize by conforming output"
      quality_evidence: "scale calibration; lot certificate; supplier declaration; inventory reconciliation"
    - protocol_id: cp_surface_preparation_records
      process_id: "rod_receipt_and_preparation"
      flow_role: "Surface-preparation chemicals and water"
      record_type: "chemical issue, bath, and meter record"
      raw_fields: "substance; concentration where relevant; opening stock; receipts; closing stock; recovery; disposal; water intake; batch or line"
      collection_method: "inventory balance and calibrated meter"
      unit: "kg; m3"
      frequency: "per batch with monthly reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "each represented preparation line"
      aggregation_rule: "calculate net consumption; separate circulation from make-up and discharge"
      quality_evidence: "stock reconciliation; meter calibration; bath log; waste manifest"
    - protocol_id: cp_drawing_energy_records
      process_id: "wire_drawing"
      flow_role: "Drawing electricity"
      record_type: "electricity meter and production log"
      raw_fields: "meter id; opening and closing reading; line; machine state; operating time; wire mass; product family"
      collection_method: "line submeter or documented shared-meter allocation"
      unit: "kWh"
      frequency: "continuous or per shift"
      temporal_coverage: "full reporting period including representative operating states"
      site_scope: "each represented drawing line"
      aggregation_rule: "subtract excluded loads; aggregate by product stratum; normalize by conforming output"
      quality_evidence: "meter calibration; energy bill reconciliation; allocation worksheet"
    - protocol_id: cp_drawing_auxiliary_records
      process_id: "wire_drawing"
      flow_role: "Drawing lubricant, emulsion, and process water"
      record_type: "issue, inventory, bath, and water-meter record"
      raw_fields: "formulation; concentrate; additives; opening stock; receipts; closing stock; recovered quantity; disposal; water intake"
      collection_method: "inventory balance, purchase/issue record, and meter"
      unit: "kg; m3"
      frequency: "per issue or batch with monthly reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "each represented drawing line"
      aggregation_rule: "report net consumption; exclude circulating charge; normalize by conforming output"
      quality_evidence: "inventory reconciliation; formulation data; meter calibration; treatment record"
    - protocol_id: cp_annealing_energy_records
      process_id: "annealing"
      flow_role: "Annealing electricity and fuel"
      record_type: "meter, fuel, and production log"
      raw_fields: "equipment; batch or run; electricity; fuel quantity; calorific value; operating time; wire mass; temper"
      collection_method: "equipment submeter, fuel meter, or documented shared-meter allocation"
      unit: "kWh; MJ"
      frequency: "per batch or continuous run"
      temporal_coverage: "full reporting period including start-up and normal operation"
      site_scope: "each represented annealing unit"
      aggregation_rule: "aggregate by annealing route and temper; normalize by conforming output"
      quality_evidence: "meter calibration; fuel invoice; calorific-value source; allocation worksheet"
    - protocol_id: cp_annealing_auxiliary_records
      process_id: "annealing"
      flow_role: "Protective gas, fluid, and water"
      record_type: "issue, inventory, flow-meter, and treatment record"
      raw_fields: "substance; quantity; opening and closing stock; recovery; discharge; batch or run"
      collection_method: "inventory balance and calibrated flow meter"
      unit: "kg; m3"
      frequency: "per batch or shift with monthly reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "each represented annealing unit"
      aggregation_rule: "report net consumption and discharge by substance; normalize by conforming output"
      quality_evidence: "inventory reconciliation; meter calibration; treatment record"
    - protocol_id: cp_stage_mass_balance_records
      process_id: "rod_receipt_and_preparation_wire_drawing_annealing_finishing_inspection_and_packaging"
      flow_role: "Interstage copper-bearing transfers"
      record_type: "production, coil, reel, and scale record"
      raw_fields: "lot or coil id; input mass; output mass; breaks; end cuts; rejects; internal return; exported scrap; date"
      collection_method: "calibrated scale plus production tracking"
      unit: "kg"
      frequency: "per lot, coil, or batch"
      temporal_coverage: "full reporting period"
      site_scope: "all represented foreground stages"
      aggregation_rule: "reconcile each stage and the total metal balance; preserve rework and internal-return loops"
      quality_evidence: "scale calibration; lot genealogy; production reconciliation"
    - protocol_id: cp_waste_and_recovery_records
      process_id: "rod_receipt_and_preparation_wire_drawing_annealing_finishing_inspection_and_packaging"
      flow_role: "Copper scrap, residues, spent fluid, and wastewater"
      record_type: "waste, recovery, and treatment record"
      raw_fields: "material; mass; moisture basis where relevant; composition; internal return; rework; carrier; destination; treatment"
      collection_method: "calibrated scale, tank balance, manifest, and internal-return ledger"
      unit: "kg"
      frequency: "per movement with monthly reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "all represented foreground stages and onsite treatment"
      aggregation_rule: "aggregate by material and destination; do not net internal return against exported waste"
      quality_evidence: "scale calibration; manifest; treatment invoice; internal-return reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "finishing_inspection_and_packaging"
      flow_role: "Packaging materials"
      record_type: "bill of materials, issue, and purchasing record"
      raw_fields: "material; item type; item mass; quantity; reuse status; product lot"
      collection_method: "measured item mass or supplier specification reconciled to issues"
      unit: "kg"
      frequency: "per product lot with monthly reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "represented packing operations"
      aggregation_rule: "sum packaging by material; exclude from reference-product mass"
      quality_evidence: "bill of materials; supplier specification; issue reconciliation"
    - protocol_id: cp_final_output_and_quality_records
      process_id: "finishing_inspection_and_packaging"
      flow_role: "Conforming copper wire"
      record_type: "final scale, test, and release record"
      raw_fields: "lot or coil id; net wire mass; grade; composition or purity evidence; diameter or area; tolerance; shape; temper; surface state; conductivity or resistivity where specified; mechanical tests where specified; disposition"
      collection_method: "calibrated scale and applicable product test methods"
      unit: "kg"
      frequency: "per released lot or coil"
      temporal_coverage: "full reporting period"
      site_scope: "all represented product families and sites"
      aggregation_rule: "sum only conforming released mass matching declared qualifiers; retain strata"
      quality_evidence: "scale and test-equipment calibration; certificate of analysis; release record"
  calculation_rules:
    - id: normalize_to_reference_output
      applies_to: "All inventory flows"
      rule: "normalized amount = reporting-period flow quantity / reporting-period conforming wire mass × 1,000 kg"
      inputs:
        - "relevant collection protocol"
        - cp_final_output_and_quality_records
      output: "inventory amount per 1,000 kg conforming wire"
      source_ids:
        - iso-14044-2006
    - id: calculate_total_metal_yield
      applies_to: "Total foreground metal balance"
      rule: "total yield = conforming wire mass / gross copper-bearing rod and same-category wire input mass"
      inputs:
        - cp_rod_input_records
        - cp_stage_mass_balance_records
        - cp_final_output_and_quality_records
      output: "dimensionless yield with reporting-period basis"
      source_ids:
        - iso-14044-2006
    - id: reconcile_copper_mass
      applies_to: "Each stage and total foreground system"
      rule: "input copper-bearing mass = conforming and intermediate output + exported scrap + treatment residue + inventory change + documented internal loop adjustment + unresolved variance"
      inputs:
        - cp_rod_input_records
        - cp_stage_mass_balance_records
        - cp_waste_and_recovery_records
        - cp_final_output_and_quality_records
      output: "reconciled mass-balance table and variance"
      source_ids:
        - iso-14044-2006
    - id: calculate_net_auxiliary_use
      applies_to: "Circulating lubricant, emulsion, bath, gas, and water systems"
      rule: "net use = opening inventory + receipts - closing inventory - recovered amount transferred out; report discharge separately and document the balance boundary"
      inputs:
        - cp_surface_preparation_records
        - cp_drawing_auxiliary_records
        - cp_annealing_auxiliary_records
      output: "net auxiliary input and separately reported discharge"
      source_ids:
        - bechem-wire-drawing
    - id: allocate_shared_energy
      applies_to: "Shared energy meter"
      rule: "allocated energy = shared-meter net energy × documented physical driver for the product stratum / total driver over the same meter period"
      inputs:
        - cp_drawing_energy_records
        - cp_annealing_energy_records
      output: "allocated kWh or MJ by product stratum"
      source_ids:
        - iso-14044-2006
    - id: separate_internal_copper_return
      applies_to: "Internal copper scrap loop"
      rule: "record the internal-return mass and associated onsite reprocessing once; exclude the same mass from external waste and external raw-material totals"
      inputs:
        - cp_stage_mass_balance_records
        - cp_waste_and_recovery_records
      output: "internal-loop disclosure and non-double-counted inventory"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and represented strata"
      requirement: "Grade, purity or composition, dimensions, shape, individual-wire state, temper, surface state, and governing specification shall be traceable to released lots."
      evidence: "certificates, lot genealogy, test records, and release records; astm-b1-2018; astm-b3-2024; astm-b250-2026"
    - id: dq_rod_provenance
      applies_to: "Wire-rod input"
      requirement: "Supplier or internal source, grade, dimensions, geography, technology route, and primary/recycled-content basis where claimed shall be documented; proxy gaps shall be disclosed."
      evidence: "receiving records, certificates, supplier declarations, upstream dataset metadata; ica-copper-environmental-profile-2023"
    - id: dq_energy_separation
      applies_to: "Drawing and annealing"
      requirement: "Drawing and annealing energy shall be reported separately. Shared-meter allocation shall retain meter coverage, driver, and reconciliation evidence."
      evidence: "meter records, calibration, production logs, and allocation worksheets"
    - id: dq_auxiliary_coverage
      applies_to: "Lubrication, cleaning, pickling, water, and process gas"
      requirement: "Net consumption and discharge shall be supported by inventory or meter balances, with circulating charge distinguished from consumption."
      evidence: "stock, issue, bath, meter, recovery, and treatment records; bechem-wire-drawing"
    - id: dq_yield_and_scrap
      applies_to: "Copper mass balance"
      requirement: "Conforming output, rework, internal return, exported scrap, residues, and unresolved variance shall be reported without double counting and by destination."
      evidence: "stage balances, scale calibration, manifests, and internal-return ledger"
    - id: dq_temporal_site_coverage
      applies_to: "Dataset reporting period"
      requirement: "Data shall cover the declared period and all represented sites, product families, start-ups, and material operating states; exclusions and abnormal events shall be disclosed."
      evidence: "coverage matrix, production records, maintenance and event logs"
    - id: dq_no_category_extrapolation
      applies_to: "Representativeness claim"
      requirement: "A dataset for one alloy, grade, diameter family, temper, or route shall identify its represented share and shall not claim the whole CPC category without a documented coverage assessment."
      evidence: "production mix and representativeness assessment"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm the Tiangong product-flow, Mass property, Units of mass group, and kg unit; verify all required product qualifiers and the uninsulated individual-wire state are declared."
    source_ids:
      - unsd-cpc-3-0-2025
      - astm-b1-2018
      - astm-b3-2024
      - astm-b250-2026
  - rule_id: validate_reference_mass
    applies_to: "Reference amount"
    rule: "Confirm the reference output is exactly 1,000 kg net conforming wire and excludes reel, spool, pallet, and packaging mass."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_process_energy
    applies_to: "Drawing and conditional annealing"
    rule: "Confirm drawing energy is present and annealing energy is present when annealing occurs; check meter scope, allocation driver, and consistency with production records."
    source_ids:
      - bechem-wire-drawing
  - rule_id: validate_yield_and_scrap
    applies_to: "Metal mass balance"
    rule: "Recalculate stage and total yield; confirm internal return, rework, exported scrap, residues, and unresolved variance are separately visible and not double counted."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_auxiliary_and_waste
    applies_to: "Lubrication, preparation, cooling, and annealing systems"
    rule: "Confirm lubricant or emulsion, cleaning or pickling agents when used, water, process gas when used, spent fluid, wastewater, and treatment routes are recorded on a net-consumption or discharge basis."
    source_ids:
      - bechem-wire-drawing
  - rule_id: validate_boundary_exclusions
    applies_to: "Product scope"
    rule: "Reject use as a category-wide default for stranded or bunched conductor, insulated or enamelled wire and cable, winding components, cable cores, photovoltaic or charging cable, harnesses, and other downstream assemblies."
    source_ids:
      - unsd-cpc-3-0-2025
      - astm-b8-2023
      - iec-60228-2023
  - rule_id: validate_upstream_rod
    applies_to: "Wire-rod dataset"
    rule: "Confirm the upstream rod dataset matches the declared grade/composition, source, geography, technology, and primary/secondary route or that each proxy limitation is disclosed."
    source_ids:
      - ica-copper-environmental-profile-2023
      - aoyama-copper-wire-annealing-1989
  - rule_id: validate_temporal_completeness
    applies_to: "Foreground evidence"
    rule: "Confirm data cover the declared period, represented sites and product strata, and material operating states; flag unexplained omissions or unrepresentative sampling."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "foreground_manufacturing_data_package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Uninsulated individual copper or copper-alloy wire datasets whose grade, composition, dimensions, shape, temper, surface state, rod route, geography, time period, and factory gate match the declared profile"
  excluded_use: "Category-wide default without representativeness evidence; stranded or bunched conductors; insulated or enamelled wire and cable; windings; cable cores; photovoltaic or charging cable; harnesses; downstream assemblies"
  required_metadata: "Reference-flow UUID and amount; grade and governing specification; purity or composition; diameter or area and tolerance; shape; individual-wire state; temper; surface state; rod source and route; primary/recycled-content claim basis; geography; reference period; process coverage; allocation; yield; internal scrap handling"
  required_quality_disclosure: "Collection coverage; meter and scale calibration; shared-resource allocation; copper mass-balance variance; yield; rework and internal return; upstream rod proxy limitations; product-stratum representativeness; omitted and abnormal operations"
  update_trigger: "Material change in grade or alloy family, rod source or route, product dimensions, temper, surface treatment, drawing or annealing technology, energy supply, lubricant or cleaning system, yield, scrap handling, site geography, reporting period, or data quality"
