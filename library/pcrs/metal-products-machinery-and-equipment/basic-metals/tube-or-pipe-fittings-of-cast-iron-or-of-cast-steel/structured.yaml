allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared foundry operations"
    rule: "Prefer process submetering, batch records, and product-family subdivision so the declared fitting receives measured material, energy, waste, and emission quantities without allocation."
    source_ids: []
  - rule_id: allocation_mass_if_unavoidable
    applies_to: "inseparable multi-product operation"
    rule: "If subdivision is infeasible, allocate shared burdens by measured accepted product mass for the same reporting period. Disclose the allocation factor, products included, rejected mass, and a sensitivity result; do not use sale price without a reviewed reason."
    source_ids: []
  - rule_id: allocation_internal_returns
    applies_to: "internal gates, risers, sprues, rejects and reclaimed sand"
    rule: "Carry internal return quantities in the mass balance but assign no external product or waste flow and no avoided-product credit."
    source_ids:
      - us-epa-ap42-gray-iron-foundries-2003
      - us-epa-ap42-steel-foundries-1995
  - rule_id: allocation_outward_recycling
    applies_to: "wastes sent for recycling or recovery"
    rule: "Include collection and on-site preparation up to the site gate. Report the downstream treatment route separately and do not subtract an avoided-production credit from the core factory-gate inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_charge_materials
      process_id: "charge_and_melt"
      flow_role: "purchased metal, alloy, flux and coke inputs"
      record_type: "weigh tickets; purchase and issue records; stock records; batch sheets"
      raw_fields: "material identity; supplier; grade/composition; gross and tare mass; batch; issue date; opening and closing stock; internal-return mass"
      collection_method: "calibrated weighbridge, platform scale, or batch scale reconciled to procurement and stock"
      unit: "kg"
      frequency: "each receipt and furnace batch"
      temporal_coverage: "representative continuous production period, normally at least 12 months or the full campaign if shorter"
      site_scope: "all charge preparation, furnace and ladle areas serving the declared product"
      aggregation_rule: "sum purchased consumption plus opening stock minus closing stock; exclude internal returns; divide by accepted product mass"
      quality_evidence: "calibration records; supplier certificates; stock reconciliation; batch traceability"
    - protocol_id: cp_charge_utilities
      process_id: "charge_and_melt"
      flow_role: "electricity, natural gas and oxygen"
      record_type: "meters; invoices; production logs"
      raw_fields: "meter id; start/end reading; energy or volume; reference conditions; allocation driver; operating hours; product mass"
      collection_method: "process submeter preferred; otherwise documented allocation from reconciled site meter"
      unit: "MJ; m3"
      frequency: "continuous or per batch with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "all charge, melting, holding, ladle and melting-control equipment"
      aggregation_rule: "subtract nonproduction and unrelated loads; apply documented conversion; divide by accepted product mass"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_melt_outputs
      process_id: "charge_and_melt"
      flow_role: "outward slag"
      record_type: "waste weigh tickets; stock records; treatment manifests"
      raw_fields: "waste identity; mass; destination; date; opening/closing stock; on-site reuse"
      collection_method: "calibrated scale and manifest reconciliation"
      unit: "kg"
      frequency: "each shipment with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "all melting and metal-treatment units serving the declared product"
      aggregation_rule: "outward shipments plus closing stock minus opening stock; subtract on-site recirculation; divide by accepted product mass"
      quality_evidence: "scale calibration; manifests; stock reconciliation"
    - protocol_id: cp_melt_emissions
      process_id: "charge_and_melt"
      flow_role: "direct melting emissions"
      record_type: "stack tests; continuous monitors; exhaust-flow records; fuel and carbon analyses; control logs"
      raw_fields: "pollutant species; concentration; dry/wet basis; temperature; pressure; flow; operating time; control status; fuel use; carbon or sulfur content"
      collection_method: "integrate representative measured concentration and standardized flow; use site-specific carbon or sulfur balance only when measurement is unavailable"
      unit: "kg"
      frequency: "continuous where monitored and each representative test campaign"
      temporal_coverage: "same operating period as product output, including abnormal periods separately"
      site_scope: "captured stacks and documented fugitive sources from charge handling, furnaces, alloying, slagging and tapping"
      aggregation_rule: "integrate mass over time, subtract neither captured waste nor upstream emissions, then divide by accepted product mass"
      quality_evidence: "test report; monitor QA/QC; flow calibration; control uptime; fuel analysis"
    - protocol_id: cp_mould_materials
      process_id: "mould_and_core"
      flow_role: "sand, bentonite, phenolic resin and process water"
      record_type: "purchase, issue, batch and water-meter records"
      raw_fields: "material identity; grade; binder chemistry; sand system; mass or volume; density; opening/closing stock; reclaimed-sand quantity; product mass"
      collection_method: "calibrated batch scales and dedicated water meter, reconciled to stock"
      unit: "kg"
      frequency: "each batch with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "all mould, core and sand-reclamation lines serving the declared product"
      aggregation_rule: "purchased consumption plus opening stock minus closing stock; exclude reclaimed internal sand; divide by accepted product mass"
      quality_evidence: "calibration; formulation sheets; procurement and stock reconciliation"
    - protocol_id: cp_mould_utilities
      process_id: "mould_and_core"
      flow_role: "mould/core electricity and natural gas"
      record_type: "meters; invoices; equipment logs"
      raw_fields: "meter readings; volume reference conditions; operating hours; line; product mass"
      collection_method: "submeter or documented equipment-hour allocation"
      unit: "MJ; m3"
      frequency: "continuous or per shift with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "mould, core, drying and reclamation equipment"
      aggregation_rule: "subtract unrelated loads, convert units and divide by accepted product mass"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_mould_outputs
      process_id: "mould_and_core"
      flow_role: "outward spent foundry sand"
      record_type: "waste weigh tickets; reclamation and stock records; manifests"
      raw_fields: "sand system; binder; mass; destination; on-site reclamation; stock change"
      collection_method: "calibrated scale and material-balance reconciliation"
      unit: "kg"
      frequency: "each shipment with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "all mould/core systems serving the declared product"
      aggregation_rule: "outward shipments plus closing stock minus opening stock; exclude internal reclamation; divide by accepted product mass"
      quality_evidence: "scale calibration; manifests; reclamation log"
    - protocol_id: cp_mould_emissions
      process_id: "mould_and_core"
      flow_role: "mould/core direct air emissions"
      record_type: "stack tests; monitors; exhaust-flow and control records"
      raw_fields: "species; concentration; basis; flow; operating time; control status; product mass"
      collection_method: "integrate measured concentration and standardized exhaust flow"
      unit: "kg"
      frequency: "continuous or representative campaign"
      temporal_coverage: "same period as product output"
      site_scope: "sand handling, mixing, moulding, reclamation and core ovens"
      aggregation_rule: "integrate controlled mass over time and divide by accepted product mass"
      quality_evidence: "test report; monitor QA/QC; flow calibration; control uptime"
    - protocol_id: cp_finishing_inputs
      process_id: "casting_and_finishing"
      flow_role: "finishing electricity and cast steel shot"
      record_type: "meters; invoices; shot issue and stock records"
      raw_fields: "electricity; shot purchases/issues; recovered shot; stock change; equipment hours; product mass"
      collection_method: "submeter and calibrated material scales; documented allocation where shared"
      unit: "MJ; kg"
      frequency: "continuous or per shift with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "pouring support, cooling, shakeout, cutting, grinding, blasting, machining and inspection"
      aggregation_rule: "net purchased shot and assigned electricity divided by accepted product mass"
      quality_evidence: "meter and scale calibration; stock reconciliation; allocation worksheet"
    - protocol_id: cp_finishing_outputs
      process_id: "casting_and_finishing"
      flow_role: "accepted product and outward finishing dust"
      record_type: "accepted-product scale records; rejection logs; waste weigh tickets; stock and manifest records"
      raw_fields: "accepted mass; rejected mass; dust mass; destination; stock change; date; product family"
      collection_method: "calibrated product and waste scales with production/waste reconciliation"
      unit: "kg"
      frequency: "each batch and each waste shipment"
      temporal_coverage: "same period as all inputs"
      site_scope: "all finishing and acceptance operations serving the declared product"
      aggregation_rule: "sum accepted product; compute outward dust plus closing minus opening stock; divide inventory by accepted mass"
      quality_evidence: "calibration; inspection release; reject log; manifests; reconciliation"
    - protocol_id: cp_finishing_emissions
      process_id: "casting_and_finishing"
      flow_role: "direct finishing particulate"
      record_type: "stack tests; monitors; exhaust-flow and control records"
      raw_fields: "particulate concentration; basis; flow; operating time; control status; product mass"
      collection_method: "integrate measured concentration and standardized exhaust flow"
      unit: "kg"
      frequency: "continuous or representative campaign"
      temporal_coverage: "same period as product output"
      site_scope: "shakeout, cutting, grinding, blasting and machining emission points"
      aggregation_rule: "integrate controlled mass over time and divide by accepted product mass"
      quality_evidence: "test report; monitor QA/QC; flow calibration; control uptime"
    - protocol_id: cp_heat_treatment
      process_id: "heat_treatment"
      flow_role: "heat-treatment energy and direct fossil carbon dioxide"
      record_type: "recipe; batch load; meters; fuel analysis; emission records"
      raw_fields: "cycle; temperature; duration; load mass; electricity; gas; gas conditions; carbon content; control status"
      collection_method: "batch meters or documented furnace allocation; direct measurement or site carbon balance for CO2"
      unit: "MJ; m3; kg"
      frequency: "each heat-treatment batch"
      temporal_coverage: "same period as heat-treated product output"
      site_scope: "all on-site heat-treatment furnaces serving the declared product"
      aggregation_rule: "assign energy and emissions by measured batch load and divide by accepted heat-treated product mass"
      quality_evidence: "meter calibration; recipe record; batch traceability; fuel analysis"
    - protocol_id: cp_surface_coating
      process_id: "surface_coating"
      flow_role: "epoxy powder, electricity, natural gas, coating waste and direct fossil carbon dioxide"
      record_type: "formulation and issue records; thickness tests; meters; waste manifests; fuel analysis"
      raw_fields: "powder identity; issue and recovered mass; thickness; electricity; gas and conditions; waste mass/state; carbon content; product mass"
      collection_method: "calibrated scales and meters; coating-thickness tests; direct measurement or site carbon balance for CO2"
      unit: "kg; MJ; m3"
      frequency: "each coating batch with monthly reconciliation"
      temporal_coverage: "same period as coated product output"
      site_scope: "all on-site preparation, application, recovery and cure equipment"
      aggregation_rule: "net fresh powder, assigned energy, outward waste and direct CO2 divided by accepted coated product mass"
      quality_evidence: "calibration; formulation certificate; thickness test; stock reconciliation; manifests; fuel analysis"
  calculation_rules:
    - id: calculation_normalize_reference_mass
      applies_to: "every inventory row"
      rule: "Q_normalized = Q_reporting_period / M_accepted_fitting_reporting_period"
      inputs:
        - "reporting-period exchange quantity"
        - "accepted fitting mass on the reference-product basis"
      output: "exchange quantity per 1 kg accepted fitting"
      source_ids: []
    - id: calculation_electricity_conversion
      applies_to: "every Alternating current row"
      rule: "E_MJ = E_kWh × 3.6; do not apply the conversion twice"
      inputs:
        - "metered kWh"
        - "documented shared-meter allocation"
      output: "MJ of alternating-current electricity per reference flow"
      source_ids: []
    - id: calculation_gas_conditions
      applies_to: "every gas-volume row"
      rule: "Convert meter volume to the declared common temperature, pressure, and moisture basis before aggregation; retain the conversion equation and parameters"
      inputs:
        - "measured gas volume"
        - temperature
        - pressure
        - "moisture state"
        - "compressibility where material"
      output: "m3 at declared reference conditions per reference flow"
      source_ids: []
    - id: calculation_stack_emission
      applies_to: "directly measured air emissions"
      rule: "m = Σ(C_i × V_i × t_i) after consistent dry/wet, oxygen, temperature, and pressure correction, then normalize to accepted fitting mass"
      inputs:
        - concentration
        - "standardized exhaust flow"
        - "interval duration"
        - "control status"
        - "accepted product mass"
      output: "kg pollutant per reference flow"
      source_ids:
        - us-epa-ap42-gray-iron-foundries-2003
        - us-epa-ap42-steel-foundries-1995
    - id: calculation_metal_balance
      applies_to: "metal system"
      rule: "purchased metal + opening stock - closing stock = accepted product + outward metal-bearing waste + measured process loss + net internal-loop stock change; show internal returns separately"
      inputs:
        - "charge records"
        - "product and reject mass"
        - "outward waste"
        - stock
        - "internal returns"
      output: "reconciled mass-balance statement and closure difference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and material inputs"
      requirement: "Declare all required qualifiers and retain supplier or product certificates that establish material grade, fitting form, dimensions, connection, pressure/service class, heat treatment, coating, and acceptance specification."
      evidence: "product release record; drawings/specification; material certificates; supplier declarations"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one common representative production period. Separate start-up, shutdown, abnormal, trial, and nonproduction records and disclose inclusion decisions."
      evidence: "dated record inventory; operating calendar; exception log"
    - id: dq_completeness
      applies_to: "all mapped processes"
      requirement: "Reconcile every required process and every applicable conditional row; document zero or not-applicable decisions rather than omitting the row silently."
      evidence: "signed completeness checklist; process map; applicability record"
    - id: dq_measurement
      applies_to: "scales, meters and emission systems"
      requirement: "Use calibration valid for the reporting period and retain raw readings, unit conversions, shared-meter allocation, detection limits, and QA/QC corrections."
      evidence: "calibration certificates; raw exports; calculation workbook; test QA/QC"
    - id: dq_mass_balance
      applies_to: "metal, sand, coating and wastes"
      requirement: "Report stock changes and internal recirculation separately and investigate material closure differences that could change the normalized result materially."
      evidence: "reconciled balance; inventory count; investigation record"
    - id: dq_representativeness
      applies_to: "upstream datasets"
      requirement: "Document geography, technology, period, composition/grade, recycled-content treatment, and delivery boundary for each linked upstream dataset and explain any proxy."
      evidence: "dataset metadata; supplier evidence; proxy justification"
validation_rules:
  - rule_id: validation_identity_complete
    applies_to: "reference flow"
    rule: "Fail validation when the reference flow is not 1 kg of accepted cast-iron or cast-steel fitting or when any required qualifier is missing."
    source_ids:
      - unsd-cpc-3-0-structure-2025
  - rule_id: validation_process_coverage
    applies_to: "process map"
    rule: "Require the three required processes and explicit applicability decisions for heat treatment and surface coating."
    source_ids:
      - eu-jrc-sf-bref-2024
      - us-epa-ap42-gray-iron-foundries-2003
      - us-epa-ap42-steel-foundries-1995
  - rule_id: validation_atomic_rows
    applies_to: "process inventory"
    rule: "Require one physical, chemical, waste, or elementary exchange per row, one direction and flow type, and a concrete localized Chinese name; reject collection labels and combined utilities, fuels, materials, wastes, or emissions."
    source_ids: []
  - rule_id: validation_uuid_support
    applies_to: "UUID-bearing rows"
    rule: "Require public state-100 flow identity, matching flow type, classification, property, unit group, and the exact Tiangong Chinese baseName; unresolved rows must match manifest review metadata."
    source_ids: []
  - rule_id: validation_units
    applies_to: "measurement and inventory"
    rule: "Require kg for mass, MJ for alternating-current electricity, and m3 with declared reference conditions for gas volumes; verify every conversion and prevent double conversion."
    source_ids: []
  - rule_id: validation_mass_balance
    applies_to: "metal system"
    rule: "Require accepted product, outward wastes, stock change, and internal returns to be disclosed separately and the metal-balance closure difference to be reported and investigated."
    source_ids: []
  - rule_id: validation_no_internal_double_count
    applies_to: "internal loops"
    rule: "Reject a dataset that counts internal gates, risers, sprues, rejects, or reclaimed sand as both an external input/output and an internal recirculation."
    source_ids:
      - us-epa-ap42-gray-iron-foundries-2003
      - us-epa-ap42-steel-foundries-1995
  - rule_id: validation_emission_boundary
    applies_to: "direct air emissions"
    rule: "Require on-site controlled emissions only; reject upstream electricity or supplier emissions inserted as direct foreground elementary flows."
    source_ids: []
  - rule_id: validation_period_and_allocation
    applies_to: "reporting period and shared operations"
    rule: "Require a common foreground period, disclosed shared-meter and multi-product allocation, and a sensitivity result when mass allocation is unavoidable."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production data package for one declared cast-iron or cast-steel fitting product family"
  downstream_use: "may be published as a secondary_dataset or background_dataset after review of completeness, representativeness, UUID resolution, and uncertainty"
  allowed_use: "cradle-to-gate product-footprint and lifecycle-model construction for a fitting that matches the declared grade, geometry, connection, pressure/service class, process route, heat treatment, coating, geography, technology, and period"
  excluded_use: "direct use for pipe or tube bodies, wrought or fabricated fittings, valves, downstream installation/use/end-of-life, another alloy or coating system, or a cradle-to-grave claim without additional stages"
  required_metadata: "canonical PCR id; reference-flow qualifiers; site and geography; reporting period; product and alloy grade; accepted mass and yield; furnace; mould/core system; heat treatment; coating; pollution controls; allocation; upstream datasets; unresolved identities; data owner and review status"
  required_quality_disclosure: "primary-data share; meter and scale coverage; calibration; stock and mass-balance closure; emission measurement method and control uptime; allocation share and sensitivity; upstream proxy quality; exclusions; missing ranges; uncertainty limitations"
  update_trigger: "material change in product grade or geometry, furnace or mould technology, charge mix, supplier, energy system, yield, control equipment, heat treatment, coating, allocation, site/geography, or reporting period; or resolution of an unresolved flow UUID or evidence range"
