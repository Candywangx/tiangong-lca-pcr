    duplicate_check: "No other material PCR manifest was found for finished cast-iron or cast-steel tube or pipe fittings; adjacent retained records are empty scaffolds for pipe bodies or for fittings made from steel other than cast steel."
    conclusion: "A dedicated canonical methodology is justified because cast fitting manufacture requires foundry charge preparation, melting and metal treatment, mould/core production, casting, shakeout, and finishing, which are not the methodology boundary for wrought pipe bodies or non-cast fittings."
