    - rule_id: boundary_foreground_operations
      applies_to: "foreground rolling system"
      rule: "Include receipt and weighing of feedstock, pickling and rinsing when used, hot or cold rolling, route-required annealing, cooling, inline finishing, measured on-site utilities, generated wastes, and direct emissions through release of conforming product at the facility gate."
      source_ids:
        - ec-jrc-fmp-bref-2022
        - worldsteel-lci-methodology-2017
    - rule_id: boundary_upstream_links
      applies_to: "externally supplied inputs"
      rule: "Represent production and inbound supply of feedstock, energy, water, chemicals, oils, and protective gases with linked upstream datasets; do not duplicate those upstream processes inside foreground rows."
      source_ids:
        - worldsteel-lci-methodology-2017
    - rule_id: boundary_route_condition
      applies_to: "hot-rolled and cold-rolled route variants"
      rule: "Apply pickling, cold reduction, annealing, and protective-atmosphere rows only when the declared production route actually uses the operation or exchange; do not average hot- and cold-rolled routes without production-mass weighting and disclosure."
      source_ids:
        - ec-jrc-fmp-bref-2022
        - worldsteel-lci-methodology-2017
    - rule_id: boundary_exclusions
      applies_to: "downstream life cycle"
      rule: "Exclude packaging, distribution after the facility gate, use, downstream fabrication or coating, capital goods, and end-of-life from the default dataset; disclose any goal-scope extension as a separate module."
      source_ids:
        - worldsteel-lci-methodology-2017
