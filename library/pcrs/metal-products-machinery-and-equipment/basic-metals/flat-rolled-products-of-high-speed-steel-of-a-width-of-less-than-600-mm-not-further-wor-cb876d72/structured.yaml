allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared rolling, pickling, annealing, and finishing operations"
    rule: "Prefer subdivision, dedicated meters, lot records, and direct mass tracking so burdens are assigned to the actual product route before any allocation is used."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_shared_operations
    applies_to: "unavoidable shared utilities or campaigns"
    rule: "When direct separation is not feasible, allocate by a documented physical driver that reflects the shared operation, such as processed mass, meter interval, furnace charge, operating time, or treated surface area; disclose the driver and test sensitivity for material allocations."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_offcuts_and_recovery
    applies_to: "offcuts, scale, spent acids, oils, and recovery outputs"
    rule: "Report each exported recovery stream at the foreground boundary and identify its destination; do not net waste mass or recycling credit against the reference product. Any system expansion or recycling credit belongs to an explicitly declared extended scope."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_no_double_counting
    applies_to: "purchased feedstock and external treatment"
    rule: "Do not duplicate burdens already contained in the linked feedstock, energy, material, or treatment dataset, and do not recursively reapply this PCR to the same purchased hot-rolled input."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_feedstock_records
      process_id: "feedstock_receipt"
      flow_role: "high-speed-steel feedstock"
      record_type: "weighbridge, receipt, and inventory record"
      raw_fields: "lot id; grade; form; supplier; origin; receipt mass; opening stock; closing stock"
      collection_method: "Reconcile lot receipts and inventory to production issue records"
      unit: "kg"
      frequency: "Each receipt and reporting-period close"
      temporal_coverage: "Same period as product output, normally at least 12 representative months"
      site_scope: "All feedstock entering the reporting facility"
      aggregation_rule: "Sum attributable receipt mass plus opening stock minus closing stock"
      quality_evidence: "Calibrated scale certificate, supplier certificate, lot traceability, and inventory reconciliation"
    - protocol_id: cp_pickling_energy
      process_id: "pickling"
      flow_role: "electricity"
      record_type: "submeter or allocated main-meter record"
      raw_fields: "meter id; start and end reading; time interval; product lots; grid supplier; voltage"
      collection_method: "Read dedicated meter; if shared, allocate by documented operating interval and processed mass"
      unit: "kWh and MJ"
      frequency: "Each shift or batch, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Included pickling line"
      aggregation_rule: "Sum attributable readings and convert kWh to MJ"
      quality_evidence: "Meter calibration, invoice reconciliation, and allocation worksheet"
    - protocol_id: cp_pickling_materials
      process_id: "pickling"
      flow_role: "each pickling acid"
      record_type: "invoice, tank level, and recipe record"
      raw_fields: "chemical identity; concentration; delivered mass; opening stock; closing stock; regenerated return; product lots"
      collection_method: "Reconcile purchases and tank balances separately for each acid"
      unit: "kg solution and kg active acid"
      frequency: "Each delivery and batch, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Included pickling baths"
      aggregation_rule: "Sum net external input by chemical identity; keep solution and active-acid bases distinct"
      quality_evidence: "Supplier specification, tank calibration, recipe record, and regeneration log"
    - protocol_id: cp_pickling_water
      process_id: "pickling"
      flow_role: "demineralized rinse water"
      record_type: "water-meter record"
      raw_fields: "meter id; inlet volume; recirculated volume; product lots"
      collection_method: "Meter external make-up water at the rinse system boundary"
      unit: "m3"
      frequency: "Daily or each batch, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Included rinsing stages"
      aggregation_rule: "Sum external make-up only"
      quality_evidence: "Meter calibration and water-balance reconciliation"
    - protocol_id: cp_pickling_wastes
      process_id: "pickling"
      flow_role: "each pickling waste"
      record_type: "tank transfer, waste manifest, scale weighment, and laboratory record"
      raw_fields: "waste identity; mass or volume; moisture; acid chemistry; destination; date; product lots"
      collection_method: "Record each transferred waste stream separately and reconcile with treatment manifests"
      unit: "kg or m3"
      frequency: "Each transfer, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Included pickling and rinsing stages"
      aggregation_rule: "Sum by waste identity and destination"
      quality_evidence: "Waste manifest, calibrated scale or tank, and laboratory characterization"
    - protocol_id: cp_pickling_air_emissions
      process_id: "pickling"
      flow_role: "each acid-gas emission"
      record_type: "stack test or continuous monitoring record"
      raw_fields: "substance; concentration; gas flow; moisture; oxygen; reference conditions; operating time; abatement status"
      collection_method: "Integrate validated substance-specific concentration and standardized gas flow over attributable operation"
      unit: "kg"
      frequency: "Continuous where available or each required stack-test campaign"
      temporal_coverage: "Representative of the reporting period and operating states"
      site_scope: "Included pickling exhaust points"
      aggregation_rule: "Sum mass by substance; no aggregation into a generic air-emission row"
      quality_evidence: "Monitoring calibration, test report, and operating log"
    - protocol_id: cp_rolling_energy
      process_id: "rolling"
      flow_role: "electricity"
      record_type: "rolling-mill submeter record"
      raw_fields: "meter id; start and end reading; interval; product lot; rolling route; grid supplier; voltage"
      collection_method: "Read dedicated mill meter or allocate a shared meter by documented operating data"
      unit: "kWh and MJ"
      frequency: "Each shift or campaign, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Included rolling mill"
      aggregation_rule: "Sum attributable readings and convert kWh to MJ"
      quality_evidence: "Meter calibration, invoice reconciliation, and production log"
    - protocol_id: cp_rolling_materials
      process_id: "rolling"
      flow_role: "rolling oil"
      record_type: "purchase, stock, formulation, and recovery record"
      raw_fields: "product name; formulation; delivered mass; opening stock; closing stock; recovered mass; product lots"
      collection_method: "Reconcile net external input for the specific oil or concentrate"
      unit: "kg"
      frequency: "Each delivery and reporting-period close"
      temporal_coverage: "Same period as product output"
      site_scope: "Included rolling-oil system"
      aggregation_rule: "Purchases plus opening stock minus closing stock minus documented external recovery return"
      quality_evidence: "Supplier specification, inventory record, and oil-system balance"
    - protocol_id: cp_rolling_water
      process_id: "rolling"
      flow_role: "cooling-water make-up"
      record_type: "water-meter and cooling-loop record"
      raw_fields: "make-up volume; blowdown; recirculation; meter id; product lots"
      collection_method: "Meter water crossing into the cooling system and document recirculation separately"
      unit: "m3"
      frequency: "Daily, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Included rolling and cooling circuits"
      aggregation_rule: "Sum external make-up attributable to rolling"
      quality_evidence: "Meter calibration and cooling-water balance"
    - protocol_id: cp_rolling_wastes
      process_id: "rolling"
      flow_role: "each oil-bearing waste"
      record_type: "waste manifest, tank, and filter-service record"
      raw_fields: "waste identity; mass; moisture; oil content; destination; date; product lots"
      collection_method: "Weigh or tank-measure each removed emulsion or sludge stream separately"
      unit: "kg"
      frequency: "Each removal, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Included rolling-oil and filtration systems"
      aggregation_rule: "Sum by waste identity and destination"
      quality_evidence: "Waste manifest, scale or tank calibration, and characterization report"
    - protocol_id: cp_annealing_energy
      process_id: "annealing"
      flow_role: "electricity or natural gas"
      record_type: "furnace submeter and fuel-meter record"
      raw_fields: "energy carrier; meter id; readings; reference temperature and pressure for gas; furnace id; charge; product lots"
      collection_method: "Meter electricity and natural gas separately for included furnace operation"
      unit: "kWh, MJ, and m3"
      frequency: "Each furnace charge or continuous-line shift, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Included annealing furnace and associated equipment"
      aggregation_rule: "Sum each carrier separately and normalize to conforming output"
      quality_evidence: "Meter calibration, fuel invoice, furnace log, and gas-condition record"
    - protocol_id: cp_annealing_gases
      process_id: "annealing"
      flow_role: "each protective gas"
      record_type: "gas meter or supplier record"
      raw_fields: "gas identity; purity; volume; temperature; pressure; cylinder or meter id; furnace charge"
      collection_method: "Meter nitrogen and hydrogen separately at consistent reference conditions"
      unit: "m3"
      frequency: "Each charge or shift, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Included protective-atmosphere supply"
      aggregation_rule: "Sum by gas identity; do not report mixed gas without its component records"
      quality_evidence: "Supplier certificate, meter calibration, and furnace recipe"
    - protocol_id: cp_annealing_air_emissions
      process_id: "annealing"
      flow_role: "each combustion emission"
      record_type: "continuous monitor, stack test, or validated site emission record"
      raw_fields: "substance; concentration; gas flow; oxygen; moisture; reference conditions; operating time; furnace and fuel data"
      collection_method: "Integrate substance-specific monitored emissions over attributable operation"
      unit: "kg"
      frequency: "Continuous where available or each required stack-test campaign"
      temporal_coverage: "Representative of the reporting period and furnace operating states"
      site_scope: "Included annealing exhaust points"
      aggregation_rule: "Sum mass by substance and retain any equivalence conversion"
      quality_evidence: "Monitor calibration, stack-test report, fuel reconciliation, and furnace log"
    - protocol_id: cp_finishing_materials
      process_id: "finishing"
      flow_role: "corrosion-preventive oil"
      record_type: "supplier, stock, and applicator record"
      raw_fields: "formulation; delivered mass; opening stock; closing stock; applicator rate; oiled area; product lots"
      collection_method: "Reconcile net supplied oil or calibrated application to declared oiled product"
      unit: "kg"
      frequency: "Each lot and reporting-period close"
      temporal_coverage: "Same period as product output"
      site_scope: "Included oiling equipment"
      aggregation_rule: "Sum net external oil attributable to declared product"
      quality_evidence: "Supplier specification, stock reconciliation, and applicator calibration"
    - protocol_id: cp_finishing_wastes
      process_id: "finishing"
      flow_role: "high-speed-steel offcuts"
      record_type: "scale, scrap-bin, and recovery record"
      raw_fields: "waste identity; grade; mass; internal return; external destination; product lots"
      collection_method: "Weigh segregated offcuts and distinguish same-period internal return from exported waste"
      unit: "kg"
      frequency: "Each bin or lot, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Included slitting, cutting, and inspection"
      aggregation_rule: "Sum exported offcut mass by grade and destination"
      quality_evidence: "Scale calibration, scrap manifest, and production reconciliation"
    - protocol_id: cp_product_output
      process_id: "finishing"
      flow_role: "conforming reference product"
      record_type: "final scale and release record"
      raw_fields: "lot id; grade; width; thickness; form; rolled state; surface; annealing state; oiling state; net mass; release status"
      collection_method: "Weigh conforming product after inspection and before packaging"
      unit: "kg"
      frequency: "Each released lot"
      temporal_coverage: "Same period as all foreground inputs and outputs"
      site_scope: "All conforming product released by the reporting facility"
      aggregation_rule: "Sum net mass of released conforming product only"
      quality_evidence: "Calibrated scale, inspection release, grade certificate, and dimensional record"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "every non-reference inventory row"
      rule: "normalized amount = attributable reporting-period amount / conforming product output mass × 1,000 kg"
      inputs:
        - "collected row amount"
        - "cp_product_output net conforming mass"
      output: "amount per 1,000 kg reference product"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_electricity_conversion
      applies_to: "electricity rows"
      rule: "MJ = metered kWh × 3.6; retain both the original meter unit and conversion"
      inputs:
        - "metered kWh"
      output: "MJ of alternating-current electricity"
      source_ids: []
    - id: calc_gas_condition_alignment
      applies_to: "natural gas and protective gases"
      rule: "Convert only when source and target temperature, pressure, and moisture basis are documented; otherwise retain the metered condition and flag the record as non-comparable"
      inputs:
        - "metered volume"
        - temperature
        - pressure
        - "moisture basis"
      output: "m3 at declared reference conditions"
      source_ids: []
    - id: calc_material_balance
      applies_to: "feedstock, reference product, offcuts, scale, spent process materials, and stock change"
      rule: "Reconcile input mass with conforming output, separately measured material outputs, and documented inventory change; report the remaining balance difference explicitly in quality disclosure"
      inputs:
        - "mass records from receipt"
        - waste
        - "and product protocols"
      output: "reporting-period mass-balance statement"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_shared_meter_allocation
      applies_to: "shared electricity, water, gas, or material records"
      rule: "Allocate only the unavoidable shared total using the documented physical driver selected under allocation_shared_operations; retain total, driver values, and sensitivity"
      inputs:
        - "shared total"
        - "process time"
        - mass
        - charge
        - "or area driver"
      output: "attributable process amount"
      source_ids:
        - worldsteel-lci-methodology-2017
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "feedstock and reference product"
      requirement: "Retain grade certificates and product records that distinguish high-speed steel, width below 600 mm, rolled state, dimensions, surface condition, and absence of further working."
      evidence: "Supplier certificate, internal grade record, dimensional inspection, and release certificate"
    - id: dq_technology
      applies_to: "all foreground processes"
      requirement: "Identify hot- or cold-rolling route, pickling chemistry, rolling-mill configuration, annealing furnace and atmosphere, abatement, recirculation, and any excluded stage."
      evidence: "Process flow diagram, operating recipe, equipment register, and environmental permit record"
    - id: dq_time
      applies_to: "all collected amounts"
      requirement: "Use one consistent representative reporting period, normally at least 12 months, and disclose shutdowns, abnormal operation, and non-representative campaigns."
      evidence: "Dated meter, production, maintenance, and environmental records"
    - id: dq_geography
      applies_to: "energy, material, and feedstock datasets"
      requirement: "Match electricity supplier or grid, fuel supply, feedstock source, and external treatment geography to the facility and reporting period where possible; justify generic data."
      evidence: "Supplier records, dataset metadata, and documented data-selection rationale"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Account separately for every applicable listed exchange, mark genuinely absent conditional rows as not applicable in the produced dataset, and explain any measured balance difference or unmonitored expected emission."
      evidence: "Completed row checklist, mass and energy reconciliations, and omission log"
    - id: dq_measurement
      applies_to: "meters, scales, tanks, and emission monitors"
      requirement: "Use calibrated instruments or documented supplier records and preserve unit, reference condition, detection limit, and allocation data."
      evidence: "Calibration certificates, invoices, laboratory reports, and raw meter exports"
    - id: dq_uuid_resolution
      applies_to: "UUID-empty flows"
      requirement: "Resolve and directly audit each exact TianGong flow before publication of a fully linked dataset; do not substitute an oxygen flow for nitrogen or a generic alloy-steel product for the reference product."
      evidence: "Public state-code-100 direct read and semantic audit record"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference product"
    rule: "Fail the package if high-speed-steel grade, width below 600 mm, hot- or cold-rolled state, product form, net mass, or absence of further working is not demonstrated."
    source_ids:
      - un-cpc-3-0-2025
      - china-mofcom-high-speed-steel-terminology
  - rule_id: validation_reference_amount
    applies_to: "reference flow"
    rule: "Require exactly 1,000 kg net conforming product excluding packaging and verify that every included amount uses the same normalization denominator."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_route_completeness
    applies_to: "process map and inventory"
    rule: "Require each declared operation to have its applicable atomic inputs, wastes, and direct emissions recorded; reject merged energy, chemical, waste, or emission collections and unexplained conditional omissions."
    source_ids:
      - ec-jrc-fmp-bref-2022
  - rule_id: validation_energy_identity
    applies_to: "electricity and natural gas"
    rule: "Require supplier, geography, voltage and delivery boundary for electricity, and supply geography, furnace application, meter temperature, and pressure for natural gas; reject energy-carrier aggregation."
    source_ids:
      - worldsteel-lci-methodology-2017
      - ec-jrc-fmp-bref-2022
  - rule_id: validation_mass_balance
    applies_to: "material flows"
    rule: "Require a reporting-period reconciliation of feedstock, conforming output, separately measured offcuts, scale, spent materials, and stock change; disclose rather than fabricate any residual."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_allocation
    applies_to: "shared operations and recovery streams"
    rule: "Require subdivision or a documented physical allocation driver and confirm that exported wastes, upstream datasets, and recycling effects are not double-counted or netted into product mass."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_data_quality
    applies_to: "published dataset"
    rule: "Require traceable raw records, calibration evidence, reporting-period and geographic representativeness, route disclosure, unresolved-UUID disclosure, and explicit exclusions before the dataset is accepted for background use."
    source_ids:
      - worldsteel-lci-methodology-2017
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after review and linkage of representative upstream datasets"
  downstream_use: "Foreground high-speed-steel product systems, process datasets, and lifecycle models needing a factory-gate narrow hot- or cold-rolled high-speed-steel input"
  allowed_use: "Product systems whose grade, width, rolled state, geography, technology, time, and boundary are compatible with the published dataset and whose upstream linking and allocation are visible"
  excluded_use: "Generic substitution for stainless, electrical, or other alloy steel; products 600 mm or wider; coated or fabricated products; public comparative assertions without equivalent function and required review; use-stage or end-of-life claims unless separately modelled"
  required_metadata: "canonical PCR id; CPC reference; product grade and specification; composition or grade designation; width; thickness; form; rolled, annealed, surface, and oiling states; facility and geography; production period; feedstock source and upstream dataset; electricity and fuel supply; technology; boundary; allocation; waste destinations; UUID-resolution status"
  required_quality_disclosure: "Data age and coverage; meter and scale calibration; mass and energy reconciliation; route and production-mass weighting; shared-meter allocation; upstream dataset representativeness; water recirculation; abatement; missing or below-detection emissions; unresolved UUIDs; exclusions; uncertainty and sensitivity"
  update_trigger: "Change in high-speed-steel grade mix, hot- or cold-route share, feedstock source, rolling or annealing technology, pickling chemistry, energy supply, abatement, allocation, facility geography, or reporting period that materially changes representativeness"
