  unresolved:
    inventory_flow_uuids:
      - row_id: high_speed_steel_feedstock
        reason_code: no_exact_candidate
        explanation: "Receipt-backed hybrid search and state-100 direct reads found hot-rolled strip, coil, plate, and rod candidates, but none identifies high-speed steel in the declared feedstock form."
      - row_id: hydrochloric_acid_input
        reason_code: product_state_mismatch
        explanation: "Directly read hydrochloric-acid candidates fix 30%, 36%, or 0.2 N states, or omit the supplied solution state; the PCR requires the actual supplied concentration to remain explicit."
      - row_id: sulfuric_acid_input
        reason_code: product_state_mismatch
        explanation: "The only directly read sulfuric-acid solution candidate fixes a 98% state; the PCR requires the actual supplied concentration and recovery state to remain explicit."
      - row_id: demineralized_rinse_water
        reason_code: property_or_unit_mismatch
        explanation: "Directly read deionized or demineralized-water candidates use Mass/kg, while this metered rinse-water exchange is defined on a Volume/m3 basis."
      - row_id: spent_pickling_solution
        reason_code: no_exact_candidate
        explanation: "The only acid-waste candidate is generic Waste Acid and does not preserve the site-specific pickling-acid and dissolved-metal state required for this row."
      - row_id: acidic_rinse_wastewater
        reason_code: no_exact_candidate
        explanation: "Directly read candidates represent generic waste acid, generic cleaning wastewater, generic wastewater, or aggregated steel-production wastewater rather than acidic pickling-rinse wastewater."
      - row_id: sulfur_dioxide_air
        reason_code: classification_mismatch
        explanation: "Directly read sulfur-dioxide candidates use upper-atmosphere, indoor-air, water, or soil compartments; the unspecified-air candidate is the broader sulfur-oxides substance rather than sulfur dioxide."
      - row_id: rolling_oil_input
        reason_code: product_state_mismatch
        explanation: "Candidates fix cold-rolling, hot-rolling, or sheet-rolling oil identities, while this route-conditional row requires the actual oil or emulsion-concentrate formulation to be declared."
      - row_id: cooling_water_input
        reason_code: property_or_unit_mismatch
        explanation: "The relevant process-water and demineralized-water candidates use Mass/kg and do not exactly match cooling-water make-up measured by Volume/m3 at the declared supplied quality."
      - row_id: spent_rolling_emulsion
        reason_code: no_exact_candidate
        explanation: "Receipt-backed candidates represent mill scale, steel scrap, or unspecified steel feed materials; none identifies spent rolling oil emulsion."
      - row_id: rolling_oily_sludge
        reason_code: no_exact_candidate
        explanation: "Oil Sludge is too generic to preserve the steel-rolling origin, while the other directly read candidates are refinery sludge or generic waste residue."
      - row_id: protective_hydrogen
        reason_code: no_exact_candidate
        explanation: "Two ranked searches and state-100 direct reads found raw, converter, producer, biogas, and other non-hydrogen gases, but no exact gaseous-hydrogen product flow."
      - row_id: corrosion_preventive_oil_input
        reason_code: no_exact_candidate
        explanation: "The ranked candidates are oil-palm fruit, fresh fruit bunches, and sulfonated kerosene; none identifies a corrosion-preventive oil for the finished steel surface."
      - row_id: high_speed_steel_offcuts
        reason_code: product_state_mismatch
        explanation: "Directly read offcut candidates identify generic steel scrap and do not retain the high-speed-steel alloy-grade state required for segregated offcuts."
