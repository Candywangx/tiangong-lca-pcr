allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "separately metered lines, lots and optional steps"
    rule: "Subdivide or use direct meter/lot records before allocating shared facility burdens; bypassed pretreatment and heat treatment receive no burden from those steps."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "shared operations producing multiple saleable wire grades or dimensions"
    rule: "When subdivision is not possible and the causal relationship is comparable, allocate shared transformation burdens by measured net saleable wire mass; disclose and justify any different causal basis."
    source_ids:
      - environdec-basic-aluminium-pcr-1-0-2
  - rule_id: allocation_process_scrap
    applies_to: "drawing and finishing aluminium scrap"
    rule: "Record scrap mass, alloy/contamination state, destination and chosen cut-off, substitution or coproduct approach. The library default includes transformation burdens in the wire dataset and applies no avoided-burden credit; a different programme-required approach must be reported separately and must not count the same recycling benefit twice."
    source_ids:
      - iai-aluminium-scrap-carbon-footprint-2025
      - environdec-basic-aluminium-pcr-1-0-2
  - rule_id: allocation_internal_recycling
    applies_to: "scrap returned to an integrated remelting step"
    rule: "Keep the internal scrap loop visible in the facility mass balance, include remelting inputs and emissions when integrated, and do not represent the same scrap as an external waste output."
    source_ids:
      - iai-aluminium-scrap-carbon-footprint-2025
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "stock_pretreatment_wire_drawing_heat_treatment_finishing_and_release"
      flow_role: "external stock, internal transfers, saleable product"
      record_type: "scale tickets, production-order records, coil/lot weights, inventory movements"
      raw_fields: "timestamp; lot_id; alloy; temper/state; source/destination process; gross_mass; tare_mass; net_mass; route_flag; meter/scale_id"
      collection_method: "calibrated scales reconciled to production and inventory records"
      unit: "kg"
      frequency: "per lot or transfer"
      temporal_coverage: "complete declared reporting period"
      site_scope: "every included line and outsourced step under operational control"
      aggregation_rule: "sum net mass by lot and process; reconcile opening/closing work in progress"
      quality_evidence: "calibration records; lot traceability; inventory reconciliation; rejected-lot log"
    - protocol_id: cp_consumables
      process_id: "stock_pretreatment_wire_drawing_finishing_and_release"
      flow_role: "water, chemicals, lubricants, coatings, packaging"
      record_type: "meters, invoices, tank levels, batch sheets, issue/return records"
      raw_fields: "product_id; supplier; quantity; unit; concentration; opening_stock; purchases; closing_stock; recovered_quantity; process_id"
      collection_method: "direct meter or mass-balance calculation from auditable stock records"
      unit: "kg, with original m3 retained where metered"
      frequency: "per batch or monthly"
      temporal_coverage: "complete declared reporting period"
      site_scope: "every included line and shared utility allocation"
      aggregation_rule: "product-specific quantity = opening + purchases - closing - documented recovery; allocate shared use by measured causal driver"
      quality_evidence: "meter calibration; invoices; batch sheets; stock reconciliation; concentration certificate"
    - protocol_id: cp_energy
      process_id: "wire_drawing_heat_treatment_finishing_and_release"
      flow_role: "electricity and fuel"
      record_type: "submeter, utility invoice, fuel issue, furnace campaign log"
      raw_fields: "meter_id; timestamp; energy_carrier; reading_start; reading_end; unit; line/furnace; treated_mass; allocation_driver"
      collection_method: "direct submeter preferred; otherwise documented facility-to-line allocation"
      unit: "kWh or MJ, preserving source unit"
      frequency: "continuous, batch or monthly"
      temporal_coverage: "complete declared reporting period"
      site_scope: "every included line, furnace and shared service"
      aggregation_rule: "subtract verified non-production use and allocate shared energy by causal meter, operating time or treated mass"
      quality_evidence: "meter calibration; invoices; operating-hour log; allocation worksheet"
    - protocol_id: cp_waste_outputs
      process_id: "stock_pretreatment_wire_drawing_finishing_and_release"
      flow_role: "scrap, spent bath, lubricant, wastewater, sludge, packaging waste"
      record_type: "scales, manifests, recycler receipts, discharge meters, laboratory records"
      raw_fields: "waste_id; composition; alloy; contamination; mass/volume; destination; internal_return; recycler/treatment; date"
      collection_method: "measured at generation or transfer and reconciled to manifests"
      unit: "kg, with original m3 retained for wastewater"
      frequency: "per transfer or batch"
      temporal_coverage: "complete declared reporting period"
      site_scope: "all included lines and on-site treatment"
      aggregation_rule: "sum by waste identity and destination; separately reconcile internal aluminium return"
      quality_evidence: "calibrated scales/meters; signed manifests; recycler receipts; analytical results"
    - protocol_id: cp_product_qualification
      process_id: "finishing_and_release"
      flow_role: "reference-product identity and conformance"
      record_type: "certificate of analysis, dimensional inspection, tensile/electrical test, release record"
      raw_fields: "lot_id; alloy; temper; shape; dimensions; tolerance; coating; application_grade; test_method; result; disposition"
      collection_method: "documented inspection and release against declared product specification"
      unit: "declared test units"
      frequency: "per released lot"
      temporal_coverage: "complete declared reporting period"
      site_scope: "every reference-product lot"
      aggregation_rule: "accept only released mass; retain rejected and sampled mass in waste or work-in-progress records"
      quality_evidence: "signed certificate; instrument calibration; release authorization; nonconformance log"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "every foreground inventory amount"
      rule: "normalized amount = reporting-period amount / reporting-period net saleable finished-wire mass × 1,000 kg"
      inputs:
        - "collected flow amount"
        - "net saleable wire mass"
      output: "amount per 1,000 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_route_weighting
      applies_to: "production-mix datasets"
      rule: "production-mix amount = sum(route amount × route saleable mass) / total saleable mass; retain separate routes when alloy, temper, heat treatment, coating or technology materially changes the inventory"
      inputs:
        - "route-specific normalized amounts"
        - "route saleable masses"
      output: "declared production-mix inventory"
      source_ids:
        - mass-balance-identity
    - id: calc_metal_yield
      applies_to: "aluminium mass balance"
      rule: "yield = net saleable wire mass / total external aluminium-bearing drawing-stock mass; report internal returns separately rather than adding them again to external input"
      inputs:
        - "external aluminium input"
        - "saleable wire"
        - "internal return"
        - "scrap and rejects"
      output: "yield and reconciliation table"
      source_ids:
        - mass-balance-identity
    - id: calc_mass_balance
      applies_to: "each process and the complete foreground"
      rule: "residual = inputs + opening work in progress - outputs - closing work in progress; investigate and disclose residual sign, magnitude and cause without forcing it to zero"
      inputs:
        - "measured mass flows"
        - "work-in-progress inventory"
      output: "process and facility mass-balance residual"
      source_ids:
        - mass-balance-identity
        - iai-aluminium-scrap-carbon-footprint-2025
    - id: calc_recycled_share
      applies_to: "aluminium input disclosure"
      rule: "recycled share = verified secondary aluminium mass embodied in external aluminium inputs / total aluminium mass in those inputs; do not infer secondary content from scrap output"
      inputs:
        - "supplier declarations"
        - "aluminium input masses"
        - "chain-of-custody evidence"
      output: "primary and recycled aluminium shares"
      source_ids:
        - iai-aluminium-scrap-carbon-footprint-2025
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every released product lot"
      requirement: "Preserve alloy, temper, cross-section, dimensions/tolerances, finish/coating, application grade and conformance basis; do not collapse materially different products into an undocumented generic average."
      evidence: "certificate of analysis; inspection/test records; product specification; astm-b211-b211m-19; astm-b230-b230m-22"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one consistent declared reporting period covering normal operations; identify shutdowns, trials, abnormal campaigns and any shorter or non-representative coverage."
      evidence: "timestamps; production calendar; meter/invoice periods; exception log"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Account for all aluminium inputs and outputs, all directly metered energy, and every known treatment, waste and direct-emission flow; list unmeasured or excluded flows and their expected effect."
      evidence: "mass balance; energy reconciliation; waste manifests; omission register"
    - id: dq_geography_technology
      applies_to: "upstream links and foreground route"
      requirement: "Match upstream datasets to supplier geography, primary/secondary route, alloying and drawing-stock form; disclose proxies and technology mismatches."
      evidence: "supplier declarations; upstream dataset metadata; route records"
    - id: dq_allocation
      applies_to: "shared operations and scrap"
      requirement: "Retain allocation drivers, scrap classification, destination and method so a reviewer can reproduce the result and detect double counting."
      evidence: "allocation worksheet; scrap ledger; recycler receipts; iai-aluminium-scrap-carbon-footprint-2025"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require product UUID 89db8507-09bd-45f8-ba96-4e459058412c, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg and exactly 1,000 kg net saleable output."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_required_qualifiers
    applies_to: "product metadata"
    rule: "Reject a package that omits alloy, temper, cross-sectional shape/dimensions, finish/coating, intended grade/application, route, geography, period, recycled-content basis or factory-gate state."
    source_ids:
      - astm-b211-b211m-19
      - astm-b230-b230m-22
  - rule_id: validate_scope_exclusions
    applies_to: "product and boundary"
    rule: "Reject drawing stock, bar/rod/profile, insulated wire, stranded conductor, cable, fabricated wire article, construction-site delivery or installed system as the reference product of this PCR."
    source_ids:
      - environdec-basic-aluminium-pcr-1-0-2
  - rule_id: validate_route_logic
    applies_to: "process map"
    rule: "Require wire drawing and finishing/release; require an explicit included/bypassed decision for pretreatment and heat treatment; prevent duplicate intermediate input on bypass paths."
    source_ids:
      - eu-fmp-bref-2022
  - rule_id: validate_inventory_evidence
    applies_to: "inventory rows"
    rule: "Require collected or calculated foreground amounts, linked collection protocols, source units, normalization to the reference flow and distinct Tiangong identities before publication; reasoned-estimate ranges may screen data but may not replace records."
    source_ids: []
  - rule_id: validate_mass_scrap_allocation
    applies_to: "facility mass balance and recycling"
    rule: "Require reconciled aluminium inputs, product, work in progress, internal returns, scrap and rejects; require one disclosed scrap-allocation method and prohibit duplicate recycling credit."
    source_ids:
      - mass-balance-identity
      - iai-aluminium-scrap-carbon-footprint-2025
      - environdec-basic-aluminium-pcr-1-0-2
  - rule_id: validate_source_status
    applies_to: "methodology review"
    rule: "Recheck the current EPD International aluminium PCR and replace or confirm all provisional reasoned-estimate screens before active or published use."
    source_ids:
      - environdec-basic-aluminium-pcr-1-0-2
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Foreground aluminium-wire production packages and downstream process or lifecyclemodel projections requiring factory-gate uninsulated wire"
  allowed_use: "Product-specific or transparently weighted production-mix datasets whose product lies within the declared uninsulated single-wire scope and whose qualifiers, routes, upstream links and allocation method are complete"
  excluded_use: "Generic aluminium metal, drawing stock, bars/rods/profiles, insulated winding wire, stranded conductors, cable, fabricated wire products, construction-site delivery, installation, use or end-of-life without a separate downstream model"
  required_metadata: "canonical PCR id; product and support UUIDs; alloy; temper; shape/dimensions/tolerances; finish/coating; application grade; production route and bypass decisions; geography; reporting period; primary/recycled shares and evidence; upstream dataset identities; scrap destinations and allocation method; foreground source and collection-protocol links"
  required_quality_disclosure: "temporal and site coverage; meter and scale quality; mass/energy reconciliation; missing flow identities; proxy datasets; provisional ranges used only for QA; allocation drivers; scrap contamination and destination; exclusions and residual mass-balance causes"
  update_trigger: "Material change in alloy/product mix, drawing or heat-treatment technology, energy supply, aluminium source or recycled share, coating/finishing, scrap route or allocation method; a newer controlling PCR/standard; or evidence that a provisional range or UUID is no longer appropriate"
