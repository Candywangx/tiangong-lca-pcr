measurement_rules:
  - id: reference_mass
    applies_to: "reference product and all mass-normalized inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize to 1,000 kg net saleable finished wire. Exclude pallets, reels, returnable carriers and separately modelled packaging from reference-product mass."
  - id: intermediate_mass
    applies_to: "drawing stock and in-plant wire intermediates"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure transfers on a consistent dry/net mass basis and prevent the same in-plant intermediate from being counted as an external input or output."
  - id: length_mass_conversion
    applies_to: "records supplied by length"
    required_property_ref:
      name: "declared mass and length support"
      uuid: ""
    required_unit: "kg and m"
    rule: "Convert length to mass only from measured lot mass or from declared cross-sectional dimensions and alloy density; retain the dimensions, density basis, formula and uncertainty."
  - id: energy_units
    applies_to: "electricity and fuels"
    required_property_ref:
      name: "energy or fuel-specific property"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Preserve metered source units. Convert between kWh and MJ only with 1 kWh = 3.6 MJ and do not use calorific-value conversion to replace fuel mass without a documented fuel property."
  - id: solution_mass
    applies_to: "lubricants, cleaners, pickling agents and coatings"
    required_property_ref:
      name: "supplied-product mass and, when relevant, active content"
      uuid: ""
    required_unit: "kg"
    rule: "Record supplied-product mass and concentration separately when active substance or dry solids determine the inventory."
