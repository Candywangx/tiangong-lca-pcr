allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared_operations"
    rule: "Avoid allocation by separately metering or otherwise subdividing pretreatment, drawing, heat treatment, coating and unrelated production lines wherever practicable."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical_driver
    applies_to: "shared_inputs_and_outputs"
    rule: "When subdivision is not possible, allocate a shared flow using a documented causal physical driver such as route-specific operating time, metered load, bath throughput or processed mass; do not use finished mass when it does not represent the driver."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_other_relationship
    applies_to: "residual_multifunctionality"
    rule: "Use another relationship only after documenting why subdivision, system expansion and a relevant physical relationship are not feasible; disclose the basis and test its influence on the result."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_scrap
    applies_to: "steel_scrap_and_recovered_material"
    rule: "Report scrap, spent liquor, lubricant waste and zinc ash at the foreground boundary without an avoided-product credit in this foreground inventory. Any downstream recycling or substitution model must be declared separately so the same benefit is not counted twice."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass_and_material_records
      process_id: "wire_rod_pretreatment_wire_drawing_and_finishing"
      flow_role: "wire rod, product, acids, lubricants, zinc and flux salts"
      record_type: "calibrated scales, purchase and issue records, stock records, certificates and production releases"
      raw_fields: "lot id; material identity; grade or concentration; opening stock; receipts; returns; closing stock; released product mass; coating state"
      collection_method: "Reconcile each atomic material over the reporting period and link it to applicable production lots"
      unit: "kg and documented mass fraction"
      frequency: "each receipt, issue, stock close and product release"
      temporal_coverage: "Complete declared reporting period including all included lots"
      site_scope: "foreground wire-manufacturing site"
      aggregation_rule: "Calculate consumed mass by substance, normalize each route to conforming released mass, then production-weight declared compatible lots"
      quality_evidence: "scale calibration; supplier certificate; stock reconciliation; lot traceability"
    - protocol_id: cp_water_and_energy_meters
      process_id: "wire_rod_pretreatment_wire_drawing_and_finishing"
      flow_role: "fresh process water and electricity"
      record_type: "utility meters, submeters and invoices"
      raw_fields: "meter id; start and end reading; unit; process scope; water density when volume is converted to mass; voltage; supplier; geography; technology; downtime; allocation driver"
      collection_method: "Read dedicated meters where available; otherwise reconcile the facility meter and document the causal allocation"
      unit: "kg and m3 for water; kWh and MJ for electricity"
      frequency: "each billing or meter-reading interval"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "foreground site and identified shared services"
      aggregation_rule: "Subtract documented non-process uses, convert water volume to mass only with a documented density, convert electricity units, allocate only unresolved shared use, and normalize by conforming route output"
      quality_evidence: "meter calibration or invoice reconciliation; density record; allocation worksheet; delivery qualifiers"
    - protocol_id: cp_waste_records
      process_id: "wire_rod_pretreatment_wire_drawing_and_finishing"
      flow_role: "scale, spent liquor, steel scrap, spent lubricants and zinc ash"
      record_type: "scales, tank volume and density, waste manifests and stock records"
      raw_fields: "waste identity; mass or volume; density; composition; moisture; opening and closing stock; destination; recovery or treatment code"
      collection_method: "Measure each waste stream separately at dispatch and retain composition basis"
      unit: "kg, m3 and kg/m3 where applicable"
      frequency: "each dispatch and stock close"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "foreground site"
      aggregation_rule: "Convert volume to mass only with contemporaneous density; reconcile stock and normalize by applicable route output"
      quality_evidence: "scale calibration; laboratory analysis where needed; signed manifest; destination evidence"
    - protocol_id: cp_heat_treatment_fuel_and_emissions
      process_id: "wire_drawing_and_finishing"
      flow_role: "natural gas and fossil carbon dioxide"
      record_type: "gas meter, supplier statement, furnace log, stack measurement and approved factor record"
      raw_fields: "meter readings; reference temperature and pressure; net calorific value; furnace and lot ids; measured carbon dioxide or factor identity; carbon content; oxidation factor"
      collection_method: "Link fuel to heat-treated lots and use direct emissions measurement where available; otherwise retain every input to the calculation"
      unit: "m3, MJ and kg"
      frequency: "each meter interval and heat-treatment campaign"
      temporal_coverage: "Complete declared reporting period for fuel-fired heat-treated lots"
      site_scope: "foreground furnaces within the site"
      aggregation_rule: "Convert gas to declared reference conditions, calculate or aggregate fossil carbon dioxide, and normalize by conforming heat-treated output"
      quality_evidence: "meter calibration; supplier fuel statement; stack record or approved factor provenance; calculation worksheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = reporting-period row amount / conforming unpackaged finished-wire mass × 1,000"
      inputs:
        - "route-specific row amount"
        - "conforming unpackaged finished-wire mass"
      output: "row amount per 1,000 kg reference product"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_material_content
      applies_to: "acids, formulated lubricant and flux constituents"
      rule: "pure-substance mass = supplied mixture mass × documented mass fraction; do not report both mixture and constituent for the same input unless boundaries are explicitly separated"
      inputs:
        - "supplied mass"
        - "supplier mass fraction"
      output: "kg atomic substance input"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "electricity rows"
      rule: "MJ = kWh × 3.6"
      inputs:
        - "original meter reading in kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calc_shared_meter
      applies_to: "shared water, electricity or fuel meter"
      rule: "allocated flow = reconciled shared-meter flow × documented causal driver share"
      inputs:
        - "shared-meter total"
        - "excluded uses"
        - "route driver data"
      output: "route-specific foreground flow"
      source_ids:
        - eu-pef-method-2021
    - id: calc_fossil_co2
      applies_to: "fossil_co2_air"
      rule: "Use measured fossil carbon dioxide; if unavailable, calculate from reference-condition fuel activity, net calorific value, documented fossil-carbon factor and oxidation factor without inserting a PCR default factor"
      inputs:
        - "natural-gas record"
        - "net calorific value"
        - "factor provenance"
        - "oxidation factor"
      output: "kg fossil carbon dioxide"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "iron-bearing and coating mass balance"
      rule: "Reconcile wire rod, saleable wire, steel scrap, retained coating, recoverable returns and separately measured wastes on consistent moisture and stock bases; investigate and disclose residuals rather than forcing closure"
      inputs:
        - "mass and stock records by route"
      output: "documented mass-balance residual and corrected normalized inventory"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and wire rod"
      requirement: "Retain lot-linked grade or chemistry, nominal diameter, mechanical condition, surface state, coating identity and upstream wire-rod source."
      evidence: "product specification, inspection release and supplier certificate"
    - id: dq_route_traceability
      applies_to: "all rows"
      requirement: "Tag every record to mechanical or acid pretreatment, dry or wet drawing, heat-treatment route and coating state; do not average unlike routes before independent normalization."
      evidence: "production order, route log and aggregation worksheet"
    - id: dq_temporal_completeness
      applies_to: "reporting period"
      requirement: "Cover the complete declared period and all included conforming and rejected lots; explain shutdowns, abnormal campaigns and missing intervals."
      evidence: "production ledger, meter continuity check and exception log"
    - id: dq_measurement_support
      applies_to: "mass, volume and energy"
      requirement: "Retain calibration or invoice reconciliation, original units, conversions, reference conditions and shared-meter allocation evidence."
      evidence: "calibration record, invoice, meter export and calculation worksheet"
    - id: dq_upstream_representativeness
      applies_to: "purchased inputs"
      requirement: "Match geography, technology, product state and delivery boundary for wire rod, chemicals, electricity and fuel; disclose every proxy."
      evidence: "supplier data, background-dataset metadata and proxy justification"
    - id: dq_waste_destination
      applies_to: "waste outputs"
      requirement: "Preserve composition basis, recovery or treatment destination and whether any downstream credit is modelled outside the foreground inventory."
      evidence: "waste manifest, analysis and downstream-model disclosure"
    - id: dq_source_traceability
      applies_to: "calculated rows"
      requirement: "Retain raw fields, factor identities, versions, formulas and reviewer-readable calculations; do not replace foreground measurements with an uncited default."
      evidence: "calculation workbook and factor provenance"
validation_rules:
  - rule_id: vr_identity_complete
    applies_to: "reference_flow"
    rule: "Fail if any required qualifier is absent or if alloy, stainless, insulated, stranded or fabricated wire is represented as this reference product."
    source_ids:
      - unsd-cpc-3-0-2025
      - unsd-hs-2012-7217
  - rule_id: vr_reference_mass
    applies_to: "reference_flow"
    rule: "Confirm exactly 1,000 kg net conforming unpackaged wire after declared finishing; reject inclusion of reels, carriers or packaging in the reference mass."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: vr_route_consistency
    applies_to: "process_inventory"
    rule: "Confirm each conditional acid, lubricant, heat-treatment, flux and coating row is present only for applicable lots and that every actual boundary-crossing exchange is represented atomically."
    source_ids:
      - ec-jrc-fmp-bref-2022
  - rule_id: vr_uuid_qualifiers
    applies_to: "uuid_bearing_rows"
    rule: "Confirm process water retains source, quality, geography, density conversion and delivery boundary; natural gas retains supply and reference-volume conditions; ammonium chloride and zinc chloride retain grade and supply qualifiers; mill scale and waste steel wire retain composition and destination; fossil carbon dioxide remains an elementary emission to unspecified air; do not assign an electricity UUID until site delivery qualifiers are reviewed."
    source_ids: []
  - rule_id: vr_mass_balance
    applies_to: "material_balance"
    rule: "Reconcile iron-bearing and coating masses on consistent stock, moisture and composition bases; flag unexplained residuals without altering measured values to force closure."
    source_ids: []
  - rule_id: vr_energy_units
    applies_to: "energy_inputs"
    rule: "Confirm original energy readings, kWh-to-MJ conversion, gas reference conditions and separation of drawing from optional heat treatment."
    source_ids: []
  - rule_id: vr_allocation
    applies_to: "shared_operations"
    rule: "Confirm subdivision was considered first and every remaining shared flow has a documented causal allocation driver and sensitivity disclosure where another relationship is used."
    source_ids:
      - eu-pef-method-2021
  - rule_id: vr_no_false_range
    applies_to: "quantitative_evidence"
    rule: "Reject any external empirical range unless at least two independent, original-text-verified and boundary-compatible sources support the synthesis; keep foreground collection requirements where evidence is insufficient."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site- and route-specific foreground result that may be published as a secondary_dataset or qualified background_dataset after review"
  downstream_use: "Cradle-to-wire-manufacturing-site-gate modelling of iron or non-alloy steel wire used in downstream products and lifecycle models"
  allowed_use: "Use when product state, grade, diameter, heat treatment, coating, site geography, technology, period, energy delivery and system boundary match or are transparently adjusted"
  excluded_use: "Direct representation of alloy or stainless wire, insulated or stranded products, fabricated wire articles, packaged delivery, use or end-of-life; comparative assertions without equivalent function, boundary and critical review"
  required_metadata: "PCR id and version state; foreground site and period; product grade, diameter, mechanical condition and coating; wire-rod source; process route; electricity and gas delivery qualifiers; allocation; waste destinations; unresolved UUIDs; source and calculation provenance"
  required_quality_disclosure: "Completeness and route coverage; meter and scale support; stock and mass-balance residuals; upstream proxies; conditional operations; missing records; uncertainty; excluded packaging and transport; downstream recycling treatment"
  update_trigger: "Update when grade or diameter mix, wire-rod source, pretreatment, drawing technology, heat treatment, coating route, energy supply, site, allocation, reporting period or material waste destination changes materially"
