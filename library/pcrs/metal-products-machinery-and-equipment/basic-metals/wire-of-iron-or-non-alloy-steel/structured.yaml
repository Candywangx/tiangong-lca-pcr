system_boundary:
  rules:
    - rule_id: sb_wire_rod_start
      applies_to: "foreground_boundary"
      rule: "Begin with received wire rod and include its pretreatment, dry or wet drawing, applicable heat treatment, finishing, site wastes and direct emissions through release of unpackaged finished wire."
      source_ids:
        - ec-jrc-fmp-bref-2022
    - rule_id: sb_upstream_inputs
      applies_to: "upstream_requirements"
      rule: "Model wire rod, acids, water, lubricants, coating chemicals, electricity and fuel with qualified upstream datasets; do not duplicate their upstream production inside the foreground processes."
      source_ids:
        - worldsteel-lci-methodology-2017
    - rule_id: sb_product_state
      applies_to: "route_applicability"
      rule: "Include only the treatment and coating operations actually performed for the declared reference product; do not substitute a galvanised, heat-treated or uncoated route for another state without disclosure."
      source_ids:
        - unsd-hs-2012-7217
        - ec-jrc-fmp-bref-2022
    - rule_id: sb_packaging_transport
      applies_to: "excluded_processes"
      rule: "Exclude reels, pallets, wrapping, outbound transport, downstream fabrication, use and end-of-life from this foreground boundary; disclose any study extension separately."
      source_ids:
        - worldsteel-lci-methodology-2017
    - rule_id: sb_atomic_completeness
      applies_to: "foreground_inventory"
      rule: "Add every material, energy, waste and elementary exchange that actually crosses the site boundary as its own concrete atomic row, even when it is not among the minimum rows below."
