allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared meters and multi-product extrusion lines"
    rule: "Prefer subdivision by production lot, press, furnace, or measured operating interval. Where subdivision is not feasible, allocate shared material and energy by a documented causal parameter such as equipment time and load; use net conforming product mass only when no more causal parameter is available."
    source_ids:
      - aluminum-association-extruded-aluminum-epd-2022
  - rule_id: allocation_scrap_no_credit
    applies_to: "aluminium process scrap"
    rule: "Report scrap mass and destination without assigning an avoided-primary-metal credit inside the foreground inventory. Keep any substitution, recycled-content, cut-off, or closed-loop convention explicit in the downstream model and prevent double counting between billet composition and scrap recovery."
    source_ids:
      - european-aluminium-environmental-profile-2018
      - aluminum-association-extruded-aluminum-epd-2022
  - rule_id: allocation_rework
    applies_to: "internally reworked or re-extruded material"
    rule: "Count all energy, water, emissions, and unrecovered losses of rework in the lot that yields the conforming product; do not count an internal transfer as a second external billet input or final product output."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_aluminium_billet_receipts
      process_id: "aluminium_extrusion_and_thermal_finishing"
      flow_role: "homogenized aluminium ingot input"
      record_type: "receiving scale, ERP receipt, and lot genealogy"
      raw_fields: "timestamp; supplier; billet lot; alloy; dimensions; gross mass; tare mass; recycled-content basis"
      collection_method: "reconcile calibrated receiving-scale records to ERP issues and press lot"
      unit: "kg"
      frequency: "each receipt and production lot"
      temporal_coverage: "full reporting period"
      site_scope: "all billet entering the declared process"
      aggregation_rule: "sum net billet mass assigned to conforming and rejected lot output; prevent double counting of internal returns"
      quality_evidence: "scale calibration; receipt; ERP reconciliation; lot trace"
    - protocol_id: cp_electricity_meter
      process_id: "aluminium_extrusion_and_thermal_finishing"
      flow_role: "purchased electricity input"
      record_type: "revenue meter and submeters"
      raw_fields: "opening reading; closing reading; interval use; unit; meter id; press/furnace assignment; loss boundary"
      collection_method: "reconcile site imports to equipment submeters and allocate residual auxiliaries causally"
      unit: "kWh and MJ"
      frequency: "interval data aggregated by lot, at least monthly reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "all equipment inside the declared process"
      aggregation_rule: "subtract exports, convert kWh to MJ, assign by measured interval or documented equipment load and time, normalize by net solid product volume"
      quality_evidence: "meter calibration; utility invoice; submeter reconciliation; allocation worksheet"
    - protocol_id: cp_natural_gas_meter
      process_id: "aluminium_extrusion_and_thermal_finishing"
      flow_role: "gaseous natural gas input"
      record_type: "supplier invoice and furnace meter"
      raw_fields: "volume; reference temperature; reference pressure; meter id; furnace; operating interval; lot assignment"
      collection_method: "reconcile supplier volume to furnace meters"
      unit: "m3"
      frequency: "interval data aggregated by lot, at least monthly reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "direct-fired equipment inside the declared process"
      aggregation_rule: "correct to declared reference conditions, subtract out-of-boundary uses, allocate by measured furnace interval, normalize by net solid product volume"
      quality_evidence: "meter calibration; supplier statement; furnace log; reconciliation"
    - protocol_id: cp_process_water_meter
      process_id: "aluminium_extrusion_and_thermal_finishing"
      flow_role: "direct process water input"
      record_type: "make-up or once-through water meter"
      raw_fields: "opening reading; closing reading; source; destination; recirculation status; discharge linkage; lot assignment"
      collection_method: "meter boundary-crossing make-up and once-through water; exclude internal recirculation"
      unit: "kg or m3"
      frequency: "interval data aggregated by lot, at least monthly reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "quench and direct-cooling systems inside the declared process"
      aggregation_rule: "convert volume with documented density when needed, subtract non-process uses, normalize by net solid product volume"
      quality_evidence: "meter calibration; water balance; density basis; maintenance record"
    - protocol_id: cp_product_mass
      process_id: "aluminium_extrusion_and_thermal_finishing"
      flow_role: "net saleable product output"
      record_type: "final scale, geometry record, dispatch record, and quality release"
      raw_fields: "lot; alloy; form; accepted cross-section; length; density; solid volume; gross mass; tare; rejected mass; release status"
      collection_method: "determine solid-metal volume from accepted geometry or verified net mass and alloy density, then reconcile to dispatch and quality records"
      unit: "m3 and kg"
      frequency: "each lot"
      temporal_coverage: "full reporting period"
      site_scope: "all conforming output inside the declared process"
      aggregation_rule: "sum net released solid-metal volume only; exclude voids, packaging, attachments, and rejected material"
      quality_evidence: "scale and dimensional-equipment calibration; density basis; release certificate; dispatch reconciliation; dimensional and temper inspection"
    - protocol_id: cp_aluminium_scrap_mass
      process_id: "aluminium_extrusion_and_thermal_finishing"
      flow_role: "aluminium process scrap output"
      record_type: "scrap scale and container movement record"
      raw_fields: "lot; scrap type; alloy; contamination state; gross mass; tare; destination; internal return flag"
      collection_method: "weigh each scrap movement and reconcile to billet/product mass balance"
      unit: "kg"
      frequency: "each movement and production lot"
      temporal_coverage: "full reporting period"
      site_scope: "all process scrap generated inside the declared process"
      aggregation_rule: "sum net scrap by state and destination; identify internal returns; normalize by net solid product volume"
      quality_evidence: "scale calibration; movement ticket; destination receipt; mass-balance reconciliation"
    - protocol_id: cp_direct_air_emissions
      process_id: "aluminium_extrusion_and_thermal_finishing"
      flow_role: "direct fossil carbon dioxide and nitrogen oxides outputs"
      record_type: "stack monitoring, permit report, and fuel-carbon calculation records"
      raw_fields: "pollutant; concentration; gas flow; operating time; fuel volume; fuel composition; oxidation factor; NOx reporting convention; stack; lot assignment"
      collection_method: "use calibrated continuous or periodic monitoring where available; otherwise use a documented facility fuel-carbon balance for fossil CO2"
      unit: "kg"
      frequency: "monitoring interval or permit frequency with monthly lot reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "direct-fired equipment inside the declared process"
      aggregation_rule: "subtract non-process sources, aggregate pollutant mass by stack and lot, normalize by net solid product volume; never include upstream electricity emissions"
      quality_evidence: "analyzer calibration; laboratory certificate; permit report; fuel analysis; calculation worksheet"
  calculation_rules:
    - id: calc_normalize_reference_volume
      applies_to: "every inventory row"
      rule: "normalized amount = lot-assigned exchange amount / net solid-metal volume of conforming unpackaged product"
      inputs:
        - "exchange amount"
        - "accepted cross-section and length or net mass and verified alloy density"
      output: "exchange per 1 m3 reference product"
      source_ids: []
    - id: calc_metal_mass_balance
      applies_to: "billet, product, scrap, and documented metal loss"
      rule: "billet metal input = conforming product + aluminium scrap + separately measured unrecovered metal loss, after accounting for documented internal transfers"
      inputs:
        - "billet mass"
        - "product mass"
        - "scrap mass"
        - "internal transfers"
        - "measured metal loss"
      output: "reconciled metal balance and closure percentage"
      source_ids:
        - european-aluminium-environmental-profile-2018
    - id: calc_electricity_conversion
      applies_to: "purchased electricity"
      rule: "electricity in MJ = metered kWh × 3.6"
      inputs:
        - "metered electricity in kWh"
      output: "purchased electricity in MJ"
      source_ids: []
    - id: calc_water_volume_to_mass
      applies_to: "process water when recorded by volume"
      rule: "water mass = metered volume × documented water density at the declared temperature"
      inputs:
        - "water volume"
        - temperature
        - density
      output: "process-water mass in kg"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and billet"
      requirement: "Preserve lot-level alloy, form, dimensions, temper, surface condition, and billet genealogy; do not aggregate coated or anodized products into this mill-finished dataset."
      evidence: "material certificates; lot genealogy; quality release; product specification"
    - id: dq_measurement
      applies_to: "mass, electricity, gas, water, and emissions"
      requirement: "Use calibrated instruments or reconciled supplier records, retain units and reference conditions, and document conversions and allocation keys."
      evidence: "calibration certificates; invoices; meter extracts; calculation worksheets"
    - id: dq_temporal
      applies_to: "all foreground exchanges"
      requirement: "Cover one representative continuous 12-month period where practicable; disclose shutdowns, start-ups, abnormal campaigns, missing intervals, and substitutions."
      evidence: "reporting-period register; production calendar; gap log"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Reconcile billet, product and scrap mass and site-to-submeter energy. Explain every material or energy residual and every omitted direct emission relevant to permits or monitoring."
      evidence: "mass and energy balance; reconciliation report; permit inventory; omission register"
    - id: dq_representativeness
      applies_to: "published dataset"
      requirement: "Report production-weighted alloy, form, temper, press class, heating route, geography, and technology coverage; do not claim broader representativeness than the collected sites and period."
      evidence: "production summary; site list; weighting file; representativeness statement"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference flow and dataset metadata"
    rule: "Fail validation when canonical PCR id, product form, alloy, temper, surface condition, production geography, reporting period, solid-volume method, alloy density, or mass equivalent is absent or inconsistent."
    source_ids:
      - unsd-cpc-3-0-structure-2025
  - rule_id: validation_boundary
    applies_to: "process map and inventory"
    rule: "Fail validation when billet manufacture, packaging, coating, anodizing, downstream fabrication, transport, use, or end-of-life is aggregated into the foreground result without separate disaggregation."
    source_ids:
      - aluminum-association-extruded-aluminum-epd-2022
  - rule_id: validation_mass_balance
    applies_to: "billet, product, scrap, and metal loss"
    rule: "Require a documented metal mass balance; flag unexplained imbalance and reject double counting of internal returns as both external input and recovered output."
    source_ids:
      - european-aluminium-environmental-profile-2018
  - rule_id: validation_energy_and_emissions
    applies_to: "electricity, natural gas, fossil carbon dioxide, and nitrogen oxides"
    rule: "Require explicit applicability, measurement boundary, units, allocation, and direct-versus-upstream distinction. A not-applicable gas row requires evidence that no natural gas crosses the boundary."
    source_ids:
      - european-aluminium-environmental-profile-2018
  - rule_id: validation_uuid_and_ranges
    applies_to: "UUID-empty rows and important-flow ranges"
    rule: "Treat the unresolved nitrogen-oxides UUID and the recorded independent-range evidence needs as review findings; never substitute a proxy UUID or an unsupported numerical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production dataset suitable for publication as a secondary_dataset or background_dataset after review"
  downstream_use: "gate-to-gate building block for product LCAs and lifecycle models of mill-finished aluminium bars, rods, and profiles"
  allowed_use: "studies whose alloy, product form, temper, surface state, technology, geography, time period, billet supply, and allocation conventions are compatible or explicitly adjusted"
