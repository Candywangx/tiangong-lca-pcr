measurement_rules:
  - id: reference_volume
    applies_to: "reference product"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Use net solid-metal volume, excluding hollow voids, packaging, and non-product attachments. Determine volume from accepted cross-section and length or divide verified net mass by documented alloy density. Normalize inventory quantities to 1 m3."
  - id: metal_mass
    applies_to: "billet input and aluminium scrap output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use verified net mass. Exclude pallets, wraps, racks, and other packaging, and preserve the mass records used for metal-balance validation."
