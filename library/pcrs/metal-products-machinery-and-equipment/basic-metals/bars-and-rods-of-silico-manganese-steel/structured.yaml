allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Multi-product mill records"
    rule: "Prefer direct metering, heat/lot tracing and subdivision. Assign grade-specific billet, energy, gases, water, residues and emissions to the declared silico-manganese-steel product before any allocation."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_remaining_shared
    applies_to: "Shared utilities and auxiliaries"
    rule: "If subdivision is not practicable, allocate a shared exchange by the physical driver that causes it, such as metered operating time, processed mass or equipment energy; document the driver and test material alternatives. Do not default to revenue."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_scrap_scale
    applies_to: "Scrap, mill scale and other recovered residues"
    rule: "Report gross residue mass and destination. Do not subtract an avoided-production credit inside this gate-to-gate inventory; any recycling extension or system-expansion credit must be reported separately with its method and assumptions."
    source_ids:
      - worldsteel-lci-methodology-2017
      - eu-ferrous-metals-bat-2022
  - rule_id: allocation_internal_recycling
    applies_to: "Internally returned steel and scale"
    rule: "Keep internal returns visible in the process mass balance but do not count an internal transfer as a second boundary output or an external scrap input."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "bar_rod_conversion"
      flow_role: "reheated billet input and steel mass reconciliation"
      record_type: "weighbridge, scale, heat and stock records"
      raw_fields: "heat_or_lot_id; grade; input_mass; return_mass; stock_open; stock_close; timestamp; meter_id"
      collection_method: "reconcile calibrated scales to heat/lot and reporting-period stock movement"
      unit: "kg"
      frequency: "each receipt or heat; monthly close"
      temporal_coverage: "full representative reporting period"
      site_scope: "all lines producing declared product"
      aggregation_rule: "sum grade-specific boundary input and reconcile stock change before normalization"
      quality_evidence: "calibration certificates; heat genealogy; stock reconciliation; exception log"
    - protocol_id: cp_energy_and_gases
      process_id: "bar_rod_conversion"
      flow_role: "electricity, natural gas and industrial oxygen"
      record_type: "utility meters, invoices and equipment sub-meters"
      raw_fields: "carrier; meter_id; opening; closing; export; unit; voltage; supplier; geography; temperature; pressure; heating_value; purity; operating_route"
      collection_method: "read boundary and sub-meters and reconcile to invoices; separate route and non-production loads"
      unit: "MJ, kWh, m3"
      frequency: "shift or daily meter; monthly invoice close"
      temporal_coverage: "same period as product mass"
      site_scope: "all in-scope equipment and allocated auxiliaries"
      aggregation_rule: "aggregate by carrier and route, deduct separately metered exports only, then normalize"
      quality_evidence: "meter calibration; invoices; conversion sheet; outage and allocation log"
    - protocol_id: cp_water_balance
      process_id: "bar_rod_conversion"
      flow_role: "process-water make-up and internal recirculation"
      record_type: "inlet meters and water-balance records"
      raw_fields: "inlet_mass_or_volume; source; recirculated_volume; blowdown; leak; meter_id; timestamp"
      collection_method: "meter boundary make-up and reconcile closed or semi-closed circuits"
      unit: "kg or m3"
      frequency: "daily or shift; monthly balance"
      temporal_coverage: "same period as product mass"
      site_scope: "all in-scope water circuits"
      aggregation_rule: "count only boundary-crossing make-up as input; retain recirculation as a disclosed internal metric"
      quality_evidence: "meter calibration; annual water audit; balance closure; maintenance log"
    - protocol_id: cp_finished_product
      process_id: "bar_rod_conversion"
      flow_role: "conforming reference product"
      record_type: "certified product scale, inspection and dispatch records"
      raw_fields: "heat_or_lot_id; grade; product_form; dimensions; net_mass; disposition; inspection_status; timestamp"
      collection_method: "sum only specification-conforming net product mass; exclude packaging and rejected output"
      unit: "kg"
      frequency: "each lot or dispatch; monthly close"
      temporal_coverage: "full representative reporting period"
      site_scope: "all in-scope lines"
      aggregation_rule: "aggregate conforming mass by declared product and normalize inventory to 1,000 kg"
      quality_evidence: "calibration; inspection certificate; dispatch record; rejection log"
    - protocol_id: cp_residues_and_wastewater
      process_id: "bar_rod_conversion"
      flow_role: "scrap, mill scale and wastewater"
      record_type: "waste scales, transfer notes, treatment logs and outlet meters"
      raw_fields: "stream_id; material_or_water_identity; gross_mass; tare; moisture; oil_content; treatment; destination; outlet_reading; timestamp"
      collection_method: "weigh each solid stream and meter each liquid discharge separately; reconcile storage change"
      unit: "kg"
      frequency: "each transfer or continuous meter; monthly close"
      temporal_coverage: "same period as product mass"
      site_scope: "all residue stores and wastewater outlets serving in-scope operations"
      aggregation_rule: "aggregate without netting unlike streams; separate internal return, external recovery and disposal"
      quality_evidence: "calibrated scale/meter; transfer manifest; laboratory result; treatment and stock log"
    - protocol_id: cp_direct_air_emissions
      process_id: "bar_rod_conversion"
      flow_role: "fossil CO2, particulate matter and nitrogen oxides"
      record_type: "continuous monitor, stack test, fuel meter and operating log"
      raw_fields: "source_id; pollutant; concentration; gas_flow; duration; measured_mass; fuel_use; factor; factor_basis; control_status; timestamp"
      collection_method: "calculate source-specific mass from validated monitors or a documented fuel/emission calculation; exclude upstream emissions"
      unit: "kg"
      frequency: "continuous where available or representative campaign; monthly aggregation"
      temporal_coverage: "captures normal and documented abnormal operation in the reporting period"
      site_scope: "every in-scope direct emission source"
      aggregation_rule: "sum pollutant mass by source, avoid overlap between total particulate and size fractions, then normalize"
      quality_evidence: "monitor QA/QC; accredited stack test; fuel analysis; factor provenance; control downtime log"
  calculation_rules:
    - id: calc_period_normalization
      applies_to: "Every variable inventory row"
      rule: "normalized amount = reporting-period boundary exchange / reporting-period conforming net product mass × 1,000 kg"
      inputs:
        - "reconciled row total"
        - "conforming net product mass"
      output: "row amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_steel_mass_balance
      applies_to: "Steel-bearing flows"
      rule: "mass-balance difference = reheated billet input - conforming product - external scrap - recovered mill scale - other separately measured steel-bearing outputs - stock change; investigate rather than force the balance to zero"
      inputs:
        - "mass records from cp_material_mass_balance"
        - cp_finished_product
        - "and cp_residues_and_wastewater"
      output: "disclosed reconciliation difference and percentage of billet input"
      source_ids:
        - eu-ferrous-metals-bat-2022
    - id: calc_energy_conversion
      applies_to: "Purchased electricity"
      rule: "MJ = metered kWh × 3.6; retain original kWh and voltage/supply metadata"
      inputs:
        - "metered kWh"
      output: "purchased electricity in MJ"
      source_ids: []
    - id: calc_stack_mass
      applies_to: "Particulate matter and nitrogen oxides"
      rule: "source mass = validated concentration × standardized dry gas flow × operating duration, with unit, oxygen and moisture corrections documented; sum only non-overlapping pollutant definitions"
      inputs:
        - "monitor or test data"
        - "gas flow"
        - duration
        - "correction basis"
      output: "direct pollutant mass by source"
      source_ids:
        - eu-ferrous-metals-bat-2022
    - id: calc_fossil_co2
      applies_to: "Fossil carbon dioxide"
      rule: "Prefer measured source mass; otherwise calculate from metered fossil fuel and a site-verified carbon or emission factor and disclose oxidation, heating-value and reference-condition bases"
      inputs:
        - "fuel record"
        - "verified factor or carbon data"
      output: "direct fossil CO2 mass"
      source_ids:
        - eu-ferrous-metals-bat-2022
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and billet input"
      requirement: "Preserve grade, heat/lot genealogy, form, dimensions, surface and delivery condition from feedstock receipt through finished inspection."
      evidence: "supplier certificate; heat record; inspection certificate"
    - id: dq_representativeness
      applies_to: "All foreground records"
      requirement: "Use one common representative period and all in-scope production lines; disclose shutdowns, abnormal operation, outsourced finishing and any excluded campaign."
      evidence: "production calendar; line list; exception log"
    - id: dq_meter_control
      applies_to: "Mass, energy, gas and water"
      requirement: "Use calibrated meters or documented invoice reconciliation and retain original readings, units, reference conditions and conversion factors."
      evidence: "calibration certificate; invoice; meter extract; conversion sheet"
    - id: dq_completeness
      applies_to: "Materials, waste, water and direct emissions"
      requirement: "Reconcile process flow sheets with inventories of chemicals, wastewater and waste-gas streams; add each material direct exchange as an atomic row."
      evidence: "process flow sheet; chemical inventory; wastewater map; emission-source register"
    - id: dq_upstream_links
      applies_to: "Billet/bloom and reheating datasets"
      requirement: "Use supplier- and geography-representative upstream datasets and disclose technology, recycled-content and allocation gaps."
      evidence: "supplier dataset metadata; gap assessment"
    - id: dq_unresolved_identity
      applies_to: "Electricity, wastewater and NOx rows"
      requirement: "Keep the human-readable atomic flow and foreground measurement, but do not assign a Tiangong UUID until an exact state-100 identity with matching property and unit is confirmed."
      evidence: "unresolved manifest entry; future finalized search receipt"
validation_rules:
  - rule_id: validation_identity
    applies_to: "Product category"
    rule: "Reject a dataset that does not establish silico-manganese steel grade and solid bar-or-rod form, or that represents irregularly wound wire rod, wire, hollow drill product or another alloy family."
    source_ids:
      - unsd-cpc-3-0-structure-2025
      - china-serbia-tariff-2024
  - rule_id: validation_reference_flow
    applies_to: "Functional unit"
    rule: "Require exactly 1,000 kg net conforming reference product, with packaging excluded and all required qualifiers declared."
    source_ids: []
  - rule_id: validation_boundary
    applies_to: "Starting and ending gates"
    rule: "Require a grade-identified reheated billet-or-bloom input, explicit upstream billet and reheating datasets, and disclosure of every included forming and finishing operation."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_atomic_inventory
    applies_to: "Inventory rows"
    rule: "Reject combined carriers, utilities, waste collections or emission groups. Each boundary exchange must have one physical or chemical identity, direction, flow type, property, unit, amount rule and applicability condition."
    source_ids:
      - eu-ferrous-metals-bat-2022
  - rule_id: validation_mass_balance
    applies_to: "Steel-bearing flows"
    rule: "Require reported conforming product, scrap, mill scale, other steel-bearing outputs and stock change to reconcile with billet input; investigate and disclose the residual."
    source_ids:
      - eu-ferrous-metals-bat-2022
  - rule_id: validation_no_double_count
    applies_to: "Energy, water, residues and emissions"
    rule: "Reject upstream emissions reported again as direct emissions, recirculated water counted as make-up, internal scrap counted as a boundary output, or particulate totals overlapping reported size fractions."
    source_ids:
      - worldsteel-lci-methodology-2017
      - eu-ferrous-metals-bat-2022
  - rule_id: validation_data_period
    applies_to: "Foreground records"
    rule: "Require the same representative period and site scope for numerator exchanges and conforming product denominator, with abnormal-operation treatment disclosed."
    source_ids:
      - eu-ferrous-metals-bat-2022
published_dataset_profile:
  dataset_role: "secondary_dataset and background_dataset after review and publication"
  downstream_use: "Foreground packages for product LCIs and downstream process or lifecyclemodel construction requiring mill-gate silico-manganese-steel bar or rod supply"
  allowed_use: "Grade-, route-, geography-, technology- and period-compatible modelling when the user preserves the declared starting condition, upstream links and allocation method"
  excluded_use: "Irregularly wound wire rod, wire, high-speed steel, hollow drill bars, generic alloy steel without verified grade, fabricated products, cradle-to-gate claims without upstream links, or public comparative assertions without harmonized functional equivalence and review"
  required_metadata: "PCR id and version; product UUID; grade/specification; heat/lot coverage; dimensions and delivery condition; forming and finishing route; site/geography; period; upstream billet and reheating datasets; voltage/supply mix; gas reference conditions; water boundary; allocation; scrap/scale/wastewater destinations; direct-emission methods; unresolved UUIDs"
  required_quality_disclosure: "Data coverage and exclusions; meter and laboratory QA/QC; mass-balance residual; representativeness; supplier-data gaps; allocation sensitivity; abnormal-operation treatment; exact-versus-unresolved flow identities"
  update_trigger: "Change in grade family, starting feed state, forming or finishing route, equipment, site, energy supply, water system, emission controls, allocation method, upstream datasets, or a material shift in mass/energy balance; confirmation of any unresolved UUID"
