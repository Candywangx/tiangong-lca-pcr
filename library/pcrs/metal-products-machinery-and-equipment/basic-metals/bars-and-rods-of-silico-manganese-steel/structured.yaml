        - worldsteel-lci-methodology-2017
    - rule_id: boundary_route_disclosure
      applies_to: "Route-dependent operations"
      rule: "Include every on-site rolling, forming, cooling, straightening, cutting, heat-treatment, cold-finishing, conditioning, emission-control and wastewater-treatment operation used for the declared product; explicitly mark absent operations."
      source_ids:
        - eu-ferrous-metals-bat-2022
    - rule_id: boundary_direct_exchanges
      applies_to: "Direct releases and recovered residues"
      rule: "Record each direct emission, wastewater stream, scrap stream and mill-scale stream as an individual exchange at the point it crosses the foreground boundary; do not hide internal recycling or net unlike streams together."
      source_ids:
        - eu-ferrous-metals-bat-2022
