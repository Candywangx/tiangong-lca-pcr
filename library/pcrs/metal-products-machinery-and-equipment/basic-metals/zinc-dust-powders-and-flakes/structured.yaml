    - id: dq_route_identity
      applies_to: "process map"
      requirement: "Identify the actual atomization, recovery, or milling route and mark every conditional row as applicable or not applicable with a reason."
      evidence: "Process flow diagram, equipment list, and signed route declaration"
    - id: dq_mass_balance
      applies_to: "zinc-bearing rows"
      requirement: "Reconcile zinc-bearing inputs, net product, internal returns, dross, retained samples, stock change, and measured releases over the same period; investigate unexplained imbalance."
      evidence: "Campaign and annual zinc mass-balance worksheet"
    - id: dq_meter_quality
      applies_to: "measured inputs and outputs"
      requirement: "Use calibrated scales and meters or document the uncertainty and correction applied to uncalibrated instruments."
