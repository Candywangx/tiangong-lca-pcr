allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "multi_route_or_shared_equipment"
    rule: "Prefer process subdivision, route-specific meters, batch records, and operating-time attribution before applying allocation."
    source_ids: []
  - rule_id: allocation_internal_recycle
    applies_to: "internal_zinc_recycle"
    rule: "Do not allocate burdens to zinc dust, off-spec particles, or dross returned within the same foreground system; subtract internal returns once so they are neither new external inputs nor additional outputs."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_exported_coproduct
    applies_to: "exported_zinc_bearing_output"
    rule: "When a zinc-bearing output has an intended external use and independently measured quantity, apply a documented physical causal relation where defensible; otherwise apply mass allocation and report a sensitivity case."
    source_ids: []
  - rule_id: allocation_waste_treatment
    applies_to: "wastes"
    rule: "Assign collection and treatment burdens to the foreground product unless a reviewed downstream dataset documents a different cut-off; do not use an avoided-burden credit without explicit disclosure."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_feed_melting_inputs
      process_id: "feed_melting"
      flow_role: "External zinc, electricity, and natural-gas inputs"
      record_type: "Scale tickets; batch sheets; electricity meter; gas meter"
      raw_fields: "input identity; gross and tare mass; meter opening and closing; reference conditions; batch id"
      collection_method: "Reconcile calibrated meters and batch weights to the same campaign"
      unit: "kg; MJ; m3"
      frequency: "Each batch and monthly meter reconciliation"
      temporal_coverage: "Complete declared representative production period"
      site_scope: "All equipment serving the declared melting route"
      aggregation_rule: "Sum external inputs; allocate shared meters by documented operating time or submeter; normalize to molten zinc transferred"
      quality_evidence: "Calibration records; invoices; batch reconciliation; meter logs"
    - protocol_id: cp_feed_melting_outputs
      process_id: "feed_melting"
      flow_role: "Molten zinc, dross, fossil CO2, and zinc-to-air outputs"
