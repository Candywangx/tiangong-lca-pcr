      raw_fields: "transferred mass; dross mass; fuel carbon; gas flow; zinc concentration; moisture; oxygen; operating hours"
      collection_method: "Match output and emission records to the melting campaign and final abatement boundary"
      unit: "kg; Nm3"
      frequency: "Each transfer or residue shipment; emissions at permit frequency"
      temporal_coverage: "Same period as melting inputs"
      site_scope: "Melter, holding furnace, and assigned abatement"
      aggregation_rule: "Calculate net transferred zinc and period emissions; retain destination-specific dross totals"
      quality_evidence: "Scale calibration; laboratory reports; stack-test QA; carbon-balance worksheet"
    - protocol_id: cp_atomization_inputs
      process_id: "atomization_finishing"
      flow_role: "Molten zinc, electricity, compressed air, process water, and nitrogen"
      record_type: "Transfer scale; batch sheet; utility meters"
      raw_fields: "zinc mass; electricity; gas or air volume and reference conditions; water make-up; route id"
      collection_method: "Record only utilities used by the declared atomization route"
      unit: "kg; MJ; m3"
      frequency: "Each campaign with monthly reconciliation"
      temporal_coverage: "Complete declared representative production period"
      site_scope: "Atomizer, cooling, conveying, and filtration equipment"
      aggregation_rule: "Sum by campaign; exclude recirculated water and internal gases; normalize to conforming output"
      quality_evidence: "Calibration; batch route record; meter reconciliation"
    - protocol_id: cp_atomization_outputs
      process_id: "atomization_finishing"
      flow_role: "Conforming product and zinc-to-air emission"
      record_type: "Product scales; classifier records; filter records; stack measurements"
      raw_fields: "product mass; product grade; particle-size distribution; gas flow; zinc concentration"
      collection_method: "Reconcile product, internal returns, collected dust, and emitted zinc"
      unit: "kg; Nm3"
      frequency: "Each batch; emissions at permit frequency"
      temporal_coverage: "Same period as atomization inputs"
      site_scope: "Atomizer through final classifier and abatement outlet"
      aggregation_rule: "Net saleable product equals dispatched conforming mass; calculate emitted zinc from corrected gas and concentration"
      quality_evidence: "Scale calibration; particle-size report; stack-test QA; mass balance"
    - protocol_id: cp_dust_recovery_inputs
      process_id: "dust_recovery_finishing"
      flow_role: "Zinc oxide and electricity inputs"
      record_type: "Feed scale; composition certificate; electricity meter"
      raw_fields: "dry feed mass; zinc content; moisture; electricity; campaign id"
      collection_method: "Reconcile dry-basis feed and energy to each recovery campaign"
      unit: "kg; MJ"
      frequency: "Each campaign with monthly reconciliation"
      temporal_coverage: "Complete declared representative production period"
      site_scope: "Recovery bed, conveying, and classification equipment"
      aggregation_rule: "Convert feed to dry basis; sum electricity; normalize to conforming recovered dust"
      quality_evidence: "Scale and meter calibration; supplier certificate; laboratory assay"
    - protocol_id: cp_dust_recovery_outputs
      process_id: "dust_recovery_finishing"
      flow_role: "Conforming recovered dust and zinc-to-air emission"
      record_type: "Product scales; classifier records; stack measurements"
      raw_fields: "product mass; zinc content; particle-size distribution; gas flow; zinc concentration"
      collection_method: "Reconcile recovered dust and measured final releases to the campaign"
      unit: "kg; Nm3"
      frequency: "Each batch; emissions at permit frequency"
      temporal_coverage: "Same period as recovery inputs"
      site_scope: "Recovery unit through final classifier and abatement outlet"
      aggregation_rule: "Sum net conforming product and calculate period zinc release"
      quality_evidence: "Scale calibration; laboratory assay; stack-test QA; mass balance"
    - protocol_id: cp_flake_milling_inputs
      process_id: "flake_milling_finishing"
      flow_role: "Zinc feed, electricity, solvent, lubricant, and cooling-water inputs"
      record_type: "Batch sheets; scales; utility meters; solvent inventory"
      raw_fields: "zinc mass; electricity; fresh solvent; recovered solvent; lubricant; water make-up; route id"
      collection_method: "Record fresh external inputs separately from internal recovery"
      unit: "kg; MJ"
      frequency: "Each milling campaign with monthly reconciliation"
      temporal_coverage: "Complete declared representative production period"
      site_scope: "Mill, cooling, solvent recovery, drying, and classifier"
      aggregation_rule: "Sum fresh inputs by campaign; do not count recovered internal solvent as a new external input"
      quality_evidence: "Scale and meter calibration; material issue slips; solvent inventory closure"
    - protocol_id: cp_flake_milling_outputs
      process_id: "flake_milling_finishing"
      flow_role: "Conforming zinc flake and zinc-to-air emission"
      record_type: "Product scales; morphology and size tests; stack measurements"
      raw_fields: "product mass; zinc content; morphology; particle-size distribution; gas flow; zinc concentration"
      collection_method: "Reconcile product, internal returns, retained solvent, and final zinc release"
      unit: "kg; Nm3"
      frequency: "Each batch; emissions at permit frequency"
      temporal_coverage: "Same period as milling inputs"
      site_scope: "Mill through final classifier and abatement outlet"
      aggregation_rule: "Sum net conforming product; calculate period zinc emission; normalize to reference flow"
      quality_evidence: "Scale calibration; morphology and size reports; stack-test QA; campaign mass balance"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "Normalized amount = campaign exchange amount divided by net conforming reference-product mass"
      inputs:
        - "campaign exchange"
        - "net conforming product mass"
      output: "kg, MJ, or m3 per kg reference product"
      source_ids: []
    - id: calc_gas_reference_volume
      applies_to: "volume-based gas rows"
      rule: "Correct measured gas volume to the declared reference temperature and pressure using the documented meter or ideal-gas correction"
      inputs:
        - "measured volume"
        - pressure
        - temperature
        - "compressibility if used"
      output: "reference-condition m3"
      source_ids: []
    - id: calc_zinc_air_release
      applies_to: "zinc elementary-flow rows"
      rule: "Zinc released = corrected dry-gas volume multiplied by measured zinc mass concentration, with unit conversion"
