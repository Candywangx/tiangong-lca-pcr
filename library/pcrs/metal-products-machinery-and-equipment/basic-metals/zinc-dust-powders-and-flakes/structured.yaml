        - "dry-gas volume"
        - "zinc concentration"
        - "sampling duration"
      output: "kg zinc released"
      source_ids:
        - eu-jrc-nfm-bref-2017
    - id: calc_internal_transfer_match
      applies_to: "fm_molten_zinc_out; ar_molten_zinc_in"
      rule: "The paired internal transfer quantities shall be equal for the same campaign after inventory-boundary reconciliation"
      inputs:
        - "transfer mass"
        - "batch id"
      output: "matched internal molten-zinc mass"
      source_ids: []
    - id: calc_net_external_input
      applies_to: "recycled zinc or solvent"
      rule: "Net external input = purchased input crossing the boundary; internally recovered material is tracked in the process balance but not added again as an external input"
      inputs:
        - "purchase records"
        - "internal return records"
      output: "net external input"
      source_ids: []
