system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins with separately identified steel billets, blooms, bar blanks, or equivalent iron/non-alloy-steel feedstock received by the hot-working facility. It includes feedstock conditioning when performed, heating or reheating, descaling, the declared hot-working route, route-specific intermediate or post-heating, cooling, straightening, cutting, ordinary uncoated finishing, inspection, on-site material handling, directly associated emission control, and treatment of process wastewater attributable to the product."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Upstream steelmaking, purchased energy and water supply, and off-site waste treatment remain linked upstream or downstream datasets. Downstream machining, cold finishing, coating, fabrication, distribution beyond the facility gate, use, and end-of-life are excluded. Capital goods, research and development, business travel, administration, accidents, and spills are excluded unless the study goal explicitly requires them."
      source_ids: []
    - rule_id: boundary_foreground_steps
      applies_to: "foreground hot-working process"
      rule: "Include all declared on-site steps from received steel feedstock through net saleable bar or rod, including directly associated utilities, emission control, and wastewater treatment."
      source_ids:
        - eu-fmp-bat-2022
        - eu-sf-bref-2024
        - worldsteel-lci-methodology-2017
    - rule_id: boundary_route_disclosure
      applies_to: "route selection"
      rule: "Declare whether the product is forged, hot-rolled, hot-drawn, hot-extruded, or twisted after rolling, and mark every route-conditional exchange as applicable or not applicable from production evidence."
      source_ids:
        - un-cpc-3-0-structure-2025
        - eu-fmp-bat-2022
        - eu-sf-bref-2024
    - rule_id: boundary_no_double_counting
      applies_to: "linked upstream and recycling datasets"
      rule: "Keep upstream steelmaking and any recycling or avoided-burden module separate from foreground hot working and prevent double counting of scrap burdens or end-of-life credits."
      source_ids:
        - worldsteel-lci-methodology-2017
