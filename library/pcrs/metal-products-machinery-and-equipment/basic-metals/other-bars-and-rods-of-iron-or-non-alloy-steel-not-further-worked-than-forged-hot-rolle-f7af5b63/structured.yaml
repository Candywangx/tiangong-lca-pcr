allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "product-specific hot-working burdens"
    rule: "Avoid allocation by metering or engineering subdivision by line, furnace, route, grade campaign, and product lot before any allocation is applied."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_mass_reconcile
    applies_to: "feedstock, product, scrap, and scale"
    rule: "Reconcile the steel mass balance. Internal returns remain inside the boundary and receive no second burden; outputs crossing the boundary remain separately reported with measured mass and destination."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_recovered_outputs
    applies_to: "externally recovered scrap and scale"
    rule: "Do not embed avoided-burden credits in foreground exchange quantities. If a downstream study applies system expansion or recycling credits, report the method, substituted function, geography, quality loss, and calculation separately and prevent double counting."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "hot_working_and_finishing"
      flow_role: "steel_feedstock; steel_crop_scrap; mill_scale; reference-product verification"
      record_type: "weighbridge, certified scale, and production ledger"
      raw_fields: "lot_id; grade; route; feedstock_mass_kg; net_product_mass_kg; external_scrap_mass_kg; internal_return_mass_kg; dry_scale_mass_kg; destination"
      collection_method: "Record calibrated scale tickets and reconcile them to lot-level production records"
      unit: "kg"
      frequency: "Each lot, aggregated monthly"
      temporal_coverage: "At least 12 consecutive representative months or the full campaign for campaign production"
      site_scope: "All included lines and shared handling assigned to the declared product"
      aggregation_rule: "Sum boundary-crossing masses by lot; keep internal returns separate; normalize each output to 1,000 kg net saleable product"
      quality_evidence: "Scale calibration, ticket-to-ledger reconciliation, destination records, and signed mass-balance review"
    - protocol_id: cp_electricity_metering
      process_id: "hot_working_and_finishing"
      flow_role: "electricity_input"
      record_type: "revenue/submeter readings and allocation log"
      raw_fields: "meter_id; timestamp; opening_kWh; closing_kWh; line_status; route; lot_mass_kg; supplier; geography; voltage; technology; delivery_boundary"
      collection_method: "Use calibrated interval or shift meters; subtract documented non-production loads and allocate shared loads by causal operating data"
      unit: "kWh, converted to MJ"
      frequency: "Each shift or batch, aggregated monthly"
      temporal_coverage: "At least 12 consecutive representative months or the full campaign"
      site_scope: "All included equipment and directly associated treatment"
      aggregation_rule: "Sum assigned kWh, multiply by 3.6 MJ/kWh, and normalize to 1,000 kg net saleable product"
      quality_evidence: "Meter calibration, invoice reconciliation, allocation worksheet, downtime log, and voltage/supplier evidence"
    - protocol_id: cp_natural_gas_metering
      process_id: "hot_working_and_finishing"
      flow_role: "natural_gas_input"
      record_type: "furnace meter and fuel invoice"
      raw_fields: "meter_id; timestamp; opening_m3; closing_m3; reference_temperature; reference_pressure; compressibility_basis; furnace_id; route; lot_mass_kg"
      collection_method: "Use calibrated furnace or site meters and reconcile to invoices; allocate shared use from firing time and throughput"
      unit: "m3 at declared conditions"
      frequency: "Each shift or batch, aggregated monthly"
      temporal_coverage: "At least 12 consecutive representative months or the full campaign"
      site_scope: "Every included natural-gas-fired furnace or heater"
      aggregation_rule: "Sum assigned volume at one declared reference condition and normalize to 1,000 kg net saleable product"
      quality_evidence: "Meter calibration, invoice reconciliation, reference-condition statement, and furnace operating log"
    - protocol_id: cp_water_balance
      process_id: "hot_working_and_finishing"
      flow_role: "process_water; descaling_wastewater"
      record_type: "intake, make-up, recirculation, discharge, and production meters"
      raw_fields: "meter_id; timestamp; make_up_m3; water_density_kg_per_m3; density_reference_conditions; recirculated_m3; discharge_m3; treatment_status; route; lot_mass_kg"
      collection_method: "Read calibrated water meters, record the density basis used for mass conversion, and reconcile make-up, recirculation, evaporation/consumption, and discharge"
      unit: "m3 at meter and kg after documented density conversion"
      frequency: "Daily or each campaign, aggregated monthly"
      temporal_coverage: "At least 12 consecutive representative months or the full campaign"
      site_scope: "All included descaling, cooling, quenching, and wastewater-treatment systems"
      aggregation_rule: "Count only boundary-crossing make-up and discharge; report process-water input in kg after density conversion and wastewater output in m3; allocate shared systems by measured line flow or documented causal throughput and normalize to 1,000 kg product"
      quality_evidence: "Meter calibration, density and reference-condition record, water-balance closure, discharge records, and treatment operating log"
    - protocol_id: cp_direct_air_emissions
      process_id: "hot_working_and_finishing"
      flow_role: "fossil_co2_air; pm10_air"
      record_type: "continuous or periodic monitoring and documented fuel-carbon balance"
      raw_fields: "source_id; pollutant; concentration; gas_flow; sampling_duration; standard_conditions; channelled_or_fugitive; fuel_carbon_mass; oxidation_basis; operating_status; route; lot_mass_kg"
      collection_method: "Use source-specific monitoring or a documented fuel-carbon balance; retain channelled and fugitive results separately"
      unit: "kg per reporting period"
      frequency: "Continuous aggregation or each compliant test campaign; reconcile monthly"
      temporal_coverage: "At least 12 consecutive representative months and representative operating modes"
      site_scope: "All attributable heating, descaling, forging, rolling, cutting, finishing, and abatement sources"
      aggregation_rule: "Sum valid source-specific mass over product operating periods, allocate shared sources causally, and normalize to 1,000 kg product"
      quality_evidence: "Monitoring method, instrument calibration, sampling report, standard-condition conversion, fuel certificate, and operating log"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "every variable inventory row"
      rule: "amount per reference flow = assigned reporting-period amount / net saleable product mass x 1,000 kg"
      inputs:
        - "assigned flow amount"
        - "net saleable product mass"
      output: "normalized row amount per 1,000 kg product"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_electricity_mj
      applies_to: "electricity_input"
      rule: "electricity_MJ = metered_electricity_kWh x 3.6"
      inputs:
        - "metered kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calc_material_balance
      applies_to: "steel-bearing mass flows"
      rule: "unexplained_mass = feedstock_mass - net_product_mass - external_scrap_mass - dry_scale_mass - other separately identified steel-bearing outputs; investigate rather than force closure"
      inputs:
        - "lot-level mass records"
      output: "disclosed mass-balance difference and closure percentage"
      source_ids: []
    - id: calc_water_boundary
      applies_to: "process_water; descaling_wastewater"
      rule: "report make-up input and final discharge separately; do not add internal recirculation to either boundary-crossing amount; convert make-up volume to mass with the documented density and reference conditions"
      inputs:
        - "make-up volume"
        - "water density"
        - "density reference conditions"
        - recirculation
        - "consumption estimate"
        - discharge
      output: "kg process-water input and m3 wastewater output"
      source_ids:
        - eu-fmp-bat-2022
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and steel feedstock"
      requirement: "Retain grade/composition, dimensions, tolerance, route, surface condition, delivery form, lot identity, and upstream dataset linkage."
      evidence: "Certificate of analysis, product specification, inspection record, and supplier dataset identifier"
    - id: dq_technology
      applies_to: "hot-working process"
      requirement: "Identify furnace and forming technology, route sequence, included finishing, fuel, electricity supply, emission controls, water recirculation, and shared-service allocation."
      evidence: "Process flow diagram, equipment register, operating logs, meter map, and allocation worksheet"
    - id: dq_time
      applies_to: "all foreground rows"
      requirement: "Use a representative 12-month period where continuous production exists; for campaign production, cover the full campaign and disclose representativeness limitations."
      evidence: "Dated records, production calendar, downtime and abnormal-operation log"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile every known steel-bearing input and output, and document every excluded boundary-crossing exchange and its estimated significance; never omit a known hazardous or regulated emission through a general cut-off."
      evidence: "Mass-balance closure, exchange register, cut-off assessment, and reviewer sign-off"
    - id: dq_measurement
      applies_to: "meters, scales, and emission monitoring"
      requirement: "Use calibrated instruments or reconcile secondary records to invoices and production ledgers; retain uncertainty and standard-condition conversions."
      evidence: "Calibration certificates, invoices, reconciliation worksheets, monitoring reports, and uncertainty statement"
validation_rules:
  - rule_id: validate_identity
    applies_to: "dataset identity"
    rule: "Reject the dataset when iron/non-alloy composition, product geometry, hot-working route, not-further-worked state, or required reference-flow qualifiers are missing or conflict with the declared product."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_reference_amount
    applies_to: "reference flow"
    rule: "Confirm that the reference output is exactly 1,000 kg net saleable product and that every variable row uses the same normalization denominator."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_route_rows
    applies_to: "route-conditional exchanges"
    rule: "Require applicability evidence for each declared route-specific fuel, water, waste, and emission row; do not replace an unmeasured atomic exchange with a combined utility, waste, or emission category."
    source_ids:
      - eu-fmp-bat-2022
      - eu-sf-bref-2024
  - rule_id: validate_mass_balance
    applies_to: "steel-bearing flows"
    rule: "Report feedstock, net product, external scrap, internal returns, scale, and other steel-bearing outputs separately and investigate any unexplained mass difference."
    source_ids:
      - worldsteel-lci-methodology-2017
      - eu-fmp-bat-2022
  - rule_id: validate_double_counting
    applies_to: "upstream and recycling modelling"
    rule: "Confirm that upstream steelmaking, internal scrap loops, external recovery, and end-of-life credits are not counted twice."
    source_ids:
      - worldsteel-lci-methodology-2017
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after methodology review and publication"
  downstream_use: "Cradle-to-gate steel-product modelling when combined with representative upstream steel, energy, water, and treatment datasets; foreground comparison only when route, grade, geography, period, allocation, and data quality are equivalent"
  allowed_use: "Product carbon footprints, environmental footprints, EPD-supporting studies, supply-chain screening, and lifecycle models within the declared geography, technology, grade, and market-state scope"
  excluded_use: "Direct representation of irregular coils, alloy or stainless steel, cold-finished or coated products, downstream fabricated articles, use-stage functions, or public comparative assertions without a study-specific functional unit and review"
  required_metadata: "PCR id and version; product grade and composition; dimensions and tolerance; route and equipment; surface and delivery state; facility geography; production period; upstream steelmaking route and recycled-content basis; supplier/voltage/fuel qualifiers; allocation and cut-offs"
  required_quality_disclosure: "Primary-data share; temporal, geographical, and technological representativeness; meter and scale coverage; mass-balance closure; water boundary; emission-monitoring method; unresolved flow identities; uncertainty; exclusions; external treatment and recycling method"
  update_trigger: "Material change in grade mix, route, furnace or forming technology, fuel or electricity supply, water system, emission control, facility geography, allocation/recycling method, product specification, or when foreground data become more than five years old"
