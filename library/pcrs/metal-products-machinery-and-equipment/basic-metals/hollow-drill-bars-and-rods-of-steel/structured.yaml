allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared meters, furnaces, finishing lines, water systems, and abatement"
    rule: "Prefer subdivision by lot, line, equipment, or metering period. Allocate only the residual shared quantity that cannot be directly assigned."
    source_ids:
      - eu-ferrous-metals-bat-2022
  - rule_id: allocation_residual_mass
    applies_to: "residual shared manufacturing inputs and emissions"
    rule: "Allocate residual shared quantities by net accepted product mass only when the same equipment and operating regime serve materially equivalent steel products; otherwise use a documented causal driver such as furnace time, metered energy, or processed feedstock mass."
    source_ids:
      - eu-ferrous-metals-bat-2022
  - rule_id: allocation_scrap_no_credit
    applies_to: "post-industrial steel scrap and mill scale"
    rule: "Report gross outgoing residue mass and destination without avoided-burden credit inside the foreground inventory. Any recycling credit or burden is applied consistently in the downstream system model and disclosed separately."
    source_ids:
      - eu-ferrous-metals-bat-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "hollow_drill_steel_manufacturing"
      flow_role: "steel feedstock, accepted product, steel scrap, and mill scale"
      record_type: "weighbridge tickets, batch scales, production and quality records, residue dispatch records"
      raw_fields: "lot id; steel grade; feedstock form; input mass; accepted product mass; rejected mass; scrap mass; scale mass; moisture/oil basis; destination"
      collection_method: "Calibrated mass measurement reconciled to lot or homogeneous campaign"
      unit: "kg"
      frequency: "each lot or shift, aggregated monthly"
      temporal_coverage: "at least 12 consecutive representative months or the full campaign when shorter"
      site_scope: "all included forming and finishing operations at the declared plant"
      aggregation_rule: "Reconcile input, accepted output, residues, stock change, and documented losses; normalize each exchange by accepted product mass"
      quality_evidence: "calibration certificates; lot traceability; mass-balance reconciliation; disposition records; explanation of gaps"
    - protocol_id: cp_energy_and_gas_balance
      process_id: "hollow_drill_steel_manufacturing"
      flow_role: "purchased electricity, natural gas, and industrial oxygen"
      record_type: "meters, invoices, furnace logs, production schedules"
      raw_fields: "meter id; opening/closing reading; unit; reference conditions; fuel composition; oxygen purity; equipment; operating hours; lot or campaign"
      collection_method: "Calibrated direct metering preferred; invoice allocation only with documented causal driver"
      unit: "kWh, MJ, or m3 as metered"
      frequency: "continuous or each shift, aggregated monthly"
      temporal_coverage: "at least 12 consecutive representative months or the full campaign when shorter"
      site_scope: "all included production and environmental-control equipment"
      aggregation_rule: "Subtract exports and excluded uses; convert units under Section 4; allocate residual shared use under Section 7; normalize by accepted product mass"
      quality_evidence: "meter calibration; invoice reconciliation; energy balance; furnace and production logs"
    - protocol_id: cp_water_balance
      process_id: "hollow_drill_steel_manufacturing"
      flow_role: "make-up process water and wastewater"
      record_type: "supply and discharge meters, tank records, laboratory reports, water-loop diagram"
      raw_fields: "inlet volume/mass; recycled volume; discharge volume/mass; density; evaporation estimate; stream identity; treatment state; destination"
      collection_method: "Separate make-up and discharge metering with a documented water balance"
      unit: "kg or m3 as measured"
      frequency: "continuous or daily, aggregated monthly"
      temporal_coverage: "at least 12 consecutive representative months or the full campaign when shorter"
      site_scope: "all included descaling, cooling, quenching, finishing, and abatement water circuits"
      aggregation_rule: "Exclude internal recirculation; reconcile inlet, discharge, evaporation, carryover, and stock change; normalize crossing-gate mass by accepted product mass"
      quality_evidence: "meter calibration; annual water balance; stream map; density basis; treatment and laboratory records"
    - protocol_id: cp_direct_air_emissions
      process_id: "hollow_drill_steel_manufacturing"
      flow_role: "direct fossil CO2, NOx, and particulate matter"
      record_type: "stack monitoring, fuel analysis, meter data, test reports, abatement logs"
      raw_fields: "source id; pollutant; concentration; flow; duration; oxygen reference; fuel carbon; oxidation basis; abatement status; operating state; product mass"
      collection_method: "Use compliant direct measurements where available; otherwise use a transparent equipment-specific calculation from reconciled records"
      unit: "kg pollutant and supporting measurement units"
      frequency: "continuous where installed or each compliant test campaign; aggregate to production period"
      temporal_coverage: "same representative period as production data, including documented abnormal operation"
      site_scope: "every included furnace and relevant mechanical or abatement emission point"
      aggregation_rule: "Convert concentration and gas flow to mass where required; calculate fossil CO2 from fossil carbon only; sum included sources and normalize by accepted product mass"
      quality_evidence: "monitoring standard and calibration; laboratory reports; calculation workbook; source inventory; abnormal-operation record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = same-period exchange quantity / net accepted reference-product mass"
      inputs:
        - "exchange quantity"
        - "accepted hollow-drill-steel mass"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calc_material_reconciliation
      applies_to: "feedstock, product, scrap, and mill scale"
      rule: "reconcile measured inputs with accepted product, residues, stock change, and separately documented losses; investigate rather than force-closing material gaps"
      inputs:
        - "input mass"
        - "product mass"
        - "residue mass"
        - "stock change"
        - "documented losses"
      output: "reconciled material balance and data-gap finding"
      source_ids:
        - eu-ferrous-metals-bat-2022
    - id: calc_energy_conversion
      applies_to: "purchased electricity"
      rule: "MJ = metered kWh × 3.6; retain original meter value and conversion"
      inputs:
        - kWh
      output: "MJ"
      source_ids: []
    - id: calc_wastewater_mass
      applies_to: "wastewater"
      rule: "wastewater mass = measured volume × same-stream density; do not apply a generic density when composition or temperature makes it unsuitable"
      inputs:
        - volume
        - density
        - temperature
        - "stream id"
      output: "kg wastewater"
      source_ids:
        - eu-ferrous-metals-bat-2022
    - id: calc_nox_as_no2
      applies_to: "direct nitrogen oxides"
      rule: "aggregate measured NO and NO2 under the monitoring method and report total NOx as NO2; never substitute N2O"
      inputs:
        - NO
        - NO2
        - "exhaust flow"
        - "operating time"
      output: "kg NOx as NO2"
      source_ids:
        - eu-ferrous-metals-bat-2022
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Lot records must identify steel grade, alloy status, cross-section, external and internal dimensions, length, heat treatment, surface state, conformity specification, and accepted mass."
      evidence: "mill certificate; dimensional inspection; heat-treatment and release records"
    - id: dq_time_alignment
      applies_to: "all exchanges"
      requirement: "Input, output, waste, and emission data must cover the same representative production period; disclose shutdowns, abnormal operation, and excluded campaigns."
      evidence: "timestamped meter and production records; coverage reconciliation"
    - id: dq_meter_and_balance
      applies_to: "material, energy, gas, and water"
      requirement: "Retain calibration status and reconcile meters or invoices to the declared site and process boundary at least annually."
      evidence: "calibration certificates; invoices; annual material, energy, and water balances"
    - id: dq_uuid_qualifiers
      applies_to: "UUID-bearing flows"
      requirement: "Verify that each selected Tiangong identity still matches flow type, classification, property, unit group, product state, and required foreground qualifiers before dataset publication."
      evidence: "state-100 identity review record and dataset metadata"
    - id: dq_unresolved_identity
      applies_to: "non-alloy steel, electricity, and NOx rows"
      requirement: "Do not publish a proxy UUID. Resolve the exact identity or preserve the explicit unresolved finding in the data package."
      evidence: "candidate audit and reviewer disposition"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the reference UUID, Mass property, kg unit, accepted net mass, and every required product qualifier; reject solid rods, tubes, oil/gas drill pipe, or finished assemblies."
    source_ids:
      - un-cpc-3-0-structure-2025
      - eu-cn-2020-1577-ch72-note-1p
  - rule_id: validate_geometry
    applies_to: "products claiming the Chapter 72 hollow-drill-bar definition"
    rule: "Verify suitability for drills, greatest external dimension > 15 mm and <= 52 mm, and greatest internal dimension <= one half of the external dimension."
    source_ids:
      - eu-cn-2020-1577-ch72-note-1p
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Confirm every row is one product, waste, or elementary exchange; conditional routes must not be represented by combined utility, fuel, material, waste, or emission labels."
    source_ids: []
  - rule_id: validate_mass_and_water_balance
    applies_to: "foreground records"
    rule: "Confirm same-period material and water balances, investigate unexplained gaps, exclude internal water recirculation from crossing-gate totals, and keep rejected steel out of accepted product mass."
    source_ids:
      - eu-ferrous-metals-bat-2022
  - rule_id: validate_direct_emissions
    applies_to: "fossil CO2, NOx, and particulate matter"
    rule: "Verify source coverage, measurement or calculation method, abatement state, receiving compartment, fossil-only CO2 accounting, and NOx reporting as NO2; reject N2O as an NOx substitute."
    source_ids:
      - eu-ferrous-metals-bat-2022
  - rule_id: validate_range_status
    applies_to: "every important flow"
    rule: "Treat absent external ranges as explicit evidence needs; do not convert BAT-AELs, single observations, or scenarios from one publication into empirical product-normalized ranges."
    source_ids:
      - eu-ferrous-metals-bat-2022
published_dataset_profile:
  dataset_role: "foreground production dataset eligible for later use as a secondary_dataset or background_dataset after review"
  downstream_use: "Product-system modelling of declared hollow drill bars and rods at the manufacturing plant gate; aggregation into process or lifecyclemodel datasets with matching geography, period, grade, route, and product state"
  allowed_use: "Studies whose functional unit and system boundary can use 1 kg of unpackaged conforming hollow drill steel and whose required qualifiers match or are transparently adapted"
  excluded_use: "Direct substitution for oil/gas drill pipe, tubes, solid drill rods, assembled drill tools, self-drilling anchor systems, upstream steelmaking, product use, or end-of-life without additional modelling"
  required_metadata: "PCR id and version; reference UUID; CPC context; plant geography and period; grade and alloy status; feedstock form and upstream datasets; cross-section and dimensions; forming and heating route; heat treatment; surface and inspection state; allocation; water-loop boundary; electricity, fuel, and oxygen qualifiers; residue destinations; abatement and emission methods; unresolved identities"
  required_quality_disclosure: "Temporal and site coverage; meter and scale calibration; material, energy, and water reconciliation; direct-versus-calculated data share; data gaps and substitutions; abnormal operation; mass allocation; UUID audit status; absence of empirical ranges"
  update_trigger: "New grade, cross-section family, feedstock form, forming or heat-treatment route, plant or grid geography, fuel or oxygen technology, water-loop boundary, abatement system, residue destination, allocation method, exact UUID resolution, or evidence-backed range synthesis"
