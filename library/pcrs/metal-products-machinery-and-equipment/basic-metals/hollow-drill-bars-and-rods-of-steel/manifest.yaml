        explanation: "At least two independent, original-text-verified sources with a compatible semi-finished-steel-to-hollow-drill-steel gate-to-gate boundary are needed before an empirical feedstock or yield range can be authored."
      - need_id: energy_and_utility_ranges
        row_ids: [purchased_electricity, natural_gas_for_heating, industrial_oxygen_for_oxyfuel, process_water]
        explanation: "Product-specific, boundary-compatible evidence from at least two independent publications is needed; the available BAT performance levels are regulatory conformance information for broader ferrous-metal processes and are not used as empirical product ranges."
      - need_id: residue_and_wastewater_ranges
        row_ids: [post_industrial_steel_scrap, mill_scale, wastewater_to_treatment]
        explanation: "Independent original evidence compatible in product state, recovery practice, water-loop boundary, and reference-product basis is not yet sufficient for empirical ranges."
      - need_id: direct_air_emission_ranges
