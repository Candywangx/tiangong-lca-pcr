allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "separately metered routes, lines, or batches"
    rule: "Subdivide fitting routes, lines, and batches and assign their directly measured steel, energy, chemical, water, waste, and emission records before applying allocation."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "shared operations producing several fitting products"
    rule: "If subdivision is not practicable, use a documented physical driver that reflects consumption, such as machine time, furnace load, metered energy, or processed mass; use mass allocation only when no more representative measured driver exists."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "post-industrial steel scrap"
    rule: "Treat steel scrap leaving the process as a waste flow at the foreground boundary; do not apply an avoided-production credit inside this process. A downstream recycling model may represent subsequent treatment separately."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_steel_feedstock
      process_id: "steel_fitting_manufacture"
      flow_role: "each declared steel feedstock card"
      record_type: "receiving scale, purchase, and production issue records"
      raw_fields: "material identity; heat or lot; steel grade; product form; dimensions; received mass; issued mass; supplier dataset"
      collection_method: "reconcile calibrated scale tickets and material issues to production lots"
      unit: "kg"
      frequency: "per receipt and production lot"
      temporal_coverage: "complete reporting period"
      site_scope: "all lines producing the declared fitting"
      aggregation_rule: "sum only the applicable steel-form row and normalize by conforming output mass"
      quality_evidence: "scale calibration; heat certificates; purchase documents; lot reconciliation"
    - protocol_id: cp_energy_metering
      process_id: "steel_fitting_manufacture"
      flow_role: "purchased electricity and natural gas"
      record_type: "utility meters and invoices"
      raw_fields: "meter id; opening and closing readings; unit; reference conditions for gas; allocation driver; downtime"
      collection_method: "read dedicated meters or allocate a reconciled plant meter with a documented physical driver"
      unit: "kWh; m3"
      frequency: "continuous or at least monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all included equipment and shared utilities"
      aggregation_rule: "subtract verified non-production use and normalize to conforming output mass"
      quality_evidence: "meter calibration; invoices; reconciliation; allocation worksheet"
    - protocol_id: cp_process_gases
      process_id: "steel_fitting_manufacture"
      flow_role: "industrial oxygen"
      record_type: "flow meter, cylinder, or tank delivery records"
      raw_fields: "gas identity; purity; pressure; reference temperature; reference pressure; delivered and closing inventory"
      collection_method: "reconcile meters or deliveries and stock change to consumed gas"
      unit: "m3"
      frequency: "per delivery and reporting period"
      temporal_coverage: "complete reporting period"
      site_scope: "oxy-fuel operations for the declared route"
      aggregation_rule: "consumed volume equals deliveries plus opening stock minus closing stock, converted to declared conditions"
      quality_evidence: "supplier certificate; meter calibration; stock reconciliation"
    - protocol_id: cp_process_water
      process_id: "steel_fitting_manufacture"
      flow_role: "process water"
      record_type: "water meter and make-up records"
      raw_fields: "meter readings; source; treatment; recirculation; make-up volume or mass; discharge linkage"
      collection_method: "meter net make-up crossing the process boundary"
      unit: "kg"
      frequency: "continuous or at least monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "cooling, cleaning, rinsing, pickling, and galvanizing systems in scope"
      aggregation_rule: "exclude internal recirculation and normalize net input to conforming output mass"
      quality_evidence: "meter calibration; water balance; invoice or abstraction record"
    - protocol_id: cp_surface_chemicals
      process_id: "steel_fitting_manufacture"
      flow_role: "sodium hydroxide, 30% hydrochloric acid, and SHG zinc"
      record_type: "purchase, batch-charge, bath-analysis, and stock records"
      raw_fields: "chemical identity; concentration or grade; delivered mass; charged mass; opening and closing stock; bath id; applicable lots"
      collection_method: "reconcile deliveries, charges, and stock change for each separate chemical"
      unit: "kg"
      frequency: "per charge and reporting period"
      temporal_coverage: "complete bath service periods overlapping the reporting period"
      site_scope: "all cleaning, pickling, and galvanizing baths used for the declared product"
      aggregation_rule: "attribute each chemical separately by measured product throughput through the bath"
      quality_evidence: "supplier certificate; concentration analysis; calibrated scale; stock reconciliation"
    - protocol_id: cp_product_output
      process_id: "steel_fitting_manufacture"
      flow_role: "conforming reference product"
      record_type: "final scale, inspection, and release records"
      raw_fields: "product id; fitting type; connection; dimensions; grade; heat treatment; coating; mass; inspection result; release date"
      collection_method: "weigh and release only conforming unpackaged fittings"
      unit: "kg"
      frequency: "per lot"
      temporal_coverage: "complete reporting period"
      site_scope: "all declared fitting production lines"
      aggregation_rule: "sum conforming mass by homogeneous declared product and route"
      quality_evidence: "scale calibration; inspection report; material certificate; release record"
    - protocol_id: cp_waste_dispatch
      process_id: "steel_fitting_manufacture"
      flow_role: "post-industrial steel scrap and spent pickling acid"
      record_type: "waste scale tickets, manifests, and bath replacement records"
      raw_fields: "waste identity; alloy or contamination; mass; bath id; acid concentration; dissolved metals; date; destination; treatment"
      collection_method: "reconcile internal collection with off-site dispatch documents for each waste"
      unit: "kg"
      frequency: "per dispatch and bath replacement"
      temporal_coverage: "complete reporting period and complete bath service period"
      site_scope: "all included operations"
      aggregation_rule: "sum each waste separately and attribute shared bath waste by product throughput through that bath"
      quality_evidence: "calibrated scale; waste manifest; bath analysis; licensed receiver record"
    - protocol_id: cp_direct_emissions
      process_id: "steel_fitting_manufacture"
      flow_role: "direct fossil carbon dioxide"
      record_type: "CEMS, stack-test-supported records, or verified facility emissions records"
      raw_fields: "source id; fuel linkage; measured mass or verified reported mass; operating period; allocation driver"
      collection_method: "use direct measurement where available and reconcile the covered combustion sources to the natural-gas record"
      unit: "kg"
      frequency: "continuous or reporting-period record"
      temporal_coverage: "complete reporting period"
