  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "normalized amount = reporting-period row amount / accepted solid product mass × 1,000 kg"
      inputs:
        - "row amount"
        - "accepted product mass"
      output: "amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_stock_consumption
      applies_to: "Stocked materials"
      rule: "net consumption = opening stock + receipts + transfers in - closing stock - transfers out"
      inputs:
        - "stock and movement records"
      output: "net material input"
      source_ids: []
    - id: calc_gas_reference_condition
      applies_to: "Gas volumes"
      rule: "Convert measured volume to the declared normal condition using recorded absolute pressure and temperature; apply one consistent moisture basis."
      inputs:
        - "measured volume"
        - pressure
        - temperature
        - "moisture basis"
      output: "Nm3 gas"
      source_ids: []
    - id: calc_emission_mass
      applies_to: "Monitored air and water emissions"
      rule: "emitted mass = sum of matched concentration × flow × duration intervals, with unit conversion and detection-limit treatment documented"
      inputs:
        - concentration
        - flow
        - "interval duration"
      output: "kg emitted substance"
      source_ids:
        - eu-jrc-iron-steel-bref-2013
    - id: calc_coproduct_balance
      applies_to: "Gas and slag"
      rule: "Reconcile generated amount with internal use, sale, external transfer, flare or disposal; only net external co-product output enters system expansion."
      inputs:
        - generated
        - "internal use"
        - sale
        - transfer
        - flare
        - disposal
      output: "destination-resolved co-product quantities"
      source_ids:
        - worldsteel-lci-methodology-2017
