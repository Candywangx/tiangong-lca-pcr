validation_rules:
  - rule_id: validation_reference_product
    applies_to: "Reference flow"
    rule: "Fail completeness when product kind, chemistry or grade, carbon and manganese mass fractions, physical form, blast-furnace route, solid gate state, site, geography, or reporting period is missing."
    source_ids:
      - un-cpc-v3-structure-2025
      - eu-cn-2020-chapter-72
  - rule_id: validation_process_coverage
    applies_to: "Process map"
    rule: "Require ironmaking, casting, and gas cleaning. Require slag and wastewater treatment when the declared site operates those processes inside the boundary."
    source_ids:
      - eu-jrc-iron-steel-bref-2013
      - worldsteel-lci-methodology-2017
  - rule_id: validation_mass_balance
    applies_to: "Process inventory"
    rule: "Require accepted product, hot metal, slag, gas, wastes, and internal returns to reconcile with measured inputs within a disclosed site threshold; unresolved residuals require correction or explanation."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_utility_separation
    applies_to: "Energy and water"
    rule: "Reject combined utility rows. Electricity, each fuel, each water stream, and recovered blast-furnace gas shall remain separate and use the declared measurement basis."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_coproducts
    applies_to: "Gas and slag handling"
    rule: "Require destination-resolved quantities and allocation or system-expansion documentation; prohibit crediting internally reused output as an external avoided product."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_emissions
    applies_to: "Direct air and water emissions"
    rule: "Require substance-specific rows, receiving compartment, monitored or calculated method, reporting-period coverage, and traceable raw concentration and flow records."
    source_ids:
      - eu-jrc-iron-steel-bref-2013
  - rule_id: validation_uuid_and_ranges
    applies_to: "Publication readiness"
    rule: "Unresolved exact flow UUIDs and unresolved independent range evidence shall remain explicit. They do not block candidate authoring but must be reviewed before publication claims that depend on them."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for one declared pig-iron or spiegeleisen product, route, site, geography, and reporting period"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Cradle-to-gate or gate-to-gate modelling of downstream iron and steel products when product chemistry, route, geography, allocation, and boundary are compatible"
  excluded_use: "Direct representation of DRI, sponge iron, ferro-alloys other than spiegeleisen, crude or semi-finished steel, downstream cast articles, alternative ironmaking routes without an extension, or comparative assertions without compatible functional context"
  required_metadata: "Product kind; grade and chemistry; carbon and manganese mass fractions; physical form; site; geography; reporting period; furnace and hot-stove technology; burden and injection route; gas, slag, and water routes; allocation method; upstream dataset identities; reference product UUID status"
  required_quality_disclosure: "Primary-data coverage; meter calibration; estimation share; mass-balance closure; emission monitoring coverage and uncertainty; co-product destinations and substitution assumptions; generic upstream substitutions; unresolved UUIDs and range evidence"
  update_trigger: "Material change in product chemistry or form, furnace or injection route, burden mix, energy supply, gas cleaning, casting, slag or water treatment, co-product destination, allocation method, site geography, or reporting-period representativeness"
