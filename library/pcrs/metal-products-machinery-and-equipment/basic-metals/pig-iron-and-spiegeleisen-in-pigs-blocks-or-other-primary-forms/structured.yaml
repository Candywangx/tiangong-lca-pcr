allocation_rules:
  - rule_id: allocation_avoid_subdivision
    applies_to: "Separately metered process chains"
    rule: "First avoid allocation by keeping ironmaking, casting, gas cleaning, slag processing, and wastewater treatment as separately measured unit processes."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_system_expansion
    applies_to: "Saleable blast-furnace gas and slag"
    rule: "Use system expansion for net exported gas or slag only when the displaced function, quality, market destination, and substitution ratio are documented. Report credits separately and test sensitivity when material."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_internal_recovery
    applies_to: "Internally reused gas, dust, sludge, slag, and rejected metal"
    rule: "Model internal recovery as an internal product or waste transfer; do not count it as both an external output and a new external input."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_energy_partition
    applies_to: "Electricity, steam, hot water, compressed air, and blast-air services"
    rule: "Partition shared energy services by metered delivered energy or another documented physical relationship; do not use mass allocation for energy services."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_fallback
    applies_to: "Study rules that prohibit system expansion"
