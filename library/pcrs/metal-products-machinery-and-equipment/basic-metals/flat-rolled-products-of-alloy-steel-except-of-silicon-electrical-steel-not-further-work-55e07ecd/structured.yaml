allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "all foreground processes"
    rule: "Subdivide by process line, meter, campaign, and product family before allocation; assign directly measured inputs, outputs, wastes, and emissions to the product that caused them."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_shared_energy
    applies_to: "shared electricity, fuel, steam, compressed air, and cooling"
    rule: "Use direct metering first; otherwise use a documented physical relationship such as equipment operating time and rated load, delivered energy, or thermal duty. Mass allocation is permitted only when no more causal parameter exists and must be sensitivity-tested for material shared burdens."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_internal_scrap
    applies_to: "internally recycled steel trim and scrap"
    rule: "Record generation and destination, but do not count internally recirculated scrap as both an external waste credit and an external scrap input; disclose any recycling model applied outside this foreground transformation."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_co_product_expansion
    applies_to: "exported recovered acid, iron oxide, or other recovered material"
    rule: "Prefer system expansion only when the displaced product, functional equivalence, market use, and substitution ratio are documented; otherwise report the output separately and disclose the selected justified partitioning method and sensitivity."
    source_ids:
      - worldsteel-lci-methodology-2017
      - ec-jrc-fmp-bref-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_pickling_material_mass
      process_id: "pickling_and_surface_preparation"
      flow_role: "steel feed, pickled output, and inventory"
      record_type: "weighbridge, coil tracking, and inventory record"
      raw_fields: "coil id; grade; width; thickness; input kg; output kg; opening and closing WIP kg"
      collection_method: "calibrated scale plus coil production system"
      unit: "kg"
      frequency: "per coil or lot"
      temporal_coverage: "same representative reporting period, normally 12 consecutive months"
      site_scope: "each included pickling line"
      aggregation_rule: "reconcile input, output, scrap, and WIP; normalize to pickled output"
      quality_evidence: "calibration certificate; coil genealogy; signed mass balance"
    - protocol_id: cp_pickling_acid_and_water
      process_id: "pickling_and_surface_preparation"
      flow_role: "acid and rinse-water inputs"
      record_type: "purchase, tank, concentration, and meter record"
      raw_fields: "chemical id; concentration; received kg; tank change; recovered return; water m3; meter id"
      collection_method: "tank balance and calibrated water meter"
      unit: "kg; m3"
      frequency: "per delivery and daily or batch meter read"
      temporal_coverage: "same reporting period as product mass"
      site_scope: "each included bath and rinse train"
      aggregation_rule: "net external addition divided by pickled output"
      quality_evidence: "supplier certificate; tank calibration; meter calibration; route log"
    - protocol_id: cp_pickling_energy
      process_id: "pickling_and_surface_preparation"
      flow_role: "pickling electricity"
      record_type: "interval meter or allocated shared-meter record"
      raw_fields: "meter id; kWh; start and end time; production kg; voltage; supplier or grid mix; allocation driver"
      collection_method: "calibrated electricity meter"
      unit: "kWh retained; MJ reported"
      frequency: "continuous or per shift"
      temporal_coverage: "same reporting period as product mass"
      site_scope: "included pickling equipment and auxiliaries"
      aggregation_rule: "sum kWh, subtract documented non-process loads, convert by 3.6, normalize to output"
      quality_evidence: "meter calibration; energy invoice; allocation worksheet"
    - protocol_id: cp_pickling_waste_and_emissions
      process_id: "pickling_and_surface_preparation"
      flow_role: "trim, spent liquor, wastewater, and HCl emission"
      record_type: "waste shipment, tank transfer, effluent meter, stack test, or CEMS record"
      raw_fields: "stream id; mass or volume; concentration; gas volume; treatment destination; route; date"
      collection_method: "calibrated scale or meter and accredited monitoring where applicable"
      unit: "kg; m3"
      frequency: "per transfer and monitoring event"
      temporal_coverage: "representative operating period including abnormal operation"
      site_scope: "pickling line and associated abatement"
      aggregation_rule: "aggregate each atomic stream separately and normalize to pickled output"
      quality_evidence: "manifests; laboratory report; monitor QA; treatment receipt"
    - protocol_id: cp_rolling_material_mass
      process_id: "cold_rolling"
      flow_role: "pickled feed and cold-reduced output"
      record_type: "coil tracking and inventory record"
      raw_fields: "coil id; grade; input kg; output kg; opening and closing WIP kg"
      collection_method: "calibrated scale plus coil production system"
      unit: "kg"
      frequency: "per coil or lot"
      temporal_coverage: "same reporting period as rolling utilities and wastes"
      site_scope: "each included rolling mill"
      aggregation_rule: "reconcile feed, output, and WIP; normalize to cold-reduced output"
      quality_evidence: "calibration certificate; coil genealogy; signed balance"
    - protocol_id: cp_rolling_lubricant_and_water
      process_id: "cold_rolling"
      flow_role: "fresh rolling oil and cooling-water make-up"
      record_type: "purchase, tank, issue, return, and meter record"
      raw_fields: "formulation; fresh oil kg; return kg; tank change; water m3; circuit type"
      collection_method: "tank balance and calibrated water meter"
      unit: "kg; m3"
      frequency: "daily or per batch"
      temporal_coverage: "same reporting period as rolling output"
      site_scope: "each lubricant and cooling circuit"
      aggregation_rule: "count only external make-up crossing the boundary and normalize to output"
      quality_evidence: "supplier record; tank calibration; meter calibration; circuit diagram"
    - protocol_id: cp_rolling_energy
      process_id: "cold_rolling"
      flow_role: "cold-rolling electricity"
      record_type: "interval meter or allocated shared-meter record"
      raw_fields: "meter id; kWh; mill id; operating time; output kg; allocation driver"
      collection_method: "calibrated electricity meter"
      unit: "kWh retained; MJ reported"
      frequency: "continuous or per shift"
      temporal_coverage: "same reporting period as rolling output"
      site_scope: "mill drives and directly attributable auxiliaries"
      aggregation_rule: "sum kWh, convert by 3.6, normalize to output"
      quality_evidence: "meter calibration; energy invoice; allocation worksheet"
    - protocol_id: cp_rolling_waste
      process_id: "cold_rolling"
      flow_role: "used oil, oily wastewater, and filter residue"
      record_type: "waste tank, treatment, and shipment record"
      raw_fields: "stream id; kg or m3; solids or oil content; destination; date"
      collection_method: "calibrated tank, scale, or flow meter"
      unit: "kg; m3"
      frequency: "per transfer or shipment"
      temporal_coverage: "same reporting period as rolling output"
      site_scope: "rolling and emulsion-conditioning systems"
      aggregation_rule: "aggregate each waste separately and normalize to output"
      quality_evidence: "manifest; treatment receipt; laboratory analysis"
    - protocol_id: cp_finishing_material_and_packaging
      process_id: "annealing_temper_finishing_and_packing"
      flow_role: "steel feed, final product, conditional agents, oil, and packing"
      record_type: "coil tracking, material issue, packing, and inventory record"
      raw_fields: "coil id; feed kg; product kg; agent kg; oil kg; strap kg; paper kg; pallet kg; operation status"
      collection_method: "calibrated scale and production or warehouse system"
      unit: "kg"
      frequency: "per coil or shipment"
      temporal_coverage: "same reporting period as finishing utilities and emissions"
      site_scope: "included annealing, temper, finishing, and packing operations"
      aggregation_rule: "aggregate each atomic exchange, reconcile inventory, normalize to 1,000 kg net product"
      quality_evidence: "calibration; coil genealogy; issue record; packing bill"
    - protocol_id: cp_finishing_energy_and_gases
      process_id: "annealing_temper_finishing_and_packing"
      flow_role: "natural gas, electricity, nitrogen, and hydrogen"
      record_type: "utility meter and supplier record"
      raw_fields: "meter id; gas m3; volume conditions; electricity kWh; nitrogen m3; hydrogen m3; furnace and line status"
      collection_method: "calibrated meters and supplier statements"
      unit: "m3; kWh retained; MJ reported"
      frequency: "continuous or per batch"
      temporal_coverage: "same reporting period as final product"
      site_scope: "included furnaces, lines, and auxiliaries"
      aggregation_rule: "allocate causally, convert electricity by 3.6, normalize to 1,000 kg product"
      quality_evidence: "meter calibration; invoice; batch log; allocation worksheet"
    - protocol_id: cp_finishing_waste_and_emissions
      process_id: "annealing_temper_finishing_and_packing"
      flow_role: "trim, spent agent, CO2, NOx, and CO"
      record_type: "scale, waste shipment, CEMS, stack test, fuel-carbon balance, or regulated ledger"
      raw_fields: "stream id; kg; concentration; standardized gas volume; oxygen reference; fuel carbon data; destination; date"
      collection_method: "calibrated scale and verified monitoring or ledger method"
      unit: "kg"
      frequency: "per batch, shipment, or monitoring event"
      temporal_coverage: "representative period covering applicable furnace operation"
      site_scope: "finishing operations and their emission points"
      aggregation_rule: "aggregate each atomic stream and normalize to 1,000 kg net product"
      quality_evidence: "manifest; accredited test; CEMS QA; verified emissions statement"
  calculation_rules:
    - id: normalize_pickling_exchange
      applies_to: "pickling inventory rows"
      rule: "normalized amount = reporting-period exchange / reporting-period pickled-strip output"
      inputs:
        - cp_pickling_material_mass
        - cp_pickling_acid_and_water
        - cp_pickling_energy
        - cp_pickling_waste_and_emissions
      output: "amount per kg pickled-strip output"
      source_ids:
        - ec-jrc-fmp-bref-2022
    - id: normalize_rolling_exchange
      applies_to: "cold-rolling inventory rows"
      rule: "normalized amount = reporting-period exchange / reporting-period cold-reduced-strip output"
      inputs:
        - cp_rolling_material_mass
        - cp_rolling_lubricant_and_water
        - cp_rolling_energy
        - cp_rolling_waste
      output: "amount per kg cold-reduced-strip output"
      source_ids:
        - ec-jrc-fmp-bref-2022
    - id: normalize_reference_exchange
      applies_to: "final conditioning inventory rows"
      rule: "normalized amount = reporting-period exchange / reporting-period net reference-product kg * 1,000"
      inputs:
        - cp_finishing_material_and_packaging
        - cp_finishing_energy_and_gases
        - cp_finishing_waste_and_emissions
      output: "amount per 1,000 kg net reference product"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: convert_electricity_kwh_to_mj
      applies_to: "all electricity rows"
      rule: "reported MJ = metered kWh * 3.6"
      inputs:
        - "original kWh"
        - "meter identity"
      output: "electricity in MJ with original kWh retained"
      source_ids: []
    - id: reconcile_process_steel_mass
      applies_to: "each foreground process"
      rule: "steel input + opening WIP = conforming steel output + steel scrap + other measured steel-bearing output + closing WIP; investigate and disclose residual"
      inputs:
        - "material mass protocol for the process"
      output: "reconciled mass balance and residual"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calculate_stack_mass
      applies_to: "HCl, NOx, and CO emissions when concentration data are used"
      rule: "emitted mass = validated concentration * standardized dry gas volume, adjusted to the declared oxygen and moisture basis where applicable"
      inputs:
        - concentration
        - "gas volume"
        - time
        - oxygen
        - moisture
        - "monitor QA"
      output: "kg emitted species"
      source_ids:
        - ec-jrc-fmp-bref-2022
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and intermediates"
      requirement: "Preserve coil genealogy, alloy-grade standard and chemistry designation, silicon-electrical exclusion, ordered and measured width and thickness, cold-reduction state, surface and temper state, and coating status."
      evidence: "coil route card; inspection certificate; order specification"
    - id: dq_temporal_representativeness
      applies_to: "all foreground rows"
      requirement: "Use one aligned representative reporting period, normally 12 consecutive months; disclose shutdowns, abnormal operation, campaign changes, and any shorter period."
      evidence: "dated production, utility, waste, and emissions records"
    - id: dq_geographic_technology
      applies_to: "upstream datasets and utilities"
      requirement: "Match the production geography, supplier route, electricity supply, rolling-mill type, pickling acid route, lubrication circuit, and annealing technology as closely as available; disclose substitutions."
      evidence: "supplier declaration; dataset metadata; site process description"
    - id: dq_measurement
      applies_to: "meters, scales, tanks, and monitors"
      requirement: "Use calibrated devices within their valid calibration period and retain raw values, units, reference conditions, detection limits, and correction factors."
      evidence: "calibration certificates; QA logs; raw export"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Reconcile all three process sections and document every excluded or non-applicable atomic exchange; unexplained mass-balance residuals and unassigned shared utilities require correction."
      evidence: "signed mass balance; completeness checklist; allocation worksheet"
    - id: dq_source_and_uuid_status
      applies_to: "evidence and flow identity"
      requirement: "Preserve source references and flag every unresolved Tiangong flow UUID; no proxy flow may be silently substituted for a specific product, chemical, waste, or elementary emission."
      evidence: "source register; UUID audit; unresolved manifest entries"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm net output equals 1,000 kg and all required qualifiers establish alloy grade, non-silicon-electrical status, width at least 600 mm, cold-rolled state, absence of further working, and factory-gate state."
    source_ids:
      - un-cpc-3-0-2025
      - worldsteel-lci-methodology-2017
  - rule_id: validate_process_alignment
    applies_to: "process map and inventory"
    rule: "Confirm required process sections exist, conditional operations are explicitly present or absent, and every inventory card is one atomic exchange linked to the stated process, direction, and flow type."
    source_ids:
      - ec-jrc-fmp-bref-2022
  - rule_id: validate_mass_balance
    applies_to: "each process and total foreground chain"
    rule: "Perform steel and total-mass balance checks on aligned periods; investigate and disclose residuals rather than forcing the reference output to close."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_energy_and_gas_units
    applies_to: "electricity and natural gas"
    rule: "Confirm kWh-to-MJ conversion, meter coverage, shared-meter allocation, and natural-gas reference volume conditions; reject unitless energy or gas values."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_waste_and_emission_boundaries
    applies_to: "wastes and elementary emissions"
    rule: "Confirm wastes are recorded before linked treatment or recovery, direct onsite emissions are not duplicated in upstream fuel datasets, and monitoring basis and abatement outlet are declared."
    source_ids:
      - ec-jrc-fmp-bref-2022
      - worldsteel-lci-methodology-2017
  - rule_id: validate_no_double_counting
    applies_to: "upstream, scrap, recovery, and recycling models"
    rule: "Confirm hot-rolled feed burdens, internal scrap, exported scrap, recovered chemicals, waste treatment, and any recycling credit are each represented once with the selected allocation model disclosed."
    source_ids:
      - worldsteel-lci-methodology-2017
