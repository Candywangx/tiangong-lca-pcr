measurement_rules:
  - id: reference_product_mass
    applies_to: "reference product and steel intermediates"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use net dry product mass excluding pallets, wrapping, strapping, cores, and other dispatch packaging; record gross-to-net reconciliation when commercial records use gross mass."
  - id: electricity_energy_conversion
    applies_to: "all alternating-current electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve supplier or meter kWh and convert to MJ using exactly 3.6 MJ per kWh; retain the original kWh record and identify the meter, voltage level, supplier or grid mix, and allocation method."
  - id: natural_gas_volume_conditions
    applies_to: "annealing natural gas"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Report gaseous natural-gas volume at explicitly declared temperature, pressure, and dry/wet reference conditions; retain the meter correction or supplier statement used to harmonize volume."
  - id: process_mass_balance
    applies_to: "each process and the overall foreground chain"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile input steel mass to conforming intermediates, reference product, steel scrap, scale or filter residues, retained work in progress, and measured inventory change on the same temporal basis."
