system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary starts when qualifying hot-rolled alloy-steel feed enters the pickling or coupled pickling-and-rolling line and ends when the net qualifying cold-rolled product is finished and ready for dispatch. Linked upstream datasets provide the burdens of hot-rolled feed, purchased chemicals, electricity, fuels, water, gases, and packaging. Treatment or recovery datasets are required for wastes leaving the foreground site."
      source_ids: []
    - rule_id: boundary_include_cold_rolling_chain
      applies_to: "foreground production"
      rule: "Include pickling and rinsing, cold rolling, grade- or order-required annealing and temper rolling, finishing, internal material handling, directly attributable utilities, emissions control, wastewater handling, and packing performed before the factory gate."
      source_ids:
        - ec-jrc-fmp-bref-2022
        - worldsteel-lci-methodology-2017
    - rule_id: boundary_link_upstream_inputs
      applies_to: "product and utility inputs"
      rule: "Link every purchased product input to a geographically and technologically representative upstream dataset and disclose supplier-specific substitutions; do not truncate hot-rolled steel production merely because the foreground starts at pickling."
      source_ids:
        - worldsteel-lci-methodology-2017
    - rule_id: boundary_exclude_downstream_conversion
      applies_to: "downstream life cycle"
      rule: "Exclude transport after the factory gate, fabrication, forming, coating, assembly, use, maintenance, and end-of-life unless a separately declared expanded study adds them without changing this reference flow."
      source_ids:
        - un-cpc-3-0-2025
        - worldsteel-lci-methodology-2017
    - rule_id: boundary_conditional_operations
      applies_to: "annealing, temper rolling, surface oiling, and packing"
      rule: "Include each operation and its atomic exchanges only when performed for the reported product; otherwise document the operation as absent rather than applying a generic route average."
      source_ids:
        - ec-jrc-fmp-bref-2022
