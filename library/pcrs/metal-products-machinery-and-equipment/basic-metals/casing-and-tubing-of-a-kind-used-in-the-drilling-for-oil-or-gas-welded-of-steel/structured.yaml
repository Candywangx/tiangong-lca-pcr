allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared_processes"
    rule: "Avoid allocation by process metering and subdivision of forming/welding, grade heat treatment, finishing/testing, and shipment preparation wherever records allow."
    source_ids:
      - eu-2022-2110-fmp-bat
  - rule_id: allocation_shared_energy
    applies_to: "shared_energy_and_utilities"
    rule: "For unavoidable shared meters, allocate by a documented causal driver such as machine time, furnace charge mass, test time, or treated product mass. Use mass allocation only when no more causal driver exists and disclose the affected exchanges and fraction."
    source_ids:
      - eu-2022-2110-fmp-bat
  - rule_id: allocation_steel_scrap
    applies_to: "ferrous_scrap_outputs"
    rule: "Report steel scrap as a waste output at the measured mass. Do not subtract an avoided-primary-steel credit inside the foreground inventory; any recycling model, substitution credit, or end-of-life allocation is an external scenario and shall be disclosed separately."
    source_ids:
      - eu-2022-2110-fmp-bat
  - rule_id: allocation_offspec_rework
    applies_to: "internal_rework"
    rule: "Material returned to an operation without leaving the foreground system is an internal transfer. Count only net purchased inputs, net conforming product, and wastes or products that cross the boundary."
    source_ids:
      - cbsa-octg3-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_erw_production_records
      process_id: "erw_forming_welding"
      flow_role: "coil, electricity, water, cutting fluid, and steel scrap"
      record_type: "scale, meter, stock, purchase, and waste-dispatch records"
      raw_fields: "lot id; coil mass and grade; opening/closing stock; electricity; make-up water; cutting-fluid additions; scrap mass; conforming output mass"
      collection_method: "calibrated scales and submeters; otherwise documented reconciliation to site meters and inventory records"
      unit: "kg; MJ"
      frequency: "per production lot with monthly reconciliation"
      temporal_coverage: "at least 12 consecutive representative months, or the complete shorter campaign with justification"
      site_scope: "all equipment and support loads inside the declared forming/welding boundary"
      aggregation_rule: "sum net boundary-crossing quantities and normalize under calc_reference_normalization"
      quality_evidence: "calibration, invoices, meter exports, stock reconciliation, and scrap dispatch tickets"
    - protocol_id: cp_heat_treatment_records
      process_id: "grade_heat_treatment"
      flow_role: "natural gas, electricity, quench water, quenchant, and scale"
      record_type: "meter, batch, chemical-addition, and waste records"
      raw_fields: "heat-treatment lot; grade; route; treated mass; fuel volume and conditions; electricity; water; quenchant additions; scale mass and moisture"
      collection_method: "dedicated meters and batch logs; documented allocation only when dedicated meters are unavailable"
      unit: "kg; m3; MJ"
      frequency: "per furnace batch with monthly reconciliation"
      temporal_coverage: "same reference period as product data"
      site_scope: "every included furnace and quench circuit"
      aggregation_rule: "aggregate only treated lots and normalize to treated conforming output"
      quality_evidence: "meter calibration, furnace logs, material issues, and waste tickets"
    - protocol_id: cp_heat_emission_records
      process_id: "grade_heat_treatment"
      flow_role: "direct fossil CO2, nitrogen oxides, and carbon monoxide"
      record_type: "stack test, continuous monitor, fuel analysis, and gas-flow records"
      raw_fields: "source id; operating hours; concentration; reference oxygen; dry/wet basis; temperature; pressure; gas flow; fuel carbon; treated mass"
      collection_method: "direct monitored mass preferred; otherwise calculate from monitored concentration and normalized gas flow or a documented fuel carbon balance"
      unit: "kg; mg/Nm3; Nm3; kg C"
      frequency: "each monitoring event with period integration"
      temporal_coverage: "same reference period as heat-treatment activity"
      site_scope: "all included fuel-fired heat-treatment stacks"
      aggregation_rule: "integrate mass over included operation and normalize to treated conforming output"
      quality_evidence: "analyzer calibration, sampling report, laboratory certificate, and calculation workbook"
    - protocol_id: cp_finishing_records
      process_id: "finishing_testing"
      flow_role: "electricity, test water, cutting fluid, coupling, lacquer, ink, product, and wastes"
      record_type: "meter, scale, purchase, issue, inspection, and waste records"
      raw_fields: "lot id; product kind; grade; dimensions; connection; coupling mass; coating; test status; input issues; water make-up/discharge; scrap and spent-fluid mass; conforming net mass"
      collection_method: "calibrated scales/meters and production/quality records"
      unit: "kg; MJ"
      frequency: "per lot with monthly reconciliation"
      temporal_coverage: "same reference period as forming/welding data"
      site_scope: "all finishing and test operations in scope, including outsourced operations attributed to the product"
      aggregation_rule: "sum by declared product family and normalize to conforming factory-gate net mass"
      quality_evidence: "calibration, inspection and hydrotest records, material certificates, purchase/issue records, and waste tickets"
    - protocol_id: cp_shipment_records
      process_id: "shipment_preparation"
      flow_role: "steel strap, polypropylene protectors, and softwood dunnage"
      record_type: "issue, bill-of-material, item-count, and shipment records"
      raw_fields: "shipment id; product net mass; material type; item count; unit mass; issued mass; returned mass"
      collection_method: "weigh representative items and reconcile issued quantities to shipment records"
      unit: "kg; item"
      frequency: "per shipment with monthly reconciliation"
      temporal_coverage: "same reference period as product data"
      site_scope: "packaging supplied beyond the factory gate only"
      aggregation_rule: "calculate net supplied mass and normalize to product net mass"
      quality_evidence: "weighing record, material specification, bill of materials, and shipment record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all non-reference inventory rows"
      rule: "normalized amount = 1,000 × period boundary-crossing amount / period conforming reference-product net mass"
      inputs:
        - "period flow amount"
        - "period conforming net product mass"
      output: "flow amount per 1,000 kg reference product"
      source_ids:
        - eu-2022-2110-fmp-bat
    - id: calc_electricity_conversion
      applies_to: "electricity records"
      rule: "electricity MJ = metered kWh × 3.6; retain original kWh and meter period"
      inputs:
        - "metered kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_direct_combustion_emissions
      applies_to: "heat-treatment fossil CO2, nitrogen oxides, and carbon monoxide"
      rule: "Prefer directly integrated monitored mass. Otherwise concentration-based mass = dry-normal concentration × dry-normal gas volume with unit conversion; fossil CO2 may alternatively use a documented fuel-carbon balance corrected for non-CO2 carbon."
      inputs:
        - concentration
        - "gas flow"
        - time
        - "reference conditions"
        - "fuel carbon where applicable"
        - "treated output mass"
      output: "kg pollutant per 1,000 kg treated conforming product"
      source_ids:
        - eu-2022-2110-fmp-bat
    - id: calc_shipment_component_mass
      applies_to: "thread protectors and softwood dunnage"
      rule: "supplied mass = item count × verified mean unit mass; reweigh when component design or material changes"
      inputs:
        - "item count"
        - "sampled unit mass"
        - "returned items"
      output: "kg supplied material per 1,000 kg reference product"
      source_ids:
        - api-5ct-11
    - id: calc_mass_reconciliation
      applies_to: "principal steel and ferrous outputs"
      rule: "Reconcile opening stock + purchased coil + other included steel components with closing stock + conforming product steel mass + exported steel scrap + documented inventory change. Explain unresolved imbalance without forcing closure."
      inputs:
        - "coil and coupling inputs"
        - "stock changes"
        - "conforming product"
        - "steel scrap"
        - "internal transfers"
      output: "documented steel mass-balance residual"
      source_ids:
        - cbsa-octg3-2021
        - jfe-speciality-pipe-tube
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain product kind, grade, dimensions, welded technology, heat treatment, connection, coupling, coating, marking, test status, governing specification edition, and net-mass convention for every included product family."
      evidence: "Product specification, mill test certificate, order, and inspection record; api-5ct-11"
    - id: dq_technology_scope
      applies_to: "process boundary"
      requirement: "Identify which operations are onsite, outsourced, or absent and whether data represent ERW or HFW equipment, seam annealing, full-body heat treatment, threading, coupling, coating, and bundling."
      evidence: "Process flow diagram, equipment list, supplier record, and cbsa-octg3-2021/jfe-speciality-pipe-tube comparison"
    - id: dq_temporal_representativeness
      applies_to: "all foreground records"
      requirement: "Use a common representative period of at least 12 consecutive months where production is continuous; justify a shorter complete campaign and disclose shutdowns, trials, and abnormal lots."
      evidence: "Dated meter, production, purchase, stock, and waste records"
    - id: dq_completeness
      applies_to: "all boundary exchanges"
      requirement: "Reconcile principal material, energy, water, fuel, chemicals, packaging, wastes, and direct monitored emissions against the process-flow and environmental-stream inventories; do not hide an exchange inside a plural utility or waste row."
      evidence: "Reconciliation workbook and process-chemical/wastewater/waste-gas inventory following eu-2022-2110-fmp-bat"
    - id: dq_meter_and_scale_quality
      applies_to: "measured amounts"
      requirement: "Record instrument id, calibration status, resolution, coverage, missing-data treatment, and allocation method for every material meter or scale."
      evidence: "Calibration certificates, meter exports, scale tickets, and gap log"
    - id: dq_upstream_matching
      applies_to: "upstream datasets"
      requirement: "Match coil to grade family, steelmaking/rolling route, geography, and year; match electricity, gas, water, chemicals, treatment, and packaging to supply geography and product state."
      evidence: "Supplier primary data or documented dataset-selection matrix"
    - id: dq_uuid_traceability
      applies_to: "TianGong identities"
      requirement: "Use only directly verified public state-100 UUIDs. Keep UUID-empty rows explicit until an exact identity is verified; never substitute a proxy."
      evidence: "Finalized hybrid-search receipts and manifest unresolved register"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference_product"
    rule: "Confirm exactly 1,000 kg net conforming product, the CPC 41286 TianGong reference UUID, and every required qualifier. Verify coupling inclusion and packaging exclusion from reference mass."
    source_ids:
      - un-cpc-3-0-2025
      - api-5ct-11
  - rule_id: validate_welded_route
    applies_to: "product_and_process_identity"
    rule: "Reject datasets for seamless casing/tubing, line pipe, drill pipe, general welded tube, or a route that does not form and longitudinally weld flat-rolled steel feedstock."
    source_ids:
      - un-cpc-3-0-2025
      - cbsa-octg3-2021
      - jfe-speciality-pipe-tube
  - rule_id: validate_process_completeness
    applies_to: "foreground_inventory"
    rule: "Check the declared process flow against coil preparation, forming/welding, conditional heat treatment, finishing/testing, conditional coating/coupling, and shipment preparation; explain every absent conditional stage."
    source_ids:
      - cbsa-octg3-2021
      - jfe-speciality-pipe-tube
  - rule_id: validate_atomic_exchanges
    applies_to: "inventory_rows"
    rule: "Confirm every inventory row is one physical, chemical, waste, or energy exchange and that electricity, natural gas, water, cutting fluid, coating, packaging components, wastes, and each direct emission remain separate."
    source_ids:
      - eu-2022-2110-fmp-bat
  - rule_id: validate_mass_balance
    applies_to: "steel_mass_reconciliation"
    rule: "Review the steel mass-balance residual and supporting stock changes. Do not force the balance by changing the fixed reference flow or silently netting scrap credits."
    source_ids:
      - cbsa-octg3-2021
      - jfe-speciality-pipe-tube
  - rule_id: validate_water_and_energy
    applies_to: "meters_and_recirculation"
    rule: "Confirm electricity is converted consistently, natural-gas reference conditions are declared, make-up water is not confused with recirculated water, and water discharge is not double counted."
    source_ids:
      - eu-2022-2110-fmp-bat
  - rule_id: validate_uuid_and_language
    applies_to: "bilingual_identity"
    rule: "Confirm every UUID-bearing Chinese flow display uses the exact TianGong Chinese baseName and every UUID-empty row appears in manifest review metadata."
    source_ids: []
  - rule_id: validate_range_evidence
    applies_to: "quantitative_ranges"
    rule: "Reject an externally inferred range unless at least two independent original sources have compatible factory-gate boundary, functional unit, and product state and the synthesis explains geographic and technological differences."
    source_ids: []
published_dataset_profile:
  dataset_role: "Factory-gate secondary dataset for welded steel oil/gas well casing or tubing production"
  downstream_use: "secondary_dataset; may serve as a background_dataset only for a matching declared product, route, geography, grade/delivery condition, and time period"
  allowed_use: "Foreground data-package construction; product and process LCI; cradle-to-gate or broader life-cycle models when the reference product and boundary are matched"
  excluded_use: "Seamless OCTG, line pipe, drill pipe, generic welded tube, unqualified global average, installed well service, or automatic substitution across different grade, connection, heat-treatment, coating, or packaging states"
  required_metadata: "All reference-flow qualifiers; site and country; reference year; coil steel route and supplier geography; ERW/HFW technology; included operations; grade heat treatment; connection/coupling; coating; test regime; packaging; water recirculation; emissions method; allocation; upstream datasets; UUID status"
  required_quality_disclosure: "Primary-data share and period; metering and calibration; allocation fractions; steel mass-balance residual; missing records; outsourced operations; representativeness limits; unresolved UUIDs; unresolved range evidence; exclusions and deviations"
  update_trigger: "Change in principal steel route or supplier geography; ERW/HFW line technology; furnace fuel or heat-treatment route; product grade mix; connection/coating/packaging state; water or emission controls; allocation; reference year; governing standard edition; or any change exceeding the study's significance threshold"
