system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "foreground_system"
      rule: "Include operations from receipt of hot-rolled steel coil or skelp through ERW/HFW forming and welding, required heat treatment, finishing, inspection, testing, marking, declared coating, and shipment preparation to the factory gate."
      source_ids:
        - cbsa-octg3-2021
        - jfe-speciality-pipe-tube
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased_materials_and_energy"
      rule: "Link every purchased material, electricity, fuel, water, treatment service, and packaging input to an upstream dataset matched to its declared geography, technology, and product state. Steelmaking is upstream of the coil input and shall not be recreated inside the pipe-mill foreground process unless physically integrated and separately measured."
      source_ids:
        - eu-2022-2110-fmp-bat
    - rule_id: boundary_conditional_operations
      applies_to: "heat_treatment_connections_coating_packaging"
      rule: "Include full-body heat treatment, upsetting, threading, coupling, protective varnish, and shipment-protection exchanges only when the declared grade, connection, order, or shipment state requires the individual operation or material."
      source_ids:
        - api-5ct-11
        - cbsa-octg3-2021
        - jfe-speciality-pipe-tube
    - rule_id: boundary_internal_transfers
      applies_to: "intermediate_pipe_states"
      rule: "Do not create product exchanges for green pipe or other intermediate pipe states transferred wholly inside the same foreground system. If an intermediate is purchased from or sold to another facility, model the actual product transfer as a separate dataset and disclose the split."
      source_ids:
        - cbsa-octg3-2021
    - rule_id: boundary_downstream_exclusion
      applies_to: "downstream_life_cycle"
      rule: "Exclude outbound distribution after the manufacturing factory gate, well construction, in-well use, maintenance, workover, and end-of-life."
      source_ids:
        - un-cpc-3-0-2025
boundary_abstraction:
  declared_starting_condition: "Hot-rolled steel coil or skelp received at the welded-pipe manufacturing site, with grade, width, thickness, supplier, production route, and upstream dataset declared"
  starting_condition_role: "Purchased principal steel feedstock entering the foreground ERW/HFW pipe-manufacturing system"
  product_classification_scope: "Welded steel casing and tubing for oil or gas wells; not seamless OCTG, line pipe, drill pipe, or generic welded tube"
  recursive_input_rule: "Purchased finished casing or tubing in this same category is recorded as a separate upstream product dataset and its mass is disclosed; it is not relabelled as hot-rolled coil. Same-site rework that never leaves the foreground boundary is an internal transfer and is not counted as a new input."
  upstream_dataset_requirement: "Supplier-specific coil data are preferred; otherwise use a dataset matched to steel grade family, steelmaking route, rolling technology, geography, and reference year. All other purchased inputs require product-state and geography matching."
  disclosure: "Declare coil source and grade; ERW/HFW technology; site integration; heat-treatment route; connection and coupling state; coating; testing; packaging; scrap destination; water recirculation; wastewater treatment; energy supply; allocation; and any excluded operation"
