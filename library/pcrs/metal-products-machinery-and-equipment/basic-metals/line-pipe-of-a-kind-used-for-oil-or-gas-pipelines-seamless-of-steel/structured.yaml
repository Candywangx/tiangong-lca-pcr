measurement_rules:
  - id: reference_mass
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "cp_final_product measures D; each exchange normalizes its attributable period amount by D."
  - id: conversion
    applies_to: "all exchanges"
    required_property_ref:
      name: "Row-specific property"
      uuid: ""
    required_unit: "kg; m3; kWh; MJ"
    rule: "Retain raw units and conversion evidence: 1 kWh = 3.6 MJ. Fuel volume needs measured net calorific value at declared temperature/pressure; wet wastes need solids and metal fraction."
  - id: balance
    applies_to: "production"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain separate gross masses of received steel, accepted steel body, scrap, wet solids, water and opening/closing work in progress; do not add contained-iron mass to gross steel mass. Close the elemental iron balance on one contained-Fe basis: measured Fe in external feed plus opening work in progress = measured Fe in accepted steel body, external scrap, scale, sludge and effluent plus closing work in progress and every other measured Fe release. Derive each term from its own measured gross mass and Fe assay; use matched concentration and volume for effluent. Retain carbon and each actual alloy-element oxidation, release, retained mass and chemical-reaction records as separate elemental balances. Account for oxygen uptake, water content and actual reaction products; never assume pure iron, common composition, a fixed conversion or an invented yield. Cancel internal rework; retain its repeated energy and chemistry. Close water makeup + opening storage = external transfer + discharge + evaporation + product carryover + closing storage; close acid/chemical active-component stock, reaction, carryover and waste balances with measured uncertainty."
process_map:
  - id: feed_receipt
    name: "Supplier feed receipt and preparation"
    inclusion: "required"
    inclusion_condition: "Receive and trace actual solid feed or purchased hollow tube, declaring supplier operations and temperature."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
  - id: hot_forming
    name: "Feed preparation, heating and seamless hot forming"
    inclusion: "conditional"
    inclusion_condition: "When solid billet/bloom/bar enters: crop/condition, reheat, pierce then elongate and size by actual mandrel/plug/pilger route; include hot extrusion if used. Purchased hollow tube bypasses only supplier-performed operations."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
  - id: cold_finish
    name: "Conditional pickling and cold drawing or pilgering"
    inclusion: "conditional"
    inclusion_condition: "Only when actually used for the declared linepipe: descaling, degreasing, rinse, lubrication and repeated cold reduction; include interpass annealing in heat_treatment."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
  - id: heat_treatment
    name: "Delivery-condition heat treatment and straightening"
    inclusion: "conditional"
    inclusion_condition: "Record actual normalizing, annealing, quench/temper and straightening; do not assume every grade follows every treatment."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
  - id: acceptance
    name: "End finishing, inspection and hydrotest"
    inclusion: "required"
    inclusion_condition: "Cut/bevel, sample and test, perform required NDT and hydrotest, segregate rejects, mark and trace accepted pipe. Test pressure/time comes from the actual order specification."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
  - id: surface_dispatch
    name: "Conditional surface protection and gate dispatch"
    inclusion: "required"
    inclusion_condition: "Record bare, temporarily protected or contract-coated state. Include actual abrasive cleaning, coating/cure, handling and separately measured packaging."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
  - id: water_controls
    name: "Shared water loops and pollution controls"
    inclusion: "required"
    inclusion_condition: "Cooling, descaling, quenching, hydrotest and pickling loops, treatment and air controls; allocate each shared burden once."
    role: "Foreground manufacturing"
    quantitative_reference: "per 1 kg reference flow"
