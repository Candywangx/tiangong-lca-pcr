allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint operations"
    rule: "Prefer subdivision; otherwise substantiate physical causality. Economic allocation is fallback with consistent period/currency/prices and sensitivity; retain unallocated totals. Do not use pipe mass alone as a furnace allocation driver unless it explains grade, heat cycle and loading differences."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_rework
    applies_to: "rework and residue"
    rule: "Retain all repeated processing energy and material for reworked/retested lots. Cancel internal transfer quantities; measure external scrap, scale and sludge separately and apply actual treatment once. Sale alone does not prove co-product status; disclose recycling allocation and never assume an avoided-steel credit."
    source_ids:
      - ef-allocation-2021
