system_boundary:
  rules:
    - rule_id: boundary_manufacturing
      applies_to: "all processes"
      rule: "Include actual preparation, heating, seamless forming, cold finishing if used, all interpass/delivery heat treatment, descaling, end finishing, acceptance, surface operations and attributable utilities through the stated gate."
      source_ids:
        - ec-fmp-bref-2022
        - api-5l-announcement-2026
    - rule_id: boundary_surface
      applies_to: "surface_dispatch"
      rule: "Bare and protected/coated pipe are separate declared states. Include the actual contract coating within the gate; outsourced coating carries supplier processing and transport. Later field-joint coating and installation are excluded."
      source_ids:
        - tenaris-coatings
    - rule_id: boundary_site
      applies_to: "all exchanges"
      rule: "Include proportional handling, maintenance consumables and pollution controls. Justify infrastructure/capital exclusions or link their attributable service. Add every actual chemical, fuel, waste, emission and direct water source as an atomic row; these candidate cards do not replace a site audit."
      source_ids: []
