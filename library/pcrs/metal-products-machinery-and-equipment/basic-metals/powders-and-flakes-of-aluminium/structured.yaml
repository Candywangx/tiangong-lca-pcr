allocation_rules:
  - rule_id: avoid_allocation
    applies_to: "route-separated campaigns and metered operations"
    rule: "Subdivide records by route, campaign, or equipment before allocating shared burdens."
    source_ids:
      - mass-balance-identity
  - rule_id: internal_recycle
    applies_to: "internally returned powder, oversize, and captured aluminium"
    rule: "Keep internal returns inside the boundary, give no co-product credit, and reconcile gross feed to product, exported waste, loss, and stock change."
    source_ids:
      - mass-balance-identity
  - rule_id: shared_grade_allocation
    applies_to: "multiple saleable grades from one inseparable campaign"
    rule: "Directly assign grade-specific operations, then allocate shared burdens by net dry mass; perform an economic sensitivity check when prices differ materially."
    source_ids:
      - mass-balance-identity
  - rule_id: exported_material
    applies_to: "aluminium-bearing material leaving the site"
    rule: "Use the actual contractual destination to classify it as co-product, recyclable material, or waste; disclose the burden or credit convention."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_solid_mass_records
      process_id: "powder_flake_manufacture"
      flow_role: "solid inputs and outputs"
      record_type: "scale, stock, production, and dispatch records"
      raw_fields: "timestamp; material; grade; lot; gross; tare; moisture; opening stock; closing stock; destination; instrument"
      collection_method: "Reconcile receipts, issues, stock change, product, and dispatch by campaign"
      unit: "kg"
      frequency: "each transaction and campaign close"
      temporal_coverage: "representative consecutive campaigns"
      site_scope: "declared line and storage"
      aggregation_rule: "sum net mass by material and campaign, then normalize"
      quality_evidence: "calibration; stock reconciliation; lot and transfer records"
    - protocol_id: cp_energy_and_gas_records
      process_id: "powder_flake_manufacture"
      flow_role: "electricity and each supplied gas"
      record_type: "meter, invoice, tank, and equipment records"
      raw_fields: "timestamp; meter; opening; closing; native unit; gas pressure; gas temperature; equipment; hours; allocation key"
      collection_method: "Prefer dedicated meters; reconcile shared totals and use documented causal allocation"
      unit: "native unit; MJ; m3"
      frequency: "continuous or each shift, monthly reconciliation"
      temporal_coverage: "same campaigns as product"
      site_scope: "line plus documented shared utilities"
      aggregation_rule: "subtract non-production use, assign campaign, normalize"
      quality_evidence: "calibration; invoices; historian; allocation worksheet"
    - protocol_id: cp_water_records
      process_id: "powder_flake_manufacture"
      flow_role: "process-water make-up"
      record_type: "make-up or once-through meter"
      raw_fields: "timestamp; meter; opening; closing; unit; density basis; discharge; hours"
      collection_method: "Meter boundary-crossing water and exclude recirculation"
      unit: "kg"
      frequency: "continuous or each shift, monthly reconciliation"
      temporal_coverage: "same campaigns as product"
      site_scope: "water connections serving the line"
      aggregation_rule: "subtract non-process use and normalize"
      quality_evidence: "calibration; water balance; invoice"
    - protocol_id: cp_direct_emission_records
      process_id: "powder_flake_manufacture"
      flow_role: "direct carbon dioxide and aluminium particulate"
      record_type: "stack, verified emission, or control mass balance"
      raw_fields: "time; pollutant; concentration; exhaust flow; duration; detection limit; control status; method; uncertainty"
      collection_method: "Match net releases after controls to operating campaigns"
      unit: "kg"
      frequency: "per monitoring plan and material change"
      temporal_coverage: "representative operation in dataset period"
      site_scope: "all direct release points"
      aggregation_rule: "integrate campaign release and normalize"
      quality_evidence: "laboratory; calibration; stack test; reconciliation"
  calculation_rules:
    - id: normalize_to_reference_product
      applies_to: "every non-reference exchange"
      rule: "campaign exchange amount divided by net dry conforming product mass"
      inputs:
        - "exchange amount"
        - "product mass"
        - "moisture correction"
      output: "amount per 1 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: reconcile_material_mass
      applies_to: "aluminium-bearing inputs and outputs"
      rule: "feed equals product plus exported aluminium waste plus measured loss plus closing-minus-opening in-process stock, on one moisture basis"
      inputs:
        - feed
        - product
        - waste
        - particulate
        - "stock change"
      output: "mass-balance difference and closure"
      source_ids:
        - mass-balance-identity
    - id: assign_shared_utility
      applies_to: "shared utilities and emissions"
      rule: "Assign dedicated meters first, then residual shared quantity using documented operating time or another causal driver; reconcile to site total."
      inputs:
        - "dedicated readings"
        - "shared total"
        - "causal driver"
        - output
      output: "campaign-assigned amount"
      source_ids:
        - mass-balance-identity
    - id: convert_gas_volume
      applies_to: "supplied gases"
      rule: "Convert native quantity to m3 at one declared pressure and temperature and retain native readings and inputs."
      inputs:
        - "native quantity"
        - pressure
        - temperature
        - convention
      output: "m3 at declared conditions"
      source_ids: []
  data_quality_requirements:
    - id: dq_temporal
