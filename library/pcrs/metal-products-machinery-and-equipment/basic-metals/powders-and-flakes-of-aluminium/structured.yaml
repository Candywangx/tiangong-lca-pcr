      evidence: "campaign and maintenance logs"
    - id: dq_technology
      applies_to: "route and equipment"
      requirement: "Identify atomizer or mill, atomizing gas, melting, classifier, dust control, and packaging represented."
      evidence: "equipment list, process flow diagram, procedure"
    - id: dq_geography
      applies_to: "site and upstream links"
      requirement: "State site geography and use upstream datasets consistent with supply geography and state."
      evidence: "site metadata, supplier records, link review"
    - id: dq_product
      applies_to: "reference product"
      requirement: "Report grade, composition, powder or flake, particle size, morphology, moisture, surface treatment or lubricant, and packaging."
      evidence: "specification and certificate of analysis"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Mark prescribed rows present, zero with evidence, or not applicable with route reason; add other material exchanges atomically."
      evidence: "signed checklist and balance"
    - id: dq_uncertainty
      applies_to: "measured and allocated amounts"
      requirement: "Record resolution, calibration, sampling uncertainty, allocation share, and missing-data treatment."
      evidence: "calibration, laboratory, and calculation records"
