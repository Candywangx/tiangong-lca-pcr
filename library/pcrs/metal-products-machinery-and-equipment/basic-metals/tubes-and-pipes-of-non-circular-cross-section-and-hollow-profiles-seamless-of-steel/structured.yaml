allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "foreground_processes"
    rule: "Avoid allocation by metering and subdividing hot forming, finishing, ancillary energy, water treatment, and recovery operations wherever technically possible."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_internal_recovery
    applies_to: "internal_scale_scrap_and_intermediates"
    rule: "Record internal transfers as matched outputs and inputs and assign no external credit; only the net quantity crossing the site boundary may receive an upstream treatment or recovery dataset."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_exported_coproduct
    applies_to: "exported_material_with_market_function"
    rule: "When scale, scrap, or another material leaves the site with a documented market function, prefer system expansion using a functionally equivalent displaced product and disclose the substitution; if the applicable programme forbids system expansion, use a justified physical relation and report sensitivity."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_hot_forming_material_balance
      process_id: "hot_forming_and_sizing"
      flow_role: "billet input, intermediate output, mill scale, and steel scrap"
      record_type: "weighbridge, scale, production, and stock records"
      raw_fields: "timestamp; batch; grade; input mass; intermediate mass; scale mass and basis; scrap mass; stock change; destination"
      collection_method: "Calibrated weighing and batch reconciliation"
      unit: "kg"
      frequency: "Per batch with monthly reconciliation"
      temporal_coverage: "At least one representative production year"
      site_scope: "Reporting hot-forming line"
      aggregation_rule: "Sum accepted records, adjust for verified stock change, then divide by hot-formed output"
      quality_evidence: "calibration record; batch reconciliation; grade traceability; destination record"
    - protocol_id: cp_hot_forming_energy
      process_id: "hot_forming_and_sizing"
      flow_role: "natural gas and alternating current"
      record_type: "fuel meter, electricity meter, and production records"
      raw_fields: "meter period; opening and closing readings; reference conditions; electricity unit; conversion factor; allocation basis; output mass"
      collection_method: "Calibrated submeter or documented allocation from site meter"
      unit: "m3 and MJ"
      frequency: "Meter interval with monthly reconciliation"
      temporal_coverage: "Same representative year as production"
      site_scope: "Reporting line and attributable shared equipment"
      aggregation_rule: "Subtract non-production use, allocate documented shared use, and divide each carrier separately by hot-formed output"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_hot_forming_water
      process_id: "hot_forming_and_sizing"
      flow_role: "process-water make-up"
      record_type: "water meter and recirculation-system records"
      raw_fields: "make-up volume or mass; density; gross circulation; purge; process assignment; output mass"
      collection_method: "Calibrated make-up meter; do not use gross closed-loop circulation"
      unit: "kg"
      frequency: "Meter interval with monthly reconciliation"
      temporal_coverage: "Same representative year as production"
      site_scope: "Hot-forming water circuits"
      aggregation_rule: "Convert volume with documented density when needed, sum make-up only, and divide by hot-formed output"
      quality_evidence: "meter calibration; water balance; circuit diagram"
    - protocol_id: cp_hot_forming_emissions
      process_id: "hot_forming_and_sizing"
      flow_role: "direct fossil carbon dioxide"
      record_type: "stack monitoring or fuel-carbon calculation record"
      raw_fields: "stack result or fuel amount; carbon content; oxidation factor; period; equipment; output mass"
      collection_method: "Verified stack measurement or documented carbon balance from metered fossil fuel"
      unit: "kg"
      frequency: "Monitoring interval or fuel-accounting period"
      temporal_coverage: "Same representative year as production"
      site_scope: "Direct-fired hot-forming sources"
      aggregation_rule: "Sum direct fossil carbon dioxide only and divide by hot-formed output"
      quality_evidence: "monitoring report; fuel certificate; calculation worksheet"
    - protocol_id: cp_finishing_material_balance
      process_id: "finishing_and_dispatch"
      flow_role: "intermediate input, saleable product, and steel scrap"
      record_type: "production, scale, inspection, and stock records"
      raw_fields: "timestamp; batch; grade; intermediate mass; saleable mass; scrap mass; stock change; disposition"
      collection_method: "Calibrated weighing and batch reconciliation"
      unit: "kg"
      frequency: "Per batch with monthly reconciliation"
      temporal_coverage: "At least one representative production year"
      site_scope: "Reporting finishing line"
      aggregation_rule: "Reconcile input, saleable product, scrap, and stock change; normalize to 1 kg saleable product"
      quality_evidence: "calibration record; inspection release; reconciliation; grade traceability"
    - protocol_id: cp_finishing_energy
      process_id: "finishing_and_dispatch"
      flow_role: "alternating current and route-specific natural gas"
      record_type: "fuel meter, electricity meter, furnace log, and production records"
      raw_fields: "meter period; readings; reference conditions; heat-treatment route; electricity unit; conversion factor; output mass"
      collection_method: "Calibrated submeter or documented allocation from site meter"
      unit: "m3 and MJ"
      frequency: "Meter interval with monthly reconciliation"
      temporal_coverage: "Same representative year as production"
      site_scope: "Finishing line and attributable shared equipment"
