      applies_to: "hf_fossil_co2; fd_fossil_co2"
      rule: "Prefer verified stack mass; otherwise calculate direct fossil CO2 from metered fossil fuel, documented carbon content, and oxidation basis, keeping biogenic carbon and upstream emissions separate."
      inputs:
        - "stack measurement or fuel amount"
        - "carbon content"
        - "oxidation basis"
        - "output mass"
      output: "kg fossil CO2 per process output"
      source_ids:
        - worldsteel-lci-methodology-2017
        - eu-jrc-fmp-bref-2022
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "reference product and steel inputs"
      requirement: "Retain grade, alloy family, section geometry, wall thickness, product standard or tolerance, heat treatment, surface state, batch, supplier, and factory-gate traceability."
      evidence: "material certificate; batch traveller; inspection release; product specification"
    - id: dq_temporal_representativeness
      applies_to: "all foreground records"
      requirement: "Use a representative annual period where practicable; records older than five years or shorter periods require a documented representativeness justification."
      evidence: "period coverage report; production schedule; exception justification; worldsteel-lci-methodology-2017"
    - id: dq_meter_and_balance_quality
      applies_to: "material, energy, water, and emissions"
      requirement: "Prefer measured data, retain calibration and conversion records, and perform mass, carbon, energy-carrier, and water-balance checks at the process level."
      evidence: "calibration certificates; reconciliation worksheets; balance checks; worldsteel-lci-methodology-2017; eu-jrc-fmp-bref-2022"
    - id: dq_geography_technology
      applies_to: "foreground and upstream datasets"
      requirement: "Match foreground technology and geography; use supplier or regional electricity and other upstream datasets representative of the reporting period and disclose justified proxies."
      evidence: "technology description; site location; supplier records; upstream dataset metadata"
    - id: dq_complete_atomic_inventory
      applies_to: "all foreground processes"
      requirement: "Add every additional actual fuel, consumable, waste, recovered material, and measured or permitted elementary emission as its own atomic exchange; do not replace them with an umbrella row."
      evidence: "purchase ledger; process recipe; waste manifest; permit report; completeness checklist"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "Confirm the product is steel, seamless, and non-circular; reject a dataset whose reference output is circular, welded, centrifugally cast, cast iron, or lacks grade and dimensional state."
    source_ids:
      - un-cpc-3-0-structure-2025
      - worldsteel-lci-study-2021
  - rule_id: validate_mass_reconciliation
    applies_to: "both_foreground_processes"
    rule: "Reconcile billet or intermediate input, saleable or transferred output, scale, scrap, other atomic material outputs, and stock change; investigate and disclose any residual."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_energy_separation
    applies_to: "energy_inputs"
    rule: "Require electricity, natural gas, and every other actual carrier to be represented separately with consistent conversions, route applicability, upstream dataset, and no double counting."
    source_ids:
      - worldsteel-lci-methodology-2017
      - eu-jrc-fmp-bref-2022
  - rule_id: validate_emission_scope
    applies_to: "direct_emissions"
    rule: "Confirm direct fossil carbon dioxide excludes upstream electricity emissions; add each other reported direct air, water, or soil emission as a separate elementary flow."
    source_ids:
      - worldsteel-lci-methodology-2017
      - eu-jrc-fmp-bref-2022
  - rule_id: validate_intermediate_transfer
    applies_to: "internal_intermediate"
    rule: "Confirm hf_hot_formed_profile_output and fd_hot_formed_profile_input use the same identity, grade, unit, and stock-adjusted amount and are not counted as external production twice."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_range_status
    applies_to: "important_inventory_rows"
    rule: "Do not treat a foreground value as source-backed typical or a QA range until at least two independent, boundary-compatible original sources or a reviewed foreground distribution supports it."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for a specified seamless non-circular steel tube, pipe, or hollow profile"
  downstream_use: "secondary_dataset; background_dataset after methodological review and release"
  allowed_use: "Product carbon-footprint and LCA models that require a mass-based factory-gate steel hollow-profile input and preserve the declared grade, geometry, route, geography, time, allocation, and recycling assumptions"
  excluded_use: "Direct comparison of different grades, shapes, factories, or technologies without an equivalent function and harmonized boundaries; use-stage performance; downstream fabrication; undisclosed substitution for circular or welded pipe"
  required_metadata: "PCR id and version; reference UUID; steel alloy family and grade; section geometry and dimensions; product standard or tolerance; route; heat treatment; surface state; coating and packaging inclusion; site and geography; reference year; factory gate; allocation; upstream dataset versions; unresolved UUIDs and range status"
  required_quality_disclosure: "Data coverage; meter and scale calibration; mass and carbon reconciliation; allocation or substitution; internal recovery; upstream representativeness; exclusions; proxy data; uncertainty; review status"
  update_trigger: "Change in steel grade family, billet source or steelmaking route, piercing or extrusion technology, shaping or heat-treatment route, energy or water system, recovery destination, allocation method, factory gate, geography, or representative production period"
