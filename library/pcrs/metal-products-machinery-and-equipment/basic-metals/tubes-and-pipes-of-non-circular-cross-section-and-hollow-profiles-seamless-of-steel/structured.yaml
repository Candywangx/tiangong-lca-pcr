system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary starts with received steel billet or solid bar and ends with conforming, saleable non-circular seamless steel tube or hollow profile at the manufacturing-site gate. It includes internal handling, billet preparation, reheating, piercing or extrusion, elongation, sizing or shaping, cooling, route-specific heat treatment, straightening, cutting, inspection, marking, and attributable on-site ancillary services. Upstream production and transport of billet, electricity, fuel, water, and other separately added consumables shall be linked as background datasets. Direct emissions, wastes, and recovered materials crossing the foreground boundary shall be recorded as separate atomic exchanges."
      source_ids: []
    - rule_id: boundary_factory_gate
      applies_to: "foreground_system"
      rule: "Include operations from received billet or solid bar through the saleable finished product at the manufacturing-site gate, plus attributable on-site ancillary services; exclude downstream installation, use, and end-of-life."
      source_ids:
        - worldsteel-lci-methodology-2017
        - worldsteel-lci-study-2021
    - rule_id: boundary_atomic_completeness
      applies_to: "all_foreground_processes"
      rule: "Record every material, energy, waste, recovered-material, and direct elementary exchange that crosses a foreground process boundary as a separate atomic row; explain any verified exclusion."
      source_ids:
        - worldsteel-lci-methodology-2017
        - eu-jrc-fmp-bref-2022
    - rule_id: boundary_no_double_count
      applies_to: "upstream_and_internal_recovery"
      rule: "Do not double count supplier operations, internally recirculated intermediates, recovered scale or scrap, wastewater treatment, or recycling credits across foreground and upstream datasets."
      source_ids:
        - worldsteel-lci-methodology-2017
boundary_abstraction:
  declared_starting_condition: "Steel billet or solid bar received at the seamless hollow-profile manufacturing site, with grade, mass, moisture or surface basis where relevant, supplier, origin, and transport handover declared"
  starting_condition_role: "Upstream product input to the first foreground hot-forming process"
  product_classification_scope: "Seamless steel tubes, pipes, and hollow profiles with a finished non-circular cross-section; circular, welded, centrifugally cast, and cast-iron products are outside scope"
  recursive_input_rule: "If a purchased input is already a seamless non-circular steel tube or hollow profile in this same product category, model it once as an upstream product with its own dataset and begin foreground collection at the first transformation performed by the reporting site; do not reproduce the supplier's earlier operations."
  upstream_dataset_requirement: "Use geographically and technologically representative upstream datasets for billet or bar, alternating current, natural gas, process water, and every separately added consumable; preserve supplier-specific data when verified."
  disclosure: "Declare billet or bar state, steelmaking route where known, alloy family and grade, piercing or extrusion technology, shaping sequence, heat treatment, surface treatment, internal recovery, packaging inclusion, geography, reference year, and the exact factory gate."
