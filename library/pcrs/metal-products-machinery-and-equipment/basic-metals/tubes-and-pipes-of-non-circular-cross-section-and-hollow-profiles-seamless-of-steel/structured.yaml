  calculation_rules:
    - id: calc_normalize_process_rows
      applies_to: "every inventory row"
      rule: "Normalized amount = verified period or batch exchange divided by the matching process output; final-process rows are then expressed per 1 kg saleable product."
      inputs:
        - "exchange record"
        - "process output"
        - "stock change"
        - "conversion factor where applicable"
      output: "amount in the row's declared unit per process output or reference flow"
      source_ids:
        - worldsteel-lci-methodology-2017
        - worldsteel-lci-study-2021
    - id: calc_intermediate_reconciliation
      applies_to: "hf_hot_formed_profile_output; fd_hot_formed_profile_input"
      rule: "Finishing input = hot-forming output + opening intermediate stock - closing intermediate stock - separately documented loss before finishing."
