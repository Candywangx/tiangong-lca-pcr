  unresolved:
    inventory_flow_uuids:
      - row_id: input_hot_rolled_flat_steel
        reason_code: product_state_mismatch
        explanation: "Receipt 33c0a89d-cc32-4025-9fb8-88f5e3f6ad24 returned alloy, further-worked, high-speed or below-600-mm-only products; none exactly represents the width-neutral hot-rolled non-alloy flat-steel row."
      - row_id: input_cold_rolled_flat_steel
        reason_code: semantic_mismatch
        explanation: "Receipt 55290e59-b9b3-470c-ab93-ec0e6aa8dea9 returned alloy, high-speed, galvanized, bar or internally inconsistent bilingual identities; none exactly represents the declared cold-rolled non-alloy flat-steel row."
      - row_id: input_hot_rolled_section
        reason_code: no_exact_candidate
        explanation: "Receipt 29a35357-1c31-4472-8524-e30a84e65d04 returned a large-section-only flow and broader, cold-processed, welded or inconsistent alternatives; no exact generic hot-rolled non-alloy section flow was verified."
      - row_id: input_same_category_section
        reason_code: internal_intermediate_needs_new_flow
        explanation: "Receipt a5806a70-3925-4dc8-a405-581f22a25830 confirmed that no candidate carries the distinct incoming semi-finished processing state; a qualified intermediate product flow is required."
      - row_id: cold_forming_lubricant
        reason_code: semantic_mismatch
        explanation: "Receipt 6c8236a9-9633-4938-b193-010b555ae3fe returned rolling oils without verified mineral-oil composition and other lubricant products with different uses; no exact mineral-oil cold-forming lubricant was verified."
      - row_id: hydrochloric_acid
        reason_code: no_exact_candidate
        explanation: "Receipt 2819a77b-94bd-486c-9262-8df42eff6c05 returned inconsistently classified generic flows and specific 30%, 32% or 36% products; the actual foreground concentration must determine a future exact link."
      - row_id: sodium_hydroxide
        reason_code: no_exact_candidate
        explanation: "Receipt 4698beac-7269-4f56-a882-a1a15d68c89e returned mutually distinct 30%, 50% and 0.2 N products plus other chemicals; the actual foreground concentration must determine a future exact link."
      - row_id: kraft_paper
        reason_code: semantic_mismatch
        explanation: "Receipt 02cd7fce-5ec4-4967-b44f-258372a0ca6a returned graphic, super-calendered, bag, corrugated or wet-web products; no exact uncoated kraft packaging-paper flow was verified."
      - row_id: wood_pallet
        reason_code: semantic_mismatch
        explanation: "Receipt bfcc73b8-f046-4155-a3ea-d987ff5d62b6 returned pallet flows without both softwood construction and reuse state, or with conflicting classification, property or material."
      - row_id: reference_product
        reason_code: no_exact_candidate
        explanation: "Receipt cc519eb2-cb11-4f79-a082-cf19aa103a5d returned CPC 41251 hot-worked sections, CPC 41261 bars or rods, CPC 41252 welded sections and other mismatches; no exact CPC 41262 finished-section flow was verified."
      - row_id: spent_oil_emulsion
        reason_code: semantic_mismatch
        explanation: "Receipt 39fa5be7-005a-40f0-89a9-cf809ea3ac57 returned coolant, cutting oil, generic waste oil or an umbrella oil-and-coolant waste; none establishes the required chemistry, emulsion state and cold-forming origin."
      - row_id: spent_pickling_liquor
        reason_code: semantic_mismatch
        explanation: "Receipt f2221bbd-e8b1-4001-ad53-705b13e3e1ab returned phosphorous acid, generic waste acid, waste alkali or pulp black liquor; no exact spent hydrochloric-acid steel pickling liquor was verified."
      - row_id: iron_hydroxide_sludge
        reason_code: semantic_mismatch
        explanation: "Receipt 49c6d9f7-5e67-49c0-9997-7a09bcbb8f25 returned generic or municipal sewage sludge and wastewater; none establishes iron-hydroxide composition, industrial origin and dewatered state."
      - row_id: nitrogen_oxides_air
        reason_code: semantic_mismatch
        explanation: "Receipt 50d4dc4b-b3db-4157-bc4b-2a2644f81b79 returned nitrite flows rather than nitrogen oxides expressed as nitrogen dioxide; no exact candidate was verified."
      - row_id: mineral_oil_mist_air
        reason_code: semantic_mismatch
        explanation: "Receipt b5e8c87d-7b34-4f41-af32-b0c8ce04950b returned white mineral oil, which is narrower than the generic declared lubricant chemistry, and several candidates use another air compartment."
      - row_id: iron_particulate_air
        reason_code: semantic_mismatch
        explanation: "Receipt 2b61a339-7573-4388-aa6c-ab21f8466714 returned aluminium flows rather than iron-bearing particulate; no exact candidate was verified."
