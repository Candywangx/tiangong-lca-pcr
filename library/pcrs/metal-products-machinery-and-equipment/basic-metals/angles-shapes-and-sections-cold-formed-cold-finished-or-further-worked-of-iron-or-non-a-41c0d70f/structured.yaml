  how_much: "1 kg of conforming finished section, excluding packaging mass"
  how_well: "Meets the declared steel grade, section geometry, dimensional tolerance, surface condition and order or applicable product specification"
  how_long_or_cycle: "One production reporting period and production lot at factory gate; no use-stage service life is assigned"
