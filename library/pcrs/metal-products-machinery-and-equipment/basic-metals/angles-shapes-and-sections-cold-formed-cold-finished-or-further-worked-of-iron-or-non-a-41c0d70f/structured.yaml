    applies_to: "all mass exchanges"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg/kg reference product"
    rule: "Convert reporting-period totals to kg per kg net conforming product using the same reporting-period denominator; retain unrounded source totals and conversion factors."
