allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "foreground operations"
    rule: "Prefer subdivision and direct meters, scales or batch records for the declared product family so allocation is avoided."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_shared_line
    applies_to: "shared line inputs and emissions"
    rule: "When direct measurement is not practicable, allocate shared exchanges using a documented physical relationship that reflects causation, such as machine time, metered load or processed mass. State the driver and test a materially different plausible driver when allocation changes conclusions."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_scrap
    applies_to: "ferrous process scrap"
    rule: "Treat segregated ferrous process scrap as a waste output at the foreground gate unless a documented expanded model applies a named recycling method. Do not add an end-of-life recycling credit to this gate-to-gate product and do not count internally reworked steel as both input and exported scrap."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_recovered_output
    applies_to: "recovered non-product outputs"
    rule: "Treat a recovered output as a co-product only when its quantity, destination, market demand and substituted function are documented. If system expansion is used, name the substituted product, disclose functional equivalence and conduct sensitivity analysis when the result is material."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_steel_mass
      process_id: "section_manufacturing"
      flow_role: "each declared steel feedstock state"
      record_type: "receiving scale, purchase and material-traceability records"
      raw_fields: "feedstock item id; steel grade; form; prior processing state; supplier; origin; gross, tare and net mass; lot; destination product"
      collection_method: "reconcile calibrated scale tickets to purchase receipts and production issue records for each atomic feedstock row"
      unit: "kg"
      frequency: "each receipt and production issue"
      temporal_coverage: "same reporting period as product output, normally 12 consecutive months"
      site_scope: "all foreground production lines and storage losses serving the declared product"
      aggregation_rule: "sum net consumed mass by feedstock row and product family; exclude inventory change not consumed"
      quality_evidence: "scale calibration, supplier certificate, material test certificate, purchase receipt and inventory reconciliation"
    - protocol_id: cp_energy
      process_id: "section_manufacturing"
      flow_role: "electricity and gaseous natural gas"
      record_type: "revenue meter, submeter and fuel invoice"
      raw_fields: "meter id; opening and closing reading; kWh; gas volume; reference temperature and pressure; supplier; voltage; tariff or mix; equipment or line; downtime"
      collection_method: "use calibrated submeters where available and reconcile to facility invoices; allocate shared use only with the declared driver"
      unit: "kWh, MJ and m3"
      frequency: "at least monthly and at each meter change"
      temporal_coverage: "same reporting period as product output, normally 12 consecutive months"
      site_scope: "all included equipment, ancillary systems and internal handling"
      aggregation_rule: "subtract documented non-foreground loads, convert electricity at 3.6 MJ/kWh and normalize by conforming output mass"
      quality_evidence: "meter calibration, invoices, meter hierarchy, supplier disclosure and allocation worksheet"
    - protocol_id: cp_consumables
      process_id: "section_manufacturing"
      flow_role: "lubricant, process water, hydrochloric acid and sodium hydroxide"
      record_type: "item-specific issue, tank, meter, invoice and inventory records"
      raw_fields: "item id; chemical identity; solution concentration; opening stock; receipts; closing stock; returned quantity; make-up water; process destination"
      collection_method: "calculate consumption separately for each named material from stock balance or calibrated meter"
      unit: "kg and concentration fraction"
      frequency: "each issue or batch, reconciled monthly"
      temporal_coverage: "same reporting period as product output"
      site_scope: "every included forming, finishing, pickling, rinsing, cooling and treatment system"
      aggregation_rule: "opening stock plus receipts minus closing stock minus documented returns, by atomic row"
      quality_evidence: "calibrated tank or meter record, safety data sheet, concentration analysis, invoice and stock reconciliation"
    - protocol_id: cp_packaging
      process_id: "section_manufacturing"
      flow_role: "steel strap, kraft paper, LDPE film and reusable wood pallets"
      record_type: "packaging issue and dispatch records"
      raw_fields: "packaging item id; material; unit mass; quantity issued; quantity returned; damaged quantity; reuse-pool trips; dispatched product mass"
      collection_method: "weigh representative units and reconcile item-specific issues to dispatch records"
      unit: "kg and item count"
      frequency: "each dispatch batch, reconciled monthly"
      temporal_coverage: "same reporting period as product output"
      site_scope: "packaging used for the declared product at the foreground facility"
      aggregation_rule: "calculate each material mass separately; for pallets use measured pallet mass divided by verified trips only when a documented reuse pool exists"
      quality_evidence: "unit-weight checks, issue records, dispatch records, return logs and reuse-pool register"
    - protocol_id: cp_product_mass
      process_id: "section_manufacturing"
      flow_role: "conforming finished section"
      record_type: "calibrated product scale, piece count and dimensional record"
      raw_fields: "product id; grade; cross-section; length; piece count; unit mass basis; measured net mass; rejected mass; release status; packaging tare"
      collection_method: "determine net conforming mass from calibrated scale records or verified piece count times measured unit mass, excluding packaging"
      unit: "kg"
      frequency: "each production or dispatch lot"
      temporal_coverage: "same reporting period as all inputs and outputs"
      site_scope: "all conforming lots represented by the dataset"
      aggregation_rule: "sum released net mass after subtracting packaging tare and rejected product"
      quality_evidence: "scale calibration, dimensional inspection, release certificate, count reconciliation and packaging tare record"
    - protocol_id: cp_waste
      process_id: "section_manufacturing"
      flow_role: "each segregated waste stream"
      record_type: "waste scale, tank transfer, laboratory and manifest records"
      raw_fields: "waste row id; gross, tare and net mass; liquid concentration or sludge dry solids; origin process; destination; treatment code; internal rework quantity"
      collection_method: "weigh or meter each named waste separately and reconcile storage change and manifests"
      unit: "kg"
      frequency: "each transfer, reconciled monthly"
      temporal_coverage: "same reporting period as product output"
      site_scope: "all included production, abatement and wastewater systems"
      aggregation_rule: "generated waste equals transfers plus closing stock minus opening stock, adjusted for documented internal rework"
      quality_evidence: "calibrated scale or tank, waste manifest, laboratory analysis, recycler receipt and storage reconciliation"
    - protocol_id: cp_air_emissions
      process_id: "section_manufacturing"
      flow_role: "each direct elementary air emission"
      record_type: "continuous monitor, stack test or species-specific calculation record"
      raw_fields: "source id; pollutant species; concentration; flow; operating time; fuel use; fuel carbon content; oxidation factor; control efficiency; test method; detection limit"
      collection_method: "use measured mass where available; otherwise calculate one species at a time from verified site-specific activity data and factor"
      unit: "kg emission and supporting measurement units"
      frequency: "continuous where required or each representative test campaign, reconciled to operating hours"
      temporal_coverage: "same reporting period as product output and representative operating conditions"
      site_scope: "every included combustion, pickling, forming, grinding and abatement source"
      aggregation_rule: "integrate measured mass or multiply verified activity by the species-specific site factor; never reuse an upstream electricity emission here"
      quality_evidence: "monitor calibration, accredited test report, fuel certificate, operating log, factor provenance and abatement record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = reporting-period row amount / reporting-period net conforming finished-section mass"
      inputs:
        - "row total from its collection protocol"
        - "reference_product net mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_steel_mass_balance
      applies_to: "steel-bearing rows"
      rule: "reconcile total steel feedstock mass with conforming product, ferrous scrap, retained inventory change and other separately measured steel-bearing outputs; explain every residual rather than forcing balance"
      inputs:
        - "steel input rows"
        - reference_product
        - ferrous_steel_scrap
        - "inventory change"
      output: "documented steel mass-balance residual"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_shared_exchange
      applies_to: "shared meters and common batches"
      rule: "allocated exchange = shared total × declared causal driver for this product / sum of the same driver for all products served"
      inputs:
        - "shared total"
        - "machine time"
        - "metered load or processed mass by product"
      output: "product-attributed exchange"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_fossil_co2
      applies_to: "fossil_co2_air"
      rule: "use directly measured fossil CO2 mass; if unavailable, calculate from metered natural gas and a documented site-specific carbon content and oxidation factor with consistent units"
      inputs:
        - "natural-gas record"
        - "carbon-content certificate"
        - "oxidation evidence or stack measurement"
      output: "kg fossil CO2 emitted"
      source_ids: []
    - id: calc_reusable_pallet
      applies_to: "wood_pallet"
      rule: "allocated pallet mass = measured pallet mass × pallets lost or supplied / conforming product mass, or measured pallet mass / verified reuse trips when pool accounting demonstrates those trips"
      inputs:
        - "pallet unit mass"
        - issue
        - return
        - "loss and trip records"
        - "product mass"
      output: "kg pallet input per kg product"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and steel feedstock"
      requirement: "Preserve steel grade, material certificate, feedstock state, section geometry, route, surface state and product release linkage from incoming lot to output lot."
      evidence: "material certificates, route cards, inspection and release records"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use one representative 12-month period when practicable. If a shorter period is unavoidable, state and justify it and account for maintenance, campaign, seasonal and product-mix effects."
      evidence: "reporting calendar, production log and representativeness assessment supported by worldsteel-lci-methodology-2017"
    - id: dq_geography_technology
      applies_to: "upstream links and utilities"
      requirement: "Match upstream steel, electricity, fuel and consumable datasets to actual supply geography, technology and delivery state; document every proxy and why it is the closest available dataset."
      evidence: "supplier declaration, dataset metadata and proxy review"
    - id: dq_measurement
      applies_to: "meters, scales and tests"
      requirement: "Retain calibration status, resolution, test method, detection limit and uncertainty or accuracy statement for material measurements. Prefer measured over calculated and calculated over estimated values."
      evidence: "calibration certificates, laboratory reports and meter register"
    - id: dq_completeness
      applies_to: "all included operations"
      requirement: "Reconcile material, energy, product, waste and direct-emission records across the same facility and period, and document the cut-off screen and all exclusions."
      evidence: "mass balance, invoice reconciliation, meter hierarchy, waste manifests and exclusion register"
    - id: dq_uuid_status
      applies_to: "TianGong flow identity"
      requirement: "Keep unresolved UUID cells blank until hybrid discovery and a public state-code 100 direct read confirm semantic identity, flow type, classification, property, unit group, product state, geography, technology and comment."
      evidence: "manifest unresolved register and direct-read audit record"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference product"
    rule: "Reject a data package that omits steel grade, section geometry and dimensions, incoming feedstock state, qualifying cold or further-working operation, surface state, facility geography or reporting period."
    source_ids:
      - un-cpc-3-0-2025
      - un-hs-2017-7216
  - rule_id: validation_reference_mass
    applies_to: "reference flow"
    rule: "Confirm that the reference output is exactly 1 kg net conforming section after normalization and that packaging tare is excluded from product mass but each consumed packaging component is inventoried separately."
    source_ids:
      - worldsteel-lci-methodology-2017
      - eu-jrc-fmp-bref-2022
  - rule_id: validation_route_rows
    applies_to: "conditional inventory rows"
    rule: "For every absent conditional row, require evidence that its named operation or material is absent. Reject blank values or missing records presented as not_applicable."
    source_ids:
      - eu-jrc-fmp-bref-2022
  - rule_id: validation_balance
    applies_to: "steel-bearing inventory"
    rule: "Recalculate the steel mass balance using unrounded reporting-period totals and require an explanation for every discrepancy, inventory change, internal rework and rejected output."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_energy_and_emissions
    applies_to: "utilities and direct emissions"
    rule: "Reconcile electricity and natural gas with invoices and meter hierarchy; ensure direct emissions are restricted to foreground sources and that fossil CO2 is not duplicated from upstream electricity."
    source_ids:
      - worldsteel-lci-methodology-2017
      - eu-jrc-fmp-bref-2022
  - rule_id: validation_allocation
    applies_to: "shared production"
    rule: "Verify subdivision first, reproduce the declared physical allocation calculation, and require sensitivity analysis when another plausible driver materially changes results."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_recursive_input
    applies_to: "same-category input"
    rule: "Verify that a purchased same-category section has one qualified upstream dataset and that only incremental site operations are represented, with no recursive expansion of this PCR."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_uuid
    applies_to: "UUID-bearing rows"
    rule: "Accept only UUIDs supported by a finalized hybrid-search receipt and public state-code 100 direct reads. Keep every non-adopted candidate from the receipts used for an inventory row rejected unless new route facts establish an exact semantic match and a new audit is completed."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production package that may be reviewed and published as a secondary_dataset or background_dataset for the declared section route"
  downstream_use: "Product-system modelling of cold-formed, cold-finished or further-worked iron or non-alloy steel sections when product state, geography, technology and boundary match"
  allowed_use: "Cradle-to-gate models after adding qualified upstream datasets; comparative internal scenarios with an identical reference flow, boundary and allocation method; supply-chain screening with disclosed unresolved flow identities"
  excluded_use: "Direct substitution for hot-only, alloy-steel, stainless-steel, hollow-section, welded structural-section or fabricated-structure datasets; use-stage performance comparisons without an application-specific functional unit; undisclosed geographic or technology proxies"
  required_metadata: "canonical PCR id; product and feedstock qualifiers; facility geography; reporting period; process route and operation flags; reference mass convention; upstream dataset identities; utility supply qualifiers; allocation driver; cut-off screen; waste destinations; unresolved UUID register"
  required_quality_disclosure: "primary-data coverage; measurement and calculation shares; calibration and uncertainty evidence; mass-balance residual; allocation sensitivity; temporal, geographic and technological representativeness; exclusions and proxies; flow-UUID audit status"
  update_trigger: "Change in steel feedstock state or supplier route, section family, cold-processing technology, heat treatment, surface treatment, coating, energy supply, abatement, waste destination, allocation driver, facility geography, or reporting data older than the declared representativeness period"
