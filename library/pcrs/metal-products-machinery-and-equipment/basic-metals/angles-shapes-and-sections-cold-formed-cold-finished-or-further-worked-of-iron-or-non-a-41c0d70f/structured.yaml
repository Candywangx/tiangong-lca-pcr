system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground starts when declared purchased steel feedstock crosses the producing facility gate and ends when the conforming section is packed as applicable and ready for dispatch. The integrated process includes receiving and handling; actual cold forming or cold finishing; cutting, straightening, sizing, punching, drilling, grinding or other further working when performed; conditional pickling, rinsing, drying and neutralization; conditional heat treatment; inspection; internal transport; on-site utility generation; waste handling; abatement; and packing. eu-jrc-fmp-bref-2022 supports the conditional operation and input/output decomposition, while worldsteel-lci-methodology-2017 supports the gate-to-gate boundary and complete recording of energy, materials, wastes and emissions."
      source_ids: []
    - rule_id: boundary_gate_to_gate
      applies_to: "foreground product system"
      rule: "Include every operation and ancillary service performed from receipt of purchased steel feedstock through the section ready for dispatch, including internal transport, on-site utilities, abatement, waste handling and packing when used."
      source_ids:
        - worldsteel-lci-methodology-2017
        - eu-jrc-fmp-bref-2022
    - rule_id: boundary_qualifying_operation
      applies_to: "category eligibility"
      rule: "Confirm that at least one cold-forming, cold-finishing or further-working operation changes the incoming steel into the declared market state; a product that is only hot-worked is outside this PCR."
      source_ids:
        - un-cpc-3-0-2025
        - un-hs-2017-7216
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased inputs"
      rule: "Link each purchased steel state, electricity supply, fuel, chemical, water and packaging component to an upstream dataset matching its geography, technology and delivery state; never recreate upstream steelmaking as an unqualified generic process inside the foreground."
      source_ids:
        - worldsteel-lci-methodology-2017
    - rule_id: boundary_cutoff
      applies_to: "completeness"
      rule: "Record all energetic inputs. An excluded material flow shall be below 1% of mass, energy and environmental relevance for its unit process, and all excluded flows together shall remain below 5%; document the screening and never use cut-off to omit a hazardous or regulated release."
      source_ids:
        - worldsteel-lci-methodology-2017
    - rule_id: boundary_downstream
      applies_to: "excluded life-cycle stages"
      rule: "Exclude outbound distribution, fabrication into a specific structure, installation, use, maintenance, demolition and end-of-life unless a separately declared expanded study adds them without changing this reference flow."
      source_ids:
        - worldsteel-lci-methodology-2017
boundary_abstraction:
  declared_starting_condition: "Purchased iron or non-alloy steel flat product, hot-worked section, or same-category semi-finished section at the foreground facility gate, with mass, grade, form, surface and prior processing state declared"
  starting_condition_role: "Foreground gate that separates purchased steel production from the incremental cold processing and further working represented by this PCR"
  product_classification_scope: "Iron or non-alloy steel angles, shapes and sections that leave the foreground facility in a cold-formed, cold-finished or further-worked state consistent with CPC 3.0 code 41262"
  recursive_input_rule: "When a purchased input is already in this same product category, record it once as input_same_category_section, require an upstream dataset for its incoming state, and model only the additional operations performed in the foreground; do not unfold the same PCR recursively"
  upstream_dataset_requirement: "Use supplier-specific datasets where available, otherwise geographically and technologically representative datasets for each declared steel feedstock, electricity supply, fuel, chemical, water and packaging component; disclose dataset geography, technology, product state and reference year"
  disclosure: "Declare facility, reporting period, steel grade, incoming feedstock route and state, included and absent operations, utility supply conditions, yield and scrap destination, abatement and wastewater route, packaging state, allocation, exclusions and any deviation from this boundary"
