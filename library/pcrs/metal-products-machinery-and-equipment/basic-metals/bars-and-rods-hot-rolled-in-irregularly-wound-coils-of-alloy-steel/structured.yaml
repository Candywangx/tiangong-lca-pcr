allocation_rules:
  - rule_id: allocation_rule_subdivide
    applies_to: "shared_mill_operations"
    rule: "Prefer subdivision or direct lot, meter and mass-record attribution for reheating, rolling, cooling, coiling and finishing before applying allocation."
    source_ids: []
  - rule_id: allocation_rule_internal_returns
    applies_to: "internal_returns"
    rule: "Treat scale, crop ends, rejected rod, water and lubricant returned within the declared foreground system as internal exchanges; do not assign an avoided-product credit or report them again as external outputs."
    source_ids: []
  - rule_id: allocation_rule_residuals
    applies_to: "saleable_residual_outputs"
    rule: "If a saleable residual leaves the foreground system and shared burdens cannot be subdivided, allocate the remaining shared burdens by documented physical mass after separately attributing process-specific burdens; disclose output masses, market status, allocation fraction and sensitivity to an economic alternative."
    source_ids: []
  - rule_id: allocation_rule_no_recycled_content_double_count
    applies_to: "semi_finished_steel_input"
    rule: "Preserve the recycled-content or end-of-life accounting method of the upstream semi-finished alloy-steel dataset and do not add a second scrap credit in the rolling foreground."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "hot_rolling_and_coiling"
      flow_role: "alloy_steel_billet_input; alloy_steel_hot_rolled_coil_output; rejected_alloy_steel_rod_output"
      record_type: "certified weighbridge, scale, production and inventory records"
      raw_fields: "heat or lot id; grade; feed mass; saleable coil mass; reject mass; crop-end mass; opening and closing work-in-process; scale id; calibration status"
      collection_method: "Link weighed inputs and outputs to heat or production-lot identifiers and reconcile inventory change"
      unit: "kg"
      frequency: "each heat or lot; aggregate monthly"
      temporal_coverage: "at least 12 consecutive representative months, or the full campaign when shorter"
      site_scope: "all lines and lots represented by the dataset"
      aggregation_rule: "Sum verified lot records, adjust for inventory change, then normalize by verified net saleable product mass"
      quality_evidence: "calibrated-scale certificates; production reconciliation; grade certificates; inventory sign-off"
    - protocol_id: cp_electricity_metering
      process_id: "hot_rolling_and_coiling"
      flow_role: "hot_rolling_electricity_input"
      record_type: "revenue, submeter or verified energy-management records"
      raw_fields: "meter id; start and end reading; meter unit; line or equipment scope; outage; production lot or period; supplier; voltage; geography; calibration"
      collection_method: "Prefer line submeters; otherwise attribute site-meter electricity using documented operating hours or equipment load after subtracting non-foreground uses"
      unit: "kWh or MJ"
      frequency: "continuous or shift readings; aggregate monthly"
      temporal_coverage: "same representative period as product output"
      site_scope: "all included rolling-mill equipment and attributable auxiliaries"
      aggregation_rule: "Sum attributable delivered electricity and convert to MJ without applying a primary-energy factor"
      quality_evidence: "meter calibration; invoices; submeter map; reconciliation to site total"
    - protocol_id: cp_natural_gas_metering
      process_id: "hot_rolling_and_coiling"
      flow_role: "reheating_natural_gas_input"
      record_type: "corrected gas-meter and supplier records"
      raw_fields: "meter id; volume; temperature; pressure; moisture basis; correction factor; burner and furnace id; production period; supplier geography"
      collection_method: "Read furnace or line meters; reconcile corrected volume to supplier invoices and production operating periods"
      unit: "m3"
      frequency: "continuous or shift readings; aggregate monthly"
      temporal_coverage: "same representative period as product output"
      site_scope: "every reheating or holding furnace included in the dataset"
      aggregation_rule: "Sum volume at one declared reference condition and allocate only documented shared-furnace use"
      quality_evidence: "meter calibration; supplier invoices; correction certificate; furnace operating log"
    - protocol_id: cp_water_metering
      process_id: "hot_rolling_and_coiling"
      flow_role: "process_water_input; cooling_water_blowdown_output"
      record_type: "intake, make-up, return and blowdown meter records"
      raw_fields: "meter id; intake; purchased make-up; exported return; blowdown; line scope; date; water source; water density and reference condition; treatment destination"
      collection_method: "Reconcile water-loop meters and distinguish internal recirculation from boundary-crossing make-up and blowdown"
      unit: "m3 raw readings; kg reported process-water input"
      frequency: "daily or shift readings; aggregate monthly"
      temporal_coverage: "same representative period as product output"
      site_scope: "rolling, descaling and cooling water systems attributable to the product"
      aggregation_rule: "Calculate net boundary-crossing volumes, convert the process-water input to mass using documented density, and allocate shared systems using documented throughput or operating time"
      quality_evidence: "meter calibration; density record; water balance; utility invoice; discharge or treatment record"
    - protocol_id: cp_lubricant_records
      process_id: "hot_rolling_and_coiling"
      flow_role: "rolling_lubricant_input; spent_rolling_lubricant_output"
      record_type: "purchase, issue, recovery and waste-dispatch records"
      raw_fields: "product identity; issued mass; purchased mass; recovered mass; opening and closing stock; spent mass; destination; production period"
      collection_method: "Reconcile stores and waste records by chemically specific lubricant and line"
      unit: "kg"
      frequency: "each issue and dispatch; aggregate monthly"
      temporal_coverage: "same representative period as product output"
      site_scope: "all included rolling equipment"
      aggregation_rule: "Consumption equals issues or purchases plus opening stock minus closing stock and verified return to service"
      quality_evidence: "safety data sheet; purchase invoice; stores ledger; waste transfer note"
    - protocol_id: cp_packaging_records
