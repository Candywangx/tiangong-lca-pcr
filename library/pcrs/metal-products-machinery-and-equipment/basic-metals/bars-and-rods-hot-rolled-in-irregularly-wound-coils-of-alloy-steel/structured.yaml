      record_type: "packaging bill of materials and issue records"
      raw_fields: "strap specification; mass per strap or issued mass; number of straps; coil id; opening and closing stock"
      collection_method: "Link strap issues or bill-of-material counts to shipped coils and verify count-to-mass conversion"
      unit: "kg"
      frequency: "each shipped coil; aggregate monthly"
      temporal_coverage: "same representative period as product output"
      site_scope: "all reference-product coils shipped by the represented site"
      aggregation_rule: "Sum verified attached strap mass; exclude it from net reference-product mass"
      quality_evidence: "packaging specification; calibrated sample mass; issue record; shipment record"
    - protocol_id: cp_waste_mass_records
