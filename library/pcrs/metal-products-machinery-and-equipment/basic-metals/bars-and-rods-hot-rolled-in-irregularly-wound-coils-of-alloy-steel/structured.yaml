validation_rules:
  - rule_id: validation_rule_identity
    applies_to: "reference_product"
    rule: "Confirm CPC classification context and every required product qualifier; reject a dataset whose output is straight bar, drawn wire, coated product or another downstream state."
    source_ids:
      - unsd-cpc-3-0-structure-2025
      - unsd-cpc-1-1-chinese
  - rule_id: validation_rule_reference_amount
    applies_to: "reference_flow"
    rule: "Confirm that all exchanges are normalized to exactly 1,000 kg net saleable product and that steel strapping or other packaging is excluded from that mass."
    source_ids: []
  - rule_id: validation_rule_boundary
    applies_to: "system_boundary"
    rule: "Confirm that upstream steelmaking and casting are represented only through the semi-finished feed dataset and that all included hot-rolling stages, direct energy, water, external wastes and direct emissions are covered."
    source_ids:
      - ec-jrc-fmp-bref-2022
  - rule_id: validation_rule_mass_balance
    applies_to: "ferrous_material_balance"
    rule: "Reconcile semi-finished feed, saleable product, mill scale, swarf, rejects, internal returns and work-in-process change; investigate and disclose any material unexplained difference."
    source_ids: []
  - rule_id: validation_rule_energy
    applies_to: "electricity_and_fuel"
    rule: "Reconcile electricity and corrected natural-gas records to the same production period and mill scope; confirm that upstream supply burdens are not duplicated as direct emissions."
    source_ids:
      - us-epa-ap42-steel-minimills-2009
  - rule_id: validation_rule_uuid_status
    applies_to: "tiangong_references"
    rule: "Before activation or publication, directly read and confirm any newly adopted Tiangong UUID as public state_code 100 with matching base name, flow type, classification, property, unit group, state, geography, technology and comment; retain unresolved rows explicitly until then."
    source_ids: []
  - rule_id: validation_rule_ranges
    applies_to: "quantitative_ranges"
    rule: "Do not add an externally inferred range unless at least two mutually independent original sources have compatible system boundary, reference basis and product state and the synthesis explains geography and technology differences."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset suitable, after review, for publication as a secondary_dataset or background_dataset"
  downstream_use: "Product-carbon-footprint, process-LCA and lifecyclemodel studies needing a mill-gate alloy-steel hot-rolled wire-rod coil input"
  allowed_use: "Use when alloy family, grade, product state, mill route, geography, production period, upstream steel route, recycled-content method and reference mass are compatible with the study"
  excluded_use: "Do not use as a proxy for non-alloy-steel rod, straight bar, cold-drawn wire, separately heat-treated or pickled wire rod, coated products, semi-finished steel, or cradle-to-gate steel without the upstream feed dataset"
  required_metadata: "PCR id and version; product and grade qualifiers; reference-flow UUID status; site and geography; period; technology; included stages; semi-finished feed dataset; steel route and recycled-content method; energy suppliers; water boundary; allocation; packaging; waste destinations; direct-emissions method; unresolved identities"
  required_quality_disclosure: "raw-record coverage; meter and scale quality; temporal and technological representativeness; material, energy and water reconciliation; allocation sensitivity; data gaps; UUID and range-evidence status; uncertainty and verification status"
  update_trigger: "Change in alloy family, product state, furnace or rolling technology, upstream steel route, electricity or fuel supply, water system, yield, allocation, packaging, site, representative period, Tiangong reference identity, or applicable product specification"
