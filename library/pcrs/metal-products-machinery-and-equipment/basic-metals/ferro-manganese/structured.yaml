      unit: "kg, kWh, m3, MJ"
      frequency: "each charge or tap and monthly close"
      temporal_coverage: "complete reporting period"
      site_scope: "all furnaces producing declared product"
      aggregation_rule: "mass- and energy-balance aggregation by furnace campaign"
      quality_evidence: "calibrated meters; stock reconciliation; laboratory analyses"
    - protocol_id: cp_smelting_emissions
      process_id: "ferromanganese_smelting"
      flow_role: "CO and particulate releases"
