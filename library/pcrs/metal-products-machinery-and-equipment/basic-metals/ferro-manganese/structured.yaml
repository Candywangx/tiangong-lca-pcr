      requirement: "Use one consistent reporting period and document shutdowns, abnormal campaigns, and control-device bypass."
      evidence: "production calendar and operating logs"
    - id: dq_upstream
      applies_to: "purchased inputs"
      requirement: "Record supplier, geography, product state, composition or grade, and matched upstream dataset version."
