allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "multi-output foreground operations"
    rule: "Use separately metered process subdivision for sintering, smelting, refining, gas treatment, slag handling, and finishing before applying allocation."
    source_ids: []
  - rule_id: allocation_internal_returns
    applies_to: "internal sinter, alloy, dust, and undersize returns"
    rule: "Carry internal returns without a second upstream burden and disclose gross and net quantities so the loop can be audited."
    source_ids: []
  - rule_id: allocation_exported_coproducts
    applies_to: "manganese-rich slag and recovered CO-rich gas"
    rule: "Record each exported co-product as a separate output. If allocation cannot be avoided, state and justify the chosen physical or economic relation, report unallocated results where practicable, and test sensitivity."
    source_ids:
      - eu-jrc-nfm-bref-2017
      - us-epa-ap42-ferroalloy-production
  - rule_id: allocation_waste_treatment
    applies_to: "residues sent to treatment"
    rule: "Assign treatment burdens and credits consistently with the declared waste ownership and recovery boundary; do not treat disposal and product sale as the same destination."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_preparation_records
      process_id: "raw_material_preparation"
      flow_role: "preparation inputs and sinter output"
      record_type: "weighbridge, batch sheet, fuel meter, electricity meter"
      raw_fields: "material id; as-received mass; moisture; Mn grade; fuel quantity; calorific value; electricity; sinter output"
      collection_method: "reconcile batch records to inventory movements and meters"
      unit: "kg, MJ, kWh"
      frequency: "each batch and monthly close"
      temporal_coverage: "same reporting period as reference product"
      site_scope: "all on-site preparation lines"
      aggregation_rule: "sum quantities and normalize to accepted product mass"
      quality_evidence: "calibrated scales and meters; batch reconciliation; laboratory grade results"
