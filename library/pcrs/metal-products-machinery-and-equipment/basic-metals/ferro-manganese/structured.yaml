  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "every inventory row"
      rule: "normalized amount = reporting-period row quantity / reporting-period accepted reference-product mass"
      inputs:
        - "collected row quantity"
        - "accepted saleable mass"
      output: "amount per 1 kg saleable ferro-manganese"
      source_ids: []
    - id: calc_net_internal_returns
      applies_to: "internal sinter, alloy, dust, and undersize loops"
      rule: "disclose gross production and return; count only the net boundary crossing as an external input or output"
      inputs:
        - "gross transfer"
        - "internal return"
        - "external transfer"
      output: "net boundary-crossing quantity"
      source_ids: []
    - id: calc_gas_energy
      applies_to: "recovered CO-rich gas"
      rule: "exported energy = metered standard-volume gas × measured net calorific value"
      inputs:
        - "gas volume"
        - "pressure/temperature correction"
        - "net calorific value"
      output: "MJ exported gas"
      source_ids:
        - eu-jrc-nfm-bref-2017
    - id: calc_stack_release
      applies_to: "monitored air emissions"
      rule: "release mass = corrected dry gas flow × pollutant concentration × operating time, with consistent reference conditions"
      inputs:
        - "gas flow"
        - concentration
        - time
        - "moisture and reference conditions"
      output: "kg pollutant released"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "each process and reporting period"
      rule: "mass-balance gap = total measured mass inputs - total measured mass outputs and quantified releases"
      inputs:
        - "all measured material rows"
      output: "disclosed absolute and percentage gap"
      source_ids: []
