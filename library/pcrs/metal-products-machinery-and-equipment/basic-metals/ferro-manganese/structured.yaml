      record_type: "stack monitoring and carbon balance"
      raw_fields: "gas flow; concentration; operating time; carbon in alloy inputs and outputs; size fraction"
      collection_method: "monitored release or documented carbon-balance calculation"
      unit: "kg"
      frequency: "each campaign or monitoring interval"
      temporal_coverage: "representative refining period"
      site_scope: "all refining emission points"
      aggregation_rule: "aggregate by route and control configuration"
