validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the reference product is welded steel tube or pipe with a declared non-circular closed cross-section and that its UUID, Mass property, kg unit, product state, and required qualifiers are present."
    source_ids:
      - unsd-cpc-3-0-structure-2025
  - rule_id: val_scope_gate
    applies_to: "system boundary"
    rule: "Confirm the dataset starts with purchased coil and ends with accepted unfabricated tube at the manufacturer's gate; separately identify upstream supply, downstream fabrication, coating, installation, use, and end-of-life."
    source_ids:
      - sti-hss-sustainability-guide
  - rule_id: val_route
    applies_to: "process map"
    rule: "Confirm the declared direct-forming or continuous-forming route, weld technology, weld-flash removal practice, and conditional heat-treatment state match the represented inventory."
    source_ids:
      - sti-hss-seam-welds
      - sti-hss-heat-treating-2017
  - rule_id: val_reference_normalization
    applies_to: "inventory amounts"
    rule: "Confirm every external amount is normalized to the same measured accepted-product mass and that internal transfers are excluded from aggregated external inputs and outputs."
    source_ids: []
  - rule_id: val_steel_mass_balance
    applies_to: "steel-bearing flows"
    rule: "Confirm coil input, internal steel transfers, accepted product, each post-industrial steel-scrap stream, stock change, and any documented steel-bearing loss reconcile for the reporting period."
    source_ids: []
  - rule_id: val_energy_water
    applies_to: "electricity, gas, and water"
    rule: "Confirm meters, voltage and supply mix, gas reference conditions, water make-up versus recirculation, conversions, route applicability, and allocation drivers are disclosed."
    source_ids: []
  - rule_id: val_direct_co2
    applies_to: "fossil carbon dioxide"
    rule: "When direct-fired heat treatment applies, confirm direct fossil CO2 is linked to the same gas campaigns and excludes upstream electricity and fuel-supply emissions; otherwise require documented non-applicability for both rows."
    source_ids: []
  - rule_id: val_scrap_recycling
    applies_to: "manufacturing scrap"
    rule: "Confirm each scrap row reports physical mass and destination and that any recycling credit or end-of-life benefit is outside this gate-to-gate inventory and disclosed separately."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: val_data_quality
    applies_to: "dataset release"
    rule: "Confirm temporal alignment, calibration evidence, missing-data treatment, upstream dataset representativeness, row completeness, and wastewater characterization are sufficient for the declared dataset role."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "datasets for welded non-circular steel tubes or pipes with matching feedstock, forming route, weld technology, section, grade, heat-treatment and coating state, geography, period, and manufacturer's gate"
  excluded_use: "seamless or circular tube; cast or open-seam tube; fittings; product-specific oil and gas pipe; project fabrication; coated or heat-treated states not represented by the foreground data; installation, use, or end-of-life"
  required_metadata: "reference flow UUID and qualifiers; site and geography; data period; coil supplier and upstream dataset; forming and weld route; heat-treatment and coating state; process coverage; allocation; scrap and wastewater destination; data-quality rating"
  required_quality_disclosure: "measured versus allocated shares; meter and scale coverage; internal-transfer and steel mass-balance residuals; missing-data treatment; upstream dataset mismatches; uncertainty; unresolved UUIDs and range-evidence needs"
  update_trigger: "material change in feedstock grade or supplier mix, forming or welding technology, section family, heat treatment, coating inclusion, energy or water system, scrap or wastewater route, site, geography, data period, or data quality"
