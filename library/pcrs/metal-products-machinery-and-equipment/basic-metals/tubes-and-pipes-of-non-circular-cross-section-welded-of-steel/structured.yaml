allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "separately measurable lines, batches, and finishing routes"
    rule: "Subdivide direct-forming and continuous-forming campaigns, heat-treated and non-heat-treated products, and separately metered operations before allocating shared burdens."
    source_ids: []
  - rule_id: allocation_internal_transfers
    applies_to: "slit strip and as-welded tube intermediates"
    rule: "Treat internal intermediates as mass-balanced transfers between foreground processes; do not assign an upstream credit, market value, or second external burden to them."
    source_ids: []
  - rule_id: allocation_shared_utilities
    applies_to: "unavoidable shared electricity, water, and site services"
    rule: "Where subdivision or direct metering is not practicable, allocate by a documented causal driver such as equipment time and measured power, water draw, or accepted throughput; mass allocation may be used only when it approximates the physical driver and is sensitivity-tested for material shared burdens."
    source_ids: []
  - rule_id: allocation_manufacturing_scrap
    applies_to: "post-industrial steel scrap"
    rule: "Report physical scrap mass and destination separately. Keep any recycling credit, substitution factor, or end-of-life benefit outside the gate-to-gate inventory and disclose the separately selected recycling method consistently for scrap inputs and outputs."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_coil_receiving
      process_id: "coil_preparation_and_slitting"
      flow_role: "hot-rolled steel coil feedstock"
      record_type: "receiving and stock record"
      raw_fields: "coil id; supplier; grade; width; thickness; gross mass; tare; receipt date; opening and closing stock"
      collection_method: "calibrated weighbridge or coil scale plus inventory reconciliation"
      unit: "kg"
      frequency: "per coil and reporting period"
      temporal_coverage: "representative continuous production period covering declared seasonal and operating variability"
      site_scope: "all coil inputs to the declared line and site"
      aggregation_rule: "consumed mass = receipts + opening stock - closing stock - documented returns; normalize to accepted product"
      quality_evidence: "calibration, supplier certificate, weigh ticket, and stock reconciliation"
    - protocol_id: cp_slitting_electricity
      process_id: "coil_preparation_and_slitting"
      flow_role: "slitting electricity"
      record_type: "electricity meter record"
      raw_fields: "meter id; start and end reading; kWh; voltage; supplier or source; allocation driver; timestamps"
      collection_method: "dedicated submeter or calibrated shared meter"
      unit: "kWh and MJ"
      frequency: "continuous reading aggregated monthly"
      temporal_coverage: "same period as product output"
      site_scope: "coil handling and slitting equipment at the declared site"
      aggregation_rule: "subtract idle or unrelated loads where documented; convert kWh to MJ and normalize to accepted product"
      quality_evidence: "meter calibration, interval export, and allocation worksheet"
    - protocol_id: cp_slit_strip_transfer
      process_id: "coil_preparation_and_slitting"
      flow_role: "slit strip transfer"
      record_type: "internal batch transfer record"
      raw_fields: "batch id; grade; width; thickness; mass; timestamp; destination line"
      collection_method: "calibrated scale or mass-balance transfer ticket"
      unit: "kg"
      frequency: "per batch"
      temporal_coverage: "same period as product output"
      site_scope: "transfer from slitting to forming"
      aggregation_rule: "sum verified transfers and reconcile with coil input, scrap, and stock change"
