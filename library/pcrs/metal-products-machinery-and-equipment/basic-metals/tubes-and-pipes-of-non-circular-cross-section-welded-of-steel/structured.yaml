system_boundary:
  rules:
    - rule_id: sb_start_at_coil_gate
      applies_to: "foreground starting condition"
      rule: "Start foreground collection when purchased steel coil crosses the tube-manufacturing site gate; link its production and inbound transport to separately identified upstream datasets rather than recreating steelmaking inside this foreground system."
      source_ids:
        - sti-hss-sustainability-guide
        - worldsteel-lci-methodology-2017
    - rule_id: sb_include_tube_manufacture
      applies_to: "foreground controlled operations"
      rule: "Include coil receiving and slitting, forming, longitudinal welding, weld-flash removal when performed, sizing, cut-to-length, inspection, internal material transfers, directly controlled utilities, direct releases, and on-site waste handling through accepted product at the manufacturer's gate."
      source_ids:
        - sti-hss-seam-welds
        - sti-hss-sustainability-guide
    - rule_id: sb_route_disclosure
      applies_to: "forming and finishing route"
      rule: "Declare whether the tube is direct-formed or formed round then reshaped; include post-production heat treatment only when it is part of the sale state and identify on-site versus third-party treatment."
      source_ids:
        - sti-hss-seam-welds
        - sti-hss-heat-treating-2017
    - rule_id: sb_exclude_downstream_fabrication
      applies_to: "downstream operations"
      rule: "Exclude project-specific cutting, coping, drilling, connection welding, coating, installation, use, and end-of-life; model them in downstream datasets when required by the study."
      source_ids:
        - sti-hss-sustainability-guide
    - rule_id: sb_no_embedded_recycling_credit
      applies_to: "manufacturing scrap"
      rule: "Report post-industrial steel scrap as a physical waste output and disclose its destination. Do not embed avoided primary steel or end-of-life recycling credit in the gate-to-gate tube inventory; report any recycling method separately and consistently."
      source_ids:
        - worldsteel-lci-methodology-2017
