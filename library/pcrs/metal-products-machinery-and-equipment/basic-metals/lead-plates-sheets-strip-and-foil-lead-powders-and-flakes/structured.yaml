        - us-epa-ap42-12-17-background
    - rule_id: boundary_route_selection
      applies_to: "process_route"
      rule: "Include only route processes that occur for the declared form and mark other conditional routes not applicable."
      source_ids:
        - eu-jrc-nfm-bref-2017
        - cn103128297a-lead-powder-atomization
    - rule_id: boundary_controlled_releases
      applies_to: "direct_emissions_and_residues"
      rule: "Include dross or scrap leaving the system and residual direct lead releases after actual controls; exclude upstream electricity emissions from foreground releases."
