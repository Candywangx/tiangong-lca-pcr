    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground includes refined-lead receipt and handling, applicable melting and casting, applicable flat or particle forming, direct energy and fuel use, controlled fume or particulate capture, residual direct releases, and lead-bearing wastes or scrap. Melting and casting is required when performed at the reporting site; a dataset beginning from purchased cast slab shall disclose that starting condition and omit non-occurring melting exchanges."
