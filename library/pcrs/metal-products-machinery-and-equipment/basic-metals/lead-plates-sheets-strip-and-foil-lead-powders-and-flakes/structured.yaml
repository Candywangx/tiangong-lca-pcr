allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "route_and_product_form"
    rule: "First subdivide meters and batches so only the selected route and product form carry their exchanges."
    source_ids: []
  - rule_id: allocation_internal_returns
    applies_to: "internal_lead_returns"
    rule: "Treat internally remelted offcuts, powder returns, and captured lead returned to this system as internal flows without external credit or burden."
    source_ids: []
  - rule_id: allocation_external_scrap
    applies_to: "lead_scrap_leaving_system"
    rule: "Record lead-bearing scrap or dross leaving the foreground separately without avoided-burden credit; disclose later allocation or substitution outside this PCR."
    source_ids: []
  - rule_id: allocation_shared_services
    applies_to: "shared_energy_and_controls"
    rule: "If subdivision is impossible, use a documented causal driver such as operating time, throughput, or exhaust volume; justify mass allocation if used as fallback."
    source_ids: []
