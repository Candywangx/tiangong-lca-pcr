      elementary:
        []
allocation_rules:
  - rule_id: allocation_subdivide_routes
    applies_to: "mixed pipe products and routes"
    rule: "Subdivide HFW/ERW, HSAW, and LSAW lines and separately metered operations before allocation wherever records permit."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_shared_operations
    applies_to: "shared forming, finishing, utilities, and treatment"
    rule: "Allocate shared burdens by a documented causal driver such as equipment electricity, operating time, processed mass, water volume, or waste-treatment mass; use accepted-product mass only when no more causal measurement exists."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_scrap
    applies_to: "post-industrial steel scrap"
    rule: "Report scrap mass, quality, destination, internal return, and any external recovery separately. Do not assign an avoided-primary-steel credit inside this gate-to-gate dataset unless the downstream study explicitly selects and documents a consistent recycling method."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_recovered_flux
    applies_to: "recovered submerged-arc welding flux"
    rule: "Treat flux returned to the same SAW operation as an internal loop, not a co-product. Record only fresh make-up flux as boundary input and only non-returnable spent flux as waste output."
    source_ids:
      - usitc-welded-line-pipe-2014
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts_issues
      process_id: "forming_welding"
      flow_role: "coil, plate, welding wire, and welding flux"
      record_type: "purchase, weighbridge, warehouse issue, return, and inventory records"
      raw_fields: "material_id; specification; grade; supplier; origin; opening_stock; receipts; issues; returns; recovered_flux; closing_stock; mass"
      collection_method: "Reconcile traceable material lots to route and production lot"
      unit: "kg"
      frequency: "Each receipt and issue; monthly reconciliation"
      temporal_coverage: "At least 12 consecutive representative months or the full shorter production campaign"
      site_scope: "All foreground mill operations producing the declared product"
      aggregation_rule: "Sum net consumption by material and route, then divide by accepted reference-product mass"
      quality_evidence: "Calibrated scales; supplier certificates; warehouse ledger; lot traceability; reconciliation sign-off"
    - protocol_id: cp_process_energy
      process_id: "forming_welding_finishing_testing"
      flow_role: "alternating current"
      record_type: "interval meter, submeter, utility invoice, and equipment allocation records"
      raw_fields: "meter_id; voltage_level; start_reading; end_reading; kWh; production_line; route; operating_hours; allocation_driver"
      collection_method: "Read dedicated meters; allocate shared electricity with documented causal driver"
      unit: "kWh"
      frequency: "Meter interval and monthly close"
      temporal_coverage: "Same period as product output"
      site_scope: "All relevant meters at the foreground site"
      aggregation_rule: "Convert net kWh to MJ and normalize by accepted product mass"
      quality_evidence: "Meter calibration; invoice reconciliation; allocation worksheet; grid or supplier identity"
    - protocol_id: cp_process_fuel
      process_id: "welding"
      flow_role: "natural gas for heat treatment"
      record_type: "gas meter, invoice, and heat-treatment campaign log"
      raw_fields: "meter_id; volume; temperature; pressure; moisture_basis; route; furnace_id; campaign; allocation_driver"
      collection_method: "Meter fuel at furnace or allocate a reconciled site meter using heat-treatment records"
      unit: "m3"
      frequency: "Each campaign and monthly close"
      temporal_coverage: "Same period as applicable heat-treated production"
      site_scope: "On-site heat-treatment equipment"
      aggregation_rule: "Normalize reference-condition volume by accepted applicable product mass"
      quality_evidence: "Meter calibration; invoice reconciliation; reference-condition calculation; campaign log"
    - protocol_id: cp_internal_transfers
      process_id: "forming_welding_finishing_testing"
      flow_role: "formed shell and unfinished welded pipe"
      record_type: "transfer weight, line counter, dimensional record, and mass-balance worksheet"
      raw_fields: "transfer_id; route; count; length; outside_diameter; wall_thickness; measured_mass; calculated_mass; rejects"
      collection_method: "Weigh transfer where practical; otherwise calculate from verified dimensions and density and reconcile to feedstock, scrap, and output"
      unit: "kg"
      frequency: "Each lot or shift"
      temporal_coverage: "Same period as product output"
      site_scope: "Transfers inside the foreground pipe mill"
      aggregation_rule: "Match output and input of each internal intermediate; normalize by accepted product mass"
      quality_evidence: "Transfer record; dimensional inspection; scale calibration; signed mass-balance reconciliation"
    - protocol_id: cp_scrap_and_waste
      process_id: "forming_welding_finishing_testing"
      flow_role: "steel scrap and spent flux"
      record_type: "scrap-bin weights, waste manifest, recovered-flux ledger, and treatment record"
      raw_fields: "waste_id; process_origin; material; gross_mass; tare; net_mass; destination; internal_return; treatment; hazardous_status"
      collection_method: "Weigh each dispatched waste lot and reconcile internal returns separately"
      unit: "kg"
      frequency: "Each dispatch; monthly close"
      temporal_coverage: "Same period as product output"
      site_scope: "All foreground waste collection points"
      aggregation_rule: "Sum net waste by atomic stream and process, then normalize by accepted product mass"
      quality_evidence: "Calibrated scale; waste manifest; consignee receipt; recovered-material ledger"
    - protocol_id: cp_hydrotest_water
      process_id: "finishing_testing"
      flow_role: "process-water make-up and hydrotest wastewater"
      record_type: "inlet and discharge meters, tank balance, recirculation log, and treatment record"
      raw_fields: "inlet_volume; discharge_volume; opening_storage; closing_storage; recirculated_volume; density; water_quality; destination"
      collection_method: "Meter boundary make-up and discharge; use storage balance only when meters are unavailable"
      unit: "kg or m3"
      frequency: "Each test campaign and monthly close"
      temporal_coverage: "Same period as product output"
      site_scope: "Hydrostatic-test system and declared treatment boundary"
      aggregation_rule: "Convert boundary volumes to mass with documented density; exclude internal recirculation from repeated input"
      quality_evidence: "Meter calibration; tank calibration; water analysis; discharge or treatment record"
    - protocol_id: cp_direct_emissions
      process_id: "welding"
      flow_role: "direct fossil carbon dioxide"
      record_type: "continuous monitor, verified emissions report, or site combustion inventory"
      raw_fields: "source_id; fuel_id; monitored_CO2; reporting_method; period; allocation_driver"
      collection_method: "Use site-reported direct emissions and allocate only among products sharing the combustion source"
      unit: "kg"
      frequency: "Continuous or reporting-period total"
      temporal_coverage: "Same period as fuel and product output"
      site_scope: "On-site heat-treatment combustion sources"
      aggregation_rule: "Sum direct fossil CO2 and normalize by applicable accepted-product mass"
      quality_evidence: "Monitor QA/QC or verified emissions inventory; fuel reconciliation; allocation worksheet"
    - protocol_id: cp_product_acceptance
      process_id: "finishing_testing"
      flow_role: "accepted welded line pipe"
      record_type: "production, inspection, hydrotest, marking, and dispatch records"
      raw_fields: "lot_id; route; specification; edition; product_specification_level; grade; dimensions; heat_treatment; end_finish; coating_state; accepted_mass; rejected_mass; test_status"
      collection_method: "Weigh accepted lots and reconcile to inspection and hydrostatic-test acceptance"
      unit: "kg"
      frequency: "Each lot"
      temporal_coverage: "Same period as all inputs and outputs"
      site_scope: "All declared product lines at the foreground site"
      aggregation_rule: "Sum only accepted net dry product mass and set normalized output to 1 kg"
      quality_evidence: "Scale calibration; material certificate; inspection and test record; lot traceability"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = reporting-period atomic-flow amount / reporting-period accepted reference-product mass"
      inputs:
        - "atomic-flow amount"
        - "accepted product mass"
      output: "amount per 1 kg accepted welded steel line pipe"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_material_reconciliation
      applies_to: "coil, plate, wire, and flux"
      rule: "net consumed = opening stock + receipts - returns - verified reusable recovery - closing stock"
      inputs:
        - "stock and transaction records"
      output: "net material consumption by atomic material and route"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_internal_mass_balance
      applies_to: "formed shell and unfinished welded pipe"
      rule: "transferred mass must be identical on the output and input sides of each internal transfer; investigate any difference before publication"
      inputs:
        - "transfer weights or dimensional mass"
        - "recorded rejects"
      output: "reconciled internal-intermediate mass"
      source_ids:
        - usitc-welded-line-pipe-2014
    - id: calc_water_boundary
      applies_to: "hydrostatic-test water"
      rule: "net water input = boundary make-up; wastewater output = boundary discharge; recirculated water is an internal loop and is reported only as supporting information"
      inputs:
        - inlet
        - discharge
        - storage
        - recirculation
        - "and density records"
      output: "process-water input and hydrotest-wastewater output"
      source_ids:
        - usitc-welded-line-pipe-2014
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "reference product and steel feedstock"
      requirement: "Trace every production lot to route, governing specification and edition, product specification level, grade, dimensions, weld orientation, heat treatment, inspection status, and supplier steel lot."
      evidence: "Mill test certificate; production traveler; inspection and hydrotest record; supplier certificate"
    - id: dq_temporal_representativeness
      applies_to: "all foreground records"
      requirement: "Use at least 12 consecutive representative months unless production is campaign-based or the site operated for a shorter period; disclose the period, shutdowns, abnormal operation, and exclusions."
      evidence: "Dated ledgers, meter exports, production calendar, and exception log"
    - id: dq_geographic_technology
      applies_to: "upstream datasets"
      requirement: "Select supplier- and region-representative upstream steel and country/region-representative electricity and fuel datasets; justify every proxy and disclose HFW/ERW, HSAW, or LSAW route."
      evidence: "Supplier origin; dataset metadata; grid or contract record; route declaration"
    - id: dq_completeness_reconciliation
      applies_to: "mass, energy, water, waste, and direct emissions"
      requirement: "Reconcile each collection protocol to source ledgers; explain missing meters, estimated allocations, stock differences, unmeasured releases, and any flow excluded from the reported inventory."
      evidence: "Signed reconciliation worksheets; meter coverage list; waste manifests; emissions inventory"
    - id: dq_no_cartesian_variants
      applies_to: "route and product variants"
      requirement: "Model actual production lots and route-specific atomic flows. Do not expand combinations of grade, diameter, wall thickness, coating, and route into synthetic inventory rows."
      evidence: "Lot-weighted aggregation file and variant-to-lot mapping"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the reference product UUID, 1 kg net dry mass, welded route, oil-or-gas pipeline use, specification, grade, dimensions, heat treatment, end finish, test status, and coating state."
    source_ids:
      - un-cpc-3-structure-2025
      - iso-3183-2019
      - api-spec-5l-47-announcement-2026
  - rule_id: validation_route_inputs
    applies_to: "route-specific inventory"
    rule: "Require coil and no plate for HFW/ERW or HSAW, plate and no coil for LSAW, and welding wire plus flux only for SAW routes; any exception requires documented process evidence."
    source_ids:
      - usitc-welded-line-pipe-2014
  - rule_id: validation_internal_transfers
    applies_to: "internal product flows"
    rule: "Require paired internal output and input rows for formed shell and unfinished welded pipe to have identical reporting-period mass and identity."
    source_ids:
      - usitc-welded-line-pipe-2014
  - rule_id: validation_mass_balance
    applies_to: "foreground mill"
    rule: "Reconcile steel feedstock mass to accepted product, all separately recorded steel scrap, stock change, and documented unmeasured loss; investigate unresolved imbalance before release."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_energy_water_emissions
    applies_to: "utilities and direct releases"
    rule: "Reconcile electricity and natural gas to meters or invoices, hydrotest make-up and discharge to the water balance, and direct fossil CO2 to the site emissions or combustion record without adding upstream electricity or fuel emissions."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_boundary
    applies_to: "dataset completeness"
    rule: "Reject silent inclusion of external functional coating, pipeline installation, use, or end-of-life and reject silent omission of applicable heat treatment, inspection, hydrostatic testing, scrap, or wastewater."
    source_ids:
      - iso-3183-2019
      - api-spec-5l-47-announcement-2026
published_dataset_profile:
  dataset_role: "Gate-to-gate foreground production dataset for welded steel line pipe at the producing mill factory gate"
  downstream_use: "May be used as a secondary_dataset or background_dataset for pipeline products and systems when product, route, geography, time, steel grade, dimensions, specification, and coating state are compatible"
  allowed_use: "Product carbon-footprint, EPD, procurement, design, and life-cycle studies that link compatible upstream steel and energy datasets and append downstream coating, transport, construction, use, and end-of-life as required"
  excluded_use: "Direct comparison of incompatible pipe routes or grades; representation of seamless, cast, drilling tubular, structural pipe, coated pipe without appended coating data, pipeline installation, service performance, or end-of-life"
  required_metadata: "PCR id and version; site and geography; reporting period; HFW/ERW, HSAW, or LSAW route; specification and edition; product specification level; grade; diameter; wall thickness; length; heat treatment; end finish; inspection and hydrotest status; coating state; reference mass; upstream dataset identities; allocation rules"
  required_quality_disclosure: "Primary-data share and meter coverage; route and product weighting; supplier and upstream dataset representativeness; material, energy, water, waste, and emissions reconciliation; proxy datasets; exclusions; internal recycling; uncertainty and unresolved UUID or range evidence needs"
  update_trigger: "Recalculate when route, feedstock form or supplier steel dataset, product mix, specification, furnace or welding technology, electricity or fuel supply, hydrotest-water system, allocation method, site geography, or representative production period materially changes"
