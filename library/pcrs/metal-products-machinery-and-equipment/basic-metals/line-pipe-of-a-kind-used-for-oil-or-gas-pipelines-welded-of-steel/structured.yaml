system_boundary:
  rules:
    - rule_id: boundary_pipe_mill_gate
      applies_to: "foreground pipe manufacture"
      rule: "Include steel preparation, forming, seam welding, applicable post-weld heat treatment, sizing, cooling, cutting, beveling, inspection, marking, and hydrostatic testing through accepted product at the producing mill gate."
