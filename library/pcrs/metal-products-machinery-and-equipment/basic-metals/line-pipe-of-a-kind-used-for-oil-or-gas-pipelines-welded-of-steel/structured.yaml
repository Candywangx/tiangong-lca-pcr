        - usitc-welded-line-pipe-2014
        - api-spec-5l-47-announcement-2026
    - rule_id: boundary_upstream_links
      applies_to: "purchased products and energy"
      rule: "Keep purchased-input production outside the foreground gate but link representative upstream datasets; prevent double counting between supplier and pipe-mill inventories."
      source_ids:
        - worldsteel-lci-methodology-2017
    - rule_id: boundary_route_specificity
      applies_to: "HFW/ERW, HSAW, and LSAW"
      rule: "Declare only the applicable feedstock form and welding consumables: coil for HFW/ERW and HSAW, plate for LSAW, and welding wire plus flux only for SAW routes."
      source_ids:
        - usitc-welded-line-pipe-2014
    - rule_id: boundary_external_coating
      applies_to: "externally applied functional coating"
      rule: "Exclude external corrosion, thermal-insulation, and concrete-weight coating by default; when present in the declared market state, append a separately measured foreground coating process and disclose the changed boundary."
      source_ids:
        - api-spec-5l-47-announcement-2026
