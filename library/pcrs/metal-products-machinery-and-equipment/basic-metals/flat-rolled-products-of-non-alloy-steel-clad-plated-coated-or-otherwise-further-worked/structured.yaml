      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine accepted-product mass on a calibrated scale or from measured dimensions and verified density. Include retained coating, cladding, passivation, paint, and protective-oil layers; exclude transport packaging. Normalize all inventory rows to 1,000 kg accepted product."
