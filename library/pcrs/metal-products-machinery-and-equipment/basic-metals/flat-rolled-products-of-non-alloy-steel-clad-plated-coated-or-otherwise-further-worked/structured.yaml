  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "every inventory row"
      rule: "normalized amount = period amount / accepted reference-product mass x 1,000 kg"
      inputs:
        - "collected period amount"
        - "accepted product mass"
      output: "amount per 1,000 kg accepted product"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_electricity_mj
      applies_to: "every electricity row"
      rule: "MJ = metered kWh x 3.6"
      inputs:
        - "metered kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_layer_mass
      applies_to: "retained coating or cladding"
      rule: "retained layer mass = measured area x total coating mass per area, with side convention stated; if thickness is used, multiply by verified density"
      inputs:
        - "product area"
        - sidedness
        - "coating mass per area or thickness"
        - density
      output: "kg retained layer"
      source_ids:
        - eu-jrc-fmp-bref-2022
    - id: calc_fossil_co2
      applies_to: "natural-gas combustion rows"
      rule: "fossil CO2 = fuel quantity x supplier carbon or approved emission factor x oxidation factor x 44/12; do not add this result when the same stack CO2 mass is used"
      inputs:
        - "corrected fuel quantity"
        - "carbon content or factor"
        - "oxidation factor"
      output: "kg fossil CO2"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "whole foreground system"
      rule: "substrate plus retained purchased materials plus opening work in progress = accepted product plus external scrap, wastes, residues, measured releases, closing work in progress, and explained difference"
      inputs:
        - "mass records from all processes"
      output: "mass-balance difference and percentage"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_shared_utility
      applies_to: "shared electricity, gas, water, and treatment"
      rule: "allocate first by dedicated submeter; otherwise use a documented physical driver such as operating time times rated load, corrected throughput, or treated volume"
      inputs:
        - "total meter"
        - "driver records"
      output: "process-assigned amount"
      source_ids:
        - worldsteel-lci-methodology-2017
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and substrate"
      requirement: "Preserve supplier/production lot linkage, non-alloy steel grade, incoming state, dimensions, all retained layers, coating mass or thickness and sidedness, further-working route, finish, and acceptance specification."
      evidence: "purchase specification; coil card; test certificate; product release record"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use a representative 12-month period. A shorter period must cover at least one complete campaign for each represented product route and explain seasonal, maintenance, and product-mix effects."
      evidence: "date-bounded raw records; production calendar; justification"
    - id: dq_geography_technology
      applies_to: "foreground and linked upstream data"
      requirement: "Declare production site, country/region, line technology, furnace/coating type, and supplier geography. Explain non-representative upstream or electricity datasets."
      evidence: "site and supplier metadata; dataset mapping record"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Include every applicable Process Map process, every energy carrier, exact purchased material and chemical, exact waste stream, and measured elementary emission. Record exclusions with mass, energy, and environmental relevance justification."
      evidence: "completeness checklist; purchase-to-inventory reconciliation; emissions and waste inventories"
    - id: dq_measurement
      applies_to: "mass, energy, water, chemicals, emissions, and residues"
      requirement: "Retain calibration, detection-limit, concentration/purity, reference-condition, dry-solids, and allocation evidence appropriate to each measurement."
      evidence: "calibration certificates; laboratory reports; supplier statements; allocation worksheets"
    - id: dq_consistency
      applies_to: "model and reporting"
      requirement: "Apply identical normalization, allocation, stock correction, and recycling rules across all represented lines and products; document deviations and uncertainty."
      evidence: "calculation workbook; method statement; sensitivity results"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference_product"
    rule: "Confirm exactly one reference output of 1,000 kg accepted product; verify that retained layers are included and transport packaging is excluded from that mass."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_route_completeness
    applies_to: "process_map_and_inventory"
    rule: "Confirm that every actual route step is represented, every conditional process has evidence for inclusion or absence, and no selected flow is a collection label or unresolved selector."
    source_ids:
      - eu-jrc-fmp-bref-2022
  - rule_id: validation_mass_balance
    applies_to: "whole_foreground_system"
    rule: "Perform substrate, coating-metal, and total mass balances; investigate and disclose material differences rather than forcing closure."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_energy_and_emissions
    applies_to: "all_energy_and_combustion_rows"
    rule: "Reconcile electricity and fuel to meters, verify kWh-to-MJ conversion and gas reference conditions, and ensure calculated fossil CO2 is not duplicated by stack data."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_coating_identity
    applies_to: "retained_layers"
    rule: "Cross-check supplier formulation and bath composition against measured product coating mass or thickness, sidedness, and acceptance records."
    source_ids:
      - eu-jrc-fmp-bref-2022
  - rule_id: validation_waste_and_water
    applies_to: "wastes_residues_and_effluent"
    rule: "Reconcile spent baths, wastewater, sludge, zinc ash, dross, scrap, and off-spec product to storage changes and transfer documents; preserve exact destinations."
    source_ids:
      - eu-jrc-fmp-bref-2022
  - rule_id: validation_allocation_and_double_counting
    applies_to: "shared_burdens_co_products_and_recycling"
    rule: "Verify subdivision and allocation keys, test material recovered-output choices, and ensure upstream or downstream recycling credits and treatment are not counted twice."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_source_and_uuid_status
    applies_to: "all_rows_and_rules"
    rule: "Reject unverified UUIDs and proxy identities. Confirm that every UUID-empty row remains listed in manifest unresolved metadata and that non-default rules retain source ids."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production dataset suitable for publication as a secondary_dataset or background_dataset after review and UUID resolution"
  downstream_use: "Cradle-to-gate product footprints, EPD or PEF studies, procurement models, and downstream process or lifecyclemodel construction for the exact declared product route"
  allowed_use: "Use only when substrate, steel grade, coating/cladding/further-working route, retained layers, product dimensions and form, site geography, production period, allocation, and recycling approach are compatible with the intended model"
  excluded_use: "Do not use as an unqualified average for stainless/alloy/electrical/high-speed steel, uncoated flat steel, fabricated components, use-stage performance, or end-of-life; do not support comparative assertions without a study-specific functional unit and review"
  required_metadata: "canonical PCR id; reference-flow qualifiers; site and period; product and substrate specifications; route Process Map; included/excluded operations; upstream dataset list; energy supply; allocation and recycling method; UUID resolution status"
  required_quality_disclosure: "foreground versus secondary data shares; meter and scale coverage; mass-balance difference; cut-offs; shared-utility allocation; coating test coverage; data age; uncertainty; abnormal-operation treatment; unresolved flows and range evidence needs"
  update_trigger: "Change in substrate or product grade, retained layer or supplier formulation, coating/cladding/further-working route, line technology, site or energy supply, allocation/recycling method, material yield, emission control, wastewater treatment, product specification, or foreground data period"
