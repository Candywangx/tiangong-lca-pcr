allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared_processes_and_utilities"
    rule: "Subdivide processes and use dedicated meters or physically justified engineering allocation before applying allocation. Document the allocation key, period, and affected rows for every shared line or utility."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_mass_for_similar_products
    applies_to: "jointly_produced_flat_steel_products"
    rule: "When subdivision is not feasible and products undergo materially similar operations, allocate shared burdens by accepted dry product mass; use another physical relation only when documented as more representative."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_rework
    applies_to: "internal_rework"
    rule: "Keep internally reworked material inside the foreground system. Do not credit it as an exported co-product and count only net external inputs and outputs after closing stock changes."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_recovered_outputs
    applies_to: "steel_scrap_zinc_ash_dross_and_other_recovered_outputs"
    rule: "Classify an output as a co-product only when it leaves the site with a documented function and destination. Prefer system expansion with the substituted function disclosed; otherwise report the selected allocation method and an uncredited waste-treatment result as a sensitivity case."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_recycling_scope
    applies_to: "recycled_content_and_end_of_life"
    rule: "State the scrap-input and end-of-life recycling method. Do not combine a supplier dataset already carrying recycling credits with a second foreground or downstream credit."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "all_applicable_production_processes"
      flow_role: "substrate, intermediate, cladding sheet, and accepted product mass"
      record_type: "scale ticket, coil record, production record, or dimensional calculation"
      raw_fields: "timestamp; material or coil id; product grade; route; gross/tare/net mass; dimensions; density if calculated; accepted/rejected status"
      collection_method: "calibrated weighing preferred; dimensional calculation only with verified dimensions and density"
      unit: "kg"
      frequency: "each receipt, transfer, and released lot"
      temporal_coverage: "representative 12 consecutive months; shorter period justified"
      site_scope: "all included lines at the reporting site"
      aggregation_rule: "sum by product-route lot; correct opening/closing work in progress; normalize to accepted mass"
      quality_evidence: "calibration records; lot traceability; reconciliation to production ledger"
    - protocol_id: cp_energy_metering
      process_id: "all_applicable_processes"
      flow_role: "alternating-current electricity"
      record_type: "meter or invoice submeter record"
      raw_fields: "meter id; timestamp; opening/closing reading; kWh; voltage; supplier/market; shared-meter allocation key"
      collection_method: "dedicated meter preferred; documented engineering allocation otherwise"
      unit: "kWh retained and MJ reported"
      frequency: "continuous or monthly reading"
      temporal_coverage: "same period as production"
      site_scope: "all included lines and assigned auxiliaries"
      aggregation_rule: "subtract opening from closing; allocate shared use; convert at 3.6 MJ/kWh"
      quality_evidence: "meter calibration or invoice reconciliation; allocation worksheet"
    - protocol_id: cp_fuel_metering
      process_id: "thermal_conditioning_metallic_coating_organic_coating"
      flow_role: "gaseous natural gas"
      record_type: "corrected gas meter and supplier quality record"
      raw_fields: "meter id; volume; temperature; pressure; moisture basis; calorific value; carbon content when available; allocation key"
      collection_method: "corrected meter reading with supplier statement"
      unit: "m3 at declared conditions"
      frequency: "continuous or monthly reading"
      temporal_coverage: "same period as production"
      site_scope: "all included combustion units"
      aggregation_rule: "allocate corrected volume to process; retain quality data for emission calculation"
      quality_evidence: "meter verification; supplier statement; fuel-to-stack reconciliation"
    - protocol_id: cp_process_chemicals
      process_id: "substrate_preparation_metallic_coating_organic_coating_mechanical_further_working_finishing_packaging_wastewater_treatment"
      flow_role: "acids, alkalis, coating metals, gases, paints, oils, and treatment chemicals"
      record_type: "purchase, tank, bath, issue, and stock records"
      raw_fields: "exact product; supplier; concentration/purity; batch; opening stock; receipts; returns; closing stock; process destination"
      collection_method: "material balance by exact purchased product"
      unit: "kg or m3 at declared conditions"
      frequency: "each delivery and issue; monthly stock close"
      temporal_coverage: "same period as production"
      site_scope: "all included processes at the reporting site"
      aggregation_rule: "receipts plus opening stock minus closing stock, returns, and unrelated use"
      quality_evidence: "invoices; stock counts; bath analysis; supplier technical and safety data"
    - protocol_id: cp_water_effluent
      process_id: "substrate_preparation_wastewater_treatment"
      flow_role: "supplied water and process wastewater"
      record_type: "water and effluent meter, tank, or permit record"
      raw_fields: "meter id; mass or volume; density and reference conditions when converting; source; recirculated volume; discharge point; pH; temperature; conductivity; relevant pollutant concentrations"
      collection_method: "dedicated meter preferred; tank balance only when documented"
      unit: "kg for Process Water; m3 for UUID-unresolved wastewater rows; preserve measured volume and density when converting"
      frequency: "continuous or batch; at least monthly summary"
      temporal_coverage: "same period as production"
      site_scope: "all included water-use and discharge points"
      aggregation_rule: "net external make-up; do not count internal recirculation as new input; align influent and effluent boundaries"
      quality_evidence: "meter checks; laboratory reports; density evidence; water balance"
    - protocol_id: cp_direct_emissions
