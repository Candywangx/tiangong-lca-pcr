allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "independently metered operations"
    rule: "Avoid allocation by subdividing surface preparation, cold processing, annealing, and final conditioning wherever process-specific records exist."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_internal_recirculation
    applies_to: "internal steel returns and recirculated fluids"
    rule: "Treat material reused within the foreground as an internal loop; report only net boundary exchanges and retain gross records for mass-balance review."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_scrap_status
    applies_to: "alloy-steel residues"
    rule: "Classify each residue once as internal return, recovered scrap co-product, or waste according to documented status and destination; prohibit duplicate mass or automatic avoided-burden credit."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_shared_campaign
    applies_to: "inseparable multi-product campaigns"
    rule: "If subdivision is impossible, allocate shared burdens by measured mass of conforming physically similar steel outputs; disclose product set, factor, excluded nonconforming mass, and sensitivity."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_system_expansion
    applies_to: "separately modelled recovered scrap benefit"
    rule: "Apply substitution outside this foreground only when displaced production, scrap quality, recovery yield, geography, and functional equivalence are documented; report uncredited scrap separately and disclose sensitivity."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_surface_preparation_records
      process_id: "surface_preparation"
      flow_role: "feedstock, energy, chemicals, water, prepared output, and wastes"
      record_type: "scales, invoices, batch sheets, make-up logs, meters, and transfer records"
      raw_fields: "date; batch; grade; input/output mass; kWh; acid type; solution mass/concentration; water; waste mass/destination"
      collection_method: "collect by batch or meter interval and reconcile to orders"
      unit: "kg; kWh; m3 as metered"
      frequency: "batch or meter interval, monthly aggregation"
      temporal_coverage: "representative continuous 12 months"
      site_scope: "process equipment and direct auxiliaries"
      aggregation_rule: "sum attributable records, convert electricity to MJ, subtract internal recirculation, normalize"
      quality_evidence: "calibration; certificates; tests; batch reconciliation; transfer documents"
    - protocol_id: cp_cold_processing_records
      process_id: "cold_processing"
      flow_role: "intermediate, electricity, auxiliaries, output, and wastes"
      record_type: "scales, orders, route logs, meters, issue logs, and waste records"
      raw_fields: "date; batch; route; dimensions; masses; kWh; lubricant/fluid/abrasive mass; waste destination"
      collection_method: "collect separately for drawing, grinding, or peeling"
      unit: "kg; kWh"
      frequency: "batch or meter interval, monthly aggregation"
      temporal_coverage: "representative continuous 12 months"
      site_scope: "cold-processing line and direct auxiliaries"
      aggregation_rule: "reconcile by route, convert electricity to MJ, normalize to output"
      quality_evidence: "calibration; route logs; issue records; transfers; inspection"
    - protocol_id: cp_annealing_records
      process_id: "annealing"
      flow_role: "charge, gas, electricity, output, and fossil CO2"
      record_type: "scales, furnace logs, meters, fuel analysis, and stack or carbon records"
      raw_fields: "date; batch; furnace; masses; temperature cycle; gas and conditions; gas carbon; kWh; fossil CO2"
      collection_method: "collect each campaign; retain non-operation evidence when absent"
      unit: "kg; m3; kWh; kg CO2"
      frequency: "batch or meter interval, monthly aggregation"
      temporal_coverage: "representative continuous 12 months"
      site_scope: "furnace and direct controls, fans, and handling"
      aggregation_rule: "convert electricity, normalize gas, calculate CO2 from collected carbon data or monitoring, normalize"
      quality_evidence: "calibration; furnace logs; fuel certificates; worksheet or stack report"
    - protocol_id: cp_final_conditioning_records
      process_id: "final_conditioning"
      flow_role: "intermediate, electricity, oil, product, waste, and scrap"
      record_type: "scales, orders, meters, issue records, inspection, and transfers"
      raw_fields: "date; batch; input mass; kWh; oil; conforming output; waste; scrap; status; destination"
      collection_method: "collect by batch and reconcile every steel disposition"
      unit: "kg; kWh"
      frequency: "batch or meter interval, monthly aggregation"
      temporal_coverage: "representative continuous 12 months"
      site_scope: "final operations and dispatch preparation"
      aggregation_rule: "convert electricity, separate statuses without double counting, normalize to 1,000 kg"
      quality_evidence: "calibration; release; issue records; status evidence; mass-balance sign-off"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every row"
      rule: "normalized amount = period exchange × 1,000 kg / net conforming reference-product mass"
      inputs:
        - exchange
        - "net product mass"
      output: "exchange per 1,000 kg product"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_electricity_mj
      applies_to: "electricity rows"
      rule: "electricity MJ = metered kWh × 3.6 MJ/kWh, separately by process"
      inputs:
        - "process kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calc_material_balance
      applies_to: "each process and total foreground"
      rule: "input steel = product + co-product + waste + internal transfers + measured stock change; investigate residual"
      inputs:
        - "input/output/stock masses"
      output: "mass-balance residual"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_fossil_co2
      applies_to: "gas-fired annealing"
      rule: "use direct stack measurement or calculate from collected gas, reference-condition conversion, carbon content, and oxidation fraction"
      inputs:
        - gas
        - conditions
        - carbon
        - "oxidation or stack result"
      output: "kg fossil CO2"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_multi_product_allocation
      applies_to: "inseparable campaigns"
      rule: "allocated exchange = shared exchange × reference-product conforming mass / total conforming mass of all campaign products"
      inputs:
        - "shared exchange"
        - "conforming masses"
      output: "allocated exchange"
      source_ids:
        - worldsteel-lci-methodology-2017
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "product and feedstock"
      requirement: "Retain grade, composition/designation, dimensions, tolerances, route, heat-treatment state, surface condition, and exclusion evidence."
      evidence: "supplier certificate and released-product inspection"
    - id: dq_primary_foreground
      applies_to: "all foreground rows"
      requirement: "Use primary site records and identify every estimate, allocation, missing interval, and proxy."
      evidence: "meter, scale, batch, invoice, stock, laboratory, and transfer records"
    - id: dq_temporal_coverage
      applies_to: "all foreground rows"
      requirement: "Use representative continuous 12-month data; data older than five years require justification and technology comparison."
      evidence: "coverage table and technology-change review"
    - id: dq_route_separation
      applies_to: "cold processing and annealing"
      requirement: "Keep drawing, grinding, peeling, and annealing records separate; do not average routes without production-weighted shares."
      evidence: "route-coded production and meter records"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Reconcile steel mass and energy; list excluded material or emission exchanges individually with relevance justification."
      evidence: "signed balances and exclusion register"
    - id: dq_uuid_status
      applies_to: "selected flows"
      requirement: "Resolve each UUID-empty row to an exact public Tiangong flow or retain the explicit unresolved entry; never substitute a proxy."
      evidence: "direct-read audit or manifest unresolved entry"
validation_rules:
  - rule_id: validate_identity
    applies_to: "product category"
    rule: "Fail if grade, form, cold-processing route, market state, or exclusions are missing, or if the product belongs to an excluded category."
    source_ids:
      - unsd-cpc-3-0-2025
      - ec-jrc-fmp-bref-2022
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Fail unless net conforming output is exactly 1,000 kg after normalization and excluded non-product masses are removed."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_route_conditions
    applies_to: "conditional operations"
    rule: "Fail if a conditional exchange is positive without its route, or an operated step lacks its atomic inputs and outputs."
    source_ids:
      - ec-jrc-fmp-bref-2022
  - rule_id: validate_energy
    applies_to: "electricity and gas"
    rule: "Fail if electricity is pooled with fuel, delivery qualifiers are absent, conversion is inconsistent, or gas conditions and furnace function are undeclared."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_mass_balance
    applies_to: "processes and foreground"
    rule: "Fail or correct when steel inputs, outputs, internal transfers, and stock change do not reconcile within documented uncertainty."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_residue_status
    applies_to: "steel residues"
    rule: "Fail if residue mass is counted more than once or recovered-scrap product status lacks specifications and transfer evidence."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_data_quality
    applies_to: "dataset production"
    rule: "Fail if period, site coverage, route separation, calibration, missing-data treatment, allocation, and exclusions are not disclosed."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_uuid_accounting
    applies_to: "inventory identity"
    rule: "Require each inventory row to contain a directly verified public Tiangong UUID or a matching manifest unresolved entry; prohibit proxies."
    source_ids: []
published_dataset_profile:
  dataset_role: "Gate-to-gate foreground dataset eligible for publication as a secondary_dataset or background_dataset after review and UUID resolution"
  downstream_use: "Link qualified upstream alloy-steel and energy datasets, then use in cradle-to-gate product systems, process datasets, or lifecyclemodel projections after boundary checks"
  allowed_use: "Modelling for the declared grade, state, route, site/geography, technology, and period; benchmarking only after harmonizing boundary and allocation"
  excluded_use: "Excluded steel categories or undisclosed average routes; public comparative claims without a study-specific functional unit and review"
  required_metadata: "PCR id; CPC reference; grade; specification; input form; output dimensions/tolerance; delivery form; cold route; surface preparation; annealing/furnace; surface state; site/geography; period; electricity qualifiers; upstream datasets; allocation and scrap status"
  required_quality_disclosure: "primary-data share; 12-month coverage; calibration; mass-balance residual; route shares; missing data and estimates; UUID gaps; range-evidence gaps; exclusions; allocation sensitivity; upstream data age and representativeness"
  update_trigger: "Change in scope, route, annealing technology/fuel, electricity, site boundary, scrap status, allocation, upstream feedstock, route mix, or records older than five years"
