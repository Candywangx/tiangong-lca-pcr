allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Shared foreground operations"
    rule: "Subdivide campaigns by material family, alloy or grade, route, and product size class whenever meters, batch records, or production records permit."
    source_ids: []
  - rule_id: allocation_internal_recycle
    applies_to: "Internal ferrous returns"
    rule: "Keep returned oversize, undersize, and recovered powder inside the process. Record gross generation, return, and purge; assign neither an external input nor an avoided-product credit to the internal loop."
    source_ids: []
  - rule_id: allocation_external_coproduct
    applies_to: "Multiple saleable outputs"
    rule: "If more than one saleable co-product remains after subdivision, use a documented physical causal relation where demonstrable; otherwise allocate by dry mass and disclose quantities, prices, and a sensitivity check rather than defaulting to economic allocation."
    source_ids: []
  - rule_id: allocation_no_waste_credit
    applies_to: "External waste transfers"
    rule: "Report externally transferred off-specification powder and sludge as waste outputs. Do not claim avoided-production credit inside this gate-to-gate process; model any receiving recycling system separately."
    source_ids: []
