allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Multi-product lines and shared utilities"
    rule: "Prefer campaign, meter, runtime, mass-throughput, coated-area, or treated-volume subdivision before allocation; document every shared-service driver."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_internal_scrap
    applies_to: "Scrap returned inside the represented site"
    rule: "Record scrap mass and destination, but do not count it as external scrap input or grant an avoided-product credit in the foreground inventory."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_exported_residues
    applies_to: "Scrap, scale, recovered acid, or sludge leaving the boundary"
    rule: "Record each physical output without a foreground avoided-burden credit; report any downstream system expansion or recycling method separately."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_feedstock_mass_balance
      process_id: "feedstock_receiving_preparation_finishing_packaging"
      flow_role: "Feedstock, intermediate, product mass"
      record_type: "Scale and coil-genealogy records"
      raw_fields: "coil id; alloy; state; gross; tare; scrap; saleable mass; time"
      collection_method: "Reconcile calibrated scales to genealogy"
      unit: "kg"
      frequency: "Each coil and campaign"
      temporal_coverage: "Representative 12 months or full shorter campaign"
      site_scope: "Included lines"
      aggregation_rule: "Sum and normalize by net saleable output"
      quality_evidence: "Calibration and stock reconciliation"
    - protocol_id: cp_stage_energy
      process_id: "all_stages"
      flow_role: "Electricity"
      record_type: "Submeters and reconciled main meter"
      raw_fields: "meter; readings; runtime; load; driver; supplier; voltage"
      collection_method: "Prefer submetering; otherwise documented equipment allocation"
      unit: "kWh, MJ"
      frequency: "Monthly and campaign"
      temporal_coverage: "Same production period"
      site_scope: "Included equipment"
      aggregation_rule: "Convert to MJ and normalize by saleable output"
      quality_evidence: "Calibration, invoices, allocation worksheet"
    - protocol_id: cp_stage_fuel_and_emissions
      process_id: "pickling_rinsing_annealing_heat_treatment_metallic_coating"
      flow_role: "Natural gas and direct CO2"
      record_type: "Fuel meters, invoices, factors"
      raw_fields: "volume; conditions; calorific value; carbon factor; oxidation factor; attribution"
      collection_method: "Reconcile meters and calculate CO2 from documented factor"
      unit: "m3, MJ, kg"
      frequency: "Monthly and campaign"
      temporal_coverage: "Same production period"
      site_scope: "Each combustion unit"
      aggregation_rule: "Attribute by stage and normalize"
      quality_evidence: "Calibration, supplier statement, formula check"
    - protocol_id: cp_pickling_records
      process_id: "pickling_rinsing"
      flow_role: "Steel, acid, water, effluent"
      record_type: "Line, tank, meter, waste records"
      raw_fields: "input/output mass; acid and concentration; stock; recovery; water; effluent"
      collection_method: "Reconcile line and inventories"
      unit: "kg, m3, m2"
      frequency: "Campaign and monthly"
      temporal_coverage: "Same production period"
      site_scope: "Pickling and recovery"
      aggregation_rule: "Net make-up and outputs only"
      quality_evidence: "Calibration, analysis, manifests"
    - protocol_id: cp_cold_rolling_records
      process_id: "cold_reduction"
      flow_role: "Steel, oil, scrap"
      record_type: "Mill, stock, waste records"
      raw_fields: "input/output mass; gauge; oil stock; scrap; destination"
      collection_method: "Reconcile genealogy and inventories"
      unit: "kg"
      frequency: "Campaign and monthly"
      temporal_coverage: "Same production period"
      site_scope: "Rolling and support equipment"
      aggregation_rule: "Net make-up and outputs"
      quality_evidence: "Calibration and manifests"
    - protocol_id: cp_annealing_records
      process_id: "annealing_heat_treatment"
      flow_role: "Steel and nitrogen"
      record_type: "Furnace and gas records"
      raw_fields: "coil mass; furnace; cycle; temperature; nitrogen; purity; conditions"
      collection_method: "Link furnace batches to genealogy"
      unit: "kg, m3"
      frequency: "Batch or campaign"
      temporal_coverage: "Same production period"
      site_scope: "Included furnaces"
      aggregation_rule: "Sum route-specific records"
      quality_evidence: "Log completeness and calibration"
    - protocol_id: cp_temper_finishing_records
      process_id: "temper_skin_pass_finishing_packaging"
      flow_role: "Steel, oil, losses"
      record_type: "Line, stock, inspection records"
      raw_fields: "mass; oil; trim; rejects; rework; surface state"
      collection_method: "Reconcile genealogy and stock"
      unit: "kg"
      frequency: "Campaign and monthly"
      temporal_coverage: "Same production period"
      site_scope: "Temper and finishing"
      aggregation_rule: "Count rework once and normalize"
      quality_evidence: "Calibration and dispositions"
    - protocol_id: cp_coating_records
      process_id: "metallic_coating"
      flow_role: "Substrate, zinc, coated product"
      record_type: "Line, metal, coating-test records"
      raw_fields: "substrate/output; zinc stock; area; coating mass"
      collection_method: "Reconcile metal inventory and measured coating"
      unit: "kg, m2"
      frequency: "Campaign and monthly"
      temporal_coverage: "Same production period"
      site_scope: "Zinc coating line"
      aggregation_rule: "Close zinc and substrate balances"
      quality_evidence: "Calibration and coating test"
    - protocol_id: cp_packaging_records
      process_id: "finishing_packaging"
      flow_role: "Delivered steel strap"
      record_type: "Bill of materials and issue records"
      raw_fields: "material; mass per item; count; return status"
      collection_method: "Weigh items and reconcile to shipments"
      unit: "kg, item"
      frequency: "Configuration and campaign"
      temporal_coverage: "Same production period"
      site_scope: "Delivered packaging"
      aggregation_rule: "Convert counts to mass"
      quality_evidence: "Weighing and bill of materials"
    - protocol_id: cp_wastewater_treatment_records
      process_id: "wastewater_treatment"
      flow_role: "Feed, NaOH, sludge"
      record_type: "Flow, chemical, lab, waste records"
      raw_fields: "feed; pH; reagent concentration; stock; sludge wet/dry mass; metals; destination"
      collection_method: "Reconcile flow, chemistry, and sludge"
      unit: "m3, kg"
      frequency: "Daily or batch and monthly"
      temporal_coverage: "Same production period"
      site_scope: "On-site treatment"
      aggregation_rule: "Allocate by flow and pollutant load"
      quality_evidence: "Calibration, lab QA/QC, manifests"
  calculation_rules:
    - id: calc_normalize_to_reference_mass
      applies_to: "All rows"
      rule: "normalized amount = campaign amount / campaign net saleable mass × 1,000 kg"
      inputs:
        - "Campaign exchange"
        - "saleable mass"
      output: "Exchange per reference flow"
      source_ids: []
    - id: calc_electricity_to_mj
      applies_to: "Electricity"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - kWh
      output: "MJ"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "Direct fossil CO2"
      rule: "CO2 = stage fuel quantity × documented carbon factor × oxidation factor"
      inputs:
        - Fuel
        - conditions
        - factors
      output: "kg fossil CO2"
      source_ids: []
