allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared production lines and utilities"
    rule: "Prefer campaign, line, or meter subdivision. Allocate only residual shared quantities after documenting why subdivision is unavailable."
    source_ids: []
  - rule_id: allocation_residual
    applies_to: "residual shared inputs and emissions"
    rule: "Allocate by a causal physical driver such as measured operating time, processed mass, or metered demand; do not use revenue unless no defensible physical relation exists and the exception is disclosed."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "post-industrial steel scrap"
    rule: "Report the scrap amount and destination separately. Apply the study's declared recycling method consistently and do not simultaneously credit avoided primary steel and assign recycled-content benefit to the same scrap."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_forming_welding
      process_id: "forming_welding"
      flow_role: "materials, utilities, output, scrap, and direct CO2"
      record_type: "production, scale, meter, invoice, and inspection records"
      raw_fields: "coil mass; electricity; water; gas volume and reference conditions; wire issues and returns; accepted pipe mass; scrap mass; fuel factor; direct CO2"
      collection_method: "Reconcile campaign records to line meters, calibrated scales, and accepted-output records"
      unit: "kg, MJ, m3"
      frequency: "each campaign, aggregated monthly"
      temporal_coverage: "representative continuous 12-month period or all campaigns for a shorter declared production period"
      site_scope: "all equipment serving the declared line, with shared services allocated explicitly"
      aggregation_rule: "sum each atomic exchange and divide by net conforming pipe mass"
      quality_evidence: "calibration records, meter reconciliation, stock balance, rejection log, and supervisor approval"
    - protocol_id: cp_pickling
      process_id: "acid_pickling"
      flow_role: "acid, water, neutralizer, and spent liquor"
      record_type: "delivery, tank, meter, batch, and waste-transfer records"
      raw_fields: "solution mass and concentration; water mass or volume; sodium hydroxide mass and concentration; spent-liquor mass or volume and density"
      collection_method: "Reconcile tank stock, receipts, measured additions, and off-site transfers by campaign"
      unit: "kg"
      frequency: "each bath change and campaign, aggregated monthly"
      temporal_coverage: "same period as the pipe campaign"
      site_scope: "all pickling and rinse stages serving the declared product"
      aggregation_rule: "calculate net fresh inputs and outgoing spent liquor, then divide by pipe mass leaving pickling"
      quality_evidence: "concentration certificates, calibrated tank or scale records, density method, and transfer manifest"
    - protocol_id: cp_galvanizing
      process_id: "hot_dip_galvanizing"
      flow_role: "zinc, water, gas, and direct CO2"
      record_type: "stock, purchase, meter, production, and emission-factor records"
      raw_fields: "zinc receipts and stocks; zinc residues; water; gas volume and reference conditions; coated output; fuel factor; direct CO2"
      collection_method: "Reconcile bath metal and utility meters to the coated-pipe campaign"
      unit: "kg, m3"
      frequency: "each campaign, aggregated monthly"
      temporal_coverage: "same period as the coated-pipe campaign"
      site_scope: "galvanizing stages serving the declared product"
      aggregation_rule: "calculate net zinc and each utility or emission per coated output mass"
      quality_evidence: "bath inventory, certified scales, meter calibration, residue records, and factor provenance"
  calculation_rules:
    - id: calc_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = campaign exchange / net mass of the applicable conforming process output"
      inputs:
        - "atomic exchange amount"
        - "conforming output mass"
      output: "amount per kg applicable output"
      source_ids: []
    - id: calc_water_mass
      applies_to: "water recorded by volume"
      rule: "water mass = metered volume × measured or justified density at the recorded condition; retain volume and density"
      inputs:
        - "water volume"
        - density
      output: "kg process water"
      source_ids: []
    - id: calc_direct_co2
      applies_to: "direct natural-gas combustion"
      rule: "direct fossil CO2 = recorded gas activity × disclosed fuel-specific factor × oxidation fraction; do not add upstream supply-chain CO2"
      inputs:
        - "gas activity"
        - factor
        - "oxidation fraction"
      output: "kg direct fossil CO2"
      source_ids: []
    - id: calc_zinc_balance
      applies_to: "galvanizing zinc input"
      rule: "net zinc attributed = receipts + opening bath stock - closing bath stock - separately measured residues, with allocation to the campaign disclosed"
      inputs:
        - "zinc receipts"
        - stocks
        - residues
        - "campaign allocation driver"
      output: "kg zinc metal"
      source_ids:
        - eu-fmp-bref-2022
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Grade, dimensions, seam orientation, welding technology, heat treatment, coating, end finish, acceptance specification, geography, and period must be recorded."
      evidence: "product specification, production order, and inspection release"
    - id: dq_mass_balance
      applies_to: "steel-bearing flows"
      requirement: "Reconcile coil input with conforming pipe, scrap, test coupons, work-in-process change, and other separately identified steel outputs; investigate material imbalance."
      evidence: "signed campaign mass balance and scale calibration"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Account for at least 95% of measured input mass and measured energy by included records; list excluded flows individually and justify each exclusion."
      evidence: "completeness calculation and exclusion register"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Prefer a continuous 12-month period; if shorter, cover all campaigns and disclose seasonality, shutdowns, and atypical production."
      evidence: "dated records and representativeness statement"
    - id: dq_conditional_routes
      applies_to: "conditional processes and flows"
      requirement: "Record an explicit present/not-present decision for pickling, heat treatment, flux-cored wire, and galvanizing; do not leave route applicability implicit."
      evidence: "process route sheet and bill of materials"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference flow"
