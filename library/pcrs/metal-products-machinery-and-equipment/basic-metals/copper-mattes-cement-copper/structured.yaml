  calculation_rules:
    - id: calc_dry_product_mass
      applies_to: "Copper matte and cement copper"
      rule: "dry product mass = as-received product mass × (1 − moisture mass fraction)"
      inputs:
        - "as-received mass"
        - "representative moisture mass fraction"
      output: "kg dry product"
      source_ids:
        - eu-commission-pef-method-2021
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "normalized amount = reporting-period net exchange × 1,000 / reporting-period dry reference-product mass"
      inputs:
        - "net exchange"
        - "dry reference-product mass"
      output: "row unit per 1,000 kg dry product"
      source_ids:
        - eu-commission-pef-method-2021
    - id: calc_gas_reference_volume
      applies_to: "Natural gas and industrial oxygen"
      rule: "Convert operating volume to the declared metering reference temperature and pressure using the documented meter or gas-law correction; do not mix incompatible reference conditions."
      inputs:
        - "operating volume"
        - temperature
        - pressure
        - "meter correction"
        - "gas compressibility when material"
      output: "m3 at declared reference conditions"
      source_ids:
        - us-epa-ap42-primary-copper-smelting-1995
    - id: calc_matte_sulfur_balance
      applies_to: "Matte branch"
      rule: "Reconcile sulfur in concentrate and other inputs with sulfur in matte, slag, recovered acid, direct sulfur emissions, and other measured sulfur outputs; investigate and disclose the residual."
      inputs:
        - "dry masses"
        - "sulfur assays"
        - "acid concentration"
        - "monitored emissions"
      output: "sulfur-balance closure and normalized sulfur-bearing outputs"
      source_ids:
        - us-epa-ap42-primary-copper-smelting-1995
    - id: calc_cementation_balance
      applies_to: "Cement copper branch"
      rule: "Reconcile copper and iron across pregnant solution, steel scrap, cement copper, unreacted steel, spent solution, residues, and releases using the reaction Fe + CuSO4 → Cu + FeSO4 as a stoichiometric QA relationship, not as a substitute for foreground measurements."
      inputs:
        - "solution flows and assays"
        - "scrap and product masses and assays"
        - "spent-solution composition"
      output: "copper-balance closure; iron-balance closure; QA residual"
      source_ids:
        - us-bureau-mines-copper-materials-survey-1965
    - id: calc_stack_release
      applies_to: "Direct stack emissions"
      rule: "pollutant mass = validated post-control pollutant concentration × compatible dry or wet gas volume, with moisture, oxygen-reference, temperature, and pressure corrections documented as applicable"
      inputs:
        - concentration
        - "stack gas flow"
        - "operating time"
        - "correction parameters"
      output: "kg pollutant released"
      source_ids:
        - us-epa-ap42-primary-copper-smelting-1995
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Declare branch, physical state, moisture basis, copper grade, relevant impurities, release specification, and sampling method; do not use a refined- or ore-state UUID as a proxy."
      evidence: "product specification; dispatch record; laboratory certificate; sampling plan"
    - id: dq_temporal_alignment
      applies_to: "All foreground exchanges"
      requirement: "Use the same reporting period for inputs, outputs, stock changes, and emissions. Cover a representative operating year or explain why a shorter campaign is representative."
      evidence: "dated source records; production calendar; downtime and abnormal-operation log"
    - id: dq_measurement_control
      applies_to: "Meters, scales, and assays"
      requirement: "Retain calibration status, sample representativeness, laboratory method, detection limits, substitutions, and uncertainty for every material exchange."
      evidence: "calibration certificates; QA/QC charts; laboratory reports; missing-data register"
    - id: dq_balance_closure
      applies_to: "Both branches"
      requirement: "Report mass-balance residuals and branch-specific copper balance; also report sulfur balance for matte and iron balance for cementation. Investigate material residuals rather than forcing closure through an unmeasured flow."
      evidence: "signed reconciliation workbook; assay records; explanation of residuals"
    - id: dq_atomic_completeness
      applies_to: "Inventory"
      requirement: "Add each site-specific material, waste, and emitted species as a separate atomic exchange with its own identity, property, unit, amount rule, and destination."
      evidence: "flow register; permit pollutant list; waste manifest; completeness review"
    - id: dq_primary_manufacturing_data
      applies_to: "Foreground manufacturing"
      requirement: "Use company-specific data for the foreground production processes and disclose any secondary-data substitution and its effect."
      evidence: "meter, batch, invoice, assay, dispatch, and monitoring records; substitution log; sensitivity result"
validation_rules:
  - rule_id: validate_identity_and_branch
    applies_to: "Dataset identity"
    rule: "Confirm CPC 41411 scope, declare exactly one reference-product branch, and reject copper ore, concentrate, blister copper, anode copper, refined copper, copper alloys, powder, or scrap as the reference product."
    source_ids:
      - unsd-cpc-3-0-structure-2025
  - rule_id: validate_reference_mass
    applies_to: "Reference flow"
    rule: "Confirm that the reference output equals 1,000 kg dry product after the documented moisture conversion and that every inventory amount uses the same denominator."
    source_ids:
      - eu-commission-pef-method-2021
  - rule_id: validate_process_completeness
    applies_to: "Process inventory"
    rule: "For the selected branch, verify all relevant process steps, material and energy inputs, product and co-product outputs, wastes, and post-control elementary releases; skipped rows require a documented not-applicable basis."
    source_ids:
      - us-epa-ap42-primary-copper-smelting-1995
      - us-bureau-mines-copper-materials-survey-1965
      - eu-commission-pef-method-2021
  - rule_id: validate_no_double_counting
    applies_to: "Upstream and internal flows"
    rule: "Confirm upstream supply burdens appear only in linked datasets, internal recycle is not counted as a second external exchange, and sulfur routed to acid is not also recorded as sulfur-dioxide emission."
    source_ids:
      - us-epa-ap42-primary-copper-smelting-1995
  - rule_id: validate_balances
    applies_to: "Mass, copper, sulfur, and iron"
    rule: "Check total mass and copper closure for both branches, sulfur closure for matte, and iron closure for cementation. Report residuals, thresholds, investigations, and corrections without inventing balancing flows."
    source_ids:
      - us-epa-ap42-primary-copper-smelting-1995
      - us-bureau-mines-copper-materials-survey-1965
  - rule_id: validate_allocation
    applies_to: "Multi-output operations"
    rule: "Confirm subdivision was attempted first, every remaining shared burden has a causal driver, recovered sulfuric acid is a separate output, and any physical, system-expansion, or economic allocation is fully disclosed with sensitivity."
    source_ids:
      - eu-commission-pef-method-2021
  - rule_id: validate_uuid_status
    applies_to: "Tiangong flow identities"
    rule: "Use only directly verified state-100 UUIDs. Keep the nine declared unresolved rows UUID-empty until an exact public identity with compatible flow type, classification, product state, property, and unit group is verified."
    source_ids: []
published_dataset_profile:
  dataset_role: "Gate-to-gate foreground production dataset for copper matte or cement copper"
  downstream_use: "secondary_dataset; background_dataset after review of representativeness, completeness, allocation, and unresolved identities"
  allowed_use: "Product-footprint and life-cycle models needing a declared copper-matte or cement-copper producer-gate input with compatible technology, geography, grade, and boundary"
  excluded_use: "Direct representation of ore mining, concentrate production, pregnant-solution leaching, blister or anode production, refining, finished copper products, or an undeclared average of the two covered branches"
  required_metadata: "selected branch; geography; technology; reporting period; dry-mass method; product grade and physical state; input assays; energy supply; oxygen and gas reference conditions; pollution controls; co-products; internal recycle; allocation; upstream links; unresolved UUIDs"
  required_quality_disclosure: "primary-data share; temporal and geographic representativeness; meter and assay QA; missing-data treatment; mass, copper, sulfur, and iron balance residuals as applicable; emission measurement basis; allocation sensitivity; deviations and cut-offs"
  update_trigger: "Material change in feed grade, furnace or cementation technology, energy or oxygen supply, pollution control, acid recovery, solution recycle, product specification, allocation, site geography, or availability of an exact Tiangong UUID or two-source range evidence"
