system_boundary:
  rules:
    - rule_id: boundary_branch_selection
      applies_to: "Foreground model"
      rule: "Select copper matte or cement copper as the reference product. Include the corresponding process branch and exclude the other branch unless the facility actually operates both and the data are subdivided."
      source_ids:
        - unsd-cpc-3-0-structure-2025
        - us-epa-ap42-primary-copper-smelting-1995
        - us-bureau-mines-copper-materials-survey-1965
    - rule_id: boundary_matte_operations
      applies_to: "Copper matte branch"
      rule: "Include concentrate and flux receipt, drying or roasting when used, smelting, matte tapping and conditioning, slag handling, direct energy, oxygen, post-control emissions, and on-site off-gas treatment that is operationally integrated with matte production."
      source_ids:
        - us-epa-ap42-primary-copper-smelting-1995
    - rule_id: boundary_cement_operations
      applies_to: "Cement copper branch"
      rule: "Include solution transfer, iron cementation, agitation or pumping, separation of the precipitate, product conditioning, spent-solution handling, and direct releases from the cementation operation."
      source_ids:
        - us-bureau-mines-copper-materials-survey-1965
    - rule_id: boundary_upstream_and_downstream
      applies_to: "Both branches"
      rule: "Represent upstream supplied inputs with linked datasets. Exclude downstream converting and refining from the reference-product foreground result, and do not credit future recycling or downstream metal recovery unless the study applies and discloses a separate consequential scenario."
      source_ids:
        - us-epa-ap42-primary-copper-smelting-1995
        - eu-commission-pef-method-2021
    - rule_id: boundary_completeness
      applies_to: "Both branches"
      rule: "Include every environmentally relevant material, energy, waste, and direct elementary exchange inside the declared boundary. Add any site-specific species or material as a separate atomic flow row rather than aggregating it under a generic collection label."
      source_ids:
        - eu-commission-pef-method-2021
boundary_abstraction:
  declared_starting_condition: "Matte branch: copper concentrate and separately purchased flux received at the smelter gate. Cement branch: copper-bearing pregnant leach solution and cementing steel scrap received at the cementation operation."
  starting_condition_role: "Foreground production input gate; upstream extraction, beneficiation, concentrate production, or leaching is represented by linked upstream datasets rather than re-created inside this PCR."
  product_classification_scope: "CPC 3.0 subclass 41411, while canonical PCR meaning is limited to the two declared copper-bearing intermediate products and their production routes."
  recursive_input_rule: "If copper matte or cement copper is used internally as an input, record the measured internal transfer and do not recursively apply this PCR to that transfer; use a separate upstream dataset only when it crosses the declared foreground boundary."
  upstream_dataset_requirement: "Link supply datasets for copper concentrate, quartz stone, natural gas, industrial oxygen, electricity, pregnant leach solution, and steel scrap when those inputs cross the foreground boundary."
  disclosure: "Declare selected branch, start material state and assays, technology, pollution controls, internal recycle, co-product recovery, producer geography, reporting period, cut-offs, and every deviation from the default gate-to-gate boundary."
