allocation_rules:
  - rule_id: allocation_subdivide_branches
    applies_to: "Facilities producing copper matte and cement copper"
    rule: "First subdivide process trains, meters, batches, and stock changes so each declared reference product receives directly attributable foreground inputs and outputs."
    source_ids:
      - eu-commission-pef-method-2021
  - rule_id: allocation_shared_services
    applies_to: "Shared utilities and treatment"
    rule: "Allocate only genuinely shared services that cannot be subdivided. Use a documented physical driver that represents causation, such as metered energy, treated gas volume, solution volume, or dry mass throughput; do not allocate by total product mass merely for convenience."
    source_ids:
      - eu-commission-pef-method-2021
  - rule_id: allocation_sulfuric_acid
    applies_to: "Recovered sulfuric acid"
    rule: "Keep recovered sulfuric acid as a separate product output. Prefer subdivision or system expansion; if neither is feasible, use and justify a relevant physical relationship before considering an economic relationship. Report acid concentration and allocation sensitivity."
    source_ids:
      - us-epa-ap42-primary-copper-smelting-1995
      - eu-commission-pef-method-2021
  - rule_id: allocation_slag_and_recycle
    applies_to: "Copper slag and internal recycle"
    rule: "Treat internal slag return as an internal transfer with no second upstream burden. Keep externally transferred slag as waste unless documented product status applies; disclose any treatment, recovery credit, or burden partitioning separately."
    source_ids:
      - us-epa-ap42-primary-copper-smelting-1995
      - eu-commission-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_matte_material_inputs
      process_id: "p_matte_smelting"
      flow_role: "copper concentrate and quartz stone inputs"
      record_type: "weighbridge, batch, assay, moisture, and inventory records"
      raw_fields: "received mass; returned mass; opening and closing stock; moisture; copper; sulfur; iron; gangue; trace elements; quartz composition"
      collection_method: "reconcile calibrated weighing and representative laboratory samples to each batch or campaign"
      unit: "kg and mass fraction"
      frequency: "each receipt and batch; monthly reconciliation"
      temporal_coverage: "at least one representative operating year or the full campaign if shorter"
      site_scope: "all foreground smelting units supplying the declared product"
      aggregation_rule: "net dry input equals receipts plus opening stock minus returns and closing stock, normalized to dry matte output"
      quality_evidence: "scale calibration; sample plan; laboratory method; chain of custody; reconciliation residual"
