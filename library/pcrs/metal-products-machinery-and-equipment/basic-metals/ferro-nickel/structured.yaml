allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "Shared operations and utilities"
    rule: "First avoid allocation by subdividing meters, production campaigns, furnaces, and treatment lines or by expanding the system where a defensible substituted function is demonstrated."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical
    applies_to: "Unavoidable shared burdens"
    rule: "If subdivision or system expansion is not feasible, allocate using a documented physical causal relationship such as separately measured energy demand, dry feed mass, or nickel mass throughput; justify the chosen driver."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_other
    applies_to: "No defensible physical relationship"
    rule: "Use another documented relationship, such as economic value, only after showing why physical causality is unavailable; disclose prices, averaging period, and sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_recycled_dust
    applies_to: "Internal dust, slag, and metal recycle"
    rule: "Treat material returned within the same foreground system and accounting period as an internal loop: report gross generation and return, but do not create an external avoided-product credit."
    source_ids:
      - ec-jrc-nfm-bref-2017
  - rule_id: allocation_waste_status
    applies_to: "Slag, dust, residues, and secondary feed"
    rule: "Determine waste versus product status from the applicable jurisdiction and actual transaction. A residue leaving the site does not become a co-product without a demonstrated function, market, and quality specification; record treatment burdens consistently."
    source_ids:
      - eu-pef-method-2021
      - bartzas-komnitsas-ferronickel-lca-2015
dataset_production:
  collection_protocols:
    - protocol_id: cp_feed_receipt
      process_id: "feed_preparation"
      flow_role: "Nickel-bearing feeds and prepared feed"
      record_type: "Weighbridge, sampler, laboratory, stock ledger"
      raw_fields: "Gross/net mass; moisture; Ni, Fe and impurity content; origin; waste status; stock change"
      collection_method: "Calibrated weighing plus representative lot sampling and chemical analysis"
      unit: "kg; % mass"
      frequency: "Each lot, aggregated monthly"
      temporal_coverage: "At least 12 consecutive representative months unless campaign production is justified"
      site_scope: "All production lines in declared facility scope"
      aggregation_rule: "Mass-weight composition and reconcile opening/closing stocks"
      quality_evidence: "Calibration certificates, sampling plan, laboratory QA/QC, stock reconciliation"
    - protocol_id: cp_energy_materials
      process_id: "all_applicable_processes"
      flow_role: "Electricity, fuels, reductants, electrodes, fluxes, auxiliaries"
      record_type: "Meters, invoices, issue records, stock ledger"
      raw_fields: "Quantity; carrier/material identity; meter; calorific value; stock change"
      collection_method: "Process meter where available; otherwise reconciled allocation from site total"
      unit: "kWh; MJ; kg; m3"
      frequency: "Continuous or each issue, aggregated monthly"
      temporal_coverage: "Same period as production denominator"
      site_scope: "Declared production lines plus attributable utilities"
      aggregation_rule: "Sum by carrier and subtract documented non-production use"
      quality_evidence: "Meter calibration, invoice reconciliation, allocation worksheet"
    - protocol_id: cp_thermal_pretreatment
      process_id: "thermal_pretreatment"
      flow_role: "Feed, calcine, dust, energy, operating state"
      record_type: "Belt scales, batch logs, laboratory, control system"
      raw_fields: "Input/output mass; moisture; temperature; composition; operating hours"
      collection_method: "Metered transfer and reconciled dry-mass balance"
      unit: "kg; °C; h"
      frequency: "Each batch or continuous shift record"
      temporal_coverage: "Same period as production denominator"
      site_scope: "Every included kiln, roaster, or dryer"
      aggregation_rule: "Aggregate by unit and route; retain outages and bypasses"
      quality_evidence: "Instrument calibration, lab results, mass-balance closure"
    - protocol_id: cp_electric_smelting
      process_id: "electric_smelting"
      flow_role: "Furnace feed, electricity, crude alloy, slag"
      record_type: "Furnace meters, tap records, laboratory, stock ledger"
      raw_fields: "Feed mass/composition; kWh; tap mass/composition; slag mass; operating hours"
      collection_method: "Metered electricity, weighed or calculated taps, representative sampling"
      unit: "kg; kWh; % mass"
      frequency: "Each heat or shift"
      temporal_coverage: "Same period as production denominator"
      site_scope: "Every included electric furnace"
      aggregation_rule: "Aggregate by furnace and route; reconcile Ni and dry mass"
      quality_evidence: "Meter calibration, heat logs, laboratory QA/QC, balance closure"
    - protocol_id: cp_refining_finishing
      process_id: "refining_finishing"
      flow_role: "Crude alloy, auxiliaries, finished product"
      record_type: "Heat/lot logs, scales, laboratory, utility meters"
      raw_fields: "Input/output mass; Ni and impurities; product form; rejected product; energy/water"
      collection_method: "Calibrated weighing, representative lot sampling, and direct metering"
      unit: "kg; % mass; kWh; m3"
      frequency: "Each heat or lot"
      temporal_coverage: "Same period as production denominator"
      site_scope: "All included refining and finishing lines"
      aggregation_rule: "Aggregate accepted product only; track rejects and rework separately"
      quality_evidence: "Sampling certificates, calibration, product specification, production reconciliation"
    - protocol_id: cp_air_emissions
      process_id: "feed_preparation_thermal_pretreatment_electric_smelting"
      flow_role: "Direct stack and fugitive air emissions"
      record_type: "CEMS, stack tests, abatement logs, activity data"
      raw_fields: "Pollutant concentration; gas flow; operating time; capture efficiency; bypass events"
      collection_method: "Continuous monitoring or representative testing; calculation only with source-specific factors"
      unit: "kg; mg/Nm3; Nm3/h"
      frequency: "Continuous or permit-compliant tests"
      temporal_coverage: "Representative of reporting period and operating states"
      site_scope: "Every material emission point and disclosed fugitive source"
      aggregation_rule: "Integrate concentration and flow; include starts, stops, and bypasses"
      quality_evidence: "Calibration, accredited test reports, detection limits, uncertainty, abatement uptime"
    - protocol_id: cp_air_water_emissions
      process_id: "refining_finishing"
      flow_role: "Direct air and water releases"
      record_type: "CEMS/tests, wastewater meter and analysis, abatement logs"
      raw_fields: "Pollutant concentration; flow; operating time; discharge volume"
      collection_method: "Monitoring and pollutant-specific mass calculation"
      unit: "kg; mg/Nm3; mg/L; m3"
      frequency: "Continuous or permit-compliant tests"
      temporal_coverage: "Representative of reporting period"
      site_scope: "All refining, casting, granulation, and wastewater outlets"
      aggregation_rule: "Integrate concentration and flow; keep air and water compartments separate"
      quality_evidence: "Calibration, laboratory QA/QC, detection limits, uncertainty"
    - protocol_id: cp_residue_fate
      process_id: "all_applicable_processes"
      flow_role: "Slag, dust, rejects, wastewater solids, spent materials"
      record_type: "Scales, manifests, invoices, stock ledger"
      raw_fields: "Gross generation; internal return; external shipment; composition; destination; legal status"
      collection_method: "Weighing or validated volume-density conversion plus stock reconciliation"
      unit: "kg; m3"
      frequency: "Each movement, aggregated monthly"
      temporal_coverage: "Same period as production denominator"
      site_scope: "Entire declared facility"
      aggregation_rule: "Report gross, internal return, external recovery, treatment, and disposal separately"
      quality_evidence: "Weigh tickets, manifests, receiver evidence, stock balance, classification records"
  calculation_rules:
    - id: calculate_normalization
      applies_to: "All inventory exchanges"
      rule: "normalized exchange = period exchange × 1000 / accepted ferro-nickel mass (kg)"
      inputs:
        - "Period exchange"
        - "accepted plant-gate ferro-nickel mass"
      output: "Exchange per 1,000 kg reference flow"
      source_ids:
        - eu-pef-method-2021
    - id: calculate_dry_mass
      applies_to: "Moist feeds and residues"
      rule: "dry mass = wet mass × (1 - moisture mass fraction); preserve wet mass and measured moisture"
      inputs:
        - "Wet mass"
        - "moisture fraction"
      output: "Dry mass and declared basis"
      source_ids:
        - ec-jrc-nfm-bref-2017
    - id: calculate_nickel_balance
      applies_to: "Whole foreground system and major unit processes"
      rule: "Reconcile nickel in feed, products, dusts, slags, stocks, wastewater, and measured releases; investigate unexplained imbalance before acceptance"
      inputs:
        - "Mass and nickel fraction of all relevant streams"
        - "stock changes"
      output: "Nickel balance and closure ratio"
      source_ids:
        - bartzas-komnitsas-ferronickel-lca-2015
    - id: calculate_monitored_emission
      applies_to: "Direct emissions"
      rule: "pollutant mass = time-integral(concentration × standardized flow) with unit, moisture, oxygen, and reference-condition corrections documented"
      inputs:
        - Concentration
        - "gas or water flow"
        - "operating time"
        - "correction factors"
      output: "Pollutant mass by compartment"
      source_ids:
        - ec-jrc-nfm-bref-2017
    - id: calculate_internal_recycle
      applies_to: "Dust, slag, alloy, and preparation recycle"
      rule: "Record gross generation and gross return; external waste or product output equals gross generation plus opening stock minus internal return minus closing stock, adjusted for verified transfers"
      inputs:
        - Generation
        - return
        - "stock changes"
        - transfers
      output: "Net external residue plus visible internal loop"
      source_ids:
        - ec-jrc-nfm-bref-2017
    - id: calculate_shared_burdens
      applies_to: "Shared utilities and treatment"
      rule: "Apply Section 7 hierarchy and document the selected causal driver or economic relation; allocation shares must sum to one"
      inputs:
        - "Shared burden"
        - "production measures"
        - "allocation driver"
      output: "Burden attributed to ferro-nickel"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_technology
      applies_to: "All foreground records"
      requirement: "Data shall represent the declared primary or secondary route, furnace technology, abatement, and product form; do not combine materially different routes without separate weighting."
      evidence: "Process description, route share, equipment list, operating logs"
    - id: dq_geography
      applies_to: "Energy, transport, upstream materials, and direct emissions"
      requirement: "Use site-specific foreground data and geographically appropriate upstream datasets; disclose proxies and grid-region mismatch."
      evidence: "Facility location, supplier origin, dataset geography, proxy register"
    - id: dq_time
      applies_to: "All records"
      requirement: "Use a common representative period, normally at least 12 consecutive months; justify shorter campaigns and identify abnormal shutdowns or start-ups."
      evidence: "Reporting dates, production log, representativeness statement"
    - id: dq_precision
      applies_to: "Measured and calculated quantities"
      requirement: "Retain calibration, sampling uncertainty, detection limits, missing-data treatment, and mass/energy balance closure; material unresolved imbalance fails validation."
      evidence: "QA/QC files, uncertainty records, balance worksheets"
    - id: dq_completeness
      applies_to: "All foreground processes"
      requirement: "Account for all material feeds, energy carriers, direct releases, slags, dusts, wastewater, and hazardous flows; any omission must be quantified and justified."
      evidence: "Completeness checklist, site reconciliation, exclusion log"
    - id: dq_source_identity
      applies_to: "Linked upstream data"
      requirement: "Record dataset UUID or durable identifier, version used in the data package, provider, geography, technology, and access date."
      evidence: "Data-source register and exchange links"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Reference product"
    rule: "Confirm CPC 3.0 41114, product name, product form, plant-gate state, and reference-flow UUID; reject refined nickel, matte, generic alloy, or waste-flow substitution."
    source_ids:
      - iso-6501-2020
  - rule_id: validate_reference_amount
    applies_to: "Reference flow"
    rule: "Confirm exactly 1,000 kg after normalization, using mass property 93a60a56-a3c8-11da-a746-0800200b9a66, mass unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_composition
    applies_to: "Product and nickel-bearing feeds"
    rule: "Require representative sampling, declared analytical basis, nickel content, specified impurities, and lot/campaign linkage; composition without sampling evidence is incomplete."
    source_ids:
      - iso-8049-2016
      - iso-8050-1988
  - rule_id: validate_route_boundary
    applies_to: "Dataset scope"
    rule: "Confirm route declaration and inclusion of every applicable required/conditional process, abatement, direct releases, residues, and linked upstream inputs."
    source_ids:
      - ec-jrc-nfm-bref-2017
  - rule_id: validate_inventory_balance
    applies_to: "Foreground inventory"
    rule: "Reconcile product mass, dry mass, nickel, energy, stocks, and internal recycle; investigate material unexplained imbalance and values outside screening ranges rather than clipping them."
    source_ids:
      - bartzas-komnitsas-ferronickel-lca-2015
  - rule_id: validate_allocation
    applies_to: "Shared operations and outputs"
    rule: "Confirm the allocation hierarchy was followed, shares sum to one, internal loops receive no avoided-product credit, and waste/co-product status is supported."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_data_quality
    applies_to: "All evidence"
    rule: "Confirm technological, geographical, temporal, precision, completeness, and source-identity evidence; disclose proxy and uncertainty limitations."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_reasoned_ranges
    applies_to: "Candidate QA guardrails"
    rule: "Treat reasoned-estimate ranges only as review triggers; require explanation and source-specific evidence for outliers, and never replace collected values with the range limits."
    source_ids:
      - ec-jrc-nfm-bref-2017
      - bartzas-komnitsas-ferronickel-lca-2015
published_dataset_profile:
  dataset_role: "Foreground data package for finished ferro-nickel production at plant gate"
  downstream_use: "Construction of TianGong process datasets and lifecyclemodel projections for cradle-to-gate alloy supply"
  allowed_use: "Route- and site-representative ferro-nickel inventories with declared composition, geography, period, upstream links, allocation, and residue fate"
  excluded_use: "Refined nickel, nickel matte, nickel pig iron marketed separately, generic nickel alloys, downstream steel products, or substitution of candidate screening ranges for measured data"
  required_metadata: "PCR id; CPC code; reference-flow UUID; nickel content and analytical basis; product form; route; feed type and recycled share; facility/geography; period; allocation; gate; upstream dataset identities"
  required_quality_disclosure: "Sampling and calibration evidence; direct-emission method; mass, nickel, and energy balance closure; exclusions; proxies; uncertainty; screening-range exceptions; waste/co-product decisions"
  update_trigger: "Change in product specification, route, furnace or abatement technology, feed mix, allocation, facility geography, or a material inventory parameter; otherwise review at least annually"
