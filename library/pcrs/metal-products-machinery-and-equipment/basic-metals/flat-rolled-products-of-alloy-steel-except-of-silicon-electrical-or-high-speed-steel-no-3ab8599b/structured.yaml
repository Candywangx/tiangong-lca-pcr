system_boundary:
  rules:
    - rule_id: sb_01_foreground_operations
      applies_to: "foreground cold-strip production"
      rule: "Include all on-site surface preparation, cold reduction, conditional annealing, temper/skin-pass rolling, width control, oiling, finishing, packaging, emission control, and directly associated wastewater treatment used for the declared product."
      source_ids:
        - ec-jrc-fmp-bref-2022
        - eu-2022-2110-ferrous-metals-bat
    - rule_id: sb_02_upstream_links
      applies_to: "purchased inputs and external operations"
      rule: "Represent steelmaking, casting, hot rolling, external pickling, purchased utilities and materials, transport, and off-site treatment with explicit upstream datasets rather than silently omitting them."
      source_ids: []
    - rule_id: sb_03_direct_releases
      applies_to: "elementary and waste flows"
      rule: "Record measured direct releases and each separately managed waste stream without combining acids, wastewater, sludge, oil, scrap, or air pollutants into umbrella rows."
      source_ids:
        - eu-2022-2110-ferrous-metals-bat
    - rule_id: sb_04_excluded_further_work
      applies_to: "downstream processing"
      rule: "Exclude metallic or organic coating, electroplating, forming, fabrication, distribution, use, and end-of-life unless the declared study broadens the boundary and reports them separately."
      source_ids:
        - unsd-cpc-3-0-structure-2025
    - rule_id: sb_05_recursive_inputs
      applies_to: "same-category purchased cold-rolled strip"
      rule: "Use the supplied upstream dataset once and disclose the recursion break; do not recreate an unverified cold-rolling history."
      source_ids: []
