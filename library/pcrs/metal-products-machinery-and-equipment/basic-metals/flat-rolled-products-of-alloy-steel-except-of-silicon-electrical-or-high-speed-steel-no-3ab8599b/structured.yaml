allocation_rules:
  - rule_id: allocation_01_subdivision
    applies_to: "all foreground operations"
    rule: "Prefer physical subdivision using process meters, production orders, grade campaigns, and lot records. Report any shared-resource allocation key and the share assigned to the reference product."
    source_ids: []
  - rule_id: allocation_02_steel_scrap
    applies_to: "alloy-steel scrap"
    rule: "Record scrap mass and destination at the generating process. Do not subtract an avoided-primary-steel credit inside the foreground process; apply the study's declared recycling method downstream and prevent double counting of internally remelted scrap."
    source_ids: []
  - rule_id: allocation_03_recovered_acid_oil
    applies_to: "recovered acid and oil"
    rule: "Subtract only measured material returned to the same process from make-up consumption. A recovered material exported as a product or waste remains an explicit output; allocation or substitution outside the plant boundary must be disclosed separately."
    source_ids:
      - eu-2022-2110-ferrous-metals-bat
  - rule_id: allocation_04_shared_treatment
    applies_to: "wastewater, waste-gas, and utility systems"
    rule: "Allocate shared treatment and utility burdens using measured flow, pollutant load, energy demand, or another causal physical driver; use mass allocation only when no more causal measure is available and document the choice."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_surface_preparation
      process_id: "surface_preparation"
      flow_role: "feed, electricity, water, bath chemicals, pickled output, spent acid, sludge, wastewater, HCl, and sulfur oxides"
      record_type: "weighbridge/coil ledger; meters; purchase and tank inventory; waste consignment; laboratory and emissions records"
      raw_fields: "lot id; grade; input/output mass; meter readings; chemical identity and concentration; tank opening/closing stock; waste mass/volume; dry solids; discharge volume; pollutant result; operating hours"
      collection_method: "calibrated meters and scales reconciled to production and environmental records"
      unit: "kg; m3; MJ"
      frequency: "per lot or shift, with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or complete shorter campaign disclosed"
      site_scope: "all on-site surface-preparation and associated treatment units serving the product"
      aggregation_rule: "sum eligible records, adjust inventories and internal reuse, assign by measured lot or causal driver, then normalize to output"
      quality_evidence: "calibration certificates; invoices; stock reconciliation; laboratory QA/QC; waste notes; monitoring reports"
    - protocol_id: cp_cold_rolling
      process_id: "cold_rolling"
      flow_role: "pickled input, electricity, lubricant, full-hard output, scrap, spent oil, and oil mist"
      record_type: "coil ledger; electricity submeter; lubricant inventory; scrap scale; waste consignment; air-monitoring record"
      raw_fields: "coil id; grade; input/output mass; electricity; lubricant purchases/stocks/recovery; scrap mass; spent-oil mass and water fraction; oil-mist result; operating hours"
      collection_method: "reconcile mill campaign records and calibrated meters to accepted output"
      unit: "kg; MJ"
      frequency: "per coil or campaign, with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or complete shorter campaign disclosed"
      site_scope: "all mill stands and directly associated systems"
      aggregation_rule: "assign direct records to lots; allocate shared records causally; normalize to output"
      quality_evidence: "meter and scale calibration; inventory balance; waste notes; monitoring QA/QC"
    - protocol_id: cp_annealing
      process_id: "annealing"
      flow_role: "full-hard input, natural gas, electricity, atmosphere gases, annealed output, fossil CO2, and nitrogen oxides"
      record_type: "furnace charge ledger; fuel and electricity meters; gas meters; output ledger; environmental inventory and stack monitoring"
      raw_fields: "charge id; grade; input/output mass; gas volume and reference conditions; heating value; electricity; H2/N2 volume and purity; CO2 mass; NOx species and mass; operating hours"
      collection_method: "reconcile furnace campaign records to metered utilities and monitored releases"
      unit: "kg; m3; MJ"
      frequency: "per charge or campaign, with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or complete shorter campaign disclosed"
      site_scope: "all annealing furnaces and atmosphere systems serving the product"
      aggregation_rule: "assign charge records directly; allocate shared meters by furnace time, mass, or measured energy; normalize to output"
      quality_evidence: "meter calibration; fuel certificates; atmosphere-gas certificates; emissions QA/QC; mass reconciliation"
    - protocol_id: cp_finishing
      process_id: "finishing_width_control"
      flow_role: "full-hard/annealed input, electricity, oil, finished output, and steel trim"
      record_type: "coil routing and inspection ledger; electricity submeter; oil inventory; output and scrap scales"
      raw_fields: "route state; coil id; grade; input/output mass; final width/thickness; electricity; oil issued; scrap mass; disposition"
      collection_method: "reconcile routing, inspection acceptance, and measured material/energy records"
      unit: "kg; MJ"
      frequency: "per coil or lot, with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or complete shorter campaign disclosed"
      site_scope: "temper mill, slitter, leveller, inspection, and oiling units actually used"
      aggregation_rule: "separate full-hard and annealed routes; assign actual operations; normalize to accepted output"
      quality_evidence: "calibration; route records; inspection certificate; oil stock reconciliation; scrap ticket"
    - protocol_id: cp_packaging_release
      process_id: "packaging_release"
      flow_role: "finished input, packaging components, and reference product"
      record_type: "production release record; certified scale; packaging bill of materials"
      raw_fields: "lot id; product qualifiers; unwrapped steel mass; packaged gross mass; strap mass; paper mass; packaging configuration; release date"
      collection_method: "weigh accepted steel separately from removable packaging and reconcile bill of materials"
      unit: "kg"
      frequency: "per released lot"
      temporal_coverage: "same period as foreground production"
      site_scope: "all packaging and release stations for the product"
      aggregation_rule: "sum net saleable steel; report packaging separately; normalize steel output to 1,000 kg"
      quality_evidence: "scale calibration; packing list; bill of materials; inspection and release certificate"
  calculation_rules:
    - id: calc_01_normalization
      applies_to: "every inventory amount"
      rule: "normalized amount = eligible process amount / eligible process output mass × 1,000 kg, with the process-output denominator stated"
      inputs:
        - "collected amount"
        - "accepted process output mass"
      output: "amount per 1,000 kg reference product or traceable process-output ratio"
      source_ids: []
    - id: calc_02_inventory_adjustment
      applies_to: "chemicals, oils, gases, and packaging"
      rule: "consumption = purchases + opening stock - closing stock - measured return or export; document stock boundaries and period matching"
      inputs:
        - purchase
        - stock
        - return
        - "and export records"
      output: "net consumed amount"
      source_ids: []
    - id: calc_03_steel_reconciliation
      applies_to: "each steel-processing step"
      rule: "input steel mass = accepted output + separately weighed scrap + measured other steel-bearing outputs + inventory change + explained measurement difference"
      inputs:
        - "coil weights"
        - "output weights"
        - "scrap and sludge records"
        - "inventory change"
      output: "reconciled mass-balance statement"
      source_ids: []
    - id: calc_04_energy_conversion
      applies_to: "reported electricity"
      rule: "MJ = metered kWh × 3.6; retain the original kWh record and do not convert natural gas volume without declared conditions and heating value"
      inputs:
        - kWh
        - "carrier metadata"
      output: "MJ electricity"
      source_ids: []
  data_quality_requirements:
    - id: dq_01_product_identity
      applies_to: "reference product and steel intermediates"
      requirement: "Retain grade, composition/specification, thickness, width, temper/annealed state, surface finish, edge, oiling, and lot traceability; verify final width is below 600 mm and product is not silicon-electrical or high-speed steel."
      evidence: "mill certificate; inspection and release record; product specification"
    - id: dq_02_completeness
      applies_to: "process map and inventory"
      requirement: "Cover every unit operation actually used and reconcile steel mass, utilities, chemicals, packaging, wastes, and monitored emissions to the same reporting period."
      evidence: "process routing; meter register; mass balance; completeness checklist"
    - id: dq_03_temporal_site
      applies_to: "foreground records"
      requirement: "Prefer a continuous representative 12-month period; disclose shorter campaigns, shutdowns, abnormal events, outsourced steps, and all sites represented."
      evidence: "dated production and environmental records; site list"
    - id: dq_04_measurement
      applies_to: "meters, scales, and laboratory results"
      requirement: "Use calibrated devices and documented sampling/analytical methods; retain raw units, reference conditions, detection limits, and below-detection treatment."
      evidence: "calibration certificates; laboratory QA/QC; monitoring plan"
    - id: dq_05_supplier_models
      applies_to: "upstream datasets"
      requirement: "Match geography, technology, product state, concentration, purity, electricity voltage, and waste destination; disclose material proxies and their contribution."
      evidence: "supplier declaration; dataset metadata; proxy register"
validation_rules:
  - rule_id: validation_01_identity
    applies_to: "reference product"
    rule: "Fail completeness if final width is not below 600 mm, the product is silicon-electrical or high-speed steel, the terminal state is beyond cold-rolled, or required grade/state/surface qualifiers are missing."
    source_ids:
      - unsd-cpc-3-0-structure-2025
  - rule_id: validation_02_reference_amount
    applies_to: "reference flow"
    rule: "Confirm that the reference output is exactly 1,000 kg net saleable steel and removable packaging is reported separately."
    source_ids: []
  - rule_id: validation_03_route
    applies_to: "process inclusion"
    rule: "Require cold rolling and product release; require evidence for omitting surface preparation or annealing, and record actual temper rolling, slitting, oiling, and outsourced operations."
    source_ids:
      - ec-jrc-fmp-bref-2022
  - rule_id: validation_04_atomicity
    applies_to: "inventory rows"
    rule: "Reject combined carrier, material, waste, wastewater/sludge, or air-emission labels; each exchange must remain one concrete flow with route conditions stated."
    source_ids: []
  - rule_id: validation_05_mass_balance
    applies_to: "steel-bearing flows"
    rule: "Require a documented reconciliation for each included process and investigate any difference outside the site's declared measurement uncertainty."
    source_ids: []
  - rule_id: validation_06_uuid_readiness
    applies_to: "Tiangong references"
    rule: "Treat UUID-empty rows as unresolved review items; do not substitute the rejected generic alternating-current flow or any proxy for the exact site/product state."
    source_ids: []
  - rule_id: validation_07_source_and_range
    applies_to: "externally constrained quantities"
    rule: "Reject empirical ranges inferred from fewer than two independent, original, boundary-compatible sources; retain foreground collection requirements while range evidence is unresolved."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after methodology review, UUID resolution or explicit accepted exceptions, and documented foreground-data quality review"
  downstream_use: "Product-flow, unit-process, aggregated process, and lifecycle-model projections for declared cold-rolled narrow alloy-steel products"
  allowed_use: "Studies whose product matches the alloy exclusions, terminal cold-rolled state, width below 600 mm, grade, temper, surface, geography, technology, and plant-gate boundary represented by the dataset"
  excluded_use: "Silicon-electrical steel; high-speed steel; stainless or other high-alloy products not represented by the declared identity; widths 600 mm or above; hot-rolled-only, coated, plated, formed, or otherwise further-worked products; undisclosed global generic substitution"
  required_metadata: "PCR id and version; product qualifiers; reference amount; site/geography; reporting period; feedstock state and upstream dataset; process route; pickling chemistry; mill and annealing technology; energy and gas conditions; allocation; scrap and waste destinations; emission controls; packaging; cut-offs; unresolved UUIDs or proxies"
  required_quality_disclosure: "temporal, geographical, and technological representativeness; primary-data share; meter and scale coverage; mass-balance closure; allocation shares; missing and estimated records; detection-limit handling; supplier dataset quality; range-evidence limitations"
  update_trigger: "material change in grade mix, width/thickness range, feedstock state, pickling chemistry, mill or furnace technology, annealing atmosphere, electricity or fuel supply, yield, emission control, waste route, packaging, site, or reporting period; or resolution/change of a referenced UUID"
