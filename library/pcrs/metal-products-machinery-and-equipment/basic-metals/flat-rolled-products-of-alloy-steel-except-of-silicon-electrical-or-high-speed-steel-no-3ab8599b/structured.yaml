    name: "Cold reduction"
    inclusion: "required"
    inclusion_condition: "Always include the mill operations that reduce thickness without preheating the strip."
    role: "foreground production"
    quantitative_reference: "kg full-hard cold-rolled strip output"
  - id: annealing
    name: "Annealing"
    inclusion: "conditional"
    inclusion_condition: "Include when the declared product is annealed or when heat treatment is required before finishing; exclude for verified full-hard delivery."
    role: "foreground heat treatment"
