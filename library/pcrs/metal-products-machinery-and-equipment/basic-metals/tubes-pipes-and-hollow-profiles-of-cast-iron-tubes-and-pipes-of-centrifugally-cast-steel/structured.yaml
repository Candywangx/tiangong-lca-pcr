allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "multi-product site operations"
    rule: "Prefer process subdivision and direct metering by furnace, casting line, heat-treatment batch and finishing line. Allocate shared measurements only after technically justified subdivision is exhausted."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "unavoidable shared burdens"
    rule: "Allocate shared burdens by a causal physical driver such as metered energy, operating time, treated mass or machine time. If no defensible physical relationship exists and multiple marketable products leave the system, use documented economic allocation and report a mass-allocation sensitivity result."
    source_ids: []
  - rule_id: allocation_internal_returns
    applies_to: "gates, risers, rejects, chips and dust returned on site"
    rule: "Treat internal returns as internal flows: retain the burdens that generated them, record remelting energy and yield loss, and do not assign an avoided-product credit within this product system."
    source_ids:
      - eu-jrc-sf-bref-2024
  - rule_id: allocation_exported_residues
    applies_to: "slag, dust, sand or metal residues leaving the site"
    rule: "Classify each exported residue as waste or co-product using the foreground disposition and market evidence. Do not apply an avoided-burden credit inside this gate-to-gate inventory; any downstream substitution belongs in an explicitly separate scenario."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_charge_materials
      process_id: "metal_melting_and_treatment"
      flow_role: "external metallics, flux and treatment additions"
      record_type: "scale tickets, batch sheets and supplier certificates"
      raw_fields: "material identity; supplier grade; batch id; gross/tare/net mass; moisture or assay basis; furnace; product route"
      collection_method: "Reconcile calibrated scale tickets to batch sheets and purchasing records"
      unit: "kg and declared composition basis"
      frequency: "each charge"
      temporal_coverage: "complete reporting period"
      site_scope: "all furnaces serving the declared product"
      aggregation_rule: "Sum external inputs by exact material and route; exclude internal returns from external-input totals"
      quality_evidence: "scale calibration; supplier certificate; batch reconciliation"
    - protocol_id: cp_fuels_and_energy
      process_id: "metal_melting_and_treatment"
      flow_role: "coke, natural gas and electricity"
      record_type: "charge sheets, invoices and process meters"
      raw_fields: "fuel identity; coke mass; gas volume; temperature/pressure convention; kWh; meter id; furnace; operating period"
      collection_method: "Direct weigh or submeter; document allocation only where a shared meter cannot be subdivided"
      unit: "kg, m3, kWh and MJ"
      frequency: "each batch or meter interval"
      temporal_coverage: "complete reporting period"
      site_scope: "melting, holding and associated control equipment"
      aggregation_rule: "Sum by energy carrier and convert kWh to MJ using calc_electricity_conversion"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_internal_mass_balance
      process_id: "all_foreground_processes"
      flow_role: "molten metal and pipe-body intermediates"
      record_type: "ladle, scale, production and rejection records"
      raw_fields: "route; batch; input mass; output mass; returns; spills; rejects; transfer point"
      collection_method: "Reconcile successive process-stage records without creating an external upstream burden for internal returns"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete reporting period"
      site_scope: "all included lines"
      aggregation_rule: "Sum by route and stage; disclose unexplained mass-balance difference"
      quality_evidence: "calibrated scales; signed batch reconciliation; reject log"
    - protocol_id: cp_casting_materials
      process_id: "centrifugal_casting"
      flow_role: "sand lining and core material"
      record_type: "issue, return and reclamation records"
      raw_fields: "sand identity; dry/as-received mass; mould type; core use; recovered mass; discarded mass"
      collection_method: "Weigh fresh/external sand and reconcile internal reuse"
      unit: "kg"
      frequency: "each batch or shift"
      temporal_coverage: "complete reporting period"
      site_scope: "all included casting machines"
      aggregation_rule: "Sum external sand by exact product; do not count internal recirculation as a new input"
      quality_evidence: "scale calibration; reclamation log; stock reconciliation"
    - protocol_id: cp_casting_energy
      process_id: "centrifugal_casting"
      flow_role: "casting-line electricity"
      record_type: "submeter or allocated site-meter record"
      raw_fields: "kWh; meter id; casting machine; cooling system; operating time; product batch"
      collection_method: "Direct submeter preferred; otherwise allocate by measured machine time and rated/verified load"
      unit: "kWh and MJ"
      frequency: "meter interval"
      temporal_coverage: "complete reporting period"
      site_scope: "rotating mould, cooling, extraction and direct auxiliaries"
      aggregation_rule: "Sum readings and convert by calc_electricity_conversion"
      quality_evidence: "meter calibration; machine-time log; allocation worksheet"
    - protocol_id: cp_heat_treatment_records
      process_id: "heat_treatment"
      flow_role: "heat-treatment inputs"
      record_type: "furnace recipe, gas/electric meter and quench makeup record"
      raw_fields: "grade; batch; cycle; temperature/time record; gas volume; kWh; water makeup; quench route"
      collection_method: "Link each heat-treatment cycle to product batch and process meters"
      unit: "m3, kWh, MJ and kg"
      frequency: "each cycle"
      temporal_coverage: "complete reporting period"
      site_scope: "all included heat-treatment furnaces"
      aggregation_rule: "Sum by route and normalize to accepted product from the same batches"
      quality_evidence: "calibrated meters; validated furnace chart; quench-tank balance"
    - protocol_id: cp_finishing_records
      process_id: "finishing_testing_and_coating"
      flow_role: "machining, testing and applied lining/coating inputs"
      record_type: "line meters, batch issue records, test logs and coating records"
      raw_fields: "product batch; kWh; water makeup; cement/sand/zinc identity and mass; applied system; recovery; test status"
      collection_method: "Reconcile issued material and utility meters to accepted and rejected products"
      unit: "kg, kWh and MJ"
      frequency: "each batch or shift"
      temporal_coverage: "complete reporting period"
      site_scope: "all included finishing and test lines"
      aggregation_rule: "Sum exact inputs by route and surface system; exclude absent coating/lining rows"
      quality_evidence: "meter/scale calibration; material certificate; coating and test log"
    - protocol_id: cp_waste_outputs
      process_id: "all_foreground_processes"
      flow_role: "separately identified waste outputs"
      record_type: "waste scale tickets, internal return logs and transfer manifests"
      raw_fields: "waste identity; process origin; mass; moisture; destination; internal return; hazardous classification"
      collection_method: "Weigh each atomic waste stream and reconcile transfers and internal returns"
      unit: "kg"
      frequency: "each transfer and monthly reconciliation"
      temporal_coverage: "complete reporting period"
      site_scope: "all included process areas"
      aggregation_rule: "Sum by exact waste identity and disposition; do not combine slag, sand, dust or metal chips"
      quality_evidence: "calibrated scales; signed manifests; stock-change reconciliation"
    - protocol_id: cp_direct_air_releases
      process_id: "all_foreground_processes"
      flow_role: "direct elementary releases"
      record_type: "CEMS, stack tests, fugitive tests and verified fuel-carbon records"
      raw_fields: "substance; process; concentration; exhaust flow; operating time; control state; fuel/charge amount; carbon data"
      collection_method: "Use site-specific monitoring or representative compliant testing; use carbon calculation only with verified foreground activity and supplier data"
      unit: "kg, concentration and flow units"
      frequency: "continuous or each representative campaign"
      temporal_coverage: "representative coverage of the reporting period"
      site_scope: "all included stacks and material fugitive sources"
      aggregation_rule: "Calculate released mass by substance and process; prevent overlap between total particulate and size fractions"
      quality_evidence: "instrument calibration; laboratory report; sampling plan; operating-condition match"
    - protocol_id: cp_reference_product
      process_id: "finishing_testing_and_coating"
      flow_role: "accepted product output"
      record_type: "production, weighing and final-inspection records"
      raw_fields: "product id; route; grade; dimensions; standard; lining/coating; gross/net mass; acceptance result; rejection reason"
      collection_method: "Sum calibrated net masses only for conforming product"
      unit: "kg"
      frequency: "each accepted unit or batch"
      temporal_coverage: "complete reporting period"
      site_scope: "all included finishing lines"
      aggregation_rule: "Normalize all exchanges by calc_reference_normalization"
      quality_evidence: "scale calibration; dimensional/mechanical/pressure test records; release certificate"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory exchange"
      rule: "Normalized amount = reporting-period exchange amount × 1,000 / reporting-period net accepted product mass. Apply within the declared route and product group before aggregation."
      inputs:
        - "exact exchange amount"
        - "net accepted product mass"
      output: "amount per 1,000 kg accepted reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "electricity records"
      rule: "Electricity (MJ) = metered electricity (kWh) × 3.6. Retain kWh and conversion trace."
      inputs:
        - "metered kWh"
      output: "MJ"
      source_ids: []
    - id: calc_gas_reference_condition
      applies_to: "natural gas and oxygen"
      rule: "Convert a measured gas volume only when temperature, absolute pressure and compressibility/reference convention are documented; otherwise retain the measured condition and flag it as non-comparable."
      inputs:
        - "measured volume"
        - temperature
        - pressure
        - "reference convention"
      output: "m3 at declared condition"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "direct fuel and charge-carbon oxidation"
      rule: "Use measured stack mass where representative. Otherwise calculate from verified foreground fuel/charge quantity and supplier-specific fossil-carbon data, subtracting only documented carbon retained in products or separately measured carbon-bearing outputs; do not use the UUID identity as an emission factor."
      inputs:
        - "foreground activity"
        - "supplier carbon data"
        - "retained-carbon records"
      output: "kg direct fossil CO2"
      source_ids:
        - eu-jrc-sf-bref-2024
    - id: calc_mass_balance
      applies_to: "each foreground process"
      rule: "Reconcile product and waste outputs against material inputs and internal transfers on a consistent moisture and composition basis; investigate rather than distribute unexplained differences."
      inputs:
        - "calibrated input/output masses"
        - "stock change"
        - "internal returns"
      output: "documented process mass-balance check"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and all inputs/outputs"
      requirement: "Preserve exact material/flow identity, route, grade, state, supplier specification and disposition. Do not replace missing rows with umbrella material or waste categories."
      evidence: "supplier certificates, Tiangong UUID audit, batch records and waste manifests"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Cover a representative continuous reporting period, normally at least 12 months or a complete shorter campaign justified for campaign production; document shutdowns and abnormal batches."
      evidence: "dated meter, production, purchase, test and waste records"
    - id: dq_technology
      applies_to: "furnace, casting, treatment and finishing"
      requirement: "Demonstrate that records correspond to the declared furnace, centrifugal-casting machine, mould route, heat-treatment recipe and surface system."
      evidence: "equipment list, process flow diagram, batch genealogy and line-meter mapping"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile purchased inputs, internal returns, accepted product, rejects and wastes; list every directly measured regulated release and explain any unmeasured expected release."
      evidence: "mass/energy balance, emissions inventory and completeness checklist"
    - id: dq_measurement
      applies_to: "measured quantities"
      requirement: "Use calibrated instruments and retain original readings, units, conversion steps, meter coverage and allocation worksheets."
      evidence: "calibration certificates, raw exports and calculation workbook"
    - id: dq_proxy
      applies_to: "upstream datasets"
      requirement: "Document geography, technology, time and product-state match for each upstream dataset; disclose and justify every proxy."
      evidence: "dataset mapping register and proxy justification"
validation_rules:
  - rule_id: validation_identity
    applies_to: "dataset identity"
    rule: "Confirm that the product is cast iron or a steel pipe/tube whose body is centrifugally cast, that fittings and wrought/welded routes are excluded, and that the reference product UUID, Mass property and kg unit match this PCR."
    source_ids:
      - unsd-cpc-3-0-structure-2025
      - eu-jrc-sf-bref-2024
  - rule_id: validation_qualifiers
    applies_to: "required metadata"
    rule: "Fail completeness when route, grade, dimensions, product standard/service class, furnace, mould, heat treatment, machining, lining/coating, geography or reporting period is missing."
    source_ids:
      - iso-2531-2009
      - astm-a451-a451m-20
  - rule_id: validation_processes
    applies_to: "process coverage"
    rule: "Require melting/treatment, centrifugal casting, and finishing/testing. Require heat treatment when batch or standard records show it is applied; require each declared lining/coating input when present on the as-sold product."
    source_ids:
      - eu-jrc-sf-bref-2024
      - dipra-cast-iron-pipe-handbook-1978
      - astm-a451-a451m-20
  - rule_id: validation_atomic_inventory
    applies_to: "inventory rows"
    rule: "Confirm every row is one atomic exchange with direction, flow type, property, unit, amount-production rule, specificity, normalization basis, evidence and collection protocol; reject combined materials, carriers, wastes or releases."
    source_ids: []
  - rule_id: validation_mass_energy
    applies_to: "balances and normalization"
    rule: "Confirm the 1,000 kg reference output, reconcile internal transfers and returns, investigate unexplained mass differences, and reconcile carrier-specific energy records to meters without double counting."
    source_ids: []
  - rule_id: validation_direct_releases
    applies_to: "elementary flows"
    rule: "Confirm that direct fossil CO2, fossil CO and particulate rows include only on-site releases for the named process and that upstream electricity/material emissions and overlapping particulate size fractions are not duplicated."
    source_ids:
      - us-epa-ap42-gray-iron-foundries-2003
      - us-epa-ap42-steel-foundries-1995
  - rule_id: validation_ranges
    applies_to: "quantitative QA"
    rule: "Treat this candidate PCR as having no external empirical amount ranges. Do not infer a range from one case, one publication or incompatible routes; use foreground collection until two independent, boundary-compatible original sources are reviewed."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after review and publication"
  downstream_use: "Product carbon footprints, LCA process datasets and lifecycle models requiring a factory-gate inventory for the declared cast-iron or centrifugally cast-steel product"
  allowed_use: "Use when product route, grade/state, dimensions, standard/service class, geography, technology, period and surface system match the downstream study or are transparently adjusted"
  excluded_use: "Do not use for welded, wrought, rolled, extruded or seamless-pierced steel tubes; fittings; installed pipelines; or downstream use/end-of-life without additional modelling"
  required_metadata: "PCR id/version; reference product UUID; route; grade; dimensions; product standard and service class; furnace and mould technology; heat treatment; machining; tests; lining/coating; geography; period; allocation; upstream dataset mapping"
  required_quality_disclosure: "Primary-data coverage; meter and scale coverage; mass/energy reconciliation; internal-return treatment; rejection rate; direct-emission method; waste disposition; proxy use; unresolved UUIDs; absence of external empirical ranges"
  update_trigger: "Change in furnace or casting technology, metal grade family, charge mix, heat-treatment recipe, abatement, machining allowance, product standard, lining/coating system, geography, allocation, or evidence sufficient to resolve UUID/range gaps"
