allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared tube-mill processes"
    rule: "Avoid allocation by submetering or time-, mass- or batch-resolving each product family and process wherever technically possible."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_shared_operations
    applies_to: "unavoidable shared utilities or treatment"
    rule: "When subdivision is not possible, allocate only the shared quantity using a documented physical driver that reflects causation, such as metered operating time, processed mass, furnace charge mass or wastewater volume; disclose the driver and sensitivity."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_internal_intermediates
    applies_to: "heated billet, hollow shell and tube blank"
    rule: "Internal intermediates carry measured upstream burdens forward without economic allocation and must not be counted as co-products."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "post-industrial steel scrap and mill scale"
    rule: "Report gross scrap and mill-scale outputs and destinations separately. Do not embed an avoided-burden credit in the foreground inventory; if recycling benefits are modelled, report the selected recycling method and result separately and consistently with scrap inputs."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_billet_heating_records
      process_id: "billet_heating_conditioning"
      flow_role: "every listed input and output"
      record_type: "weighbridge, production log, utility meter, fuel invoice and stack-monitoring record"
      raw_fields: "timestamp; lot; product form; grade; input/output mass; meter start/end; gas conditions; fuel properties; emission basis; downtime"
      collection_method: "reconcile lot records with calibrated meters and invoices"
      unit: "kg; m3; MJ"
      frequency: "each lot and monthly reconciliation"
      temporal_coverage: "full representative reporting period covering normal operating variation, or a shorter campaign with justification"
      site_scope: "all equipment serving the declared product at the site"
      aggregation_rule: "sum valid records, subtract documented returns, allocate shared meters only with disclosed physical driver, then normalize to conforming output"
      quality_evidence: "calibration certificates, invoices, batch genealogy, meter coverage and reconciliation residual"
    - protocol_id: cp_piercing_rolling_records
      process_id: "piercing_hot_rolling"
      flow_role: "every listed input and output"
      record_type: "production log, electricity meter, water meter, waste ticket and emission-monitoring record"
      raw_fields: "timestamp; lot; intermediate mass; electricity; water makeup; recirculation; scale mass and moisture; wastewater mass and destination; particulate result"
      collection_method: "link records by lot and operating period and reconcile water and steel balances"
      unit: "kg; MJ"
      frequency: "each lot and monthly reconciliation"
      temporal_coverage: "full representative reporting period covering normal operating variation, or a shorter campaign with justification"
      site_scope: "piercing, elongation, rolling, descaling and associated treatment at the site"
      aggregation_rule: "aggregate only records with the same boundary and normalize to hollow-shell and reference-product mass"
      quality_evidence: "meter calibration, scale tickets, laboratory reports, discharge records and balance closure"
    - protocol_id: cp_heat_treatment_records
      process_id: "heat_treatment"
      flow_role: "every listed input and output"
      record_type: "route log, utility meter, fuel invoice, water meter and stack-monitoring record"
      raw_fields: "timestamp; lot; grade; heat-treatment cycle; input/output mass; gas conditions; fuel mass; electricity; cooling-water makeup; emissions"
      collection_method: "link route and utility records to treated lots and separate bypassed as-rolled lots"
      unit: "kg; m3; MJ"
      frequency: "each lot and monthly reconciliation"
      temporal_coverage: "full representative reporting period covering normal operating variation, or a shorter campaign with justification"
      site_scope: "heat-treatment and controlled-cooling equipment at the site"
      aggregation_rule: "aggregate by declared route and normalize to treated output and final reference product"
      quality_evidence: "cycle records, calibration, invoices, meter coverage and emission-monitoring evidence"
    - protocol_id: cp_finishing_testing_records
      process_id: "finishing_testing"
      flow_role: "every listed input and output"
      record_type: "production order, material issue, utility meter, test record, weighbridge and waste/discharge record"
      raw_fields: "lot; product form; specification; dimensions; grade; end finish; component masses; consumable issues/returns; water; electricity; test status; product mass; scrap; wastewater"
      collection_method: "maintain lot genealogy from tube blank through conforming shipped product and rejected outputs"
      unit: "kg; MJ"
      frequency: "each lot and monthly reconciliation"
      temporal_coverage: "full representative reporting period covering normal operating variation, or a shorter campaign with justification"
      site_scope: "all finishing, joining, inspection, testing and on-site treatment operations included at the gate"
      aggregation_rule: "sum conforming product only; separate casing, tubing and drill pipe and connection state before any aggregation"
      quality_evidence: "material certificates, inspection/test reports, calibration, inventory issues, waste tickets and shipment mass"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "every inventory row"
      rule: "normalized amount = valid process-period exchange divided by conforming reference-product mass from the same reconciled period"
      inputs:
        - "exchange quantity"
        - "ft_reference_product mass"
      output: "exchange per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity rows"
      rule: "electricity in MJ = metered electricity in kWh multiplied by 3.6 MJ/kWh"
      inputs:
        - "unrounded kWh reading"
      output: "MJ electricity"
      source_ids: []
    - id: calc_combustion_co2
      applies_to: "bh_co2; ht_co2 when direct measurement is unavailable"
      rule: "calculate fossil carbon dioxide from metered fuel quantity, documented fuel carbon content, oxidation basis and unit conversions; retain every input and do not substitute upstream electricity emissions"
      inputs:
        - "fuel quantity"
        - "carbon content"
        - "oxidation basis"
        - "conversion factors"
      output: "kg fossil carbon dioxide"
      source_ids: []
    - id: calc_steel_balance
      applies_to: "steel-bearing rows"
      rule: "steel balance residual = declared steel feed minus conforming product minus measured scrap, scale and inventory change on a consistent dry-mass basis"
      inputs:
        - "steel feed"
        - product
        - scrap
        - scale
        - "work-in-progress change"
      output: "kg unexplained steel-balance residual"
      source_ids: []
    - id: calc_water_balance
      applies_to: "process and cooling water"
      rule: "water discharge and loss reconciliation uses makeup plus transferred water minus discharge, evaporation, retained water and inventory change; gross recirculation is excluded from input"
      inputs:
        - makeup
        - discharge
        - "evaporation estimate"
        - "retained water"
        - "inventory change"
      output: "kg water-balance residual"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain product form, specification and edition, grade, dimensions, length, heat treatment, end finish, connection state, coating, inspection/test status and lot genealogy."
      evidence: "mill test certificate, production order and shipment record"
    - id: dq_measurement
      applies_to: "measured exchanges"
      requirement: "Use calibrated meters or scales; disclose meter coverage, estimated shares, reference gas conditions, water conversion density and shared-meter allocation."
      evidence: "calibration certificates, meter map and reconciliation workbook"
    - id: dq_temporal
      applies_to: "foreground dataset"
      requirement: "Use a full representative reporting period covering normal operating variation; justify shorter campaigns, abnormal shutdown exclusions and production-mix differences."
      evidence: "dated production schedule and completeness report"
    - id: dq_completeness
      applies_to: "all listed rows"
      requirement: "Screen every atomic row for applicability and record measured zero only with evidence; identify additional site-specific materials, wastes and emissions rather than hiding them in an umbrella flow."
      evidence: "signed applicability review, material ledger and permit inventory"
    - id: dq_source_match
      applies_to: "upstream datasets"
      requirement: "Match steel route and grade, fuel delivery state, electricity geography/voltage, water source and waste-treatment destination as closely as available and disclose proxies."
      evidence: "supplier data, dataset metadata and proxy register"
validation_rules:
  - rule_id: validate_identity
    applies_to: "product and reference flow"
    rule: "Confirm that the output is seamless steel casing, tubing or drill pipe for oil or gas drilling or well operations and that all required qualifiers are present; reject welded pipe, line pipe and general-purpose tube substitutions."
    source_ids:
      - un-cpc-3-0-structure-2025
      - api-5ct-11-announcement-2023
  - rule_id: validate_reference_mass
    applies_to: "normalization"
    rule: "Confirm that every normalized exchange uses the same net conforming product mass and factory gate, with supplied couplings or tool joints treated consistently."
    source_ids:
      - api-5ct-11-announcement-2023
  - rule_id: validate_process_route
    applies_to: "process map"
    rule: "Confirm heating, piercing, elongation and final rolling are represented; confirm heat treatment, supplied couplings/tool joints, cleaning, coating and thread compound are included exactly when the declared route uses them."
    source_ids:
      - ec-jrc-ferrous-metals-processing-2022
      - samr-gbt-29166-2021
  - rule_id: validate_balances
    applies_to: "steel and water balances"
    rule: "Recalculate steel and water balances from unrounded records, investigate residuals and disclose unresolved loss or inventory-change terms."
    source_ids: []
  - rule_id: validate_energy_and_emissions
    applies_to: "fuel, electricity and direct emissions"
    rule: "Reconcile purchased energy to meters and invoices, keep direct combustion emissions separate from upstream supply emissions and confirm gas reference conditions."
    source_ids:
      - worldsteel-lci-methodology-2017
      - ec-jrc-ferrous-metals-processing-2022
  - rule_id: validate_waste_and_recycling
    applies_to: "mill scale, scrap and wastewater"
    rule: "Confirm measured quantities, moisture or contamination basis, treatment or recycling destination and absence of embedded avoided-burden credits in foreground amounts."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_unresolved_uuid_rows
    applies_to: "UUID-empty inventory rows"
    rule: "Keep the selected flow UUID empty until an exact state-100 Tiangong identity is directly verified; do not substitute a broader, duplicate-ambiguous or differently classified candidate."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "cradle-to-gate modelling of seamless steel casing, tubing or drill pipe when product, route, geography, period and gate qualifiers match"
  excluded_use: "welded pipe; line pipe; general-purpose tube; installation, use or end-of-life; product comparisons with mismatched specifications, routes or gates"
  required_metadata: "canonical PCR id; product form; specification and edition; grade; dimensions; length; heat treatment; end finish; connection and supplied-component state; coating; inspection/test status; site; geography; period; billet/bloom state; steelmaking route; furnace fuels; electricity supply; water boundary; waste destinations; allocation; data-quality indicators"
  required_quality_disclosure: "foreground coverage; primary-data share; meter and scale coverage; allocation drivers; balance residuals; upstream dataset match; proxy uses; unresolved UUID rows; uncertainty and exclusions"
  update_trigger: "material change in product specification, steel grade mix, feedstock route, piercing/rolling technology, furnace fuel, heat treatment, finishing or connection state, site, electricity supply, water circuit, waste route, allocation method or data period"
data_sources:
  - id: "un-cpc-3-0-structure-2025"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "exact CPC 41282 identity and exclusion of welded and other seamless-pipe subclasses"
