    reference: "https://worldsteel.org/media/publications/lci-report-2017-pdf/?do_download_id=7f96813a-3756-4842-8dbc-38ce201f2914"
    used_for: "cradle-to-gate steel inventory boundary, upstream coverage and consistent scrap/recycling treatment"
