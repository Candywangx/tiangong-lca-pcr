      collection_method: "Reconcile purchases and tank inventory; keep each acid separate."
      unit: "kg solution"
      frequency: "each delivery and monthly stocktake"
      temporal_coverage: "same representative production period"
      site_scope: "included pickling line and storage"
      aggregation_rule: "opening plus receipts minus closing minus documented transfers"
      quality_evidence: "supplier specification, weigh ticket and tank calibration"
    - protocol_id: cp_process_water
      process_id: "chemical_pickling_and_cold_rolling"
