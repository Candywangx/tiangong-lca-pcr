system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins with receipt of hot-rolled non-alloy steel strip and ends with net conforming cold-rolled product after final width control at the factory gate. It includes chemical pickling, cold reduction, conditional annealing and atmosphere generation at the line, conditional tempering, finishing, slitting, direct utilities, direct emissions, on-site treatment attributable to these operations, and outgoing process wastes. Production of hot-rolled feed, purchased chemicals, electricity, gas and water is represented by linked upstream datasets. Customer transport, use, downstream fabrication and end-of-life are outside this gate-to-gate boundary."
      source_ids: []
    - rule_id: system_boundary_rule_1_2
      applies_to: "Foreground start and end"
      rule: "Start at hot-rolled strip receipt and end at net conforming product after finishing and width verification; keep packaging outside the reference product mass."
      source_ids:
        - ec-jrc-fmp-bref-2022
    - rule_id: system_boundary_rule_2
      applies_to: "Conditional routes"
      rule: "Include annealing, atmosphere gases, tempering, slitting, protective oil and their exchanges only when actual production records show that operation for the represented product."
      source_ids:
        - ec-jrc-fmp-bref-2022
    - rule_id: system_boundary_rule_3
      applies_to: "Treatment and recycling loops"
      rule: "Record make-up inputs and net outputs crossing each foreground process boundary; do not count internally recirculated acid, emulsion, cooling water or internally returned scrap as a new external exchange."
      source_ids:
        - ec-jrc-fmp-bref-2022
    - rule_id: system_boundary_rule_4
      applies_to: "Excluded life-cycle stages"
      rule: "Exclude customer transport, use, downstream fabrication and end-of-life; require linked datasets for all purchased inputs crossing the foreground start boundary."
      source_ids: []
