  calculation_rules:
    - id: calculation_rule_1
      applies_to: "All inventory rows"
      rule: "normalized amount = allocated reporting-period exchange × 1,000 / net kg conforming reference product"
      inputs:
        - "row exchange"
        - "allocation result"
        - "reference_product_output mass"
      output: "row amount per 1,000 kg"
      source_ids: []
    - id: calculation_rule_2
      applies_to: "Electricity"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calculation_rule_3
      applies_to: "Steel mass balance"
      rule: "mass-balance difference = steel input − conforming product − net exported steel-bearing outputs − measured process loss; investigate sign and magnitude rather than forcing closure"
      inputs:
        - "calibrated steel mass records"
      output: "disclosed mass-balance check"
      source_ids: []
    - id: calculation_rule_4
      applies_to: "Conditional rows"
      rule: "A conditional row is not applicable only when route records demonstrate absence; zero and missing are not interchangeable."
      inputs:
        - "route log"
        - "product specification"
        - "row record"
      output: "applicability flag and amount"
      source_ids:
        - ec-jrc-fmp-bref-2022
    - id: calculation_rule_5
      applies_to: "Gas volume"
      rule: "Use only volumes at the same declared reference temperature, absolute pressure and moisture basis; document any conversion without deleting raw meter values."
      inputs:
        - "raw volume and reference conditions"
      output: "condition-consistent m3"
      source_ids: []
    - id: calculation_rule_6
      applies_to: "Process Water rows"
      rule: "water mass (kg) = metered net make-up volume (m3) × measured or supplier-declared density (kg/m3) at documented reference conditions"
      inputs:
        - "raw make-up volume"
        - "density and density reference conditions"
      output: "Process Water mass in kg"
      source_ids: []
