allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "Process subdivision"
    rule: "Avoid allocation by using process-specific meters, batch records and mass balances for pickling, rolling, annealing and finishing."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "Shared utilities"
    rule: "Allocate a shared meter to represented production using logged operating time and measured or rated load; disclose formula, denominator, other users and sensitivity."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "Internal loops"
    rule: "Assign no new external input or output to acid, emulsion, cooling water or scrap recirculated within the declared foreground boundary; record only make-up and net exported quantities."
    source_ids:
      - ec-jrc-fmp-bref-2022
  - rule_id: allocation_rule_4
    applies_to: "Conforming product and exported ferrous scrap"
    rule: "First subdivide direct scrap-generating operations. If inseparable burdens remain, allocate those burdens by measured dry mass between conforming output and exported ferrous scrap, without avoided-burden credit, and disclose the treatment in the downstream model."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "Off-specification steel"
    rule: "Return internally reprocessed steel to the mass balance without a second production burden; treat steel leaving the boundary as its specific waste or co-product flow and disclose destination."
    source_ids:
      - ec-jrc-fmp-bref-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_steel_mass_balance
      process_id: "all_foreground_processes"
      flow_role: "steel inputs, intermediates, product and scrap"
      record_type: "scale and production record"
      raw_fields: "timestamp, batch or coil id, flow role, gross mass, tare, net mass, grade, width, disposition"
      collection_method: "Reconcile calibrated scale records by coil or batch and reporting period."
      unit: "kg"
      frequency: "each coil or batch"
      temporal_coverage: "same representative production period"
      site_scope: "all included lines at one declared site"
      aggregation_rule: "Sum net mass by row, then normalize after allocation."
      quality_evidence: "calibration certificate, batch trace and signed mass-balance reconciliation"
    - protocol_id: cp_pickling_chemicals
      process_id: "chemical_pickling"
      flow_role: "hydrochloric or sulfuric acid input"
