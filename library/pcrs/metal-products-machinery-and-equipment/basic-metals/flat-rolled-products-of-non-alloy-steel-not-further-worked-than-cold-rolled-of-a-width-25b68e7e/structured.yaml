      collection_method: "Read submeter or reconcile documented batch additions; separate recirculation from make-up; convert net volume to mass using measured or supplier-declared density."
      unit: "m3 and kg"
      frequency: "shift or batch"
      temporal_coverage: "same representative production period"
      site_scope: "included process water users"
      aggregation_rule: "Sum the converted make-up mass by row while retaining raw volume and density records."
      quality_evidence: "meter calibration, density evidence and water-balance closure"
    - protocol_id: cp_electricity_meters
      process_id: "chemical_pickling_cold_rolling_and_annealing"
      flow_role: "alternating-current electricity"
      record_type: "meter and operating log"
      raw_fields: "meter id, opening kWh, closing kWh, process runtime, load, downtime"
