      unit: "kWh and MJ"
      frequency: "shift or meter interval"
      temporal_coverage: "same representative production period"
      site_scope: "included line equipment and auxiliaries"
      aggregation_rule: "Sum kWh, allocate if needed, multiply by 3.6 and normalize."
      quality_evidence: "meter calibration, interval export and allocation worksheet"
    - protocol_id: cp_pickling_residuals
      process_id: "chemical_pickling"
      flow_role: "spent liquor, sludge and acidic wastewater"
      record_type: "transfer, tank, scale and treatment record"
      raw_fields: "stream id, mass or volume, concentration, dry solids, pH, treatment state, destination"
      collection_method: "Measure each chemically distinct stream at transfer or treatment boundary."
      unit: "kg or m3"
      frequency: "each transfer and monthly reconciliation"
      temporal_coverage: "same representative production period"
      site_scope: "included pickling and attributable treatment"
      aggregation_rule: "Sum each row separately; never combine acid routes."
      quality_evidence: "manifest, laboratory result and treatment log"
    - protocol_id: cp_rolling_fluids
      process_id: "cold_rolling"
      flow_role: "lubricant make-up and spent emulsion"
      record_type: "issue, tank and treatment record"
      raw_fields: "product id, mass, water fraction, opening stock, closing stock, removal, destination"
      collection_method: "Reconcile lubricant stock and measured removed emulsion separately."
      unit: "kg"
      frequency: "batch and monthly stocktake"
      temporal_coverage: "same representative production period"
      site_scope: "cold mill emulsion circuit"
      aggregation_rule: "Sum make-up and removed quantities by row."
      quality_evidence: "product specification, stock ledger and waste manifest"
    - protocol_id: cp_annealing_fuels
      process_id: "annealing"
      flow_role: "gaseous natural gas"
      record_type: "custody meter record"
      raw_fields: "meter id, volume, temperature, pressure, moisture basis, fuel period"
