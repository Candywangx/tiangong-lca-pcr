  - id: cold_rolling
    name: "Cold rolling"
    inclusion: "required"
    inclusion_condition: "Include cold reduction without prior heating and the associated lubricant circuit."
    role: "Reduce thickness and establish the cold-rolled strip state."
    quantitative_reference: "Mass of cold_rolled_strip_output"
  - id: annealing
    name: "Annealing"
    inclusion: "conditional"
    inclusion_condition: "Include only when product records require post-rolling heat treatment; preserve batch or continuous and gas-fired or electric route."
    role: "Restore or adjust ductility and metallurgical properties."
    quantitative_reference: "Mass of annealed_strip_output"
