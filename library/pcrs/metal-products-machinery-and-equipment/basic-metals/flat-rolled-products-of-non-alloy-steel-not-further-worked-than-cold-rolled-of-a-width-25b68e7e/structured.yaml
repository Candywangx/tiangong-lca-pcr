validation_rules:
  - rule_id: validation_rule_1
    applies_to: "Reference product"
    rule: "Fail if net reference output is not 1,000 kg after normalization, if packaging is included, or if finished width is not strictly below 600 mm."
    source_ids:
      - unsd-cpc-3-0-structure-2025
  - rule_id: validation_rule_2
    applies_to: "Product boundary"
    rule: "Fail if alloy or stainless steel, hot-rolled-only, coated or clad product, width 600 mm or more, or a fabricated downstream article is represented as the reference product."
    source_ids:
      - unsd-cpc-3-0-structure-2025
  - rule_id: validation_rule_3
    applies_to: "Route applicability"
    rule: "Fail if a conditional operation or exchange is populated without route evidence, or marked not applicable despite records showing it occurred."
    source_ids:
      - ec-jrc-fmp-bref-2022
  - rule_id: validation_rule_4
    applies_to: "Inventory atomicity"
    rule: "Fail if any row combines multiple fuels, utilities, acids, gases, wastes or emission species, or if a UUID-empty row is absent from the manifest unresolved register."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "Energy and gas units"
    rule: "Fail if kWh-to-MJ conversion differs from 3.6, or if gas volumes with different reference conditions are aggregated without documented conversion."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "Steel mass balance"
    rule: "Fail if the steel mass-balance result is missing; flag any unexplained difference and require correction or disclosure before release."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "Allocation"
    rule: "Fail if shared utilities or inseparable exported scrap burdens lack the required allocation formula, denominator, records and sensitivity disclosure."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "Evidence and traceability"
    rule: "Fail if the reporting period, site scope, raw records, meter or scale quality evidence, source ids or provider datasets needed to reproduce a material result are missing."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate production data package for a declared non-alloy cold-rolled flat steel product below 600 mm in width"
  downstream_use: "Construction of TianGong flow, process and lifecyclemodel records and linked LCA studies using the declared product and route"
  allowed_use: "Product-specific or site-specific modelling when required qualifiers, provider datasets, allocation, period and geography are retained"
  excluded_use: "Alloy or stainless steel, width 600 mm or more, coated or fabricated products, generic market averages without representativeness review, or cradle-to-grave claims without added stages"
  required_metadata: "PCR id; CPC mapping context; steel grade; width; thickness; form; temper or annealing state; surface and oiling state; site; geography; period; process route; allocation; reference conditions; provider datasets; unresolved UUIDs"
  required_quality_disclosure: "Completeness and mass-balance results; meter and scale quality; temporal, geographical and technological representativeness; conditional-route evidence; treatment destinations; allocation sensitivity; unresolved flows and absent ranges"
  update_trigger: "Change in steel grade family, width class, mill route, pickling acid, annealing technology or fuel, finishing route, abatement, allocation, site, reporting period, provider dataset, or material data-quality finding"
