measurement_rules:
  - id: measurement_rule_1
    applies_to: "Reference product and steel-bearing product or waste flows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated net mass; exclude packaging and reconcile receiving, interstage, conforming output, scale loss and scrap over the same reporting period."
  - id: measurement_rule_2
    applies_to: "Finished product width"
    required_property_ref:
      name: "Length"
      uuid: ""
    required_unit: "mm"
    rule: "Measure finished width using the site's controlled dimensional method and confirm every represented product is below 600 mm; preserve the instrument, sampling plan and result."
  - id: measurement_rule_3
    applies_to: "Electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve source meter readings; convert kWh to MJ using 1 kWh = 3.6 MJ and disclose any allocation from a shared meter."
  - id: measurement_rule_4
    applies_to: "Gaseous fuels and atmosphere gases"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Preserve metered volume together with temperature, absolute pressure, moisture basis and any standard-state conversion."
  - id: measurement_rule_5
    applies_to: "Acid solutions and rolling fluids"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report solution or mixture mass and separately preserve concentration, active-content basis, recirculation and make-up definition; do not report active chemical mass as solution mass."
  - id: measurement_rule_6
    applies_to: "Reporting-period normalization"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg per 1,000 kg"
    rule: "Normalize each exchange from the same production period to 1,000 kg net conforming output after applying the allocation rules."
