system_boundary:
  rules:
    - rule_id: boundary_foreground_gate
      applies_to: "Foreground system"
      rule: "Include receipt and internal handling of powders and additives, dosing, mixing or milling, granulation when used, shaping, debinding, sintering, pressure-assisted densification when used, inspection, required finishing, internal material returns, waste handling, and on-site abatement through the plant gate."
      source_ids:
        - furberg-arvidsson-molander-2019
        - wang-bai-wang-men-2024
    - rule_id: boundary_upstream_links
      applies_to: "Purchased inputs and off-site services"
      rule: "Represent production of powders, binders, additives, energy carriers, utilities, and off-site recovery, recycling, or disposal with linked upstream datasets; do not omit them from the downstream lifecycle model."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_direct_releases
      applies_to: "Foreground emissions"
      rule: "Record measured or mass-balance-derived direct releases after abatement by substance and receiving compartment; retain gross generation, capture, recovery, and final release records where available."
