        - pressure
        - temperature
        - humidity
        - composition
      output: "m3 at declared reference conditions"
      source_ids: []
    - id: calc_material_balance
      applies_to: "Product, material, waste, and direct-release reconciliation"
      rule: "accepted external inputs + opening attributable inventory = product + external wastes + direct releases + closing attributable inventory; investigate imbalance outside stated measurement uncertainty"
      inputs:
        - "Dry material inputs"
        - "recovered loops"
        - product
        - wastes
        - releases
        - "inventory change"
      output: "Closed period material balance and unexplained difference"
      source_ids:
        - furberg-arvidsson-molander-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and every exchange"
      requirement: "Preserve one atomic flow identity, physical state, composition or purity, direction, flow type, and Tiangong UUID where confirmed; never use a material, fuel, utility, waste, or emission collection label as a flow."
