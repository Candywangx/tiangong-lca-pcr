      requirement: "Match composition, product state, technology, geography, period, and recycled-content convention; document every mismatch and proxy separately."
      evidence: "Dataset-selection log and data-quality assessment consistent with eu-pef-2021-2279"
validation_rules:
  - rule_id: validation_identity
    applies_to: "Reference product"
    rule: "Confirm the output is a microscopic ceramic-metal composite or sintered metal carbide with metallic binder, in the declared unmounted plant-gate state, and not a ceramic-only body, homogeneous alloy, mounted tool, fabricated tool insert, or machine."
    source_ids:
      - eu-cn-cermet-definition-2020
      - eu-cermet-sticks-classification-2021
  - rule_id: validation_reference_mass
    applies_to: "Reference flow"
    rule: "Require exactly 1 kg net dry conforming product after normalization and complete required qualifiers; fail if a narrower tool-part UUID or other proxy is used for the unresolved reference product."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_atomic_inventory
    applies_to: "Inventory"
    rule: "Require every exchange to be atomic and conditionally absent rows to be supported by route records; reject combined powders, fuels, utilities, wastes, or emissions."
    source_ids: []
  - rule_id: validation_balance
    applies_to: "Foreground period"
    rule: "Require material, energy, solvent, waste, and direct-emission reconciliation within documented measurement uncertainty; unexplained imbalance is a finding, not an allocated loss."
    source_ids:
      - furberg-arvidsson-molander-2019
  - rule_id: validation_uuid_semantics
    applies_to: "UUID-bearing rows"
    rule: "Recheck state 100, English and Chinese baseName, flow type, classification, property, unit group, product state, and generalComment; fail any semantic, compartment, or state mismatch."
    source_ids: []
  - rule_id: validation_boundary_and_allocation
    applies_to: "Dataset and downstream model"
    rule: "Confirm all controlled operations, shared auxiliaries, abatement, direct releases, and off-site links are represented and that subdivision or causal physical allocation precedes any economic allocation."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production dataset for one declared cermet formulation and plant-gate product state"
  downstream_use: "secondary_dataset; background_dataset after review and resolution of product and inventory identity gaps"
  allowed_use: "Product-specific cradle-to-gate or cradle-to-grave studies when composition, product state, technology, geography, period, recycled-content convention, allocation, and upstream links match the study"
  excluded_use: "Comparative assertions across unlike cermet systems or product states; mounted-tool or machinery modelling; use of unresolved UUIDs as if confirmed; omission of upstream powder production or off-site waste treatment"
  required_metadata: "PCR id and version; site and geography; reporting period; ceramic and metal phases; formulation and assays; recycled content; powder or article form; density or porosity; dimensions or particle size; shaping, sintering, pressure-assistance, and finishing route; coating and assembly state; allocation; cut-offs; data sources; unresolved identities"
  required_quality_disclosure: "Temporal and production coverage; meter and scale coverage; assay basis; material, solvent, and energy balance closure; emission monitoring; data-quality assessment; uncertainty; proxy mismatches; outsourced steps; range-evidence gaps"
  update_trigger: "Change in formulation, product form, recycled-content route, powder supplier technology, shaping or sintering technology, pressure assistance, finishing, energy supply, abatement, allocation basis, site, or representative production period"
