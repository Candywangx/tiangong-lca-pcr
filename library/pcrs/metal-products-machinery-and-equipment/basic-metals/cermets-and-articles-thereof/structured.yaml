  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = attributable period amount / net dry conforming product mass"
      inputs:
        - "Atomic input or output amount"
        - "net dry conforming product mass"
      output: "Amount per kg reference product"
      source_ids:
