allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared operations and internal loops"
    rule: "First subdivide processes or use direct meters and batch records so burdens follow the product that caused them; do not allocate internally recirculated powder or solvent as a co-product."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "Unavoidable shared production"
    rule: "If subdivision is not possible, allocate shared electricity, fuel, water, process gas, and abatement by a documented causal physical driver such as equipment time, metered load, treated gas volume, or processed mass."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_last_resort
    applies_to: "Multiple saleable outputs without a defensible physical relation"
    rule: "Use economic allocation only after documenting why subdivision and a causal physical relation are infeasible; disclose prices, currency, reference period, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recycling
    applies_to: "Cermet scrap and recovered powders"
    rule: "Report internal closed-loop returns as inventory reconciliation; for material crossing the site boundary, report its waste or product status, composition, destination, and the recycled-content and end-of-life convention used by the downstream study without double credit."
    source_ids:
      - eu-pef-2021-2279
      - furberg-arvidsson-molander-2019
