allocation_rules:
  - rule_id: allocation_subdivide_routes
    applies_to: "Route and product-family production"
    rule: "Subdivide hot-rolling, smithery, foundry and final-conditioning records using direct meters, batch records and mass tracking before applying allocation."
    source_ids: []
  - rule_id: allocation_internal_return
    applies_to: "Internal scrap, returns and reclaimed sand"
    rule: "Treat internal return as an internal loop and reconcile it once; do not report it simultaneously as exported waste and purchased input."
    source_ids:
      - ec-jrc-fmp-bref-2022
      - ec-jrc-sf-bref-2024
  - rule_id: allocation_exported_residue
    applies_to: "Exported scrap, scale, slag and spent sand"
    rule: "Carry manufacturing burdens to the measured transfer point. Do not credit avoided primary production inside this gate-to-gate dataset; any downstream substitution scenario must be separate and disclosed."
    source_ids:
      - onesteel-hot-rolled-structural-rail-epd-2026
  - rule_id: allocation_shared_process
    applies_to: "Unsubdivided shared equipment"
    rule: "If direct subdivision is impossible, allocate shared energy and ancillary use by a documented physical driver; use processed mass only when no more causal driver is available and disclose a sensitivity check."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_rolling_material_balance
      process_id: "hot_rolling"
      flow_role: "bloom, intermediate, mill scale and rolling scrap"
      record_type: "weighbridge, scale and production records"
      raw_fields: "heat_id; grade; input_mass_kg; accepted_mass_kg; internal_return_kg; scale_kg; exported_scrap_kg; stock_change_kg"
      collection_method: "Reconcile heat and campaign records"
      unit: "kg"
      frequency: "each heat or batch"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "all included rolling lines"
      aggregation_rule: "Sum route records and normalize with calc_reference_normalization"
      quality_evidence: "calibrated scales; heat traceability; signed reconciliation"
    - protocol_id: cp_rolling_energy
      process_id: "hot_rolling"
      flow_role: "natural gas and electricity"
      record_type: "utility meters and allocation logs"
      raw_fields: "meter_id; timestamp; gas_m3; gas_reference_conditions; electricity_kWh; line_status; product_mass_kg"
      collection_method: "Read dedicated meters or documented causal submeter allocation"
      unit: "m3; kWh"
      frequency: "hourly or shift"
      temporal_coverage: "same period as production"
      site_scope: "included furnaces and rolling line"
      aggregation_rule: "Sum productive consumption; document start-up and downtime treatment"
      quality_evidence: "meter calibration; invoice reconciliation; allocation log"
    - protocol_id: cp_rolling_water
      process_id: "hot_rolling"
      flow_role: "descaling-water supply"
      record_type: "water meters and circuit logs"
      raw_fields: "make_up_water_kg; recirculated_water_kg; blowdown_kg; reporting_period"
      collection_method: "Measure make-up separately from recirculation"
      unit: "kg"
      frequency: "shift or daily"
      temporal_coverage: "same period as production"
      site_scope: "declared descaling and cooling circuit"
      aggregation_rule: "Report net external water entering the boundary"
      quality_evidence: "meter checks; circuit balance"
    - protocol_id: cp_rolling_emissions
      process_id: "hot_rolling"
      flow_role: "fossil CO2 and nitrogen oxides"
      record_type: "stack monitoring and fuel records"
      raw_fields: "stack_id; pollutant; concentration; flow; operating_time; gas_m3; carbon_factor; oxidation_factor"
      collection_method: "Integrate validated monitoring or calculate from collected fuel fields"
      unit: "kg"
      frequency: "monitoring interval or batch"
      temporal_coverage: "same period as production"
      site_scope: "all included combustion sources"
      aggregation_rule: "Calculate with calc_direct_emissions and normalize"
      quality_evidence: "monitor QA/QC; fuel certificate; calculation audit"
    - protocol_id: cp_forging_material_balance
      process_id: "smithery_forming"
      flow_role: "billet, forged intermediate and forging scrap"
      record_type: "batch weights and production records"
      raw_fields: "batch_id; grade; billet_kg; accepted_intermediate_kg; internal_return_kg; exported_scrap_kg; stock_change_kg"
      collection_method: "Reconcile each forging batch"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "all included smithery equipment"
      aggregation_rule: "Sum declared-product batches and normalize"
      quality_evidence: "calibrated scales; batch traceability"
    - protocol_id: cp_forging_energy
      process_id: "smithery_forming"
      flow_role: "natural gas and electricity"
      record_type: "utility meters and batch logs"
      raw_fields: "meter_id; timestamp; gas_m3; reference_conditions; electricity_kWh; batch_id"
      collection_method: "Meter or causally allocate energy to forging batches"
      unit: "m3; kWh"
      frequency: "shift or batch"
      temporal_coverage: "same period as production"
      site_scope: "included furnaces, presses and auxiliaries"
      aggregation_rule: "Sum productive consumption and normalize"
      quality_evidence: "calibration; invoice reconciliation"
    - protocol_id: cp_forging_emissions
      process_id: "smithery_forming"
      flow_role: "fossil CO2"
      record_type: "stack and fuel records"
      raw_fields: "stack_id; concentration; flow; operating_time; gas_m3; carbon_factor; oxidation_factor"
      collection_method: "Measure or calculate from collected fuel fields"
      unit: "kg"
      frequency: "monitoring interval or batch"
      temporal_coverage: "same period as production"
      site_scope: "included combustion sources"
      aggregation_rule: "Calculate with calc_direct_emissions and normalize"
      quality_evidence: "monitoring QA/QC; fuel certificate"
    - protocol_id: cp_foundry_charge_balance
      process_id: "foundry_casting"
      flow_role: "purchased charge, cast intermediate and slag"
      record_type: "heat sheets and scale records"
      raw_fields: "heat_id; scrap_charge_kg; pig_iron_kg; internal_return_kg; accepted_casting_kg; slag_kg; stock_change_kg"
      collection_method: "Reconcile each foundry heat"
      unit: "kg"
      frequency: "each heat"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "all included melting units"
      aggregation_rule: "Sum declared-product heats and normalize"
      quality_evidence: "certified scales; heat chemistry; reconciliation"
    - protocol_id: cp_foundry_energy
      process_id: "foundry_casting"
      flow_role: "electricity"
      record_type: "electricity meters and heat logs"
      raw_fields: "meter_id; timestamp; electricity_kWh; heat_id; accepted_casting_kg"
      collection_method: "Meter or causally allocate electricity by heat"
      unit: "kWh"
      frequency: "each heat or shift"
      temporal_coverage: "same period as production"
      site_scope: "included melting, moulding and handling equipment"
      aggregation_rule: "Sum productive consumption and convert with calc_electricity_conversion"
      quality_evidence: "calibration; invoice reconciliation"
    - protocol_id: cp_foundry_sand_balance
      process_id: "foundry_casting"
      flow_role: "fresh and spent moulding sand"
      record_type: "batch and reclamation records"
      raw_fields: "batch_id; fresh_sand_kg; reclaimed_sand_kg; spent_sand_exported_kg; binder_system"
      collection_method: "Reconcile fresh addition, internal reclamation and transfer"
      unit: "kg"
      frequency: "batch or shift"
      temporal_coverage: "same period as production"
      site_scope: "included moulding and reclamation system"
      aggregation_rule: "Report fresh external input and spent external output separately"
      quality_evidence: "scale checks; transfer receipts"
    - protocol_id: cp_finishing_material_balance
      process_id: "final_conditioning"
      flow_role: "route intermediate, finished product and finishing scrap"
      record_type: "production and inspection records"
      raw_fields: "batch_id; route; input_kg; accepted_product_kg; internal_return_kg; exported_scrap_kg; stock_change_kg; rejection_reason"
      collection_method: "Reconcile input through acceptance inspection"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "all included final operations"
      aggregation_rule: "Sum accepted declared-product batches and normalize"
      quality_evidence: "traceability; calibrated scales; inspection release"
    - protocol_id: cp_finishing_energy
      process_id: "final_conditioning"
      flow_role: "electricity"
      record_type: "meters and operation logs"
      raw_fields: "meter_id; timestamp; electricity_kWh; operation; batch_id; accepted_product_kg"
      collection_method: "Meter or causally allocate to performed final operations"
      unit: "kWh"
      frequency: "shift or batch"
      temporal_coverage: "same period as production"
      site_scope: "included heat treatment, machining and inspection"
      aggregation_rule: "Sum productive consumption and convert"
      quality_evidence: "calibration; invoice reconciliation; operation log"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory amount"
      rule: "normalized amount = reporting-period exchange / reporting-period net accepted product × 1,000"
      inputs:
        - "exchange amount"
        - "net accepted product mass"
      output: "exchange per 1,000 kg reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "Electricity recorded in kWh"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - electricity_kWh
      output: "electricity_MJ"
      source_ids: []
    - id: calc_direct_emissions
      applies_to: "Direct fossil CO2 and monitored nitrogen oxides"
      rule: "Integrate concentration × corrected gas flow × operating time, or for fossil CO2 use metered fuel × documented carbon content × oxidation factor; retain the selected method and inputs"
      inputs:
        - "monitoring fields or fuel fields"
      output: "pollutant mass by source and period"
      source_ids:
        - ec-jrc-fmp-bref-2022
        - ec-jrc-sf-bref-2024
    - id: calc_route_mass_balance
      applies_to: "Each declared route"
      rule: "input mass + opening stock = accepted output + internal return + exported residues + closing stock + documented loss; investigate unresolved imbalance"
      inputs:
        - "batch and stock fields"
      output: "reconciled route mass balance"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Retain product family, designation, grade, specification, geometry, route, treatment state and acceptance release linked to each batch."
      evidence: "product specification; heat certificate; inspection release"
    - id: dq_temporal
      applies_to: "Foreground data"
      requirement: "Use a representative 12-month period or justify a shorter campaign and disclose start-up, shutdown and abnormal-operation treatment."
      evidence: "meter coverage report; production calendar; justification"
    - id: dq_completeness
      applies_to: "All declared processes"
      requirement: "Reconcile production, utility, residue and emissions records to the same products, lines, sites and period; quantify missing-record coverage."
      evidence: "completeness matrix; mass and energy reconciliation"
    - id: dq_metering
      applies_to: "Measured exchanges"
      requirement: "Use calibrated meters or scales and document every shared-meter allocation driver."
      evidence: "calibration certificates; allocation workbook; invoices"
    - id: dq_upstream
      applies_to: "Purchased inputs"
      requirement: "Match upstream datasets to material grade/state, supplier or representative technology, geography, electricity delivery qualifiers, and gas reference conditions."
      evidence: "supplier declarations; dataset selection log"
    - id: dq_uncertainty
      applies_to: "Important flows without source-backed ranges"
      requirement: "Retain foreground variability and measurement uncertainty; do not treat this PCR's missing external ranges as zero uncertainty."
      evidence: "batch statistics; meter uncertainty; unresolved-range review record"
validation_rules:
  - rule_id: validation_identity
    applies_to: "Reference flow"
    rule: "Fail validation when the product family, grade/specification, geometry, manufacturing route, treatment state, plant geography, reporting period, or net-mass rule is missing."
    source_ids:
      - unstats-cpc-v3-41253
      - unstats-hs-7302-scope
  - rule_id: validation_route
    applies_to: "Process map"
    rule: "Require final conditioning and at least one applicable forming route; reject inventories that average hot rolling, smithery and foundry routes without declared production shares and evidence."
    source_ids:
      - ec-jrc-fmp-bref-2022
      - ec-jrc-sf-bref-2024
  - rule_id: validation_atomic_flows
    applies_to: "Inventory rows"
    rule: "Require one atomic exchange per row and separate electricity, natural gas, water, each residue and each elementary emission."
    source_ids: []
  - rule_id: validation_mass_balance
    applies_to: "Route inventories"
    rule: "Require the route mass-balance calculation, documented internal returns and explicit destinations for exported scrap, scale, slag and spent sand."
    source_ids: []
  - rule_id: validation_energy_qualifiers
    applies_to: "Electricity and natural gas"
    rule: "Require electricity supplier, geography, voltage, technology and delivery boundary, plus natural-gas supply geography and reference-volume conditions wherever those flows occur."
    source_ids: []
  - rule_id: validation_uuid_status
    applies_to: "Tiangong references"
    rule: "Accept a UUID only after direct public read confirms state 100, semantic identity, flow type, classification, property and unit group; keep all other rows explicitly unresolved."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for one declared track-construction-material product family, route, plant and reporting period"
  downstream_use: "secondary_dataset; background_dataset when geography, technology, grade, product state and quality disclosures match the downstream model"
  allowed_use: "Gate-to-gate manufacture; combination with separately modelled upstream steel and downstream railway life-cycle stages; product-specific comparison only after equivalence review"
  excluded_use: "Railway construction service, assembled track, use-stage performance, service-life prediction, maintenance, or end-of-life without added downstream modules; route or grade comparison when required qualifiers differ"
  required_metadata: "canonical PCR id; classification context; product family/designation; grade/specification; dimensions; route and process shares; treatment and delivery state; site/geography; reporting period; reference mass; upstream dataset identities; electricity and gas qualifiers; residue destinations; packaging boundary"
  required_quality_disclosure: "primary-data coverage; meter and scale QA; allocation drivers; route mass-balance closure; missing records; direct-emission method; internal-return treatment; uncertainty; unresolved UUIDs and range evidence needs"
  update_trigger: "Change in product family or grade, forming route, furnace or foundry technology, heat treatment, electricity supply, fuel, supplier material, site boundary, allocation method, residue destination, or data older than the declared representativeness period"
