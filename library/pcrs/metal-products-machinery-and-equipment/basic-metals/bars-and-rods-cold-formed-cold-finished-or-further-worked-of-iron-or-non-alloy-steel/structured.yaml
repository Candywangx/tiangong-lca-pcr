allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared foreground equipment and meters"
    rule: "Avoid allocation by subdividing production campaigns, equipment time, material issues, and dedicated meters by declared product grade, geometry, and route."
    source_ids: []
  - rule_id: allocation_internal_recycle
    applies_to: "internal return of bars, offcuts, scale, acid, water, or lubricant"
    rule: "Do not count an internal recycle loop as both an external output and a new external input. Record only net boundary crossings and disclose the loop and inventory point."
    source_ids: []
  - rule_id: allocation_recoverable_material
    applies_to: "offcuts, scale, spent acid, lubricant, and captured dust sent for recovery"
    rule: "Report the measured outgoing flow and treatment or recovery destination. Do not apply an avoided-burden credit inside this foreground dataset; downstream recycling modelling belongs to the linked treatment or lifecycle model."
    source_ids: []
  - rule_id: allocation_unavoidable_shared_burden
    applies_to: "residual shared burdens after subdivision"
    rule: "If direct measurement and subdivision are infeasible, allocate the residual shared burden by net accepted product mass for the same campaign, disclose the affected exchanges and fraction, and test sensitivity when the allocation changes a reported result materially."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "No co-product is assumed by default. A saleable secondary output must be represented as its own concrete product flow and reviewed before the residual-allocation rule is used; it must not be hidden in an offcut or waste row."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_surface_materials
      process_id: "surface_preparation"
      flow_role: "feed, HCl solution, and rinse water"
      record_type: "weigh tickets, tank issues, purchase/transfer records, and water meter"
      raw_fields: "lot_id; steel_grade; feed_mass_kg; acid_solution_mass_kg; acid_concentration; recovered_acid_mass_kg; rinse_makeup_water_kg"
      collection_method: "calibrated scales, tank mass balance, and dedicated water meter"
      unit: "kg"
      frequency: "each batch with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or complete declared campaign"
      site_scope: "all in-scope surface-preparation lines"
      aggregation_rule: "sum net external inputs and normalize by accepted reference-product mass"
      quality_evidence: "calibration records, acid inventory reconciliation, concentration analyses, and meter completeness"
    - protocol_id: cp_surface_energy
      process_id: "surface_preparation"
      flow_role: "alternating-current input"
      record_type: "electricity meter and equipment runtime records"
      raw_fields: "meter_start; meter_end; kWh; equipment_id; production_lot"
      collection_method: "dedicated submeter preferred; otherwise documented power-by-runtime calculation reconciled to site meter"
      unit: "kWh and MJ"
      frequency: "each batch or shift with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "all in-scope pickling, extraction, pumping, and rinsing equipment"
      aggregation_rule: "subtract documented non-process loads, convert kWh to MJ, and normalize by accepted product"
      quality_evidence: "meter calibration, load boundary diagram, runtime logs, and reconciliation"
    - protocol_id: cp_surface_outputs
      process_id: "surface_preparation"
      flow_role: "pretreated transfer and specific waste streams"
      record_type: "transfer scale, waste manifests, tank drawdown, and solids records"
      raw_fields: "transfer_mass_kg; spent_liquor_mass_kg; acid_content; dissolved_iron; rinse_waste_mass_kg; scale_mass_kg; wet_dry_basis; destination"
      collection_method: "calibrated scales, tank mass balance, and shipment records"
      unit: "kg"
      frequency: "each batch or removal event"
      temporal_coverage: "same period as product output"
      site_scope: "complete surface-preparation system through waste handoff"
      aggregation_rule: "sum by atomic flow and destination; subtract internal recirculation"
      quality_evidence: "mass-balance closure, laboratory analyses, moisture records, and manifests"
    - protocol_id: cp_surface_emissions
      process_id: "surface_preparation"
      flow_role: "hydrogen chloride to air"
      record_type: "stack tests, continuous or periodic monitoring, and fugitive assessment"
      raw_fields: "HCl_concentration; gas_flow; run_time; capture_status; abatement_status; method"
      collection_method: "approved stack method plus documented fugitive quantification"
      unit: "kg HCl"
      frequency: "monitoring frequency required by permit, with batch operating hours"
      temporal_coverage: "same period as product output"
      site_scope: "all HCl emission points inside the process boundary"
      aggregation_rule: "concentration × corrected gas flow × operating time plus quantified fugitive mass"
      quality_evidence: "test report, detection limits, gas corrections, and control-device operating records"
    - protocol_id: cp_cold_inputs
      process_id: "cold_finishing"
      flow_role: "steel feed, electricity, and lubricant oil"
      record_type: "transfer scale, electricity meter, lubricant issues, and equipment runtime"
      raw_fields: "lot_id; feed_mass_kg; kWh; equipment_id; lubricant_product; lubricant_mass_kg; recovered_lubricant_mass_kg"
      collection_method: "calibrated scales, dedicated submeters, and material issue records"
      unit: "kg; kWh; MJ"
      frequency: "each batch or shift"
      temporal_coverage: "representative continuous 12-month period or complete declared campaign"
      site_scope: "all in-scope cold-finishing equipment"
      aggregation_rule: "sum net boundary inputs by product lot and normalize by accepted product"
      quality_evidence: "calibration, route logs, inventory reconciliation, and meter completeness"
    - protocol_id: cp_cold_outputs
      process_id: "cold_finishing"
      flow_role: "cold-finished transfer and specific solid or liquid wastes"
      record_type: "transfer scale, scrap bins, lubricant-removal records, and dust collector records"
      raw_fields: "transfer_mass_kg; offcut_mass_kg; spent_oil_mass_kg; dust_mass_kg; wet_dry_basis; internal_return_mass_kg; destination"
      collection_method: "calibrated scales and container-specific removal records"
      unit: "kg"
      frequency: "each batch or removal event"
      temporal_coverage: "same period as product output"
      site_scope: "all cold-finishing lines and collectors"
      aggregation_rule: "sum each atomic output; subtract documented internal returns; normalize by accepted product"
      quality_evidence: "mass-balance closure, manifests, moisture records, and collector maintenance logs"
    - protocol_id: cp_annealing_inputs
      process_id: "intermediate_annealing"
      flow_role: "bar transfer, natural gas, electricity, and nitrogen"
      record_type: "transfer scale, corrected gas meters, electricity meter, and furnace batch log"
      raw_fields: "lot_id; transfer_mass_kg; gas_m3; gas_reference_conditions; kWh; nitrogen_m3; atmosphere_recirculation; furnace_cycle"
      collection_method: "calibrated scales and dedicated corrected meters"
      unit: "kg; m3; kWh; MJ"
      frequency: "each furnace batch with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or complete declared campaign"
      site_scope: "all in-scope annealing furnaces"
      aggregation_rule: "sum net make-up inputs and normalize by accepted product"
      quality_evidence: "calibration, reference-condition record, fuel invoice reconciliation, and batch traceability"
    - protocol_id: cp_annealing_outputs
      process_id: "intermediate_annealing"
      flow_role: "annealed transfer and direct combustion emissions"
      record_type: "transfer scale, fuel-carbon calculation records, and stack monitoring"
      raw_fields: "annealed_mass_kg; fossil_CO2_kg; NOx_concentration; NOx_reporting_species; gas_flow; oxygen_reference; run_time; abatement_status"
      collection_method: "calibrated scale, verified fuel-carbon calculation or stack measurement, and approved NOx stack method"
      unit: "kg"
      frequency: "each batch for transfer and required monitoring interval for emissions"
      temporal_coverage: "same period as product output"
      site_scope: "furnace and all associated in-scope stacks"
      aggregation_rule: "sum accepted transfer and direct emissions; normalize by accepted reference-product mass"
      quality_evidence: "mass balance, calculation workbook, fuel analysis, stack report, detection limits, and control records"
    - protocol_id: cp_final_operations
      process_id: "final_sizing_inspection"
      flow_role: "alternative internal feed, accepted product, and final offcuts"
      record_type: "transfer and final scales, inspection record, scrap bins, and rework log"
      raw_fields: "lot_id; feed_route; input_mass_kg; accepted_mass_kg; offcut_mass_kg; rejected_mass_kg; rework_mass_kg; grade; dimensions; tolerance; surface_class; heat_treatment_state"
      collection_method: "calibrated scales linked to lot-level inspection and disposition records"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "representative continuous 12-month period or complete declared campaign"
      site_scope: "all final sizing and inspection stations"
      aggregation_rule: "count one alternative feed route; sum net accepted output and net external offcuts; normalize to 1,000 kg accepted product"
      quality_evidence: "calibration, certificate of analysis, dimensional and mechanical test results, rejection/rework traceability, and mass-balance closure"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every external inventory exchange"
      rule: "normalized amount = period exchange amount / period net accepted product mass × 1,000 kg"
      inputs:
        - "atomic exchange record"
        - "accepted product mass"
      output: "exchange per 1,000 kg accepted product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "electricity rows"
      rule: "MJ = metered kWh × 3.6; retain the original kWh value and meter boundary"
      inputs:
        - kWh
        - "meter boundary"
      output: "MJ alternating current"
      source_ids: []
    - id: calc_net_external_material
      applies_to: "acid, water, lubricant, nitrogen, wastes, and internal recycle"
      rule: "net boundary amount = gross addition or removal − documented same-process internal return; never subtract an off-site return as an internal loop"
      inputs:
        - "gross records"
        - "internal return records"
        - destination
      output: "net external atomic flow"
      source_ids: []
    - id: calc_stack_mass
      applies_to: "HCl and NOx emissions"
      rule: "emitted mass = corrected concentration × corrected dry-gas flow × operating time, using consistent units and declared oxygen/reference conditions; add separately quantified fugitive mass only for the same species"
      inputs:
        - concentration
        - "gas flow"
        - time
        - "correction factors"
        - "fugitive assessment"
      output: "kg emitted species"
      source_ids:
        - eu-jrc-fmp-bref-2022
    - id: calc_mass_balance_check
      applies_to: "steel-bearing flows"
      rule: "closure = feed steel mass − accepted product − net steel-bearing waste − inventory change; investigate rather than force any unexplained residual into a waste row"
      inputs:
        - feed
        - transfers
        - product
        - "steel-bearing wastes"
        - "inventory change"
      output: "mass-balance residual and closure percentage"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and steel-bearing inputs"
      requirement: "Maintain lot-level linkage among grade certificate, feed state, route, cross-section, dimensions, tolerances, surface class, heat-treatment state, coating status, and accepted mass."
      evidence: "certificates, route traveller, inspection record, and lot reconciliation"
    - id: dq_temporal_representativeness
      applies_to: "all foreground records"
      requirement: "Use a continuous representative 12-month period where available; otherwise disclose the complete campaign period, seasonal or utilization limitation, and why it represents the declared product."
      evidence: "dated meter extracts, production calendar, and campaign statement"
    - id: dq_completeness
      applies_to: "process map and inventory"
      requirement: "Reconcile every required process and every applicable conditional process. Report zero only with evidence of non-applicability; do not omit an applicable atomic exchange because its UUID or range is unresolved."
      evidence: "process applicability matrix, mass/energy reconciliation, and unresolved-flow register"
    - id: dq_meter_quality
      applies_to: "mass, electricity, gas, water, and emission measurements"
      requirement: "Retain calibration status, resolution, coverage, estimated-data fraction, and correction method. Estimated segments must be identified and sensitivity-tested if material."
      evidence: "calibration certificates, meter QA records, and estimation log"
    - id: dq_waste_and_emissions
      applies_to: "wastes and direct releases"
      requirement: "Preserve atomic identity, wet/dry basis, concentration where relevant, destination, compartment, reporting species, detection limit, and abatement boundary."
      evidence: "manifests, analyses, stack reports, and treatment contracts"
    - id: dq_source_boundary
      applies_to: "upstream and off-site datasets"
      requirement: "Verify that linked datasets do not duplicate foreground operations and disclose geography, technology, temporal period, and product state mismatches."
      evidence: "dataset mapping and boundary crosswalk"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Fail validation when the final product is not 1,000 kg net accepted iron or non-alloy-steel bar or rod or when any required qualifier is absent."
    source_ids:
      - unstats-cpc-3-0-structure-2025
      - prc-mof-tariff-terminology-2026
  - rule_id: validate_process_coverage
    applies_to: "process map"
    rule: "Require cold_finishing and final_sizing_inspection; require an explicit applicability decision for surface_preparation and intermediate_annealing, supported by route records."
    source_ids:
      - eu-jrc-fmp-bref-2022
  - rule_id: validate_atomic_inventory
    applies_to: "inventory rows"
    rule: "Reject combined utilities, combined fuels, combined chemicals, generic wastewater, generic residues, generic emissions, and any row that cannot represent one atomic exchange."
    source_ids: []
  - rule_id: validate_uuid_status
    applies_to: "reference and inventory flows"
    rule: "A UUID-bearing row must match the directly read Tiangong base name, flow type, classification, property, and unit group; every UUID-empty row must remain in the manifest unresolved inventory list."
    source_ids: []
  - rule_id: validate_electricity_identity
    applies_to: "all electricity rows"
    rule: "Use the adopted alternating-current UUID only with supplier, geography, voltage, technology, and delivery-boundary qualifiers; do not substitute an unverified voltage-specific consumption mix."
    source_ids: []
  - rule_id: validate_material_balance
    applies_to: "steel-bearing system"
    rule: "Investigate a non-zero steel mass-balance residual. Do not force unexplained loss into scale, dust, offcuts, or emissions."
    source_ids: []
  - rule_id: validate_alternative_transfer
    applies_to: "final-sizing inputs"
    rule: "For one product lot, record either cold_finished_bar_to_final or annealed_bar_to_final, never both."
    source_ids:
      - eu-jrc-fmp-bref-2022
  - rule_id: validate_range_evidence
    applies_to: "amount ranges"
    rule: "Do not publish an externally inferred range unless at least two independent original sources have compatible system boundary, functional unit, and product state; unresolved needs remain foreground collection requirements."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground product-conversion dataset for cold-formed, cold-finished, or further-worked iron or non-alloy-steel bars and rods"
  downstream_use: "secondary_dataset; background_dataset after review of representativeness and upstream links"
  allowed_use: "Product carbon-footprint, LCA, supply-chain, and process-improvement studies requiring a declared plant-gate bar-or-rod conversion dataset within the stated product, geography, technology, and time coverage"
  excluded_use: "Steelmaking or hot-rolling average; wire, alloy-steel, section, tube, coated-product, use-stage, or end-of-life proxy; generic global dataset without documented representativeness review"
  required_metadata: "PCR id and version state; CPC reference; steel grade and certificate basis; bar/rod designation; geometry and tolerances; cold-finishing route; area or diameter reduction where applicable; surface class; annealing state; coating and residual-oil state; site geography; reference period; capacity utilization; feed and upstream dataset identities; route applicability; allocation; internal recycling; waste destinations; emission controls; data-quality and unresolved-identity disclosure"
  required_quality_disclosure: "Foreground-record coverage; measured versus estimated fraction; meter and scale calibration; mass-balance closure; conditional-route decisions; missing exact Tiangong UUIDs; absent independent range evidence; upstream geography/technology/time mismatches; uncertainty and sensitivity results"
  update_trigger: "Change in steel grade family, feed state, cold-forming or finishing technology, reduction or geometry, annealing furnace or atmosphere, energy supply, acid recovery or water recirculation, emission control, waste destination, allocation, site, or representative period; or resolution of a material UUID or range-evidence gap"
