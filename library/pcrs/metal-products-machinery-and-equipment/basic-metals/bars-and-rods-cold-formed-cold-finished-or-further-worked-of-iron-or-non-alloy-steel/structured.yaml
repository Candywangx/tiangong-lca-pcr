measurement_rules:
  - id: reference_mass
    applies_to: "accepted reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use verified net mass after final inspection. Exclude pallets, straps, wrapping, dunnage, and unaccepted material. Normalize all exchanges to 1,000 kg accepted product."
  - id: internal_transfer_mass
    applies_to: "bar-or-rod intermediates"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure or mass-balance each internal transfer without counting the same intermediate as an external input or output. Preserve steel grade and physical-state continuity."
  - id: electricity_energy
    applies_to: "alternating-current inputs"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the metered electricity quantity and conversion basis. When source records use kWh, convert by the physical identity 1 kWh = 3.6 MJ and retain both the meter value and converted value."
  - id: gas_volume_conditions
    applies_to: "natural gas and protective nitrogen"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Report the reference temperature, reference pressure, dry/wet basis, and meter correction used for every gas volume; do not combine gases."
  - id: waste_wet_dry_basis
    applies_to: "spent liquor, rinse-water waste, scale, offcuts, lubricant waste, and captured dust"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "State wet or dry basis and measured moisture or entrained-liquid treatment where relevant; do not infer dry mass without a recorded conversion."
