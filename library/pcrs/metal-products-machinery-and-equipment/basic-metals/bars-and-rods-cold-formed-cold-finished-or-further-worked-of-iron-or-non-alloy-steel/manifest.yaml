review_metadata:
  goal_policy_fingerprint: sha256:ca4d48461138cec48aa51cf1438775f652663ac663b161c0203fabc5dc779d27
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  semantic_boundary:
    decision: create_distinct_material_pcr
    rationale: "The category is the plant-gate conversion of hot-rolled iron or non-alloy steel bars or rods into cold-drawn, ground, peeled, straightened, polished, or otherwise further-worked bars or rods. It excludes upstream steelmaking and hot rolling and is not covered by the separate categories for wire, alloy-steel bars, sections, tubes, or products only hot-worked."
    evidence_source_ids:
      - unstats-cpc-3-0-structure-2025
      - eu-jrc-fmp-bref-2022
  unresolved_flow_identities:
    - row_id: finished_bar_product
      reason: No exact Tiangong reference-product flow was directly verified; the complete UUID-empty inventory register remains under review_metadata.unresolved.inventory_flow_uuids.
  unresolved:
    inventory_flow_uuids:
      - row_id: hot_rolled_bar_input
        reason_code: no_exact_candidate
        explanation: Directly read candidates were rebar-specific, cold-drawn, high-wire-rod, or insufficiently explicit about hot-rolled state; none exactly matched the declared iron or non-alloy-steel bar-or-rod feed.
      - row_id: hydrochloric_acid_input
        reason_code: no_exact_candidate
        explanation: Directly read candidates fixed 0.2 N, 30%, or 36% concentration or did not establish the delivered solution state; none exactly matched the foreground concentration and solution-mass basis.
      - row_id: pretreated_bar_intermediate
        reason_code: internal_intermediate_needs_new_flow
        explanation: This site-specific descaled bar or rod is an internal intermediate whose identity depends on the declared feed and surface-preparation route.
      - row_id: spent_pickling_liquor
        reason_code: no_exact_candidate
        explanation: No directly read public Tiangong waste flow was verified for spent hydrochloric-acid pickling liquor containing dissolved iron at the site composition.
      - row_id: acidic_rinse_water
        reason_code: no_exact_candidate
        explanation: No directly read public Tiangong waste flow was verified for acidic rinse water containing iron chlorides at the site composition.
      - row_id: iron_oxide_scale_waste
        reason_code: no_exact_candidate
        explanation: No directly read public Tiangong waste flow was verified for captured iron-oxide scale from the declared surface-preparation equipment.
      - row_id: steel_bar_feed
        reason_code: no_exact_candidate
        explanation: No directly read public Tiangong product flow was verified for the hot-rolled or descaled non-alloy-steel bar-or-rod feed entering cold finishing.
      - row_id: metalworking_lubricant_input
        reason_code: no_exact_candidate
        explanation: No directly read public Tiangong product flow was verified for the actual single metalworking lubricant oil used by the declared cold-finishing route.
      - row_id: cold_finished_bar_intermediate
        reason_code: internal_intermediate_needs_new_flow
        explanation: This site-specific cold-finished bar or rod is an internal intermediate before optional annealing and final inspection.
      - row_id: steel_offcuts_cold_finishing
        reason_code: no_exact_candidate
        explanation: No directly read public Tiangong waste flow was verified for clean iron or non-alloy-steel offcuts from cold finishing.
      - row_id: spent_lubricant_oil
        reason_code: no_exact_candidate
        explanation: No directly read public Tiangong waste flow was verified for spent metalworking lubricant oil with the site contaminant profile.
      - row_id: captured_grinding_dust
        reason_code: no_exact_candidate
        explanation: No directly read public Tiangong waste flow was verified for captured iron or non-alloy-steel grinding dust from the declared finishing route.
      - row_id: cold_finished_bar_to_annealing
        reason_code: internal_intermediate_needs_new_flow
        explanation: This transfer is the same site-specific cold-finished internal intermediate entering conditional annealing.
      - row_id: protective_nitrogen
        reason_code: no_exact_candidate
        explanation: Industrial oxygen and other fuel-gas candidates are the wrong substances; the directly read nitrogen candidate uses Mass/kg rather than the required Volume/m3 basis, and the liquid-nitrogen candidates have the wrong product state.
      - row_id: annealed_bar_intermediate
        reason_code: internal_intermediate_needs_new_flow
        explanation: This site-specific annealed bar or rod is an internal intermediate before final sizing and inspection.
      - row_id: nitrogen_oxides_air
        reason_code: no_exact_candidate
        explanation: The directly read candidates denote nitrous oxide rather than combustion nitrogen oxides reported as NOx (normally as NO2), so no exact elementary flow was verified.
      - row_id: cold_finished_bar_to_final
        reason_code: internal_intermediate_needs_new_flow
        explanation: This transfer is the site-specific unannealed cold-finished internal intermediate entering final sizing and inspection.
      - row_id: annealed_bar_to_final
        reason_code: internal_intermediate_needs_new_flow
        explanation: This transfer is the site-specific annealed internal intermediate entering final sizing and inspection.
      - row_id: finished_bar_product
        reason_code: no_exact_candidate
        explanation: Directly read candidates were alloy steel, the wrong product form, or lacked an unambiguous cold-formed, cold-finished, or further-worked state; no exact reference-product flow was verified.
      - row_id: final_steel_offcuts
        reason_code: no_exact_candidate
        explanation: No directly read public Tiangong waste flow was verified for clean iron or non-alloy-steel offcuts from final sizing.
