    reference: "NBN EN 546-1:2007, Aluminium and aluminium alloys - Foil - Part 1: Technical conditions for inspection and delivery. [Official NBN record](https://app.nbn.be/data/r/platform/frontend/detail?lang=en&p40_id=174383&p40_language_code=en), accessed 2026-08-09."
    used_for: "Plain wrought-foil inspection and delivery qualifiers; used as a narrower plain-foil reference, not as the category outer boundary."
  - id: "astm-b926-2025"
