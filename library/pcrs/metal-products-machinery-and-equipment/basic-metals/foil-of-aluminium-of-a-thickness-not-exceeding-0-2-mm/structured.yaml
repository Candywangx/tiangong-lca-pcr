measurement_rules:
  - id: reference_mass
    applies_to: "delivered foil product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all inventory results to 1 kg net sold foil product; exclude core and removable transport packaging from reference mass and report them as separate inputs."
  - id: aluminium_layer_thickness
    applies_to: "classification and product qualifier"
    required_property_ref:
      name: "Length"
      uuid: ""
    required_unit: "mm or µm"
    rule: "Measure and report aluminium-layer thickness separately from coating or backing. Convert µm to mm using 1 µm = 0.001 mm. The declared aluminium-layer thickness shall be greater than zero and not exceed 0.2 mm."
  - id: constituent_mass_fraction
    applies_to: "coated, laminated, printed, lacquered, or backed foil"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "kg/kg product"
    rule: "Report aluminium, each coating or treatment solid, adhesive, ink, lacquer, laminate, and backing on a dry constituent-mass basis; fractions shall sum to 1 within stated rounding."
  - id: metal_input_share
    applies_to: "fresh aluminium-bearing charge entering the model boundary"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "kg Al/kg fresh Al input"
    rule: "Report primary aluminium, external pre-consumer recycled aluminium, and external post-consumer recycled aluminium on a contained-aluminium basis. Internal process scrap is a loop, not recycled-content input, and shall not be added to these shares."
  - id: yield_measurement
    applies_to: "aluminium conversion route"
    required_property_ref:
      name: "Mass ratio"
      uuid: ""
    required_unit: "kg/kg"
    rule: "Calculate metal yield as net saleable aluminium mass in the reference product divided by fresh aluminium mass entering the declared boundary; exclude coating and backing mass from both aluminium terms and disclose stock-change treatment."
  - id: energy_measurement
    applies_to: "each foreground process"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh for electricity; MJ for fuels, steam, and thermal energy"
    rule: "Record metered energy by carrier and process where available; do not combine electricity and thermal energy without an explicit conversion and lower/higher heating value convention."
  - id: water_measurement
    applies_to: "each foreground process"
    required_property_ref:
      name: "Volume or Mass"
      uuid: ""
    required_unit: "m3 or kg"
    rule: "Distinguish withdrawal, consumed water, recirculated water, and discharged wastewater; do not count recirculated water repeatedly as fresh withdrawal."
  - id: coil_and_packaging_mass
    applies_to: "dispatch"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record net foil mass, core mass, and each removable packaging material separately for every dispatched coil or production-weighted batch."
process_map:
  - id: foil_stock_production
    name: "Foil-stock production"
    inclusion: "conditional"
    inclusion_condition: "Include when the reporting site produces foil stock from ingot, slab, molten metal, or recycled charge."
    role: "Produces hot-rolled or continuous-cast strip suitable for final foil rolling."
    quantitative_reference: "1 kg foil stock output"
  - id: foil_rolling
    name: "Cold rolling of foil"
    inclusion: "required"
    inclusion_condition: "Always include final-gauge rolling controlled by the reporting producer."
    role: "Reduces foil stock to declared gauge and records rolling media, energy, losses, and scrap."
    quantitative_reference: "1 kg rolled foil output"
  - id: annealing
    name: "Annealing"
    inclusion: "conditional"
    inclusion_condition: "Include every intermediate or final anneal used to achieve the declared temper or surface condition."
    role: "Changes temper and removes or transforms rolling residues under a declared thermal schedule."
    quantitative_reference: "1 kg annealed foil output"
  - id: double_rolling_and_separation
    name: "Double rolling and foil separation"
    inclusion: "conditional"
    inclusion_condition: "Include when two layers are rolled together and subsequently separated."
    role: "Represents the thin-foil route and its side-specific surface effects."
    quantitative_reference: "1 kg separated foil output"
  - id: slitting_finishing_and_winding
    name: "Slitting, finishing, and winding"
    inclusion: "required"
    inclusion_condition: "Include final slitting, edge trimming, inspection, and winding."
    role: "Produces saleable-width coils and records trim and rejected material."
    quantitative_reference: "1 kg saleable foil before optional conversion and packaging"
  - id: surface_treatment_coating_or_backing
    name: "Surface treatment, coating, printing, lacquering, lamination, or backing"
    inclusion: "conditional"
    inclusion_condition: "Include each operation controlled by the producer that remains embodied in or changes the sold product."
    role: "Adds or modifies declared surface constituents and properties."
    quantitative_reference: "1 kg converted foil output"
  - id: internal_scrap_recovery
    name: "Internal scrap recovery"
    inclusion: "conditional"
    inclusion_condition: "Include onsite collection, remelting, refining, or return preparation of production scrap."
    role: "Keeps internal metal loops visible and records recovery losses and residues."
    quantitative_reference: "1 kg recovered aluminium returned or transferred"
  - id: coil_packaging_and_dispatch
    name: "Coil packaging and dispatch"
    inclusion: "required"
    inclusion_condition: "Always include final release, weighing, core assignment, packaging, and producer-gate dispatch."
    role: "Establishes the reference flow and separates net foil, core, and packaging masses."
    quantitative_reference: "1 kg net delivered foil product"
