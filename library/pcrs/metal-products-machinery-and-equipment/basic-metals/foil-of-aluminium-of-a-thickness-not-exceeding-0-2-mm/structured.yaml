allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "shared production lines and utilities"
    rule: "First separate processes, production routes, alloys, tempers, product gauges, and time periods using metering, mass, machine time, or other causal records before applying allocation."
    source_ids:
      - iso-14044-2006
      - environdec-pcr-2022-08
  - rule_id: allocation_internal_scrap_loop
    applies_to: "internal process scrap"
    rule: "Keep internal scrap as a visible loop and assign the recovery burdens and losses to the product system; do not claim internal scrap as primary displacement or external recycled content."
    source_ids:
      - european-aluminium-2018
      - environdec-pcr-2022-08
  - rule_id: allocation_external_scrap_method
    applies_to: "purchased scrap and exported recoverable material"
    rule: "Declare the chosen recycling or scrap allocation method, its system-boundary point, burdens, credits, quality correction, and consistency between input and output scrap; do not mix methods without reconciliation."
    source_ids:
      - environdec-pcr-2022-08
      - iso-14044-2006
  - rule_id: allocation_joint_products
    applies_to: "unavoidable joint or co-product outputs"
    rule: "When subdivision is not possible, apply a documented physical relationship; if a physical relationship cannot be established, use an economic or governing-program basis and disclose prices, period, sensitivity, and affected flows."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_offspec_and_waste
    applies_to: "off-specification foil, trim, dross, and waste"
    rule: "Classify each output by actual destination and contractual status. A material shall not be simultaneously treated as an internally recovered loop, a waste treatment input, and an exported co-product."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_ledger
      process_id: "all_applicable_production_processes"
      flow_role: "aluminium and intermediate product mass"
      record_type: "scale tickets, ERP receipts/issues, production and stock records"
      raw_fields: "material id; alloy; recycled class; supplier/internal origin; opening stock; receipts; issues; closing stock; output; scrap; timestamp"
      collection_method: "Reconcile calibrated weighing and inventory records by process and product family."
      unit: "kg"
      frequency: "each batch or shift; aggregate monthly"
      temporal_coverage: "same reporting period as reference output"
      site_scope: "all included sites and outsourced controlled steps"
      aggregation_rule: "production-weighted sum with opening/closing work-in-progress correction"
      quality_evidence: "scale calibration; inventory reconciliation; batch genealogy"
    - protocol_id: cp_energy_metering
      process_id: "foil_stock_production_annealing"
      flow_role: "energy by carrier and operation"
      record_type: "meters, fuel invoices, furnace batch logs"
      raw_fields: "carrier; meter id; opening/closing reading; quantity; heating-value convention; batch; timestamp"
      collection_method: "Prefer submetering; allocate shared meters using documented causal drivers and reconcile to invoices."
      unit: "kWh or MJ by carrier"
      frequency: "continuous or each batch; reconcile monthly"
      temporal_coverage: "same reporting period as reference output"
      site_scope: "all included sites"
      aggregation_rule: "summed use divided by corresponding process output"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_energy_and_auxiliary_ledger
      process_id: "foil_rolling_double_rolling_and_separation_slitting_finishing_and_winding_internal_scrap_recovery"
      flow_role: "electricity and operating auxiliaries"
      record_type: "submeters, issue records, lubricant and consumable ledgers"
      raw_fields: "process; carrier/material; quantity; returned/recovered quantity; batch; timestamp"
      collection_method: "Reconcile metered energy and fresh material issues, excluding recirculated lubricant from fresh input."
      unit: "kWh, MJ, kg, or m3"
      frequency: "each shift or batch; aggregate monthly"
      temporal_coverage: "same reporting period as reference output"
      site_scope: "all included lines"
      aggregation_rule: "production-weighted sum per process output"
      quality_evidence: "meter/scale calibration; purchase and stock reconciliation"
    - protocol_id: cp_surface_treatment_ledger
      process_id: "surface_treatment_coating_or_backing"
      flow_role: "surface material, backing, and energy"
      record_type: "formulation, issue, coat-weight, meter, and production records"
      raw_fields: "material; dry solids; solvent; input mass; returned mass; coat weight; backing mass; energy; output mass; batch"
      collection_method: "Reconcile formulation and issue records to measured coat weight and output constituent mass."
      unit: "kg, kg/kg product, kWh, MJ"
      frequency: "each formulation and batch"
      temporal_coverage: "same reporting period as reference output"
      site_scope: "all included conversion lines"
      aggregation_rule: "mass-weighted formulation and energy per converted output"
      quality_evidence: "formulation approval; balance reconciliation; test certificate"
    - protocol_id: cp_emissions_waste_records
      process_id: "all_applicable_production_processes"
      flow_role: "direct releases and waste destinations"
      record_type: "stack/water monitoring, permits, waste manifests, treatment records"
      raw_fields: "substance/waste code; quantity; method; factor; destination; recovery status; timestamp"
      collection_method: "Use direct measurement where available; otherwise calculate from collected activity and documented factors."
      unit: "kg or m3 by flow"
      frequency: "per monitoring plan and each dispatch"
      temporal_coverage: "representative of the reporting period"
      site_scope: "all included emission points and waste routes"
      aggregation_rule: "measured sum or documented calculation divided by process output"
      quality_evidence: "laboratory report; permit record; manifest; factor provenance"
    - protocol_id: cp_quality_roll_release
      process_id: "foil_rolling_annealing_double_rolling_and_separation_slitting_finishing_and_winding"
      flow_role: "foil specification and released quantity"
      record_type: "mill certificates, inspection and laboratory records"
      raw_fields: "alloy; temper; nominal/measured thickness; tolerance; width; edge; side; coil mass; pinhole method/area/count; cleanliness or wettability method/result; acceptance criterion; release status"
      collection_method: "Link every released coil or sampled lot to its measured specification and declared contractual criteria."
      unit: "mm or µm; mm; kg; method-specific result"
      frequency: "each coil or statistically defined lot"
      temporal_coverage: "same reporting period as reference output"
      site_scope: "all included finishing lines"
      aggregation_rule: "retain lot results; production-weight summaries shall preserve ranges and rejected mass"
      quality_evidence: "instrument calibration; sampling plan; certificate of analysis"
    - protocol_id: cp_internal_scrap_ledger
      process_id: "internal_scrap_recovery"
      flow_role: "internal scrap loop and recovery loss"
      record_type: "scrap tickets, remelt batches, recovered-metal and residue records"
      raw_fields: "origin process; scrap class; input mass; recovered metal; return destination; residue; stock change; timestamp"
      collection_method: "Trace scrap from originating process through recovery or transfer without reclassifying it as external recycled input."
      unit: "kg"
      frequency: "each transfer and recovery batch"
      temporal_coverage: "same reporting period as reference output"
      site_scope: "all included recovery locations"
      aggregation_rule: "loop balance by scrap class and period"
      quality_evidence: "scale calibration; batch genealogy; mass-balance reconciliation"
    - protocol_id: cp_packaging_dispatch_ledger
      process_id: "coil_packaging_and_dispatch"
      flow_role: "net foil, core, packaging, and dispatch"
      record_type: "final scale ticket, bill of materials, packaging and shipment records"
      raw_fields: "coil id; net foil mass; core material/mass; packaging material/mass; customer specification; dispatch timestamp"
      collection_method: "Reconcile net and gross weights and retain material-specific packaging quantities."
      unit: "kg"
      frequency: "each dispatched coil"
      temporal_coverage: "same reporting period as reference output"
      site_scope: "all dispatch locations"
      aggregation_rule: "sum net output and each packaging material, then normalize to net foil mass"
      quality_evidence: "calibrated scale; shipment reconciliation; packaging specification"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "complete foreground inventory"
      rule: "Normalized flow = reporting-period flow quantity / reporting-period net saleable foil quantity."
      inputs:
        - "collected flow quantity"
        - "net saleable foil output"
      output: "flow per 1 kg net saleable foil"
      source_ids:
        - iso-14044-2006
    - id: calc_fresh_aluminium_shares
      applies_to: "aluminium-bearing input"
      rule: "For contained aluminium entering from outside the boundary, primary share + external pre-consumer recycled share + external post-consumer recycled share = 1 within declared rounding; keep alloying elements and internal return metal separately visible."
      inputs:
        - "contained aluminium mass by source class"
      output: "three declared external aluminium shares"
      source_ids:
        - environdec-pcr-2022-08
    - id: calc_metal_yield
      applies_to: "declared aluminium conversion boundary"
      rule: "Metal yield = net saleable aluminium mass embodied in foil / fresh aluminium mass entering the boundary. Net saleable aluminium excludes coating and backing; fresh aluminium excludes internal loop returns."
      inputs:
        - "reference-product constituent mass"
        - "fresh aluminium ledger"
        - "stock changes"
      output: "kg saleable Al/kg fresh Al input"
      source_ids:
        - european-aluminium-2018
    - id: calc_internal_scrap_balance
      applies_to: "internal scrap loop"
      rule: "Opening scrap stock + process scrap generated = recovered metal + exported scrap + recovery residues + closing scrap stock, after moisture and contamination corrections where material."
      inputs:
        - "scrap transfers"
        - "recovered metal"
        - residues
        - "stock changes"
      output: "reconciled loop balance and difference"
      source_ids:
        - european-aluminium-2018
    - id: calc_constituent_fraction
      applies_to: "converted foil"
      rule: "Constituent fraction = dry mass of each aluminium, coating, ink, lacquer, adhesive, laminate, or backing constituent / total dry sold-product mass; fractions sum to 1 within declared rounding."
      inputs:
        - formulation
        - coat-weight
        - backing
        - base-foil
        - "and output records"
      output: "kg constituent/kg sold product"
      source_ids:
        - eafa-alufoil-production
    - id: calc_weighted_aggregation
      applies_to: "multiple products, lines, or sites"
      rule: "Aggregate each normalized inventory flow using net saleable foil mass as weight; do not average ratios without their production weights."
      inputs:
        - "site/line/grade quantities and net outputs"
      output: "production-weighted inventory"
      source_ids:
        - iso-14044-2006
    - id: calc_direct_emission
      applies_to: "calculated direct releases"
      rule: "Emission = collected activity quantity × documented emission factor × applicable control-device adjustment; retain factor identity, unit, period, and control efficiency evidence."
      inputs:
        - "activity record"
        - factor
        - "control record"
      output: "substance-specific direct emission"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use one coherent reporting period no longer than 12 consecutive months; disclose shutdowns, atypical campaigns, and any substitution outside the period."
      evidence: "dated production, meter, purchase, waste, and quality records"
    - id: dq_technological
      applies_to: "declared product"
      requirement: "Preserve alloy/temper, gauge, foil-stock route, rolling/annealing route, double-rolling status, surface conversion, and application-specific specification instead of aggregating technologically dissimilar products without production weights."
      evidence: "route genealogy; product specification; weighted aggregation worksheet"
    - id: dq_geographical
      applies_to: "all included sites and upstream links"
      requirement: "Identify production country or region for each foreground site and the geographic representativeness of material and energy datasets."
      evidence: "site list; supplier records; dataset metadata"
    - id: dq_completeness
      applies_to: "mass, energy, water, emissions, and waste"
      requirement: "Reconcile material inputs, outputs, internal loops, stock changes, meters, and invoices; document excluded flows and the governing cut-off rule."
      evidence: "signed reconciliations; mass and energy balance; exclusion register"
    - id: dq_measurement
      applies_to: "collected quantities"
      requirement: "Use calibrated or legally controlled instruments where applicable and retain units, conversion factors, sampling plans, and uncertainty or precision information."
      evidence: "calibration certificates; laboratory methods; sampling plan; conversion worksheet"
    - id: dq_product_quality
      applies_to: "released foil"
      requirement: "Record the customer criterion and result for thickness, alloy/temper, coil geometry, pinholes, and cleanliness or wettability where specified. ASTM B926 may be used for pinhole identification/counting and ASTM F22 for a qualitative water-break cleanliness check, but this PCR does not convert those methods into universal acceptance thresholds."
      evidence: "release certificate; test method; sampled area; test result; contractual criterion"
    - id: dq_recycled_content
      applies_to: "aluminium source shares"
      requirement: "Preserve supplier evidence and chain-of-custody method for external recycled input; report internal scrap loops separately and avoid double counting."
      evidence: "supplier declaration; purchase specification; mass-balance or segregation records"
    - id: dq_source_hierarchy
      applies_to: "secondary evidence"
      requirement: "Prefer official standards/PCRs and representative industry datasets. Treat published averages as context unless product, route, geography, time, and boundary are demonstrably comparable."
      evidence: "source register; comparability assessment; replacement plan"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "The final reference output shall use Aluminum foil d3e373a5-987f-4e3a-9f5b-8feaa9aa01e2, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, normalized to exactly 1 kg net sold foil."
    source_ids: []
  - rule_id: validation_category_scope
    applies_to: "declared product"
    rule: "The aluminium-layer thickness shall be greater than zero and not exceed 0.2 mm; thickness excludes backing. Products thicker than 0.2 mm or finished downstream articles fail this PCR scope."
    source_ids:
      - unsd-cpc-3-41535
  - rule_id: validation_required_qualifiers
    applies_to: "dataset metadata"
    rule: "Every Section 3 required qualifier shall have a declared value, explicit none, or justified not applicable; a generic battery-grade or packaging-grade label does not satisfy the qualifier set."
    source_ids:
      - en-546-1-2007
      - astm-b926-2025
      - astm-f22-2021
  - rule_id: validation_route_completeness
    applies_to: "process inventory"
    rule: "Every process in the map shall be present, or conditional processes shall be explicitly marked not applicable with evidence; outsourced controlled operations shall remain visible and linked."
    source_ids:
      - european-aluminium-2018
      - eafa-alufoil-production
  - rule_id: validation_mass_reconciliation
    applies_to: "aluminium and converted-product mass"
    rule: "Material balances shall reconcile inputs, outputs, stock changes, internal loops, and residues. Constituent fractions shall be between 0 and 1 and sum to 1 within declared rounding. Any residual shall be reported and investigated, not forced to zero."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_recycled_content
    applies_to: "aluminium source accounting"
    rule: "Each external aluminium share shall be between 0 and 1 and the three external source shares shall sum to 1 within declared rounding; internal scrap shall not be counted as external recycled content."
    source_ids:
      - environdec-pcr-2022-08
  - rule_id: validation_yield
    applies_to: "metal conversion"
    rule: "Metal yield shall be calculated from collected mass records, lie between 0 and 1, state the included boundary and stock treatment, and remain separate from overall product yield when coatings or backing are present."
    source_ids:
      - european-aluminium-2018
  - rule_id: validation_quality_methods
    applies_to: "released product"
    rule: "Pinholes and cleanliness/wettability shall report the contractual criterion, method, sampling basis, and result where applicable. This PCR imposes no generic pass/fail threshold beyond the declared contract or governing product standard."
    source_ids:
      - astm-b926-2025
      - astm-f22-2021
  - rule_id: validation_allocation_disclosure
    applies_to: "allocated inventories"
    rule: "The dataset shall identify every allocation or recycling method, driver, affected flow, and sensitivity required by Section 7; unreported mixing of allocation methods fails conformance."
    source_ids:
      - iso-14044-2006
      - environdec-pcr-2022-08
  - rule_id: validation_no_contextual_defaults
    applies_to: "quantitative inventory"
    rule: "European Aluminium industry averages or application-specific Tiangong process candidates shall not be copied as category defaults without a documented comparability review and explicit narrower dataset identity."
    source_ids:
      - european-aluminium-2018
published_dataset_profile:
  dataset_role: "Foreground aluminium-foil production data package and its process or lifecycle-model projection."
  downstream_use: "Product carbon footprint, LCA, EPD, supply-chain inventory, and engineering studies for battery current collectors, packaging, thermal-management, electrical, and other aluminium-foil uses when product qualifiers match."
  allowed_use: "Use for the declared alloy/temper, gauge, production route, surface state, coating/backing, quality specification, geography, technology, and period; broader aggregation is allowed only with production-weighted coverage and transparent composition."
  excluded_use: "Generic representation of all CPC 41535 foil from one narrow grade or route; product-performance certification; legal compliance claims; finished-package, battery, electrical, or thermal-product inventories beyond the foil producer gate."
  required_metadata: "CPC 3.0 41535; exact Tiangong reference flow identity; all Section 3 qualifiers; declared starting condition; included/outsourced processes; site, geography, technology and period; allocation and recycling method; foreground versus secondary data status."
  required_quality_disclosure: "Data coverage and completeness; metering and estimation shares; mass/energy reconciliation; recycled-content chain of custody; metal yield; pinhole and cleanliness methods/results where applicable; uncertainty and deviations; comparability limits for any published secondary data."
  update_trigger: "Change in thickness/alloy/temper product mix, foil-stock route, rolling or annealing route, double-rolling practice, surface conversion, recycled-content sourcing or allocation method, yield, energy supply, site boundary, quality specification, or reporting period that materially changes representativeness."
data_sources:
  - id: "unsd-cpc-3-41535"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0, code 41535 and explanatory notes, 2025. [Official CPC resources](https://unstats.un.org/unsd/classifications/Econ/CPC) and [CPC Version 3.0 explanatory notes](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf), accessed 2026-08-09."
    used_for: "Exact category identity; aluminium-layer thickness limit; backed-foil classification treatment."
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management - Life cycle assessment - Requirements and guidelines, current edition confirmed 2022. [ISO catalogue record](https://www.iso.org/standard/38498.html), accessed 2026-08-09."
    used_for: "LCI boundary, allocation, data-quality, calculation, and reporting principles."
  - id: "environdec-pcr-2022-08"
    type: "standard"
    reference: "EPD International, PCR 2022:08 Basic aluminium products and special alloys, version 1.0.2, valid to 2027-06-09. [PCR library record](https://www.environdec.com/pcr-library/pcr_040ae46d-0894-4dca-831b-91aa8d2b93b8), accessed 2026-08-09."
    used_for: "Aluminium-product PCR scope and explicit disclosure of the selected scrap/recycling allocation method."
  - id: "european-aluminium-2018"
    type: "dataset"
    reference: "European Aluminium, Environmental Profile Report: Life-Cycle Inventory Data for Aluminium Production and Transformation Processes in Europe, February 2018. [Full report](https://european-aluminium.eu/wp-content/uploads/2023/01/European-Aluminium_Environmental-Profile-Report-2018_full-version.pdf), accessed 2026-08-09."
    used_for: "Broad foil process decomposition, hot-rolled and continuous-cast foil-stock routes, optional annealing/surface treatment/slitting, double rolling, internal scrap recovery, and contextual industry inventory structure. Numerical industry averages are not adopted as defaults."
