allocation_rules:
  - rule_id: al_subdivide_first
    applies_to: "jointly operated refinery units"
    rule: "Subdivide operations and use direct meters, assays, and mass balances before applying allocation; retain route-specific treatment and abatement loads with the route that causes them."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: al_recovered_metals
    applies_to: "copper, cobalt, precious-metal, or other recovered co-products"
    rule: "Where subdivision cannot separate a recovered co-product, apply one documented allocation method consistently to inputs, direct emissions, and wastes; report pre-allocation quantities and sensitivity to an alternative physical relation."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: al_internal_recycling
    applies_to: "internal electrolyte, chlorine, acid, water, dust, and nickel-bearing recycle"
    rule: "Do not create upstream credits for internal closed-loop reuse; record only net boundary inputs and outputs while retaining gross internal circulation needed for process control."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: al_external_recycling
    applies_to: "externally supplied recycled nickel and exported recyclable residues"
    rule: "Record external recycled feed and exported recyclable material as separate flows; disclose the selected recycling allocation or substitution convention and do not mix conventions within one dataset."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_inputs
      process_id: "pr_nickel_refining"
      flow_role: "nickel-bearing feed and mass reagent"
      record_type: "weighbridge, batch sheet, tank receipt, invoice, assay"
      raw_fields: "flow identity; supplier; lot; gross and tare mass; moisture; concentration or assay; date; route"
      collection_method: "reconcile receipts and process issue records to stock change"
      unit: "kg plus mass fraction"
      frequency: "per receipt or batch; aggregate monthly"
      temporal_coverage: "at least one representative 12-month period"
      site_scope: "all included refinery units"
      aggregation_rule: "opening stock + receipts - closing stock - documented transfers, then normalize by conforming output"
      quality_evidence: "calibrated scales; assay certificates; stock reconciliation; exception log"
    - protocol_id: cp_water_input
      process_id: "pr_nickel_refining"
      flow_role: "process water"
      record_type: "meter and water balance"
      raw_fields: "meter id; opening and closing reading; source; density basis if mass is converted; recycled-water volume; date"
      collection_method: "read boundary supply meters and reconcile against major sub-meters"
      unit: "kg"
      frequency: "at least monthly"
      temporal_coverage: "same period as product output"
      site_scope: "all included refinery units"
      aggregation_rule: "sum external make-up water without subtracting internal recycle, then normalize"
      quality_evidence: "meter calibration; water-balance closure; missing-data log"
    - protocol_id: cp_process_gases
      process_id: "pr_nickel_refining"
      flow_role: "route-specific process gas"
      record_type: "custody-transfer or process meter"
      raw_fields: "gas identity; purity or composition; meter reading; temperature; pressure; wet/dry basis; route; date"
      collection_method: "standardise volume to the declared reference conditions"
      unit: "m3"
      frequency: "continuous or per delivery; aggregate monthly"
      temporal_coverage: "same period as applicable route output"
      site_scope: "supplying meter to each included route"
      aggregation_rule: "sum standardised make-up volume and normalize to route output"
      quality_evidence: "meter calibration; gas certificate; conversion worksheet"
    - protocol_id: cp_electricity_input
      process_id: "pr_nickel_refining"
      flow_role: "alternating current"
      record_type: "revenue and sub-meter records"
      raw_fields: "meter id; kWh; voltage; supplier or generator; included units; date"
      collection_method: "reconcile facility meter with route and abatement sub-meters"
      unit: "kWh and MJ"
      frequency: "continuous meter; aggregate monthly"
      temporal_coverage: "same period as product output"
      site_scope: "all included production and direct-treatment units"
      aggregation_rule: "sum kWh, multiply by 3.6 MJ/kWh, and normalize"
      quality_evidence: "meter calibration; invoice reconciliation; sub-meter coverage"
    - protocol_id: cp_product_output
      process_id: "pr_nickel_refining"
      flow_role: "saleable unwrought nickel"
      record_type: "product scale and quality-release record"
      raw_fields: "product form; purity or alloy grade; gross and tare mass; moisture; disposition; date"
      collection_method: "sum only conforming released product and retain nonconforming material separately"
      unit: "kg"
      frequency: "per lot; aggregate monthly"
      temporal_coverage: "same period as inputs"
      site_scope: "refinery gate"
      aggregation_rule: "sum dry net conforming mass by product variant before normalization"
      quality_evidence: "calibrated product scale; laboratory release certificate; lot reconciliation"
    - protocol_id: cp_direct_co2
      process_id: "pr_nickel_refining"
      flow_role: "direct fossil carbon dioxide"
      record_type: "stack monitor or fuel-carbon balance"
      raw_fields: "source id; measured CO2 or fuel quantity; carbon content; oxidation factor; biogenic fraction; operating period"
      collection_method: "prefer measured stack totals; otherwise calculate from site fuel records without including upstream emissions"
      unit: "kg CO2"
      frequency: "continuous or per fuel batch; aggregate monthly"
      temporal_coverage: "same period as product output"
      site_scope: "direct sources within the foreground boundary"
      aggregation_rule: "sum non-overlapping direct sources and normalize"
      quality_evidence: "monitor QA records or fuel certificates; calculation audit; overlap check"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory amount"
      rule: "normalized amount = reporting-period amount / dry net conforming unwrought nickel output × 1,000 kg"
      inputs:
        - "reporting-period exchange amount"
        - "cp_product_output dry net output"
      output: "amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "in_alternating_current"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - "reconciled kWh from cp_electricity_input"
      output: "electricity input in MJ"
      source_ids: []
    - id: calc_active_reagent
      applies_to: "solution reagents"
      rule: "pure-substance equivalent = delivered solution mass × measured mass fraction; retain delivered product mass as the exchange amount unless the selected flow identity is pure substance"
      inputs:
        - "delivered mass"
        - "certificate or measured concentration"
      output: "auditable active-substance equivalent"
      source_ids: []
    - id: calc_nickel_balance
      applies_to: "nickel-bearing inputs and outputs"
      rule: "reconcile nickel content in feeds to nickel in products, co-products, wastes, emissions, and stock change using contemporaneous assays; investigate rather than allocate unexplained imbalance"
      inputs:
        - masses
        - "nickel assays"
        - "inventory changes"
      output: "nickel mass-balance closure and exception record"
      source_ids:
        - eu-jrc-nfm-bref-2017
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all exchanges"
      requirement: "Use one concrete chemical or physical flow per row and preserve Tiangong UUID identity where confirmed; keep unresolved identities explicit."
      evidence: "direct-read UUID audit; lot and supplier records"
    - id: dq_route
      applies_to: "process coverage"
      requirement: "Identify every operating refinery route and quantify its share of reference output; do not use this dataset for an unrepresented route."
      evidence: "process map; route production records"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one common representative 12-month period or document and reconcile any shorter or offset coverage."
      evidence: "meter dates; batch dates; production calendar"
    - id: dq_completeness
      applies_to: "mass, energy, water, gas, waste, and direct-emission records"
      requirement: "Reconcile facility totals to included units, identify missing meters and estimated intervals, and disclose excluded operations."
      evidence: "balance checks; meter coverage map; missing-data log"
    - id: dq_assay
      applies_to: "nickel-bearing materials"
      requirement: "Use contemporaneous representative assays for nickel, moisture, and allocation-relevant co-metals; disclose sampling and laboratory method."
      evidence: "certificates of analysis; sampling plan; laboratory QA"
    - id: dq_geography_technology
      applies_to: "upstream links"
      requirement: "Match upstream datasets to supplier geography, production technology, product state, and delivery boundary or disclose each mismatch."
      evidence: "supplier dataset metadata; representativeness review"
validation_rules:
  - rule_id: val_reference_output
    applies_to: "reference flow"
    rule: "Confirm that the output equals 1,000 kg dry net conforming unwrought nickel and that purity or alloy grade and physical form are declared."
    source_ids:
      - src_unsd_cpc_3_0_2025
  - rule_id: val_product_boundary
    applies_to: "product identity"
    rule: "Reject datasets whose reference product is nickel matte, nickel oxide sinter, ferro-nickel, a nickel chemical, nickel powder or flake, scrap, or a semi-finished nickel product."
    source_ids:
      - src_unsd_cpc_3_0_2025
  - rule_id: val_route_rows
    applies_to: "conditional inventory"
    rule: "Confirm that each route-conditional input is either supported by a foreground record or explicitly not applicable to the declared route; never substitute an umbrella utility, gas, chemical, waste, or emission label."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: val_units
    applies_to: "measurement"
    rule: "Verify dry/net mass treatment, gas reference conditions, and kWh-to-MJ conversion before normalization."
    source_ids: []
  - rule_id: val_balance
    applies_to: "nickel mass balance"
    rule: "Require an auditable nickel balance across feed, product, co-products, wastes, emissions, and stock change; flag unexplained imbalance for review."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: val_allocation
    applies_to: "co-products and recycling"
    rule: "Confirm subdivision was attempted first and that any allocation or recycling convention is disclosed and applied consistently."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: val_uuid_gaps
    applies_to: "unresolved identities"
    rule: "Treat the unresolved reference product and hydrogen UUIDs as review findings; do not substitute a near match or proxy."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground refinery production dataset for one declared unwrought nickel product and route mix"
  downstream_use: "secondary_dataset; background_dataset after review and resolution of publication-blocking identity and evidence gaps"
  allowed_use: "Route-, product-, geography-, and period-matched LCA models requiring refinery-gate unwrought nickel"
  excluded_use: "Nickel mining or concentrate production; nickel-metallurgy intermediates; ferro-nickel; nickel chemicals; powder and flakes; semi-finished products; unrepresented refinery routes; global-average proxy claims without representativeness evidence"
  required_metadata: "PCR id; product form; nickel purity or alloy grade; refinery route and shares; feed identity and assay; site and geography; reporting period; energy and water supply; co-product and recycling method; packaging treatment; unresolved UUIDs"
  required_quality_disclosure: "Meter and assay coverage; mass-balance closure; missing data and estimates; temporal, geographic, and technological representativeness; direct-emission monitoring; allocation sensitivity; upstream dataset mismatches"
