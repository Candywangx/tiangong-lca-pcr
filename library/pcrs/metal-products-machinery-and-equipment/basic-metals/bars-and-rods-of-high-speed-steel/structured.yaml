allocation_rules:
  - rule_id: al_subdivision_first
    applies_to: "Shared equipment and site utilities"
    rule: "Avoid allocation by submetering or subdividing reheating, hot-working, treatment and finishing operations. If shared-meter allocation is unavoidable, use a documented causal driver such as furnace occupancy, machine time or processed mass and test sensitivity for materially different grades."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: al_internal_recirculation
    applies_to: "Internally returned steel or scale-bearing material"
    rule: "Record internal recovery as output from the generating operation and input to the receiving operation, then report the net boundary-crossing balance; do not claim an external avoided burden for internal circulation."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: al_exported_scale
    applies_to: "Mill scale exported for recovery"
    rule: "Treat exported mill scale as a co-product only when a documented market use and substitution function exist. Apply transparent system expansion for the identified substituted product; otherwise retain it as waste and include its treatment without an avoided-product credit."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: al_recycling_consistency
    applies_to: "Upstream billet and downstream study"
    rule: "Preserve and disclose the billet dataset's recycling convention. Do not add a second recycled-content burden or end-of-life credit inside this billet-to-gate foreground process."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "billet_to_bar_rod"
      flow_role: "Billet, product, sodium hydroxide, mill scale and spent alkaline liquor"
      record_type: "Calibrated scale tickets, batch sheets, purchase records, bath records and storage inventory"
      raw_fields: "lot_id; grade; input_mass_kg; output_mass_kg; solution_mass_kg; concentration_mass_fraction; waste_mass_kg; opening_inventory_kg; closing_inventory_kg"
      collection_method: "Reconcile physical receipts, issues, returns, product weights and waste dispatches by grade and lot"
      unit: "kg"
      frequency: "Each lot; aggregate monthly and annually"
      temporal_coverage: "Prefer one representative year; justify any shorter period and cover all declared operating modes"
      site_scope: "Producing site and named foreground line"
      aggregation_rule: "Sum boundary-crossing quantities plus closing inventory minus opening inventory, assign only documented shared quantities, then divide by conforming product mass"
      quality_evidence: "Scale calibration; stock reconciliation; certificates; bath analyses; waste transfer records; exception log"
    - protocol_id: cp_gas_metering
      process_id: "billet_to_bar_rod"
      flow_role: "Natural gas and industrial oxygen"
      record_type: "Calibrated furnace or supply meters and supplier statements"
      raw_fields: "timestamp; meter_id; gas_identity; volume; temperature; pressure; wet_dry_basis; product_lot; furnace_status"
      collection_method: "Read meters at lot or campaign boundaries and reconcile to supplier totals; normalize to one declared volume reference condition"
      unit: "m3"
      frequency: "Continuous or each shift; reconcile monthly"
      temporal_coverage: "Same representative period as product output and all applicable furnace modes"
      site_scope: "Producing site and applicable furnaces"
      aggregation_rule: "Sum normalized gas volume assigned by measured furnace operation or documented causal allocation, then divide by conforming product mass"
      quality_evidence: "Meter calibration; supplier reconciliation; furnace log; allocation rationale"
    - protocol_id: cp_energy_metering
      process_id: "billet_to_bar_rod"
      flow_role: "Purchased electricity"
      record_type: "Revenue, submeter or equipment-meter records"
      raw_fields: "timestamp; meter_id; kWh; voltage_level; supplier_or_grid; product_lot; equipment_status"
      collection_method: "Prefer process submeters; otherwise reconcile site purchases and allocate with documented equipment load, time or processed mass"
      unit: "kWh and MJ"
      frequency: "Continuous or each shift; reconcile monthly"
      temporal_coverage: "Same representative period as product output and all declared route states"
      site_scope: "Producing site and foreground equipment"
      aggregation_rule: "Subtract documented exports and out-of-scope uses, convert kWh to MJ, allocate only residual shared use, then divide by conforming product mass"
      quality_evidence: "Meter calibration; invoice reconciliation; load study; grid or supplier evidence"
    - protocol_id: cp_water_metering
      process_id: "billet_to_bar_rod"
      flow_role: "Process-water make-up"
      record_type: "Calibrated make-up meters, tank records and water-balance records"
      raw_fields: "timestamp; meter_id; source; volume_or_mass; temperature; density; recycle_flow; discharge_flow; product_lot"
      collection_method: "Meter net water crossing the foreground boundary and reconcile make-up, recycle, evaporation and discharge"
      unit: "kg"
      frequency: "Continuous or daily; reconcile monthly"
      temporal_coverage: "Same representative period as product output, including shutdown and maintenance effects where material"
      site_scope: "Producing site and descaling or cooling circuits"
      aggregation_rule: "Convert volume using documented density when needed, subtract out-of-scope transfers, and divide net make-up by conforming product mass"
      quality_evidence: "Meter calibration; annual water balance; maintenance log; reconciliation variance"
    - protocol_id: cp_direct_air_emissions
      process_id: "billet_to_bar_rod"
      flow_role: "Direct fossil carbon dioxide"
      record_type: "Stack monitoring, regulated emissions report or fuel-carbon inventory"
      raw_fields: "source_id; timestamp; fossil_CO2_kg; measurement_method; natural_gas_volume; carbon_factor; oxidation_factor; product_lot"
      collection_method: "Use source-specific monitoring where available; otherwise retain a transparent fuel-carbon calculation and reconcile it to the gas meter"
      unit: "kg"
      frequency: "Continuous, campaign or reporting-period basis; reconcile annually"
      temporal_coverage: "Same representative period and foreground combustion sources as the natural-gas record"
      site_scope: "Producing site and foreground furnaces only"
      aggregation_rule: "Sum direct fossil CO2 from included sources, exclude upstream electricity and off-site supply emissions, then divide by conforming product mass"
      quality_evidence: "Monitoring QA/QC; calculation workbook; fuel certificate; regulatory or inventory reconciliation"
  calculation_rules:
    - id: calc_normalize_mass
      applies_to: "All mass-based inventory rows"
      rule: "Normalized amount = attributed boundary-crossing row mass / conforming reference-product mass"
      inputs:
        - "attributed row mass"
        - "conforming product mass"
      output: "kg per 1 kg reference product"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_active_naoh
      applies_to: "dr_sodium_hydroxide"
      rule: "Active NaOH mass = delivered solution mass × measured NaOH mass fraction + opening active inventory − closing active inventory"
      inputs:
        - "solution mass"
        - concentration
        - "opening bath inventory"
        - "closing bath inventory"
      output: "kg active NaOH per 1 kg reference product"
      source_ids: []
    - id: calc_waste_liquor_mass
      applies_to: "wr_waste_alkaline_liquor"
      rule: "Wet liquor mass = measured mass, or discharged volume × measured density; reconcile the result with bath make-up and inventory change"
      inputs:
        - "waste mass or volume"
        - density
        - "opening and closing bath inventory"
      output: "kg wet liquor per 1 kg reference product"
      source_ids:
        - eu-2022-2110-ferrous-metals-processing
    - id: calc_energy_conversion
      applies_to: "dr_electricity"
      rule: "Electrical energy in MJ = metered kWh × 3.6"
      inputs:
        - "metered electricity in kWh"
      output: "MJ per 1 kg reference product"
      source_ids: []
    - id: calc_metallic_balance
      applies_to: "Steel-bearing input and outputs"
      rule: "Reconcile high-speed-steel billet mass with conforming product, retained work in process, internal return, mill scale and other separately identified steel-bearing outputs; investigate unexplained loss rather than assigning it to a generic waste flow"
      inputs:
        - billet
        - product
        - "work in process"
        - "internal return"
        - "mill scale"
        - "other identified steel-bearing outputs"
      output: "steel-bearing mass-balance closure and variance"
      source_ids:
        - worldsteel-lci-methodology-2017
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and billet"
      requirement: "Retain grade certificates, order specifications and lot traceability that demonstrate high-speed-steel identity and distinguish straight bar from rod/coil, dimensions, heat-treatment state and surface condition."
      evidence: "Mill certificate; purchase specification; product order; lot genealogy"
    - id: dq_technology_geography
      applies_to: "Foreground and upstream data"
      requirement: "Declare the actual hot-working and finishing technology and production geography. Use geographically and technologically representative upstream billet, electricity, gas, oxygen, water and treatment datasets."
      evidence: "Process map; supplier records; dataset metadata; representativeness review"
    - id: dq_temporal_coverage
      applies_to: "Foreground records"
      requirement: "Use a representative year where practical. If less than six months is used, justify it and demonstrate coverage of grade mix, campaign changes, shutdowns and all route-conditioned operations."
      evidence: "Dated records; production schedule; coverage assessment; exception log"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Reconcile meters and material records to the same site, period and product denominator. Separately report each included atomic exchange and document exclusions; do not hide unresolved loss in a generic waste, utility or emission row."
      evidence: "Reconciliation workbook; mass and energy balances; exclusion register; meter map"
    - id: dq_conditional_routes
      applies_to: "Oxygen enrichment and alkaline cleaning"
      requirement: "A conditional row may be marked not applicable only when furnace, bath and production records demonstrate that the operation did not occur for the represented product and period."
      evidence: "Furnace specification and logs; bath records; routing sheets"
validation_rules:
  - rule_id: val_identity
    applies_to: "Reference product"
    rule: "Fail conformance if grade evidence does not establish high-speed steel, if product form is not bar or rod, or if the reference flow lacks grade, form, dimensions, delivery condition, site, period or net-mass qualifiers."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: val_reference_amount
    applies_to: "Reference flow"
    rule: "Verify that the normalized conforming product output is exactly 1 kg and that packaging mass is excluded."
    source_ids: []
  - rule_id: val_boundary
    applies_to: "Foreground system"
    rule: "Verify that the dataset begins with a grade-compatible high-speed-steel billet, includes every actual producer-applied route step and direct foreground exchange, and does not double-count upstream billet, electricity-supply or downstream fabrication burdens."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: val_mass_balance
    applies_to: "Steel-bearing inventory"
    rule: "Require a documented steel-bearing mass balance and investigation of unexplained variance; mill scale, internal returns, work in process and any other real steel-bearing output shall be recorded separately."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: val_meter_reconciliation
    applies_to: "Energy, gases and water"
    rule: "Verify meter calibration, common temporal coverage, supplier or site reconciliation, conversion factors and the allocation of shared use to the declared product."
    source_ids:
      - eu-2022-2110-ferrous-metals-processing
      - worldsteel-lci-methodology-2017
  - rule_id: val_conditional_exchange
    applies_to: "Oxygen, sodium hydroxide and waste alkaline liquor"
    rule: "Verify that each conditional exchange is included only when its specific operation occurred and that input, inventory-change and waste records are mutually consistent."
    source_ids:
      - eu-2022-2110-ferrous-metals-processing
  - rule_id: val_uuid_integrity
    applies_to: "UUID-bearing rows"
    rule: "Verify every UUID by direct public state-100 read for semantic identity, flow type, property and unit group. Reject proxies and keep the three declared unresolved UUID rows empty until exact records are confirmed."
    source_ids: []
published_dataset_profile:
  dataset_role: "Candidate foreground production dataset that may become a secondary_dataset or background_dataset after independent methodology and translation review"
  downstream_use: "Cradle-to-gate models for high-speed-steel bars or rods and downstream products that consume the declared grade, form and delivery condition"
  allowed_use: "Product systems whose billet input, hot-working route, finishing state, geography, period, allocation convention and required qualifiers are compatible with this dataset"
  excluded_use: "Generic non-alloy or ordinary alloy steel; silico-manganese steel; wire; flat products; finished tools; a different grade or delivery condition without documented representativeness; use as a cradle-to-gate dataset when the upstream billet is absent"
  required_metadata: "canonical PCR id; product grade and specification; straight bar or rod/coil form; dimensions and tolerances; delivery and surface condition; upstream billet dataset and recycling convention; hot-working and finishing route; site and geography; reference period; data owners; allocation and substitution choices; UUID resolution status"
  required_quality_disclosure: "Record coverage and completeness; calibration and reconciliation results; mass-balance variance; submetering and shared-use allocation; upstream-data representativeness; conditional-route applicability; internal recycling; mill-scale destination; waste treatment; direct-emission method; unresolved UUIDs and range evidence needs"
  update_trigger: "New product grade family or forming route; changed billet source, furnace fuel, electricity supply, oxygen enrichment, water circuit, cleaning chemistry, waste treatment or allocation convention; material equipment change; expired representativeness period; resolution of a UUID or range-evidence need"
