system_boundary:
  rules:
    - rule_id: sb_foreground_start_end
      applies_to: "Billet-to-mill-gate foreground system"
      rule: "Start when a grade-identified high-speed-steel billet crosses the producing-site boundary. End when conforming bars or rods are weighed at the mill gate after all producer-applied conditioning. Include reheating, hot working, cooling, internal handling, applicable heat treatment and surface conditioning, utilities, separated wastes and direct emissions."
      source_ids:
        - eu-2022-2110-ferrous-metals-processing
        - worldsteel-lci-methodology-2017
    - rule_id: sb_upstream_billet
      applies_to: "Received high-speed-steel billet"
      rule: "Primary steelmaking, alloying, refining and casting are represented by an upstream billet dataset with compatible grade, route, geography, period and recycled-content method; do not reconstruct those burdens from a generic non-alloy billet."
      source_ids:
        - worldsteel-lci-methodology-2017
    - rule_id: sb_route_conditionals
      applies_to: "Route-conditioned operations"
      rule: "Include oxygen enrichment only when supplied industrial oxygen is used, alkaline cleaning only when performed, and heat treatment or surface finishing only when applied to the reference product. Mark an atomic row not applicable only from production records; do not average absent routes into a zero quantity."
      source_ids:
        - eu-2022-2110-ferrous-metals-processing
    - rule_id: sb_excluded_downstream
      applies_to: "Scope exclusions"
      rule: "Exclude packaging, outbound customer transport, customer machining, tool manufacture, use and end-of-life from this foreground dataset. If a study adds one of these stages, report it as a separate process without changing this reference flow."
      source_ids:
        - worldsteel-lci-methodology-2017
boundary_abstraction:
  declared_starting_condition: "Grade-identified high-speed-steel billet received at the producing site, before reheating for bar or rod hot working"
  starting_condition_role: "Upstream product input and foreground conversion starting point"
  product_classification_scope: "CPC 3.0 code 41271 is classification context; canonical identity remains high-speed-steel bars and rods at the declared mill-gate delivery condition"
  recursive_input_rule: "If off-site bars or rods of the same canonical category are used as feedstock, record their purchased mass as a separate upstream product input and disclose the reuse or rerolling route; do not recursively expand this PCR inside the same foreground process"
  upstream_dataset_requirement: "Use an upstream high-speed-steel billet dataset compatible with declared grade, steelmaking and casting route, geography, time period, recycled-content or end-of-life allocation convention and delivery condition"
  disclosure: "Declare billet grade and source, hot-working technology, included conditioning steps, product form and dimensions, site and geography, reference period, energy and water supply, internal recycling, exported recovered materials, waste treatment and direct-emission measurement basis"
