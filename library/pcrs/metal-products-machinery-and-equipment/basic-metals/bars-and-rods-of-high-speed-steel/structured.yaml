functional_unit:
  what: "High-speed-steel bar or rod supplied at the producing-site gate for downstream manufacture"
  how_much: "1 kg net product mass"
  how_well: "Conforming to the purchaser-declared high-speed-steel grade, dimensions, form, surface condition and delivery condition"
  how_long_or_cycle: "One completed production and dispatch lot; no use-phase service life is represented"
