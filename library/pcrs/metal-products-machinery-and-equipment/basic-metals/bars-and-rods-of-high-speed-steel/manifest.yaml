    range_evidence_needs:
      - row_id: dr_hss_billet
        explanation: "Establish a billet-input and metallic-yield interval from at least two independent sources compatible with high-speed-steel grade, billet-to-bar/rod boundary and delivered product state."
      - row_id: dr_natural_gas
        explanation: "Establish route-specific reheating or heat-treatment natural-gas intensity from at least two independent, boundary-compatible high-speed-steel bar or rod operations."
      - row_id: dr_electricity
        explanation: "Establish electricity intensity from at least two independent sources with compatible rolling, forging, heat-treatment and finishing coverage rather than using a general steel-sector value."
      - row_id: dr_industrial_oxygen
        explanation: "Establish oxygen-enrichment consumption only for applicable furnaces using at least two independent sources with compatible oxygen supply state and furnace boundary."
      - row_id: dr_process_water
        explanation: "Establish net make-up process-water intensity from at least two independent sources with compatible recycle, descaling, cooling and product-state boundaries."
      - row_id: dr_sodium_hydroxide
        explanation: "Establish sodium-hydroxide active-mass consumption for applicable alkaline-cleaning routes from at least two independent sources with compatible solution concentration and surface-finish requirements."
      - row_id: wr_mill_scale
        explanation: "Establish separated rolling-scale output from at least two independent high-speed-steel bar or rod operations with compatible oxide-scale collection and recovery boundaries."
      - row_id: wr_waste_alkaline_liquor
        explanation: "Establish spent alkaline-liquor output for applicable cleaning routes from at least two independent sources with compatible bath-life, concentration, water and off-site treatment boundaries."
      - row_id: er_carbon_dioxide_fossil
        explanation: "Establish direct fossil-carbon-dioxide intensity from at least two independent sources compatible with foreground fuel use, furnace technology, product mix and exclusion of upstream electricity emissions."
