    - rule_id: boundary_plant_gate
      applies_to: "foreground system"
      rule: "Start at receipt of burden-bearing inputs and end at accepted product leaving the producing plant; include onsite pollution-control operations associated with production."
      source_ids:
        - us-epa-ap42-ferroalloy-1995
    - rule_id: boundary_route_separation
      applies_to: "multi-route facilities"
      rule: "Keep carbothermic, metallothermic, remelting, and conditioning inventories separate until measured common services require documented allocation."
      source_ids:
        - us-epa-ap42-ferroalloy-1995
    - rule_id: boundary_offgas_residues
      applies_to: "furnace gas, slag, and dust"
      rule: "Record off-gas combustion, recovery, flaring, captured dust, slag reuse, sale, recycling, or disposal according to the actual site fate."
      source_ids:
        - us-epa-ap42-ferroalloy-1995
boundary_abstraction:
  declared_starting_condition: "Composition- and state-declared ores, concentrates, oxides, iron units, reducers, fluxes, electrodes, electricity, and water as received at the ferro-alloy plant boundary"
  starting_condition_role: "Burden-bearing upstream inputs to the foreground ferro-alloy production route"
