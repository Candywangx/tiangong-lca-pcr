    reference: "U.S. Environmental Protection Agency, AP-42 Section 12.4 Ferroalloy Production, October 1986, reformatted January 1995, https://www.epa.gov/sites/production/files/2020-11/documents/c12s04.pdf (retrieved 2026-09-04)"
    used_for: "Ferro-alloy definition, submerged-arc and metallothermic route decomposition, raw-material preparation, tapping and conditioning, slag and dust handling, and direct air-emission coverage"
  - id: "cn-mofcom-ferroalloy-2009"
