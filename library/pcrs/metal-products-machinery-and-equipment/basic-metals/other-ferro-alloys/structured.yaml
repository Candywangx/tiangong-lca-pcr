system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Include all onsite operations needed to convert received feedstocks into the declared saleable grade, including charge preparation, furnace or reaction-vessel operation, tapping, ladle treatment, casting or granulation, crushing and screening, internal recycling, and operation of dust or off-gas controls. Upstream production of electricity, ores, concentrates, reducers, fluxes, scrap preparation, and packaging shall be linked as background datasets rather than duplicated inside the foreground process."
