measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use the net mass of accepted saleable product at the factory gate; exclude pallets and packaging, and report moisture when it materially affects comparability."
  - id: grade_assay
    applies_to: "product and intermediate alloy"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "kg/kg"
    rule: "Report the campaign-weighted chemical assay and carbon content used to identify the declared grade; do not infer grade from trade name alone."
  - id: energy_conversion
    applies_to: "electricity and other metered energy"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Preserve the metered energy carrier and unit; document every conversion factor and do not merge electricity with heat or fuel."
  - id: mass_reconciliation
    applies_to: "each production route"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile measured charge, saleable product, internally recycled material, slag, captured dust, and other recorded losses for the same reporting period; explain unresolved imbalance."
  - id: air_emission_mass
    applies_to: "direct atmospheric emissions"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report pollutant mass for the declared air compartment and monitoring basis; retain dry/wet gas, oxygen correction, capture, flare, or recovery assumptions."
process_map:
