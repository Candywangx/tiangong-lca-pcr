allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "route and campaign inventories"
    rule: "Avoid allocation by separate metering and subdivision of carbothermic, metallothermic, remelting, and conditioning operations wherever records permit."
    source_ids: []
  - rule_id: allocation_internal_recycling
    applies_to: "internally recycled alloy, slag, and dust"
    rule: "Keep burdens and credits for material recycled within the foreground system inside that system; do not create an exported co-product for an internal transfer."
    source_ids:
      - us-epa-ap42-ferroalloy-1995
  - rule_id: allocation_exported_coproduct
    applies_to: "sold slag, recovered furnace gas, or other exported co-product"
    rule: "Apply documented physical causality when measurable; otherwise allocate unresolved shared burdens by dry mass, report the sensitivity, and disclose product prices without using them silently as the default basis."
    source_ids:
      - us-epa-ap42-ferroalloy-1995
  - rule_id: allocation_shared_services
    applies_to: "shared electricity, water, extraction, and conditioning services"
    rule: "Allocate measured shared services by causal meter, operating time, gas volume, or equipment throughput; use product mass only when no more causal record exists and disclose the affected share."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_cb_materials
      process_id: "carbothermic_smelting"
      flow_role: "charge materials"
      record_type: "weighbridge, batch sheet, receipt assay"
      raw_fields: "material identity; supplier; lot; wet mass; moisture; assay; charged mass; returns"
      collection_method: "reconcile receipts, stock change, and furnace batch sheets"
      unit: "kg"
      frequency: "each receipt and charge"
      temporal_coverage: "complete declared campaign or annual period"
      site_scope: "all carbothermic furnaces in scope"
      aggregation_rule: "sum charged mass by atomic material and divide by route output"
      quality_evidence: "calibrated scales, supplier certificates, moisture and assay records"
    - protocol_id: cp_cb_electrodes
      process_id: "carbothermic_smelting"
      flow_role: "graphite electrode"
      record_type: "inventory and maintenance log"
      raw_fields: "opening stock; receipts; closing stock; recoverable remnants; electrode grade"
      collection_method: "stock-balance calculation"
      unit: "kg"
      frequency: "each reporting period"
      temporal_coverage: "same period as furnace output"
      site_scope: "all carbothermic furnaces in scope"
      aggregation_rule: "net consumed mass divided by route output"
      quality_evidence: "stock count, purchase records, maintenance log"
    - protocol_id: cp_cb_electricity
      process_id: "carbothermic_smelting"
      flow_role: "furnace electricity"
      record_type: "revenue or submeter record"
      raw_fields: "meter id; opening and closing reading; losses; campaign assignment; supplier mix"
      collection_method: "calibrated meter reading"
      unit: "kWh"
      frequency: "continuous or per batch"
      temporal_coverage: "same period as furnace output"
      site_scope: "furnace and dedicated controls"
      aggregation_rule: "sum attributable readings and divide by route output"
      quality_evidence: "meter calibration and reconciliation to site invoice"
    - protocol_id: cp_cb_water
      process_id: "carbothermic_smelting"
      flow_role: "cooling-water make-up"
      record_type: "water submeter and treatment log"
      raw_fields: "source; treatment state; make-up volume or mass; blowdown; recirculation"
      collection_method: "submeter reading and water balance"
      unit: "kg"
      frequency: "daily or continuous"
      temporal_coverage: "same period as furnace output"
      site_scope: "furnace cooling system"
      aggregation_rule: "count only boundary make-up and divide by route output"
      quality_evidence: "meter calibration and water-balance closure"
    - protocol_id: cp_cb_product
      process_id: "carbothermic_smelting"
      flow_role: "molten or cast route product"
      record_type: "tap, ladle, casting, and stock record"
      raw_fields: "alloy grade; tap mass; transfer mass; assay; inventory change"
      collection_method: "reconcile taps, transfers, and inventory"
      unit: "kg"
      frequency: "each tap or batch"
      temporal_coverage: "complete declared campaign"
      site_scope: "all carbothermic route output"
      aggregation_rule: "net transferred grade-specific mass"
      quality_evidence: "scale calibration, assay certificate, signed production log"
    - protocol_id: cp_cb_residues
      process_id: "carbothermic_smelting"
      flow_role: "slag and captured dust"
      record_type: "container, skip, weighbridge, and destination record"
      raw_fields: "residue identity; mass; moisture; composition; destination; internal recycle"
      collection_method: "direct weighing and destination reconciliation"
      unit: "kg"
      frequency: "each movement"
      temporal_coverage: "same period as furnace output"
      site_scope: "all route residue destinations"
      aggregation_rule: "sum by atomic residue and fate"
      quality_evidence: "scale tickets, laboratory composition, transfer manifest"
    - protocol_id: cp_cb_air_emissions
      process_id: "carbothermic_smelting"
      flow_role: "carbon monoxide and carbon dioxide"
      record_type: "CEMS, stack test, gas-use, flare, and carbon-balance record"
      raw_fields: "gas flow; concentration; temperature; pressure; moisture; oxygen; operating time; carbon source; recovery and flare"
      collection_method: "validated monitoring or documented mass balance"
      unit: "kg"
      frequency: "continuous or campaign-representative test"
      temporal_coverage: "same period as furnace output"
      site_scope: "stacks and material fugitive sources in scope"
      aggregation_rule: "calculate each pollutant separately and divide by route output"
      quality_evidence: "calibration gas, stack-test report, uncertainty and data-coverage statement"
    - protocol_id: cp_mt_materials
      process_id: "metallothermic_reduction"
      flow_role: "oxide feeds, reducers, iron units, and flux"
      record_type: "batch sheet, receipt assay, and scale record"
      raw_fields: "material identity; purity; physical state; lot; charged mass; returns"
      collection_method: "batch-scale record reconciled to receipts and stock"
      unit: "kg"
      frequency: "each reaction batch"
      temporal_coverage: "complete declared campaign"
      site_scope: "all metallothermic vessels in scope"
      aggregation_rule: "sum each atomic material and divide by route output"
      quality_evidence: "calibrated scales, supplier assay, batch authorization"
    - protocol_id: cp_mt_electricity
      process_id: "metallothermic_reduction"
      flow_role: "auxiliary electricity"
      record_type: "submeter or equipment-hour record"
      raw_fields: "meter reading; equipment load; operating time; campaign assignment; supplier mix"
      collection_method: "direct metering, or documented load-time calculation when unmetered"
      unit: "kWh"
      frequency: "each batch or reporting period"
      temporal_coverage: "same period as reaction output"
      site_scope: "dedicated preparation, extraction, and handling equipment"
      aggregation_rule: "sum attributable electricity and divide by route output"
      quality_evidence: "meter calibration or equipment specification and operating log"
    - protocol_id: cp_mt_product
      process_id: "metallothermic_reduction"
      flow_role: "molten or cast route product"
      record_type: "batch yield, tap, casting, and assay record"
      raw_fields: "alloy grade; recovered mass; retained metal; assay; inventory change"
      collection_method: "reconcile reaction batches and recovered alloy"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete declared campaign"
      site_scope: "all metallothermic route output"
      aggregation_rule: "net transferred grade-specific mass"
      quality_evidence: "calibrated scales, assay certificate, signed batch record"
    - protocol_id: cp_mt_residues
      process_id: "metallothermic_reduction"
      flow_role: "reaction slag and captured dust"
      record_type: "container, weighbridge, and destination record"
      raw_fields: "residue identity; mass; moisture; composition; destination; internal recycle"
      collection_method: "direct weighing and destination reconciliation"
      unit: "kg"
      frequency: "each movement"
      temporal_coverage: "same period as reaction output"
      site_scope: "all route residue destinations"
      aggregation_rule: "sum by atomic residue and fate"
      quality_evidence: "scale tickets, laboratory composition, transfer manifest"
    - protocol_id: cp_pc_internal_transfer
      process_id: "product_conditioning"
      flow_role: "incoming alloy intermediate"
      record_type: "transfer and inventory record"
      raw_fields: "source process; grade; physical state; transfer mass; beginning and ending inventory"
      collection_method: "reconcile route outputs with conditioning receipts"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "complete declared campaign"
      site_scope: "all conditioning lines in scope"
      aggregation_rule: "net grade-specific mass entering conditioning"
      quality_evidence: "scale calibration and cross-process reconciliation"
    - protocol_id: cp_pc_electricity
      process_id: "product_conditioning"
      flow_role: "conditioning electricity"
      record_type: "submeter or equipment-hour record"
      raw_fields: "meter reading; line; operating time; product grade; supplier mix"
      collection_method: "direct metering, or documented load-time calculation when unmetered"
      unit: "kWh"
      frequency: "continuous or each shift"
      temporal_coverage: "same period as saleable output"
      site_scope: "cooling, crushing, screening, conveying, and dedicated controls"
      aggregation_rule: "sum attributable electricity and divide by accepted product"
      quality_evidence: "meter calibration or equipment specification and operating log"
    - protocol_id: cp_pc_product_release
      process_id: "product_conditioning"
      flow_role: "saleable product"
      record_type: "packing, dispatch, stock, and quality-release record"
      raw_fields: "grade; lot; gross mass; packaging tare; net mass; assay; particle size; moisture; release status"
      collection_method: "reconcile accepted net mass, dispatch, and stock change"
      unit: "kg"
      frequency: "each released lot"
      temporal_coverage: "complete declared campaign"
      site_scope: "all product release points"
      aggregation_rule: "sum accepted net product by declared grade"
      quality_evidence: "calibrated scales, laboratory certificate, release authorization"
    - protocol_id: cp_pc_residues
      process_id: "product_conditioning"
      flow_role: "off-spec scrap and captured dust"
      record_type: "rejection, container, weighbridge, and destination record"
      raw_fields: "residue identity; grade; mass; moisture; destination; internal recycle"
      collection_method: "direct weighing and fate reconciliation"
      unit: "kg"
      frequency: "each movement"
      temporal_coverage: "same period as saleable output"
      site_scope: "all conditioning residue destinations"
      aggregation_rule: "sum by atomic residue and fate"
      quality_evidence: "scale tickets, rejection record, transfer manifest"
    - protocol_id: cp_pc_air_emissions
      process_id: "product_conditioning"
      flow_role: "PM10"
      record_type: "stack test, dust-control, and operating record"
      raw_fields: "gas flow; PM10 concentration; operating time; control status; material throughput"
      collection_method: "validated stack test or engineering calculation tied to actual control operation"
      unit: "kg"
      frequency: "campaign-representative test and each control-state change"
      temporal_coverage: "same period as saleable output"
      site_scope: "conditioning exhausts and identified fugitive sources"
      aggregation_rule: "calculate discharged PM10 and divide by accepted product"
      quality_evidence: "stack-test report, control-maintenance log, uncertainty statement"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "Divide each period-total exchange by accepted net mass of the same declared product grade; keep unlike grades or routes separate unless a documented allocation rule is applied."
      inputs:
        - "period exchange"
        - "accepted net product mass"
        - grade
        - route
      output: "exchange per 1 kg reference product"
      source_ids: []
    - id: calc_stock_balance
      applies_to: "electrodes and stored materials"
      rule: "Consumption = opening stock + receipts - closing stock - externally returned or transferred material; reconcile unexplained loss."
      inputs:
        - "opening stock"
        - receipts
        - "closing stock"
        - returns
        - transfers
      output: "net consumed mass"
      source_ids: []
    - id: calc_carbon_emissions
      applies_to: "direct carbon monoxide and carbon dioxide"
      rule: "Use validated concentration-and-flow monitoring or a documented carbon balance; subtract recovered or exported carbon-containing gas only when measured and avoid double counting subsequent combustion."
      inputs:
        - "gas flow"
        - concentration
        - time
        - moisture
        - oxygen
        - "carbon input"
        - "recovered gas"
        - "flare records"
      output: "separate direct CO and CO2 masses"
      source_ids:
        - us-epa-ap42-ferroalloy-1995
    - id: calc_mass_reconciliation
      applies_to: "each route and conditioning"
      rule: "Compare total measured mass inputs with product, internal transfers, residues, measured emissions, and inventory change; retain the imbalance and its investigation rather than forcing closure."
      inputs:
        - "material inputs"
        - products
        - residues
        - "measured emissions"
        - "inventory changes"
      output: "documented route mass-balance residual"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Identify one alloy grade, chemical assay, carbon content, physical form, particle-size class, and acceptance specification."
      evidence: "lot release and laboratory certificates"
    - id: dq_route_identity
      applies_to: "all foreground processes"
      requirement: "Identify the reduction or remelting route, furnace or vessel type, enclosure and gas-control configuration, and material preparation performed onsite."
      evidence: "process flow diagram, equipment register, campaign log"
    - id: dq_temporal_alignment
      applies_to: "all exchanges"
      requirement: "Use the same reporting period for material, energy, production, residue, and emission records; disclose gaps, shutdowns, and abnormal campaigns."
      evidence: "period reconciliation and coverage statement"
    - id: dq_geographic_technology
      applies_to: "upstream links"
      requirement: "Select supplier datasets that match the declared geography, technology, product state, and grade; document any unresolved identity instead of silently using a proxy."
      evidence: "supplier metadata and UUID audit record"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Include each actually used material, energy carrier, waste, and direct emission as one atomic row and reconcile it to source records."
      evidence: "signed completeness checklist and mass or energy reconciliation"
    - id: dq_uncertainty
      applies_to: "calculated and monitored values"
      requirement: "Retain meter, assay, sampling, emission-test, allocation, and data-gap uncertainty and state how it affects the normalized result."
      evidence: "calibration, laboratory QA, stack-test QA, and uncertainty statement"
validation_rules:
  - rule_id: validation_identity
    applies_to: "product category"
    rule: "Reject a data package that omits the alloy grade, composition, carbon content, route, physical form, or factory-gate state."
    source_ids:
      - unstats-cpc-3-2025
  - rule_id: validation_exclusions
    applies_to: "product category"
    rule: "Reject use of this PCR for ferro-manganese, ferro-chromium, ferro-nickel, pig iron, directly reduced iron, iron or steel powder, crude steel, or a pure alloying metal."
    source_ids:
      - unstats-cpc-3-2025
  - rule_id: validation_reference_mass
    applies_to: "reference flow"
    rule: "Confirm that normalized output equals 1 kg net accepted product and excludes packaging tare."
    source_ids: []
  - rule_id: validation_route_processes
    applies_to: "process map"
    rule: "Require the applicable production route plus product conditioning; explain every omitted normally associated operation."
    source_ids:
      - us-epa-ap42-ferroalloy-1995
  - rule_id: validation_atomic_inventory
    applies_to: "inventory"
    rule: "Reject combined utilities, fuels, raw materials, wastes, or emissions; each row must identify one physical or chemical exchange."
    source_ids: []
  - rule_id: validation_internal_transfers
    applies_to: "route and conditioning links"
    rule: "Confirm that grade-specific upstream route output equals conditioning input after documented inventory change and loss."
    source_ids: []
  - rule_id: validation_offgas_residues
    applies_to: "direct emissions and wastes"
    rule: "Confirm that carbon monoxide, carbon dioxide, slag, captured dust, PM10, and off-spec product are reported when applicable and their actual recovery, reuse, sale, or disposal fate is declared."
    source_ids:
      - us-epa-ap42-ferroalloy-1995
  - rule_id: validation_uuid_status
    applies_to: "all UUID-bearing rows"
    rule: "Accept only directly audited public Tiangong state-code-100 identities whose names, flow type, classification, property, unit group, product state, geography, technology, and comments match the row."
    source_ids: []
  - rule_id: validation_range_evidence
    applies_to: "quantitative QA ranges"
    rule: "Do not infer an external range from fewer than two independent original-text sources with compatible boundary, functional unit, and product state; omit the range and preserve the foreground collection requirement when evidence is insufficient."
    source_ids: []
published_dataset_profile:
  dataset_role: "Grade-, route-, site-, and period-specific foreground production dataset eligible for later publication after methodology and identity review"
  downstream_use: "Secondary dataset or background dataset for systems consuming a declared other ferro-alloy at the producing plant gate"
  allowed_use: "Studies whose alloy grade, physical form, geography, production route, electricity supply, carbon-source origin, and residue treatment are compatible or explicitly adjusted"
  excluded_use: "Unspecified average ferro-alloy; separately classified ferro-manganese, ferro-chromium, or ferro-nickel; pure alloying metal; downstream steelmaking; a different route or grade without documented representativeness"
  required_metadata: "PCR id and version; product and grade; composition and carbon content; form and particle size; route and equipment; plant geography; reporting period; production volume; electricity supply; reducer origin; off-gas, slag, dust, and off-spec-product fate; allocation; UUID audit status"
  required_quality_disclosure: "Primary-data coverage; meter and assay QA; stack-test or calculation basis; mass-balance residual; allocation shares; upstream dataset representativeness; unresolved UUIDs and range-evidence needs; uncertainty and data gaps"
  update_trigger: "Change in alloy grade or specification, production route, furnace or controls, electricity supply, reducer origin, residue fate, allocation, plant geography, or a material shift in inputs, emissions, or production efficiency"
