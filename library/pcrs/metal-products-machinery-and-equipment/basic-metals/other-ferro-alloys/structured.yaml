    role: "Foreground reduction, tapping, and primary gas control"
    quantitative_reference: "kg molten or cast route product"
  - id: metallothermic_reduction
    name: "Metallothermic or silicothermic reduction"
    inclusion: "conditional"
    inclusion_condition: "Include when aluminium, silicon, or both reduce a declared metal oxide to the ferro-alloy"
    role: "Foreground reaction, tapping, and primary dust control"
    quantitative_reference: "kg molten or cast route product"
  - id: product_conditioning
    name: "Product cooling, crushing, screening, and release"
    inclusion: "required"
    inclusion_condition: "Always include; zero-value an operation only with evidence that the saleable product bypasses it"
    role: "Foreground finishing and factory-gate release"
    quantitative_reference: "1 kg net saleable other ferro-alloy"
