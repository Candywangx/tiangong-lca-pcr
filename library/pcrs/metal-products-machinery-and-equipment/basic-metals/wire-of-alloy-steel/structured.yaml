measurement_rules:
  - id: reference_product_mass
    applies_to: "Reference product and metal mass balance"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine net dry product mass on calibrated scales after final inspection; exclude pallets, spools, strapping and film from the reference-product mass and report those materials separately."
  - id: metal_mass_balance
    applies_to: "Alloy-steel inputs, internal transfers, saleable wire and metal-bearing wastes"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile batch opening and closing work-in-process so input metal equals saleable wire plus metal-bearing waste and inventory change, with coating metal tracked separately."
  - id: electricity_conversion
    applies_to: "Alternating-current inputs"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve metered kWh and convert to MJ using 1 kWh = 3.6 MJ; do not substitute a consumption-mix UUID unless its supplier, geography, voltage and delivery boundary match the site."
  - id: natural_gas_volume
    applies_to: "Gaseous natural-gas inputs"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Report metered gas volume at the stated reference temperature, pressure and moisture condition; retain the supplier net calorific value used for energy and CO2 calculations."
  - id: coating_mass
    applies_to: "Zinc-coated wire"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine deposited zinc from measured wire mass and coating test records or a documented coating-area calculation; do not include zinc in the alloy-steel reference mass balance."
