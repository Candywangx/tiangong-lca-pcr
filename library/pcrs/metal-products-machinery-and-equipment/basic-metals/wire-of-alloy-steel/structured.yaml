allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared equipment and services"
    rule: "First subdivide meters, batch records and process time so only burdens attributable to the declared alloy-steel wire are assigned to it."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_physical_relation
    applies_to: "Residual shared burdens"
    rule: "When subdivision is not feasible, allocate using a documented causal physical relation such as machine time, metered energy or processed mass; disclose the rationale, input data and sensitivity."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_no_avoided_burden
    applies_to: "Scrap, scale, spent liquor, dross and packaging offcuts"
    rule: "Report wastes and recovered materials at the foreground boundary without avoided-burden credits; any recycling or substitution model belongs to the receiving downstream system and must be reported separately."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_mass_reconciliation
    applies_to: "Metal-bearing outputs"
    rule: "Keep physical metal accounting independent from environmental-burden allocation and reconcile alloy-steel input, saleable wire, metal-bearing wastes and inventory change."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_metal_mass_balance
      process_id: "surface_preparation_wire_drawing_thermal_treatment_continuous_galvanising_finishing_and_dispatch"
      flow_role: "Alloy-steel input, internal transfers, product and metal waste"
      record_type: "Scale ticket, batch traveller and inventory log"
      raw_fields: "batch id; alloy grade; opening and closing work-in-process; input mass; transfer mass; product mass; scrap mass; moisture basis"
      collection_method: "Read calibrated scales and reconcile each production lot across process boundaries."
      unit: "kg"
      frequency: "Each lot, reconciled monthly"
      temporal_coverage: "Representative continuous 12-month period or every campaign for campaign production"
      site_scope: "All equipment and storage locations inside the foreground facility"
      aggregation_rule: "Sum accepted flows and inventory changes, then normalize to 1,000 kg accepted product."
      quality_evidence: "Calibration certificates, signed batch records and documented reconciliation"
    - protocol_id: cp_surface_preparation
      process_id: "surface_preparation"
      flow_role: "Water, acid, scale and spent liquor"
      record_type: "Meter, purchase issue, bath log and waste manifest"
      raw_fields: "route; water meter; solution mass; HCl fraction; bath opening and closing inventory; scale mass; spent-liquor mass; moisture; destination"
      collection_method: "Use process submeters and tank or scale records; subtract internal reuse and inventory change."
      unit: "m3; kg"
      frequency: "Each batch or daily meter reading"
      temporal_coverage: "Same production period as reference product"
      site_scope: "Surface-preparation line only"
      aggregation_rule: "Allocate shared daily totals by processed mass only when no causal submeter exists, and disclose allocation."
      quality_evidence: "Meter checks, supplier certificates, bath analyses and waste manifests"
    - protocol_id: cp_electricity
      process_id: "wire_drawing_thermal_treatment_continuous_galvanising_finishing_and_dispatch"
      flow_role: "Alternating-current electricity"
      record_type: "Revenue meter and process submeter"
      raw_fields: "meter id; voltage; supplier; geography; opening and closing kWh; production mass; downtime"
      collection_method: "Difference calibrated meter readings; exclude non-production loads unless causally allocated and disclosed."
      unit: "kWh and MJ"
      frequency: "Each shift or batch"
      temporal_coverage: "Same production period as reference product"
      site_scope: "Each included process and directly associated control equipment"
      aggregation_rule: "Convert kWh to MJ and normalize by the applicable process output."
      quality_evidence: "Meter calibration, invoice reconciliation and load-allocation record"
    - protocol_id: cp_drawing_lubricant
      process_id: "wire_drawing"
      flow_role: "Calcium stearate, fresh emulsion and spent emulsion"
      record_type: "Stores issue, tank balance and waste manifest"
      raw_fields: "formulation; fresh charge; returned unused mass; circuit opening and closing inventory; purge mass; recovery destination"
      collection_method: "Complete dry-lubricant or wet-emulsion material balance for each route."
      unit: "kg"
      frequency: "Each batch, reconciled monthly"
      temporal_coverage: "Same production period as reference product"
      site_scope: "Drawing machines and lubricant treatment circuit"
      aggregation_rule: "Fresh input minus return and inventory increase; report cleaned and internally reused lubricant as an internal loop."
      quality_evidence: "Supplier formulation, tank measurements and recovery records"
    - protocol_id: cp_thermal_energy
      process_id: "thermal_treatment_continuous_galvanising"
      flow_role: "Natural gas"
      record_type: "Gas meter and supplier certificate"
      raw_fields: "meter id; volume; temperature; pressure; moisture basis; net calorific value; furnace assignment; production mass"
      collection_method: "Difference calibrated meter readings and assign only to included furnaces or coating-bath heating."
      unit: "m3 and MJ"
      frequency: "Each shift or campaign"
      temporal_coverage: "Same production period as reference product"
      site_scope: "Included thermal equipment only"
      aggregation_rule: "Normalize reference-condition volume and energy to the applicable process output."
      quality_evidence: "Meter calibration and supplier gas-quality certificate"
    - protocol_id: cp_combustion_co2
      process_id: "thermal_treatment_continuous_galvanising"
      flow_role: "Fossil carbon dioxide"
      record_type: "Stack test or fuel-carbon calculation worksheet"
      raw_fields: "fuel energy; carbon or CO2 factor; oxidation factor; stack measurement where used; furnace assignment"
      collection_method: "Prefer representative measured mass; otherwise calculate from collected fuel activity and documented site-specific or IPCC-consistent factors."
      unit: "kg CO2"
      frequency: "Each reporting period and after fuel change"
      temporal_coverage: "Same production period as fuel input"
      site_scope: "Included natural-gas combustion sources"
      aggregation_rule: "Sum source-specific CO2 and normalize to the applicable process output without double counting supplier upstream emissions."
      quality_evidence: "Stack report or signed calculation with factor provenance"
    - protocol_id: cp_galvanising_materials
      process_id: "continuous_galvanising"
      flow_role: "Acid, zinc and flux"
      record_type: "Purchase issue, tank balance and coating test"
      raw_fields: "solution mass and concentration; zinc additions; bath inventory; flux formulation and additions; coating mass"
      collection_method: "Complete chemical and metal balances for the continuous coating line."
      unit: "kg"
      frequency: "Each campaign, reconciled monthly"
      temporal_coverage: "Same production period as galvanised output"
      site_scope: "Continuous wire-galvanising line only"
      aggregation_rule: "Subtract closing inventory increase and internal returns; reconcile deposited zinc and dross."
      quality_evidence: "Supplier certificates, bath analyses and coating test records"
    - protocol_id: cp_galvanising_wastes
      process_id: "continuous_galvanising"
      flow_role: "Spent liquor, zinc dross and acidic wastewater"
      record_type: "Waste manifest, tank record and effluent meter"
      raw_fields: "stream identity; mass or volume; pH; acid; suspended solids; zinc and relevant alloy metals; destination"
      collection_method: "Measure each stream after internal reuse and before it crosses the facility boundary."
      unit: "kg; m3"
      frequency: "Each shipment and continuous or daily discharge reading"
      temporal_coverage: "Same production period as galvanised output"
      site_scope: "Continuous wire-galvanising line and its treatment equipment"
      aggregation_rule: "Sum separately by stream and destination; do not aggregate hazardous and non-hazardous streams."
      quality_evidence: "Accredited analyses, meter checks and waste transfer records"
    - protocol_id: cp_finishing_materials
      process_id: "finishing_and_dispatch"
      flow_role: "Rust-preventive oil"
      record_type: "Stores issue and application balance"
      raw_fields: "oil identity; fresh issue; recovered return; opening and closing inventory; product mass"
      collection_method: "Complete an application-system material balance for oiled products."
      unit: "kg"
      frequency: "Each lot, reconciled monthly"
      temporal_coverage: "Same production period as oiled output"
      site_scope: "Finishing line only"
      aggregation_rule: "Fresh issue minus return and inventory increase, normalized to oiled-wire mass."
      quality_evidence: "Supplier safety data, issue records and tank measurements"
    - protocol_id: cp_packaging
      process_id: "finishing_and_dispatch"
      flow_role: "Steel strapping, pallet, LDPE film and offcuts"
      record_type: "Bill of materials, count record and scale record"
      raw_fields: "material identity; unit mass; units used; shipped mass; offcut mass; pallet reuse status"
      collection_method: "Weigh representative packaging components and record counts for each shipment configuration."
      unit: "kg; item"
      frequency: "Each shipment configuration"
      temporal_coverage: "Same production period as reference product"
      site_scope: "Dispatch packing area"
      aggregation_rule: "Calculate count-based mass from verified unit mass; separate shipped material from on-site offcuts."
      quality_evidence: "Supplier specifications, scale records and packaging bill of materials"
    - protocol_id: cp_final_product
      process_id: "finishing_and_dispatch"
      flow_role: "Accepted reference product"
      record_type: "Final scale ticket and inspection record"
      raw_fields: "lot id; alloy grade; diameter; tolerance; mechanical condition; surface state; coating mass; net wire mass; packaging tare; disposition"
      collection_method: "Weigh accepted wire after inspection and deduct verified packaging tare."
      unit: "kg"
      frequency: "Each lot"
      temporal_coverage: "Same production period as all foreground inputs"
      site_scope: "Facility dispatch gate"
      aggregation_rule: "Sum only conforming net wire mass and normalize the inventory to 1,000 kg."
      quality_evidence: "Calibrated scale record, inspection certificate and tare record"
  calculation_rules:
    - id: calc_normalized_exchange
      applies_to: "Every foreground exchange"
      rule: "normalized amount = reporting-period exchange amount / accepted wire mass × 1,000 kg"
      inputs:
        - "collected exchange amount"
        - "accepted reference-product mass"
      output: "exchange per 1,000 kg accepted wire"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "Electricity rows"
      rule: "electricity MJ = metered kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calc_metal_balance
      applies_to: "Alloy-steel mass reconciliation"
      rule: "balance closure = alloy-steel input + opening work-in-process - accepted product - metal-bearing wastes - closing work-in-process"
      inputs:
        - "mass records for metal inputs"
        - product
        - "wastes and work-in-process"
      output: "absolute and percentage closure"
      source_ids: []
    - id: calc_zinc_deposition
      applies_to: "Continuous galvanising"
      rule: "deposited zinc = coated wire mass - incoming uncoated wire mass after correcting for other measured material changes; cross-check against surface-area and coating-test records"
      inputs:
        - "incoming wire mass"
        - "coated wire mass"
        - "coating test"
        - "wire geometry"
      output: "deposited zinc mass"
      source_ids:
        - eu-jrc-fmp-bref-2022
    - id: calc_fossil_co2
      applies_to: "Natural-gas combustion"
      rule: "fossil CO2 = fuel energy × documented CO2 emission factor; use site-specific carbon content and oxidation data where available and retain the factor basis"
      inputs:
        - "normalized fuel energy"
        - "CO2 factor"
        - "oxidation basis"
      output: "kg fossil CO2"
      source_ids:
        - ipcc-2006-stationary-combustion
    - id: calc_packaging_mass
      applies_to: "Counted packaging"
      rule: "packaging mass = verified unit mass × units shipped; subtract separately weighed offcuts from material issued only when both measurements share the same boundary"
      inputs:
        - "component count"
        - "verified unit mass"
        - "offcut mass"
      output: "kg packaging shipped and kg offcuts"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and wire inputs"
      requirement: "Declare alloy family and grade, governing specification, diameter and tolerance, mechanical or heat-treatment condition, surface or coating condition and product form."
      evidence: "Mill certificate, purchase specification and final inspection certificate"
    - id: dq_representativeness
      applies_to: "Foreground inventory"
      requirement: "Cover a representative continuous 12-month period; for campaign production, cover every campaign in the reporting year and disclose production-weighting."
      evidence: "Production schedule, meter coverage and campaign reconciliation"
    - id: dq_metering
      applies_to: "Mass, electricity, gas and water"
      requirement: "Use calibrated or verified instruments and reconcile process submeters to facility totals; disclose any allocation of shared totals."
      evidence: "Calibration records, invoices and reconciliation worksheets"
    - id: dq_completeness
      applies_to: "Chemicals, wastes and emissions"
      requirement: "Maintain a process-flow, chemical, wastewater and waste-gas inventory; justify each zero or not-applicable atomic exchange by route evidence."
      evidence: "Process flow sheet, chemical register, waste manifests and emissions inventory"
    - id: dq_upstream_inputs
      applies_to: "Wire rod, electricity, natural gas, zinc and packaging"
      requirement: "Select supplier and geography representative upstream datasets and disclose substitutions or proxies."
      evidence: "Supplier records and dataset-selection log"
    - id: dq_uncertainty
      applies_to: "Important flows without approved external ranges"
      requirement: "Report measured variability, missing-data treatment and uncertainty from foreground records; do not present BAT conformance levels as generic empirical defaults."
      evidence: "Batch statistics and uncertainty worksheet"
validation_rules:
  - rule_id: validation_reference_mass
    applies_to: "Reference flow"
    rule: "Confirm exactly 1,000 kg net accepted alloy-steel wire and exclude all packaging tare from reference-product mass."
    source_ids: []
  - rule_id: validation_identity_qualifiers
    applies_to: "Product identity"
    rule: "Reject a foreground package missing alloy grade, diameter, mechanical condition, surface state, production route, facility geography or production period."
    source_ids:
      - un-cpc-3-structure-2025
      - china-state-council-tariff-list-2019
  - rule_id: validation_process_alignment
    applies_to: "Process map and inventory"
    rule: "Require surface preparation, drawing and finishing; require thermal-treatment and galvanising rows only when those routes are declared, and reject route exchanges without their matching process."
    source_ids:
      - eu-jrc-fmp-bref-2022
  - rule_id: validation_atomic_inventory
    applies_to: "All inventory rows"
    rule: "Reject aggregated electricity, fuel, chemical, packaging, waste, wastewater or emission labels; every exchange must identify one physical product, waste or elementary flow."
    source_ids:
      - eu-bat-ferrous-2022-2110
  - rule_id: validation_metal_balance
    applies_to: "Alloy-steel and zinc balances"
    rule: "Require documented alloy-steel mass-balance closure and, for coated wire, a separate zinc balance; investigate and disclose material discrepancies before publication."
    source_ids: []
  - rule_id: validation_energy_identity
    applies_to: "Electricity and gas"
    rule: "Require actual supplier, geography, voltage and delivery boundary for electricity and reference volume, supplier and net calorific value for natural gas; do not accept the UUID alone as representativeness evidence."
    source_ids:
      - eu-bat-ferrous-2022-2110
  - rule_id: validation_no_unapproved_ranges
    applies_to: "Quantitative checks"
    rule: "Use foreground variability for QA until independently verified compatible range evidence is approved; do not convert single-source BAT levels, limits or case values into empirical default ranges."
    source_ids:
      - eu-bat-ferrous-2022-2110
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate production dataset for alloy-steel wire"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product and supply-chain LCA when alloy family, grade, diameter, mechanical condition, surface state, drawing and treatment route, geography, period and dispatch boundary match the modelled wire"
  excluded_use: "Generic crude-steel or wire-rod production; non-alloy steel wire; fabricated wire products; unqualified global averages; cradle-to-grave claims without linked upstream and downstream datasets"
  required_metadata: "Canonical PCR id; product and flow identifiers; alloy specification; diameter; mechanical state; surface and coating state; process routes; facility geography; technology; production period; data-owner role; upstream dataset identities; allocation method; packaging configuration"
  required_quality_disclosure: "Temporal, geographical and technological representativeness; meter coverage; metal and zinc balance closure; shared-load allocation; missing data; foreground variability; unresolved UUIDs; source versions; exclusions and deviations"
  update_trigger: "Change in alloy family, drawing reduction, drawing medium, furnace or coating technology, principal energy supplier, upstream steel route, packaging configuration, facility boundary, allocation method, or a material change in annual energy, water, chemical, yield, waste or emission intensity"
