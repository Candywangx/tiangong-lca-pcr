system_boundary:
  rules:
    - rule_id: sb_gate_boundary
      applies_to: "foreground refinery-and-finishing system"
      rule: "Include all attributable foreground material, energy, water, waste, and direct-emission exchanges from receipt of the declared assayed feed to released platinum at the factory gate."
      source_ids:
        - eu-nfm-bat-conclusions-2016
        - ipa-pgm-lca-2017-2022-update
    - rule_id: sb_route_disclosure
      applies_to: "primary, secondary, or mixed feed"
      rule: "Preserve primary and secondary feed histories as explicit metadata and do not average unlike upstream burden conventions without reporting the shares and calculation."
      source_ids:
        - ipa-pgm-lca-2017-2022-update
    - rule_id: sb_recycle_loops
      applies_to: "acid, chlorine, water, precious-metal, and residue loops"
      rule: "Count make-up inputs and net outputs crossing the foreground boundary. Report internally recovered and recirculated quantities separately and do not count them as new external inputs."
      source_ids:
        - eu-nfm-bat-conclusions-2016
    - rule_id: sb_forming_condition
      applies_to: "semi-manufactured or powder output"
      rule: "Include the forming, powder preparation, melting, casting, rolling, drawing, extrusion, annealing, or finishing operations performed before the declared factory-gate product is released; mark absent operations not applicable."
      source_ids:
        - eu-nfm-bat-conclusions-2016
boundary_abstraction:
  declared_starting_condition: "An identified, weighed, homogenised or otherwise representatively sampled, and assayed platinum-bearing refinery feed lot received at the foreground facility"
