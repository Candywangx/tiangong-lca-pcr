allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "separately metered operations and campaigns"
    rule: "Avoid allocation by subdividing campaign, unit-operation, and product-form records wherever technically feasible."
    source_ids:
      - eu-nfm-bat-conclusions-2016
  - rule_id: allocation_precious_metals
    applies_to: "joint precious-metal refinery burdens that cannot be subdivided"
    rule: "Allocate remaining shared precious-metal-refinery burdens by recovered mass of each separately assayed saleable precious metal, and disclose the factors and sensitivity to an economic alternative."
    source_ids:
      - ipa-pgm-lca-2017-2022-update
  - rule_id: allocation_base_and_precious_metals
    applies_to: "unresolved joint production of base and precious metals"
    rule: "Use the verified upstream supplier dataset method. If foreground joint burdens cannot be subdivided, apply economic allocation to recovered metal content with documented prices, period, currency, and sensitivity; do not mix methods silently."
    source_ids:
      - ipa-pgm-lca-2017-2022-update
  - rule_id: allocation_internal_recovery
    applies_to: "internal solutions, residues, filter cakes, and off-spec metal"
    rule: "Treat material returned within the foreground boundary as internal recycle without avoided-product credit. Recognise a co-product or waste only when it crosses the boundary, has a measured quantity, and has a documented destination."
    source_ids:
      - eu-nfm-bat-conclusions-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_feed_mass_assay
      process_id: "platinum_refining_and_finishing"
      flow_role: "assayed refinery feed"
      record_type: "weighbridge/batch ticket and laboratory assay"
      raw_fields: "lot id; origin; route; gross, tare and net mass; moisture; Pt and co-metal assays; sampling and assay methods; uncertainty; upstream dataset id"
      collection_method: "Calibrated weighing plus representative sampling and documented laboratory assay"
      unit: "kg; kg Pt/kg dry feed"
      frequency: "Every received lot"
      temporal_coverage: "Same campaigns and period as product output"
      site_scope: "All included refinery feeds"
      aggregation_rule: "Keep distinct feed lots; aggregate mass and contained metal only after dry-basis conversion and route tagging"
      quality_evidence: "Calibration records; chain of custody; duplicate or certified-reference assay checks"
    - protocol_id: cp_reagent_records
      process_id: "platinum_refining_and_finishing"
      flow_role: "hydrochloric acid, chlorine, and sodium hydroxide make-up"
      record_type: "tank, scale, flowmeter, batch, and invoice records"
      raw_fields: "reagent id; concentration/purity; opening and closing stock; receipts; returns; recovered-loop quantity; allocation key"
      collection_method: "Reconcile calibrated storage and dosing records with purchases and production batches"
      unit: "kg product"
      frequency: "Each batch; monthly reconciliation"
      temporal_coverage: "Full represented period"
      site_scope: "All included operations"
      aggregation_rule: "External input = opening stock + receipts - closing stock - documented returns; internal recycle reported separately"
      quality_evidence: "Meter/scale calibration; supplier certificate; inventory reconciliation"
    - protocol_id: cp_water_records
      process_id: "platinum_refining_and_finishing"
      flow_role: "process-water make-up"
      record_type: "water meter and balance"
      raw_fields: "source; quality; meter readings; density; recirculation; discharge"
      collection_method: "Calibrated make-up meters reconciled to recirculation and wastewater records"
      unit: "kg or m3 with conversion"
      frequency: "Continuous or each batch; monthly reconciliation"
      temporal_coverage: "Full represented period"
      site_scope: "All included water systems"
      aggregation_rule: "Count only make-up crossing the boundary; retain measured volume and documented density for mass conversion"
      quality_evidence: "Meter calibration; water balance; laboratory quality results"
    - protocol_id: cp_electricity_records
      process_id: "platinum_refining_and_finishing"
      flow_role: "purchased electricity"
      record_type: "revenue/submeter records"
      raw_fields: "meter id; import; export; voltage; grid geography; contract; on-site generation; operation allocation"
      collection_method: "Revenue meters and calibrated submeters; documented allocation for shared loads"
      unit: "kWh"
      frequency: "Continuous; monthly reconciliation"
      temporal_coverage: "Full represented period"
      site_scope: "All included operations"
      aggregation_rule: "Sum imported electricity attributable to included operations minus documented export; do not net unrelated site loads"
      quality_evidence: "Utility invoices; meter calibration; submeter coverage and reconciliation"
    - protocol_id: cp_fuel_records
      process_id: "platinum_refining_and_finishing"
      flow_role: "gaseous natural gas and direct fossil CO2"
      record_type: "custody-transfer meter, fuel certificate, and emissions calculation"
      raw_fields: "gas volume; temperature; pressure; moisture; heating value; carbon content; meter id; operation; monitoring result"
      collection_method: "Calibrated metering at stated reference conditions; calculate CO2 from documented carbon data and reconcile with monitoring"
      unit: "m3 gas; kg CO2"
      frequency: "Continuous or each batch; monthly reconciliation"
      temporal_coverage: "Full represented period"
      site_scope: "Included fuel-burning equipment only"
      aggregation_rule: "Aggregate condition-corrected volume; allocate shared equipment by defensible operating records; calculate direct fossil CO2 consistently"
      quality_evidence: "Meter calibration; supplier certificate; calculation sheet; emissions-monitor reconciliation"
    - protocol_id: cp_product_release
      process_id: "platinum_refining_and_finishing"
      flow_role: "released platinum product"
      record_type: "final scale, batch release, and assay records"
      raw_fields: "product lot; net mass; Pt assay; physical form; dimensions/particle specification; off-spec return; packaging tare"
      collection_method: "Calibrated final weighing and documented product-release assay"
      unit: "kg product; kg Pt/kg product"
      frequency: "Every released lot"
      temporal_coverage: "Same campaigns and period as inputs"
      site_scope: "All covered product lots in one declared dataset variant"
      aggregation_rule: "Sum conforming net released mass; exclude packaging tare and returned or off-spec material; normalise to 1 kg"
      quality_evidence: "Scale calibration; certificate of analysis; release specification; lot traceability"
    - protocol_id: cp_residue_records
      process_id: "platinum_refining_and_finishing"
      flow_role: "platinum-bearing hydroxide filter cake"
      record_type: "waste manifest, scale, and laboratory analysis"
      raw_fields: "mass; moisture; Pt and regulated-metal concentrations; destination; recovery/disposal status"
      collection_method: "Weigh each shipment or container and sample using a documented heterogeneous-solid protocol"
      unit: "kg wet and dry cake; kg Pt/kg dry cake"
      frequency: "Each shipment or batch"
      temporal_coverage: "Full represented period"
      site_scope: "All filter cake crossing the boundary"
      aggregation_rule: "Aggregate destination-specific dry and wet masses; keep internal returns outside the output"
      quality_evidence: "Scale calibration; chain of custody; laboratory QA/QC; waste manifest"
    - protocol_id: cp_wastewater_records
      process_id: "platinum_refining_and_finishing"
      flow_role: "acidic chloride-bearing wastewater"
      record_type: "flowmeter and composite sample"
      raw_fields: "flow; density; pH; chloride; suspended solids; Pt and regulated metals; treatment stage; destination"
      collection_method: "Calibrated net-flow measurement plus flow-proportional composite sampling"
      unit: "kg or m3; concentration units"
      frequency: "Continuous flow; composite per permit or batch"
      temporal_coverage: "Full represented period"
      site_scope: "Net wastewater crossing the foreground boundary"
      aggregation_rule: "Convert volume to mass only with measured/documented density; calculate loads from matched flow and concentration periods"
      quality_evidence: "Flowmeter calibration; laboratory QA/QC; treatment and discharge records"
  calculation_rules:
    - id: calc_normalise_reference
      applies_to: "every inventory exchange"
      rule: "Normalised amount = campaign exchange amount / net kg of conforming released platinum product."
      inputs:
        - "Campaign exchange quantity"
        - "cp_product_release net product mass"
      output: "Exchange per 1 kg reference product"
      source_ids: []
    - id: calc_dry_feed_platinum
      applies_to: "pt_refinery_feed"
      rule: "Dry feed mass = net wet mass × (1 - moisture fraction); contained Pt = dry feed mass × dry-basis Pt mass fraction."
      inputs:
        - Weighing
        - moisture
        - "and assay records from cp_feed_mass_assay"
      output: "kg dry feed and kg contained Pt"
      source_ids: []
    - id: calc_solution_mass
      applies_to: "aqueous reagent records"
      rule: "Keep solution product mass as the exchange; active reagent mass = solution mass × measured mass fraction is an additional calculation and must not replace the product exchange."
      inputs:
        - "Reagent mass and concentration from cp_reagent_records"
      output: "kg solution and kg active substance"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "fossil_carbon_dioxide"
      rule: "Calculate CO2 from measured fuel and documented carbon content or supplier factor; keep factor identity, oxidation assumption, and monitoring reconciliation."
      inputs:
        - "Natural-gas record and carbon data from cp_fuel_records"
      output: "kg fossil CO2"
      source_ids:
        - eu-nfm-bat-conclusions-2016
    - id: calc_precious_metal_allocation
      applies_to: "inseparable joint precious-metal-refinery burdens"
      rule: "Allocation factor for metal i = recovered saleable mass of metal i / total recovered saleable mass of jointly processed precious metals."
      inputs:
        - "Assayed released masses for all joint precious-metal co-products"
      output: "Product-specific allocation factors summing to 1"
      source_ids:
        - ipa-pgm-lca-2017-2022-update
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and feed"
      requirement: "Preserve lot-to-lot traceability, physical form, purity, feed origin, route, and Tiangong UUID status; do not substitute a wire-only UUID for the broader reference product."
      evidence: "Release certificates, feed tickets, assay records, and unresolved-UUID review metadata"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use a common representative period, normally at least 12 consecutive months or a complete documented campaign set covering seasonal and maintenance variation; explain shorter periods."
      evidence: "Meter, inventory, production, maintenance, and batch coverage records"
    - id: dq_completeness
      applies_to: "material, energy, water, waste, and direct emissions"
      requirement: "Reconcile all included operations and identify every additional reagent, fuel, waste, or direct elementary flow as its own atomic exchange before publication."
      evidence: "Mass/metal balances, utility reconciliation, waste manifests, emissions inventory, and completeness checklist"
    - id: dq_assay
      applies_to: "Pt-bearing feeds, products, co-products, and residues"
      requirement: "Use representative sampling, documented assay methods, units, detection limits, and uncertainty; retain duplicate or reference-material QA results where available."
      evidence: "Sampling plans, laboratory reports, QA/QC records, and certificates of analysis"
    - id: dq_geography_technology
      applies_to: "upstream datasets and utilities"
      requirement: "Match geography, technology, product state, concentration, and delivery boundary; disclose any proxy and do not assign an unverified UUID."
      evidence: "Supplier dataset metadata, contracts, process description, and UUID audit record"
validation_rules:
  - rule_id: val_reference_product
    applies_to: "reference flow and platinum_product"
    rule: "Verify exactly 1 kg net released platinum product after normalisation, with declared platinum assay and covered physical form; reject mixed-PGM mass as the platinum reference amount."
    source_ids:
      - un-cpc-3-structure-2025
  - rule_id: val_inventory_reconciliation
    applies_to: "foreground inventory"
    rule: "Require all 11 prescribed atomic rows to be either UUID-matched or explicitly unresolved and applicable rows to carry foreground quantities; add separate audited rows for any additional actual reagent, fuel, waste, or direct emission."
    source_ids:
      - eu-nfm-bat-conclusions-2016
  - rule_id: val_mass_metal_balance
    applies_to: "feeds, product, co-products, residues, and wastewater"
    rule: "Reconcile total mass and contained platinum across input, released products, internal stocks/recycle, residues, and measured losses; document uncertainty and investigation of material imbalance."
    source_ids:
      - eu-nfm-bat-conclusions-2016
  - rule_id: val_no_double_counting
    applies_to: "internal loops and upstream datasets"
    rule: "Verify that recovered acid, chlorine, water, solutions, residues, and platinum are not counted as new inputs and that upstream burdens are not duplicated in the foreground inventory."
    source_ids:
      - eu-nfm-bat-conclusions-2016
  - rule_id: val_allocation
    applies_to: "multi-metal campaigns"
    rule: "Verify subdivision was attempted first, all allocation factors sum to 1 for the allocated burden, co-product quantities and assays are measured, and sensitivity and method disclosures are present."
    source_ids:
      - ipa-pgm-lca-2017-2022-update
  - rule_id: val_waste_emissions
    applies_to: "wastewater, filter cake, and direct fossil CO2"
    rule: "Verify wastewater and filter cake destinations and compositions, distinguish internal recovery from boundary outputs, and exclude upstream electricity emissions from direct fossil CO2."
    source_ids:
      - eu-nfm-bat-conclusions-2016
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after review; candidate foreground packages remain authoring inputs"
  downstream_use: "Product-system modelling requiring platinum at the factory gate, with route, form, purity, geography, technology, period, and allocation matched to the study"
  allowed_use: "Use for the declared primary, secondary, or mixed feed route and declared released product form after UUID gaps, data-quality evidence, and boundary compatibility are reviewed"
  excluded_use: "Direct representation of ore or concentrate, platinum compounds, catalysts, jewellery, fabricated end-use articles, scrap treatment alone, or another PGM; unsupported extrapolation between primary and secondary routes"
  required_metadata: "PCR id; product form and purity; product and feed assays; feed route and origin; secondary cut-off convention; system boundary; geography; technology; period; allocation; UUID status; source and collection protocol versions"
  required_quality_disclosure: "Record coverage, meter and scale calibration, sampling and assay QA/QC, mass and platinum balance, allocation sensitivity, proxy datasets, unresolved UUIDs, and unresolved range-evidence needs"
  update_trigger: "Material change in feed mix, burden convention, refinery or finishing technology, energy or water supply, recovery efficiency, product specification, allocation, abatement, wastewater treatment, geography, or representative period"
