allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "Foreground subdivision"
    rule: "Avoid allocation by separately metering the selected formation route, flake conversion, finishing, pollution control, and internally recycled loops whenever the records permit subdivision."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "Internal recycling"
    rule: "Do not assign a co-product credit to copper powder, dust, solvent, electrolyte, or water returned within the same foreground system; record the internal loop and only the fresh make-up and boundary-crossing outputs."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "Exported copper-bearing material"
    rule: "Record each exported copper-bearing material as its own product or waste flow with mass, copper assay, destination, and contractual status. Do not prescribe a default avoided-burden credit or allocation factor; disclose the study-specific treatment and provide a sensitivity result when it materially changes conclusions."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "Shared site services"
    rule: "Allocate a shared measured total only after subdivision is impracticable, using a documented causal driver such as metered operating time or equipment load; do not use product value merely because it is available."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_atomization_records
      process_id: "atomization"
      flow_role: "Copper feed, atomizing medium, electricity, accepted intermediate"
      record_type: "Batch and meter records"
      raw_fields: "batch_id; cathode_mass; cathode_assay; water_makeup; nitrogen_volume; gas_reference_conditions; electricity_kWh; accepted_dry_powder_mass"
      collection_method: "Calibrated scales, water and gas meters, electricity meter, laboratory release record"
      unit: "kg; m3; kWh"
      frequency: "Each batch with monthly meter reconciliation"
      temporal_coverage: "At least 12 representative months or the full shorter campaign"
      site_scope: "All atomization equipment and dedicated controls in the declared site boundary"
      aggregation_rule: "Sum inputs and energy; divide by accepted dry intermediate; reconcile copper mass"
      quality_evidence: "Calibration records, invoices, batch sheets, assay certificates, and meter reconciliation"
    - protocol_id: cp_reduction_records
      process_id: "oxide_reduction"
      flow_role: "Oxide feed, reducing gases, electricity, direct CO2, accepted intermediate"
      record_type: "Batch, gas, meter, and emission records"
      raw_fields: "batch_id; oxide_mass; CuO_Cu2O_fraction; copper_assay; hydrogen_volume; natural_gas_volume; gas_reference_conditions; electricity_kWh; direct_CO2_mass; accepted_dry_powder_mass"
      collection_method: "Calibrated scales and meters; laboratory assay; stack record or fuel carbon balance"
      unit: "kg; m3; kWh"
      frequency: "Each batch with monthly utility and carbon reconciliation"
      temporal_coverage: "At least 12 representative months or the full shorter campaign"
      site_scope: "Reduction furnace, crushing, transfer, and dedicated controls"
      aggregation_rule: "Sum by batch; calculate direct CO2 only from foreground fossil gas; divide by accepted dry intermediate"
      quality_evidence: "Calibration, fuel invoices, composition certificate, batch sheets, assay, and carbon-balance evidence"
    - protocol_id: cp_electrolysis_records
      process_id: "electrolysis"
      flow_role: "Anode, acid, water, electricity, powder, electrolyte waste, rinse wastewater"
      record_type: "Campaign, laboratory, meter, and waste-transfer records"
      raw_fields: "campaign_id; anode_opening_mass; anode_closing_mass; acid_makeup_mass; acid_concentration; water_makeup; electricity_kWh; dry_powder_mass; spent_electrolyte_mass; spent_electrolyte_copper; rinse_wastewater_mass; wastewater_copper"
      collection_method: "Weighing, chemical inventory, meters, laboratory analyses, and waste manifests"
      unit: "kg; kg/kg; kWh"
      frequency: "Each campaign with monthly balance"
      temporal_coverage: "At least 12 representative months or the full shorter campaign"
      site_scope: "Cells, circulation, powder removal, washing, drying, and dedicated treatment"
      aggregation_rule: "Calculate consumed anode and pure-acid make-up; reconcile copper and liquid balances; divide by accepted dry intermediate"
      quality_evidence: "Scale and meter calibration, laboratory QA/QC, chemical invoices, waste manifests, and campaign log"
    - protocol_id: cp_flake_milling_records
      process_id: "flake_milling"
      flow_role: "Powder precursor, stearic acid, heptane, nitrogen, electricity, flake intermediate"
      record_type: "Batch, solvent-inventory, gas, and meter records"
      raw_fields: "batch_id; precursor_dry_mass; precursor_assay; stearic_acid_mass; fresh_heptane_mass; recovered_heptane_mass; heptane_inventory_change; nitrogen_volume; gas_reference_conditions; electricity_kWh; accepted_dry_flake_mass"
      collection_method: "Calibrated scales, tank or container inventory, gas meter, electricity meter, and release testing"
      unit: "kg; m3; kWh"
      frequency: "Each batch with monthly solvent reconciliation"
      temporal_coverage: "At least 12 representative months or the full shorter campaign"
      site_scope: "Milling, drying, fluid-energy milling, transfer, and dedicated recovery"
      aggregation_rule: "Apply solvent balance; sum energy and gas; divide by accepted dry flake output"
      quality_evidence: "Calibration, purchase and recovery records, batch sheets, and release test evidence"
    - protocol_id: cp_finishing_records
      process_id: "finishing"
      flow_role: "Electricity, accepted product, copper air release, heptane air release"
      record_type: "Lot, packing, meter, stack, and solvent-balance records"
      raw_fields: "lot_id; gross_packed_mass; package_tare; sample_moisture; accepted_net_dry_mass; electricity_kWh; stack_copper_concentration; dry_gas_volume; measured_heptane_mass; upstream_intermediate_mass"
      collection_method: "Calibrated packing scale and meter; release test; stack sampling; validated solvent balance"
      unit: "kg; kg/kg; kWh; m3"
      frequency: "Each lot with monthly control-system reconciliation"
      temporal_coverage: "At least 12 representative months or the full shorter campaign"
      site_scope: "Classification, blending, dust control, packing, and applicable process vents"
      aggregation_rule: "Calculate net dry accepted product and direct releases; normalize all selected route records to 1 kg product"
      quality_evidence: "Scale and meter calibration, certificates of analysis, rejected-lot log, stack QA/QC, and reconciliation"
  calculation_rules:
    - id: calc_reference_mass
      applies_to: "Reference product"
      rule: "net dry accepted mass = gross packed mass - package tare - water mass attributable to measured moisture"
      inputs:
        - gross_packed_mass
        - package_tare
        - sample_moisture
      output: "kg net dry accepted product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "Every electricity row"
      rule: "electricity_MJ = metered_kWh × 3.6"
      inputs:
        - electricity_kWh
      output: "MJ electricity"
      source_ids: []
    - id: calc_gas_normalization
      applies_to: "Nitrogen, hydrogen, and natural gas"
      rule: "Convert actual meter volume to the declared reference conditions using recorded absolute pressure, temperature, compressibility treatment, and moisture basis; retain raw actual volume"
      inputs:
        - actual_volume
        - pressure
        - temperature
        - moisture_basis
        - reference_conditions
      output: "m3 at declared reference conditions"
      source_ids: []
    - id: calc_pure_acid_makeup
      applies_to: "Sulfuric acid"
      rule: "pure sulfuric-acid make-up = delivered solution mass × measured acid mass fraction"
      inputs:
        - acid_makeup_mass
        - acid_concentration
      output: "kg H2SO4 equivalent and kg delivered solution, both retained"
      source_ids: []
    - id: calc_copper_balance
      applies_to: "Each selected route and the combined foreground system"
      rule: "Reconcile contained copper in feed with contained copper in accepted product, boundary-crossing copper-bearing products and wastes, direct copper releases, and inventory change; investigate and disclose the residual rather than forcing closure"
      inputs:
        - "dry masses"
        - "copper assays"
        - "inventory change"
        - "copper release data"
      output: "documented copper mass balance and residual"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "Direct fossil CO2"
      rule: "Use measured stack CO2 where representative; otherwise calculate only from foreground fossil natural-gas consumption and documented fuel carbon content and oxidation, excluding upstream emissions"
      inputs:
        - natural_gas_volume
        - "fuel composition or carbon content"
        - "oxidation evidence"
      output: "kg direct fossil CO2"
      source_ids: []
    - id: calc_heptane_balance
      applies_to: "Heptane route"
      rule: "fresh heptane + opening inventory = recovered heptane + returned heptane + waste heptane + direct air release + closing inventory + documented residual"
      inputs:
        - fresh
        - recovered
        - returned
        - waste
        - release
        - "and inventory records"
      output: "kg net consumption, kg direct release, and balance residual"
      source_ids:
        - uspto-us4884754-copper-flakes
    - id: calc_route_normalization
      applies_to: "All process rows"
      rule: "Normalize each selected route exchange by the accepted dry intermediate, link the intermediate to finishing, then normalize the combined system by net dry accepted reference product without double counting internal transfers"
      inputs:
        - "process totals"
        - "intermediate transfers"
        - "accepted product"
      output: "exchange per 1 kg reference product"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Retain certificate of analysis and sale specification for copper content, morphology, particle-size distribution and method, apparent density when specified, moisture, oxygen content, and surface treatment."
      evidence: "Lot release certificate and product specification"
    - id: dq_route
      applies_to: "Process map"
      requirement: "Identify the actual route and equipment sequence; conditional processes shall agree with inventory rows and no absent route shall carry a nonzero exchange."
      evidence: "Process flow diagram, batch route code, and operator record"
    - id: dq_temporal
      applies_to: "Foreground totals"
      requirement: "Use at least 12 representative months unless the campaign is shorter; explain start-up, shutdown, abnormal, and excluded periods."
      evidence: "Production calendar and exclusion log"
    - id: dq_completeness
      applies_to: "Mass, copper, water, solvent, and energy records"
      requirement: "Reconcile meters and inventories to purchase, production, and waste records; disclose all residuals and their disposition."
      evidence: "Signed reconciliation and corrective-action record"
    - id: dq_measurement
      applies_to: "Scales, meters, and analyses"
      requirement: "Use instruments within calibration and laboratory methods with documented sampling, detection limits, duplicates, blanks, and chain of custody where applicable."
      evidence: "Calibration certificates and laboratory QA/QC"
    - id: dq_upstream
      applies_to: "Purchased product inputs"
      requirement: "Match geography, technology, product state, purity, recycled content, and delivery boundary; disclose every proxy."
      evidence: "Supplier declarations and dataset-selection log"
    - id: dq_uncertainty
      applies_to: "Reported exchanges"
      requirement: "Quantify or qualitatively rank uncertainty from measurement, allocation, proxy choice, composition, and temporal variability; do not replace missing foreground records with PCR ranges."
      evidence: "Uncertainty register and sensitivity results"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "Product identity"
    rule: "The output shall be elemental copper powder or flakes; reject records whose sold output is copper alloy, oxide, salt, ore, matte, slag, ash, scrap, paste, compact, or finished part."
    source_ids:
      - un-cpc-3-structure-2025
  - rule_id: validation_rule_2
    applies_to: "Reference flow"
    rule: "The reference output shall equal 1 kg net dry accepted product and shall declare every required qualifier; the missing Tiangong reference-product UUID remains an explicit authoring gap."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "Route consistency"
    rule: "Exactly the declared formation route or routes shall be included; every included conditional process shall have its detailed inventory, and absent routes shall not contribute exchanges."
    source_ids:
      - neikov-nonferrous-powder-2014
      - uspto-us4884754-copper-flakes
  - rule_id: validation_rule_4
    applies_to: "Atomic inventory"
    rule: "Every row shall represent one product, waste, or elementary exchange; combined utilities, fuels, chemicals, wastes, or emissions are invalid."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "Internal intermediates"
    rule: "Atomized, reduced, electrolytic, or flake intermediates shall link route production to finishing exactly once and shall not be mistaken for additional final output."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "Copper balance"
    rule: "The contained-copper balance shall include feed, accepted output, exported material, waste, direct release, and inventory change; unresolved residuals shall be disclosed and investigated."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "Energy and direct emissions"
    rule: "Electricity shall be converted from retained kWh records to MJ; direct fossil CO2 shall include only foreground oxidation or combustion and shall exclude upstream electricity emissions."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "Solvent route"
    rule: "When heptane is used, fresh input, recovery, inventory change, waste transfer, and direct release shall be reconciled; an indoor-air heptane UUID shall not be used for an outdoor process vent."
    source_ids:
      - uspto-us4884754-copper-flakes
  - rule_id: validation_rule_9
    applies_to: "Evidence gaps"
    rule: "No external amount range may be published from a single case or search snippet; unresolved UUID and range-evidence needs in the manifest shall remain visible until exact identity or two-source evidence is reviewed."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset derived from a completed, reviewed foreground data package"
  downstream_use: "Process datasets for copper-powder or copper-flake supply in product systems and lifecycle models"
  allowed_use: "Use when product identity, route, geography, period, product specification, recycled-content treatment, upstream datasets, and allocation approach are representative of the study"
  excluded_use: "Do not use as a proxy for copper alloy powder, copper compounds, copper scrap, downstream powder consolidation or parts, or an undisclosed chemical or nano-functionalization route"
  required_metadata: "PCR id and version; route; site geography; production period; copper assay; morphology; particle-size distribution and method; apparent density if relevant; moisture and oxygen basis; surface treatment; reference-product UUID status; upstream dataset identities; allocation; cut-offs; packaging boundary"
  required_quality_disclosure: "Foreground coverage, meter and scale calibration, laboratory QA/QC, mass and copper balance residuals, solvent balance where applicable, conditional rows, data gaps, proxies, uncertainty, and unresolved UUID or range evidence"
  update_trigger: "Route or equipment change; feed or product specification change; material change in energy, gas, water, solvent, yield, waste, or direct release; new exact Tiangong flow; new two-source quantitative evidence; or elapsed review period defined by the publisher"
