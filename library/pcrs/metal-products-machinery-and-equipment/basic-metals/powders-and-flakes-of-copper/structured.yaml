system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "Foreground process boundary"
      rule: "Include the selected powder-formation route, its route-specific washing or atmosphere control, drying or annealing, particle-size conditioning, pollution control, and final packing through accepted product at the producer gate."
      source_ids:
        - neikov-nonferrous-powder-2014
        - uspto-us4884754-copper-flakes
    - rule_id: boundary_rule_2
      applies_to: "Conditional routes"
      rule: "Include atomization only when liquid copper is atomized; oxide reduction only when copper oxide is reduced; electrolysis only when a powder deposit is produced; and flake milling only when a copper-powder precursor is mechanically converted to flakes."
      source_ids:
        - neikov-nonferrous-powder-2014
        - uspto-us4884754-copper-flakes
    - rule_id: boundary_rule_3
      applies_to: "Direct burdens"
      rule: "Include direct energy use, process gases, make-up water, chemicals, solvent, wastes, wastewater, and measured or calculated direct releases. Do not assign upstream electricity or purchased-material emissions as foreground elementary flows."
      source_ids: []
    - rule_id: boundary_rule_4
      applies_to: "Excluded downstream operations"
      rule: "Exclude powder compaction, sintering, paste formulation, coating application, additive manufacturing, finished-part manufacture, use, and end-of-life unless a separate declared study expands the boundary."
      source_ids:
        - uspto-us4884754-copper-flakes
    - rule_id: boundary_rule_5
      applies_to: "Same-category recursion"
      rule: "A purchased or transferred copper-powder precursor is one product input with an upstream dataset; the same unit process shall not be counted again through recursive category tracing."
      source_ids: []
