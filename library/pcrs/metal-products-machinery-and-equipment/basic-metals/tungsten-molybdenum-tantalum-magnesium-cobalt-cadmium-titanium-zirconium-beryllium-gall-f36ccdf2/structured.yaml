measurement_rules:
  - id: reference_dry_mass
    applies_to: "reference product and mass-normalized inventory"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report saleable product on a dry-mass basis. When weighed as received, retain gross mass and measured moisture and calculate dry mass as gross mass multiplied by one minus the moisture mass fraction."
  - id: gas_reference_conditions
    applies_to: "natural gas, industrial oxygen and unresolved hydrogen rows"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Record gas volume with temperature, absolute pressure and dry/wet basis. Convert all gas records to the single reference condition declared by the dataset; do not combine volumes at different conditions."
  - id: electricity_energy_conversion
    applies_to: "purchased electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve metered electrical energy and convert kWh to MJ using 1 kWh = 3.6 MJ. Declare voltage level, grid geography, on-site generation and loss boundary."
  - id: material_assay_basis
    applies_to: "tungsten concentrate, tungsten trioxide, residue and powder"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain both total material mass and measured tungsten mass fraction. Never substitute contained-tungsten mass for total flow mass without an explicit conversion record."
