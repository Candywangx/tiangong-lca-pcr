system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary starts when tungsten concentrate or another explicitly declared metallurgical feed is received at the conversion facility. For the representative route it includes alkaline digestion or leaching, solid-liquid separation, purification and precipitation/calcination to tungsten trioxide, hydrogen reduction, powder finishing, on-site air-emission control and wastewater or residue generation up to dry saleable tungsten powder at the facility gate. Upstream production and delivery of concentrate, electricity, fuels, gases, chemicals and water shall be represented by linked datasets. Treatment after a waste crosses the foreground boundary is linked as downstream treatment and is not silently absorbed."
      source_ids: []
    - rule_id: boundary_route_specificity
      applies_to: "every foreground dataset"
      rule: "Include only unit operations actually used for the declared product and route, and disclose excluded route stages; do not import tungsten-route exchanges into another covered metal."
      source_ids:
        - jrc-nfm-bref-2017
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased feeds and utilities"
      rule: "Represent production and delivery of each purchased feed, electricity, fuel, industrial gas, chemical and water input with an upstream dataset."
      source_ids:
        - jrc-nfm-bref-2017
    - rule_id: boundary_direct_releases
      applies_to: "foreground emissions and wastes"
      rule: "Record direct air releases, waterborne releases and each waste leaving the controlled process as separate atomic exchanges before downstream treatment."
      source_ids:
        - jrc-nfm-bref-2017
boundary_abstraction:
  declared_starting_condition: "Received metallurgical feed at facility gate, with exact material identity, primary/secondary status, origin, total mass, moisture, target-metal grade and impurity profile declared"
  starting_condition_role: "Upstream product input to the foreground conversion route"
  product_classification_scope: "CPC 41601 context restricted to the exact covered product and market state declared by the dataset"
  recursive_input_rule: "A same-category product used as feed is recorded as a separate product input with its own upstream dataset; do not recursively include its production in the current foreground process or net it against output"
  upstream_dataset_requirement: "Link geographically and technologically representative datasets for each received feed, electricity supply, fuel, gas, chemical and water input"
  disclosure: "Disclose product identity, route, feed origin and grade, primary/secondary share, process ownership, cut-offs, recycled-content accounting, allocation, abatement, wastewater and residue destinations"
