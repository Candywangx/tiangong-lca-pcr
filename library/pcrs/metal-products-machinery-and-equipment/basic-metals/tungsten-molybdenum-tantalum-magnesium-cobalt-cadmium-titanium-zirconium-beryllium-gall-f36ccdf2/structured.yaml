allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "multi-output foreground operations"
    rule: "Avoid allocation by subdividing independently metered unit operations and by preserving internal intermediate transfers."
    source_ids:
      - jrc-nfm-bref-2017
  - rule_id: allocation_recovery_loop
    applies_to: "recycled process material returned within the same reporting system"
    rule: "Treat an internal recovery loop as an internal transfer; count only make-up input and net waste or product crossing the foreground boundary."
    source_ids: []
  - rule_id: allocation_joint_products
    applies_to: "jointly produced saleable metals or cobalt intermediates"
    rule: "If subdivision is not possible, apply a documented physical relation based on measured recoverable metal mass when it reflects causality; otherwise use economic allocation with the price period, currency and sensitivity disclosed. Do not credit a waste unless it leaves as a documented product with a market function."
    source_ids:
      - jrc-nfm-bref-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_hydromet_batch
      process_id: "tungsten_hydrometallurgy"
      flow_role: "each listed feed, utility, intermediate and waste exchange"
      record_type: "batch ledger, weigh ticket, meter, laboratory assay and waste manifest"
      raw_fields: "timestamp; batch_id; flow identity; supplier or destination; gross mass or meter reading; moisture; tungsten grade; concentration; meter start/end; density; unit"
      collection_method: "reconcile purchase/issue records and calibrated meters to batch production and laboratory assays"
      unit: "kg, m3, MJ, mass fraction"
      frequency: "each batch with monthly reconciliation"
      temporal_coverage: "at least 12 consecutive representative months or all batches for a shorter campaign"
      site_scope: "all foreground hydrometallurgical units under operational control"
      aggregation_rule: "sum by atomic flow and normalize to dry tungsten trioxide transfer; document shared-meter allocation"
      quality_evidence: "meter calibration; weigh tickets; certificates of analysis; laboratory QA/QC; stock reconciliation; waste manifests"
    - protocol_id: cp_reduction_batch
      process_id: "tungsten_powder_reduction"
      flow_role: "each listed feed, energy, gas, product and direct-emission exchange"
      record_type: "furnace batch sheet, gas and electricity meter, product lot record and fuel-carbon record"
      raw_fields: "timestamp; batch_id; flow identity; meter start/end; gas temperature and pressure; gross mass; moisture; product acceptance; carbon content; unit"
      collection_method: "reconcile furnace charges, gas and energy meters, accepted product lots and direct-emission calculation inputs"
      unit: "kg, m3, MJ, mass fraction"
      frequency: "each furnace batch with monthly reconciliation"
      temporal_coverage: "at least 12 consecutive representative months or all batches for a shorter campaign"
      site_scope: "all reduction and finishing units under operational control"
      aggregation_rule: "sum by atomic flow and normalize to dry accepted powder; document shared-meter allocation and rejected lots"
      quality_evidence: "calibrated meters; batch sheets; product certificates; moisture and oxygen tests; fuel certificates; mass and carbon balance closure"
  calculation_rules:
    - id: calc_dry_mass
      applies_to: "concentrate, tungsten trioxide, residue and powder"
      rule: "dry mass = as-received mass × (1 − moisture mass fraction)"
      inputs:
        - "as-received mass"
        - "measured moisture fraction"
      output: "kg dry material"
      source_ids: []
    - id: calc_flow_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = reporting-period atomic-flow amount ÷ reporting-period dry accepted tungsten-powder mass"
      inputs:
        - "reconciled flow amount"
        - "dry accepted product mass"
      output: "amount per kg reference flow"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity records"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calc_gas_reference_volume
      applies_to: "hydrogen, natural gas and oxygen records"
      rule: "convert measured gas volume to the dataset-declared temperature, absolute pressure and wet/dry basis and retain the conversion inputs"
      inputs:
        - "measured volume"
        - temperature
        - "absolute pressure"
        - "moisture basis"
        - "compressibility method"
      output: "m3 at declared reference condition"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "on-site natural-gas combustion"
      rule: "derive fossil CO2 from metered fuel and the verified site fuel-carbon balance; reconcile carbon in fuel, exported streams and unoxidized residues"
      inputs:
        - "natural-gas quantity"
        - "fuel carbon data"
        - "exported carbon"
        - "residual carbon"
      output: "kg fossil CO2"
      source_ids:
        - jrc-nfm-bref-2017
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and all product inputs"
      requirement: "Confirm exact chemical identity, market state, purity or grade, moisture basis, primary/secondary status and supplier or internal origin."
      evidence: "product specification; certificate of analysis; supplier declaration; Tiangong direct-read identity where UUID-bearing"
    - id: dq_route
      applies_to: "foreground process map"
      requirement: "Declare every included unit operation and reconcile the process map to equipment, batch and meter records; a non-tungsten dataset must replace the representative route and flows."
      evidence: "process flow diagram; equipment list; batch routing; meter map"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one consistent reporting period and explain shutdowns, start-ups, maintenance and non-representative campaigns."
      evidence: "dated records; production calendar; exception log"
    - id: dq_completeness
      applies_to: "mass, tungsten and carbon balances"
      requirement: "Report balance closure, missing-meter estimates and cut-offs; investigate material gaps that could hide residues, wastewater or emissions."
      evidence: "signed reconciliation; uncertainty record; corrective-action log"
    - id: dq_uuid
      applies_to: "UUID-empty rows"
      requirement: "Preserve the exact atomic name and do not substitute a proxy UUID until a public state-100 exact flow is directly verified."
      evidence: "finalized hybrid-search receipt and future direct-read review"
validation_rules:
  - rule_id: validate_reference_product
    applies_to: "reference flow"
    rule: "Confirm that the reference output is dry saleable Tungsten Powder with the stated UUID, Mass property and kg unit, or that a non-tungsten covered dataset has explicitly replaced it with an exact product identity and has not retained the tungsten UUID."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_atomic_inventory
    applies_to: "all inventory rows"
    rule: "Confirm that every row is one physical, chemical, waste, energy or elementary exchange and that route-inapplicable rows are explicitly marked not applicable rather than merged or silently omitted."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "each reporting period"
    rule: "Reconcile total material, tungsten and—when fossil fuel is burned—carbon balances across inputs, products, internal transfers, wastes and direct emissions; disclose closure and unresolved loss."
    source_ids:
      - jrc-nfm-bref-2017
  - rule_id: validate_gas_basis
    applies_to: "hydrogen, natural gas and oxygen"
    rule: "Confirm one declared gas reference condition and verify every volume conversion from retained temperature, pressure and moisture-basis data."
