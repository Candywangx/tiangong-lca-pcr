      - worldsteel-lci-methodology
  - rule_id: alloc_recovered_coproducts
    applies_to: "useful slag, process gases, recovered chemicals, and other co-products"
    rule: "When a recovered co-product displaces an external function, apply transparent system expansion consistent with the selected steel LCI method and report the substituted product, amount, substitution ratio, and sensitivity; do not apply an undocumented credit."
    source_ids:
      - worldsteel-lci-methodology
  - rule_id: alloc_residual_multioutput
    applies_to: "inseparable residual multi-output operation"
    rule: "If subdivision and justified system expansion are not feasible, select a physical relationship that reflects the causal production process; otherwise use another justified relationship and disclose the method, factors, affected flows, and sensitivity."
    source_ids:
      - iso-20915-2018
  - rule_id: alloc_scrap_transparency
    applies_to: "internal, pre-consumer, and post-consumer ferrous scrap"
    rule: "Distinguish internal returns from purchased pre-consumer and post-consumer scrap. Report any end-of-life recycling burden or credit separately from the cradle-to-gate result and prevent double counting with downstream models."
    source_ids:
      - worldsteel-lci-methodology
      - iso-20915-2018
dataset_production:
  collection_protocols:
    - protocol_id: cp_steelmaking_casting_records
      process_id: "steelmaking_and_casting"
      flow_role: "all input, output, residue, and direct-emission rows"
      record_type: "weighbridge, batch/heat, meter, laboratory, emissions-monitoring, and disposition records"
      raw_fields: "heat_id; route; charge and alloy quantities; utility meter values; cast output; composition; residue type/mass/destination; emission substance/value/method"
      collection_method: "reconcile production, purchasing, meter, laboratory, and environmental records to heat/cast campaigns"
      unit: "source units, normalized to kg reference product"
      frequency: "each heat/batch or continuous meter; monthly reconciliation"
      temporal_coverage: "representative reporting year; shorter period of at least six months requires justification"
      site_scope: "all included steelmaking, casting, ancillary, recovery, and treatment units"
      aggregation_rule: "sum by route and grade family, reconcile mass, then divide by conforming saleable mass linked downstream"
      quality_evidence: "calibrated instruments; invoices; laboratory certificates; meter coverage; environmental calculation protocol; reconciliation sign-off"
    - protocol_id: cp_hot_rolling_records
      process_id: "hot_rolling_and_surface_preparation"
      flow_role: "substrate, operating inputs, prepared hot band, and residues"
      record_type: "coil/slab tracking, furnace and utility meters, chemical issue, water, weighbridge, and waste records"
      raw_fields: "heat_id; slab_id; input_mass; fuel; electricity; water; chemical; hot_band_mass; scale; trim; reject; residue_destination"
      collection_method: "link slab/hot-band identifiers through reheating, rolling, descaling, pickling, and transfer"
      unit: "source units, normalized to kg prepared hot band and reference product"
      frequency: "each coil/campaign; monthly reconciliation"
      temporal_coverage: "representative reporting year; shorter period requires justification"
      site_scope: "all included hot-rolling and surface-preparation lines"
      aggregation_rule: "sum matched inputs/outputs by route and divide by conforming output mass"
      quality_evidence: "calibrated scales/meters; coil genealogy; material balance; waste transfer records"
    - protocol_id: cp_cold_processing_records
      process_id: "cold_rolling_and_annealing"
      flow_role: "substrate, operating inputs, cold-processed output, residues, and emissions"
      record_type: "coil genealogy, rolling/annealing logs, utility meters, process-gas and chemical issues, quality tests, and environmental records"
      raw_fields: "coil_id; orientation_class; grade; input/output_mass; pass_sequence; anneal/decarburize route; electricity; fuel; gas; water; lubricant; chemical; residue; emission"
      collection_method: "link every cold-reduction and heat-treatment campaign to conforming product and monitored releases"
      unit: "source units, normalized to kg cold-processed output and reference product"
      frequency: "each coil/campaign; continuous meters with monthly reconciliation"
      temporal_coverage: "representative reporting year; route-specific campaigns shall cover normal operation"
      site_scope: "all included cold mills, annealing/decarburization, cleaning, and treatment units"
      aggregation_rule: "aggregate separately by GOES/NOES, supply condition, and materially distinct route before any weighted mix"
      quality_evidence: "coil traceability; calibrated meters; laboratory/magnetic test records; treatment records; mass balance"
    - protocol_id: cp_finishing_dispatch_records
      process_id: "electrical_steel_finishing"
      flow_role: "finishing substrate, coating/domain-refining/packaging inputs, reference product, residues, and emissions"
      record_type: "coil/sheet tracking, coating and furnace records, domain-refining logs, quality certificates, scales, meters, packaging and waste records"
      raw_fields: "coil_id; grade/specification; thickness; width; orientation_class; supply_condition; coating_type/mass; domain_refined; magnetic_test_basis/result; input_mass; saleable_mass; utility/consumable; reject/residue/destination"
      collection_method: "reconcile final operations and acceptance tests to invoiced saleable mass at the declared gate"
      unit: "source units, normalized to kg saleable reference product"
      frequency: "each coil/lot; monthly reconciliation"
      temporal_coverage: "representative reporting year and all declared product families"
      site_scope: "all included final annealing, coating, domain refinement, inspection, slitting, packaging, and dispatch operations"
      aggregation_rule: "sum accepted saleable mass and linked burdens by qualified product family; production-mass-weight only compatible families"
      quality_evidence: "calibrated scales/meters; coating and magnetic test certificates; batch genealogy; invoice and dispatch reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every included inventory row"
      rule: "normalized amount = amount assigned to included production / net saleable reference-product mass at the declared gate"
      inputs:
        - "assigned foreground amount"
        - "saleable mass using the section 4 convention"
      output: "amount per 1 kg reference product"
      source_ids:
        - worldsteel-lci-methodology
    - id: calc_production_weighted_mix
      applies_to: "multi-route, multi-site, or multi-grade-family dataset"
      rule: "mixed amount = sum(amount_i × saleable_mass_i) / sum(saleable_mass_i); retain each component and weight"
      inputs:
        - "route/site/product-family results and net saleable masses"
      output: "production-mass-weighted result with disclosed coverage"
      source_ids:
        - worldsteel-lci-methodology
    - id: calc_process_mass_balance
      applies_to: "each foreground process and linked chain"
      rule: "reconcile identified mass inputs = product + co-product + waste + emission outputs + documented stock change; investigate rather than force-close material gaps"
      inputs:
        - "measured material inputs/outputs"
        - emissions
        - "and opening/closing stocks"
      output: "process mass-balance statement and unresolved difference"
      source_ids:
        - worldsteel-lci-methodology
    - id: calc_coating_mass
      applies_to: "coated product"
      rule: "integral coating mass shall be measured or calculated from verified coated area and coating mass per area, and the result shall use the same convention as reference product mass"
      inputs:
        - "coated area"
        - "coating mass per area or direct mass measurement"
        - "saleable product mass"
      output: "coating mass and coating mass fraction"
      source_ids:
        - iec-60404-8-4-2022
        - iec-60404-8-7-2020
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain grade/specification, orientation class, supply condition, dimensions, coating, magnetic-test basis, and acceptance certificate linked to each represented product family."
      evidence: "coil/lot genealogy and conformity or inspection certificate; iec-60404-8-4-2022; iec-60404-8-7-2020"
    - id: dq_route_coverage
      applies_to: "process chain"
      requirement: "Demonstrate that each applicable steelmaking, casting, rolling, annealing, texture-control, coating, recovery, utility, and treatment step is included or explicitly outside the foreground gate with an upstream dataset."
      evidence: "route diagram, process list, supplier-gate records, and worldsteel-lci-methodology"
    - id: dq_temporal_geographic
      applies_to: "foreground and upstream data"
      requirement: "Prefer one representative year of site data; justify shorter periods of at least six months and use geography- and technology-representative energy and material datasets."
      evidence: "reporting-period reconciliation and dataset metadata; worldsteel-lci-methodology"
    - id: dq_meter_and_allocation
      applies_to: "shared utilities and multi-output processes"
      requirement: "Document meter coverage, calibration, subdivision, allocation or substitution factors, and sensitivity for material shared burdens."
      evidence: "calibration records, meter map, calculation workbook, and allocation evidence"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Account for known material, energy, water, emissions, wastes, co-products, ancillary utilities, internal transport, and treatment flows; document cut-offs and unresolved mass-balance differences."
      evidence: "completeness checklist, environmental reports, mass balance, and worldsteel-lci-methodology"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "Require product flow 8863bbb7-7bc4-4ff1-ab21-4a01addf2ad4, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, reference unit kg, and a normalized amount of 1."
    source_ids:
      - worldsteel-lci-methodology
  - rule_id: val_required_qualifiers
    applies_to: "dataset metadata and reference product"
    rule: "Fail completeness when any required qualifier in section 3 is absent, internally inconsistent, or not tied to the represented production mass."
    source_ids:
      - iec-60404-8-4-2022
      - iec-60404-8-7-2020
  - rule_id: val_boundary_route
    applies_to: "process inventory"
    rule: "Require every route-applicable process in section 6 or a documented replacement/purchased-input gate; reject silent omission of grade-specific annealing, texture control, coating, or domain refinement."
    source_ids:
      - ec-fmp-bref-2022
      - doe-grid-supply-chain-2022
      - mehdi-et-al-2024
  - rule_id: val_mass_and_yield
    applies_to: "each process and full chain"
    rule: "Require input/output/stock-change reconciliation, a documented disposition for trim, scale, scrap, rejects, coating residues, and sludge, and an explanation for unresolved differences."
    source_ids:
      - worldsteel-lci-methodology
  - rule_id: val_route_aggregation
    applies_to: "mixed dataset"
    rule: "Require explicit production-mass weights and separate component results for materially different steelmaking routes, GOES/NOES families, semi-/fully processed states, and finishing routes."
    source_ids:
      - worldsteel-lci-methodology
  - rule_id: val_allocation_recycling
    applies_to: "co-products and scrap"
    rule: "Require the selected allocation/system-expansion method, substitution facts, scrap categories, and end-of-life burden or credit to be disclosed; reject double counting between the cradle-to-gate result and downstream recycling."
    source_ids:
      - iso-20915-2018
      - worldsteel-lci-methodology
  - rule_id: val_data_period_quality
    applies_to: "foreground package"
    rule: "Require reporting-period coverage, site scope, meter/calibration evidence, product genealogy, source-unit retention, conversion records, and disclosure of data gaps and estimates."
    source_ids:
      - worldsteel-lci-methodology
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset representing cradle-to-gate production of a declared flat-rolled silicon-electrical steel product family"
  downstream_use: "LCA process and lifecycle-model inputs for transformers, motors, generators, magnetic components, electrical equipment, and material supply chains when the required product and route qualifiers match"
  allowed_use: "Mass-based cradle-to-gate inventory, supplier or production-mix modelling, hotspot analysis, and downstream product studies with compatible geography, time, grade, supply condition, and allocation conventions"
  excluded_use: "Direct comparative claims between electrical-steel grades or routes without equivalent function, magnetic performance, system boundary, data quality, and critical review; use as a dataset for fabricated laminations, cores, or complete equipment without added downstream processes"
  required_metadata: "PCR id and version; product flow UUID; grade/specification; GOES/NOES class; semi-/fully processed condition; dimensions; coating and domain-refined status; magnetic test basis; steelmaking/casting/rolling/annealing route; site/geography; reporting period; factory gate; upstream dataset identities; allocation and recycling method; net saleable production mass"
  required_quality_disclosure: "Primary-data share; meter and coil/heat genealogy coverage; temporal and geographic representativeness; mass-balance status; product-family and route weights; cut-offs; estimates; allocation/substitution factors; upstream data age; review status"
  update_trigger: "Material change in grade or supply scope, production route, purchased-substrate share, annealing/coating/domain-refining technology, site or energy mix, allocation/recycling method, source standards, or representative data period; otherwise review at least when the site dataset exceeds the selected data-age policy"
