measurement_rules:
  - id: reference_product_mass
    applies_to: "reference product and all normalized inventory results"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use measured net saleable product mass. Include an integral insulation or surface coating supplied on the electrical steel; exclude pallets, reels, and reusable transport equipment and disclose any non-reusable packaging reported separately."
  - id: mass_conversion
    applies_to: "source records reported in tonnes or megagrams"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert 1 t or 1 Mg to 1,000 kg before normalization and retain the original unit and conversion record."
  - id: magnetic_quality_not_mass_conversion
    applies_to: "grade-specific magnetic declarations"
    required_property_ref:
      name: "declared test result and test condition"
      uuid: ""
    required_unit: "declared source unit"
    rule: "Magnetic loss, induction, permeability, frequency, and polarization or field strength are required product qualifiers and quality evidence; they shall not be converted into or used as a substitute for reference mass."
  - id: coating_mass_consistency
