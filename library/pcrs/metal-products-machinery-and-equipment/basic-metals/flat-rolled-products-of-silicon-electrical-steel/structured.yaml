    role: "Foreground production of composition-controlled semi-finished electrical steel"
    quantitative_reference: "kg cast slab, strip, or hot band leaving the process"
  - id: hot_rolling_and_surface_preparation
    name: "Hot rolling and surface preparation"
    inclusion: "conditional"
    inclusion_condition: "Required for conventional slab or hot-band routes; a direct or thin-strip route shall document the replaced operation."
    role: "Thickness reduction, scale removal, and hot-band preparation"
    quantitative_reference: "kg prepared hot band leaving the process"
  - id: cold_rolling_and_annealing
    name: "Cold rolling, decarburization, and annealing"
    inclusion: "conditional"
    inclusion_condition: "Required when used for the declared GOES/NOES grade or supply condition; omitted only with a documented alternative route or a product sold before these steps."
    role: "Gauge reduction and magnetic microstructure development"
    quantitative_reference: "kg cold-rolled or annealed electrical steel leaving the process"
  - id: electrical_steel_finishing
    name: "Grade-specific finishing, coating, inspection, and dispatch"
    inclusion: "required"
    inclusion_condition: "Always required; non-applicable coating or domain-refining operations are declared as absent rather than silently omitted."
    role: "Establish the declared market state and reference output"
    quantitative_reference: "1 kg saleable reference product"
