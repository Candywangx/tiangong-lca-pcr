allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "separable routes, lines, and products"
    rule: "Avoid allocation by using route-, line-, process-, and product-specific meters and mass balances and by subdividing independently measured operations before assigning shared burdens."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_internal_recycling
    applies_to: "home scrap, mill scale, process gases, water, and other internal loops"
    rule: "Model internal transfers once as an output from the producing process and an input to the receiving process; use the net site balance and do not claim an external recycling credit or external recycled-content input for internally recirculated material."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_coproducts
    applies_to: "co-products with a verified external function and market demand"
    rule: "Prefer system expansion or substitution using the documented equivalent external function; if this cannot be applied, use a justified physical relationship and disclose the rationale and sensitivity to alternatives."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_shared_hot_rolling
    applies_to: "shared reheating, rolling, utilities, and finishing"
    rule: "After subdivision, assign directly metered burdens to the relevant product; allocate only the residual shared burden using a documented physical relationship that reflects the process, with product mass used only when products receive equivalent processing and no better relation is available."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_scrap_reporting
    applies_to: "external scrap input and future recycling scenarios"
    rule: "Report external pre-consumer and post-consumer scrap input separately from home scrap; if an end-of-life recycling method is applied downstream, disclose it separately from cradle-to-gate results and prevent double counting."
    source_ids:
      - worldsteel-lci-methodology-2017
      - aisc-steel-construction-pcr-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_product_identity_and_output
      process_id: "p_hot_rolling_p_pickling_p_finishing_dispatch"
      flow_role: "product identity and output"
      record_type: "production, laboratory, inspection, and dispatch records"
      raw_fields: "grade/specification; heat/batch; width; thickness; coil/plate; surface state; edge condition; pickling; oiling; coating status; gross mass; packaging mass; net product mass"
      collection_method: "Reconcile certified scales, production execution records, inspection certificates, and dispatch records."
      unit: "kg; mm"
      frequency: "per batch and shipment; monthly reconciliation"
      temporal_coverage: "normally 12 consecutive months"
      site_scope: "each included rolling, pickling, and finishing line"
      aggregation_rule: "Sum conforming net output by declared product state; keep off-grade, rework, and scrap separate."
      quality_evidence: "scale calibration, inspection certificate, batch genealogy, and dispatch reconciliation"
    - protocol_id: cp_route_and_slab_supply
      process_id: "p_slab_supply_p_hot_rolling"
      flow_role: "route, recycled input, and slab supply"
      record_type: "purchasing, melt-shop, casting, supplier, and transfer records"
      raw_fields: "steelmaking route; casting route; slab grade; slab mass; supplier; external pre-consumer scrap; external post-consumer scrap; home scrap; DRI/HBI; hot metal; upstream dataset id"
      collection_method: "Reconcile receipts, stock changes, melt-shop charge sheets, casting records, internal transfers, and supplier declarations."
      unit: "kg; % by mass"
      frequency: "per heat or batch; monthly reconciliation"
      temporal_coverage: "normally 12 consecutive months"
      site_scope: "all sites and suppliers feeding included output"
      aggregation_rule: "Attribute slab and charge records by traceable heat/batch or documented production-weighted route mix."
      quality_evidence: "weighbridge and inventory reconciliation, charge sheets, supplier evidence, and route-share calculation"
    - protocol_id: cp_energy_and_fuels
      process_id: "p_slab_supply_p_hot_rolling_p_pickling"
      flow_role: "purchased and internally transferred energy"
      record_type: "meters, invoices, fuel analyses, and gas-balance records"
      raw_fields: "electricity; fuel quantity; steam; oxygen; process-gas generation and use; net calorific value; meter hierarchy; allocation driver"
      collection_method: "Read calibrated meters and invoices and reconcile internal gas and steam transfers to the site energy balance."
      unit: "kWh; MJ; kg; m3"
      frequency: "continuous or per batch; monthly close"
      temporal_coverage: "normally 12 consecutive months"
      site_scope: "each included process and shared utility"
      aggregation_rule: "Sum measured use; assign direct meters first and allocate residual shared use with the declared physical driver."
      quality_evidence: "calibration records, invoices, fuel certificates, and energy-balance closure"
    - protocol_id: cp_water_balance
      process_id: "p_hot_rolling_p_pickling"
      flow_role: "withdrawal, make-up, recirculation, and discharge"
      record_type: "flow meters, water treatment logs, and discharge records"
      raw_fields: "source; withdrawal; make-up; recirculation; evaporation; blowdown; discharge; destination"
      collection_method: "Reconcile calibrated source, process-loop, and final-discharge meters."
      unit: "m3"
      frequency: "continuous or daily; monthly close"
      temporal_coverage: "normally 12 consecutive months"
      site_scope: "each included water circuit and final discharge point"
      aggregation_rule: "Report gross withdrawal, make-up, recirculation, and final discharge separately; allocate shared loops by measured make-up or another documented physical driver."
      quality_evidence: "meter calibration, water-balance closure, and treatment/discharge logs"
    - protocol_id: cp_materials_and_packaging
      process_id: "p_hot_rolling_p_finishing_dispatch"
      flow_role: "rolling consumables and dispatch packaging"
      record_type: "purchasing, stores, issue, and stock records"
      raw_fields: "material identity; opening stock; receipts; closing stock; issued quantity; return; product assignment"
      collection_method: "Use stock-adjusted consumption and shipment-specific packaging records where available."
      unit: "kg"
      frequency: "per issue or shipment; monthly close"
      temporal_coverage: "normally 12 consecutive months"
      site_scope: "each included process and dispatch operation"
      aggregation_rule: "Opening stock plus receipts minus closing stock and documented returns, assigned first by direct issue."
      quality_evidence: "inventory reconciliation, issue ticket, and packaging specification"
    - protocol_id: cp_pickling_operation
      process_id: "p_pickling"
      flow_role: "pickling materials, recovery, energy, water, and wastes"
      record_type: "bath analysis, meters, production logs, acid regeneration, waste, and treatment records"
      raw_fields: "acid type/concentration; inhibitor; rinse water; energy; oil; input mass; output mass; spent acid; regenerated acid; sludge; wastewater; emission monitoring"
      collection_method: "Reconcile bath additions and withdrawals, meters, line production, acid recovery, and waste manifests."
      unit: "kg; m3; kWh; MJ"
      frequency: "per batch or continuous line; monthly close"
      temporal_coverage: "normally 12 consecutive months"
      site_scope: "every included pickling and acid-recovery line"
      aggregation_rule: "Normalize only to pickled output and preserve regenerated acid as an internal loop or verified external recovery."
      quality_evidence: "bath laboratory results, meter calibration, mass balance, and waste manifests"
    - protocol_id: cp_mass_outputs_and_waste
      process_id: "p_slab_supply_p_hot_rolling_p_finishing_dispatch"
      flow_role: "product, scrap, scale, sludge, and waste destinations"
      record_type: "scales, production logs, transfer tickets, and waste manifests"
      raw_fields: "input mass; product mass; crop scrap; cobbles; mill scale; sludge; off-grade; rework; waste mass; recovery/treatment destination"
      collection_method: "Reconcile process and site mass balances with calibrated scales and verified transfer records."
      unit: "kg"
      frequency: "per batch where available; monthly close"
      temporal_coverage: "normally 12 consecutive months"
      site_scope: "each included process and treatment boundary"
      aggregation_rule: "Keep internal return, external recovery, treatment, disposal, and stock change separate; investigate unexplained imbalance."
      quality_evidence: "scale calibration, transfer ticket, waste manifest, and signed balance review"
    - protocol_id: cp_coproducts_and_recovery
      process_id: "p_slab_supply_p_hot_rolling_p_finishing_dispatch"
      flow_role: "co-products and recovered materials"
      record_type: "scales, sales/transfer records, specifications, and destination evidence"
      raw_fields: "material; mass; quality; internal use; external use; destination; market demand; substituted function; allocation method"
      collection_method: "Verify net export after internal reuse and retain evidence of the receiving function or treatment."
      unit: "kg; MJ"
      frequency: "per transfer; monthly close"
      temporal_coverage: "normally 12 consecutive months"
      site_scope: "site boundary and each receiving route"
      aggregation_rule: "Net internal transfers before reporting export; keep each material and destination separate."
      quality_evidence: "weighbridge record, specification, contract or transfer evidence, and allocation review"
    - protocol_id: cp_direct_emissions
      process_id: "p_slab_supply_p_hot_rolling_p_pickling"
      flow_role: "direct releases to air and water"
      record_type: "continuous monitors, periodic tests, wastewater analyses, and flow meters"
      raw_fields: "substance; compartment; concentration; flow; operating time; test method; detection limit; treatment status"
      collection_method: "Use applicable continuous or periodic monitoring and calculate mass release from documented concentration and flow data."
      unit: "kg; mg/Nm3; mg/L; Nm3; m3"
      frequency: "continuous or permit-defined periodic frequency"
      temporal_coverage: "same production period as activity data"
      site_scope: "every included emission point and final discharge point"
      aggregation_rule: "Integrate or multiply matched concentration and flow over the operating period; retain non-detect treatment and uncertainty."
      quality_evidence: "calibration, accredited test report, laboratory result, and calculation trace"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory amount"
      rule: "normalized amount = attributable amount × 1,000 kg / conforming net dispatched product mass"
      inputs:
        - "attributable flow amount"
        - "conforming net dispatched product mass"
      output: "amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_net_product_mass
      applies_to: "dispatch output"
      rule: "net product mass = certified shipped gross mass minus separately weighed or documented packaging mass"
      inputs:
        - "gross shipped mass"
        - "packaging mass"
      output: "kg net qualifying product"
      source_ids: []
    - id: calc_hot_rolling_yield
      applies_to: "hot rolling and finishing"
      rule: "yield = conforming net product mass / qualifying slab input mass; report crop scrap, cobbles, scale, off-grade, rework, and stock change separately"
      inputs:
        - "slab input"
        - "conforming product"
        - scrap
        - scale
        - off-grade
        - rework
        - "stock change"
      output: "mass-balance and yield disclosure"
      source_ids:
        - eu-jrc-fmp-bref-2022
    - id: calc_recycled_input
      applies_to: "steel route disclosure"
      rule: "external recycled-input share = (external pre-consumer scrap + external post-consumer scrap) / total metallic charge × 100; report home scrap separately and state any alternative governing method"
      inputs:
        - "external pre-consumer scrap"
        - "external post-consumer scrap"
        - "total metallic charge"
        - "home scrap"
      output: "% by mass and category disclosure"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_energy_conversion
      applies_to: "fuels and process gases"
      rule: "energy = measured mass or standard volume × documented net calorific value; reconcile internal generation and consumption once"
      inputs:
        - "fuel or gas quantity"
        - "net calorific value"
        - "internal transfer balance"
      output: "MJ attributable energy"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_direct_release
      applies_to: "monitored emissions"
      rule: "mass release = matched concentration × normalized dry or wet gas flow, or concentration × water discharge volume, with unit conversion and operating time documented"
      inputs:
        - concentration
        - "flow or discharge volume"
        - "operating time"
        - "measurement basis"
      output: "kg substance released"
      source_ids:
        - eu-jrc-fmp-bref-2022
  data_quality_requirements:
    - id: dq_identity
      applies_to: "final product and all production lots"
      requirement: "Demonstrate non-alloy grade, finished width at least 600 mm, hot-rolled-only state, coil or sheet/plate delivery, surface state, and absence of coating; segregate nonconforming products."
      evidence: "specifications, inspection certificates, and batch genealogy"
    - id: dq_route
      applies_to: "steel and slab supply"
      requirement: "Identify steelmaking and casting route, geography, supplier or site, external pre-consumer and post-consumer scrap, and home scrap; do not use an unexplained production mix."
      evidence: "charge sheets, route records, supplier declarations, and production-weighted calculation"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Use a representative period normally covering 12 consecutive months; data older than five years or a shorter period require a documented representativeness justification."
      evidence: "reporting-period register and deviation justification"
    - id: dq_measurement
      applies_to: "material, energy, water, and emissions"
      requirement: "Prefer measured data, then calculated data; identify estimates explicitly and retain meter, scale, laboratory, conversion-factor, and calculation evidence."
      evidence: "calibration, invoices, laboratory reports, and calculation trace"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Cover all required and triggered conditional processes and reconcile input, product, co-product, recovered material, waste, stock change, and direct-emission records; document exclusions and cut-offs."
      evidence: "signed completeness checklist and mass/energy/water balances"
    - id: dq_upstream
      applies_to: "purchased slab and other significant upstream inputs"
      requirement: "Use representative upstream datasets for geography, time, technology, route, and recycled-input basis; document every proxy and sensitivity relevant to the study goal."
      evidence: "dataset metadata, supplier evidence, and proxy register"
    - id: dq_reproducibility
      applies_to: "complete foreground package"
      requirement: "Preserve sufficient raw-field definitions, aggregation logic, allocation decisions, and source links for an independent practitioner with authorized access to reproduce the normalized inventory."
      evidence: "data dictionary, calculation workbook or script, and review record"
validation_rules:
  - rule_id: validate_product_identity
    applies_to: "reference product"
    rule: "Fail conformance if the grade is stainless or other alloy steel, width is below 600 mm, the product is cold-rolled or further fabricated, or any cladding, plating, galvanizing, paint, polymer, metallic, or other coating is present."
    source_ids:
      - unsd-cpc-3-2025
      - unsd-hs-7208
  - rule_id: validate_reference_flow
    applies_to: "reference flow and output"
    rule: "Require exactly 1,000 kg net qualifying product per reference flow, Mass as the quantitative property, packaging outside net product mass, and all required qualifiers; coil may use the selected UUID, while plate or sheet requires a verified state-matching flow."
    source_ids:
      - worldsteel-hrc-eco-profile-2022
  - rule_id: validate_route_and_scrap
    applies_to: "route disclosure"
    rule: "Require a declared steelmaking and casting route, external pre-consumer and post-consumer scrap values, separately reported home scrap, route shares for a mix, and the recycled-content method and denominator."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_process_coverage
    applies_to: "process map"
    rule: "Require p_hot_rolling and p_finishing_dispatch; require either foreground p_slab_supply or a linked representative upstream slab dataset; require p_pickling exactly when dispatched product state is pickled or pickled-and-oiled."
    source_ids:
      - eu-jrc-fmp-bref-2022
      - worldsteel-lci-methodology-2017
  - rule_id: validate_surface_boundary
    applies_to: "surface state"
    rule: "Reject a dataset that declares pickled product but omits pickling burdens, or as-rolled product but includes unassigned pickling; reject coating burdens and downstream fabrication within this PCR result."
    source_ids:
      - unsd-hs-7208
      - eu-jrc-fmp-bref-2022
  - rule_id: validate_balances
    applies_to: "mass, energy, and water"
    rule: "Require reconciled product and process mass balances, one-time accounting of internal energy and material loops, and separate water withdrawal, recirculation, and discharge; investigate and disclose unexplained imbalance."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_allocation
    applies_to: "shared burdens, co-products, and recovery"
    rule: "Require subdivision before allocation, a documented physical driver for residual shared burdens, disclosed co-product treatment, net internal-recycling accounting, and no double counting of scrap or future recycling credits."
    source_ids:
      - worldsteel-lci-methodology-2017
      - aisc-steel-construction-pcr-2025
  - rule_id: validate_data_quality
    applies_to: "foreground package"
    rule: "Require the declared period, site and supplier coverage, calibration and laboratory evidence, upstream dataset metadata, proxy register, and reproducible calculation trail; report deviations rather than silently filling missing values."
    source_ids:
      - worldsteel-lci-methodology-2017
published_dataset_profile:
  dataset_role: "Foreground production data package for a hot-rolled non-alloy steel mill product; may be published as a secondary_dataset or background_dataset after review."
  downstream_use: "Supports product, process, and lifecyclemodel construction for electrical equipment, photovoltaic support systems, buildings, and manufacturing where the declared grade, dimensions, delivery form, surface state, geography, period, and route are compatible."
  allowed_use: "Cradle-to-gate steel product modelling or gate-to-gate hot-rolling modelling with a linked upstream slab dataset; product-footprint and EPD work when the governing programme rules and additional life-cycle modules are applied separately."
  excluded_use: "Cold-rolled, stainless, alloy, coated, narrow-width, or fabricated steel products; direct comparison of products with different functions or incompatible boundaries; legal compliance claims; use of a coil identity for plate without verification."
  required_metadata: "PCR id; CPC context; product-flow, flow-property, and unit-group UUIDs; grade/specification; thickness; width; coil or sheet/plate; surface and edge state; pickling and oiling; coating absence; steelmaking and casting route; route shares; recycled-input categories; slab source; geography; sites; production period; boundary; allocation; upstream datasets; packaging."
  required_quality_disclosure: "Foreground versus upstream data; meter and scale coverage; 12-month representativeness or deviation; route and supplier coverage; mass, energy, and water reconciliation; measured/calculated/estimated shares; proxy use; cut-offs; co-product and recycling method; unresolved UUIDs; review status."
  update_trigger: "Change in steel grade boundary, width or delivery state, steelmaking/casting route or route shares, external scrap basis, slab supplier, pickling or oiling, coating status, process technology, energy or water system, allocation or recycling method, geography, production period, or a newly verified reference-flow/unit-group identity."
