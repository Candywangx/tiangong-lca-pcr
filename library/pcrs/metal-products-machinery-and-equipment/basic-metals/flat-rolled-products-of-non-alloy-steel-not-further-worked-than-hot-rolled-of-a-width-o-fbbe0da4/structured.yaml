  classification_refs: "CPC 3.0:41211 (exact classification scope; accepted mapping is governed separately)"
  covered_products: "Uncoated flat-rolled iron or non-alloy steel, width at least 600 mm, in coil, sheet, or plate form, not further worked than hot-rolled; as-rolled or pickled surface state"
  excluded_products: "Cold-rolled steel; stainless or other alloy steel; width below 600 mm; clad, plated, galvanized, painted, polymer-coated, or otherwise coated products; downstream fabricated components"
  representative_product: "Production-mix hot-rolled non-alloy steel coil at the steelworks gate; plate or sheet delivery remains in scope when its delivery form is declared and a matching product-flow identity is used"
  production_route: "Declare BF-BOF, scrap-EAF, DRI-EAF, another reviewed route, or purchased-slab hot rolling; identify continuous or ingot casting where material and do not aggregate routes without a documented production-weighted basis"
  market_state: "Net product ready for dispatch at the steelworks gate, as coil or cut sheet/plate, with grade, thickness, width, surface state, edge condition, and pickling/oiling status declared"
functional_unit:
  what: "Provision at the steelworks gate of flat-rolled non-alloy steel, width at least 600 mm, not further worked than hot-rolled"
  how_much: "1 metric tonne (1,000 kg) net product mass, excluding packaging"
  how_well: "Conforms to the declared steel grade and dimensional specification; delivery form, surface state, production route, recycled-input categories, and pickling/coating boundary are declared"
  how_long_or_cycle: "One identified production campaign or a production-weighted period normally covering 12 consecutive months"
  reference_flow_link: "ref_hot_rolled_non_alloy_steel"
system_boundary:
  rules:
    - rule_id: boundary_scope_basis
      applies_to: "declared foreground system"
      rule: "A cradle-to-gate package shall include raw-material and energy supply, steelmaking and casting, hot rolling, on-site ancillary services, wastewater and waste treatment, and dispatch preparation; a gate-to-gate package may start with purchased slab only when the upstream slab dataset and boundary are linked and disclosed."
      source_ids:
        - worldsteel-lci-methodology-2017
    - rule_id: boundary_hot_rolling_core
      applies_to: "hot-rolling foreground"
      rule: "Include input storage and handling, applicable surface conditioning, reheating, descaling, roughing and width reduction, rolling to final dimensions and properties, cooling, coiling for strip, cutting for sheet or plate, trimming, roll-shop burdens, internal transport, utilities, direct emissions, water circuits, and waste management."
      source_ids:
        - eu-jrc-fmp-bref-2022
        - worldsteel-lci-methodology-2017
    - rule_id: boundary_pickling_state
      applies_to: "pickled or oiled delivery"
      rule: "Include pickling, rinsing, acid recovery or neutralisation, associated energy and water, effluent and sludge treatment, direct emissions, and temporary oiling only when the dispatched product is declared pickled or pickled-and-oiled; otherwise exclude these operations."
      source_ids:
        - eu-jrc-fmp-bref-2022
        - worldsteel-hrc-eco-profile-2022
    - rule_id: boundary_product_exclusions
      applies_to: "product eligibility"
      rule: "Exclude cold rolling, stainless or other alloy steel, width below 600 mm, cladding, plating, galvanizing, painting, polymer or other coating, and downstream slitting below the category width, forming, machining, welding, assembly, or component fabrication."
      source_ids:
        - unsd-cpc-3-2025
        - unsd-hs-7208
        - aisc-steel-construction-pcr-2025
    - rule_id: boundary_route_separation
      applies_to: "route and product mix"
      rule: "Keep BF-BOF, scrap-EAF, DRI-EAF, and purchased-slab routes separate unless a production-weighted mix is required and the weighting period, product equivalence, geography, and route shares are documented."
      source_ids:
        - worldsteel-lci-methodology-2017
        - worldsteel-hrc-eco-profile-2022
    - rule_id: boundary_packaging
      applies_to: "dispatch preparation"
      rule: "Include packaging that accompanies the product to the gate as a separate inventory input while keeping it outside the net reference-product mass."
      source_ids:
        - worldsteel-lci-study-2021
boundary_abstraction:
  declared_starting_condition: "Declare whether the foreground starts with integrated raw-material and steelmaking operations or with purchased continuously cast or ingot-cast non-alloy steel slab; identify slab grade, route, supplier geography, recycled-input basis, and upstream dataset."
  starting_condition_role: "The starting condition prevents an undefined mixture of cradle-to-gate steel production and gate-to-gate hot rolling."
  product_classification_scope: "CPC 3.0:41211, restricted to uncoated non-alloy flat products at least 600 mm wide and not further worked than hot-rolled."
  recursive_input_rule: "A purchased product already in this PCR category remains a visible product input with a separate upstream dataset; do not recursively reapply this PCR or relabel it as unprocessed slab."
  upstream_dataset_requirement: "Every purchased slab, hot metal, DRI, or same-category steel input requires a geographically, temporally, technologically, and recycled-input-representative upstream dataset or an explicit documented proxy."
  disclosure: "State cradle-to-gate or gate-to-gate scope, steelmaking route, casting route, product form, grade, dimensions, surface state, pickling and oiling, coating exclusion, recycled-input categories, co-product treatment, packaging, geography, and production period."
