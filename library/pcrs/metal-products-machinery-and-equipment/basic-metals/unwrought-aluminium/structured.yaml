allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared_casting_operations"
    rule: "Subdivide or meter operations by product grade, cast form, production line, or campaign before applying allocation."
    source_ids: []
  - rule_id: allocation_internal_returns
    applies_to: "internal_metal_returns"
    rule: "Treat internally returned liquid metal and recovered in-process metal as internal loops; do not assign them an external co-product credit or count them again as new liquid-metal input."
    source_ids: []
  - rule_id: allocation_shared_mass
    applies_to: "inseparable_shared_operations"
    rule: "When subdivision is not feasible, allocate shared foreground inputs, direct emissions, and wastes among conforming unwrought products by measured net product mass; disclose the products, period, quantities, and allocation result."
    source_ids: []
  - rule_id: allocation_exported_recovery
    applies_to: "exported_dross_or_residues"
    rule: "Keep exported dross or residues as waste outputs and document the selected downstream recovery or disposal model; do not apply an avoided-burden credit inside this foreground process unless the study goal explicitly requires and discloses a separate consequential scenario."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_casting_material_balance
      process_id: "unwrought_casting"
      flow_role: "liquid metal, conforming output, dross, stock change, internal returns"
      record_type: "weighbridge, batch, inventory, and quality-release records"
      raw_fields: "input mass; output mass; dross mass; return mass; opening and closing stock; alloy or purity; cast form; accepted and rejected mass"
      collection_method: "calibrated weighing reconciled to batch and accounting-period stock"
      unit: "kg"
      frequency: "each batch, aggregated monthly and annually"
      temporal_coverage: "representative consecutive 12-month period or declared campaign"
      site_scope: "all included holding and casting lines"
      aggregation_rule: "sum by grade and route, reconcile stock change, then normalize to conforming output"
      quality_evidence: "calibration certificates; batch tickets; inventory reconciliation; quality-release records"
    - protocol_id: cp_casting_electricity
      process_id: "unwrought_casting"
      flow_role: "electricity"
      record_type: "utility and submeter records"
      raw_fields: "meter id; opening and closing reading; import; export; allocation key; downtime"
      collection_method: "calibrated meter reading"
      unit: "kWh"
      frequency: "continuous or monthly"
      temporal_coverage: "same period as product output"
      site_scope: "all included equipment and common utilities"
      aggregation_rule: "net imports minus documented exports, allocated after subdivision, then normalized"
      quality_evidence: "invoices; meter calibration; submeter coverage map"
    - protocol_id: cp_casting_fuel_gases
      process_id: "unwrought_casting"
      flow_role: "natural gas and industrial oxygen"
      record_type: "supplier invoice and calibrated meter records"
      raw_fields: "separate gas volumes; temperature; pressure; moisture basis; meter id; equipment; operating hours"
      collection_method: "separate calibrated meters or reconciled supplier records"
      unit: "m3"
      frequency: "batch or monthly"
      temporal_coverage: "same period as product output"
      site_scope: "all included fuel-fired equipment"
      aggregation_rule: "convert each gas separately to declared reference conditions and normalize"
      quality_evidence: "invoices; calibration; reference-condition calculation; equipment log"
    - protocol_id: cp_casting_water
      process_id: "unwrought_casting"
      flow_role: "process water"
      record_type: "intake and discharge meter records"
      raw_fields: "intake mass or volume; discharge; recirculation; source; use; density conversion"
      collection_method: "calibrated metering and water-balance reconciliation"
      unit: "kg"
      frequency: "monthly"
      temporal_coverage: "same period as product output"
      site_scope: "all included cooling and process-water users"
      aggregation_rule: "calculate net boundary input, exclude internal recirculation, then normalize"
      quality_evidence: "meter calibration; water balance; density and conversion record"
    - protocol_id: cp_casting_combustion_emissions
      process_id: "unwrought_casting"
      flow_role: "direct fossil carbon dioxide"
      record_type: "fuel records, supplier analysis, stack measurement, or approved factor record"
      raw_fields: "fuel amount; carbon content; oxidation factor; measured CO2; method version"
      collection_method: "direct measurement or calculation from foreground fuel records"
      unit: "kg CO2"
      frequency: "batch or monthly"
      temporal_coverage: "same period as product output"
      site_scope: "all included combustion sources"
      aggregation_rule: "sum source-level direct emissions and normalize; exclude upstream supply emissions"
      quality_evidence: "measurement QA record or approved factor, supplier analysis, and calculation worksheet"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "every inventory exchange"
      rule: "normalized quantity = accounting-period exchange quantity × 1,000 kg / accounting-period net conforming product mass"
      inputs:
        - "exchange quantity"
        - "net conforming output mass"
      output: "exchange quantity per 1,000 kg reference product"
      source_ids: []
    - id: calc_casting_mass_balance
      applies_to: "aluminium-bearing material balance"
      rule: "liquid aluminium input + opening aluminium stock = conforming output + exported aluminium dross + rejected output + closing aluminium stock, after separately reporting documented internal returns"
      inputs:
        - "all aluminium-bearing masses and stock changes"
      output: "reconciled casting-period mass balance and unexplained difference"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "cast_fossil_carbon_dioxide"
      rule: "use direct measured CO2 where valid; otherwise sum fuel quantity × documented carbon-content factor × oxidation factor × 44/12 for each fossil fuel source"
      inputs:
        - "foreground fuel quantities"
        - "facility-approved factors"
      output: "direct fossil CO2 mass"
      source_ids:
        - us-epa-ap42-primary-aluminium-1998
        - us-epa-ap42-secondary-aluminium-1986
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Declare alloy or purity, cast form, product specification, acceptance criteria, and excluded off-spec mass."
      evidence: "product specification; laboratory certificate; release record"
    - id: dq_route_identity
      applies_to: "liquid aluminium input"
      requirement: "Declare primary, secondary, and mixed shares and link each share to a product-state-, geography-, technology-, and time-representative upstream dataset."
      evidence: "supplier declaration; mass-balance record; upstream dataset metadata"
    - id: dq_measurement
      applies_to: "all foreground quantities"
      requirement: "Use calibrated meters or reconciled records and retain conversions, allocation keys, stock adjustments, and uncertainty or data-gap treatment."
      evidence: "calibration and reconciliation records; calculation worksheet"
    - id: dq_temporal
      applies_to: "foreground dataset"
      requirement: "Use a representative consecutive 12-month period unless a shorter campaign is justified and disclosed; align all exchange and product totals to the same period."
      evidence: "production calendar; coverage statement; campaign justification"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Include every actual atomic exchange crossing the boundary; reconcile aluminium mass and explain omitted, estimated, or below-detection exchanges."
      evidence: "completeness review; mass balance; omission log"
    - id: dq_direct_upstream_split
      applies_to: "emissions and upstream datasets"
      requirement: "Keep direct foreground emissions separate from upstream electricity, fuel, liquid-metal, water, and material burdens."
      evidence: "process boundary diagram; exchange mapping; dataset links"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "Confirm that the output is a solid unwrought cast primary form and that its alloy or purity, form, specification, and net mass are declared."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_reference_amount
    applies_to: "reference_flow"
    rule: "Confirm that all exchanges are normalized to exactly 1,000 kg net conforming output and that rejected or dross mass is excluded from the reference amount."
    source_ids: []
  - rule_id: validate_route_linkage
    applies_to: "liquid_metal_input"
    rule: "Reject a dataset that leaves liquid aluminium burden-free or omits primary, secondary, and mixed shares and their upstream dataset links."
    source_ids:
      - iai-lifecycle
  - rule_id: validate_atomic_inventory
    applies_to: "process_inventory"
    rule: "Confirm that electricity, each fuel gas, oxygen, water, each waste, and each direct elementary emission are represented as separate atomic exchanges when applicable."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "aluminium_balance"
    rule: "Require a reconciled accounting-period aluminium mass balance and disclosure of the unexplained difference."
    source_ids: []
  - rule_id: validate_gas_conditions
    applies_to: "gas_inputs"
    rule: "Confirm that natural-gas and oxygen volumes use separately declared reference conditions and are not combined."
    source_ids: []
  - rule_id: validate_direct_emissions
    applies_to: "direct_emissions"
    rule: "Confirm that cast_fossil_carbon_dioxide contains only direct foreground fossil CO2 and excludes upstream electricity and supply-chain emissions."
    source_ids:
      - us-epa-ap42-primary-aluminium-1998
      - us-epa-ap42-secondary-aluminium-1986
  - rule_id: validate_unresolved_identities
    applies_to: "uuid_references"
    rule: "Before review or publication, resolve or explicitly review every UUID-empty inventory row and confirm the exact product state, flow type, property, and unit group."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after review and publication"
  downstream_use: "Attributional foreground data packages, process datasets, and lifecycle models requiring unwrought aluminium at the casting-facility gate"
  allowed_use: "Use when product grade, cast form, liquid-metal route shares, technology, geography, time, system boundary, and data quality match the study"
  excluded_use: "Do not use for alumina, liquid aluminium sold without casting, semi-finished or fabricated aluminium, or an upstream route represented as burden-free"
  required_metadata: "canonical PCR id; product grade and form; reference mass; facility and geography; reference period; primary, secondary, and mixed shares; linked upstream datasets; casting technology; allocation; cut-offs; review status"
  required_quality_disclosure: "measurement coverage and calibration; material-balance closure; meter allocation; data gaps and estimates; route-share evidence; direct-versus-upstream emission split; unresolved identities"
  update_trigger: "Change in liquid-metal route mix, alloy or cast form, furnace or casting technology, energy supply, facility boundary, allocation, upstream dataset, geography, or representative period"
