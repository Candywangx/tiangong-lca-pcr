system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground system includes liquid-metal receipt, holding, optional alloy adjustment or furnace treatment, casting or continuous casting into an unwrought primary form, cooling, dross removal, and internal handling through the product gate. Facility utilities and directly generated emissions and wastes are included when they cross the boundary. The verified source material describes transfer of primary aluminium to holding furnaces and casting, and secondary aluminium melting, refining, skimming, and pouring."
      source_ids: []
    - rule_id: boundary_liquid_metal_start
      applies_to: "foreground_start"
      rule: "Begin the foreground inventory at route-specific liquid aluminium entering the holding or casting operation; do not represent liquid aluminium as burden-free."
      source_ids:
        - us-epa-ap42-primary-aluminium-1998
        - us-epa-ap42-secondary-aluminium-1986
    - rule_id: boundary_actual_operations
      applies_to: "included_operations"
      rule: "Include each on-site holding, treatment, casting, cooling, dross-handling, and utility operation actually used; disclose omitted listed operations as not applicable."
      source_ids:
        - us-epa-ap42-primary-aluminium-1998
        - us-epa-ap42-secondary-aluminium-1986
        - eu-jrc-nfm-bref-2016
    - rule_id: boundary_upstream_linkage
      applies_to: "upstream_inputs"
      rule: "Link the liquid-metal input and all purchased energy and materials to upstream datasets that match product state, production route, geography, technology, and reference year."
      source_ids:
        - iai-lifecycle
    - rule_id: boundary_direct_emissions
      applies_to: "direct_emissions"
      rule: "Record only direct emissions from foreground operations; keep upstream electricity and material emissions in their linked upstream datasets."
