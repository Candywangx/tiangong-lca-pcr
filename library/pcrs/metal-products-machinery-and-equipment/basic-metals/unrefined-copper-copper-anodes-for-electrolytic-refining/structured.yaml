      unit: "kg"
      frequency: "each tap or transfer"
      temporal_coverage: "full reporting period"
      site_scope: "furnace and gas controls"
      aggregation_rule: "Sum each output; retain internal returns; normalize"
      quality_evidence: "calibration; assay; transfer ticket; manifest"
    - protocol_id: cp_direct_air_emissions
