      - us-epa-ap42-primary-copper-smelting-1986
  - rule_id: allocation_external_recovery
    applies_to: "residues leaving for external recovery"
    rule: "Model the residue transfer explicitly. Apply no substitution credit unless the governing study method requires one; disclose later system expansion outside this inventory."
    source_ids: []
  - rule_id: allocation_multiple_products
    applies_to: "unavoidable joint production of marketed products"
    rule: "First use a documented physical causal relation. If none can be demonstrated, use net revenue at the gate and disclose prices, currency, period, and sensitivity; never allocate internal transfers as products."
    source_ids: []
