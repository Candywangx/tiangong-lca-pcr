        - ec-jrc-nfm-bref-2017
    - rule_id: boundary_electrorefining_exclusion
      applies_to: "downstream boundary"
      rule: "End at net conforming product at the producer gate; exclude electrolytic refining, cathode production, semi-fabrication, downstream transport, use, and end-of-life."
