  calculation_rules:
    - id: calc_normalization
      applies_to: "all inventory rows"
      rule: "reported amount = period exchange / period net conforming product mass × 1,000 kg"
      inputs:
        - exchange
        - "net product mass"
      output: "amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "fr_electricity; ac_electricity"
      rule: "electricity MJ = metered kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "MJ"
      source_ids: []
    - id: calc_casting_output
      applies_to: "ac_anode_copper"
      rule: "net conforming mass = gross cast mass - off-spec mass - closing work-in-process increase + opening work-in-process decrease"
      inputs:
        - "gross cast"
        - "rejected mass"
        - "inventory change"
      output: "net conforming anode mass"
      source_ids: []
    - id: calc_copper_reconciliation
      applies_to: "both processes"
      rule: "input copper = output copper + copper in residues + inventory change + quantified unaccounted difference"
      inputs:
        - masses
        - assays
        - inventory
      output: "closure and unaccounted difference"
      source_ids:
        - ec-jrc-nfm-bref-2017
    - id: calc_water_balance
      applies_to: "casting cooling"
      rule: "boundary input = wastewater + evaporation + carry-out + inventory change + quantified unaccounted difference"
      inputs:
        - make-up
        - discharge
        - evaporation
        - carry-out
        - inventory
      output: "water-balance closure"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "copper-bearing flows"
      requirement: "Declare physical state, assay, impurities, source or destination, return status, and exact identity; do not use the conforming-anode UUID for blister copper or off-spec anodes."
      evidence: "assays; master data; batch and transfer records"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Cover at least 95% of operating days and reconcile all exchange records for the full period; disclose exclusions."
      evidence: "coverage matrix; missing-data log; reconciliations"
    - id: dq_measurement
      applies_to: "measured amounts"
      requirement: "Use calibrated meters or scales and retain calibration, detection limits, and reference conditions."
      evidence: "certificates; instrument register; laboratory QA"
    - id: dq_temporal
      applies_to: "all records"
      requirement: "Use one reporting period, normally 12 consecutive months or a justified representative campaign including material start-up and shutdown effects."
      evidence: "calendar; campaign justification; operating log"
    - id: dq_geography_technology
      applies_to: "external inputs and background links"
      requirement: "Match geography, voltage, fuel state, oxygen boundary, water source, furnace, and controls or disclose limitations."
      evidence: "supplier data; technology description; dataset metadata"
    - id: dq_uncertainty
      applies_to: "calculated and allocated amounts"
      requirement: "Document raw-data and allocation uncertainty and mass-balance closure; do not replace foreground data with unresolved external ranges."
      evidence: "uncertainty worksheet; sensitivity; review sign-off"
