      unit: "kg"
      frequency: "continuous or campaign"
      temporal_coverage: "representative campaigns and full-period operations"
      site_scope: "all attributable sources"
      aggregation_rule: "Integrate by source, exclude overlap, normalize"
      quality_evidence: "calibration; method report; detection limit; uncertainty"
    - protocol_id: cp_casting_mass
      process_id: "anode_casting"
