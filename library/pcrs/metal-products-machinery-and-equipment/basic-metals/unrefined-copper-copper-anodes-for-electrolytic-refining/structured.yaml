allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "independently measurable operations"
    rule: "Avoid allocation by separately metering fire refining, off-gas treatment, and casting and assigning direct exchanges to the process that causes them."
    source_ids: []
  - rule_id: allocation_internal_recycling
    applies_to: "slag, dust, fire-refined copper, and off-spec anodes returned within the site"
    rule: "Treat internal returns as internal transfers without upstream burden credit, avoided-product credit, or double counting; retain mass in the process balance."
    source_ids:
