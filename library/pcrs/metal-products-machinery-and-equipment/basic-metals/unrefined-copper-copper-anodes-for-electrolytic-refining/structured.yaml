      unit: "m3"
      frequency: "batch or continuous"
      temporal_coverage: "full reporting period"
      site_scope: "furnace and gas system"
      aggregation_rule: "Sum each gas separately and normalize"
      quality_evidence: "calibration; gas certificate; operating log"
    - protocol_id: cp_electricity
      process_id: "fire_refining"
      flow_role: "electricity"
      record_type: "meter records"
      raw_fields: "timestamp; meter; process; kWh; voltage; geography; shared-load allocation"
      collection_method: "Read submeters; document shared-load allocation"
