validation_rules:
  - rule_id: validate_reference_quantity
    applies_to: "reference product"
    rule: "Normalized net saleable output must equal 1,000 kg with Mass and kg."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "reference-flow metadata"
    rule: "Fail completeness when grade, form, dimensions, route and charge shares, casting route, recycled-input accounting, geography, period or conditioning state is absent."
    source_ids:
      - unsd-cpc-3.0-2025
  - rule_id: validate_route_processes
    applies_to: "process map and inventory"
    rule: "Require primary steelmaking, secondary metallurgy and casting; require iron-unit production only when on-site and reject undeclared route exchanges."
    source_ids:
      - eu-jrc-iron-steel-bref-2013
      - ipcc-2006-metal-industry
  - rule_id: validate_internal_transfers
    applies_to: "internal transfers"
    rule: "Producing and consuming quantities, identities and periods must match before cancellation."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_direct_co2
    applies_to: "fossil CO2 rows"
    rule: "Reconcile calculated and measured CO2 and demonstrate that combustion and process emissions are not double counted."
    source_ids:
      - ipcc-2006-metal-industry
  - rule_id: validate_mass_balance
    applies_to: "process and package totals"
    rule: "Report each signed residual and investigate rather than assign unexplained residuals to product."
    source_ids:
      - eu-jrc-iron-steel-bref-2013
  - rule_id: validate_coproduct_claims
    applies_to: "exported co-products"
    rule: "Permit avoided-burden claims only with documented use, functional equivalence, substituted product, quantity and sensitivity."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_uuid_status
    applies_to: "reference and inventory flows"
    rule: "Before activation, directly verify every UUID as public state 100 with matching names, type, classification, property, unit group, state, geography, technology and comment; keep unresolved rows explicit."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "Background or supplier-specific modelling of alloy-steel ingots and cast semi-finished alloy-steel products before downstream rolling or forming"
  allowed_use: "Declared or compatible grade, primary form, route, geography, period, gate boundary and conditioning state; aggregate only with production-weighted shares."
  excluded_use: "Non-alloy steel; ferro-alloy production; rolled, forged, drawn, extruded, coated or finished steel; undisclosed averages; use or end-of-life claims; unharmonized comparisons."
  required_metadata: "PCR id and version; grade or composition; form and dimensions; route and charge shares; casting route; site and geography; period; recycled-input method; conditioning; upstream datasets; co-product and waste treatment; owner and review status"
  required_quality_disclosure: "Primary-data coverage; meter and assay quality; representativeness; mass-balance residuals; unresolved UUIDs; proxies; allocation; exclusions and gaps"
  update_trigger: "Change in grade family, form, route or charge shares, casting technology, site boundary, major energy source, co-product treatment, period, or availability of verified UUID and independent range evidence"
