allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "route processes and metered utilities"
    rule: "Avoid allocation by subdividing separately measured processes; attribute shared utilities with documented causal meter, operating-time or energy balances."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_internal_recycling
    applies_to: "returned scrap, dust, scale, slag and process gases"
    rule: "Record production and consumption at process boundaries, then cancel identical internal transfers; never claim external credit for material remaining inside the system."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_external_coproducts
    applies_to: "net exported slag, process gas or recovered material with demonstrated market use"
    rule: "Use system expansion only when actual use and a functionally equivalent displaced product are documented; disclose substitution and sensitivity."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_waste_status
    applies_to: "residues without demonstrated market demand or use"
    rule: "Model actual waste treatment or disposal; split quantities when one residue has both recovery and waste destinations."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_multiple_grades
    applies_to: "campaigns producing multiple saleable grades or forms"
    rule: "Prefer heat-specific subdivision; if shared burdens remain, allocate by net saleable mass and disclose affected processes, products and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_iron_unit_records
      process_id: "iron_unit_production"
      flow_role: "material, utility, intermediate, residue and direct-emission records"
      record_type: "scales; stock records; meters; assays; stack and process-gas records"
      raw_fields: "campaign; route; identity; mass; assay; gas conditions; energy; carbon; destination"
      collection_method: "Reconcile records to iron-unit output and linked steel heats."
      unit: "kg; m3; MJ"
      frequency: "per heat, shift or campaign; monthly reconciliation"
      temporal_coverage: "12 representative months or complete shorter campaign"
      site_scope: "all attributed on-site iron-unit operations"
      aggregation_rule: "Sum by route, subtract inventory change and normalize through linked heats."
      quality_evidence: "calibration; assays; signed balance; outage log"
    - protocol_id: cp_primary_steelmaking_records
      process_id: "primary_steelmaking"
      flow_role: "charge, utility, liquid steel, residue and direct-emission records"
      record_type: "heat sheets; weigh hoppers; meters; analysis; off-gas records"
      raw_fields: "heat; route; identity and origin; mass; gas; energy; tapped mass; chemistry; carbon; destination"
      collection_method: "Reconcile charge, tapped steel, residues and carbon per heat."
      unit: "kg; m3; MJ"
      frequency: "per heat; monthly reconciliation"
      temporal_coverage: "12 representative months or complete shorter campaign"
      site_scope: "all vessels and attributed auxiliaries"
      aggregation_rule: "Aggregate conforming heats by route and normalize to reference flow."
      quality_evidence: "calibrated equipment; complete heat sheets; laboratory and off-gas reconciliation"
    - protocol_id: cp_secondary_metallurgy_records
      process_id: "secondary_metallurgy"
      flow_role: "liquid steel, alloy, gas, energy, residue and direct-emission records"
      record_type: "heat sheets; issue records; scales; meters; chemistry"
      raw_fields: "heat; transfer mass; alloy identity and assay; addition; gas; energy; chemistry; temperature; destination"
      collection_method: "Link every addition and utility to the heat and reconcile transfer to casting."
      unit: "kg; m3; MJ"
      frequency: "per heat; monthly reconciliation"
      temporal_coverage: "12 representative months or complete shorter campaign"
      site_scope: "all refining units used for declared grade"
      aggregation_rule: "Sum heat-specific records and normalize to reference flow."
      quality_evidence: "certificates; calibration; chemistry; heat genealogy"
    - protocol_id: cp_casting_records
