system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground package covers material receipt and handling; any on-site iron-unit production claimed by the dataset; primary steelmaking; secondary metallurgy and alloy adjustment; casting and declared primary conditioning; attributed internal transport, energy and gas systems; water management; emission control; and treatment or recovery of residues generated before the steelworks gate. Purchased inputs require compatible upstream datasets and are not recreated as foreground processes unless physically produced inside the declared site boundary."
      source_ids: []
    - rule_id: boundary_cradle_to_gate
      applies_to: "foreground and linked upstream system"
      rule: "Include steelmaking and necessary on-site ancillary services through dispatch readiness, and link externally supplied materials, energy and consumables to upstream production and transport without double counting."
      source_ids:
        - worldsteel-lci-methodology-2017
    - rule_id: boundary_route_specificity
      applies_to: "BF-BOF, DRI and EAF routes"
      rule: "Model only declared route processes and charge shares; preserve route-specific direct emissions and intermediates."
      source_ids:
        - eu-jrc-iron-steel-bref-2013
        - ipcc-2006-metal-industry
    - rule_id: boundary_downstream_exclusion
      applies_to: "operations after primary casting"
      rule: "Exclude downstream rolling, forging, extrusion, drawing, coating and finished-product manufacture; identify included primary conditioning and its measured losses."
      source_ids:
        - unsd-cpc-3.0-2025
    - rule_id: boundary_internal_flows
      applies_to: "internal materials and process gases"
      rule: "Record production and consumption consistently, cancel identical internal transfers only in aggregation, and disclose net imports and exports."
      source_ids:
        - worldsteel-lci-methodology-2017
boundary_abstraction:
  declared_starting_condition: "Declare whether iron units enter as ore or pellets processed on-site, purchased hot metal, purchased DRI or HBI, or prepared ferrous scrap, and identify the first foreground custody point."
  starting_condition_role: "Prevent omission or double counting where integrated ironmaking, purchased intermediates and recycled metallic inputs meet steelmaking."
  product_classification_scope: "Alloy steel in solid ingot or other primary form and cast semi-finished alloy steel before rolling, forging, extrusion, drawing, coating or article manufacture."
  recursive_input_rule: "Record internally returned alloy-steel crop or reject once as output and once as input, then cancel in aggregation; externally purchased scrap uses an upstream dataset and is not the reference product."
  upstream_dataset_requirement: "Link every purchased ore, pellet, coke, DRI or HBI, hot metal, scrap, ferro-alloy, flux, deoxidizer, gas, fuel, electricity, water and mould consumable to a state-, geography- and technology-compatible upstream dataset."
  disclosure: "Disclose geography, period, grade or grade mix, delivery form, route and charge shares, casting route, recycled-content accounting, imported and exported process gases, purchased intermediates, co-product treatment, waste destinations and exclusions."
