allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "independently metered route processes"
    rule: "Avoid allocation by subdividing ironmaking, steelmaking, gas use, casting, and treatment operations wherever their inputs and outputs are separately measured."
    source_ids:
      - worldsteel-life-cycle-thinking
  - rule_id: allocation_coproducts
    applies_to: "exported slag, process gas, steam, heat, or electricity"
    rule: "Identify whether each output is a co-product or waste. Use system expansion for a functionally equivalent displaced product when the study program permits it; otherwise apply the program-required allocation method and disclose the factor and sensitivity."
    source_ids:
      - worldsteel-life-cycle-thinking
  - rule_id: allocation_internal_returns
    applies_to: "internally recycled steel, dust, scale, slag, process gas, water, and heat"
    rule: "Keep burdens within the foreground system and record the internal transfer consistently at both process boundaries; do not award an external avoided-product credit for an internal loop."
    source_ids:
      - worldsteel-life-cycle-thinking
dataset_production:
  collection_protocols:
    - protocol_id: cp_bf_bof_balance
      process_id: "bf_bof_route"
      flow_role: "every listed atomic input and output"
      record_type: "calibrated meters, weighbridge tickets, stock records, laboratory moisture tests, off-gas monitoring, and waste transfer records"
      raw_fields: "quantity; unit; wet_or_dry; moisture; gas_reference_state; source_or_destination; meter_id; timestamp; batch_id"
      collection_method: "reconcile purchase, stock-change, charge, transfer, monitoring, and dispatch records by campaign"
      unit: "native record unit plus normalized kg, m3, or MJ"
      frequency: "per heat or shift, aggregated monthly"
      temporal_coverage: "at least 12 consecutive representative months"
      site_scope: "all BF-BOF units supplying the declared product"
      aggregation_rule: "sum each atomic exchange separately, remove internal transfers from external totals, then normalize by net saleable output"
      quality_evidence: "calibration certificates, laboratory results, stock reconciliation, meter coverage, and signed mass-balance review"
    - protocol_id: cp_eaf_balance
      process_id: "eaf_route"
      flow_role: "every listed atomic input and output"
      record_type: "calibrated meters, weighbridge tickets, charge records, stock records, off-gas monitoring, and waste transfer records"
      raw_fields: "quantity; unit; scrap_grade; DRI_grade; gas_reference_state; source_or_destination; meter_id; timestamp; heat_id"
      collection_method: "reconcile purchase, stock-change, charge, transfer, monitoring, and dispatch records by heat and campaign"
      unit: "native record unit plus normalized kg, m3, or MJ"
      frequency: "per heat or shift, aggregated monthly"
      temporal_coverage: "at least 12 consecutive representative months"
      site_scope: "all EAF and ladle-metallurgy units supplying the declared product"
      aggregation_rule: "sum each atomic exchange separately, remove internal transfers from external totals, then normalize by net saleable output"
      quality_evidence: "calibration certificates, charge sheets, stock reconciliation, meter coverage, and signed mass-balance review"
    - protocol_id: cp_casting_balance
      process_id: "casting"
      flow_role: "every listed atomic input and output"
      record_type: "ladle and tundish weights, caster production reports, meters, stock records, quality release records, and waste transfer records"
      raw_fields: "quantity; unit; product_form; grade; dimensions; temperature_state; source_or_destination; meter_id; timestamp; campaign_id"
      collection_method: "reconcile molten-steel receipts, consumables, saleable product, returns, residues, and wastewater by campaign"
      unit: "native record unit plus normalized kg, m3, or MJ"
      frequency: "per heat or campaign, aggregated monthly"
      temporal_coverage: "at least 12 consecutive representative months"
      site_scope: "every casting line supplying the declared product"
      aggregation_rule: "sum each atomic exchange separately and normalize by net saleable product mass"
      quality_evidence: "scale calibration, product release records, yield reconciliation, meter coverage, and signed mass-balance review"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = campaign exchange quantity × 1,000 / campaign net saleable product mass"
      inputs:
        - "campaign exchange quantity"
        - "campaign net saleable product mass"
      output: "exchange amount per 1,000 kg reference product"
      source_ids:
        - "—"
    - id: calc_dry_mass
      applies_to: "wet ore, coke, dust, sludge, scale, or slag records"
      rule: "dry mass = wet mass × (1 - measured moisture mass fraction)"
      inputs:
        - "wet mass"
        - "measured moisture mass fraction"
      output: "dry mass in kg"
      source_ids:
        - "—"
    - id: calc_electricity_mj
      applies_to: "electricity records"
      rule: "electricity MJ = metered kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "electricity in MJ"
      source_ids:
        - "—"
    - id: calc_route_mix
      applies_to: "multi-route site average"
      rule: "combine only separately complete route inventories using each route's net saleable product mass share; retain route-specific results alongside the average"
      inputs:
        - "complete BF-BOF inventory"
        - "complete EAF inventory"
        - "route output masses"
      output: "disclosed site-average inventory"
      source_ids:
        - "—"
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain grade or chemistry, form, dimensions, temperature state, surface state, and release specification for every represented product family."
      evidence: "laboratory certificate, product release record, and product master data"
    - id: dq_route_identity
      applies_to: "process system"
      requirement: "Demonstrate the represented BF-BOF or EAF route and identify all supplying units and internal transfers."
      evidence: "process map, charge records, meter map, and site flow diagram"
    - id: dq_measurement
      applies_to: "measured exchanges"
      requirement: "Use calibrated instruments or reconciled stock records and state wet/dry and gas reference conditions."
      evidence: "calibration certificates, stock reconciliation, moisture tests, and gas conditions"
    - id: dq_temporal
      applies_to: "reporting period"
      requirement: "Cover at least 12 consecutive representative months or justify a shorter campaign and its seasonality, outages, and product-mix limitations."
      evidence: "dated production and maintenance records"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile product, metallic, carbon, water, and waste balances; document missing meters, estimates, and excluded minor inputs."
      evidence: "signed reconciliation and completeness register"
    - id: dq_upstream
      applies_to: "linked providers"
      requirement: "Match geography, technology, product state, and temporal representativeness for major upstream materials and energy."
      evidence: "provider metadata and representativeness review"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference product"
    rule: "Reject a package that omits the actual product form, non-alloy grade or chemistry basis, route, plant geography, or factory-gate state, or that relabels the representative slab UUID as another form."
    source_ids:
      - un-cpc-v3-structure-2025
  - rule_id: validation_route
    applies_to: "process map"
    rule: "Require at least one declared steelmaking route; require casting when the reference product is an ingot, billet, bloom, or slab; prohibit DRI, mould powder, or another conditional row when the declared route does not use it."
    source_ids:
      - eu-jrc-iron-steel-bref-2013
  - rule_id: validation_internal_links
    applies_to: "molten steel and internal returns"
    rule: "Require equal sending and receiving quantities and identical linking-flow identities after normalization; report any unmatched internal transfer."
    source_ids:
      - "—"
  - rule_id: validation_mass_balance
    applies_to: "metallic inputs and outputs"
    rule: "Reconcile metallic charge with saleable steel, internal returns, slag metal, dust, scale, and other measured losses; investigate and disclose every imbalance rather than forcing closure."
    source_ids:
      - "—"
  - rule_id: validation_coproducts
    applies_to: "slag and exported energy carriers"
    rule: "Require declared product-or-waste status, destination, allocation or substitution method, factor, and sensitivity where material."
    source_ids:
      - worldsteel-life-cycle-thinking
  - rule_id: validation_data_quality
    applies_to: "complete package"
    rule: "Require traceable raw records, temporal coverage, site coverage, calibration or reconciliation evidence, and explicit unresolved provider or UUID gaps."
    source_ids:
      - worldsteel-life-cycle-thinking
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset derived from a reviewed foreground steelworks package"
  downstream_use: "Product systems requiring non-alloy crude steel ingot, primary-form, billet, bloom, or slab inputs, with route and form compatibility checked"
  allowed_use: "Attributional cradle-to-gate modelling and route-specific supply-chain modelling where geography, technology, grade, product form, allocation, and recycled-content conventions are compatible"
  excluded_use: "Direct comparison of steel routes or materials without harmonized boundaries; substitution for alloy or stainless steel; substitution for downstream rolled or fabricated steel; undisclosed relabelling of the representative slab UUID"
  required_metadata: "Product form; grade or chemistry; dimensions; temperature and surface state; steelmaking and casting route; charge shares; site geography; technology; reference period; provider geography; co-product method; recycled-content convention; data-quality evidence"
  required_quality_disclosure: "Meter and stock-record coverage; wet/dry conversions; gas reference conditions; internal transfer reconciliation; metallic, carbon, water, and waste balances; missing data; estimates; unresolved UUIDs; upstream representativeness"
  update_trigger: "Material change in route, furnace, charge mix, product form, grade family, energy supply, co-product treatment, provider data, site coverage, or reference period"
