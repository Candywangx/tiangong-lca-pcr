system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The intended inventory is cradle-to-factory-gate. Foreground records cover steelworks-controlled operations for the declared route, while purchased materials, fuels, electricity, oxygen, and water retain linked upstream provider datasets. Downstream rolling and product fabrication are outside the boundary."
      source_ids: []
    - rule_id: sb_cradle_to_gate
      applies_to: "complete product system"
      rule: "Include upstream resource and energy provision through the producing steelworks factory gate; do not include downstream rolling or fabrication unless it occurs before the declared reference-product gate."
      source_ids:
        - worldsteel-life-cycle-thinking
    - rule_id: sb_route_operations
      applies_to: "foreground steelworks"
      rule: "Include the actual route operations among ironmaking, BF-BOF or EAF steelmaking, ladle metallurgy, slag handling, and ingot or continuous casting; disclose every omitted operation."
      source_ids:
        - eu-jrc-iron-steel-bref-2013
    - rule_id: sb_inventory_coverage
      applies_to: "foreground and linked upstream inventory"
      rule: "Record all measured material, non-mass energy, water, direct emission, by-product, and waste exchanges without substituting a route-average carrier bundle."
      source_ids:
        - worldsteel-life-cycle-thinking
boundary_abstraction:
