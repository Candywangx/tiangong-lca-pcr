system_boundary:
  rules:
    - rule_id: sb_gate_boundary
      applies_to: "foreground metal production"
      rule: "Include directly controlled feed preparation, recovery or extraction, refining, casting, route-integrated forming, internal recycling, pollution control and dispatch preparation from received feed to net conforming product; disclose every integrated or omitted stage."
      source_ids:
        - eu-jrc-nfm-bref-2017
    - rule_id: sb_upstream_inputs
      applies_to: "purchased inputs"
      rule: "Keep mining, mine-site beneficiation and production of purchased materials outside the foreground gate, but represent each purchased input with a suitable upstream dataset."
      source_ids:
        - eu-jrc-nfm-bref-2017
    - rule_id: sb_direct_emissions
      applies_to: "foreground releases"
      rule: "Record measured direct releases from handling, thermal or electrolytic recovery, refining, casting, product handling and abatement; do not substitute upstream electricity emissions for direct stack or fugitive releases."
      source_ids:
        - us-epa-ap42-ferroalloy
    - rule_id: sb_alternative_routes
      applies_to: "non-representative covered products"
      rule: "A route for antimony, manganese, chromium, a fabricated article, or eligible scrap is conforming only when the data package adds its concrete feed, reagent, energy, residue and direct-emission exchanges; the representative bismuth cards are not default values for another route."
      source_ids:
        - un-cpc-3-0-2025
        - us-epa-ap42-ferroalloy
    - rule_id: sb_recursive_inputs
      applies_to: "same-category inputs and internal returns"
      rule: "Record same-category materials crossing the facility gate once with their upstream dataset; keep internal returns as internal transfers and avoid a recursive product-category loop or double counting."
      source_ids:
        - eu-commission-pef-2021
