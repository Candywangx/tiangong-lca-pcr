allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "separately metered recovery, refining, forming and treatment operations"
    rule: "Subdivide the foreground system and assign directly measured inputs, outputs and emissions to the process that causes them before applying any allocation."
    source_ids:
      - eu-commission-pef-2021
  - rule_id: allocation_physical_relation
    applies_to: "unavoidable multi-output operations"
    rule: "If subdivision or system expansion is not feasible, use a demonstrated causal physical relationship, such as a process-specific recoverable-metal balance; document the relationship, data and sensitivity. Do not default automatically to gross mass or market value."
    source_ids:
      - eu-commission-pef-2021
  - rule_id: allocation_other_relation
    applies_to: "multi-output operations without a defensible physical relationship"
    rule: "If another relationship is required, disclose and justify it, preserve total assigned burdens, and report a sensitivity result for the principal alternative."
    source_ids:
      - eu-commission-pef-2021
  - rule_id: allocation_internal_returns
    applies_to: "internal scrap, dust, slag or metal returned within the foreground boundary"
    rule: "Treat an internal return as an internal transfer: do not create an avoided-product credit, new purchased input or co-product output for the same circulation."
    source_ids:
      - eu-commission-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_records
      process_id: "bismuth_recovery_refining"
      flow_role: "Bismuth-bearing feed, process chemicals and net product"
      record_type: "calibrated scales, tank receipts, stock records and laboratory certificates"
      raw_fields: "opening stock; receipts; transfers; closing stock; solution concentration; moisture; bismuth content; net product mass; grade"
      collection_method: "reconcile transaction records and calibrated measurements to one production period"
      unit: "kg"
      frequency: "each receipt or batch, aggregated monthly"
      temporal_coverage: "full declared reporting period"
      site_scope: "all included process areas and storage"
      aggregation_rule: "opening stock + receipts - closing stock - documented transfers, normalized by net conforming output"
      quality_evidence: "calibration certificates, invoices, stock reconciliation and laboratory certificates"
    - protocol_id: cp_gas_volume_records
      process_id: "bismuth_recovery_refining"
      flow_role: "Natural gas and industrial oxygen"
      record_type: "custody-transfer or submeter records"
      raw_fields: "meter start/end; temperature; absolute pressure; dry/wet basis; gas identity; allocation key"
      collection_method: "read meters and convert to declared reference conditions"
      unit: "m3"
      frequency: "continuous or each batch, aggregated monthly"
      temporal_coverage: "full declared reporting period"
      site_scope: "all included furnaces, refining vessels and abatement units"
      aggregation_rule: "sum corrected volume assigned to included operations, normalized by net conforming output"
      quality_evidence: "meter calibration, gas specification and reference-condition calculation"
    - protocol_id: cp_electricity_records
      process_id: "bismuth_recovery_refining"
      flow_role: "Electricity"
      record_type: "revenue meter and process submeter records"
      raw_fields: "meter start/end; voltage level; purchased supply; on-site generation; export; losses; allocation key"
      collection_method: "reconcile facility and process meters"
      unit: "MJ"
      frequency: "continuous, aggregated monthly"
      temporal_coverage: "full declared reporting period"
      site_scope: "all included preparation, recovery, refining, casting and control operations"
      aggregation_rule: "purchased + included on-site generation - exports - excluded uses, normalized by net conforming output"
      quality_evidence: "meter calibration, utility invoices and reconciliation"
    - protocol_id: cp_water_mass_records
      process_id: "bismuth_recovery_refining"
      flow_role: "Fresh process-water input"
      record_type: "water meter and tank records"
      raw_fields: "meter start/end; source; density basis; recirculated water; discharge"
      collection_method: "meter fresh makeup separately from internal circulation and convert volume to mass using documented density"
      unit: "kg"
      frequency: "continuous or daily, aggregated monthly"
      temporal_coverage: "full declared reporting period"
      site_scope: "all included process and control operations"
      aggregation_rule: "fresh input only, normalized by net conforming output"
      quality_evidence: "meter calibration, density record and water balance"
    - protocol_id: cp_residue_mass_records
      process_id: "bismuth_recovery_refining"
      flow_role: "Slag and captured dust"
      record_type: "calibrated scale tickets and laboratory records"
      raw_fields: "gross/tare mass; moisture; bismuth content; other metals; destination; internal return"
      collection_method: "weigh each shipment or batch and reconcile internal returns"
      unit: "kg"
      frequency: "each batch or shipment"
      temporal_coverage: "full declared reporting period"
      site_scope: "all included recovery, refining, casting and abatement operations"
      aggregation_rule: "mass leaving the boundary only, normalized by net conforming output"
      quality_evidence: "scale calibration, waste manifests and analyses"
    - protocol_id: cp_wastewater_records
      process_id: "bismuth_recovery_refining"
      flow_role: "Bismuth-refining wastewater"
      record_type: "discharge meter, tank and analytical records"
      raw_fields: "volume or mass; density; treatment stage; suspended solids; dissolved metals; destination"
      collection_method: "meter the final boundary transfer and retain representative analyses"
      unit: "kg"
      frequency: "continuous or each discharge, aggregated monthly"
      temporal_coverage: "full declared reporting period"
      site_scope: "final included wastewater-treatment boundary"
      aggregation_rule: "mass leaving the boundary, normalized by net conforming output"
      quality_evidence: "meter calibration, sampling plan, laboratory results and transfer records"
    - protocol_id: cp_direct_emission_records
      process_id: "bismuth_recovery_refining"
      flow_role: "Direct fossil carbon dioxide"
      record_type: "stack measurement or foreground fuel-and-carbon records"
      raw_fields: "measured CO2; fuel volume; fuel carbon content; oxidation basis; excluded upstream emissions"
      collection_method: "prefer direct measurement; otherwise calculate with a documented carbon balance and reconcile fuel use"
      unit: "kg"
      frequency: "campaign or continuous measurement, aggregated to reporting period"
      temporal_coverage: "representative operation over the declared reporting period"
      site_scope: "all included direct combustion and oxidation sources"
      aggregation_rule: "sum direct fossil CO2 only, normalized by net conforming output"
      quality_evidence: "monitoring report, laboratory carbon analysis, calculation and uncertainty record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory exchange"
      rule: "normalized amount = reporting-period exchange amount / reporting-period net conforming reference-product mass"
      inputs:
        - "reconciled exchange amount"
        - "net conforming output mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - eu-commission-pef-2021
    - id: calc_mass_reconciliation
      applies_to: "metal-bearing inputs and outputs"
      rule: "Reconcile metal-bearing feed, product, internal return, co-products, residues and measured losses on the same moisture and composition basis; investigate and disclose material imbalance rather than forcing closure."
      inputs:
        - "measured masses"
        - moisture
        - "metal assays"
        - "stock changes"
        - transfers
      output: "documented total-mass and bismuth-mass reconciliation"
      source_ids:
        - eu-jrc-nfm-bref-2017
    - id: calc_solution_reporting
      applies_to: "sulfuric acid and sodium hydroxide solutions"
      rule: "pure substance mass = delivered solution mass × measured mass fraction; retain both delivered solution mass and pure-substance result."
      inputs:
        - "delivered solution mass"
        - "concentration certificate or analysis"
      output: "kg delivered solution and kg pure substance per reference flow"
      source_ids: []
    - id: calc_gas_conditions
      applies_to: "natural gas and industrial oxygen"
      rule: "Convert metered gas volume to the declared reference temperature, absolute pressure and moisture basis using the documented equation and compressibility assumption."
      inputs:
        - "metered volume"
        - temperature
        - pressure
        - moisture
        - compressibility
      output: "m3 at declared reference conditions per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain a product or scrap specification, chemical analysis, form description, grade, net-mass basis and acceptance record for the reported product."
      evidence: "certificate of analysis, product specification, scale record and dispatch record"
    - id: dq_route_identity
      applies_to: "foreground system"
      requirement: "Name the metal, feed origin, route stages, technology, primary/secondary shares, integrated operations and excluded operations; alternative products shall not inherit the bismuth representative inventory."
      evidence: "process flow diagram, operating description and boundary register"
    - id: dq_temporal_representativeness
      applies_to: "all foreground records"
      requirement: "Cover the declared production period and ordinary operating states; identify shutdown, startup, maintenance, campaign and abnormal-operation data and justify exclusions."
      evidence: "dated meter, batch, laboratory and production records"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile all significant purchased materials, energy, water, net products, co-products, residues, wastewater and measured direct emissions, with every exchange represented by one concrete flow."
      evidence: "mass and energy reconciliation, source register and unresolved-data log"
    - id: dq_measurement
      applies_to: "meters, scales and analyses"
      requirement: "Use calibrated instruments and documented sampling methods; report conversions, detection limits, missing-data treatment and uncertainty material to the result."
      evidence: "calibration certificates, sampling plans, laboratory QA and calculation sheets"
    - id: dq_upstream_links
      applies_to: "purchased inputs and external treatment"
      requirement: "Use geography-, technology- and state-appropriate datasets or disclose each unresolved upstream link and its expected significance."
      evidence: "dataset mapping register and supplier records"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference flow"
    rule: "Reject a package that omits the selected metal, product form, composition, grade, route, primary/secondary share, geography, reporting period, gate or net-mass basis."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validation_reference_mass
    applies_to: "normalization"
    rule: "Confirm that every reported exchange is normalized to 1 kg of net conforming reference product and that internal returns and off-spec product are excluded from the denominator."
    source_ids: []
  - rule_id: validation_atomic_inventory
    applies_to: "inventory rows"
    rule: "Reject collection labels, combined utilities, unspecified fuels, unspecified chemicals, grouped wastes or grouped emissions; each exchange shall be one concrete product, waste or elementary flow with its own applicability condition."
    source_ids: []
  - rule_id: validation_uuid_semantics
    applies_to: "Tiangong identities"
    rule: "A UUID is acceptable only when its public state, English and Chinese names, flow type, classification, property, unit group, product state and process role match the selected exchange; unresolved exact identities remain blank and disclosed."
    source_ids: []
  - rule_id: validation_route_completeness
    applies_to: "alternative products and routes"
    rule: "Reject use of the representative bismuth inventory for antimony, manganese, chromium, articles or scrap unless the package replaces it with concrete route-specific feed, reagent, energy, residue, wastewater and direct-emission exchanges."
    source_ids:
      - us-epa-ap42-ferroalloy
      - eu-jrc-nfm-bref-2017
  - rule_id: validation_boundary_allocation
    applies_to: "boundary and multi-output operations"
    rule: "Confirm that included and excluded operations, upstream links, internal recycling, external treatment and the allocation hierarchy are documented and that assigned burdens are conserved."
    source_ids:
      - eu-commission-pef-2021
  - rule_id: validation_ranges
    applies_to: "quantitative QA"
    rule: "No external typical range is prescribed by this authored PCR; validate values against reconciled foreground records and do not invent a range from one study, one scenario or incompatible product states."
    source_ids: []
  - rule_id: validation_bilingual
    applies_to: "bilingual data package guidance"
    rule: "Confirm that Chinese UUID-bearing names use the directly read Tiangong Chinese baseName and that row ids, UUIDs, controlled values and rule ids match the English rendering."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production data package for one explicitly declared covered metal product, article or eligible scrap product"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Plant-gate modelling of the declared product and route after all required qualifiers, atomic exchanges, upstream links, allocation choices and data-quality evidence have been supplied"
  excluded_use: "Category-average comparison across the four metals; proxying one metal or route with another; ferro-manganese or ferro-chromium; antimony or chromium scrap; unqualified metal compounds; downstream fabrication, use or end-of-life not explicitly added to the boundary"
  required_metadata: "PCR id and version; product metal and form; composition and grade; feed origins and primary/secondary shares; process route and technology; geography; reporting period; plant-gate state; reference conditions; upstream dataset mapping; allocation method; internal recycling; treatment destinations; unresolved identities and range-evidence needs"
  required_quality_disclosure: "Record coverage, instrument calibration, sampling and laboratory QA, mass/energy reconciliation, data gaps, estimation methods, uncertainty, representativeness limitations and sensitivity to allocation"
  update_trigger: "Change in product metal or form, feed origin or primary/secondary share, route technology, integrated operations, energy or water supply, pollution control, allocation relation, treatment destination, geography, product specification, or a material change in foreground performance"
