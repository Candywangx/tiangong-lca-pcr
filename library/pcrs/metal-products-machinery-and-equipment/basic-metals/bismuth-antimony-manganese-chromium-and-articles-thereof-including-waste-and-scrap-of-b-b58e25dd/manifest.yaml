  goal_policy_fingerprint: "sha256:ca4d48461138cec48aa51cf1438775f652663ac663b161c0203fabc5dc779d27"
  semantic_identity:
    decision: promote_legacy
    reviewed_boundary: "Bismuth, antimony, manganese or chromium metal and articles made predominantly from one of those metals, plus bismuth or manganese waste and scrap, with product metal, form, grade, route and market state declared."
    exclusions: "Ferro-manganese, ferro-chromium, compounds sold as chemicals, ores and concentrates sold without metal production, antimony or chromium waste and scrap, other metals, and downstream products classified by their own function."
    rationale: "The official CPC 3.0 structure defines this combined non-ferrous-metal category but assigns ferro-manganese, ferro-chromium, and antimony/chromium scrap to separate subclasses. No existing material PCR with the same semantic boundary was identified. A bismuth-metal recovery route is used only as the representative foreground model; alternative covered metals and product forms require declared route-specific exchanges."
