allocation_rules:
  - rule_id: allocation_subdivide_routes
    applies_to: "Multiple powder routes or integrated flaking"
    rule: "Prefer process subdivision and measured route-specific inputs, outputs, and abatement records; do not allocate a blended facility total before reasonable subdivision."
    source_ids:
      - eu-jrc-nfm-bref-2017
      - epo-metal-flake-ep0097017a2
  - rule_id: allocation_internal_recycle
    applies_to: "Carbon monoxide, hydrogen, solvent, water, ammonium sulfate, dust, and off-specification powder recycles"
    rule: "Treat internal recovery as an internal transfer: report external makeup, purge, sale, and disposal once and retain gross recycle data for mass-balance validation."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_coproduct
    applies_to: "Saleable ammonium sulfate or other exported nickel-bearing material"
    rule: "After subdivision, apply a declared physical relationship only when it reflects causality; otherwise apply economic allocation using a representative price period and report a no-allocation or alternative sensitivity result."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_waste
    applies_to: "Materials sent for off-site recovery or disposal"
    rule: "Do not assign avoided primary-production credit inside the foreground inventory unless the adopted LCA system model explicitly requires it; disclose waste status, treatment route, and any burden or credit convention."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_carbonyl_records
      process_id: "carbonyl_powder"
      flow_role: "Carbonyl-route feeds, utilities, wastes, and air releases"
      record_type: "Meters, weigh tickets, batch logs, assays, stack monitoring, abatement logs"
      raw_fields: "feed mass and Ni assay; H2 and CO makeup/recycle/purge; electricity; natural gas; water; product; dust; stack concentration, flow, time, moisture, oxygen and reference conditions"
      collection_method: "Reconcile calibrated meters and batch records; calculate stack masses from validated concentration and flow"
      unit: "kg, m3, MJ, kg Ni, mg/Nm3, Nm3"
      frequency: "Batch or continuous; monthly and annual aggregation"
      temporal_coverage: "At least 12 representative consecutive months unless a shorter campaign is justified"
      site_scope: "All carbonyl equipment and shared abatement apportioned by measured drivers"
      aggregation_rule: "Sum external exchanges; subtract documented internal returns only; normalize by conforming net product"
      quality_evidence: "Calibrations, assay QA/QC, stack reports, detection limits, downtime and mass-balance reconciliation"
    - protocol_id: cp_hydred_records
      process_id: "hydrogen_reduction_powder"
      flow_role: "Solution-reduction feeds, utilities, co-product, and releases"
      record_type: "Delivery records, solution flowmeters, batch logs, assays, gas meters, crystallizer, stack and effluent monitoring"
      raw_fields: "solution mass/volume/concentration/Ni assay; H2; NH3; ammonium sulfate; electricity; water; product and co-product; exhaust concentration/flow; effluent volume and Ni"
      collection_method: "Reconcile batch and utility records; convert solution quantities to declared chemical equivalents; calculate emissions from validated concentration and flow"
      unit: "kg, m3, MJ, kg Ni, mg/Nm3, mg/L"
      frequency: "Each batch or continuous; monthly and annual aggregation"
      temporal_coverage: "At least 12 representative consecutive months unless a shorter campaign is justified"
      site_scope: "All reduction, crystallization, drying, scrubbing, and shared equipment"
      aggregation_rule: "Sum external inputs and boundary-crossing outputs; normalize by conforming net product"
      quality_evidence: "Calibrations, laboratory methods, certificates, scrubber records, detection limits, and nickel balance"
    - protocol_id: cp_flaking_records
      process_id: "wet_flaking"
      flow_role: "Nickel powder, white spirit, electricity, and spent solvent"
      record_type: "Weigh tickets, batch sheets, solvent tank inventory, recovery records, electricity meters"
      raw_fields: "powder feed; solvent charge, recovery, makeup, purge and off-site waste; electricity; flake output; moisture"
      collection_method: "Close solvent and nickel balances by batch and period"
      unit: "kg, MJ"
      frequency: "Each batch; monthly and annual aggregation"
      temporal_coverage: "At least 12 representative consecutive months unless a shorter campaign is justified"
      site_scope: "All milling, separation, drying, and solvent-recovery equipment"
      aggregation_rule: "Count purchased feed and net solvent makeup once; normalize by conforming net flake output"
      quality_evidence: "Calibrations, solvent reconciliation, waste manifests, and product assay"
    - protocol_id: cp_finishing_records
      process_id: "finishing_packaging"
      flow_role: "Finishing utilities, packaging, reference output, and nickel release"
      record_type: "Meters, packaging issue records, production and quality logs, stack tests"
      raw_fields: "electricity; natural gas; water; drum and liner mass; gross/net product; rejects/recycle; particle size, moisture and Ni assay; exhaust concentration and flow"
      collection_method: "Reconcile saleable output to finishing input and rejects; calculate emissions from validated concentration and flow"
      unit: "kg, MJ, m3, kg Ni, mg/Nm3"
      frequency: "Each lot or continuous; monthly and annual aggregation"
      temporal_coverage: "At least 12 representative consecutive months unless a shorter campaign is justified"
      site_scope: "All drying, classification, blending, dust collection, and packaging equipment"
      aggregation_rule: "Normalize external exchanges to 1,000 kg conforming net product"
      quality_evidence: "Calibrations, packaging specifications, quality certificates, stack tests, reject logs, and product mass balance"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "Every inventory exchange"
      rule: "normalized amount = reporting-period boundary-crossing amount / net conforming product mass × 1,000 kg"
      inputs:
        - "Exchange amount"
        - "net conforming product mass"
      output: "Amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_contained_nickel
      applies_to: "Nickel-bearing materials"
      rule: "contained nickel = dry material mass × measured nickel mass fraction"
      inputs:
        - "Gross mass"
        - moisture
        - "nickel assay"
      output: "kg contained nickel"
      source_ids: []
    - id: calc_stack_release
      applies_to: "CO, nickel carbonyl, nickel, and ammonia air releases"
      rule: "release mass = validated concentration × dry-normal exhaust volume over matching operating time, with conversions documented"
      inputs:
        - Concentration
        - "gas flow"
        - time
        - moisture
        - "reference conditions"
        - "detection-limit treatment"
      output: "kg emitted substance"
      source_ids:
        - eu-jrc-nfm-bref-2017
    - id: calc_water_release
      applies_to: "Nickel to water"
      rule: "release mass = final-effluent nickel concentration × discharged water volume over the matching period"
      inputs:
        - "Nickel concentration"
        - "discharge volume"
        - "below-detection treatment"
      output: "kg nickel to water"
      source_ids:
        - eu-jrc-nfm-bref-2017
    - id: calc_fossil_co2
      applies_to: "Direct fossil carbon dioxide"
      rule: "Sum carbon-balance CO2 from combusted fossil natural gas and oxidized fossil CO; exclude upstream electricity and material emissions"
      inputs:
        - "Fuel carbon"
        - "oxidized CO"
        - "oxidation factors"
      output: "kg fossil CO2 to air"
      source_ids:
        - eu-jrc-nfm-bref-2017
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Report composition, powder/flake morphology, particle-size distribution, apparent density when specified, surface condition, moisture, route, lot, and net packaging-excluded mass."
      evidence: "Specification, certificate of analysis, particle-size report, and lot records"
    - id: dq_route_completeness
      applies_to: "Process map"
      requirement: "Demonstrate which route processes occurred and include every site-operated formation, abatement, finishing, recycle, and packaging step."
      evidence: "Process flow diagram, equipment list, and operating records"
    - id: dq_temporal
      applies_to: "Foreground inventory"
      requirement: "Use at least 12 representative consecutive months or justify a shorter complete campaign; disclose shutdowns, abnormal events, and utilization."
      evidence: "Dated meter, batch, maintenance, and production records"
    - id: dq_measurement
      applies_to: "Mass, energy, gas, and emissions"
      requirement: "Use calibrated instruments and validated methods; disclose reference conditions, moisture basis, detection limits, substitutions, and estimation hierarchy."
      evidence: "Calibration and QA/QC records, laboratory methods, and monitoring reports"
    - id: dq_completeness
      applies_to: "Nickel, carbon, solvent, and ammonium sulfate balances"
      requirement: "Reconcile feed, product, co-product, recycle, waste, and release totals; investigate residuals rather than hiding them in an unspecified flow."
      evidence: "Signed balance worksheet and corrective-action record"
    - id: dq_background
      applies_to: "Purchased inputs and off-site services"
      requirement: "Match geography, technology, product state, concentration, recycled content, electricity mix, gas basis, and treatment route; disclose proxies."
      evidence: "Dataset metadata and supplier records"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "Product output"
    rule: "Confirm exactly 1,000 kg net saleable powder or flake output, excluding packaging, and verify all required qualifiers."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_route_inventory
    applies_to: "Process map and inventory"
    rule: "Confirm every included process has route-specific atomic inputs, outputs, abatement, and collection evidence; reject umbrella utilities, chemicals, wastes, or emissions."
    source_ids:
      - eu-jrc-nfm-bref-2017
      - epo-metal-flake-ep0097017a2
  - rule_id: validate_nickel_balance
    applies_to: "Nickel-bearing exchanges"
    rule: "Reconcile contained nickel across feeds, product, co-products, wastes, internal recycle, and direct releases and investigate residuals."
    source_ids: []
  - rule_id: validate_carbonyl_safety_emissions
    applies_to: "Carbonyl route"
    rule: "Require CO and nickel-carbonyl monitoring or justified detection-limit treatment, afterburner and filter operating evidence, and separately reported elemental nickel particulates."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_no_double_counting
    applies_to: "Recycles and backgrounds"
    rule: "Confirm internal recycles are not external inputs or outputs and upstream production emissions are not copied into direct foreground emissions."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_unresolved_uuid
    applies_to: "UUID-empty rows"
    rule: "Block automatic identity resolution until an exact public state-100 Tiangong flow is directly audited; retain concrete name, property, unit, route condition, and unresolved status."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for a declared grade of elemental nickel powder or flake powder"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Cradle-to-gate product systems using a route-, grade-, geography-, technology-, recycled-content-, and time-representative nickel powder or flake input"
  excluded_use: "Nickel ore, concentrate, matte, oxide sinter, compact nickel, undeclared alloy powder, coated particles, paste, briquettes, sintered parts, or a route-average without production weighting"
  required_metadata: "Route; geography; period; feed identity and recycled content; composition; morphology; particle-size distribution; surface treatment; moisture; apparent density when relevant; net product mass; packaging; abatement; allocation; backgrounds; unresolved UUIDs"
  required_quality_disclosure: "Coverage, calibration, assays, detection limits, mass-balance residuals, recycle treatment, allocation sensitivity, proxy use, shared-equipment apportionment, abnormal operations, and range-evidence gaps"
  update_trigger: "Material change in route, feed, grade or morphology, recycled content, energy system, abatement, solvent recovery, packaging, allocation, facility scope, or data age beyond the program interval"
