system_boundary:
  rules:
    - rule_id: boundary_included_operations
      applies_to: "foreground gate-to-gate system"
      rule: "Include feedstock receipt, reheating, applicable descaling, exactly one declared hot-forming route, cooling, straightening, cutting and management of resulting scrap, scale, sludge and captured dust."
      source_ids:
        - ec-jrc-fmp-bref-2022
        - cn-nbs-industry-classification-2017
    - rule_id: boundary_upstream_steel
      applies_to: "semi-finished steel input"
      rule: "Keep ironmaking, steelmaking and casting outside the foreground, but link the received semi-finished product to an upstream dataset with compatible grade, route, geography and delivery state."
      source_ids:
        - worldsteel-lci-methodology-2017
    - rule_id: boundary_excluded_further_work
      applies_to: "downstream operations"
      rule: "Exclude cold forming/finishing, welding, pickling and oiling as a marketed finish, coating, fabrication, distribution, use and end-of-life unless a broader study explicitly adds and labels them outside this PCR foreground."
      source_ids:
        - unsd-cpc-3-0-2025
        - ec-jrc-fmp-bref-2022
    - rule_id: boundary_internal_recirculation
      applies_to: "water and recovered material"
      rule: "Record internally recirculated water and material as internal transfers for engineering checks, but inventory only their net boundary crossings; disclose the calculation and recovery destination."
      source_ids:
        - worldsteel-lci-methodology-2017
boundary_abstraction:
