allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "shared meters and multi-product campaigns"
    rule: "Prefer process subdivision and direct metering. Where a shared flow cannot be subdivided, allocate by a documented physical driver that represents causality, such as measured operating time and power for electricity or processed hot mass for furnace fuel; disclose the driver and sensitivity."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_internal_recovery
    applies_to: "internally recirculated scrap, scale, water and lubricant"
    rule: "Record the material as an output from the generating process and an input to the receiving process for internal engineering balance, then report only the net crossing of the foreground boundary in the product inventory."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_external_recovery
    applies_to: "scrap, scale, sludge and dust leaving the site"
    rule: "Classify an exported residue as material for recovery or co-product only when its destination and market use are documented. Otherwise model its actual waste treatment. Do not embed an undisclosed avoided-burden or end-of-life credit in this gate-to-gate dataset."
    source_ids:
      - worldsteel-lci-methodology-2017
      - ec-jrc-fmp-bref-2022
  - rule_id: allocation_route_separation
    applies_to: "hot rolling, hot drawing and hot extrusion"
    rule: "Do not average mutually exclusive routes unless the dataset explicitly represents a production-weighted mix with route shares and separate underlying inventories."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_records
      process_id: "feedstock_receipt_final_cooling_cutting"
      flow_role: "steel input and conforming product mass"
      record_type: "weighbridge, batch scale and production certificate"
      raw_fields: "batch_id; grade; feedstock_geometry; product_geometry; gross_mass; tare_mass; net_mass; timestamp; scale_id"
      collection_method: "calibrated weighing with length-by-section-mass cross-check where used"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "all included lines and saleable products"
      aggregation_rule: "sum eligible mass by batch and normalize to certified net saleable output"
      quality_evidence: "calibration certificates; weigh tickets; production certificates; reconciliation log"
    - protocol_id: cp_fuel_meter_records
      process_id: "feedstock_reheating"
      flow_role: "natural gas input"
      record_type: "furnace fuel meter and supplier invoice"
      raw_fields: "meter_id; opening_reading; closing_reading; reference_temperature; reference_pressure; dry_wet_basis; campaign_id"
      collection_method: "reconcile furnace meter with invoice and operating log"
      unit: "m3"
      frequency: "each campaign with monthly reconciliation"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "all included reheating furnaces"
      aggregation_rule: "subtract non-production use and allocate only with disclosed physical driver"
      quality_evidence: "meter calibration; invoices; reconciliation and outage logs"
    - protocol_id: cp_electricity_meter_records
      process_id: "all_included_processes"
      flow_role: "electricity input"
      record_type: "revenue meter and sub-meter"
      raw_fields: "meter_id; opening_reading; closing_reading; unit; process_id; campaign_id; operating_time"
      collection_method: "process sub-meter preferred; reconcile with site meter"
      unit: "kWh or MJ"
      frequency: "each campaign with monthly reconciliation"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "all included foreground equipment"
      aggregation_rule: "convert kWh to MJ and normalize eligible consumption to net saleable output"
      quality_evidence: "meter calibration; single-line diagram; reconciliation record"
    - protocol_id: cp_water_meter_records
      process_id: "descaling_final_cooling_cutting"
      flow_role: "net make-up water"
      record_type: "make-up water meter and water-balance log"
      raw_fields: "meter_id; opening_reading; closing_reading; water_quality; circuit_id; discharge_or_loss; campaign_id"
      collection_method: "measure boundary make-up and exclude internal recirculation"
      unit: "m3"
      frequency: "daily or each campaign with monthly balance"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "all included water circuits"
      aggregation_rule: "net boundary input divided by eligible net saleable output"
      quality_evidence: "meter calibration; water-balance diagram; reconciliation log"
    - protocol_id: cp_lubricant_records
      process_id: "route_specific_forming_process"
      flow_role: "consumed lubricant product"
      record_type: "purchase, store issue and return record"
      raw_fields: "product_id; supplier; formulation_reference; opening_stock; receipts; issues; returns; closing_stock; campaign_id"
      collection_method: "mass balance of stock and line issues"
      unit: "kg"
      frequency: "each issue with monthly reconciliation"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "selected route and included lines"
      aggregation_rule: "consumption = opening + receipts - returns - closing, assigned to eligible campaign"
      quality_evidence: "invoices; store ledger; safety data sheet; stock reconciliation"
    - protocol_id: cp_residue_mass_records
      process_id: "all_included_processes"
      flow_role: "scrap, scale, sludge and offcut output"
      record_type: "container scale, dispatch ticket and residue analysis"
      raw_fields: "residue_id; row_id; wet_mass; moisture; oil_content; dry_solids; destination; internal_or_external; batch_id"
      collection_method: "weigh each dispatch or container; retain composition basis"
      unit: "kg"
      frequency: "each container or dispatch"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "all included residue collection points"
      aggregation_rule: "aggregate each distinct stream and destination; do not net unlike residues"
      quality_evidence: "scale calibration; dispatch tickets; laboratory results; recycler receipt"
    - protocol_id: cp_air_emissions_records
      process_id: "feedstock_reheating_hot_rolling"
      flow_role: "direct elementary emissions"
      record_type: "continuous or periodic stack monitoring and facility emissions record"
      raw_fields: "source_id; pollutant; concentration; gas_flow; oxygen_reference; dry_wet_basis; abatement_state; operating_time; campaign_id"
      collection_method: "approved monitoring method with production-time alignment"
      unit: "kg"
      frequency: "continuous or permit-defined campaign sampling"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "all included point and documented fugitive sources"
      aggregation_rule: "integrate mass emission over eligible operation and normalize to net saleable output"
      quality_evidence: "monitoring reports; instrument calibration; permit records; calculation workbook"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = eligible row amount × 1,000 kg / eligible net saleable product mass"
      inputs:
        - "eligible row amount"
        - "eligible net saleable output mass"
      output: "row amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "electricity meter records"
      rule: "electricity (MJ) = electricity (kWh) × 3.6"
      inputs:
        - "kWh meter difference"
      output: "MJ electricity"
      source_ids: []
    - id: calc_net_water_input
      applies_to: "descaling and cooling water"
      rule: "net make-up water = measured water entering the circuit from outside the foreground; internal recirculation is excluded from repeated input"
      inputs:
        - "make-up meter"
        - "circuit balance"
        - "discharge and evaporation records"
      output: "m3 net make-up water"
      source_ids:
        - ec-jrc-fmp-bref-2022
    - id: calc_steel_mass_balance
      applies_to: "complete foreground"
      rule: "received semi-finished steel mass = saleable product mass + separately measured scrap + offcuts + scale + sludge dry iron-bearing solids + captured dust + other disclosed steel-bearing losses, after inventory change"
      inputs:
        - "steel input"
        - "product output"
        - "all steel-bearing residues"
        - "stock change"
      output: "reconciled steel mass balance and unexplained difference"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_route_gate
      applies_to: "route-specific rows"
      rule: "exactly one of hot rolling, hot drawing or hot extrusion is active for a batch; rows for the other two routes are not_applicable, not zero-filled measured values"
      inputs:
        - "declared route"
        - "batch id"
        - "process log"
      output: "route-consistent inventory"
      source_ids:
        - unsd-cpc-3-0-2025
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and feedstock"
      requirement: "Retain grade, standard, geometry, route, heat-treatment state, surface condition, commercial length and upstream feedstock dataset for every represented product family."
      evidence: "production certificate; order specification; supplier dataset link"
    - id: dq_temporal_representativeness
      applies_to: "all foreground data"
      requirement: "Use a representative 12-consecutive-month period covering normal operation, maintenance and product mix; justify shorter or abnormal periods."
      evidence: "dated meter exports; production calendar; deviation statement; worldsteel-lci-methodology-2017"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Reconcile site totals to process records and document every excluded meter, residue stream, emission source and downtime adjustment."
      evidence: "reconciliation workbook; source map; exclusion register"
    - id: dq_route_separation
      applies_to: "route-specific production"
      requirement: "Keep hot-rolling, hot-drawing and hot-extrusion batches separate unless a documented production-weighted route mix is the declared dataset object."
      evidence: "route code; batch genealogy; weighted aggregation workbook"
    - id: dq_mass_balance
      applies_to: "steel-bearing flows"
      requirement: "Perform and retain a steel mass balance and investigate unexplained differences before release."
      evidence: "signed mass-balance workbook; worldsteel-lci-methodology-2017"
    - id: dq_uuid_status
      applies_to: "Tiangong references"
      requirement: "Use only directly read public state_code 100 UUIDs with matching flow type, state, property, unit group and qualifiers; leave unresolved identities empty rather than using proxies."
      evidence: "UUID audit record and unresolved manifest entries"
validation_rules:
  - rule_id: validate_identity
    applies_to: "product category"
    rule: "Fail if the product is alloy steel, welded, hollow, cold-formed/cold-finished, coated or otherwise further worked beyond the declared hot-forming route, or if grade and section geometry are missing."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_reference_amount
    applies_to: "reference flow"
    rule: "Require exactly 1,000 kg net conforming saleable output and Mass property/unit consistency."
    source_ids:
      - worldsteel-sections-eco-profile-2023
  - rule_id: validate_route_exclusivity
    applies_to: "process inventory"
    rule: "Require exactly one active route among hot rolling, hot drawing and hot extrusion for each batch; require the other route rows to be not_applicable."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_boundary
    applies_to: "system boundary"
    rule: "Require a linked upstream dataset for the semi-finished steel input and exclude upstream steelmaking from the foreground; require disclosure of any broader added processes."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_mass_balance
    applies_to: "steel-bearing flows"
    rule: "Require a reconciled steel mass balance covering product, crop ends, offcuts, scale, sludge, dust and other declared losses; unresolved differences must be explained."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_energy_water
    applies_to: "electricity, fuel and water"
    rule: "Require meter boundaries, unit conversions, gas reference conditions and net-make-up water treatment to be documented; reject repeated counting of recirculated water."
    source_ids:
      - ec-jrc-fmp-bref-2022
      - worldsteel-lci-methodology-2017
  - rule_id: validate_residue_destination
    applies_to: "scrap, scale, sludge and dust"
    rule: "Require separate mass and destination for each residue stream; reject an undisclosed recovery credit or a combined residue total."
    source_ids:
      - ec-jrc-fmp-bref-2022
      - worldsteel-lci-methodology-2017
  - rule_id: validate_uuid_and_ranges
    applies_to: "flow identities and numerical guidance"
    rule: "Reject proxy or non-public UUIDs. Treat missing exact UUIDs and missing two-source range evidence as explicit unresolved review items, not permission to invent identities or ranges."
    source_ids: []
published_dataset_profile:
  dataset_role: "Gate-to-gate foreground production dataset for hot-formed iron or non-alloy steel sections"
  downstream_use: "secondary_dataset; background_dataset after review and when combined with a compatible upstream semi-finished-steel dataset"
  allowed_use: "Product and building LCAs, EPD modelling and supply-chain studies that need a route- and site-qualified mill-gate section-forming inventory"
  excluded_use: "Stand-alone cradle-to-gate steel production without an upstream feedstock dataset; alloy-steel, welded, hollow, cold-finished, coated or fabricated section products; unqualified cross-route comparisons"
  required_metadata: "PCR id and version; site and geography; production period; steel grade and standard; section geometry and commercial length; feedstock form, supplier dataset and incoming temperature; hot-forming route; furnace fuel and technology; descaling and cooling methods; meter boundaries; allocation; residue destinations; unresolved UUIDs"
  required_quality_disclosure: "Primary-data coverage; meter and scale calibration; mass-balance result; route shares if aggregated; temporal and technological representativeness; upstream dataset choice; exclusions; allocation sensitivity; emission-monitoring basis"
  update_trigger: "Change in steel grade family, feedstock source or state, forming route, furnace fuel/technology, descaling or cooling circuit, section-mill configuration, allocation, residue destination, or a material change in annual normalized inventory"
