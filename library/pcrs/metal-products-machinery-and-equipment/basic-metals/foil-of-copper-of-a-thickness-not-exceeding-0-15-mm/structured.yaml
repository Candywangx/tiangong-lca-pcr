allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "route, product grade, and finishing operation"
    rule: "Avoid allocation by separately metering ED and rolled routes, products with materially different surface or coating systems, and operations with distinct energy or yield."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_shared_utilities
    applies_to: "shared utilities and treatment systems"
    rule: "When subdivision is not feasible, allocate shared energy, water, and treatment by a documented causal driver such as metered use, operating time corrected for load, treated volume and pollutant load, or another verified engineering relationship. Mass allocation is allowed only when no more causal relationship is available."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_internal_scrap
    applies_to: "copper returned within the reporting boundary"
    rule: "Model internal scrap return as an internal loop: include collection, preparation, remelting or dissolution, treatment, and energy, but do not create an avoided-primary-copper credit or count the returned mass as a second product."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_external_recycling
    applies_to: "copper-bearing material leaving for external recycling"
    rule: "Report the physical scrap or residue output and its destination. The base producer-gate inventory shall not apply an avoided-burden credit; any recycled-content or end-of-life allocation method shall be an explicit downstream scenario with all parameters and no double counting."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_multiple_saleable_foils
    applies_to: "joint production of saleable foil grades"
    rule: "Prefer product-level records. If genuinely inseparable burdens remain, use physical mass allocation and disclose it; use economic allocation only with a documented reason and a sensitivity result because price differences can reflect application grade rather than manufacturing causality."
    source_ids:
      - ec-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_ed_materials
      process_id: "ed_foil_formation"
      flow_role: "Copper feed, electrolyte, water, and auxiliaries"
      record_type: "purchase, issue, stock, return, and transfer records"
      raw_fields: "material identity; grade; opening stock; purchases; closing stock; returns; transfer mass; moisture basis"
      collection_method: "reconcile enterprise records to ED production and retain substance-level rows"
      unit: "kg or material-specific unit"
      frequency: "batch or monthly, reconciled for the reporting period"
      temporal_coverage: "same representative period as ED output"
      site_scope: "each ED production site"
      aggregation_rule: "sum net consumption by material and normalize to unfinished ED output"
      quality_evidence: "invoices, stock reconciliation, batch tickets, and material certificates"
    - protocol_id: cp_ed_energy
      process_id: "ed_foil_formation"
      flow_role: "ED electricity"
      record_type: "meter and production-log records"
      raw_fields: "meter start/end; submeter use; operating hours; production mass; electricity supplier and mix period"
      collection_method: "use dedicated meters; otherwise apply the disclosed shared-utility rule"
      unit: "kWh"
      frequency: "continuous or shift record, monthly reconciliation"
      temporal_coverage: "same representative period as ED output"
      site_scope: "each ED production site"
      aggregation_rule: "sum attributable electricity and normalize to unfinished ED output"
      quality_evidence: "calibrated meter records and reconciliation"
    - protocol_id: cp_ed_output
      process_id: "ed_foil_formation"
      flow_role: "Unfinished foil and copper residues"
      record_type: "scale, batch, transfer, and disposition records"
      raw_fields: "gross mass; tare; net mass; lot; route; accepted transfer; residue class; destination"
      collection_method: "reconcile input, transfer, inventory change, and residues"
      unit: "kg"
      frequency: "each lot, monthly reconciliation"
      temporal_coverage: "same representative period as ED inputs"
      site_scope: "each ED production site"
      aggregation_rule: "sum dry net mass by output and destination"
      quality_evidence: "scale calibration, batch record, and mass-balance sign-off"
    - protocol_id: cp_rolled_materials
      process_id: "rolled_foil_formation"
      flow_role: "Copper feed, lubricants, water, and consumables"
      record_type: "purchase, issue, stock, return, and transfer records"
      raw_fields: "material identity; grade; opening stock; purchases; closing stock; recovered amount; return; transfer mass"
      collection_method: "reconcile material records to rolling production"
      unit: "kg or material-specific unit"
      frequency: "batch or monthly, reconciled for the reporting period"
      temporal_coverage: "same representative period as rolled output"
      site_scope: "each rolling site"
      aggregation_rule: "sum net consumption by material and normalize to unfinished rolled output"
      quality_evidence: "invoices, stock reconciliation, batch tickets, and material certificates"
    - protocol_id: cp_rolled_energy
      process_id: "rolled_foil_formation"
      flow_role: "Rolling electricity, fuel, and purchased heat"
      record_type: "meter, fuel invoice, tank, and production-log records"
      raw_fields: "energy carrier; meter start/end; purchased amount; stock change; lower heating value when used; operating hours; output mass"
      collection_method: "meter each carrier; reconcile fuel stock and invoices; separate on-site combustion from purchased energy"
      unit: "kWh, MJ, or carrier-specific unit"
      frequency: "continuous or shift record, monthly reconciliation"
      temporal_coverage: "same representative period as rolled output"
      site_scope: "each rolling site"
      aggregation_rule: "sum attributable carrier use and normalize to unfinished rolled output"
      quality_evidence: "meter calibration, invoices, tank reconciliation, and calculation sheet"
    - protocol_id: cp_rolled_output
      process_id: "rolled_foil_formation"
      flow_role: "Unfinished foil, copper scrap, and other waste"
      record_type: "scale, batch, transfer, and disposition records"
      raw_fields: "gross mass; tare; net mass; lot; temper; accepted transfer; waste class; destination"
      collection_method: "reconcile input, output, work-in-progress change, and wastes"
      unit: "kg"
      frequency: "each lot, monthly reconciliation"
      temporal_coverage: "same representative period as rolled inputs"
      site_scope: "each rolling site"
      aggregation_rule: "sum dry net mass by output and destination"
      quality_evidence: "scale calibration, batch record, and mass-balance sign-off"
    - protocol_id: cp_finishing_records
      process_id: "surface_thermal_finishing"
      flow_role: "Foil, energy, treatment and coating inputs, finished transfer, and wastes"
      record_type: "meter, batch recipe, issue, stock, scale, and disposition records"
      raw_fields: "route; lot; input/output mass; energy carrier; material identity; coating issue and recovery; bath make-up; waste class; destination"
      collection_method: "reconcile each finishing line and product family without averaging coated and uncoated products"
      unit: "kg, kWh, MJ, or carrier-specific unit"
      frequency: "each batch or lot, monthly reconciliation"
      temporal_coverage: "same representative period as finished output"
      site_scope: "each finishing site and line"
      aggregation_rule: "aggregate only products with the same declared treatment/coating system; normalize to finished transfer"
      quality_evidence: "batch recipes, meter and scale calibration, chemical analysis, and stock reconciliation"
    - protocol_id: cp_final_conversion
      process_id: "slitting_inspection_packaging"
      flow_role: "Input foil, energy, packaging, accepted foil, trim, rejects, and samples"
      record_type: "meter, slitting plan, scale, inspection, packaging, and disposition records"
      raw_fields: "route; lot; input mass; accepted mass; width; length/area; thickness; areal mass; trim; reject; sample; packaging mass; destination"
      collection_method: "reconcile each product lot through final inspection and packaging"
      unit: "kg, m2, µm, kWh, and material-specific unit"
      frequency: "each lot, monthly reconciliation"
      temporal_coverage: "same representative period as product output"
      site_scope: "each final-conversion site"
      aggregation_rule: "sum accepted mass by declared product and route; separately sum scrap and packaging"
      quality_evidence: "scale and gauge calibration, inspection certificate, and disposition record"
    - protocol_id: cp_site_releases
      process_id: "all_applicable_processes"
      flow_role: "Direct air and water releases"
      record_type: "continuous monitoring, periodic sampling, permit report, fuel analysis, and discharge records"
      raw_fields: "substance; compartment; concentration; flow or volume; duration; fuel quantity; emission factor source; treatment stage"
      collection_method: "calculate substance mass from validated measurements or documented engineering method"
      unit: "kg or measurement-specific unit"
      frequency: "as monitored or sampled, reconciled for the reporting period"
      temporal_coverage: "same representative period as production"
      site_scope: "each reporting site and discharge point"
      aggregation_rule: "sum by substance and receiving compartment, then allocate by causal driver"
      quality_evidence: "laboratory accreditation, instrument calibration, permit return, and signed calculation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = reporting-period amount × 1,000 kg / reporting-period accepted reference-product mass"
      inputs:
        - "reporting-period amount"
        - "accepted foil mass"
      output: "amount per 1,000 kg accepted foil"
      source_ids:
        - ec-pef-method-2021
    - id: calc_areal_mass
      applies_to: "reference product"
      rule: "areal mass = net foil mass / measured delivered foil area; report the area and mass measurement basis and do not substitute nominal thickness"
      inputs:
        - "net foil mass"
        - "delivered foil area"
      output: "kg/m2"
      source_ids:
        - ipc-4562b-toc
    - id: calc_net_yield
      applies_to: "each formation route and final conversion"
      rule: "net yield = accepted output mass / accountable copper-bearing input mass; also report each copper-bearing loss and inventory change so the ratio is auditable"
      inputs:
        - "accepted output"
        - "copper-bearing inputs"
        - "work-in-progress change"
        - scrap
        - residues
      output: "kg/kg and mass-balance table"
      source_ids:
        - eu-jrc-nfm-bref
    - id: calc_coating_mass
      applies_to: "coated foil"
      rule: "coating mass per area = net coating material retained on product / coated delivered area; distinguish input, recovered material, and waste"
      inputs:
        - "coating input"
        - "recovered material"
        - waste
        - "coated area"
      output: "kg/m2 by coating constituent"
      source_ids:
        - ipc-4562b-toc
  data_quality_requirements:
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use one recent consecutive period representative of normal operation; continuous production should normally cover at least 12 months, while a shorter campaign shall cover all operating states and be justified."
      evidence: "reporting-period definition, monthly trend, shutdown and abnormal-operation log"
    - id: dq_technology
      applies_to: "formation route"
      requirement: "Record ED and rolled production separately, including actual equipment and finishing route; no battery-grade or printed-circuit-grade dataset may stand in for the whole category."
      evidence: "route map, equipment list, production records, and product-family reconciliation"
    - id: dq_geography_energy
      applies_to: "energy and upstream supplies"
      requirement: "Use site geography and reporting-period electricity and fuel supply; disclose contractual instruments separately from the physical inventory mix."
      evidence: "meters, invoices, supplier data, and energy-mix documentation"
    - id: dq_mass_balance
      applies_to: "copper-bearing inputs and outputs"
      requirement: "Reconcile copper-bearing input, accepted foil, work-in-progress change, internal returns, external scrap, residues, samples, and unexplained difference for each route and site."
      evidence: "signed mass-balance worksheet and stock reconciliation"
    - id: dq_product_specification
      applies_to: "reference product"
      requirement: "Retain lot-weighted evidence for thickness, areal mass, purity or alloy, side-specific surface state, annealing or temper, coating, and delivery condition."
      evidence: "certificate of analysis or conformance, inspection records, and calibrated measurements"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Cover all material and energy inputs and substance-specific releases that can materially affect results; disclose exclusions and quantify their screening basis."
      evidence: "flow checklist, meter and purchase reconciliation, permit records, and exclusion log"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Confirm CPC 3.0 41515, measured thickness ≤150 µm, unsupported foil state, and exclusion of composite foil, copper-clad laminate, laminate, board, and electrode laminate."
    source_ids:
      - unsd-cpc-3-0-explanatory-notes
  - rule_id: validate_route_scope
    applies_to: "process map and dataset metadata"
    rule: "Confirm that ED and rolled routes are identified and separately inventoried, or that a declared mixed-route product reports route shares and preserves route-specific energy, yield, and treatment data."
    source_ids:
      - fukuda-ed-foil-production
      - jx-rolled-copper-foil-technology
  - rule_id: validate_reference_flow
    applies_to: "reference flow"
    rule: "Confirm exactly 1,000 kg net accepted foil, excluding packaging and detachable carrier, and verify that all required qualifiers are populated."
    source_ids:
      - ipc-4562b-toc
  - rule_id: validate_mass_balance
    applies_to: "each route and final conversion"
    rule: "Verify the copper-bearing mass balance, work-in-progress change, accepted output, all scrap and residue destinations, and any unexplained difference before normalization."
    source_ids:
      - eu-jrc-nfm-bref
  - rule_id: validate_energy_yield
    applies_to: "each included process"
    rule: "Confirm that electricity and each thermal-energy carrier are foreground records for the same period as output, and that route yield and final slitting yield are reported without netting scrap-recycling credits."
    source_ids:
      - eu-jrc-nfm-bref
      - ec-pef-method-2021
  - rule_id: validate_surface_state
    applies_to: "treated, annealed, or coated foil"
    rule: "Confirm side-specific treatment/roughness, annealing or temper, coating chemistry and retained mass; confirm explicit uncoated when no coating is present."
    source_ids:
      - ipc-4562b-toc
      - fukuda-ed-foil-production
      - jx-rolled-copper-foil-technology
  - rule_id: validate_release_coverage
    applies_to: "site inventory"
    rule: "Confirm substance-specific direct air and water releases, wastes sent to external treatment, and copper-bearing residues are assigned to the correct flow type and destination."
    source_ids:
      - eu-jrc-nfm-bref
  - rule_id: validate_no_category_extrapolation
    applies_to: "published claims and downstream use"
    rule: "Reject any claim that extrapolates a single battery-grade, printed-circuit-grade, ED-only, rolled-only, coated, or uncoated dataset to the full copper-foil category without a supported production-weighted aggregation."
    source_ids:
      - ipc-4562b-toc
      - ec-pef-method-2021
published_dataset_profile:
  dataset_role: "Route- and product-specific foreground manufacturing dataset for copper foil at the producer's gate"
  downstream_use: "LCA process or lifecycle model for copper-foil supply to batteries, printed circuits, electronics, or other products when the declared foil specification matches"
  allowed_use: "Use for the represented sites, period, route mix, thickness, grade or purity, surface treatment, annealing or temper, coating, and delivery state; aggregation is allowed only with disclosed production weights and preserved route distinctions"
  excluded_use: "Composite copper foil, copper-clad laminate, flexible copper-clad laminate, printed circuit board, electrode laminate, downstream electrode coating or lamination, and category-wide claims based on one narrow grade"
  required_metadata: "CPC code; Tiangong reference-flow UUID; site and geography; reporting period; ED/rolled route and shares; thickness and areal mass; purity/alloy; both-side surface state and roughness convention; annealing/temper; coating state and mass; roll/coil/sheet delivery condition; energy supply; yield; scrap and residue destinations; allocation and upstream-boundary choices"
  required_quality_disclosure: "Meter coverage; measurement and analytical methods; temporal coverage; route and product representativeness; copper mass-balance closure; allocation; excluded flows; data gaps; use of secondary data; uncertainty or sensitivity results"
  update_trigger: "Material change in route or route shares, site, electricity or fuel supply, copper feed state, thickness family, surface treatment, annealing, coating system, yield, scrap recovery, allocation, upstream dataset, or reporting period"
data_sources:
