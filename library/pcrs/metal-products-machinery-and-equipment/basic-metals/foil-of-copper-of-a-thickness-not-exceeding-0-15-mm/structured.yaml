system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The dataset is cradle-to-producer-gate when upstream datasets are linked for purchased refined copper, copper scrap, copper chemicals, energy, water, treatment chemicals, packaging, and other supplied inputs. The foreground boundary begins at factory receipt of the declared copper-bearing feed and ends after slitting, inspection, and packaging of conforming foil. Route-specific formation, thermal treatment, surface treatment or roughening, coating when present, utilities, emission control, wastewater treatment, scrap handling, and on-site recycling are included when performed by the reporting organization."
      source_ids: []
    - rule_id: boundary_route_separation
      applies_to: "route-specific foreground model"
      rule: "Select at least one formation route. Keep ed_foil_formation and rolled_foil_formation separate unless a sales-weighted average is the declared product and route shares, energy, yield, and material differences remain transparent."
      source_ids:
        - fukuda-ed-foil-production
        - jx-rolled-copper-foil-technology
    - rule_id: boundary_treatment_inclusion
      applies_to: "surface-treated, roughened, annealed, or coated foil"
      rule: "Include all treatment, roughening, annealing, passivation, coating, washing, drying, and associated utilities and releases performed before the product gate; declare both sides separately when their states differ."
      source_ids:
        - ipc-4562b-toc
        - fukuda-ed-foil-production
        - jx-rolled-copper-foil-technology
    - rule_id: boundary_excluded_products
      applies_to: "product identity"
      rule: "Do not apply the dataset to composite copper foil, copper-clad laminate, flexible copper-clad laminate, printed circuit board, electrode laminate, or foil already bonded to a structural substrate or active-material layer."
      source_ids:
        - unsd-cpc-3-0-explanatory-notes
        - ipc-4562b-toc
    - rule_id: boundary_resource_and_release_coverage
      applies_to: "all included processes"
      rule: "Account for copper-bearing materials, process chemicals, water, electricity, fuels, direct air emissions, wastewater pollutants, wastes, and copper-bearing residues. Use substance-specific flows rather than an unquantified aggregate where records permit."
      source_ids:
        - eu-jrc-nfm-bref
boundary_abstraction:
  declared_starting_condition: "The physical and commercial state of each copper-bearing feed at the reporting-site receiving gate, including refined copper, copper scrap, anode or solution input, billet, strip, or other intermediate"
  starting_condition_role: "Foreground manufacturing starts at receipt; all earlier extraction, smelting, refining, scrap preparation, and transport burdens are linked as upstream datasets unless physically performed within the reporting boundary"
  product_classification_scope: "CPC 3.0 41515; ED and rolled foil are route-specific members, not interchangeable default technologies"
  recursive_input_rule: "Purchased foil in CPC 3.0 41515 is recorded as an input with its own upstream dataset and declared purpose; its manufacture is not recreated inside the same process inventory"
  upstream_dataset_requirement: "Link technology-, geography-, and period-appropriate upstream datasets for all material and energy inputs; identify recycled-content claims and copper-scrap preparation boundaries"
  disclosure: "Declare route, site geography, reporting period, feed states, included upstream stages, electricity and fuel supply, on-site utilities, treatment/coating scope, internal recycling loops, external scrap destinations, and excluded operations"
