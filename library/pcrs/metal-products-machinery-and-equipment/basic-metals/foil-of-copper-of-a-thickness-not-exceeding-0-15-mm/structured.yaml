measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all inventory results to 1,000 kg of accepted foil leaving final inspection; exclude packaging and detachable carrier mass, and separately disclose adherent non-copper treatment or coating mass included in the delivered product."
  - id: foil_thickness
    applies_to: "reference product"
    required_property_ref:
      name: "Length"
      uuid: ""
    required_unit: "µm"
    rule: "Report the lot- or product-weighted measured thickness and declared tolerance; every represented product shall be ≤150 µm. Do not infer thickness from a nominal battery or circuit-board grade."
  - id: foil_areal_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass per area"
      uuid: ""
    required_unit: "kg/m2"
    rule: "Calculate measured net foil mass divided by measured delivered foil area for the represented production; do not calculate areal mass from thickness alone unless the dataset documents a product-specific measured density and composition basis."
  - id: copper_composition
    applies_to: "reference product and copper-bearing inputs"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "kg/kg"
    rule: "Report copper purity or alloy designation and the analytical or certificate basis; do not treat a single high-purity or battery-grade specification as the category default."
  - id: surface_and_coating
    applies_to: "reference product"
    required_property_ref:
      name: "Mass per area and declared profile metric where applicable"
      uuid: ""
    required_unit: "kg/m2 and declared roughness/profile unit"
    rule: "Identify each side's treatment or roughening state and measurement convention. Report coating chemistry and measured coating mass separately; use uncoated only when no coating is present."
  - id: production_yield
    applies_to: "each route and final conversion"
    required_property_ref:
      name: "Mass ratio"
      uuid: ""
    required_unit: "kg/kg"
    rule: "Report accepted output, edge trim, off-spec foil, samples, work-in-progress change, and other copper-bearing losses on a consistent dry-mass basis; calculate net yield as accepted product mass divided by accountable copper-bearing input mass."
