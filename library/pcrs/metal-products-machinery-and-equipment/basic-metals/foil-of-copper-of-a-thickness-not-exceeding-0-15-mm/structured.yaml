    reference: "United Nations Statistics Division, *Central Product Classification (CPC) Version 3.0 Explanatory Notes*, 30 June 2025, subclass 41515. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (accessed 2026-08-08)"
    used_for: "Official product-category boundary and separation from copper plate, sheet, and strip over 0.15 mm"
  - id: "ipc-4562b-toc"
    type: "standard"
    reference: "IPC, *IPC-4562B: Metal Foil for Printed Board Applications*, table of contents, October 2023. https://www.ipc.org/TOC/IPC-4562B-TOC.pdf (accessed 2026-08-08)"
    used_for: "Route distinction between electrodeposited and wrought foil and declaration/inspection dimensions including thickness, area weight, profile, treatment, purity, and delivery; not used as a category-wide performance threshold"
  - id: "eu-jrc-nfm-bref"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, *Best Available Techniques Reference Document for the Non-Ferrous Metals Industries*, adopted June 2016, published 2017. https://bureau-industrial-transformation.jrc.ec.europa.eu/reference/non-ferrous-metals-industries-0 (accessed 2026-08-08)"
    used_for: "Copper-process resource, energy, waste, air-emission, and water-emission inventory coverage and mass-balance attention"
  - id: "ec-pef-method-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 of 15 December 2021 on the use of Environmental Footprint methods, Annex I Product Environmental Footprint Method. https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng (accessed 2026-08-08)"
    used_for: "Functional-unit normalization, company-specific data, multifunctionality, recycling allocation transparency, data quality, and validation"
  - id: "fukuda-ed-foil-production"
    type: "handbook"
    reference: "Fukuda Metal Foil & Powder Co., Ltd., *How Electrodeposited Copper Foil Is Produced*. https://www.fukuda-kyoto.co.jp/en/technology/making/foil_electrolytic.html (accessed 2026-08-08)"
    used_for: "ED route sequence: electroplating formation, product-dependent two-side treatment, slitting/cutting, inspection, and roll or sheet delivery"
  - id: "jx-rolled-copper-foil-technology"
    type: "handbook"
    reference: "JX Advanced Metals Corporation, *Our Core Technologies Contributing to Societal Growth and Innovation*, sections on rolling, annealing, and copper-foil surface treatment. https://www.jx-nmm.com/english/rd_sp/core_tech/ (accessed 2026-08-08)"
    used_for: "Rolled-route repeated rolling and annealing, multi-pass thickness control, roughening/plating, anti-oxidation treatment, and separation of foil from bonded composites"
