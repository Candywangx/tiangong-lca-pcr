allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared operations and route mixing"
    rule: "Subdivide primary and secondary routes and separately metered refining, sulfur recovery, and residue recovery whenever records permit; do not average routes merely to avoid subdivision."
    source_ids: []
  - rule_id: allocation_internal_recycling
    applies_to: "Internal lead, dust, slag, and dross loops"
    rule: "Exclude internal-loop exchanges from external inventory totals while retaining the gross records needed for mass-balance checks; allocate no separate burden to an internal loop."
    source_ids:
      - us-epa-ap42-primary-lead-1995
      - us-epa-ap42-secondary-lead-2010
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_scrap_input
    applies_to: "Secondary lead feed"
    rule: "Carry the selected upstream dataset for delivered lead scrap, including collection and pretreatment within that dataset boundary; do not add an avoided-primary-lead credit inside the foreground producer."
    source_ids: []
  - rule_id: allocation_coproducts
    applies_to: "Sulfuric acid or another saleable co-product"
    rule: "Prefer separately measured subdivision or a documented causal physical relation. If neither is feasible, apply economic allocation using contemporaneous producer-gate values, disclose the period and price basis, and report a sensitivity result; residues without a market are treated as waste outputs, not co-products."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_primary_materials
      process_id: "primary_unwrought_lead"
      flow_role: "Concentrate, coke, fluxes, and refining reagent"
      record_type: "Weighbridge, batch charge, assay, and purchase records"
      raw_fields: "gross_mass; tare_mass; moisture; Pb_assay; material_grade; active_content; batch_id"
      collection_method: "Reconcile delivered, returned, stored, and charged quantities by material"
      unit: "kg"
      frequency: "Each delivery and furnace batch"
      temporal_coverage: "Complete reporting period"
      site_scope: "All primary-route units within the producer boundary"
      aggregation_rule: "Sum net consumed mass by material; retain dry-mass and contained-lead calculations separately"
      quality_evidence: "Calibrated scales; laboratory certificates; stock reconciliation; batch logs"
    - protocol_id: cp_primary_utilities
      process_id: "primary_unwrought_lead"
      flow_role: "Oxygen, water, electricity, and natural gas"
      record_type: "Utility meters and invoices"
      raw_fields: "meter_open; meter_close; import; export; reference_conditions; NCV; allocation_key"
      collection_method: "Reconcile submeter totals to facility invoices and shared-service allocation"
      unit: "m3; kg; kWh; MJ"
      frequency: "Continuous or billing interval"
      temporal_coverage: "Complete reporting period"
      site_scope: "All foreground primary operations and documented shared services"
      aggregation_rule: "Net imports minus verified exports; convert units only under Section 4"
      quality_evidence: "Meter calibration; invoices; reference-condition and NCV records; allocation worksheet"
    - protocol_id: cp_primary_outputs
      process_id: "primary_unwrought_lead"
      flow_role: "Lead, sulfuric acid, slag, dross, matte, and speiss"
      record_type: "Product scales, shipment records, residue manifests, and assays"
      raw_fields: "output_mass; grade; composition; destination; recovery_status; batch_id"
      collection_method: "Reconcile produced, shipped, stored, internally recycled, and discarded outputs"
      unit: "kg"
      frequency: "Each batch or shipment"
      temporal_coverage: "Complete reporting period"
      site_scope: "All foreground primary outputs"
      aggregation_rule: "Sum external outputs by identity and destination; keep internal loops separate"
      quality_evidence: "Scale calibration; certificates of analysis; shipment and waste records; stock reconciliation"
    - protocol_id: cp_primary_emissions
      process_id: "primary_unwrought_lead"
      flow_role: "Direct CO2, SO2, lead, and particulate"
      record_type: "Continuous or periodic monitoring, validated stack tests, diffuse estimates, and fuel/carbon balance"
      raw_fields: "source_id; pollutant; concentration; gas_flow; duration; capture_status; fuel_carbon; uncertainty"
      collection_method: "Calculate source-specific mass releases and reconcile capture and bypass events"
      unit: "kg"
      frequency: "Monitoring interval and every reportable event"
      temporal_coverage: "Complete reporting period including startup, shutdown, and upset events"
      site_scope: "All controlled and diffuse foreground sources"
      aggregation_rule: "Sum source-specific direct releases once; exclude captured return and upstream emissions"
      quality_evidence: "Calibration and QA records; test reports; operating hours; carbon and sulfur balance; uncertainty statement"
    - protocol_id: cp_secondary_materials
      process_id: "secondary_unwrought_lead"
      flow_role: "Lead scrap, coke, limestone, ferrous scrap, sodium carbonate, and sodium hydroxide"
      record_type: "Weighbridge, sorting, assay, batch charge, and purchase records"
      raw_fields: "net_mass; moisture; Pb_content; sulfur; plastics; contamination; material_grade; batch_id"
      collection_method: "Reconcile delivered, rejected, stored, separated, and charged quantities by material"
      unit: "kg"
      frequency: "Each delivery and furnace batch"
      temporal_coverage: "Complete reporting period"
      site_scope: "All secondary-route units within the producer boundary"
      aggregation_rule: "Sum net consumed mass by specific material; keep separated non-lead fractions distinct"
      quality_evidence: "Calibrated scales; sorting records; laboratory assays; stock reconciliation; batch logs"
    - protocol_id: cp_secondary_utilities
      process_id: "secondary_unwrought_lead"
      flow_role: "Oxygen, water, electricity, and natural gas"
      record_type: "Utility meters and invoices"
      raw_fields: "meter_open; meter_close; import; export; reference_conditions; NCV; allocation_key"
      collection_method: "Reconcile submeter totals to facility invoices and shared-service allocation"
      unit: "m3; kg; kWh; MJ"
      frequency: "Continuous or billing interval"
      temporal_coverage: "Complete reporting period"
      site_scope: "All foreground secondary operations and documented shared services"
      aggregation_rule: "Net imports minus verified exports; convert units only under Section 4"
      quality_evidence: "Meter calibration; invoices; reference-condition and NCV records; allocation worksheet"
    - protocol_id: cp_secondary_outputs
      process_id: "secondary_unwrought_lead"
      flow_role: "Lead, slag, and dross"
      record_type: "Product scales, shipment records, residue manifests, and assays"
      raw_fields: "output_mass; grade; composition; destination; recovery_status; batch_id"
      collection_method: "Reconcile produced, shipped, stored, internally recycled, and discarded outputs"
      unit: "kg"
      frequency: "Each batch or shipment"
      temporal_coverage: "Complete reporting period"
      site_scope: "All foreground secondary outputs"
      aggregation_rule: "Sum external outputs by identity and destination; keep internal loops separate"
      quality_evidence: "Scale calibration; certificates of analysis; shipment and waste records; stock reconciliation"
    - protocol_id: cp_secondary_emissions
      process_id: "secondary_unwrought_lead"
      flow_role: "Direct CO2, SO2, lead, and particulate"
      record_type: "Continuous or periodic monitoring, validated stack tests, diffuse estimates, and fuel/carbon balance"
      raw_fields: "source_id; pollutant; concentration; gas_flow; duration; capture_status; fuel_carbon; uncertainty"
      collection_method: "Calculate source-specific mass releases and reconcile control, bypass, and afterburner events"
      unit: "kg"
      frequency: "Monitoring interval and every reportable event"
      temporal_coverage: "Complete reporting period including startup, shutdown, and upset events"
      site_scope: "All controlled and diffuse foreground sources"
      aggregation_rule: "Sum source-specific direct releases once; exclude captured return and upstream emissions"
      quality_evidence: "Calibration and QA records; test reports; operating hours; carbon and sulfur balance; uncertainty statement"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "normalized amount = reporting-period exchange amount / reporting-period net saleable unwrought-lead mass"
      inputs:
        - "Exchange totals"
        - "net saleable lead output"
      output: "Amount per 1 kg reference product"
      source_ids: []
    - id: calc_dry_concentrate
      applies_to: "primary_lead_concentrate"
      rule: "dry mass = as-received mass × (1 - measured moisture fraction); contained lead = dry mass × dry-basis Pb assay"
      inputs:
        - "As-received mass"
        - moisture
        - "Pb assay"
      output: "Dry concentrate and contained-lead mass"
      source_ids: []
    - id: calc_scrap_contained_lead
      applies_to: "secondary_lead_scrap"
      rule: "contained lead = mass of each accepted scrap fraction × its measured Pb content; sum only accepted lead-bearing fractions"
      inputs:
        - "Fraction masses"
        - "Pb assays"
        - "reject records"
      output: "Contained lead in secondary feed"
      source_ids: []
    - id: calc_direct_emission_mass
      applies_to: "Direct SO2, lead, and particulate"
      rule: "source release = concentration × dry gas flow × operating duration, adjusted only by documented reference-condition conversions; sum stack and separately quantified diffuse sources"
      inputs:
        - "Monitoring data"
        - "gas flow"
        - duration
        - "reference conditions"
      output: "Pollutant mass released"
      source_ids:
        - us-epa-ap42-primary-lead-1995
        - us-epa-ap42-secondary-lead-2010
        - eu-jrc-nfm-bref-2017
    - id: calc_carbon_balance
      applies_to: "Direct fossil CO2 when continuous CO2 mass is unavailable"
      rule: "Convert site-specific fossil-carbon consumption and measured carbon retained in products/residues to direct fossil CO2 using a documented carbon balance; do not use a generic emission factor without source review."
      inputs:
        - "Fuel and coke carbon"
        - "retained carbon"
        - "measured off-gas information"
      output: "Direct fossil CO2 mass"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "Each route"
      rule: "mass balance closure = identified external outputs plus direct mass releases and inventory change divided by identified external inputs; report the unaccounted mass and investigate material discrepancies without forcing closure."
      inputs:
        - "Material inputs"
        - products
        - wastes
        - emissions
        - "opening and closing stocks"
      output: "Route mass-balance evidence"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Retain product grade, lead content, full declared alloy/impurity composition, casting form, route, batch or period, and conformance evidence."
      evidence: "Certificates of analysis; product specifications; batch and shipment records"
    - id: dq_feed_identity
      applies_to: "Lead-bearing feed"
      requirement: "Report feed origin, physical state, moisture, lead content, sulfur, relevant impurities, and recycled/primary status; do not substitute an umbrella feed label."
      evidence: "Supplier certificates; sampling plan; laboratory assays; sorting records"
    - id: dq_temporal_coverage
      applies_to: "All rows"
      requirement: "Cover a representative continuous reporting period and include startup, shutdown, maintenance, bypass, and upset events; disclose gaps and extrapolation."
      evidence: "Meter completeness report; production calendar; event logs"
    - id: dq_mass_balance
      applies_to: "Each route"
      requirement: "Reconcile lead and total mass across inputs, products, internal loops, residues, emissions, and stock changes; investigate rather than hide unexplained differences."
      evidence: "Lead balance; total mass balance; stock reconciliation; corrective-action notes"
    - id: dq_emission_coverage
      applies_to: "Direct emissions"
      requirement: "Include captured stack releases and quantified diffuse releases, identify particle fraction and compartment, and exclude captured material returned to process."
      evidence: "Monitoring plan; stack tests; diffuse-emission method; control-device records"
    - id: dq_upstream_representativeness
      applies_to: "Purchased inputs"
      requirement: "Use upstream datasets matching delivered geography, grade, technology, and reference conditions, and disclose substitutions."
