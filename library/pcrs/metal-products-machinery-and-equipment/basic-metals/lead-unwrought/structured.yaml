validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm that the quantitative-reference output is unwrought lead, uses the verified Crude lead UUID and Mass/kg support chain, and declares all required qualifiers."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_route_selection
    applies_to: "Process map"
    rule: "Require a primary, secondary, or explicitly measured mixed-site route declaration; reject a dataset that silently combines route defaults or incompatible furnace scenarios."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_inventory_atomicity
    applies_to: "Inventory"
    rule: "Require each exchange to keep one chemical or physical identity, direction, flow type, property, unit, route condition, and destination; reject umbrella utilities, materials, wastes, or emissions."
    source_ids: []
  - rule_id: validate_uuid_support
    applies_to: "UUID-bearing and unresolved rows"
    rule: "Recheck every final UUID against public state 100, bilingual baseName, flow type, classification, property, and unit group; unresolved rows must retain their exact identity and receive a reviewed UUID before publication."
    source_ids: []
  - rule_id: validate_no_double_counting
    applies_to: "Utilities and emissions"
    rule: "Confirm that direct foreground CO2, SO2, lead, and particulate exclude upstream supply-chain emissions and that internal dust, slag, dross, or metal return loops are not counted as external flows."
    source_ids:
      - us-epa-ap42-primary-lead-1995
      - us-epa-ap42-secondary-lead-2010
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_balance_and_coverage
    applies_to: "Dataset completeness"
    rule: "Review lead balance, total mass balance, temporal coverage, stock changes, missing records, control bypasses, co-product allocation, and waste destinations; unresolved discrepancies or undocumented exclusions fail validation."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset for producer-gate unwrought lead"
  downstream_use: "Foreground input to lead fabrication, alloying, battery, construction, shielding, chemical, or other downstream lifecycle models when grade and route match"
  allowed_use: "Product systems requiring 1 kg of declared-grade unwrought lead at the producer gate, with route, geography, technology, allocation, and recycled-content convention matched"
  excluded_use: "Lead ore/concentrate, lead scrap, lead oxide, semi-finished lead, fabricated articles, batteries, unidentified mixed lead products, or a cradle-to-grave claim without added upstream/downstream processes"
  required_metadata: "Product grade and composition; crude/refined/alloy state; casting form; primary/secondary/mixed route; feed origin; furnace and refining technology; geography; reporting period; allocation method; recycled-content convention; control technology; data sources; unresolved substitutions"
  required_quality_disclosure: "Primary-data share; meter and assay coverage; lead and total mass-balance results; temporal gaps; diffuse-emission method; uncertainty; co-product treatment; residue destinations; upstream dataset representativeness"
  update_trigger: "Change in feed mix, primary/secondary share, furnace or refining technology, product grade, sulfur or dust control, energy supply, allocation method, residue destination, reporting period, or a material mass-balance/quality finding"
