allocation_rules:
  - rule_id: alloc_01
    applies_to: "Shared lines and meters"
    rule: "Prefer physical subdivision or route-specific metering. If unavoidable shared burdens remain, allocate by a measured causal driver such as machine time, metered energy, or processed mass and disclose the driver and shares."
    source_ids: []
  - rule_id: alloc_02
    applies_to: "Steel scrap and process wastes"
    rule: "Report each waste output at the foreground boundary and its destination. Do not credit avoided primary production within the foreground inventory; any recycling or treatment consequence belongs to the selected downstream model."
    source_ids: []
  - rule_id: alloc_03
    applies_to: "Co-products"
    rule: "If a saleable co-product is unavoidable, disclose its identity and quantity, justify the allocation hierarchy and factor, and test a physically plausible alternative. Do not encode an undisclosed credit as a negative input."
    source_ids: []
