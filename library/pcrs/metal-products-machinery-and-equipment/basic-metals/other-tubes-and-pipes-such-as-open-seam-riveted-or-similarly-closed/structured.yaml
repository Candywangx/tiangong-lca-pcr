validation_rules:
  - rule_id: val_identity
    applies_to: "Product and classification"
    rule: "Confirm CPC 41289 identity, declared steel and dimensional qualifiers, and exclusion of seamless, welded, cast, fitting, drilling, casing, tubing, and non-ferrous products."
    source_ids:
      - src_unsd_cpc_3_0_2025
  - rule_id: val_route
    applies_to: "Conditional process rows"
    rule: "Verify that mechanical-closure exchanges are absent for open-seam release, rivets occur only for the riveted route, and no welding material, welding electricity, or welded-product flow is hidden in the dataset."
    source_ids:
      - src_nist_riveted_pipe_2009
      - src_epa_steel_pipe_1995
  - rule_id: val_reference
    applies_to: "Quantitative reference"
    rule: "Confirm exactly 1 kg net conforming, unpackaged reference product after inspection and consistent normalization of every exchange."
    source_ids: []
  - rule_id: val_mass_balance
    applies_to: "Steel-bearing flows"
    rule: "Reconcile flat-steel input, rivets where applicable, conforming product, segregated steel scraps, rejects, and documented stock change; investigate and explain the residual."
    source_ids: []
  - rule_id: val_energy
    applies_to: "Electricity and fuel"
    rule: "Confirm native meter records, unit conversions, route assignment, gas reference conditions, and separation of preparation, closure, and release energy."
    source_ids: []
  - rule_id: val_waste
    applies_to: "Process wastes"
    rule: "Confirm atomic separation of spent coolant, spent alkaline liquor, cleaning wastewater, and steel scrap, with no duplicate mass or hidden combined waste row."
    source_ids:
      - src_jrc_fmp_bref_2022
  - rule_id: val_emissions
    applies_to: "Direct fossil carbon dioxide"
    rule: "Recalculate each direct fossil carbon-dioxide output from its corresponding collected fuel record or compare with direct measurement; exclude upstream electricity and fuel-supply emissions."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for CPC 41289 steel tubes and pipes"
  downstream_use: "Construction of process and lifecyclemodel projections using the declared route and background links"
  allowed_use: "Product systems matching the declared steel grade, dimensions, seam route, surface state, plant geography and factory-gate state"
  excluded_use: "Seamless, welded, cast, fitting, drilling, casing, tubing or non-ferrous products; generic substitution without qualifier review"
  required_metadata: "Reporting period; plant and geography; grade and dimensions; closure route; seam structure; surface and heat-treatment state; gas conditions; waste destinations; allocation"
  required_quality_disclosure: "Metering, calibration, concentration, stock reconciliation, conditional routes, estimates, allocation, balances and unresolved UUID status"
  update_trigger: "Material change in product identity, closure route, plant technology, energy or material supply, conditioning, waste destination, allocation, data period or public UUID status"
data_sources:
