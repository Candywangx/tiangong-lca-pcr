system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The boundary begins with purchased flat steel, electricity, cutting fluid, gases, water, sodium hydroxide, and route-specific rivets at the manufacturing-site gate. It includes cutting, edge preparation, roll forming, open-seam release or mechanical closure, optional thermal treatment and alkaline cleaning, rinsing, straightening and finishing where performed, inspection, internal handling, and segregation of wastes. It ends with the net conforming product released at the factory gate and all reported wastes and direct fossil carbon dioxide leaving the foreground system."
      source_ids: []
    - rule_id: sb_01
      applies_to: "Product identity"
      rule: "Include only the residual CPC 41289 boundary; seamless and welded tube routes and the other listed exclusions require separate product systems."
      source_ids:
        - src_unsd_cpc_3_0_2025
    - rule_id: sb_02
      applies_to: "Foreground operations"
      rule: "Model cutting and edge preparation, repeated-roll forming, route-specific mechanical closure, applicable conditioning, inspection, and release as distinguishable foreground operations."
      source_ids:
        - src_doe_roll_forming_2003
        - src_nist_riveted_pipe_2009
        - src_epa_steel_pipe_1995
        - src_jrc_fmp_bref_2022
    - rule_id: sb_03
      applies_to: "Recursive inputs"
      rule: "Do not absorb a purchased CPC 41289 tube or pipe into the same reference-product dataset. If one is used, model it as a separately disclosed upstream dataset and report its mass and purpose."
      source_ids: []
    - rule_id: sb_04
      applies_to: "Background interfaces"
      rule: "Link purchased steel, electricity, gases, water, chemicals, fluids, and waste treatment to datasets matching the declared geography, technology, product state, and delivery boundary."
      source_ids: []
