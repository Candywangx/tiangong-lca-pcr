validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference_flow"
    rule: "Fail validation if net product thickness is not greater than 0.15 mm or if grade/alloy, product form, dimensions, temper, surface finish, edge condition, geography, technology or reporting period is absent."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: val_inventory_atomicity
    applies_to: "process_inventory"
    rule: "Fail validation when one inventory row combines multiple utilities, gases, chemicals, wastes or emissions, or when a selected flow is a collection or future selector instead of one concrete exchange."
    source_ids: []
  - rule_id: val_mass_normalization
    applies_to: "inventory_amounts"
    rule: "Recalculate every amount to 1,000 kg net conforming product and verify unit conversions, excluded packaging, and separate treatment of nonconforming product and scrap."
    source_ids: []
  - rule_id: val_route_completeness
    applies_to: "conditional_exchanges"
    rule: "For each gas, acid, alkali and waste row, require either a measured amount or documented route-specific non-applicability; verify declared equipment against process and purchasing records."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: val_copper_balance
    applies_to: "copper_bearing_flows"
    rule: "Require a documented copper-bearing mass balance across slab input, conforming product, copper scrap, residues and inventory change; investigate and disclose unexplained imbalance."
    source_ids: []
  - rule_id: val_direct_co2
    applies_to: "direct_emissions"
    rule: "Verify direct fossil carbon dioxide against metered fossil-fuel carbon and exclude upstream emissions from purchased electricity, fuels, gases, chemicals and slab datasets."
    source_ids: []
  - rule_id: val_uuid_and_locale
    applies_to: "tiangong_identity"
    rule: "Require state-100 Tiangong UUIDs to match flow type, property and unit group, and require the official Tiangong Chinese baseName in the Chinese rendering; keep audited unresolved rows UUID-empty."
    source_ids: []
  - rule_id: val_source_and_range_status
    applies_to: "evidence"
    rule: "Verify every cited source against original text; treat all missing external ranges listed in manifest review metadata as unresolved evidence needs and never infer a range from one case or unverified metadata."
    source_ids: []
published_dataset_profile:
  dataset_role: "Gate-to-gate foreground dataset for flat copper and copper-alloy plate, sheet, or strip fabrication"
  downstream_use: "secondary_dataset; background_dataset after independent review and resolution of product-specific upstream links and material evidence gaps"
  allowed_use: "Product carbon footprint and LCA models that need a disclosed flat-copper-product fabrication stage consistent with the declared slab starting condition and product qualifiers"
  excluded_use: "Copper mining, smelting, refining or slab-production datasets; foil at or below 0.15 mm; wire, rod, tube or fabricated component production; undisclosed cradle-to-gate claims; generic substitution across alloy, temper or surface routes without sensitivity review"
  required_metadata: "canonical PCR id; product UUID; grade/alloy; product form; thickness; dimensions; temper; surface and edge condition; slab dataset; rolling/annealing/pickling route; geography; technology; reporting period; allocation; data sources; unresolved identity and range status"
  required_quality_disclosure: "primary-data share; meter and scale coverage; temporal representativeness; missing-data estimation; mass-balance closure; allocation sensitivity; internal recycling treatment; upstream dataset choices; unresolved Tiangong identities and range-evidence needs"
  update_trigger: "Change in alloy or product form, thickness side of the 0.15 mm boundary, rolling or furnace technology, annealing atmosphere, pickling chemistry, recovery route, site geography, allocation method, upstream slab dataset, or material change in measured energy, water, yield, waste or direct emissions"
