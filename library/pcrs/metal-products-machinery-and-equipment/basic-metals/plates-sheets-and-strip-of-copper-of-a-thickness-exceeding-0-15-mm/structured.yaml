allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared_foreground_operations"
    rule: "Prefer process subdivision and direct metering for product campaigns, rolling lines, furnaces and treatment units before applying allocation."
    source_ids: []
  - rule_id: allocation_internal_recycling
    applies_to: "internal_copper_and_oil_loops"
    rule: "Exclude internally recirculated copper, rolling oil, acid and water from gross boundary exchanges; record only make-up inputs and materials that leave the foreground boundary, and disclose loop losses."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_multiple_products
    applies_to: "multiple_saleable_products"
    rule: "When one campaign yields more than one saleable plate, sheet or strip product and direct subdivision is impracticable, allocate shared burdens by net conforming product mass unless a documented causal relation justifies another basis; disclose products, masses and sensitivity."
    source_ids: []
  - rule_id: allocation_exported_scrap
    applies_to: "exported_copper_scrap"
    rule: "Record exported copper trim and offcuts as a waste output at measured mass without an avoided-burden credit inside this gate-to-gate foreground dataset; any downstream recycling allocation or substitution belongs to the consuming lifecycle model and shall be disclosed."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "flat_copper_product_fabrication"
      flow_role: "cast slab input and conforming product output"
      record_type: "scale record and production order"
      raw_fields: "timestamp; batch; alloy/grade; dimensions; gross mass; tare; net mass; product disposition"
      collection_method: "calibrated inbound/outbound or process scales reconciled to production orders"
      unit: "kg"
      frequency: "each lot or coil"
      temporal_coverage: "representative campaign and at least the declared reporting period"
      site_scope: "all in-scope lines and products"
      aggregation_rule: "sum accepted slab and conforming product masses, then normalize to 1,000 kg product"
      quality_evidence: "calibration certificates; tare checks; order reconciliation; rejected-product log"
    - protocol_id: cp_energy_records
      process_id: "flat_copper_product_fabrication"
      flow_role: "purchased electricity"
      record_type: "revenue meter, submeter and invoice"
      raw_fields: "meter id; opening/closing readings; kWh; line; equipment; operating hours; allocation key"
      collection_method: "reconcile site invoice with line and major-equipment submeters"
      unit: "kWh and MJ"
      frequency: "continuous or shift readings, aggregated monthly"
      temporal_coverage: "full reporting period including representative production and downtime"
      site_scope: "all directly serving rolling, furnace, pumping, ventilation, treatment and finishing equipment"
      aggregation_rule: "subtract excluded loads and allocate residual shared loads by documented causal driver"
      quality_evidence: "meter calibration; invoice reconciliation; submeter coverage statement"
    - protocol_id: cp_gas_records
      process_id: "flat_copper_product_fabrication"
      flow_role: "natural gas, gaseous nitrogen and gaseous hydrogen"
      record_type: "flow meter and supplier record"
      raw_fields: "gas identity; meter id; volume; temperature; pressure; energy content or purity; equipment; batch"
      collection_method: "reconcile calibrated line meters with supplier invoices and tank/pipe balance"
      unit: "m3 at declared reference conditions"
      frequency: "continuous or per campaign"
      temporal_coverage: "full reporting period"
      site_scope: "all in-scope furnaces, dryers and protective-atmosphere systems"
      aggregation_rule: "sum each gas separately and normalize by conforming product mass"
      quality_evidence: "calibration; supplier certificate; reference-condition conversion; leak and balance check"
    - protocol_id: cp_consumable_records
      process_id: "flat_copper_product_fabrication"
      flow_role: "cold-rolling oil, sulfuric acid and sodium hydroxide"
      record_type: "inventory issue, purchase and bath-management record"
      raw_fields: "chemical identity; formulation; concentration; issued mass; returned mass; tank level; line; batch"
      collection_method: "reconcile stores issues and tank changes with line logs; exclude documented recirculation"
      unit: "kg solution or product as delivered"
      frequency: "each issue and bath change"
      temporal_coverage: "full reporting period"
      site_scope: "all in-scope rolling, pickling and directly serving treatment systems"
      aggregation_rule: "net external make-up by substance, normalized by conforming product mass"
      quality_evidence: "supplier specification; concentration analysis; tank calibration; stock reconciliation"
    - protocol_id: cp_water_records
      process_id: "flat_copper_product_fabrication"
      flow_role: "net process water"
      record_type: "water meter and water-balance record"
      raw_fields: "source; meter id; volume or mass; density if converted; use area; recirculated volume; discharge"
      collection_method: "calibrated meters and documented water balance by use area"
      unit: "kg, with source volume retained"
      frequency: "continuous or daily"
      temporal_coverage: "full reporting period"
      site_scope: "roll cooling, surface treatment, rinsing, brushing and directly serving treatment"
      aggregation_rule: "external make-up less documented out-of-scope use; do not subtract water leaving in waste unless required by the site balance"
      quality_evidence: "meter calibration; water-balance closure; density and conversion record"
    - protocol_id: cp_output_records
      process_id: "flat_copper_product_fabrication"
      flow_role: "copper scrap, spent rolling oil and spent pickling solution"
      record_type: "scale ticket, waste manifest and transfer analysis"
      raw_fields: "identity; mass; alloy or composition; acid concentration; dissolved copper; oil/water content; destination; recovery route"
      collection_method: "weigh each container or transfer and reconcile with handler documentation"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "full reporting period"
      site_scope: "all in-scope generation points and storage"
      aggregation_rule: "sum each waste separately after excluding documented internal return"
      quality_evidence: "scale calibration; manifest; laboratory analysis; receiver and recovery evidence"
    - protocol_id: cp_direct_co2_calculation
      process_id: "flat_copper_product_fabrication"
      flow_role: "direct fossil carbon dioxide"
      record_type: "fuel meter, supplier composition and calculation record"
      raw_fields: "fuel volume or mass; carbon content; reference conditions; oxidation assumption; equipment; period"
      collection_method: "calculate fossil carbon dioxide from collected fuel carbon entering direct foreground combustion or gas generation"
      unit: "kg CO2"
      frequency: "monthly and reporting-period total"
      temporal_coverage: "full reporting period"
      site_scope: "all in-scope direct fossil combustion and on-site carbon-bearing protective-gas generation"
      aggregation_rule: "sum source-specific calculated emissions and normalize by conforming product mass"
      quality_evidence: "metering evidence; supplier certificate or measured carbon content; formula version; reviewer check"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = campaign exchange amount × 1,000 / campaign net mass of conforming final product"
      inputs:
        - "campaign exchange amount"
        - "net conforming product mass"
      output: "amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_volume_to_mass
      applies_to: "water and delivered liquid solutions when only volume is measured"
      rule: "mass = measured volume × density at the recorded temperature; keep concentration on an as-delivered basis"
      inputs:
        - volume
        - density
        - temperature
