measurement_rules:
  - id: reference_dry_mass
    applies_to: "reference product and all mass-normalized exchanges"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Normalize to 1,000 kg net dry reference product. Record gross mass and measured moisture separately and do not count free water as product mass."
  - id: gas_mass_conversion
    applies_to: "natural gas, hydrogen, oxygen, and measured off-gas inputs or outputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Preserve the original standard volume, reference temperature, reference pressure, composition, and density factor, then convert to mass for the normalized inventory."
  - id: energy_preservation
    applies_to: "electricity and fuels"
    required_property_ref:
      name: "Energy or fuel mass"
      uuid: ""
    required_unit: "kWh, MJ, or kg"
    rule: "Preserve metered electricity in kWh and each fuel in its measured unit; disclose net/gross calorific basis for any energy conversion and never aggregate unlike carriers before normalization."
  - id: product_quality_basis
    applies_to: "DRI, HBI, sponge iron, and high-purity iron"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "kg/kg or % by mass"
    rule: "Report each quality result on its laboratory basis and disclose whether metallic iron, total iron, metallization, purity, carbon, gangue, and moisture are wet- or dry-basis measurements."
process_map:
  - id: direct_reduction
    name: "Direct reduction and product cooling"
    inclusion: "conditional"
    inclusion_condition: "Include when producing DRI or sponge iron, or when DRI is an on-site precursor to high-purity iron."
    role: "reduction of iron oxide without melting, plus cooling and gas/water treatment"
    quantitative_reference: "1,000 kg dry DRI or sponge-iron output"
  - id: hot_briquetting
    name: "Hot briquetting and cooling"
    inclusion: "conditional"
    inclusion_condition: "Include when hot DRI is compacted into HBI or an equivalent briquetted primary form."
    role: "densification and dispatch conditioning"
    quantitative_reference: "1,000 kg dry HBI output"
  - id: purity_refining
    name: "High-purity iron production and forming"
    inclusion: "conditional"
    inclusion_condition: "Include when the reference product is iron of at least 99.94% purity; select only rows applicable to the declared electrolytic or metallurgical purification route."
    role: "purification, separation/refining, and forming into lump or pellet form"
    quantitative_reference: "1,000 kg dry high-purity iron output"
