allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "route unit operations and separately metered products"
    rule: "Avoid allocation by subdividing reduction, briquetting, purification, gas generation, wastewater treatment, and recovery operations wherever their inputs and outputs are independently measured."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_internal_recycling
    applies_to: "recycled top gas, water, DRI fines, slag, and electrolyte"
    rule: "Treat internal recycling as an internal loop: count only net make-up inputs and net releases across the foreground boundary and do not create a credit for internal circulation."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_exported_coproduct
    applies_to: "exported process gas, captured carbon dioxide, recovered fines, slag, or other marketable co-product"
    rule: "Use system expansion only when the substituted product, equivalent function, market, and avoided production dataset are documented; report the substitution credit separately. Otherwise report an unallocated inventory and an explicit sensitivity case."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_multiple_products
    applies_to: "simultaneous saleable DRI, HBI, or high-purity iron outputs"
    rule: "Prefer separate campaigns or measured process subdivision. If inseparable, allocate residual shared burdens by dry product mass and disclose product-specific sensitivity to an economic allocation."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_dr_materials
      process_id: "direct_reduction"
      flow_role: "iron-bearing feed, oxygen, and reductant materials"
      record_type: "weighbridge, feeder, inventory, and supplier records"
      raw_fields: "timestamp; material_id; wet_mass; moisture; composition; standard_volume_if_gas; temperature; pressure"
      collection_method: "reconcile calibrated meters and stock changes by campaign"
      unit: "kg; Nm3 where originally metered"
      frequency: "batch and monthly"
      temporal_coverage: "representative 12 months; shorter period justified"
      site_scope: "all direct-reduction units and shared supply systems"
      aggregation_rule: "dry mass or gas mass allocated from direct meters; shared meters allocated by documented operating driver"
      quality_evidence: "calibration, supplier certificate, stock reconciliation, composition and moisture test"
    - protocol_id: cp_dr_energy
      process_id: "direct_reduction"
      flow_role: "natural gas, hydrogen, coal, and electricity"
      record_type: "custody meter, submeter, fuel issue, and stock records"
      raw_fields: "timestamp; carrier; quantity; unit; calorific_basis; gas_composition; meter_id; process_id"
      collection_method: "reconcile purchases, generation, exports, and stock changes"
      unit: "kWh; MJ; kg; Nm3"
      frequency: "continuous or batch; monthly reconciliation"
      temporal_coverage: "representative 12 months"
      site_scope: "direct-reduction reactor, reformer, compressors, cooling, screening, and controls"
      aggregation_rule: "net imported carrier per reporting period, with internal gas recycling excluded"
      quality_evidence: "meter calibration, invoices, gas analysis, stock reconciliation"
    - protocol_id: cp_dr_water
      process_id: "direct_reduction"
      flow_role: "process-water make-up"
      record_type: "water meter and balance records"
      raw_fields: "timestamp; source; make_up_volume; density; recycled_volume; discharge_volume"
      collection_method: "meter net make-up and reconcile circuit balance"
      unit: "kg; m3"
      frequency: "continuous; monthly reconciliation"
      temporal_coverage: "representative 12 months"
      site_scope: "gas scrubbing, cooling, dedusting, and direct-reduction treatment"
      aggregation_rule: "net make-up mass per reporting period"
      quality_evidence: "meter calibration and water-balance closure"
    - protocol_id: cp_dr_products
      process_id: "direct_reduction"
      flow_role: "DRI pellet and lump outputs"
      record_type: "certified scale, dispatch, and laboratory records"
      raw_fields: "batch_id; gross_mass; moisture; form; total_iron; metallic_iron; metallization; carbon; gangue; size; temperature"
      collection_method: "sum conforming dispatch mass and convert to dry mass"
      unit: "kg"
      frequency: "batch"
      temporal_coverage: "representative 12 months"
      site_scope: "all product discharge and dispatch points"
      aggregation_rule: "separate product forms and off-specification material before normalization"
      quality_evidence: "scale calibration, certificate of analysis, moisture and size test"
    - protocol_id: cp_dr_wastes
      process_id: "direct_reduction"
      flow_role: "wastewater and disposed DRI fines"
      record_type: "transfer meter, scale, manifest, and treatment records"
      raw_fields: "timestamp; waste_id; mass_or_volume; solids; moisture; destination; recovery_status"
      collection_method: "reconcile transfers with internal returns and treatment receipts"
      unit: "kg; m3"
      frequency: "batch or continuous; monthly"
      temporal_coverage: "representative 12 months"
      site_scope: "all direct-reduction waste exits"
      aggregation_rule: "net external waste transfer by atomic waste flow"
      quality_evidence: "calibrated meter or scale, waste manifest, treatment receipt"
    - protocol_id: cp_dr_air
      process_id: "direct_reduction"
      flow_role: "carbon dioxide, carbon monoxide, and particulate matter"
      record_type: "continuous emissions monitor, stack test, fuel/gas composition, flare, capture, and production records"
      raw_fields: "source_id; pollutant; concentration; flow_rate; duration; fuel_carbon; vented_gas; captured_co2"
      collection_method: "integrate monitors; fill approved gaps with documented mass balance"
      unit: "kg; mg/Nm3; Nm3"
      frequency: "continuous and required stack-test interval"
      temporal_coverage: "representative 12 months including normal maintenance"
      site_scope: "all stacks, vents, flares, and quantified fugitives"
      aggregation_rule: "sum releases by pollutant; subtract verified capture; normalize by dry output"
      quality_evidence: "monitor calibration, stack-test report, carbon and gas balance"
    - protocol_id: cp_hb_materials
      process_id: "hot_briquetting"
      flow_role: "hot DRI feed"
      record_type: "transfer scale and temperature records"
      raw_fields: "timestamp; wet_mass; moisture; temperature; transfer_origin"
      collection_method: "reconcile hot DRI transfer with briquette output and fines"
      unit: "kg"
      frequency: "batch or continuous"
      temporal_coverage: "representative 12 months"
      site_scope: "all HBI lines"
      aggregation_rule: "dry feed mass by line and campaign"
      quality_evidence: "scale calibration, moisture and temperature records"
    - protocol_id: cp_hb_energy_water
      process_id: "hot_briquetting"
      flow_role: "electricity and cooling-water make-up"
      record_type: "submeter and water-meter records"
      raw_fields: "timestamp; electricity; make_up_water; recycled_water; meter_id"
      collection_method: "meter line consumption and reconcile shared services"
      unit: "kWh; kg; m3"
      frequency: "continuous; monthly"
      temporal_coverage: "representative 12 months"
      site_scope: "pressing, conveying, cooling, screening, and controls"
      aggregation_rule: "net electricity and water make-up by line"
      quality_evidence: "meter calibration and utility balance"
    - protocol_id: cp_hb_products_wastes
      process_id: "hot_briquetting"
      flow_role: "HBI output and disposed fines"
      record_type: "certified scale, dispatch, laboratory, and waste records"
      raw_fields: "batch_id; product_mass; moisture; density; size; fines_mass; destination"
      collection_method: "separate conforming HBI, internally returned fines, and external waste"
      unit: "kg"
      frequency: "batch"
      temporal_coverage: "representative 12 months"
      site_scope: "all HBI lines and dispatch points"
      aggregation_rule: "dry net output and external waste by campaign"
      quality_evidence: "scale calibration, product certificate, waste manifest"
    - protocol_id: cp_hb_air
      process_id: "hot_briquetting"
      flow_role: "particulate matter"
      record_type: "stack test, dust-collector, operating-hour, and production records"
      raw_fields: "source_id; concentration; flow_rate; duration; collector_status"
      collection_method: "integrate measured releases and document fugitive estimate"
      unit: "kg; mg/Nm3"
      frequency: "stack-test interval; monthly estimate"
      temporal_coverage: "representative 12 months"
      site_scope: "briquetting, cooling, screening, and transfer points"
      aggregation_rule: "sum controlled and quantified fugitive releases"
      quality_evidence: "stack-test report and dust-collector maintenance record"
    - protocol_id: cp_pr_materials
      process_id: "purity_refining"
      flow_role: "DRI precursor, electrolytes, and refining slag"
      record_type: "batch scale, tank level, composition, and inventory records"
      raw_fields: "batch_id; material_id; mass; concentration; composition; stock_change; route"
      collection_method: "reconcile fresh input, recovered internal material, and stock change"
      unit: "kg"
      frequency: "batch and monthly"
      temporal_coverage: "representative production campaign or 12 months"
      site_scope: "all purification, melting, and refining units"
      aggregation_rule: "net fresh material input by atomic material and route"
      quality_evidence: "scale/tank calibration, assay, batch sheet, stock reconciliation"
    - protocol_id: cp_pr_energy_water
      process_id: "purity_refining"
      flow_role: "electricity and process-water make-up"
      record_type: "submeter and water-meter records"
      raw_fields: "timestamp; unit_operation; electricity; make_up_water; recycled_water"
      collection_method: "meter route unit operations and reconcile shared services"
      unit: "kWh; kg; m3"
      frequency: "continuous or batch; monthly"
      temporal_coverage: "representative production campaign or 12 months"
      site_scope: "electrolysis, melting, refining, forming, cooling, and controls"
      aggregation_rule: "net electricity and water make-up by declared route"
      quality_evidence: "meter calibration and utility balance"
    - protocol_id: cp_pr_products
      process_id: "purity_refining"
      flow_role: "high-purity iron output"
      record_type: "certified scale, assay, dispatch, and form records"
      raw_fields: "batch_id; mass; moisture; iron_purity; impurity_panel; form; size; temperature"
      collection_method: "sum conforming product separately by form and purity grade"
      unit: "kg"
      frequency: "batch"
      temporal_coverage: "all campaigns in reporting period"
      site_scope: "all final forming and dispatch points"
      aggregation_rule: "dry net conforming output by product form"
      quality_evidence: "scale calibration, certificate of analysis, impurity detection limits"
    - protocol_id: cp_pr_wastes
      process_id: "purity_refining"
      flow_role: "spent electrolyte and spent refining slag"
      record_type: "tank transfer, scale, waste manifest, and recovery records"
      raw_fields: "batch_id; waste_id; mass; concentration; moisture; destination; recovery_status"
      collection_method: "measure net external transfer after internal recovery"
      unit: "kg"
      frequency: "batch and monthly"
      temporal_coverage: "all campaigns in reporting period"
      site_scope: "all purification and refining waste exits"
      aggregation_rule: "aggregate each atomic waste separately by route"
      quality_evidence: "meter/scale calibration, assay, waste manifest, treatment receipt"
    - protocol_id: cp_pr_air
      process_id: "purity_refining"
      flow_role: "particulate matter"
      record_type: "stack test, dust-collector, operating-hour, and production records"
      raw_fields: "source_id; concentration; flow_rate; duration; collector_status"
      collection_method: "integrate measured releases and document fugitive estimate"
      unit: "kg; mg/Nm3"
      frequency: "stack-test interval; monthly estimate"
      temporal_coverage: "all campaigns in reporting period"
      site_scope: "melting, refining, forming, and material handling"
      aggregation_rule: "sum controlled and quantified fugitive releases"
      quality_evidence: "stack-test report and dust-collector maintenance record"
  calculation_rules:
    - id: calc_dry_mass_normalization
      applies_to: "mass inputs and outputs"
      rule: "normalized amount = net measured dry amount / net dry reference-product mass × 1,000 kg"
      inputs:
        - "gross mass"
        - moisture
        - "stock change"
        - "internal return"
        - "dry reference-product mass"
      output: "kg per 1,000 kg dry reference product"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_energy_normalization
      applies_to: "electricity and fuel"
      rule: "normalized amount = net carrier consumed / net dry reference-product mass × 1,000 kg; preserve carrier-specific units and conversion basis"
      inputs:
        - "meter readings"
        - imports
        - exports
        - "stock change"
        - "calorific basis"
        - "dry reference-product mass"
      output: "kWh, MJ, or kg per 1,000 kg dry reference product"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_gas_mass
      applies_to: "natural gas, hydrogen, oxygen, and measured gases"
      rule: "gas mass = corrected standard volume × verified density from measured composition and declared reference conditions"
      inputs:
        - volume
        - temperature
        - pressure
        - composition
        - "reference conditions"
        - density
      output: "kg gas"
      source_ids:
        - doe-green-hydrogen-iron-2018
    - id: calc_route_weighting
      applies_to: "multi-site or multi-route dataset"
      rule: "weighted exchange = sum(route exchange × conforming dry route output) / sum(conforming dry output); retain separate route results in supporting data"
      inputs:
        - "route-specific normalized exchange"
        - "dry product output"
        - "product form and quality"
      output: "production-mass-weighted exchange"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_direct_air_release
      applies_to: "direct air emissions"
      rule: "release = integrated monitored release + justified gap estimate + vent and flare release - verified capture; do not subtract biogenic or upstream credits here"
      inputs:
        - concentration
        - "gas flow"
        - time
        - composition
        - "vent/flare records"
        - "capture records"
      output: "kg pollutant per reporting period and per 1,000 kg product"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_balance_checks
      applies_to: "process validation"
      rule: "close total mass, iron, and carbon balances for each applicable process; report residuals and explain material deviations"
      inputs:
        - "all measured inputs"
        - outputs
        - "stock changes"
        - "recycled flows"
        - "iron assays"
        - "carbon assays"
      output: "mass-, iron-, and carbon-balance residuals"
      source_ids:
        - worldsteel-lci-methodology-2017
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Product family, form, route, purity/metallization, carbon, gangue, moisture, size, and hot/cold delivery state shall identify one saleable product."
      evidence: "dispatch specification and certificate of analysis"
    - id: dq_technology
      applies_to: "route inventory"
      requirement: "Unit operations, reductant, gas generation, internal recycling, CCUS, briquetting, purification, and treatment shall match the declared route; mixed routes shall remain traceable."
      evidence: "process-flow diagram, meter map, and route ledger"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Prefer 12 consecutive representative months. A shorter period shall cover the full operating pattern and be justified."
      evidence: "dated production, utility, maintenance, and laboratory records"
    - id: dq_geography
      applies_to: "upstream links"
      requirement: "Electricity and other material datasets shall represent the actual supplier or production region and technology where material."
      evidence: "supplier identity, grid contract, and dataset metadata"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Include all energetic inputs and all known material, waste, water, and emission flows; document exclusions and their mass, energy, and environmental relevance."
      evidence: "completeness checklist, meter reconciliation, and exclusion register"
    - id: dq_measurement
      applies_to: "measured and calculated values"
      requirement: "Retain calibration status, raw units, conversions, allocation keys, uncertainty, detection limits, and data-gap treatment so results are reproducible."
      evidence: "calibration certificates, calculation workbook, QA review"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "Confirm that the normalized output equals 1,000 kg net dry mass and that all required qualifiers are present and mutually consistent."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_route_rows
    applies_to: "process inventory"
    rule: "Confirm that every included row belongs to the declared route, every applicable atomic exchange is present, and non-applicable alternative rows are absent rather than zero-filled."
    source_ids:
      - iea-iron-steel-roadmap-2020
      - li-high-purity-iron-2020
  - rule_id: validation_balances
    applies_to: "direct reduction, briquetting, and purity refining"
    rule: "Perform total mass and iron balances for every included process and a carbon balance for carbon-bearing routes; investigate and disclose residuals."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_no_double_counting
    applies_to: "internal loops and upstream data"
    rule: "Verify that recycled top gas, water, DRI fines, slag, and electrolyte are not counted as both internal circulation and purchased inputs, and that upstream burdens appear once."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_emissions
    applies_to: "releases and capture"
    rule: "Reconcile monitored emissions with fuel, gas, carbon, vent, flare, pollution-control, and capture records and report below-detection-limit treatment."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_purity
    applies_to: "high-purity iron product"
    rule: "Verify iron purity by mass is at least 99.94% using a documented analytical method and impurity panel; a DRI metallization result is not a substitute for iron-purity conformance."
    source_ids:
      - unsd-cpc-30-2025
      - china-mof-tariff-2019
      - li-high-purity-iron-2020
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset derived from verified foreground production records"
  downstream_use: "upstream iron-bearing intermediate for steelmaking, alloy production, foundry, or other declared product systems; lifecyclemodel projection with route-specific upstream links"
  allowed_use: "modelling the declared product family, form, route, quality, site/geography, technology, and reporting period at the producing-works gate"
  excluded_use: "representing downstream crude or finished steel; substituting DRI for high-purity iron or one route for another without documented equivalence; public comparative assertions without a study-specific functional unit and review"
  required_metadata: "PCR id and version; product family and form; route and unit operations; total iron; metallic iron/metallization or iron purity; carbon; gangue; moisture; size; delivery state/temperature; site; geography; reporting period; allocation; cut-offs; upstream datasets; data quality and uncertainty"
  required_quality_disclosure: "foreground/secondary split; meter and assay coverage; missing-data treatment; mass/iron/carbon balance residuals; route weighting; allocation and substitution choices; exclusions; unresolved UUIDs and range-evidence status"
