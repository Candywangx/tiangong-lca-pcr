  semantic_boundary_review:
    result: canonical_identity_required
    explanation: "No material canonical PCR covers unwrought zinc at a zinc-production facility gate. Zinc powders, fabricated zinc products, zinc compounds, and zinc scrap are distinct product or waste boundaries."
  inventory_contract:
