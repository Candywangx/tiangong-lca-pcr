allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "separately metered unit operations"
    rule: "Avoid allocation by subdividing primary, secondary, acid-production, lead-recovery, residue-treatment, and utility operations wherever separate measurements exist."
    source_ids:
      - us-epa-ap42-zinc-smelting-1986
      - us-epa-ap42-secondary-zinc-1981
  - rule_id: allocation_joint_lead_zinc
    applies_to: "simultaneous lead and zinc production"
    rule: "Assign jointly consumed coke and direct process emissions using a documented plant-specific physical relationship or mass balance; report factors and prevent double counting between lead and zinc."
    source_ids:
      - ipcc-2006-metal-industry-zinc
  - rule_id: allocation_sulfuric_acid
    applies_to: "saleable sulfuric acid"
    rule: "First assign directly measured acid-plant inputs and outputs to acid production; allocate only residual inseparable burdens using a declared physical relationship, or economic allocation when no defensible physical relation exists, and report a sensitivity result."
    source_ids:
      - us-epa-ap42-zinc-smelting-1986
  - rule_id: allocation_waste_inputs
    applies_to: "zinc scrap and other waste feeds"
    rule: "State the waste-allocation convention, any incoming burden, pretreatment boundary, and credits; do not claim avoided primary zinc production inside the inventory unless the study applies and discloses a consequential substitution model."
    source_ids:
      - us-epa-ap42-secondary-zinc-1981
dataset_production:
  collection_protocols:
    - protocol_id: cp_feed_mass
      process_id: "zinc_unwrought_production"
