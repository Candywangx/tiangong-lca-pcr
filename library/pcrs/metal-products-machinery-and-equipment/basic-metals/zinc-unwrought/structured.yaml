      applies_to: "route-dependent operations"
      rule: "Include roasting, leaching, purification and electrowinning only when used; include sintering, reduction, retorting, condensation or secondary pretreatment only when used, and state every exclusion."
      source_ids:
        - us-epa-ap42-zinc-smelting-1986
        - us-epa-ap42-secondary-zinc-1981
        - ipcc-2006-metal-industry-zinc
    - rule_id: boundary_carbon_accounting
      applies_to: "fuels and carbonaceous reductants"
      rule: "Separate direct process carbon dioxide from fuel-combustion emissions and prevent double counting with upstream coke production or energy datasets."
      source_ids:
        - ipcc-2006-metal-industry-zinc
