      record_type: "weighbridge and laboratory records"
      raw_fields: "received mass; tare; moisture; zinc grade; lot id; supplier; feed route"
      collection_method: "reconcile weighbridge tickets with laboratory certificates and stock change"
      unit: "kg; mass fraction"
      frequency: "each receipt and monthly close"
      temporal_coverage: "representative continuous 12-month period"
      site_scope: "all feed receiving points in scope"
      aggregation_rule: "receipts plus opening stock minus closing stock, separated by feed type, then normalized"
      quality_evidence: "calibrated scale records; sampling plan; laboratory QA/QC; stock reconciliation"
    - protocol_id: cp_reagent_mass
      process_id: "zinc_unwrought_production"
      flow_role: "sulfuric acid input"
      record_type: "purchase, transfer, tank, and concentration records"
      raw_fields: "solution mass or volume; density; acid fraction; opening and closing stock; internal recycle"
      collection_method: "reconcile invoices and calibrated tank measurements; distinguish purchased, generated, recycled, and exported acid"
      unit: "kg solution; kg H2SO4"
      frequency: "batch or daily meter and monthly close"
      temporal_coverage: "same 12-month period as product output"
      site_scope: "all included acid storage and process circuits"
      aggregation_rule: "purchased plus transfer-in plus opening stock minus closing stock minus export, excluding internal recycle"
      quality_evidence: "tank calibration; density and assay method; invoice reconciliation"
    - protocol_id: cp_water_meter
      process_id: "zinc_unwrought_production"
      flow_role: "process water input"
      record_type: "water-meter records"
      raw_fields: "withdrawal; purchased water; returned pass-through water; meter id"
      collection_method: "read calibrated boundary and sub-meters and reconcile with utility invoices"
      unit: "kg or m3"
      frequency: "daily or monthly"
      temporal_coverage: "same 12-month period as product output"
      site_scope: "all included water entry points"
      aggregation_rule: "net consumed boundary water, converted with documented density when needed"
      quality_evidence: "meter calibration; water balance; missing-data log"
    - protocol_id: cp_electricity_meter
      process_id: "zinc_unwrought_production"
      flow_role: "purchased electricity input"
      record_type: "revenue and sub-meter records"
      raw_fields: "imported kWh; exported kWh; onsite generation; voltage; meter id"
      collection_method: "reconcile revenue meter, sub-meters, and onsite generation records"
      unit: "kWh"
      frequency: "interval or monthly"
      temporal_coverage: "same 12-month period as product output"
      site_scope: "all included electrical boundary meters"
      aggregation_rule: "imports minus exports; do not net onsite generation against fuel inputs without disclosure"
      quality_evidence: "meter calibration; invoices; energy balance"
    - protocol_id: cp_fuel_meter
      process_id: "zinc_unwrought_production"
      flow_role: "natural gas and metallurgical coke"
      record_type: "fuel meter, scale, inventory, and assay records"
      raw_fields: "gas volume; reference conditions; calorific value; coke mass; moisture; ash; carbon; stock change"
      collection_method: "reconcile gas bills and calibrated meters; reconcile coke receipts, scales, and stocks"
      unit: "m3; MJ; kg"
      frequency: "continuous or each delivery and monthly close"
      temporal_coverage: "same 12-month period as product output"
      site_scope: "all included fuel and reductant entry points"
      aggregation_rule: "consumption equals receipts plus opening stock minus closing stock, separated by material and use"
      quality_evidence: "meter and scale calibration; supplier assay; carbon balance"
    - protocol_id: cp_product_mass
      process_id: "zinc_unwrought_production"
