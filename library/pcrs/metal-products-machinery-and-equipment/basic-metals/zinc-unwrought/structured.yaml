validation_rules:
  - rule_id: validate_reference_output
    applies_to: "out_unwrought_zinc"
    rule: "Net saleable unwrought-zinc output shall equal 1 kg after normalization, and gross casting, internal remelt, off-spec return, and inventory change shall remain auditable."
    source_ids: []
  - rule_id: validate_product_boundary
    applies_to: "reference product"
    rule: "Reject a dataset whose reference output is zinc powder, zinc oxide, a fabricated zinc product, or zinc scrap rather than unwrought zinc metal."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_route_rows
    applies_to: "route-specific inventory"
    rule: "A route-specific row shall be present only when its declared operation is used; absence shall be supported by route documentation, not a zero entered without explanation."
    source_ids:
      - us-epa-ap42-zinc-smelting-1986
      - us-epa-ap42-secondary-zinc-1981
      - ipcc-2006-metal-industry-zinc
  - rule_id: validate_zinc_balance
    applies_to: "feed, product, co-product, slag, residue, and emissions"
    rule: "Complete a contained-zinc balance using consistent wet/dry bases and assays; investigate and explain the residual."
    source_ids: []
  - rule_id: validate_sulfur_balance
    applies_to: "sulfide concentrate, sulfuric acid, sulfur dioxide, and sulfur-bearing residue"
    rule: "Complete a sulfur balance when sulfide concentrate is processed and distinguish recovered acid from emitted sulfur dioxide."
    source_ids:
      - us-epa-ap42-zinc-smelting-1986
  - rule_id: validate_carbon_double_count
    applies_to: "natural gas, coke, and fossil carbon dioxide"
    rule: "Demonstrate that process CO2, onsite fuel-combustion CO2, upstream fuel burdens, and coke-production emissions are neither omitted nor double counted."
    source_ids:
      - ipcc-2006-metal-industry-zinc
  - rule_id: validate_uuid_gaps
    applies_to: "unresolved Tiangong flows"
    rule: "Before publication, resolve or explicitly review the unwrought-zinc reference product, electricity, leach-residue, and sulfur-dioxide UUID gaps; do not substitute a near match."
    source_ids: []
  - rule_id: validate_sources
    applies_to: "externally constrained rules"
    rule: "Every external source id shall resolve to the Data Sources table and shall be used only for the original-text-supported role stated there."
    source_ids: []
published_dataset_profile:
  dataset_role: "Facility-specific foreground production dataset suitable for reviewed publication as a secondary_dataset or background_dataset after source, UUID, and methodology review"
  downstream_use: "Attributional process inventories and lifecycle models requiring unwrought zinc at the production facility gate"
  allowed_use: "Use for the declared route, product grade, geography, technology, reference period, feed shares, electricity supply, fuel mix, water boundary, and allocation method"
  excluded_use: "Do not use as a generic zinc-mining dataset, fabricated-zinc dataset, zinc-compound dataset, or consequential recycling credit without a separate model and disclosure"
  required_metadata: "PCR id and version; product form and grade; route and feed shares; facility geography; technology; reference period; electricity and fuel supply; water boundary; co-products; allocation; cut-offs; upstream dataset identities"
  required_quality_disclosure: "Data coverage; meter and scale calibration; sampling and assay methods; temporal representativeness; mass, zinc, sulfur, energy, carbon, and water balance results; missing-data treatment; uncertainty; unresolved UUIDs; source applicability"
  update_trigger: "Change in route, feed shares or grade, product grade, major technology, electricity or fuel supply, emission control, water system, co-product recovery, allocation method, facility geography, or reference period"
