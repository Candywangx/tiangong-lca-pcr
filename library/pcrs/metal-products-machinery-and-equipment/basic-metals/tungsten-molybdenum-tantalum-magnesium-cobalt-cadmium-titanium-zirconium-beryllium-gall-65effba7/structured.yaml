allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Shared lines and utilities"
    rule: "Subdivide by separately metered process, campaign, line, or product before considering allocation. A data package that cannot establish a causal allocation basis shall disclose the gap and shall not claim full PCR conformance."
    source_ids: []
  - rule_id: allocation_internal_recycle
    applies_to: "Internal metal scrap, powder, water, and fluid loops"
    rule: "Keep internal recycle within the foreground system; record gross circulation for process control but count only make-up input and boundary-crossing outputs in the inventory."
    source_ids: []
  - rule_id: allocation_recovered_scrap
    applies_to: "Scrap or off-spec product leaving the boundary"
    rule: "Record the measured boundary flow and treatment destination. Do not subtract an avoided-production credit inside the foreground inventory unless the downstream modelling convention is separately declared."
    source_ids: []
  - rule_id: allocation_joint_outputs
    applies_to: "Unavoidable joint production"
    rule: "Use direct physical causality where documented. If no defensible causal relationship exists, retain all burdens on the declared reference product pending a reviewed allocation rule rather than silently applying economic allocation."
    source_ids: []
