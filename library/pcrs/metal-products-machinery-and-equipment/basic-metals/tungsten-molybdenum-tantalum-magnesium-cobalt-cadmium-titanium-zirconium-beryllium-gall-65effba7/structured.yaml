system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate
      applies_to: "Foreground product system"
      rule: "Include all actual unit operations from receipt of declared feedstock through final inspection and plant-gate readiness; exclude upstream primary metal production unless co-located and explicitly modelled."
      source_ids:
        - us-epa-nfmf-471
        - us-epa-nfmf-guidance-1989
    - rule_id: boundary_on_site_casting
      applies_to: "Casting before forming"
      rule: "Include on-site casting only when it produces billets, ingots, bars, strip, shot, or another precursor that is subsequently formed on the same site; disclose the mass link to forming."
      source_ids:
        - us-epa-nfmf-471
    - rule_id: boundary_surface_treatment
      applies_to: "On-site chemical or electrochemical treatment"
      rule: "Include cleaning, etching, and surface treatment performed at the forming site together with their baths, rinse water, wastewater, sludge, and releases."
      source_ids:
        - us-epa-nfmf-471
        - us-epa-nfmf-guidance-1989
    - rule_id: boundary_powder_route
      applies_to: "Magnesium powder"
      rule: "Include declared mechanical milling, abrading, or atomizing and associated conditioning; chemical precipitation and powder produced only as the final refining step require a different upstream methodology."
      source_ids:
        - us-epa-nfmf-471
        - us-epa-nfmf-guidance-1989
    - rule_id: boundary_actual_atomic_flows
      applies_to: "All included operations"
      rule: "Add every actual material, energy, water, gas, waste, and elementary exchange as a separate atomic flow; absence of a template row is not a cut-off permission."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Metal or alloy feedstock received at the reporting facility, identified by metal, composition, physical form, supplier, recycled-content claim, and measured incoming mass"
  starting_condition_role: "Upstream product entering plant-gate forming, fabrication, or magnesium-powder production"
  product_classification_scope: "One product within CPC 3.0 code 41602; classification is context and does not replace the declared material and product identity"
  recursive_input_rule: "A same-category wrought input that already embodies forming burdens shall be recorded as its exact purchased product flow with an upstream dataset and shall not be recursively re-expanded inside this foreground process"
  upstream_dataset_requirement: "Each purchased metal, alloy, fuel, electricity, chemical, gas, and water input shall link to a geographically and technologically appropriate upstream dataset or disclose the missing link"
  disclosure: "Declare included unit operations, outsourced operations, internal recycle loops, cut-off decisions, on-site treatment, allocation decisions, and whether casting, surface treatment, powder production, and packaging occur inside the boundary"
