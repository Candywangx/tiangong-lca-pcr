validation_rules:
  - rule_id: validate_identity
    applies_to: "Reference product"
    rule: "Confirm one covered metal or magnesium powder, exact product state, mass property, and every required qualifier; reject semantic reuse of the titanium-plate UUID for another product."
    source_ids:
      - un-cpc-3-structure-2025
  - rule_id: validate_route_boundary
    applies_to: "Process map"
    rule: "Confirm that exactly the applicable wrought or magnesium-powder route is active and that co-located casting, surface treatment, and powder operations follow the declared boundary."
    source_ids:
      - us-epa-nfmf-471
      - us-epa-nfmf-guidance-1989
  - rule_id: validate_atomic_inventory
    applies_to: "Inventory"
    rule: "Confirm that each row is one atomic exchange, every actual technology-specific flow is present, and generic utilities, fuels, metals, wastes, wastewater, or emissions are not substituted for exact identities."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "Metal and product mass"
    rule: "Require a documented feed, product, scrap, residue, and in-process inventory reconciliation; investigate material residuals and disclose unresolved losses."
    source_ids: []
  - rule_id: validate_energy_emissions
    applies_to: "Energy and direct emissions"
    rule: "Reconcile electricity and fuel to the production period; exclude upstream electricity emissions from direct rows; verify chemical form and compartment for each elementary flow."
    source_ids: []
  - rule_id: validate_foreground_quality
    applies_to: "Data package"
    rule: "Confirm temporal, site, technology, geography, measurement, uncertainty, allocation, and missing-data disclosures before publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "Plant-gate foreground product dataset for one declared wrought special non-ferrous metal product or magnesium metal powder"
  downstream_use: "secondary_dataset; background_dataset when reviewed for representativeness"
  allowed_use: "Product-footprint, process, and lifecycle-model studies that match the declared metal, grade, form, route, geography, technology period, and plant-gate state"
  excluded_use: "Proxying another metal, alloy, product form, powder chemistry, particle-size class, route, geography, or use-phase function without explicit review"
  required_metadata: "PCR id and version; exact product identity and UUID; grade or composition; geometry or particle size; temper or condition; surface finish; facility geography; technology and period; process map; included and outsourced operations; upstream links; recycled-content method; allocation; data quality; uncertainty"
  required_quality_disclosure: "Metering and estimation shares; mass-balance residual; temporal and technological representativeness; unresolved UUIDs and ranges; excluded operations; waste and emission characterization; allocation and cut-off decisions"
  update_trigger: "Change in principal metal or alloy, grade, product form, powder route, major equipment, heat or surface treatment, energy supply, abatement, supplier mix, recycled-content accounting, allocation, or a material change in normalized inventory"
