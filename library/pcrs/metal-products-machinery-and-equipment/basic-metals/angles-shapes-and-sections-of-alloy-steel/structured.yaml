allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared operations"
    rule: "Avoid allocation by sub-metering or subdividing processes and collect data directly attributable to the declared product where practicable."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_physical_fallback
    applies_to: "Unsubdividable multifunctional processes"
    rule: "If subdivision or system expansion is impracticable, use a documented causal physical relationship; use mass only when it is demonstrated to drive shared inputs and outputs."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_scrap_disclosure
    applies_to: "Recovered outputs"
    rule: "Record scrap and scale as measured outputs without an avoided-burden credit inside this gate-to-gate dataset; a downstream study may apply and disclose a consistent recycling method."
    source_ids:
      - ec-pef-method-2021
