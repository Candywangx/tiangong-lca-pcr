        - concentration
      output: "kg 100% NaOH equivalent"
      source_ids: []
    - id: calc_direct_co2
      applies_to: "direct fossil CO2 when not continuously measured"
      rule: "apply the declared carbon-balance or accepted jurisdictional method separately to each fossil fuel and reductant; retain carbon content, oxidation and non-energy-use assumptions"
      inputs:
        - "fuel and coke use"
        - "carbon analyses"
        - "accepted factors"
        - "measured carbon retained in products/residues"
      output: "kg direct fossil CO2"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity_and_route
      applies_to: "product and tin-bearing feed"
      requirement: "Link every batch to an exact material identity, product-or-waste status, grade/composition, route and boundary; do not merge primary and secondary feed into an unassayed umbrella total."
      evidence: "batch genealogy; supplier documents; assays; route ledger"
    - id: dq_measurement
      applies_to: "mass, energy, gas and water records"
      requirement: "Use calibrated instruments with units, reference conditions, missing-data treatment and conversion records retained."
      evidence: "calibration certificates; meter logs; conversion worksheet"
    - id: dq_temporal
      applies_to: "reporting period"
      requirement: "Cover a representative continuous period including planned and unplanned operating states; disclose exclusions, shutdowns, stock changes and campaign changes."
