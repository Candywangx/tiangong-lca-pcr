allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "route, refining and recovery subprocesses"
    rule: "Avoid allocation by separately metering primary and secondary feed campaigns, recovery steps and independently measured co-product operations."
    source_ids: []
  - rule_id: allocation_internal_returns
    applies_to: "internally returned tin metal, slag, dross and dust"
    rule: "Treat a material returned within the declared foreground boundary as an internal loop: retain its quantity for process control and mass balance, but assign neither an external output credit nor a second upstream burden."
    source_ids:
      - ec-jrc-nfm-bref-2017
  - rule_id: allocation_external_coproducts
    applies_to: "marketable metals, alloys or recovered compounds leaving the system"
    rule: "Report each external co-product's mass, contained metals, quality, destination and revenue. If subdivision cannot avoid allocation, the dataset is incomplete until the chosen physical, economic or substitution method and its justification are reviewed and disclosed; do not silently allocate by gross mass."
    source_ids: []
  - rule_id: allocation_secondary_feed
    applies_to: "tin scrap and other secondary feed"
    rule: "Apply one declared recycling model consistently in the linked upstream dataset and the foreground product system; disclose burden-free cut-off, recycled-content, end-of-life or substitution choices and prevent duplicate avoided-burden credits."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_assay
      process_id: "tin_unwrought_production"
      flow_role: "concentrate, scrap, coke and sodium-hydroxide inputs"
      record_type: "weighbridge, batch ticket, supplier certificate and laboratory assay"
      raw_fields: "timestamp; material identity; supplier; gross, tare and net mass; moisture; tin assay where applicable; solution concentration; batch; destination"
      collection_method: "Calibrated weighing linked to representative sampling and laboratory or supplier assay; reconcile receipts, stock changes and returns."
      unit: "kg; mass fraction"
      frequency: "each receipt and batch"
      temporal_coverage: "complete reporting period including opening and closing stock"
      site_scope: "all foreground receiving and storage points"
      aggregation_rule: "consumption = receipts + opening stock - closing stock - dispatches; convert solutions to 100% active mass and wet solids to declared dry basis"
      quality_evidence: "calibration records; chain of custody; sampling plan; assay method; certificates; stock reconciliation"
    - protocol_id: cp_electricity_meter
      process_id: "tin_unwrought_production"
      flow_role: "purchased electricity input"
      record_type: "revenue and submeters"
      raw_fields: "timestamp; meter id; reading; unit; process area; voltage; grid or contract; import/export"
      collection_method: "Read calibrated meters and allocate shared loads only with documented operating-hour or engineering evidence."
      unit: "kWh"
      frequency: "hourly or finer, aggregated monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all in-boundary process and directly supporting areas"
      aggregation_rule: "net imported kWh minus separately modelled exports, converted at 3.6 MJ/kWh and normalized to net product"
      quality_evidence: "meter calibration; bills; missing-data log; allocation worksheet"
    - protocol_id: cp_gas_and_oxygen_meter
      process_id: "tin_unwrought_production"
      flow_role: "natural gas and industrial oxygen inputs"
      record_type: "custody-transfer or process meter"
      raw_fields: "timestamp; gas identity; volume; temperature; pressure; dry/wet convention; meter id; process area"
      collection_method: "Use calibrated meters or reconciled supplier deliveries and tanks; keep gases separate."
      unit: "m3 at declared conditions"
      frequency: "continuous or each delivery"
      temporal_coverage: "complete reporting period"
      site_scope: "all in-boundary users"
      aggregation_rule: "reconcile opening/closing storage and purchases, then normalize each gas independently"
      quality_evidence: "calibration; supplier statement; reference-condition calculation; balance closure"
    - protocol_id: cp_water_balance
      process_id: "tin_unwrought_production"
      flow_role: "process-water make-up"
      record_type: "water meter and tank balance"
      raw_fields: "timestamp; source; make-up; discharge; recycle; evaporation estimate; storage change; unit; density basis"
      collection_method: "Meter make-up and discharge separately; quantify recirculation for disclosure without counting it again as external input."
      unit: "kg or m3 with density"
      frequency: "daily or finer"
      temporal_coverage: "complete reporting period and representative operating states"
      site_scope: "all process, cooling, gas-cleaning and treatment systems in boundary"
      aggregation_rule: "net external make-up = inflow + opening storage - closing storage - exported unused water; convert volume to mass under water_mass_conversion"
      quality_evidence: "calibrated meters; water-balance closure; density record; maintenance and leak log"
    - protocol_id: cp_product_release_mass
      process_id: "tin_unwrought_production"
      flow_role: "reference product output"
      record_type: "certified product scale and release record"
      raw_fields: "batch; grade/alloy; composition; form; gross, tare and net mass; off-spec mass; return mass; release status"
      collection_method: "Weigh each released lot and link laboratory release to the same batch."
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete reporting period"
      site_scope: "all product casting, granulation, storage and dispatch points"
      aggregation_rule: "net saleable output = released conforming mass - returned mass; normalize all exchanges by this output"
      quality_evidence: "calibration; release certificate; assay; inventory reconciliation"
    - protocol_id: cp_residue_dispatch
      process_id: "tin_unwrought_production"
      flow_role: "slag, baghouse dust and refining dross outputs"
      record_type: "container scale, manifest and destination record"
      raw_fields: "residue identity; origin; mass; moisture; composition; hazardous status; internal return; consignee; treatment route"
      collection_method: "Weigh each residue movement and distinguish internal return from external dispatch."
      unit: "kg"
      frequency: "each movement"
      temporal_coverage: "complete reporting period"
      site_scope: "all residue generation, storage, return and dispatch points"
      aggregation_rule: "net external output = dispatch outside boundary - material returned from external processing when included; never include internal recycle"
      quality_evidence: "scale calibration; waste manifest; assay; chain of custody; destination acceptance"
    - protocol_id: cp_direct_air_emissions
      process_id: "tin_unwrought_production"
