    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile purchased feed, contained tin, product, residues, internal returns, energy, water and direct emissions; investigate material gaps rather than balancing with an unspecified exchange."
      evidence: "signed mass/energy/water balances; gap log; corrective actions"
    - id: dq_abatement_and_destination
      applies_to: "direct emissions and residues"
      requirement: "Identify measurement as pre- or post-abatement and retain the actual residue destination, internal return status and treatment evidence."
      evidence: "stack schematic; abatement operating log; manifests; treatment receipts"
    - id: dq_representativeness
      applies_to: "published dataset"
      requirement: "State facility geography, furnace and refining technologies, feed mix, grade/form, year and allocation/recycling model; do not claim industry-average representativeness from a single facility without a reviewed aggregation design."
      evidence: "dataset metadata; technology description; sampling and aggregation record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The reference flow UUID, Mass property, mass unit group and 1 kg reference amount must match; the data package must declare grade/alloy, form, route shares, geography, technology and reporting period."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_route_applicability
    applies_to: "conditional feed and utility rows"
    rule: "A primary-route concentrate or coke amount is invalid without a declared primary reduction route; a tin-scrap amount is invalid without a declared secondary route; conditional utilities and chemicals require a named consuming operation."
    source_ids:
      - ec-jrc-nfm-bref-2017
  - rule_id: validate_tin_balance
    applies_to: "feed, product, co-product, residue and internal return"
    rule: "Calculate a contained-tin balance using compatible dry-mass and assay bases. An unexplained imbalance or use of gross feed mass as tin content is an error."
    source_ids: []
  - rule_id: validate_no_double_counting
    applies_to: "internal recycle and external outputs"
    rule: "The same slag, dust, dross or returned metal quantity must not be both an internal return and an external output, and secondary-feed credits must not be counted twice."
    source_ids:
      - ec-jrc-nfm-bref-2017
  - rule_id: validate_direct_emissions
    applies_to: "CO2, SO2 and particulate matter"
    rule: "Direct-emission rows must represent the foreground facility only, state post-abatement status and source coverage, and exclude upstream electricity and fuel-supply emissions."
    source_ids:
      - ec-jrc-nfm-bref-2017
  - rule_id: validate_atomic_exchanges
    applies_to: "process inventory"
    rule: "Each selected flow must be one concrete material, waste or emission. Unlisted fuels, fluxes, alloy additions, treatment reagents, wastes or pollutants used by the actual route require separate rows rather than aggregation into an umbrella exchange."
    source_ids: []
  - rule_id: validate_unresolved_uuids
    applies_to: "slag, dust, dross and sulfur dioxide rows"
    rule: "UUID-empty rows may be collected by their exact declared physical identity but cannot be represented by a generic or wrong-compartment proxy; keep them flagged for UUID resolution."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for saleable unwrought tin at a producing facility gate."
  downstream_use: "May serve as a secondary_dataset or background_dataset after methodology and data-quality review."
  allowed_use: "Product carbon-footprint and LCA models requiring declared facility or aggregated unwrought-tin production; supply-chain modelling where grade, form, route mix, geography, technology, allocation and recycling model are compatible."
  excluded_use: "Mining concentrate, semi-finished or fabricated tin products; undeclared alloy grades; generic global or national averages derived from one site; consequential recycling claims without an explicit model; substitution for route- or grade-incompatible production."
  required_metadata: "PCR id and version; flow UUID; grade/alloy composition; unwrought form; facility geography; technology; feed identities; primary/secondary contained-tin shares; upstream boundaries; reporting period; allocation and recycling model; abatement and water systems; residue destinations."
  required_quality_disclosure: "Primary data share; temporal, geographical and technological representativeness; meter and assay coverage; contained-tin balance; missing-data treatment; uncertainty; allocation sensitivity; unresolved UUID rows; deviations from this PCR."
  update_trigger: "Material change in feed route or share, furnace/refining/casting technology, energy supply, product grade or form, abatement, water system, residue destination, allocation/recycling model, facility geography, or when data age no longer represents current operation."
