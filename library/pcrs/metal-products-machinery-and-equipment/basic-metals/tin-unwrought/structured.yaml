measurement_rules:
  - id: reference_product_mass
    applies_to: "reference product and solid material exchanges"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated net mass. Exclude pallets, moulds, return metal and production packaging; state the moisture and surface-condition convention for feed and product."
  - id: tin_content_basis
    applies_to: "primary/secondary feed shares and tin recovery"
    required_property_ref:
      name: "Mass of contained tin"
      uuid: ""
    required_unit: "kg Sn"
    rule: "Determine contained tin from representative sampling and assay for each feed and output lot; never substitute gross material mass for contained-tin mass in recovery or route-share calculations."
  - id: electricity_energy
    applies_to: "purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve metered electricity before conversion. When records are in kWh, multiply by 3.6 MJ/kWh and disclose voltage, grid or contractual mix, and the delivery-loss boundary."
  - id: gas_reference_conditions
    applies_to: "natural gas and industrial oxygen"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Record metered volume and the reference temperature, pressure and dry/wet convention; convert supplier-normal or standard cubic metres only with the declared reference conditions."
  - id: water_mass_conversion
    applies_to: "process water"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Prefer direct mass or convert a calibrated volume record using measured or documented density at the stated temperature; count only fresh make-up or net transferred water and disclose recirculation."
  - id: direct_air_emissions
    applies_to: "fossil carbon dioxide, sulfur dioxide and particulate matter"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report direct post-abatement releases from the foreground facility. Do not add upstream electricity or purchased-fuel supply-chain emissions to these rows."
