      record_type: "continuous monitor, stack test, fuel/reductant record and fugitive estimate"
      raw_fields: "source; pollutant; concentration; flow; operating time; fuel/reductant quantity and carbon; abatement status; uncertainty; detection limit"
      collection_method: "Use valid continuous monitoring or representative stack testing; calculate only where measurement is unavailable and document factors and oxidation assumptions."
      unit: "kg and source measurement units"
      frequency: "continuous where installed; otherwise each representative campaign"
      temporal_coverage: "covers normal operation, start-up, shutdown and material variability"
      site_scope: "every in-boundary point and quantified fugitive source"
      aggregation_rule: "integrate concentration × dry gas flow over time, reconcile with calculation method, subtract no captured residue from an already post-abatement measurement, normalize to net product"
