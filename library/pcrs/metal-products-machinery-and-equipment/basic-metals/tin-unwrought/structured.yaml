  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = reporting-period exchange amount / reporting-period net saleable unwrought tin mass"
      inputs:
        - "exchange amount"
        - "cp_product_release_mass net output"
      output: "exchange per 1 kg reference product"
      source_ids: []
    - id: calc_dry_feed
      applies_to: "moist concentrate, scrap and residues"
      rule: "dry mass = net wet mass × (1 - measured moisture mass fraction)"
      inputs:
        - "calibrated mass"
        - "representative moisture"
      output: "kg dry material"
      source_ids: []
    - id: calc_contained_tin
      applies_to: "feed, product, residue and co-product"
      rule: "contained tin = dry material mass × representative tin mass fraction"
      inputs:
        - "dry mass"
        - assay
      output: "kg Sn and tin recovery reconciliation"
      source_ids: []
    - id: calc_route_share
      applies_to: "mixed primary/secondary production"
      rule: "route share = contained tin entering from the declared route / total contained tin entering from all external tin-bearing feed"
      inputs:
        - "contained tin by feed lot and route"
      output: "primary and secondary tin-input shares"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "purchased electricity"
      rule: "electricity (MJ) = metered electricity (kWh) × 3.6"
      inputs:
        - "net imported kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calc_solution_active_mass
      applies_to: "sodium hydroxide solution"
      rule: "active NaOH mass = solution mass × certified or measured NaOH mass fraction"
