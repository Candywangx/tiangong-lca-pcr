      collection_method: "Link slitting, cutting, inspection, and dispatch records to meters and packaging issues"
      unit: "kg; MJ; m; count"
      frequency: "Each lot, aggregated over reporting period"
      temporal_coverage: "Same reporting period as product mass"
      site_scope: "Final conversion, inspection, handling, and packing equipment"
      aggregation_rule: "Sum only packaging that crosses the gate; calculate strap and pallet mass; normalize to net product"
