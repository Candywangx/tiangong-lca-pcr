      applies_to: "upstream_product_system"
      rule: "Model primary steelmaking, casting, and production of purchased feed through linked upstream datasets unless those processes are explicitly inside the reporting organization and separately inventoried without double counting."
      source_ids:
        - eu-jrc-fmp-bref-2022
    - rule_id: boundary_outsourced_operations
      applies_to: "outsourced_further_working"
      rule: "Include an outsourced route-defining operation through a supplier-specific process dataset or a documented representative dataset, and preserve mass linkage to the returned product."
