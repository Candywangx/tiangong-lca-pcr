allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared_foreground_operations"
    rule: "Subdivide or meter unit processes and product lots before applying allocation; document any combined-line period and reconcile its mass and energy balances."
    source_ids:
      - eu-jrc-fmp-bref-2022
  - rule_id: allocation_internal_scrap
    applies_to: "internally_recycled_stainless_scrap"
    rule: "Treat scrap returned within the declared foreground boundary as an internal loop: retain the collection and remelting burdens inside their actual processes and do not credit or count the same scrap as an external output."
    source_ids: []
  - rule_id: allocation_exported_scrap
    applies_to: "exported_stainless_scrap"
    rule: "Report exported preparation scrap, edge trim, grinding dust, or recoverable metal-bearing residue at the point it leaves the foreground; do not apply an avoided-primary-steel credit inside the foreground inventory unless the downstream study adds a separately declared consequential scenario."
    source_ids: []
  - rule_id: allocation_recovered_acid
    applies_to: "recovered_acid_and_by_products"
    rule: "Prefer physical subdivision of acid recovery. If recovered acid returns to the same line, model it as an internal loop; if a saleable by-product leaves the system, disclose the allocation variable, values, period, and sensitivity."
    source_ids:
      - us-epa-iron-steel-effluent-2002
  - rule_id: allocation_packaging_reuse
    applies_to: "reusable_shipping_items"
    rule: "Allocate reusable pallet or stillage production over documented expected uses and include repair and return burdens only when they are inside the declared boundary; do not assume reuse without records."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_feed_and_scrap_mass
      process_id: "feed_preparation"
      flow_role: "Incoming feed, prepared intermediate, and preparation scrap"
      record_type: "Calibrated scale tickets and production-lot ledger"
      raw_fields: "lot_id; grade; form; dimensions; feed_mass_kg; preparation_scrap_kg; internal_return_kg; stock_change_kg"
      collection_method: "Reconcile receiving scales, line counters, scrap scales, and stock records"
      unit: "kg"
      frequency: "Each lot, aggregated monthly or over the declared reporting period"
      temporal_coverage: "At least 12 consecutive representative months, or all lots for a shorter campaign with justification"
      site_scope: "All preparation equipment serving the declared product"
      aggregation_rule: "Sum attributable masses; reconcile feed = prepared intermediate + exported scrap + internal return + measured stock change"
      quality_evidence: "Scale calibration, lot traceability, stock reconciliation, and signed exception log"
    - protocol_id: cp_preparation_energy
      process_id: "feed_preparation"
      flow_role: "Preparation electricity"
      record_type: "Electricity submeter or feeder meter"
      raw_fields: "timestamp; meter_id; opening_MJ; closing_MJ; downtime; shared_throughput_kg"
      collection_method: "Read dedicated meter; if shared, allocate by documented operating time and power or metered throughput"
      unit: "MJ"
      frequency: "Shift or daily"
      temporal_coverage: "Same reporting period as product mass"
      site_scope: "Preparation equipment and local extraction only"
      aggregation_rule: "Sum readings, subtract documented unrelated loads, and divide by reference-product mass"
      quality_evidence: "Meter calibration or utility-grade specification and allocation reconciliation"
    - protocol_id: cp_annealing_records
      process_id: "annealing_and_descaling"
      flow_role: "Annealing intermediates, electricity, gas, atmosphere gases, and fossil CO2"
      record_type: "Furnace batch log, utility meters, gas invoices, and emissions calculation or monitoring record"
      raw_fields: "lot_id; input_mass_kg; output_mass_kg; electricity_MJ; gas_m3; gas_reference_conditions; nitrogen_m3; hydrogen_m3; fuel_carbon; stack_CO2_kg"
      collection_method: "Link furnace logs to dedicated meters or reconciled utility records and retain the emissions method"
      unit: "kg; MJ; m3"
      frequency: "Each furnace batch or continuous-line shift"
      temporal_coverage: "Same reporting period as product mass and representative operating modes"
      site_scope: "All annealing furnaces, atmosphere supply, fans, and directly associated controls"
      aggregation_rule: "Sum included batches; normalize to linked net product; prevent overlap between metered gas and derived energy"
      quality_evidence: "Meter calibration, invoice reconciliation, furnace recipe, gas certificates, and emissions-method record"
    - protocol_id: cp_pickling_records
      process_id: "acid_pickling_and_rinsing"
      flow_role: "Pickling intermediates, acids, water, electricity, wastes, and HF release"
      record_type: "Bath ledger, tank levels, purchase issues, water and electricity meters, waste manifests, discharge and stack monitoring"
      raw_fields: "lot_id; strip_mass_kg; acid_solution_kg; acid_concentration; water_kg; electricity_MJ; recovered_acid_kg; spent_liquor_kg; sludge_kg; sludge_solids; wastewater_m3; density; HF_concentration; exhaust_Nm3"
      collection_method: "Reconcile bath make-up and recovery; meter utilities; weigh wastes; sample discharges and exhaust under the site monitoring plan"
      unit: "kg; MJ; m3; Nm3"
      frequency: "Each batch or shift for bath and utilities; each waste transfer; permit or campaign frequency for monitoring"
      temporal_coverage: "Same reporting period as product mass and inclusive of start-up and maintenance events"
      site_scope: "Pickling tanks, rinses, drying, ventilation, fume treatment, acid recovery, and directly associated wastewater treatment"
      aggregation_rule: "Calculate net external inputs and outputs after internal recycle; normalize by linked net product mass"
      quality_evidence: "Instrument calibration, laboratory QA/QC, chain-of-custody, bath balance closure, and waste manifests"
    - protocol_id: cp_cold_rolling_records
      process_id: "cold_rolling_and_temper"
      flow_role: "Rolling intermediates, electricity, oil, make-up water, emulsion, and sludge"
      record_type: "Coil tracking, electricity meter, stock ledger, tank balance, and waste transfer record"
      raw_fields: "lot_id; input_mass_kg; output_mass_kg; electricity_MJ; oil_opening_kg; oil_purchased_kg; oil_closing_kg; recovered_oil_kg; make_up_water_kg; spent_emulsion_kg; sludge_kg"
      collection_method: "Link coils to line meters and reconcile rolling-fluid stock and waste transfers"
      unit: "kg; MJ"
      frequency: "Each coil or shift; monthly stock reconciliation"
      temporal_coverage: "Same reporting period as product mass and representative rolling schedules"
      site_scope: "Included rolling stands, hydraulics, emulsion circulation, filtration, and controls"
      aggregation_rule: "Sum linked coils; calculate net oil and water input; normalize to net product; avoid counting recirculated emulsion"
      quality_evidence: "Meter calibration, coil traceability, inventory reconciliation, and waste manifests"
    - protocol_id: cp_mechanical_finishing_records
      process_id: "mechanical_surface_finishing"
      flow_role: "Finishing intermediate, electricity, abrasive, water, dust, sludge, and particulate release"
      record_type: "Coil or sheet route record, meters, material issues, waste weights, and exhaust monitoring"
      raw_fields: "lot_id; input_mass_kg; output_mass_kg; finish_code; electricity_MJ; abrasive_kg; water_kg; dust_kg; sludge_kg; sludge_solids; particulate_concentration; exhaust_Nm3"
      collection_method: "Link actual finish route to utility and material records; weigh captured waste; monitor exhaust or validate capture balance"
      unit: "kg; MJ; Nm3"
      frequency: "Each lot or shift; each waste transfer; monitoring-plan frequency for air releases"
      temporal_coverage: "Same reporting period as product mass and representative finish mix"
      site_scope: "Included grinding, polishing, brushing, extraction, filtration, and wet systems"
      aggregation_rule: "Sum actual route records and normalize to linked net product; keep dry dust and wet sludge separate"
      quality_evidence: "Meter calibration, material ledger, scale checks, finish traceability, and monitoring QA/QC"
    - protocol_id: cp_finalization_records
      process_id: "product_finalization"
      flow_role: "Finalization intermediate, electricity, packaging, and final scrap"
      record_type: "Lot ledger, electricity meter, packaging bill of materials, scale tickets, and reuse log"
