system_boundary:
  rules:
    - rule_id: boundary_route_definition
      applies_to: "foreground_system_boundary"
      rule: "Include every on-site process that changes the received stainless-steel flat-rolled feed into the declared further-worked product, including associated line utilities, recirculation, abatement, and directly generated wastes; identify at least one operation after the final primary hot or cold rolling step that establishes the further-worked state."
