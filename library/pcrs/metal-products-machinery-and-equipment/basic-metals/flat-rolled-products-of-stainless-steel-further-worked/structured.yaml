    - id: dq_no_unverified_uuid_proxy
      applies_to: "All Tiangong references"
      requirement: "Keep a UUID empty when an exact public state-code-100 identity is not directly verified; do not replace a missing route-, state-, geography-, or technology-specific identity with a broader proxy."
