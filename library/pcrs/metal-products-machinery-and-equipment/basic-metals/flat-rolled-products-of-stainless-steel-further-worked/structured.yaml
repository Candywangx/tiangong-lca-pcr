validation_rules:
  - rule_id: validate_identity_and_state
    applies_to: "reference_product"
    rule: "Fail conformance when stainless-steel grade, flat-rolled form, input state, output further-worked state, or route-defining operation is missing or inconsistent with the product boundary."
    source_ids:
      - un-cpc-v3-structure-2025
      - un-cpc-v3-explanatory-notes-2025
  - rule_id: validate_reference_mass
    applies_to: "reference_flow"
    rule: "Confirm that the output row output_reference_product equals 1,000 kg net saleable product after normalization and excludes packaging mass."
    source_ids: []
  - rule_id: validate_route_presence
    applies_to: "process_inventory"
    rule: "Confirm that feed preparation and product finalization are present and that a declared annealing, pickling, temper or skin-pass rolling, mechanical surface finishing, or other documented operation occurring after the final primary hot or cold rolling step establishes the further-worked status; primary cold reduction alone is insufficient."
    source_ids:
      - eu-jrc-fmp-bref-2022
  - rule_id: validate_atomic_flows
    applies_to: "process_inventory"
    rule: "Confirm that each row is one atomic material, energy, waste, or elementary exchange and that conditional applicability is declared by process or row rather than by a combined selector label."
    source_ids: []
  - rule_id: validate_mass_reconciliation
    applies_to: "foreground_mass_balance"
    rule: "Confirm that feed, linked intermediates, product, scrap, wastes, and measured stock changes reconcile for the reporting period; flag unexplained imbalance for review."
    source_ids: []
  - rule_id: validate_pickling_route
    applies_to: "acid_pickling_and_rinsing"
    rule: "When pickling is included, require bath chemistry and concentration, water recycle, acid recovery, fume treatment, wastewater destination, sludge solids, and monitored applicable air releases."
    source_ids:
      - eu-jrc-fmp-bref-2022
      - us-epa-iron-steel-effluent-2002
  - rule_id: validate_energy_identity
    applies_to: "electricity_and_gas_inputs"
    rule: "Reject unqualified electricity or gas identities that omit the required supply, geography, technology, delivery-boundary, or reference-condition disclosures."
    source_ids: []
  - rule_id: validate_unresolved_identities
    applies_to: "flow_references"
    rule: "Report every UUID-empty inventory row as unresolved and verify that no non-exact or non-public candidate has been promoted."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for one declared family of further-worked stainless-steel flat-rolled products"
  downstream_use: "secondary_dataset; background_dataset after methodology review and resolution or explicit acceptance of identity gaps"
  allowed_use: "Attributional gate-to-gate modelling of a declared producer, route, grade family, product state, and reporting period; linking to separately modelled upstream feed production and downstream fabrication"
  excluded_use: "Primary stainless-steel production without linked upstream datasets; generic use-stage claims; consequential scrap-credit claims; products outside the semantic boundary; substitution across undisclosed grade, finish, route, or geography"
  required_metadata: "PCR id and version state; producer and geography; reporting period; grade family; dimensions; finish; edge and delivery condition; feed state; further-working operations; combined-line aggregation; capacity utilization; upstream dataset choices; allocation; packaging; unresolved UUIDs"
  required_quality_disclosure: "Mass-balance closure; meter and scale coverage; shared-utility allocation; chemical concentrations; gas reference conditions; water recycle; acid recovery; abatement boundary; waste moisture and destination; emissions monitoring; temporal and technological representativeness"
  update_trigger: "Change in grade family or product state, route-defining operation, furnace fuel, pickling chemistry, rolling or finishing technology, abatement, supplier mix, geography, allocation, packaging, or a material change in annual mass, energy, water, chemical, waste, or emission performance"
