  what: "Supply factory-gate non-alloy steel wire rod in an irregular coil for downstream drawing, rolling or fabrication."
  how_much: "1 metric tonne (1,000 kg) of accepted wire rod."
  how_well: "Conforms to the declared grade or purchase specification, chemical composition, cross-section, dimensions and tolerances, mechanical or metallurgical condition, surface condition and coil acceptance criteria."
  how_long_or_cycle: "One production output at the steelworks gate; no use-stage service duration is represented."
  reference_flow_link: "Output row reference_product_wire_rod of process wire_rod_hot_rolling."
system_boundary:
  rules:
