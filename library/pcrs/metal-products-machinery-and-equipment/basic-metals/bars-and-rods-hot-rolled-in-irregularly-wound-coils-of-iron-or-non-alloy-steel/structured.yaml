          property_unit: "Mass / kg"
          description: "Record suspended solids in treated effluent discharged across the environment boundary using the declared filtration and drying method."
          amount:
            expression: "Multiply representative suspended-solids concentration by matched discharge volume, subtract documented intake load, and normalize with calc_normalize_one_tonne."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1,000 kg accepted wire rod"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_water_emissions
              source_ids:
                - jrc-fmp-bref-2022
                - worldsteel-lci-methodology-2017
            ranges: []
allocation_rules:
  - rule_id: alloc_subdivide_first
    applies_to: "foreground_shared_operations"
    rule: "Avoid allocation by submetering or subdividing separately operated lines, grades, campaigns and treatment units wherever the causal exchange can be measured."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: alloc_internal_returns
    applies_to: "internal_scrap_scale_and_water"
    rule: "Keep scrap, scale, oil and water returned within the measured foreground system as internal loops; do not credit them as exported co-products and do not count the same return as a new external input."
    source_ids:
      - jrc-fmp-bref-2022
      - worldsteel-wire-rod-2022
      - worldsteel-lci-methodology-2017
  - rule_id: alloc_exported_recovery
    applies_to: "exported_recovered_material"
    rule: "For a separately measured output with a documented external market and function, apply system expansion only when the substituted function and dataset are demonstrated; otherwise report it as waste to its actual treatment. Disclose the substitution and sensitivity."
    source_ids:
      - worldsteel-wire-rod-2022
      - worldsteel-lci-methodology-2017
  - rule_id: alloc_shared_treatment
    applies_to: "shared_water_waste_and_energy_services"
    rule: "Allocate shared water treatment, waste treatment and energy services by direct metering first, then by a physical causal driver such as treated volume, pollutant load, energy or mass; disclose the driver and exclude unrelated plant operations."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: alloc_upstream_scrap_method
    applies_to: "linked_billet_or_bloom_dataset"
    rule: "Preserve the recycled-input and end-of-life method of the linked upstream steel dataset and report it separately from foreground mill scrap; do not apply a second scrap credit inside this rolling process."
    source_ids:
      - worldsteel-wire-rod-2022
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_energy
      process_id: "wire_rod_hot_rolling"
      flow_role: "billet, natural gas, electricity, process-water make-up and lubricant inputs"
      record_type: "weighbridge, production ledger, invoice, tank or stock record and calibrated meter"
      raw_fields: "timestamp; grade and lot; gross and net mass; meter start and end; unit; gas temperature and pressure basis; electricity kWh; water source; lubricant issue, return and stock change; product attribution"
      collection_method: "Reconcile records to production campaigns; use dedicated meters where available and a documented physical driver for shared services."
      unit: "kg; m3; kWh; MJ"
      frequency: "continuous or per batch with monthly reconciliation"
      temporal_coverage: "Normally 12 consecutive months; a shorter period of at least 6 months requires justification and correction for predictable operating or seasonal variation."
      site_scope: "All equipment and utilities attributable to the declared wire-rod mill at the site."
      aggregation_rule: "Sum boundary-crossing quantities for the period, resolve stock changes and returns, then normalize to accepted output."
      quality_evidence: "Calibration certificates; meter hierarchy; invoices; weighbridge tickets; stock reconciliation; campaign log; allocation worksheet."
    - protocol_id: cp_outputs_waste
      process_id: "wire_rod_hot_rolling"
      flow_role: "accepted product, steel scrap, mill scale, wastewater and oily sludge"
      record_type: "product scale, waste scale, dispatch record, water meter and treatment record"
      raw_fields: "output grade and mass; acceptance status; scrap mass and destination; scale wet or dry mass, oil and moisture; wastewater volume and destination; sludge wet mass and analysis"
      collection_method: "Reconcile accepted, downgraded, internally returned, externally recovered and disposed outputs to the same production period."
      unit: "kg; m3"
      frequency: "per batch or shipment with monthly reconciliation"
      temporal_coverage: "Same representative period as cp_material_energy."
      site_scope: "Foreground mill and attributable on-site treatment."
      aggregation_rule: "Sum each physical output and destination separately; retain internal-loop records; normalize to accepted product."
      quality_evidence: "Product certificates; calibrated scales; waste transfer notes; recovery receipts; water balance; sludge laboratory results."
    - protocol_id: cp_air_emissions
      process_id: "wire_rod_hot_rolling"
      flow_role: "direct fossil carbon dioxide, nitrogen oxides, sulphur dioxide, carbon monoxide and total particulate matter"
      record_type: "continuous emissions monitoring, periodic stack test, mass balance or regulated annual mass report"
      raw_fields: "source id; operating hours; concentration; reference oxygen; wet or dry basis; temperature and pressure; gas volume; fuel carbon and sulphur where used; control status; uncertainty"
      collection_method: "Match concentration and gas-flow conditions; aggregate only attributable source masses; retain calculation and monitoring hierarchy."
      unit: "kg; mg/Nm3; Nm3"
      frequency: "continuous where monitored, otherwise each valid test and annual reconciliation"
      temporal_coverage: "Same representative period as production data; document test representativeness."
      site_scope: "Reheating furnace and other declared mill air-emission points."
      aggregation_rule: "Calculate source mass for the production period, avoid double counting measured and calculated reports, and normalize to accepted product."
      quality_evidence: "Monitoring certificates; laboratory reports; reference-condition calculations; fuel analysis; regulatory submissions; data-gap log."
    - protocol_id: cp_water_emissions
      process_id: "wire_rod_hot_rolling"
      flow_role: "iron, mineral oil and suspended solids discharged to water"
      record_type: "flow-proportional or representative sample paired with discharge meter"
      raw_fields: "outfall; sample time; analytical method; concentration; discharge volume; intake concentration where applicable; treatment status; detection limit; uncertainty"
      collection_method: "Pair representative concentrations with matched discharge volumes; subtract documented intake load where the accounting method requires it."
      unit: "kg; mg/L; m3"
      frequency: "per permit and process variability, with monthly and annual reconciliation"
      temporal_coverage: "Same representative period as production and water-balance data."
      site_scope: "Attributable final outfalls from the mill or shared treatment after allocation."
      aggregation_rule: "Calculate each pollutant mass separately, handle non-detects by the declared rule, and normalize to accepted product."
      quality_evidence: "Accredited laboratory reports; chain of custody; meter calibration; permit reports; intake and outfall balance; allocation worksheet."
  calculation_rules:
    - id: calc_normalize_one_tonne
      applies_to: "every foreground exchange"
      rule: "normalized amount = period exchange amount / period accepted wire-rod mass × 1,000 kg"
      inputs:
        - "period exchange amount"
        - "period accepted wire-rod mass"
      output: "exchange amount per 1,000 kg accepted wire rod"
      source_ids:
        - worldsteel-wire-rod-2022
    - id: calc_electricity_mj
      applies_to: "alternating-current electricity"
      rule: "electricity MJ = metered kWh × 3.6; retain the original kWh record and do not combine electricity with fuel energy"
      inputs:
        - "metered kWh"
      output: "MJ alternating-current electricity"
      source_ids: []
    - id: calc_water_pollutant_mass
      applies_to: "each water elementary flow"
      rule: "pollutant mass = matched discharge volume × representative concentration minus documented intake pollutant load; apply consistent volume and concentration units"
      inputs:
        - "discharge volume"
        - "outfall concentration"
        - "intake concentration where applicable"
      output: "kg pollutant discharged"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_mass_balance
      applies_to: "rolling-process completeness"
      rule: "Reconcile billet input and other mass inputs with accepted product, downgraded product, scrap, scale, sludge, measured emissions and inventory change; investigate unexplained imbalance rather than forcing closure."
      inputs:
        - "all mass inputs"
        - "product and residue outputs"
        - "inventory change"
      output: "documented mill mass balance and unexplained difference"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_shared_service_allocation
      applies_to: "shared electricity, water and treatment"
      rule: "Allocate the measured shared total to the wire-rod process using the declared physical driver; allocation shares across users must sum to the measured total."
      inputs:
        - "shared total"
        - "driver quantity by user"
      output: "attributable foreground exchange"
      source_ids:
        - worldsteel-lci-methodology-2017
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and billet input"
      requirement: "Retain grade, chemistry basis, cross-section, nominal dimensions, coil and lot identity, delivery state, upstream route and acceptance status; do not mix alloy steel or straight-bar production into the denominator."
      evidence: "Product specification, test certificate, production order, coil tag and acceptance record."
    - id: dq_primary_foreground
      applies_to: "gate-to-gate foreground"
      requirement: "Use measured primary data for the rolling mill and attributable treatment; calculated or estimated substitutions require a documented hierarchy, formula and uncertainty."
      evidence: "Meter and scale records, laboratory reports, calculation files and data-gap log."
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use a representative 12-month period where practicable. If a period of at least 6 months is used, justify it and account for predictable seasonal, campaign and maintenance variation."
      evidence: "Period coverage report, operating calendar, downtime and campaign records."
    - id: dq_geography_technology
      applies_to: "upstream and foreground datasets"
      requirement: "Match site geography, electricity supply, reheating fuel, burner, rolling train, cooling and water-circuit technology; disclose deviations and unknown upstream billet origin."
      evidence: "Dataset metadata, supplier record, process flow diagram and technology description."
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Account for every listed atomic exchange or retain evidence that it is zero; document any additional site-specific material, fuel, emission or waste and the cut-off decision."
      evidence: "Completeness checklist, mass and energy balances, environmental register and cut-off log."
    - id: dq_no_proxy_uuid
      applies_to: "TianGong identity references"
      requirement: "Leave a UUID empty until the exact flow, type, state, property and unit support are directly verified; do not promote a semantically different steel, utility, waste or emission proxy."
      evidence: "UUID audit record and unresolved-inventory register."
    - id: dq_range_evidence
      applies_to: "quantitative ranges"
      requirement: "Do not infer an external empirical range unless at least two independent original sources have compatible system boundary, declared unit and product state; until then use foreground records without an invented range."
      evidence: "Source-comparison record or explicit unresolved range-evidence need."
validation_rules:
  - rule_id: val_reference_output
    applies_to: "reference_flow"
    rule: "Confirm exactly 1,000 kg of accepted non-alloy steel wire rod in irregular coils is the quantitative-reference output and all inventory rows use the same accepted-output denominator."
    source_ids:
      - worldsteel-wire-rod-2022
  - rule_id: val_identity_scope
    applies_to: "product_identity"
    rule: "Reject a data package that mixes alloy or stainless steel, straight bars, flat products or downstream cold-worked and coated products without separate modelling and disclosure."
    source_ids:
      - unsd-cpc-3-0-2025
      - jrc-fmp-bref-2022
  - rule_id: val_boundary_link
    applies_to: "system_boundary"
    rule: "Confirm billet or bloom origin and upstream route are declared and linked; confirm downstream drawing, rolling, coating, distribution, use and end of life are excluded or separately identified."
    source_ids:
      - worldsteel-lci-methodology-2017
      - worldsteel-wire-rod-2022
  - rule_id: val_process_completeness
    applies_to: "foreground_inventory"
    rule: "Confirm reheating, descaling, rolling, controlled cooling, coil formation, attributable water treatment and every listed atomic exchange are measured or explicitly evidenced as zero."
    source_ids:
      - jrc-fmp-bref-2022
      - worldsteel-lci-methodology-2017
  - rule_id: val_mass_balance
    applies_to: "mass_inventory"
    rule: "Reconcile billet and other mass inputs against accepted product, scrap, scale, sludge, direct emissions and inventory change; investigate and disclose unexplained imbalance."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: val_energy_water_separation
    applies_to: "energy_and_water_inventory"
    rule: "Confirm electricity, natural gas and water are separate exchanges; confirm water make-up is not gross recirculating flow and gas reference conditions are declared."
    source_ids:
      - jrc-fmp-bref-2022
      - worldsteel-lci-methodology-2017
  - rule_id: val_allocation
    applies_to: "allocation_and_recovery"
    rule: "Confirm internal returns receive no exported-product credit, shared-service allocations close to the measured total, and any system-expansion credit names an actual external function and substitute dataset."
    source_ids:
      - worldsteel-wire-rod-2022
      - worldsteel-lci-methodology-2017
  - rule_id: val_uuid_resolution
    applies_to: "tiangong_references"
    rule: "Confirm every populated UUID has public state 100, exact semantics, correct flow type, property and unit support; confirm every empty UUID appears in the unresolved inventory register."
    source_ids: []
  - rule_id: val_bilingual_alignment
    applies_to: "bilingual_pcr"
    rule: "Confirm English and Chinese process ids, row ids, UUIDs, controlled values, source ids and normative rule ids are identical and that human-facing Chinese flow names are localized."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset produced from reviewed site foreground records."
  downstream_use: "Cradle-to-gate product systems for downstream wire drawing, cold rolling, fabrication and product LCA; process and lifecyclemodel projections that require a declared non-alloy steel wire-rod input."
  allowed_use: "Use when product chemistry, delivery state, upstream route, geography, technology and period are representative and the chosen recycling or allocation method is compatible with the downstream study."
  excluded_use: "Do not use as a proxy for alloy or stainless wire rod, straight bar, reinforcing bar, flat-rolled coil, cold-drawn wire, coated wire, fabricated wire products or a site whose upstream steel route and mill technology are materially different without sensitivity analysis."
  required_metadata: "PCR id and version; product grade and specification; chemistry basis; cross-section and nominal dimensions; coil mass and delivery state; site and geography; period; billet origin and upstream route; hot-charge status; reheating fuel and technology; rolling and cooling configuration; water-circuit and treatment boundary; allocation and recycling method; reference-product UUID status."
  required_quality_disclosure: "Primary-data share; meter and scale coverage; temporal coverage; allocation drivers; mass and energy balance results; water balance; emission-monitoring basis; missing or estimated exchanges; unresolved UUIDs; upstream dataset quality; uncertainty and cut-off decisions."
  update_trigger: "Change in steel grade family, billet source or BOF/EAF route, reheating fuel or burner, hot-charge practice, rolling or cooling technology, water circuit, treatment route, allocation or recycling method, site geography, reference-product UUID, or a production-period update that materially changes representative results."
