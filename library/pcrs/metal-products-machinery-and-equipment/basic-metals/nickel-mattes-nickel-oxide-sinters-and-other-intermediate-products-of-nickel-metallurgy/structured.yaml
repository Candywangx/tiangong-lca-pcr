    - id: calc_nickel_water
      applies_to: "out_nickel_water"
      rule: "nickel release = sum of discharge volume interval × flow-weighted nickel concentration interval; handle below-detection values by the declared laboratory rule."
      inputs:
        - "Discharge volume"
        - "nickel concentration"
        - "detection limit"
      output: "kg nickel to water"
      source_ids:
