  calculation_rules:
    - id: calc_normalize_output
      applies_to: "Every inventory row"
      rule: "normalized amount = reporting-period net exchange / reporting-period qualifying product mass × 1,000 kg"
      inputs:
        - "Net exchange"
        - "qualifying product dispatch mass"
      output: "Exchange per 1,000 kg product"
      source_ids: []
    - id: calc_dry_mass
      applies_to: "Feed, product, slag, and dust"
      rule: "dry mass = as-shipped mass × (1 − moisture mass fraction), or as-shipped mass × measured dry-solids fraction"
      inputs:
        - "As-shipped mass"
        - "representative moisture or dry-solids fraction"
      output: "Dry mass with basis label"
      source_ids: []
    - id: calc_contained_nickel
      applies_to: "Nickel-bearing materials"
      rule: "contained Ni = material mass on the assay basis × measured nickel mass fraction"
      inputs:
        - "Material mass"
        - "assay basis"
        - "Ni fraction"
      output: "kg Ni"
      source_ids: []
    - id: calc_gas_reference
      applies_to: "Natural gas and oxygen"
      rule: "Convert volume only with recorded temperature, absolute pressure, compressibility treatment, and wet/dry basis; retain original metered value."
      inputs:
