allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Separately measured route units and outputs"
    rule: "Avoid allocation by subdividing separately metered preparation, smelting, leaching, gas-treatment, acid-production, and residue-treatment operations."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_internal_returns
    applies_to: "On-site matte, slag, dust, water, acid, and heat returns"
    rule: "Treat measured on-site returns as internal loops; assign their treatment burdens to the foreground process and report only net site-gate exchanges."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_coproducts
    applies_to: "Exported sulfuric acid or another valuable co-product"
    rule: "First use a documented physical causal relationship such as sulfur converted to exported acid; if no defensible causal relationship exists, use revenue-based allocation with the price period, currency, and sensitivity to zero-credit treatment disclosed."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_recovered_metals
    applies_to: "Slag, dust, cake, or residue sent for metal recovery"
    rule: "Do not assign avoided primary-metal credits inside the foreground inventory unless the study applies an explicitly documented substitution model; disclose recoverable nickel and co-metal content separately."
    source_ids:
      - eu-jrc-nfm-bref-2017
