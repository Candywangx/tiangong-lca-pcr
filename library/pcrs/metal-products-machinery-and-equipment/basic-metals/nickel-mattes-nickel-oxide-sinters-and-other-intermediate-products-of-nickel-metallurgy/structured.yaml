validation_rules:
  - rule_id: validate_identity
    applies_to: "Product category"
    rule: "Reject a dataset that represents ore/concentrate, ferro-nickel, nickel pig iron, unwrought refined nickel, or a final-market nickel chemical instead of a declared metallurgy intermediate."
    source_ids:
      - un-cpc-3-0-structure-2025
      - china-mof-tariff-2013
  - rule_id: validate_reference
    applies_to: "Reference flow"
    rule: "Require exactly 1,000 kg as-shipped reference product and all required product, composition, route, site, and period qualifiers."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_route_rows
    applies_to: "Inventory"
    rule: "Require every applied row to match the declared route and every actual material, energy, waste, and direct-emission exchange to be represented by one atomic flow."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_uuid_semantics
    applies_to: "UUID-bearing rows"
    rule: "Confirm flow type, base name, property, unit group, compartment, and physical state; do not substitute a broader species group or a route-specific product for another row."
    source_ids: []
  - rule_id: validate_internal_loops
    applies_to: "Recycle and recovery"
    rule: "Reject double counting of internally returned matte, slag, dust, water, acid, or heat as both gross output and new input."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_direct_emissions
    applies_to: "Air and water outputs"
    rule: "Require direct foreground emissions after abatement and exclude upstream electricity and purchased-input production emissions from direct rows."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_balances
    applies_to: "Material accounting"
    rule: "Require disclosed Ni and S balance closure and explanations for all material discrepancies above the site-defined measurement uncertainty."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_ranges
    applies_to: "Quantity screening"
    rule: "Treat all inventory amounts as foreground values; no external QA range is approved until two independent, original-text-verified, boundary-compatible sources support it."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset eligible for review as a secondary_dataset or background_dataset after all unresolved identities and evidence needs are addressed"
  downstream_use: "Product systems requiring a declared nickel matte, nickel oxide sinter, or other nickel metallurgy intermediate"
  allowed_use: "Use for the reported product form, route, feed class, site geography, composition, technology, abatement, and reporting period, or for a justified close match with all differences disclosed"
  excluded_use: "Do not use as a proxy for nickel ore/concentrate, ferro-nickel, nickel pig iron, refined nickel, final-market nickel chemicals, or a different intermediate route without documented representativeness"
  required_metadata: "PCR id and version; product name and form; route; site and geography; reporting period; feed class; mass/moisture/dry solids; Ni/S/Co/Cu assays; energy and oxygen boundaries; slag/dust/water recycle; direct-release compartments; allocation method; upstream dataset identities"
  required_quality_disclosure: "Temporal and technological representativeness; measurement and assay methods; meter and laboratory QA/QC; data completeness; mass and element balance closure; missing-data treatment; allocation sensitivity; unresolved UUID and range-evidence status"
  update_trigger: "Change in product form, feed class, route, furnace/reactor, energy or oxygen supply boundary, sulfur capture, slag/dust recycle, wastewater treatment, allocation, or a material shift in mass or element balances"
