      collection_method: "reconcile scrap scales with internal remelt or reuse logs and shipment tickets"
      unit: "kg"
      frequency: "per shipment, reconciled monthly"
      temporal_coverage: "same reference period as production"
      site_scope: "all included forming lines"
      aggregation_rule: "exported scrap = generated segregated scrap - verified internal return"
      quality_evidence: "scale calibration, shipment tickets, material balance"
    - protocol_id: cp_finishing_material_records
      process_id: "annealing_and_surface_treatment"
      flow_role: "hydrogen, nitrogen, sulfuric acid, sodium hydroxide"
      record_type: "delivery, tank, cylinder, stock, concentration, and issue records"
      raw_fields: "identity; supplier; concentration/purity; opening stock; receipts; closing stock; returns; reference conditions"
      collection_method: "reconcile calibrated tank/cylinder/scale readings with purchase and issue records"
      unit: "kg or m3"
      frequency: "per delivery and batch, reconciled monthly"
      temporal_coverage: "same reference period as treated product"
      site_scope: "all included finishing lines"
