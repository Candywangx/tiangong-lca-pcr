      collection_method: "read dedicated meter or allocate shared meter using causal operating records"
      unit: "kWh"
      frequency: "interval or shift, aggregated monthly"
      temporal_coverage: "same reference period as treated product"
      site_scope: "all included finishing and treatment equipment"
      aggregation_rule: "sum attributable kWh, convert to MJ, normalize by treated product mass"
      quality_evidence: "meter calibration, bills, allocation reconciliation"
    - protocol_id: cp_finishing_gas_meter
      process_id: "annealing_and_surface_treatment"
      flow_role: "natural gas and direct fossil CO2"
      record_type: "gas meter, invoice, fuel quality, and emissions calculation records"
      raw_fields: "volume; pressure; temperature; base conditions; factor identity or carbon content; equipment"
      collection_method: "reconcile submeter readings with invoices and retain verified direct-emission calculation"
      unit: "m3 and kg CO2"
      frequency: "shift or monthly"
      temporal_coverage: "same reference period as treated product"
      site_scope: "all included finishing combustion units"
      aggregation_rule: "normalize gas volume; attribute by causal operation; calculate direct CO2 without upstream emissions"
