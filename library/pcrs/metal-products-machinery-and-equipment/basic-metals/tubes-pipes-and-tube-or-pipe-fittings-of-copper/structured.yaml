    - protocol_id: cp_forming_output_records
      process_id: "forming_and_fabrication"
      flow_role: "accepted product"
      record_type: "scale, inspection, and production-order records"
      raw_fields: "product form; alloy; dimensions; temper; finish; gross output; rejects; rework; net accepted mass"
      collection_method: "reconcile certified scales with final inspection release and production orders"
      unit: "kg"
      frequency: "per batch"
      temporal_coverage: "same reference period as inputs"
      site_scope: "every product line represented"
      aggregation_rule: "sum net accepted mass by declared product and normalize to 1,000 kg"
      quality_evidence: "scale calibration, inspection release, mass reconciliation"
    - protocol_id: cp_forming_waste_records
      process_id: "forming_and_fabrication"
      flow_role: "segregated copper scrap"
      record_type: "waste scale tickets and internal-return records"
