allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared forming and finishing equipment"
    rule: "Prefer subdivision, route-specific meters, production orders, and operating-time or engineering-causality records before allocation."
    source_ids: []
  - rule_id: allocation_internal_scrap
    applies_to: "copper returned internally"
    rule: "Treat copper returned to the same foreground system as an internal loop: neither co-product nor exported waste; carry only documented reprocessing burdens."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_exported_scrap
    applies_to: "copper scrap leaving the site"
    rule: "Record exported copper scrap as a separate waste output. If avoided-burden or recycled-content modelling is applied downstream, disclose the method and keep it outside the unallocated foreground inventory."
    source_ids: []
  - rule_id: allocation_shared_residual
    applies_to: "unavoidable shared burdens"
    rule: "If causal subdivision is impossible, allocate by measured mass throughput for operations whose burden follows mass; use another parameter only with a documented causal justification and sensitivity check."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_forming_material_records
      process_id: "forming_and_fabrication"
      flow_role: "billet, strip, tubing, lubricant, emulsion"
      record_type: "receiving, issue, return, and stock records"
      raw_fields: "product identity; supplier; batch; alloy/formulation; opening stock; purchases; issues; returns; closing stock; mass"
      collection_method: "reconcile calibrated scales, warehouse records, and invoices by product and route"
      unit: "kg"
      frequency: "per batch, reconciled monthly"
      temporal_coverage: "representative continuous 12-month period or all batches in a shorter campaign"
      site_scope: "all foreground forming lines included in the dataset"
      aggregation_rule: "purchases + opening stock - closing stock - verified returns, attributed to declared route"
      quality_evidence: "scale calibration, invoices, stock reconciliation, product specifications"
    - protocol_id: cp_forming_electricity_meter
      process_id: "forming_and_fabrication"
      flow_role: "electricity"
      record_type: "interval meter and production-order records"
      raw_fields: "meter id; opening/closing reading; kWh; line; route; operating time; product mass"
      collection_method: "read dedicated meter or allocate a verified shared meter using causal operating records"
      unit: "kWh"
      frequency: "interval or shift, aggregated monthly"
      temporal_coverage: "same reference period as production"
      site_scope: "all included forming equipment and auxiliaries"
      aggregation_rule: "sum attributable kWh, convert to MJ, divide by net accepted product mass, multiply by 1,000 kg"
      quality_evidence: "meter calibration, bills, allocation reconciliation"
    - protocol_id: cp_forming_gas_meter
      process_id: "forming_and_fabrication"
      flow_role: "natural gas and direct fossil CO2"
      record_type: "gas meter, invoice, fuel quality, and emissions calculation records"
      raw_fields: "volume; pressure; temperature; base conditions; carbon content or factor identity; oxidation basis; equipment; route"
      collection_method: "reconcile submeter readings with invoices and retain the verified direct-emission calculation"
      unit: "m3 and kg CO2"
      frequency: "shift or monthly"
      temporal_coverage: "same reference period as production"
      site_scope: "all included forming combustion units"
      aggregation_rule: "normalize gas volume; attribute by causal operation; calculate direct CO2 without upstream emissions"
      quality_evidence: "meter calibration, invoice reconciliation, factor or carbon-balance record"
    - protocol_id: cp_forming_water_meter
      process_id: "forming_and_fabrication"
      flow_role: "process-water makeup"
      record_type: "water meter and loop-balance records"
