      collection_method: "read boundary makeup meter and reconcile internal loop balances"
      unit: "kg or m3"
      frequency: "shift or monthly"
      temporal_coverage: "same reference period as production"
      site_scope: "all included forming water systems"
      aggregation_rule: "report fresh boundary makeup only; convert to kg and normalize by net product"
