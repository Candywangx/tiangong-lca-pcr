    - protocol_id: cp_finishing_water_meter
      process_id: "annealing_and_surface_treatment"
      flow_role: "fresh process-water makeup"
      record_type: "intake meter and cascade/recirculation balance"
      raw_fields: "fresh intake; cascade reuse; recirculation; purge; evaporation; density basis"
      collection_method: "read site-boundary makeup and reconcile the finishing-water balance"
      unit: "kg or m3"
      frequency: "shift or monthly"
      temporal_coverage: "same reference period as treated product"
      site_scope: "all included surface-treatment and treatment lines"
      aggregation_rule: "report fresh boundary makeup only and normalize by treated product mass"
      quality_evidence: "meter calibration, water balance, density basis"
    - protocol_id: cp_finishing_waste_records
      process_id: "annealing_and_surface_treatment"
      flow_role: "wastewater and sludge"
      record_type: "effluent meter, laboratory, dewatering, and shipment records"
      raw_fields: "wastewater volume/mass; pH; dissolved copper; suspended solids; sludge mass; moisture; destination"
      collection_method: "combine calibrated flow/scale records with representative laboratory results and shipment manifests"
      unit: "kg"
      frequency: "per discharge or shipment, reconciled monthly"
      temporal_coverage: "same reference period as treated product"
      site_scope: "all included pickling and treatment lines"
      aggregation_rule: "report net boundary exports after internal reuse, recovery, evaporation, and on-site treatment"
      quality_evidence: "instrument calibration, laboratory QA, manifests, treatment balance"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period amount / net accepted mass for the same product and route × 1,000 kg"
      inputs:
        - "aligned period exchange amount"
        - "net accepted product mass"
      output: "exchange amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_stock_consumption
      applies_to: "lubricants, emulsion, acids, alkali, and protection gases"
      rule: "net consumption = opening stock + receipts - closing stock - verified returns or recovered quantity; use consistent concentration and reference-condition bases"
      inputs:
        - stock
        - receipt
        - return
        - recovery
        - concentration
        - "and gas-condition records"
      output: "net consumed mass or volume"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "forming_fossil_co2; finishing_fossil_co2"
      rule: "calculate direct fossil CO2 from normalized measured fuel and a documented site-specific carbon balance or verified combustion factor; identify factor source, oxidation basis, and units; never include upstream emissions"
      inputs:
        - "normalized natural-gas record"
        - "documented carbon content or verified factor"
        - "oxidation basis"
      output: "kg direct fossil CO2 per 1,000 kg product"
      source_ids: []
    - id: calc_copper_mass_balance
      applies_to: "forming route"
      rule: "input copper mass = net accepted copper product + exported copper scrap + measured copper-bearing losses + inventory change; investigate rather than force-close unexplained difference"
      inputs:
        - "billet/strip/tubing mass"
        - "accepted product"
        - scrap
        - "copper-bearing waste"
        - "work-in-process change"
      output: "disclosed copper mass-balance closure"
      source_ids:
        - eu-jrc-nfm-bref-2017
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and copper inputs"
      requirement: "Retain product form, alloy designation, composition basis, dimensions, wall thickness or fitting geometry, temper, surface condition, route, supplier, and lot linkage."
      evidence: "purchase specification, certificate, production order, inspection release"
    - id: dq_temporal_alignment
      applies_to: "all foreground exchanges"
      requirement: "Use one representative continuous 12-month period where available; for shorter campaigns include all batches and disclose duration, seasonality, downtime, startup, shutdown, and representativeness."
      evidence: "meter timestamps, production calendar, batch register"
    - id: dq_completeness
      applies_to: "process map and inventory"
      requirement: "Reconcile every included line and operation to the declared route; explain missing meters, estimated allocations, excluded operations, zero records, and data gaps."
      evidence: "line map, meter map, reconciliation log, gap register"
    - id: dq_measurement
      applies_to: "mass, energy, gas, water, wastewater, and sludge"
      requirement: "Use calibrated instruments or reconciled invoices; retain original units, conversion factors, gas reference conditions, water density basis, chemical concentration, and sludge moisture basis."
      evidence: "calibration records, bills, laboratory QA, conversion worksheet"
    - id: dq_upstream_linkage
      applies_to: "purchased inputs and off-site treatment"
      requirement: "Link each boundary-crossing input and treatment output to a dataset matched for identity, geography, technology, and reference period, or disclose an explicit unresolved data gap."
      evidence: "dataset mapping table and representativeness review"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference flow"
    rule: "Confirm exactly 1,000 kg net accepted product, Mass property, kg unit, and all required qualifiers; reject gross output or packaging-inclusive mass presented as the reference product."
    source_ids: []
  - rule_id: validate_route_logic
    applies_to: "process map and inventory"
    rule: "Confirm one declared product form and route; route-inapplicable cards must be absent rather than populated with zero or another route's exchange."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_atomic_flows
    applies_to: "inventory"
    rule: "Confirm every selected flow is one physical, chemical, waste, or energy exchange with the stated direction, flow type, property, and unit; reject collection labels or combined alternatives."
    source_ids: []
  - rule_id: validate_uuid_identity
    applies_to: "UUID-bearing rows"
    rule: "Recheck public state 100, English and Chinese baseNames, flow type, classification, property, unit group, and reference unit; an exact fitting UUID remains required before publishing a fitting-specific dataset."
    source_ids: []
  - rule_id: validate_copper_balance
    applies_to: "forming"
    rule: "Check the disclosed copper mass balance and investigate unexplained differences; do not close the balance by changing measured product or scrap."
    source_ids: []
  - rule_id: validate_energy_emissions
    applies_to: "natural gas and fossil CO2"
    rule: "Confirm direct fossil CO2 uses only on-site fuel combustion, cites the retained factor or carbon-balance record, and excludes upstream electricity and fuel-supply emissions."
    source_ids: []
  - rule_id: validate_internal_loops
    applies_to: "water, emulsion, acid, and copper recirculation"
    rule: "Confirm internal recirculation is not duplicated as external input or output and only net boundary crossings are normalized."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_bilingual_alignment
    applies_to: "bilingual PCR rendering"
    rule: "Confirm ordered process ids, row ids, UUIDs, controlled tokens, rule ids, amounts, range status, and source ids are identical in English and Chinese."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for one declared copper tube, pipe, or fitting product and route"
  downstream_use: "secondary_dataset; background_dataset after review of representativeness and unresolved identities"
  allowed_use: "Product-footprint, process, and lifecyclemodel studies needing mass-normalized factory-gate copper tube, pipe, or fitting production, provided product and route qualifiers match"
  excluded_use: "Copper mining or refining; generic unwrought copper; installed piping systems; use-stage service; end-of-life; other metals; fitting-specific publication while the fitting UUID is unresolved"
  required_metadata: "PCR id and version; product form; alloy; dimensions; temper; finish; route; starting material; recycled-content method; site geography; reference period; technology; included operations; internal loops; allocation; upstream datasets; packaging boundary"
  required_quality_disclosure: "Meter and scale coverage; calibration; batch and temporal coverage; mass-balance closure; shared-meter allocation; gas reference conditions; chemical concentration; sludge moisture; representativeness; unresolved UUID and range evidence"
  update_trigger: "Material change in product form, alloy, feedstock, route, furnace, drawing or rolling technology, surface treatment, treatment boundary, energy supply, site geography, allocation, reference period, exact flow identity, or source-backed evidence"
