allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "shared foreground operations"
    rule: "First avoid allocation by subdividing unit operations or using separately metered material, energy, emission, and production records. Document the subdivision and retained shared services."
    source_ids:
      - epd-pcr-2023-01-v2-0-1
      - ica-copper-environmental-profile-2018
  - rule_id: allocation_internal_loops
    applies_to: "internal copper, alloy, dust, acid, water, and energy returns"
    rule: "Keep internal returns inside the foreground mass and energy balances. Do not treat an internal loop as a co-product, recycled-content input, avoided burden, or duplicate upstream input."
    source_ids:
      - epd-pcr-2023-01-v2-0-1
  - rule_id: allocation_coproducts
    applies_to: "saleable metals, acid, slag products, recovered compounds, and exported energy"
    rule: "Identify each co-product and its point of separation. When subdivision is not possible, use a documented physical causal relation; if none can be supported, use economic allocation with a declared representative price period and sensitivity check. Do not apply substitution credit silently."
    source_ids:
      - ica-copper-environmental-profile-2018
      - epd-pcr-2023-01-v2-0-1
  - rule_id: allocation_scrap_status
    applies_to: "secondary copper-bearing inputs and metal outputs sent for recycling"
    rule: "Declare whether each stream is waste or a product at the foreground boundary and the end-of-waste basis used. Unknown-origin scrapyard material is treated as waste for the EPD-PCR allocation convention; report alternative conventions separately rather than mixing them."
    source_ids:
      - epd-pcr-2023-01-v2-0-1
  - rule_id: allocation_route_transparency
    applies_to: "primary, secondary, mixed, alloy, and master-alloy datasets"
    rule: "Report primary and secondary feed shares, copper-content basis, internal return share, co-product method, and allocated burdens by route. A mixed dataset shall be production-weighted from separately documented route inventories."
    source_ids:
      - ica-copper-environmental-profile-2018
      - eu-jrc-nfm-bref-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_input_records
      process_id: "feed_preparation_alloy_master_alloy_melting"
      flow_role: "Copper-bearing feed and alloy additions"
      record_type: "Weighbridge, scale, receiving, batch, certificate, and assay records"
      raw_fields: "material_id; supplier_or_source; product_or_waste_status; gross_mass; tare_mass; moisture; copper_fraction; alloying_element_fractions; lot_time; destination"
      collection_method: "Reconcile accepted net mass to inventory movement and match each lot with representative composition evidence"
      unit: "kg material; kg element; mass fraction"
      frequency: "Per lot, aggregated monthly"
      temporal_coverage: "At least 12 representative consecutive months or the full shorter campaign"
      site_scope: "Every included facility and route"
      aggregation_rule: "Sum accepted dry or as-received mass consistently; calculate elemental mass only from matched mass and composition"
      quality_evidence: "Scale calibration; assay method; certificate traceability; stock reconciliation"
    - protocol_id: cp_energy_records
      process_id: "feed_preparation_copper_recovery_refining"
      flow_role: "Electricity, fuel, oxygen, steam, and heat"
      record_type: "Meter, invoice, tank, and operating-hour records"
      raw_fields: "carrier_id; meter_start; meter_end; purchase; stock_change; export; lower_or_higher_heating_value; unit_operation; period"
      collection_method: "Prefer submetering; otherwise allocate by documented operating driver and reconcile to site totals"
      unit: "kWh; MJ; kg; Nm3"
      frequency: "Continuous or per delivery, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included unit operation and shared utility"
      aggregation_rule: "Net carrier use equals measured input plus stock decrease minus export and documented non-foreground use"
      quality_evidence: "Meter calibration; invoice reconciliation; heating-value source; allocation rationale"
    - protocol_id: cp_auxiliary_material_records
      process_id: "feed_preparation_copper_recovery_refining"
      flow_role: "Water, fluxes, reductants, acids, extraction reagents, electrolyte additions, and other aids"
      record_type: "Meter, issue, purchase, tank, and stock records"
      raw_fields: "material_id; quantity; concentration; opening_stock; closing_stock; return; unit_operation; period"
      collection_method: "Reconcile deliveries and stock changes; record solution concentration and recovered returns separately"
      unit: "kg; m3; mass fraction"
      frequency: "Per delivery or batch, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included unit operation"
      aggregation_rule: "Consumption equals receipts plus opening stock minus closing stock minus documented returns or transfers"
      quality_evidence: "Meter calibration; inventory reconciliation; chemical specification"
    - protocol_id: cp_material_balance_records
      process_id: "feed_preparation_copper_recovery_refining_product_forming_dispatch"
      flow_role: "Process transfers and metal balance"
      record_type: "Transfer scales, inventories, assays, and production logs"
      raw_fields: "stream_id; input_mass; output_mass; inventory_start; inventory_end; moisture; element_fraction; internal_return; period"
      collection_method: "Reconcile total material and copper or declared alloying elements over matched boundaries and periods"
      unit: "kg material; kg element"
      frequency: "Per batch where available, reconciled monthly and annually"
      temporal_coverage: "Same period as product output"
      site_scope: "Each included process and facility"
      aggregation_rule: "Input plus inventory decrease equals output, transfer, release, and residue within documented uncertainty"
      quality_evidence: "Balance closure; scale calibration; matched assays; investigation log"
    - protocol_id: cp_product_acceptance_records
      process_id: "copper_recovery_refining_alloy_master_alloy_melting_product_forming_dispatch"
      flow_role: "Refined copper, alloy melt, and producer-gate product"
      record_type: "Scale, batch, laboratory, and release records"
      raw_fields: "product_id; grade; form; net_mass; copper_fraction; alloying_element_fractions; impurity_results; release_status; timestamp"
      collection_method: "Match net mass with the released batch or period and the applicable composition or purity specification"
      unit: "kg; mass fraction"
      frequency: "Per batch or dispatch"
      temporal_coverage: "Full reference period"
      site_scope: "Every included production line and product grade"
      aggregation_rule: "Sum only released conforming product; track off-specification and internal returns separately"
      quality_evidence: "Scale calibration; laboratory QA; product certificate; release authorization"
    - protocol_id: cp_coproduct_dispatch_records
      process_id: "copper_recovery_refining_emission_residue_control"
      flow_role: "Co-products, recovered outputs, and exported energy"
      record_type: "Scale, meter, inventory, sales, and transfer records"
      raw_fields: "output_id; mass_or_energy; composition; acceptance_status; destination; revenue_basis_if_used; timestamp"
      collection_method: "Match physical dispatch or internal transfer to specification and destination"
      unit: "kg; kWh; MJ"
      frequency: "Per dispatch, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included facility"
      aggregation_rule: "Sum accepted dispatches and adjust for inventory change; keep internal returns separate"
      quality_evidence: "Scale or meter calibration; certificate; destination receipt; price-period evidence if allocated economically"
    - protocol_id: cp_residue_transfer_records
      process_id: "all_processes"
      flow_role: "Rejects, slag, dross, dust, sludge, spent media, wastewater residue, and waste"
      record_type: "Scale, manifest, laboratory, and destination records"
      raw_fields: "residue_id; mass; moisture; composition; hazard_status; internal_or_external; destination; treatment; timestamp"
      collection_method: "Measure transfer mass and retain classification and destination evidence"
      unit: "kg; mass fraction"
      frequency: "Per transfer, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included facility"
      aggregation_rule: "Sum by residue identity and destination; subtract documented internal returns from external transfers"
      quality_evidence: "Scale calibration; waste manifest; assay; treatment receipt"
    - protocol_id: cp_direct_release_monitoring
      process_id: "all_processes"
      flow_role: "Direct air and water releases"
      record_type: "Continuous monitor, stack test, discharge sampling, flow meter, and operating records"
      raw_fields: "release_id; compartment; concentration; flow; duration; detection_limit; oxygen_or_moisture_reference; control_status; period"
      collection_method: "Match concentration with representative flow and operating time; preserve below-detection treatment and reference conditions"
      unit: "kg; mg/Nm3; mg/L; Nm3; m3"
      frequency: "Continuous where available and at permit or representative test frequency"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included discharge point"
      aggregation_rule: "Calculate mass release per point and pollutant, then sum without duplicating controlled streams and final discharge"
      quality_evidence: "Calibration; accredited test; sampling plan; permit report; data-coverage statement"
    - protocol_id: cp_energy_and_aid_campaign_records
      process_id: "alloy_master_alloy_melting"
      flow_role: "Campaign energy and process aids"
      record_type: "Meter, furnace log, batch, issue, and stock records"
      raw_fields: "campaign_id; product_grade; carrier_use; aid_mass; charge_mass; tap_mass; start_time; end_time"
      collection_method: "Reconcile campaign-specific use to accepted melt and record shared-load allocation"
      unit: "kWh; MJ; kg"
      frequency: "Per melt campaign"
      temporal_coverage: "Representative campaigns covering the reference period"
      site_scope: "Each alloy or master-alloy furnace and grade family"
      aggregation_rule: "Production-weight accepted campaigns; disclose excluded or abnormal campaigns"
      quality_evidence: "Meter calibration; batch log; stock reconciliation; campaign coverage"
    - protocol_id: cp_forming_packaging_records
      process_id: "product_forming_dispatch"
      flow_role: "Forming inputs and packaging"
      record_type: "Meter, batch, packaging issue, and dispatch records"
      raw_fields: "product_grade; accepted_mass; energy; water; mould_treatment; packaging_material; packaging_mass; pallet_mass; dispatch_id"
      collection_method: "Match forming and packaging inputs to accepted dispatched output"
      unit: "kWh; MJ; kg; m3"
      frequency: "Per batch or dispatch, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included forming and dispatch line"
      aggregation_rule: "Sum by product grade; keep packaging outside net metal reference mass"
      quality_evidence: "Dispatch reconciliation; packaging specification; meter calibration"
    - protocol_id: cp_internal_return_records
      process_id: "product_forming_dispatch"
      flow_role: "Internal metal returns"
      record_type: "Transfer scale, batch, source, and destination records"
      raw_fields: "return_id; source_process; destination_process; mass; composition; timestamp"
      collection_method: "Record one transfer identity at source and destination"
      unit: "kg"
      frequency: "Per transfer, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Entire included foreground"
      aggregation_rule: "Count once in each process balance but eliminate as an external foreground input/output at system level"
      quality_evidence: "Transfer reconciliation; scale calibration; matched source and destination logs"
    - protocol_id: cp_abatement_records
      process_id: "emission_residue_control"
      flow_role: "Controlled streams and treatment inputs"
      record_type: "Control-system meter, operating, maintenance, reagent, and transfer records"
      raw_fields: "control_id; source_stream; flow; operating_time; reagent; energy; captured_mass; discharge_point; downtime"
      collection_method: "Match control operation to source operation and final release or residue records"
      unit: "kg; m3; Nm3; kWh; h"
      frequency: "Continuous or per batch, aggregated monthly"
      temporal_coverage: "Same period as served production"
      site_scope: "Every included control system"
      aggregation_rule: "Reconcile received stream, captured output, residual release, and inventory change"
      quality_evidence: "Monitor calibration; maintenance log; downtime record; reagent reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground rows"
      rule: "normalized amount = period amount / net conforming period output × 1,000 kg"
      inputs:
        - "period flow amount"
        - "net conforming producer-gate product mass"
      output: "Flow amount per 1,000 kg reference product"
      source_ids:
        - epd-pcr-2023-01-v2-0-1
        - ica-copper-environmental-profile-2018
    - id: calc_dry_mass
      applies_to: "Moisture-bearing materials"
      rule: "dry mass = as-received mass × (1 - measured moisture mass fraction)"
      inputs:
        - "as-received mass"
        - "matched moisture fraction"
      output: "Dry mass and retained as-received mass"
      source_ids:
        - eu-jrc-nfm-bref-2017
    - id: calc_element_mass
      applies_to: "Copper and alloying-element balances"
      rule: "element mass = material mass × matched element mass fraction"
      inputs:
        - "material mass"
        - "assay or certificate fraction"
      output: "kg copper or declared alloying element"
      source_ids:
        - eu-jrc-nfm-bref-2017
    - id: calc_material_balance
      applies_to: "Each process and total foreground"
      rule: "closure difference = inputs + inventory decrease - products - co-products - wastes - elementary releases - inventory increase; report the difference and investigated causes"
      inputs:
        - "Matched material transfers"
        - inventories
        - composition
        - releases
        - "and residues"
      output: "Material and element balance closure statement"
      source_ids:
        - eu-jrc-nfm-bref-2017
        - ica-copper-environmental-profile-2018
    - id: calc_recycled_content
      applies_to: "Secondary or mixed-route products"
      rule: "external recycled content = eligible external secondary-material mass entering the foreground / net reference product mass; report both material-mass and copper-content bases and exclude internal returns"
      inputs:
        - "External secondary input mass and copper content"
        - "internal return mass"
        - "net product mass"
      output: "Recycled-content fractions with stated basis"
      source_ids:
        - epd-pcr-2023-01-v2-0-1
    - id: calc_direct_release
      applies_to: "Air and water releases"
      rule: "mass release = matched concentration × discharge flow × operating duration, with unit and reference-condition conversion documented"
      inputs:
        - Concentration
        - flow
        - time
        - "detection-limit rule"
        - "reference conditions"
      output: "kg release per pollutant and discharge point"
      source_ids:
        - eu-jrc-nfm-bref-2017
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and all route outputs"
      requirement: "Product family, grade, composition or purity, unwrought form, route, location, period, and acceptance specification shall be traceable to released product records."
      evidence: "Product certificates, laboratory results, batch release, and dispatch records"
    - id: dq_temporal_representativeness
      applies_to: "Foreground inventory"
      requirement: "Use at least 12 consecutive representative months unless a shorter campaign is the full production cycle; disclose shutdowns, abnormal campaigns, missing periods, and production weighting."
      evidence: "Production calendar, meter coverage, campaign list, and completeness calculation"
    - id: dq_route_separation
      applies_to: "Primary, secondary, alloy, and master-alloy routes"
      requirement: "Separate materially different routes, furnaces, feed classes, and product grades where metering or records permit; justify every aggregation."
      evidence: "Process map, meter map, batch records, and aggregation rationale"
    - id: dq_measurement_control
      applies_to: "Mass, composition, energy, water, and emissions"
      requirement: "Use calibrated instruments and documented laboratory or monitoring methods; state detection-limit and missing-data treatment."
      evidence: "Calibration certificates, QA/QC records, accredited test reports, and substitution log"
    - id: dq_balance_completeness
      applies_to: "Material, copper, alloying-element, water, and energy balances"
      requirement: "Reconcile included flows over matched periods and investigate material gaps; do not force closure by hiding discrepancies in an unspecified loss flow."
      evidence: "Balance workbook, inventory reconciliation, investigation record, and signed review"
    - id: dq_upstream_compatibility
      applies_to: "Upstream and external treatment datasets"
      requirement: "Assess geography, technology, time, product identity, recycled-content convention, and boundary compatibility; disclose proxies and excluded stages."
      evidence: "Dataset metadata, source review, proxy register, and coverage statement"
    - id: dq_allocation_transparency
      applies_to: "Shared operations and co-products"
      requirement: "Retain subdivision, causal, physical, economic, and sensitivity evidence sufficient to reproduce allocated amounts."
      evidence: "Metering map, allocation workbook, price-period evidence, and sensitivity results"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Fail if the product is not a refined copper, unwrought copper alloy, or copper master alloy, or if grade/composition, unwrought form, route, producer gate, and reference period are missing."
    source_ids:
      - unsd-cpc-3-0
      - epd-pcr-2023-01-v2-0-1
  - rule_id: validate_reference_mass
    applies_to: "Reference amount"
    rule: "Fail unless the net conforming reference product is exactly 1,000 kg on the Mass property and packaging and internal returns are excluded from that mass."
    source_ids:
      - epd-pcr-2023-01-v2-0-1
      - ica-copper-environmental-profile-2018
  - rule_id: validate_route_processes
    applies_to: "Process map"
    rule: "Fail if a route-relevant recovery, refining, alloying, master-alloy, product-forming, abatement, or residue-management operation is omitted without an upstream dataset or explicit exclusion rationale."
    source_ids:
      - eu-jrc-nfm-bref-2017
      - ica-copper-environmental-profile-2018
  - rule_id: validate_feed_status
    applies_to: "Primary and secondary feed"
    rule: "Fail if feed identity, mass basis, composition, product/waste status, origin, or internal-return treatment is missing or inconsistent across receipt and process transfer records."
    source_ids:
      - epd-pcr-2023-01-v2-0-1
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_balance
    applies_to: "Material and element balances"
    rule: "Fail if material and copper or declared alloying-element balances are absent, use unmatched periods, or contain an unexplained closure difference hidden as an unspecified loss."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_direct_releases
    applies_to: "Air and water inventory"
    rule: "Fail if controlled streams are counted both before and after treatment, or if a calculated release lacks matched concentration, flow, duration, units, and detection-limit treatment."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_coproduct_allocation
    applies_to: "Co-products and shared operations"
    rule: "Fail if a co-product is omitted, an internal return is credited as a co-product, or an allocation/substitution method lacks a separation point, rationale, representative period, and reproducible calculation."
    source_ids:
      - ica-copper-environmental-profile-2018
      - epd-pcr-2023-01-v2-0-1
  - rule_id: validate_data_coverage
    applies_to: "Foreground period"
    rule: "Fail if temporal, facility, route, or product-grade coverage is not reported, or if missing data and proxies are not disclosed."
    source_ids:
      - epd-pcr-2023-01-v2-0-1
published_dataset_profile:
  dataset_role: "Producer-gate foreground inventory for one declared refined copper, unwrought copper-alloy, or copper master-alloy product and route"
  downstream_use: "secondary_dataset; background_dataset after methodology review, quality review, and publication controls"
  allowed_use: "Upstream supply modelling for downstream semi-fabrication and product systems when product identity, geography, technology, time, recycled-content convention, allocation, and producer-gate boundary are compatible"
  excluded_use: "Direct comparison of unlike grades, pure copper versus alloys or master alloys, primary versus secondary routes, or different recycled-content and co-product conventions without harmonization; use as a semi-finished or finished-product dataset; use as a generic copper proxy when required qualifiers are unknown"
  required_metadata: "PCR id and version when published; product family; grade and composition; purity or copper content; unwrought form; primary/secondary/mixed route and feed shares; recycled-content basis; facilities and included unit operations; geography; technology; reference period; net reference mass; packaging; upstream datasets; co-products; allocation and cut-off methods; data coverage"
  required_quality_disclosure: "Meter and assay coverage; calibration and laboratory methods; material and element balance closure; temporal and site coverage; route aggregation; direct-emission monitoring coverage; missing-data and detection-limit treatment; proxy datasets; allocation sensitivity; unresolved limitations"
  update_trigger: "Change in grade or product form, route or furnace technology, feed origin or primary/secondary share, recycled-content convention, co-product treatment, system boundary, abatement, facility mix, allocation method, upstream electricity or major material dataset, or evidence that materially changes normalized results"
