measurement_rules:
  - id: reference_product_mass
    applies_to: "Conforming reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine net product mass on calibrated scales and normalize all foreground amounts to 1,000 kg. Exclude packaging, pallets, internal return material, off-specification product, adhering process liquid, and unremoved dross from the reference mass."
  - id: dry_or_as_received_basis
    applies_to: "Ores, concentrates, secondary feeds, fluxes, and residues"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "State whether each quantity is dry or as received. Record moisture measurements and convert to dry mass only where the chosen basis requires it; do not mix dry and wet bases in one balance."
  - id: metal_content_basis
    applies_to: "Copper-bearing and alloying inputs, products, co-products, dusts, sludges, and slags"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg element and kg material"
    rule: "Record material mass and assayed copper or alloying-element fraction separately. Elemental mass shall be calculated from matched lot or period records and shall not replace total material mass."
  - id: energy_carrier_preservation
    applies_to: "Electricity, fuels, steam, and recovered energy"
    required_property_ref:
      name: "Carrier-specific energy property"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Preserve the metered carrier and unit. Convert only with a declared factor and heating-value basis; do not combine electricity, fuel mass, steam, and recovered heat into an undocumented energy total."
  - id: water_balance_basis
    applies_to: "Withdrawn, recirculated, consumed, discharged, and transferred water"
    required_property_ref:
      name: "Volume or mass"
      uuid: ""
    required_unit: "m3 or kg"
    rule: "Keep withdrawal, recirculation, consumption, discharge, and water contained in products or residues as separate fields. State density when converting between volume and mass."
