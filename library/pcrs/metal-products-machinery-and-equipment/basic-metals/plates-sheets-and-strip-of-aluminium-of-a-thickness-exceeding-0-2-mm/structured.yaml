system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins with receipt of the declared metallic feedstock at the reporting plant, or with molten metal receipt when casting is controlled by the same product system, and ends with net saleable plate, sheet or strip in its declared delivery state at the producer gate. Include all selected route operations, utilities, consumables, direct releases, treatment of on-site wastes and internal scrap-remelting operations controlled within this boundary. Upstream primary aluminium, recycled ingot, alloying material, electricity, fuel, chemicals, water, packaging and off-site treatment remain linked product or waste inputs with appropriate upstream datasets."
      source_ids: []
    - rule_id: boundary_route_complete
      applies_to: "Foreground production route"
      rule: "Include every controlled operation needed to reach the declared delivery state: feedstock preparation or on-site casting where applicable, hot or continuous casting/rolling route, cold rolling where used, annealing/heat treatment, surface treatment, trimming/slitting, internal scrap handling and packaging."
      source_ids:
        - european-aluminium-epr-2024
    - rule_id: boundary_upstream_visible
      applies_to: "Purchased metallic feedstock"
      rule: "Keep primary aluminium, recycled wrought-alloy ingot, slab, molten metal and reroll stock visible as upstream product inputs with source-specific datasets and disclosed primary/recycled shares."
      source_ids:
        - european-aluminium-epr-2024
    - rule_id: boundary_recursive_input
      applies_to: "Same-category purchased input"
      rule: "Do not recursively model purchased same-category plate, sheet or strip as if produced by the reporting plant; link it to an upstream dataset and include only the actual downstream transformation."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_downstream_excluded
      applies_to: "Downstream application"
      rule: "Exclude fabrication into battery cases, photovoltaic supports, vehicles, building products or other components, and exclude distribution beyond the producer gate, installation, use and end-of-life unless a separately declared study extends the system."
      source_ids:
        - unsd-cpc-3-0-41534
boundary_abstraction:
  declared_starting_condition: "Receipt of identified ingot, rolling slab, molten aluminium, continuous-cast strip feedstock or purchased reroll stock at the reporting plant"
  starting_condition_role: "Upstream product input whose primary/recycled origin, alloy family, geography and supplier dataset are disclosed; on-site casting is foreground when controlled by the reporting system"
  product_classification_scope: "CPC 3.0 41534 plate, sheet and strip with finished thickness > 0.2 mm; foil ≤ 0.2 mm and other aluminium product forms are outside scope"
  recursive_input_rule: "Purchased plate, sheet, strip or reroll stock in the same category remains an explicit product input; model only the downstream transformations performed in the foreground and link the purchased input to its upstream dataset instead of recreating the same category recursively"
  upstream_dataset_requirement: "Use supplier-specific or otherwise representative datasets for primary aluminium, recycled wrought-alloy ingot, cast stock, alloying additions, energy, chemicals, water, packaging and off-site waste treatment; disclose geography, technology and temporal mismatch"
  disclosure: "Declare route, cast-stock source, alloy/temper, gauge, annealing, surface treatment, primary/recycled shares, internal and exported scrap routes, delivery state, cut-offs and any operation performed outside the reporting plant"
