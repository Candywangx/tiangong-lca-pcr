allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "Multiple alloys, gauges, tempers, routes or surface states"
    rule: "Prefer campaign, line and process subdivision and direct metering. A single-alloy, single-coating or single-application dataset shall not be extrapolated to the category."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_shared_operations
    applies_to: "Shared utilities and finishing operations"
    rule: "Use a physical relationship that reflects causality, such as metered energy, furnace occupancy, line time or processed mass; disclose the basis and test sensitivity when the choice materially changes results."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_internal_scrap
    applies_to: "Edge, crop and trim scrap returned inside the same product system"
    rule: "Keep the return loop visible through gross scrap generation and remelting/return records, include controlled remelting burdens, and do not count the same internal scrap as both avoided primary aluminium and external recycled-content input."
    source_ids:
      - iai-aluminium-scrap-2025
  - rule_id: allocation_boundary_scrap
    applies_to: "Process scrap entering or leaving the product-system boundary"
    rule: "State whether cut-off, substitution or co-product treatment is used and apply it consistently to both scrap generation and scrap use; do not combine credits from more than one approach."
    source_ids:
      - iai-aluminium-scrap-2025
  - rule_id: allocation_recycled_content
    applies_to: "Primary and recycled aluminium shares"
    rule: "Calculate shares from traceable metallic charge after separately identifying internal return, pre-consumer and post-consumer scrap; disclose the product-system boundary and recycled-content definition."
    source_ids:
      - iai-aluminium-scrap-2025
  - rule_id: allocation_dross
    applies_to: "Dross and skimmings"
    rule: "Record treatment and recovered metal explicitly; model residues and recovery operations according to their actual boundary and destination rather than assuming all dross is saleable co-product."
    source_ids:
      - iai-aluminium-scrap-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_cast_stock_records
      process_id: "cast_stock_preparation"
      flow_role: "metallic charge, cast stock, utilities, residues and direct releases"
      record_type: "weighbridge, charge sheet, inventory movement, meter, laboratory and environmental record"
      raw_fields: "batch id; supplier; alloy; origin category; input/output mass; stock change; carrier quantity; residue mass; recovered metal; release quantity"
      collection_method: "reconcile charge, production and environmental records by cast campaign"
      unit: "kg, kWh, MJ, m3 or substance reporting unit"
      frequency: "each cast/campaign with monthly reconciliation"
      temporal_coverage: "representative 12 consecutive months or declared campaign"
      site_scope: "all included melting/casting lines and outsourced steps identified"
      aggregation_rule: "sum accepted records, subtract documented stock change and normalize to accepted cast-stock output"
      quality_evidence: "calibrated scales/meters, certificates of analysis, supplier declarations, manifests and environmental reports"
    - protocol_id: cp_hot_rolling_records
      process_id: "hot_rolling"
      flow_role: "rolling stock, energy, consumables, product, scrap and releases"
      record_type: "production order, meter, tank, weighbridge and environmental record"
      raw_fields: "campaign; slab id; alloy; input/output mass; fuel; electricity; oil; water; scrap mass/destination; release quantity"
      collection_method: "join records by rolling campaign and reconcile metal mass"
      unit: "kg, kWh, MJ, m3 or substance reporting unit"
      frequency: "each campaign with monthly reconciliation"
      temporal_coverage: "representative 12 consecutive months or declared campaign"
      site_scope: "all included hot mills and reheating furnaces"
      aggregation_rule: "allocate direct records first, then documented causal physical driver"
      quality_evidence: "calibration records, production reconciliation and waste manifests"
    - protocol_id: cp_continuous_route_records
      process_id: "continuous_casting_rolling"
      flow_role: "molten feed, energy, consumables, strip, scrap and residues"
      record_type: "cast log, meter, tank, weighbridge and environmental record"
      raw_fields: "campaign; alloy; molten input; strip output; fuel; electricity; water; lubricant; scrap/residue mass and destination"
      collection_method: "join records by casting campaign and reconcile metal mass"
      unit: "kg, kWh, MJ, m3 or substance reporting unit"
      frequency: "each campaign with monthly reconciliation"
      temporal_coverage: "representative 12 consecutive months or declared campaign"
      site_scope: "all included casting/rolling lines"
      aggregation_rule: "allocate direct records first, then documented causal physical driver"
      quality_evidence: "calibrated meters/scales, cast logs and waste manifests"
    - protocol_id: cp_cold_rolling_records
      process_id: "cold_rolling"
      flow_role: "incoming stock, energy, lubricant, output and wastes"
      record_type: "coil genealogy, production order, meter, lubricant and waste record"
      raw_fields: "coil id; alloy; temper stage; thickness in/out; input/output mass; electricity; lubricant; water; scrap; spent media"
      collection_method: "join by coil/campaign and reconcile metal mass"
      unit: "kg, kWh, m3 or measured unit"
      frequency: "each coil/campaign with monthly reconciliation"
      temporal_coverage: "representative 12 consecutive months or declared campaign"
      site_scope: "all included cold mills"
      aggregation_rule: "sum product-specific records; shared loads use disclosed physical driver"
      quality_evidence: "coil genealogy, calibrated meters/scales and waste manifests"
    - protocol_id: cp_heat_treatment_records
      process_id: "annealing_heat_treatment"
      flow_role: "charge, energy, gas, output and direct emissions"
      record_type: "furnace batch, recipe, meter and emission record"
      raw_fields: "furnace; cycle; alloy; temper in/out; charge/output mass; time/temperature; fuel; electricity; gas; monitored emissions"
      collection_method: "join furnace cycle to treated lots and normalize to accepted output"
      unit: "kg, kWh, MJ, Nm3 or substance reporting unit"
      frequency: "each furnace cycle"
      temporal_coverage: "representative 12 consecutive months or declared campaign"
      site_scope: "all included furnaces and outsourced treatment identified"
      aggregation_rule: "direct batch record or occupancy/treated-mass allocation with basis disclosed"
      quality_evidence: "furnace logs, calibrated meters and conformance test records"
    - protocol_id: cp_surface_treatment_records
      process_id: "surface_treatment"
      flow_role: "substrate, chemicals, coating, water, energy, product, wastewater and releases"
      record_type: "treatment lot, bath log, coating record, meter, discharge and waste record"
      raw_fields: "lot; treatment; substrate/coating mass; chemical make-up; water; energy; wastewater; sludge; release quantity"
      collection_method: "join treatment lot and bath records; allocate shared bath losses by causal driver"
      unit: "kg, m3, kWh, MJ or substance reporting unit"
      frequency: "each lot with bath and monthly reconciliation"
      temporal_coverage: "representative 12 consecutive months or declared campaign"
      site_scope: "every included treatment/coating line and outsourced step"
      aggregation_rule: "direct lot record or documented area/mass/line-time driver"
      quality_evidence: "bath analyses, coating tests, meter calibration, discharge reports and manifests"
    - protocol_id: cp_finishing_records
      process_id: "finishing_delivery"
      flow_role: "incoming product, saleable output, trim scrap, packaging and energy"
      record_type: "coil/cut-length genealogy, scale, inspection, packing and dispatch record"
      raw_fields: "product id; alloy; temper; thickness; route; surface; input/output mass; scrap; package mass; delivery state"
      collection_method: "join final genealogy to accepted output and dispatch; exclude packaging from reference mass"
      unit: "kg, kWh or measured unit"
      frequency: "each saleable lot with monthly reconciliation"
      temporal_coverage: "representative 12 consecutive months or declared campaign"
      site_scope: "all finishing and packing lines"
      aggregation_rule: "sum accepted lot records to 1,000 kg reference product"
      quality_evidence: "calibrated scale, inspection certificate, packing list and dispatch record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory exchanges"
      rule: "normalized amount = reporting-period exchange × 1,000 kg / reporting-period net saleable unpackaged product mass"
      inputs:
        - "exchange quantity"
        - "net saleable unpackaged mass"
      output: "exchange per 1,000 kg reference product"
      source_ids:
        - iso-14044-2006
    - id: calc_metal_balance
      applies_to: "Aluminium-bearing flows"
      rule: "metallic inputs + opening stock = net saleable product + internal return + exported scrap + dross/residue metal + closing stock + documented unrecovered metal; report the reconciliation difference"
      inputs:
        - "charge masses"
        - product
        - scrap
        - residues
        - "stock change"
      output: "metal-balance statement and closure difference"
      source_ids:
        - european-aluminium-epr-2024
    - id: calc_recycled_shares
      applies_to: "Metallic charge"
      rule: "calculate primary, pre-consumer and post-consumer aluminium shares on the declared metallic-input basis; show internal return separately and apply the declared scrap methodology"
      inputs:
        - "supplier declarations"
        - "charge records"
        - "internal return"
        - "scrap origin"
      output: "disclosed primary/recycled shares and denominator"
      source_ids:
        - iai-aluminium-scrap-2025
    - id: calc_area_mass
      applies_to: "Area-based records"
      rule: "mass = measured area × declared finished thickness × product-specific density, or use direct lot mass where available; retain coating mass separately"
      inputs:
        - area
        - thickness
        - "density/composition"
        - "coating mass"
      output: "kg of aluminium substrate and kg of coating"
      source_ids:
        - iso-6361-1-2011
    - id: calc_shared_burden
      applies_to: "Shared lines and utilities"
      rule: "apply the selected causal physical driver to each product group and document denominator, coverage and sensitivity"
      inputs:
        - "metered total"
        - "line time"
        - "furnace occupancy"
        - throughput
        - "product groups"
      output: "allocated foreground exchange by product group"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Preserve alloy designation/composition standard, temper, thickness/tolerance, form/geometry, route, cast-stock source, annealing, surface treatment and delivery state for every represented product group."
      evidence: "inspection certificate, certificate of analysis, production route and dispatch record; iso-6361-1-2011; iso-2107-2023"
    - id: dq_route_coverage
      applies_to: "Product mix"
      requirement: "A category-average dataset must document production-volume weighting and coverage of material routes; otherwise publish a product- or route-specific dataset."
      evidence: "production ledger and weighting calculation"
    - id: dq_recycled_origin
      applies_to: "Metallic charge"
      requirement: "Supplier evidence must distinguish primary aluminium, pre-consumer scrap, post-consumer scrap and internal return, with mass and geographic source."
      evidence: "supplier declaration, purchase/charge record and scrap traceability; iai-aluminium-scrap-2025"
    - id: dq_temporal
      applies_to: "Foreground records"
      requirement: "Use a representative 12-month period unless a campaign-specific dataset is declared; document shutdowns, abnormal production and inventory changes."
      evidence: "reporting-period completeness check"
    - id: dq_completeness
      applies_to: "All included operations"
      requirement: "Reconcile production orders, meters, purchases, wastes, direct releases and outsourced steps; explain omitted flows and demonstrate they do not compromise the study goal."
      evidence: "signed reconciliation and omission register; iso-14044-2006"
    - id: dq_uuid_identity
      applies_to: "UUID-bearing references"
      requirement: "Confirm each selected Tiangong flow without storing a dataset version; a narrower alloy-, coating- or gauge-specific candidate cannot replace the category reference flow."
      evidence: "Tiangong identity readback record retained outside PCR content"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require product flow 4f197be4-7b3b-11dd-ad8b-0800200c9a66, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass group 93a60a57-a4c8-11da-a746-0800200c9a66, kg and exactly 1,000 kg net unpackaged product."
    source_ids:
      - unsd-cpc-3-0-41534
  - rule_id: validate_thickness_scope
    applies_to: "Product scope"
    rule: "Reject any represented product with finished nominal thickness not greater than 0.2 mm and reject foil, extrusion, casting or fabricated-component outputs."
    source_ids:
      - unsd-cpc-3-0-41534
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Reject a package missing alloy/temper, thickness, route, cast-stock source, annealing, surface treatment, primary/recycled shares, scrap-return route or delivery-state declarations; explicit not-applicable values require justification."
    source_ids:
      - iso-6361-1-2011
      - iso-2107-2023
  - rule_id: validate_no_narrow_proxy
    applies_to: "Representativeness claim"
    rule: "Reject a category-average claim based only on one alloy, temper, coating, gauge, application or narrow Tiangong candidate unless the dataset is labelled product-specific and makes no category-average claim."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_route_sequence
    applies_to: "Process map"
    rule: "Require one declared cast-stock starting condition and the complete applicable sequence of hot rolling or continuous casting/rolling, cold rolling, heat treatment, surface treatment and finishing; exclude inapplicable steps explicitly."
    source_ids:
      - european-aluminium-epr-2024
  - rule_id: validate_metal_balance
    applies_to: "Aluminium-bearing flows"
    rule: "Require a disclosed metal-balance equation, stock change and reconciliation difference; internal return scrap must not be double-counted as external input or net output."
    source_ids:
      - iai-aluminium-scrap-2025
  - rule_id: validate_scrap_method
    applies_to: "Scrap and recycled content"
    rule: "Require separate internal, pre-consumer and post-consumer quantities and one consistently applied, disclosed cut-off, substitution or co-product approach for boundary-crossing process scrap."
    source_ids:
      - iai-aluminium-scrap-2025
  - rule_id: validate_surface_mass
    applies_to: "Surface-treated products"
    rule: "Require treatment identity and retained coating/cladding mass; do not use a coated product dataset as an untreated or whole-category default."
    source_ids:
      - iso-6361-1-2011
  - rule_id: validate_data_period
    applies_to: "Foreground data quality"
    rule: "Require declared geography, plants/lines, reference period, product-mix coverage, allocation drivers and evidence for outsourced operations."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground producer-gate dataset for a declared aluminium plate, sheet or strip product or a documented production-weighted product mix"
  downstream_use: "Secondary dataset and background dataset for downstream process or lifecyclemodel construction when product identity, geography, period, route and allocation match the intended use"
  allowed_use: "Product- or route-specific LCA; supplier data packages; battery, photovoltaic, transport or building models that consume the declared semi-finished product; documented production-weighted category mixes"
  excluded_use: "Representing foil ≤ 0.2 mm, extrusions, castings or fabricated components; claiming one alloy/coating/application as the whole category; comparative assertions where product function or omitted life-cycle stages differ"
  required_metadata: "PCR id; reference-flow UUIDs; alloy and composition specification; temper; thickness/tolerance; form/geometry; route and cast-stock source; annealing; surface treatment; primary/pre-/post-consumer shares; internal/exported scrap routes; delivery state; plant/geography; reference period; allocation and cut-off methods"
  required_quality_disclosure: "Product-mix coverage; foreground record coverage; supplier-data coverage; metal-balance closure; meter/scale quality; temporal and geographic representativeness; proxies; outsourced steps; allocation sensitivity; unresolved identity gaps"
  update_trigger: "Material change in alloy/product mix, cast-stock or primary/recycled sourcing, rolling route, annealing, coating, scrap treatment, energy supply, plant technology, allocation method, data period or reference-flow identity"
