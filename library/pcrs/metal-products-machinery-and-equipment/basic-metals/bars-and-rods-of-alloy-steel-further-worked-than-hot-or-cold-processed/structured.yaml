          property_unit: "Mass / kg"
          description: "Record hydrogen fluoride passing the final air-emission control boundary only when a hydrofluoric-acid-containing treatment bath is used."
          amount:
            expression: "Measured stack concentration multiplied by standardised dry gas volume for the represented campaign"
            value_mode: "calculated_value"
            specificity: "technology_specific"
            basis:
              text: "per 1,000 kg net saleable reference product; not applicable when hydrofluoric acid is absent"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_waste_emission_records
              source_ids:
                - eu-2022-2110-ferrous-metals-processing
            ranges: []
allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "multiple products or campaigns sharing equipment"
    rule: "Prefer process subdivision and product-specific metering. Assign shared electricity, fuel, water, chemicals, treatment, and waste by a documented physical driver that reflects causation, such as submetered consumption, treatment throughput, equipment time and load, or measured mass processed."
    source_ids:
      - eu-2022-2110-ferrous-metals-processing
  - rule_id: allocation_scrap_separation
    applies_to: "alloy-steel scrap and zinc-bearing outputs"
    rule: "Report measured scrap and zinc-bearing outputs separately without netting avoided primary production or end-of-life recycling credits into the foreground inventory. State whether each output is waste, recovered material, or co-product and keep any recycling credit as a separate scenario."
    source_ids:
      - worldsteel-lci-study-2021-release
  - rule_id: allocation_residual_method
    applies_to: "unavoidable shared burdens lacking a physical driver"
    rule: "If subdivision and causal physical allocation are not possible, use the most specific documented engineering allocation available, perform a sensitivity check for material results, and disclose the method and affected rows; economic allocation requires explicit review and price-period disclosure."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "further_working_and_finishing"
      flow_role: "steel feedstock, saleable product, scrap, and stock change"
      record_type: "scale tickets, batch records, inventory records, inspection disposition"
      raw_fields: "timestamp; batch; grade; product code; gross mass; tare; net mass; opening stock; closing stock; disposition; scale id"
      collection_method: "Calibrated scales reconciled to production and inventory records"
      unit: "kg"
      frequency: "Each receipt and output movement; campaign reconciliation"
      temporal_coverage: "Same representative period as the reference product, normally at least 12 consecutive months or a justified shorter campaign"
      site_scope: "All lines and storage areas serving the declared product"
      aggregation_rule: "Sum grade- and product-specific movements, apply stock change, and normalize to 1,000 kg net saleable product"
      quality_evidence: "Calibration certificates, traceable tickets, batch genealogy, inventory reconciliation, and explanation of mass-balance residual"
    - protocol_id: cp_energy_records
      process_id: "further_working_and_finishing"
      flow_role: "purchased electricity and natural gas"
      record_type: "submeter, invoice, furnace log, equipment operating record"
      raw_fields: "meter id; opening reading; closing reading; timestamp; energy carrier; voltage; gas reference conditions; NCV; equipment id; operating time; product throughput"
      collection_method: "Read dedicated meters where available; otherwise reconcile invoice totals and allocate by documented equipment load and operating time"
      unit: "MJ for electricity; m3 for natural gas"
      frequency: "Continuous or shift readings with monthly reconciliation"
      temporal_coverage: "Same representative period as production records"
      site_scope: "All included equipment and directly associated treatment systems"
      aggregation_rule: "Subtract exported or unrelated energy, assign included consumption by causal driver, convert electricity at 3.6 MJ/kWh, and normalize to reference flow"
      quality_evidence: "Meter calibration, invoices, supplier mix and voltage evidence, gas quality statement, downtime logs, and allocation worksheet"
    - protocol_id: cp_water_chemical_records
      process_id: "further_working_and_finishing"
      flow_role: "water, acids, alkali, and lubricant"
      record_type: "water meter, purchase record, issue record, bath make-up log, stock record"
      raw_fields: "substance identity; concentration; supplier; lot; mass or volume; opening stock; closing stock; bath id; make-up; purge; recovery; product batch"
      collection_method: "Meter water and reconcile each chemical formulation using purchases, issues, stock changes, and bath logs"
      unit: "kg water, retaining source m3 where metered; kg solution and kg active substance"
      frequency: "Each delivery or issue with shift or batch bath logging; monthly reconciliation"
      temporal_coverage: "Same representative period as production records"
      site_scope: "Every included water loop, chemical bath, and lubricant system"
      aggregation_rule: "Exclude internal recirculation, convert water volume with documented density and reference conditions, calculate active substance from documented concentration, assign by treated product mass or bath throughput, and normalize to reference flow"
      quality_evidence: "Meter calibration, safety data sheet or certificate of analysis, purchase invoice, stocktake, bath analysis, and reconciliation"
    - protocol_id: cp_coating_mass_balance
      process_id: "further_working_and_finishing"
      flow_role: "zinc input, coating retained on product, zinc dross, and recovered zinc"
      record_type: "weigh tickets, purchase and stock records, bath analysis, coating test"
      raw_fields: "zinc receipt; opening bath stock; closing bath stock; dross mass; recovered splash mass; product mass; coated area; coating mass or thickness"
      collection_method: "Reconcile zinc-bearing inputs and outputs over the campaign and verify retained coating by product test"
      unit: "kg"
      frequency: "Each material movement and coating test; campaign reconciliation"
      temporal_coverage: "Same representative period as coated product records"
      site_scope: "Each included zinc-coating line"
      aggregation_rule: "Sum zinc receipts and stock change, reconcile retained coating and zinc-bearing outputs, and normalize to reference flow"
      quality_evidence: "Calibrated scales, bath inventory, coating test reports, recovery tickets, and zinc mass-balance residual"
    - protocol_id: cp_waste_emission_records
      process_id: "further_working_and_finishing"
      flow_role: "wastes, wastewater, and direct air emissions"
      record_type: "waste manifest, tank transfer, wastewater meter and sample, stack test, continuous monitor, documented emission calculation"
      raw_fields: "stream identity; mass or volume; composition; pH; metals; fluoride; oil; solids; destination; concentration; gas flow; fuel data; factor source; control status"
      collection_method: "Measure transfers and monitored releases at the final foreground control boundary; calculate only from traceable collected activity data and documented factors"
      unit: "kg or m3 per stream"
      frequency: "Each transfer; continuous monitoring or permit-compliant sampling; monthly reconciliation"
      temporal_coverage: "Same representative period as production records, including normal operation and disclosed abnormal periods"
      site_scope: "Every included waste, water, and air-emission point"
      aggregation_rule: "Keep streams segregated, subtract documented internal reuse only, calculate concentration-times-flow emissions, assign by causal process driver, and normalize to reference flow"
      quality_evidence: "Manifests, laboratory accreditation and detection limits, flowmeter calibration, stack-test reports, monitoring completeness, factor provenance, and control-equipment logs"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "Normalized amount = campaign amount assigned to the reference product / campaign net saleable product mass × 1,000 kg"
      inputs:
        - "assigned campaign amount"
        - "campaign net saleable product mass"
      output: "amount per 1,000 kg reference product"
      source_ids:
        - worldsteel-lci-study-2021-release
    - id: calc_input_mass
      applies_to: "input_alloy_steel_bar_rod"
      rule: "Received input = receipts + opening attributable stock - closing attributable stock - documented transfers to other products"
      inputs:
        - "receipt mass"
        - "opening stock"
        - "closing stock"
        - "transfer records"
      output: "kg alloy-steel bar or rod input"
      source_ids: []
    - id: calc_active_chemical
      applies_to: "acid and alkali inputs"
      rule: "Active substance mass = solution mass × documented active-substance mass fraction; keep solution water separately if material"
      inputs:
        - "issued solution mass"
        - "certificate or bath concentration"
      output: "kg active HCl, H2SO4, HNO3, HF, or NaOH"
      source_ids:
        - eu-2022-2110-ferrous-metals-processing
    - id: calc_direct_fossil_co2
      applies_to: "fossil_co2_air"
      rule: "Use measured stack mass where available; otherwise calculate from collected fuel consumption and a documented supplier, laboratory, or jurisdiction-approved carbon factor and oxidation basis, without adding upstream fuel emissions"
      inputs:
        - "fuel volume"
        - "reference conditions"
        - NCV
        - "carbon factor"
        - "oxidation basis"
        - "process allocation"
      output: "kg fossil CO2 crossing the foreground air boundary"
      source_ids:
        - eu-2022-2110-ferrous-metals-processing
    - id: calc_stack_mass
      applies_to: "steel_particulate_air, hydrogen_chloride_air, and hydrogen_fluoride_air"
      rule: "Emission mass = representative measured concentration × standardised dry gas volume over the same operating period, adjusted for monitoring coverage and control bypasses"
      inputs:
        - concentration
        - "dry gas flow"
        - "operating time"
        - "oxygen and moisture correction"
        - "control status"
      output: "kg emitted substance"
      source_ids:
        - eu-2022-2110-ferrous-metals-processing
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and steel input"
      requirement: "Preserve batch-level grade, product form, dimensions, tolerance, incoming state, further-working operation, heat treatment, and surface/coating specification; do not combine materially different products without a documented production-weighted aggregation."
      evidence: "Product specification, certificate of analysis, route sheet, inspection record, and batch genealogy"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one coherent representative period, normally at least 12 consecutive months; justify shorter campaigns and disclose shutdowns, start-ups, abnormal operation, stock changes, and missing intervals."
      evidence: "Period register, production calendar, downtime log, and monitoring-completeness report"
    - id: dq_measurement
      applies_to: "measured mass, energy, water, chemical, waste, and emission records"
      requirement: "Use calibrated instruments or traceable commercial records; retain units, reference conditions, detection limits, concentration basis, and conversion factors."
      evidence: "Calibration certificates, invoices, laboratory reports, certificates of analysis, and conversion worksheet"
    - id: dq_completeness
      applies_to: "process and exchange coverage"
      requirement: "Map every declared further-working operation to energy, material, water, chemical, waste, and direct-emission records; document not-applicable evidence for each omitted conditional row."
      evidence: "Process flow sheet, chemical and wastewater/waste-gas inventory, energy balance, water balance, and residues plan"
    - id: dq_upstream
      applies_to: "received alloy-steel bar or rod dataset"
      requirement: "Match supplier, geography, alloy scope, steelmaking route where known, product form, and incoming processing state; disclose proxy use and whether recycling credits or scrap burdens are present."
      evidence: "Supplier dataset metadata, representativeness assessment, and recycling-accounting statement"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Fail if the dataset omits alloy grade, bar or rod form, dimensions/tolerances, incoming state, qualifying further-working operation, heat-treatment state, surface/coating state, net saleable mass basis, site, technology, period, or factory gate."
    source_ids:
      - unsd-cpc-3-0-structure-2025
      - us-cbp-cross-hq-965792
  - rule_id: validate_route_coverage
    applies_to: "foreground process map"
    rule: "Fail if no operation beyond hot or cold processing is declared, if an included operation lacks its atomic exchanges and collection records, or if a conditional route is marked not applicable without production evidence."
    source_ids:
      - eu-2022-2110-ferrous-metals-processing
  - rule_id: validate_inventory_atomicity
    applies_to: "process inventory"
    rule: "Fail if any row combines substances, energy carriers, waste streams, or emission species, or if recovered material, released emission, and captured waste are netted into one exchange."
    source_ids:
      - eu-2022-2110-ferrous-metals-processing
  - rule_id: validate_mass_energy_water
    applies_to: "foreground records"
    rule: "Fail or flag for review when the steel-bearing mass balance exceeds documented measurement and stock uncertainty, when energy or water totals do not reconcile to facility records, or when conversion reference conditions are missing."
    source_ids:
      - eu-2022-2110-ferrous-metals-processing
  - rule_id: validate_recycling_double_count
    applies_to: "scrap and end-of-life scenarios"
    rule: "Fail if an avoided-production or end-of-life recycling credit is netted into the foreground gate-to-gate inventory and also applied by an upstream or downstream model."
    source_ids:
      - worldsteel-lci-study-2021-release
  - rule_id: validate_uuid_resolution
    applies_to: "UUID-bearing and unresolved flows"
    rule: "Require an exact public UUID for the reference product; for any other row without an exact candidate, keep the UUID empty, record the reviewed unresolved reason and receipt, and never substitute a semantically broader proxy."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground product-system dataset for further working and finishing of alloy-steel bars and rods"
  downstream_use: "secondary_dataset; background_dataset after review of upstream feedstock data, route representativeness, allocation, and unresolved UUIDs"
  allowed_use: "Product carbon-footprint and LCA models requiring a factory-gate further-working dataset with matching grade, form, processing route, surface state, geography, technology, period, and recycling-accounting convention"
  excluded_use: "Direct comparison of products with different specifications or functions; substitution for upstream steelmaking; customer fabrication, use, or end-of-life; and use of this candidate PCR as a published generic benchmark"
  required_metadata: "PCR id and version; product and classification identity; alloy grade; dimensions and tolerance; incoming state; qualifying further-working operations; heat treatment; surface/coating specification; net mass basis; site and geography; technology; data period; upstream dataset; allocation; energy, water, chemical, emission-control and waste routes; UUID resolution status"
  required_quality_disclosure: "Temporal and site coverage; measurement and allocation methods; mass, energy, water, chemical and coating reconciliations; missing-data treatment; monitoring completeness; data-source age; upstream representativeness; uncertainty and unresolved range evidence; recycling-credit convention"
  update_trigger: "Change in alloy or product scope, incoming state, qualifying operation, heat-treatment or coating route, site technology, energy supply, bath chemistry, abatement, allocation, upstream steel dataset, recycling convention, legal monitoring basis, or availability of exact TianGong UUIDs and independent range evidence"
