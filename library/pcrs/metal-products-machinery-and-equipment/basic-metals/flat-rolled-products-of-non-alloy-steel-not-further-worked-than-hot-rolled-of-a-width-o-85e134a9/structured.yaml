allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared_foreground_processes"
    rule: "Avoid allocation by submetering and subdividing reheating, rolling, cooling, finishing, water treatment, and ancillary services wherever their exchanges can be assigned directly."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_shared_steel_products
    applies_to: "multiple_conforming_steel_products"
    rule: "After subdivision, allocate remaining shared foreground exchanges among conforming hot-rolled steel products by net product mass over the same accounting period; disclose products, masses, and the calculation."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_internal_recycling
    applies_to: "internal_scale_and_scrap"
    rule: "Model scale and steel scrap returned within the declared system as internal exchanges and report only the net boundary output; do not assign an avoided-product credit to an internal loop."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_exported_recovery
    applies_to: "exported_scale_scrap_or_other_coproduct"
    rule: "For a net exported recovery material with a demonstrated market use, prefer system expansion based on a documented functionally equivalent substituted product and report sensitivity when material; otherwise report the output and treatment without an unverified substitution credit."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_reheating_inputs
      process_id: "reheating_and_conditioning"
      flow_role: "Semi-finished steel, furnace natural gas, and reheating electricity"
      record_type: "Weighbridge, production, gas-meter, and electricity-meter records"
      raw_fields: "charged steel mass; beginning and ending stock; natural-gas volume and reference conditions; electricity; furnace and campaign identifiers"
      collection_method: "Reconcile calibrated meters and production records to the included furnace campaigns."
      unit: "kg; m3; MJ"
      frequency: "Batch or shift capture with monthly reconciliation"
      temporal_coverage: "One representative continuous 12-month period; justify shorter or abnormal periods"
      site_scope: "All foreground reheating and conditioning equipment serving the declared product"
      aggregation_rule: "Sum attributable records, apply documented shared-meter allocation, then divide by conforming reference-product mass and multiply by 1,000 kg."
      quality_evidence: "Calibration certificates; stock reconciliation; meter extracts; production ledger; allocation worksheet"
    - protocol_id: cp_reheating_outputs
      process_id: "reheating_and_conditioning"
      flow_role: "Furnace scale and direct combustion emissions"
      record_type: "Scale weigh tickets, stack-monitoring records, fuel composition, and operating logs"
      raw_fields: "wet and dry scale mass; moisture; internal return; CO2; NOx convention; SO2; stack concentration; dry-gas flow; operating time; fuel carbon and sulfur"
      collection_method: "Use calibrated weighing and stack data; calculations shall retain formula, factors, and measurement basis."
      unit: "kg; kg/Nm3; Nm3; h"
      frequency: "Batch or continuous capture with monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "All included reheating emission points and scale collection"
      aggregation_rule: "Calculate attributable period mass, subtract internal returns where relevant, normalize to 1,000 kg conforming product."
      quality_evidence: "Laboratory results; monitor QA/QC; fuel certificates; weigh tickets; calculation workbook"
    - protocol_id: cp_hot_rolling_inputs
      process_id: "hot_rolling_and_descaling"
      flow_role: "Rolling electricity and descaling makeup water"
      record_type: "Electricity and water meter records"
      raw_fields: "electricity; fresh makeup-water mass or volume and density; transfers; mill campaign and product identifiers"
      collection_method: "Use stage submeters; where unavailable, document engineering allocation from a shared calibrated meter; convert water volume to mass only with documented period-specific density."
      unit: "MJ; kg; m3; kg/m3"
      frequency: "Shift or daily capture with monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "Roughing, finishing-train, descaling-pump, and roller-table equipment in scope"
      aggregation_rule: "Sum net attributable inputs and normalize to 1,000 kg conforming product."
      quality_evidence: "Meter calibration; density record; trend records; allocation worksheet; production ledger"
    - protocol_id: cp_hot_rolling_outputs
      process_id: "hot_rolling_and_descaling"
      flow_role: "Rolling scale, hot-rolling steel scrap, and particulate matter"
      record_type: "Weigh tickets, scale-pit records, scrap ledger, stack tests, and fugitive-emission assessment"
      raw_fields: "scale mass, moisture and oil; scrap mass and internal return; particulate metric, captured mass, fugitive estimate, gas flow and time"
      collection_method: "Reconcile physical outputs with production and water-treatment records; document capture boundary."
      unit: "kg"
      frequency: "Batch or campaign capture with monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "All included rolling stands, descalers, scale pits, and emission points"
      aggregation_rule: "Calculate net boundary output by material, normalize to 1,000 kg conforming product, and keep recovery fate separate from quantity."
      quality_evidence: "Weigh tickets; laboratory moisture/oil tests; monitor reports; scrap-return ledger"
    - protocol_id: cp_finishing_inputs
      process_id: "cooling_and_finishing"
      flow_role: "Wider hot-rolled feedstock, finishing electricity, and cooling makeup water"
      record_type: "Weighbridge, coil-tracking, electricity-meter, and water-meter records"
      raw_fields: "wider input mass and dimensions; beginning and ending stock; electricity; makeup-water mass or volume and density; route and equipment identifiers"
      collection_method: "Link coil or batch identity through finishing; use calibrated meters and route-specific allocation; convert water volume to mass only with documented period-specific density."
      unit: "kg; MJ; m3; kg/m3"
      frequency: "Coil, batch, or shift capture with monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "Cooling, coiling, trimming, slitting, and cutting equipment actually used"
      aggregation_rule: "Sum route-attributable records and normalize to 1,000 kg conforming product."
      quality_evidence: "Coil genealogy; dimensional inspection; calibration and density records; meter extracts"
    - protocol_id: cp_finishing_outputs
      process_id: "cooling_and_finishing"
      flow_role: "Conforming product, finishing scrap, and treated wastewater"
      record_type: "Product weigh tickets, quality release, scrap ledger, and discharge meter"
      raw_fields: "product mass, grade, dimensions and disposition; scrap mass and internal return; treated discharge and assignment basis"
      collection_method: "Reconcile released product, nonconforming product, stock change, scrap, and net water discharge."
      unit: "kg; m3"
      frequency: "Coil or batch capture with monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "Final product release, finishing scrap collection, and attributable wastewater treatment"
      aggregation_rule: "Sum conforming product and net outputs; normalize all non-reference outputs to 1,000 kg conforming product."
      quality_evidence: "Certified scales; inspection release; scrap tickets; discharge-meter records; reconciliation report"
  calculation_rules:
    - id: normalize_period_exchange
      applies_to: "Every variable inventory row"
      rule: "Normalized amount = attributable period exchange / net conforming reference-product mass × 1,000 kg. Use one consistent accounting period and retain unrounded source totals."
      inputs:
        - "attributable period exchange"
        - "net conforming reference-product mass"
      output: "Exchange per 1,000 kg reference product"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: reconcile_steel_mass
      applies_to: "Steel feedstock, reference product, scale, and scrap"
      rule: "Opening steel stock + steel inputs = closing steel stock + conforming product + nonconforming product + internally returned steel + net scale and scrap outputs + documented residual difference. Explain any material residual."
      inputs:
        - "stock records"
        - "feedstock mass"
        - "product mass"
        - scale
        - scrap
        - "internal return"
      output: "Steel mass-balance reconciliation"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calculate_stack_emission_mass
      applies_to: "Reheating CO2, nitrogen oxides, sulfur dioxide, and rolling particulate"
      rule: "Use direct mass monitoring where available; otherwise multiply concentration by compatible dry-gas volume or calculate from verified fuel composition and oxidation data. Preserve wet/dry basis, oxygen correction, reporting species, and time coverage."
      inputs:
        - concentration
        - "gas flow"
        - "operating time"
        - "fuel composition"
        - "correction basis"
      output: "Direct emission mass by atomic reported exchange"
      source_ids:
        - ec-jrc-fmp-bref-2022
        - worldsteel-lci-methodology-2017
    - id: calculate_net_water_boundary
      applies_to: "Descaling water, cooling water, and treated wastewater"
      rule: "Net water input and discharge shall exclude internal recirculation and separately identify transfers, evaporation, entrainment with scale/sludge, and meter imbalance."
      inputs:
        - "intake meters"
        - "discharge meters"
        - transfers
        - "evaporation estimate"
        - "entrainment records"
      output: "Net boundary-crossing water volumes"
      source_ids:
        - ec-jrc-fmp-bref-2022
        - worldsteel-lci-methodology-2017
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and steel inputs"
      requirement: "Retain grade, finished width and thickness, hot-rolled state, form, edge/surface condition, route, and coil or batch genealogy; demonstrate finished width < 600 mm and absence of excluded further work."
      evidence: "Classification and inspection records; un-cpc-3-0-structure-2025"
    - id: dq_temporal_representativeness
      applies_to: "All foreground records"
      requirement: "Use one representative continuous 12-month period where practicable and document shutdowns, abnormal operation, maintenance, and any shorter-period justification."
      evidence: "Period coverage report; production ledger; worldsteel-lci-methodology-2017"
    - id: dq_geography_technology
      applies_to: "Foreground and upstream datasets"
      requirement: "Identify site geography, furnace and mill technology, direct-hot-charge practice, finishing route, fuel supply, electricity supplier or grid, and water-treatment configuration; justify upstream representativeness."
      evidence: "Site description; supplier records; dataset metadata; worldsteel-lci-methodology-2017"
    - id: dq_meter_and_calculation_traceability
      applies_to: "Measured and calculated exchanges"
      requirement: "Preserve raw meter extracts, calibration status, formulas, allocation worksheets, conversions, reporting conventions, and unrounded values sufficient for independent reproduction."
      evidence: "Calibration certificates; calculation workbook; QA/QC records"
    - id: dq_completeness
      applies_to: "Process inventory"
      requirement: "Account for all known material, energy, water, emission, waste, and recovery exchanges by included stage; document every excluded flow against the study cut-off policy without using cut-off to omit all energy."
      evidence: "Completeness checklist and reconciliation; worldsteel-lci-methodology-2017"
validation_rules:
  - rule_id: validate_product_boundary
    applies_to: "reference_product"
    rule: "Confirm non-alloy steel, hot-rolled state, finished width < 600 mm, declared form and dimensions, and absence of excluded cold reduction or surface treatment."
    source_ids:
      - un-cpc-3-0-structure-2025
      - ec-jrc-fmp-bref-2022
  - rule_id: validate_reference_amount
    applies_to: "reference_flow"
    rule: "Confirm exactly 1,000 kg net conforming product after normalization, excluding packaging, nonconforming material, and internally returned scrap."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_route_and_upstream_link
    applies_to: "route_selection"
    rule: "Confirm that every performed stage is included once, every omitted upstream hot-rolling stage is represented by a linked input dataset, and no hot-rolling burden is double counted."
    source_ids:
      - ec-jrc-fmp-bref-2022
      - worldsteel-lci-methodology-2017
  - rule_id: validate_mass_and_water_balances
    applies_to: "foreground_inventory"
    rule: "Reconcile steel mass and net water boundaries for the common accounting period; investigate and disclose residuals before release."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_uuid_and_atomicity
    applies_to: "inventory_identity"
    rule: "Confirm every selected flow is one atomic exchange; directly re-read every adopted TianGong UUID at public state 100 and verify name, flow type, classification, property, unit group, state, geography, technology, and comment. Keep unresolved rows UUID-empty."
    source_ids: []
  - rule_id: validate_allocation_and_recovery
    applies_to: "shared_burdens_and_recovery_outputs"
    rule: "Confirm subdivision was attempted first, internal returns are not double credited, mass allocation uses contemporaneous net product outputs, and every system-expansion credit has documented functional equivalence and sensitivity where material."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validate_bilingual_alignment
    applies_to: "bilingual_pcr_implementation"
    rule: "Confirm English and Chinese implementations have the same process, row, rule, source, UUID, controlled-token, and reference-flow identities."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after methodology review, foreground verification, and publication approval"
  downstream_use: "Cradle-to-gate or wider life-cycle models requiring a separately identified gate-to-gate narrow hot-rolled non-alloy-steel production dataset"
  allowed_use: "Product systems matching the declared width class, steel grade family, hot-rolled state, route, geography, technology, accounting period, allocation, and upstream-dataset boundary"
  excluded_use: "Cold-rolled, coated, clad, plated, pickled-and-oiled, alloy, stainless, electrical-steel, long-product, tube, or width >= 600 mm datasets; comparative assertions without a study-specific functional unit and review"
  required_metadata: "PCR id; product identity and dimensions; route and starting condition; included processes; site and geography; period; furnace and mill technology; fuel and electricity supply; water boundary; allocation; internal recycling and export fates; source and dataset versions; unresolved UUID status"
  required_quality_disclosure: "Primary-data share; temporal, geographic, and technological representativeness; meter/calibration status; calculation and allocation methods; mass- and water-balance residuals; cut-offs; uncertainty; missing data; review status"
  update_trigger: "Change in product classification or state, route, furnace or mill technology, fuel or electricity supply, water treatment, allocation or recovery method, major input/output pattern, source evidence, TianGong UUID identity, or representative production period"
