      applies_to: "downstream_and_further_work"
      rule: "Exclude cold reduction, pickling-and-oiling, cladding, plating, coating, polishing, downstream fabrication, packaging, outbound transport, use, and end of life from the reference boundary unless separately added and reported outside this reference result."
