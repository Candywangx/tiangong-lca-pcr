        - worldsteel-lci-methodology-2017
    - rule_id: boundary_exchange_completeness
      applies_to: "foreground_gate_to_gate_boundary"
      rule: "Record all boundary-crossing materials, fuels, electricity, net water, measured or calculated emissions, wastes, and recovery outputs for included stages; do not replace atomic exchanges with a combined utility, fuel, waste, or emission row."
