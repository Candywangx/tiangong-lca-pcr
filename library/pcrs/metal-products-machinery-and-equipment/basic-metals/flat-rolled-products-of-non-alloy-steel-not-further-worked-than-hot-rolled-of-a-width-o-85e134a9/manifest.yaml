        row_ids: [reheating_furnace_scale, rolling_mill_scale, hot_rolling_steel_scrap, finishing_steel_scrap]
        explanation: "At least two independent sources with compatible accounting of internally recycled versus net exported scale and scrap are needed before empirical yield-loss ranges can be authored."
