allocation_rules:
  - rule_id: alloc_subdivide
    applies_to: "foreground_processes"
    rule: "Avoid allocation by separately metering refining, casting, forming, powder, plating, abatement, and internal recovery operations whenever their inputs and outputs can be measured."
    source_ids: []
  - rule_id: alloc_internal_returns
    applies_to: "internal_silver_loops"
    rule: "Treat internal silver-bearing returns as transfers within the foreground system: record their mass and recovery losses, but do not create a second burden-bearing product output."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: alloc_multi_metal
    applies_to: "inseparable_precious_metal_outputs"
    rule: "When subdivision or a documented physical causal relation is unavailable, allocate shared burdens among saleable silver, gold, and platinum-group outputs using production-period net revenue; disclose prices, period, currency, downstream deductions, and a mass-allocation sensitivity result."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: alloc_waste_recovery
    applies_to: "exported_residues"
    rule: "Classify an exported stream as a co-product only when it meets the receiving market's product specification and has positive net revenue; otherwise model it as waste to the documented treatment or recovery boundary."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_refining_records
      process_id: "silver_refining"
      flow_role: "all refining exchanges"
      record_type: "meter, weighbridge, assay, batch, invoice, and stack records"
      raw_fields: "lot id; feed mass and assay; utilities; reagents; product; residues; wastewater; stack data"
      collection_method: "reconcile batches to calibrated meters and assays"
      unit: "native units per kg refined silver"
      frequency: "each lot or shift, monthly aggregation"
      temporal_coverage: "12 representative months or full shorter campaign"
      site_scope: "refinery and its abatement"
      aggregation_rule: "sum valid records, subtract internal returns, divide by net output"
      quality_evidence: "calibration, assay, coverage, missing-data log, mass balance"
    - protocol_id: cp_casting_records
      process_id: "melting_casting"
      flow_role: "all casting exchanges"
      record_type: "batch, meter, scale, fuel, and stack records"
      raw_fields: "heat id; charge; utilities; product; slag; carbon; stack data"
      collection_method: "reconcile heat sheets to meters and scales"
      unit: "native units per kg cast silver"
      frequency: "each heat, monthly aggregation"
      temporal_coverage: "12 representative months or full shorter campaign"
      site_scope: "melting, casting, extraction, and abatement"
      aggregation_rule: "sum valid heats divided by net cast output"
      quality_evidence: "calibration, heat reconciliation, assay, monitoring QA"
    - protocol_id: cp_forming_records
      process_id: "semi_manufacturing"
      flow_role: "forming exchanges"
      record_type: "order, meter, scale, and inventory records"
      raw_fields: "order; form; input; output; scrap; electricity; lubricant stocks"
      collection_method: "reconcile orders and inventories"
      unit: "kg and kWh per kg product"
      frequency: "each order, monthly aggregation"
      temporal_coverage: "12 representative months or full shorter campaign"
      site_scope: "declared forming and ancillary equipment"
      aggregation_rule: "production-weighted sum divided by net output"
      quality_evidence: "calibration, stock reconciliation, reject log"
    - protocol_id: cp_powder_records
      process_id: "powder_manufacturing"
      flow_role: "powder exchanges"
      record_type: "batch, meter, scale, laboratory, and stack records"
      raw_fields: "technology; feed; utilities; reagents; powder; particle size; moisture; wastewater; stack data"
      collection_method: "reconcile batches, meters, scales, laboratory and abatement records"
      unit: "native units per kg powder"
      frequency: "each batch, monthly aggregation"
      temporal_coverage: "12 representative months or full shorter campaign"
      site_scope: "declared powder technology and abatement"
      aggregation_rule: "keep atomization and wet routes separate unless disclosed production weighting is used"
      quality_evidence: "calibration, assay, particle-size and moisture methods, mass balance"
    - protocol_id: cp_plating_records
      process_id: "precious_metal_plating"
      flow_role: "plating exchanges"
      record_type: "order, bath, meter, scale, assay, and wastewater records"
      raw_fields: "order; coating metal; substrate; bath additions and inventory; recovery; coating assay; utilities; product; wastewater"
      collection_method: "reconcile order and bath metal balances to coating assay"
      unit: "native units per kg plated silver"
      frequency: "each order and bath addition, monthly aggregation"
      temporal_coverage: "12 representative months or full shorter campaign"
      site_scope: "pretreatment through treatment"
      aggregation_rule: "calculate deposited and lost coating metal separately, divide by net output"
      quality_evidence: "calibration, bath reconciliation, coating assay, wastewater analysis"
  calculation_rules:
    - id: calc_normalize_output
      applies_to: "every inventory row"
      rule: "normalized amount = valid reporting-period exchange divided by net conforming process output; preserve original unit and conversion record"
      inputs:
        - "exchange quantity"
        - "net process output"
      output: "amount per kg process output"
      source_ids: []
    - id: calc_silver_balance
      applies_to: "each silver process"
      rule: "silver in feed = silver in products + silver in exported residues/wastes + measured silver emissions + inventory change; report unexplained imbalance"
      inputs:
        - "masses and assays"
        - "opening and closing work in process"
      output: "silver mass balance and closure"
      source_ids:
        - eu-jrc-nfm-bref-2017
    - id: calc_fossil_co2
      applies_to: "direct fossil carbon oxidation"
      rule: "fossil CO2 mass = fully oxidized fossil carbon mass × 44/12; quantify incomplete oxidation separately when material"
      inputs:
        - "fuel or reductant"
        - "fossil carbon fraction"
        - "oxidation fraction"
      output: "kg fossil CO2"
      source_ids: []
    - id: calc_stack_mass
      applies_to: "particulate matter and nitrogen oxides"
      rule: "emitted mass = time-aligned post-abatement concentration × dry gas volume, with documented reference-condition and oxygen corrections"
      inputs:
        - concentration
        - "gas flow"
        - "operating time"
        - corrections
      output: "kg emitted pollutant"
      source_ids:
        - eu-jrc-nfm-bref-2017
    - id: calc_plating_metal
      applies_to: "gold or platinum plating"
      rule: "coating-metal input = supplied metal content + opening bath inventory - closing bath inventory; reconcile deposit, recovery, waste, drag-out, and unexplained loss"
      inputs:
        - "bath additions and assays"
        - inventories
        - "coating assay"
        - "recovery and waste"
      output: "kg gold or platinum by destination"
      source_ids:
        - eu-jrc-stm-bref-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and inputs"
      requirement: "Declare form, assay basis, purity, coating state, feed origin, route, technology, geography, and period; keep UUID-empty rows visibly unresolved."
      evidence: "specifications, assays, supplier records, process declaration"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Use 12 representative continuous months where production is continuous; for shorter campaigns, cover the full campaign and explain representativeness."
      evidence: "dated production, meter, and maintenance records"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Reconcile at least 95% of operating time and production mass; disclose exclusions, estimates, downtime, and missing records."
      evidence: "coverage calculation and missing-data log"
    - id: dq_mass_balance
      applies_to: "silver and coating metals"
      requirement: "Investigate and disclose material unexplained metal imbalance; do not force closure by altering measured quantities."
      evidence: "signed reconciliation and assay uncertainty"
    - id: dq_route_separation
      applies_to: "powder and plating routes"
      requirement: "Keep atomization, wet-chemical powder, gold-plating, and platinum-plating records separate unless production-weighted aggregation is required and components remain disclosed."
      evidence: "route-level production and allocation worksheet"
validation_rules:
  - rule_id: val_reference_flow
    applies_to: "reference_product"
    rule: "Confirm exactly 1 kg net saleable product and declared form, purity, plating state, dimensions or particle size, route, geography, and period."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: val_route_processes
    applies_to: "process_map"
    rule: "Confirm every applicable facility process has detailed inventory and each conditional row appears only when its route condition applies."
    source_ids:
      - eu-jrc-nfm-bref-2017
      - eu-jrc-stm-bref-2006
  - rule_id: val_atomic_inventory
    applies_to: "process_inventory"
    rule: "Confirm each row is one atomic exchange, every UUID matches flow type/property/unit, and each UUID-empty row remains unresolved rather than proxied."
    source_ids: []
  - rule_id: val_metal_balance
    applies_to: "silver_gold_platinum_balances"
    rule: "Recompute silver and applicable coating-metal balances, report closure and uncertainty, and investigate unexplained differences."
    source_ids:
      - eu-jrc-nfm-bref-2017
      - eu-jrc-stm-bref-2006
  - rule_id: val_no_double_counting
    applies_to: "internal_recovery_and_upstream"
    rule: "Confirm internal returns carry no duplicate product burden and upstream electricity emissions are not direct foreground emissions."
    source_ids: []
  - rule_id: val_ranges
    applies_to: "quantitative_ranges"
    rule: "Reject externally inferred ranges unless two independent original sources have compatible boundary, unit, product state, geography, and technology; unresolved needs remain collection requirements."
