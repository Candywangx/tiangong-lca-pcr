allocation_rules:
  - rule_id: alloc_subdivide_first
    applies_to: "shared foreground operations"
    rule: "Avoid allocation by submetering or subdividing cleaning, rolling, thermal treatment, finishing, and waste handling whenever inputs and releases can be directly assigned to the declared gold-clad product."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_physical_second
    applies_to: "unavoidable multifunctionality"
    rule: "When subdivision or system expansion is not feasible, use a documented causal physical relationship relevant to the shared operation; do not default to total mass when gold-clad and other outputs cause materially different burdens."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_economic_last
    applies_to: "residual shared burdens"
    rule: "Use economic allocation only when no defensible physical relationship exists; use contemporaneous factory-gate values for all co-products, disclose price sources and averaging period, and test sensitivity because gold content can dominate value."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_scrap_status
    applies_to: "gold-clad trim and used materials"
    rule: "Classify each outgoing material as waste or co-product according to its actual control, destination, and market status. Do not assign an avoided-burden credit inside this factory-gate PCR unless an explicitly expanded system and substitution evidence are reported."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_metal_balance
      process_id: "gold_cladding_and_finishing"
      flow_role: "copper substrate, gold strip, accepted product, and gold-clad scrap"
      record_type: "weighbridge, calibrated scale, material issue, return, and acceptance records"
      raw_fields: "batch_id; material_id; alloy_or_purity; gross_mass; tare_mass; returned_mass; accepted_mass; scrap_mass; gold_layer_spec; calibration_id"
      collection_method: "Reconcile supplier receipt, batch issue/return, product acceptance, and segregated scrap records on one dry mass basis."
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "all batches in the reporting period"
      site_scope: "all included lines at the declared site"
      aggregation_rule: "Sum net input and output masses by batch, then divide reporting-period totals by net accepted product mass."
      quality_evidence: "scale calibration; material certificates; batch traveller; acceptance and scrap tickets"
    - protocol_id: cp_energy_meters
      process_id: "gold_cladding_and_finishing"
      flow_role: "alternating current, natural gas, and industrial oxygen"
      record_type: "utility meter, submeter, invoice, and production log"
      raw_fields: "meter_id; opening_reading; closing_reading; unit; reference_conditions; batch_or_period; downtime; shared_load_basis"
      collection_method: "Prefer dedicated meters; otherwise reconcile site totals and allocate only the directly attributable share using documented operating data."
      unit: "MJ for electricity; m3 for gases"
      frequency: "meter interval and each production campaign"
      temporal_coverage: "representative reporting period of at least 12 months or the full shorter campaign"
      site_scope: "all included foreground equipment"
      aggregation_rule: "Subtract non-production and excluded loads, reconcile to invoices, and normalize attributable totals by accepted product mass."
      quality_evidence: "meter calibration; invoice reconciliation; operating-hour and production logs"
    - protocol_id: cp_cleaning_records
      process_id: "gold_cladding_and_finishing"
      flow_role: "process water, sodium hydroxide, and cleaning wastewater"
      record_type: "tank batch sheet, chemical issue, water meter, concentration test, and effluent record"
      raw_fields: "bath_id; water_makeup; NaOH_solution_mass; NaOH_concentration; rinse_water; wastewater_mass; pH; dissolved_metals; destination"
      collection_method: "Record every bath make-up, replenishment, dump, and rinse; calculate pure NaOH equivalent from solution mass and measured concentration."
      unit: "kg"
      frequency: "each bath event and meter interval"
      temporal_coverage: "all cleaning events in the reporting period"
      site_scope: "all included cleaning and rinse stations"
      aggregation_rule: "Reconcile water and bath inventories, aggregate by period, and normalize by accepted product mass."
      quality_evidence: "meter calibration; concentration analysis; pH and dissolved-metal results; waste transfer or discharge record"
    - protocol_id: cp_lubricant_records
      process_id: "gold_cladding_and_finishing"
      flow_role: "fresh rolling oil and used lubricating oil"
      record_type: "stores issue, tank inventory, recovery return, and waste transfer record"
      raw_fields: "lubricant_id; formulation; opening_stock; additions; recovered_return; closing_stock; used_oil_mass; free_water; destination"
      collection_method: "Perform a lubricant stock balance and separately weigh used oil leaving the site."
      unit: "kg"
      frequency: "each addition/removal and monthly stock close"
      temporal_coverage: "all lubricant events in the reporting period"
      site_scope: "included rolling and finishing mills"
      aggregation_rule: "Fresh consumption equals opening stock plus additions minus closing stock and separately recovered return; normalize fresh and used outputs independently."
      quality_evidence: "tank calibration; purchase issue; recovery and waste transfer records"
    - protocol_id: cp_direct_emissions
      process_id: "gold_cladding_and_finishing"
      flow_role: "direct fossil carbon dioxide"
      record_type: "fuel meter, fuel composition certificate, stack measurement, or approved site mass-balance record"
      raw_fields: "fuel_volume_or_mass; reference_conditions; carbon_content; fossil_fraction; oxidation_fraction; measured_CO2; method_id"
      collection_method: "Prefer representative stack measurement; otherwise calculate from collected fuel and supplier-specific carbon data with the equation and factors retained."
      unit: "kg CO2"
      frequency: "each test campaign or reporting-period calculation"
      temporal_coverage: "representative operating modes over the reporting period"
      site_scope: "all included direct combustion units"
      aggregation_rule: "Aggregate only direct fossil CO2 from included equipment and normalize by accepted product mass."
      quality_evidence: "laboratory or analyser QA; fuel certificate; meter calibration; calculation review"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "accepted product"
      rule: "Net reference-product mass = accepted gross mass - packaging, reel, pallet, and other measured tare."
      inputs:
        - "accepted gross mass"
        - "tare mass"
      output: "out_reference_product net kg"
      source_ids: []
    - id: calc_pure_naoh
      applies_to: "sodium hydroxide input"
      rule: "Pure NaOH equivalent = solution mass × measured NaOH mass fraction; retain both raw values."
      inputs:
        - "NaOH solution mass"
        - "measured concentration"
      output: "in_sodium_hydroxide kg pure NaOH"
      source_ids: []
    - id: calc_inventory_normalization
      applies_to: "every inventory row"
      rule: "Normalized amount = reporting-period attributable amount ÷ reporting-period net conforming product mass."
      inputs:
        - "attributable row amount"
        - "net conforming product mass"
      output: "row amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_metal_balance
      applies_to: "substrate, gold, product, and metal-bearing outputs"
      rule: "Reconcile separately measured substrate-metal and gold inputs against their masses in accepted product, segregated scrap, wastewater, and any additional separately named metal-bearing output; report closure and unresolved difference without forcing balance."
      inputs:
        - "metal input masses"
        - "product composition"
        - "scrap composition"
        - "wastewater metal analyses"
        - "other named metal outputs"
      output: "substrate-metal and gold mass-balance closure"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "direct fossil carbon dioxide"
      rule: "Use representative measured CO2, or calculate fossil CO2 from collected fuel quantity, carbon content, fossil fraction, and oxidation fraction; retain the site equation and all factors."
      inputs:
        - "collected fuel"
        - "carbon content"
        - "fossil fraction"
        - "oxidation fraction or stack measurement"
      output: "out_fossil_carbon_dioxide kg"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and metal inputs"
      requirement: "Retain purchase and product specifications that identify substrate alloy, gold purity or alloy, layer location and thickness, product form, dimensions, bond route, and delivery state."
      evidence: "supplier certificate; internal specification; batch traveller; inspection report"
    - id: dq_mass_completeness
      applies_to: "metal mass balance"
      requirement: "Cover every batch in the reporting period and reconcile copper or actual substrate metal and gold separately; explain each unclosed difference and excluded metal-bearing stream."
      evidence: "calibrated scale records; material issue and return records; product and scrap composition tests"
    - id: dq_temporal_representativeness
      applies_to: "all foreground exchanges"
      requirement: "Use a continuous representative period that captures normal product mix, start-up, shutdown, maintenance, and route variation; justify any period shorter than 12 months."
      evidence: "production calendar; meter coverage; downtime and maintenance logs"
    - id: dq_technology_geography
      applies_to: "foreground site and upstream links"
      requirement: "Declare site, country or grid region, bonding technology, heat source, cleaning system, lubricant system, and waste destinations; select upstream datasets matching these facts or disclose mismatch."
      evidence: "site metadata; process flow diagram; supplier and utility records; dataset representativeness review"
    - id: dq_measurement_quality
      applies_to: "meters, scales, analyses, and calculations"
      requirement: "Retain calibration status, detection limits where relevant, sampling plans, conversion factors, estimation flags, and calculation review for each material exchange."
      evidence: "calibration certificates; laboratory QA/QC; calculation workbook or reproducible record"
    - id: dq_primary_data_priority
      applies_to: "most relevant foreground processes"
      requirement: "Use site-specific primary data for the cladding and finishing process and for major metal, energy, water, waste, and direct-emission exchanges; document any proxy and its expected influence."
      evidence: "primary-data register and data-quality assessment consistent with eu-pef-2021-2279"
validation_rules:
  - rule_id: val_identity_boundary
    applies_to: "product classification"
    rule: "Confirm the output has a base-metal or silver substrate and a gold covering affixed by a qualifying mechanical or metallurgical cladding means, remains semi-manufactured, and is not merely plated or coated."
    source_ids:
      - un-cpc-3-0-2025
      - eu-cn-2020-1577-ch71
  - rule_id: val_reference_flow
    applies_to: "quantitative reference"
    rule: "Confirm the reference amount is exactly 1 kg net conforming product and every required qualifier is populated."
    source_ids: []
  - rule_id: val_atomic_inventory
    applies_to: "inventory structure"
    rule: "Confirm every selected flow is one atomic product, waste, or elementary exchange; reject collection labels, combined utilities, combined wastes, and unnamed route alternatives."
    source_ids: []
  - rule_id: val_uuid_identity
    applies_to: "Tiangong references"
    rule: "Confirm every populated UUID resolves at public state code 100 with matching English and Chinese names, flow type, classification, property, and unit group; keep unresolved rows empty and documented."
    source_ids: []
  - rule_id: val_mass_balance
    applies_to: "copper or actual substrate metal and gold"
    rule: "Check separate substrate-metal and gold closures using inputs, accepted product composition, segregated scrap, wastewater analyses, and every additional named metal-bearing output; investigate rather than erase differences."
    source_ids: []
  - rule_id: val_energy_emissions
    applies_to: "energy and direct emissions"
    rule: "Reconcile electricity, fuel, and oxygen records to included equipment and reporting period; ensure direct fossil CO2 excludes upstream electricity and fuel-supply emissions."
    source_ids: []
  - rule_id: val_allocation
    applies_to: "multifunctional operations"
    rule: "Confirm subdivision was attempted first and every residual physical or economic allocation basis, dataset, period, and sensitivity is disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_bilingual_alignment
    applies_to: "bilingual PCR use"
    rule: "Confirm English and Chinese files contain the same process ids, row ids, controlled values, rule ids, UUIDs, and source ids."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for factory-gate semi-manufactured gold-clad base metal or silver"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product-level or component-level LCA in which the declared substrate, gold layer, product form, route, site, geography, reporting period, and factory-gate boundary are representative"
  excluded_use: "Gold electroplating or other non-clad coatings; solid gold products; finished jewellery or components without added downstream processes; undisclosed substrate or gold layer; attribution to a different route or geography without representativeness review"
  required_metadata: "canonical PCR id; product UUID; substrate and gold specifications; product form and dimensions; bonding and heat-treatment route; site and geography; reporting period; reference flow; upstream dataset choices; allocation method; recycled content; waste destinations"
  required_quality_disclosure: "primary-data coverage; meter and scale calibration; gold and substrate-metal balance closure; data gaps and proxies; temporal, technological, and geographic representativeness; uncertainty and allocation sensitivity"
  update_trigger: "Change in substrate or gold specification, cladding or heat-treatment technology, product form, site, energy system, cleaning or lubricant system, waste route, allocation basis, upstream dataset representativeness, or a material shift in measured inventory"
