functional_unit:
  what: "Production and delivery of a semi-manufactured base-metal or silver product with a mechanically or metallurgically affixed gold layer"
  how_much: "1 kg net mass of conforming product at the factory gate"
  how_well: "Conforms to the declared substrate specification, gold purity or alloy, gold-layer location and thickness, dimensions, bond-integrity criterion, surface finish, and acceptance test"
  how_long_or_cycle: "One production batch delivered at the factory gate; no service life is assigned because the product is an intermediate material"
