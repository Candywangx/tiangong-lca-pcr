system_boundary:
  rules:
    - rule_id: sb_foreground_gate
      applies_to: "foreground system boundary"
      rule: "Include all on-site operations from receipt of substrate metal and gold cladding stock through surface preparation, cladding or roll bonding, thermal treatment when used, finish rolling, surface finishing, slitting, inspection, internal handling, and release of the semi-manufactured product at the factory gate."
      source_ids:
        - nist-clad-metals-1983
    - rule_id: sb_cladding_identity
      applies_to: "product identity"
      rule: "Include only products whose gold covering is affixed by soldering, brazing, welding, hot rolling, or similar mechanical means, including qualifying inlay; exclude plated or coated products that do not meet this definition."
      source_ids:
        - eu-cn-2020-1577-ch71
    - rule_id: sb_upstream_inputs
      applies_to: "purchased inputs"
      rule: "Link representative upstream datasets for every purchased metal, chemical, fuel, electricity, oxygen, water, and lubricant crossing the foreground boundary; do not include those upstream emissions again as direct foreground elementary flows."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_direct_releases
      applies_to: "direct site outputs"
      rule: "Record each direct waste and elementary release separately at the point it leaves the foreground process; do not combine scrap, used oil, wastewater, or air emissions into umbrella rows."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_downstream_exclusion
      applies_to: "downstream life cycle"
      rule: "Exclude downstream conversion into jewellery or components, product use, maintenance, and end-of-life unless the study explicitly expands the boundary and reports those stages separately."
      source_ids:
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "Purchased copper strip and gold strip are the representative starting materials; the actual substrate metal, alloy, surface condition, dimensions, gold purity, gold form, recycled content, supplier geography, and delivery state must be declared."
  starting_condition_role: "Defines the first foreground transformation and prevents upstream mining, refining, alloying, or strip production from being silently treated as on-site cladding operations."
  product_classification_scope: "Base metals or silver clad with gold, not further worked than semi-manufactured; CPC 3.0 code 41340 is mapping context rather than canonical PCR identity."
  recursive_input_rule: "If an input is already a product within this same gold-clad category, record it once as a separately identified purchased product input with its own upstream dataset and declared starting condition; do not recursively recreate its cladding inventory inside the foreground process."
  upstream_dataset_requirement: "Every purchased input requires a geographically, technologically, temporally, and materially representative upstream dataset or an explicit documented data gap."
  disclosure: "Disclose substrate and gold specifications, bonding route, heat source, cleaning and lubricant systems, production and waste-treatment geography, reporting period, allocation choices, data gaps, and any operations performed off site."
