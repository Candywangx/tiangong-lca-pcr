allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "all foreground operations"
    rule: "Avoid allocation by separately metering routes, production lines, grade campaigns, recovery operations, and saleable outputs wherever records permit."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_internal_recirculation
    applies_to: "internal scrap, scale, process gas, electricity, steam, and water"
    rule: "Treat internal recirculation as an internal transfer: retain its recovery burdens once, do not add a purchased upstream dataset, and reconcile both sides of the transfer."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_co_products
    applies_to: "slags, recovered dusts, exported process gas, electricity, steam, or other saleable co-products"
    rule: "Prefer system expansion only when the displaced function and substitution ratio are documented and compatible with the study goal. If system expansion is not defensible, apply a declared physical or economic partition and report a sensitivity check; never silently treat a saleable co-product as burden-free waste."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_scrap_boundary
    applies_to: "purchased and generated steel scrap"
    rule: "Distinguish internal scrap, pre-consumer scrap, and post-consumer scrap. State the recycling method and report any end-of-life credit separately from the cradle-to-gate inventory."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_bf_materials_products
      process_id: "bf_bof_alloy_steelmaking_casting"
      flow_role: "charged materials and cast slab"
      record_type: "scales, batch records, stock ledger, grade certificate"
      raw_fields: "timestamp; batch or heat id; material id; supplier; grade; composition; wet mass; dry mass; moisture; cast slab mass; eligible product link"
      collection_method: "reconcile calibrated scales and stock movements to heat and campaign records"
      unit: "kg"
      frequency: "each receipt, charge, heat, and cast"
      temporal_coverage: "at least one representative 12-month period"
      site_scope: "all included BF, BOF, secondary-metallurgy, and casting units"
      aggregation_rule: "sum eligible inputs and outputs, apply documented inventory change, and allocate only after subdivision"
      quality_evidence: "calibration certificates; weighbridge tickets; heat sheets; stock reconciliation; grade certificates"
    - protocol_id: cp_bf_energy_utilities
      process_id: "bf_bof_alloy_steelmaking_casting"
      flow_role: "oxygen, electricity, and make-up water"
      record_type: "utility meters and invoices"
      raw_fields: "timestamp; meter id; opening and closing reading; unit; oxygen purity; gas temperature and pressure; electricity voltage and provider; water source; eligible output"
      collection_method: "reconcile submeter totals with site invoices and internal generation records"
      unit: "m3; MJ"
      frequency: "continuous or shift meter, reconciled monthly"
      temporal_coverage: "same 12-month period as product output"
      site_scope: "all included route units and shared services"
      aggregation_rule: "subtract verified internal transfers, assign shared services by causal meter or documented driver, normalize to cast slab output"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet; outage log"
    - protocol_id: cp_bf_residues_emissions
      process_id: "bf_bof_alloy_steelmaking_casting"
      flow_role: "slags, dusts, and direct fossil CO2"
      record_type: "residue scales, manifests, stack monitoring, fuel and carbon balance"
      raw_fields: "timestamp; source unit; residue mass; moisture; destination; waste or co-product status; stack flow and concentration; fuel carbon; carbonate carbon; process-gas transfers"
      collection_method: "weigh residues and use validated continuous monitoring or reconciled carbon balance for CO2"
      unit: "kg"
      frequency: "each shipment plus continuous or campaign emissions"
      temporal_coverage: "same 12-month period as product output"
      site_scope: "all included emission points and residue treatment units"
      aggregation_rule: "sum direct releases and outgoing residues, correct to declared state, avoid double counting transferred process gas"
      quality_evidence: "scale records; laboratory analyses; waste manifests; monitor QA/QC; carbon-balance closure"
    - protocol_id: cp_eaf_materials_products
      process_id: "eaf_alloy_steelmaking_casting"
      flow_role: "metallics, fluxes, electrodes, alloy additions, and cast slab"
      record_type: "scales, charge sheets, stock ledger, heat records, grade certificate"
      raw_fields: "timestamp; heat id; material id; supplier; scrap class; composition; charge mass; electrode stock; cast slab mass; eligible product link"
      collection_method: "reconcile charge sheets, calibrated scales, and inventory changes to accepted slabs"
      unit: "kg"
      frequency: "each receipt, charge, heat, and cast"
      temporal_coverage: "at least one representative 12-month period"
      site_scope: "EAF, included secondary refining, and casting"
      aggregation_rule: "sum eligible heat records and apply documented stock change; keep each alloy addition separate"
      quality_evidence: "calibration certificates; charge sheets; heat chemistry; stock reconciliation; grade certificates"
    - protocol_id: cp_eaf_energy_utilities
      process_id: "eaf_alloy_steelmaking_casting"
      flow_role: "argon, oxygen, natural gas, electricity, and make-up water"
      record_type: "utility meters and invoices"
      raw_fields: "timestamp; heat id where available; meter id; readings; unit; gas purity; temperature and pressure; electricity voltage and provider; water source"
      collection_method: "reconcile submeters with invoices and heat logs"
      unit: "m3; MJ"
      frequency: "continuous or per heat, reconciled monthly"
      temporal_coverage: "same 12-month period as product output"
      site_scope: "EAF, AOD or VOD when used, ladle metallurgy, casting, and shared services"
      aggregation_rule: "assign by direct heat meter or documented causal driver, net verified internal generation, normalize to accepted slab"
      quality_evidence: "calibration certificates; invoice reconciliation; heat utility logs; outage log"
    - protocol_id: cp_eaf_residues_emissions
      process_id: "eaf_alloy_steelmaking_casting"
      flow_role: "EAF slag, EAF dust, and direct fossil CO2"
      record_type: "residue scales, manifests, stack monitoring, fuel, electrode, charge-carbon, and off-gas records"
      raw_fields: "timestamp; heat id; residue mass; moisture; zinc content; destination; waste or co-product status; stack flow and concentration; carbon inputs and outputs"
      collection_method: "weigh residues and use validated monitoring or reconciled carbon balance"
      unit: "kg"
      frequency: "each shipment plus continuous or heat-based emissions"
      temporal_coverage: "same 12-month period as product output"
      site_scope: "EAF, included secondary refining, casting, gas cleaning, and residue handling"
      aggregation_rule: "sum eligible releases and residues, correct to declared state, prevent overlap between off-gas monitoring and carbon balance"
      quality_evidence: "scale records; laboratory analyses; manifests; monitor QA/QC; carbon-balance closure"
    - protocol_id: cp_rolling_materials_products
      process_id: "hot_rolling_narrow_flat_product"
      flow_role: "slab input and net saleable reference product"
      record_type: "slab scales, production order, dimensional inspection, grade certificate, product scale"
      raw_fields: "timestamp; campaign id; slab id; route; grade; slab mass; width; thickness; output form; accepted product mass; reject mass"
      collection_method: "link each eligible product campaign to slab lots and calibrated product scales"
      unit: "kg"
      frequency: "each slab and finished coil, sheet, strip, or cut length"
      temporal_coverage: "same representative 12-month period as route data"
      site_scope: "all included hot-rolling and finishing operations"
      aggregation_rule: "sum only qualifying less-than-600-mm uncoated product; reconcile slab, product, scale, scrap, and rejects"
      quality_evidence: "scale calibration; production genealogy; inspection results; grade certificate; mass balance"
    - protocol_id: cp_rolling_energy_utilities
      process_id: "hot_rolling_narrow_flat_product"
      flow_role: "natural gas, electricity, and make-up water"
      record_type: "furnace and line submeters, invoices"
      raw_fields: "timestamp; campaign id; meter id; readings; unit; fuel composition; gas reference conditions; voltage and provider; water source"
      collection_method: "reconcile line meters with invoices and production time"
      unit: "m3; MJ"
      frequency: "continuous or shift meter, reconciled monthly"
      temporal_coverage: "same period as qualifying product output"
      site_scope: "reheating, descaling, rolling, cooling, coiling or cutting, and included finishing"
      aggregation_rule: "assign campaign use by direct meter or documented operating-time driver; exclude internal recirculation"
      quality_evidence: "calibration certificates; invoice reconciliation; campaign log; outage log"
    - protocol_id: cp_rolling_residues_emissions
      process_id: "hot_rolling_narrow_flat_product"
      flow_role: "mill scale, rolling scrap, and direct fossil CO2"
      record_type: "residue scales, scrap ledger, stack monitoring, fuel carbon balance"
      raw_fields: "timestamp; campaign id; residue or scrap mass; moisture; oil content; destination; stack flow and concentration; fuel carbon"
      collection_method: "weigh outputs and use validated monitoring or fuel-carbon calculation"
      unit: "kg"
      frequency: "each collection or shipment plus continuous or campaign emissions"
      temporal_coverage: "same period as qualifying product output"
      site_scope: "reheating furnaces, descaling, rolling, scale treatment, and scrap handling"
      aggregation_rule: "attribute by production genealogy or documented campaign driver and reconcile with slab-to-product mass balance"
      quality_evidence: "scale records; laboratory analyses; transfer records; monitor QA/QC; carbon-balance closure"
  calculation_rules:
    - id: calc_normalize_exchange
      applies_to: "every inventory row"
      rule: "normalized exchange = eligible reporting-period exchange × product attribution share ÷ eligible net output × 1,000 kg"
      inputs:
        - "exchange record"
        - "attribution share"
        - "eligible net output"
      output: "amount per 1,000 kg process output or reference product"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_route_mix
      applies_to: "products made from more than one steelmaking route"
      rule: "route-mix amount = sum of route-specific normalized amounts × measured route output fractions; fractions shall sum to one and shall not be estimated from a national average when plant records exist"
      inputs:
        - "route-specific inventories"
        - "measured eligible slab mass by route"
      output: "measured route-mix inventory"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_mass_balance
      applies_to: "steelmaking, casting, and hot rolling"
      rule: "reconcile iron-bearing and total mass inputs with product, internal transfers, slags, dusts, scale, scrap, other residues, and measured releases; investigate material unexplained imbalance before publication"
      inputs:
        - "material records"
        - "product records"
        - "internal transfers"
        - residues
        - releases
      output: "documented mass-balance closure"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_fossil_co2
      applies_to: "direct fossil CO2 rows"
      rule: "use validated stack monitoring where complete; otherwise calculate from reconciled fossil carbon inputs and carbon-bearing outputs, and document oxidation and carbonate assumptions without overlapping monitored emissions"
      inputs:
        - "stack records"
        - fuel
        - reductant
        - electrode
        - "charge-carbon and carbonate records"
        - "exported process gas"
        - "carbon in products and residues"
      output: "direct fossil CO2 mass"
      source_ids:
        - worldsteel-lci-methodology-2017
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Demonstrate alloy grade, exclusion of silicon-electrical and high-speed steel, finished width below 600 mm, and absence of further working beyond hot rolling."
      evidence: "grade certificate; dimensional inspection; route and finishing genealogy"
    - id: dq_representativeness
      applies_to: "all data"
      requirement: "Use a representative contiguous 12-month period where practicable; explain shutdowns, abnormal operations, campaign gaps, and substitutions."
      evidence: "reporting-period register; production log; exception record"
    - id: dq_geography_technology
      applies_to: "upstream datasets"
      requirement: "Match supplier geography, electricity system, scrap preparation, material state, and production technology; document any proxy."
      evidence: "supplier data; dataset metadata; proxy assessment"
    - id: dq_metering
      applies_to: "foreground quantities"
      requirement: "Use calibrated meters and scales, reconcile submeter totals to invoices or site totals, and retain raw records and transformations."
      evidence: "calibration record; reconciliation workbook; immutable source extract"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Apply the cut-off rule only after mass, energy, and environmental relevance screening; include all energy and legally monitored releases."
      evidence: "completeness matrix; cut-off register; permit-monitoring cross-check"
    - id: dq_route_consistency
      applies_to: "route and rolling linkage"
      requirement: "Ensure the slab grade, output mass, and route in steelmaking records match rolling input and finished-product genealogy."
      evidence: "heat-to-slab-to-coil genealogy; mass-balance report"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference flow"
    rule: "Fail validation if the declared product is 600 mm or wider, non-alloy, silicon-electrical, high-speed, cold-rolled, coated, pickled, or otherwise further worked, or if grade and dimensions are missing."
    source_ids:
      - un-cpc-3-0-structure-2025
      - china-mof-alloy-steel-terminology-2024
  - rule_id: validation_route
    applies_to: "process map"
    rule: "Require hot rolling and exactly one BF-BOF route, one EAF route, or a measured route mix. Require grade-appropriate secondary-refining and casting disclosure."
    source_ids:
      - eu-jrc-iron-steel-bref-2013
      - eu-jrc-ferrous-metals-processing-bref-2022
      - worldstainless-general-introduction-lci
  - rule_id: validation_units
    applies_to: "inventory amounts"
    rule: "Require 1,000 kg normalization, gas reference conditions, electricity supply metadata, and explicit conversions from raw meter units."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_balance
    applies_to: "material and carbon balances"
    rule: "Require documented iron or steel mass, total mass, and fossil-carbon checks; unresolved material imbalance or double-counted process gas is an error."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_completeness
    applies_to: "cut-off and exchanges"
    rule: "Require every energetic input, each included material, each residue, and each elementary release to be recorded as an atomic exchange; require documented cut-off screening and permit cross-check."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_allocation
    applies_to: "co-products and scrap"
    rule: "Require internal-transfer reconciliation, scrap-category disclosure, co-product status, allocation or substitution method, and a separate end-of-life scenario when used."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_uuid_accounting
    applies_to: "TianGong references"
    rule: "Require every inventory row to carry a directly verified public TianGong UUID or appear with the same row id and allowed reason code in manifest unresolved metadata; reject unverified proxy UUIDs."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset and background_dataset after methodology review and publication"
  downstream_use: "Cradle-to-gate modelling of products that consume a declared hot-rolled narrow alloy-steel flat product; route-specific process or lifecyclemodel projections"
  allowed_use: "Use when grade family, width, surface state, geography, technology, temporal coverage, scrap boundary, and allocation method are compatible with the foreground product system."
  excluded_use: "Do not use as a generic proxy for non-alloy steel, silicon-electrical steel, high-speed steel, products 600 mm or wider, cold-rolled or coated products, or a stainless or high-alloy grade represented only by low-alloy data."
  required_metadata: "PCR id and version; product grade and standard; composition or grade family; width, thickness, and form; factory-gate state; BF-BOF or EAF route and secondary refining; plant geography; reporting period; upstream dataset identities; electricity and fuel supply; scrap categories; cut-offs; allocation; UUID gaps; uncertainty and data-quality statement"
  required_quality_disclosure: "Primary-data share; meter and scale reconciliation; mass and carbon balance closure; route coverage; supplier and geographic proxies; abnormal-operation treatment; excluded flows; co-product and recycling sensitivity; unresolved range and UUID evidence needs"
  update_trigger: "Change in alloy grade family, steelmaking or secondary-refining route, casting or rolling technology, reheating fuel, electricity supply, scrap mix, product width or surface state, allocation method, plant geography, or a material change in inventory or data quality"
