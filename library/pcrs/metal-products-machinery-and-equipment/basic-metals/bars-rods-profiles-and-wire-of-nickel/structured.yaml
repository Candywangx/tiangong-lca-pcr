allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared processes and meters"
    rule: "Prefer process subdivision, campaign records, sub-metering, or another demonstrated causal relation before applying allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_internal_scrap
    applies_to: "internal nickel scrap loops"
    rule: "Keep internally returned scrap inside the foreground system and retain the energy, material loss, and treatment burdens that generated and reprocessed it; do not report an internal loop as an external co-product."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_external_scrap
    applies_to: "nickel scrap leaving the foreground system"
    rule: "Report separately weighed external nickel scrap as an output and disclose its composition, destination, and any recycling-credit method; do not apply avoided-primary-nickel credit automatically."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residual
    applies_to: "inseparable shared burdens"
    rule: "If subdivision and physical causality are not feasible, apply one declared mass, energy, time, or economic allocation basis consistently and disclose the rationale, denominator, affected rows, and sensitivity."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_feed_material_records
      process_id: "feed_preparation"
      flow_role: "metal feed and preparation scrap"
      record_type: "weighbridge, scale, receiving, issue, and scrap-transfer records"
      raw_fields: "lot id; supplier; material form; alloy or grade; composition evidence; gross, tare, and net mass; moisture or contamination; disposition"
      collection_method: "reconcile calibrated scale records with material ledger and campaign assignment"
      unit: "kg"
      frequency: "each receipt, issue, and transfer"
      temporal_coverage: "complete represented campaigns within reporting period"
      site_scope: "all feed-preparation areas serving the declared product"
      aggregation_rule: "sum net product-attributed input and external scrap; keep internal returns as separate loop records"
      quality_evidence: "calibration certificates; supplier certificates; lot traceability; reconciliation sign-off"
    - protocol_id: cp_forming_energy_records
      process_id: "mechanical_forming"
      flow_role: "electricity, natural gas, and direct combustion carbon"
      record_type: "electricity meter; gas meter; furnace log; fuel specification"
      raw_fields: "meter ids and readings; timestamps; product campaign; reference conditions; fuel carbon or verified supplier composition; allocation driver"
      collection_method: "use sub-metered readings where available and reconcile shared loads to production logs"
      unit: "MJ; m3; kg CO2"
      frequency: "each shift or batch with monthly reconciliation"
      temporal_coverage: "complete represented campaigns within reporting period"
      site_scope: "forming lines and attributable auxiliaries"
      aggregation_rule: "subtract validated baseline only when method is documented; allocate remaining shared load using one disclosed causal driver"
      quality_evidence: "meter calibration; invoices; furnace logs; allocation worksheet"
    - protocol_id: cp_forming_scrap_records
      process_id: "mechanical_forming"
      flow_role: "recyclable forming scrap"
      record_type: "scrap-bin scale and transfer records"
      raw_fields: "campaign; product grade; scrap type; gross, tare, and net mass; contamination; internal or external destination"
      collection_method: "weigh each segregated batch and reconcile to material balance"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "complete represented campaigns within reporting period"
      site_scope: "forming lines serving the declared product"
      aggregation_rule: "sum net external scrap; retain internal-return quantities separately"
      quality_evidence: "scale calibration; transfer ticket; grade-segregation check"
    - protocol_id: cp_heat_energy_records
      process_id: "heat_treatment"
      flow_role: "electricity, natural gas, and direct combustion carbon"
      record_type: "energy meters; furnace cycle logs; fuel specification"
      raw_fields: "cycle id; furnace id; load mass; electricity; gas; reference conditions; fuel carbon or verified composition; timestamps; product assignment"
      collection_method: "link energy readings and fuel-carbon calculation to each declared thermal cycle"
      unit: "MJ; m3; kg CO2"
      frequency: "each cycle with monthly reconciliation"
      temporal_coverage: "complete represented heat-treatment cycles"
      site_scope: "furnaces and attributable auxiliaries serving the declared product"
      aggregation_rule: "aggregate product-attributed cycles and document shared-furnace allocation"
      quality_evidence: "calibration; cycle log; invoice reconciliation; calculation worksheet"
    - protocol_id: cp_surface_treatment_records
      process_id: "surface_finishing"
      flow_role: "water, sodium hydroxide, electricity, and nickel-containing wastewater"
      record_type: "meters; bath make-up and replenishment logs; chemical certificates; wastewater tank and laboratory records"
      raw_fields: "operation id; water and wastewater readings; electricity; reagent quantity and concentration; nickel concentration; recycled volume; treatment destination"
      collection_method: "reconcile meter and batch records; calculate dry reagent mass from verified concentration"
