allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared operations and treatment systems"
    rule: "Subdivide or meter product lines and stages before allocation whenever records permit."
    source_ids: []
  - rule_id: allocation_internal_copper
    applies_to: "internally returned copper-bearing material"
    rule: "Treat internal recirculation as an internal loop: record its mass for balance and quality control, but assign neither a new upstream burden nor an external co-product credit."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_external_outputs
    applies_to: "externally transferred co-products and wastes"
    rule: "Where subdivision is infeasible, apply declared physical allocation when a causal physical relation exists; otherwise use justified economic allocation. Do not apply avoided-burden credit unless a separate consequential study is declared."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_copper_feed
      process_id: "integrated_manufacture"
      flow_role: "cathode copper feed"
      record_type: "weighbridge, invoice and charge record"
      raw_fields: "identity; supplier; grade; recycled-content claim; gross mass; returns; charge mass"
      collection_method: "reconcile receipts to charge records"
      unit: "kg"
      frequency: "each delivery and charge"
      temporal_coverage: "complete reporting period"
      site_scope: "all product-serving lines"
      aggregation_rule: "sum external charged mass by specific feed identity"
      quality_evidence: "calibrated scales, invoices, stock reconciliation and supplier specification"
    - protocol_id: cp_electricity
      process_id: "integrated_manufacture"
      flow_role: "electricity input"
      record_type: "meter and production log"
      raw_fields: "meter id; readings; generated electricity; exports; allocation driver; downtime"
      collection_method: "read submeters or reconcile facility meter to equipment"
      unit: "MJ"
      frequency: "at least monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all included operations"
      aggregation_rule: "net imports plus attributable generation less exports, after subdivision"
      quality_evidence: "meter calibration, bills and meter map"
    - protocol_id: cp_natural_gas
      process_id: "integrated_manufacture"
      flow_role: "natural-gas input"
      record_type: "fuel meter and invoice"
      raw_fields: "volume; temperature; pressure; reference condition; heating value; equipment; hours"
      collection_method: "reconcile meters and invoices to operating logs"
      unit: "m3"
      frequency: "at least monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all included gas-fired equipment"
      aggregation_rule: "sum attributable gas at one documented reference condition"
      quality_evidence: "calibration, invoice reconciliation and fuel specification"
    - protocol_id: cp_industrial_oxygen
      process_id: "integrated_manufacture"
      flow_role: "industrial-oxygen input"
      record_type: "flow meter or delivery record"
      raw_fields: "source; purity; pressure; reference condition; volume; operation"
      collection_method: "reconcile delivery or generation meter with route logs"
      unit: "m3"
      frequency: "each delivery or campaign"
      temporal_coverage: "applicable campaigns"
      site_scope: "oxygen-using operations"
      aggregation_rule: "sum attributable supplied volume at one reference condition"
      quality_evidence: "delivery tickets, meter checks and route logs"
    - protocol_id: cp_process_water
      process_id: "integrated_manufacture"
      flow_role: "process-water intake"
      record_type: "water meter and balance"
      raw_fields: "source; intake; makeup; recirculation; blowdown; discharge"
      collection_method: "meter external intake and construct a water balance"
      unit: "kg"
      frequency: "at least monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all included water systems"
      aggregation_rule: "sum external intake once; report recirculation separately"
      quality_evidence: "calibrated meters and water-balance reconciliation"
    - protocol_id: cp_sodium_hydroxide
      process_id: "integrated_manufacture"
      flow_role: "sodium-hydroxide solution"
      record_type: "delivery and dosing record"
      raw_fields: "solution mass; concentration; batch; dosing point; treated-water volume"
      collection_method: "reconcile inventory with dosing logs"
      unit: "kg solution"
      frequency: "each delivery and batch"
      temporal_coverage: "applicable campaigns"
      site_scope: "on-site treatment"
      aggregation_rule: "sum attributable solution mass and retain concentration"
      quality_evidence: "analysis certificates, stock reconciliation and dosing calibration"
    - protocol_id: cp_product_output
      process_id: "integrated_manufacture"
      flow_role: "conforming product output"
      record_type: "certified scale and release record"
      raw_fields: "form; alloy; temper; dimensions; surface; gross output; offcuts; rejects; net mass"
      collection_method: "reconcile line output to release records"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete reporting period"
      site_scope: "all covered products"
      aggregation_rule: "sum released conforming mass by specification"
      quality_evidence: "scale calibration, release certificate and mass balance"
    - protocol_id: cp_direct_co2
      process_id: "integrated_manufacture"
      flow_role: "direct fossil carbon dioxide"
