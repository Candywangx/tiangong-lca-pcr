    rule: "Confirm that the starting condition and actual integrated process sequence match included meters, records and upstream links."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_no_double_count
    applies_to: "copper and utilities"
    rule: "Confirm internal copper recirculation is not a new external input and upstream product burdens are not repeated as direct foreground emissions."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "waste and elementary outputs"
    rule: "Require each actual dross, dust, refractory, sludge, spent solution, offcut, reject, wastewater discharge and direct air emission to be a specific atomic exchange or demonstrated absent."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: validate_ranges
    applies_to: "important flows"
    rule: "Treat absent external benchmark ranges as evidence gaps; retain foreground measurement and review unresolved range-evidence needs before publication."
