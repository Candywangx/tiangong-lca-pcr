      site_scope: "all included direct fossil sources"
      aggregation_rule: "sum direct foreground fossil CO2 only"
      quality_evidence: "monitoring QA or traceable carbon calculation and fuel records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory exchange"
      rule: "normalized amount = attributable reporting-period exchange / reporting-period net conforming product mass"
      inputs:
        - "exchange record"
        - "cp_product_output net mass"
      output: "exchange per 1 kg reference product"
      source_ids: []
    - id: calc_copper_mass_balance
      applies_to: "copper-bearing feed, product, internal returns and external losses"
      rule: "Reconcile external copper-bearing inputs with conforming product, work-in-progress change, internal-loop inventory change and each specific external copper-bearing output; investigate unexplained loss."
      inputs:
        - cp_copper_feed
        - cp_product_output
        - "site mass-balance ledger"
      output: "documented copper mass-balance closure"
      source_ids:
        - eu-jrc-nfm-bref-2017
    - id: calc_solution_active_mass
      applies_to: "sodium-hydroxide solution"
      rule: "active NaOH mass = delivered solution mass × measured mass fraction; retain both values"
      inputs:
        - "cp_sodium_hydroxide mass and concentration"
      output: "kg active NaOH and kg delivered solution"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Report form, copper or alloy designation, composition, temper, dimensions, surface condition and route for each aggregated product group."
      evidence: "specification, analysis certificate and release record"
    - id: dq_process_coverage
      applies_to: "foreground system"
      requirement: "Document the actual sequence and demonstrate that all product-serving melting, casting, forming, heat-treatment, cleaning, extraction and treatment operations are included or justified as excluded."
      evidence: "flow diagram, equipment list and meter map"
    - id: dq_atomic_outputs
      applies_to: "waste and elementary exchanges"
      requirement: "Add each actual external waste and direct elementary emission as a separate specific flow; a collective label is not an acceptable dataset exchange."
      evidence: "manifests, treatment records, permits and monitoring reports"
    - id: dq_temporal_representativeness
      applies_to: "all records"
      requirement: "Cover a representative reporting period and material campaigns for the declared product mix; explain shutdowns, trials and abnormal campaigns."
      evidence: "dated production, meter, maintenance and quality records"
    - id: dq_reconciliation
      applies_to: "material, water and energy"
      requirement: "Reconcile supplier records, meters, inventories and product output; document allocation where shared meters remain."
      evidence: "signed reconciliation, calibration records and retained source documents"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
