allocation_rules:
  - rule_id: al_subdivide_first
    applies_to: "independently measured preparation lines and grades"
    rule: "Avoid allocation by subdividing receiving, preparation, and dispatch operations whenever meters, batch records, or operating logs distinguish the declared metal or alloy grade and route."
    source_ids: []
  - rule_id: al_shared_operations
    applies_to: "electricity and shared handling"
    rule: "Allocate only genuinely shared operations using a causal submeter, operating-time, equipment-throughput, or handled-net-mass basis, in that preference order; report the driver and affected exchanges."
    source_ids: []
  - rule_id: al_multiple_saleable_grades
    applies_to: "multiple saleable scrap outputs"
    rule: "Keep separately weighed saleable grades as separate product outputs. If subdivision is impossible, allocate shared burdens by dry saleable mass and report a sensitivity case using economic value when price differences could change interpretation."
    source_ids: []
  - rule_id: al_incoming_scrap_burden
    applies_to: "incoming waste and scrap"
    rule: "State the study's treatment of burdens before facility acceptance. Do not silently assign zero upstream burden, avoided primary-metal credit, or end-of-life recycling credit; apply such conventions only in the downstream study and disclose them separately from this foreground inventory."
    source_ids: []
  - rule_id: al_residue_no_credit
    applies_to: "nonmetallic residue and metal-bearing fines"
    rule: "Model each outgoing stream and its receiving treatment or recovery dataset explicitly. Do not credit recovery before the receiving process and allocation convention are identified."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_sorting
      process_id: "receiving_sorting"
      flow_role: "accepted input, electricity, and sorted transfer"
      record_type: "scale tickets, acceptance record, composition or grade test, inventory log, electricity meter"
      raw_fields: "lot id; supplier and origin; gross mass; tare mass; moisture basis; predominant metal or alloy; composition result; physical form; foreign material; hazardous-component status; acceptance decision; opening and closing inventory; meter start and end"
      collection_method: "Calibrated weighing plus documented sampling, analysis, inspection, lot tracking, and submeter or defensible meter allocation"
      unit: "kg; mass fraction; kWh or MJ"
      frequency: "Every accepted lot and meter interval"
      temporal_coverage: "At least one representative continuous 12-month period or the full campaign when shorter"
      site_scope: "All receiving and sorting operations supplying the declared product"
      aggregation_rule: "Sum accepted and transferred net masses by homogeneous declared grade and route; reconcile inventory change; sum attributable electricity and normalize after final output is known"
      quality_evidence: "Scale and meter calibration; sampling plan; analytical method; acceptance checklist; lot ledger; inventory reconciliation"
    - protocol_id: cp_mechanical_preparation
      process_id: "mechanical_preparation"
      flow_role: "interstage input, electricity, water, prepared output, residue, and fines"
      record_type: "batch transfer ticket, equipment meter, water meter, residue scale ticket, inventory log"
      raw_fields: "batch id; route and equipment; input mass; output mass; residue mass; fines mass; opening and closing inventory; meter readings; water readings; recirculation state; destination"
      collection_method: "Weigh every material transfer; meter electricity and boundary-crossing make-up water for the included campaign"
      unit: "kg; kWh or MJ"
      frequency: "Every preparation batch and meter interval"
      temporal_coverage: "Same period as the represented dispatch lots"
      site_scope: "All included non-thermal mechanical preparation equipment"
      aggregation_rule: "Reconcile input, outputs, residues, and inventory change by route; sum energy and make-up water; do not combine technologies before checking representativeness"
      quality_evidence: "Scale and meter calibration; route log; maintenance and downtime log; residue destination record; signed mass-balance review"
    - protocol_id: cp_grading_dispatch
      process_id: "grading_dispatch"
      flow_role: "prepared input, dispatch electricity, and reference output"
      record_type: "transfer ticket, final grade certificate, dispatch scale ticket, electricity meter, loading log"
      raw_fields: "dispatch lot id; linked input batches; predominant metal or alloy; composition and grade; gross mass; tare mass; net mass; moisture and foreign-material basis; physical and delivery form; meter readings; customer specification; dispatch date"
      collection_method: "Calibrated final weighing, documented sampling or inspection, lot linkage, and submeter or defensible meter allocation"
      unit: "kg; mass fraction; kWh or MJ"
      frequency: "Every dispatch lot and meter interval"
      temporal_coverage: "At least one representative continuous 12-month period or the full campaign when shorter"
      site_scope: "All final grading, consolidation, and loading operations for the declared product"
      aggregation_rule: "Aggregate only homogeneous lots meeting the same declared product boundary; normalize all linked exchanges by net saleable output mass"
      quality_evidence: "Scale and meter calibration; grade certificate; chain of custody; customer or facility specification; batch-to-dispatch reconciliation"
  calculation_rules:
    - id: cr_net_mass
      applies_to: "every weighed lot or stream"
      rule: "net mass = gross mass - tare mass; apply a moisture or foreign-material correction only when the declared commercial basis requires it and retain both original and corrected values"
      inputs:
        - "gross mass"
        - "tare mass"
        - "declared basis"
        - "moisture and foreign-material results"
      output: "kg net mass on the declared basis"
      source_ids: []
    - id: cr_stage_mass_balance
      applies_to: "receiving_sorting and mechanical_preparation"
      rule: "input + opening inventory = product transfers + nonmetallic residue + metal-bearing fines + other specifically identified outputs + closing inventory; investigate rather than allocate an unexplained imbalance"
      inputs:
        - "measured input"
        - outputs
        - "and inventory change"
      output: "reconciled batch mass balance and unexplained difference"
      source_ids: []
    - id: cr_electricity_conversion
      applies_to: "all electricity inputs"
      rule: "electricity_MJ = electricity_kWh × 3.6"
      inputs:
        - "attributable metered kWh"
      output: "MJ electricity"
      source_ids: []
    - id: cr_water_conversion
      applies_to: "preparation_water_input"
      rule: "water_mass = measured water volume × documented density; subtract measured recovered water crossing outward only if it is a separate exchange"
      inputs:
        - "boundary-crossing make-up volume"
        - density
        - "any separately measured outward recovered-water flow"
      output: "kg process-water input"
      source_ids: []
    - id: cr_reference_normalization
      applies_to: "complete foreground data package"
      rule: "normalized exchange = reconciled exchange amount / net mass of conforming reference_scrap_output"
      inputs:
        - "all reconciled exchanges"
        - "dispatch-lot net saleable mass"
      output: "each exchange per 1 kg reference product"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "every represented lot"
      requirement: "Identify the predominant listed metal or alloy, composition basis, origin, physical form, grade, preparation route, and hazardous-component state; do not use a generic mixed-metal identity."
      evidence: "Supplier record, acceptance record, sampling plan, test or inspection result, and grade certificate"
    - id: dq_measurement
      applies_to: "mass, electricity, water, and composition"
      requirement: "Use calibrated devices within their valid range and retain original readings, unit conversions, uncertainty or precision information, and calibration status."
      evidence: "Calibration certificates, meter logs, laboratory quality records, and conversion worksheet"
    - id: dq_temporal
      applies_to: "annual or campaign dataset"
      requirement: "Cover a representative continuous 12-month period where possible; otherwise cover the full campaign and explain seasonality, outages, stock changes, and the reason for the shorter period."
      evidence: "Dated lot ledger, production calendar, inventory reconciliation, and representativeness assessment"
    - id: dq_completeness
      applies_to: "facility foreground inventory"
      requirement: "Reconcile every accepted lot to saleable outputs, specifically identified residues, fines, other physical outputs, and inventory change; investigate missing streams."
      evidence: "Signed process-stage and facility mass balances"
    - id: dq_route_specificity
      applies_to: "conditional mechanical preparation"
      requirement: "Keep bypassed, sheared, shredded, screened, wet-separated, and other materially different routes separate unless a documented weighted aggregation remains representative."
      evidence: "Route logs, equipment records, meter allocation, and aggregation rationale"
    - id: dq_destination
      applies_to: "outgoing residue and fines"
      requirement: "Record physical state, declared composition where relevant, waste or product status, receiver, transport handoff, and treatment or recovery route."
      evidence: "Scale ticket, transfer document, receiver record, and linked treatment dataset"
validation_rules:
  - rule_id: vr_identity_complete
    applies_to: "reference flow and foreground package"
    rule: "Fail validation when predominant listed metal or alloy, origin, physical form, grade or specification, moisture and foreign-material basis, hazardous-component state, preparation route, geography, or reporting period is missing."
    source_ids:
      - unsd-cpc-3-0-structure-2025
  - rule_id: vr_reference_output
    applies_to: "reference_scrap_output"
    rule: "Confirm that the only quantitative reference output is exactly 1 kg after normalization and that its unnormalized dispatch-lot net mass is positive and traceable."
    source_ids: []
  - rule_id: vr_mass_balance
    applies_to: "each process stage and facility total"
    rule: "Confirm the mass-balance equation, report the signed and absolute unexplained difference, and require documented investigation against a study-defined tolerance rather than inserting a balancing flow."
    source_ids: []
  - rule_id: vr_conditional_route
    applies_to: "mechanical_preparation and its exchanges"
    rule: "Include preparation electricity, water, residues, and fines only when their specific route occurs; require an explicit bypass statement when the conditional process is omitted."
    source_ids:
      - us-epa-metal-shredders-2024
  - rule_id: vr_energy_units
    applies_to: "electricity inputs"
    rule: "Recalculate each kWh-to-MJ conversion with 3.6 MJ/kWh and reject mixed-unit summation."
    source_ids: []
  - rule_id: vr_no_double_count
    applies_to: "interstage and upstream links"
    rule: "Confirm each internal transfer appears once as an output and once as the corresponding input without adding both to the facility-level net inventory, and confirm upstream supply and off-site treatment are linked rather than duplicated in the foreground process."
    source_ids: []
  - rule_id: vr_uuid_status
    applies_to: "reference and inventory flows"
    rule: "Treat UUID-empty rows as unresolved identities. Do not substitute generic metal scrap, mixed scrap, precious-metal scrap, ferrous scrap, or non-metal waste for the exact semantic flow."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; may serve as a background_dataset only after representativeness and review are documented"
  downstream_use: "Foreground process datasets and lifecycle models requiring prepared listed-metal scrap at a scrap-preparation facility gate"
  allowed_use: "Studies whose predominant metal or alloy, grade, origin, physical form, preparation route, geography, period, moisture basis, foreign-material basis, and burden convention match the dataset"
  excluded_use: "Generic mixed-metal scrap; precious-metal or ferrous scrap; intact batteries or electronic equipment; metallurgical recovery; substitution or avoided-primary-metal credit without a separate downstream convention; geographies or technologies lacking a representativeness assessment"
  required_metadata: "Canonical PCR id; predominant metal or alloy and composition; new or post-consumer origin; source sector; grade or specification; physical and delivery form; moisture and foreign-material basis; hazardous-component state; preparation route and equipment; facility geography; reporting period; reference mass; allocation; source ids; unresolved UUID disclosure"
  required_quality_disclosure: "Sampling and analytical methods; scale and meter calibration; temporal and technological coverage; batch-to-dispatch linkage; process and facility mass balances; unexplained differences; route aggregation; residue destinations; data gaps; uncertainty; review status"
  update_trigger: "Change in predominant metal or alloy, accepted source mix, grade specification, physical form, contamination or moisture basis, preparation technology, facility, electricity or water supply, residue destination, allocation rule, reporting period, or reference-flow UUID resolution"
