system_boundary:
  rules:
    - rule_id: sb_start_at_acceptance
      applies_to: "foreground starting condition"
      rule: "Start the foreground boundary only after the facility has accepted, weighed, and identified the incoming listed-metal scrap. Model generation, collection, depollution required before acceptance, and inbound transport in separate upstream datasets when included by the study."
      source_ids:
        - jrc-waste-treatment-bref-2018
        - us-epa-metal-shredders-2024
    - rule_id: sb_include_preparation
      applies_to: "foreground operations"
      rule: "Include receiving and inspection, characterization and sorting, material handling and storage, route-conditional cutting, shearing, shredding, screening or physical separation, final grading, consolidation, and loading when performed by the reporting facility."
      source_ids:
        - us-epa-metal-shredders-2024
    - rule_id: sb_exclude_recovery
      applies_to: "downstream transformation"
      rule: "Exclude roasting, smelting, melting, hydrometallurgy, refining, alloy manufacture, and any other transformation that produces recovered metal rather than prepared waste or scrap."
      source_ids:
        - ec-jrc-non-ferrous-metals-bref-2016
    - rule_id: sb_route_and_residue_disclosure
      applies_to: "conditional operations and treatment"
      rule: "Declare every preparation technology actually used, meter its exchanges, and link each outgoing residue to a specific treatment dataset. Do not insert a generic preparation route or a generic waste-treatment process."
      source_ids:
        - jrc-waste-treatment-bref-2018
        - us-epa-metal-shredders-2024
