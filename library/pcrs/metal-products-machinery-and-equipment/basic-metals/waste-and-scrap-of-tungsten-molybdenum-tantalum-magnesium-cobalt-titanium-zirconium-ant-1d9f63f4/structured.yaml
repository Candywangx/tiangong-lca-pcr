      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated gross and tare measurements to obtain net mass. State whether moisture and adhering non-metallic material remain in the commercial grade; never mix dry-mass and as-received results without an explicit conversion."
