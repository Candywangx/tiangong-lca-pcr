review_metadata:
  goal_policy_fingerprint: "sha256:ca4d48461138cec48aa51cf1438775f652663ac663b161c0203fabc5dc779d27"
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: reference_scrap_output
      reason: "No exact public TianGong product flow is available for the prepared listed-metal reference product."
  unresolved:
    inventory_flow_uuids:
      - row_id: accepted_unprepared_scrap_input
        reason_code: no_exact_candidate
        explanation: "All five public state-100 candidates were generic metal scrap or precious-metal scrap and did not identify the listed metals together with the accepted unprepared state."
      - row_id: sorted_scrap_output
        reason_code: internal_intermediate_needs_new_flow
        explanation: "This composition-controlled interstage scrap is a foreground internal intermediate; no exact public flow identity is asserted."
      - row_id: sorted_scrap_input
        reason_code: internal_intermediate_needs_new_flow
        explanation: "This row transfers the composition-controlled sorting output into the conditional preparation stage; no exact public flow identity is asserted."
      - row_id: prepared_scrap_output
        reason_code: internal_intermediate_needs_new_flow
        explanation: "This foreground preparation output is an internal intermediate pending a dedicated flow identity."
      - row_id: nonmetallic_separation_residue_output
        reason_code: classification_mismatch
        explanation: "The only returned public candidate was food-industry organic residue and could not represent the separated non-metallic residue."
      - row_id: metal_bearing_fines_output
        reason_code: product_state_mismatch
        explanation: "Public candidates were generic scrap, ferrous scrap, waste abrasives, or diamond fines; none exactly identified listed-metal-bearing fines from mechanical preparation."
      - row_id: prepared_scrap_input
        reason_code: internal_intermediate_needs_new_flow
        explanation: "This row transfers the prepared scrap intermediate to final grading and dispatch; no exact public flow identity is asserted."
      - row_id: reference_scrap_output
        reason_code: no_exact_candidate
        explanation: "All five product-flow candidates were precious-metal scrap, mixed scrap including ferrous metal or batteries, waste paper, or circuit-board waste; none exactly represented the composition-controlled prepared reference product."
    range_evidence_needs:
      - row_id: accepted_unprepared_scrap_input
        need: "Two independent original sources with compatible facility-gate boundary, product state, and 1 kg saleable-output basis for received-to-saleable scrap yield."
      - row_id: receiving_sorting_electricity_input
        need: "Two independent original sources for receiving, analysis, and sorting electricity intensity for comparable listed-metal scrap facilities."
      - row_id: sorted_scrap_output
        need: "Two independent original sources for sorting yield by declared scrap grade and contamination state."
      - row_id: sorted_scrap_input
        need: "Two independent original sources for the applicable interstage mass-transfer relation by declared scrap grade and preparation route."
      - row_id: preparation_electricity_input
        need: "Two independent original sources for route-specific cutting, shearing, shredding, screening, or separation electricity intensity."
      - row_id: preparation_water_input
        need: "Two independent original sources for water use in wet separation or dust-suppression routes with compatible discharge boundary."
      - row_id: prepared_scrap_output
        need: "Two independent original sources for preparation yield by particle size, metal or alloy grade, and technology."
      - row_id: nonmetallic_separation_residue_output
        need: "Two independent original sources for non-metallic residue generation from comparable input quality and separation technology."
      - row_id: metal_bearing_fines_output
        need: "Two independent original sources for metal-bearing fines generation and disposition from comparable mechanical preparation."
      - row_id: dispatch_electricity_input
        need: "Two independent original sources for final grading, weighing, consolidation, and loading electricity intensity."
      - row_id: prepared_scrap_input
        need: "Two independent original sources for the applicable prepared-scrap transfer relation, including bypassed and mechanically prepared routes."
      - row_id: reference_scrap_output
        need: "Two independent original sources for the saleable output fraction on the declared composition, moisture, and contamination basis."
