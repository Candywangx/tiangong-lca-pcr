      collection_method: "reconcile lot or campaign weights to inventory movements and scale tickets"
      unit: "kg"
      frequency: "each lot or campaign; reconcile monthly"
      temporal_coverage: "at least 12 representative months or the full shorter production period"
      site_scope: "all included lines at the producing site"
      aggregation_rule: "sum by compatible alloy and route, apply documented allocation, then normalize to 1,000 kg accepted product"
      quality_evidence: "scale calibration, lot reconciliation, inventory variance, and scrap transfer tickets"
