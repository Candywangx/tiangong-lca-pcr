allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "route, line, and finishing operations"
    rule: "Prefer process subdivision and direct metering. Allocate shared electricity, fuel, water, consumables, wastes, and releases to the declared product using documented causal measures such as machine time, metered energy, bath loading, treated surface area, or accepted mass."
    source_ids: []
  - rule_id: allocation_scrap_output
    applies_to: "aluminium process scrap"
    rule: "Record segregated aluminium scrap as an explicit output and report its destination. Do not silently subtract scrap from billet or strip input, and do not add avoided-primary-aluminium credit inside the foreground gate-to-gate inventory."
    source_ids:
      - european-aluminium-profile-report-2015
  - rule_id: allocation_residual_choice
    applies_to: "unavoidable multi-product operation"
    rule: "If subdivision and causal allocation are not feasible, use accepted product mass for physically similar outputs; disclose the allocation factor, affected exchanges, co-products, and sensitivity. Use economic allocation only when physical relations are demonstrably unsuitable."
    source_ids: []
dataset_production:
