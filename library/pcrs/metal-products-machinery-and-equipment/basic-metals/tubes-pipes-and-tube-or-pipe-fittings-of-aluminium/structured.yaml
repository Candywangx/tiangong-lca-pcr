      site_scope: "all included forming, thermal, finishing, abatement, and auxiliary operations"
      aggregation_rule: "subtract excluded loads, allocate shared loads causally, convert units under section 4, normalize to reference output"
      quality_evidence: "meter calibration, invoice reconciliation, and load-allocation record"
