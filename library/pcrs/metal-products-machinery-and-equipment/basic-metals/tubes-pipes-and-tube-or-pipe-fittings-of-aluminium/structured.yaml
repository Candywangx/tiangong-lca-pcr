system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins with receipt of the declared aluminium feedstock and all purchased energy, water, lubricants, and surface-treatment chemicals. It includes route-specific billet or strip preparation; extrusion or strip forming and welding; drawing, straightening, cutting, bending, machining, joining, heat treatment, cleaning, anodizing, other declared surface treatment, inspection, internal scrap handling, wastewater treatment, and direct releases when these occur at the producing site. It ends with accepted product at the producing factory gate."
      source_ids: []
    - rule_id: boundary_factory_gate
      applies_to: "all foreground packages"
      rule: "Include all on-site operations from receipt of aluminium feedstock through accepted product at the producing factory gate; exclude downstream distribution, installation, use, and end of life."
      source_ids:
        - usitc-aluminium-extrusions-2022
        - european-aluminium-profile-report-2015
    - rule_id: boundary_route_disclosure
      applies_to: "forming route"
      rule: "Identify whether the product follows billet extrusion, post-extrusion drawing, rolled-strip forming and longitudinal welding, or fitting fabrication, and include only exchanges that actually cross that route boundary."
      source_ids:
        - usitc-aluminium-extrusions-2022
        - european-aluminium-automotive-manual-2002
    - rule_id: boundary_surface_treatment
      applies_to: "surface treatment"
      rule: "Include caustic cleaning and sulfuric-acid anodizing exchanges only when those operations occur within the producing site; otherwise identify the mill-finished state or the upstream/downstream finishing dataset used."
      source_ids:
        - usitc-aluminium-extrusions-2022
boundary_abstraction:
  declared_starting_condition: "Purchased aluminium extrusion billet, aluminium strip, or another disclosed aluminium semi-finished feedstock arrives at the producing site with alloy, recycled-content basis, mass, supplier, and delivery state identified"
  starting_condition_role: "foreground_gate_input"
  product_classification_scope: "Aluminium tubes, pipes, and tube or pipe fittings represented by CPC 3.0 code 41536; classification is contextual and does not replace the semantic product qualifiers"
  recursive_input_rule: "If an aluminium tube, pipe, or fitting from the same category is purchased for further fabrication, record it once as a product input with its upstream dataset and do not recursively reproduce its manufacture inside the same process"
  upstream_dataset_requirement: "Use supplier-specific upstream datasets where available; otherwise use geographically, technologically, alloy-, product-state-, and recycled-content-representative datasets and disclose substitutions"
  disclosure: "Declare starting feedstock form, supplier or data-source basis, alloy, primary/recycled content, route, all included finishing steps, internal scrap loop, direct emission compartments, and excluded off-site operations"
