    range_evidence_needs:
      - row_id: in_aluminium_extrusion_billet
        explanation: "No two independent original sources with compatible gate-to-gate boundary, product state and normalization were verified for an aluminium-billet input range."
      - row_id: in_aluminium_strip
        explanation: "No two independent original sources with compatible welded-tube boundary and product state were verified for an aluminium-strip input range."
      - row_id: in_electricity
        explanation: "Electricity demand depends on forming route, heat treatment, finishing and site technology; compatible independent range evidence remains needed."
      - row_id: in_natural_gas
        explanation: "Natural-gas demand depends on furnace technology and included thermal operations; compatible independent range evidence remains needed."
      - row_id: in_process_water
        explanation: "Water use and recirculation depend on quenching and surface-treatment configuration; compatible independent range evidence remains needed."
      - row_id: in_lubricating_oil
        explanation: "Lubricant consumption depends on forming and machining operations; compatible independent range evidence remains needed."
      - row_id: in_sodium_hydroxide
        explanation: "Caustic-cleaning demand depends on surface-treatment chemistry and bath management; compatible independent range evidence remains needed."
      - row_id: in_sulfuric_acid
        explanation: "Sulfuric-acid demand depends on whether anodizing is performed and on bath management; compatible independent range evidence remains needed."
      - row_id: out_aluminium_process_scrap
        explanation: "One industry report gives a single extrusion-scrap observation, which is insufficient for an externally inferred cross-route range."
      - row_id: out_used_lubricating_oil
        explanation: "Used-oil generation depends on lubricant recovery and replacement practice; compatible independent range evidence remains needed."
      - row_id: out_aluminium_hydroxide_sludge
        explanation: "Treatment-sludge generation depends on finishing chemistry and wastewater treatment; compatible independent range evidence remains needed."
      - row_id: out_fossil_carbon_dioxide
        explanation: "Direct fossil-carbon-dioxide emissions depend on measured fuel carbon and oxidation; no generic empirical range is imposed."
      - row_id: out_nitrogen_oxides
        explanation: "Direct nitrogen-oxide emissions depend on combustion equipment and controls; compatible independent range evidence remains needed."
      - row_id: out_aluminium_to_air
        explanation: "Aluminium air releases depend on mechanical operations and abatement; compatible independent range evidence remains needed."
      - row_id: out_aluminium_to_fresh_water
        explanation: "Direct freshwater releases depend on discharge route and treatment; compatible independent range evidence remains needed."
