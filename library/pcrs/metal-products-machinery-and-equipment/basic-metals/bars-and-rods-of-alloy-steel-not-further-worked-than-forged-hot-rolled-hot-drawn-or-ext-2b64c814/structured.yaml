allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared foreground operations"
    rule: "Prefer process subdivision, submetering and batch-specific mass tracking so conditioning, reheating, hot working and finishing burdens are assigned directly before any allocation."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_internal_recycling
    applies_to: "Internally returned scrap and scale"
    rule: "Treat scrap or scale returned within the modelled site as an internal loop: retain its generation in the mass balance, exclude it as an external product and prevent a second upstream burden or recycling credit."
    source_ids:
      - worldsteel-wire-rod-eco-profile-2023
  - rule_id: allocation_external_coproduct
    applies_to: "Externally used scrap, scale or recovered material"
    rule: "When an output performs a documented external product function, prefer system expansion with the displaced function and substitution assumptions reported; if infeasible, apply a justified physical or economic allocation and report a sensitivity check."
    source_ids:
      - worldsteel-lci-methodology-2017
      - worldsteel-wire-rod-eco-profile-2023
  - rule_id: allocation_multiple_products
    applies_to: "Multiple saleable grades or dimensions"
    rule: "Use separately metered process data where available; otherwise allocate only residual shared burdens by saleable mass and disclose the product mix, allocation basis and sensitivity."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_feedstock_conditioning
      process_id: "feedstock_conditioning"
      flow_role: "Feedstock, electricity, conditioned output and scrap"
      record_type: "Scale tickets, batch records, submeters and operating logs"
      raw_fields: "batch_id; supplier; alloy_grade; feedstock_form; received_mass_kg; accepted_mass_kg; scrap_mass_kg; electricity_kWh; meter_id"
      collection_method: "Reconcile calibrated scales and electricity meters to production batches"
      unit: "kg; kWh"
      frequency: "Each batch; meters at least monthly"
      temporal_coverage: "At least 12 consecutive months unless a shorter representative campaign is justified"
      site_scope: "Each production site and conditioning line"
      aggregation_rule: "Sum accepted batches and allocate only documented shared electricity before normalization"
      quality_evidence: "Scale calibration; meter calibration; batch reconciliation; exception log"
    - protocol_id: cp_reheating_energy_mass
      process_id: "reheating"
      flow_role: "Furnace charge, fuel, electricity and reheated output"
      record_type: "Furnace logs, fuel meters, invoices, scales and submeters"
      raw_fields: "batch_id; furnace_id; charge_mass_kg; discharge_mass_kg; inlet_temperature_C; discharge_temperature_C; natural_gas_m3; gas_reference_conditions; electricity_kWh; operating_hours"
      collection_method: "Read calibrated meters and reconcile charge-to-discharge mass"
      unit: "kg; m3; kWh; degree C; h"
      frequency: "Each batch with monthly meter reconciliation"
      temporal_coverage: "At least 12 consecutive months unless seasonality is immaterial and justified"
      site_scope: "Each furnace and production line"
      aggregation_rule: "Sum by furnace and product family, then normalize to measured reheated output"
      quality_evidence: "Meter calibration; fuel invoice reconciliation; furnace log completeness"
    - protocol_id: cp_reheating_emissions
      process_id: "reheating"
      flow_role: "Fossil CO2, carbon monoxide, nitrogen monoxide and nitrogen dioxide"
      record_type: "Continuous or periodic stack monitoring plus fuel-composition records"
      raw_fields: "stack_id; pollutant; concentration; concentration_unit; gas_flow; gas_flow_unit; oxygen_reference; moisture_basis; operating_hours; fuel_carbon_content; oxidation_factor"
      collection_method: "Apply the site-approved monitoring method and retain species resolution; never duplicate total NOx as both NO and NO2"
      unit: "kg; mg/Nm3; Nm3/h; h"
      frequency: "Continuous where installed or at the permit-compliant campaign frequency"
      temporal_coverage: "Same representative period as production data"
      site_scope: "Each reheating emission point"
      aggregation_rule: "Convert concentration and standardized gas flow to mass, aggregate by operating hours and normalize to reheated output"
      quality_evidence: "Calibration certificates; sampling report; detection limits; calculation workbook"
    - protocol_id: cp_hot_working_mass_energy
      process_id: "hot_working"
      flow_role: "Reheated feedstock, rolling electricity and hot-worked output"
      record_type: "Line scales, production records and electricity submeters"
      raw_fields: "batch_id; route; line_id; input_mass_kg; output_mass_kg; electricity_kWh; passes; section_reduction; product_section"
      collection_method: "Reconcile line input and output mass with calibrated meters and route records"
      unit: "kg; kWh"
      frequency: "Each batch; electricity at least monthly"
      temporal_coverage: "At least 12 consecutive months or a justified representative campaign"
      site_scope: "Each hot-working line and route"
      aggregation_rule: "Aggregate only like route, grade and product-state records before normalization"
      quality_evidence: "Scale calibration; meter calibration; route and grade traceability"
    - protocol_id: cp_hot_working_waste_emissions
      process_id: "hot_working"
      flow_role: "Scrap, dry mill scale and iron-oxide particulate matter"
      record_type: "Waste weights, scale collection records and emission monitoring"
      raw_fields: "batch_id; scrap_mass_kg; dry_scale_mass_kg; scale_moisture; pollutant_fraction; concentration; gas_flow; operating_hours"
      collection_method: "Weigh segregated solids and calculate emitted mass from monitoring data"
      unit: "kg; mg/Nm3; Nm3/h; h"
      frequency: "Each removal or batch; emissions at monitoring frequency"
      temporal_coverage: "Same representative period as production data"
      site_scope: "Each line and extraction point"
      aggregation_rule: "Sum segregated outputs and emission masses, then normalize to hot-worked output"
      quality_evidence: "Weighbridge tickets; laboratory analysis; monitoring calibration"
    - protocol_id: cp_finishing_mass_water_energy
      process_id: "descaling_cooling_finishing"
      flow_role: "Finishing input, make-up water, electricity and reference product"
      record_type: "Product scales, water meters, electricity meters and inspection records"
      raw_fields: "batch_id; input_mass_kg; make_up_water_kg; recirculated_water_kg; electricity_kWh; saleable_mass_kg; rejected_mass_kg; specification; inspection_result"
      collection_method: "Meter only boundary-crossing make-up water and reconcile saleable output to inspection records"
      unit: "kg; kWh"
      frequency: "Each batch; utilities at least monthly"
      temporal_coverage: "At least 12 consecutive months or a justified representative campaign"
      site_scope: "Each finishing line"
      aggregation_rule: "Sum conforming product and attributable utilities, then normalize to 1,000 kg reference product"
      quality_evidence: "Scale and meter calibration; inspection release; water-balance check"
    - protocol_id: cp_finishing_wastewater
      process_id: "descaling_cooling_finishing"
      flow_role: "Wet mill scale and discharged wastewater"
      record_type: "Wastewater flow meters, dewatered-scale weights and laboratory results"
      raw_fields: "discharge_point; wastewater_mass_kg; suspended_solids; oil_and_grease; wet_scale_mass_kg; scale_moisture; treatment_route"
      collection_method: "Measure net discharge after recirculation and characterize solids and oil separately"
      unit: "kg; mg/L"
      frequency: "Continuous flow total with representative composite sampling"
      temporal_coverage: "Same representative period as production data"
      site_scope: "Each water circuit and discharge point"
      aggregation_rule: "Sum net discharge and dewatered scale without counting recirculated water as a new input or output"
      quality_evidence: "Flow-meter calibration; sampling chain of custody; laboratory accreditation"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "All foreground rows"
      rule: "normalized amount = recorded amount / saleable product mass × 1,000 kg"
      inputs:
        - "recorded row amount"
        - "saleable product mass"
      output: "amount per 1,000 kg reference product"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_electricity_conversion
      applies_to: "Electricity rows"
      rule: "electricity_MJ = metered_kWh × 3.6 MJ/kWh"
      inputs:
        - "metered electricity in kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_stack_mass
      applies_to: "Monitored stack emissions"
      rule: "pollutant mass = dry standardized concentration × dry standardized gas flow × operating time, with unit, oxygen-reference and moisture corrections documented"
      inputs:
        - concentration
        - "standardized gas flow"
        - "operating time"
        - "correction factors"
      output: "pollutant mass in kg"
      source_ids:
        - ec-jrc-fmp-bref-2022
    - id: calc_fossil_co2
      applies_to: "Fossil CO2 from each furnace fuel"
      rule: "Calculate fuel-specific fossil CO2 from collected fuel quantity, supplier carbon content and documented oxidation factor; sum fuels only after each atomic fuel result is retained"
      inputs:
        - "fuel quantity"
        - "carbon content"
        - "oxidation factor"
      output: "fossil CO2 mass in kg"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_process_mass_balance
      applies_to: "Each foreground process and full foreground system"
      rule: "mass-balance difference = total mass inputs - total mass outputs - documented inventory change; explain material differences and avoid double-counting internal transfers"
      inputs:
        - feedstock
        - product
        - scrap
        - scale
        - dust
        - "wastewater solids"
        - "inventory change"
      output: "reconciled mass-balance difference"
      source_ids:
        - worldsteel-lci-methodology-2017
        - ec-jrc-fmp-bref-2022
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Feedstock and reference product"
      requirement: "Retain supplier, alloy grade, specification, product form, route, dimensions, delivery condition and batch traceability sufficient to prove inclusion and exclusions."
      evidence: "Supplier certificate; batch record; inspection release"
    - id: dq_temporal_representativeness
      applies_to: "All foreground records"
      requirement: "Use at least 12 consecutive months of representative operation; justify a shorter period of at least six months and account for seasonal or operating-pattern variation."
      evidence: "Coverage report; production calendar; representativeness justification"
    - id: dq_measurement_control
      applies_to: "Mass, energy, water and emission measurements"
      requirement: "Use calibrated instruments, declare reference conditions and preserve raw readings, corrections, detection limits and allocation calculations."
      evidence: "Calibration certificates; meter register; monitoring reports; calculation workbook"
    - id: dq_completeness
      applies_to: "All processes"
      requirement: "Record all energy inputs and all material or emission flows above the declared cut-off; each excluded flow must be below 1% and all exclusions together below 5% of mass, energy or environmental relevance, with no exclusion used to omit hazardous or material emissions."
      evidence: "Completeness checklist and exclusion register"
    - id: dq_consistency
      applies_to: "Bilingual PCR implementation and dataset"
      requirement: "Apply one reference mass basis, prevent double counting of internal transfers, and document every deviation from the process map or calculation rules."
      evidence: "Mass-balance report; deviation log; independent review"
validation_rules:
  - rule_id: validation_product_identity
    applies_to: "Reference product"
    rule: "Reject a dataset that does not declare alloy grade, hot-working route, product form, dimensions, delivery condition and explicit exclusion of high-speed steel and silico-manganese steel."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_reference_amount
    applies_to: "Reference flow"
    rule: "Confirm that the saleable output equals exactly 1,000 kg after normalization and excludes transport packaging, rejects and externally dispatched waste."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_mass_balance
    applies_to: "Each process and full foreground system"
    rule: "Check iron-bearing and total mass balances; investigate and explain differences, internal loops and inventory changes before release."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_energy_completeness
    applies_to: "Reheating and hot working"
    rule: "Confirm that each actual fuel, electricity, steam or purchased-heat exchange is represented by a separate atomic row and that meter coverage matches operating time."
    source_ids:
      - worldsteel-lci-methodology-2017
      - ec-jrc-fmp-bref-2022
  - rule_id: validation_emission_no_double_count
    applies_to: "Reheating emissions"
    rule: "Confirm species, air compartment, oxygen reference and moisture basis; do not duplicate a total-NOx-as-NO2 value in the nitrogen monoxide and nitrogen dioxide rows."
    source_ids:
      - ec-jrc-fmp-bref-2022
  - rule_id: validation_water_balance
    applies_to: "Descaling and cooling"
    rule: "Reconcile make-up, recirculated, evaporated, retained and discharged water; count only boundary-crossing make-up water and net wastewater discharge."
    source_ids:
      - ec-jrc-fmp-bref-2022
  - rule_id: validation_boundary_links
    applies_to: "Upstream and downstream datasets"
    rule: "Confirm that upstream semi-finished steel is linked exactly once and that downstream cold working, machining, coating, transport, use and end-of-life are absent unless separately declared."
    source_ids:
      - worldsteel-lci-methodology-2017
      - worldsteel-wire-rod-eco-profile-2023
  - rule_id: validation_unresolved_identities
    applies_to: "TianGong UUID references"
    rule: "Before publication, directly verify an exact public state-code-100 flow for every unresolved exchange or retain the dataset as review-required with the gap disclosed."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for factory-gate alloy-steel bars and rods in the declared hot-worked, not-further-worked state"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Gate-to-gate modelling; cradle-to-gate modelling when one compatible upstream semi-finished steel dataset is linked; route- and grade-specific foreground comparisons with harmonized scope"
  excluded_use: "Representation of irregularly wound coils, high-speed steel, silico-manganese steel, stainless steel, cold-finished or further-worked products; public comparative assertions without harmonized functional equivalence and review"
  required_metadata: "PCR id and version; CPC context; alloy grade; specification; product form; hot-working route; dimensions; surface and delivery condition; site and geography; reference period; upstream route and recycled-content convention; cut-offs; allocation; data sources; unresolved identities"
  required_quality_disclosure: "Temporal and geographic coverage; primary-data share; meter and scale coverage; mass-, energy- and water-balance results; emission monitoring basis; allocation and system-expansion choices; excluded flows; uncertainty; unresolved UUIDs"
  update_trigger: "Change in alloy family, product state, hot-working route, furnace fuel or electricity supply, site technology, water circuit, emission controls, allocation method, upstream steelmaking dataset, specification, or representative data period"
