system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground system contains feed acceptance and assay; only the preparation, melting, dissolution, refining, electrorefining, precipitation, casting, granulation, powder production, or semi-manufacturing operations actually used; off-gas capture and treatment; internal wastewater transfer and treatment attributable to the product; and final product assay and weighing. Buildings and capital equipment are outside the default foreground inventory unless explicitly included."
      source_ids: []
    - rule_id: boundary_rule_1
      applies_to: "foreground_operation_selection"
      rule: "Include only operations actually used to transform accepted feed into the declared gold product; record route-specific reagents and emissions as conditional atomic exchanges."
      source_ids:
        - eu-jrc-nfm-bref-2017
        - fritz-gold-scrap-recycling-2020
    - rule_id: boundary_rule_2
      applies_to: "environmental_controls"
      rule: "Include attributable off-gas capture/scrubbing and wastewater neutralization or treatment; do not report untreated generation and treated release as the same exchange."
      source_ids:
        - eu-jrc-nfm-bref-2017
        - fritz-gold-scrap-recycling-2020
    - rule_id: boundary_rule_3
      applies_to: "upstream_and_recycling_boundary"
      rule: "Keep physical foreground collection from accepted feed to saleable product distinct from upstream datasets and the declared recycling system model."
      source_ids:
        - fritz-gold-scrap-recycling-2020
boundary_abstraction:
  declared_starting_condition: "Received gold-bearing feed has crossed the facility gate and has a unique lot identity, measured mass, representative gold assay, physical-state description, supplier/source route, and waste-or-product legal status."
  starting_condition_role: "Foreground gate input; upstream production, collection, and transport are represented separately when required by the declared study boundary."
  product_classification_scope: "Saleable outputs within CPC 3.0 code 41320 only."
  recursive_input_rule: "A purchased or transferred gold input already within CPC 41320 is recorded with its own upstream dataset and is not recursively re-produced inside this foreground process. Internal rework is recorded once in the mass balance and is not a new external input."
  upstream_dataset_requirement: "Link doré, gold scrap under the chosen recycling system model, electricity, fuels, oxygen, water, and each reagent to geography-, technology-, concentration-, and delivery-appropriate upstream datasets when constructing cradle-to-gate results."
  disclosure: "Declare feed route and legal status, supplier/source geography, assay and dry-mass basis, refining/forming technology, included environmental-control operations, recycling allocation approach, co-products, internal recycling, cut-offs, product form/fineness, and whether upstream transport is included."
