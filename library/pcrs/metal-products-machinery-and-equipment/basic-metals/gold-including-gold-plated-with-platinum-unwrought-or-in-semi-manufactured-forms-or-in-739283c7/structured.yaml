validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference_product"
    rule: "Confirm output_gold equals 1 kg after normalization and that form, fineness, alloy composition, and platinum-plating status are within the category."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_rule_2
    applies_to: "inventory_identity"
    rule: "Confirm each card is one atomic exchange; UUID rows match the stated identity/property/unit and official Chinese name; unresolved rows remain UUID-empty."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "route_consistency"
    rule: "Reject a route-specific reagent or emission without the corresponding declared operation, or an operation whose applicable measured inputs, wastes, or releases are omitted without explanation."
    source_ids:
      - eu-jrc-nfm-bref-2017
      - fritz-gold-scrap-recycling-2020
  - rule_id: validation_rule_4
    applies_to: "mass_and_assay_balance"
    rule: "Recalculate contained-gold inputs, outputs, work-in-progress change, residues, and measured losses; investigate rather than force discrepancies."
    source_ids:
