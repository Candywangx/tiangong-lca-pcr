allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "separately_metered_operations"
    rule: "Avoid allocation by subdividing and directly assigning measured inputs, wastes, and emissions to the operation and lot that produced them."
    source_ids:
      - fritz-gold-scrap-recycling-2020
  - rule_id: allocation_rule_2
    applies_to: "inseparable_multi_output_operations"
    rule: "When gold and other valuable metals are inseparable at the measurement point, report mass allocation and economic allocation based on documented contemporaneous net values as sensitivity cases; identify the primary case and retain masses, assays, prices, currency, date, and calculations."
    source_ids:
      - fritz-gold-scrap-recycling-2020
  - rule_id: allocation_rule_3
    applies_to: "internal_recovery_and_rework"
    rule: "Return internally recovered gold-bearing residues to the mass balance once without treating them as a new external input or avoided product. Exported material receives a separate verified product or waste flow."
    source_ids:
      - eu-jrc-nfm-bref-2017
  - rule_id: allocation_rule_4
    applies_to: "recycled_feed"
    rule: "Declare the recycling system model for gold scrap and keep upstream collection or avoided-primary-production credit outside the physical foreground inventory unless the boundary is explicitly expanded."
    source_ids:
      - fritz-gold-scrap-recycling-2020
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_and_assay
      process_id: "gold_refining_and_forming"
      flow_role: "accepted feed, product, and contained-gold balance"
      record_type: "scale record and laboratory assay"
      raw_fields: "lot_id; time; gross_mass; tare_mass; net_mass; dry_fraction; Au_assay; other_assays; assay_method; sample_id; form; disposition"
      collection_method: "Calibrated weighing and documented representative sampling/assay for each lot"
      unit: "kg; mass fraction"
      frequency: "Every lot"
      temporal_coverage: "Full reporting period"
      site_scope: "Receiving, intermediate, and dispatch points"
      aggregation_rule: "Calculate contained metal by lot before period aggregation"
      quality_evidence: "Scale calibration; sampling plan; laboratory QA/QC; chain of custody; reconciliation"
    - protocol_id: cp_energy_and_fuel_records
      process_id: "gold_refining_and_forming"
      flow_role: "electricity, natural gas, and direct fossil CO2"
      record_type: "meter, invoice, and fuel specification"
      raw_fields: "meter_id; readings; unit; time; allocation_driver; gas_conditions; carbon_factor; oxidation_basis"
      collection_method: "Read calibrated meters, reconcile invoices, and assign only included operations"
      unit: "MJ; kWh; m3"
      frequency: "At least monthly and at campaign change"
      temporal_coverage: "Full reporting period"
      site_scope: "Included production and control equipment"
      aggregation_rule: "Sum each carrier, subtract documented exports, normalize to product, and calculate direct CO2 separately"
      quality_evidence: "Calibration; invoices; reconciliation; fuel specification"
    - protocol_id: cp_gas_reagent_records
      process_id: "gold_refining_and_forming"
