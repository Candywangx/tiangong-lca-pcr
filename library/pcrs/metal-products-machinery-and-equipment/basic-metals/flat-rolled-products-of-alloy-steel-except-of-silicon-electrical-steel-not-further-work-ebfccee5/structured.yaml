  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = net row amount × 1,000 / net saleable reference-product mass"
      inputs:
        - "boundary-crossing row amount"
        - "net saleable product mass"
      output: "row amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "electricity"
      rule: "electricity (MJ) = meter electricity (kWh) × 3.6"
      inputs:
        - "metered kWh"
      output: "delivered electricity in MJ"
      source_ids: []
    - id: calc_process_gas_energy
      applies_to: "coke-oven, blast-furnace, and BOF gas"
      rule: "gas energy (MJ) = reference-condition gas volume (m3) × campaign-specific NCV (MJ/m3)"
      inputs:
        - "normalized gas volume"
        - "measured or supplier NCV"
      output: "gas energy in MJ"
      source_ids:
        - eu-ferrous-metals-bat-2022
    - id: calc_direct_fossil_co2
      applies_to: "direct fuel combustion"
      rule: "Prefer direct measured fossil CO2; otherwise sum fuel quantity × fuel carbon content × oxidation factor × 44/12, keeping fossil and biogenic carbon separate"
      inputs:
        - "fuel records"
        - "carbon content"
        - "oxidation factor"
        - "measured CO2 where available"
      output: "kg fossil CO2 to air"
      source_ids:
        - worldsteel-lci-methodology-2017
    - id: calc_mass_balance
      applies_to: "alloy-steel mass outputs"
      rule: "reconcile slab input with saleable product, metallic scrap, mill scale, sludge solids, and documented stock change; investigate the residual rather than forcing closure"
      inputs:
        - "all measured mass inputs/outputs and stock changes"
      output: "documented mass-balance residual"
      source_ids:
        - worldsteel-lci-methodology-2017
  data_quality_requirements:
    - id: dq_product_identity
