    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Screen every line input/output and environmental release; retain reasons for exclusions and show that internal recycling is not double counted."
      evidence: "signed flow screening; mass/water/energy/carbon balances; waste and emission registers"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference product"
    rule: "Reject a dataset unless alloy designation, non-silicon-electrical identity, width of at least 600 mm, as-hot-rolled state, and absence of further working are demonstrated."
    source_ids:
      - un-cpc-v3-structure-2025
  - rule_id: validation_reference_mass
    applies_to: "reference flow"
    rule: "Confirm that net saleable output equals exactly 1,000 kg after normalization and that every inventory row uses the same denominator."
    source_ids: []
  - rule_id: validation_upstream_link
    applies_to: "slab input"
    rule: "Report the dataset as gate-to-gate unless a compatible upstream steelmaking, casting, and any pre-slab primary-rolling dataset is linked without overlap or omission."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: validation_energy_water
    applies_to: "energy, gas, oxygen, and water"
    rule: "Reconcile meters to the declared rolling-line boundary, state gas reference conditions and water source/destination, and explain material residuals or shared-service allocations."
    source_ids:
      - eu-ferrous-metals-bat-2022
      - worldsteel-lci-methodology-2017
  - rule_id: validation_residues_emissions
    applies_to: "waste and elementary outputs"
    rule: "Verify separate identities, quantities, and fates for scrap, scale, sludge, wastewater, fossil CO2, and particulate matter; do not substitute a combined residue or emissions row."
    source_ids:
      - eu-ferrous-metals-bat-2022
      - worldsteel-lci-methodology-2017
  - rule_id: validation_allocation
    applies_to: "multi-product campaigns and exported materials"
    rule: "Confirm subdivision was attempted first and every remaining allocation, substitution, destination, and sensitivity is documented without double counting internal loops."
    source_ids:
      - worldsteel-lci-methodology-2017
published_dataset_profile:
  dataset_role: "Foreground hot-rolling production dataset; may be combined with a compatible upstream alloy-steel slab dataset for cradle-to-gate publication"
  downstream_use: "secondary_dataset; background_dataset after independent review of representativeness, allocation, and upstream linkage"
  allowed_use: "Product-footprint and lifecycle-model studies requiring an explicitly graded, at-least-600-mm-wide, as-hot-rolled alloy-steel input within the represented geography, technology, and period"
  excluded_use: "Silicon-electrical steel; width below 600 mm; cold-rolled, pickled, coated, plated, clad, polished, profiled, or fabricated products; unsupported geography or alloy-family proxies; public comparative assertions without study-specific review"
  required_metadata: "PCR id and version; product grade/designation and chemistry/specification; form and dimensions; surface and further-working state; upstream slab dataset; steelmaking, casting, and any primary-rolling route; mill and furnace technology; fuel identity; geography; period; allocation; water-treatment boundary; packaging; UUID gaps and proxies"
  required_quality_disclosure: "Primary-data share and period; calibration and reconciliation evidence; mass/water/energy/carbon residuals; missing-data treatment; allocation sensitivity; data age; upstream compatibility; excluded operations; unresolved flow identities and range evidence"
  update_trigger: "Change in alloy family, product form, feedstock route, mill configuration, furnace fuel, hot-charge practice, water treatment, allocation method, geography, representative year, product specification, or resolution of a material UUID/evidence gap"
data_sources:
  - id: "un-cpc-v3-structure-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 structure (30 June 2025). https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv (retrieved 2026-09-03)"
    used_for: "Official subclass title and product identity: alloy-steel flat product, width threshold, as-hot-rolled state, and silicon-electrical-steel exclusion"
  - id: "un-cpc-v3-explanatory-notes-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 explanatory notes (30 June 2025). https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-09-03)"
    used_for: "Original explanatory note confirming that hot-rolled high-speed-steel flat products with width of 600 mm or more are classified in subclass 41213"
  - id: "eu-ferrous-metals-bat-2022"
    type: "standard"
    reference: "Commission Implementing Decision (EU) 2022/2110 of 11 October 2022 establishing BAT conclusions for the ferrous metals processing industry. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022D2110 (retrieved 2026-09-03)"
    used_for: "Hot-rolling process decomposition; energy, water, residues, emissions, monitoring, and directly associated treatment requirements; BAT performance levels are not used as empirical inventory ranges"
  - id: "worldsteel-lci-methodology-2017"
    type: "method_factor"
    reference: "World Steel Association, Life Cycle Inventory Methodology Report, 2017. https://worldsteel.org/wp-content/uploads/Life-cycle-inventory-methodology-report.pdf (retrieved 2026-09-03)"
    used_for: "Factory-gate declared unit, system-boundary framing, primary-data quality, internal recovery and co-product accounting; its stated stainless-steel exclusion limits direct applicability to stainless grades, for which foreground rules and a compatible upstream method must be documented separately"
