allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "campaigns, grades, and product forms"
    rule: "Use campaign-, line-, or grade-specific meters and mass records to subdivide the process before allocation; do not average stainless, high-speed, and other alloy families when separate records exist."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_common_burdens
    applies_to: "inseparable common rolling-line inputs"
    rule: "When subdivision is not possible, allocate common burdens by net saleable output mass among co-produced hot-rolled products and disclose the included grades, output masses, and sensitivity to the allocation choice."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_internal_recycling
    applies_to: "internal water, scale, and metallic scrap loops"
    rule: "Record gross internal recovery for mass-balance evidence but count only net exchanges crossing the declared foreground boundary; do not assign both an avoided burden and an input burden to the same internal loop."
    source_ids:
      - worldsteel-lci-methodology-2017
  - rule_id: allocation_exported_materials
    applies_to: "scrap, mill scale, and other exported material"
    rule: "Declare whether each exported material is waste or a marketable co-product, its destination and treatment; apply substitution or another allocation only under the governing study method with documented functional equivalence and sensitivity analysis."
    source_ids:
      - worldsteel-lci-methodology-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass_and_yield_records
      process_id: "hot_rolling_line"
      flow_role: "feedstock, saleable output, crop scrap, scale"
      record_type: "weighbridge, slab-tracking, production, and inventory records"
      raw_fields: "timestamp; campaign; grade; slab mass; saleable product mass; scrap/scale mass; stock changes; hot-charge state"
      collection_method: "calibrated scales and reconciled production records"
      unit: "kg"
      frequency: "each batch with monthly reconciliation"
      temporal_coverage: "representative 12-month period"
      site_scope: "all lines and finishing stations serving the declared product"
      aggregation_rule: "sum net boundary-crossing mass by grade and normalize to saleable output"
      quality_evidence: "calibration records; mass-balance reconciliation; exception log"
    - protocol_id: cp_energy_and_gas_records
      process_id: "hot_rolling_line"
