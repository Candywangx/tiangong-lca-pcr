system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "All datasets"
      rule: "Include all route steps from receipt through net saleable product at the facility gate, including route-specific cleaning, conditioning, blending, extraction, sheet formation, drying, expansion and packing when performed."
