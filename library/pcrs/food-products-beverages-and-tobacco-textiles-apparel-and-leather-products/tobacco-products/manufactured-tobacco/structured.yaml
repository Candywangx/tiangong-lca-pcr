      rule: "Keep supplier production outside the foreground but link a dataset for every material, ingredient, energy carrier and packaging component crossing the boundary."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_same_category_input
      applies_to: "Purchased manufactured tobacco"
      rule: "Record it as a distinct input with origin, route, moisture and supplier dataset; prevent double counting of its manufacture."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_optional_routes
      applies_to: "Reconstituted, expanded, extract and essence routes"
      rule: "Include only steps actually operated, but absence of an applicable step requires an explicit not-applicable statement."
      source_ids:
        - us-epa-tobacco-processing-2006
    - rule_id: boundary_excluded_products
      applies_to: "Multi-product tobacco sites"
      rule: "Meter or subdivide CPC 25091 production from headings 24.01, 24.02 and 24.04."
      source_ids:
        - unsd-cpc-v3-2025
        - wco-hs-2022-ch24
