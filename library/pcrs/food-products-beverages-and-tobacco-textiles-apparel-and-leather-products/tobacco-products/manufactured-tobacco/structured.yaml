allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Multi-route or multi-product sites"
    rule: "First subdivide by route, line, batch, meter, formulation and operating time so CPC 25091 foreground records are directly assigned."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical
    applies_to: "Unavoidable joint processes with multiple saleable tobacco products"
    rule: "If subdivision is not possible and a causal physical relationship exists, allocate by net dry-matter mass or another demonstrated causal property; disclose moisture conversion and sensitivity."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_economic
    applies_to: "Joint processes lacking a defensible physical relationship"
    rule: "Use economic allocation only after documenting why subdivision and physical allocation fail; use contemporaneous net-gate values and test sensitivity."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_internal_rework
    applies_to: "Recovered tobacco returned to the same foreground"
    rule: "Treat as an internal transfer with no co-product credit and prevent simultaneous reporting as waste and new input."
    source_ids:
      - us-epa-tobacco-processing-2006
  - rule_id: allocation_waste_recovery
    applies_to: "Waste sent for recycling, energy recovery or treatment"
    rule: "Record the waste amount and destination. Apply any downstream credit only under the chosen study method and disclose it outside the foreground production balance."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_materials
      process_id: "receiving_storage"
      flow_role: "input product flows"
      record_type: "weighment"
      raw_fields: "flow name, supplier, lot, gross, tare, net, moisture, stock change"
      collection_method: "calibrated scale plus inventory reconciliation"
      unit: "kg"
      frequency: "each lot; monthly reconciliation"
      temporal_coverage: "representative year or full campaign"
      site_scope: "all receiving points"
      aggregation_rule: "sum each atomic flow; convert moisture only after retaining raw mass"
      quality_evidence: "calibration, lot records, stock reconciliation"
    - protocol_id: cp_receiving_waste
      process_id: "receiving_storage"
      flow_role: "output waste"
      record_type: "weighment"
      raw_fields: "waste name, container tare, gross, destination"
      collection_method: "calibrated container scale"
      unit: "kg"
      frequency: "each shipment"
      temporal_coverage: "same period as production"
      site_scope: "receiving area"
      aggregation_rule: "sum by atomic waste and destination"
      quality_evidence: "tickets, calibration, destination records"
    - protocol_id: cp_conversion_water
      process_id: "tobacco_conversion"
      flow_role: "input water"
      record_type: "meter/batch"
      raw_fields: "meter start/end, batch additions, purpose"
      collection_method: "calibrated meter and batch record"
      unit: "m3"
      frequency: "daily or each batch"
      temporal_coverage: "same period as production"
      site_scope: "all conversion water points"
      aggregation_rule: "sum direct use; keep sanitation water in wastewater raw records"
      quality_evidence: "meter calibration, batch sheets"
    - protocol_id: cp_conversion_steam
      process_id: "tobacco_conversion"
      flow_role: "input steam"
      record_type: "meter"
      raw_fields: "mass, pressure, temperature, quality"
      collection_method: "steam meter or verified engineering balance"
      unit: "kg"
      frequency: "hourly/daily"
      temporal_coverage: "same period as production"
      site_scope: "conversion delivery boundary"
      aggregation_rule: "sum delivered steam only"
      quality_evidence: "meter calibration, balance"
    - protocol_id: cp_conversion_heat
      process_id: "tobacco_conversion"
      flow_role: "input purchased hot water"
      record_type: "meter"
      raw_fields: "mass flow, inlet/outlet temperature, time"
      collection_method: "heat meter"
      unit: "MJ"
      frequency: "hourly/daily"
      temporal_coverage: "same period as production"
      site_scope: "conversion delivery boundary"
      aggregation_rule: "integrate delivered energy; no steam aggregation"
      quality_evidence: "calibration and heat balance"
    - protocol_id: cp_conversion_electricity
      process_id: "tobacco_conversion"
      flow_role: "input electricity"
      record_type: "meter"
      raw_fields: "meter start/end, downtime, line output"
      collection_method: "revenue-grade submeter"
      unit: "kWh"
      frequency: "daily/monthly"
      temporal_coverage: "same period as production"
