  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground exchanges"
      rule: "normalized exchange = period exchange / period net conforming product mass"
      inputs:
        - "period exchange"
        - "net product kg"
      output: "exchange per 1 kg product"
      source_ids:
        - eu-pef-2021
    - id: calc_net_product_mass
      applies_to: "Packed reference product"
      rule: "net product = gross filled units - tare of all separately reported packaging"
      inputs:
        - "gross filled mass"
        - "packaging tare"
      output: "kg net manufactured tobacco"
      source_ids: []
    - id: calc_dry_matter
      applies_to: "Tobacco-bearing masses"
      rule: "dry matter = as-received mass × (1 - moisture mass fraction)"
      inputs:
        - mass
        - moisture
      output: "kg dry matter"
      source_ids: []
    - id: calc_material_balance
      applies_to: "Receiving through packing"
      rule: "inputs + opening stocks = saleable output + wastes + emissions + closing stocks; internal transfers cancel"
      inputs:
        - "atomic mass records and stocks"
      output: "absolute and percentage closure"
      source_ids:
        - us-epa-tobacco-processing-2006
    - id: calc_refrigerant_loss
      applies_to: "Each refrigerant"
      rule: "loss = purchases + opening stock - closing stock - documented recovery - net charge increase"
      inputs:
        - "refrigerant records"
      output: "kg substance to air"
      source_ids: []
    - id: calc_expansion_co2_release
      applies_to: "CO2 expansion"
      rule: "release = fresh liquid CO2 input + opening stock - closing stock - documented recovery"
      inputs:
        - "CO2 tank and recovery records"
      output: "kg CO2 to air"
      source_ids:
        - us-epa-tobacco-processing-2006
    - id: calc_steam_allocation
      applies_to: "Shared on-site boiler"
      rule: "allocated boiler exchange = total boiler exchange × metered steam to foreground / total metered steam delivered"
      inputs:
        - "boiler records"
        - "steam meters"
      output: "allocated exchange"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_temporal
      applies_to: "All foreground data"
      requirement: "Use one coherent representative period, normally at least 12 consecutive months; campaign production may use a complete campaign with justification."
      evidence: "dated production, meter and inventory records"
    - id: dq_geographical
      applies_to: "Site and upstream links"
      requirement: "Identify facility geography and use supplier or regional datasets matching actual procurement where available."
      evidence: "site address, supplier origin, dataset metadata"
    - id: dq_technological
      applies_to: "Route and equipment"
      requirement: "Describe the actual loose/snuff/pressed/twisted, expanded, reconstituted, extract or essence route and control equipment."
      evidence: "process diagram, equipment list, batch records"
    - id: dq_completeness
      applies_to: "Atomic inventory"
      requirement: "Reconcile tobacco dry matter, net product, packaging, water, energy, wastes and direct emissions; explain every missing applicable card."
      evidence: "balance workbook and not-applicable register"
    - id: dq_precision
      applies_to: "Measurements and allocations"
      requirement: "Retain calibration, sampling uncertainty, moisture testing, allocation drivers and calculation versions."
      evidence: "certificates, laboratory QA/QC, versioned calculations"
    - id: dq_source_caution
      applies_to: "External comparison"
      requirement: "Do not transfer company-wide or cigarette-only intensities as CPC 25091 foreground facts; use them only to identify data fields or qualitative risks."
      evidence: "source-boundary review citing hendlin-bialous-2019 and who-tobacco-environment-2017"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference exchange"
    rule: "Error unless exactly one output uses UUID 0b1039e5-6251-4030-a2fd-707a1f32f365, Mass, Units of mass and kg."
    source_ids:
      - unsd-cpc-v3-2025
  - rule_id: validate_classification
    applies_to: "CPC/HS scope"
    rule: "Error unless product evidence supports CPC 25091/HS 24.03 and none of the stated exclusions."
    source_ids:
      - unsd-cpc-v3-2025
      - wco-hs-2022-ch24
  - rule_id: validate_net_mass
    applies_to: "Reference amount"
    rule: "Error unless output is normalized to exactly 1 kg net product with moisture basis and packaging treatment declared."
    source_ids: []
  - rule_id: validate_route_coverage
    applies_to: "Process map"
    rule: "Error unless every applicable route step is included and every non-applicable conditional process is explicitly justified."
    source_ids:
      - us-epa-tobacco-processing-2006
  - rule_id: validate_atomic_flows
    applies_to: "Inventory atomicity"
    rule: "Error if any row combines electricity, heat, steam, fuels, refrigerants, materials, packaging components, waste materials or emitted substances."
    source_ids: []
  - rule_id: validate_localized_reference_name
    applies_to: "Chinese reference name"
    rule: "Error unless the UUID-bearing Chinese selected flow is exactly 人造烟草."
    source_ids: []
  - rule_id: validate_material_balance
    applies_to: "Tobacco and product balance"
    rule: "Error unless as-received and dry-matter balances include stocks, internal transfers, product, waste and measured air losses, with closure and residual reported."
    source_ids:
      - us-epa-tobacco-processing-2006
  - rule_id: validate_energy_separation
    applies_to: "Energy records"
    rule: "Error unless electricity, purchased hot water, steam, natural gas and diesel are separate exchanges and absent carriers have explicit not-applicable records."
    source_ids: []
  - rule_id: validate_refrigerants
    applies_to: "Cooling systems"
    rule: "Error unless every refrigerant serving the foreground is named separately with makeup and loss records, or absence is documented."
    source_ids: []
  - rule_id: validate_packaging
    applies_to: "Packaging inventory"
    rule: "Error unless each actual packaging material is a separate input and corresponding scrap is separately reported; bulk product shall declare zero sales packaging."
    source_ids: []
  - rule_id: validate_waste_emissions
    applies_to: "Waste and emissions"
    rule: "Error unless waste destinations and direct air/water emissions are substance- or material-specific and captured dust is not also reported to air."
    source_ids:
      - us-epa-tobacco-processing-2006
  - rule_id: validate_allocation
    applies_to: "Shared operations and co-products"
    rule: "Error unless subdivision is attempted first and any physical or economic allocation has driver, period and sensitivity documented."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_data_quality
    applies_to: "Representativeness and evidence"
    rule: "Warn when temporal, geographical, technological, completeness or precision evidence is missing."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_no_empirical_range_transfer
    applies_to: "Range provenance"
    rule: "Error if an empirical range lacks at least two independent, boundary-compatible full-text sources; this PCR prescribes no empirical ranges."
    source_ids:
      - hendlin-bialous-2019
      - who-tobacco-environment-2017
published_dataset_profile:
  dataset_role: "Unit-process foreground dataset for manufactured tobacco production"
  downstream_use: "Product-system and lifecycle-model construction for matching CPC 25091 products"
  allowed_use: "Declared manufactured-tobacco route, composition, moisture basis, geography, technology and factory-gate boundary"
  excluded_use: "Cigarettes, cigars, unmanufactured tobacco, HS 24.04 products, or unmatched routes and moisture bases"
  required_metadata: "Reference product UUID; CPC/HS evidence; route; formulation categories; moisture basis; package configuration; geography; technology; reporting period"
  required_quality_disclosure: "Atomic inventory coverage; material and water balances; allocation; exclusions; collection protocols; data-quality evidence"
  update_trigger: "Material change in route, formulation, equipment, energy supply, package configuration, allocation, boundary or data quality"
