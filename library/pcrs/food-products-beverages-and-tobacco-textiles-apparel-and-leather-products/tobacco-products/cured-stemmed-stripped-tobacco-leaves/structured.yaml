system_boundary:
  rules:
    - rule_id: boundary_cured_leaf_start
      applies_to: "Foreground entry"
      rule: "Start the normal foreground boundary at accepted cured unstemmed leaf; represent cultivation, harvest, curing, and inbound transport with linked upstream datasets and declare whether curing was flue-, fire-, or air-curing."
      source_ids:
        - usda-7cfr-leaf-tobacco
        - fao-rwedp-32
    - rule_id: boundary_complete_stemming_redrying
      applies_to: "Covered route"
      rule: "Include conditioning, foreign-matter removal, threshing or stemming, lamina/stem separation, screening, redrying, moisture equilibration or cooling, and packing as explicit foreground operations when performed."
      source_ids:
        - wise-reaves-1997
        - usepa-2006-tobacco-processing
    - rule_id: boundary_product_state
      applies_to: "Product identity"
      rule: "The reference output must remain unmanufactured cured leaf tobacco in stemmed/stripped form; exclude unstemmed leaf sold as such and all downstream cutting, flavoring, expansion, reconstitution, extraction, and consumer-product manufacture."
      source_ids:
        - unsd-cpc3-25010
        - usda-7cfr-leaf-tobacco
    - rule_id: boundary_actual_inputs
      applies_to: "Utilities and materials"
      rule: "Record each actually used water input, electricity supply, steam supply, fuel, cleaning chemical, and packaging component as its own atomic exchange; add a specific card when an actual item is not represented below."
      source_ids:
        - eu-2021-2279-environmental-footprint
    - rule_id: boundary_outputs_emissions
      applies_to: "Outputs"
      rule: "Record stems, strip scrap, tobacco dust, rejects, wastewater, and each directly emitted substance separately by destination; do not hide direct emissions in a treatment-service input or net co-products from inputs."
      source_ids:
        - usepa-2006-tobacco-processing
        - eu-2021-2279-environmental-footprint
    - rule_id: boundary_tiangong_route_conflict
      applies_to: "Tiangong metadata"
      rule: "Do not use Fresh, unprocessed produce / 鲜品，未加工 as route evidence because it contradicts the cured title and CPC identity; disclose the conflict and require resolution or formal review acceptance before publication."
      source_ids:
        - unsd-cpc3-25010
        - usda-7cfr-leaf-tobacco
boundary_abstraction:
  declared_starting_condition: "Traceable cured unstemmed tobacco leaves accepted at the stemming/redrying facility, with tobacco type, origin, crop year, curing method and location, grade, received mass, moisture basis, and upstream cultivation-curing dataset reference declared."
  starting_condition_role: "Foreground gate input; cultivation, harvesting, initial curing, and inbound transport are linked upstream systems unless separately added to an extended study."
  product_classification_scope: "Cured stemmed/stripped tobacco leaves represented by CPC 3.0 code 25010 and restricted to unmanufactured leaf tobacco with the main stems or midribs removed."
  recursive_input_rule: "Purchased or transferred cured stemmed/stripped tobacco already in this category is recorded once as a distinct input with its upstream dataset; do not reconstruct its stemming/redrying inventory recursively."
  upstream_dataset_requirement: "Link cultivation, harvesting, curing, and inbound transport for received cured unstemmed leaf; link purchased electricity, steam, water, each fuel, packaging component, and off-site treatment actually used."
  disclosure: "Declare facility and geography, tobacco type, origin and crop year, curing method and location, received-leaf state, process configuration, moisture targets, stem and scrap disposition, fuel and emission calculation, packaging, allocation, exclusions, data gaps, and the unresolved Tiangong route-metadata conflict."
