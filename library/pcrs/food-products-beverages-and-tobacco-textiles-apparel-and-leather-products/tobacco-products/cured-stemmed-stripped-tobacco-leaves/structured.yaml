allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "Every multi-output operation"
    rule: "Prefer subdivision, line-specific measurement, or system expansion that preserves separately measured lamina, stems, strip scrap, dust, rejects, and energy recovery before applying allocation."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_output_classification
    applies_to: "Stems and strip scrap"
    rule: "Classify each stream by its actual destination: a saleable or internally used material with an upstream-substitution claim is a co-product; a discarded stream is waste. Do not change classification merely to improve results."
    source_ids:
      - usda-7cfr-leaf-tobacco
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_residual_physical
    applies_to: "Unavoidable shared burdens"
    rule: "When subdivision and system expansion are not applicable, allocate shared conditioning, separation, and redrying burdens by measured dry mass of saleable outputs on a consistent moisture basis."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_economic_sensitivity
    applies_to: "Material co-products"
    rule: "When stems or strip scrap have materially different value from lamina, report an economic-allocation sensitivity using period-matched net revenues and disclose the result alongside the primary physical allocation."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_no_invisible_credit
    applies_to: "Waste and recovered energy"
    rule: "Do not subtract waste treatment, exported material, recovered heat, or recovered energy directly from an input. Represent the outgoing stream and any substitution or credit as an explicit model choice."
    source_ids:
      - eu-2021-2279-environmental-footprint
dataset_production:
  collection_protocols:
    - protocol_id: cp_leaf_receipts
      process_id: "leaf_receiving_conditioning"
      flow_role: "Received leaf, rejects, and stones"
      record_type: "Weighbridge, lot, supplier, grade, and inspection records"
      raw_fields: "lot_id; supplier; origin; crop_year; tobacco_type; cultivar; curing_method; curing_location; upstream_dataset; gross_mass; tare_mass; moisture; grade; reject_mass; reject_reason; stone_mass"
      collection_method: "Calibrated scale plus documented representative sampling and visual inspection"
      unit: "kg; mass %"
      frequency: "Every receipt lot"
      temporal_coverage: "Full represented production period"
      site_scope: "Every supplying lot accepted by the represented facility"
      aggregation_rule: "Sum net mass and rejected mass; mass-weight moisture; retain lot identity and stock change"
      quality_evidence: "Calibration certificate; weigh ticket; supplier document; grade certificate; sampling plan; inspection record"
    - protocol_id: cp_conditioning_records
      process_id: "leaf_receiving_conditioning"
      flow_role: "Conditioned leaf, water, steam, electricity, and cleaning wastewater"
      record_type: "Line scales, water/steam/electricity meters, equipment logs, and cleaning records"
      raw_fields: "lot_id; inlet_mass; inlet_moisture; outlet_mass; outlet_moisture; water_input; steam_mass; steam_state; electricity; cleaning_water; wastewater; opening_stock; closing_stock"
      collection_method: "Calibrated transfer scales and utility meters; documented balance only where direct measurement is unavailable"
      unit: "kg; kWh; MJ; mass %"
      frequency: "Each lot, shift, and utility meter period"
      temporal_coverage: "Full represented production period"
      site_scope: "All receiving and conditioning equipment serving the product"
      aggregation_rule: "Stock-correct material transfer; reconcile utilities to represented operating hours; keep absorbed mist separate from cleaning discharge"
      quality_evidence: "Calibration record; meter record; batch log; steam calculation; cleaning log; water-balance worksheet"
    - protocol_id: cp_separation_records
      process_id: "threshing_separation"
      flow_role: "Lamina, stems, strip scrap, dust, and electricity"
      record_type: "Transfer scales, line logs, collector records, sales and waste records"
      raw_fields: "lot_id; input_mass; input_moisture; lamina_mass; lamina_moisture; stem_mass; stem_moisture; strip_scrap_mass; dust_mass; destination; revenue; electricity; opening_stock; closing_stock"
      collection_method: "Calibrated scales, line submeter, collector-container weighing, and dispatch reconciliation"
      unit: "kg; kWh; mass %; currency"
      frequency: "Each lot or shift"
      temporal_coverage: "Full represented production period"
      site_scope: "Every threshing, separation, screening, and dust-control line"
      aggregation_rule: "Reconcile stock-correct inputs and all physical outputs before allocation; sum outputs by destination"
      quality_evidence: "Calibration record; line log; laboratory result; collector record; sale ticket; waste manifest; stock reconciliation"
    - protocol_id: cp_redrying_records
      process_id: "redrying_cooling"
      flow_role: "Lamina, utilities, fuel, final moisture, and evaporated water"
      record_type: "Feed/output scales, moisture tests, meters, fuel invoices, fuel analyses, and redryer logs"
      raw_fields: "lot_id; inlet_mass; inlet_moisture; outlet_mass; outlet_moisture; electricity; steam_mass; steam_state; fuel_type; fuel_quantity; heating_value; heating_value_basis; operating_hours; opening_stock; closing_stock"
      collection_method: "Calibrated scales and meters; representative moisture sampling; fuel stock reconciliation"
      unit: "kg; kWh; MJ; mass %"
      frequency: "Each lot and utility/fuel reporting period"
      temporal_coverage: "Full represented production period"
      site_scope: "Every redryer and cooling/equilibration unit"
      aggregation_rule: "Calculate energy from each fuel separately; calculate evaporated water from moisture-corrected balance; never average fuel routes"
      quality_evidence: "Calibration record; moisture method; meter record; invoice; fuel analysis; operating log; stock and mass-balance worksheet"
    - protocol_id: cp_air_emissions
      process_id: "threshing_separation_redrying_cooling"
      flow_role: "Substance-specific direct air emissions"
      record_type: "Stack or workplace monitoring, exhaust-flow, fuel, permit, and factor records"
      raw_fields: "emission_point; substance_id; concentration; exhaust_flow; temperature; pressure; duration; fuel_type; fuel_quantity; factor; factor_source; control_device"
      collection_method: "Direct measurement preferred; otherwise an applicable fuel-, equipment-, and control-specific factor applied to collected activity data"
      unit: "kg; mg/m3; m3/s; MJ"
      frequency: "Each monitoring event and reporting period"
      temporal_coverage: "Full represented operating period"
      site_scope: "Every included direct emission point"
      aggregation_rule: "Calculate mass by substance and point; do not combine NO with NO2 or emitted particulate with collected dust"
      quality_evidence: "Calibration and laboratory report; monitoring plan; permit return; factor source; calculation worksheet; control-device log"
    - protocol_id: cp_packing_records
      process_id: "packing_storage_release"
      flow_role: "Net product, packaging components, packaging waste, and electricity"
      record_type: "Packing batch, scale, bill-of-material, purchase, stock, and waste records"
      raw_fields: "batch_id; product_input; net_product_output; gross_packed_mass; box_count; box_mass; liner_count; liner_mass; strap_length; strap_mass; packaging_waste_mass; electricity; opening_stock; closing_stock"
      collection_method: "Calibrated product scale plus item mass verification and stock reconciliation"
      unit: "kg; item count; m; kWh"
      frequency: "Each packing batch"
      temporal_coverage: "Full represented production period"
      site_scope: "Every line and package used for the reference product"
      aggregation_rule: "Reconcile net product separately from packaging; convert item counts or length with verified item factors"
      quality_evidence: "Scale calibration; package specification; supplier record; invoice; batch log; waste ticket; stock reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every foreground exchange"
      rule: "normalized amount = stock-corrected exchange amount / net conforming reference-product mass × 1,000 kg"
      inputs:
        - "exchange amount"
        - "opening stock"
        - "closing stock"
        - "net reference-product mass"
      output: "amount per 1,000 kg reference product"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_dry_mass
      applies_to: "Moisture-basis comparison"
      rule: "dry mass = wet mass × (1 - moisture mass fraction); retain the original wet mass and measured moisture"
      inputs:
        - "wet mass"
        - "moisture mass fraction"
      output: "dry mass for balancing or physical allocation"
      source_ids:
        - fao-rwedp-32
        - usda-7cfr-leaf-tobacco
    - id: calc_process_mass_balance
      applies_to: "Each process and aggregate facility"
      rule: "balance gap = inputs + opening stock - outputs - closing stock; report evaporated water and each measured discharge explicitly and investigate the residual"
      inputs:
        - "moisture-consistent inputs"
        - outputs
        - "stock changes"
        - "absorbed water"
        - "evaporated water"
      output: "balance gap and documented gap fraction"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_fuel_energy
      applies_to: "Each onsite fuel"
      rule: "fuel energy = measured fuel quantity × declared heating value on a consistent basis"
      inputs:
        - "fuel quantity"
        - "heating value"
        - "moisture or ash basis"
        - "lower/higher heating-value basis"
      output: "MJ by fuel"
      source_ids:
        - zhu-2025-curing-emissions
    - id: calc_direct_emission
      applies_to: "Each emitted substance"
      rule: "emitted mass = measured concentration × standardized exhaust flow × operating duration, or collected activity × an applicable documented factor"
      inputs:
        - concentration
        - "exhaust flow"
        - temperature
        - pressure
        - time
        - "or activity and factor"
      output: "kg of one substance"
      source_ids:
        - zhu-2025-curing-emissions
    - id: calc_allocation_fraction
      applies_to: "Residual allocation"
      rule: "allocation fraction for output i = selected driver for output i / sum of the driver across all co-products in the same period"
      inputs:
        - "dry mass or net revenue by output"
        - "shared burden"
      output: "allocated burden and allocation fraction by output"
      source_ids:
        - eu-2021-2279-environmental-footprint
  data_quality_requirements:
    - id: dq_reference_identity
      applies_to: "Reference product"
      requirement: "Use Tiangong flow 57a438c1-b4d5-427a-8240-3aacf6c56025, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg without dataset versions."
      evidence: "Dataset reference-flow record and UUID validation"
    - id: dq_tiangong_route_conflict
      applies_to: "Reference identity metadata"
      requirement: "Disclose that treatmentStandardsRoutes = Fresh, unprocessed produce / 鲜品，未加工 conflicts with the cured title and CPC 25010; do not use it as methodology evidence, and retain the issue as unresolved until Tiangong reread and review close it."
      evidence: "Tiangong state-100 direct-read record; manifest unresolved-identity entry; review decision"
    - id: dq_product_qualifiers
      applies_to: "Every reference lot"
      requirement: "Preserve traceability for tobacco type, origin, crop year, curing route and location, grade, moisture, residual stem content, strip size when applicable, and package."
      evidence: "Supplier record; grade certificate; laboratory result; lot genealogy; packing record"
    - id: dq_temporal_coverage
      applies_to: "Foreground data"
      requirement: "Cover a representative operating year or complete declared campaign and disclose shutdowns, crop-season gaps, product changes, and extrapolation."
      evidence: "Date-bounded production, meter, fuel, stock, laboratory, and dispatch records; eu-2021-2279-environmental-footprint"
    - id: dq_technology_geography
      applies_to: "Facility representation"
      requirement: "Describe facility geography, line capacity, conditioning method, thresher and separator configuration, redryer, heat supply, dust control, moisture control, and package configuration."
      evidence: "Facility profile; process-flow diagram; equipment list; control-device record"
    - id: dq_completeness
      applies_to: "Process inventory"
      requirement: "Reconcile every process and disclose missing inputs, unmetered shared utilities, omitted emissions, unknown destinations, and unexplained balance gaps instead of silently assigning zero."
      evidence: "Signed mass, energy, water, and emission reconciliation; eu-2021-2279-environmental-footprint"
    - id: dq_zero_ranges
      applies_to: "Quantitative guidance"
      requirement: "Do not infer a range from one facility, one curing experiment, or unlike process boundaries. This PCR has zero ranges; all values require collected foreground evidence until two independent boundary-compatible originals support a reviewed interval."
      evidence: "Range audit; source applicability review; foreground records"
    - id: dq_source_traceability
      applies_to: "External evidence and factors"
      requirement: "Retain source title, stable URL or DOI, retrieval date for web sources, factor version, applicability, and the calculation worksheet."
      evidence: "Source register and calculation archive; eu-2021-2279-environmental-footprint"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "Fail conformance if the product UUID, Mass UUID, unit-group UUID, reference unit, reference amount, English display, or Chinese display differs from the verified reference object without an approved PCR revision."
    source_ids:
      - unsd-cpc3-25010
  - rule_id: val_tiangong_route_conflict
    applies_to: "Publication readiness"
    rule: "Fail publication readiness while the conflicting Fresh, unprocessed produce / 鲜品，未加工 route metadata remains unresolved or lacks formal review acceptance; never treat that value as support for a fresh-product boundary."
    source_ids:
      - unsd-cpc3-25010
      - usda-7cfr-leaf-tobacco
  - rule_id: val_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Fail conformance when any required qualifier is absent or product, laboratory, and process records disagree on tobacco type, curing route, moisture, residual stem content, strip specification, or package."
    source_ids:
      - usda-7cfr-leaf-tobacco
  - rule_id: val_process_coverage
    applies_to: "Process inventory"
    rule: "Require all four processes and an applicability decision for every conditional utility, fuel, wastewater, packaging, and emission card; an active card must carry amount, basis, protocol, and destination or compartment."
    source_ids:
      - wise-reaves-1997
      - usepa-2006-tobacco-processing
  - rule_id: val_atomic_flows
    applies_to: "Inventory exchanges"
    rule: "Fail conformance when a row combines fuels, utilities, packaging materials, wastes, or emitted substances; each card must represent one exchange and unresolved UUIDs must remain blank."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: val_moisture_mass_balance
    applies_to: "Every process and facility total"
    rule: "Calculate and report material balance on consistent moisture bases; investigate gaps against a documented site tolerance and do not force-close the balance by changing product mass or merging stems, scrap, dust, or evaporation."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: val_allocation
    applies_to: "Multi-output processes"
    rule: "Verify destination classification, avoidance rationale, allocation driver and period, fractions summing to 1 within reported rounding precision, and economic sensitivity when co-product value differences are material."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: val_energy_emissions
    applies_to: "Utilities, fuel, and direct emissions"
    rule: "Reconcile meters, invoices, stocks, heating values, operating periods, controls, and substance-specific calculations; do not combine NO and NO2 or fossil and biogenic carbon dioxide."
    source_ids:
      - zhu-2025-curing-emissions
      - eu-2021-2279-environmental-footprint
  - rule_id: val_no_inferred_ranges
    applies_to: "Quantitative metadata"
    rule: "Verify that the structured projection contains zero quantity ranges; reject any lower-equals-upper case value or range inferred without two independent boundary-compatible original sources."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: val_source_resolution
    applies_to: "Evidence register"
    rule: "Verify that every cited source id resolves in Data Sources and that each external factor or rule retains an applicability statement and calculation record."
    source_ids:
      - eu-2021-2279-environmental-footprint
published_dataset_profile:
  dataset_role: "Foreground production dataset for cured stemmed/stripped tobacco leaves at a declared stemming/redrying facility."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product and process LCA for unmanufactured cured stemmed/stripped leaf tobacco when origin, curing route, technology, product specification, boundary, allocation, and data quality are compatible."
  excluded_use: "Fresh or green tobacco; unstemmed leaf sold as such; tobacco stems alone; tobacco cultivation or curing without linked upstream data; manufactured, reconstituted, extracted, flavored, cut, consumer-ready, or smoking products; public comparative claims without method-compatible review."
  required_metadata: "PCR id; Tiangong reference-flow UUIDs; facility geography; production period; tobacco type; origin; crop year; curing method and location; incoming grade and moisture; process configuration; heat supply; final moisture; residual stem content; strip-size specification when used; package; boundary; allocation; dataset version; Tiangong route-conflict status."
  required_quality_disclosure: "Temporal, geographic, and technological representativeness; weighing and moisture-test methods; calibration; mass, energy, water, and emission reconciliation; upstream curing coverage; missing flow UUIDs; shared-utility allocation; co-product treatment; absent ranges; source and factor versions; uncertainty; Tiangong route-metadata conflict and review status."
  update_trigger: "Material change in product scope, CPC or Tiangong identity, treatment route metadata, tobacco or curing route, facility geography, conditioning, threshing/separation, redrying heat supply, dust control, package, allocation, measurement system, or source evidence."
data_sources:
  - id: "unsd-cpc3-25010"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Explanatory Notes, subclass 25010, last updated 30 June 2025, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf, retrieved 2026-08-20"
    used_for: "Exact CPC identity and separation from manufactured tobacco categories."
  - id: "usda-7cfr-leaf-tobacco"
    type: "standard"
    reference: "U.S. Department of Agriculture, 7 CFR Part 30, Tobacco Stocks and Standards, sections 30.2-30.13, https://www.govinfo.gov/content/pkg/CFR-2022-title7-vol2/pdf/CFR-2022-title7-vol2-subtitleB-chapI-subchapA.pdf, retrieved 2026-08-20"
    used_for: "Definitions of leaf tobacco, stemmed form, scrap, curing, and flue-, fire-, and air-curing; product-state and qualifier rules."
  - id: "wise-reaves-1997"
    type: "literature"
    reference: "William B. Wise and Dixie Watts Reaves, Tobacco's Important Role in the Economy of Southside Virginia, Virginia Tech Rural Economic Analysis Program Report R030, 1997, DOI 10.22004/ag.econ.14847, https://ageconsearch.umn.edu/record/14847, retrieved 2026-08-20"
    used_for: "Original process description for conditioning, inspection, threshing, air separation, screening, redrying, quality sampling, and packing."
  - id: "usepa-2006-tobacco-processing"
    type: "official_guidance"
    reference: "U.S. Environmental Protection Agency, Final Engineering Report: Tobacco Products Processing Detailed Study, 2006, EPA-HQ-OW-2004-0032, https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=P100N4Y7.TXT, retrieved 2026-08-20"
    used_for: "Stemming/redrying sector boundary, conditioning water absorption, limited process wastewater, baghouse material and air-control disclosure, and utility/process completeness."
  - id: "fao-rwedp-32"
    type: "official_guidance"
    reference: "Food and Agriculture Organization of the United Nations, Proceedings of the Regional Expert Consultation on Selection Criteria and Priority Rating for Assistance to Traditional Biomass Energy Using Industries, RWEDP Report No. 32, July 1997, tobacco leaf curing section, https://www.fao.org/4/ad594e/ad594e00.pdf, retrieved 2026-08-20"
    used_for: "Upstream curing-route distinction, moisture removal context, curing-stage declaration, and fuel-data need; no case value is used as a PCR range."
  - id: "zhu-2025-curing-emissions"
    type: "literature"
    reference: "Yinlong Zhu et al., Evaluating main gas emission and energy consumption economy during tobacco leaf curing life cycle based on clean energy, Scientific Reports 15, 13835 (2025), https://doi.org/10.1038/s41598-025-98956-3, retrieved 2026-08-20"
    used_for: "Full-text measurement design for fuel, flue-gas concentration, flow, duration, and substance-specific CO2, SO2, NO, and NO2 calculations; experimental values are not generalized into PCR ranges."
  - id: "eu-2021-2279-environmental-footprint"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on the Environmental Footprint methods, CELEX 32021H2279, https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32021H2279, retrieved 2026-08-20"
    used_for: "Company-specific data, completeness, allocation hierarchy and disclosure, data quality, robustness, and downstream dataset use."
