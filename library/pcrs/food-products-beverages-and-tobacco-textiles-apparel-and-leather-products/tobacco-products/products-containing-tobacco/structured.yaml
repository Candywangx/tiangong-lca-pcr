allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared utilities and multi-output operations"
    rule: "Avoid allocation by sub-metering or subdivision. If impossible, apply a documented physical relationship relevant to the process output; use another relationship such as economic value only after documenting why subdivision, system expansion and physical allocation are infeasible."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_internal_rework
    applies_to: "tobacco, sheet and finished-product rework"
    rule: "Return internal rework to the process mass balance without a second product credit. Retain all burdens incurred before rejection and quantify any additional reprocessing inputs."
    source_ids:
      - us-epa-tobacco-processing-2006
      - eu-pef-2021
  - rule_id: allocation_exported_tobacco_residue
    applies_to: "tobacco residue sold as a co-product"
    rule: "Treat a residue as waste unless it has a documented specification, customer and positive economic value. For a co-product, apply the hierarchy in allocation_subdivision_first and disclose quantities, prices, period and sensitivity."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_tobacco_materials
      process_id: "tobacco_preparation"
      flow_role: "tobacco input and prepared output"
      record_type: "receiving, issue, transfer and moisture records"
      raw_fields: "material id; supplier; tobacco form; gross and tare mass; moisture; batch; transfer mass"
      collection_method: "calibrated scales and batch reconciliation"
      unit: "kg"
      frequency: "each lot and batch"
      temporal_coverage: "complete reference period"
      site_scope: "all included lines"
      aggregation_rule: "sum net dry- or as-received mass consistently; reconcile opening and closing inventory"
      quality_evidence: "calibration, supplier specification, lot traceability and signed batch record"
    - protocol_id: cp_formulation_ingredients
      process_id: "tobacco_preparation"
      flow_role: "each formulation ingredient"
      record_type: "formulation and issue records"
      raw_fields: "ingredient id; concentration; issued mass; return mass; batch"
      collection_method: "calibrated dispensing and recipe-system export"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete reference period"
      site_scope: "all formulations in scope"
      aggregation_rule: "sum net issued mass separately by ingredient and normalize to output"
      quality_evidence: "scale calibration, approved formula and material certificate"
    - protocol_id: cp_water_records
      process_id: "tobacco_preparation"
      flow_role: "product and process water"
      record_type: "meter and batch-dose records"
      raw_fields: "meter id; start/end reading; batch dose; use role; process"
      collection_method: "dedicated meter or calibrated dosing system"
      unit: "m3 or kg"
      frequency: "each batch or daily"
      temporal_coverage: "representative full production period"
      site_scope: "each included process"
      aggregation_rule: "subtract verified non-process uses and aggregate by role"
      quality_evidence: "meter calibration and water balance"
    - protocol_id: cp_electricity_records
      process_id: "all_processes"
      flow_role: "electricity"
      record_type: "meter and equipment records"
      raw_fields: "meter id; readings; interval; operating time; rated load; process"
