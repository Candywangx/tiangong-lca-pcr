    used_for: "Representative product architecture, tobacco plug, formulation ingredients, component identity, manufacturing controls, quality and stability requirements"
  - id: "us-epa-tobacco-processing-2006"
    type: "official_guidance"
    reference: "U.S. Environmental Protection Agency. *Final Engineering Report: Tobacco Products Processing Detailed Study*, EPA-821-R-06-015, 2006. https://19january2017snapshot.epa.gov/sites/production/files/2015-09/documents/tobacco-products-processing-study_2006.pdf (accessed 2026-08-20)."
    used_for: "Tobacco conditioning, blending, cutting, reconstituted-sheet production, forming, packing, rejects, wastewater sources, air controls and treatment operations"
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "European Commission. *Commission Recommendation (EU) 2021/2279 on the use of the Environmental Footprint methods*, Annex I, 2021. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32021H2279 (accessed 2026-08-20)."
    used_for: "Inventory completeness, multifunctionality hierarchy, packaging and data-quality principles"
