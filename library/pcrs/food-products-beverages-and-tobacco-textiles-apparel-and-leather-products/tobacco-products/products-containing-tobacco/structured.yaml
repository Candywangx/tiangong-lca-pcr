  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period amount × 1,000 kg / net conforming finished-product mass for the same period"
      inputs:
        - "period exchange"
        - "released net product mass"
      output: "exchange per 1,000 kg reference product"
      source_ids: []
    - id: calc_component_mass
      applies_to: "count-based product and component records"
      rule: "mass = accepted count × verified mean unit mass; keep sampling uncertainty and do not mix product mass with packaging mass"
      inputs:
        - count
        - "sample masses"
        - "component identity"
      output: "kg by product or component"
      source_ids:
        - us-fda-iqos-tpl-2019
    - id: calc_material_balance
      applies_to: "tobacco preparation and assembly"
      rule: "opening inventory + receipts - closing inventory = conforming transfer + rework + each waste + measured loss; investigate unreconciled loss above the site's approved threshold"
      inputs:
        - inventory
        - receipt
        - transfer
        - product
        - "rework and waste records"
      output: "reconciled material balance"
      source_ids:
        - us-epa-tobacco-processing-2006
    - id: calc_wastewater_load
      applies_to: "each pollutant to water"
      rule: "load kg = matched discharge volume m3 × concentration mg/L × 0.001"
      inputs:
        - "flow and pollutant concentration"
      output: "kg pollutant to water"
      source_ids:
        - us-epa-tobacco-processing-2006
    - id: calc_refrigerant_loss
      applies_to: "R-410A"
      rule: "emitted mass = opening inventory + purchases - closing inventory - recovered mass - transferred mass"
      inputs:
        - "annual refrigerant inventory and service records"
      output: "kg R-410A to air"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Demonstrate physical tobacco or reconstituted-tobacco content, intended non-combustion use, product architecture and exclusion of reusable device mass."
      evidence: "approved specification, bill of materials, label and release record; un-cpc-3-2025; wco-hs-2022-chapter-24"
    - id: dq_formula_completeness
      applies_to: "tobacco and non-tobacco formulation"
      requirement: "Account for every uniquely identified ingredient, additive and component by quantity; do not replace the bill of materials with confidential or aggregated totals."
      evidence: "controlled formula, component list, supplier certificates and batch issue records; us-fda-iqos-tpl-2019"
    - id: dq_mass_balance
      applies_to: "tobacco preparation, assembly and packaging"
      requirement: "Reconcile inputs to product, rework, wastes, emissions and inventory changes for each process and the reporting period."
      evidence: "signed mass-balance worksheet and investigation of discrepancies"
    - id: dq_temporal_coverage
      applies_to: "all foreground data"
      requirement: "Cover the full reference year or complete campaign, including start-up, shutdown, cleaning, rejects and seasonal storage loads."
      evidence: "meter-coverage report and production calendar"
    - id: dq_route_disclosure
      applies_to: "all conditional processes and flows"
      requirement: "State whether reconstitution, steam, natural gas, each component, R-410A and on-site treatment apply; absent rows require a documented not-applicable reason."
      evidence: "process map, equipment list, product architecture and wastewater route"
    - id: dq_source_separation
      applies_to: "UUID identity and quantitative evidence"
      requirement: "Keep Tiangong UUID identity separate from external process evidence and from foreground quantities."
      evidence: "UUID direct-read record, source table and collection records"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference flow"
    rule: "Fail if the product does not physically contain tobacco or reconstituted tobacco, is intended for combustion, is a nicotine-only or tobacco-free product, or includes reusable device mass without a separate model."
    source_ids:
      - un-cpc-3-2025
      - wco-hs-2022-chapter-24
      - us-fda-iqos-tpl-2019
  - rule_id: validate_reference_mass
    applies_to: "reference amount"
    rule: "Fail if net conforming product is not exactly 1,000 kg after normalization or if packaging mass is included in the reference amount."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "all inventory rows"
    rule: "Fail if electricity, steam, natural gas, water, ingredients, components, packaging, wastes, refrigerants or emissions are combined into collection rows rather than individual exchanges."
    source_ids:
      - eu-pef-2021
      - us-epa-tobacco-processing-2006
  - rule_id: validate_route_completeness
    applies_to: "process map"
    rule: "Fail if forming and assembly or packaging and release are absent; require a documented applicability decision for tobacco preparation and on-site wastewater treatment."
    source_ids:
      - us-fda-iqos-tpl-2019
      - us-epa-tobacco-processing-2006
  - rule_id: validate_formula_and_mass_balance
    applies_to: "foreground package"
    rule: "Fail if the controlled formulation, atomic component quantities, released mass, rework and wastes do not reconcile or if a discrepancy lacks investigation."
    source_ids:
      - us-fda-iqos-tpl-2019
      - us-epa-tobacco-processing-2006
  - rule_id: validate_allocation
    applies_to: "shared operations and co-products"
    rule: "Fail if allocation is used without documenting why subdivision or system expansion is infeasible, the selected relationship, data period and sensitivity."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_uuid_support
    applies_to: "UUID-bearing reference product"
    rule: "Fail if the product-flow UUID, Mass property UUID, Units of mass UUID or kg reference unit does not resolve consistently."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after independent methodology review and publication"
  downstream_use: "Foreground process datasets for products containing tobacco and factory-gate lifecycle-model projections"
  allowed_use: "Product-specific factory-gate modelling when tobacco presence, non-combustion intended use, formulation, architecture, route, packaging and geography match the dataset metadata"
  excluded_use: "Combustible tobacco products; nicotine-only or tobacco-free products; reusable heating devices; use-stage health or exposure assessment; unsupported comparison between different product architectures"
  required_metadata: "canonical PCR id and version; reference UUID; CPC and HS context; product specification; tobacco form and mass fraction; complete formulation and component list; unit mass and count; route; package configuration; site and geography; reference period; upstream datasets; allocation; waste and treatment routes"
  required_quality_disclosure: "primary-data coverage; meter and scale calibration; formula confidentiality limitations; mass-balance closure; conditional-flow applicability; unresolved UUIDs and ranges; source versions; temporal, geographic and technological representativeness"
  update_trigger: "formulation or component change; manufacturing-route or site change; package redesign; new heating architecture; material meter change; wastewater route change; revised CPC/HS scope; reference UUID change; new reviewed range or emission evidence"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
