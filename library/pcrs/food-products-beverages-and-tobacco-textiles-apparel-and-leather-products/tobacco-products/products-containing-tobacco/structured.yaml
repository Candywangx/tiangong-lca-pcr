  - id: "wco-hs-2022-chapter-24"
    type: "standard"
    reference: "World Customs Organization. *Harmonized System Nomenclature 2022, Chapter 24*, heading 24.04 and subheading 2404.11. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0424_2022e.pdf?la=en (accessed 2026-08-20)."
    used_for: "Tobacco-containing, inhalation-without-combustion product scope and exclusions"
  - id: "us-fda-iqos-tpl-2019"
