measurement_rules:
  - id: reference_mass
    applies_to: "net conforming finished product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize every foreground exchange to exactly 1,000 kg net conforming product. Keep primary, secondary and tertiary packaging outside the reference amount and inventory each component separately."
  - id: unit_count_to_mass
    applies_to: "production and packing records recorded by unit count"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert count to net product mass using product-specific measured mean unit mass and retained sample records; preserve count, sampling plan, measured mass and conversion calculation."
  - id: ingredient_mass
    applies_to: "tobacco, humectants, binders, fibres, additives and adhesives"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record each physically distinct ingredient as its own exchange from calibrated issue or batch records; do not aggregate ingredients into a recipe total."
  - id: component_mass
    applies_to: "tubes, filters, wraps, papers and packaging components"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record issued and returned mass separately for each component; use count-to-mass conversion only with component-specific measured mass."
  - id: energy_separation
    applies_to: "electricity, purchased steam and natural gas"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Keep electricity, purchased steam and each combusted fuel as separate exchanges; preserve meter basis, heating-value basis and conversion factors."
  - id: water_separation
    applies_to: "formulation, process conditioning, equipment washing and treatment"
    required_property_ref:
      name: "Volume or Mass"
      uuid: ""
    required_unit: "m3 or kg"
    rule: "Record water separately by use role and process; do not combine water incorporated into product with cleaning or treatment water."
  - id: wastewater_load
    applies_to: "each direct discharge indicator"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Calculate each pollutant load separately from matched discharge volume and concentration records; retain sampling time, treatment boundary and receiving compartment."
