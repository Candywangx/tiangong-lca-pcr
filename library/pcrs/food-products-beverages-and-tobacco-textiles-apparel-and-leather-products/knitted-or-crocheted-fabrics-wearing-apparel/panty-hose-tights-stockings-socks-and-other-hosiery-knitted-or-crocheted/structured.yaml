system_boundary:
  rules:
    - rule_id: boundary_required_foreground
      applies_to: "Hosiery manufacturing"
      rule: "Include knitting or crocheting, toe closing or seaming and assembly, inspection, pairing, labelling, packaging, and manufacturing wastes for the declared route."
      source_ids:
        - epd-international-pcr-2024-03-apparel
    - rule_id: boundary_conditional_operations
      applies_to: "Wet finishing, boarding, and treatment"
      rule: "Include dyeing, washing, bleaching, finishing, drying, boarding, on-site steam or heat generation, direct emissions, and wastewater treatment whenever performed under foreground control; otherwise connect representative upstream or service datasets and prevent double counting."
      source_ids:
        - epd-international-pcr-2024-03-apparel
    - rule_id: boundary_upstream_traceability
      applies_to: "Purchased materials and services"
      rule: "Do not treat yarn, thread, chemicals, packaging, electricity, steam, transport, or off-site treatment as burden-free; link each material exchange to a representative upstream dataset or disclose a data gap."
      source_ids:
        - epd-international-pcr-2024-03-apparel
        - ec-pef-method-2021-2279
    - rule_id: boundary_inventory_completeness
      applies_to: "Product system"
      rule: "Account for at least 99% of product-content mass and energy use and assess exclusions for environmental relevance; document each cut-off and the evidence used to verify it."
      source_ids:
        - epd-international-pcr-2024-03-apparel
    - rule_id: boundary_downstream_separation
      applies_to: "Dataset use"
      rule: "Keep distribution, retail, consumer care, reuse, and end-of-life outside this manufacturing foreground dataset while preserving metadata required to connect those stages in a lifecycle model."
      source_ids:
        - epd-international-pcr-2024-03-apparel
        - ec-pef-method-2021-2279
    - rule_id: boundary_atomic_exchange
      applies_to: "Inventory construction"
      rule: "Represent each yarn, chemical, utility, packaging component, waste stream, and elementary emission as a separate exchange; do not use collection labels or selector instructions as flows."
      source_ids:
        - mass-balance-identity
