allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Shared operations and meters"
    rule: "First subdivide by process, line, batch, product, and reporting period and collect direct foreground data. Do not allocate directly measured amounts."
    source_ids:
      - epd-international-pcr-2024-03-apparel
      - ec-pef-method-2021-2279
  - rule_id: allocation_physical
    applies_to: "Residual shared utilities or services"
    rule: "If subdivision is not feasible, allocate only the residual shared amount using a documented physical causal driver such as machine time, metered demand, treated volume, or mass throughput; reconcile allocated totals to the source record."
    source_ids:
      - epd-international-pcr-2024-03-apparel
      - ec-pef-method-2021-2279
  - rule_id: allocation_economic_fallback
    applies_to: "Multi-output process without a defensible physical relationship"
    rule: "Use reporting-period economic allocation only as a documented fallback, retain price and quantity evidence, and test sensitivity to price variation."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: allocation_pairing_and_rework
    applies_to: "Pairing rejects, rework, and replacement articles"
    rule: "Assign rework inputs and losses to the product order that caused them when traceable; otherwise use a production-volume-weighted driver within the same hosiery type, size, composition, and period."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_waste_status
    applies_to: "Yarn waste, off-spec hosiery, packaging waste, and sludge"
    rule: "Keep waste-treatment burdens with the generating product until documented end-of-waste criteria are met. A sale, recycling collection, or intended recovery alone does not establish a co-product credit."
    source_ids:
      - epd-international-pcr-2024-03-apparel
dataset_production:
  collection_protocols:
    - protocol_id: cp_yarn_material_balance
      process_id: "hosiery_knitting"
      flow_role: "each yarn input"
      record_type: "bills of materials, receipts, cone issues and returns, stock counts, supplier specifications"
      raw_fields: "product id; yarn id; polymer or fibre; count; construction; colour; recycled content; opening stock; receipts; issues; returns; closing stock; mass"
      collection_method: "calibrated scales and inventory reconciliation by yarn identity"
      unit: "kg"
      frequency: "per lot and work order; monthly stock close"
      temporal_coverage: "same representative period as knitting output"
      site_scope: "every knitting site and outsourced operation under control"
      aggregation_rule: "opening + receipts - returns - closing, assigned through traceable work orders"
      quality_evidence: "scale calibration; supplier specification; stock reconciliation; variance log"
    - protocol_id: cp_knitting_output_waste
      process_id: "hosiery_knitting"
      flow_role: "accepted bodies and each yarn-specific waste"
      record_type: "machine, work-order, acceptance, reject, and waste records"
      raw_fields: "machine; product; yarn lot; input mass; accepted body mass; waste mass by material; stock change"
      collection_method: "calibrated scales and machine-order reconciliation"
      unit: "kg"
      frequency: "per work order or shift"
      temporal_coverage: "representative production period"
      site_scope: "every knitting line in scope"
      aggregation_rule: "reconcile yarn inputs to accepted bodies, material-specific wastes, and stock change"
      quality_evidence: "scale calibration; signed order close; material-balance residual"
    - protocol_id: cp_assembly_records
      process_id: "toe_closing_assembly"
      flow_role: "knitted body, sewing thread, accepted assembly, and off-cuts"
      record_type: "transfer, issue, work-order, output, and reject records"
      raw_fields: "product; size; input mass; thread issue and return; accepted mass; waste mass; rework"
      collection_method: "calibrated scales and work-order records"
      unit: "kg; count"
      frequency: "per work order"
      temporal_coverage: "same period as knitting and product output"
      site_scope: "every assembly line in scope"
      aggregation_rule: "reconcile input, thread, accepted output, waste, rework, and stock change"
      quality_evidence: "scale calibration; work-order trace; acceptance record"
    - protocol_id: cp_wet_finishing_records
      process_id: "wet_finishing_boarding"
      flow_role: "hosiery input/output, water, and route condition"
      record_type: "batch sheets, meters, recipes, dryer and boarding logs"
      raw_fields: "batch; product; input and output mass; moisture; water; temperature; time; machine; finish route"
      collection_method: "batch records plus calibrated meters and scales"
      unit: "kg; m3; °C; h"
      frequency: "per batch; monthly reconciliation"
      temporal_coverage: "same period as accepted output"
      site_scope: "every wet-processing, drying, and boarding line in scope"
      aggregation_rule: "aggregate declared batches and normalize to accepted conditioned output"
      quality_evidence: "meter and scale calibration; approved recipe; batch acceptance; water and mass balance"
    - protocol_id: cp_chemical_recipe_records
      process_id: "wet_finishing_boarding"
      flow_role: "each chemical-specific input"
      record_type: "approved recipe, issue, return, stock, and supplier records"
      raw_fields: "chemical identity; CAS; concentration; active content; batch issue; return; opening and closing stock; supplier lot"
      collection_method: "weighed issue and stock reconciliation; active mass calculated only from verified concentration"
      unit: "kg"
      frequency: "per batch; monthly stock close"
      temporal_coverage: "same period as represented wet processing"
      site_scope: "every foreground wet-processing site"
      aggregation_rule: "sum active or delivered mass consistently by chemical; never combine chemicals"
      quality_evidence: "approved recipe; SDS; certificate of analysis; scale calibration; stock reconciliation"
    - protocol_id: cp_energy_records
      process_id: "all_foreground_processes"
      flow_role: "electricity and purchased steam"
      record_type: "meters, invoices, equipment logs, production hours"
      raw_fields: "meter; start and end reading; carrier; quantity; unit; equipment; product order; operating time"
      collection_method: "submetering preferred; residual shared use allocated by documented causal driver"
      unit: "kWh; MJ"
      frequency: "continuous or per shift; monthly reconciliation"
      temporal_coverage: "same period for all core processes"
      site_scope: "each site and relevant line"
      aggregation_rule: "sum metered use; allocate only residual shared use; reconcile to site totals"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet; electricity supply evidence"
    - protocol_id: cp_packaging_records
      process_id: "inspection_packaging"
      flow_role: "each packaging component and packaging waste"
      record_type: "bills of material, issue and return logs, component counts, supplier specifications, waste logs"
      raw_fields: "component id; material; grade; unit mass; recycled content; issue; return; packed count; waste mass"
      collection_method: "verified unit mass and inventory reconciliation by component"
      unit: "kg; count"
      frequency: "per packaging order; monthly close"
      temporal_coverage: "same period as packed output"
      site_scope: "every packing site"
      aggregation_rule: "net issue by component normalized to net accepted product; reconcile packaging waste"
      quality_evidence: "scale calibration; supplier specification; stock and count reconciliation"
    - protocol_id: cp_product_output_records
      process_id: "inspection_packaging"
      flow_role: "inspected, paired, accepted, rejected, and reworked hosiery"
      record_type: "production, inspection, pairing, scale, and release records"
      raw_fields: "product; hosiery type; size; single or pair convention; count; net mass; moisture; accepted; rejected; reworked; release date"
      collection_method: "calibrated scale and quality-system records"
      unit: "count; pair; kg"
      frequency: "per batch or order"
      temporal_coverage: "representative production period"
      site_scope: "all release sites"
      aggregation_rule: "production-volume-weighted aggregation by product and size stratum; packaging excluded"
      quality_evidence: "scale calibration; acceptance criteria; pairing record; release authorization"
    - protocol_id: cp_wastewater_records
      process_id: "wet_finishing_boarding"
      flow_role: "wastewater leaving wet finishing"
      record_type: "discharge meters, sampling and route records"
      raw_fields: "batch; volume; pH; temperature; COD; nitrogen; phosphorus; treatment destination; sampling time"
      collection_method: "calibrated flow meter and documented sampling"
      unit: "m3; concentration units"
      frequency: "continuous volume; sampling at permit or process frequency"
      temporal_coverage: "matched to represented wet-processing batches"
      site_scope: "every discharge point in scope"
      aggregation_rule: "match discharge volume and samples to production periods; disclose unmatched coverage"
      quality_evidence: "meter calibration; laboratory report; chain of custody; route evidence"
    - protocol_id: cp_wastewater_treatment_records
      process_id: "onsite_wastewater_treatment"
      flow_role: "influent, electricity, sodium hydroxide, effluent emissions, and sludge"
      record_type: "influent and effluent meters, laboratory results, chemical records, sludge tickets"
      raw_fields: "volume; concentration; chemical solution mass and concentration; electricity; sludge wet mass and dry matter; discharge compartment"
      collection_method: "calibrated meters, laboratory testing, dosing records, and weighbridge tickets"
      unit: "m3; kg; kWh"
      frequency: "continuous volume; permit sampling; per sludge movement"
      temporal_coverage: "same period as wet-processing production"
      site_scope: "every on-site treatment unit"
      aggregation_rule: "water and pollutant balance over matched periods; normalize to treated volume and reference product"
      quality_evidence: "meter calibration; laboratory QA; permit record; dosing reconciliation; sludge disposition"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every foreground amount"
      rule: "normalized amount = reporting-period attributable amount / reporting-period net accepted finished-hosiery mass"
      inputs:
        - "amount by atomic flow"
        - "net accepted product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_material_consumption
      applies_to: "Each yarn, sewing thread, chemical, and packaging component"
      rule: "consumed mass = opening stock + receipts - supplier returns - closing stock; reconcile work-order issues and unexplained variance"
      inputs:
        - "stock and transaction records"
      output: "consumed kg by atomic material identity"
      source_ids:
        - mass-balance-identity
    - id: calc_item_pair_mass
      applies_to: "Count-only output records"
      rule: "net product mass = accepted count or pair count multiplied by measured mean net mass for the same product and size stratum"
      inputs:
        - count
        - "pairing convention"
        - "sample masses"
        - "production weights"
      output: "kg net accepted finished hosiery"
      source_ids:
        - mass-balance-identity
    - id: calc_process_mass_balance
      applies_to: "Knitting, assembly, wet finishing, and packaging"
      rule: "residual = inputs + opening work in process - accepted outputs - measured wastes - closing work in process; report moisture or finish add-on separately"
      inputs:
        - "measured mass records by atomic flow"
      output: "process residual and reconciliation statement"
      source_ids:
        - mass-balance-identity
    - id: calc_active_chemical_mass
      applies_to: "Delivered chemical solutions"
      rule: "active chemical mass = delivered solution mass multiplied by verified mass fraction; retain delivered solution amount separately"
      inputs:
        - "delivered mass"
        - "certificate concentration"
      output: "kg active chemical"
