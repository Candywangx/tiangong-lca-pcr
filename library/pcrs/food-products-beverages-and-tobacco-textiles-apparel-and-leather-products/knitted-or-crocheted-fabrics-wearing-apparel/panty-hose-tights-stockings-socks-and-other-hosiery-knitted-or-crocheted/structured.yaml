measurement_rules:
  - id: reference_product_mass
    applies_to: "Reference product and all normalized results"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure net accepted hosiery after final conditioning and before packaging. Normalize every foreground amount to exactly 1 kg net accepted finished hosiery."
  - id: pair_and_item_conversion
    applies_to: "Records expressed as single articles, pairs, dozens, or packs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert counts using measured net mass for the same product, size stratum, pair convention, and reporting period; retain sample size, weighing method, mean, and variability."
  - id: packaging_mass_separation
    applies_to: "Consumer and distribution packaging"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure packaging separately by material and do not include it in the 1 kg reference product."
  - id: composition_mass_closure
    applies_to: "Fibre, yarn, sewing thread, elastic component, finish add-on, and product declarations"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg and mass %"
    rule: "Use one consistent conditioned mass basis and reconcile declared constituent masses to net accepted product mass, with moisture and finish add-on stated."
