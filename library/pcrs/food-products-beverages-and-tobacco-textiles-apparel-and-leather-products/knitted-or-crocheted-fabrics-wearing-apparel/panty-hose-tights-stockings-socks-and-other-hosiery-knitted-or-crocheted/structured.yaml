    - id: dq_upstream_representativeness
      applies_to: "Yarns, chemicals, packaging, energy, transport, and treatment datasets"
      requirement: "Assess fibre or polymer, technology, geography, time, recycled content, and boundary fit; prefer supplier-specific data for main inputs and disclose generic and proxy shares."
      evidence: "supplier datasets; representativeness assessment; sensitivity analysis; epd-international-pcr-2024-03-apparel"
    - id: dq_completeness
