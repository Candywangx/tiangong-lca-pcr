validation_rules:
  - rule_id: validate_identity
    applies_to: "Product identity"
    rule: "Fail if CPC 28210 context, hosiery type, knit or crochet construction, fibre composition, size basis, single or pair convention, net mass, colour or finish, route, site, or reporting period is missing."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: validate_reference_flow
    applies_to: "Quantitative reference"
    rule: "Fail unless the normalized output is exactly 1 kg net accepted finished hosiery using Product flow c00d32b4-7e02-479b-8cae-d94b50ed1a7a, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_pair_item_conversion
    applies_to: "Count-based records"
    rule: "Fail if item, pair, dozen, or pack records are converted without a measured product- and size-specific net mass and declared pairing convention."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_packaging_separation
    applies_to: "Packaging"
    rule: "Fail if packaging mass is included in reference-product mass or if corrugated board, polyethylene film, paper labels, and any other packaging materials are not reported separately."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: validate_required_processes
    applies_to: "Process coverage"
    rule: "Fail if knitting or crocheting, toe closing or assembly, or inspection, pairing, labelling, and packaging is absent; require documented applicability decisions for wet finishing, boarding, and on-site wastewater treatment."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: validate_atomic_flows
    applies_to: "Inventory rows"
    rule: "Fail any row whose selected flow is a plural collection, a material or utility selector, or a combined waste or emission stream; every chemical and emission shall retain a specific identity and compartment."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_material_balance
    applies_to: "Mass-based processes"
    rule: "Fail if inputs, accepted outputs, wastes, rework, moisture or finish add-on, and stock changes do not reconcile within documented measurement uncertainty or if residuals are hidden by normalization."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_energy_water_chemicals
    applies_to: "Core utilities and wet-processing recipes"
    rule: "Fail if an included operation lacks foreground energy records, if water is unmetered without a documented reconciliation, or if recipe chemicals are aggregated rather than reported by chemical identity and active concentration."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: validate_wastewater_emissions
    applies_to: "Wet processing and on-site treatment"
    rule: "Fail if wastewater route, matched volume, sampling coverage, sludge destination, or applicable atomic pollutant loads are omitted or if incompatible environmental compartments are combined."
    source_ids:
      - epd-international-pcr-2024-03-apparel
      - ec-pef-method-2021-2279
  - rule_id: validate_completeness
    applies_to: "Product system"
    rule: "Fail if the dataset cannot demonstrate 99% product-content mass and energy coverage or does not document and assess cut-offs."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: validate_allocation
    applies_to: "Shared processes"
    rule: "Fail if allocation bypasses subdivision without justification, lacks a defensible physical relationship, or uses economic allocation without reporting-period values and sensitivity analysis."
    source_ids:
      - epd-international-pcr-2024-03-apparel
      - ec-pef-method-2021-2279
  - rule_id: validate_upstream_links
    applies_to: "Purchased inputs and services"
    rule: "Fail if yarns, main chemicals, packaging, energy, transport, or off-site treatment are burden-free or connected to an unassessed generic or proxy dataset."
    source_ids:
      - epd-international-pcr-2024-03-apparel
      - ec-pef-method-2021-2279
  - rule_id: validate_uuid_evidence
    applies_to: "UUID-bearing references"
    rule: "Fail any inventory UUID that lacks both a relevant hybrid-search result and a direct public state_code=100 identity read; unresolved rows shall keep their UUID absent and remain disclosed by row_id."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_data_quality_disclosure
    applies_to: "Published foreground dataset"
    rule: "Fail if reporting period, geography, technology, supplier-specific or generic status, measurement methods, allocation, cut-offs, uncertainty, and unresolved identity references are not disclosed."
    source_ids:
      - epd-international-pcr-2024-03-apparel
      - ec-pef-method-2021-2279
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for finished knitted or crocheted panty hose, tights, stockings, socks, and other hosiery"
  downstream_use: "secondary_dataset; background_dataset for product systems requiring a hosiery-manufacturing stage; source for downstream process and lifecyclemodel projections"
  allowed_use: "Hosiery-manufacturing LCI, supplier-specific or representative production modelling, hotspot analysis, and connection to separately modelled upstream yarn and downstream distribution, use, and end-of-life stages"
  excluded_use: "Claiming a complete cradle-to-grave hosiery result without connected upstream and downstream stages; comparison across products with different function, compression or support, lifetime, pairing loss, size basis, composition, or care scenario without functional equivalence; use as a yarn-production dataset"
  required_metadata: "PCR id and version state; product and flow identity; hosiery and pairing convention; composition; yarn and knit construction; size basis; net unit and pair mass; colour, finish, and claimed performance; included route; site and geography; reporting period; verified reference UUIDs; upstream dataset identities; allocation; cut-offs; data sources"
  required_quality_disclosure: "specific, selected-generic, and proxy data shares; measurement and sampling methods; temporal, geographical, and technological representativeness; material and energy closure; chemical identity; wastewater and waste routes; assumptions; uncertainty; sensitivity; unresolved UUIDs; absence of default quantitative ranges"
  update_trigger: "Change in product construction, composition, yarn supplier, knitting technology, site, energy supply, dye or finish recipe, boarding route, packaging, wastewater or waste treatment, allocation, or data period that materially changes an inventory amount or declared result; correction of errors or stale upstream datasets"
