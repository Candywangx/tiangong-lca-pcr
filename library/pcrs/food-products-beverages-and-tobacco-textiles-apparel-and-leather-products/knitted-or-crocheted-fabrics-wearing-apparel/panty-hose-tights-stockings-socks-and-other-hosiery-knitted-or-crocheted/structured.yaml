    used_for: "Explicit inclusion of CPC 2821 hosiery; functional-use qualifiers; upstream, core, and downstream process coverage; manufacturing, quality control, packaging, waste and wastewater treatment; 99% completeness; allocation hierarchy; site-specific core data and disclosure requirements"
