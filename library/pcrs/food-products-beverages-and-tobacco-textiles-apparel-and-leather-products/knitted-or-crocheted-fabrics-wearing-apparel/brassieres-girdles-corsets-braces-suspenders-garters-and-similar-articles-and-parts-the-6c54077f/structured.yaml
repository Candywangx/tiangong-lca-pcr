measurement_rules:
  - id: reference_mass
    applies_to: "finished reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all inventory results to 1 kg of accepted finished product at the factory gate; exclude packaging mass from the reference-product mass and record packaging in separate rows."
  - id: item_to_mass_conversion
    applies_to: "production or purchasing records stated per item"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert item counts to mass using measured net product mass for the declared reference size and product specification; retain item count, measured sample size, mean mass, and conversion calculation."
  - id: bom_mass_basis
    applies_to: "finished product bill of materials"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record component masses on a dry or as-received basis consistently, disclose the basis, and reconcile at least 95% by weight of the product BOM, including all main fabrics, lining, padding, metals, and declared hardware."
  - id: energy_unit_conversion
    applies_to: "electricity and thermal-energy records"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh and MJ"
    rule: "Preserve measured billing or meter units, report conversion factors, and convert only for aggregation; do not combine electricity, steam, hot water, natural gas, diesel, or LPG into one inventory exchange."
