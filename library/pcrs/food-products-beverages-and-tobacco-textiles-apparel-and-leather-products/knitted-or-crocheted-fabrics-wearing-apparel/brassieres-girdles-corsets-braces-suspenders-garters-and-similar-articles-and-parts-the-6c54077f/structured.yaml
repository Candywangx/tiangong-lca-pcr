      raw_fields: "pollutant_name; measured_concentration; exhaust_volume; fuel_quantity; factor_value; factor_source; equipment_id"
      collection_method: "use stack measurements when available; otherwise apply a disclosed approved factor to each measured fuel"
      unit: "kg"
      frequency: "each test and reporting period"
      temporal_coverage: "representative annual period"
      site_scope: "each included combustion source"
      aggregation_rule: "calculate each pollutant separately, allocate causally, and normalize by accepted output mass"
