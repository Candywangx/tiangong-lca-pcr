allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared_foreground_processes"
    rule: "Use product-line or process sub-metering and subdivision before allocation whenever records distinguish the declared product."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_assembly_unit
    applies_to: "shared_cutting_sewing_and_assembly"
    rule: "When subdivision is not possible, allocate shared assembly and sewing records by accepted production units for materially comparable articles, then convert allocated amounts to the 1 kg reference flow using measured unit mass; use another causal physical driver only when justified and disclosed."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_energy_mix
    applies_to: "multiple_sites_or_energy_sources"
    rule: "Build a production-weighted electricity mix for multiple sites and retain each consumed electricity mix in proportion to total measured kWh; do not assign a preferred mix to one product without physical metering or equivalent verified records."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_rework_and_waste
    applies_to: "rework_scrap_and_rejected_product"
    rule: "Return successful rework to the originating process without counting a second finished output; assign measured waste handling to the process that generated the waste and disclose any recycling credit method used downstream."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_no_unrecorded_coproduct
    applies_to: "saleable_by_products"
    rule: "Report every saleable by-product explicitly; if a true multifunctional output exists, document subdivision first and obtain methodology review before applying a non-physical allocation."
    source_ids:
      - afw-pefcr-v3-1-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "cutting_component_preparation"
      flow_role: "issued body fabrics, lace, foam, and adhesive film"
      record_type: "BOM, purchase specification, issue and return record"
      raw_fields: "product_id; batch_id; material_id; composition; construction; issued_mass; returned_mass; moisture_basis"
      collection_method: "reconcile production-order issues and returns with the product BOM"
      unit: "kg"
      frequency: "each production order"
      temporal_coverage: "representative annual period and declared batch"
      site_scope: "every included assembly site"
      aggregation_rule: "sum net issued mass by atomic material row and divide by accepted finished-product mass"
      quality_evidence: "signed BOM revision; calibrated scale record; supplier specification; stock reconciliation"
    - protocol_id: cp_cutting_energy
      process_id: "cutting_component_preparation"
      flow_role: "electricity and compressed air"
      record_type: "sub-meter, main meter, runtime, and equipment specification"
      raw_fields: "meter_start; meter_end; equipment_id; runtime; verified_flow_rate; allocated_output"
      collection_method: "direct meter reading; for compressed air only, runtime multiplied by verified flow rate when no flow meter exists"
      unit: "kWh; m3"
      frequency: "each batch or meter period"
      temporal_coverage: "representative annual period"
      site_scope: "each included cutting area"
      aggregation_rule: "apply documented causal allocation, then divide by accepted output mass"
      quality_evidence: "meter calibration; equipment specification; allocation worksheet"
    - protocol_id: cp_cutting_waste
      process_id: "cutting_component_preparation"
      flow_role: "composition-specific cutting waste"
      record_type: "waste-bin and shipment record"
      raw_fields: "material_composition; batch_id; gross_mass; tare_mass; destination; treatment_route"
      collection_method: "weigh segregated waste at transfer from process or shipment"
      unit: "kg"
      frequency: "each batch or waste shipment"
      temporal_coverage: "representative annual period"
      site_scope: "each included cutting area"
      aggregation_rule: "sum net waste mass by composition and destination"
      quality_evidence: "scale calibration; waste transfer note; segregation audit"
    - protocol_id: cp_sewing_materials
      process_id: "sewing_hardware_assembly"
      flow_role: "thread, elastic, underwire, fastener, ring, and slider"
      record_type: "BOM, issue record, item count, and component mass sample"
      raw_fields: "component_id; composition; issued_mass; item_count; sample_count; sample_mass; returned_mass"
      collection_method: "weigh bulk material or convert counted components using verified mean component mass"
      unit: "kg; item"
      frequency: "each production order"
      temporal_coverage: "representative annual period"
      site_scope: "each included assembly line"
      aggregation_rule: "sum net component mass by atomic row"
      quality_evidence: "BOM revision; scale calibration; component specification; count reconciliation"
    - protocol_id: cp_sewing_energy
      process_id: "sewing_hardware_assembly"
      flow_role: "sewing and hardware-attachment electricity"
      record_type: "sub-meter or allocated main-meter record"
      raw_fields: "meter_start; meter_end; line_id; operating_time; accepted_units; accepted_mass"
      collection_method: "direct meter reading or documented allocation from a shared meter"
      unit: "kWh"
      frequency: "each batch or meter period"
      temporal_coverage: "representative annual period"
      site_scope: "each included assembly line"
      aggregation_rule: "allocate by accepted units for comparable articles and normalize by accepted mass"
      quality_evidence: "meter calibration; production report; allocation worksheet"
    - protocol_id: cp_hardware_scrap
      process_id: "sewing_hardware_assembly"
      flow_role: "segregated steel hardware scrap"
      record_type: "scrap-bin and shipment record"
      raw_fields: "batch_id; gross_mass; tare_mass; material_grade; destination"
      collection_method: "weigh segregated clean steel hardware scrap"
      unit: "kg"
      frequency: "each shipment"
      temporal_coverage: "representative annual period"
      site_scope: "each included assembly site"
      aggregation_rule: "sum net scrap mass and divide by accepted output mass"
      quality_evidence: "scale calibration; waste transfer note; grade declaration"
    - protocol_id: cp_wet_inputs
      process_id: "wet_finishing"
      flow_role: "process water and named wet chemicals"
      record_type: "water meter, recipe, dosing, and stock records"
      raw_fields: "recipe_id; chemical_name; concentration; dose_mass; water_meter_start; water_meter_end; batch_mass"
      collection_method: "meter water and reconcile each named chemical dose with stock movement"
      unit: "kg"
      frequency: "each wet-finishing batch"
      temporal_coverage: "representative annual period"
      site_scope: "each included wet-finishing line"
      aggregation_rule: "sum each atomic input separately and normalize by accepted output mass"
      quality_evidence: "meter calibration; recipe approval; safety data sheet; stock reconciliation"
    - protocol_id: cp_wet_energy
      process_id: "wet_finishing"
      flow_role: "electricity, purchased steam, and purchased hot water"
      record_type: "utility meters and invoices"
      raw_fields: "utility_type; meter_start; meter_end; steam_mass; pressure; hot_water_mass; inlet_temperature; supplier"
      collection_method: "direct utility meter or supplier record; convert steam or hot water to energy with recorded conditions"
      unit: "kWh; MJ"
      frequency: "each batch or billing period"
      temporal_coverage: "representative annual period"
      site_scope: "each included wet-finishing line or site"
      aggregation_rule: "retain each utility separately, allocate causally, and normalize by accepted output mass"
      quality_evidence: "meter calibration; invoice; conversion worksheet"
    - protocol_id: cp_wet_outputs
      process_id: "wet_finishing"
      flow_role: "wastewater and sludge"
      record_type: "effluent meter, treatment log, and waste shipment record"
      raw_fields: "discharge_volume; density; sampling_time; treatment_boundary; sludge_wet_mass; solids_content; destination"
      collection_method: "meter effluent and weigh sludge at the declared boundary"
      unit: "kg"
      frequency: "each batch or discharge period"
      temporal_coverage: "representative annual period"
      site_scope: "each included treatment boundary"
      aggregation_rule: "sum wastewater and sludge separately and normalize by accepted output mass"
      quality_evidence: "meter calibration; laboratory record; treatment log; transfer note"
    - protocol_id: cp_packaging_inputs
      process_id: "inspection_packaging"
      flow_role: "carton, LDPE bag, and paper hangtag"
      record_type: "packaging BOM, issue record, item count, and mass sample"
      raw_fields: "packaging_id; material; item_count; sample_count; sample_mass; issued_mass; returned_mass"
      collection_method: "weigh bulk packaging or convert item counts with verified mean item mass"
      unit: "kg; item"
      frequency: "each packing order"
      temporal_coverage: "representative annual period"
      site_scope: "each included packing site"
      aggregation_rule: "sum each packaging material separately and normalize by accepted product mass"
      quality_evidence: "packaging specification; scale calibration; stock reconciliation"
    - protocol_id: cp_packaging_energy
      process_id: "inspection_packaging"
      flow_role: "final inspection, pressing, and packing electricity"
      record_type: "sub-meter or allocated main-meter record"
      raw_fields: "meter_start; meter_end; area_id; accepted_units; accepted_mass"
      collection_method: "direct meter reading or documented shared-meter allocation"
      unit: "kWh"
      frequency: "each batch or meter period"
      temporal_coverage: "representative annual period"
      site_scope: "each included final-processing area"
      aggregation_rule: "allocate by accepted units for comparable articles and normalize by accepted mass"
      quality_evidence: "meter calibration; production report; allocation worksheet"
    - protocol_id: cp_packaging_waste
      process_id: "inspection_packaging"
      flow_role: "paperboard waste, LDPE film waste, and rejected product"
      record_type: "inspection disposition and waste transfer record"
      raw_fields: "waste_id; material; gross_mass; tare_mass; reject_reason; rework_status; destination"
      collection_method: "weigh each segregated waste and exclude successfully reworked products"
      unit: "kg"
      frequency: "each batch or shipment"
      temporal_coverage: "representative annual period"
      site_scope: "each included packing site"
      aggregation_rule: "sum each atomic waste by destination and divide by accepted output mass"
      quality_evidence: "scale calibration; final-inspection report; transfer note"
    - protocol_id: cp_facility_fuels
      process_id: "facility_utilities"
