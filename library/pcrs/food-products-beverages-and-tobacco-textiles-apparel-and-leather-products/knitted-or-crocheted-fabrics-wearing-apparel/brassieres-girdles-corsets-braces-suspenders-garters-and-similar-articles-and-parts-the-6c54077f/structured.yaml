    role: "Foreground sewing, elastic application, closure attachment, and article assembly"
    quantitative_reference: "Per 1 kg accepted finished reference product"
  - id: wet_finishing
    name: "Garment wet finishing"
    inclusion: "conditional"
    inclusion_condition: "Included only when washing, bleaching, dyeing, rinsing, or chemical finishing occurs at the reporting facility."
