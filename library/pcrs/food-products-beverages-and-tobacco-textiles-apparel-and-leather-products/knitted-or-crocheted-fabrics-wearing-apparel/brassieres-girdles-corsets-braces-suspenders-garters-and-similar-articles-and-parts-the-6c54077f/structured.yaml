    - protocol_id: cp_final_product_mass
      process_id: "inspection_packaging"
      flow_role: "accepted finished reference product"
      record_type: "final inspection, count, and mass record"
      raw_fields: "product_id; specification_revision; reference_size; accepted_count; sample_count; net_sample_mass; accepted_net_mass"
      collection_method: "weigh accepted output net of packaging or convert count using verified mean net mass"
      unit: "kg"
      frequency: "each production batch"
      temporal_coverage: "representative annual period"
      site_scope: "every included final inspection point"
      aggregation_rule: "sum accepted net product mass by specification"
      quality_evidence: "calibrated scale; inspection release; count reconciliation"
  calculation_rules:
    - id: calc_net_material_input
      applies_to: "BOM and component rows"
      rule: "net material input = issued mass - verified return to stock"
      inputs:
        - "issued mass"
        - "returned mass"
      output: "kg atomic material input per kg accepted product"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_item_component_mass
      applies_to: "counted hardware and packaging"
      rule: "component mass = item count x measured mean mass of the exact specified item"
      inputs:
        - "item count"
        - "sample count"
        - "sample mass"
      output: "kg named component per kg accepted product"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_assembly_loss
      applies_to: "cutting, component, and rejected-product losses"
      rule: "assembly loss mass = BOM input mass - accepted product mass - documented returned material - separately reconciled retained work in progress; report each waste composition and destination separately"
      inputs:
        - "BOM inputs"
        - "accepted mass"
        - returns
        - "work in progress"
        - "measured wastes"
      output: "kg loss and loss fraction by atomic waste row"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_energy_normalization
      applies_to: "electricity and thermal utilities"
      rule: "normalized energy = measured or causally allocated process energy / accepted net product mass"
      inputs:
        - "meter delta"
        - "allocation driver"
        - "accepted mass"
      output: "kWh or MJ per kg accepted product"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_direct_combustion_emission
      applies_to: "named direct combustion emissions"
      rule: "emission = measured fuel quantity x disclosed factor, unless a representative stack measurement is used; calculate each fuel and pollutant independently"
      inputs:
        - "measured fuel"
        - "net calorific value when required"
        - "factor or stack result"
      output: "kg named pollutant per kg accepted product"
      source_ids: []
    - id: calc_refrigerant_loss
      applies_to: "HFC-134a emission"
      rule: "loss = opening stock + purchases - closing stock - documented contained inventory increase - recovered mass; reconcile result to equipment service records"
      inputs:
        - "opening and closing stock"
        - purchases
        - charges
        - recovery
        - "equipment inventory"
      output: "kg HFC-134a emitted per kg accepted product"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "complete foreground system"
      rule: "reconcile named material and packaging inputs with accepted product, returned materials, work in progress, composition-specific wastes, wastewater constituents when quantified, and stock changes; explain every residual above the declared measurement uncertainty"
      inputs:
        - "all mass records and stock changes"
      output: "batch mass-balance statement and residual"
      source_ids:
        - afw-pefcr-v3-1-2025
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and BOM"
      requirement: "Use the exact CPC 28237 Product flow for accepted output and retain a product specification that distinguishes article type, size or fit, composition, construction, padding, underwire, closure, finish, and packaging state."
      evidence: "state-100 Tiangong identity; approved product specification; BOM revision"
    - id: dq_bom_coverage
      applies_to: "material inputs"
      requirement: "Cover at least 95% of the BOM by product weight and 100% of main fabrics, lining, padding, electronic parts if any, and metals; explain the uncovered share."
      evidence: "BOM coverage calculation and supplier specifications"
    - id: dq_measurement
      applies_to: "foreground amounts"
      requirement: "Use calibrated meters or scales appropriate to the measured quantity; retain raw readings, unit conversions, sampling basis, and uncertainty or tolerance."
      evidence: "calibration certificates; raw meter and scale records; conversion worksheet"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use a representative annual administrative period or justify a shorter campaign; identify abnormal shutdown, start-up, rework, and rejected-product periods."
      evidence: "production calendar; utility period; batch list; representativeness assessment"
    - id: dq_completeness
      applies_to: "process and atomic flows"
      requirement: "Reconcile every included process against the route and record each applicable material, utility, chemical, packaging, waste, and direct emission as its own row; justify every not-applicable row."
      evidence: "route-to-inventory checklist; mass and energy reconciliation; exception log"
    - id: dq_supplier_geography
      applies_to: "upstream datasets"
      requirement: "Match material, utility, fuel, and component datasets to supplier geography and manufacturing technology when known; document any proxy and data-quality consequence."
      evidence: "supplier declarations; invoices; dataset mapping log"
    - id: dq_uuid_status
      applies_to: "non-reference flow identities"
      requirement: "Keep a UUID blank until hybrid search and a direct state-code-100 read confirm the same atomic identity; review manifest inventory_uuid_review before publication."
      evidence: "dual-verification review record or explicit manifest omission reason"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "Fail if the reference product UUID, CPC 28237 classification, Product flow type, Mass UUID, Units of mass UUID, or kg reference unit differs from this PCR."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_reference_amount
    applies_to: "finished_reference_product"
    rule: "Require exactly 1 kg accepted net finished product; packaging mass must be outside the reference-product mass and present in separate packaging rows when used."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_required_qualifiers
    applies_to: "foreground_data_package"
    rule: "Fail completeness if any applicable required qualifier, product specification revision, reference size, production site, period, or wet-finishing route is missing."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_bom_and_losses
    applies_to: "material_mass_balance"
    rule: "Require at least 95% BOM coverage by weight, all main fabrics/lining/padding/metals, and reconciliation of assembly losses, returns, work in progress, and rejected product."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_atomic_inventory
    applies_to: "process_inventory"
    rule: "Fail if a selected flow combines electricity with thermal energy, more than one fuel, more than one refrigerant, more than one chemical, more than one packaging material, more than one waste identity, or more than one elementary emission."
    source_ids: []
  - rule_id: validate_conditional_routes
    applies_to: "conditional_processes"
    rule: "Require every conditional process and row to be either supported by route records or marked not applicable with evidence; do not infer wet processing, fuel use, or refrigerant leakage from sector averages."
    source_ids:
      - eu-jrc-textiles-bref-2023
      - afw-pefcr-v3-1-2025
  - rule_id: validate_uuid_dual_check
    applies_to: "non_reference_uuid"
    rule: "Fail if a non-reference UUID is populated without both a matching Tiangong hybrid-search result and a direct state-code-100 read for the same atomic flow."
    source_ids: []
  - rule_id: validate_no_invented_quantities
    applies_to: "foreground_amounts"
    rule: "Require foreground records or declared calculations for every amount; fail any uncited default, reasoned estimate, or AI-generated quantitative range."
    source_ids: []
  - rule_id: validate_bilingual_alignment
    applies_to: "localized_markdown"
    rule: "Require the same ordered process ids, row ids, selected flows, UUIDs, amount modes, basis kinds, evidence kinds, rule ids, source ids, and source records in English and Chinese."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for a declared CPC 28237 article or identifiable part"
  downstream_use: "secondary_dataset; background_dataset after review for representative product, geography, technology, period, and data quality"
  allowed_use: "Product-specific process modelling, supply-chain LCA, lifecycle-model construction, product-footprint studies, and comparison only when functional unit, product specification, boundary, geography, technology, allocation, and data quality are equivalent"
  excluded_use: "Consumer-use modelling without a separate use-phase model; medical-device claims; products outside CPC 28237; substitution for upstream textile or component production; unqualified product comparisons; use of candidate UUIDs as confirmed identities"
  required_metadata: "PCR id and version; CPC code; article type; finished article or part; BOM and coverage; material composition; construction; size and fit; padding, underwire, closure, and strap configuration; site and geography; period; route; wet finishing; packaging; allocation; data sources; Tiangong identity status"
  required_quality_disclosure: "Foreground versus upstream data share; meter and scale coverage; BOM coverage; temporal representativeness; supplier geography; allocation methods; mass-balance residual; rejected-product and waste destinations; conditional-row decisions; unresolved UUIDs and dataset proxies"
  update_trigger: "Change in product specification, BOM, reference size, manufacturing route, site, supplier geography, energy system, wet-finishing chemistry, packaging, allocation method, treatment route, reference-flow identity, or evidence that materially changes the dataset"
