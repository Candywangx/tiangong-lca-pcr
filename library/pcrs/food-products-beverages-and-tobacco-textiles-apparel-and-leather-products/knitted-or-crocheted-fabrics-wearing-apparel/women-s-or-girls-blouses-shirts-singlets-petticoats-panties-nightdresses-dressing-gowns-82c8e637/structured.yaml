allocation_rules:
  - rule_id: alloc_01_subdivide_first
    applies_to: "Shared garment-manufacturing operations"
    rule: "Subdivide by site, process, style and batch where records permit; allocate only the residual shared input or output."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_02_cutting_mass
    applies_to: "Shared cutting and material preparation"
    rule: "Allocate shared cutting inputs and losses by measured mass of cut components attributable to each represented style."
    source_ids:
      - afw-pefcr-2025
  - rule_id: alloc_03_assembly_units
    applies_to: "Shared sewing and assembly"
    rule: "Allocate shared assembly inputs by accepted production units when unit records drive the process, then convert each style result to the 1 kg reference using its measured net garment mass."
    source_ids:
      - afw-pefcr-2025
  - rule_id: alloc_04_finishing_mass
    applies_to: "Shared wet processing and finishing"
    rule: "Allocate shared finishing inputs and outputs by measured processed garment mass unless direct batch metering provides subdivision."
    source_ids:
      - afw-pefcr-2025
  - rule_id: alloc_05_waste_and_remnants
    applies_to: "Offcuts, leftovers and rejected garments"
    rule: "Keep wastes and usable returned or sold remnants distinct. Record the chosen treatment or co-product treatment and do not credit avoided production inside this foreground inventory without an explicitly declared downstream method."
    source_ids:
      - afw-pefcr-2025
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_issues
      process_id: "p01_cutting"
      flow_role: "Fabric and interlining inputs"
      record_type: "Stores issues, returns, marker and BOM records"
      raw_fields: "material_id; composition; batch_id; issued_mass; returned_mass; tare; marker_id"
      collection_method: "Reconcile stores issues and returns to marker batches."
      unit: "kg"
      frequency: "Each issue and batch"
      temporal_coverage: "Representative production period, normally 12 consecutive months or a documented campaign"
      site_scope: "Every included cutting site and subcontractor"
      aggregation_rule: "Sum net issued mass by material and batch, then normalize by net conforming output mass."
      quality_evidence: "Signed issue/return records, calibrated scales, BOM and marker trace."
    - protocol_id: cp_trim_issues
      process_id: "p02_assembly"
      flow_role: "Thread and individual trim inputs"
      record_type: "Stores issues, returns, counts and unit-mass tests"
      raw_fields: "trim_id; material; batch_id; issued_count_or_mass; returned_count_or_mass; sampled_unit_mass; tare"
      collection_method: "Weigh bulk material or convert count using documented representative unit mass."
      unit: "kg and count"
      frequency: "Each issue and batch"
      temporal_coverage: "Same period as represented output"
      site_scope: "Every included sewing site and subcontractor"
      aggregation_rule: "Calculate net mass separately for each trim type and normalize by output mass."
      quality_evidence: "BOM, issue/return records, scale calibration and unit-mass sample record."
    - protocol_id: cp_electricity
      process_id: "all_processes"
      flow_role: "Electricity input"
      record_type: "Submeter, utility meter and machine-hour records"
      raw_fields: "meter_id; start_reading; end_reading; period; process; operating_hours; allocation_driver"
      collection_method: "Prefer process submeters; otherwise reconcile site meter and allocate only residual shared use."
      unit: "kWh"
      frequency: "Meter interval or monthly"
      temporal_coverage: "Same period as represented output"
      site_scope: "Every included site"
      aggregation_rule: "Sum process electricity, apply disclosed residual allocation, normalize by output mass."
      quality_evidence: "Meter calibration, invoice reconciliation and allocation worksheet."
    - protocol_id: cp_purchased_steam
      process_id: "p03_wet_processing_p04_final_finishing"
      flow_role: "Purchased steam input"
      record_type: "Supplier meter and invoice records"
      raw_fields: "meter_id; steam_quantity; pressure_or_energy; period; process; allocation_driver"
      collection_method: "Reconcile supplier quantity to process meter or operating record."
      unit: "MJ or supplier unit"
      frequency: "Meter interval or monthly"
      temporal_coverage: "Same period as represented output"
      site_scope: "Every included site using purchased steam"
      aggregation_rule: "Convert with documented supplier factor, allocate residual shared steam, normalize by output mass."
      quality_evidence: "Supplier invoice, meter record and conversion worksheet."
    - protocol_id: cp_batch_material_balance
      process_id: "p01_cutting_p02_assembly"
      flow_role: "Intermediate products and material balance"
      record_type: "Batch transfer, weighing and waste records"
      raw_fields: "batch_id; input_mass; returned_mass; intermediate_output_mass; offcut_mass; scrap_mass; moisture_basis"
      collection_method: "Weigh transfers and reconcile each manufacturing step."
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same period as represented output"
      site_scope: "Every included production line"
      aggregation_rule: "Sum by batch and style; retain unexplained imbalance as a quality finding."
      quality_evidence: "Calibrated scale, signed transfer record and balance worksheet."
    - protocol_id: cp_batch_output_mass
      process_id: "p02_assembly_p04_final_finishing_p05_packaging"
      flow_role: "Garment intermediate and reference outputs"
      record_type: "Batch completion and final inspection records"
      raw_fields: "batch_id; style; accepted_count; rejected_count; net_accepted_mass; moisture_condition; packaging_mass"
      collection_method: "Weigh accepted output after inspection and before detachable packaging."
      unit: "kg and count"
      frequency: "Each batch"
      temporal_coverage: "Same period as represented output"
      site_scope: "Every included finishing and packaging site"
      aggregation_rule: "Sum accepted net garment mass by style; normalize all exchanges to 1 kg."
      quality_evidence: "Scale calibration, inspection release and packaging separation record."
    - protocol_id: cp_wet_batch
      process_id: "p03_wet_processing_p04_final_finishing"
      flow_role: "Wet-processing batch and intermediate garment"
      record_type: "Batch card and equipment log"
      raw_fields: "batch_id; recipe_id; input_mass; output_mass; moisture_basis; start_time; end_time; route"
      collection_method: "Reconcile equipment batch card with input and output weighing."
      unit: "kg"
      frequency: "Each wet batch"
      temporal_coverage: "Same period as represented output"
      site_scope: "Every included wet-processing site or subcontractor"
      aggregation_rule: "Aggregate only batches with the same declared route, then normalize by conforming output."
      quality_evidence: "Signed batch card, recipe reference and scale calibration."
    - protocol_id: cp_water_wastewater
      process_id: "p03_wet_processing"
      flow_role: "Process water and wastewater"
      record_type: "Intake meter, discharge meter and water-balance records"
      raw_fields: "meter_id; intake_volume; reuse_volume; discharge_volume; period; batch_ids"
      collection_method: "Read calibrated meters; use a documented balance only when a discharge meter is unavailable."
      unit: "m3"
      frequency: "Meter interval or batch"
      temporal_coverage: "Same period as represented wet route"
      site_scope: "Every included wet-processing site"
      aggregation_rule: "Sum fresh intake and discharge separately; do not net internal recirculation twice."
      quality_evidence: "Meter calibration and water-balance closure."
    - protocol_id: cp_wet_chemicals
      process_id: "p03_wet_processing"
      flow_role: "Each wet-process chemical input"
      record_type: "Recipe, dispensing and stores records"
      raw_fields: "chemical_id; CAS_or_formula; recipe_id; batch_id; concentration; formulation_mass; active_content"
      collection_method: "Record each purchased formulation or pure chemical from calibrated dosing or reconciled stock use."
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same period as represented wet route"
      site_scope: "Every included wet-processing site"
      aggregation_rule: "Aggregate each chemical separately by route and normalize by conforming output mass."
      quality_evidence: "Approved recipe, SDS, dosing calibration and stock reconciliation."
    - protocol_id: cp_packaging_materials
      process_id: "p05_packaging"
      flow_role: "Each packaging input"
      record_type: "Packaging issue, count, mass and reuse records"
      raw_fields: "material_id; packaging_level; issued_count; returned_count; unit_mass; products_enclosed; reuse_count"
      collection_method: "Weigh packaging or convert count with verified unit mass; retain each material separately."
      unit: "kg and count"
      frequency: "Each packaging batch"
      temporal_coverage: "Same period as represented output"
      site_scope: "Every included packaging site"
      aggregation_rule: "Divide shared packaging by enclosed net garment mass; divide reusable packaging by verified reuse count."
      quality_evidence: "Packaging specification, issue record, unit-mass test and reuse log."
    - protocol_id: cp_solid_waste
      process_id: "all_processes"
      flow_role: "Each solid waste output"
      record_type: "Container weighing and disposition records"
      raw_fields: "waste_id; process; gross_mass; tare; destination; recovery_status; batch_or_period"
      collection_method: "Weigh each chemically or physically distinct waste stream and reconcile disposal or recovery records."
      unit: "kg"
      frequency: "Each container or shipment"
      temporal_coverage: "Same period as represented output"
      site_scope: "Every included site"
      aggregation_rule: "Sum net mass by process and waste identity, then normalize by output mass."
      quality_evidence: "Calibrated scale, waste transfer note and receiver record."
    - protocol_id: cp_direct_emissions
      process_id: "p04_final_finishing"
      flow_role: "Direct particulate emission"
      record_type: "Stack or workplace exhaust monitoring record"
      raw_fields: "source_id; pollutant; sampling_period; flow_rate; concentration; capture_status; production_mass"
      collection_method: "Use measured concentration and flow for the represented operating period; captured material is waste, not an air emission."
      unit: "kg"
      frequency: "Applicable monitoring event"
      temporal_coverage: "Period representative of included equipment and controls"
      site_scope: "Every included emitting source"
      aggregation_rule: "Calculate emitted mass for operating time and normalize by output mass."
      quality_evidence: "Laboratory report, calibration, sampling plan and control-status log."
  calculation_rules:
    - id: calc_01_reference_normalization
      applies_to: "Every inventory exchange"
      rule: "normalized amount = attributable batch amount / net conforming garment output mass."
      inputs:
        - "Attributable exchange quantity"
        - net_accepted_mass.
      output: "Exchange quantity per 1 kg reference garment."
      source_ids:
        - eu-pef-method-2021
    - id: calc_02_material_balance
      applies_to: "Cutting and assembly"
      rule: "net material input = issued mass - returned mass; unexplained difference = net inputs - intermediate outputs - separately recorded wastes - documented usable remnants."
      inputs:
        - "Material issues"
        - returns
        - outputs
        - "wastes and remnants."
      output: "Step balance and unexplained difference."
      source_ids:
        - afw-pefcr-2025
    - id: calc_03_count_to_mass
      applies_to: "Buttons, zippers, labels and packaging"
      rule: "mass = net count × verified representative unit mass; retain sampling method and variation."
      inputs:
        - "Issued and returned count"
        - "unit-mass sample."
      output: "Material mass by atomic exchange."
      source_ids:
        - afw-pefcr-2025
    - id: calc_04_shared_utility
      applies_to: "Shared electricity and steam"
      rule: "attributable utility = metered process quantity + residual shared quantity × disclosed allocation factor."
      inputs:
        - "Process meter"
        - "site meter"
        - "operating driver and allocation factor."
      output: "Process-specific utility quantity."
      source_ids:
        - afw-pefcr-2025
    - id: calc_05_wastewater_balance
      applies_to: "Garment wet processing"
      rule: "discharged wastewater = measured discharge; if unavailable, calculate intake - measured evaporation - measured retained water - measured internal inventory change, without subtracting recirculated water twice."
      inputs:
        - Intake
        - discharge
        - evaporation
        - "retained water"
        - "recirculation and inventory change."
      output: "Wastewater volume and closure result."
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_01_identity_traceability
      applies_to: "Reference product and all materials"
      requirement: "Trace every record to facility, period, style, batch, garment specification, material composition and supplier or upstream dataset."
      evidence: "BOM, batch traveller, supplier record and dataset linkage."
    - id: dq_02_measurement
      applies_to: "Mass, energy and water"
      requirement: "Use calibrated instruments or reconciled invoices; retain raw readings, tare, conversion and uncertainty or resolution."
      evidence: "Calibration certificates, meter readings, invoices and conversion worksheet."
    - id: dq_03_completeness
      applies_to: "All processes and flows"
      requirement: "Include all applicable processes and all atomic inputs, wastes and direct emissions; explain every material-balance gap and every not-applicable card."
      evidence: "Process map, balance report, waste register and applicability checklist."
    - id: dq_04_temporal
      applies_to: "Foreground period"
      requirement: "Prefer 12 consecutive months; a shorter campaign is allowed only when seasonality, style mix and operating conditions are documented."
      evidence: "Production calendar and representativeness justification."
    - id: dq_05_geography_technology
      applies_to: "Sites and subcontractors"
      requirement: "Represent every included manufacturing site and actual technology; production-weight multi-site data and disclose missing subcontractor primary data."
      evidence: "Site list, process description, production weights and data-gap register."
    - id: dq_06_external_dataset_quality
      applies_to: "Upstream datasets"
      requirement: "Record technological, geographical, temporal and precision/quality information for each material, utility, chemical and packaging dataset."
      evidence: "Dataset metadata and DQR record."
validation_rules:
  - rule_id: val_01_reference_identity
    applies_to: "Reference flow"
    rule: "Require UUID 141dafee-dafa-4fef-9d44-e6e23a9fcff2, Product flow type, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids:
      - unsd-cpc-v3-2025
  - rule_id: val_02_scope
    applies_to: "Product identity"
    rule: "Confirm the garment is made from textile fabric that is not knitted or crocheted and fits the covered women's or girls' article types; reject excluded categories."
    source_ids:
      - unsd-cpc-v3-2025
  - rule_id: val_03_reference_amount
    applies_to: "Dataset quantitative reference"
    rule: "Require exactly 1 kg net conforming garment and separately reported detachable packaging mass."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_04_qualifiers
    applies_to: "Dataset metadata"
    rule: "Require every item listed under Required qualifiers; missing qualifiers make validation inconclusive."
    source_ids:
      - afw-pefcr-2025
  - rule_id: val_05_process_coverage
    applies_to: "Process inventory"
    rule: "Require all four required processes and require p03_wet_processing when batch records or product claims show garment-level wet processing."
    source_ids:
      - afw-pefcr-2025
      - ilo-garment-2021
  - rule_id: val_06_atomic_exchanges
    applies_to: "Inventory rows"
    rule: "Require one physically or chemically specific exchange per card; prohibit combined energy, trim, chemical, packaging, waste or emission labels."
    source_ids:
      - afw-pefcr-2025
  - rule_id: val_07_collection_linkage
    applies_to: "Foreground amounts"
    rule: "Require every foreground_record or calculated_value row to link to a defined collection protocol and retained raw evidence."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_08_material_balance
    applies_to: "Cutting, assembly and final output"
    rule: "Reconcile fabric and trim inputs, intermediate transfers, conforming output, rejected garments, returns, remnants and wastes; report rather than conceal unexplained differences."
    source_ids:
      - afw-pefcr-2025
  - rule_id: val_09_no_upstream_double_count
    applies_to: "System boundary"
    rule: "Confirm that fabric, trims, chemicals, utilities and packaging enter once as product inputs with upstream datasets and that their upstream manufacture is not duplicated as foreground activity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_10_wet_route
    applies_to: "Wet-processing flows"
    rule: "When wet processing applies, require separate water, electricity, steam when used, each chemical, wastewater and sludge when generated; otherwise require documented not-applicable evidence."
    source_ids:
      - afw-pefcr-2025
  - rule_id: val_11_allocation
    applies_to: "Shared operations"
    rule: "Require subdivision where feasible and retain the selected mass or unit allocation driver, production weights and normalization conversion."
    source_ids:
      - afw-pefcr-2025
  - rule_id: val_12_uuid_status
    applies_to: "Non-reference flow identities"
    rule: "Reject any inventory UUID that has not passed both hybrid-search and state100 confirmation; unresolved semantic candidates remain UUID-free and listed by row_id in manifest review metadata."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset that may be published as a secondary_dataset and used as a background_dataset after review."
  downstream_use: "Supports downstream process and lifecyclemodel projections for garment supply chains that require a factory-gate cut-and-sew dataset."
  allowed_use: "Modelling the declared non-knitted/non-crocheted garment styles, sites, period, material composition, process route and packaging configuration within the stated representativeness."
  excluded_use: "Full cradle-to-grave apparel claims; knitted garments; protective wear; undisclosed wet-processing routes; comparison between products with materially different functions or qualifiers; use outside represented geography or technology without justification."
  required_metadata: "PCR id and version; reference-flow UUID and mass basis; garment qualifiers; site and period; style mix; BOM and trim identities; wet-processing applicability; process coverage; allocation; upstream datasets; packaging; data owner and review status."
  required_quality_disclosure: "Primary-data share; meter and scale quality; temporal, geographical and technological representativeness; material-balance gaps; subcontractor data gaps; unresolved UUIDs; allocation; omitted direct emissions; upstream dataset DQR."
  update_trigger: "Change in garment scope, fabric or trim bill, process route, wet treatment, site, technology, energy source, packaging, allocation, reference UUID, evidence source, or a material data-quality finding."
