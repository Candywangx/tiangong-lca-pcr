      uuid: ""
    required_unit: "m3"
    rule: "Record metered intake and discharged wastewater separately; identify reuse or recirculation without subtracting it twice."
process_map:
  - id: p01_cutting
    name: "Marker preparation, spreading, cutting and bundling"
    inclusion: "required"
    inclusion_condition: "Always included for industrial manufacture from woven fabric."
    role: "Convert finished fabric and interlining into identified cut components."
    quantitative_reference: "Per 1 kg net conforming reference garment."
  - id: p02_assembly
    name: "Sewing and trim assembly"
    inclusion: "required"
    inclusion_condition: "Always included."
    role: "Join cut components and attach the declared trims."
    quantitative_reference: "Per 1 kg net conforming reference garment."
  - id: p03_wet_processing
    name: "Garment wet processing"
    inclusion: "conditional"
    inclusion_condition: "Include when assembled garments are washed, bleached, dyed or wet-finished before sale."
    role: "Apply the declared garment-level wet treatment."
    quantitative_reference: "Per 1 kg net conforming reference garment routed through wet processing."
  - id: p04_final_finishing
    name: "Final finishing, pressing and inspection"
    inclusion: "required"
    inclusion_condition: "Always included; input route depends on whether p03_wet_processing applies."
    role: "Press, inspect, repair where allowed, reject nonconforming pieces, and release finished garments."
    quantitative_reference: "Per 1 kg net conforming reference garment."
  - id: p05_packaging
    name: "Folding and packaging"
    inclusion: "required"
    inclusion_condition: "Always included."
    role: "Fold and pack conforming garments for factory-gate dispatch."
    quantitative_reference: "Per 1 kg net conforming reference garment; packaging mass separate."
