      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh or derive from verified batch records the net dry garment mass after final inspection and before detachable packaging; normalize all inventory to 1 kg net conforming garment."
  - id: packaging_mass_separation
    applies_to: "Packaging inputs and outputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record each packaging material separately and exclude detachable packaging from the reference garment mass."
  - id: batch_material_balance
    applies_to: "Fabric, trims, garments and solid wastes"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use one consistent batch moisture and weighing basis; reconcile issued material mass with conforming garments, rejected garments, returned material, saleable remnants and waste."
  - id: energy_record_conversion
    applies_to: "Electricity and purchased steam"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh for electricity; MJ for steam"
    rule: "Preserve original meter or invoice units and document each conversion factor before normalization; do not combine electricity and steam into one exchange."
