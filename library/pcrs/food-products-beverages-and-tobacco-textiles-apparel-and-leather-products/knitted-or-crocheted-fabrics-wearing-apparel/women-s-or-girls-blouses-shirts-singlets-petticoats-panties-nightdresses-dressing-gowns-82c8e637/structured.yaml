system_boundary:
  rules:
    - rule_id: sb_01_start_at_finished_fabric
      applies_to: "Foreground boundary"
      rule: "Start with finished woven textile fabric and declared trims at the garment factory gate; represent their prior manufacture through upstream datasets."
      source_ids:
        - ilo-garment-2021
        - afw-pefcr-2025
    - rule_id: sb_02_include_garment_making
      applies_to: "All represented routes"
      rule: "Include cutting, sewing and trim assembly, final finishing, inspection, pressing, folding, packaging, and their attributable utilities, wastes and direct emissions."
      source_ids:
        - ilo-garment-2021
        - unido-garment-1983
        - afw-pefcr-2025
    - rule_id: sb_03_conditional_wet_processing
      applies_to: "Washed, bleached or otherwise wet-finished garments"
      rule: "Include the site or subcontractor wet-processing process only when it occurs after garment assembly; record its water, energy, each chemical, wastewater and sludge separately."
      source_ids:
        - afw-pefcr-2025
    - rule_id: sb_04_manufacturing_losses
      applies_to: "Every manufacturing step"
      rule: "Record step-specific cutting, assembly, rejection and packaging losses through the output of manufacturing; do not apply one hidden aggregate loss factor."
      source_ids:
        - afw-pefcr-2025
    - rule_id: sb_05_factory_gate_end
      applies_to: "Dataset endpoint"
      rule: "End at the packed garment at factory gate and exclude distribution, retail, consumer use and end-of-life from this foreground package; disclose those exclusions."
      source_ids:
        - afw-pefcr-2025
        - eu-pef-method-2021
boundary_abstraction:
  declared_starting_condition: "Finished woven textile fabric and declared trims, chemicals, utilities, and packaging arrive at the garment manufacturing boundary with supplier, composition, mass, and upstream dataset references."
