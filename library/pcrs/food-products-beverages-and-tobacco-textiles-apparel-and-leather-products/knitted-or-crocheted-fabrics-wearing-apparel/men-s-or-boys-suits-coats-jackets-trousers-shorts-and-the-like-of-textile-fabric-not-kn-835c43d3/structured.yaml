validation_rules:
  - rule_id: validation_01
    applies_to: "reference_flow"
    rule: "The reference output shall use UUID 039191b4-8865-4c2e-83b4-afd3f17435c3, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, with every required qualifier declared."
    source_ids:
      - unsd-cpc-3-28231
  - rule_id: validation_02
    applies_to: "product_scope"
    rule: "Reject datasets for knitted or crocheted garments, fur apparel, women's or girls' garments, shirts or underwear, accessories, footwear, or fabric sold as material."
    source_ids:
      - unsd-cpc-3-28231
  - rule_id: validation_03
    applies_to: "atomic_inventory"
    rule: "Every inventory card shall contain one selected exchange. Reject combined utilities, fuels, chemicals, packaging, waste, or emission labels and require a separate row for each actual exchange."
    source_ids:
      - afw-pefcr-2025
  - rule_id: validation_04
    applies_to: "mass_balance"
    rule: "Require reconciled style- and batch-specific material balance. Investigate unexplained residuals and verify that conforming output, rework, rejects, cutting offcuts, and stock changes are not double counted."
    source_ids:
      - afw-pefcr-2025
  - rule_id: validation_05
    applies_to: "conditional_processes"
    rule: "If garment washing, dyeing, bleaching, softening, rinsing, printing, embroidery, coating, or dry treatment occurs, require the corresponding process, atomic input, waste, and emission records or an explicitly linked outsourced dataset."
    source_ids:
      - afw-pefcr-2025
      - lindkvist-2024-circular-garment-lca
  - rule_id: validation_06
    applies_to: "energy_and_fuels"
    rule: "Require electricity, purchased steam, hot water, natural gas, and diesel to remain separate, with location and supply basis disclosed and no double counting of on-site fuel and purchased heat."
    source_ids:
      - ec-pef-method-2021
      - afw-pefcr-2025
  - rule_id: validation_07
    applies_to: "packaging"
    rule: "Require LDPE polybag, corrugated carton, paper hangtag, polypropylene tape, and any additional packaging actually used to be recorded as separate atomic rows; verify whether packaging is excluded from net product mass."
    source_ids:
      - afw-pefcr-2025
  - rule_id: validation_08
    applies_to: "direct_emissions"
    rule: "Where fuel combustion, volatile chemicals, wastewater treatment, or refrigerant servicing occurs, require pollutant-specific direct emissions calculated from collected activity data or measured directly, with factor provenance and compartment disclosed."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validation_09
    applies_to: "data_quality"
    rule: "Fail completeness when temporal coverage, facility coverage, calibration evidence, BOM coverage, allocation basis, proxy disclosure, or waste destination is missing."
    source_ids:
      - afw-pefcr-2025
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate production dataset for non-knitted, non-crocheted men's or boys' garment manufacture"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Construction of product-system inventories and lifecycle models when product type, BOM, geography, technology, time, boundary, and packaging convention are compatible"
  excluded_use: "Direct consumer-service comparison, use-phase claims, durability claims, knitted apparel, fur apparel, other wearer/product categories, or a fabric-production proxy without additional rules"
  required_metadata: "PCR id and version; reference UUIDs; garment type; style and size basis; net mass; full BOM; component composition; route; facility geography; reporting period; integrated and outsourced steps; utility basis; allocation; waste destinations; packaging convention"
  required_quality_disclosure: "Primary-data coverage; meter and scale quality; temporal, geographical and technological representativeness; allocation shares; proxy datasets; missing UUIDs; emission-factor provenance; mass-balance residuals; uncertainty and exclusions"
  update_trigger: "Change in garment construction or BOM, production or wet-processing route, facility or country, utility supply, refrigerant, packaging system, allocation method, waste destination, reference-flow identity, or governing evidence"
