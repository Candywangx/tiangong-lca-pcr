allocation_rules:
  - rule_id: allocation_01
    applies_to: "independently_meterable_processes"
    rule: "Avoid allocation by subdividing cutting, sewing, wet processing, pressing, inspection, rework, and packing wherever separate material or utility records are available."
    source_ids:
      - ec-pef-method-2021
      - afw-pefcr-2025
  - rule_id: allocation_02
    applies_to: "shared_materials"
    rule: "Assign shell, lining, interlining, pocketing, thread, fasteners, labels, bonding media, chemicals, and packaging using style-specific issue, return, and stock-change records; do not allocate a combined material total."
    source_ids:
      - afw-pefcr-2025
  - rule_id: allocation_03
    applies_to: "shared_electricity"
    rule: "Use submetered kWh; if unavailable, allocate only the shared electricity remainder by documented machine operating time multiplied by rated or measured load, then disclose the unmetered share."
    source_ids:
      - afw-pefcr-2025
  - rule_id: allocation_04
    applies_to: "shared_thermal_energy"
    rule: "Allocate steam or hot-water energy by process heat meters or measured batch demand; if unavailable, use documented equipment time and thermal duty, keeping steam and hot water separate."
    source_ids:
      - afw-pefcr-2025
  - rule_id: allocation_05
    applies_to: "rework_and_rejects"
    rule: "Retain burdens of rework and irreparable rejects in the reporting period denominator and normalise them over conforming output; report reject mass and destination separately and do not treat rejects as co-products."
    source_ids:
      - afw-pefcr-2025
  - rule_id: allocation_06
    applies_to: "cutting_offcuts"
    rule: "Report textile cutting offcuts as waste output by composition and destination. Do not grant an avoided-product credit inside this foreground dataset; any recycling benefit or burden belongs to the declared downstream treatment model."
    source_ids:
      - ec-pef-method-2021
      - afw-pefcr-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_cutting_batch_records
      process_id: "fabric_preparation_cutting"
      flow_role: "fabric, marker paper, electricity, cut panels, cutting offcuts"
      record_type: "BOM issue/return, scale ticket, cutting plan, meter or machine log"
      raw_fields: "style_id; batch_id; component_id; material_specification; opening_stock; issued_mass; returned_mass; closing_stock; cut_panel_mass; offcut_mass; marker_paper_mass; kWh; operating_time"
      collection_method: "Reconcile warehouse, cutting-room, scale, and meter records to the same batch"
      unit: "kg; kWh; h"
      frequency: "Each batch, aggregated monthly"
      temporal_coverage: "At least 12 consecutive months or the full campaign if shorter"
      site_scope: "All cutting lines producing the declared product"
      aggregation_rule: "Sum atomic exchanges by row_id and divide by accepted cut-panel mass, retaining batch variation"
      quality_evidence: "Calibrated scale and meter certificates; signed issue/return records; marker plan; batch reconciliation"
    - protocol_id: cp_sewing_batch_records
      process_id: "sewing_assembly"
      flow_role: "panels, thread, fasteners, bonding tape, electricity, assembled output, sewing waste"
      record_type: "BOM issue/return, piece count, scale ticket, meter or machine log, rejection log"
      raw_fields: "style_id; batch_id; component_id; count; mass_per_item; issued_mass; returned_mass; closing_stock; assembled_mass; rejected_mass; kWh; operating_time"
      collection_method: "Reconcile each BOM item and utility record to accepted assembled output"
      unit: "kg; count; kWh; h"
      frequency: "Each batch, aggregated monthly"
      temporal_coverage: "At least 12 consecutive months or the full campaign if shorter"
      site_scope: "All sewing and assembly lines producing the declared product"
      aggregation_rule: "Convert counted items to mass using measured or supplier mass per item; sum by row_id and divide by accepted assembled mass"
      quality_evidence: "BOM revision; calibrated scales; component specifications; meter records; rejection and rework logs"
    - protocol_id: cp_wet_processing_batch_records
      process_id: "garment_wet_processing"
      flow_role: "garment input, water, hot water, electricity, gas, chemicals, steam, garment output, wastewater, sludge, combustion emissions"
      record_type: "Recipe, dosing log, inlet/effluent meter, utility meter, fuel invoice, batch scale, effluent test, sludge ticket"
