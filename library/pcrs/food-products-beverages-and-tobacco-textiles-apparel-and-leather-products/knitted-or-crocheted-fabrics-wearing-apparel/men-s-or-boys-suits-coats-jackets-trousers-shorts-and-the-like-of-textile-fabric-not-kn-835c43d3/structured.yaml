    - rule_id: boundary_02
      applies_to: "integrated_operations"
      rule: "Include weaving, dyeing, printing, embroidery, washing, coating, or other treatment inside this dataset only when performed within the reporting facility and period; otherwise link a separate upstream or outsourced process dataset."
      source_ids:
        - afw-pefcr-2025
    - rule_id: boundary_03
      applies_to: "excluded_life_cycle_stages"
      rule: "Exclude outbound distribution, retail, consumer transport, use, repair, reuse, and end of life from this manufacturing dataset; retain metadata needed for a downstream full-life-cycle model."
