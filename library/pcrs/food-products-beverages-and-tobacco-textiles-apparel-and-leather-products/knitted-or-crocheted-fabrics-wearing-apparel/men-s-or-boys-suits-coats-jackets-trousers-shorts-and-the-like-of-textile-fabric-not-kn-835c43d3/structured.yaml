  calculation_rules:
    - id: calc_01
      applies_to: "reference normalisation"
      rule: "Normalised exchange = reconciled exchange amount / conforming net finished-garment mass."
      inputs:
        - "Atomic exchange amount"
        - "conforming output mass"
      output: "Exchange per 1 kg reference product"
      source_ids:
        - afw-pefcr-2025
    - id: calc_02
      applies_to: "material mass balance"
      rule: "For each material identity: opening stock + receipts - closing stock = conforming product content + recoverable return + waste + documented stock adjustment. Investigate rather than hide an unexplained residual."
      inputs:
        - Stock
        - receipt
        - return
        - product
        - "and waste mass by material"
      output: "Reconciled atomic material input and residual"
      source_ids:
        - afw-pefcr-2025
    - id: calc_03
      applies_to: "counted component mass"
      rule: "Component mass = installed count × measured or supplier-declared mass per item; reconcile against issue and return records."
      inputs:
        - Count
        - "mass per item"
        - issue
        - return
      output: "kg of one fastener, label, or packaging component"
      source_ids:
        - afw-pefcr-2025
    - id: calc_04
      applies_to: "shared electricity"
      rule: "Allocated kWh = shared-meter kWh × process machine-load-weighted operating time / total machine-load-weighted operating time; report the shared-meter fraction."
      inputs:
        - "Meter kWh"
        - "machine time"
        - "rated or measured load"
      output: "Process electricity by atomic row"
      source_ids:
        - afw-pefcr-2025
    - id: calc_05
      applies_to: "purchased steam or hot water"
      rule: "Thermal energy is calculated from metered mass or volume and documented supply/return enthalpy; steam and hot water remain separate outputs of the calculation."
      inputs:
        - "Meter reading"
        - temperature
        - pressure
        - "enthalpy factor"
      output: "MJ of purchased steam or hot water"
      source_ids:
        - afw-pefcr-2025
    - id: calc_06
      applies_to: "refrigerant loss"
      rule: "Refrigerant emitted = opening stock + purchases - closing stock - quantity recovered - quantity transferred to verified equipment inventory."
      inputs:
        - "Refrigerant inventory and service records"
      output: "kg R-410A emitted"
      source_ids:
        - ec-pef-method-2021
    - id: calc_07
      applies_to: "direct combustion emission"
      rule: "Emission = collected fuel quantity × disclosed factor for the specific fuel, combustion technology, pollutant, and jurisdiction; create one output row per pollutant."
      inputs:
        - "Fuel record"
        - "factor reference"
        - "control efficiency"
      output: "kg of one elementary emission"
      source_ids:
        - ec-pef-method-2021
  data_quality_requirements:
    - id: dq_01
      applies_to: "product identity"
      requirement: "The dataset shall identify garment type, wearer group, style, reference size or size mix, net mass, BOM revision, textile composition and construction, finish, colour, trim set, wet-processing route, and packaging inclusion."
