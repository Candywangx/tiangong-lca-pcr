system_boundary:
  rules:
    - rule_id: boundary_01
      applies_to: "foreground_start_and_end"
      rule: "Start at receipt of woven fabric and declared components and end with conforming sale-ready product at the manufacturing gate; include all on-site cutting, sewing, finishing, inspection, rework, waste handling, utilities, packaging, and direct emissions."
