allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all foreground processes"
    rule: "First avoid allocation through batch or style separation, process sub-metering, separate material issue and direct waste weighing."
    source_ids:
      - iso-14044-2006
      - ec-pef-2021-2279
  - rule_id: allocation_cutting_mass
    applies_to: "cutting and composition-specific losses"
    rule: "Assign fabric, interlining and cutting losses by measured material mass for the declared product and batch; preserve material composition in each waste output."
    source_ids:
      - afw-pefcr-3-1
  - rule_id: allocation_assembly_unit
    applies_to: "sewing and assembly"
    rule: "Allocate shared sewing and assembly activity by accepted units processed, then convert to the 1 kg reference flow using accepted item count and measured net mass per item."
    source_ids:
      - afw-pefcr-3-1
  - rule_id: allocation_finishing_mass
    applies_to: "finishing"
    rule: "Allocate shared finishing burdens by measured product mass only when products receive the same route; separate products with different washing, printing, embellishment, pressing or drying routes before allocation."
    source_ids:
      - afw-pefcr-3-1
  - rule_id: allocation_shared_electricity
    applies_to: "shared equipment"
    rule: "Use process sub-metering first; otherwise use documented operating time multiplied by equipment power. Use mass throughput only when products have demonstrably equivalent processing intensity."
    source_ids:
      - afw-pefcr-3-1
  - rule_id: allocation_waste
    applies_to: "offcuts, rejects and packaging scrap"
    rule: "Report each waste at the process where it arises with measured composition, mass and treatment destination; do not hide it in a global loss rate or mixed waste exchange."
    source_ids:
      - iso-14044-2006
      - afw-pefcr-3-1
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "p1_cutting_p2_assembly"
      flow_role: "fabrics, interlining, thread and trims"
      record_type: "BOM, stock issue, return, count and purchase records"
      raw_fields: "product subtype; material identity; composition; supplier; lot; issued mass, length or count; unused return; unit mass or linear mass"
      collection_method: "reconcile the approved product BOM with warehouse issue and return records"
      unit: "kg, item, m"
      frequency: "each batch"
      temporal_coverage: "representative current production period"
      site_scope: "all reporting-factory stores and lines in scope"
      aggregation_rule: "sum net issued amount by atomic material and normalize to conforming net output"
      quality_evidence: "approved BOM; supplier specification; calibrated scale record; stock reconciliation"
    - protocol_id: cp_cutting_mass_balance
      process_id: "p1_cutting"
      flow_role: "cut components and composition-specific offcuts"
      record_type: "lay, marker, pattern, cut-output and waste records"
      raw_fields: "input and return mass by material; accepted component mass; offcut mass; cutting reject mass"
      collection_method: "weigh material inputs, accepted components and segregated offcuts for the same batch"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative current production period"
      site_scope: "all cutting operations in scope"
      aggregation_rule: "reconcile each material input to unused returns, accepted components, offcuts and rejects"
      quality_evidence: "marker or pattern record; calibrated scale record; waste ticket; signed batch reconciliation"
    - protocol_id: cp_assembly_records
      process_id: "p2_assembly"
      flow_role: "assembled products, trims and assembly losses"
      record_type: "production-line and material-consumption records"
      raw_fields: "item count; net mass per item; accepted output mass; thread issue and return; trim counts; rejects"
      collection_method: "reconcile line output with component and trim records"
      unit: "kg, item"
      frequency: "each batch or shift"
      temporal_coverage: "representative current production period"
      site_scope: "all assembly lines in scope"
      aggregation_rule: "aggregate by subtype and route, then convert unit-based activity to 1 kg net output"
      quality_evidence: "production log; BOM; quality disposition; calibrated scale record"
    - protocol_id: cp_process_electricity
      process_id: "p1_cutting_p2_assembly_p3_finishing_qc_p4_packaging"
      flow_role: "process electricity"
      record_type: "meter, equipment and operating-time records"
      raw_fields: "meter start and end; equipment identifier; rated or measured power; operating time; products processed; downtime"
      collection_method: "sub-meter directly or calculate power multiplied by operating time"
      unit: "kWh"
      frequency: "batch, shift or meter interval"
      temporal_coverage: "representative current production period"
      site_scope: "all included equipment and shared services"
      aggregation_rule: "subtract documented non-production load and allocate by the approved process rule"
      quality_evidence: "meter certificate; bill reconciliation; equipment plate; operating log"
    - protocol_id: cp_finishing_and_qc
      process_id: "p3_finishing_qc"
      flow_role: "finishing inputs, outputs and wastewater"
      record_type: "route, recipe, meter, batch, quality and discharge records"
      raw_fields: "finishing route; input mass; electricity; steam; water; each chemical; output mass; wastewater; rework; rejects"
      collection_method: "collect only for operations actually performed and reconcile each wet batch separately"
      unit: "kg, kWh"
      frequency: "each finishing batch"
      temporal_coverage: "representative current production period"
      site_scope: "all included finishing and inspection operations"
      aggregation_rule: "aggregate separately by finishing route before normalization"
      quality_evidence: "route sheet; batch recipe; meter record; chemical issue; discharge record; inspection report"
    - protocol_id: cp_quality_and_rework
      process_id: "p2_assembly_p3_finishing_qc"
      flow_role: "rejects and rework"
      record_type: "defect and disposition records"
      raw_fields: "defect code; item count; mass; repair action; re-entry process; final disposition"
      collection_method: "track each failed unit to completed rework or waste exit"
      unit: "item, kg"
      frequency: "each batch"
      temporal_coverage: "representative current production period"
      site_scope: "all included assembly and finishing lines"
      aggregation_rule: "count rework once and exclude recovered rework from waste"
      quality_evidence: "quality report; rework traveller; waste transfer ticket"
    - protocol_id: cp_packaging_and_release
      process_id: "p4_packaging"
      flow_role: "packaging and reference output"
      record_type: "packing specification, issue, count, mass and release records"
      raw_fields: "product count; product net mass; packaging type; piece count; unit mass; packaging scrap; released mass"
      collection_method: "reconcile packaging material issue with packed-product release"
      unit: "kg, item"
      frequency: "each batch"
      temporal_coverage: "representative current production period"
      site_scope: "all packaging lines and factory-gate releases"
      aggregation_rule: "allocate grouped cartons by contained net product mass and normalize packaging separately to 1 kg product"
      quality_evidence: "packing specification; scale record; warehouse release; scrap record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground exchanges"
      rule: "normalized exchange = production-period exchange / conforming net product mass; set reference output to exactly 1 kg."
      inputs:
        - "production-period exchange"
        - "conforming net released mass"
      output: "exchange per 1 kg net product"
      source_ids:
        - ec-pef-2021-2279
    - id: calc_cutting_mass_balance
      applies_to: "each fabric and interlining material"
      rule: "net issued input = accepted cut component mass + composition-specific offcuts + cutting rejects; investigate rather than aggregate any residual."
      inputs:
        - "issued mass"
        - "returned mass"
        - "accepted component mass"
        - "offcut mass"
        - "reject mass"
      output: "reconciled material flow and disclosed residual"
      source_ids:
        - afw-pefcr-3-1
    - id: calc_assembly_loss
      applies_to: "complete product BOM"
      rule: "assembly loss mass = net BOM material issued minus conforming product mass, adjusted for unused returns and recovered rework; retain composition-specific losses."
      inputs:
        - "BOM issue"
        - "unused returns"
        - "conforming output"
        - "recovered rework"
      output: "assembly loss by material"
      source_ids:
        - afw-pefcr-3-1
    - id: calc_unit_to_mass
      applies_to: "sewing and assembly"
      rule: "burden per kg = total assembly burden / accepted item count / measured net mass per accepted item."
      inputs:
        - "assembly burden"
        - "accepted item count"
        - "net mass per item"
      output: "assembly burden per 1 kg reference flow"
      source_ids:
        - afw-pefcr-3-1
    - id: calc_shared_electricity
      applies_to: "shared electrical equipment"
      rule: "assigned electricity = total metered electricity × product-specific operating-time × equipment-power term / sum of all operating-time × equipment-power terms."
      inputs:
        - "meter total"
        - "equipment time"
        - "equipment power"
      output: "kWh assigned to product"
      source_ids:
        - afw-pefcr-3-1
    - id: calc_packaging_mass
      applies_to: "grouped packaging"
      rule: "packaging per kg = packaging piece count × verified unit mass / contained net product mass."
      inputs:
        - "piece count"
        - "unit mass"
        - "contained net product mass"
      output: "kg packaging per kg net product"
      source_ids:
        - afw-pefcr-3-1
  data_quality_requirements:
    - id: dqr_identity
      applies_to: "reference product"
      requirement: "Match the exact CPC 28238 Product-flow identity and retain the verified product-flow, Mass and Units of mass UUIDs without dataset versions."
      evidence: "Tiangong hybrid result and public state-code-100 direct read; un-cpc-3-2025"
    - id: dqr_bom_coverage
      applies_to: "material inventory"
      requirement: "Provide primary data for at least 95% of BOM mass and cover 100% of main fabrics, lining, padding, metals and electronic parts when present; quantify and disclose every omitted remainder."
      evidence: "approved BOM; supplier specifications; afw-pefcr-3-1"
    - id: dqr_product_subtype
      applies_to: "category representativeness"
      requirement: "Declare whether the product is a handkerchief, shawl, scarf, veil, tie, cravat, glove, other accessory or garment part; do not aggregate materially different subtypes without production-weighted data."
      evidence: "product specification; production mix; un-cpc-3-2025"
    - id: dqr_route
      applies_to: "process coverage"
      requirement: "Identify every controlled cutting, edge-making, assembly, finishing, inspection, rework and packaging operation and each subcontracted operation; documentation for one step shall not imply coverage of another step."
      evidence: "process map; route sheet; supplier declaration; afw-pefcr-3-1"
    - id: dqr_temporal
      applies_to: "foreground records"
      requirement: "Use current, production-representative data and explain product mix, seasonality, site mix and any extrapolation."
      evidence: "dated production, meter, stock and quality records; afw-pefcr-3-1"
    - id: dqr_measurement
      applies_to: "measured quantities"
      requirement: "Retain calibration status, reading interval, unit conversion and reconciliation evidence for mass, count, electricity, steam and water."
      evidence: "calibration certificate; meter log; scale record; invoice reconciliation"
    - id: dqr_waste_destination
      applies_to: "waste outputs"
      requirement: "Record composition, mass, applicable hazardous status, treatment destination and transfer evidence separately for every atomic waste."
      evidence: "waste ticket; contractor receipt; internal disposition record; afw-pefcr-3-1"
    - id: dqr_wet_finishing
      applies_to: "conditional wet operations"
      requirement: "Retain route, recipe, water balance, each chemical issue, wastewater quantity, discharge route and monitoring basis; declare not applicable when no wet finishing occurs."
      evidence: "recipe; meter and discharge records; eu-textiles-bat-2022-2508"
    - id: dqr_uuid
      applies_to: "non-reference exchanges"
      requirement: "Leave a UUID blank until one exact Tiangong flow is confirmed by hybrid search and public state-code-100 direct read for the relevant composition, technology, geography, treatment route or elementary-flow compartment."
      evidence: "manifest identity review and future state-code-100 readback"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The output UUID shall resolve to one public Product flow whose complete name and CPC leaf exactly match 28238 and whose quantitative reference is Mass; the reference output shall equal 1 kg net product."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_scope
    applies_to: "product and boundary"
    rule: "The product shall be a covered non-knitted, non-crocheted textile accessory or garment/accessory part and the foreground dataset shall stop at the reporting factory gate."
    source_ids:
      - un-cpc-3-2025
      - afw-pefcr-3-1
  - rule_id: validate_qualifiers
    applies_to: "reference metadata"
    rule: "Product subtype, finished-accessory or part status, end use, dimensions or size, net item mass, item count, BOM, construction, trims, finishing route, geography, period and packaging shall be declared."
    source_ids:
      - afw-pefcr-3-1
  - rule_id: validate_bom
    applies_to: "material inventory"
    rule: "BOM coverage shall meet the stated threshold, every included component shall have one atomic material row, and omitted mass shall be quantified and disclosed."
    source_ids:
      - afw-pefcr-3-1
  - rule_id: validate_mass_balance
    applies_to: "cutting, assembly, finishing and packaging"
    rule: "Inputs, unused returns, accepted outputs, rework, offcuts, rejects and scrap shall reconcile for the same production period within a declared measurement tolerance."
    source_ids:
      - afw-pefcr-3-1
  - rule_id: validate_energy
    applies_to: "process utilities"
    rule: "Electricity shall be separate for each process or transparently allocated from shared metering; steam, water and every fuel shall remain separate atomic exchanges."
    source_ids:
      - afw-pefcr-3-1
      - eu-textiles-bat-2022-2508
  - rule_id: validate_conditional_finishing
    applies_to: "finishing"
    rule: "Each wet or dry finishing route shall have complete atomic input, waste and emission records or be explicitly declared absent with route evidence."
    source_ids:
      - afw-pefcr-3-1
      - eu-textiles-bat-2022-2508
  - rule_id: validate_atomic_flows
    applies_to: "process inventory"
    rule: "No selected flow may be a collection, selector instruction, carrier list or combined waste; each additional material, chemical, fuel, refrigerant, packaging component, waste or emission shall have its own row."
    source_ids:
      - afw-pefcr-3-1
  - rule_id: validate_allocation
    applies_to: "shared processes"
    rule: "Allocation shall follow the declared hierarchy and basis; assembly and sewing unit allocation shall be converted with accepted item count and measured net mass per item."
    source_ids:
      - iso-14044-2006
      - afw-pefcr-3-1
  - rule_id: validate_data_quality
    applies_to: "foreground records"
    rule: "Records shall be current, representative and traceable, with calibration, stock, meter, quality and waste evidence; every data gap and withheld UUID shall be disclosed."
    source_ids:
      - ec-pef-2021-2279
      - afw-pefcr-3-1
published_dataset_profile:
  dataset_role: "Product-specific or production-weighted foreground factory-gate dataset for CPC 28238 textile accessories or garment/accessory parts"
  downstream_use: "May serve as a secondary or background dataset when product subtype, composition, construction, technology, geography, period and finishing route match"
  allowed_use: "Factory-gate inventory construction, supplier data exchange, hotspot analysis, and downstream process or lifecyclemodel projection with declared limitations"
  excluded_use: "Direct substitution for knitted accessories, leather or plastics accessories, sports gloves, hats, complete garments or fabric production; unsupported comparative claims; silent use of unresolved UUIDs"
  required_metadata: "canonical PCR id; product-flow UUID; product subtype; finished-accessory or part status; dimensions or size; net item mass and count; complete component BOM; construction and finish; factory geography and period; subcontracted steps; allocation; packaging; waste destinations"
  required_quality_disclosure: "BOM and process coverage; source and meter provenance; calibration; representativeness; allocation; mass-balance residuals; data gaps; wet-finishing applicability; UUID review status"
  update_trigger: "Material change in category scope, product mix, BOM, construction, finishing route, factory technology, geography, allocation, reference identity, evidence or applicable apparel environmental-footprint rules"
