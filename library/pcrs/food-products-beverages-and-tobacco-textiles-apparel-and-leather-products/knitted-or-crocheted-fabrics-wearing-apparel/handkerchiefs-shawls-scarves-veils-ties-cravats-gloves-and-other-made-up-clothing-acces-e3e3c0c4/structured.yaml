    applies_to: "fabrics, interlining, thread, trims, detergents, packaging and solid wastes"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use calibrated scale, invoice, stock-issue or BOM records and reconcile issued, returned, incorporated, rejected and discarded mass for the same production period."
