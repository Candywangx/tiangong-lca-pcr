system_boundary:
  rules:
    - rule_id: boundary_factory_operations
      applies_to: "foreground accessory or garment-part production"
      rule: "Include receipt and internal handling of finished fabrics and components, cutting, edge making, sewing, assembly, applicable finishing, inspection, rework, labelling, packaging, direct utilities, process wastes and direct releases through factory-gate release."
      source_ids:
        - afw-pefcr-3-1
    - rule_id: boundary_upstream_linkage
      applies_to: "purchased inputs"
      rule: "Keep each purchased fabric, interlining, trim, chemical, utility and packaging material visible and connect it to a composition-, technology-, geography- and period-appropriate upstream dataset."
      source_ids:
        - ec-pef-2021-2279
        - afw-pefcr-3-1
    - rule_id: boundary_conditional_finishing
      applies_to: "washing, printing, embellishment and finishing"
      rule: "Include only operations actually performed at the reporting factory; declare absence explicitly and add an atomic exchange for every additional chemical, fuel, refrigerant, waste or direct emission used by an applicable route."
      source_ids:
        - afw-pefcr-3-1
        - eu-textiles-bat-2022-2508
    - rule_id: boundary_downstream_exclusion
      applies_to: "downstream life-cycle stages"
      rule: "Exclude distribution beyond the factory gate, retail, consumer use and care, repair, reuse and end-of-life from this foreground package; downstream studies shall add those stages separately."
      source_ids:
        - afw-pefcr-3-1
    - rule_id: boundary_same_category_recursion
      applies_to: "same-category accessory or part inputs"
      rule: "Record purchased or transferred CPC 28238 accessories or parts crossing the boundary as explicit product inputs linked to an upstream dataset; do not recursively recreate uncontrolled production."
      source_ids:
        - ec-pef-2021-2279
