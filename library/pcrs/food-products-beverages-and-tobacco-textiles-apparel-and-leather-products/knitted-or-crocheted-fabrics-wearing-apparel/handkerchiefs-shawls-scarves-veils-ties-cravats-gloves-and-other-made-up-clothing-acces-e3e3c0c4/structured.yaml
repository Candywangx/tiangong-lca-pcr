      uuid: ""
    required_unit: "kg"
    rule: "Report every packaging material separately per 1 kg net product and do not add packaging mass to the reference product."
process_map:
  - id: p1_cutting
    name: "Pattern or shape cutting"
    inclusion: "required"
    inclusion_condition: "Finished textile fabric and applicable interlining are cut into accessory or garment-part components."
    role: "Convert declared materials into controlled components while recording composition-specific cutting losses."
    quantitative_reference: "kg cut components and kg offcuts per 1 kg net product"
  - id: p2_assembly
    name: "Edge making, sewing and assembly"
    inclusion: "required"
    inclusion_condition: "Cut components are hemmed, sewn, fused or otherwise joined and applicable trims are attached."
    role: "Produce an assembled accessory or part and record item-based activity, thread losses and rejects."
    quantitative_reference: "items assembled and kg assembled output per 1 kg net product"
  - id: p3_finishing_qc
    name: "Conditional finishing and quality control"
    inclusion: "conditional"
    inclusion_condition: "Include washing, pressing, printing, embellishment, drying or other finishing only when performed at the reporting site; inspection and quality control are always included."
    role: "Produce conforming unpackaged product and record utilities, wastewater, rejects and rework."
    quantitative_reference: "kg conforming unpackaged output per 1 kg net product"
  - id: p4_packaging
    name: "Labelling, packaging and factory-gate release"
    inclusion: "required"
    inclusion_condition: "Conforming products are labelled, packed and released at the factory gate."
    role: "Apply declared packaging and produce the reference flow while keeping packaging mass separate."
    quantitative_reference: "1 kg net reference product"
