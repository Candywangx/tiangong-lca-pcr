functional_unit:
  what: "Provide a declared knitted or crocheted fabric lot, excluding pile and terry fabric, with the specified construction and finish state"
  how_much: "1 kg net dry mass of saleable fabric at the factory gate"
  how_well: "Meets the declared fibre composition, construction, width, areal density, coloration and finish specifications, with rejected material excluded from the reference amount"
