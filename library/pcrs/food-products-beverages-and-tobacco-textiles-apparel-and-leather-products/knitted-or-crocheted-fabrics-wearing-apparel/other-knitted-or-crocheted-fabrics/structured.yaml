allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared lines and utilities"
    rule: "Avoid allocation by separately metering or otherwise subdividing fabric formation, wet processing, finishing, and treatment records by process and product lot wherever technically feasible."
    source_ids:
      - eu-pef-method-2021
      - eu-textiles-bat-2022-2508
  - rule_id: allocation_mass_when_unavoidable
    applies_to: "jointly produced saleable fabric grades"
    rule: "When physical subdivision is not feasible and multiple saleable fabric grades share one process, allocate the remaining shared burden by net dry mass unless a documented causal physical relationship better represents the driver. Report the method and quantities."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_waste_and_recovery
    applies_to: "rejects, recovered material and exported energy"
    rule: "Do not credit a reject or recovered material as a co-product without a documented destination and applicable system model. Keep treatment burdens and any substitution or recycling assumption explicit."
    source_ids:
      - eu-pef-method-2021
      - eu-textiles-bat-2022-2508
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabric_formation_records
      process_id: "fabric_formation"
      flow_role: "each atomic yarn, electricity, oil, formed fabric, waste-oil, solid-waste and dust row"
      record_type: "batch issue/return records, meters, stock records, scales, emission measurements"
      raw_fields: "lot_id; yarn_id; fibre_composition; yarn_mass; returns; formed_fabric_mass; electricity_kwh; oil_stock_and_purchase; waste_mass; dust_concentration; exhaust_volume; moisture_basis"
      collection_method: "reconcile material issues and returns with batch output; read dedicated meters and calibrated scales; calculate dust mass only from measured concentration and volume"
      unit: "kg; kWh; mg/Nm3; Nm3"
      frequency: "each lot, with utility and stock reconciliation at least monthly"
      temporal_coverage: "representative 12-month period or all shorter campaign records"
      site_scope: "all knitting or crochet lines producing the declared product"
      aggregation_rule: "sum atomic exchanges by lot and divide by dry formed-fabric output; keep each yarn identity separate"
      quality_evidence: "purchase and return records; calibration certificates; meter logs; lot traveller; waste transfer note; emission test report"
    - protocol_id: cp_pretreatment_records
      process_id: "pretreatment"
      flow_role: "each atomic fabric, water, chemical, electricity, steam, output and wastewater row"
      record_type: "batch recipe, dosing, meters and scales"
      raw_fields: "lot_id; dry_fabric_in; water_in; chemical_product; concentration; charge_mass; electricity_kwh; steam_mass; condensate_return; dry_fabric_out; wastewater_mass"
      collection_method: "collect every batch recipe and direct meter reading; convert product charge to active chemical mass without merging chemicals"
      unit: "kg; kWh"
      frequency: "each batch, reconciled monthly"
      temporal_coverage: "representative 12-month period or all shorter campaign records"
      site_scope: "all on-site pretreatment equipment used for the declared product"
      aggregation_rule: "aggregate only identical atomic flows after batch normalization to dry textile output"
      quality_evidence: "signed recipe; dosing log; meter calibration; scale record; mass-balance review"
    - protocol_id: cp_coloration_records
      process_id: "coloration"
      flow_role: "each atomic fabric, water, dyestuff, pigment, binder, auxiliary, electricity, steam, output and wastewater row"
      record_type: "recipe, print-paste record, dosing, meters and scales"
      raw_fields: "lot_id; route; fabric_in; chemical_identity; concentration; charge_mass; water_in; electricity_kwh; steam_mass; fabric_out; wastewater_mass"
      collection_method: "record each formulation ingredient separately by chemical or commercial-product identity and preserve route and batch traceability"
      unit: "kg; kWh"
      frequency: "each batch or print run, reconciled monthly"
      temporal_coverage: "representative 12-month period or all shorter campaign records"
      site_scope: "all on-site dyeing and printing lines used for the declared product"
      aggregation_rule: "aggregate only identical atomic flows and the same route after normalization to dry textile output"
      quality_evidence: "approved recipe; chemical SDS; dosing record; meter calibration; lot traveller; wastewater meter"
    - protocol_id: cp_finishing_records
      process_id: "finishing"
      flow_role: "each atomic fabric, water, finishing chemical, electricity, steam, natural gas, output, wastewater and direct-emission row"
      record_type: "recipe, dosing, meters, fuel records and stack calculations"
      raw_fields: "lot_id; finish_route; fabric_in; chemical_identity; concentration; charge_mass; water_in; electricity_kwh; steam_mass; gas_volume; net_calorific_value; fabric_out; wastewater_mass; emission_factor"
      collection_method: "collect direct records for each finishing step and each carrier; calculate active chemicals, fuel energy and combustion emissions using documented factors"
      unit: "kg; kWh; MJ"
      frequency: "each lot, with meters reconciled monthly"
      temporal_coverage: "representative 12-month period or all shorter campaign records"
      site_scope: "all on-site finishing and thermal-treatment equipment used for the declared product"
      aggregation_rule: "normalize each atomic exchange to dry finished-fabric output before route aggregation"
      quality_evidence: "approved recipe; SDS; meter and fuel invoices; calibration records; emission-factor reference; lot traveller"
    - protocol_id: cp_wastewater_treatment_records
      process_id: "wastewater_treatment"
      flow_role: "each atomic influent, treatment chemical, electricity, sludge and water-emission row"
      record_type: "flow meters, dosing, laboratory results, scales and disposal records"
      raw_fields: "influent_mass; effluent_mass; electricity_kwh; chemical_identity; concentration; dose; sludge_wet_mass; sludge_dry_solids; discharge_compartment; monitored_parameter; concentration"
      collection_method: "use direct flow-proportional monitoring where available; preserve each chemical and emitted substance separately"
      unit: "kg; kWh; mg/L"
      frequency: "continuous or per batch flow; parameter frequency per permit and process change"
      temporal_coverage: "same period as foreground production"
      site_scope: "on-site treatment receiving wastewater from included processes"
      aggregation_rule: "reconcile influent, effluent, sludge and retained water; report pollutants as separate elementary flows when measured"
      quality_evidence: "meter logs; laboratory accreditation; sampling plan; calibration; sludge transfer note; permit report"
    - protocol_id: cp_quality_release_records
      process_id: "quality_release"
      flow_role: "release input, inspection electricity, reference product and rejected fabric"
      record_type: "roll or piece scale, inspection and specification records"
      raw_fields: "lot_id; product_code; fibre_composition; construction; width; areal_density; finish_state; wet_mass; moisture_content; dry_mass; rejected_mass; electricity_kwh"
      collection_method: "weigh each released lot, document moisture correction, reconcile accepted and rejected fabric, and verify all required qualifiers"
      unit: "kg; g/m2; m; kWh"
      frequency: "each release lot"
      temporal_coverage: "same period as foreground production"
      site_scope: "every release and inspection line for the declared product"
      aggregation_rule: "sum accepted dry mass only; normalize all included foreground exchanges to 1 kg accepted dry mass"
      quality_evidence: "calibrated scale; moisture test; inspection report; product specification; rejection record"
  calculation_rules:
    - id: calc_dry_reference_mass
      applies_to: "reference product"
      rule: "dry_mass = measured_wet_mass × (1 − measured_moisture_fraction); packaging and rejected fabric are excluded"
      inputs:
        - measured_wet_mass
        - measured_moisture_fraction
        - packaging_mass
        - rejected_mass
      output: "kg net dry saleable fabric"
      source_ids:
        - eu-pef-method-2021
    - id: calc_exchange_normalization
      applies_to: "every foreground exchange"
      rule: "normalized_exchange = exchange_quantity attributable to the declared product ÷ net dry saleable fabric mass"
      inputs:
        - "atomic exchange quantity"
        - "attributable share after subdivision"
        - "net dry saleable fabric mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_active_chemical
      applies_to: "formulated chemicals"
      rule: "active_chemical_mass = delivered product mass × declared active concentration; keep the delivered product identity and concentration in supporting records"
      inputs:
        - product_mass
        - active_concentration
      output: "kg active chemical and kg delivered product, without merging different chemicals"
      source_ids:
        - eu-textiles-bat-2022-2508
    - id: calc_fuel_energy
      applies_to: "natural gas and other fuels added as separate rows"
      rule: "fuel_energy = metered fuel quantity × documented net calorific value"
      inputs:
        - fuel_quantity
        - "density when required"
        - net_calorific_value
      output: "MJ net energy for the individual fuel"
      source_ids:
        - eu-textiles-bat-2022-2508
    - id: calc_process_mass_balance
      applies_to: "each included process"
      rule: "reconcile dry material inputs with dry product output, separately measured waste, retained material and documented emissions; investigate unexplained imbalance rather than assigning it to product"
      inputs:
        - "atomic material inputs"
        - "dry outputs"
        - wastes
        - emissions
        - "stock change"
      output: "process-level mass-balance check"
      source_ids:
        - eu-textiles-bat-2022-2508
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Preserve lot-level fibre composition, yarn form, construction, width, areal density, finish state, coloration route, finishing route, and moisture basis."
      evidence: "product specification, bill of materials, lot traveller, test and inspection records"
    - id: dq_primary_activity
      applies_to: "all producer-operated processes"
      requirement: "Use process- or plant-level consumption, stock, meter, recipe, emission, waste and sales records for the same reporting period; disclose estimation and allocation."
      evidence: "meters, invoices, inventory changes, recipes, laboratory reports, waste notes, production records"
    - id: dq_temporal_coverage
      applies_to: "foreground dataset"
      requirement: "Use a representative continuous 12-month period where production is regular; for a shorter campaign, include every campaign record and disclose seasonality and shutdowns."
      evidence: "dated source register and completeness reconciliation"
    - id: dq_recipe_completeness
      applies_to: "wet processing and finishing"
      requirement: "Account for every formulation ingredient as its own exchange and reconcile recipe totals to dosing or stock records; do not replace chemicals with an aggregated recipe row."
      evidence: "approved recipe, SDS, dosing logs, stock reconciliation"
    - id: dq_route_consistency
      applies_to: "process map"
      requirement: "The declared market state and on-site route shall agree with included processes. Greige-only output shall not include unperformed coloration or finishing, and finished output shall not omit producer-operated treatment."
      evidence: "process flow sheet, lot route, outsourcing records, product declaration"
    - id: dq_source_traceability
      applies_to: "all calculated values"
      requirement: "Retain raw fields, units, conversions, factors, source ids, responsible person, and calculation version sufficient to reproduce every normalized exchange."
      evidence: "calculation workbook or machine-readable provenance record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm CPC 28190 scope, exclude pile and terry fabric, require all reference qualifiers, and fail UUID validation if the rejected greige-only UUID is used as the category-wide reference product."
    source_ids:
      - un-cpc-v3-28190
  - rule_id: validate_reference_mass
    applies_to: "reference amount"
    rule: "Confirm exactly 1 kg net dry saleable fabric, with moisture correction, packaging exclusion, and rejected-fabric exclusion documented."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_process_route
    applies_to: "process inventory"
    rule: "Every process marked conditional shall match the declared lot route; every producer-operated pretreatment, coloration, finishing, and on-site treatment step shall be present exactly once."
    source_ids:
      - eu-textiles-bat-2022-2508
      - khan-islam-2015
  - rule_id: validate_atomic_exchanges
    applies_to: "process inventory"
    rule: "Reject any exchange that combines multiple yarns, chemicals, energy carriers, fuels, refrigerants, wastes, destinations, or emissions; each selected flow shall represent one physical or chemical exchange."
    source_ids:
      - eu-textiles-bat-2022-2508
  - rule_id: validate_collection_links
    applies_to: "foreground amounts"
    rule: "Every foreground_record or calculated_value row shall link to a declared collection protocol and retain the raw record used to produce the normalized amount."
    source_ids:
      - eu-pef-method-2021
      - eu-textiles-bat-2022-2508
  - rule_id: validate_mass_balance
    applies_to: "fabric formation and wet processing"
    rule: "Check process-level mass balances and investigate unexplained differences; do not silently force the balance by changing the reference product amount."
    source_ids:
      - eu-textiles-bat-2022-2508
  - rule_id: validate_no_unsupported_ranges
    applies_to: "all inventory amounts"
    rule: "No quantitative range may be introduced from a single case, a repeated point value, or an abstract. A source-backed empirical range requires at least two independent, boundary-compatible original sources."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset representing factory-gate production of the declared knitted or crocheted fabric lot"
  downstream_use: "LCA process and lifecycle-model construction for products consuming CPC 28190 fabric, subject to matching composition, construction, finish state, technology, geography, period, and wastewater route"
  allowed_use: "Use as an intermediate fabric dataset when all required qualifiers and included routes match the downstream study"
  excluded_use: "Do not use for CPC 28110 pile or terry fabric, yarn, woven or nonwoven fabric, garments, cutting and sewing, or a finish state and fibre composition not represented by the dataset"
  required_metadata: "PCR id and version; product-flow identity status; CPC code; fibre composition; yarn and construction specification; width; areal density; finish state; process route; geography; reference year; technology; allocation; moisture basis; upstream datasets; wastewater destination"
  required_quality_disclosure: "Primary-data share; temporal, geographical and technological representativeness; meter and scale coverage; recipe completeness; mass-balance results; allocations; missing UUIDs; exclusions; outsourced steps; data gaps and uncertainty"
  update_trigger: "Change in fibre composition, construction, finish recipe, process technology, energy or water supply, wastewater route, allocation method, site configuration, reference year, or resolution of the exact Tiangong reference-product UUID"
