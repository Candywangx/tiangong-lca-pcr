system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins with yarn and other declared materials received at the fabric-production site and ends with net dry saleable fabric released at the factory gate. Include the actual formation and route-specific wet or dry processing performed by the producer. Upstream production of purchased yarn, water, electricity, steam, fuels, chemicals, and packaging is represented by linked upstream datasets and is not recreated inside the foreground inventory."
      source_ids: []
    - rule_id: boundary_route_disclosure
      applies_to: "all foreground datasets"
      rule: "Include only operations actually performed for the declared fabric lot and disclose every excluded or outsourced route step; do not model greige-only production as finished fabric production."
      source_ids:
        - un-cpc-v3-28190
        - eu-pef-method-2021
        - eu-textiles-bat-2022-2508
    - rule_id: boundary_atomic_recipes
      applies_to: "wet processing and finishing"
      rule: "Record every recipe chemical, dyestuff, pigment, binder, coating, auxiliary, fuel, refrigerant, waste stream, and elementary emission as its own exchange; the example cards below are a minimum process map, not a selector or aggregated carrier."
      source_ids:
        - eu-textiles-bat-2022-2508
    - rule_id: boundary_wastewater_treatment
      applies_to: "wastewater"
      rule: "Include on-site wastewater treatment when operated; otherwise record one wastewater waste flow to the identified off-site treatment dataset and avoid double counting treatment."
      source_ids:
        - eu-textiles-bat-2022-2508
boundary_abstraction:
  declared_starting_condition: "Yarn and separately purchased process materials received at the reporting site, with supplier identity, fibre composition, yarn form, quantity, moisture basis, and upstream dataset references declared"
  starting_condition_role: "Foreground gate for fabric formation; purchased same-category fabric is permitted only for a finishing-only route and must be disclosed as an intermediate product input"
  product_classification_scope: "CPC 3.0 28190 only; pile and terry knitted or crocheted fabric in CPC 28110 is outside scope"
  recursive_input_rule: "If greige or partly processed CPC 28190 fabric is purchased for further treatment, record it once as an atomic product input with an upstream dataset and do not recursively reproduce its earlier knitting inventory"
  upstream_dataset_requirement: "Use composition-, technology-, geography-, and period-representative datasets for every purchased yarn, material, utility, fuel, treatment service, and same-category fabric input"
  disclosure: "Declare which of knitting or crocheting, pretreatment, dyeing, printing, coating, lamination, thermal or mechanical finishing, inspection, and wastewater treatment are on-site, outsourced, absent, or already represented upstream"
