allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared_foreground_processes"
    rule: "Use product-line or process sub-metering and subdivision before allocation whenever records distinguish the declared product."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_comparable_units
    applies_to: "shared_cutting_and_assembly"
    rule: "When subdivision is unavailable, allocate shared records by accepted units only for materially and technologically comparable accessories, then convert to the 1 kg reference flow using measured unit mass; otherwise use a documented causal driver."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_energy_mix
    applies_to: "multiple_sites_or_energy_sources"
    rule: "Build a production-weighted electricity mix from measured kWh and production mass; do not assign a preferred mix to one product without physical metering or equivalent records."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_rework_and_waste
    applies_to: "rework_and_rejected_product"
    rule: "Return successful rework to its originating process without counting another finished output; assign waste treatment to the generating process and disclose downstream recycling-credit treatment."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_no_unrecorded_coproduct
    applies_to: "saleable_offcuts_or_by_products"
    rule: "Report every saleable offcut or by-product explicitly; attempt subdivision first and obtain methodology review before applying non-physical allocation."
    source_ids:
      - afw-pefcr-v3-1-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_issue
      process_id: "material_preparation_cutting"
      flow_role: "named leather, composition leather, and lining"
      record_type: "BOM, supplier specification, issue and return record"
      raw_fields: "product_id; batch_id; material_id; species; composition; tanning_route; finish; thickness; issued_mass; returned_mass; moisture_basis"
      collection_method: "reconcile production-order issues and returns against the approved BOM"
      unit: "kg"
      frequency: "each production order"
      temporal_coverage: "representative annual period and declared batch"
      site_scope: "every included cutting site"
      aggregation_rule: "sum net issued mass separately by atomic material row and divide by accepted product mass"
      quality_evidence: "signed BOM; supplier specification; calibrated scale; stock reconciliation"
    - protocol_id: cp_cutting_energy
      process_id: "material_preparation_cutting"
