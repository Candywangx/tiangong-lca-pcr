    required_unit: "kg"
    rule: "Convert counts using a measured mean mass for the exact component specification; retain item count, sample count, sample mass, mean mass, and calculation."
  - id: bom_mass_basis
    applies_to: "product bill of materials"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use a consistent dry or as-received basis, disclose that basis, and reconcile at least 95% of product weight plus 100% of leather, composition leather, lining, reinforcement, and metals."
