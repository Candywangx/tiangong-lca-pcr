  calculation_rules:
    - id: calc_net_material_input
      applies_to: "material and chemical rows"
      rule: "net material input = issued mass - verified return to stock"
      inputs:
        - "issued mass"
        - "returned mass"
      output: "kg named input per kg accepted product"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_area_to_mass
      applies_to: "leather records stated by area"
      rule: "leather mass = sampled area x batch-specific measured areal mass; do not use a generic leather conversion"
      inputs:
        - "sampled area"
        - "sampled mass"
        - "issued area"
      output: "kg exact leather per kg accepted product"
      source_ids: []
    - id: calc_item_component_mass
      applies_to: "counted hardware and packaging"
      rule: "component mass = item count x measured mean mass of the exact specified item"
      inputs:
        - "item count"
        - "sample count"
        - "sample mass"
      output: "kg named component per kg accepted product"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_assembly_loss
      applies_to: "cutting and rejected-product losses"
      rule: "reconcile BOM input with accepted product, verified returns, retained work in progress, and each measured composition-specific waste; report each residual above measurement uncertainty"
      inputs:
        - "BOM inputs"
        - "accepted mass"
        - returns
        - "work in progress"
        - "measured wastes"
      output: "kg loss and residual by atomic waste row"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_energy_normalization
      applies_to: "electricity and fuels"
      rule: "normalized energy = measured or causally allocated energy / accepted net product mass"
      inputs:
        - "meter delta or fuel energy"
        - "allocation driver"
        - "accepted mass"
      output: "kWh or MJ per kg accepted product"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_direct_combustion_emission
      applies_to: "named direct combustion emissions"
      rule: "emission = measured fuel quantity x disclosed approved factor unless a representative stack measurement is used; calculate each fuel and pollutant independently"
      inputs:
        - "measured fuel"
        - "net calorific value if required"
        - "factor or stack result"
      output: "kg named pollutant per kg accepted product"
      source_ids: []
    - id: calc_refrigerant_loss
      applies_to: "HFC-134a emission"
      rule: "loss = opening stock + purchases - closing stock - documented contained-inventory increase - recovered mass"
      inputs:
        - "opening and closing stock"
        - purchases
        - charges
        - recovery
        - "equipment inventory"
      output: "kg HFC-134a emitted per kg accepted product"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "complete foreground system"
      rule: "reconcile named inputs with accepted product, returns, work in progress, composition-specific wastes, measured wastewater and sludge, and stock changes; explain residual above declared uncertainty"
      inputs:
        - "all mass records and stock changes"
      output: "batch mass-balance statement and residual"
      source_ids:
        - afw-pefcr-v3-1-2025
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Use the exact CPC 28242 Product flow and retain a specification proving the item is a leather or composition-leather clothing accessory and not a sports glove or excluded product."
      evidence: "state-100 Tiangong identity; approved product specification; classification record"
    - id: dq_bom_coverage
      applies_to: "material inputs"
      requirement: "Cover at least 95% of product weight and 100% of leather, composition leather, lining, reinforcement, and metals; explain every uncovered share."
      evidence: "BOM coverage calculation; supplier specifications"
    - id: dq_leather_traceability
      applies_to: "leather inputs"
      requirement: "Record animal species, tanning route when known, surface finish, thickness, supplier, origin, and upstream dataset; never substitute furskin for leather without changing scope."
      evidence: "supplier declaration; purchase specification; traceability record"
    - id: dq_measurement
      applies_to: "foreground amounts"
      requirement: "Use calibrated instruments; retain raw readings, conversions, sampling basis, and measurement uncertainty or tolerance."
      evidence: "calibration certificates; raw meter and scale records; conversion worksheet"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use a representative annual administrative period or justify a shorter campaign; identify shutdown, start-up, rework, and abnormal rejection periods."
      evidence: "production calendar; utility period; batch list; representativeness assessment"
    - id: dq_completeness
      applies_to: "process and atomic flows"
      requirement: "Reconcile every included process and record each applicable material, utility, chemical, packaging item, waste, refrigerant, and emission separately; justify each not-applicable row."
      evidence: "route-to-inventory checklist; mass and energy reconciliation; exception log"
    - id: dq_supplier_geography
      applies_to: "upstream datasets"
      requirement: "Match materials, electricity, fuels, components, and packaging to supplier geography and technology when known; document proxies and consequences."
      evidence: "supplier declarations; invoices; dataset mapping log"
    - id: dq_uuid_status
      applies_to: "non-reference identities"
      requirement: "Leave a UUID blank until hybrid search and a direct state-code-100 read confirm the same atomic identity; review manifest inventory_uuid_review before publication."
      evidence: "dual-verification record or manifest omission reason"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "Fail if the reference UUID, exact CPC 28242 classification, Product flow type, Mass UUID, Units of mass UUID, or kg unit differs from this PCR."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_scope_exclusions
    applies_to: "product_identity"
    rule: "Fail if the product is a sports glove, leather garment, footwear, bag, wallet, purse, general-purpose strap, saddlery, headgear, furskin article, or accessory whose essential character is not leather or composition leather."
    source_ids:
      - un-cpc-3-2025
      - ec-access2markets-leather-classification
  - rule_id: validate_reference_amount
    applies_to: "finished_reference_product"
    rule: "Require exactly 1 kg accepted net finished product; exclude packaging mass and retain packaging in separate rows when used."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_required_qualifiers
    applies_to: "foreground_data_package"
    rule: "Fail completeness if an applicable required qualifier, specification revision, size, production site, period, edge-finishing route, or sports-glove exclusion is missing."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_bom_and_losses
    applies_to: "material_mass_balance"
    rule: "Require at least 95% BOM coverage, all leather/composition leather/lining/reinforcement/metals, and reconciliation of returns, work in progress, cutting waste, hardware scrap, finishing residue, and rejected product."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_atomic_inventory
    applies_to: "process_inventory"
    rule: "Fail if a selected flow combines multiple materials, electricity with another utility, multiple fuels, multiple refrigerants, multiple chemicals, multiple packaging materials, multiple waste identities, or multiple elementary emissions."
    source_ids: []
  - rule_id: validate_conditional_routes
    applies_to: "conditional_processes"
    rule: "Require route records or a documented not-applicable decision for finishing, each fuel, refrigerant, wastewater, sludge, and direct emission; do not infer their use from sector averages."
    source_ids:
      - csir-clri-leather-goods-2016
      - afw-pefcr-v3-1-2025
  - rule_id: validate_uuid_dual_check
    applies_to: "non_reference_uuid"
    rule: "Fail if a non-reference UUID is populated without both a matching hybrid-search result and direct state-code-100 read for the same atomic flow."
    source_ids: []
  - rule_id: validate_no_invented_quantities
    applies_to: "foreground_amounts"
    rule: "Require collected foreground records or declared calculations; fail uncited defaults, reasoned estimates, AI-generated values, and unsupported ranges."
    source_ids: []
  - rule_id: validate_bilingual_alignment
    applies_to: "localized_markdown"
    rule: "Require identical ordered process ids, row ids, selected flows, UUIDs, controlled amount fields, rule ids, source ids, and source records in English and Chinese."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for a declared CPC 28242 leather or composition-leather clothing accessory"
  downstream_use: "secondary_dataset; background_dataset after review of product, geography, technology, period, and data quality"
  allowed_use: "Product-specific process modelling, supply-chain LCA, lifecycle-model construction, and product-footprint studies; comparison only for equivalent function, accessory type, material, boundary, geography, technology, allocation, and data quality"
  excluded_use: "Consumer-use or maintenance modelling without a separate use-stage model; sports gloves; excluded leather products; substitution for tanning or composition-leather production; unqualified comparisons; treating candidate UUIDs as confirmed"
  required_metadata: "PCR id and version; CPC code; accessory type; leather or composition-leather identity; species; tanning and finish; thickness; BOM and coverage; size; hardware; construction; edge finish; site and geography; period; route; packaging; allocation; sources; Tiangong identity status"
  required_quality_disclosure: "Foreground versus upstream data share; meter and scale coverage; BOM coverage; leather traceability; temporal representativeness; supplier geography; allocations; mass-balance residual; waste destinations; conditional-row decisions; unresolved UUIDs and dataset proxies"
  update_trigger: "Change in product scope, material identity, leather species or finish, BOM, size, construction, manufacturing route, site, suppliers, energy system, finishing chemistry, packaging, allocation, treatment route, reference-flow identity, or material evidence"
