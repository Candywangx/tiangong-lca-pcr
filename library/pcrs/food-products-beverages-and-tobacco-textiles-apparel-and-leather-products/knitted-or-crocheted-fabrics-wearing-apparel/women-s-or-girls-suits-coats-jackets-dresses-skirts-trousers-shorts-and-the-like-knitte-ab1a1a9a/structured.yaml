system_boundary:
  rules:
    - rule_id: boundary_required_operations
      applies_to: "All foreground packages"
      rule: "Include pattern cutting, sewing and assembly, pressing, inspection, and sale packaging when performed by or for the reporting facility; include garment-level wet finishing only when it occurs for the declared product."
