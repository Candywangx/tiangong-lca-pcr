  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "Every inventory row"
      rule: "Normalized amount = period or lot exchange amount / accepted net finished-garment mass for the same scope"
      inputs:
        - "Atomic exchange record"
        - cp_final_output.net_garment_mass_kg
      output: "Exchange amount per 1 kg net accepted finished garment"
      source_ids:
        - eu-ef-recommendation-2021
    - id: calc_component_mass
      applies_to: "garment_button, garment_zipper, garment_care_label, corrugated_carton, ldpe_bag, paper_hangtag"
      rule: "Component mass = net issued component count × measured unit mass for the same specification"
      inputs:
        - "Count issued"
        - "count returned"
        - "count rejected"
        - "sample mass"
        - "sample count"
      output: "kg of the named component"
      source_ids:
        - eu-textiles-bat-2022-2508
    - id: calc_material_balance
      applies_to: "Cutting, assembly, wet finishing, pressing, and packaging"
      rule: "Reconcile measured inputs = accepted outputs + waste outputs + net stock change + quantified process loss; investigate and disclose material residuals"
      inputs:
        - "Process input"
        - output
        - waste
