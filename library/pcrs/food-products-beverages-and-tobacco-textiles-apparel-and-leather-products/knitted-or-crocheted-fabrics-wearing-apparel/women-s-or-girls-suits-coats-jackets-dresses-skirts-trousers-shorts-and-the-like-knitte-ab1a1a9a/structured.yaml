  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and all product inputs"
      requirement: "Retain style, size assortment, fibre composition, fabric construction, trim specification, chemical identity, packaging specification, supplier, geography, and production period sufficient to select one real upstream flow for each exchange."
      evidence: "Approved bill of materials; supplier specifications; batch and lot records; unsd-cpc-v3-2025"
    - id: dq_primary_manufacturing
      applies_to: "All foreground processes"
      requirement: "Use company-specific measurements and records for manufacturing exchanges. A proxy or modelled value must be separately identified, justified, and excluded from a claim of complete primary coverage."
      evidence: "Meter logs; invoices; issue/return records; batch tickets; eu-ef-recommendation-2021"
    - id: dq_temporal
      applies_to: "All records"
      requirement: "Cover a continuous period representative of normal production, normally at least twelve months when available; disclose start/end dates, shutdowns, abnormal operations, and style-mix changes."
      evidence: "Reporting-period register; production calendar; exception log"
    - id: dq_completeness
      applies_to: "Inputs, outputs, wastewater, waste, and direct emissions"
      requirement: "Demonstrate process-level input/output reconciliation and account separately for each material, chemical, energy carrier, waste type, and relevant direct emission."
      evidence: "Mass and energy balance; waste tickets; emission calculations; eu-textiles-bat-2022-2508"
    - id: dq_measurement
      applies_to: "Metered, weighed, counted, and laboratory data"
      requirement: "Retain instrument identity, calibration or verification evidence, sampling method, unit conversion, and any count-to-mass sample basis."
      evidence: "Calibration certificates; laboratory reports; sampling and conversion worksheets"
    - id: dq_route_disclosure
      applies_to: "Conditional wet finishing and steam/fuel routes"
      requirement: "State whether each conditional route occurred. Do not report zero as measured use when the correct state is not applicable."
      evidence: "Route declaration; recipe register; equipment and utility records"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference product"
    rule: "Require exact product flow UUID 06ca6094-ac7b-482e-a629-0def31609f23, Mass property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, kg unit, CPC 28223 scope, and all required qualifiers."
    source_ids:
      - unsd-cpc-v3-2025
  - rule_id: validate_reference_mass
    applies_to: "Reference output and packaging"
    rule: "Require normalized reference output of exactly 1 kg net accepted garment mass and verify that sale-packaging mass is reported separately."
    source_ids:
      - eu-ef-recommendation-2021
  - rule_id: validate_atomic_inventory
    applies_to: "All inventory cards"
    rule: "Reject a card that combines more than one material, chemical, energy carrier, waste stream, or elementary emission; electricity, steam, and natural gas must remain distinct."
    source_ids:
      - eu-textiles-bat-2022-2508
  - rule_id: validate_process_coverage
    applies_to: "Foreground process map"
    rule: "Require cutting, assembly, pressing/inspection, and packaging records; require wet-finishing records when the declared route includes washing, dyeing, softening, or another wet process."
    source_ids:
      - ec-apparel-footwear-pefcr-2025
      - ijlc-lyocell-dress-2026
  - rule_id: validate_material_balance
    applies_to: "Each process and reporting period"
    rule: "Require a documented input/output balance and investigate unexplained residuals before the package is considered complete."
    source_ids:
      - eu-textiles-bat-2022-2508
  - rule_id: validate_uuid_evidence
    applies_to: "Every UUID-bearing inventory row"
    rule: "Accept a Tiangong UUID only when the selected record has exact semantic identity and direct public state100 confirmation; otherwise require the UUID to be absent and the identity gap to remain in manifest review metadata."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "Shared facility data"
    rule: "Require subdivision or a documented causal allocation driver and reject undocumented mass allocation or unallocated shared utilities."
    source_ids:
      - eu-ef-recommendation-2021
  - rule_id: validate_data_quality
    applies_to: "Foreground package"
    rule: "Require source period, site scope, meter and scale evidence, component conversion records, wastewater evidence where applicable, waste destinations, route disclosure, and explicit data gaps."
    source_ids:
      - eu-textiles-bat-2022-2508
      - eu-ef-recommendation-2021
published_dataset_profile:
  dataset_role: "Factory-gate foreground manufacturing dataset for one declared CPC 28223 garment product or defensible production mix"
  downstream_use: "secondary_dataset; background_dataset after independent review and publication controls"
  allowed_use: "Product LCA, apparel life-cycle modelling, product-footprint studies, supply-chain inventory, hotspot analysis, and comparison only when functional equivalence, product specification, geography, period, and data quality are compatible"
  excluded_use: "Consumer-use or service-life claims without downstream use-stage modelling; representation of non-knitted or non-crocheted garments; substitution across materially different fibre, trim, wet-finishing, packaging, geography, or technology profiles without disclosed scenario analysis"
  required_metadata: "Canonical PCR id; reference UUIDs; CPC coordinate; style and size mix; fibre and trim composition; production route; facility geography; reporting period; net garment mass; sale packaging; recycled content; wet-finishing applicability; utility supply; waste destinations; allocation method; source ids"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; sampling and conversion methods; material-balance residuals; missing UUIDs; upstream proxies; conditional-route coverage; temporal and geographic representativeness; allocation drivers; verification status"
  update_trigger: "Material change in product specification, fibre or trim composition, wet-finishing recipe, facility or equipment, energy or steam supply, waste route, packaging, allocation method, source evidence, reference UUID, or a reporting period no longer representative of current production"
