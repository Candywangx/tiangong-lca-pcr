        - eu-textiles-bat-2022-2508
    - rule_id: boundary_upstream_separation
      applies_to: "Fabric, trims, chemicals, utilities, and packaging"
      rule: "Keep upstream production in linked datasets and retain the actual supplier, geography, technology, and recycled-content attributes needed to select them."
      source_ids:
        - eu-ef-recommendation-2021
    - rule_id: boundary_downstream_exclusion
      applies_to: "Distribution, retail, use, and end-of-life"
      rule: "Exclude these stages from the foreground factory-gate package and disclose that a complete apparel life-cycle assessment must connect them downstream."
