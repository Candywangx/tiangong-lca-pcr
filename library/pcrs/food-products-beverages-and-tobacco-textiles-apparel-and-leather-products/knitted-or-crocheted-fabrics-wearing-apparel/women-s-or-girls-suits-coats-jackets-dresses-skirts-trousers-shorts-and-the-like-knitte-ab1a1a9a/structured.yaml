allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared production lines, utilities, and treatment systems"
    rule: "Avoid allocation through subdivision, process-specific metering, batch records, and separate waste measurement wherever practicable."
    source_ids:
      - eu-ef-recommendation-2021
      - eu-textiles-bat-2022-2508
  - rule_id: allocation_causal_driver
    applies_to: "Shared inputs and outputs that cannot be subdivided"
    rule: "Use a documented causal driver: machine operating time or metered load for electricity, metered steam or heat demand for steam, batch load and recipe for wet-finishing inputs and wastewater, and measured output or waste mass for material balances. Mass allocation is allowed only when the affected products use the shared operation in materially equivalent ways and this is demonstrated."
    source_ids:
      - eu-ef-recommendation-2021
  - rule_id: allocation_scrap
    applies_to: "Textile and packaging wastes sent for recycling or recovery"
    rule: "Report the waste mass and destination at the foreground boundary. Do not credit avoided production inside this factory-gate package; any recycling benefit or burden is modelled transparently in the downstream life-cycle scenario."
    source_ids:
      - eu-ef-recommendation-2021
  - rule_id: allocation_rework
    applies_to: "Rework that returns within the same reporting period"
    rule: "Keep internal rework inside the process balance and count only unrecovered rejected material as waste. Disclose rework rates and prevent double counting of intermediate garment mass."
    source_ids:
      - eu-textiles-bat-2022-2508
