    used_for: "Functional-unit/reference-flow discipline, foreground data, completeness, allocation, electricity, data quality, and validation principles."
  - id: "af-pefcr-3-1-2025"
    type: "standard"
    reference: "Technical Secretariat for Apparel and Footwear, *Product Environmental Footprint Category Rules: Apparel and Footwear*, version 3.1, 29 April 2025. Official project record: https://pefapparelandfootwear.eu/afw_pefcr_v3-1_final/ (retrieved 2026-08-13)."
    used_for: "Apparel process decomposition; knitting, seamless forming, finishing, assembly, packaging, BOM, manufacturing loss, primary-data, allocation, and quality rules."
  - id: "jrc-textiles-bref-2023"
