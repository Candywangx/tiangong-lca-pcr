allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "all foreground processes"
    rule: "Avoid allocation by product-specific orders, meters, machine runtime, and waste records. Where subdivision is not feasible, document the shared process, products, reporting period, denominator, and sensitivity."
    source_ids:
      - ec-pef-method-2021
      - af-pefcr-3-1-2025
  - rule_id: allocation_rule_2
    applies_to: "knitting and finishing"
    rule: "Allocate shared yarn-forming, knitting, and finishing material and energy burdens by measured conforming mass; allocate multi-site electricity using a production-mass-weighted average unless product-specific metering is available."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: allocation_rule_3
    applies_to: "assembly and sewing"
    rule: "Allocate shared assembly and sewing activity by quality-accepted garment units when unit-level runtime or records are unavailable, then convert to the 1 kg reference basis using the measured mass of the represented product and size mix."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: allocation_rule_4
    applies_to: "wastes and recovered materials"
    rule: "Assign collection and treatment burdens to the process generating the waste. Do not credit recycling or energy recovery inside this foreground dataset unless a separately documented downstream model applies a consistent circularity method without double counting."
    source_ids:
      - ec-pef-method-2021
      - af-pefcr-3-1-2025
  - rule_id: allocation_rule_5
    applies_to: "co-products"
    rule: "No co-product is normally produced. If a saleable secondary product occurs, first subdivide its process; if subdivision is infeasible, apply a documented physical relation that reflects causality and report the result separately from waste."
    source_ids:
      - ec-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_p1_material_energy_records
      process_id: "p1_knit_forming"
      flow_role: "yarn, electricity, compressed air, lubricating oil"
      record_type: "warehouse issues, returns, meters, runtime logs, maintenance and inventory records"
      raw_fields: "order_id; batch_id; row_id; material_id; opening_quantity; receipts; issued_quantity; returned_quantity; closing_quantity; meter_start; meter_end; runtime; output_mass"
      collection_method: "calibrated scales and meters reconciled to inventory and production orders"
      unit: "kg; kWh; m3"
      frequency: "each batch, with monthly reconciliation"
      temporal_coverage: "representative reporting period, normally 12 consecutive months"
      site_scope: "each forming site and machine group"
      aggregation_rule: "net consumed quantity divided by conforming intermediate mass; keep each row_id separate"
      quality_evidence: "calibration records; invoices; lot traceability; meter logs; production order"
    - protocol_id: cp_p1_output_waste_records
      process_id: "p1_knit_forming"
      flow_role: "conforming intermediates, yarn waste, waste oil, fibre dust"
      record_type: "transfer weights, waste tickets, dust measurements, exhaust records"
      raw_fields: "batch_id; row_id; accepted_mass; waste_mass; destination; concentration; exhaust_volume; capture_efficiency"
      collection_method: "scales, waste-transfer records, and measured exhaust data"
      unit: "kg; m3"
      frequency: "each batch or monitoring event"
      temporal_coverage: "same reporting period as process inputs"
      site_scope: "each forming site"
      aggregation_rule: "sum accepted output and each waste/emission separately; normalize to accepted intermediate mass"
      quality_evidence: "scale calibration; transfer note; laboratory and ventilation records"
    - protocol_id: cp_p2_cutting_records
      process_id: "p2_cutting"
      flow_role: "fabric, paper, electricity, panels, textile offcuts, waste paper"
      record_type: "fabric issue and return, marker report, meter, panel transfer, waste ticket"
      raw_fields: "order_id; row_id; fabric_mass; fabric_area; grammage; marker_efficiency; paper_mass; electricity; accepted_panel_mass; waste_mass; destination"
      collection_method: "calibrated scales, cutting software, meters, and waste records"
      unit: "kg; m2; kWh"
      frequency: "each cutting order"
      temporal_coverage: "representative reporting period, normally 12 consecutive months"
      site_scope: "each cutting site and line"
      aggregation_rule: "reconcile fabric input to accepted panels, returned usable fabric, and textile waste; keep paper balance separate"
      quality_evidence: "marker file; calibration; meter log; transfer and waste tickets"
    - protocol_id: cp_p3_assembly_records
      process_id: "p3_assembly"
      flow_role: "panels, garment bodies, individual trims, electricity, compressed air, oil, assembled product, wastes, VOC"
      record_type: "order BOM, material issues, piece counts, meter/runtime, output and waste records, formulation composition"
      raw_fields: "order_id; row_id; input_mass; count; unit_mass; length; mass_per_length; electricity; air_volume; accepted_mass; reject_mass; volatile_fraction; capture_efficiency"
      collection_method: "BOM reconciliation, calibrated scales, counters, meters, and verified calculation inputs"
      unit: "kg; piece; m; kWh; m3"
      frequency: "each production order, with monthly reconciliation"
      temporal_coverage: "representative reporting period, normally 12 consecutive months"
      site_scope: "each assembly site and line"
      aggregation_rule: "calculate each atomic trim separately; normalize to accepted assembled mass"
      quality_evidence: "technical pack; BOM; scale and meter calibration; issue and return records; waste ticket"
    - protocol_id: cp_p4_finishing_records
      process_id: "p4_finishing"
      flow_role: "garment input/output, water, hot water, steam, gas, electricity, each chemical, refrigerant, wastes and emissions"
      record_type: "batch formulation, meters, fuel invoices, product transfer, effluent laboratory, waste and refrigerant service records"
      raw_fields: "batch_id; row_id; input_mass; accepted_mass; water_volume; hot_water_mass; temperatures; steam_mass; pressure; condensate_return; gas_volume; heating_value; electricity; chemical_issue; chemical_return; wastewater_volume; pollutant_concentration; refrigerant_opening; refrigerant_added; refrigerant_closing; refrigerant_recovered"
      collection_method: "calibrated meters and scales, batch dosing, laboratory testing, and service-record reconciliation"
      unit: "kg; m3; kWh; MJ"
      frequency: "each batch or monitoring event, with monthly reconciliation"
      temporal_coverage: "representative reporting period, normally 12 consecutive months"
      site_scope: "each finishing site and line"
      aggregation_rule: "normalize each atomic exchange to accepted finished-garment mass; flow-weight effluent concentrations"
      quality_evidence: "calibration; formulation; invoice; laboratory certificate; waste manifest; refrigerant service log"
    - protocol_id: cp_p5_quality_packaging_records
      process_id: "p5_quality_packaging"
      flow_role: "garment input/output, electricity, steam, diesel, each packaging component, rejects, packaging wastes and combustion emissions"
      record_type: "inspection report, meters, fuel issue, packaging BOM, piece counts, scale and waste records"
      raw_fields: "order_id; row_id; input_mass; accepted_mass; reject_mass; electricity; steam_mass; diesel_volume; heating_value; packaging_count; unit_mass; waste_mass; destination"
      collection_method: "calibrated scales and meters, inspection records, packaging counts, and fuel reconciliation"
      unit: "kg; piece; kWh; MJ"
      frequency: "each order, with monthly reconciliation"
      temporal_coverage: "representative reporting period, normally 12 consecutive months"
      site_scope: "each final inspection and packing site"
      aggregation_rule: "normalize each atomic input, waste, and calculated emission to 1 kg accepted reference output"
      quality_evidence: "inspection report; packaging specification; calibration; invoice; fuel log; waste ticket"
  calculation_rules:
    - id: calc_rule_1
      applies_to: "all inventory rows"
      rule: "normalized amount = net attributable exchange amount / net conforming process output mass; for the final process use net accepted CPC 28228 product mass."
      inputs:
        - "atomic row amount"
        - "conforming output mass"
      output: "amount per kg process or reference output"
      source_ids:
        - ec-pef-method-2021
    - id: calc_rule_2
      applies_to: "material mass balance"
      rule: "input textile and trim mass = conforming transferred product mass + separately recorded waste mass + measured stock change; investigate unexplained residuals before release."
      inputs:
        - "material issues and returns"
        - "accepted output"
        - waste
        - "stock change"
      output: "mass-balance residual and reconciliation status"
      source_ids:
        - af-pefcr-3-1-2025
    - id: calc_rule_3
      applies_to: "fabric conversion"
      rule: "fabric mass = measured fabric area × actual conditioned grammage; retain both raw fields and reconcile with scale or invoice mass."
      inputs:
        - area
        - grammage
        - "conditioning state"
      output: "fabric mass"
      source_ids:
        - af-pefcr-3-1-2025
    - id: calc_rule_4
      applies_to: "unit-count trims and packaging"
      rule: "mass = installed or used count × measured unit mass; for length-based inputs use applied length × measured mass per length."
      inputs:
        - "piece count or length"
        - "measured unit mass"
      output: "trim or packaging mass"
      source_ids:
        - af-pefcr-3-1-2025
    - id: calc_rule_5
      applies_to: "combustion emissions"
      rule: "emission mass = measured fuel energy or mass × documented fuel- and equipment-specific emission factor; preserve factor source, heating value, oxidation basis, and pollutant species."
      inputs:
        - "fuel record"
        - "heating value"
        - "emission factor"
      output: "separate mass for each elementary emission row"
      source_ids:
        - ec-pef-method-2021
    - id: calc_rule_6
      applies_to: "effluent pollutant loads"
      rule: "pollutant load = sum of discharge volume interval × matched flow-weighted concentration; report each pollutant separately at the declared treatment boundary."
      inputs:
        - "discharge volume"
        - concentration
        - "sampling time"
        - "treatment boundary"
      output: "kg pollutant discharged"
      source_ids:
        - jrc-textiles-bref-2023
    - id: calc_rule_7
      applies_to: "refrigerant leakage"
      rule: "allocated leakage = opening charge + make-up − closing charge − recovered refrigerant, with allocation based on measured chiller service to the finishing process."
      inputs:
        - "charge inventory"
        - "service additions"
        - recovery
        - "service allocation"
      output: "kg R-410A to air"
      source_ids:
        - ec-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and reference flow"
      requirement: "Verify garment classification, knitted/crocheted construction, route, fibre composition, reference size or size mix, finish, packaging, and the three reference UUIDs."
      evidence: "technical pack; BOM; label specification; state-code-100 Tiangong readback"
    - id: dq_bom
      applies_to: "product material composition"
      requirement: "Provide primary mass data for at least 95% of the BOM and 100% of main fabrics, lining, padding, electronic parts, and metals; identify the residual composition and method."
      evidence: "product-specific BOM, supplier records, and scale records; af-pefcr-3-1-2025"
    - id: dq_technology
      applies_to: "each process"
      requirement: "Record actual technology, location, route applicability, outsourcing, and supplier-embedded processing; do not apply a route row to a demonstrably absent operation."
      evidence: "process map; equipment list; audit or technical pack"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Use one coherent representative period, normally 12 consecutive months, and align inputs, outputs, stock changes, production, and waste records."
      evidence: "dated meters, invoices, production reports, and inventory reconciliation"
    - id: dq_measurement
      applies_to: "mass, energy, water, fuel, emissions"
      requirement: "Retain calibration, measurement resolution, conversion factors, sampling methods, detection limits, and missing-data treatment."
      evidence: "calibration certificates; meter register; laboratory reports; calculation workbook"
    - id: dq_completeness
      applies_to: "inventory coverage"
      requirement: "Include all applicable atomic product, waste, and elementary flows; document and justify every excluded process or exchange and quantify the potential completeness effect."
      evidence: "signed completeness checklist, mass and energy balances, waste register; ec-pef-method-2021"
    - id: dq_uuid
      applies_to: "unresolved non-reference identities"
      requirement: "Keep UUID cells blank until an exact flow, property, unit, and compartment are confirmed; resolve manifest row_id gaps before reviewed publication."
      evidence: "state-code-100 direct readback and reviewer decision"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference flow"
    rule: "Require exactly 1 kg output of 243b28b7-df13-4d19-a301-cdad8781f93b with Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and all required qualifiers."
    source_ids:
      - un-cpc-3-0-structure-2023
  - rule_id: validation_rule_2
    applies_to: "semantic scope"
    rule: "Confirm that the product is a knitted or crocheted track suit, ski suit, swimwear item, or other knitted/crocheted garment n.e.c.; reject woven/non-knitted garments and products explicitly classified in another garment category."
    source_ids:
      - un-cpc-3-0-structure-2023
  - rule_id: validation_rule_3
    applies_to: "route coverage"
    rule: "Require all actual foreground steps and prohibit simultaneous application of mutually exclusive cut-and-sew and seamless intermediate outputs without a documented production mix."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: validation_rule_4
    applies_to: "atomic inventory"
    rule: "Require each card to resolve to one specific exchange; reject collection labels, combined utilities, combined chemicals, combined packaging, or combined waste/emission rows."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validation_rule_5
    applies_to: "process mass balance"
    rule: "Require reconciled input, conforming output, waste, return, and stock-change masses for forming, cutting, assembly, finishing, and final inspection; flag unexplained residuals."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: validation_rule_6
    applies_to: "utilities and emissions"
    rule: "If natural gas or diesel is reported, require separate direct combustion-emission rows or a documented controlled-equipment boundary; if R-410A make-up is reported, require a reconciled leakage or recovery explanation."
    source_ids:
      - ec-pef-method-2021
      - jrc-textiles-bref-2023
  - rule_id: validation_rule_7
    applies_to: "BOM and primary data"
    rule: "Require the dq_bom primary-data coverage, product weight, assembly-loss evidence, manufacturing technology and energy records when applicable."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: validation_rule_8
    applies_to: "evidence and identity gaps"
    rule: "Reject fabricated quantities and unverified UUIDs; accept absent quantities only as foreground collection requirements and keep unresolved non-reference identities explicit in manifest review metadata."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validation_rule_9
    applies_to: "boundary and double counting"
    rule: "Confirm that supplier-embedded knitting, dyeing, coating, finishing, packaging, transport, and waste treatment are not duplicated in the foreground inventory or upstream datasets."
    source_ids:
      - af-pefcr-3-1-2025
published_dataset_profile:
  dataset_role: "Foreground product-manufacturing dataset for finished knitted or crocheted garments in this PCR scope."
  downstream_use: "May be used as a secondary_dataset or background_dataset in process and lifecyclemodel projections after identity, completeness, quality, and review gates pass."
  allowed_use: "Factory-gate modelling of a declared garment, route, size basis, formulation, finish, geography, technology, reporting period, and packaging configuration; aggregation only across transparently weighted compatible products and routes."
  excluded_use: "Consumer-use service claims, lifetime or wear comparisons, woven garments, another garment category, an undisclosed fibre/finish mix, or comparative assertions beyond the represented product, geography, technology, and period."
  required_metadata: "PCR id and version; reference UUIDs; garment type; fibre composition; knit/crochet construction; route; size basis; grammage where relevant; finish; trims; packaging; location; technology; reporting period; system boundary; allocation; upstream datasets; waste destinations; review status."
  required_quality_disclosure: "Primary-data coverage; BOM coverage; metering and allocation shares; mass-balance residuals; missing data; unresolved UUIDs; source and dataset representativeness; exclusions; uncertainty; verification status."
  update_trigger: "Material change in product scope, reference identity, BOM, construction, route, finish chemistry, site technology, electricity or fuel supply, packaging, allocation, regulation, source methodology, or foreground data older than the declared representativeness period."
