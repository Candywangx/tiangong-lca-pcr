    role: "Form knitted or crocheted intermediates and record yarn losses and forming utilities."
    quantitative_reference: "kg conforming knitted intermediate"
  - id: p2_cutting
    name: "Fabric inspection, marker making, and cutting"
    inclusion: "conditional"
    inclusion_condition: "Include for cut-and-sew routes using purchased or on-site produced knitted/crocheted fabric."
    role: "Convert fabric to identified garment panels and quantify marker and defect losses."
    quantitative_reference: "kg cut panels"
  - id: p3_assembly
    name: "Sewing, linking, trim attachment, and seam sealing"
    inclusion: "required"
    inclusion_condition: "Include all applicable assembly operations; seamless products shall still include linking, trim attachment, and other actual assembly steps."
    role: "Produce an assembled garment from panels or a seamless body and individual trims."
    quantitative_reference: "kg assembled garment"
  - id: p4_finishing
    name: "Garment washing, printing, coating, heat treatment, and finishing"
    inclusion: "conditional"
    inclusion_condition: "Include each actual wet or dry garment finishing operation performed after assembly or on formed intermediates."
    role: "Apply declared appearance or performance finishes and record water, chemicals, energy, effluent, wastes, and direct emissions."
    quantitative_reference: "kg finished garment before packaging"
  - id: p5_quality_packaging
    name: "Inspection, pressing, repair, packing, and internal handling"
    inclusion: "required"
    inclusion_condition: "Include final inspection and the actual pressing, repair, packaging, and on-site fuel use."
    role: "Deliver quality-accepted packaged factory-gate product."
    quantitative_reference: "1 kg reference product"
