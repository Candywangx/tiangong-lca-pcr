allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all foreground processes"
    rule: "First avoid allocation through batch separation, sub-metering, separate stock issue and direct waste weighing."
    source_ids:
      - iso-14044-2006
      - ec-pef-2021-2279
  - rule_id: allocation_cutting_mass
    applies_to: "cutting and material losses"
    rule: "Assign fabrics, interlining and cutting losses by measured mass for the declared style and production batch; preserve material composition in each waste output."
    source_ids:
      - afw-pefcr-3-1
  - rule_id: allocation_assembly_unit
    applies_to: "sewing and assembly"
    rule: "Allocate shared sewing and assembly activity by units processed, then convert to the 1 kg reference flow using the measured item count and net mass per item."
    source_ids:
      - afw-pefcr-3-1
  - rule_id: allocation_finishing_mass
    applies_to: "finishing"
    rule: "Allocate shared finishing burdens by measured product mass when products receive the same route; separate products with different washing, printing, embellishment or pressing routes before allocation."
    source_ids:
      - afw-pefcr-3-1
  - rule_id: allocation_shared_energy
    applies_to: "shared equipment and services"
    rule: "Use process sub-metering first; otherwise use documented machine operating time multiplied by rated power. Use mass throughput only when products have demonstrably equivalent processing intensity."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_waste
    applies_to: "offcuts, rejects and packaging scrap"
    rule: "Report waste at the process where it arises with measured composition, mass and treatment destination. Do not subtract an avoided-product credit inside this foreground inventory unless the downstream study method explicitly requires and discloses it."
    source_ids:
      - iso-14044-2006
      - afw-pefcr-3-1
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "p1_cutting_p2_assembly"
      flow_role: "fabrics, interlining, thread and trims"
      record_type: "BOM, stock issue, return and purchase records"
      raw_fields: "material identity; composition; supplier; lot; issued mass or count; unused return; unit mass or linear mass"
      collection_method: "reconcile product BOM with warehouse issue and return records"
      unit: "kg, item, m"
      frequency: "each batch"
      temporal_coverage: "representative production period"
      site_scope: "all reporting-factory material stores and lines"
      aggregation_rule: "sum net issued amount by atomic material and normalize to conforming net output"
      quality_evidence: "approved BOM; supplier specification; calibrated scale record; stock reconciliation"
    - protocol_id: cp_cutting_mass_balance
      process_id: "p1_cutting"
      flow_role: "cut components and material-specific offcuts"
      record_type: "lay, marker, cut-output and waste records"
      raw_fields: "input mass by material; marker efficiency; accepted cut mass; offcut mass; cutting reject mass"
      collection_method: "weigh inputs, accepted components and segregated offcuts for the same batch"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative production period"
      site_scope: "all cutting lines in scope"
      aggregation_rule: "reconcile each material input to accepted components, returns, offcuts and rejects"
      quality_evidence: "marker report; calibrated scale record; waste ticket; signed batch reconciliation"
    - protocol_id: cp_assembly_records
      process_id: "p2_assembly"
      flow_role: "assembled products, trims and assembly losses"
      record_type: "line production and material-consumption records"
      raw_fields: "item count; net mass per item; accepted output mass; thread issue and return; fastener count; label count; rejects"
      collection_method: "reconcile line output with component and trim records"
      unit: "kg, item"
      frequency: "each batch or shift"
      temporal_coverage: "representative production period"
      site_scope: "all assembly lines in scope"
      aggregation_rule: "aggregate by style and route, then convert unit-based activity to 1 kg net output"
      quality_evidence: "line production log; BOM; quality disposition; calibrated scale record"
    - protocol_id: cp_process_electricity
      process_id: "p1_cutting_p2_assembly_p3_finishing_qc_p4_packaging"
      flow_role: "process electricity"
      record_type: "meter, equipment and operating-time records"
      raw_fields: "meter start and end; machine identifier; rated power; operating time; products processed; downtime"
      collection_method: "sub-meter directly or calculate power multiplied by operating time"
      unit: "kWh"
      frequency: "batch, shift or monthly meter interval"
      temporal_coverage: "representative production period"
      site_scope: "all included equipment and shared services"
      aggregation_rule: "subtract documented non-production load and allocate by the approved process rule"
      quality_evidence: "meter certificate; bill reconciliation; equipment plate; operating log"
    - protocol_id: cp_finishing_and_qc
      process_id: "p3_finishing_qc"
      flow_role: "finishing inputs, outputs and wastewater"
      record_type: "recipe, meter, batch, quality and discharge records"
      raw_fields: "route; input mass; electricity; steam; water; each chemical; output mass; wastewater; rework; rejects"
      collection_method: "collect only for operations actually performed and reconcile each wet batch"
      unit: "kg, kWh"
      frequency: "each finishing batch"
      temporal_coverage: "representative production period"
      site_scope: "all included finishing and inspection operations"
      aggregation_rule: "aggregate separately by finishing route before normalizing"
      quality_evidence: "batch recipe; meter record; chemical issue; discharge record; inspection report"
    - protocol_id: cp_quality_and_rework
      process_id: "p2_assembly_p3_finishing_qc"
      flow_role: "rejects and rework"
      record_type: "defect and disposition records"
      raw_fields: "defect code; item count; mass; repair action; re-entry process; final disposition"
      collection_method: "track each failed unit to rework completion or waste exit"
      unit: "item, kg"
      frequency: "each batch"
      temporal_coverage: "representative production period"
      site_scope: "all included assembly and finishing lines"
      aggregation_rule: "count rework once and exclude only recovered rework from waste"
      quality_evidence: "quality report; rework traveller; waste transfer ticket"
    - protocol_id: cp_packaging_and_release
      process_id: "p4_packaging"
      flow_role: "packaging and reference output"
      record_type: "packing specification, issue, count, mass and release records"
      raw_fields: "product count; net mass; packaging type; piece count; unit mass; packaging scrap; released mass"
      collection_method: "reconcile packing material issue and packed-product release"
      unit: "kg, item"
      frequency: "each batch"
      temporal_coverage: "representative production period"
      site_scope: "all packaging lines and factory-gate releases"
      aggregation_rule: "allocate grouped cartons by contained product count and normalize packaging separately to 1 kg net product"
      quality_evidence: "packing specification; scale record; warehouse release; scrap record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground exchanges"
      rule: "normalized exchange = period exchange / conforming net product mass; set the reference output to exactly 1 kg."
      inputs:
        - "period exchange"
        - "conforming net released mass"
      output: "exchange per 1 kg net product"
      source_ids:
        - ec-pef-2021-2279
    - id: calc_cutting_mass_balance
      applies_to: "each fabric and interlining material"
      rule: "net issued input = cut component mass + material-specific offcuts + cutting rejects; investigate any residual rather than hiding it in an aggregate."
      inputs:
        - "issued mass"
        - "returned mass"
        - "cut mass"
        - "offcut mass"
        - "reject mass"
      output: "reconciled material flow and residual"
      source_ids:
        - afw-pefcr-3-1
    - id: calc_assembly_loss
      applies_to: "complete product BOM"
      rule: "assembly loss mass = BOM material mass issued for one product minus net conforming product mass, adjusted for documented unused returns and recovered rework."
      inputs:
        - "BOM mass"
        - "returned mass"
        - "net output mass"
        - "recovered rework"
      output: "assembly loss by material"
      source_ids:
        - afw-pefcr-3-1
    - id: calc_unit_to_mass
      applies_to: "sewing and assembly"
      rule: "burden per kg = total assembly burden / accepted item count / measured net mass per accepted item."
      inputs:
        - "assembly burden"
        - "accepted item count"
        - "net mass per item"
      output: "assembly burden per 1 kg reference flow"
      source_ids:
        - afw-pefcr-3-1
    - id: calc_shared_electricity
      applies_to: "shared electrical equipment"
      rule: "assigned electricity = total metered electricity × product-specific machine operating time × rated power / sum of operating-time × rated-power terms."
      inputs:
        - "meter total"
        - "machine time"
        - "rated power"
      output: "kWh assigned to product"
      source_ids:
        - ec-pef-2021-2279
    - id: calc_packaging_mass
      applies_to: "grouped packaging"
      rule: "packaging per kg = packaging piece count × verified unit mass / contained net product mass."
      inputs:
        - "piece count"
        - "unit mass"
        - "contained net product mass"
      output: "kg packaging per kg net product"
      source_ids:
        - afw-pefcr-3-1
  data_quality_requirements:
    - id: dqr_identity
      applies_to: "reference product"
      requirement: "Match the exact CPC 28235 product identity and retain the verified Tiangong product-flow, Mass and Units of mass UUIDs without dataset versions."
      evidence: "Tiangong state-100 readback; product specification; un-cpc-3-2025"
    - id: dqr_bom_coverage
      applies_to: "material inventory"
      requirement: "Provide primary data for at least 95% of BOM mass and cover 100% of main fabrics, lining, padding, metal parts and electronic parts when present; disclose every omitted remainder."
      evidence: "approved BOM; supplier specifications; afw-pefcr-3-1"
    - id: dqr_route
      applies_to: "process coverage"
      requirement: "Identify every controlled cutting, assembly, finishing, inspection, rework and packaging operation and every subcontracted operation; do not treat a single-step dataset as covering undocumented steps."
      evidence: "process map; supplier declaration; afw-pefcr-3-1"
    - id: dqr_temporal
      applies_to: "all foreground records"
      requirement: "Use a representative, current production period; explain seasonal, style, size and line-mix representativeness and any extrapolation."
      evidence: "dated production, meter, stock and quality records; ec-pef-2021-2279"
    - id: dqr_measurement
      applies_to: "mass, count, electricity, steam and water"
      requirement: "Retain calibration status, reading interval, unit conversion and reconciliation evidence for every measured quantity."
      evidence: "calibration certificate; meter log; scale record; invoice reconciliation"
    - id: dqr_waste_destination
      applies_to: "all waste outputs"
      requirement: "Record composition, mass, hazardous status where applicable, treatment destination and transfer evidence separately for each atomic waste."
      evidence: "waste ticket; contractor receipt; internal disposition record; afw-pefcr-3-1"
    - id: dqr_wet_finishing
      applies_to: "conditional wet operations"
      requirement: "Retain recipe, water balance, each chemical issue, wastewater quantity, discharge route and monitoring basis; declare the route not applicable when no wet finishing occurs."
      evidence: "batch recipe; meter record; discharge record; eu-textiles-bat-2022-2508"
    - id: dqr_uuid
      applies_to: "non-reference exchanges"
      requirement: "Leave a UUID blank until one real Tiangong flow is confirmed for the exact material, geography, technology, treatment route or elementary-flow compartment; do not borrow a nearby identity."
      evidence: "manifest identity review; direct state-100 readback when resolved"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The output UUID shall resolve to a public Product flow whose name and CPC path exactly match 28235 and whose quantitative reference is Mass; reference output shall equal 1 kg net product."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_scope
    applies_to: "product and boundary"
    rule: "The product shall be a babies' garment or clothing accessory made from textile fabric that is not knitted or crocheted, and the dataset shall stop at the declared garment factory gate."
    source_ids:
      - un-cpc-3-2025
      - afw-pefcr-3-1
  - rule_id: validate_qualifiers
    applies_to: "reference metadata"
    rule: "Garment type, infant size or age, net item mass, item count, fibre composition, construction, trims, finishing route, geography, period and packaging shall all be declared."
    source_ids:
      - afw-pefcr-3-1
  - rule_id: validate_bom
    applies_to: "material inventory"
    rule: "BOM coverage shall meet the declared threshold, every included component shall have one atomic material row, and omitted mass shall be quantified and disclosed."
    source_ids:
      - ec-pef-2021-2279
      - afw-pefcr-3-1
  - rule_id: validate_mass_balance
    applies_to: "cutting, assembly, finishing and packaging"
    rule: "Input, accepted output, returned material, rework, offcut, reject and scrap mass shall reconcile for the same production period within a declared measurement tolerance."
    source_ids:
      - afw-pefcr-3-1
  - rule_id: validate_energy
    applies_to: "process utilities"
    rule: "Electricity shall be separate for each process or transparently allocated from shared metering; steam, water and any fuel shall remain separate atomic exchanges."
    source_ids:
      - ec-pef-2021-2279
      - afw-pefcr-3-1
  - rule_id: validate_conditional_finishing
    applies_to: "finishing"
    rule: "Wet or dry finishing shall either have complete atomic input, waste and emission records or be explicitly declared absent with supporting route evidence."
    source_ids:
      - afw-pefcr-3-1
      - eu-textiles-bat-2022-2508
  - rule_id: validate_atomic_flows
    applies_to: "process inventory"
    rule: "No selected flow may be a collection, carrier list, selector instruction or combined waste; any additional BOM material, chemical, packaging component, waste or emission shall be added as its own row."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "shared processes"
    rule: "Allocation shall follow the declared hierarchy and basis; sewing and assembly unit allocation shall be converted with measured item count and net mass per item."
    source_ids:
      - iso-14044-2006
      - afw-pefcr-3-1
  - rule_id: validate_data_quality
    applies_to: "foreground records"
    rule: "Records shall be current, representative, traceable and supported by calibration, stock, meter, quality and waste evidence; every gap and withheld UUID shall be disclosed."
    source_ids:
      - ec-pef-2021-2279
      - afw-pefcr-3-1
published_dataset_profile:
  dataset_role: "Product-specific or representative foreground production dataset for non-knitted, non-crocheted babies' garments and clothing accessories"
  downstream_use: "May be used as a secondary dataset or background dataset for apparel product systems when identity, geography, technology, time and finishing route match"
  allowed_use: "Factory-gate inventory construction, supplier data exchange, hotspot analysis, and downstream process or lifecyclemodel projection with declared limitations"
  excluded_use: "Direct substitution for knitted baby garments, fabric manufacture, protective wear, consumer use, laundering, repair or end-of-life; unsupported comparative claims; silent use of unresolved UUIDs"
  required_metadata: "canonical PCR id; product-flow UUID; garment type; size or age; net item mass and count; full fibre and component BOM; construction and finish; process geography and period; subcontracted steps; allocation; packaging; waste destinations"
  required_quality_disclosure: "BOM coverage; process coverage; source and meter provenance; calibration; representativeness; allocation methods; mass-balance residuals; data gaps; UUID review status; wet-finishing applicability"
  update_trigger: "Material change in product scope, BOM, construction, finishing route, factory technology, geography, allocation, reference identity, evidence, or applicable apparel environmental-footprint rules"
