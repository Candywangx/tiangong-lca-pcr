measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground exchanges to exactly 1 kg of net conforming garment or accessory output; exclude packaging, rejects and rework-in-process from reference mass."
  - id: material_mass
    applies_to: "fabrics, interlining, thread, trims, detergents, packaging and solid wastes"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use calibrated scale, invoice, stock-issue or BOM records and reconcile issued, returned, incorporated, rejected and discarded mass for the same production period."
  - id: product_count
    applies_to: "assembly and sewing allocation"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "item"
    rule: "Retain produced item count and net mass per item so unit-based assembly burdens can be converted transparently to the 1 kg reference flow."
  - id: electricity_use
    applies_to: "cutting, assembly, finishing and packaging electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Use process sub-metering where available; otherwise calculate from documented machine power and operating time and disclose the allocation basis."
  - id: thermal_input
    applies_to: "purchased steam used for pressing or wet finishing"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record supplier meter or invoice mass and steam condition; do not combine steam with electricity or fuels."
  - id: water_use
    applies_to: "garment washing or wet finishing"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Meter supplied process water; if volume is measured, apply a documented density and temperature conversion."
  - id: transported_packaging
    applies_to: "sale and transport packaging"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report each packaging material separately per 1 kg net product and do not add packaging mass to the reference product."
process_map:
  - id: p1_cutting
    name: "Marker planning and cutting"
    inclusion: "required"
    inclusion_condition: "Finished textile fabric is cut into garment or accessory components."
    role: "Convert finished fabric and interlining into controlled cut components while recording material-specific offcuts."
    quantitative_reference: "kg cut components and kg offcuts per 1 kg net product"
  - id: p2_assembly
    name: "Sewing and assembly"
    inclusion: "required"
    inclusion_condition: "Cut components and applicable trims are joined into an assembled article."
    role: "Join components and trims and record unit-based assembly activity, thread losses and rejects."
    quantitative_reference: "items assembled and kg assembled product per 1 kg net product"
  - id: p3_finishing_qc
    name: "Conditional finishing and quality control"
    inclusion: "conditional"
    inclusion_condition: "Include garment washing, pressing, printing, embellishment, drying or other finishing only when performed at the reporting site; inspection and quality control are always included."
    role: "Produce conforming unpackaged product and record utilities, wastewater, rejects and rework."
    quantitative_reference: "kg conforming unpackaged product per 1 kg net product"
  - id: p4_packaging
    name: "Sale packaging and factory-gate release"
    inclusion: "required"
    inclusion_condition: "Conforming product is labelled, packed and released at the factory gate."
    role: "Apply declared packaging and produce the reference flow while keeping packaging mass separate."
    quantitative_reference: "1 kg net reference product"
