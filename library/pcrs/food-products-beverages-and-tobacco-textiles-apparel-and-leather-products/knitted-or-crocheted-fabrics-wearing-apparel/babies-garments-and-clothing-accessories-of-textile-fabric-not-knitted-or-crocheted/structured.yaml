  reference_flow_link: "reference_baby_garment_output"
system_boundary:
  rules:
    - rule_id: boundary_factory_operations
      applies_to: "foreground garment production"
      rule: "Include receipt and internal handling of finished fabrics and trims, cutting, sewing, assembly, applicable finishing, inspection, rework, packaging, direct utilities, process wastes and direct releases through the factory gate."
      source_ids:
        - afw-pefcr-3-1
    - rule_id: boundary_upstream_linkage
      applies_to: "purchased product inputs"
      rule: "Keep each purchased fabric, trim, chemical, utility and packaging material visible and connect it to a composition-, technology- and geography-appropriate upstream dataset; do not absorb upstream burdens into an undocumented aggregate."
      source_ids:
        - ec-pef-2021-2279
        - afw-pefcr-3-1
    - rule_id: boundary_conditional_finishing
      applies_to: "washing, printing, embellishment and finishing"
      rule: "Include only the finishing operations actually performed at the reporting factory; declare absence explicitly and add one atomic exchange for every additional chemical, carrier, waste or direct emission used by an applicable route."
      source_ids:
        - afw-pefcr-3-1
        - eu-textiles-bat-2022-2508
    - rule_id: boundary_downstream_exclusion
      applies_to: "distribution and use"
      rule: "Exclude distribution beyond the factory gate, retail, consumer care, repair, reuse and end-of-life from this foreground package; a cradle-to-grave study must add those stages outside this factory production dataset."
      source_ids:
        - afw-pefcr-3-1
    - rule_id: boundary_same_category_recursion
      applies_to: "same-category garment inputs"
      rule: "Record purchased or transferred baby garments used as inputs as explicit product exchanges and link an upstream dataset; do not recursively recreate their production inside this foreground package unless the unit process is under the reporting operator's control."
      source_ids:
        - ec-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "Finished woven fabrics, interlining, sewing materials, trims and packaging materials are received at the reporting garment factory with declared composition, quantity, supplier and upstream dataset linkage."
  starting_condition_role: "factory-gate foreground input"
  product_classification_scope: "Babies' garments and clothing accessories of CPC 3.0 class 28235; classification is evidence for scope and does not replace product qualifiers."
  recursive_input_rule: "Same-category garments or accessories crossing the boundary remain product inputs with an upstream dataset and are not expanded recursively unless produced in a controlled foreground unit process."
  upstream_dataset_requirement: "Use supplier-specific datasets where available; otherwise use a documented representative dataset matched to material form, fibre composition, manufacturing technology, geography and reference period."
  disclosure: "Declare BOM coverage, excluded operations, subcontracted steps, route-specific finishing, factory geography, allocation bases, data gaps, packaging configuration and all UUIDs withheld pending exact Tiangong identity confirmation."
