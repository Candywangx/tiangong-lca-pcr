system_boundary:
  rules:
    - rule_id: sb_gate_to_gate
      applies_to: "foreground manufacturing"
      rule: "Include all on-site material receipt, cutting, preparation, assembly, conditional garment finishing, pressing, inspection, packaging, directly controlled utilities, wastes, and direct emissions needed to produce the reference product."
      source_ids:
        - unido-leather-garment-15189
        - unido-leather-garment-08631
        - ec-pef-method-2021
    - rule_id: sb_upstream_leather
      applies_to: "purchased leather and composition leather"
      rule: "Model tanning, retanning, dyeing, tannery finishing, and composition-leather manufacture through upstream product datasets; do not repeat these operations in the garment foreground unless they physically occur at the reporting site."
      source_ids:
        - jrc-tan-bref-2013
        - ec-pef-method-2021
    - rule_id: sb_same_category_input
      applies_to: "incoming partly finished CPC 28241 apparel"
      rule: "Record the incoming article as a visible product input at its received mass and state, link it to an upstream dataset, and collect only the additional operations performed by the reporting site."
      source_ids:
        - ec-pef-method-2021
    - rule_id: sb_direct_emissions
      applies_to: "on-site combustion, coating, cleaning, and refrigeration"
      rule: "Include each directly released elementary flow separately when the corresponding activity occurs; do not substitute purchased-energy burdens for direct site emissions."
      source_ids:
        - ec-pef-method-2021
    - rule_id: sb_packaging
      applies_to: "packaging applied at the reporting site"
      rule: "Include each packaging material applied to outgoing product separately and disclose whether reusable transport packaging is allocated per trip or per use."
      source_ids:
        - afw-pefcr-2025
        - ec-pef-method-2021
    - rule_id: sb_exclusions
      applies_to: "downstream and capital activities"
      rule: "Exclude distribution, retail, consumer use, care, repair, and end-of-life from the foreground dataset; disclose any study-specific inclusion of capital equipment or infrastructure."
      source_ids:
        - afw-pefcr-2025
        - ec-pef-method-2021
