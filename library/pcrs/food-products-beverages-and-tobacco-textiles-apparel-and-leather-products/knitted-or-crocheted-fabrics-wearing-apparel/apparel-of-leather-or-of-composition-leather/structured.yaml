allocation_rules:
  - rule_id: al_subdivision_first
    applies_to: "separable styles, batches, lines, and processes"
    rule: "Prefer physical subdivision and direct metering before allocation; preserve style- and lot-specific materials, rejects, and packaging wherever records permit."
    source_ids:
      - ec-pef-method-2021
      - afw-pefcr-2025
  - rule_id: al_shared_services
    applies_to: "shared electricity, steam, compressed air, cooling, and facility services"
    rule: "Allocate with a documented physical driver that represents causal use, such as metered equipment energy, machine-hours, pressing time, or conditioned area-hours; do not use revenue when a physical driver is available."
    source_ids:
      - ec-pef-method-2021
  - rule_id: al_mass_fallback
    applies_to: "inseparable multi-product operation"
    rule: "If subdivision and causal physical allocation are not feasible, allocate by net conforming product mass and disclose the affected exchanges, period, products, and sensitivity."
    source_ids:
      - ec-pef-method-2021
  - rule_id: al_rework_rejects
    applies_to: "rework and rejected garments"
    rule: "Keep internally reworked material and energy in the originating product lot; record rejects leaving the process as waste and assign their production burdens to the originating product before any treatment credit."
    source_ids:
      - ec-pef-method-2021
  - rule_id: al_recycling
    applies_to: "sold or recycled offcuts and packaging wastes"
    rule: "Report the waste output and treatment destination separately; do not subtract an assumed recycling credit inside the foreground unit process unless the downstream modelling convention is explicitly declared."
    source_ids:
      - ec-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_cutting_materials
      process_id: "p1_material_cutting"
      flow_role: "received shell, lining, and interlining inputs"
      record_type: "purchase, receiving, issue, return, and bill-of-material records"
      raw_fields: "supplier item; lot; material identity; species; finish; composition; issued mass; returned mass; area or length; measured conversion factor"
      collection_method: "reconcile warehouse issues and returns to production lots; verify conversions by lot sampling"
      unit: "kg"
      frequency: "each lot, monthly reconciliation"
      temporal_coverage: "representative reporting period, normally at least 12 consecutive months or full campaign"
      site_scope: "each site and declared site group"
      aggregation_rule: "sum net issued mass by exact material and lot, then normalize under cr_normalize"
      quality_evidence: "purchase invoice; supplier specification; calibrated scale record; lot reconciliation"
    - protocol_id: cp_cutting_energy
      process_id: "p1_material_cutting"
      flow_role: "cutting electricity"
      record_type: "meter and equipment-runtime records"
      raw_fields: "meter start/end; kWh; equipment power; runtime; shared-service driver; output mass"
      collection_method: "read submeters or calculate an auditable equipment allocation"
      unit: "kWh"
      frequency: "monthly or finer"
      temporal_coverage: "same period as product output"
      site_scope: "each site"
      aggregation_rule: "sum applicable kWh, subtract documented non-production use, allocate under al_shared_services, then normalize"
      quality_evidence: "meter calibration; utility invoice; equipment log; allocation worksheet"
    - protocol_id: cp_cutting_outputs
      process_id: "p1_material_cutting"
      flow_role: "cut components and specific cutting wastes"
      record_type: "scale, production bundle, waste container, and consignment records"
      raw_fields: "output mass; material identity; waste mass; container tare; destination; lot"
      collection_method: "weigh transfers and each segregated waste; reconcile inputs to outputs"
      unit: "kg"
      frequency: "each lot with monthly reconciliation"
      temporal_coverage: "same period as cutting inputs"
      site_scope: "each site"
      aggregation_rule: "sum by exact output or waste identity and destination, then normalize"
      quality_evidence: "calibrated scale; bundle ticket; waste ticket; mass-balance worksheet"
    - protocol_id: cp_preparation_inputs
      process_id: "p2_component_preparation"
      flow_role: "component, adhesive, electricity, and compressed-air inputs"
      record_type: "transfer, chemical issue, SDS, meter, and runtime records"
      raw_fields: "component mass; adhesive product; issued and returned mass; solids; VOC fraction; kWh; compressed-air m3; pressure"
      collection_method: "reconcile transfers and chemical issues; meter or auditably allocate utilities"
      unit: "kg, kWh, m3"
      frequency: "each lot and monthly utilities"
      temporal_coverage: "same period as prepared output"
      site_scope: "each site"
      aggregation_rule: "sum each atomic exchange separately, allocate shared utilities, then normalize"
      quality_evidence: "transfer ticket; SDS; issue record; meter log; allocation worksheet"
    - protocol_id: cp_preparation_outputs
      process_id: "p2_component_preparation"
      flow_role: "prepared components, skiving waste, adhesive waste, and NMVOC"
      record_type: "transfer, waste, chemical-balance, and abatement records"
      raw_fields: "prepared mass; waste mass; issued chemical; VOC fraction; retained mass; recovered mass; abatement capture"
      collection_method: "weigh outputs and apply cr_nmvoc_balance from collected fields"
      unit: "kg"
      frequency: "each lot with monthly reconciliation"
      temporal_coverage: "same period as preparation inputs"
      site_scope: "each site"
      aggregation_rule: "sum each specific output and normalize"
      quality_evidence: "calibrated scale; waste ticket; SDS; abatement record; calculation worksheet"
    - protocol_id: cp_assembly_inputs
      process_id: "p3_garment_assembly"
      flow_role: "prepared parts, thread, closures, labels, and electricity"
      record_type: "transfer, bill-of-material, issue/return, item-count, measured-item-mass, and meter records"
      raw_fields: "component mass; item identity; count; item mass; issued mass; returned mass; kWh"
      collection_method: "reconcile production bundles and bill-of-material issues; meter or allocate electricity"
      unit: "kg, item, kWh"
      frequency: "each lot and monthly utilities"
      temporal_coverage: "same period as assembly output"
      site_scope: "each site"
      aggregation_rule: "convert item counts with measured item mass, preserve each exchange, then normalize"
      quality_evidence: "bundle ticket; bill of materials; calibrated scale; meter log"
    - protocol_id: cp_assembly_outputs
      process_id: "p3_garment_assembly"
      flow_role: "assembled garment, thread waste, and rejected assembly"
      record_type: "transfer, scale, rejection, rework, and waste records"
      raw_fields: "output mass; reject mass; rework status; thread waste mass; destination"
      collection_method: "weigh output and segregated wastes; close rework within the reporting period"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "same period as assembly inputs"
      site_scope: "each site"
      aggregation_rule: "exclude completed internal rework from waste; sum external wastes by destination and normalize"
      quality_evidence: "transfer ticket; rejection log; calibrated scale; waste ticket"
    - protocol_id: cp_finishing_inputs
      process_id: "p4_finishing_pressing"
      flow_role: "assembled garment input"
      record_type: "production-bundle transfer record"
      raw_fields: "style; lot; transferred mass; time"
      collection_method: "weigh or reconcile bundle transfer"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "same period as finishing output"
      site_scope: "each site"
      aggregation_rule: "sum conforming transferred mass and normalize"
      quality_evidence: "bundle ticket; calibrated scale"
    - protocol_id: cp_finishing_utilities
      process_id: "p4_finishing_pressing"
      flow_role: "electricity, steam, natural gas, LPG, diesel, and R-410A inputs"
      record_type: "meter, invoice, tank, cylinder, service, pressure, enthalpy, density, and calorific records"
      raw_fields: "kWh; steam mass; pressure; condensate; gas volume; LPG mass; diesel mass; net calorific value; refrigerant charge and make-up"
      collection_method: "read meters and inventories; preserve each utility as a distinct exchange"
      unit: "kWh, MJ, kg, m3"
      frequency: "monthly and each service event"
      temporal_coverage: "same period as finishing output"
      site_scope: "each site"
      aggregation_rule: "calculate applicable conversions, allocate under al_shared_services, then normalize"
      quality_evidence: "calibration record; invoice; tank log; boiler log; refrigerant service record"
    - protocol_id: cp_finishing_chemicals
      process_id: "p4_finishing_pressing"
      flow_role: "topcoat and isopropanol inputs"
      record_type: "purchase, issue/return, SDS, product specification, and recovery records"
      raw_fields: "chemical identity; issued mass; returned mass; solids; VOC fraction; recovered mass"
      collection_method: "reconcile exact chemical products to production lots"
      unit: "kg"
      frequency: "each lot with monthly reconciliation"
      temporal_coverage: "same period as finishing output"
      site_scope: "each site"
      aggregation_rule: "net issues by chemical identity, then normalize"
      quality_evidence: "SDS; supplier specification; issue record; recovery record"
    - protocol_id: cp_finishing_outputs
      process_id: "p4_finishing_pressing"
      flow_role: "finished product and chemical wastes"
      record_type: "scale, transfer, waste-container, and consignment records"
      raw_fields: "conforming mass; waste identity; waste mass; tare; destination"
      collection_method: "weigh finished output and each segregated waste"
      unit: "kg"
      frequency: "each lot with monthly reconciliation"
      temporal_coverage: "same period as finishing inputs"
      site_scope: "each site"
      aggregation_rule: "sum each output and waste destination separately, then normalize"
      quality_evidence: "calibrated scale; transfer ticket; waste consignment"
    - protocol_id: cp_finishing_emissions
      process_id: "p4_finishing_pressing"
      flow_role: "CO2, NOx, NMVOC, and R-410A emissions"
      record_type: "fuel composition, stack test, SDS, chemical balance, refrigerant inventory, and abatement records"
      raw_fields: "fuel use; carbon fraction; oxidation fraction; NOx result; chemical mass; VOC fraction; recovered VOC; refrigerant opening, additions, removals, closing"
      collection_method: "use direct monitoring where available; otherwise apply the named calculation rule to collected fields"
      unit: "kg"
      frequency: "monthly, each stack test, and each refrigerant service event"
      temporal_coverage: "same period as finishing output"
      site_scope: "each emitting source at each site"
      aggregation_rule: "calculate each substance separately, aggregate only identical elementary flows, then normalize"
      quality_evidence: "laboratory/permit report; supplier certificate; SDS; refrigerant service log; signed calculation worksheet"
    - protocol_id: cp_packaging_inputs
      process_id: "p5_packaging_release"
      flow_role: "finished product, electricity, hangtag, bag, box, and tape inputs"
      record_type: "transfer, packing list, bill-of-material, issue/return, item-mass, and meter records"
      raw_fields: "product mass; packaging identity; item count; item mass; issued and returned mass; kWh; packed mass per box"
      collection_method: "reconcile packaging issues to actual packing records and meter or allocate electricity"
      unit: "kg, item, kWh"
      frequency: "each packing lot with monthly reconciliation"
      temporal_coverage: "same period as released product"
      site_scope: "each site"
      aggregation_rule: "keep each packaging component separate, allocate boxes by actual contained product mass, then normalize"
      quality_evidence: "packing list; purchase specification; calibrated scale; meter log"
    - protocol_id: cp_packaging_outputs
      process_id: "p5_packaging_release"
      flow_role: "packaging wastes"
      record_type: "waste, rejected-item, and consignment records"
      raw_fields: "exact material; item count; measured item mass; waste mass; destination"
      collection_method: "weigh or item-convert each segregated packaging waste"
      unit: "kg"
      frequency: "each packing lot with monthly reconciliation"
      temporal_coverage: "same period as packaging inputs"
      site_scope: "each site"
      aggregation_rule: "sum each material and destination separately, then normalize"
      quality_evidence: "calibrated scale; reject log; waste ticket"
    - protocol_id: cp_reference_product_mass
      process_id: "p5_packaging_release"
      flow_role: "reference product"
      record_type: "final inspection, production release, and calibrated scale records"
      raw_fields: "style; lot; CPC; conforming count; net apparel mass; packaging mass; release status"
      collection_method: "weigh released apparel separately from supplied packaging and reconcile to production release"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "same period as all foreground records"
      site_scope: "each site and declared site group"
      aggregation_rule: "sum net mass of conforming released apparel only; normalize to exactly 1 kg"
      quality_evidence: "calibrated scale certificate; release record; inspection record; mass reconciliation"
  calculation_rules:
    - id: cr_normalize
      applies_to: "every non-reference inventory exchange"
      rule: "normalized amount = reporting-period exchange amount / reporting-period net mass of conforming released apparel; retain the original unit and conversion evidence"
      inputs:
        - "exchange amount"
        - "net conforming product mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - ec-pef-method-2021
    - id: cr_material_balance
      applies_to: "each foreground process"
      rule: "input mass = product output mass + each waste output mass + measured mass loss or accumulation; investigate unresolved imbalance and do not force it into an unspecified waste flow"
      inputs:
        - "measured material inputs"
        - outputs
        - wastes
        - "inventory change"
      output: "process mass-balance reconciliation"
      source_ids:
        - ec-pef-method-2021
    - id: cr_item_to_mass
      applies_to: "closures, labels, and packaging recorded by count"
      rule: "mass = item count × product- or lot-specific measured item mass"
      inputs:
        - "item count"
        - "measured item mass"
      output: "kg of the one identified component"
      source_ids:
        - afw-pefcr-2025
        - ec-pef-method-2021
    - id: cr_nmvoc_balance
      applies_to: "one identified adhesive, topcoat, or solvent"
      rule: "emitted NMVOC = issued volatile mass − returned volatile mass − volatile mass in collected waste − verified captured or destroyed volatile mass; calculate per chemical before aggregating identical NMVOC"
      inputs:
        - "issued and returned chemical mass"
        - "supplier VOC fraction"
        - "waste recovery"
        - abatement
      output: "kg NMVOC to air"
      source_ids:
        - ec-pef-method-2021
    - id: cr_fossil_co2
      applies_to: "each on-site fossil fuel"
      rule: "fossil CO2 = fuel amount × documented carbon content × documented oxidation fraction × 44/12; calculate by fuel before summing identical fossil CO2"
      inputs:
        - "fuel amount"
        - "carbon content"
        - "oxidation fraction"
      output: "kg fossil CO2 to air"
      source_ids:
        - ec-pef-method-2021
    - id: cr_refrigerant_loss
      applies_to: "R-410A cooling system"
      rule: "R-410A loss = opening inventory + additions − removals − closing inventory, adjusted for documented stock transfer; allocate only equipment serving the declared site processes"
      inputs:
        - "cylinder and equipment inventories"
        - "service additions and removals"
        - "allocation driver"
      output: "kg R-410A to air"
      source_ids:
        - ec-pef-method-2021
    - id: cr_steam_energy
      applies_to: "purchased saturated steam"
      rule: "delivered energy = metered steam mass × (steam enthalpy at supplier condition − returned condensate enthalpy); retain the supplier thermodynamic basis"
      inputs:
        - "steam mass"
        - "pressure or temperature"
        - "condensate return and condition"
      output: "MJ delivered steam"
      source_ids:
        - ec-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and shell inputs"
      requirement: "Exact CPC 28241, style, garment type, leather species or composition-leather identity, shell fraction, finish, lining, closures, and packaging convention shall be traceable to the bill of materials and release record."
      evidence: "Approved bill of materials; supplier specifications; production release record; un-cpc3-2023"
    - id: dq_primary_data
      applies_to: "foreground manufacturing"
      requirement: "Use company- or supplier-specific primary records for all foreground manufacturing processes and document substitutions, estimates, and allocation drivers."
      evidence: "Meter, issue, transfer, waste, and production records; afw-pefcr-2025; ec-pef-method-2021"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one coherent reporting period, normally at least 12 consecutive months or the full production campaign, and disclose shutdowns, startup, atypical lots, and coverage gaps."
      evidence: "Period ledger; production calendar; gap log"
    - id: dq_mass_balance
      applies_to: "materials and wastes"
      requirement: "Reconcile leather, composition leather, textiles, chemicals, intermediate products, final product, and each specific waste; investigate rather than bury unexplained imbalance."
      evidence: "Signed mass-balance worksheets; inventory records; waste tickets"
    - id: dq_meter_quality
      applies_to: "electricity, steam, fuels, compressed air, and scales"
      requirement: "Record meter identity, calibration or verification status, reading frequency, coverage, and any allocation from a shared meter."
      evidence: "Calibration certificate; meter map; utility invoices; allocation worksheet"
    - id: dq_upstream_match
      applies_to: "purchased finished leather and composition leather"
      requirement: "Select upstream data matching the material type, animal species where applicable, finish, chemistry or binder, geography, technology, and time; disclose every material mismatch."
      evidence: "Supplier declaration; dataset metadata; mismatch log; jrc-tan-bref-2013"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Check every process-map row and every atomic exchange for applicability; a zero shall be supported by a bill of materials, meter boundary, service record, or explicit absence statement."
      evidence: "Applicability matrix; source records; completeness review; ec-pef-method-2021"
    - id: dq_traceability
      applies_to: "calculated values"
      requirement: "Retain raw fields, formula version, unit conversions, intermediate results, reviewer, and source record identifiers for each calculated value."
      evidence: "Signed calculation workbook or reproducible calculation export"
validation_rules:
  - rule_id: vr_reference_identity
    applies_to: "reference flow"
    rule: "The reference product UUID shall be 971103ee-8ef5-4165-853c-6a3e98a692d8, exact CPC shall be 28241, flow type shall be Product, flow property shall be Mass 93a60a56-a3c8-11da-a746-0800200b9a66, unit group shall be Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and unit shall be kg."
    source_ids:
      - un-cpc3-2023
  - rule_id: vr_reference_amount
    applies_to: "reference product"
    rule: "The released product output shall equal exactly 1 kg net conforming apparel mass after normalization, with separately supplied packaging excluded and reconciled."
    source_ids:
      - ec-pef-method-2021
  - rule_id: vr_scope
    applies_to: "product applicability"
    rule: "The dataset shall document that the defining shell is leather or composition leather and that the product belongs to exact CPC 28241; excluded apparel or accessories shall fail conformance."
    source_ids:
      - un-cpc3-2023
  - rule_id: vr_process_coverage
    applies_to: "foreground process map"
    rule: "Every required process shall have a declared applicable route and records; conditional finishing, fuel, steam, chemical, refrigerant, and packaging rows shall be either populated or supported by explicit non-applicability evidence."
    source_ids:
      - unido-leather-garment-15189
      - unido-leather-garment-08631
      - ec-pef-method-2021
  - rule_id: vr_atomic_flows
    applies_to: "inventory rows"
    rule: "Each row shall contain one specific product, waste, or elementary exchange; electricity, steam, each fuel, R-410A, each chemical, each packaging component, each waste, and each emission shall remain separate."
    source_ids:
      - ec-pef-method-2021
  - rule_id: vr_uuid_policy
    applies_to: "Tiangong flow identities"
    rule: "The reference flow UUID is mandatory; any non-reference UUID shall remain empty unless both hybrid search and state-code-100 direct read confirm the exact flow, property, and unit identity."
    source_ids: []
  - rule_id: vr_mass_balance
    applies_to: "process inventories"
    rule: "Each process mass balance shall reconcile within the site's documented measurement uncertainty; unexplained imbalance shall be a finding rather than an unnamed exchange."
    source_ids:
      - ec-pef-method-2021
  - rule_id: vr_allocation
    applies_to: "shared operations and wastes"
    rule: "Allocation shall follow the declared hierarchy, use auditable physical drivers, and disclose all fallback mass allocations and waste-credit conventions."
    source_ids:
      - ec-pef-method-2021
  - rule_id: vr_source_traceability
    applies_to: "collected and calculated amounts"
    rule: "Every foreground or calculated amount shall link to its collection protocol and retained raw evidence; no unsupported reasoned-estimate range is permitted by this candidate PCR."
    source_ids:
      - afw-pefcr-2025
      - ec-pef-method-2021
  - rule_id: vr_translation_alignment
    applies_to: "bilingual PCR"
    rule: "English and Chinese process ids, row ids, flow names, UUIDs, controlled values, rule ids, source ids, and order shall match exactly."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Gate-to-gate leather or composition-leather apparel manufacturing for exact CPC 28241 when product, site, route, period, material, and packaging qualifiers match; may be linked with representative upstream and downstream datasets in a wider life-cycle model"
  excluded_use: "Tanning or finished-leather production; fur apparel; footwear; leather accessories; textile- or plastics-shell apparel; product comparisons that ignore differing specifications, durability, or use scenarios"
  required_metadata: "canonical PCR id; exact CPC; reference-flow UUID; garment type and style; shell material and species or composition-leather identity; material fractions; lining, closure, trim, adhesive, and finish identities; site geography; technology route; reporting period; packaging convention; allocation method; upstream dataset identities"
  required_quality_disclosure: "primary-data coverage; meter and scale quality; temporal and site representativeness; mass-balance results; conditional-flow applicability; direct-emission method; upstream mismatches; allocation drivers; waste destinations; unresolved non-reference UUIDs"
  update_trigger: "material or construction change; new finish, adhesive, fuel, refrigerant, packaging, or waste route; process relocation; supplier or upstream-dataset change; allocation change; material production-volume or efficiency shift; reporting period older than the study's representativeness requirement"
data_sources:
  - id: "un-cpc3-2023"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Classification of Individual Consumption According to Purpose and Central Product Classification, CPC Version 3.0 structure, exact class 28241, 2023, https://unstats.un.org/unsd/classifications/Meetings/UNCEISC2023/8-3_Background3_CPC3_Structure.pdf (retrieved 2026-08-13)"
    used_for: "Exact external classification scope and validation of CPC 28241 identity"
  - id: "unido-leather-garment-15189"
    type: "extension_guidance"
    reference: "UNIDO, Pakistan: Leather Garment Design and Production, Technical Report 15189.en, https://downloads.unido.org/ot/48/09/4809768/15001-20000_15189.pdf (retrieved 2026-08-13)"
    used_for: "Direct leather-garment process decomposition, including cutting, fusing, manufacturing, lining cutting, finishing, and pressing"
  - id: "unido-leather-garment-08631"
    type: "extension_guidance"
    reference: "UNIDO, Leather Research and Training Institute, Turkey: Design and Manufacture of Leather and Fur Garments, Technical Report 08631.en, https://downloads.unido.org/ot/46/90/4690567/00001-10000_08631.pdf (retrieved 2026-08-13)"
    used_for: "Direct leather-garment operations including cementing, folding, stitching, lining assembly, cleaning, and pressing"
