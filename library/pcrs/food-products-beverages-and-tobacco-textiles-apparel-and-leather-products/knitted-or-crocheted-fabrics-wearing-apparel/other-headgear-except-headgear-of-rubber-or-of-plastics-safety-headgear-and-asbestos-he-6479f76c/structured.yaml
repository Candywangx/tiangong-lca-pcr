allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared lines and utilities"
    rule: "First use product-specific meters, production orders, machine time, material issues, and waste records to subdivide the inventory."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relationship
    applies_to: "residual shared inputs and outputs"
    rule: "When subdivision is not possible, allocate by a documented causal physical relationship such as machine time, delivered heat, or net product mass. Do not use revenue merely because it is available."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework
    applies_to: "internal rework"
    rule: "Keep material and energy used for rework in the declared product inventory; count only rejects leaving the rework loop as waste."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_scrap_and_recycling
    applies_to: "sold or recycled scrap"
    rule: "Record each scrap stream at its measured mass. Do not subtract scrap revenue or an avoided-product credit from the factory-gate inventory unless a separately declared downstream recycling model applies."
    source_ids:
      - eu-pef-2021-2279
      - bhuiyan-2023-apparel-cutting-waste
  - rule_id: allocation_disclosure
    applies_to: "all allocation"
    rule: "Report the shared process, allocation driver, numerator, denominator, period, and sensitivity when allocation materially affects the result."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "component_forming_assembly"
      flow_role: "atomic material and component input"
      record_type: "purchase, issue, inventory, and specification records"
      raw_fields: "material identity; composition; supplier; opening and closing inventory; issued quantity; unit mass or conversion factor; lot"
      collection_method: "reconcile purchasing and stores records to the product order"
      unit: "kg"
      frequency: "each production lot, aggregated monthly"
      temporal_coverage: "representative continuous 12-month period or full shorter campaign"
      site_scope: "all lines making the declared product"
      aggregation_rule: "inputs = issues + allocated inventory change; normalize by accepted net product mass"
      quality_evidence: "invoices; issue slips; weighed unit samples; specifications; inventory reconciliation"
    - protocol_id: cp_manufacturing_energy
      process_id: "component_forming_assembly_product_packaging"
      flow_role: "purchased electricity, steam, and heat"
      record_type: "meter, invoice, machine-hour, pressure, and temperature records"
      raw_fields: "carrier; meter start/end; delivered unit; pressure; temperature; machine time; allocation driver"
      collection_method: "read submeter where available; otherwise reconcile invoice and allocate causally"
      unit: "kWh or MJ"
      frequency: "monthly and each campaign"
      temporal_coverage: "same period as production data"
      site_scope: "all included manufacturing and packaging operations"
      aggregation_rule: "keep each carrier separate; no double counting between process and facility meters"
      quality_evidence: "calibrated meter record; invoice; allocation worksheet"
    - protocol_id: cp_process_water
      process_id: "component_forming_assembly"
      flow_role: "process water and wastewater"
      record_type: "water and effluent meter or balance records"
      raw_fields: "inlet volume; discharge volume; density; steam condensate; inventory change"
      collection_method: "read meters or construct a documented site water balance"
      unit: "kg"
      frequency: "monthly and each wet campaign"
      temporal_coverage: "same period as production data"
      site_scope: "all included wet, steam, cleaning, and discharge points"
      aggregation_rule: "normalize inlet and discharge separately by accepted net product mass"
      quality_evidence: "meter calibration; water bill; balance closure"
    - protocol_id: cp_manufacturing_waste
      process_id: "component_forming_assembly"
      flow_role: "each atomic offcut waste"
      record_type: "segregated waste-bin and dispatch records"
      raw_fields: "material identity; bin mass; contamination; destination; opening and closing accumulation"
      collection_method: "weigh each waste stream before internal reuse or dispatch"
      unit: "kg"
      frequency: "each lot or waste pickup"
      temporal_coverage: "same period as production data"
      site_scope: "all cutting, forming, and trimming operations"
      aggregation_rule: "opening accumulation + generated - closing accumulation; allocate by product order or causal driver"
      quality_evidence: "scale calibration; waste transfer note; segregation inspection"
    - protocol_id: cp_product_and_reject_mass
      process_id: "component_forming_assembly_product_packaging"
      flow_role: "accepted product and rejected product"
      record_type: "scale, inspection, and rework records"
      raw_fields: "gross mass; tare; net accepted mass; rejected mass; rework return; article or part identity"
      collection_method: "weigh accepted and rejected outputs after inspection"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "every included production lot"
      site_scope: "final inspection and packaging"
      aggregation_rule: "accepted net mass is denominator; exclude packaging and rejects"
      quality_evidence: "scale calibration; inspection release; rework log"
    - protocol_id: cp_direct_emissions
      process_id: "component_forming_assembly"
      flow_role: "NMVOC to air"
      record_type: "material safety data, volatile-content, capture, and stack records"
      raw_fields: "material input; volatile fraction; retained fraction; captured mass; measured concentration; flow and time"
      collection_method: "use measured release where available; otherwise close a product-specific material balance"
      unit: "kg"
      frequency: "each campaign and annual stack test where applicable"
      temporal_coverage: "same period as production data"
      site_scope: "all adhesive, coating, ink, and cleaning emission points"
      aggregation_rule: "emitted mass = volatile input - retained - recovered - captured"
      quality_evidence: "supplier composition; stack report; control-device log"
    - protocol_id: cp_refrigerant_balance
      process_id: "component_forming_assembly"
      flow_role: "each chemically specific refrigerant to air"
      record_type: "equipment charge and service records"
      raw_fields: "refrigerant identity; beginning charge; additions; recovered mass; ending charge; equipment allocation"
      collection_method: "mass balance each refrigerant separately"
      unit: "kg"
      frequency: "each service event and annually"
      temporal_coverage: "same period as production data"
      site_scope: "cooling equipment serving included operations"
      aggregation_rule: "loss = beginning + additions - recovered - ending; allocate by causal cooling service"
      quality_evidence: "service invoice; charge log; leak test"
    - protocol_id: cp_onsite_fuel
      process_id: "onsite_thermal_supply"
      flow_role: "natural gas, useful heat, fossil CO2, and NOx"
      record_type: "fuel meter, heating value, efficiency, stack, and factor records"
      raw_fields: "fuel volume or mass; heating value basis; delivered heat; boiler efficiency; emission factor; stack result"
      collection_method: "reconcile fuel meter and boiler operating records"
      unit: "MJ and kg"
      frequency: "monthly"
      temporal_coverage: "same period as production data"
      site_scope: "boilers or heaters serving included operations"
      aggregation_rule: "calculate useful heat and each emission separately; avoid duplicate purchased heat"
      quality_evidence: "meter calibration; fuel invoice; factor source; stack test"
    - protocol_id: cp_packaging_materials
      process_id: "product_packaging"
      flow_role: "each packaging material and scrap"
      record_type: "packaging specification, issue, count, unit-mass, and scrap records"
      raw_fields: "packaging identity; count; measured unit mass; issued quantity; rejects; scrap"
      collection_method: "weigh representative packaging units and reconcile issued quantities"
      unit: "kg"
      frequency: "each packaging specification and lot"
      temporal_coverage: "same period as production data"
      site_scope: "all packaging stations for the declared product"
      aggregation_rule: "normalize each packaging material and its scrap separately by net product mass"
      quality_evidence: "packaging specification; scale record; issue and scrap log"
  calculation_rules:
    - id: calc_normalized_input
      applies_to: "each material or component"
      rule: "(issued mass + allocated inventory decrease - returned unused mass) / accepted net product mass"
      inputs:
        - issue
        - return
        - inventory
        - "and accepted-product records"
      output: "kg input/kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_count_to_mass
      applies_to: "buckles and packaging pieces"
      rule: "accepted or issued item count × measured representative unit mass / accepted net product mass"
      inputs:
        - count
        - "sampling plan"
        - "unit mass"
        - "accepted-product mass"
      output: "kg input/kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_energy_intensity
      applies_to: "each electricity, steam, heat, or fuel row"
      rule: "attributable carrier quantity / accepted net product mass, preserving carrier identity"
      inputs:
        - "meter or invoice"
        - "allocation driver"
        - "accepted-product mass"
      output: "kWh or MJ/kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_waste_intensity
      applies_to: "each waste stream"
      rule: "(opening accumulation + generated or dispatched mass - closing accumulation) / accepted net product mass"
      inputs:
        - waste-bin
        - dispatch
        - accumulation
        - "and product records"
      output: "kg waste/kg reference product"
      source_ids:
        - bhuiyan-2023-apparel-cutting-waste
        - eu-pef-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "each refrigerant"
      rule: "(beginning charge + additions - recovered charge - ending charge) × allocation share / accepted net product mass"
      inputs:
        - "charge and service records"
        - "allocation share"
        - "product mass"
      output: "kg refrigerant to air/kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_fuel_emission
      applies_to: "each direct combustion emission"
      rule: "fuel quantity × documented source-specific emission factor / accepted net product mass"
      inputs:
        - "fuel record"
        - "factor identity and basis"
        - "product mass"
      output: "kg emission/kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_balance_closure
      applies_to: "manufacturing lot"
      rule: "received input mass = accepted product + rejects + each waste + measured or estimated emissions + closing inventory increase - opening inventory increase"
      inputs:
        - "all material"
        - product
        - waste
        - emission
        - "and inventory records"
      output: "mass-balance difference and percent closure"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "The product description and order shall demonstrate CPC 28269 inclusion and identify the exact article or part, composition, size or dimensions, and route."
      evidence: "product specification; order; classification review"
    - id: dq_bom_completeness
      applies_to: "material and component inputs"
      requirement: "Product-specific bill of materials shall reconcile with issued-material records; every actual material and component requires a separate atomic row."
      evidence: "approved BoM; issue slips; inventory reconciliation"
    - id: dq_route_completeness
      applies_to: "process map"
      requirement: "The declared route shall state whether cutting, forming, joining, adhesive use, steam, purchased heat, on-site fuel, water, controlled cooling, and packaging apply."
      evidence: "process map; work instruction; equipment list"
    - id: dq_temporal_representativeness
      applies_to: "all foreground data"
      requirement: "Use a representative continuous 12-month period where production is continuous or the complete campaign for shorter production; disclose seasonality and abnormal downtime."
      evidence: "production calendar; meter periods; campaign records"
    - id: dq_meter_and_scale_control
      applies_to: "mass, water, energy, and emissions"
      requirement: "Retain calibration or verification status and quantify allocation where direct measurement is unavailable."
      evidence: "calibration certificate; meter register; allocation worksheet"
    - id: dq_waste_destination
      applies_to: "each waste flow"
      requirement: "Record material identity, contamination, mass, and actual treatment or recipient; do not merge textile, metal, paperboard, plastic, wastewater, or rejected product."
      evidence: "transfer note; recycler receipt; waste register"
    - id: dq_range_use
      applies_to: "all provisional ranges"
      requirement: "Broad reasoned_estimate ranges are screening aids only and shall not replace foreground values. Replacement with an empirical range requires at least two independent, boundary-compatible original sources or a reviewed multi-period foreground dataset."
      evidence: "range review record; original sources; foreground dataset"
    - id: dq_source_traceability
      applies_to: "factors and upstream datasets"
      requirement: "Retain source identity, version, geography, technology, temporal coverage, and any proxy rationale."
      evidence: "dataset metadata; factor document; supplier declaration"
validation_rules:
  - rule_id: validate_scope_identity
    applies_to: "product identity"
    rule: "Fail when the product is not demonstrably within CPC 28269 or is rubber/plastic headgear, safety headgear, asbestos headgear, or an adjacent CPC 28261/28262 product."
    source_ids:
      - unsd-cpc-3-explanatory-notes-2025
  - rule_id: validate_reference_flow
    applies_to: "reference flow"
    rule: "Require exactly 1 kg net conforming product with the declared Tiangong product flow, Mass property, Units of mass group, and kg reference unit."
    source_ids:
      - unsd-cpc-3-explanatory-notes-2025
  - rule_id: validate_required_qualifiers
    applies_to: "data package metadata"
    rule: "Fail when any required qualifier, product-specific BoM, route, or packaging state is missing."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_atomic_inventory
    applies_to: "every inventory row"
    rule: "Fail any plural collection, combined carrier, unspecified packaging group, combined waste group, or refrigerant selector. Each selected flow shall be one material, carrier, waste, or elementary emission."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_energy_separation
    applies_to: "utilities"
    rule: "Require separate rows for purchased electricity, purchased steam, purchased heat, natural gas, and every other actual fuel; reject double counting of on-site useful heat and purchased heat."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_material_balance
    applies_to: "manufacturing lot"
    rule: "Require a documented mass-balance calculation and explanation of residual difference; packaging shall not be included in reference product mass."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_waste_separation
    applies_to: "waste"
    rule: "Require each actual offcut, packaging scrap, wastewater, and rejected product stream to be separately identified and linked to a destination."
    source_ids:
      - bhuiyan-2023-apparel-cutting-waste
      - eu-pef-2021-2279
  - rule_id: validate_direct_emissions
    applies_to: "direct emissions"
    rule: "Require separate chemically or physically specific rows for each applicable combustion emission, NMVOC release, particulate release, and refrigerant. A zero assertion requires equipment, material, or monitoring evidence."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "shared processes"
    rule: "Require subdivision evidence or a causal physical allocation driver and full disclosure of the allocation period and denominator."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_provisional_ranges
    applies_to: "amount ranges"
    rule: "Reject lower-equals-upper empirical ranges and reject any source-backed empirical range inferred from fewer than two independent boundary-compatible original sources. Broad source-free ranges shall remain labelled reasoned_estimate."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Product-specific factory-gate secondary_dataset or background_dataset derived from reviewed foreground records"
  downstream_use: "Modelling manufacturing of a declared CPC 28269 headgear article or part and linking it to downstream distribution, assembly, use, or end-of-life models"
  allowed_use: "Use for the declared article or part, composition, route, site, geography, technology, and reporting period, with packaging and allocation disclosures retained"
  excluded_use: "Do not use for rubber/plastic headgear, safety headgear, asbestos headgear, CPC 28261/28262 products, a materially different bill of materials or route, or comparative claims without additional review"
  required_metadata: "PCR id; CPC code; Tiangong reference-flow UUIDs; exact product type; BoM; dimensions or size; net mass; route; site and geography; period; utilities; fuel and refrigerant applicability; packaging; allocation; upstream dataset versions; waste destinations"
  required_quality_disclosure: "Meter and scale quality; sampling and conversions; mass-balance closure; data coverage; proxy datasets; allocation shares; outsourced operations; abnormal production; unresolved inventory UUIDs; provisional range use"
  update_trigger: "Change in product scope, BoM, component supplier, forming or joining route, steam/heat/fuel system, refrigerant, packaging, site, allocation, waste treatment, or a material change in measured intensities"
