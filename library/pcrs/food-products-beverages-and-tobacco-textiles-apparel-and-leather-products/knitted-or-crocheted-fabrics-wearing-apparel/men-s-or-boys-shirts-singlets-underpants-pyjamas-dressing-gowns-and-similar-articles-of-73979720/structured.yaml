    type: "literature"
    reference: "Olugbemi, E. and Bolson, N.F. (2026), Uncertainty analysis of physical-based carbon accounting in cotton T-shirt manufacturing, Scientific Reports 16, 7586, https://doi.org/10.1038/s41598-026-38773-4"
    used_for: "Independent process-chain corroboration and data-quality dimensions; no case-study quantity is adopted as a PCR default"
