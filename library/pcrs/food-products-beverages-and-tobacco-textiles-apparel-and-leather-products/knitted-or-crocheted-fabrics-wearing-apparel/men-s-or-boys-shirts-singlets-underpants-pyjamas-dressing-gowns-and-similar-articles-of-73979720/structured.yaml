allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "independently measurable garment processes or batches"
    rule: "Avoid allocation by subdividing cutting, sewing, wet processing, finishing, and packaging whenever meters, issue records, batch records, or production counts permit direct assignment."
    source_ids:
      - ec-pef-method-2021
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_shared_electricity
    applies_to: "shared factory electricity"
    rule: "Use product-specific metering first; when unavailable, allocate a documented shared-meter total by the mass of conforming production from the same equipment, site, and reporting interval."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_shared_steam
    applies_to: "shared purchased steam"
    rule: "Use product- or line-specific steam metering first; otherwise allocate measured delivered steam by a documented physical driver such as equipment operating time and verified load, then disclose the method."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_textile_offcuts
    applies_to: "cutting offcuts and rejected garment material"
    rule: "Record offcuts and rejects as waste outputs with actual destinations; do not treat sales revenue or avoided disposal as a reason to remove their production burden from the foreground mass balance."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_no_undocumented_credit
    applies_to: "recycling, reuse, or energy-recovery claims"
    rule: "Keep any downstream credit outside this factory-gate foreground inventory unless the selected downstream LCA method explicitly requires it; disclose that method and all parameters."
    source_ids:
      - afw-pefcr-v3-1-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_cutting_records
      process_id: "cutting"
      flow_role: "finished fabric, electricity, accepted panels, cutting offcuts"
      record_type: "BOM, material issue and return log, batch scale record, meter record, waste ticket"
      raw_fields: "batch_id; product_code; fabric_specification; issued_fabric_kg; returned_fabric_kg; accepted_panel_kg; offcut_kg; electricity_kWh; meter_id; timestamp"
      collection_method: "reconcile material issue and return records to calibrated batch scales and the cutting-area electricity meter"
      unit: "kg; kWh"
      frequency: "each production batch with monthly meter reconciliation"
      temporal_coverage: "at least 12 consecutive representative months or the full production campaign"
      site_scope: "all cutting lines producing the declared product"
      aggregation_rule: "sum verified batch records and normalize by accepted finished garment mass"
      quality_evidence: "calibration certificate; signed issue and return log; meter photograph or export; waste receipt"
    - protocol_id: cp_sewing_records
      process_id: "sewing_assembly"
      flow_role: "panels, thread, interlining, buttons, fasteners, electricity, sewn shells, sewing wastes"
      record_type: "BOM, issue and return log, component counts, batch-average component weights, meter record, rejection log"
      raw_fields: "batch_id; component_id; component_material; issued_kg; returned_kg; installed_count; average_component_kg; accepted_shell_kg; thread_waste_kg; rejected_component_kg; electricity_kWh"
      collection_method: "collect product-specific material issues and counts, weigh representative component batches, and reconcile to accepted shell mass"
      unit: "kg; count; kWh"
      frequency: "each production batch"
      temporal_coverage: "at least 12 consecutive representative months or the full production campaign"
      site_scope: "all sewing and assembly lines producing the declared product"
      aggregation_rule: "sum batch inputs, outputs, and separated wastes; normalize by accepted shell mass and then by reference garment mass"
      quality_evidence: "approved BOM; calibrated scale record; line meter record; rejection disposition record"
    - protocol_id: cp_wet_processing_records
      process_id: "wet_processing"
      flow_role: "garment charge, water, detergent, softener, electricity, steam, garment output, wastewater"
      record_type: "batch sheet, dosing record, water meter, electricity meter, steam meter or invoice, wastewater meter"
      raw_fields: "batch_id; garment_input_kg; water_kg; detergent_kg; softener_kg; electricity_kWh; steam_MJ; dry_output_kg; wastewater_kg; treatment_route"
      collection_method: "capture each wet batch from calibrated meters and dosing systems; reconcile water input, product retention, and wastewater discharge"
      unit: "kg; kWh; MJ"
      frequency: "each wet-processing batch"
      temporal_coverage: "at least 12 consecutive representative months or the full production campaign"
      site_scope: "on-site and subcontracted wet-processing facilities used for the declared product"
      aggregation_rule: "sum complete batch records and normalize by dry accepted wet-processed garment mass"
      quality_evidence: "meter calibration; signed batch sheet; chemical issue record; wastewater discharge and treatment record"
    - protocol_id: cp_finishing_records
      process_id: "finishing_inspection"
      flow_role: "garment input, electricity, steam, accepted garment, defective garment"
      record_type: "production release, line meter, steam meter or invoice, final inspection log, calibrated scale record"
      raw_fields: "batch_id; input_route; garment_input_kg; electricity_kWh; steam_MJ; accepted_garment_kg; defective_garment_kg; defect_code"
      collection_method: "measure route-specific input mass, directly assigned utilities, accepted output, and rejects for each finishing batch"
      unit: "kg; kWh; MJ"
      frequency: "each production batch"
      temporal_coverage: "at least 12 consecutive representative months or the full production campaign"
      site_scope: "all finishing and inspection lines producing the declared product"
      aggregation_rule: "sum accepted and rejected mass by route; normalize utilities and wastes by accepted garment mass"
      quality_evidence: "line release; meter record; scale calibration; signed inspection and disposition log"
    - protocol_id: cp_packaging_records
      process_id: "packaging"
      flow_role: "finished garment, polymer bag, hangtag, carton, electricity, reference garment, packaging wastes"
      record_type: "packaging BOM, component count, average component weight, carton packing record, line meter, waste ticket"
      raw_fields: "batch_id; garment_mass_kg; packaging_item_id; packaging_material; installed_count; average_item_kg; carton_mass_kg; packed_garment_mass_kg; electricity_kWh; packaging_waste_kg"
      collection_method: "weigh garment output separately from packaging, weigh representative packaging-item batches, and reconcile issued items to packed items and waste"
      unit: "kg; count; kWh"
      frequency: "each packaging batch"
      temporal_coverage: "at least 12 consecutive representative months or the full production campaign"
      site_scope: "all packaging lines and packing contractors for the declared product"
      aggregation_rule: "sum packaging material and energy by batch; normalize to 1 kg garment mass excluding packaging"
      quality_evidence: "approved packaging specification; scale calibration; line meter record; waste receipt"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground exchanges"
      rule: "normalized amount = verified exchange amount / verified accepted garment mass in kg"
      inputs:
        - "exchange amount"
        - "accepted garment mass excluding packaging"
      output: "exchange amount per 1 kg reference garment"
      source_ids:
        - ec-pef-method-2021
    - id: calc_cutting_balance
      applies_to: "cutting"
      rule: "net fabric input = issued fabric - returned unused fabric; reconcile net input with accepted panels plus measured cutting offcuts and documented residual discrepancy"
      inputs:
        - "issued fabric mass"
        - "returned fabric mass"
        - "accepted panel mass"
        - "offcut mass"
      output: "cutting mass-balance statement"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_component_mass
      applies_to: "counted buttons, fasteners, bags, and hangtags"
      rule: "component mass = installed count × measured average mass per component from the same specification and batch or a documented representative sample"
      inputs:
        - "installed count"
        - "average component mass"
      output: "incorporated component mass"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_assembly_balance
      applies_to: "sewing_assembly"
      rule: "reconcile cut panels plus incorporated components with accepted sewn shells, separated thread offcuts, rejected textile components, and documented residual discrepancy"
      inputs:
        - "panel mass"
        - "component masses"
        - "accepted shell mass"
        - "separated waste masses"
      output: "assembly mass-balance statement"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_wet_process_balance
      applies_to: "wet_processing"
      rule: "reconcile garment input, water, chemical formulations, dry garment output, wastewater, retained moisture, and documented evaporation without netting electricity or steam into the mass balance"
      inputs:
        - "garment input mass"
        - "water mass"
        - "chemical formulation masses"
        - "dry output mass"
        - "wastewater mass"
      output: "wet-process mass-balance statement"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_shared_electricity
      applies_to: "shared electricity meter"
      rule: "allocated kWh = shared-meter kWh × conforming product mass / total conforming mass produced by the same metered equipment and period"
      inputs:
        - "shared-meter kWh"
        - "product conforming mass"
        - "total conforming mass"
      output: "product-specific electricity kWh"
      source_ids:
        - afw-pefcr-v3-1-2025
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain the approved specification showing garment type, men's or boys' designation, woven construction, fibre composition, reference size, finish, and product mass."
      evidence: "approved product specification and dated BOM"
    - id: dq_bom_coverage
      applies_to: "material inventory"
      requirement: "Product-specific primary BOM data must cover at least 95% of product mass and 100% of the main fabric, lining, padding, metals, and electronic parts when present; disclose the uncovered share."
      evidence: "BOM coverage calculation and supplier specifications"
    - id: dq_temporal_coverage
      applies_to: "all foreground processes"
      requirement: "Use at least 12 consecutive representative months unless the product is campaign-based; in that case use the complete campaign and disclose seasonality."
      evidence: "dated batch records and reporting-period reconciliation"
    - id: dq_metering
      applies_to: "electricity, steam, water, and wastewater"
      requirement: "Identify each meter, calibration status, reading interval, process coverage, and any allocation from a shared meter."
      evidence: "calibration certificate, meter export, invoice reconciliation, and allocation worksheet"
    - id: dq_mass_balance
      applies_to: "cutting, sewing, wet processing, finishing, and packaging"
      requirement: "Reconcile measured inputs, accepted outputs, separated wastes, moisture changes, and documented residual discrepancies at process level."
      evidence: "signed process mass-balance worksheets and scale calibration records"
    - id: dq_waste_destination
      applies_to: "every waste flow"
      requirement: "Record waste composition, mass, date, receiving operator, treatment route, and evidence of transfer; do not combine textile, polymer, paperboard, wastewater, or defective garment wastes."
      evidence: "waste transfer note, treatment receipt, and waste register"
    - id: dq_representativeness
      applies_to: "linked upstream datasets"
      requirement: "Document geographic, temporal, and technological representativeness and any proxy limitation for each linked fabric, component, utility, packaging, and waste-treatment dataset."
      evidence: "dataset metadata and data-quality assessment"
    - id: dq_uncertainty_disclosure
      applies_to: "reported results"
      requirement: "Disclose data gaps, proxy use, shared-meter allocations, residual mass-balance differences, and uncertainty relevant to result interpretation."
      evidence: "data-quality report and verification record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The reference product UUID must equal 66e77e01-9118-4c94-a727-c8bbcf2d4eee, resolve as a state-100 Product flow classified to CPC 28232, and use Mass 93a60a56-a3c8-11da-a746-0800200b9a66 with kg from Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66."
    source_ids:
      - un-cpc-3-0-28232
  - rule_id: validate_reference_amount
    applies_to: "reference flow"
    rule: "Accepted garment output must normalize to exactly 1 kg excluding packaging mass, and the unnormalized accepted mass must remain traceable."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_scope
    applies_to: "product identity"
    rule: "The declared product must be a men's or boys' garment made from textile fabric that is not knitted or crocheted and must not fall under an excluded product group."
    source_ids:
      - un-cpc-3-0-28232
      - afw-pefcr-v3-1-2025
  - rule_id: validate_process_coverage
    applies_to: "foreground process map"
    rule: "Cutting, sewing and assembly, finishing and inspection, and packaging must be present; wet processing must be present whenever the production route includes garment washing, dyeing, rinsing, or softening."
    source_ids:
      - afw-pefcr-v3-1-2025
      - olugbemi-bolson-2026-shirt-carbon
  - rule_id: validate_atomic_rows
    applies_to: "process inventory"
    rule: "Every inventory card must describe one specific exchange; electricity, steam, water, each component, each chemical formulation, each packaging item, and each waste stream must remain separate."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_uuid_evidence
    applies_to: "UUID-bearing rows"
    rule: "Store a Tiangong UUID only after hybrid-search candidate evidence and state-100 detail evidence agree on identity, flow type, classification where applicable, and reference property; otherwise leave the UUID absent and retain the manifest review item."
    source_ids: []
  - rule_id: validate_bom
    applies_to: "material inputs"
    rule: "BOM coverage and mass must satisfy dq_bom_coverage, and every incorporated component used by the declared product must be represented by an input row."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_mass_balance
    applies_to: "foreground processes"
    rule: "Each process mass balance must identify accepted output, every separately measured waste, moisture change where relevant, and any residual discrepancy; unexplained netting is not conformant."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_energy_allocation
    applies_to: "electricity and steam"
    rule: "Process-specific meter data must be used when available; every shared-meter allocation must state the metered boundary, period, physical driver, numerator, and denominator."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_waste_routes
    applies_to: "waste outputs"
    rule: "Each waste row must have a recorded receiving treatment route and transfer evidence; a sale or recycling claim does not permit omission from the foreground inventory."
    source_ids:
      - afw-pefcr-v3-1-2025
published_dataset_profile:
  dataset_role: "secondary_dataset; eligible for background_dataset use after methodology and data review"
  downstream_use: "Foreground process and lifecyclemodel construction for factory-gate production of CPC 28232 garments"
  allowed_use: "Product-specific factory-gate studies whose garment scope, production route, geography, time period, BOM, wet-processing applicability, and packaging configuration match the dataset"
  excluded_use: "Knitted or crocheted apparel; other demographic or product categories; protective apparel; cradle-to-grave claims without downstream stages; comparative assertions without a separately applicable comparison method and review"
  required_metadata: "canonical PCR id; product flow UUID; CPC reference; product specification; fibre composition; reference size; BOM coverage; wet-processing route; facility and subcontractor geography; reference year; allocation methods; packaging configuration; waste destinations; source ids"
  required_quality_disclosure: "primary-data coverage; meter coverage and calibration; shared-resource allocations; process mass-balance residuals; data gaps; proxy datasets; geographic, temporal, and technological representativeness; uncertainty and verification status"
  update_trigger: "Change in garment construction or BOM, main fabric or finish, production route, wet-processing technology, facility geography, electricity or steam supply, packaging configuration, waste treatment, reference-flow identity, applicable PEF method, or evidence that materially changes a rule"
data_sources:
  - id: "un-cpc-3-0-28232"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0, code 28232 classification detail and Draft CPC Ver. 3.0 Explanatory Notes, https://unstats.un.org/unsd/classifications/Econ/Detail/EN/3/28232 and https://unstats.un.org/unsd/classifications/Meetings/UNCEISC2024_2nd/Session7_Bk2_CPC3_Exp_Notes_1Nov2024.pdf, accessed 2026-08-13"
    used_for: "Product scope, exclusions, and classification identity"
