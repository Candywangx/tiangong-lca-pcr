    used_for: "Apparel subcategories, functional-unit context, BOM coverage, process decomposition, manufacturing losses, utilities, packaging, allocation, data collection, and validation"
  - id: "ec-pef-method-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279 of 15 December 2021 on the use of the Environmental Footprint methods, consolidated text, https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng, accessed 2026-08-13"
    used_for: "Completeness, company-specific manufacturing data, inventory classification, allocation hierarchy, reporting, and verification"
