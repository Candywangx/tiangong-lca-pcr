  product_classification_scope: "The finished reference product is CPC 3.0 28221; fabrics, yarns, components, chemicals, utilities, packaging, transport, and treatment services retain their own identities"
  recursive_input_rule: "If an input is already a finished CPC 28221 garment, record it as a separately identified reused, reworked, or intermediate garment input and do not recursively reconstruct its history inside this foreground package"
  upstream_dataset_requirement: "Require representative upstream datasets for every purchased fabric and component, fibre and yarn production where not already included, knitting and fabric wet processing, purchased energy, packaging manufacture, inbound transport, and off-site waste or wastewater treatment"
  disclosure: "Declare operator control, geography, technology, reporting period, bill of materials, supplier route, all included and excluded operations, and every proxy or data gap"
