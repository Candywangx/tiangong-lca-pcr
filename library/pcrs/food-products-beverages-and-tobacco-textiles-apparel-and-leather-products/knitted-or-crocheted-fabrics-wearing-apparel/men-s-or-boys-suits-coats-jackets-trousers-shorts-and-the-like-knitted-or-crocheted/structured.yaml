system_boundary:
  rules:
    - rule_id: boundary_required_foreground
      applies_to: "Garment manufacturing"
      rule: "Include material receipt and preparation, spreading and cutting, sewing and assembly, final inspection, packaging, directly controlled utilities, product rejects, and generated wastes."
      source_ids:
        - af-pefcr-2025-v3-1
    - rule_id: boundary_conditional_wet_finishing
      applies_to: "Garment-stage wet or thermal treatment"
      rule: "Include washing, chemical treatment, dyeing, printing, coating, curing, drying, directly associated utilities, wastewater, waste, and relevant direct emissions whenever performed under foreground control; otherwise prevent double counting against upstream datasets."
      source_ids:
        - jrc-textiles-bref-2023
        - eu-textiles-bat-2022-2508
        - af-pefcr-2025-v3-1
    - rule_id: boundary_upstream_traceability
      applies_to: "Purchased materials and services"
      rule: "Do not treat delivered fabric, thread, lining, interlining, closures, packaging, electricity, steam, transport, or treatment as burden-free; connect each to a representative upstream dataset or disclose the gap."
      source_ids:
        - ec-pef-2021-2279
        - af-pefcr-2025-v3-1
    - rule_id: boundary_manufacturing_waste
      applies_to: "Every foreground process"
      rule: "Include manufacturing waste at the process where it arises, preserve material identity and destination, and do not hide rejects or leftovers in product yield."
      source_ids:
        - af-pefcr-2025-v3-1
    - rule_id: boundary_atomic_exchange
      applies_to: "Every inventory row"
      rule: "Represent one chemically or physically specific exchange per row; use separate rows for each fabric, trim, utility, chemical, packaging component, waste stream, and elementary emission."
      source_ids:
        - eu-textiles-bat-2022-2508
    - rule_id: boundary_downstream_separation
      applies_to: "Dataset use"
      rule: "Keep distribution, retail, consumer care, reuse, and end-of-life outside the manufacturing foreground package while preserving metadata required to connect those stages downstream."
      source_ids:
        - ec-pef-2021-2279
        - af-pefcr-2025-v3-1
boundary_abstraction:
  declared_starting_condition: "Finished 65% polyester/35% cotton weft-knitted shell fabric and each specific purchased thread, lining, interlining, closure, packaging, chemical, and utility delivered to the first foreground garment-manufacturing operation"
