allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Distinct garment subtypes, materials, finishing routes, and packaging configurations"
    rule: "Subdivide production orders and processes and use product-specific records before applying allocation."
    source_ids:
      - ec-pef-2021-2279
      - af-pefcr-2025-v3-1
  - rule_id: allocation_assembly_units
    applies_to: "Shared sewing and assembly operations"
    rule: "When subdivision is not feasible, allocate assembly activity using measured production units only when products receive equivalent operations; otherwise use measured operating time or another documented causal driver."
    source_ids:
      - af-pefcr-2025-v3-1
  - rule_id: allocation_shared_utilities
    applies_to: "Shared electricity, steam, water, and common equipment"
    rule: "Prefer dedicated metering; otherwise allocate by a documented physical driver such as operating time, throughput, steam demand, or metered batch volume and disclose sensitivity."
    source_ids:
      - ec-pef-2021-2279
      - eu-textiles-bat-2022-2508
  - rule_id: allocation_rework_internal
    applies_to: "Rework retained inside the manufacturing site"
    rule: "Keep rework loops internal, record additional measured inputs, and do not create a co-product credit for the reworked garment."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_scrap_destination
    applies_to: "Cutting scrap, thread offcuts, and rejected garments"
    rule: "Record waste mass and destination without an avoided-burden credit inside the foreground package; downstream recycling or substitution belongs to the explicitly declared downstream model."
    source_ids:
      - ec-pef-2021-2279
      - af-pefcr-2025-v3-1
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_records
      process_id: "material_cutting_garment_assembly"
      flow_role: "Shell fabric, sewing thread, lining, and interlining"
      record_type: "Receiving, issue, return, stock, and scale records"
      raw_fields: "material identity; composition; specification; supplier lot; opening stock; receipts; issues; returns; closing stock; net mass"
      collection_method: "Calibrated scales and controlled inventory records"
      unit: "kg"
      frequency: "Each material lot and production order"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included stores, cutting lines, and assembly lines"
      aggregation_rule: "Calculate net consumption by material and order; reconcile to stock movement"
      quality_evidence: "Scale calibration; supplier specification; lot traceability; stock reconciliation"
    - protocol_id: cp_component_count_mass_records
      process_id: "garment_assembly"
      flow_role: "Nylon-coil zippers and polyester four-hole buttons"
      record_type: "Component issue/return and unit-mass test records"
      raw_fields: "component identity; specification; lot; issued count; returned count; installed count; sample count; sample mass; mean unit mass"
      collection_method: "Controlled counts plus calibrated-scale unit-mass test"
      unit: "count and kg"
      frequency: "Each component lot and production order"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included assembly lines"
      aggregation_rule: "Net installed count × verified mean unit mass; reconcile to issues less returns"
      quality_evidence: "Count reconciliation; scale calibration; unit-mass test; bill of materials"
    - protocol_id: cp_electricity_records
      process_id: "material_cutting_garment_assembly_garment_wet_finishing_inspection_packaging"
      flow_role: "User-side low-voltage electricity"
      record_type: "Process-submeter or documented allocation record"
      raw_fields: "meter id; opening reading; closing reading; kWh; process id; lot; time interval; shared-meter driver"
      collection_method: "Calibrated submeter; documented physical allocation only when dedicated metering is unavailable"
      unit: "kWh"
      frequency: "Each lot or meter interval"
      temporal_coverage: "Complete reporting period"
      site_scope: "Every included electricity user"
      aggregation_rule: "Difference of validated readings assigned once to process and lot"
      quality_evidence: "Calibration; reading log; allocation worksheet; invoice reconciliation"
    - protocol_id: cp_production_output_records
      process_id: "material_cutting_garment_assembly_inspection_packaging"
      flow_role: "Cut panels, assembled garments, inspection input, and accepted output"
      record_type: "Production transfer, scale, and inspection records"
      raw_fields: "product id; garment subtype; order; lot; qualifiers; gross mass; packaging mass; net mass; accepted quantity; rejected quantity"
      collection_method: "Calibrated scales linked to production and release records"
      unit: "kg"
      frequency: "Each production lot"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included lines"
      aggregation_rule: "Sum accepted net output separately from rejects and packaging"
      quality_evidence: "Scale calibration; transfer record; inspection release; lot genealogy"
    - protocol_id: cp_waste_mass_records
      process_id: "material_cutting_garment_assembly_inspection_packaging"
      flow_role: "Knitted cutting scrap, polyester thread offcuts, and rejected garments"
      record_type: "Waste scale and transfer records"
      raw_fields: "waste identity; composition; source row_id; lot; gross mass; tare; net mass; rework status; destination"
      collection_method: "Calibrated scale at generation or dispatch, reconciled to destination evidence"
      unit: "kg"
      frequency: "Each waste transfer"
      temporal_coverage: "Complete reporting period"
      site_scope: "Every included waste generation point"
      aggregation_rule: "Sum net mass by atomic waste row, lot, and destination"
      quality_evidence: "Scale calibration; transfer note; destination receipt; rework log"
    - protocol_id: cp_wet_finishing_records
      process_id: "garment_wet_finishing"
      flow_role: "Garment input/output, fresh process water, and wastewater"
      record_type: "Batch sheet, transfer scale, and inlet/outlet meter records"
      raw_fields: "recipe id; garment lot; input mass; output mass; inlet meter; outlet meter; recirculated water; discharge route; treatment"
      collection_method: "Calibrated scales and flow meters linked to finishing batches"
      unit: "kg and m3"
      frequency: "Each finishing batch or meter interval"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included finishing lines and discharge points"
      aggregation_rule: "Aggregate each exchange separately; reconcile garment and water balances"
      quality_evidence: "Calibration; batch sheet; water balance; discharge record"
    - protocol_id: cp_chemical_recipe_records
      process_id: "garment_wet_finishing"
      flow_role: "Nonionic detergent and sodium hydroxide"
      record_type: "Recipe, issue, return, concentration, and stock records"
      raw_fields: "chemical identity; formulation; supplier; lot; issued mass; returned mass; active fraction; recipe id"
      collection_method: "Controlled recipe and stock records reconciled to supplier specification or safety data sheet"
      unit: "kg formulation and kg active substance"
      frequency: "Each finishing batch"
      temporal_coverage: "Complete reporting period"
      site_scope: "Every included recipe and line"
      aggregation_rule: "Net formulation mass by chemical; calculate active-equivalent mass only where specified"
      quality_evidence: "Batch sheet; supplier specification; safety data sheet; stock reconciliation"
    - protocol_id: cp_steam_records
      process_id: "garment_wet_finishing"
      flow_role: "Purchased saturated steam"
      record_type: "Steam-meter and supplier records"
      raw_fields: "meter id; opening reading; closing reading; steam mass; pressure; condensate return; batch"
      collection_method: "Calibrated steam meter reconciled to supplier invoice"
      unit: "kg"
      frequency: "Each batch or meter interval"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included steam users"
      aggregation_rule: "Validated meter difference assigned to the applicable batch"
      quality_evidence: "Calibration; supplier invoice; pressure log; condensate record"
    - protocol_id: cp_packaging_records
      process_id: "inspection_packaging"
      flow_role: "PE-LD garment bags and corrugated-board boxes"
      record_type: "Packaging issue/return, count, specification, and unit-mass records"
      raw_fields: "packaging identity; material; specification; issued count; returned count; packed garment count; sample mass; mean unit mass"
      collection_method: "Controlled count records plus calibrated-scale unit-mass test"
      unit: "count and kg"
      frequency: "Each packaging lot and production order"
      temporal_coverage: "Complete reporting period"
      site_scope: "Every included packing line"
      aggregation_rule: "Net packaging count × verified mean unit mass; allocate shared boxes by packed garment mass"
      quality_evidence: "Specification; count reconciliation; scale calibration; packing record"
  calculation_rules:
    - id: calc_net_material_consumption
      applies_to: "Every issued fabric, thread, lining, interlining, and packaging input"
      rule: "net consumption = opening stock + receipts - closing stock - documented unused return, reconciled to production issues"
      inputs:
        - "stock and transaction records"
      output: "kg net material consumed"
      source_ids:
        - af-pefcr-2025-v3-1
    - id: calc_component_mass
      applies_to: "Nylon-coil zippers and polyester four-hole buttons"
      rule: "component mass = verified net installed count × verified mean unit mass for the same specification and lot"
      inputs:
        - counts
        - "sampled component mass"
        - "sample count"
      output: "kg component input"
      source_ids:
        - af-pefcr-2025-v3-1
    - id: calc_active_sodium_hydroxide
      applies_to: "Sodium hydroxide formulation"
      rule: "active-equivalent mass = net formulation mass × verified sodium-hydroxide mass fraction"
      inputs:
        - "issued formulation"
        - "returned formulation"
        - "active mass fraction"
      output: "kg sodium hydroxide at 100% active equivalent"
      source_ids:
        - eu-textiles-bat-2022-2508
    - id: calc_reference_normalization
      applies_to: "Every inventory exchange"
      rule: "normalized exchange = reporting-period exchange ÷ reporting-period net accepted finished-garment mass"
      inputs:
        - "exchange amount"
        - "accepted product mass"
      output: "exchange amount per 1 kg reference product"
      source_ids:
        - ec-pef-2021-2279
    - id: calc_garment_mass_balance
      applies_to: "Cutting through final inspection"
      rule: "Reconcile shell fabric, thread, lining, interlining, closures, accepted garments, measured stock change, cutting scrap, thread offcuts, rejected garments, and retained rework; investigate every residual."
      inputs:
        - "material inputs"
        - "intermediate and final outputs"
        - waste
        - "stock change"
        - "retained rework"
      output: "reporting-period mass-balance reconciliation"
      source_ids:
        - af-pefcr-2025-v3-1
    - id: calc_water_balance
      applies_to: "Conditional wet finishing"
      rule: "water-balance residual = fresh inlet + other declared water inputs - wastewater discharge - measured product moisture change - separately measured evaporation or retained water"
      inputs:
        - "inlet and outlet meters"
        - "garment moisture"
        - "evaporation estimate"
      output: "disclosed water-balance residual"
      source_ids:
        - eu-textiles-bat-2022-2508
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Every flow row"
      requirement: "Preserve exactly one chemically or physically specific exchange per row; disclose every row without a double-verified UUID and retain the identity decision."
      evidence: "Manifest inventory identity review and verification record"
    - id: dq_product_specification
      applies_to: "Reference product"
      requirement: "Record every required qualifier and link it to the approved product specification and bill of materials."
      evidence: "Product specification; bill of materials; inspection release"
    - id: dq_temporal_coverage
      applies_to: "Foreground activity data"
      requirement: "Cover a representative continuous reporting period and identify shutdowns, trials, abnormal operations, and missing intervals."
      evidence: "Dated meter, production, stock, batch, and waste records"
    - id: dq_meter_quality
      applies_to: "Mass, electricity, water, and steam records"
      requirement: "Use calibrated equipment and retain validity, resolution, conversion method, and shared-meter treatment."
      evidence: "Calibration certificates; meter logs; allocation worksheet"
    - id: dq_completeness
      applies_to: "Process inventory"
      requirement: "Reconcile materials, components, water, energy, product, waste, wastewater, stock change, and relevant direct emissions; explain every residual and exclusion."
      evidence: "Mass balance; water balance; energy reconciliation; exclusion log"
    - id: dq_representativeness
      applies_to: "Upstream datasets"
      requirement: "Match geography, technology, material composition, recycled content, supplier state, voltage, steam pressure, and time period to the declared foreground exchange."
      evidence: "Dataset selection record; supplier specification; data-quality assessment"
    - id: dq_primary_data
      applies_to: "Site-controlled operations"
      requirement: "Use site and production-order records for all foreground amounts; do not substitute AI-generated ranges or default amounts for missing records."
      evidence: "Collection-protocol evidence and source-system extracts"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require the state100 Product-flow UUID e5e9f30a-061b-4cbc-bdb3-3d86985acff6, exact CPC 28221 identity, Mass property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, reference unit kg, 1 kg amount, and all required qualifiers."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: validate_atomic_inventory
    applies_to: "Every process inventory card"
    rule: "Require one concrete exchange per card; reject collection labels, combined utilities, material selectors, and placeholder identities."
    source_ids:
      - eu-textiles-bat-2022-2508
  - rule_id: validate_uuid_evidence
    applies_to: "Every UUID-bearing row"
    rule: "Require both hybrid-search selection evidence and state100 direct-read evidence; otherwise omit the UUID and retain the row-specific rejection in manifest review metadata."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: validate_bilingual_alignment
    applies_to: "English and Chinese PCR files"
    rule: "Require identical ordered process_id, row_id, controlled token, source-id, and UUID sequences in both renderings."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: validate_required_processes
    applies_to: "Foreground route"
    rule: "Require material_cutting, garment_assembly, and inspection_packaging; require garment_wet_finishing only when the reporting site performs the declared wet or thermal treatment."
    source_ids:
      - af-pefcr-2025-v3-1
      - jrc-textiles-bref-2023
  - rule_id: validate_foreground_amounts
    applies_to: "Every non-fixed inventory exchange"
    rule: "Require the linked collection protocol and reporting-period foreground record; reject AI-generated quantity ranges and unrecorded defaults."
    source_ids:
      - af-pefcr-2025-v3-1
      - ec-pef-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "Garment production"
    rule: "Require reconciliation of each material input with accepted product, stock change, its specific waste output, rejects, and retained rework."
    source_ids:
      - af-pefcr-2025-v3-1
  - rule_id: validate_wet_finishing
    applies_to: "Conditional garment_wet_finishing"
    rule: "When applicable, require separate records for every actual chemical, utility, wastewater stream, waste stream, and relevant direct emission in addition to the representative rows defined here."
    source_ids:
      - jrc-textiles-bref-2023
      - eu-textiles-bat-2022-2508
  - rule_id: validate_packaging_separation
    applies_to: "Final inspection and packaging"
    rule: "Require PE-LD garment bags and corrugated-board boxes as separate inputs and exclude both from the 1 kg net reference product."
    source_ids:
      - af-pefcr-2025-v3-1
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package for one declared CPC 28221 knitted or crocheted men's/boys' garment subtype and production route"
  downstream_use: "May be published after review as a secondary_dataset or background_dataset and projected into process or lifecyclemodel records"
  allowed_use: "Product-specific manufacturing inventories, supplier data exchange, verified hotspot analysis, and downstream lifecycle models when geography, technology, composition, garment subtype, size mix, finishing route, and time period are representative"
  excluded_use: "Direct comparison of materially different garments without aligned functional performance; use-phase claims without lifetime and care scenarios; substitution for fibre, yarn, fabric, distribution, use, or end-of-life datasets; environmental claims before independent review"
  required_metadata: "PCR id; reference UUID; garment subtype; wearer group; fibre composition; knit/crochet construction; bill of materials; size mix; net mass; colour and finish; component applicability; site and geography; supplier routes; included processes; reporting period; allocation; upstream datasets; waste destinations; collection protocols; identity gaps"
  required_quality_disclosure: "Primary-data coverage; meter and scale calibration; mass-, water-, and energy-balance residuals; missing intervals; shared-meter allocation; proxy datasets; UUID omissions; exclusions; abnormal operations; wet-finishing applicability; reviewer status"
  update_trigger: "Change in garment subtype, composition, construction, bill of materials, supplier wet-processing state, site, technology, finishing recipe, allocation, packaging, waste route, reporting period, reference-flow identity, source rules, or any material data-quality condition"
