    role: "Convert issued fabric and applicable interlinings into cut garment components while recording cutting losses"
    quantitative_reference: "kg cut components"
  - id: sewing_assembly
    name: "Sewing, trim attachment, and assembly"
    inclusion: "required"
    inclusion_condition: "Always included for cut-and-sew manufacture"
    role: "Assemble cut components and product-specific trims into a garment"
    quantitative_reference: "kg assembled garment"
  - id: garment_wet_processing
    name: "Garment wet processing"
    inclusion: "conditional"
    inclusion_condition: "Include only when the assembled article is washed, garment-dyed, bleached, neutralised, softened, or otherwise wet-processed"
    role: "Apply the declared wet recipe and record water, individual chemicals, thermal energy, wastewater, and direct emissions"
    quantitative_reference: "kg wet-processed garment"
  - id: finishing_pressing
    name: "Pressing, dry finishing, inspection, and repair"
    inclusion: "required"
    inclusion_condition: "Include applicable pressing, dry finishing, final inspection, and in-line repair before sale packaging"
    role: "Produce a conforming finished article and isolate rejects"
    quantitative_reference: "kg finished garment"
  - id: sale_packaging
    name: "Sale packaging and plant-gate release"
    inclusion: "required"
    inclusion_condition: "Include all primary, secondary, and tertiary packaging applied before the manufacturing site gate"
    role: "Package and release the reference product while keeping net garment and packaging masses separate"
    quantitative_reference: "1 kg net finished article"
