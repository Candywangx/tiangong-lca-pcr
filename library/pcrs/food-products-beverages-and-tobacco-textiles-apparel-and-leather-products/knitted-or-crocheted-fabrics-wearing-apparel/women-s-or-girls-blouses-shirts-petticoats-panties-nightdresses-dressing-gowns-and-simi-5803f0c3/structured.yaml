system_boundary:
  rules:
    - rule_id: boundary_foreground_gate_to_gate
      applies_to: "Foreground manufacturing"
      rule: "Include material receipt into the reporting site, cutting, sewing and assembly, applicable garment wet processing, pressing and finishing, inspection, handling of manufacturing losses, and sale packaging through the manufacturing site gate."
      source_ids:
        - pefcr-apparel-footwear-2025
        - sandin-knitted-garment-2024
    - rule_id: boundary_upstream_links
      applies_to: "Purchased fabrics, trims, chemicals, energy, water, and packaging"
      rule: "Keep each purchased input visible and link it to a geographically, technologically, and temporally representative upstream dataset; upstream fibre, yarn, and fabric production are not absorbed into foreground garment operations."
      source_ids:
        - eu-pef-method-2021
        - pefcr-apparel-footwear-2025
    - rule_id: boundary_conditional_routes
      applies_to: "Wet processing and on-site thermal energy"
      rule: "Include each conditional process and its atomic inputs, wastewater, wastes, and direct emissions only when records show that it occurred for the declared product; document an explicit not-applicable determination otherwise."
      source_ids:
        - eu-textiles-bref-2023
        - pefcr-apparel-footwear-2025
    - rule_id: boundary_losses
      applies_to: "Cutting scrap, assembly losses, rejects, and packaging scrap"
      rule: "Report manufacturing losses and leftovers as separate waste outputs by material and treatment route; do not net recyclable scrap against virgin material input or finished-product output."
      source_ids:
        - pefcr-apparel-footwear-2025
    - rule_id: boundary_exclusions
      applies_to: "Distribution, retail, use, repair, and end-of-life"
      rule: "Exclude these stages from the foreground data package and state the exclusion; add linked downstream scenarios only in a wider lifecycle model."
      source_ids:
        - eu-pef-method-2021
        - pefcr-apparel-footwear-2025
boundary_abstraction:
  declared_starting_condition: "Purchased knitted or crocheted fabric, trims, process auxiliaries, and packaging are received at the reporting manufacturing site with identity, mass, supplier, and upstream dataset references available"
  starting_condition_role: "Foreground gate-to-gate garment manufacturing entry point"
  product_classification_scope: "Finished women's or girls' knitted or crocheted articles within CPC 28224; intermediate cut panels and assembled garments are manufacturing states, not separate classification claims"
  recursive_input_rule: "If an already finished CPC 28224 article enters for subcontract finishing, rework, or repackaging, record it once as a same-category product input with its upstream dataset and model only the added foreground operations; do not recursively recreate its prior manufacturing inventory"
  upstream_dataset_requirement: "Every purchased fabric, trim, chemical, energy carrier, water supply, and packaging material requires a representative upstream dataset or a disclosed unresolved data gap"
  disclosure: "Declare product subtype, BOM coverage, fibre composition, reference size, site and period, included processes, outsourced operations, wet-processing recipe, energy supply, loss destinations, packaging configuration, and all exclusions"
