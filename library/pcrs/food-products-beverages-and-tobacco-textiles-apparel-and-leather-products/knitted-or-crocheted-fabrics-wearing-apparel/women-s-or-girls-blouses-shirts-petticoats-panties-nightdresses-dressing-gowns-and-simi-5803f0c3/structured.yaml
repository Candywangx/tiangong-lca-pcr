measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh or calculate net saleable garment mass without polybags, cartons, hangtags, inserts, or other sale packaging; normalize every inventory amount to 1 kg net finished article."
  - id: bom_mass_basis
    applies_to: "Fabrics, trims, and auxiliaries retained in the article"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record purchased and issued mass by specific material; do not substitute gross product weight for a bill of materials when the bill of materials is available."
  - id: packaging_separation
    applies_to: "Sale packaging"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure each packaging material separately and exclude it from the reference product mass while retaining it as an input normalized to the reference flow."
  - id: energy_carrier_separation
    applies_to: "Electricity, purchased steam, natural gas, and LPG"
    required_property_ref:
      name: "Carrier-specific energy property"
      uuid: ""
    required_unit: "kWh, MJ, kg, or m3 as metered"
    rule: "Preserve the recorded carrier and unit; never combine electricity, steam, natural gas, or LPG into one energy amount. Conversion factors and calorific-value bases shall be disclosed."
  - id: water_mass_volume
    applies_to: "Process water and textile wastewater"
    required_property_ref:
      name: "Mass or volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Preserve measured water and wastewater units; if converted, report density, temperature basis when material, and the exact conversion used."
process_map:
  - id: material_cutting
    name: "Material preparation and cutting"
    inclusion: "required"
