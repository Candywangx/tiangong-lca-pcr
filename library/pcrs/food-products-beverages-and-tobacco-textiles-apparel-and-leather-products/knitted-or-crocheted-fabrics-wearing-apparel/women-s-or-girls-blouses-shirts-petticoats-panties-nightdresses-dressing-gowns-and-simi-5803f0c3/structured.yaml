allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Product-dedicated and shared manufacturing operations"
    rule: "Avoid allocation by product-specific metering, batch segregation, equipment-time records, or subdivision of unit operations wherever the input or emission can be directly assigned."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical_causality
    applies_to: "Shared utilities and common operations that cannot be subdivided"
    rule: "Allocate using the documented physical driver that causes the burden, such as machine operating time, steam demand, processed mass, or occupied equipment time; do not default to finished-product mass when it is not causal."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_economic_last_resort
    applies_to: "Multi-output operations with no defensible physical relationship"
    rule: "Use economic allocation only after documenting why subdivision, system expansion, and physical allocation are not feasible; use contemporaneous net-gate values and disclose the sensitivity of results."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_scrap_no_credit
    applies_to: "Recyclable manufacturing scrap and packaging waste"
    rule: "Report the full mass and destination of scrap; do not subtract sale revenue or avoided virgin production from the foreground inventory. Any recycling benefit or burden belongs to the explicitly selected background or lifecycle-model convention."
    source_ids:
      - pefcr-apparel-footwear-2025
      - eu-pef-method-2021
  - rule_id: allocation_rework
    applies_to: "In-line repair and rework"
    rule: "Retain rework material and energy in the producing batch. If rework crosses reporting periods, reconcile opening and closing work-in-progress and disclose the method."
    source_ids:
      - pefcr-apparel-footwear-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_cutting_records
      process_id: "material_cutting"
      flow_role: "Fabric, interlining, marker paper, electricity, cut output, and separated cutting wastes"
      record_type: "BOM issue records, scales, scrap tickets, electricity meter or equipment logs"
      raw_fields: "batch_id; SKU; material_id; composition; opening_stock; issued_mass; returned_mass; cut_output_mass; scrap_mass; meter_start; meter_end; machine_power; operating_time; destination"
      collection_method: "Capture per batch and reconcile issued material to output, waste, and stock change"
      unit: "kg; kWh"
      frequency: "Each batch, with meter readings at least each shift when shared"
      temporal_coverage: "At least one representative production year or all batches in a shorter declared campaign"
      site_scope: "All cutting lines producing the declared product at the reporting site"
      aggregation_rule: "Sum accepted records by material and batch, subtract returned usable stock, allocate shared electricity by causal machine time, then divide by net finished output"
      quality_evidence: "Calibrated scale and meter records; BOM revision; stock ledger; scrap destination receipt"
    - protocol_id: cp_sewing_assembly_records
      process_id: "sewing_assembly"
      flow_role: "Cut components, each trim, electricity, assembled output, defects, and offcuts"
      record_type: "BOM issue and return records, component counts and masses, production logs, scales, electricity meter or equipment logs"
      raw_fields: "batch_id; SKU; trim_id; composition; count_used; mass_per_item; issued_mass; returned_mass; assembled_output_mass; defect_mass; offcut_mass; meter_start; meter_end; operating_time"
      collection_method: "Capture each distinct trim and material separately per batch"
      unit: "item; kg; kWh"
      frequency: "Each batch"
      temporal_coverage: "At least one representative production year or all batches in a shorter declared campaign"
      site_scope: "All sewing and trim-attachment lines in scope"
      aggregation_rule: "Convert counts to mass using retained measurements, reconcile inputs and outputs, allocate shared electricity by machine operating time, and normalize by net finished output"
      quality_evidence: "BOM and trim specifications; calibrated scales; production and rejection logs; meter records"
    - protocol_id: cp_wet_processing_records
      process_id: "garment_wet_processing"
      flow_role: "Batch load, water, each named chemical, electricity, steam, natural gas, LPG, wastewater, output, and direct combustion CO2"
      record_type: "Recipe sheets, dosing records, meters, tank levels, fuel invoices, batch logs, wastewater meters and analyses"
      raw_fields: "batch_id; recipe_id; chemical_id; concentration; dose_mass; load_mass; output_mass; water_in; wastewater_out; electricity; steam_mass; steam_pressure; condensate_return; fuel_quantity; calorific_value; emission_factor_id; treatment_destination"
      collection_method: "Collect every batch and retain the exact recipe and carrier-specific meter basis"
      unit: "kg; m3; kWh; MJ"
      frequency: "Each wet-processing batch"
      temporal_coverage: "At least one representative production year or all batches in a shorter declared campaign"
      site_scope: "Every in-scope wet-processing unit and on-site thermal source"
      aggregation_rule: "Sum each atomic exchange, calculate steam energy and direct CO2 only with disclosed factors, reconcile water and product mass, then normalize by accepted wet-processed output and reference output"
      quality_evidence: "Calibrated meters and dosing devices; chemical SDS/specifications; recipe approval; fuel and wastewater records; cited emission-factor record"
    - protocol_id: cp_finishing_pressing_records
      process_id: "finishing_pressing"
      flow_role: "Garment input, electricity, steam, natural gas, LPG, accepted output, rejects, and direct combustion CO2"
      record_type: "Transfer weights, meters, fuel invoices, equipment logs, inspection and repair records"
      raw_fields: "batch_id; input_mass; output_mass; rejected_mass; repaired_mass; meter_start; meter_end; steam_mass; steam_pressure; condensate_return; fuel_quantity; calorific_value; operating_time; emission_factor_id"
      collection_method: "Capture by batch and separate each energy carrier"
      unit: "kg; kWh; MJ"
      frequency: "Each batch, with meter readings at least each shift when shared"
      temporal_coverage: "At least one representative production year or all batches in a shorter declared campaign"
      site_scope: "Every finishing, pressing, inspection, and repair line in scope"
      aggregation_rule: "Reconcile garment mass, allocate shared energy by causal operating time or throughput, calculate direct CO2 with disclosed factors, and divide by accepted output"
      quality_evidence: "Calibrated scales and meters; fuel invoices; inspection and repair logs; cited emission-factor record"
    - protocol_id: cp_sale_packaging_records
      process_id: "sale_packaging"
      flow_role: "Finished garment, each packaging material, electricity, reference output, and separated packaging scrap"
      record_type: "Packaging BOM, item counts, sampled item masses, issue and return records, scales, production logs"
      raw_fields: "batch_id; packaging_material_id; material_specification; count_used; sampled_mass_per_item; issued_mass; returned_mass; packaging_scrap_mass; net_garment_mass; packaged_units; electricity"
      collection_method: "Capture each packaging material separately and verify net garment mass independently from packaging"
      unit: "item; kg; kWh"
      frequency: "Each packaging batch"
      temporal_coverage: "At least one representative production year or all batches in a shorter declared campaign"
      site_scope: "All in-scope sale-packaging lines"
      aggregation_rule: "Convert item counts to mass, subtract returned stock, keep packaging outside reference mass, allocate applicable electricity, and normalize to 1 kg net article"
      quality_evidence: "Packaging specifications and invoices; calibrated scales; count-to-mass samples; batch release record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory exchange"
      rule: "normalized amount = exchange amount attributable to conforming output / net kg of conforming finished articles"
      inputs:
        - "attributable exchange amount"
        - "net conforming finished article mass"
      output: "exchange amount per 1 kg net finished article"
      source_ids:
        - eu-pef-method-2021
    - id: calc_material_reconciliation
      applies_to: "Each process and material"
      rule: "opening stock + receipts or transfers in = transfers out + product retained mass + separated wastes + closing stock; investigate rather than silently distribute unexplained imbalance"
      inputs:
        - "opening stock"
        - receipts
        - transfers
        - "product mass"
        - "each waste mass"
        - "closing stock"
      output: "reconciled material balance and disclosed imbalance"
      source_ids:
        - pefcr-apparel-footwear-2025
    - id: calc_count_to_mass
      applies_to: "Buttons, zippers, labels, hangtags, polybags, and cartons"
      rule: "material mass = accepted item count × representative measured or supplier-declared mass per item"
      inputs:
        - "item count"
        - "mass per item"
        - "sampling basis"
      output: "material-specific input mass"
      source_ids:
        - pefcr-apparel-footwear-2025
    - id: calc_shared_electricity
      applies_to: "Shared electrically powered equipment"
      rule: "attributable electricity = metered period electricity × causal driver for declared product / total causal driver for all products in the meter period"
      inputs:
        - "meter delta"
        - "machine time or other justified causal driver by product"
      output: "product-attributable kWh"
      source_ids:
        - eu-pef-method-2021
    - id: calc_steam_energy
      applies_to: "Purchased steam"
      rule: "steam energy = steam mass × (supply specific enthalpy − credited condensate-return enthalpy); retain pressure, temperature, and return assumptions"
      inputs:
        - "steam mass"
        - "pressure or temperature"
        - "condensate return"
        - "enthalpy source"
      output: "MJ steam attributable to the product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_direct_combustion_co2
      applies_to: "On-site natural-gas or LPG combustion"
      rule: "direct fossil CO2 = measured carrier quantity × cited facility-specific carbon balance or jurisdictional factor; record factor identity and basis in the produced dataset"
      inputs:
        - "fuel quantity"
        - "calorific value where applicable"
        - "emission factor"
      output: "kg fossil CO2 to air"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and BOM"
      requirement: "Retain style or SKU, product subtype, target group, construction, reference size, fibre composition, finish, net mass, and BOM revision; BOM coverage shall include all materials retained in the product."
      evidence: "Approved product specification, BOM, technical pack, and release record"
    - id: dq_primary_data
      applies_to: "Foreground operations"
      requirement: "Use company-specific records for all in-scope processes; disclose any proxy, allocation, missing meter, or excluded line and its effect on completeness."
      evidence: "Meter, scale, recipe, invoice, production, inspection, and waste records; data-gap register"
    - id: dq_temporal
      applies_to: "Reporting period"
      requirement: "Cover a representative continuous 12-month period when production is recurring, or all batches in a shorter campaign; state seasonality, shutdowns, and abnormal batches."
      evidence: "Production calendar and batch population reconciliation"
    - id: dq_technology_geography
      applies_to: "Site and process representation"
      requirement: "Identify site, line, equipment, wet-processing technology, energy supply, water source, wastewater treatment destination, and waste treatment route."
      evidence: "Site register, equipment list, utility contracts, permits, and treatment receipts"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Demonstrate that the BOM, carrier-specific energy, water, named process chemicals, packaging materials, separated waste streams, and on-site direct emissions have been assessed without aggregate selector flows."
      evidence: "Signed completeness checklist reconciled to purchasing, utility, production, and waste ledgers"
    - id: dq_measurement
      applies_to: "Meters, scales, and count-to-mass conversions"
      requirement: "Retain calibration status, resolution, reading frequency, sampling basis, and uncertainty or limitation for each material measurement."
      evidence: "Calibration certificates, sampling sheet, and meter register"
    - id: dq_source_traceability
      applies_to: "External and background evidence"
      requirement: "Record dataset identity, geography, technology, reference year, version, and any substitution or proxy decision for every linked upstream flow."
      evidence: "Dataset register and documented selection rationale"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm the reference flow is the verified public Product flow for CPC 28224, uses Mass and kg, and carries every required product qualifier."
    source_ids:
      - un-cpc-v3
      - pefcr-apparel-footwear-2025
  - rule_id: validate_reference_mass
    applies_to: "Normalization"
    rule: "Confirm reference output equals exactly 1 kg net conforming finished article after normalization and that sale packaging is excluded from this mass."
    source_ids:
      - eu-pef-method-2021
      - pefcr-apparel-footwear-2025
  - rule_id: validate_atomic_inventory
    applies_to: "Inventory rows"
    rule: "Reject any row that combines materials, energy carriers, chemicals, waste streams, emissions, or route alternatives; every selected flow shall denote one specific exchange."
    source_ids:
      - pefcr-apparel-footwear-2025
  - rule_id: validate_process_route
    applies_to: "Process map"
    rule: "Confirm every required process has a detailed inventory and every conditional wet-processing or energy route is supported by records or an explicit not-applicable determination."
    source_ids:
      - pefcr-apparel-footwear-2025
      - sandin-knitted-garment-2024
  - rule_id: validate_mass_balance
    applies_to: "Cutting, assembly, wet processing, finishing, and packaging"
    rule: "Reconcile input, output, waste, and stock-change masses by material and investigate unexplained imbalance; do not force balance by changing the reference output."
    source_ids:
      - pefcr-apparel-footwear-2025
  - rule_id: validate_energy_separation
    applies_to: "Utilities"
    rule: "Confirm electricity, purchased steam, natural gas, and LPG remain separate and that shared-utility allocation uses a disclosed causal driver."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_wet_processing
    applies_to: "Garment wet processing"
    rule: "When wet processing occurs, require the exact recipe, each named chemical, water, carrier-specific energy, wastewater destination, and applicable direct combustion emissions; reject generic chemical or energy bundles."
    source_ids:
      - eu-textiles-bref-2023
      - pefcr-apparel-footwear-2025
  - rule_id: validate_packaging
    applies_to: "Sale packaging"
    rule: "Confirm polybag, carton, hangtag, adhesive paper label, and any additional packaging material are measured separately and kept outside net garment mass."
    source_ids:
      - pefcr-apparel-footwear-2025
  - rule_id: validate_uuid_evidence
    applies_to: "UUID-bearing rows"
    rule: "Accept only Tiangong UUIDs confirmed by hybrid search and direct public state100 read; leave other UUIDs blank and retain the row-specific review record."
    source_ids: []
  - rule_id: validate_data_quality
    applies_to: "Produced foreground dataset"
    rule: "Confirm temporal coverage, site scope, calibration, BOM coverage, allocation, data gaps, linked dataset metadata, and completeness disclosures are present."
    source_ids:
      - eu-pef-method-2021
      - pefcr-apparel-footwear-2025
published_dataset_profile:
  dataset_role: "Product-specific foreground manufacturing dataset for finished CPC 28224 knitted or crocheted women's or girls' articles"
  downstream_use: "secondary_dataset; background_dataset when independently reviewed, geographically and technologically representative, and linked to the declared product qualifiers"
  allowed_use: "Foreground process construction, supplier-specific product-footprint studies, and lifecycle models that explicitly add upstream fabric production and applicable downstream stages"
  excluded_use: "Direct comparison of apparel products; claims for woven apparel or other CPC categories; substitution for missing fibre, yarn, fabric, distribution, use, or end-of-life inventories; use without product and route qualifiers"
  required_metadata: "PCR id and version; CPC 28224; style or SKU; subtype and target group; fibre composition and BOM; size basis; net product mass; included processes; wet-processing route; site and geography; technology; reporting period; energy supply; packaging configuration; allocation; upstream dataset identities; waste destinations"
  required_quality_disclosure: "Primary-data share; BOM coverage; measurement and calibration basis; temporal, geographical, and technological representativeness; allocation drivers; material-balance results; unresolved UUIDs; proxies; exclusions; missing data; uncertainty and review status"
  update_trigger: "Change in product construction or BOM; fibre composition; size basis; manufacturing site or line; wet-processing recipe; energy or water supply; wastewater or waste treatment; packaging configuration; allocation method; reference flow identity; or evidence and data older than the declared representativeness period"
