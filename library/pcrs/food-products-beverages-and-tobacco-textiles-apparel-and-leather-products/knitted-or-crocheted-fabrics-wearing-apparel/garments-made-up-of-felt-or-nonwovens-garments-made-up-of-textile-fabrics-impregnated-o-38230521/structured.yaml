process_map:
  - id: material_cutting
    name: "Material inspection and cutting"
    inclusion: "required"
    inclusion_condition: "Include all primary garment materials issued to cutting and every separately measured offcut output."
    role: "Prepare accepted garment panels from received converted materials."
    quantitative_reference: "Per 1 kg accepted finished packaged garment"
  - id: garment_assembly
    name: "Garment joining and component assembly"
    inclusion: "required"
    inclusion_condition: "Include the declared sewing, ultrasonic welding, hot-melt bonding and component-installation activities; rows absent from the actual route are zero only with BOM and technology-pack evidence."
    role: "Join panels and components into one assembled garment."
    quantitative_reference: "Per 1 kg accepted finished packaged garment"
  - id: seam_barrier_treatment
    name: "Seam barrier treatment"
    inclusion: "conditional"
    inclusion_condition: "Include when seam tape or an equivalent post-assembly barrier treatment is applied; ultrasonic welding without a separate tape step remains in garment_assembly."
    role: "Apply the declared seam-barrier construction."
    quantitative_reference: "Per 1 kg accepted finished packaged garment"
  - id: final_inspection
    name: "Final inspection and acceptance"
    inclusion: "required"
    inclusion_condition: "Include dimensional, visual, closure, seam and claimed-performance acceptance checks specified for the product."
    role: "Separate accepted unpackaged garments from nonconforming output."
    quantitative_reference: "Per 1 kg accepted finished packaged garment"
  - id: packaging
    name: "Product packaging"
    inclusion: "required"
    inclusion_condition: "Include shipment packaging that leaves the factory and reusable transport assets allocated to the shipment."
    role: "Deliver the accepted CPC 28250 reference product at the factory gate."
    quantitative_reference: "Per 1 kg accepted finished packaged garment"
