              source_ids:
                - afw-pefcr-3-1-2025
            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_subdivide_processes_first
    applies_to: "foreground_processes"
    rule: "Avoid allocation by keeping cutting, assembly, seam treatment, inspection and packaging as separate process records and by separating materially different production routes and sites."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: allocation_use_direct_records
    applies_to: "materials_and_components"
    rule: "Assign material and component inputs by batch issue, controlled return, installed count-to-mass conversion and measured waste records before using any shared-site allocation."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: allocation_shared_electricity
    applies_to: "shared_electricity"
    rule: "Use process submetering where available; otherwise allocate a shared meter by documented equipment operating time multiplied by measured demand, and disclose the driver and reconciliation to the meter total."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: allocation_multi_site_electricity_mix
    applies_to: "multi_site_manufacturing"
    rule: "When aggregating multiple manufacturing sites, calculate the electricity mix as a production-mass-weighted average and retain each site's energy records."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: allocation_waste_no_avoided_burden
    applies_to: "manufacturing_wastes"
    rule: "Report each waste output and its destination without an avoided-product credit inside this gate-to-gate package; any downstream recovery benefit belongs to an explicitly linked downstream model."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: allocation_reusable_pallet
    applies_to: "reusable_pallet"
    rule: "Allocate reusable pallet production by the actual pallet mass and documented completed reuse cycles, then assign the shipment share by accepted packaged product mass."
    source_ids:
      - afw-pefcr-3-1-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_cutting_materials
      process_id: "material_cutting"
      flow_role: "converted material inputs, accepted panels and material-specific offcuts"
      record_type: "BOM, purchase lot, issue/return ticket, scale record, cutting batch and waste destination record"
      raw_fields: "garment_style; size_mix; material_id; substrate_fibre; construction; coating_chemistry; areal_density; issued_mass; returned_mass; accepted_panel_mass; offcut_mass; destination"
      collection_method: "Reconcile calibrated mass records for each material identity and cutting batch."
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative production period, normally at least 12 months"
      site_scope: "every cutting site and controlled contractor"
      aggregation_rule: "Sum each atomic material exchange by batch and divide by accepted packaged output mass."
      quality_evidence: "calibration record; BOM revision; lot trace; issue/return reconciliation; waste receipt"
    - protocol_id: cp_cutting_electricity
      process_id: "material_cutting"
      flow_role: "cutting electricity"
      record_type: "submeter or shared meter plus equipment log"
      raw_fields: "meter_start; meter_end; equipment_id; operating_time; measured_demand; batch_id; site"
      collection_method: "Read a dedicated submeter or apply the documented physical driver and reconcile to the site meter."
      unit: "kWh"
      frequency: "each batch or meter interval"
      temporal_coverage: "same period as production"
      site_scope: "every cutting site"
      aggregation_rule: "Allocate to cutting batches, sum and normalize to accepted packaged output mass."
      quality_evidence: "meter record; equipment log; allocation worksheet"
    - protocol_id: cp_assembly_materials
      process_id: "garment_assembly"
      flow_role: "panels, thread, closures, elastic, label, adhesive, assembled garment and thread waste"
      record_type: "BOM, technology pack, component issue/return record, installed count, sample mass, scale record and production log"
      raw_fields: "garment_style; joining_method; component_id; issued_mass; returned_mass; installed_count; mean_piece_mass; assembled_mass; thread_waste_mass"
      collection_method: "Measure issued and returned materials; convert counts only under the component-mass rule."
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "same period as production"
      site_scope: "every assembly site and controlled contractor"
      aggregation_rule: "Calculate net consumption by atomic component and normalize to accepted packaged output mass."
      quality_evidence: "approved technology pack; component lot; scale calibration; batch reconciliation"
    - protocol_id: cp_assembly_electricity
      process_id: "garment_assembly"
      flow_role: "assembly electricity"
      record_type: "submeter or shared meter plus equipment log"
      raw_fields: "meter_start; meter_end; sewing_hours; ultrasonic_welder_hours; adhesive_applicator_hours; measured_demand; batch_id"
      collection_method: "Meter assembly electricity or allocate by auditable equipment time and measured demand."
      unit: "kWh"
      frequency: "each batch or meter interval"
      temporal_coverage: "same period as production"
      site_scope: "every assembly site"
      aggregation_rule: "Allocate to assembly batches, reconcile to meter total and normalize."
      quality_evidence: "meter record; equipment log; allocation worksheet"
    - protocol_id: cp_seam_treatment
      process_id: "seam_barrier_treatment"
      flow_role: "garment input/output, PU seam tape, tape waste and electricity"
      record_type: "seam specification, tape issue/return, treated-length record, scale record, meter and acceptance log"
      raw_fields: "seam_configuration; tape_id; issued_mass; returned_mass; tape_waste_mass; garment_input_mass; garment_output_mass; treated_length; electricity"
      collection_method: "Collect material and energy records only for batches receiving a separate seam treatment."
      unit: "kg; m; kWh"
      frequency: "each treated batch"
      temporal_coverage: "same period as production"
      site_scope: "every seam-treatment site"
      aggregation_rule: "Reconcile tape and garment mass, allocate electricity and normalize to accepted packaged output mass."
      quality_evidence: "technology pack; tape certificate; meter record; seam acceptance record"
    - protocol_id: cp_final_inspection
      process_id: "final_inspection"
      flow_role: "garment inputs, accepted output, rejects and inspection electricity"
      record_type: "inspection lot, scale record, defect/rework log, test report and meter record"
      raw_fields: "garment_style; input_mass; accepted_mass; rejected_mass; defect_code; rework_status; test_method; result; electricity"
      collection_method: "Weigh accepted and rejected outputs separately and retain evidence for each claimed performance check."
      unit: "kg; kWh"
      frequency: "each inspection lot"
      temporal_coverage: "same period as production"
      site_scope: "every final-inspection site"
      aggregation_rule: "Sum accepted and rejected mass and normalize exchanges to packaged accepted output."
      quality_evidence: "inspection report; test report; scale calibration; nonconformance disposition"
    - protocol_id: cp_packaging
      process_id: "packaging"
      flow_role: "unpackaged garment, each packaging input, packaging wastes and electricity"
      record_type: "packaging BOM, issue/return record, item count, sample mass, pallet register, scale and meter record"
      raw_fields: "garment_mass; packaging_id; packaging_mass; item_count; sample_mean_mass; pallet_mass; completed_reuse_cycles; shipment_product_mass; waste_mass; electricity"
      collection_method: "Measure each packaging material independently and calculate counted or reusable items from collected records."
      unit: "kg; kWh"
      frequency: "each shipment batch"
      temporal_coverage: "same period as production"
      site_scope: "every packaging site"
      aggregation_rule: "Sum each material and waste exchange, apply documented pallet reuse, allocate electricity and normalize."
      quality_evidence: "packaging specification; scale calibration; pallet register; meter record; shipment record"
    - protocol_id: cp_reference_output
      process_id: "packaging"
      flow_role: "accepted finished packaged garment"
      record_type: "calibrated factory-gate scale and release record"
      raw_fields: "product_id; CPC_code; lot_id; packaged_mass; accepted_quantity; release_status; timestamp"
      collection_method: "Weigh only accepted packaged CPC 28250 output at release."
      unit: "kg"
      frequency: "each release lot"
      temporal_coverage: "same period as all foreground data"
      site_scope: "final manufacturing gate"
      aggregation_rule: "Sum accepted mass and set the normalized reference output to exactly 1 kg."
      quality_evidence: "scale calibration; release certificate; CPC identity review"
  calculation_rules:
    - id: calc_normalize_to_reference_mass
      applies_to: "every foreground exchange"
      rule: "normalized exchange = batch exchange amount / accepted packaged output mass for the same reconciled production scope"
      inputs:
        - "atomic exchange amount"
        - "accepted packaged output mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - afw-pefcr-3-1-2025
    - id: calc_net_material_consumption
      applies_to: "issued materials and components"
      rule: "net consumption = issued mass − mass returned to controlled stock; do not subtract offcuts that leave as waste outputs"
      inputs:
        - "issued mass"
        - "controlled return mass"
      output: "net material input"
      source_ids:
        - afw-pefcr-3-1-2025
    - id: calc_count_to_component_mass
      applies_to: "counted snaps, labels or equivalent specified pieces"
      rule: "installed mass = installed count × measured mean mass per item from the same specification lot"
      inputs:
        - "installed count"
        - "sample item masses"
        - "sample count"
      output: "installed component mass"
      source_ids:
        - afw-pefcr-3-1-2025
    - id: calc_material_specific_cutting_balance
      applies_to: "each cutting material"
      rule: "input mass = returned unused mass + accepted panel mass attributable to the material + material-specific offcut mass + documented inventory change; investigate any residual"
      inputs:
        - issue
        - return
        - panel
        - "offcut and inventory-change mass"
      output: "material-balance residual"
      source_ids:
        - afw-pefcr-3-1-2025
    - id: calc_shared_electricity
      applies_to: "shared process meter"
      rule: "process electricity = shared meter total × process physical driver / sum of drivers, where driver = equipment operating time × measured demand"
      inputs:
        - "meter total"
        - "equipment time"
        - "measured demand"
      output: "allocated process electricity"
      source_ids:
        - afw-pefcr-3-1-2025
    - id: calc_reusable_pallet_mass
      applies_to: "reusable wood pallet"
      rule: "allocated pallet mass = pallet mass / documented completed reuse cycles × shipment share of accepted packaged product mass"
      inputs:
        - "pallet mass"
        - "completed reuse cycles"
        - "shipment accepted product mass"
      output: "pallet mass assigned to reference output"
      source_ids:
        - afw-pefcr-3-1-2025
    - id: calc_bom_completeness
      applies_to: "product BOM"
      rule: "completeness = sum of explicitly identified component masses / finished unpackaged garment mass; main fabrics, lining, padding, electronic parts and metals are checked independently for full identity coverage"
      inputs:
        - "component masses"
        - "finished unpackaged garment mass"
        - "component roles"
      output: "BOM completeness and mandatory-component coverage"
      source_ids:
        - afw-pefcr-3-1-2025
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain CPC scope review, garment style, intended use, service-life class, size basis, material family, exact substrate/coating identity, joining route, seam specification and packaging configuration."
      evidence: "product specification; BOM; technology pack; classification review"
    - id: dq_bom_coverage
      applies_to: "materials and components"
      requirement: "Primary BOM data shall cover at least 95% of product mass and 100% of main fabrics, lining, padding, electronic parts and metals when present; every omitted share is disclosed."
      evidence: "BOM completeness calculation and supplier records"
    - id: dq_material_specificity
      applies_to: "felt, nonwoven and coated/laminated textiles"
      requirement: "Do not use a generic material-family row for an actual input. Add a separate atomic exchange when fibre, polymer, coating, membrane, rubber or laminate identity differs from the listed candidates."
      evidence: "supplier specification; safety/technical data; lot certificate"
    - id: dq_temporal_representativeness
      applies_to: "all foreground records"
      requirement: "Use one consistent representative production period, normally at least 12 consecutive months, or disclose and justify a shorter campaign for a new or seasonal product."
      evidence: "dated production, purchase, meter and waste records"
    - id: dq_site_completeness
      applies_to: "manufacturing network"
      requirement: "Include every owned or contracted site performing cutting, assembly, seam treatment, final inspection or packaging for the declared output."
      evidence: "supplier/site list; production orders; contractor records"
    - id: dq_measurement_traceability
      applies_to: "measured mass and energy"
      requirement: "Retain calibration status, measurement timestamp, lot/batch identity, unit conversion and reconciliation for every material, waste, output and meter record."
      evidence: "calibration certificates; raw readings; reconciliation worksheets"
    - id: dq_protective_claims
      applies_to: "garments with a protective or barrier claim"
      requirement: "Retain the applicable test method, specimen identity, seam/closure configuration, result, laboratory identity and link from tested construction to the production batch."
      evidence: "accredited or otherwise declared laboratory report; quality-release record"
    - id: dq_waste_destination
      applies_to: "each waste output"
      requirement: "Record waste composition, contamination, measured mass, destination, treatment contract and receipt; do not merge coated, laminated, rubber-coated or uncoated material wastes."
      evidence: "waste log; transfer note; treatment receipt"
    - id: dq_electricity_identity
      applies_to: "electricity inputs"
      requirement: "Use supplier-specific electricity only with reliable contractual evidence; otherwise use the site-country residual consumption mix and disclose meter allocation."
      evidence: "invoice or contract; meter record; residual-mix source; allocation worksheet"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "Require Product flow UUID 3c972aa8-6aa5-4724-8a61-694aef1b09fe, exact CPC 28250, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66 and kg."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_required_qualifiers
    applies_to: "product_metadata"
    rule: "Reject a data package missing garment type, service-life class, primary material construction, substrate fibre, coating/membrane chemistry where applicable, joining method, seam configuration, intended use, site or packaging basis."
    source_ids:
      - un-cpc-3-0-2025
      - iso-9092-2026
      - cdc-niosh-protective-clothing-selection
  - rule_id: validate_cpc_scope
    applies_to: "reference_product"
    rule: "Confirm the output is a garment made from felt, nonwoven or a textile impregnated/coated/laminated with a declared material; reject material rollstock, headgear, footwear and technical textile articles."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_atomic_material_identity
    applies_to: "material_inputs_and_wastes"
    rule: "Require one chemically and physically specific exchange for every actual primary material and its offcut waste; an unlisted material must be added as a new row and must not be assigned to a nearest generic candidate."
    source_ids:
      - iso-9092-2026
      - eu-textile-bat-2022
      - afw-pefcr-3-1-2025
  - rule_id: validate_process_route
    applies_to: "process_inventory"
    rule: "Require material_cutting, garment_assembly, final_inspection and packaging; require seam_barrier_treatment when a separate seam-tape operation occurs and document non-applicability otherwise."
    source_ids:
      - afw-pefcr-3-1-2025
      - cdc-niosh-protective-clothing-selection
  - rule_id: validate_on_site_converting
    applies_to: "system_boundary"
    rule: "Reject use of this garment-only inventory as complete when on-site coating, impregnation, lamination, wet finishing or solvent treatment lacks a separate process with specific inputs, wastes and emissions."
    source_ids:
      - eu-textile-bat-2022
  - rule_id: validate_bom_completeness
    applies_to: "product_BOM"
    rule: "Require the BOM coverage calculation and at least 95% mass coverage plus complete identity for all main fabrics, lining, padding, electronic parts and metals present."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: validate_mass_balance
    applies_to: "cutting_assembly_and_acceptance"
    rule: "Reconcile each primary material from issue through controlled return, accepted intermediate, material-specific waste and inventory change; reconcile garment inputs to accepted and nonconforming outputs."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: validate_seam_and_closure_claims
    applies_to: "claimed_protective_performance"
    rule: "When barrier or protective performance is claimed, require evidence tied to the exact material, seam, tape, zipper/closure and garment construction; material-only results are insufficient for an overall garment claim."
    source_ids:
      - cdc-niosh-protective-clothing-selection
  - rule_id: validate_electricity_records
    applies_to: "electricity_inputs"
    rule: "Require site, meter interval, kWh, process allocation and electricity-product identity for each process electricity row."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: validate_packaging_separation
    applies_to: "packaging"
    rule: "Require individual mass records for LDPE garment polybags, paper hangtags, corrugated cartons, reusable wood pallets and LDPE stretch film when present; do not accept one aggregate packaging amount."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: validate_waste_separation
    applies_to: "waste_outputs"
    rule: "Require each offcut, thread, seam-tape, rejected-garment and packaging waste to retain its own material identity, mass and destination."
    source_ids:
      - afw-pefcr-3-1-2025
      - eu-textile-bat-2022
  - rule_id: validate_no_unverified_uuid
    applies_to: "tiangong_identity"
    rule: "Reject any non-reference UUID unless both hybrid retrieval and state-100 direct retrieval confirm the exact public flow identity, flow type, classification and quantitative property."
    source_ids: []
  - rule_id: validate_foreground_amounts
    applies_to: "inventory_amounts"
    rule: "Require a foreground record or declared calculation for every included exchange; do not substitute an AI-authored value or per-piece default for the one-kilogram product-specific record."
    source_ids:
      - afw-pefcr-3-1-2025
published_dataset_profile:
  dataset_role: "Product- and site-specific foreground manufacturing data package for one declared CPC 28250 garment construction"
  downstream_use: "May be published as a secondary_dataset or background_dataset after review and linked with exact upstream material datasets and downstream distribution/use/end-of-life models"
  allowed_use: "Modelling accepted garment manufacture from received converted materials through packaged factory-gate output for the declared BOM, joining route, sites and period"
  excluded_use: "Generic proxy for an unspecified felt/nonwoven/coated material; proof of protective performance; material coating or lamination not inventoried on site; distribution, use or end-of-life modelling"
  required_metadata: "PCR id; CPC 28250; reference UUIDs; garment design and size basis; reusable/limited-use status; exact BOM; substrate/coating/membrane identity; joining and seam route; site list; temporal coverage; allocation methods; packaging configuration; waste destinations"
  required_quality_disclosure: "BOM coverage; unresolved material or UUID identities; missing site records; measurement and allocation uncertainty; rejected-output treatment; test evidence for claims; upstream dataset choices; any excluded on-site operation"
  update_trigger: "Change in primary material or coating chemistry, garment design, joining or seam technology, claimed performance, supplier/site, packaging system, waste treatment, meter allocation, production period or reference-flow identity"
