  - id: "eu-textile-bat-2022"
    type: "official_guidance"
    reference: "Commission Implementing Decision (EU) 2022/2508 establishing BAT conclusions for the textiles industry. http://data.europa.eu/eli/dec_impl/2022/2508/oj (retrieved 2026-08-13)"
    used_for: "Separation and disclosure of coating, lamination, finishing and thermal treatment; input/output inventories; material, chemical, energy, water, waste and emission records"
  - id: "eu-textile-fibre-regulation-1007-2011"
    type: "official_guidance"
    reference: "Regulation (EU) No 1007/2011 on textile fibre names and related labelling and marking of fibre composition. http://data.europa.eu/eli/reg/2011/1007/oj (retrieved 2026-08-13)"
    used_for: "Fibre and multi-component identity, lining/component declarations, label traceability and finished-product composition checks"
  - id: "cdc-niosh-protective-clothing-selection"
    type: "official_guidance"
    reference: "US CDC/NIOSH, *Selecting Protective Clothing*, updated 2024. https://www.cdc.gov/niosh/healthcare/protective-clothing/selection.html (retrieved 2026-08-13)"
    used_for: "Conditional protective-garment design qualifiers; sewn, bound, taped and ultrasonic-welded seam routes; seam/closure barrier and strength evidence"
