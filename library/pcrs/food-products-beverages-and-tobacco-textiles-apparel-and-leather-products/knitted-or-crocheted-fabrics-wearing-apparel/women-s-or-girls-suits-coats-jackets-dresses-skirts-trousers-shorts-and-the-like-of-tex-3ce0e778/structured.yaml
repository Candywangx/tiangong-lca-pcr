  what: "Produce a finished women's or girls' garment of non-knitted/non-crocheted textile fabric that provides the declared clothing, coverage or weather-protection function of its garment sub-category"
  how_much: "1 kg accepted finished packaged garment at the factory gate"
  how_well: "Conforms to the declared garment specification, reference size or size distribution, fibre composition, fabric construction, finish, quality acceptance criteria and packaging configuration"
