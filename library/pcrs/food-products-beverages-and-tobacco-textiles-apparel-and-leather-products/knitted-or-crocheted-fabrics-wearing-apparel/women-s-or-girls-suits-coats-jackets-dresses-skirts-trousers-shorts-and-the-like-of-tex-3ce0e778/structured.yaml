  calculation_rules:
    - id: calc_normalize_to_reference_mass
      applies_to: "Every foreground exchange"
      rule: "normalized amount = attributable batch or period amount / accepted packaged output mass in kg"
      inputs:
        - "Attributable exchange amount"
        - "accepted packaged output mass"
      output: "Exchange amount per 1 kg reference product"
      source_ids:
        - afw-pefcr-3-1-2025
    - id: calc_net_material_consumption
      applies_to: "Fabric, trims and disposable packaging"
      rule: "net consumed mass = issued mass - unused returned mass; separately report measured scrap and stock change"
      inputs:
        - "Issued mass"
        - "returned mass"
        - "scrap mass"
        - "stock change"
      output: "Net material input and reconciled waste output"
      source_ids:
        - afw-pefcr-3-1-2025
    - id: calc_shared_meter_allocation
      applies_to: "Residual shared electricity or steam"
      rule: "allocated amount = meter-period consumption × documented batch allocation driver / total driver for the meter period"
      inputs:
        - "Opening and closing meter readings"
        - "batch driver"
        - "total driver"
      output: "Batch utility amount"
      source_ids:
        - afw-pefcr-3-1-2025
    - id: calc_process_mass_balance
      applies_to: "Cutting, sewing, wet finishing, pressing and packaging"
      rule: "input mass + opening work-in-progress = accepted transfers + measured wastes + closing work-in-progress; investigate the residual before normalization"
      inputs:
        - "Component inputs"
        - transfers
        - wastes
        - "opening and closing work-in-progress"
      output: "Process mass-balance residual"
      source_ids:
        - afw-pefcr-3-1-2025
    - id: calc_reusable_pallet_share
      applies_to: "Reusable wood pallet"
      rule: "allocated pallet production mass = pallet mass / documented expected uses × shipment-lot allocation share"
      inputs:
        - "Pallet mass"
        - "expected uses"
        - "shipment-lot packed mass"
        - "total palletized packed mass"
      output: "Allocated pallet mass per shipment lot"
      source_ids:
        - afw-pefcr-3-1-2025
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and materials"
      requirement: "Retain product reference, garment sub-category, women's or girls' size basis, component-level fibre composition, shell construction, finish route and packaging configuration."
      evidence: "Approved specification, current BOM, fibre-composition records and final release"
    - id: dq_temporal
      applies_to: "Foreground records"
      requirement: "Use a complete, representative production period, normally the most recent 12 months or a shorter campaign covering all relevant variants; disclose shutdowns, trials and abnormal batches."
      evidence: "Dated meter exports, production ledger and coverage statement"
    - id: dq_geography
      applies_to: "Sites and suppliers"
      requirement: "Identify every foreground site, controlled contractor and utility geography; do not substitute a generic geography without disclosure."
      evidence: "Site list, supplier register and dataset metadata"
    - id: dq_technology
      applies_to: "Cutting, assembly, finishing, pressing and packaging"
      requirement: "Record actual equipment and process route sufficiently to select representative upstream datasets and explain conditional processes."
      evidence: "Equipment list, route sheet, recipe and production records"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Cover 100% of accepted output and all known material components; reconcile at least 95% of BOM mass while explicitly listing the unrepresented remainder."
      evidence: "BOM coverage calculation, mass balance and exception log"
    - id: dq_measurement
      applies_to: "Meters and scales"
      requirement: "Use calibrated devices or document the uncertainty and correction applied. Preserve raw readings before aggregation."
      evidence: "Calibration certificate, raw meter export and signed scale tickets"
    - id: dq_uuid_status
      applies_to: "Tiangong references"
      requirement: "Use a UUID only after hybrid-search identification and independent state-100 retrieval confirm the same semantic flow, flow type, property and classification where applicable. Leave unresolved UUIDs blank and retain the manifest review item."
      evidence: "Identity review record and manifest unresolved candidate entry"
    - id: dq_outsourcing
      applies_to: "Controlled contractors"
      requirement: "Apply the same collection protocols to outsourced cutting, sewing, wet finishing, pressing or packaging; otherwise disclose the supplier dataset, gap and representativeness limitation."
      evidence: "Supplier questionnaire, activity records and dataset metadata"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm UUID 27320bfc-4629-4ed1-8139-2abf1f1ea14e resolves at state 100 to CPC 28233, Product flow, Mass, and that the unit group is Units of mass with kg as the reference unit."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_category_scope
    applies_to: "Product metadata"
    rule: "Reject knitted or crocheted garments and products outside the listed CPC 28233 boundary. Require a declared garment sub-category and shell-fabric construction."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_atomic_inventory
    applies_to: "Process inventory"
    rule: "Reject any inventory row that combines multiple utilities, materials, packaging components, wastes or emissions. Every exchange shall have one row_id and one specific Selected flow."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: validate_process_route
    applies_to: "Process map"
    rule: "Require cutting, sewing and assembly, pressing and quality control, and packaging. Require garment wet finishing only when the route declaration or records show that it occurs."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: validate_mass_balance
    applies_to: "Every foreground process"
    rule: "Investigate and disclose any material-balance residual exceeding the site measurement uncertainty; do not force the residual to zero by changing accepted output."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: validate_bom_coverage
    applies_to: "Material inputs"
    rule: "Confirm that the reported BOM covers at least 95% of product mass and 100% of shell fabric, lining, interlining, padding, electronic parts and metals when present. List the remaining mass explicitly."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: validate_packaging
    applies_to: "Packaging"
    rule: "Confirm polybag, hangtag, carton, pallet and shrink-film amounts are separate, product-specific foreground records. Reject direct use of per-piece defaults converted to kg without the actual product count and mass basis."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: validate_data_quality
    applies_to: "Published foreground package"
    rule: "Require current period, technology, geography, completeness, calibration, allocation and outsourcing disclosures. Any unresolved material UUID or upstream dataset makes the package incomplete for publication."
    source_ids:
      - afw-pefcr-3-1-2025
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate production dataset for CPC 28233 finished garments"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supplier data exchange, foreground process modelling, cradle-to-gate models that add complete upstream datasets, and lifecycle models that add declared distribution, use and end-of-life scenarios"
  excluded_use: "Per-wear comparison, durability claims, business-to-consumer comparative assertions, knitted/crocheted garments, or cradle-to-grave claims without added downstream stages"
  required_metadata: "PCR id and version; product flow UUID; garment sub-category; size basis; component BOM and fibre composition; production sites; reference period; process route; net product mass; packaging configuration; allocation bases; waste destinations; upstream dataset identifiers"
  required_quality_disclosure: "BOM coverage; temporal, geographical and technological representativeness; meter and scale calibration; mass-balance residuals; supplier and contractor coverage; proxy datasets; unresolved UUIDs; excluded exchanges; uncertainty and reviewer status"
  update_trigger: "Material change to product composition, garment construction, process route, wet finish, equipment, energy supply, site geography, contractor, packaging configuration, allocation method, Tiangong identity, or governing source"
