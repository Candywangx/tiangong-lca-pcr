allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Shared foreground operations"
    rule: "Prefer process subdivision, dedicated meters, batch issue records and direct waste weighing. Apply allocation only to residual shared inputs or outputs that cannot be measured directly."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: assembly_unit_allocation
    applies_to: "Shared sewing and assembly resources"
    rule: "Allocate residual shared sewing resources by accepted garment units processed, then convert to the one-kilogram reference flow using measured accepted net garment mass. Disclose unit counts and conversion mass."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: finishing_mass_allocation
    applies_to: "Shared wet finishing and pressing resources"
    rule: "Allocate residual shared finishing inputs and outputs by the measured mass of garments treated in the shared batch. Do not use revenue."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: packaging_mass_allocation
    applies_to: "Cartons, pallets and shipment-lot packaging"
    rule: "Allocate shared disposable packaging by measured packed garment mass. Allocate reusable pallet production by measured pallet mass divided by documented expected uses before shipment-lot allocation."
    source_ids:
      - afw-pefcr-3-1-2025
  - rule_id: waste_no_avoided_burden
    applies_to: "Offcuts, rejects and packaging scrap"
    rule: "Report each waste output at gross measured mass and its actual destination. Do not subtract an avoided-material credit inside the foreground inventory; model recycling or recovery in the downstream treatment dataset."
    source_ids:
      - afw-pefcr-3-1-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_cutting_mass_and_bom
      process_id: "material_cutting"
      flow_role: "Fabric inputs, cut-panel transfers and segregated offcuts"
      record_type: "BOM, warehouse issue/return record, batch transfer record and calibrated scale record"
      raw_fields: "batch_id; product_reference; size_distribution; component_id; fibre_composition; fabric_construction; issued_mass_kg; returned_mass_kg; transferred_mass_kg; offcut_mass_kg; waste_destination"
      collection_method: "Reconcile BOM and warehouse movements with direct weighing of accepted panels and each offcut stream"
      unit: "kg"
      frequency: "Every cutting batch"
      temporal_coverage: "All batches in the declared reference period"
      site_scope: "Every included cutting site and controlled contractor"
      aggregation_rule: "Sum by product reference and material component, then normalize with calc_normalize_to_reference_mass"
      quality_evidence: "Scale calibration, signed issue/return tickets, transfer tickets, waste tickets and BOM revision"
    - protocol_id: cp_cutting_electricity
      process_id: "material_cutting"
      flow_role: "Cutting electricity"
      record_type: "Revenue meter, submeter or machine-energy record"
      raw_fields: "meter_id; timestamp_start; timestamp_end; opening_kwh; closing_kwh; batch_id; allocation_driver"
      collection_method: "Prefer dedicated metering; otherwise apply calc_shared_meter_allocation"
      unit: "kWh"
      frequency: "Every batch or monthly with batch allocation"
      temporal_coverage: "Same period as output mass"
      site_scope: "Every included cutting site"
      aggregation_rule: "Sum dedicated consumption or allocated shared consumption, then normalize"
      quality_evidence: "Meter calibration, bills, machine logs and allocation worksheet"
    - protocol_id: cp_sewing_materials
      process_id: "sewing_assembly"
      flow_role: "Cut components, thread, trims, assembled output and thread waste"
      record_type: "BOM, line issue/return record, transfer record and calibrated scale record"
      raw_fields: "batch_id; component_id; material_specification; issued_mass_kg; returned_mass_kg; installed_mass_kg; output_mass_kg; waste_mass_kg"
      collection_method: "Reconcile BOM with line issues, returns, accepted output and separately weighed thread waste"
      unit: "kg"
      frequency: "Every sewing batch"
      temporal_coverage: "All batches in the declared reference period"
      site_scope: "Every included sewing site and controlled contractor"
      aggregation_rule: "Sum by component and product reference, then normalize"
      quality_evidence: "BOM revision, signed material tickets, scale calibration and transfer records"
    - protocol_id: cp_sewing_electricity
      process_id: "sewing_assembly"
      flow_role: "Sewing electricity"
      record_type: "Submeter or machine-energy record"
      raw_fields: "meter_id; timestamp_start; timestamp_end; opening_kwh; closing_kwh; batch_id; accepted_units; accepted_mass_kg"
      collection_method: "Prefer dedicated metering; otherwise apply unit allocation and calc_shared_meter_allocation"
      unit: "kWh"
      frequency: "Every batch or monthly with batch allocation"
      temporal_coverage: "Same period as output mass"
      site_scope: "Every included sewing site"
      aggregation_rule: "Sum or allocate to accepted units, then normalize by accepted mass"
      quality_evidence: "Meter calibration, production counts and allocation worksheet"
    - protocol_id: cp_wet_finishing_records
      process_id: "garment_wet_finishing"
      flow_role: "Garment load, water, electricity, steam, detergent, accepted output, wastewater and sludge"
      record_type: "Recipe, batch sheet, utility meters, dosing record, discharge meter and waste record"
      raw_fields: "batch_id; garment_input_mass_kg; water_m3; electricity_kwh; steam_mj; detergent_mass_kg; accepted_output_mass_kg; wastewater_m3; sludge_mass_kg; sludge_basis; destination"
      collection_method: "Read dedicated batch records and meters; retain recipe identity and zero declarations for absent exchanges"
      unit: "kg; m3; kWh; MJ"
      frequency: "Every wet-finishing batch"
      temporal_coverage: "All applicable batches in the declared reference period"
      site_scope: "Every included wet-finishing site and controlled contractor"
      aggregation_rule: "Sum by product reference and normalize; shared batches use treated garment mass"
      quality_evidence: "Meter and scale calibration, signed recipe, dosing log, discharge record and waste manifest"
    - protocol_id: cp_pressing_and_quality
      process_id: "pressing_quality_control"
      flow_role: "Garment transfer, electricity, steam, accepted output and nonconforming garment waste"
      record_type: "Batch transfer, utility meter, inspection and calibrated scale record"
      raw_fields: "batch_id; input_route; input_mass_kg; electricity_kwh; steam_mj; accepted_mass_kg; rejected_mass_kg; rework_return_mass_kg; disposition"
      collection_method: "Reconcile transferred input with accepted output, rework returns and separately weighed final rejects"
      unit: "kg; kWh; MJ"
      frequency: "Every batch"
      temporal_coverage: "All batches in the declared reference period"
      site_scope: "Every included pressing and inspection site"
      aggregation_rule: "Sum by product reference and normalize; shared utilities use treated mass"
