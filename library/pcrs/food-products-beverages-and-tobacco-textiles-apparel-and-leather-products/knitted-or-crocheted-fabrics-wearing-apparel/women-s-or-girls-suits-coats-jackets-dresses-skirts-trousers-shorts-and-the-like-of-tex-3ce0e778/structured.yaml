    role: "Convert received sheet fabrics into measured garment panels and segregated offcuts."
    quantitative_reference: "Per 1 kg accepted finished packaged garment"
  - id: sewing_assembly
    name: "Sewing and assembly"
    inclusion: "required"
    inclusion_condition: "Always included for garments assembled from cut components."
    role: "Join garment panels and product-specific trims into an assembled garment."
    quantitative_reference: "Per 1 kg accepted finished packaged garment"
  - id: garment_wet_finishing
    name: "Garment wet finishing"
    inclusion: "conditional"
    inclusion_condition: "Include when the assembled garment is washed, rinsed, softened, dyed or otherwise wet-treated at the foreground facility or by a controlled contractor."
    role: "Apply the declared wet treatment and record water, energy, formulation, wastewater and sludge."
    quantitative_reference: "Per 1 kg accepted finished packaged garment"
  - id: pressing_quality_control
    name: "Pressing and final quality control"
    inclusion: "required"
    inclusion_condition: "Include final pressing or equivalent shape setting and acceptance inspection."
    role: "Produce accepted unpackaged finished garments and segregate nonconforming output."
    quantitative_reference: "Per 1 kg accepted finished packaged garment"
  - id: packaging
    name: "Product packaging"
    inclusion: "required"
    inclusion_condition: "Include all disposable packaging leaving the factory and reusable transport assets used for the shipment lot."
    role: "Package accepted garments and deliver the CPC 28233 reference product at the factory gate."
    quantitative_reference: "Per 1 kg accepted finished packaged garment"
