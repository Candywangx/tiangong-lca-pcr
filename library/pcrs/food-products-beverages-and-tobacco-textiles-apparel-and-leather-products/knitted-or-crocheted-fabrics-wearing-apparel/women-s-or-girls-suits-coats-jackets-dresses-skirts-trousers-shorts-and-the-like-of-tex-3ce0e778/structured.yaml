measurement_rules:
  - id: reference_mass
    applies_to: "Accepted finished packaged garment output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine accepted output mass on calibrated scales after final quality acceptance and packaging. Normalize all inventory exchanges to exactly 1 kg of accepted output."
  - id: component_mass
    applies_to: "Shell fabric, lining, interlining, thread, trims and disposable packaging"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record issued, returned, transferred and wasted mass by component and material; do not substitute purchase cost or item count unless a documented product-specific mass conversion is retained."
  - id: energy_measurement
    applies_to: "Electricity and steam"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Preserve the metered energy unit and conversion factor. Do not treat monetary expenditure as energy without an invoice-supported tariff and consumption quantity."
  - id: water_measurement
    applies_to: "Process water and wet-processing wastewater"
    required_property_ref:
      name: "Volume or Mass"
      uuid: ""
    required_unit: "m3 or kg"
    rule: "Record supply and discharge in the measured unit and retain density or meter conversion when converting between volume and mass."
  - id: packaging_separation
    applies_to: "Disposable packaging and reusable transport assets"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report each packaging material separately. Allocate reusable pallet production using the documented reuse count and exclude the pallet mass from the reference product mass."
process_map:
