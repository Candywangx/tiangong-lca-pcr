system_boundary:
  rules:
    - rule_id: foreground_gate_boundary
      applies_to: "Foreground garment production"
      rule: "Include received-material handling that changes the product, cutting, sewing and assembly, conditional garment wet finishing, pressing, final quality control, packaging, on-site waste handling and direct releases through the accepted packaged product at the factory gate."
      source_ids:
        - afw-pefcr-3-1-2025
    - rule_id: upstream_dataset_boundary
      applies_to: "Purchased materials and utilities"
      rule: "Represent shell fabric, linings, interlinings, thread, trims, electricity, steam, water, detergent and packaging with traceable upstream datasets. Do not claim cradle-to-gate completeness when any material upstream dataset is absent."
      source_ids:
        - afw-pefcr-3-1-2025
    - rule_id: loss_and_release_boundary
      applies_to: "Each foreground process"
      rule: "Record process-specific material losses, rejected garments, packaging scrap, wastewater, sludge and direct releases at the process where they occur. Do not hide losses inside a single category-wide yield factor."
      source_ids:
        - afw-pefcr-3-1-2025
        - eu-textiles-bref-2023
    - rule_id: excluded_life_cycle_stages
      applies_to: "Downstream model"
      rule: "Distribution, retail, use, repair and end-of-life are outside this foreground package. Add them only as explicit downstream lifecycle-model stages and disclose the added scenarios."
      source_ids:
        - afw-pefcr-3-1-2025
boundary_abstraction:
  declared_starting_condition: "Shell fabric, lining, interlining, thread, trims, labels and packaging arrive at the foreground facility with supplier identity, mass, composition and upstream-dataset references declared."
  starting_condition_role: "Gate-to-gate foreground starting condition for cut-and-sew garment production."
  product_classification_scope: "CPC 3.0 code 28233 only; garment identity must remain within non-knitted/non-crocheted textile fabric products listed in this PCR."
  recursive_input_rule: "An incoming product already within this canonical PCR category shall be recorded as a product input with its own upstream dataset and declared production stage; it shall not be silently expanded using this same foreground package."
  upstream_dataset_requirement: "Every purchased material and utility that crosses the boundary requires a supplier-specific or otherwise representative upstream dataset with geography, technology, time period and data-quality disclosure."
  disclosure: "Declare garment sub-category, component BOM, facility geography, process route, outsourced operations, allocation bases, waste destinations, output acceptance basis and all omitted or proxy upstream datasets."
