      record_type: "Packaging BOM, warehouse issue/return, shipment-lot record, pallet register, meter and waste record"
      raw_fields: "shipment_lot; product_reference; unpackaged_mass_kg; material_id; issued_mass_kg; returned_mass_kg; scrap_mass_kg; packed_mass_kg; pallet_mass_kg; expected_reuses; electricity_kwh"
      collection_method: "Reconcile each packaging material separately; retain pallet reuse evidence and separately weigh each scrap stream"
      unit: "kg; kWh"
      frequency: "Every shipment lot"
      temporal_coverage: "All shipment lots in the declared reference period"
      site_scope: "Every included packaging site"
