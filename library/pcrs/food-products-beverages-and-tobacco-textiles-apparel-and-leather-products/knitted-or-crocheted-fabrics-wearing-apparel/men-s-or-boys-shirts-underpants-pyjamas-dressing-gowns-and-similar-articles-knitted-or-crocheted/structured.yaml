allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "Product-specific materials, utilities, wastes, and emissions"
    rule: "Use direct batch, order, line, or meter assignment before any allocation."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_rule_2
    applies_to: "Shared equipment and meters"
    rule: "When subdivision is not possible, use a documented physical driver that represents actual use, such as machine time, metered energy, processed mass, or wet-process liquor volume."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_rule_3
    applies_to: "Internal rework"
    rule: "Keep rework inside the foreground balance and count the accepted garment only once."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_rule_4
    applies_to: "Exported waste or recovered material"
    rule: "Record measured output and actual destination; do not assign an avoided burden without an explicit downstream method and disclosed allocation."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_cutting_records
      process_id: "garment_cutting"
      flow_role: "body fabric, electricity, cut components, cutting waste"
      record_type: "cutting orders, issue slips, meters, scales, waste records"
      raw_fields: "order_id; fabric_spec; issued_mass; meter_start; meter_end; accepted_component_mass; waste_mass; waste_destination"
      collection_method: "Read calibrated scales and electricity meters for each cutting order."
      unit: "kg; kWh"
      frequency: "Each order, reconciled monthly"
      temporal_coverage: "Same period as reference production"
      site_scope: "Every included cutting line"
      aggregation_rule: "Sum each atomic exchange and normalize to accepted cut-component mass."
      quality_evidence: "Calibration records, order tickets, meter extracts, and waste transfer records"
    - protocol_id: cp_assembly_records
      process_id: "garment_assembly"
      flow_role: "cut components, thread, elastic, buttons, slide fasteners, labels, electricity, assembled output, assembly waste"
      record_type: "bills of materials, issue slips, counters, meters, scales, rejection records"
      raw_fields: "order_id; component_id; component_mass; meter_start; meter_end; accepted_mass; thread_waste_mass; reject_mass; disposition"
      collection_method: "Record each component separately and reconcile issues to the assembly order."
      unit: "kg; kWh"
      frequency: "Each order, reconciled monthly"
      temporal_coverage: "Same period as reference production"
      site_scope: "Every included assembly line"
      aggregation_rule: "Sum each row without merging materials, then normalize to accepted assembled-garment mass."
      quality_evidence: "Approved bill of materials, issue records, calibration, meter extracts, and rejection records"
    - protocol_id: cp_wet_finishing_records
      process_id: "garment_wet_finishing"
      flow_role: "garment, water, electricity, steam, sodium hydroxide, hydrogen peroxide, finished garment, wastewater"
      record_type: "batch sheets, recipe records, meters, scales, discharge records"
      raw_fields: "batch_id; input_mass; output_mass; water_volume; electricity; steam_mass; chemical_name; solution_mass; active_fraction; wastewater_volume; destination"
      collection_method: "Use batch-linked meters and authorized recipes; retain each chemical as a separate row."
      unit: "kg; m3; kWh"
      frequency: "Each batch, reconciled monthly"
      temporal_coverage: "Same period as reference production"
      site_scope: "Every included wet-finishing line"
      aggregation_rule: "Sum each atomic exchange and normalize to accepted wet-finished garment mass."
      quality_evidence: "Meter calibration, recipe authorization, dosing logs, laboratory or discharge records"
    - protocol_id: cp_quality_packaging_records
      process_id: "quality_packaging"
      flow_role: "incoming garment, polyethylene bag, carton, electricity, accepted output, packaging waste, rejects"
      record_type: "inspection records, packaging issues, meters, scales, waste records"
      raw_fields: "order_id; incoming_mass; bag_mass; carton_mass; electricity; accepted_mass; film_waste_mass; carton_waste_mass; reject_mass; disposition"
      collection_method: "Weigh net garments and each packaging material separately after final conditioning."
      unit: "kg; kWh"
      frequency: "Each order, reconciled monthly"
      temporal_coverage: "Same period as reference production"
      site_scope: "Every included inspection and packaging line"
      aggregation_rule: "Sum each atomic exchange and normalize to net accepted finished-garment mass."
      quality_evidence: "Scale and meter calibration, inspection release, packaging issue, and waste records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory exchange"
      rule: "reporting-period exchange amount / reporting-period net accepted reference-garment mass"
      inputs:
        - "measured exchange"
        - "measured accepted mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_item_mass
      applies_to: "Count-only garment records"
      rule: "accepted item count x measured mean net mass for the same subtype and size stratum"
      inputs:
        - count
        - "sample masses"
        - "stratum weights"
      output: "kg accepted garment"
      source_ids:
        - eu-pef-2021
    - id: calc_active_chemical
      applies_to: "Sodium hydroxide and hydrogen peroxide solutions"
      rule: "supplied solution mass x recorded active fraction"
      inputs:
        - "solution mass"
        - "active fraction"
      output: "kg active substance"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_shared_energy
      applies_to: "Shared electricity or steam meters"
      rule: "allocate the reconciled shared total using the disclosed physical driver after direct meters are removed"
      inputs:
        - "meter total"
        - "direct use"
        - "driver by product"
      output: "allocated energy by product"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference garment"
      requirement: "Retain exact CPC 28222 scope, garment subtype, construction, composition, size basis, item mass, colour, finish, closures, site, and period."
      evidence: "approved specification, bill of materials, production order, and scale record"
    - id: dq_atomic_inventory
      applies_to: "All foreground exchanges"
      requirement: "Retain one record per material, utility, chemical, waste, or product exchange; no collection label or selector may replace an exchange."
      evidence: "row-level issue, meter, recipe, output, and waste records"
    - id: dq_temporal_scope
      applies_to: "Foreground records"
      requirement: "Use one representative and internally consistent period and disclose shutdowns, missing intervals, and exceptional production."
      evidence: "production calendar and coverage reconciliation"
    - id: dq_measurement
      applies_to: "Mass, water, energy, chemicals, wastewater, and waste"
      requirement: "Retain instrument, calibration, unit, frequency, aggregation, and missing-data treatment."
      evidence: "calibration certificate, meter export, scale ticket, recipe, and laboratory record"
    - id: dq_upstream_fit
      applies_to: "Purchased products and services"
      requirement: "Assess composition, technology, geography, time, and boundary fit for every connected upstream dataset."
      evidence: "supplier specification and upstream dataset metadata"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "Reference identity"
    rule: "Fail unless the reference row is public Product flow 833dd94b-bf2a-4273-99a9-e6bb3c59dedc, exact CPC path 2>28>282>2822>28222, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, and kg."
    source_ids:
      - un-cpc-3-0
  - rule_id: validation_rule_2
    applies_to: "Product scope"
    rule: "Fail for a product outside men's or boys' CPC 28222 knitted or crocheted shirts, underpants, pyjamas, dressing gowns, and similar articles."
    source_ids:
      - un-cpc-3-0
  - rule_id: validation_rule_3
    applies_to: "Required processes"
    rule: "Fail if cutting, assembly, or final inspection and packaging is absent; require an explicit applicability decision for garment wet finishing."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: validation_rule_4
    applies_to: "Atomic exchanges"
    rule: "Fail if a card combines materials, utilities, chemicals, packaging, wastes, or emissions, or if its selected flow is a selector instruction."
    source_ids:
      - eu-pef-2021
      - eu-textiles-bat-2022
  - rule_id: validation_rule_5
    applies_to: "Quantities"
    rule: "Fail if any inventory amount is an AI estimate, unsupported default, or untraceable value instead of a foreground record or calculation from such records."
    source_ids:
      - eu-pef-2021
  - rule_id: validation_rule_6
    applies_to: "Conditional wet finishing"
    rule: "When wet finishing applies, fail if supplied water, electricity, applicable steam, each used recipe chemical, garment output, or wastewater is missing."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validation_rule_7
    applies_to: "UUID control"
    rule: "Fail publication of any non-reference UUID unless that exact row has passed both hybrid discovery and state-100 deterministic direct read."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "Bilingual alignment"
    rule: "Fail if English and Chinese differ in ordered process_id, row_id, rule_id, source_id, controlled token, or UUID."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for an exact CPC 28222 knitted or crocheted garment"
  downstream_use: "secondary_dataset; background_dataset; source for downstream process and lifecyclemodel projections"
  allowed_use: "Studies matching the declared garment subtype, composition, construction, size basis, manufacturing route, technology, geography, period, and gate-level boundary"
  excluded_use: "Woven or other apparel categories; complete cradle-to-grave claims without connected upstream and downstream stages; comparisons lacking functional, lifetime, and care equivalence"
  required_metadata: "PCR id and state; CPC 28222; reference UUIDs; garment subtype; composition; construction; size basis; item mass; colour and finish; closure components; site; geography; period; included and outsourced operations; packaging exclusion; upstream links; allocation"
  required_quality_disclosure: "record coverage; calibration; mass and utility reconciliation; wet-finishing applicability and recipe completeness; waste and wastewater destinations; upstream representativeness; allocation drivers; uncertainty; missing data; withheld UUIDs"
  update_trigger: "Material change in product identity, bill of materials, construction, supplier route, technology, site, energy or water system, wet-finishing recipe, treatment, allocation, boundary, or reporting-period representativeness"
