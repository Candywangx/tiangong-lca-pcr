system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "Foreground manufacture"
      rule: "Include all on-site operations that transform received yarn into declared fabric, including yarn preparation, pile/terry fabric formation, inspection, attributable utilities, wastes, and direct emissions."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_rule_2
      applies_to: "Conditional wet and finishing operations"
      rule: "Include every on-site pre-treatment, bleaching, dyeing, printing, washing, drying, heat setting, and finishing operation used for the declared product; identify outsourced operations and link their upstream datasets."
      source_ids:
        - eu-textiles-bat-2022
    - rule_id: boundary_rule_3
      applies_to: "Upstream materials"
      rule: "Keep fibre, yarn, purchased chemicals, electricity, heat, water supply, and off-site treatment outside the foreground transformation boundary while linking representative upstream datasets."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_rule_4
      applies_to: "Data gaps and cut-offs"
      rule: "Record all identified material and energy exchanges; disclose unavailable minor exchanges as data gaps rather than silently omitting them."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_rule_5
      applies_to: "Downstream stages"
      rule: "Exclude distribution, garment or article conversion, use, and end-of-life unless the study explicitly extends the boundary and reports the extension separately."
      source_ids:
        - eu-pef-2021
