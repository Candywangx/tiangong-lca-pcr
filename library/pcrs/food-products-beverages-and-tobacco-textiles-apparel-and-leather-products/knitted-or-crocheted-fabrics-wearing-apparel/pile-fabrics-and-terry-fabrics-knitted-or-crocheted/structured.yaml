allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "Product-specific meters and records"
    rule: "Prefer direct assignment of yarns, chemicals, utilities, wastes, and emissions to the declared product batch or line."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_rule_2
    applies_to: "Shared equipment and utilities"
    rule: "Where direct assignment is impossible, allocate using a documented physical driver that reflects use, such as machine time, metered energy, liquor volume, or processed dry mass; disclose the driver and result."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_rule_3
    applies_to: "Rework and internal recycling"
    rule: "Keep internal rework within the foreground balance and avoid counting the same intermediate output twice. Record exported residues as outputs with destination."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_rule_4
    applies_to: "Multiple saleable fabric products"
    rule: "Avoid economic allocation where product-specific physical records are available; if allocation remains unavoidable, report unallocated totals, chosen basis, shares, and sensitivity."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_formation_records
      process_id: "pile_terry_formation"
      flow_role: "yarns, electricity, greige output, textile waste"
      record_type: "lot issues, stock records, meters, scales, production and waste logs"
      raw_fields: "lot_id; yarn_role; fibre_spec; opening_stock; issued_mass; returned_mass; closing_stock; meter_start; meter_end; greige_mass; waste_mass; waste_route"
      collection_method: "Calibrated scales and meters reconciled to lot and reporting-period records."
      unit: "kg; kWh"
      frequency: "Per lot with monthly reconciliation"
      temporal_coverage: "At least one representative reporting year or the full shorter campaign"
      site_scope: "All included formation lines at the reporting site"
      aggregation_rule: "Sum valid records by row, adjust stock change, then divide by conforming greige output."
      quality_evidence: "Calibration, invoices, batch tickets, meter extracts, stock reconciliation, and waste transfer records."
    - protocol_id: cp_wet_process_records
      process_id: "wet_processing"
      flow_role: "fabric, water, electricity, steam, sodium hydroxide, hydrogen peroxide, wastewater"
      record_type: "batch sheets, recipe/dosing logs, meters, invoices, laboratory and discharge records"
      raw_fields: "batch_id; input_mass; output_mass; water_meter; electricity_meter; steam_mass; chemical_name; solution_mass; active_fraction; wastewater_volume; reuse_volume; treatment_route"
      collection_method: "Reconcile batch recipes and metered utilities to physical batch outputs; retain each chemical as a separate record."
      unit: "kg; m3; kWh"
      frequency: "Per batch with monthly reconciliation"
      temporal_coverage: "Same period as reference-product production"
      site_scope: "Every included on-site wet-processing line"
      aggregation_rule: "Sum each atomic exchange, convert solutions to active mass where required, and normalize to wet-processed output."
      quality_evidence: "Meter calibration, recipe authorization, dosing logs, invoices, laboratory records, and discharge permits/records."
    - protocol_id: cp_finishing_records
      process_id: "finishing_inspection"
      flow_role: "incoming fabric, electricity, steam, finished output, rejects"
      record_type: "transfer tickets, meters, inspection logs, roll measurements, scales, waste records"
      raw_fields: "batch_id; incoming_mass; moisture_basis; electricity_meter; steam_mass; roll_length; usable_width; mass_per_area; conforming_mass; reject_mass; waste_route"
      collection_method: "Reconcile incoming mass, conforming output, rework, rejects, and stock changes for each lot."
