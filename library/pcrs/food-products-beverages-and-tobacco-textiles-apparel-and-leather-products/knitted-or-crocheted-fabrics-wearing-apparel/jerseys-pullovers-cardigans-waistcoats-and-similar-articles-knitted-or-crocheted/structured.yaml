system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate
      applies_to: "foreground manufacturing data package"
      rule: "Include yarn issue, knitting or crocheting, applicable wet processing, garment assembly, finishing, inspection, quality testing and packaging through the factory gate."
      source_ids:
        - ec-pef-method-2021-2279
        - wiedemann-wool-garment-2020
    - rule_id: boundary_complete_inventory
      applies_to: "every included process"
      rule: "Record all known product inputs, utilities, wastes and direct elementary emissions as separate atomic exchanges; document data gaps rather than hiding them in combined rows."
      source_ids:
        - ec-pef-method-2021-2279
        - eu-textiles-bat-2022-2508
    - rule_id: boundary_wet_processing
      applies_to: "on-site or controlled wet processing"
      rule: "Include water, each energy carrier, each purchased chemical formulation, wastewater, sludge and monitored direct air or water emissions when washing, scouring, bleaching, dyeing or finishing is performed within the declared foreground boundary."
      source_ids:
        - eu-textiles-bref-2023
        - eu-textiles-bat-2022-2508
    - rule_id: boundary_outsourced_operations
      applies_to: "outsourced knitting, wet processing, assembly, finishing or packaging"
      rule: "Keep the purchased intermediate product visible and link one supplier- or route-specific upstream dataset; do not represent an outsourced operation as zero burden."
      source_ids:
        - ec-pef-method-2021-2279
    - rule_id: boundary_exclusions
      applies_to: "distribution and later life-cycle stages"
      rule: "Exclude distribution, retail, consumer washing and drying, repair, reuse, recycling and disposal from this foreground package; disclose the exclusion and add downstream datasets only in a lifecycle model with a separately declared goal and scope."
      source_ids:
        - ec-apparel-footwear-pefcr-2025
        - iso-14040-2006
