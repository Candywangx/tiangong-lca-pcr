      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert count to mass with a measured, product- and size-specific mean net garment mass from the same production period; retain item count, sample size, weighing record and conversion formula."
