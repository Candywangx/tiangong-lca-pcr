allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "separable products, batches and processes"
    rule: "First avoid allocation by separate batch records, sub-metering, equipment-time records and mass balances."
    source_ids:
      - ec-pef-method-2021-2279
  - rule_id: allocation_shared_manufacturing
    applies_to: "shared knitting, wet-processing, assembly, finishing and packaging resources"
    rule: "If subdivision is not feasible, use the closest measured physical driver: machine time for equipment electricity, metered mass or energy for steam and hot water, recipe and batch mass for chemicals and water, and occupied conditioned area plus time for shared HVAC. Document the driver and calculation."
    source_ids:
      - ec-pef-method-2021-2279
      - eu-textiles-bat-2022-2508
  - rule_id: allocation_rework
    applies_to: "in-batch rework"
    rule: "Keep all rework inputs, utilities and losses in the producing batch; do not count the reworked item as a co-product or a second reference output."
    source_ids:
      - ec-pef-method-2021-2279
  - rule_id: allocation_scrap
    applies_to: "yarn scrap, textile offcuts, rejects and sludge"
    rule: "Report each material leaving the foreground boundary as its own waste flow with mass, composition and destination. Do not apply an avoided-burden credit inside this foreground package; downstream recycling or recovery is handled in the lifecycle model under its declared allocation method."
    source_ids:
      - ec-apparel-footwear-pefcr-2025
      - wiedemann-recycled-wool-sweater-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_knitting_batch
      process_id: "p_knitting"
      flow_role: "yarns, oil, electricity, accepted workpiece and knitting wastes"
      record_type: "batch issue, meter, production and waste records"
      raw_fields: "batch_id; style; size mix; yarn SKU; fibre composition; issued mass; returned mass; oil issue; meter start/end; machine time; accepted mass; yarn scrap mass; rejected mass; moisture state"
      collection_method: "Calibrated scales, stock ledger, sub-meter or documented equipment-time allocation, and batch reconciliation"
      unit: "kg; kWh; h"
      frequency: "Every batch"
      temporal_coverage: "Representative production period, normally at least 12 consecutive months or all batches for a shorter campaign"
      site_scope: "All knitting or crocheting lines producing the declared product"
      aggregation_rule: "Sum by atomic flow and divide by accepted net garment mass linked through the batch genealogy"
      quality_evidence: "Calibration certificates; yarn invoices; batch tickets; meter records; waste tickets; reconciliation sign-off"
    - protocol_id: cp_wet_batch
      process_id: "p_wet_processing"
      flow_role: "water, utilities, each chemical, workpiece, wastewater and sludge"
      record_type: "batch recipe, stock issue, meter, laboratory and treatment records"
      raw_fields: "batch_id; input/output mass and moisture; water meter; electricity; steam; hot water; natural gas; diesel; chemical trade name; SDS; active concentration; issued mass; wastewater volume; sludge wet mass; sludge dry matter"
      collection_method: "Batch-level meters and recipe/stock reconciliation; retain original units and conversion factors"
      unit: "kg; m3; kWh; MJ; L"
      frequency: "Every wet-processing batch"
      temporal_coverage: "Representative production period covering seasonal and recipe variation"
      site_scope: "All controlled wet-processing and treatment units"
      aggregation_rule: "Sum each atomic exchange by batch; normalize to accepted wet-processed workpiece and then to reference garment mass"
      quality_evidence: "Meter calibration; recipe approval; SDS; stock ledger; laboratory results; wastewater and sludge records"
    - protocol_id: cp_wet_emissions
      process_id: "p_wet_processing"
      flow_role: "direct combustion and drying emissions"
      record_type: "stack measurement, permit report or activity-and-factor calculation"
      raw_fields: "source_id; batch linkage; fuel amount; fuel composition; factor source; monitoring period; pollutant mass; abatement status"
      collection_method: "Direct measurement preferred; otherwise calculate from foreground activity with a disclosed source-specific factor"
      unit: "kg pollutant"
      frequency: "Per monitoring event and reporting period"
      temporal_coverage: "Same period as foreground production"
      site_scope: "All on-site emission sources serving the included process"
      aggregation_rule: "Attribute by measured fuel or heat demand; aggregate each pollutant separately"
      quality_evidence: "Monitoring report; instrument QA; fuel certificate; factor reference; calculation workbook"
    - protocol_id: cp_assembly_batch
      process_id: "p_assembly"
      flow_role: "workpiece, thread, closures, labels, electricity, accepted garment and wastes"
      record_type: "batch issue, count, weighing, meter and rejection records"
      raw_fields: "batch_id; workpiece mass; component SKU/count/unit mass; electricity; accepted mass; offcut mass; thread waste mass; reject mass; destination"
      collection_method: "Calibrated scales, component issue reconciliation, sub-meter or equipment-time allocation"
      unit: "kg; count; kWh"
      frequency: "Every assembly batch"
      temporal_coverage: "Representative production period"
      site_scope: "All linking, cutting and sewing lines"
      aggregation_rule: "Sum each atomic exchange and normalize to accepted assembled garment mass"
      quality_evidence: "Scale and meter calibration; component invoices; batch tickets; waste and reject records"
    - protocol_id: cp_finishing_batch
      process_id: "p_finishing_quality"
      flow_role: "electricity, steam, hot water, cleaning formulation, refrigerant, accepted and rejected garments, wastewater"
      record_type: "finishing batch, meter, quality, service and waste records"
      raw_fields: "batch_id; input/output mass; electricity; steam; hot water; cleaner trade name and mass; refrigerant charge and make-up; reject mass and failure mode; wastewater; pilling and dimensional-change method/result"
      collection_method: "Calibrated meters and scales, chemical issue, equipment service log and controlled laboratory test"
      unit: "kg; kWh; MJ; test result"
      frequency: "Every batch; refrigerant at each service event"
      temporal_coverage: "Representative production period"
      site_scope: "All finishing, inspection, conditioning and test areas serving the product"
      aggregation_rule: "Sum by atomic exchange; allocate shared conditioning by area and time only when sub-metering is unavailable"
      quality_evidence: "Calibration; service log; test report; method version; inspector sign-off; wastewater record"
    - protocol_id: cp_packaging_batch
      process_id: "p_packaging"
      flow_role: "net garment, each packaging component, packaging electricity and reference output"
      record_type: "packaging issue, count, weighing, meter and dispatch records"
      raw_fields: "batch_id; garment count and net mass; packaging SKU; component count; unit mass; pallet reuse cycles; electricity; dispatch quantity"
      collection_method: "Calibrated scales, component issue reconciliation and sub-meter or equipment-time allocation"
      unit: "kg; count; kWh"
      frequency: "Every packaging batch"
      temporal_coverage: "Representative production period"
      site_scope: "All packaging lines and dispatch areas serving the product"
      aggregation_rule: "Report each packaging material separately per kg net garment; exclude packaging mass from reference output"
      quality_evidence: "Scale calibration; packaging specification; purchase and issue records; dispatch record; pallet reuse log"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "reference product"
      rule: "Sum calibrated net mass of accepted garments before removable packaging; include permanent labels, closures and trims."
      inputs:
        - "accepted item mass or batch mass"
        - tare
        - "conditioning state"
      output: "kg net finished garment"
      source_ids:
        - ec-pef-method-2021-2279
    - id: calc_item_mass
      applies_to: "count-based component or garment records"
      rule: "Multiply count by measured mean unit mass for the same SKU, style and size; retain sample count and variation."
      inputs:
        - count
        - "measured unit masses"
      output: "kg component or garment"
      source_ids:
        - ec-pef-method-2021-2279
    - id: calc_batch_normalization
      applies_to: "all inventory rows"
      rule: "Divide the atomic batch exchange by the linked accepted net finished garment mass; preserve the unnormalised batch record."
      inputs:
        - "atomic exchange amount"
        - "batch genealogy"
        - "accepted net garment mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - ec-pef-method-2021-2279
    - id: calc_mass_balance
      applies_to: "knitting, wet processing, assembly and finishing"
      rule: "Reconcile input mass with accepted output, returned material, work in progress, measured waste, wastewater-borne material where quantified, and stock change; investigate rather than silently allocate unexplained loss."
      inputs:
        - "input/output/waste/return/stock-change masses and moisture states"
      output: "process mass-balance discrepancy"
      source_ids:
        - eu-textiles-bat-2022-2508
        - ec-pef-method-2021-2279
    - id: calc_shared_resource
      applies_to: "shared meters"
      rule: "Allocate only after documenting why subdivision is unavailable, using the physical driver specified in section 7."
      inputs:
        - "shared meter amount"
        - "machine time"
        - "batch mass"
        - "heat demand or area-time driver"
      output: "allocated atomic utility amount"
      source_ids:
        - ec-pef-method-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and all batch links"
      requirement: "Match CPC 28226 semantic scope and declare product subtype, fibre composition, technology, coloration route, size range and permanent components."
      evidence: "Product specification, bill of materials, style sheet, batch genealogy and reference-flow identity"
    - id: dq_company_specific
      applies_to: "foreground manufacturing"
      requirement: "Use company-specific data for the product bill of materials and controlled manufacturing processes; include all known inputs and outputs."
      evidence: "Batch records, invoices, meters, stock changes, waste records and direct-emission records; ec-pef-method-2021-2279"
    - id: dq_temporal
      applies_to: "all foreground rows"
      requirement: "Use one coherent reporting period and disclose gaps, shutdowns, abnormal batches and seasonal recipe or HVAC variation."
      evidence: "Production calendar, meter coverage and batch population summary"
    - id: dq_measurement
      applies_to: "measured mass and utilities"
      requirement: "Identify instrument, calibration status, original unit, conversion factor, sampling method and uncertainty or data limitation."
      evidence: "Calibration certificates, meter exports, weighing sheets and conversion workbook"
    - id: dq_chemical_identity
      applies_to: "every chemical row"
      requirement: "Identify one supplier formulation per row with trade name, supplier, SDS revision, active concentration where applicable and issued formulated-product mass."
      evidence: "SDS, purchase specification, recipe and stock issue record; eu-textiles-bat-2022-2508"
    - id: dq_performance
      applies_to: "declared quality level"
      requirement: "Retain the selected washing/drying procedure, dimensional-change method and pilling method with acceptance criteria and result; do not infer durability from fibre type alone."
      evidence: "ISO 6330:2021 procedure record, ISO 5077:2007 result and ISO 12945-2:2020 result or justified equivalent"
    - id: dq_completeness
      applies_to: "inventory and exclusions"
      requirement: "Report missing UUIDs, missing activity data, proxy datasets, outsourced stages, excluded life-cycle stages and unresolved mass-balance discrepancies explicitly."
      evidence: "Data-gap register, supplier dataset register, validation report and manifest review metadata"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the product flow UUID, Product flow type, exact product name, CPC path 2 > 28 > 282 > 2822 > 28226, Mass property UUID, Units of mass UUID and kg reference unit."
    source_ids:
      - unsd-cpc-3-28226
  - rule_id: validate_reference_mass
    applies_to: "reference quantity"
    rule: "Reference output equals 1 kg calibrated net garment mass and excludes removable distribution packaging."
    source_ids:
      - ec-pef-method-2021-2279
  - rule_id: validate_required_qualifiers
    applies_to: "dataset metadata"
    rule: "Every required qualifier in section 3 is present and consistent with the bill of materials, process route and quality records."
    source_ids:
      - ec-apparel-footwear-pefcr-2025
      - iso-6330-2021
      - iso-5077-2007
      - iso-12945-2-2020
  - rule_id: validate_atomic_inventory
    applies_to: "all process inventory rows"
    rule: "Each row represents one product, waste or elementary exchange; reject combined utilities, combined chemicals, combined packaging, combined wastes and selector labels."
    source_ids:
      - ec-pef-method-2021-2279
  - rule_id: validate_foreground_evidence
    applies_to: "every amount"
    rule: "Each amount links to a collection protocol and a real foreground record or disclosed calculation; absence of a reliable quantity must remain an unresolved foreground requirement, not an AI-created range."
    source_ids:
      - ec-pef-method-2021-2279
  - rule_id: validate_wet_processing
    applies_to: "conditional wet-processing process"
    rule: "If wet processing occurs, verify separate records for water, electricity, each heat carrier or fuel, every chemical formulation, wastewater, sludge and applicable direct emissions; if it does not occur, verify the upstream supplier dataset and exclusion statement."
    source_ids:
      - eu-textiles-bref-2023
      - eu-textiles-bat-2022-2508
  - rule_id: validate_mass_balance
    applies_to: "knitting, wet processing, assembly and finishing"
    rule: "Investigate and disclose mass-balance discrepancies after harmonising moisture states; do not close a discrepancy by creating an unmeasured waste or emission."
    source_ids:
      - eu-textiles-bat-2022-2508
      - ec-pef-method-2021-2279
  - rule_id: validate_allocation
    applies_to: "shared processes and rework"
    rule: "Confirm subdivision was attempted first and every remaining allocation uses the declared physical driver; rework stays in its originating batch and waste receives no foreground avoided-burden credit."
    source_ids:
      - ec-pef-method-2021-2279
      - wiedemann-recycled-wool-sweater-2022
  - rule_id: validate_uuid_status
    applies_to: "UUID-bearing and unresolved rows"
    rule: "Accept only UUIDs confirmed by both exact hybrid retrieval and state-100 direct read; all other candidate flow UUIDs remain absent and are tracked by row_id in manifest review metadata."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific gate-to-gate foreground manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset when independently reviewed and matched to the user's geography, technology, time and product specification"
  allowed_use: "Foreground apparel production packages; supplier-specific manufacturing inventories; lifecycle models that explicitly link upstream yarns and downstream distribution, use and end-of-life stages"
  excluded_use: "Direct comparison or environmental claim without a complete compatible lifecycle model; substitution for T-shirts, woven garments or other excluded products; use as an average yarn-production or consumer-use dataset"
  required_metadata: "PCR id and version; product subtype; CPC reference; verified reference-flow identity; bill of materials; fibre and recycled-content evidence; technology and gauge; coloration and wet-processing route; facility and countries; reporting period; net mass method; allocation; packaging; test methods and results; source and UUID gaps"
  required_quality_disclosure: "Company-specific data coverage; meter and scale calibration; batch population and representativeness; supplier dataset coverage; proxy datasets; mass-balance discrepancies; waste destinations; chemical SDS coverage; direct-emission method; unresolved UUIDs and quantities"
  update_trigger: "Change in product specification, fibre or accessory composition, knitting technology, wet-processing recipe or site, energy system, allocation driver, packaging system, reference-flow identity, applicable law or BAT, quality method, or a material data-quality review finding"
