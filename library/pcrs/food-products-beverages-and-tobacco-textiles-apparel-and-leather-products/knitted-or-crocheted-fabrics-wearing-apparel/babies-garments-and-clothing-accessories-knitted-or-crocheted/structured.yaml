allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared and multifunctional operations"
    rule: "Avoid allocation by submetering, separate batch records or subdivision so that inputs and outputs are directly attributable to the target garments."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical
    applies_to: "Unavoidable shared utilities and services"
    rule: "When subdivision is not possible, allocate by a causal physical driver such as machine time, metered thermal demand, wastewater volume, production mass or units processed; document the driver and reconciliation total."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_economic_last_resort
    applies_to: "Shared operations without defensible physical relation"
    rule: "Use economic allocation only as a last resort, disclose prices and period, and report a sensitivity check against a plausible physical driver."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_scrap
    applies_to: "Textile and packaging scrap"
    rule: "Retain the upstream burden of all purchased material in the foreground product system, record scrap at the point it leaves the process, and do not apply an avoided-burden credit inside this gate-to-gate dataset."
    source_ids:
      - enes-kipoz-cut-sew-waste-2020
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_cutting_records
      process_id: "material_cutting"
      flow_role: "Fabric, marker paper, electricity, cut components and cutting wastes"
      record_type: "weigh tickets; issue and return records; marker files; meter readings"
      raw_fields: "order_id; style; fabric_id; fibre_content; fabric_mass_issued; fabric_mass_returned; marker_area; cut_component_mass; scrap_mass; paper_mass; electricity_kWh"
      collection_method: "Weigh material streams and reconcile digital or physical marker and meter records by production order"
      unit: "kg; m2; kWh"
      frequency: "Each order and monthly reconciliation"
      temporal_coverage: "Representative continuous 12 months or complete shorter production campaign"
      site_scope: "All cutting lines producing the declared product"
      aggregation_rule: "Sum target-order records, allocate shared electricity by machine time, normalize by conforming output mass"
      quality_evidence: "Calibrated scales; marker file; stock ledger; meter reconciliation; exception log"
    - protocol_id: cp_assembly_records
      process_id: "assembly_trim"
      flow_role: "Cut components, thread, each trim, electricity, assembled output and thread waste"
      record_type: "bundle tickets; issue and return records; component counts; unit-mass tests; meter readings"
      raw_fields: "order_id; component_mass; material_id; count; unit_mass; issued_mass; returned_mass; waste_mass; machine_hours; electricity_kWh; assembled_mass"
      collection_method: "Record each material identity separately and reconcile issue, return, output and waste"
      unit: "kg; count; kWh"
      frequency: "Each order and monthly reconciliation"
      temporal_coverage: "Same period as reference output"
      site_scope: "All sewing lines producing the declared product"
      aggregation_rule: "Sum target-order records and normalize by conforming output mass"
      quality_evidence: "Approved BoM; calibrated scale; stock ledger; production tickets; meter reconciliation"
    - protocol_id: cp_decoration_records
      process_id: "decoration"
      flow_role: "Garment transfers, embroidery thread, printing paste, electricity and wastes"
      record_type: "batch sheets; issue and return records; meter readings; waste tickets"
      raw_fields: "order_id; artwork_id; formulation_id; input_mass; returned_mass; output_mass; waste_mass; equipment_hours; electricity_kWh"
      collection_method: "Record each artwork route and formulation separately"
      unit: "kg; kWh"
      frequency: "Each decorated batch"
      temporal_coverage: "Same period as reference output"
      site_scope: "All on-site decoration equipment used for the product"
      aggregation_rule: "Sum route-specific batches and normalize by conforming output mass"
      quality_evidence: "Batch approval; SDS; stock ledger; calibrated scale; meter reconciliation"
    - protocol_id: cp_wet_finishing_material_records
      process_id: "wet_finishing"
      flow_role: "Garment transfer, water, each chemical and finished output"
      record_type: "batch recipe; dosing log; water meter; stock records; weigh tickets"
      raw_fields: "batch_id; recipe_id; chemical_identity; concentration; issued_mass; water_m3; input_mass; output_mass; moisture_condition"
      collection_method: "Meter water, weigh each formulation, and reconcile recipes and stock change"
      unit: "kg; m3"
      frequency: "Each wet batch"
      temporal_coverage: "Same period as reference output"
      site_scope: "All on-site wet-finishing lines used for the product"
      aggregation_rule: "Sum included batches and normalize by conforming dry output mass"
      quality_evidence: "Recipe authorization; SDS; calibrated dosing and water meters; mass-balance review"
    - protocol_id: cp_wet_finishing_utility_records
      process_id: "wet_finishing"
      flow_role: "Electricity, steam, natural gas, diesel, hot water and R-410A make-up"
      record_type: "submeters; invoices; tank logs; service records"
      raw_fields: "timestamp; equipment_id; kWh; steam_kg; pressure; temperature; hot_water_m3; gas_m3; diesel_L; heating_value; refrigerant_kg"
      collection_method: "Prefer submetering; reconcile utility totals and allocate only with documented physical drivers"
      unit: "kWh; kg; m3; L"
      frequency: "Batch where metered and monthly reconciliation"
      temporal_coverage: "Same period as reference output"
      site_scope: "Utility systems serving included operations"
      aggregation_rule: "Subtract excluded uses, allocate shared totals by physical driver, normalize by conforming output mass"
      quality_evidence: "Meter calibration; invoices; fuel and refrigerant service logs; reconciliation worksheet"
    - protocol_id: cp_wet_finishing_emission_records
      process_id: "wet_finishing"
      flow_role: "Wastewater, sludge, combustion emissions and refrigerant losses"
      record_type: "discharge meter; laboratory reports; waste manifests; stack tests; fuel and service records"
      raw_fields: "wastewater_m3; COD; pH; temperature; sludge_mass; dry_solids; destination; fuel_use; emission_factor; measured_emission; refrigerant_balance"
      collection_method: "Measure direct releases or calculate from collected activity data using cited factors"
      unit: "kg; m3; concentration units"
      frequency: "Per discharge or test, aggregated monthly"
      temporal_coverage: "Same period as reference output"
      site_scope: "All direct releases from included operations"
      aggregation_rule: "Sum measured releases or documented calculations and normalize by conforming output mass"
      quality_evidence: "Accredited laboratory report where applicable; meter calibration; manifests; calculation file"
    - protocol_id: cp_final_packaging_records
      process_id: "final_packaging"
      flow_role: "Garment transfer, electricity, steam, each packaging material and packaging waste"
      record_type: "packing lists; component counts; unit-mass tests; meters; waste tickets"
      raw_fields: "order_id; conforming_units; reject_units; unpacked_mass; packaging_id; count; unit_mass; electricity_kWh; steam_kg; waste_mass"
      collection_method: "Reconcile inspected units, packing material issue and final packed output"
      unit: "kg; count; kWh"
      frequency: "Each order and monthly reconciliation"
      temporal_coverage: "Same period as reference output"
      site_scope: "All final finishing and packing lines used for the product"
      aggregation_rule: "Sum target-order records and normalize by net conforming product mass"
      quality_evidence: "Approved packaging specification; calibrated scale; packing list; meter reconciliation"
    - protocol_id: cp_reference_output_records
      process_id: "final_packaging"
      flow_role: "Reference product output"
      record_type: "final inspection and weighing records"
      raw_fields: "order_id; style; size; conforming_units; net_product_mass; conditioning_method; packaging_exclusion"
      collection_method: "Weigh a representative sample or complete output using calibrated scales and reconcile to conforming count"
      unit: "kg"
      frequency: "Each order"
      temporal_coverage: "Same period as all input records"
      site_scope: "All declared production sites"
      aggregation_rule: "Sum net conforming mass and set normalized reference amount to 1 kg"
      quality_evidence: "Calibration certificate; inspection release; sampling plan; signed reconciliation"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "Every inventory row"
      rule: "normalized_amount = attributable_exchange_amount / net_conforming_product_mass"
      inputs:
        - "Attributable row amount"
        - "reference output mass from cp_reference_output_records"
      output: "Row amount per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_material_balance
      applies_to: "Fabric and other mass-bearing production materials"
      rule: "opening_stock + receipts - closing_stock = conforming_product_content + separately recorded wastes + returns or transfers; investigate unreconciled difference"
      inputs:
        - Stock
        - issue
        - return
        - "output and waste masses"
      output: "Reconciled material balance and unexplained variance"
      source_ids:
        - eu-pef-method-2021
        - eu-ecolabel-textiles-2014
    - id: calc_shared_resource
      applies_to: "Shared electricity, heat, water and treatment"
      rule: "attributable_total = reconciled_shared_total × target_physical_driver / total_physical_driver"
      inputs:
        - "Meter total"
        - "excluded uses"
        - "target and total driver values"
      output: "Attributable resource amount"
      source_ids:
        - eu-pef-method-2021
    - id: calc_refrigerant_loss
      applies_to: "R-410A equipment"
      rule: "loss = opening_charge + additions - closing_charge - documented_recovery"
      inputs:
        - "Charge inventory and service records"
      output: "R-410A emitted to air"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and BoM"
      requirement: "Retain style, size range, fibre percentages, construction, finish, trims, suppliers and packaging specification for each represented product family."
      evidence: "Approved specification, BoM, supplier declarations and inspection release"
    - id: dq_temporal
      applies_to: "All foreground data"
      requirement: "Use one consistent representative period, normally 12 continuous months or the complete campaign for seasonal production; disclose abnormal downtime and substitutions."
      evidence: "Dated meter, stock, production and maintenance records"
    - id: dq_coverage
      applies_to: "Included processes"
      requirement: "Cover every declared production line, shift and included on-site operation or justify a documented representative sampling design."
      evidence: "Production routing, site map, sampling plan and reconciliation"
    - id: dq_measurement
      applies_to: "Mass, energy, water and emissions"
      requirement: "Use calibrated instruments where material; retain unit conversions, detection limits, missing-data treatment and calculation factors."
      evidence: "Calibration certificates, laboratory reports and calculation workbook"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Reconcile BoM and output mass, keep energy carriers and material identities separate, and record every known waste route and direct emission."
      evidence: "Mass balance, utility reconciliation, waste manifests and exception log"
    - id: dq_supplier_upstream
      applies_to: "Purchased inputs"
      requirement: "Link each material and utility input to an appropriate upstream dataset or disclose the missing dataset, geography and technology mismatch."
      evidence: "Supplier record, dataset reference and data-gap register"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Product scope"
    rule: "Fail if the reference product is not a babies' garment or clothing accessory whose defining construction is knitted or crocheted, or if required qualifiers are absent."
    source_ids:
      - un-cpc-3-2023
  - rule_id: validate_reference
    applies_to: "Reference flow"
    rule: "Require product UUID 7a9f33f2-9426-425d-abcf-bc483460969b, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg and exactly 1 kg normalized output."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "Inventory rows"
    rule: "Fail any row that combines multiple flows, carriers, chemicals, packaging materials, wastes or emissions; each actual chemical formulation or emitted substance requires its own row."
    source_ids: []
  - rule_id: validate_route_completeness
    applies_to: "Process map"
    rule: "Require cutting, assembly and final packaging; require decoration or wet-finishing inventories whenever those routes are declared on-site, and prohibit their amounts when declared absent."
    source_ids:
      - ilo-garment-osh-2021
      - eu-textiles-bref-2023
  - rule_id: validate_mass_balance
    applies_to: "Material flows"
    rule: "Require a documented fabric and product mass balance and investigation of material unexplained variance."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_wet_processing
    applies_to: "On-site wet finishing"
    rule: "Require separate water, hot water, each chemical, electricity, steam, each fuel, wastewater, sludge and measured direct-emission rows as applicable; require recipe, discharge and treatment-route evidence."
    source_ids:
      - eu-textiles-bref-2023
      - eu-ecolabel-textiles-2014
  - rule_id: validate_allocation
    applies_to: "Shared resources"
    rule: "Require subdivision or a documented causal physical driver before economic allocation; all allocations must reconcile to the measured facility total."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_sources_and_quality
    applies_to: "Evidence and data quality"
    rule: "Require source ids for externally constrained rules, collection evidence for every foreground_record, and explicit disclosure of data gaps and proxy upstream datasets."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "Product-specific foreground manufacturing dataset for packed babies' knitted or crocheted garments or clothing accessories at the factory gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product and portfolio LCA, supply-chain footprinting, eco-design, procurement and downstream lifecycle modelling when the declared product, geography, technology, period and boundary are representative"
  excluded_use: "Claims about consumer safety, legal conformity, durability, use-stage performance or products outside CPC 28227; unqualified substitution for non-knitted apparel or materially different wet-finishing routes"
  required_metadata: "PCR id and version; product UUID; style and size range; fibre and trim composition; fabric construction and mass per area; colour and finish; decoration and wet-finishing routes; site geography; technology; reporting period; allocation; packaging; upstream datasets"
  required_quality_disclosure: "Primary-data share; meter and mass-balance coverage; sampling; allocation drivers; missing data; upstream proxies; laboratory methods; wastewater treatment route; uncertainty and review status"
  update_trigger: "Change in style or fibre mix, fabric construction, supplier or upstream dataset, decoration or wet-finishing recipe, production site or equipment, utility mix, packaging, allocation driver, wastewater treatment, regulation, or a material data-quality finding"
data_sources:
  - id: "un-cpc-3-2023"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Proposed CPC Version 3.0 Structure, 20 November 2023, https://unstats.un.org/unsd/classifications/CPC/Documents/3-Proposed-CPC-Ver3-Structure-20Nov2023.pdf"
    used_for: "CPC 28227 identity and separation from adjacent apparel categories"
  - id: "ilo-garment-osh-2021"
    type: "official_guidance"
