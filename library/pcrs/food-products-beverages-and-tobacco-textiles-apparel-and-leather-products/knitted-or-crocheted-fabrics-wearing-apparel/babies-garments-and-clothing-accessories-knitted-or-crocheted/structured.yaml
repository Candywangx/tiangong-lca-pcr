system_boundary:
  rules:
    - rule_id: boundary_received_materials
      applies_to: "Foreground starting boundary"
      rule: "Begin at receipt of finished knitted or crocheted fabric and separately purchased manufacturing inputs; represent upstream production through linked datasets rather than silently omitting it."
