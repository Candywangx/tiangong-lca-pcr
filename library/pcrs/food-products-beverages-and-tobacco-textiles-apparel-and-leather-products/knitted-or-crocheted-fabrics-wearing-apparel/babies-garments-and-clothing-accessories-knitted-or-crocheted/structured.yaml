    used_for: "Garment supply-chain boundary; fabric, cutting, sewing, trims, ironing, embroidery, finishing and packaging process decomposition"
  - id: "eu-textiles-bref-2023"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Best Available Techniques Reference Document for the Textiles Industry, January 2023, https://bureau-industrial-transformation.jrc.ec.europa.eu/reference/textiles-industry"
    used_for: "Pretreatment, dyeing, printing and finishing scope; water, energy, chemical, wastewater and emission inventory needs"
  - id: "eu-ecolabel-textiles-2014"
