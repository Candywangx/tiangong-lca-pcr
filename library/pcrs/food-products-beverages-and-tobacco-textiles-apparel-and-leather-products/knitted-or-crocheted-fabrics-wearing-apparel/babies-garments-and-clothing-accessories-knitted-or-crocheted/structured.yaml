    used_for: "Fibre and component composition, production recipes, process-site evidence, energy measurement, air and water emissions, product quality and 1 kg textile mass basis"
  - id: "eu-pef-method-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279 on the use of Environmental Footprint methods, https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng"
    used_for: "Company-specific BoM and manufacturing data, complete input/output collection, allocation hierarchy, data quality, verification and normalization"
  - id: "ec-apparel-footwear-pefcr-2025"
    type: "official_guidance"
    reference: "European Commission Directorate-General for Environment, New EU rules for measuring environmental impact of clothes and shoes, 25 June 2025, https://environment.ec.europa.eu/news/new-eu-rules-measuring-environmental-impact-clothes-and-shoes-2025-06-25_en"
    used_for: "Downstream lifecycle-stage context and consistent apparel footprint modelling"
  - id: "enes-kipoz-cut-sew-waste-2020"
    type: "literature"
    reference: "Enes, E.; Kipöz, Ş. The role of fabric usage for minimization of cut-and-sew waste within the apparel production line. Journal of Cleaner Production 248 (2020) 119221. https://doi.org/10.1016/j.jclepro.2019.119221"
    used_for: "Marker planning and separate measurement of pre-consumer cutting waste"
  - id: "munasinghe-clothing-lci-2021"
    type: "literature"
    reference: "Munasinghe, P.D.; Druckman, A.; Dissanayake, D.G.K. A systematic review of the life cycle inventory of clothing. Journal of Cleaner Production 320 (2021) 128852. https://doi.org/10.1016/j.jclepro.2021.128852"
    used_for: "Need for complete, stage-consistent clothing LCI evidence and explicit data-gap disclosure"
