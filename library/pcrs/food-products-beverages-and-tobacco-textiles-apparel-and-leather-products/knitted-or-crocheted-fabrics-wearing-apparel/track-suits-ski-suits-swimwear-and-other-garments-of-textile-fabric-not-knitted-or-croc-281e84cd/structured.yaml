      collection_method: "calibrated scales and meters, inspection records, packaging counts, and fuel reconciliation"
      unit: "kg; piece; kWh; MJ"
      frequency: "each order, with monthly reconciliation"
      temporal_coverage: "representative reporting period, normally 12 consecutive months"
      site_scope: "each final inspection and packing site"
