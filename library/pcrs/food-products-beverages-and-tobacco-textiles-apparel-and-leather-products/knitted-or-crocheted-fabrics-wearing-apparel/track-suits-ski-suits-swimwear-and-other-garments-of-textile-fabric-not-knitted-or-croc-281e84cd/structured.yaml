  - id: p3_assembly
    name: "Sewing, trim attachment, and seam sealing"
    inclusion: "required"
    inclusion_condition: "Include all actual sewing and trim attachment; include seam tape and adhesive only where the declared specification requires sealed seams."
    role: "Produce an assembled garment from cut panels and individual trims."
    quantitative_reference: "kg assembled garment"
  - id: p4_finishing
    name: "Garment washing, printing, coating, heat treatment, and finishing"
    inclusion: "conditional"
    inclusion_condition: "Include each actual wet or dry operation performed after assembly or on cut panels, including performance-finishing operations controlled by the reporting facility."
