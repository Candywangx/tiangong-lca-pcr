  calculation_rules:
    - id: calc_rule_1
      applies_to: "all inventory rows"
      rule: "normalized amount = net attributable exchange amount / net conforming process output mass; for the final process use net accepted CPC 28236 product mass."
      inputs:
        - "atomic row amount"
        - "conforming output mass"
      output: "amount per kg process or reference output"
      source_ids:
        - ec-pef-method-2021
    - id: calc_rule_2
      applies_to: "material mass balance"
      rule: "input textile and trim mass = conforming transferred product mass + separately recorded waste mass + measured stock change; investigate unexplained residuals before release."
      inputs:
        - "material issues and returns"
        - "accepted output"
        - waste
        - "stock change"
      output: "mass-balance residual and reconciliation status"
      source_ids:
        - af-pefcr-3-1-2025
    - id: calc_rule_3
      applies_to: "fabric conversion"
      rule: "fabric mass = measured fabric area × actual conditioned grammage; retain both raw fields and reconcile with scale or invoice mass."
      inputs:
        - area
        - grammage
        - "conditioning state"
      output: "fabric mass"
      source_ids:
        - af-pefcr-3-1-2025
    - id: calc_rule_4
      applies_to: "unit-count trims and packaging"
      rule: "mass = installed or used count × measured unit mass; for length-based inputs use applied length × measured mass per length."
      inputs:
        - "piece count or length"
        - "measured unit mass"
      output: "trim or packaging mass"
      source_ids:
        - af-pefcr-3-1-2025
    - id: calc_rule_5
      applies_to: "combustion emissions"
      rule: "emission mass = measured fuel energy or mass × documented fuel- and equipment-specific emission factor; preserve factor source, heating value, oxidation basis, and pollutant species."
      inputs:
        - "fuel record"
        - "heating value"
        - "emission factor"
      output: "separate mass for each elementary emission row"
      source_ids:
        - ec-pef-method-2021
    - id: calc_rule_6
      applies_to: "effluent pollutant loads"
      rule: "pollutant load = sum of discharge volume interval × matched flow-weighted concentration; report each pollutant separately at the declared treatment boundary."
      inputs:
        - "discharge volume"
        - concentration
        - "sampling time"
        - "treatment boundary"
      output: "kg pollutant discharged"
      source_ids:
        - jrc-textiles-bref-2023
    - id: calc_rule_7
      applies_to: "refrigerant leakage"
      rule: "allocated leakage = opening charge + make-up − closing charge − recovered refrigerant, with allocation based on measured chiller service to the finishing process."
      inputs:
        - "charge inventory"
        - "service additions"
        - recovery
        - "service allocation"
      output: "kg R-410A to air"
      source_ids:
        - ec-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and reference flow"
      requirement: "Verify garment classification, woven fabric construction, route, fibre composition, reference size or size mix, finish, packaging, and the three reference UUIDs."
      evidence: "technical pack; BOM; label specification; state-code-100 Tiangong readback"
    - id: dq_bom
      applies_to: "product material composition"
      requirement: "Provide primary mass data for at least 95% of the BOM and 100% of main fabrics, lining, padding, electronic parts, and metals; identify the residual composition and method."
      evidence: "product-specific BOM, supplier records, and scale records; af-pefcr-3-1-2025"
    - id: dq_technology
      applies_to: "each process"
      requirement: "Record actual technology, location, route applicability, outsourcing, and supplier-embedded processing; do not apply a route row to a demonstrably absent operation."
      evidence: "process map; equipment list; audit or technical pack"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Use one coherent representative period, normally 12 consecutive months, and align inputs, outputs, stock changes, production, and waste records."
      evidence: "dated meters, invoices, production reports, and inventory reconciliation"
    - id: dq_measurement
      applies_to: "mass, energy, water, fuel, emissions"
      requirement: "Retain calibration, measurement resolution, conversion factors, sampling methods, detection limits, and missing-data treatment."
      evidence: "calibration certificates; meter register; laboratory reports; calculation workbook"
    - id: dq_completeness
      applies_to: "inventory coverage"
      requirement: "Include all applicable atomic product, waste, and elementary flows; document and justify every excluded process or exchange and quantify the potential completeness effect."
      evidence: "signed completeness checklist, mass and energy balances, waste register; ec-pef-method-2021"
    - id: dq_uuid
      applies_to: "unresolved non-reference identities"
      requirement: "Keep UUID cells blank until an exact flow, property, unit, and compartment are confirmed; resolve manifest row_id gaps before reviewed publication."
      evidence: "state-code-100 direct readback and reviewer decision"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference flow"
    rule: "Require exactly 1 kg output of 686dfd81-1397-4b0b-b051-eedb1164e25d with Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and all required qualifiers."
    source_ids:
      - un-cpc-3-0-structure-2023
  - rule_id: validation_rule_2
    applies_to: "semantic scope"
    rule: "Confirm that the product is a track suit, ski suit, swimwear item, or other n.e.c. garment made from textile fabric that is not knitted or crocheted; reject knitted or crocheted garments and products explicitly classified in another garment category."
    source_ids:
      - un-cpc-3-0-structure-2023
  - rule_id: validation_rule_3
    applies_to: "route coverage"
    rule: "Require all actual foreground steps and prohibit simultaneous application of the declared cut-and-sew route, including every actual lining, padding, membrane, trim, seam-sealing, and finishing operation."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: validation_rule_4
    applies_to: "atomic inventory"
    rule: "Require each card to resolve to one specific exchange; reject collection labels, combined utilities, combined chemicals, combined packaging, or combined waste/emission rows."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validation_rule_5
    applies_to: "process mass balance"
    rule: "Require reconciled input, conforming output, waste, return, and stock-change masses for cutting, assembly, finishing, and final inspection; flag unexplained residuals."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: validation_rule_6
    applies_to: "utilities and emissions"
    rule: "If natural gas or diesel is reported, require separate direct combustion-emission rows or a documented controlled-equipment boundary; if R-410A make-up is reported, require a reconciled leakage or recovery explanation."
    source_ids:
      - ec-pef-method-2021
      - jrc-textiles-bref-2023
  - rule_id: validation_rule_7
    applies_to: "BOM and primary data"
    rule: "Require the dq_bom primary-data coverage, product weight, assembly-loss evidence, manufacturing technology and energy records when applicable."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: validation_rule_8
    applies_to: "evidence and identity gaps"
    rule: "Reject fabricated quantities and unverified UUIDs; accept absent quantities only as foreground collection requirements and keep unresolved non-reference identities explicit in manifest review metadata."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validation_rule_9
    applies_to: "boundary and double counting"
    rule: "Confirm that supplier-embedded weaving, dyeing, coating, finishing, packaging, transport, and waste treatment are not duplicated in the foreground inventory or upstream datasets."
    source_ids:
      - af-pefcr-3-1-2025
published_dataset_profile:
  dataset_role: "Foreground product-manufacturing dataset for finished non-knitted, non-crocheted textile-fabric garments in this PCR scope."
  downstream_use: "May be used as a secondary_dataset or background_dataset in process and lifecyclemodel projections after identity, completeness, quality, and review gates pass."
  allowed_use: "Factory-gate modelling of a declared garment, route, size basis, formulation, finish, geography, technology, reporting period, and packaging configuration; aggregation only across transparently weighted compatible products and routes."
  excluded_use: "Consumer-use service claims, lifetime or wear comparisons, knitted or crocheted garments, another garment category, an undisclosed fibre/finish mix, or comparative assertions beyond the represented product, geography, technology, and period."
  required_metadata: "PCR id and version; reference UUIDs; garment type; fibre composition; woven fabric construction; route; size basis; grammage where relevant; finish; trims; packaging; location; technology; reporting period; system boundary; allocation; upstream datasets; waste destinations; review status."
  required_quality_disclosure: "Primary-data coverage; BOM coverage; metering and allocation shares; mass-balance residuals; missing data; unresolved UUIDs; source and dataset representativeness; exclusions; uncertainty; verification status."
  update_trigger: "Material change in product scope, reference identity, BOM, construction, route, finish chemistry, site technology, electricity or fuel supply, packaging, allocation, regulation, source methodology, or foreground data older than the declared representativeness period."
