system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "foreground garment manufacturing"
      rule: "Include every applicable on-site step from receipt of declared woven fabrics, membranes, padding, trims and components through inspection, cutting, assembly, seam sealing, finishing, inspection, pressing and packaging, together with direct utilities, wastes and elementary emissions."
