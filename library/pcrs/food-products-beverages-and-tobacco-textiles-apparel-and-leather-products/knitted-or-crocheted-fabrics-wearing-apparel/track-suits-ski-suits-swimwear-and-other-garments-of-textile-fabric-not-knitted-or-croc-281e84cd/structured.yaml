      unit: "kg; m2; kWh"
      frequency: "each cutting order"
      temporal_coverage: "representative reporting period, normally 12 consecutive months"
      site_scope: "each cutting site and line"
      aggregation_rule: "reconcile fabric input to accepted panels, returned usable fabric, and textile waste; keep paper balance separate"
