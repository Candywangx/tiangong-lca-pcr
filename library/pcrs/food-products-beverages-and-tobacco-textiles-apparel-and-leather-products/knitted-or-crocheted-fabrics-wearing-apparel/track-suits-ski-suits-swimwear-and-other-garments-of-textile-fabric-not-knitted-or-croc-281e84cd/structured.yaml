allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "all foreground processes"
    rule: "Avoid allocation by product-specific orders, meters, machine runtime, and waste records. Where subdivision is not feasible, document the shared process, products, reporting period, denominator, and sensitivity."
    source_ids:
      - ec-pef-method-2021
      - af-pefcr-3-1-2025
  - rule_id: allocation_rule_2
    applies_to: "cutting and finishing"
    rule: "Allocate shared cutting and finishing material and energy burdens by measured conforming mass; allocate multi-site electricity using a production-mass-weighted average unless product-specific metering is available."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: allocation_rule_3
    applies_to: "assembly and sewing"
    rule: "Allocate shared assembly and sewing activity by quality-accepted garment units when unit-level runtime or records are unavailable, then convert to the 1 kg reference basis using the measured mass of the represented product and size mix."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: allocation_rule_4
    applies_to: "wastes and recovered materials"
    rule: "Assign collection and treatment burdens to the process generating the waste. Do not credit recycling or energy recovery inside this foreground dataset unless a separately documented downstream model applies a consistent circularity method without double counting."
    source_ids:
      - ec-pef-method-2021
      - af-pefcr-3-1-2025
  - rule_id: allocation_rule_5
    applies_to: "co-products"
    rule: "No co-product is normally produced. If a saleable secondary product occurs, first subdivide its process; if subdivision is infeasible, apply a documented physical relation that reflects causality and report the result separately from waste."
    source_ids:
      - ec-pef-method-2021
