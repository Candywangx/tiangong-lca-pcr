allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "foreground operations"
    rule: "First subdivide formation, blocking, wet finishing, assembly and packaging and meter product-specific inputs and outputs; allocation is used only after physical subdivision is exhausted."
    source_ids:
      - ec-pef-method-2021
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_shared_electricity
    applies_to: "shared electricity meters"
    rule: "Allocate shared electricity using documented machine metering, operating time multiplied by rated or measured power, or another causal physical driver; retain meter total, numerator and denominator."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_shared_thermal
    applies_to: "shared steam and hot water"
    rule: "Allocate each thermal carrier separately using a process meter or a causal heat-demand driver; do not allocate steam, hot water and fuels as one pooled utility."
    source_ids:
      - jrc-textiles-bref-2023
  - rule_id: allocation_material_losses
    applies_to: "offcuts, rejects and leftovers"
    rule: "Assign all input burden to the production that generated the material loss; record the waste output and treatment without subtracting sale or recycling revenue."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_packaging
    applies_to: "grouped packaging"
    rule: "Divide measured group-packaging mass by the counted net product mass or product units actually packed in that group during the same period."
    source_ids:
      - afw-pefcr-v3-1-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_body_formation_records
      process_id: "headgear_body_formation"
      flow_role: "material inputs, electricity, accepted bodies and formation waste"
      record_type: "BOM; issue/return slips; scales; machine or area meter; waste transfer records"
      raw_fields: "product code; route; material specification; issued mass; returned mass; meter start/end; accepted output mass; each waste mass and destination"
      collection_method: "Reconcile each batch from issued material through accepted output and separately weighed waste"
      unit: "kg; kWh"
      frequency: "Per batch, aggregated monthly"
      temporal_coverage: "Representative production period, normally at least 12 months or the complete campaign"
      site_scope: "All in-scope formation lines and subcontractors"
      aggregation_rule: "Sum homogeneous records by product specification, then divide by accepted formed-body mass"
      quality_evidence: "Scale calibration; meter identity; signed issue/return records; BOM revision; waste receipts; reconciliation residual"
    - protocol_id: cp_blocking_records
      process_id: "blocking_shaping"
      flow_role: "body input, water, utilities, fuel, output, wastewater and direct emissions"
      record_type: "Batch log; water/steam/hot-water/fuel/electricity meters; scales; stack data"
      raw_fields: "product code; body mass; water; steam; hot water; electricity; natural gas; LPG; output mass; wastewater; fuel factor or stack result"
      collection_method: "Record every supplied carrier separately and reconcile conditioned input, shaped output and water change"
      unit: "kg; kWh; MJ"
      frequency: "Per batch or shift, aggregated monthly"
      temporal_coverage: "Representative production period"
      site_scope: "All blocking equipment and associated direct heat supply"
      aggregation_rule: "Normalize totals to accepted shaped-body mass; calculate emissions from recorded fuel only when not directly measured"
      quality_evidence: "Meter calibration; fuel invoice reconciliation; moisture record; stack report or factor reference; operator log"
    - protocol_id: cp_wet_finishing_records
      process_id: "wet_finishing"
      flow_role: "body input, water, utilities, each formulation, output, wastewater and NMVOC"
      record_type: "Batch recipe; chemical issue; meters; scales; wastewater and air monitoring"
      raw_fields: "product code; recipe id; input/output mass and moisture; water; steam; hot water; electricity; each formulation mass and composition; wastewater; NMVOC data"
      collection_method: "Link every recipe charge and monitored release to the batch and finishing operation"
      unit: "kg; kWh"
      frequency: "Per batch, aggregated monthly"
      temporal_coverage: "Representative production period"
      site_scope: "All in-scope wet-finishing and drying lines"
      aggregation_rule: "Sum by product and operation, subtract documented returns, then divide by accepted dry finished-body mass"
      quality_evidence: "Recipe approval; chemical SDS/specification; meter calibration; laboratory results; moisture method; discharge record"
    - protocol_id: cp_final_assembly_records
      process_id: "final_assembly_inspection"
      flow_role: "body, components, electricity, accepted product and each waste"
      record_type: "BOM; component issue/return; scales; electricity meter; inspection and waste records"
      raw_fields: "product code; BOM revision; each component specification and mass; electricity; accepted item count and mass; textile waste; metal waste; defective product; destination"
      collection_method: "Reconcile incorporated components and rejected material to accepted net product for each product specification"
      unit: "kg; item; kWh"
      frequency: "Per batch, aggregated monthly"
      temporal_coverage: "Representative production period"
      site_scope: "All final assembly and inspection lines and subcontractors"
      aggregation_rule: "Sum homogeneous batches and divide by accepted net headgear mass"
      quality_evidence: "BOM coverage report; scale calibration; inspection criteria; reject log; waste transfer receipts; mass-balance residual"
    - protocol_id: cp_packaging_records
      process_id: "packaging"
      flow_role: "net product, each packaging component, electricity and packaging waste"
      record_type: "Packaging specification; count; tare weighing; meter; waste records"
      raw_fields: "product code; net product count/mass; each packaging component count and empty mass; grouped carton contents; electricity; paper waste; polyethylene waste"
      collection_method: "Weigh representative empty components and reconcile issued, returned, used and wasted packaging"
      unit: "kg; item; kWh"
      frequency: "Per packaging configuration and monthly aggregation"
      temporal_coverage: "Representative production period"
      site_scope: "All product packing lines"
      aggregation_rule: "Convert counts to mass, allocate grouped packaging by contained net product mass, then normalize to 1 kg net product"
      quality_evidence: "Calibrated scale; packaging specification; issue/return records; packing list; meter identity; waste receipt"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period amount / accepted net finished-headgear mass"
      inputs:
        - "period exchange amount"
        - "accepted net finished-headgear mass"
      output: "exchange amount per 1 kg reference product"
      source_ids:
        - ec-pef-method-2021
    - id: calc_material_consumption
      applies_to: "issued materials and components"
      rule: "consumed mass = issued mass - unused mass returned to controlled stock"
      inputs:
        - "issue and return records"
      output: "consumed material mass"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_count_to_mass
      applies_to: "item-count records"
      rule: "material mass = item count × representative measured item mass"
      inputs:
        - count
        - "same-specification measured unit mass"
      output: "kg material or packaging"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_process_mass_balance
      applies_to: "each foreground process"
      rule: "residual = input mass + documented water retained - accepted output mass - each waste output - documented evaporation"
      inputs:
        - "all measured mass inputs and outputs"
        - "moisture change"
      output: "disclosed residual and completeness check"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_shared_electricity
      applies_to: "shared meter"
      rule: "process electricity = metered total × causal process driver / sum of causal drivers"
      inputs:
        - "meter total"
        - "machine time and measured/rated power or validated physical driver"
      output: "allocated process kWh"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_direct_combustion_emissions
      applies_to: "blocking fuel combustion"
      rule: "calculate each emission separately from recorded fuel and a disclosed applicable factor, or use direct measurement"
      inputs:
        - "fuel quantity and properties"
        - "factor or stack measurement"
      output: "kg of one specified elementary emission"
      source_ids:
        - ec-pef-method-2021
    - id: calc_group_packaging
      applies_to: "corrugated carton and other grouped packaging"
      rule: "assigned packaging mass = measured empty package mass × reference-product net mass / total net product mass contained"
      inputs:
        - "empty packaging mass"
        - "contained product count and net mass"
      output: "kg packaging assigned to reference product"
      source_ids:
        - afw-pefcr-v3-1-2025
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Demonstrate CPC 28262 scope and declare product type, material construction, route, size/dimensions and finish."
      evidence: "Approved specification, BOM, product image/drawing and classification review"
    - id: dq_bom_coverage
      applies_to: "incorporated materials"
      requirement: "Account for at least 95% of finished-product mass and 100% of principal material, lining, frame/metal and other structurally relevant components; disclose every omitted component."
      evidence: "BOM coverage calculation and mass reconciliation"
    - id: dq_route_coverage
      applies_to: "process map"
      requirement: "Map every actual in-house and subcontracted operation to the process inventory and justify every conditional process marked absent."
      evidence: "Process flow diagram, supplier declarations and production records"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use a representative production period, normally 12 consecutive months or the full production campaign, and explain abnormal shutdowns or product-mix changes."
      evidence: "Dated meter, production, purchase and waste records"
    - id: dq_measurement
      applies_to: "measured quantities"
      requirement: "Identify instrument, calibration status, reading frequency and any allocation for each material, water, utility, output and waste quantity."
      evidence: "Calibration certificates, meter register and calculation workpapers"
    - id: dq_chemical_identity
      applies_to: "chemical formulations"
      requirement: "Retain product name, supplier, formulation or active content, SDS/specification and charged mass for each dye, stiffener, repellent, detergent and adhesive."
      evidence: "Chemical issue records, SDS and supplier specification"
    - id: dq_waste_destination
      applies_to: "each waste flow"
      requirement: "Retain separate mass and receiving treatment evidence for every waste stream; do not infer recycling from a sale alone."
      evidence: "Transfer note, invoice and treatment-facility declaration"
    - id: dq_representativeness
      applies_to: "all upstream datasets"
      requirement: "Document geographic, temporal and technological match to the declared material state, electricity mix, thermal supply, chemical and packaging configuration."
      evidence: "Dataset metadata and data-quality assessment"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The reference UUID must equal b00baec8-ce3f-4e11-99c7-8a40167d2f4f, resolve as a public state-100 Product flow classified to CPC 28262, and use Mass 93a60a56-a3c8-11da-a746-0800200b9a66 with kg from Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66."
    source_ids:
      - un-cpc-3-0-28262
  - rule_id: validate_reference_amount
    applies_to: "reference flow"
    rule: "The output must normalize to exactly 1 kg accepted net finished headgear and retain traceability to the measured unnormalized product mass and item count."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_scope
    applies_to: "product identity"
    rule: "The product must be finished CPC 28262 headgear or a hair-net and must not be an unfinished hat body, safety headgear, excluded material category or headgear part."
    source_ids:
      - un-cpc-3-0-28262
      - afw-pefcr-v3-1-2025
  - rule_id: validate_route
    applies_to: "process inventory"
    rule: "Every declared felt, plaited-strip, knitted/crocheted, lace or textile-piece operation must be represented; blocking and wet finishing must be included whenever actually performed."
    source_ids:
      - ilo-isco-68-hatmaking
      - historic-england-plaiters-lea-2011
      - afw-pefcr-v3-1-2025
  - rule_id: validate_atomic_rows
    applies_to: "process inventory"
    rule: "Every card must describe one exchange; each material, electricity, steam, hot water, fuel, chemical formulation, packaging item, waste and elementary emission must remain separate."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_uuid_evidence
    applies_to: "UUID-bearing rows"
    rule: "Store a Tiangong UUID only when hybrid-search and state-100 detail evidence agree on identity, flow type, classification where applicable and reference property; otherwise leave it absent and retain a manifest review item."
    source_ids: []
  - rule_id: validate_bom
    applies_to: "incorporated inputs"
    rule: "The BOM must satisfy dq_bom_coverage, and each incorporated material or component in the concrete product must have its own implemented inventory exchange."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_mass_balance
    applies_to: "foreground processes"
    rule: "Each process must reconcile accepted output, separately measured wastes and documented moisture or evaporation; unexplained netting or a hidden global loss rate is nonconformant."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_utility_allocation
    applies_to: "electricity and thermal carriers"
    rule: "Shared-meter allocation must disclose the meter boundary, period, driver, numerator and denominator; steam, hot water, natural gas and LPG may not be pooled."
    source_ids:
      - afw-pefcr-v3-1-2025
      - jrc-textiles-bref-2023
  - rule_id: validate_packaging
    applies_to: "packaging"
    rule: "Each used packaging component and each generated packaging-waste material must be recorded separately, while all packaging mass remains excluded from reference product mass."
    source_ids:
      - afw-pefcr-v3-1-2025
published_dataset_profile:
  dataset_role: "secondary_dataset; eligible for background_dataset use after methodology and data review"
  downstream_use: "Foreground process and lifecyclemodel construction for factory-gate production of CPC 28262 finished headgear"
  allowed_use: "Product-specific factory-gate studies whose headgear type, material construction, route, size, finishing, facility geography, period and packaging match the dataset"
  excluded_use: "Unfinished hat bodies; safety, rubber, plastics, asbestos or fur-only headgear; mismatched construction routes; distribution, use or end-of-life claims not separately modelled; comparative assertions without an applicable reviewed comparison method"
  required_metadata: "canonical PCR id; reference UUID; CPC reference; product specification; material and fibre composition; construction route; reference size/dimensions; item count per kg; BOM coverage; included and subcontracted processes; wet-finishing operations; facility geography; period; allocation methods; packaging; waste destinations; source ids"
  required_quality_disclosure: "primary-data coverage; measurement and calibration; shared-resource allocation; process mass-balance residuals; data gaps; proxies; upstream dataset representativeness; chemical identity; direct-emission method; uncertainty and verification status"
  update_trigger: "Change in product scope, material construction, body-formation or blocking route, wet-finishing chemistry, facility or subcontractor geography, electricity or heat supply, packaging, waste treatment, reference-flow identity, applicable PEF method or evidence that materially changes a rule"
