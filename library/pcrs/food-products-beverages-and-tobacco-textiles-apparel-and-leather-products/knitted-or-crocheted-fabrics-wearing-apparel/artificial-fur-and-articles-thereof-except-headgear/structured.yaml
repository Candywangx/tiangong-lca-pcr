allocation_rules:
  - rule_id: avoid_allocation
    applies_to: "All foreground processes"
    rule: "First subdivide metered processes and material records or expand the system where justified so that allocation is avoided."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: physical_allocation
    applies_to: "Residual shared inputs and emissions"
    rule: "If subdivision is not possible, allocate by a documented physical relationship that reflects how resource use or emissions change, using process time, metered throughput, or dry product mass as applicable."
    source_ids:
      - eu-pef-recommendation-2021-2279
      - pef-apparel-footwear-v3-1-2025
  - rule_id: economic_allocation_last_resort
    applies_to: "Outputs lacking a defensible physical relationship"
    rule: "Use economic allocation only when subdivision, system expansion, and physical allocation are not feasible; disclose prices, period, currency, and sensitivity."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: waste_and_rework
    applies_to: "Offcuts, rejects, and recovered material"
    rule: "Keep internal rework inside the process balance without treating it as a co-product; report material that leaves for recycling or treatment as a waste flow and document any credited downstream treatment outside this foreground package."
    source_ids:
      - eu-pef-recommendation-2021-2279
      - pef-apparel-footwear-v3-1-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_pile_fabric_formation
      process_id: "pile_fabric_formation"
      flow_role: "all atomic exchanges"
      record_type: "Batch production, stores, meter, waste, and emission records"
      raw_fields: "input mass; electricity; accepted output; fibre waste; dust; rework"
      collection_method: "Reconcile batch tickets, calibrated scales, submeter readings, waste transfer records, and dust monitoring or filter balance."
      unit: "kg; kWh"
      frequency: "Per batch and monthly reconciliation"
      temporal_coverage: "One representative consecutive 12-month period or disclosed shorter campaign"
      site_scope: "Each foreground formation site"
      aggregation_rule: "Sum by site and material or pollutant identity, then normalize to accepted greige-fabric mass."
      quality_evidence: "Batch tickets, scale calibration, meter records, waste tickets, monitoring reports"
    - protocol_id: cp_dyeing_and_finishing
      process_id: "dyeing_and_finishing"
      flow_role: "all atomic exchanges"
      record_type: "Recipe, batch, water, utility, output, wastewater, and stack records"
      raw_fields: "greige mass; each dye and auxiliary; water; electricity; gas; steam; finished mass; wastewater; each pollutant"
      collection_method: "Reconcile recipes and dosing records with purchase data, utility meters, product scales, wastewater meters, and pollutant-specific monitoring or calculations."
      unit: "kg; m3; kWh; MJ"
      frequency: "Per batch and monthly reconciliation"
      temporal_coverage: "One representative consecutive 12-month period or disclosed shorter campaign"
      site_scope: "Each foreground finishing site"
      aggregation_rule: "Sum each atomic flow by site, then normalize to accepted finished-fabric mass."
      quality_evidence: "Recipe sheets, dosing calibration, meters, invoices, scale records, discharge and stack reports"
    - protocol_id: cp_coating_and_lamination
      process_id: "coating_and_lamination"
      flow_role: "all atomic exchanges"
      record_type: "Recipe, batch, utility, output, waste, and stack records"
      raw_fields: "fabric mass; each binder or adhesive; solids content; electricity; gas; backed mass; each chemical waste; each pollutant"
      collection_method: "Reconcile line recipes and purchase records with calibrated dosing, utility meters, output scales, waste tickets, and pollutant-specific monitoring or calculations."
      unit: "kg; kWh; MJ"
      frequency: "Per batch and monthly reconciliation"
      temporal_coverage: "One representative consecutive 12-month period or disclosed shorter campaign"
      site_scope: "Each foreground coating or lamination site"
      aggregation_rule: "Sum each atomic flow by site, then normalize to accepted backed-fabric mass."
      quality_evidence: "Recipe sheets, safety and supplier data, dosing calibration, meters, scale records, waste and stack reports"
    - protocol_id: cp_cutting_and_assembly
      process_id: "cutting_and_assembly"
      flow_role: "all atomic exchanges"
      record_type: "Bill of materials, issue, cutting, sewing, meter, output, and waste records"
      raw_fields: "each fabric mass; thread; lining; electricity; product mass; offcuts; thread waste; rework"
      collection_method: "Reconcile the bill of materials with material issues and returns, calibrated output and waste scales, and electricity submeters."
      unit: "kg; kWh"
      frequency: "Per production order and monthly reconciliation"
      temporal_coverage: "One representative consecutive 12-month period or disclosed shorter campaign"
      site_scope: "Each foreground assembly site"
      aggregation_rule: "Sum each atomic flow by site and product form, then normalize to conforming product mass."
      quality_evidence: "BOM, issue and return tickets, cutting reports, scale calibration, meter records"
    - protocol_id: cp_inspection_and_packaging
      process_id: "inspection_and_packaging"
      flow_role: "all atomic exchanges"
      record_type: "Inspection, packaging issue, meter, released-output, and reject records"
      raw_fields: "unpacked product; each packaging component; electricity; released net product; rejected product"
      collection_method: "Reconcile inspection and release counts with net product weights, packaging issues and returns, meter data, and reject records."
      unit: "kg; kWh"
      frequency: "Per production order and monthly reconciliation"
      temporal_coverage: "One representative consecutive 12-month period or disclosed shorter campaign"
      site_scope: "Each foreground final-release site"
      aggregation_rule: "Sum each atomic flow by site, then normalize to released net product mass excluding packaging."
      quality_evidence: "Inspection records, BOM, issue and return tickets, scale calibration, meter records"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "Every inventory exchange"
      rule: "normalized exchange = reporting-period exchange / reporting-period conforming net product mass"
      inputs:
        - "Atomic exchange quantity"
        - "conforming output mass in kg"
      output: "Exchange per 1 kg reference product"
      source_ids:
        - eu-pef-recommendation-2021-2279
        - pef-apparel-footwear-v3-1-2025
    - id: calc_material_balance
      applies_to: "Each material-processing step"
      rule: "Reconcile each material identity as input = conforming product incorporation + measured waste + measured direct release + documented stock change; investigate and disclose residuals."
      inputs:
        - "Material issues and returns"
        - "output composition"
        - wastes
        - "direct releases"
        - "opening and closing stocks"
      output: "Material balance and residual by material"
      source_ids:
        - jrc-textiles-bref-2023
        - pef-apparel-footwear-v3-1-2025
    - id: calc_process_loss
      applies_to: "Formation, finishing, coating, and assembly"
      rule: "loss fraction = measured non-reworked material waste / net material input; keep each material or actual composite waste stream separate."
      inputs:
        - "Net material input"
        - "measured waste"
        - "internal rework"
      output: "Process loss fraction and waste mass"
      source_ids:
        - pef-apparel-footwear-v3-1-2025
    - id: calc_direct_combustion_emissions
      applies_to: "On-site natural-gas combustion"
      rule: "Prefer pollutant-specific monitoring; otherwise calculate emission = measured fuel energy × documented facility-specific emission factor for each pollutant."
      inputs:
        - "Fuel energy"
        - "pollutant-specific factor or monitored concentration and gas flow"
      output: "One direct elementary flow per pollutant"
      source_ids:
        - jrc-textiles-bref-2023
    - id: calc_shared_utility_allocation
      applies_to: "Shared electricity, steam, and fuel"
      rule: "Use direct submetering first; otherwise apply the physical allocation selected under Section 7 and document the driver and denominator."
      inputs:
        - "Shared utility total"
        - "process-specific physical driver"
      output: "Utility quantity assigned to one process"
      source_ids:
        - eu-pef-recommendation-2021-2279
        - pef-apparel-footwear-v3-1-2025
    - id: calc_bom_coverage
      applies_to: "Final product composition"
      rule: "Reconcile the bill of materials to net product mass; the reported BOM shall cover at least 95% of product mass and 100% of main fabric, lining, padding, and metal components that are present."
      inputs:
        - "Component masses"
        - "net product mass"
      output: "BOM coverage and disclosed omissions"
      source_ids:
        - pef-apparel-footwear-v3-1-2025
  data_quality_requirements:
    - id: dq_technology
      applies_to: "Each included process"
      requirement: "Foreground records shall represent the actual pile technology, fibre composition, finishing route, coating or lamination system, assembly method, and abatement used."
      evidence: "Process diagram, equipment list, recipes, BOM, product specification"
    - id: dq_geography
      applies_to: "Site and upstream datasets"
      requirement: "Identify each foreground site and use geographically representative electricity, fuel, water, treatment, and purchased-material datasets."
      evidence: "Site addresses, supplier geography, dataset metadata"
    - id: dq_time
      applies_to: "Foreground data"
      requirement: "Use a representative consecutive twelve-month period where possible; disclose campaign data, shutdowns, substitutions, and any extrapolation."
      evidence: "Dated meter, batch, purchase, production, and waste records"
    - id: dq_precision
      applies_to: "Measured and calculated exchanges"
      requirement: "Preserve raw quantities, calibration status, calculation factors, allocation drivers, and reconciliation residuals so results can be reproduced."
      evidence: "Calibration certificates, raw extracts, calculation workbook, review log"
    - id: dq_completeness
      applies_to: "Materials and emissions"
      requirement: "Meet the BOM coverage rule and separately record all known process chemicals, energy carriers, direct pollutants, wastewater, and managed waste streams; do not use a generic “other” card."
      evidence: "BOM reconciliation, recipe ledger, utility ledger, permits, waste register"
    - id: dq_consistency
      applies_to: "Multi-site or multi-route datasets"
      requirement: "Apply the same reference mass, dry/net mass convention, flow identity, allocation hierarchy, and reporting period to every included site and route."
      evidence: "Consolidation procedure and site-level checks"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm Tiangong UUID ac47239d-883f-4063-bcc1-fc64b2ffc8fc, Product flow type, CPC 3.0 28330, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass group 93a60a57-a4c8-11da-a746-0800200c9a66, and kg unit."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_scope_and_route
    applies_to: "Dataset scope"
    rule: "Reject natural fur, headgear, undeclared product form, or a dataset whose included route steps and starting condition cannot be determined."
    source_ids:
      - unsd-cpc-3-0-2025
      - ziouzios-et-al-2026-artificial-fur-processing
  - rule_id: validate_atomic_inventory
    applies_to: "Process inventory"
    rule: "Confirm every card contains exactly one material, energy carrier, waste stream, or pollutant; require each actual dye, auxiliary, binder, adhesive, packaging component, fuel, and emission separately."
    source_ids:
      - jrc-textiles-bref-2023
      - pef-apparel-footwear-v3-1-2025
  - rule_id: validate_mass_balance
    applies_to: "Material processes"
    rule: "Reperform material balances by identity and investigate unexplained residuals, omitted offcuts, wastewater transfers, stock changes, and rework."
    source_ids:
      - jrc-textiles-bref-2023
      - pef-apparel-footwear-v3-1-2025
  - rule_id: validate_energy_and_emissions
    applies_to: "Utilities and direct releases"
    rule: "Reconcile electricity, steam, and natural gas separately to meters or invoices and verify that each direct pollutant has monitoring or a documented calculation basis."
    source_ids:
      - jrc-textiles-bref-2023
  - rule_id: validate_recursive_inputs
    applies_to: "Purchased artificial fur"
    rule: "Confirm that same-category purchased fabric is linked once as an upstream product dataset and is not duplicated as foreground fibre or fabric manufacture."
    source_ids:
      - unsd-cpc-3-0-2025
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_allocation
    applies_to: "Shared processes and outputs"
    rule: "Verify the allocation hierarchy, driver, denominator, period, and sensitivity; fail a dataset that uses unsubstantiated allocation."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_data_quality
    applies_to: "Dataset evidence"
    rule: "Verify technology, geography, time, precision, completeness, and consistency evidence, including BOM and recipe reconciliation."
    source_ids:
      - eu-pef-recommendation-2021-2279
      - pef-apparel-footwear-v3-1-2025
published_dataset_profile:
  dataset_role: "Foreground data package for finished artificial fur or a made-up artificial-fur article other than headgear, normalized to 1 kg net product at plant"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product and facility inventories, lifecycle models, hotspot assessment, supplier-data exchange, and internal design assessment when the declared product form and route match"
  excluded_use: "Natural fur, headgear, products outside CPC 28330, comparative claims with non-harmonized functions, and route substitution without disclosed adjustment"
  required_metadata: "CPC code; reference-flow UUID; product form; fibre composition; pile technology; backing/coating status; dyeing and finishing route; included processes; site/geography; reporting period; allocation; production mix; at-plant state"
  required_quality_disclosure: "Data sources, meter and scale coverage, BOM coverage, recipe completeness, allocation drivers, upstream dataset substitutions, balance residuals, and missing pollutant measurements"
  update_trigger: "Change in fibre composition, pile technology, dye or finish, coating or lamination, site, energy system, allocation, product form, supplier dataset, or representative reporting period"
