allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Avoid allocation with route-, line-, lot-, and product-specific records. Internal rework is not a waste output. Allocate shared meters by causal drivers such as machine time, measured throughput, thermal demand, or wastewater volume; use and disclose mass allocation only when no better relation exists. List saleable by-products separately and do not credit avoided burdens for waste recycling inside this foreground package."
    source_ids: []
