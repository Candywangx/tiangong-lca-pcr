  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = attributable row amount / accepted net CPC 28243 product mass"
      inputs:
        - "attributable amount"
        - "accepted product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - ec-pef-recommendation-2021
    - id: calc_shared_meter_allocation
      applies_to: "shared carrier meters"
      rule: "allocated carrier = metered carrier × documented causal driver / total driver"
      inputs:
        - meter
        - "machine time"
        - throughput
        - "or demand"
      output: "carrier-specific allocated energy"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_stack_substance_load
      applies_to: "each named air substance"
      rule: "mass = synchronized concentration × corrected dry gas volume"
      inputs:
        - concentration
        - "gas flow"
        - duration
        - moisture
      output: "kg named substance"
      source_ids:
        - eu-textiles-bat-2022
        - eu-solvent-bat-2020
    - id: calc_effluent_substance_load
      applies_to: "each named water substance"
      rule: "mass = synchronized concentration × discharged water volume"
      inputs:
        - concentration
        - "water volume"
        - "sampling representativeness"
      output: "kg named substance"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_r134a_loss
      applies_to: "R-134a to air"
      rule: "loss = opening charge + additions − closing charge − documented recovery"
      inputs:
        - "equipment charge and service records"
      output: "kg R-134a released"
      source_ids:
        - ec-pef-recommendation-2021
    - id: calc_solvent_balance
      applies_to: "each named solvent"
      rule: "unrecovered = opening + purchases − closing − product retention − recovery − waste"
      inputs:
        - "substance-specific stock"
        - purchase
        - product
        - recovery
        - "and waste"
      output: "kg substance not otherwise accounted for"
      source_ids:
        - eu-solvent-bat-2020
