      evidence: "us-epa-textile-bmp-1996; calibration and meter records"
    - id: dq_temporal_coverage
      applies_to: "all variable foreground data"
      requirement: "Cover at least 12 representative months or the complete production campaign when shorter; disclose seasonality, downtime, and exclusions."
      evidence: "dated raw records and coverage statement"
    - id: dq_completeness
      applies_to: "all processes"
