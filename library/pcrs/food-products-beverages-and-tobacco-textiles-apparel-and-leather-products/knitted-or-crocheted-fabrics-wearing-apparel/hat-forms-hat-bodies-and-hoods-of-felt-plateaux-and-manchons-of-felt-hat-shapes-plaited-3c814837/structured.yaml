      evidence: "signed process and annual mass/energy reconciliation"
    - id: dq_atomic_chemicals
      applies_to: "fulling, dyeing, cleaning, and finishing recipes"
      requirement: "Record every actual chemical as a separate named exchange with concentration and amount; the three named fulling chemicals do not authorize omission or aggregation of other recipe chemicals."
      evidence: "approved recipe; issue ledger; SDS"
    - id: dq_atomic_fuels_refrigerants
      applies_to: "onsite utilities"
      requirement: "Record each actual fuel and refrigerant as a separate named exchange; if diesel, LPG, another fuel, or a refrigerant is used inside the boundary, add a dedicated atomic row and its corresponding direct emissions or losses."
      evidence: "fuel/refrigerant ledger; meter; maintenance log"
    - id: dq_background_links
      applies_to: "purchased inputs"
      requirement: "Record the upstream dataset, geography, technology, reference year, and substitution rationale for every material, utility, chemical, and packaging input."
      evidence: "dataset mapping log and quality review"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The reference exchange shall use product flow ef72f4d7-8f9e-401f-bcff-8dc295e94396, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, normalized to exactly 1 kg net product."
    source_ids: []
  - rule_id: validate_route_and_state
    applies_to: "reference product"
    rule: "Reject a package that omits route/material/product-form qualifiers or includes a final blocked shape, made brim, lining, or trimming inconsistent with CPC 28261."
    source_ids:
      - un-cpc-ver3-structure-2025
      - eurlex-cn-headgear-2010
  - rule_id: validate_mass_balance
    applies_to: "each process and route"
    rule: "Require process mass reconciliation including moisture change, evaporation, product, every specific waste, and mass elementary output; investigate unexplained imbalance."
    source_ids:
      - eu-ef-method-2021
  - rule_id: validate_atomic_inventory
    applies_to: "all inventory"
    rule: "Reject combined or collection exchanges; electricity, steam, each fuel, each refrigerant, each chemical, each packaging component, each waste, and each elementary emission shall be represented separately when applicable."
    source_ids: []
  - rule_id: validate_wet_processing
    applies_to: "felt fulling and conditioning"
    rule: "When fulling, dyeing, washing, or rinsing occurs, require measured water, separately named recipe chemicals, and separately metered wastewater; otherwise require a documented not-applicable statement."
    source_ids:
      - us-epa-textile-mills-1982
      - us-epa-textile-bmp-1996
  - rule_id: validate_direct_fuel_emissions
    applies_to: "onsite combustion"
    rule: "When an onsite fuel input is present, require separate direct-emission exchanges for every modelled pollutant and disclose factor or stack-test evidence; purchased steam shall not be treated as onsite fuel."
    source_ids:
      - eu-ef-method-2021
  - rule_id: validate_strip_materials
    applies_to: "plaited/assembled route"
    rule: "Require every actual plait, strip, thread, and material-specific offcut to be separately identified; an unlisted material requires a new atomic row rather than reuse of another material row."
    source_ids:
      - un-cpc-ver3-structure-2025
  - rule_id: validate_packaging
    applies_to: "factory-gate delivery"
    rule: "Require each actual packaging material as a separate input and confirm that all packaging mass is excluded from the 1 kg net product reference amount."
    source_ids: []
  - rule_id: validate_data_quality
    applies_to: "foreground data package"
    rule: "Reject incomplete temporal coverage, missing calibration/traceability evidence, unexplained estimates, or background links without geography, technology, and year disclosure."
    source_ids:
      - eu-ef-method-2021
      - us-epa-textile-bmp-1996
published_dataset_profile:
  dataset_role: "Product-specific foreground manufacturing dataset for an unfinished CPC 28261 hat-form/body/hood/plateau/manchon or plaited/strip-assembled hat-shape"
  downstream_use: "secondary_dataset; background_dataset for downstream hat manufacture when route, material, market state, geography, technology, and year match"
  allowed_use: "Factory-gate LCA modelling of downstream hats and headgear; supplier-specific product footprints; route-specific benchmarking where qualifiers align"
  excluded_use: "Finished-hat production without added blocking/lining/trimming processes; substitution across materially different routes without sensitivity; consumer use or end-of-life claims; comparative public assertions without separate critical review"
  required_metadata: "PCR id; CPC code; reference-flow UUIDs; route; fibre species or strip composition; product form; moisture; colour/finish state; excluded finishing confirmation; geography; technology; reference year; allocation; packaging; data sources"
  required_quality_disclosure: "Primary-data share; temporal coverage; meter and scale calibration; recipe and material traceability; process balances; background dataset choices; unresolved UUID identities; assumptions and limitations"
  update_trigger: "Material route or recipe change; new/removed wet process; equipment or energy-source change; direct-emission factor change; packaging redesign; supplier/background dataset change; or data older than the represented technology and market conditions"
