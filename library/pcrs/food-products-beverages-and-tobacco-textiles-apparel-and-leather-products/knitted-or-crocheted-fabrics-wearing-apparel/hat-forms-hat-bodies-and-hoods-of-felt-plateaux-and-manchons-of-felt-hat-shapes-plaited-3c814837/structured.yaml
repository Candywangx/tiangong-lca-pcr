allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "multi-route, multi-material, or multi-product operations"
    rule: "Subdivide batches, machines, meters, and recipe records by route and product wherever physical records permit before applying allocation."
    source_ids:
      - eu-ef-method-2021
  - rule_id: allocation_reuse_internal
    applies_to: "internally reused fibre, water, plait, and offcuts"
    rule: "Keep internal reuse as an internal transfer without an avoided-product credit; record only residual waste crossing the foreground boundary."
    source_ids:
      - us-epa-textile-bmp-1996
  - rule_id: allocation_mass_fallback
    applies_to: "inseparable shared operations"
    rule: "If subdivision is impossible and products have comparable functions, allocate shared burdens by net output mass and disclose the affected processes, denominator, period, and sensitivity."
    source_ids:
      - eu-ef-method-2021
  - rule_id: allocation_economic_exception
    applies_to: "materially different co-products"
    rule: "Use economic allocation only when physical subdivision and a defensible physical relation are unavailable; disclose prices, period, currency, shares, and a mass-allocation sensitivity."
    source_ids:
      - eu-ef-method-2021
  - rule_id: allocation_no_reject_credit
    applies_to: "wastes and rejects"
    rule: "Do not treat rejects, wastewater, dust, or offcuts as burden-free co-products merely because they are sold or recovered; model the documented waste or recovered-material destination separately."
    source_ids:
      - eu-ef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_felt_fibre_records
      process_id: "felt_fibre_preparation"
      flow_role: "fibre, electricity, intermediate, and reject quantities"
      record_type: "receiving tickets; batch sheets; calibrated scale and electricity-meter records"
      raw_fields: "date; lot; species; supplier; input kg; web kg; reject kg; kWh; moisture"
      collection_method: "Reconcile receiving, batch, hand-off, reject, and submeter records by conforming batch"
      unit: "kg; kWh"
      frequency: "each batch with monthly reconciliation"
      temporal_coverage: "at least 12 representative months or the full campaign when shorter"
      site_scope: "all foreground fibre-preparation equipment"
