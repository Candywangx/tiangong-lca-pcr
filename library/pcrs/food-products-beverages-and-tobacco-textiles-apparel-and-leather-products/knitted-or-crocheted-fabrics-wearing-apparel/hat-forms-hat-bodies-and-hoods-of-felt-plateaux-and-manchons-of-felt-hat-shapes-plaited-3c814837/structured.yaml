system_boundary:
  rules:
    - rule_id: boundary_starting_materials
      applies_to: "all routes"
      rule: "Start at receipt of prepared/scoured felt fibre, straw splints or plait, or a declared specific strip material; upstream fibre, crop, pulp, polymer, and animal-skin processing shall be linked, not silently absorbed."
      source_ids:
        - historic-england-luton-hat-industry-2013
        - eu-ef-method-2021
    - rule_id: boundary_required_operations
      applies_to: "applicable route"
      rule: "Include all directly controlled material preparation, felt formation/fulling, wet finishing, drying, plaiting, assembly, inspection, and packaging operations that occur before the declared factory gate."
      source_ids:
        - historic-england-luton-hat-industry-2013
        - us-epa-textile-mills-1982
    - rule_id: boundary_product_state
      applies_to: "reference product"
      rule: "Stop before final style blocking or made-brim formation and, for plaited or strip-assembled shapes, before lining or trimming."
      source_ids:
        - eurlex-cn-headgear-2010
        - un-cpc-ver3-structure-2025
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased products and services"
      rule: "Link every purchased fibre, strip, chemical, utility, and packaging input to a geographically and technologically appropriate upstream dataset; keep its foreground amount visible."
      source_ids:
        - eu-ef-method-2021
    - rule_id: boundary_exclusions
      applies_to: "downstream life cycle"
      rule: "Exclude finished-hat blocking, stiffening performed only after final blocking, made brims, lining, bands, decorative trimming, distribution, use, and end-of-life from this factory-gate dataset."
      source_ids:
        - eurlex-cn-headgear-2010
        - historic-england-luton-hat-industry-2013
