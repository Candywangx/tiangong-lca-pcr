  calculation_rules:
    - id: calc_normalized_amount
      applies_to: "every non-reference inventory amount"
      rule: "normalized amount = period amount attributable to conforming product / period net conforming reference-product mass"
      inputs:
        - "atomic period amount"
        - "net conforming product kg"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-ef-method-2021
    - id: calc_steam_energy
      applies_to: "purchased steam"
      rule: "delivered steam MJ = measured steam mass × (delivered specific enthalpy − condensate return specific enthalpy); disclose both states"
      inputs:
        - "steam mass"
        - "pressure/temperature or supplier enthalpy"
        - "condensate state"
      output: "MJ purchased steam"
      source_ids: []
    - id: calc_fibre_dust_release
      applies_to: "animal-fibre dust"
      rule: "uncaptured dust = inlet fibre − prepared web − solid rejects − captured dust − documented moisture change; negative results are invalid"
      inputs:
        - "all mass-balance terms"
      output: "kg animal-fibre dust to air"
      source_ids:
        - us-epa-textile-bmp-1996
    - id: calc_straw_dust_release
      applies_to: "wheat-straw dust"
      rule: "uncaptured dust = splint input − plait output − clippings − captured dust − documented moisture change; negative results are invalid"
      inputs:
        - "all mass-balance terms"
      output: "kg wheat-straw dust to air"
      source_ids:
        - us-epa-textile-bmp-1996
    - id: calc_natural_gas_emissions
      applies_to: "each direct natural-gas pollutant"
      rule: "pollutant mass = metered natural-gas energy × disclosed pollutant-specific factor, unless a representative stack measurement supersedes the calculation"
      inputs:
        - "natural gas MJ"
        - "one pollutant-specific factor or stack result"
      output: "kg of one named pollutant"
      source_ids:
        - eu-ef-method-2021
    - id: calc_mass_balance
      applies_to: "each process and route"
      rule: "imbalance = total mass inputs − product outputs − waste outputs − elementary mass outputs − documented evaporation/moisture change; investigate rather than forcing the balance to zero"
      inputs:
        - "atomic mass records and moisture data"
      output: "disclosed process imbalance"
      source_ids:
        - eu-ef-method-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain CPC 28261 product-form and market-state inspection evidence for every represented route."
      evidence: "lot inspection checklist; product specification; photographs where useful"
    - id: dq_material_identity
      applies_to: "fibres, plaits, strips, thread, chemicals, and packaging"
      requirement: "Retain supplier, lot, composition/species, chemical concentration, and product specification; do not substitute a plural material category."
      evidence: "purchase specification; certificate of analysis; SDS; lot record"
    - id: dq_primary_activity_data
      applies_to: "foreground manufacturing"
