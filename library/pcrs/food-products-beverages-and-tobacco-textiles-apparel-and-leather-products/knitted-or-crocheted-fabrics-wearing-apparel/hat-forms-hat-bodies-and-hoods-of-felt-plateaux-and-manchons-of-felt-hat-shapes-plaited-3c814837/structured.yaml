    role: "Foreground felt body manufacture"
    quantitative_reference: "Per kg net CPC 28261 reference product"
  - id: felt_body_conditioning
    name: "Conditional felt-body dyeing, rinsing, and drying"
    inclusion: "conditional"
    inclusion_condition: "Include when dyeing, additional rinsing, generic hood opening, or drying occurs before the CPC 28261 factory gate; final style blocking, made-brim formation, lining, and trimming remain excluded."
    role: "Foreground wet finishing and conditioning"
    quantitative_reference: "Per kg net CPC 28261 reference product"
  - id: straw_plait_preparation
    name: "Onsite wheat-straw splint preparation and plaiting"
    inclusion: "conditional"
    inclusion_condition: "Include only when wheat-straw splints are softened, flattened, clipped, and plaited inside the foreground boundary; purchased plait enters the next process directly."
    role: "Foreground plait manufacture"
    quantitative_reference: "Per kg net CPC 28261 reference product"
  - id: strip_hat_shape_assembly
    name: "Plaited or strip-assembled unfinished hat-shape assembly"
    inclusion: "conditional"
    inclusion_condition: "Required for the plaited or strip-assembled route. Record only actual materials; any material not listed below requires a new dedicated atomic foreground exchange rather than a generic strip-material row."
    role: "Foreground hat-shape assembly"
    quantitative_reference: "Per kg net CPC 28261 reference product"
  - id: final_inspection_packaging
    name: "Final inspection, net-mass determination, and packaging"
    inclusion: "required"
    inclusion_condition: "Always include for the declared factory-gate product; one and only one route-specific unfinished product input is applicable."
    role: "Foreground finalization and reference-product delivery"
    quantitative_reference: "1 kg net CPC 28261 reference product"
