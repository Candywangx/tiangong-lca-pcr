system_boundary:
  rules:
    - rule_id: boundary_required_foreground
      applies_to: "Garment manufacturing"
      rule: "Include receipt and preparation, cutting, sewing and assembly, quality control, packaging, and the wastes generated by those operations."
      source_ids:
        - epd-international-pcr-2024-03-apparel
    - rule_id: boundary_conditional_operations
      applies_to: "Garment-stage finishing and treatment"
      rule: "Include garment washing, dyeing, printing, curing, coating, drying, on-site utilities, and wastewater treatment whenever performed under foreground control; otherwise identify representative upstream or service datasets and prevent double counting."
      source_ids:
        - epd-international-pcr-2024-03-apparel
    - rule_id: boundary_upstream_traceability
      applies_to: "Purchased materials and services"
      rule: "Do not treat delivered fabric, thread, trims, packaging, energy, transport, or waste treatment as burden-free; link them to representative upstream datasets or disclose a data gap."
      source_ids:
        - epd-international-pcr-2024-03-apparel
        - ec-pef-method-2021-2279
    - rule_id: boundary_inventory_completeness
      applies_to: "Foreground inventory"
      rule: "Account for at least 99% of product-content mass and energy use and assess exclusions against environmental relevance; document every cut-off and the evidence used to verify it."
      source_ids:
        - epd-international-pcr-2024-03-apparel
    - rule_id: boundary_downstream_separation
      applies_to: "Dataset use"
      rule: "Keep distribution, retail, consumer care, reuse, and end-of-life outside the manufacturing foreground dataset, while preserving metadata needed to connect those stages in a lifecycle model."
      source_ids:
        - epd-international-pcr-2024-03-apparel
        - ec-pef-method-2021-2279
boundary_abstraction:
  declared_starting_condition: "Finished knitted or crocheted fabric, sewing thread, trims, accessories, packaging, and other purchased inputs delivered to the first foreground garment-manufacturing operation"
  starting_condition_role: "Traceable upstream product inputs to garment making; not burden-free raw materials"
  product_classification_scope: "The finished reference product is CPC 3.0 28225; upstream fabrics, yarns, chemicals, utilities, packaging, transport, and waste-treatment services retain their own identities"
  recursive_input_rule: "If an input is already a finished CPC 28225 garment, record it as a separately identified reused, reworked, or intermediate garment input and do not recursively rebuild its history inside this foreground package"
  upstream_dataset_requirement: "Require representative upstream datasets for fabric and other main materials, fibre and yarn production where not already included in the fabric dataset, fabric wet processing, purchased energy, packaging manufacture, inbound transport, and off-site waste treatment"
  disclosure: "Declare which spinning, knitting, dyeing, printing, finishing, packaging production, transport, wastewater treatment, and waste-treatment steps are inside or outside operator control; disclose geography, technology, reporting period, and any generic or proxy datasets"
