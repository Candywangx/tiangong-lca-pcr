  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground amounts"
      rule: "normalized amount = reporting-period amount / reporting-period net accepted garment mass"
      inputs:
        - "amount by flow"
        - "net accepted garment mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_material_consumption
      applies_to: "Fabric, thread, trims, accessories, and packaging"
      rule: "consumed mass = opening stock + receipts - returns to supplier - closing stock; reconcile issues and unexplained losses"
      inputs:
        - "stock and transaction records"
      output: "consumed kg by material"
      source_ids:
        - mass-balance-identity
    - id: calc_cutting_balance
      applies_to: "Cutting"
      rule: "fabric issued = accepted cut components + returned fabric + off-cuts + rejected panels + inventory change + documented measurement variance"
      inputs:
        - "cutting-order mass records"
      output: "reconciled cutting inputs and outputs"
      source_ids:
        - mass-balance-identity
    - id: calc_item_mass
      applies_to: "Count-only garment records"
      rule: "net garment mass = accepted count x measured mean net mass for the same product and size stratum"
      inputs:
        - count
        - "sample weights"
        - "stratum production weights"
      output: "kg net accepted garment"
      source_ids:
        - iso-14048-2002
    - id: calc_shared_utility
      applies_to: "Shared meters"
      rule: "allocate residual shared utility only after direct meters, using a documented causal driver and reconciling allocated totals to the meter"
      inputs:
        - "meter total"
        - "direct-meter totals"
        - "causal driver by product"
      output: "allocated utility by product"
      source_ids:
        - epd-international-pcr-2024-03-apparel
        - iso-14044-2006
    - id: calc_pollutant_load
      applies_to: "Direct emissions and treated effluent"
      rule: "pollutant load = matched-period concentration x matched-period gas or liquid volume, with unit conversion and sampling coverage disclosed"
      inputs:
        - concentration
        - "volume or flow"
        - time
        - "detection-limit treatment"
      output: "mass of pollutant by compartment"
      source_ids:
        - iso-14048-2002
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Retain garment type, composition percentages, construction, size or size mix, net unit mass, colour, finish, moisture condition, manufacturing route, site, geography, and reporting period."
      evidence: "approved specification; bill of materials; production order; scale records"
    - id: dq_core_specific_data
      applies_to: "All foreground core processes"
      requirement: "Use site-specific data for operations under foreground control. All core data shall represent the same period; deviations require explicit disclosure and justification."
      evidence: "meter, invoice, production, warehouse, quality, waste, and treatment records; epd-international-pcr-2024-03-apparel"
    - id: dq_upstream_representativeness
      applies_to: "Fabric, fibre, yarn, wet processing, packaging, energy, transport, and treatment datasets"
      requirement: "Assess technology, geography, time, composition, recycled content, and system-boundary fit; prefer supplier-specific data for main materials and disclose generic or proxy shares."
      evidence: "supplier datasets; representativeness assessment; sensitivity analysis; epd-international-pcr-2024-03-apparel"
    - id: dq_completeness
      applies_to: "Product system"
      requirement: "Demonstrate at least 99% product-content mass and energy coverage and screen exclusions for environmental relevance."
      evidence: "mass and energy reconciliation; exclusion register; sensitivity or expert review; epd-international-pcr-2024-03-apparel"
    - id: dq_measurement
      applies_to: "Mass, energy, water, emissions, and waste"
      requirement: "Identify instrument, calibration status, unit, sampling frequency, detection limit where applicable, missing-data treatment, and aggregation method."
      evidence: "calibration certificates; laboratory QA; meter and sampling logs; iso-14048-2002"
    - id: dq_allocation
      applies_to: "Shared processes"
      requirement: "Retain the subdivision attempt, causal relationship, driver values, allocated totals, and sensitivity analysis for any fallback allocation."
      evidence: "allocation worksheet; meter reconciliation; sensitivity analysis; epd-international-pcr-2024-03-apparel"
    - id: dq_waste_route
      applies_to: "All wastes and recovered materials"
      requirement: "Identify composition, mass basis, destination, treatment, carrier, and end-of-waste evidence; do not assume recycling from collection alone."
      evidence: "transfer note; weighbridge record; treatment receipt; end-of-waste evidence"
    - id: dq_uncertainty_and_gaps
      applies_to: "Dataset as published"
      requirement: "Disclose unresolved UUIDs, proxy data, estimates, missing periods, exclusions, mass/energy imbalance, and sensitivity results."
      evidence: "quality disclosure and review record; iso-14044-2006; iso-14048-2002"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Product identity"
    rule: "Fail if the canonical PCR id, CPC 28225 context, garment type, knitted/crocheted construction, fibre composition, size basis, net mass, colour/finish, route, site, or reporting period is missing."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: validate_reference_flow
    applies_to: "Quantitative reference"
    rule: "Fail unless the normalized reference output is exactly 1 kg net accepted garment using flow 4de987ca-f5f5-4001-a465-07f12ef9775f, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_packaging_separation
    applies_to: "Packaging"
    rule: "Fail if packaging mass is included in net reference-product mass or if packaging is not reported separately by material."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: validate_required_processes
    applies_to: "Process coverage"
    rule: "Fail if receipt/preparation, cutting, garment assembly, or quality/packaging is absent. Require a declared applicability decision for garment wet finishing and on-site wastewater treatment."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: validate_material_balance
    applies_to: "Mass-based processes"
    rule: "Fail if inputs, accepted outputs, wastes, returns, and inventory change do not reconcile within the declared measurement uncertainty or if an unexplained imbalance is hidden by normalization."
    source_ids:
      - mass-balance-identity
      - iso-14048-2002
  - rule_id: validate_energy_and_water
    applies_to: "Utilities"
    rule: "Fail if an included foreground operation lacks metered or documented utility data, or if shared utilities are allocated without meter reconciliation and a disclosed causal driver."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: validate_waste_and_emissions
    applies_to: "Wastes, wastewater, and direct emissions"
    rule: "Fail if foreground wastes lack composition and disposition, or if applicable wastewater/direct emissions are omitted, aggregated across incompatible compartments, or assigned unsupported treatment credits."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: validate_completeness
    applies_to: "Product system"
    rule: "Fail if the dataset cannot demonstrate 99% product-content mass and energy coverage or does not document and assess cut-offs."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: validate_allocation
    applies_to: "Shared processes"
    rule: "Fail if allocation bypasses subdivision without justification, lacks a defensible physical relationship, or uses economic allocation without reporting-period values and sensitivity analysis."
    source_ids:
      - epd-international-pcr-2024-03-apparel
      - iso-14044-2006
  - rule_id: validate_upstream_links
    applies_to: "Purchased inputs and services"
    rule: "Fail if main fabric, other main materials, packaging, energy, transport, or off-site treatment is treated as burden-free or linked to an unassessed generic/proxy dataset."
    source_ids:
      - epd-international-pcr-2024-03-apparel
      - ec-pef-method-2021-2279
  - rule_id: validate_data_quality_disclosure
    applies_to: "Published foreground dataset"
    rule: "Fail if the time period, geography, technology, supplier-specific/generic/proxy status, measurement methods, allocation, cut-offs, uncertainty, and unresolved identity references are not disclosed."
    source_ids:
      - epd-international-pcr-2024-03-apparel
      - iso-14048-2002
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for finished knitted or crocheted T-shirts, singlets, and other vests"
  downstream_use: "secondary_dataset; background_dataset for product systems that require the garment-manufacturing stage; source for downstream process and lifecyclemodel projections"
  allowed_use: "Garment-manufacturing LCI, supplier-specific or representative production modelling, hotspot analysis, and connection to separately modelled upstream fabric and downstream distribution/use/end-of-life stages"
  excluded_use: "Claiming a complete cradle-to-grave apparel result without connected upstream and downstream stages; comparison across garments with different function, lifetime, performance, composition, or care scenario without functional equivalence; use as a fabric-production dataset"
  required_metadata: "PCR id and version state; product and flow identity; composition; construction; size basis; net unit mass; colour/finish; included route; site and geography; reporting period; reference UUIDs; upstream dataset identities; allocation; cut-offs; data sources"
  required_quality_disclosure: "specific, selected-generic, and proxy data shares; measurement and sampling methods; temporal, geographical, and technological representativeness; mass and energy closure; waste routes; assumptions; uncertainty; sensitivity; unresolved UUIDs and range-evidence gaps"
  update_trigger: "Change in product construction, composition, supplier route, technology, site, energy supply, wet-processing recipe, waste treatment, allocation, or data period that materially changes an inventory amount or any declared environmental result; correct errors and refresh stale upstream datasets"
data_sources:
  - id: "epd-international-pcr-2024-03-apparel"
    type: "standard"
    reference: "International EPD System, PCR 2024:03, Apparel, except fur and leather apparel, version 1.0.0, 2024-05-28, valid to 2028-05-28. https://www.environdec.com/pcr-library/pcr_fe5934d8-029d-4c48-19ea-08db3f138c24 (PDF: https://api.prod.environdec.com/api/v2/EPDLibrary/Files/e91dc7c8-2c6c-4f16-e74f-08dc7a67eb3e/Data), retrieved 2026-07-30."
    used_for: "CPC 282 scope; functional-use qualifiers; upstream/core/downstream process coverage; quality control, packaging, waste and wastewater inclusion; 99% completeness; allocation hierarchy; specific-data and disclosure rules"
  - id: "ec-pef-method-2021-2279"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279, Annex I, Product Environmental Footprint Method. https://environment.ec.europa.eu/document/download/680503dc-5a19-4f6a-bb92-84d9bfc8f312_en?filename=Annexes+1+to+2.pdf, retrieved 2026-07-30."
    used_for: "Lifecycle scope, material/emission/waste modelling, inventory compilation, reproducibility, verification, and connection of foreground datasets to full product footprints"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management - Life cycle assessment - Requirements and guidelines, confirmed 2022, with Amendments 1:2017 and 2:2020. https://www.iso.org/standard/38498.html, retrieved 2026-07-30."
    used_for: "LCI goal and scope, inventory, allocation, interpretation, reporting, review, and limitation principles"
  - id: "iso-14048-2002"
    type: "standard"
    reference: "ISO/TS 14048:2002, Environmental management - Life cycle assessment - Data documentation format. https://www.iso.org/standard/29872.html, retrieved 2026-07-30."
    used_for: "Transparent documentation of data collection, calculation, data quality, units, sampling, and review evidence"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation-of-mass identity applied to measured foreground inputs, outputs, wastes, returns, and inventory change; no external numeric factor."
    used_for: "Reference normalization, material consumption, cutting reconciliation, and mass-balance validation"
