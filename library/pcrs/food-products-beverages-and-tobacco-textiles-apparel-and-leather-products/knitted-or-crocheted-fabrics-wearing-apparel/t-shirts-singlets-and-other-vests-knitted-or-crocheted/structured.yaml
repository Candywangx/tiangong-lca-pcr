allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Shared foreground operations"
    rule: "Avoid allocation first by subdividing processes, metering product lines, batches, equipment, utilities, and waste streams separately, or expanding data collection so the target product's inventory is directly observed."
    source_ids:
      - epd-international-pcr-2024-03-apparel
      - iso-14044-2006
  - rule_id: allocation_physical_relation
    applies_to: "Unavoidable shared-process burdens"
    rule: "When subdivision is not possible, partition burdens using a documented physical relationship that changes with the delivered co-products, such as measured process time, machine demand, or causal mass throughput; do not select mass solely because it is convenient."
    source_ids:
      - epd-international-pcr-2024-03-apparel
      - iso-14044-2006
  - rule_id: allocation_economic_fallback
    applies_to: "Shared processes without a defensible physical relation"
    rule: "Economic allocation is a last fallback. Use reporting-period values, disclose prices and currency basis, and perform a sensitivity analysis showing the effect of the allocation choice."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: allocation_waste_polluter_pays
    applies_to: "Manufacturing wastes and recovered materials"
    rule: "Assign waste processing to the product system that generated the waste until documented end-of-waste criteria are met. Do not award an avoided-burden credit inside this foreground dataset."
    source_ids:
      - epd-international-pcr-2024-03-apparel
  - rule_id: allocation_scrap_classification
    applies_to: "Cutting scrap, rejects, and reusable remnants"
    rule: "Treat material as waste unless a documented market, technical specification, legal compliance, and safe intended use demonstrate that it has ceased to be waste; disclose any co-product treatment and allocation."
    source_ids:
      - epd-international-pcr-2024-03-apparel
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_balance
      process_id: "material_receipt_preparation_garment_assembly"
      flow_role: "fabric, thread, trim, accessory receipts and issues"
      record_type: "warehouse receipts, issue notes, returns, stock counts, specifications"
      raw_fields: "material id; supplier; composition; wet-processing state; opening stock; receipts; issues; returns; closing stock; mass"
      collection_method: "calibrated scales plus inventory reconciliation"
      unit: "kg"
      frequency: "per receipt and production order; monthly stock close"
      temporal_coverage: "same representative reporting period as core production"
      site_scope: "all foreground sites and outsourced operations under control"
      aggregation_rule: "opening + receipts - returns - closing, assigned to declared products using traceable order records"
      quality_evidence: "scale calibration; stock reconciliation; supplier specification; unexplained variance log"
    - protocol_id: cp_transport_records
      process_id: "material_receipt_preparation"
      flow_role: "inbound freight"
      record_type: "bills of lading, route records, carrier records"
      raw_fields: "material mass; origin; destination; distance; mode; vehicle; load factor; empty return; dataset inclusion flag"
      collection_method: "supplier/carrier records and documented route calculation"
      unit: "kg; km; tkm"
      frequency: "per delivery"
      temporal_coverage: "reporting period aligned with material receipts"
      site_scope: "all main-material routes"
      aggregation_rule: "sum mass x distance without double counting transport already embedded upstream"
      quality_evidence: "invoices; route evidence; load assumptions"
    - protocol_id: cp_cutting_records
      process_id: "cutting"
      flow_role: "fabric input, cut components, off-cuts and rejects"
      record_type: "lay, marker, cutting-order, issue, output, and waste records"
      raw_fields: "product id; fabric id; issue mass; returned mass; cut-component mass; off-cut mass; reject mass; marker/lay id"
      collection_method: "calibrated scales and cutting-order reconciliation"
      unit: "kg"
      frequency: "per cutting order"
      temporal_coverage: "representative production period"
      site_scope: "every cutting site in scope"
      aggregation_rule: "reconcile issued fabric to accepted components, returned material, waste, and inventory change"
      quality_evidence: "scale calibration; mass-balance closure; signed order completion"
    - protocol_id: cp_energy_records
      process_id: "cutting_garment_assembly_garment_wet_finishing_quality_packaging_onsite_wastewater_treatment"
      flow_role: "electricity, fuel, steam and heat"
      record_type: "meters, invoices, equipment logs, production hours"
      raw_fields: "meter id; start/end reading; energy carrier; quantity; unit; equipment or line; runtime; product order"
      collection_method: "submetering preferred; documented causal allocation otherwise"
      unit: "kWh; MJ; carrier reference unit"
      frequency: "continuous or per shift; monthly reconciliation"
      temporal_coverage: "same period for all core processes"
      site_scope: "each site and relevant line"
      aggregation_rule: "sum metered consumption and allocate only residual shared use with disclosed driver"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_wet_finishing_records
      process_id: "garment_wet_finishing"
      flow_role: "water, recipe chemicals, utilities, wastewater and residues"
      record_type: "batch sheets, recipes, meters, stock records, discharge logs"
      raw_fields: "batch id; garment input/output mass; water; chemical name/concentration/mass; energy; wastewater volume; residues"
      collection_method: "batch records plus calibrated meters and stock reconciliation"
      unit: "kg; m3; kWh; MJ"
      frequency: "per batch; monthly reconciliation"
      temporal_coverage: "same period as finished output"
      site_scope: "each wet-finishing site and technology"
      aggregation_rule: "aggregate declared batches and normalize to accepted conditioned output"
      quality_evidence: "meter calibration; recipe approval; chemical SDS/specification; mass and water balance"
    - protocol_id: cp_production_output
      process_id: "garment_assembly_garment_wet_finishing_quality_packaging"
      flow_role: "accepted, rejected, reworked and transferred garments"
      record_type: "production orders, acceptance logs, scale records, quality records"
      raw_fields: "product id; size; count; net mass; moisture condition; accepted; rejected; reworked; transfer destination"
      collection_method: "calibrated scale and quality-system record"
      unit: "count; kg"
      frequency: "per batch or order"
      temporal_coverage: "representative production period"
      site_scope: "all foreground production sites"
      aggregation_rule: "production-volume-weighted aggregation by product and size stratum"
      quality_evidence: "scale calibration; acceptance criteria; rework trace"
    - protocol_id: cp_packaging_records
      process_id: "quality_packaging"
      flow_role: "consumer and distribution packaging"
      record_type: "bills of material, issue/return logs, supplier specifications"
