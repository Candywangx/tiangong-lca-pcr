measurement_rules:
  - id: reference_product_mass
    applies_to: "Reference product and all mass-normalized results"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure net accepted garment mass after final conditioning and before packaging. Normalize the foreground inventory to exactly 1 kg net finished garment."
  - id: packaging_mass_separation
    applies_to: "Consumer and distribution packaging"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure packaging separately by material. Do not include packaging mass in the 1 kg reference product."
  - id: item_to_mass_conversion
    applies_to: "Records available only as garment counts"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert counts using measured net mass by product and size stratum from the same reporting period; retain sample counts, weighing method, mean mass, and variability."
  - id: mass_composition_closure
    applies_to: "Fibre, trim, accessory, and product content declarations"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg and mass %"
    rule: "Report composition on a consistent net-product basis and reconcile declared constituent masses to the measured net garment mass."
