      unit: "kg"
      frequency: "Each container removal"
      temporal_coverage: "Dataset reporting period"
      site_scope: "Included drawing, spinning, suction and winding equipment"
      aggregation_rule: "Sum net captured-fibre waste and divide by accepted yarn mass for the matched period"
      quality_evidence: "Scale record; container label; waste transfer or reuse record"
  calculation_rules:
    - id: calc_normalize_inventory
      applies_to: "Every foreground inventory row"
      rule: "Divide the matched-period net flow quantity by accepted net yarn mass on the same moisture basis; retain raw quantities and period links."
      inputs:
        - "net flow quantity"
        - "accepted yarn mass"
      output: "flow quantity per kg accepted yarn"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_material_reconciliation
      applies_to: "Material inputs and outputs"
      rule: "Compare net sliver plus net lubricant against accepted yarn plus captured fibre waste. Disclose the unreconciled difference and add separately identified atomic flows when records show another material output."
      inputs:
