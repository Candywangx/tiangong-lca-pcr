      frequency: "Each issue or production lot"
      temporal_coverage: "Dataset reporting period"
      site_scope: "Included spinning equipment and yarn product"
      aggregation_rule: "Sum issued minus returned mass, then divide by accepted yarn mass"
      quality_evidence: "Issue record; return record; safety data sheet"
    - protocol_id: cp_yarn_mass
      process_id: "sliver_to_yarn_spinning"
      flow_role: "Finished conforming yarn output"
      record_type: "Production and quality release record"
      raw_fields: "lot_id; gross_mass_kg; package_tare_kg; rejected_mass_kg; accepted_mass_kg; moisture_basis; yarn_count; twist"
