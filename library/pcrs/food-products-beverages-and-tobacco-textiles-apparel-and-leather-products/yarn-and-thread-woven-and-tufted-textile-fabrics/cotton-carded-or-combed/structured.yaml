allocation_rules:
  - rule_id: alloc_subdivide_first
    applies_to: "multi_route_and_multi_fibre_production"
    rule: "Avoid allocation by subdividing carded and combed routes, materially different cotton fibre types/origins, and separately metered operations. Retain the disaggregated foreground records."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_internal_return
    applies_to: "internally_returned_fibre"
    rule: "Treat fibre returned to the same production system as an internal loop: subtract it from gross waste and do not create a second product or avoided-burden credit. Record loop mass and any additional processing energy."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_noils_status
    applies_to: "comber_noils_and_recovered_fibre"
    rule: "Determine and document product or waste status from the actual transaction, function, and destination. Use mutually exclusive inventory rows and do not count the same mass as both product and waste."
    source_ids:
      - osha-1910-262-textiles
      - eu-pef-2021-2279
  - rule_id: alloc_physical_then_economic
    applies_to: "inseparable_coproducts"
    rule: "When subdivision cannot resolve burdens, use a documented physical relationship only when it reflects the causal process. Otherwise use economic allocation based on a consistent representative price period and disclose a sensitivity result. Never use an unexplained fixed split."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_shared_services
    applies_to: "electricity_hvac_dust_collection_and_packaging"
    rule: "Allocate shared services with causal drivers such as metered consumption, equipment power and runtime, airflow, processed mass, or packaging bill of materials. Production mass alone is allowed only when no better driver exists and its limitation is disclosed."
    source_ids:
      - eu-pef-2021-2279
      - eu-jrc-txt-bref-2023
  - rule_id: alloc_recycling_boundary
    applies_to: "recovered_inputs_and_outputs"
    rule: "Record recovered cotton inputs and recovered outputs at the foreground boundary without an avoided-burden credit. A broader life-cycle study may apply its declared recycling method outside this gate-to-gate dataset, with no double counting."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_mass_quality
      process_id: "receiving_conditioning"
      flow_role: "cotton feedstock and conditioned transfer"
      record_type: "scale ticket; bale/lot record; moisture test; supplier/classing certificate"
      raw_fields: "lot id; bale ids; route destination; fibre type/origin; virgin/recycled status; input presentation; gross/tare/net mass; moisture; commercial-mass rule; grade/specification; quality fields"
      collection_method: "calibrated scale plus documented sampling/testing method"
      unit: "kg; %; declared quality units"
      frequency: "every received lot and transfer"
      temporal_coverage: "same production period as reference output"
      site_scope: "all feedstock lots contributing to the dataset"
      aggregation_rule: "retain lot-level strata; aggregate only within equivalent route/fibre-type/mass-basis strata"
      quality_evidence: "calibration; sampling plan; chain of custody; supplier/classing record; moisture method"
    - protocol_id: cp_opening_route_records
      process_id: "opening_cleaning_blending"
      flow_role: "opened cotton and rejects"
      record_type: "production order; feeder/scale record; waste ticket"
      raw_fields: "lot ids; equipment line; fibre type/origin; destination route; input mass; opened output mass; reject mass; internal return; runtime"
      collection_method: "reconcile line records and calibrated mass measurements"
      unit: "kg; h"
      frequency: "each lot or production order"
      temporal_coverage: "same production period as reference output"
      site_scope: "every included opening/cleaning line"
      aggregation_rule: "mass-weight only equivalent strata; keep carded/combed destinations and fibre types separate"
      quality_evidence: "calibration; route traceability; material reconciliation; waste destination"
    - protocol_id: cp_carding_drawing_records
      process_id: "carding_drawing"
      flow_role: "carded output/intermediate and card waste"
      record_type: "production order; can/sliver mass; machine record; waste ticket"
      raw_fields: "lot id; card/drawing line; destination route; fibre type/origin; input; output; internal return; waste class; runtime; quality checks"
      collection_method: "calibrated mass records reconciled to machine/transfer records"
      unit: "kg; h; declared quality units"
      frequency: "each lot or production order"
      temporal_coverage: "same production period as reference output"
      site_scope: "all included carding and drawing lines"
      aggregation_rule: "retain route/fibre-type strata; do not treat combing intermediate as a second final product"
      quality_evidence: "calibration; mass balance; line traceability; quality record"
    - protocol_id: cp_combing_records
      process_id: "combing_preparation"
      flow_role: "combed output, recovered noils product, or noils waste"
      record_type: "production order; lap/sliver records; scale ticket; destination document"
      raw_fields: "originating card lot; fibre type/origin; input mass; combed output; noils; other rejects; product/waste status; destination; runtime; quality checks"
      collection_method: "reconcile combing-line mass and transfer records"
      unit: "kg; h; declared quality units"
      frequency: "each combed lot"
      temporal_coverage: "same production period as reference output"
      site_scope: "all included combing preparation, combing, and post-drawing equipment"
      aggregation_rule: "no carded-route aggregation; recovered noils product and waste rows are mutually exclusive"
      quality_evidence: "calibration; lot linkage; mass balance; destination/status evidence; quality record"
    - protocol_id: cp_energy_and_services
      process_id: "opening_cleaning_blending_carding_drawing_combing_preparation_site_services_packaging"
      flow_role: "equipment and shared energy"
      record_type: "meter; invoice; equipment power/runtime; fuel record"
      raw_fields: "meter id; carrier; start/end readings; losses; generation; grid/supplier mix; equipment power; runtime; served process; allocation driver"
      collection_method: "submeter preferred; otherwise documented causal engineering allocation"
      unit: "kWh; MJ; native fuel unit"
      frequency: "continuous or shift readings; monthly invoice reconciliation"
      temporal_coverage: "representative period aligned to product records"
      site_scope: "all equipment and shared services inside boundary"
      aggregation_rule: "assign directly first; allocate residual shared use causally; keep route/fibre-type strata"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet; conversion factor source"
    - protocol_id: cp_waste_and_dust_records
      process_id: "opening_cleaning_blending_carding_drawing"
      flow_role: "rejects, captured fibre, and dust"
      record_type: "scale; collection-container log; waste transfer ticket"
      raw_fields: "source process; material class; gross/tare/net mass; internal return; product recovery; waste destination; moisture basis"
      collection_method: "weigh each removal or representative container with reconciliation"
      unit: "kg"
      frequency: "each removal or shift; monthly reconciliation"
      temporal_coverage: "same production period as reference output"
      site_scope: "every included line and dust collector"
      aggregation_rule: "internal returns netted once; external destinations kept separate"
      quality_evidence: "scale calibration; container tare; transfer documentation; material classification"
    - protocol_id: cp_water_auxiliary_packaging
      process_id: "site_services_packaging"
      flow_role: "water, auxiliaries, product packaging, and packaging waste"
      record_type: "meter; purchase record; formulation; bill of materials; shipment; waste ticket"
      raw_fields: "water readings; auxiliary identity and mass; packaging material and mass; reusable cycles; shipped mass; packaging waste and destination"
      collection_method: "direct meter/weight or purchase-stock reconciliation"
      unit: "kg; m3; item count"
      frequency: "per lot when possible; monthly reconciliation"
      temporal_coverage: "representative period aligned to product records"
      site_scope: "all included utilities and packaging"
      aggregation_rule: "material-specific balance; causal allocation to served routes/products"
      quality_evidence: "meter/scale calibration; invoice; stock balance; bill of materials; waste ticket"
    - protocol_id: cp_environmental_dust_release
      process_id: "site_services_packaging"
      flow_role: "environmental particulate release"
      record_type: "stack/fugitive test; airflow; collector record; maintenance log"
      raw_fields: "release point; method; concentration; airflow; duration; capture efficiency; inlet/outlet loading; downtime; served process; occupational-monitoring flag"
      collection_method: "approved environmental emission method or documented mass balance; occupational samples retained separately"
      unit: "kg; mg/m3; m3/h; h"
      frequency: "legally required interval and after material process/control change; otherwise representative campaign"
      temporal_coverage: "same production period as reference output"
      site_scope: "all relevant release points and fugitive routes"
      aggregation_rule: "calculate release by route/fibre-type operating share only with documented causal data"
      quality_evidence: "method report; calibration; detection limit; airflow record; collector inspection; explicit non-use of occupational PEL as emission factor"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground amounts"
      rule: "normalized amount = stratum amount / delivered reference-product mass on the same declared mass basis"
      inputs:
        - "route/fibre-type amount"
        - "delivered output mass"
        - "moisture/commercial-mass conversion"
      output: "amount per 1 kg reference product"
      source_ids:
        - iso-6741-1-1989
    - id: calc_process_mass_balance
      applies_to: "each material process"
      rule: "input cotton + other mass inputs = good transfer/output + externally transferred coproducts + wastes + measured releases + documented inventory change; report residual separately"
      inputs:
        - "calibrated input/output/waste masses"
        - "moisture basis"
        - "stock change"
      output: "process residual and reconciliation percentage"
      source_ids: []
    - id: calc_route_energy
      applies_to: "equipment and shared energy"
      rule: "direct meter assignment first; residual shared energy = shared total × documented causal driver share"
      inputs:
        - "meter readings"
        - "runtime/power/airflow or other causal driver"
        - "output mass by stratum"
      output: "kWh or MJ per route/fibre-type stratum"
      source_ids:
        - eu-pef-2021-2279
        - eu-jrc-txt-bref-2023
    - id: calc_noils_allocation
      applies_to: "recovered noils product"
      rule: "after subdivision, allocated burden follows the documented physical causal relationship; if none is defensible, use consistent-period economic values and report sensitivity"
      inputs:
        - "process burdens"
        - "good output/noils masses"
        - "causal parameter or representative prices"
      output: "allocated burden by product output"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_particulate_release
      applies_to: "direct cotton particulate to air"
      rule: "released mass = measured concentration × dry or actual airflow × operating time with method-consistent unit and condition corrections; alternatively use validated collector inlet/outlet mass balance"
      inputs:
        - "environmental concentration"
        - airflow
        - duration
        - "condition corrections"
        - "capture records"
      output: "kg particulate released"
      source_ids:
        - osha-1910-1043-cotton-dust
        - eu-jrc-txt-bref-2023
    - id: calc_weighted_additional_view
      applies_to: "optional portfolio result"
      rule: "additional weighted result = sum(disaggregated stratum inventory × stratum delivered mass) / total delivered mass for the stated period"
      inputs:
        - "separate carded/combed and fibre-type datasets"
        - "delivered masses"
        - period
      output: "optional production-weighted view"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Confirm product is cotton, carded or combed, prepared for spinning, and not yarn, blend, cotton waste, or garnetted stock; declare presentation and market classification."
      evidence: "product specification; invoice; classification review; lot photograph or inspection record"
    - id: dq_route
      applies_to: "production route"
      requirement: "Retain a process map and production records that distinguish carded and combed routes and show every conditional operation actually performed."
      evidence: "production order; equipment list; route diagram; line record"
    - id: dq_fibre_type
      applies_to: "cotton feedstock and output"
      requirement: "Identify fibre type/origin and keep materially different Upland, extra-long-staple/Pima, virgin, and reclaimed/recycled strata separate."
      evidence: "supplier/classing certificate; bale/lot identity; recovered-content chain of custody"
    - id: dq_measurement
      applies_to: "mass, energy, water, waste, and emissions"
      requirement: "Use calibrated instruments or documented reconciliation; retain raw readings, detection limits, conversion factors, and mass basis."
      evidence: "calibration certificate; meter/scale records; laboratory or emission report; calculation worksheet"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Use a representative continuous production period or enough lots to cover routine variability; disclose start/end dates, shutdowns, abnormal events, and sample coverage."
      evidence: "production calendar; lot list; meter coverage; exception log"
    - id: dq_completeness
      applies_to: "process and flow coverage"
      requirement: "Reconcile cotton mass through every included process and account for energy, water/auxiliaries when used, packaging, recovered products, wastes, captured dust, and direct releases."
      evidence: "mass balance; utility reconciliation; waste tickets; emission inventory; completeness checklist"
    - id: dq_geography_technology
      applies_to: "upstream and foreground data"
      requirement: "Match facility geography, grid/fuel supply, carding/combing technology, dust control, and fibre type; disclose all proxies and their limitations."
      evidence: "site metadata; equipment list; supplier data; dataset metadata; proxy justification"
    - id: dq_range_replacement
      applies_to: "provisional reasoned estimates"
      requirement: "Treat every reasoned_estimate range only as a temporary screen. Replace it when reviewed route/fibre-type foreground lots, audited supplier data, or a stronger official/peer-reviewed quantitative source becomes available; retain the former range only in review history."
      evidence: "review record; replacement source; version diff; representative lot analysis"
    - id: dq_source_limits
      applies_to: "external evidence"
      requirement: "Preserve source scope: CPC supports classification only; BREF supports descriptive process candidates and environmental relevance but not a CPC-specific BAT claim; OSHA supports equipment/dust controls and occupational monitoring but not environmental emission factors; USDA fields are quality descriptors, not universal product limits."
      evidence: "source-use matrix; modelling notes; reviewer sign-off"
    - id: dq_atomic_flows
      applies_to: "process inventory"
      requirement: "Confirm that no inventory row combines multiple energy carriers, waters, chemicals, packaging materials, products, wastes, wastewaters, residues, or emissions. Every applicable onsite fuel, steam/heat carrier, named auxiliary, refrigerant makeup, wastewater stream, and packaging material omitted from this generic PCR must be added as its own conditional foreground row before conformance is claimed."
      evidence: "atomic-flow audit; flow mapping register; collection protocol; UUID status register"
validation_rules:
  - rule_id: val_reference_uuid
    applies_to: "reference_flow"
    rule: "Confirm product flow UUID 93976740-418a-40e3-8901-dbc34f0acdc6, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg; fail if substituted or version text is stored as part of a UUID."
    source_ids: []
  - rule_id: val_required_qualifiers
    applies_to: "dataset_identity"
    rule: "Fail completeness when route, presentation, fibre type/origin, moisture/mass basis, site, technology, period, or product/waste status is missing."
    source_ids:
      - un-cpc-3-2025
      - usda-ams-cotton-classing
      - iso-6741-1-1989
  - rule_id: val_route_separation
    applies_to: "process_inventory"
    rule: "Confirm combing processes, energy, and noils appear only for route=combed; confirm carded and combed records are not unconditionally averaged."
    source_ids:
      - eu-jrc-txt-bref-2023
      - osha-1910-262-textiles
  - rule_id: val_fibre_separation
    applies_to: "process_inventory"
    rule: "Confirm materially different cotton fibre types/origins are separate or that a documented materiality assessment justifies aggregation; a generic category average without retained strata fails."
    source_ids:
      - usda-ams-cotton-classing
      - eu-pef-2021-2279
  - rule_id: val_mass_basis
    applies_to: "mass_inventory"
    rule: "Confirm all cotton, noils, and waste masses use one declared moisture/commercial-mass basis or carry traceable conversions."
    source_ids:
      - iso-6741-1-1989
  - rule_id: val_mass_balance
    applies_to: "each_process_and_total"
    rule: "Reconcile each process and total route; report residual and investigate material imbalance instead of forcing it to zero by changing the reference output."
    source_ids: []
  - rule_id: val_energy_no_double_count
    applies_to: "energy_inventory"
    rule: "Confirm equipment electricity and shared services cover the same production period and are not double counted; retain causal allocation evidence."
    source_ids:
      - eu-pef-2021-2279
      - eu-jrc-txt-bref-2023
  - rule_id: val_noils_exclusivity
    applies_to: "coproduct_and_waste_inventory"
    rule: "Confirm comber noils mass is reported as recovered product or waste, not both, and that any allocation method follows the declared hierarchy."
    source_ids:
      - eu-pef-2021-2279
      - osha-1910-262-textiles
  - rule_id: val_dust_evidence
    applies_to: "cotton_dust_and_particulate"
    rule: "Confirm captured dust and direct releases are separately reported. Reject conversion of occupational concentration or PEL into environmental emission mass without airflow, duration, and release-point evidence."
    source_ids:
      - osha-1910-1043-cotton-dust
  - rule_id: val_reasoned_estimates
    applies_to: "quantitative_ranges"
    rule: "Confirm every reasoned estimate is labelled provisional, is not treated as an allowed or typical industry interval, is applied only to its stated route/fibre-type stratum, and has a replacement trigger."
    source_ids: []
  - rule_id: val_source_scope
    applies_to: "modelling_claims"
    rule: "Confirm no source is used beyond its stated purpose and limitation and that source ids resolve to the Data Sources table."
    source_ids: []
  - rule_id: val_atomic_flows
    applies_to: "process_inventory"
    rule: "Fail when an inventory row is a collection or category pseudo-flow, including combined energy carriers, water-and-chemicals, wastewater-and-residues, generic packaging, or grouped emissions. Confirm every row has one flow name, direction, flow type, quantity basis, unit, value/formula/rule, range/uncertainty statement, collection protocol or data source id, source/status, and confirmed or unresolved UUID status."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "route-, fibre-type-, technology-, site-, and period-specific foreground production dataset for cotton, carded or combed"
  downstream_use: "may be published as a secondary_dataset or background_dataset after methodology review, UUID completion, source review, representative foreground collection, and independent quality checks"
  allowed_use: "supply-chain and life-cycle models needing prepared cotton fibre at the spinning-mill gate; scenario comparison within the same declared route, fibre type/origin, mass basis, geography, technology, allocation, and boundary"
  excluded_use: "unconditional global or category average; proxy for raw/ginned cotton, cotton waste, blended staple fibre, yarn, fabric, or finished textiles; comparison across unmatched moisture bases or fibre types; legal compliance claim; environmental claim based only on occupational dust data"
  required_metadata: "canonical PCR id; product UUID; CPC context; route; presentation; fibre type/origin; recycled-content method; quality specification; moisture/commercial-mass basis; site/geography; technology; period; process coverage; allocation; upstream datasets/proxies; packaging; dust-control configuration; product/co-product/waste status"
  required_quality_disclosure: "lot and production coverage; meter/scale coverage and calibration; mass-balance residuals; route/fibre-type stratification; allocation drivers; source limitations; unresolved UUIDs; proxy use; provisional reasoned estimates and replacement status; environmental versus occupational dust evidence"
  update_trigger: "change in product identity or classification; carded/combed route or equipment; cotton fibre type/origin mix; recycled-feedstock preparation; moisture/mass convention; material yield; energy or dust-control system; allocation or product/waste status; packaging; representative period; Tiangong UUID; or availability of stronger quantitative evidence"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, *Central Product Classification (CPC) Version 3.0, Explanatory Notes*, 30 June 2025, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-12)"
    used_for: "official category title and hierarchy: section 26, group 261, subclass 26160; it supplies no route-level inventory quantities"
  - id: "eu-jrc-txt-bref-2023"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Roth et al., *Best Available Techniques (BAT) Reference Document for the Textiles Industry*, EUR 31392 EN, 2023, https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2023-01/TXT_BREF_2023_for_publishing%20ISSN%201831-9424_final_1_revised.pdf (retrieved 2026-08-12)"
