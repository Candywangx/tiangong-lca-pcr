product_category_identity:
  canonical_pcr_id: "pcr.food-products-beverages-and-tobacco-textiles-apparel-and-leather-products.yarn-and-thread-woven-and-tufted-textile-fabrics.cotton-carded-or-combed"
  classification_refs: "CPC 3.0: 26160, Cotton, carded or combed, exact generic reference; classification remains subject to the declared physical state and market presentation"
  covered_products: "100% cotton fibre outputs that are carded or combed and prepared for spinning; virgin Upland and extra-long-staple/Pima cotton; reclaimed/recycled cotton only when classification as CPC 26160 is confirmed"
  excluded_products: "raw or merely ginned cotton; cotton linters; cotton waste or garnetted stock sold as such; man-made staple fibre; cotton/man-made-fibre blends; roving; yarn; thread; fabric; finished textile products"
  representative_product: "one declared lot of cotton prepared for spinning, reported separately as carded or combed and by cotton fibre type/origin"
  production_route: "receiving and conditioning; opening, cleaning, and lot-specific blending; carding; drawing when part of the delivered state; for combed output only, lap/sliver preparation, combing, and post-combing drawing; attributable suction, dust collection, humidification, internal handling, inspection, and packaging"
  market_state: "dry prepared cotton fibre at the reporting facility gate, not spun; presentation, moisture or commercial mass basis, packaging, route, and fibre type/origin declared"
functional_unit:
  what: "cotton fibre separated, cleaned, aligned, and prepared for subsequent spinning by a declared carded or combed route"
  how_much: "1 kg of delivered product on the declared measured or commercial mass basis"
  how_well: "conforms to the declared route, cotton fibre type/origin, presentation, moisture or regain convention, lot specification, and applicable quality attributes"
  how_long_or_cycle: "one production lot at the facility gate; no service-life duration applies"
  reference_flow_link: "the reference product is the final saleable carded or combed cotton output of the declared route, after attributable losses and before spinning"
system_boundary:
  rules:
    - rule_id: sb_foreground_gate
      applies_to: "foreground_system"
      rule: "Include all on-site operations attributable to the saleable prepared-cotton output from declared receiving condition through opening/cleaning/blending, carding, route-required drawing, conditional combing preparation and combing, suction and dust collection, internal transfer, quality control, and packaging."
      source_ids:
        - un-cpc-3-2025
        - eu-jrc-txt-bref-2023
        - osha-1910-262-textiles
    - rule_id: sb_route_condition
      applies_to: "production_route"
      rule: "Carding is required for both declared routes. Include lap/sliver preparation, combing, and post-combing drawing only for a combed output; do not assign combing losses or energy to a carded output."
      source_ids:
        - eu-jrc-txt-bref-2023
        - osha-1910-262-textiles
    - rule_id: sb_fibre_condition
      applies_to: "fibre_type_origin"
      rule: "Model materially different cotton fibre types and virgin versus reclaimed/recycled feedstocks as separate foreground strata. Do not use an unconditional average across them."
      source_ids:
        - usda-ams-cotton-classing
        - eu-pef-2021-2279
    - rule_id: sb_recycled_route
      applies_to: "reclaimed_recycled_cotton"
      rule: "Include onsite sorting, cutting, tearing, willowing, garnetting, or additional cleaning only when performed and when the delivered product classification is confirmed. Report off-site preparation through an upstream dataset."
      source_ids:
        - osha-1910-1043-cotton-dust
        - osha-1910-262-textiles
        - un-cpc-3-2025
    - rule_id: sb_upstream_exclusion
      applies_to: "upstream_supply"
      rule: "Exclude cultivation, harvesting, ginning, transport to the facility, and off-site recycled-feedstock preparation from the foreground gate-to-gate process, but require explicit upstream product flows/datasets when a downstream life-cycle model is built."
      source_ids:
        - un-cpc-3-2025
        - eu-pef-2021-2279
    - rule_id: sb_downstream_exclusion
      applies_to: "downstream_operations"
      rule: "Exclude roving, spinning, twisting, winding, wet pretreatment, dyeing, printing, finishing, fabric manufacture, distribution, use, and end of life unless a broader study adds them as separately identified downstream processes."
      source_ids:
        - eu-jrc-txt-bref-2023
        - un-cpc-3-2025
    - rule_id: sb_dust_and_waste
      applies_to: "emissions_and_waste"
      rule: "Include captured fibre/trash/dust, direct particulate releases, noils, packaging waste, and treatment routes. Keep occupational exposure measurements separate from environmental emission inventory."
      source_ids:
        - osha-1910-1043-cotton-dust
        - eu-jrc-txt-bref-2023
    - rule_id: sb_atomic_flows
      applies_to: "all_inventory_rows"
      rule: "Represent each material, energy carrier, named chemical, product, waste, and elementary release as one atomic flow row. Electricity rows do not include steam, natural gas, diesel, LPG, compressed-air service, refrigerant makeup, or heat. No category-wide chemical input is assumed; if a facility uses a named conditioning agent, lubricant, cleaning chemical, fuel, refrigerant, or other carrier, add one conditional atomic row per substance/carrier with its own quantity, unit, protocol, source status, and UUID status."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_no_hidden_cutoff
      applies_to: "inventory_completeness"
      rule: "Do not omit a material or energy flow merely because no default factor exists. Record the foreground requirement, proxy, exclusion, or unresolved gap and assess its significance."
      source_ids:
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "cotton feedstock received at the preparation facility, with bale/lot identity, physical presentation, fibre type/origin, grade or supplier specification, moisture/mass basis, and prior preparation state declared"
  starting_condition_role: "gate-to-gate input condition; upstream cultivation, harvesting, ginning, recycled-textile collection, and off-site feedstock preparation are represented by linked upstream datasets rather than silently absorbed into this foreground process"
  product_classification_scope: "output shall be confirmed as cotton, carded or combed and prepared for spinning; a reclaimed/recycled route is included only when the output is not classified and marketed as cotton waste or garnetted stock"
  recursive_input_rule: "when a same-category carded or combed cotton input crosses the foreground boundary, record it as an explicit technosphere input with its upstream dataset and do not recursively reconstruct its prior preparation; disclose whether the operation is re-drawing, re-carding, blending, or reprocessing"
  upstream_dataset_requirement: "use geographically, temporally, technologically, and fibre-type-representative upstream datasets for cotton cultivation/ginning or recovered-textile preparation, electricity, fuels, water, auxiliaries, packaging, and waste treatment; identify proxies and data gaps"
  disclosure: "disclose route, fibre type/origin, recycled-content basis, input state, included equipment, shared-service allocation, moisture/mass convention, product/co-product/waste classification, dust-control boundary, packaging, geography, technology, production period, and every excluded or externally supplied operation"
