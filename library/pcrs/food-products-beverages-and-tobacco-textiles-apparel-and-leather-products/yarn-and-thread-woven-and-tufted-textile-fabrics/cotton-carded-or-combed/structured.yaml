    inclusion: "required"
    inclusion_condition: "Equipment steps may be zero only when the declared received input is already equivalently opened/cleaned; the omission is disclosed"
    role: "open bales or recovered fibre, remove foreign matter, and form the declared cotton blend"
    quantitative_reference: "kg cleaned opened cotton transferred to carding"
  - id: carding_drawing
    name: "Carding and route-required drawing"
    inclusion: "required"
    inclusion_condition: "Carding always applies; drawing applies when performed for the declared delivery or combing-preparation state"
    role: "separate and align fibres; produce carded output or combing intermediate"
    quantitative_reference: "kg carded cotton output/intermediate"
  - id: combing_preparation
    name: "Lap/sliver preparation, combing, and post-combing drawing"
    inclusion: "conditional"
    inclusion_condition: "Include only when route=combed"
    role: "remove short fibres and neps, parallel long fibres, and produce combed cotton"
    quantitative_reference: "kg combed cotton output"
  - id: site_services_packaging
    name: "Attributable site services, dust control, inspection, and packaging"
    inclusion: "required"
    inclusion_condition: "Packaging material is conditional on delivered form; humidification, compressed air, and onsite fuel are included when used"
    role: "provide utilities, capture dust, inspect, and prepare saleable output"
    quantitative_reference: "1 kg delivered reference product"
