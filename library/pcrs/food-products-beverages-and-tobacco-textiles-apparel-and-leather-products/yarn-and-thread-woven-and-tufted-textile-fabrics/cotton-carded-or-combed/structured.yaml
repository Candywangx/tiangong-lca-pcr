measurement_rules:
  - id: meas_reference_mass
    applies_to: "reference product and cotton material flows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground quantities to 1 kg of delivered carded or combed cotton. Retain unrounded lot masses and the conversion to the reference amount."
  - id: meas_moisture_basis
    applies_to: "cotton input, intermediate, output, noils, and fibre waste"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Declare whether each mass is as received, conditioned, oven-dry, or commercial mass. Do not mix bases. Record measured moisture and the exact agreed regain/allowance or conversion method; do not insert a generic regain value. ISO 6741-1 applies only within its stated homogeneous single-fibre consignment scope."
  - id: meas_route_separation
    applies_to: "carded and combed product routes"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Meter or allocate measured values to carded and combed routes separately. Route aggregation is permitted only as an additional production-weighted view with disaggregated records retained."
  - id: meas_fibre_type_separation
    applies_to: "materially different cotton fibre types and origins"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Keep virgin Upland, virgin extra-long-staple/Pima, and reclaimed/recycled feedstock records separate whenever yields, energy, waste, quality, or processing conditions differ materially."
  - id: meas_energy
    applies_to: "electricity and fuels"
    required_property_ref:
      name: "energy content and carrier-specific property"
      uuid: ""
    required_unit: "kWh, MJ, or native invoiced unit"
    rule: "Preserve metered units and conversion factors. Record grid mix, supplier product, onsite generation, fuel lower/higher heating-value basis, and allocation of shared utilities."
  - id: meas_dust
    applies_to: "captured fibre/dust and direct particulate releases"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh captured material where practicable and quantify stack or fugitive release using a documented environmental-emission method. Occupational cotton-dust concentration shall not be converted into an environmental mass emission without measured airflow, time, capture, and release-point data."
process_map:
  - id: receiving_conditioning
    name: "Feedstock receiving and conditioning"
    inclusion: "required"
