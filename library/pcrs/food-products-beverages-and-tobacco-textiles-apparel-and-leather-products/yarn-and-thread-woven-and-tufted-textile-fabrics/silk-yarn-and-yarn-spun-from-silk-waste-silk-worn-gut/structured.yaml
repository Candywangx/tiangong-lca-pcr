system_boundary:
  rules:
    - rule_id: boundary_route_gate
      applies_to: "all routes"
      rule: "Include only the declared route processes under direct foreground control, from receipt of raw silk, silk waste, or dissected silk glands through saleable unpackaged product at the factory gate."
      source_ids:
        - unsd-cpc-3-0-2025
        - iso-14044-2006
    - rule_id: boundary_upstream_links
      applies_to: "purchased inputs"
      rule: "Link raw silk, silk waste, silk glands, water, chemicals, electricity, steam, and natural gas to upstream datasets with disclosed geography, technology, and supply scenario; do not assign zero burdens to purchased inputs."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_route_selection
      applies_to: "product identity"
      rule: "Select one route and declare every included optional step. Silk-waste yarn requires degumming/dressing and spinning; filament yarn requires forming/twisting/winding; silkworm gut requires acid-assisted gland stretching."
      source_ids:
        - eu-textiles-bref-2023
        - yin-et-al-2021-spun-silk
        - cenis-et-al-2015-silkworm-gut
    - rule_id: boundary_wet_operations
      applies_to: "degumming and washing"
      rule: "Include process water, each chemical, delivered steam, electricity, saleable recovered sericin when produced, and the sericin-bearing wastewater leaving the process."
      source_ids:
        - eu-textiles-bref-2023
        - ifc-textiles-ehs-2007
    - rule_id: boundary_actual_atomic_exchanges
      applies_to: "all foreground processes"
      rule: "Record every actual material, chemical, electricity supply, steam supply, fuel, waste stream, recovered product, and direct elementary emission as a separate exchange; a flow not pre-listed in this PCR shall still be added as one specific atomic exchange."
      source_ids:
        - eu-textiles-bref-2023
        - ifc-textiles-ehs-2007
    - rule_id: boundary_exclusions
      applies_to: "downstream and upstream processes"
      rule: "Keep sericulture, cocoon production, raw-silk production, dyeing, weighting, fabric formation, product use, retail packaging, and outbound distribution outside the foreground boundary unless the declared study explicitly adds them as separate processes."
      source_ids:
        - unsd-cpc-3-0-2025
        - eu-textiles-bref-2023
