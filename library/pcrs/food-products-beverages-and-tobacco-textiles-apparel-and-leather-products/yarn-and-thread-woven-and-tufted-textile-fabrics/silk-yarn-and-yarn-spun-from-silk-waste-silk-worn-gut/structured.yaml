allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "all routes"
    rule: "Subdivide route-specific processes and separately meter batches, utilities and outputs before applying allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_recovered_silk
    applies_to: "recovered silk waste"
    rule: "When recovered silk waste is transferred as a useful product, keep it as a product output and document the allocation relationship; material sent to waste management remains a Waste flow and receives no product credit."
    source_ids:
      - iso-14044-2006
      - yin-et-al-2021-spun-silk
  - rule_id: allocation_recovered_sericin
    applies_to: "recovered sericin"
    rule: "When saleable sericin is recovered, first subdivide the recovery operation; if shared burdens cannot be subdivided, use a documented physical relationship that reflects the process, and use economic allocation only when no defensible physical relationship exists."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bref-2023
  - rule_id: allocation_no_unreported_credit
    applies_to: "all wastes and co-products"
    rule: "Do not apply avoided-burden, substitution or recycling credits unless the study explicitly models the additional function and reports the method, substituted product, geography and sensitivity result."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_filament_batch_records
      process_id: "silk_filament_yarn_forming"
      flow_role: "material, product and silk-waste mass"
      record_type: "scale tickets and batch records"
      raw_fields: "batch_id; row_id; gross_mass; tare_mass; moisture_or_conditioning_basis; accepted_output_mass; recovered_mass; discarded_mass"
      collection_method: "Calibrated scale linked to production and disposition records"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Representative continuous 12-month period or all batches in the declared shorter period"
      site_scope: "All included filament-yarn lines"
      aggregation_rule: "Sum by row_id and batch; subtract tare and returned material; normalize with calc_normalize_reference"
      quality_evidence: "Calibration records, batch genealogy, recovery acceptance and waste transfer notes"
