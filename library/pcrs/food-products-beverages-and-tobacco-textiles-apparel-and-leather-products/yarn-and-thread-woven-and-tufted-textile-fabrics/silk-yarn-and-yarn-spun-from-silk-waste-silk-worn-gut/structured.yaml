  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "every inventory row"
      rule: "normalized_amount = route-period row amount / route-period net dry conforming product mass"
      inputs:
        - "row amount"
        - "net dry conforming product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - iso-14044-2006
    - id: calc_net_dry_product_mass
      applies_to: "yarn or gut product"
      rule: "net_dry_mass = gross conditioned mass - packaging tare - measured water mass above the declared dry basis"
      inputs:
        - "gross mass"
        - tare
        - "moisture or conditioning result"
      output: "kg net dry product"
      source_ids:
        - iso-2060-1994
    - id: calc_acetic_acid_active_mass
      applies_to: "silkworm_gut_acetic_acid"
      rule: "active_acetic_acid_mass = net solution mass × supplier-certified acetic-acid mass fraction"
      inputs:
        - "solution mass"
        - "certified mass fraction"
        - "returned solution mass"
      output: "kg active acetic acid"
      source_ids:
        - cenis-et-al-2015-silkworm-gut
    - id: calc_direct_air_emission
      applies_to: "gassing elementary outputs"
      rule: "emitted_mass = measured concentration × measured exhaust flow × operating duration, with unit conversion and documented below-detection handling"
      inputs:
        - concentration
        - "exhaust flow"
        - duration
        - "abatement state"
      output: "kg pollutant emitted"
      source_ids:
        - ifc-textiles-ehs-2007
    - id: calc_route_mass_balance
      applies_to: "each route process"
      rule: "mass_balance_gap = total measured mass inputs - total measured product, waste and measured emission outputs, reported with moisture and accumulation terms"
      inputs:
        - "all mass inputs"
        - "all mass outputs"
        - "moisture change"
        - "stock change"
      output: "disclosed kg and percent mass-balance gap"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every flow card"
      requirement: "Preserve row_id, flow direction, flow type, selected flow name and confirmed UUID; an unresolved UUID shall remain explicit and shall not be replaced by a broad candidate."
      evidence: "Flow list/get verification record and manifest review metadata"
    - id: dq_route
      applies_to: "product and process map"
      requirement: "Route, starting material, sericin condition, gassing status and included processes shall be batch-traceable."
      evidence: "Product specification and batch genealogy"
    - id: dq_measurement
      applies_to: "foreground amounts"
      requirement: "Use calibrated meters or scales and retain raw records, tare, unit conversion, allocation driver and detection-limit treatment."
      evidence: "Calibration certificates, meter exports, scale tickets and calculation workbook"
    - id: dq_temporal
      applies_to: "published average"
      requirement: "Cover a representative continuous 12-month period; a shorter campaign is allowed only with production dates, batch coverage and seasonality limitation disclosed."
      evidence: "Production calendar and completeness calculation"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Reconcile production, material, chemical, utility, waste, wastewater and direct-emission records; explain every omitted or below-detection exchange."
      evidence: "Route mass balance, utility reconciliation and omission log"
    - id: dq_external_links
      applies_to: "upstream datasets"
      requirement: "Match input identity, geography, technology, voltage, steam pressure and fuel supply state as closely as available; disclose every proxy and mismatch."
      evidence: "Upstream dataset metadata and proxy justification"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "The data package shall normalize to 1 kg net dry product and use confirmed Spun Silk UUID 6c639604-29e8-44b6-be18-4e0ad97fdef8 for the representative spun-silk product; another covered route shall use an exact reviewed product UUID before release."
    source_ids:
      - unsd-cpc-3-0-2025
      - iso-14044-2006
  - rule_id: validation_route_declaration
    applies_to: "process map"
    rule: "Exactly one covered product route shall be declared, and every route-required process plus every actually used optional process shall be present."
    source_ids:
      - eu-textiles-bref-2023
      - yin-et-al-2021-spun-silk
      - cenis-et-al-2015-silkworm-gut
  - rule_id: validation_atomic_inventory
    applies_to: "all inventory rows"
    rule: "Every exchange shall have one row_id, one direction, one flow type and one specific selected flow; combined utilities, chemicals, packaging, wastes or emissions fail validation."
    source_ids:
      - eu-textiles-bref-2023
      - ifc-textiles-ehs-2007
  - rule_id: validation_foreground_amounts
    applies_to: "all foreground rows"
    rule: "Every amount shall come from a retained foreground record or an explicit calculation from collected records; this PCR supplies no guessed default amount or reasoned-estimate range."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_wet_route
    applies_to: "silk-waste degumming"
    rule: "A wet-route package shall contain silk waste, process water, each actual chemical, steam when transferred, electricity, degummed fibre, recovered sericin when produced, and route-specific wastewater, with all amounts separately reconciled."
    source_ids:
      - eu-textiles-bref-2023
      - ifc-textiles-ehs-2007
      - yin-et-al-2021-spun-silk
  - rule_id: validation_gassing
    applies_to: "gassing route"
    rule: "When gassing is included, natural gas, electricity, yarn input/output, captured silk waste, fossil carbon monoxide and fine particulate emissions shall be measured or explicitly documented below detection after abatement."
    source_ids:
      - yin-et-al-2021-spun-silk
      - ifc-textiles-ehs-2007
  - rule_id: validation_gut_route
    applies_to: "silkworm-gut forming"
    rule: "A gut-route package shall separately record silk gland, process water, active acetic acid, gut output, tissue waste and spent acidic bath and shall declare diameter, length and tensile-quality evidence."
    source_ids:
      - cenis-et-al-2015-silkworm-gut
      - iso-2062-2009
  - rule_id: validation_mass_balance
    applies_to: "each route"
    rule: "The route mass balance shall report input, product, recovered material, waste, wastewater, measured emissions, moisture change, stock change and residual gap on consistent bases."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_uuid_resolution
    applies_to: "release readiness"
    rule: "Every route-required unresolved flow identity shall be resolved or accepted through formal review before active or published release; the confirmed reference product, Mass property and Units of mass group identities shall remain unchanged unless superseded by documented public-record review; semantically rejected candidates shall not be substituted."
    source_ids:
      - unsd-cpc-3-0-2025
published_dataset_profile:
  dataset_role: "Foreground production dataset for one declared CPC 26310 silk-yarn or silkworm-gut route"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product-footprint, LCA and supply-chain modelling when route, geography, period, product specification and upstream links match the study"
  excluded_use: "Undeclared average across filament yarn, spun silk and silkworm gut; proxy for raw silk, woven fabric, dyed or weighted silk, finished sutures, or a route with materially different wet processing or energy supply"
  required_metadata: "PCR id and version; product route; product and flow UUIDs; geography; reference period; silk source/species where known; sericin condition; yarn construction or gut dimensions; linear density or diameter; twist where applicable; moisture basis; process list; utility supply scenarios; allocation method; data owner and review status"
  required_quality_disclosure: "Foreground coverage; meter and scale calibration; mass-balance gap; proxy datasets; unresolved identities; below-detection treatment; wastewater destination; abatement state; allocation sensitivity; excluded processes"
  update_trigger: "Change in starting material, route, degumming recipe, gassing technology, energy supply, product specification, allocation method, wastewater treatment, abatement, geography, or a material change in measured inventory"
