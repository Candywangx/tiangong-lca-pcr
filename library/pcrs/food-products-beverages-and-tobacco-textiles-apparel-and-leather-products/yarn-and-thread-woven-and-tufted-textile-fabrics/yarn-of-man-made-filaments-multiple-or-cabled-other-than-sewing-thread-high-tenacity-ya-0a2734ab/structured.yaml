dataset_production:
  collection_protocols:
    - protocol_id: cp_yarn_mass_balance
      process_id: "doubling_twisting_winding"
      flow_role: "filament-yarn inputs, qualifying yarn output, and polymer-specific yarn wastes"
      record_type: "weighbridge, scale, lot ledger, and quality-release records"
      raw_fields: "timestamp; lot_id; material_identity; polymer; high_tenacity_flag; input_mass; accepted_output_mass; waste_mass; carrier_tare; disposition"
      collection_method: "Weigh each input, accepted output, and segregated waste stream on calibrated equipment; subtract documented carrier tare and link every record to the lot."
      unit: "kg"
      frequency: "each lot and each waste handover"
      temporal_coverage: "entire reporting period"
      site_scope: "all included lines and shifts"
      aggregation_rule: "sum net masses by row_id and lot, then normalize with calc_normalize_reference_mass"
      quality_evidence: "calibration records; tare records; lot genealogy; quality-release status; waste transfer records"
    - protocol_id: cp_electricity_meter
      process_id: "doubling_twisting_winding"
      flow_role: "input_medium_voltage_electricity"
      record_type: "electricity submeter or reconciled facility meter"
      raw_fields: "meter_id; timestamp_start; timestamp_end; opening_reading; closing_reading; original_unit; machine_runtime; measured_load; lot_id"
      collection_method: "Read the dedicated submeter for each lot; when shared, reconcile facility readings and allocate only with documented operating time and measured load."
      unit: "original meter unit and MJ"
      frequency: "each lot or meter interval"
      temporal_coverage: "entire reporting period"
      site_scope: "all included twisting, winding, and directly supporting equipment"
      aggregation_rule: "subtract opening from closing readings, remove documented out-of-boundary use, allocate shared use, convert to MJ, and normalize"
      quality_evidence: "meter identity; meter calibration or verification; reconciliation; allocation record"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "all inventory exchanges"
      rule: "normalization factor = 1,000 kg / measured net qualifying output kg; multiply each measured exchange by the factor"
      inputs:
        - "measured exchange"
        - "measured net qualifying output"
      output: "exchange per 1,000 kg reference product"
      source_ids: []
    - id: calc_yarn_mass_reconciliation
      applies_to: "yarn material balance"
      rule: "Reconcile each polymer-specific yarn input against accepted yarn output, segregated yarn waste, and documented work-in-progress change; disclose any residual without forcing it to zero."
      inputs:
        - "net input mass"
        - "accepted output mass"
        - "waste mass"
        - "work-in-progress change"
      output: "disclosed mass-balance residual"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain evidence for polymer or material, component-end count, ply or cable construction, twist direction and level, linear density, high-tenacity exclusion, and non-retail market state."
      evidence: "product specification; lot release; test or production-control record"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Include every actual material, electricity, waste, and elementary exchange within the declared process boundary as a separate atomic row; add a specific row when an actual exchange is not represented above."
      evidence: "input-output inventory; purchase records; meters; waste records; emission records"
    - id: dq_temporal_site_scope
      applies_to: "foreground records"
      requirement: "Cover the complete declared reporting period and every included line and shift; disclose exclusions, shutdowns, abnormal operations, and data gaps."
      evidence: "production calendar; meter interval coverage; lot register; gap log"
    - id: dq_identity_resolution
      applies_to: "Tiangong references"
      requirement: "Use only verified state_code 100 UUIDs whose type, name, classification, property, and unit semantics match the exchange; leave unresolved UUIDs blank and preserve the specific flow name."
      evidence: "Tiangong identity verification and manifest review metadata"
