system_boundary:
  rules:
    - rule_id: boundary_received_yarn_start
      applies_to: "foreground starting condition"
      rule: "Start at receipt of identified man-made staple fibre yarns and cotton yarns, or at receipt of an explicitly declared same-category intermediate fabric; link excluded fibre formation and spinning to upstream datasets."
      source_ids:
        - ec-pef-method-2021
    - rule_id: boundary_cpc_26760_scope
      applies_to: "reference product identity"
      rule: "Require a woven fabric containing less than 85% man-made staple fibres by mass and mixed mainly or solely with cotton; neighbouring CPC woven-fabric subclasses are outside this PCR."
      source_ids:
        - unsd-cpc-v3-2025
    - rule_id: boundary_foreground_operations
      applies_to: "foreground manufacturing"
      rule: "Include every on-site or directly controlled preparation, sizing, weaving, wet processing, thermal/mechanical finishing, inspection, rework, waste handling, and on-site treatment operation used to produce the declared market state."
      source_ids:
        - eu-jrc-textiles-bref-2023
    - rule_id: boundary_intermediate_product_end
      applies_to: "intermediate product gate"
      rule: "End at the manufacturing gate after conformity inspection and batch formation. Exclude downstream distribution, use, and end-of-life from this intermediate-product foreground dataset."
      source_ids:
        - ec-pef-method-2021
    - rule_id: boundary_direct_flow_completeness
      applies_to: "foreground inputs and outputs"
      rule: "Quantify all identified foreground material, water, energy, product, waste, waste-water, and direct elementary flows; an unmeasured identified flow remains an explicit data gap and shall not be silently assigned zero."
      source_ids:
        - ec-pef-method-2021
        - eu-jrc-textiles-bref-2023
    - rule_id: boundary_subcontracted_operations
      applies_to: "outsourced preparation or finishing"
      rule: "Represent a subcontracted operation as a linked upstream service or intermediate-product dataset and disclose the transfer mass, route, and included treatment steps; do not claim it as directly measured on-site activity."
      source_ids:
        - ec-pef-method-2021
    - rule_id: boundary_same_category_input
      applies_to: "same-category fabric input"
      rule: "When received greige or partly finished fabric in the same category is the starting input, record it once as a visible product input, require an upstream dataset ending at that starting condition, and do not recursively recreate its production inside the finishing process."
      source_ids:
        - ec-pef-method-2021
