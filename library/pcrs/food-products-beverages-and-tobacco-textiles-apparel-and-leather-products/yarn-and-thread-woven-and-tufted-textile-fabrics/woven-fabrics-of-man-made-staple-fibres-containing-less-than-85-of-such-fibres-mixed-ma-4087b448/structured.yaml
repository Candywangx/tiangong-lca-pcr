measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all inventory amounts to 1 kg of conforming net fabric at the declared moisture or conditioning basis; exclude cores, wrapping, pallets, and other packaging from the reference amount."
  - id: fibre_composition_mass_fraction
    applies_to: "Reference product and incoming yarns"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg and % by mass"
    rule: "Determine fibre shares on one consistent moisture basis. The reported fibre shares shall sum to 100%; the man-made staple fraction shall be below 85%, and cotton shall be the sole or predominant non-man-made blend component."
  - id: area_mass_conversion
    applies_to: "Fabric measured by length or area"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "When mass is calculated from length, usable width, and mass per unit area, use mass_kg = length_m × usable_width_m × basis_mass_g_per_m2 / 1000 and reconcile the result with batch weighing."
  - id: moisture_basis_consistency
    applies_to: "Yarn, intermediate fabric, wastes, and reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record the conditioning or moisture basis used for each measured textile mass; convert all mass-balance terms to the reference-product basis and disclose conversion factors and test methods."
  - id: utility_unit_conversion
    applies_to: "Electricity and thermal-energy records"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Preserve measured utility units and conversion factors. Use 1 MWh = 1,000 kWh and report thermal energy separately from electricity before aggregation."
  - id: water_volume_conversion
    applies_to: "Process water and waste water"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Use metered volume where available. Use 1 m3 = 1,000 L and retain the treated textile mass used as the denominator for each operation-specific water indicator."
