allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all multifunctional foreground processes"
    rule: "First avoid allocation by separately metering batches, lines, recipes, treatment streams, and directly attributable utilities and wastes; use subdivision or an expanded multifunctional result when practicable."
    source_ids:
      - iso-14044-2006
      - ec-pef-method-2021
  - rule_id: allocation_physical
    applies_to: "unavoidable shared inputs and outputs"
    rule: "If subdivision or system expansion is not practicable, allocate by a documented causal physical relationship such as machine time, metered energy, treated mass, liquor volume, or pollutant load that reflects the shared operation."
    source_ids:
      - iso-14044-2006
      - ec-pef-method-2021
  - rule_id: allocation_other_relationship
    applies_to: "no defensible physical relationship"
    rule: "Use another relationship, including economic allocation, only after documenting why subdivision, system expansion, and physical allocation are not defensible; use values at the stage where the outputs arise and disclose a sensitivity check."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_rework
    applies_to: "rework and repeat processing"
    rule: "Assign planned repeat treatments required by the product specification to the product; assign avoidable rework caused by nonconformity to the affected production lot and disclose it rather than inflating the normal activity denominator."
    source_ids:
      - eu-jrc-textiles-bref-2023
  - rule_id: allocation_waste_and_recovery
    applies_to: "textile waste, recovered size, recovered water, sludge, and recovered energy"
    rule: "Keep waste treatment burdens with the generating system until the receiving product or waste-treatment boundary is reached. Record recovered outputs separately and apply any substitution or recycling credit only in a downstream lifecycle model with the method and quality relationship disclosed."
    source_ids:
      - ec-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_yarn_receipt_preparation
      process_id: "yarn_receipt_and_preparation"
      flow_role: "incoming yarn, preparation electricity, prepared yarn, and preparation waste"
      record_type: "receiving, supplier, meter, and production records"
      raw_fields: "supplier; lot; yarn identifier; fibre type and share; yarn count; gross/net mass; moisture basis; accepted/rejected mass; meter reading; operating time; waste type and destination"
      collection_method: "calibrated scale, supplier certificate verified by incoming inspection, electricity meter or documented equipment allocation, and waste weigh ticket"
      unit: "kg, %, kWh"
      frequency: "each lot and meter interval; aggregate monthly"
      temporal_coverage: "representative 12-month period or the complete shorter campaign with justification"
      site_scope: "all receiving and preparation operations serving the reference product"
      aggregation_rule: "sum by yarn type and lot; allocate shared electricity by metered use or operating time; normalize to accepted prepared-yarn and final reference mass"
      quality_evidence: "calibration records, supplier certificates, laboratory composition checks, meter records, and waste receipts"
    - protocol_id: cp_warp_sizing
      process_id: "warp_preparation_and_sizing"
      flow_role: "warp yarn, sizing recipe, water, utilities, prepared warp, and sizing waste"
      record_type: "batch recipe, issue/return, meter, and production records"
      raw_fields: "warp lot; input/output mass; size product and quantity; recipe volume; water; electricity; steam/fuel; retained add-on; waste-water volume; solid waste and destination"
      collection_method: "calibrated scale, dosing record, recipe controller, utility meter, and waste measurement"
      unit: "kg, m3, kWh"
      frequency: "each batch or beam; aggregate monthly"
      temporal_coverage: "representative 12-month period or complete campaign"
      site_scope: "every included warping, beaming, and sizing line"
      aggregation_rule: "subtract documented material returns; calculate retained size and normalize all inputs/outputs to prepared warp and reference fabric"
      quality_evidence: "scale/meter calibration, batch sheet, chemical inventory, and mass-balance review"
    - protocol_id: cp_weaving
      process_id: "weaving"
      flow_role: "warp/weft yarn, energy, greige fabric, textile waste, and direct dust"
      record_type: "loom, meter, production, quality, waste, and emission records"
      raw_fields: "loom id; technology; yarn issued/returned; operating time; electricity; compressed air; greige length/width/basis mass/net mass; reject mass; waste destination; dust concentration/flow or factor"
      collection_method: "loom counter, calibrated scale, electricity/air meter, QC test, waste weigh ticket, and representative emission measurement"
      unit: "kg, m, m2, g/m2, kWh, kg pollutant"
      frequency: "each lot and meter interval; emissions at representative operation"
      temporal_coverage: "representative 12-month period or complete campaign"
      site_scope: "every loom and shared preparation system serving the reference product"
      aggregation_rule: "reconcile yarn input with greige output and waste; allocate shared utilities by metered use or loom operating time"
      quality_evidence: "meter/scale calibration, loom logs, QC report, waste receipt, and emission-method record"
    - protocol_id: cp_wet_processing
      process_id: "wet_pretreatment_and_coloration"
      flow_role: "fabric, water, chemicals, utilities, output, waste water, residues, and direct emissions"
      record_type: "batch/continuous recipe, flowmeter, dosing, meter, laboratory, waste, and emissions records"
      raw_fields: "operation/recipe; textile input/output mass; repeat count and reason; fresh/reused water; chemical identity/quantity/density; electricity; steam/fuel; waste-water flow/pH/temperature/conductivity; pollutant concentration; waste; air concentration/flow"
      collection_method: "automated recipe controller, calibrated flow/energy meter, issue/return record, laboratory analysis, and compliant emission monitoring"
      unit: "kg, m3, kWh, concentration and kg pollutant"
      frequency: "each operation and meter interval; environmental monitoring at required risk-based frequency; aggregate monthly and annually"
      temporal_coverage: "representative 12-month period or complete campaign"
      site_scope: "every included wet-processing line and relevant discharge/emission point"
      aggregation_rule: "retain distinct operations and repeats; calculate mass loads from concentration and flow; do not count internal water reuse as new withdrawal"
      quality_evidence: "calibration, chain of custody, laboratory QA/QC, recipe record, and discharge/emission report"
    - protocol_id: cp_finishing_inspection
      process_id: "finishing_inspection_and_packaging"
      flow_role: "finishing utilities, packaging, conforming fabric, rejects, and air emissions"
      record_type: "meter, production, packing, QC, waste, and emission records"
      raw_fields: "finish route; equipment; input/output mass; length; width; basis mass; moisture; temperature; operating time; energy; package material/mass; quality grade; reject cause/mass; emission concentration/flow"
      collection_method: "calibrated scale and meter, line controller, laboratory/QC test, packing issue record, waste receipt, and representative emission measurement"
      unit: "kg, m, g/m2, kWh, kg pollutant"
      frequency: "each lot and meter interval; aggregate monthly"
      temporal_coverage: "representative 12-month period or complete campaign"
      site_scope: "every included finishing, inspection, and packing line"
      aggregation_rule: "separate net fabric from packaging; normalize only conforming output; allocate shared utilities by meter or operating time"
      quality_evidence: "calibration, QC specification and result, batch release, packing record, and emission-method record"
    - protocol_id: cp_wastewater_treatment
      process_id: "onsite_wastewater_treatment"
      flow_role: "untreated waste water, treatment inputs, recovered outputs, sludge, and final effluent"
      record_type: "flowmeter, dosing, meter, laboratory, sludge, recovery, and discharge records"
      raw_fields: "inlet/outlet flow; pH; temperature; conductivity; relevant pollutant concentrations; chemical dose; electricity; sludge wet/dry mass; recovery quantity/specification; discharge destination"
      collection_method: "calibrated flow/energy meter, dosing log, accredited or controlled laboratory analysis, sludge weigh ticket, and discharge monitoring"
      unit: "m3, kg, kWh, concentration"
      frequency: "continuous or batch flow; pollutant monitoring at risk-based frequency; aggregate monthly and annually"
      temporal_coverage: "representative 12-month period or complete campaign"
      site_scope: "complete on-site treatment system receiving foreground waste water"
      aggregation_rule: "calculate inlet/outlet pollutant loads; reconcile water flow; allocate shared treatment by causal volume and pollutant load"
      quality_evidence: "calibration, blanks/duplicates, chain of custody, laboratory QA/QC, disposal receipt, and permit report"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized_quantity = attributable_period_quantity / conforming_net_fabric_mass; use one consistent moisture basis and exclude packaging from the denominator"
      inputs:
        - "attributable row quantity"
        - "conforming net fabric mass"
        - "moisture conversion"
      output: "quantity per kg reference fabric"
      source_ids:
        - ec-pef-method-2021
    - id: calc_fibre_composition
      applies_to: "reference product"
      rule: "fibre_share_i = sum(yarn_mass_j × certified_share_i,j) / sum(all_fibre_mass) after moisture-basis alignment; all shares sum to 100%"
      inputs:
        - "yarn masses"
        - "supplier composition"
        - "laboratory verification"
        - "moisture basis"
      output: "mass share of each fibre and category-conformance decision"
      source_ids: []
    - id: calc_area_mass
      applies_to: "fabric mass cross-check"
      rule: "mass_kg = length_m × usable_width_m × basis_mass_g_per_m2 / 1000; compare with calibrated-scale mass and investigate material difference"
      inputs:
        - length
        - "usable width"
        - "g/m2"
        - "scale mass"
      output: "calculated mass and reconciliation difference"
      source_ids: []
    - id: calc_textile_mass_balance
      applies_to: "each textile process and reporting period"
      rule: "textile_input = conforming_output + transferred_intermediate + textile_waste + inventory_change + documented_mass_change; quantify and explain the residual"
      inputs:
        - "conditioned input/output mass"
        - wastes
        - "stock change"
        - "retained size/finish"
        - "moisture conversion"
      output: "mass-balance residual per process and for the foreground system"
      source_ids:
        - eu-jrc-textiles-bref-2023
    - id: calc_shared_utility_allocation
      applies_to: "shared electricity, steam, fuel, water, and compressed air"
      rule: "Prefer submetering; otherwise allocate by equipment operating time × rated demand × measured load factor or another documented causal driver, and retain total-site reconciliation"
      inputs:
        - "site meter"
        - submeter
        - "equipment power"
        - "operating time"
        - "load factor"
        - "production mass"
      output: "attributable utility by process and product"
      source_ids:
        - ec-pef-method-2021
    - id: calc_water_balance
      applies_to: "wet processing and waste-water treatment"
      rule: "fresh_withdrawal + transferred_water = effluent + evaporation + retained_water + recovered_export + inventory_change; internal reuse is tracked but not counted as new withdrawal"
      inputs:
        - "flowmeter and recipe volumes"
        - "product moisture"
        - "effluent and recovery volumes"
      output: "water-balance residual and fresh-water intensity"
      source_ids:
        - eu-jrc-textiles-bref-2023
    - id: calc_pollutant_load
      applies_to: "waste-water and air emissions"
      rule: "load_kg = concentration × standardized_flow_or_volume × operating_time × unit_conversion; use matched sampling and flow periods and report values below detection limits consistently"
      inputs:
        - concentration
        - "flow/volume"
        - duration
        - "detection limit"
        - "standard conditions"
      output: "substance-specific kg emission per kg reference fabric"
      source_ids:
        - eu-jrc-textiles-bref-2023
    - id: calc_treatment_removal
      applies_to: "on-site waste-water treatment"
      rule: "removal = inlet_load - outlet_load - recovered_load - retained_inventory_change; do not report negative or greater-than-input removal without investigation"
      inputs:
        - "inlet/outlet pollutant loads"
        - "recovered outputs"
        - "inventory changes"
      output: "removed load, final discharge, and reconciliation residual"
      source_ids:
        - eu-jrc-textiles-bref-2023
  data_quality_requirements:
    - id: dqr_product_identity
      applies_to: "reference product and textile inputs"
      requirement: "Preserve supplier/lot traceability, fibre type and share, yarn count, weave, g/m2, width, finish state, quality grade, and moisture basis; verify the below-85% man-made staple and cotton-predominant scope before normalization."
      evidence: "Supplier declarations, bill of materials, laboratory fibre analysis, batch card, and QC release"
    - id: dqr_measurement
      applies_to: "mass, water, energy, chemicals, and emissions"
      requirement: "Use calibrated or verified measurement systems; document units, conversion factors, detection limits, density conversions, meter coverage, and estimated-data methods."
      evidence: "Calibration certificates, meter maps, laboratory QA/QC, and calculation records"
    - id: dqr_temporal
      applies_to: "foreground reporting period"
      requirement: "Prefer a continuous representative 12-month period that captures product and seasonal variability; a shorter complete campaign is allowed only with dates, coverage, and representativeness limitations disclosed."
      evidence: "Production calendar, meter interval coverage, and representativeness statement"
    - id: dqr_site_and_technology
      applies_to: "foreground process coverage"
      requirement: "Include every site, line, loom technology, wet-processing route, and controlled subcontractor materially serving the declared product, or document a production-weighted sampling and its exclusions."
      evidence: "Site/line list, production shares, sampling plan, and subcontract records"
    - id: dqr_completeness
      applies_to: "foreground inventory"
      requirement: "Reconcile textile mass, water, and energy totals to site or line control totals and keep all identified direct emissions and wastes visible; unresolved flows remain explicit data gaps."
      evidence: "Signed mass/water/energy balances, control totals, waste register, and gap log"
    - id: dqr_allocation
      applies_to: "shared and multifunctional operations"
      requirement: "Retain the selected hierarchy step, causal driver, totals, allocation factors, and sensitivity result; allocated process totals shall equal the unallocated control total."
      evidence: "Meter totals, driver records, allocation workbook, and sensitivity result"
    - id: dqr_upstream_links
      applies_to: "purchased yarns, utilities, chemicals, transport, and treatments"
      requirement: "Use geographically, technologically, and temporally representative linked datasets; document dataset identity, version outside this PCR, reference quantity, and any proxy limitation."
      evidence: "Dataset references and data-quality assessment consistent with ec-pef-method-2021"
    - id: dqr_blended_textile_uncertainty
      applies_to: "blended-fabric inventory"
      requirement: "Do not infer missing foreground quantities from generic cotton/polyester blend literature; collect route-specific records and disclose composition, process, temporal, and technology uncertainty."
      evidence: "Foreground records, uncertainty statement, and valtere-et-al-2024"
validation_rules:
  - rule_id: validate_identity_and_scope
    applies_to: "reference product"
    rule: "Confirm the reference-flow UUID and Mass property, all required qualifiers, man-made staple share below 85%, cotton as the sole or predominant blend partner, and exclusion of out-of-scope fabric types."
    source_ids: []
  - rule_id: validate_reference_quantity
    applies_to: "normalized foreground dataset"
    rule: "Confirm exactly 1 kg conforming net fabric output, no packaging mass in the reference amount, and one declared moisture/conditioning basis across the textile mass balance."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_process_coverage
    applies_to: "process map and inventory"
    rule: "Confirm every required process is present, every applicable conditional process is included, repeated treatments and subcontracted operations are disclosed, and excluded operations have an explicit reason."
    source_ids:
      - eu-jrc-textiles-bref-2023
  - rule_id: validate_mass_water_energy_balances
    applies_to: "foreground records"
    rule: "Confirm textile mass, water, and energy balances reconcile to control totals within the producer's documented measurement uncertainty; investigate and disclose every residual outside that tolerance."
    source_ids:
      - eu-jrc-textiles-bref-2023
  - rule_id: validate_flow_destinations
    applies_to: "product, waste, and elementary outputs"
    rule: "Confirm every output has exactly one modelling role and destination; distinguish direct elementary emissions, waste sent to treatment, internally reused material, and saleable co-products without double counting."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_allocation
    applies_to: "shared or multifunctional processes"
    rule: "Confirm the allocation hierarchy is followed, allocated totals equal unallocated totals, causal physical drivers are preferred, and any other relationship has justification and sensitivity disclosure."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_monitoring_and_loads
    applies_to: "wet processing, thermal finishing, and waste-water treatment"
    rule: "Confirm water, energy, material, waste, waste-water, and relevant emission monitoring covers the declared period and that pollutant loads use matched concentrations, flows, durations, and units."
    source_ids:
      - eu-jrc-textiles-bref-2023
  - rule_id: validate_source_and_range_status
    applies_to: "evidence and ranges"
    rule: "Confirm every retained quantitative range is traceable to a listed external source or foreground dataset; reject AI-authored or otherwise unsupported numerical ranges."
    source_ids:
      - valtere-et-al-2024
  - rule_id: validate_upstream_and_downstream_boundary
    applies_to: "dataset profile"
    rule: "Confirm purchased inputs and off-site treatments have linked upstream datasets and that distribution, use, and end-of-life are not silently included in the intermediate-product foreground result."
    source_ids:
      - ec-pef-method-2021
published_dataset_profile:
  dataset_role: "Foreground fabric-manufacturing data package with process-level records and a normalized market-ready woven-fabric output"
  downstream_use: "secondary_dataset; may be aggregated or linked as a background_dataset for garments, made-up textiles, and other downstream product systems"
  allowed_use: "Construction of site- and route-specific unit processes, cradle-to-gate fabric results when linked to representative upstream datasets, and lifecyclemodel projections consistent with the declared fabric qualifiers and boundary"
  excluded_use: "Direct representation of fabrics outside the composition or construction scope; representation of garments, consumer use, laundering, durability, recycling, or end-of-life without additional downstream PCR rules and data"
  required_metadata: "PCR id; product-flow UUID; fibre types and mass shares; yarn and weave specification; g/m2; usable width; finish and colour; quality grade; moisture basis; site/geography; technology route; included and subcontracted processes; reporting period; allocation; source ids; data gaps"
  required_quality_disclosure: "Measurement and meter coverage; mass/water/energy balance residuals; temporal/site/technology representativeness; sampling; allocation sensitivity; emission and waste-water monitoring; upstream dataset quality; source-backed ranges and unresolved identities"
  update_trigger: "Change in fibre composition or product scope; yarn or loom technology; sizing, dyeing, printing, or finishing recipe; market finish state; site or energy/water supply; treatment route; allocation driver; emission control; reference UUID/property/unit; official method or evidence ranges; or a material data-quality gap closure"
