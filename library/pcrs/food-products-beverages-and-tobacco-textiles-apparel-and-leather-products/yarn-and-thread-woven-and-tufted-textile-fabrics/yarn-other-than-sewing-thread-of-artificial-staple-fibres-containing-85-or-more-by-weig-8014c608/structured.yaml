  - rule_id: validate_scope_threshold
    applies_to: "product composition and market state"
    rule: "Reject a package if artificial staple fibres are below 85% of total fibre mass, constituent fibres are not identified, the product is sewing thread or filament yarn, or the package is put up for retail sale."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Reject collective, selector, or combined flow labels; every actual material, chemical product, electricity scenario, packaging component, waste, and elementary flow must occupy its own row."
    source_ids: []
  - rule_id: validate_bilingual_alignment
    applies_to: "English and Chinese PCR renderings"
    rule: "Require identical ordered process_id, row_id, direction, flow_type, value_mode, specificity, basis_kind, evidence_kind, source_id, and UUID sequences."
    source_ids: []
  - rule_id: validate_foreground_records
    applies_to: "inventory amounts"
    rule: "Require raw foreground evidence and a collection protocol for every inventory amount; do not accept AI-estimated values or unsupported ranges."
    source_ids: []
  - rule_id: validate_mass_reconciliation
    applies_to: "fibre-bearing inventory"
    rule: "Require a documented fibre mass reconciliation and an explanation for every residual rather than silently balancing or netting waste."
