allocation_rules:
  - rule_id: avoid_allocation
    applies_to: "separately identifiable production lots and lines"
    rule: "Subdivide production by fibre composition, spinning system, and production lot before allocating shared inputs or outputs."
    source_ids: []
  - rule_id: shared_equipment_allocation
    applies_to: "shared electricity and directly attributable auxiliary equipment"
    rule: "When separate metering is unavailable, allocate using documented operating time multiplied by measured or nameplate equipment load, and disclose the calculation and affected rows."
    source_ids: []
  - rule_id: shared_packaging_allocation
    applies_to: "cones and stretch film used for more than one yarn product"
    rule: "Allocate measured packaging mass by the net mass of yarn shipped in each documented package configuration."
    source_ids: []
  - rule_id: waste_handling
    applies_to: "viscose fibre fly waste and viscose yarn waste"
    rule: "Report each waste mass and destination separately; do not subtract waste revenue or an assumed recycling credit from foreground burdens."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_fibre_input_mass
      process_id: "secondary_staple_spinning"
      flow_role: "viscose_staple_fibre_input"
      record_type: "weighbridge, warehouse issue, and stock record"
      raw_fields: "supplier; fibre generic name; lot id; gross mass; tare mass; moisture basis; opening stock; closing stock"
      collection_method: "calibrated scale plus stock reconciliation"
      unit: "kg"
      frequency: "each lot; monthly reconciliation"
      temporal_coverage: "same period as yarn output"
      site_scope: "all included fibre stores and lines"
      aggregation_rule: "issued mass = opening stock + receipts - closing stock - documented transfers"
      quality_evidence: "calibration record; supplier specification; stock reconciliation"
    - protocol_id: cp_electricity_meter
      process_id: "secondary_staple_spinning"
      flow_role: "cn_grid_medium_voltage_electricity"
      record_type: "electricity meter and equipment operating log"
      raw_fields: "meter id; opening reading; closing reading; voltage level; grid geography; production hours; equipment load where allocated"
      collection_method: "dedicated meter preferred; otherwise documented equipment calculation"
      unit: "kWh"
      frequency: "continuous or shift reading"
      temporal_coverage: "same period as yarn output"
      site_scope: "all included process and directly attributable auxiliary equipment"
      aggregation_rule: "subtract opening from closing reading; remove documented excluded loads; allocate shared load under shared_equipment_allocation"
      quality_evidence: "meter calibration; bills; operating logs; allocation worksheet"
    - protocol_id: cp_lubricant_mass
      process_id: "secondary_staple_spinning"
      flow_role: "mineral_oil_spinning_lubricant"
      record_type: "purchase, issue, return, and stock record"
      raw_fields: "product trade name; supplier; safety-data-sheet id; opening stock; issued mass; returned mass; closing stock; lot linkage"
      collection_method: "calibrated scale and inventory reconciliation"
      unit: "kg"
      frequency: "each issue; monthly reconciliation"
      temporal_coverage: "same period as yarn output"
      site_scope: "included lines only"
      aggregation_rule: "consumed mass = opening stock + receipts - returns - closing stock - documented transfers"
      quality_evidence: "scale calibration; purchase invoice; safety data sheet; stock reconciliation"
    - protocol_id: cp_packaging_mass
      process_id: "secondary_staple_spinning"
      flow_role: "paperboard_yarn_cone; ldpe_stretch_film"
      record_type: "bill of materials, package count, and component weighing"
      raw_fields: "package configuration; component identity; component count; representative component mass; total yarn mass shipped"
      collection_method: "count components and verify mass on a calibrated scale"
      unit: "kg"
      frequency: "each package configuration; monthly aggregation"
      temporal_coverage: "same period as yarn output"
      site_scope: "packages leaving the included mill gate"
      aggregation_rule: "component mass = count multiplied by verified unit mass, reconciled with issues and returns"
      quality_evidence: "bill of materials; scale calibration; issue record; shipment record"
    - protocol_id: cp_yarn_output_mass
      process_id: "secondary_staple_spinning"
      flow_role: "artificial_staple_fibre_yarn_output"
      record_type: "final scale and quality-release record"
      raw_fields: "product id; lot id; gross package mass; cone mass; wrap mass; net yarn mass; moisture basis; composition; yarn count; twist; release status"
      collection_method: "calibrated final weighing and quality release"
      unit: "kg"
      frequency: "each finished lot"
      temporal_coverage: "same period as all input and waste records"
      site_scope: "all conforming output from included lines"
      aggregation_rule: "sum released net yarn mass; exclude removable packaging and nonconforming output"
      quality_evidence: "scale calibration; release certificate; composition evidence; batch record"
    - protocol_id: cp_waste_mass
      process_id: "secondary_staple_spinning"
      flow_role: "viscose_fibre_fly_waste; viscose_yarn_waste"
      record_type: "segregated waste-container and dispatch record"
      raw_fields: "waste row id; container id; gross mass; tare mass; lot or line; destination; stock change"
      collection_method: "segregated collection and calibrated weighing"
      unit: "kg"
      frequency: "each container or dispatch; monthly reconciliation"
      temporal_coverage: "same period as yarn output"
      site_scope: "all included lines and directly attributable collection points"
      aggregation_rule: "net waste mass = gross - tare, adjusted for opening and closing waste stock"
      quality_evidence: "scale calibration; photographs or container labels; dispatch receipt; destination record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized exchange = period exchange / period net conforming yarn output"
      inputs:
        - "measured period exchange"
        - "measured net conforming yarn output"
      output: "exchange per 1 kg net yarn"
      source_ids: []
    - id: calc_artificial_fibre_share
      applies_to: "reference-product composition"
      rule: "artificial staple-fibre share = summed mass of artificial staple-fibre constituents / summed mass of all fibre constituents, on one declared moisture basis"
      inputs:
        - "constituent fibre masses"
        - "fibre generic names"
        - "moisture basis"
      output: "artificial staple-fibre mass fraction"
      source_ids:
        - unsd-cpc-3-2025
    - id: calc_fibre_mass_reconciliation
      applies_to: "fibre-bearing inputs and outputs"
      rule: "reconcile fibre input with net yarn output, viscose fibre fly waste, viscose yarn waste, other separately identified fibre-bearing outputs, and measured stock change; investigate and disclose any residual"
      inputs:
        - "fibre input"
        - "yarn output"
        - "each fibre-bearing waste"
        - "other fibre-bearing outputs"
        - "stock change"
      output: "mass-reconciliation residual and explanation"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all flow rows"
      requirement: "Preserve one physical or chemical identity per row and retain supplier or waste-destination evidence; unresolved UUID rows must remain human-readable and must not receive a broader candidate UUID."
      evidence: "supplier specification; safety data sheet; package bill of materials; waste dispatch record; manifest review metadata"
    - id: dq_temporal
      applies_to: "foreground inventory"
      requirement: "Use one common reporting period and reconcile opening and closing stocks for fibre, lubricant, yarn, packaging, and waste."
      evidence: "dated meter, stock, production, and dispatch records"
    - id: dq_measurement
      applies_to: "mass and electricity"
      requirement: "Use calibrated scales and meters; retain calibration status, raw readings, tare treatment, and unit conversions."
      evidence: "calibration certificates; raw readings; calculation workbook"
    - id: dq_composition
      applies_to: "reference yarn"
      requirement: "Demonstrate at least 85% artificial staple fibres by mass on the declared moisture basis and identify every constituent fibre."
      evidence: "supplier composition evidence or full laboratory report; batch formulation; moisture-basis record"
    - id: dq_completeness
      applies_to: "included foreground process"
      requirement: "Cover every included process step and separately record all actual fibre constituents, electricity scenarios, purchased lubricant products, packaging components, waste streams, and direct elementary emissions if present."
      evidence: "process map; purchasing records; meter coverage; waste register; emission monitoring records where applicable"
    - id: dq_representativeness
      applies_to: "upstream links"
      requirement: "Match fibre identity, electricity geography and voltage, lubricant product, packaging material, technology, and period; disclose every proxy."
      evidence: "upstream dataset metadata and proxy assessment"
