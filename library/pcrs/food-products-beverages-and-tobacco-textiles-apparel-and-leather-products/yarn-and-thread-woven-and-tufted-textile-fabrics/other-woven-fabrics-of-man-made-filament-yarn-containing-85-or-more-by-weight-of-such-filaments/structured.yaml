    - id: dq_emissions
      applies_to: "wastewater and waste gas"
      requirement: "Characterise relevant streams from the chemical inventory and process route, use recognised measurement methods, retain detection limits, and match samples to representative operating conditions."
      evidence: "accredited laboratory results; sampling plan; method reference; eu-textiles-bat-2022-2508"
    - id: dq_completeness
      applies_to: "full inventory"
      requirement: "Reconcile annual or campaign material, water, energy, wastewater, recovered material, and waste totals to process-level records; report missing data and cut-offs explicitly."
      evidence: "input-output inventory; water and energy balances; waste manifests; eu-textiles-bat-2022-2508"
validation_rules:
  - rule_id: val_category_identity
    applies_to: "product identity"
    rule: "Fail validation if the product is not woven fabric, the man-made filament share is below 85% of textile-fibre mass, or a more specific excluded category governs the product."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: val_reference_flow
    applies_to: "quantitative reference"
    rule: "Require exactly 1 kg net conforming fabric linked to product flow 6604db91-24a3-43c8-aeec-8384210e643f, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and kg; packaging mass must not be included."
    source_ids: []
  - rule_id: val_qualifiers
    applies_to: "reference-flow metadata"
    rule: "Require every listed qualifier, including polymer/composition, weave, mass per area, width, treatment state, finish, conditioning basis, geography, period, and packaging inclusion."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_route_boundary
    applies_to: "process coverage"
    rule: "Require yarn preparation, weaving, inspection, and packing; require every conditional wet or finishing process actually used and a reason for each omitted conditional process."
    source_ids:
      - eu-textiles-bat-2022-2508
  - rule_id: val_input_output_inventory
    applies_to: "foreground inventory"
    rule: "Require process-level material, chemical, water, energy, product, wastewater, direct-emission, recovered-material, and waste records relevant to the declared route, with no double counting between waste flows and elementary releases."
    source_ids:
      - eu-textiles-bat-2022-2508
  - rule_id: val_mass_balance
    applies_to: "material consistency"
    rule: "Require a reproducible process and full-system mass balance; flag unexplained residuals for review rather than silently adjusting an input or output."
    source_ids:
      - eu-textiles-bat-2022-2508
  - rule_id: val_allocation
    applies_to: "shared and multi-output processes"
    rule: "Require evidence that subdivision was attempted first and validate the selected physical or last-resort other allocation relationship, factors, period, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_data_quality
    applies_to: "dataset fitness"
    rule: "Require traceable raw records, calibration or equivalent quality evidence, temporal coverage, site and technology representativeness, upstream dataset references, and explicit gap disclosure."
    source_ids:
      - eu-pef-2021-2279
      - eu-textiles-bat-2022-2508
  - rule_id: val_source_traceability
    applies_to: "evidence-bearing rules"
    rule: "Require every cited source id to resolve in Data Sources and prohibit search summaries, authoring logs, and Tiangong lookup traces from being treated as external evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for the declared woven man-made-filament fabric"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA of downstream textile conversion, apparel, furnishings, industrial textile products, procurement comparisons, and supply-chain modelling when category, geography, technology, period, and supplied state are representative"
  excluded_use: "Direct comparison of fabrics with different function or durability; attribution to fibre or yarn production alone; products below the 85% threshold or in excluded special-fabric categories; use-phase or end-of-life claims not modelled by this factory-gate dataset"
  required_metadata: "canonical PCR id; product flow UUID; composition and polymer mix; weave; mass per area and width; supplied treatment state; process route; site geography; reference period; conditioning basis; packaging inclusion; upstream datasets; allocation method"
  required_quality_disclosure: "process coverage; primary-data share; meter and laboratory coverage; temporal, technological, geographical, and precision representativeness; mass-balance residuals; shared-utility allocation; relevant emission measurements; data gaps; cut-offs; uncertainty and sensitivity"
  update_trigger: "Change in polymer or composition class, weave or mass-per-area specification, supplied state, process route, chemistry, energy or water system, emission control, allocation basis, site mix, upstream datasets, or reference period that could materially change the inventory"
