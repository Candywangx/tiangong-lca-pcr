  calculation_rules:
    - id: calc_reference_normalisation
      applies_to: "all inventory rows"
      rule: "normalized quantity = quantity attributable to the product route / net conforming reference-product mass from the same period"
      inputs:
        - "attributable quantity"
        - "net conforming fabric mass"
      output: "quantity per 1 kg reference product"
      source_ids:
        - eu-textiles-bat-2022-2508
    - id: calc_composition_share
      applies_to: "product category threshold"
      rule: "man-made filament share (%) = man-made filament mass / total textile-fibre mass x 100; require result >= 85"
      inputs:
        - "supplier composition and verified textile-fibre masses"
      output: "man-made filament mass percentage"
      source_ids:
        - unsd-cpc-3-0-2025
    - id: calc_area_to_mass
      applies_to: "length or area production records"
      rule: "fabric mass (kg) = usable area (m2) x measured mass per area (g/m2) / 1000; reconcile against scale mass and investigate material variance"
      inputs:
        - "usable length"
        - "usable width"
        - "measured mass per area"
        - "scale mass"
      output: "conditioned fabric mass"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_water_net_use
      applies_to: "wet processes"
      rule: "net external water = gross external intake - metered water returned for internal reuse within the foreground system; report gross intake and reuse alongside net use"
      inputs:
        - "water intake"
        - "internal reuse"
        - "treated textile mass"
      output: "m3 water per kg process output"
      source_ids:
        - eu-textiles-bat-2022-2508
    - id: calc_emission_mass
      applies_to: "direct air or water releases"
      rule: "pollutant mass = representative concentration x measured discharge or exhaust volume, with unit conversion and matching operating period"
      inputs:
        - concentration
        - "flow or discharge volume"
        - "operating time"
      output: "kg pollutant per kg process output"
      source_ids:
        - eu-textiles-bat-2022-2508
    - id: calc_mass_balance
      applies_to: "each process and full foreground system"
      rule: "reconcile conditioned material inputs with product outputs, exported wastes, direct mass releases, and documented inventory change; explain residuals rather than forcing balance"
      inputs:
        - "input mass"
        - "product mass"
        - "waste mass"
        - "release mass"
        - "inventory change"
      output: "mass-balance residual and reconciliation statement"
      source_ids:
        - eu-textiles-bat-2022-2508
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and material inputs"
      requirement: "Retain supplier declarations and batch tests for polymer type, filament share, weave, mass per area, usable width, finish, and conditioned mass; demonstrate the >=85% threshold for the represented product mix."
      evidence: "supplier certificates; laboratory reports; roll and batch records"
    - id: dq_process_coverage
      applies_to: "process map"
      requirement: "Map every actual operation and emission-control step to a process id; document why each conditional process is included or omitted and reconcile transfers between processes."
