allocation_rules:
  - rule_id: alloc_subdivide_first
    applies_to: "multi-output and shared processes"
    rule: "Avoid allocation by separately metering or otherwise subdividing operations attributable to the declared fabric; investigate justified system expansion only when the additional function is included and reported consistently."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_physical_relation
    applies_to: "inseparable shared inputs and outputs"
    rule: "If subdivision or justified system expansion is not possible, allocate using a documented physical relationship that reflects causality, such as conditioned mass, machine time, or measured energy demand."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_other_relation_last
    applies_to: "shared burdens lacking a defensible physical relationship"
    rule: "Use another relationship such as relative economic value only as a last resort; disclose the products, prices, period, currency, factor calculation, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_internal_reuse
    applies_to: "internally reused water, heat, size, or fabric"
    rule: "Record gross generation or intake and internal reuse separately; count only net external inputs and final outputs, and do not award an avoided-product credit inside the same foreground system."
    source_ids:
      - eu-textiles-bat-2022-2508
  - rule_id: alloc_waste_and_recovery
    applies_to: "exported residues and recovered materials"
    rule: "Keep waste treatment and any recovered-material output distinct. Apply credits or end-of-life formulas only when required by the governing study method, with the method and parameters disclosed."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "p01_yarn_preparation_weaving_p02_wet_pretreatment_p03_coloration_finishing"
      flow_role: "yarn and intermediate fabric inputs"
      record_type: "weighbridge, scale, ERP issue/return, supplier record"
      raw_fields: "batch_id; material_id; polymer; filament_share; gross_mass; tare; conditioned_mass; moisture_basis; return_mass"
      collection_method: "calibrated weighing reconciled to issued and returned quantities"
      unit: "kg"
      frequency: "each receipt and batch transfer"
      temporal_coverage: "representative production period, normally at least 12 consecutive months or justified campaign"
      site_scope: "all sites and lines producing the declared product"
      aggregation_rule: "sum net conditioned mass by process and product route, then divide by conforming output mass"
      quality_evidence: "calibration certificates; supplier composition declarations; batch reconciliation"
    - protocol_id: cp_chemical_use
      process_id: "p01_yarn_preparation_weaving"
      flow_role: "sizing and weaving auxiliaries"
      record_type: "recipe, dispensing log, stock issue/return"
      raw_fields: "batch_id; chemical_name; supplier; active_content; issued_mass; returned_mass; recovered_mass"
      collection_method: "weigh or meter each issued and returned chemical"
      unit: "kg"
      frequency: "each batch or continuous campaign"
      temporal_coverage: "same period as reference output"
      site_scope: "all sizing and weaving lines in scope"
      aggregation_rule: "net external chemical use equals issued minus return and verified internal recovery"
      quality_evidence: "scale/meter calibration; safety data sheet; recipe approval"
    - protocol_id: cp_energy_records
      process_id: "all_processes"
      flow_role: "electricity, fuel, steam, compressed air"
      record_type: "submeter, fuel invoice, boiler or utility log"
      raw_fields: "meter_id; process_id; opening; closing; unit; allocation_driver; operating_hours; recovered_energy"
      collection_method: "direct process metering preferred; documented engineering allocation only for shared meters"
      unit: "kWh or MJ"
      frequency: "continuous or per batch, aggregated monthly"
      temporal_coverage: "same period as reference output"
      site_scope: "all included production and support equipment"
      aggregation_rule: "sum net purchased energy by process; retain recovered energy separately"
      quality_evidence: "meter calibration; invoices; allocation workbook; energy audit"
    - protocol_id: cp_wet_process_records
      process_id: "p02_wet_pretreatment"
