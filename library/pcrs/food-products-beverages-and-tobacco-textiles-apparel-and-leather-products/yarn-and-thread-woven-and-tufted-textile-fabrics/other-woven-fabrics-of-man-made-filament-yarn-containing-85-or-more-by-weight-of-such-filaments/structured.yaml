    - id: dq_measurement
      applies_to: "foreground quantities"
      requirement: "Prefer calibrated direct measurement. For shared utilities, document the allocation driver, meter coverage, calculation, and uncertainty; calculations must remain reproducible from retained raw fields."
      evidence: "calibration certificates; meters; invoices; calculation workbook; audit trail"
    - id: dq_temporal
      applies_to: "foreground dataset"
      requirement: "Use a representative production period, normally at least 12 consecutive months; a shorter campaign requires justification, seasonality assessment, and disclosure of abnormal operating conditions."
      evidence: "dated production, meter, purchase, and discharge records"
