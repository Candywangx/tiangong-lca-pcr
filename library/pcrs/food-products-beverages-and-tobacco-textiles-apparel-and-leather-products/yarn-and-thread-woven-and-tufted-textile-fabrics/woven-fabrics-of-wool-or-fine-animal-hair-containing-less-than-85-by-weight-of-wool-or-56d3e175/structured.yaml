dataset_production:
  collection_protocols:
    - protocol_id: cp_yarn_inputs
      process_id: "integrated_woven_fabric_manufacturing"
      flow_role: "wool-blend and fine-animal-hair-blend yarn inputs"
      record_type: "goods receipt, issue record, and fibre-composition certificate"
      raw_fields: "yarn identity; supplier; lot; fibre composition by mass; received mass; issued mass; returned mass"
      collection_method: "reconcile purchase/receipt and production issue records to the reported fabric lot"
      unit: "kg"
      frequency: "each receipt and lot issue"
      temporal_coverage: "full reporting period and reported lot"
      site_scope: "reporting factory"
      aggregation_rule: "sum net yarn mass attributable to the lot by exact yarn identity"
      quality_evidence: "calibrated scale record; supplier certificate; lot traceability"
    - protocol_id: cp_process_water
      process_id: "integrated_woven_fabric_manufacturing"
      flow_role: "process water input"
      record_type: "meter, batch record, or tank balance"
      raw_fields: "meter start/end; batch volume or mass; density when volume is converted to mass; reuse quantity; lot link"
      collection_method: "read process-level meters or documented batch balances and exclude internally recycled water from repeated boundary counting"
      unit: "kg"
      frequency: "each batch or meter interval"
      temporal_coverage: "full reporting period and reported lot"
      site_scope: "reporting factory"
      aggregation_rule: "aggregate net boundary input attributable to the lot"
      quality_evidence: "meter calibration; water balance; batch log"
    - protocol_id: cp_electricity
      process_id: "integrated_woven_fabric_manufacturing"
      flow_role: "medium-voltage electricity input"
      record_type: "electricity meter and machine runtime record"
      raw_fields: "meter start/end; machine line; runtime; lot; allocation driver"
      collection_method: "use submetered consumption where available and document any allocation of shared electricity"
      unit: "kWh"
      frequency: "each meter interval or production lot"
      temporal_coverage: "full reporting period and reported lot"
      site_scope: "reporting factory"
      aggregation_rule: "aggregate lot-attributable electricity without upstream generation losses"
      quality_evidence: "meter calibration; energy audit; runtime log"
    - protocol_id: cp_steam
      process_id: "integrated_woven_fabric_manufacturing"
      flow_role: "purchased steam input"
      record_type: "steam meter and batch record"
      raw_fields: "steam meter start/end; supplier; pressure or condition; condensate return; lot link"
      collection_method: "use boundary steam-meter readings and assign only the net purchased quantity to the lot"
      unit: "kg"
      frequency: "each meter interval or batch"
      temporal_coverage: "full reporting period and reported lot"
      site_scope: "reporting factory"
      aggregation_rule: "aggregate lot-attributable purchased steam"
      quality_evidence: "meter calibration; supplier invoice; batch log"
    - protocol_id: cp_dispatch_packaging
      process_id: "integrated_woven_fabric_manufacturing"
      flow_role: "paperboard core and LDPE film inputs"
      record_type: "packaging issue and dispatch record"
      raw_fields: "component identity; material; component mass; quantity issued; returned quantity; lot link"
      collection_method: "reconcile packaging-store issues with dispatched rolls"
      unit: "kg"
      frequency: "each dispatch lot"
      temporal_coverage: "full reporting period and reported lot"
      site_scope: "reporting factory"
      aggregation_rule: "sum each packaging component separately; exclude packaging from product mass"
      quality_evidence: "scale record; packaging specification; dispatch record"
    - protocol_id: cp_reference_product
      process_id: "integrated_woven_fabric_manufacturing"
      flow_role: "reference woven fabric output"
      record_type: "production and quality release record"
      raw_fields: "product identity; lot; gross mass; tare; net mass; fibre composition; width; mass per area; finish; moisture or conditioning state; accepted and rejected mass"
      collection_method: "use calibrated net-mass measurement for quality-released output"
      unit: "kg"
      frequency: "each production lot"
      temporal_coverage: "full reporting period and reported lot"
      site_scope: "reporting factory"
      aggregation_rule: "sum compliant net fabric mass only"
      quality_evidence: "calibrated scale; quality release; composition test or supplier traceability"
    - protocol_id: cp_textile_offcuts
      process_id: "integrated_woven_fabric_manufacturing"
      flow_role: "woven-fabric offcuts output"
      record_type: "waste weighing and transfer record"
      raw_fields: "waste identity; source line; lot; mass; storage change; destination"
      collection_method: "weigh the specific offcut stream and reconcile transfers and inventory change"
      unit: "kg"
      frequency: "each transfer and reporting-period close"
      temporal_coverage: "full reporting period and reported lot"
      site_scope: "reporting factory"
      aggregation_rule: "sum net mass leaving as the declared offcut stream"
      quality_evidence: "calibrated scale; waste transfer note; inventory reconciliation"
    - protocol_id: cp_wet_processing_wastewater
      process_id: "integrated_woven_fabric_manufacturing"
      flow_role: "wet-processing wastewater output"
      record_type: "effluent meter and treatment/discharge record"
      raw_fields: "flow or mass; density when converted; batch or line; destination; recycled quantity; lot link"
      collection_method: "meter the wastewater boundary flow and exclude water recycled within the same foreground process"
      unit: "kg"
      frequency: "each discharge interval or batch"
      temporal_coverage: "full reporting period and reported lot"
      site_scope: "reporting factory"
      aggregation_rule: "aggregate net wastewater leaving the process boundary"
      quality_evidence: "meter calibration; water balance; treatment or discharge record"
  calculation_rules:
    - id: calc_lot_normalization
      applies_to: "every foreground exchange"
      rule: "Divide the foreground-recorded lot quantity by the net compliant reference-product mass from the same lot and boundary; preserve the exchange's stated unit."
      inputs:
        - "lot exchange quantity"
        - "lot net compliant fabric mass"
      output: "exchange amount per 1 kg reference product"
      source_ids: []
    - id: calc_textile_mass_reconciliation
      applies_to: "yarn inputs, reference fabric, and textile offcuts"
      rule: "Reconcile net yarn inputs against compliant fabric output, offcut outputs, other separately identified textile outputs, and documented inventory change; investigate rather than hide any residual."
      inputs:
        - "net yarn input"
        - "compliant fabric output"
        - "each textile waste/output"
        - "work-in-progress change"
      output: "disclosed textile mass-balance reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Demonstrate the exact product name, Product flow type, CPC 26540 classification, Mass property, kg reference unit, and lot-specific fibre composition below 85% wool and/or fine animal hair by mass."
      evidence: "state_code 100 Tiangong identity read; product specification; composition certificate or test"
    - id: dq_temporal_linkage
      applies_to: "all exchanges"
      requirement: "Use records covering the same production period and link batch, machine, meter, material, waste, and dispatch records to the reported lot or disclose the allocation basis."
      evidence: "dated primary records and lot traceability"
    - id: dq_input_output_inventory
      applies_to: "integrated process"
      requirement: "Maintain a reviewed inventory of textile materials, process chemicals, water, energy, wastewater, waste gas, and solid waste that identifies quantities and relevant characteristics."
      evidence: "eu-bat-textiles-2022; site input/output inventory"
    - id: dq_atomic_chemical_records
      applies_to: "process chemicals"
      requirement: "Record each actually used chemical formulation as a separate product-flow exchange with its exact commercial or chemical identity and measured lot quantity; aggregated chemical classes are incomplete."
      evidence: "chemical inventory; safety data sheet; batch recipe; issue record"
    - id: dq_route_completeness
      applies_to: "wet processing and finishing"
      requirement: "When on-site wet processing or finishing is declared, retain water and energy balances, exact chemical records, wastewater records, and treatment/discharge destinations for the same route and period."
      evidence: "jrc-textiles-bref-2023; eu-bat-textiles-2022; meter and batch records"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require the exact reference-product UUID, Product flow type, CPC 26540 identity, Mass flow property UUID, kg unit, and all required qualifiers."
    source_ids:
      - unsd-cpc-v3-26540
  - rule_id: validate_composition_threshold
    applies_to: "reference product"
    rule: "Reject a dataset if the declared wool and fine-animal-hair mass share is missing or is not less than 85% of the fabric mass."
    source_ids:
      - unsd-cpc-v3-26540
  - rule_id: validate_reference_mass
    applies_to: "reference amount"
    rule: "Confirm that the denominator is 1 kg net compliant fabric at the declared conditioning or moisture state and excludes dispatch packaging."
    source_ids: []
  - rule_id: validate_process_boundary
    applies_to: "foreground process"
    rule: "Confirm that weaving is included, every on-site route step is declared, upstream purchased-input production is linked rather than duplicated, and outsourced operations are disclosed."
    source_ids:
      - jrc-textiles-bref-2023
      - eu-bat-textiles-2022
  - rule_id: validate_atomic_exchanges
    applies_to: "process inventory"
    rule: "Reject grouped, plural, selector, or placeholder exchanges; each material, chemical, energy supply, packaging component, waste stream, and elementary emission must have its own row and exact identity."
    source_ids:
      - eu-bat-textiles-2022
  - rule_id: validate_foreground_evidence
    applies_to: "inventory amounts"
    rule: "Require foreground meter, transaction, batch, mass-balance, or dispatch evidence for every reported amount; do not substitute an AI-authored quantity or range."
    source_ids: []
  - rule_id: validate_wet_route
    applies_to: "on-site wet processing"
    rule: "If wet processing is present, require process-water and wastewater records, exact chemical rows, energy records, treatment destination, and prevention of double counting for reused water."
    source_ids:
      - eu-bat-textiles-2022
  - rule_id: validate_mass_reconciliation
    applies_to: "textile materials"
    rule: "Require a documented reconciliation of yarn inputs, compliant fabric output, each textile waste/output, and inventory change, with any residual investigated and disclosed."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate product dataset for woven wool- or fine-animal-hair-blend fabric"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product-footprint, process, and lifecyclemodel studies whose product composition, route, geography, period, and finishing state match the declared dataset"
  excluded_use: "Fabrics with 85% or more wool/fine animal hair, nonwoven or knitted products, yarn production, garments, or undisclosed extrapolation across materially different wet-processing and finishing routes"
  required_metadata: "canonical PCR id; reference-product UUID; fibre composition; wool/fine-animal-hair mass share; weave; width; mass per area; colour; finish; conditioning or moisture state; geography; period; technology; on-site and outsourced operations; allocation; packaging state"
