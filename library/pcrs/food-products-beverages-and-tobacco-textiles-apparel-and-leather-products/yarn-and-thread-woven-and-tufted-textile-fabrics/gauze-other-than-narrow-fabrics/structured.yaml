system_boundary:
  rules:
    - rule_id: boundary_received_yarn_to_gate
      applies_to: "foreground system"
      rule: "Include every operated step from yarn receipt through saleable gauze inspection/rolling and packaging, plus on-site utility generation and wastewater treatment; exclude fibre/yarn production from foreground but require upstream datasets."
      source_ids:
        - ifc-textile-ehs-2007
        - ec-ef-method-2021
    - rule_id: boundary_route_gate
      applies_to: "conditional manufacturing routes"
      rule: "Include sizing, wet preparation, bleaching, dyeing, heat setting, direct-fired drying, on-site steam generation and wastewater treatment only when the declared lot actually uses the operation; preserve separate route totals and never average mutually exclusive states or technologies."
      source_ids:
        - jrc-textiles-bref-2023
        - ifc-textile-ehs-2007
    - rule_id: boundary_packaging_tare
      applies_to: "reference output and packaging"
      rule: "Include packaging production and packaging losses in inventory, but exclude all packaging tare from the 1 kg reference-product mass."
      source_ids:
        - ec-ef-method-2021
    - rule_id: boundary_outsourced_steps
      applies_to: "outsourced processing"
      rule: "Include an outsourced operation through a specific upstream process dataset and transport where it lies between received yarn and the declared gate; disclose that it is outsourced and avoid duplicating site utility or emission records."
      source_ids:
        - ec-ef-method-2021
    - rule_id: boundary_post_gate_exclusion
      applies_to: "downstream stages"
      rule: "Exclude distribution after the factory gate, conversion into medical or made-up articles, sterilisation, use and end of life from this foreground package."
      source_ids:
        - unsd-cpc-3-0-2025
        - eu-cn-gauze-narrow-fabric-1989
