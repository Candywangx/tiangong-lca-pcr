  - id: warp_sizing
    name: "Warp sizing and drying"
    inclusion: "conditional"
    inclusion_condition: "Include only when size is applied at the reporting site"
    role: "Apply declared size formulation to protect warp during weaving"
    quantitative_reference: "kg sized warp beam"
  - id: gauze_weaving
    name: "Gauze/leno weaving"
    inclusion: "required"
    inclusion_condition: "Every covered product"
    role: "Interlace ground and crossing/doup warp with weft to produce greige gauze"
    quantitative_reference: "kg greige gauze"
  - id: desizing_scouring
    name: "Desizing, scouring, washing and neutralisation"
    inclusion: "conditional"
    inclusion_condition: "Include when size or impurities are removed at the reporting site"
    role: "Prepare greige gauze for sale or subsequent wet finishing"
    quantitative_reference: "kg prepared gauze"
  - id: peroxide_bleaching
    name: "Hydrogen-peroxide bleaching, washing and neutralisation"
    inclusion: "conditional"
    inclusion_condition: "Include only for a declared peroxide-bleached route"
    role: "Produce bleached gauze without averaging with greige or dyed routes"
    quantitative_reference: "kg bleached gauze"
  - id: reactive_piece_dyeing
    name: "Reactive piece dyeing, fixation and washing"
    inclusion: "conditional"
    inclusion_condition: "Include only for a declared cellulosic route; instantiate one additional atomic exchange for every dye and auxiliary in the actual approved recipe rather than predeclaring an arbitrary dye identity"
    role: "Produce declared dyed gauze"
    quantitative_reference: "kg dyed gauze"
  - id: drying_heat_setting
    name: "Mechanical dewatering, drying and conditional heat setting"
    inclusion: "conditional"
    inclusion_condition: "Include after wet processing and whenever the declared route uses stentering or heat setting"
    role: "Bring gauze to declared dry and dimensional state"
    quantitative_reference: "kg dry finished gauze"
  - id: inspection_rolling_packaging
    name: "Inspection, repair, trimming, rolling and packaging"
    inclusion: "required"
    inclusion_condition: "Every route"
    role: "Produce saleable net gauze and separately inventoried packaging"
    quantitative_reference: "kg net saleable gauze"
  - id: thermal_supply
    name: "On-site natural-gas steam generation"
    inclusion: "conditional"
    inclusion_condition: "Include only when the site burns natural gas to supply steam within the foreground boundary; another boiler fuel requires its own separately reviewed route and atomic fuel and emission rows"
    role: "Supply measured mill steam and record direct combustion exchanges"
    quantitative_reference: "kg steam supplied"
  - id: wastewater_treatment
    name: "On-site textile wastewater treatment and discharge"
    inclusion: "conditional"
    inclusion_condition: "Include when process wastewater is treated and discharged by the reporting site"
    role: "Treat combined measured textile wastewater without hiding individual upstream generating steps"
    quantitative_reference: "m3 wastewater treated"
