allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared processes and utilities"
    rule: "Avoid allocation by subdividing independently metered yarn preparation, weaving, wet-processing, finishing, utility and treatment operations, or by expanding the system only when the substituted function is explicit and justified."
    source_ids:
      - ec-ef-method-2021
  - rule_id: allocation_physical_relation
    applies_to: "unavoidable shared burdens"
    rule: "When subdivision cannot remove a shared burden, use a measured physical causal relationship such as machine time, metered energy, bath volume, steam enthalpy or treated wastewater volume. Do not use net product mass merely because it is available if it does not drive the burden."
    source_ids:
      - ec-ef-method-2021
  - rule_id: allocation_economic_last
    applies_to: "residual multifunctionality"
    rule: "Use economic allocation only when no defensible physical relationship exists; disclose prices, period, currency, volatility and sensitivity, and do not mix economic and physical allocation for the same burden."
    source_ids:
      - ec-ef-method-2021
  - rule_id: allocation_internal_recycling
    applies_to: "yarn, size liquor, water, condensate and textile scrap returned within the system"
    rule: "Treat verified same-system reuse as an internal loop: record gross input, recovered amount, purge or loss and loop energy, but do not create a co-product credit for material returned to the same foreground system."
    source_ids:
      - ec-ef-method-2021
      - ifc-textile-ehs-2007
  - rule_id: allocation_external_scrap
    applies_to: "sold or transferred yarn, gauze, polymer, paperboard or sludge outputs"
    rule: "Keep each external output mass and disposition separate. Apply the chosen multifunctionality hierarchy consistently; no avoided-burden credit may be asserted without a documented substituted product and compatible downstream boundary."
    source_ids:
      - ec-ef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_yarn_preparation
      process_id: "yarn_preparation"
      flow_role: "yarn, electricity, prepared beam and yarn waste"
      record_type: "weigh tickets, ERP issues, submeters and waste logs"
      raw_fields: "yarn lot; fibre composition; gross/tare/net mass; conditioning basis; kWh; prepared-beam mass; waste mass"
      collection_method: "Calibrated scales, supplier/ERP reconciliation, submeter or documented main-meter allocation"
      unit: "kg; kWh"
      frequency: "each lot and monthly meter close"
      temporal_coverage: "At least 12 representative months or the complete shorter campaign"
      site_scope: "All winding, warping and beaming equipment serving the declared output"
      aggregation_rule: "Sum matched records and normalize by conditioned prepared output and final reference mass"
      quality_evidence: "Scale and meter calibration; lot genealogy; invoice/ERP reconciliation; missing-record log"
    - protocol_id: cp_warp_sizing
      process_id: "warp_sizing"
      flow_role: "warp, each size constituent, water, electricity, steam, sized beam and wastewater"
      record_type: "batch recipe, chemical issue, concentration, meters, mass and tank records"
      raw_fields: "warp mass; each chemical mass and concentration; water; kWh; steam; sized mass; effluent volume"
      collection_method: "Recipe-to-issue reconciliation with calibrated meters and scales"
      unit: "kg; m3; kWh"
      frequency: "each sizing batch and monthly meter close"
      temporal_coverage: "Same period as sized warp used in declared gauze"
      site_scope: "All applicable sizing ranges"
      aggregation_rule: "Calculate active constituent mass separately; sum utilities; normalize by sized warp and reference output"
      quality_evidence: "Recipe approval; concentration certificate; meter calibration; mass-balance review"
    - protocol_id: cp_gauze_weaving
      process_id: "gauze_weaving"
      flow_role: "warp, weft, loom utilities, greige gauze, waste, wastewater and dust"
      record_type: "loom production log, yarn issue, submeter, flow meter, waste scale and air test"
      raw_fields: "loom type; warp/weft mass; kWh; Nm3 air; m3 water; greige mass; waste; exhaust concentration and volume"
      collection_method: "Lot-level loom records with route-specific meters or documented equipment allocation"
      unit: "kg; kWh; Nm3; m3"
      frequency: "each lot; utilities at least shift or monthly"
      temporal_coverage: "Representative campaign covering declared loom routes"
      site_scope: "All looms producing the declared gauze"
      aggregation_rule: "Preserve route totals; normalize by conditioned greige output"
      quality_evidence: "Loom genealogy; calibration; downtime record; waste reconciliation; laboratory report"
    - protocol_id: cp_desizing_scouring
      process_id: "desizing_scouring"
      flow_role: "greige input, each chemical and enzyme preparation, water, steam, electricity, prepared gauze and wastewater"
      record_type: "batch sheet, issue records, formulation concentration or enzyme activity, meters, mass and effluent logs"
      raw_fields: "textile dry mass; each chemical or enzyme-preparation mass; concentration or activity; water; steam; kWh; output dry mass; wastewater"
      collection_method: "Batch reconciliation and calibrated line meters"
      unit: "kg; m3; kWh"
      frequency: "each batch and monthly close"
      temporal_coverage: "Same wet-preparation campaigns as declared output"
      site_scope: "All desizing/scouring lines in scope"
      aggregation_rule: "Keep each chemical or enzyme preparation atomic; sum utilities; normalize by dry prepared gauze"
      quality_evidence: "Recipe version; formulation certificate or enzyme-activity evidence; meter calibration; inlet/output dry-mass test; effluent reconciliation"
    - protocol_id: cp_peroxide_bleaching
      process_id: "peroxide_bleaching"
      flow_role: "prepared input, peroxide, alkali, acid, water, steam, electricity, bleached gauze and wastewater"
      record_type: "batch sheet, chemical issues, meters, whiteness and mass tests"
      raw_fields: "input/output dry mass; active H2O2, NaOH and acetic acid; water; steam; kWh; wastewater"
      collection_method: "Batch-level chemical and utility reconciliation"
      unit: "kg; m3; kWh"
      frequency: "each bleach batch and monthly close"
      temporal_coverage: "Same bleach campaigns as declared output"
      site_scope: "All peroxide-bleaching lines in scope"
      aggregation_rule: "Keep chemicals atomic; normalize by dry bleached gauze"
      quality_evidence: "Recipe and concentration evidence; calibration; whiteness test; wastewater log"
    - protocol_id: cp_reactive_dyeing
      process_id: "reactive_piece_dyeing"
      flow_role: "textile, each dye/auxiliary, water, steam, electricity, dyed gauze and wastewater"
      record_type: "colour recipe, issue records, meters, shade and mass tests"
      raw_fields: "Colour Index identity; formulation concentration; each chemical mass; textile dry mass; water; steam; kWh; wastewater"
      collection_method: "Recipe-to-issue reconciliation and calibrated meters"
      unit: "kg; m3; kWh"
      frequency: "each dye lot and monthly close"
      temporal_coverage: "Same dye campaigns as declared output"
      site_scope: "Each declared reactive-dyeing line"
      aggregation_rule: "Never aggregate dyes or auxiliaries into a collection row; normalize by dry dyed gauze"
      quality_evidence: "Approved colour recipe; SDS/certificate; shade result; meter calibration; effluent log"
    - protocol_id: cp_drying_finishing
      process_id: "drying_heat_setting"
      flow_role: "wet textile, electricity, indirect steam, direct gas, dry textile and stack emissions"
      record_type: "dryer batch log, moisture tests, electricity, steam and gas meters, and stack reports"
      raw_fields: "wet/dry mass; kWh; steam mass and conditions; gas volume; net calorific value; stack concentrations and gas volume"
      collection_method: "Matched batch, energy and emissions records"
      unit: "kg; kWh; MJ"
      frequency: "each campaign; fuel, steam and electricity monthly; stack per permit"
      temporal_coverage: "Representative period for each drying technology"
      site_scope: "Each dryer/stenter route in scope"
      aggregation_rule: "Preserve indirect-steam, direct-fired and other separately declared heat routes; normalize by dry output"
      quality_evidence: "Moisture test; meter calibration; steam balance; fuel invoice; stack method and laboratory accreditation"
    - protocol_id: cp_final_finishing_packaging
      process_id: "inspection_rolling_packaging"
      flow_role: "inspected gauze, electricity, each packaging material, reference output and wastes"
      record_type: "inspection log, scales, packaging issues, meter and waste log"
      raw_fields: "width; length; mass/area; gross/tare/net mass; kWh; core, film and board mass; rejects and scraps"
      collection_method: "Calibrated product and tare weighing with lot genealogy"
      unit: "kg; cm; m; g/m2; kWh"
      frequency: "each saleable roll or batch and monthly reconciliation"
      temporal_coverage: "Complete declared output period"
      site_scope: "All inspection, rolling and packaging lines"
      aggregation_rule: "Sum net product only for reference flow; separately normalize every packaging and waste row"
      quality_evidence: "Scale calibration; width and mass/area test; inspection release; packaging bill and waste receipts"
    - protocol_id: cp_thermal_supply
      process_id: "thermal_supply"
      flow_role: "gas, feedwater, electricity, steam, blowdown and stack emissions"
      record_type: "fuel, water, electricity and steam meters; fuel certificate; stack tests"
      raw_fields: "gas volume; NCV; feedwater; condensate return; kWh; steam mass/conditions; blowdown; stack results"
      collection_method: "Calibrated utility meters and permit-compliant stack measurement"
      unit: "MJ; m3; kWh; kg"
      frequency: "continuous or monthly; stack per permit"
      temporal_coverage: "Same period as consuming processes"
      site_scope: "Boiler units supplying foreground steam"
      aggregation_rule: "Calculate fuel energy from measured volume and NCV; normalize by delivered steam and final output"
      quality_evidence: "Meter calibration; supplier NCV; steam balance; stack report; blowdown log"
    - protocol_id: cp_wastewater_treatment
      process_id: "wastewater_treatment"
      flow_role: "inlet wastewater, electricity, each treatment chemical, discharged water, pollutants and sludge"
      record_type: "inlet/outlet flow, dosing, laboratory, electricity, sludge and disposal records"
      raw_fields: "m3; each chemical mass/concentration; kWh; pH; BOD; COD; TSS; TN; TP; AOX; sludge wet/dry mass"
      collection_method: "Composite sampling matched to calibrated flow and dosing records"
      unit: "m3; kg; kWh; mg/L"
      frequency: "flow continuous; chemistry at permit frequency; monthly mass balance"
      temporal_coverage: "Same period as generating wet operations"
      site_scope: "Entire on-site treatment system and declared outfalls"
      aggregation_rule: "Concentration x matched volume; keep pollutant rows separate; normalize both per m3 and reference output"
      quality_evidence: "Accredited laboratory; chain of custody; flow-meter calibration; permit; sludge receipt; inlet/outlet reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "Normalized amount = period amount attributable to declared route / net kg saleable gauze from the same route and period."
      inputs:
        - "Matched flow record"
        - "route allocation"
        - reference_net_mass
      output: "amount per 1 kg net saleable gauze"
      source_ids:
        - ec-ef-method-2021
    - id: calc_active_chemical_mass
      applies_to: "chemical solutions and formulations"
      rule: "Active constituent mass = as-used solution mass x certified mass fraction. Preserve carrier water or solvent as separate flow when material."
      inputs:
        - "issue mass"
        - "concentration certificate"
        - "batch recipe"
      output: "kg active constituent"
      source_ids:
        - ifc-textile-ehs-2007
    - id: calc_textile_mass_balance
      applies_to: "yarn through final gauze"
      rule: "Conditioned yarn input + retained dry size = conditioned saleable gauze + textile waste + measured inventory change; investigate residual rather than assigning it to product."
      inputs:
        - "conditioned input/output/waste masses"
        - "retained size"
        - "inventory change"
      output: "mass-balance residual and yield"
      source_ids:
        - ec-ef-method-2021
    - id: calc_pollutant_load
      applies_to: "each water or air pollutant"
      rule: "Emitted mass = representative measured concentration x matched standardized gas or effluent volume, with unit conversion and non-detect treatment disclosed."
      inputs:
        - concentration
        - "flow/volume"
        - "sampling period"
      output: "kg pollutant per period and per reference flow"
      source_ids:
        - ifc-textile-ehs-2007
    - id: calc_thermal_energy
      applies_to: "natural gas"
      rule: "Net calorific energy = metered gas volume x supplier net calorific value for the same period; do not substitute a higher heating value without disclosure."
      inputs:
        - "gas volume"
        - NCV
      output: "MJ natural-gas input"
      source_ids:
        - ec-ef-method-2021
    - id: calc_wet_finish_totals
      applies_to: "comparable full woven-fabric-finishing route"
      rule: "Sum water, electricity and thermal energy over all applicable preparation, bleaching/dyeing, washing and drying steps before comparing with the official QA guardrails; never apply the aggregate range to each step."
      inputs:
        - "route-specific wet-operation rows and dry finished mass"
      output: "aggregate L/kg, kWh/kg and MJ/kg"
      source_ids:
        - ifc-textile-ehs-2007
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and route"
      requirement: "Demonstrate gauze warp construction, width greater than 30 cm, fibre composition, finish state, lot genealogy and exact route; reject medical articles, nonwovens and other excluded identities."
      evidence: "Weave specification, width and mass/area test, product specification, lot and classification record; unsd-cpc-3-0-2025; eu-cn-gauze-narrow-fabric-1989"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Use at least 12 representative months when continuous production exists; a shorter complete campaign is acceptable only with seasonality, start-up, downtime and representativeness disclosed."
      evidence: "Meter periods, production schedule, downtime and campaign records; ec-ef-method-2021"
    - id: dq_completeness
      applies_to: "material, utility, waste and emission inventory"
      requirement: "Reconcile purchase/issue, meters, product and waste. Every actual yarn, size constituent, dye, auxiliary, fuel, packaging component, waste and direct emission is a separate atomic row; zero or not-applicable requires evidence."
      evidence: "Reconciliation workbook, recipes, invoices, meters, waste receipts, laboratory and permit records"
    - id: dq_route_separation
      applies_to: "mutually exclusive routes"
      requirement: "Keep greige, prepared, bleached, dyed, loom-technology, direct-fired/indirect-heated and on-site/purchased-steam routes separate through collection and normalization."
      evidence: "Route-coded production and utility records; ifc-textile-ehs-2007"
    - id: dq_measurement
      applies_to: "scales, meters and laboratory results"
      requirement: "Use calibrated equipment, matched sampling and traceable methods; retain uncertainty, non-detect treatment and data corrections."
      evidence: "Calibration certificates, chain of custody, accredited laboratory reports; ifc-textile-ehs-2007"
    - id: dq_secondary_data
      applies_to: "upstream datasets"
      requirement: "Select geographically, technologically and temporally representative yarn, electricity, fuel, chemical, water, packaging and treatment datasets; document every proxy and its effect."
      evidence: "Dataset metadata, selection record and sensitivity; ec-ef-method-2021"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
    rule: "Confirm gauze/leno warp construction, width greater than 30 cm, net conditioned mass and excluded medical/made-up identities; fail if a broader fabric or medical product UUID is used."
    source_ids:
      - unsd-cpc-3-0-2025
      - eu-cn-gauze-narrow-fabric-1989
  - rule_id: validate_reference_uuid
    applies_to: "Tiangong identity"
    rule: "Before publication, require an exact Product flow UUID plus directly verified CPC 26860, English and Chinese baseName, Mass property UUID, unit-group UUID and reference unit from a state_code=100 read; unresolved status fails publication but not candidate authoring."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "every process inventory"
    rule: "Reject plural selectors or combined carriers. Require one physical or chemical exchange per card and a separate row for every actual dye, auxiliary, fuel, packaging material, waste and elementary emission."
    source_ids: []
  - rule_id: validate_route_gates
    applies_to: "conditional processes"
    rule: "Reject averaging of mutually exclusive greige, bleached, dyed, loom, drying and thermal-supply routes; each included process must have an affirmative production record and each excluded route an explicit not-applicable basis."
    source_ids:
      - ifc-textile-ehs-2007
      - jrc-textiles-bref-2023
  - rule_id: validate_mass_balance
    applies_to: "textile chain"
    rule: "Reconcile conditioned yarn, retained size, intermediate transfers, saleable gauze, textile wastes and inventory change; investigate and disclose residuals."
    source_ids:
      - ec-ef-method-2021
  - rule_id: validate_packaging_tare
    applies_to: "reference output"
    rule: "Confirm reference mass excludes core, film, carton, pallet and other packaging while each consumed packaging component remains in inventory."
    source_ids:
      - ec-ef-method-2021
  - rule_id: validate_wet_finish_resource_qa
    applies_to: "boundary-compatible full woven-fabric-finishing route"
    rule: "Compare aggregate foreground totals, not individual steps, with IFC comparative ranges: electricity 0.5-1.5 kWh/kg, thermal energy 30-70 MJ/kg and water 50-100 L/kg woven fabric finished. These ranges come from limited installations and are QA flags only; explain deviations and never replace measured data."
    source_ids:
      - ifc-textile-ehs-2007
  - rule_id: validate_effluent_qa
    applies_to: "final on-site freshwater discharge"
    rule: "Compare representative discharge with the more stringent applicable permit or IFC guideline values, including pH 6-9, BOD 30 mg/L, COD 160 mg/L, TSS 50 mg/L, AOX 1 mg/L, total phosphorus 2 mg/L and total nitrogen 10 mg/L; report exceedance and do not convert the threshold into an inventory default."
    source_ids:
      - ifc-textile-ehs-2007
  - rule_id: validate_allocation
    applies_to: "shared burdens and external outputs"
    rule: "Require the documented hierarchy of subdivision/system expansion, physical causality and economic allocation; reject unexplained allocation and duplicate recycling credits."
    source_ids:
      - ec-ef-method-2021
  - rule_id: validate_evidence
    applies_to: "final foreground package"
    rule: "Verify coverage, precision, completeness, representativeness, consistency, reproducibility, sources and uncertainty through document review and model validation; retain access to underlying records."
    source_ids:
      - ec-ef-method-2021
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for one declared woven gauze product and route at the factory gate"
  downstream_use: "May support secondary_dataset or background_dataset use after methodology, identity, translation and publication review"
  allowed_use: "Route- and product-specific modelling of gauze fabric production when fibre composition, width, finish state, technology, geography, time and allocation are compatible"
  excluded_use: "Medical gauze or bandage articles; nonwovens; narrow fabrics; glass-fibre fabric; coated/laminated fabric; proxying an undisclosed fibre or finish route; comparative assertion from a candidate or unreviewed dataset"
  required_metadata: "Exact reference-flow identity and UUID status; CPC context; fibre composition; weave construction; width; mass per area; moisture basis; finish state; dye/formulation; loom and wet-processing technology; site and geography; period and production coverage; utility and wastewater routes; packaging configuration; allocation; cut-offs; upstream datasets; unresolved gaps"
  required_quality_disclosure: "Primary-data coverage, calibration, sampling, mass balance, route separation, allocation basis, secondary-data representativeness, uncertainty, deviations from QA guardrails, permit compliance and unresolved UUIDs"
  update_trigger: "Change in product identity, width or weave; fibre or formulation; loom or wet-processing route; utility or wastewater technology; site; allocation; reference-flow identity; material data source; or evidence showing current QA rules are no longer representative"
data_sources:
  - id: "unsd-cpc-3-0-2025"
    type: "standard"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0, structure and explanatory material, 30 June 2025, https://unstats.un.org/unsd/classifications/Econ/CPC and https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv (retrieved 2026-08-21)"
    used_for: "CPC 26860 category boundary and separation from adjacent textile and made-up-article categories"
  - id: "eu-cn-gauze-narrow-fabric-1989"
    type: "standard"
    reference: "Council Regulation (EEC) No 2886/89, Combined Nomenclature Chapter 58 notes for headings 5803 and 5806, https://eur-lex.europa.eu/eli/reg/1989/2886/oj/eng (retrieved 2026-08-21)"
    used_for: "Gauze warp construction and narrow-fabric width definition used for identity and measurement"
  - id: "jrc-textiles-bref-2023"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Best Available Techniques Reference Document for the Textiles Industry, 2023, https://bureau-industrial-transformation.jrc.ec.europa.eu/index.php/reference/textiles-industry (retrieved 2026-08-21)"
    used_for: "Route-gated fibre preparation, pretreatment, enzymatic starch desizing, washing, bleaching, dyeing and finishing operations; water, chemical, energy, wastewater and emission relevance"
  - id: "ifc-textile-ehs-2007"
    type: "official_guidance"
    reference: "World Bank Group/IFC, Environmental, Health, and Safety Guidelines for Textile Manufacturing, 30 April 2007, Annex A and pp. 2-14, https://www.ifc.org/content/dam/ifc/doc/2000/2007-textiles-manufacturing-ehs-guidelines-en.pdf (retrieved 2026-08-21)"
    used_for: "Winding, warping, beaming, sizing, weaving and finishing unit operations; atomic inputs and releases; monitoring; official comparative woven-fabric-finishing and dewatered-sludge ranges; effluent guideline values including TSS"
  - id: "ec-ef-method-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279, Annex I Product Environmental Footprint Method, sections 3.2, 4.5, 4.6 and 8, https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A02021H2279-20211230 (retrieved 2026-08-21)"
    used_for: "Functional unit and reference flow, system boundary, company-specific data, allocation hierarchy, data quality, reporting and verification/validation"
