allocation_rules:
  - rule_id: avoid_allocation_by_subdivision
    applies_to: "independently_meterable_lines_and_batches"
    rule: "First subdivide processes and use line-, machine-, batch-, or product-specific measurements so shared burdens are avoided where practicable."
    source_ids:
      - eu-pef-recommendation-2021
  - rule_id: shared_utility_causal_allocation
    applies_to: "shared_energy_water_air_and_treatment"
    rule: "Allocate shared utilities and treatment burdens using a documented causal driver such as metered consumption, machine operating time and rated load, compressed-air demand, or wastewater volume and pollutant load."
    source_ids:
      - eu-textiles-bat-2022
      - eu-pef-recommendation-2021
  - rule_id: mass_allocation_fallback
    applies_to: "inseparable_fabric_outputs"
    rule: "If causal subdivision is not feasible and multiple fabric grades are jointly produced, allocate remaining burdens by net dry output mass and disclose why physical mass is an appropriate fallback; do not allocate burdens to internal scrap that is immediately returned to the same process."
    source_ids:
      - eu-pef-recommendation-2021
  - rule_id: recovered_material_disclosure
    applies_to: "exported_scrap_recovered_size_and_heat"
    rule: "Report recovered yarn, fabric scrap, sizing agent, water, solvent, or heat separately and disclose the selected downstream recycling or substitution method; do not claim an avoided burden without the downstream modelling rule."
    source_ids:
      - eu-textiles-bat-2022
      - eu-pef-recommendation-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "yarn_preparation_weaving_wet_finishing_inspection_packaging"
      flow_role: "Material inputs, intermediates, conforming output"
      record_type: "Scale tickets, production orders, inventory movements, quality records"
      raw_fields: "lot_id; material_id; fibre composition; wet_mass; moisture; dry_mass; input/output/rework status; timestamp"
      collection_method: "Calibrated scales and lot-level inventory reconciliation"
      unit: "kg dry mass"
      frequency: "Each lot, aggregated monthly"
      temporal_coverage: "At least 12 representative consecutive months or the complete shorter campaign"
      site_scope: "All included lines and facilities"
      aggregation_rule: "Sum dry input and output by process and lot; reconcile stock change, rework, and waste; normalize to conforming output"
      quality_evidence: "Scale calibration, supplier composition evidence, moisture method, and signed reconciliation"
    - protocol_id: cp_chemical_use
      process_id: "yarn_preparation_wet_finishing"
      flow_role: "Sizing, dyes, auxiliaries, and finishes"
      record_type: "Batch recipe, issue/return log, supplier specification"
      raw_fields: "chemical_id; active_content; issued_mass; returned_mass; recovered_mass; batch_id; hazard classification"
      collection_method: "Batch-level material issue and return reconciliation"
      unit: "kg product and kg active substance"
      frequency: "Each batch"
      temporal_coverage: "Same period as production data"
      site_scope: "All included preparation and wet-processing lines"
      aggregation_rule: "Net use equals issued minus returned and recovered quantity; normalize to treated output"
      quality_evidence: "Recipe approval, stock reconciliation, supplier safety and technical data"
    - protocol_id: cp_energy_use
      process_id: "all_foreground_processes"
      flow_role: "Electricity, fuel, steam, and useful heat"
      record_type: "Meters, invoices, fuel logs, operating records"
      raw_fields: "meter_id; start/end reading; energy carrier; fuel quantity; heating value; recovered_heat; machine_hours; allocation_driver"
      collection_method: "Submetering preferred; otherwise documented engineering allocation"
      unit: "kWh, MJ, or MWh"
      frequency: "Continuous or each billing period; aggregate monthly"
      temporal_coverage: "At least 12 representative consecutive months or complete campaign"
      site_scope: "Facility and included process lines"
      aggregation_rule: "Subtract documented recovered energy returned to the same process; allocate shared consumption using the declared causal driver"
      quality_evidence: "Meter calibration, invoice reconciliation, and allocation worksheet"
    - protocol_id: cp_water_and_wastewater
      process_id: "wet_finishing"
      flow_role: "Process water and wastewater"
      record_type: "Flow meters, batch logs, water balances, discharge records"
      raw_fields: "inlet_volume; reused_volume; recycled_volume; discharge_volume; process; batch_id; sampling_period"
      collection_method: "Metered water balance by process; characterize wastewater at relevant points"
      unit: "m3 and pollutant-specific mass"
      frequency: "Continuous or per batch; aggregate monthly"
      temporal_coverage: "At least 12 representative consecutive months or complete campaign"
      site_scope: "All included wet-processing and treatment units"
      aggregation_rule: "Net process water equals inlet minus separately metered reuse/recycling; reconcile discharge, evaporation, product carryover, and stock change"
      quality_evidence: "Meter calibration, water-balance closure, sampling and laboratory reports"
    - protocol_id: cp_waste_and_recovery
      process_id: "all_foreground_processes"
      flow_role: "Solid and liquid residues, recovered materials"
      record_type: "Weighbridge tickets, bins, manifests, recycler receipts"
      raw_fields: "waste_id; mass; moisture; origin_process; hazardous_status; destination; treatment; recovered_quantity"
      collection_method: "Weigh by waste stream and destination"
      unit: "kg dry mass where relevant"
      frequency: "Each shipment; aggregate monthly"
      temporal_coverage: "Same period as production data"
      site_scope: "Entire foreground facility"
      aggregation_rule: "Sum by waste type and route; avoid double counting internal recirculation"
      quality_evidence: "Calibrated scale, manifest, and receiving-facility evidence"
    - protocol_id: cp_emissions_monitoring
      process_id: "weaving_wet_finishing"
      flow_role: "Direct air and water emissions"
      record_type: "Stack tests, continuous monitoring, discharge sampling, operating hours"
      raw_fields: "pollutant; concentration; flow; duration; method; detection_limit; abatement_status; sampling_time"
      collection_method: "Applicable recognized monitoring method and representative sampling"
      unit: "kg pollutant; mg/Nm3; mg/L; m3; h"
      frequency: "At permit or BAT-relevant frequency and during representative operation"
      temporal_coverage: "Same period as production data"
      site_scope: "All relevant direct release points"
      aggregation_rule: "Pollutant mass equals representative concentration multiplied by flow and duration; aggregate release points without double counting"
      quality_evidence: "Laboratory accreditation, method reference, QA/QC blanks, calibration, and permit report"
    - protocol_id: cp_packaging_records
      process_id: "inspection_packaging"
      flow_role: "Packaging supplied with product"
      record_type: "Packaging bill of materials and issue records"
      raw_fields: "material_id; component; unit_mass; quantity; reusable_flag; shipment_id"
      collection_method: "Count components and verify representative unit mass"
      unit: "kg"
      frequency: "Each shipment or packaging configuration"
      temporal_coverage: "Same period as production data"
      site_scope: "All shipped products in scope"
      aggregation_rule: "Sum material-specific packaging mass and normalize to net dry fabric output"
      quality_evidence: "Approved packaging specification and periodic weight check"
  calculation_rules:
    - id: calc_dry_mass
      applies_to: "yarn and fabric mass"
      rule: "dry_mass = measured_wet_mass × (1 - moisture_mass_fraction); use the declared measurement basis and preserve measured values"
      inputs:
        - measured_wet_mass
        - moisture_mass_fraction
      output: "kg dry mass"
      source_ids: []
    - id: calc_normalized_inventory
      applies_to: "every inventory flow"
      rule: "normalized_amount = reporting_period_flow_amount / reporting_period_net_dry_conforming_fabric_output"
      inputs:
        - "flow amount"
        - "net dry conforming output"
      output: "amount per kg reference flow"
      source_ids:
        - eu-pef-recommendation-2021
    - id: calc_fibre_fraction
      applies_to: "product eligibility"
      rule: "synthetic_staple_fraction = dry mass of synthetic staple-fibre components / total dry fibre mass × 100"
      inputs:
        - "component dry masses or verified composition certificate"
      output: "% by mass"
      source_ids: []
    - id: calc_direct_emission_mass
      applies_to: "direct air and water emissions"
      rule: "emission_mass = representative concentration × measured flow × applicable operating or discharge duration, with unit conversion and non-detect treatment disclosed"
      inputs:
        - concentration
        - flow
        - duration
        - "unit conversion"
      output: "kg pollutant"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_mass_balance
      applies_to: "each process and reporting period"
      rule: "mass_balance_gap = material inputs + opening stock - product outputs - waste outputs - closing stock; separately disclose measured volatile or aqueous losses where material"
      inputs:
        - "input/output/waste/stock masses"
      output: "kg and % of inputs"
      source_ids:
        - eu-textiles-bat-2022
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and material inputs"
      requirement: "Retain lot-level composition, polymer type, staple-fibre evidence, construction, finish state, width, mass per unit area, and supplier or production identity."
      evidence: "Product specification, supplier certificate, bill of materials, and lot quality record"
    - id: dq_temporal_representativeness
      applies_to: "all foreground records"
      requirement: "Use a representative continuous 12-month period where available; for shorter campaigns disclose dates, production coverage, seasonality, and reasons the period is representative."
      evidence: "Production calendar, meter coverage, and campaign record"
    - id: dq_technology_geography
      applies_to: "process and upstream datasets"
      requirement: "Identify loom type, wet-processing technology, abatement, facility geography, and upstream dataset geography and technology; justify proxies."
      evidence: "Equipment register, process flow sheet, and dataset metadata"
    - id: dq_completeness
      applies_to: "inputs, outputs, wastes, and direct emissions"
      requirement: "Reconcile material, water, and energy inventories; document excluded flows and demonstrate that conditional operations match the declared market state."
      evidence: "Signed balances, inventory-of-inputs-and-outputs review, and exclusion log"
    - id: dq_measurement_traceability
      applies_to: "measured and calculated amounts"
      requirement: "Preserve raw readings, calibration status, formulas, allocation drivers, sampling methods, detection-limit handling, and responsible person."
      evidence: "Calibration certificates, laboratory reports, invoices, and calculation workbook"
    - id: dq_external_verifiability
      applies_to: "published data package"
      requirement: "Make source references, foreground protocols, quality disclosures, and calculation lineage available for independent review without exposing protected commercial data."
      evidence: "Verification package and reviewer record"
validation_rules:
  - rule_id: validate_category_composition
    applies_to: "reference_product"
    rule: "Confirm that synthetic staple fibres comprise at least 85% by mass and that the product is woven rather than knitted, tufted, or primarily filament-based."
    source_ids:
      - un-cpc-3.0-2025
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "Confirm product-flow UUID b72e06e9-57a4-4e56-8c34-10fa61220193, Mass flow-property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, mass unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and 1 kg net dry reference amount."
    source_ids: []
  - rule_id: validate_route_coverage
    applies_to: "foreground_process_map"
    rule: "Confirm yarn preparation, weaving, inspection, and roll preparation are included and each wet, thermal, coating, printing, lamination, or finishing operation used to reach the declared product state is included or explicitly linked as off-site."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_material_balance
    applies_to: "process_inventory"
    rule: "Require a documented material-balance reconciliation for each process and investigate material gaps before publication."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_wet_process_performance
    applies_to: "conditional_wet_processing"
    rule: "When applicable, compare yearly-average water intensity on the matching process basis with 5–20 m3/t for synthetic-material washing, 10–150 m3/t for fabric batch dyeing, or 2–16 m3/t for continuous dyeing; values outside the relevant screen require explanation and are not automatically invalid."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_thermal_energy
    applies_to: "conditional_thermal_treatment"
    rule: "When thermal treatment is included, compare net yearly-average specific energy with 0.5–4.4 MWh/t of textile material thermally treated; values outside the screen require explanation and are not automatically invalid."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_emission_routing
    applies_to: "waste_and_elementary_outputs"
    rule: "Confirm wastewater to external treatment is a waste flow, direct releases are elementary flows, captured residues are waste flows, and no pollutant mass is double counted."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_allocation_and_quality
    applies_to: "published_foreground_package"
    rule: "Confirm shared burdens use a disclosed causal driver or justified mass fallback and that temporal, technological, geographical, completeness, and traceability evidence is retained."
    source_ids:
      - eu-pef-recommendation-2021
published_dataset_profile:
  dataset_role: "Foreground production data package for woven synthetic staple-fibre fabric manufacture"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product and supply-chain LCA when composition, construction, finish state, technology, geography, reporting period, system boundary, and allocation are compatible with the study"
  excluded_use: "Direct comparison of fabrics with different functions or finish states without equivalence; apparel use-phase claims; polymer or fibre production; knitted, tufted, or synthetic-filament fabric modelling; unsupported facility or regional extrapolation"
  required_metadata: "PCR id; product-flow UUID; composition and polymer types; staple-fibre evidence; construction; greige/finished state; width; mass per unit area; treatment route; loom technology; facility and geography; reporting period; recycled content; allocation; upstream datasets; data owner"
  required_quality_disclosure: "Foreground coverage; meter and scale coverage; dry-mass conversion; mass/water/energy balance results; conditional operations; emission monitoring; allocation drivers; upstream proxy choices; excluded flows; uncertainty and unresolved data gaps"
  update_trigger: "Change in fibre composition or threshold eligibility, yarn source, loom or wet-processing technology, product finish, facility, allocation, abatement, upstream dataset, regulatory requirement, or a material change in water, energy, chemical, waste, or emission intensity"
