system_boundary:
  rules:
    - rule_id: foreground_gate_boundary
      applies_to: "foreground_system_boundary"
      rule: "Include all on-site yarn preparation, warping, sizing, weaving, inspection, roll preparation, and packaging activities from purchased-yarn receipt to the declared fabric at the plant gate; include wet and thermal treatments when performed on site."
      source_ids:
        - eu-textiles-bat-2022
        - eu-textiles-bref-2023
    - rule_id: purchased_input_linkage
      applies_to: "upstream_product_inputs"
      rule: "Record purchased yarn, chemicals, energy carriers, water, and packaging as product inputs and link each material input to a geographically and technologically representative upstream dataset."
      source_ids:
        - eu-pef-recommendation-2021
    - rule_id: conditional_route_disclosure
      applies_to: "conditional_processes"
      rule: "Declare whether sizing, desizing, washing, dyeing, printing, coating, lamination, heat-setting, and finishing occur on site, off site, or not at all; do not silently omit an activity required to reach the declared market state."
      source_ids:
        - eu-textiles-bat-2022
    - rule_id: direct_release_boundary
      applies_to: "elementary_and_waste_flows"
      rule: "Record on-site air emissions and direct water emissions as elementary outputs; record wastewater sent to external treatment and solid residues sent to waste management as waste outputs, with destination and treatment route."
      source_ids:
        - eu-textiles-bat-2022
boundary_abstraction:
  declared_starting_condition: "Purchased synthetic staple-fibre yarn and any other component yarn are received at the reporting facility gate with composition, mass, moisture basis, supplier, and origin declared."
  starting_condition_role: "The purchased yarn is the upstream product input and the starting material for foreground fabric manufacture."
  product_classification_scope: "Woven fabric containing at least 85% synthetic staple fibres by mass; CPC 3.0 code 26740 is classification context, not the canonical PCR identity."
  recursive_input_rule: "If a same-category woven fabric is used as an input, keep it as an explicit product input with its own upstream dataset; do not recursively reproduce its manufacture inside this foreground package."
  upstream_dataset_requirement: "Use representative upstream datasets for purchased yarn, other fibres or yarns, sizing agents, dyes and auxiliaries, fuels, electricity, water, packaging, and external waste treatment; disclose geography, technology, and temporal fit."
  disclosure: "Declare facility, reporting period, loom technology, fabric construction, composition, finish state, included on-site treatments, off-site treatments, allocation, recycled content, and data gaps."
