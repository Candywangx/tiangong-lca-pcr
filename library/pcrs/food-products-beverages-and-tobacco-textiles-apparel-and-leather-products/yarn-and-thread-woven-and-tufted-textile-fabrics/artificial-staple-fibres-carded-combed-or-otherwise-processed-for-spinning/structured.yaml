allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "All foreground operations"
    rule: "Avoid allocation by separately metering or subdividing routes, fibre families, products, and equipment wherever practicable."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_internal_rework
    applies_to: "Fibre returned within the same production system"
    rule: "Treat clean internal rework as an internal loop: record its mass for balance and quality control, but do not create a second input burden, output credit, or co-product."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: allocation_secondary_fibre
    applies_to: "Saleable noil or other secondary fibre"
    rule: "First apply physical subdivision; if subdivision is not possible, use a documented causal physical relationship, and use economic allocation only when no defensible physical relationship exists. Record mass, quality, destination, price period, and sensitivity to the chosen method."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_waste
    applies_to: "Waste, recycling, recovery, and disposal"
    rule: "Do not allocate production burdens to waste merely because it is collected; model treatment and any recycling convention consistently with the goal and scope and disclose it."
    source_ids:
      - eu-textiles-bat-2022
      - eu-environmental-footprint-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_atomic_inventory_records
      process_id: "prepared_fibre_gate_to_gate"
      flow_role: "Every atomic fibre-family input, energy carrier, water input, supplier formulation, packaging material, product, secondary product, waste stream, wastewater stream, and elementary release"
      record_type: "Lot, batch, bill-of-material, meter, invoice, service, waste-transfer, sales, and emission records"
      raw_fields: "lot_id; fibre_name; supplier; composition; incoming_form; moisture_basis; route_steps; atomic_flow_name; flow_direction; flow_type; Tiangong_uuid_or_unresolved_status; quantity; unit; meter_or_scale_id; formulation_SKU; package_material; product_mass; secondary_product_mass; waste_stream; treatment_destination; exhaust_flow; particulate_concentration; operating_time; allocation_driver"
      collection_method: "Create one record line per atomic flow and active route; use calibrated mass and utility measurement where practicable, supplier SKU and SDS/TDS for each formulation, service records for each refrigerant, and monitoring or a transparent calculation for releases"
      unit: "kg; kWh; Nm3; operating hour; concentration and exhaust volume as applicable"
      frequency: "Each lot or campaign; utilities at meter interval; service and emissions at applicable event or monitoring interval"
      temporal_coverage: "At least 12 consecutive representative months or every lot when production is shorter"
      site_scope: "Every included line and shared service, with fibre family and route tags"
      aggregation_rule: "Never pool distinct fibre families, carriers, chemicals, packaging materials, wastes, wastewater streams, or emissions; reconcile stock changes and internal rework once, then normalize each atomic row to 1 kg output"
      quality_evidence: "Calibration and meter records, invoices, fibre certificates, recipes, SDS/TDS, packaging specifications, service logs, waste receipts, sales records, emission reports, route sheet, and signed mass/energy reconciliation"
  calculation_rules:
    - id: calc_specific_input
      applies_to: "Material, water, chemical, waste, and packaging records"
      rule: "specific amount = net amount assigned to declared route / net declared route output mass"
      inputs:
        - "assigned amount"
        - "route output mass"
      output: "kg per kg process or factory-gate output"
      source_ids:
        - eu-environmental-footprint-2021
    - id: calc_specific_electricity
      applies_to: "Electricity records"
      rule: "specific electricity = route-assigned kWh / net route output mass; subtract exported energy and unrelated site use"
      inputs:
        - "metered kWh"
        - "causal allocation driver"
        - "route output mass"
      output: "kWh per kg output"
      source_ids:
        - eu-textiles-bat-2022
        - eu-environmental-footprint-2021
    - id: calc_material_balance
      applies_to: "Every process and complete foreground route"
      rule: "closure = fibre input + applied water or retained formulation mass - prepared outputs - saleable secondary fibre - waste - net stock change; report absolute and percentage imbalance on a consistent moisture basis"
      inputs:
        - "fibre and formulation inputs"
        - "product and secondary outputs"
        - waste
        - "stock change"
        - "moisture data"
      output: "reconciled mass balance and unexplained imbalance"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_particulate_release
      applies_to: "Channelled particulate where monitored"
      rule: "released mass = concentration × dry or otherwise documented exhaust volume, with unit conversion and sampling-period extrapolation disclosed; do not subtract collected dust again"
      inputs:
        - concentration
        - "exhaust flow"
        - "operating time"
        - "abatement boundary"
      output: "kg particulate released per kg route input or output"
      source_ids:
        - eu-textiles-bat-2022
        - hse-textile-dust-guidance
    - id: calc_route_result
      applies_to: "Multi-family or multi-route sites"
      rule: "Calculate each fibre-family and route result separately; a combined result is allowed only as a documented production-mass-weighted aggregation of disclosed component results for a defined geography and period"
      inputs:
        - "component inventories"
        - "production masses"
        - "family and route identifiers"
      output: "transparent production-weighted aggregate and component results"
      source_ids:
        - eu-environmental-footprint-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and input identity"
      requirement: "Retain supplier and lot evidence for accepted fibre name, composition, incoming state, output state, and route; resolve discrepancies before aggregation."
      evidence: "Fibre certificate, bill of materials, lot label, test record, and route sheet"
    - id: dq_route_specificity
      applies_to: "All foreground records"
      requirement: "Tag every record to fibre family, route, machine or line, site, lot or campaign, and reporting period; disclose any shared-service allocation."
      evidence: "Production logs, meter map, and allocation worksheet"
    - id: dq_measurement
      applies_to: "Mass, moisture, water, energy, chemicals, waste, and emissions"
      requirement: "Use calibrated measurement where practicable and retain device, method, unit, frequency, and uncertainty or estimation basis."
      evidence: "Calibration certificates, meter logs, laboratory reports, and method records"
    - id: dq_temporal
      applies_to: "Dataset period"
      requirement: "Cover at least 12 consecutive representative months, or all production in a shorter campaign, and disclose shutdowns, trials, abnormal operation, and missing periods."
      evidence: "Production calendar, downtime log, and completeness statement"
    - id: dq_completeness
      applies_to: "Input-output inventory"
      requirement: "Include all known material, water, energy, product, secondary product, waste, wastewater, and air-emission crossings relevant to the declared operations."
      evidence: "Signed input-output inventory and mass/energy reconciliation"
    - id: dq_estimate_replacement
      applies_to: "Every reasoned_estimate range"
      requirement: "Treat the range only as a candidate QA or initialization screen; replace it with reviewed source-backed or foreground evidence before active or published use, or retain an explicit reviewer acceptance and limitation disclosure."
      evidence: "Review decision and replacement source or approved limitation"
    - id: dq_uuid_resolution
      applies_to: "Non-reference inventory flows"
      requirement: "Select Tiangong flow UUIDs through verified lookup during review; never infer a UUID from a similar label or copy the generic reference-product UUID to unrelated flows."
      evidence: "Lookup evidence retained outside PCR content and reviewer sign-off"
    - id: dq_generic_flow_limit
      applies_to: "Reference product flow"
      requirement: "Preserve the exact generic product UUID and disclose that it does not distinguish fibre family, route, quality, moisture, finish, or delivery form."
      evidence: "Required qualifier fields in the completed data package"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require product UUID 4f65996d-819a-4b51-8c1a-e3c3ecaa96b2, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, reference amount 1, and unit kg."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "Product metadata"
    rule: "Fail conformance when fibre family, composition, input and output state, route, moisture basis, finish condition, site, geography, production period, allocation, or packaging state is missing."
    source_ids:
      - eu-textile-fibre-names-1007-2011
  - rule_id: validate_artificial_not_synthetic
    applies_to: "Category scope"
    rule: "Reject a dataset that uses only synthetic fibres or fails to establish a non-synthetic artificial fibre identity; blends shall report every component and remain within the declared product scope."
    source_ids:
      - eu-textile-fibre-names-1007-2011
      - un-cpc-3-0-2025
  - rule_id: validate_route_gate
    applies_to: "Process map"
    rule: "Require receipt/opening/blending, packing/dispatch, and at least one qualifying preparation path: carding, combing after carding, or a specifically named other spinning-preparation operation."
    source_ids:
      - hse-textile-machinery-standards
  - rule_id: validate_no_unconditional_average
    applies_to: "Aggregation"
    rule: "Reject an unqualified average across materially different fibre families or routes; any combined result shall expose component inventories, production weights, geography, and period."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: validate_mass_basis
    applies_to: "Mass balance"
    rule: "Require input and output moisture bases, consistent reporting periods, stock change, internal rework, secondary fibre, waste, and unexplained imbalance disclosure."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_environmental_crossings
    applies_to: "Emissions and waste"
    rule: "Require recorded or justified-not-applicable particulate, collected dust, fibre waste, packaging waste, water, wastewater, chemicals, and chemical waste for every active route."
    source_ids:
      - eu-textiles-bat-2022
      - hse-textile-dust-guidance
  - rule_id: validate_allocation
    applies_to: "Multi-output operations"
    rule: "Require subdivision where practicable and a documented causal physical or, only when necessary, economic allocation method with mass, quality, destination, price period, and sensitivity for saleable secondary fibre."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: validate_estimates
    applies_to: "Provisional quantitative ranges"
    rule: "Flag every reasoned_estimate as provisional; active or published use requires replacement by reviewed evidence or explicit reviewer acceptance and disclosure."
    source_ids: []
  - rule_id: validate_uuid_limit
    applies_to: "Inventory identity"
    rule: "Fail if an unverified UUID is assigned to a non-reference flow or if the exact generic product UUID is treated as route-specific evidence."
    source_ids: []
  - rule_id: validate_atomic_flows
    applies_to: "Process inventory"
