allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "foreground_burden_allocation"
    rule: "First avoid allocation through submetering, campaign-specific material records, subdivision by loom line and explicit internal-loop accounting."
    source_ids:
      - iso-14044-2006
      - ec-jrc-pef-2021
  - rule_id: allocation_shared_energy
    applies_to: "shared utilities and equipment"
    rule: "Allocate unmetered shared electricity by recorded equipment operating time or loom-hours when these represent the causal driver; disclose idle-load treatment and test material alternatives."
    source_ids:
      - iso-14044-2006
      - toffe-et-al-2019
  - rule_id: allocation_shared_materials
    applies_to: "shared materials and wastes"
    rule: "Allocate shared yarn, sizing, packaging and solid-waste records by measured mass attributable to each product campaign unless a more causal physical parameter is demonstrated."
    source_ids:
      - iso-14044-2006
      - ec-jrc-pef-2021
  - rule_id: allocation_internal_rework
    applies_to: "internal rework"
    rule: "Treat material returned to the same foreground production system as an internal loop with no co-product credit and prevent double counting of its mass and burdens."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_saleable_downgrade
    applies_to: "saleable downgraded fabric"
    rule: "Treat saleable downgraded fabric as a co-product; use a documented physical relationship where defensible and use economic allocation only when physical relationships cannot be justified, with sensitivity disclosure."
    source_ids:
      - iso-14044-2006
      - ec-jrc-pef-2021
  - rule_id: allocation_waste_recovery
    applies_to: "waste sent to recovery"
    rule: "Keep collection and pre-treatment within the foreground boundary; apply recycling or substitution credits only in an explicitly declared downstream method and never as an undocumented negative waste amount."
    source_ids:
      - ec-jrc-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_warping_mass_balance
      process_id: "warping"
      flow_role: "warp yarn, warped beam and yarn waste"
      record_type: "Warehouse issue, scale ticket and campaign log"
      raw_fields: "item id, glass type, yarn specification, lot, opening stock, issued mass, returned mass, beam gross mass, beam tare, waste mass, destination"
      collection_method: "Reconcile calibrated weights and stock movements by campaign"
      unit: "kg"
      frequency: "Each campaign"
      temporal_coverage: "Representative production period"
      site_scope: "All included warping lines"
      aggregation_rule: "Sum accepted records; keep internal reuse separate; normalize only after mass reconciliation"
      quality_evidence: "Calibration certificate, warehouse ledger, campaign log, waste ticket"
    - protocol_id: cp_warping_electricity
      process_id: "warping"
      flow_role: "electricity"
      record_type: "Submeter or main-meter interval record"
      raw_fields: "meter id, start, end, kWh, line state, campaign id, included auxiliaries"
      collection_method: "Submeter difference; otherwise documented allocation from coincident main-meter data"
      unit: "kWh"
      frequency: "Each campaign or interval"
      temporal_coverage: "Representative production period"
      site_scope: "All included warping lines"
      aggregation_rule: "Sum productive and attributable auxiliary intervals; disclose idle treatment"
      quality_evidence: "Meter register, interval export, allocation worksheet"
    - protocol_id: cp_sizing_mass_balance
      process_id: "sizing"
      flow_role: "warped yarn, water, PVA, other formulation components and sized output"
      record_type: "Batch sheet, recipe, meter and scale record"
      raw_fields: "batch id, input beam mass, water, chemical product mass, dry solids, output beam mass, returns, residues"
      collection_method: "Reconcile batch inputs, retained size and outputs"
      unit: "kg"
      frequency: "Each sizing batch"
      temporal_coverage: "Representative production period"
      site_scope: "All included sizing lines"
      aggregation_rule: "Sum valid batches by product; retain supplied and dry-solids bases"
      quality_evidence: "Approved recipe, supplier specification, scale and meter records"
    - protocol_id: cp_sizing_electricity
      process_id: "sizing"
      flow_role: "electricity"
      record_type: "Submeter or main-meter interval record"
      raw_fields: "meter id, start, end, kWh, batch id, dryer and pump state"
      collection_method: "Submeter difference; otherwise documented equipment-time allocation"
      unit: "kWh"
      frequency: "Each batch or interval"
      temporal_coverage: "Representative production period"
      site_scope: "All included sizing lines"
      aggregation_rule: "Sum attributable intervals by batch"
      quality_evidence: "Meter register, interval export, allocation worksheet"
    - protocol_id: cp_sizing_wastewater
      process_id: "sizing"
      flow_role: "wastewater"
      record_type: "Effluent meter, batch balance and laboratory record"
      raw_fields: "discharge mass or volume, density basis, COD, dry solids, treatment route, sample time, batch id"
      collection_method: "Use effluent meter and representative sampling; reconcile with batch water"
      unit: "kg"
      frequency: "Each batch with periodic analysis"
      temporal_coverage: "Representative production period"
      site_scope: "All included sizing discharges"
      aggregation_rule: "Aggregate volume-weighted analytical results and retain treatment routing"
      quality_evidence: "Meter calibration, laboratory report, discharge manifest"
    - protocol_id: cp_weaving_mass_balance
      process_id: "weaving"
      flow_role: "warp, weft, greige output and loom waste"
      record_type: "Beam record, warehouse issue, roll scale and waste ticket"
      raw_fields: "campaign id, product code, warp input, weft issue and return, greige roll gross mass, tare, waste mass, stock change"
      collection_method: "Reconcile calibrated masses for each loom campaign"
      unit: "kg"
      frequency: "Each campaign"
      temporal_coverage: "Representative production period"
      site_scope: "All included looms"
      aggregation_rule: "Sum accepted campaigns after mass-balance review"
      quality_evidence: "Scale calibration, loom ticket, warehouse ledger, waste ticket"
    - protocol_id: cp_weaving_electricity
      process_id: "weaving"
      flow_role: "electricity"
      record_type: "Loom-line submeter or interval record"
      raw_fields: "meter id, loom id, start, end, kWh, operating time, idle time, campaign id"
      collection_method: "Submeter by campaign; otherwise allocate coincident interval use by recorded loom-hours"
      unit: "kWh"
      frequency: "Each campaign or interval"
      temporal_coverage: "Representative production period"
      site_scope: "All included looms and direct extraction"
      aggregation_rule: "Sum attributable intervals; disclose allocation and idle load"
      quality_evidence: "Meter register, machine log, allocation worksheet"
    - protocol_id: cp_weaving_lubricant
      process_id: "weaving"
      flow_role: "lubricating oil"
      record_type: "Stores issue and maintenance record"
      raw_fields: "product id, grade, issued mass, returned mass, machine id, date, campaign"
      collection_method: "Reconcile make-up oil issued and returned"
      unit: "kg"
      frequency: "Each issue, aggregated by campaign"
      temporal_coverage: "Representative production period"
      site_scope: "All included looms"
      aggregation_rule: "Sum net consumed make-up oil by machine campaign"
      quality_evidence: "Safety data sheet, stores ledger, maintenance record"
    - protocol_id: cp_weaving_air_emissions
      process_id: "weaving"
      flow_role: "glass-fibre dust to air"
      record_type: "Stack test, extraction record or permit report"
      raw_fields: "source id, sampling method, concentration, gas flow, operating time, capture status, campaign"
      collection_method: "Calculate released mass only from measured source data aligned to production"
      unit: "kg"
      frequency: "Each valid measurement period"
      temporal_coverage: "Representative operating condition"
      site_scope: "All relevant direct release points"
      aggregation_rule: "Integrate concentration and flow over aligned time; no unsupported inference"
      quality_evidence: "Accredited test report, permit record, operating log"
    - protocol_id: cp_packaging_mass_balance
      process_id: "inspection_packaging"
      flow_role: "greige input, reference output, rejects, cores, film and paperboard waste"
      record_type: "Roll ticket, scale, packaging issue and waste record"
      raw_fields: "roll id, incoming gross and tare, conforming net mass, reject mass, core mass, film issue, other packaging, waste mass, destination"
      collection_method: "Reconcile calibrated roll and packaging masses by campaign"
      unit: "kg"
      frequency: "Each roll or campaign"
      temporal_coverage: "Representative production period"
      site_scope: "All included inspection and packaging lines"
      aggregation_rule: "Sum accepted rolls and packaging issues; exclude removable packaging from product mass"
      quality_evidence: "Scale calibration, roll ticket, bill of materials, waste ticket"
    - protocol_id: cp_packaging_electricity
      process_id: "inspection_packaging"
      flow_role: "electricity"
      record_type: "Submeter or interval record"
      raw_fields: "meter id, start, end, kWh, equipment state, campaign id"
      collection_method: "Submeter difference; otherwise documented equipment-time allocation"
      unit: "kWh"
      frequency: "Each campaign or interval"
      temporal_coverage: "Representative production period"
      site_scope: "All included inspection and packaging equipment"
      aggregation_rule: "Sum attributable intervals by campaign"
      quality_evidence: "Meter register, equipment log, allocation worksheet"
  calculation_rules:
    - id: calc_net_roll_mass
      applies_to: "Greige and conforming rolls"
      rule: "Net fabric mass equals gross roll mass minus verified core, wrapper and other removable tare mass."
      inputs:
        - "Gross scale mass"
        - "core tare"
        - "wrapper tare"
        - "other removable tare"
      output: "Net fabric mass in kg"
      source_ids:
        - techfab-pwc-glass-fabric-2025
    - id: calc_process_intensity
      applies_to: "Every foreground exchange"
      rule: "Normalized exchange equals accepted campaign exchange divided by accepted net output mass for the applicable process or reference product."
      inputs:
        - "Accepted exchange"
        - "accepted process output or reference mass"
      output: "Exchange per kg basis"
      source_ids:
        - iso-14044-2006
        - ec-jrc-pef-2021
    - id: calc_mass_balance
      applies_to: "Each material-processing stage"
      rule: "Reconcile opening stock plus inputs with outputs, closing stock, internal returns and waste; investigate rather than force-close unexplained differences."
      inputs:
        - "Opening stock"
        - inputs
        - "product and intermediate outputs"
        - returns
        - waste
        - "closing stock"
      output: "Documented mass-balance difference"
      source_ids:
        - iso-14044-2006
        - techfab-pwc-glass-fabric-2025
    - id: calc_dry_size
      applies_to: "Sizing formulation and discharge"
      rule: "Dry sizing-agent mass equals supplied product mass multiplied by supplier or measured dry-solids fraction; keep water mass separate."
      inputs:
        - "Supplied product mass"
        - "dry-solids fraction"
      output: "Dry sizing-agent mass in kg"
      source_ids:
        - ec-jrc-textiles-bref-2023
    - id: calc_measured_dust
      applies_to: "Direct glass-fibre dust release"
      rule: "Released mass equals measured concentration multiplied by aligned dry gas volume or flow-time integral, with unit conversions documented."
      inputs:
        - "Measured concentration"
        - "gas flow or volume"
        - "aligned operating time"
      output: "Released particulate mass in kg"
      source_ids:
        - ec-jrc-textiles-bref-2023
  data_quality_requirements:
    - id: dq_technology
      applies_to: "Product and process route"
      requirement: "Identify loom type, weave architecture, glass type, yarn specifications, sizing state, nominal width and areal mass for every aggregated product family."
      evidence: "Product specification, bill of materials and campaign routing"
    - id: dq_temporal
      applies_to: "Foreground activity data"
      requirement: "Use a declared representative period that covers normal operation, start-up, rejects and maintenance effects; identify exclusions and abnormal campaigns."
      evidence: "Production calendar, campaign register and exclusion log"
    - id: dq_geography
      applies_to: "Utilities and upstream datasets"
      requirement: "Match plant country or grid region and disclose the geography of significant yarn, chemical and packaging suppliers."
      evidence: "Site record, supplier declaration and dataset metadata"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Reconcile material mass and account separately for each used utility, sizing component, packaging component, waste stream and measured direct emission; do not collapse them into collection labels."
      evidence: "Mass balance, utility register, formulation, packaging bill and waste register"
    - id: dq_measurement
      applies_to: "Meters and scales"
      requirement: "Use in-calibration instruments and retain raw readings, taring records, data treatment and uncertainty or precision evidence."
      evidence: "Calibration certificates, raw exports and calculation worksheet"
    - id: dq_uuid_identity
      applies_to: "Tiangong references"
      requirement: "Before publication, resolve every used UUID by direct state100 read and confirm name, flow type, property and required qualifiers; unresolved identities remain review blockers."
      evidence: "Tiangong direct-read evidence and reviewer sign-off"
    - id: dq_source_traceability
      applies_to: "Method rules"
      requirement: "Retain the exact cited report, standard or full-text article edition used for each boundary, calculation or quality rule."
      evidence: "Controlled source register and retrieval date"
validation_rules:
  - rule_id: validate_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm the reference product is a woven glass-fibre fabric within CPC 26890 and that excluded nonwoven, knitted, coated, impregnated or composite products are absent."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm the reference output uses UUID 59caf1b9-5a05-4eef-8ba2-bc94aa28f43f, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66 and kg net product mass."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_qualifiers
    applies_to: "foreground_dataset_conformance"
    rule: "Reject an incomplete reference definition unless all required product, process, geography and period qualifiers are declared."
    source_ids:
      - iso-ts-14027-2017
      - iso-14025-2006
  - rule_id: validate_boundary
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm warping, weaving, inspection and packaging are present, on-site sizing is included when performed, upstream yarn production is linked, and excluded finishing and downstream stages are not silently mixed into the foreground package."
    source_ids:
      - ec-jrc-glass-bref-2013
      - ec-jrc-textiles-bref-2023
  - rule_id: validate_atomic_inventory
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm each inventory card represents one concrete exchange and that every actual electricity supply, chemical, packaging material, waste and direct emission is separately represented."
    source_ids:
      - ec-jrc-textiles-bref-2023
  - rule_id: validate_mass_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm stage and overall material balances reconcile within documented measurement precision and that unexplained differences are investigated rather than assigned to an invented flow."
    source_ids:
      - iso-14044-2006
      - techfab-pwc-glass-fabric-2025
  - rule_id: validate_foreground_values
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm inventory amounts come from collected foreground records or calculations from those records; reject unsupported generic or AI-authored numerical ranges."
    source_ids:
      - iso-14044-2006
      - ec-jrc-pef-2021
  - rule_id: validate_allocation
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm allocation is first avoided, any remaining physical or economic allocation is documented and sensitivity is disclosed where method choice could materially affect results."
    source_ids:
      - iso-14044-2006
      - ec-jrc-pef-2021
  - rule_id: validate_uuid_state
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm every UUID stored in the data package resolves at public state100 with exact semantic identity; fail publication on unresolved or mismatched UUIDs."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_bilingual_alignment
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm English and Chinese machine fields, rule order, process order, row order and UUIDs remain aligned."
    source_ids:
      - iso-ts-14027-2017
published_dataset_profile:
  dataset_role: "Product-specific or plant-average cradle-from-yarn-to-gate foreground unit-process package for woven glass-fibre fabric manufacture"
  downstream_use: "Publication as a process dataset and use in lifecyclemodel projections with linked upstream yarn, utility, chemical, packaging and waste-treatment datasets"
  allowed_use: "Products and routes satisfying the declared CPC 26890 boundary, qualifiers, site geography and production period"
  excluded_use: "Nonwoven, knitted, stitched multiaxial, coated, impregnated or composite products; glass melting or fibre drawing; unsupported market averages; downstream fabrication or use"
  required_metadata: "PCR id and version; reference UUIDs; CPC code; plant geography; period; product construction; glass and yarn specifications; sizing state; process map; allocation; cut-offs; upstream links; UUID review state"
  required_quality_disclosure: "Primary-data coverage; meter and scale calibration; mass-balance differences; shared-utility allocation; data gaps; unresolved identities; representativeness and uncertainty"
  update_trigger: "Product construction or route change; sizing or finishing change; major loom or utility change; supplier or geography change; newer representative period; source or Tiangong identity revision"
