  calculation_rules:
    - id: calc_artificial_fibre_fraction
      applies_to: "reference product and incoming mixed sliver"
      rule: "artificial staple-fibre fraction = artificial staple-fibre mass / total constituent-fibre mass; the recorded fraction must be below 85% and all constituent fractions must reconcile to the declared total under the documented measurement and rounding convention"
      inputs:
        - "constituent-fibre masses"
        - "artificial-fibre identification"
      output: "artificial staple-fibre mass fraction"
      source_ids:
        - unsd-cpc-3-0-2025
    - id: calc_reference_normalization
      applies_to: "every quantitative inventory row"
      rule: "normalized amount = measured or reconciled row amount / measured net conforming yarn output mass"
      inputs:
        - "row amount"
        - "net conforming yarn output mass"
      output: "amount per 1 kg net conforming yarn"
      source_ids: []
    - id: calc_electricity_use
      applies_to: "purchased alternating-current electricity"
      rule: "electricity use = reconciled meter import assigned to the foreground process / measured net conforming yarn output mass"
      inputs:
        - "meter readings"
        - exports
        - "lot assignment"
        - "output mass"
      output: "kWh per 1 kg net conforming yarn"
      source_ids: []
    - id: calc_delivered_cone_mass
      applies_to: "paperboard yarn cones"
      rule: "delivered cone mass = non-returned delivered cone count multiplied by verified supplier mass per cone, or direct total measured mass when available"
      inputs:
        - "delivered count"
        - "returned count"
        - "verified mass per cone or total mass"
      output: "kg cone per 1 kg net conforming yarn"
      source_ids: []
