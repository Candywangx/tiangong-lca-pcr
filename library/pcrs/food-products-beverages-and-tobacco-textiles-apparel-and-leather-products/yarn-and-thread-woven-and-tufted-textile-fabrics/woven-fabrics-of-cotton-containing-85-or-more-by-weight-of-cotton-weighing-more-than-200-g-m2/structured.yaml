allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Shared processes and facilities"
    rule: "First avoid allocation by subdivision using meters, batch records, machine hours, treated mass, and pollutant loads attributable to the product route; system expansion may be used only when the added function and model are explicit."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical
    applies_to: "Shared inputs and outputs that cannot be subdivided"
    rule: "Use a relevant physical relationship, preferring treated textile mass for process utilities, metered energy for energy systems, wastewater volume and pollutant load for treatment, and occupied time only when it represents resource use."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_economic_last_resort
    applies_to: "Marketable co-products without a defensible physical relationship"
    rule: "Use economic allocation only after documenting why subdivision, system expansion, and physical allocation are infeasible; use prices at the point where co-products arise and disclose period, currency, and sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_waste_recovery
    applies_to: "Textile scraps, recovered size, sludge, and recovered materials"
    rule: "Record the treatment or recovery route and any revenue; do not assign an avoided burden in this gate-to-gate dataset unless a separate, consistently modelled substitution or circularity method is declared."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "yarn_preparation_weaving_wet_processing_inspection"
      flow_role: "yarn, fabric, residues, and rejects"
      record_type: "weighbridge, scale, warehouse issue, production, and waste records"
      raw_fields: "lot id; input mass; output mass; return mass; waste mass; moisture state; destination"
      collection_method: "Calibrated weighing and reconciled production records"
      unit: "kg"
      frequency: "Each batch or shift; monthly reconciliation"
      temporal_coverage: "At least 12 representative months or the full campaign if shorter"
      site_scope: "All included production lines and outsourced foreground operations"
      aggregation_rule: "Sum by product route, adjust inventory change, then divide by net saleable fabric mass"
      quality_evidence: "Calibration records; signed reconciliation; unexplained mass-balance difference"
    - protocol_id: cp_energy_records
      process_id: "all_foreground_processes"
      flow_role: "electricity, fuel, steam, heat, and compressed air"
      record_type: "utility meter, invoice, fuel delivery, and equipment records"
      raw_fields: "meter id; opening and closing reading; fuel mass or volume; steam or heat quantity; operating time; allocation driver; recovered heat"
      collection_method: "Dedicated meters preferred; otherwise equipment power and operating-time calculation with shared-service allocation"
      unit: "kWh, MJ, kg, or m3 by carrier"
      frequency: "Continuous or each billing period; monthly allocation"
      temporal_coverage: "At least 12 representative months or the full campaign"
      site_scope: "All included process equipment and attributable utilities"
      aggregation_rule: "Preserve carriers, subtract only verified exported or recovered energy, normalize by matched output"
      quality_evidence: "Meter calibration; invoices; equipment log; allocation worksheet"
    - protocol_id: cp_water_balance
      process_id: "sizing_and_wet_processing"
      flow_role: "water intake, reuse, recycling, retention, and discharge"
      record_type: "water meter and batch records"
      raw_fields: "meter readings; batch volume; reuse return; condensate; evaporation estimate; cleaning water; treated mass"
      collection_method: "Metered process balance with route-level batch records"
      unit: "m3"
      frequency: "Each batch where available; at least monthly balance"
      temporal_coverage: "At least 12 representative months or the full campaign"
      site_scope: "All included water-using operations"
      aggregation_rule: "Fresh intake minus verified same-process reuse; normalize by textile mass treated"
      quality_evidence: "Meter checks; flow diagram; water-balance closure"
    - protocol_id: cp_chemical_inventory
      process_id: "sizing_and_wet_processing"
      flow_role: "sizing, dyes, auxiliaries, and finishing formulations"
      record_type: "stores issue, recipe, SDS, and batch records"
      raw_fields: "product id; supplier; batch; issued mass; returned mass; concentration; active content; hazard class; recovery"
      collection_method: "Stores issue records reconciled to recipe and batch sheets"
      unit: "kg as supplied and kg active substance where available"
      frequency: "Each batch"
      temporal_coverage: "At least 12 representative months or the full campaign"
      site_scope: "All included chemical-using operations"
      aggregation_rule: "Net issue by formulation divided by matched textile mass"
      quality_evidence: "Purchase record; SDS; recipe; batch sign-off"
    - protocol_id: cp_product_specification
      process_id: "weaving_wet_processing_inspection"
      flow_role: "fabric identity and reference output"
      record_type: "laboratory test, production, and release records"
      raw_fields: "batch id; cotton fraction; test method; mass per area; width; length; weave; colour; finish; moisture state; net mass"
      collection_method: "Representative laboratory or controlled mill test plus calibrated final weighing"
      unit: "%, g/m2, m, kg"
      frequency: "Each lot or statistically justified lot group"
      temporal_coverage: "Entire declared production period"
      site_scope: "All reference-product variants in the dataset"
      aggregation_rule: "Production-mass-weighted result; retain route-specific results before averaging"
      quality_evidence: "Test report; sampling plan; instrument calibration; release certificate"
    - protocol_id: cp_packaging_records
      process_id: "inspection_and_packaging"
      flow_role: "packaging by material and reuse status"
      record_type: "stores issue, return, and component mass records"
      raw_fields: "material type; mass issued; returned reusable units; packed product mass"
      collection_method: "Stores issue and return records with representative component weighing"
      unit: "kg"
      frequency: "Each batch or monthly reconciliation"
      temporal_coverage: "At least 12 representative months or the full campaign"
      site_scope: "Packaging used for reference-product shipments"
      aggregation_rule: "Net non-reusable packaging divided by net fabric mass"
      quality_evidence: "Bill of materials; scale record; reuse ledger"
    - protocol_id: cp_wastewater_records
      process_id: "wet_processing_and_on_site_treatment"
      flow_role: "wastewater, influent, effluent, sludge, and treatment inputs"
      record_type: "flow meter, laboratory, treatment, and shipment records"
      raw_fields: "volume; sampling time; pH; temperature; COD or TOC; TSS; N; P; metals; relevant substances; sludge mass and moisture; destination"
      collection_method: "Flow-proportional composite sampling where applicable, calibrated flow metering, and shipment records"
      unit: "m3, mg/L, kg, % solids"
      frequency: "Continuous flow; permit or risk-based sampling frequency"
      temporal_coverage: "Same period as product inventory"
      site_scope: "All included drains and treatment units"
      aggregation_rule: "Match concentration to discharge volume and time; calculate pollutant loads; normalize by product mass"
      quality_evidence: "Laboratory accreditation; chain of custody; meter calibration; permit report"
    - protocol_id: cp_direct_emissions
      process_id: "weaving_wet_processing_wastewater_treatment"
      flow_role: "released dust, organic compounds, combustion and water pollutants"
      record_type: "stack or effluent test, monitoring, and operating records"
      raw_fields: "source id; flow or exhaust rate; concentration; sampling duration; abatement status; operating time; discharge volume"
      collection_method: "Direct measurement preferred; documented factor calculation only when measurement is unavailable"
      unit: "kg, mg/Nm3, mg/L, Nm3/h, m3"
      frequency: "Permit, BAT, or risk-based frequency"
      temporal_coverage: "Same period as product inventory"
      site_scope: "Every material emission point for included operations"
      aggregation_rule: "Pollutant-specific mass flow multiplied by matched operation time or discharge volume"
      quality_evidence: "Accredited test; method; detection limit; abatement log; calculation sheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground amounts"
      rule: "Normalized amount = matched-period flow amount / matched-period net saleable fabric mass"
      inputs:
        - "Flow amount"
        - "net saleable fabric mass"
        - "inventory change"
      output: "Amount per 1 kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: calc_area_from_mass
      applies_to: "Supplementary fabric area"
      rule: "Area in m2/kg = 1000 / areal density in g/m2"
      inputs:
        - "Conditioned lot-average areal density"
      output: "m2 represented by 1 kg reference flow"
      source_ids:
        - un-cpc-3-0-26620
    - id: calc_material_balance
      applies_to: "Yarn, fabric, chemicals, and wastes"
      rule: "Reconcile inputs + opening inventory = outputs + closing inventory + wastes + measured releases; disclose the unexplained difference"
      inputs:
        - "Batch and inventory masses"
      output: "Route-level mass-balance closure"
      source_ids:
        - mass-balance-identity
    - id: calc_net_water
      applies_to: "Sizing and wet processing"
      rule: "Net process water = intake + imported process water - water exported or verified reused/recycled to the same process"
      inputs:
        - "Water meters"
        - "reuse and recycling records"
      output: "m3 per 1,000 kg textile treated and per kg reference flow"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_pollutant_load
      applies_to: "Wastewater and waste-gas emissions"
      rule: "Pollutant load = matched concentration times matched flow volume, with unit conversion and sampling representativeness documented"
      inputs:
        - Concentration
        - "volume or gas flow"
        - "operating time"
      output: "kg pollutant per kg reference flow"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_shared_utility
      applies_to: "Shared energy and utilities"
      rule: "Allocate only the residual shared amount after direct metering, using a disclosed physical driver that represents causation"
      inputs:
        - "Shared total"
        - "directly metered amounts"
        - "driver by product route"
      output: "Allocated utility per kg reference flow"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Each included lot shall demonstrate at least 85% cotton and more than 200 g/m2 and declare route, width, weave, moisture state, and finish."
      evidence: "Supplier composition record; representative fibre-analysis report; areal-density test; release certificate"
    - id: dq_temporal
      applies_to: "Foreground activity data"
      requirement: "Use at least 12 representative consecutive months when production is continuous, or the full campaign for seasonal or campaign production; explain abnormal downtime and product-mix changes."
      evidence: "Dated meters, production logs, invoices, and campaign records"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Reconcile material, water, energy, waste, wastewater, and direct-emission records; disclose missing meters, excluded operations, outsourced stages, and every cut-off."
      evidence: "Balance sheets; boundary diagram; data-gap register; cut-off justification"
    - id: dq_representativeness
      applies_to: "Technology and geography"
      requirement: "Describe loom technology, sizing route, wet-processing equipment, wastewater treatment, energy supply, site location, and production mix; do not apply the dataset to materially different routes without review."
      evidence: "Equipment list; route shares; site metadata; upstream dataset selection record"
    - id: dq_precision
      applies_to: "Measurements and calculations"
      requirement: "Retain calibration, sampling, detection-limit, moisture-correction, and allocation records; quantify uncertainty or variability for material flows and important utilities."
      evidence: "Calibration certificates; sampling plan; laboratory report; calculation workbook"
    - id: dq_source_traceability
      applies_to: "External and secondary data"
      requirement: "Record source identity, version or publication date, retrieval date for web sources, intended use, and proxy limitations."
      evidence: "Source register and linked inventory or rule ids"
validation_rules:
  - rule_id: validate_product_identity
    applies_to: "Reference product"
    rule: "Fail validation if cotton content is below 85%, mass per unit area is not greater than 200 g/m2, the flow UUID differs from the declared reference product, or required route and state qualifiers are missing."
    source_ids:
      - un-cpc-3-0-26620
      - eu-textile-fibre-regulation-1007-2011
  - rule_id: validate_reference_unit
    applies_to: "Reference flow"
    rule: "Require Mass 93a60a56-a3c8-11da-a746-0800200b9a66, unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and kg; reject area-only reference amounts."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_route_boundary
    applies_to: "Process coverage"
    rule: "Require yarn preparation, weaving, inspection, and packing; require every wet, thermal, and on-site treatment step that was actually performed, and reject undeclared averaging of greige and wet-finished routes."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_mass_balance
    applies_to: "Material flows"
    rule: "Require route-level reconciliation of yarn, fabric, added solids, wastes, and inventory change; unexplained differences shall be reported and reviewed rather than forced to zero."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_water_energy
    applies_to: "Important utilities"
    rule: "Require route-matched water and energy records. Values outside cited or provisional QA ranges trigger review, not automatic replacement; BAT ranges shall only be compared with their matching process and basis."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_emissions
    applies_to: "Wastewater and direct emissions"
    rule: "Require pollutant-specific loads, receiving compartment, sampling or factor method, abatement status, and matched flow or operating time for material releases."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_allocation_cutoff
    applies_to: "Shared processes and omissions"
    rule: "Require the allocation hierarchy and disclosure of all cut-offs; reject unsupported economic allocation, undisclosed outsourced stages, and cut-offs that hide hazardous or regulated flows."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_reasoned_estimates
    applies_to: "Provisional ranges"
    rule: "Confirm that every reasoned_estimate is used only as a screening or QA range, is not substituted for foreground data, and is explicitly flagged for replacement or review before publication-critical use."
    source_ids: []
published_dataset_profile:
