allocation_rules:
  - rule_id: alloc_avoid
    applies_to: "foreground_burden_allocation"
    rule: "First avoid allocation through process subdivision and separate metering for distinct fabric lines, finishing routes, and production periods."
    source_ids: []
  - rule_id: alloc_single_product
    applies_to: "foreground_burden_allocation"
    rule: "When the foreground produces only the reference fabric and non-product residuals, assign 100% of process inputs and emissions to the reference product before residual treatment credits."
    source_ids: []
  - rule_id: alloc_residuals
    applies_to: "foreground_burden_allocation"
    rule: "Record yarn waste, fabric waste, spent liquor, wastewater, and packaging waste as outputs. Do not treat them as co-products solely because they are sold or recycled; model any avoided burden only in a separately disclosed downstream scenario."
    source_ids: []
  - rule_id: alloc_unavoidable
    applies_to: "foreground_burden_allocation"
    rule: "If allocation between multiple saleable textile products cannot be avoided, prefer a documented physical causal parameter such as machine time or mass. Use economic allocation only when physical causality is not defensible, and disclose prices, period, sensitivity, and allocated shares."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "weaving_wet_finishing"
      flow_role: "yarn and internal fabric inputs"
      record_type: "weighbridge, scale, ERP issue, recipe"
      raw_fields: "material identity; supplier; lot; gross and tare mass; fibre composition; process destination"
      collection_method: "Reconcile received and issued mass by named material and lot"
      unit: "kg"
      frequency: "per lot, monthly reconciliation"
      temporal_coverage: "12 consecutive months"
      site_scope: "reporting mill and included outsourced transfer"
      aggregation_rule: "Sum by atomic material identity; no family-level aggregation"
      quality_evidence: "calibrated scale record; invoice; batch ticket; fibre certificate"
    - protocol_id: cp_utility_meters
      process_id: "all_processes"
      flow_role: "electricity, process water, hot water, steam, natural gas"
      record_type: "utility meter and invoice"
      raw_fields: "opening and closing meter; meter multiplier; fuel heating value; submeter assignment"
      collection_method: "Read dedicated meters; allocate shared meters using documented causal drivers"
      unit: "kWh; m3; MJ"
      frequency: "at least monthly"
      temporal_coverage: "12 consecutive months"
      site_scope: "included foreground operations"
      aggregation_rule: "Sum readings by utility identity and process; preserve separate carriers"
      quality_evidence: "meter calibration; bills; meter map; allocation worksheet"
    - protocol_id: cp_chemical_records
      process_id: "weaving_wet_finishing"
      flow_role: "individual sizing, lubricant, dye, acid, salt, surfactant, and other chemicals"
      record_type: "batch recipe and inventory record"
      raw_fields: "product identity; CAS where available; concentration; batch issue; return; recovery"
      collection_method: "Reconcile stock movement and batch recipes; convert commercial products to active or pure equivalent as declared"
      unit: "kg"
      frequency: "per batch, monthly reconciliation"
      temporal_coverage: "12 consecutive months"
      site_scope: "included foreground operations"
      aggregation_rule: "Sum only identical products at the same declared concentration basis"
      quality_evidence: "SDS; technical data sheet; recipe; inventory ledger"
    - protocol_id: cp_product_quality
      process_id: "all_processes"
      flow_role: "greige, finished, and reference fabric"
      record_type: "roll inspection and laboratory record"
      raw_fields: "roll mass; length; width; mass per area; fibre shares; moisture basis; grade; rejects"
      collection_method: "Weigh accepted transfers and test category-defining composition and fabric mass"
      unit: "kg; %; g/m2"
      frequency: "per lot with monthly reconciliation"
      temporal_coverage: "12 consecutive months"
      site_scope: "reporting mill"
      aggregation_rule: "Sum accepted product by declared construction and finish; retain grade splits"
      quality_evidence: "calibrated scale; ISO-method test report; quality release"
    - protocol_id: cp_waste_records
      process_id: "all_processes"
      flow_role: "each named solid or liquid waste"
      record_type: "waste transfer and scale record"
      raw_fields: "waste identity; container tare; mass; destination; treatment; recovery status"
