validation_rules:
  - rule_id: val_identity
    applies_to: "foreground_dataset_conformance"
    rule: "The reference output must use UUID 0b5c66df-5a09-41f4-8e09-39c43dd16a76, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids: []
  - rule_id: val_composition
    applies_to: "foreground_dataset_conformance"
    rule: "Verify from an applicable composition test that wool plus fine animal hair is at least 85% of total fibre mass after removal of non-fibrous matter; reject a dataset below the threshold."
    source_ids: []
  - rule_id: val_reference_mass
    applies_to: "foreground_dataset_conformance"
    rule: "Verify exactly 1,000 kg net conforming fabric output after inspection, on the declared moisture/conditioning basis and excluding packaging mass."
    source_ids: []
  - rule_id: val_process_coverage
    applies_to: "foreground_dataset_conformance"
    rule: "Require weaving and final_inspection_packaging; require wet_finishing when any wet finishing occurs onsite, and disclose every outsourced or excluded operation."
    source_ids: []
  - rule_id: val_atomic_flows
    applies_to: "foreground_dataset_conformance"
    rule: "Reject aggregated selected flows. Every actual utility, fuel, refrigerant, chemical, packaging component, waste, wastewater substance, and air-emission substance must be a separate atomic exchange; unresolved Tiangong identities remain a publication blocker."
    source_ids: []
  - rule_id: val_mass_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile textile material separately for each process and for the full foreground; investigate and document residuals rather than silently balancing them."
    source_ids: []
  - rule_id: val_wastewater
    applies_to: "foreground_dataset_conformance"
    rule: "When wet processing discharges wastewater, require measured discharge volume and separate applicable substance loads with declared treatment state, sampling coverage, and discharge point."
    source_ids: []
  - rule_id: val_air_emissions
    applies_to: "foreground_dataset_conformance"
    rule: "When onsite combustion, drying, or chemical finishing is present, require each applicable air substance separately and document whether measured or calculated; absence claims require process and chemical evidence."
    source_ids: []
  - rule_id: val_sources
    applies_to: "foreground_dataset_conformance"
    rule: "Reject source claims based only on search snippets or abstracts. Each normative external claim must trace to an official original or full paper; case-study values must not be promoted to generic ranges."
    source_ids: []
  - rule_id: val_translation
    applies_to: "foreground_dataset_conformance"
    rule: "Require identical ordered process_id, row_id, Tiangong UUID, controlled-enum, source-id, system-boundary rule, allocation-rule, and validation-rule sequences in English and Chinese."
    source_ids: []
published_dataset_profile:
  dataset_role: "Producer-specific foreground data package for mill-gate production of CPC 3.0 26530 fabric"
  downstream_use: "Construction of LCA process datasets and lifecycle models for declared combed-wool or combed-fine-animal-hair woven fabrics"
  allowed_use: "Site- and route-specific product assessment when composition, construction, finish, geography, period, and boundary match"
  excluded_use: "Generic defaults for all wool textiles; carded fabrics; below-85% fabrics; knitted, pile, carpet, garment, use-phase, or end-of-life claims without additional rules"
  required_metadata: "Required reference-flow qualifiers; process inclusion; supplier and upstream dataset choices; allocation; treatment state; measurement methods; source versions"
  required_quality_disclosure: "Primary-data coverage; meter and sampling quality; allocation shares; mass-balance residuals; exclusions; unresolved flow identities; data gaps; absence of generic ranges"
  update_trigger: "Material change in fibre recipe, construction, finishing route, energy or water system, pollution control, packaging, production geography, allocation, or reporting period"
data_sources:
  - id: "unsd-cpc-3-0-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, *CPC Version 3.0 Explanatory Notes*, 2025, class 26530. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Exact category scope, 85% threshold, and exclusions by neighbouring classes"
  - id: "iwto-wool-lca-guidelines-2016"
    type: "official_guidance"
    reference: "International Wool Textile Organisation, *Guidelines for Conducting a Life Cycle Assessment of the Environmental Performance of Wool Textiles*, April 2016. https://iwto.org/wp-content/uploads/2020/04/IWTO-Guidelines-for-Wool-LCA.pdf"
    used_for: "Wool textile route, post-farm inventory, foreground data quality, mass/energy checks, allocation hierarchy, and evidence gap for generic defaults"
  - id: "ec-jrc-textiles-bref-2023"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, *Best Available Techniques Reference Document for the Textiles Industry*, 2023. https://bureau-industrial-transformation.jrc.ec.europa.eu/index.php/reference/textiles-industry"
    used_for: "Warping, sizing, weaving, wet finishing, input/output inventory, monitoring, wastewater, emissions, chemicals, and energy"
  - id: "iso-1833-4-2023"
    type: "standard"
    reference: "ISO 1833-4:2023, *Textiles — Quantitative chemical analysis — Part 4: Mixtures of certain protein fibres with certain other fibres*. https://www.iso.org/standard/86273.html"
    used_for: "Composition measurement after removal of non-fibrous matter"
  - id: "iso-3801-1977"
    type: "standard"
    reference: "ISO 3801:1977, *Textiles — Woven fabrics — Determination of mass per unit length and mass per unit area*. https://www.iso.org/standard/9335.html"
    used_for: "Fabric mass and mass-per-area qualifier"
  - id: "roos-textile-chemical-inventory-2019"
    type: "literature"
    reference: "Roos et al., “An inventory framework for inclusion of textile chemicals in life cycle assessment,” *The International Journal of Life Cycle Assessment* 24 (2019), 838–847. https://doi.org/10.1007/s11367-018-1537-6"
    used_for: "Chemical-by-chemical inventory and separate emission identities for textile wet processing"
