allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared meters and services"
    rule: "First subdivide lines, lots, and unit operations and collect directly attributable records."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical_relation
    applies_to: "residual shared burdens"
    rule: "When subdivision is not practicable, use a documented causal physical relation such as operating time, metered throughput, or delivered energy; net-mass allocation is allowed only when it represents that relation."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_no_waste_credit
    applies_to: "internal rework and external waste"
    rule: "Return internal rework to the originating lot without co-product credit; report externally transferred waste and any recovery modelling separately."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "plying_twisting"
      flow_role: "cotton yarn"
      record_type: "warehouse issue and return records"
      raw_fields: "material_id; supplier_lot; gross_kg; return_kg; moisture_basis"
      collection_method: "weigh and reconcile issued less returned mass"
      unit: "kg"
      frequency: "each lot; monthly reconciliation"
      temporal_coverage: "declared reporting period"
      site_scope: "all in-scope lines"
      aggregation_rule: "sum net consumed mass by material_id and lot; divide by conforming output"
      quality_evidence: "calibrated scale; supplier specification; stock reconciliation"
    - protocol_id: cp_process_energy
      process_id: "multiple"
      flow_role: "electricity"
      record_type: "submeter and production records"
      raw_fields: "meter_start; meter_end; process_id; lot_id; operating_time"
      collection_method: "direct submetering preferred; otherwise documented physical allocation"
      unit: "kWh"
      frequency: "each shift or lot; monthly reconciliation"
      temporal_coverage: "declared reporting period"
      site_scope: "all in-scope equipment"
      aggregation_rule: "assigned_kWh / conforming_output_kg"
      quality_evidence: "meter calibration; utility-bill reconciliation; allocation worksheet"
    - protocol_id: cp_fuel_energy
      process_id: "singeing_drying_conditioning"
      flow_role: "natural gas"
      record_type: "fuel meter and fuel specification"
      raw_fields: "meter_start; meter_end; net_calorific_value; process_id; lot_id"
      collection_method: "direct fuel metering by operation"
      unit: "m3 and MJ"
      frequency: "each shift or lot; monthly reconciliation"
      temporal_coverage: "declared reporting period"
      site_scope: "all in-scope burners"
      aggregation_rule: "fuel_MJ = volume_m3 * NCV_MJ_per_m3; normalize by conforming output"
      quality_evidence: "meter calibration; supplier NCV; combustion record"
    - protocol_id: cp_thermal_energy
      process_id: "scouring_bleaching_package_dyeing_drying_conditioning"
      flow_role: "steam or purchased hot water"
      record_type: "thermal meter and utility record"
      raw_fields: "mass_or_volume; inlet_temperature; outlet_temperature; pressure; process_id; lot_id"
      collection_method: "meter delivered thermal carrier separately by carrier"
      unit: "MJ"
      frequency: "each batch; monthly reconciliation"
      temporal_coverage: "declared reporting period"
      site_scope: "all in-scope wet and drying equipment"
      aggregation_rule: "carrier-specific delivered_MJ / process_output_kg; never average carriers"
      quality_evidence: "meter calibration; steam/hot-water balance; invoice reconciliation"
    - protocol_id: cp_wet_process_water
      process_id: "scouring_bleaching_mercerising_package_dyeing_washing_rinsing"
      flow_role: "process water"
      record_type: "water meter and batch record"
      raw_fields: "meter_start; meter_end; reused_m3; process_id; lot_id"
      collection_method: "meter fresh and reused water separately by unit operation"
      unit: "m3"
      frequency: "each batch; monthly reconciliation"
      temporal_coverage: "declared reporting period"
      site_scope: "all in-scope wet operations"
      aggregation_rule: "fresh_m3 = gross_input_m3 - verified_reused_m3; divide by process output"
      quality_evidence: "meter calibration; water balance; batch sheet"
    - protocol_id: cp_recipe_chemical
      process_id: "scouring_bleaching_mercerising_package_dyeing"
      flow_role: "individual recipe chemical"
      record_type: "batch recipe, issue, return, and assay records"
      raw_fields: "chemical_id; CAS_or_spec; formulation_kg; active_fraction; return_kg; process_id; lot_id"
      collection_method: "record every formulation separately and convert only with verified assay"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "declared reporting period"
      site_scope: "all in-scope wet operations"
      aggregation_rule: "active_kg = (issued_kg - returned_kg) * active_fraction"
      quality_evidence: "approved recipe; supplier SDS/specification; calibrated dosing record"
    - protocol_id: cp_wastewater
      process_id: "scouring_bleaching_mercerising_package_dyeing_washing_rinsing"
      flow_role: "individual wastewater stream"
      record_type: "flow meter, batch discharge, and transfer record"
      raw_fields: "stream_id; process_id; volume_m3; destination; COD; pH; temperature; sampling_time"
      collection_method: "meter each segregated stream before mixing or treatment"
      unit: "m3"
      frequency: "each discharge; monthly reconciliation"
      temporal_coverage: "declared reporting period"
      site_scope: "all in-scope wet operations"
      aggregation_rule: "sum by stream_id and destination; subtract only verified reuse"
      quality_evidence: "flow-meter calibration; chain of custody; laboratory report; water balance"
    - protocol_id: cp_air_emissions
      process_id: "singeing"
      flow_role: "individual air emission"
      record_type: "stack test or continuous monitor"
      raw_fields: "pollutant_id; concentration; gas_flow; duration; moisture; oxygen_reference"
      collection_method: "use applicable EN/ISO method and calculate pollutant mass by emission point"
      unit: "kg"
      frequency: "permit or BAT frequency and after material change"
      temporal_coverage: "declared reporting period"
      site_scope: "all in-scope singeing emission points"
      aggregation_rule: "pollutant_kg = concentration * standardised_gas_volume"
      quality_evidence: "accredited laboratory report; instrument QA/QC; operating log"
    - protocol_id: cp_refrigerant
      process_id: "drying_conditioning"
      flow_role: "R-134a"
      record_type: "refrigerant inventory and service log"
      raw_fields: "opening_kg; purchases_kg; closing_kg; recovered_kg; equipment_id; lot_allocation"
      collection_method: "reconcile sealed-system inventory and service additions by refrigerant identity"
      unit: "kg"
      frequency: "each service event; annual reconciliation"
      temporal_coverage: "declared reporting period"
      site_scope: "in-scope process cooling equipment"
