system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "foreground spinning system"
      rule: "Include all on-site operations from receipt of ready-to-spin fibres through packaged saleable yarn, including utilities, material losses, waste, and direct emissions attributable to the declared product."
      source_ids:
        - eu-jrc-textiles-bref-2023
        - ec-pef-method-2021
    - rule_id: boundary_rule_2
      applies_to: "upstream fibre and auxiliary production"
      rule: "Model cotton fibre, each non-cotton fibre, electricity, fuels, water, chemicals, and packaging with separate upstream datasets. Do not recursively reproduce this yarn PCR for an input yarn of the same category."
      source_ids:
        - ec-pef-method-2021
    - rule_id: boundary_rule_3
      applies_to: "conditional operations"
      rule: "Include combing, roving, twisting, wet processing, wastewater treatment, humidification, compressed air, and on-site energy generation when performed or materially attributable; otherwise disclose the exclusion."
      source_ids:
        - eu-jrc-textiles-bref-2023
        - ec-pef-method-2021
    - rule_id: boundary_rule_4
      applies_to: "exclusions and cut-off"
      rule: "Do not omit a known material, energy, waste, or direct-emission flow merely because it is small. Any cut-off used in a downstream PEF-conformant study shall be explicit, justified, and checked against the applicable study rule."
      source_ids:
        - ec-pef-method-2021
boundary_abstraction:
  declared_starting_condition: "Cotton and every non-cotton blend fibre are received at the yarn mill in a declared grade, moisture state, package form, origin, and virgin or recycled state suitable for the selected spinning route."
  starting_condition_role: "The received fibre condition is the foreground gate; upstream fibre cultivation, extraction, polymer production, ginning, recycling, and fibre manufacture are represented by linked datasets."
  product_classification_scope: "Cotton-containing blended yarn other than sewing thread, with cotton content greater than 0% and less than 85% by mass."
  recursive_input_rule: "If yarn in this same product category is consumed as an input, record its measured amount and link a separate upstream yarn dataset; do not expand the same foreground spinning operations recursively."
  upstream_dataset_requirement: "Use composition-, origin-, recycled-content-, technology-, geography-, and time-representative datasets for cotton, each blend partner, purchased energy, auxiliaries, packaging, transport when in scope, and off-site treatment."
  disclosure: "Disclose fibre composition and test basis, starting moisture condition, spinning route, wet-processing state, foreground ownership, excluded operations, allocation, cut-off, upstream dataset choices, and all provisional estimates."
