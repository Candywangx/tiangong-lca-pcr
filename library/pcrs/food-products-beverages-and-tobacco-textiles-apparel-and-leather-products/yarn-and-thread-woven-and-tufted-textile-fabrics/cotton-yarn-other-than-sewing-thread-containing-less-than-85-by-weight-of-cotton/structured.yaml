measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground inputs and outputs to 1 kg net conforming yarn. Exclude cores, cones, cartons, straps, and other packaging from the reference mass and record them separately."
  - id: composition_mass_fraction
    applies_to: "cotton and blend-partner composition"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "kg fibre/kg total fibre"
    rule: "Determine cotton and other fibre fractions on one declared and consistently applied basis. Use ISO 1833-1 and the applicable mixture-specific part, or an equivalent validated method, when laboratory separation is required; report the method, moisture correction, and treatment of non-fibrous matter."
  - id: cotton_threshold
    applies_to: "reference product identity"
    required_property_ref:
      name: "Cotton mass fraction"
      uuid: ""
    required_unit: "kg cotton/kg total fibre"
    rule: "The measured or verified cotton fraction shall be greater than 0 and strictly less than 0.85. A result at or above 0.85 or a yarn with no cotton is outside this PCR."
  - id: commercial_mass_conversion
    applies_to: "yarn and fibre masses"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "If invoices or production systems use conditioned or commercial mass, retain the observed mass and moisture basis and convert to the declared reference basis with an explicit, auditable formula."
  - id: energy_units
    applies_to: "electricity and thermal energy"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Preserve metered units. Convert only with a stated factor, identify whether fuel data are mass, volume, lower-heating-value energy, or higher-heating-value energy, and prevent double counting between fuel and purchased heat."
