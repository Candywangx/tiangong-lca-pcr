allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "shared equipment and utilities"
    rule: "Prefer product-specific metering and subdivision by process, machine, batch, or production order. Where subdivision is not feasible, use a documented causal physical driver such as machine-hours, airflow, steam, compressed-air demand, or mass throughput."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_rule_2
    applies_to: "fibre waste and recoverable secondary outputs"
    rule: "Record gross inputs and all fibre-bearing outputs before credit. Do not subtract sold or internally recovered waste from input mass. If a downstream study assigns burdens or credits, disclose the method and keep the unallocated foreground inventory available."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_rule_3
    applies_to: "multiple yarn products from one line"
    rule: "Allocate shared residual burdens using a measured physical relationship that reflects resource demand. Mass allocation is permitted only when no more representative physical driver is available; economic allocation requires explicit justification and sensitivity analysis."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_rule_4
    applies_to: "internally recycled fibre"
    rule: "Treat internal rework as an internal loop: record the recovered mass, the process where it re-enters, and any additional energy or loss; prevent double counting as both avoided virgin input and exported co-product."
    source_ids:
      - ec-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_fibre_opening_blending
      process_id: "fibre_opening_blending"
      flow_role: "received fibres, electricity, preparations, transfers, rejects, packaging, and dust"
      record_type: "weighbridge or scale records; invoices; stock ledger; submeter; recipe; waste tickets; emission measurements"
      raw_fields: "lot id; fibre type; cotton flag; virgin/recycled status; origin; grade; moisture basis; issued mass; transferred mass; electricity; preparation mass; reject mass; packaging mass and destination; airflow; dust concentration; operating time"
      collection_method: "reconcile opening-room production orders to calibrated scales, stock changes, submeters, recipes, waste records, and control-system measurements"
      unit: "kg; kWh; m3; mg/m3; h"
      frequency: "per lot or batch for materials; continuous or shift meter readings; each waste movement; monitoring frequency required by permit for emissions"
      temporal_coverage: "at least 12 consecutive representative months, or the full campaign for campaign production"
      site_scope: "all opening, blending, extraction, storage, and shared-service equipment attributable to the product"
      aggregation_rule: "sum product-specific records; allocate only residual shared use with the disclosed physical driver; normalize to prepared blend and reference yarn"
      quality_evidence: "scale and meter calibration; stock reconciliation; recipe approval; waste transfer records; sampling plan; emission-monitoring report"
    - protocol_id: cp_carding_drawing_preparation
      process_id: "carding_drawing_preparation"
      flow_role: "prepared blend, electricity, sliver/roving, fibre waste, and dust"
      record_type: "production order; calibrated scale; submeter; machine counter; waste ticket; emission measurement"
      raw_fields: "route; machine id; input mass; output mass; card waste; comber noils; other waste; electricity; compressed-air basis; airflow; dust concentration; operating time"
      collection_method: "reconcile each declared carded or combed route across material transfers, machine records, meters, and waste collection"
      unit: "kg; kWh; mg/m3; h"
      frequency: "per lot or production order; shift or continuous energy readings; each waste movement; required emission-monitoring interval"
      temporal_coverage: "same period as reference product data"
      site_scope: "all carding, drawing, optional combing, optional roving, conveying, extraction, and attributable services"
      aggregation_rule: "aggregate only equivalent routes; retain combed and carded routes separately when their losses or energy differ materially"
      quality_evidence: "calibration; route traceability; mass reconciliation; meter coverage; waste classification; emission test report"
    - protocol_id: cp_spinning_winding_packaging
      process_id: "spinning_winding_packaging"
      flow_role: "prepared fibre, electricity, auxiliaries, packaging, yarn output, waste, and dust"
      record_type: "production order; scale; submeter; recipe or issue record; packaging bill; quality system; waste ticket; emission measurement"
      raw_fields: "spinning technology; count; twist; input mass; good output mass; off-spec mass; waste class; electricity; auxiliary mass; packaging material and mass; airflow; dust concentration; operating time"
      collection_method: "reconcile production orders from spinning input through net packed yarn, excluding packaging from reference mass"
      unit: "kg; kWh; mg/m3; h"
      frequency: "per production order; continuous or shift meters; each packaging issue and waste movement; required emission-monitoring interval"
      temporal_coverage: "same period as reference product data"
      site_scope: "spinning, optional twisting, winding, suction, compressed air, humidification, laboratory, and packaging systems attributable to the product"
      aggregation_rule: "aggregate only products with equivalent recipe and route; use net conforming yarn as denominator"
      quality_evidence: "scale and meter calibration; quality release; composition certificate or test; packaging specification; mass balance; emission report"
    - protocol_id: cp_onsite_wet_processing
      process_id: "onsite_wet_processing"
      flow_role: "wet-process material, recipes, water, energy, chemicals, treated output, wastewater, residues, and direct emissions"
      record_type: "batch card; recipe system; flowmeter; energy meter; chemical issue; laboratory analysis; wastewater and air monitoring; waste manifest"
      raw_fields: "batch id; input/output mass and moisture; treatment; chemical identity and mass; water volume; electricity; steam or fuel; wastewater volume; pollutant concentration; sludge and residue mass; destination"
      collection_method: "reconcile each batch recipe and utility record with treated output and environmental monitoring"
      unit: "kg; m3; kWh; MJ; mg/L; mg/m3; h"
      frequency: "per batch for material and chemicals; continuous or batch utilities; monitoring frequency required by permit"
      temporal_coverage: "same period as reference product data and representative of declared shades or treatments"
      site_scope: "all included on-site fibre/yarn wet-process and treatment equipment"
      aggregation_rule: "aggregate by equivalent treatment recipe; calculate direct emissions from measured concentration and flow; normalize to treated output and reference yarn"
      quality_evidence: "meter calibration; approved recipe; laboratory QA/QC; discharge records; permit reports; waste manifests"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "all foreground flows"
      rule: "normalized flow = attributable reporting-period flow / net conforming yarn mass on the declared reference basis"
      inputs:
        - "attributable flow"
        - "net conforming yarn mass"
        - "moisture conversion where applicable"
      output: "flow per 1 kg reference yarn"
      source_ids:
        - ec-pef-method-2021
    - id: calc_cotton_fraction
      applies_to: "product category check"
      rule: "cotton fraction = dry or declared-basis cotton mass / sum of all fibre masses on the same basis; apply a validated mixture-specific method when calculation from recipe is not sufficient"
      inputs:
        - "composition test or controlled recipe"
        - "moisture and non-fibrous-matter correction"
      output: "cotton and blend-partner mass fractions"
      source_ids:
        - iso-1833-1-2020
    - id: calc_mass_balance
      applies_to: "each process and total foreground"
      rule: "mass-balance difference = total mass inputs - product outputs - waste outputs - measured direct mass emissions - documented stock change; investigate unexplained differences and do not force them to zero by editing a waste flow"
      inputs:
        - "material inputs"
        - outputs
        - wastes
        - emissions
        - "stock changes"
      output: "reconciliation difference and percentage"
      source_ids: []
    - id: calc_meter_allocation
      applies_to: "shared electricity, heat, water, and compressed air"
      rule: "allocate residual shared consumption with the most causal measured driver; disclose driver, numerator, denominator, and excluded loads"
      inputs:
        - "shared meter total"
        - "product-specific meter data"
        - machine-hours
        - airflow
        - throughput
        - "or other driver"
      output: "attributable utility use"
      source_ids:
        - ec-pef-method-2021
    - id: calc_direct_emission
      applies_to: "measured air or water releases"
      rule: "emitted mass = concentration x measured flow x operating duration, with unit conversion and blank or detection-limit treatment documented"
      inputs:
        - concentration
        - flow
        - time
        - "conversion factor"
      output: "pollutant mass per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference yarn and fibre inputs"
      requirement: "Preserve product-to-lot traceability and verify that cotton is present and below 85% by mass; identify every blend partner and recycled-content claim."
      evidence: "composition certificate or validated test; recipe approval; supplier lot records; finished-product release"
    - id: dq_measurement
      applies_to: "mass and utility data"
      requirement: "Use calibrated scales and meters or reconcile purchases, stock changes, and production records. Document commercial-to-reference mass conversion and shared-meter allocation."
      evidence: "calibration certificates; meter map; invoices; stock reconciliation; allocation workbook"
    - id: dq_temporal
      applies_to: "reporting period"
      requirement: "Cover at least 12 consecutive representative months unless production is campaign-based; explain shutdowns, abnormal batches, route changes, and any shorter period."
      evidence: "production calendar; batch list; maintenance and downtime logs"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Include all known material, energy, water, product, waste, and direct-emission flows for included processes. Quantify missing-data share and do not silently omit a flow."
      evidence: "mass and energy balance; waste manifests; environmental monitoring; completeness checklist"
    - id: dq_representativeness
      applies_to: "foreground and upstream data"
      requirement: "Assess technological, geographical, and time-related representativeness and precision; disclose proxy datasets and provisional estimates."
      evidence: "documented data-quality assessment consistent with the EC PEF criteria"
    - id: dq_route_separation
      applies_to: "materially different products or routes"
      requirement: "Keep fibre recipes, spinning technologies, carded/combed routes, yarn counts, and wet-treatment recipes separate when aggregation would obscure materially different consumption or losses."
      evidence: "route-level production orders and meter or allocation records"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "product identity"
    rule: "Fail if the product is sewing thread, contains no cotton, or has a verified cotton mass fraction at or above 0.85. Fail if the fibre basis or blend partners are undeclared."
    source_ids:
      - unsd-cpc-3-0-2025
      - iso-1833-1-2020
  - rule_id: validation_rule_2
    applies_to: "reference flow"
    rule: "Fail if the reference output is not 1 kg net conforming yarn on the declared moisture or commercial mass basis, if packaging is included in that mass, or if the specified Tiangong product-flow, Mass property, unit-group, and kg unit identities do not match."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "process completeness"
    rule: "Fail if any required process lacks a matching inventory section or if an applicable combing, roving, twisting, wet-processing, wastewater-treatment, humidification, compressed-air, or on-site energy operation is omitted without disclosure."
    source_ids:
      - eu-jrc-textiles-bref-2023
      - ec-pef-method-2021
  - rule_id: validation_rule_4
    applies_to: "mass balance"
    rule: "Flag an unexplained process or foreground mass-balance difference greater than 5% of input mass; fail when the difference cannot be reconciled before release."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground evidence"
    rule: "Fail if cotton and blend-partner masses, net yarn output, electricity, major auxiliaries, packaging, fibre waste, or applicable water and wastewater are represented only by a default estimate when foreground records are reasonably obtainable."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validation_rule_6
    applies_to: "estimates and source traceability"
    rule: "Flag every reasoned_estimate used in the candidate PCR; fail publication if it is used as an unreviewed publication-critical allowed range or if an external-source value lacks its cited source id."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "allocation and double counting"
    rule: "Fail if shared burdens lack a stated driver, if recovered fibre is both credited and omitted from gross inputs, or if internally recycled fibre is counted simultaneously as an avoided input and an exported co-product."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validation_rule_8
    applies_to: "data quality and disclosure"
    rule: "Fail if period, geography, technology, fibre origins, recycled status, composition method, moisture convention, cut-off, allocation, wet-processing state, or upstream dataset choices are missing from the data package."
    source_ids:
      - ec-pef-method-2021
published_dataset_profile:
  dataset_role: "Gate-to-gate foreground production dataset for cotton-containing blended yarn with cotton content below 85% by mass"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Link to downstream weaving, knitting, nonwoven, textile finishing, apparel, home-textile, or other product systems when composition, yarn construction, spinning technology, wet-processing state, geography, time, and quality are representative"
  excluded_use: "Cotton yarn at or above 85% cotton; sewing thread; yarn with no cotton; continuous-filament yarn without staple spinning; unidentified fibre blends; a cradle-to-gate claim without linked upstream fibre and auxiliary datasets; comparative public claims without the applicable review and study rules"
  required_metadata: "PCR id; product-flow UUID; net reference mass; cotton and each blend-partner fraction and test basis; virgin/recycled status; fibre origin; yarn count; twist; spinning technology; construction; colour/treatment state; moisture convention; package form; geography; reporting period; included processes; upstream datasets; cut-off; allocation"
  required_quality_disclosure: "Data source and measurement method for each major flow; meter and scale coverage; mass-balance reconciliation; route separation; missing data; proxies; provisional estimates; technological, geographical, and temporal representativeness; precision; review status"
  update_trigger: "Update when the fibre recipe, recycled content, spinning technology, yarn count family, wet-processing route, energy supply, allocation driver, site boundary, production geography, or representative reporting period changes materially, or when reviewed evidence replaces a provisional range"
