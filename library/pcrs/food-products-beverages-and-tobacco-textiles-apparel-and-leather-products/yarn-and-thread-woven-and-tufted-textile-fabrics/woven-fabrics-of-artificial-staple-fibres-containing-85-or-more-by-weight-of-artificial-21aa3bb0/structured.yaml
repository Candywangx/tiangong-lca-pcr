allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared processes and utilities"
    rule: "Avoid allocation where possible by submetering, lot tracking, temporal subdivision, or physical separation of processes and utility systems."
    source_ids:
      - eu-pef-method-2021
      - iso-14044-2006
  - rule_id: allocation_physical_relation
    applies_to: "Unavoidable multifunctionality"
    rule: "When subdivision or system expansion is not practicable, allocate inputs and outputs using a documented causal physical relationship, such as machine time, metered energy, bath volume, or mass throughput, that represents resource use."
    source_ids:
      - eu-pef-method-2021
      - iso-14044-2006
  - rule_id: allocation_other_relation
    applies_to: "No defensible physical relation"
    rule: "Use another documented relationship, including economic allocation only as a last resort, and report the factor, prices, period, currency, and sensitivity to the choice."
    source_ids:
      - eu-pef-method-2021
      - iso-14044-2006
  - rule_id: allocation_recycling_and_waste
    applies_to: "Internal reuse and saleable textile residues"
    rule: "Do not double count internally reused yarn, size, water, or fabric. Record recovered material once, disclose whether it remains waste or becomes a co-product, and link any off-site recycling or treatment dataset."
    source_ids:
      - eu-jrc-textiles-bref-2023
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "yarn_preparation_and_warping_sizing_weaving_wet_pretreatment_and_finishing"
      flow_role: "Yarn, intermediate fabric, work-in-progress, and losses"
      record_type: "Scale records, material issue and return records, production reports"
      raw_fields: "lot_id, material_id, fibre_composition, warp_or_weft, opening_mass, issued_mass, returned_mass, transfer_mass, closing_wip_mass, moisture_state"
      collection_method: "Calibrated scales reconciled to stores and lot production records"
      unit: "kg"
      frequency: "Each lot with monthly reconciliation"
      temporal_coverage: "At least 12 representative months or the full campaign when shorter"
      site_scope: "All facilities and outsourced operations under operational control"
      aggregation_rule: "Sum by lot and process; normalize to net saleable reference output; retain work-in-progress adjustments"
      quality_evidence: "Scale calibration, supplier composition certificate, signed stock reconciliation, anomaly log"
    - protocol_id: cp_product_output
      process_id: "weaving_wet_pretreatment_and_finishing"
      flow_role: "Saleable reference fabric"
      record_type: "Final scale and inspection records"
      raw_fields: "lot_id, gross_mass, excluded_packaging_mass, net_mass, width, area, mass_per_area, moisture_state, quality_grade, rejection_mass"
      collection_method: "Calibrated final weighing after declared conditioning and inspection"
      unit: "kg"
      frequency: "Each roll or lot"
      temporal_coverage: "Full reporting period"
      site_scope: "Every producing site"
      aggregation_rule: "Sum net saleable output; select only one final process as quantitative reference"
      quality_evidence: "Scale calibration, inspection release, roll register, moisture or conditioning record"
    - protocol_id: cp_energy_records
      process_id: "all_included_processes"
      flow_role: "Electricity, steam, and fuel"
      record_type: "Submeters, utility invoices, boiler and fuel logs"
      raw_fields: "meter_id, carrier, opening_reading, closing_reading, conversion_factor, allocation_driver, process_id, operating_hours"
      collection_method: "Direct metering preferred; otherwise documented allocation from a complete facility balance"
      unit: "kWh, MJ, kg fuel, or m3 fuel"
      frequency: "Continuous or per batch; reconcile monthly"
      temporal_coverage: "At least 12 representative months or full campaign"
      site_scope: "All included production and utility systems"
      aggregation_rule: "Difference meter readings; subtract exported energy; allocate shared use only under section 7"
      quality_evidence: "Meter calibration, invoices, fuel lower-heating-value source, reconciliation"
    - protocol_id: cp_chemical_records
      process_id: "yarn_preparation_and_warping_sizing_weaving_wet_pretreatment_and_finishing"
      flow_role: "Lubricants, sizing agents, dyes, and auxiliaries"
      record_type: "Recipes, issue and return logs, stock records, safety and technical data sheets"
      raw_fields: "chemical_id, trade_name, function, formulation_mass, concentration, issue_mass, return_mass, recovered_mass, batch_id"
      collection_method: "Weighed automatic dosing or reconciled stores issue"
      unit: "kg formulated product and kg active substance when known"
      frequency: "Each batch with monthly stock reconciliation"
      temporal_coverage: "Full reporting period"
      site_scope: "All included processes and contractors"
      aggregation_rule: "Net use equals issued plus opening stock minus returned, recovered, and closing stock; retain formulation and active-substance views"
      quality_evidence: "Calibrated dosing record, recipe authorization, SDS/TDS, stock reconciliation"
    - protocol_id: cp_water_and_wastewater
      process_id: "sizing_wet_pretreatment_and_finishing"
      flow_role: "Fresh, reused, recycled water and wastewater"
      record_type: "Water meters, bath logs, discharge meters, laboratory results"
      raw_fields: "source_or_stream, meter_id, volume, reuse_volume, temperature, process_id, discharge_route, sampling_time, concentration_by_parameter"
      collection_method: "Direct flow metering and representative compliant sampling at relevant stream locations"
      unit: "m3 and parameter-specific concentration units"
      frequency: "Continuous or each batch; pollutant sampling at permit or method frequency"
      temporal_coverage: "At least 12 representative months or full campaign"
      site_scope: "All included wet processes and treatment interfaces"
      aggregation_rule: "Build process-level water balance; report gross intake, internal reuse, discharge, and pollutant mass separately"
      quality_evidence: "Meter calibration, sampling chain of custody, laboratory accreditation, water-balance closure"
    - protocol_id: cp_waste_records
      process_id: "all_included_processes"
      flow_role: "Yarn, fabric, packaging, spent liquor, sludge, and waste oil"
      record_type: "Weighbridge tickets, container weights, transfer notes"
      raw_fields: "waste_id, material, process_origin, gross_mass, tare_mass, net_mass, hazardous_status, internal_reuse, treatment_route, destination"
      collection_method: "Direct weighing at generation or dispatch"
      unit: "kg"
      frequency: "Each movement with monthly reconciliation"
      temporal_coverage: "Full reporting period"
      site_scope: "All included processes"
      aggregation_rule: "Sum net mass by type and route; subtract internal reuse only once"
      quality_evidence: "Calibrated scale, licensed transfer documentation, receiver evidence, stock reconciliation"
    - protocol_id: cp_direct_emissions
      process_id: "all_included_processes"
      flow_role: "Direct air and water elementary flows"
      record_type: "Stack tests, continuous monitors, flow meters, laboratory data, fuel and chemical records"
      raw_fields: "substance, compartment, concentration, flow_rate, duration, control_status, method, detection_limit, factor_source"
      collection_method: "Measured concentration and flow preferred; otherwise calculation from collected activity data and a documented factor"
      unit: "kg substance and source measurement units"
      frequency: "At applicable monitoring frequency and whenever recipes or controls materially change"
      temporal_coverage: "Representative normal operation and disclosed abnormal periods"
      site_scope: "Every relevant emission point"
      aggregation_rule: "Emission mass equals concentration times flow and time, or collected activity times documented factor; avoid duplication with waste-to-treatment flows"
      quality_evidence: "Accredited method, calibration, detection-limit treatment, operating-state record, factor reference"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground rows"
      rule: "normalized amount = reporting-period amount divided by net kg of saleable reference fabric from the selected final process"
      inputs:
        - "Collected flow amount"
        - "cp_product_output net saleable mass"
      output: "Amount per 1 kg reference fabric"
      source_ids:
        - eu-pef-method-2021
    - id: calc_fibre_composition
      applies_to: "Product category membership"
      rule: "artificial staple fibre percentage = artificial staple-fibre mass divided by total fibre mass times 100; use the applicable ISO 1833 preparation and calculation basis for analytical results and exclude non-fibrous matter as that method requires"
      inputs:
        - "Supplier certificates"
        - "bill of materials"
        - "ISO 1833 test result"
      output: "Verified fibre composition percentage"
      source_ids:
        - un-cpc-3-0-2025
        - iso-1833-1-2020
    - id: calc_material_balance
      applies_to: "Each process and production lot"
      rule: "opening inventory plus inputs equals outputs plus closing inventory plus recorded losses; investigate unexplained residuals rather than assigning them automatically"
      inputs:
        - cp_material_mass_balance
        - cp_waste_records
        - cp_product_output
      output: "Process mass-balance report and residual"
      source_ids:
        - eu-jrc-textiles-bref-2023
        - eu-textiles-bat-conclusions-2022
    - id: calc_area_mass
      applies_to: "Area-only roll records"
      rule: "fabric mass = measured area times lot-specific mass per unit area; use measured net mass when available"
      inputs:
        - Area
        - "width and length"
        - "measured mass per unit area"
      output: "kg fabric"
      source_ids: []
    - id: calc_water_pollutant_mass
      applies_to: "Wastewater pollutants"
      rule: "pollutant mass = measured wastewater volume times representative concentration, with unit conversion and sampling coverage disclosed"
      inputs:
        - "cp_water_and_wastewater volume and concentration"
      output: "kg pollutant per reporting period and per kg reference fabric"
      source_ids:
        - eu-jrc-textiles-bref-2023
    - id: calc_shared_utility_allocation
      applies_to: "Shared utilities"
      rule: "allocate only the unmetered residual using the documented physical driver most closely related to consumption; reconcile allocated totals to the facility meter"
      inputs:
        - "Facility meter"
        - submeters
        - "operating hours"
        - "machine load"
        - throughput
      output: "Process-level utility amount"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and yarn inputs"
      requirement: "Retain exact flow identities where resolved, fibre type, composition, lot, supplier, and production-route qualifiers; unresolved inventory UUID candidates must be reviewed before activation."
      evidence: "Tiangong exact reference-flow readback, supplier certificates, lot records"
    - id: dq_temporal
      applies_to: "Foreground activity data"
      requirement: "Use a representative continuous 12-month period where production is ongoing, or the full campaign for shorter production; disclose shutdowns, abnormal batches, and seasonality."
      evidence: "Reporting-period coverage table and production log"
    - id: dq_technology
      applies_to: "Process and energy data"
      requirement: "Match loom type, sizing system, wet-processing route, drying or curing equipment, abatement, and recycled-water configuration to the represented product."
      evidence: "Equipment register, process flow sheet, recipe and control records"
    - id: dq_geography
      applies_to: "Utilities and upstream datasets"
      requirement: "Use the actual production geography and representative electricity, fuel, water, yarn, chemical, transport, and treatment datasets; document proxies."
      evidence: "Site address, supplier location, dataset metadata and proxy log"
    - id: dq_completeness
      applies_to: "Process inventory"
      requirement: "Reconcile material, water, energy, chemical, wastewater, direct-emission, and waste records at process level; disclose exclusions and missing measurements."
      evidence: "Input-output inventory and reconciliation reports consistent with JRC BAT 2 and BAT 6 and the ISO 14044 inventory-analysis requirements"
    - id: dq_precision
      applies_to: "Measurements and calculations"
      requirement: "Preserve meter resolution, calibration, sampling frequency, detection limits, formula inputs, allocation factors, and uncertainty or variability across lots."
      evidence: "Calibration records, laboratory reports, calculation workbook and anomaly log"
    - id: dq_consistency
      applies_to: "Multi-site or multi-product datasets"
      requirement: "Apply identical reference state, units, process boundaries, allocation hierarchy, and calculation rules across sites and periods; document any deviation."
      evidence: "Method statement and cross-site consistency review"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require product flow UUID 7037e578-630a-4ba2-8768-7858df8a46aa, Mass flow property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, mass unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids: []
  - rule_id: validate_composition_threshold
    applies_to: "Category scope"
    rule: "Fail category conformance when artificial staple fibres are less than 85% of total fibre mass or the fibre denominator and applicable ISO 1833 test basis are not documented."
    source_ids:
      - un-cpc-3-0-2025
      - iso-1833-1-2020
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Require all section 3 qualifiers, including fibre type, composition, construction, finished state, mass per unit area, moisture state, geography, and period."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "Foreground processes"
    rule: "Require a documented mass balance for every included process and investigate any unexplained residual before accepting the dataset."
    source_ids:
      - eu-jrc-textiles-bref-2023
  - rule_id: validate_process_coverage
    applies_to: "Process map"
    rule: "Require both required processes and every conditional process actually used to reach the declared market state; reject a finished-fabric claim that omits performed finishing operations."
    source_ids:
      - eu-jrc-textiles-bref-2023
  - rule_id: validate_inventory_and_quality
    applies_to: "Foreground inventory"
