      rule: "The foreground boundary starts at receipt of the declared prepared fibre or wool top. It starts at receipt of greasy shorn wool only when raw-wool scouring is performed within the foreground system. It ends with net saleable yarn on its declared winding support at the mill gate. The boundary includes material losses, recovered fibre, process water, utilities, auxiliaries, winding supports, direct wastes, wastewaters, and measured direct elementary flows of every included foreground process."
