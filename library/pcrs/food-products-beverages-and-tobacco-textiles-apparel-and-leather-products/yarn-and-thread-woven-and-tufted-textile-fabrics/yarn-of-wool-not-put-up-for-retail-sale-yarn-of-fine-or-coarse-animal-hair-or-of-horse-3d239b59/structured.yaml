allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "all multifunctional foreground operations"
    rule: "Subdivide by production line, batch, or process step and use directly measured relationships before applying allocation."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_shared_utilities
    applies_to: "shared electricity, steam, water, and auxiliaries"
    rule: "Allocate shared records using a documented causal driver such as metered consumption, machine operating time, or batch mass; disclose the driver and retain the unallocated source record."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_recovered_wool_grease
    applies_to: "scoured wool and recovered wool grease"
    rule: "Keep recovered wool grease as an explicit output. If subdivision and causal assignment cannot resolve shared burdens, apply and disclose a justified physical or economic allocation basis and report a sensitivity case; do not hide the output through a net credit."
    source_ids:
      - eu-pef-recommendation-2021-2279
      - eu-textiles-bat-2022-2508
  - rule_id: allocation_spinning_waste
    applies_to: "recovered or disposed wool spinning waste"
    rule: "Record the full waste mass and destination. Any recycling or avoided-product credit belongs to the declared downstream modelling method and must not be embedded in the foreground exchange amount."
    source_ids:
      - eu-pef-recommendation-2021-2279
      - wiedemann-recycled-wool-lca-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_scouring_batch_records
      process_id: "raw_wool_scouring"
      flow_role: "all scouring inputs and outputs"
      record_type: "batch record, meter record, stock issue, invoice, weighbridge record, discharge record"
      raw_fields: "batch_id; start/end time; input and output flow identity; gross, tare, and net mass; moisture basis; water meter; electricity meter; steam meter or invoice; detergent issue; grease recovery; wastewater quantity; waste destination"
      collection_method: "reconcile signed production, utility, stock, and discharge records to one batch identifier"
      unit: "kg, kWh, or declared source unit"
      frequency: "each scouring batch and each relevant meter period"
      temporal_coverage: "dates spanning the declared reporting period"
      site_scope: "every included scouring line and shared utility boundary"
      aggregation_rule: "sum verified records, allocate shared meters with the documented causal driver, then normalize to measured scoured-wool output"
      quality_evidence: "calibration status; invoice or stock reconciliation; batch sign-off; missing-record log"
    - protocol_id: cp_spinning_batch_records
      process_id: "fibre_preparation_spinning_winding"
      flow_role: "all fibre-preparation, spinning, winding, product, and waste exchanges"
      record_type: "batch record, stock issue, meter record, core issue, product weighment, waste weighment"
      raw_fields: "batch_id; fibre species and composition; spinning system; yarn count; twist; input mass and moisture; electricity; steam; process water; lubricant issue; core mass; net yarn mass; waste mass and destination"
      collection_method: "link production orders, meters, stock records, product weighments, and waste records to the same yarn batch"
      unit: "kg, kWh, or declared source unit"
      frequency: "each production batch and each relevant meter period"
      temporal_coverage: "dates spanning the declared reporting period"
      site_scope: "every included carding, combing, drawing, spinning, twisting, gimping, and winding line"
      aggregation_rule: "sum verified records, subtract tare and core mass from reference yarn, allocate shared utilities with the documented driver, then normalize to net yarn output"
      quality_evidence: "scale and meter calibration; composition certificate; production-order closure; stock and waste reconciliation"
    - protocol_id: cp_wet_finishing_batch_records
      process_id: "yarn_wet_finishing"
      flow_role: "all yarn wet-finishing inputs and outputs"
      record_type: "recipe, batch record, stock issue, meter record, product weighment, discharge record"
      raw_fields: "batch_id; unfinished-yarn mass; recipe chemical identities and issued masses; water; electricity; steam; finished-yarn mass; colour state; wastewater quantity; treatment destination"
      collection_method: "reconcile recipe, stock, meter, product, and discharge records to one wet-finishing batch"
      unit: "kg, kWh, or declared source unit"
      frequency: "each wet-finishing batch and each relevant meter period"
      temporal_coverage: "dates spanning the declared reporting period"
      site_scope: "every included yarn washing, dyeing, rinsing, and finishing line"
      aggregation_rule: "sum verified records, allocate shared utilities with the documented driver, then normalize to net finished-yarn output"
      quality_evidence: "recipe approval; scale and meter calibration; stock reconciliation; colour and product release record; discharge record"
  calculation_rules:
    - id: normalize_mass_exchange
      applies_to: "each mass-based exchange"
      rule: "measured exchange mass / measured net reference-stage output mass × 1 kg reference output"
      inputs:
        - "exchange mass"
        - "net process or reference output mass"
      output: "kg exchange per kg output"
      source_ids: []
    - id: normalize_energy_exchange
      applies_to: "each energy-based exchange"
      rule: "metered or causally allocated energy / measured net reference-stage output mass × 1 kg reference output"
      inputs:
        - "metered energy"
        - "shared-meter allocation driver when applicable"
        - "net output mass"
      output: "declared energy unit per kg output"
      source_ids:
        - eu-textiles-bat-2022-2508
    - id: convert_volume_to_mass
      applies_to: "process water or wastewater recorded by volume"
      rule: "measured volume × documented batch temperature density; retain the original volume record and density source"
      inputs:
        - "measured volume"
        - density
        - "temperature when material"
      output: "kg water or wastewater"
      source_ids: []
    - id: net_reference_yarn_mass
      applies_to: "yarn on winding supports"
      rule: "gross wound package mass − measured winding-support mass − other non-yarn tare"
      inputs:
        - "gross package mass"
        - "winding-support mass"
        - "tare mass"
      output: "kg net reference yarn"
      source_ids: []
    - id: foreground_mass_reconciliation
      applies_to: "each included process"
      rule: "reconcile all measured product inputs and outputs, separately measured wastes, stock changes, and moisture changes; investigate and disclose every unexplained imbalance rather than forcing closure"
      inputs:
        - "verified batch masses"
        - "stock change"
        - "measured moisture basis"
      output: "signed mass-reconciliation record"
      source_ids:
        - eu-pef-recommendation-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference yarn"
      requirement: "CPC 26340 scope, exact Tiangong reference-flow UUID, fibre species and composition, yarn system, count, twist or gimp construction, moisture basis, colour state, winding form, geography, period, and gate are all declared."
      evidence: "product specification; composition certificate; production order; dataset metadata"
    - id: dq_flow_identity
      applies_to: "every inventory exchange"
      requirement: "Each exchange names one physical or chemical flow. UUID-bearing rows must match the verified Tiangong type and property; unresolved rows remain explicit and may not borrow a broader or semantically different UUID."
      evidence: "flow identity review; Tiangong lookup; unresolved-identity disclosure"
    - id: dq_temporal_representativeness
      applies_to: "all foreground records"
      requirement: "The reporting period must represent the declared technology and product mix; start and end dates, downtime, abnormal batches, and substitutions are disclosed."
      evidence: "dated batch, meter, invoice, and maintenance records"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Include all category-defining fibre inputs, utilities, auxiliaries, winding supports, product outputs, wastes, wastewaters, and measured direct elementary flows within the declared cutoff; disclose the cutoff and every excluded flow."
      evidence: "process-flow reconciliation; stock reconciliation; completeness checklist; exclusion log"
    - id: dq_consistency
      applies_to: "normalization and shared records"
      requirement: "Use the same dry-mass basis, reference gate, conversion factors, and shared-record allocation drivers across the reporting period."
      evidence: "calculation workbook; meter map; conversion record; internal review"
    - id: dq_uncertainty_disclosure
      applies_to: "missing or allocated records"
      requirement: "Mark substituted, estimated, or allocated records; state method, reason, affected share, and sensitivity. No AI-generated quantity range is a foreground record."
      evidence: "gap log; allocation record; sensitivity result"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The reference product UUID is e4318719-55db-447b-8b6d-08a745a3dfb5, its type is Product flow, its CPC leaf is 26340, its reference property is Mass 93a60a56-a3c8-11da-a746-0800200b9a66, and the normalized amount is 1 kg net yarn."
    source_ids:
      - unsd-cpc-3-0-26340
  - rule_id: validate_required_qualifiers
    applies_to: "reference yarn"
    rule: "Reject a data package that omits fibre species, composition, spinning route, yarn count, twist or gimp construction, moisture basis, colour state, winding form, geography, reporting period, or foreground gate."
    source_ids:
      - unsd-cpc-3-0-26340
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Reject any inventory card that combines multiple fibres, chemicals, electricity scenarios, steam or heat supplies, fuels, packaging components, wastes, wastewaters, or elementary flows, or that uses a selector or placeholder as the selected flow."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_non_wool_route
    applies_to: "fine animal-hair, coarse animal-hair, or horsehair yarn"
    rule: "Require one species-specific prepared-fibre input per actual fibre; reject use of Scoured Wool, Wool Top, or a collective animal-hair identity as a proxy."
    source_ids:
      - unsd-cpc-3-0-26340
  - rule_id: validate_unresolved_identity
    applies_to: "rows without a confirmed flow UUID"
    rule: "Treat validation as inconclusive until each used unresolved row is bound to one state_code 100 Tiangong flow with matching type, name semantics, property, and unit; do not copy a rejected candidate UUID."
    source_ids: []
  - rule_id: validate_foreground_amounts
    applies_to: "all inventory amounts"
    rule: "Require collected records or calculations linked to a collection protocol. Reject an AI estimate, an uncited default, or a literature value presented as a measured foreground amount."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_route_completeness
    applies_to: "included foreground processes"
    rule: "Confirm every required process and every applicable conditional process is present, actual recipe chemicals are separate rows, shared utilities are allocated transparently, and all waste and wastewater destinations are declared."
    source_ids:
      - eu-jrc-textiles-bref-2023
      - eu-textiles-bat-2022-2508
  - rule_id: validate_mass_reconciliation
    applies_to: "each included process"
    rule: "Require a signed mass reconciliation and disclosure of every unresolved imbalance, moisture adjustment, stock change, recovered output, and waste stream."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_allocation
    applies_to: "multifunctional operations"
    rule: "Require subdivision or a documented causal driver first; where residual allocation remains, require the selected basis, justification, and sensitivity disclosure."
    source_ids:
      - eu-pef-recommendation-2021-2279
published_dataset_profile:
  dataset_role: "foreground unit-process data package and aggregated yarn-mill dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "production of CPC 26340 wool, declared animal-hair, or horsehair yarn when reference qualifiers, fibre identity, route, geography, period, and gate match"
  excluded_use: "raw-fibre production; generic textile yarn without fibre identity; fabric or garment manufacture; retail packaging; another CPC category; comparative assertion without a compatible reviewed study design"
  required_metadata: "canonical PCR id; reference-flow UUID and property; fibre species and composition; virgin or recycled content; spinning system; yarn count; twist or gimp construction; moisture basis; colour state; winding form; geography; reporting period; technology; foreground gate; included conditional processes; data owners"
  required_quality_disclosure: "source records and coverage; meter and scale calibration; shared-record allocation; unresolved flow identities; substitutions; cutoffs; exclusions; mass reconciliation; waste and wastewater destinations; uncertainty and sensitivity"
  update_trigger: "change in fibre species or composition, CPC identity, reference-flow UUID, spinning system, wet-processing route, energy supply, allocation method, foreground gate, major technology, or source evidence that materially changes the rules"
