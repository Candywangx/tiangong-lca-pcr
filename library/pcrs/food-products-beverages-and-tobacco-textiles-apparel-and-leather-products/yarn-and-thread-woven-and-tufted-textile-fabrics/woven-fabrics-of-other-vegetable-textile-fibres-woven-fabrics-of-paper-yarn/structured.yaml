allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared foreground operations"
    rule: "Avoid allocation by separate metering, subdivision, production-order records or another demonstrated causal separation wherever practicable."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_physical
    applies_to: "Unavoidable sharing among woven-fabric products"
    rule: "When subdivision is not practicable, use a documented physical relationship that reflects how material and energy demands change, such as machine time, loom picks or treated mass, and apply it consistently."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_economic_fallback
    applies_to: "Shared burdens without a defensible physical relationship"
    rule: "Use economic allocation only as a documented fallback; retain price period, currency, product quantities and a sensitivity result."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_recycling_and_waste
    applies_to: "Recovered sizing material, yarn waste, offcuts and wastewater treatment"
    rule: "Report recovered internal material as an internal loop without subtracting more than the measured input; model exported waste or recovered material as an output and disclose any credit or burden convention."
    source_ids:
      - iso-14044-2006
      - eu-2022-2508-textiles-bat
dataset_production:
  collection_protocols:
    - protocol_id: cp_weaving_material_records
      process_id: "warp_prep_weaving"
      flow_role: "other_vegetable_yarn_input; paper_yarn_input; woven_fabric_weaving_output; yarn_waste_output"
      record_type: "Weighing and production-order records"
      raw_fields: "flow identity; lot; opening mass; closing mass; issued mass; returned mass; output mass; waste mass; moisture basis"
      collection_method: "Calibrated scales reconciled to production orders and inventory movements"
      unit: "kg"
      frequency: "Each lot or production order"
      temporal_coverage: "Full representative production period"
      site_scope: "All included warping and weaving lines"
      aggregation_rule: "Sum same-basis records by row_id, then divide by conforming woven-fabric mass"
      quality_evidence: "Calibration records; lot traceability; stock reconciliation; signed production report"
    - protocol_id: cp_sizing_records
      process_id: "warp_prep_weaving"
      flow_role: "modified_starch_input; process_water_sizing_input; warp_sizing_wastewater_output"
      record_type: "Batch sheet and meter records"
      raw_fields: "batch id; chemical identity; concentration; chemical mass; supplied water; recovered water; wastewater volume or mass; density"
      collection_method: "Reconcile batch recipes, dosing records and water or effluent meters"
      unit: "kg"
      frequency: "Each sizing batch"
      temporal_coverage: "Full representative production period"
      site_scope: "All included sizing lines"
      aggregation_rule: "Sum boundary-crossing inputs and outputs by row_id; prevent double counting of internal recovery"
      quality_evidence: "Dosing calibration; meter records; batch reconciliation; recovery log"
    - protocol_id: cp_weaving_energy_records
      process_id: "warp_prep_weaving"
      flow_role: "electricity_weaving_input; compressed_air_input"
      record_type: "Submeter and equipment-hour records"
      raw_fields: "meter id; opening reading; closing reading; loom group; operating hours; air pressure basis; production output"
      collection_method: "Direct submeters preferred; documented engineering allocation only for shared meters"
      unit: "kWh; m3"
      frequency: "Each shift or meter interval"
      temporal_coverage: "Full representative production period"
      site_scope: "All included warping, sizing and weaving equipment"
      aggregation_rule: "Sum meter deltas and allocate shared service only by documented causal driver"
      quality_evidence: "Meter calibration; utility reconciliation; loom log; allocation worksheet"
    - protocol_id: cp_wet_material_records
      process_id: "wet_treatment"
      flow_role: "woven_fabric_wet_input; process_water_wet_input; sodium_hydroxide_wet_input; hydrogen_peroxide_wet_input; woven_fabric_wet_output"
      record_type: "Batch, dosing, meter and weighing records"
      raw_fields: "batch id; fabric mass; moisture basis; chemical identity; concentration; charged mass; water meter readings; output mass"
      collection_method: "Reconcile process recipe, automated dosing, meters and fabric weights for each batch"
      unit: "kg"
      frequency: "Each wet-treatment batch"
      temporal_coverage: "Full representative production period"
      site_scope: "All included wet-treatment lines"
      aggregation_rule: "Sum each atomic exchange by row_id and normalize to conforming treated-fabric mass"
      quality_evidence: "Batch sheet; dosing calibration; water balance; fabric weight record"
    - protocol_id: cp_wet_energy_records
      process_id: "wet_treatment"
      flow_role: "steam_wet_input; electricity_wet_input"
      record_type: "Utility meter records"
      raw_fields: "meter id; opening reading; closing reading; batch id; process time; treated output"
      collection_method: "Direct utility meters preferred; shared use allocated by documented causal driver"
      unit: "kg; kWh"
      frequency: "Each batch or meter interval"
      temporal_coverage: "Full representative production period"
      site_scope: "All included wet-treatment equipment"
      aggregation_rule: "Sum meter deltas and normalize to treated-fabric mass"
      quality_evidence: "Meter calibration; boiler or supplier statement; batch log"
    - protocol_id: cp_wet_effluent_records
      process_id: "wet_treatment"
      flow_role: "textile_wastewater_output"
      record_type: "Effluent meter and treatment-transfer records"
      raw_fields: "discharge point; volume or mass; density; pH; temperature; treatment destination; sampling time"
      collection_method: "Meter the relevant stream at the process or treatment boundary and retain treatment-transfer evidence"
      unit: "kg"
      frequency: "Each discharge interval or batch"
      temporal_coverage: "Full representative production period"
      site_scope: "Every included wet-treatment discharge point"
      aggregation_rule: "Sum the single wastewater stream after preventing overlap with internal reuse"
      quality_evidence: "Meter calibration; water balance; laboratory and transfer records"
    - protocol_id: cp_packaging_records
      process_id: "inspection_packaging"
      flow_role: "paperboard_core_input; polyethylene_film_input; electricity_pack_input; fabric_offcuts_output"
      record_type: "Packaging issue, meter and waste records"
      raw_fields: "packaging identity; issued mass; returned mass; product order; electricity readings; offcut mass"
      collection_method: "Reconcile packaging stock, equipment meters and waste weights to released product"
      unit: "kg; kWh"
      frequency: "Each production order or shift"
      temporal_coverage: "Full representative production period"
      site_scope: "All included inspection and packing stations"
      aggregation_rule: "Sum net packaging issue, metered energy and measured offcuts; normalize to reference product mass"
      quality_evidence: "Stock reconciliation; scale and meter calibration; waste ticket"
    - protocol_id: cp_final_product_records
      process_id: "inspection_packaging"
      flow_role: "woven_fabric_pack_input; reference_woven_fabric_output"
      record_type: "Quality-release and weighing records"
      raw_fields: "roll id; route; composition; width; areal density; moisture basis; treatment state; gross mass; packaging mass; net mass; conformity status"
      collection_method: "Weigh released rolls and retain quality inspection and packaging deductions"
      unit: "kg"
      frequency: "Each released roll or lot"
      temporal_coverage: "Full representative production period"
      site_scope: "All conforming product leaving the declared mill gate"
      aggregation_rule: "Sum net conforming mass only; exclude rejected output and excluded packaging"
      quality_evidence: "Calibration record; release certificate; roll traceability; rejection log"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every foreground inventory row"
      rule: "normalized amount = allocated boundary-crossing row amount / net conforming reference-product mass"
      inputs:
        - "row amount"
        - "allocation share"
        - reference_woven_fabric_output
      output: "amount per 1 kg reference woven fabric"
      source_ids:
        - iso-14044-2006
    - id: calc_internal_transfer_check
      applies_to: "Woven-fabric process links"
      rule: "Compare upstream woven-fabric output with downstream input on the same moisture basis; explain measured storage change, sampling or loss before normalization"
      inputs:
        - "upstream output mass"
        - "downstream input mass"
        - "moisture basis"
        - "documented change"
      output: "reconciled internal transfer"
      source_ids:
        - iso-14044-2006
    - id: calc_water_balance
      applies_to: "Sizing and wet treatment"
      rule: "supplied water + transferred-in water = product-retained water + wastewater + recovered/reused water + measured evaporation or documented balance difference"
      inputs:
        - "supplied water"
        - wastewater
        - reuse
        - "product moisture"
        - evaporation
      output: "process water balance and completeness flag"
      source_ids:
        - eu-2022-2508-textiles-bat
    - id: calc_mass_reconciliation
      applies_to: "Each production period"
      rule: "yarn and other material inputs shall be reconciled to conforming product, wastes, internal inventory change and documented process losses on consistent moisture bases"
      inputs:
        - "material inputs"
        - outputs
        - wastes
        - "stock change"
        - "moisture corrections"
      output: "mass reconciliation and unexplained difference"
      source_ids:
        - eu-2022-2508-textiles-bat
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and yarn input"
      requirement: "Retain supplier and production records proving route, fibre or paper-yarn identity, blend fractions and exclusion from separately classified woven-fabric categories."
      evidence: "Supplier specification; bill of materials; CPC scope check; lot traceability"
    - id: dq_measurement
      applies_to: "Mass, energy, water, compressed air and effluent"
      requirement: "Use calibrated direct measurement where available; document meter coverage, conversion factors, shared-meter allocation and uncertainty."
      evidence: "Calibration certificates; meter map; invoices; allocation worksheet"
    - id: dq_temporal
      applies_to: "Foreground reporting period"
      requirement: "Use a representative period covering normal production and disclose shutdowns, trials, abnormal conditions and product-mix changes."
      evidence: "Production calendar; batch and downtime logs; abnormal-condition records"
    - id: dq_completeness
      applies_to: "Inputs, outputs, wastes and direct emissions"
      requirement: "Reconcile the site input-output inventory to the PCR rows and add one atomic row for every relevant unlisted chemical, waste or direct emission."
      evidence: "Input-output inventory; chemical inventory; waste register; permit and monitoring records"
    - id: dq_wet_treatment
      applies_to: "Conditional wet-treatment process"
      requirement: "Record recipe, chemical concentration, water balance, energy, effluent quantity, treatment destination and relevant monitored parameters for each included operation."
      evidence: "Batch sheets; automated dosing logs; meters; laboratory results; treatment records"
    - id: dq_uuid_traceability
      applies_to: "Tiangong identities"
      requirement: "Use only UUIDs confirmed for the exact flow semantics; keep any non-exact identity absent and resolve the corresponding manifest review item before publication."
      evidence: "Hybrid retrieval result; direct state-code-100 flow read; review decision"
validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "Product identity"
    rule: "Fail validation if CPC 26590, yarn route, fibre or paper-yarn identity, weave construction, mass fractions, treatment state or excluded-category check is missing."
    source_ids:
      - un-cpc-3-0-26590
  - rule_id: validate_reference_mass
    applies_to: "Reference flow"
    rule: "Require exactly 1 kg of the verified CPC 26590 Product flow with Mass as the reference property and kg as the reference unit; packaging and moisture basis shall be explicit."
    source_ids:
      - jrc-ilcd-flow-format-1-1
  - rule_id: validate_process_route
    applies_to: "Process map"
    rule: "Require warp_prep_weaving and inspection_packaging; require wet_treatment only when the declared product state includes an in-house wet operation, and reject undeclared route extensions."
    source_ids:
      - jrc-textiles-bref-2023
      - eu-2022-2508-textiles-bat
  - rule_id: validate_atomic_inventory
    applies_to: "Process inventory"
    rule: "Require one physical or chemical exchange per row_id, exact row order and bilingual UUID alignment; reject grouped utilities, chemicals, packaging, wastes or emissions."
    source_ids:
      - eu-2022-2508-textiles-bat
  - rule_id: validate_records_and_period
    applies_to: "Foreground amounts"
    rule: "Require each non-not-applicable row to link to a collection protocol and retain measurement, temporal coverage, site scope and quality evidence for the same production period."
    source_ids:
      - eu-2022-2508-textiles-bat
  - rule_id: validate_mass_and_water_balance
    applies_to: "Material and water reconciliation"
    rule: "Require documented mass reconciliation for each included process and a water balance when sizing or wet treatment is included; investigate unexplained differences rather than forcing a balance."
    source_ids:
      - eu-2022-2508-textiles-bat
  - rule_id: validate_allocation
    applies_to: "Shared operations"
    rule: "Require evidence that subdivision or direct measurement was attempted, the chosen driver has a causal or otherwise documented basis, and any economic fallback includes sensitivity information."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_direct_releases
    applies_to: "Wastes and emissions"
    rule: "Require the site input-output inventory, permit and monitoring records to be checked for relevant wastes and direct releases; each included item shall be represented by its own exchange and treatment or receiving compartment."
    source_ids:
      - eu-2022-2508-textiles-bat
published_dataset_profile:
  dataset_role: "Foreground production dataset for CPC 26590 woven fabric at a declared mill-gate state"
  downstream_use: "secondary_dataset; background_dataset; process and lifecyclemodel projection"
  allowed_use: "LCI and LCA modelling where yarn route, product state, geography, technology, period, packaging and allocation match the study"
  excluded_use: "Other separately classified fabrics, yarn production, special or nonwoven fabrics, undeclared dyeing or finishing, garments, use phase and end of life"
  required_metadata: "Canonical PCR id; CPC code; yarn route; fibre or paper-yarn identity; composition; weave; areal density; width; moisture basis; treatment state; sizing and loom technology; geography; period; packaging; allocation; UUID review status"
  required_quality_disclosure: "Meter coverage and calibration; temporal representativeness; mass and water reconciliation; chemical and waste completeness; treatment destinations; direct-emission review; shared-service allocation; unresolved identities"
  update_trigger: "Change in yarn route, composition, loom technology, sizing chemistry, wet-treatment recipe, utility supply, wastewater treatment, packaging, allocation method, production geography or representative period"
