allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared conversion and packing operations"
    rule: "First subdivide or meter product lines, lots, and wet-processing operations so that sewing-thread inputs, energy, packaging, and wastes are directly assigned wherever practicable."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_physical_mass
    applies_to: "residual shared burdens"
    rule: "If subdivision or direct metering cannot remove a shared burden, allocate it by net mass of conforming product output, disclose the affected flows and allocation fraction, and test sensitivity when another physical relation may materially change results."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rework_and_waste
    applies_to: "internal rework and waste outputs"
    rule: "Return internally rewound or reworked thread to the same lot without treating it as a co-product; record only material leaving for external recovery or disposal as waste and disclose any credited external recovery outside this gate-to-gate inventory."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_input_records
      process_id: "thread_conversion_winding_packaging"
      flow_role: "route-applicable yarn and textile twisting oil"
      record_type: "weighbridge, warehouse issue, invoice, and return record"
      raw_fields: "material identity; Tiangong UUID if resolved; supplier; lot; fibre composition; opening mass; issued mass; returned mass"
      collection_method: "reconcile purchase/warehouse records with lot issue and return records"
      unit: "kg"
      frequency: "each lot; monthly reconciliation"
      temporal_coverage: "declared reporting period"
      site_scope: "all in-scope conversion lines"
      aggregation_rule: "consumed mass = issued mass minus documented return; normalize by conforming thread output"
      quality_evidence: "calibrated scale record; supplier specification; inventory reconciliation"
    - protocol_id: cp_electricity_meter
      process_id: "thread_conversion_winding_packaging"
      flow_role: "medium-voltage alternating current"
      record_type: "electricity meter and production-time record"
      raw_fields: "meter start; meter end; voltage level; production line; lot time; shared-load basis"
      collection_method: "direct submetering preferred; otherwise documented physical allocation from facility meter"
      unit: "kWh"
      frequency: "each lot or shift; monthly reconciliation"
      temporal_coverage: "declared reporting period"
      site_scope: "all in-scope conversion and packing equipment"
      aggregation_rule: "subtract documented idle/non-product load and divide assigned kWh by conforming thread output"
      quality_evidence: "meter calibration; bill reconciliation; allocation worksheet"
    - protocol_id: cp_packaging_records
      process_id: "thread_conversion_winding_packaging"
      flow_role: "polypropylene cone and corrugated board box"
      record_type: "packaging issue, supplier mass specification, and return record"
      raw_fields: "component identity; component count; unit mass; issued count; returned count"
      collection_method: "weigh representative components and reconcile issued less returned quantities"
      unit: "kg"
      frequency: "each packaging lot"
      temporal_coverage: "declared reporting period"
      site_scope: "all packaging used for the reference product"
      aggregation_rule: "component mass = net count multiplied by verified unit mass; normalize by net thread output"
      quality_evidence: "scale calibration; supplier specification; count reconciliation"
    - protocol_id: cp_product_output
      process_id: "thread_conversion_winding_packaging"
      flow_role: "final sewing thread"
      record_type: "finished-goods scale and quality-release record"
      raw_fields: "lot; gross mass; tare mass; net thread mass; moisture/conditioning basis; rejected mass"
      collection_method: "weigh released product and subtract separately measured cone/spool and packaging tare"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "declared reporting period"
      site_scope: "all released reference product"
      aggregation_rule: "sum conforming net thread mass only"
      quality_evidence: "calibrated scale; quality release; tare verification"
    - protocol_id: cp_waste_output
      process_id: "thread_conversion_winding_packaging"
      flow_role: "synthetic sewing-thread offcuts"
      record_type: "waste-bin scale ticket and transfer record"
      raw_fields: "waste identity; source lot; container tare; gross mass; destination; date"
      collection_method: "weigh each transfer and subtract container tare"
      unit: "kg"
      frequency: "each transfer; monthly reconciliation"
      temporal_coverage: "declared reporting period"
      site_scope: "all in-scope conversion lines"
      aggregation_rule: "sum net offcut mass by lot and normalize by conforming output"
      quality_evidence: "calibrated scale; transfer receipt; mass-balance reconciliation"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "final sewing thread"
      rule: "net_thread_kg = gross_released_kg - cone_spool_tare_kg - transport_packaging_tare_kg"
      inputs:
        - "released gross mass"
        - "cone/spool tare"
        - "packaging tare"
      output: "net sewing-thread mass"
      source_ids:
        - iso-14048-2002
    - id: calc_material_normalization
      applies_to: "mass-based inputs and waste"
      rule: "normalized_kg_per_kg = lot_flow_kg / conforming_net_thread_kg"
      inputs:
        - "lot flow mass"
        - "conforming net output mass"
      output: "kg per kg reference flow"
      source_ids:
        - iso-14048-2002
    - id: calc_energy_normalization
      applies_to: "medium-voltage alternating current"
      rule: "normalized_kWh_per_kg = assigned_lot_kWh / conforming_net_thread_kg"
      inputs:
        - "assigned meter consumption"
        - "conforming net output mass"
      output: "kWh per kg reference flow"
      source_ids:
        - iso-14048-2002
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and yarn inputs"
      requirement: "Retain product specification, fibre composition, filament/staple route, linear density, ply, twist, finish, colour state, and CPC 26410 classification evidence."
      evidence: "supplier certificate; bill of materials; quality-release record"
    - id: dq_temporal_coverage
      applies_to: "all foreground flows"
      requirement: "Use a representative continuous 12-month period where available, or disclose a shorter campaign/lot period and its seasonality, downtime, and product-mix limitations."
      evidence: "dated meter, warehouse, production, and waste records"
    - id: dq_completeness
      applies_to: "process boundary"
      requirement: "Reconcile yarn input, twisting oil, packaging, electricity, conforming product, rework, and thread offcuts; identify separately linked wet processing and every known excluded flow."
      evidence: "signed mass-balance and boundary checklist"
    - id: dq_measurement
      applies_to: "mass and electricity"
      requirement: "Use calibrated instruments or supplier-certified unit masses and retain the allocation worksheet for any shared meter."
      evidence: "calibration certificate; supplier specification; meter reconciliation"
    - id: dq_uuid_resolution
      applies_to: "unresolved atomic flows"
      requirement: "Before active review, repeat Tiangong lookup for each unresolved row and accept a UUID only after state, flow type, name semantics, property, and unit are verified."
      evidence: "review record linked by row_id"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
    rule: "Fail category conformance unless the dataset declares sewing-thread use, man-made filament or staple-fibre composition, CPC 26410 scope, and all required qualifiers."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_reference_mass
    applies_to: "reference flow"
    rule: "Fail when the reference quantity includes cone/spool or transport-packaging mass, lacks a conditioning basis, or is not normalized to 1 kg net conforming thread."
    source_ids:
      - iso-14048-2002
  - rule_id: validate_atomic_inventory
    applies_to: "all inventory rows"
    rule: "Fail when a selected flow combines materials, utilities, packaging components, wastes, emissions, or future selection instructions; each row shall identify one atomic exchange."
    source_ids:
      - jrc-textiles-bref-2023
  - rule_id: validate_route_boundary
    applies_to: "dyed or chemically finished product"
    rule: "Fail full factory-gate conformance when marketed wet processing is omitted or represented without a linked process containing actual atomic recipe, water, energy, wastewater, residue, and direct-emission records."
    source_ids:
      - jrc-textiles-bref-2023
      - eu-textiles-bat-2022
  - rule_id: validate_mass_balance
    applies_to: "conversion lot"
    rule: "Require documented reconciliation of incoming yarn and oil with conforming thread, internal rework, retained stock change, and offcut waste; report any unexplained imbalance rather than forcing closure."
    source_ids:
      - iso-14048-2002
  - rule_id: validate_uuid_state
    applies_to: "UUID-bearing rows"
    rule: "Accept a Tiangong UUID only when direct read confirms state_code 100, the required flow type, matching name semantics, and the declared flow property/unit."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate production dataset for factory-gate sewing thread of man-made filaments or staple fibres"
  downstream_use: "secondary_dataset; background_dataset after review and geographic, technological, and product-state representativeness assessment"
  allowed_use: "Cradle-to-gate or broader LCA models when compatible upstream yarn and any route-applicable wet-processing datasets are linked and required qualifiers match"
  excluded_use: "Natural-fibre sewing thread; generic yarn not made for sewing; cradle-to-gate claims without upstream yarn; dyed/finished product claims with omitted wet processing; use-stage or durability equivalence"
  required_metadata: "PCR id and version; CPC 26410; product qualifiers; facility and geography; reporting period; technology; boundary; upstream yarn links; linked wet-processing process if any; allocation; data quality; unresolved UUID disclosure"
  required_quality_disclosure: "Primary-record share; meter and scale coverage; temporal and site coverage; shared-meter allocation; mass-balance result; excluded flows; wet-processing link status; unresolved UUID rows"
  update_trigger: "Change in fibre family/composition, yarn route, twisting technology, finish or wet-processing route, energy supply, packaging, allocation, facility geography, or evidence that materially changes the inventory"
