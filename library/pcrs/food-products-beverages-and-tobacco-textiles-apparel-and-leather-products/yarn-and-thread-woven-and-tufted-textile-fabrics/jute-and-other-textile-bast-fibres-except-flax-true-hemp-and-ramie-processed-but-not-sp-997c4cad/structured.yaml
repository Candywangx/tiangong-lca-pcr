allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared processes producing main fibre, tow and saleable fibre waste"
    rule: "First subdivide metered unit processes or expand the system where this produces a transparent multifunctional result. Do not allocate a separately measured process."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "inseparable shared burdens"
    rule: "If subdivision or expansion is not feasible and output mass is a relevant physical relationship, allocate shared burdens by the dry-mass-equivalent saleable outputs measured for the same campaign. Exclude internal recirculation and waste sent to treatment from the saleable denominator."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_other_relation
    applies_to: "outputs for which mass does not represent the underlying function"
    rule: "If no defensible physical relationship exists, use another documented relationship such as campaign-average economic value; disclose prices, averaging period, currency, allocation factors and sensitivity to the physical alternative."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: waste_product_status
    applies_to: "tow, fibre waste, caddies and off-spec fibre"
    rule: "Classify each material once from evidence of destination: saleable specification and transaction evidence make it a product or co-product; a treatment obligation makes it waste. Do not model one mass as both."
    source_ids:
      - unsd-cpc-ver-3-2025
      - ec-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_mass_identity
      process_id: "all"
      flow_role: "fibre inputs, intermediates and final product"
      record_type: "scale ticket plus lot record"
      raw_fields: "gross mass; tare; net mass; moisture; species; grade; product state; lot id; timestamp"
      collection_method: "calibrated scale and representative moisture sample"
      unit: "kg; percent"
      frequency: "each lot and each process transfer"
      temporal_coverage: "at least one representative production year or disclosed campaign"
      site_scope: "all included lines and shifts"
      aggregation_rule: "sum net mass by lot and process state; retain moisture basis before normalization"
      quality_evidence: "calibration certificate; sampling record; reconciliation to inventory and sales"
    - protocol_id: cp_batching_materials
      process_id: "selection_batching"
      flow_role: "process water, batching oil and surfactant"
      record_type: "meter, batch sheet and inventory issue"
      raw_fields: "material identity; supplier; batch; opening and closing stock; additions; returned material; water meter"
      collection_method: "direct meter or mass balance for each atomic material"
      unit: "m3 or kg"
      frequency: "each batch, aggregated monthly"
      temporal_coverage: "same reference period as product"
      site_scope: "every batching line"
      aggregation_rule: "sum each material separately; no combined emulsion placeholder"
      quality_evidence: "meter calibration; batch sheets; purchase and stock reconciliation"
    - protocol_id: cp_process_electricity
      process_id: "all"
      flow_role: "electricity"
      record_type: "sub-meter or equipment allocation record"
      raw_fields: "meter start/end; equipment id; run time; power; production lot"
      collection_method: "prefer sub-meter; otherwise engineering allocation reconciled to facility bill"
      unit: "kWh"
      frequency: "each shift or campaign"
      temporal_coverage: "same reference period as product"
      site_scope: "all included equipment and auxiliaries"
      aggregation_rule: "aggregate by process and normalize with actual process output"
      quality_evidence: "meter calibration or bill reconciliation; allocation worksheet"
    - protocol_id: cp_waste_mass_destination
      process_id: "all"
      flow_role: "each product co-output and waste stream"
      record_type: "container scale ticket and destination record"
      raw_fields: "stream identity; gross; tare; net; product/waste status; internal return; consignee; treatment"
      collection_method: "separate containers and calibrated weighing"
      unit: "kg"
      frequency: "each removal or lot"
      temporal_coverage: "same reference period as product"
      site_scope: "all included lines"
      aggregation_rule: "sum each named stream; subtract internal returns once"
      quality_evidence: "scale calibration; sales invoice, transfer note or waste manifest"
    - protocol_id: cp_wastewater_volume_quality
      process_id: "selection_batching"
      flow_role: "wastewater volume, COD, BOD5, oil and grease"
      record_type: "flow meter and laboratory result"
      raw_fields: "discharge volume; sampling time; concentration; treatment stage; destination"
      collection_method: "continuous volume measurement and representative composite sample where feasible"
      unit: "m3; mg/L"
      frequency: "volume continuous or per batch; quality at permit or representative frequency"
      temporal_coverage: "same reference period as product"
      site_scope: "each discharge point attributable to included processes"
      aggregation_rule: "pair concentration with matching volume and calculate each pollutant separately"
      quality_evidence: "laboratory method, chain of custody, meter calibration, treatment records"
    - protocol_id: cp_air_particulate
      process_id: "selection_batching_carding_drawing"
      flow_role: "particulate matter to air"
      record_type: "stack or outlet test and ventilation operating record"
      raw_fields: "concentration; gas volume; duration; control-device state; process throughput"
      collection_method: "direct measurement or documented site-specific calculation"
      unit: "mg/m3; m3; h; kg"
      frequency: "permit frequency and after material control change"
      temporal_coverage: "representative operating conditions in reference period"
      site_scope: "every material dust outlet"
      aggregation_rule: "calculate outlet mass separately by process; captured dust remains a waste flow"
      quality_evidence: "accredited test report; instrument calibration; control-device log"
    - protocol_id: cp_packaging_components
      process_id: "product_presentation"
      flow_role: "steel wire and polypropylene strap"
      record_type: "purchase issue or direct bale bill of materials"
      raw_fields: "component identity; unit mass; pieces per bale; return or reuse"
      collection_method: "direct weighing or supplier specification checked by sample"
      unit: "kg"
      frequency: "each packaging design and monthly reconciliation"
      temporal_coverage: "current packaging design during reference period"
      site_scope: "all delivered presentations"
      aggregation_rule: "calculate each component separately per delivered mass"
      quality_evidence: "supplier specification; sample weights; purchase reconciliation"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "all inventory exchanges"
      rule: "normalized amount = period exchange amount / period delivered reference-product mass × selected reference amount"
      inputs:
        - "exchange amount"
        - "delivered reference-product mass"
        - "selected basis of 1 or 1"
        - "000 kg"
      output: "normalized exchange amount"
      source_ids:
        - ec-pef-2021-2279
    - id: calc_moisture_conversion
      applies_to: "fibre masses when a common moisture basis is required"
      rule: "dry mass = as-received mass × (1 − wet-basis moisture fraction); any conversion back to a declared moisture basis shall state the convention and factor"
      inputs:
        - "as-received mass"
        - "measured moisture"
        - "basis convention"
      output: "fibre mass on declared basis"
      source_ids:
        - ec-pef-2021-2279
    - id: calc_wastewater_load
      applies_to: "each COD, BOD5 or oil-and-grease row"
      rule: "pollutant load (kg) = concentration (mg/L) × wastewater volume (m3) / 1,000"
      inputs:
        - "matched concentration and discharge volume"
      output: "pollutant mass to water"
      source_ids:
        - ec-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "each process and reporting period"
      rule: "input fibre mass plus separately measured additions = product outputs plus product co-outputs plus wastes plus measured stock change plus documented moisture-related mass change; investigate rather than force-close unexplained difference"
      inputs:
        - input
        - output
        - waste
        - "stock and moisture records"
      output: "reconciliation and unexplained mass difference"
      source_ids:
        - ec-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and all fibre flows"
      requirement: "Retain species, product state, grade, moisture basis, oil treatment, lot linkage and product-versus-waste status; the reference product must remain within CPC 26170."
      evidence: "lot specification, Tiangong UUID, scale ticket and transaction or destination evidence; unsd-cpc-ver-3-2025"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use records from one coherent reference period, normally at least 12 consecutive months; disclose shorter campaigns, shutdowns and atypical production."
      evidence: "dated meters, ledgers, laboratory reports and production calendar; ec-pef-2021-2279"
    - id: dq_completeness
      applies_to: "each included process"
      requirement: "Reconcile product, co-product, waste, water, electricity, materials, wastewater indicators and direct air emissions; disclose every excluded or unavailable atomic exchange."
      evidence: "process reconciliation, missing-data register and completeness review; ec-pef-2021-2279"
    - id: dq_representativeness
      applies_to: "technology, geography and product mix"
      requirement: "Match the recorded lines, fibre mix and operating conditions to the declared dataset; disclose proxy equipment allocation or upstream datasets."
      evidence: "line list, production shares, supplier records and data-quality assessment; ec-pef-2021-2279"
    - id: dq_source_traceability
      applies_to: "calculations and secondary data"
      requirement: "Preserve raw values, units, conversions, allocation factors, source versions and reviewer-visible calculation worksheets."
      evidence: "audit trail and calculation files; ec-pef-2021-2279"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
    rule: "Fail validation if the UUID, Product-flow type, Mass property, kg unit, CPC 26170 scope or required product-state qualifiers are missing or inconsistent."
    source_ids:
      - unsd-cpc-ver-3-2025
  - rule_id: validate_scope
    applies_to: "foreground boundary"
    rule: "Fail validation if cultivation, retting or primary extraction is merged without a separate upstream unit process, or if spinning and downstream conversion are included without explicit extension disclosure."
    source_ids:
      - unsd-cpc-ver-3-2025
      - fao-ijo-improved-retting-jute
      - bis-jute-certification-manual
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Fail validation if electricity, water, batching oil, surfactant, packaging components, each waste, wastewater volume, COD, BOD5, oil and grease, or particulate emission is combined with another exchange or replaced by a selector label."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "each included process"
    rule: "Fail validation when input, output, waste, stock and moisture reconciliation is absent; report unexplained differences rather than silently allocating them."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "shared burdens and co-products"
    rule: "Fail validation when co-product status, denominator, factors or allocation hierarchy are undocumented, or when the same fibre mass is counted as both product and waste."
    source_ids:
      - ec-pef-2021-2279
      - unsd-cpc-ver-3-2025
  - rule_id: validate_data_quality
    applies_to: "published foreground data package"
    rule: "Fail validation when temporal, technological or geographical representativeness, meter and laboratory evidence, proxy use or missing-data disclosures are absent."
    source_ids:
      - ec-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground product-category dataset for processed-but-unspun jute or other eligible bast fibre at the preparation-facility gate"
  downstream_use: "May be published as a secondary_dataset or background_dataset for spinning, textile conversion, packaging, composite and other downstream models"
  allowed_use: "Product systems whose required fibre species, product state, grade, moisture basis, treatment, geography, technology and reference period match the dataset"
  excluded_use: "Raw or retted fibre production alone; flax, true hemp or ramie; spun yarn; downstream fabric production; datasets that cannot distinguish saleable tow or fibre waste from waste sent to treatment"
  required_metadata: "PCR id and version; reference flow UUID; fibre species; product state; grade; moisture basis; batching treatment; process route; product and waste destinations; allocation method; packaging presentation; facility geography; reference period; upstream dataset references"
  required_quality_disclosure: "Process coverage; atomic-flow completeness; meter and laboratory coverage; mass-balance difference; allocation factors; internal recirculation; missing data; proxy methods; data-quality assessment; all unresolved flow identities or absent ranges"
  update_trigger: "Change in fibre species or product-state mix, preparation technology, batching formulation, dust or effluent control, packaging system, allocation basis, upstream fibre source, geography, or reference period sufficient to change representativeness"
data_sources:
  - id: "unsd-cpc-ver-3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, *Central Product Classification Version 3.0 Explanatory Notes* (2025), https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-20)"
    used_for: "CPC 26170 scope, exclusions, raw/retted upstream distinction and unspun product identity"
  - id: "fao-ijo-improved-retting-jute"
    type: "official_guidance"
    reference: "FAO and International Jute Organisation, *Improved Retting and Extraction of Jute*, GCP/RAS/122/IJO, https://www.fao.org/fishery/docs/CDrom/aquaculture/a0845t/volume2/docrep/field/381307.htm (retrieved 2026-08-20)"
    used_for: "Upstream retting, extraction, washing and drying process boundary; route disclosure"
  - id: "bis-jute-certification-manual"
    type: "official_guidance"
    reference: "Bureau of Indian Standards, *Product Certification Manual for Jute Bags for Packing 50 kg Sugar according to IS 15138:2010*, https://bis.gov.in/qazwsx/oth/DDGE22IS15138a.pdf (retrieved 2026-08-20)"
    used_for: "Selection, softening and emulsion preparation, carding, drawing, dust control, electricity, water and process-record structure before spinning"
  - id: "ec-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission, Recommendation (EU) 2021/2279, Annex I Product Environmental Footprint Method, http://data.europa.eu/eli/reco/2021/2279/oj (retrieved 2026-08-20)"
    used_for: "Functional unit, reference flow, foreground data collection, completeness, data quality, allocation hierarchy and validation"
  - id: "hasan-jute-retting-2020"
    type: "literature"
    reference: "Hasan et al., *Pectinolytic Bacterial Consortia Reduce Jute Retting Period and Improve Fibre Quality*, Scientific Reports 10, 5175 (2020), https://doi.org/10.1038/s41598-020-61898-z"
    used_for: "Original full-text confirmation of retting, extraction, washing and sun-drying sequence and route variability; no quantitative range adopted"
  - id: "datta-jute-retting-2024"
    type: "literature"
    reference: "Datta et al., *The sequential microbial breakdown of pectin is the principal incident during water retting of jute (Corchorus spp.) bast fibres*, BMC Plant Biology 24, 295 (2024), https://doi.org/10.1186/s12870-024-04970-4"
    used_for: "Original full-text confirmation of retting endpoint significance and separation of fibres from non-fibrous tissues; no quantitative range adopted"
  - id: "chakrabortty-jute-retting-2023"
    type: "literature"
    reference: "Chakrabortty and Begum, *An approach to improve the existing ribbon retting of jute fibre using concrete tank and natural catalyst*, Heliyon 9, e19488 (2023), https://doi.org/10.1016/j.heliyon.2023.e19488"
    used_for: "Original full-text confirmation that retting routes affect water demand and BOD/COD; retained only as upstream evidence, with no case value converted into a range"
