system_boundary:
  rules:
    - rule_id: boundary_gate
      applies_to: "foreground preparation system"
      rule: "Begin with an accepted lot of raw or retted eligible bast fibre at the preparation-facility gate and end with the weighed processed-but-unspun product at the same facility's dispatch gate. Include all selection, batching, softening, conditioning, carding, drawing, dust control, effluent handling and presentation operations actually used."
      source_ids:
        - unsd-cpc-ver-3-2025
        - bis-jute-certification-manual
        - ec-pef-2021-2279
    - rule_id: upstream_retting_separation
      applies_to: "cultivation, retting and primary extraction"
      rule: "Treat cultivation, harvested-stem production, retting, fibre extraction, washing and initial drying as upstream production of the raw or retted fibre input. If these operations are integrated at the reporting site, measure them as separate unit processes and connect their output to this preparation system rather than merging untraceable quantities."
      source_ids:
        - unsd-cpc-ver-3-2025
        - fao-ijo-improved-retting-jute
        - hasan-jute-retting-2020
        - datta-jute-retting-2024
    - rule_id: same_category_recirculation
      applies_to: "internally recycled or externally purchased processed fibre"
      rule: "Do not count internally recirculated fibre twice. Record externally purchased CPC 26170 fibre as an input with its upstream dataset and disclose the recursive product-category link."
      source_ids:
        - ec-pef-2021-2279
    - rule_id: downstream_exclusion
      applies_to: "spinning and later textile operations"
      rule: "Exclude spinning, twisting, winding, weaving, nonwoven conversion, dyeing, finishing, use and end of life from the foreground product gate; disclose any study-specific downstream extension separately."
      source_ids:
        - unsd-cpc-ver-3-2025
        - bis-jute-certification-manual
