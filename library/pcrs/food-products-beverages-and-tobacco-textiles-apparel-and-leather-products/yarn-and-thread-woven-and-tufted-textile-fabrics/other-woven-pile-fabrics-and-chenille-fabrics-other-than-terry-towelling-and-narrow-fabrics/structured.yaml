system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins with yarns and process materials received at the fabric plant and ends with conforming CPC 26830 fabric after the declared final finishing and inspection step. Upstream production of purchased yarn, electricity, heat, water, and chemicals is linked through background datasets. Wet processing is included only when controlled by the reporting plant or performed by a fixed supplier included in the declared foreground route."
      source_ids: []
    - rule_id: boundary_foreground_control
      applies_to: "directly controlled and fixed-supplier operations"
      rule: "Include yarn preparation, weaving and pile/chenille formation, optional wet processing, final finishing, inspection, internally controlled utilities, and on-site waste or wastewater handling when they occur in the declared route."
      source_ids:
        - jrc-ilcd-2010
        - eu-textiles-bat-2022
    - rule_id: boundary_background_links
      applies_to: "purchased inputs and external services"
      rule: "Keep every purchased yarn, material, energy, water, chemical, waste treatment, and subcontracted process as an explicit technosphere link; do not replace these links with unreported cut-offs."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: boundary_route_condition
      applies_to: "optional processing"
      rule: "Mark pretreatment, dyeing, printing, chemical finishing, mechanical finishing, and on-site wastewater treatment as included or not applicable from production evidence; absence cannot be assumed."
      source_ids:
        - eu-textiles-bref-2023
        - eu-textiles-bat-2022
    - rule_id: boundary_no_implicit_cutoff
      applies_to: "foreground exchanges"
      rule: "Record all actual yarns, chemicals, utilities, wastes, wastewater streams, and direct emissions as atomic exchanges. A cut-off requires a documented goal-and-scope criterion and completeness check."
      source_ids:
        - jrc-ilcd-2010
        - roos-textile-chemicals-2018
