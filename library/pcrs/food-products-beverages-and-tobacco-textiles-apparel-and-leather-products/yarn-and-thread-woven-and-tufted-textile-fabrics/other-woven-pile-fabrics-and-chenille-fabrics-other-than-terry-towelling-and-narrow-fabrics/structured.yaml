allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "separable products, lots, routes, and waste-treatment operations"
    rule: "Subdivide or meter separately before allocating shared inputs and outputs."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-2010
  - rule_id: allocation_internal_recycling
    applies_to: "yarn, fabric, water, heat, or chemicals internally reused in the reporting period"
    rule: "Record the internal transfer once and reconcile it in the facility mass or energy balance; do not count both avoided virgin input and exported co-product credit."
    source_ids:
      - jrc-ilcd-2010
      - eu-textiles-bat-2022
  - rule_id: allocation_shared_utilities
    applies_to: "utilities that cannot be submetered after reasonable effort"
    rule: "Allocate from a documented causal driver such as machine hours, metered operating time, bath volume, or measured heat demand; use mass only when no better physical relation exists."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-2010
  - rule_id: allocation_saleable_coproduct
    applies_to: "saleable yarn, fabric, or recovered material co-products"
    rule: "Apply the ISO 14044 hierarchy, document the selected physical relationship or other justified method, and disclose sensitivity when the choice can materially change results."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_waste_destination
    applies_to: "wastes and wastewater leaving the foreground"
    rule: "Keep each destination explicit and link the corresponding treatment service; no avoided-burden credit is assigned without a declared downstream modelling convention."
    source_ids:
      - jrc-ilcd-2010
      - eu-textiles-bat-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_input_mass
      process_id: "weaving_and_pile_formation_wet_processing_final_finishing_and_inspection"
      flow_role: "each atomic yarn, fabric, or chemical input"
      record_type: "receiving, stock-issue, return, and batch record"
      raw_fields: "material id; supplier; composition; concentration where relevant; lot id; issued mass; returned mass; date; process"
      collection_method: "calibrated scale, tank meter, or reconciled invoice and stock issue"
      unit: "kg as supplied"
      frequency: "per lot or issue"
      temporal_coverage: "complete reporting period"
      site_scope: "every included production site and fixed-supplier operation"
      aggregation_rule: "sum net issued mass by exact flow identity and normalize to conforming process output"
      quality_evidence: "calibration certificate, invoice, stock ledger, formulation, and batch ticket"
    - protocol_id: cp_electricity_record
      process_id: "weaving_and_pile_formation_wet_processing_final_finishing_and_inspection"
      flow_role: "purchased electricity"
      record_type: "submeter and operating log"
      raw_fields: "meter id; start and end reading; timestamp; process; downtime; allocation driver if shared"
      collection_method: "calibrated submeter; shared meter only with documented causal allocation"
      unit: "kWh"
      frequency: "continuous or per shift"
      temporal_coverage: "complete reporting period"
      site_scope: "each included process area"
      aggregation_rule: "subtract verified non-process use, aggregate by process, and normalize to conforming output"
      quality_evidence: "meter calibration, energy invoice reconciliation, and operating log"
    - protocol_id: cp_fabric_output_mass
      process_id: "weaving_and_pile_formation_wet_processing"
      flow_role: "conforming intermediate fabric"
      record_type: "production lot and quality release record"
      raw_fields: "lot id; gross mass; tare; net mass; conditioning basis; width; mass per unit area; rejected mass"
      collection_method: "calibrated scale plus documented ISO 3801-compatible mass/area or mass/length measurement where conversion is used"
      unit: "kg"
      frequency: "per lot"
      temporal_coverage: "complete reporting period"
      site_scope: "each included process"
      aggregation_rule: "sum net conforming output at one declared conditioning basis"
      quality_evidence: "scale calibration, specimen record, and quality release"
    - protocol_id: cp_waste_mass_and_destination
      process_id: "weaving_and_pile_formation_final_finishing_and_inspection"
      flow_role: "each atomic solid waste stream"
      record_type: "waste transfer and internal recovery record"
      raw_fields: "waste id; composition; mass; container tare; date; destination; recovery status"
      collection_method: "calibrated scale or verified waste contractor record"
      unit: "kg"
      frequency: "per transfer"
      temporal_coverage: "complete reporting period"
      site_scope: "each included process"
      aggregation_rule: "sum by exact waste identity and destination; reconcile internal recovery separately"
      quality_evidence: "weigh ticket, contractor receipt, and stock reconciliation"
    - protocol_id: cp_process_water_record
      process_id: "wet_processing"
      flow_role: "Process Water"
      record_type: "water meter and batch record"
      raw_fields: "meter id; intake; reused return; batch id; process step; timestamp"
      collection_method: "calibrated flow meter or calibrated tank-volume change"
      unit: "kg or m3 with recorded density"
      frequency: "continuous or per batch"
      temporal_coverage: "complete reporting period"
      site_scope: "wet-processing area"
      aggregation_rule: "calculate net supplied water by process and normalize to conforming wet-processed output"
      quality_evidence: "meter calibration, water balance, and batch log"
    - protocol_id: cp_chemical_issue_record
      process_id: "wet_processing"
      flow_role: "each atomic process chemical"
      record_type: "formulation, stock issue, invoice, and dosing record"
      raw_fields: "chemical identity; CAS or colour index where available; supplier; concentration; as-supplied mass; batch id; process step"
      collection_method: "calibrated dosing meter or scale reconciled to stock movement"
      unit: "kg as supplied"
      frequency: "per batch"
      temporal_coverage: "complete reporting period"
      site_scope: "wet-processing area"
      aggregation_rule: "sum by exact chemical and concentration; retain active-substance calculation separately"
      quality_evidence: "safety data sheet, formulation, calibration, invoice, and stock reconciliation"
    - protocol_id: cp_steam_heat_record
      process_id: "wet_processing"
      flow_role: "Process heat from steam"
      record_type: "steam or heat meter and delivery-state record"
      raw_fields: "meter id; steam mass or heat; pressure; temperature; condensate return; timestamp; process"
      collection_method: "calibrated heat meter or steam meter with documented enthalpy calculation"
      unit: "MJ; source records may retain kg steam"
      frequency: "continuous or per batch"
      temporal_coverage: "complete reporting period"
      site_scope: "wet-processing area"
      aggregation_rule: "aggregate net delivered heat by process and normalize to conforming output"
      quality_evidence: "calibration, boiler or supplier record, and enthalpy basis"
    - protocol_id: cp_wastewater_record
      process_id: "wet_processing"
      flow_role: "textile wet-processing wastewater transferred to treatment"
      record_type: "effluent flow and transfer record"
      raw_fields: "stream id; flow; density if mass conversion is used; pH; temperature; destination; sampling period"
      collection_method: "calibrated flow meter and destination-specific transfer record"
      unit: "kg or m3 with recorded density"
      frequency: "continuous; batch release where applicable"
      temporal_coverage: "complete reporting period"
      site_scope: "each segregated wet-process stream and discharge point"
      aggregation_rule: "aggregate by stream and destination; do not merge direct discharge with transfer to treatment"
      quality_evidence: "meter calibration, flow balance, sample chain of custody, and treatment receipt"
    - protocol_id: cp_reference_product_mass
      process_id: "final_finishing_and_inspection"
      flow_role: "saleable reference product"
      record_type: "final inspection and dispatch record"
      raw_fields: "product id; lot id; fibre composition; construction; width; mass per unit area; gross mass; tare; net mass; conditioning basis; grade; finish state"
      collection_method: "calibrated scale and final quality release"
      unit: "kg"
      frequency: "per lot"
      temporal_coverage: "complete reporting period"
      site_scope: "every included site"
      aggregation_rule: "sum conforming net product mass at the declared conditioning basis"
      quality_evidence: "scale calibration, ISO 3801-compatible test record, and release certificate"
  calculation_rules:
    - id: normalize_exchange_to_reference
      applies_to: "every foreground exchange"
      rule: "exchange amount divided by conforming reference-product mass for the same represented route and period"
      inputs:
        - "atomic exchange record"
        - cp_reference_product_mass
      output: "exchange unit per 1 kg reference product"
      source_ids:
        - iso-14044-2006
        - jrc-ilcd-2010
    - id: reconcile_fabric_mass
      applies_to: "each fabric-forming or finishing process"
      rule: "input fabric and yarn mass equals conforming fabric output plus separately identified waste, retained stock change, samples, and measured loss within documented uncertainty"
      inputs:
        - cp_material_input_mass
        - cp_fabric_output_mass
        - cp_waste_mass_and_destination
      output: "process mass-balance residual and completeness flag"
      source_ids:
        - eu-textiles-bat-2022
    - id: convert_area_or_length_to_mass
      applies_to: "fabric reported by m2 or linear m"
      rule: "measured area multiplied by lot-specific mass per unit area, or measured length multiplied by lot-specific mass per unit length"
      inputs:
        - "specimen record"
        - "width where needed"
        - "lot quantity"
      output: "kg fabric at declared conditioning basis"
      source_ids:
        - iso-3801-1977
    - id: calculate_net_process_water
      applies_to: "wet processing"
      rule: "supplied water minus measured water internally returned to the same process; report other reuse transfers separately"
      inputs:
        - cp_process_water_record
      output: "kg or m3 net process water per 1 kg wet-processed output"
      source_ids:
        - eu-textiles-bat-2022
    - id: calculate_steam_heat
      applies_to: "steam records"
      rule: "use direct heat measurement; otherwise calculate from measured steam mass and documented delivery/condensate enthalpy states"
      inputs:
        - cp_steam_heat_record
      output: "MJ delivered process heat per 1 kg wet-processed output"
      source_ids:
        - eu-textiles-bat-2022
    - id: calculate_active_chemical
      applies_to: "formulated chemicals"
      rule: "as-supplied mass multiplied by recorded active mass fraction; retain both values and do not overwrite the as-supplied inventory exchange"
      inputs:
        - cp_chemical_issue_record
      output: "kg active substance as a companion calculation"
      source_ids:
        - roos-textile-chemicals-2018
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every material and waste flow"
      requirement: "Use one chemically or physically specific identity per exchange; retain supplier grade, fibre composition, concentration, colour index or CAS where applicable, and destination for waste."
      evidence: "supplier specification, safety data sheet, formulation, receiving record, and waste transfer record"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Cover a representative continuous reporting period and all included routes; disclose shutdowns, trials, rework, and seasonal or campaign effects."
      evidence: "meter coverage report, production calendar, and exception log"
    - id: dq_completeness
      applies_to: "each process"
      requirement: "Reconcile material, energy, water, wastewater, and waste records at process level; quantify and explain missing records rather than assigning zero."
      evidence: "process balance, meter/invoice reconciliation, and unresolved-data register"
    - id: dq_measurement
      applies_to: "measured quantities"
      requirement: "Identify meter or scale, calibration status, reading frequency, unit, conversion factor, and allocation driver."
      evidence: "calibration certificate, raw readings, and calculation workbook"
    - id: dq_route
      applies_to: "product dataset"
      requirement: "Match fibre composition, pile construction, finish state, wet-processing route, geography, technology, and packaging boundary to the represented product."
      evidence: "bill of materials, route card, product specification, and dataset metadata"
    - id: dq_chemical_inventory
      applies_to: "wet processing"
      requirement: "Record every dye substance, carrier, salt, alkali, acid, bleaching agent, reducing agent, surfactant, softener, coating, flame retardant, water repellent, and cleaning chemical actually used as its own exchange; do not use aggregate “dyes” or “auxiliaries” rows."
      evidence: "formulation, dosing record, safety data sheet, and stock reconciliation"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The selected reference flow UUID, Product flow type, CPC 26830 classification, Mass property, Units of mass unit group, and kg reference unit shall all be present and mutually consistent."
    source_ids:
      - un-cpc-v3-26830
      - jrc-ilcd-2010
  - rule_id: validate_scope_exclusions
    applies_to: "product identity"
    rule: "Reject records for terry towelling, narrow fabrics, cotton subclass 26810, man-made-fibre subclass 26820, carpets, tufted fabrics, knitted pile fabrics, apparel, or made-up articles."
    source_ids:
      - un-cpc-v3-26830
  - rule_id: validate_required_qualifiers
    applies_to: "dataset metadata"
    rule: "Fibre composition, pile/chenille construction, width, mass per unit area, finish state, conditioning basis, grade, geography, gate, wet-processing route, and packaging inclusion shall be declared."
    source_ids:
      - iso-3801-1977
      - jrc-ilcd-2010
  - rule_id: validate_atomic_inventory
    applies_to: "all inventory exchanges"
    rule: "Every actual input, output, waste, wastewater stream, and direct emission shall be represented as one atomic exchange with exact identity and destination; aggregate labels and selector instructions fail validation."
    source_ids:
      - eu-textiles-bat-2022
      - roos-textile-chemicals-2018
  - rule_id: validate_route_coverage
    applies_to: "process map"
    rule: "Weaving and final inspection are required; wet processing is included only when evidenced, and every included or omitted conditional process shall have a route record."
    source_ids:
      - eu-textiles-bref-2023
      - eu-textiles-bat-2022
  - rule_id: validate_foreground_evidence
    applies_to: "quantitative inventory"
    rule: "Every amount shall come from a foreground record or a documented calculation from foreground records. Blank, estimated, default, or AI-generated quantity ranges do not conform."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022
  - rule_id: validate_mass_balance
    applies_to: "yarn, fabric, chemical, water, wastewater, and waste records"
    rule: "Process-level balances shall reconcile inputs, conforming outputs, waste, stock change, reuse, and documented losses within the facility's stated measurement uncertainty."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_allocation
    applies_to: "shared operations and co-products"
    rule: "Apply subdivision first, disclose the allocation driver and denominator, and retain a sensitivity check when allocation choice can materially affect results."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-2010
  - rule_id: validate_uuid_gate
    applies_to: "UUID-bearing rows"
    rule: "A UUID may be retained only after flow-hybrid-search discovery and Tiangong state-100 direct readback confirm exact flow identity, flow type, required qualifiers, and compatible property/unit; unresolved or rejected candidates remain blank."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "factory-gate CPC 26830 fabric datasets matching the declared composition, construction, finish state, route, geography, technology, quality grade, and conditioning basis"
  excluded_use: "cotton or man-made-fibre woven-pile subclasses; terry or narrow fabrics; carpets; tufted or knitted pile fabrics; apparel; use-phase or end-of-life claims; routes with unresolved reference identity"
  required_metadata: "canonical PCR id; reference-flow UUID; CPC code; fibre composition; construction; width; mass per unit area; conditioning basis; finish state; route; geography; technology; reporting period; allocation; packaging boundary"
  required_quality_disclosure: "foreground coverage; meter and scale calibration; process balances; chemical and waste completeness; supplier/background links; unresolved UUIDs; excluded operations; uncertainty and allocation choices"
  update_trigger: "material change to product scope, yarn composition, pile-forming technology, wet or dry finishing route, chemical formulation, energy or water system, waste destination, supplier mix, geography, allocation, or data age"
