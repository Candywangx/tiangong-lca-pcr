allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "separately metered operations and products"
    rule: "Avoid allocation by subdividing fibre preparation, spinning, winding, conditioning, and packing wherever their inputs and outputs are independently recorded."
    source_ids:
      - iso-14044-2006
      - bianco-et-al-2023-wool-lca
  - rule_id: allocation_internal_recycling
    applies_to: "wool waste returned to the same batch or process"
    rule: "Treat internally returned wool fibre as an internal loop, report the gross waste and returned amount, and do not create an avoided-product credit inside the same foreground process."
    source_ids:
      - bianco-et-al-2023-wool-lca
  - rule_id: allocation_exported_co_products
    applies_to: "noils, recoverable fibre, or other valuable outputs leaving the system"
    rule: "Report each exported co-product separately; if subdivision or system expansion is not feasible, document and justify the chosen physical or economic allocation and provide a sensitivity result when it materially changes the yarn burden."
    source_ids:
      - iso-14044-2006
      - bianco-et-al-2023-wool-lca
  - rule_id: allocation_waste_treatment
    applies_to: "waste sent to treatment"
    rule: "Assign collection and treatment burdens consistently with the declared waste-treatment dataset and disclose any cut-off, recycling, or substitution convention."
    source_ids:
      - iso-14044-2006
