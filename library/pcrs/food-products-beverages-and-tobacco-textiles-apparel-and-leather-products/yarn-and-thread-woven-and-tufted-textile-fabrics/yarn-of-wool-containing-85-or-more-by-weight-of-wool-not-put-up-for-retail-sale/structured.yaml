  calculation_rules:
    - id: calc_process_normalization
      applies_to: "every process inventory row"
      rule: "Divide the batch or period exchange by the matched accepted output mass for that process; do not mix moisture states across numerator and denominator."
      inputs:
        - "collected exchange"
        - "matched process output"
        - "declared moisture state"
      output: "exchange per kg process output"
      source_ids:
        - iso-14044-2006
    - id: calc_net_packing_mass
      applies_to: "final reference yarn"
      rule: "Net accepted yarn mass equals measured gross packed mass minus the separately measured mass of every packing component."
      inputs:
        - "gross packed mass"
        - "paper-core mass"
        - "box mass"
        - "other individually recorded packing masses"
      output: "net accepted yarn mass"
      source_ids:
        - iso-2060-1994
    - id: calc_pm10_mass
      applies_to: "channelled PM10 rows"
      rule: "Calculate emitted mass from measured concentration, measured dry-gas flow, and operating time using compatible units; preserve sampling and averaging metadata."
      inputs:
        - "PM10 concentration"
        - airflow
        - "operating time"
      output: "PM10 emitted mass"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_route_weighting
      applies_to: "aggregated multi-route dataset"
      rule: "Weight route-specific normalized inventories by accepted production mass and disclose every route share; retain route-specific results."
      inputs:
        - "route inventories"
        - "accepted mass by route"
      output: "production-weighted aggregate inventory"
      source_ids:
        - bianco-et-al-2023-wool-lca
