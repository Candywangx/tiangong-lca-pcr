validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The final output UUID shall be 10c7de33-bef0-4310-98e7-734d8e2e4c9f, the flow type shall be Product flow, the CPC leaf shall be 26320, and the flow property shall be Mass."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: validate_wool_fraction
    applies_to: "final yarn"
    rule: "Reject a package when the declared or tested wool mass fraction is below 85%."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: validate_reference_amount
    applies_to: "final yarn"
    rule: "Confirm that the reference amount is 1 kg net accepted yarn at the declared conditioning state and excludes industrial packing mass."
    source_ids:
      - iso-2060-1994
  - rule_id: validate_required_qualifiers
    applies_to: "final yarn"
    rule: "Reject an incomplete package when any required qualifier in the reference-flow definition is absent."
    source_ids:
      - iso-1144-2016
      - iso-2060-1994
  - rule_id: validate_required_processes
    applies_to: "process map"
    rule: "Require fibre_preparation, spinning_and_winding, and conditioning_and_packing records, with explicit zero or not-applicable evidence only when a named operation or exchange is demonstrably absent."
    source_ids:
      - bianco-et-al-2023-wool-lca
  - rule_id: validate_atomic_inventory
    applies_to: "every inventory row"
    rule: "Each exchange shall identify one product, waste, or elementary flow; combined carriers, combined packing materials, selector instructions, and plural catch-all flows are invalid."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_flow_identity
    applies_to: "UUID-bearing inventory rows"
    rule: "Confirm state code 100, the declared Product, Waste, or Elementary flow type, semantic name, reference property, and receiving compartment where applicable before use."
    source_ids: []
  - rule_id: validate_unresolved_rows
    applies_to: "rows without UUID"
    rule: "Require the exact row_id and selected single-flow name to match manifest unresolved_identity and prohibit publication until the identity gap is resolved or formally reviewed."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "each foreground process"
    rule: "Reconcile product and material inputs, product outputs, waste, internal return, stock change, and measured losses; report and justify residual imbalance."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_allocation
    applies_to: "multi-output process"
    rule: "Confirm subdivision priority and disclose any physical or economic allocation basis, data, and sensitivity result."
    source_ids:
      - iso-14044-2006
      - bianco-et-al-2023-wool-lca
published_dataset_profile:
  dataset_role: "foreground production dataset for non-retail wool yarn manufacture"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "weaving, knitting, textile conversion, product LCA, supply-chain screening, and route-specific benchmarking that match the declared yarn and geography"
  excluded_use: "yarn below 85% wool; retail yarn; other-animal-hair yarn; fabric or garment production; undisclosed route averages; wet processing not represented in the inventory"
  required_metadata: "canonical PCR id, CPC 26320 reference, product UUID, wool fraction, woollen or worsted route, fibre origin, secondary fibres, dye state, tex, twist, ply, winding form, conditioning state, net mass, site, geography, period, upstream datasets, waste fate, allocation, and unresolved data gaps"
  required_quality_disclosure: "measurement coverage, calibration, mass balance, route shares, supplier-data quality, temporal and geographic representativeness, allocation sensitivity, exclusions, and uncertainty"
  update_trigger: "change in fibre composition, prepared-wool starting condition, route, equipment, energy supply, lubricant, conditioning, packing, waste fate, allocation, site, geography, or production period that materially changes the normalized inventory"
