allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "shared production lines and utilities"
    rule: "First avoid allocation by submetering, batch records, equipment runtime, or physical subdivision of independently measurable operations."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-provisions-2010
  - rule_id: allocation_closed_loop_rework
    applies_to: "in-process rework returned to the same production lot"
    rule: "Treat internally returned rework as an internal loop; record any extra energy or material use but do not create both a waste output and a new external input for the same mass."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_recovered_material
    applies_to: "off-site sale or recovery of yarn, backing, coating, or finished-fabric residuals"
    rule: "Report the residual mass and destination separately. Apply substitution or another consequential credit only when required by the study method and disclose it outside the attributional foreground inventory."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-provisions-2010
  - rule_id: allocation_remaining_shared_burdens
    applies_to: "burdens not separable by direct records"
    rule: "Use a documented physical relationship reflecting causal use; if no defensible physical relationship exists, use an economic relationship and disclose prices, period, currency, and sensitivity."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_tufting_records
      process_id: "tuft_insertion"
      flow_role: "Each atomic material, utility, intermediate, waste, and relevant air-emission exchange"
      record_type: "lot issue/return records; meters; production log; waste ticket; emission record"
      raw_fields: "lot id; flow identity; quantity; unit; timestamp; machine; product output; destination; measurement basis"
      collection_method: "calibrated scales and meters, ERP issue/return records, and compliance monitoring"
      unit: "native recorded unit"
      frequency: "per lot or continuous meter with lot allocation"
      temporal_coverage: "representative reporting period covering normal operation"
      site_scope: "all tufting equipment producing the declared product"
      aggregation_rule: "sum each atomic exchange and divide by net conforming final product mass; exclude internal transfers from site-boundary totals"
      quality_evidence: "calibration certificates; meter extracts; ERP records; waste tickets; route log"
    - protocol_id: cp_mechanical_finishing_records
      process_id: "mechanical_finishing"
      flow_role: "Each atomic intermediate, electricity, waste, and relevant air-emission exchange"
      record_type: "roll record; submeter; production log; waste ticket; emission record"
      raw_fields: "lot id; active operation; flow identity; quantity; unit; runtime; output mass; destination"
      collection_method: "calibrated scales, line submeters, and production records"
      unit: "native recorded unit"
      frequency: "per lot or production campaign"
      temporal_coverage: "representative reporting period covering the active route"
      site_scope: "all mechanical-finishing equipment used by the declared product"
      aggregation_rule: "aggregate only active operations and normalize each exchange to net conforming final product mass"
      quality_evidence: "calibration certificates; meter extracts; route log; waste tickets"
    - protocol_id: cp_wet_processing_records
      process_id: "wet_processing"
      flow_role: "Each atomic material, chemical, water, energy, wastewater, sludge, and relevant emission exchange"
      record_type: "batch recipe; dosing record; meter; laboratory result; waste ticket"
      raw_fields: "lot id; recipe chemical identity; supplied concentration; mass; water; electricity; steam; wastewater; pH; temperature; pollutant result; output mass"
      collection_method: "calibrated dosing, utility and effluent meters supported by recipe and laboratory records"
      unit: "native recorded unit"
      frequency: "per batch and continuous monitoring where applicable"
      temporal_coverage: "representative reporting period covering normal and abnormal batches"
      site_scope: "all on-site wet-process and directly associated treatment units"
      aggregation_rule: "keep each chemical and utility separate; aggregate by route and normalize to net conforming final product mass"
      quality_evidence: "calibration; recipe approval; SDS/TDS; meter extracts; laboratory QA/QC; treatment records"
    - protocol_id: cp_backing_records
      process_id: "back_coating_lamination"
      flow_role: "Each atomic fabric, binder, backing, energy, waste, and relevant emission exchange"
      record_type: "formulation batch; roll issue; meter; production log; waste ticket"
      raw_fields: "lot id; binder grade; wet mass; solids; backing identity; energy; oven settings; output mass; waste destination"
      collection_method: "calibrated scales, formulation tanks, line meters, and production records"
      unit: "native recorded unit"
      frequency: "per formulation batch or production lot"
      temporal_coverage: "representative reporting period covering the active backing route"
      site_scope: "all coating, curing, and lamination equipment used by the declared product"
      aggregation_rule: "reconcile wet formulation, solids, backing mass, output, waste, and measured emissions per net final product mass"
      quality_evidence: "calibration; formulation approval; SDS/TDS; meter extracts; production and waste records"
    - protocol_id: cp_packaging_records
      process_id: "inspection_packaging"
      flow_role: "Each atomic product, packaging, electricity, and waste exchange"
      record_type: "finished-goods ticket; packaging issue; meter; waste ticket"
      raw_fields: "product lot; net fabric mass; gross shipment mass; core mass; film mass; electricity; waste mass; quality disposition"
      collection_method: "calibrated final scale, ERP packaging issue, line meter, and inspection record"
      unit: "native recorded unit"
      frequency: "per finished lot"
      temporal_coverage: "representative reporting period"
      site_scope: "all final inspection and shipment-preparation equipment"
      aggregation_rule: "separate net product from packaging; aggregate each component and normalize to 1 kg net conforming fabric"
      quality_evidence: "scale calibration; finished-goods ticket; packaging specification; inspection and waste records"
  calculation_rules:
    - id: normalize_atomic_exchange
      applies_to: "every inventory row"
      rule: "Sum the row-specific foreground quantity for included lots and divide by net conforming final fabric mass for the same lots."
      inputs:
        - "applicable collection protocol quantity"
        - "net conforming product mass"
      output: "atomic exchange per 1 kg reference product"
      source_ids:
        - eu-textiles-bat-2022
    - id: convert_area_or_length_to_mass
      applies_to: "fabric records held in area or length"
      rule: "Fabric mass = measured area x lot-specific mass per area; measured area = recorded length x usable width. Do not use catalogue values when lot measurements exist."
      inputs:
        - length
        - "usable width"
        - "measured mass per area"
      output: "kg fabric"
      source_ids:
        - iso-14044-2006
    - id: calculate_formulation_solids
      applies_to: "binder and chemical formulations"
      rule: "Dry solids = wet formulation mass x measured or supplier-certified solids mass fraction; preserve wet formulation mass as the purchased input."
      inputs:
        - "wet mass"
        - "solids mass fraction"
      output: "kg dry solids as a disclosed supporting value"
      source_ids:
        - eu-textiles-bat-2022
    - id: mass_reconciliation
      applies_to: "each material transformation step"
      rule: "Compare mass inputs with product, waste, measured emissions, and inventory change over the same lot boundary; investigate rather than auto-correct an unexplained imbalance."
      inputs:
        - "material inputs"
        - outputs
        - wastes
        - "measured emissions"
        - "stock change"
      output: "documented mass-balance check"
      source_ids:
        - eu-textiles-bat-2022
        - jrc-ilcd-provisions-2010
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and intermediates"
      requirement: "Maintain lot linkage to fibre composition, backing construction, pile form, mass per area, width, finish recipe, backing system, and quality disposition."
      evidence: "approved product specification; batch traveller; inspection record"
    - id: dq_direct_measurement
      applies_to: "materials, water, energy, wastewater, and waste"
      requirement: "Prefer direct measurement; calculations from invoices or shared meters require the raw record, allocation basis, and uncertainty disclosure."
      evidence: "calibrated meter or scale record; invoice; allocation worksheet"
    - id: dq_temporal_coverage
      applies_to: "all foreground exchanges"
      requirement: "Cover a representative reporting period and disclose shutdowns, start-ups, rework, abnormal batches, and material changes in route or recipe."
      evidence: "dated production and utility records; exception log"
    - id: dq_chemical_identity
      applies_to: "every process chemical"
      requirement: "Preserve commercial name, supplier, formulation or substance identity, concentration or solids, quantity, function, and SDS/TDS link; do not merge distinct chemicals."
      evidence: "recipe; dosing record; SDS/TDS; purchase record"
    - id: dq_effluent_and_emissions
      applies_to: "wastewater, sludge, waste gas, and direct emissions"
      requirement: "Match monitoring location, period, flow, and concentration or mass result to the active route and treatment boundary; identify values below detection limits without substituting zero."
      evidence: "laboratory QA/QC; flow meter; permit or compliance report"
    - id: dq_completeness
      applies_to: "process-level inventory"
      requirement: "Reconcile input/output inventories and explain all exclusions, data gaps, proxies, and unresolved UUIDs."
      evidence: "mass balance; process flow sheet; gap register; reviewer record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require the verified Product flow UUID, Mass property UUID, Units of mass UUID, kg unit, CPC 26880 scope, and all required qualifiers."
    source_ids:
      - un-cpc-3-explanatory-notes-2025
      - jrc-ilcd-provisions-2010
  - rule_id: validate_route_completeness
    applies_to: "process map and foreground boundary"
    rule: "Require tuft insertion and inspection/packaging; require every conditional process whose operation, recipe, meter, or product specification indicates that it occurred."
    source_ids:
      - jrc-textiles-bref-2023
      - eu-textiles-bat-2022
  - rule_id: validate_atomic_exchanges
    applies_to: "process inventory"
    rule: "Reject a combined material, utility, chemical, packaging, waste, or emission row; every selected flow must be one concrete exchange with its own amount record and description."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_foreground_evidence
    applies_to: "inventory amounts"
    rule: "Require real foreground measurements, logs, invoices, tests, or calculations from those records; reject AI-generated values, unsupported defaults, and literature values presented as site records."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-provisions-2010
  - rule_id: validate_mass_and_packaging_basis
    applies_to: "reference product and material processes"
    rule: "Confirm the 1 kg reference amount is net conforming fabric, packaging is excluded from reference mass, and unexplained process mass imbalance is investigated and disclosed."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-provisions-2010
  - rule_id: validate_uuid_status
    applies_to: "UUID-bearing and unresolved rows"
    rule: "Use only state100 direct-read UUIDs whose public identity, type, property, and unit are exact; unresolved rows remain UUID-free with their row-specific reason in the manifest."
    source_ids:
      - jrc-ilcd-provisions-2010
  - rule_id: validate_source_and_data_quality
    applies_to: "dataset package"
    rule: "Require stable source references, collection coverage, meter and laboratory quality evidence, proxy disclosure, and a completeness statement before downstream use."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Foreground or background representation of factory-gate CPC 26880 tufted textile fabric when composition, pile construction, finish, backing, geography, technology, and time match the study."
  excluded_use: "Carpets, other excluded textile constructions, made-up articles, or a tufted fabric with materially different composition, wet-process route, coating system, geography, technology, or reporting period."
  required_metadata: "canonical PCR id; reference UUID; CPC 26880; geography; reporting period; factory gate; fibre composition; pile and backing construction; mass per area; usable width; finish and coating route; net-product mass basis; allocation; upstream proxies; data quality statement"
  required_quality_disclosure: "Share of amounts from direct measurement; shared-meter allocation; temporal and site coverage; mass-balance findings; abnormal operations; detection-limit handling; unresolved UUID rows; proxy datasets; review status."
  update_trigger: "Change in fibre or backing composition, pile construction, wet-process recipe, coating system, energy supply, treatment route, factory technology, geography, allocation, or representative foreground period."
data_sources:
  - id: "un-cpc-3-explanatory-notes-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Explanatory Notes, subclass 26880, 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "official product-category scope and exclusions"
  - id: "jrc-textiles-bref-2023"
    type: "official_guidance"
    reference: "Roth et al., Best Available Techniques Reference Document for the Textiles Industry, JRC131874, 2023. https://doi.org/10.2760/355887"
    used_for: "textile process decomposition, coating, fabric production, finishing, inputs, outputs, and treatment context"
  - id: "eu-textiles-bat-2022"
    type: "official_guidance"
    reference: "Commission Implementing Decision (EU) 2022/2508 establishing BAT conclusions for the textiles industry. http://data.europa.eu/eli/dec_impl/2022/2508/oj"
    used_for: "process-level material, water, energy, chemical, wastewater, waste, monitoring, and data-quality rules"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management - Life cycle assessment - Requirements and guidelines, confirmed current in 2022 with amendments. https://www.iso.org/standard/38498.html"
    used_for: "LCI boundary, allocation hierarchy, data collection, completeness, reporting, and review principles"
  - id: "jrc-ilcd-provisions-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook - General guide for Life Cycle Assessment - Provisions and Action Steps, JRC58190, 2010. https://doi.org/10.2788/94987"
    used_for: "consistent, robust, quality-assured life-cycle data and dataset documentation"
  - id: "cimilli-et-al-tufted-structure-2023"
    type: "literature"
    reference: "Cimilli Duru et al., Sound Absorption of Tufted Carpets Produced from Coarse Wool of Mountain Sheep, Journal of Natural Fibers, 2023. https://doi.org/10.1080/15440478.2023.2246103"
    used_for: "peer-reviewed evidence that primary backing holds tufted yarn during manufacture; used only for generic tufted construction, not to include carpets in scope"
  - id: "yuan-et-al-pad-dyeing-lca-2013"
