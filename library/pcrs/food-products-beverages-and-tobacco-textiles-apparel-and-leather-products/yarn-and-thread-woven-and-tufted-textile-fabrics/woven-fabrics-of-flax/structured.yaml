allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "multi-product mill processes"
    rule: "Avoid allocation by subdividing meters, batch records, machine time, and waste records to the flax-fabric production lot wherever technically feasible."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-general-guide-2010
  - rule_id: allocation_causal_shared_inputs
    applies_to: "shared utilities and treatment"
    rule: "When subdivision is not feasible, allocate shared electricity, thermal energy, water, and treatment burdens using a documented physical driver that causally represents use, such as machine operating time, metered volume, or treated hydraulic load."
    source_ids:
      - jrc-ilcd-general-guide-2010
  - rule_id: allocation_mass_fallback
    applies_to: "residual shared burdens"
    rule: "Use net conforming fabric mass as a fallback only when no more causal physical driver is available; disclose the affected flows, co-products, allocation fraction, and sensitivity to the chosen basis."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-general-guide-2010
  - rule_id: allocation_waste_and_recovery
    applies_to: "yarn waste, fabric waste, and recovered material"
    rule: "Record each physical outflow and destination before applying any recycling, substitution, or avoided-burden convention; do not assign an automatic credit within the foreground."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts_and_issues
      process_id: "yarn_and_warp_preparation_weaving"
      flow_role: "flax warp and weft yarn"
      record_type: "purchase receipt and material issue"
      raw_fields: "supplier; lot; yarn identity; composition; yarn count; gross mass; tare; net mass; moisture or conditioning basis; issue process"
      collection_method: "calibrated scale and enterprise material record"
      unit: "kg"
      frequency: "each receipt and issue"
      temporal_coverage: "complete production-lot period"
      site_scope: "all yarn stores and issuing points serving the lot"
      aggregation_rule: "sum accepted net mass by exact yarn identity and reconcile receipts, inventory change, and issues"
      quality_evidence: "scale calibration; supplier certificate; lot traceability; inventory reconciliation"
    - protocol_id: cp_chemical_batch_issues
      process_id: "yarn_and_warp_preparation_wet_processing"
      flow_role: "one exact chemical product"
      record_type: "batch recipe and dosing record"
      raw_fields: "trade name; chemical or Colour Index identity; supplier; concentration; lot; as-supplied mass; batch id; return mass"
      collection_method: "calibrated dosing system or weighed issue"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete production-lot period"
      site_scope: "all dosing points serving included processes"
      aggregation_rule: "sum net issued mass separately for each exact product; never aggregate unlike chemicals"
      quality_evidence: "recipe approval; SDS; dosing calibration; issue and return records"
    - protocol_id: cp_water_meters_and_batch_records
      process_id: "yarn_and_warp_preparation_wet_processing"
      flow_role: "one process-water input"
      record_type: "meter and batch record"
      raw_fields: "meter id; opening and closing reading; batch id; operation; source; recycled-water status"
      collection_method: "calibrated flow meter, or validated tank/batch volume when no meter exists"
      unit: "m3"
      frequency: "each batch or shift"
      temporal_coverage: "complete production-lot period"
      site_scope: "all water inlets serving included operations"
      aggregation_rule: "difference meter readings, subtract documented non-production use, and retain recycled-water transfers separately"
      quality_evidence: "meter calibration; reading log; batch reconciliation"
    - protocol_id: cp_electricity_metering
      process_id: "yarn_and_warp_preparation_weaving_wet_processing_inspection_and_packaging"
      flow_role: "grid electricity"
      record_type: "electricity meter and equipment runtime record"
      raw_fields: "meter id; opening and closing reading; machine id; rated or measured load; operating time; batch id"
      collection_method: "dedicated meter; otherwise validated machine-time allocation from a shared meter"
      unit: "kWh"
      frequency: "shift or batch"
      temporal_coverage: "representative continuous period covering the lot and normal operating variation"
      site_scope: "all electricity consumers inside the process boundary"
      aggregation_rule: "sum dedicated readings or calculate auditable share; reconcile to facility meter"
      quality_evidence: "meter calibration; runtime log; allocation worksheet; facility reconciliation"
    - protocol_id: cp_fuel_metering
      process_id: "wet_processing"
      flow_role: "natural gas"
      record_type: "fuel meter and calorific-value record"
      raw_fields: "meter id; opening and closing reading; standard volume; net calorific value; boiler id; operating time; batch id"
      collection_method: "calibrated gas meter and supplier calorific-value statement"
      unit: "MJ"
      frequency: "shift or batch"
      temporal_coverage: "complete period serving the lot"
      site_scope: "on-site combustion equipment serving included operations"
      aggregation_rule: "convert metered gas to MJ using period-specific net calorific value and allocate with a causal driver"
      quality_evidence: "meter calibration; supplier statement; boiler log; facility reconciliation"
    - protocol_id: cp_product_and_scrap_mass
      process_id: "all_processes"
      flow_role: "intermediate product, conforming fabric, or one specific textile waste"
      record_type: "production, scale, and waste transfer record"
      raw_fields: "lot; product or waste identity; gross mass; tare; net mass; conditioning basis; destination; timestamp"
      collection_method: "calibrated scale with lot-level reconciliation"
      unit: "kg"
      frequency: "each transfer or lot"
      temporal_coverage: "complete production-lot period"
      site_scope: "all included production and waste collection points"
      aggregation_rule: "sum net mass by row identity and destination; reconcile process inputs, outputs, inventory change, and measured moisture basis"
      quality_evidence: "scale calibration; lot traveller; waste receipt; mass-balance worksheet"
    - protocol_id: cp_wastewater_transfers
      process_id: "yarn_and_warp_preparation_wet_processing"
      flow_role: "spent sizing liquor or textile wastewater"
      record_type: "flow-meter, tank, and treatment transfer record"
      raw_fields: "stream identity; source operation; volume; timestamp; treatment destination; recycled fraction"
      collection_method: "calibrated discharge meter or validated tank-level change"
      unit: "m3"
      frequency: "batch or daily"
      temporal_coverage: "complete production-lot period"
      site_scope: "all wastewater transfers from included operations"
      aggregation_rule: "sum by specific stream and treatment destination without double-counting internal recirculation"
      quality_evidence: "meter calibration; treatment log; transfer ticket; water balance"
    - protocol_id: cp_direct_emission_monitoring
      process_id: "weaving_wet_processing"
      flow_role: "one elementary emission to air"
      record_type: "stack or workplace extraction monitoring record"
      raw_fields: "emission identity; compartment; sampling point; concentration; gas flow; duration; production lot; control status"
      collection_method: "applicable accredited measurement method or verified regulatory monitoring record"
      unit: "kg"
      frequency: "monitoring campaign or reporting interval"
      temporal_coverage: "interval representative of the production lot"
      site_scope: "all included direct emission points"
      aggregation_rule: "calculate released mass for the interval and allocate with documented operating time or production driver"
      quality_evidence: "laboratory accreditation; instrument calibration; sampling report; regulatory return"
    - protocol_id: cp_packaging_material_issues
      process_id: "inspection_and_packaging"
      flow_role: "one exact packaging material"
      record_type: "packaging issue and product shipment record"
      raw_fields: "material identity; supplier; lot; gross mass; tare; returned mass; fabric lot"
      collection_method: "calibrated scale and issue record"
      unit: "kg"
      frequency: "each fabric lot"
      temporal_coverage: "complete production-lot period"
      site_scope: "all packing stations serving the lot"
      aggregation_rule: "net issued mass minus documented returns, separately by packaging material"
      quality_evidence: "scale calibration; purchase record; issue and return log"
  calculation_rules:
    - id: normalize_to_reference_product
      applies_to: "every non-reference inventory row"
      rule: "row amount / net kg conforming woven flax fabric"
      inputs:
        - "collected row amount"
        - "woven_fabrics_of_flax_output net mass"
      output: "row amount per 1 kg reference product"
      source_ids:
        - eu-ecolabel-textiles-2014
    - id: area_or_length_to_mass
      applies_to: "area- or length-based fabric records"
      rule: "area × lot-specific measured mass per area, or length × usable width × lot-specific measured mass per area; convert units explicitly"
      inputs:
        - "measured area or length"
        - "usable width"
        - "measured g/m2"
      output: "kg fabric at the declared conditioning basis"
      source_ids:
        - iso-139-2005
    - id: shared_electricity_allocation
      applies_to: "shared electricity meter"
      rule: "shared-meter kWh × attributable machine operating time or measured-load share / total corresponding driver"
      inputs:
        - "shared-meter readings"
        - "machine runtime"
        - "measured or validated load"
      output: "kWh assigned to the process and lot"
      source_ids:
        - jrc-ilcd-general-guide-2010
    - id: process_mass_balance
      applies_to: "each production process"
      rule: "opening inventory + measured mass inputs = measured product outputs + measured waste outputs + closing inventory + documented mass change or residual"
      inputs:
        - "material receipts and issues"
        - "product and waste masses"
        - "inventory change"
        - "moisture or volatile change"
      output: "reconciled process mass balance and disclosed residual"
      source_ids:
        - jrc-ilcd-general-guide-2010
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "yarn, chemicals, fabric, waste, and packaging"
      requirement: "Preserve supplier, lot, exact material identity, composition or concentration, and the linkage from receipt through production and output."
      evidence: "supplier certificates; SDS; batch recipes; lot travellers; waste transfer records"
    - id: dq_measurement_control
      applies_to: "mass, water, electricity, fuel, and emissions"
      requirement: "Use calibrated instruments or document the validated estimation method, allocation driver, uncertainty, and reconciliation to a site-level control total."
      evidence: "calibration certificates; meter logs; allocation worksheets; site reconciliation"
    - id: dq_temporal_coverage
      applies_to: "foreground inventory"
      requirement: "Cover a period representative of normal production and include start-up, shutdown, cleaning, rejects, rework, and route-specific operations attributable to the declared lot."
      evidence: "production calendar; batch log; meter period; downtime and cleaning records"
    - id: dq_route_completeness
      applies_to: "wet and finishing routes"
      requirement: "Retain the complete recipe and one atomic inventory record for each exact dye, pigment, auxiliary, finish, energy carrier, wastewater transfer, waste, and direct emission that crosses the boundary."
      evidence: "approved recipe; issue records; meters; waste and emission reports"
    - id: dq_conditioning_basis
      applies_to: "fabric and yarn mass"
      requirement: "State the conditioning atmosphere or moisture basis for each material mass used in reference-flow or mass-balance calculations."
      evidence: "conditioning-room record; test report; moisture measurement; weighing procedure"
    - id: dq_geography_and_technology
      applies_to: "linked upstream datasets"
      requirement: "Match supplier geography, grid, water source, fuel supply, yarn technology, and treatment route as closely as available and disclose any proxy."
      evidence: "supplier location; utility contract; dataset metadata; proxy justification"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the exact Tiangong product-flow UUID, Mass flow-property UUID, Units-of-mass unit-group UUID, 1 kg reference amount, and every required qualifier."
    source_ids:
      - unsd-cpc-3-2025
      - eu-ecolabel-textiles-2014
  - rule_id: validation_route_completeness
    applies_to: "process map and inventory"
    rule: "The declared route must include every on-site preparation, weaving, pretreatment, dyeing, printing, finishing, inspection, packaging, wastewater, and emission-control operation, or identify a linked supplier dataset for an off-site operation."
    source_ids:
      - eu-textiles-bref-2023
      - eu-ecolabel-textiles-2014
  - rule_id: validation_atomic_flows
    applies_to: "process inventory"
    rule: "Each card must represent one exact material, energy carrier, waste stream, or elementary emission; chemical totals, combined utilities, combined packaging, and combined waste labels are not conforming records."
    source_ids:
      - eu-ecolabel-textiles-2014
  - rule_id: validation_mass_balance
    applies_to: "yarn preparation, weaving, wet processing, and inspection"
    rule: "Reconcile measured input, output, waste, inventory change, and documented moisture or volatile change for each process; disclose and investigate every unexplained residual."
    source_ids:
      - jrc-ilcd-general-guide-2010
  - rule_id: validation_no_unsubstantiated_values
    applies_to: "inventory amounts and calculations"
    rule: "Accept only collected foreground records or calculations linked to collected fields and declared formulas; do not substitute an AI-authored range or uncited default for a missing record."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-general-guide-2010
  - rule_id: validation_allocation_disclosure
    applies_to: "shared and multi-product processes"
    rule: "Verify subdivision attempts, chosen physical driver, affected flows, allocation fractions, co-product treatment, and any sensitivity result."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-general-guide-2010
  - rule_id: validation_conditioning_consistency
    applies_to: "reference product and mass conversions"
    rule: "Verify that reference-product mass, mass per area, yarn mass, and process mass balances use a consistent declared conditioning or moisture basis."
    source_ids:
      - iso-139-2005
      - eu-ecolabel-textiles-2014
published_dataset_profile:
  dataset_role: "foreground production dataset for woven flax fabric at the mill gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Downstream apparel, interior-textile, technical-product, and product-system models when the fabric composition, construction, finish state, geography, technology, conditioning basis, and boundary match the intended use"
  excluded_use: "Flax cultivation, fibre extraction, yarn production, knitted or nonwoven textiles, special or coated fabrics classified elsewhere, made-up textile production, use stage, and end-of-life without explicit system extension"
  required_metadata: "canonical PCR id; CPC 26560; reference-flow UUID; fibre composition; weave or construction; g/m2; usable width; finish state; conditioning or moisture basis; geography; technology; production period; included and off-site operations; allocation method; upstream dataset references"
  required_quality_disclosure: "primary-data share; meter and scale coverage; calibration status; route completeness; mass-balance residuals; chemical identity completeness; wastewater and emission coverage; proxies; uncertainty; unresolved UUIDs"
  update_trigger: "Change in fibre composition, weave, mass per area, width, sizing or wet-processing recipe, production technology, site, energy supply, wastewater or emission control, allocation basis, packaging, or a material change in representative data period"
