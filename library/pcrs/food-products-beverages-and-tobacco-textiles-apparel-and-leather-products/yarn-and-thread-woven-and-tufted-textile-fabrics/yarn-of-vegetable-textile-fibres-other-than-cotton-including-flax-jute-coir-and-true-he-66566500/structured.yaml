allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "independently measurable routes, lots, and yarn grades"
    rule: "Avoid allocation by subdividing plant records by route, material, production lot, and independently metered operation wherever feasible."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical
    applies_to: "inseparable co-products with a documented physical causal relationship"
    rule: "When subdivision is not feasible, apply the documented physical relationship that reflects how inputs and emissions change with the co-products; retain the formula and supporting measurements."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_economic_fallback
    applies_to: "inseparable saleable co-products without a defensible physical relationship"
    rule: "Use contemporaneous net economic value only as a fallback, disclose prices, period, currency, and allocation factors, and test sensitivity against mass allocation."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_waste
    applies_to: "discarded fibre and paper strip"
    rule: "Treat material sent to waste management as a waste output. Do not assign an avoided-product credit inside this plant-gate dataset unless a broader study applies and discloses a separate recycling or substitution method."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_inputs
      process_id: "yarn_manufacturing"
      flow_role: "flax_sliver_input, jute_fibre_input, hemp_fibre_input, coir_fibre_input, paper_strip_input"
      record_type: "weighbridge, scale, batch issue, and return records"
      raw_fields: "lot_id; material_identity; supplier; preparation_or_paper_grade; gross_mass; tare_mass; returned_mass; moisture_basis; timestamp"
      collection_method: "Reconcile receiving and lot-issue records to calibrated scale records and deduct documented returns."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "continuous over the reporting period"
      site_scope: "all reporting-site yarn lines"
      aggregation_rule: "Sum net input by atomic material and lot; never merge different material identities."
      quality_evidence: "calibration record; supplier specification; receiving record; batch issue and return record"
    - protocol_id: cp_electricity
      process_id: "yarn_manufacturing"
      flow_role: "medium_voltage_electricity_input"
      record_type: "electricity meter and production log"
      raw_fields: "meter_id; voltage_level; supply_mix; opening_reading; closing_reading; unit; allocation_key; lot_id; timestamp"
      collection_method: "Use dedicated meters where available; otherwise allocate a reconciled submeter total using documented machine runtime and rated-load evidence."
      unit: "original meter unit and MJ"
      frequency: "each lot or shift"
      temporal_coverage: "representative reporting period including all operating modes"
      site_scope: "all in-scope preparation, spinning or twisting, plying, winding, conditioning, and auxiliary equipment"
      aggregation_rule: "Convert with a documented unit equation and divide by net conforming yarn mass."
      quality_evidence: "meter calibration; utility invoice reconciliation; machine runtime log"
    - protocol_id: cp_process_water
      process_id: "yarn_manufacturing"
      flow_role: "process_water_input"
      record_type: "water meter, tank mass, or batch addition record"
      raw_fields: "meter_or_vessel_id; purpose; route; opening_reading; closing_reading; volume_or_mass; temperature_or_density; lot_id; timestamp"
      collection_method: "Measure only process water attributable to the lot and retain evidence for any volume-to-mass conversion."
      unit: "kg"
      frequency: "each lot or shift"
      temporal_coverage: "representative reporting period"
      site_scope: "paper moistening, wet spinning, conditioning, and attributable cleaning only"
      aggregation_rule: "Sum attributable water mass and divide by net conforming yarn mass."
      quality_evidence: "meter calibration; batch sheet; conversion record"
    - protocol_id: cp_lubricating_oil
      process_id: "yarn_manufacturing"
      flow_role: "mineral_lubricating_oil_input"
      record_type: "chemical issue and return record"
      raw_fields: "product_name; composition_or_specification; container_id; issued_mass; returned_mass; lot_id; use_point; timestamp"
      collection_method: "Weigh issued and returned containers and assign only net consumption to the lot."
      unit: "kg"
      frequency: "each issue and lot"
      temporal_coverage: "full reporting period"
      site_scope: "all in-scope use points"
      aggregation_rule: "Sum net consumed mass by the exact product identity and divide by net conforming yarn mass."
      quality_evidence: "scale calibration; safety data sheet; issue and return record"
    - protocol_id: cp_finished_yarn
      process_id: "yarn_manufacturing"
      flow_role: "finished_yarn_output"
      record_type: "finished-goods scale and quality release record"
      raw_fields: "lot_id; gross_mass; tare_mass; net_mass; moisture_content; moisture_basis; material_identity; construction; tex; twist_direction; twist_level; treatment_state; package_form; release_status"
      collection_method: "Weigh conforming yarn separately from carriers and rejected yarn; retain the quality-release record and test conditions."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full reporting period"
      site_scope: "all reporting-site yarn lines"
      aggregation_rule: "Sum conforming net yarn at the declared moisture basis; rejected yarn is not reference product."
      quality_evidence: "scale calibration; moisture test; ISO 2060 or equivalent record; ISO 2061 or equivalent record; lot release certificate"
    - protocol_id: cp_solid_wastes
      process_id: "yarn_manufacturing"
      flow_role: "flax_fibre_waste, jute_fibre_waste, hemp_fibre_waste, coir_fibre_waste, paper_strip_waste"
      record_type: "waste scale, container, and dispatch record"
      raw_fields: "lot_id; exact_material_identity; container_id; gross_mass; tare_mass; destination; recovery_or_disposal_route; timestamp"
      collection_method: "Segregate and weigh each atomic waste stream; use a documented sampling and reconciliation method if continuous collection prevents lot-level weighing."
      unit: "kg"
      frequency: "each lot or waste dispatch"
      temporal_coverage: "full reporting period"
      site_scope: "all in-scope waste collection points"
      aggregation_rule: "Sum each exact waste material separately and divide by net conforming yarn mass."
      quality_evidence: "scale calibration; waste transfer note; destination evidence; reconciliation record"
  calculation_rules:
    - id: calc_net_mass
      applies_to: "material, lubricant, finished-yarn, and waste records"
      rule: "net_mass = gross_mass - tare_mass - documented_returned_mass, with returned_mass omitted where not applicable."
      inputs:
        - gross_mass
        - tare_mass
        - returned_mass
      output: "net mass in kg"
      source_ids: []
    - id: calc_normalized_exchange
      applies_to: "every inventory row"
      rule: "normalized_exchange = attributable_exchange_amount / net_conforming_yarn_mass for the same lot and declared moisture basis."
      inputs:
        - "attributable exchange amount"
        - "net conforming yarn mass"
      output: "exchange amount per kg reference yarn"
      source_ids:
        - eu-pef-2021
    - id: calc_mass_reconciliation
      applies_to: "each production lot"
      rule: "Reconcile atomic material inputs against finished yarn, separately weighed wastes, retained work in progress, and measured moisture change; investigate and disclose any residual rather than creating an unmeasured flow."
      inputs:
        - "atomic material inputs"
        - "finished yarn"
        - "atomic wastes"
        - "work-in-progress change"
        - "measured moisture change"
      output: "lot mass-reconciliation statement"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and material identity"
      requirement: "Declare one yarn route and one exact botanical fibre species or paper grade per dataset; record any additional material or emitted substance as its own atomic exchange."
      evidence: "supplier specification; batch record; product release record; Tiangong UUID where resolved"
    - id: dq_measurement
      applies_to: "mass, electricity, and water records"
      requirement: "Use calibrated instruments and retain raw readings, units, conversion equations, allocation keys, and reconciliation evidence."
      evidence: "calibration certificates; meter logs; weigh tickets; calculation workbook"
    - id: dq_temporal
      applies_to: "reporting period"
      requirement: "Cover a representative period including startup, normal operation, changeover, stoppage, and cleaning attributable to the product, or disclose excluded operating modes."
      evidence: "production calendar; downtime log; reporting-period rationale"
    - id: dq_completeness
      applies_to: "process and exchange coverage"
      requirement: "Demonstrate that all in-scope operations and all material, energy, water, auxiliary, waste, and measured direct-emission exchanges are included or explicitly documented as not applicable."
      evidence: "completeness checklist and lot mass reconciliation; eu-pef-2021"
    - id: dq_yarn_properties
      applies_to: "reference product"
      requirement: "Retain linear-density, twist, moisture, construction, treatment-state, and package-form evidence for the represented lot."
      evidence: "ISO 2060 or justified equivalent; ISO 2061 or justified equivalent; moisture test; lot specification"
    - id: dq_representativeness
      applies_to: "dataset publication"
      requirement: "Assess and disclose technological, geographical, temporal, and precision representativeness and any proxy upstream dataset."
      evidence: "data-quality assessment following eu-pef-2021"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Require exactly 1 kg net conforming yarn, the confirmed reference product UUID, Mass flow-property UUID, Units of mass unit-group UUID, and every required product qualifier."
    source_ids:
      - unsd-cpc-3-0-26380
      - iso-2060-1994
      - iso-2061-2015
  - rule_id: validate_route_material
    applies_to: "starting material"
    rule: "Require exactly one declared route and only material cards that apply to the lot. Any other in-scope vegetable fibre shall be recorded with its exact species-specific atomic name and a verified Tiangong UUID or an explicit unresolved identity record."
    source_ids:
      - unsd-cpc-3-0-26380
  - rule_id: validate_atomic_inventory
    applies_to: "all exchanges"
    rule: "Reject any card that combines different materials, chemicals, electricity supply scenarios, fuels, wastes, or elementary flows; every selected flow shall describe one atomic exchange."
    source_ids: []
  - rule_id: validate_amount_evidence
    applies_to: "all inventory amounts"
    rule: "Require foreground records or calculations linked to the collection protocols. Reject AI-estimated amounts and unsupported default ranges."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_mass_balance
    applies_to: "each production lot"
    rule: "Require a documented mass reconciliation of atomic material inputs, finished yarn, atomic wastes, work-in-progress change, and measured moisture change; unresolved residuals shall be disclosed and investigated."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_boundary
    applies_to: "foreground dataset"
    rule: "Require all directly controlled in-scope operations, utilities, auxiliaries, rejects, and measured emissions, plus linked upstream datasets for purchased inputs; disclose each treatment excluded from the delivered yarn state."
    source_ids:
      - eu-jrc-txt-bref-2023
      - eu-bat-textiles-2022
      - eu-pef-2021
  - rule_id: validate_allocation
    applies_to: "shared operations and co-products"
    rule: "Require subdivision first and retain the physical or economic allocation evidence when allocation remains necessary."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground product-manufacturing dataset for one declared non-cotton vegetable-fibre yarn or paper-yarn route."
  downstream_use: "May support a reviewed secondary_dataset or background_dataset for textile, packaging, composite, craft, or other systems consuming the declared yarn."
  allowed_use: "Use for the declared material, yarn construction, treatment state, plant technology, geography, and reporting period after all unresolved identities are resolved or transparently retained for candidate review."
  excluded_use: "Do not represent cotton, animal-fibre, man-made-fibre, sewing-thread, rope, fabric, dyed, bleached, coated, or sized yarn production unless the changed identity and added processes are explicitly modelled. Do not use for comparative assertions without an independently reviewed complete life-cycle scope."
  required_metadata: "PCR id; route; material species or paper grade; upstream preparation state; yarn construction; tex; twist direction and level; moisture basis and content; treatment state; package form; plant geography; technology; reporting period; allocation method; electricity voltage and mix; waste destinations; source and dataset versions."
  required_quality_disclosure: "Instrument calibration; sampling and allocation methods; mass-reconciliation result; coverage gaps; operating modes; upstream proxies; technological, geographical, temporal, and precision representativeness; unresolved UUIDs."
  update_trigger: "Change in starting material, paper grade, spinning or twisting technology, yarn construction, treatment state, plant electricity supply, allocation basis, waste route, reporting period, or any resolved Tiangong identity."
