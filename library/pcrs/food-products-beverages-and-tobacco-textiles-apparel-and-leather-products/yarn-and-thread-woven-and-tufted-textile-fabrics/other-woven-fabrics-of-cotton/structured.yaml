allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Dedicated lines, batch steps, meters, and treatment trains"
    rule: "Avoid allocation first by subdividing processes and using direct batch, line, meter, or treatment records attributable to the reference fabric. Do not pool route-specific wet processing with unprocessed greige production when separable records exist."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "Unavoidable shared operations with multiple fabric outputs"
    rule: "When subdivision or defensible system expansion is not possible, use a documented causal physical relationship such as machine time, metered energy, liquor volume, treatment load, or processed mass. Select the driver that best explains consumption or emission formation, not automatically product mass."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_last_resort
    applies_to: "Multi-output operation lacking a defensible physical relationship"
    rule: "Use revenue-based allocation only as a last resort. Record product quantities, prices, currency, geography, price period, treatment of zero/negative values, and sensitivity to price variation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residues
    applies_to: "Yarn waste, fabric scrap, recovered paste, sludge, and off-spec material"
    rule: "Classify each output before allocation. Internal reuse is a tracked internal transfer; an externally marketable output is a co-product handled by the hierarchy; a waste output carries treatment according to the selected waste model. Do not claim avoided burdens in the foreground inventory without an explicit downstream method."
    source_ids:
      - eu-pef-2021-2279
      - eu-txt-bat-2022
  - rule_id: allocation_shared_treatment
    applies_to: "Utilities, wastewater treatment, and air-abatement systems"
    rule: "Prefer process-specific meters and pollutant loads. Otherwise allocate electricity/heat by causal demand and treatment burdens by measured volume and relevant pollutant load; disclose any remaining shared-site allocation."
    source_ids:
      - eu-txt-bat-2022
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_weaving_batch
      process_id: "weaving"
      flow_role: "Yarn, chemicals, energy, greige output, and weaving residues"
      record_type: "Batch issue/return, stock, meter, production, and waste records"
      raw_fields: "lot_id; yarn_id/composition/count; opening/receipt/issue/return/closing mass; chemical_id/concentration; meter_start/end; greige_mass; width; length; area_mass; moisture; residue_mass/disposition"
      collection_method: "Reconcile warehouse and batch records with calibrated scales and electricity/energy meters"
      unit: "kg; kWh; MJ; m; m2; g/m2; %"
      frequency: "Each lot and monthly reconciliation"
      temporal_coverage: "Representative continuous 12-month period or full shorter campaign with seasonality limitation"
      site_scope: "Every included weaving line at the reporting site"
      aggregation_rule: "Sum attributable records, resolve stock changes and rework, then normalize with calc_reference_normalization"
      quality_evidence: "Scale/meter calibration; signed stock reconciliation; lot traveller; production and waste tickets"
    - protocol_id: cp_pretreatment_batch
      process_id: "pretreatment"
      flow_role: "Fabric input/output, water, chemicals, energy, wastewater, and residues"
      record_type: "Recipe, batch-controller, meter, laboratory, stock, and dispatch records"
      raw_fields: "batch_id; input/output_mass; moisture; water_intake/reuse/discharge; chemical_id/concentration/dose; electricity/steam/heat/fuel; wastewater_volume/analysis; residue_mass/destination"
      collection_method: "Read batch controls and submeters; reconcile chemical inventory and laboratory samples"
      unit: "kg; m3; kWh; MJ; mg/L or kg pollutant"
      frequency: "Each batch; discharge sampling per applicable permit; monthly reconciliation"
      temporal_coverage: "Representative continuous 12-month period or full campaign"
      site_scope: "Every included pretreatment line and linked treatment stream"
      aggregation_rule: "Sum by route and lot; keep gross/reused/net water distinct; normalize to accepted reference output"
      quality_evidence: "Meter calibration; recipe authorization; laboratory QA/QC; mass and water balance; waste manifests"
    - protocol_id: cp_colouration_batch
      process_id: "colouration_printing"
      flow_role: "Fabric, colourants/pastes/auxiliaries, water, energy, wastes, and emissions"
      record_type: "Recipe, dosing, meter, paste-return, laboratory, exhaust, and waste records"
      raw_fields: "batch/design_id; technology; fabric_mass; chemical_id/concentration/dose; paste_prepared/returned/reused/waste; water; electricity/heat; wastewater_volume/analysis; exhaust_flow/concentration/time; output_mass; test_result"
      collection_method: "Capture machine recipe and dosing data, meter readings, paste reconciliation, and validated sampling"
      unit: "kg; m3; kWh; MJ; mg/L; mg/Nm3; Nm3; h"
      frequency: "Each batch/design; emission sampling per permit; monthly reconciliation"
      temporal_coverage: "Representative continuous 12-month period or full campaign"
      site_scope: "Every included dyeing/printing/fixation/washing/drying line"
      aggregation_rule: "Reconcile prepared paste and chemicals; calculate measured emission loads; normalize to accepted output"
      quality_evidence: "Calibrated dosing/meter systems; laboratory QA/QC; paste balance; sampling reports; lot quality certificate"
    - protocol_id: cp_finishing_batch
      process_id: "finishing"
      flow_role: "Fabric, finish chemicals, water, energy, residues, and air emissions"
      record_type: "Recipe, dosing, meter, line, laboratory, and waste records"
      raw_fields: "batch_id; finish/function; input/output_mass; chemical_id/concentration/dose; water; electricity/steam/heat/fuel; exhaust_flow/concentration/time; wastewater/residue; process_temperature/time; quality_test"
      collection_method: "Capture line recipes and meters, retain chemical identity, and use validated emission/test methods"
      unit: "kg; m3; kWh; MJ; mg/Nm3; Nm3; h; degC"
      frequency: "Each batch; sampling per permit; monthly reconciliation"
      temporal_coverage: "Representative continuous 12-month period or full campaign"
      site_scope: "Every included finishing and thermal-treatment line"
      aggregation_rule: "Aggregate only equivalent finish routes; calculate loads and normalize to accepted output"
      quality_evidence: "Calibration; recipe approval; safety data; sampling QA/QC; product test report"
    - protocol_id: cp_utilities_treatment
      process_id: "utilities_treatment"
      flow_role: "Fuels, purchased/generated energy, water, treatment materials, wastewater loads, recovered utilities, sludge, and direct emissions"
      record_type: "Invoice, meter, stock, treatment log, laboratory, and dispatch records"
      raw_fields: "carrier_id; quantity; heating_value_basis; electricity/steam/heat import/generation/export; water_withdrawal/supply/reuse; chemical_id/dose; inflow/outflow_volume/concentration; exhaust_flow/concentration; sludge_mass/dry_solids/destination"
      collection_method: "Reconcile site and submeter totals; use flow-proportional or documented representative sampling and traceable laboratory methods"
      unit: "kg; m3; kWh; MJ; mg/L; mg/Nm3; kg pollutant; % solids"
      frequency: "Continuous/daily meters, batch logs, monthly balance, sampling per permit"
      temporal_coverage: "Same period as production data"
      site_scope: "All utility and treatment assets serving included processes"
      aggregation_rule: "Subtract documented exports only once; allocate after direct attribution; calculate loads and normalize"
      quality_evidence: "Meter/calibration records; fuel certificates; laboratory QA/QC; permit reports; treatment and waste logs"
    - protocol_id: cp_final_release
      process_id: "inspection_packaging"
      flow_role: "Submitted/accepted fabric, qualifiers, quality results, packaging, off-spec material, and reference mass"
      record_type: "Lot traveller, scale, dimensional, test, bill-of-material, grading, and dispatch records"
      raw_fields: "lot_id; product_name; composition; route; yarn/weave; input/accepted/rejected_mass; moisture; length; usable_width; area_mass; colour/print/finish; test_method/result/grade; packaging_id/mass; disposition"
      collection_method: "Calibrated weighing and dimensional measurement; applicable verified quality testing; dispatch reconciliation"
      unit: "kg; m; m2; g/m2; %; test-specific unit"
      frequency: "Every released lot"
      temporal_coverage: "Same period as process inventory"
      site_scope: "All released reference products at the reporting site"
      aggregation_rule: "Sum accepted mass only; retain rejected/reworked quantities separately; set normalized output to exactly 1 kg"
      quality_evidence: "Scale and dimensional calibration; test report; signed release certificate; packaging BOM; dispatch record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every foreground inventory amount"
      rule: "normalized quantity = quantity attributable to the included product / accepted saleable fabric mass on the reference moisture basis"
      inputs:
        - "Attributable quantity"
        - "accepted saleable fabric mass"
        - "moisture conversion where used"
      output: "Quantity per 1 kg reference fabric"
      source_ids: []
    - id: calc_area_mass_crosscheck
      applies_to: "Final fabric lot"
      rule: "calculated mass kg = usable length m x usable width m x area mass g/m2 / 1000; compare with calibrated measured mass and investigate material discrepancy"
      inputs:
        - Length
        - "usable width"
        - "area mass"
        - "measured mass"
      output: "Mass consistency result and discrepancy"
      source_ids: []
    - id: calc_net_water
      applies_to: "Each wet process and site total"
      rule: "net water consumption = gross external water input - water exported from the boundary; report internally reused/recycled water separately and do not subtract it twice"
      inputs:
        - "Water intake"
        - "internal reuse/recycle"
        - export
        - discharge
        - "stock change where relevant"
      output: "Gross, reused/recycled, net, and discharged water per reference flow"
      source_ids:
        - eu-txt-bat-2022
    - id: calc_direct_emission_load
      applies_to: "Measured wastewater and air releases"
      rule: "pollutant load = representative concentration x validated discharge or exhaust volume for the same period, with unit conversion and below-detection treatment documented"
      inputs:
        - Concentration
        - "matched volume/flow and duration"
        - "detection limit"
        - "operating period"
      output: "Pollutant mass per reference flow"
      source_ids:
        - eu-txt-bat-2022
    - id: calc_mass_balance
      applies_to: "Yarn-to-fabric and chemical/paste stages"
      rule: "input + opening stock = accepted output + residues/wastes + exports/transfers + closing stock + documented moisture change; report unresolved difference rather than forcing closure"
      inputs:
        - "Batch and stock masses"
        - transfers
        - "moisture basis"
      output: "Stage mass balance and unexplained difference"
      source_ids:
        - eu-txt-bat-2022
    - id: calc_allocation
      applies_to: "Shared process or facility"
      rule: "Apply Section 7 in order: subdivision/system expansion where defensible, causal physical relationship, then economic allocation as last resort; allocation factors shall sum to 1 within documented rounding"
      inputs:
        - "Direct records"
        - "causal driver quantities"
        - "co-product quantities"
        - "prices only if needed"
      output: "Allocated inventory and disclosed factor set"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and intermediates"
      requirement: "Preserve lot-level composition, yarn, weave/construction, area mass, width, route, colour/print, finish, moisture basis, grade, and actual product name. Explicitly state whether the product matches or differs from printed cotton cloth."
      evidence: "Product specification; lot traveller; laboratory/test report; release certificate"
    - id: dq_primary_period
      applies_to: "Foreground activity data"
      requirement: "Use a continuous representative 12-month period where operations are year-round. A shorter campaign is allowed only when it covers the full campaign and discloses seasonality, downtime, and representativeness limits."
      evidence: "Dated meter, production, stock, and dispatch series; coverage statement"
    - id: dq_site_coverage
      applies_to: "Included foreground boundary"
      requirement: "Include all lines, utilities, and treatment assets serving the declared product route, or disclose and quantify the excluded share and proxy method."
      evidence: "Site process map; line list; meter map; production reconciliation"
    - id: dq_completeness
      applies_to: "Inputs, outputs, wastes, and direct emissions"
      requirement: "Screen all process inputs and outputs; name and justify omissions and show that the same wastewater or emission load is not counted both before and after treatment."
      evidence: "Input-output inventory; chemical register; mass/water/energy balances; omission log"
    - id: dq_measurement
      applies_to: "Mass, water, energy, and emission data"
      requirement: "Retain calibration status, sampling method, laboratory QA/QC, detection-limit treatment, and unit conversions. Prefer direct batch/line meters before shared-site allocation."
      evidence: "Calibration certificates; sampling plan; laboratory reports; conversion-factor register"
    - id: dq_representativeness
      applies_to: "Upstream and proxy datasets"
      requirement: "Assess and disclose technological, geographical, temporal, and precision representativeness, plus methodological consistency and completeness."
      evidence: "Dataset metadata and data-quality assessment"
    - id: dq_traceability
      applies_to: "Calculated and allocated values"
      requirement: "Preserve raw record identifiers, formulas, allocation drivers/factors, source identifiers, reviewer, and reproducible calculation version."
      evidence: "Calculation workbook or script output; approval record; source register"
validation_rules:
  - rule_id: validation_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Fail if the data package lacks actual product name, fibre composition, weave/construction, route, area mass, usable width, moisture basis, finish/grade, or evidence that more specific product categories were considered."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: validation_representative_route
    applies_to: "foreground_dataset_conformance"
    rule: "Fail if an unprinted or otherwise semantically different fabric is described as Printed cotton cloth without an explicit representative-identity limitation and actual product description."
    source_ids: []
  - rule_id: validation_reference_flow
    applies_to: "foreground_dataset_conformance"
    rule: "Fail if accepted fabric output is not exactly 1 kg after normalization, if packaging is included in fabric mass, or if the Mass flow property, unit group, or kg unit differs from Section 3."
    source_ids: []
  - rule_id: validation_route_coverage
    applies_to: "foreground_dataset_conformance"
    rule: "Fail if any performed weaving preparation, wet processing, dyeing/printing, finishing, utility, treatment, inspection, or packaging stage is omitted without quantified justification."
    source_ids:
      - eu-txt-bat-2022
  - rule_id: validation_inventory_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Require reconciled yarn/fabric mass balance; gross/reused/net water reporting for wet routes; and separately traceable electricity, fuels, steam/heat, recovery, and exports. Flag unexplained differences and double counting."
    source_ids:
      - eu-txt-bat-2022
  - rule_id: validation_chemicals_emissions
    applies_to: "foreground_dataset_conformance"
    rule: "Require route-specific chemical identity and quantity, measured wastewater volume/load, relevant direct air releases, treatment destination, and non-duplication of pre- and post-treatment emissions."
    source_ids:
      - eu-txt-bat-2022
  - rule_id: validation_allocation
    applies_to: "foreground_dataset_conformance"
    rule: "Fail if allocation is used before available subdivision, lacks a causal or last-resort economic basis, has factors that do not sum to 1 within disclosed rounding, or treats waste/reuse/co-products inconsistently."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_quality
    applies_to: "foreground_dataset_conformance"
    rule: "Require declared applicable performance/quality tests and results for the actual product. Do not impose printed-fabric or EU Ecolabel thresholds on products for which they are not applicable."
    source_ids:
      - eu-ecolabel-textiles-2014-350
  - rule_id: validation_data_quality
    applies_to: "foreground_dataset_conformance"
    rule: "Require coverage period, site/line scope, primary/proxy split, representativeness assessment, calibration/sampling evidence, source traceability, and an explicit limitations statement."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground factory-gate dataset for the declared woven cotton fabric route, suitable for later reviewed publication as a secondary or background dataset"
  downstream_use: "secondary_dataset; background_dataset; source for process and lifecyclemodel projections when all route and quality qualifiers are preserved"
  allowed_use: "Product-specific cradle-to-gate or life-cycle models that need a factory-gate woven cotton fabric input and can accept the declared composition, construction, route, geography, technology, period, allocation, and data-quality profile"
  excluded_use: "A generic market-average for all cotton fabrics; automatic use for knitted/nonwoven/special fabrics; substitution for cotton cultivation, spinning, garment manufacture, use, or end-of-life; representing every CPC 26690 product as printed cloth; comparative claims without compatible functional and quality specifications"
  required_metadata: "Canonical PCR id; actual product name; CPC context; composition; yarn and weave/construction; area mass; usable width; moisture basis; actual greige/pretreatment/dyeing/printing/finishing route; performance grade and tests; reference flow; site geography; technology; reporting period; process map; upstream dataset links; treatment; allocation; packaging; reviewer and calculation version"
  required_quality_disclosure: "Primary versus secondary data share; line/site and temporal coverage; mass/water/energy reconciliation; meter and sampling quality; chemical and emissions coverage; proxy representativeness; omissions; allocation sensitivity; limitations of the printed representative identity"
  update_trigger: "Material change to product composition/construction, route, site or equipment, printing/finishing chemistry, energy/water supply, treatment, allocation, classification, product-flow identity, regulation or BAT basis, or foreground data older than the organization's review interval"
