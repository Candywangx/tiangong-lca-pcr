  - id: finishing
    name: "Mechanical, chemical, and thermal finishing"
    inclusion: "conditional"
    inclusion_condition: "Include only treatments actually applied, such as softening, easy-care, coating within scope, calendaring, raising, sanforising, drying, curing, or heat-setting"
    role: "Delivers declared handle, dimensions, appearance, or functional performance"
    quantitative_reference: "Per 1 kg saleable reference fabric"
  - id: utilities_treatment
    name: "Site utilities and emission/effluent treatment"
    inclusion: "conditional"
    inclusion_condition: "Include on-site boilers, direct heating, compressed air, water preparation, heat recovery, air abatement, and wastewater treatment that serve included processes"
    role: "Supplies shared services and records direct site emissions and treatment outputs"
    quantitative_reference: "Per 1 kg saleable reference fabric"
  - id: inspection_packaging
    name: "Final inspection, grading, and packaging"
    inclusion: "required"
    inclusion_condition: "Include final measurement, testing, grading, trimming, roll/bale preparation, and packaging before factory-gate release"
    role: "Produces accepted saleable reference fabric and identifies off-spec material"
    quantitative_reference: "1 kg accepted saleable fabric"
