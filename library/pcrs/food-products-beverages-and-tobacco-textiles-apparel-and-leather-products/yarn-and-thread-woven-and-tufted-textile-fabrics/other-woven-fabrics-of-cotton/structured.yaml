measurement_rules:
  - id: reference_mass
    applies_to: "Saleable reference fabric"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground quantities to 1 kg of accepted saleable fabric. Exclude cores, wraps, pallets, and other packaging from fabric mass and inventory them separately. Record the weighing basis and moisture condition."
  - id: dry_mass_and_moisture
    applies_to: "Yarn, fabric intermediates, and saleable fabric"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use consistent dry-mass or declared commercial-moisture accounting across the lot. If commercial mass is used, record measured or specified moisture and the conversion used for mass-balance comparison."
  - id: area_mass_check
    applies_to: "Saleable fabric"
    required_property_ref:
      name: "Area, mass, length, and usable width"
      uuid: ""
    required_unit: "m2, kg, m, m, g/m2"
    rule: "Cross-check lot mass against usable length x usable width x measured area mass. Investigate a material mismatch; do not replace measured reference mass with the area calculation without explanation."
  - id: composition_basis
    applies_to: "Fibre composition"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "% by mass"
    rule: "Report constituent fibre fractions on one declared mass basis and require the total to equal 100% within documented rounding tolerance."
  - id: water_accounting
    applies_to: "Wet processes and cleaning"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Record gross fresh-water intake, internally reused/recycled water, and net water consumption separately; do not subtract water that is merely transferred to another on-site process without documenting the transfer."
  - id: energy_accounting
    applies_to: "Electricity, fuels, steam, and heat"
    required_property_ref:
      name: "Energy or carrier-specific property"
      uuid: ""
    required_unit: "kWh, MJ, kg, or m3"
    rule: "Record purchased electricity, each fuel carrier, imported steam/heat, on-site generation, recovered energy, and exports separately. Apply conversion factors with their source and do not mix lower and higher heating values."
