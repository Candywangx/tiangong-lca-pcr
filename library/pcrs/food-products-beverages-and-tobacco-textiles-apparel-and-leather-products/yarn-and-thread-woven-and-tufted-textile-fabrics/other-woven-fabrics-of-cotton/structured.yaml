    name: "Dyeing or printing"
    inclusion: "conditional"
    inclusion_condition: "Include the actual dyeing and/or printing technology, fixation, washing, drying, equipment cleaning, and paste management performed within the reporting boundary"
    role: "Applies colour or printed design; printed cloth is one representative route only"
