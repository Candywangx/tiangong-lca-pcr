system_boundary:
  rules:
    - rule_id: sb_foreground_gate
      applies_to: "all foreground processes"
      rule: "Include yarn receipt and preparation, weaving, every operation needed to reach the declared saleable state, internal rework, utilities, direct emissions, waste and wastewater handling before transfer, inspection, and packaging through the factory gate."
      source_ids:
        - jrc-txt-bref-2023
        - eu-txt-bat-2022
    - rule_id: sb_conditional_finishing
      applies_to: "pretreatment, dyeing, printing, coating, drying, curing, and functional finishing"
      rule: "Include each operation when it is performed for the reference product. For an outsourced operation, record the fabric transfer and link the supplier dataset instead of representing the operation as absent."
      source_ids:
        - jrc-txt-bref-2023
        - eu-txt-bat-2022
        - zhang-et-al-2023-wet-processing
    - rule_id: sb_atomic_inventory
      applies_to: "all inventory exchanges"
      rule: "Record each yarn, sizing chemical, dye, auxiliary, electricity supply, steam supply, fuel, packaging component, waste, wastewater stream, and elementary emission as its own exchange. Add a new atomic row for every substance or product actually used that is not represented by the cards below."
      source_ids:
        - eu-txt-bat-2022
    - rule_id: sb_no_silent_cutoff
      applies_to: "known foreground exchanges"
      rule: "Do not omit a known exchange because its measured amount is small. Record it, or document why that exact exchange is not applicable."
      source_ids:
        - iso-14044-2006
        - eu-pef-2021
    - rule_id: sb_treatment_transfer
      applies_to: "waste, wastewater, and captured pollutants"
      rule: "Include on-site collection and treatment. When an exchange leaves the facility, record its physical state, quantity, receiving operator, and treatment or discharge destination."
      source_ids:
        - eu-txt-bat-2022
