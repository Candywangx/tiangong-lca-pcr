allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared operations and internal rework"
    rule: "Prefer process subdivision, submetering, and direct lot assignment. Keep internal rework inside the product system and do not count it as both waste output and new external input."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: allocation_mass
    applies_to: "unavoidable shared burdens among fabric outputs with comparable function"
    rule: "If direct assignment is not possible, allocate by accepted output mass on the common moisture basis and disclose the period, outputs, and factors."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_causal
    applies_to: "co-products with materially different functions"
    rule: "Use a documented physical relationship that reflects causality; if none is defensible, use factory-gate revenue and report a sensitivity comparison with mass allocation."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: allocation_waste_status
    applies_to: "recovered yarn, fabric, size, sludge, and packaging"
    rule: "Treat an output as a co-product only when its specification, quantity, recipient, and market are documented. Otherwise retain it as waste and link its treatment without an avoided-product credit."
    source_ids:
      - eu-pef-2021
      - eu-txt-bat-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_yarn_and_fabric_mass
      process_id: "yarn_preparation_weaving_wet_and_dry_finishing_inspection_and_packaging"
      flow_role: "yarn and fabric transfers"
      record_type: "purchase, warehouse, roll-scale, production-order, and inspection records"
      raw_fields: "lot_id; material_id; supplier; fibre_types; fibre_mass_shares; yarn_count; gross_mass; tare; moisture_basis; process_from; process_to; grade; rework_status"
      collection_method: "calibrated scales reconciled to warehouse and production records"
      unit: "kg"
      frequency: "each receipt, issue, roll, or transfer"
      temporal_coverage: "same declared reporting period as reference output"
      site_scope: "every included line and outsourced transfer"
      aggregation_rule: "sum net mass by exact material identity and process transfer; reconcile internal outputs to inputs"
      quality_evidence: "scale calibration; stock reconciliation; roll trace; supplier specification"
    - protocol_id: cp_chemical_receipts_and_dosing
      process_id: "yarn_preparation_weaving_wet_and_dry_finishing"
      flow_role: "one named chemical product per exchange"
      record_type: "purchase, stock, recipe, dosing, return, and recovery records"
      raw_fields: "chemical_id; trade_name; concentration; solids_fraction; batch_id; issued_mass; returned_mass; recovered_mass; opening_stock; closing_stock"
      collection_method: "calibrated dosing or weighing reconciled to approved recipes and stock"
      unit: "kg"
      frequency: "each batch and stock reconciliation"
      temporal_coverage: "same declared reporting period as associated process output"
      site_scope: "every included dosing point"
      aggregation_rule: "calculate net consumption separately for each chemical identity; never merge different substances into one amount"
      quality_evidence: "calibration; recipe approval; safety data sheet; stock balance"
    - protocol_id: cp_water_and_energy
      process_id: "yarn_preparation_weaving_wet_and_dry_finishing_inspection_and_packaging"
      flow_role: "one water or energy carrier per exchange"
      record_type: "meter, invoice, condensate, and equipment-runtime records"
      raw_fields: "meter_id; carrier; opening_reading; closing_reading; purchased_quantity; reused_quantity; condensate_return; equipment_id; runtime; allocation_driver"
      collection_method: "submetering preferred; otherwise a documented complete meter balance and causal allocation"
      unit: "kg; kWh"
      frequency: "meter or invoice interval"
      temporal_coverage: "same declared reporting period as associated process output"
      site_scope: "all included equipment and assigned support systems"
      aggregation_rule: "keep tap water, electricity, and steam separate; reconcile site totals before normalization"
      quality_evidence: "meter calibration; invoices; meter map; allocation worksheet"
    - protocol_id: cp_waste_and_emissions
      process_id: "yarn_preparation_weaving_wet_and_dry_finishing_inspection_and_packaging"
      flow_role: "one named waste or elementary emission per exchange"
      record_type: "container weights, transfer notes, discharge meters, laboratory reports, and stack or facility emission records"
      raw_fields: "flow_id; substance_or_waste_name; source_process; gross_mass; tare; dry_matter; discharge_point; concentration; gas_or_water_flow; destination; treatment_operator"
      collection_method: "calibrated weighing or representative monitoring for each named exchange"
      unit: "kg"
      frequency: "each transfer or monitoring interval"
      temporal_coverage: "same declared reporting period as associated process output"
      site_scope: "every included waste route and emission point"
      aggregation_rule: "aggregate only measurements of the same flow identity, state, and destination; exclude verified internal rework"
      quality_evidence: "calibration; chain of custody; accredited laboratory report; transfer receipt; emission report"
    - protocol_id: cp_packaging_and_dispatch
      process_id: "inspection_and_packaging"
      flow_role: "each packaging component and accepted product"
      record_type: "bill of materials, issue, scale, and dispatch records"
      raw_fields: "packaging_material_id; issued_mass; returned_mass; shipped_mass; roll_id; core_tare; product_grade"
      collection_method: "calibrated weighing reconciled to packaging issues and dispatch"
      unit: "kg"
      frequency: "each dispatch"
      temporal_coverage: "same declared reporting period as reference output"
      site_scope: "all included packaging and dispatch operations"
      aggregation_rule: "sum each packaging material separately; accepted product excludes cores and packaging"
      quality_evidence: "scale calibration; bill of materials; dispatch note; stock reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every non-reference inventory row"
      rule: "normalized amount = collected reporting-period amount divided by accepted saleable fabric mass on the common moisture basis, multiplied by 1,000 kg"
      inputs:
        - "collected flow amount"
        - "accepted product mass"
        - "moisture correction"
      output: "amount per 1,000 kg reference product"
      source_ids:
        - iso-14044-2006
        - eu-pef-2021
    - id: calc_mass_from_area
      applies_to: "length- or area-based fabric records"
      rule: "fabric mass = measured length multiplied by usable width multiplied by measured mass per unit area; reconcile the result with scale mass"
      inputs:
        - length
        - "usable width"
        - "mass per unit area"
        - "scale mass"
      output: "kg fabric on the declared moisture basis"
      source_ids: []
    - id: calc_material_balance
      applies_to: "yarn preparation, weaving, and finishing"
      rule: "reconcile common-basis material inputs with products, inventory change, internal rework, each waste flow, and measured emissions; disclose the signed unexplained difference"
      inputs:
        - "all material inputs and outputs"
        - "opening and closing inventory"
      output: "process material-balance statement"
      source_ids:
        - eu-txt-bat-2022
    - id: calc_water_balance
      applies_to: "each process using water"
      rule: "reconcile purchased tap water with separately measured reuse, evaporation, product retention, wastewater, and inventory change without collapsing these exchanges"
      inputs:
        - "water input"
        - reuse
        - wastewater
        - evaporation
        - retention
        - "inventory change"
      output: "process water-balance statement"
      source_ids:
        - eu-txt-bat-2022
    - id: calc_allocation_factor
      applies_to: "unavoidable shared process"
      rule: "allocation factor = selected causal quantity for the reference product divided by the same quantity for all co-produced outputs in the same period"
      inputs:
        - "output quantities"
        - "causal driver or revenue"
        - "reporting period"
      output: "disclosed allocation factor"
      source_ids:
        - iso-14044-2006
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product, yarns, chemicals, packaging, wastes, and emissions"
      requirement: "Preserve one exact identity for every exchange, including product concentration or composition, flow type, process, state, and destination where applicable."
      evidence: "specifications; safety data sheets; purchase records; transfer notes; laboratory records"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Use one representative declared reporting period, identify abnormal operation and product-mix changes, and justify excluded dates or lots."
      evidence: "dated meter exports; production ledger; shutdown and campaign log"
    - id: dq_measurement
      applies_to: "mass, water, electricity, steam, waste, and emissions"
      requirement: "Use calibrated instruments or document the complete calculation, inputs, units, and uncertainty."
      evidence: "calibration certificates; raw readings; invoices; calculation worksheets"
    - id: dq_completeness
      applies_to: "process map and inventory"
      requirement: "Cover every required process, every applicable conditional process, and every actual atomic exchange without an undocumented cutoff."
      evidence: "process flow sheet; recipe list; input-output inventory; mass and water balances"
    - id: dq_supplier_links
      applies_to: "purchased inputs and outsourced operations"
      requirement: "Retain supplier, geography, technology, reporting period, product composition, and dataset reference sufficient to select representative upstream data."
      evidence: "supplier declaration; purchase record; linked dataset metadata"
    - id: dq_uuid_status
      applies_to: "inventory flow identity"
      requirement: "Use a Tiangong UUID only after hybrid discovery and direct public-row verification confirm exact semantics, flow type, reference property, and unit. Keep unresolved identities in manifest review metadata."
      evidence: "authoring review record; public-row readback"
    - id: dq_no_temporary_numbers
      applies_to: "inventory amounts and ranges"
      requirement: "Use collected foreground values. No AI-authored numerical estimate or range is a conforming amount; any future source-backed range must retain its source and basis."
      evidence: "foreground records; cited range source; review record"
validation_rules:
  - rule_id: validation_identity
    applies_to: "dataset metadata and reference flow"
    rule: "Fail conformance when CPC 26790 scope, fibre mass shares, yarn counts, weave, usable width, mass per unit area, finish state, moisture basis, defect grade, or reference-product UUID is absent or inconsistent."
    source_ids:
      - unsd-cpc-3-2025
      - iso-14044-2006
  - rule_id: validation_reference_mass
    applies_to: "reference flow and normalized rows"
    rule: "Confirm exactly 1,000 kg accepted saleable fabric excluding cores and packaging, and confirm one moisture basis and accepted-output denominator are used throughout."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: validation_process_coverage
    applies_to: "process map"
    rule: "Require yarn_preparation, weaving, and inspection_and_packaging; require wet_and_dry_finishing whenever any pretreatment, dyeing, printing, coating, drying, curing, or functional-finishing operation is performed on-site or by a linked supplier."
    source_ids:
      - jrc-txt-bref-2023
      - eu-txt-bat-2022
      - zhang-et-al-2023-wet-processing
  - rule_id: validation_atomic_flows
    applies_to: "process inventory"
    rule: "Reject a collection label, selector, combined carrier, combined chemical group, combined packaging group, combined waste group, or combined emission group as Selected flow; require a separate row for every actual exchange."
    source_ids:
      - eu-txt-bat-2022
  - rule_id: validation_transfer_balance
    applies_to: "internal process transfers"
    rule: "Reconcile each upstream product output to the matching downstream input on the common moisture basis and disclose any transfer difference."
    source_ids:
      - eu-txt-bat-2022
  - rule_id: validation_water_and_energy
    applies_to: "processes using water or energy"
    rule: "Require separate tap-water, electricity, and steam records; require water and energy balances that identify reuse, recovery, and allocation without merging carriers."
    source_ids:
      - eu-txt-bat-2022
  - rule_id: validation_waste_and_emissions
    applies_to: "waste, wastewater, and direct emissions"
    rule: "Require each actual waste and elementary emission to have one identity, amount, source process, monitoring or weighing basis, and destination or compartment; require a documented not-applicable finding when a listed card does not occur."
    source_ids:
      - eu-txt-bat-2022
  - rule_id: validation_allocation
    applies_to: "shared operations and co-products"
    rule: "Require direct assignment where available; otherwise require the driver, factor, affected processes, reporting period, and sensitivity disclosure."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: validation_sources_and_protocols
    applies_to: "collected rows, calculated rules, and UUID-bearing rows"
    rule: "Require every collected row to reference an existing protocol, every external rule to reference a listed source id, and every adopted UUID to have exact public-row verification evidence in the authoring review."
    source_ids:
      - iso-14044-2006
      - eu-txt-bat-2022
published_dataset_profile:
  dataset_role: "Foreground factory-gate manufacturing dataset for other woven fabrics of man-made staple fibres"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product-footprint, process, lifecyclemodel, and supply-chain studies whose fabric composition, market state, production operations, geography, reporting period, and allocation method match the declared dataset"
  excluded_use: "Fibre manufacture; yarn spinning; man-made filament fabric; the more specific CPC 2674, 2675, 2676, or 2677 products; knitted or nonwoven fabric; garments or made-up articles; use; and end-of-life"
  required_metadata: "canonical PCR id; CPC reference; reference product UUID; fibre mass shares; yarn counts; weave; usable width; mass per unit area; greige or finished state; each included operation; colour and finish; moisture basis; geography; reporting period; site and technology coverage; allocation; upstream dataset links; wastewater and waste destinations"
  required_quality_disclosure: "foreground and secondary data shares; measurement and calculation methods; representativeness; missing UUIDs; data gaps; mass and water balances; allocation sensitivity; outsourced operations; emission and treatment coverage; deviations from collection protocols"
  update_trigger: "material change in composition, loom technology, finishing recipe, energy or water supply, treatment system, packaging specification, allocation method, reference-flow identity, official CPC scope, BAT conclusions, or representative reporting period"
