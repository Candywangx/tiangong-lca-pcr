measurement_rules:
  - id: reference_mass
    applies_to: "Reference product and all fibre mass rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report net fibre mass excluding pallets, bags and other packaging. Use the same declared moisture or commercial mass basis for the reference output and all fibre-yield calculations."
  - id: commercial_mass_basis
    applies_to: "Homogeneous single-species fibre consignments"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Declare whether mass is oven-dry, conditioned or commercial mass. ISO 6741-1:1989 may be used for homogeneous consignments of a single generic species; blends or treated materials require a documented applicable method and shall not silently inherit a single-species allowance."
  - id: moisture_conversion
    applies_to: "Conversion between wet, conditioned, commercial and dry mass"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record measured moisture fraction and calculate dry mass as wet mass multiplied by one minus moisture fraction. Any conversion to conditioned or commercial mass shall state the agreed regain or allowance and preserve the unconverted measured mass."
  - id: fibre_identity_and_composition
    applies_to: "Species and composition declaration"
    required_property_ref:
      name: "Composition by mass"
      uuid: ""
    required_unit: "percent by mass"
    rule: "Use supplier traceability and lot records. Where identity or blend composition requires analytical confirmation, apply an appropriate validated method such as ISO 17751-1:2023 or ISO 17751-2:2023 and retain the laboratory report."
  - id: route_specific_yield
    applies_to: "Scouring, dehairing, carding and combing yield"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg/kg"
    rule: "Calculate yield separately for each declared fibre type, received state and route. Do not pool carded and combed campaigns or greasy and already-scoured inputs unless the reported dataset explicitly represents that measured production mix and discloses weighted batch data."
  - id: water_and_energy_units
    applies_to: "Water, electricity, fuel and thermal-energy records"
    required_property_ref:
      name: "Volume, mass or energy as measured"
      uuid: ""
    required_unit: "m3, kg, kWh or MJ"
    rule: "Preserve the metered unit and carrier. Convert only with a documented factor, and keep reused water separate from gross intake so net consumption and wastewater generation remain auditable."
process_map:
  - id: material_receipt_and_route_declaration
    name: "Material receipt and route declaration"
    inclusion: "required"
    inclusion_condition: "Always"
    role: "Establish lot identity, composition, prior state and the route-specific foreground boundary"
    quantitative_reference: "Per received lot and per 1,000 kg reference product"
  - id: scouring_and_dewatering
    name: "Scouring and dewatering"
    inclusion: "conditional"
    inclusion_condition: "Include when the received fibre requires washing, grease or dirt removal, rinsing, mechanical dewatering or wet opening"
    role: "Wet cleaning and separation of fibre, grease, dirt and wastewater"
    quantitative_reference: "Per 1,000 kg fibre input and output for the declared route"
  - id: dehairing_and_opening
    name: "Dehairing and opening"
    inclusion: "conditional"
    inclusion_condition: "Include when guard hair, dust or entangled locks are removed or the fibre is mechanically opened before carding"
    role: "Prepare species- and grade-specific feedstock"
    quantitative_reference: "Per 1,000 kg process output"
  - id: carding
    name: "Carding"
    inclusion: "required"
    inclusion_condition: "Include for carded output and as the preparatory stage of a combed route, unless a documented purchased carded intermediate is the starting condition"
    role: "Open, blend only declared compatible lots, disentangle and form carded fibre or sliver"
    quantitative_reference: "Per 1,000 kg carded process output"
  - id: gilling_and_combing
    name: "Gilling and combing"
    inclusion: "conditional"
    inclusion_condition: "Include only for combed output or documented re-combing"
    role: "Align fibres and remove short fibres and remaining vegetable matter to produce top"
    quantitative_reference: "Per 1,000 kg combed top output"
  - id: optional_fibre_treatments
    name: "Optional fibre treatments"
    inclusion: "conditional"
    inclusion_condition: "Include separately for each carbonising, bleaching, dyeing, shrink-resist, mothproofing or other treatment actually performed before dispatch"
    role: "Product-specific wet or chemical treatment"
    quantitative_reference: "Per 1,000 kg treated fibre output for each treatment"
  - id: drying_conditioning_and_packing
    name: "Drying, conditioning and packing"
    inclusion: "required"
    inclusion_condition: "Conditioning and dispatch mass determination always apply; drying applies only after wet processing; packing applies when product leaves packed"
    role: "Establish final moisture basis, reference mass and factory-gate state"
    quantitative_reference: "Per 1,000 kg reference product"
  - id: onsite_wastewater_and_residue_handling
    name: "Onsite wastewater and residue handling"
    inclusion: "conditional"
    inclusion_condition: "Include when the reporting facility treats wastewater, recovers grease, or handles residues before transfer"
    role: "Recover materials, recycle water where applicable, and document treatment outputs and emissions"
    quantitative_reference: "Per wet-processing campaign and per 1,000 kg fibre input"
