system_boundary:
  rules:
    - rule_id: boundary_route_conditioning
      applies_to: "Process selection"
      rule: "Select processes from the declared fibre type, received state and carded or combed route. Do not apply a category-wide average to materially different species, grades, received states or processing routes."
      source_ids:
        - eu-1007-2011-textile-fibre-names
        - iwto-wool-lca-guidelines-2016
    - rule_id: boundary_primary_processing
      applies_to: "Scouring and topmaking"
      rule: "When performed, include fibre input, packaging, electricity, water, detergents and other chemicals, and outputs of carded or combed fibre, recoverable grease, burrs, noils, sweepings, other wastes, sludge and wastewater."
      source_ids:
        - iwto-wool-lca-guidelines-2016
        - eu-2022-2508-textiles-bat
    - rule_id: boundary_optional_treatments
      applies_to: "Carbonising, bleaching, dyeing, shrink-resist, mothproofing and other treatments"
      rule: "Include a treatment only when performed before the declared factory gate. Record treatment-specific chemicals, water, energy, emissions, wastewater and fibre yield separately and disclose the treatment flag."
      source_ids:
        - iwto-wool-lca-guidelines-2016
        - eu-2022-2508-textiles-bat
    - rule_id: boundary_upstream_burdens
      applies_to: "Purchased fibre and other technosphere inputs"
      rule: "Keep animal husbandry, fibre collection and prior off-site processing in linked upstream datasets. Do not duplicate those burdens in the foreground mill inventory."
      source_ids:
        - iwto-wool-lca-guidelines-2016
    - rule_id: boundary_wastewater_and_residues
      applies_to: "Wet processing and residue management"
      rule: "Include onsite treatment when operated; otherwise record the wastewater or residue quantity and composition sent to the named off-site treatment route. Keep recovered grease, reusable water and organic residues explicit."
      source_ids:
        - eu-2022-2508-textiles-bat
boundary_abstraction:
  declared_starting_condition: "An identifiable received animal-fibre lot before the first process performed by the reporting mill, with species or commercial fibre name, composition, mass basis, moisture, contamination state and prior processing state declared"
  starting_condition_role: "Physical and accounting start of the foreground transformation to the carded or combed product"
  product_classification_scope: "Natural animal textile fibre whose dispatched state is carded or combed and ready for spinning; classification does not replace species, composition or route qualifiers"
  recursive_input_rule: "If an input is already carded or combed and belongs to the same product category, record it as an explicit purchased intermediate with its upstream dataset and model only the incremental transformation; never recreate or hide its prior production in a recursive category average"
  upstream_dataset_requirement: "Link each purchased greasy wool, scoured wool, raw or dehaired animal hair, carded intermediate, process chemical, energy carrier, water supply, packaging material and off-site treatment service to an appropriate geographically and temporally representative upstream dataset"
  disclosure: "Declare included facilities and processes, fibre species and blend, route and optional-treatment flags, received state, mass and moisture basis, allocation method, recovered products, wastes and destinations, wastewater handling, data coverage, exclusions and any proxy datasets"
