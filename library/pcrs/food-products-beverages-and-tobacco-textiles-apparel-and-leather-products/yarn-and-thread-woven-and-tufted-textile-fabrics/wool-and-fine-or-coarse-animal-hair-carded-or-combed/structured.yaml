allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "All foreground processes"
    rule: "Subdivide separately metered processes and keep species-, route- and treatment-specific campaigns separate before applying allocation."
    source_ids:
      - iwto-wool-lca-guidelines-2016
  - rule_id: allocation_scouring_grease
    applies_to: "Clean fibre and recovered grease from scouring"
    rule: "Prefer system separation at the point where grease and dirt are removed. If saleable grease remains a co-product and separation is infeasible, use a documented economic allocation based on representative recent values; disclose price period, geography and sensitivity."
    source_ids:
      - iwto-wool-lca-guidelines-2016
  - rule_id: allocation_noils_and_other_fibre_outputs
    applies_to: "Noils, guard hair and other saleable fibre fractions"
    rule: "First separate directly attributable operations. If multiple saleable fibre outputs remain, allocate residual burdens by a documented physical relationship where it represents causality; otherwise use a justified economic relationship and test sensitivity. Do not classify a saleable output as waste merely to avoid allocation."
    source_ids:
      - iwto-wool-lca-guidelines-2016
  - rule_id: allocation_waste_and_recycling
    applies_to: "Wastes and recovered materials"
    rule: "Assign treatment burdens to the generated waste route. Do not claim substitution or avoided-production credits inside this unit-process dataset unless the selected downstream study method explicitly requires them and reports them separately."
    source_ids: []
  - rule_id: allocation_conservation
    applies_to: "Any allocated process"
    rule: "The sum of allocated inputs, outputs and burdens shall equal the corresponding unallocated totals for each process and reporting campaign."
    source_ids:
      - iwto-wool-lca-guidelines-2016
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipt
      process_id: "material_receipt_and_route_declaration"
      flow_role: "Received, released and rejected fibre lots"
      record_type: "Scale ticket, supplier certificate and lot-routing record"
      raw_fields: "lot_id; supplier_id; species_or_commercial_name; composition_mass_fraction; received_state; treatment_flags; gross_mass; tare_mass; net_mass; moisture_basis; measured_moisture; route_id; upstream_dataset_ref; rejected_mass; rejection_reason"
      collection_method: "Calibrated scale plus supplier and laboratory identity review"
      unit: "kg; percent"
      frequency: "Every lot"
      temporal_coverage: "All lots in the reporting period"
      site_scope: "Every reporting site and outsourced receipt point in scope"
      aggregation_rule: "Sum accepted and rejected mass by homogeneous fibre type, received state and route; no pooling before route-specific yield is retained"
      quality_evidence: "Scale calibration; lot certificate; chain-of-custody record; laboratory report where required"
    - protocol_id: cp_process_mass_balance
      process_id: "scouring_and_dewatering_dehairing_and_opening_carding_gilling_and_combing"
      flow_role: "Fibre inputs, accepted outputs, grease, noils, guard hair and residues"
      record_type: "Batch production and weighing record"
      raw_fields: "campaign_id; route_id; fibre_type; input_mass; output_mass_by_fraction; moisture_basis; measured_moisture; inventory_change; spill_or_unmeasured_loss; destination_by_fraction"
      collection_method: "Calibrated scales and reconciled batch tickets at process boundaries"
      unit: "kg"
      frequency: "Every campaign"
      temporal_coverage: "Representative full reporting year or every campaign for shorter studies"
      site_scope: "Each included line and outsourced process"
      aggregation_rule: "Reconcile on a common dry or declared mass basis by process and route; report weighted production mix only after campaign-level results are retained"
      quality_evidence: "Scale calibration; closed mass-balance worksheet; supervisor sign-off"
    - protocol_id: cp_wet_processing
      process_id: "scouring_and_dewatering_optional_fibre_treatments"
      flow_role: "Gross water intake, recycled water and wet-process operation"
      record_type: "Water meter and batch log"
      raw_fields: "campaign_id; meter_start; meter_end; water_source; recycled_water_volume; bath_volume; operating_time; fibre_input_mass; temperature"
      collection_method: "Calibrated meter readings linked to batch logs"
      unit: "m3; hour; degree C; kg"
      frequency: "Every campaign or continuous meter with monthly reconciliation"
      temporal_coverage: "Full reporting period with seasonal coverage"
      site_scope: "Each wet-processing line"
      aggregation_rule: "Gross intake minus measured same-process recycle gives net intake; keep discharge as a separate balance"
      quality_evidence: "Meter calibration; trend chart; water-balance reconciliation"
    - protocol_id: cp_chemical_use
      process_id: "scouring_and_dewatering_optional_fibre_treatments"
      flow_role: "Detergent and treatment chemical use"
      record_type: "Weighing, dosing and inventory record"
      raw_fields: "campaign_id; product_name; supplier; active_ingredient; concentration; issued_mass_or_volume; returned_mass; treatment_function; safety_classification"
      collection_method: "Calibrated dosing system or stock issue reconciled to inventory"
      unit: "kg; L; percent active"
      frequency: "Every batch with monthly stock reconciliation"
      temporal_coverage: "Full reporting period"
      site_scope: "Each process and contractor in scope"
      aggregation_rule: "Net issued amount by named product and treatment, normalized only after route separation"
      quality_evidence: "Dosing calibration; invoice; stock reconciliation; formulation sheet"
    - protocol_id: cp_energy_use
      process_id: "scouring_and_dewatering_dehairing_and_opening_carding_gilling_and_combing_optional_fibre_treatments_drying_conditioning_and_packing_onsite_wastewater_and_residue_handling"
      flow_role: "Electricity, fuel and purchased heat"
      record_type: "Submeter, utility meter, fuel issue or equipment-time calculation"
      raw_fields: "campaign_id; carrier; meter_start; meter_end; fuel_quantity; heating_value_source; equipment_power; operating_time; allocation_driver"
      collection_method: "Prefer process submeter; otherwise documented calculation with concurrent operating records"
      unit: "kWh; MJ; kg; m3"
      frequency: "Continuous or each campaign, reconciled monthly"
      temporal_coverage: "Full reporting period including seasonal conditions"
      site_scope: "Each included process line"
      aggregation_rule: "Keep carriers separate; allocate shared meters by causal operating time or measured load and disclose residual unallocated use"
      quality_evidence: "Meter calibration; invoices; operating log; allocation worksheet"
    - protocol_id: cp_wastewater_and_emissions
      process_id: "scouring_and_dewatering_optional_fibre_treatments_onsite_wastewater_and_residue_handling"
      flow_role: "Wastewater, sludge, residues and pollutant-specific emissions"
      record_type: "Flow meter, analytical report, waste manifest and treatment log"
      raw_fields: "campaign_id; source_process; gross_discharge_volume; recycle_volume; sampling_time; pollutant_name; concentration; receiving_compartment; treatment_step; sludge_wet_mass; sludge_dry_matter; residue_destination"
      collection_method: "Representative flow-proportional sampling where practicable, calibrated flow measurement, accredited analysis and weighed waste transfer"
      unit: "m3; mg/L; kg; percent dry matter"
      frequency: "Per permit and campaign; at least enough to represent operating variability"
      temporal_coverage: "Full reporting period and abnormal events"
      site_scope: "Each discharge point and treatment unit in scope"
      aggregation_rule: "Calculate pollutant loads separately; reconcile water and residue balances; do not combine different pollutants or destinations"
      quality_evidence: "Laboratory accreditation; chain of custody; meter calibration; permit report; waste manifest"
    - protocol_id: cp_final_product_quality
      process_id: "carding_gilling_and_combing_optional_fibre_treatments_drying_conditioning_and_packing"
      flow_role: "Product mass, fibre identity, composition and quality qualifiers"
      record_type: "Dispatch scale, quality certificate and laboratory result"
      raw_fields: "batch_id; product_form; species_or_commercial_name; composition; route; treatment_flags; net_mass; moisture_basis; measured_moisture; mean_fibre_diameter_or_grade; length_specification; colour; contamination_result"
      collection_method: "Calibrated dispatch scale and applicable textile test methods"
      unit: "kg; percent; micrometre or declared grade; mm"
      frequency: "Every dispatched batch or statistically justified lot plan"
      temporal_coverage: "Full reporting period"
      site_scope: "Each dispatching site"
      aggregation_rule: "Aggregate only conforming batches with compatible qualifiers; retain batch distribution and production-weighted mean"
      quality_evidence: "Scale calibration; certificate of analysis; ISO 17751 report when applied; nonconformance log"
    - protocol_id: cp_packaging_and_dispatch
      process_id: "drying_conditioning_and_packing"
      flow_role: "Packaging and dispatch state"
      record_type: "Packing list and returnable-container register"
      raw_fields: "batch_id; packaging_material; packaging_mass; item_count; unit_mass; reusable_flag; returns; pallet_tare; net_product_mass"
      collection_method: "Weigh representative unit packaging and reconcile to packing issues"
      unit: "kg; item"
      frequency: "Every dispatch batch"
      temporal_coverage: "Full reporting period"
      site_scope: "Each dispatch point"
      aggregation_rule: "Sum packaging by material; subtract tare from reference product; amortize reusable packaging only with documented cycles"
      quality_evidence: "Packing list; tare check; return register"
  calculation_rules:
    - id: calc_net_fibre_mass
      applies_to: "Received and dispatched fibre"
      rule: "net_mass = gross_mass - tare_mass"
      inputs:
        - gross_mass
        - tare_mass
      output: "Net fibre mass on measured basis"
      source_ids:
        - mass-balance-identity
    - id: calc_dry_mass
      applies_to: "Moisture-basis conversion"
      rule: "dry_mass = measured_mass * (1 - moisture_fraction); retain measured mass and moisture result"
      inputs:
        - measured_mass
        - moisture_fraction
      output: "Dry fibre mass"
      source_ids:
        - mass-balance-identity
        - iso-6741-1-1989
    - id: calc_process_yield
      applies_to: "Each scouring, dehairing, carding, combing or treatment route"
      rule: "yield = accepted_output_mass / input_fibre_mass on the same moisture basis, calculated separately by fibre type, route and received state"
      inputs:
        - accepted_output_mass
        - input_fibre_mass
        - moisture_basis
        - route_id
        - fibre_type
      output: "Route-specific yield"
      source_ids:
        - mass-balance-identity
    - id: calc_mass_balance_closure
      applies_to: "Each foreground process"
      rule: "closure = sum(outputs + measured inventory increase) / sum(inputs + measured inventory decrease); investigate the unaccounted difference rather than assigning it automatically to product"
      inputs:
        - input_masses
        - output_masses
        - inventory_change
      output: "Mass-balance closure and unaccounted difference"
      source_ids:
        - mass-balance-identity
    - id: calc_net_water_consumption
      applies_to: "Wet processing"
      rule: "net_water_consumption = gross_water_intake - water_reused_or_recycled_to_the_same_process"
      inputs:
        - gross_water_intake
        - recycled_water_volume
      output: "Net process water consumption"
      source_ids:
        - eu-2022-2508-textiles-bat
        - mass-balance-identity
    - id: calc_pollutant_load
      applies_to: "Wastewater and direct emissions"
      rule: "pollutant_load = matched_flow_volume * pollutant_concentration with unit conversion; use time-weighted integration for variable continuous discharge"
      inputs:
        - discharge_volume
        - concentration
        - sampling_period
        - unit_conversion
      output: "Pollutant-specific mass by receiving compartment"
      source_ids:
        - eu-2022-2508-textiles-bat
    - id: calc_production_mix
      applies_to: "A dataset intentionally representing multiple measured campaigns"
      rule: "production_mix_value = sum(campaign_value * conforming_output_mass) / sum(conforming_output_mass), only after campaign-level fibre, route and treatment qualifiers remain available"
      inputs:
        - campaign_value
        - conforming_output_mass
        - route_id
        - fibre_type
        - treatment_flags
      output: "Disclosed production-weighted mix"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "All fibre inputs and reference outputs"
      requirement: "Identify animal species or accepted commercial fibre name, composition, received state, route and treatment flags; analytical confirmation is required when supplier evidence is insufficient for the study claim."
      evidence: "Supplier certificate, chain-of-custody record, and ISO 17751-1:2023 or ISO 17751-2:2023 laboratory report where applied"
    - id: dq_route_representativeness
      applies_to: "All process and inventory results"
      requirement: "Results shall represent the actual carded or combed route and fibre type. A production mix is allowed only from retained campaign data and disclosed output-mass weighting."
      evidence: "Campaign register, route map and weighted aggregation worksheet"
    - id: dq_temporal_coverage
      applies_to: "Candidate foreground dataset"
      requirement: "Prefer a continuous recent 12-month period covering seasonal and product-mix variability; a shorter period shall include all campaigns in scope and justify representativeness."
      evidence: "Meter coverage report, batch register and gap assessment"
    - id: dq_mass_and_moisture
      applies_to: "Fibre yield and reference amount"
      requirement: "Calibrate scales, state moisture basis, retain moisture tests, and reconcile each process mass balance before normalization."
      evidence: "Calibration certificates, moisture reports and closure worksheets"
    - id: dq_wet_process_coverage
      applies_to: "Scouring and other wet treatments"
      requirement: "Capture water intake, recycle, discharge, chemicals, energy, wastewater parameters and residues for every included wet process."
      evidence: "Water and chemical balances, meters, accredited analysis and waste manifests"
    - id: dq_proxy_disclosure
      applies_to: "Upstream and missing foreground data"
      requirement: "Identify every proxy, geography, year, technology and substitution rationale. Provisional reasoned-estimate ranges are not foreground values and shall be replaced by collected data or reviewed evidence."
      evidence: "Dataset metadata, source register and replacement plan"
    - id: dq_completeness
      applies_to: "Foreground package"
      requirement: "Reconcile included input, product, co-product, waste and elementary-flow records against batch and financial or utility totals; explain exclusions and unaccounted differences."
      evidence: "Completeness checklist and reconciliation signed by data owner"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "Reference flow"
    rule: "Require exact product-flow UUID 7919afd2-a0eb-41f6-a192-705e27597637, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and all required qualifiers."
    source_ids: []
  - rule_id: validation_scope_and_route
    applies_to: "Product identity and process map"
    rule: "Confirm the output is carded or combed natural animal fibre ready for spinning; reject raw, merely scoured, garnetted, yarn, fabric, finished-product and mineral-wool records. Confirm every included process matches the declared received state, fibre type and route."
    source_ids:
      - eu-1007-2011-textile-fibre-names
      - iwto-wool-lca-guidelines-2016
  - rule_id: validation_no_unconditional_average
    applies_to: "Aggregation"
    rule: "Reject a dataset that averages materially different animal species, carded and combed routes, greasy and already-scoured inputs, or optional-treatment states without retained campaign-level results, output-mass weighting and explicit production-mix scope."
    source_ids: []
  - rule_id: validation_mass_basis_and_closure
    applies_to: "Fibre mass and yield"
    rule: "Confirm net mass excludes packaging, input and output use a compatible moisture basis, route yields are calculated separately, and every included process reports mass-balance closure and unaccounted difference."
    source_ids:
      - iso-6741-1-1989
      - mass-balance-identity
  - rule_id: validation_wet_processing
    applies_to: "Scouring and optional wet treatments"
    rule: "When a wet process is included, require gross and recycled water, named chemicals, carrier-specific energy, wastewater volume and handling, measured residues and applicable pollutant-specific records."
    source_ids:
      - eu-2022-2508-textiles-bat
      - iwto-wool-lca-guidelines-2016
  - rule_id: validation_wool_grease_range_applicability
    applies_to: "Recovered wool grease"
    rule: "Apply the 10-15 kg/t coarse-wool and 50-60 kg/t extra- or super-fine-wool BAT-AEPL screens only when raw wool scouring and the stated fibre-diameter condition apply; do not apply them to other animal fibres or treat them as universal yields."
    source_ids:
      - eu-2022-2508-textiles-bat
  - rule_id: validation_allocation
    applies_to: "Co-products and wastes"
    rule: "Require subdivision first, a documented allocation basis where co-products remain, conservation of allocated totals, destinations for all waste fractions, and separate disclosure of any downstream substitution credit."
    source_ids:
      - iwto-wool-lca-guidelines-2016
      - mass-balance-identity
  - rule_id: validation_candidate_ranges
    applies_to: "Provisional screening ranges"
    rule: "Do not use reasoned_estimate ranges as collected foreground values, conformance limits or publication-critical defaults. Require a replacement source or representative foreground distribution before review or publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground unit-process or aggregated gate-to-gate dataset for one declared animal-fibre product, received state, route and treatment state"
  downstream_use: "secondary_dataset; background_dataset after methodology review and with complete upstream links"
  allowed_use: "Construction of process or lifecyclemodel datasets for carded or combed natural animal fibre when the product qualifiers, route, geography, time period, boundary, allocation and data quality match the study"
  excluded_use: "Unqualified category-average modelling across animal species or routes; substitution for greasy or merely scoured wool, garnetted fibre, yarn, fabric, finished textile products, feathers, down or mineral wool; use of reasoned-estimate ranges as measured inventory"
  required_metadata: "Canonical PCR id; reference UUIDs; species or commercial fibre name; blend composition; received state; carded or combed route; product form; grade or mean diameter; length specification; moisture and commercial mass basis; treatment flags; recycled-content flag; geography; reporting period; facility and contractor scope; process map; upstream dataset references; allocation; packaging; data coverage"
  required_quality_disclosure: "Campaign coverage; scale, meter and laboratory evidence; mass- and water-balance closure; route-specific yield distribution; treatment and wastewater coverage; allocation sensitivity; proxies and exclusions; unaccounted differences; all remaining reasoned-estimate ranges and their replacement owners"
  update_trigger: "Change in fibre species or blend, received state, carded or combed route, treatment chemistry, equipment, water recycling, grease recovery, allocation economics, supplier geography, moisture basis or product specification; data older than the representativeness policy; new reviewed source evidence; or availability of foreground data that replaces a provisional range"
data_sources:
  - id: "eu-1007-2011-textile-fibre-names"
    type: "official_guidance"
    reference: "Regulation (EU) No 1007/2011 on textile fibre names and related labelling and marking of fibre composition, Annex I; https://eur-lex.europa.eu/eli/reg/2011/1007/oj; retrieved 2026-08-12"
    used_for: "Animal-fibre names and scope qualifiers for wool, speciality animal hair and other animal or horsehair"
  - id: "eu-2022-2508-textiles-bat"
    type: "official_guidance"
    reference: "Commission Implementing Decision (EU) 2022/2508 establishing BAT conclusions for the textiles industry; ELI http://data.europa.eu/eli/dec_impl/2022/2508/oj; retrieved 2026-08-12"
    used_for: "Wool-scouring boundary, water and grease recovery, energy and residue handling, wet-process monitoring, and fibre-diameter-conditioned grease recovery ranges"
  - id: "iwto-wool-lca-guidelines-2016"
    type: "extension_guidance"
    reference: "International Wool Textile Organisation, Guidelines for conducting a life cycle assessment of the environmental performance of wool textiles, April 2016; https://iwto.org/wp-content/uploads/2020/04/IWTO-Guidelines-for-Wool-LCA.pdf; retrieved 2026-08-12"
    used_for: "Scouring, carding, gilling and combing process decomposition; required inputs and outputs; primary data; co-product and allocation rules"
  - id: "iso-17751-1-2023"
