allocation_rules:
  - rule_id: al_subdivide_first
    applies_to: "Different fibre, weave, and finishing routes"
    rule: "Avoid allocation by separate metering and subdivision before combining production routes."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_internal_reuse
    applies_to: "Returned yarn, fabric, water, size, and heat"
    rule: "Treat internal reuse as an internal loop. Count only make-up inputs and outputs crossing the reporting boundary; do not credit the same loop twice."
    source_ids:
      - eu-txt-bref-2023
      - eu-pef-2021-2279
  - rule_id: al_saleable_outputs
    applies_to: "Saleable downgraded fabric or recovered material"
    rule: "Classify an output as product or waste from its actual function and destination. If a co-product remains, apply a documented causal physical relation; use economic allocation only when no defensible physical relation exists."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_shared_utilities
    applies_to: "Shared meters and support systems"
    rule: "Allocate shared utilities with a documented causal driver such as machine-hours, metered demand, bath volume, or processed mass; report the driver and coverage."
    source_ids:
      - eu-pef-2021-2279
      - kir-et-al-2024-textile-resource-use
  - rule_id: al_waste_treatment
    applies_to: "Textile waste and wastewater"
    rule: "Assign treatment burdens to the generating route by measured residual mass or volume and, when treatment demand differs, a documented pollutant-load driver."
    source_ids:
      - eu-txt-bref-2023
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_weaving
      process_id: "yarn_preparation_weaving"
      flow_role: "Each yarn, sizing substance, water, electricity, greige fabric, waste, PM10"
      record_type: "Lot sheet, issue record, scale, recipe, meter, waste record, emission result"
      raw_fields: "lot_id; fibre_name; yarn_mass; moisture_basis; starch_mass; PVA_mass; water; electricity; greige_mass; waste_mass_by_destination; PM10_load"
      collection_method: "Lot-level weighing and recipe reconciliation with calibrated meters or defensible submeter allocation"
      unit: "kg; kWh"
      frequency: "Each lot; utilities at least shift or monthly with allocation driver"
      temporal_coverage: "At least 12 representative months or every campaign in a shorter production year"
      site_scope: "Each site, loom technology, blend, and sizing route separately"
      aggregation_rule: "Close yarn/material balance before normalization; aggregate only homogeneous routes"
      quality_evidence: "Supplier specification; scale/meter calibration; recipe; production and waste records; laboratory QA"
    - protocol_id: cp_finishing
      process_id: "wet_dry_finishing"
      flow_role: "Fabric, each chemical, water, electricity, steam, gas, output, wastewater, each air emission"
      record_type: "Batch recipe, dosing record, meters, scale, laboratory and discharge record"
      raw_fields: "lot_id; fabric_in; process_sequence; dye_name; chemical_name; formulation_concentration; dose_mass; water; electricity; steam_MJ; gas_m3; fabric_out; wastewater_mass; emission_load_and_method"
      collection_method: "Record each named substance and carrier separately by batch or homogeneous campaign"
      unit: "kg; kWh; MJ; m3"
      frequency: "Each batch; meters at least shift or daily"
      temporal_coverage: "At least 12 representative months including all represented recipes"
      site_scope: "Each site, machine, blend, and recipe separately"
      aggregation_rule: "Reconcile recipe and mass/water balances; normalize only after route completion"
      quality_evidence: "Recipe approval; dosing evidence; meter calibration; laboratory QA; wastewater transfer record"
    - protocol_id: cp_release
      process_id: "inspection_packaging"
      flow_role: "Finished input, accepted product, rejects, electricity, core, film, pallet, packaging wastes"
      record_type: "Roll ticket, inspection result, scale, packaging BOM, meter, waste manifest"
      raw_fields: "lot_id; roll_id; gross_mass; tare; net_mass; width; length; mass_per_area; composition; finish; grade; electricity; core_mass; film_mass; pallet_mass; reuse_cycles; reject_mass; waste_mass_by_destination"
      collection_method: "Weigh every release lot and retain specification and inspection result"
      unit: "kg; m; m2; g/m2; kWh"
      frequency: "Every released lot"
      temporal_coverage: "All released lots in the reporting period"
      site_scope: "Each site and product specification separately"
      aggregation_rule: "Sum accepted net mass and normalize all route totals to it; packaging remains separate"
      quality_evidence: "Calibration; test method; inspection certificate; packaging BOM; manifests"
  calculation_rules:
    - id: cr_route_normalization
      applies_to: "All inventory rows"
      rule: "normalized_amount = homogeneous_route_period_amount / accepted_net_reference_fabric_mass"
      inputs:
        - "route-specific records"
        - "accepted net mass"
      output: "amount per kg reference fabric"
      source_ids:
        - eu-pef-2021-2279
    - id: cr_blend_share
      applies_to: "Fibre composition"
      rule: "fibre_share_i = dry_or_declared_basis_mass_i / sum_of_all_fibre_masses_on_same_basis; retain the original test or supplier result"
      inputs:
        - "fibre masses or composition test"
        - "common moisture basis"
      output: "percent by mass for each named fibre"
      source_ids:
        - un-cpc-3-0-26770
    - id: cr_area_mass_check
      applies_to: "Roll records"
      rule: "calculated_mass = usable_length × usable_width × measured_mass_per_area; compare with net scale mass and investigate differences"
      inputs:
        - length
        - width
        - "g/m2"
        - "scale mass"
      output: "reconciled roll mass"
      source_ids:
        - eu-txt-bref-2023
    - id: cr_process_mass_balance
      applies_to: "Weaving and finishing"
      rule: "Reconcile input fabric/yarn and named substances with product, waste, emissions, wastewater solids, and inventory change on compatible bases; investigate rather than invent a balancing flow."
      inputs:
        - "measured inputs and outputs"
        - "moisture/solids"
      output: "closure and discrepancy"
      source_ids:
        - eu-pef-2021-2279
    - id: cr_water_balance
      applies_to: "Wet processing"
      rule: "fresh_withdrawal + water_in_inputs = wastewater + evaporation + water_in_product_and_waste + inventory_change; report recirculation separately."
      inputs:
        - "measured water terms"
      output: "reconciled water balance"
      source_ids:
        - eu-txt-bref-2023
    - id: cr_shared_utility
      applies_to: "Shared meters"
      rule: "route_utility = metered_total × documented_causal_driver_share; retain total, driver, and coverage."
      inputs:
        - "meter total"
        - "route driver"
      output: "route-specific utility amount"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Reference product"
      requirement: "Link each released roll to fibre identities and percentages, yarn lots, weave, wet-processing recipe, finish, quality result, moisture basis, and packaging state."
      evidence: "Lot genealogy and release certificate"
    - id: dq_route_representativeness
      applies_to: "Technology and blend"
      requirement: "Keep route-specific records and report production shares, machine coverage, downtime, rejected lots, and excluded sites."
      evidence: "Production ledger, machine register, coverage calculation"
    - id: dq_temporal_coverage
      applies_to: "Foreground period"
      requirement: "Use at least 12 representative months for continuous production or all represented campaigns for seasonal/short-run production; disclose deviations."
      evidence: "Dated raw records and coverage statement"
    - id: dq_meter_recipe_quality
      applies_to: "Utilities and chemicals"
      requirement: "Retain calibration, recipe revision, formulation concentration, dosing evidence, allocation driver, and data-gap treatment."
      evidence: "Calibration, invoices, batch sheets, dosing and meter records"
    - id: dq_mass_water_closure
      applies_to: "Each route"
      requirement: "Report mass- and water-balance closure and investigate material discrepancies without inventing balancing exchanges."
      evidence: "Reconciliation workbook and investigation record"
    - id: dq_no_universal_range
      applies_to: "All amounts"
      requirement: "Do not substitute wool-only, synthetic-only, or cross-facility literature values as a CPC 26770 default. Use foreground records unless a reviewed blend- and route-specific quantitative source is added."
      evidence: "Source applicability review and foreground records"
    - id: dq_uuid_resolution
      applies_to: "Unresolved inventory identities"
      requirement: "Before publication, resolve an exact Tiangong flow or retain a documented blocking review item; never attach a semantically broader candidate UUID."
      evidence: "Hybrid-search candidate record and deterministic direct-read review"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "Require product UUID dad59cf0-4b5e-4f0a-ae44-00f1b0587dfb, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and exactly 1 kg net output."
    source_ids:
      - un-cpc-3-0-26770
  - rule_id: val_cpc_composition
    applies_to: "Product classification"
    rule: "Require man-made staple fibres below 85% by mass and wool or named fine animal hair as the principal or sole blend partner; reject a missing or contradictory composition."
    source_ids:
      - un-cpc-3-0-26770
  - rule_id: val_woven_scope
    applies_to: "Product form"
    rule: "Reject knitted, crocheted, nonwoven, carpet, pile, special, garment, or yarn products and reject a fabric route whose weaving evidence is absent."
    source_ids:
      - un-cpc-3-0-26770
      - eu-txt-bref-2023
  - rule_id: val_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Fail completeness when any required qualifier in Section 3 is absent."
    source_ids:
      - un-cpc-3-0-26770
      - eu-txt-bref-2023
  - rule_id: val_atomic_inventory
    applies_to: "Inventory"
    rule: "Require separate rows for each fibre/yarn, sizing substance, dye, auxiliary, energy carrier, packaging material, waste, and elementary emission actually used or released."
    source_ids:
      - eu-txt-bref-2023
  - rule_id: val_route_records
    applies_to: "Foreground amounts"
    rule: "Reject an AI-generated or universal literature amount substituted for missing route records; require measured or documented calculated foreground evidence."
    source_ids:
      - kir-et-al-2024-textile-resource-use
      - eu-pef-2021-2279
  - rule_id: val_balance_and_allocation
    applies_to: "Mass, water, and shared burdens"
    rule: "Require reported mass/water reconciliation, internal-loop treatment, and documented allocation drivers; fail silent double counting or unexplained imbalance."
    source_ids:
      - eu-txt-bref-2023
      - eu-pef-2021-2279
  - rule_id: val_waste_destination
    applies_to: "Residuals"
    rule: "Require one named destination and representative treatment dataset for every exported waste and wastewater row."
    source_ids:
      - eu-txt-bref-2023
published_dataset_profile:
  dataset_role: "Foreground production dataset that may be published as a secondary_dataset or background_dataset after review"
  downstream_use: "Fabric inputs to apparel, furnishing, technical-textile, process, and lifecyclemodel studies requiring a CPC 26770 manufacturing-gate dataset"
  allowed_use: "The declared fibre blend, weave, finishing route, geography, technology, year, quality specification, and boundary represented by the dataset"
  excluded_use: "Another fibre composition, knitted/nonwoven product, garment, generic textile proxy, use phase, or end-of-life model without explicit adaptation"
  required_metadata: "All Section 3 qualifiers; site and period; process coverage; upstream dataset references; treatment destinations; allocation; data owner; review status"
  required_quality_disclosure: "Raw-record coverage, measured versus calculated shares, route shares, mass/water closure, meter and recipe QA, unresolved UUIDs, data gaps, uncertainty, and source limitations"
  update_trigger: "Change in blend, yarn source, weave, sizing, dye recipe, finishing technology, energy/water system, wastewater destination, packaging, geography, reporting year, or evidence that materially changes representativeness"
data_sources:
  - id: "un-cpc-3-0-26770"
    type: "official_guidance"
    reference: "United Nations Statistics Division. *Central Product Classification (CPC) Version 3.0, Explanatory Notes*, code 26770, 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
