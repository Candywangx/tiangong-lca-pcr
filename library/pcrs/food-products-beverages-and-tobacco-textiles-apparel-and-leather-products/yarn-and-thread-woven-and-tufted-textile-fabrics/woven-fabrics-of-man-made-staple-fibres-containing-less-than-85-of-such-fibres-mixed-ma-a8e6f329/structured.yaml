system_boundary:
  rules:
    - rule_id: sb_route_separation
      applies_to: "Fibre blend and manufacturing route"
      rule: "Model each homogeneous fibre blend, weave, sizing route, and finishing route separately; aggregate only after route inventories are complete and production shares are documented."
