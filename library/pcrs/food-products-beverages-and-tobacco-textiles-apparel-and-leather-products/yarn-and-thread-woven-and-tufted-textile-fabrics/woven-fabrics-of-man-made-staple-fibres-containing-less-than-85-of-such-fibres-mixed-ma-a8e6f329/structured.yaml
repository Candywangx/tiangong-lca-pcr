        - un-cpc-3-0-26770
        - eu-txt-bref-2023
    - rule_id: sb_required_operations
      applies_to: "Foreground site"
      rule: "Include yarn preparation, warping, applicable sizing, weaving, applicable wet/dry finishing, inspection, packaging, site-attributable utilities, direct emissions, textile wastes, and wastewater."
      source_ids:
        - eu-txt-bref-2023
    - rule_id: sb_wool_sensitive_dyeing
      applies_to: "Polyester/wool and polyamide/wool routes"
      rule: "Preserve the actual one-bath or two-bath sequence and wool-protection conditions; do not substitute a generic high-temperature synthetic-fibre dyeing route."
      source_ids:
        - eu-txt-bref-2023
    - rule_id: sb_residual_destination
      applies_to: "Waste and wastewater"
      rule: "Link each exported textile waste, packaging waste, and wastewater to its actual treatment destination. Include on-site treatment as a separately measured foreground process when operated by the reporting site."
      source_ids:
        - eu-txt-bref-2023
    - rule_id: sb_downstream_exclusion
      applies_to: "Reference product"
      rule: "Exclude garment manufacture, distribution, use, maintenance, and end of life from the default foreground boundary."
      source_ids:
        - un-cpc-3-0-26770
        - eu-pef-2021-2279
