allocation_rules:
  - rule_id: allocation_avoid_subdivision
    applies_to: "Multi-product site operations"
    rule: "First use process subdivision, route-specific batch records, and dedicated meters or issue records to avoid allocation between pile fabric, chenille fabric, and other textile products."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022
  - rule_id: allocation_shared_utilities
    applies_to: "Shared electricity, steam, water, and treatment systems"
    rule: "When subdivision is not practicable, allocate each shared exchange using a documented physical driver that reflects causality, such as metered machine time, steam demand, bath volume, or treated wastewater volume; do not use revenue unless physical relationships cannot reasonably be established."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022
  - rule_id: allocation_reuse_and_recovery
    applies_to: "Internally reused yarn, water, bath liquor, or recovered material"
    rule: "Record the internal loop once and report only make-up input and material that leaves the foreground boundary; disclose any burden transfer or credit for exported recovered material and apply it consistently."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_issue_records
      process_id: "yarn_preparation_and_weaving"
      flow_role: "Each cotton yarn input separately"
      record_type: "batch issue and return record"
      raw_fields: "material_id; supplier; fibre_composition; yarn_specification; issued_mass; returned_mass; moisture_basis; batch_id"
      collection_method: "calibrated scale plus inventory issue/return record"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "full reporting period"
      site_scope: "all foreground looms and preparation lines"
      aggregation_rule: "sum issued minus returned mass by row_id and batch"
      quality_evidence: "scale calibration; signed issue record; stock reconciliation"
    - protocol_id: cp_chemical_dosing_records
      process_id: "yarn_preparation_and_weaving_wet_processing"
      flow_role: "Each formulated product or chemical separately"
      record_type: "recipe and dosing log"
      raw_fields: "chemical_id; supplier; formulation_or_grade; concentration; batch_id; gross_dose; active_mass_if_available; returned_mass"
      collection_method: "calibrated dosing system or weighed issue record"
      unit: "kg"
      frequency: "each recipe batch"
      temporal_coverage: "full reporting period"
      site_scope: "all on-site sizing and wet-processing lines"
      aggregation_rule: "sum net dose by row_id; retain gross and active mass bases"
      quality_evidence: "dosing calibration; recipe approval; purchase reconciliation"
    - protocol_id: cp_water_meter_records
      process_id: "yarn_preparation_and_weaving_wet_processing"
      flow_role: "Process water exchange"
      record_type: "meter and batch log"
      raw_fields: "meter_id; opening_reading; closing_reading; batch_id; reused_volume; source"
      collection_method: "calibrated meter or verified tank-volume measurement"
      unit: "m3"
      frequency: "each batch or daily meter interval"
      temporal_coverage: "full reporting period"
      site_scope: "all included process water points"
      aggregation_rule: "assign metered make-up volume to batches; disclose shared-meter allocation"
      quality_evidence: "meter calibration; water balance; exception log"
    - protocol_id: cp_energy_meter_records
      process_id: "all"
      flow_role: "Each electricity or purchased-steam exchange separately"
      record_type: "submeter, invoice, and operating log"
      raw_fields: "utility_type; meter_id; opening_reading; closing_reading; native_unit; pressure_or_voltage; batch_id; machine_hours"
      collection_method: "calibrated submeter preferred; invoice reconciled to documented physical allocation otherwise"
      unit: "kWh or MJ"
      frequency: "each batch or monthly with batch allocation"
      temporal_coverage: "full reporting period"
      site_scope: "all included equipment and purchased utilities"
      aggregation_rule: "convert native units under measurement rules and aggregate by row_id"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_intermediate_input_records
      process_id: "wet_processing_finishing_inspection_and_packing"
      flow_role: "Each route-specific intermediate input"
      record_type: "batch transfer record"
      raw_fields: "row_id; batch_id; route; finish_state; gross_mass; moisture_basis"
      collection_method: "calibrated scale at process transfer"
      unit: "kg"
      frequency: "each batch transfer"
      temporal_coverage: "full reporting period"
      site_scope: "all included route transfers"
      aggregation_rule: "sum by row_id and receiving process"
      quality_evidence: "scale calibration; linked upstream batch id"
    - protocol_id: cp_intermediate_output_records
      process_id: "yarn_preparation_and_weaving_wet_processing"
      flow_role: "Each route-specific intermediate output"
      record_type: "batch completion record"
      raw_fields: "row_id; batch_id; route; finish_state; accepted_mass; recoverable_mass; moisture_basis"
      collection_method: "calibrated scale at process completion"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "full reporting period"
      site_scope: "all included route outputs"
      aggregation_rule: "sum accepted plus recoverable mass by row_id"
      quality_evidence: "scale calibration; batch release record; mass-balance review"
    - protocol_id: cp_wastewater_records
      process_id: "yarn_preparation_and_weaving_wet_processing"
      flow_role: "Each wastewater or segregated spent-bath exchange separately"
      record_type: "flow meter and treatment transfer record"
      raw_fields: "row_id; batch_id; volume; pH; temperature; conductivity; destination; reused_volume"
      collection_method: "calibrated flow meter or verified tank-volume measurement"
      unit: "m3"
      frequency: "continuous/daily and by segregated transfer"
      temporal_coverage: "full reporting period"
      site_scope: "all included discharge and segregated-bath points"
      aggregation_rule: "sum net discharged volume by row_id; prevent overlap between segregated bath and combined wastewater"
      quality_evidence: "meter calibration; wastewater balance; laboratory record where applicable"
    - protocol_id: cp_waste_mass_records
      process_id: "yarn_preparation_and_weaving_finishing_inspection_and_packing"
      flow_role: "Each solid waste exchange separately"
      record_type: "weigh ticket and destination record"
      raw_fields: "row_id; batch_or_period; gross_mass; tare; net_mass; destination; rework_return"
      collection_method: "calibrated scale or contractor weigh ticket"
      unit: "kg"
      frequency: "each removal"
      temporal_coverage: "full reporting period"
      site_scope: "all included waste collection points"
      aggregation_rule: "sum net mass by row_id and destination; exclude rework returned to production"
      quality_evidence: "scale calibration; transfer note; contractor receipt"
    - protocol_id: cp_packaging_issue_records
      process_id: "finishing_inspection_and_packing"
      flow_role: "Each packaging component separately"
      record_type: "purchase, stock, and roll-packing record"
      raw_fields: "row_id; packaging_specification; opening_stock; receipts; closing_stock; roll_count; issued_mass"
      collection_method: "direct weighing or stock reconciliation"
      unit: "kg"
      frequency: "each packing batch and period reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "all finished rolls in scope"
      aggregation_rule: "sum net issued mass by row_id and reconcile to dispatched rolls"
      quality_evidence: "purchase record; stock count; representative component weighing"
    - protocol_id: cp_reference_output_records
      process_id: "finishing_inspection_and_packing"
      flow_role: "Accepted finished fabric reference output"
      record_type: "quality release and dispatch mass record"
      raw_fields: "batch_id; route; product_specification; gross_roll_mass; core_mass; wrapping_mass; net_fabric_mass; moisture_basis; accepted_status"
      collection_method: "calibrated roll scale with packaging deductions and quality release"
      unit: "kg"
      frequency: "each finished roll or batch"
      temporal_coverage: "full reporting period"
      site_scope: "all conforming product dispatched from the site"
      aggregation_rule: "sum accepted net fabric mass and normalize exchanges by calc_reference_normalization"
      quality_evidence: "scale calibration; packing record; quality certificate; dispatch reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory exchanges"
      rule: "normalized_exchange = recorded_exchange / accepted_net_finished_fabric_mass; the denominator excludes packaging and rejected fabric"
      inputs:
        - "row-level foreground record"
        - "accepted net finished fabric mass"
      output: "exchange amount per 1 kg reference product"
      source_ids:
        - iso-14044-2006
    - id: calc_net_fabric_mass
      applies_to: "Reference output"
      rule: "net_fabric_mass = gross_roll_mass - paperboard_core_mass - wrapping_film_mass - other separately recorded packaging mass"
      inputs:
        - "gross roll mass"
        - "packaging component masses"
      output: "accepted net finished fabric mass"
      source_ids:
        - iso-14044-2006
    - id: calc_active_chemical_disclosure
      applies_to: "Concentration-bearing chemical inputs"
      rule: "active_mass = gross_solution_mass × recorded mass fraction; retain gross solution mass as the inventory exchange unless the linked flow identity explicitly represents active substance"
      inputs:
        - "gross dose"
        - concentration
      output: "active mass disclosure and gross purchased-product exchange"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_shared_utility_allocation
      applies_to: "Shared utility meters"
      rule: "assigned_exchange = metered_period_total × documented_physical_driver_for_batch / sum_of_driver_for_all_products_in_period"
      inputs:
        - "meter total"
        - "batch machine time"
        - "steam demand"
        - "or bath volume"
      output: "utility amount assigned to each row_id and batch"
      source_ids:
        - iso-14044-2006
        - eu-textiles-bat-2022
    - id: calc_process_mass_balance
      applies_to: "Each process and route"
      rule: "reconcile measured product inputs against product outputs, separately recorded wastes, inventory change, retained moisture change, and documented losses; investigate rather than force-close unexplained differences"
      inputs:
        - input
        - output
        - waste
        - stock
        - "and moisture records"
      output: "mass-balance discrepancy and review flag"
      source_ids:
        - eu-textiles-bat-2022
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and intermediates"
      requirement: "Retain pile-versus-chenille route, cotton composition, construction, width, areal mass, finish state, moisture basis, grade, and batch linkage."
      evidence: "product specification; quality release; batch traveller"
    - id: dq_temporal_coverage
      applies_to: "All foreground records"
      requirement: "Cover a representative continuous reporting period and disclose shutdowns, changeovers, abnormal operation, missing intervals, and outsourced steps."
      evidence: "reporting calendar; operating log; exception register"
    - id: dq_measurement
      applies_to: "Mass, water, electricity, steam, and dosing records"
      requirement: "Use calibrated instruments where practicable; record native units, calibration status, estimation method, and shared-meter allocation."
      evidence: "calibration certificate; meter log; invoice reconciliation; allocation worksheet"
    - id: dq_completeness
      applies_to: "Process inventory"
      requirement: "Reconcile yarns, chemicals, water, energy, intermediate products, reference product, wastewater, and each solid waste exchange at process level; explain omissions and mass-balance discrepancies."
      evidence: "input-output inventory; mass balance; omission register"
    - id: dq_wastewater_characterization
      applies_to: "Wet-processing wastewater"
      requirement: "Retain discharge route and the parameters relevant to the actual recipe and permit, including flow and applicable pH, temperature, conductivity, pollutant, and treatment information."
      evidence: "flow record; laboratory report; treatment transfer record; permit applicability review"
    - id: dq_source_lineage
      applies_to: "Calculated and allocated values"
      requirement: "Preserve raw records, formula version, source row_ids, allocation driver, operator, and calculation timestamp so every normalized value can be reproduced."
      evidence: "calculation workbook or machine-readable transformation log"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm the reference output uses the exact public CPC 26810 product-flow UUID, Mass property UUID, kg unit, and all required product qualifiers; reject packaging-inclusive reference mass."
    source_ids:
      - unsd-cpc-v3-2025
  - rule_id: validate_route_exclusivity
    applies_to: "Route-specific rows"
    rule: "For each batch, require exactly one construction route (woven pile or chenille) and one finishing input state (greige direct-finishing or wet-processed); reject simultaneous alternative intermediate inputs unless separate batch outputs are modelled."
    source_ids:
      - jrc-textiles-bref-2023
  - rule_id: validate_atomic_exchanges
    applies_to: "Process inventory"
    rule: "Require every card to represent one product, waste, or elementary exchange; reject combined utilities, combined chemicals, combined packaging, combined wastes, or selector instructions."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_wet_processing
    applies_to: "Conditional wet-processing process"
    rule: "If wet processing occurs on site, require process water, each actual chemical formulation, electricity, heat source, output fabric, wastewater, and separately collected bath records as applicable; if outsourced or absent, require disclosure and linked supplier data."
    source_ids:
      - jrc-textiles-bref-2023
      - eu-textiles-bat-2022
  - rule_id: validate_mass_balance
    applies_to: "Each process and reporting period"
    rule: "Require a documented mass-balance review and investigate unexplained discrepancies; do not invent a balancing flow or overwrite measured foreground records."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_allocation_and_completeness
    applies_to: "Shared operations"
    rule: "Confirm subdivision was attempted first, every remaining allocation uses a disclosed physical driver, and collected exchange totals reconcile to site meters, purchases, production, discharge, and waste records."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for finished woven cotton pile fabric or cotton chenille fabric at the plant gate"
  downstream_use: "secondary_dataset; background_dataset when reviewed for representativeness and linked upstream datasets"
  allowed_use: "Product-specific or route-specific LCI studies whose geography, technology, finish state, moisture basis, and reporting period are compatible with the dataset metadata"
  excluded_use: "Terry towelling, narrow fabrics, tufted fabrics, man-made-fibre pile or chenille fabrics, made-up articles, or cradle-to-grave claims without added upstream and downstream stages"
  required_metadata: "PCR id; dataset version; site geography; reporting period; pile-versus-chenille route; cotton composition; construction; width; areal mass; finish state; moisture basis; quality grade; included and outsourced processes; allocation drivers; upstream dataset references"
  required_quality_disclosure: "Foreground share; primary-data period; meter and scale coverage; chemical recipe coverage; mass-balance discrepancy; missing data; estimation and allocation methods; wastewater route; waste destinations; UUID gaps; source versions"
  update_trigger: "Material change in yarn composition, construction route, loom or finishing technology, wet-processing recipe, site utility supply, wastewater treatment, allocation method, product specification, or data older than the declared representativeness period"
