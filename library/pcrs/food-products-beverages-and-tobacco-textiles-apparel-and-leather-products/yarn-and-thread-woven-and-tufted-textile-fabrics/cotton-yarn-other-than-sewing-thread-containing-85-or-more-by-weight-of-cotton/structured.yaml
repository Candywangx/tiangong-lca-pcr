allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "multifunctional_foreground_processes"
    rule: "First avoid allocation by subdividing processes, using product-specific bills of material, submeters, production counters, and separately measured waste or recovered-fibre streams."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "shared_operations"
    rule: "Where subdivision is not possible, allocate shared electricity, utilities and auxiliaries using a documented causal physical driver such as machine operating time, spindle-hours, air volume, or mass throughput."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residual
    applies_to: "saleable_recovered_material"
    rule: "If a recovered fibre or yarn stream leaves as a co-product, document the waste/co-product decision and first test a relevant physical relationship; if none is defensible, use contemporaneous economic value and report the prices and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_internal_recycling
    applies_to: "internal_returns"
    rule: "Track internally returned fibre, pneumafil, yarn ends and rework as internal loops; do not count them both as a new external input and an external co-product. Attribute collection and reprocessing burdens to the process that performs them."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_and_composition
      process_id: "fibre_preparation"
      flow_role: "received cotton and non-cotton fibre"
      record_type: "weighbridge/scale tickets, goods receipt, supplier specification, lot test"
      raw_fields: "lot_id; fibre_type; supplier; gross_mass; tare_mass; net_mass; moisture_or_regain; cotton_fraction; recycled_fraction"
      collection_method: "Calibrated mass measurement plus composition certificate or laboratory test"
      unit: "kg; mass fraction"
      frequency: "Every receipt and lot"
      temporal_coverage: "Complete representative production period, normally at least 12 consecutive months or justified campaign"
      site_scope: "All included mills and fibre lots"
      aggregation_rule: "Sum accepted net mass by fibre type; convert to common moisture basis; allocate to product lot by traceable issue records"
      quality_evidence: "Scale calibration; certificates; laboratory method; rejected-lot log"
    - protocol_id: cp_intermediate_and_output_mass
      process_id: "fibre_preparation_yarn_formation_winding_packaging"
      flow_role: "internal intermediates and conforming yarn"
      record_type: "production counters, calibrated scales, lot release records"
      raw_fields: "lot_id; process_id; input_mass; output_mass; moisture_basis; yarn_count; quality_status; timestamp"
      collection_method: "Calibrated mass measurement at process transfer and final release"
      unit: "kg"
      frequency: "Each lot or shift"
      temporal_coverage: "Same period as input and utility records"
      site_scope: "All included production lines"
      aggregation_rule: "Sum conforming transfers; exclude rework until released; normalize by final net reference yarn"
      quality_evidence: "Calibration; lot genealogy; release test; stock reconciliation"
    - protocol_id: cp_energy_and_utility_records
      process_id: "fibre_preparation_yarn_formation_winding_packaging"
      flow_role: "electricity, water, steam and conditioning utilities"
      record_type: "submeters, main meters, invoices, equipment runtime"
      raw_fields: "meter_id; opening_reading; closing_reading; unit; process_area; runtime; production_mass; allocation_driver"
      collection_method: "Prefer submetering; otherwise reconcile main meter and allocate using documented causal driver"
      unit: "kWh; MJ; kg; m3"
      frequency: "Meter interval no longer than monthly; production counters by shift or lot"
      temporal_coverage: "Same representative production period as output"
      site_scope: "All included process areas and shared utilities"
      aggregation_rule: "Consumption equals closing minus opening plus adjustments; subtract measured exports/recovery; allocate shared use once"
      quality_evidence: "Meter calibration; invoices; reconciliation; allocation worksheet"
    - protocol_id: cp_auxiliary_and_packaging_records
      process_id: "yarn_formation_winding_packaging"
      flow_role: "lubricants, conditioning agents and packaging"
      record_type: "purchase, stock, issue and return records; formulation and safety data"
      raw_fields: "product_id; function; opening_stock; purchases; closing_stock; returns; lot_issue; material; reusable_count"
      collection_method: "Mass balance of stock and lot issues with formulation identity retained"
      unit: "kg"
      frequency: "Monthly and by product campaign"
      temporal_coverage: "Same representative production period as output"
      site_scope: "All included mills and package configurations"
      aggregation_rule: "Opening stock plus purchases minus closing stock and returns; allocate by recorded issue or causal production driver"
      quality_evidence: "Inventory reconciliation; supplier specification; package bill of material"
    - protocol_id: cp_waste_and_recovery_records
      process_id: "fibre_preparation_yarn_formation_winding_packaging"
      flow_role: "fibre, yarn, dust and packaging waste or recovery"
      record_type: "calibrated waste scales, transfer notes, recycler receipts, disposal manifests"
      raw_fields: "waste_id; material; source_process; gross_mass; tare_mass; destination; internal_return; sale_status; moisture_basis"
      collection_method: "Weigh each container or documented batch and reconcile internal returns"
      unit: "kg"
      frequency: "Each transfer, aggregated monthly"
      temporal_coverage: "Same representative production period as output"
      site_scope: "All included mills and waste destinations"
      aggregation_rule: "Sum by material and fate; exclude internal return from external output; normalize to process output and reference yarn"
      quality_evidence: "Scale calibration; signed transfer note; recycler/disposal evidence"
    - protocol_id: cp_direct_emissions
      process_id: "fibre_preparation_yarn_formation"
      flow_role: "particulate and other direct releases"
      record_type: "stack or workplace exhaust tests, continuous monitors, exhaust-flow records"
      raw_fields: "source_id; pollutant; concentration; exhaust_volume; operating_hours; abatement_status; detection_limit"
      collection_method: "Direct measurement or concentration-times-volume calculation using representative operation"
      unit: "kg; mg/m3; m3"
      frequency: "Permit/test frequency and after material process change"
      temporal_coverage: "Representative operation within reporting period"
      site_scope: "Every direct emission source in the foreground boundary"
      aggregation_rule: "Integrate measured concentration and flow; subtract no captured mass unless separately measured; normalize to process output"
      quality_evidence: "Laboratory accreditation; instrument calibration; sampling plan; detection-limit treatment"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground inventory rows"
      rule: "Normalized amount = period or lot amount / net conforming reference-yarn mass from the same scope and period."
      inputs:
        - "Collected activity amount"
        - "net conforming yarn mass"
      output: "Amount per 1 kg reference yarn"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_cotton_fraction
      applies_to: "Product composition"
      rule: "Cotton fraction = cotton fibre mass in released yarn / total textile-fibre mass in released yarn; result shall be at least 0.85."
      inputs:
        - "Composition test or traceable fibre bill of material corrected for measured losses"
      output: "Cotton mass fraction and pass/fail"
      source_ids:
        - un-cpc-ver-3-2025
    - id: calc_fibre_balance
      applies_to: "Foreground fibre system"
      rule: "Received fibre + opening stock = conforming yarn + external recovered material + disposed waste + measured direct mass emissions + samples + closing stock; reconcile on the common moisture basis."
      inputs:
        - "Fibre receipts"
        - stock
        - output
        - waste
        - emissions
        - samples
        - "moisture data"
      output: "Mass-balance residual and uncertainty statement"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_shared_utility
      applies_to: "Shared utilities"
      rule: "Allocate only the residual shared quantity after direct submetering, using the declared causal driver; allocated totals shall equal the reconciled shared-meter total."
      inputs:
        - "Main and submeter records"
        - "driver quantities"
      output: "Utility amount by process and product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_direct_emission
      applies_to: "Measured exhaust releases"
      rule: "Emitted mass = representative concentration multiplied by corrected exhaust volume over operating time; report non-detect treatment and abatement state."
      inputs:
        - Concentration
        - flow
        - time
        - "detection limit"
      output: "kg pollutant per process output"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and inputs"
      requirement: "Preserve UUID-bearing reference identity, product composition, yarn count, spinning route, finish and moisture qualifiers for every released product dataset."
      evidence: "UUID references; lot specification; release record"
    - id: dq_temporal
      applies_to: "Foreground activity data"
      requirement: "Use one consistent representative period for inputs, utilities, production, waste and emissions; normally cover at least 12 consecutive months or justify a shorter campaign."
      evidence: "Meter dates; production calendar; campaign rationale"
    - id: dq_technological
      applies_to: "Process coverage"
      requirement: "Match records to the actual opening, carding, optional combing, drawing, roving/spinning, twisting, winding and conditioning technology used."
      evidence: "Process flow diagram; equipment list; route declaration"
    - id: dq_geographical
      applies_to: "Site and upstream links"
      requirement: "Identify each production site and choose upstream datasets representative of the disclosed geography; document proxies."
      evidence: "Site register; supplier origin; dataset metadata"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Reconcile fibre mass and site utilities, account for all known waste destinations and direct releases, and list every excluded activity or unresolved dataset."
      evidence: "Mass/energy reconciliation; waste manifests; emission inventory; gap log"
    - id: dq_precision
      applies_to: "Measurements and calculations"
      requirement: "Retain calibration, sampling, allocation drivers, detection-limit treatment and uncertainty information sufficient to reproduce normalized values."
      evidence: "Calibration certificates; sampling plan; calculation workbook"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference_flow"
    rule: "The reference output shall use product flow UUID 526fe0a1-be6d-4384-b609-4ca604628ec4, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and exactly 1 kg net yarn."
    source_ids: []
  - rule_id: val_product_scope
    applies_to: "product_identity"
    rule: "Confirm the product is not sewing thread, contains at least 85% cotton by textile-fibre mass, and is greige unless separately linked wet-treatment processes are present."
    source_ids:
      - un-cpc-ver-3-2025
  - rule_id: val_route_coverage
    applies_to: "process_inventory"
    rule: "Confirm opening/cleaning/blending, carding/drawing, spinning and winding are represented; record whether combing, roving, twisting, conditioning and packaging are applicable and included."
    source_ids:
      - eu-jrc-txt-bref-2023
  - rule_id: val_mass_balance
    applies_to: "fibre_inventory"
    rule: "Reconcile fibre inputs, internal returns, conforming yarn, recovered material, waste, dust, samples and stock change on one moisture basis; investigate residuals outside declared measurement uncertainty."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_energy_completeness
    applies_to: "electricity_and_utilities"
    rule: "Reconcile submetered and allocated electricity and utilities to site totals for the same period, with no double allocation of shared services."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_allocation
    applies_to: "multifunctionality"
    rule: "Verify subdivision was considered first, each remaining allocation driver is causal and reproducible, and co-product or waste status plus sensitivity is disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_provisional_ranges
    applies_to: "amount_ranges"
    rule: "Treat every reasoned_estimate range as a replaceable candidate screening range, never as evidence that foreground data are typical or conforming."
    source_ids: []
  - rule_id: val_completeness_disclosure
    applies_to: "dataset_release"
    rule: "List checks performed, checks skipped, unresolved UUIDs, proxy datasets, exclusions, data-quality limitations and all required qualifiers before guidance or publication."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Site- and product-specific foreground manufacturing dataset for greige cotton yarn at the spinning-mill gate"
  downstream_use: "May be linked as a secondary_dataset or background_dataset for fabric, apparel and other textile product systems after review"
  allowed_use: "Gate-to-gate cotton-yarn manufacturing inventories and downstream models that preserve the declared composition, route, moisture and geography"
  excluded_use: "Full cradle-to-gate claim without upstream fibre and energy datasets; sewing thread; yarn below 85% cotton; dyed, bleached, mercerised, coated or other wet-finished yarn not separately modelled"
  required_metadata: "PCR id; product flow UUID; cotton and non-cotton composition; yarn count; spinning system; carded/combed state; ply and twist; finish; moisture basis; recycled content; site; geography; period; process coverage; allocation; packaging"
  required_quality_disclosure: "Foreground data coverage; meter and scale reconciliation; mass-balance residual; allocation drivers; waste destinations; direct-emission method; proxy datasets; reasoned estimates; excluded and skipped checks"
  update_trigger: "Material change in fibre composition, yarn count family, spinning technology, combing/roving route, site energy supply, auxiliary formulation, package design, allocation, production site, or representative data period"
