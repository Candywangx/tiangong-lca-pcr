allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "foreground_processes"
    rule: "Avoid allocation by separately metering warping/weaving and wet-processing operations and by treating integrated intermediate fabric as an internal transfer."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_shared_utilities
    applies_to: "shared_site_utilities"
    rule: "Allocate a shared meter only with a documented causal parameter such as measured operating time and demand, steam enthalpy and mass, or metered water use; disclose the parameter and reconciliation."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022
  - rule_id: allocation_recovered_material
    applies_to: "recovered_silk_and_sizing_material"
    rule: "Report recovered silk, sizing material, and other recovered outputs separately. Do not subtract them from gross inputs or assign an avoided burden unless the downstream study declares and justifies that allocation method."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022
  - rule_id: allocation_unavoidable
    applies_to: "residual_multioutput_process"
    rule: "If subdivision or a physical causal relation is not practicable, disclose the selected allocation basis, affected flows, and sensitivity; this PCR supplies no default economic factor."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_warp_weave_materials
      process_id: "warp_weave"
      flow_role: "silk yarn inputs"
      record_type: "Scale, issue, and stock records"
      raw_fields: "batch_id; yarn_type; supplier; yarn_lot; opening_stock; issued_mass; return_mass; closing_stock; moisture_condition"
      collection_method: "Reconciled calibrated-scale and inventory records"
      unit: "kg"
      frequency: "Each batch, reconciled monthly"
      temporal_coverage: "Same period as output"
      site_scope: "All in-scope yarn stores and looms"
      aggregation_rule: "Sum net issued mass by yarn type and batch, then normalize to saleable output"
      quality_evidence: "Scale calibration; lot trace; stock reconciliation"
    - protocol_id: cp_warp_weave_energy
      process_id: "warp_weave"
      flow_role: "electricity input"
      record_type: "Meter and equipment-activity records"
      raw_fields: "meter_id; start_reading; end_reading; machine_id; operating_hours; measured_or_rated_demand; batch_id"
      collection_method: "Process submeter; otherwise reconciled site meter with documented causal allocation"
      unit: "kWh"
      frequency: "Each batch or meter interval"
      temporal_coverage: "Same period as output"
      site_scope: "Warping, sizing, looms, inspection, and associated handling"
      aggregation_rule: "Sum metered kWh or allocated reconciled kWh and convert to MJ"
      quality_evidence: "Meter calibration; site-meter reconciliation; allocation worksheet"
    - protocol_id: cp_warp_weave_chemicals
      process_id: "warp_weave"
      flow_role: "PVA sizing agent and lubricating oil inputs"
      record_type: "Weighing, issue, purchase, and stock records"
      raw_fields: "product_name; supplier; product_id; CAS_when_available; lot; issued_mass; returned_mass; opening_stock; closing_stock; process_step"
      collection_method: "Reconciled issue and stock records; every chemical product remains a separate row"
      unit: "kg"
      frequency: "Each issue, reconciled monthly"
      temporal_coverage: "Same period as output"
      site_scope: "Sizing and weaving equipment"
      aggregation_rule: "Sum net consumed mass for each identified product; never aggregate unlike chemicals"
      quality_evidence: "Invoice or batch sheet; product specification; stock reconciliation"
    - protocol_id: cp_warp_weave_water
      process_id: "warp_weave"
      flow_role: "sizing-liquor process water"
      record_type: "Meter or batch-tank records"
      raw_fields: "meter_id; volume; density; temperature; batch_id; use_step"
      collection_method: "Metered volume converted with stream-specific density, or direct mass measurement"
      unit: "kg"
      frequency: "Each batch or meter interval"
      temporal_coverage: "Same period as output"
      site_scope: "Sizing preparation and equipment cleaning"
      aggregation_rule: "Sum water mass attributable to the process"
      quality_evidence: "Meter calibration; tank-volume check; density record"
    - protocol_id: cp_warp_weave_outputs
      process_id: "warp_weave"
      flow_role: "saleable fabric and silk waste outputs"
      record_type: "Scale, inspection, and transfer records"
      raw_fields: "batch_id; output_mass; rejected_mass; waste_mass; moisture_condition; grade; destination"
      collection_method: "Calibrated scale linked to inspection and destination records"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same period as inputs"
      site_scope: "All in-scope looms and inspection points"
      aggregation_rule: "Sum saleable output and each separately transferred waste stream"
      quality_evidence: "Scale calibration; inspection record; waste transfer note"
    - protocol_id: cp_wet_materials
      process_id: "wet_processing"
      flow_role: "woven silk fabric input"
      record_type: "Charge and batch records"
      raw_fields: "batch_id; source_process_or_supplier; fabric_mass; moisture_condition; finish_state_in; internal_transfer_flag"
      collection_method: "Calibrated scale and batch charge record"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same period as wet output"
      site_scope: "All in-scope wet-processing lines"
      aggregation_rule: "Sum charged fabric mass, separating purchased and internal transfers"
      quality_evidence: "Scale calibration; batch trace; supplier or internal-transfer record"
    - protocol_id: cp_wet_energy
      process_id: "wet_processing"
      flow_role: "electricity and steam inputs"
