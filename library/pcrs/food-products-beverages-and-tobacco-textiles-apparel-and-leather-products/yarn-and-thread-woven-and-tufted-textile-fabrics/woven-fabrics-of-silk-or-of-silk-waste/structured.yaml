      raw_fields: "utility_type; meter_id; start_reading; end_reading; steam_mass; electricity_kWh; batch_id; allocation_parameter"
      collection_method: "Process meters; otherwise reconciled supplier/site meters with documented causal allocation"
      unit: "kg steam; kWh electricity"
      frequency: "Each batch or meter interval"
      temporal_coverage: "Same period as wet output"
