      record_type: "Water and effluent meters, discharge logs, and laboratory records"
      raw_fields: "inlet_volume; inlet_density; effluent_volume; effluent_density; pH; temperature; destination; treatment_status; sampling_time; batch_id"
      collection_method: "Key-location meters and relevant wastewater monitoring"
      unit: "kg"
      frequency: "Each batch or meter interval; wastewater parameters at permit or BAT-relevant frequency"
      temporal_coverage: "Same period as wet output"
      site_scope: "All in-scope wet lines and discharge or transfer points"
      aggregation_rule: "Convert each stream to mass with documented density; report inflow and each outflow separately"
      quality_evidence: "Meter calibration; sampling record; laboratory QA/QC; water balance"
    - protocol_id: cp_wet_outputs
      process_id: "wet_processing"
      flow_role: "finished fabric output"
      record_type: "Scale and final-inspection records"
      raw_fields: "batch_id; finished_mass; moisture_condition; finish_state; dye_or_print_status; quality_grade; rejected_mass"
      collection_method: "Calibrated scale linked to final inspection"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same period as wet inputs"
      site_scope: "Final wet-process and inspection points"
      aggregation_rule: "Sum saleable finished mass by declared product specification"
      quality_evidence: "Scale calibration; final-inspection record; batch release"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "Divide each reporting-period exchange by the saleable mass linked to the selected reference-flow output; internal transfers cancel only within the same integrated package."
      inputs:
        - "exchange amount"
        - "saleable output mass"
        - "route identifier"
      output: "exchange per 1 kg reference product"
      source_ids:
        - iso-14044-2006
    - id: calc_electricity_mj
      applies_to: "electricity rows"
      rule: "electricity_MJ = metered_electricity_kWh x 3.6"
      inputs:
        - "reconciled metered kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calc_process_mass_balance
      applies_to: "each foreground process"
      rule: "imbalance = mass inputs - saleable product - separately identified waste and other outputs - closing inventory change; retain the signed result and explanation."
      inputs:
        - "conditioned input masses"
        - "output masses"
        - "inventory change"
      output: "process mass-balance record"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_route_yield
      applies_to: "warp_weave and wet_processing"
      rule: "route_yield = saleable conditioned output mass / conditioned material input mass; calculate separately for each process and declared moisture basis."
      inputs:
        - "conditioned material input"
        - "conditioned saleable output"
      output: "process yield"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product, yarn, chemical, waste, and utility flows"
      requirement: "Retain supplier name, product or stream identity, lot or meter reference, and the exact Tiangong UUID when resolved; never substitute a collection label for one exchange."
      evidence: "Supplier specification; batch record; meter or waste-transfer record; Tiangong identity reference"
    - id: dq_route
      applies_to: "foreground package"
      requirement: "Identify every included unit operation and whether wet processing is integrated, purchased, or absent."
      evidence: "Process flow sheet; batch routing; site boundary diagram"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use records from one declared, representative period and disclose shutdowns, abnormal production, rework, and stock changes."
      evidence: "Dated meter, production, stock, and maintenance records"
    - id: dq_completeness
      applies_to: "chemicals, water, energy, wastes, wastewater, and emissions"
      requirement: "Reconcile annual and process-level input/output inventories. Add every actually consumed chemical, fuel, packaging component, waste, and direct emission as a separate atomic exchange even when this minimum inventory does not enumerate it."
      evidence: "Input/output inventory; invoices; chemical ledger; waste log; emissions and effluent monitoring"
    - id: dq_mass_balance
      applies_to: "warp_weave and wet_processing"
      requirement: "Reconcile conditioned material input, saleable output, wastes, retained inventory, and measured losses; document every material residual."
      evidence: "Signed mass-balance worksheet and investigation note"
    - id: dq_wastewater
      applies_to: "wet_processing"
      requirement: "Record wastewater flow, destination, treatment status, and relevant monitored parameters at the actual transfer or discharge point."
      evidence: "Meter and sampling logs; laboratory QA/QC; treatment or discharge record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "The reference product UUID, CPC 26510 identity, Mass property, Units of mass group, kg unit, and all required qualifiers shall be present and mutually consistent."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: validate_bilingual_inventory
    applies_to: "bilingual_markdown"
    rule: "English and Chinese process ids, directions, flow types, row ids, row order, selected UUIDs, controlled tokens, and rule-id order shall match exactly."
    source_ids: []
  - rule_id: validate_route_completeness
    applies_to: "foreground_processes"
    rule: "warp_weave is mandatory. Include wet_processing only when performed or claimed, and then include its water, electricity, steam when used, each actual chemical, wastewater, waste, and direct-emission exchange separately."
    source_ids:
      - jrc-textiles-bref-2023
      - eu-textiles-bat-2022
  - rule_id: validate_atomic_flows
    applies_to: "process_inventory"
    rule: "Reject any card whose selected flow is a collection, selector, combined utility, combined chemical, combined waste, or unresolved placeholder rather than one atomic exchange."
    source_ids: []
  - rule_id: validate_internal_transfer
    applies_to: "integrated_route"
    rule: "The woven-fabric transfer between warp_weave and wet_processing shall be internal and counted once; a purchased fabric input shall carry a separate upstream dataset."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_mass_and_utility_reconciliation
    applies_to: "reporting_period"
    rule: "Reconcile material mass, electricity, water, steam, chemical issues, waste, and wastewater to the same production period and explain residuals or shared-meter allocations."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_no_unlabelled_estimates
    applies_to: "amounts"
    rule: "Reject AI-generated or undocumented numerical ranges. Amounts shall come from foreground records, explicit calculations from those records, or cited external evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate production dataset for woven silk fabric"
  downstream_use: "secondary_dataset; background_dataset when geography, technology, yarn route, finish state, and quality disclosures fit the downstream study"
  allowed_use: "Foreground data-package construction and downstream process or lifecyclemodel projection for the declared fabric, route, site, and period"
  excluded_use: "Garments, knitted or special fabrics, undisclosed fibre blends, cradle-to-gate claims without upstream yarn data, wet-finished claims when wet processing is omitted, or geography/technology extrapolation without justification"
  required_metadata: "PCR id; CPC reference; product UUID; yarn origin and shares; construction and areal mass; finish state; moisture condition; geography; technology; site boundary; reporting period; allocation; upstream dataset references; data quality statement"
  required_quality_disclosure: "Metering and scale coverage; mass-balance residual; shared-utility allocation; chemical-ledger completeness; wastewater destination and monitoring; unresolved identities; missing upstream data; abnormal operations"
  update_trigger: "Material change in yarn route, fibre share, loom or sizing technology, wet-processing recipe, energy or water supply, wastewater treatment, allocation, site boundary, or product specification"
