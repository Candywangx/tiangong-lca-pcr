allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared yarn-preparation, weaving, and finishing operations"
    rule: "Avoid allocation by metering, lot tracking, recipe records, machine time, or other subdivision that directly assigns inputs and outputs to the declared fabric."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_physical_relationship
    applies_to: "inseparable multi-product operations"
    rule: "When subdivision is not practicable, use a documented physical relationship that reflects how the shared input or operation changes with the outputs; mass allocation may be used only when that relationship is demonstrated for the affected operation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_economic_fallback
    applies_to: "inseparable co-products without a defensible physical relationship"
    rule: "Economic allocation is a last-resort study choice; disclose prices, currency, price period, calculation, sensitivity, and the reason a physical relationship was not usable."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_waste_and_recovery
    applies_to: "yarn waste, fabric offcuts, wastewater, and recovered materials"
    rule: "Do not treat a waste stream as a co-product merely because it is transferred for recovery. Record its measured mass and destination; disclose any avoided-burden or recycled-content convention outside the foreground unit-process inventory."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022
