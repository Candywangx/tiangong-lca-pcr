validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the exact reference product-flow UUID, Mass flow-property UUID, 1 kg reference amount, and all required qualifiers; fail validation when a required qualifier is absent."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: validate_category_threshold
    applies_to: "product and yarn composition"
    rule: "Confirm that wool and fine animal hair together account for at least 85% by mass and that the route is carded rather than combed."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: validate_process_route
    applies_to: "process map"
    rule: "Confirm yarn preparation, weaving, finishing, inspection, outsourcing, and exclusions against actual production records; every performed wet or thermal operation must be represented."
    source_ids:
      - jrc-textiles-bref-2023
      - eu-textiles-bat-2022
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Confirm that every exchange is one specific product, electricity or energy carrier, chemical, waste, or elementary flow; reject collection labels and reject UUIDs lacking exact identity evidence."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_input_output_inventory
    applies_to: "foreground completeness"
    rule: "Confirm separately recorded textile materials, each process chemical, water, electricity, steam, each fuel, wastewater, solid waste, and relevant direct emissions for the applicable route."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_mass_reconciliation
    applies_to: "each process and final reference"
    rule: "Reconcile lot inputs, outputs, wastes, work in progress, and stock change; report unexplained residuals and do not silently force the balance."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_allocation_disclosure
    applies_to: "shared and multi-product operations"
    rule: "Confirm subdivision evidence or the selected allocation relationship, calculation, data period, and sensitivity disclosure."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_data_coverage
    applies_to: "published dataset"
    rule: "Confirm temporal, site, route, outsourced-operation, meter, and record coverage and disclose all gaps or substitutions."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022
published_dataset_profile:
  dataset_role: "Foreground production dataset for mill-gate woven fabric; eligible for reviewed use as a secondary_dataset or background_dataset"
  downstream_use: "Construction of TianGong process records and downstream lifecyclemodel projections for products consuming CPC 26520 woven fabric"
  allowed_use: "Studies whose product matches the declared fibre composition, carded route, construction, finish, geography, period, moisture basis, and mill-gate boundary"
  excluded_use: "Combed-wool fabrics, fabrics below the 85% threshold, knitted or tufted textiles, apparel manufacture, use-stage performance, and product systems requiring omitted upstream or downstream stages without added datasets"
  required_metadata: "PCR id; exact product-flow UUID; product and yarn composition; fibre species; carded-route evidence; weave and construction; width; mass per unit area; finish; moisture condition; site; period; process route; outsourced operations; allocation; cut-off and packaging treatment"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; composition and quality-test evidence; temporal and site coverage; missing records; substitutions; unresolved UUIDs; allocation method; mass-balance findings; water, energy, chemical, waste, wastewater, and direct-emission completeness"
  update_trigger: "Change in fibre composition, carded/combed route, weave, finish, site, process route, energy or water system, chemical recipe, allocation, upstream yarn source, measurement system, reference-flow identity, or material evidence source"
