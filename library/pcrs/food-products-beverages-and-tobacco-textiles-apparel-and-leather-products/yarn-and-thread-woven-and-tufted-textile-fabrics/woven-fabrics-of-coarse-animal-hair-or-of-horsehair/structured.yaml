system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when purchased coarse-animal-hair yarn or horsehair yarn and other purchased inputs enter the reporting site. It includes yarn preparation, warping and sizing when performed, weaving, extraction and collection of fibre dust, on-site wet preparation and dyeing or finishing when performed, direct on-site energy use and emissions, inspection, trimming, rolling, packaging, and management of foreground wastes and wastewater up to their transfer across the site boundary. It ends with accepted woven fabric and separately recorded packaging ready for dispatch."
      source_ids: []
    - rule_id: boundary_foreground_route
      applies_to: "all foreground processes"
      rule: "Include every on-site operation from receipt of purchased yarn through accepted and packaged woven fabric; mark wet operations conditional only when site records demonstrate that they were not performed."
      source_ids:
        - jrc-textiles-bref-2023
        - eu-textiles-bat-2022
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased yarn and other purchased products"
      rule: "Represent production before the declared purchased-input gate with traceable upstream datasets and do not duplicate those burdens in foreground exchanges."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_waste_and_emissions
      applies_to: "waste, wastewater, and direct emissions"
      rule: "Record each waste transfer and each directly monitored or calculated emission as a separate atomic exchange, and disclose the destination or receiving compartment."
      source_ids:
        - eu-textiles-bat-2022
