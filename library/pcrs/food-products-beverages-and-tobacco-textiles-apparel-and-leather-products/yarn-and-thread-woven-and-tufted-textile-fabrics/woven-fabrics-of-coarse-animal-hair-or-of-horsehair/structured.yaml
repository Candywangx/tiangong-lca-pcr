allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "shared foreground equipment and utilities"
    rule: "Prefer process subdivision, dedicated metering, lot records, or documented operating-time allocation so burdens are assigned without co-product allocation whenever practicable."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_physical_relation
    applies_to: "unavoidable joint production"
    rule: "When subdivision is not practicable, allocate by a documented physical causal relation, such as measured mass, machine time, or energy demand, that reflects how inputs and emissions change with the outputs."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_other_relation
    applies_to: "joint production without a defensible physical relation"
    rule: "Use another documented relationship only after explaining why a physical relation is not practicable; disclose the method and test a materially plausible alternative."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_recovery
    applies_to: "recoverable yarn waste, offcuts, oils, packaging waste, and wastewater residues"
    rule: "Keep each recovered output separate; do not assign avoided-burden credits inside the foreground process unless the downstream system and allocation method are explicitly included and disclosed."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_issue_records
      process_id: "yarn_preparation_and_weaving"
      flow_role: "route-specific yarn inputs"
      record_type: "purchase receipt, stock ledger, and lot issue record"
      raw_fields: "supplier; material name; fibre route; lot id; gross mass; tare; net mass; issue and return mass"
      collection_method: "reconcile receipts, stock movement, and lot issues"
      unit: "kg"
      frequency: "each receipt and production lot"
      temporal_coverage: "complete reporting period"
      site_scope: "all yarn stores and weaving lines in scope"
      aggregation_rule: "sum net issues minus documented returns by route and lot"
      quality_evidence: "calibrated scale record, supplier document, and stock reconciliation"
    - protocol_id: cp_electricity_meter_records
      process_id: "all_processes"
      flow_role: "process electricity"
      record_type: "submeter or reconciled main-meter record"
      raw_fields: "meter id; start and end reading; timestamp; process; downtime; allocation key"
      collection_method: "read submeters or allocate a reconciled site meter using documented operating records"
      unit: "kWh"
      frequency: "at least monthly and by lot when available"
      temporal_coverage: "complete reporting period"
      site_scope: "all included equipment and shared services"
      aggregation_rule: "sum readings and allocate only the reconciled shared remainder"
      quality_evidence: "meter calibration or utility invoice and reconciliation"
    - protocol_id: cp_chemical_recipe_records
      process_id: "yarn_preparation_and_weaving_wet_processing"
      flow_role: "each individual chemical product"
      record_type: "batch recipe, issue ticket, return, and concentration record"
      raw_fields: "product name; formulation or concentration; supplier; batch id; issued mass; returned mass"
      collection_method: "record every recipe chemical as its own product flow"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete wet-processing and sizing campaigns"
      site_scope: "all in-scope dosing points"
      aggregation_rule: "sum net product mass by exact chemical product and batch"
      quality_evidence: "approved recipe, issue ticket, and concentration certificate"
    - protocol_id: cp_lubricant_records
      process_id: "yarn_preparation_and_weaving"
      flow_role: "loom lubricating oil"
      record_type: "stock and maintenance issue record"
      raw_fields: "product name; opening stock; receipts; closing stock; recovered mass; process"
      collection_method: "stock balance supported by maintenance issues"
      unit: "kg"
      frequency: "monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all included weaving and preparation equipment"
      aggregation_rule: "opening plus receipts minus closing and separately recovered oil"
      quality_evidence: "stock reconciliation and maintenance log"
    - protocol_id: cp_fabric_transfer_records
      process_id: "wet_processing_inspection_cutting_packaging"
      flow_role: "intermediate fabric"
      record_type: "lot transfer and weighing record"
      raw_fields: "lot id; route; source process; destination process; conditioned mass; timestamp"
      collection_method: "weigh and reconcile transfers between process steps"
      unit: "kg"
      frequency: "each lot transfer"
      temporal_coverage: "complete reporting period"
      site_scope: "all included production lines"
      aggregation_rule: "sum conditioned transfers by route and lot"
      quality_evidence: "calibrated scale and signed transfer record"
    - protocol_id: cp_fabric_output_records
      process_id: "all_processes"
      flow_role: "accepted fabric output"
      record_type: "production and quality-release record"
      raw_fields: "lot id; fibre route; composition; weave; width; length; area; mass per area; moisture basis; net mass; rejects"
      collection_method: "condition, weigh, and release accepted output"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "complete reporting period"
      site_scope: "all included lines"
      aggregation_rule: "sum accepted net mass; keep rejected mass separate"
      quality_evidence: "calibration, conditioning record, and quality release"
    - protocol_id: cp_solid_waste_records
      process_id: "yarn_preparation_and_weaving_inspection_cutting_packaging"
      flow_role: "each route-specific solid waste"
      record_type: "container weighing and waste transfer record"
      raw_fields: "waste name; fibre route; process; container id; gross mass; tare; net mass; destination"
      collection_method: "weigh each segregated waste stream at transfer"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "complete reporting period"
      site_scope: "all in-scope waste collection points"
      aggregation_rule: "sum net mass by exact waste identity, process, and destination"
      quality_evidence: "scale record and transfer receipt"
    - protocol_id: cp_air_emission_records
      process_id: "yarn_preparation_and_weaving_wet_processing"
      flow_role: "each direct air emission"
      record_type: "stack or workplace-extraction monitoring and supporting calculation"
      raw_fields: "pollutant identity; source; method; concentration; gas flow; duration; abatement state; result"
      collection_method: "use compliant monitoring or retain the complete site calculation evidence"
      unit: "kg"
      frequency: "permit or BAT-consistent frequency and each material process change"
      temporal_coverage: "representative operation within the reporting period"
      site_scope: "all included emission points"
      aggregation_rule: "aggregate only the same pollutant and compartment after source-level records are retained"
      quality_evidence: "laboratory report, method, calibration, and operating-state evidence"
    - protocol_id: cp_water_meter_records
      process_id: "wet_processing"
      flow_role: "process water"
      record_type: "water submeter or reconciled supply record"
      raw_fields: "meter id; readings; timestamp; process; batch; excluded domestic use"
      collection_method: "meter wet-process supply and reconcile with site supply"
      unit: "kg or m3"
      frequency: "each batch or at least monthly"
      temporal_coverage: "complete wet-processing period"
      site_scope: "all in-scope wet lines"
      aggregation_rule: "sum readings by process; document volume-to-mass conversion"
      quality_evidence: "meter calibration, supply invoice, and reconciliation"
    - protocol_id: cp_steam_meter_records
      process_id: "wet_processing"
      flow_role: "purchased steam heat"
      record_type: "supplier or submeter record"
      raw_fields: "meter id; steam quantity; pressure; enthalpy or invoiced energy; condensate return; batch"
      collection_method: "use supplier meter or calibrated submeter and preserve energy basis"
      unit: "MJ"
      frequency: "each batch or at least monthly"
      temporal_coverage: "complete wet-processing period"
      site_scope: "all in-scope steam users"
      aggregation_rule: "sum supplied energy and allocate only reconciled shared use"
      quality_evidence: "meter calibration, invoice, and energy-basis calculation"
    - protocol_id: cp_fuel_meter_records
      process_id: "wet_processing"
      flow_role: "on-site natural gas"
      record_type: "gas meter and supplier calorific-value statement"
      raw_fields: "meter readings; volume or energy; pressure; temperature; gross calorific value; timestamp; equipment"
      collection_method: "reconcile process meters to supplier totals and retain the gross-calorific-value basis"
      unit: "MJ"
      frequency: "at least monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all in-scope direct heaters and boilers"
      aggregation_rule: "sum metered gross-calorific-value energy by process"
      quality_evidence: "meter calibration and supplier statement"
    - protocol_id: cp_wastewater_records
      process_id: "wet_processing"
      flow_role: "textile process wastewater"
      record_type: "effluent meter, sampling, and transfer or discharge record"
      raw_fields: "discharge route; meter readings; volume or mass; density basis; sampling time; treatment destination"
      collection_method: "meter each route and reconcile with water input and retained water"
      unit: "kg or m3"
      frequency: "continuous or batch-total measurement with BAT-consistent sampling"
      temporal_coverage: "complete wet-processing period"
      site_scope: "all in-scope discharge and transfer points"
      aggregation_rule: "aggregate by route only after source-level records are retained"
      quality_evidence: "meter calibration, sampling report, and treatment receipt"
    - protocol_id: cp_packaging_issue_records
      process_id: "inspection_cutting_packaging"
      flow_role: "each packaging component"
      record_type: "packaging stock and issue record"
      raw_fields: "component name; material; unit mass; count; issued mass; returned mass; lot"
      collection_method: "weigh or calculate from verified unit mass and count for each component separately"
      unit: "kg"
      frequency: "each dispatch lot"
      temporal_coverage: "complete reporting period"
      site_scope: "all in-scope packing stations"
      aggregation_rule: "sum net issued mass by exact packaging component"
      quality_evidence: "unit-mass verification, stock reconciliation, and dispatch record"
  calculation_rules:
    - id: calc_mass_normalization
      applies_to: "every mass-based inventory row"
      rule: "normalized amount = recorded net row mass / net accepted process-output mass"
      inputs:
        - "row net mass"
        - "accepted process-output mass"
      output: "kg per kg process output or reference flow"
      source_ids: []
    - id: calc_area_mass_check
      applies_to: "reference fabric"
      rule: "calculated fabric mass = reported area × reported mass per area; compare with conditioned weighed mass and retain the difference"
      inputs:
        - "width and length or area"
        - "mass per area"
        - "conditioned weighed mass"
      output: "reconciliation result"
      source_ids: []
    - id: calc_energy_conversion
      applies_to: "electricity and steam records"
      rule: "convert only with documented unit identities and conversion factors; retain original readings and converted values"
      inputs:
        - "meter or invoice value"
        - "original unit"
        - "conversion factor"
      output: "kWh or MJ per kg process output"
      source_ids: []
    - id: calc_gas_energy
      applies_to: "natural gas"
      rule: "gas energy = measured gas quantity × supplier-declared gross calorific value on a consistent pressure and temperature basis"
      inputs:
        - "metered gas quantity"
        - "supplier gross calorific value"
        - "basis conditions"
      output: "MJ gross calorific value per kg process output"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_water_mass
      applies_to: "process water and wastewater"
      rule: "when mass is not directly measured, converted mass = measured volume × documented density at the stated condition"
      inputs:
        - volume
        - density
        - condition
      output: "kg per kg process output"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference fabric and intermediate fabric"
      requirement: "Retain lot-level evidence for fibre route, animal species or commercial fibre designation, full composition, weave, width, mass per area, moisture basis, and finishing state."
      evidence: "product specification, bill of materials, lot traveller, and quality release"
    - id: dq_route_completeness
      applies_to: "all foreground processes"
      requirement: "Reconcile the declared process map with production records; disclose every omitted or externally performed preparation, wet, thermal, and finishing operation."
      evidence: "process flow diagram, production log, supplier service record, and boundary disclosure"
    - id: dq_atomic_recipe
      applies_to: "sizing and wet-processing chemicals"
      requirement: "Represent every chemical product in the actual batch recipe as a separate atomic product-flow exchange with product name, concentration, and net issued mass; do not use a combined chemical or dye selector."
      evidence: "approved recipe, safety or specification sheet, issue ticket, and return record"
    - id: dq_mass_balance
      applies_to: "each process and reporting lot"
      requirement: "Reconcile material inputs to accepted output, route-specific waste, retained moisture change, wastewater-carried material where measured, and documented stock change; investigate material discrepancies."
      evidence: "signed lot mass balance and discrepancy investigation"
    - id: dq_energy_reconciliation
      applies_to: "electricity, steam, and natural gas"
      requirement: "Reconcile process meters and allocations to supplier totals and state the allocation key for shared services."
      evidence: "meter register, utility invoice, allocation calculation, and calibration evidence"
    - id: dq_wet_environmental_records
      applies_to: "wet processing and associated combustion"
      requirement: "Retain water-use, wastewater-route, chemical-inventory, energy-use, and direct-emission records at a frequency representative of actual operating conditions and material route changes."
      evidence: "monitoring plan, meter records, laboratory reports, and operating logs"
    - id: dq_no_double_counting
      applies_to: "wastewater and direct emissions"
      requirement: "Do not count a substance both inside a wastewater waste flow and as a direct elementary emission unless records demonstrate separate boundary crossings."
      evidence: "discharge map, treatment boundary, sampling point identity, and inventory reconciliation"
    - id: dq_temporal_site_coverage
      applies_to: "all foreground data"
      requirement: "Cover a representative reporting period and all included lines at the declared site; document shutdowns, abnormal operation, missing data, and substitutions."
      evidence: "production calendar, line list, meter coverage, and gap log"
    - id: dq_packaging_separation
      applies_to: "dispatch packaging"
      requirement: "Exclude packaging from the 1 kg fabric reference mass and record each component separately."
      evidence: "net/gross weighing record, packaging issue record, and dispatch specification"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require the confirmed product UUID, Mass property UUID, 1 kg reference amount, and all required product qualifiers; fail when the product is a yarn, wool/fine-hair fabric, nonwoven, knitted, tufted, pile, felt, carpet, made-up article, or apparel."
    source_ids:
      - unsd-cpc-3-0-explanatory-notes-2025
  - rule_id: validate_reference_mass
    applies_to: "reference fabric"
    rule: "Verify that reference mass is net conditioned fabric mass and excludes every packaging component; reconcile mass, area, and mass-per-area records."
    source_ids: []
  - rule_id: validate_process_route
    applies_to: "process map"
    rule: "Require yarn preparation and weaving plus inspection and packaging; require each wet, thermal, dyeing, printing, coating, or finishing operation when production records show it occurred."
    source_ids:
      - jrc-textiles-bref-2023
      - eu-textiles-bat-2022
  - rule_id: validate_atomic_flows
    applies_to: "process inventory"
    rule: "Require one concrete product, chemical, energy carrier, packaging component, waste, or elementary emission per row; reject plural collections, alternatives, selectors, and placeholder flows."
    source_ids: []
  - rule_id: validate_direction_and_type
    applies_to: "every inventory row"
    rule: "Verify that process, direction, flow type, row id, selected UUID when present, property, unit, and route condition are mutually consistent."
    source_ids: []
  - rule_id: validate_foreground_evidence
    applies_to: "every amount"
    rule: "Require a real foreground record and the linked collection protocol; reject AI-derived amounts and undocumented default ranges."
    source_ids: []
  - rule_id: validate_wet_processing
    applies_to: "wet processing"
    rule: "Reconcile process water, wastewater, each recipe chemical, electricity, steam, natural gas, direct emissions, and accepted output for the actual route, without double counting transferred wastewater and direct releases."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_allocation
    applies_to: "shared operations and joint outputs"
    rule: "Require allocation avoidance where practicable; otherwise require the selected relationship, rationale, inputs, outputs, and alternative-method sensitivity disclosure."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_source_traceability
    applies_to: "external rules and non-default evidence"
    rule: "Require every cited source id to resolve to the Data Sources table and every foreground record to retain its auditable site evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset after methodology review; eligible for background_dataset use only after independent quality review and declared representativeness"
  downstream_use: "Foreground process datasets and downstream process or lifecyclemodel projections for woven fabrics of coarse animal hair or of horsehair"
  allowed_use: "Product-footprint, supply-chain, process-improvement, and comparative modelling when product identity, route, geography, time period, allocation, and data quality match the study goal and scope"
  excluded_use: "Yarn, wool/fine-animal-hair fabrics, other textile structures, made-up articles, apparel, undisclosed proxies, or claims outside the declared geography, technology, period, and finishing state"
  required_metadata: "PCR id and version; product and flow UUIDs; fibre route and composition; weave, width, mass per area, moisture basis, finishing state; site and period; process route; geography and technology; allocation; upstream dataset choices; wastewater and waste destinations; packaging boundary"
  required_quality_disclosure: "Primary-data coverage; meter and scale coverage; temporal, geographic, and technological representativeness; missing-data treatment; mass and energy reconciliation; recipe completeness; emission-monitoring basis; allocation sensitivity; review status"
  update_trigger: "Change in fibre route or composition, weave technology, wet or thermal route, chemical formulation, energy source, wastewater treatment, allocation method, packaging configuration, site representativeness, reference-flow identity, or authoritative source requirements"
