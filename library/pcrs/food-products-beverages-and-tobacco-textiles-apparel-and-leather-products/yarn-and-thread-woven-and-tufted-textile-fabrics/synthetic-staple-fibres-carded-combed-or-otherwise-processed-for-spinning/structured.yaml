allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Multi-output or shared preparation operations"
    rule: "Avoid allocation by submetering, batch separation, route separation or process subdivision so that only inputs and outputs attributable to the declared prepared fibre are included."
    source_ids:
      - eu-pef-method-2021
      - iso-14044-2006
  - rule_id: allocation_physical_relation
    applies_to: "Shared operations that cannot be subdivided"
    rule: "If subdivision is not feasible, use a documented causal physical relationship such as measured machine time, throughput, metered energy or mass only when it represents resource causality; preserve separate polymer and route results."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_other_relation_fallback
    applies_to: "Residual multifunctionality without a defensible physical relation"
    rule: "Use another relationship, including economic allocation, only after documenting why subdivision and physical allocation fail, the price basis and period, and a sensitivity result."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_internal_recirculation
    applies_to: "Fibre returned to the same foreground line"
    rule: "Treat verified same-line recirculation as an internal loop. Do not count it as both exported co-product and new external input; retain gross and net movement records for mass balance."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: allocation_exported_fibre_material
    applies_to: "Saleable noils, off-spec fibre or other exported material"
    rule: "Classify an output as co-product only when it has documented product status and destination. Otherwise record it as waste. Disclose any burden allocation and do not apply an avoided-burden credit silently."
    source_ids:
      - eu-pef-method-2021
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipt
      process_id: "fibre_preparation_line"
      flow_role: "Received fibre identity and mass"
      record_type: "Supplier specification, goods receipt, weigh ticket and stock ledger"
      raw_fields: "lot_id, supplier, polymer_family, blend_components, mass_fractions, virgin_or_recovered_status, prior_preparation, finish_content, gross_mass, tare_mass, net_mass, moisture_basis, receipt_time"
      collection_method: "Match supplier specification to each received lot and reconcile net weighed mass with inventory movement"
      unit: "kg and kg/kg"
      frequency: "Each lot; reconcile at reporting-period close"
      temporal_coverage: "Same representative period as output, including opening and closing stock"
      site_scope: "All facilities and lines represented by the dataset"
      aggregation_rule: "Sum homogeneous lots only after preserving polymer, blend, origin and preparation-route strata"
      quality_evidence: "Calibrated scale record, supplier certificate, lot traceability and stock reconciliation"
    - protocol_id: cp_energy_records
      process_id: "fibre_preparation_line"
      flow_role: "Electricity and thermal-energy use"
      record_type: "Meter, fuel issue, steam invoice or equipment operating record"
      raw_fields: "meter_id, carrier, opening_reading, closing_reading, fuel_mass_or_volume, heating_value_source, equipment_power, operating_time, process_id, lot_or_period, allocation_driver"
      collection_method: "Prefer process submetering; otherwise calculate from equipment power and operating time and document shared-utility allocation"
      unit: "kWh or MJ by carrier"
      frequency: "Continuous or each batch; aggregate monthly or by campaign"
      temporal_coverage: "Representative normal-operation period matched to production"
      site_scope: "Every included process and line"
      aggregation_rule: "Subtract non-production use where metered, allocate shared use by causal driver, then normalize to net output"
      quality_evidence: "Meter calibration, invoices, runtime logs, conversion factors and allocation worksheet"
    - protocol_id: cp_auxiliary_records
      process_id: "fibre_preparation_line"
      flow_role: "Preparation and conditioning auxiliary use"
      record_type: "Batch dosing sheet, flow meter, purchase issue and stock ledger"
      raw_fields: "product_name, supplier, function, composition_or_sds, active_fraction, opening_stock, receipts, closing_stock, dose, lot_id, process_id"
      collection_method: "Record commercial product mass by chemical and reconcile dosing with stock change"
      unit: "kg commercial product and kg active substance when known"
      frequency: "Each batch or dosing event; reconcile monthly"
      temporal_coverage: "Same period and product route as output"
      site_scope: "Every line applying auxiliaries"
      aggregation_rule: "Keep products separate; normalize commercial and active mass independently"
      quality_evidence: "Dosing calibration, signed batch sheet, SDS or supplier composition and stock reconciliation"
    - protocol_id: cp_process_mass_balance
      process_id: "fibre_preparation_line"
      flow_role: "Fibre intermediate, return loop, product and removed material"
      record_type: "Weigh tickets, hopper or bale scales, production counter and stock ledger"
      raw_fields: "process_id, lot_id, input_mass, output_mass, internal_return_mass, exported_reject_mass, captured_dust_mass, opening_wip, closing_wip, moisture_basis"
      collection_method: "Build process and line balances on a consistent conditioned-mass basis"
      unit: "kg"
      frequency: "Each lot where feasible; otherwise each shift or campaign"
      temporal_coverage: "Matched input-output period including work-in-progress change"
      site_scope: "Every included route and line"
      aggregation_rule: "Sum within homogeneous route strata; retain gross internal returns and use net values for external inventory"
      quality_evidence: "Scale calibration, signed balance, reason for imbalance and disposition records"
    - protocol_id: cp_air_emissions
      process_id: "fibre_preparation_line"
      flow_role: "Particulate and relevant air releases"
      record_type: "Stack test, continuous monitor, ventilation survey or substance-specific emission calculation"
      raw_fields: "emission_point, substance, concentration, gas_flow, operating_time, abatement_status, capture_efficiency, production_mass, method, detection_limit"
      collection_method: "Match concentration and flow measurements in time; otherwise apply a documented applicable factor to collected activity data"
      unit: "kg substance, mg/Nm3 and Nm3 as recorded"
      frequency: "According to permit and risk; repeat after material process or control change"
      temporal_coverage: "Representative operating condition and matched production"
      site_scope: "Every relevant emission point for included processes"
      aggregation_rule: "Calculate mass load per substance and sum only comparable points; keep captured material out of air releases"
      quality_evidence: "Laboratory report, instrument calibration, sampling plan, operating log and legal-limit comparison"
    - protocol_id: cp_water_wastewater_records
      process_id: "wet_thermal_conditioning"
      flow_role: "Water intake, reuse, wastewater and direct water releases"
      record_type: "Water meters, batch records, discharge meters and laboratory analysis"
      raw_fields: "water_source, intake_volume, reused_volume, evaporated_or_carryover_estimate, discharge_volume, sample_time, parameter, concentration, treatment_route, production_mass"
      collection_method: "Establish process water balance and match discharge concentration with corresponding flow period"
      unit: "m3, kg and mg/L as applicable"
      frequency: "Each batch or continuous meter; sample according to permit and risk"
      temporal_coverage: "Same treated-route period as output"
      site_scope: "All included wet processes, treatment units and discharge points"
      aggregation_rule: "Keep fresh, reused and discharged streams separate; calculate pollutant load from matched concentration and volume"
      quality_evidence: "Meter calibration, chain of custody, accredited laboratory result, balance reconciliation and permit record"
    - protocol_id: cp_waste_records
      process_id: "wet_thermal_conditioning"
      flow_role: "Sludge and other exported residues"
      record_type: "Container weight, waste manifest and treatment receipt"
      raw_fields: "waste_type, process_id, gross_mass, tare_mass, moisture_or_dry_solids, destination, treatment, date"
      collection_method: "Weigh each shipment or container and link it to the generating process"
      unit: "kg wet and kg dry where available"
      frequency: "Each removal"
      temporal_coverage: "Same period as treated output"
      site_scope: "All included wet or thermal processes"
      aggregation_rule: "Sum by waste type, moisture basis and destination before normalization"
      quality_evidence: "Scale evidence, manifest, treatment receipt and moisture analysis"
    - protocol_id: cp_packaging_records
      process_id: "packing_dispatch"
      flow_role: "Packaging input and packing residues"
      record_type: "Bill of materials, purchase issue, pack specification and waste weight"
      raw_fields: "package_type, material, unit_mass, units_used, shipped_units, damaged_units, waste_mass, stock_change, transfer_form"
      collection_method: "Calculate shipped and discarded packaging separately by material"
      unit: "kg"
      frequency: "Each packaging batch or dispatch campaign"
      temporal_coverage: "Same period as reference output"
      site_scope: "All packing formats in the dataset"
      aggregation_rule: "Preserve material and format strata; normalize to net fibre output"
      quality_evidence: "Pack specification, unit-weight check, stock record and waste receipt"
    - protocol_id: cp_reference_output
      process_id: "packing_dispatch"
      flow_role: "Net prepared-fibre output and qualifiers"
      record_type: "Calibrated scale, lot release and product specification"
      raw_fields: "lot_id, gross_shipped_mass, packaging_tare, net_fibre_mass, moisture_basis, polymer_family, blend_fractions, fibre_length, linear_density, crimp, finish_content, preparation_state, output_form, geography, route, release_time"
      collection_method: "Determine net fibre as gross shipped mass minus measured packaging tare and verify required qualifiers at release"
      unit: "kg and declared property units"
      frequency: "Each released lot"
      temporal_coverage: "Same period as all normalized inputs and outputs"
      site_scope: "Every represented product and route"
      aggregation_rule: "Keep route and product strata separate; sum only after representativeness review"
      quality_evidence: "Scale calibration, release certificate, product specification and lot traceability"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "Released product lot"
      rule: "net_fibre_mass = gross_shipped_mass - measured_packaging_tare"
      inputs:
        - gross_shipped_mass
        - measured_packaging_tare
      output: "kg net prepared fibre"
      source_ids:
        - eu-pef-method-2021
    - id: calc_normalize_1000kg
      applies_to: "Every foreground inventory amount"
      rule: "normalized_amount = period_or_lot_amount / matched_net_fibre_mass * 1000 kg"
      inputs:
        - period_or_lot_amount
        - matched_net_fibre_mass
      output: "amount per 1,000 kg net reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_conditioned_mass
      applies_to: "Records converted between moisture states"
      rule: "converted_mass = measured_mass * (1 - measured_initial_moisture_fraction) / (1 - declared_target_moisture_fraction); use only measured fractions on the same mass convention"
      inputs:
        - measured_mass
        - measured_initial_moisture_fraction
        - declared_target_moisture_fraction
      output: "kg at declared moisture state"
      source_ids: []
    - id: calc_line_mass_balance
      applies_to: "Each process and reporting period"
      rule: "unexplained_difference = inputs + opening_work_in_progress - outputs - exported_waste - closing_work_in_progress; internal returns cancel within the same boundary"
      inputs:
        - input_mass
        - output_mass
        - exported_waste_mass
        - opening_work_in_progress
        - closing_work_in_progress
        - internal_returns
      output: "kg unexplained difference with signed reconciliation"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_shared_energy
      applies_to: "Shared meter lacking process submeter"
      rule: "Allocate by measured operating time times rated or measured load only when equipment and load states are documented; otherwise report the gap and do not claim site specificity"
      inputs:
        - shared_meter_use
        - equipment_operating_time
        - measured_or_rated_load
        - production_mass
      output: "kWh or MJ by process"
      source_ids:
        - eu-pef-method-2021
        - eu-textiles-bat-2022
    - id: calc_air_mass_load
      applies_to: "Measured channelled emission"
      rule: "substance_mass = concentration * dry_or_wet_gas_flow_on_matching_basis * operating_time, with explicit unit and reference-condition conversion"
      inputs:
        - concentration
        - gas_flow
        - operating_time
        - reference_conditions
      output: "kg substance per period and per 1,000 kg product"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_water_pollutant_load
      applies_to: "Direct discharge after treatment"
      rule: "pollutant_mass = matched_concentration * matched_discharge_volume with explicit unit conversion"
      inputs:
        - concentration
        - discharge_volume
        - sample_and_flow_period
      output: "kg parameter or substance per period and per 1,000 kg product"
      source_ids:
        - eu-textiles-bat-2022
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Inputs and reference output"
      requirement: "Trace every reported lot from supplier and receipt through process route to released output, including polymer, blend, feedstock origin, prior preparation and output-state qualifiers."
      evidence: "Supplier specification, receipt record, route traveller and release certificate; un-cpc-v3-2025"
    - id: dq_route_representativeness
      applies_to: "Aggregated dataset"
      requirement: "Do not aggregate materially different polymer, blend, recovered-content, auxiliary, wet/thermal or equipment routes without a documented representativeness test and retained disaggregated records."
      evidence: "Route-stratified inventory and aggregation review; ec-jrc-txt-bref-2023; eu-pef-method-2021"
    - id: dq_temporal_match
      applies_to: "All foreground data"
      requirement: "Use a recent period representative of normal operation and match inputs, outputs, work-in-progress, emissions and utilities to the same lots or reporting window. Identify abnormal, startup, shutdown and maintenance periods."
      evidence: "Dated ledgers, operating log, meter periods and reconciliation worksheet; eu-pef-method-2021; eu-textiles-bat-2022"
    - id: dq_measurement_quality
      applies_to: "Mass, energy, water and emission records"
      requirement: "Retain instrument identity, calibration or verification status, method, detection limit where relevant and unit conversions. State whether each value is measured, calculated or estimated."
      evidence: "Calibration records, laboratory reports, invoices, meter exports and calculation workbook; eu-pef-method-2021; eu-textiles-bat-2022"
    - id: dq_completeness
      applies_to: "Process input-output inventory"
      requirement: "Include all known material, energy, water, product, co-product, waste and direct-emission flows for included processes. Do not hide a flow through an undocumented cut-off."
      evidence: "Input-output inventory, mass and water balances, waste manifests and emission-point register; eu-textiles-bat-2022"
    - id: dq_estimate_replacement
      applies_to: "Provisional ranges and modelled values"
      requirement: "Treat every reasoned-estimate range as a non-binding authoring and QA screen. Replace it with foreground distributions or reviewed route-specific evidence before publication and whenever it affects a study result."
      evidence: "Estimate register, replacement decision and retained source or foreground distribution"
    - id: dq_source_currency
      applies_to: "External guidance and standards"
      requirement: "Check current legal, BAT, standard and classification status at dataset release and disclose any superseded source retained for comparability."
      evidence: "Source review record; un-cpc-v3-2025; eu-textiles-bat-2022; iso-14044-2006"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "Reference flow and product description"
    rule: "Require product flow UUID 95a493a4-1e51-4eb5-9b7c-e06bf912e993, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66 and kg. Reject a package that interprets “Synthetic Fiber Cloth” as woven or other fabric instead of CPC 26210 prepared staple fibre."
    source_ids:
      - un-cpc-v3-2025
  - rule_id: validation_scope_state
    applies_to: "Product category"
    rule: "Confirm that output is unspun synthetic staple fibre already carded, combed or otherwise prepared for spinning. Reject yarn, continuous filament, woven, knitted, tufted, nonwoven, dyed, printed, coated or finished products."
    source_ids:
      - un-cpc-v3-2025
      - ec-jrc-txt-bref-2023
      - ifc-textile-ehs-2007
  - rule_id: validation_required_qualifiers
    applies_to: "Reference product metadata"
    rule: "Fail completeness when polymer and blend composition, feedstock origin, fibre properties, preparation state, optional treatments, moisture basis, output form, geography, route or reporting period is missing."
    source_ids:
      - eu-pef-method-2021
      - ec-jrc-txt-bref-2023
  - rule_id: validation_route_conditioning
    applies_to: "Dataset aggregation"
    rule: "Reject an unconditional category average across polymer families, mixed compositions, virgin and recovered feedstock, or dry, combed/drawn, wet or thermal routes. Require route-specific records or a documented homogeneity test."
    source_ids:
      - ec-jrc-txt-bref-2023
      - eu-pef-method-2021
  - rule_id: validation_process_inclusion
    applies_to: "Process map"
    rule: "Require fibre_preparation_line and packing_dispatch. Include combing_drawing and wet_thermal_conditioning only when their conditions are met, and reject unexplained inventory rows from excluded downstream textile processes."
    source_ids:
      - ec-jrc-txt-bref-2023
      - ifc-textile-ehs-2007
  - rule_id: validation_mass_and_stock_balance
    applies_to: "Material inventory"
    rule: "Require net packaging exclusion, matched moisture basis, work-in-progress adjustment and a signed explanation for any unresolved material-balance difference."
    source_ids:
      - eu-textiles-bat-2022
      - eu-pef-method-2021
  - rule_id: validation_dust_and_emissions
    applies_to: "Mechanical and conditional treatment routes"
    rule: "Require captured dust, exported rejects, abatement operation and residual releases to be distinguished; if wet or thermal treatment is included, require corresponding water, energy, chemicals, wastewater, residues and relevant direct emissions."
    source_ids:
      - ifc-textile-ehs-2007
      - eu-textiles-bat-2022
  - rule_id: validation_allocation
    applies_to: "Shared or multi-output operations"
    rule: "Verify subdivision was attempted first and that any physical or other allocation has a causal driver, calculation record and sensitivity disclosure where required. Reject silent avoided-burden credits."
    source_ids:
      - eu-pef-method-2021
      - iso-14044-2006
  - rule_id: validation_evidence_status
    applies_to: "Quantitative values"
    rule: "Distinguish collected, calculated, external-source and reasoned-estimate evidence. A reasoned-estimate range is not a measured value, legal limit or publication-ready default and must carry a replacement decision."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_temporal_completeness
    applies_to: "Foreground data package"
    rule: "Verify that input, output, utility, waste and emission records cover the same representative operating window and that exclusions, abnormal periods and missing measurements are disclosed."
    source_ids:
      - eu-pef-method-2021
      - eu-textiles-bat-2022
published_dataset_profile:
  dataset_role: "Route-, product- and facility-specific foreground dataset for production of synthetic staple fibre processed for spinning at the preparation-facility gate"
  downstream_use: "May serve as a secondary_dataset or background_dataset for yarn and textile product systems only after methodology review, UUID completion and replacement or approval of provisional evidence"
  allowed_use: "Model the disclosed CPC 26210 polymer, blend, feedstock origin, preparation route, geography, period and product state; connect separate upstream fibre-production and downstream spinning datasets"
  excluded_use: "Woven or other cloth production; yarn spinning or twisting; primary polymer or chemical-fibre manufacture; artificial/regenerated staple fibre; undisclosed mixed-fibre classification; unconditional proxy for another polymer, recovered-content route, wet/thermal route, geography or technology"
  required_metadata: "Canonical PCR id; CPC coordinate; reference UUIDs and semantic caveat; polymer and blend composition; virgin or recovered basis; fibre length, linear density, crimp and finish; preparation sequence; optional treatment status; moisture basis; output form; facility and geography; technology; reporting period; allocation; upstream datasets; data owner; review state"
  required_quality_disclosure: "Foreground versus secondary values; instrument and calibration status; temporal and route coverage; mass, water and stock reconciliation; aggregation rationale; allocation method; missing UUIDs; estimate register; source versions; abnormal periods; completeness gaps and uncertainty"
  update_trigger: "New foreground measurements or reviewed range evidence; resolution of inventory-flow UUIDs; change in polymer, blend, recovered-content basis, auxiliary chemistry, equipment, process sequence, dust control, wet/thermal treatment, packaging, allocation, upstream dataset, regulation, BAT conclusion, classification or reference-flow semantics"
data_sources:
  - id: "un-cpc-v3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 Explanatory Notes, code 26210, 30 June 2025, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf, retrieved 2026-08-12"
    used_for: "Official category identity, processed-for-spinning state and separation from artificial staple fibre and man-made-fibre yarn"
  - id: "ec-jrc-txt-bref-2023"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Best Available Techniques Reference Document for the Textiles Industry, TXT BREF, 2023, https://bureau-industrial-transformation.jrc.ec.europa.eu/reference/textiles-industry, retrieved 2026-08-12"
    used_for: "Process decomposition, polymer- and route-conditioning, preparation agents, boundary between fibre preparation, yarn manufacture and fabric production"
  - id: "eu-textiles-bat-2022"
    type: "official_guidance"
    reference: "Commission Implementing Decision (EU) 2022/2508 establishing BAT conclusions for the textiles industry, ELI http://data.europa.eu/eli/dec_impl/2022/2508/oj, retrieved 2026-08-12"
    used_for: "Input-output inventory, energy, water, chemicals, waste, emissions, monitoring and management requirements for applicable operations"
  - id: "ifc-textile-ehs-2007"
    type: "official_guidance"
    reference: "International Finance Corporation, Environmental, Health, and Safety Guidelines for Textile Manufacturing, 30 April 2007, https://www.ifc.org/content/dam/ifc/doc/2000/2007-textiles-manufacturing-ehs-guidelines-en.pdf, retrieved 2026-08-12"
    used_for: "Synthetic staple-fibre and yarn-process distinction, man-made fibre families, dust sources and enclosure, extraction and filtration controls"
  - id: "eu-pef-method-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on the use of the Environmental Footprint methods, Annex I Product Environmental Footprint Method, ELI http://data.europa.eu/eli/reco/2021/2279/oj, retrieved 2026-08-12"
    used_for: "Functional unit normalization, company-specific input-output data, data quality, subdivision and allocation hierarchy"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management - Life cycle assessment - Requirements and guidelines, including Amendments 1:2017 and 2:2020, https://www.iso.org/standard/38498.html, retrieved 2026-08-12"
    used_for: "LCA and LCI requirements, reporting framework and allocation hierarchy referenced by the EU PEF method"
