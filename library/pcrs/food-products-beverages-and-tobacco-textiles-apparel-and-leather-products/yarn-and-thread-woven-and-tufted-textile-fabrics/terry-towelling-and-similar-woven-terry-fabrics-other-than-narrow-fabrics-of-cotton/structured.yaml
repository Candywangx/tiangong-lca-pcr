      record_type: "receiving and issue records"
      raw_fields: "lot id; yarn count; cotton composition; gross and tare mass; moisture basis; issued mass"
      collection_method: "calibrated scale and inventory issue record"
      unit: "kg"
      frequency: "per lot"
      temporal_coverage: "reporting period"
      site_scope: "sizing line"
      aggregation_rule: "sum accepted issued mass and normalize to sized-yarn or finished-fabric output"
      quality_evidence: "calibration record; supplier lot record; stock reconciliation"
    - protocol_id: cp_sizing_chemical_records
      process_id: "yarn_preparation_and_sizing"
