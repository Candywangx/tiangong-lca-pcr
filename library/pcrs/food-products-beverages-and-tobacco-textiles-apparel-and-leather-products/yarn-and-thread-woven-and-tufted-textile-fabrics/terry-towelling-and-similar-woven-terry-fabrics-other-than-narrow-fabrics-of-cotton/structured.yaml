allocation_rules:
  - rule_id: avoid_allocation_by_subdivision
    applies_to: "production lots and separately metered operations"
    rule: "Subdivide and directly assign yarn, chemicals, utilities, wastewater, scrap, and rejects to the production lot before applying any allocation."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-lca-detailed-2010
  - rule_id: classify_cotton_scrap_before_allocation
    applies_to: "cotton yarn, selvage, and fabric scrap"
    rule: "Record the actual destination and classify the output as waste or co-product before modelling any burden or credit."
    source_ids:
      - jrc-ilcd-lca-detailed-2010
  - rule_id: physical_allocation_if_unavoidable
    applies_to: "inseparable fabric co-products with a common physical function"
    rule: "If subdivision is impossible and allocation remains necessary, use measured dry mass and disclose the allocation fraction and sensitivity; do not allocate wastewater or emissions away from the generating process."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-lca-detailed-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_yarn_material_records
      process_id: "yarn_preparation_and_sizing"
