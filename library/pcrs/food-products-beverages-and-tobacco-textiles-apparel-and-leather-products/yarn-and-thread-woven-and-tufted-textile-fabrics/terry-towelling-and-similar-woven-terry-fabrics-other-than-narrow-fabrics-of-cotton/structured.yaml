      frequency: "per shift or lot"
      temporal_coverage: "reporting period"
      site_scope: "finishing and drying line"
      aggregation_rule: "subtract readings and convert fuel to energy with a documented lot or supplier heating value"
      quality_evidence: "meter calibration; invoice; conversion worksheet"
    - protocol_id: cp_finishing_output_records
      process_id: "finishing_and_drying"
      flow_role: "accepted finished fabric and rejected fabric"
      record_type: "final inspection records"
      raw_fields: "roll id; accepted mass; rejected mass; moisture basis; width; areal mass; colour; finish; destination"
      collection_method: "calibrated roll scale and final inspection system"
      unit: "kg"
      frequency: "per roll"
      temporal_coverage: "reporting period"
      site_scope: "finishing line"
      aggregation_rule: "sum accepted reference output and rejected output separately"
      quality_evidence: "calibration record; inspection record; mass reconciliation"
  calculation_rules:
    - id: normalize_exchange_to_reference_mass
      applies_to: "every foreground exchange"
      rule: "measured exchange amount divided by accepted finished fabric mass for the same reconciled production lots"
      inputs:
        - "protocol-specific exchange record"
        - cp_finishing_output_records
      output: "exchange amount per 1 kg finished fabric"
      source_ids:
        - iso-14044-2006
        - jrc-ilcd-lca-detailed-2010
    - id: convert_area_record_to_mass
      applies_to: "area-metered fabric"
      rule: "measured area multiplied by lot-specific measured areal mass; retain both measurements and the moisture basis"
      inputs:
        - "area record"
        - "areal-mass test"
        - "width record"
      output: "kg fabric"
      source_ids:
        - jrc-ilcd-flow-format-1-1
    - id: reconcile_fabric_mass
      applies_to: "each production stage"
      rule: "opening work in progress plus measured inputs minus closing work in progress equals accepted output plus rejected output plus measured losses; disclose any residual"
      inputs:
        - "material issue"
        - transfer
        - output
        - scrap
        - "inventory records"
      output: "stage mass-balance reconciliation"
      source_ids:
        - jrc-ilcd-lca-detailed-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and intermediates"
      requirement: "Preserve product code, cotton composition, terry construction, width class, colour state, finish, lot id, and moisture basis across process transfers."
      evidence: "linked lot, roll, recipe, and inspection records"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use one declared reporting period and document shutdowns, trial lots, rework, and changes in recipe or technology."
      evidence: "production calendar and batch logs"
    - id: dq_measurement
      applies_to: "meters and scales"
      requirement: "Record instrument id, unit, calibration status, reading interval, and any shared-meter allocation basis."
      evidence: "calibration certificates and meter logs"
    - id: dq_completeness
      applies_to: "materials, utilities, wastewater, scrap, and rejects"
      requirement: "Reconcile every listed process and disclose absent or unmeasured exchanges; a missing UUID does not permit omission of a measured exchange."
      evidence: "stage mass balance, purchase reconciliation, waste and discharge records"
    - id: dq_representativeness
      applies_to: "upstream links"
      requirement: "Match geography, technology, energy carrier, water service, chemical formulation, and reference year to the foreground route or disclose the mismatch."
      evidence: "upstream dataset metadata and gap assessment"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "the reference output uses UUID 61be29ff-288e-4570-8335-4e03760c9255, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, and is exactly classified as CPC 3.0 26840;"
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "all required qualifiers and the plant-gate boundary are declared, including cotton composition, terry construction, width class, colour state, finish, moisture basis, geography, and technology;"
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "every required process is present and reactive_dyeing is present if and only if the declared route uses reactive dyeing;"
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "every inventory card represents one concrete exchange, each alternative dye or chemical is a separate row, and no collection label substitutes for a flow identity;"
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "all empirical quantities come from linked foreground records and no AI-authored or unsupported numeric range is used;"
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "every unresolved Tiangong UUID remains absent and is reported by row_id; a UUID may be added only after hybrid discovery and state-100 direct readback of flow type, semantic identity, property, and unit;"
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "mass transfers, accepted output, scrap, rejects, and work in progress reconcile for each production stage or the residual is quantified and explained;"
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "wastewater destinations, on-site treatment, direct-heating fuel use, measured direct emissions, rework, and excluded stages are disclosed;"
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "allocation is avoided by subdivision where possible, and any remaining allocation follows the declared rule and includes its fraction and sensitivity;"
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "source ids, collection protocols, calculation rules, and quality evidence resolve to the records declared in this PCR."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "finished cotton terry towelling fabric datasets matching CPC 26840, the declared plant gate, and all required qualifiers"
  excluded_use: "narrow fabrics; non-cotton terry; towel articles; routes omitting applicable wet processing; use-stage laundering or cradle-to-grave claims without added processes"
  required_metadata: "reference UUID and Mass UUID; CPC code; cotton composition; yarn count; terry construction; width; areal mass; colour state; finish; moisture basis; geography; technology; reporting period; route; allocation; upstream links"
  required_quality_disclosure: "foreground coverage; instrument calibration; shared-meter allocations; mass-balance residuals; unresolved UUIDs and ranges; upstream representativeness; wastewater and waste destinations"
  update_trigger: "material change in reference identity, CPC scope, yarn source, sizing system, weaving technology, wet-processing recipe, colour or finish route, energy system, wastewater treatment, geography, reporting period, or data quality"
data_sources:
  - id: "un-cpc-3-26840"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/26840"
    used_for: "exact product-category scope and exclusions"
  - id: "jrc-ilcd-flow-format-1-1"
    type: "official_guidance"
    reference: "https://eplca.jrc.ec.europa.eu/LCDN/downloads/ILCD_Format_1.1_Documentation/ILCD_FlowDataSet.html"
    used_for: "flow name, route qualifiers, reference property, and unit documentation"
  - id: "jrc-ilcd-process-format-1-1"
    type: "official_guidance"
