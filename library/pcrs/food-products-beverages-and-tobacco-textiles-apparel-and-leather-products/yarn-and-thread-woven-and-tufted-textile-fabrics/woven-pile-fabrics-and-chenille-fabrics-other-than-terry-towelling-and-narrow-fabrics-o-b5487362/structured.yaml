system_boundary:
  rules:
    - rule_id: boundary_foreground_operations
      applies_to: "foreground mill operations"
      rule: "Include all site-controlled yarn preparation, pile or chenille weaving, wet processing, finishing, inspection, rework, utility use, wastewater handling, waste generation, and packing that occur before mill-gate release."
      source_ids:
        - jrc-textiles-bref-2023
        - eu-textiles-bat-2022
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased products and services"
      rule: "Keep every purchased yarn, chemical, energy carrier, water supply, packaging component, and externally treated waste visible as an input or output linked to an upstream or downstream dataset; do not absorb it into an undocumented cut-off."
      source_ids:
        - eu-textiles-bat-2022
    - rule_id: boundary_route_disclosure
      applies_to: "route-specific operations"
      rule: "Include pretreatment, dyeing, washing, drying, heat-setting, coating, printing, or other finishing only when performed for the declared product route, and explicitly mark absent operations as not applicable."
      source_ids:
        - jrc-textiles-bref-2023
        - eu-textiles-bat-2022
    - rule_id: boundary_excluded_stages
      applies_to: "cradle-to-mill-gate foreground package"
      rule: "Exclude polymer and man-made-fibre manufacture, yarn manufacture, garment conversion, distribution after the mill gate, use, and end of life from the foreground boundary; connect included purchased yarn to upstream datasets."
      source_ids:
        - unsd-cpc-26820
        - eu-textiles-bat-2022
