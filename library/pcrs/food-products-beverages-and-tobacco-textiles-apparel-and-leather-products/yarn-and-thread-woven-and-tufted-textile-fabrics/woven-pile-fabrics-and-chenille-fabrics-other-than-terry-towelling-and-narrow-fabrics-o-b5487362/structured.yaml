allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "independently measurable products, routes, or batches"
    rule: "Avoid allocation by separating meters, recipes, batches, rework, waste treatment, and route-specific operations whenever the underlying records permit subdivision."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_reuse_closed_loop
    applies_to: "internal rework returned to the same product route"
    rule: "Keep internally reworked fabric inside the batch mass balance and do not count it as both waste output and new product input."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_physical_fallback
    applies_to: "unavoidable shared foreground burdens"
    rule: "If subdivision is not practicable, use a documented physical relationship that reflects the shared operation; use dry product mass only when no more causal physical parameter is available, and disclose sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_recycling_no_avoided_burden
    applies_to: "fabric, yarn, sludge, or packaging waste sent to recovery"
    rule: "Report the waste output and treatment destination without an avoided-product credit unless the downstream study applies a separately declared recycling method."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "pile_or_chenille_weaving"
      flow_role: "yarn inputs"
      record_type: "purchase receipt, issue, return, inventory adjustment"
      raw_fields: "material_id; polymer; filament_or_staple; blend; yarn_count; recycled_content; issued_mass; returned_mass; batch_id"
      collection_method: "reconcile warehouse issues and returns to the production batch"
      unit: "kg"
      frequency: "each issue and return"
      temporal_coverage: "complete batch or campaign"
      site_scope: "all yarn stores serving the route"
      aggregation_rule: "sum accepted issues minus unused returns by material identity"
      quality_evidence: "signed issue/return records and stock reconciliation"
    - protocol_id: cp_metered_electricity
      process_id: "all_applicable_processes"
      flow_role: "grid electricity"
      record_type: "electricity meter or submeter"
      raw_fields: "meter_id; start; end; multiplier; timestamp; process_scope; downtime"
      collection_method: "read calibrated meters and allocate only documented shared loads"
      unit: "kWh"
      frequency: "at least each batch shift or billing interval"
      temporal_coverage: "representative reporting period covering all declared routes"
      site_scope: "all included production and abatement equipment"
      aggregation_rule: "net reading minus excluded loads, normalized to conforming output"
      quality_evidence: "calibration status, meter photographs or export, and allocation worksheet"
    - protocol_id: cp_product_output
      process_id: "all_applicable_processes"
      flow_role: "intermediate and final fabric output"
      record_type: "scale, roll ticket, area and mass-per-area test"
      raw_fields: "roll_id; batch_id; gross_mass; tare_mass; usable_width; length; mass_per_area; moisture_basis; quality_status"
      collection_method: "weigh accepted rolls; use area conversion only with batch-specific test results"
      unit: "kg"
      frequency: "each roll or batch"
      temporal_coverage: "complete batch or campaign"
      site_scope: "all included lines and inspection stations"
      aggregation_rule: "accepted net dry mass by process output and final quality status"
      quality_evidence: "scale calibration, roll tickets, test report, rejection log"
    - protocol_id: cp_waste_mass
      process_id: "all_applicable_processes"
      flow_role: "yarn waste, offcuts, and sludge"
      record_type: "scale ticket and waste manifest"
      raw_fields: "waste_id; material; wet_mass; dry_solids; container_tare; destination; date; batch_id"
      collection_method: "weigh each waste stream and retain destination evidence"
      unit: "kg"
      frequency: "each dispatch or batch"
      temporal_coverage: "complete reporting period"
      site_scope: "all included operations and on-site treatment"
      aggregation_rule: "net mass by atomic waste identity and destination"
      quality_evidence: "calibrated scale record, manifest, laboratory solids test when relevant"
    - protocol_id: cp_emission_monitoring
      process_id: "all_applicable_processes"
      flow_role: "air emissions"
      record_type: "stack or workplace-exhaust test and operating log"
      raw_fields: "pollutant; method; concentration; gas_flow; duration; compartment; operating_state; batch_output"
      collection_method: "apply the declared approved measurement or engineering method"
      unit: "kg"
      frequency: "permit frequency and representative campaigns"
      temporal_coverage: "cover normal and relevant non-normal operations"
      site_scope: "every included emission point"
      aggregation_rule: "concentration times flow times duration, normalized to output"
      quality_evidence: "laboratory report, sampling plan, calibration, operating log"
    - protocol_id: cp_process_water
      process_id: "wet_processing_and_chemical_finishing"
      flow_role: "process water"
      record_type: "meter, tank, or validated water balance"
      raw_fields: "source; meter_id; start; end; tank_change; operation; batch_id"
      collection_method: "meter water by operation; balance only when direct metering is unavailable"
      unit: "m3"
      frequency: "each batch or daily"
      temporal_coverage: "complete wet-processing route"
      site_scope: "all included wet operations"
      aggregation_rule: "net process water excluding separately measured non-process uses"
      quality_evidence: "meter calibration and water-balance closure"
    - protocol_id: cp_thermal_energy
      process_id: "wet_processing_and_chemical_finishing"
      flow_role: "purchased steam"
      record_type: "steam meter and condensate record"
      raw_fields: "steam_mass_or_energy; pressure; enthalpy_basis; condensate_return; meter_id; operation"
      collection_method: "read calibrated steam meter and apply declared condensate accounting"
      unit: "MJ"
      frequency: "each batch or daily"
      temporal_coverage: "complete wet-processing route"
      site_scope: "all included thermal operations"
      aggregation_rule: "net delivered energy normalized to dry process output"
      quality_evidence: "meter calibration and energy-balance worksheet"
    - protocol_id: cp_recipe_chemical
      process_id: "wet_processing_and_chemical_finishing"
      flow_role: "one recipe chemical per row"
      record_type: "approved recipe, dosing log, stock issue, supplier specification"
      raw_fields: "product_id; supplier; batch; concentration; active_content; issued_mass; returned_mass; operation"
      collection_method: "reconcile approved recipe with actual dosing and returns"
      unit: "kg supplied product"
      frequency: "each batch"
      temporal_coverage: "all included recipe variants"
      site_scope: "all included wet-processing and finishing equipment"
      aggregation_rule: "sum net dosed mass for each commercial product identity"
      quality_evidence: "recipe approval, dosing record, SDS or technical data sheet"
    - protocol_id: cp_wastewater_discharge
      process_id: "wet_processing_and_chemical_finishing"
      flow_role: "textile wastewater"
      record_type: "discharge meter and treatment-transfer record"
      raw_fields: "meter_id; volume; date; route; destination; batch_or_period"
      collection_method: "measure wastewater at each declared treatment boundary"
      unit: "m3"
      frequency: "continuous or daily"
      temporal_coverage: "complete reporting period"
      site_scope: "all included wet-processing discharges"
      aggregation_rule: "sum by discharge route without mixing clean water"
      quality_evidence: "meter calibration, transfer record, water-balance closure"
    - protocol_id: cp_packaging_mass
      process_id: "inspection_and_packing"
      flow_role: "one packaging component per row"
      record_type: "issue record, item count, unit-mass test"
      raw_fields: "component_id; material; recycled_content; count; unit_mass; returned_quantity; batch_id"
      collection_method: "weigh issued packaging or multiply count by verified unit mass"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete dispatch batch"
      site_scope: "all packing stations for the product"
      aggregation_rule: "net issued mass by component identity"
      quality_evidence: "scale calibration, unit-mass test, issue and return records"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "all inventory rows"
      rule: "normalized amount = included batch amount / net kg conforming finished reference product"
      inputs:
        - "atomic exchange amount"
        - "accepted product mass"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calc_area_to_mass
      applies_to: "area-recorded fabric"
      rule: "fabric mass = usable length × usable width × measured batch mass per area; do not use nominal catalogue mass per area"
      inputs:
        - "usable length"
        - "usable width"
        - "measured mass per area"
      output: "kg fabric"
      source_ids: []
    - id: calc_active_content_disclosure
      applies_to: "formulated chemicals"
      rule: "active-substance mass = net supplied formulation mass × supplier-declared active fraction; retain supplied-product mass as the inventory exchange unless the selected flow explicitly represents active substance"
      inputs:
        - "formulation mass"
        - "active fraction"
      output: "kg active substance as supplementary disclosure"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_air_emission_mass
      applies_to: "measured channelled air emissions"
      rule: "emitted mass = measured concentration × dry standardized gas flow × operating duration, with unit and moisture corrections documented"
      inputs:
        - concentration
        - "gas flow"
        - duration
        - "correction factors"
      output: "kg pollutant to declared air compartment"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_mass_balance_check
      applies_to: "each batch and process"
      rule: "inputs + opening work-in-process = conforming output + wastes + closing work-in-process + documented mass changes; investigate unexplained residuals rather than allocating them silently"
      inputs:
        - "material issues"
        - returns
        - outputs
        - wastes
        - WIP
        - "moisture change"
      output: "disclosed mass-balance residual"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Demonstrate exact CPC 26820 scope and disclose fibre polymer, blend, construction, finish, width, mass per area, moisture basis, and quality grade."
      evidence: "product specification, bill of materials, roll ticket, classification review"
    - id: dq_temporal_representativeness
      applies_to: "all foreground records"
      requirement: "Cover a representative period including every declared route and explain shutdowns, trial batches, rework, and abnormal operations."
      evidence: "dated meter exports, batch list, production calendar, exception log"
    - id: dq_recipe_completeness
      applies_to: "wet processing"
      requirement: "Reconcile actual dosing to the approved recipe by individual commercial chemical; do not report an aggregate chemicals row."
      evidence: "recipe, dosing log, stock reconciliation, supplier specification"
    - id: dq_meter_quality
      applies_to: "water and energy"
      requirement: "Identify meter boundary, calibration status, shared-load allocation, and excluded uses."
      evidence: "calibration certificate, meter map, allocation worksheet"
    - id: dq_waste_and_emission_destination
      applies_to: "wastes, wastewater, and emissions"
      requirement: "Preserve physical identity, compartment or destination, treatment route, measurement method, and dry/wet basis where applicable."
      evidence: "manifests, discharge records, laboratory reports, monitoring plan"
    - id: dq_uuid_resolution
      applies_to: "every UUID-bearing row"
      requirement: "Use a Tiangong UUID only after hybrid search and direct row read confirm exact semantics, flow type, reference property/unit, and required qualifiers; otherwise keep the atomic name and unresolved status."
      evidence: "identity review recorded in manifest metadata"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
    rule: "Confirm UUID cb5fb579-ee14-4546-9d47-0a088d4dda76, Product flow type, public state, exact CPC 26820 classification, Mass property, kg unit, and all required product qualifiers."
    source_ids:
      - unsd-cpc-26820
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Reject combined or selector exchanges; every yarn, chemical formulation, energy carrier, water stream, packaging component, waste, wastewater stream, and elementary emission must occupy its own row."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_route_completeness
    applies_to: "system boundary and process map"
    rule: "Reconcile the declared route to production records and include every performed pretreatment, dyeing, washing, drying, heat-setting, finishing, rework, abatement, wastewater, and packing operation."
    source_ids:
      - jrc-textiles-bref-2023
      - eu-textiles-bat-2022
  - rule_id: validate_foreground_amounts
    applies_to: "all quantitative inventory rows"
    rule: "Reject AI estimates and undocumented default ranges; amounts must be foreground records or calculations from declared collection protocols."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "each production batch"
    rule: "Reconcile yarn and chemical-carrier mass, intermediate and final product mass, wastes, work-in-process, and documented moisture changes; disclose and investigate residuals."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "shared operations and rework"
    rule: "Verify subdivision was attempted first, internal rework was not double counted, the chosen physical relation was justified, and any recycling method was disclosed separately."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_uuid_evidence
    applies_to: "UUID-bearing exchanges"
    rule: "Reject every UUID that lacks both hybrid-search candidate evidence and direct Tiangong row readback for exact semantics and reference property/unit."
    source_ids: []
  - rule_id: validate_bilingual_alignment
    applies_to: "PCR rendering"
    rule: "Confirm identical ordered process IDs, row IDs, rule IDs, source IDs, confirmed UUIDs, machine tokens, and row sequence in English and Chinese."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production data package for finished CPC 26820 fabric at the mill gate"
  downstream_use: "May be projected as a secondary_dataset or background_dataset after methodology, identity, source, and quality review"
  allowed_use: "Product-footprint and life-cycle models needing a declared man-made-fibre woven pile or chenille fabric route with compatible geography, technology, construction, and finish"
  excluded_use: "Terry towelling, narrow fabrics, cotton-only products, other-fibre CPC 26830 fabrics, knitted or nonwoven textiles, generic textile proxies, or products whose wet-processing and finish route is unknown"
  required_metadata: "CPC code; product UUID; fibre polymer and blend; filament/staple form; construction; width; mass per area; moisture basis; colour and finish; recycled content; route; included and outsourced operations; site and geography; period; allocation; waste destinations; resolved and unresolved identities"
  required_quality_disclosure: "Coverage and calibration of foreground records; recipe reconciliation; mass-balance residual; meter allocation; emission methods; route representativeness; unresolved UUIDs; cut-offs; rework; deviations from this PCR"
  update_trigger: "Change in fibre or blend, construction, dye or finish recipe, wet-processing route, energy or water system, abatement, waste destination, packaging, site, geography, supplier datasets, allocation, or a material change in production efficiency"
