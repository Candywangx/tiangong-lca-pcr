allocation_rules:
  - rule_id: allocation_avoid_by_separation
    applies_to: "all foreground exchanges"
    rule: "Avoid allocation by using batch-specific material, electricity, product, and waste records and by subdividing separately metered or separately weighed operations."
    source_ids:
      - iso-14044-2006
      - eu-bat-textiles-2022
  - rule_id: allocation_shared_electricity
    applies_to: "shared electricity meters"
    rule: "When subdivision is not feasible, allocate metered electricity to the batch using documented machine operating time and measured equipment power or another demonstrated physical causal parameter; disclose the method and retain the calculation inputs."
    source_ids:
      - iso-14044-2006
      - jrc-textiles-bref-2023
  - rule_id: allocation_no_avoided_burden
    applies_to: "yarn and packaging waste"
    rule: "Report each waste stream and destination as a foreground waste output. Do not credit avoided virgin production or downstream recycling inside this foreground process; model downstream treatment in the linked waste-management system."
    source_ids:
      - jrc-textiles-bref-2023
dataset_production:
  collection_protocols:
    - protocol_id: cp_yarn_mass_balance
      process_id: "retail_winding_packaging"
      flow_role: "received_nonretail_filament_yarn; retail_product"
      record_type: "scale and batch production records"
      raw_fields: "lot_id; batch_id; fibre_family; composition; construction; linear_density; colour_finish; opening_wip_mass; received_net_mass; closing_wip_mass; product_gross_mass; product_tare_mass; product_net_mass"
      collection_method: "Calibrated scale readings tied to lot and batch identifiers; retain gross, tare, and net records."
      unit: "kg"
      frequency: "every lot and batch"
      temporal_coverage: "complete reporting period with no omitted production batch"
      site_scope: "all retail-winding lines in the declared foreground site"
      aggregation_rule: "sum by batch, reconcile work-in-progress, then normalize to conforming net yarn output"
      quality_evidence: "scale calibration status; signed batch record; lot traceability; gross-tare-net reconciliation"
    - protocol_id: cp_electricity_metering
      process_id: "retail_winding_packaging"
      flow_role: "cn_medium_voltage_electricity"
      record_type: "electricity meter and machine-operation records"
      raw_fields: "meter_id; start_reading; end_reading; recorded_unit; reading_time; machine_id; operating_time; batch_id; allocation_parameter"
      collection_method: "Prefer a dedicated submeter; otherwise use a documented physical allocation from the site meter to the batch."
      unit: "native meter unit and MJ after conversion"
      frequency: "each batch or shift with batch linkage"
      temporal_coverage: "complete reporting period including start-up, shutdown, and idle energy assigned by the declared rule"
      site_scope: "all winding, conveying, labelling, and film-packing equipment inside the foreground boundary"
      aggregation_rule: "subtract sequential readings, allocate only when needed, convert auditably to MJ, and normalize to net yarn output"
      quality_evidence: "meter identifier and calibration; reading evidence; operating log; conversion factor provenance; allocation calculation"
    - protocol_id: cp_packaging_components
      process_id: "retail_winding_packaging"
      flow_role: "paperboard_yarn_core; paper_retail_label; ldpe_retail_packaging_film"
      record_type: "stores issue, return, supplier specification, and representative weighing records"
      raw_fields: "component_id; material; supplier_lot; issued_count_or_mass; returned_unused_count_or_mass; sampled_unit_mass; incorporated_count; batch_id"
      collection_method: "Reconcile issued and returned components; determine component mass by direct weighing or count multiplied by a current measured representative unit mass."
      unit: "count and kg"
      frequency: "every packaging lot and production batch"
      temporal_coverage: "complete reporting period"
      site_scope: "all packaging stations inside the foreground site"
      aggregation_rule: "calculate each material and component separately and normalize incorporated mass to net yarn output"
      quality_evidence: "supplier specification; sample-weighing record; scale calibration; issue-return reconciliation"
    - protocol_id: cp_waste_tracking
      process_id: "retail_winding_packaging"
      flow_role: "filament_yarn_winding_waste; waste_paperboard_yarn_core; waste_ldpe_packaging_film"
      record_type: "segregated waste weighing and destination records"
      raw_fields: "waste_row_id; batch_id; container_tare; gross_mass; net_mass; material_identity; destination; transfer_date; transfer_record"
      collection_method: "Segregate and weigh each named waste stream; prohibit cross-material aggregation."
      unit: "kg"
      frequency: "every waste container and batch allocation"
      temporal_coverage: "complete reporting period"
      site_scope: "all waste generation points inside the foreground boundary"
      aggregation_rule: "sum each row_id by batch and normalize to net yarn output without avoided-burden credit"
      quality_evidence: "scale calibration; container label; transfer note; recycler or disposal receipt"
  calculation_rules:
    - id: calc_net_yarn_output
      applies_to: "retail_product"
      rule: "Sum package gross mass minus separately measured package tare mass; exclude all paperboard, label, film, and other packaging."
      inputs:
        - product_gross_mass
        - product_tare_mass
        - batch_id
      output: "product_net_mass in kg"
      source_ids:
        - unsd-cpc-3-0-structure-2025
    - id: calc_yarn_mass_reconciliation
      applies_to: "received yarn and yarn waste"
      rule: "Opening work-in-progress plus received net yarn minus closing work-in-progress must reconcile with net conforming yarn output plus separately measured man-made filament yarn waste; retain and explain any residual."
      inputs:
        - opening_wip_mass
        - received_net_mass
        - closing_wip_mass
        - product_net_mass
        - filament_yarn_waste_mass
      output: "batch mass-balance residual in kg"
      source_ids:
        - eu-bat-textiles-2022
    - id: calc_packaging_component_mass
      applies_to: "each packaging input"
      rule: "Issued mass minus returned unused mass minus separately measured same-material foreground waste equals mass incorporated into the delivered retail packages; calculate each material separately."
      inputs:
        - issued_count_or_mass
        - returned_unused_count_or_mass
        - sampled_unit_mass
        - same_material_waste_mass
      output: "incorporated component mass in kg"
      source_ids:
        - eu-bat-textiles-2022
    - id: calc_electricity_normalization
      applies_to: "cn_medium_voltage_electricity"
      rule: "Subtract meter readings, apply the documented native-unit-to-MJ conversion, allocate only by the declared physical parameter when a dedicated meter is unavailable, and divide by measured net yarn output."
      inputs:
        - start_reading
        - end_reading
        - recorded_unit
        - conversion_factor
        - allocation_parameter
        - product_net_mass
      output: "MJ per kg net yarn"
      source_ids:
        - jrc-textiles-bref-2023
        - eu-bat-textiles-2022
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "received and retail yarn"
      requirement: "Preserve lot-level linkage between received yarn and retail output, including fibre family, composition, filament form, construction, linear density, colour and finish, and upstream dataset reference."
      evidence: "purchase specification; certificate or lot sheet; batch genealogy; upstream dataset identifier"
    - id: dq_measurement_control
      applies_to: "mass and electricity records"
      requirement: "Use identified measuring equipment with current calibration or verification status; retain native readings and prohibit undocumented unit conversion."
      evidence: "calibration certificate or verification log; meter export; scale record; conversion record"
    - id: dq_temporal_completeness
      applies_to: "foreground reporting period"
      requirement: "Include every production batch, packaging lot, start-up, shutdown, reject, and waste transfer inside the declared period, or disclose and quantify each gap."
      evidence: "production schedule; batch register; stores ledger; meter continuity check; waste register"
    - id: dq_geographic_match
      applies_to: "electricity"
      requirement: "Use the selected CN 1-35 kV consumption-mix flow only for a China foreground site supplied at the declared voltage range."
      evidence: "site address; supply contract or meter specification; selected flow UUID"
    - id: dq_zero_and_absence_evidence
      applies_to: "LDPE film and waste rows"
      requirement: "A zero amount is valid only when a batch record, bill of materials, or segregated waste record demonstrates absence; blank values are not zero."
      evidence: "bill of materials; issue-return record; waste log; signed batch record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require product UUID 561c51b1-b4f9-4eea-b081-e096bf93820b, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and reference unit kg."
    source_ids:
      - unsd-cpc-3-0-structure-2025
  - rule_id: validate_required_qualifiers
    applies_to: "reference product"
    rule: "Reject a foreground package that omits any required fibre, construction, linear-density, finishing, package-form, net-mass, geography, or electricity-scenario qualifier."
    source_ids:
      - iso-1144-2016
      - unsd-cpc-3-0-structure-2025
  - rule_id: validate_foreground_boundary
    applies_to: "process scope"
    rule: "Reject double counting of upstream polymer, filament, texturing, twisting, dyeing, or finishing burdens in retail_winding_packaging; require the upstream received-yarn dataset and boundary disclosure."
    source_ids:
      - jrc-textiles-bref-2023
      - iso-14044-2006
  - rule_id: validate_atomic_inventory
    applies_to: "inventory rows"
    rule: "Require one physical or chemical exchange per row_id and require the bilingual files to preserve the same ordered row_id, flow type, UUID, and controlled machine fields."
    source_ids:
      - eu-bat-textiles-2022
  - rule_id: validate_yarn_mass_balance
    applies_to: "yarn inputs and outputs"
    rule: "Require the batch yarn mass reconciliation, an explained residual, and direct records for net product and yarn waste; do not substitute an estimated yield or loss range."
    source_ids:
      - eu-bat-textiles-2022
  - rule_id: validate_packaging_reconciliation
    applies_to: "packaging inputs and waste"
    rule: "Require separate mass reconciliation for paperboard core, paper label, and LDPE film, including evidence for any zero or absent film and separately identified waste."
    source_ids:
      - jrc-textiles-bref-2023
      - eu-bat-textiles-2022
  - rule_id: validate_electricity_scenario
    applies_to: "electricity"
    rule: "Require foreground electricity records and verify that the selected 1-35 kV CN consumption-mix flow matches the site geography and supply voltage; reject proxy use outside the declared scenario."
    source_ids:
      - jrc-textiles-bref-2023
      - eu-bat-textiles-2022
  - rule_id: validate_no_unresolved_uuid_as_match
    applies_to: "unresolved inventory identities"
    rule: "Keep an unresolved selected flow human-readable and atomic, but do not claim a Tiangong identity until a future hybrid search and public direct read confirm the exact flow type and semantics."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for the China retail winding and packaging of finished man-made filament yarn."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product systems requiring a China plant-gate dataset for the declared retail-winding and packaging route, with a separately linked, composition- and construction-matched upstream yarn dataset."
  excluded_use: "Non-China electricity scenarios; sewing thread; staple-fibre yarn; upstream filament manufacture or wet processing; distribution, use, or end-of-life; any dataset that lacks net yarn mass or the required product qualifiers."
  required_metadata: "PCR id and status; foreground site and period; upstream yarn dataset; all required qualifiers; net/gross/tare basis; package bill of materials; electricity flow UUID and voltage; allocation method; waste destinations; source ids; unresolved UUID disclosures."
  required_quality_disclosure: "Measurement and calibration evidence; temporal and batch coverage; mass-balance residual; packaging reconciliation; electricity metering or allocation; zero-value evidence; unresolved flow identities; deviations from the representative route."
  update_trigger: "Re-run identity review when Tiangong adds exact non-retail yarn, LDPE film, or matching waste flows; update the dataset when yarn composition or construction, package configuration, site, voltage, electricity supply, allocation method, reporting technology, or upstream dataset changes materially."
