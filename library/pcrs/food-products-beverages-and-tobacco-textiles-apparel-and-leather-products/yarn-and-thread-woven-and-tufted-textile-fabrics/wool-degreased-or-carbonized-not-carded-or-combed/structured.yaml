measurement_rules:
  - id: reference_dry_mass
    applies_to: "Reference product and all mass-normalized results"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report the reference amount as net dry mass. Measure gross/net output mass and moisture for the same batch; retain the moisture method and convert using dry_mass = wet_mass × (1 - moisture_mass_fraction). Do not mix as-delivered and dry-mass denominators."
  - id: mass_unit_conversion
    applies_to: "All material inputs, products, by-products and wastes"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve source records in their original units and convert to kg with documented factors; tonne-based indicators use 1 t = 1,000 kg."
  - id: water_accounting
    applies_to: "Scouring, rinsing, neutralization and cleaning water"
    required_property_ref:
      name: "Volume or mass, as metered"
      uuid: ""
    required_unit: "L or m3, with conversion stated"
    rule: "Separate gross intake, internally recycled water and discharged wastewater. Net freshwater consumption equals gross intake minus water returned from an external system, not internal recirculation; report internal reuse separately."
  - id: energy_accounting
    applies_to: "Electricity, steam, direct fuel and recovered heat"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ and kWh, with conversion stated"
    rule: "Record purchased electricity, fuels and steam separately. Do not add recovered internal heat as purchased energy; disclose direct versus indirect heating and convert to MJ only after preserving carrier-specific records."
  - id: chemical_solution_basis
    applies_to: "Detergent, alkali, mineral acid and neutralizing agents"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg active substance and kg solution"
    rule: "Record both delivered solution mass and concentration; calculate active-substance mass. Never average sulphuric-acid, gaseous-HCl, aluminium-chloride, sodium-acetate and ammonia routes."
