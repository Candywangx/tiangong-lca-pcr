allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "integrated_and_shared_operations"
    rule: "Avoid allocation first by submetering and subdividing scouring, recovery, carbonizing, wastewater treatment and shared utilities. If subdivision is not feasible, document whether system expansion is appropriate before applying allocation."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: allocation_recovered_grease
    applies_to: "recovered_wool_grease"
    rule: "Treat saleable recovered wool grease as a co-product, not as negative waste. Prefer direct measurement and subdivision of recovery operations. If residual shared burdens require allocation, use a documented physical relationship that reflects the operation; use economic allocation only when no defensible physical relationship exists and report a sensitivity case."
    source_ids:
      - eu-txt-bref-2023
      - eu-pef-2021-2279
  - rule_id: allocation_residues
    applies_to: "dirt_sludge_dust_and_wastewater"
    rule: "Assign handling and treatment burdens to the wool route that generated each residue. Do not give avoided-burden credit for composting, recycling, grease sale or other recovery unless the study applies an explicit, consistently documented system-expansion or substitution method."
    source_ids:
      - eu-txt-bat-2022-2508
      - eu-pef-2021-2279
  - rule_id: allocation_route_separation
    applies_to: "multiple_wool_routes_and_fineness_classes"
    rule: "Use production records to separate degreased and carbonized routes and wool-fineness classes. When a disclosed production-weighted mix is required, calculate from route-specific dry outputs and inventories; do not use an unweighted category average."
    source_ids:
      - eu-txt-bref-2023
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_mass_moisture
      process_id: "aqueous_scouring_and_drying_loose_fibre_carbonising"
      flow_role: "Incoming wool and saleable output mass, moisture and quality"
      record_type: "Weighbridge, calibrated scale and laboratory moisture/quality records"
      raw_fields: "lot_id; route; fibre_diameter_class; gross_mass; tare_mass; moisture_fraction; residual_grease; vegetable_matter; saleable_status"
      collection_method: "Weigh each input and output lot; sample moisture and quality with the declared site or contractual method; reconcile transfers between route modules"
      unit: "kg wet; kg dry; mass fraction; µm where reported"
      frequency: "Every lot or batch"
      temporal_coverage: "At least three consecutive representative production periods and the reporting year"
      site_scope: "Every facility and route in the dataset"
      aggregation_rule: "Convert each lot to dry mass, aggregate by route and fineness class, and divide only by matching saleable dry output"
      quality_evidence: "Scale calibration; sampling plan; laboratory method; rejected-lot log; mass reconciliation"
    - protocol_id: cp_water_balance
      process_id: "aqueous_scouring_and_drying_loose_fibre_carbonising"
      flow_role: "Gross water, internal recycle and wastewater volume"
      record_type: "Flow meters, tank changes and verified utility records"
      raw_fields: "meter_id; opening_reading; closing_reading; recycle_volume; purge_volume; cleaning_volume; route; batch_id"
      collection_method: "Meter key process locations; distinguish gross intake, internal recycle and discharge"
      unit: "L or m3"
      frequency: "Continuous or each batch; aggregate monthly"
      temporal_coverage: "Full reporting year or complete representative campaign"
      site_scope: "Each line and shared-water system"
      aggregation_rule: "Allocate shared water by measured run time and verified flow only when direct batch metering is unavailable; report gross, recycle and discharge separately"
      quality_evidence: "Meter calibration; water flow diagram; water mass balance; reconciliation to utility invoice"
    - protocol_id: cp_chemical_use
      process_id: "aqueous_scouring_and_drying_loose_fibre_carbonising"
      flow_role: "Detergent, builder, acid and neutralizing-agent use"
      record_type: "Dosing logs, batch sheets, tank inventory and purchase reconciliation"
      raw_fields: "chemical_id; supplier; formulation; concentration; opening_stock; receipts; closing_stock; dose; route; batch_id"
      collection_method: "Record delivered solution and active concentration; reconcile automated dosing and stock movement"
      unit: "kg solution; kg active substance"
      frequency: "Every batch; monthly reconciliation"
      temporal_coverage: "Full reporting year or complete representative campaign"
      site_scope: "Each line, chemical and route"
      aggregation_rule: "Calculate active mass per matching dry output; keep chemical alternatives separate"
      quality_evidence: "Calibrated dosing system; supplier SDS/specification; stock reconciliation; deviation log"
    - protocol_id: cp_energy_use
      process_id: "aqueous_scouring_and_drying_loose_fibre_carbonising"
      flow_role: "Electricity, fuel, steam and recovered heat"
      record_type: "Submeters, fuel meters, invoices and equipment logs"
      raw_fields: "carrier; meter_id; opening_reading; closing_reading; heating_mode; recovered_heat; run_time; route"
      collection_method: "Prefer line or equipment metering; allocate shared utility only with documented engineering drivers"
      unit: "kWh; MJ; kg steam; carrier unit"
      frequency: "Continuous or each batch; aggregate monthly"
      temporal_coverage: "Full reporting year or complete representative campaign"
      site_scope: "Each facility, line and route"
      aggregation_rule: "Preserve carriers; subtract no internal recovered heat from gross carrier records; report recovery separately"
      quality_evidence: "Meter calibration; invoice reconciliation; allocation workbook; operating-hour log"
    - protocol_id: cp_byproducts_and_waste
      process_id: "aqueous_scouring_and_drying_loose_fibre_carbonising"
      flow_role: "Recovered grease, dirt, sludge, carbonized particles, dust and rejects"
      record_type: "Calibrated scales, dispatch notes and dry-solids tests"
      raw_fields: "stream_id; route; gross_mass; tare_mass; moisture_or_dry_solids; destination; sale_or_waste_status; batch_id"
      collection_method: "Weigh each dispatch or container and determine moisture/dry solids for variable wet residues"
      unit: "kg wet; kg dry"
      frequency: "Every dispatch; aggregate monthly"
      temporal_coverage: "Full reporting year or complete representative campaign"
      site_scope: "Each facility, route and destination"
      aggregation_rule: "Aggregate saleable by-products separately from wastes and normalize dry mass to matching output"
      quality_evidence: "Scale calibration; dispatch note; destination certificate; dry-solids result"
    - protocol_id: cp_wastewater_monitoring
      process_id: "aqueous_scouring_and_drying_loose_fibre_carbonising"
      flow_role: "Wastewater volume and pollutant loads"
      record_type: "Flow-proportional monitoring and laboratory analysis at key locations"
      raw_fields: "stream_id; route; volume; pH; temperature; conductivity; COD_or_TOC; TSS; relevant_chemicals; sample_time; destination"
      collection_method: "Monitor key locations and calculate load as concentration × matched discharge volume; identify pre-treatment and final-treatment points"
      unit: "m3; mg/L; kg pollutant"
      frequency: "Flow continuously where material; laboratory frequency based on permit and process variability"
      temporal_coverage: "Full reporting year or complete representative campaign"
      site_scope: "Each material wastewater stream and final discharge/transfer point"
      aggregation_rule: "Sum measured loads by route; allocate shared final treatment with pre-treatment loads and volume, documenting the method"
      quality_evidence: "Meter calibration; chain of custody; accredited laboratory result; sampling plan; treatment transfer record"
    - protocol_id: cp_air_and_fuel_emissions
      process_id: "aqueous_scouring_and_drying_loose_fibre_carbonising"
      flow_role: "Direct combustion pollutants and carbonizing dust"
      record_type: "Stack testing, continuous monitors, fuel records, captured-dust mass balance and approved factors"
      raw_fields: "source_id; pollutant; concentration; flow; operating_time; fuel_use; factor; captured_dust; released_dust; route"
      collection_method: "Prefer direct measurement where required; otherwise calculate from measured fuel use and a cited jurisdiction-appropriate factor"
      unit: "kg pollutant; mg/Nm3; Nm3; kg fuel"
      frequency: "Permit frequency and each representative operating condition"
      temporal_coverage: "Full reporting year or complete representative campaign"
      site_scope: "Each direct emission point and route"
      aggregation_rule: "Calculate pollutant-specific mass, never aggregate pollutants for published inventory; separate captured waste from released emissions"
      quality_evidence: "Stack-test report; monitor calibration; factor reference; fuel reconciliation; dust-control maintenance log"
  calculation_rules:
    - id: calc_dry_mass
      applies_to: "All wool inputs and outputs"
      rule: "dry_mass_kg = net_wet_mass_kg × (1 - moisture_mass_fraction); use matched sample and weighing period."
      inputs:
        - net_wet_mass_kg
        - moisture_mass_fraction
      output: "dry_mass_kg"
      source_ids:
        - iso-14044-2006
    - id: calc_route_yield
      applies_to: "Each route and fibre class"
      rule: "dry_yield = saleable_output_dry_kg / matched_input_wool_dry_kg; report rejects and residues separately and do not mix routes or fineness classes."
      inputs:
        - saleable_output_dry_kg
        - matched_input_wool_dry_kg
      output: "dry_yield"
      source_ids:
        - eu-txt-bref-2023
    - id: calc_normalized_inventory
      applies_to: "Each foreground inventory row"
      rule: "normalized_amount = matched_period_amount / matched_saleable_output_dry_kg; keep original unit and conversion factor in evidence."
      inputs:
        - matched_period_amount
        - matched_saleable_output_dry_kg
        - conversion_factor
      output: "amount per kg dry reference output"
      source_ids:
        - iso-14044-2006
    - id: calc_water_balance
      applies_to: "Each route"
      rule: "Report gross intake, internal recycle and discharge separately; water_balance_difference = gross_intake - discharge - water_in_product_or_residue - measured_other_losses, with evaporation disclosed rather than forced to zero."
      inputs:
        - gross_intake
        - recycle_volume
        - discharge
        - water_in_product_or_residue
        - measured_other_losses
      output: "route water balance and reconciliation difference"
      source_ids:
        - eu-txt-bat-2022-2508
    - id: calc_grease_recovery_rate
      applies_to: "Aqueous scouring by wool-fineness class"
      rule: "grease_recovery_rate = recovered_saleable_grease_kg / raw_wool_input_t. Compare only matching classes: coarse wool typically above 35 µm uses 10-15 kg/t; extra-/super-fine wool typically below 20 µm uses 50-60 kg/t. For 20-35 µm or mixed/unknown classes, collect and report the rate without applying either interval."
      inputs:
        - recovered_saleable_grease_kg
        - raw_wool_input_t
        - fibre_diameter_class
      output: "kg recovered grease/t raw wool"
      source_ids:
        - eu-txt-bat-2022-2508
    - id: calc_carbonising_conditions
      applies_to: "Sulphuric-acid loose-fibre carbonizing"
      rule: "Record bath acid concentration, retained acid and water after hydroextraction, drying temperature, baking temperature and final pH. The BREF typical description is 6-9% mineral-acid solution, 5-7.5% sulphuric acid and 50-65% water retained after pressing/centrifugation, drying at 65-90 °C, baking at 105-130 °C and final pH 6; values outside these are flagged for explanation, not automatically overwritten."
      inputs:
        - bath_acid_percent
        - retained_acid_percent
        - retained_water_percent
        - drying_temperature
        - baking_temperature
        - final_pH
      output: "disclosed carbonizing-condition record and QA flag"
      source_ids:
        - eu-txt-bref-2023
    - id: calc_wastewater_load
      applies_to: "Each wastewater stream"
      rule: "load_kg = concentration_mg_per_L × discharge_volume_L / 1,000,000; sum only matched samples and volumes and state interpolation."
      inputs:
        - concentration_mg_per_L
        - discharge_volume_L
      output: "kg pollutant by stream and route"
      source_ids:
        - eu-txt-bat-2022-2508
    - id: calc_mass_reconciliation
      applies_to: "Each route"
      rule: "Reconcile dry wool input with saleable dry wool, recovered grease, dry residues, rejects and sampled losses. Investigate and disclose material imbalance; do not use a balancing flow to conceal missing records."
      inputs:
        - dry_wool_input
        - saleable_dry_output
        - recovered_grease
        - dry_residues
        - rejects
        - measured_losses
      output: "mass-balance difference and explanation"
      source_ids:
        - iso-14044-2006
        - eu-txt-bref-2023
  data_quality_requirements:
    - id: dq_route_identity
      applies_to: "Dataset identity"
      requirement: "Declare one route or a documented production-weighted mix, the process modules included, pure-sheep-wool status, fibre-diameter class and not-carded-or-combed state."
      evidence: "Product specification, process flow diagram, lot records and route-production totals"
    - id: dq_reference_uuid_limit
      applies_to: "Reference flow"
      requirement: "Use the verified Scoured Wool UUID. For carbonized output, state that it is a narrower degreased-route representative and no carbonized-specific UUID was verified."
      evidence: "Reference-flow metadata and manifest review limitation"
    - id: dq_temporal_representativeness
      applies_to: "Foreground data"
      requirement: "Cover a full reporting year where available; otherwise cover at least three consecutive representative production periods and disclose seasonality, shutdowns, abnormal conditions and exclusions."
      evidence: "Production calendar, meter coverage and exception log"
    - id: dq_mass_and_moisture
      applies_to: "Wool and solid streams"
      requirement: "Use calibrated weighing and matched moisture or dry-solids results; do not mix wet and dry masses. Complete route-level mass reconciliation."
      evidence: "Calibration certificates, sampling records, laboratory results and reconciliation workbook"
    - id: dq_water_energy_chemicals
      applies_to: "Major resource inputs"
      requirement: "Reconcile meters and dosing records to invoices or stock movement; preserve carrier and chemical identities and disclose shared-utility allocation."
      evidence: "Meter calibration, invoices, stock reconciliation and allocation workbook"
    - id: dq_emissions_wastewater
      applies_to: "Direct releases and transfers"
      requirement: "Use pollutant-specific records and matched flows; retain sampling location, method, laboratory, detection-limit treatment and wastewater destination."
      evidence: "Monitoring plan, chain of custody, analytical reports, permit records and transfer notes"
    - id: dq_estimate_replacement
      applies_to: "All reasoned_estimate ranges"
      requirement: "Use reasoned ranges only to flag records for review. Never populate missing foreground values from them. Replace them after three consecutive representative periods, after material process change, or before publication-critical comparison."
      evidence: "Range replacement log, reviewed site statistics or stronger external evidence"
    - id: dq_source_applicability
      applies_to: "External evidence"
      requirement: "Document whether each BREF/BAT statement is descriptive, typical or normative and whether installation scale and route match; do not turn a typical process description into an emission limit."
      evidence: "Source applicability note and reviewer approval"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "Fail when the reference product UUID, mass-property UUID, unit-group UUID or kg unit differs from this PCR. For carbonized_route, also fail when the narrower-identity limitation is absent."
    source_ids:
      - un-cpc-30-2025
  - rule_id: validate_route_process_set
    applies_to: "process_map_and_inventory"
    rule: "Fail when the declared route and included modules conflict: degreased requires scouring; integrated carbonized requires scouring plus carbonizing; carbonizing-only requires carbonizing and one upstream scoured-wool dataset."
    source_ids:
      - eu-txt-bref-2023
  - rule_id: validate_scope_qualifiers
    applies_to: "product_identity"
    rule: "Fail when route, sheep-wool fineness class, pure-wool status, incoming state, output moisture basis, residual grease/vegetable-matter specification or not-carded-or-combed state is missing; reject blends and downstream forms from this PCR."
    source_ids:
      - un-cpc-30-2025
      - eu-txt-bref-2023
  - rule_id: validate_no_unconditional_average
    applies_to: "aggregation"
    rule: "Fail when degreased and carbonized routes, different carbonizing chemistries, pure wool and blends, or coarse/fine wool are averaged without route-specific records, production weights and an explicit mixed-product scope."
    source_ids:
      - eu-txt-bref-2023
  - rule_id: validate_grease_recovery_conditioning
    applies_to: "recovered_wool_grease"
    rule: "Apply the 10-15 kg/t raw wool screen only to coarse wool typically above 35 µm and 50-60 kg/t only to extra-/super-fine wool typically below 20 µm. For other or mixed classes, report foreground rate without either screen. Flag outliers for explanation; do not replace observations."
    source_ids:
      - eu-txt-bat-2022-2508
  - rule_id: validate_carbonising_conditions
    applies_to: "sulphuric_acid_carbonising"
    rule: "Require measured bath/retained-acid conditions, drying and baking temperatures, neutralizing agent and final pH. Flag departures from the BREF typical condition ranges for route evidence and product-quality review; do not automatically fail a documented alternative technology."
    source_ids:
      - eu-txt-bref-2023
  - rule_id: validate_recovery_and_water_disclosure
    applies_to: "aqueous_scouring"
    rule: "Require gross water, recycle, discharge, recovered grease, dirt/sludge and wastewater destination. Flag absent grease recovery or water recycle for BAT applicability review rather than silently assuming zero."
    source_ids:
      - eu-txt-bat-2022-2508
  - rule_id: validate_foreground_completeness
    applies_to: "all_foreground_rows"
    rule: "Fail when a collected/calculated row lacks a collection protocol, matched temporal coverage, normalization basis or supporting record. Treat missing values as incomplete; never fill them from a reasoned_estimate range."
    source_ids:
      - eu-txt-bat-2022-2508
      - iso-14044-2006
  - rule_id: validate_mass_balance
    applies_to: "each_route"
    rule: "Fail when wet and dry bases are mixed. Flag material dry-mass imbalance for investigation and require an explanation for unresolved difference; prohibit undisclosed balancing flows."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_allocation
    applies_to: "multifunctional_operations"
    rule: "Fail when co-product or shared-treatment allocation is undisclosed or when economic allocation is used without first documenting subdivision/system-expansion and physical-relationship assessment."
    source_ids:
      - eu-pef-2021-2279
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate wool-preparation dataset for a declared degreased or carbonized route"
  downstream_use: "secondary_dataset; background_dataset after methodology and translation review and only within the disclosed route, fibre class, technology, geography and period"
  allowed_use: "LCA foreground packages and downstream process/lifecyclemodel projections requiring loose degreased or carbonized sheep wool before carding or combing; route-specific comparison when primary records are complete"
  excluded_use: "Greasy/raw wool, non-sheep animal hair, blends, noils/waste, carded/combed wool, tops, yarn, fabric, farm-gate wool production, fabric carbonizing, or an exact carbonized-wool UUID claim"
  required_metadata: "PCR id and version state; Tiangong UUIDs; route and included modules; facility and geography; reporting period; fibre-diameter class; pure-wool status; incoming state; dry-mass/moisture method; residual grease and vegetable-matter specification; carbonizing chemistry and conditions; water/recovery configuration; wastewater and waste destinations; allocation; upstream datasets; carbonized identity limitation"
  required_quality_disclosure: "Foreground-versus-calculated data share; meter and sampling coverage; mass/water reconciliations; route-specific yield; grease recovery rate and applicable fibre-class screen; reasoned-estimate flags and replacement status; exclusions, allocations, data gaps, abnormal operation and source applicability"
  update_trigger: "New verified carbonized-wool product-flow UUID; material change in route, fibre mix, chemicals, recovery or treatment; three representative periods sufficient to replace provisional screens; new official BAT/BREF or classification revision; monitoring or mass-balance failure; reviewer acceptance or rejection of the candidate methodology"
