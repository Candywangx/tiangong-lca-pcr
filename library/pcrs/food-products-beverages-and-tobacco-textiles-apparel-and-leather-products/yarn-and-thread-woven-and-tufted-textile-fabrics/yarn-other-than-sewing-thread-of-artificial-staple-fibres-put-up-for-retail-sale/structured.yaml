system_boundary:
  rules:
    - rule_id: boundary_prepared_fibre_start
      applies_to: "Foreground spinning dataset"
      rule: "Start at receipt of prepared artificial staple fibre and include drawing, roving where used, spinning, twisting where required, winding, inspection, and retail pack-out performed at the reporting site."
