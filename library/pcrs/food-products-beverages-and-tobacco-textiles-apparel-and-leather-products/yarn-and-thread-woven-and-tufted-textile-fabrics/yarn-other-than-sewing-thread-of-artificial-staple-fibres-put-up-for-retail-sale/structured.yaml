allocation_rules:
  - rule_id: allocation_avoid_where_possible
    applies_to: "Foreground process"
    rule: "Subdivide meters and material records or expand the reporting period so that direct assignment to the declared yarn output is possible before applying allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_mass_if_unavoidable
    applies_to: "Multiple saleable yarn outputs"
    rule: "If direct assignment is not possible, allocate shared electricity, lubricant, and packaging losses among saleable yarn outputs by their net accepted mass; document the outputs, mass totals, and allocation factors."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_waste_no_product_credit
    applies_to: "Captured loose fibre and off-spec yarn"
    rule: "Do not treat a waste flow as a co-product solely because it has a recovery destination; report its measured mass and destination separately. Any substitution credit belongs to the downstream study scenario, not this foreground inventory."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_reconciliation
      process_id: "p1_dry_spinning_retail_packout"
      flow_role: "prepared fibre input and accepted yarn output"
      record_type: "weighbridge, scale, warehouse, and production records"
      raw_fields: "batch_id; fibre_receipts_kg; opening_inventory_kg; closing_inventory_kg; accepted_net_yarn_kg; moisture_state; product_grade"
      collection_method: "Calibrated mass measurement reconciled to batch and warehouse movements"
      unit: "kg"
      frequency: "Each batch, aggregated over the reference period"
      temporal_coverage: "Complete declared reference period"
      site_scope: "Reporting spinning site"
      aggregation_rule: "Sum accepted quantities by product identity and reconcile opening stock + receipts - closing stock against yarn output and recorded waste"
      quality_evidence: "Calibration records; batch tickets; stock ledger; acceptance records; reconciliation sign-off"
    - protocol_id: cp_site_electricity_meter
      process_id: "p1_dry_spinning_retail_packout"
      flow_role: "site low-voltage electricity"
      record_type: "utility meter, submeter, or invoice"
      raw_fields: "meter_id; grid_region; opening_reading_kwh; closing_reading_kwh; process_share_basis; downtime; reference_period"
      collection_method: "Prefer process submetering; otherwise allocate a reconciled site meter total using documented operating records"
      unit: "kWh"
      frequency: "At least monthly and for the complete reference period"
      temporal_coverage: "Complete declared reference period"
      site_scope: "Reporting spinning site"
      aggregation_rule: "Sum interval consumption, subtract separately metered excluded loads, and assign the documented process share"
      quality_evidence: "Meter specification; calibration or utility invoice; operating-hour record; reconciliation worksheet"
    - protocol_id: cp_lubricant_issue_record
      process_id: "p1_dry_spinning_retail_packout"
      flow_role: "textile spinning lubricant"
      record_type: "stores issue/return record and formulation record"
      raw_fields: "batch_id; formulation_name; supplier; issued_kg; returned_kg; safety_data_sheet_id; application_point"
      collection_method: "Weigh or record issued and returned lubricant for the process batch"
      unit: "kg"
      frequency: "Each issue and return, aggregated by batch"
      temporal_coverage: "Complete declared reference period"
      site_scope: "Reporting spinning site"
      aggregation_rule: "Sum issued mass minus returned unused mass for the accepted production batch"
      quality_evidence: "Store ledger; scale record; formulation technical data sheet; batch operator sign-off"
    - protocol_id: cp_packaging_mass_reconciliation
      process_id: "p1_dry_spinning_retail_packout"
      flow_role: "paperboard core, paper label, LDPE film, and corrugated box"
      record_type: "packaging bill of materials, issue record, and component weighing"
      raw_fields: "package_sku; component_flow_id; component_description; component_count; sample_mass_kg; issued_mass_kg; returned_mass_kg; accepted_package_count"
      collection_method: "Weigh each distinct packaging component and reconcile issued, returned, and incorporated quantities"
      unit: "kg"
      frequency: "Each package SKU and batch"
      temporal_coverage: "Complete declared reference period"
      site_scope: "Reporting pack-out line"
      aggregation_rule: "Calculate each component separately; never aggregate unlike packaging materials into one flow"
      quality_evidence: "Packaging specification; scale record; issue/return ledger; accepted pack count; reconciliation sign-off"
    - protocol_id: cp_waste_mass_records
      process_id: "p1_dry_spinning_retail_packout"
      flow_role: "captured loose fibre and off-spec yarn"
      record_type: "waste container weighing and transfer record"
      raw_fields: "waste_row_id; container_id; gross_kg; tare_kg; net_kg; fibre_identity; destination; transfer_date"
      collection_method: "Weigh each waste stream separately at transfer; preserve destination and treatment identity"
      unit: "kg"
      frequency: "Each transfer, aggregated by waste row and reference period"
      temporal_coverage: "Complete declared reference period"
      site_scope: "Reporting spinning site"
      aggregation_rule: "Sum net mass separately for each waste identity and destination"
      quality_evidence: "Scale record; waste transfer note; destination receipt; batch linkage"
  calculation_rules:
    - id: calc_normalize_to_reference
      applies_to: "Every non-reference inventory row"
      rule: "normalized amount = reporting-period row quantity / reporting-period net conforming yarn quantity × 1,000 kg"
      inputs:
        - "row quantity"
        - "net conforming yarn quantity"
      output: "inventory amount per 1,000 kg net conforming yarn"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_net_yarn_mass
      applies_to: "Reference yarn output"
      rule: "net yarn mass = gross packaged mass - paperboard core mass - paper-label mass - LDPE-wrap mass - corrugated-box mass - every other separately measured packaging mass"
      inputs:
        - "gross packaged mass"
        - "each packaging-component mass"
      output: "net conforming yarn mass"
      source_ids: []
    - id: calc_material_reconciliation
      applies_to: "Fibre and yarn mass records"
      rule: "opening prepared-fibre stock + prepared-fibre receipts - closing prepared-fibre stock = accepted net yarn output + captured loose-fibre waste + off-spec yarn waste + documented work-in-progress change + documented retained or transferred material"
      inputs:
        - "stock records"
        - receipts
        - "accepted output"
        - "waste records"
        - "work-in-progress records"
      output: "signed material reconciliation and unexplained difference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and material flows"
      requirement: "Preserve the exact product and fibre identities, fibre mass fractions, yarn count, twist, package form, and Tiangong UUID only where direct read confirmed the same semantics."
      evidence: "Product specification; supplier declaration; Tiangong direct-read record; identity review in manifest"
    - id: dq_temporal
      applies_to: "Foreground inventory"
      requirement: "Cover a representative continuous 12-month period or disclose a shorter complete production campaign and its seasonality, downtime, and product-mix limitations."
      evidence: "Meter dates; batch register; production calendar; invoices"
    - id: dq_completeness
      applies_to: "Inputs and outputs"
      requirement: "Reconcile fibre, product, packaging, electricity, lubricant, and each waste stream; explain every excluded site load and every material-balance difference."
      evidence: "Signed reconciliation worksheets; exclusion register; waste transfer records"
    - id: dq_measurement
      applies_to: "Mass and energy records"
      requirement: "Use calibrated meters or traceable invoices and preserve raw readings, tare values, units, conversion factors, and correction records."
      evidence: "Calibration certificates; utility invoices; scale logs; correction log"
    - id: dq_source_scope
      applies_to: "External method evidence"
      requirement: "Use JRC and EU BAT sources as process-description and inventory-monitoring guidance only; disclose that EU BAT legal applicability does not extend automatically to the man-made-yarn foreground process."
      evidence: "Source-scope statement in dataset metadata"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm Product flow type, exact product name, CPC 26462, Mass property UUID, kg reference unit, and every required qualifier; reject sewing thread, synthetic staple-fibre yarn, filament yarn, and non-retail-sale yarn."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_net_mass
    applies_to: "Reference quantity"
    rule: "Confirm exactly 1,000 kg net conforming yarn and verify that core, label, film, box, pallet, and every other packaging mass are excluded from the reference amount and reported separately."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "Process inventory"
    rule: "Require one row per specific fibre, electricity scenario, lubricant formulation, packaging component, waste identity, and elementary release; reject collection labels and unresolved selector instructions as Selected flow values."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_uuid_evidence
    applies_to: "UUID-bearing rows"
    rule: "Confirm every UUID by hybrid search and public direct read and ensure the direct-read name, flow type, property, classification, location, and treatment semantics support the authored exchange."
    source_ids: []
  - rule_id: validate_reconciliation
    applies_to: "Foreground records"
    rule: "Confirm the electricity, packaging, lubricant, waste, and material records cover the same reference period and that the signed material reconciliation explains work in progress and any difference."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_boundary_disclosure
    applies_to: "Dataset boundary"
    rule: "Confirm prepared-fibre starting condition, upstream fibre datasets, excluded wet treatment, production geography, electricity grid, lubricant identity, waste destinations, and package form are disclosed."
    source_ids:
      - jrc-textiles-bref-2023
published_dataset_profile:
  dataset_role: "Foreground production dataset for dry spinning, winding, inspection, and retail pack-out of artificial-staple-fibre yarn"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product-footprint and lifecycle models that match the declared fibre/blend, spinning route, colour state, yarn specification, package form, geography, period, and prepared-fibre starting condition"
  excluded_use: "Sewing thread, synthetic-staple-fibre yarn outside CPC 26462, filament yarn, wet dyeing or finishing represented as part of this foreground process, yarn not put up for retail sale, or studies that cannot preserve net-yarn versus packaging mass"
  required_metadata: "PCR id; product and fibre identities; blend mass fractions; yarn count and twist; spinning system; colour and moisture states; package form; net and gross mass; packaging component masses; site and grid geography; reference period; upstream dataset links; allocation method; waste destinations"
  required_quality_disclosure: "Measurement coverage; meter and scale quality; reconciliation result; missing UUIDs; source-scope limitations; excluded loads; work-in-progress treatment; product-mix limits; representativeness limitations"
  update_trigger: "Change in fibre/blend identity, prepared-fibre starting condition, spinning technology, yarn specification, lubricant formulation, electricity grid, package form, site, allocation method, waste route, or a newly verified Tiangong identity"
data_sources:
  - id: "unsd-cpc-3-0-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Explanatory Notes, 30 June 2025, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-12)"
    used_for: "Official CPC 26462 category identity and adjacent exclusions"
