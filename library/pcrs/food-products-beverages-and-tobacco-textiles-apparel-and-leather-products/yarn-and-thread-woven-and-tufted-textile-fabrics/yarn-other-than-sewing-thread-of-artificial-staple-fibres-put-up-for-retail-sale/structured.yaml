    - rule_id: boundary_separate_upstream
      applies_to: "Upstream supply"
      rule: "Keep fibre manufacture, pre-spinning fibre preparation, wet dyeing or finishing, electricity supply, and packaging production in linked upstream datasets; do not silently absorb them into the foreground process."
