allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "Multi-process mill records"
    rule: "Avoid allocation by metering, batch records, and process subdivision so that fabric formation and finishing burdens are assigned to the actual product route."
    source_ids:
      - iso-14044-2006
      - eu-2022-2508-textiles-bat
  - rule_id: allocation_rule_2
    applies_to: "Rework and internal intermediate fabric"
    rule: "Treat internal transfers and rework within the foreground boundary without a second upstream burden; disclose the returned mass and the processes repeated."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rule_3
    applies_to: "Unavoidable shared burdens and co-products"
    rule: "When subdivision cannot resolve shared burdens, apply and document a physical relationship that reflects causality; use mass only when it is representative, and use economic allocation only when no defensible physical relationship exists."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabric_formation_materials
      process_id: "fabric_formation"
      flow_role: "yarn, sizing agent, sizing water, greige output, and yarn waste"
      record_type: "weighbridge, warehouse issue, batch, meter, and waste-transfer records"
      raw_fields: "lot_id; flow_name; supplier; fibre_identity; quantity; unit; timestamp; destination"
      collection_method: "Reconcile issued inputs, metered water, greige output, stock change, and waste by production lot"
      unit: "kg or m3 as recorded"
      frequency: "Each lot, aggregated monthly"
      temporal_coverage: "At least one representative production year or the full declared period"
      site_scope: "All fabric-formation equipment serving the declared product"
      aggregation_rule: "Sum by atomic flow and lot, then normalize to accepted reference-fabric mass"
      quality_evidence: "Calibrated scale or meter evidence; supplier documents; stock reconciliation; waste receipts"
    - protocol_id: cp_fabric_formation_energy
      process_id: "fabric_formation"
      flow_role: "grid electricity"
      record_type: "submeter and invoice records"
      raw_fields: "meter_id; opening_reading; closing_reading; period; production_line; allocation_key"
      collection_method: "Prefer direct submetering; reconcile to site invoices and document any allocation"
      unit: "kWh"
      frequency: "Meter interval or monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Fabric-formation equipment and assigned auxiliaries"
      aggregation_rule: "Sum direct readings or documented allocation for the process"
      quality_evidence: "Meter calibration, invoice reconciliation, and allocation worksheet"
    - protocol_id: cp_finishing_materials
      process_id: "finishing_and_dispatch"
      flow_role: "greige fabric, water, sodium hydroxide, and hydrogen peroxide solution"
      record_type: "batch recipe, issue, meter, supplier, and transfer records"
      raw_fields: "lot_id; operation; chemical_name; concentration; quantity; unit; water_meter; fabric_mass"
      collection_method: "Record every applicable operation and reconcile chemical issues and water meters to the lot"
      unit: "kg or m3 as recorded"
      frequency: "Each batch or continuous production run"
      temporal_coverage: "Same period as product output"
      site_scope: "All on-site wet or chemical operations for the declared product"
      aggregation_rule: "Sum each atomic flow separately; do not aggregate different chemicals"
      quality_evidence: "Batch sheets, safety data sheets, supplier specifications, meter calibration, and stock reconciliation"
    - protocol_id: cp_finishing_energy
      process_id: "finishing_and_dispatch"
      flow_role: "electricity and purchased steam"
      record_type: "submeter, steam meter, and supplier records"
      raw_fields: "meter_id; energy_carrier; reading; unit; pressure; temperature; period; operation"
      collection_method: "Measure each energy carrier separately and reconcile to supplier statements"
      unit: "kWh or MJ"
      frequency: "Meter interval or monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Finishing, inspection, packing, and assigned auxiliaries"
      aggregation_rule: "Sum by energy carrier and process before normalization"
      quality_evidence: "Meter calibration, invoice reconciliation, and documented conversion factors"
    - protocol_id: cp_wastewater_records
      process_id: "finishing_and_dispatch"
      flow_role: "textile wastewater to treatment"
      record_type: "effluent meter and treatment-transfer records"
      raw_fields: "meter_id; volume; timestamp; destination; treatment_route; product_allocation"
      collection_method: "Measure wastewater at the relevant process or treatment transfer point and document allocation"
      unit: "m3"
      frequency: "Continuous totalizer or each batch"
      temporal_coverage: "Same period as wet processing"
      site_scope: "Wastewater generated by the declared product route"
      aggregation_rule: "Sum measured volume by destination and keep direct discharges separate"
      quality_evidence: "Meter calibration, treatment records, and route identification"
    - protocol_id: cp_dispatch_records
      process_id: "finishing_and_dispatch"
      flow_role: "packaging, accepted fabric, and fabric offcuts"
      record_type: "packing list, scale, quality release, warehouse, and waste records"
      raw_fields: "lot_id; net_fabric_mass; moisture_state; tube_mass; film_mass; offcut_mass; destination"
      collection_method: "Weigh accepted fabric net of packaging and reconcile packaging issues and offcuts"
      unit: "kg"
      frequency: "Each lot"
      temporal_coverage: "Full declared production period"
      site_scope: "Final inspection, winding, packing, and dispatch for the declared product"
      aggregation_rule: "Sum accepted net mass and each packaging or waste flow separately"
      quality_evidence: "Scale calibration, quality-release record, packing list, and waste receipt"
  calculation_rules:
    - id: normalize_lot_records
      applies_to: "Every foreground inventory row"
      rule: "Divide the collected atomic-flow quantity for the declared period by accepted net reference-fabric mass from the same period; preserve the raw record and reported unit."
      inputs:
        - "atomic-flow quantity"
        - "accepted net reference-fabric mass"
      output: "foreground quantity per 1 kg reference fabric"
      source_ids:
        - iso-14044-2006
    - id: reconcile_internal_fabric
      applies_to: "Greige fabric transfer"
      rule: "Reconcile greige output and input by lot; explain storage change, rejection, or rework and do not attach a second upstream burden to the internal transfer."
      inputs:
        - "greige output"
        - "greige input"
