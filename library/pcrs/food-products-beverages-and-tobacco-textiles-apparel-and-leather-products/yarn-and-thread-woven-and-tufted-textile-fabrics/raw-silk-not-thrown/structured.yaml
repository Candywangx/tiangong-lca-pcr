      uuid: ""
    required_unit: "kWh, MJ, kg, or m3 as measured"
    rule: "Preserve measured energy carrier and unit. Convert only with a documented factor and do not merge electricity, purchased steam, and on-site fuel before their separate inventories are complete."
  - id: water_balance_basis
