allocation_rules:
  - rule_id: al_subdivide_routes
    applies_to: "Species, cocoon condition, and reeling technology"
    rule: "Subdivide and calculate route-specific processes before any allocation or aggregation. Do not allocate burdens through an unconditional average of mulberry/non-mulberry, fresh/dried, or hand/machine routes."
    source_ids:
      - iso-14044-2006
      - fao-silk-reeling-testing-1999
  - rule_id: al_classify_outputs
    applies_to: "Pupae, recoverable cocoon/silk material, and residues"
    rule: "Determine product or waste status from the actual function and destination. FAO identifies pupae and several silk residues as potentially valuable outputs; saleable material shall not be silently treated as burden-free waste."
    source_ids:
      - fao-silk-reeling-testing-1999
  - rule_id: al_avoid_where_possible
    applies_to: "Multi-output processes"
    rule: "First avoid allocation by separately measuring attributable operations or subdividing treatment. Use system expansion only when the downstream study method permits it and the substituted product and evidence are explicit."
    source_ids:
      - iso-14044-2006
  - rule_id: al_physical_then_economic
    applies_to: "Unavoidable shared burdens"
    rule: "Where subdivision is not feasible, use a documented physical causal relation when defensible. If no defensible physical relation exists, use economic allocation based on contemporaneous net-gate values and quantities for all co-products, and report a sensitivity case."
    source_ids:
      - iso-14044-2006
  - rule_id: al_internal_recycling
    applies_to: "Internally returned silk, cocoon, water, or heat"
    rule: "Treat internal recycling as an internal loop. Count only make-up inputs and final outputs crossing the reporting-unit boundary; disclose recirculation rates without crediting the same material twice."
    source_ids:
      - iso-14044-2006
      - eu-txt-bref-2023
  - rule_id: al_residual_treatment
    applies_to: "Wastewater and final wastes"
    rule: "Assign on-site treatment burdens to the generating route by measured residual quantity and, where treatment demand differs materially, by pollutant load or another documented causal driver."
    source_ids:
      - iso-14044-2006
      - eu-txt-bref-2023
dataset_production:
  collection_protocols:
    - protocol_id: cp_cocoon_receipt
      process_id: "cocoon_receipt_preparation"
      flow_role: "Cocoon input, acceptance, rejects, receipt electricity"
      record_type: "Weighbridge/scale, supplier lot, inspection, meter"
      raw_fields: "gross_mass; tare; net_mass; fresh_or_dried; moisture_or_condition; species_or_fibre_type; supplier; origin; lot; accepted_mass; reject_mass_by_disposition; electricity"
      collection_method: "Calibrated weighing by lot, inspection record, and meter/submeter"
      unit: "kg; percent; kWh"
      frequency: "Every received lot; electricity at least monthly"
      temporal_coverage: "At least 12 representative months or all campaigns in a shorter seasonal year"
      site_scope: "Each filature and supplier-origin group separately"
      aggregation_rule: "Sum by homogeneous route; normalize only to conditioned output from the same route"
      quality_evidence: "Scale calibration; supplier record; moisture method; lot reconciliation; meter evidence"
    - protocol_id: cp_cocoon_drying
      process_id: "cocoon_stifling_drying"
      flow_role: "Fresh input, dried output, fuel/heat/electricity, losses, direct emissions"
      record_type: "Batch sheet, meters, fuel issue, moisture test"
      raw_fields: "fresh_mass; dried_mass; input_moisture; output_moisture; dryer_type; temperature_profile; runtime; fuel_by_type; heat; electricity; loss_mass; emission_method"
      collection_method: "Batch weighing and moisture test; calibrated meters or fuel stock balance"
      unit: "kg; percent; MJ; kWh; h"
      frequency: "Every batch; utilities at least daily"
      temporal_coverage: "Full drying campaign and all material technologies"
      site_scope: "Each dryer and site separately"
      aggregation_rule: "Allocate only documented shared utility to batches, then normalize to dried output and route reference flow"
      quality_evidence: "Scale/moisture calibration; meter/fuel invoices; batch log; emission factor provenance"
    - protocol_id: cp_cooking_reeling
      process_id: "cocoon_cooking_reeling"
      flow_role: "Cocoons, water, energy, aids, raw silk, pupae, by-products, wastewater, residuals, emissions"
      record_type: "Batch/reel production sheet, meters, dosing, scales, lab and discharge records"
      raw_fields: "cocoon_mass_and_condition; route; machine_type; cooking_method; water_withdrawal; recirculation; discharge; steam; heat; fuel; electricity; aid_name_and_mass; raw_silk_mass_and_moisture; pupae_mass; byproduct_mass_by_type; waste_mass; pollutant_data"
      collection_method: "Meter and weigh each batch or production shift; retain route identity"
      unit: "kg; m3; MJ; kWh; percent; concentration units"
      frequency: "Each lot/shift; discharge monitoring at permit or process-control frequency"
      temporal_coverage: "At least 12 representative months or complete seasonal production"
      site_scope: "Each filature, water system, and reeling technology separately"
      aggregation_rule: "Close water and mass balances by route before normalization; no cross-route averaging without documented shares"
      quality_evidence: "Meter/scale calibration; production logs; laboratory QA; invoices; discharge chain of custody"
    - protocol_id: cp_rereeling
      process_id: "raw_silk_rereeling_finishing"
      flow_role: "Raw-silk transfer, water/aids, energy, accepted output, residuals"
      record_type: "Lot sheet, scale, meter, dosing and reject record"
      raw_fields: "input_mass_and_moisture; package_form_in; reeling_speed; water; aid_name_and_mass; electricity; heat; output_mass_and_moisture; package_form_out; reject_mass; wastewater"
      collection_method: "Lot-level weighing and metering or defensible engineering allocation"
      unit: "kg; kWh; MJ; percent"
      frequency: "Each lot; utilities at least shift/month with allocation basis"
      temporal_coverage: "All re-reeled lots in the reporting period"
      site_scope: "Each line and re-reeling route separately"
      aggregation_rule: "Normalize accepted output and reject flows to the same moisture basis"
      quality_evidence: "Scale/meter calibration; lot traceability; aid purchase and dosing records"
    - protocol_id: cp_release_testing
      process_id: "conditioning_testing_packing"
      flow_role: "Conditioned mass, linear density, defects/evenness, grade, testing energy, packaging, rejects"
      record_type: "Test certificate, conditioning log, scale, oven, packaging BOM, meter"
      raw_fields: "lot_id; gross_mass; tare; oven_dry_mass_or_moisture; agreed_regain; conditioning_temperature_humidity_time; linear_density_result_and_method; defect_evenness_method_and_result; grade; package_material_mass; reuse_cycles; energy; reject_mass"
      collection_method: "Apply declared contract or standard; calibrated weighing and test equipment"
      unit: "kg; percent; dtex or denier; kWh; MJ"
      frequency: "Every release lot with sampling per declared method"
      temporal_coverage: "All released lots in reporting period"
      site_scope: "Each product specification and route separately"
      aggregation_rule: "Calculate conditioned net mass; aggregate only conforming homogeneous lots"
      quality_evidence: "Test-method revision; certificates; calibration; raw observations; sampling record"
    - protocol_id: cp_residual_management
      process_id: "onsite_wastewater_treatment"
      flow_role: "Two named wastewaters; each treatment chemical; electricity; reclaimed water; sludge; each water pollutant"
      record_type: "Treatment log, meters, scales, laboratory data"
      raw_fields: "reeling_wastewater; rereeling_wastewater; sodium_hydroxide; ferric_chloride; polyacrylamide; electricity; reclaimed_water; sludge; discharge; COD; total_nitrogen; total_phosphorus; suspended_solids"
      collection_method: "Reconcile each producing-process transfer to treatment records; monitor according to permit and process needs"
      unit: "kg; m3; kWh; concentration and load units"
      frequency: "Continuous/daily flow where available; chemistry at permit or control frequency"
      temporal_coverage: "Representative full reporting year including peak campaigns"
      site_scope: "Each on-site treatment train separately"
      aggregation_rule: "Allocate by measured quantity and causal treatment driver, then normalize to generating route"
      quality_evidence: "Laboratory accreditation/QA; meter calibration; manifests; treatment and discharge records"
  calculation_rules:
    - id: cr_conditioned_mass
      applies_to: "Raw-silk reference mass"
      rule: "conditioned_mass = oven_dry_mass × (1 + declared_regain_fraction). Use 0.11 only when the applicable commercial specification explicitly adopts the FAO handbook's 11% basis."
      inputs:
        - oven_dry_mass
        - declared_regain_fraction
        - contract_or_standard
      output: "conditioned net raw-silk mass"
      source_ids:
        - fao-silk-reeling-testing-1999
    - id: cr_linear_density
      applies_to: "Silk size reporting"
      rule: "Preserve measured dtex or denier. When conversion is required, dtex = denier × 10/9; retain the original unit and test method."
      inputs:
        - measured_size
        - original_unit
        - test_method
      output: "declared linear density"
      source_ids:
        - iso-21046-2018
    - id: cr_fresh_cocoon_screen
      applies_to: "Fresh-cocoon yield QA"
      rule: "fresh_cocoon_input_per_kg_raw_silk = 1 / measured_raw_silk_fraction; compare only to the 12-20% FAO screening interval for a comparable route."
      inputs:
        - fresh_cocoon_mass
        - conditioned_raw_silk_mass
      output: "kg fresh cocoons/kg raw silk"
      source_ids:
        - fao-silk-reeling-testing-1999
    - id: cr_dried_cocoon_screen
      applies_to: "Dried-cocoon yield QA"
      rule: "Convert fresh and dried cocoon masses through measured moisture where available. The 2.1-4.4 kg/kg screen is a conservative combination of FAO fresh yield and whole-cocoon moisture intervals and shall not replace measured route data."
      inputs:
        - cocoon_mass
        - cocoon_moisture
        - raw_silk_mass
      output: "dry-matter-consistent cocoon ratio"
      source_ids:
        - fao-silk-reeling-testing-1999
    - id: cr_route_normalization
      applies_to: "All foreground rows"
      rule: "normalized_amount = route_period_amount / route_period_conditioned_raw_silk_mass; exclude internal transfers from boundary-crossing totals."
      inputs:
        - "route-specific raw records"
        - "conditioned output"
      output: "amount per kg reference flow"
      source_ids:
        - eu-pef-2021-2279
    - id: cr_water_balance
      applies_to: "Cooking, reeling, re-reeling, treatment"
      rule: "withdrawal + water_in_inputs = discharge + evaporation + water_in_products_and_wastes + inventory_change; show recirculated water separately."
      inputs:
        - "all measured water terms"
      output: "reconciled water balance and closure"
      source_ids:
        - mass-balance-identity
        - eu-txt-bref-2023
    - id: cr_process_mass_balance
      applies_to: "Each process and route"
      rule: "Reconcile moisture-consistent input mass with products, co-products, wastes, emissions, and justified inventory change. Investigate rather than force-close material discrepancies."
      inputs:
        - "measured input/output masses"
        - moisture
        - emissions
      output: "mass-balance closure and discrepancy"
      source_ids:
        - mass-balance-identity
    - id: cr_economic_allocation
      applies_to: "Unavoidable multi-output allocation"
      rule: "share_i = quantity_i × representative_net_gate_price_i / Σ(quantity_j × representative_net_gate_price_j) using one consistent price period and geography; report price and sensitivity."
      inputs:
        - "co-product quantities"
        - "net-gate prices"
      output: "allocation shares"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Reference product and cocoons"
      requirement: "Link every released lot to species/fibre type, supplier cocoon lots, starting condition, reeling route, direct/indirect status, re-reeling status, package, grade/test method, and moisture basis."
      evidence: "Lot genealogy and release certificate"
    - id: dq_route_representativeness
      applies_to: "Technology and geography"
      requirement: "Keep route-specific records and report production shares, coverage, downtime, seasonal gaps, and excluded sites."
      evidence: "Route register, production ledger, site list, coverage calculation"
    - id: dq_temporal_coverage
      applies_to: "Foreground annual dataset"
      requirement: "Use at least 12 representative months where production is continuous; for seasonal production, cover all campaigns represented and disclose deviations."
      evidence: "Dated raw records and coverage statement"
    - id: dq_mass_and_water_closure
      applies_to: "Each foreground process"
      requirement: "Report mass- and water-balance closure and investigate material discrepancies without inventing balancing flows."
      evidence: "Calculation workbook, meter/scale calibration, investigation record"
    - id: dq_meter_and_lab_quality
      applies_to: "Utilities, moisture, quality, and emissions"
      requirement: "Retain calibration, sampling, method revision, laboratory QA, detection limits, and data-gap treatment."
      evidence: "Calibration certificates, laboratory reports, sampling plan"
    - id: dq_upstream_completeness
      applies_to: "Cocoons, utilities, chemicals, packaging, transport, treatment"
      requirement: "Link representative upstream datasets and disclose age, geography, technology, and any supplier drying or transport gaps."
      evidence: "Dataset references and representativeness assessment"
    - id: dq_estimate_replacement
      applies_to: "Reasoned-estimate ranges"
      requirement: "Treat every reasoned_estimate range as provisional and non-conforming for publication-critical substitution. Replace it with audited foreground or reviewed source-backed evidence when available or when route/specification changes."
      evidence: "Replacement log and source/record review"
    - id: dq_source_limitations
      applies_to: "External evidence"
      requirement: "FAO 1999 values are technical screening evidence with mainly bivoltine temperate-zone context; ISO abstracts establish method applicability but not unpublished procedural details; EU BREF applicability is subject to installation scope."
      evidence: "Source-use statement and limitations disclosure"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "Require the exact product flow UUID 343df125-d682-4ffa-8829-5fbc785bdbc9, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and exactly 1 kg conditioned net output."
    source_ids:
      - un-cpc-3-0-26110
  - rule_id: val_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Fail completeness when any required qualifier is absent, including species/fibre type, cocoon condition, technology, direct/indirect route, re-reeling, package, linear density, quality method/grade, sericin condition, moisture basis, geography, period, and allocation."
    source_ids:
      - fao-silk-reeling-testing-1999
      - iso-15625-2014
      - iso-21046-2018
  - rule_id: val_not_thrown_scope
    applies_to: "Product boundary"
    rule: "Reject a result labelled by this PCR if throwing/twisting, spun-silk conversion, degumming, dyeing, weaving, or downstream finishing is inseparably included."
    source_ids:
      - un-cpc-3-0-26110
      - fao-silk-reeling-testing-1999
  - rule_id: val_route_conditioning
    applies_to: "Route aggregation"
    rule: "Require independent route results before weighted aggregation and require documented production shares; reject unconditional averaging across species, cocoon state, or reeling technology."
    source_ids:
      - fao-silk-reeling-testing-1999
  - rule_id: val_reference_mass
    applies_to: "Conditioned mass"
    rule: "Require gross, tare, net, moisture or oven-dry result, declared regain, and calculation. Flag an assumed 11% regain unless the applicable specification explicitly adopts it."
    source_ids:
      - fao-silk-reeling-testing-1999
  - rule_id: val_process_completeness
    applies_to: "Foreground inventory"
    rule: "Require receipt/sorting, cooking/reeling, conditioning/testing/packing, and every triggered conditional process, together with water, energy, cocoon, product, co-product, waste, wastewater, direct-emission, and packaging records or explicit justified zero/not-applicable statements."
    source_ids:
      - fao-silk-reeling-testing-1999
      - eu-txt-bref-2023
  - rule_id: val_mass_water_balance
    applies_to: "Each route"
    rule: "Require reported mass and water closure; flag negative flows, outputs above compatible measured inputs, recirculated water counted as withdrawal, or unexplained material discrepancies."
    source_ids:
      - mass-balance-identity
      - eu-txt-bref-2023
  - rule_id: val_coproduct_destination
    applies_to: "Pupae and silk/cocoon by-products"
    rule: "Require measured mass, product-or-waste status, destination, and consistent allocation. Flag saleable or beneficially used material treated as burden-free waste."
    source_ids:
      - fao-silk-reeling-testing-1999
      - iso-14044-2006
  - rule_id: val_data_coverage
    applies_to: "Published dataset candidate"
    rule: "Require temporal/site coverage, calibration and laboratory evidence, upstream dataset references, source limitations, and a list of remaining provisional estimates. Inconclusive checks are not passes."
    source_ids:
      - eu-pef-2021-2279
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Gate-to-gate foreground raw-silk production dataset with linked upstream cocoon, utility, material, transport, and treatment datasets"
  downstream_use: "secondary_dataset; background_dataset after methodology, representativeness, and uncertainty review"
  allowed_use: "LCA process or lifecycle-model projections for the declared raw-silk species/type, cocoon condition, filature technology, geography, period, quality, moisture basis, and allocation method"
  excluded_use: "Unqualified global or category average; comparison of routes without harmonized boundary and allocation; proxy for thrown, spun, degummed, dyed, woven, or finished silk; use of provisional estimates as reviewed publication-critical defaults"
  required_metadata: "All reference-flow qualifiers; filature/site coverage; reporting period; route shares; capacity utilization; upstream dataset identities; water and energy carriers; co-product destinations; allocation; test methods; source limitations; uncertainty and data gaps"
  required_quality_disclosure: "Raw-record coverage; scale/meter/laboratory QA; mass and water closure; fresh/dried conversion; route aggregation; source age and applicability; provisional estimate list and replacement plan; upstream representativeness"
  update_trigger: "Change in product-flow identity or reference property; species/fibre type; cocoon starting condition; reeling or re-reeling technology; quality or moisture specification; allocation; co-product destination; water/energy system; treatment; geography; data older than the governing study window; or acquisition of audited data replacing provisional ranges"
data_sources:
  - id: "un-cpc-3-0-26110"
    type: "standard"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 Explanatory Notes, 30 June 2025, subclass 26110, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf, retrieved 2026-08-12"
    used_for: "Official classification label and exclusion of downstream silk yarn categories; not a process or quantity source"
  - id: "fao-silk-reeling-testing-1999"
    type: "handbook"
    reference: "Yong-woo Lee, Silk Reeling and Testing Manual, FAO Agricultural Services Bulletin No. 136, ISBN 92-5-104293-4, 1999, https://www.fao.org/4/x2099E/x2099e00.htm, retrieved 2026-08-12"
    used_for: "Product/process decomposition; cocoon condition; route distinctions; fresh-cocoon yield screen; cocoon moisture; water planning screens; re-reeling; by-products; conditioned mass and quality testing. Limitation: mainly bivoltine temperate-zone technical practice and not a universal current-technology default."
  - id: "iso-15625-2014"
    type: "standard"
    reference: "ISO 15625:2014, Silk — Electronic test method for defects and evenness of raw silk, confirmed 2023, https://www.iso.org/standard/55447.html, retrieved 2026-08-12"
    used_for: "Applicability of electronic defects/evenness testing to specified raw-silk forms and size range; the PCR does not reproduce paywalled procedural details"
  - id: "iso-21046-2018"
    type: "standard"
    reference: "ISO 21046:2018, Silk — Test method for determining the size of silk yarns, confirmed 2025, https://www.iso.org/standard/69734.html, retrieved 2026-08-12"
    used_for: "Declared linear-density test method for silk yarns; excludes spun silk according to the official abstract"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management — Life cycle assessment — Requirements and guidelines, confirmed current, https://www.iso.org/standard/38498.html, retrieved 2026-08-12"
    used_for: "LCI boundary, allocation, reporting, limitations, and review framework"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279 on the use of Environmental Footprint methods, OJ L 471, 30 December 2021, ELI http://data.europa.eu/eli/reco/2021/2279/oj, retrieved 2026-08-12"
    used_for: "Life-cycle data quality, supply-chain completeness, representativeness, verification, and transparent use limitations"
  - id: "eu-txt-bref-2023"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Best Available Techniques Reference Document for the Textiles Industry, January 2023, https://bureau-industrial-transformation.jrc.ec.europa.eu/index.php/reference/textiles-industry, retrieved 2026-08-12"
    used_for: "Conditional wet-process water, energy, wastewater, emission monitoring, and treatment context; no raw-silk-specific amount factor is taken from this source"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation-of-mass and site water-balance identity as implemented from measured foreground inputs, outputs, stock change, and releases"
    used_for: "QA limits, mass/water closure, and investigation of discrepancies; not an external empirical range"
