  classification_refs: "CPC 3.0 26110 Raw silk (not thrown), exact semantic reference; classification is not the canonical PCR identity"
  covered_products: "Continuous raw silk reeled from declared mulberry or non-mulberry cocoons; unthrown; sericin condition declared; supplied in a declared skein, hank, or cone form"
  excluded_products: "Thrown or twisted silk; spun silk and silk-waste yarn; degummed silk unless separately modelled downstream; dyed or woven silk; pierced-cocoon spun products; synthetic or regenerated fibres"
  representative_product: "Conditioned, marketable raw silk (not thrown) from one declared cocoon species and one declared filature route"
  production_route: "Received fresh or dried/stifled cocoons; conditional stifling/drying and storage; sorting; cocoon cooking and end finding; route-specific reeling; conditional re-reeling and finishing; conditioning, testing, packing; residual management"
  market_state: "Unthrown raw silk at filature gate, with package form, nominal linear density, quality grade/test method, sericin or boil-off condition, and commercial moisture basis declared"
functional_unit:
  what: "Supply of raw silk filaments cohered by residual sericin and not subjected to throwing or twisting"
  how_much: "1 kg of conditioned net raw silk, excluding packaging"
  how_well: "Meets the declared contract or standard for species/fibre type, nominal linear density, package form, quality grade and test method, defect/evenness class where applicable, and sericin or boil-off condition"
  how_long_or_cycle: "One production lot at the filature gate; no use duration is assigned to this intermediate product"
  reference_flow_link: "The functional unit is realized by exactly 1 kg of the Tiangong Raw Silk product flow on the declared commercial moisture basis"
system_boundary:
  rules:
    - rule_id: sb_route_separation
      applies_to: "All foreground modelling"
      rule: "Calculate each species/fibre type, cocoon starting condition, and reeling technology separately. Combine only with documented production shares after route-level inventories are complete; do not use an unconditional category average."
      source_ids:
        - fao-silk-reeling-testing-1999
    - rule_id: sb_cocoon_upstream
      applies_to: "Cocoon supply"
      rule: "Stop the foreground boundary at the declared filature-gate cocoon input and require an upstream cocoon dataset covering rearing and any supplier stifling/drying. Add inbound transport explicitly if absent upstream."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_filature_operations
      applies_to: "Filature"
      rule: "Include sorting, any on-site stifling/drying/storage, cooking, end finding, reeling, applicable re-reeling/finishing, conditioning/testing/packing, internally attributable utilities, water, wastewater, direct emissions, wastes, and co-products."
      source_ids:
        - fao-silk-reeling-testing-1999
        - eu-txt-bref-2023
    - rule_id: sb_downstream_exclusions
      applies_to: "Reference product"
      rule: "Exclude throwing/twisting, degumming, dyeing, weaving, finishing, garment manufacture, use, and end of life; disclose any deviation as a separate downstream module rather than relabelling it raw silk production."
      source_ids:
        - un-cpc-3-0-26110
        - fao-silk-reeling-testing-1999
    - rule_id: sb_capital_goods
      applies_to: "Infrastructure and equipment"
      rule: "Exclude capital goods from the default foreground package unless required by the intended downstream method. If included, disclose lifetime, utilization, and allocation and keep the result distinguishable."
      source_ids:
        - eu-pef-2021-2279
boundary_abstraction:
