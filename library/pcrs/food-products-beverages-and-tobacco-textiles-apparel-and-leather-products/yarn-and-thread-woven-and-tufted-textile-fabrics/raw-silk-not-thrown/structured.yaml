measurement_rules:
  - id: reference_conditioned_mass
    applies_to: "Reference raw silk"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report 1 kg net raw silk at the declared commercial moisture regain. Retain gross mass, tare, oven-dry mass or measured moisture, conditioning conditions, and calculation. An 11% regain may be used only when the applicable contract or test specification explicitly adopts the FAO handbook basis; it is not an unconditional default."
  - id: cocoon_condition_mass
    applies_to: "Fresh and dried/stifled cocoon inputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep fresh-cocoon and dried-cocoon masses in separate fields. Record measured moisture or the supplier-declared state and never combine the two without a documented dry-matter conversion."
  - id: linear_density_declaration
    applies_to: "Reference raw silk quality"
    required_property_ref:
      name: "Linear density"
      uuid: ""
    required_unit: "dtex or denier"
    rule: "Declare the method and result. ISO 21046:2018 may be used for silk yarn size; if denier is converted, use 1 denier = 1.111... dtex and retain the original reported unit."
