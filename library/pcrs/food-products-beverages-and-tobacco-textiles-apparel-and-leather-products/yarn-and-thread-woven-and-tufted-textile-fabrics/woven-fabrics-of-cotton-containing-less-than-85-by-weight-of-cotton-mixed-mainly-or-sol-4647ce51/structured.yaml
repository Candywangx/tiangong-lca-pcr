system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "foreground fabric manufacture"
      rule: "Include all on-site operations that transform received yarn into the declared saleable fabric, together with their textile materials, process chemicals, water, energy, waste, wastewater, and direct air or water emissions."
      source_ids:
        - eu-textiles-bat-2022
    - rule_id: boundary_rule_2
      applies_to: "conditional wet processing"
      rule: "Include desizing, scouring, bleaching, mercerisation, dyeing, printing, finishing, drying, and heat-setting only when performed for the declared product; disclose each included or outsourced operation and link an upstream dataset for every outsourced operation."
      source_ids:
        - eu-textiles-bat-2022
    - rule_id: boundary_rule_3
      applies_to: "upstream yarn and fibre production"
      rule: "Exclude fibre and yarn production from the foreground boundary, but require separate upstream datasets matched to cotton/man-made-fibre composition, yarn specification, geography, and supplier route."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_rule_4
      applies_to: "first foreground inventory"
      rule: "Avoid unreported cut-offs in the first dataset. Record all identified material and energy flows and explicitly disclose any unavailable minor flow as a data gap rather than silently omitting it."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_rule_5
      applies_to: "packaging and downstream stages"
      rule: "Exclude packaging, distribution, garment conversion, use, and end-of-life unless the study explicitly extends the boundary; extended results shall remain separable from the plant-gate fabric dataset."
      source_ids:
        - eu-pef-2021
