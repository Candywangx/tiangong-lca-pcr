measurement_rules:
  - id: reference_mass_basis
    applies_to: "reference product and textile material flows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report mass on one declared dry or conditioned basis. Record the conditioning method or moisture content and convert all textile input and output masses to the same basis before normalization."
  - id: fibre_composition_balance
    applies_to: "reference product composition"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "kg/kg"
    rule: "Determine fibre fractions from product specification supported by test, bill of materials, or lot record; fractions shall sum to 1 within declared rounding tolerance, cotton shall be below 0.85, and the non-cotton fraction shall be mainly or solely man-made fibre."
  - id: area_mass_conversion
    applies_to: "records reported by length or area"
    required_property_ref:
      name: "Mass per area and usable width"
      uuid: ""
    required_unit: "kg, m2, kg/m2"
    rule: "Convert length- or area-based production using measured roll length, usable width, and mass per unit area for the same lot; retain both raw and converted values."
  - id: net_water_use
    applies_to: "wet textile processes"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Record process water supplied and separately record internally reused or recycled water. Net water consumption equals supplied water minus water returned for internal reuse; do not subtract discharged wastewater."
  - id: energy_carrier_separation
    applies_to: "electricity, fuels, steam, and purchased heat"
    required_property_ref:
      name: "Energy or carrier mass/volume"
      uuid: ""
    required_unit: "kWh, MJ, kg, or m3"
    rule: "Keep purchased electricity, each fuel, purchased steam, and purchased heat separate. Convert energy units with documented factors and do not merge direct fuel combustion with purchased energy."
  - id: normalization_to_reference
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Row-specific property"
      uuid: ""
    required_unit: "row-specific unit per kg"
    rule: "Normalize reporting-period quantities to 1 kg conforming saleable reference fabric after accounting for opening and closing stock, rework, rejects, and intermediate transfers."
