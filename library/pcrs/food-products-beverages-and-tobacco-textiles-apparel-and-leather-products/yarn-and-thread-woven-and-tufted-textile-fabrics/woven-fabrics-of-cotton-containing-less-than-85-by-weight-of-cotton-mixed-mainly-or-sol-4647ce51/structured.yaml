allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "separately measurable products and processes"
    rule: "Avoid allocation by subdividing lines, lots, meters, and process records so that inputs, wastes, and emissions are directly assigned to the declared fabric wherever practicable."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_rule_2
    applies_to: "shared electricity and equipment"
    rule: "Allocate shared electricity and equipment services using a causal physical driver such as metered machine-hours, loom-hours, compressed-air demand, or treated textile throughput; disclose the driver and denominator."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_rule_3
    applies_to: "shared wet processes and utilities"
    rule: "Allocate shared water, steam, heat, chemicals, wastewater, and treatment using measured bath volume, liquor ratio, mass of textile treated, thermal demand, or pollutant load as appropriate; mass-only allocation is acceptable only when it represents the physical relationship."
    source_ids:
      - eu-pef-2021
      - eu-textiles-bat-2022
  - rule_id: allocation_rule_4
    applies_to: "rework and internal recycling"
    rule: "Keep burdens with the product route that causes rework. Credit neither internally reused yarn, fabric, size, water, nor heat as an avoided product; instead subtract verified internal returns from gross consumption and disclose the recycling loop."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: allocation_rule_5
    applies_to: "saleable co-products or recovered materials"
    rule: "When subdivision and system expansion are not practicable, use a quantified physical relationship; use economic allocation only when no defensible physical relationship exists, and disclose prices, period, sensitivity, and treatment of textile scrap."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_yarn_material_balance
      process_id: "yarn_preparation"
      flow_role: "cotton and man-made-fibre yarn consumption and composition"
      record_type: "purchase, issue, stock, bill-of-material, and composition records"
      raw_fields: "yarn_id; fibre_type; cotton_fraction; man_made_fraction_by_type; dry_or_conditioned_mass; moisture_basis; opening_stock; receipts; issues; returns; closing_stock; product_lot"
      collection_method: "reconcile issue and stock records to product lots; verify composition by certificate or test"
      unit: "kg and mass fraction"
      frequency: "each lot, aggregated monthly"
      temporal_coverage: "at least 12 consecutive representative months or the full shorter campaign"
      site_scope: "all yarn stores and preparation lines serving the product"
      aggregation_rule: "consumption = opening stock + receipts - returns - closing stock; assign to lots by traceable issue or bill of materials"
      quality_evidence: "calibrated scales; supplier certificates; composition tests; stock reconciliation; exception log"
    - protocol_id: cp_yarn_preparation_records
      process_id: "yarn_preparation"
      flow_role: "sizing chemicals, electricity, prepared yarn, and waste"
      record_type: "meters, batch sheets, chemical issues, transfer weights, and waste tickets"
      raw_fields: "line_id; lot_id; prepared_yarn_mass; chemical_product; chemical_mass; electricity; waste_mass; waste_route; operating_hours"
      collection_method: "collect line or campaign records and reconcile inputs with prepared-yarn transfer and waste"
      unit: "kg and kWh"
      frequency: "each batch or shift, aggregated monthly"
      temporal_coverage: "same period as reference product"
      site_scope: "all preparation equipment and attributable room conditioning"
      aggregation_rule: "sum by product route; allocate shared use by measured operating hours or throughput"
      quality_evidence: "meter calibration; chemical inventory reconciliation; waste tickets; production log"
    - protocol_id: cp_weaving_records
      process_id: "weaving"
      flow_role: "yarn input, electricity, greige output, textile waste, and dust"
      record_type: "loom counters, transfer weights, submeters, waste weights, and emission measurements"
      raw_fields: "loom_id; lot_id; yarn_input; greige_output; electricity; compressed_air_driver; humidification_driver; waste_mass; dust_flow; dust_concentration"
      collection_method: "collect by loom or loom group and reconcile textile mass"
      unit: "kg, kWh, Nm3, and kg pollutant"
      frequency: "each shift or lot, aggregated monthly"
      temporal_coverage: "same period as reference product"
      site_scope: "all looms and support systems serving the product"
      aggregation_rule: "sum direct records; allocate shared utilities by loom-hours or causal demand; calculate dust mass flow where measured"
      quality_evidence: "calibrated meters and scales; loom production log; abatement inspection; mass-balance exception log"
    - protocol_id: cp_inspection_records
      process_id: "inspection_mending"
      flow_role: "inspected input, conforming output, rework, and rejects"
      record_type: "roll tickets, inspection records, and waste weights"
      raw_fields: "roll_id; incoming_mass; accepted_mass; rework_mass; reject_mass; trimming_mass; disposition"
      collection_method: "weigh or derive from verified roll length, width, and mass per area; record disposition"
      unit: "kg, m, m2, and kg/m2"
      frequency: "each roll or lot"
      temporal_coverage: "same period as reference product"
      site_scope: "all inspection and mending lines serving the product"
      aggregation_rule: "reconcile incoming mass to accepted, rework, reject, trimming, and stock change"
      quality_evidence: "calibrated scales; inspection specification; roll traceability; reconciliation result"
    - protocol_id: cp_wet_pretreatment_records
      process_id: "wet_pretreatment"
      flow_role: "fabric, water, chemicals, energy, output, and wastewater"
      record_type: "batch sheets, flowmeters, submeters, chemical issues, and effluent records"
      raw_fields: "route; lot_id; fabric_in; fabric_out; water_supplied; water_reused; chemical_product_and_mass; electricity; steam; heat; fuel; wastewater_volume; pH; conductivity; COD_or_TOC; solids"
      collection_method: "collect per machine batch or continuous campaign and retain operation sequence"
      unit: "kg, m3, kWh, MJ, and parameter-specific units"
      frequency: "each batch or campaign; water and energy at least monthly"
      temporal_coverage: "same period as reference product"
      site_scope: "all included pre-treatment lines and attributable utilities"
      aggregation_rule: "aggregate by route; net internal reuse; normalize to accepted output; retain losses and wastewater separately"
      quality_evidence: "meter calibration; recipe and chemical inventory reconciliation; laboratory QA; water and energy balance"
    - protocol_id: cp_coloration_records
      process_id: "coloration"
      flow_role: "fabric, dyes and auxiliaries, water, energy, output, and wastewater"
      record_type: "recipe, batch, meter, chemical issue, and laboratory records"
      raw_fields: "route; lot_id; fabric_in; fabric_out; dye_or_pigment; auxiliary; supplied_mass; water_supplied; water_reused; electricity; steam; heat; wastewater_volume; colour; COD_or_TOC; pH; conductivity; relevant_metals"
      collection_method: "collect per dye lot or print campaign and link recipe to accepted output"
      unit: "kg, m3, kWh, MJ, and parameter-specific units"
      frequency: "each batch or campaign; emissions at required monitoring frequency"
      temporal_coverage: "same period as reference product"
      site_scope: "all included dyeing and printing lines"
      aggregation_rule: "sum direct recipe and meter values; normalize to accepted output; keep rework and cleaning attributable"
      quality_evidence: "meter calibration; recipe approval; chemical stock reconciliation; colour QA; laboratory QA"
    - protocol_id: cp_finishing_records
      process_id: "finishing"
      flow_role: "fabric, finish chemicals, energy, output, and direct air emissions"
      record_type: "recipe, batch, meter, production, and stack or emission-factor records"
      raw_fields: "finish_type; lot_id; fabric_in; fabric_out; formulation_and_mass; electricity; steam; heat; fuel; exhaust_flow; temperature; dust; TVOC; formaldehyde; ammonia"
      collection_method: "collect each finish and thermal-treatment campaign; measure emissions or retain documented factor and operating data"
      unit: "kg, kWh, MJ, Nm3, and kg pollutant"
      frequency: "each batch or campaign; emissions at required monitoring frequency"
      temporal_coverage: "same period as reference product"
      site_scope: "all included finishing, drying, curing, and heat-setting equipment"
      aggregation_rule: "sum by finish route; calculate pollutant mass flow from representative concentration and exhaust flow"
      quality_evidence: "meter calibration; recipe and chemical inventory reconciliation; stack-test report; operating log; acceptance test"
    - protocol_id: cp_wastewater_treatment_records
      process_id: "wastewater_treatment"
      flow_role: "influent, reagents, electricity, effluent, pollutant loads, and sludge"
      record_type: "flowmeters, reagent issues, submeters, laboratory results, and sludge tickets"
      raw_fields: "source_process; influent_volume; influent_concentration; effluent_volume; effluent_concentration; sample_basis; electricity; reagent_mass; sludge_wet_mass; dry_solids_fraction; destination"
      collection_method: "use flow-proportional composite sampling where appropriate; link representative samples to discharge volume"
      unit: "m3, kg, kWh, mg/L, and kg dry solids"
      frequency: "flow continuous where available; parameters at permit or BAT frequency; aggregate monthly"
      temporal_coverage: "same period as reference product"
      site_scope: "on-site treatment receiving included textile wastewater"
      aggregation_rule: "pollutant load = representative concentration × corresponding volume; allocate shared treatment by volume and pollutant load"
      quality_evidence: "calibration; chain of custody; accredited laboratory result; sampling plan; sludge ticket; flow balance"
  calculation_rules:
    - id: calc_rule_1
      applies_to: "yarn consumption by fibre"
      rule: "dry-basis yarn consumption = opening stock + receipts - returns - closing stock; multiply each yarn amount by verified fibre fractions and normalize to saleable reference fabric"
      inputs:
        - "stock and issue masses"
        - "moisture basis"
        - "fibre composition"
        - "reference output"
      output: "kg cotton yarn equivalent and kg of each man-made fibre yarn equivalent per kg reference fabric"
      source_ids:
        - un-cpc-3-2025
    - id: calc_rule_2
      applies_to: "roll records converted to mass"
      rule: "fabric mass = roll length × usable width × measured mass per unit area; use matched lot values and reconcile against scale measurements where available"
      inputs:
        - length
        - "usable width"
        - "mass per unit area"
      output: "kg fabric"
      source_ids:
        - eu-pef-2021
    - id: calc_rule_3
      applies_to: "process normalization"
      rule: "normalized amount = attributable reporting-period flow ÷ conforming process output; then link intermediate process results to the final 1 kg reference flow through measured yields"
      inputs:
        - "attributable flow"
        - "process output"
        - rework
        - "stock change"
        - yield
      output: "row-specific amount per process output and per kg reference fabric"
      source_ids:
        - eu-pef-2021
    - id: calc_rule_4
      applies_to: "water consumption"
      rule: "net process water = supplied water - verified internally reused or recycled water returned to the process; separately report wastewater discharge and water embodied in product or waste"
      inputs:
        - "supplied water"
        - "internal reuse"
        - "wastewater volume"
      output: "m3 net water per kg process output"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_rule_5
      applies_to: "energy"
      rule: "convert each carrier to MJ only for an additional aggregate indicator; retain original electricity, fuel, steam, and heat quantities and conversion factors"
      inputs:
        - "kWh electricity"
        - "fuel mass or volume and heating value"
        - "steam or heat quantity"
      output: "carrier-specific amounts and MJ per kg process output"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_rule_6
      applies_to: "wastewater pollutant load"
      rule: "pollutant load = representative concentration × corresponding discharge volume, with unit conversion; calculate influent and effluent loads on matched sampling periods"
      inputs:
        - concentration
        - volume
        - "sampling period"
      output: "kg pollutant per kg reference fabric"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_rule_7
      applies_to: "textile mass balance"
      rule: "closure = yarn and fabric inputs + attributable finish add-on - saleable fabric - textile waste - samples - stock increase; report unexplained difference relative to total textile input"
      inputs:
        - "textile input/output masses"
        - "finish add-on"
        - waste
        - samples
        - "stock change"
      output: "kg difference and percent closure"
      source_ids:
        - eu-textiles-bat-2022
  data_quality_requirements:
    - id: dqr_identity
      applies_to: "product identity"
      requirement: "Retain lot-level evidence that cotton is below 85% of dry textile mass and that the non-cotton component is mainly or solely man-made fibre; identify every fibre type and declared product state."
      evidence: "bill of materials; supplier certificate; composition test; product specification"
    - id: dqr_completeness
      applies_to: "process and flow coverage"
      requirement: "Cover all required operations and every conditional operation performed on the product; inventory materials, chemicals, water, energy, waste, wastewater, and direct emissions without silent cut-offs."
      evidence: "process flow sheet; input-output inventory; data-gap register; boundary reconciliation"
    - id: dqr_temporal
      applies_to: "reference period"
      requirement: "Use at least 12 consecutive representative months where available; for shorter campaigns cover the full campaign and disclose seasonality, start-up, shutdown, and abnormal production."
      evidence: "production calendar; meter extracts; campaign records; representativeness statement"
    - id: dqr_technology
      applies_to: "route and equipment"
      requirement: "Identify loom technology, sizing route, wet-process mode, liquor ratio or pick-up where relevant, drying or heat-setting technology, wastewater route, and abatement."
      evidence: "equipment list; route sheet; operating parameters; site diagram"
    - id: dqr_geography
      applies_to: "site and upstream datasets"
      requirement: "Declare manufacturing geography and electricity, water, fuel, yarn, chemical, and treatment dataset geography; justify proxies."
      evidence: "site metadata; supplier location; dataset metadata; proxy justification"
    - id: dqr_precision
      applies_to: "measured and calculated amounts"
      requirement: "Report meter and scale calibration, sampling design, allocation shares, missing-data treatment, and uncertainty or variability for material flows."
      evidence: "calibration certificates; laboratory QA; allocation workbook; uncertainty record"
    - id: dqr_consistency
      applies_to: "bilingual and machine projection"
      requirement: "Use the same process ids, row ids, rule ids, controlled tokens, source ids, and normative meaning in both languages, and regenerate structured.yaml after canonical Markdown changes."
      evidence: "bilingual alignment review; deterministic projection check"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "PCR and reference-flow identity"
    rule: "The reference product UUID, Mass flow-property UUID, mass unit-group UUID, and kg unit shall exactly match the declared reference object."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "fibre composition"
    rule: "Cotton mass fraction shall be less than 0.85, fibre fractions shall sum to 1 within declared rounding tolerance, and the non-cotton component shall be mainly or solely man-made fibre; missing fibre-type fractions are an error."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validation_rule_3
    applies_to: "required qualifiers"
    rule: "Dry or conditioned basis, reference moisture, fibre fractions, weave, mass per area, usable width, product state, colour or print route, finish, geography, period, and included operations shall be present."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validation_rule_4
    applies_to: "process-map completeness"
    rule: "yarn_preparation, weaving, and inspection_mending shall be present; each conditional process performed for the declared product shall be included, and every excluded or outsourced operation shall be disclosed with its dataset link."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validation_rule_5
    applies_to: "textile mass balance"
    rule: "Yarn and fabric inputs, finish add-on, saleable output, waste, samples, rework, and stock change shall be reconciled on one textile mass basis; an unexplained difference outside the producer's documented tolerance is an error."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validation_rule_6
    applies_to: "water, energy, chemicals, and emissions"
    rule: "For each included process, water, each energy carrier, process chemicals, waste, wastewater, and direct emissions shall be present or explicitly confirmed as not applicable with evidence."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validation_rule_7
    applies_to: "wet-process wastewater"
    rule: "Wet pre-treatment, coloration, or wet finishing shall identify wastewater route, volume, and available pollutant parameters; on-site treatment shall distinguish influent transfer, treated discharge, reuse, and sludge."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validation_rule_8
    applies_to: "allocation"
    rule: "Shared flows shall identify the allocation driver and denominator; subdivision shall be preferred, and economic allocation without a documented reason and sensitivity disclosure is an error."
    source_ids:
      - eu-pef-2021
  - rule_id: validation_rule_9
    applies_to: "evidence and foreground amounts"
    rule: "Every externally constrained rule shall cite a listed source id; where no reliable source value exists, the inventory amount shall remain a foreground_record requirement rather than an AI-authored range."
    source_ids:
      - eu-pef-2021
  - rule_id: validation_rule_10
    applies_to: "completeness and representativeness"
    rule: "The dataset shall disclose temporal, technological, geographical, and precision evidence plus all data gaps, proxies, cut-offs, and excluded processes."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground plant-gate dataset for the production of woven cotton/man-made-fibre blend fabric."
  downstream_use: "May be used as a secondary_dataset or background_dataset for garments, made-up textiles, industrial textile products, and lifecycle models when composition, construction, finish, geography, technology, and period are representative."
  allowed_use: "Modelling of the declared saleable fabric state within the reported plant-gate boundary; comparison only after aligning fibre composition, mass basis, product state, included wet processes, allocation, geography, technology, and data quality."
  excluded_use: "Fibre or yarn production; knitted, nonwoven, coated, laminated, or special fabrics; garment manufacture; use and end-of-life; or any product with cotton at or above 85% unless a separate reviewed rule explicitly applies."
  required_metadata: "PCR id; reference UUIDs; composition by fibre; dry or conditioned mass basis; moisture; weave; mass per area; width; greige/bleached/dyed/printed/finished state; colour and finish; mill and upstream geographies; technology; reporting period; included and outsourced operations; water and wastewater route; allocation; source and dataset versions kept in dataset metadata."
  required_quality_disclosure: "Completeness; temporal, technological, and geographical representativeness; precision; meter and laboratory QA; allocation shares; mass-balance closure; proxy datasets; data gaps; cut-offs; provisional ranges; and uncertainty."
  update_trigger: "Change in fibre composition or supplier route, product state, loom or wet-process technology, finish chemistry, energy or water system, wastewater treatment, allocation driver, geography, or representative performance beyond the documented variability; otherwise review at least every three years."
