system_boundary:
  rules:
    - rule_id: boundary_foreground_gate_to_gate
      applies_to: "Foreground fabric production"
      rule: "Include yarn preparation, terry weaving, route-applicable wet processing, finishing, drying, inspection, packing, on-site waste handling, and direct emissions from the declared yarn-at-mill starting condition to saleable fabric at the plant gate."
      source_ids:
        - un-cpc-3-26850
        - eu-textiles-bat-2022
        - jrc-textiles-bref-2023
    - rule_id: boundary_route_specificity
      applies_to: "Conditional production steps"
      rule: "Include pretreatment, dyeing, washing, rinsing, chemical finishing, direct heating, and heat-setting only when performed for the declared product; identify omitted route steps explicitly."
      source_ids:
        - eu-textiles-bat-2022
        - gutarowska-et-al-2020-terry
    - rule_id: boundary_upstream_links
      applies_to: "Purchased inputs"
      rule: "Link every purchased yarn, process chemical, utility, fuel, steam, water, and packaging input to a compatible upstream dataset; do not absorb upstream production into an unreported residual."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_no_silent_cutoff
      applies_to: "Foreground inventory"
      rule: "Identify all known foreground inputs, products, co-products, wastes, and emissions. Any exclusion requires a documented reason and significance assessment."
      source_ids:
        - eu-pef-2021
        - eu-textiles-bat-2022
    - rule_id: boundary_outside_scope
      applies_to: "Downstream life cycle"
      rule: "Exclude conversion into made-up articles, distribution beyond the plant gate, use and laundering, and end-of-life treatment from this foreground dataset; downstream studies shall add them separately."
      source_ids:
        - eu-pef-2021
