allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared foreground operations"
    rule: "Avoid allocation by separately metering or subdividing yarn preparation, weaving, wet processing, finishing, and packing wherever the process or batch can be separately observed."
    source_ids:
      - eu-pef-2021
      - eu-textiles-bat-2022
  - rule_id: allocation_physical
    applies_to: "Unavoidable shared inputs and outputs"
    rule: "When subdivision is not possible, allocate using a documented physical relationship that reflects the causal use of the shared input or generation of the shared output, using product-specific mass, machine time, bath loading, or metered activity as appropriate."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_economic_last_resort
    applies_to: "Multi-product operation without a defensible physical relationship"
    rule: "Use economic allocation only when no defensible physical relationship can be established; record prices, period, currency, calculation, sensitivity, and affected exchanges."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_waste_and_recycling
    applies_to: "Textile waste, recovered materials, and treatment outputs"
    rule: "Report each waste destination and any recovered material separately. Do not apply an avoided-burden credit inside this foreground dataset unless the downstream study documents the applicable recycling method and prevents double counting."
    source_ids:
      - eu-pef-2021
      - eu-textiles-bat-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_input
      process_id: "terry_weaving"
      flow_role: "Each named yarn input"
      record_type: "Batch issue, return, and inventory record"
      raw_fields: "row_id; material identity; supplier; lot; issued mass; returned mass; moisture basis; batch_id"
      collection_method: "Reconcile weighed issue and return records to stock movement"
      unit: "kg"
      frequency: "Each production batch"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope weaving lines"
      aggregation_rule: "Sum net issued mass by row_id and batch, then normalise to conforming process output"
      quality_evidence: "Scale calibration; signed batch sheet; inventory reconciliation"
    - protocol_id: cp_chemical_recipe
      process_id: "terry_weaving_pretreatment_dyeing_finishing_packing"
      flow_role: "One named chemical formulation per row_id"
      record_type: "Recipe, dosing, and stock record"
      raw_fields: "row_id; commercial product identity; concentration; lot; dose; returned quantity; batch_id"
      collection_method: "Use automated dosing total or verified weighed addition for each formulation"
      unit: "kg"
      frequency: "Each batch or recipe make-up"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope sizing, wet-processing, and finishing equipment"
      aggregation_rule: "Sum net formulation mass by row_id; do not merge formulations"
      quality_evidence: "Dosing calibration; recipe approval; safety data sheet; stock reconciliation"
    - protocol_id: cp_electricity
      process_id: "terry_weaving_pretreatment_dyeing_finishing_packing"
      flow_role: "Process electricity"
      record_type: "Submeter and operating record"
      raw_fields: "meter_id; opening; closing; process_id; batch_id; downtime; shared-load basis"
      collection_method: "Read calibrated process meter; if shared, document allocation driver"
      unit: "kWh"
      frequency: "Continuous or each batch, reconciled monthly"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope process equipment and attributable auxiliaries"
      aggregation_rule: "Net meter consumption less documented exports, allocated only under Section 7"
      quality_evidence: "Meter calibration; utility invoice reconciliation; allocation record"
    - protocol_id: cp_thermal_energy
      process_id: "pretreatment_dyeing_finishing_packing"
      flow_role: "Process steam"
      record_type: "Steam meter or boiler balance"
      raw_fields: "meter_id; steam mass or energy; pressure; condensate return; process_id; batch_id"
      collection_method: "Read process steam meter or derive from a documented measured site balance"
      unit: "kg steam or MJ"
      frequency: "Continuous or each batch, reconciled monthly"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope wet-processing and finishing equipment"
      aggregation_rule: "Convert with documented measured conditions and normalise to process output"
      quality_evidence: "Meter calibration; boiler log; balance closure"
    - protocol_id: cp_fuel
      process_id: "finishing_packing"
      flow_role: "Natural gas for direct heating"
      record_type: "Fuel meter and burner operating record"
      raw_fields: "meter_id; opening; closing; calorific basis; equipment_id; batch_id"
      collection_method: "Read dedicated fuel meter or auditable site balance"
      unit: "m3 or MJ"
      frequency: "Continuous or each batch, reconciled monthly"
      temporal_coverage: "Complete reporting period"
      site_scope: "In-scope direct-fired drying and heat-setting equipment"
      aggregation_rule: "Convert using documented billing or measured calorific value"
      quality_evidence: "Meter calibration; fuel invoice; burner log"
    - protocol_id: cp_water
      process_id: "pretreatment_dyeing_finishing_packing"
      flow_role: "Process water"
      record_type: "Water meter and batch-liquor record"
      raw_fields: "meter_id; opening; closing; process step; batch_id; reused volume"
      collection_method: "Read process meter or verified machine fill volumes and identify reused water"
      unit: "m3"
      frequency: "Each batch or daily, reconciled monthly"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope wet-processing and finishing operations"
      aggregation_rule: "Sum fresh make-up water by process after separately recording internal reuse"
      quality_evidence: "Meter calibration; water balance; batch record"
    - protocol_id: cp_product_input
      process_id: "pretreatment_dyeing_finishing_packing"
      flow_role: "Intermediate fabric input"
      record_type: "Batch transfer and weighing record"
      raw_fields: "row_id; product identity; batch_id; mass; moisture basis; source_process"
      collection_method: "Weigh transferred fabric or use verified roll masses"
      unit: "kg"
      frequency: "Each batch transfer"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope inter-process transfers"
      aggregation_rule: "Sum by row_id and receiving process without double counting internal transfers"
      quality_evidence: "Scale calibration; transfer ticket; batch genealogy"
    - protocol_id: cp_product_output
      process_id: "terry_weaving_pretreatment_dyeing_finishing_packing"
      flow_role: "Conforming process output"
      record_type: "Production and quality-release record"
      raw_fields: "row_id; batch_id; roll_id; gross mass; packaging mass; net mass; moisture basis; grade; disposition"
      collection_method: "Weigh net fabric or verify roll length times measured mass per unit area"
      unit: "kg"
      frequency: "Each roll and batch"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope output and inspection stations"
      aggregation_rule: "Sum conforming net mass; exclude packaging and rejected fabric"
      quality_evidence: "Scale calibration; inspection release; roll reconciliation"
    - protocol_id: cp_packaging
      process_id: "finishing_packing"
      flow_role: "Each packaging component"
      record_type: "Packaging issue and packed-unit record"
      raw_fields: "row_id; material identity; unit mass; quantity issued; returns; roll_id"
      collection_method: "Weigh component or use verified component specification and packed count"
      unit: "kg"
      frequency: "Each packing batch"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope packed reference product"
      aggregation_rule: "Sum net packaging mass shipped by row_id"
      quality_evidence: "Specification; scale calibration; issue-return reconciliation"
    - protocol_id: cp_waste_output
      process_id: "terry_weaving_finishing_packing"
      flow_role: "Each named solid waste"
      record_type: "Segregated waste weighing and destination record"
      raw_fields: "row_id; waste identity; container tare; gross mass; destination; manifest_id; batch_id"
      collection_method: "Weigh each segregated waste stream net of tare"
      unit: "kg"
      frequency: "Each collection event"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope production and inspection areas"
      aggregation_rule: "Sum net mass by row_id and destination"
      quality_evidence: "Scale calibration; waste manifest; contractor receipt"
    - protocol_id: cp_wastewater
      process_id: "pretreatment_dyeing_finishing_packing"
      flow_role: "Wastewater leaving a process"
      record_type: "Flow meter, routing, and monitoring record"
      raw_fields: "row_id; meter_id; volume; origin process; destination; sampling_id; batch_id"
      collection_method: "Meter discharge and preserve separately managed stream identity"
      unit: "m3"
      frequency: "Continuous or each discharge event"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope wet-process and finishing outlets"
      aggregation_rule: "Sum by row_id, origin, and destination; do not combine routes before disclosure"
      quality_evidence: "Meter calibration; water balance; treatment or discharge record"
    - protocol_id: cp_air_emission
      process_id: "terry_weaving_finishing_packing"
      flow_role: "One named direct air emission per row_id"
      record_type: "Stack or diffuse-emission monitoring record"
      raw_fields: "row_id; emission point; measured concentration; gas flow; duration; method; batch_id"
      collection_method: "Use direct measurement where available; otherwise calculate from site-specific activity data and a documented factor"
      unit: "kg"
      frequency: "At the applicable monitoring frequency and for material process changes"
      temporal_coverage: "Representative of complete reporting period"
      site_scope: "All relevant in-scope emission points"
      aggregation_rule: "Calculate mass emission by row_id and aggregate only after retaining point-level evidence"
      quality_evidence: "Laboratory report; method and calibration record; activity-factor trace"
  calculation_rules:
    - id: calc_reference_normalisation
      applies_to: "Every foreground exchange"
      rule: "Divide the collected exchange quantity by net saleable reference-product mass for the same consistent reporting scope; retain unnormalised values and units."
      inputs:
        - "Collected exchange quantity"
        - "net reference-product mass"
      output: "Exchange per kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_intermediate_normalisation
      applies_to: "Process-specific exchange"
      rule: "Divide the collected exchange quantity by the conforming output mass of that process before linking the process to the final reference flow."
      inputs:
        - "Exchange quantity"
        - "conforming process output mass"
      output: "Exchange per kg process output"
      source_ids:
        - eu-pef-2021
    - id: calc_area_to_mass
      applies_to: "Area-only fabric records"
      rule: "Multiply measured fabric area by batch-specific measured mass per unit area, then convert to kg with the measurement basis documented."
      inputs:
        - "Fabric area"
        - "measured mass per unit area"
      output: "Fabric mass"
      source_ids:
        - eu-pef-2021
    - id: calc_water_balance
      applies_to: "Wet processing and finishing"
      rule: "Reconcile water input, internal reuse, wastewater output, retained water, evaporation, and documented losses for the same process and period; investigate unexplained imbalance."
      inputs:
        - "Metered water and wastewater"
        - reuse
        - "process records"
      output: "Audited process water balance"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_mass_reconciliation
      applies_to: "Yarn-to-fabric and final finishing"
      rule: "Reconcile input fabric and material mass to conforming output, waste, retained process material, and documented moisture-basis change without using the reconciliation to invent missing exchanges."
      inputs:
        - "Material inputs"
        - "product outputs"
        - waste
        - "moisture records"
      output: "Audited process mass reconciliation"
      source_ids:
        - eu-textiles-bat-2022
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and qualifiers"
      requirement: "Demonstrate CPC 26850 scope and declare fibre composition, pile construction, width, mass per unit area, market state, finish, and quality grade."
      evidence: "Product specification; classification decision; quality release"
    - id: dq_measurement
      applies_to: "All foreground records"
      requirement: "Use calibrated measurements or auditable business records; identify estimated or allocated records and retain the calculation."
      evidence: "Calibration certificates; meters; invoices; batch records; calculation trace"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Account for all known process inputs, products, wastes, and direct emissions identified by the site's input/output inventory; document every exclusion."
      evidence: "Input/output inventory; process flow sheet; completeness reconciliation"
    - id: dq_temporal
      applies_to: "Reporting period"
      requirement: "Use a continuous period representative of normal production and disclose shutdowns, atypical campaigns, recipe changes, and missing intervals."
      evidence: "Production calendar; meter coverage; exception log"
    - id: dq_technological
      applies_to: "Route and equipment"
      requirement: "Match records to the declared terry weaving, wet-processing, finishing, drying, and packing technologies."
      evidence: "Equipment list; route sheet; batch genealogy"
    - id: dq_geographical
      applies_to: "Site and upstream links"
      requirement: "Declare the production geography and match electricity, water, fuel, transport, and other upstream datasets to the relevant geography where available."
      evidence: "Site metadata; supplier and utility records; upstream dataset metadata"
    - id: dq_uuid
      applies_to: "Tiangong identities"
      requirement: "Use a UUID only after the row UUID and payload UUID agree and the public row's type, classification, flow property, and unit are directly confirmed. Leave unresolved atomic rows without UUIDs."
      evidence: "Direct read evidence and manifest unresolved row_id list"
validation_rules:
  - rule_id: validation_product_identity
    applies_to: "Dataset identity"
    rule: "Fail if the product is not a non-narrow woven terry fabric in CPC 26850 or if fibre composition, pile construction, market state, and finish are not declared."
    source_ids:
      - un-cpc-3-26850
  - rule_id: validation_reference_flow
    applies_to: "Quantitative reference"
    rule: "Fail if the reference product is not linked to 93944c2a-106d-4c2d-9785-58ec3fc17a42, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, or if packaging mass is included in reference mass."
    source_ids:
