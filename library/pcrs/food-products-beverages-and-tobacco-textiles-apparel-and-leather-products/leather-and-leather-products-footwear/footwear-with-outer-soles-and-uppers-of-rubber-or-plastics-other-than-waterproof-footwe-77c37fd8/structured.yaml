measurement_rules:
  - id: reference_pair_count
    applies_to: "conforming finished footwear"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Count one matched left-and-right pair as one item after final inspection; record single shoes only after matching the left and right shoes into a pair."
  - id: reference_pair_mass
    applies_to: "conforming finished pair"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh the complete pair after conditioning, exclude detachable sales packaging, and retain reference size, sample count, arithmetic mean, and scale resolution as m_pair."
  - id: pair_mass_conversion
    applies_to: "pair-to-mass reporting"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg/pair"
    rule: "Divide each per-pair exchange by m_pair for per-kg reporting; preserve the original pair inventory and m_pair so conversion is reversible."
  - id: component_mass_basis
    applies_to: "compounds, sheets, components, product, and solid waste"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record gross input, conforming incorporated mass, recoverable regrind or offcut, reject, and disposed mass by specific material and fate; do not hide losses inside product net mass."
  - id: energy_unit_preservation
    applies_to: "electricity and fuel inputs"
    required_property_ref:
      name: "Energy or net calorific value"
      uuid: ""
    required_unit: "kWh for electricity; MJ for fuel"
    rule: "Preserve metered units and conversion factors. Electricity, purchased heat, steam, and each fuel are separate exchanges."
  - id: water_unit_preservation
