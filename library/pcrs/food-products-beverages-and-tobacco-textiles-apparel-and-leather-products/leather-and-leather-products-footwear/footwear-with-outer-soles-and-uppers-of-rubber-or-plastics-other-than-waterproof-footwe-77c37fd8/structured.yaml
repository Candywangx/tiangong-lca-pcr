allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "all foreground processes"
    rule: "Prefer direct measurement, physical subdivision, and separate submetering. Allocate shared inputs or emissions only when subdivision is not feasible."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_shared_energy
    applies_to: "shared equipment and site utilities"
    rule: "Allocate shared electricity and fuel using causal machine operating time multiplied by measured or rated load; disclose the meter, period, allocation driver, and unallocated balance."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_material_regrind
    applies_to: "internal PVC, EVA, or rubber regrind"
    rule: "Record material sent to regrinding and material returned to a later charge as two linked internal quantities; count only make-up virgin or externally supplied material at the system boundary and disclose quality loss."
    source_ids:
      - afw-pefcr-v3-1-2025
      - unido-ilo-footwear-1982
  - rule_id: allocation_waste_fate
    applies_to: "scrap, rejects, wastewater, and chemical residue"
    rule: "Split quantities by actual reuse, recycling, recovery, treatment, and disposal fate. Do not give an avoided-product credit inside the gate-to-gate foreground package unless the downstream study explicitly applies an accepted allocation or circular-footprint method."
    source_ids:
      - afw-pefcr-v3-1-2025
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference_product
      process_id: "final_assembly_and_packaging"
      flow_role: "conforming and rejected pair output"
      record_type: "production, inspection, and scale records"
      raw_fields: "style_id; size; conforming_pairs; rejected_pairs; pair_mass_kg; scale_id; disposition"
      collection_method: "reconcile line count with inspection disposition and weigh a documented sample of conditioned pairs"
      unit: "pair; kg"
      frequency: "each lot, aggregated monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all included assembly lines"
      aggregation_rule: "sum counts; arithmetic mean pair mass by style and reference size; retain rejects separately"
      quality_evidence: "signed production reconciliation, calibration record, and inspection log"
    - protocol_id: cp_bom_materials
      process_id: "all_foreground_processes"
      flow_role: "compounds, sheets, components, and trims"
      record_type: "approved BOM, issue, return, and stock records"
      raw_fields: "material_id; formulation; supplier; lot; opening_stock; receipts; issue; return; closing_stock; component_mass"
      collection_method: "reconcile approved BOM to material issue and stock movement by atomic material"
      unit: "kg"
      frequency: "each production order, aggregated monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all included component and assembly sites"
      aggregation_rule: "opening plus receipts minus closing minus documented returns; no cross-material aggregation"
      quality_evidence: "approved BOM revision, supplier specification, and stock reconciliation"
    - protocol_id: cp_process_energy
      process_id: "all_foreground_processes"
      flow_role: "electricity and natural gas"
      record_type: "submeter, fuel invoice, and machine-hour records"
      raw_fields: "meter_id; start; end; fuel_volume; net_calorific_value; machine_id; operating_hours; rated_load; output"
      collection_method: "use submetered consumption; otherwise document causal machine-time allocation"
      unit: "kWh; MJ"
      frequency: "continuous or each shift, aggregated monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all included processes and shared utilities"
      aggregation_rule: "subtract verified non-production load; allocate only the remaining shared balance"
      quality_evidence: "meter calibration, invoice reconciliation, and allocation worksheet"
    - protocol_id: cp_process_water
      process_id: "bottom_component_forming_one_piece_moulding"
      flow_role: "cooling-water input and wastewater output"
      record_type: "inlet meter, make-up tank, blowdown, and discharge records"
      raw_fields: "inlet_m3; recirculated_m3; blowdown_m3; discharge_m3; treatment_route"
      collection_method: "meter make-up and discharge; identify recirculated water without double counting"
      unit: "m3"
      frequency: "daily or each batch, aggregated monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all included moulding and curing lines"
      aggregation_rule: "sum boundary make-up and discharge by route; reconcile water balance"
      quality_evidence: "meter calibration, water balance, and treatment receipt"
    - protocol_id: cp_process_outputs
      process_id: "all_foreground_processes"
      flow_role: "conforming component output"
      record_type: "transfer and inspection records"
      raw_fields: "component_id; material; good_mass; reject_mass; transfer_lot"
      collection_method: "weigh accepted component transfer and reconcile with rejects"
      unit: "kg; pair"
      frequency: "each lot, aggregated monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all included lines"
      aggregation_rule: "sum conforming output by material and component identity"
      quality_evidence: "signed transfer and inspection records"
    - protocol_id: cp_process_chemicals
      process_id: "final_assembly_and_packaging"
      flow_role: "adhesive and primer consumption"
      record_type: "formulation, safety data, stock, and container records"
      raw_fields: "product_id; solvent_fraction; opening_stock; receipts; closing_stock; returned_product; residue"
      collection_method: "chemical-specific stock balance reconciled with used and waste containers"
      unit: "kg"
      frequency: "each production order, aggregated monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all adhesive and primer stations"
      aggregation_rule: "calculate each chemical separately; never combine adhesive, primer, cleaner, or finish"
      quality_evidence: "current formulation/SDS, stock reconciliation, and waste manifest"
    - protocol_id: cp_packaging_materials
      process_id: "final_assembly_and_packaging"
      flow_role: "cardboard box and tissue paper"
      record_type: "packaging BOM, count, mass, and damage records"
      raw_fields: "packaging_id; unit_mass; issued_count; returned_count; damaged_count"
      collection_method: "weigh each packaging component and reconcile issued counts"
      unit: "kg; item"
      frequency: "each packaging order, aggregated monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all packing lines"
      aggregation_rule: "unit mass times net consumed count, by packaging component"
      quality_evidence: "scale calibration and packaging issue record"
    - protocol_id: cp_waste_and_emissions
      process_id: "all_foreground_processes"
      flow_role: "solid waste, chemical residue, VOC, and particulate emission"
      record_type: "segregated bin weights, waste manifests, chemical balance, stack or extraction tests"
      raw_fields: "row_id; waste_mass; fate; treatment_provider; solvent_input; solvent_waste; captured_dust; measured_emission"
      collection_method: "measure each material-specific waste; derive emissions only with a documented calculation rule when direct measurement is unavailable"
      unit: "kg"
      frequency: "each collection event or test, aggregated monthly"
      temporal_coverage: "complete reporting period with representative emission tests"
      site_scope: "all included processes and control devices"
      aggregation_rule: "sum by atomic flow and fate; reconcile calculated emissions with inputs and captured output"
      quality_evidence: "calibrated scale/test report, chemical composition, waste manifest, and mass-balance worksheet"
  calculation_rules:
    - id: calc_pair_mass_normalization
      applies_to: "all exchanges"
      rule: "amount_per_kg = amount_per_pair / m_pair; retain the original per-pair result."
      inputs:
        - "exchange amount per pair"
        - m_pair
      output: "exchange per kg finished footwear"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_material_reconciliation
      applies_to: "each compound, sheet, component, and chemical"
      rule: "consumption = opening stock + receipts - closing stock - documented return; compare with conforming incorporated mass plus each waste fate."
      inputs:
        - "stock movements"
        - output
        - waste
      output: "reconciled material consumption and closure difference"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_step_yield
      applies_to: "each component-forming step"
      rule: "yield = conforming output mass / accepted input mass; report rather than hiding the complementary loss."
      inputs:
        - "accepted input"
        - "conforming output"
        - "material-specific losses"
      output: "step yield and unreconciled loss"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_shared_energy
      applies_to: "shared electricity or fuel"
      rule: "allocated energy = shared metered energy × causal driver share; driver share uses machine hours × measured or rated load."
      inputs:
        - "shared meter"
        - "operating time"
        - load
        - output
      output: "energy by process and reference pair"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_water_balance
      applies_to: "cooling-water systems"
      rule: "balance difference = make-up water - discharge - evaporation - water retained in output; recirculated water is memorandum information only."
      inputs:
        - make-up
        - discharge
        - "evaporation estimate"
        - "retained water"
      output: "water-balance closure"
      source_ids:
        - eu-pef-method-2021
    - id: calc_voc_mass_balance
      applies_to: "adhesive and primer use"
      rule: "VOC to air = solvent-containing input - solvent in product - captured solvent waste - solvent sent to wastewater; use direct measurement when available."
      inputs:
        - "chemical consumption and solvent fraction"
        - "captured waste"
        - wastewater
      output: "NMVOC emission by chemical route"
      source_ids:
        - eu-ecolabel-footwear-2016
    - id: calc_packaging_mass
      applies_to: "each sales-packaging component"
      rule: "packaging mass = unit mass × net consumed count; keep damaged items in consumption and waste records."
      inputs:
        - "unit mass"
        - issued
        - returned
        - "and damaged counts"
      output: "packaging input per conforming pair"
      source_ids:
        - afw-pefcr-v3-1-2025
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Confirm CPC 29320 scope and document both upper and outer-sole materials, the non-waterproof and non-sports exclusions, style, size, route, and pair mass."
      evidence: "approved product specification, labelling record, BOM, and inspection record"
    - id: dq_bom_coverage
      applies_to: "product BOM"
      requirement: "Provide primary data for at least 95% of BOM mass and 100% of main upper, sole, midsole, lining, metal, and electronic parts; disclose the treatment of every residual share."
      evidence: "BOM coverage calculation and supplier specifications"
    - id: dq_atomicity
      applies_to: "inventory"
      requirement: "Every selected flow is one specific material, component, utility, waste, or elementary emission; route alternatives remain separate cards."
      evidence: "row-level inventory review against issue, meter, and waste records"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use a complete, representative reporting period, normally 12 consecutive months; disclose shutdowns, start-ups, abnormal batches, and shorter periods."
      evidence: "period reconciliation and production calendar"
    - id: dq_mass_balance
      applies_to: "each forming and assembly step"
      requirement: "Reconcile atomic material input to conforming output, internal regrind, off-site recycling, other recovery, disposal, and unexplained difference."
      evidence: "signed step mass balance"
    - id: dq_energy_water
      applies_to: "utilities"
      requirement: "Reconcile process totals to site meters and invoices; disclose allocation drivers and the residual unallocated balance."
      evidence: "meter, invoice, and allocation reconciliation"
    - id: dq_emissions
      applies_to: "VOC and particulate emissions"
      requirement: "Retain test conditions, chemical composition, control-device status, calculation inputs, and captured-waste evidence; do not report an unmeasured data gap as zero."
      evidence: "accredited or documented test report and mass-balance worksheet"
    - id: dq_background_links
      applies_to: "purchased inputs and off-site treatment"
      requirement: "Link geographically and technologically representative datasets or disclose a specific unresolved dataset gap."
      evidence: "dataset identifiers and representativeness review"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Fail if both upper and outer sole are not declared as rubber or plastics, or if the product is waterproof footwear, sports footwear, or another excluded category."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_reference_flow
    applies_to: "reference flow"
    rule: "Fail if one conforming pair, reference size, m_pair, BOM revision, manufacturing route, site, and reporting period are not all declared."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_process_route
    applies_to: "process map"
    rule: "Require either the separately formed component route or the one-piece moulding route, plus final inspection and packing; reject mutually inconsistent route selections."
    source_ids:
      - unido-ilo-footwear-1982
  - rule_id: validate_bom_and_losses
    applies_to: "material inventory"
    rule: "Fail if main materials are aggregated, BOM coverage is below the declared requirement without disclosure, or a process input is not reconciled to conforming output and material-specific loss."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_atomic_flows
    applies_to: "all inventory rows"
    rule: "Fail any collection label, combined energy carrier, combined chemical, combined packaging material, combined waste, or combined emission used as a selected flow."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_energy_water
    applies_to: "utilities"
    rule: "Require electricity, each fuel, water input, and wastewater output to be separate rows with meter, period, allocation, and normalization evidence."
    source_ids:
      - afw-pefcr-v3-1-2025
      - eu-pef-method-2021
  - rule_id: validate_voc
    applies_to: "adhesive and primer route"
    rule: "Require separate chemical consumption and VOC calculation or measurement evidence when solvent-containing adhesive, primer, cleaner, or finish is used."
    source_ids:
      - eu-ecolabel-footwear-2016
  - rule_id: validate_unresolved_identities
    applies_to: "reference and inventory flows"
