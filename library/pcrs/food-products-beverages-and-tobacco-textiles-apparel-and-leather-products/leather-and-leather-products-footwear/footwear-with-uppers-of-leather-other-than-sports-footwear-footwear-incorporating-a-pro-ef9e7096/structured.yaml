allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "product-specific lines, batches, and meters"
    rule: "Subdivide processes and use product-specific records before allocating shared burdens."
    source_ids:
      - iso-14044-2006
      - ec-pefcr-apparel-footwear-2025
  - rule_id: allocation_cutting_and_forming
    applies_to: "shared cutting, forming, and sole-preparation records"
    rule: "Allocate residual shared burdens by the measured mass of material processed when subdivision is unavailable; preserve product-specific offcut mass and do not use final-product revenue."
    source_ids:
      - ec-pefcr-apparel-footwear-2025
  - rule_id: allocation_stitching_and_assembly
    applies_to: "shared stitching, assembly, finishing, and packaging records"
    rule: "Allocate residual shared burdens by accepted Item(s) output for equivalent products; use documented machine time when products require materially different processing and disclose the selected physical driver."
    source_ids:
      - ec-pefcr-apparel-footwear-2025
      - iso-14044-2006
  - rule_id: allocation_waste_and_recovered_material
    applies_to: "offcuts, rejects, residues, and recovered material"
    rule: "Keep every material-specific waste or recovered-material output visible with its measured mass and destination. Do not net sale proceeds, recycling credits, or avoided burdens into foreground inputs; downstream modelling must declare any substitution or end-of-life allocation."
    source_ids:
      - iso-14044-2006
      - ec-pefcr-apparel-footwear-2025
  - rule_id: allocation_upstream_leather
    applies_to: "purchased finished leather datasets"
    rule: "Use the allocation already documented by the selected upstream leather dataset and disclose its animal-system and co-product treatment; do not invent or overwrite upstream allocation inside the footwear process."
    source_ids:
      - navarro-et-al-2020-leather-lca
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_material_records
      process_id: "component_cutting_preparation_upper_stitching_final_assembly_finishing"
      flow_role: "incorporated material or component"
      record_type: "BOM, purchase, issue, return, and stock records"
      raw_fields: "material identity; supplier; lot; issued quantity; returned quantity; stock change; component count; measured unit mass"
      collection_method: "reconcile product BOM to stores and production records"
      unit: "kg and item count"
      frequency: "each lot, aggregated monthly"
      temporal_coverage: "full declared production period"
      site_scope: "all sites and contractors producing the declared item"
      aggregation_rule: "gross issues minus returns and stock increase, normalized to conforming output"
      quality_evidence: "approved BOM; invoices; issue slips; scale calibration; supplier specification"
    - protocol_id: cp_component_yield_records
      process_id: "component_cutting_preparation_upper_stitching_final_assembly_finishing"
      flow_role: "intermediate transfer and yield"
      record_type: "batch transfer and acceptance records"
      raw_fields: "input mass; transferred mass; accepted count; rejected count; work-in-progress change"
      collection_method: "reconcile each component stage by batch or production period"
      unit: "kg and item count"
      frequency: "each batch, aggregated monthly"
      temporal_coverage: "full declared production period"
      site_scope: "every controlled or outsourced component stage"
      aggregation_rule: "transferred output plus specific waste and stock change reconciles to input"
      quality_evidence: "signed transfer records; batch traveller; acceptance record"
    - protocol_id: cp_utility_records
      process_id: "component_cutting_preparation_upper_stitching_final_assembly_finishing_packaging"
      flow_role: "electricity, steam, purchased heat, fuel, or water"
      record_type: "meters, invoices, and operating logs"
      raw_fields: "carrier identity; meter start and end; invoice quantity; equipment hours; production count; conversion factor"
      collection_method: "read dedicated meters where available; otherwise allocate a reconciled shared meter using the applicable allocation rule"
      unit: "kWh, MJ, m3"
      frequency: "meter interval or invoice period, aggregated monthly"
      temporal_coverage: "full declared production period"
      site_scope: "all included production and directly attributable support areas"
      aggregation_rule: "carrier-specific total normalized to conforming output; no carrier netting"
      quality_evidence: "meter calibration; invoices; meter map; conversion record"
    - protocol_id: cp_chemical_records
      process_id: "final_assembly_finishing"
      flow_role: "adhesive or finish"
      record_type: "formulation, SDS, issue, return, and residue records"
      raw_fields: "product name; supplier; formulation; density; issued mass; returned mass; residue mass"
      collection_method: "reconcile each chemical product separately"
      unit: "kg"
      frequency: "each batch, aggregated monthly"
      temporal_coverage: "full declared production period"
      site_scope: "all assembly and finishing sites"
      aggregation_rule: "issued mass minus returns, with residue and emissions separately reported"
      quality_evidence: "current SDS; formulation statement; calibrated scale; issue record"
    - protocol_id: cp_refrigerant_records
      process_id: "final_assembly_finishing"
      flow_role: "HFC-134a charge and release"
      record_type: "equipment inventory and service records"
      raw_fields: "equipment id; refrigerant identity; opening stock; charge; recovery; closing stock"
      collection_method: "equipment-level refrigerant balance"
      unit: "kg"
      frequency: "each service event and annual reconciliation"
      temporal_coverage: "full declared production period"
      site_scope: "directly attributable cooling equipment"
      aggregation_rule: "charge minus recovery and stock increase equals calculated release, with discrepancy disclosed"
      quality_evidence: "service certificate; cylinder log; equipment register"
    - protocol_id: cp_waste_records
      process_id: "all_included_processes"
      flow_role: "material-specific waste"
      record_type: "weigh tickets and destination records"
      raw_fields: "waste identity; process; mass or count; container tare; destination; treatment route"
      collection_method: "weigh each segregated stream or use documented count-to-mass conversion"
      unit: "kg or Item(s)"
      frequency: "each shipment, aggregated monthly"
      temporal_coverage: "full declared production period"
      site_scope: "all included sites and contractors"
      aggregation_rule: "sum by row_id and destination, normalized to conforming output"
      quality_evidence: "calibrated scale; weigh ticket; waste transfer note"
    - protocol_id: cp_water_wastewater_records
      process_id: "final_assembly_finishing"
      flow_role: "process water and wastewater"
      record_type: "water meters, discharge meters, and treatment records"
      raw_fields: "supplied volume; discharged volume; stock or evaporation adjustment; destination"
      collection_method: "separate supply and discharge measurements with a documented water balance"
      unit: "m3"
      frequency: "meter interval, aggregated monthly"
      temporal_coverage: "full declared production period"
      site_scope: "assembly and finishing areas using water"
      aggregation_rule: "normalize each stream separately to conforming output"
      quality_evidence: "meter calibration; discharge record; treatment invoice"
    - protocol_id: cp_direct_emission_records
      process_id: "final_assembly_finishing"
      flow_role: "compound-specific air emission"
      record_type: "SDS, formulation, use, capture, recovery, transfer, and monitoring records"
      raw_fields: "compound identity; concentration; product use; captured mass; transferred mass; retained mass; measured exhaust concentration and flow when available"
      collection_method: "calculate or measure each emitted compound separately"
      unit: "kg"
      frequency: "each formulation and monitoring period, aggregated monthly"
      temporal_coverage: "full declared production period"
      site_scope: "all adhesive, cleaning, and finishing emission points"
      aggregation_rule: "compound input minus captured, transferred, retained, and stock-change mass; reconcile with monitoring"
      quality_evidence: "SDS; formulation; monitoring report; capture and waste records"
    - protocol_id: cp_packaging_records
      process_id: "packaging"
      flow_role: "packaging component"
      record_type: "packaging specification, issue, and rejection records"
      raw_fields: "packaging identity; component count; measured empty mass; items per carton; issued quantity; rejected quantity"
      collection_method: "component-specific count and mass reconciliation"
      unit: "kg and item count"
      frequency: "each packaging lot, aggregated monthly"
      temporal_coverage: "full declared production period"
      site_scope: "all packaging sites"
      aggregation_rule: "net issued packaging normalized to conforming packaged output"
      quality_evidence: "packaging specification; scale record; issue and rejection log"
    - protocol_id: cp_product_output_records
      process_id: "final_assembly_finishing_packaging"
      flow_role: "reference and intermediate footwear output"
      record_type: "production, quality acceptance, and packaging records"
      raw_fields: "accepted count; rejected count; physical-shoe count; marketed-pair count; Item(s) convention; model; size"
      collection_method: "reconcile assembly output, packaging input, and packaged output"
      unit: "Item(s) and physical-shoe count"
      frequency: "each batch, aggregated monthly"
      temporal_coverage: "full declared production period"
      site_scope: "all final assembly and packaging sites"
      aggregation_rule: "accepted packaged output is the normalization denominator; discrepancies are investigated"
      quality_evidence: "production order; quality release; packaging record; counting-convention statement"
  calculation_rules:
    - id: normalize_to_reference_item
      applies_to: "every inventory row"
      rule: "normalized amount = exchange quantity in the declared period / conforming packaged output in Item(s) for the same period"
      inputs:
        - "exchange quantity"
        - "conforming packaged output"
        - "Item(s) convention"
      output: "exchange amount per 1 Item(s)"
      source_ids:
        - iso-14044-2006
        - ec-pefcr-apparel-footwear-2025
    - id: convert_pair_records
      applies_to: "records reported per marketed pair"
      rule: "retain pair count and physical-shoe count; convert to Item(s) only with a documented Tiangong counting convention and state the factor used"
      inputs:
        - "pair count"
        - "physical-shoe count"
        - "Item(s) convention"
      output: "Item(s) count with auditable conversion"
      source_ids:
        - ec-pefcr-apparel-footwear-2025
        - eu-ecolabel-footwear-2016
    - id: reconcile_bom_and_losses
      applies_to: "each material or packaging component"
      rule: "gross input = incorporated transfer + material-specific waste + return + closing stock minus opening stock, within documented measurement uncertainty"
      inputs:
        - issues
        - returns
        - "opening and closing stock"
        - "incorporated transfer"
        - "specific waste"
      output: "reconciled material balance and disclosed discrepancy"
      source_ids:
        - ec-pefcr-apparel-footwear-2025
        - eu-ecolabel-footwear-2016
    - id: calculate_compound_air_release
      applies_to: "acetone, ethyl acetate, and toluene"
      rule: "emitted compound = compound entering in products minus compound captured, recovered, transferred in waste or wastewater, retained in product, and stock increase; use measured exhaust results when more representative"
      inputs:
        - formulation
        - "chemical use"
        - capture
        - recovery
        - "waste transfer"
        - retention
        - "stock change"
        - monitoring
      output: "compound-specific emission to air"
      source_ids:
        - eu-ecolabel-footwear-2016
    - id: calculate_hfc134a_release
      applies_to: "HFC-134a refrigerant"
      rule: "release = charge plus opening stock minus recovery minus closing stock, with unexplained imbalance disclosed"
      inputs:
        - charge
        - recovery
        - "opening and closing stock"
      output: "HFC-134a emitted to air"
      source_ids:
        - iso-14044-2006
    - id: allocate_shared_records
      applies_to: "shared utilities and operations"
      rule: "apply allocation rules in section 7 only after subdivision and direct measurement are exhausted; retain the driver and denominator in the data package"
      inputs:
        - "shared total"
        - "product-specific driver"
        - "total driver"
      output: "product-attributed exchange amount"
      source_ids:
        - iso-14044-2006
        - ec-pefcr-apparel-footwear-2025
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference output"
      requirement: "Demonstrate whole other leather-upper footwear identity, CPC 29330 scope, official Tiangong UUID, finished condition, model, size, upper leather, sole construction, and Item(s) convention."
      evidence: "product specification; photographs or technical drawing; BOM; quality release; Tiangong identity record"
    - id: dq_bom_reconciliation
      applies_to: "materials and packaging"
      requirement: "Reconcile the declared BOM to gross inputs, incorporated transfers, specific wastes, returns, and stock changes; add an atomic row for every actual material not already listed."
      evidence: "approved BOM; issue and stock records; component and waste mass balances"
    - id: dq_temporal_alignment
      applies_to: "all foreground records"
      requirement: "Use one declared production period and align material, utility, emission, waste, and output denominators; disclose shutdowns, start-ups, trials, and outsourced periods."
      evidence: "period ledger; meter dates; production calendar; contractor statements"
    - id: dq_atomic_carriers_and_emissions
      applies_to: "utilities, fuels, refrigerants, wastes, and emissions"
      requirement: "Keep electricity, steam, purchased heat, natural gas, HFC-134a, each waste stream, and each emitted compound as separate exchanges; do not report an energy-carrier, VOC, waste, or packaging collection placeholder."
      evidence: "exchange register; invoices; SDS; waste transfer notes; emission calculation workbook"
    - id: dq_geography_technology
      applies_to: "upstream links and foreground processes"
      requirement: "Match upstream datasets and foreground records to the declared geography, leather and sole technology, electricity supply, assembly route, and finishing controls or disclose the mismatch."
      evidence: "supplier declarations; dataset metadata; site process map; utility contract"
    - id: dq_outsourced_operations
      applies_to: "contractors"
      requirement: "Retain outsourced cutting, stitching, component manufacture, finishing, or packaging as an explicit service or product input with transport and upstream dataset; do not treat missing contractor data as zero."
      evidence: "purchase order; contractor process statement; transfer and transport records"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm UUID 985ca5fa-699a-411e-b304-0398fc7b4865, Product flow type, CPC 29330, English baseName Other Leather Shoes, Chinese baseName 其他皮革鞋, flow property UUID 01846770-4cfe-4a25-8ad9-919d8d378345, unit-group UUID 5beb6eed-33a9-47b8-9ede-1dfe8f679159, and Item(s) unit; reject shoe parts, leather intermediates, services, sports footwear, protective metal toe-cap footwear, and narrower product types."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: validate_counting_convention
    applies_to: "reference amount and all item-count rows"
    rule: "Require an explicit statement of whether one Item(s) is one physical shoe or one marketed pair and verify every pair-to-item conversion; absence of that statement is non-conforming."
    source_ids:
      - ec-pefcr-apparel-footwear-2025
      - eu-ecolabel-footwear-2016
  - rule_id: validate_process_coverage
    applies_to: "process map and inventory"
    rule: "Confirm cutting or purchased pre-cut disclosure, upper stitching, lasting and sole attachment, final assembly, applicable finishing, packaging, utilities, direct emissions, wastewater, and material-specific wastes are represented for every controlled or outsourced stage."
    source_ids:
      - ec-pefcr-apparel-footwear-2025
      - rossi-et-al-2021-leather-shoe-lca
      - eu-ecolabel-footwear-2016
  - rule_id: validate_bom_mass_balance
    applies_to: "materials, components, and wastes"
    rule: "Reconcile each actual material and packaging component across input, incorporated output, offcut or reject, return, and stock change; unexplained imbalance must be reported and cannot be hidden by netting materials."
    source_ids:
      - ec-pefcr-apparel-footwear-2025
      - eu-ecolabel-footwear-2016
  - rule_id: validate_atomic_exchanges
    applies_to: "all inventory rows"
    rule: "Reject a collection or selector as Selected flow. Every actual electricity, steam, heat, fuel, refrigerant, chemical, material, packaging component, waste stream, wastewater stream, and emitted compound must have its own card and unit."
    source_ids:
      - ec-pefcr-apparel-footwear-2025
      - iso-14044-2006
  - rule_id: validate_source_and_period
    applies_to: "foreground evidence"
    rule: "Verify that source records, calibration evidence, temporal coverage, site scope, allocation driver, outsourced-operation treatment, and upstream dataset links support the normalized amount for the same declared production period."
    source_ids:
      - iso-14044-2006
      - ec-pefcr-apparel-footwear-2025
  - rule_id: validate_no_case_derived_range
    applies_to: "quantitative ranges"
    rule: "Confirm that no empirical range is authored from a single plant, product, scenario, or paper; this PCR intentionally provides no quantity ranges because two independent boundary-compatible original sources were not established for any inventory amount."
    source_ids:
      - iso-14044-2006
      - rossi-et-al-2021-leather-shoe-lca
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset representing factory-gate production of packaged other leather-upper footwear"
  downstream_use: "Link as a production-stage dataset in a product system; add distribution, use, repair, and end-of-life in a separate lifecycle model when required"
  allowed_use: "Product-specific or technology-matched modelling where CPC scope, upper material, sole construction, Item(s) convention, geography, reference period, and system boundary are compatible"
  excluded_use: "Shoe components, leather production, sports footwear, protective metal toe-cap footwear, miscellaneous special footwear, non-leather-upper footwear, footwear use services, or comparisons that ignore counting and quality differences"
  required_metadata: "PCR id and version state; reference UUID and Item(s) convention; model and size; upper leather and sole construction; geography; reference period; process route; allocation; upstream links; data sources"
  required_quality_disclosure: "BOM and loss reconciliation; primary-data coverage; meter and scale quality; contractor coverage; solvent and refrigerant treatment; waste destinations; data gaps; assumptions; no source-backed ranges available"
  update_trigger: "Change in product construction, upper leather, sole material, adhesive or finish, assembly technology, energy supply, refrigerant, packaging, geography, contractor network, Item(s) convention, allocation, upstream dataset, or material foreground evidence"
