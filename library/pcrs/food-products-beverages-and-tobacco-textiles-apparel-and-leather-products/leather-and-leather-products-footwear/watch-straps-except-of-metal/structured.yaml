allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "allocation_avoid_by_subdivision: First avoid allocation through batch separation, direct weighing, sub-metering, equipment-time records and separate waste tickets. Source: ec-pef-method-2021-2279."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "allocation_shared_equipment: When shared equipment cannot be subdivided, allocate electricity and direct equipment utilities using the closest measured physical driver, normally machine time multiplied by documented load; disclose the driver. Sources: ec-pef-method-2021-2279; ec-apparel-footwear-pefcr-2025."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "allocation_shared_materials: Allocate adhesives, coatings, cleaning agents and packaging by batch issue, recipe, item count or measured mass linked to the declared SKU, not by revenue. Sources: ec-pef-method-2021-2279; ec-apparel-footwear-pefcr-2025."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "allocation_rework: Keep rework within the originating batch when genealogy and records are preserved. Material leaving the process for external recovery or treatment remains an explicit waste output. Source: ec-pef-method-2021-2279."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "allocation_recycling_credit: Report gross material input and named waste output without netting an avoided-material credit into the foreground amount. Any downstream recycling substitution belongs to an explicitly declared lifecycle method outside this foreground package. Source: ec-pef-method-2021-2279."
    source_ids: []
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "allocation_multi_product: If physical relationships cannot represent a genuinely inseparable multi-product process, document the reason, method, affected flows and sensitivity before applying another allocation basis. Source: ec-pef-method-2021-2279."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_body_conversion
      process_id: "p_body_conversion"
      flow_role: "Strap-body materials, utilities, accepted components and route-specific wastes"
      record_type: "Batch issue, meter, production and waste records"
      raw_fields: "batch_id; SKU; material grade; issued and returned mass; item count; machine; meter start/end; accepted mass; waste mass and disposition"
      collection_method: "Calibrated scales, stock reconciliation, sub-meter or documented equipment-time calculation, and batch genealogy"
      unit: "kg; kWh; m3"
      frequency: "Every batch"
      temporal_coverage: "Representative production period, normally 12 consecutive months or the full shorter campaign"
      site_scope: "All controlled body-conversion lines"
      aggregation_rule: "Sum each atomic exchange and normalize by accepted converted-body mass"
      quality_evidence: "Calibration records; supplier labels; batch tickets; meters; waste tickets; signed reconciliation"
    - protocol_id: cp_hardware_assembly
      process_id: "p_hardware_assembly"
      flow_role: "Body components, hardware, joining materials, electricity, assembled output and wastes"
      record_type: "Bill of materials, batch issue, count, meter and reject records"
      raw_fields: "batch_id; SKU; component type; count; mean unit mass; adhesive issue; thread issue; meter start/end; accepted and rejected mass"
      collection_method: "BoM reconciliation, calibrated weighing, verified component counts and sub-metering or equipment-time calculation"
      unit: "kg; count; kWh"
      frequency: "Every batch"
      temporal_coverage: "Same period as reference production"
      site_scope: "All controlled assembly lines"
      aggregation_rule: "Convert counts to mass, sum each named flow and normalize by accepted assembly mass"
      quality_evidence: "Approved BoM; sample-weighing record; batch traveller; meter and reject records"
    - protocol_id: cp_surface_finishing
      process_id: "p_surface_finishing"
      flow_role: "Coating, solvent, water, utilities, finished output, wastes and direct emissions"
      record_type: "Recipe, stock, meter, waste, capture and emissions records"
      raw_fields: "batch_id; coating issue/return; solvent issue/return; water; electricity; hot water; natural gas; captured solvent; waste mass; discharge; emission factor"
      collection_method: "Calibrated issue weighing, meters, waste records and documented mass-balance or monitored-emission calculation"
      unit: "kg; kWh; MJ; m3"
      frequency: "Every batch and each relevant emission period"
      temporal_coverage: "Same period as reference production"
      site_scope: "All controlled finishing and direct-fired drying equipment"
      aggregation_rule: "Normalize each atomic input, waste and emission by finished mass"
      quality_evidence: "Recipe approval; SDS; calibration; meter; waste manifest; monitoring or factor record"
    - protocol_id: cp_quality_control
      process_id: "p_quality_control"
      flow_role: "Incoming straps, electricity, accepted output and rejects"
      record_type: "Batch transfer, test, inspection, meter and reject records"
      raw_fields: "batch_id; SKU; route; input mass; test plan; result; accepted mass; rejected mass; disposition; electricity"
      collection_method: "Calibrated weighing, controlled inspection and testing, and sub-meter or equipment-time calculation"
      unit: "kg; kWh"
      frequency: "Every batch"
      temporal_coverage: "Same period as reference production"
      site_scope: "All final-release stations"
      aggregation_rule: "Sum accepted and rejected mass by batch; normalize by accepted net mass"
      quality_evidence: "Test plan; inspection log; calibration; release and disposition approval"
    - protocol_id: cp_packaging
      process_id: "p_packaging"
      flow_role: "Accepted straps, individual packaging components, electricity, reference output and packaging waste"
      record_type: "Packaging specification, count, issue, weighing, meter and waste records"
      raw_fields: "batch_id; SKU; accepted strap mass; packaging SKU; count; unit mass; electricity; damaged package mass; packed quantity"
      collection_method: "Approved packaging BoM, component sampling, calibrated scales and meter or equipment-time calculation"
      unit: "kg; count; kWh"
      frequency: "Every batch"
      temporal_coverage: "Same period as reference production"
      site_scope: "All packing lines for the declared product"
      aggregation_rule: "Convert each package count to mass and normalize inputs and wastes by net strap mass"
      quality_evidence: "Packaging specification; supplier records; sample weights; meter; waste ticket"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "Reference output"
      rule: "Sum calibrated mass of accepted straps including permanent hardware and finishes; subtract all removable packaging tare"
      inputs:
        - "accepted packed item mass"
        - "packaging tare"
        - "direct net weights"
      output: "kg net watch straps"
      source_ids:
        - ec-pef-method-2021-2279
    - id: calc_counted_component_mass
      applies_to: "Hardware and packaging"
      rule: "Component count × measured mean unit mass for the same SKU and period"
      inputs:
        - count
        - "sampled unit masses"
      output: "kg named component"
      source_ids:
        - ec-pef-method-2021-2279
        - ec-apparel-footwear-pefcr-2025
    - id: calc_shared_electricity
      applies_to: "Shared equipment"
      rule: "Total metered electricity × declared product equipment-time share; use documented load weighting when equipment loads differ"
      inputs:
        - "meter total"
        - "equipment time"
        - "rated or measured load"
      output: "kWh attributable to batch"
      source_ids:
        - ec-pef-method-2021-2279
    - id: calc_material_balance
      applies_to: "Each production process"
      rule: "Named material inputs = accepted named product transfers + named wastes + documented stock change within measurement uncertainty"
      inputs:
        - "issued and returned masses"
        - "accepted output"
        - wastes
        - "stock change"
      output: "reconciled kg by material"
      source_ids:
        - ec-pef-method-2021-2279
    - id: calc_isopropanol_air
      applies_to: "Finishing solvent"
      rule: "Isopropanol issued − returned isopropanol − isopropanol retained in collected waste − captured isopropanol"
      inputs:
        - "stock and waste records"
        - "capture record"
      output: "kg isopropanol to air"
      source_ids:
        - ec-pef-method-2021-2279
    - id: calc_direct_combustion
      applies_to: "Direct-fired drying"
      rule: "Multiply foreground natural-gas energy by the documented site-, supplier- or equipment-specific factor separately for each emission"
      inputs:
        - "natural-gas energy"
        - "factor identity and unit"
      output: "kg named elementary emission"
      source_ids:
        - ec-pef-method-2021-2279
    - id: calc_packaging_mass
      applies_to: "Packaging"
      rule: "Sum each packaging SKU count × its measured empty unit mass; allocate shared shippers by documented packed-item or occupied-mass basis"
      inputs:
        - counts
        - "unit masses"
        - "allocation driver"
      output: "kg by packaging material"
      source_ids:
        - ec-apparel-footwear-pefcr-2025
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and all batch links"
      requirement: "Match CPC 29230 semantic scope and declare body material, construction, compatible interface, dimensions, closure, hardware, colour, finish and packaging."
      evidence: "Product specification, approved BoM, style/SKU sheet and batch genealogy"
    - id: dq_company_specific_foreground
      applies_to: "Controlled manufacturing"
      requirement: "Use company-specific BoM and manufacturing data for controlled processes and cover every known material, energy, product, waste and direct emission."
      evidence: "Batch records, meters, invoices, waste records and ec-pef-method-2021-2279"
    - id: dq_route_completeness
      applies_to: "Process map"
      requirement: "Include the actual body-conversion route and all controlled downstream steps; explain every conditional exclusion."
      evidence: "Process flow diagram, equipment list, site walk-through and ec-apparel-footwear-pefcr-2025"
    - id: dq_atomic_inventory
      applies_to: "Inventory exchanges"
      requirement: "Keep every material grade, chemical, utility, fuel, packaging component, waste and elementary emission as a separate row."
      evidence: "BoM-to-inventory reconciliation and atomic-flow audit"
    - id: dq_temporal_geography_technology
      applies_to: "Foreground and upstream data"
      requirement: "Report production period, site geography, technology and supplier or proxy geography; justify mismatches."
      evidence: "Dataset metadata and ec-pef-method-2021-2279"
    - id: dq_mass_balance
      applies_to: "Body conversion, assembly, finishing, quality and packaging"
      requirement: "Reconcile batch inputs, accepted transfers, wastes and stock changes by named material and disclose residuals."
      evidence: "Signed mass-balance worksheet and ec-pef-method-2021-2279"
    - id: dq_upstream_leather
      applies_to: "Leather route"
      requirement: "Use an upstream finished-leather dataset that covers tanning and leather finishing; do not move those operations into a non-tannery foreground site."
      evidence: "Supplier traceability, upstream dataset scope and jrc-tanning-hides-skins-bref-2013"
    - id: dq_chemicals
      applies_to: "Adhesive, coating, pigment and solvent"
      requirement: "Record supplier identity, trade name, composition evidence, concentration, issued amount, waste and release route without replacing individual chemicals with a collection flow."
      evidence: "SDS, recipe, stock ledger and waste/emission records"
    - id: dq_packaging
      applies_to: "Primary and distribution packaging"
      requirement: "Record each packaging component separately and keep removable packaging outside the net reference mass."
      evidence: "Packaging BoM, unit-mass sampling and ec-apparel-footwear-pefcr-2025"
    - id: dq_unresolved_uuid
      applies_to: "Non-reference inventory flows"
      requirement: "Leave UUID blank until exact hybrid and state-100 direct-read identity checks agree; retain the row-specific gap in manifest review metadata."
      evidence: "Manifest unresolved inventory rows"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "validate_reference_identity: Confirm Product flow UUID 19a79c1e-d7a4-422d-b754-47ea82969f9f, exact name \"Watch straps, except of metal\", public state 100, Mass property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66 and kg reference unit. Source: unsd-cpc-3-29230."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "validate_scope: Reject a dataset whose strap body is metal, or whose output is a watch, watch case, electronic band or standalone hardware rather than a complete non-metal watch strap. Source: unsd-cpc-3-29230."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "validate_reference_mass: Verify that the normalized output equals 1 kg net accepted straps including permanent hardware and excluding removable packaging. Source: ec-pef-method-2021-2279."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "validate_route: Confirm the declared material route matches body-conversion inputs, wastes, upstream datasets and conditional process inclusions. Sources: ec-pef-method-2021-2279; ec-apparel-footwear-pefcr-2025."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "validate_inventory_completeness: Reconcile the product-specific BoM and controlled operations to all known raw materials, energy, products, wastes and air/water/soil emissions. Source: ec-pef-method-2021-2279."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "validate_atomic_flows: Reject any Selected flow that combines multiple materials, utilities, fuels, packaging components, wastes or emissions."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "validate_uuid_gate: Accept a non-reference UUID only after exact hybrid and state-100 direct-read confirmation; otherwise require an empty UUID and a manifest row."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "validate_mass_balance: Check named material inputs against accepted transfers, named wastes and stock changes and investigate material residuals. Source: ec-pef-method-2021-2279."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "validate_direct_emissions: When natural gas or isopropanol is present, require a separate direct-emission record or documented zero-release/capture basis for each applicable elementary flow. Source: ec-pef-method-2021-2279."
