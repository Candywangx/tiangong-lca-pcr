      record_type: "Recipe, purchase, issue, return, mold-cycle, meter, fuel, chiller-service, scale, and waste records"
      raw_fields: "compound identity and mass; cycles; electricity; steam; hot water; natural gas; LPG; R-134a charge, make-up and recovery; component outputs; each scrap; carbon factor"
      collection_method: "Weighed compound dosing, calibrated utility meters, mold-cycle logs, chiller balance, and waste weighing"
