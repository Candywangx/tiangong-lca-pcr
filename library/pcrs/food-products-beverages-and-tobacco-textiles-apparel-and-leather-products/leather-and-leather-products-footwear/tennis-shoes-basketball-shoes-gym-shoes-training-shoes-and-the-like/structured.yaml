  calculation_rules:
    - id: calc_bom_mass_balance
      applies_to: "Each manufacturing process"
      rule: "Reconcile opening stock plus issued material with returned stock, conforming output, each material-specific waste, rejects, and closing stock; investigate rather than invent unexplained differences."
      inputs:
        - "Product-specific BOM"
        - "issue and return"
        - output
        - waste
        - reject
        - "and stock records"
      output: "Signed mass balance by process and SKU"
      source_ids:
        - af-pefcr-2025
    - id: calc_count_to_mass
      applies_to: "Laces, eyelets, sole components, sockliners, boxes, cartons, and labels"
      rule: "Component mass equals the product-specific count multiplied by measured or supplier-declared unit mass."
      inputs:
        - "Count and unit mass"
      output: "kg of one component or packaging item"
      source_ids:
        - af-pefcr-2025
    - id: calc_shared_energy
      applies_to: "Shared manufacturing utilities"
      rule: "Allocate electricity, steam, hot water, natural gas, and LPG separately using carrier-specific meters and causal drivers."
      inputs:
        - "Meter total"
        - "equipment demand or thermal data"
        - "operating time or cycles"
        - "process output"
      output: "kWh or MJ assigned to one process"
      source_ids:
        - eu-pef-2021
    - id: calc_refrigerant_emission
      applies_to: "R-134a sole-molding chiller"
      rule: "R-134a emitted equals opening charge plus make-up minus closing charge minus recovered refrigerant, adjusted only for documented transfers."
      inputs:
        - "Opening and closing charge"
        - make-up
        - recovery
        - transfers
      output: "kg R-134a to air"
      source_ids: []
    - id: calc_solvent_emission
      applies_to: "Ethyl acetate or acetone"
      rule: "Calculate each solvent independently as input plus opening stock minus recovery, amount retained in product and wastes, closing stock, and documented transfers; do not combine VOC species."
      inputs:
        - "Solvent-specific purchase"
        - issue
        - return
        - recovery
        - "waste analysis"
        - "and stock"
      output: "kg of one solvent emitted to air"
      source_ids:
        - eu-pef-2021
    - id: calc_combustion_co2
      applies_to: "Natural gas or LPG"
      rule: "Calculate fossil CO2 separately for each fuel from measured lower-heating-value energy and a documented site or supplier carbon factor."
      inputs:
        - "Fuel-specific energy and carbon factor"
      output: "kg fossil CO2 to air by fuel and process"
      source_ids: []
    - id: calc_reference_normalization
      applies_to: "Complete foreground inventory"
      rule: "Divide every included exchange by net conforming sports-shoe mass, excluding removable packaging, so the reference output equals exactly 1 kg."
      inputs:
        - "Included exchange totals and net reference-product mass"
      output: "Exchange amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021
