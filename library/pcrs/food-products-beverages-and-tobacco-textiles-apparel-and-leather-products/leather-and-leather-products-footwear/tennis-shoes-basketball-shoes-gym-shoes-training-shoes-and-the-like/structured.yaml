system_boundary:
  rules:
    - rule_id: boundary_cpc_scope
      applies_to: "Product identity"
      rule: "Include only finished athletic footwear within CPC 29420 and disclose the intended sport or equivalent training function."
      source_ids:
        - un-cpc-v3-2025
    - rule_id: boundary_factory_gate
      applies_to: "Foreground system"
      rule: "Include all on-site material preparation, upper assembly, included sole molding, lasting, bonding, finishing, inspection, and packaging from purchased inputs to factory-gate product."
      source_ids:
        - af-pefcr-2025
        - eu-pef-2021
    - rule_id: boundary_complete_lci
      applies_to: "Inventory"
      rule: "Include product-specific raw material and component inputs, each energy carrier, products, wastes, and individual emissions to air, water, or soil associated with included manufacturing processes."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_supplier_components
      applies_to: "Purchased components"
      rule: "Link each purchased upper, midsole, outsole, sockliner, or other finished component to a supplier dataset and omit on-site production only for the exact operations covered by that dataset."
      source_ids:
        - af-pefcr-2025
        - eu-pef-2021
    - rule_id: boundary_packaging
      applies_to: "Packaging"
      rule: "Include retail and transport packaging applied before the factory-gate reference point and record each packaging material and waste stream separately."
      source_ids:
        - af-pefcr-2025
boundary_abstraction:
  declared_starting_condition: "Purchased footwear materials and components at the sports-shoe manufacturing factory gate"
  starting_condition_role: "Foreground entry condition for product-specific component conversion and final shoe assembly"
  product_classification_scope: "CPC 29420 tennis, basketball, gym, training, and similar athletic footwear"
  recursive_input_rule: "When a purchased input is already a CPC 29420 shoe or contract-manufactured subassembly carrying the same product function, record it once with its supplier dataset and omit only the operations demonstrably covered upstream; do not recreate the same product category recursively"
  upstream_dataset_requirement: "Supplier datasets shall cover production of every textile, leather, coated textile, polymer, rubber compound, metal component, adhesive, solvent, utility, refrigerant, and packaging material, and each purchased midsole, outsole, upper, or sockliner"
  disclosure: "Declare the product-specific BOM, supplier-made versus on-site components, process inclusion, material and chemical identities, energy carriers, refrigerant, direct air emissions, waste destinations, packaging, plant, geography, and production period"
