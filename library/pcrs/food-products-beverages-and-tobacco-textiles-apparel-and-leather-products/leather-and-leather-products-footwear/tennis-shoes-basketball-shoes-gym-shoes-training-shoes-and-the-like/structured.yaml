      raw_fields: "net product mass; pairs; shoe count; size; tissue mass; box, carton and label counts and unit masses; LDPE issue and return; electricity; each waste"
      collection_method: "Calibrated product scale, count-to-mass measurement, stock records, and packaging-equipment meter"
