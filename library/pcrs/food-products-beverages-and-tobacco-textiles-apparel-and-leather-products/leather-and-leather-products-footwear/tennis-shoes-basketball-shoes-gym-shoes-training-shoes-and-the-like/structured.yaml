validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Reject a dataset unless the output is exactly 1 kg, uses flow 3fb395b7-1901-4a81-8b89-b8300bd9134e, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, kg, and all required qualifiers are declared."
    source_ids:
      - un-cpc-v3-2025
  - rule_id: validate_scope
    applies_to: "Product identity"
    rule: "Reject footwear outside CPC 29420 or without a declared tennis, basketball, gym, training, or similar athletic function."
    source_ids:
      - un-cpc-v3-2025
  - rule_id: validate_atomic_inventory
    applies_to: "Inventory rows"
    rule: "Reject any row combining materials, components, chemicals, energy carriers, refrigerants, packaging, wastes, or emissions; every selected flow shall denote one specific exchange."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_bom_loss
    applies_to: "Materials and components"
    rule: "Require product-specific BOM mass, returned stock, conforming output, material-specific loss, rejects, and stock change to reconcile for every included process."
    source_ids:
      - af-pefcr-2025
  - rule_id: validate_adhesives_and_solvents
    applies_to: "Bonding"
    rule: "Require waterborne polyurethane dispersion, polyurethane resin, ethyl acetate, chlorinated polyolefin primer, acetone, residues, and solvent emissions as separate rows when used; add a separate atomic row for any other actual formulation or substance."
    source_ids:
      - af-pefcr-2025
      - eu-pef-2021
  - rule_id: validate_energy_routes
    applies_to: "Manufacturing energy"
    rule: "Require stage-specific electricity and separate purchased steam, supplied hot water, natural gas, and LPG rows whenever used; prohibit a combined heat or fuel exchange."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_refrigerants
    applies_to: "Cooling systems"
    rule: "Require separate product-input and air-emission rows for every refrigerant actually present; R-134a rows may be not applicable only with equipment and service-log evidence."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_direct_emissions
    applies_to: "Air emissions"
    rule: "Require ethyl acetate, acetone, R-134a, natural-gas fossil CO2, and LPG fossil CO2 as separate species and process rows when applicable."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_packaging
    applies_to: "Packaging"
    rule: "Require tissue paper, shoe box, shipping carton, LDPE bag, paper label, and their material-specific wastes as separate rows when used, and exclude removable packaging from net reference mass."
    source_ids:
      - af-pefcr-2025
  - rule_id: validate_supplier_components
    applies_to: "Purchased components"
    rule: "Require a matching supplier dataset for each purchased upper, midsole, outsole, sockliner, or molded component and omit only the exact on-site operation covered upstream."
    source_ids:
      - af-pefcr-2025
      - eu-pef-2021
  - rule_id: validate_no_reasoned_ranges
    applies_to: "Amounts"
    rule: "Reject undocumented default quantities and AI-generated numeric ranges; use foreground records or documented calculations."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_sources_and_protocols
    applies_to: "Evidence links"
    rule: "Require every source id and collection protocol referenced by an inventory row or rule to resolve to a declared source or protocol."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for CPC 29420 sports shoes"
  downstream_use: "Secondary dataset or background dataset for product systems requiring a matching finished sports-shoe input"
  allowed_use: "Products matching intended sport, size range, pairs per kg, upper, midsole, outsole, sockliner, closure, bonding system, colourway, quality grade, plant technology, geography, period, and packaging"
  excluded_use: "Footwear outside CPC 29420, safety or protective footwear, ski boots, skates, materially different BOMs or production routes, or products with undisclosed reference qualifiers"
  required_metadata: "PCR id; CPC code; reference-flow UUID; intended sport; sizing system and range; pair and shoe count; net mass; product-specific BOM; supplier-made components; process inclusion; adhesives and solvents; energy routes; refrigerants; colourway; grade; packaging; plant; geography; period; allocation; waste destinations"
  required_quality_disclosure: "Foreground coverage; missing or calculated records; BOM version; scale and meter calibration; chemical identity; solvent and refrigerant balances; mass reconciliation; shared-utility allocation; upstream dataset identities; uncertainty and limitations"
  update_trigger: "Reassess after a material change in SKU or BOM, supplier, material composition, component construction, molding route, adhesive or solvent, equipment, refrigerant, energy mix, packaging, waste destination, allocation, geography, or production performance"
