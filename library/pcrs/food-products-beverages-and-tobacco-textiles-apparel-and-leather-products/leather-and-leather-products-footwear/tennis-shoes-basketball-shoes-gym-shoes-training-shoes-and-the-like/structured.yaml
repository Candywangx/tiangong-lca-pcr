measurement_rules:
  - id: reference_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report exactly 1 kg net sports shoes, excluding removable transport packaging; disclose pair count, individual-shoe count, and size range represented by that mass."
  - id: bom_mass
    applies_to: "Materials and components"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile product-specific BOM issue, return, output, scrap, rejects, and stock change without merging materials of different composition."
  - id: chemical_mass
    applies_to: "Adhesive resin, dispersion, primer, and solvents"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain commercial product mass, active content when available, chemical identity, batch, and process use; do not combine adhesive, primer, or solvent rows."
