      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record composition, wet or dry basis where relevant, hazardous status, and treatment destination for each waste exchange."
process_map:
  - id: component_cutting
    name: "Component cutting and preparation"
    inclusion: "required"
    inclusion_condition: "Required when upper and support materials are cut on site; supplier-produced components require matching upstream datasets."
    role: "Convert declared BOM sheet and roll materials into a traceable upper component set."
    quantitative_reference: "kg cut upper component set"
  - id: upper_stitching
    name: "Upper stitching and subassembly"
    inclusion: "required"
    inclusion_condition: "Required for upper subassembly; thread and eyelet rows are conditional on the declared design."
    role: "Join upper components and attach lacing components."
    quantitative_reference: "kg stitched upper"
  - id: sole_molding
    name: "Sole molding and preparation"
    inclusion: "conditional"
    inclusion_condition: "Include each molded material route performed on site; purchased midsoles and outsoles require supplier datasets and skip only the corresponding molding rows."
    role: "Mold and prepare discrete midsole, outsole, and support components."
    quantitative_reference: "kg accepted sole components"
  - id: lasting_bonding_finishing
    name: "Lasting, bonding, and finishing"
    inclusion: "required"
    inclusion_condition: "Required for assembly of upper, sole, sockliner, and declared finishing steps."
    role: "Form the upper on the last, bond sole components, finish, and inspect the sports shoe."
    quantitative_reference: "kg finished sports shoe before packaging"
  - id: final_packaging
    name: "Final inspection and packaging"
    inclusion: "required"
    inclusion_condition: "Required for the factory-gate reference product; each packaging-material row applies only when used."
    role: "Pack and release the declared CPC 29420 product."
    quantitative_reference: "1 kg net reference product"
