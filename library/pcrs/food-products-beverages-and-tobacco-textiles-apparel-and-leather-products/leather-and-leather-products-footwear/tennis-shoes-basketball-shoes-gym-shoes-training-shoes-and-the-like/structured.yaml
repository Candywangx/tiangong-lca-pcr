allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Shared foreground operations"
    rule: "Prefer product subdivision, product-specific BOMs, batch records, separate meters, and direct waste weighing before any allocation is applied."
    source_ids:
      - eu-pef-2021
      - af-pefcr-2025
  - rule_id: allocation_shared_equipment
    applies_to: "Shared cutting, stitching, molding, lasting, bonding, finishing, and packaging equipment"
    rule: "When direct measurement is unavailable, allocate with a documented causal driver such as machine time multiplied by measured demand, processed component mass, mold cycles, pairs processed, or packed units."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_energy_carriers
    applies_to: "Shared electricity, steam, hot water, natural gas, LPG, and refrigeration"
    rule: "Allocate each carrier separately using its own meter and causal driver; never allocate all utilities through one undifferentiated energy total."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_scrap
    applies_to: "Material scrap transferred for recycling"
    rule: "First apply product subdivision and measured scrap; when scrap receives a credit or bears further burdens, disclose the adopted recycling model and do not treat disposal as a co-product."
    source_ids:
      - af-pefcr-2025
      - eu-pef-2021
