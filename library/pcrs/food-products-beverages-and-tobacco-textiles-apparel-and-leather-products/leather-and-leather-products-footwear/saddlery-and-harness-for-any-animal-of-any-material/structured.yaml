    - id: calc_material_balance
      applies_to: "each material route and process"
      rule: "input mass = transferred product + retained mass + separately identified waste + separately identified emissions + documented stock change, within stated measurement uncertainty"
      inputs:
        - "material inputs"
        - intermediates
        - wastes
        - emissions
        - "stock change"
      output: "reconciled mass-balance statement"
