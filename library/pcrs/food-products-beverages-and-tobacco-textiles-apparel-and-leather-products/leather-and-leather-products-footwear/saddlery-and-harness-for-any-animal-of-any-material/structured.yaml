  market_state: "Finished product ready to leave the manufacturing facility"
functional_unit:
  what: "A finished item of saddlery or harness that provides its declared riding-support, animal-control, restraint or load-transfer function"
  how_much: "1 kg net mass of conforming finished product, excluding all packaging mass"
  how_well: "Conforms to the declared product specification for animal/use class, materials, dimensions, load or restraint duty, stitching, hardware, finish and inspection criteria"
  how_long_or_cycle: "One manufacturing reporting period; expected service life may be disclosed but is not imposed by this factory-gate mass reference"
