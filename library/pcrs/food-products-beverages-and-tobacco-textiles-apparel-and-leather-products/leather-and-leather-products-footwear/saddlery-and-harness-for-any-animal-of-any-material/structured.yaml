system_boundary:
  rules:
    - rule_id: boundary_start_finished_inputs
      applies_to: "all routes"
      rule: "Start the foreground at receipt of finished leather, synthetic sheet/fabric, webbing, padding, hardware, thread, chemicals and packaging; link their manufacture to upstream datasets."
      source_ids:
        - eu-pef-2021-2279
        - apparel-footwear-pefcr-v3.1
    - rule_id: boundary_include_factory_operations
      applies_to: "reporting facility"
      rule: "Include all on-site preparation, cutting, sewing, hardware assembly, applicable finishing/drying, inspection, utilities, packaging, wastes and emissions."
      source_ids:
        - eu-pef-2021-2279
        - apparel-footwear-pefcr-v3.1
    - rule_id: boundary_conditional_finishing
      applies_to: "surface finishing"
      rule: "Include edge coating, topcoating, cleaning, wastewater, drying fuel and emissions only when performed at the facility; document their absence otherwise."
      source_ids:
        - eu-tanning-bref
        - eu-pef-2021-2279
    - rule_id: boundary_upstream_leather
      applies_to: "leather route"
      rule: "Keep hide preparation and tanning upstream unless physically performed at the reporting facility; disclose the linked leather dataset and its tanning chemistry."
      source_ids:
        - eu-tanning-bref
    - rule_id: boundary_no_cutoff
      applies_to: "foreground exchanges"
      rule: "Do not omit a known foreground material, utility, packaging component, waste or emission because it is small; record it or document a justified not-applicable determination."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_exclude_downstream
      applies_to: "factory-gate result"
      rule: "Exclude distribution, retail, use, animal care, maintenance, repair and end-of-life from this dataset."
      source_ids:
        - eu-pef-2021-2279
