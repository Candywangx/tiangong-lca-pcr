allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared foreground operations"
    rule: "Avoid allocation by subdividing meters, batches, and process records whenever the declared footwear model can be measured separately."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical
    applies_to: "unavoidable shared operations"
    rule: "When subdivision is not possible, use a documented causal physical driver such as machine time, metered energy, processed mass, or occupied production time; do not use output mass merely because it is available."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_economic_fallback
    applies_to: "shared operations lacking a defensible physical relationship"
    rule: "Use economic allocation only as a disclosed fallback, retain price period and source, and test sensitivity to the most plausible physical alternative."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_internal_rework
    applies_to: "rework and returned intermediate components"
    rule: "Treat same-batch internal rework as an internal loop; count additional energy, materials, chemicals, emissions, and final reject waste without creating a co-product credit."
    source_ids:
      - af-pefcr-v3-1-2025
  - rule_id: allocation_recovery
    applies_to: "offcuts, sawdust, scrap, and packaging waste leaving for recovery"
    rule: "Record the measured waste stream and destination without subtracting an assumed recycling credit from the foreground process; apply the chosen downstream recycling convention consistently outside this foreground inventory and disclose it."
    source_ids:
      - eu-pef-2021
      - af-pefcr-v3-1-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_wood_component_records
      process_id: "wood_component_manufacturing"
      flow_role: "wood, electricity, purchased heat, varnish, accepted component, waste, and dust"
      record_type: "meter, issue-return ledger, scale, moisture record, waste transfer note, emission measurement"
      raw_fields: "batch_id; material_id; species; laminate_type; supplier_lot; issued_mass; returned_mass; moisture_content; accepted_output_mass; electricity; purchased_heat; varnish_id; varnish_mass; waste_mass; dust_measurement; destination"
      collection_method: "Calibrated scales and meters reconciled to production and waste records"
      unit: "kg; kWh; MJ"
      frequency: "each batch, meter period, or transfer"
      temporal_coverage: "representative production period covering declared seasonal operation"
      site_scope: "every included wood-component site and controlled subcontractor"
      aggregation_rule: "Sum by atomic flow and normalize to accepted shaped-component mass and then reference output"
      quality_evidence: "calibration records; supplier specifications; moisture records; meter coverage; waste receipts; capture-system records"
    - protocol_id: cp_flexible_component_records
      process_id: "flexible_component_preparation"
      flow_role: "leather, textile, plastic sheet, thread, electricity, accepted components, and offcuts"
      record_type: "issue-return ledger, scale, meter, cutting and sewing log"
      raw_fields: "batch_id; material_id; supplier_lot; issued_mass; returned_mass; accepted_component_mass; offcut_mass; thread_mass; electricity; destination"
      collection_method: "Batch reconciliation using calibrated scales and submeter or verified equipment runtime"
      unit: "kg; kWh"
      frequency: "each batch"
      temporal_coverage: "representative production period"
      site_scope: "every included cutting and sewing site"
      aggregation_rule: "Sum each material separately and normalize to accepted component and reference output"
      quality_evidence: "supplier composition; scale calibration; meter coverage; cutting plan; waste receipts"
    - protocol_id: cp_bottom_forming_records
      process_id: "nonwood_bottom_forming"
      flow_role: "rubber, EVA, polyurethane system, electricity, steam, cooling water, accepted components, scrap, and wastewater"
      record_type: "formulation and charge sheet, scale, meter, water balance, wastewater transfer record"
      raw_fields: "batch_id; formulation_id; charge_mass; returned_mass; accepted_output_mass; scrap_mass; electricity; steam; make_up_water; wastewater_mass; destination"
      collection_method: "Batch charge and output reconciliation with calibrated utilities meters"
      unit: "kg; kWh; MJ"
      frequency: "each batch and utility meter period"
      temporal_coverage: "representative production period"
      site_scope: "every included forming site"
      aggregation_rule: "Keep each compound and carrier separate; normalize to accepted component and reference output"
      quality_evidence: "formulation certificate; calibration; meter coverage; wastewater and waste receipts"
    - protocol_id: cp_final_assembly_records
      process_id: "final_assembly_finishing"
      flow_role: "intermediate components, nails, adhesives, cleaners, electricity, heat, accepted output, residues, and rejects"
      record_type: "bill of materials, issue-return ledger, scale, meter, chemical inventory, inspection and rework log"
      raw_fields: "batch_id; model; component_id; component_mass; fastener_mass; chemical_id; issued_mass; returned_mass; residue_mass; electricity; heat; accepted_output_mass; reject_mass"
      collection_method: "Batch-level material and utility reconciliation from controlled records"
      unit: "kg; kWh; MJ"
      frequency: "each batch"
      temporal_coverage: "representative production period"
      site_scope: "every included assembly and finishing site"
      aggregation_rule: "Sum each atomic exchange, allocate shared utilities by documented causal driver, and normalize to accepted unboxed output"
      quality_evidence: "BOM; supplier SDS and VOC content; calibration; meter coverage; inspection and waste records"
    - protocol_id: cp_voc_records
      process_id: "wood_component_manufacturing_final_assembly_finishing"
      flow_role: "varnish, cleaner, and adhesive VOC emissions"
      record_type: "supplier formulation, chemical ledger, capture/recovery record, stack or workplace exhaust measurement"
      raw_fields: "chemical_id; chemical_mass; voc_species; voc_fraction; returned_mass; recovered_mass; waste_mass; retained_mass; captured_mass; emitted_mass; measurement_method"
      collection_method: "Species-level mass balance reconciled to measurement; a dataset shall add one atomic elementary-flow row for every emitted named VOC and shall not use a generic VOC or NMVOC row"
      unit: "kg"
      frequency: "each chemical lot and reporting period"
      temporal_coverage: "same period as chemical consumption"
      site_scope: "every emitting site and controlled subcontractor"
      aggregation_rule: "Calculate each named VOC separately and prevent overlap between chemically specific emissions"
      quality_evidence: "SDS; EN 14602-aligned calculation documentation when applicable; instrument records; capture and waste receipts"
    - protocol_id: cp_reference_output_records
      process_id: "final_assembly_finishing_packaging"
      flow_role: "accepted and rejected footwear output"
      record_type: "calibrated scale, production count, inspection and rework record"
      raw_fields: "batch_id; model; size; count; sampled_net_mass; total_net_mass; accepted_mass; rejected_mass; rework_mass; packaging_mass"
      collection_method: "Weigh accepted net footwear separately from packaging; reconcile pair count to mass"
      unit: "kg; pair; item"
      frequency: "each batch"
      temporal_coverage: "full reporting period"
      site_scope: "all final-assembly and packaging sites"
      aggregation_rule: "Sum accepted net product and normalize to exactly 1 kg; keep packaging outside product mass"
      quality_evidence: "scale calibration; inspection release; count-to-mass sample record; rework log"
    - protocol_id: cp_packaging_records
      process_id: "packaging"
      flow_role: "box, tissue paper, LDPE film, paper label, electricity, and packaging wastes"
      record_type: "packaging BOM, issue-return ledger, scale, meter, waste transfer note"
      raw_fields: "batch_id; packaging_component_id; issued_mass; returned_mass; incorporated_mass; waste_mass; electricity; packed_count; destination"
      collection_method: "Component-level mass reconciliation and metered or calculated packaging-line electricity"
      unit: "kg; kWh"
      frequency: "each packaging batch"
      temporal_coverage: "representative production period"
      site_scope: "all packaging sites"
      aggregation_rule: "Normalize each packaging component and its waste separately to 1 kg net footwear"
      quality_evidence: "packaging specifications; scale calibration; meter coverage; waste receipts"
  calculation_rules:
    - id: calc_reference_mass
      applies_to: "accepted reference output"
      rule: "normalized output = accepted net footwear mass / accepted net footwear mass; scale all inventory rows so reference output equals exactly 1 kg"
      inputs:
        - "accepted net footwear mass"
        - "inventory totals"
      output: "each exchange per 1 kg reference footwear"
      source_ids:
        - eu-pef-2021
    - id: calc_pair_to_mass
      applies_to: "pair or item records"
      rule: "total net mass = sum(count by size × measured mean net mass for matching model and size or documented size mix)"
      inputs:
        - count
        - model
        - size
        - "sampled masses"
      output: "kg net footwear"
      source_ids: []
    - id: calc_material_incorporation
      applies_to: "material and chemical inputs"
      rule: "consumed mass = issued mass − returned unused mass; reconcile consumed mass to incorporation, emissions, recovered mass, captured residue, and waste"
      inputs:
        - issue
        - return
        - output
        - emission
        - recovery
        - residue
        - waste
      output: "kg of each atomic material exchange"
      source_ids:
        - af-pefcr-v3-1-2025
        - eu-ecolabel-footwear-2016
    - id: calc_processing_loss
      applies_to: "each manufacturing material"
      rule: "processing loss fraction = measured material-specific waste / measured accepted material input on the same moisture and formulation basis; report the observed value, not an external default"
      inputs:
        - "accepted input"
        - "material-specific waste"
      output: "observed loss fraction and waste mass"
      source_ids:
        - af-pefcr-v3-1-2025
    - id: calc_energy_attribution
      applies_to: "shared electricity or thermal meters"
      rule: "attributed energy = metered period energy × documented causal driver for the batch / total driver over the same period"
      inputs:
        - "meter total"
        - "machine time"
        - "submeter share"
        - "or processed mass driver"
      output: "kWh or MJ assigned to process and batch"
      source_ids:
        - eu-pef-2021
    - id: calc_voc_mass_balance
      applies_to: "each VOC-bearing formulated product"
      rule: "named VOC emission = chemical input × supplier mass fraction − named VOC in unused return, product retention, captured material, recovered material, and waste; reconcile against direct measurement"
      inputs:
        - "chemical issue and return"
        - formulation
        - retained
        - captured
        - recovered
        - waste
        - "and measured emission mass"
      output: "kg of each named VOC to air in a separate atomic row"
      source_ids:
        - eu-ecolabel-footwear-2016
        - eu-sts-bref-2020
    - id: calc_mass_balance
      applies_to: "each process and reporting period"
      rule: "input mass + opening in-process stock = accepted product + returned material + closing stock + each waste output + each measured mass emission; investigate material-specific imbalance before release"
      inputs:
        - "atomic material inputs and outputs"
        - stock
        - emissions
      output: "reconciliation difference and documented resolution"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and reference flow"
      requirement: "Retain the CPC 29520 rationale, model specification, route, required qualifiers, reference UUID, Mass property, Units of mass group, and kg unit."
      evidence: "product specification; classification record; Tiangong identity fields"
    - id: dq_bom
      applies_to: "materials and components"
      requirement: "Cover at least 95% of the product BOM by mass and 100% of principal upper, body, sole, lining, and metal parts; identify the residual share without aggregating it into an inventory flow."
      evidence: "signed BOM; supplier specifications; mass reconciliation; af-pefcr-v3-1-2025"
    - id: dq_route
      applies_to: "process selection"
      requirement: "Demonstrate which conditional processes and route-specific rows apply; a zero or omitted row requires evidence of non-use, not a generic assumption."
      evidence: "routing sheet; work instructions; equipment and subcontractor list"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one coherent production period and document downtime, start-up, changeover, seasonal conditioning, and abnormal events that materially affect results."
      evidence: "production calendar; meter periods; exception log"
    - id: dq_chemical
      applies_to: "adhesives, cleaners, and finishes"
      requirement: "Retain formulation identity, VOC fraction, issued and returned mass, captured or recovered mass, waste mass, and emission calculation for each product."
      evidence: "SDS; supplier formulation; chemical ledger; emission and capture records; eu-ecolabel-footwear-2016"
    - id: dq_waste_destination
      applies_to: "all waste flows"
      requirement: "Record measured mass, waste identity, transfer date, destination, and treatment or recovery route; do not infer recycling from container labels."
      evidence: "waste transfer note; contractor receipt; mass record"
    - id: dq_proxy
      applies_to: "upstream datasets"
      requirement: "Disclose geography, technology, time, and material mismatches for every proxy and explain why it is the closest available dataset."
      evidence: "dataset metadata; proxy register; eu-pef-2021"
    - id: dq_range_evidence
      applies_to: "amount ranges"
      requirement: "Do not infer an empirical range from one product or facility. A source-backed empirical range requires at least two independent, boundary-compatible originals and an explicit synthesis; otherwise retain foreground collection without a range."
      evidence: "source review record; range synthesis when applicable"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Reject unless the output is exactly 1 kg net finished footwear excluding packaging and uses product flow e377f482-0635-4972-8954-9279707bfd7e, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids:
      - un-cpc-v3-2025
  - rule_id: validate_classification
    applies_to: "product identity"
    rule: "Reject unless the dataset documents why the model belongs in CPC 29520 and records exclusion checks against CPC 293, 294, 29510, and 29600 and the parent-category exclusions."
    source_ids:
      - un-cpc-v3-2025
  - rule_id: validate_route_completeness
    applies_to: "process map"
    rule: "Reject if an applicable wooden, flexible-component, non-wood-bottom, assembly, finishing, inspection, rework, or packaging operation is omitted or if a conditional process is marked not applicable without route evidence."
    source_ids:
      - af-pefcr-v3-1-2025
      - fao-forest-handicrafts-clogs
  - rule_id: validate_atomic_flows
    applies_to: "process inventory"
    rule: "Reject any selected flow that combines materials, electricity with thermal carriers, alternative fuels, packaging components, waste streams, or elementary emissions; each row must remain one physically or chemically specific exchange."
    source_ids: []
  - rule_id: validate_bom_coverage
    applies_to: "bill of materials"
    rule: "Reject if BOM coverage is below 95% by product mass, a principal part is omitted, or unclassified residual mass is represented as a plural or generic inventory flow."
    source_ids:
      - af-pefcr-v3-1-2025
  - rule_id: validate_mass_balance
    applies_to: "material conversion"
    rule: "Reject unexplained material-specific imbalance after accounting for returned inputs, accepted output, stock change, every waste stream, and measured mass emissions on consistent moisture and formulation bases."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_energy_separation
    applies_to: "energy inventory"
    rule: "Reject if electricity, steam, or purchased heat is combined or if conversions cannot be traced to original meters, invoices, and conversion factors."
    source_ids:
      - eu-pef-2021
      - rusu-et-al-footwear-lca-2024
  - rule_id: validate_voc_accounting
    applies_to: "adhesives, cleaners, varnishes, and air emissions"
    rule: "Reject generic VOC or NMVOC emission rows and double counting among acetone, ethyl acetate, and other named VOCs; require input, return, retention, capture, recovery, waste, and emission reconciliation for each chemical."
    source_ids:
      - eu-ecolabel-footwear-2016
      - eu-sts-bref-2020
  - rule_id: validate_packaging
    applies_to: "packaging"
    rule: "Reject if footwear net mass includes packaging or if corrugated cardboard, tissue paper, LDPE film, paper labels, and additional actual packaging components are combined."
    source_ids:
      - af-pefcr-v3-1-2025
  - rule_id: validate_ranges
    applies_to: "amount ranges"
    rule: "Reject any lower-equals-upper pseudo-range or empirical range copied from a single case; require the declared evidence tier and source synthesis for every authored range."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "shared operations and recovery"
    rule: "Reject undocumented allocation, arbitrary mass allocation without a causal basis, and foreground recycling credits that are inconsistent with the declared downstream convention."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "product-specific factory-gate foreground data package for CPC 29520 footwear production"
  downstream_use: "secondary_dataset; background_dataset when route, geography, time, and material composition are sufficiently representative and disclosed"
  allowed_use: "construction of process and lifecyclemodel datasets for the same declared product route; supplier-specific or scenario studies with explicit representativeness review"
  excluded_use: "automatic use for footwear in other CPC subclasses; comparison of unlike functions, performance, lifetimes, or routes; use-stage or end-of-life claims not modelled by this factory-gate dataset; substitution for primary records when site data are required"
  required_metadata: "canonical PCR id; CPC rationale; model and intended function; route; required qualifiers; sites and subcontractors; period; geography; BOM coverage; wood species and moisture state; chemical formulations; allocation; waste destinations; upstream dataset versions and proxies; packaging configuration"
  required_quality_disclosure: "foreground coverage; meter and scale coverage; count-to-mass sampling; BOM residual share; conditional-process decisions; data gaps; proxy representativeness; mass-balance residuals; VOC calculation basis; unresolved UUIDs; range-evidence gaps; reviewer status"
  update_trigger: "material, supplier, formulation, process route, equipment, energy source, subcontractor, packaging, geography, regulation, Tiangong identity, or evidence change that materially affects the inventory or its interpretation"
data_sources:
