system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground system includes the product-specific manufacturing steps that transform received materials and components into packaged, conforming footwear: wood cutting, carving or machining, drilling, sanding, conditioning and finishing when a wooden body or sole is made; die-cutting and sewing when flexible upper or strap components are made; compound forming, insole or sole production when a non-wood bottom is made; stockfitting, mechanical fastening, adhesive bonding, finishing, inspection, rework, and packaging when applicable. Each material, energy carrier, water flow, waste stream, and direct elementary emission crosses the boundary as its own exchange."
      source_ids: []
    - rule_id: boundary_factory_gate
      applies_to: "foreground production"
      rule: "Include all controlled and subcontracted component manufacturing, consolidation, final assembly, finishing, inspection, rework, and packaging required to produce the declared factory-gate output."
      source_ids:
        - af-pefcr-v3-1-2025
        - eu-pef-2021
    - rule_id: boundary_route_specificity
      applies_to: "process selection"
      rule: "Include only processes actually used by the declared model, while preserving complete coverage of the applicable wooden, flexible-component, non-wood-bottom, assembly, and packaging route."
      source_ids:
        - af-pefcr-v3-1-2025
        - fao-forest-handicrafts-clogs
    - rule_id: boundary_upstream_materials
      applies_to: "purchased products"
      rule: "Keep supplier production upstream and retain the product-specific foreground bill of materials, processing losses, energy, chemicals, water, and packaging quantities."
      source_ids:
        - af-pefcr-v3-1-2025
        - rusu-et-al-footwear-lca-2024
    - rule_id: boundary_scope_exclusions
      applies_to: "product identity"
      rule: "Reject the PCR if the product belongs to another footwear subclass, is only a footwear part or removable accessory, or lacks a documented CPC 29520 inclusion rationale."
      source_ids:
        - un-cpc-v3-2025
boundary_abstraction:
  declared_starting_condition: "Accepted wood blanks, leather, textile, plastic sheet, rubber or polymer compounds, thread, fasteners, adhesives, cleaners, finishes, and packaging are received with supplier, composition, mass, moisture or formulation, and lot records as applicable."
  starting_condition_role: "Received materials and components are upstream product inputs; the foreground system performs footwear component conversion and final manufacturing."
  product_classification_scope: "Finished footwear within CPC 3.0 subclass 29520 after explicit exclusion checks against other footwear subclasses and CPC 29600 parts."
  recursive_input_rule: "Purchased finished or semi-finished footwear already within CPC 29520 is recorded as one upstream product input with its own dataset and is not recursively decomposed as if made by the reporting foreground site."
  upstream_dataset_requirement: "Use traceable upstream datasets for each received material, compound, chemical, electricity or thermal carrier, water supply, and packaging component; disclose every proxy and its representativeness."
  disclosure: "Declare the classification rationale, model, route, complete bill of materials, material and chemical specifications, wood moisture state, included facilities and subcontractors, process energy and water, wastes, direct emissions, rework, packaging, geography, period, and allocation decisions."
