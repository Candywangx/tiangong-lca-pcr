validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "Require product flow 6e39a9ed-f49c-4ddc-8869-7d4c47551bbf, Product flow type, exact CPC 29410, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg reference unit."
    source_ids:
      - unsd-cpc-3-0-29410
  - rule_id: validate_required_qualifiers
    applies_to: "foreground_data_package"
    rule: "Fail completeness when footwear subtype, pair or single-article convention, size, net mass, BOM, construction route, facility, production period, or packaging inclusion is missing."
    source_ids:
      - afw-pefcr-v3-1-2025
      - eu-recommendation-2021-2279
  - rule_id: validate_atomic_flows
    applies_to: "process_inventory"
    rule: "Reject collection labels and combined exchanges; every material, component, chemical, energy carrier, refrigerant, packaging material, waste, and emission shall remain separate."
    source_ids:
      - eu-recommendation-2021-2279
      - afw-pefcr-v3-1-2025
  - rule_id: validate_bom_and_losses
    applies_to: "materials_and_manufacturing_losses"
    rule: "Require product-specific BOM, accepted transfers, material-specific offcuts, rejects, rework, stock change, and step-level loss reconciliation."
    source_ids:
      - afw-pefcr-v3-1-2025
      - eu-recommendation-2021-2279
  - rule_id: validate_utilities
    applies_to: "electricity_steam_hot_water_natural_gas"
    rule: "Require carrier-specific meters, conversion records, boundary definitions, and allocation drivers; do not accept a combined energy amount."
    source_ids:
      - afw-pefcr-v3-1-2025
      - eu-recommendation-2021-2279
  - rule_id: validate_chemicals_and_emissions
    applies_to: "adhesive_solvent_combustion_and_refrigerant"
    rule: "Require chemical-specific issue and waste records; direct emissions require monitoring or verified balance and cannot be inferred from input presence alone."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: validate_packaging
    applies_to: "sale_packaging"
    rule: "Require each included packaging material to reconcile with packing records and disclose packaging excluded from the reference product mass."
    source_ids:
      - afw-pefcr-v3-1-2025
      - eu-recommendation-2021-2279
  - rule_id: validate_uuid_resolution
    applies_to: "tiangong_references"
    rule: "Reject any non-reference UUID that lacks both candidate identity confirmation and a public state-100 direct read; unresolved identities remain blank with row-specific manifest metadata."
