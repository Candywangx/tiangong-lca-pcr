allocation_rules:
  - rule_id: allocation_avoid_where_measured
    applies_to: "shared_foreground_processes"
    rule: "Prefer subdivision, submetering, batch records, and direct mass tracing before allocation."
    source_ids:
      - eu-recommendation-2021-2279
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_materials_by_batch
    applies_to: "materials_components_chemicals_packaging"
    rule: "Assign net issues directly to the declared product batch; where direct assignment is impossible, use a documented causal driver and disclose the share."
    source_ids:
      - eu-recommendation-2021-2279
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_energy_by_carrier
    applies_to: "electricity_steam_hot_water_and_fuel"
    rule: "Allocate every energy carrier separately using submeter readings, measured equipment demand and operating time, or another documented causal driver; never allocate a combined energy total."
    source_ids:
      - eu-recommendation-2021-2279
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_refrigerant
    applies_to: "r134a_equipment"
    rule: "Allocate refrigerant replenishment and release to the serviced equipment and production period before normalizing to accepted component output."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_waste_and_emissions
    applies_to: "waste_and_direct_releases"
    rule: "Segregate waste and pollutants by material or substance before allocation; use measured batch mass, verified solvent or refrigerant balance, or the generating process driver."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_no_avoided_credit
    applies_to: "waste_sent_to_recovery"
    rule: "Report physical waste output and destination without subtracting avoided-product credit inside this gate-to-gate foreground dataset."
    source_ids:
      - afw-pefcr-v3-1-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_material_records
      process_id: "component_manufacturing_and_cutting"
      flow_role: "Component materials, accepted components, and segregated offcuts"
      record_type: "BOM, issue, return, stock, weighment, transfer, and waste records"
      raw_fields: "batch_id; model; size; material_id; specification; opening_stock; receipts; issued_mass; returned_mass; closing_stock; accepted_transfer_mass; offcut_mass; waste_destination"
      collection_method: "Reconcile net material issues and weigh every accepted component and segregated waste stream"
      unit: "kg"
      frequency: "Each batch; summarized monthly"
      temporal_coverage: "Representative production period, normally 12 months or the full shorter run"
      site_scope: "All component suppliers and in-scope component operations"
      aggregation_rule: "Sum each atomic material, transfer, and waste by batch; normalize to accepted component output"
      quality_evidence: "Approved BOM; calibrated scales; stock reconciliation; transfer note; waste ticket"
    - protocol_id: cp_component_utility_records
      process_id: "component_manufacturing_and_cutting"
      flow_role: "Electricity, purchased steam, hot water, and natural gas"
      record_type: "Utility meters, invoices, temperature and pressure logs, and equipment records"
      raw_fields: "meter_id; carrier; opening_reading; closing_reading; unit; pressure; supply_temperature; return_temperature; enthalpy; equipment_id; operating_time; accepted_output_mass"
      collection_method: "Use dedicated meters where available; otherwise allocate a documented submeter total using measured equipment demand and operating time"
      unit: "kWh; MJ; kg"
      frequency: "Meter interval and each batch"
      temporal_coverage: "Same period as component output"
      site_scope: "Component moulding, cutting, conditioning, and extraction equipment only"
      aggregation_rule: "Keep every carrier separate; convert with documented factors and normalize to accepted output"
      quality_evidence: "Meter calibration; invoice reconciliation; equipment log; conversion worksheet"
    - protocol_id: cp_refrigerant_records
      process_id: "component_manufacturing_and_cutting"
      flow_role: "R134a replenishment and release"
      record_type: "Equipment register and refrigerant service records"
      raw_fields: "equipment_id; refrigerant; opening_charge; recharge_mass; recovered_mass; closing_charge; disposal_mass; service_date; production_period; accepted_output_mass"
      collection_method: "Reconcile equipment-level refrigerant mass balance from certified service records"
      unit: "kg"
      frequency: "Every service event and annual close"
      temporal_coverage: "Same period as component production"
      site_scope: "Cooling equipment serving in-scope operations"
      aggregation_rule: "Allocate verified loss to serviced equipment and period; normalize to accepted component output"
      quality_evidence: "Service certificate; cylinder weighment; leak-test record; equipment register"
    - protocol_id: cp_upper_liner_batch_records
      process_id: "upper_liner_fabrication"
      flow_role: "Panels, foam, thread, webbing, eyelets, accepted assembly, and solid wastes"
      record_type: "BOM, issue, return, count, unit-mass, stock, transfer, quality, and waste records"
      raw_fields: "batch_id; model; size; component_id; issued_mass_or_count; unit_mass; returned_mass_or_count; closing_stock; accepted_output_mass; reject_mass; waste_mass; destination"
      collection_method: "Reconcile net issues, convert counts with measured unit mass, and weigh accepted and rejected outputs"
      unit: "kg; count"
      frequency: "Each batch; summarized monthly"
      temporal_coverage: "Representative production period"
      site_scope: "All upper and liner lines in scope"
      aggregation_rule: "Sum each atomic exchange by batch and normalize to accepted upper-and-liner output"
      quality_evidence: "BOM; calibrated scales; count-to-mass sample; inspection disposition; waste ticket"
    - protocol_id: cp_upper_liner_chemical_records
      process_id: "upper_liner_fabrication"
      flow_role: "Polyurethane adhesive, ethyl acetate, and chemical wastes"
      record_type: "SDS, formulation, container issue, return, stock, wipe, spill, and waste records"
      raw_fields: "batch_id; chemical_id; formulation; purity_or_solids; opening_stock; receipts; issued_mass; returned_mass; closing_stock; waste_mass; retained_solvent; destination"
      collection_method: "Reconcile each chemical independently and weigh each chemical-bearing waste stream"
      unit: "kg"
      frequency: "Each formulation or production batch"
      temporal_coverage: "Same period as upper and liner production"
      site_scope: "Adhesive application, cleaning, curing, and local storage in scope"
      aggregation_rule: "Calculate net issue and chemical-specific waste separately; normalize to accepted output"
      quality_evidence: "Approved SDS; container weights; stock reconciliation; hazardous-waste manifest"
    - protocol_id: cp_upper_liner_utility_records
      process_id: "upper_liner_fabrication"
      flow_role: "Upper and liner electricity"
      record_type: "Electricity submeter and equipment operating records"
      raw_fields: "meter_id; opening_reading; closing_reading; machine_id; measured_demand; operating_time; batch_id; accepted_output_mass"
      collection_method: "Use submeter readings or allocate measured line electricity using equipment time and demand"
      unit: "kWh"
      frequency: "Meter interval and each batch"
      temporal_coverage: "Same period as upper and liner production"
      site_scope: "Sewing, skiving, eyelet setting, adhesive, ventilation, and handling equipment"
      aggregation_rule: "Subtract documented non-production load and normalize causal allocation to accepted output"
      quality_evidence: "Meter calibration; machine log; allocation worksheet"
    - protocol_id: cp_final_assembly_batch_records
      process_id: "stockfitting_and_final_assembly"
      flow_role: "Uppers, shells, outsoles, midsoles, buckles, accepted footwear, and solid wastes"
      record_type: "BOM, issue, return, count, unit-mass, transfer, inspection, rework, and waste records"
      raw_fields: "batch_id; model; size; component_id; issued_mass_or_count; unit_mass; returned_quantity; accepted_output_mass; reject_mass; rework_mass; waste_mass; destination"
      collection_method: "Reconcile each component, convert counts using unit mass, and weigh accepted, rejected, and reworked footwear"
      unit: "kg; count"
      frequency: "Each batch; summarized monthly"
      temporal_coverage: "Representative production period"
      site_scope: "All stockfitting and final assembly lines in scope"
      aggregation_rule: "Sum each atomic exchange by batch and normalize to accepted assembled footwear"
      quality_evidence: "BOM; calibrated scales; component sample weights; quality disposition; waste ticket"
    - protocol_id: cp_final_assembly_chemical_records
      process_id: "stockfitting_and_final_assembly"
      flow_role: "Polyurethane adhesive and adhesive waste"
      record_type: "SDS, formulation, container issue, return, stock, spill, and waste records"
      raw_fields: "batch_id; chemical_id; formulation; solids; opening_stock; receipts; issued_mass; returned_mass; closing_stock; waste_mass; destination"
      collection_method: "Reconcile adhesive independently and weigh liquid and cured waste"
      unit: "kg"
      frequency: "Each production batch"
      temporal_coverage: "Same period as final assembly"
      site_scope: "Adhesive application, curing, and local storage in scope"
      aggregation_rule: "Calculate net adhesive issue and waste separately; normalize to accepted output"
      quality_evidence: "Approved SDS; container weights; stock reconciliation; waste manifest"
    - protocol_id: cp_final_assembly_utility_records
      process_id: "stockfitting_and_final_assembly"
      flow_role: "Final-assembly electricity and natural gas"
      record_type: "Utility meters, oven or press logs, and production records"
      raw_fields: "meter_id; carrier; opening_reading; closing_reading; unit; equipment_id; operating_time; batch_id; accepted_output_mass"
      collection_method: "Use carrier-specific meters or allocate documented area totals using equipment operation"
      unit: "kWh; MJ"
      frequency: "Meter interval and each batch"
      temporal_coverage: "Same period as assembled footwear"
      site_scope: "Pressing, stockfitting, curing, testing, ventilation, and handling equipment"
      aggregation_rule: "Keep electricity and natural gas separate; normalize each to accepted output"
      quality_evidence: "Meter calibration; utility invoice; equipment log; allocation worksheet"
    - protocol_id: cp_direct_emissions_records
      process_id: "component_manufacturing_and_cutting_upper_liner_fabrication_stockfitting_and_final_assembly"
      flow_role: "Fuel, solvent, and refrigerant releases"
      record_type: "Stack monitoring, solvent balance, permit ledger, and refrigerant records"
      raw_fields: "source_id; substance; compartment; concentration; gas_flow; operating_time; chemical_input; recovered_mass; waste_retention; product_retention; control_efficiency; batch_id"
      collection_method: "Use substance-specific monitoring or a verified mass balance; do not infer unmeasured species"
      unit: "kg"
      frequency: "Monitoring or service interval and reporting batch"
      temporal_coverage: "Same period as the generating process"
      site_scope: "Only direct sources inside the declared foreground boundary"
      aggregation_rule: "Attribute each substance separately using monitored operation or verified balance; normalize to accepted output"
      quality_evidence: "Calibration and QA records; permit report; chemical reconciliation; service certificate"
    - protocol_id: cp_packaging_batch_records
      process_id: "inspection_and_sale_packaging"
      flow_role: "Accepted footwear, packaging inputs, final rejects, and packaging scraps"
      record_type: "Inspection, package issue and return, count-to-mass, packing, reject, and waste records"
      raw_fields: "batch_id; model; size; pair_or_single; accepted_input_mass; reference_output_mass; reject_mass; package_material_id; issued_count_or_mass; unit_mass; returned_quantity; scrap_mass; packed_quantity"
      collection_method: "Weigh footwear and scraps and convert packaging counts with product-specific unit mass"
      unit: "kg; count"
      frequency: "Each packing batch"
      temporal_coverage: "Representative production period"
      site_scope: "All final inspection and packing stations in scope"
      aggregation_rule: "Reconcile accepted input to reference output, rejects, and stock change; normalize packaging to accepted net footwear mass"
      quality_evidence: "Calibrated scales; inspection disposition; package specification; packing list; waste ticket"
    - protocol_id: cp_packaging_utility_records
      process_id: "inspection_and_sale_packaging"
      flow_role: "Inspection and packaging electricity"
      record_type: "Electricity meter and equipment operating records"
      raw_fields: "meter_id; opening_reading; closing_reading; equipment_id; measured_demand; operating_time; batch_id; reference_output_mass"
      collection_method: "Use a finishing-area submeter or allocate measured electricity by causal equipment activity"
      unit: "kWh"
      frequency: "Meter interval and each packing batch"
      temporal_coverage: "Same period as packed production"
      site_scope: "Inspection, testing, labelling, sealing, and packing equipment only"
      aggregation_rule: "Subtract documented non-production load and normalize to accepted reference product"
      quality_evidence: "Meter calibration; equipment log; allocation worksheet"
  calculation_rules:
    - id: calc_net_issue
      applies_to: "materials_components_chemicals_packaging"
      rule: "Net issue = opening stock + receipts - returns - closing stock, restricted to the declared product batch and adjusted for documented transfers."
      inputs:
        - Stock
        - issue
        - return
        - "and transfer fields"
      output: "kg net input per batch"
      source_ids:
        - eu-recommendation-2021-2279
        - afw-pefcr-v3-1-2025
    - id: calc_count_to_mass
      applies_to: "eyelets_buckles_outsoles_midsoles_and_packaging"
      rule: "Mass = issued or accepted count multiplied by product-specific measured average unit mass; retain sampling basis and uncertainty."
      inputs:
        - "Count and unit-mass record"
      output: "kg exchange"
      source_ids:
        - eu-recommendation-2021-2279
        - afw-pefcr-v3-1-2025
    - id: calc_utility_allocation
      applies_to: "shared_utility_meters"
      rule: "Carrier amount = metered total minus documented non-production load, multiplied by the causal share from submeter, measured equipment demand and operating time, or accepted process output. Calculate each carrier separately."
      inputs:
        - "Meter readings"
        - exclusions
        - "and causal driver"
      output: "kWh, MJ, or kg by carrier"
      source_ids:
        - eu-recommendation-2021-2279
        - afw-pefcr-v3-1-2025
    - id: calc_refrigerant_balance
      applies_to: "r134a_equipment"
      rule: "R134a release = opening charge + recharge - recovered mass - closing charge - documented disposal, only when the service record closes the equipment balance."
      inputs:
        - "Equipment charge and service fields"
      output: "kg R134a released"
      source_ids:
        - eu-recommendation-2021-2279
    - id: calc_process_mass_balance
      applies_to: "each_manufacturing_process"
      rule: "Reconcile material and component inputs with accepted product output, material-specific wastes, measured direct releases, rework, and inventory change; investigate rather than assign unexplained residuals."
      inputs:
        - "Atomic exchanges"
        - rework
        - "and stock fields"
      output: "Mass-balance residual and completeness finding"
      source_ids:
