allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared foreground operations"
    rule: "Subdivide or meter component preparation, assembly, sole attachment, finishing, and packaging by model or batch before applying allocation."
    source_ids:
      - eu-pef-2021
      - af-pefcr-3-1
  - rule_id: allocation_physical_mass
    applies_to: "unavoidable shared burdens"
    rule: "When subdivision is not feasible and products receive comparable processing, allocate shared burdens by net conforming product mass and justify the physical relationship."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_rework_rejects
    applies_to: "rework and rejects"
    rule: "Keep rework burdens in the batch that generated them; exclude rejected mass from conforming output and report its recovery or treatment route."
    source_ids:
      - af-pefcr-3-1
  - rule_id: allocation_recovered_scrap
    applies_to: "sold or internally recovered scrap"
    rule: "Quantify recovered material as a separate output and disclose downstream treatment; apply no avoided-production credit inside the foreground inventory unless the downstream method requires it."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_preparation
      process_id: "component_preparation"
      flow_role: "material inputs, electricity, four prepared component outputs, and three cutting-waste streams"
      record_type: "receiving, issue-return, bill-of-material, scale, meter, and waste-transfer records"
      raw_fields: "batch_id; model; material_id; supplier_lot; issued_kg; returned_kg; cut_leather_output_kg; cut_lining_output_kg; inspected_toe_cap_output_kg; cut_insole_board_output_kg; electricity_kWh; leather_offcut_kg; lining_offcut_kg; board_offcut_kg; treatment_route"
      collection_method: "Reconcile product-specific issue-return records with calibrated scales, meters, and batch genealogy"
      unit: "kg; kWh"
      frequency: "Each batch, aggregated monthly"
      temporal_coverage: "Declared representative production period or complete production campaign, with justification and gap disclosure"
      site_scope: "Every included cutting site and subcontractor"
      aggregation_rule: "Sum linked batches and divide by conforming finished output; keep reusable stock out of waste"
      quality_evidence: "Scale and meter calibration; purchase and issue records; BOM revision; waste transfer records; batch genealogy"
    - protocol_id: cp_upper_assembly
      process_id: "upper_assembly"
      flow_role: "leather pieces, lining pieces, steel toe caps, thread, adhesive, cleaner, electricity, output, wastes, and ethyl acetate emission"
      record_type: "batch traveller, issue-return logs, chemical inventory, meters, scales, waste manifests, and emission or balance records"
      raw_fields: "batch_id; cut_leather_input_kg; cut_lining_input_kg; inspected_toe_cap_input_kg; thread_kg; adhesive_input_kg; adhesive_return_kg; ethyl_acetate_input_kg; electricity_kWh; upper_output_kg; cured_residue_kg; container_waste_kg; ethyl_acetate_air_kg"
      collection_method: "Reconcile all material and chemical movements to assembled upper output and a chemical balance"
      unit: "kg; kWh"
      frequency: "Each batch for materials; monthly for energy and emissions"
      temporal_coverage: "Declared representative production period or complete production campaign, with justification and gap disclosure"
      site_scope: "Every included upper-assembly site and subcontractor"
      aggregation_rule: "Sum linked records, calculate chemical losses only from reconciled terms, and normalize to output"
      quality_evidence: "BOM; scale and meter calibration; chemical inventory; waste manifests; monitoring or signed balance"
    - protocol_id: cp_sole_attachment
      process_id: "sole_attachment"
      flow_role: "upper, insole board, outsole and shank components, adhesive, energy carriers, refrigerant, output, waste, and direct emissions"
      record_type: "batch records, issue-return logs, utility meters, fuel invoices, service logs, scales, and waste records"
      raw_fields: "batch_id; upper_input_kg; insole_board_input_kg; outsole_type; outsole_kg; shank_kg; adhesive_kg; electricity_kWh; steam_kg; steam_pressure; hot_water_kg; inlet_temperature; outlet_temperature; natural_gas_quantity; calorific_value; r134a_charge_kg; r134a_recovered_kg; output_kg; rubber_waste_kg"
      collection_method: "Meter or calculate each carrier separately and reconcile material, fuel, and refrigerant records"
      unit: "kg; kWh; MJ"
      frequency: "Each batch for materials; monthly for utilities and emissions"
      temporal_coverage: "Declared representative production period or complete production campaign, with justification and gap disclosure"
      site_scope: "Every included lasting and sole-attachment site"
      aggregation_rule: "Normalize linked batch totals to output; preserve carrier-specific quantities and conversions"
      quality_evidence: "Meter calibration; bills; equipment logs; service records; scale calibration; emission calculations"
    - protocol_id: cp_finishing_packaging
      process_id: "finishing_packaging"
      flow_role: "intermediate input, electricity, water, polish, packaging, product, reject, and wastewater"
      record_type: "batch records, meters, issue-return logs, packaging specifications, scales, inspection logs, discharge records, and waste manifests"
      raw_fields: "batch_id; unfinished_input_kg; electricity_kWh; process_water_m3; polish_input_kg; polish_return_kg; carton_kg; ldpe_bag_kg; finished_output_kg; rejected_kg; wastewater_m3"
      collection_method: "Meter utilities, reconcile materials, weigh product and wastes, and link inspection disposition to batch"
      unit: "kg; kWh; m3"
      frequency: "Each batch for materials; monthly for utilities"
      temporal_coverage: "Declared representative production period or complete production campaign, with justification and gap disclosure"
      site_scope: "Every included finishing and packaging site"
      aggregation_rule: "Sum linked records and divide by net conforming finished mass"
      quality_evidence: "Meter and scale calibration; packaging specification; inspection log; discharge record; waste manifest"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground exchanges"
      rule: "normalized exchange = linked batch exchange / net conforming finished-footwear mass"
      inputs:
        - "batch exchange"
        - finished_output_kg
      output: "exchange per 1 kg finished footwear"
      source_ids:
        - eu-pef-2021
        - af-pefcr-3-1
    - id: calc_pair_to_mass
      applies_to: "count-based records"
      rule: "converted mass = pair count × measured mean mass for the same model and documented size mix"
      inputs:
        - "pair count"
        - "sampled mass"
        - "sampled count"
        - "size mix"
      output: "kg of specified component or product"
      source_ids:
        - af-pefcr-3-1
    - id: calc_material_balance
      applies_to: "each preparation and assembly stage"
      rule: "input + opening stock = output + return + waste + closing stock + documented residual; investigate rather than force unexplained residuals"
      inputs:
        - "stage-specific mass records"
      output: "material-balance residual"
      source_ids:
        - eu-pef-2021
        - af-pefcr-3-1
    - id: calc_hot_water_energy
      applies_to: "process hot water"
      rule: "energy = measured water mass × documented heat capacity × temperature rise"
      inputs:
        - "water mass"
        - "inlet and outlet temperature"
        - "heat capacity"
      output: "MJ hot-water energy"
      source_ids:
        - eu-pef-2021
    - id: calc_refrigerant_loss
      applies_to: "R-134a cooling system"
      rule: "loss = opening inventory + purchases − closing inventory − recovered refrigerant − off-site transfers"
      inputs:
        - "refrigerant inventory and service records"
      output: "kg R-134a to air"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Demonstrate exact CPC 29510 scope, incorporated protective metal toe cap, and exclusion from CPC subclass 29320."
      evidence: "Product specification, toe-cap technical record, photographs or technical description, and classification review"
    - id: dq_product_bom
      applies_to: "bill of materials"
      requirement: "Use a model- and revision-specific BOM and reconcile material issues, returns, incorporated mass, and losses."
      evidence: "Approved BOM, purchase and issue records, scales, and mass balance"
    - id: dq_primary_data
      applies_to: "foreground operations"
      requirement: "Use company-specific records for materials, energy, chemicals, products, wastes, and direct emissions for all included sites and subcontractors."
      evidence: "Meters, scales, invoices, logs, manifests, monitoring, and subcontractor declarations"
    - id: dq_temporal
      applies_to: "declared-period or campaign dataset"
      requirement: "Use a justified representative production period or complete campaign and disclose shutdowns, abnormal production, and gaps."
      evidence: "Production calendar, period completeness report, and gap log"
    - id: dq_transparency
      applies_to: "data gaps and proxies"
      requirement: "Disclose every missing UUID, proxy dataset, allocation, conversion, exclusion, and material uncertainty."
      evidence: "Data-gap register and dataset metadata"
