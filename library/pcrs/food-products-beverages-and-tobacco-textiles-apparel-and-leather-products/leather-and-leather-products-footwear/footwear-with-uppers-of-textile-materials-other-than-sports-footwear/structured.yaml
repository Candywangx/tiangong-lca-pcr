allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "multi-product or shared foreground operations"
    rule: "Subdivide by process line, product order, style, and reporting period whenever separate measurements exist before applying allocation."
    source_ids:
      - iso-14044-2006
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_process_driver
    applies_to: "shared component and manufacturing processes"
    rule: "Apply the PEFCR process driver when subdivision is not possible: unit allocation for sewing and final assembly, and mass allocation for die-cutting, compound forming, insole production, stockfitting, and finishing; document the denominator and all co-produced output."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_energy
    applies_to: "shared site electricity and fuel"
    rule: "Prefer product- or line-specific metering. Otherwise allocate measured energy by a documented causal driver such as machine operating time multiplied by measured or rated load; if only multi-site electricity data exist, use a production-mass-weighted mix and disclose the limitation."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: allocation_recycling_no_credit
    applies_to: "manufacturing scrap sent to recovery"
    rule: "Report the scrap mass and treatment route without assigning an avoided-burden credit inside this foreground package; any circular-footprint or substitution treatment belongs to the downstream life-cycle model and must be declared separately."
    source_ids:
      - afw-pefcr-v3-1-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference_product
      process_id: "final_assembly_and_packaging"
      flow_role: "finished reference product"
      record_type: "scale and production record"
      raw_fields: "product code; CPC confirmation; reference size; pair count; individual or batch pair mass; scale id; resolution; calibration date; reject count"
      collection_method: "calibrated scale linked to the production order and final inspection release"
      unit: "kg and pair"
      frequency: "each measured sample or released batch"
      temporal_coverage: "representative reporting period, normally 12 consecutive months"
      site_scope: "each reporting footwear site"
      aggregation_rule: "sum conforming mass and pair count; calculate mean kg/pair; exclude packaging and rejects"
      quality_evidence: "scale calibration; inspection release; product specification; sampling record"
    - protocol_id: cp_bom_materials
      process_id: "upper_component_manufacturing_bottom_component_manufacturing"
      flow_role: "specific material or component input"
      record_type: "BOM, receipt, issue, and stock record"
      raw_fields: "material id; chemical or fibre identity; construction; supplier; gross received mass; issued mass; returns; opening stock; closing stock; lot; product order"
      collection_method: "reconcile BOM and product order with calibrated weighing, invoices, warehouse issues, and stock change"
      unit: "kg"
      frequency: "each lot and product order"
      temporal_coverage: "same period as output, with stock reconciliation"
      site_scope: "each site and contract facility in scope"
      aggregation_rule: "material consumed = opening stock + receipts - closing stock - documented returns; keep each material separate"
      quality_evidence: "supplier specification; invoice; weigh ticket; stock ledger; BOM revision"
    - protocol_id: cp_final_assembly_materials
      process_id: "final_assembly_and_packaging"
      flow_role: "specific component, adhesive, or accessory input"
      record_type: "BOM, issue, stock, and batch record"
      raw_fields: "component id; material identity; issue quantity or mass; opening stock; receipts; closing stock; returned material; product order"
      collection_method: "weigh representative components and reconcile counts or stock changes to the production order"
      unit: "kg and item count"
      frequency: "each product order, reconciled monthly"
      temporal_coverage: "same period as finished product"
      site_scope: "each final-assembly site"
      aggregation_rule: "convert item counts to mass with measured component mass; calculate stock-balance consumption for adhesive; no grouping across materials"
      quality_evidence: "BOM; batch sheet; component weigh record; adhesive stock ledger"
    - protocol_id: cp_packaging_materials
      process_id: "final_assembly_and_packaging"
      flow_role: "shoe box or tissue paper input"
      record_type: "packaging specification and issue record"
      raw_fields: "packaging id; material; unit mass; units issued; units shipped; damaged units; product order"
      collection_method: "weigh packaging units and reconcile issued, shipped, and damaged counts"
      unit: "kg and item count"
      frequency: "each packaging specification and product order"
      temporal_coverage: "same period as packed output"
      site_scope: "each packing site"
      aggregation_rule: "unit mass multiplied by units consumed; keep box and tissue paper separate"
      quality_evidence: "packaging specification; scale record; packing log"
    - protocol_id: cp_process_energy
      process_id: "upper_component_manufacturing_bottom_component_manufacturing_final_assembly_and_packaging"
      flow_role: "electricity or natural-gas input"
      record_type: "meter, invoice, and machine log"
      raw_fields: "meter id; opening and closing reading; energy carrier; voltage or calorific value; machine id; operating time; product order; allocation denominator"
      collection_method: "submeter first; otherwise reconcile utility invoice and allocate with documented process driver"
      unit: "kWh or MJ"
      frequency: "continuous meter or each shift; reconcile monthly"
      temporal_coverage: "representative reporting period, normally 12 consecutive months"
      site_scope: "each process line and site"
      aggregation_rule: "subtract documented non-production use; allocate each energy carrier separately; normalize to conforming output"
      quality_evidence: "meter calibration; invoice; machine log; allocation worksheet; electricity-supply evidence"
    - protocol_id: cp_process_outputs
      process_id: "upper_component_manufacturing_bottom_component_manufacturing"
      flow_role: "conforming intermediate output"
      record_type: "scale, transfer, and inspection record"
      raw_fields: "intermediate id; material; batch; mass; item count; pass/fail; destination process"
      collection_method: "weigh accepted output at process transfer and reconcile to production orders"
      unit: "kg and item count"
      frequency: "each batch"
      temporal_coverage: "same period as input and waste records"
      site_scope: "each component-making site"
      aggregation_rule: "sum conforming transferred mass by atomic intermediate product"
      quality_evidence: "calibrated scale; transfer ticket; inspection record"
    - protocol_id: cp_waste_and_emissions
      process_id: "upper_component_manufacturing_bottom_component_manufacturing_final_assembly_and_packaging"
      flow_role: "specific solid waste or NMVOC emission"
      record_type: "waste weigh ticket, container log, treatment receipt, measurement, permit, or solvent balance"
      raw_fields: "waste id; chemical or material identity; mass; destination; treatment; date; product order; measured NMVOC; solvent input; retained solvent; recovered solvent"
      collection_method: "weigh each waste stream; use measured emissions or a documented substance mass balance without combining pollutants"
      unit: "kg"
      frequency: "each collection or emission measurement; reconcile monthly"
      temporal_coverage: "same period as production"
      site_scope: "each process and site"
      aggregation_rule: "sum by atomic waste or elementary flow and treatment fate; reconcile material balance"
      quality_evidence: "weigh ticket; licensed treatment receipt; measurement report; permit return; mass-balance worksheet"
    - protocol_id: cp_process_water
      process_id: "final_assembly_and_packaging"
      flow_role: "tap-water input or final-cleaning wastewater"
      record_type: "water meter, batch sheet, and discharge record"
      raw_fields: "meter id; water input; batch volume; discharge volume; evaporation; retained water; product order"
      collection_method: "submeter or batch-volume record; reconcile input and discharge"
      unit: "m3"
      frequency: "each batch or monthly meter reading"
      temporal_coverage: "same period as production"
      site_scope: "each cleaning operation and site"
      aggregation_rule: "allocate only water directly attributable to product cleaning; calculate wastewater from measured discharge or documented balance"
      quality_evidence: "meter record; batch sheet; discharge record; balance check"
  calculation_rules:
    - id: calc_pair_mass
      applies_to: "reference flow"
      rule: "m_pair = conforming finished footwear mass / conforming pair count; packaging and rejected pairs are excluded."
      inputs:
        - "conforming mass"
        - "conforming pair count"
      output: "kg per pair"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_reference_normalization
      applies_to: "every inventory exchange"
      rule: "normalized exchange = exchange amount / conforming finished footwear mass; report the per-pair amount by multiplying the normalized value by m_pair."
      inputs:
        - "exchange amount"
        - "conforming mass"
        - m_pair
      output: "exchange per kg reference product and exchange per pair"
      source_ids:
        - iso-14044-2006
    - id: calc_stock_balance
      applies_to: "thread, adhesive, and other stock-managed inputs"
      rule: "consumption = opening stock + receipts - closing stock - documented returns - recovered material; unexplained imbalance is reported."
      inputs:
        - "opening stock"
        - receipts
        - "closing stock"
        - returns
        - "recovered material"
      output: "consumed input mass"
      source_ids:
        - iso-14044-2006
    - id: calc_step_loss
      applies_to: "each material at each manufacturing step"
      rule: "step loss rate = (material input - conforming material output - measured recoverable stock transfer) / material input; report the mass and fate, not only the percentage."
      inputs:
        - "atomic material input"
        - "conforming output"
        - "recoverable transfer"
        - "waste mass"
      output: "step-specific material loss rate and mass balance"
      source_ids:
        - afw-pefcr-v3-1-2025
    - id: calc_energy_allocation
      applies_to: "shared metered energy"
      rule: "Allocate each carrier using the declared process driver; for machine-time allocation use allocated energy = shared metered energy × product machine-load-hours / total machine-load-hours."
      inputs:
        - "meter reading"
        - "machine time"
        - "measured or rated load"
        - "product order"
      output: "allocated kWh or MJ"
      source_ids:
        - afw-pefcr-v3-1-2025
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and every flow"
      requirement: "Preserve product code, CPC 29340 decision, material or chemical identity, flow direction, unit, site, route applicability, supplier, and treatment fate. A data gap is not zero."
      evidence: "product specification; BOM; supplier specification; flow mapping record; waste receipt"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use one coherent representative period, normally 12 consecutive months; disclose seasonal or campaign coverage and reconcile opening and closing stocks to that period."
      evidence: "reporting-period statement; dated meters, invoices, stock records, and production logs"
    - id: dq_geography_technology
      applies_to: "site and linked datasets"
      requirement: "Declare each manufacturing geography and technology; linked datasets must represent the actual material, electricity mix, process technology, and waste route, or the proxy limitation must be stated."
      evidence: "site register; technology pack; electricity evidence; dataset metadata; proxy justification"
    - id: dq_completeness
      applies_to: "BOM, energy, water, wastes, and emissions"
      requirement: "Reconcile atomic inputs, outputs, stock changes, process losses, rejects, and treatment destinations. Report missing exchanges and exclusions explicitly."
      evidence: "mass-balance worksheet; production reconciliation; completeness checklist"
    - id: dq_measurement
      applies_to: "scales, meters, and calculations"
      requirement: "Retain instrument identity, calibration or verification, resolution, sampling method, allocation denominator, unit conversions, and formula version."
      evidence: "calibration certificate; meter record; sampling plan; calculation workbook"
    - id: dq_dqr
      applies_to: "company-specific datasets"
      requirement: "Assess and report technological, geographical, and time representativeness and precision before aggregation, consistent with the PEFCR data-quality approach."
      evidence: "DQR worksheet and supporting records"
validation_rules:
  - rule_id: validate_category
    applies_to: "reference product identity"
    rule: "Confirm the output has textile-material uppers, is not sports footwear, and is classified in CPC 3.0 subclass 29340; reject a package that relies only on a generic shoe label."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_reference_flow
    applies_to: "functional unit and reference flow"
    rule: "Confirm one conforming pair, its reference size, pair count, measured m_pair, Mass UUID, Units of mass UUID, kg reference unit, and the exact Tiangong product-flow UUID are present and mutually consistent."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Confirm every selected flow is one material, component, energy carrier, waste, or elementary emission; reject plural collections, combined utilities, route selectors, and an other exchange."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_process_coverage
    applies_to: "foreground boundary"
    rule: "Confirm upper cutting/preparation/sewing and final lasting/sole attachment/finishing/inspection/packing are represented; confirm bottom-component manufacture is either included or represented by explicit purchased-component inputs."
    source_ids:
      - afw-pefcr-v3-1-2025
      - oliver-footwear-manufacturing-2021
      - unido-ilo-footwear-1982
  - rule_id: validate_mass_balance
    applies_to: "every material-bearing process"
    rule: "Reconcile atomic material inputs with conforming outputs, recoverable transfers, stock change, offcuts, rejects, and other losses; investigate rather than force-close unexplained imbalance."
    source_ids:
      - afw-pefcr-v3-1-2025
      - iso-14044-2006
  - rule_id: validate_energy_allocation
    applies_to: "electricity and fuel"
    rule: "Confirm each energy carrier is separate, meter period matches production, allocation driver is causal and reproducible, and site or supply mix evidence is retained."
    source_ids:
      - afw-pefcr-v3-1-2025
  - rule_id: validate_no_unsupported_range
    applies_to: "inventory amount metadata"
    rule: "Confirm no single case value, repeated lower/upper value, abstract-only value, or unverified estimate is represented as an empirical range; absence of sufficient compatible evidence remains a disclosed range gap."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_bilingual_identity
    applies_to: "Chinese rendering"
    rule: "Confirm every UUID, process id, row id, controlled token, source id, and normative rule id matches the English source, and the reference flow uses the exact Tiangong Chinese baseName."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate manufacturing data package for CPC 29340 footwear"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product-specific LCA, product carbon footprint, PEF-aligned modelling, supplier data exchange, process improvement, and downstream process or lifecyclemodel construction when the declared product, route, geography, and period match"
  excluded_use: "Sports footwear; leather-upper or rubber/plastic-upper footwear; unsupported category averages; consumer-use or end-of-life claims; comparative assertions without a complete aligned method; use of missing data as zero"
  required_metadata: "PCR id and version; CPC decision; product style and construction; textile upper identity; reference size and segment; pair mass; BOM; site and geography; reporting period; included and purchased processes; energy sources; allocation; waste fate; data gaps; source and dataset versions"
  required_quality_disclosure: "DQR criteria; primary-data share; measurement and calibration evidence; sampling and temporal coverage; mass-balance residuals; allocation drivers; proxy datasets; exclusions; unresolved UUIDs; rejected-pair and scrap treatment"
  update_trigger: "BOM, upper material, sole system, adhesive chemistry, component sourcing, assembly route, site, electricity supply, allocation method, waste treatment, reference flow identity, classification scope, or evidence contract changes materially"
