measurement_rules:
  - id: reference_pair_mass
    applies_to: "conforming finished pair"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh the complete left-and-right pair after finishing and conditioning, exclude detachable sales packaging, record the reference size and scale resolution, and use the arithmetic mean of conforming measured pairs for m_pair."
  - id: pair_mass_conversion
    applies_to: "conversion between pair and mass reporting"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg/pair"
    rule: "Convert a per-pair inventory to a per-kg inventory by dividing every exchange by m_pair; retain m_pair, sample count, and reference size so the conversion is reversible."
  - id: component_mass_basis
    applies_to: "BOM materials, components, finished product, and solid waste"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record gross input, conforming incorporated mass, recoverable offcut, reject, and disposed mass without mixing wet and dry bases; document moisture or conditioning state when material mass can change materially."
  - id: energy_unit_preservation
    applies_to: "electricity and fuel inputs"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh for electricity; MJ for fuel"
    rule: "Preserve metered units and conversion factors. Do not combine electricity, purchased heat, steam, or fuel into one inventory exchange."
