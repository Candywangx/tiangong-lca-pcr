measurement_rules:
  - id: reference_mass
    applies_to: "accepted finished footwear"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh or calculate the net mass of accepted footwear only; normalize every process result to 1 kg reference output."
  - id: packaging_exclusion
    applies_to: "sales and transport packaging"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Exclude packaging mass from reference product mass and report every packaging material as a separate product input and waste output."
  - id: count_to_mass
    applies_to: "pairs, pieces, eyelets, laces and components recorded by count"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert counts using a contemporaneous, product-specific mean mass from a documented sample; retain counts and sample observations."
  - id: electricity_measurement
    applies_to: "purchased or generated electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Record each electricity supply separately from steam, heat and fuels; allocate shared meters only by documented submetering or a causal operating driver."
  - id: steam_and_hot_water
    applies_to: "purchased steam and purchased hot water"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Calculate useful energy from measured mass flow and inlet/outlet state or supplier energy records; do not combine steam and hot water."
  - id: fuel_lhv
    applies_to: "natural gas and liquefied petroleum gas"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ LHV"
    rule: "Convert measured fuel quantity with supplier-period lower-heating-value data and retain original quantities and factors."
  - id: solvent_mass_balance
    applies_to: "acetone and ethyl acetate"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile each named solvent separately across purchases, stock change, product/waste retention, recovery and emission."
  - id: refrigerant_mass_balance
    applies_to: "each refrigerant used by on-site cooling equipment"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report each chemical separately and calculate leakage from charge, additions, recovery and closing stock; do not report a generic refrigerant flow."
process_map:
  - id: upper_preparation
    name: "Upper cutting and stitching"
    inclusion: "required"
    inclusion_condition: "Include for every route; adapt material cards to the actual construction without aggregating unlike materials."
    role: "Converts upper materials and accessories into stitched uppers."
    quantitative_reference: "kg accepted stitched upper output"
  - id: sole_forming
    name: "On-site sole-component forming"
    inclusion: "conditional"
    inclusion_condition: "Include only when midsoles, outsoles or other bottom components are formed on site."
    role: "Forms declared sole components from named compounds."
    quantitative_reference: "kg accepted sole-component output"
  - id: lasting_assembly
    name: "Lasting, bonding and finishing"
    inclusion: "required"
    inclusion_condition: "Include actual lasting, adhesive preparation/application, activation, attachment, pressing and finishing operations."
    role: "Converts uppers and bottom components into accepted unboxed footwear."
    quantitative_reference: "kg accepted unboxed footwear output"
  - id: final_packaging
    name: "Final inspection and packaging"
    inclusion: "required"
    inclusion_condition: "Include all actual retail and transport packaging applied at the site."
    role: "Produces the reference footwear and separately accounts for packaging."
    quantitative_reference: "kg net accepted reference product"
