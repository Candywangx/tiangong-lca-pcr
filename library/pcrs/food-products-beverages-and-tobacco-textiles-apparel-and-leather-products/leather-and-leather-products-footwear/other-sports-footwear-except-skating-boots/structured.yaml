    rule: "Subdivision and direct measurement are required before allocation. Internal rework remains inside its originating process and is not a co-product. Waste or scrap leaving the system is not credited unless it has a documented destination and an economically valuable secondary-product function; any such case must disclose the quantity, destination, substituted function and allocation method."
    source_ids: []
  - rule_id: allocation_avoid
    applies_to: "all shared operations"
    rule: "First subdivide processes or use direct metering and product-specific issue records to avoid allocation."
    source_ids:
      - eu-pef-2021
      - af-pefcr-2025
  - rule_id: allocation_causal
    applies_to: "shared electricity, heat, fuel, chemicals and waste"
    rule: "If subdivision is impossible, allocate each atomic exchange with a documented physical causal driver such as machine time, metered energy, material throughput or accepted mass; do not apply one undifferentiated factor to all exchanges."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_scrap
    applies_to: "saleable scrap or secondary outputs"
    rule: "Treat scrap as waste by default. If it performs a documented co-product function and has economic value, disclose it and apply the applicable study hierarchy consistently without double credit."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_rework
    applies_to: "internal rework"
    rule: "Return rework inputs, energy and losses to the process that generated them and include them in the accepted-output denominator."
    source_ids:
      - af-pefcr-2025
