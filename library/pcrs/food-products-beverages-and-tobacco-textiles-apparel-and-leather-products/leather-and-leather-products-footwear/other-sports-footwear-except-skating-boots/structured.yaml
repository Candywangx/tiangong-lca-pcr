system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when purchased raw materials, compounds, parts, chemicals, packaging, electricity, steam, hot water and fuels enter the manufacturing site. It ends when accepted footwear and its separately inventoried sales packaging leave final packaging. It includes internal rework, rejects, direct air emissions and wastes from the included operations. Capital goods, employee commuting, distribution, retail, use and end-of-life are excluded unless a separate study explicitly extends the boundary and labels that extension."
      source_ids: []
    - rule_id: boundary_factory_gate
      applies_to: "all foreground processes"
      rule: "Include upper preparation, included on-site sole-component forming, lasting and assembly, finishing, packaging, internal rework, rejects, direct emissions and wastes from receipt of inputs through packaged product."
      source_ids:
        - af-pefcr-2025
        - krug-2021-footwear-manufacturing
    - rule_id: boundary_actual_route
      applies_to: "purchased and on-site operations"
      rule: "Model the actual route: omit an on-site forming process only when the corresponding component is purchased and its supplier dataset is linked."
      source_ids:
        - af-pefcr-2025
    - rule_id: boundary_atomic_exchanges
      applies_to: "all inventory exchanges"
      rule: "Record each material, packaging component, electricity supply, heat carrier, fuel, refrigerant, emission and waste as a separate flow."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_no_downstream_claim
      applies_to: "published dataset"
      rule: "Do not infer distribution, use-life, maintenance or end-of-life performance from this factory-gate dataset."
      source_ids:
        - epd-footwear-2024
