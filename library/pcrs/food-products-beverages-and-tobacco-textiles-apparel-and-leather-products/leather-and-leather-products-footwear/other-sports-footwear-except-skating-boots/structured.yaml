      raw_fields: "model; size; pair count; sample mass; reject count; net accepted mass"
      collection_method: "weigh accepted production or calculate from stratified size-specific mass sample"
      unit: "kg and pair"
      frequency: "batch"
      temporal_coverage: "same as reference production"
      site_scope: "all included lines and sites"
      aggregation_rule: "production-weighted size mix; normalize to 1 kg"
      quality_evidence: "calibrated balance, sample design and acceptance records"
  calculation_rules:
    - id: calc_material_consumption
      applies_to: "every named material and chemical"
      rule: "opening stock + receipts - closing stock - documented return = consumed mass; reconcile consumed mass to product, waste, recovery and emission as applicable"
      inputs:
        - stock
        - receipt
        - return
        - product
        - "waste and emission records"
      output: "kg consumed per process output"
      source_ids:
        - eu-pef-2021
        - af-pefcr-2025
    - id: calc_count_to_mass
      applies_to: "counted parts and packaging"
      rule: "total count × product-specific sampled mean mass; stratify by size or specification when mass differs materially"
      inputs:
        - "count and mass sample"
      output: "kg input per process output"
      source_ids:
        - af-pefcr-2025
    - id: calc_shared_energy
      applies_to: "shared electricity and fuels"
      rule: "shared measured quantity × documented causal-driver share; retain denominator and all product shares"
      inputs:
        - "meter quantity and causal driver"
      output: "kWh or MJ by process and product"
      source_ids:
        - eu-pef-2021
    - id: calc_steam_energy
      applies_to: "purchased steam"
      rule: "measured steam mass × delivered enthalpy difference; use supplier energy record when independently metered"
      inputs:
        - mass
        - "pressure/temperature or supplier record"
      output: "MJ steam"
      source_ids:
        - eu-pef-2021
    - id: calc_hot_water_energy
      applies_to: "purchased hot water"
      rule: "mass × specific heat capacity × measured temperature difference"
      inputs:
        - "water mass and inlet/outlet temperature"
      output: "MJ hot-water energy"
      source_ids:
        - eu-pef-2021
    - id: calc_fuel_energy
      applies_to: "natural gas and LPG"
      rule: "measured quantity × supplier-period lower heating value"
      inputs:
        - "fuel quantity and LHV"
      output: "MJ LHV"
      source_ids:
        - eu-pef-2021
    - id: calc_solvent_emission
      applies_to: "each named solvent"
      rule: "opening stock + purchases - closing stock - recovered mass - off-site waste mass - retained mass = emission, unless calibrated direct measurement replaces the balance"
      inputs:
        - "chemical-specific stock"
        - recovery
        - "waste and retention"
      output: "kg named solvent to air"
      source_ids:
        - simoes-2024-footwear-adhesive
        - unido-footwear-environment
    - id: calc_reference_normalization
      applies_to: "full foreground system"
      rule: "divide each reconciled exchange by accepted net footwear mass and scale to 1 kg"
      inputs:
        - "reconciled exchange and accepted net mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - af-pefcr-2025
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and reference flow"
      requirement: "Demonstrate CPC 29490 scope, state-100 reference UUID, model or family, construction, size range and product-weighted size mix."
      evidence: "classification record, product specification and production records"
    - id: dq_bom_completeness
      applies_to: "product inputs"
      requirement: "Reconcile the complete actual bill of materials; do not replace unknown constituents with material-family placeholders."
      evidence: "product BOM, purchase specification, issue records and mass balance"
    - id: dq_route
      applies_to: "all processes"
      requirement: "Declare purchased versus on-site component production, included lines, outsourced operations and rework loops."
      evidence: "process map, supplier records and site walk-through"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use a representative continuous 12-month period or a complete campaign and explain abnormal downtime or product-mix changes."
      evidence: "dated meters, stock ledgers and production totals"
    - id: dq_measurement
      applies_to: "mass and energy records"
      requirement: "Use calibrated instruments or reconcile supplier invoices and meters; disclose allocation where direct measurement is unavailable."
      evidence: "calibration, invoices, meter reconciliation and calculation sheets"
    - id: dq_chemical
      applies_to: "adhesives, solvents and emissions"
      requirement: "Preserve exact formulation or chemical identity and close separate mass balances for acetone and ethyl acetate."
      evidence: "safety data sheets, stock ledger, waste manifest and emission report"
    - id: dq_waste_destination
      applies_to: "each waste flow"
      requirement: "Report mass and actual treatment destination separately; do not net recycling receipts against material input."
      evidence: "waste tickets and treatment receipts"
    - id: dq_background
      applies_to: "linked upstream datasets"
      requirement: "Document geographic, temporal and technological representativeness for each material, component and energy supply."
      evidence: "dataset metadata and gap assessment"
    - id: dq_uncertainty
      applies_to: "calculated or allocated values"
      requirement: "Retain raw observations, factor provenance, sample variability and allocation denominator."
      evidence: "calculation workbook and uncertainty disclosure"
validation_rules:
  - rule_id: validate_identity
    applies_to: "PCR and reference flow"
    rule: "CPC code must be 29490; reference flow UUID must be a372c679-9693-4957-aad9-98b6d6b5e435; flow property must be Mass and reference unit kg."
    source_ids:
      - un-cpc-v3-2025
      - epd-footwear-2024
  - rule_id: validate_scope
    applies_to: "product dataset"
    rule: "Reject skating boots and products classified to CPC 2941 or 2942, and reject datasets whose product construction or market state is not declared."
    source_ids:
      - un-cpc-v3-2025
  - rule_id: validate_route
    applies_to: "process inventory"
    rule: "Require upper preparation, lasting/assembly and packaging; require sole forming only when performed on site and otherwise require linked purchased sole components."
    source_ids:
      - af-pefcr-2025
      - krug-2021-footwear-manufacturing
  - rule_id: validate_atomic_inventory
    applies_to: "all exchanges"
    rule: "Reject aggregate utilities, energy-carrier, materials, packaging, emissions or waste rows; each exchange must name one resolvable physical or chemical flow."
    source_ids:
      - eu-pef-2021
      - af-pefcr-2025
  - rule_id: validate_mass_balance
    applies_to: "materials and outputs"
    rule: "Require route-level reconciliation of each named material to product, returned stock, internal recirculation, waste and emissions, and reconcile accepted output to the 1 kg reference."
    source_ids:
      - eu-pef-2021
      - af-pefcr-2025
  - rule_id: validate_energy
    applies_to: "electricity, steam, hot water and fuels"
    rule: "Require separate measured or calculated quantities and factors for each carrier; reject combined energy rows."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_solvents
    applies_to: "acetone and ethyl acetate"
    rule: "Require separate input, waste, recovery and air-emission accounting for each used solvent."
    source_ids:
      - simoes-2024-footwear-adhesive
      - unido-footwear-environment
  - rule_id: validate_refrigerants
    applies_to: "on-site cooling"
    rule: "If refrigerant make-up or leakage occurs, require a separate chemical-specific input and elementary emission card with a closed mass balance; a generic refrigerant row fails."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_packaging
    applies_to: "final packaging"
    rule: "Require each actual packaging component and each packaging waste separately, while excluding packaging mass from the reference product."
    source_ids:
      - af-pefcr-2025
      - ccote-2024-footwear-lca
  - rule_id: validate_evidence
    applies_to: "foreground records"
    rule: "Require linked collection protocols, raw-record retention, source IDs for externally supported methods, and explicit disclosure of unresolved UUIDs and data gaps."
    source_ids:
      - eu-pef-2021
      - af-pefcr-2025
published_dataset_profile:
  dataset_role: "Product-specific secondary dataset or background dataset for factory-gate manufacture of CPC 29490 footwear"
  downstream_use: "Foreground package construction and linked process or lifecycle-model projection"
  allowed_use: "Modelling the declared product construction, size mix, site, technology and reporting period; aggregation only after atomic exchanges remain traceable"
  excluded_use: "Claims about other footwear classes; consumer use-life comparisons; distribution or end-of-life claims; substitution of a generic recipe for an undisclosed product route"
  required_metadata: "PCR id and version; CPC 29490; reference UUID; model or family; construction; size mix; net product mass; site and geography; reporting period; included and outsourced processes; packaging configuration; allocation and cut-off disclosures"
  required_quality_disclosure: "BOM and mass-balance completeness; meter and stock-record coverage; calculation factors; allocation drivers; solvent balance; waste destinations; background-data representativeness; unresolved UUIDs and uncertainty"
  update_trigger: "Material change in product construction, supplier route, on-site forming, adhesive or solvent system, energy supply, packaging, site, allocation driver, reporting-period representativeness, CPC scope or Tiangong reference-flow identity"
