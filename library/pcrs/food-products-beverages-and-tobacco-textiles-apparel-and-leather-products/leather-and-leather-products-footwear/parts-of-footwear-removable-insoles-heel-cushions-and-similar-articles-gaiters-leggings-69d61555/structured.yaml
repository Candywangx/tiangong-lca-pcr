allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared processes"
    rule: "Prefer submetering, batch records, line time and material issue records to subdivide the actual route before allocation."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_mass_operations
    applies_to: "compound forming, die-cutting, insole production, stockfitting and finishing"
    rule: "When subdivision is not possible, allocate shared inputs and outputs by measured product mass for the same reporting period."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: allocation_unit_operations
    applies_to: "sewing and assembly"
    rule: "When subdivision is not possible, allocate shared sewing or assembly burdens by processed units, then convert the represented model and size mix to the 1 kg reference flow using measured mass."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: allocation_recycled_scrap
    applies_to: "internally recovered EVA or other process scrap"
    rule: "Record scrap generation, recovery input and substitution explicitly; prevent double counting of avoided virgin material or waste treatment and disclose the selected recycling allocation method."
    source_ids:
      - eu-pef-method-2021
      - bianchi-recycled-eva-footwear-2023
dataset_production:
  collection_protocols:
    - protocol_id: cp_sheet_part_converting
      process_id: "sheet_part_converting"
      flow_role: "material, electricity, accepted part and offcut exchanges"
      record_type: "purchase, issue/return, scale, meter and waste-dispatch records"
      raw_fields: "material id; lot; issued mass; returned mass; accepted cut mass; offcut mass; treatment route; kWh; machine time; output model and size"
      collection_method: "Reconcile signed material movements and calibrated weighing with stage electricity records"
      unit: "kg; kWh"
      frequency: "Each batch with monthly reconciliation"
      temporal_coverage: "At least one representative production year or the full shorter campaign"
      site_scope: "Every included cutting site and subcontractor"
      aggregation_rule: "Sum by atomic flow and treatment route, allocate only under section 7, normalize to accepted cut output and reference product"
      quality_evidence: "Calibration; invoices; issue/return slips; cutting plan; production log; waste transfer record"
    - protocol_id: cp_eva_part_moulding
      process_id: "eva_part_moulding"
      flow_role: "EVA compound, release agent, electricity, product, gate/runner and reject exchanges"
      record_type: "batch recipe, hopper issue, scale, meter, machine and waste records"
      raw_fields: "compound lot and formulation; virgin and recovered mass; release-agent mass; kWh; conforming part mass; gate/runner mass; reject mass; recovery or disposal route"
      collection_method: "Reconcile each moulding batch and retain machine-cycle and recovery records"
      unit: "kg; kWh"
      frequency: "Each batch with monthly reconciliation"
      temporal_coverage: "At least one representative production year or the full shorter campaign"
      site_scope: "Every included moulding site and subcontractor"
      aggregation_rule: "Sum by atomic flow and waste route; separately report internally recovered material; normalize to conforming moulded output and reference product"
      quality_evidence: "Calibrated scales/meters; recipe; machine log; reject log; waste transfer record"
    - protocol_id: cp_sewn_part_assembly
      process_id: "sewn_part_assembly"
      flow_role: "panels, thread, adhesive, electricity, assembled article and residue exchanges"
      record_type: "issue/return, scale, meter, sewing, bonding and waste records"
      raw_fields: "panel mass; thread mass; adhesive formulation and mass; kWh; conforming output mass and units; residue mass; reject mass"
      collection_method: "Reconcile material issue and return with accepted output and residue for each model and size mix"
      unit: "kg; kWh; item"
      frequency: "Each batch with monthly reconciliation"
      temporal_coverage: "At least one representative production year or the full shorter campaign"
      site_scope: "Every included sewing or bonding site and subcontractor"
      aggregation_rule: "Sum by atomic flow; use unit allocation only under section 7; normalize using measured output mass"
      quality_evidence: "Scale/meter calibration; bill of materials; work order; adhesive record; inspection and waste record"
    - protocol_id: cp_finishing_packaging
      process_id: "finishing_packaging"
      flow_role: "unboxed product, electricity, paperboard box, LDPE bag, conforming output and reject exchanges"
      record_type: "receipt, scale, meter, packaging issue and inspection records"
      raw_fields: "incoming mass; kWh; box count and unit mass; bag count and unit mass; conforming net mass; reject mass and treatment route"
      collection_method: "Reconcile accepted incoming part, packaging issued, conforming net output and rejects"
      unit: "kg; kWh; item"
      frequency: "Each batch with monthly reconciliation"
      temporal_coverage: "At least one representative production year or the full shorter campaign"
      site_scope: "Every included finishing and packaging site"
      aggregation_rule: "Sum by atomic flow; keep packaging outside net product; normalize to 1 kg conforming net output"
      quality_evidence: "Calibrated scales/meters; packaging specification; inspection log; production and waste records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory exchanges"
      rule: "normalized amount = reporting-period exchange amount / reporting-period conforming net product mass"
      inputs:
        - "atomic exchange amount"
        - "conforming net product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_process_loss
      applies_to: "each material process"
      rule: "loss rate = (accepted input - returned input - conforming transferred output) / accepted input; reconcile the resulting mass with separately measured waste and inventory change"
      inputs:
        - "accepted input"
        - return
        - output
        - waste
        - "opening and closing stock"
      output: "process-specific loss rate and mass-balance finding"
      source_ids:
        - af-pefcr-3-1-2025
    - id: calc_item_mass
      applies_to: "item-based part and packaging records"
      rule: "mass = item count multiplied by measured mean mass for the identical specification and documented sample"
      inputs:
        - count
        - "sample masses"
        - "specification and size mix"
      output: "kg of part or packaging component"
      source_ids:
        - af-pefcr-3-1-2025
    - id: calc_shared_electricity
      applies_to: "shared electrical equipment"
      rule: "allocated kWh = metered kWh multiplied by the documented allocation share from machine time, processed mass or processed units consistent with section 7"
      inputs:
        - "metered kWh"
        - "machine time"
        - "processed mass or units"
      output: "process electricity by declared product"
      source_ids:
        - af-pefcr-3-1-2025
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain product specification, photo or drawing, part family, model, material/formulation, construction, size or size mix, performance requirement and CPC 29600 justification."
      evidence: "Controlled specification; bill of materials; inspection record; product drawing or photo"
    - id: dq_primary_coverage
      applies_to: "foreground route"
      requirement: "Use primary records for every included factory and subcontractor; document the reporting period, production volume and exclusions."
      evidence: "Site and supplier records; coverage reconciliation; signed data return"
    - id: dq_bom_completeness
      applies_to: "material inventory"
      requirement: "Cover at least 95% of product BOM mass and 100% of declared main structural, cushioning, covering and fastening materials; disclose every omitted atomic input."
      evidence: "Mass-based BOM completeness calculation and omission register"
    - id: dq_mass_balance
      applies_to: "each process"
      requirement: "Reconcile inputs, returns, outputs, wastes and stock change; investigate unexplained imbalance rather than assigning it to an aggregate waste flow."
      evidence: "Process mass-balance worksheet and corrective-action record"
    - id: dq_energy
      applies_to: "electricity"
      requirement: "Retain meters, calculation inputs, allocation basis and site supply evidence; do not merge electricity with heat or fuel."
      evidence: "Meter record; equipment log; supply invoice or contract; allocation worksheet"
    - id: dq_waste_route
      applies_to: "each waste flow"
      requirement: "Record the exact material, hazardous status where applicable, receiver and treatment route; do not combine EVA, leather, polyester, cellulose, adhesive or product rejects."
      evidence: "Waste manifest, receiver evidence and material reconciliation"
    - id: dq_source_and_proxy
      applies_to: "upstream datasets"
      requirement: "Record dataset identity, geography, technology, time, version and proxy justification for every upstream input."
      evidence: "Dataset register and proxy assessment"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require state-100 Product flow UUID 13caecd4-f313-436a-8ab4-2abfbab600bb, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and reference amount 1."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "product identity"
    rule: "Require one named CPC 29600 part family and model; reject complete footwear, raw materials, and pooled results that mix unrelated part families or routes."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_route_completeness
    applies_to: "process map"
    rule: "Require finishing and packaging plus every conditional process and subcontractor operation actually used; require evidence for every not-applicable route."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: validate_atomic_inventory
    applies_to: "inventory rows"
    rule: "Require separate exchanges for each material, electricity input, packaging component, waste material and direct emission; reject collection labels or combined carriers."
    source_ids:
      - af-pefcr-3-1-2025
      - eu-pef-method-2021
  - rule_id: validate_mass_balance
    applies_to: "each included process"
    rule: "Require accepted input, returns, conforming output, measured waste and stock change to reconcile within the declared measurement uncertainty."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: validate_no_case_range
    applies_to: "quantitative screening"
    rule: "Reject any lower-equals-upper range or empirical interval derived from one plant, product or paper; require two independent boundary-compatible original sources and a documented synthesis before accepting a cross-category empirical range."
    source_ids: []
  - rule_id: validate_bilingual_alignment
    applies_to: "localized PCR"
    rule: "Require identical ordered rule ids, process ids, row ids, UUIDs, controlled tokens and source ids in English and Chinese, with the exact Tiangong Chinese baseName for the UUID-bearing reference product."
    source_ids: []
published_dataset_profile:
  dataset_role: "Factory-gate secondary_dataset or background_dataset for one specified CPC 29600 product"
  downstream_use: "Upstream component input to footwear or protective-article process datasets and lifecycle models; product-specific footprinting; supplier and factory improvement analysis"
  allowed_use: "Use when product family, model, material/formulation, construction, route, size mix, geography, period, packaging and data quality match the study"
  excluded_use: "Complete-footwear reference product; generic proxy across unrelated footwear-part families; consumer-use or end-of-life modelling; unsupported comparative claims; substitution for missing product-specific route data"
  required_metadata: "canonical PCR id; reference UUID and Mass/unit support; exact part family and model; function; CPC scope justification; material/formulation; BOM and coverage; construction and route; size or size mix; net mass; sites and subcontractors; reporting period; electricity supply; packaging; wastes and treatment routes; allocation; upstream datasets; proxies; cut-offs and data gaps"
  required_quality_disclosure: "foreground record coverage; measurement and calibration; mass-balance results; BOM completeness; allocation; supplier coverage; upstream dataset quality; proxy use; missing UUIDs; uncertainty and unresolved range evidence"
  update_trigger: "Change in product family, formulation, construction, manufacturing route, main supplier, site, electricity supply, packaging, allocation, waste treatment, performance specification, or a material data-quality improvement"
