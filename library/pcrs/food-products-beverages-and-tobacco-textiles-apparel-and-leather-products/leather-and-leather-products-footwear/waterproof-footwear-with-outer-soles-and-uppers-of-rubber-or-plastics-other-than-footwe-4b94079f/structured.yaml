allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "all foreground processes"
    rule: "Avoid allocation by separately metering and subdividing compounding, forming, assembly, finishing, and packaging."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_rule_2
    applies_to: "materials and wastes"
    rule: "Assign batch-specific materials, rejects, rework, and material-specific scrap directly to the product route that caused them."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: allocation_rule_3
    applies_to: "shared utilities"
    rule: "Allocate unresolved totals with a physical driver such as metered share or machine time multiplied by verified load; disclose driver and shares."
    source_ids:
      - ec-pef-method-2021
      - af-pefcr-3-1-2025
  - rule_id: allocation_rule_4
    applies_to: "sizes and styles"
    rule: "Convert counts to measured mass by style and size, then production-weight inventory; do not use unweighted counts when unit masses differ materially."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: allocation_rule_5
    applies_to: "internal reuse and recycling"
    rule: "Keep gross input, recovered material, internal reuse, exported waste, and final output visible; do not apply an avoided-burden credit unless a downstream model explicitly requires it."
    source_ids:
      - ec-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_p1_compounding_records
      process_id: "p1_compounding"
      flow_role: "ingredients, utilities, compound, waste, emissions"
      record_type: "batch sheets; stocks; meters; waste records"
      raw_fields: "batch; formulation; identity; issued mass; output; waste; electricity; fuel; emission activity"
      collection_method: "Reconcile each formulation batch to material issues and accepted compound."
      unit: "kg; kWh; MJ; m3"
      frequency: "each batch and monthly"
      temporal_coverage: "representative period, normally 12 months unless justified"
      site_scope: "all compounding lines"
      aggregation_rule: "Normalize reconciled batches to accepted compound."
      quality_evidence: "calibrated scales/meters; batch approval; mass balance"
    - protocol_id: cp_p2_forming_records
      process_id: "p2_component_forming"
      flow_role: "forming materials, utilities, components, scrap, emissions"
      record_type: "machine logs; meters; maintenance logs"
      raw_fields: "machine; mould; material; runtime; utilities; accepted mass; scrap; refrigerant balance"
      collection_method: "Match materials and utilities to forming batches."
      unit: "kg; kWh; MJ; m3"
      frequency: "batch or shift"
      temporal_coverage: "representative period"
      site_scope: "all forming equipment"
      aggregation_rule: "Aggregate by component and route, then normalize to accepted mass."
      quality_evidence: "traceability; calibration; scrap destination; refrigerant reconciliation"
    - protocol_id: cp_p3_assembly_records
      process_id: "p3_assembly_sealing"
      flow_role: "components, linings, joining materials, utilities, waste"
      record_type: "BOM; issue and line records; adhesive logs"
      raw_fields: "style; size; component masses; joining materials; utilities; output; waste"
      collection_method: "Link product BOM and net issue to line output and waste."
      unit: "kg; kWh; MJ; m3"
      frequency: "lot or shift"
      temporal_coverage: "representative period"
      site_scope: "all assembly lines"
      aggregation_rule: "Preserve integral, assembled, leather-lined, and textile-lined routes."
      quality_evidence: "BOM revision; lot traceability; line balance; waste receipts"
    - protocol_id: cp_p4_finishing_testing_records
      process_id: "p4_finishing_testing"
      flow_role: "chemicals, test water, utilities, product, wastewater, rejects"
      record_type: "recipes; test logs; meters; stocks"
      raw_fields: "lot; chemical; test method; tested/accepted units; utilities; wastewater; rejects"
      collection_method: "Match finishing and waterproof-test records to accepted output."
      unit: "kg; unit; kWh; MJ; m3"
      frequency: "each lot and monthly"
      temporal_coverage: "representative period"
      site_scope: "all finishing/test stations"
      aggregation_rule: "Calculate use, discharge, and rejects per accepted mass."
      quality_evidence: "test and meter calibration; recipes; wastewater records"
    - protocol_id: cp_p5_packaging_records
      process_id: "p5_packaging"
      flow_role: "final mass, counts, packaging, fuel, waste"
      record_type: "inspection; scales; packaging specs; invoices"
      raw_fields: "style; size; count; net mass; each packaging mass; electricity; diesel; waste"
      collection_method: "Measure net product and each packaging item separately."
      unit: "kg; count; kWh; MJ"
      frequency: "each lot and period"
      temporal_coverage: "representative period"
      site_scope: "all packing/handling"
      aggregation_rule: "Normalize to exactly 1 kg net accepted footwear."
      quality_evidence: "scale calibration; specifications; count-to-mass sample; invoices"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all exchanges"
      rule: "normalized exchange = reporting-period exchange × attribution share ÷ net accepted reference mass"
      inputs:
        - exchange
        - share
        - mass
      output: "exchange per kg"
      source_ids:
        - ec-pef-method-2021
    - id: calc_bom_reconciliation
      applies_to: "materials"
      rule: "issued material = accepted incorporation + waste + stock change + recovered material + residual"
      inputs:
        - BOM
        - issues
        - output
        - waste
        - stocks
      output: "material balance"
      source_ids:
        - af-pefcr-3-1-2025
    - id: calc_count_to_mass
      applies_to: "count records"
      rule: "product mass = sum of accepted count by style/size × measured mean unit mass"
      inputs:
        - counts
        - "sample masses"
      output: "kg accepted product"
      source_ids:
        - af-pefcr-3-1-2025
    - id: calc_shared_electricity
      applies_to: "shared electricity"
      rule: "allocated electricity = complete meter total × documented meter or machine-time/load share"
      inputs:
        - meter
        - runtime
        - "load/share"
      output: "kWh by process"
      source_ids:
        - ec-pef-method-2021
        - af-pefcr-3-1-2025
    - id: calc_fuel_use
      applies_to: "fuels"
      rule: "energy = measured fuel quantity × documented net calorific value"
      inputs:
        - quantity
        - factor
      output: "MJ by process"
      source_ids:
        - ec-pef-method-2021
    - id: calc_refrigerant_loss
      applies_to: "R-410A"
      rule: "loss = opening + purchases − closing − recovered − transfers"
      inputs:
        - "service/stock records"
      output: "kg loss"
      source_ids:
        - ec-pef-method-2021
    - id: calc_wastewater_pollutant
      applies_to: "wastewater pollutant"
      rule: "load = discharged volume × representative measured concentration with unit conversion"
      inputs:
        - volume
        - concentration
      output: "kg to water"
      source_ids:
        - ec-pef-method-2021
    - id: calc_production_weighting
      applies_to: "products and routes"
      rule: "weighted exchange = sum of route exchange × accepted-mass share"
      inputs:
        - "route exchange"
        - mass
      output: "weighted exchange"
      source_ids:
        - af-pefcr-3-1-2025
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and inputs"
      requirement: "Preserve classification, material/chemical identity, grade, composition, and verified reference UUIDs; keep non-reference UUID gaps explicit."
      evidence: "specification; SDS; supplier record; manifest"
    - id: dq_bom
      applies_to: "materials"
      requirement: "Use the applicable product-specific BOM and reconcile it to actual issue and manufacturing loss."
      evidence: "BOM; issues; balance"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Use one representative period and disclose exceptions, shutdowns, start-ups, and seasonality."
      evidence: "logs; invoices; register"
    - id: dq_measurement
      applies_to: "measured flows"
      requirement: "Retain calibration, meter boundary, sampling, conversion factors, and limitations."
      evidence: "certificates; meter map; reports"
    - id: dq_completeness
      applies_to: "LCI"
      requirement: "Cover applicable raw materials, energy, products, wastes, and air/water releases; explain residuals and exclusions."
      evidence: "checklist; balances"
    - id: dq_route
      applies_to: "product routes"
      requirement: "Keep integral/assembled, rubber/plastic, lined/unlined routes distinguishable before weighting."
      evidence: "route; machine; batch records"
    - id: dq_leather
      applies_to: "leather lining"
      requirement: "Confirm supplier data cover tanning and the footwear inventory does not duplicate it."
      evidence: "supplier scope; declaration; site map"
    - id: dq_transparency
      applies_to: "publication"
      requirement: "Disclose allocation, datasets, destinations, gaps, unresolved UUIDs, exclusions, uncertainty, and review status."
      evidence: "report; review"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference identity"
    rule: "Require the verified product-flow, Mass-property, and Units-of-mass UUIDs with kg."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "scope"
    rule: "Reject protective-metal-toe footwear, products not declared waterproof, or products lacking both a rubber-or-plastic upper and outer sole."
    source_ids:
      - un-cpc-3-0
  - rule_id: validation_rule_3
    applies_to: "reference amount"
    rule: "Require exactly 1 kg net accepted footwear and separate packaging inputs."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validation_rule_4
    applies_to: "process applicability"
    rule: "Include every actual process and justify each route-dependent atomic card marked not applicable."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: validation_rule_5
    applies_to: "atomic inventory"
    rule: "Reject collection labels and combined utilities, materials, wastes, chemicals, packaging, or emissions."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "material balance"
    rule: "Reconcile issue, output, stock change, recovery, and each waste stream; investigate residuals."
    source_ids:
      - ec-pef-method-2021
      - af-pefcr-3-1-2025
  - rule_id: validation_rule_7
    applies_to: "allocation"
    rule: "Verify complete totals, physical drivers, shares summing to source totals, and normalization."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validation_rule_8
    applies_to: "waterproof test"
    rule: "Require method, criterion, amount tested, failures, retests, and treatment of test water."
    source_ids:
      - af-pefcr-3-1-2025
  - rule_id: validation_rule_9
    applies_to: "evidence gaps"
    rule: "Reject invented quantities and unconfirmed UUIDs; keep missing values as collection requirements."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validation_rule_10
    applies_to: "double counting"
    rule: "Do not duplicate supplier compounding, component forming, tanning, packaging production, transport, or waste treatment."
    source_ids:
      - ec-pef-method-2021
      - jrc-tanning-bref
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for CPC 29310 waterproof footwear."
  downstream_use: "May be used as a secondary_dataset or background_dataset after identity, completeness, quality, and review gates pass."
  allowed_use: "Factory-gate modelling of a declared footwear form, size, polymer composition, construction, lining, sealing, finish, site, technology, period, and packaging."
  excluded_use: "Protective-toe or non-waterproof footwear; products outside declared upper/sole materials; use, durability, or lifetime claims; undisclosed route; comparisons outside represented conditions."
  required_metadata: "PCR id/version; UUIDs; footwear form; size/count basis; upper/sole polymers; construction; compound source; lining; sealing; finish; waterproof test; no protective metal toe-cap; packaging; site; technology; period; boundary; allocation; datasets; waste destinations; review."
  required_quality_disclosure: "Primary-data/BOM coverage; metering/allocation; balances; route coverage; gaps; UUID gaps; representativeness; exclusions; uncertainty; test evidence; verification."
  update_trigger: "Change in scope, identity, formulation, construction, test, lining, adhesive/finish, technology, utility, packaging, allocation, regulation, source method, or representativeness period."
data_sources:
  - id: "un-cpc-3-0"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 official entry and official raw structure title for subclass 29310. https://unstats.un.org/unsd/classifications/Econ/CPC (verified source package, 2026-08-13)."
    used_for: "Exact category scope and protective-metal-toe exclusion."
  - id: "ec-pef-method-2021"
    type: "official_guidance"
    reference: "European Commission, Commission Recommendation (EU) 2021/2279, consolidated Product Environmental Footprint method. https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng (official full text verified in supplied source package)."
    used_for: "Product-specific BOM; company-specific manufacturing data; complete LCI; allocation; completeness; transparency; quality."
  - id: "jrc-tanning-bref"
    type: "official_guidance"
    reference: "European Commission JRC/EIPPCB, BAT Reference Document for the Tanning of Hides and Skins. https://eippcb.jrc.ec.europa.eu/reference/tanning-hides-and-skins-0 (official full text verified in supplied source package)."
    used_for: "Conditional leather-lining upstream scope only; tanning is not forced into a footwear site that does not tan."
  - id: "af-pefcr-3-1-2025"
    type: "standard"
    reference: "Apparel and Footwear Product Environmental Footprint Category Rules, version 3.1, 29 April 2025. https://pefapparelandfootwear.eu/afw_pefcr_v3-1_final/ (full text verified in supplied source package)."
    used_for: "BOM, manufacturing loss, packaging, process-data organization, production weighting, and quality; no numerical default imported."
