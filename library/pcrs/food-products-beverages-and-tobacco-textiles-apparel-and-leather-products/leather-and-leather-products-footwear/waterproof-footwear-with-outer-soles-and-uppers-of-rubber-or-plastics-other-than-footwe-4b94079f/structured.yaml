system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "foreground manufacturing"
      rule: "Include every applicable on-site operation from declared inputs through compounding, forming, assembly, sealing, finishing, waterproof testing, inspection, and packaging, with direct utilities, wastes, and emissions."
      source_ids:
        - ec-pef-method-2021
        - af-pefcr-3-1-2025
    - rule_id: boundary_rule_2
      applies_to: "product scope"
      rule: "Require rubber or plastic outer soles and uppers, declared waterproof performance, and no protective metal toe-cap."
      source_ids:
        - un-cpc-3-0
    - rule_id: boundary_rule_3
      applies_to: "upstream materials"
      rule: "Model supplier production with traceable upstream datasets instead of duplicating supplier operations in the footwear factory foreground."
      source_ids:
        - ec-pef-method-2021
        - af-pefcr-3-1-2025
    - rule_id: boundary_rule_4
      applies_to: "conditional leather input"
      rule: "A finished-leather lining dataset shall cover relevant tanning chemistry, energy, water, waste, and emissions; tanning is not a mandatory footwear foreground process."
      source_ids:
        - jrc-tanning-bref
    - rule_id: boundary_rule_5
      applies_to: "completeness"
      rule: "Record all applicable raw materials, energy, products, wastes, and direct releases to air and water; unresolved UUIDs do not justify omission."
      source_ids:
        - ec-pef-method-2021
    - rule_id: boundary_rule_6
      applies_to: "downstream stages"
      rule: "Exclude distribution, retail, use, repair, and end-of-life unless a downstream lifecyclemodel adds them without double counting."
      source_ids:
        - ec-pef-method-2021
        - af-pefcr-3-1-2025
