allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "all routes"
    rule: "First subdivide by route, lot and process; do not pool oil-tannage, coating and lamination inputs."
    source_ids:
      - eu-jrc-tanning-2013
  - rule_id: allocation_mass
    applies_to: "shared inputs without separate meters"
    rule: "Allocate shared inputs only using traceable accepted product mass or equipment-time records and disclose the causal basis; do not offset waste flows by treatment credits."
    source_ids:
      - eu-jrc-tanning-2013
