        - "lot exchange"
        - "accepted finished net mass"
        - cp_product
      output: "quantity per 1 kg reference flow"
      source_ids: []
    - id: electricity_conversion
      applies_to: "alternating_current"
      rule: "Convert recorded kWh to MJ using 1 kWh = 3.6 MJ."
      inputs:
        - kWh
        - cp_electricity
      output: "MJ"
      source_ids: []
