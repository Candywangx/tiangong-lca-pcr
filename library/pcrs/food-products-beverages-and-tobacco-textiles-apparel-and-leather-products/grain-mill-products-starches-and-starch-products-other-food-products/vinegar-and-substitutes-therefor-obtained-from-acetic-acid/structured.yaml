validation_rules:
  - rule_id: validate_category_and_route
    applies_to: "product identity"
    rule: "Confirm that the product belongs to CPC 3.0 code 23994 and that exactly one product route is declared. A formulated acetic-acid substitute shall not be labelled or modelled as fermentation vinegar."
    source_ids:
      - unsd-cpc-v3-2025
      - eu-commission-2016-263
      - us-fda-cpg-562-100
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm 1 kg net mass, Mass UUID, Units of mass UUID, kg, required qualifiers, and selected product-flow UUID. Fail if the representative UUID is used for a substitute or materially different form without a documented proxy and no more specific real flow search."
    source_ids: []
  - rule_id: validate_route_processes
    applies_to: "process map"
    rule: "Fermentation-vinegar packages shall include acetification and shall include feedstock preparation or alcoholic fermentation when performed on site. Substitute packages shall include food-grade acetic acid formulation. All packages shall include finishing and conditional packaging."
    source_ids:
      - spain-rd-661-2012-consolidated-2026
      - mas-et-al-2014-wine-vinegar
  - rule_id: validate_boundary_completeness
    applies_to: "foreground inventory"
    rule: "Check applicable material, energy, water, cleaning, internal transfer, waste, wastewater, direct-emission, and product rows against source records and investigate unexplained mass-balance residuals."
    source_ids:
      - jrc-fdm-bref-2019
  - rule_id: validate_allocation
    applies_to: "shared processes"
    rule: "Verify direct assignment was attempted first, the selected allocation relationship is relevant and documented, and economic allocation is used only after the earlier hierarchy steps are shown infeasible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_temporal_coverage
    applies_to: "reporting period"
    rule: "Verify the production, material, utility, waste, emission, and product-output records cover the same declared period and sites, with gaps disclosed."
    source_ids:
      - jrc-fdm-bref-2019
  - rule_id: validate_packaging_state
    applies_to: "plant-gate output"
    rule: "Confirm that packaging inventory is present when the output is packaged and absent or separately excluded when the declared output is bulk; product mass shall remain net of packaging."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for one declared vinegar or edible acetic-acid-based vinegar substitute at the plant gate"
  downstream_use: "secondary_dataset; background_dataset when product, route, geography, time, technology, and packaging state are representative for the receiving model"
  allowed_use: "Product carbon-footprint and LCA studies, foreground process construction, supplier-data replacement, and background use within the declared product and route scope"
  excluded_use: "Silent substitution between fermentation vinegar and acetic-acid substitutes; use of the representative UUID for another form without the required replacement check; consumer-use or cradle-to-grave claims without added downstream stages; comparative assertions when representativeness differs materially"
  required_metadata: "canonical PCR id; CPC coordinate; product name and form; route; substrate or acetic-acid origin; acid strength and method; physical and packaging state; selected flow UUID and replacement reason; geography; site and technology; reporting period; boundary; allocation; upstream datasets; data-owner and review status"
  required_quality_disclosure: "primary-data share; measurement and calibration basis; period and site coverage; route separation; mass-balance residuals; allocation choices; proxy flows and datasets; excluded processes; wastewater and emission coverage; uncertainty and review status"
  update_trigger: "Change in product form, route, feedstock or acetic-acid source, technology, site, acid specification, packaging state, allocation, material supplier, energy mix, wastewater treatment, reporting period, governing market specification, or availability of a more specific real Tiangong product flow"
