allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all multifunctional processes"
    rule: "First avoid allocation by subdividing meters, batch records, equipment time, and material records so inputs and outputs are directly assigned to the declared product. Use system expansion only when it is justified and the expanded function is reported."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "inseparable co-products"
    rule: "If subdivision or justified system expansion is not possible, use a documented causal physical relationship relevant to the shared process, such as measured mass, dry matter, acid content, or processing time. Explain why the selected relationship represents resource use; do not choose mass by default when it is not causal."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other
    applies_to: "no defensible physical relationship"
    rule: "Use another relationship such as economic value only when no relevant physical relationship can be established. Record price basis, geography, time period, currency, co-product quantities, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_rework
    applies_to: "wastes, residues, and rework"
    rule: "Internal rework carries its already-recorded burdens and is not counted as a new external input or co-product. Classify outputs as waste or co-product from documented destination and economic function before allocation; disclose any burden or credit assigned."
    source_ids:
      - eu-pef-2021-2279
      - jrc-fdm-bref-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_product_identity_output
      process_id: "finishing_packaging"
      flow_role: "finished product identity and output"
      record_type: "release, laboratory, and dispatch records"
      raw_fields: "product name; route; substrate or acetic-acid origin; acid strength; method; physical form; treatment; packaging state; flow UUID; batch; net mass; density if used"
      collection_method: "Reconcile quality release and calibrated mass records; document why the selected flow is exact or a disclosed proxy"
      unit: "kg plus declared quality units"
      frequency: "each batch, aggregated monthly or annually"
      temporal_coverage: "representative continuous 12-month period or all batches in the declared shorter campaign"
      site_scope: "every included site and line"
      aggregation_rule: "sum released net mass by product and route; no cross-route averaging before separate results are available"
      quality_evidence: "calibration, laboratory method, batch release, flow-selection record, dispatch reconciliation"
    - protocol_id: cp_material_inputs
      process_id: "all_material_consuming_processes"
      flow_role: "feedstocks, acetic acid, water, cultures, ingredients, auxiliaries, and internal transfers"
      record_type: "receiving, inventory, recipe, meter, and transfer records"
      raw_fields: "material identity; supplier; flow UUID; batch; route; quantity; unit; concentration; density; opening stock; receipts; closing stock; returns; internal transfer"
      collection_method: "Reconcile purchasing and stock movement with batch issues; separate internal recirculation from external inputs"
      unit: "kg or declared native unit with conversion evidence"
      frequency: "each receipt and batch"
      temporal_coverage: "same period as product output"
      site_scope: "every included site and route"
      aggregation_rule: "consumption equals opening stock plus receipts minus closing stock, returns, and documented transfers; normalize after route separation"
      quality_evidence: "supplier specification, scale or meter calibration, stock reconciliation, batch sheet"
    - protocol_id: cp_energy_utilities
      process_id: "all_processes"
      flow_role: "electricity, fuels, steam, cooling, water, and cleaning utilities"
      record_type: "sub-meter, invoice, and operating records"
      raw_fields: "meter id; carrier; opening and closing reading; quantity; unit; process or line; operating hours; allocation driver"
      collection_method: "Prefer process sub-meters; otherwise allocate facility totals using a documented physical driver and reconcile to invoices"
      unit: "declared energy or mass unit"
      frequency: "continuous or per batch; aggregate monthly"
      temporal_coverage: "same period as product output"
      site_scope: "every included site"
      aggregation_rule: "subtract excluded uses, assign direct meters, allocate residual documented totals, then normalize to the applicable process output"
      quality_evidence: "meter calibration, invoice reconciliation, allocation worksheet"
    - protocol_id: cp_process_operation
      process_id: "alcoholic_fermentation_acetification_acetic_acid_formulation_finishing"
      flow_role: "route and operating state"
      record_type: "batch log and control-system record"
      raw_fields: "route; equipment; start and end time; input and output batch; technology; aeration or mixing basis; temperature; aging duration; filtration; thermal treatment; rework"
      collection_method: "Capture contemporaneous batch and control-system records; link all internal intermediate transfers"
      unit: "declared operating units"
      frequency: "each batch"
      temporal_coverage: "all batches in reporting period"
      site_scope: "every included line"
      aggregation_rule: "retain batch-level route identity; aggregate only like products and technologies"
      quality_evidence: "signed batch record, control-system export, deviation log"
    - protocol_id: cp_process_outputs
      process_id: "feedstock_preparation_alcoholic_fermentation_acetification_acetic_acid_formulation"
      flow_role: "internal intermediate outputs"
      record_type: "calibrated vessel, scale, and transfer records"
      raw_fields: "intermediate identity; batch; mass or volume; density; concentration; sender; receiver; losses"
      collection_method: "Reconcile sender and receiver transfer records and use measured density for volume conversion"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "all transfers in reporting period"
      site_scope: "every included site"
      aggregation_rule: "sum reconciled accepted transfers; keep route-specific intermediates separate"
      quality_evidence: "calibration, paired transfer records, mass-balance reconciliation"
    - protocol_id: cp_waste_emissions
      process_id: "all_processes"
      flow_role: "wastes, wastewater, and direct emissions"
      record_type: "waste tickets, wastewater meters and analyses, emission monitors, and calculation records"
      raw_fields: "flow identity; state; quantity; unit; destination; treatment; fossil or biogenic basis; sampling and calculation method"
      collection_method: "Measure at source where possible; otherwise use a documented calculation from collected activity data without inventing factors"
      unit: "kg or declared emission unit"
      frequency: "each shipment, discharge, sample, or batch; aggregate monthly"
      temporal_coverage: "same period as product output"
      site_scope: "every included site and discharge point"
      aggregation_rule: "sum by flow and destination; keep measured and calculated results separate before normalization"
      quality_evidence: "manifests, laboratory reports, meter calibration, formula and input trace"
    - protocol_id: cp_packaging_records
      process_id: "packaging"
      flow_role: "packaging materials, packed product, and scrap"
      record_type: "bill of materials, issue, count, fill-weight, and reject records"
      raw_fields: "packaging material; supplier; flow UUID; item mass; units issued; units packed; rejects; net fill mass"
      collection_method: "Reconcile packaging issues and rejects to packed units; verify count-to-mass conversion with measured item mass"
      unit: "kg"
      frequency: "each packaging run"
      temporal_coverage: "all included runs in reporting period"
      site_scope: "every included packaging line"
      aggregation_rule: "sum by packaging material; normalize to net product mass, not gross packed mass"
      quality_evidence: "packaging specification, sample weighing, fill-control and reject records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = route-specific inventory amount divided by released net product mass for the same route, site, and period"
      inputs:
        - "collected inventory amount"
        - "released net product mass"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calc_volume_to_mass
      applies_to: "any volume-based liquid record"
