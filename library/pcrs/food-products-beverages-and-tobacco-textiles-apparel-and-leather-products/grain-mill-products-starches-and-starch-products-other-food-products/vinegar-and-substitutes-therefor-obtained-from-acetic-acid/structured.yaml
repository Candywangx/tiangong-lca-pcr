system_boundary:
  rules:
    - rule_id: boundary_route_selection
      applies_to: "all foreground packages"
      rule: "Select and disclose either the fermentation-vinegar route or the acetic-acid-substitute route. Include only route-applicable processes and never use fermentation-vinegar identity claims for a formulated substitute."
      source_ids:
        - unsd-cpc-v3-2025
        - eu-commission-2016-263
        - us-fda-cpg-562-100
    - rule_id: boundary_foreground_operations
      applies_to: "manufacturing plant"
      rule: "Include on-site feedstock preparation and alcoholic fermentation when performed, acetification or acetic-acid formulation, finishing, directly attributable utilities, cleaning, waste and wastewater handling to the point they leave the foreground boundary, and conditional packaging."
      source_ids:
        - spain-rd-661-2012-consolidated-2026
        - mas-et-al-2014-wine-vinegar
        - jrc-fdm-bref-2019
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased inputs"
      rule: "Represent purchased feedstocks, food-grade acetic acid, ingredients, cultures, water, energy carriers, cleaning materials, and packaging with upstream datasets; do not treat their supplier production as zero burden."
      source_ids:
        - jrc-fdm-bref-2019
    - rule_id: boundary_downstream_exclusions
      applies_to: "plant-gate result"
      rule: "Exclude distribution, retail, consumer storage and use, and end-of-life after the plant gate unless the study explicitly expands the boundary and reports that expansion separately."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_representative_identity
      applies_to: "reference flow"
      rule: "The verified category-labelled vinegar flow is only a representative product form. A package for a substitute or another materially different form must select a matching real flow when available and disclose any remaining proxy."
      source_ids:
        - unsd-cpc-v3-2025
        - eu-commission-2016-263
        - us-fda-cpg-562-100
