measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure conforming net edible product mass after the last in-scope finishing step and before adding packaging mass; reconcile scales to batch release and packed-unit net-content records."
  - id: ingredient_mass
    applies_to: "Ingredients, media constituents, cells, scaffolds, processing aids, cleaning chemicals and packaging"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record actual received or issued mass on an as-used basis and declare moisture, concentration or solids basis whenever it changes interpretation or mass balance."
  - id: water_mass
    applies_to: "Process water, formulation water, media water and cleaning water"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record metered or batch-calculated water by use; do not merge ingredient water, process water and cleaning water when route decisions require them separately."
  - id: energy_carrier_units
    applies_to: "Electricity, thermal energy, cooling and fuels"
    required_property_ref:
      name: "Carrier-specific property verified against the selected Tiangong flow"
      uuid: ""
    required_unit: "kWh, MJ or carrier mass/volume converted with a documented factor"
    rule: "Preserve original meter or invoice units, conversion factors and allocation to the production campaign; never treat search ranking as identity evidence for the selected energy flow."
  - id: waste_and_coproduct_mass
    applies_to: "Solid residues, off-spec product, spent biomass, spent media constituents, packaging scrap and saleable co-products"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure by destination and material state; wet and dry masses shall not be mixed without a documented moisture conversion."
process_map:
  - id: material_preparation
    name: "Material receipt and preparation"
    inclusion: "required"
    inclusion_condition: "Always; depth depends on whether isolates, flours, whole ingredients, cells, media or scaffolds are purchased or prepared in-house"
    role: "Establishes traceable ingredient and culture inputs and their usable prepared state"
    quantitative_reference: "kg prepared material or inoculum transferred to the next route step, reconciled to the campaign"
  - id: plant_conversion
    name: "Plant-based or traditional conversion"
    inclusion: "conditional"
    inclusion_condition: "Include for plant, pulse, cereal, vegetable, nut or starch routes, including tofu, tempeh, seitan, extrusion, shear, mixing or forming routes"
    role: "Converts prepared plant materials into a structured, coagulated, fermented, washed or formulated substitute intermediate"
    quantitative_reference: "kg conforming plant-route intermediate"
  - id: cultivated_cell_production
    name: "Cultivated-cell production and tissue formation"
    inclusion: "conditional"
    inclusion_condition: "Include for grown-lab or cultivated meat; include only the stages physically performed within the declared foreground"
    role: "Expands and differentiates cells or forms tissue through media preparation, proliferation, maturation, scaffolding and harvest"
    quantitative_reference: "kg harvested edible cell or tissue intermediate"
  - id: finishing_and_preservation
    name: "Product formulation, forming, cooking and preservation"
    inclusion: "required"
    inclusion_condition: "Include all operations actually used; individual substeps may be not applicable for products released directly after conversion"
    role: "Produces the conforming edible product and applies route-specific forming, thermal or non-thermal preservation"
    quantitative_reference: "kg conforming net edible product before packaging"
  - id: packaging_and_storage
    name: "Packaging and on-site storage"
    inclusion: "required"
    inclusion_condition: "Always; storage technology follows the declared chilled, frozen, shelf-stable, dry or wet market state"
    role: "Applies packaging and maintains the declared state through the factory gate"
    quantitative_reference: "1 kg net edible product at the factory gate, with packaging reported separately"
  - id: facility_support
    name: "Utilities, cleaning and residuals management"
    inclusion: "required"
    inclusion_condition: "Always for directly controlled operations; allocate only after submetering or physical assignment is exhausted"
    role: "Captures cleaning, line changeover, common utilities, wastewater, waste handling and direct emissions"
    quantitative_reference: "Support consumption assigned to the campaign and normalized to 1 kg net product"
