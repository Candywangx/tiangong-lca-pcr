allocation_rules:
  - rule_id: allocation_separate_routes
    applies_to: "Distinct products, routes, lines and campaigns"
    rule: "Keep plant/traditional and cultivated routes, different product formats and separately metered campaigns as distinct process records; do not average them merely because they use the same category-level reference flow."
    source_ids:
      - un-cpc-3-23998
      - eu-environmental-footprint-2021
  - rule_id: allocation_avoid
    applies_to: "Multi-output or shared processes"
    rule: "First avoid allocation by process subdivision using line, batch, time, meter or equipment records; use system expansion only when the added function and substituted product system are explicitly justified and consistently modelled."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_physical_relation
    applies_to: "Multi-output process that cannot be subdivided or expanded"
    rule: "Allocate using a documented causal physical relationship, such as independently measured mass, dry matter, energy demand, equipment time or another parameter that explains resource use; do not select mass merely because it is convenient."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_other_relation
    applies_to: "No defensible physical relationship"
    rule: "Use an explicitly justified other relationship, such as economic value, only after documenting why physical allocation is not meaningful; report the factor period, prices or other basis and a sensitivity result against at least one plausible alternative."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_residue_status
    applies_to: "Residues, spent media, off-spec material, rework and saleable outputs"
    rule: "Closed-loop same-campaign rework is an internal transfer, not a co-product. An output sold or used beneficially outside the system shall be assessed as a co-product when it carries a function or value; otherwise record it as waste with its actual treatment and disclose the classification decision."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_shared_support
    applies_to: "Cleaning, refrigeration and common utilities"
    rule: "Assign shared support consumption first by submetering or causal operating records; only the unresolved remainder may follow the selected allocation hierarchy, with the unallocated total and reconciliation disclosed."
    source_ids:
      - eu-environmental-footprint-2021
      - codex-cxc-1-1969-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_batch
      process_id: "material_preparation"
      flow_role: "Purchased and prepared materials, cells, media, scaffolds, water and preparation residues"
      record_type: "Receiving, inventory issue, recipe, scale, concentration and transfer records"
      raw_fields: "lot_id; supplier; material_identity; route_role; received_mass; issued_mass; returns; moisture_or_solids; concentration; prepared_output_mass; reject_mass; destination"
      collection_method: "Reconcile receiving and inventory movements to batch sheets and calibrated scale or meter records"
      unit: "kg and declared concentration basis"
      frequency: "Each lot and batch"
      temporal_coverage: "All campaigns in the reference period"
      site_scope: "Every in-scope facility and preparation line"
      aggregation_rule: "Sum accepted consumption after stock change and returns; preserve lot-level traceability before normalization"
      quality_evidence: "Calibration records; supplier specifications; lot certificates; inventory reconciliation; batch sign-off"
    - protocol_id: cp_plant_conversion_batch
      process_id: "plant_conversion"
      flow_role: "Plant-route material, utilities, intermediate and residuals"
      record_type: "Recipe, batch, fermentation, extrusion, cooking, drying, water and utility records"
      raw_fields: "batch_id; route; equipment_id; input_mass; process_water; electricity; thermal_energy; time; temperature; pressure; moisture; intermediate_mass; reject_mass; wastewater"
      collection_method: "Use batch sheets and submeters; retain the actual operation sequence and settings relevant to technology identity"
      unit: "kg, kWh, MJ, h and route-specific settings"
      frequency: "Each batch; continuous meters at shift or campaign resolution"
      temporal_coverage: "All plant-route campaigns in the reference period"
      site_scope: "Each included plant-conversion line"
      aggregation_rule: "Aggregate like products and technologies only; divide by conforming intermediate output"
      quality_evidence: "Meter calibration; batch release; moisture tests; production log; waste tickets"
    - protocol_id: cp_cultivated_batch
      process_id: "cultivated_cell_production"
      flow_role: "Cells, media, scaffolds, gases, utilities, harvested tissue, spent media and residuals"
      record_type: "Cell-bank, media-recipe, bioreactor, harvest, cleaning and batch-release records"
      raw_fields: "culture_lot; species; tissue_or_cell_type; cell_bank_input; media_component_mass; water; gas; scaffold_mass; vessel_volume; electricity; heat; cooling; culture_time; harvest_mass; moisture_or_solids; spent_media; reject_biomass"
      collection_method: "Link qualified cell-bank and media lots to equipment logs, submeters and harvest measurements"
      unit: "kg, kWh, MJ, m3, h and declared cell or solids basis"
      frequency: "Each culture and harvest lot"
      temporal_coverage: "All cultivated-route campaigns in the reference period"
      site_scope: "Each included culture, differentiation, maturation and harvest system"
      aggregation_rule: "Preserve stage-level data; aggregate only identical route and equipment states before normalization"
      quality_evidence: "Cell-bank qualification; media lot records; sensor calibration; sterility and release records; mass balance"
    - protocol_id: cp_finishing_batch
      process_id: "finishing_and_preservation"
      flow_role: "Formulation inputs, finishing utilities, conforming product and residues"
      record_type: "Recipe, scale, forming, cooking, preservation, cooling, release and rework records"
      raw_fields: "batch_id; intermediate_mass; ingredient_mass; water; energy; process_time; temperature_or_pressure; conforming_net_mass; rework; off_spec_mass; moisture; release_status"
      collection_method: "Reconcile issued ingredients and equipment records to calibrated net-product mass and quality release"
      unit: "kg, kWh, MJ, h and process-specific settings"
      frequency: "Each finishing batch"
      temporal_coverage: "All finishing campaigns in the reference period"
      site_scope: "Each included finishing line"
      aggregation_rule: "Normalize only released net edible product; deduct packaging and unresolved hold stock"
      quality_evidence: "Calibration; recipe control; process log; release certificate; rework and reject disposition"
    - protocol_id: cp_packaging_storage
      process_id: "packaging_and_storage"
      flow_role: "Packaging, packed units, on-site storage energy, refrigerant and storage loss"
      record_type: "Packaging issue, packed-unit, warehouse, refrigeration and inventory records"
      raw_fields: "packaging_item; packaging_mass; units_packed; net_mass_per_unit; storage_state; storage_time; electricity; refrigerant_makeup; damaged_units; expired_units"
      collection_method: "Reconcile packaging inventory and packed counts; meter storage energy or calculate from verified equipment and occupancy records"
      unit: "kg, count, kWh, h or day"
      frequency: "Each packaging run; storage meters at least monthly"
      temporal_coverage: "Complete residence through the gate for all reference-period production"
      site_scope: "Each packaging line and on-site warehouse used"
      aggregation_rule: "Allocate storage by verified mass-time or pallet-time only when direct batch metering is unavailable"
      quality_evidence: "Net-content checks; packaging specifications; meter records; refrigerant service log; stock reconciliation"
    - protocol_id: cp_support_utilities
      process_id: "facility_support"
      flow_role: "Shared utilities, cleaning agents, wastewater, support waste and direct emissions"
      record_type: "Utility invoice and meter, sanitation, wastewater, waste-transfer and emissions records"
      raw_fields: "meter_id; start_reading; end_reading; fuel; water; detergent; disinfectant; cleaning_time; wastewater; sludge; waste_mass; destination; direct_emission; factor_source"
      collection_method: "Use submeters and sanitation logs first; reconcile facility totals to assigned and unassigned consumption"
      unit: "Carrier-specific unit, kg, m3, kWh or MJ"
      frequency: "Meter reading by shift, campaign or month; sanitation by event"
      temporal_coverage: "Complete reference period including shutdown and changeover associated with production"
      site_scope: "Entire facility with line-level separation where possible"
      aggregation_rule: "Assign causally to lines/campaigns, then allocate only the unresolved balance under section 7"
      quality_evidence: "Meter calibration; invoices; sanitation verification; discharge report; waste manifest; emissions calculation record"
    - protocol_id: cp_waste_coproduct
      process_id: "all_processes"
      flow_role: "Waste, rework, residues and co-products"
      record_type: "Weigh-ticket, container, transfer, sale and treatment records"
      raw_fields: "flow_identity; source_process; wet_mass; dry_mass_or_moisture; rework_destination; external_destination; revenue_or_function; treatment; transport_record"
      collection_method: "Measure by flow and destination; verify any conversion from count or volume"
      unit: "kg with moisture basis; destination-specific service unit where applicable"
      frequency: "Each transfer or shipment"
      temporal_coverage: "Complete reference period"
      site_scope: "All in-scope processes and contractors"
      aggregation_rule: "Reconcile generated, internally reworked, externally transferred and stored quantities without double counting"
      quality_evidence: "Weighbridge or calibrated scale; transfer manifest; invoice; treatment certificate; stock reconciliation"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "Reference product"
      rule: "net_product_mass = sum(released_unit_net_mass) - returned_or_rejected_net_mass; packaging mass is excluded"
      inputs:
        - "released unit count"
        - "verified net mass per unit"
        - "bulk release mass"
        - returns
        - rejects
      output: "kg conforming net edible product"
      source_ids:
        - codex-cxc-1-1969-2022
    - id: calc_normalized_inventory
      applies_to: "Every foreground flow"
      rule: "normalized_amount = campaign_flow_amount / conforming_net_product_mass; multiply by 1 kg reference flow"
      inputs:
        - "collected campaign flow amount"
        - "conforming net product mass"
        - "unit conversion"
      output: "flow amount per 1 kg net edible product"
      source_ids:
        - eu-environmental-footprint-2021
    - id: calc_stock_adjusted_input
      applies_to: "Purchased materials and packaging"
      rule: "consumed_mass = opening_stock + receipts - closing_stock - verified_returns; separately identify abnormal loss"
      inputs:
        - "stock and receiving records"
        - returns
        - "abnormal loss"
      output: "kg consumed material by campaign or period"
      source_ids:
        - eu-environmental-footprint-2021
    - id: calc_mass_balance
      applies_to: "Each process and total foreground"
      rule: "balance_gap = total_mass_inputs - total_mass_outputs - measured_direct_mass_emissions; water incorporation, evaporation, wastewater, stock change and moisture-basis conversions shall be explicit"
      inputs:
        - "all mass inputs"
        - products
        - co-products
        - wastes
        - wastewater
        - "mass emissions"
        - "stock change"
        - "moisture conversions"
      output: "signed kg gap and percent of input mass, reported without an invented pass threshold"
      source_ids:
        - eu-environmental-footprint-2021
    - id: calc_shared_support
      applies_to: "Facility support"
      rule: "assigned_support = directly_metered_support + unresolved_support × documented_allocation_factor; allocation factors shall sum to one across recipients"
      inputs:
        - "facility total"
        - "direct meters"
        - "operating records"
        - "allocation basis"
      output: "assigned utility or support amount per campaign"
      source_ids:
        - eu-environmental-footprint-2021
    - id: calc_allocation_factor
      applies_to: "Multi-output process"
      rule: "factor_i = documented_physical_or_other_basis_i / sum(documented_basis_all_outputs); apply the same factor to only those inseparable inputs and outputs and preserve unallocated direct records"
      inputs:
        - "co-product quantities"
        - "causal basis"
        - "price or other basis where approved"
      output: "allocation factor and allocated inventory by output"
      source_ids:
        - eu-environmental-footprint-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and all route intermediates"
      requirement: "Preserve actual product name, route family, ingredient or species/tissue basis, format, composition or recipe version, moisture or solids basis, market state, storage class and production technology; category-level flow identity alone is insufficient."
      evidence: "Product specification; recipe version; cell-bank or ingredient specification; batch release; required qualifiers"
    - id: dq_technological_representativeness
      applies_to: "Foreground processes"
      requirement: "Data shall represent the actual equipment, route and purchased-versus-in-house preparation used for the declared product; plant/traditional and cultivated routes shall not be pooled."
      evidence: "Process flow diagram confirmed on site; equipment list; batch records; technology-specific meter data"
    - id: dq_temporal_coverage
      applies_to: "Foreground activity data"
      requirement: "Use the most recent complete representative annual administration period where normal continuous production exists; for seasonal, pilot or campaign production, include all relevant campaigns and disclose the shorter coverage, utilization and scale-up limitations."
      evidence: "Dated meter, invoice, batch and production records; campaign list; representativeness statement"
    - id: dq_geographical_coverage
      applies_to: "Foreground and upstream datasets"
      requirement: "Identify every foreground site and select upstream datasets matching supplier geography and technology where available; disclose proxy geography and its materiality."
      evidence: "Site list; supplier origin; upstream dataset metadata; proxy and sensitivity record"
    - id: dq_measurement_traceability
      applies_to: "Mass, energy, water, process conditions and direct emissions"
      requirement: "Retain original readings, units, conversion factors, calibration or verification evidence and responsible record owner; calculated data shall link to collected inputs and a calculation rule."
      evidence: "Meter exports; calibrated scale records; laboratory records; invoices; formula audit trail"
    - id: dq_completeness
      applies_to: "All in-scope processes"
      requirement: "Include all known inputs and outputs for directly controlled processes, including cleaning, changeover, storage, wastewater, waste and direct emissions; identify data gaps and proxies and do not apply an undocumented cut-off."
      evidence: "Completed flow checklist; mass and utility reconciliations; waste manifests; gap register"
    - id: dq_food_safety_and_lot_traceability
      applies_to: "Food production and release records"
      requirement: "Preserve lot identification, monitoring, corrective action, cleaning verification and product-release evidence needed to confirm that inventory records correspond to conforming product rather than rejected or unsafe output."
      evidence: "HACCP/GHP records; lot tracing; sanitation verification; corrective action; release status"
    - id: dq_cultivated_route_transparency
      applies_to: "Cultivated-cell datasets"
      requirement: "Confidentiality may mask proprietary names in public presentation but shall not remove material categories, quantities, source species/tissue, media function, scaffold status, energy, water, residuals or upstream coverage from the auditable data package."
      evidence: "Confidential audit annex; mass balance; media bill of materials; culture and harvest records"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The output uses a Tiangong flow read back as a public Product flow; the category fallback UUID is f072db26-a3e4-4979-b9ad-d883d280bfe6, Mass is 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass is 93a60a57-a4c8-11da-a746-0800200c9a66, and the normalized net edible output is exactly 1 kg excluding packaging."
    source_ids:
      - un-cpc-3-23998
  - rule_id: validate_specific_flow_preference
    applies_to: "Product identity"
    rule: "If a more specific public Tiangong product flow semantically matches the actual product, it replaces the category fallback only after CLI readback; otherwise all required qualifiers accompany the category flow and no single route is implied."
    source_ids:
      - un-cpc-3-23998
  - rule_id: validate_scope_and_route
    applies_to: "Product and process map"
    rule: "The actual product falls within the covered category, excluded meal or ingredient-only products are absent, and exactly the applicable plant/traditional or cultivated route operations are included without route averaging."
    source_ids:
      - un-cpc-3-23998
      - gfi-plant-meat-manufacturing-2019
      - fao-who-cell-based-food-2023
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "All required qualifiers are present and consistent across product specification, reference-flow comment, process records and published metadata."
    source_ids:
      - un-cpc-3-23998
  - rule_id: validate_mass_reconciliation
    applies_to: "Each process and total foreground"
    rule: "Inputs, products, co-products, internal rework, wastes, wastewater, direct mass emissions and stock change are reconciled on consistent moisture or solids bases; the signed gap and explanation are reported without silently forcing balance."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: validate_utility_completeness
    applies_to: "All foreground processes"
    rule: "Electricity, fuels, heating, cooling, water, refrigeration, cleaning and shared support are present where used, and facility totals reconcile to directly assigned plus allocated amounts."
    source_ids:
      - eu-environmental-footprint-2021
      - codex-cxc-1-1969-2022
  - rule_id: validate_residual_destinations
    applies_to: "Waste, spent media, residues and off-spec outputs"
    rule: "Every residual has a measured or calculated quantity, moisture state where relevant, internal rework status and external treatment or destination; waste and co-product classification is not chosen to manipulate allocation."
    source_ids:
      - codex-cxc-1-1969-2022
      - eu-environmental-footprint-2021
  - rule_id: validate_allocation
    applies_to: "Multi-output and shared processes"
    rule: "The dataset shows the allocation hierarchy, basis, factors and recipients; subdivision or expansion is considered first, causal physical allocation is preferred next, and any other relationship has an alternative-basis sensitivity result."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: validate_collection_links
    applies_to: "Foreground inventory rows"
    rule: "Each foreground-record or calculated-from-collection row links to an applicable collection protocol, original records and any calculation rule; unsupported estimates are not presented as measured values."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: validate_food_release_alignment
    applies_to: "Conforming reference product"
    rule: "Lot, sanitation, monitoring, corrective-action and release records demonstrate that the inventory denominator is conforming released product and that rejected product is recorded separately."
    source_ids:
      - codex-cxc-1-1969-2022
  - rule_id: validate_boundary_disclosure
    applies_to: "Published dataset"
    rule: "Purchased-versus-in-house intermediates, upstream datasets, proxies, exclusions, post-gate extensions, packaging convention and reference period are disclosed and consistent with the foreground model."
    source_ids:
      - eu-environmental-footprint-2021
published_dataset_profile:
  dataset_role: "Foreground production dataset for one declared meatless meat or meat-substitute product and route"
  downstream_use: "May be published as a secondary_dataset and used as a background_dataset only for products whose required qualifiers and factory-gate boundary match"
  allowed_use: "Mass-normalized factory-gate inventories, process datasets and lifecycle-model inputs for the declared product, route, technology, geography, market state, packaging and reference period"
  excluded_use: "Unqualified category averages; automatic substitution across plant/traditional, cultivated and conventional meat routes; nutritional or comparative claims based only on 1 kg mass; ingredient-only protein datasets; prepared-meal datasets; post-gate use without explicit extension"
  required_metadata: "Canonical PCR id and version; actual product name; all required qualifiers; facility geography; reference period; route process map; purchased-versus-in-house intermediates; upstream dataset identities; net-mass convention; packaging; allocation; cut-offs or gaps; proxy register"
  required_quality_disclosure: "Foreground and upstream temporal, technological and geographical representativeness; meter and mass-balance coverage; allocation sensitivity; proxy and confidentiality treatment; route-specific limitations; completeness of cleaning, storage, wastewater, waste and direct emissions"
  update_trigger: "Recipe, principal ingredient, source species/tissue or cell line, media or scaffold system, production route, equipment scale, preservation method, market state, packaging, supplier geography, allocation basis, facility boundary or reference-flow identity changes materially"
