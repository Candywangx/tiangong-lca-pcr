system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary contains the feed-mill operations from ingredient reception to dispatch: reception, weighing and storage of feed materials and additives; conditional grinding; batching and mixing; conditional conditioning, pelleting or extrusion; conditional cooling and screening; and packaging or bulk loading. Included foreground flows are ingredient and additive inputs, electricity, boiler fuel, process and boiler-feed water, internal-logistics fuel, packaging materials, direct dust emissions to air, and waste outputs leaving the mill boundary."
      source_ids: []
    - rule_id: bound_start
      applies_to: "foreground_system_boundary"
      rule: "The foreground starts at the feed-mill receiving gate; every feed material, additive, and packaging item is recorded as it crosses that gate, with quantity and formulation linkage."
      source_ids: []
    - rule_id: bound_upstream
      applies_to: "foreground_system_boundary"
      rule: "Ingredient cultivation and processing, inbound transport, energy and water supply, and packaging production are included only through linked upstream datasets whose identity and version are declared; no upstream burden may be approximated inside the foreground inventory."
      source_ids: []
    - rule_id: bound_recycle
      applies_to: "foreground_system_boundary"
      rule: "Internal rework, fines, and start-up or off-spec material returned to the same mill line are closed-loop internal recycles and are not counted as new inputs or as waste; only material actually leaving the mill boundary is recorded as a waste output."
      source_ids: []
    - rule_id: bound_exclusions
      applies_to: "foreground_system_boundary"
      rule: "Capital goods, mill maintenance materials, personnel-related flows, and delivery transport beyond the dispatch gate are excluded from the foreground and must be listed in the disclosure when a study includes them."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Feed materials, feed additives, and packaging materials of a declared formulation are received at the feed-mill gate and released for production"
  starting_condition_role: "Declared foreground starting point for first-dataset production"
  product_classification_scope: "CPC 3.0 leaf 23319 compound feed n.e.c.; sibling leaves 23311 and 23312 are out of scope"
  recursive_input_rule: "When a mill output or rework stream of the same product category re-enters the same foreground system, it is recorded as internal recycle with no new upstream burden; purchased compound feed used as an ingredient is recorded as a product input with its own declared upstream dataset"
  upstream_dataset_requirement: "Every product input crossing the receiving gate must be paired with a declared upstream dataset identity; feed ingredient datasets should follow the FAO LEAP feed guidelines or PEFCR-conformant sources such as the GFLI database"
  disclosure: "The data package discloses formulation classes, inclusion rates by class, moisture basis, dispatch form, and every exclusion from the foreground boundary"
