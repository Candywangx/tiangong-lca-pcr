allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The feed-mill foreground is a single-product-per-batch operation; co-production inside the mill boundary is limited to internal recycle and waste streams. Allocation of ingredient co-production burdens, such as soybean meal versus soybean oil, is resolved inside the linked upstream datasets and is not re-allocated in the foreground."
    source_ids: []
  - rule_id: alloc_line_split
    applies_to: "foreground_burden_allocation"
    rule: "When a mill produces several formulations in the same period, shared electricity, fuel, water, and overhead flows are split between formulations in proportion to produced mass per formulation, using production-run or sub-meter records where available."
    source_ids: []
  - rule_id: alloc_rework
    applies_to: "foreground_burden_allocation"
    rule: "Fines, rework, and off-spec material returned to the same line carry no additional upstream burden; only net material leaving the boundary is inventoried."
    source_ids: []
  - rule_id: alloc_waste_cutoff
    applies_to: "foreground_burden_allocation"
    rule: "Waste outputs carry foreground burden up to the mill boundary only; treatment or valorisation burdens and credits belong to the declared downstream dataset."
    source_ids: []
  - rule_id: alloc_upstream_coproducts
    applies_to: "foreground_burden_allocation"
    rule: "Co-product allocation for feed materials, including oilseed meals and milling fractions, follows the upstream dataset and should be consistent with the FAO LEAP feed guidelines and the PEFCR feed rules; the foreground dataset must declare which allocation its ingredient datasets apply."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_ingredient_receipts
      process_id: "ingredient_reception_storage"
      flow_role: "feed material inputs"
      record_type: "weighbridge and goods-receipt records"
      raw_fields: "ingredient class, supplier, received mass, moisture on receipt, linked formulation"
      collection_method: "calibrated weighbridge and receipt system"
      unit: "kg"
      frequency: "per consignment"
      temporal_coverage: "12 months"
      site_scope: "feed mill site"
      aggregation_rule: "sum per ingredient class per formulation, normalized per 1,000 kg output"
      quality_evidence: "weighbridge calibration certificate, supplier delivery notes"
    - protocol_id: cp_micro_ingredient_dosing
      process_id: "batching_mixing"
      flow_role: "micro-ingredient and additive inputs"
      record_type: "batch dosing records"
      raw_fields: "premix, amino acid, salt, mineral dose per batch, batch count"
      collection_method: "batch control system or manual dosing log"
      unit: "kg"
      frequency: "per batch"
      temporal_coverage: "12 months"
      site_scope: "feed mill site"
      aggregation_rule: "sum per formulation, normalized per 1,000 kg output"
      quality_evidence: "batch reports, dosing scale calibration"
    - protocol_id: cp_electricity_meters
      process_id: "all_processes"
      flow_role: "electricity inputs"
      record_type: "utility meter and sub-meter records"
      raw_fields: "kWh per meter and period, duty assignment rules"
      collection_method: "utility invoices plus sub-meter or operating-hour assignment"
      unit: "kWh"
      frequency: "monthly"
      temporal_coverage: "12 months"
      site_scope: "feed mill site"
      aggregation_rule: "mill total split by duty per process map"
      quality_evidence: "meter certificates, utility invoices"
    - protocol_id: cp_fuel_logs
      process_id: "conditioning_pelleting_ingredient_reception_storage"
      flow_role: "boiler fuel and internal diesel"
      record_type: "fuel meter and issue records"
      raw_fields: "gas volume per period, diesel issued per vehicle or duty"
      collection_method: "gas utility meter, fuel-issue log"
      unit: "m3; kg"
      frequency: "monthly"
      temporal_coverage: "12 months"
      site_scope: "feed mill site"
      aggregation_rule: "per duty, normalized per process output basis"
      quality_evidence: "meter certificates, fuel invoices"
    - protocol_id: cp_water_meters
      process_id: "conditioning_pelleting"
      flow_role: "boiler feed water"
      record_type: "water meter records"
      raw_fields: "make-up water volume per period"
      collection_method: "site or line water meter"
      unit: "kg"
      frequency: "monthly"
      temporal_coverage: "12 months"
      site_scope: "feed mill site"
      aggregation_rule: "per 1,000 kg conditioned feed"
      quality_evidence: "meter records, water invoices"
    - protocol_id: cp_packaging_records
      process_id: "packaging_dispatch"
      flow_role: "packaging inputs"
      record_type: "packaging stock and usage records"
      raw_fields: "bag type, bags used, nominal fill mass"
      collection_method: "stores issue records and packing-line counters"
      unit: "items"
      frequency: "monthly"
      temporal_coverage: "12 months"
      site_scope: "feed mill site"
      aggregation_rule: "items per 1,000 kg bagged output"
      quality_evidence: "supplier specifications, stock reconciliation"
    - protocol_id: cp_production_output
      process_id: "packaging_dispatch"
      flow_role: "reference product output"
      record_type: "dispatch and packing records"
      raw_fields: "formulation, dispatched mass, form, bag count or bulk volume"
      collection_method: "dispatch weighbridge and packing records"
      unit: "kg"
      frequency: "per batch or daily"
      temporal_coverage: "12 months"
      site_scope: "feed mill site"
      aggregation_rule: "sum per formulation per period"
      quality_evidence: "calibrated scale records, sales dispatch notes"
    - protocol_id: cp_waste_records
      process_id: "ingredient_reception_storage_packaging_dispatch"
      flow_role: "waste outputs"
      record_type: "waste transfer records"
      raw_fields: "waste stream, mass, destination contractor"
      collection_method: "waste transfer notes or site weighings"
      unit: "kg"
      frequency: "per collection"
      temporal_coverage: "12 months"
      site_scope: "feed mill site"
      aggregation_rule: "per waste stream, normalized per 1,000 kg output"
      quality_evidence: "contractor receipts, transfer notes"
    - protocol_id: cp_dust_records
      process_id: "size_reduction_batching_mixing_conditioning_pelleting_cooling_screening_ingredient_reception_storage"
      flow_role: "dust emissions to air"
      record_type: "stack or fugitive dust records"
      raw_fields: "measured concentration or declared estimate, control device type"
      collection_method: "periodic measurement or declared engineering estimate"
      unit: "kg"
      frequency: "annual"
      temporal_coverage: "12 months"
      site_scope: "feed mill site"
      aggregation_rule: "per emission point, normalized per process output basis"
      quality_evidence: "measurement reports or declared estimate note"
    - protocol_id: cp_moisture_tests
      process_id: "ingredient_reception_storage_packaging_dispatch"
      flow_role: "moisture qualifiers"
      record_type: "laboratory moisture tests"
      raw_fields: "moisture percent per ingredient lot and per product lot"
      collection_method: "oven or rapid moisture analyser per in-house method"
      unit: "%"
      frequency: "per lot"
      temporal_coverage: "12 months"
      site_scope: "feed mill site"
      aggregation_rule: "lot average per formulation"
      quality_evidence: "laboratory records"
  calculation_rules:
    - id: calc_output_mass
      applies_to: "reference product"
      rule: "dispatched formulation mass = sum of dispatch weighbridge records per formulation over the 12-month period"
      inputs:
        - cp_production_output
      output: "kg output per formulation"
      source_ids: []
    - id: calc_ingredient_intensity
      applies_to: "feed material inputs"
      rule: "ingredient intensity = annual consignment mass per ingredient class divided by annual formulation output"
      inputs:
        - cp_ingredient_receipts
        - calc_output_mass
      output: "kg ingredient per 1,000 kg output"
      source_ids: []
    - id: calc_mass_closure
      applies_to: "foreground balance"
      rule: "mass closure = (sum of ingredient, additive, and packaging inputs) minus (dispatched product plus waste outputs plus declared dust), reported as percent of input mass"
      inputs:
        - cp_ingredient_receipts
        - cp_micro_ingredient_dosing
        - cp_production_output
        - cp_waste_records
        - cp_dust_records
      output: "closure percent"
      source_ids: []
    - id: calc_specific_electricity
      applies_to: "electricity inputs"
      rule: "process electricity intensity = assigned kWh per process divided by process output over the period"
      inputs:
        - cp_electricity_meters
      output: "kWh per 1,000 kg process output"
      source_ids:
        - lpelc-feed-processing-energy
    - id: calc_specific_gas
      applies_to: "natural gas input"
      rule: "boiler gas intensity = metered gas volume divided by conditioned feed mass over the period"
      inputs:
        - cp_fuel_logs
      output: "m3 per 1,000 kg conditioned feed"
      source_ids: []
    - id: calc_dry_matter
      applies_to: "reference product and feed materials"
      rule: "dry matter = as-fed mass multiplied by (1 minus moisture fraction); reported alongside, never instead of, as-fed amounts"
      inputs:
        - cp_moisture_tests
      output: "kg dry matter"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "whole dataset"
      requirement: "Formulation classes, inclusion rates by class, target animal class, and feed form are declared for every produced formulation"
      evidence: "formulation register linked to production runs"
    - id: dq_measurement
      applies_to: "meters and scales"
      requirement: "Weighbridges, dosing scales, and utility meters are calibrated; calibration status is documented for the collection period"
      evidence: "calibration certificates or maintenance log"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Records cover a continuous 12-month period not older than five years at dataset publication"
      evidence: "dated records per protocol"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "All formulation inputs are recorded; mass closure per calc_mass_closure stays within 98 to 102 percent of input mass"
      evidence: "closure calculation per campaign"
    - id: dq_disclosure
      applies_to: "data package"
      requirement: "Required qualifiers, exclusions, upstream dataset identities, and allocation declarations are complete"
      evidence: "disclosure section of the data package"
validation_rules:
  - rule_id: val_mass_balance
    applies_to: "foreground_dataset_conformance"
    rule: "A foreground data package is rejected when mass closure per calc_mass_closure falls outside 98 to 102 percent of input mass without a documented explanation."
    source_ids: []
  - rule_id: val_energy_guardrail
    applies_to: "foreground_dataset_conformance"
    rule: "Grinding and pelleting electricity outside their QA guardrail ranges, or combined mill energy outside 40 to 60 kWh per 1,000 kg feed, must be justified by meter evidence or corrected before acceptance."
    source_ids: []
  - rule_id: val_identity_refs
    applies_to: "foreground_dataset_conformance"
    rule: "Every inventory row marked with a Tiangong UUID must carry that UUID in the data package; rows with substituted ingredient flows must declare the substitute flow identity."
    source_ids: []
  - rule_id: val_qualifiers
    applies_to: "foreground_dataset_conformance"
    rule: "A data package missing any required qualifier of section 3 is incomplete and fails validation."
    source_ids: []
  - rule_id: val_conditional_processes
    applies_to: "foreground_dataset_conformance"
    rule: "Conditional processes omitted from the inventory must be justified by the declared feed form; pelleted, crumbled, or extruded feed may not omit conditioning_pelleting and cooling_screening."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for industrial compound feed manufacture"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Linked as the foreground mill dataset in feed, livestock, aquaculture, and food LCA models; usable as background dataset for compound feed supply"
  excluded_use: "Not valid for pet food, lucerne meal, single feed materials, medicated feed, or farm-level feeding; not valid when required qualifiers or validation rules fail"
  required_metadata: "Required qualifiers of section 3, upstream dataset identities, allocation declarations, temporal coverage, site and country"
  required_quality_disclosure: "Mass closure result, guardrail checks of section 9, measurement and calibration evidence summary, provisional ranges actually used"
  update_trigger: "Reformulation beyond declared classes, process-line change, energy carrier switch, or records older than five years"
data_sources:
  - id: "fao-leap-2016-feed-supply-chains"
    type: "official_guidance"
    reference: "FAO LEAP Partnership (2016), Environmental performance of animal feeds supply chains: Guidelines for assessment, http://www.fao.org/partnerships/leap/publications/en/ (retrieved 2026-07-25)"
    used_for: "method rule; process decomposition; boundary decisions; upstream dataset requirement"
  - id: "ec-pefcr-feed-food-producing-animals"
    type: "standard"
    reference: "European Commission (2018, updated 2025), Product Environmental Footprint Category Rules (PEFCR) for feed for food-producing animals, https://www.fefac.eu/priorities/sustainability/pefcr-feed/ (retrieved 2026-07-25)"
    used_for: "method rule; data collection rules; allocation decisions"
  - id: "eu-reg-767-2009-feed-marketing"
    type: "standard"
    reference: "Regulation (EC) No 767/2009 on the placing on the market and use of feed, https://eur-lex.europa.eu/eli/reg/2009/767/oj (retrieved 2026-07-25)"
    used_for: "official product specification; category boundary"
  - id: "gfli-database"
    type: "dataset"
