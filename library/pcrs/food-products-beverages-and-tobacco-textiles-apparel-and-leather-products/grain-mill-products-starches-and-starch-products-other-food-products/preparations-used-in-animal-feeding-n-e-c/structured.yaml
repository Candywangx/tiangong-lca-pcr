measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reference flow and all ingredient inputs are recorded on an as-fed mass basis in kg; volumes or counts must be converted with declared, calibrated mass conversion records."
  - id: moisture_declaration
    applies_to: "reference product and feed materials"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Moisture content of the dispatched feed and of each major feed material must be declared; dry-matter corrections, when applied, must be reported as separate calculated values and never silently substituted for as-fed amounts."
  - id: electricity_measure
    applies_to: "all electricity inputs"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "kWh"
    rule: "Electricity is recorded in kWh from metered supplies; conversion to MJ, when required by a study, uses 1 kWh = 3.6 MJ and is reported as a calculated value."
