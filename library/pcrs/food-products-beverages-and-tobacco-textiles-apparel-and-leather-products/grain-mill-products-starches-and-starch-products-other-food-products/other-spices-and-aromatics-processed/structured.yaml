allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "separable products, routes, and lots"
    rule: "First subdivide processes and use product-, route-, lot-, and meter-specific records so that allocation is avoided."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework
    applies_to: "rework returned to the same product route"
    rule: "Return reworked material to the same route by mass balance and do not count it as both waste output and virgin input."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recovered_material
    applies_to: "residues sold or used outside the product system"
    rule: "Treat a residue as a co-product only when it has a documented use and market; disclose the decision and apply a physical causal relation where demonstrable, otherwise mass allocation with sensitivity to economic allocation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_support
    applies_to: "shared sanitation, storage, and utilities"
    rule: "Allocate shared support burdens by measured causal drivers such as equipment time, storage-days, metered energy, water, or cleaned surface; use processed mass only when no better causal driver exists and disclose the choice."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "receiving_cleaning_drying_conditioning_size_reduction_packaging"
      flow_role: "material inputs, intermediates, and saleable output"
      record_type: "weighbridge, scale, moisture, and batch record"
      raw_fields: "lot_id; product_identity; gross_mass; tare_mass; net_mass; moisture_or_solids; timestamp"
      collection_method: "calibrated scales and representative moisture test"
      unit: "kg; % wet basis or % solids"
      frequency: "every lot and process hand-off"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "all included lines and sites"
      aggregation_rule: "sum net masses by product route and reconcile inputs, outputs, moisture change, and stocks"
      quality_evidence: "calibration certificates; batch sheets; moisture laboratory records"
    - protocol_id: cp_recipe_records
      process_id: "blending_paste"
      flow_role: "every formulation ingredient and formulated output"
      record_type: "approved recipe and batch dosing record"
      raw_fields: "batch_id; ingredient_identity; supplier_lot; target_mass; actual_mass; output_mass; rework_mass"
      collection_method: "calibrated dosing and batch reconciliation"
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "all included mixers and sites"
      aggregation_rule: "sum actual ingredient mass and output by recipe; no ingredient may remain under a collective label"
      quality_evidence: "approved recipe; scale calibration; signed batch record"
    - protocol_id: cp_energy_records
      process_id: "all_applicable_processes"
      flow_role: "electricity and steam"
      record_type: "meter, invoice, and operating log"
      raw_fields: "meter_id; opening; closing; unit; process; lot; runtime; steam_mass_or_energy"
      collection_method: "submeter preferred; otherwise documented causal allocation"
      unit: "kWh; MJ; kg steam"
      frequency: "continuous or every batch"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "all included equipment and sites"
      aggregation_rule: "subtract non-production use and allocate by measured driver"
      quality_evidence: "meter calibration; invoices; operating logs"
    - protocol_id: cp_fuel_records
      process_id: "drying_conditioning"
      flow_role: "each fuel"
      record_type: "tank, mass, volume, invoice, and heating-value record"
      raw_fields: "fuel_identity; quantity; unit; LHV_or_HHV; stock_change; process; lot"
      collection_method: "meter or stock balance for each fuel separately"
      unit: "kg; m3; MJ"
      frequency: "every delivery and reporting period"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "all included combustion equipment"
      aggregation_rule: "opening stock + purchases - closing stock, normalized to dried output"
      quality_evidence: "invoices; tank calibration; fuel specification"
    - protocol_id: cp_water_records
      process_id: "receiving_cleaning_microbial_reduction"
      flow_role: "process water and wastewater"
      record_type: "meter and water balance"
      raw_fields: "meter_id; input_volume; condensate; recirculation; wastewater_volume; lot"
      collection_method: "submeter or documented balance"
      unit: "m3"
      frequency: "every batch or daily"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "all included wet operations"
      aggregation_rule: "net make-up and discharge normalized to route output"
      quality_evidence: "meter calibration; discharge log; balance check"
    - protocol_id: cp_packaging_bom
      process_id: "packaging"
      flow_role: "each packaging component"
      record_type: "bill of materials and component weighing"
      raw_fields: "component_id; material; unit_mass; units_used; rejects; product_net_mass"
      collection_method: "supplier specification verified by representative weighing"
      unit: "kg"
      frequency: "each packaging specification and change"
      temporal_coverage: "current package specification"
      site_scope: "every declared package format"
      aggregation_rule: "component unit mass x units consumed, reconciled with scrap"
      quality_evidence: "supplier specification; scale record; approved packaging BOM"
    - protocol_id: cp_waste_records
      process_id: "all_applicable_processes"
      flow_role: "each waste stream"
      record_type: "container weighing and transfer record"
      raw_fields: "waste_identity; mass_or_volume; source_process; destination; treatment; lot; date"
      collection_method: "weigh each segregated stream or use verified container mass"
      unit: "kg; m3"
      frequency: "every removal"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "all included processes and sites"
      aggregation_rule: "sum by atomic waste identity and destination; subtract documented rework"
      quality_evidence: "waste tickets; transporter and treatment records"
    - protocol_id: cp_emission_records
      process_id: "receiving_cleaning_drying_conditioning_size_reduction_microbial_reduction_sanitation"
      flow_role: "each direct air or water emission"
      record_type: "measurement or activity-factor calculation"
      raw_fields: "pollutant_identity; measurement; fuel_or_agent_activity; factor; control_efficiency; method; period"
      collection_method: "stack/effluent measurement preferred; otherwise declared factor calculation"
      unit: "kg"
      frequency: "per permit, campaign, or reporting period"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "every direct release point"
      aggregation_rule: "calculate each pollutant separately and normalize to route output"
      quality_evidence: "laboratory report; factor source; control log; calculation sheet"
    - protocol_id: cp_treatment_records
      process_id: "microbial_reduction"
      flow_role: "treatment inputs and treated output"
      record_type: "treatment batch and provider record"
      raw_fields: "treatment_type; input_mass; output_mass; electricity; steam; agent; absorbed_dose_or_process_parameter; validation_result"
      collection_method: "validated treatment record and release test"
      unit: "kg; kWh; MJ; route-specific parameter"
      frequency: "every treated lot"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "all on-site and outsourced treatment"
      aggregation_rule: "aggregate by treatment route only after identity and parameters match"
      quality_evidence: "validation study; provider certificate; release result"
    - protocol_id: cp_storage_records
      process_id: "storage"
      flow_role: "storage energy, time, throughput, and losses"
      record_type: "inventory, meter, and environmental log"
      raw_fields: "product_mass_in; product_mass_out; storage_days; temperature; humidity; electricity; loss_reason"
      collection_method: "inventory ledger linked to storage-zone meter"
      unit: "kg; day; kWh"
      frequency: "daily or every lot movement"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "every included warehouse or cold room"
      aggregation_rule: "mass-weight energy by storage-days and retain loss cause"
      quality_evidence: "meter record; inventory ledger; temperature/humidity log"
    - protocol_id: cp_refrigerant_records
      process_id: "storage"
      flow_role: "each refrigerant input and emission"
      record_type: "maintenance and equipment record"
      raw_fields: "equipment_id; refrigerant_identity; initial_charge; make_up; recovery; final_charge; service_date"
      collection_method: "refrigerant mass balance by chemical identity"
      unit: "kg"
      frequency: "every service and annually"
      temporal_coverage: "representative 12 months"
      site_scope: "every included refrigeration unit"
      aggregation_rule: "initial + make-up - recovery - final; allocate by refrigerated storage-days"
      quality_evidence: "service invoice; technician log; charge plate"
    - protocol_id: cp_sanitation_records
      process_id: "sanitation"
      flow_role: "cleaning electricity, water, chemical, and wipe inputs"
      record_type: "sanitation log, meter, and dosing record"
      raw_fields: "area_or_equipment; method; electricity; water; chemical_identity; dose; wipe_mass; drying_completion; lot"
      collection_method: "record each cleaning event and chemical separately"
      unit: "kWh; m3; kg"
      frequency: "every cleaning event"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "all product-contact and processing areas"
      aggregation_rule: "allocate by documented causal driver and verify dry restart"
      quality_evidence: "sanitation schedule; dosing record; inspection release"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = route-attributed amount / net saleable product mass at declared moisture or solids basis"
      inputs:
        - "route-attributed amount"
        - "net saleable product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_drying_mass_balance
      applies_to: "drying material balance"
      rule: "reconcile wet input mass, dry output mass, removed water, fines, and stock change using measured moisture; investigate any unexplained residual"
      inputs:
        - "input/output mass and moisture"
        - fines
        - "stock change"
      output: "reconciled dry-matter and water balance"
      source_ids:
        - fao-who-cxc-42-1995
    - id: calc_recipe_balance
      applies_to: "curry powder and paste"
      rule: "sum every separately identified ingredient plus rework and reconcile with formulated output, waste, and stock change"
      inputs:
        - "ingredient masses"
        - rework
        - output
        - waste
        - "stock change"
      output: "recipe mass-balance residual"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_packaging_mass
      applies_to: "each packaging component"
      rule: "packaging mass = verified unit component mass x units consumed / net product mass"
      inputs:
        - "component unit mass"
        - "units consumed"
        - "net product mass"
      output: "kg component/kg net product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_refrigerant_release
      applies_to: "each refrigerant"
      rule: "release = initial charge + make-up - recovered amount - final charge, never combining chemicals"
      inputs:
        - "charge and service records by refrigerant"
      output: "kg refrigerant emitted"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and ingredients"
      requirement: "Botanical species or complete recipe, form, treatment status, and CPC 23929 eligibility are traceable by lot; CPC 01961 and 01962 items are rejected from this PCR."
      evidence: "supplier specification; approved recipe; incoming and release records"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use a representative 12-month period unless a shorter campaign is justified; disclose seasonality, downtime, and abnormal lots."
      evidence: "dated meter, batch, invoice, and production records"
    - id: dq_technology_geography
      applies_to: "utilities and upstream links"
      requirement: "Match electricity, heat, fuels, ingredients, packaging, treatment, and waste datasets to the actual technology, geography, and reference year."
      evidence: "supplier dataset metadata and documented representativeness review"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Reconcile product mass and document every known material, energy, packaging, refrigerant, waste, wastewater, and direct-emission exchange as an atomic row."
      evidence: "signed completeness and mass-balance review"
    - id: dq_measurement
      applies_to: "meters and tests"
      requirement: "Retain calibration, sampling, detection-limit, moisture-method, and uncertainty evidence for material, energy, water, and emissions data."
      evidence: "calibration certificates; laboratory methods; QA records"
    - id: dq_range_gate
      applies_to: "all amount ranges"
      requirement: "No amount range is accepted from a single paper, a single case, or a point value; this PCR currently retains no amount ranges, so concrete data packages must rely on foreground records and calculations."
      evidence: "bilingual PCR range audit and generated projection"
    - id: dq_conditional_pollutants
      applies_to: "direct-fired or smoke drying and direct wastewater discharge"
      requirement: "When these routes exist, test or calculate each applicable PAH, formaldehyde, dioxin, heavy-metal, COD/TOC, suspended-solid, nitrogen, phosphorus, and chloride release separately; do not infer presence for routes where it is absent."
      evidence: "route declaration; stack/effluent tests; calculation records"
validation_rules:
  - rule_id: validate_scope
    applies_to: "product identity"
    rule: "Confirm the product is within the full CPC 23929 inclusion list and is not a CPC 01961 live plant/propagation item or CPC 01962 cut flower/flower article."
    source_ids:
      - un-cpc-3-0-explanatory-notes
  - rule_id: validate_reference
    applies_to: "reference flow"
    rule: "Confirm exactly 1 kg net saleable product, Mass property, kg unit, and all required identity, form, moisture/solids, treatment, package, geography, and year qualifiers."
    source_ids:
      - un-cpc-3-0-explanatory-notes
  - rule_id: validate_route
    applies_to: "process coverage"
    rule: "Confirm every route-applicable step is included and every omitted conditional process has a documented not-applicable reason."
    source_ids:
      - fao-who-cxc-42-1995
      - fao-herb-spice-quality-assurance-1995
  - rule_id: validate_atomic_inventory
    applies_to: "inventory exchanges"
    rule: "Reject collective or selector rows; electricity, steam, each fuel, each ingredient, each cleaning agent, each packaging component, each refrigerant, each waste, wastewater, and each pollutant must be separate."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "material and recipe balances"
    rule: "Reconcile received material or ingredients, intermediates, moisture change, rework, saleable output, waste, and stock change; investigate and disclose residuals."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_hygiene
    applies_to: "product safety and treatment"
    rule: "Verify safe moisture or solids, contamination controls, treatment validation where applied, dry-environment sanitation, packaging protection, and lot traceability."
    source_ids:
      - fao-who-cxc-42-1995
  - rule_id: validate_direct_drying_pollutants
    applies_to: "direct-fired or smoke drying"
    rule: "If combustion gas or smoke can contact product, require route-specific monitoring or calculation for PAH and other applicable direct-drying contaminants and disclose controls; otherwise record the route as not applicable."
    source_ids:
      - fao-who-cxc-68-2009
  - rule_id: validate_mycotoxin_control
    applies_to: "dried spices and aromatics"
    rule: "Verify rapid drying, safe product-specific moisture or water activity, rejection controls, and disposal of contaminated material; do not apply a dried-product water-activity rule to curry paste."
    source_ids:
      - fao-who-cxc-78-2017
  - rule_id: validate_range_evidence
    applies_to: "amount ranges"
    rule: "Reject any single-source, single-case, copied point, lower-equals-upper, or falsely precise range; this version must project zero amount ranges."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground product-processing dataset normalized to 1 kg net processed spice or aromatic product at the facility gate"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "LCA process and lifecycle-model construction for the declared CPC 23929 product, form, formulation, treatment, packaging, geography, and reference period"
  excluded_use: "Unqualified generic spice proxy; live plants or propagation material; cut flowers or flower articles; a different spice subclass; consumer use; medicinal or essential-oil function; undisclosed recipe or treatment route"
  required_metadata: "CPC 23929 identity; botanical species or full recipe; product form; incoming/final moisture or solids; route and equipment; treatment status; packaging BOM; storage; geography; reference year; allocation; upstream dataset links"
  required_quality_disclosure: "Primary-data coverage; meter and scale calibration; sampling and moisture methods; mass-balance residuals; allocation drivers; supplier-data representativeness; conditional-process exclusions; unresolved UUIDs; data gaps and uncertainty"
  update_trigger: "Recipe, botanical source, moisture specification, treatment, dryer or mill technology, fuel, electricity supply, packaging, refrigerant, storage regime, site, geography, or data period changes materially"
data_sources:
  - id: "un-cpc-3-0-explanatory-notes"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Explanatory Notes, subclass 23929, 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Complete inclusion scope and classification exclusions"
  - id: "fao-who-cxc-42-1995"
    type: "standard"
    reference: "Codex Alimentarius, Code of Hygienic Practice for Spices and Dried Aromatic Herbs, CXC 42-1995, revised 2014. https://www.fao.org/input/download/standards/27/CXP_042e_2014.pdf"
    used_for: "Broad product definition; cleaning, drying, grinding, microbial reduction, packaging, sanitation, storage, traceability, and process-control rules"
  - id: "fao-herb-spice-quality-assurance-1995"
    type: "official_guidance"
    reference: "Fellows, P.; Axtell, B.; Dillon, M., Quality Assurance for Small-scale Rural Food Industries, FAO Agricultural Services Bulletin 117, section 2.4 Herb and Spice Products, 1995. https://www.fao.org/4/V5380E/V5380E09.htm"
    used_for: "Receiving checks, moisture measurement, washing conditions, cleaning, drying, grinding, sieving, packaging, storage, dust, and plant-record requirements"
  - id: "fao-who-cxc-78-2017"
    type: "standard"
    reference: "Codex Alimentarius, Code of Practice for the Prevention and Reduction of Mycotoxins in Spices, CXC 78-2017. https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FStandards%252FCXC%2B78-2017%252FCXC_078e.pdf"
    used_for: "Conditional washing, rapid drying, dried-product water-activity control, rejection, and contaminated-material disposal; no numeric amount range used"
  - id: "fao-who-cxc-68-2009"
    type: "standard"
    reference: "Codex Alimentarius, Code of Practice for the Reduction of Contamination of Food with Polycyclic Aromatic Hydrocarbons from Smoking and Direct Drying Processes, CXC 68-2009. https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FStandards%252FCXC%2B68-2009%252FCXC_068e.pdf"
    used_for: "Conditional direct-fired and smoke-drying contamination controls and pollutant review"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279, Annex I Product Environmental Footprint Method, 2021, corrected 2022. https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng"
    used_for: "Functional unit, reference flow, company-specific inventory, completeness, atomic input/output coverage, allocation, calculation, data quality, and validation principles"
  - id: "bolliger-spice-footprint-2026"
    type: "literature"
    reference: "Bolliger, C.; Itten, R.; Stucki, M. From Farm to Flavor: Carbon and Biodiversity Footprint of the Global Spice Market. Environmental Science & Technology 60 (2026) 11421-11433. https://doi.org/10.1021/acs.est.5c04846; full text: https://pmc.ncbi.nlm.nih.gov/articles/PMC13104020/"
    used_for: "Peer-reviewed full-text context for 1 kg spice reporting, cultivation/processing/retail separation, drying, grinding, steam treatment, and packaging representation; no quantity range copied"
  - id: "llano-et-al-2022-turmeric-drying"
    type: "literature"
    reference: "Llano, S. M.; Gomez, J. A.; Duarte-Correa, Y. Effect of Drying Methods and Processing Conditions on the Quality of Curcuma longa Powder. Processes 10 (2022) 702. https://doi.org/10.3390/pr10040702; OpenAlex W4226152751; full text: https://www.mdpi.com/2227-9717/10/4/702"
    used_for: "Turmeric-only original full-text evidence for optional washing, slicing, drying, grinding, and sealed packing steps; not generalized into a quantity range or mandatory whole-category route"
  - id: "dharmasena-et-al-2006-spice-dust"
    type: "literature"
    reference: "Dharmasena, D. A. N.; et al. Dust filtration during spice grinding. Journal of Agricultural Sciences. https://doi.org/10.4038/jas.v1i2.8098; OpenAlex W2396079490; original PDF: https://storage.googleapis.com/jnl-sljo-j-jassl-files/journals/1/articles/8098/submission/proof/8098-1-28547-1-10-20160426.pdf"
    used_for: "Original full-text evidence that spice grinding creates airborne dust and requires collection/control; case values are not copied into ranges"
