  - id: "eu-2021-2279-environmental-footprint"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on the Environmental Footprint methods, CELEX 32021H2279, https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A32021H2279, retrieved 2026-08-11"
    used_for: "Life-cycle data quality, verification, process subdivision, allocation disclosure, and downstream dataset use"
