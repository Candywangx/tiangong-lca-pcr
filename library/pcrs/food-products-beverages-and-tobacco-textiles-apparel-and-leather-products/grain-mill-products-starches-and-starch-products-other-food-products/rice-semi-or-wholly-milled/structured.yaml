allocation_rules:
  - rule_id: alloc_avoid_by_subdivision
    applies_to: "Milled rice, broken rice, bran or flour, husk, and other outputs"
    rule: "First avoid allocation by subdividing separately metered operations or by expanding the system only when the declared study method permits it; retain gross output quantities before any credit or allocation."
    source_ids:
      - iso-14044-lca-requirements
      - eu-2021-2279-environmental-footprint
  - rule_id: alloc_output_classification
    applies_to: "All non-reference outputs"
    rule: "Classify each output consistently as co-product, recovered material, waste, or elementary flow using its actual destination and market function; do not change classification only to obtain a preferred burden result."
    source_ids:
      - iso-14044-lca-requirements
  - rule_id: alloc_residual_hierarchy
    applies_to: "Multi-output milling when allocation cannot be avoided"
    rule: "Use a physical relationship that reflects the causal production relationship when justified; otherwise use economic allocation based on documented contemporaneous prices, and disclose method, period, geography, currency, moisture basis, and sensitivity."
    source_ids:
      - iso-14044-lca-requirements
      - eu-2021-2279-environmental-footprint
  - rule_id: alloc_waste_treatment
    applies_to: "Screenings, rejects, wastewater, captured dust, and packaging waste"
    rule: "Keep burdens of onsite handling and required treatment within the foreground system; any downstream recovery credit or burden shall follow the declared study method and shall not be double counted."
    source_ids:
      - iso-14044-lca-requirements
  - rule_id: alloc_balance_check
    applies_to: "Every allocated multi-output process"
    rule: "Allocation fractions shall sum to 1 within reported rounding precision, and unallocated gross mass and energy balances shall be retained for validation."
    source_ids:
      - iso-14044-lca-requirements
dataset_production:
  collection_protocols:
    - protocol_id: cp_paddy_receipts
      process_id: "paddy_receiving_conditioning"
      flow_role: "Received paddy input"
      record_type: "Weighbridge and intake-quality records"
      raw_fields: "lot_id; supplier_or_origin; receipt_time; gross_mass; tare_mass; moisture_percent_wet_basis; impurity_percent; prior_drying; prior_parboiling"
      collection_method: "Calibrated weighbridge plus representative lot sampling"
      unit: "kg; mass %"
      frequency: "Each receipt lot"
      temporal_coverage: "Full represented production period"
      site_scope: "All supplying lots for the represented facility and product"
      aggregation_rule: "Sum net mass; mass-weight quality fields; reconcile opening and closing paddy stock"
      quality_evidence: "Calibration record; sampling plan; weigh ticket; supplier record; stock reconciliation"
    - protocol_id: cp_conditioning_energy
      process_id: "paddy_receiving_conditioning"
      flow_role: "Electricity and onsite conditioning energy"
      record_type: "Meter, invoice, and equipment log"
      raw_fields: "meter_id; opening_reading; closing_reading; invoice_quantity; operating_hours; allocation_driver; conditioned_mass"
      collection_method: "Submeter preferred; otherwise invoice reconciliation with documented allocation"
      unit: "kWh; MJ"
      frequency: "Each meter period or production campaign"
      temporal_coverage: "Full represented production period"
      site_scope: "All included receiving and conditioning equipment"
      aggregation_rule: "Meter difference minus unrelated use; allocate only when subdivision is unavailable"
      quality_evidence: "Meter calibration; invoice; operating log; allocation worksheet"
    - protocol_id: cp_conditioning_outputs
      process_id: "paddy_receiving_conditioning"
      flow_role: "Conditioned paddy and removed impurities"
      record_type: "Transfer-weight and waste records"
      raw_fields: "lot_id; conditioned_mass; conditioned_moisture; screenings_mass; destination; opening_stock; closing_stock"
      collection_method: "Calibrated scale or reconciled mass balance"
      unit: "kg; mass %"
      frequency: "Each lot or shift"
      temporal_coverage: "Full represented production period"
      site_scope: "All receiving and conditioning lines"
      aggregation_rule: "Sum destination-specific outputs after stock correction"
      quality_evidence: "Scale calibration; transfer ticket; waste manifest; stock record"
    - protocol_id: cp_parboiling_inputs
      process_id: "parboiling"
      flow_role: "Paddy, water, steam, and fuel inputs"
      record_type: "Batch, meter, and fuel records"
      raw_fields: "batch_id; paddy_mass; paddy_moisture; water_meter; steam_meter; fuel_quantity; heating_value_basis; electricity"
      collection_method: "Batch weighing and calibrated utility meters; fuel invoices reconciled to stock"
      unit: "kg; m3; kWh; MJ"
      frequency: "Each batch and utility meter period"
      temporal_coverage: "Full represented parboiled-rice production period"
      site_scope: "All onsite soaking, steaming, and redrying equipment"
      aggregation_rule: "Convert water volume with measured or declared density; calculate fuel energy without netting husk output"
      quality_evidence: "Meter calibration; batch sheet; invoice; fuel analysis; stock reconciliation"
    - protocol_id: cp_parboiling_outputs
      process_id: "parboiling"
      flow_role: "Parboiled paddy and wastewater"
      record_type: "Batch output and discharge records"
      raw_fields: "batch_id; output_mass; output_moisture; wastewater_volume_or_mass; evaporation_estimate; destination; opening_stock; closing_stock"
      collection_method: "Calibrated scale and effluent meter or documented water balance"
      unit: "kg; m3"
      frequency: "Each batch or discharge period"
      temporal_coverage: "Full represented parboiled-rice production period"
      site_scope: "All onsite parboiling lines and discharge points"
      aggregation_rule: "Stock-correct outputs; keep measured discharge separate from calculated evaporation"
      quality_evidence: "Scale and meter calibration; batch sheet; discharge record; water-balance worksheet"
    - protocol_id: cp_milling_inputs
      process_id: "milling_separation"
      flow_role: "Paddy input to milling"
      record_type: "Transfer scale and line log"
      raw_fields: "lot_id; input_mass; input_moisture; paddy_route; line_id; start_time; end_time; opening_stock; closing_stock"
      collection_method: "Calibrated transfer scale or reconciled intake-output balance"
      unit: "kg; mass %"
      frequency: "Each lot or shift"
      temporal_coverage: "Full represented production period"
      site_scope: "All milling lines producing the reference product"
      aggregation_rule: "Sum stock-corrected input by route and product"
      quality_evidence: "Scale calibration; line log; lot traceability; stock record"
    - protocol_id: cp_milling_energy
      process_id: "milling_separation"
      flow_role: "Milling electricity and fuel"
      record_type: "Meter, invoice, and operating records"
      raw_fields: "meter_id; opening_reading; closing_reading; invoice_quantity; operating_hours; line_id; product_mass; allocation_driver"
      collection_method: "Submeter preferred; otherwise invoice reconciliation with documented allocation"
      unit: "kWh; MJ"
      frequency: "Each meter period or shift"
      temporal_coverage: "Full represented production period"
      site_scope: "All dehusking, whitening, polishing, grading, conveying, and dust-control equipment"
      aggregation_rule: "Meter difference minus unrelated use; normalize to conforming output"
      quality_evidence: "Meter calibration; invoice; operating log; reconciliation worksheet"
    - protocol_id: cp_milling_outputs
      process_id: "milling_separation"
      flow_role: "Milled rice, broken rice, bran, husk, rejects, and collected dust"
      record_type: "Product scale, silo, sale, and waste records"
      raw_fields: "lot_id; output_type; mass; moisture; destination; product_grade; broken_fraction; opening_stock; closing_stock"
      collection_method: "Calibrated scales and stock or dispatch reconciliation"
      unit: "kg; mass %"
      frequency: "Each lot, shift, or dispatch"
      temporal_coverage: "Full represented production period"
      site_scope: "Every product, co-product, residue, and waste outlet"
      aggregation_rule: "Sum stock-corrected mass by output and destination before allocation"
      quality_evidence: "Scale calibration; sales or transfer ticket; waste record; laboratory grade report; stock record"
    - protocol_id: cp_packaging_records
      process_id: "packaging"
      flow_role: "Rice, packaging material, packaged output, and packaging waste"
      record_type: "Batch, bill-of-material, purchase, and waste records"
      raw_fields: "batch_id; bulk_rice_input; net_packaged_rice; packaging_material; packaging_mass; rejected_pack_mass; recovered_rice; opening_stock; closing_stock"
      collection_method: "Calibrated product scale plus bill-of-material and stock reconciliation"
      unit: "kg; item count"
      frequency: "Each packaging batch"
      temporal_coverage: "Full represented packaged-product period"
      site_scope: "All included packaging lines and materials"
      aggregation_rule: "Convert item counts with measured item mass; reconcile net rice separately from packaging"
      quality_evidence: "Scale calibration; packaging specification; purchase invoice; waste ticket; batch reconciliation"
    - protocol_id: cp_direct_emissions
      process_id: "parboiling"
      flow_role: "Direct air and water emissions"
      record_type: "Stack, permit, laboratory, fuel, and discharge records"
      raw_fields: "substance_id; measured_concentration; flow_rate; duration; fuel_quantity; emission_factor; wastewater_volume; discharge_concentration"
      collection_method: "Direct measurement preferred; otherwise source-specific factor applied to collected activity data"
      unit: "kg; mg/m3; m3; MJ"
      frequency: "Each monitoring event and reporting period"
      temporal_coverage: "Full represented operating period"
      site_scope: "Every included onsite emission and discharge point"
      aggregation_rule: "Calculate substance mass by point; do not aggregate unlike elementary flows"
      quality_evidence: "Laboratory report; monitoring plan; permit return; factor reference; calculation worksheet"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "Every foreground inventory amount"
      rule: "normalized amount = stock-corrected process amount / net conforming reference-product mass"
      inputs:
        - "process amount"
        - "opening stock"
        - "closing stock"
        - "net conforming output"
      output: "amount per 1 kg reference product"
      source_ids:
        - iso-14044-lca-requirements
    - id: calc_moisture_correction
      applies_to: "Comparison of material masses on a dry basis"
      rule: "dry mass = as-received mass × (1 - moisture mass fraction); retain the original as-received mass and moisture record"
      inputs:
        - "as-received mass"
        - "moisture mass fraction"
      output: "dry-basis comparison mass"
      source_ids:
        - fao-grain-postharvest-rice-milling
        - fao-rice-human-nutrition-postharvest
    - id: calc_material_balance
      applies_to: "Receiving, parboiling, milling, and packaging"
      rule: "balance gap = inputs + opening stock - outputs - closing stock; report water evaporation separately when relevant and investigate rather than force-closing unexplained gaps"
      inputs:
        - "all measured material inputs"
        - outputs
        - "stock changes"
        - evaporation
      output: "process mass-balance gap and gap fraction"
      source_ids:
        - iso-14044-lca-requirements
    - id: calc_fuel_energy
      applies_to: "Fuel-derived thermal energy"
      rule: "thermal energy = measured fuel quantity × declared lower or higher heating value on a consistent basis"
      inputs:
        - "fuel quantity"
        - "heating value"
        - "heating-value basis"
      output: "MJ thermal energy"
      source_ids:
        - iso-14044-lca-requirements
    - id: calc_allocation_fraction
      applies_to: "Residual multi-output allocation"
      rule: "allocated burden for output i = unallocated process burden × declared allocation driver for i / sum of the driver over all co-products"
      inputs:
        - "unallocated burden"
        - "co-product outputs"
        - "selected physical or economic driver"
      output: "allocated burden and allocation fraction by output"
      source_ids:
        - iso-14044-lca-requirements
        - eu-2021-2279-environmental-footprint
  data_quality_requirements:
    - id: dq_reference_identity
      applies_to: "Reference product"
      requirement: "Use Tiangong flow 4125cc1c-d304-48b4-a701-f40a581df3c3, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg without dataset versions."
      evidence: "Dataset reference-flow record and UUID validation"
    - id: dq_product_qualifiers
      applies_to: "Reference product and production lot"
      requirement: "Declare every required qualifier and preserve lot traceability from paddy receipt to conforming output."
      evidence: "Product specification; laboratory result; lot genealogy; process log"
    - id: dq_temporal_coverage
      applies_to: "Foreground activity data"
      requirement: "Cover one representative operating year or a complete production campaign; disclose shutdowns, seasonal gaps, product changes, and any extrapolation."
      evidence: "Date-bounded meter, production, purchase, stock, and dispatch records; eu-2021-2279-environmental-footprint"
    - id: dq_technology_geography
      applies_to: "Facility representation"
      requirement: "Describe facility geography, mill scale, dehusking and whitening technology, parboiling route, energy system, dust control, storage, and packaging configuration."
      evidence: "Facility profile; equipment list; process flow diagram; fao-prevention-postharvest-losses-rice-milling"
    - id: dq_completeness_balance
      applies_to: "Material, energy, water, product, co-product, waste, and emission records"
      requirement: "Reconcile all included processes and disclose missing outlets, unmetered shared utilities, unexplained balance gaps, and excluded minor flows rather than silently assigning zero."
      evidence: "Signed balance and reconciliation worksheets; iso-14044-lca-requirements"
    - id: dq_provisional_ranges
      applies_to: "Every reasoned_estimate range"
      requirement: "Treat the range only as a QA flag, never as an automatic replacement for foreground data; replace or explicitly accept it during methodology review."
      evidence: "Review record identifying retained or replaced provisional ranges"
    - id: dq_source_traceability
      applies_to: "External evidence and calculation factors"
      requirement: "Retain source title, stable reference, retrieval date for web sources, factor version, applicability, and calculation worksheet."
      evidence: "Source register and calculation archive; eu-2021-2279-environmental-footprint"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "Fail conformance if the reference product UUID, Mass UUID, unit-group UUID, reference unit, or reference amount differs from the declared reference-flow object without an approved PCR revision."
    source_ids:
      - iso-14044-lca-requirements
  - rule_id: val_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Fail conformance when any required qualifier is absent or when product and process records disagree on milling degree, moisture basis, broken-kernel treatment, parboiling route, or packaging state."
    source_ids:
      - fao-rice-human-nutrition-postharvest
      - fao-grain-postharvest-rice-milling
  - rule_id: val_process_coverage
    applies_to: "Process inventory"
    rule: "Require every required process and require an applicability decision for every conditional process; an included branch shall carry its inputs, outputs, utilities, wastes, and direct emissions."
    source_ids:
      - fao-prevention-postharvest-losses-rice-milling
  - rule_id: val_material_balance
    applies_to: "Each foreground process and aggregate facility balance"
    rule: "Calculate and report the mass-balance gap on consistent moisture bases; investigate unexplained gaps against a documented site tolerance and do not force the balance by altering the reference output."
    source_ids:
      - iso-14044-lca-requirements
  - rule_id: val_allocation
    applies_to: "Multi-output process"
    rule: "Verify output classification, avoidance rationale, allocation driver, source period, allocation fractions summing to 1 within reported rounding precision, and sensitivity when an alternative method could materially change results."
    source_ids:
      - iso-14044-lca-requirements
      - eu-2021-2279-environmental-footprint
  - rule_id: val_energy_water_reconciliation
    applies_to: "Electricity, fuel, water, steam, and wastewater"
    rule: "Reconcile meters, invoices, stocks, and production periods; disclose shared-utility allocation and prevent onsite husk use or recovered water from being netted invisibly."
    source_ids:
      - iso-14044-lca-requirements
  - rule_id: val_qa_guardrails
    applies_to: "Inventory ranges"
    rule: "A value outside a QA guardrail triggers documented review of measurement, normalization, route, moisture basis, and source applicability; it shall not be clipped to the guardrail or replaced automatically."
    source_ids:
      - fao-grain-postharvest-rice-milling
  - rule_id: val_source_and_estimate_status
    applies_to: "Evidence register"
    rule: "Verify that every cited source id resolves in Data Sources and every provisional numerical range is labelled reasoned_estimate with qa_guardrail; fail publication review if a publication-critical estimate remains unreviewed."
    source_ids:
      - eu-2021-2279-environmental-footprint
published_dataset_profile:
  dataset_role: "Foreground production dataset for semi-milled or wholly milled rice at a declared rice-milling facility"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product and process LCA for declared rice products and routes when geography, technology, product qualifiers, boundary, allocation, and data quality are compatible"
  excluded_use: "Paddy cultivation; husked rice sold without milling; rice flour or starch production; cooked rice; consumer use; undeclared parboiling or packaging routes; comparative public claims without method-compatible review"
  required_metadata: "PCR id; Tiangong reference-flow UUIDs; facility geography; production period; technology; paddy origin and condition; milling degree; moisture basis; broken-kernel fraction; parboiling state; packaging state; boundary; allocation method; dataset version"
  required_quality_disclosure: "Temporal, geographic, and technological representativeness; metering and calibration; mass, energy, and water balances; missing flows; shared-utility allocation; co-product treatment; provisional estimates; source and factor versions; uncertainty and review status"
  update_trigger: "Material change in product specification, paddy route, milling or parboiling technology, energy system, packaging, allocation basis, facility geography, production mix, measurement system, source evidence, or Tiangong reference identity"
data_sources:
  - id: "fao-grain-postharvest-rice-milling"
    type: "official_guidance"
    reference: "FAO, Agricultural engineering in development - Grain and post-harvest systems, rice section, https://www.fao.org/4/T0522E/T0522E03.htm, retrieved 2026-08-11"
