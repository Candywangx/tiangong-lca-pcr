    reference: "FAO, Rice in human nutrition: Rice post-harvest processing, parboiling and home preparation, https://www.fao.org/4/t0567e/T0567E0h.htm, retrieved 2026-08-11"
    used_for: "Milling-route distinctions, moisture and tempering context, bran removal, parboiling, and separated fractions"
