system_boundary:
  rules:
    - rule_id: sb_foreground_start_end
      applies_to: "Foreground rice-milling system"
      rule: "Begin at weighed paddy receipt and include all onsite cleaning, drying or tempering, parboiling, dehusking, separation, whitening or polishing, grading or blending, storage, and packaging operations that are actually performed before the declared mill-gate product is dispatched."
      source_ids:
        - fao-grain-postharvest-rice-milling
        - fao-prevention-postharvest-losses-rice-milling
    - rule_id: sb_upstream_linkage
      applies_to: "Upstream inputs"
      rule: "Represent cultivation, off-site conditioning, inbound transport, purchased utilities, packaging production, and off-site treatment with linked upstream datasets; do not duplicate an activity already included in an upstream dataset."
      source_ids:
        - iso-14044-lca-requirements
        - eu-2021-2279-environmental-footprint
    - rule_id: sb_conditional_routes
      applies_to: "Conditional operations"
      rule: "Include onsite drying, parboiling, polishing or glazing, by-product energy recovery, and packaging only when performed; record the route-specific utilities, outputs, emissions, and wastes and state why an omitted branch does not apply."
      source_ids:
        - fao-rice-human-nutrition-postharvest
        - fao-prevention-postharvest-losses-rice-milling
    - rule_id: sb_recursive_category_input
      applies_to: "Same-category product inputs"
      rule: "Record incoming semi-milled or wholly milled rice as a product input with an upstream dataset and stop category recursion at that recorded boundary."
      source_ids:
        - iso-14044-lca-requirements
    - rule_id: sb_downstream_exclusions
      applies_to: "Downstream stages"
      rule: "Exclude distribution beyond the mill gate, retail, cooking, consumption, and consumer end-of-life unless the declared study scope explicitly adds them with separate processes and datasets."
      source_ids:
        - iso-14044-lca-requirements
boundary_abstraction:
