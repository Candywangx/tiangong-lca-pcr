allocation_rules:
  - rule_id: allocation_01
    applies_to: "multi-output operations"
    rule: "Avoid allocation first by subdivision or by separately metering independently operated preparation, purification, crystallisation, energy, and treatment processes."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_02
    applies_to: "physically coupled co-products"
    rule: "When subdivision is not possible, use a demonstrated underlying physical relationship only if it represents how changes in the process drive the co-product outputs; document the relationship and factors."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_03
    applies_to: "remaining multi-functionality"
    rule: "If no defensible physical relationship exists, apply an explicitly documented other relationship, normally economic allocation based on representative prices, and report a sensitivity case for material co-products."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_04
    applies_to: "molasses, beet pulp, filter cake, and recoverable residues"
    rule: "Classify an output as a co-product only when it has a documented beneficial use and leaves the product system; otherwise model it as waste with its treatment burden."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_05
    applies_to: "internal loops"
    rule: "Do not allocate burdens to internally recirculated liquor, sugar, water, condensate, or steam; close the internal balance and count only external inputs and outputs."
    source_ids:
      - eu-fdm-bat-2019-2031
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "feedstock_preparation_purification_concentration"
      flow_role: "feedstock and process-aid inputs"
      record_type: "weighbridge, invoice, stock ledger, batch sheet"
      raw_fields: "date; material id; supplier; gross mass; tare; net mass; opening stock; receipts; closing stock; moisture if relevant"
      collection_method: "calibrated scale plus stock reconciliation"
      unit: "kg"
      frequency: "each receipt and monthly reconciliation"
      temporal_coverage: "complete reporting period"
      site_scope: "all included lines and warehouses"
      aggregation_rule: "sum net consumed mass, then normalize by conforming refined sugar output"
      quality_evidence: "scale calibration; invoice and stock reconciliation; missing-record log"
    - protocol_id: cp_water_balance
      process_id: "all_included_processes"
      flow_role: "water withdrawal, purchase, reuse, condensate, wastewater, discharge"
      record_type: "water-meter and water-balance record"
      raw_fields: "meter id; timestamp; source or destination; volume; meter status; estimated downtime"
      collection_method: "calibrated meters plus documented balance for unmetered branches"
      unit: "m3"
      frequency: "daily or campaign total, monthly reconciliation"
      temporal_coverage: "complete reporting period"
      site_scope: "all included water nodes"
      aggregation_rule: "external input and discharge totals minus documented internal recirculation"
      quality_evidence: "meter calibration; closure residual; downtime estimate record"
    - protocol_id: cp_energy_records
      process_id: "all_included_processes"
      flow_role: "electricity, fuels, heat, and steam"
      record_type: "meter, invoice, and energy-balance record"
      raw_fields: "meter id; timestamp; energy carrier; quantity; unit; supplier; lower or higher heating value basis; CHP export"
      collection_method: "sub-meter, invoice, or documented plant energy balance"
      unit: "kWh; MJ; kg or m3 fuel with conversion factor"
      frequency: "continuous or invoice period; monthly reconciliation"
      temporal_coverage: "complete reporting period"
      site_scope: "all included production and utility systems"
      aggregation_rule: "preserve carriers separately and normalize each to refined sugar output"
      quality_evidence: "meter calibration; invoices; conversion-factor source; energy-balance closure"
    - protocol_id: cp_intermediate_liquor
      process_id: "feedstock_preparation_purification_concentration_crystallization_finishing"
      flow_role: "prepared and concentrated liquor transfers"
      record_type: "inter-process transfer and laboratory record"
      raw_fields: "tank id; batch; mass or volume; density; temperature; dry matter or soluble solids; sucrose concentration"
      collection_method: "calibrated tank or flow measurement plus laboratory test"
      unit: "kg; m3; %"
      frequency: "each batch or continuous total"
      temporal_coverage: "complete reporting period"
      site_scope: "every transfer between included stages"
      aggregation_rule: "convert volume to mass with matched density and reconcile stage transfers"
      quality_evidence: "instrument calibration; laboratory method; batch linkage; balance residual"
    - protocol_id: cp_output_mass
      process_id: "all_included_processes"
      flow_role: "refined sugar, co-products, residues, and wastes"
      record_type: "dispatch, scale, and waste record"
      raw_fields: "product or waste id; destination; gross mass; tare; net mass; moisture or dry matter; disposition"
      collection_method: "calibrated scale, dispatch record, and waste manifest"
      unit: "kg"
      frequency: "each batch or shipment"
      temporal_coverage: "complete reporting period"
      site_scope: "all included output points"
      aggregation_rule: "sum by product identity and destination; normalize to refined sugar output"
      quality_evidence: "scale calibration; dispatch or waste documentation; moisture test"
    - protocol_id: cp_direct_emissions
      process_id: "crystallization_finishing_wastewater_treatment"
      flow_role: "air and water emissions"
      record_type: "monitoring and emissions-calculation record"
      raw_fields: "source id; sample time; concentration; gas or water flow; operating hours; method; detection limit; abatement status"
      collection_method: "direct monitoring or permit-compliant calculation"
      unit: "kg pollutant; mg/Nm3; mg/L; m3"
      frequency: "permit frequency and campaign coverage"
      temporal_coverage: "representative operating conditions across the reporting period"
      site_scope: "every relevant discharge point"
      aggregation_rule: "concentration times measured flow and time, with non-detect handling disclosed"
      quality_evidence: "accredited test report; flow-meter calibration; permit record; calculation sheet"
    - protocol_id: cp_packaging_records
      process_id: "packaging"
      flow_role: "packaging materials and losses"
      record_type: "packaging bill-of-materials and reconciliation record"
      raw_fields: "packaging code; material; item count; unit mass; purchased mass; returned units; waste mass"
      collection_method: "bill of materials, purchase records, item weighing, and waste reconciliation"
      unit: "kg; item"
      frequency: "each packaging specification and monthly total"
      temporal_coverage: "complete reporting period"
      site_scope: "all packaging supplied with the declared product"
      aggregation_rule: "item count times verified unit mass, adjusted for returns and losses"
      quality_evidence: "specification; sample-weigh record; purchase and waste reconciliation"
    - protocol_id: cp_treatment_records
      process_id: "wastewater_treatment"
      flow_role: "treatment inputs, sludge, and operating data"
      record_type: "treatment operations and waste record"
      raw_fields: "treatment train; utility or chemical id; quantity; sludge mass; moisture; uptime; bypass"
      collection_method: "meters, dosing logs, laboratory records, and waste manifests"
      unit: "flow-specific"
      frequency: "daily or batch, monthly reconciliation"
      temporal_coverage: "complete reporting period"
      site_scope: "on-site treatment serving included operations"
      aggregation_rule: "sum attributable inputs and outputs; disclose shared-treatment allocation"
      quality_evidence: "meter and dosing calibration; laboratory QA; bypass and maintenance log"
    - protocol_id: cp_product_quality
      process_id: "crystallization_finishing"
      flow_role: "refined sugar specification"
      record_type: "laboratory and product-release record"
      raw_fields: "lot; subtype; polarisation or sucrose result; invert sugar; moisture or loss on drying; colour; ash; additives; test method"
      collection_method: "representative laboratory sampling and product release records"
      unit: "test-specific"
      frequency: "each lot or statistically justified composite"
      temporal_coverage: "all product represented by the dataset"
      site_scope: "all finished-product sampling and release points"
      aggregation_rule: "production-weighted result and pass/fail by declared specification"
      quality_evidence: "laboratory method; calibration; sample plan; release certificate"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "reference product"
      rule: "Net refined sugar mass = gross dispatch mass - tare and packaging mass; exclude non-conforming or reworked stock not leaving the declared gate."
      inputs:
        - "gross mass"
        - tare
        - "packaging mass"
        - "product disposition"
      output: "kg conforming refined sugar"
      source_ids:
        - codex-cxs-212-1999
    - id: calc_specific_inventory
      applies_to: "every external inventory flow"
      rule: "Specific amount = reporting-period flow amount / reporting-period net conforming refined sugar mass x 1,000 kg."
      inputs:
        - "collected flow amount"
        - "net refined sugar output"
      output: "flow amount per 1,000 kg refined sugar"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_liquor_mass
      applies_to: "intermediate liquor"
      rule: "Liquor mass = measured volume x density at the matched temperature; retain measured concentration and sampling basis."
      inputs:
        - volume
        - density
        - temperature
        - concentration
      output: "kg intermediate liquor and composition fields"
      source_ids: []
    - id: calc_emission_load
      applies_to: "direct emissions"
      rule: "Emission load = measured concentration x measured dry-gas or wastewater volume, with unit conversion and operating coverage documented."
      inputs:
        - concentration
        - flow
        - "time or total volume"
        - "non-detect rule"
      output: "kg pollutant per reporting period"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_mass_balance
      applies_to: "each process and full foreground system"
      rule: "Reconcile external and inter-process mass inputs with products, co-products, wastes, emissions, inventory change, and explained water removal or addition; investigate material residuals."
      inputs:
        - "all mass-bearing inputs and outputs"
        - stocks
        - "moisture and solids data"
      output: "mass-balance residual and explanation"
      source_ids: []
    - id: calc_allocation_factor
      applies_to: "multi-output process"
      rule: "Derive allocation factors only after applying the hierarchy in Section 7; factors across all co-products shall sum to 1 within rounding tolerance and the data period shall match the inventory."
      inputs:
        - "subdivided records or physical/economic allocation driver"
      output: "documented allocation factor by output"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and all material inputs/outputs"
      requirement: "Preserve product subtype, origin, route, starting condition, specification, Tiangong UUID where selected, and gate identity."
      evidence: "product specification; supplier and dispatch records; UUID lookup record outside PCR content"
    - id: dq_temporal
      applies_to: "foreground inventory"
      requirement: "Use one complete and representative reporting period; cover seasonal campaigns, start-up, shutdown, and abnormal periods or disclose exclusions."
      evidence: "production calendar; meter and batch coverage; exclusion log"
    - id: dq_technology
      applies_to: "foreground inventory"
      requirement: "Describe extraction or melting, purification, decolourisation, evaporation, crystallisation, drying, energy system, dust control, and wastewater treatment technologies actually used."
      evidence: "process flow sheet; equipment list; operating records"
    - id: dq_geography
      applies_to: "utilities and upstream links"
      requirement: "Use datasets representative of the plant, feedstock origin, electricity grid, fuels, water source, treatment destination, and transport geography."
      evidence: "supplier origin; plant location; utility contracts; dataset metadata"
    - id: dq_completeness
      applies_to: "all known inputs and outputs"
      requirement: "Include all known raw materials, water, energy, products, co-products, emissions, and wastes; disclose and justify any cut-off."
      evidence: "material, water, and energy balances; emission inventory; cut-off log"
    - id: dq_precision
      applies_to: "measured and calculated values"
      requirement: "Retain calibration, sampling, laboratory, density, moisture, conversion, and uncertainty evidence sufficient to reproduce each normalized value."
      evidence: "calibration certificates; laboratory QA; calculation sheets; uncertainty record"
    - id: dq_consistency
      applies_to: "bilingual and multi-process dataset"
      requirement: "Apply consistent wet/dry basis, net/gross mass, reporting period, allocation method, and internal-transfer treatment across processes."
      evidence: "cross-process reconciliation; reviewer checklist; bilingual rule-id check"
validation_rules:
  - rule_id: validation_01
    applies_to: "PCR identity"
    rule: "The canonical PCR id, CPC reference, covered products, exclusions, and declared product subtype shall be present and mutually consistent."
    source_ids: []
  - rule_id: validation_02
    applies_to: "reference flow"
    rule: "The reference output shall equal 1,000 kg net refined sugar, use the selected product-flow, Mass, and Units-of-mass UUIDs without dataset versions, and declare all required qualifiers."
    source_ids:
      - codex-cxs-212-1999
  - rule_id: validation_03
    applies_to: "product quality"
    rule: "Product release evidence shall demonstrate conformance with the declared subtype specification; values and test basis for purity or polarisation, moisture, colour, and additives shall be disclosed as applicable."
    source_ids:
      - codex-cxs-212-1999
  - rule_id: validation_04
    applies_to: "boundary completeness"
    rule: "Every included process in the process map shall have matching inventory records, and excluded upstream or downstream stages shall have explicit dataset links or scope disclosures."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: validation_05
    applies_to: "material, water, and energy balance"
    rule: "Process and site balances shall reconcile internal transfers and external flows; unexplained residuals, unmetered estimates, and internal recirculation shall be reported and reviewed."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: validation_06
    applies_to: "multi-functionality"
    rule: "Co-product classification and allocation shall follow the Section 7 hierarchy, factors shall sum to 1 within rounding tolerance, and material alternative methods shall be tested."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_07
    applies_to: "emissions and waste"
    rule: "Wastewater, channelled air emissions, captured residues, sludge, off-specification sugar, and their destinations shall not be omitted or double counted."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: validation_08
    applies_to: "provisional ranges"
    rule: "Every reasoned_estimate range shall remain labelled replaceable and shall not override collected site data or be presented as a regulatory, BAT, or conformance limit."
    source_ids: []
  - rule_id: validation_09
    applies_to: "data quality"
    rule: "Temporal, technological, geographical, completeness, and precision evidence shall be retained for company-specific activity data and direct elementary flows."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground refined-sugar production data package at the declared factory or refinery gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product carbon footprint and LCA models requiring route-, geography-, specification-, and gate-matched refined-sugar manufacturing data"
  excluded_use: "Unqualified substitution for raw sugar, syrups, glucose or fructose, flavoured or coloured sugar, confectionery, another route or geography, or a cradle-to-grave result without linked stages"
  required_metadata: "PCR id; product subtype and specification; cane/beet origin; starting condition; route; included stages; plant gate; geography; reporting period; technology; utility mix; packaging scope; co-product treatment; allocation method; cut-offs; UUIDs"
  required_quality_disclosure: "Data coverage; measured versus calculated shares; calibration and sampling evidence; material, water, and energy balance residuals; missing data; provisional ranges used; allocation sensitivity; source and dataset representativeness"
  update_trigger: "Material change in feedstock origin or state, product specification, process route, energy or water system, abatement or treatment, packaging, allocation basis, plant geography, or reporting period representativeness"
