process_map:
  - id: receipt_and_identity_control
    name: "Receipt, identity control, and initial sorting"
    inclusion: "required"
    inclusion_condition: "Always included for a processed CPC 23924 product"
    role: "Establish one-species lot identity, incoming state, accepted mass, rejected material, and incoming-packaging waste"
    quantitative_reference: "Accepted botanical mass by supplier lot"
  - id: dry_cleaning_grading
    name: "Dry cleaning, grading, and foreign-material removal"
    inclusion: "required"
    inclusion_condition: "Always included; record the actual equipment train"
    role: "Separate the declared botanical material from screenings, captured dust, stones, metal, and released dust"
    quantitative_reference: "Cleaned botanical mass by lot"
  - id: wet_washing_draining
    name: "Wet washing and draining"
    inclusion: "conditional"
    inclusion_condition: "Included only when potable-water washing is actually performed"
    role: "Record washing water, stage electricity, and species-specific washing wastewater"
    quantitative_reference: "Washed botanical mass by lot"
  - id: controlled_drying_cooling
    name: "Controlled drying and cooling"
    inclusion: "conditional"
    inclusion_condition: "Included when the facility dries, re-dries, conditions, or actively cools the material"
    role: "Record stage electricity, each thermal carrier, each fuel, refrigerant, and direct air emission"
    quantitative_reference: "Dried botanical mass by lot"
  - id: microbial_reduction
    name: "Microbial-reduction treatment"
    inclusion: "conditional"
    inclusion_condition: "Included only for the declared steam, irradiation, or other legally permitted validated route"
    role: "Record treatment-specific utilities or service and condensate"
    quantitative_reference: "Treated botanical mass by lot"
  - id: crushing_grinding_sieving
    name: "Crushing, grinding, and sieving"
    inclusion: "conditional"
    inclusion_condition: "Included for cut, broken, cracked, ground, or powdered styles and any route using size reduction or sieving"
    role: "Record electricity, compressed air, permitted anticaking agent, screenings, captured dust, and emitted dust"
    quantitative_reference: "Conforming processed mass by style and sieve specification"
  - id: packaging_storage_release
    name: "Packaging, controlled storage, and release"
    inclusion: "required"
    inclusion_condition: "Always included; refrigerated storage is conditional"
    role: "Record each packaging material, storage electricity, refrigerant, packaging scrap, rejected product, and the reference output"
    quantitative_reference: "Net released product mass"
  - id: cleaning_sanitation
    name: "Equipment and area cleaning and sanitation"
    inclusion: "required"
    inclusion_condition: "Dry cleaning is preferred; liquid cleaning and each chemical are recorded only when used"
    role: "Record water, heat, electricity, each chemical, and its wastewater stream"
    quantitative_reference: "Cleaned equipment area or production campaign"
  - id: onsite_wastewater_treatment
    name: "On-site wastewater treatment"
    inclusion: "conditional"
    inclusion_condition: "Included when process wastewater is treated inside the foreground facility"
    role: "Record each incoming wastewater, treatment input, sludge, effluent, and each water emission"
    quantitative_reference: "Treated wastewater volume"
