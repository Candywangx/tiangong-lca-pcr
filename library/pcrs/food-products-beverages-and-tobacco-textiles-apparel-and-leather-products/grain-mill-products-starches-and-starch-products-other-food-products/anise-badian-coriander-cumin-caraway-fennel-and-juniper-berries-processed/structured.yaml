    used_for: "Separate inventories of water, energy, raw materials, wastewater and waste gas; stage flow sheets; cleaning; COD/TOC/nitrogen/phosphorus/chloride; dust, CO, NOx and SOx; packaging exclusion from product mass; no BAT-AEL is used as a default amount"
  - id: "eu-pef-2021-2279"
