  - id: "jrc-fdm-bref-2019"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Best Available Techniques Reference Document in the Food, Drink and Milk Industries, JRC118627, 2019, DOI 10.2760/243911, https://publications.jrc.ec.europa.eu/repository/handle/JRC118627"
    used_for: "Sector boundary, process/resource inventory, water and energy management, cleaning, wastewater, waste gas, residues, and monitoring structure; no BAT quantity is adopted as a PCR default"
  - id: "eu-bat-fdm-2019-2031"
