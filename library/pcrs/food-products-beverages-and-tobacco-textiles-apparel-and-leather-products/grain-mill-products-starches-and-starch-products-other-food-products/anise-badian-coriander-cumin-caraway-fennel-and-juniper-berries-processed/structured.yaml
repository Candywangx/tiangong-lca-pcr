    reference: "Codex Alimentarius, Standard for Spices Derived from Dried or Dehydrated Fruits and Berries: Allspice, Juniper Berry and Star Anise, CXS 358-2024, https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FStandards%252FCXS%2B358-2024%252FCXS_358e.pdf"
