allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "foreground_burden_allocation"
    rule: "Use species-, style-, batch-, and stage-specific meters and records to avoid allocation. Never allocate one species' material losses or direct emissions to another species."
    source_ids: []
  - rule_id: allocation_shared_utilities
    applies_to: "foreground_burden_allocation"
    rule: "When a meter serves multiple products, allocate only with a contemporaneous causal driver such as measured operating time multiplied by equipment load, delivered heat, or treated volume; disclose the driver, period, and residual. Production-mass allocation is allowed only when no more causal record exists and shall be flagged."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "foreground_burden_allocation"
    rule: "Material returned to the same process as documented rework is an internal loop and is not reported as waste or co-product; record rework mass to close the stage balance."
    source_ids: []
  - rule_id: allocation_residue_status
    applies_to: "foreground_burden_allocation"
    rule: "Screenings, captured dust, off-specification product, packaging scrap, sludge, and screen rejects remain waste unless a documented recipient, specification, and economic transaction demonstrate a co-product function. Report each species or material separately."
    source_ids: []
  - rule_id: allocation_no_cross_style_average
    applies_to: "foreground_burden_allocation"
    rule: "Whole, cut, broken, cracked, ground, powdered, and otherwise processed styles shall not share averaged yield, energy, loss, or packaging data unless the actual campaign produces an inseparable single declared style."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_receipt_identity
      process_id: "receipt_and_identity_control"
      flow_role: "Botanical inputs, receipt electricity, incoming-package waste, rejected botanical material, stones, and metal"
      record_type: "Weighbridge, scale, inspection, supplier, and meter records"
      raw_fields: "species; scientific name; plant part; lot; incoming state; origin; gross and tare mass; moisture or water activity; accepted mass; reject reason; electricity; waste mass; destination"
      collection_method: "Reconcile supplier delivery, calibrated mass readings, identity checks, and inspection disposition by lot"
      unit: "kg; kWh"
      frequency: "Each lot and monthly reconciliation"
      temporal_coverage: "Study-period lots"
      site_scope: "Declared processing facility"
      aggregation_rule: "Sum only the one declared species and incoming state; normalize after mass reconciliation"
      quality_evidence: "Calibration record; supplier specification; identity result; lot ledger; waste receipt"
    - protocol_id: cp_dry_cleaning
      process_id: "dry_cleaning_grading"
      flow_role: "Electricity, compressed air, species-specific screenings, captured dust, and dust to air"
      record_type: "Submeter, operating log, collector weighing, and emission measurement"
      raw_fields: "equipment; runtime; power; air volume and pressure; inlet mass; screenings mass; collector mass; exhaust flow; dust concentration; species"
      collection_method: "Read stage meters and weigh every separated fraction by lot; match emission sample to the campaign"
      unit: "kWh; m3; kg"
      frequency: "Each campaign with reporting-period reconciliation"
      temporal_coverage: "Representative campaigns covering study period"
      site_scope: "Declared processing facility"
      aggregation_rule: "No cross-species pooling; calculate emitted load from matched flow and concentration"
      quality_evidence: "Meter record; scale check; collector log; emission test"
    - protocol_id: cp_wet_washing
      process_id: "wet_washing_draining"
      flow_role: "Washing water, electricity, and species-specific washing wastewater"
      record_type: "Water meter, electricity meter, batch, and wastewater records"
      raw_fields: "species; lot; inlet mass; water volume; electricity; wastewater volume; destination; sampling time"
      collection_method: "Difference-check supplied water, retained moisture, and wastewater; keep sanitation water separate"
      unit: "m3; kWh; kg"
      frequency: "Each washing campaign"
      temporal_coverage: "All applicable study-period campaigns"
      site_scope: "Declared processing facility"
      aggregation_rule: "Sum only campaigns using the same species and washing route"
      quality_evidence: "Meter calibration; batch sheet; discharge record"
    - protocol_id: cp_drying_cooling
      process_id: "controlled_drying_cooling"
      flow_role: "Electricity, steam, hot water, each fuel, refrigerant, combustion emission, and species-specific dust"
      record_type: "Submeter, fuel, steam, temperature, refrigerant, batch, and emission records"
      raw_fields: "dryer; species; inlet and outlet mass and moisture; runtime; electricity; steam mass and state; hot-water flow and temperatures; fuel quantity and heating value; refrigerant balance; stack flow and concentrations"
      collection_method: "Match utility and emission records to the declared dryer campaign; document indirect versus direct heating"
      unit: "kWh; MJ; kg; m3; L"
      frequency: "Each campaign, with annual refrigerant reconciliation"
      temporal_coverage: "Representative campaigns and full reporting period"
      site_scope: "Declared processing facility"
      aggregation_rule: "Allocate shared dryer records by measured runtime and load; never average species without disaggregation"
      quality_evidence: "Meter calibration; fuel invoice; heating-value certificate; maintenance log; stack test; moisture test"
    - protocol_id: cp_microbial_reduction
      process_id: "microbial_reduction"
      flow_role: "Electricity, product-contact steam, water, irradiation service, and condensate"
      record_type: "Treatment batch, utility meter, service certificate, dose, and discharge record"
      raw_fields: "technology; species; lot mass; electricity; steam mass and state; water; absorbed dose; provider; condensate volume; validation result"
      collection_method: "Reconcile treated lot mass with validated route and utility or service records"
      unit: "kg; kWh; m3; kGy where applicable"
      frequency: "Each treated lot"
      temporal_coverage: "All applicable study-period lots"
      site_scope: "Declared and contracted treatment facilities"
      aggregation_rule: "Keep steam, gamma, electron-beam, and UV routes separate"
      quality_evidence: "Batch release; meter record; treatment certificate; validation record"
    - protocol_id: cp_milling_sieving
      process_id: "crushing_grinding_sieving"
      flow_role: "Electricity, compressed air, each anticaking agent, species-specific oversize, captured dust, and emitted dust"
      record_type: "Batch, formulation, submeter, sieve, collector, and emission records"
      raw_fields: "species; style; mill; sieve apertures; particle distribution; runtime; electricity; compressed air; additive mass; feed and product mass; oversize; collector mass; exhaust data"
      collection_method: "Match material balance and energy to one species, one style, and one sieve specification"
      unit: "kg; kWh; m3; mm; µm"
      frequency: "Each campaign"
      temporal_coverage: "Representative campaigns covering study period"
      site_scope: "Declared processing facility"
      aggregation_rule: "No pooling across species or styles; exclude internal rework from waste"
