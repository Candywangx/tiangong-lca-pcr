      raw_fields: "species; style; particle specification; net product mass; package component and mass; rejected package mass; released units; electricity; refrigerant opening, additions, recovery, closing; storage time; release status"
      collection_method: "Reconcile issued components, returned stock, scrap, packaged gross mass, packaging tare, and net released mass"
      unit: "kg; kWh; day"
      frequency: "Each packaging lot with monthly and annual reconciliation"
      temporal_coverage: "All packaging lots in the full reporting period"
