    used_for: "Incoming-state disclosure, sorting, conditional washing, natural or controlled drying, hot-air fuel separation, irradiation, storage, lot controls, and species-specific loss structure"
  - id: "codex-cxs-327-2017"
    type: "standard"
    reference: "Codex Alimentarius, Standard for Cumin, CXS 327-2017, amended 2022, https://www.fao.org/fao-who-codexalimentarius/sh-proxy/ua/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FStandards%252FCXS%2B327-2017%252FCXS_327e.pdf"
    used_for: "Cumin species identity, cleaning/drying/grinding/sifting route, whole/cracked/ground styles, quality controls, and conditional anticaking-agent rule"
