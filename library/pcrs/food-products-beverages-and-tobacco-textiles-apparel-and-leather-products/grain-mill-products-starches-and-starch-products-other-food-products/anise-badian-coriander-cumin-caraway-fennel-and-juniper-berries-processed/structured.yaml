      record_type: "Sanitation schedule, meter, dosing, supplier, and discharge records"
      raw_fields: "area or equipment; dry-cleaning action; water; electricity; hot-water flow and temperatures; chemical identity, concentration and dose; wastewater volume, pH and destination"
      collection_method: "Record each chemical active ingredient separately and associate liquid discharge with the cleaning step"
      unit: "m3; kWh; MJ; kg"
      frequency: "Each sanitation event with campaign allocation"
      temporal_coverage: "All applicable sanitation events in the full reporting period"
      site_scope: "Entire foreground facility areas serving declared product"
      aggregation_rule: "Allocate shared sanitation by cleaned equipment time or area and campaign use; disclose driver"
