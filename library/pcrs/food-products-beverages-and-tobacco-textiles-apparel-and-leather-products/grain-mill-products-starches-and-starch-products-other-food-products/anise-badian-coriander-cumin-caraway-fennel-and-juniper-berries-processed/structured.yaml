      record_type: "Flow meter, dosing, laboratory, sludge, and waste records"
      raw_fields: "source stream; influent and effluent flow; electricity; chemical identity and dose; pH; COD; BOD5; TOC; total nitrogen; total phosphorus; TSS; chloride; sludge wet mass and dry solids; destination"
      collection_method: "Use time-matched flow-proportional composite sampling where available and retain laboratory method"
      unit: "m3; kWh; kg; mg/L"
      frequency: "Flow continuously or per batch; pollutants at permitted or representative frequency"
      temporal_coverage: "Full reporting period"
      site_scope: "On-site treatment serving declared facility"
      aggregation_rule: "Calculate each pollutant load from matched flow and concentration; allocate shared treatment by measured source load or volume"
      quality_evidence: "Flow calibration; laboratory report; dosing log; sludge ticket; discharge permit record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every foreground exchange"
      rule: "normalized amount = reporting-period exchange amount / net conforming product mass of the same species and style"
      inputs:
        - "Reconciled exchange record"
        - "net released mass excluding packaging"
      output: "Amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_stage_electricity
      applies_to: "Stage electricity without a dedicated submeter"
      rule: "stage electricity = measured equipment power × operating time × documented load factor; reconcile to the facility meter"
      inputs:
        - "Power measurement"
        - runtime
        - "load factor"
        - "facility meter"
      output: "Stage-specific kWh"
      source_ids:
        - eu-pef-2021-2279
        - eu-bat-fdm-2019-2031
    - id: calc_hot_water_heat
      applies_to: "Purchased hot water"
      rule: "delivered heat = measured mass flow × documented heat capacity × (inlet temperature - outlet temperature)"
      inputs:
        - Flow
        - temperatures
        - "heat capacity"
      output: "MJ delivered heat"
      source_ids:
        - eu-bat-fdm-2019-2031
    - id: calc_steam_heat
      applies_to: "Purchased steam"
      rule: "delivered heat = steam mass × (supply specific enthalpy - returned condensate specific enthalpy)"
      inputs:
        - "Steam mass"
        - pressure
        - temperature
        - "condensate return state"
      output: "MJ delivered heat"
      source_ids:
        - eu-bat-fdm-2019-2031
    - id: calc_refrigerant_balance
      applies_to: "Each R717, R744, or R290 system"
      rule: "loss = opening charge + additions - closing charge - recovered mass; negative or unexplained balances require correction"
      inputs:
        - "Opening and closing inventory"
        - additions
        - recovery
      output: "kg of the same refrigerant to air"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_combustion_emission
      applies_to: "Each dryer-combustion air emission"
      rule: "emission = measured fuel quantity × fuel-specific documented factor, or directly measured stack load; retain separate fuel activity records"
      inputs:
        - "Fuel use"
        - "heating value where applicable"
        - "factor or stack measurement"
      output: "kg of one named air substance"
      source_ids:
        - eu-pef-2021-2279
        - eu-bat-fdm-2019-2031
    - id: calc_water_pollutant_load
      applies_to: "Each final-effluent pollutant"
      rule: "load = time-matched effluent volume × measured concentration with unit conversion"
      inputs:
        - "Effluent flow"
        - "one pollutant concentration"
      output: "kg of one named pollutant to water"
      source_ids:
        - eu-bat-fdm-2019-2031
    - id: calc_mass_balance
      applies_to: "Each species-specific campaign"
      rule: "incoming botanical mass + measured additives = net released product + each measured botanical loss + measured retained or removed water + closing work in progress; investigate residual"
      inputs:
        - "Lot masses"
        - moisture
        - additives
        - screenings
        - dust
        - rejects
        - product
        - "work in progress"
      output: "Species- and style-specific balance and residual"
      source_ids:
        - codex-cxc-78-2017
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_species_identity
      applies_to: "Botanical input and reference output"
      requirement: "Scientific species, marketed plant part, supplier lot, and final style shall be verified and traceable; mixed-species records are invalid."
      evidence: "Supplier specification, identity test, lot ledger, release record"
    - id: dq_route_representativeness
      applies_to: "All processes"
      requirement: "Records shall represent the actual equipment, incoming state, drying route, microbial treatment, style, particle-size specification, packaging, site, and reporting period."
      evidence: "Process flow sheet, batch sheets, equipment logs, package BOM"
    - id: dq_meter_traceability
      applies_to: "Mass, water, energy, fuel, refrigerant, and emissions"
      requirement: "Retain calibration status, meter boundary, reading period, unit conversion, missing-data treatment, and reconciliation."
      evidence: "Calibration certificate, meter export, invoice, calculation workbook"
    - id: dq_no_default_quantity
      applies_to: "All inventory cards"
      requirement: "No source value in this PCR is a default amount. Each applicable amount shall come from foreground collection or a transparent calculation from collected records."
      evidence: "Record-to-card trace and calculation record"
    - id: dq_conditional_closure
      applies_to: "Conditional processes and cards"
      requirement: "Each conditional process and atomic exchange shall be marked applicable or not applicable with route evidence; silence is not evidence of zero."
      evidence: "Route declaration, equipment list, formulation, treatment and sanitation records"
    - id: dq_source_transparency
      applies_to: "Proxies, factors, allocation, and background links"
      requirement: "Disclose source, version, geography, technology, time, transformation, and reason for every proxy or factor."
      evidence: "Data-source register, calculation notes, DQR assessment"
    - id: dq_mass_and_release
      applies_to: "Botanical material and product"
      requirement: "Reconcile as-received and dry-basis mass, internal rework, each species-specific loss, packaging tare, and net conforming release."
      evidence: "Mass-balance worksheet, moisture results, release and scrap records"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "foreground_dataset_conformance"
    rule: "The reference flow UUID, Mass property UUID, Units-of-mass UUID, 1 kg amount, CPC 23924 identity, and required qualifiers shall all be present and consistent."
    source_ids: []
  - rule_id: validate_one_species_style
    applies_to: "foreground_dataset_conformance"
    rule: "Exactly one of the seven named species and one final style shall be active; reject a dataset that averages species or whole/cut/broken/cracked/ground/powdered styles."
    source_ids: []
  - rule_id: validate_atomic_exchange
    applies_to: "foreground_dataset_conformance"
    rule: "Every inventory card shall contain one concrete material, carrier, fuel, refrigerant, packaging component, waste stream, pollutant, or emission; reject category labels and selection instructions."
    source_ids: []
  - rule_id: validate_route_closure
    applies_to: "foreground_dataset_conformance"
    rule: "Washing, controlled drying, microbial reduction, milling, refrigerated storage, liquid sanitation, and on-site wastewater treatment shall each have an applicability decision supported by records."
    source_ids: []
  - rule_id: validate_uuid_gate
    applies_to: "foreground_dataset_conformance"
    rule: "The reference product UUID is the only populated Selected-flow UUID in this candidate; every other UUID shall remain blank until hybrid search and public state-100 direct read both confirm exact semantics."
    source_ids: []
  - rule_id: validate_quantity_provenance
    applies_to: "foreground_dataset_conformance"
    rule: "Every applicable quantity shall be foreground_record or calculated_value from collected records, except the fixed 1 kg reference output; reject uncited defaults, ranges, and undocumented estimates."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Species-specific input, moisture change, additives, product, rework, screenings, captured dust, rejected material, and work in progress shall close within the facility's documented measurement uncertainty; explain and correct material residuals."
    source_ids: []
  - rule_id: validate_energy_separation
    applies_to: "foreground_dataset_conformance"
    rule: "Electricity, purchased steam, purchased hot water, natural gas, diesel, LPG, and kerosene shall remain separate stage records; reject a combined energy or fuel total."
    source_ids: []
  - rule_id: validate_refrigerant_balance
    applies_to: "foreground_dataset_conformance"
    rule: "For every active R717, R744, or R290 system, makeup and direct air loss shall reconcile to opening, closing, and recovered charge records without mixing refrigerants."
    source_ids: []
  - rule_id: validate_wastewater_loads
    applies_to: "foreground_dataset_conformance"
    rule: "Each reported COD, BOD5, TOC, total nitrogen, total phosphorus, TSS, and chloride load shall use time-matched flow and concentration records and shall remain a separate emission."
    source_ids: []
  - rule_id: validate_packaging_exclusion
    applies_to: "foreground_dataset_conformance"
    rule: "Packaging inputs and scrap shall be complete by material, but no packaging mass may be included in the 1 kg net reference product."
    source_ids: []
  - rule_id: validate_bilingual_alignment
    applies_to: "foreground_dataset_conformance"
    rule: "English and Chinese process IDs, row IDs, ordered machine tokens, selected-flow identities, UUIDs, protocols, rule IDs, and source IDs shall match exactly."
    source_ids: []
published_dataset_profile:
  dataset_role: "Species-, style-, route-, site-, and period-specific foreground data package for manufacture of one CPC 23924 product"
  downstream_use: "Construction of factory-gate process datasets and lifecycle models with linked upstream botanical, utility, material, service, treatment, and packaging datasets"
  allowed_use: "Modelling the declared species, incoming state, manufacturing route, final style, particle-size specification, package, geography, and period"
  excluded_use: "Cross-species averages; unspecified processed spice; unprocessed CPC 01654 product; multi-species blend; essential oil, oleoresin, or extract; route or package not represented by the records"
  required_metadata: "Scientific species; plant part; incoming state and moisture basis; source origin; all process applicability decisions; drying and microbial-reduction route; final style and particle specification; package BOM; net release mass; site; period; storage duration; allocation; background links"
  required_quality_disclosure: "Meter and scale coverage; calibration; batch representativeness; moisture method; mass-balance residual; shared-resource allocation; emission calculation; wastewater sampling; refrigerant balance; proxies; data gaps; verification status"
  update_trigger: "Change in species, supplier state, drying or treatment technology, final style, particle specification, formulation, package, energy or refrigerant system, wastewater route, site, or reporting period; or material change in measured yield, loss, utility, or emission profile"
