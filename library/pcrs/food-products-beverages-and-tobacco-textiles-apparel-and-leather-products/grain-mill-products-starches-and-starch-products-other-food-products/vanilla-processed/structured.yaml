      uuid: ""
    required_unit: "kg/kg"
    rule: "Calculate the lot-specific ratio from measured accepted fresh-pod mass and measured net processed-vanilla mass. Use 4.5:1 to 6:1 only as an external typical QA interval, never as a substitute for foreground mass records."
