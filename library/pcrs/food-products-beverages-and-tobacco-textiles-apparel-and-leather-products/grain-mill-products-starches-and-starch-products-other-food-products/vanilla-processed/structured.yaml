system_boundary:
  rules:
    - rule_id: boundary_fresh_pod_start
      applies_to: "Covered route"
      rule: "Start at accepted mature fresh pods and include every curing and finishing process through packaged plant-gate product."
      source_ids:
        - fao-vanilla-postharvest
        - uf-ifas-vanilla-production
        - sanchez-2008-vanilla-killing
    - rule_id: boundary_complete_curing_chain
      applies_to: "Covered route"
      rule: "Killing, sweating/curing, staged drying, and conditioning/equilibration are distinct required foreground processes; none may be hidden in an aggregate processing row."
      source_ids:
        - fao-vanilla-postharvest
        - sanchez-2008-vanilla-killing
        - budiastra-2025-vanilla-curing
    - rule_id: boundary_selected_form
      applies_to: "Product form"
      rule: "Include only the conditional mechanical conversion matching selected_product_form; report each form as a separate lot or model."
      source_ids:
        - codex-rep25-sch-vanilla
        - iso-5565-1-1999
    - rule_id: boundary_extract_exclusion
      applies_to: "Extraction"
      rule: "Exclude solvent extraction, maceration, oleoresin production, and isolated vanillin; a separate PCR or explicitly extended model is required."
      source_ids:
        - iso-5565-1-1999
        - uf-ifas-vanilla-production
    - rule_id: boundary_used_inputs
      applies_to: "Utilities and materials"
      rule: "Include every actually used utility, fuel, refrigerant, ingredient, cleaning chemical, and packaging component as its own atomic exchange. If the representative cards below do not cover an actually used item, add one chemically or physically specific card rather than a collection label."
