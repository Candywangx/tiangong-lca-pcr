allocation_rules:
  - rule_id: allocation_avoid_by_separation
    applies_to: "All lots and selected forms"
    rule: "First avoid allocation by keeping species, grades, selected forms, process routes, and production lots physically or temporally separate. Never average whole, cut, powder, pulp-and-seeds, or extract production."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_common_curing_mass
    applies_to: "Common curing before grade separation"
    rule: "If multiple saleable cured grades are jointly produced and separate measurement cannot divide the common burden, allocate common burdens by measured conditioned-product dry mass; disclose moisture conversion."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_value_sensitivity
    applies_to: "Saleable grades or pod-skin/fines co-products"
    rule: "When products have materially different commercial functions or values, report an economic-allocation sensitivity using contemporaneous lot-level revenue while retaining dry-mass allocation as the base case."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_waste_no_credit
    applies_to: "Rejected pods, debris, wastewater, packaging waste"
    rule: "Assign waste handling to the generating process. Do not award avoided-product credit unless a documented recovery system and substitutable product are explicitly modelled."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_shared_sanitation
    applies_to: "Shared cleaning events"
    rule: "Allocate shared sanitation by documented equipment cleaning time, food-contact area, or processed throughput; state the selected driver and test alternatives when material."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_records
      process_id: "fresh_pod_receiving"
      flow_role: "received_fresh_vanilla_pods; accepted_fresh_vanilla_pods; rejected_fresh_vanilla_pods; vanilla_plant_debris"
      record_type: "weighbridge/scale and inspection log"
      raw_fields: "lot_id; species; origin; harvest_date; received_kg; rejected_kg; debris_kg; rejection_reason; disposition"
      collection_method: "Calibrated scale and lot inspection"
      unit: "kg"
      frequency: "Every received lot"
      temporal_coverage: "At least 12 consecutive months or all lots for a shorter campaign"
      site_scope: "Every facility in scope"
      aggregation_rule: "Sum masses by lot; calculate accepted mass; normalize by net packaged output"
      quality_evidence: "Calibration certificate; signed inspection log; lot photos; disposition record"
    - protocol_id: cp_killing_records
      process_id: "hot_water_killing"
      flow_role: "killing_fresh_pod_input; killing_hot_water; killing_electricity; killed_vanilla_pods; killing_wastewater; killing_water_to_air"
      record_type: "batch sheet, meter, and mass balance"
      raw_fields: "batch_id; pod_input_kg; water_makeup_kg; water_temperature_C_time_series; immersion_min; electricity_kWh; pod_output_kg; wastewater_kg; retained_water_kg"
      collection_method: "Calibrated scale, water meter, temperature logger, timer, electricity submeter"
      unit: "kg; °C; min; kWh"
      frequency: "Every killing batch"
      temporal_coverage: "Same period as reference product"
      site_scope: "Every killing unit in scope"
      aggregation_rule: "Sum batch records; calculate water-to-air by closed mass balance; reject negative residuals"
      quality_evidence: "Meter calibration; logger file; operator sign-off; mass-balance closure"
    - protocol_id: cp_sweating_records
