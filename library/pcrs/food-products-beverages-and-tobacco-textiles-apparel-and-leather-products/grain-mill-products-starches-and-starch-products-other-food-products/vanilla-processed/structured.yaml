process_map:
  - id: fresh_pod_receiving
    name: "Fresh-pod receiving and sorting"
    inclusion: "required"
    inclusion_condition: "Every covered lot."
    role: "Foreground receipt, identity control, and removal of unacceptable pods and plant debris."
    quantitative_reference: "kg accepted fresh pods"
  - id: hot_water_killing
    name: "Hot-water killing/blanching"
    inclusion: "required"
    inclusion_condition: "The selected reference route uses hot-water killing; another killing technology requires a separately reviewed route, not averaging."
    role: "Stop pod development and initiate curing reactions."
    quantitative_reference: "kg killed pods"
  - id: sweating_curing
    name: "Sweating/curing"
    inclusion: "required"
    inclusion_condition: "Every covered lot after killing."
    role: "Controlled warm, humid curing and aroma/color development."
    quantitative_reference: "kg sweated pods"
  - id: staged_drying
    name: "Staged drying"
    inclusion: "required"
    inclusion_condition: "Every covered lot; the declared passive, solar-assisted, or controlled-air technology determines electricity use."
    role: "Reduce moisture while preserving declared quality."
    quantitative_reference: "kg dried pods"
  - id: conditioning_equilibration
    name: "Conditioning and moisture equilibration"
    inclusion: "required"
    inclusion_condition: "Every covered lot after drying."
    role: "Stabilize aroma and moisture before grading."
    quantitative_reference: "kg conditioned pods"
  - id: grading_form_selection
    name: "Final sorting, grading, and form selection"
    inclusion: "required"
    inclusion_condition: "Every conditioned lot."
    role: "Separate conforming product, declared saleable grades, rejects, and the selected finishing route."
    quantitative_reference: "kg conforming conditioned vanilla"
  - id: cutting
    name: "Cutting cured vanilla"
    inclusion: "conditional"
    inclusion_condition: "Include only when selected_product_form = cut."
    role: "Mechanical size reduction to cut form."
    quantitative_reference: "kg cut vanilla"
  - id: grinding
    name: "Grinding cured vanilla"
    inclusion: "conditional"
    inclusion_condition: "Include only when selected_product_form = ground_or_powdered."
    role: "Mechanical size reduction to ground/powdered form."
    quantitative_reference: "kg ground or powdered vanilla"
  - id: pod_opening
    name: "Pod opening and pulp/seed separation"
    inclusion: "conditional"
    inclusion_condition: "Include only when selected_product_form = pulp_and_seeds."
    role: "Mechanically recover pulp and seeds without solvent extraction."
    quantitative_reference: "kg vanilla pulp and seeds"
  - id: packaging
    name: "Packaging and labelling"
    inclusion: "required"
    inclusion_condition: "Every selected product form; activate only the actual package-component cards."
    role: "Deliver declared net product at plant gate."
    quantitative_reference: "1,000 kg net packaged product"
  - id: lot_sanitation
    name: "Lot-attributable equipment and surface sanitation"
    inclusion: "required"
    inclusion_condition: "Include direct records or an explicit allocation of shared sanitation for every lot; chemical cards apply only when that chemical was used."
    role: "Food-hygiene support allocated to the covered lot."
    quantitative_reference: "1,000 kg net packaged product"
