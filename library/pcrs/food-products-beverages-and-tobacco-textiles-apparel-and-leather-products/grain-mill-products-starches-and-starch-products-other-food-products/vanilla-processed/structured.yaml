  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "Every inventory row"
      rule: "normalized_amount = lot_amount / net_packaged_processed_vanilla_kg × 1000"
      inputs:
        - lot_amount
        - net_packaged_processed_vanilla_kg
      output: "amount per 1,000 kg reference flow"
      source_ids:
        - "—"
    - id: calc_accepted_fresh_pods
      applies_to: "Receiving"
      rule: "accepted_fresh_pods_kg = received_fresh_pods_kg - rejected_fresh_pods_kg - vanilla_plant_debris_kg"
      inputs:
        - received_fresh_pods_kg
        - rejected_fresh_pods_kg
        - vanilla_plant_debris_kg
      output: "accepted_fresh_pods_kg"
      source_ids:
        - "—"
    - id: calc_stage_water_loss
      applies_to: "Killing, sweating, drying, conditioning"
      rule: "water_to_air_kg = input_mass_kg + water_input_kg - product_output_kg - solid_waste_kg - wastewater_or_condensate_kg; investigate and do not publish a negative residual."
      inputs:
        - "stage input/output masses"
        - "water input"
        - "solid wastes"
        - "wastewater/condensate"
      output: "water_to_air_kg"
      source_ids:
        - "—"
    - id: calc_net_packaged_product
      applies_to: "Packaging"
      rule: "net_packaged_processed_vanilla_kg = gross_packed_lot_kg - sum(packaging_component_mass_kg)"
      inputs:
        - "gross packed mass"
        - "each packaging-component mass"
      output: "net packaged processed vanilla mass"
      source_ids:
        - codex-rep25-sch-vanilla
    - id: calc_fresh_to_product_ratio
      applies_to: "Whole route"
      rule: "fresh_to_product_ratio = accepted_fresh_pods_kg / net_packaged_processed_vanilla_kg"
      inputs:
        - "accepted fresh pods"
        - "net packaged product"
      output: "kg/kg ratio"
      source_ids:
        - fao-vanilla-postharvest
    - id: calc_active_cleaning_chemical
      applies_to: "Sanitation chemicals"
      rule: "active_chemical_kg = formulation_kg × supplier_declared_active_mass_fraction"
      inputs:
        - "formulation mass"
        - "active mass fraction"
      output: "active NaOH or peracetic-acid mass"
      source_ids:
        - "—"
    - id: calc_dry_mass_allocation
      applies_to: "Joint saleable cured products"
      rule: "allocation_share_i = product_i_kg × (1 - moisture_fraction_i) / sum(product_j_kg × (1 - moisture_fraction_j))"
      inputs:
        - "product masses"
        - "moisture fractions"
      output: "dry-mass allocation shares"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and intermediates"
      requirement: "Preserve lot linkage from fresh pods to packaged product and declare species, origin, selected form, grade, moisture, and package configuration."
      evidence: "Receiving, process, laboratory, and packaging lot records"
    - id: dq_temporal
      applies_to: "Foreground inventory"
      requirement: "Cover at least 12 consecutive months when production is year-round; for a shorter campaign, cover every lot and disclose campaign dates."
      evidence: "Dated raw records and production calendar"
    - id: dq_technology
      applies_to: "Killing, sweating, drying, conditioning, finishing"
      requirement: "Report actual equipment and schedules; do not mix passive and controlled routes or mutually exclusive form processes into one unqualified average."
      evidence: "Equipment list, route gate, logger exports, batch sheets"
    - id: dq_mass_balance
      applies_to: "Every mass-transforming process"
      requirement: "Reconcile measured inputs to product, waste, wastewater/condensate, and calculated water loss; investigate material residuals and disclose corrections."
      evidence: "Signed mass-balance worksheet and calibration evidence"
    - id: dq_energy
      applies_to: "Electricity"
      requirement: "Prefer submeters; otherwise use verified equipment power × operating time and disclose allocation. Do not use a combined thermal-energy amount."
      evidence: "Meter export or equipment calculation worksheet"
    - id: dq_atomicity
      applies_to: "All inventory"
      requirement: "One card equals one physical or chemical exchange. Any actually used fuel, steam, hot water, refrigerant, chemical, packaging component, waste, or emission absent from these representative cards must be added as a specific atomic exchange with blank UUID until verified."
      evidence: "Atomic-flow audit and purchase/emission records"
    - id: dq_quality_test
      applies_to: "Finished product"
      requirement: "Use the declared method and species/form/class specification; preserve sample identity, result, wet/dry basis, method version, and laboratory."
      evidence: "Laboratory report and sampling chain of custody"
    - id: dq_sources
      applies_to: "External constraints"
      requirement: "Preserve source id and retrieved reference; never use a search snippet as quantitative evidence."
      evidence: "Source register matching Section 11"
    - id: dq_reasoned_estimate
      applies_to: "Provisional ranges"
      requirement: "Replace each reasoned_estimate with foreground or reviewed external evidence before using it as a publication-critical conformance interval; test both bounds when material."
      evidence: "Sensitivity worksheet and replacement status"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Foreground package"
    rule: "Fail if PCR id, reference-flow UUID, species, selected product form, net reference mass, or production lot is missing or inconsistent."
    source_ids:
      - unsd-cpc3-23928
      - codex-rep25-sch-vanilla
  - rule_id: validate_route_chain
    applies_to: "Process coverage"
    rule: "Fail unless receiving, hot-water killing, sweating, staged drying, conditioning, grading/form selection, packaging, and sanitation are represented for the lot."
    source_ids:
      - fao-vanilla-postharvest
      - sanchez-2008-vanilla-killing
  - rule_id: validate_form_gate
    applies_to: "Conditional processes"
    rule: "Fail if more than one of cutting, grinding, or pod opening is active for the same reference output, or if the active process does not match selected_product_form."
    source_ids:
      - codex-rep25-sch-vanilla
      - iso-5565-1-1999
  - rule_id: validate_extraction_excluded
    applies_to: "Boundary"
    rule: "Fail if ethanol, another extraction solvent, extract, oleoresin, isolated vanillin, or extraction residue is included as part of the reference route."
    source_ids:
      - iso-5565-1-1999
      - uf-ifas-vanilla-production
  - rule_id: validate_atomic_flows
    applies_to: "Inventory"
    rule: "Fail any card whose selected flow combines more than one utility, fuel, refrigerant, material, chemical, packaging component, waste, wastewater, or emission."
    source_ids:
      - "—"
  - rule_id: validate_uuid_policy
    applies_to: "UUID references"
    rule: "Fail if an inventory flow other than the Section 3 reference identity carries an unverified UUID; unresolved atomic flow names remain UUID-blank until exact Tiangong verification."
    source_ids:
      - "—"
  - rule_id: validate_mass_balance
    applies_to: "Each process"
    rule: "Fail negative masses or unexplained duplicate counting; flag any material mass residual outside the facility's documented scale uncertainty."
    source_ids:
      - "—"
  - rule_id: validate_moisture_quality
    applies_to: "Finished product"
    rule: "Fail if the declared moisture result is absent or checked against an averaged or wrong species/form/class requirement; for representative *V. planifolia* whole Class I, require 30–36% w/w."
    source_ids:
      - codex-rep25-sch-vanilla
  - rule_id: validate_pest_extraneous
    applies_to: "Finished product"
    rule: "Require live-insect count and applicable extraneous-matter result; the cited Codex table sets live insects to zero for covered forms."
    source_ids:
      - codex-rep25-sch-vanilla
  - rule_id: validate_packaging
    applies_to: "Packaging"
    rule: "Fail if gross and net product mass are conflated or if the active package configuration lacks component-level masses."
    source_ids:
      - fao-vanilla-postharvest
      - codex-rep25-sch-vanilla
  - rule_id: validate_used_utility_coverage
    applies_to: "Utilities and direct emissions"
    rule: "Fail when operating or purchase records show a fuel, steam, refrigerant, cleaning chemical, or direct emission that has no specific atomic row and collection method."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_source_closure
    applies_to: "Evidence"
    rule: "Fail if a non-empty source id in a rule or card is absent from Section 11, or if a quantitative external range lacks its cited source."
    source_ids:
      - "—"
  - rule_id: validate_protocol_coverage
    applies_to: "Collected/calculated rows"
    rule: "Fail if a collected_record or calculated_from_collection card lacks a matching collection protocol and required raw fields."
    source_ids:
      - "—"
published_dataset_profile:
  dataset_role: "Foreground production data package for processed vanilla and its process/lifecyclemodel projections."
  downstream_use: "secondary_dataset; background_dataset after review and publication controls."
  allowed_use: "LCA of cured and mechanically finished vanilla in the declared species, form, grade, moisture, route, geography, period, and package configuration."
  excluded_use: "Vanilla extract, oleoresin, isolated or synthetic vanillin, unprocessed vanilla, an undeclared mixture of forms/routes, or comparative claims beyond the represented technology and geography."
  required_metadata: "PCR id/version; reference-flow UUID; species; origin and harvest facts; lot; selected form; grade; moisture/method; killing/sweating/drying/conditioning schedules; package BOM; allocation; geography; period; source ids; data gaps."
  required_quality_disclosure: "Foreground coverage; mass-balance closure; meter and scale calibration; laboratory methods; route-specific zero/not-applicable decisions; unresolved UUIDs; reasoned-estimate sensitivity; allocation sensitivity; exclusions."
  update_trigger: "New reviewed process/yield evidence; change in Codex or ISO vanilla specification; new killing/drying/form technology; package redesign; material change in energy, water, loss, moisture, or allocation; resolution of inventory UUIDs."
data_sources:
  - id: "unsd-cpc3-23928"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Draft CPC Version 3.0 Explanatory Notes, code 23928, pp. 109–110. https://unstats.un.org/unsd/classifications/Meetings/UNCEISC2024_2nd/Session7_Bk2_CPC3_Exp_Notes_1Nov2024.pdf (retrieved 2026-08-13)"
    used_for: "Classification scope: processed forms included; unprocessed vanilla excluded."
  - id: "codex-rep25-sch-vanilla"
    type: "standard"
    reference: "Codex Alimentarius Commission, REP25/SCH, Appendix III, Standard for spices derived from dried or dehydrated fruits and berries—requirements for vanilla, pp. 24–29. https://www.fao.org/fao-who-codexalimentarius/sh-proxy/fr/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FMeetings%252FCX-736-08%252F%25E2%2598%2585Final%252520report%252FREP25_SCHe.pdf (retrieved 2026-08-13)"
    used_for: "Species and product styles; moisture/vanillin cells; extraneous matter and live insects; hygiene; package and label facts; analytical methods."
  - id: "codex-cac49-vanilla-adoption"
    type: "official_guidance"
    reference: "Codex Alimentarius, “CAC49 / New and revised science-based standards now added to the Codex Alimentarius,” 12 July 2026. https://www.fao.org/fao-who-codexalimentarius/news-and-events/news-details/en/c/1760016/ (retrieved 2026-08-13)"
    used_for: "Confirms CAC49 adoption of the vanilla standard text."
  - id: "iso-5565-1-1999"
    type: "standard"
    reference: "ISO 5565-1:1999, Vanilla—Part 1: Specification. https://www.iso.org/standard/22116.html (retrieved 2026-08-13)"
    used_for: "Covered pod/bulk/cut/powder forms and explicit exclusion of vanilla extracts."
  - id: "fao-vanilla-postharvest"
    type: "official_guidance"
    reference: "Food and Agriculture Organization of the United Nations, *Vanilla: Post-harvest Operations*. https://www.fao.org/fileadmin/user_upload/inpho/docs/Post_Harvest_Compendium_-_Vanilla.pdf (retrieved 2026-08-13)"
    used_for: "Receiving, killing, sweating, sun/slow drying, conditioning, grading, packaging, monitoring, and 4.5:1–6:1 green-to-conditioned mass ratio."
  - id: "uf-ifas-vanilla-production"
    type: "extension_guidance"
    reference: "University of Florida IFAS Extension, *Natural Vanilla Extract Production*, EP656. https://ask.ifas.ufl.edu/publication/EP656 (retrieved 2026-08-13)"
    used_for: "Curing-stage decomposition, representative conditions, grading/moisture context, conditioning/storage, and separation of later ethanol extraction."
  - id: "sanchez-2008-vanilla-killing"
    type: "literature"
    reference: "Sánchez, H. A. Zavaleta, K. N. Waliszewski, and V. Sánchez (2008), “The effect of killing conditions on the structural changes in vanilla pods during the curing process,” *International Journal of Food Science & Technology* 43(8):1452–1457. https://doi.org/10.1111/j.1365-2621.2007.01691.x"
    used_for: "Four-phase curing chain, purpose of killing, hot-water schedules, and separation of killing from sweating/drying/conditioning."
  - id: "budiastra-2025-vanilla-curing"
    type: "literature"
    reference: "Budiastra, Nelwan, and Distriani (2025), “Improvement of cured vanilla pod qualities with a combination of advanced sweating and drying methods,” *Jurnal Keteknikan Pertanian* 13(1):147–161. https://doi.org/10.19028/jtep.013.1.147-161"
    used_for: "Hot-water withering, sweating/drying route decomposition, moisture endpoint context, and technology-specific duration evidence."
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management—Life cycle assessment—Requirements and guidelines (confirmed current in 2022; Amendments 1 and 2 noted by ISO). https://www.iso.org/standard/38498.html (retrieved 2026-08-13)"
    used_for: "Goal/scope, inventory, allocation, data quality, reporting, and review framework."
