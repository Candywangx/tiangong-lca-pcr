system_boundary:
  rules:
    - rule_id: boundary_route_steps
      applies_to: "controlled tea manufacture"
      rule: "Include every route step actually performed between the declared starting condition and made tea, including route-applicable withering or heat treatment, rolling or maceration, oxidation or fermentation, drying, grading, and handling; mark steps that do not apply rather than assuming one route for all tea forms."
      source_ids:
        - fao-tea-processing-2005
    - rule_id: boundary_packaging
      applies_to: "immediate packaged product"
      rule: "Include filling, tea-bag or inner-pack formation when applicable, immediate container components, labels and closures, attributable secondary or tertiary packaging, packaging losses, and packaging-line energy needed to place the reference product on the market."
      source_ids:
        - eu-pef-2021
        - iso-3720-2011
        - iso-11287-2011
    - rule_id: boundary_upstream_links
      applies_to: "inputs outside foreground control"
      rule: "Link excluded upstream production, inbound transport, utilities, ingredients, packaging manufacture, and waste treatment through explicit upstream datasets; justify and disclose any omitted process."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_outputs
      applies_to: "foreground outputs"
      rule: "Identify the reference packaged tea, saleable co-products, recoverable by-products, off-grade tea, tea residues, packaging scrap, wastewater, dust, and direct combustion or process emissions when they occur."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_no_silent_scope_shift
      applies_to: "product identity and starting condition"
      rule: "Do not use the category representative flow to conceal a different tea form, a package above 3 kg, an extract or beverage, or a gate-to-gate starting condition that lacks the required upstream dataset links."
      source_ids:
        - un-cpc-v3-23913
