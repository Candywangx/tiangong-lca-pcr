              - role: default_estimate
                lower: "0"
                upper: "5"
                unit: "kg"
                basis: "per 1 kg net conforming packaged tea output"
                basis_kind: "process_output"
                evidence_kind: "reasoned_estimate"
                source_ids: []
allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared foreground processes"
    rule: "Avoid allocation first by separately metering and subdividing route, product, and packaging operations; use system expansion only when the substituted function and dataset are explicit and justified."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical
    applies_to: "unavoidable shared burdens"
    rule: "When subdivision or justified system expansion is not possible, use a measurable physical relationship that reflects how the shared input or process burden changes with the products, and document the factor and period."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_other_relationship
    applies_to: "shared burdens lacking a defensible physical relationship"
    rule: "Use another relationship, including economic allocation only as a last resort, with product values, reference period, currency, factor calculation, and a sensitivity check disclosed."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_residue_status
    applies_to: "tea residues, off-grade tea, recovered dust, rework, and packaging scrap"
    rule: "Determine and document whether each output is a co-product, by-product, rework, recyclable material, or waste before applying allocation or credit; do not assign avoided burden merely because an output leaves the site."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_consistency
    applies_to: "multi-product reporting period"
    rule: "Apply one declared allocation hierarchy consistently to all shared foreground utilities, cleaning, storage, and packaging-area burdens and reconcile allocated totals to the unallocated facility total."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_recipe_and_route_records
      process_id: "tea_primary_manufacture_tea_finishing_blending"
      flow_role: "Tea identity, recipe, and route"
      record_type: "Batch route sheet and approved product specification"
      raw_fields: "batch_id; tea_type; material_form; oxidation_or_fermentation_state; process_steps; ingredient_ids; ingredient_quantities; treatment; moisture_basis"
      collection_method: "Reconcile approved recipe and executed batch route; retain deviations and release decision"
      unit: "kg and declared route fields"
      frequency: "Every batch"
      temporal_coverage: "Same period as foreground inventory"
      site_scope: "Every represented site and product route"
      aggregation_rule: "Mass-weight route records by conforming net output; do not combine undeclared tea forms"
      quality_evidence: "Signed route sheet; approved specification; batch release record"
    - protocol_id: cp_tea_material_receipts
      process_id: "tea_primary_manufacture_tea_finishing_blending"
      flow_role: "Fresh leaf, made tea, and ingredients received"
      record_type: "Calibrated scale ticket, goods receipt, supplier lot record"
      raw_fields: "date; supplier; lot_id; material_identity; origin; gross_mass; tare; net_mass; moisture; accepted_mass; rejected_mass; upstream_dataset_id"
      collection_method: "Reconcile scale tickets to goods receipts and lot inventory"
      unit: "kg as received; moisture in declared basis"
      frequency: "Every receipt or batch"
      temporal_coverage: "Same period as foreground inventory"
      site_scope: "All suppliers and sites represented"
      aggregation_rule: "Sum accepted mass by material identity and route; preserve supplier coverage"
      quality_evidence: "Scale calibration; receipt reconciliation; supplier certificate where applicable"
    - protocol_id: cp_energy_and_fuel_records
      process_id: "tea_primary_manufacture_tea_finishing_blending_tea_immediate_packaging"
      flow_role: "Electricity, fuel, and purchased heat"
      record_type: "Submeter, main meter, fuel receipt, run-time allocation record"
      raw_fields: "meter_id; opening; closing; unit; fuel_identity; purchased_quantity; stock_change; process_time; allocation_key; conversion_factor"
      collection_method: "Prefer process submetering; reconcile allocated values to site meters and purchases"
      unit: "Raw meter or purchase unit; converted kWh or MJ when needed"
      frequency: "Per batch, shift, or meter interval"
      temporal_coverage: "At least one representative year or the full shorter campaign"
      site_scope: "Every represented site"
      aggregation_rule: "Sum by energy carrier; allocate only residual shared use under section 7"
      quality_evidence: "Meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_water_records
      process_id: "tea_primary_manufacture_tea_finishing_blending"
      flow_role: "Supplied water and wastewater"
      record_type: "Water meter, discharge meter, cleaning log, treatment record"
      raw_fields: "source; opening; closing; use_area; discharge_volume; stock_or_evaporation_basis; destination; treatment"
      collection_method: "Meter process and cleaning water where possible; otherwise reconcile a documented water balance"
      unit: "m3 or kg"
      frequency: "Per meter interval and cleaning event"
      temporal_coverage: "Same period as foreground inventory"
      site_scope: "Every represented site"
      aggregation_rule: "Sum supply and discharge by source and destination; normalize to process output"
      quality_evidence: "Meter calibration; water balance; treatment invoice or log"
    - protocol_id: cp_packaging_bom_records
      process_id: "tea_immediate_packaging"
      flow_role: "Immediate, secondary, and tertiary packaging"
      record_type: "Approved BOM, component specification, unit-mass test, issue and return record"
      raw_fields: "sku; package_net_content; component_id; material; unit_mass; units_issued; units_returned; conforming_packs; rejects; shipment_allocation"
      collection_method: "Verify component unit mass and reconcile BOM issues, returns, output, and waste"
      unit: "g or kg per component; package content in kg"
      frequency: "Every SKU and production campaign"
      temporal_coverage: "Same period as foreground inventory"
      site_scope: "All packaging formats represented"
      aggregation_rule: "Calculate component mass per net kg output; keep components and materials separate"
      quality_evidence: "Approved BOM; calibrated unit-mass test; inventory reconciliation; label record"
    - protocol_id: cp_output_and_inventory_records
      process_id: "tea_primary_manufacture_tea_finishing_blending_tea_immediate_packaging"
      flow_role: "Intermediate and final product output"
      record_type: "Calibrated scale, production count, stock and release record"
      raw_fields: "batch_id; product_identity; gross_mass; tare; net_tea_mass; packaging_mass; pack_count; net_content_per_pack; moisture; stock_change; disposition"
      collection_method: "Reconcile weighed output and pack count to released stock and declared net content"
      unit: "kg net tea; kg packaging; count"
      frequency: "Every batch"
      temporal_coverage: "Same period as foreground inventory"
      site_scope: "Every represented product and site"
      aggregation_rule: "Sum conforming net output; keep packaging mass and nonconforming dispositions separate"
      quality_evidence: "Scale calibration; legal metrology or label check; release and stock reconciliation"
    - protocol_id: cp_waste_and_emission_records
      process_id: "tea_primary_manufacture_tea_finishing_blending_tea_immediate_packaging"
      flow_role: "Residues, rejects, packaging waste, wastewater, and direct emissions"
      record_type: "Waste scale ticket, transfer note, treatment invoice, emissions monitor, fuel calculation record"
      raw_fields: "material_or_substance; mass_or_volume; origin_process; disposition; treatment; compartment; monitor_result; activity_data; factor_source"
      collection_method: "Measure transferred material; calculate emissions only from collected activity data and a cited factor method"
      unit: "kg, m3, or measured concentration and flow"
      frequency: "Every transfer or monitoring interval"
      temporal_coverage: "Same period as foreground inventory"
      site_scope: "Every represented site"
      aggregation_rule: "Sum separately by identity, disposition, treatment, and environmental compartment"
      quality_evidence: "Scale ticket; transfer note; treatment receipt; monitor calibration; cited calculation sheet"
  calculation_rules:
    - id: calc_net_reference_output
      applies_to: "Packaged-tea output"
      rule: "Net reference output = sum of conforming pack count multiplied by verified net tea content per pack; cross-check against released net product mass and exclude all packaging mass."
      inputs:
        - conforming_packs
        - net_content_per_pack
        - released_net_tea_mass
      output: "kg net conforming packaged tea"
      source_ids:
        - un-cpc-v3-23913
    - id: calc_packaging_component_mass
      applies_to: "Each packaging component"
      rule: "Component mass per kg reference flow = (units issued minus units returned minus separately recorded unused stock) multiplied by verified unit mass, divided by net conforming packaged-tea output."
      inputs:
        - units_issued
        - units_returned
        - unused_stock
        - unit_mass
        - net_reference_output
      output: "kg component per kg net packaged tea"
      source_ids: []
    - id: calc_flow_normalization
      applies_to: "Foreground input and output rows"
      rule: "Normalized amount = reporting-period amount attributable to the product divided by net conforming reference output in the same period."
      inputs:
        - attributable_flow_amount
        - net_reference_output
      output: "flow amount per kg net packaged tea"
      source_ids: []
    - id: calc_tea_mass_balance
      applies_to: "Each controlled tea process"
      rule: "Mass-balance discrepancy = tea-material inputs plus applicable ingredients minus conforming tea outputs minus separately recorded co-products, rework transfers, samples, waste, and stock change; investigate and disclose unexplained discrepancy rather than forcing it to zero."
      inputs:
        - tea_material_inputs
        - ingredient_inputs
        - product_outputs
        - co_products
        - rework
        - samples
        - waste
        - stock_change
      output: "kg discrepancy and percentage of tea-material input"
      source_ids: []
    - id: calc_shared_burden_allocation
      applies_to: "Shared foreground utilities and services"
      rule: "Allocated amount = reconciled shared total multiplied by the documented allocation factor selected under section 7; the sum over products shall equal the shared total subject only to disclosed rounding."
      inputs:
        - shared_total
        - allocation_basis_by_product
        - selected_method
      output: "allocated amount by product"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and tea inputs"
      requirement: "Preserve tea type, form, route, ingredient or treatment status, origin, moisture basis, package configuration, and CPC eligibility at batch or SKU level."
      evidence: "Approved specification, route sheet, label, supplier lot record, and iso-3720-2011 or iso-11287-2011 where applicable"
    - id: dq_temporal_coverage
      applies_to: "All foreground quantities"
      requirement: "Use a continuous representative reporting period, normally at least 12 months; if a shorter campaign is used, disclose seasonality, start and end dates, and why it represents the product."
      evidence: "Meter intervals, production calendar, batch register, and coverage statement"
    - id: dq_site_supplier_coverage
      applies_to: "Multi-site and purchased-material datasets"
      requirement: "State represented production share by site and supplier; identify gaps and do not present uncovered routes as measured."
      evidence: "Site output totals, purchase ledger, supplier dataset register, and coverage calculation"
    - id: dq_measurement_traceability
      applies_to: "Mass, water, energy, packaging, and emission records"
      requirement: "Retain instrument identity, calibration status, raw unit, conversion factors, and reconciliation to independent totals."
      evidence: "Calibration certificates, raw exports, invoices, scale tickets, BOM tests, and reconciliation worksheets"
    - id: dq_background_representativeness
      applies_to: "Upstream datasets"
      requirement: "Select datasets matching the declared geography, technology, material identity, and time as closely as available; disclose every proxy and material data gap."
      evidence: "Dataset references, selection rationale, proxy log, and eu-pef-2021 data-quality assessment"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Demonstrate coverage of all controlled route and packaging steps, all mass-bearing tea and packaging flows, energy and water, wastes, and relevant direct emissions; quantify or justify exclusions."
      evidence: "Process map, mass and energy reconciliation, waste register, boundary diagram, and exclusion log"
validation_rules:
  - rule_id: validate_category_scope
    applies_to: "declared reference product"
    rule: "Confirm that the product is green, black, or partly fermented tea in an immediate packing whose net content is not greater than 3 kg and is not an excluded extract, instant preparation, beverage, herbal infusion, or maté product."
    source_ids:
      - un-cpc-v3-23913
  - rule_id: validate_specific_form
    applies_to: "product identity"
    rule: "Require the concrete tea form, fermentation or oxidation state, presentation, processing route, ingredients or treatments, and packaging configuration; reject an unspecified category-only identity."
    source_ids:
      - iso-3720-2011
      - iso-11287-2011
  - rule_id: validate_representative_flow_use
    applies_to: "Tiangong reference flow"
    rule: "Require a documented search for a more specific real product flow; when the category-labelled UUID is retained, label it as representative and reject any claim that it silently identifies a different narrower tea form."
    source_ids: []
  - rule_id: validate_reference_mass
    applies_to: "quantitative reference"
    rule: "Confirm that the reference amount is exactly 1 kg net conforming tea content and that all immediate and distribution packaging masses are excluded from that amount and inventoried separately."
    source_ids: []
  - rule_id: validate_starting_condition
    applies_to: "foreground boundary"
    rule: "Require the declared fresh-leaf or made-tea starting condition and upstream dataset links for all production outside foreground control; reject an undisclosed gate-to-gate scope shift."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_route_coverage
    applies_to: "process inventory"
    rule: "Confirm that every controlled, route-applicable manufacture, finishing, and packaging step is represented and that non-applicable steps are explicitly marked."
    source_ids:
      - fao-tea-processing-2005
      - eu-pef-2021
  - rule_id: validate_packaging_bom
    applies_to: "packaging inventory"
    rule: "Reconcile immediate, secondary, and tertiary packaging component quantities to BOM, issue and return records, pack counts, waste, and net output for every represented format."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_mass_balance
    applies_to: "tea-material inventory"
    rule: "Calculate and report process-level tea mass-balance discrepancy; investigate unexplained loss and never force a balance by inserting an undocumented flow."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "shared foreground burdens"
    rule: "Confirm that subdivision or system expansion was considered first, all residual allocation factors are documented, and allocated totals reconcile to facility totals."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_data_quality
    applies_to: "reporting-period dataset"
    rule: "Report temporal, geographical, technological, site, supplier, and measurement coverage; list proxies, exclusions, missing upstream datasets, and incomplete checks as limitations."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground packaged-tea production dataset built from measured or reconciled records, with explicit upstream dataset links"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA process and lifecycle-model projections for the declared tea form, route, geography, reporting period, and packaging configuration; comparison only after checking equivalent functional unit, scope, data quality, and allocation"
  excluded_use: "Silent substitution for another tea form or package size; use for herbal infusions, maté, extracts, instant tea, or ready-to-drink beverages; claims beyond the represented sites, suppliers, routes, or period; use of the representative UUID as proof of a narrower product identity"
  required_metadata: "PCR id and version state; CPC eligibility; specific tea form and route; starting condition; geography; reporting period; site and supplier coverage; net content and complete packaging BOM; moisture basis; upstream datasets and proxies; allocation method; reference-flow identity decision"
  required_quality_disclosure: "Raw-record coverage; calibration and reconciliation status; mass-balance discrepancy; temporal, geographical, and technological representativeness; exclusions; missing upstream links; allocation sensitivity; use of category representative flow; unresolved data gaps"
  update_trigger: "Change in tea type or form, starting material, route or technology, ingredient or treatment, packaging format or net content, site or supplier mix, energy system, waste treatment, allocation basis, Tiangong identity availability, or a material shift in measured inventory"
