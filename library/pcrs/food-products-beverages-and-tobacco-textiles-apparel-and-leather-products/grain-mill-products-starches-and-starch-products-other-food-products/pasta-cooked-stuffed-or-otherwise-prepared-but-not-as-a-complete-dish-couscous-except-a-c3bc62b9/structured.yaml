allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Multi-product lines and shared operations"
    rule: "First separate product routes, time periods, meters and directly measured material balances so burdens are assigned without allocation wherever practicable."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rework_internal
    applies_to: "Rework returned within the represented foreground system"
    rule: "Treat internal rework as an intermediate transfer and do not assign it a second upstream burden or report it as a waste output."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "Shared cleaning, refrigeration, storage, compressed air and utilities"
    rule: "Use a documented causal physical driver such as metered use, equipment time, cleaning cycle, occupied storage time or throughput; do not default to net product mass when another driver better represents causality."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_coproducts
    applies_to: "Saleable co-products or recovered materials leaving the system"
    rule: "Report quantity, state, destination and economic status separately; prefer physical causal allocation when justified and use economic allocation only when physical relationships cannot be supported, with method and sensitivity disclosed."
    source_ids:
      - iso-14044-2006
      - iso-14067-2018
  - rule_id: allocation_waste_treatment
    applies_to: "Wastes and wastewater"
    rule: "Keep collection and on-site treatment in the foreground; link off-site treatment by destination and state, and disclose any recycling or substitution credit rather than silently netting it from the inventory."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "ingredient_preparation_forming_and_filling"
      flow_role: "Cereal, filling and other formulation inputs"
      record_type: "Weighing, receiving and batch issue records"
      raw_fields: "material_id; supplier_lot; product_lot; gross_mass; tare_mass; net_mass; moisture_or_solids_basis; rework_flag"
      collection_method: "Calibrated scale or verified receiving/issue system reconciled to batch recipe and inventory movement"
      unit: "kg"
      frequency: "Each receipt or batch issue"
      temporal_coverage: "At least the declared representative reporting period, covering all included product lots"
      site_scope: "All represented lines and sites"
      aggregation_rule: "Sum net mass by material and product lot; allocate only documented shared issues"
      quality_evidence: "Scale calibration, lot traceability, inventory reconciliation and exception log"
    - protocol_id: cp_water_by_use
      process_id: "ingredient_preparation_thermal_processing_cleaning_and_wastewater"
      flow_role: "Ingredient, process, cooling and cleaning water"
      record_type: "Meter, batch-dose and water-balance records"
      raw_fields: "meter_id; timestamp; opening_reading; closing_reading; batch_volume; water_use; recycled_volume; density_basis"
      collection_method: "Submeter preferred; otherwise verified batch dosing or reconciled site water balance"
      unit: "kg"
      frequency: "Continuous or each batch/cycle"
      temporal_coverage: "Representative reporting period including seasonal or campaign variation"
      site_scope: "Each represented line, circuit and site"
      aggregation_rule: "Sum by use; subtract only documented recirculated quantity not withdrawn anew; normalize to released product"
      quality_evidence: "Meter calibration, potable-water evidence where required and balance residual review"
    - protocol_id: cp_energy_by_operation
      process_id: "forming_and_filling_thermal_processing_finishing_and_packaging"
      flow_role: "Electricity, heat, steam, fuel and refrigeration energy"
      record_type: "Meter, invoice and equipment operating records"
      raw_fields: "carrier; meter_id; opening_reading; closing_reading; equipment_id; operating_time; load; calorific_value_basis; storage_duration"
      collection_method: "Submeter by operation; otherwise allocation from verified meter totals using causal equipment records"
      unit: "kWh; MJ"
      frequency: "Continuous, batch or billing interval"
      temporal_coverage: "Full reporting period with production shutdowns and storage time represented"
      site_scope: "Each represented line and shared utility system"
      aggregation_rule: "Sum by carrier and operation; document conversions and allocation drivers; normalize to released product"
      quality_evidence: "Meter/invoice reconciliation, conversion worksheet and allocation sensitivity"
    - protocol_id: cp_intermediate_balance
      process_id: "ingredient_preparation_forming_and_filling_thermal_processing_finishing_and_packaging"
      flow_role: "Intermediate transfers and mass balance"
      record_type: "Batch transfer and stock records"
      raw_fields: "product_lot; opening_stock; inputs; transfer_mass; closing_stock; rework; rejects; moisture_basis"
      collection_method: "Calibrated transfer scales or opening-plus-input-minus-closing calculation"
      unit: "kg"
      frequency: "Each batch or lot"
      temporal_coverage: "All included product lots in reporting period"
      site_scope: "Each represented process hand-off"
      aggregation_rule: "Reconcile matched upstream output and downstream input; investigate unmatched transfers"
      quality_evidence: "Batch genealogy, scale calibration and signed reconciliation"
    - protocol_id: cp_waste_mass_destination
      process_id: "ingredient_preparation_forming_and_filling_finishing_and_packaging"
      flow_role: "Food rejects, spills, off-spec product and packaging scrap"
      record_type: "Waste scale, container and shipment records"
      raw_fields: "waste_type; source_process; gross_mass; tare_mass; moisture_basis; rework_status; destination; ticket_id"
      collection_method: "Weigh at generation or destination; distinguish internal rework from waste crossing the boundary"
      unit: "kg"
      frequency: "Each batch or shipment"
      temporal_coverage: "Full reporting period"
      site_scope: "All represented lines and waste destinations"
      aggregation_rule: "Sum net waste by type, state and destination; no netting against inputs"
      quality_evidence: "Scale records, transfer tickets, destination evidence and rework reconciliation"
    - protocol_id: cp_reference_output_and_quality
      process_id: "thermal_processing_finishing_and_packaging"
      flow_role: "Conforming product output and release state"
      record_type: "Production and quality release records"
      raw_fields: "product_id; lot_id; net_mass; moisture_or_solids; filling_status; route; temperature_state; packaging_state; release_result"
      collection_method: "Calibrated product scale linked to lot release and declared test methods"
      unit: "kg; %; °C where applicable"
      frequency: "Each released lot"
      temporal_coverage: "All included lots in reporting period"
      site_scope: "All represented products, lines and sites"
      aggregation_rule: "Sum only released conforming net edible mass; exclude packaging and separately record rejected lots"
      quality_evidence: "Scale calibration, product specification, laboratory or process-control result and release authorization"
    - protocol_id: cp_wastewater_volume_load
      process_id: "thermal_processing_cleaning_and_wastewater"
      flow_role: "Wastewater by treatment destination"
      record_type: "Flow meter, water balance and sampling records"
      raw_fields: "discharge_point; flow; sampling_time; parameter; concentration; treatment_route; sludge_or_residue"
      collection_method: "Metered flow and representative sampling under the site monitoring plan"
      unit: "kg; m3; mg/L or site reporting unit"
      frequency: "Continuous flow where available and scheduled representative sampling"
      temporal_coverage: "Full reporting period including cleaning peaks"
      site_scope: "Every included discharge point and treatment route"
      aggregation_rule: "Sum flow by destination; calculate loads only from temporally matched flow and concentration; avoid duplicate elementary reporting"
      quality_evidence: "Meter calibration, chain of custody, laboratory method and sampling representativeness review"
    - protocol_id: cp_direct_emissions
      process_id: "thermal_processing"
      flow_role: "On-site combustion emissions"
      record_type: "Fuel meter and emission-factor record"
      raw_fields: "fuel_type; fuel_amount; energy_basis; factor_id; factor_value; pollutant; control_state"
      collection_method: "Calculate each pollutant from measured fuel use and reviewed applicable factor or direct monitoring"
      unit: "kg; MJ"
      frequency: "Reporting interval or monitored event"
      temporal_coverage: "Full reporting period"
      site_scope: "All attributable on-site combustion units"
      aggregation_rule: "Sum by pollutant and unit; allocate with documented causal driver"
      quality_evidence: "Fuel reconciliation, factor version and unit check, monitoring QA where used"
    - protocol_id: cp_packaging_mass
      process_id: "finishing_and_packaging"
      flow_role: "Packaging by material"
      record_type: "Packaging issue and scrap records"
      raw_fields: "packaging_id; material; issued_mass; returned_mass; scrap_mass; packed_units; product_lot"
      collection_method: "Calibrated scale or supplier unit mass verified by periodic weighing"
      unit: "kg"
      frequency: "Each lot or packaging campaign"
      temporal_coverage: "Full reporting period"
      site_scope: "All included packaging formats"
      aggregation_rule: "Issued minus returned mass, reconciled with packed units and scrap; normalize separately from product mass"
      quality_evidence: "Supplier specification, check-weigh results and packaging balance"
    - protocol_id: cp_refrigerant_loss
      process_id: "finishing_and_packaging"
      flow_role: "Refrigerant emitted to air"
      record_type: "Charge, make-up, recovery and service records"
      raw_fields: "refrigerant_id; opening_charge; added_mass; recovered_mass; closing_charge; equipment_id; operating_period"
      collection_method: "Verified mass balance for each refrigeration system"
      unit: "kg"
      frequency: "Each service event and annual/reporting-period close"
      temporal_coverage: "Full reporting period including leakage and maintenance"
      site_scope: "All attributable refrigeration equipment"
      aggregation_rule: "Calculate loss by refrigerant; allocate shared systems by documented cooling load or storage driver"
      quality_evidence: "Service certificate, cylinder weights and charge reconciliation"
    - protocol_id: cp_cleaning_agent_use
      process_id: "cleaning_and_wastewater"
      flow_role: "Cleaning and sanitation chemicals"
      record_type: "Issue, dosing and concentration records"
      raw_fields: "chemical_id; product_mass; solution_volume; concentration; circuit; cleaning_cycle"
      collection_method: "Metered dosing or verified issue mass reconciled to cleaning schedule"
      unit: "kg"
      frequency: "Each cleaning cycle or issue"
      temporal_coverage: "Full reporting period"
      site_scope: "All represented cleaning circuits"
      aggregation_rule: "Sum as-used product mass by chemical; do not confuse formulated product mass with active ingredient"
      quality_evidence: "Doser calibration, safety/specification sheet and inventory reconciliation"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "Every foreground inventory row"
      rule: "normalized amount = reporting-period amount / reporting-period net released reference-product mass"
      inputs:
        - "Unnormalized row total"
        - "net released product mass from cp_reference_output_and_quality"
      output: "Amount per 1 kg net released product"
      source_ids: []
    - id: calc_intermediate_balance
      applies_to: "Each process hand-off"
      rule: "calculated transfer = opening stock + measured inputs - closing stock - measured rejects - separately recorded losses; compare with downstream receipt"
      inputs:
        - "Matched batch mass fields from cp_intermediate_balance"
      output: "Reconciled intermediate transfer and residual"
      source_ids: []
    - id: calc_water_balance
      applies_to: "Water uses and wastewater"
      rule: "withdrawal = retained product water + evaporation + wastewater + other measured outputs + closing storage - opening storage; report rather than force-close the residual"
      inputs:
        - Water-use
        - "product moisture"
        - "wastewater and storage records"
      output: "Water-balance residual and normalized use by purpose"
      source_ids: []
    - id: calc_direct_emission
      applies_to: "Each on-site fuel and pollutant"
      rule: "direct emission = measured fuel quantity on the declared basis × reviewed applicable emission factor; no factor may be inserted without source and unit review"
      inputs:
        - "Fuel record"
        - "factor id"
        - "value and units"
      output: "Pollutant mass by elementary flow"
      source_ids: []
    - id: calc_refrigerant_loss
      applies_to: "Each refrigeration system"
      rule: "refrigerant loss = opening charge + additions - recovered mass - closing charge, adjusted only for documented transfers"
      inputs:
        - Charge
        - make-up
        - "recovery and closing records"
      output: "Refrigerant loss by substance"
      source_ids: []
    - id: calc_shared_operation_allocation
      applies_to: "Shared utilities and support operations"
      rule: "allocated amount = measured shared total × documented product-specific causal driver / sum of the same driver for all products"
      inputs:
        - "Shared total and selected physical driver"
      output: "Product-attributed shared amount with allocation factor"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and reference flow"
      requirement: "Demonstrate that each represented product is within CPC 23721 and is not a complete dish; retain formulation, filling, route, state and packaging qualifiers."
      evidence: "Product specification, label, batch record and CPC scope review using un-cpc-3-23721"
    - id: dq_temporal
      applies_to: "All foreground data"
      requirement: "Use a representative period that captures product mix, cleaning, storage and seasonal or campaign variation; disclose shutdowns, abnormal lots and substitutions."
      evidence: "Dated source records, production schedule and representativeness statement"
    - id: dq_completeness
      applies_to: "Process map and inventory"
      requirement: "Reconcile every required process and each applicable conditional process; quantify material, water, energy, waste and direct-emission gaps rather than treating missing records as zero."
      evidence: "Completeness matrix, mass/water/energy reconciliation and gap log"
    - id: dq_measurement
      applies_to: "Measured rows"
      requirement: "Use calibrated or verified instruments and retain raw totals before normalization; document estimation, conversion and allocation separately."
      evidence: "Calibration certificates, meter checks, invoices, batch records and calculation workbook"
    - id: dq_food_safety_state
      applies_to: "Product-contact water, heat treatment, cooling and cold chain"
      requirement: "Retain evidence that the declared operation and market state were produced under applicable hygiene, HACCP and temperature controls; this PCR does not replace food-safety compliance."
      evidence: "HACCP records, potable-water evidence, process-control records and eu-ec-852-2004"
    - id: dq_provisional_ranges
      applies_to: "Every reasoned_estimate range"
      requirement: "Treat the range only as a candidate-stage QA screen; replace it with representative foreground distribution or reviewed source evidence and document reviewer acceptance before publication."
      evidence: "Range-replacement log, foreground statistics or reviewed source record"
    - id: dq_uuid_resolution
      applies_to: "Non-reference inventory flows"
      requirement: "Resolve and independently verify Tiangong UUID, flow property and unit group before publication; until then retain the semantic candidate without a fabricated UUID."
      evidence: "Tiangong readback record and reviewer sign-off"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The reference output shall use Tiangong product-flow UUID 1312d181-2dd0-4af3-b938-c38ed2342c7d, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, kg, and exactly 1 kg net product excluding packaging."
    source_ids:
      - un-cpc-3-23721
  - rule_id: validate_category_and_qualifiers
    applies_to: "Dataset identity"
    rule: "Reject a dataset that represents a complete dish, omits the complete-dish exclusion, or lacks product form, principal cereal, filling status, preparation and preservation route, market state, packaging scope, geography or reporting period."
    source_ids:
      - un-cpc-3-23721
  - rule_id: validate_process_coverage
    applies_to: "Process inventory"
    rule: "Require all required process ids and every applicable conditional operation; each not-applicable filling, drying, cooling, freezing or packaging decision shall be explicit."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_mass_balance
    applies_to: "Material inventory"
    rule: "Reconcile cereal, filling, other material and water inputs with released product, intermediates, rework, wastes, wastewater and disclosed losses on consistent moisture bases; flag unexplained residuals using the dataset's reviewed threshold."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_no_double_count
    applies_to: "Intermediate, rework, wastewater and emissions"
    rule: "Reject duplicate upstream burdens on internal intermediates or rework, duplicate water withdrawal and wastewater quantities, and duplicate pollutant reporting both inside a wastewater treatment dataset and as a direct elementary emission."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_couscous_claim
    applies_to: "Codex-claiming couscous route"
    rule: "When the dataset claims Codex CXS 202-1995 conformity, require durum-wheat or explicitly qualified alternative cereal identity, potable-water use, cooking and drying route, declared test method and moisture not exceeding 13.5%; do not apply this rule to other products."
    source_ids:
      - codex-cxs-202-1995
  - rule_id: validate_food_safety_records
    applies_to: "Product-contact water, steam, cooling and cold chain"
    rule: "Require applicable hygiene/HACCP evidence and prevent non-potable water or unsafe recycled water from being represented as product-contact water without authority-backed suitability evidence."
    source_ids:
      - eu-ec-852-2004
  - rule_id: validate_provisional_estimates
    applies_to: "Reasoned-estimate ranges"
    rule: "Candidate QA guardrails shall not be interpreted as measured values or publication defaults; publication review must replace or explicitly accept every provisional range with documented rationale."
    source_ids: []
  - rule_id: validate_unresolved_identities
    applies_to: "Inventory flow identities"
    rule: "Fail publication readiness while any non-reference UUID required by the implemented inventory remains unresolved or unverified; never infer UUIDs from names alone."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package for prepared pasta, noodles, dumplings or couscous that is not a complete dish."
  downstream_use: "secondary_dataset; background_dataset; downstream process and lifecyclemodel projections after review."
  allowed_use: "Product-specific factory-gate modelling when the declared formulation, route, temperature state, geography, reporting period, packaging scope and data quality are representative."
  excluded_use: "Complete dishes or meals; uncooked unstuffed pasta; unqualified substitution across materially different filled, dried, chilled, frozen or shelf-stable routes; food-safety certification; use of provisional QA ranges as measured defaults."
  required_metadata: "Canonical PCR id and version; CPC mapping context; reference UUID and amount; product and cereal identity; filling and formulation class; processing and preservation route; moisture or solids basis; market and packaging state; geography; site and technology; reporting period; allocation method; upstream datasets; unresolved identities."
  required_quality_disclosure: "Foreground coverage; meter and scale quality; sampling and calculation methods; mass, water and energy residuals; conditional process decisions; allocation drivers; data gaps; provisional range replacements; wastewater and waste destinations; refrigerant and direct-emission treatment."
  update_trigger: "Change in formulation, filling class, cereal source, process technology, cooking/drying/freezing route, packaging, site, energy or water system, wastewater treatment, allocation method, data age or source/UUID review that materially changes representativeness."
data_sources:
  - id: "un-cpc-3-23721"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Draft CPC Version 3.0 Explanatory Notes, subclass 23721, https://unstats.un.org/unsd/classifications/Meetings/UNCEISC2024_2nd/Session7_Bk2_CPC3_Exp_Notes_1Nov2024.pdf (retrieved 2026-08-11)"
    used_for: "Product scope, included prepared pasta/noodle/dumpling/couscous forms, complete-dish exclusion and classification identity."
