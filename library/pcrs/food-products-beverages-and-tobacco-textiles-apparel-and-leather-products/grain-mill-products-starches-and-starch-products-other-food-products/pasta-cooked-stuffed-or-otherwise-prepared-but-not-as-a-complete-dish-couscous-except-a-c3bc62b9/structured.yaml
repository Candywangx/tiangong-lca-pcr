system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "Foreground manufacturing system"
      rule: "Include every on-site operation from receipt of ingredients through release of the declared factory-gate product, including shared cleaning and wastewater generation allocated to the product; model upstream supplies and off-site treatments through linked datasets."
