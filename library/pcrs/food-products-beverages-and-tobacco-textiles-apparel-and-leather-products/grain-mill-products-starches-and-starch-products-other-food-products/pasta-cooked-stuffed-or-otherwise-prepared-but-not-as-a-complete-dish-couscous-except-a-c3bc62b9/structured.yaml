        - eu-jrc-fdm-bref-2019
        - iso-14044-2006
    - rule_id: boundary_category_exclusion
      applies_to: "Product scope"
      rule: "Exclude complete dishes and meals and exclude uncooked pasta that is neither stuffed nor otherwise prepared; document any mixed-product line decision against the declared CPC 23721 scope."
      source_ids:
        - un-cpc-3-23721
    - rule_id: boundary_route_conditionals
      applies_to: "Conditional operations"
      rule: "Include filling, drying, cooling, freezing and packaging only when performed for the represented product, and record an explicit not-applicable decision rather than assuming the operation is absent."
      source_ids:
        - un-cpc-3-23721
        - eu-jrc-fdm-bref-2019
    - rule_id: boundary_food_safety_utilities
      applies_to: "Product-contact water, steam, cooling and cold chain"
