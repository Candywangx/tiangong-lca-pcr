  unresolved_uuid_references:
    - food-grade wheat or meslin grain input with correct product classification and Mass reference property
    - wheat bran, germ, middlings, and other saleable milling fractions with correct product classifications and Mass reference property
    - purchased electricity and fuel flows with appropriate energy properties and unit groups for the supplier geography
    - packaging material flows matching the actual bill of materials
    - compartment-specific particulate-matter elementary flows for measured releases
  source_review_notes:
    - EPD International PCR 2013:04 version 3.0.5 is retained only as category and method context; its stated validity ended on 2026-05-30.
    - Codex CXS 152-1985 applies only to common-wheat and club-wheat flour within that standard's scope; it is not applied automatically to meslin, wholemeal, durum, or other excluded flour products.
  quantitative_screening_notes:
    - Milling-energy screening range 0.18749 to 0.28037 MJ per kg flour is literature-derived and must be replaced by site meter data; it is not a default inventory value.
    - Conventional refined-flour extraction screening range 72 to 76 percent is industry-reference evidence and does not apply as a limit to wholemeal or product-specific high-extraction routes.
