    used_for: "Lot moisture records, tempering method, milling stream measurement, and flour-yield calculation protocol"
  - id: "asb-extraction-rate"
    type: "handbook"
    reference: "American Society of Baking, Extraction Rate, https://asbe.org/article/extraction-rate/?topic=analytical-methods"
    used_for: "Extraction-rate definition and 72-76% screening context for efficient conventional refined flour milling"
  - id: "odunfa-joel-flour-milling-energy-2022"
    type: "literature"
    reference: "Odunfa M. K. and Joel O. T., Energy audit and conservation opportunities in flour milling industry in Nigeria, Global Journal of Engineering and Technology Advances 13(1), 2022, DOI 10.30574/gjeta.2022.13.1.0120"
    used_for: "Reported 187.49-280.37 MJ per tonne milling-stage energy-intensity range used only as a contextual QA screen"
