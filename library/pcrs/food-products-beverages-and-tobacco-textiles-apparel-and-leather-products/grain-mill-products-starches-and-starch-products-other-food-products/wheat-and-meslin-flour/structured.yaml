  calculation_rules:
    - id: calc_rule_1
      applies_to: "inventory normalization"
      rule: "Divide every attributable foreground amount by released finished-flour mass on the same as-produced basis."
      inputs:
        - "attributable amount"
        - "released flour mass"
      output: "amount per 1 kg finished flour"
      source_ids: []
    - id: calc_rule_2
      applies_to: "dry-matter balance"
      rule: "dry_mass = as_produced_mass × (1 - moisture_fraction); apply separately to each input and output lot."
      inputs:
        - "as-produced mass"
        - "measured moisture"
      output: "kg dry matter"
      source_ids:
        - usda-ars-soft-wheat-milling-methods
    - id: calc_rule_3
      applies_to: "extraction rate"
      rule: "extraction_rate_percent = finished_flour_mass / clean_conditioned_grain_to_first_break × 100; state which flour streams are included."
      inputs:
        - "finished flour mass"
        - "clean conditioned grain mass"
      output: "extraction rate, %"
      source_ids:
        - asb-extraction-rate
        - usda-ars-soft-wheat-milling-methods
    - id: calc_rule_4
      applies_to: "energy conversion"
      rule: "MJ = kWh × 3.6; do not convert primary-energy literature values into electricity without a documented primary-energy factor."
      inputs:
        - "metered kWh"
      output: "final energy, MJ"
      source_ids: []
    - id: calc_rule_5
      applies_to: "process mass balance"
      rule: "Reconcile grain, tempering water, retained ingredients, outputs, waste, measured releases, and stock change on both as-produced and dry-matter bases; investigate unexplained differences before release."
      inputs:
        - "all process inputs"
        - outputs
        - moisture
        - "and stock change"
      output: "balance closure and unexplained difference"
      source_ids:
        - eu-pef-method-2021
    - id: calc_rule_6
      applies_to: "allocation"
      rule: "Apply the ordered hierarchy in section 7 to the reconciled joint inventory and retain unallocated quantities and factors for audit."
      inputs:
        - "joint inventory"
        - "co-product quantities"
        - "causal relation or economic data"
      output: "allocated inventory per reference flow"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: quality_req_1
      applies_to: "representativeness"
      requirement: "Cover the declared technology, geography, flour grades, grain mix, and operating seasons; use at least 12 months when seasonal sourcing or mill operation materially changes results, or justify a shorter representative campaign."
      evidence: "production schedule, product mix, supplier and meter coverage"
    - id: quality_req_2
      applies_to: "metrology"
      requirement: "Use calibrated mass, moisture, dosing, and energy instruments; identify estimation and shared-meter allocation separately."
      evidence: "calibration certificates, laboratory methods, invoices, allocation worksheets"
    - id: quality_req_3
      applies_to: "mass_balance"
      requirement: "Close as-produced and dry-matter balances across each process and the full mill; explain stock changes, rework, evaporation, and all material residuals."
      evidence: "signed reconciliation with unresolved-difference review"
    - id: quality_req_4
      applies_to: "product_conformity"
      requirement: "Record the applicable food specification. For products within CXS 152 scope, verify declared requirements including moisture not exceeding 15.5% by mass; do not apply this limit automatically outside that scope."
      evidence: "release certificate and cited specification"
    - id: quality_req_5
      applies_to: "source_linkage"
      requirement: "Resolve product, energy, packaging, co-product, waste, and elementary flows to semantically correct datasets before publication; document every remaining gap without substituting a similar but incorrect UUID."
      evidence: "UUID review record and unresolved-flow register"
    - id: quality_req_6
      applies_to: "uncertainty"
      requirement: "Treat extraction and energy ranges as screening evidence only; replace them with site observations and disclose range context, sample count, variation, and any outliers."
      evidence: "raw data summary and uncertainty statement"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference_flow"
    rule: "Require exactly one 1 kg as-produced finished-flour reference output using product flow 2e07a69d-fe87-4f0f-9d12-b50ecdb9d8b4, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "product_identity"
    rule: "Require every reference-flow qualifier in section 3, including wheat/meslin composition, flour grade and extraction basis, moisture basis, treatments or additives, packaging state, geography, and applicable specification."
    source_ids:
      - codex-cxs-152-2023
  - rule_id: validation_rule_3
    applies_to: "process_completeness"
    rule: "Require all four process ids in section 6 and a documented reason for any operation reported as not applicable or outsourced."
    source_ids:
      - us-epa-ap42-wheat-milling-2003
  - rule_id: validation_rule_4
    applies_to: "mass_and_moisture_balance"
    rule: "Require reconciled as-produced and dry-matter balances and investigate any unexplained difference beyond the reporting mill's documented metering uncertainty."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_rule_5
    applies_to: "co_products_and_allocation"
    rule: "Require every saleable milling fraction, the multifunctionality hierarchy, allocation factors, and sensitivity disclosure where the allocation choice is material."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_rule_6
    applies_to: "emissions_and_waste"
    rule: "Reject double counting of captured dust as both waste and air emission; require an air compartment and particle-size definition for particulate elementary flows."
    source_ids:
      - us-epa-ap42-wheat-milling-2003
  - rule_id: validation_rule_7
    applies_to: "source_and_uuid_integrity"
    rule: "Reject search snippets, invented identifiers, version-pinned UUID substitutions, or semantically mismatched flows; unresolved non-reference flows must remain explicit until a verified link is available."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "codex_scope"
    rule: "For a product claiming CXS 152 conformity, require evidence that the product is within that standard's scope and verify its applicable composition, hygiene, packaging, labelling, and moisture requirements; otherwise do not make the claim."
    source_ids:
      - codex-cxs-152-2023
published_dataset_profile:
  dataset_role: "Plant-specific foreground mill-gate dataset for wheat or meslin flour production"
  downstream_use: "Background input to food, feed, starch, ingredient, or other product systems where the declared flour matches the user's required specification"
  allowed_use: "Comparative or non-comparative LCA after checking geography, technology, grain mix, flour grade, allocation, packaging, and temporal representativeness"
  excluded_use: "Direct representation of durum semolina, other cereal flour, isolated starch or gluten, prepared dough, bakery product, or a different flour grade without adjustment"
  required_metadata: "Plant geography; reference period; technology; wheat/rye shares; species or grain class; flour grade and extraction basis; moisture; additives, fortification, bleaching, or treatment; packaging BOM or bulk state; process coverage; upstream dataset choices; co-products and allocation; applicable food specification"
  required_quality_disclosure: "Primary-data share; meter and lot coverage; mass-balance closure; uncertainty; screening-range use; allocation sensitivity; unresolved dataset links; deviations from this PCR"
  update_trigger: "Material change in grain mix, flour grade, extraction, process technology, energy supply, product formulation, packaging, allocation, regulation or specification, or data older than the declared representativeness period"
data_sources:
  - id: "codex-cxs-152-2023"
    type: "standard"
    reference: "Codex Alimentarius, CXS 152-1985 Standard for Wheat Flour, amended 2023, https://www.fao.org/input/download/standards/50/CXS_152e.pdf"
    used_for: "Product scope for common and club wheat flour; definition, moisture, ingredient, hygiene, packaging, and labelling controls; applied only within the standard's scope"
  - id: "us-epa-ap42-wheat-milling-2003"
    type: "official_guidance"
    reference: "US EPA, AP-42 Section 9.9.1 Grain Elevators and Processes, wheat flour milling section, final 2003, https://www.epa.gov/sites/default/files/2020-10/documents/c9s0909-1.pdf"
    used_for: "Mill process decomposition, cleaning and tempering operations, milling and fractionation, material handling, and particulate-source coverage"
  - id: "epd-pcr-grain-mill-products-2013-04"
