allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "process_subdivision"
    rule: "Avoid allocation by separately metering cleaning, tempering, milling, blending, packaging, and independently operated product lines wherever technically possible."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rule_2
    applies_to: "joint_milling_inventory"
    rule: "Before allocation, keep flour, bran, germ, middlings, and other saleable fractions in one reconciled joint mass balance; do not classify a saleable co-product as waste solely to avoid allocation."
    source_ids:
      - eu-pef-method-2021
      - us-epa-ap42-wheat-milling-2003
  - rule_id: allocation_rule_3
    applies_to: "multifunctionality_hierarchy"
    rule: "Where subdivision cannot resolve multifunctionality, apply system expansion or substitution when a defensible displaced function is documented; otherwise use a relevant physical causal relationship, and use another relationship such as economic allocation only when physical causality cannot be established."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rule_4
    applies_to: "allocation_disclosure"
    rule: "Report the selected method, allocation factors, quantities, moisture basis, price geography and averaging period if economic allocation is used, and a sensitivity result for any material choice."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_grain_lot_mass_quality
      process_id: "grain_receiving_cleaning"
      flow_role: "received grain and clean grain"
      record_type: "weighbridge, intake, and laboratory records"
      raw_fields: "lot id; supplier; species; wheat/rye shares; gross and net mass; moisture; quality class; rejection"
      collection_method: "Calibrated scale plus representative moisture and quality sampling"
      unit: "kg; mass %"
      frequency: "each lot"
      temporal_coverage: "all lots in representative period"
