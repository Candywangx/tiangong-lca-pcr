system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins with accepted shell eggs and utility/material inputs crossing the processor gate and ends with refrigerated pasteurized liquid whole egg in the declared bulk tote at the processor cold-store gate. Upstream shell-egg production, electricity generation, purchased steam production, natural-gas supply, water supply, chemical manufacture, and packaging manufacture are linked as upstream datasets rather than recreated in this foreground package."
      source_ids: []
    - rule_id: boundary_required_operations
      applies_to: "foreground process map"
      rule: "Include receipt/breaking, filtration/blending, thermal pasteurization/rapid cooling, bulk filling/refrigerated storage, and CIP/wastewater handling."
      source_ids:
        - codex-cxc-15-1976
        - usda-fsis-egg-products
        - beitia-et-al-2024
    - rule_id: boundary_raw_treated_separation
      applies_to: "facility and inventory scope"
      rule: "Keep raw shell-egg and untreated-liquid operations physically and record-wise separate from pasteurized product, packaging, and finished cold storage."
      source_ids:
        - codex-cxc-15-1976
        - cfia-egg-preventive-controls
    - rule_id: boundary_product_form_gate
      applies_to: "all datasets"
      rule: "Include only unformulated thermally pasteurized refrigerated liquid whole egg; reject any average with yolk, albumen, frozen, dried, cooked, stabilized, or non-thermal routes."
      source_ids:
        - usda-fsis-egg-products
        - cfia-egg-preventive-controls
    - rule_id: boundary_thermal_supply_gate
      applies_to: "pasteurization and CIP heat"
      rule: "Select either purchased steam or on-site natural-gas heat for each reporting period. If both are used, meter them separately by batch; never substitute a weighted generic heat carrier."
      source_ids:
        - jrc-fdm-bref-2019
    - rule_id: boundary_refrigeration_gate
      applies_to: "cooling and cold storage"
      rule: "The representative route is an R717 ammonia system. Other refrigerants are outside this route and require separately named atomic input and emission cards before use."
      source_ids:
        - ipcc-2019-refrigeration
    - rule_id: boundary_packaging_gate
      applies_to: "bulk filling"
      rule: "Use the declared LDPE-lined reusable stainless-steel bulk-tote route; exclude consumer cartons, HDPE pails, bag-in-box, tanker, and aseptic ambient packaging from this dataset."
      source_ids:
        - beitia-et-al-2024
    - rule_id: boundary_wastewater_gate
      applies_to: "wastewater outputs"
      rule: "Select off-site treatment as one wastewater waste flow or on-site treatment with separately measured direct-to-water elementary flows. Do not report both for the same wastewater mass."
      source_ids:
        - us-epa-egg-processing-waste-1971
