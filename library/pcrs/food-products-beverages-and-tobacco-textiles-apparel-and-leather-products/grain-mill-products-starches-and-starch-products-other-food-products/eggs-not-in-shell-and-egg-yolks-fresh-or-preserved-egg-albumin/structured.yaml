allocation_rules:
  - rule_id: allocation_avoid_by_batch
    applies_to: "all unit operations"
    rule: "Partition utilities, cleaning cycles, losses, and packaging by measured batch, line, operating time, and mass throughput before allocation."
    source_ids:
      - jrc-fdm-bref-2019
  - rule_id: allocation_no_product_form_average
    applies_to: "product outputs"
    rule: "Never allocate a combined whole-egg/yolk/albumen/frozen/dried campaign into this reference product. Maintain separate campaign records and datasets."
    source_ids:
      - cfia-egg-preventive-controls
  - rule_id: allocation_eggshell_route
    applies_to: "eggshell output"
    rule: "Treat eggshell as waste unless a separately weighed output meets a product specification and has a documented consignee. If it is a coproduct, apply economic allocation using contemporaneous net revenue and disclose the sensitivity to mass allocation."
    source_ids:
      - us-epa-egg-processing-waste-1971
  - rule_id: allocation_rework
    applies_to: "diverted or off-spec liquid egg"
    rule: "Return conforming rework to its originating batch where traceable; otherwise treat it as a separately measured input to the receiving batch and disclose the transfer. Waste is never credited as rework."
    source_ids:
      - cfia-egg-preventive-controls
  - rule_id: allocation_reusable_tote
    applies_to: "stainless-steel tote service"
    rule: "Allocate tote manufacture and end-of-life by verified lifetime trips or item-uses; allocate wash utilities to the actual cleaning cycle."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_and_product_mass_records
      process_id: "shell_egg_receipt_and_breaking_filtration_and_whole_egg_blending_thermal_pasteurization_and_rapid_cooling_bulk_filling_and_refrigerated_storage"
      flow_role: "raw_intermediate_and_final_product_mass"
      record_type: "batch_mass_record"
      raw_fields: "batch_id; supplier_lot; product_state; gross_mass; tare_mass; net_mass; timestamp; scale_id; disposition"
      collection_method: "calibrated_scale_tank_load_cell_or_mass_totalizer"
      unit: "kg"
      frequency: "each_batch_and_transfer"
      temporal_coverage: "complete_reporting_period"
      site_scope: "foreground_facility_and_declared_gate"
      aggregation_rule: "reconcile_each_transfer_then_normalize_to_reference_product_mass"
      quality_evidence: "calibration_certificate; signed_batch_record; mass_balance"
    - protocol_id: cp_electricity_records
      process_id: "shell_egg_receipt_and_breaking_filtration_and_whole_egg_blending_thermal_pasteurization_and_rapid_cooling_bulk_filling_and_refrigerated_storage_cip_and_wastewater_management"
      flow_role: "unit_operation_electricity"
      record_type: "meter_and_runtime_record"
      raw_fields: "meter_id; opening_kwh; closing_kwh; timestamp; process_id; runtime_h; rated_kw; allocation_basis; production_mass_kg"
      collection_method: "revenue_meter_submeter_or_validated_runtime_allocation"
      unit: "kWh"
      frequency: "continuous_or_each_batch"
      temporal_coverage: "complete_reporting_period"
      site_scope: "foreground_facility"
      aggregation_rule: "submeter_first_else_runtime_times_rated_load_then_normalize"
      quality_evidence: "utility_invoice; meter_calibration; runtime_log; allocation_worksheet"
    - protocol_id: cp_water_and_wastewater_records
      process_id: "shell_egg_receipt_and_breaking_thermal_pasteurization_and_rapid_cooling_cip_and_wastewater_management"
      flow_role: "water_intake_recirculation_wastewater_and_direct_discharge"
      record_type: "meter_and_composite_sample_record"
      raw_fields: "meter_id; intake_m3; recirculated_m3; makeup_m3; discharge_m3; route; sample_id; bod5_mg_l; cod_mg_l; total_n_mg_l; total_p_mg_l; tss_mg_l; timestamp"
      collection_method: "calibrated_flowmeter_and_accredited_composite_sampling"
      unit: "m3; mg/L"
      frequency: "daily_and_each_sampling_event"
      temporal_coverage: "complete_reporting_period"
      site_scope: "foreground_facility_and_discharge_point"
      aggregation_rule: "reconcile_net_withdrawal_and_discharge_then_calculate_each_pollutant_mass"
      quality_evidence: "meter_calibration; chain_of_custody; accredited_lab_report; permit_record"
    - protocol_id: cp_thermal_utility_records
      process_id: "shell_egg_receipt_and_breaking_thermal_pasteurization_and_rapid_cooling_cip_and_wastewater_management"
      flow_role: "steam_and_hot_water"
      record_type: "utility_meter_record"
      raw_fields: "route; meter_id; carrier_quantity; unit; pressure; inlet_temperature_c; outlet_temperature_c; condensate_return; timestamp; process_id; production_mass_kg"
      collection_method: "steam_meter_flowmeter_and_temperature_pressure_log"
      unit: "kg; m3; MJ; °C"
      frequency: "continuous_or_each_batch"
      temporal_coverage: "complete_reporting_period"
      site_scope: "foreground_facility"
      aggregation_rule: "calculate_net_thermal_energy_then_normalize_without_route_averaging"
      quality_evidence: "meter_calibration; sensor_calibration; supplier_invoice; cycle_log"
    - protocol_id: cp_fuel_and_combustion_records
      process_id: "thermal_pasteurization_and_rapid_cooling"
      flow_role: "natural_gas_and_combustion_emissions"
      record_type: "fuel_meter_and_factor_record"
      raw_fields: "fuel_type; quantity; unit; lower_heating_value_mj_unit; boiler_id; technology; timestamp; process_id; co2_factor; ch4_factor; n2o_factor; factor_source"
      collection_method: "custody_transfer_meter_and_documented_factor_calculation"
      unit: "kg; m3; MJ; kg_emission"
      frequency: "continuous_or_each_reporting_period"
      temporal_coverage: "complete_reporting_period"
      site_scope: "foreground_boiler"
      aggregation_rule: "fuel_energy_times_substance_specific_factor_then_normalize"
      quality_evidence: "fuel_invoice; meter_calibration; heating_value_certificate; boiler_record; factor_citation; calculation_sheet"
    - protocol_id: cp_refrigerant_records
      process_id: "thermal_pasteurization_and_rapid_cooling_bulk_filling_and_refrigerated_storage"
      flow_role: "r717_charge_makeup_recovery_and_loss"
      record_type: "refrigerant_mass_balance_record"
      raw_fields: "refrigerant=R717_ammonia; equipment_id; opening_charge_kg; purchases_kg; additions_kg; recovered_kg; transferred_kg; closing_charge_kg; incident_loss_kg; service_date"
      collection_method: "service_log_cylinder_scale_and_annual_mass_balance"
      unit: "kg"
      frequency: "each_service_event_and_annual_reconciliation"
      temporal_coverage: "complete_reporting_period"
      site_scope: "foreground_refrigeration_system"
      aggregation_rule: "loss=opening_charge+purchases+additions-recovered-transferred-closing_charge"
      quality_evidence: "purchase_invoice; service_log; scale_calibration; leak_detection_record; reconciliation"
    - protocol_id: cp_cleaning_chemical_records
      process_id: "shell_egg_receipt_and_breaking_cip_and_wastewater_management"
      flow_role: "sodium_hypochlorite_sodium_hydroxide_nitric_acid_and_peracetic_acid"
      record_type: "chemical_issue_and_concentration_record"
      raw_fields: "chemical_name; solution_mass_kg; active_fraction; batch_id; dosing_pump_id; cycle_id; return_mass_kg; timestamp; process_id"
      collection_method: "inventory_issue_dosing_meter_and_concentration_test"
      unit: "kg_solution; kg_active"
      frequency: "each_cleaning_cycle"
      temporal_coverage: "complete_reporting_period"
      site_scope: "foreground_sanitation_system"
      aggregation_rule: "calculate_active_mass_by_named_chemical_then_normalize_separately"
      quality_evidence: "supplier_coa; dosing_calibration; concentration_test; cip_recipe_log"
    - protocol_id: cp_cip_cycle_records
      process_id: "cip_and_wastewater_management"
      flow_role: "cip_water_energy_chemicals_and_wastewater"
      record_type: "cip_cycle_record"
      raw_fields: "cycle_id; equipment_id; recipe_id; water_m3; electricity_kwh; thermal_utility_quantity; chemical_name; chemical_mass_kg; wastewater_m3; start_time; end_time; allocated_product_mass_kg"
      collection_method: "validated_cip_controller_meter_issue_log_and_cycle_reconciliation"
      unit: "m3; kWh; kg; h"
      frequency: "each_cip_cycle"
      temporal_coverage: "complete_reporting_period"
      site_scope: "foreground_cip_system"
      aggregation_rule: "reconcile_each_cycle_and_allocate_once_to_linked_production_lots"
      quality_evidence: "controller_export; meter_calibration; chemical_issue_log; operator_signoff; cycle_mass_balance"
    - protocol_id: cp_packaging_records
      process_id: "bulk_filling_and_refrigerated_storage"
      flow_role: "ldpe_liner_and_reusable_stainless_steel_tote"
      record_type: "packaging_issue_and_asset_record"
      raw_fields: "batch_id; liner_count; liner_tare_kg; tote_id; tote_capacity_kg; tote_tare_kg; lifetime_trip_count; current_trip; damaged_scrap_kg; disposition"
      collection_method: "warehouse_issue_log_sampled_tare_and_asset_register"
      unit: "kg; item-use"
      frequency: "each_filling_batch"
      temporal_coverage: "complete_reporting_period"
      site_scope: "filling_area_and_tote_pool"
      aggregation_rule: "liner_mass=count_times_tare; tote_service=one_use_divided_by_verified_lifetime_trips"
      quality_evidence: "supplier_specification; tare_measurement; issue_log; asset_register; retirement_record"
    - protocol_id: cp_residue_and_waste_records
      process_id: "shell_egg_receipt_and_breaking_filtration_and_whole_egg_blending_thermal_pasteurization_and_rapid_cooling_bulk_filling_and_refrigerated_storage_cip_and_wastewater_management"
      flow_role: "eggshell_reject_residue_product_loss_packaging_scrap_and_sludge"
      record_type: "waste_and_recovery_record"
      raw_fields: "batch_id; material_name; wet_mass_kg; dry_mass_kg; moisture_fraction; reason; product_or_waste_status; destination; manifest_id; timestamp"
      collection_method: "segregated_container_weighing_and_manifest_reconciliation"
      unit: "kg"
      frequency: "each_event_or_batch"
      temporal_coverage: "complete_reporting_period"
      site_scope: "foreground_facility_and_first_receiver"
      aggregation_rule: "sum_each_named_material_by_status_and_fate_then_normalize"
      quality_evidence: "scale_calibration; product_specification_if_coproduct; transfer_record; waste_manifest; mass_balance"
    - protocol_id: cp_pasteurization_and_cold_chain_records
      process_id: "thermal_pasteurization_and_rapid_cooling_bulk_filling_and_refrigerated_storage"
      flow_role: "time_temperature_flow_diversion_cooling_and_storage"
      record_type: "critical_control_and_release_record"
      raw_fields: "batch_id; formulation; total_solids_percent; inlet_temperature_c; legal_temperature_c; holding_time_min; flow_rate; diversion_events; outlet_temperature_c; cooling_end_time; cold_store_temperature_c; storage_duration_h; release_status"
      collection_method: "validated_continuous_recorder_flow_test_and_batch_release_review"
      unit: "°C; min; kg/h; h"
      frequency: "continuous_and_each_batch_release"
      temporal_coverage: "complete_batch_and_storage_to_gate"
      site_scope: "pasteurizer_cooler_and_cold_store"
      aggregation_rule: "accept_only_forward_flow_and_released_mass_meeting_validated_schedule_and_temperature_gate"
      quality_evidence: "recorder_calibration; holding_time_test; diversion_test; chart_review; release_signature; cold_store_log"
  calculation_rules:
    - id: normalize_to_reference_flow
      applies_to: "all inventory rows"
      rule: "normalized_amount = measured_or_calculated_amount / released_reference_product_mass_kg"
      inputs:
        - measured_or_calculated_amount
        - released_reference_product_mass_kg
      output: "amount_per_1_kg_reference_product"
      source_ids:
        - mass-balance-identity
    - id: reconcile_shell_to_product_mass
      applies_to: "shell_egg_receipt_and_breaking through bulk_filling_and_refrigerated_storage"
      rule: "accepted_shell_egg_mass = reference_product_mass + recovered_eggshell_coproduct_mass + eggshell_waste_mass + rejected_or_residue_mass + product_loss_mass + measured_water_or_cleaning_carryover_adjustment"
      inputs:
        - all_named_mass_outputs_on_consistent_basis
      output: "batch_mass_balance_and_unexplained_difference"
      source_ids:
        - mass-balance-identity
    - id: calculate_pasteurization_acceptance
      applies_to: "thermal_pasteurization_and_rapid_cooling"
      rule: "accepted_mass = forward_flow_mass where recorded_temperature_c >= validated_minimum_temperature_c and actual_holding_time_min >= validated_minimum_holding_time_min"
      inputs:
        - temperature_chart
        - holding_time_test
        - flow_rate
        - diversion_log
        - formulation
      output: "released_or_diverted_mass"
      source_ids:
        - cfia-egg-preventive-controls
    - id: calculate_natural_gas_emissions
      applies_to: "natural-gas combustion cards"
      rule: "emission_kg = fuel_quantity * lower_heating_value_mj_per_unit / 1000000 * emission_factor_kg_per_tj calculated separately for CO2, CH4, and N2O"
      inputs:
        - fuel_quantity
        - lower_heating_value
        - substance_specific_factor
      output: "kg_substance_per_1_kg_reference_product"
      source_ids:
        - ipcc-2006-stationary-combustion
    - id: calculate_refrigerant_loss
      applies_to: "R717 input and air-emission cards"
      rule: "r717_loss_kg = opening_charge_kg + purchases_kg + additions_kg - recovered_kg - transferred_kg - closing_charge_kg"
      inputs:
        - refrigerant_mass_balance_fields
      output: "kg_R717_to_air_per_1_kg_reference_product"
      source_ids:
        - ipcc-2019-refrigeration
    - id: calculate_direct_water_emission
      applies_to: "each direct-to-water elementary flow"
      rule: "emission_kg = post_treatment_concentration_mg_l * direct_discharge_volume_m3 / 1000"
      inputs:
        - substance_specific_concentration_mg_l
        - direct_discharge_volume_m3
      output: "kg_substance_per_1_kg_reference_product"
      source_ids:
        - us-epa-egg-processing-waste-1971
    - id: calculate_ldpe_liner_mass
      applies_to: "LDPE liner input"
      rule: "liner_mass_kg = liner_count * verified_liner_tare_kg"
      inputs:
        - liner_count
        - verified_liner_tare_kg
      output: "kg_LDPE_per_1_kg_reference_product"
      source_ids:
        - mass-balance-identity
    - id: calculate_tote_service
      applies_to: "reusable stainless-steel tote"
      rule: "allocated_tote_item_use = filled_tote_count / verified_lifetime_trip_count"
      inputs:
        - filled_tote_count
        - verified_lifetime_trip_count
      output: "item_use_per_1_kg_reference_product"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: identity_and_formulation
      applies_to: "all datasets"
      requirement: "Declare chicken species, liquid whole-egg form, zero added salt/sugar/preservative/water/yolk/albumen, thermal route, refrigerated state, gate, and CPC context."
      evidence: "batch_formulation; product_specification; dataset_metadata"
    - id: no_route_averaging
      applies_to: "all processes"
      requirement: "Keep whole egg, yolk, albumen, frozen, dried, non-thermal, packaging, thermal-supply, and wastewater routes separate; no weighted generic route is conforming."
      evidence: "campaign_schedule; route_selection; allocation_worksheet"
    - id: mass_balance
      applies_to: "each batch"
      requirement: "Reconcile shell-egg input, intermediates, reference product, coproduct, all named wastes, rework, and unexplained difference on one mass basis."
      evidence: "calibrated_mass_records; batch_reconciliation"
    - id: critical_control_validity
      applies_to: "pasteurization and cooling"
      requirement: "Retain formulation-specific validated schedule, calibration, holding-time test, flow diversion, cooling, and release records."
      evidence: "critical_control_chart; validation_study; calibration_and_release_records"
    - id: utility_separation
      applies_to: "electricity, steam, hot water, natural gas, and cooling water"
      requirement: "Record each carrier separately by unit operation and route; preserve original unit and conversion."
      evidence: "meters; invoices; runtime_logs; conversion_sheet"
    - id: atomic_flow_completeness
      applies_to: "all inventory"
      requirement: "Each concrete material, chemical, fuel, refrigerant, waste, and elementary emission has its own card with no collective placeholder."
      evidence: "atomic_flows:v1_audit"
    - id: wastewater_route_consistency
      applies_to: "wastewater and water emissions"
      requirement: "Report either off-site wastewater transfer or on-site direct discharge for the same volume; direct emissions use post-treatment samples."
      evidence: "flowmeter; treatment_contract_or_permit; lab_reports"
    - id: temporal_representativeness
      applies_to: "all records"
      requirement: "Cover at least one complete production and sanitation cycle and the full reporting period; disclose seasonal or partial-period data."
      evidence: "production_calendar; cip_log; meter_coverage_report"
    - id: estimate_disclosure
      applies_to: "every reasoned_estimate"
      requirement: "Identify the range as provisional and replace it with reviewed foreground or external evidence before publication-critical use."
      evidence: "review_metadata; uncertainty_register"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require exactly 1 kg net refrigerated pasteurized liquid whole chicken egg with UUID 8ee52550-935f-4209-b758-c2d060bba326, Mass property, and every required qualifier."
    source_ids:
      - tiangong_identity_reference
  - rule_id: validate_scope_exclusions
    applies_to: "product and route metadata"
    rule: "Fail if the dataset includes or averages separate yolk, albumen, enriched blend, salted, sugared, frozen, dried, cooked, ambient-stable, or non-thermal product."
    source_ids:
      - usda-fsis-egg-products
  - rule_id: validate_process_map
    applies_to: "foreground inventory"
    rule: "Require all five required process ids and at least one matched batch through each process."
    source_ids:
      - codex-cxc-15-1976
      - beitia-et-al-2024
  - rule_id: validate_pasteurization
    applies_to: "thermal pasteurization"
    rule: "Require formulation-specific validated time-temperature records, holding-time evidence, diversion records, and release approval; the 60 °C/3.5 min baseline is not transferable to an excluded formulation."
    source_ids:
      - cfia-egg-preventive-controls
  - rule_id: validate_cold_chain
    applies_to: "cooling and cold storage"
    rule: "Require rapid post-pasteurization cooling and product temperature at or below 4 °C at gate with declared storage duration."
    source_ids:
      - codex-cxc-15-1976
      - eu-reg-853-2004
      - cfia-egg-preventive-controls
  - rule_id: validate_atomic_flows
    applies_to: "inventory cards"
    rule: "Fail any collection placeholder and require flow_name, direction, flow_type, measurement_basis, unit, collection_protocol, and quality_evidence for every card."
    source_ids:
      - "—"
  - rule_id: validate_uuid_scope
    applies_to: "inventory identities"
    rule: "Permit a flow UUID only on the reference product flow; all non-reference flow UUID fields remain blank until separately reviewed."
    source_ids:
      - tiangong_identity_reference
  - rule_id: validate_route_gates
    applies_to: "utilities, refrigeration, packaging, and wastewater"
    rule: "Require purchased-steam versus on-site-natural-gas selection, R717 refrigeration, LDPE-lined reusable stainless-steel tote packaging, and one wastewater route without averaging."
    source_ids:
      - cfia-egg-preventive-controls
      - ipcc-2019-refrigeration
  - rule_id: validate_mass_balance
    applies_to: "batch inventory"
    rule: "Require explained mass balance for shell eggs, intermediates, product, coproduct, waste, rework, and losses."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_estimates
    applies_to: "amount ranges"
    rule: "Flag every reasoned_estimate as provisional and fail publication use unless reviewed acceptance or stronger evidence is recorded."
    source_ids:
      - beitia-et-al-2024
published_dataset_profile:
  dataset_role: "foreground production package eligible for review as a secondary_dataset or background_dataset"
  downstream_use: "ingredient input to refrigerated food manufacturing or food-service lifecycle models requiring thermally pasteurized liquid whole egg"
  allowed_use: "unformulated refrigerated thermally pasteurized liquid whole chicken egg at processor cold-store gate with complete batch, utility, sanitation, waste, and route disclosures"
  excluded_use: "separate yolk or albumen; enriched blends; salted, sugared, preserved, frozen, dried, cooked, ambient-stable, or non-thermal products; consumer-pack or tanker routes; datasets averaging mutually exclusive routes"
  required_metadata: "canonical PCR id; CPC 3.0 23993; species; formulation; solids content; product state; validated pasteurization schedule; cooling endpoint; cold-store duration; geography; reporting period; thermal supply route; R717 system; packaging route; wastewater route; allocation basis"
  required_quality_disclosure: "unresolved unit-group and non-reference UUIDs; meter and sampling coverage; mass-balance difference; rework; estimate use; eggshell status and allocation; energy and water allocation; refrigerant reconciliation; discharge permit and post-treatment sampling"
  update_trigger: "revise when the Tiangong reference identity changes, industrial liquid-whole-egg foreground evidence replaces provisional ranges, official pasteurization or cooling requirements change, or another product, packaging, thermal, refrigeration, or wastewater route is proposed for inclusion"
data_sources:
  - id: "codex-cxc-15-1976"
    type: "official_guidance"
    reference: "FAO/WHO Codex, Code of Hygienic Practice for Eggs and Egg Products, CXC 15-1976, revised 2007. <https://www.fao.org/fao-who-codexalimentarius/sh-proxy/ro/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FStandards%252FCXC%2B15-1976%252FCXC_015e.pdf> (retrieved 2026-08-13)"
    used_for: "clean-egg acceptance, breaking hygiene, raw/treated separation, validated microbiocidal treatment, rapid cooling, refrigeration, packaging and traceability rules"
  - id: "cfia-egg-preventive-controls"
    type: "official_guidance"
    reference: "Canadian Food Inspection Agency, Preventive controls for food: Eggs and processed egg products. <https://inspection.canada.ca/en/food-safety-industry/preventive-control-plans/controls-food/eggs-and-processes-egg-products> (retrieved 2026-08-13)"
    used_for: "whole-egg time-temperature baseline, cooling limits, pasteurizer records, flow diversion, holding-time verification, CIP separation, and critical-control evidence"
  - id: "eu-reg-853-2004"
    type: "standard"
    reference: "Regulation (EC) No 853/2004, Annex III, Section X, Egg Products. <https://eur-lex.europa.eu/eli/reg/2004/853/oj> (retrieved 2026-08-13)"
    used_for: "separation of washing/breaking/other operations, rapid processing, liquid-egg pre-processing storage, post-processing cooling to at most 4 °C, and shell-particle specification context"
  - id: "usda-fsis-egg-products"
    type: "official_guidance"
    reference: "USDA Food Safety and Inspection Service, Egg Products and Food Safety. <https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/eggs/egg-products-and-food-safety> (retrieved 2026-08-13)"
    used_for: "product-form distinctions and process decomposition: breaking, filtration, mixing, pasteurization, cooling, packaging, and refrigerated handling"
  - id: "beitia-et-al-2024"
    type: "literature"
    reference: "Beitia, E. et al. (2024), Life cycle assessment of the manothermosonication of liquid whole egg: A comparative evaluation with conventional thermal preservation, LWT 213, 116953. <https://doi.org/10.1016/j.lwt.2024.116953>"
    used_for: "conventional thermal-route process map; 1 kg functional unit; shell-egg, water, packaging, CIP chemical and energy benchmarks; cold-storage significance; evidence limitations"
  - id: "jrc-fdm-bref-2019"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre (2019), Best Available Techniques Reference Document for the Food, Drink and Milk Industries, JRC118627. <https://publications.jrc.ec.europa.eu/repository/handle/JRC118627> (retrieved 2026-08-13)"
    used_for: "resource metering, process-integrated water and energy management, cleaning, wastewater, and route-specific BAT context"
  - id: "us-epa-egg-processing-waste-1971"
    type: "dataset"
    reference: "U.S. Environmental Protection Agency, Egg Breaking and Processing Waste Control and Treatment, Water Pollution Control Research Series 12060 FQF 11/71. <https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9101RJ45.TXT> (retrieved 2026-08-13)"
    used_for: "shell and product-loss fate, wastewater volume, BOD/COD/nitrogen/phosphorus/suspended-solids characterization, waste-conservation QA screens, and treatment-route evidence"
  - id: "ipcc-2006-stationary-combustion"
    type: "method_factor"
    reference: "IPCC (2006), Guidelines for National Greenhouse Gas Inventories, Volume 2, Chapter 2: Stationary Combustion. <https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_2_Ch2_Stationary_Combustion.pdf> (retrieved 2026-08-13)"
    used_for: "carrier- and technology-specific CO2, CH4, and N2O calculation method for on-site natural-gas combustion"
  - id: "ipcc-2019-refrigeration"
    type: "method_factor"
    reference: "IPCC (2019), Refinement to the 2006 Guidelines, Volume 3, Chapter 7: Emissions of Fluorinated Substitutes for Ozone Depleting Substances. <https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/3_Volume3/19R_V3_Ch07_ODS_Substitutes.pdf> (retrieved 2026-08-13)"
    used_for: "refrigerant inventory fields, mass-balance method, service/use loss accounting, and documentation expectations adapted to the declared R717 system"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation of mass applied as a PCR calculation identity."
    used_for: "batch reconciliation, normalization, liner calculation, tote-service allocation, and transfer consistency"
