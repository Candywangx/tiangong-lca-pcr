    required_unit: "kg/kg or % by mass"
    rule: "Record dry-matter test result and method. For EU-market coffee extract, screen against Directive 1999/4/EC: at least 95% coffee-based dry matter for dried extract, 70–85% for paste, and 15–55% for liquid extract; use the applicable jurisdictional specification elsewhere."
