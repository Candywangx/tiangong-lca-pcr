allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Multi-output foreground processes"
    rule: "First avoid allocation through process subdivision, separate metering, and mass balance, including separate accounting for recovered aroma, coffee oil, reusable condensate, internally recycled fines, and saleable co-products."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: allocation_physical_then_other
    applies_to: "Unavoidable shared burdens"
    rule: "When subdivision is not feasible, use a documented physical causal relationship. If no defensible physical relationship exists, use an explicitly justified alternative such as economic allocation, report prices and reference period, and test sensitivity."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: allocation_internal_recycling
    applies_to: "Internal loops"
    rule: "Do not assign a second product output or avoided burden to recovered aroma, condensate, extract, or fines returned to the same foreground route; record the loop and count only makeup inputs and losses crossing the system boundary."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_waste_treatment
    applies_to: "Spent grounds, wastewater, and packaging scrap"
    rule: "Assign treatment burdens to the foreground product up to the declared system boundary. Do not credit substitution or recycling benefits unless the downstream method and dataset scope explicitly require them and the modelling choice is disclosed."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_lot_records
      process_id: "ingredient_preparation"
      flow_role: "Principal and minor ingredient inputs; prepared feed; formulation components"
      record_type: "ERP issue records, scale tickets, batch sheets, stock reconciliation"
      raw_fields: "material_id; supplier; lot_id; product_state; opening_stock; receipts; issues; returns; closing_stock; moisture_or_dry_matter; timestamp"
      collection_method: "Calibrated scales plus inventory reconciliation"
      unit: "kg and kg/kg dry matter"
      frequency: "Each lot or batch, reconciled monthly"
      temporal_coverage: "Representative production cycle; preferably 12 consecutive months for annual datasets"
      site_scope: "Every included manufacturing site and product recipe"
      aggregation_rule: "Sum net consumption by material and divide by conforming reference-product output; keep ingredients separate"
      quality_evidence: "Scale calibration, lot traceability, stock-variance review, recipe approval"
    - protocol_id: cp_utility_meter_records
      process_id: "aqueous_extraction"
      flow_role: "Water, electricity, fuels, steam, refrigeration, compressed air, and other utilities for extraction, concentration, and drying"
      record_type: "Utility meters, invoices, boiler logs, engineering allocation records"
      raw_fields: "meter_id; carrier; opening_reading; closing_reading; unit; conversion_factor; process_area; production_period; allocation_key"
      collection_method: "Submeter preferred; otherwise documented engineering allocation from site totals"
      unit: "kg, m3, kWh, or MJ"
      frequency: "Continuous or per batch, reconciled monthly"
      temporal_coverage: "Same representative period as product output; preferably 12 consecutive months"
      site_scope: "All equipment and shared utilities serving included processes"
      aggregation_rule: "Convert with documented factors, subtract verified exports or returns, allocate shared totals using causal operating data, normalize to output"
      quality_evidence: "Meter calibration, invoice reconciliation, operating-hour record, conversion-factor source"
    - protocol_id: cp_product_mass_quality_records
      process_id: "packaging"
      flow_role: "Extract intermediates and conforming product outputs"
      record_type: "Batch mass records, tank or hopper measurements, laboratory results, release records"
      raw_fields: "batch_id; product_id; input_mass; output_mass; product_form; dry_matter; caffeine_status; recipe_version; drying_technology; release_status"
      collection_method: "Calibrated mass measurement paired with representative laboratory sampling"
      unit: "kg and % by mass"
      frequency: "Every batch or production lot"
      temporal_coverage: "All batches in the representative dataset period"
      site_scope: "Every included product and site"
      aggregation_rule: "Sum released output only; retain intermediate mass and dry-matter pairs for mass balance"
      quality_evidence: "Scale calibration, laboratory method, sample plan, release authorization"
    - protocol_id: cp_waste_records
      process_id: "ingredient_preparation"
      flow_role: "Ingredient rejects, spent solids, off-specification product, and packaging scrap"
      record_type: "Waste scales, container tickets, transfer notes, treatment invoices"
      raw_fields: "waste_id; material; wet_mass; dry_matter_if_relevant; destination; treatment; recovery_status; batch_or_period"
      collection_method: "Weigh each transfer or use calibrated container factors verified by periodic weighing"
      unit: "kg and kg/kg dry matter where relevant"
      frequency: "Each transfer, reconciled monthly"
      temporal_coverage: "Same representative period as product output"
      site_scope: "All included processes and destinations"
      aggregation_rule: "Sum by waste type and destination; subtract only documented internal return before boundary crossing"
      quality_evidence: "Scale calibration, transfer documentation, treatment receipt, moisture sampling"
    - protocol_id: cp_wastewater_records
      process_id: "aqueous_extraction"
      flow_role: "Wastewater and condensate discharge or reuse"
      record_type: "Flow meter, tank record, discharge permit sampling, treatment log"
      raw_fields: "stream_id; volume_or_mass; density_if_used; COD_or_relevant_load; destination; reuse_quantity; period"
      collection_method: "Continuous flow meter or documented water balance with representative sampling"
      unit: "kg, m3, and applicable load unit"
      frequency: "Continuous/monthly plus permit sampling frequency"
      temporal_coverage: "Same representative period as product output, including seasonal cleaning campaigns"
      site_scope: "All included wastewater and condensate streams"
      aggregation_rule: "Separate discharge, treatment, evaporation, product incorporation, and internal reuse; avoid double counting"
      quality_evidence: "Meter calibration, balance closure, laboratory report, discharge record"
    - protocol_id: cp_packaging_records
      process_id: "packaging"
      flow_role: "Primary, secondary, and tertiary packaging inside the declared boundary"
      record_type: "Bill of materials, supplier specification, issue and scrap records"
      raw_fields: "component_id; material; unit_mass; units_used; recycled_content_if_claimed; scrap; pallet_cycles; product_format"
      collection_method: "Component weighing and approved bill of materials reconciled to issues"
      unit: "kg"
      frequency: "Per packaging specification; issues reconciled monthly"
      temporal_coverage: "All packaging formats produced in the representative dataset period"
      site_scope: "Every saleable format and included site"
      aggregation_rule: "Sum component mass consumed minus documented reusable returns; normalize to net product mass"
      quality_evidence: "Approved specification, supplier declaration, scale record, inventory reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground flows"
      rule: "normalized amount = period or batch flow amount / net conforming saleable product mass for the same period or batch"
      inputs:
        - flow_amount
        - net_saleable_product_mass
      output: "amount per 1 kg net saleable reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_dry_matter
      applies_to: "Extract and product quality"
      rule: "dry-matter fraction = dry sample mass / as-received sample mass; retain the laboratory method and sampling basis"
      inputs:
        - dry_sample_mass
        - as_received_sample_mass
      output: "kg/kg and % by mass dry matter"
      source_ids:
        - eu-coffee-extracts-directive-1999
    - id: calc_material_balance
      applies_to: "Each process and complete foreground route"
      rule: "mass-balance difference = total measured mass inputs - total measured mass outputs - separately measured evaporation or other mass transfer; report difference relative to total inputs"
      inputs:
        - input_masses
        - product_outputs
        - waste_outputs
        - wastewater
        - evaporation_or_transfer
      output: "kg difference and % closure"
      source_ids: []
    - id: calc_shared_utility
      applies_to: "Shared utility systems"
      rule: "allocated utility = metered shared total × causal process driver / sum of the same driver across served processes; use operating time only when it reasonably represents demand"
      inputs:
        - shared_utility_total
        - causal_driver_by_process
      output: "utility amount assigned to each process"
      source_ids:
        - eu-pef-method-2021
    - id: calc_packaging_mass
      applies_to: "Packaging"
      rule: "packaging mass = sum(component unit mass × units consumed) - verified reusable components returned without crossing the boundary"
      inputs:
        - component_unit_mass
        - units_consumed
        - reusable_returns
      output: "kg packaging per kg net product"
      source_ids: []
    - id: calc_yield
      applies_to: "Extraction, concentration, drying, formulation, and packaging"
      rule: "process yield = conforming output dry mass / applicable input dry mass; for packaging use conforming net product mass / unpacked input mass"
      inputs:
        - input_mass_and_dry_matter
        - conforming_output_mass_and_dry_matter
      output: "kg/kg process yield on declared basis"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and ingredients"
      requirement: "Preserve product-specific identities, lot links, product form, coffee/chicory/substitute basis, recipe version, and the verified Tiangong flow UUID. Non-instant products shall not use the Instant Coffee UUID."
      evidence: "Product specification, batch release record, supplier record, and Tiangong identity verification"
    - id: dq_measurement
      applies_to: "Mass, utilities, water, wastes, and quality tests"
      requirement: "Use calibrated or legally controlled instruments where applicable; retain calibration status, reading units, conversion factors, and laboratory methods."
      evidence: "Calibration certificate, meter log, laboratory report, and conversion record"
    - id: dq_temporal
      applies_to: "Foreground annual or campaign dataset"
      requirement: "Cover at least one representative production cycle and preferably 12 consecutive months when seasonality or product campaigns affect utilities or yield; disclose shorter coverage and its limitations."
      evidence: "Production calendar, monthly reconciliation, and representativeness assessment"
    - id: dq_completeness
      applies_to: "Foreground system"
      requirement: "Reconcile material, water, energy, product, waste, and wastewater records across every included process and document excluded or unmetered flows."
      evidence: "Completeness checklist, mass and water balances, utility reconciliation"
    - id: dq_representativeness
      applies_to: "Upstream datasets and shared allocations"
      requirement: "Document geographic, temporal, and technological match, shared-site allocation drivers, and substitutions used when exact upstream data are unavailable."
      evidence: "Dataset metadata, allocation worksheet, supplier geography, technology description"
    - id: dq_uncertainty
      applies_to: "Provisional ranges and modelled estimates"
      requirement: "Treat every reasoned_estimate range only as a QA screen; replace it with foreground measurements or reviewed source-backed evidence before publication or disclose the unresolved limitation."
      evidence: "Range review log, measured value, source citation, or explicit limitation statement"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm UUID 16ecdc48-3ef5-40b0-8a5d-56b3794a2ba4, flow name Instant Coffee / 速溶咖啡, flow type Product flow, state code 100, Mass property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, mass unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and kg reference unit."
    source_ids: []
  - rule_id: validate_non_instant_flow
    applies_to: "Non-instant products"
    rule: "Reject publication if liquid or paste extract, coffee-based preparation, roasted chicory, or another substitute product relabels or reuses the Instant Coffee UUID; require a verified product-specific flow."
    source_ids: []
  - rule_id: validate_qualifiers
    applies_to: "Reference product metadata"
    rule: "Require product form, coffee/chicory/substitute and recipe basis, dry matter, decaffeination status, extraction medium, applicable drying technology, packaging state, geography, and reference year."
    source_ids:
      - eu-coffee-extracts-directive-1999
  - rule_id: validate_route
    applies_to: "Process coverage"
    rule: "Require both mandatory processes and a documented included/not-applicable decision for aqueous extraction, concentration, drying, and formulation; the detailed inventories shall match the declared production route."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_mass_balance
    applies_to: "Foreground processes"
    rule: "Require batch or period mass-balance calculations for extraction, concentration, drying, formulation, and packaging; investigate and disclose material imbalances instead of forcing closure."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: validate_foreground_evidence
    applies_to: "Collected and calculated rows"
    rule: "Require every collected_record or calculated_from_collection row to reference an implemented collection protocol and retain the stated quality evidence."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_allocation
    applies_to: "Multi-output and shared processes"
    rule: "Require documented subdivision attempts, allocation method, allocation factors totaling one, source period, and sensitivity when a non-physical basis is used."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: validate_estimate_status
    applies_to: "Reasoned-estimate ranges"
    rule: "Flag every reasoned_estimate as a non-authoritative QA guardrail and require replacement by measured or reviewed evidence, or explicit limitation disclosure, before normal published use."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for a declared coffee extract, concentrate, instant coffee, coffee-based preparation, or coffee-substitute product"
  downstream_use: "secondary_dataset; background_dataset when product identity, route, geography, technology, and data quality are sufficiently representative for reuse"
  allowed_use: "Product-footprint, process, and lifecycle-model studies using the same product form and composition basis, manufacturing route, boundary, geography, time period, packaging state, and allocation assumptions"
  excluded_use: "Direct substitution across dried, paste, liquid, preparation, chicory, or other substitute forms without dry-matter and function adjustment; consumer beverage preparation; agricultural coffee production; use of the Instant Coffee UUID for a non-instant product; comparative public claims without applicable review"
  required_metadata: "Product-specific flow UUID; product name and form; coffee/chicory/substitute basis and recipe shares; dry matter; decaffeination status; extraction medium; drying technology; net and packaging mass basis; process inclusion decisions; geography; reference year; site coverage; allocation method; upstream dataset versions"
  required_quality_disclosure: "Foreground coverage period and site share; meter and scale quality; laboratory methods; mass and water balance closure; missing-flow assessment; shared-utility allocation; upstream representativeness; provisional estimate status; exclusions and limitations"
  update_trigger: "Change of product flow identity, product form or recipe, dry-matter specification, extraction or drying technology, site or geography, packaging format, allocation method, material supplier route, or a material shift in yield, energy, water, waste, or wastewater performance"
data_sources:
  - id: "eu-coffee-extracts-directive-1999"
    type: "official_guidance"
    reference: "European Parliament and Council, Directive 1999/4/EC relating to coffee extracts and chicory extracts, consolidated current version, https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:31999L0004 (retrieved 2026-08-11)"
    used_for: "Product definitions; water-only extraction definition; dried, paste, and liquid form distinctions; dry-matter and composition qualifiers"
  - id: "eu-pef-method-2021"
    type: "official_guidance"
    reference: "European Commission, Recommendation (EU) 2021/2279, Annex I Product Environmental Footprint Method, http://data.europa.eu/eli/reco/2021/2279/oj (retrieved 2026-08-11)"
    used_for: "Functional unit and reference flow; system boundary; company-specific data; data quality; multifunctionality; validation and reporting rules"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management — Life cycle assessment — Requirements and guidelines, including published amendments; official record https://www.iso.org/standard/38498.html (confirmed current in 2022; retrieved 2026-08-11)"
    used_for: "LCA inventory consistency, allocation hierarchy, completeness, interpretation, reporting, and critical-review basis"
