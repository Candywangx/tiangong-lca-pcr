allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "All unit operations"
    rule: "Subdivide receiving, drying, grading, packaging, storage, and sanitation by batch or metered operation before allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_whole_vs_powder_prohibited
    applies_to: "Whole sticks and powder-capable residues"
    rule: "Never average burdens between whole bark sticks and powder, ground spice, milling feed, or extraction feed."
    source_ids:
      - boundary_locked_product_form
  - rule_id: allocation_saleable_trim
    applies_to: "Saleable bark trims"
    rule: "Treat separately sold trim as a co-product with its own mass and destination. Prefer physical subdivision; if impossible, allocate shared grading burdens by dry mass and disclose price sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_waste_no_credit
    applies_to: "Rejects, dust, wastewater, and packaging offcuts"
    rule: "Treat as waste unless a documented purchaser and separate product specification establish a co-product. Do not apply avoided-burden credits inside this foreground dataset."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_bark_mass_moisture
      process_id: "bark_receipt_and_dry_cleaning_electric_hot_air_drying"
      flow_role: "bark masses, moisture, dryer charge and discharge"
      record_type: "scale and laboratory records"
      raw_fields: "batch_id; timestamp; species; origin; wet_mass_kg; reject_mass_kg; sample_id; wet_sample_mass_g; dry_sample_mass_g; moisture_percent; dryer_setpoint_C; drying_time_h"
      collection_method: "Calibrated scales and representative moisture sampling with declared method."
      unit: "kg; g; % wet basis; °C; h"
      frequency: "Every batch"
      temporal_coverage: "Complete batch from receipt through dryer discharge"
      site_scope: "All lines producing the declared product"
      aggregation_rule: "Sum masses by batch; calculate moisture only on one wet-basis convention; normalize after batch closure."
      quality_evidence: "Calibration certificates, sample chain, test report, signed batch mass balance."
    - protocol_id: cp_reject_solid_waste_dust
      process_id: "bark_receipt_and_dry_cleaning_grading_and_stick_cutting_facility_sanitation"
      flow_role: "rejects, trims, captured dust, sweepings, fugitive dust"
      record_type: "waste and control-device records"
      raw_fields: "batch_id; material_id; gross_kg; tare_kg; net_kg; stage; fate; generated_dust_kg; collected_dust_kg"
      collection_method: "Tared material-specific containers and disposition records."
      unit: "kg"
      frequency: "Every batch or container change"
      temporal_coverage: "Same reporting period as production"
      site_scope: "Entire facility with production-line attribution"
      aggregation_rule: "Keep every material and fate separate; calculate fugitive dust as generated minus collected only when both are measured."
      quality_evidence: "Scale checks, labelled containers, photographs or manifests, nonnegative balance."
    - protocol_id: cp_operation_electricity
      process_id: "electric_hot_air_drying_grading_and_stick_cutting_bulk_carton_packaging_facility_sanitation"
      flow_role: "atomic electricity rows"
      record_type: "meter or runtime records"
      raw_fields: "meter_id; start_kWh; end_kWh; equipment_id; rated_kW; runtime_h; batch_id; operation"
      collection_method: "Dedicated submeter preferred; otherwise verified power-times-runtime."
      unit: "kWh"
      frequency: "Every batch"
      temporal_coverage: "Representative continuous 12-month period where available"
      site_scope: "Each named unit operation"
      aggregation_rule: "Keep heater, fans/controls, grading/cutting, packaging, and sanitation electricity separate."
      quality_evidence: "Meter calibration, photographs, runtime log, site-bill reconciliation."
    - protocol_id: cp_grade_cut_yield
      process_id: "grading_and_stick_cutting"
      flow_role: "feed, accepted sticks, trims, dust"
      record_type: "scale and grade records"
      raw_fields: "batch_id; feed_kg; accepted_sticks_kg; trim_kg; dust_kg; grade; stick_length_mm; grinding_used"
      collection_method: "Weigh each fraction and inspect declared whole-bark form."
      unit: "kg; mm"
      frequency: "Every batch"
      temporal_coverage: "Complete grading batch"
      site_scope: "All graders and cutters"
      aggregation_rule: "Require feed_kg = accepted_sticks_kg + trim_kg + dust_kg + unexplained_loss_kg; investigate unexplained loss."
      quality_evidence: "Calibrated scale, grade sheet, length sample, grinding_used=false."
    - protocol_id: cp_packaging_material_mass
      process_id: "bulk_carton_packaging"
      flow_role: "product and each packaging material"
      record_type: "issue, count, mass, and invoice records"
      raw_fields: "batch_id; net_product_kg; carton_count; carton_unit_kg; liner_count; liner_unit_kg; label_count; label_unit_kg; strap_length_m; strap_kg_per_m; gross_kg; tare_kg"
      collection_method: "Count-times-unit-mass or direct weighing, by material."
      unit: "kg; count; m"
      frequency: "Every packaging batch"
      temporal_coverage: "Same period as packed product"
      site_scope: "All packaging lines"
      aggregation_rule: "Calculate each material independently; reconcile gross, tare, and net mass."
      quality_evidence: "Supplier specification, unit-mass sample, scale record, batch label."
    - protocol_id: cp_packaging_waste_mass
      process_id: "bulk_carton_packaging"
      flow_role: "material-specific offcuts"
      record_type: "waste records"
      raw_fields: "batch_id; waste_material_id; gross_kg; tare_kg; net_kg; fate"
      collection_method: "Tared, material-specific waste containers."
      unit: "kg"
      frequency: "Every container change"
      temporal_coverage: "Same period as packaging"
      site_scope: "All packaging lines"
      aggregation_rule: "No combined packaging-waste row; aggregate only within the identical material id and fate."
      quality_evidence: "Scale ticket, labelled bin, recycling or disposal receipt."
    - protocol_id: cp_ambient_storage_release
      process_id: "ambient_dry_storage"
      flow_role: "inventory days, electricity, and release"
      record_type: "warehouse and meter records"
      raw_fields: "batch_id; entry_date; release_date; net_kg; storage_location; temperature_C; relative_humidity_percent; meter_start_kWh; meter_end_kWh; refrigeration_used; release_moisture_percent"
      collection_method: "Warehouse management records, ambient logger, submeter, release test."
      unit: "kg; day; °C; %; kWh"
      frequency: "Each lot and monthly meter period"
      temporal_coverage: "Entire declared storage duration"
      site_scope: "Ambient store areas holding the product"
      aggregation_rule: "Allocate shared electricity by kg-day; require refrigeration_used=false."
      quality_evidence: "Inventory reconciliation, logger data, meter record, release authorization."
    - protocol_id: cp_sanitation_inputs
      process_id: "facility_sanitation"
      flow_role: "cold water, hot water, NaOH cleaner, NaOCl sanitizer"
      record_type: "meter and chemical issue records"
      raw_fields: "sanitation_event_id; batch_ids; cold_water_kg; hot_water_kg; hot_water_temperature_C; naoh_product_kg; naoh_concentration_percent; naocl_product_kg; available_chlorine_percent; area_m2; duration_h"
      collection_method: "Utility meters and controlled chemical issue/dosing logs."
      unit: "kg; °C; %; m2; h"
      frequency: "Every sanitation event"
      temporal_coverage: "Same period as attributable production"
      site_scope: "Named equipment and floor zones"
      aggregation_rule: "Allocate by documented causal driver, preferably equipment time or cleaned area; never describe this water as bark washing."
      quality_evidence: "Meter readings, sanitation sign-off, SDS, concentration checks."
    - protocol_id: cp_wastewater_water_emissions
      process_id: "facility_sanitation"
      flow_role: "wastewater and COD, BOD5, TSS direct emissions"
      record_type: "effluent and laboratory records"
      raw_fields: "event_id; wastewater_kg; transferred_to_treatment_kg; direct_discharge_m3; cod_mg_per_L; bod5_mg_per_L; tss_mg_per_L; sample_id; destination"
      collection_method: "Effluent meter or balance plus representative accredited sampling."
      unit: "kg; m3; mg/L"
      frequency: "Every discharge or representative campaign"
      temporal_coverage: "Same period as sanitation"
