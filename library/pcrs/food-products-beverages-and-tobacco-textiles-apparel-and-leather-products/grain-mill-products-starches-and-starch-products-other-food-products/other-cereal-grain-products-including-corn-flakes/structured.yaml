measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground amounts to 1 kg of accepted net product at factory-gate release. Exclude packaging mass from the reference amount and inventory packaging separately."
  - id: moisture_basis
    applies_to: "Cereal inputs, intermediates, co-products, rejects, and finished product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg as received and kg dry matter"
    rule: "Record measured or specification-based moisture for each material state. Do not compare or convert wet- and dry-basis quantities without the declared moisture values and the calc_dry_matter rule."
  - id: energy_carrier_separation
    applies_to: "Electricity, purchased heat or steam, and fuels"
    required_property_ref:
      name: "Energy appropriate to the selected flow"
      uuid: ""
    required_unit: "kWh for electricity; MJ for fuels and thermal energy"
    rule: "Preserve energy carriers as separate inventory rows. Convert units with documented factors but do not combine electricity and thermal energy into one unqualified amount."
  - id: water_accounting
    applies_to: "Process, cleaning, and formulation water"
    required_property_ref:
      name: "Mass or volume appropriate to the selected flow"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Record supplied water, recovered/reused water, product-incorporated water, wastewater, and water evaporated or vented consistently so reuse is not counted as a new external input."
  - id: batch_reconciliation
    applies_to: "All material flows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile inputs, outputs, inventory change, moisture transfer, co-products, wastes, and direct material emissions over the same batch or reporting period before normalization."
