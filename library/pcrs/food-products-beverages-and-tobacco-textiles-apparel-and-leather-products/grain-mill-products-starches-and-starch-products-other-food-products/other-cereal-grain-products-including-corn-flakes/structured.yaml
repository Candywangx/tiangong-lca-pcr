allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "multi_output_processes"
    rule: "Avoid allocation where possible by separately metering or subdividing cereal preparation, utilities, transformation, finishing, and treatment processes, or by system expansion when the study goal permits it."
    source_ids:
      - eu-commission-2021-2279-environmental-footprint
  - rule_id: allocation_physical_relation
    applies_to: "inseparable_coproducts"
    rule: "If subdivision or system expansion is not feasible, allocate shared inputs and emissions using a documented causal physical relationship. Mass allocation is acceptable only when mass is relevant to the shared process burden; moisture bases shall be consistent."
    source_ids:
      - eu-commission-2021-2279-environmental-footprint
  - rule_id: allocation_other_relation
    applies_to: "no_relevant_physical_relation"
    rule: "If no relevant physical relationship can be justified, use another documented relationship such as economic allocation, state prices, geography, period, and calculation, and test sensitivity for material co-products."
    source_ids:
      - eu-commission-2021-2279-environmental-footprint
  - rule_id: allocation_residue_classification
    applies_to: "fractions_residues_and_waste"
    rule: "Classify bran, germ, hulls, fines, off-spec product, and treatment residues according to actual destination and economic status. Rework is an internal loop; a saleable or beneficially used fraction is a co-product; a discarded stream is waste. Do not apply both co-product allocation and avoided-burden credit to the same output."
    source_ids:
      - eu-commission-2021-2279-environmental-footprint
      - eu-commission-2019-2031-fdm-bat
  - rule_id: allocation_shared_utilities
    applies_to: "shared_energy_water_and_treatment"
    rule: "Allocate shared metered utilities and treatment burdens with process-specific meters where available; otherwise use a causal driver such as operating time, energy demand, treated flow, pollutant load, or product mass, and disclose the driver and coverage."
    source_ids:
      - eu-commission-2019-2031-fdm-bat
      - eu-commission-2021-2279-environmental-footprint
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_and_moisture
      process_id: "receiving_and_preparation_cereal_transformation_finishing_and_release"
      flow_role: "material inputs, intermediates, products, co-products, and rejects"
      record_type: "weighbridge, batch-scale, production, inventory, and laboratory records"
      raw_fields: "material_id; supplier; origin; batch_id; timestamp; gross_mass; tare_mass; net_mass; moisture_fraction; dry_matter_method; destination; rework_flag"
      collection_method: "calibrated scale plus representative moisture test or controlled product specification"
      unit: "kg; mass fraction"
      frequency: "each receipt, batch, transfer, and release"
      temporal_coverage: "at least one representative continuous 12-month period or the complete campaign for seasonal production"
      site_scope: "each included facility and line"
      aggregation_rule: "reconcile opening inventory + receipts - closing inventory to issued and output masses; aggregate accepted product-weighted values"
      quality_evidence: "scale calibration; sampling plan; laboratory method; inventory reconciliation; missing-record log"
    - protocol_id: cp_recipe_and_packaging
      process_id: "cereal_transformation_finishing_and_release"
      flow_role: "formulation, coating, fortification, and packaging inputs"
      record_type: "approved recipe, bill of materials, issue/return, and packaging records"
      raw_fields: "ingredient_id; packaging_material_id; batch_id; issued_mass; returned_mass; rework_mass; product_output_mass; specification_revision"
      collection_method: "reconcile controlled recipe or bill of materials to actual issue and return records"
      unit: "kg"
      frequency: "each batch or production order"
      temporal_coverage: "same period as reference product records"
      site_scope: "each product formulation and packaging configuration"
      aggregation_rule: "net issue divided by accepted net product mass; keep each material separate"
      quality_evidence: "approved specification; lot traceability; issue/return reconciliation"
    - protocol_id: cp_energy_and_fuel
      process_id: "receiving_and_preparation_cereal_transformation_finishing_and_release_onsite_environmental_management"
      flow_role: "electricity, fuel, purchased heat, and steam"
      record_type: "meters, fuel delivery records, invoices, boiler or steam logs"
      raw_fields: "meter_id; carrier; start_reading; end_reading; fuel_quantity; unit; steam_mass; pressure; temperature; operating_time; process_driver; product_output"
      collection_method: "calibrated submeter preferred; otherwise facility meter reconciled and allocated by documented causal driver"
      unit: "kWh; MJ; kg steam"
      frequency: "meter interval and each fuel delivery; aggregate monthly"
      temporal_coverage: "same representative 12-month period or complete campaign"
      site_scope: "process or line where metered, otherwise whole facility with allocation"
      aggregation_rule: "subtract non-production uses and exports; convert units transparently; normalize carrier-specific totals to process output and reference flow"
      quality_evidence: "meter calibration; invoice reconciliation; conversion factors; allocation record"
    - protocol_id: cp_water_and_wastewater
      process_id: "cereal_transformation_onsite_environmental_management"
      flow_role: "external water, reused water, wastewater, and pollutant loads"
      record_type: "water meters, batch records, effluent flow meters, and representative sampling"
      raw_fields: "source; meter_reading; use_area; reused_volume; discharge_volume; sample_time; flow; pH; temperature; COD_or_TOC; nitrogen; phosphorus; chloride; conductivity; TSS"
      collection_method: "calibrated flow measurement and representative laboratory analysis; distinguish external and recirculated water"
      unit: "m3; kg; concentration unit"
      frequency: "flow continuously or per batch where practicable; quality at permit or representative monitoring frequency"
      temporal_coverage: "same period as production data and representative of operating states"
      site_scope: "each materially different water and wastewater stream"
      aggregation_rule: "volume-weight concentration to loads; reconcile supply, incorporation, evaporation, reuse, discharge, and inventory change"
      quality_evidence: "meter calibration; laboratory accreditation or method; sampling plan; flow-quality time alignment"
    - protocol_id: cp_direct_emissions
      process_id: "receiving_and_preparation_cereal_transformation_finishing_and_release_onsite_environmental_management"
      flow_role: "particulate matter, VOC, combustion pollutants, and other direct emissions"
      record_type: "stack or vent test, continuous monitor, operating hours, and approved calculation records"
      raw_fields: "source_id; pollutant; compartment; flow_rate; concentration; test_duration; operating_state; abatement_state; operating_hours; calculation_method"
      collection_method: "applicable standardized measurement or documented engineering calculation; measure at representative/high expected normal emission state where required"
      unit: "kg; mg/Nm3; Nm3/h"
      frequency: "permit or method frequency and after significant process change"
      temporal_coverage: "representative of the production period and relevant operating states"
      site_scope: "each material emission point"
      aggregation_rule: "calculate pollutant load from matched flow and concentration, subtract no captured material unless supported, and normalize to process output"
      quality_evidence: "test report; method; instrument calibration; detection limit; abatement status"
    - protocol_id: cp_residuals_and_treatment
      process_id: "receiving_and_preparation_cereal_transformation_finishing_and_release_onsite_environmental_management"
      flow_role: "waste, co-products, offsite treatment, and onsite treatment inputs/outputs"
      record_type: "container weights, disposal tickets, invoices, treatment logs, and destination records"
      raw_fields: "residue_id; classification; mass; moisture; destination; treatment; economic_value; rework_quantity; treatment_input; treatment_output"
      collection_method: "measured mass or volume with documented destination and status"
      unit: "kg; m3"
      frequency: "each transfer or treatment batch"
      temporal_coverage: "same period as production data"
      site_scope: "each facility and treatment route"
      aggregation_rule: "net internal transfers and rework; aggregate by material and treatment destination; normalize to reference flow"
      quality_evidence: "weigh tickets; contractor records; chain of custody; treatment log; status decision"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period or batch amount / accepted net finished product mass"
      inputs:
        - "collected row amount"
        - "accepted net product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - mass-conservation-identity
    - id: calc_dry_matter
      applies_to: "cereal materials and product"
      rule: "dry mass = as-received mass × (1 - moisture mass fraction); convert between material states only with their own measured moisture"
      inputs:
        - "as-received mass"
        - "moisture fraction"
      output: "kg dry matter and documented wet-basis conversion"
      source_ids:
        - mass-conservation-identity
    - id: calc_mass_balance
      applies_to: "each process and full foreground system"
      rule: "opening inventory + inputs = accepted product + co-products + wastes + direct material emissions + closing inventory, with water incorporation and evaporation stated explicitly"
      inputs:
        - "mass and moisture records"
        - "inventory change"
        - emissions
        - wastewater
      output: "reconciliation residual and percentage of total input"
      source_ids:
        - mass-conservation-identity
        - eu-commission-2019-2031-fdm-bat
    - id: calc_water_balance
      applies_to: "water-using and drying processes"
      rule: "external water + water in materials = water in outputs + wastewater + water to air + closing water inventory - opening water inventory; reused water is an internal loop"
      inputs:
        - "external and reused water"
        - "material moisture"
        - wastewater
        - inventory
      output: "kg or m3 water by destination"
      source_ids:
        - mass-conservation-identity
        - eu-commission-2019-2031-fdm-bat
    - id: calc_shared_energy
      applies_to: "shared utilities"
      rule: "allocate carrier-specific metered consumption first by submeter; if unavailable, use documented causal drivers and preserve unallocated residuals for QA"
      inputs:
        - "facility and process meters"
        - "operating time"
        - "rated load"
        - "process output"
      output: "carrier-specific energy by process and reference flow"
      source_ids:
        - eu-commission-2019-2031-fdm-bat
        - eu-commission-2021-2279-environmental-footprint
    - id: calc_emission_load
      applies_to: "direct air or water emissions"
      rule: "load = matched flow × concentration × operating time or discharged volume, with unit conversion and detection-limit treatment documented"
      inputs:
        - "flow or volume"
        - concentration
        - time
        - "method metadata"
      output: "pollutant-specific kg per reference flow"
      source_ids:
        - eu-commission-2019-2031-fdm-bat
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and all material rows"
      requirement: "Retain product code, grain species, formulation revision, route, moisture basis, packaging state, site, geography, and reference period; avoid aggregating materially different products without a documented weighting rule."
      evidence: "product specification; batch and lot records; declared required qualifiers"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Use a representative continuous 12-month period where production is continuous, or the complete campaign for seasonal production; identify abnormal shutdown, start-up, and trial production and justify inclusion."
      evidence: "dated meters, production records, and exception log"
    - id: dq_completeness
      applies_to: "process and flow coverage"
      requirement: "Cover all included route operations and all material, energy, water, waste, wastewater, and relevant direct-emission flows; document cut-offs, data gaps, proxies, and reasoned estimates."
      evidence: "process flow diagram; BAT 2-style inventory; gap register; eu-commission-2021-2279-environmental-footprint"
    - id: dq_measurement
      applies_to: "collected records"
      requirement: "Use calibrated meters and scales where practicable, keep raw and adjusted values, document conversions, and reconcile meters or invoices to facility totals."
      evidence: "calibration certificates; invoices; reconciliation worksheets"
    - id: dq_representativeness
      applies_to: "site, technology, geography, and time"
      requirement: "Assess technological, geographical, and temporal representativeness and precision for foreground and linked secondary data; replace proxies when representative data become available."
      evidence: "data-quality assessment following eu-commission-2021-2279-environmental-footprint"
    - id: dq_uncertainty
      applies_to: "calculated and allocated values"
      requirement: "Retain sampling variation, detection limits, allocation sensitivity, and uncertainty or range metadata for material results."
      evidence: "laboratory reports; uncertainty calculation; sensitivity results"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "The reference product UUID shall be 53e35f86-383d-45f6-87ef-13a25f1f10e6, the reference flow property UUID shall be 93a60a56-a3c8-11da-a746-0800200b9a66, the unit group UUID shall be 93a60a57-a4c8-11da-a746-0800200c9a66, and the reference unit shall be kg."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "dataset_metadata"
    rule: "Reject an incomplete reference definition when grain identity, product form, route, formulation, moisture basis, packaging state, geography, period, allocation, or upstream boundary is missing."
    source_ids:
      - unsd-cpc-3-0-explanatory-notes
  - rule_id: validate_scope
    applies_to: "product_category"
    rule: "Confirm the product is within the stated semantic scope and is not milled or husked rice, a cereal-based prepared meal, flour-only output, or bakery mix/dough."
    source_ids:
      - unsd-cpc-3-0-explanatory-notes
  - rule_id: validate_process_coverage
    applies_to: "foreground_process_map"
    rule: "Every required process and every conditional process used by the declared route shall have inventory rows; omitted route steps shall be explicitly non-applicable rather than silently absent."
    source_ids:
      - us-epa-ap42-9-9-2-cereal-breakfast-food
      - eu-commission-2019-2031-fdm-bat
  - rule_id: validate_material_reconciliation
    applies_to: "material_and_water_balance"
    rule: "Calculate process and full-system mass and water balances over aligned periods. Investigate and disclose residuals before release; reasoned-estimate ranges are QA screens, not acceptance of unexplained imbalance."
    source_ids:
      - mass-conservation-identity
      - eu-commission-2019-2031-fdm-bat
  - rule_id: validate_energy_reconciliation
    applies_to: "energy_inventory"
    rule: "Reconcile electricity and fuel totals to meters, invoices, or delivery records; preserve carriers separately and disclose allocation of shared utilities."
    source_ids:
      - eu-commission-2019-2031-fdm-bat
  - rule_id: validate_coproduct_allocation
    applies_to: "multi_output_processes"
    rule: "Verify co-product/waste classification, subdivision attempts, allocation driver, factors, period, and sensitivity; prevent double credit or double burden for rework, co-products, and wastes."
    source_ids:
      - eu-commission-2021-2279-environmental-footprint
  - rule_id: validate_emission_specificity
    applies_to: "direct_emissions"
    rule: "Direct emissions shall use pollutant- and compartment-specific flows with measurement or calculation evidence. Captured dust and treatment residues shall not also be reported as unabated elementary emissions."
    source_ids:
      - us-epa-ap42-9-9-2-cereal-breakfast-food
      - eu-commission-2019-2031-fdm-bat
  - rule_id: validate_data_quality_and_sources
    applies_to: "all_inventory_and_rules"
    rule: "Verify temporal coverage, completeness, representativeness, calibration, source references, collection protocol links, and explicit disclosure of all data gaps, proxies, cut-offs, and reasoned estimates."
    source_ids:
      - eu-commission-2021-2279-environmental-footprint
      - eu-commission-2019-2031-fdm-bat
published_dataset_profile:
  dataset_role: "Foreground production dataset for manufacture of a declared other cereal grain product at a specified facility, route, and reference period"
  downstream_use: "May be published as a secondary_dataset or background_dataset after review, with upstream links added when cradle-to-gate coverage is claimed; may project to Tiangong process and lifecyclemodel records"
  allowed_use: "Gate-to-gate manufacturing assessment; cradle-to-gate product modelling when upstream datasets are linked; scenario and hotspot analysis within the declared product, route, geography, period, and allocation"
  excluded_use: "Unqualified representation of all CPC 23140 products; direct comparative assertion without harmonized function, formulation, moisture, packaging, boundary, allocation, geography, and data quality; agricultural production or downstream life-cycle claims when those stages are excluded"
  required_metadata: "PCR id and version; reference flow UUID; product and formulation identifier; grain species and origin; process route; moisture basis; packaging state; site and geography; reference period; technology; upstream coverage; allocation; cut-offs; collection protocols; source ids; data-quality statement"
  required_quality_disclosure: "Foreground/secondary data share; meter and sampling coverage; mass, water, and energy reconciliation; missing data; proxy flows; unresolved UUIDs; reasoned estimates; uncertainty; allocation sensitivity; representativeness; validation findings"
  update_trigger: "Material formulation, route, equipment, energy or water system, packaging, co-product destination, abatement, site, regulation, source evidence, Tiangong identity, or data-quality change; otherwise review when the represented period is no longer current"
