system_boundary:
  rules:
    - rule_id: boundary_route_complete
      applies_to: "foreground_manufacturing"
      rule: "Include every operation actually used between receipt and factory-gate release: handling and preparation; cleaning, hulling, cutting, milling, or pearling; mixing; cooking or extrusion; drying and tempering; flaking, shredding, puffing, roasting, or toasting; cooling; coating or fortification; packaging; and associated onsite waste, wastewater, and waste-gas handling. Conditional operations are included only when they occur."
      source_ids:
        - us-epa-ap42-9-9-2-cereal-breakfast-food
        - eu-commission-2019-2031-fdm-bat
    - rule_id: boundary_upstream_linkage
      applies_to: "cradle_to_gate_claim"
      rule: "A cradle-to-gate or background dataset shall link upstream datasets for all material and energy inputs. A gate-to-gate dataset shall state that upstream burdens are excluded and shall not be presented as cradle-to-gate."
      source_ids:
        - eu-commission-2021-2279-environmental-footprint
    - rule_id: boundary_minor_exclusions
      applies_to: "cut_off_and_data_gaps"
      rule: "Avoid cut-offs by default. Any excluded process or flow shall be explicit, justified, and tested for material, energy, and environmental significance; when the target study applies the EU Environmental Footprint method, its cumulative 3% cut-off rule also applies."
      source_ids:
        - eu-commission-2021-2279-environmental-footprint
    - rule_id: boundary_downstream_exclusion
      applies_to: "distribution_use_end_of_life"
      rule: "Distribution, retail, consumer preparation, use, and end-of-life are outside the default foreground boundary. Include them only in an explicitly extended study and keep their inventories separate from manufacturing."
      source_ids:
        - eu-commission-2021-2279-environmental-footprint
    - rule_id: boundary_emission_points
      applies_to: "direct_emissions_and_treatment"
      rule: "Assess process vents and collection points for particulate matter and volatile organic compounds where grain handling, milling, cooking, extrusion, drying, flaking, toasting, puffing, cooling, or packaging can emit them; inventory pollutant-specific direct emissions and treatment residues when relevant."
      source_ids:
        - us-epa-ap42-9-9-2-cereal-breakfast-food
        - eu-commission-2019-2031-fdm-bat
boundary_abstraction:
  declared_starting_condition: "Cereal grain, worked cereal material, cereal germ, or formulation ingredients received at the manufacturing site, with supplier, origin, product form, moisture, and upstream dataset coverage declared"
  starting_condition_role: "Foreground manufacturing input; agricultural production and off-site pre-processing are represented by linked upstream datasets when cradle-to-gate coverage is claimed"
  product_classification_scope: "Semantic scope equivalent to CPC 3.0 subclass 23140, independent of the CPC directory hierarchy"
  recursive_input_rule: "If an input is itself a product within this PCR category, record it as a technosphere product input with its own upstream dataset and declared processing state; do not recursively reproduce its manufacturing inside the receiving process"
  upstream_dataset_requirement: "Link representative upstream datasets for cereal materials, other ingredients, energy carriers, water supply, packaging, and treatment services whenever the published dataset claims cradle-to-gate or background-dataset use"
  disclosure: "Declare the starting material state, included route steps, excluded life-cycle stages, packaging treatment, upstream coverage, cut-offs, allocation, data gaps, and any use of proxy or reasoned-estimate values"
