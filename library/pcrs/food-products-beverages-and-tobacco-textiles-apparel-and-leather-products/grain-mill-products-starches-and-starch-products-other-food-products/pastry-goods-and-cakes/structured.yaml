allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Shared lines, ovens, utilities, cleaning, and packaging"
    rule: "Avoid allocation by collecting batch-, line-, equipment-, or product-specific data and subdividing independently measurable operations."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_second
    applies_to: "Unavoidable shared burdens"
    rule: "When subdivision is not feasible, allocate using a documented causal physical relationship such as measured equipment time, delivered energy, cleaned surface/operation, product mass, or controlled-storage occupancy and duration."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_last
    applies_to: "Remaining multifunctionality"
    rule: "Use another relationship, including economic allocation, only after documenting why subdivision and a relevant physical relationship are not feasible; disclose data period, price basis, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework_and_losses
    applies_to: "Rework, rejects, edible residues, and sold by-products"
    rule: "Treat same-product rework returned within the represented system as an internal loop; report net losses. Treat a residue as a co-product only when it leaves with a documented function and destination, and apply the allocation hierarchy."
    source_ids:
      - epd-food-beverage-pcr-2025-03
      - eu-pef-2021-2279
  - rule_id: allocation_product_mix
    applies_to: "Multiple recipes or package formats"
    rule: "Do not apply an unweighted site average to a specific product. Use product-specific data or a production-mass-weighted mix whose recipes, package formats, quantities, and represented period are disclosed."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_recipe_and_batch_mass
      process_id: "formulation_and_mixing_fermentation_and_resting_forming_and_thermal_processing_cooling_finishing_and_packaging"
      flow_role: "Ingredients, water, intermediate transfers, finishing components, frying oil"
      record_type: "Approved recipe, scale record, issue ticket, batch log"
      raw_fields: "product_id; recipe_version; batch_id; ingredient_id; as_used_mass; water_mass; transfer_mass; rework_mass; timestamp"
      collection_method: "Calibrated scales, dosing meters, and reconciled batch records"
      unit: "kg"
      frequency: "Each batch, aggregated for the represented period"
      temporal_coverage: "Complete declared representative production period and all included recipe variants"
      site_scope: "All sites and lines represented by the dataset"
      aggregation_rule: "Sum inputs and transfers by product/recipe; normalize to measured net saleable output; no substitution of the Chinese Pastry description for actual recipe records"
      quality_evidence: "Calibration records; recipe approvals; batch reconciliation; exception log"
    - protocol_id: cp_yield_waste_and_rework
      process_id: "all_manufacturing_processes"
      flow_role: "Conforming output, rejects, residues, rework, waste destinations"
      record_type: "Scale record, production report, waste manifest"
      raw_fields: "batch_id; process_id; input_mass; conforming_output_mass; rework_in; rework_out; waste_mass; waste_type; destination; moisture_state"
      collection_method: "Calibrated scales and destination-specific waste records"
      unit: "kg"
      frequency: "Each batch or shift"
      temporal_coverage: "Same period as recipe and output data"
      site_scope: "Each represented line/site"
      aggregation_rule: "Reconcile process and overall mass balance; internal rework counted once; normalize net waste by reference output"
      quality_evidence: "Scale calibration; signed waste records; mass-balance reconciliation"
    - protocol_id: cp_energy_and_fuel
      process_id: "formulation_and_mixing_fermentation_and_resting_forming_and_thermal_processing_cooling_finishing_and_packaging_cleaning_and_utility_support"
      flow_role: "Electricity, fuels, steam, and delivered heat"
      record_type: "Meter, invoice, fuel issue, equipment runtime"
      raw_fields: "meter_id; carrier; opening_reading; closing_reading; fuel_quantity; power; runtime; production_mass; allocation_driver"
      collection_method: "Submeter preferred; otherwise calibrated runtime model reconciled to site totals"
      unit: "Native carrier unit and kWh or MJ after documented conversion"
      frequency: "Continuous, batch, shift, or billing period"
      temporal_coverage: "Same representative period as production, including relevant seasonal operating conditions"
      site_scope: "Each represented site and shared utility system"
      aggregation_rule: "Direct metering first; otherwise allocate by causal driver under section 7 and reconcile to site totals"
      quality_evidence: "Meter calibration; invoices; conversion factors; reconciliation residual and explanation"
    - protocol_id: cp_packaging_bom
      process_id: "cooling_finishing_and_packaging"
      flow_role: "Packaging materials and scrap"
      record_type: "Packaging BOM, issue record, unit count, scrap record"
      raw_fields: "product_id; package_format; component_id; material; unit_mass; units_used; recycled_content; scrap_mass; packaging_level"
      collection_method: "Component weighing and BOM reconciliation"
      unit: "kg"
      frequency: "Each package format or controlled BOM change"
      temporal_coverage: "All package formats included in the represented mix"
      site_scope: "Each represented packaging line/site"
      aggregation_rule: "Component mass × units used plus measured scrap; normalize to net saleable product mass"
      quality_evidence: "BOM approval; component specifications; sample weights; issue reconciliation"
    - protocol_id: cp_water_cleaning_and_wastewater
      process_id: "cleaning_and_utility_support"
      flow_role: "Cleaning water, agents, wastewater, sludge"
      record_type: "Water meter, cleaning log, chemical issue, discharge record"
      raw_fields: "water_in; recipe_water; cleaning_water; agent_mass; dilution; wastewater_volume; pollutant_load; sludge_mass; destination"
      collection_method: "Metering and inventory balance; sampling where available"
      unit: "kg, m3, and pollutant-specific units"
      frequency: "Shift, cleaning event, or meter period"
      temporal_coverage: "Same representative period as production"
      site_scope: "Each represented site and treatment system"
      aggregation_rule: "Separate recipe water; allocate shared cleaning by causal cleaning activity; reconcile water inputs and outputs"
      quality_evidence: "Meter calibration; cleaning schedule; chemical inventory; discharge/sampling records"
    - protocol_id: cp_fermentation_parameters
      process_id: "fermentation_and_resting_forming_and_thermal_processing"
      flow_role: "Yeast dosage, yeast action time, product applicability, oven VOC"
      record_type: "Recipe, proofing log, process control record, stack test"
      raw_fields: "product_id; yeast_type; initial_yeast_percent; initial_action_time_h; spike_yeast_percent; spike_action_time_h; leavening_route; oven_id; measured_voc"
      collection_method: "Recipe and control-system records; stack testing where available"
      unit: "%, h, kg VOC"
      frequency: "Each applicable recipe and campaign"
      temporal_coverage: "All yeast-raised baked products represented"
      site_scope: "Each applicable oven and product route"
      aggregation_rule: "Apply EPA equation only when scope conditions are satisfied; otherwise use measured or jurisdiction-specific method"
      quality_evidence: "Approved recipe; timestamped controls; applicability review; stack-test report"
    - protocol_id: cp_storage_and_refrigerant
      process_id: "conditioned_storage"
      flow_role: "Storage electricity, duration, rejects, refrigerant loss"
      record_type: "Zone meter, warehouse inventory, maintenance and recharge log"
      raw_fields: "zone_id; temperature; humidity; product_mass; entry_time; exit_time; electricity; refrigerant_type; charge; recharge; recovered_mass; reject_mass"
      collection_method: "Zone metering, inventory records, and refrigerant mass balance"
      unit: "kWh, kg, h or day"
      frequency: "Continuous or each storage event; maintenance event"
      temporal_coverage: "Declared onsite storage period within the representative production period"
      site_scope: "Each controlled zone serving represented product"
      aggregation_rule: "Allocate electricity by causal occupancy/time/capacity model; calculate refrigerant loss from verified inventory balance"
      quality_evidence: "Meter calibration; temperature logs; service records; refrigerant invoices and recovery certificates"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground rows"
      rule: "Normalized amount = period or batch amount / net saleable reference-product mass from the same scope"
      inputs:
        - "Collected flow amount"
        - "net saleable mass"
      output: "Amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "Each process and complete foreground system"
      rule: "Reconcile input mass = saleable output + co-product output + waste + direct mass emissions + inventory change; identify moisture transfer/evaporation separately and explain any residual"
      inputs:
        - "Ingredient/intermediate mass"
        - output
        - waste
        - emissions
        - "inventory change"
        - moisture
      output: "Reconciled yield, losses, and residual disclosure"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_energy_intensity
      applies_to: "Energy-consuming processes"
      rule: "Carrier intensity = measured carrier use attributable to product / net saleable product mass; retain each carrier separately"
      inputs:
        - "Meter/fuel records"
        - "allocation driver"
        - "net saleable mass"
      output: "kWh, MJ, kg, or m3 per kg product"
      source_ids:
        - eu-fdm-bref-2019
    - id: calc_packaging_intensity
      applies_to: "Packaging"
      rule: "Packaging intensity by component = component unit mass × units used / net saleable product mass; add measured scrap separately"
      inputs:
        - "Component mass"
        - "unit count"
        - "net product mass"
        - scrap
      output: "kg component and kg scrap per kg product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_water_balance
      applies_to: "Recipe, cleaning, and wastewater"
      rule: "Reconcile incoming water with water retained in product, evaporation, wastewater, and other documented outlets; do not infer cleaning water from recipe water"
      inputs:
        - "Water meters"
        - "recipe water"
        - "product moisture"
        - wastewater
        - "evaporation estimate"
      output: "Water-use and wastewater intensity with residual"
      source_ids:
        - eu-fdm-bref-2019
    - id: calc_yeast_baking_voc
      applies_to: "Yeast-raised baked products within EPA scope"
      rule: "VOC EF [lb VOC/short ton baked product] = 0.95 × Yi + 0.195 × ti - 0.51 × S - 0.86 × ts + 1.90; convert to kg/kg and multiply by product output. Yi and S are initial and spike baker's yeast percentages; ti and ts are their action times in hours."
      inputs:
        - "Product applicability"
        - Yi
        - ti
        - S
        - ts
        - "baked-product mass"
      output: "Product-specific oven VOC to air"
      source_ids:
        - us-epa-ap42-9-9-6
        - us-epa-bakery-act-1992
    - id: calc_refrigerant_loss
      applies_to: "Controlled storage"
      rule: "Refrigerant loss = opening inventory + purchases/recharge - closing inventory - recovered/transferred mass, allocated to represented product by documented causal storage driver"
      inputs:
        - "Refrigerant inventory and service records"
        - "allocation driver"
      output: "kg refrigerant emitted per kg product"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and inputs"
      requirement: "Use the declared product/recipe/package identity and verified Tiangong reference UUID; do not infer recipe or process data from the representative Chinese Pastry description"
      evidence: "Product specification; approved recipe; package BOM; Tiangong UUID readback evidence retained outside PCR content"
    - id: dq_technology_geography_time
      applies_to: "All foreground data"
      requirement: "Document technological, geographical, and time representativeness and explain any proxy, shared-site allocation, missing period, or excluded route"
      evidence: "Dataset metadata; site/line list; represented period; process description; representativeness assessment"
    - id: dq_measurement_traceability
      applies_to: "Mass, energy, water, packaging, waste, and emissions"
      requirement: "Retain calibrated measurement or reconciled source records and document conversion factors, allocation drivers, and residuals"
      evidence: "Calibration certificates; meters; invoices; batch logs; reconciliations; sampling or test reports"
    - id: dq_completeness
      applies_to: "Complete foreground system"
      requirement: "Cover every required process and explicitly mark conditional processes applicable or not applicable; account for major recipe inputs, utilities, packaging, waste, wastewater, and direct emissions"
      evidence: "Completeness checklist; process map; mass/energy/water reconciliations; non-applicability justifications"
    - id: dq_uncertainty_and_estimates
      applies_to: "Estimated and modelled values"
      requirement: "Label modelled values and provisional ranges; report method, input uncertainty, and replacement plan. reasoned_estimate ranges are QA priors, not default foreground values"
      evidence: "Calculation workbook; uncertainty note; review record; source replacement action"
    - id: dq_source_currency
      applies_to: "External rules and factors"
      requirement: "Verify source status and applicability at dataset release; replace superseded regulatory, PCR, or emission-factor methods when the declared jurisdiction or programme requires newer rules"
      evidence: "Source register; retrieval date; applicability and currency review"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The reference product UUID, Mass flow-property UUID, mass unit-group UUID, and kg unit shall match section 3, and the normalized reference output shall equal 1 kg net saleable product."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Every required qualifier in section 3 shall be present; the representative Chinese Pastry flow shall not substitute for product-specific recipe, route, package, or storage declarations."
    source_ids:
      - china-gb-7099-2015
      - china-gb-8957-2016
  - rule_id: validate_process_coverage
    applies_to: "Process inventory"
    rule: "All required processes shall contain collected or calculated foreground values; each conditional process shall be marked applicable with data or not applicable with justification."
    source_ids:
      - eu-fdm-bref-2019
  - rule_id: validate_mass_balance
    applies_to: "Each process and complete system"
    rule: "Inputs, product/co-product outputs, waste, direct mass emissions, inventory change, and moisture transfer shall be reconciled on consistent product states; any residual shall be quantified and explained."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_energy_water_packaging
    applies_to: "Major inventory drivers"
    rule: "Electricity, each thermal-energy carrier, recipe water, cleaning water, wastewater, and packaging shall be separately reported or explicitly justified as not applicable."
    source_ids:
      - eu-fdm-bref-2019
      - epd-food-beverage-pcr-2025-03
  - rule_id: validate_allocation
    applies_to: "Shared processes and co-products"
    rule: "The dataset shall document the selected allocation hierarchy step, driver, scope, and sensitivity where another relationship is used; unweighted site averages shall fail product-specific validation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_oven_voc_applicability
    applies_to: "Yeast-raised baked products"
    rule: "EPA oven-VOC calculation may be used only when product and process applicability, yeast percentages, and action times are documented; otherwise measured or jurisdiction-appropriate evidence is required or the gap shall be disclosed."
    source_ids:
      - us-epa-ap42-9-9-6
      - us-epa-bakery-act-1992
  - rule_id: validate_data_quality
    applies_to: "Published dataset candidate"
    rule: "Technology, geography, time, completeness, precision/uncertainty, documentation, and review evidence shall be disclosed; provisional reasoned estimates shall not be silently promoted to measured data."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Product- and formulation-specific foreground manufacturing dataset for pastry goods and cakes"
  downstream_use: "secondary_dataset; background_dataset when reviewed, representative, and linked to upstream and treatment datasets"
  allowed_use: "Manufacturing-gate inventory modelling for the declared product, recipe, technology, site/geography, package, storage condition, and represented period; aggregation into a declared production mix when weighting is documented"
  excluded_use: "Default recipe or global category average; direct substitution for bread, biscuits, waffles, confectionery, or raw dough; consumer-use or end-of-life claims outside an explicitly extended boundary; comparative claims without programme-specific review"
  required_metadata: "PCR id; reference UUIDs; product subtype; recipe/formulation version; ingredient/allergen profile; leavening and thermal route; filling/topping/coating; preservation and moisture state; package format; net and gross mass; site/geography; represented period and product mix; storage condition/shelf life; process applicability; allocation choices; source versions"
  required_quality_disclosure: "Foreground versus secondary data shares; measurement and calibration evidence; technology/geography/time representativeness; mass/energy/water reconciliation; allocation drivers; proxy datasets; missing flows; uncertainty; provisional reasoned estimates; source applicability; review status"
