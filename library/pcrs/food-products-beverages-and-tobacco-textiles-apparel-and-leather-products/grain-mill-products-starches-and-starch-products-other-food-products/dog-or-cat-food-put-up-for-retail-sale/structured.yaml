allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "all shared and multifunctional processes"
    rule: "Avoid allocation by subdivision, separate metering, batch records, or direct assignment whenever the input, output, waste, or emission can be attributed to one product or production line."
    source_ids:
      - eu-recommendation-2021-2279
      - fao-leap-feed-2016
  - rule_id: allocation_route_specific
    applies_to: "dry, wet, and semi-moist lines"
    rule: "Keep route-specific processing separate. Do not allocate dry-route burdens to wet products or wet-route burdens to dry products unless a measured shared process demonstrably serves both."
    source_ids:
      - fediaf-pet-food-pefcr-2025
  - rule_id: allocation_shared_utilities
    applies_to: "shared electricity, fuel, water, sanitation, and support services"
    rule: "Use product-specific meters or operating records first. When direct assignment is unavailable, allocate shared manufacturing utilities by conforming net production mass over the same site and period and disclose the products included."
    source_ids:
      - fediaf-pet-food-pefcr-2025
  - rule_id: allocation_physical_causality
    applies_to: "shared processes not represented by production mass"
    rule: "Use another physical parameter only when it explains the causal use of the shared process, and document the parameter, period, and reconciliation to the site total."
    source_ids:
      - fao-leap-feed-2016
  - rule_id: allocation_economic_fallback
    applies_to: "multifunctional outputs without defensible physical causality"
    rule: "Use economic allocation only after subdivision and physical causality are shown not to be feasible; disclose prices, averaging period, coproduct grouping, and a sensitivity assessment for comparative use."
    source_ids:
      - fao-leap-feed-2016
  - rule_id: allocation_rework_and_waste
    applies_to: "rework, residues, and waste"
    rule: "Internal rework carries its existing burdens and receives no new coproduct credit. Include collection, transport, and treatment burdens for waste leaving the system; do not assign avoided-burden credits unless a downstream study explicitly applies a compatible system-expansion rule."
    source_ids:
      - fao-leap-feed-2016
      - eu-recommendation-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_formula_materials
      process_id: "formulation_preparation"
      flow_role: "Ingredient and feed-material inputs"
      record_type: "Batch formulation and material issue records"
      raw_fields: "material id; supplier; origin; lot; as-received mass; moisture or dry matter when available; returned quantity"
      collection_method: "Reconcile approved recipe, warehouse issues, returns, and batch records"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Representative production period, normally at least 12 consecutive months or a justified seasonal campaign"
      site_scope: "Every site and line in dataset scope"
      aggregation_rule: "Sum net issued mass by material and divide by conforming net output"
      quality_evidence: "Signed batch records; inventory reconciliation; supplier specifications"
    - protocol_id: cp_process_water
      process_id: "formulation_preparation_dry_route_processing_wet_route_processing"
      flow_role: "Added and process water"
      record_type: "Meter and batch records"
      raw_fields: "meter id; opening and closing reading; batch id; process; quantity; recirculated quantity"
      collection_method: "Read calibrated meters or documented batch dosing systems"
      unit: "m3 or kg"
      frequency: "Continuous or each batch"
      temporal_coverage: "Same period as product output"
      site_scope: "Each included site and process line"
      aggregation_rule: "Subtract separately metered recirculation when appropriate and normalize net supplied water to output"
      quality_evidence: "Meter calibration; dosing records; water balance"
    - protocol_id: cp_energy_carriers
      process_id: "dry_route_processing_wet_route_processing_retail_packaging_site_support_losses"
      flow_role: "Electricity, fuels, steam, and on-site generation"
      record_type: "Meter, invoice, and fuel-stock records"
      raw_fields: "carrier; meter; quantity; unit; supplier; generation; export; line or site; period"
      collection_method: "Collect line meters where available and reconcile to site invoices and stock change"
      unit: "kWh, MJ, kg, or m3"
      frequency: "Continuous, monthly, or each delivery"
      temporal_coverage: "Same period as product output and representative of normal operation"
      site_scope: "Every included site with line and shared-site separation"
      aggregation_rule: "Directly assign line meters; allocate reconciled shared remainder under Section 7"
      quality_evidence: "Calibration; invoices; meter hierarchy; energy balance"
    - protocol_id: cp_packaging_materials
      process_id: "wet_route_processing_retail_packaging"
      flow_role: "Packaging inputs and losses"
      record_type: "Packaging bill of materials and issue records"
      raw_fields: "component id; material; packaging level; item count; mass per item; issued mass; returned mass; scrap"
      collection_method: "Combine product packaging specification with issued quantities and verified sample or supplier mass"
      unit: "item and kg"
      frequency: "Each packaging run or batch"
      temporal_coverage: "Same period as product output"
      site_scope: "Every packaging configuration in scope"
      aggregation_rule: "Convert item counts to mass, subtract verified returns, and normalize to net product output"
      quality_evidence: "Approved packaging specification; sample-weighing record; inventory reconciliation"
    - protocol_id: cp_product_quality_yield
      process_id: "dry_route_processing_wet_route_processing_retail_packaging"
      flow_role: "Conforming output and product qualifiers"
      record_type: "Batch yield, laboratory, and label records"
      raw_fields: "species; feeding purpose; life stage; route; product mass; unit count; net content; moisture; metabolizable energy; release status"
      collection_method: "Collect released-batch weights and quality results using documented methods"
      unit: "kg; percent moisture; kcal ME/kg"
      frequency: "Each released batch"
      temporal_coverage: "Same period as inventory inputs"
      site_scope: "Every product family, route, and site in scope"
      aggregation_rule: "Sum conforming released net content; keep rejected product out of denominator"
      quality_evidence: "Calibrated scales; laboratory report; approved label; batch-release record"
    - protocol_id: cp_batch_yield_losses
      process_id: "formulation_preparation_dry_route_processing_wet_route_processing_retail_packaging"
      flow_role: "Transfers, rework, and manufacturing losses"
      record_type: "Batch mass-balance and waste records"
      raw_fields: "input mass; transfer mass; conforming output; rework in and out; loss mass; waste type; destination"
      collection_method: "Reconcile adjacent process transfers and weigh losses by disposition"
      unit: "kg"
      frequency: "Each batch with period reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included line and site"
      aggregation_rule: "Aggregate without double counting internal transfers or rework and normalize external losses to output"
      quality_evidence: "Batch reconciliation; scale records; waste tickets; rework ledger"
    - protocol_id: cp_sanitation_records
      process_id: "site_support_losses"
      flow_role: "Sanitation water and materials"
      record_type: "Cleaning schedules, dosing logs, and material issues"
      raw_fields: "area or equipment; cleaning event; water; chemical id; concentration; issued quantity; recovery"
      collection_method: "Collect automated cleaning-system records or signed sanitation logs and material issues"
      unit: "m3 and kg"
      frequency: "Each cleaning event"
      temporal_coverage: "Same period as product output"
      site_scope: "All shared and line-specific sanitation in scope"
      aggregation_rule: "Directly assign line events; allocate shared events under Section 7"
      quality_evidence: "Dosing calibration; cleaning log; chemical inventory reconciliation"
    - protocol_id: cp_wastewater_waste
      process_id: "site_support_losses"
      flow_role: "Wastewater and solid or hazardous waste"
      record_type: "Discharge meters, analytical reports, and waste shipment records"
      raw_fields: "waste id; quantity; water volume; pollutant load; treatment route; carrier; destination"
      collection_method: "Collect metered discharge and weighed shipment records; reconcile on-site treatment transfers"
      unit: "m3 and kg"
      frequency: "Continuous, each shipment, or permit interval"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included site"
      aggregation_rule: "Sum by waste identity and treatment route; prevent duplication between generation and treatment output"
      quality_evidence: "Meter calibration; laboratory analysis; manifests; contractor receipts"
    - protocol_id: cp_direct_emissions
      process_id: "formulation_preparation_dry_route_processing_wet_route_processing_site_support_losses"
      flow_role: "Direct elementary emissions"
      record_type: "Monitoring, permit, fuel, refrigerant, and engineering records"
      raw_fields: "pollutant; compartment; measured concentration or factor; activity; calculation method; period"
      collection_method: "Prefer direct monitoring; otherwise use documented mass balance or engineering calculation tied to collected activity"
      unit: "kg pollutant"
      frequency: "Monitoring or reporting interval"
      temporal_coverage: "Same period as product output"
      site_scope: "Every emitting source in dataset scope"
      aggregation_rule: "Calculate pollutant mass, reconcile with permits, and allocate only shared sources under Section 7"
      quality_evidence: "Calibration; laboratory report; permit filing; calculation workbook"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period or batch amount / conforming net pet-food output"
      inputs:
        - "collected amount"
        - "conforming net output mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - fediaf-pet-food-pefcr-2025
    - id: calc_packaging_mass
      applies_to: "packaging item records"
      rule: "packaging mass = issued item count × verified mass per item, less returned conforming items; reconcile the result to packaging inventory issues"
      inputs:
        - "item count"
        - "mass per item"
        - returns
        - "issued mass"
      output: "kg packaging per 1 kg net pet-food output"
      source_ids:
        - fediaf-pet-food-pefcr-2025
    - id: calc_energy_conversion
      applies_to: "fuels and purchased thermal energy"
      rule: "carrier energy = collected carrier quantity × documented lower heating value or supplier energy content; preserve original quantity and factor"
      inputs:
        - "carrier quantity"
        - "conversion factor"
        - "factor source"
      output: "MJ by carrier and original carrier quantity"
      source_ids:
        - eu-recommendation-2021-2279
    - id: calc_shared_allocation
      applies_to: "shared-site inputs and emissions"
      rule: "allocated amount = reconciled shared total × selected physical allocation share; conforming production mass is the default share unless another causal parameter is justified"
      inputs:
        - "shared total"
        - "product outputs"
        - "allocation parameter"
      output: "allocated amount per product family"
      source_ids:
        - fediaf-pet-food-pefcr-2025
        - fao-leap-feed-2016
    - id: calc_mass_balance
      applies_to: "each process and overall manufacturing system"
      rule: "mass-balance residual = total material inputs + internal transfers in − conforming outputs − internal transfers out − measured rework stock change − measured wastes − measured direct mass emissions"
      inputs:
        - ingredient
        - water
        - packaging
        - transfer
        - output
        - rework
        - waste
        - "and emission records"
      output: "disclosed residual and reconciliation status"
      source_ids:
        - eu-recommendation-2021-2279
    - id: calc_daily_ration_equivalence
      applies_to: "downstream complete pet-food PEF use"
      rule: "daily-ration mass = declared daily metabolizable-energy requirement / measured or substantiated product metabolizable-energy density"
      inputs:
        - "daily energy requirement"
        - "kcal ME/kg"
        - "target species and body-weight basis"
      output: "kg product per declared daily ration"
      source_ids:
        - fediaf-pet-food-pefcr-2025
        - fediaf-nutritional-guidelines-2024
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Preserve product, species, complete or complementary status, life stage, route, moisture, metabolizable-energy method, net content, recipe or product family, packaging, site, geography, and reporting period."
      evidence: "Approved specification, label, and batch-release record"
    - id: dq_primary_foreground
      applies_to: "site-controlled processes"
      requirement: "Use primary site- or supply-chain-specific data for processes under the manufacturer's control or direct influence; explain every secondary-data substitution."
      evidence: "Meters, invoices, batch records, engineering records, and substitution log"
    - id: dq_temporal_representativeness
      applies_to: "all foreground records"
      requirement: "Cover a period representative of normal production and disclose shutdowns, trials, abnormal losses, seasonal campaigns, and excluded batches."
      evidence: "Production calendar and coverage reconciliation"
    - id: dq_completeness
      applies_to: "material and energy inventory"
      requirement: "Reconcile purchased and issued materials, energy, water, product output, rework, packaging, waste, wastewater, and direct emissions to site totals; missing flows are data gaps, not zero values."
      evidence: "Mass, energy, water, and waste reconciliation"
    - id: dq_route_separation
      applies_to: "wet, dry, and semi-moist products"
      requirement: "Separate route-specific lines and meters or document the allocation of shared processes; do not merge unlike routes without preserving their technology shares."
      evidence: "Line mapping, meter hierarchy, and allocation workbook"
    - id: dq_geography_technology
      applies_to: "upstream links"
      requirement: "Use supplier, geographic, and technology information at the most specific available level and disclose proxy datasets."
      evidence: "Supplier records and background-dataset mapping"
    - id: dq_measurement_quality
      applies_to: "measured values"
      requirement: "Retain calibration, sampling, laboratory method, estimation formula, and responsible record for every material measurement or calculation."
      evidence: "Calibration certificates, laboratory reports, and calculation files"
    - id: dq_reviewability
      applies_to: "dataset package"
      requirement: "Keep raw records, transformations, allocation parameters, exclusions, and reconciliation results traceable from each normalized row to its evidence."
      evidence: "Audit trail and reviewer sign-off"
validation_rules:
  - rule_id: val_reference_output
    applies_to: "reference flow"
    rule: "The normalized conforming output shall equal 1 kg net pet-food content, packaging shall be separate, and all inventory rows shall use a declared conversion to that reference."
    source_ids:
      - fediaf-pet-food-pefcr-2025
      - eu-regulation-767-2009
  - rule_id: val_required_qualifiers
    applies_to: "product identity"
    rule: "All Required qualifiers in Section 3 shall be present and internally consistent with product, batch, label, and process-route records."
    source_ids:
      - eu-regulation-767-2009
      - fediaf-nutritional-guidelines-2024
  - rule_id: val_feeding_purpose
    applies_to: "complete and complementary product claims"
    rule: "A complete product shall be identified as sufficient for a daily ration; a complementary product shall identify the other feed or feeding context needed and shall not be represented as a complete daily ration by itself."
    source_ids:
      - eu-regulation-767-2009
      - fediaf-nutritional-guidelines-2024
  - rule_id: val_route_processes
    applies_to: "process map"
    rule: "Include the dry-route process only when applicable and the wet-route process only when applicable; at least one declared route-specific process shall connect preparation to retail-ready output."
    source_ids:
      - fediaf-recipes-processing
  - rule_id: val_packaging_reconciliation
    applies_to: "packaging inventory"
    rule: "Packaging components by material and level shall reconcile to the declared retail configuration and wet-route primary packaging shall not be counted again in final packaging."
    source_ids:
      - fediaf-pet-food-pefcr-2025
  - rule_id: val_mass_balance
    applies_to: "each process and overall manufacturing"
    rule: "Report the mass-balance residual and investigate material residuals using the declared measurement uncertainty and missing-flow review; do not force closure by assigning an unexplained residual to waste."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: val_energy_reconciliation
    applies_to: "energy inventory"
    rule: "Route-specific plus allocated shared energy shall reconcile to site totals by carrier and period; on-site generation, own use, export, and contractual electricity instruments shall be disclosed separately."
    source_ids:
      - fediaf-pet-food-pefcr-2025
  - rule_id: val_rework_no_double_count
    applies_to: "rework and same-category inputs"
    rule: "Internal rework shall appear as a linked internal transfer without duplicate upstream burdens, while purchased same-category input shall have a separate upstream dataset."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: val_allocation_disclosure
    applies_to: "shared processes and coproducts"
    rule: "Every allocated row shall identify the allocation rule, denominator, products included, period, and reconciliation to the unallocated total."
    source_ids:
      - fao-leap-feed-2016
      - fediaf-pet-food-pefcr-2025
  - rule_id: val_data_source_coverage
    applies_to: "external and background evidence"
    rule: "Every external method rule shall cite a listed source and every purchased material or service shall have an upstream dataset reference or an explicit unresolved data gap."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: val_daily_ration_use
    applies_to: "downstream PEF interpretation"
    rule: "A complete-meal comparison shall use product-specific metabolizable-energy density and a declared species/body-weight daily-energy basis to convert the manufacturing result to a daily ration; the 1 kg result alone is not a comparative PEF functional unit."
    source_ids:
      - fediaf-pet-food-pefcr-2025
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for retail-packaged dog or cat food"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supplier-specific or site-specific cradle-to-gate modelling; product-system assembly; manufacturing improvement; downstream PEF modelling after adding required upstream and downstream stages and, for complete meals, conversion to the daily-ration functional unit"
  excluded_use: "Standalone cradle-to-grave or comparative environmental claims; nutritional-compliance certification; pet-food safety certification; veterinary or therapeutic claims; substitution for missing ingredient, distribution, use, or end-of-life stages"
  required_metadata: "All Section 3 qualifiers; site and geography; reporting period; product and route shares; upstream dataset mapping; packaging bill; allocation rules; data coverage; exclusions; mass and energy reconciliation"
  required_quality_disclosure: "Primary versus secondary data status; measurement and estimation methods; temporal, geographic, and technological representativeness; completeness; proxy datasets; allocation; abnormal production; unresolved UUIDs; missing ranges and upstream links"
  update_trigger: "Material change in recipe or ingredient sourcing, species or life-stage claim, complete/complementary status, moisture or energy density, processing route or equipment, site energy or water system, packaging configuration, waste treatment, allocation basis, or data-quality evidence"
