system_boundary:
  rules:
    - rule_id: sb_received_materials
      applies_to: "manufacturing foreground"
      rule: "Include receipt, storage losses, weighing, grinding or size reduction, and mixing of ingredients and additives when performed at the reporting site."
      source_ids:
        - fediaf-pet-food-pefcr-2025
        - fediaf-recipes-processing
    - rule_id: sb_route_specific_processing
      applies_to: "manufacturing foreground"
      rule: "Include the declared dry, wet, or semi-moist processing route, including product-contact heating, cooling, drying, coating, filling, sealing, and sterilisation steps that occur at the reporting site."
      source_ids:
        - fediaf-pet-food-pefcr-2025
        - fediaf-recipes-processing
    - rule_id: sb_packaging
      applies_to: "manufacturing foreground"
      rule: "Include consumption and manufacturing-site losses of primary, secondary, and tertiary packaging; model production of packaging materials with linked upstream datasets."
      source_ids:
        - fediaf-pet-food-pefcr-2025
    - rule_id: sb_site_support
      applies_to: "manufacturing foreground"
      rule: "Include line and shared-site electricity, fuels, water, cleaning and sanitation materials, refrigeration, compressed air, on-site generation, manufacturing losses, wastewater, solid waste treatment, and direct elementary emissions when applicable."
      source_ids:
        - fediaf-pet-food-pefcr-2025
    - rule_id: sb_upstream_linking
      applies_to: "background connection"
      rule: "Represent ingredient production, packaging production, purchased energy, water supply, inbound material transport when in scope, and waste treatment through linked background datasets; do not treat missing links as zero burden."
      source_ids:
        - fediaf-pet-food-pefcr-2025
        - eu-recommendation-2021-2279
        - fao-leap-feed-2016
    - rule_id: sb_downstream_exclusion
      applies_to: "manufacturing dataset"
      rule: "Exclude distribution after the manufacturing gate, retail storage, consumer transport, feeding and use, consumer food loss, and packaging end-of-life from this foreground manufacturing dataset; add them explicitly for a cradle-to-grave study."
      source_ids:
        - fediaf-pet-food-pefcr-2025
    - rule_id: sb_recursive_rework
      applies_to: "rework and same-category inputs"
      rule: "Record internal rework once at the process where it re-enters and retain its original burdens within the same system; require an upstream dataset for purchased same-category material crossing the declared starting boundary."
      source_ids:
        - eu-recommendation-2021-2279
boundary_abstraction:
  declared_starting_condition: "Ingredients, feed materials, additives, processing aids, and packaging components as physically received at the manufacturing site, with their moisture state, origin, supplier identity, and upstream dataset references declared"
  starting_condition_role: "Factory-gate starting condition for a foreground pet-food manufacturing dataset"
  product_classification_scope: "Retail-packaged complete or complementary food intended for dogs or cats"
  recursive_input_rule: "Internally recycled or reworked pet food from the same manufacturing system is recorded as an internal loop and is not assigned duplicate upstream burdens; purchased finished or semi-finished dog or cat food entering from another system is an input product flow with an upstream dataset"
  upstream_dataset_requirement: "Link every purchased ingredient, feed material, additive, processing aid, energy carrier, water supply, and packaging material to a geographically and technologically representative upstream dataset or disclose the unresolved data gap"
  disclosure: "Declare species, feeding purpose, life stage, moisture class, product route, site, geography, reporting period, recipe or product-family aggregation, rework treatment, packaging configuration, allocation method, excluded processes, and all missing upstream or downstream stages"
