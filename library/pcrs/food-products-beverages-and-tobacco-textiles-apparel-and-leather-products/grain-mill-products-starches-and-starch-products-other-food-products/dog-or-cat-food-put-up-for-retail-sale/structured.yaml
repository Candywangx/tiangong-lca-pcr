measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Normalize every inventory result to 1 kg conforming net pet-food content; record packaging mass separately and do not include it in the reference amount."
  - id: as_sold_moisture
    applies_to: "reference product and ingredient quantities"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report the product in its as-sold state and retain measured moisture or dry-matter data needed to reconcile wet, dry, or semi-moist classifications and material balances."
  - id: energy_carrier_separation
    applies_to: "electricity and fuels"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh for electricity; MJ or carrier-specific mass/volume plus lower-heating-value conversion for fuels"
    rule: "Preserve each energy carrier separately. Record measured purchased or generated quantities and document every conversion factor without replacing carrier identity with a single undifferentiated energy total."
  - id: water_accounting
    applies_to: "process and sanitation water"
    required_property_ref:
      name: "Volume or Mass"
      uuid: ""
    required_unit: "m3 or kg"
    rule: "Record withdrawal or supplied water by measured quantity and convert between mass and volume only with a declared density assumption and temperature basis when material."
  - id: packaging_mass_conversion
    applies_to: "primary, secondary, and tertiary packaging"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert packaging item counts or surface areas to mass with product-specific specifications, measured sample masses, or supplier data, and retain the source record."
  - id: daily_ration_conversion
    applies_to: "downstream complete-meal PEF use"
    required_property_ref:
      name: "Mass and metabolizable energy"
      uuid: ""
    required_unit: "kg and kcal ME/kg"
    rule: "Do not compare complete pet foods on the 1 kg manufacturing reference alone. Calculate product mass per daily ration as declared daily energy requirement divided by product-specific metabolizable-energy density and disclose both inputs and their methods."
