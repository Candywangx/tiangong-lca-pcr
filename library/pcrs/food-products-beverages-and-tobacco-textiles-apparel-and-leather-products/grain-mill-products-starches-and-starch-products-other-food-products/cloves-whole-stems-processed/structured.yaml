allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared lines and utilities"
    rule: "Prefer process subdivision, dedicated meters, batch records or time-based equipment records before allocation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_mass_balance
    applies_to: "all clove material outputs"
    rule: "Reconcile accepted cloves to released product, saleable stem screenings, captured dust, rejects, spills and moisture change before assigning burdens. No default yield is supplied."
    source_ids:
      - codex-cxc-75-2015-2018
      - eu-pef-2021-2279
  - rule_id: allocation_saleable_stem_screenings
    applies_to: "saleable clove stem screenings"
    rule: "Treat separately marketed stem screenings as a co-product and disclose the physical or causal allocation relation used when subdivision cannot avoid allocation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_discarded_residues
    applies_to: "discarded screenings, dust and rejects"
    rule: "Keep discarded material as a waste flow with its treatment route; do not give it a co-product credit merely because it contains clove material."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework
    applies_to: "internal rework"
    rule: "Material returned within the same process chain is not a second output. Record only net losses and disclose the rework loop."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receipt_lot_records
      process_id: "raw_clove_receipt"
      flow_role: "raw lot, accepted mass, defect rejects and incoming package waste"
      record_type: "weighbridge, scale, inspection and laboratory records"
      raw_fields: "lot id; supplier; origin; scientific name; incoming mass; moisture; accepted mass; each reject class; package tare and discard mass"
      collection_method: "calibrated weighing plus lot-specific visual and laboratory acceptance records"
      unit: "kg, %"
      frequency: "each lot"
      temporal_coverage: "full reference period"
      site_scope: "every included facility and supplier lot"
      aggregation_rule: "sum by lot and normalize only after keeping reject classes separate"
      quality_evidence: "calibration, sample plan, photographs or inspection record, moisture and test reports"
    - protocol_id: cp_cleaning_sorting_records
      process_id: "clove_cleaning_sorting"
      flow_role: "dry and wet cleaning exchanges"
      record_type: "meters, dosing logs, scales, detector and discharge records"
      raw_fields: "input and output mass; electricity; compressed air; water; each chemical; hot water; each screening; each debris class; dust; wastewater volume; pollutant concentrations"
      collection_method: "stage meters and batch logs with separate waste containers and discharge sampling"
      unit: "kg, kWh, Nm3, MJ"
      frequency: "each batch and discharge event"
      temporal_coverage: "full reference period"
      site_scope: "every included cleaning line"
      aggregation_rule: "sum each atomic exchange by batch; no wet-route value on a dry-only batch"
      quality_evidence: "meter calibration, chemical invoices, detector logs, waste tickets and laboratory reports"
    - protocol_id: cp_drying_records
      process_id: "clove_drying_conditioning"
      flow_role: "drying inputs, outputs and moisture"
      record_type: "batch log, meters, scales and moisture tests"
      raw_fields: "inlet and outlet product mass; inlet and outlet moisture; electricity; steam; hot water; heated air; condensate; rejects; exhaust dust"
      collection_method: "calibrated mass and moisture tests plus utility meters"
      unit: "kg, %, kWh, MJ"
      frequency: "each drying batch"
      temporal_coverage: "full reference period"
      site_scope: "every included dryer"
      aggregation_rule: "calculate lot-specific water removal and normalize from the same batch"
      quality_evidence: "calibration, moisture method, time-temperature-humidity log and exhaust-control record"
    - protocol_id: cp_size_reduction_records
      process_id: "clove_size_reduction"
      flow_role: "crushing, grinding, sieving and dust"
      record_type: "scales, electricity meter, compressed-air meter and sieve tests"
      raw_fields: "whole input; declared output form; particle-size distribution; electricity; compressed air; each screening; metal; dust; filter bags"
      collection_method: "batch weighing, meter reads and retained sieve analysis"
      unit: "kg, kWh, Nm3, %, mm or µm"
      frequency: "each batch"
      temporal_coverage: "full reference period"
      site_scope: "every included mill or crusher"
      aggregation_rule: "keep crushed, ground and powder batches separate and close mass balance"
      quality_evidence: "calibration, sieve method, detector record, filter service log and batch traceability"
    - protocol_id: cp_steam_treatment_records
      process_id: "steam_microbial_reduction"
      flow_role: "treatment inputs, outputs, rejects and emissions"
      record_type: "treatment batch record, meters, scales and validation record"
      raw_fields: "form; product mass; steam; electricity; time; temperature; pressure; condensate; inlet and outlet moisture; each reject form; water vapour; dust"
      collection_method: "validated treatment log linked to product lot and utility meters"
      unit: "kg, kWh, MJ, °C, time, pressure"
      frequency: "each treatment batch"
      temporal_coverage: "full reference period"
      site_scope: "every included treatment unit"
      aggregation_rule: "keep each product form and treatment recipe separate"
      quality_evidence: "current validation, critical-limit records, calibration and corrective-action record"
    - protocol_id: cp_additive_dosing_records
      process_id: "anticaking_agent_dosing"
      flow_role: "INS 551 formulation and losses"
      record_type: "formulation, scale, invoice and batch records"
      raw_fields: "product form; clove input; INS 551 mass and specification; electricity; formulated output; each spill; dust"
      collection_method: "calibrated dosing and batch reconciliation"
      unit: "kg, kWh"
      frequency: "each formulation batch"
      temporal_coverage: "full reference period"
      site_scope: "every included dosing line"
      aggregation_rule: "calculate additive concentration per declared product batch"
      quality_evidence: "supplier specification, legal applicability check, scale calibration and batch release record"
    - protocol_id: cp_utility_generation_records
      process_id: "onsite_heat_generation"
      flow_role: "fuel, water, generated heat, blowdown and stack species"
      record_type: "fuel meters, invoices, water meter, heat meter and stack record"
      raw_fields: "each fuel; water; electricity; steam; hot water; heated air; blowdown; each air species; operating hours"
      collection_method: "dedicated meters or documented allocation from common utility records; stack measurement or approved calculation"
      unit: "kg, kWh, MJ"
      frequency: "continuous or each operating shift"
      temporal_coverage: "full reference period"
      site_scope: "every included boiler or heater"
      aggregation_rule: "retain each fuel and species separately; allocate only after subdivision is exhausted"
      quality_evidence: "meter calibration, fuel certificate, heat balance, stack report and factor provenance"
    - protocol_id: cp_packaging_release_records
      process_id: "packaging_storage_release"
      flow_role: "final form, package, storage, refrigerant and release"
      record_type: "batch, packaging BOM, scale, electricity, refrigeration and release records"
      raw_fields: "exact clove form; net product; each package component; electricity; storage time and humidity; each refrigerant charge, purchase, recovery and closing stock; each scrap; each spill; release mass"
      collection_method: "product-specific BOM and lot scale linked to warehouse and refrigeration logs"
      unit: "kg, kWh, time, temperature, humidity"
      frequency: "each packing lot; refrigerant at service event and period close"
      temporal_coverage: "full reference period"
      site_scope: "every included packing and storage site"
      aggregation_rule: "one form and package per route; sum service records only for the matching equipment and period"
      quality_evidence: "scale calibration, BOM, supplier invoice, package specification, leak/service log and release certificate"
    - protocol_id: cp_sanitation_environment_records
      process_id: "sanitation_wastewater_control"
      flow_role: "sanitation chemicals, dust, wastewater, sludge and direct emissions"
      record_type: "cleaning log, meters, chemical logs, waste tickets, treatment and laboratory records"
      raw_fields: "electricity; compressed air; water; each chemical; each waste; wastewater volume; each pollutant concentration; methane and nitrous oxide activity data"
      collection_method: "documented dry or controlled-wet sanitation and flow-proportional or representative discharge sampling"
      unit: "kg, kWh, Nm3, m3"
      frequency: "each sanitation event; each discharge sample; period close"
      temporal_coverage: "full reference period"
      site_scope: "every included hygiene area and treatment unit"
      aggregation_rule: "keep dry and wet events separate; compute each pollutant load over matching volume and time"
      quality_evidence: "cleaning verification, calibration, chemical invoice, laboratory QA, waste ticket and treatment log"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every non-reference row"
      rule: "normalized amount = period amount attributable to the declared form and route ÷ net kg of released reference product from the same scope and period"
      inputs:
        - "atomic flow amount"
        - "released net product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_clove_mass_balance
      applies_to: "receipt through release"
      rule: "accepted cloves = released product + saleable stem screenings + all clove-bearing wastes + spills + measured water-mass change, adjusted for opening and closing work in progress"
      inputs:
        - "lot masses"
        - moisture
        - "inventory change"
      output: "lot mass-balance residual"
      source_ids:
        - codex-cxc-75-2015-2018
        - eu-pef-2021-2279
    - id: calc_removed_water
      applies_to: "drying and steam treatment"
      rule: "removed water = inlet product × inlet moisture fraction − outlet product × outlet moisture fraction − collected liquid water, on a consistent moisture basis"
      inputs:
        - "inlet and outlet mass and moisture"
        - condensate
      output: "water vapour or unexplained water residual"
      source_ids:
        - codex-cxc-75-2015-2018
    - id: calc_particle_size
      applies_to: "crushed, ground and powder outputs"
      rule: "report retained mass fraction for each declared sieve aperture and link the distribution to the released lot; no default cut point is imposed"
      inputs:
        - "sieve aperture"
        - "retained mass"
        - "sample mass"
      output: "particle-size distribution"
      source_ids:
        - codex-cxs-344-2021-2025
        - codex-cxc-75-2015-2018
    - id: calc_combustion_species
      applies_to: "on-site heat generation"
      rule: "use direct stack mass where available; otherwise multiply each separately measured fuel quantity by a documented jurisdiction- and equipment-specific factor without combining species"
      inputs:
        - "each fuel"
        - "factor or stack data"
        - "operating period"
      output: "mass of one named air species"
      source_ids:
        - jrc-fdm-bref-2019
        - eu-pef-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "controlled storage"
      rule: "direct release = opening charge + additions − closing charge − recovered amount − transferred amount, calculated for one refrigerant identity"
      inputs:
        - "charge and service records for one refrigerant"
      output: "mass of that refrigerant to air"
      source_ids:
        - eu-climate-industrial-refrigeration-2025
        - eu-pef-2021-2279
    - id: calc_wastewater_pollutant
      applies_to: "direct water emissions"
      rule: "pollutant mass = discharge volume × time-matched concentration, with unit conversion and treatment boundary documented"
      inputs:
        - volume
        - concentration
        - "sampling period"
      output: "mass of one named pollutant to water"
      source_ids:
        - jrc-fdm-bref-2019
        - eu-pef-2021-2279
    - id: calc_packaging_exclusion
      applies_to: "reference product"
      rule: "gross packed mass − measured package tare = net reference-product mass"
      inputs:
        - "gross mass"
        - "each package-component tare"
      output: "net kg of released cloves"
      source_ids:
        - codex-cxs-344-2021-2025
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_form
      applies_to: "reference product and incoming lot"
      requirement: "Preserve lot traceability, scientific name, CPC starting state, final form, particle size, treatment history and formulation."
      evidence: "supplier specification, retained sample, batch record and release certificate"
    - id: dq_route_separation
      applies_to: "all processes"
      requirement: "Do not aggregate wet and dry cleaning, dried and non-dried, treated and untreated, or whole, crushed, ground and powdered routes before route-specific results are available."
      evidence: "route-coded production and meter records"
    - id: dq_temporal_site
      applies_to: "foreground activity data"
      requirement: "Cover a representative period for every included facility and disclose shutdowns, seasonal lots and missing records."
      evidence: "period ledger and site list"
    - id: dq_meter_calibration
      applies_to: "mass, energy, water, pressure and concentration data"
      requirement: "Use calibrated or otherwise quality-controlled measurement systems and retain conversion factors."
      evidence: "calibration and laboratory QA records"
    - id: dq_inventory_completeness
      applies_to: "each included process"
      requirement: "Reconcile known inputs and outputs, including product, co-product, waste and direct emissions, and document any material residual."
      evidence: "mass, moisture, energy and wastewater balances"
    - id: dq_source_applicability
      applies_to: "external method rules"
      requirement: "Record which Codex, JRC, EU and local legal provisions apply to the actual product and geography; an external method source does not create a default amount."
      evidence: "applicability assessment and source register"
    - id: dq_uuid_status
      applies_to: "every inventory flow"
      requirement: "Keep non-reference Tiangong UUIDs blank until the exact semantic flow is independently confirmed by both required identity checks."
      evidence: "manifest unresolved-flow entry or completed identity review"
    - id: dq_no_default_amounts
      applies_to: "every non-reference row"
      requirement: "Produce the first value from foreground records or a named calculation rule; this candidate PCR supplies no reasoned-estimate range."
      evidence: "collection protocol and calculation worksheet"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the reference UUID, Product flow type, CPC 23926 identity, Mass property, Units of mass group and kg unit before release."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validation_single_form_route
    applies_to: "dataset identity"
    rule: "Reject a dataset that averages product forms, particle-size specifications, treatment routes or package configurations without separately reported route results."
    source_ids:
      - codex-cxs-344-2021-2025
      - codex-cxc-75-2015-2018
      - eu-pef-2021-2279
  - rule_id: validation_process_conditions
    applies_to: "process map"
    rule: "Every conditional process shall have a true/false declaration and supporting facility record; required processes shall have inventory sections and data."
    source_ids:
      - codex-cxc-75-2015-2018
      - eu-pef-2021-2279
  - rule_id: validation_atomic_exchange
    applies_to: "process inventory"
    rule: "Each card shall contain one concrete exchange only. Utilities, fuels, chemicals, package components, wastes, refrigerants and emission species shall remain separate."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_mass_moisture_balance
    applies_to: "product chain"
    rule: "Investigate and disclose unexplained accepted-clove, product, residue and moisture imbalance before publication."
    source_ids:
      - codex-cxc-75-2015-2018
      - eu-pef-2021-2279
  - rule_id: validation_wastewater_boundary
    applies_to: "wastewater"
    rule: "Reject double counting of a wastewater waste flow and a direct environmental discharge for the same stream and treatment boundary."
    source_ids:
      - jrc-fdm-bref-2019
      - eu-pef-2021-2279
  - rule_id: validation_refrigerant_identity
    applies_to: "controlled storage"
    rule: "Require the exact refrigerant identity and separate make-up and direct-release records; a non-listed refrigerant needs its own atomic row before dataset publication."
    source_ids:
      - eu-climate-industrial-refrigeration-2025
      - eu-pef-2021-2279
  - rule_id: validation_no_unsupported_defaults
    applies_to: "amounts and ranges"
    rule: "Reject an amount or range not produced by a foreground protocol, named calculation or cited external evidence."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_traceability
    applies_to: "external communication"
    rule: "Retain source records, calculations, data-quality evidence and route metadata needed for verification."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Candidate foreground dataset that may become a secondary_dataset or background_dataset after methodology and data review."
  downstream_use: "Product-form- and route-specific modelling of processed cloves at packaged facility gate."
  allowed_use: "Use for the declared botanical identity, product form, particle size, treatment route, formulation, package, geography, technology and reference period."
  excluded_use: "Raw cloves, another spice, clove extracts or oils, mixed seasonings, an undeclared treatment route, or an average across product forms or packages."
  required_metadata: "PCR id and version; CPC coordinate; reference UUID; scientific name; raw state; lot and origin; final form; particle size; moisture; included processes; treatment validation; additive formulation; package BOM; storage; geography; period; site and supplier coverage; allocation; unresolved UUID status."
  required_quality_disclosure: "Foreground coverage, meter and laboratory quality, mass/moisture/energy balance, sampling, allocation, missing data, source applicability, direct-emission method and uncertainty."
  update_trigger: "Change in botanical/raw state, form, particle specification, process sequence, microbial treatment, additive, fuel or electricity supply, refrigerant, package, site, supplier mix, allocation, governing product standard, reference-flow identity or material foreground performance."
