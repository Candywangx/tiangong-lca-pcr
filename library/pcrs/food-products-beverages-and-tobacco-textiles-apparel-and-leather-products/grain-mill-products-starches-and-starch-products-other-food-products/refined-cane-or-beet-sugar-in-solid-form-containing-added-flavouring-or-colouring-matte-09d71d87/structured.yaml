system_boundary:
  rules:
    - rule_id: sb_route_exclusivity
      applies_to: "foreground system"
      rule: "Model exactly one of Family A or Family B. Do not include inactive-family processes or assume both families occur."
      source_ids:
        - unsd-cpc-3-0-structure-2024
    - rule_id: sb_family_a_start
      applies_to: "Family A"
      rule: "Start at purchased refined sugar receipt and include formulation, mixing or coating, conditional drying, cleaning, and packaging through released product."
      source_ids:
        - unsd-cpc-3-0-structure-2024
        - eu-pef-method-2021
    - rule_id: sb_family_b_start
      applies_to: "Family B"
      rule: "Start at maple sap receipt and include filtration, evaporation/concentration, cleaning, packaging, and crystallization only for solid maple sugar."
      source_ids:
        - cornell-maple-beginners-notebook-2019
        - penn-state-maple-syrup-production
    - rule_id: sb_complete_foreground
      applies_to: "selected route"
      rule: "Record all known material, water, energy, product, waste, wastewater, sludge, and direct elementary flows for included foreground operations."
      source_ids:
        - eu-pef-method-2021
    - rule_id: sb_stationary_combustion
      applies_to: "on-site heat generation"
      rule: "Record each combusted fuel separately and calculate direct carbon dioxide, methane, and nitrous oxide; distinguish fossil and biogenic carbon dioxide."
      source_ids:
        - ipcc-2006-stationary-combustion
        - checkoway-et-al-maple-footprint-2024
