allocation_rules:
  - rule_id: alloc_subdivide_routes
    applies_to: "all foreground operations"
    rule: "First subdivide Family A, Family B, syrup, solid sugar, and packaging lines using meters, batch records, and production time; never allocate burdens across the two product families by default."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_internal_heat
    applies_to: "on-site heat generation"
    rule: "Assign metered steam or useful heat directly to the consuming route; allocate only the unmetered remainder using a documented physical driver such as delivered energy."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_shared_cleaning
    applies_to: "equipment cleaning"
    rule: "Assign recipe- or campaign-specific cleaning directly; otherwise allocate shared cleaning using recorded cleaning time, vessel volume, or product-contact area and disclose the selected physical driver."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_recovered_material
    applies_to: "recovered product, filter residue, ash, and packaging waste"
    rule: "Treat a material as a co-product only when it has a documented beneficial use and economic or functional value; otherwise model it as waste with its treatment. Report avoided-burden or recycling substitution only in a separate declared scenario."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_route_a_bom
      process_id: "route_a_formulation"
      flow_role: "each Family A ingredient"
      record_type: "formulation and receipt records"
      raw_fields: "ingredient identity; supplier; lot; accepted mass; addition mass; formulation code"
      collection_method: "reconcile controlled recipe, scale tickets, and inventory issues"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "full declared reporting period"
      site_scope: "each formulation site and product"
      aggregation_rule: "sum each ingredient separately and divide by accepted formulated output"
      quality_evidence: "calibrated scale records; recipe approval; supplier specification; inventory reconciliation"
    - protocol_id: cp_route_a_operations
      process_id: "route_a_formulation"
      flow_role: "water, electricity, steam, heat, and output"
      record_type: "meter and batch records"
      raw_fields: "meter start/end; batch id; drying status; input/output mass; moisture; rejects"
      collection_method: "submeter or allocate from documented physical driver"
      unit: "kg; kWh; MJ"
      frequency: "each batch or meter interval"
      temporal_coverage: "full declared reporting period"
      site_scope: "each formulation line"
      aggregation_rule: "aggregate only batches of the same declared product and route"
      quality_evidence: "meter calibration; batch sheets; moisture tests; allocation worksheet"
    - protocol_id: cp_route_b_operations
      process_id: "route_b_maple_processing"
      flow_role: "sap, filtration materials, utilities, and maple outputs"
      record_type: "scale, meter, and process records"
      raw_fields: "sap mass; initial/final soluble solids; RO status; filter media; evaporation output; crystallization status; syrup/sugar mass"
      collection_method: "direct measurement with hydrometer/refractometer and equipment logs as applicable"
      unit: "kg; kWh; MJ"
      frequency: "each boil or batch"
      temporal_coverage: "complete declared maple campaign"
      site_scope: "each sugarhouse and technology route"
      aggregation_rule: "aggregate only equivalent syrup or solid-sugar routes"
      quality_evidence: "instrument calibration; boil log; filter log; product release record"
    - protocol_id: cp_fuel_and_heat
      process_id: "onsite_heat_generation"
      flow_role: "each fuel and delivered heat/steam"
      record_type: "invoice, tank, scale, moisture, and meter records"
      raw_fields: "fuel identity; mass or volume; density; moisture; net calorific value; steam/heat delivery"
      collection_method: "reconcile purchases and inventory change; convert each fuel separately"
      unit: "kg; m3; MJ; kWh"
      frequency: "each delivery and reporting interval"
      temporal_coverage: "full declared reporting period"
      site_scope: "each combustion unit"
      aggregation_rule: "calculate each fuel energy separately before summing delivered energy"
      quality_evidence: "invoices; tank/scale calibration; calorific-value source; boiler meter; efficiency evidence"
    - protocol_id: cp_cleaning
      process_id: "equipment_cleaning"
      flow_role: "water, cleaning agents, energy, wastewater"
      record_type: "clean-in-place and sanitation logs"
      raw_fields: "route served; water; chemical product; concentration; electricity; steam; discharge"
      collection_method: "meter, weigh, or use validated dosing records"
      unit: "kg; kWh; MJ"
      frequency: "each cleaning event"
      temporal_coverage: "full declared reporting period"
      site_scope: "each shared or dedicated cleaning system"
      aggregation_rule: "direct assignment first; otherwise apply declared physical allocation driver"
      quality_evidence: "cleaning log; dosing calibration; chemical specification; discharge meter"
    - protocol_id: cp_packaging
      process_id: "packaging"
      flow_role: "each packaging component and packaging energy"
      record_type: "purchase, specification, count, and line records"
      raw_fields: "material identity; unit mass; units used; rejects; reuse trips; electricity"
      collection_method: "verify component mass and reconcile purchases, stocks, and packed units"
      unit: "kg; count; kWh"
      frequency: "each packaging lot and reporting interval"
      temporal_coverage: "full declared reporting period"
      site_scope: "each packaging line and product"
      aggregation_rule: "calculate each component separately per kg net released product"
      quality_evidence: "supplier specification; sample weighing; stock reconciliation; line meter"
    - protocol_id: cp_waste_and_release
      process_id: "all"
      flow_role: "products, losses, residues, wastewater, sludge, ash, and packaging wastes"
      record_type: "scale, discharge, treatment, and release records"
      raw_fields: "stream identity; wet mass; dry solids when relevant; destination; released product mass"
      collection_method: "weigh or meter each stream and reconcile with mass balance"
      unit: "kg"
      frequency: "each batch or disposal event"
      temporal_coverage: "full declared reporting period"
      site_scope: "each site and product"
      aggregation_rule: "keep streams separate by physical identity and destination"
      quality_evidence: "scale/meter calibration; waste transfer note; product release; mass-balance worksheet"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "all exchanges"
      rule: "normalized exchange = route-attributable exchange / net released mass of the single declared product"
      inputs:
        - "exchange amount"
        - "released product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_fuel_energy
      applies_to: "each fuel"
      rule: "fuel energy = measured fuel quantity × documented density when needed × net calorific value; calculate by fuel before aggregation"
      inputs:
        - "fuel mass or volume"
        - density
        - moisture
        - "net calorific value"
      output: "MJ by fuel"
      source_ids:
        - ipcc-2006-stationary-combustion
    - id: calc_combustion_emissions
      applies_to: "CO2, CH4, and N2O"
      rule: "emission by gas and fuel = fuel energy × applicable fuel/technology emission factor; sum only after retaining fuel-resolved calculations"
      inputs:
        - "MJ by fuel"
        - "emission factor by gas and fuel"
      output: "kg CO2 fossil; kg CO2 biogenic; kg CH4; kg N2O"
      source_ids:
        - ipcc-2006-stationary-combustion
    - id: calc_mass_balance
      applies_to: "each selected route"
      rule: "mass-balance difference = total measured mass inputs - products - separately measured wastes - wastewater - accounted evaporation or retained water; investigate unexplained differences"
      inputs:
        - "ingredient or sap inputs"
        - water
        - products
        - wastes
        - wastewater
        - "water vapour"
      output: "route mass-balance residual"
      source_ids: []
    - id: calc_packaging_mass
      applies_to: "each packaging component"
      rule: "component mass = verified unit mass × consumed units, adjusted for documented reusable trips where applicable"
      inputs:
        - "unit mass"
        - "units consumed"
        - "reuse trips"
        - "released product"
      output: "kg component per 1 kg product"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_route_identity
      applies_to: "dataset"
      requirement: "Declare exactly one family, one final product state, one formulation or maple route, and the included conditional steps."
      evidence: "product master; process flow diagram; batch/campaign records"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Reconcile all known inputs and outputs, including utilities, every actual fuel, each ingredient, each packaging component, losses, filter residues, wastewater, sludge, ash, and direct emissions."
      evidence: "reconciled ledgers; meters; waste transfer records; mass balance"
    - id: dq_representativeness
      applies_to: "activity data"
      requirement: "Use records representative of the declared site, technology, geography, product, and period; explain exclusions, substitutions, shutdowns, and abnormal campaigns."
      evidence: "data-quality assessment and retained raw records"
    - id: dq_atomic_identity
      applies_to: "flows"
      requirement: "Confirm one Tiangong flow UUID for each concrete exchange before review or publication; add any actual ingredient, fuel, cleaning chemical, packaging component, waste, or emission not represented here as its own row."
      evidence: "direct-read flow record and identity review"
    - id: dq_range_evidence
      applies_to: "quantitative ranges"
      requirement: "Do not create a range from one case or duplicate a single value as equal bounds. Any later empirical range requires at least two independent original sources with compatible boundary, unit, and basis."
      evidence: "source comparison and range-inference note"
validation_rules:
  - rule_id: val_one_family
    applies_to: "dataset"
    rule: "Pass only when exactly one of Family A or Family B is selected and inactive-family exchanges are absent."
    source_ids:
      - unsd-cpc-3-0-structure-2024
  - rule_id: val_product_state
    applies_to: "Family B"
    rule: "Pass only when syrup or solid_sugar is declared; require crystallization for solid_sugar and prohibit it as a default syrup step."
    source_ids:
      - cornell-maple-beginners-notebook-2019
  - rule_id: val_family_a_steps
    applies_to: "Family A"
    rule: "Require purchased refined sugar, each actual flavouring/colour/anti-caking/carrier input, mixing or coating, conditional drying disclosure, product loss, cleaning, and packaging."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_family_b_steps
    applies_to: "Family B"
    rule: "Require maple sap receipt, filtration media, filtration residue, evaporation/concentration, product loss, wastewater, cleaning, packaging, and conditional crystallization disclosure."
    source_ids:
      - cornell-maple-beginners-notebook-2019
      - penn-state-maple-syrup-production
  - rule_id: val_fuels_and_emissions
    applies_to: "on-site combustion"
    rule: "Require a separate input for every actual fuel and fuel-resolved calculations for fossil CO2, biogenic CO2 when biomass is used, CH4, and N2O."
    source_ids:
      - ipcc-2006-stationary-combustion
  - rule_id: val_packaging_atomicity
    applies_to: "packaging"
    rule: "Require every actual primary, closure, label, secondary, tertiary, and reusable packaging component as a separate material flow and every physically separate packaging-waste stream as a separate output."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_reference_mass
    applies_to: "reference product"
    rule: "Require 1 kg net released product with the Mass and Units of mass UUIDs stated in section 3; packaging shall not be included in the reference mass."
    source_ids: []
  - rule_id: val_mass_balance
    applies_to: "each route"
    rule: "Require an explained route mass-balance residual and prohibit hiding product loss, filter residue, wastewater, sludge, packaging waste, or evaporation in an unclassified difference."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_range_provenance
    applies_to: "ranges"
    rule: "Reject equal lower/upper bounds copied from one value and reject inferred empirical ranges without at least two independent compatible original sources."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for one declared product and route"
  downstream_use: "secondary_dataset; background_dataset after review, UUID completion, and context-specific representativeness assessment"
  allowed_use: "Product-specific LCI, LCA, EPD, footprint, process, and lifecyclemodel work for the declared site, technology, geography, period, family, product state, and packaging configuration"
  excluded_use: "Averaging Family A with Family B; representing upstream sugar production or maple cultivation/tapping; representing confectionery or artificial maple-flavoured syrup; comparative claims without equivalent boundaries and review"
  required_metadata: "PCR id; product family and state; exact product identity; formulation or sap source; included steps; drying, RO, filtration, crystallization, heat and fuel technologies; packaging bill of materials; site; geography; period; allocation; flow UUIDs; source and data-quality references"
  required_quality_disclosure: "Primary-data share; measurement methods; calibration; temporal, geographical, and technological representativeness; allocation; mass-balance residual; missing UUIDs; proxies; exclusions; uncertainty; unresolved range evidence"
  update_trigger: "Change in family or product state, formulation, sap source, filtration/RO/evaporation/crystallization technology, fuel or electricity supply, packaging, allocation, site, reporting period, product specification, flow UUID, or material source evidence"
