system_boundary:
  rules:
    - rule_id: boundary_foreground_operations
      applies_to: "all foreground processes"
      rule: "Include all operated preparation, grinding, alkalisation, defatting, conditioning, storage, packing, cleaning, utility use, direct emissions, wastes, and co-products that occur between the declared starting condition and the plant-gate reference product."
      source_ids:
        - eu-jrc-fdm-bref-2019
    - rule_id: boundary_upstream_links
      applies_to: "purchased materials, utilities, transport, and treatment services"
      rule: "Keep excluded upstream production outside the foreground inventory but provide explicit linked datasets and disclose any proxy or data gap when a cradle-to-gate or broader result is produced."
      source_ids:
        - eu-pef-recommendation-2021-2279
    - rule_id: boundary_cutoff
      applies_to: "foreground exclusions"
      rule: "Avoid cut-off for cocoa material, energy, water, alkalising agents, packaging, saleable co-products, wastes, wastewater, and direct emissions; any other exclusion must be explicit, justified, and demonstrated to satisfy the cumulative material, energy, and environmental-significance screen used by the declared study method."
      source_ids:
        - eu-pef-recommendation-2021-2279
    - rule_id: boundary_internal_recycling
      applies_to: "reworked cocoa paste and internally recycled cocoa material"
      rule: "Record internal recycling without duplicating upstream production; disclose stock changes and losses and ensure the same mass is not counted as both fresh input and recycled input."
      source_ids:
        - mass-balance-identity
