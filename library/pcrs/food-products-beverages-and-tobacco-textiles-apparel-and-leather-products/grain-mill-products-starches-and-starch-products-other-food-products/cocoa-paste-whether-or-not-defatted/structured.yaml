allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "all multifunctional foreground processes"
    rule: "Avoid allocation by sub-metering and subdividing preparation, grinding, defatting, finishing, utility, and waste-treatment operations wherever separately attributable data can be collected."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_cocoa_butter
    applies_to: "defatted cocoa paste and recovered cocoa butter"
    rule: "After subdivision, allocate remaining shared defatting burdens between saleable defatted paste and saleable cocoa butter by their measured dry-mass outputs; use consistent moisture bases, disclose the factor, and report a sensitivity result when economic allocation would materially change conclusions."
    source_ids:
      - eu-pef-recommendation-2021-2279
      - mass-balance-identity
  - rule_id: allocation_waste_and_rework
    applies_to: "rejects, waste, internal rework, and recovered materials"
    rule: "Assign burdens to internal rework without duplicating upstream input; do not credit waste or recovered material unless a documented system-expansion or substitution method and destination dataset are applied consistently with the declared study method."
    source_ids:
      - eu-pef-recommendation-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_bean_preparation_records
      process_id: "bean_to_nib_preparation"
      flow_role: "beans; each utility carrier; nibs; each shell, reject, dust and wastewater output; each combustion emission"
      record_type: "receiving and batch logs; calibrated scales; carrier meters or invoices; waste and monitoring records"
      raw_fields: "bean and nib mass/moisture; electricity; steam; hot water; natural gas; diesel; LPG; water; each output mass; stock change; emission measurement or factor"
      collection_method: "reconcile each material, carrier and output independently by batch or reporting period"
      unit: "kg; kWh; MJ; % m/m"
      frequency: "each lot and monthly carrier reconciliation"
      temporal_coverage: "representative continuous 12-month period or all batches for a shorter campaign"
      site_scope: "every foreground preparation site"
      aggregation_rule: "preserve each carrier and output row, reconcile mass, and normalise to prepared nib output"
      quality_evidence: "calibration; supplier certificate; moisture result; fuel and heat records; batch genealogy; waste ticket; emission workpaper"
    - protocol_id: cp_grinding_records
      process_id: "nib_grinding_paste_manufacture"
      flow_role: "internal nibs; purchased nibs; each utility; each alkalising chemical; paste; each residue and wastewater"
      record_type: "batch recipe; scales; dosing and transfer logs; utility meters; laboratory and waste records"
      raw_fields: "each nib source mass; paste mass; electricity; steam; hot water; water; each chemical mass; moisture; cocoa-butter content; each waste mass; stock change"
      collection_method: "reconcile every input, chemical, transfer and output for each grinding batch"
      unit: "kg; kWh; MJ; % m/m"
      frequency: "each batch and monthly meter reconciliation"
      temporal_coverage: "representative continuous 12-month period or all batches for a shorter campaign"
      site_scope: "every foreground grinding line"
      aggregation_rule: "keep internal and purchased nibs and each chemical separate, then normalise to paste intermediate"
      quality_evidence: "calibration; formulation approval; chemical specification; sample identity; genealogy; mass-balance sign-off"
    - protocol_id: cp_defatting_records
      process_id: "paste_defatting"
      flow_role: "feed paste; electricity; steam; hot water; defatted paste; cocoa butter; cocoa cake; filter residue"
      record_type: "feed and product scales; press log; carrier meters; laboratory fat analysis; waste record"
      raw_fields: "feed mass/moisture/fat; each utility; each product mass/moisture/fat; residue mass; stock change"
      collection_method: "reconcile each defatting campaign on a common moisture basis and keep all saleable outputs separate"
      unit: "kg; kWh; MJ; % m/m"
      frequency: "each campaign and monthly carrier reconciliation"
      temporal_coverage: "all defatting campaigns in the reference period"
      site_scope: "every foreground defatting line"
      aggregation_rule: "calculate saleable dry-mass outputs and allocation factors, then normalise to paste feed"
      quality_evidence: "calibrated scales and meters; laboratory method; sample identity; campaign mass balance; allocation approval"
    - protocol_id: cp_finishing_records
      process_id: "paste_finishing_packing"
      flow_role: "internal paste; purchased paste; each utility; each package component; reference product; off-spec paste; each packaging waste"
      record_type: "transfer and dispatch records; filling scale; utility meters; component issues and tare weights; waste records"
      raw_fields: "each paste source; electricity; steam; hot water; each component count and mass; net product; tare; off-spec paste; each packaging waste; stock change"
      collection_method: "reconcile each paste source, carrier, packaging component and waste for every finished lot"
      unit: "kg; kWh; MJ; item"
      frequency: "each lot and monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or all lots for a shorter campaign"
      site_scope: "every foreground finishing and packing site"
      aggregation_rule: "subtract tare, preserve every packaging material separately, and normalise conforming output to 1,000 kg"
      quality_evidence: "scale and meter calibration; packaging specification; issue/return log; lot release; dispatch and waste tickets"
    - protocol_id: cp_cleaning_sanitation_records
      process_id: "plant_cleaning_sanitation"
      flow_role: "water; each utility and fuel; each cleaning or disinfecting formulation; each sanitation wastewater; cloth waste; each combustion emission"
      record_type: "sanitation schedule; meters; fuel and chemical issues; wastewater and emission records"
      raw_fields: "water; electricity; steam; hot water; natural gas; diesel; LPG; each formulation mass and concentration; each wastewater and solid-waste mass; emission result or factor"
      collection_method: "record every carrier, formulation, wastewater and emission independently for each sanitation event"
      unit: "kg; kWh; MJ"
      frequency: "each sanitation event or shift, aggregated monthly"
      temporal_coverage: "representative continuous 12-month period or all campaign events"
      site_scope: "all in-scope plant sanitation systems"
      aggregation_rule: "assign shared sanitation by a documented causal driver and normalise to reference output"
      quality_evidence: "calibration; invoice; SDS and formulation specification; sanitation log; waste receipt; emission workpaper"
    - protocol_id: cp_wastewater_treatment_records
      process_id: "onsite_wastewater_treatment"
      flow_role: "equalised wastewater; electricity; ferric chloride; polyacrylamide; sludge; COD; BOD5; nitrogen; phosphorus; suspended solids; methane"
      record_type: "inlet flow or mass meter; chemical issues; electricity meter; sludge scale; laboratory and gas records"
      raw_fields: "inlet and discharge quantity; each chemical; electricity; sludge mass/moisture; each matched concentration; methane measurement or model fields"
      collection_method: "match representative samples to measured discharge and calculate each emission separately"
      unit: "kg; kWh; mg/L"
      frequency: "flow continuous or daily; sampling by permit or operating plan"
      temporal_coverage: "representative continuous 12-month period or complete campaign"
      site_scope: "complete on-site treatment boundary"
      aggregation_rule: "calculate each mass load separately and assign treatment inventory by measured wastewater quantity"
      quality_evidence: "laboratory quality record; sampling plan; meter calibration; chemical record; sludge receipt; calculation workpaper"
  calculation_rules:
    - id: calc_reference_normalisation
      applies_to: "all foreground inventory amounts"
      rule: "normalised amount = reporting-period row amount / conforming net cocoa-paste output × 1,000 kg"
      inputs:
        - "collected row amount"
        - "conforming net output"
      output: "amount per 1,000 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_process_mass_balance
      applies_to: "each foreground process"
      rule: "unaccounted mass = opening stock + measured inputs - measured outputs - closing stock; calculate on both as-received and dry-mass bases where moisture changes materially"
      inputs:
        - "material inputs"
        - product
        - co-product
        - "waste outputs"
        - "opening and closing stock"
        - moisture
      output: "signed and absolute mass-balance residual"
      source_ids:
        - mass-balance-identity
    - id: calc_defatting_yield
      applies_to: "paste defatting"
      rule: "dry-mass product yield and cocoa-butter recovery = each saleable dry-mass output / dry-mass feed; allocation factor = each saleable dry-mass output / total saleable dry-mass outputs"
      inputs:
        - "feed and output masses"
        - moisture
        - "cocoa-butter content"
      output: "yields, recovery, and allocation factors"
      source_ids:
        - mass-balance-identity
        - eu-pef-recommendation-2021-2279
    - id: calc_wastewater
      applies_to: "each process or sanitation wastewater"
      rule: "wastewater to treatment = measured discharge, or supplied water - water retained in product - evaporation - separately measured reuse when direct metering is unavailable"
      inputs:
        - "stage-specific water"
        - "retained water"
        - "evaporation and reuse"
      output: "one stage-specific wastewater mass with calculation flag"
      source_ids:
        - mass-balance-identity
    - id: calc_combustion_emission
      applies_to: "each direct air emission"
      rule: "emission mass = each separately recorded on-site fuel quantity × its disclosed applicable factor, summed only for the same elementary flow; use direct measurement when available"
      inputs:
        - "natural gas"
        - "diesel or LPG record"
        - "fuel properties"
        - "factor or measurement"
      output: "kg of one specified elementary emission"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_effluent_load
      applies_to: "each treated-effluent emission"
      rule: "discharged mass = matched concentration × measured discharge quantity with documented density and unit conversion"
      inputs:
        - "one parameter concentration"
        - "discharge quantity"
        - "sampling representativeness"
      output: "kg of one specified water emission"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_packaging_component
      applies_to: "each packaging input"
      rule: "component mass = issued count × measured empty unit mass - returned unused component mass, with reusable pallets assigned by documented use share"
      inputs:
        - count
        - "unit mass"
        - returns
        - "reuse share"
      output: "kg of one packaging component per reference product"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "all lots and material streams"
      requirement: "Retain supplier, origin, lot, route, product specification, defatting and alkalisation status, and linkage from starting material to reference product."
      evidence: "receiving records; batch genealogy; product specification; lot release"
    - id: dq_measurement_control
      applies_to: "mass, energy, water, composition, and waste records"
      requirement: "Use calibrated or verified measurement systems; retain unit, conversion, calibration status, and estimation flag for every aggregated field."
      evidence: "calibration certificate; meter register; laboratory quality record; approved conversion sheet"
    - id: dq_temporal_representativeness
      applies_to: "foreground dataset"
      requirement: "Cover a representative continuous 12-month period when operations are continuous, or all lots in the declared campaign; disclose shutdowns, atypical batches, and missing periods."
      evidence: "production calendar; completeness reconciliation; exception log"
    - id: dq_completeness
      applies_to: "named foreground flows"
      requirement: "Account for all named material, energy, water, co-product, waste, wastewater, and direct-emission rows or explicitly mark them not applicable with route evidence."
      evidence: "signed inventory checklist; process mass balance; cut-off statement"
    - id: dq_atomic_exchange_identity
      applies_to: "every inventory card"
      requirement: "Retain one physical or chemical flow identity per row; do not substitute a carrier, chemical, packaging, waste or emission collection label for an implemented exchange."
      evidence: "row-level inventory review; Tiangong lookup disposition; signed applicability checklist"
    - id: dq_source_currency
      applies_to: "external rules and specifications"
      requirement: "Confirm that product specifications, official methods, and legal or customer requirements are current for the geography and reference period before activation or publication."
      evidence: "source review record; applicable specification list"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Require exactly 1,000 kg after normalization, Tiangong product-flow UUID 5b331659-2216-4cc7-9e6d-11bb0b50226f, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_product_scope
    applies_to: "product identity"
    rule: "Require paste physical state, cocoa-butter content, defatting status, roasting route, alkalisation status, moisture basis, and packaging state; reject cocoa cake, cocoa powder, sweetened preparations, and finished chocolate from this PCR."
    source_ids:
      - codex-cxs-141-1983-2025
  - rule_id: validate_codex_claim
    applies_to: "products claimed to conform to CXS 141-1983 as cocoa mass"
    rule: "Verify the declared composition and quality criteria against the current applicable Codex text, including cocoa butter of 47–60% m/m for cocoa mass and the applicable shell-and-germ limit; do not apply that cocoa-mass fat interval to a separately declared defatted paste."
    source_ids:
      - codex-cxs-141-1983-2025
  - rule_id: validate_process_route
    applies_to: "conditional processes"
    rule: "Require bean preparation for whole-bean input; keep internal and purchased nibs or paste separate; require each actual alkalising chemical; and require feed, paste, cocoa butter, cocoa cake, each utility and composition record when defatting is declared."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_mass_balance
    applies_to: "each foreground process and the overall foreground system"
    rule: "Reconcile inputs, outputs, and stock change on consistent moisture bases; investigate and disclose material residuals outside the facility's approved measurement uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_allocation
    applies_to: "cocoa butter and any other saleable co-product"
    rule: "Confirm subdivision was attempted first, shared burdens use measured dry-mass factors, moisture bases are consistent, factors sum to one, and the allocation method and sensitivity are disclosed."
    source_ids:
      - eu-pef-recommendation-2021-2279
      - mass-balance-identity
  - rule_id: validate_cutoff_and_completeness
    applies_to: "foreground inventory"
    rule: "Require every named important flow to be measured, calculated, or marked not applicable; disclose all other exclusions and verify them against the declared cut-off method without using cut-off to omit known significant flows."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_atomic_flows
    applies_to: "process inventory"
    rule: "Every card must name one concrete exchange; grid electricity, purchased steam, purchased hot water, each fuel, each chemical, each packaging component, each product or co-product, each waste and each elementary emission must remain separate."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_direct_emissions
    applies_to: "on-site fuel combustion"
    rule: "For every used direct fuel, calculate or measure fossil carbon dioxide, nitrogen oxides, sulfur oxides and primary PM2.5 separately using disclosed evidence; do not report a combined emissions row."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_wastewater_rows
    applies_to: "wastewater and on-site treatment"
    rule: "Keep each stage wastewater, treatment sludge and COD, BOD5, total nitrogen, total phosphorus, suspended solids and methane result separate; mark the treatment process not applicable when all wastewater leaves untreated by the foreground site."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_uuid_resolution
    applies_to: "non-reference inventory flows"
    rule: "Leave every non-reference UUID absent until flow-hybrid-search and state-100 direct readback agree on the exact atomic identity and support; activation or publication requires resolution or an approved explicit exception."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground cocoa-paste production dataset suitable for publication as a secondary_dataset or background_dataset after methodology, translation, UUID, and evidence review"
  downstream_use: "Product-flow creation, foreground process datasets, cradle-to-gate product systems, chocolate and cocoa-product lifecycle models, and supply-chain footprint studies"
  allowed_use: "Gate-to-gate modelling for the declared plant, technology, product state, geography, and reference period; broader use only with linked upstream and downstream datasets and disclosed allocation"
  excluded_use: "Cocoa cultivation as a stand-alone dataset; cocoa cake or powder production; cocoa butter as the sole reference product; sweetened cocoa or chocolate production; generic global representation without representativeness review"
  required_metadata: "PCR id and version; reference UUID; CPC context; site and geography; reference period; starting material and origin mix; whole-bean or nib route; roasting, alkalisation, and defatting status; cocoa-butter and moisture basis; process technology; packaging; allocation; upstream links; unresolved UUID disposition"
  required_quality_disclosure: "Primary-data share; temporal and site coverage; calibration and laboratory controls; mass-balance residuals; cut-offs and proxies; co-product allocation factors and sensitivity; carrier and chemical applicability; unresolved UUIDs; missing flows; uncertainty and limitations"
  update_trigger: "Material change in starting material, origin mix, roasting or grinding technology, alkalising formulation, defatting route, product physical state or composition, energy mix, allocation, site scope, applicable specification, Tiangong identity, or evidence that invalidates a QA guardrail"
