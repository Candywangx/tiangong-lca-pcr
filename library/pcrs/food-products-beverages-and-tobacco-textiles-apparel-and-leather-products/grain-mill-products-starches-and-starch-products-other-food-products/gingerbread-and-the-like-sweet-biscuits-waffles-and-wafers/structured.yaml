system_boundary:
  rules:
    - rule_id: boundary_start_at_site_receipt
      applies_to: "foreground_system_boundary"
      rule: "Include on-site receipt, metering, storage losses, and transfer of all ingredients and production aids used by the representative route."
      source_ids:
        - eu-jrc-fdm-bref-2019
    - rule_id: boundary_include_core_manufacturing
      applies_to: "foreground_system_boundary"
      rule: "Include dough mixing, piece formation, baking, cooling, filling preparation, filling deposition, sandwich assembly, packaging, cleaning, and directly attributable utilities."
      source_ids:
        - eu-jrc-fdm-bref-2019
        - us-epa-energy-star-baking-2012
    - rule_id: boundary_include_upstream_links
      applies_to: "foreground_system_boundary"
      rule: "Keep all purchased ingredients, energy carriers, water, packaging materials, and treatment services as visible product or waste flows linked to upstream datasets."
      source_ids:
        - iso-14044-2006
        - environdec-pcr-2025-03
    - rule_id: boundary_include_direct_releases
      applies_to: "foreground_system_boundary"
      rule: "Include measured or calculated direct releases from on-site fuel combustion, refrigerant leakage, wastewater, and waste handling when they occur; disclose the factor source and calculation method."
      source_ids:
        - eu-jrc-fdm-bref-2019
    - rule_id: boundary_include_losses_and_treatment
      applies_to: "foreground_system_boundary"
      rule: "Record ingredient spills, dough and biscuit rejects, filling losses, packaging scrap, wastewater, and their actual reuse, recycling, or treatment routes; internal rework remains visible in gross records."
      source_ids:
        - eu-jrc-fdm-bref-2019
        - ghg-protocol-product-standard-2011
    - rule_id: boundary_exclude_downstream_by_default
      applies_to: "foreground_system_boundary"
      rule: "Exclude distribution, retail, consumer storage and consumption, and end-of-life from this foreground package unless a downstream lifecycle model adds them explicitly and without double counting."
      source_ids:
        - environdec-pcr-2025-03
        - ghg-protocol-product-standard-2011
    - rule_id: boundary_limit_representative_route
      applies_to: "foreground_system_boundary"
      rule: "Do not use this detailed inventory unchanged for gingerbread, unfilled wafers, ice-cream sandwiches, chilled fillings, or other materially different products; document and review route changes before use."
      source_ids:
        - eu-jrc-fdm-bref-2019
