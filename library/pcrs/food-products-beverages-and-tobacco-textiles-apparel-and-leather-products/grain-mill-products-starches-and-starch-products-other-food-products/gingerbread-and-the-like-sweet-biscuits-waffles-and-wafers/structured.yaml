allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "separately measurable processes and campaigns"
    rule: "Avoid allocation by submetering, separate batch records, or process subdivision whenever the representative product can be measured independently."
    source_ids:
      - ghg-protocol-product-standard-2011
      - iso-14044-2006
  - rule_id: allocation_physical_causality_first
    applies_to: "unavoidable multi-output allocation"
    rule: "When allocation cannot be avoided, use a physical relationship that reflects causality, such as product mass, machine time, thermal demand, or cleaning area; document why the driver represents resource use and releases."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_shared_utilities
    applies_to: "shared electricity, heat, compressed air, HVAC, cleaning, and wastewater"
    rule: "Allocate shared utilities using verified submeters where available; otherwise use equipment operating time and rated load, campaign duration, cleaned area, or another causal driver. Do not allocate all utilities solely by revenue."
    source_ids:
      - us-epa-energy-star-baking-2012
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_economic_fallback
    applies_to: "co-products with no usable physical relationship"
    rule: "Economic or another justified relationship is allowed only when physical causality cannot be established; disclose values, price period, geography, sensitivity, and the reason physical allocation failed."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_internal_rework
    applies_to: "dough, shells, filling, and assembled biscuits returned within the same campaign"
    rule: "Treat internal rework as an internal loop: retain gross input and loss records, avoid creating an external co-product credit, and include any extra energy or material used for rework."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_waste_and_recovery
    applies_to: "rejects, food residues, packaging scrap, and wastewater outputs"
    rule: "Outputs with no economic value are waste and receive no upstream burden allocation; include their handling and treatment. Any sold or functionally used recovered output is a co-product and requires the declared allocation rule and destination."
    source_ids:
      - ghg-protocol-product-standard-2011
      - iso-14044-2006
  - rule_id: allocation_consistency
    applies_to: "recurring campaigns and similar flows"
    rule: "Apply the same allocation method to similar inputs and outputs over time; disclose and justify changes and recalculate comparative baselines when required by the downstream study."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_recipe_and_batch_mass
      process_id: "ingredient_and_dough_preparation"
      flow_role: "recipe ingredients and mixed dough"
      record_type: "batch formulation, scale record, material issue, moisture specification"
      raw_fields: "batch_id; product_id; ingredient_id; supplier_lot; gross_mass; tare_mass; net_mass; moisture_basis; timestamp; dough_output_mass"
      collection_method: "Calibrated scales reconciled with approved recipe and material issue records"
      unit: "kg"
      frequency: "Every batch"
      temporal_coverage: "Complete declared data period, including start-up and changeover batches"
      site_scope: "All lines and campaigns producing the declared product"
      aggregation_rule: "Sum ingredient and dough masses by batch; normalize only after batch reconciliation"
      quality_evidence: "Scale calibration; approved recipe version; lot traceability; exception log"
    - protocol_id: cp_energy_and_fuel_meters
      process_id: "ingredient_and_dough_preparation_forming_and_baking_cooling_filling_and_assembly_primary_packaging_shared_cleaning_and_utilities"
      flow_role: "electricity, fuels, steam, heat, compressed air, and direct combustion releases"
      record_type: "utility meter, fuel invoice, submeter, operating log, emission-factor record"
      raw_fields: "meter_id; carrier; opening_reading; closing_reading; unit; start_time; end_time; product_output; equipment_runtime; factor_id; factor_value"
      collection_method: "Read calibrated meters at campaign boundaries or use interval data; reconcile with site totals and fuel purchases"
      unit: "kWh; MJ; carrier unit; kg emission"
      frequency: "Per campaign or interval no longer than one month, with campaign allocation"
      temporal_coverage: "At least 12 representative months where available; otherwise the complete shorter period with seasonality limitation disclosed"
      site_scope: "Manufacturing site and all directly supporting utilities"
      aggregation_rule: "Subtract non-production and separately metered loads; allocate residual shared use by documented causal driver; normalize to net product"
      quality_evidence: "Meter calibration; invoice reconciliation; equipment runtime; factor source and version; site energy balance"
    - protocol_id: cp_outputs_rework_and_waste
      process_id: "ingredient_and_dough_preparation_forming_and_baking_cooling_filling_and_assembly_primary_packaging"
      flow_role: "process outputs, internal rework, rejects, and waste destinations"
      record_type: "production counter, scale ticket, reject log, rework log, waste manifest"
      raw_fields: "batch_id; process_id; gross_output_mass; acceptable_output_mass; rework_mass; waste_mass; destination; moisture_or_aw; timestamp"
      collection_method: "Measure outputs and losses at each process transfer; identify internal rework separately from material leaving the foreground route"
      unit: "kg"
      frequency: "Every batch or shift"
      temporal_coverage: "Complete declared data period"
      site_scope: "All representative-route lines and waste destinations"
      aggregation_rule: "Reconcile input, acceptable output, rework, waste, samples, and documented evaporation by process"
      quality_evidence: "Calibrated scales; signed waste records; quality-release record; mass-balance exception investigation"
    - protocol_id: cp_filling_and_assembly
      process_id: "filling_and_assembly"
      flow_role: "filling formulation, shell input, filling fraction, and assembled output"
      record_type: "filling batch sheet, scale record, depositor setting, checkweigher record"
      raw_fields: "filling_batch_id; ingredient_id; ingredient_mass; shell_mass; filling_mass; assembled_mass; unit_count; sample_net_mass; reject_mass"
      collection_method: "Reconcile filling batch ingredients with deposited mass and assembled-biscuit output; verify filling fraction by representative sampling"
      unit: "kg; count; fraction"
      frequency: "Every filling batch and product changeover"
      temporal_coverage: "Complete declared data period"
      site_scope: "All declared product variants in the representative route"
      aggregation_rule: "Calculate filling mass fraction from measured filling and final product mass; weight by saleable output"
      quality_evidence: "Scale and checkweigher calibration; approved filling recipe; sampling plan; deviation record"
    - protocol_id: cp_packaging_material_and_output
      process_id: "primary_packaging"
      flow_role: "packaging materials, packaging scrap, and reference output"
      record_type: "packaging bill of materials, issue record, scrap record, checkweigher, finished-goods record"
      raw_fields: "material_id; material_mass; packs_produced; net_mass_per_pack; packaging_scrap_mass; product_reject_mass; saleable_net_product_mass"
      collection_method: "Reconcile packaging issues with saleable packs, packaging scrap, and remaining stock; determine net food mass separately"
      unit: "kg; count"
      frequency: "Every packaging campaign"
      temporal_coverage: "Complete declared data period"
      site_scope: "All primary packaging formats declared in scope"
      aggregation_rule: "Sum material-specific packaging mass and divide by saleable net product mass; keep packaging outside reference mass"
      quality_evidence: "Approved packaging specification; checkweigher calibration; stock reconciliation; scrap destination record"
    - protocol_id: cp_cleaning_water_chemicals_and_effluent
      process_id: "shared_cleaning_and_utilities"
      flow_role: "cleaning water, chemicals, wastewater, and solid residues"
      record_type: "water meter, chemical issue, cleaning log, effluent meter or sample, waste record"
      raw_fields: "cleaning_event_id; equipment_or_area; water_volume; water_temperature; chemical_product_mass; dilution; effluent_volume; COD_or_other_load; solid_waste_mass; destination"
      collection_method: "Meter water and effluent where practicable; reconcile chemicals with dosing records; allocate shared events using cleaned area, duration, or campaign count"
      unit: "kg; m3; concentration; kg load"
      frequency: "Every cleaning event with monthly reconciliation"
      temporal_coverage: "Complete declared data period including major sanitation events"
      site_scope: "Equipment and areas serving the declared route"
