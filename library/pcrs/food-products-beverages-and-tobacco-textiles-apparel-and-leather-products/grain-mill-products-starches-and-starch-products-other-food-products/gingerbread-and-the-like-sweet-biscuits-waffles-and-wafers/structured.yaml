      quality_evidence: "Meter calibration; cleaning schedule; dosing verification; laboratory report; treatment invoice or manifest"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "every inventory quantity"
      rule: "normalized amount = campaign quantity / saleable net biscuit mass; packaging mass is excluded from the denominator"
      inputs:
        - "campaign flow quantity"
        - saleable_net_product_mass
      output: "flow amount per 1 kg net product"
      source_ids:
        - environdec-pcr-2025-03
        - iso-14044-2006
    - id: calc_count_to_mass
      applies_to: "count-based product output"
      rule: "net product mass = unit count multiplied by representative mean net biscuit mass; calculate by product and campaign and retain sample variability"
      inputs:
        - unit_count
        - "sample gross mass"
        - "tare mass"
        - "sample count"
      output: "saleable net product mass in kg"
      source_ids:
        - iso-14044-2006
    - id: calc_filling_fraction
      applies_to: "representative product identity"
      rule: "filling mass fraction = deposited or recipe-reconciled filling mass / assembled sandwich-biscuit mass"
      inputs:
        - filling_mass
        - assembled_mass
      output: "filling mass fraction"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_process_mass_balance
      applies_to: "each foreground process"
      rule: "mass-balance difference = measured inputs - acceptable outputs - external waste - samples - measured transfers - documented evaporated water; investigate rather than silently force closure"
      inputs:
        - "process input and output records"
        - rework
        - waste
        - samples
        - "evaporation basis"
      output: "process mass-balance difference and closure statement"
      source_ids:
        - iso-14044-2006
        - eu-jrc-fdm-bref-2019
    - id: calc_shared_energy
      applies_to: "shared utilities"
      rule: "allocated utility = shared metered utility multiplied by the declared causal-driver share; subtract separately metered process use before allocation"
      inputs:
        - "shared meter delta"
        - "process submeters"
        - "equipment runtime and load"
        - "campaign output"
      output: "carrier-specific allocated energy per reference flow"
      source_ids:
        - us-epa-energy-star-baking-2012
        - ghg-protocol-product-standard-2011
    - id: calc_combustion_releases
      applies_to: "on-site fuel combustion"
      rule: "direct release = metered fuel quantity multiplied by a declared carrier- and technology-specific factor, adjusted by measurement or oxidation assumptions; report each elementary flow separately"
      inputs:
        - "fuel quantity"
        - composition
        - "factor identity"
        - "factor value"
        - "stack measurement when available"
      output: "direct elementary-flow mass per reference flow"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_packaging_mass
      applies_to: "primary packaging"
      rule: "packaging mass per reference flow = material issued - returned stock - material-specific scrap, divided by saleable net biscuit mass; reconcile with bill of materials"
      inputs:
        - "packaging issue"
        - return
        - scrap
        - packs
        - "net product mass"
      output: "kg packaging material per kg net product"
      source_ids:
        - environdec-pcr-2025-03
    - id: calc_rework_netting
      applies_to: "internal rework"
      rule: "keep gross rework generation and return visible; exclude the internal transfer from external inputs and outputs while retaining additional resources and unreworked loss"
      inputs:
        - "rework generated"
        - "rework returned"
        - "rework resources"
        - "rework discarded"
      output: "net external waste and transparent internal-loop record"
      source_ids:
        - ghg-protocol-product-standard-2011
  data_quality_requirements:
    - id: dq_reference_identity
      applies_to: "reference flow"
      requirement: "Use the declared Sandwich Cookie UUID, Mass property UUID, mass unit-group UUID, kg unit, and all required qualifiers; do not store a Tiangong dataset version in the PCR or foreground identity."
      evidence: "Exact Tiangong identity readback retained outside PCR content; foreground metadata and reference-flow comment"
    - id: dq_route_representativeness
      applies_to: "product and process scope"
      requirement: "Demonstrate that the product is an ambient-stable cream-filled sandwich sweet biscuit produced by the declared route; otherwise flag the PCR as not product-specific and obtain route review."
      evidence: "Product specification; recipe; process flow diagram; line and filling description"
    - id: dq_primary_data
      applies_to: "owned or controlled foreground processes"
      requirement: "Use primary records for every required process and all significant material, energy, water, waste, and direct-release flows."
      evidence: "Collection protocols; calibrated records; reconciliation results; exception log"
    - id: dq_temporal_coverage
      applies_to: "foreground period"
      requirement: "Prefer 12 consecutive representative months. If a shorter period is used, cover complete campaigns and disclose seasonality, start-up, shutdown, and product-mix limitations."
      evidence: "Dated raw records; production calendar; period coverage statement"
    - id: dq_completeness
      applies_to: "process and flow coverage"
      requirement: "Reconcile required process outputs and all important flows; document zero, not applicable, missing, and estimated values distinctly."
      evidence: "Process map; mass and energy balances; missing-data register"
    - id: dq_upstream_quality
      applies_to: "purchased inputs and services"
      requirement: "Select upstream datasets that match ingredient specification, geography, technology, and time as closely as practical; disclose proxies and material data gaps."
      evidence: "Dataset references; supplier specification; proxy rationale"
    - id: dq_uncertainty_and_estimates
      applies_to: "provisional ranges and modelled values"
      requirement: "Keep reasoned_estimate ranges separate from foreground values. Disclose uncertainty and replace provisional ranges with reviewed evidence before publication unless explicitly accepted."
      evidence: "Range evidence kind; review record; uncertainty statement"
    - id: dq_allocation_transparency
      applies_to: "shared and multi-output processes"
      requirement: "Retain allocation driver values, method choice, causal justification, and sensitivity where the choice can materially affect results."
      evidence: "Meter and driver records; allocation calculation; sensitivity result"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "foreground_dataset_conformance"
    rule: "The reference output shall be exactly 1 kg net product using Sandwich Cookie 80a32a82-0f7d-4112-a92e-5adcc89f1db3, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg; packaging mass shall be excluded."
    source_ids:
      - iso-14044-2006
      - environdec-pcr-2025-03
  - rule_id: validate_required_qualifiers
    applies_to: "foreground_dataset_conformance"
    rule: "Product subtype, shell formulation and geometry, filling type and fraction, moisture or water activity, count-to-mass basis, packaging, rework policy, technology, geography, period, and market state shall be declared."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_representative_route
    applies_to: "foreground_dataset_conformance"
    rule: "The dataset shall demonstrate the ambient-stable cream-filled sandwich sweet-biscuit route; a materially different gingerbread, wafer, frozen, chilled, or unfilled route fails product-specific conformance."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_process_coverage
    applies_to: "foreground_dataset_conformance"
    rule: "Every required process shall have foreground records or a documented, reviewable not-applicable finding; required material and energy flows shall not be silently omitted."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - us-epa-energy-star-baking-2012
  - rule_id: validate_mass_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Ingredient, dough, shell, filling, packaged-product, rework, waste, sample, and documented evaporation records shall reconcile within a site-declared tolerance; exceptions shall be investigated and disclosed."
    source_ids:
      - iso-14044-2006
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_energy_completeness
    applies_to: "foreground_dataset_conformance"
    rule: "Electricity and each thermal-energy carrier shall be reported separately; direct oven fuel use, process energy, and shared utilities shall reconcile to meters or purchases without double counting."
    source_ids:
      - us-epa-energy-star-baking-2012
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_losses_and_treatment
    applies_to: "foreground_dataset_conformance"
    rule: "Internal rework, external food waste, packaging scrap, wastewater, and each destination shall be distinguished; no external credit may be assigned without a declared co-product or recycling method."
    source_ids:
      - ghg-protocol-product-standard-2011
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_allocation
    applies_to: "foreground_dataset_conformance"
    rule: "Allocation shall first be avoided; any unavoidable physical or fallback allocation shall identify the driver, values, causal justification, and sensitivity or limitation."
    source_ids:
      - ghg-protocol-product-standard-2011
      - iso-14044-2006
  - rule_id: validate_upstream_links
    applies_to: "foreground_dataset_conformance"
    rule: "Every purchased material, energy, water, packaging, and treatment flow shall link to an upstream dataset or carry an explicit data gap; same-category inputs shall not be silently expanded or omitted."
    source_ids:
      - iso-14044-2006
      - environdec-pcr-2025-03
  - rule_id: validate_provisional_ranges
    applies_to: "foreground_dataset_conformance"
    rule: "A foreground value outside a screening range triggers review rather than automatic rejection; every reasoned_estimate remains provisional and cannot become publication-critical evidence without review."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package for an ambient-stable cream-filled sandwich sweet biscuit; candidate methodology until review"
  downstream_use: "secondary_dataset; background_dataset after methodology, translation, UUID, and evidence review"
  allowed_use: "Gate-to-gate manufacturing inventory; ingredient-to-factory-gate lifecycle modelling when complete upstream datasets are linked; scenario and hotspot analysis that preserves the declared route and qualifiers"
  excluded_use: "Direct use as product-specific guidance for gingerbread, unfilled wafers, frozen or chilled sandwich products, savoury crackers, cakes, or bread; comparative assertions without aligned functional performance and downstream scope; publication while unresolved UUIDs or provisional critical ranges remain"
  required_metadata: "canonical PCR id; product and route qualifiers; reference UUIDs and unit; recipe and filling fraction; line and oven technology; packaging configuration; site geography; data period; production volume; allocation methods; upstream dataset references; rework and waste destinations"
  required_quality_disclosure: "primary-data coverage; temporal and technological representativeness; mass and energy balance results; meter and scale quality; allocation drivers; missing data and proxies; reasoned estimates; uncertainty; deviations from the representative route"
  update_trigger: "Material change in recipe or filling fraction, biscuit-shell type, oven or filling technology, site energy supply, packaging configuration, rework or waste route, allocation method, reference-flow identity, source PCR, or data period"
