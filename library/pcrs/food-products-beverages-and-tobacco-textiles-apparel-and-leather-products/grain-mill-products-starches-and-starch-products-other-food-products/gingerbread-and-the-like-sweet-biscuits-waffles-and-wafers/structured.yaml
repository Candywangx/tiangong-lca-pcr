measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all inventory quantities to 1 kg net saleable biscuit mass; exclude primary, secondary, and transport packaging from the reference-product mass and inventory those materials separately."
  - id: count_to_mass_conversion
    applies_to: "Piece-count production records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "When output is recorded by count, determine mean net mass from a documented representative sample for each declared product and campaign; retain sample count, gross and tare masses, and variability."
  - id: energy_carrier_separation
    applies_to: "Electricity, fuels, steam, and purchased heat"
    required_property_ref:
      name: "Carrier-specific energy property"
      uuid: ""
    required_unit: "kWh for electricity; MJ for fuels and heat"
    rule: "Preserve energy carriers separately. Convert units with documented conversion factors and do not combine electricity and thermal energy into one unqualified total."
  - id: water_mass_basis
    applies_to: "Ingredient, cleaning, and utility water"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record water by purpose. Convert metered volume to mass using a documented density and temperature assumption when mass is not measured directly."
  - id: recipe_mass_basis
    applies_to: "Flour, sugar, fats, filling, water, and minor ingredients"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record as-used ingredient mass entering the foreground process; disclose whether supplier moisture or solids corrections are applied and do not silently convert product mass to dry matter."
  - id: packaging_mass_separation
    applies_to: "Primary and secondary packaging"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record each packaging material by measured or bill-of-material mass per 1 kg net product; packaging is never included in the reference product mass."
