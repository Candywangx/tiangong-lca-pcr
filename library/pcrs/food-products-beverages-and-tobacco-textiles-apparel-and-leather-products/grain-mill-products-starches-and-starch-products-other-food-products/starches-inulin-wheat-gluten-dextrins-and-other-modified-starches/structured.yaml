allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "Multi-output separation, extraction, and refining"
    rule: "First subdivide processes and meters so inputs and outputs directly attributable to starch, gluten, germ, fibre, protein, pulp, solubles, inulin, or other outputs remain with those operations."
    source_ids:
      - ec-pef-recommendation-2021-2279
      - eu-fdm-bref-2019
  - rule_id: allocation_rule_2
    applies_to: "Remaining multifunctionality"
    rule: "If subdivision is not possible, investigate system expansion and document the added functions and datasets before applying allocation."
    source_ids:
      - ec-pef-recommendation-2021-2279
  - rule_id: allocation_rule_3
    applies_to: "Physical allocation"
    rule: "When subdivision and system expansion are not feasible, use a documented physical relationship that reflects the process causality, such as separately measured dry mass, solids, or another justified physical driver; do not select a driver only to favour the reference product."
    source_ids:
      - ec-pef-recommendation-2021-2279
  - rule_id: allocation_rule_4
    applies_to: "Economic fallback"
    rule: "Use economic allocation only when no relevant physical relationship can be justified; use a representative price period, perform sensitivity analysis, and disclose the result and rationale."
    source_ids:
      - ec-pef-recommendation-2021-2279
  - rule_id: allocation_rule_5
    applies_to: "Co-product and residual classification"
    rule: "Do not assign zero burden to a marketable co-product and do not classify a material as waste merely to avoid allocation; record destination, commercial status, dry matter, and allocation treatment."
    source_ids:
      - eu-fdm-bref-2019
      - eu-feed-materials-catalogue-68-2013
dataset_production:
  collection_protocols:
    - protocol_id: cp_product_identity_and_output
      process_id: "all_production_processes"
      flow_role: "Product identity, intermediates, and conforming output"
      record_type: "Batch, laboratory, and production records"
      raw_fields: "product name; product-flow UUID decision; feedstock; modification identity; physical state; lot; wet mass; solids or moisture; purity or grade; release status"
      collection_method: "Calibrated scales, laboratory methods, and batch reconciliation"
      unit: "kg; mass fraction"
      frequency: "Each lot, aggregated monthly"
      temporal_coverage: "Representative continuous 12-month period or complete campaign"
      site_scope: "All lines producing the declared product"
      aggregation_rule: "Sum conforming output and calculate weighted composition; exclude rework until released"
      quality_evidence: "Calibration, test method, certificates of analysis, and release records"
    - protocol_id: cp_materials_and_aids
      process_id: "raw_material_receiving_route_processes"
      flow_role: "Raw materials, process aids, enzymes, and chemicals"
      record_type: "Weighbridge, invoice, tank, silo, and issue records"
      raw_fields: "material identity; supplier; origin; lot; quantity; unit; moisture or concentration; opening and closing stock; return; destination process"
      collection_method: "Reconcile purchases and inventory movements to process issues"
      unit: "kg; m3"
      frequency: "Each delivery or issue, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "All relevant site stores and production lines"
      aggregation_rule: "Opening stock + receipts - closing stock - documented return, allocated only with documented process driver"
      quality_evidence: "Supplier documents, meter or scale calibration, and stock reconciliation"
    - protocol_id: cp_utilities_and_water
      process_id: "route_processes_product_finishing"
      flow_role: "Electricity, fuels, steam, fresh water, recycle, and evaporation"
      record_type: "Meter, utility invoice, fuel stock, and equipment records"
      raw_fields: "carrier; meter; quantity; unit; operating time; process; fresh or recycled water status; conversion factor"
      collection_method: "Prefer sub-metering; otherwise documented equipment or operating-hour allocation"
      unit: "kWh; MJ; kg; m3"
      frequency: "Continuous or shift, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "All production and relevant on-site utility systems"
      aggregation_rule: "Sum measured use by carrier; subtract internal transfers; normalize after allocation"
      quality_evidence: "Meter calibration, invoice reconciliation, and documented conversion factors"
    - protocol_id: cp_coproducts_and_wastes
      process_id: "all_production_processes"
      flow_role: "Co-products, rework, rejects, captured dust, sludge, and waste"
      record_type: "Scale, dispatch, transfer, and waste-manifest records"
      raw_fields: "stream identity; commercial or waste status; wet mass; solids; destination; treatment; price where economic fallback is used"
      collection_method: "Measure at transfer or dispatch and reconcile internal rework"
      unit: "kg; mass fraction"
      frequency: "Each transfer, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "All route and residual-management processes"
      aggregation_rule: "Sum by stream and destination; count internal rework once when finally released or discarded"
      quality_evidence: "Scale calibration, dispatch evidence, contracts, and waste manifests"
    - protocol_id: cp_direct_emissions_and_wastewater
      process_id: "route_processes_onsite_residuals_management"
      flow_role: "Direct air emissions, wastewater, and treatment releases"
      record_type: "Continuous or periodic monitoring, laboratory, permit, and flow records"
      raw_fields: "source; pollutant; compartment; concentration; flow; sampling period; control status; wastewater destination; sludge; treatment input and output"
      collection_method: "Use applicable validated monitoring methods and calculate loads from matched flow and concentration periods"
      unit: "kg; m3; mg/L; mg/Nm3"
      frequency: "As monitored, aggregated to production period"
      temporal_coverage: "Same period as product output; disclose sampling gaps"
      site_scope: "All attributable stacks, vents, drains, and on-site treatment"
      aggregation_rule: "Sum measured loads; do not substitute AP-42 factors for available site monitoring"
      quality_evidence: "Laboratory accreditation, calibration, sampling plan, permits, and monitoring reports"
    - protocol_id: cp_packaging
      process_id: "product_finishing"
      flow_role: "Included packaging materials"
      record_type: "Packaging issue and product dispatch records"
      raw_fields: "material; packaging level; issued mass; returned mass; packed product mass; format"
      collection_method: "Reconcile packaging issues with packed output"
      unit: "kg"
      frequency: "Each packaging run, aggregated monthly"
      temporal_coverage: "Same period as packaged product output"
      site_scope: "All included packaging lines"
      aggregation_rule: "Net packaging issued divided by packed conforming output"
      quality_evidence: "Supplier specification, stock reconciliation, and scale calibration"
    - protocol_id: cp_allocation_basis
      process_id: "all_multi_output_processes"
      flow_role: "Allocation decision and driver"
      record_type: "Meter, mass balance, price, and decision records"
      raw_fields: "process; outputs; subdivision status; system-expansion option; selected driver; dry mass; physical property; price period; price; sensitivity case"
      collection_method: "Apply the hierarchy in Section 7 and retain rejected alternatives"
      unit: "kg dry matter; declared driver; currency"
      frequency: "Each reporting period and when route changes"
      temporal_coverage: "Same period as inventory"
      site_scope: "Every multifunctional process"
      aggregation_rule: "Apply one consistent documented basis to all jointly attributable inputs and outputs"
      quality_evidence: "Process diagram, meter boundary, calculation workbook, and reviewer approval"
  calculation_rules:
    - id: calc_rule_1
      applies_to: "Inventory normalization"
      rule: "normalized amount = reporting-period amount / reporting-period conforming as-sold output"
      inputs:
        - "Collected flow amount"
        - "conforming product output"
      output: "Amount per 1 kg reference product"
      source_ids:
        - ec-pef-recommendation-2021-2279
    - id: calc_rule_2
      applies_to: "Dry-matter conversion"
      rule: "dry mass = wet mass × measured solids mass fraction; retain both wet and dry results"
      inputs:
        - "Wet mass"
        - "solids or moisture result"
      output: "kg dry matter and kg wet stream"
      source_ids:
        - eu-fdm-bref-2019
    - id: calc_rule_3
      applies_to: "Wastewater and stack loads"
      rule: "pollutant mass = matched concentration × measured volumetric flow, with explicit unit and standard-condition conversion"
      inputs:
        - Concentration
        - flow
        - duration
        - "temperature and pressure where required"
      output: "Pollutant-specific mass"
      source_ids:
        - eu-fdm-bref-2019
        - us-epa-ap42-9-9-7
    - id: calc_rule_4
      applies_to: "Energy conversion"
      rule: "Convert only with a documented physical conversion factor; keep original meter reading and carrier identity"
      inputs:
        - "Meter reading"
        - unit
        - "conversion factor"
      output: "Energy in reporting unit and original unit"
      source_ids:
        - eu-fdm-bref-2019
    - id: calc_rule_5
      applies_to: "Mass reconciliation"
      rule: "Reconcile feed dry matter to product, co-product, waste, measured emissions, and documented inventory change; investigate rather than erase an unexplained residual"
      inputs:
        - "Dry-mass inputs and outputs"
        - "stock changes"
      output: "Reconciliation statement and unresolved residual"
      source_ids:
        - eu-fdm-bref-2019
    - id: calc_rule_6
      applies_to: "Allocation"
      rule: "Apply Section 7 hierarchy at each multifunctional process and normalize only after jointly attributable burdens are partitioned"
      inputs:
        - "Sub-metered burdens"
        - "output quantities"
        - "selected driver"
        - "sensitivity data"
      output: "Allocated inventory by output"
      source_ids:
        - ec-pef-recommendation-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Retain the concrete product name, product-flow UUID decision, feedstock, route, modification identity, physical state, moisture or dry matter, grade, and packaging state; the representative Starch UUID cannot substitute for a different form."
      evidence: "Product specification, release record, flow lookup decision, and batch metadata"
    - id: dq_temporal
      applies_to: "Foreground inventory"
      requirement: "Use a representative continuous 12-month period or the complete production campaign; disclose shutdowns, abnormal events, and any mismatch between numerator and output periods."
      evidence: "Dated meters, batch records, operating calendar, and reconciliation"
    - id: dq_completeness
      applies_to: "Materials and releases"
      requirement: "Cover all mapped processes, utilities, water, aids, products, co-products, wastes, wastewater, and direct emissions; document not-applicable conditional processes and unresolved mass residuals."
      evidence: "Process map, completeness checklist, dry-mass reconciliation, and monitoring inventory"
    - id: dq_measurement
      applies_to: "Quantitative records"
      requirement: "Use calibrated meters and scales where available; document estimation methods, conversion factors, sampling, detection limits, and data gaps."
      evidence: "Calibration certificates, laboratory reports, calculation files, and gap register"
    - id: dq_allocation
      applies_to: "Multi-output processes"
      requirement: "Retain the allocation hierarchy decision, process subdivisions, driver data, price period if used, and sensitivity result."
      evidence: "Allocation workbook, meter map, price evidence, and reviewer approval"
    - id: dq_upstream
      applies_to: "Purchased inputs"
      requirement: "Identify supplier, geography, technology, reference period, and representativeness of upstream datasets, especially for botanical feedstocks and purchased CPC 23220 intermediates."
      evidence: "Supplier records, dataset metadata, and data-quality assessment"
    - id: dq_source_provenance
      applies_to: "All calculated values"
      requirement: "Link every calculated result to raw records, formula version, author, and calculation date; do not treat external process descriptions as site measurements."
      evidence: "Traceable calculation package and source references"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "Product identity"
    rule: "Fail if the concrete product form and required qualifiers are missing, or if the representative Starch UUID is used for inulin, wheat gluten, dextrin, modified starch, or a product with a more specific real flow."
    source_ids:
      - un-cpc-3-0-23220
  - rule_id: validation_rule_2
    applies_to: "Reference amount"
    rule: "Fail if the reference output is not 1 kg as-sold product on the declared moisture or dry-matter basis, or if dry and as-sold masses are mixed without conversion."
    source_ids:
      - ec-pef-recommendation-2021-2279
  - rule_id: validation_rule_3
    applies_to: "Process coverage"
    rule: "Fail if a required process lacks inventory, or if a conditional route process is neither included nor explicitly marked not applicable with justification."
    source_ids:
      - eu-fdm-bref-2019
      - us-epa-ap42-9-9-7
  - rule_id: validation_rule_4
    applies_to: "Co-products and allocation"
    rule: "Fail if a marketable co-product is hidden as waste, given zero burden without justification, or handled without the allocation hierarchy and supporting data."
    source_ids:
      - ec-pef-recommendation-2021-2279
      - eu-feed-materials-catalogue-68-2013
  - rule_id: validation_rule_5
    applies_to: "Water, waste, and direct emissions"
    rule: "Fail if fresh and recycled water are conflated, wastewater destination is missing, captured dust is reported as an elementary emission, or relevant measured direct emissions are omitted."
    source_ids:
      - eu-fdm-bref-2019
      - us-epa-ap42-9-9-7
  - rule_id: validation_rule_6
    applies_to: "Data provenance"
    rule: "Fail if a collected or calculated amount cannot be traced to its collection protocol and reporting period, or if an external process description is presented as a site-specific amount."
    source_ids:
      - ec-pef-recommendation-2021-2279
  - rule_id: validation_rule_7
    applies_to: "Mass reconciliation"
    rule: "Require a documented dry-matter reconciliation across product, co-products, waste, emissions, and inventory change; unresolved residuals must be disclosed and reviewed."
    source_ids:
      - eu-fdm-bref-2019
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for one declared CPC 23220 product form and route"
