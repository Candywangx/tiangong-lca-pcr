system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when the declared plant raw material or purchased intermediate crosses the manufacturing-site gate and ends when the conforming product is released in its declared bulk or packaged state at the plant gate. Include route-specific separation, extraction, refining, modification, concentration, drying, finishing, internal recycling, cleaning directly attributable to production, on-site utilities used by these operations, and on-site management of wastes, wastewater, and direct emissions."
      source_ids: []
    - rule_id: boundary_rule_1
      applies_to: "foreground manufacturing"
      rule: "Include all material, energy, water, product, co-product, waste, wastewater, and direct-emission flows attributable to the declared route from the site-gate starting condition to released product."
      source_ids:
        - ec-pef-recommendation-2021-2279
        - eu-fdm-bref-2019
    - rule_id: boundary_rule_2
      applies_to: "route selection"
      rule: "Include only route processes that actually occur, but record a justified not-applicable decision for each conditional process in the Process Map."
      source_ids:
        - eu-fdm-bref-2019
        - us-epa-ap42-9-9-7
    - rule_id: boundary_rule_3
      applies_to: "purchased same-category intermediates"
      rule: "Prevent recursion by treating a purchased same-category intermediate as a product input with its own upstream dataset."
      source_ids:
        - ec-pef-recommendation-2021-2279
    - rule_id: boundary_rule_4
      applies_to: "representative product flow"
      rule: "Never use the representative Starch UUID for another covered form; replace it with a product-specific flow whenever a more faithful real Tiangong identity exists."
      source_ids:
        - un-cpc-3-0-23220
