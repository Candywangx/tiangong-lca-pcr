measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground exchanges to 1,000 kg net saleable finished product, excluding secondary transport packaging not sold with the product."
  - id: net_saleable_output
    applies_to: "finished product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine output from verified net-content mass and accepted saleable units; rejects, retained samples and giveaway are not saleable output."
  - id: ingredient_mass
    applies_to: "each recipe ingredient"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record every ingredient separately on an as-received mass basis and retain moisture or solids information when it materially affects recipe comparison."
  - id: package_component_mass
    applies_to: "each primary or secondary package component"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh or calculate each package component separately from unit mass and packed unit count; no combined packaging-material total is conforming."
  - id: energy_preservation
    applies_to: "electricity, natural gas and purchased steam"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh, MJ or kg steam as metered"
    rule: "Preserve the original meter or invoice unit and document every conversion factor used for reference-flow normalization."
