allocation_rules:
  - rule_id: avoid_allocation
    applies_to: "separable products, batches and treatment lines"
    rule: "First subdivide processes, meters and records so each recipe family, preservation route and output receives its directly attributable ingredients, packaging, utilities, wastes and emissions."
    source_ids:
      - eu-pef-2021
  - rule_id: shared_utility_allocation
    applies_to: "shared cooking, cooling, freezing, cleaning and site services"
    rule: "When direct measurement is unavailable, allocate a shared utility using the closest causal operating parameter, such as metered equipment load multiplied by operating time, thermal load, cleaned area or equipment occupancy; document the parameter and reconcile to the site total."
    source_ids:
      - eu-pef-2021
      - schmidt-rivera-2019
  - rule_id: physical_output_allocation
    applies_to: "unavoidable multi-output operation with a documented physical relation"
    rule: "Use a documented physical relation that reflects causality. Mass allocation is permitted only when product masses drive the shared burden and all output masses are measured on a consistent basis."
    source_ids:
      - eu-pef-2021
  - rule_id: economic_allocation_last_resort
    applies_to: "multi-output operation without a defensible physical relation"
    rule: "Use economic allocation only as a last resort; disclose price source, price period, currency, averaging method and allocation factors and test sensitivity to material price variation."
    source_ids:
      - eu-pef-2021
  - rule_id: waste_and_byproduct_status
    applies_to: "food residues, recyclable packaging scrap and treatment sludge"
    rule: "Declare whether each output is waste, by-product or recovered product under the applicable jurisdiction; do not assign avoided burdens inside the foreground dataset unless the downstream modelling convention is explicitly declared."
    source_ids:
      - eu-pef-2021
      - jrc-fdm-bref-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_recipe_inputs
      process_id: "prepared_meal_manufacturing"
      flow_role: "each actual recipe ingredient"
      record_type: "batch recipe, weigh ticket, issue and return record"
      raw_fields: "ingredient identity; supplier lot; as-received mass; returned mass; recipe family; batch id; moisture or solids when material"
      collection_method: "Reconcile batch additions and returns to approved recipe and production orders"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative continuous 12-month period or complete shorter campaign with justification"
      site_scope: "all lines producing the declared recipe family"
      aggregation_rule: "Sum net issued mass by exact ingredient and normalize with calc_reference_normalization; never aggregate unlike ingredients"
      quality_evidence: "calibrated scales; approved formulation; lot traceability; inventory reconciliation"
    - protocol_id: cp_water_and_utilities
      process_id: "prepared_meal_manufacturing"
      flow_role: "potable water, electricity, natural gas and purchased steam"
      record_type: "meter, invoice, equipment log and production log"
      raw_fields: "opening and closing meter; invoice quantity; meter unit; equipment id; operating time; fuel calorific value; condensate return; production output"
      collection_method: "Prefer process submetering; otherwise reconcile site meter or invoice totals and apply calc_shared_utility"
      unit: "native meter unit"
      frequency: "continuous or per invoice with monthly reconciliation"
      temporal_coverage: "same reporting period as finished output"
      site_scope: "manufacturing site and included support systems"
      aggregation_rule: "Reconcile allocated totals to verified site totals before normalization"
      quality_evidence: "meter calibration; invoices; time logs; reconciliation statement"
    - protocol_id: cp_packaging_components
      process_id: "prepared_meal_manufacturing"
      flow_role: "each package component"
      record_type: "component specification, unit-mass test, issue and scrap record"
      raw_fields: "exact material; supplier; unit mass; packed unit count; issued mass; returned mass; scrap mass"
      collection_method: "Weigh representative empty components and reconcile component issues, packed counts and scrap"
      unit: "kg"
      frequency: "each package specification and monthly reconciliation"
      temporal_coverage: "same reporting period as finished output"
      site_scope: "all packing lines in scope"
      aggregation_rule: "Calculate each component separately; no combined packaging total"
      quality_evidence: "calibrated scale; component specification; stock reconciliation"
    - protocol_id: cp_finished_product
      process_id: "prepared_meal_manufacturing"
      flow_role: "net saleable finished product"
      record_type: "checkweigher, net-content test, accepted unit and batch release record"
      raw_fields: "batch id; recipe family; route; accepted units; net content; rejects; retained samples; release status"
      collection_method: "Sum accepted net-content mass only after final quality release"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete reporting period"
      site_scope: "all included lines"
      aggregation_rule: "Normalize all exchanges using calc_reference_normalization"
      quality_evidence: "calibrated checkweigher; release record; production reconciliation"
    - protocol_id: cp_waste_outputs
      process_id: "prepared_meal_manufacturing"
      flow_role: "each food or packaging waste"
      record_type: "container weight, weighbridge ticket and transfer note"
      raw_fields: "exact waste identity; gross and tare mass; destination; date; batch or line; recovery status"
      collection_method: "Weigh each waste stream separately at transfer"
      unit: "kg"
      frequency: "each transfer or container"
      temporal_coverage: "same reporting period as finished output"
      site_scope: "all included lines"
      aggregation_rule: "Sum by atomic waste identity and destination; subtract measured contamination only with evidence"
      quality_evidence: "scale calibration; transfer note; treatment acceptance record"
    - protocol_id: cp_refrigerant_inventory
      process_id: "prepared_meal_manufacturing"
      flow_role: "R-404A make-up and direct loss"
      record_type: "equipment charge, service and recovery records"
      raw_fields: "equipment id; refrigerant identity; opening charge; additions; closing charge; recovered mass; production allocation key"
      collection_method: "Technician-verified refrigerant mass balance by equipment"
      unit: "kg"
      frequency: "each service event and annual closure"
      temporal_coverage: "reporting year including opening and closing inventory"
      site_scope: "directly controlled refrigeration systems"
      aggregation_rule: "Apply calc_refrigerant_loss; allocate only equipment-specific loss to covered production"
      quality_evidence: "certified service record; cylinder weights; equipment log"
    - protocol_id: cp_direct_air_emissions
      process_id: "prepared_meal_manufacturing"
      flow_role: "each direct combustion emission"
      record_type: "stack test, continuous monitor, fuel meter and factor record"
      raw_fields: "pollutant species; measured concentration and flow or fuel use; factor value; factor source; oxidation basis; operating hours"
      collection_method: "Prefer representative stack measurements; otherwise calculate each species from collected fuel use and a disclosed factor"
      unit: "kg pollutant and native fuel unit"
      frequency: "monitoring interval or each fuel reconciliation period"
      temporal_coverage: "same reporting period as fuel use"
      site_scope: "each directly controlled combustion unit"
      aggregation_rule: "Apply calc_direct_combustion_emission; never combine pollutant species"
      quality_evidence: "accredited test or monitor QA; calibrated fuel meter; retained factor source"
    - protocol_id: cp_wastewater_monitoring
      process_id: "prepared_meal_manufacturing_on_site_wastewater_treatment"
      flow_role: "wastewater volume, sludge and each final-effluent indicator"
      record_type: "flow meter, composite sample and laboratory result"
      raw_fields: "inflow and outflow volume; sample period; COD; BOD5; TSS; TN; TP; sludge wet mass; sludge dry solids; discharge destination"
      collection_method: "Flow-proportional composite sampling where practicable and accredited laboratory analysis using declared methods"
      unit: "m3, mg/L and kg"
      frequency: "continuous flow plus sampling frequency justified by permit and process variability"
      temporal_coverage: "same reporting period as finished output"
      site_scope: "manufacturing collection point and final discharge point"
      aggregation_rule: "Apply calc_wastewater_pollutant_load; keep every indicator separate"
      quality_evidence: "flow-meter calibration; chain of custody; laboratory accreditation; permit record"
    - protocol_id: cp_wastewater_treatment_inputs
      process_id: "on_site_wastewater_treatment"
      flow_role: "treatment electricity and each treatment chemical"
      record_type: "submeter, dosing pump, tank and delivery record"
      raw_fields: "exact input identity; meter or dosing total; concentration; opening and closing stock; treated volume"
      collection_method: "Reconcile submeter and chemical stock changes to treatment operation"
      unit: "kWh or kg"
      frequency: "continuous or each delivery with monthly reconciliation"
      temporal_coverage: "same reporting period as wastewater monitoring"
      site_scope: "on-site treatment system"
      aggregation_rule: "Normalize inputs to covered production without merging chemical identities"
      quality_evidence: "meter calibration; delivery note; dosing calibration; stock reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every foreground exchange"
      rule: "normalized quantity = reporting-period exchange quantity × 1,000 kg / reporting-period net saleable finished-product mass"
      inputs:
        - "atomic exchange quantity"
        - "accepted net saleable output mass"
      output: "exchange quantity per 1,000 kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_shared_utility
      applies_to: "verified site utility total without direct process submeter"
      rule: "Allocate by a documented causal driver; sum all allocated quantities and reconcile exactly to the verified meter or invoice total before reference-flow normalization"
      inputs:
        - "site total"
        - "equipment load"
        - "operating time or other causal driver"
        - "covered output"
      output: "allocated atomic utility quantity"
      source_ids:
        - eu-pef-2021
        - schmidt-rivera-2019
    - id: calc_refrigerant_loss
      applies_to: "each refrigerant in directly controlled equipment"
      rule: "loss = opening charge + additions − closing charge − recovered refrigerant; investigate and document any negative or unexplained balance"
      inputs:
        - "equipment-specific refrigerant inventory and service records"
      output: "kg refrigerant emitted to air"
      source_ids:
        - jrc-fdm-bref-2019
    - id: calc_direct_combustion_emission
      applies_to: "each directly emitted combustion species"
      rule: "emission = measured stack mass, or collected fuel activity × disclosed species-specific emission factor; do not use one combined air-emission row"
      inputs:
        - "stack result or fuel activity"
        - "species-specific factor and source"
      output: "kg of one named pollutant species"
      source_ids:
        - jrc-fdm-bref-2019
    - id: calc_wastewater_pollutant_load
      applies_to: "COD, BOD5, TSS, TN or TP at direct discharge"
      rule: "pollutant load (kg) = final-effluent volume (m3) × representative concentration (mg/L) × 0.001; use the same sampling and flow period"
      inputs:
        - "final-effluent volume"
        - "one pollutant concentration"
      output: "kg of the named pollutant indicator"
      source_ids:
        - jrc-fdm-bref-2019
    - id: calc_mass_reconciliation
      applies_to: "recipe and packaging mass balance"
      rule: "Compare total as-received ingredient and packaging mass with saleable product, separately named wastes, wastewater transfers, retained samples and documented inventory change; investigate unexplained imbalance without treating water evaporation as solid waste"
      inputs:
        - "all measured mass inputs and outputs"
        - "stock changes"
      output: "reconciliation statement and unexplained-mass result"
      source_ids:
        - eu-pef-2021
        - jrc-fdm-bref-2019
  data_quality_requirements:
    - id: dq_category_identity
      applies_to: "finished product"
      requirement: "Demonstrate two distinct main ingredients and document why the ingredient basis is not one of the excluded CPC subclasses."
      evidence: "approved recipe, ingredient mass shares, product specification and CPC classification rationale"
    - id: dq_route_identity
      applies_to: "finished product"
      requirement: "Retain preparation, cooking, cooling/freezing or retorting, package-sealing and storage specifications and identify the route actually used."
      evidence: "batch route, HACCP plan, process log and package specification"
    - id: dq_temporal_alignment
      applies_to: "all foreground data"
      requirement: "Use the same representative reporting period for inputs, outputs, wastes and emissions; a shorter campaign must cover all campaign batches and disclose seasonality or start-up effects."
      evidence: "dated records and production reconciliation"
    - id: dq_meter_and_scale_control
      applies_to: "measured quantities"
      requirement: "Use calibrated meters and scales and retain calibration status and data-capture completeness."
      evidence: "calibration certificates, meter checks and missing-data log"
    - id: dq_supplier_representativeness
      applies_to: "upstream datasets"
      requirement: "Match ingredient, packaging, energy and treatment datasets to supplier geography, technology and period; disclose every proxy."
      evidence: "supplier declarations, dataset metadata and proxy register"
    - id: dq_wastewater_sampling
      applies_to: "wastewater indicators"
      requirement: "Align final-effluent volume and concentration periods, retain laboratory method and chain of custody and identify whether discharge is direct or to off-site treatment."
      evidence: "composite-sample record, accredited laboratory report, flow-meter record and permit"
    - id: dq_allocation_reconciliation
      applies_to: "shared operations"
      requirement: "Reconcile allocated utility, waste and emission totals to verified site totals and disclose causal drivers and residuals."
      evidence: "allocation workbook, meter total and reconciliation check"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Include each actual ingredient, package component, utility, refrigerant, waste and direct emission as an atomic row; document a missing secondary dataset as a data gap rather than deleting the exchange."
      evidence: "recipe-to-inventory, bill-of-materials-to-inventory, utility and waste reconciliation checklists"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The output UUID must be 92b0b2f5-905b-45e9-8182-b0ad6ed26cfc, the reference property must be Mass 93a60a56-a3c8-11da-a746-0800200b9a66, the unit group must be 93a60a57-a4c8-11da-a746-0800200c9a66, and the normalized amount must be 1,000 kg."
    source_ids:
      - un-cpc-v3-2025
  - rule_id: validate_cpc_scope
    applies_to: "product category"
    rule: "At least two distinct main ingredients must be separately identified and mass-quantified, and no excluded primary ingredient basis or product form may be classified under this PCR."
    source_ids:
      - un-cpc-v3-2025
  - rule_id: validate_atomic_inventory
    applies_to: "all inventory rows"
    rule: "Every selected flow must represent one physical or chemical exchange; reject plural collection labels, combined utilities, combined packaging, combined wastes and combined emissions."
    source_ids:
      - jrc-fdm-bref-2019
  - rule_id: validate_recipe_completeness
    applies_to: "ingredient inventory"
    rule: "Every ingredient on the approved production recipe must map to one separately named input row, and recipe mass must reconcile to batch issue records."
    source_ids:
      - schmidt-rivera-2019
  - rule_id: validate_package_completeness
    applies_to: "package inventory"
    rule: "Every primary and secondary package component must map to one separately named input and its process scrap, if any, must map to one separately named waste output."
    source_ids:
      - jrc-fdm-bref-2019
      - codex-cxc-8-1976
  - rule_id: validate_preservation_records
    applies_to: "cooking, chilling, freezing, retorting or vacuum route"
    rule: "The data package must retain the actual process route and relevant time-temperature or sealing records; a frozen route must identify quick-freezing and cold-holding conditions."
    source_ids:
      - codex-cxc-1-1969
      - codex-cxc-8-1976
  - rule_id: validate_wastewater_exclusivity
    applies_to: "wastewater"
    rule: "The same wastewater quantity must be represented either as a waste flow to off-site treatment or through included on-site treatment and direct-discharge flows, not both."
    source_ids:
      - jrc-fdm-bref-2019
  - rule_id: validate_wastewater_indicators
    applies_to: "direct wastewater discharge"
    rule: "When direct discharge is included, COD, BOD5, TSS, TN and TP must each be reported or each missing test must be an explicit data gap; no combined wastewater-pollutant row is allowed."
    source_ids:
      - jrc-fdm-bref-2019
  - rule_id: validate_direct_air_emissions
    applies_to: "on-site combustion and refrigeration"
    rule: "Each measured or calculated pollutant and each refrigerant must be a separate elementary-flow row with its method or factor source retained in the produced dataset."
    source_ids:
      - jrc-fdm-bref-2019
  - rule_id: validate_normalization
    applies_to: "all foreground exchanges"
    rule: "Every exchange must use the same accepted net-saleable-output denominator and the reporting-period allocation totals must reconcile to site records before normalization."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_ranges
    applies_to: "quantitative range metadata"
    rule: "No source-backed range is authorized by this PCR. Any later range must pass the repository range-evidence contract, including at least two independent boundary-compatible original sources for an inferred empirical range."
    source_ids:
      - "—"
  - rule_id: validate_unresolved_identities
    applies_to: "publication readiness"
    rule: "UUID-free atomic flow names may support candidate authoring but every unresolved Tiangong identity in the manifest must be resolved or explicitly reviewed before publication."
    source_ids:
      - "—"
published_dataset_profile:
  dataset_role: "Foreground production data package that may be published as a secondary or background dataset after review"
  downstream_use: "Construction of process and lifecyclemodel datasets for prepared-meal production and broader food-system studies"
  allowed_use: "Factory-gate modelling of a declared CPC 23997 recipe family, preservation route, package configuration, geography and production period"
  excluded_use: "Direct proxy for excluded CPC meal subclasses; consumer meal service; restaurant preparation; distribution, retail, reheating or end-of-life unless an expanded lifecycle model adds those stages"
  required_metadata: "canonical PCR id; CPC coordinate; recipe family; two or more main ingredient identities and mass shares; ingredient-basis rationale; route; package components; reference UUID/property/unit; site/geography/period; allocation; wastewater route; upstream dataset and proxy register"
  required_quality_disclosure: "record coverage; meter and scale calibration; temporal, geographic and technological representativeness; allocation drivers and reconciliation; missing secondary datasets; unresolved UUIDs; treatment destinations; direct-emission and wastewater test methods"
  update_trigger: "Recipe or main-ingredient basis change; preservation-route or package redesign; material supplier or energy-system change; treatment-route change; new source-backed range evidence; material meter or allocation change; Tiangong identity resolution; regulatory or CPC scope change"
