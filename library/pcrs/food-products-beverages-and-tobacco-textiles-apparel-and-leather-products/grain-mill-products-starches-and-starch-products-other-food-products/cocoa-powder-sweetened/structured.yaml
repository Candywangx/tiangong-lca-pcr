validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "Confirm UUID 75c1ef5f-a7df-489a-8c49-07a90f6c4d66, Product flow type, CPC 23640 classification, Mass property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, mass unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and kg reference unit."
    source_ids: []
  - rule_id: validation_category_and_recipe
    applies_to: "product identity"
    rule: "Verify that cocoa powder and sugars characterize the dry product, required qualifiers and recipe fractions are declared, exclusions are respected, and the applicable destination-market product specification is met; where the EU sweetened-cocoa sales name is claimed, verify at least 25% cocoa powder."
    source_ids:
      - eu-cocoa-directive-2000-36
      - codex-cxs-105-1981
  - rule_id: validation_boundary_coverage
    applies_to: "process map and inventory"
    rule: "Verify inclusion of every operated step from receipt through accepted packed product, conditional conditioning steps, upstream provider links, cleaning and utility use, wastes, wastewater, and direct emissions; list and justify every omitted flow."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_mass_balance
    applies_to: "each process and reporting period"
    rule: "Recalculate ingredient fractions, intermediate yields, accepted output, rework, waste, stock change, and direct mass emissions; flag unexplained residuals and double-counted rework."
    source_ids: []
  - rule_id: validation_allocation
    applies_to: "shared processes and multifunctionality"
    rule: "Confirm that subdivision was attempted first and that every remaining allocation has a causal driver, complete factor set, consistent denominator, and documented fallback rationale."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_data_quality
    applies_to: "foreground and provider data"
    rule: "Confirm complete temporal coverage, calibration and traceability evidence, provider-dataset identity, and documented technological, geographical, time, and precision assessment; flag unresolved UUIDs and proxies."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_no_unlabelled_estimates
    applies_to: "all amounts"
    rule: "Reject an amount presented as measured, calculated, or source-backed when its record, formula, or cited source is absent; any future provisional estimate must use reasoned_estimate, omit a false source id, and remain replaceable."
    source_ids: []
published_dataset_profile:
  dataset_role: "Facility- and product-specific foreground data package or aggregated gate-to-gate dataset for production of sweetened cocoa powder at the manufacturing-site gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Ingredient supply-chain, food-manufacturing, beverage-preparation, packaging, and broader product life-cycle models that require a disclosed factory-gate sweetened cocoa powder input"
  excluded_use: "Unsweetened cocoa powder, cocoa bean or cocoa-liquor processing, chocolate manufacture, ready-to-drink cocoa beverages, consumer preparation, distribution, or comparative claims without compatible recipes, geography, period, boundary, allocation, and review"
  required_metadata: "PCR id and version context; Tiangong reference-flow UUID; facility and geography; reporting period; cocoa-powder and sugar fractions; cocoa type and treatment; optional ingredients; instantization or agglomeration route; moisture or solids specification; packaging format; process coverage; provider datasets; allocation methods; data owners and review status"
  required_quality_disclosure: "Primary-data coverage; measurement and calibration evidence; mass-balance residual; allocation drivers and factors; technological, geographical, time, and precision assessment; proxy and UUID gaps; exclusions; uncertainty and review limitations"
  update_trigger: "Recipe or cocoa-powder fraction change; new sweetener or optional ingredient; change between conventional and fat-reduced or alkalized cocoa; addition or removal of conditioning or agglomeration; material process, energy, yield, packaging, supplier, site, or regulation change; expired representativeness; resolved UUID or proxy gap"
