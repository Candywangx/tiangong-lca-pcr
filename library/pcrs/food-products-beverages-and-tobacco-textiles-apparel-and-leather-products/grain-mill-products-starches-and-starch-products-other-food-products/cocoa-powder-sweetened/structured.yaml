        - cp_output_quality
      output: "kg packaging material/kg reference product"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "each process and reporting period"
      rule: "unexplained mass difference = total mass inputs + opening stock - product outputs - documented rework transfer - wastes - closing stock - quantified direct mass emissions; investigate rather than silently allocate the residual"
      inputs:
        - recipe
        - stock
        - product
        - rework
        - waste
        - wastewater
        - "and emission records"
      output: "signed mass-balance reconciliation and disclosed residual"
      source_ids: []
