allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "dedicated and shared manufacturing operations"
    rule: "Avoid allocation by collecting separate recipe, output, waste, energy, utility, and emission records for the sweetened cocoa powder line, batch, or campaign; use system expansion only when the additional function and substituted system are explicitly modelled."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_driver
    applies_to: "shared utilities and services"
    rule: "When subdivision is not practicable, allocate shared burdens using a documented causal physical driver such as metered energy, equipment operating time, cleaned surface or volume, or mass throughput; justify why the driver represents resource use."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_fallback
    applies_to: "genuine co-products with no defensible physical relationship"
    rule: "Use economic allocation only after documenting why subdivision, system expansion, and a relevant physical relationship are not practicable; record prices, reference period, allocation factors, and a sensitivity check."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework_and_waste
    applies_to: "internal rework, off-specification powder, and wastes"
    rule: "Internal rework that does not cross the product-system boundary carries no co-product credit and is tracked separately from fresh input; waste leaving the boundary is not a co-product unless a documented marketable function and the selected multifunctionality method justify otherwise."
    source_ids:
      - eu-pef-2021-2279
