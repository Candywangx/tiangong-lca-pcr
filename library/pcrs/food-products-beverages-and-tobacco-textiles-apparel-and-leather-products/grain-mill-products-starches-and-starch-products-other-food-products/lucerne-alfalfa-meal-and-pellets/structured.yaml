allocation_rules:
  - rule_id: allocation_route_separation
    applies_to: "Distinct raw states and manufacturing technologies"
    rule: "Prefer subdivision. Keep fresh-wilted, field-dried, and purchased-dehydrated inputs; each dryer technology and fuel; meal and pellet forms; and bulk and packaged release routes separately metered or calculated. Do not allocate by averaging unlike routes."
    source_ids:
      - eu-pef-2021-2279
      - us-epa-ap42-alfalfa-1996
  - rule_id: allocation_internal_recycle
    applies_to: "Recovered dryer or grinding dust, coarse screenings, and pellet fines"
    rule: "Measure each fraction before return. An internal return carries the originating process burden and is neither a co-product nor an avoided waste credit; prevent double counting at the sending and receiving processes."
    source_ids:
      - us-epa-ap42-alfalfa-1996
      - fao-feed-milling
  - rule_id: allocation_saleable_lucerne_fraction
    applies_to: "A separately saleable lucerne screening, meal fraction, dust fraction, or pellet-fines product"
    rule: "First subdivide the process where records allow. If subdivision is not possible, use a documented physical relation that reflects the causal production process; use economic allocation only when no defensible physical relation exists, and disclose quantities, prices, period, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_energy_and_utilities
    applies_to: "Shared electricity, steam, hot water, fuel, compressed air, and treatment services"
    rule: "Allocate shared utilities using stage submeters; otherwise use documented equipment time, rated demand corrected by measured load, processed mass, or wastewater volume. Do not use revenue to allocate a shared utility."
    source_ids:
      - fefac-pefcr-feed-data-2021
      - eu-pef-2021-2279
  - rule_id: allocation_waste_and_disposal
    applies_to: "Rejects, discarded dust, ash, packaging waste, screenings, sludge, and wastewater"
    rule: "Assign generation to the process and product route that caused it. Model treatment or disposal transparently; do not create an avoided-product credit in the foreground inventory unless a separately reviewed downstream substitution model is declared."
    source_ids:
      - eu-fdm-bat-2019
      - eu-pef-2021-2279
  - rule_id: allocation_packaging_reuse
    applies_to: "Reusable wood pallets"
    rule: "Allocate pallet manufacture only over documented foreground reuse cycles within the declared ownership and return system; do not assume a reuse count."
    source_ids:
      - fefac-pefcr-feed-data-2021
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_records
      process_id: "raw_material_receiving"
      flow_role: "Received lucerne by state; receiving utilities; rejects; removed soil and stones; receiving dust"
      record_type: "Scale, meter, inspection, moisture, waste, and emission records"
      raw_fields: "lot_id; received_state; supplier; origin; gross_mass; tare_mass; accepted_mass; rejected_mass; moisture; electricity; diesel; separated_soil; separated_stones; dust_measurement"
      collection_method: "Calibrated weighbridge or hopper scale, moisture method, utility records, waste-container weights, and stage emission measurement or calculation"
      unit: "kg; % moisture; kWh; kg fuel; kg emission"
      frequency: "Each lot and each receiving operating shift"
      temporal_coverage: "Representative contiguous production period, normally at least 12 months or all campaigns if seasonal"
      site_scope: "One identified production site"
      aggregation_rule: "Sum state-specific accepted and rejected masses and utilities; normalize only to output from the linked route"
      quality_evidence: "Scale and meter calibration; lot tickets; moisture reports; fuel records; waste manifests; emission method and calculation workbook"
    - protocol_id: cp_drying_records
      process_id: "thermal_drying"
      flow_role: "Dryer utilities, fuels, recovered heat, dried chops, recovered dust, ash, and individual air emissions"
      record_type: "Stage meters, fuel stocks, mass and moisture balance, control-device records, and stack measurements"
      raw_fields: "dryer_id; dryer_type; fuel_identity; fuel_quantity; fuel_quality; electricity; steam_state; hot_water_state; recovered_heat_states; inlet_mass_and_moisture; outlet_mass_and_moisture; dust_mass; ash_mass; stack_flow; pollutant_concentrations; operating_hours"
      collection_method: "Read calibrated meters and scales; retain fuel analyses and emission-test data; calculate heat and species-resolved loads using declared equations"
      unit: "kWh; MJ; kg; % moisture; Nm3; kg pollutant"
      frequency: "Per batch or shift for activity data and at the legally or technically applicable emission-monitoring frequency"
      temporal_coverage: "Complete declared drying campaign or representative annual period"
      site_scope: "One identified dryer system at one site"
      aggregation_rule: "Aggregate only one dryer technology and fuel configuration; calculate mass, heat, and pollutant totals before normalization"
      quality_evidence: "Meter and scale calibration; supplier certificates; moisture tests; stack-test reports; control-device logs; calculation workbook"
    - protocol_id: cp_grinding_records
      process_id: "grinding_and_sieving"
      flow_role: "Grinding utilities, meal, screenings, recovered and discarded dust, and individual particulate fractions"
      record_type: "Stage meters, scales, screen records, dust-collector records, and emission measurements"
      raw_fields: "mill_id; screen_specification; feed_mass; feed_moisture; electricity; compressed_air; meal_mass; screenings_mass; recovered_dust_mass; discarded_dust_mass; stack_flow; pm25; pm_coarse"
      collection_method: "Submeter and calibrated mass records linked to mill and screen settings; size-resolved emission measurement or documented calculation"
      unit: "kWh; Nm3; kg; % moisture; kg pollutant"
      frequency: "Each production lot or shift"
      temporal_coverage: "Complete declared route period"
      site_scope: "One identified grinding and sieving train"
      aggregation_rule: "Reconcile inputs, internal returns, meal, screenings, discarded dust, and releases before normalization"
      quality_evidence: "Meter and scale calibration; screen specification; filter and cyclone logs; emission reports; mass-balance workbook"
    - protocol_id: cp_pelleting_records
      process_id: "steam_conditioning_and_pelleting"
      flow_role: "Meal, exact binder cards if any, conditioning water, steam, electricity, hot pellets, reject, and particulate"
      record_type: "Batch formulation, meters, scales, pellet-mill operating and emission records"
      raw_fields: "lot_id; meal_mass_and_moisture; binder_substance_and_mass_or_none; water_mass; steam_mass_pressure_temperature; electricity; hot_pellet_mass_and_moisture; reject_mass; stack_flow; pm25; pm_coarse"
      collection_method: "Link product-specific formulation and mill settings to calibrated feed, water, steam, power, output, reject, and emission records"
      unit: "kg; % moisture; MJ; kWh; kg pollutant"
      frequency: "Each pellet lot or shift"
      temporal_coverage: "Complete declared pellet route period"
      site_scope: "One identified conditioner and pellet mill"
      aggregation_rule: "Keep every exact binder separate; reconcile meal, added water, steam condensate, product, reject, dust, and inventory change"
      quality_evidence: "Formulation and legal identity; meter and scale calibration; pellet-mill logs; release tests; emission reports"
    - protocol_id: cp_cooling_records
      process_id: "pellet_cooling_and_screening"
      flow_role: "Hot pellets, cooling electricity, accepted pellets, recovered and discarded fines, and particulate"
      record_type: "Stage meters, scales, screen and cooler records, and emission measurements"
      raw_fields: "lot_id; cooler_id; screen_specification; hot_pellet_mass; electricity; accepted_pellet_mass; recovered_fines_mass; discarded_fines_mass; inlet_and_outlet_temperature; moisture; stack_flow; pm25; pm_coarse"
      collection_method: "Calibrated mass and power measurements linked to cooler and screen settings, with size-resolved release measurement or calculation"
      unit: "kg; kWh; °C; % moisture; kg pollutant"
      frequency: "Each pellet lot or shift"
      temporal_coverage: "Complete declared pellet route period"
      site_scope: "One identified cooler and screen train"
      aggregation_rule: "Reconcile hot pellets, accepted pellets, internal fines, discarded fines, dust, and inventory change before normalization"
      quality_evidence: "Meter and scale calibration; screen specification; cooler logs; moisture tests; emission reports"
    - protocol_id: cp_packaging_release_records
      process_id: "packaging_storage_and_release"
      flow_role: "Meal or pellets, electricity, each packaging component, net reference output, off-spec product, packaging waste, and load-out dust"
      record_type: "Packaging issue, scale, warehouse, release, waste, and emission records"
      raw_fields: "final_form; lot_id; product_input_mass; moisture; grade; packaging_component_identity_and_mass; pallet_tracking; electricity; net_released_mass; offspec_mass; each_packaging_waste_mass; stack_flow; pm25; pm_coarse"
      collection_method: "Calibrated product scales, packaging stock reconciliation, pallet records, quality release, warehouse meters, waste weights, and emission measurement or calculation"
      unit: "kg; kWh; % moisture; kg pollutant"
      frequency: "Each released lot and monthly inventory reconciliation"
      temporal_coverage: "Complete declared release period"
      site_scope: "One identified site and packaging or bulk line"
      aggregation_rule: "Keep meal and pellet routes and each packaging material separate; use net released mass as denominator"
      quality_evidence: "Scale and meter calibration; packaging specifications and invoices; stock records; quality certificates; waste manifests; emission reports"
    - protocol_id: cp_cleaning_records
      process_id: "cleaning_and_maintenance"
      flow_role: "Electricity, compressed air, wet-cleaning water, exact chemicals if any, sweepings, wash wastewater, and filter fabric"
      record_type: "Cleaning event, utility, chemical issue, waste, wastewater, and maintenance records"
      raw_fields: "event_id; equipment_train; dry_or_wet_method; electricity; compressed_air; water_mass; exact_chemical_identity_and_mass; sweepings_mass; wastewater_volume; used_filter_mass; destination"
      collection_method: "Event-level log linked to calibrated utility meters, material issues, waste weights, wastewater meters or tanks, and maintenance work orders"
      unit: "kWh; Nm3; kg; m3"
      frequency: "Each cleaning or maintenance event"
      temporal_coverage: "Same period as linked production routes"
      site_scope: "One identified site and equipment train"
      aggregation_rule: "Assign each event to the cleaned route by equipment time or processed mass and keep each chemical and waste separate"
      quality_evidence: "Cleaning logs; meter calibration; safety and product specifications; chemical issue records; waste manifests; maintenance orders"
    - protocol_id: cp_wastewater_treatment_records
      process_id: "onsite_wastewater_treatment"
      flow_role: "Wastewater, electricity, exact reagents if any, effluent, screenings, sludge, five water parameters, methane, and nitrous oxide"
      record_type: "Flow, laboratory, treatment-operation, chemical, waste, and gas records"
      raw_fields: "influent_volume; effluent_volume; recycle_and_storage; electricity; exact_reagent_identity_and_mass; screenings_mass_and_solids; sludge_mass_and_solids; cod; bod5; tss; total_nitrogen; total_phosphorus; methane; nitrous_oxide; sampling_times"
      collection_method: "Calibrated flow and power meters, representative paired samples, accredited or documented analytical methods, waste weights, and gas measurement or calculation"
      unit: "m3; kWh; kg; mg/L; kg pollutant"
      frequency: "Continuous or daily flow totals; sampling at applicable permit or BAT frequency"
      temporal_coverage: "Complete declared treatment and discharge period"
      site_scope: "One identified on-site treatment train"
      aggregation_rule: "Use flow-weighted pollutant loads; reconcile water balance and assign shared treatment by actual influent volume and pollutant load"
      quality_evidence: "Meter calibration; chain of custody; laboratory reports; treatment logs; reagent records; waste manifests; emissions calculation workbook"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground exchanges"
      rule: "Normalized amount = route-period exchange quantity divided by net conforming reference-product mass released from the same route and period."
      inputs:
        - "route-period exchange quantity"
        - "net released mass"
      output: "Exchange per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_net_received_material
      applies_to: "Received lucerne"
      rule: "Accepted received mass = gross vehicle or container mass minus tare minus separately weighed rejected material; preserve state and moisture by lot."
      inputs:
        - "gross mass"
        - tare
        - "rejected mass"
        - "received state"
        - moisture
      output: "Accepted lucerne mass by exact state"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_drying_water_balance
      applies_to: "Thermal drying"
      rule: "Water removed = inlet wet mass × inlet moisture fraction minus outlet mass × outlet moisture fraction, with recovered and discarded solids reconciled separately."
      inputs:
        - "inlet mass and moisture"
        - "outlet mass and moisture"
        - dust
        - ash
        - "inventory change"
      output: "Water removed and dryer material-balance residual"
      source_ids:
        - us-epa-ap42-alfalfa-1996
    - id: calc_delivered_heat
      applies_to: "Steam, hot water, and recovered heat"
      rule: "Heat = measured mass or volume flow multiplied by the documented inlet-to-outlet specific-enthalpy difference; report steam, hot water, and recovered heat separately."
      inputs:
        - flow
        - pressure
        - temperature
        - "return state"
        - "fluid properties"
      output: "MJ of one named heat carrier"
      source_ids:
        - eu-jrc-fdm-bref-2019
        - eu-pef-2021-2279
    - id: calc_shared_stage_electricity
      applies_to: "Stage electricity without a dedicated submeter"
      rule: "Stage electricity = site-meter electricity multiplied by the documented ratio of route equipment measured load-hours to total included equipment load-hours; disclose uncertainty."
      inputs:
        - "site electricity"
        - "equipment load"
        - "operating time"
      output: "kWh assigned to one process and route"
      source_ids:
        - fefac-pefcr-feed-data-2021
        - eu-pef-2021-2279
    - id: calc_combustion_species
      applies_to: "Each dryer combustion emission"
      rule: "Species mass = measured fuel quantity multiplied by the documented fuel- and technology-specific species factor, adjusted only for measured control and oxidation parameters; use stack measurement instead when representative."
      inputs:
        - "exact fuel"
        - quantity
        - quality
        - "species factor"
        - control
        - "operating state"
      output: "kg of one named chemical or particulate fraction to air"
      source_ids:
        - eu-fdm-bat-2019
        - eu-pef-2021-2279
    - id: calc_particulate_load
      applies_to: "Each process particulate fraction"
      rule: "Pollutant load = flow-weighted concentration multiplied by dry or wet exhaust volume on the same reference condition; size fractions shall be non-overlapping."
      inputs:
        - "exhaust flow"
        - concentration
        - duration
        - "reference condition"
        - "size fraction"
      output: "kg of one particulate fraction to air"
      source_ids:
        - us-epa-ap42-alfalfa-1996
        - eu-fdm-bat-2019
    - id: calc_packaging_mass
      applies_to: "Each packaging component"
      rule: "Component mass = verified unit mass multiplied by units consumed, corrected with opening and closing stock and documented pallet reuse where applicable."
      inputs:
        - "unit mass"
        - count
        - "opening stock"
        - receipts
        - "closing stock"
        - "reuse cycles"
      output: "kg of one named packaging material"
      source_ids:
        - fefac-pefcr-feed-data-2021
        - eu-pef-2021-2279
    - id: calc_effluent_pollutant_load
      applies_to: "COD, BOD5, TSS, total nitrogen, or total phosphorus"
      rule: "Pollutant load = paired flow-weighted effluent concentration multiplied by discharged effluent volume with unit conversion documented."
      inputs:
        - "effluent volume"
        - "one pollutant concentration"
        - "sample coverage"
      output: "kg of one named water parameter to water"
      source_ids:
        - eu-fdm-bat-2019
        - eu-pef-2021-2279
    - id: calc_route_mass_balance
      applies_to: "Each process and complete route"
      rule: "Residual = measured inputs minus measured products, internal transfers, wastes, releases, measured inventory change, and documented moisture change; investigate rather than force-close material residuals."
      inputs:
        - "all measured mass terms"
        - moisture
        - "inventory change"
      output: "Disclosed mass-balance residual and reconciliation result"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Confirm final form, single-lucerne identity, CPC 23320 scope, moisture, declared grade, packaging state, site, and period; retain the bakery-comment rejection in the audit trail."
      evidence: "Product specification, release certificate, classification check, and reference-flow verification record"
    - id: dq_route_identity
      applies_to: "All foreground processes"
      requirement: "Record raw-material state, dryer technology and heat source, grinding/screen settings, pelleting and conditioning configuration, binder identity or none, cooler/screen settings, and packaging configuration without averaging unlike routes."
      evidence: "Route diagram, equipment list, lot genealogy, formulation record, and process logs"
    - id: dq_measurement
      applies_to: "Meters, scales, and laboratory data"
      requirement: "Use calibrated instruments and documented methods appropriate to the measured quantity; retain calibration validity, detection limits, sampling conditions, and missing-data treatment."
      evidence: "Calibration certificates, laboratory reports, sampling plans, and instrument logs"
    - id: dq_temporal
      applies_to: "Foreground activity data"
      requirement: "Cover a representative production period, normally at least 12 consecutive months or every campaign in a seasonal year; disclose shutdowns, abnormal operation, and incomplete coverage."
      evidence: "Dated production, utility, maintenance, waste, and release records"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Include all known product, waste, and elementary exchanges, with each electricity, heat carrier, fuel, chemical, packaging component, waste, water parameter, and air emission in its own card."
      evidence: "Inventory reconciliation, supplier and utility records, emission registers, waste manifests, and unresolved-UUID register"
    - id: dq_mass_balance
      applies_to: "Material processes"
      requirement: "Report process and route mass-balance residuals and investigate material discrepancies using moisture, dust recovery, internal recycle, reject, and storage records."
      evidence: "Signed mass-balance workbook and corrective-action note for unexplained residuals"
    - id: dq_emissions
      applies_to: "Air and water releases"
      requirement: "Match emission measurements or factors to the actual technology, fuel, control device, compartment, operating state, and period; do not report overlapping particulate fractions or combine chemical species."
      evidence: "Stack or wastewater reports, permit records, factor source, control logs, and calculation workbook"
    - id: dq_verifiability
      applies_to: "Published package"
      requirement: "Preserve the product-specific BoM, company-specific manufacturing activity data, calculation files, secondary-dataset identities, allocation decisions, data-quality assessment, and reviewer access to underlying records."
      evidence: "PEF-style data inventory, source register, model archive, and verification statement"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require UUID f984b084-e66e-4d11-8365-354ae0ad5a74, Product flow type, exact CPC 23320, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and kg. Reject the conflicting remote bakery generalComment."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_reference_amount
    applies_to: "Reference output"
    rule: "Require exactly 1 kg net conforming as-sold meal or pellets and exclude all packaging mass."
    source_ids:
      - un-cpc-3-2025
      - eu-fdm-bat-2019
  - rule_id: validate_route_lock
    applies_to: "Data package identity"
    rule: "Fail when final form, received lucerne state, drying technology and heat source or none, grinding/screen configuration, pelleting and conditioning route or none, binder identity or none, release moisture, packaging, site, or period is missing; fail when unlike routes are averaged."
    source_ids:
      - us-epa-ap42-alfalfa-1996
      - eu-fdm-bat-2019
      - eu-pef-2021-2279
  - rule_id: validate_process_coverage
    applies_to: "Process map"
    rule: "Require receiving, grinding/sieving, packaging or bulk release, and cleaning; require drying, pelleting, cooling/screening, and on-site wastewater treatment exactly when their inclusion conditions apply."
    source_ids:
      - us-epa-ap42-alfalfa-1996
      - fao-feed-milling
      - eu-fdm-bat-2019
  - rule_id: validate_atomic_selected_flow
    applies_to: "Inventory cards"
    rule: "Require every Selected flow to be one exact exchange. Reject collective or selector labels for feed, materials, energy, fuels, packaging, chemicals, additives, by-products, wastes, pollutants, or emissions."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_unlisted_actual_flow
    applies_to: "Actual binders, chemicals, fuels, packaging, wastes, and emissions"
    rule: "If an actual legal flow is not listed, require a newly authored exact card with its own row_id, property/unit, rule, protocol, sources, and unresolved UUID entry; fail any generic placeholder."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_uuid_policy
    applies_to: "Tiangong references"
    rule: "Allow only the verified reference product, Mass property, and unit-group UUIDs in this candidate. Require every other UUID cell to remain blank until exact hybrid search and direct public state100 read both verify the same semantic flow."
    source_ids: []
  - rule_id: validate_uuid_closure
    applies_to: "Manifest review metadata"
    rule: "Require every inventory card without a UUID, except the UUID-bearing reference output, to have exactly one matching unresolved entry by row_id; reject missing, duplicate, or stale entries."
    source_ids: []
  - rule_id: validate_amount_provenance
    applies_to: "Non-reference inventory quantities"
    rule: "Require foreground_record or calculated_value tied to a collection protocol and calculation rule where applicable; reject fabricated defaults, unsupported intervals, and undocumented estimates."
    source_ids:
      - fefac-pefcr-feed-data-2021
      - eu-pef-2021-2279
  - rule_id: validate_material_balance
    applies_to: "Each route"
    rule: "Require reconciled input, output, moisture, internal recycle, waste, emission, and inventory-change terms and a disclosed investigated residual."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_emission_separation
    applies_to: "Direct emissions"
    rule: "Require separate chemical cards for fossil CO2, biogenic CO2, fossil methane, nitrous oxide, carbon monoxide, nitric oxide, nitrogen dioxide, and sulfur dioxide when present; require non-overlapping particulate-size cards and separate COD, BOD5, TSS, total nitrogen, and total phosphorus loads."
    source_ids:
      - eu-fdm-bat-2019
      - eu-pef-2021-2279
  - rule_id: validate_data_quality
    applies_to: "Package evidence"
    rule: "Require calibration, product-specific composition, site activity data, source and factor identity, allocation records, route representativeness, quality assessment, and evidence available for review."
    source_ids:
      - eu-pef-2021-2279
      - fefac-pefcr-feed-data-2021
published_dataset_profile:
  dataset_role: "Candidate company-specific foreground production dataset that may become a secondary_dataset or background_dataset after methodology and data review"
  downstream_use: "Route-specific modelling of lucerne (alfalfa) meal or pellet supply at the producing facility gate"
  allowed_use: "Use only for the declared raw-material state, artificial-drying technology and fuel or no-drying route, grinding/screen configuration, meal or pellet form, conditioning and binder state, packaging, geography, site technology, and production period"
  excluded_use: "Mixed feed, pet food, other forage species, unprocessed hay, leaf-protein concentrate, bakery products, a different dryer or fuel mix, combined meal/pellet average, animal feeding or digestion, manure management, distribution, or packaging end-of-life without additional modelling"
  required_metadata: "PCR id and candidate status; exact reference UUID and unit support; CPC 23320; final form; raw-material state; drying technology and heat source; grinding and screen settings; pelleting and conditioning route; exact binder or none; moisture and grade; bulk or each packaging component; site and period; process inclusion; upstream dataset identities; allocation; unresolved UUIDs; exclusions"
  required_quality_disclosure: "Primary-data coverage; meter and scale calibration; sampling and analytical methods; route and technology representativeness; mass and water balances; internal recycle; direct emissions; wastewater; allocation; missing data; uncertainty; unresolved identities; source versions; verification status"
  update_trigger: "Change in received lucerne state or supplier mix, dryer technology or fuel, grinding/screen specification, pelleting/conditioning or binder, cooler/screen, packaging configuration, product moisture or grade, emission control, wastewater treatment, allocation, background datasets, reference UUID status, or representative period"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, *Central Product Classification (CPC) Version 3.0, structure and explanatory notes*, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Exact CPC 23320 identity and separation from CPC 2331 feed preparations and division 234 bakery products"
  - id: "us-epa-ap42-alfalfa-1996"
    type: "official_guidance"
    reference: "U.S. Environmental Protection Agency, *AP-42, Section 9.9.4: Alfalfa Dehydrating*, September 1996. https://www.epa.gov/sites/default/files/2020-10/documents/c9s09-4.pdf"
    used_for: "Alfalfa receipt state, direct-fired rotary drying, cyclone recovery, hammermilling, steam conditioning, pelleting, cooling, screening, storage, and particulate-source structure; no AP-42 example factor is adopted as a default amount"
  - id: "eu-jrc-fdm-bref-2019"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, *Best Available Techniques Reference Document for the Food, Drink and Milk Industries*, JRC118627, EUR 29978 EN, 2019, DOI 10.2760/243911. https://publications.jrc.ec.europa.eu/repository/handle/JRC118627"
    used_for: "FDM and animal-feed process scope, company operations, utility, cleaning, wastewater, waste-gas, monitoring, and environmental-management structure; no sector value is copied as a default"
  - id: "eu-fdm-bat-2019"
    type: "standard"
    reference: "Commission Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries. https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj"
    used_for: "Green-fodder predrying and heat recovery; grinding and pellet-cooling dust; energy, water, dry cleaning, treatment, COD, BOD, TSS, nitrogen, phosphorus, and monitoring structure; BAT levels are not PCR default quantities"
  - id: "fao-feed-milling"
    type: "handbook"
    reference: "Food and Agriculture Organization of the United Nations, *Feed Milling Processes*, Chapter 18, Section 4, pelleting, cooling, and screening. https://www.fao.org/4/x5738e/x5738e0j.htm"
    used_for: "Liquid-water or steam conditioning, die pelleting, cooler operation, screening, and pellet-fines return; example operating values are not adopted as defaults"
  - id: "fefac-pefcr-feed-data-2021"
    type: "official_guidance"
    reference: "European Feed Manufacturers’ Federation, *Key elements in data collection for PEFCR Feed*, 2021. https://fefac.eu/wp-content/uploads/2021/10/SR_Factsheet-key-elements-data-collection.pdf"
    used_for: "Exact feed-ingredient bill of materials and company primary data for manufacturing energy, water, packaging, origin, and downstream boundary"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279 on Environmental Footprint methods, consolidated English text. https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng"
    used_for: "Product-specific BoM, company-specific manufacturing data, complete inputs and outputs, allocation, reference-flow normalization, data quality, transparency, and verification"
