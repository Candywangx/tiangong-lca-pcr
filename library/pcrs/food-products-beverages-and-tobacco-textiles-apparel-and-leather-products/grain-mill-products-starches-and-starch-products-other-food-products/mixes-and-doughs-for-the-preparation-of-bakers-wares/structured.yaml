allocation_rules:
  - rule_id: al_avoid_allocation
    applies_to: "All multi-output or shared processes"
    rule: "Avoid allocation first through route-specific datasets, process subdivision, separate batch records, and sub-metering."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: al_no_route_average
    applies_to: "Facilities producing multiple product states"
    rule: "Never allocate by first averaging dry, ambient, chilled, and frozen routes. Establish separate route inventories before treating genuinely shared services."
    source_ids:
      - ghg-protocol-product-standard-2011
      - codex-cxc-8-1976
  - rule_id: al_rework
    applies_to: "Same-product rework"
    rule: "Return same-formulation rework to the originating route as an internal loop and disclose gross generation and returned mass; do not count returned mass as waste or a co-product."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: al_shared_service_physical
    applies_to: "Shared electricity, cleaning, storage, refrigeration, and utilities"
    rule: "If subdivision is unavailable, use a causal physical driver: metered operating time for equipment, cleaned surface or cleaning cycle for sanitation, tonne-day and temperature lift for storage, or delivered useful heat for thermal utilities."
    source_ids:
      - ghg-protocol-product-standard-2011
      - eu-emas-food-beverage-2017
  - rule_id: al_economic_fallback
    applies_to: "Residual shared burdens"
    rule: "Use economic allocation only when no defensible physical relationship exists; disclose prices, period, geography, volatility, and a physical-versus-economic sensitivity result."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: al_waste_and_saleable_output
    applies_to: "Residues and off-specification product"
    rule: "Treat an output with no economic value and a required treatment route as waste. If sold or used as a functionally valuable output, classify it as a co-product and apply the allocation hierarchy."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: al_recycling
    applies_to: "Packaging and other recyclable wastes"
    rule: "Report the selected recycling convention and keep collection, sorting, treatment, recycled-content credit, and any avoided-burden claim explicit; do not mix conventions within one dataset."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_route_formulation_release
      process_id: "ingredient_receiving_and_dosing"
      flow_role: "route and product identity"
      record_type: "production master and release record"
      raw_fields: "route_code; formulation_id; leavening_mode; make_up_state; moisture_or_water_mass_fraction; storage_temperature_setpoint; storage_duration; packaging_configuration; shelf_life; released_net_mass_kg"
      collection_method: "Approved product specification joined to released lots"
      unit: "kg; °C; h"
      frequency: "Each released lot"
      temporal_coverage: "Representative consecutive campaigns covering at least one year or the full available campaign period if shorter"
      site_scope: "Every included production site and line"
      aggregation_rule: "Keep routes and formulations separate; sum only released lots with identical required qualifiers"
      quality_evidence: "Approved formula; batch genealogy; release certificate; calibrated product scale; temperature record"
    - protocol_id: cp_ingredient_mass
      process_id: "ingredient_receiving_and_dosing"
      flow_role: "each named ingredient input"
      record_type: "weigh ticket and batch issue record"
      raw_fields: "ingredient_name; supplier_lot; formulation_id; issued_kg; returned_kg; reworked_kg; ingredient_moisture_fraction; batch_id"
      collection_method: "Calibrated weigh system reconciled to inventory issues and returns"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same lots and campaigns as product output"
      site_scope: "Every included dosing line"
      aggregation_rule: "net_ingredient_kg = issued_kg - returned_kg; normalize only within one formulation_id and route_code"
      quality_evidence: "Scale calibration; supplier lot; recipe approval; issue-return reconciliation"
    - protocol_id: cp_receiving_dosing_energy
      process_id: "ingredient_receiving_and_dosing"
      flow_role: "receiving and dosing electricity"
      record_type: "meter or equipment log"
      raw_fields: "meter_start_kwh; meter_end_kwh; equipment_kw; loaded_runtime_h; batch_id"
      collection_method: "Dedicated meter preferred; otherwise verified power × loaded runtime"
      unit: "kWh"
      frequency: "Each campaign or meter interval"
      temporal_coverage: "At least one representative year or full campaign period"
      site_scope: "Each included receiving and dosing system"
      aggregation_rule: "Subtract documented idle or unrelated use; divide by released net mass for the same route"
      quality_evidence: "Meter identifier and calibration; runtime log; reconciliation to facility bill"
    - protocol_id: cp_receiving_dosing_losses
      process_id: "ingredient_receiving_and_dosing"
      flow_role: "ingredient waste, incoming packaging waste, and dust"
      record_type: "waste ticket, mass balance, and emission record"
      raw_fields: "waste_name; treatment_route; gross_kg; reworked_kg; captured_dust_kg; released_dust_kg; batch_id"
      collection_method: "Weigh each waste stream; use monitored or site-approved dust calculation"
      unit: "kg"
      frequency: "Each batch or waste pickup"
      temporal_coverage: "Same campaigns as product output"
      site_scope: "Each included receiving and dosing system"
      aggregation_rule: "Keep paper, plastic, food waste, captured dust, and released dust separate"
      quality_evidence: "Waste scale calibration; treatment receipt; filter log; emission calculation"
    - protocol_id: cp_dry_blend_records
      process_id: "dry_sieving_and_blending"
      flow_role: "dry route mass, electricity, reject, and dust"
      record_type: "batch, meter, and waste record"
      raw_fields: "route_code; batch_input_kg; good_output_kg; reject_kg; rework_kg; meter_kwh; runtime_h; released_dust_kg"
      collection_method: "Calibrated mass records plus dedicated meter or verified power × runtime"
      unit: "kg; kWh"
      frequency: "Each dry batch"
      temporal_coverage: "Representative consecutive dry-route campaigns"
      site_scope: "Each dry line"
      aggregation_rule: "Normalize only dry_mix_ambient batches; reconcile input = good output + reject + dust + stock change"
      quality_evidence: "Scale and meter calibration; batch genealogy; dust-control log"
    - protocol_id: cp_dough_mixing_records
      process_id: "dough_mixing_and_kneading"
      flow_role: "wet route mass, electricity, and reject"
      record_type: "batch, mixer, and waste record"
      raw_fields: "route_code; batch_input_kg; good_output_kg; reject_kg; rework_kg; meter_kwh; mixer_kw; loaded_runtime_h"
      collection_method: "Calibrated mass records and dedicated meter or verified power × loaded runtime"
      unit: "kg; kWh"
      frequency: "Each wet batch"
      temporal_coverage: "Representative consecutive wet-route campaigns"
      site_scope: "Each mixer and wet line"
      aggregation_rule: "Keep ambient, chilled, and frozen route_code values separate; reconcile mass by batch"
      quality_evidence: "Scale and meter calibration; mixer log; batch genealogy"
    - protocol_id: cp_fermentation_makeup_records
      process_id: "fermentation_resting_and_makeup"
      flow_role: "included operations, energy, steam, mass, and direct fermentation releases"
      record_type: "process historian, batch, and emission record"
      raw_fields: "operation_codes; leavening_mode; input_kg; output_kg; reject_kg; rework_kg; meter_kwh; steam_kg; steam_enthalpy_mj_per_kg; fermentation_time_h; released_co2_kg; released_ethanol_kg"
      collection_method: "Record only performed operations; meter utilities and use site measurement or documented pre-oven balance for releases"
      unit: "kg; kWh; MJ; h"
      frequency: "Each batch or campaign"
      temporal_coverage: "Representative consecutive campaigns for each selected operation set"
      site_scope: "Each included fermentation and make-up line"
      aggregation_rule: "Aggregate only identical operation_codes and leavening_mode; no bakery-oven factor transfer"
      quality_evidence: "Historian export; utility meter; batch genealogy; emission-method record"
    - protocol_id: cp_cold_route_records
      process_id: "temperature_conditioning_and_cold_storage"
      flow_role: "conditioning, storage, refrigerant, temperature, and loss"
      record_type: "energy meter, temperature logger, refrigerant ledger, and stock record"
      raw_fields: "route_code; conditioning_method; input_kg; released_kg; reject_kg; conditioning_kwh; storage_kwh; storage_duration_h; product_temperature_c; refrigerant_name; opening_charge_kg; purchased_kg; recovered_kg; closing_charge_kg"
      collection_method: "Separate conditioning and storage meters where available; calibrated continuous temperature log; annual refrigerant mass balance by named chemical"
      unit: "kg; kWh; h; °C"
      frequency: "Each batch plus continuous temperature and annual refrigerant reconciliation"
      temporal_coverage: "At least one full seasonal year when the route operates year-round"
      site_scope: "Each cold system and route"
      aggregation_rule: "Keep chilled and frozen route_code values separate; allocate shared storage only by tonne-day adjusted for documented temperature lift"
      quality_evidence: "Meter and logger calibration; refrigerant invoices and recovery records; stock reconciliation; alarm log"
    - protocol_id: cp_packaging_records
      process_id: "packaging"
      flow_role: "each named packaging input, scrap, and electricity"
      record_type: "bill of materials, issue record, scale, and meter"
      raw_fields: "material_name; package_count; verified_mass_per_item_kg; issued_kg; returned_kg; scrap_kg; packed_net_product_kg; meter_kwh"
      collection_method: "Count × verified item mass or direct weighing; dedicated meter or verified power × runtime"
      unit: "kg; kWh"
      frequency: "Each packaging campaign"
      temporal_coverage: "Same released lots as reference product"
      site_scope: "Each packaging line and configuration"
      aggregation_rule: "Keep LDPE, PP, kraft paper, corrugated board, and stretch film separate; reconcile issued = packed + scrap + returned"
      quality_evidence: "Packaging specification; scale and meter calibration; issue-return reconciliation"
    - protocol_id: cp_ambient_storage_records
      process_id: "ambient_finished_storage"
      flow_role: "ambient storage energy, residence, release, and loss"
      record_type: "warehouse meter and stock movement"
      raw_fields: "route_code; lot_id; mass_in_kg; mass_out_kg; discarded_kg; meter_kwh; entry_time; release_time"
      collection_method: "Dedicated meter preferred; otherwise complete warehouse meter allocated by mass × residence time"
      unit: "kg; kWh; h"
      frequency: "Each stock movement and meter interval"
      temporal_coverage: "At least one representative year or full campaign period"
      site_scope: "Each ambient warehouse"
      aggregation_rule: "Include only dry_mix_ambient and wet_dough_ambient; reconcile stock change and losses"
      quality_evidence: "Meter calibration; warehouse stock ledger; release record"
    - protocol_id: cp_cleaning_records
      process_id: "cleaning_and_sanitation"
      flow_role: "cleaning electricity, water, heat, and each named chemical"
      record_type: "cleaning log, issue record, and utility meter"
      raw_fields: "cleaning_cycle_id; area_or_equipment; route_code; water_m3; electricity_kwh; hot_water_kg; inlet_temperature_c; outlet_temperature_c; steam_kg; sodium_hydroxide_solution_kg; nitric_acid_solution_kg; peracetic_acid_solution_kg; product_concentration"
      collection_method: "Meter utilities and weigh or reconcile each formulated chemical issue"
      unit: "m3; kWh; kg; °C"
      frequency: "Each cleaning cycle"
      temporal_coverage: "Representative production and changeover cycles over the reporting period"
      site_scope: "Every included line and shared sanitation system"
      aggregation_rule: "Assign direct cycles to route; allocate shared cycles by documented causal driver and reconcile to site totals"
      quality_evidence: "Cleaning schedule; meter calibration; chemical issue record; concentration certificate"
    - protocol_id: cp_effluent_records
      process_id: "cleaning_and_sanitation"
      flow_role: "wastewater, recovered solids, and direct pollutant loads"
      record_type: "flow meter, laboratory sample, and waste ticket"
      raw_fields: "discharge_destination; wastewater_m3; solids_kg; cod_mg_per_l; bod5_mg_per_l; tss_mg_per_l; total_n_mg_per_l; total_p_mg_per_l; sample_time; flow_period"
      collection_method: "Flow-proportional composite sampling and accredited or controlled laboratory method; weigh screened solids"
      unit: "m3; kg; mg/L"
      frequency: "Each discharge period with sampling frequency justified by variability"
      temporal_coverage: "Same reporting period as production"
      site_scope: "Every discharge point and treatment route in scope"
      aggregation_rule: "concentration_kg_per_m3 × matching discharge_m3; report direct releases only at the final onsite discharge point"
      quality_evidence: "Flow-meter calibration; chain of custody; method and detection limit; treatment receipt"
    - protocol_id: cp_thermal_utility_records
      process_id: "onsite_thermal_utility"
      flow_role: "each fuel, electricity, feedwater, useful heat, and blowdown"
      record_type: "fuel meter, utility meter, water meter, and operating log"
      raw_fields: "fuel_name; fuel_quantity; density_kg_per_l; ncv_mj_per_unit; electricity_kwh; feedwater_m3; steam_kg; steam_enthalpy_mj_per_kg; hot_water_kg; temperature_rise_c; blowdown_m3"
      collection_method: "Meter every carrier separately and calculate useful output from measured thermodynamic state"
      unit: "MJ; kWh; m3; kg; °C"
      frequency: "Each meter interval"
      temporal_coverage: "At least one representative year or complete campaign period"
      site_scope: "Each included boiler or heater"
      aggregation_rule: "No carrier averaging; reconcile fuel energy to useful heat, losses, and stock change"
      quality_evidence: "Meter calibration; fuel invoice; supplier NCV; steam or hot-water state record"
    - protocol_id: cp_combustion_emissions
      process_id: "onsite_thermal_utility"
      flow_role: "each combustion emission"
      record_type: "stack test, continuous monitor, or fuel-factor calculation"
      raw_fields: "fuel_name; fuel_energy_mj; pollutant_name; measured_concentration; exhaust_flow; emission_factor; factor_unit; factor_source"
      collection_method: "Prefer stack or continuous measurement; otherwise multiply separate fuel energy by a current disclosed fuel- and technology-specific factor"
      unit: "kg; MJ"
      frequency: "Each test or factor interval"
      temporal_coverage: "Same period as fuel inventory"
      site_scope: "Each combustion unit"
      aggregation_rule: "Calculate each substance and fuel separately; aggregate only after calculation"
      quality_evidence: "Test report or monitor QA; factor citation; fuel-energy reconciliation"
  calculation_rules:
    - id: calc_net_ingredient_mass
      applies_to: "Each ingredient"
      rule: "net_ingredient_kg = issued_kg - returned_kg; same-product rework is disclosed separately and not subtracted from virgin ingredient identity"
      inputs:
        - issued_kg
        - returned_kg
        - reworked_kg
        - released_net_mass_kg
      output: "kg ingredient per 1,000 kg released product"
      source_ids:
        - ghg-protocol-product-standard-2011
    - id: calc_process_energy
      applies_to: "Each electricity row"
      rule: "normalized_kwh = attributable_meter_kwh × 1000 / released_or_process_output_kg"
      inputs:
        - meter_start_kwh
        - meter_end_kwh
        - attributable_fraction
        - output_kg
      output: "kWh per 1,000 kg output"
      source_ids:
        - eu-emas-food-beverage-2017
    - id: calc_storage_energy
      applies_to: "Shared ambient or cold storage"
      rule: "allocated_kwh = complete_storage_kwh × product_tonne_days / sum_all_product_tonne_days; apply a documented temperature-lift refinement when products use materially different setpoints"
      inputs:
        - complete_storage_kwh
        - product_mass_t
        - residence_days
        - storage_setpoint_c
      output: "kWh per 1,000 kg released product"
      source_ids:
        - eu-emas-food-beverage-2017
        - ghg-protocol-product-standard-2011
    - id: calc_refrigerant_loss
      applies_to: "Each named refrigerant"
      rule: "loss_kg = opening_charge_kg + purchased_kg - closing_charge_kg - recovered_kg - documented_transfer_kg; negative or unreconciled results are invalid"
      inputs:
        - opening_charge_kg
        - purchased_kg
        - closing_charge_kg
        - recovered_kg
        - documented_transfer_kg
      output: "kg named refrigerant to air before causal allocation"
      source_ids:
        - eu-emas-food-beverage-2017
        - codex-cxc-8-1976
    - id: calc_packaging_mass
      applies_to: "Each packaging material"
      rule: "packaging_to_product_kg = issued_kg - returned_kg - scrap_kg; reconcile with package_count × verified_mass_per_item_kg"
      inputs:
        - issued_kg
        - returned_kg
        - scrap_kg
        - package_count
        - verified_mass_per_item_kg
      output: "kg named packaging per 1,000 kg net product"
      source_ids:
        - eu-emas-food-beverage-2017
    - id: calc_cleaning_heat
      applies_to: "Hot water and steam"
      rule: "hot_water_mj = water_kg × 4.186 kJ_per_kg_K × temperature_rise_K / 1000; steam_mj = steam_kg × measured_enthalpy_difference_mj_per_kg"
      inputs:
        - water_kg
        - temperature_rise_K
        - steam_kg
        - measured_enthalpy_difference_mj_per_kg
      output: "MJ useful cleaning heat"
      source_ids:
        - eu-fdm-bref-2019
    - id: calc_fuel_energy
      applies_to: "Natural gas, LPG, and diesel"
      rule: "fuel_energy_mj = metered_quantity × documented_density_if_needed × supplier_or_site_ncv"
      inputs:
        - fuel_quantity
        - density
        - ncv
      output: "MJ per named fuel"
      source_ids: []
    - id: calc_combustion_emission
      applies_to: "Each fuel and pollutant"
      rule: "pollutant_kg = fuel_energy_mj × disclosed_emission_factor_kg_per_mj; do not calculate until factor source, fuel, technology, and oxidation basis are declared"
      inputs:
        - fuel_energy_mj
        - emission_factor_kg_per_mj
      output: "kg individual pollutant"
      source_ids: []
    - id: calc_effluent_load
      applies_to: "Each direct water pollutant"
      rule: "pollutant_kg = flow_weighted_concentration_mg_per_l × matching_discharge_m3 / 1000"
      inputs:
        - concentration_mg_per_l
        - discharge_m3
      output: "kg individual pollutant to water"
      source_ids:
        - eu-fdm-bref-2019
    - id: calc_mass_balance
      applies_to: "Each process and whole foreground system"
      rule: "mass_balance_gap_kg = total_mass_inputs_kg - total_mass_outputs_kg - measured_direct_mass_emissions_kg - stock_change_kg; report gap and investigate against the route-specific threshold"
      inputs:
        - "all mass inputs"
        - "all product and waste outputs"
        - "direct mass emissions"
        - "stock change"
      output: "kg and percent mass-balance gap"
      source_ids:
        - ghg-protocol-product-standard-2011
  data_quality_requirements:
    - id: dq_route_identity
      applies_to: "Dataset identity"
      requirement: "Declare exactly one route_code and one formulation_id and retain lot genealogy from ingredient issue through released product."
      evidence: "Approved specification, batch genealogy, and release records"
    - id: dq_temporal
      applies_to: "Foreground measurements"
      requirement: "Use temporally matched inputs and outputs; normally cover at least one representative year, or disclose shorter campaigns, seasonality, shutdowns, and start-up losses."
      evidence: "Dated meter, batch, stock, and waste records"
    - id: dq_technology_geography
      applies_to: "Foreground and upstream data"
      requirement: "Describe actual mixer, conditioner, cold system, packaging line, thermal utility, site, and geography; assess upstream datasets for technological, temporal, and geographic representativeness."
      evidence: "Equipment register, site metadata, supplier and dataset metadata"
    - id: dq_completeness
      applies_to: "Atomic flow inventory"
      requirement: "Reconcile material, energy, refrigerant, water, packaging, waste, and emission records. Any actual ingredient, fuel, refrigerant, cleaning chemical, packaging material, waste, or emitted substance missing from the listed cards shall be added as its own named atomic row before publication."
      evidence: "Reconciliation worksheet and completeness sign-off"
    - id: dq_meter_quality
      applies_to: "Measurements"
      requirement: "Retain meter identity, calibration or verification status, resolution, missing-data handling, and the fraction of output covered."
      evidence: "Calibration certificates, meter register, and missing-data log"
    - id: dq_cold_chain
      applies_to: "Chilled and frozen routes"
      requirement: "Retain product and storage temperature time series, conditioning endpoint, storage duration, alarm excursions, and instrument checks. For quick-frozen product, document thermal-centre completion at -18 °C or colder and subsequent -18 °C cold-chain control."
      evidence: "Calibrated logger records and release review; codex-cxc-8-1976"
    - id: dq_refrigerant
      applies_to: "Cold systems"
      requirement: "Reconcile opening charge, purchases, additions, recovery, transfer, and closing charge for each named refrigerant; disclose unreconciled difference and allocation."
      evidence: "Refrigerant ledger, invoices, service and recovery records"
    - id: dq_reasoned_estimates
      applies_to: "Provisional ranges"
      requirement: "Every reasoned_estimate range is a broad authoring QA or sensitivity prior, not a default foreground value. Test the lower and upper bounds when the flow is material and replace the range with reviewed route/site evidence before it becomes publication-critical."
      evidence: "Sensitivity result and review disposition"
    - id: dq_tiangong_comment_defect
      applies_to: "Reference-flow identity"
      requirement: "The reference flow UUID, name, CPC 23180 classification, Product flow type, and Mass reference are consistent, but its generalComment says CPC 232. Disclose this defect and never use the comment as methodology or scope evidence."
      evidence: "Tiangong identity fields for UUID 0252f353-8398-4eab-9e26-6a13e4b4f06b"
    - id: dq_source_limits
      applies_to: "External evidence"
      requirement: "EPA bakery material is limited to mainly yeast-leavened bread operations and predates current equipment; use it only for ingredient and unit-operation candidates. Codex quick-frozen rules apply only to declared quick-frozen product. EU food-sector sources are environmental guidance, not product-specific amount defaults."
      evidence: "Source applicability matrix and reviewer sign-off"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "Require UUID 0252f353-8398-4eab-9e26-6a13e4b4f06b, exact product name, CPC 23180 classification leaf, Product flow type, and Mass property; flag the CPC 232 generalComment defect without using it as evidence."
    source_ids: []
  - rule_id: val_route_exclusive
    applies_to: "Dataset route"
    rule: "Fail if route_code is missing, outside the four allowed values, or if records from more than one route_code are averaged."
    source_ids:
      - un-cpc-v3-explanatory-notes-2025
  - rule_id: val_process_gates
    applies_to: "Process map"
    rule: "Require every process whose condition is true and reject dry blending on wet routes, wet mixing on dry routes, cold conditioning on ambient routes, or fermentation where the operation is not performed."
    source_ids:
      - us-epa-bakery-oven-act-1992
      - codex-cxc-8-1976
  - rule_id: val_atomic_inputs
    applies_to: "Product inputs"
    rule: "Fail any aggregate materials, ingredients, chemicals, cleaning agents, packaging, energy carriers, fuels, thermal energy, or refrigerants row; require one named flow per actual substance or product."
    source_ids:
      - eu-emas-food-beverage-2017
      - eu-fdm-bref-2019
  - rule_id: val_atomic_outputs
    applies_to: "Waste and elementary outputs"
    rule: "Fail any aggregate wastes or emissions row; require separate treatment flows and separate substances for air and water releases."
    source_ids:
      - eu-fdm-bref-2019
  - rule_id: val_uuid_scope
    applies_to: "UUID-bearing inventory"
    rule: "Permit the verified UUIDs only on the reference product and its Mass reference property; all other flow UUIDs remain blank until individually mapped by the foreground author."
    source_ids: []
  - rule_id: val_mass_balance
    applies_to: "Each process and whole system"
    rule: "Require a reported mass-balance gap and investigation of unexplained differences; never close the balance with an unnamed other material, waste, or emission."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: val_cold_records
    applies_to: "Chilled and frozen routes"
    rule: "Require conditioning method, product temperature, storage setpoint, duration, electricity, named refrigerant reconciliation, and product loss."
    source_ids:
      - codex-cxc-8-1976
      - eu-emas-food-beverage-2017
  - rule_id: val_quick_frozen_claim
    applies_to: "Quick-frozen product"
    rule: "When freezing_claim = quick_frozen, require evidence that the thermal centre reached -18 °C or colder after stabilization and that subsequent storage was maintained at -18 °C or colder, subject to declared permitted tolerances."
    source_ids:
      - codex-cxc-8-1976
  - rule_id: val_energy_carriers
    applies_to: "Thermal utility"
    rule: "Fail combined fuel or thermal-energy inputs; natural gas, LPG, diesel, purchased steam, and purchased hot water shall remain separate and reconcile to useful heat."
    source_ids:
      - eu-emas-food-beverage-2017
      - eu-fdm-bref-2019
  - rule_id: val_refrigerants
    applies_to: "Cold systems"
    rule: "Fail generic refrigerant entries or combined refrigerant losses; require actual chemical identity and a non-negative reconciled mass balance."
    source_ids:
      - eu-emas-food-beverage-2017
      - codex-cxc-8-1976
  - rule_id: val_effluent_double_count
    applies_to: "Wastewater and water emissions"
    rule: "If wastewater is sent to external treatment, do not also report treatment-plant releases as direct site emissions; if discharge is onsite final, require measured individual loads and discharge destination."
    source_ids:
      - eu-fdm-bref-2019
  - rule_id: val_allocation
    applies_to: "Shared processes"
    rule: "Require documented subdivision attempt, causal driver, unallocated total, allocated total, and reconciliation; require sensitivity when economic allocation is used."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: val_reasoned_estimates
    applies_to: "Amount ranges"
    rule: "Prohibit a reasoned_estimate from silently becoming the foreground amount. Require collection protocol values and disclose any sensitivity use of provisional bounds."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: val_source_applicability
    applies_to: "Method evidence"
    rule: "Reject bakery-oven emission factors for this unbaked product boundary and reject the erroneous Tiangong generalComment as a source."
    source_ids:
      - us-epa-bakery-oven-act-1992
  - rule_id: val_bilingual_machine_semantics
    applies_to: "Bilingual PCR"
    rule: "Require identical ordered process_id, row_id, rule_id, protocol_id, controlled tokens, formulas, numerical values, UUIDs, source_ids, and source URLs across en-US and zh-CN."
    source_ids: []
published_dataset_profile:
  dataset_role: "Route- and formulation-specific foreground production dataset for unbaked bakery mixes, doughs, or batters"
  downstream_use: "secondary_dataset; background_dataset after methodology, translation, identity, and data-quality review"
  allowed_use: "Upstream modelling of a declared unbaked mix or dough route when all required qualifiers, storage state, geography, time period, and upstream links are compatible"
  excluded_use: "Proxy for baked or part-baked products; cross-route average; substitute for another formulation without sensitivity review; claim about consumer baking; use of the erroneous CPC 232 generalComment as evidence"
  required_metadata: "pcr_id; route_code; formulation_id; leavening_mode; make_up_state; moisture_or_water_mass_fraction; net_mass_basis; site; geography; campaign_period; conditioning_method; storage_temperature_setpoint; storage_duration; packaging_configuration; shelf_life; allocation_method; cut_offs; rework; upstream_dataset_refs"
  required_quality_disclosure: "Coverage and calibration of meters; mass-balance gap; data representativeness; source applicability; named refrigerant reconciliation; wastewater destination; provisional reasoned estimates and sensitivity; Tiangong generalComment defect; unresolved unit-group UUID"
  update_trigger: "Formula, supplier, route, mixer, conditioner, refrigerant, storage temperature or duration, packaging, utility, waste treatment, allocation, regulation, reference-flow identity, or material production-volume change"
