system_boundary:
  rules:
    - rule_id: sb_route_lock
      applies_to: "All foreground datasets"
      rule: "Select exactly one route_code and one formulation_id. Do not average dry mix, ambient wet dough, chilled wet dough, or frozen wet dough, and do not combine different leavening or preservation routes."
      source_ids:
        - un-cpc-v3-explanatory-notes-2025
    - rule_id: sb_included_operations
      applies_to: "Selected route"
      rule: "Include every listed process whose gate is satisfied, from ingredient receipt through factory-gate storage, together with directly attributable sanitation, refrigerant loss, wastewater, waste, and onsite utility burdens."
      source_ids:
        - us-epa-bakery-oven-act-1992
        - eu-emas-food-beverage-2017
        - eu-fdm-bref-2019
    - rule_id: sb_upstream_links
      applies_to: "Purchased inputs"
      rule: "Keep upstream production and inbound transport outside the foreground process but link representative datasets; disclose any missing upstream coverage."
      source_ids:
        - ghg-protocol-product-standard-2011
    - rule_id: sb_excluded_downstream
      applies_to: "Downstream preparation"
      rule: "Exclude proofing, thawing, baking, retail storage, consumption, and end-of-life after the declared factory gate unless the dataset explicitly expands its boundary; never import finished-bakery-product oven burdens into this product route."
      source_ids:
        - un-cpc-v3-explanatory-notes-2025
        - us-epa-bakery-oven-act-1992
    - rule_id: sb_cold_route
      applies_to: "wet_dough_chilled and wet_dough_frozen"
      rule: "Include actual conditioning and cold-storage electricity, temperature records, refrigerant additions and releases, cold losses, and storage duration. Apply the Codex quick-frozen temperature rules only when the product is declared quick frozen."
      source_ids:
        - codex-cxc-8-1976
        - eu-emas-food-beverage-2017
    - rule_id: sb_shared_services
      applies_to: "Shared utility, cleaning, warehouse, and refrigeration systems"
      rule: "Prefer process subdivision and sub-metering. If shared services remain, allocate by a documented causal driver and retain the unallocated facility total and reconciliation."
      source_ids:
        - ghg-protocol-product-standard-2011
    - rule_id: sb_direct_emissions
      applies_to: "Site emissions"
      rule: "Include separate elementary flows for each direct emission actually occurring; do not hide combustion, refrigerant, dust, fermentation, or direct-water releases inside generic emissions cards."
      source_ids:
        - eu-emas-food-beverage-2017
        - eu-fdm-bref-2019
