system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate
      applies_to: "foreground manufacturing"
      rule: "Include all on-site operations from receipt of the declared feedstocks through route-specific conversion, purification, concentration, crystallisation or drying, blending or caramelisation, packaging, storage, and loading that are performed for the reference product."
      source_ids:
        - eu-jrc-fdm-bref-2019
        - us-epa-ap42-9-9-7-1995
    - rule_id: boundary_route_selection
      applies_to: "route-specific operations"
      rule: "Include only applicable unit operations, but require an explicit route declaration and include at least one product-making or product-finishing operation beyond simple administrative receipt."
      source_ids:
        - eu-jrc-fdm-bref-2019
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased product and energy inputs"
      rule: "Keep upstream production outside the foreground boundary and link each purchased material, energy carrier, packaging material, and service to an upstream dataset; integrated on-site production must instead be modelled in the foreground and disclosed."
      source_ids: []
    - rule_id: boundary_direct_releases
      applies_to: "direct emissions and wastes"
      rule: "Include measured direct releases to air and water, solid and liquid wastes, spent purification media, wastewater treatment, recovered energy, and off-site treatment routes attributable to the foreground system."
      source_ids:
        - eu-jrc-fdm-bref-2019
        - eu-fdm-bat-2019-2031
    - rule_id: boundary_downstream_exclusion
      applies_to: "downstream life cycle"
      rule: "Exclude distribution beyond the declared gate, product use, incorporation into food or other products, and end-of-life unless the study explicitly extends the boundary and reports the extension separately."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "receipt at the reporting facility of the declared carbohydrate feedstock, intermediate sugar stream, and other purchased materials"
  starting_condition_role: "foreground gate-in condition for route-specific sugar manufacture or finishing"
  product_classification_scope: "CPC 3.0 subclass 23210, independent of the representative Dextrose Monohydrate form"
  recursive_input_rule: "a purchased input that is itself a CPC 23210 sugar or syrup is recorded as an upstream product input with its own supplier dataset and is not recursively re-manufactured inside this foreground package"
  upstream_dataset_requirement: "every purchased feedstock, energy carrier, process chemical, purification medium, packaging material, and outsourced treatment service requires a geographically and technologically appropriate upstream dataset or an explicit unresolved-data disclosure"
  disclosure: "declare actual product subtype and form, feedstock family, route operations, integrated upstream operations, excluded or outsourced operations, recycled streams, co-products, wastewater destination, packaging state, geography, reporting period, and allocation method"
