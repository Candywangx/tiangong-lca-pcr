allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "multifunctional foreground operations"
    rule: "First avoid allocation by subdividing separately metered operations or expanding the system only when the substituted function and data are explicitly justified."
    source_ids:
      - eu-pef-recommendation-2021-2279
      - iso-14044-2006
  - rule_id: allocation_physical
    applies_to: "inseparable joint production"
    rule: "When subdivision or justified system expansion is not possible, use a documented physical relationship that reflects how measured inputs and outputs change with the co-products; do not select mass allocation solely because mass data are available."
    source_ids:
      - eu-pef-recommendation-2021-2279
      - iso-14044-2006
  - rule_id: allocation_economic_last_resort
    applies_to: "co-products without defensible physical relationship"
    rule: "Use reporting-period economic allocation only as a last resort; record product and co-product quantities, prices, currency, price period, source records, and sensitivity to material price changes."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_waste_status
    applies_to: "residues, recovered streams, and wastes"
    rule: "Classify an output as product, co-product, or waste from its documented destination, specification, and economic or functional use; do not assign zero burden or credit by label alone."
    source_ids: []
  - rule_id: allocation_internal_recycling
    applies_to: "internally recycled water, syrup, mother liquor, heat, and treatment outputs"
    rule: "Represent internal recycling as an internal transfer and count only make-up inputs, losses, exported outputs, and treatment burdens so the same quantity is not counted twice."
    source_ids:
      - eu-jrc-fdm-bref-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_feedstock_receipts
      process_id: "feedstock_preparation"
      flow_role: "declared carbohydrate feedstock"
      record_type: "receipt, scale, and supplier quality record"
      raw_fields: "material identity; supplier; lot; gross, tare, and net mass; total solids or moisture; composition; return quantity"
      collection_method: "weighbridge or calibrated scale plus supplier certificate and receiving test"
      unit: "kg as supplied; kg dry matter"
      frequency: "each lot"
      temporal_coverage: "complete reporting period"
      site_scope: "all included receiving points"
      aggregation_rule: "sum accepted net receipts by material and normalize to conforming output"
      quality_evidence: "calibration, ticket, certificate, and rejection record"
    - protocol_id: cp_process_water
      process_id: "feedstock_preparation"
      flow_role: "preparation and process water"
      record_type: "meter and batch record"
      raw_fields: "meter id; opening and closing readings; batch additions; recycled-water transfer; purpose"
      collection_method: "calibrated meter or calibrated vessel addition"
      unit: "m3 or kg"
      frequency: "continuous or each batch"
      temporal_coverage: "complete reporting period"
      site_scope: "all included processes"
      aggregation_rule: "external make-up water minus measured returns; report internal reuse separately"
      quality_evidence: "meter calibration, balance check, and missing-data log"
    - protocol_id: cp_intermediate_streams
      process_id: "feedstock_preparation_route_specific_conversion_product_finishing"
      flow_role: "internal carbohydrate streams"
      record_type: "tank, flow-meter, and laboratory record"
      raw_fields: "stream identity; source and destination; mass or volume; density; temperature; total solids; composition"
      collection_method: "calibrated mass or volume measurement with matched sample"
      unit: "kg; m3; mass fraction"
      frequency: "each transfer or batch"
      temporal_coverage: "complete reporting period"
      site_scope: "all included process transfers"
      aggregation_rule: "convert to mass with matched density, retain as-supplied and dry-matter bases, and reconcile by batch"
      quality_evidence: "instrument calibration, sample id, laboratory method, and mass-balance reconciliation"
    - protocol_id: cp_processing_materials
      process_id: "route_specific_conversion_product_finishing"
      flow_role: "conversion, purification, finishing, and packaging materials"
      record_type: "stock issue, batch sheet, and purchase record"
      raw_fields: "material identity; lot; issued quantity; returned quantity; concentration; unit; purpose"
      collection_method: "controlled stores issue or metered dosing"
      unit: "kg, L, or purchase unit"
      frequency: "each batch or issue"
      temporal_coverage: "complete reporting period"
      site_scope: "all included processes"
      aggregation_rule: "issued minus returned quantity, converted with measured concentration or density where needed"
      quality_evidence: "stock reconciliation, dosing calibration, and purchase specification"
    - protocol_id: cp_energy_records
      process_id: "route_specific_conversion_product_finishing"
      flow_role: "electricity, steam, heat, and fuel"
      record_type: "meter, invoice, and equipment-run record"
      raw_fields: "carrier; meter id; readings; fuel quantity; steam condition; allocation driver; conversion factor"
      collection_method: "submeter preferred; otherwise documented engineering allocation"
      unit: "kWh, MJ, kg, Nm3, or invoice unit"
      frequency: "continuous, monthly, or each batch"
      temporal_coverage: "complete reporting period"
      site_scope: "all included processes and shared utilities"
      aggregation_rule: "subtract exports, preserve carrier-specific totals, and allocate shared utilities with recorded driver"
      quality_evidence: "meter calibration, invoice reconciliation, and conversion sheet"
    - protocol_id: cp_final_product_records
      process_id: "product_finishing"
      flow_role: "declared reference product"
      record_type: "production, packing, warehouse, and quality record"
      raw_fields: "actual product subtype; flow UUID used; batch; gross, tare, and net mass; total solids or moisture; composition; packaging; release status"
      collection_method: "calibrated scale or mass flow meter plus release test"
      unit: "kg as supplied; kg dry matter"
      frequency: "each batch and shipment"
      temporal_coverage: "complete reporting period"
      site_scope: "all included product lines"
      aggregation_rule: "accepted net output adjusted for stock change and returns; normalize inventory to 1 kg"
      quality_evidence: "calibration, batch release, warehouse reconciliation, and product specification"
    - protocol_id: cp_waste_and_coproducts
      process_id: "feedstock_preparation_product_finishing"
      flow_role: "rejects, co-products, and wastes"
      record_type: "scale, container, manifest, and dispatch record"
      raw_fields: "material identity; product/waste status; mass; moisture; destination; treatment; revenue where allocation needs it"
      collection_method: "calibrated scale or service-provider record"
      unit: "kg wet; kg dry matter"
      frequency: "each removal or shipment"
      temporal_coverage: "complete reporting period"
      site_scope: "all included processes"
      aggregation_rule: "sum by identity and destination; keep products and wastes separate"
      quality_evidence: "scale record, manifest, destination evidence, and stock reconciliation"
    - protocol_id: cp_wastewater_records
      process_id: "route_specific_conversion_product_finishing_onsite_wastewater_treatment"
      flow_role: "wastewater generation and transfer"
      record_type: "meter, tank, and routing record"
      raw_fields: "source process; destination; volume; density where used; reused volume; transfer time"
      collection_method: "calibrated flow meter or balanced tank measurement"
      unit: "m3 or kg"
      frequency: "continuous or each transfer"
      temporal_coverage: "complete reporting period"
      site_scope: "all included drains and transfer points"
      aggregation_rule: "sum net external discharge or treatment transfer; exclude internal reuse from external input and output totals"
      quality_evidence: "meter calibration, water balance, routing diagram, and missing-data log"
    - protocol_id: cp_direct_emissions
      process_id: "product_finishing"
      flow_role: "direct air emissions"
      record_type: "stack test, continuous monitor, permit, and activity record"
      raw_fields: "source; pollutant; concentration; flow; duration; activity; factor and factor source if calculated"
      collection_method: "compliant monitoring or source-specific calculation"
      unit: "kg pollutant"
      frequency: "monitoring event and operating period"
      temporal_coverage: "representative operation within reporting period"
      site_scope: "all included direct sources"
      aggregation_rule: "calculate matched-period mass by source and sum without replacing non-detects by unsupported zeroes"
      quality_evidence: "laboratory report, calibration, operating log, and calculation file"
    - protocol_id: cp_wastewater_treatment
      process_id: "onsite_wastewater_treatment"
      flow_role: "treatment inputs, residues, and recovered outputs"
      record_type: "meter, stock, laboratory, and removal record"
      raw_fields: "input identity; quantity; treated volume; sludge mass and solids; recovered gas or water; destination"
      collection_method: "treatment-system meters, calibrated scale, and laboratory test"
      unit: "input-specific; m3; kg; MJ"
      frequency: "continuous, each batch, or each removal"
      temporal_coverage: "complete reporting period"
      site_scope: "on-site treatment system"
      aggregation_rule: "allocate treatment totals to measured wastewater source loads and reconcile outputs"
      quality_evidence: "meter calibration, treatment log, laboratory result, and destination record"
    - protocol_id: cp_effluent_monitoring
      process_id: "onsite_wastewater_treatment"
      flow_role: "treated discharge and pollutant loads"
      record_type: "discharge meter and laboratory record"
      raw_fields: "discharge volume; sample time; pollutant; concentration; receiving compartment; detection limit"
      collection_method: "calibrated discharge meter and representative compliant sampling"
      unit: "m3; mg/L; kg"
      frequency: "permit or operational monitoring frequency"
      temporal_coverage: "complete reporting period"
      site_scope: "every included discharge point"
      aggregation_rule: "match volume and concentration periods and calculate pollutant mass load"
      quality_evidence: "chain of custody, accredited laboratory result, meter calibration, and permit record"
  calculation_rules:
    - id: normalize_to_reference_product
      applies_to: "all foreground amounts"
      rule: "normalized amount = reporting-period amount / reporting-period conforming net product kg"
      inputs:
        - "collected input or output amount"
        - "cp_final_product_records conforming net output"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: convert_to_dry_matter
      applies_to: "feedstock, intermediate, product, and co-product records"
      rule: "dry mass = as-supplied mass multiplied by measured total-solids mass fraction; retain the unconverted record and test basis"
      inputs:
        - "as-supplied mass"
        - "matched total-solids or moisture result"
      output: "kg dry matter and conversion trace"
      source_ids:
        - codex-cxs-212-1999
    - id: liquid_volume_to_mass
      applies_to: "liquid product and input records"
      rule: "mass = measured volume multiplied by density measured or specified for the same composition and temperature"
      inputs:
        - volume
        - density
        - temperature
        - composition
      output: "kg as supplied"
      source_ids: []
    - id: effluent_pollutant_load
      applies_to: "direct water emissions"
      rule: "pollutant load = matched-period discharge volume multiplied by measured concentration with explicit unit conversion"
      inputs:
        - "cp_effluent_monitoring volume and concentration"
      output: "kg pollutant per 1 kg reference product"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: foreground_mass_balance
      applies_to: "each process and reporting period"
      rule: "reconcile measured mass inputs, product and co-product outputs, wastes, water transfers, stock changes, and documented losses on consistent wet and dry bases; investigate material unexplained imbalance"
      inputs:
        - "all material collection protocols"
      output: "signed process and facility mass-balance reconciliation"
      source_ids: []
    - id: economic_allocation_share
      applies_to: "economic allocation when approved"
      rule: "allocation share = reference product revenue / total revenue of jointly produced products for the same reporting period and market basis"
      inputs:
        - "co-product quantities"
        - prices
        - currency
        - "price period"
      output: "disclosed allocation factor and sensitivity"
      source_ids:
        - eu-pef-recommendation-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "The record must state actual product subtype, form, specification, total-solids or moisture basis, route, packaging state, and selected Tiangong flow UUID; any use of the representative UUID must demonstrate a Dextrose Monohydrate match."
      evidence: "batch release, specification, flow readback, and codex-cxs-212-1999 where applicable"
    - id: dq_temporal_coverage
      applies_to: "all foreground records"
      requirement: "Cover a complete and representative reporting period, identify shutdowns and atypical campaigns, and quantify any extrapolation or missing interval."
      evidence: "meter and production completeness reconciliation"
    - id: dq_measurement
      applies_to: "measured quantities"
      requirement: "Use calibrated meters or scales and retain original units, conversions, calibration status, and uncertainty or instrument resolution."
      evidence: "calibration certificates and calculation records"
    - id: dq_material_balance
      applies_to: "material flows"
      requirement: "Reconcile wet and dry mass by process and facility; investigate and disclose material unexplained imbalance instead of forcing closure."
      evidence: "signed mass-balance worksheet"
    - id: dq_energy_separation
      applies_to: "energy inputs"
      requirement: "Report electricity, purchased heat or steam, and each fuel separately; disclose shared-utility allocation and conversion efficiency."
      evidence: "meters, invoices, and allocation worksheet"
    - id: dq_water_and_wastewater
      applies_to: "water and wastewater"
      requirement: "Distinguish external water input, internal reuse, wastewater transfer, off-site treatment, and direct discharge; match monitored pollutant loads to the correct volume and period."
      evidence: "water balance, routing diagram, and monitoring records"
    - id: dq_allocation
      applies_to: "multifunctional operations"
      requirement: "Retain the hierarchy decision, allocation driver, co-product classification, source records, factor calculation, and sensitivity when economic data are used."
      evidence: "allocation worksheet and approval record"
    - id: dq_source_currency
      applies_to: "external rules and specifications"
      requirement: "Verify that the applicable product specification, regulation, permit, and monitoring method are current for the facility and market at dataset release."
      evidence: "dated source review and release checklist"
validation_rules:
  - rule_id: validate_category_scope
    applies_to: "product identity"
    rule: "Confirm that the declared product is within the full CPC 3.0 subclass 23210 scope and is not an excluded starch, sucrose, natural honey, formulated food, beverage, or pharmaceutical dosage form."
    source_ids:
      - un-cpc-v3-2025
  - rule_id: validate_representative_flow_use
    applies_to: "reference product flow"
    rule: "Accept 8f56ee97-f5f8-4685-a958-74f586b40cd9 only for actual Dextrose Monohydrate; for every other form require a more specific verified flow or an explicit unresolved identity finding, never silent representative-flow reuse."
    source_ids:
      - codex-cxs-212-1999
  - rule_id: validate_reference_support_chain
    applies_to: "reference measurement"
    rule: "Confirm the Product flow reference uses Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg without dataset-version suffixes."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "dataset metadata"
    rule: "Reject conformance when actual product subtype, form, net-mass basis, solids or moisture, applicable composition descriptor, feedstock, route, geography, packaging, and allocation method are missing."
    source_ids:
      - codex-cxs-212-1999
  - rule_id: validate_route_coverage
    applies_to: "process map"
    rule: "Confirm that the process map records the actual product-making route and includes all applicable conversion and finishing operations, plus on-site wastewater treatment when performed."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - us-epa-ap42-9-9-7-1995
  - rule_id: validate_foreground_coverage
    applies_to: "foreground inventory"
    rule: "Require collected or calculated values for feedstocks, water, processing materials, electricity, thermal energy or fuel, conforming product, co-products, wastes, wastewater, and direct emissions when those flows occur; an absent source must be documented as not applicable rather than entered as unsupported zero."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - eu-fdm-bat-2019-2031
  - rule_id: validate_mass_and_dry_basis
    applies_to: "mass balance"
    rule: "Confirm that as-supplied and dry-matter quantities use matched batch or period solids data and that mass-balance discrepancies are investigated and disclosed."
    source_ids:
      - codex-cxs-212-1999
  - rule_id: validate_allocation
    applies_to: "multifunctionality"
    rule: "Confirm that subdivision or justified system expansion was considered first and that any physical or economic allocation is reproducible from retained records and sensitivity evidence."
    source_ids:
      - eu-pef-recommendation-2021-2279
      - iso-14044-2006
  - rule_id: validate_data_currency
    applies_to: "dataset release"
    rule: "Confirm source review, flow identity, technology, product specification, permit conditions, and foreground records remain representative at release; otherwise update or disclose the limitation."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process foreground data package for a declared CPC 23210 sugar or sugar-syrup product"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "downstream process or lifecyclemodel work only when product subtype, physical form, solids or moisture basis, feedstock, route, geography, packaging state, and facility gate match the intended use or are explicitly adjusted"
  excluded_use: "silent substitution among glucose, fructose, lactose, invert sugar, artificial honey, caramel, liquid syrup, dried syrup, anhydrous crystal, and monohydrate forms; use as a generic sugar-market dataset without representativeness review; product-comparative claims without additional review"
  required_metadata: "canonical PCR id; CPC reference; actual product subtype; physical form; selected product-flow UUID; reference mass basis; total solids or moisture; applicable composition descriptor; feedstock; route; facility and geography; reporting period; technology; packaging; boundary; allocation method; upstream datasets"
  required_quality_disclosure: "foreground record coverage; missing-data treatment; meter and scale quality; mass and water balances; wet-to-dry conversions; direct-emission and wastewater monitoring; co-product classification; allocation factors and sensitivity; unresolved flow identities; source review date"
  update_trigger: "change in actual product form or specification; feedstock; conversion or finishing route; flow identity; site or geography; energy system; wastewater destination; co-product handling; allocation basis; packaging; permit; external method source; or material foreground data quality"
