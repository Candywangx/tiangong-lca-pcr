    reference: "International Finance Corporation, Environmental, Health, and Safety Guidelines for Sugar Manufacturing, 30 April 2007, official PDF, https://www.ifc.org/content/dam/ifc/doc/2000/2007-sugar-manufacturing-ehs-guidelines-en.pdf, accessed 2026-08-24."
    used_for: "Water, energy, bagasse CHP, solid residues, wastewater treatment, sludge, effluent and air monitoring, and route disclosure."
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on the use of Environmental Footprint methods, consolidated official text, https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng, accessed 2026-08-24."
    used_for: "Multi-functionality hierarchy, foreground and upstream dataset separation, inventory completeness, data quality, and transparent calculation rules."
