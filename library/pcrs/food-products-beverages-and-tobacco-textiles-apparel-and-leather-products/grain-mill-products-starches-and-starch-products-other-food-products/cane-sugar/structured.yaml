    - id: internal_flow_reconciliation
      applies_to: "Juice, syrup, wet sugar, bagasse, condensate, steam, electricity, and wastewater transfers"
      rule: "Output from sending process equals input to receiving process after separately documented storage change, measured loss, export, or other destination."
      inputs:
        - "Sending output"
        - "receiving input"
        - storage
        - loss
        - destination
      output: "Reconciled internal transfer"
      source_ids:
        - eu-pef-2021-2279
    - id: steam_energy
      applies_to: "Steam exchanges"
      rule: "Q = m × (h_steam - h_return) using measured pressure, temperature, quality, and condensate state."
      inputs:
        - "Steam mass"
        - "steam enthalpy"
        - "return enthalpy"
      output: "MJ supplied"
      source_ids:
        - eu-pef-2021-2279
    - id: effluent_load
      applies_to: "Each named water emission"
      rule: "Load_kg = volume_m3 × concentration_mg_per_L × 0.001 for matched records."
      inputs:
        - "Effluent volume"
        - "analyte concentration"
      output: "kg emitted"
      source_ids:
        - ifc-sugar-manufacturing-ehs-2007
    - id: combustion_emissions
      applies_to: "Each named boiler emission"
      rule: "Prefer direct measurement; otherwise Emission = measured fuel activity × disclosed fuel- and technology-specific factor, with biogenic and fossil carbon separated."
      inputs:
        - "Fuel activity"
        - "factor or measured concentration and flow"
        - "control state"
      output: "kg of the named substance"
      source_ids:
        - us-epa-ap42-cane-sugar-1997
        - ifc-sugar-manufacturing-ehs-2007
    - id: co_product_allocation
      applies_to: "Remaining inseparable co-products"
      rule: "Apply the hierarchy in Section 7 and retain the unallocated inventory, allocation key, shares, sensitivity, and product or waste status."
      inputs:
        - "Joint inventory"
        - "product quantities or causal parameter"
        - "values if used"
      output: "Allocated inventory"
      source_ids:
        - eu-pef-2021-2279
    - id: mass_balance
      applies_to: "Extraction through finishing and residue management"
      rule: "Reconcile measured mass and dry solids across each process, explicitly including water evaporation, products, residues, wastes, emissions where material, and storage changes."
