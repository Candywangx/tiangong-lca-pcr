validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "Reference product"
    rule: "Confirm exactly one cane_sugar_output equals 1 kg net conforming cane sugar and uses the fixed Mass and unit-group UUIDs."
    source_ids: []
  - rule_id: validate_scope_route
    applies_to: "Dataset scope"
    rule: "Confirm CPC 23511 scope, mill-gate start and end, route qualifiers, and inclusion of every applicable conditional process."
    source_ids: []
  - rule_id: validate_internal_transfers
    applies_to: "Internal flows"
    rule: "Reconcile matching juice, syrup, wet sugar, bagasse, steam, electricity, condensate, and wastewater transfers after documented storage and loss."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "Each foreground process"
    rule: "Review mass and dry-solids balances and the disposition of bagasse, molasses, filter cake, wastewater sludge, ash, and off-spec sugar."
    source_ids: []
