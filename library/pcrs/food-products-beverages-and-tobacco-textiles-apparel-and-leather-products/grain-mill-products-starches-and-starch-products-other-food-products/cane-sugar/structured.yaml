  calculation_rules:
    - id: normalize_reference_output
      applies_to: "All exchanges"
      rule: "Q_normalized = Q_reporting_period / M_conforming_cane_sugar_reporting_period"
      inputs:
        - "Reporting-period exchange quantity"
        - "net conforming cane-sugar mass"
      output: "Exchange per 1 kg cane sugar"
      source_ids:
