allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Multi-output mill and utility processes"
    rule: "First subdivide processes or expand the system where technically feasible and supported by traceable data."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_co_product_status
    applies_to: "Bagasse, molasses, filter cake, ash, exported steam, and exported electricity"
    rule: "Determine separately whether each destination is internal reuse, a product with a useful function, or waste. Do not assign a co-product credit or allocation share to waste."
    source_ids:
      - ifc-sugar-manufacturing-ehs-2007
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relation
    applies_to: "Remaining inseparable co-products"
    rule: "If subdivision or expansion cannot be applied, use a documented physical causal relation that reflects how inputs and emissions change with co-product output. Mass allocation is not automatic."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relation
    applies_to: "Co-products without a defensible physical relation"
    rule: "Use another documented relation, such as economic value, only after the preceding options are shown infeasible; disclose prices, geography, period, currency, averaging, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_exported_energy
    applies_to: "Exported steam or electricity"
    rule: "Separate internal supply from export. Apply system expansion or the selected allocation relation consistently and disclose any substituted dataset; do not credit gross generation."
    source_ids:
      - eu-pef-2021-2279
