      raw_fields: "material identity; concentration; opening stock; receipts; closing stock; returned mass; cleaning event"
      collection_method: "Meter water and reconcile each named cleaning chemical independently"
      unit: "m3 or kg"
      frequency: "each cleaning event and monthly close"
      temporal_coverage: "complete reporting period"
      site_scope: "all included foreground areas"
      aggregation_rule: "Aggregate each material separately; exclude candidates not actually used"
