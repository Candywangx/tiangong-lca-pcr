    - id: dq_temporal_representativeness
      applies_to: "all foreground records"
      requirement: "Cover a representative reporting period and disclose seasonality, start-ups, shutdowns, abnormal batches and material changes in technology or recipe."
      evidence: "dated meters, invoices, batch logs and exception register"
    - id: dq_meter_quality
      applies_to: "mass, energy, water and emissions"
      requirement: "Use calibrated instruments or documented reconciliation; retain original readings, units, conversion steps and allocation drivers."
      evidence: "calibration certificates, raw readings and calculation workbook"
    - id: dq_mass_balance
      applies_to: "receipt, preparation, drying and milling"
      requirement: "Reconcile measured products, co-products, wastes, water loss and direct material emissions against measured inputs and investigate material unexplained differences."
      evidence: "batch mass-balance worksheet and corrective-action record"
    - id: dq_bom_specificity
      applies_to: "ingredients and packaging"
      requirement: "Use the product-specific bill of materials for the declared product; list each actual ingredient and packaging material separately and exclude unused candidates."
      evidence: "approved formula, packaging specification, issue and return records"
    - id: dq_pollutant_specificity
      applies_to: "air and water emissions"
      requirement: "Retain sampling location, compartment, substance or parameter identity, flow, concentration, period and calculation; do not report a combined pollutant amount."
      evidence: "laboratory report, stack test, chain of custody and flow calibration"
    - id: dq_no_unsubstantiated_default
      applies_to: "all inventory amounts"
      requirement: "A missing foreground amount remains unresolved; do not replace it with an author estimate, an unsupported range or a value copied from an example source."
      evidence: "completeness review and unresolved-data register"
    - id: dq_uuid_identity
      applies_to: "every inventory row"
      requirement: "Use the verified reference UUIDs supplied in this PCR; all other UUIDs remain blank until a separate Tiangong identity review confirms the exact row."
      evidence: "UUID review record and manifest identity-gap closure"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the product UUID is fa9bf702-43d4-414e-a2da-0dad135e5df7, the flow property is 93a60a56-a3c8-11da-a746-0800200b9a66, the unit group is 93a60a57-a4c8-11da-a746-0800200c9a66, and the reference amount is exactly 1 kg net product."
    source_ids:
      - un-cpc-3.0-23922
  - rule_id: validate_dataset_lock
    applies_to: "dataset identity"
    rule: "Fail when scientific species, cultivar or trade type, incoming state, drying route, product form, particle specification or packaging configuration is missing or represents an average across alternatives."
    source_ids:
      - un-cpc-3.0-23922
      - codex-cxs-353-2022
      - codex-cxs-358-2024
  - rule_id: validate_process_map
    applies_to: "process inventory"
    rule: "Require every required process and a documented applicability decision for every conditional process; each detailed process id shall occur once in the Process Map."
    source_ids:
      - codex-cxc-42-1995
      - eu-pef-2021-2279
  - rule_id: validate_atomic_exchange
    applies_to: "inventory rows"
    rule: "Require one concrete exchange per row and reject collection labels for raw spices, materials, energy, fuels, packaging, by-products, wastes or emissions."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_bom_actuality
    applies_to: "chemicals, ingredients and packaging"
    rule: "Reject any chemical, anticaking agent, packaging component, fuel or refrigerant row unless the named exchange is actually used in the declared route and supported by foreground records."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_mass_and_moisture_balance
    applies_to: "preparation, drying and milling"
    rule: "Require measured mass and compatible moisture bases; investigate an unexplained balance difference before dataset release."
    source_ids:
      - codex-cxc-42-1995
      - eu-pef-2021-2279
  - rule_id: validate_emission_separation
    applies_to: "direct releases"
    rule: "Require substance-specific air emissions and parameter-specific water pollutant loads; keep refrigerant loss, fuel combustion and pepper dust in separate rows."
    source_ids:
      - jrc-fdm-bref-2019
      - eu-fdm-bat-2019-2031
  - rule_id: validate_no_default_amounts
    applies_to: "inventory amounts"
    rule: "Reject unsupported default quantities, ranges, reasoned estimates and modelled estimates; accept foreground records or calculations linked to declared protocols."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_uuid_whitelist
    applies_to: "UUID-bearing fields"
    rule: "Permit only the three verified reference UUIDs in this authored candidate; every non-reference inventory UUID shall be blank and closed in manifest review metadata by row_id."
    source_ids:
      - un-cpc-3.0-23922
  - rule_id: validate_bilingual_structure
    applies_to: "English and Chinese Markdown"
    rule: "Require identical ordered process ids, row ids, controlled tokens, protocol ids, calculation rule ids, normative rule ids, source ids and UUIDs in both languages."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Product-specific foreground gate-to-gate dataset suitable for review before use as a secondary_dataset or background_dataset"
  downstream_use: "Link to upstream feedstock, utility, ingredient, packaging and treatment datasets, then use in a declared product system without averaging across botanical identities or product forms"
  allowed_use: "The exact declared species, cultivar or trade type, incoming state, technology route, product style, formulation, packaging, geography and reporting period represented by the foreground records"
  excluded_use: "Proxying a different botanical species, a fresh product, a Piper product, a different particle form, an unrepresented microbial treatment, an unrepresented ingredient formula or a different packaging route without review"
  required_metadata: "All reference-flow qualifiers; facility geography; reporting period; process applicability; upstream dataset links; allocation method; data ownership; review status"
  required_quality_disclosure: "Primary-data coverage; meter and scale quality; moisture basis; mass-balance closure; allocation shares; missing values; emission methods; unresolved UUIDs; deviations from this PCR"
  update_trigger: "Change of species or cultivar grouping, incoming state, dryer or microbial-reduction technology, product form or particle specification, ingredient formula, packaging, refrigerant, fuel, facility, allocation method or representative reporting period"
