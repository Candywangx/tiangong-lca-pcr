      raw_fields: "material identity; container tare; gross mass; destination; batch"
      collection_method: "Weigh each packaging waste material separately"
      unit: "kg"
      frequency: "each removal"
      temporal_coverage: "complete reporting period"
      site_scope: "packaging line"
      aggregation_rule: "Sum each polymer, glass, aluminium, board, paper or wood row independently"
      quality_evidence: "scale record; waste transfer note; material specification"
    - protocol_id: cp_cleaning_material_records
