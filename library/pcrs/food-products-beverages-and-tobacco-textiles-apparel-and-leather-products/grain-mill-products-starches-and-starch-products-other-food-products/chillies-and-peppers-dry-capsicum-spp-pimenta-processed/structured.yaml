allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "shared equipment and utilities"
    rule: "Prefer subdivision, dedicated metering or a documented physical driver tied to operating time, throughput or measured energy demand before applying allocation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_stalk_seed_status
    applies_to: "Capsicum stalks and seeds"
    rule: "Classify each separated stream exclusively as internal rework, co-product or waste from documented destination and function; never record the same mass in more than one status."
    source_ids:
      - codex-cxs-353-2022
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relation
    applies_to: "unavoidable multi-output process"
    rule: "When subdivision is not possible, use a documented physical relationship that reflects how inputs and emissions relate to the functions of the outputs."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_last_resort
    applies_to: "multi-output process lacking a defensible physical relation"
    rule: "Economic allocation may be used only after documenting why subdivision and physical allocation are not feasible; use prices at the point where co-products leave the process and disclose period and source."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_treatment
    applies_to: "wastes sent off site"
    rule: "Assign foreground collection and handling to the generating process; model downstream recovery, treatment or disposal with the linked treatment dataset and avoid double counting credits."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_internal_rework
    applies_to: "pepper material returned within the facility"
    rule: "Treat internal rework as an internal loop, not a second product output or raw-material input; disclose losses and any boundary-crossing transfer."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receipt_identity_mass
      process_id: "raw_material_receipt_and_sorting"
      flow_role: "botanical feedstock identity and mass"
      record_type: "lot receipt record"
      raw_fields: "scientific name; cultivar or trade type; supplier lot; incoming fresh or dried state; moisture result and basis; gross mass; tare mass; accepted mass"
      collection_method: "Verify supplier documents and calibrated scale records by botanical identity and lot"
      unit: "kg"
      frequency: "each received lot"
      temporal_coverage: "complete reporting period"
      site_scope: "all reporting-facility receipts"
      aggregation_rule: "Sum only the one declared species, cultivar grouping and incoming state used for the reference product"
      quality_evidence: "supplier specification; lot traceability; scale calibration; moisture test"
    - protocol_id: cp_receipt_utility_records
      process_id: "raw_material_receipt_and_sorting"
      flow_role: "receipt and sorting electricity"
      record_type: "meter or allocated utility record"
      raw_fields: "meter start; meter end; operating hours; allocation driver; accepted mass"
      collection_method: "Read a dedicated meter or allocate a documented facility meter to receipt and sorting"
      unit: "kWh"
      frequency: "each batch or monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "reporting facility"
      aggregation_rule: "Sum attributable electricity and normalize to net reference output"
      quality_evidence: "meter records; invoices; allocation worksheet"
    - protocol_id: cp_receipt_sorting_residues
      process_id: "raw_material_receipt_and_sorting"
      flow_role: "each sorting reject"
      record_type: "separate residue record"
      raw_fields: "residue identity; container tare; gross mass; destination; lot"
      collection_method: "Weigh each reject stream separately at removal"
      unit: "kg"
      frequency: "each removal"
      temporal_coverage: "complete reporting period"
      site_scope: "receipt and sorting area"
      aggregation_rule: "Sum by row identity without combining mould, plant debris, stone or metal"
      quality_evidence: "scale record; waste transfer record; photographs where used"
    - protocol_id: cp_preparation_water_records
      process_id: "washing_and_preparation"
      flow_role: "pepper washing water"
      record_type: "water meter record"
      raw_fields: "meter start; meter end; batch; recirculated volume; discharged volume"
      collection_method: "Meter fresh water entering pepper washing and separate any recirculated loop"
      unit: "m3"
      frequency: "each batch or shift"
      temporal_coverage: "complete reporting period"
      site_scope: "washing line"
      aggregation_rule: "Sum net water entering the foreground boundary and normalize to net reference output"
      quality_evidence: "meter calibration; batch log; water balance"
    - protocol_id: cp_preparation_utility_records
      process_id: "washing_and_preparation"
      flow_role: "electricity, steam or hot water by individual row"
      record_type: "utility record"
      raw_fields: "utility identity; meter start; meter end; invoice quantity; allocation driver; batch"
      collection_method: "Meter each utility separately or allocate with a documented physical driver"
      unit: "kWh or MJ"
      frequency: "each batch or monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "washing and preparation equipment"
      aggregation_rule: "Aggregate separately for electricity, steam and hot water"
      quality_evidence: "meter record; invoice; allocation worksheet"
    - protocol_id: cp_preparation_chemical_records
      process_id: "washing_and_preparation"
      flow_role: "one washing chemical"
      record_type: "batch formulation and stock record"
      raw_fields: "chemical name; concentration; opening stock; receipts; closing stock; returned mass; batch dose"
      collection_method: "Reconcile each named chemical independently and verify actual legal use"
      unit: "kg"
      frequency: "each batch and monthly close"
      temporal_coverage: "complete reporting period"
      site_scope: "washing line"
      aggregation_rule: "Calculate consumption separately for each chemical; exclude unused candidates"
      quality_evidence: "batch sheet; safety data sheet; purchase and stock records"
    - protocol_id: cp_preparation_material_balance
      process_id: "washing_and_preparation"
      flow_role: "prepared material, stalks, seeds and trimmed tissue by individual row"
      record_type: "weighing record"
      raw_fields: "incoming mass; prepared mass; row identity; co-product mass; waste mass; destination"
      collection_method: "Weigh separated material streams and assign each stream exclusively as product or waste"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete reporting period"
      site_scope: "preparation line"
      aggregation_rule: "Reconcile mass by batch and sum each row separately"
      quality_evidence: "scale calibration; batch balance; transfer or waste record"
    - protocol_id: cp_preparation_wastewater_records
      process_id: "washing_and_preparation"
      flow_role: "pepper washing wastewater"
      record_type: "flow record"
      raw_fields: "discharge volume; recirculated volume; destination; batch"
      collection_method: "Meter or calculate the wastewater volume from a closed water balance"
      unit: "m3"
      frequency: "each batch or daily"
      temporal_coverage: "complete reporting period"
      site_scope: "washing line discharge"
      aggregation_rule: "Sum wastewater leaving for treatment without combining cleaning wastewater"
      quality_evidence: "flow meter; water balance; transfer record"
    - protocol_id: cp_drying_utility_records
      process_id: "drying"
      flow_role: "each drying utility"
      record_type: "meter or utility record"
      raw_fields: "utility identity; meter start; meter end; operating time; dryer; batch; allocation driver"
      collection_method: "Meter electricity, purchased steam and purchased hot water independently for the declared dryer"
      unit: "kWh or MJ"
      frequency: "each batch or monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "drying equipment"
      aggregation_rule: "Aggregate each utility separately and normalize to dry output"
      quality_evidence: "meter calibration; invoice; dryer log; allocation worksheet"
    - protocol_id: cp_drying_material_balance
      process_id: "drying"
      flow_role: "drying mass, moisture, reject and water loss"
      record_type: "batch drying record"
      raw_fields: "incoming mass; incoming moisture and basis; dry output mass; output moisture and basis; reject mass"
      collection_method: "Measure mass and moisture at both sides of the declared drying step"
      unit: "kg and mass fraction"
      frequency: "each batch"
      temporal_coverage: "complete reporting period"
      site_scope: "drying equipment"
      aggregation_rule: "Close the batch mass balance and calculate water removed without default moisture assumptions"
      quality_evidence: "scale and moisture-instrument calibration; batch record"
    - protocol_id: cp_drying_air_emission_records
      process_id: "drying"
      flow_role: "pepper particulate dust from drying"
      record_type: "stack or fugitive emission record"
      raw_fields: "sampling point; flow; concentration; duration; captured dust; batch"
      collection_method: "Measure dust mass or calculate from measured flow and concentration for the declared discharge"
      unit: "kg"
      frequency: "representative test and each reporting period"
      temporal_coverage: "drying exhausts"
      site_scope: "Calculate only pepper particulate dust from drying and document control efficiency"
      aggregation_rule: "sampling report; instrument calibration; control-device log"
      quality_evidence: "undefined"
    - protocol_id: cp_microbial_treatment_records
      process_id: "microbial_reduction_treatment"
      flow_role: "each treatment input or service"
      record_type: "treatment batch record"
      raw_fields: "treatment method; legal authorisation; validation reference; input identity; dose or service mass; time; temperature or dose; batch"
      collection_method: "Record only the one validated treatment actually applied and each input separately"
      unit: "kg, MJ, kWh or kg treated"
      frequency: "each treatment batch"
      temporal_coverage: "complete reporting period"
      site_scope: "treatment equipment or contracted service"
      aggregation_rule: "Sum by treatment technology and substance; do not combine alternatives"
      quality_evidence: "validation report; batch certificate; utility meter; supplier invoice"
    - protocol_id: cp_microbial_treatment_emission_records
      process_id: "microbial_reduction_treatment"
      flow_role: "each fumigant emitted to air"
      record_type: "substance-specific emission record"
      raw_fields: "substance; charge; recovered mass; residual mass; measured exhaust concentration; exhaust flow; duration"
      collection_method: "Use substance-specific recovery balance or measured exhaust data"
      unit: "kg"
      frequency: "each fumigation batch or representative test"
      temporal_coverage: "complete reporting period"
      site_scope: "fumigation equipment and exhaust"
      aggregation_rule: "Calculate ethylene oxide and propylene oxide independently"
      quality_evidence: "monitoring report; material balance; abatement log"
    - protocol_id: cp_milling_utility_records
      process_id: "milling_sieving_and_formulation"
      flow_role: "electricity or compressed air by individual row"
      record_type: "meter or utility record"
      raw_fields: "utility identity; meter start; meter end; operating hours; batch; allocation driver"
      collection_method: "Meter each utility separately for the declared milling and sieving equipment"
      unit: "kWh or m3"
      frequency: "each batch or monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "milling and sieving equipment"
      aggregation_rule: "Aggregate each utility separately and normalize to product output"
      quality_evidence: "meter calibration; equipment log; allocation worksheet"
    - protocol_id: cp_formulation_ingredient_records
      process_id: "milling_sieving_and_formulation"
      flow_role: "one named anticaking agent"
      record_type: "formula and stock record"
      raw_fields: "chemical identity; legal authorisation; formula mass; opening stock; receipts; closing stock; returned mass"
      collection_method: "Reconcile each explicitly named ingredient against the product formula and stock"
      unit: "kg"
      frequency: "each batch and monthly close"
      temporal_coverage: "complete reporting period"
      site_scope: "formulation equipment"
      aggregation_rule: "Calculate each anticaking agent separately; exclude every agent not actually used"
      quality_evidence: "approved formula; batch sheet; purchase and stock records"
    - protocol_id: cp_milling_material_balance
      process_id: "milling_sieving_and_formulation"
      flow_role: "stalk or seed product or waste by individual row"
      record_type: "separation weighing record"
      raw_fields: "incoming mass; product mass; stalk mass; seed mass; row classification; destination"
      collection_method: "Weigh separated stalks and seeds and assign each exclusively as co-product or waste"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete reporting period"
      site_scope: "milling and sieving line"
      aggregation_rule: "Reconcile batch mass and sum each row separately"
      quality_evidence: "scale calibration; batch balance; sales or waste record"
    - protocol_id: cp_milling_dust_records
      process_id: "milling_sieving_and_formulation"
      flow_role: "captured pepper dust or pepper dust to air"
      record_type: "dust collection and emission record"
      raw_fields: "captured dust mass; exhaust flow; dust concentration; duration; filter change; batch"
      collection_method: "Weigh captured dust and measure or calculate emitted pepper dust separately"
      unit: "kg"
      frequency: "each removal and representative emission test"
      temporal_coverage: "complete reporting period"
      site_scope: "milling dust-control system"
      aggregation_rule: "Keep captured waste and direct air emission as separate balances"
      quality_evidence: "waste scale record; emission test; filter log"
    - protocol_id: cp_packaging_utility_records
      process_id: "packaging_and_storage"
      flow_role: "packaging and storage electricity"
      record_type: "meter or allocated utility record"
      raw_fields: "meter start; meter end; operating hours; storage duration; allocation driver"
      collection_method: "Meter packaging and storage electricity or allocate it with a documented physical driver"
      unit: "kWh"
      frequency: "each batch or monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "packaging and finished-product storage"
      aggregation_rule: "Sum attributable electricity and normalize to net product output"
      quality_evidence: "meter record; invoice; allocation worksheet"
    - protocol_id: cp_packaging_material_records
      process_id: "packaging_and_storage"
      flow_role: "one packaging component or nitrogen"
      record_type: "bill of materials and issue record"
      raw_fields: "component material identity; supplier item; units issued; units returned; measured unit mass; nitrogen mass; batch"
      collection_method: "Record each packaging material and nitrogen separately from the product-specific bill of materials"
      unit: "kg"
      frequency: "each packaging batch"
      temporal_coverage: "complete reporting period"
      site_scope: "packaging line"
      aggregation_rule: "Calculate component mass independently and exclude unused packaging candidates"
      quality_evidence: "product specification; issue record; unit-mass test; supplier invoice"
    - protocol_id: cp_storage_refrigerant_inventory
      process_id: "packaging_and_storage"
      flow_role: "one named refrigerant"
      record_type: "substance-specific refrigerant inventory"
      raw_fields: "substance; equipment; opening stock; purchases; additions; recovery; returns; closing stock"
      collection_method: "Complete an independent mass balance for R717, R744 and R134a whenever that substance is present"
      unit: "kg"
      frequency: "each service event and annual close"
      temporal_coverage: "complete reporting period"
      site_scope: "finished-product storage equipment"
      aggregation_rule: "Calculate loss separately by refrigerant and allocate by documented equipment service"
      quality_evidence: "service invoice; cylinder weight; recovery record; inventory sign-off"
    - protocol_id: cp_reference_product_mass
      process_id: "packaging_and_storage"
      flow_role: "net packaged reference product"
      record_type: "finished-product mass record"
      raw_fields: "product code; scientific name; cultivar; form; particle size; moisture result and basis; package configuration; gross mass; packaging tare; net mass"
      collection_method: "Verify net product mass and all required qualifiers for each finished lot"
      unit: "kg"
      frequency: "each finished lot"
      temporal_coverage: "complete reporting period"
      site_scope: "reporting facility plant gate"
      aggregation_rule: "Sum net mass of only the declared reference product and set the reference amount to 1 kg"
      quality_evidence: "scale calibration; product specification; lot release; packaging tare test"
    - protocol_id: cp_packaging_waste_records
      process_id: "packaging_and_storage"
      flow_role: "one packaging waste material"
