    - protocol_id: cp_cleaning_utility_records
      process_id: "cleaning_and_wastewater_management"
      flow_role: "cleaning and wastewater electricity"
      record_type: "meter or allocated utility record"
      raw_fields: "meter start; meter end; equipment; operating time; allocation driver"
      collection_method: "Meter electricity or allocate it with a documented physical driver"
      unit: "kWh"
      frequency: "each cleaning event or monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "cleaning and wastewater equipment"
