  calculation_rules:
    - id: calc_normalized_exchange
      applies_to: "all variable inventory rows"
      rule: "normalized amount = reporting-period row quantity / reporting-period net mass of the declared reference product"
      inputs:
        - "applicable collection protocol row quantity"
        - "cp_reference_product_mass net mass"
      output: "row unit per kg net reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_received_feedstock
      applies_to: "each botanical feedstock"
      rule: "received mass = opening accepted stock + accepted receipts − closing accepted stock − documented returns; calculate independently by scientific name, cultivar grouping and incoming state"
      inputs:
        - "cp_receipt_identity_mass fields"
      output: "kg feedstock"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_drying_water_loss
      applies_to: "water vapour from drying"
      rule: "water removed = incoming water mass − outgoing product water mass − reject water mass; derive each water mass from measured total mass and measured moisture on the same declared basis"
      inputs:
        - "cp_drying_material_balance fields"
      output: "kg water"
      source_ids:
        - codex-cxc-42-1995
    - id: calc_packaging_component_mass
      applies_to: "each packaging component"
      rule: "component mass = issued item count × measured mass per item − returned unused component mass; calculate independently by material"
      inputs:
        - "cp_packaging_material_records fields"
      output: "kg packaging material"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "each refrigerant"
      rule: "loss = opening stock + purchases + additions − closing stock − recovered quantity − returned quantity; calculate independently for R717, R744 and R134a"
      inputs:
        - "cp_storage_refrigerant_inventory fields"
      output: "kg refrigerant emitted"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_wastewater_pollutant_load
      applies_to: "each wastewater pollutant"
      rule: "pollutant load = matched discharge volume × representative pollutant concentration, with unit conversion documented"
      inputs:
        - "cp_wastewater_pollutant_records fields"
      output: "kg pollutant"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_combustion_emission
      applies_to: "each combustion pollutant"
      rule: "use measured mass where available; otherwise measured fuel quantity × a disclosed fuel- and pollutant-specific factor valid for the equipment and period"
      inputs:
        - cp_onsite_fuel_records
        - "cp_onsite_air_emission_records fields"
      output: "kg pollutant"
      source_ids:
        - jrc-fdm-bref-2019
        - eu-fdm-bat-2019-2031
    - id: calc_mass_balance
      applies_to: "each material-processing step"
      rule: "mass balance difference = measured inputs − measured products − measured co-products − measured wastes − measured direct material emissions; investigate and disclose unresolved difference"
      inputs:
        - "process-specific material-balance protocols"
      output: "kg and percent of measured inputs"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
