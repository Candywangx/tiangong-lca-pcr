      applies_to: "raw material and reference product"
      requirement: "Preserve scientific species, cultivar or trade type, incoming state, product style and lot linkage; reject data aggregated across Capsicum, Pimenta or materially different forms."
      evidence: "supplier specification, receipt record, batch genealogy and finished-product specification"
