allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "multifunctional processes and shared services"
    rule: "Avoid allocation by subdivision, separate meters, batch records, or system expansion where appropriate. Collect directly attributable inputs and outputs before applying an allocation factor."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_then_other
    applies_to: "unavoidable multifunctionality"
    rule: "If subdivision or system expansion is not possible, use a documented causal physical relationship. Use another justified relationship, including economic value, only when no defensible physical relationship exists; report quantities, prices, period, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_internal_rework
    applies_to: "internal rework"
    rule: "Return internal rework to the applicable process mass balance without a co-product credit and without adding the same upstream burden twice."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_saleable_secondary_output
    applies_to: "saleable off-specification material or recovered product"
    rule: "Treat a separately sold output as a co-product rather than waste, subdivide its directly attributable handling where possible, and disclose the residual allocation method."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_treatment
    applies_to: "wastes and wastewater"
    rule: "Assign collection and treatment burdens to the process that generates the waste. Do not claim avoided-production credits in the foreground dataset unless a downstream study explicitly applies and discloses a compatible recycling or substitution method."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_formula_material_records
      process_id: "ingredient_batching"
      flow_role: "cocoa, sweetener, milk, fat, and other recipe inputs"
      record_type: "batch recipe, warehouse issue, receipt, return, and supplier record"
      raw_fields: "material_id; supplier; upstream_dataset; lot_id; gross_mass; tare_mass; net_mass; moisture_or_dry_matter; returned_mass"
      collection_method: "reconcile approved recipe with calibrated scale and inventory transactions"
      unit: "kg"
      frequency: "each batch or continuous campaign"
      temporal_coverage: "representative reporting period with all included production lots"
      site_scope: "all lines and storage points supplying the declared product"
      aggregation_rule: "sum net issued mass minus documented unused returns by material, then normalize to net product"
      quality_evidence: "scale calibration; lot traceability; recipe approval; stock reconciliation"
    - protocol_id: cp_batch_yield_records
      process_id: "mass_manufacture"
      flow_role: "intermediate transfers, rework, and material losses"
      record_type: "batch sheet, tank level or scale record, rework log, waste ticket"
      raw_fields: "batch_id; input_mass; transfer_mass; retained_mass; rework_mass; waste_mass; destination"
      collection_method: "reconcile measured transfers and material disposition for each lot"
      unit: "kg"
      frequency: "each batch or campaign"
      temporal_coverage: "same period as product output"
      site_scope: "all manufacturing equipment used for the declared route"
      aggregation_rule: "aggregate by disposition and apply calc_mass_balance"
      quality_evidence: "calibrated measurement; signed batch record; waste receipt; reconciliation review"
    - protocol_id: cp_process_energy_records
      process_id: "mass_manufacture"
      flow_role: "manufacturing and conditioning electricity, purchased heat, and steam"
      record_type: "submeter, utility invoice, runtime and equipment record"
      raw_fields: "meter_id; carrier; opening_reading; closing_reading; unit; batch_or_time_share; production_mass"
      collection_method: "use direct submetering first; otherwise documented time, load, or throughput allocation"
      unit: "kWh or MJ"
      frequency: "meter interval and monthly reconciliation"
      temporal_coverage: "representative reporting period"
      site_scope: "all process and final-conditioning equipment within the boundary"
      aggregation_rule: "subtract non-production use and allocate documented shared use before normalization"
      quality_evidence: "meter calibration; invoice tie-out; allocation worksheet; operating log"
    - protocol_id: cp_cooling_water_records
      process_id: "mass_manufacture"
      flow_role: "cooling-water make-up and recirculation"
      record_type: "water meter, cooling-loop log, blowdown and discharge record"
      raw_fields: "source; make_up_volume; recirculated_volume; blowdown_volume; unit; density_assumption"
      collection_method: "meter freshwater make-up and discharge separately from loop throughput"
      unit: "kg or m3"
      frequency: "meter interval and monthly reconciliation"
      temporal_coverage: "representative reporting period"
      site_scope: "all cooling loops serving included equipment"
      aggregation_rule: "report net intake and wastewater separately; never add recirculating throughput as freshwater"
      quality_evidence: "meter calibration; water balance; maintenance log"
    - protocol_id: cp_bulk_dispatch_records
      process_id: "bulk_conditioning_dispatch"
      flow_role: "net product, disposable packaging, reusable equipment use, and filling rejects"
      record_type: "fill-scale record, dispatch note, packaging issue and return log"
      raw_fields: "lot_id; gross_filled_mass; tare_mass; net_product_mass; packaging_material; packaging_mass; reusable_container_cycles; reject_mass"
      collection_method: "reconcile calibrated filling records to dispatched net mass and packaging inventory"
      unit: "kg"
      frequency: "each fill or dispatch lot"
      temporal_coverage: "same period as product output"
      site_scope: "every bulk filling and dispatch route in scope"
      aggregation_rule: "sum net product and material-specific packaging, allocate reusable equipment by documented cycles, then normalize"
      quality_evidence: "scale calibration; dispatch record; packaging stock reconciliation; container-use log"
    - protocol_id: cp_cleaning_records
      process_id: "cleaning_site_services"
      flow_role: "cleaning water and agents"
      record_type: "CIP or manual cleaning log, water meter, chemical dosing record"
      raw_fields: "cleaning_event; equipment; water_intake; recycled_water; chemical_id; as_supplied_mass; concentration; start_end_time"
      collection_method: "meter or dose each cleaning event and link it to products or campaigns"
      unit: "kg or m3"
      frequency: "each cleaning event"
      temporal_coverage: "representative reporting period"
      site_scope: "product-contact equipment and attributable production areas"
      aggregation_rule: "assign direct events to the lot; allocate shared events using cleaned-equipment time or throughput and disclose the basis"
      quality_evidence: "meter and dosing calibration; sanitation record; chemical inventory tie-out"
    - protocol_id: cp_shared_service_records
      process_id: "cleaning_site_services"
      flow_role: "refrigeration, compressed air, ventilation, water treatment, and other shared energy"
      record_type: "submeter, main meter, equipment runtime, maintenance record"
      raw_fields: "service; carrier; energy; runtime; load; allocation_driver; production_mass"
      collection_method: "use submetering where available and a documented causal driver otherwise"
      unit: "kWh or MJ"
      frequency: "meter interval and monthly reconciliation"
      temporal_coverage: "representative reporting period"
      site_scope: "all shared services attributable to included production"
      aggregation_rule: "subtract separately metered process energy and allocate the residual once"
      quality_evidence: "meter calibration; utility tie-out; allocation review; no-double-count check"
    - protocol_id: cp_wastewater_waste_records
      process_id: "cleaning_site_services"
      flow_role: "wastewater and solid wastes"
      record_type: "discharge meter, laboratory record, waste manifest, treatment record"
      raw_fields: "stream; mass_or_volume; pH; temperature; COD_or_TOC; relevant_pollutants; waste_material; treatment_route"
      collection_method: "meter streams and retain representative analyses for relevant pollutants"
      unit: "kg, m3, or kg substance"
      frequency: "continuous or event records with periodic laboratory analysis"
      temporal_coverage: "representative reporting period"
      site_scope: "every included discharge point and solid-waste route"
      aggregation_rule: "aggregate by stream, substance, and treatment route before normalization"
      quality_evidence: "meter calibration; laboratory method; chain of custody; manifest reconciliation"
    - protocol_id: cp_direct_emissions_records
      process_id: "cleaning_site_services"
      flow_role: "direct air, water, and soil emissions"
      record_type: "stack or discharge measurement, fuel record, refrigerant log, approved factor calculation"
      raw_fields: "substance; compartment; measured_concentration; flow; operating_time; activity_amount; factor; factor_source"
      collection_method: "direct measurement where required; otherwise multiply collected activity by a documented applicable factor"
      unit: "kg substance"
      frequency: "event or reporting interval appropriate to the source"
      temporal_coverage: "representative reporting period"
      site_scope: "every relevant direct source within the boundary"
      aggregation_rule: "calculate substance-specific loads, assign once to process or shared service, and normalize"
      quality_evidence: "calibration; laboratory report; factor reference; calculation review"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory flows"
      rule: "normalized amount = attributable period or lot amount / net reference-product mass for the same scope"
      inputs:
        - "attributable amount"
        - "net product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_net_product_mass
      applies_to: "reference output"
      rule: "net product mass = gross filled or dispatched mass - packaging tare - reusable transport-equipment tare"
      inputs:
        - "gross mass"
        - "disposable packaging tare"
        - "reusable equipment tare"
      output: "kg net bulk product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "each batch and reporting period"
      rule: "mass-balance difference = total material inputs - net product - outputs sent to rework, co-product, waste, wastewater solids, or direct release - documented retained inventory change; investigate and disclose unresolved difference"
      inputs:
        - "material inputs"
        - product
        - rework
        - co-products
        - wastes
        - releases
        - "inventory change"
      output: "mass-balance difference and reconciliation status"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_water_balance
      applies_to: "cooling and cleaning water"
      rule: "net water intake = freshwater intake - water returned unchanged outside the product system; report recirculated throughput separately and calculate wastewater by metered discharge or reconciled balance"
      inputs:
        - freshwater
        - "recycled water"
        - recirculation
        - evaporation
        - "product water"
        - discharge
      output: "net intake, recirculation disclosure, and wastewater"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_shared_service_allocation
      applies_to: "shared energy, water, cleaning, and treatment"
      rule: "assign direct-metered quantities first; allocate only the residual using a causal driver such as runtime, cleaned-equipment time, or throughput and document the driver"
      inputs:
        - "direct meter data"
        - "shared total"
        - "driver values"
      output: "attributable shared-service quantity"
      source_ids:
        - eu-pef-2021-2279
        - eu-jrc-fdm-bref-2019
    - id: calc_direct_emission_load
      applies_to: "measured direct emissions"
      rule: "emission load = concentration x dry or wet exhaust/discharge flow x operating time, with compatible units and stated reference conditions; alternatively use collected activity x documented factor"
      inputs:
        - "concentration and flow or activity and factor"
      output: "kg substance by compartment"
      source_ids:
        - eu-jrc-fdm-bref-2019
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Preserve an approved specification and lot-level evidence for every required qualifier, including formulation family, cocoa and milk-solids declarations where relevant, physical state, temperature, and bulk format."
      evidence: "approved specification; certificate of analysis; batch release; dispatch record"
    - id: dq_temporal_representativeness
      applies_to: "foreground records"
      requirement: "Use a period representative of normal production and covering seasonal, recipe, and operating variation. Prefer twelve consecutive months; disclose a shorter period, shutdowns, trials, and abnormal campaigns."
      evidence: "dated meter and batch coverage; production calendar; exception log"
    - id: dq_process_completeness
      applies_to: "process map"
      requirement: "Reconcile the declared route against the four process groups and explain every omitted operation, outsourced step, or zero flow."
      evidence: "process flow diagram; equipment list; scope review"
    - id: dq_meter_and_mass_reconciliation
      applies_to: "material, product, energy, and water"
      requirement: "Use calibrated instruments or traceable records, reconcile totals to invoices or stock movement, and prevent quantities from being assigned to more than one process."
      evidence: "calibration certificate; invoice tie-out; stock reconciliation; no-double-count review"
    - id: dq_upstream_datasets
      applies_to: "cocoa, sweetener, milk, fats, packaging, utilities, and treatment"
      requirement: "Select datasets representative of material identity, geography, technology, and time; disclose proxy datasets and whether cocoa land-use-change treatment is included."
      evidence: "dataset metadata; supplier origin; proxy rationale; land-use-change disclosure"
    - id: dq_emission_and_waste_identity
      applies_to: "direct releases and treatment outputs"
      requirement: "Preserve substance, compartment, treatment route, measurement method, factor source, and detection or missing-data treatment."
      evidence: "laboratory report; waste manifest; emission calculation; factor reference"
    - id: dq_provisional_ranges
      applies_to: "every reasoned_estimate range"
      requirement: "Treat the range only as a first-pass QA or initialization aid. It shall not replace collected foreground data, and its use in a dataset shall be explicitly flagged for review."
      evidence: "validation finding; estimate register; replacement plan"
validation_rules:
  - rule_id: validation_identity_and_scope
    applies_to: "product and reference flow"
    rule: "Fail completeness if the product is sweetened cocoa powder, a non-cocoa product, a consumer-ready non-bulk format, or lacks the required product subtype, formulation, physical state, bulk-format, and market-specification qualifiers."
    source_ids:
      - codex-cxs-87-1981
      - eu-directive-2000-36-ec
  - rule_id: validation_reference_uuid
    applies_to: "reference product identity"
    rule: "Require reference product flow UUID 7d08586f-18bc-42f3-b262-54f8d559de12, Mass flow-property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids: []
  - rule_id: validation_reference_mass
    applies_to: "reference amount"
    rule: "Require exactly 1 kg net bulk product after excluding packaging and reusable transport-equipment tare."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_process_coverage
    applies_to: "process inventory"
    rule: "Require each of the four process groups or a documented, technically valid omission inside the corresponding required group; require all onsite cleaning, utilities, waste, wastewater, and direct emissions to be assigned once."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validation_upstream_completeness
    applies_to: "product and utility inputs"
    rule: "Reject zero-burden cocoa, sugar or sweetener, milk, fat, packaging, utility, or treatment inputs unless a documented physical exclusion applies. Require an upstream dataset or an explicit unresolved finding."
    source_ids:
      - eu-pef-2021-2279
      - konstantas-et-al-2018
  - rule_id: validation_mass_balance
    applies_to: "each lot and reporting period"
    rule: "Require a reported mass-balance difference and investigation of unexplained material; internal rework shall not appear as both a new input burden and an avoided-burden output."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - eu-pef-2021-2279
  - rule_id: validation_resource_streams
    applies_to: "energy and water"
    rule: "Require electricity, purchased heat, onsite fuel, cooling-water make-up, recirculated water, cleaning water, and wastewater to be separated where applicable, with conversions and shared-service allocation disclosed."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validation_allocation
    applies_to: "multifunctionality"
    rule: "Require subdivision evidence or a documented physical or other justified allocation relationship, factor, period, and sensitivity for every co-product or shared service."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_provisional_values
    applies_to: "provisional ranges or estimates"
    rule: "Report an error if a reasoned_estimate is presented as measured or source-backed. Report incomplete validation when a provisional estimate substitutes for a required foreground record."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for one declared bulk chocolate or cocoa-containing food preparation at the manufacturing gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Cradle-to-gate or wider LCA models that link representative upstream ingredient, utility, packaging, transport, and treatment datasets and preserve the declared product and boundary qualifiers"
  excluded_use: "Direct representation of sweetened cocoa powder, cocoa ingredients sold as such, white chocolate without cocoa solids, consumer-ready non-bulk confectionery, another recipe or market specification, downstream customer processing, or a cradle-to-grave result without added downstream stages"
  required_metadata: "canonical PCR id and version; reference-flow UUIDs; product subtype; formulation or recipe-family id; cocoa, milk-solid, and non-cocoa-fat declarations where applicable; physical state and temperature; bulk format and net content; manufacturing geography; technology route; reporting period; upstream dataset identities; allocation factors; data ownership and review status"
  required_quality_disclosure: "primary-data coverage; meter and mass-balance reconciliation; proxy datasets; cocoa origin and land-use-change treatment; included and omitted process steps; water recirculation treatment; packaging and reusable-container model; allocation sensitivity; provisional estimates; data gaps; abnormal production"
  update_trigger: "Material change in formulation, cocoa origin, supplier or upstream dataset, production technology, energy or water system, bulk delivery format, allocation, market specification, site geography, or representative data period; or replacement of a provisional estimate with reviewed evidence"
data_sources:
  - id: "codex-cxs-87-1981"
    type: "standard"
    reference: "FAO and WHO, Standard for Chocolate and Chocolate Products, CXS 87-1981, revised/amended text available at https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXS%2B87-1981%2FCXS_087e.pdf, retrieved 2026-08-11"
    used_for: "Product definition, ingredients, composition-sensitive qualifiers, exclusions, and market-specification checks"
  - id: "eu-directive-2000-36-ec"
    type: "standard"
    reference: "European Parliament and Council, Directive 2000/36/EC relating to cocoa and chocolate products intended for human consumption, ELI https://data.europa.eu/eli/dir/2000/36/oj, retrieved 2026-08-11"
    used_for: "EU product definitions, composition and vegetable-fat disclosure as one applicable market specification"
  - id: "eu-jrc-fdm-bref-2019"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Best Available Techniques Reference Document for the Food, Drink and Milk Industries, JRC118627, 2019, https://bureau-industrial-transformation.jrc.ec.europa.eu/reference/food-drink-and-milk-industries, retrieved 2026-08-11"
    used_for: "Chocolate process decomposition; raw-material, energy, water, wastewater, waste-gas and residue inventories; monitoring; cleaning and resource-efficiency rules"
