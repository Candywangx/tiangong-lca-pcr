system_boundary:
  rules:
    - rule_id: boundary_received_materials
      applies_to: "foreground start"
      rule: "Start at received cocoa materials and recipe ingredients and include all attributable onsite operations through bulk dispatch, including cleaning, utilities, wastes, wastewater, and direct emissions."
      source_ids:
        - eu-jrc-fdm-bref-2019
        - codex-cxs-87-1981
    - rule_id: boundary_upstream_links
      applies_to: "upstream supply"
      rule: "Link upstream production for cocoa, sugar or sweeteners, milk ingredients, fats, utilities, packaging, and treatment services; do not replace these with zero-burden inputs."
      source_ids:
        - eu-pef-2021-2279
        - konstantas-et-al-2018
    - rule_id: boundary_integrated_cocoa
      applies_to: "integrated sites"
      rule: "When beans or nibs are processed onsite, model cocoa preparation as separately metered upstream unit processes and transfer the burdens through cocoa-material inputs to avoid omission or double counting."
      source_ids:
        - eu-jrc-fdm-bref-2019
        - eu-pef-2021-2279
    - rule_id: boundary_bulk_gate
      applies_to: "foreground end"
      rule: "End at the manufacturing gate with net bulk product in its declared delivery condition. Include disposable bulk packaging supplied with the product; exclude downstream customer forming, retail packaging, distribution, use, and end of life."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_food_specification
      applies_to: "product identity"
      rule: "Apply the declared market's legal or customer specification. Do not treat one Codex or EU composition threshold as universal across every market or every other cocoa-containing preparation."
      source_ids:
        - codex-cxs-87-1981
        - eu-directive-2000-36-ec
