allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared foreground operations"
    rule: "Avoid allocation by submetering, batch segregation, or process subdivision whenever technically possible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework
    applies_to: "Internal coarse fraction or conforming flour returned to the same lot"
    rule: "Treat internal rework as an internal loop without a co-product credit; retain the energy and material losses in the reference-product system."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_co_product
    applies_to: "Saleable peel, fibre, coarse meal, or other co-product"
    rule: "If subdivision is not possible, apply a documented physical relationship that reflects causality; dry-matter allocation is preferred for materially similar food/feed solids. If no defensible physical relationship exists, apply economic allocation and disclose prices, period, geography, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste
    applies_to: "Waste sent to treatment"
    rule: "Assign collection and treatment burdens to the reference-product system up to the declared boundary; do not create an avoided-product credit without a separately justified recovery model."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receipt_preparation
      process_id: "receipt_preparation"
      flow_role: "received material, water, electricity, material-contact chemical, prepared output, rejects, peel, trimming, wastewater"
      record_type: "weighbridge and batch records; meters; chemical issue; laboratory moisture; waste manifest"
      raw_fields: "lot_id; botanical_species; plant_part; state; supplier; origin; wet_mass_kg; moisture_percent; water_kg; electricity_kWh; chemical_name; solution_mass_kg; concentration; output_mass_kg; reject_mass_kg; peel_mass_kg; trimming_mass_kg; wastewater_kg; destination"
      collection_method: "Calibrated scales and meters linked to production lot; laboratory moisture sampling; chemical concentration from certificate or preparation record."
      unit: "kg; % m/m; kWh"
      frequency: "Each lot, shift, or cleaning event; meters at least monthly with production reconciliation."
      temporal_coverage: "At least 12 representative months or the full campaign when seasonal."
      site_scope: "Every facility in the declared product system."
      aggregation_rule: "Sum eligible records, subtract documented unrelated uses, then normalize to net released product; retain lot-level moisture balance."
      quality_evidence: "Calibration, meter reconciliation, batch sheets, laboratory results, invoices, chemical certificates, and treatment receipts."
    - protocol_id: cp_drying_conditioning
      process_id: "drying_conditioning"
      flow_role: "feed, dried output, electricity, steam, each fuel, each refrigerant, wastewater, and direct emissions"
      record_type: "batch mass and moisture; utility meters; fuel and refrigerant inventory; stack or factor records"
      raw_fields: "lot_id; feed_mass_kg; feed_moisture_percent; dried_mass_kg; dried_moisture_percent; electricity_kWh; steam_kg; fuel_name; fuel_mass_or_energy; heating_value_basis; refrigerant_name; opening_charge_kg; additions_kg; recovery_kg; closing_charge_kg; wastewater_kg; emission_factor_id; measured_emission_kg"
      collection_method: "Calibrated scales, moisture tests, submeters, invoices and stock reconciliation; stack measurement or approved factor calculation."
      unit: "kg; % m/m; kWh; MJ"
      frequency: "Each batch and utility period; refrigerant at service events and annual reconciliation."
      temporal_coverage: "At least 12 representative months or the full campaign."
      site_scope: "Each dryer, boiler, generator, heat pump, and refrigeration system."
      aggregation_rule: "Allocate shared utilities by metered use or documented operating-time/load rule; calculate fuel and refrigerant emissions separately before aggregation."
      quality_evidence: "Calibration, moisture closure, invoices, fuel analysis, maintenance logs, refrigerant service records, factor provenance, and stack reports."
    - protocol_id: cp_milling_sieving
      process_id: "milling_sieving"
      flow_role: "dried feed, electricity, loose flour, off-spec flour, coarse residue, and dust"
      record_type: "batch transfer; submeter; acceptance tests; waste and dust-control records"
      raw_fields: "lot_id; feed_mass_kg; feed_moisture_percent; electricity_kWh; loose_flour_kg; flour_moisture_percent; particle_size_result; off_spec_kg; coarse_residue_kg; rework_kg; captured_dust_kg; emitted_dust_kg"
      collection_method: "Calibrated scales and submeter; laboratory release tests; dust mass balance or measured exhaust."
      unit: "kg; % m/m; kWh"
      frequency: "Each lot or shift; dust measurement at permit frequency."
      temporal_coverage: "At least 12 representative months or full campaign."
      site_scope: "Each mill, sifter, blender, and aspiration system."
      aggregation_rule: "Reconcile input with product, rework, residues, dust, and moisture change; normalize accepted output to reference product."
      quality_evidence: "Calibration, sieve checks, laboratory results, rework log, filter-change record, and emission test."
    - protocol_id: cp_facility_sanitation
      process_id: "facility_sanitation"
      flow_role: "water, hot water, electricity, sodium hydroxide, sodium hypochlorite, and sanitation wastewater"
      record_type: "sanitation event log; meters; chemical preparation and discharge records"
      raw_fields: "event_id; area_or_equipment; method; start_time; water_kg; hot_water_kg; temperature_C; electricity_kWh; chemical_name; solution_mass_kg; active_concentration; wastewater_kg; treatment_destination; verification_result"
      collection_method: "Meter or event-volume measurement; chemical dilution calculation; written sanitation schedule and verification."
      unit: "kg; °C; kWh"
      frequency: "Every sanitation event."
      temporal_coverage: "At least 12 representative months or full campaign."
      site_scope: "All food-contact and production-support areas included in the foreground."
      aggregation_rule: "Assign event totals to the cleaned line's production since the previous equivalent event; disclose multi-product allocation."
      quality_evidence: "Written procedure, operator log, concentration test, temperature record, verification swab or audit, and discharge record."
    - protocol_id: cp_packaging_release
      process_id: "packaging_release"
      flow_role: "loose feed, electricity, paper sack, polyethylene liner, packed product, and packaging scrap"
      record_type: "batch transfer; line submeter; bill of materials; stock and scrap records; release laboratory record"
      raw_fields: "lot_id; loose_feed_kg; electricity_kWh; paper_sack_kg; ldpe_liner_kg; packed_net_kg; retained_sample_kg; paper_scrap_kg; ldpe_scrap_kg; moisture_percent; particle_size_result; grade; package_configuration"
      collection_method: "Calibrated check-weigher and scales; submeter; procurement and stock reconciliation; release sampling."
      unit: "kg; % m/m; kWh"
      frequency: "Each lot or packaging run; inventory reconciliation at least monthly."
      temporal_coverage: "At least 12 representative months or full campaign."
      site_scope: "Every packing line in the declared system."
      aggregation_rule: "Reconcile loose feed with released product, retained samples, rework, waste, and dust; normalize packaging to net product."
      quality_evidence: "Scale calibration, bill of materials, invoices, stock reconciliation, scrap tickets, and signed release results."
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every foreground exchange"
      rule: "normalized_exchange = eligible exchange amount / net released product mass; net released product excludes packaging and nonconforming product."
      inputs:
        - "exchange amount"
        - "net released product kg"
      output: "exchange per kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_dry_matter
      applies_to: "Moist source, intermediate, product, co-product, and waste"
      rule: "dry_mass = wet_mass × (1 - moisture_percent / 100). Keep original wet mass and moisture result."
      inputs:
        - "wet mass"
        - "moisture % m/m"
      output: "dry mass kg"
      source_ids:
        - fao-who-cxs-176-1989
    - id: calc_mass_balance
      applies_to: "Each process and total foreground"
      rule: "mass closure = identified outputs and measured mass loss divided by identified inputs; investigate differences outside the declared tolerance and never use unexplained loss as an elementary flow."
      inputs:
        - input
        - product
        - waste
        - wastewater
        - "retained sample"
        - "moisture data"
      output: "wet- and dry-matter closure"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_active_cleaner
      applies_to: "Sodium hydroxide and sodium hypochlorite"
      rule: "active chemical mass = dispensed solution mass × active concentration mass fraction."
      inputs:
        - "solution mass"
        - concentration
      output: "kg active chemical"
      source_ids:
        - fao-who-cxc-1-1969
    - id: calc_combustion_emissions
      applies_to: "Each on-site fuel and pollutant"
      rule: "pollutant mass = fuel activity on declared basis × approved fuel/equipment-specific emission factor; document factor identity and control efficiency."
      inputs:
        - "fuel amount"
        - "heating value"
        - factor
        - "control efficiency"
      output: "kg pollutant per kg product"
      source_ids:
        - olaniran-et-al-2017
        - eu-pef-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "Each refrigerant chemical"
      rule: "loss = opening charge + additions - recovered amount - closing charge; allocate only the share attributable to included systems and period."
      inputs:
        - opening
        - additions
        - recovery
        - "closing charge"
        - output
      output: "kg refrigerant loss per kg product"
      source_ids:
        - ipcc-2019-refrigeration
    - id: calc_allocation
      applies_to: "Multi-product operations"
      rule: "Apply the declared subdivision or allocation rule consistently to all shared inputs and outputs; retain unallocated totals and allocation factors."
      inputs:
        - "total exchanges"
        - "product quantities"
        - "physical or economic factors"
      output: "allocated exchanges"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and source material"
      requirement: "Botanical species, plant part, CPC 23170 product status, route, grade, blend composition, moisture, particle size, and packaging must be traceable to each released lot."
      evidence: "Approved specification, supplier records, batch genealogy, and release certificate."
    - id: dq_temporal
      applies_to: "Foreground activity data"
      requirement: "Use at least 12 representative months or the full seasonal campaign; disclose shutdowns, abnormal batches, and extrapolation."
      evidence: "Dated meter, production, invoice, inventory, maintenance, and laboratory records."
    - id: dq_completeness
      applies_to: "Every process"
      requirement: "Reconcile all known material and energy inputs with products, co-products, wastes, wastewater, and direct emissions; document zero and not-applicable decisions for each atomic card."
      evidence: "Process-level wet and dry mass balances, energy reconciliation, and completeness checklist."
    - id: dq_measurement
      applies_to: "Scales, meters, moisture, particle size, emissions, and chemical concentration"
      requirement: "Use calibrated equipment and retain method, sampling frequency, detection limit, and uncertainty where material."
      evidence: "Calibration certificates, methods, quality-control charts, and test reports."
    - id: dq_geography_technology
      applies_to: "Background links and shared utilities"
      requirement: "Match geography, voltage, fuel, steam source, dryer technology, wastewater treatment, refrigerant, and packaging material to the foreground period and site."
      evidence: "Supplier declarations, contracts, invoices, equipment records, and dataset metadata."
    - id: dq_provisional_ranges
      applies_to: "Every reasoned_estimate range"
      requirement: "Treat the range only as a temporary screening prior; do not replace collected values with its midpoint and replace or explicitly review it before reviewed_methodology."
      evidence: "Review record identifying retained, replaced, or removed ranges."
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require UUID ec00d815-ccbe-4e9d-845a-efc929f58f56, Product flow, CPC 3.0 code 23170 and title, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids:
      - un-cpc-3-23170
  - rule_id: validate_scope_exclusions
    applies_to: "Product identity"
    rule: "Reject cereal flour, oilseed or oleaginous-fruit flour or meal, mustard flour, isolated starch, mixes or doughs, CPC 01961 planting material, CPC 01962 flowers, and any compounded product whose function is not vegetable flour or meal."
    source_ids:
      - un-cpc-3-23170
  - rule_id: validate_qualifiers
    applies_to: "Product and dataset metadata"
    rule: "Fail completeness when botanical identity, route, starting condition, moisture, particle size, grade, packaging, geography, or period is missing."
    source_ids:
      - fao-who-cxs-176-1989
      - eu-pef-2021-2279
  - rule_id: validate_cassava_moisture
    applies_to: "Cassava flour for direct human consumption"
    rule: "Require measured release moisture <= 13% m/m unless a stricter destination requirement applies; for other botanical products require their applicable declared specification rather than silently applying the cassava limit."
    source_ids:
      - fao-who-cxs-176-1989
  - rule_id: validate_atomic_inventory
    applies_to: "Process inventory"
    rule: "Electricity, steam, hot water, each fuel, each refrigerant, each cleaner, each packaging component, each waste stream, wastewater, and each pollutant must remain separate atomic exchanges."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "Every process"
    rule: "Require documented wet- and dry-matter closure; investigate unexplained differences and prohibit balancing with an invented emission."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_route_zeroes
    applies_to: "Conditional exchanges"
    rule: "A zero or not-applicable entry requires evidence that the named exchange is absent; an unmetered or unknown value is a data gap, not zero."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_sanitation
    applies_to: "Cleaning and disinfection"
    rule: "Require written method, frequency, chemical identity and concentration, water temperature when relevant, responsibility, and monitoring or verification evidence."
    source_ids:
      - fao-who-cxc-1-1969
  - rule_id: validate_allocation
    applies_to: "Co-products and shared utilities"
    rule: "Require subdivision evidence or a disclosed physical/economic allocation basis, factors summing to one, consistent application, and sensitivity where economic allocation is used."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_provisional_ranges
    applies_to: "Reasoned estimates"
    rule: "Flag every provisional range for review and prohibit presenting it as an observed, allowed, or source-backed range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Gate-to-gate foreground production dataset for 1 kg net packed other vegetable flour or meal."
  downstream_use: "secondary_dataset; background_dataset after independent review and linkage to representative upstream and treatment datasets."
  allowed_use: "Product-specific process or lifecycle models that match the declared botanical source, route, moisture, grade, geography, period, allocation, and package."
  excluded_use: "Direct substitution for cereal flour, oilseed meal, starch, mustard flour, mixes, planting material, cut flowers, unqualified vegetable powders, agricultural cultivation, or cradle-to-grave claims without additional stages."
  required_metadata: "PCR id and version; reference UUIDs; botanical species and plant part; blend shares; starting state; route; facility and geography; period; technology; moisture and particle size; grade; yields; energy and fuel sources; refrigerants; cleaning chemicals; wastewater and waste destinations; direct emissions; packaging; allocation; upstream dataset identities; data gaps."
  required_quality_disclosure: "Coverage period and sites; primary-data share; calibration and sampling; mass and energy closure; allocation; background-data representativeness; provisional estimates; unresolved UUIDs; exclusions and limitations."
  update_trigger: "Change in botanical source or blend, starting condition, detoxification or conditioning route, dryer or fuel, refrigeration system, cleaner, packaging, co-product status, allocation, facility, geography, product specification, or a material change in annual normalized exchange."
data_sources:
