    type: "literature"
    reference: "Olaniran, J. A.; Jekayinfa, S. O.; Agbarha, H. A. (2017). Life cycle assessment of cassava flour production: A case study in Southwest Nigeria. Journal of Engineering and Technology Research 9(1), 6-13. DOI: 10.5897/JETR2015.0580. OpenAlex: W2753030442. Full text: https://academicjournals.org/journal/JETR/article-full-text-pdf/F4996CC65461 (retrieved 2026-08-20)."
