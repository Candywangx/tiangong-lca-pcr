    used_for: "Company-specific process data, complete material/energy/product/waste/emission inventory, calculation from activity data and factors, data quality, and allocation hierarchy."
  - id: "ipcc-2019-refrigeration"
    type: "method_factor"
    reference: "IPCC, 2019 Refinement to the 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Volume 3, Chapter 7, Emissions of Fluorinated Substitutes for Ozone Depleting Substances. https://www.ipcc-nggip.iges.or.jp/public/2019rf/vol3.html (retrieved 2026-08-20)."
