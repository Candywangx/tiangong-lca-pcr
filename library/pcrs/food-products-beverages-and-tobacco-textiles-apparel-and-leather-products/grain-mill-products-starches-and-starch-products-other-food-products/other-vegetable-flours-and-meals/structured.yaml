    reference: "FAO, Utilising Root Crops, Section 2: Root crop flour. https://www.fao.org/4/x5049E/x5049E04.htm (retrieved 2026-08-20)."
    used_for: "Cassava, sweet potato, taro, and yam flour route; washing, peeling, slicing, drying, grinding, sieving, sealed bags or sacks, and storage."
  - id: "fao-who-cxc-1-1969"
    type: "standard"
    reference: "FAO/WHO Codex Alimentarius, CXC 1-1969, General Principles of Food Hygiene, 2022 revision. https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXC+1-1969%2FCXC_001e.pdf (retrieved 2026-08-20)."
