system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground begins at the reporting facility's receipt of dried whole shelled *Myristica fragrans* kernels with an upstream dataset and ends at release of conforming packed ground powder at the same facility gate. Included operations are receiving inspection, dry sorting and foreign-matter control, continuous saturated-steam treatment, electric redrying and ambient cooling, hammer milling, sieving, dust collection, metal control, lined-sack packing, routine dry sanitation, conditional controlled wet cleaning, on-site wastewater collection before transfer, waste handling before transfer, and direct releases."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Agriculture, harvest, fruit opening, mace separation, primary seed drying, shell cracking, upstream transport before kernel receipt, downstream distribution, food use and packaging end-of-life are outside the foreground and require separate datasets when included in an LCA. No refrigeration and no fuel combustion occur in the locked foreground route. A facility using refrigerated cooling, a fuel-fired dryer, on-site steam generation, irradiation, fumigation or another microbial-reduction route must not average that route into this dataset."
      source_ids: []
    - rule_id: boundary_route_lock
      applies_to: "Product and process scope"
      rule: "Include only the locked *Myristica fragrans* ground-powder route; reject aggregation with mace, cardamom, whole/broken nutmeg or another decontamination route."
      source_ids:
        - codex-cxs-352-2022
    - rule_id: boundary_process_completeness
      applies_to: "Foreground operations"
      rule: "Include receiving/cleaning, steam treatment, electric redrying/cooling, milling/sieving, packing and dry sanitation; include controlled wet cleaning only for documented events meeting its gate."
      source_ids:
        - codex-cxs-352-2022
        - codex-cxc-75-2015
        - fao-herb-spice-quality-assurance
        - fda-spice-risk-profile-2017
    - rule_id: boundary_atomic_inventory
      applies_to: "Inventory exchanges"
      rule: "Apply atomic_flows:v1; every carrier, material, cleaning agent, waste and direct emission is a separate row, and aggregate placeholders are invalid."
      source_ids: []
    - rule_id: boundary_post_lethality_hygiene
      applies_to: "After steam treatment"
      rule: "Keep post-treatment drying, grinding and packing areas dry and segregated; record material or utility consequences of controls and corrective sanitation."
      source_ids:
        - codex-cxc-75-2015
    - rule_id: boundary_factory_gate
      applies_to: "Reference product"
      rule: "End at net conforming powder in the declared lined sack at the processor gate; downstream transport, use and end-of-life are excluded."
      source_ids: []
