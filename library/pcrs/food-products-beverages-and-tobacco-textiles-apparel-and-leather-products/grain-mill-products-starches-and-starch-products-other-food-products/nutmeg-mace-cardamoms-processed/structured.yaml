      requirement: "Use calibrated or verified devices; disclose missing meter coverage, allocation, detection limits and estimation."
      evidence: "calibration_certificate; meter_map; invoice_reconciliation; sampling_report; calculation_workpaper"
    - id: dq_temporal_coverage
      applies_to: "Foreground period"
      requirement: "Cover all conforming and rejected lots, startup/shutdown, rework, sanitation, waste transfers and inventory changes in the declared period."
      evidence: "production_calendar; lot_register; sanitation_log; downtime_log; inventory_reconciliation"
    - id: dq_atomic_completeness
      applies_to: "Inventory"
      requirement: "Demonstrate one card per actual carrier/material/waste/substance and absence of aggregate placeholder exchanges."
      evidence: "atomic_flow_register; purchase_ledger; waste_register; emission_point_register"
    - id: dq_mass_balance
      applies_to: "Each included process"
      requirement: "Reconcile on a consistent moisture basis and investigate material residuals before release."
      evidence: "process_mass_balance; corrective_action_record"
    - id: dq_provisional_ranges
      applies_to: "Every reasoned_estimate range"
      requirement: "Use only as a QA review flag; replace with representative foreground or cited reviewed evidence before publication unless methodology review explicitly accepts it."
      evidence: "replacement_evidence_or_methodology_review_record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Fail unless reference amount is 1 kg, product UUID is 55268cb7-f7b1-4d34-9c53-cc3f158b52d8, type is Product flow, quantitative property is Mass, and every required qualifier is present."
    source_ids:
      - codex-cxs-352-2022
  - rule_id: validate_species_form_lock
    applies_to: "Product scope"
    rule: "Fail if species is not Myristica_fragrans_Houtt, product_form is not ground_powdered_seed, or any mace, cardamom, whole/broken product or blend is averaged into the inventory."
    source_ids:
      - codex-cxs-352-2022
  - rule_id: validate_route_lock
    applies_to: "Process map"
    rule: "Fail if the dataset mixes or substitutes untreated, irradiation, fumigation, fuel-fired drying, refrigerated cooling or another microbial-reduction route."
    source_ids:
      - codex-cxc-75-2015
      - fda-spice-risk-profile-2017
  - rule_id: validate_quality_limits
    applies_to: "Packed powder"
    rule: "Fail when moisture > 8.0% w/w, total ash > 3.0% dry basis, acid-insoluble ash > 0.5% dry basis, water-insoluble ash > 1.5% dry basis, volatile oil < 5.0 ml/100 g dry basis, live insects > 0 per 100 g, or required test evidence is absent."
    source_ids:
      - codex-cxs-352-2022
  - rule_id: validate_process_gate
    applies_to: "Controlled wet cleaning"
    rule: "Fail if the conditional process is included without a documented trigger and attributable lots, or if it is probability-weighted with no-event production."
    source_ids:
      - codex-cxc-75-2015
  - rule_id: validate_atomic_flows
    applies_to: "Every inventory exchange"
    rule: "Fail on aggregate placeholders or merged electricity/steam/water, merged packaging materials, merged cleaning agents, merged waste types, or merged direct-emission substances."
    source_ids: []
  - rule_id: validate_uuid_policy
    applies_to: "Inventory flow identities"
    rule: "Require the reference output as the only flow UUID at candidate stage; before reviewed/published use, require every other selected flow to be resolved and state_code=100 reread without changing row semantics."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "Each included process"
    rule: "Require moisture-consistent input/output/waste/release/inventory reconciliation and documented investigation of material residuals."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_steam_control
    applies_to: "Steam decontamination"
    rule: "Require a validated product-specific time/temperature/pressure regime and complete campaign logs; this PCR does not prescribe a universal lethality schedule."
    source_ids:
      - codex-cxc-75-2015
      - fda-spice-risk-profile-2017
  - rule_id: validate_post_treatment_dryness
    applies_to: "Drying, cooling, milling and packing"
    rule: "Require complete drying verification before milling/packing and moisture-control records preventing post-treatment recontamination."
    source_ids:
      - codex-cxc-75-2015
  - rule_id: validate_reasoned_estimates
    applies_to: "Provisional ranges"
    rule: "Treat exceedance as a review flag, not automatic non-conformance; do not publish a provisional value as an authoritative default without replacement evidence or explicit review acceptance."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for steam-decontaminated ground *Myristica fragrans* nutmeg powder in a 25 kg lined sack at processor gate"
  downstream_use: "May serve as a secondary_dataset or background_dataset only after methodology review, non-reference UUID resolution and evidence replacement appropriate to geography, technology and period"
  allowed_use: "LCA or product-footprint models requiring the exact species/product_form/steam/electric-drying/package route and compatible quality, geography, time and boundary"
  excluded_use: "Mace; cardamom; whole or broken nutmeg; mixed category averages; untreated, irradiated or fumigated spice; fuel-fired or refrigerated route; retail packaging; unresolved use of provisional estimates as authoritative data"
  required_metadata: "pcr_id; version; reference_flow_uuid; species; product_form; microbial_reduction; post_treatment_drying; package; kernel_origin; facility_geography; reference_period; moisture_basis; particle_size_spec; steam_validation_id; process_map; meter_coverage; upstream_datasets; sanitation_events; waste_destinations; cutoffs; proxies; review_status"
  required_quality_disclosure: "foreground_share; lot_coverage; meter_coverage; allocation_workpapers; mass_balance_residuals; laboratory_methods; steam_validation; detection_limits; provisional_ranges_retained; unresolved_uuids; upstream_proxy_mismatch"
  update_trigger: "Change in species, product form, microbial-reduction system, drying energy carrier, mill/sieve specification, packaging components, sanitation practice, supplier/origin mix, quality standard, waste destination, direct-emission control, meter coverage or evidence that materially changes results"
data_sources:
