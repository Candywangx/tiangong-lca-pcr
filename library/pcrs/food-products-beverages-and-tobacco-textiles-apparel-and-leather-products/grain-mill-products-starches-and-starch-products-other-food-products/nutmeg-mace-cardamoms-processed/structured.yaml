allocation_rules:
  - rule_id: allocation_subdivide_directly
    applies_to: "Shared utilities and sanitation"
    rule: "Use submetering and process subdivision first. Allocate a shared meter only from documented equipment runtime and rated-load or measured-load data. Allocate sanitation only to lots supported by its recorded interval or corrective event."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_no_coproduct_route
    applies_to: "Locked foreground route"
    rule: "The declared route produces one reference product and wastes; no co-product allocation is permitted. Internal rework is an internal loop and receives no separate credit or burden."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_waste_destination
    applies_to: "Rejected kernels, foreign matter, dust, off-spec powder, packaging scrap and wastewater"
    rule: "Keep each output as a waste flow with its actual destination. Do not apply avoided-burden credit. If an output is sold as a product, the dataset no longer conforms to allocation_no_coproduct_route and requires explicit re-authoring and review."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_no_route_average
    applies_to: "Steam, sanitation and alternative technologies"
    rule: "Do not probability-weight, market-average or otherwise combine the locked route with untreated, irradiation, fumigation, fuel-dried, refrigerated or no-event corrective-cleaning routes."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_cleaning
      process_id: "receiving_cleaning"
      flow_role: "all_atomic_cards"
      record_type: "batch_meter_waste_emission_records"
      raw_fields: "lot_id; species; kernel_form; input_mass_kg; input_moisture_percent; output_mass_kg; rejected_kernel_mass_kg; plant_debris_mass_kg; stone_mass_kg; metal_mass_kg; captured_dust_mass_kg; electricity_kwh; pm10_concentration_kg_per_m3; exhaust_volume_m3; inventory_change_kg"
      collection_method: "calibrated_weighing; calibrated_metering; representative_sampling; direct_waste_weighing; substance_specific_emission_measurement"
      unit: "kg; kWh; percent_wet_basis; kg_per_m3; m3"
      frequency: "each_lot_and_meter_interval"
      temporal_coverage: "all_represented_lots_and_operating_modes"
      site_scope: "reporting_facility_receiving_and_cleaning_equipment"
      aggregation_rule: "inventory_correct_each_atomic_flow_then_normalize_to_cleaned_kernel_output_and_reference_product"
      quality_evidence: "scale_calibration; meter_calibration; sampling_report; lot_traceability; mass_balance; destination_receipt"
    - protocol_id: cp_steam_decontamination
      process_id: "steam_decontamination"
      flow_role: "all_atomic_cards"
      record_type: "campaign_meter_process_validation_records"
      raw_fields: "campaign_id; kernel_input_kg; steam_input_kg; condensate_return_kg; electricity_kwh; treatment_time_s; treatment_temperature_c; pressure_kpa; wet_kernel_output_kg; output_moisture_percent; condensate_wastewater_kg"
      collection_method: "calibrated_weighing; steam_metering; electricity_metering; continuous_time_temperature_logging; wastewater_metering_or_balance"
      unit: "kg; kWh; s; degC; kPa; percent_wet_basis"
      frequency: "each_campaign_and_meter_interval"
      temporal_coverage: "all_represented_treatment_campaigns"
      site_scope: "reporting_facility_continuous_steam_system"
