      collection_method: "event_authorization; water_metering; chemical_issue_reconciliation; electricity_metering_or_runtime_calculation; wastewater_metering_or_balance; ethanol_mass_balance"
      unit: "kg; fraction; kWh"
      frequency: "each_gated_corrective_event"
      temporal_coverage: "only_documented_events_attributable_to_represented_production"
      site_scope: "controlled_cleaning_area_and_affected_equipment"
      aggregation_rule: "event_specific_atomic_balance_allocate_only_to_attributable_lots_no_probability_weighting"
      quality_evidence: "corrective_action_record; meter_calibration; supplier_certificate; drying_verification; environmental_result; restart_authorization; event_mass_balance"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory card"
      rule: "normalized_amount = net_attributable_amount / net_conforming_packed_powder_kg"
      inputs:
        - net_attributable_amount
        - net_conforming_packed_powder_kg
      output: "amount_per_1kg_reference_product"
      source_ids:
        - mass-balance-identity
    - id: calc_dry_mass
      applies_to: "Kernel, intermediate and powder"
      rule: "dry_mass_kg = as_delivered_mass_kg * (1 - moisture_percent_wet_basis / 100)"
      inputs:
        - as_delivered_mass_kg
        - moisture_percent_wet_basis
      output: "dry_mass_kg"
      source_ids:
        - codex-cxs-352-2022
        - mass-balance-identity
    - id: calc_process_mass_balance
      applies_to: "Each material process"
      rule: "residual_kg = corrected_inputs_kg - product_outputs_kg - waste_outputs_kg - elementary_mass_outputs_kg - ending_inventory_kg + beginning_inventory_kg"
      inputs:
        - atomic_input_output_inventory_records
      output: "residual_kg; residual_percent"
      source_ids:
        - mass-balance-identity
    - id: calc_water_vapour
      applies_to: "Electric redrying"
      rule: "water_vapour_kg = wet_kernel_water_kg - dried_kernel_water_kg - collected_liquid_water_kg"
      inputs:
        - paired_mass_and_moisture_results
        - collected_liquid_water_kg
      output: "dryer_water_vapour_air_kg"
      source_ids:
        - mass-balance-identity
    - id: calc_pm10
      applies_to: "Receiving and milling exhausts"
      rule: "pm10_kg = measured_concentration_kg_per_m3 * exhaust_volume_m3"
      inputs:
        - pm10_concentration_kg_per_m3
        - exhaust_volume_m3
      output: "pm10_kg_after_control"
      source_ids: []
    - id: calc_packaging_components
      applies_to: "Kraft paper and LDPE"
      rule: "component_input_kg = conforming_component_count * verified_component_mass_kg + attributable_component_scrap_kg"
      inputs:
        - component_count
        - verified_component_mass_kg
        - component_scrap_kg
      output: "kraft_paper_input_kg_or_ldpe_input_kg"
      source_ids:
        - mass-balance-identity
    - id: calc_shared_electricity
      applies_to: "Shared electricity meter"
      rule: "allocated_kwh = shared_meter_kwh * equipment_runtime_h * measured_or_rated_load_kw / sum_all_supported_equipment_runtime_load"
      inputs:
        - shared_meter_kwh
        - runtime_h
        - measured_or_rated_load_kw
      output: "process_electricity_kwh"
      source_ids: []
    - id: calc_ethanol_to_air
      applies_to: "Controlled wet cleaning"
      rule: "ethanol_to_air_kg = ethanol_input_kg - ethanol_in_wastewater_kg - ethanol_in_collected_residue_kg"
      inputs:
        - ethanol_input_kg
        - ethanol_in_wastewater_kg
        - ethanol_in_collected_residue_kg
      output: "controlled_cleaning_ethanol_air_kg"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_route_identity
      applies_to: "Reference product and all material lots"
      requirement: "Retain exact species, product form, steam route, electric-drying route and 25 kg lined-sack identity; any mixed species/form/route dataset fails."
