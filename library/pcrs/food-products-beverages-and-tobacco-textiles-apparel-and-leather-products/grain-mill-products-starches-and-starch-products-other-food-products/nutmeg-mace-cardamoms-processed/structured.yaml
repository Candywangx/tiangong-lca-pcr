    reference: "U.S. Food and Drug Administration, Risk Profile: Pathogens and Filth in Spices, 2017 update, https://www.fda.gov/files/food/published/Risk-Profile--Pathogens-and-Filth-in-Spices.pdf (retrieved 2026-08-13)"
    used_for: "Continuous saturated-steam process decomposition; full particle exposure; time/temperature validation; vacuum/steam and drying/cooling utility and moisture-control implications; limits of universal treatment schedules"
  - id: "mass-balance-identity"
