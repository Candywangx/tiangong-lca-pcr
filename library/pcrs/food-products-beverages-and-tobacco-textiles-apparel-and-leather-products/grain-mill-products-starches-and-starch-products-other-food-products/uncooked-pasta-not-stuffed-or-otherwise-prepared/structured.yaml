    type: "standard"
    reference: "International EPD System, PCR 2010:01, *Uncooked pasta, not stuffed or otherwise prepared*, version 4.0.5, https://www.environdec.com/pcr-library/pcr2010-01 (retrieved 2026-08-10; programme page reports status expired and validity ended 2026-05-24)"
    used_for: "Independent category-title and UN CPC 2371 scope corroboration only; not used as a current normative or quantitative requirement."
