validation_rules:
  - rule_id: validate_category_and_form
    applies_to: "Product identity"
    rule: "Confirm CPC 3.0 code 23710, uncooked state, absence of filling, and absence of other preparation; reject out-of-scope cooked, filled, seasoned/prepared, or complete-dish products."
    source_ids:
      - international-epd-pcr-2010-01
  - rule_id: validate_representative_flow_use
    applies_to: "Reference product flow"
    rule: "Confirm actual product form against the full Tiangong flow record. If the product is not semi-dried noodles or a more specific matching real flow exists, UUID 540fef24-1038-48b8-8ee1-8cc415df780a shall be replaced; silent reuse is an error."
    source_ids: []
  - rule_id: validate_reference_support_chain
    applies_to: "Reference amount and unit"
    rule: "Confirm reference amount 1 kg net product, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and reference unit kg; packaging mass shall remain separate."
    source_ids: []
  - rule_id: validate_process_coverage
    applies_to: "Foreground process map"
    rule: "Confirm that actual formulation, forming, conditioning/drying, inspection/rework accounting, and packaging or bulk release are represented and that non-applicable route steps are explicitly justified."
    source_ids:
      - unafpa-dry-pasta-pefcr-2020
  - rule_id: validate_inventory_and_mass_balance
    applies_to: "Foreground inventory"
    rule: "Confirm collected ingredient/packaging BoM, energy, water, output, loss, and waste records; reconcile mass by process and product state without undocumented default values."
    source_ids:
      - unafpa-dry-pasta-pefcr-2020
  - rule_id: validate_allocation
    applies_to: "Shared operations and multi-output processes"
    rule: "Confirm subdivision was attempted first and any remaining allocation has a physically representative driver, complete denominator, same-period records, and disclosure."
