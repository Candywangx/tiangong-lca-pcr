allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Shared or multi-output foreground operations"
    rule: "First avoid allocation by submetering or subdividing ingredient preparation, forming, conditioning, and packaging operations and collecting product-specific inputs and outputs."
    source_ids:
      - unafpa-dry-pasta-pefcr-2020
  - rule_id: allocation_physical_mass
    applies_to: "Shared manufacturing burdens that cannot be subdivided"
    rule: "Allocate shared manufacturing inputs and outputs by the mass of conforming product outputs only when mass represents the underlying physical relationship; disclose the products, period, denominator, and calculation."
    source_ids:
      - unafpa-dry-pasta-pefcr-2020
  - rule_id: allocation_scrap_as_waste
    applies_to: "Pasta scraps and off-specification product leaving the site"
    rule: "Treat material leaving as waste by its actual treatment route unless auditable records establish it as a valuable co-product. Do not credit undocumented internal rework or avoided production."
    source_ids:
      - unafpa-dry-pasta-pefcr-2020
  - rule_id: allocation_nonphysical_exception
    applies_to: "Valuable co-products for which mass is not physically representative"
    rule: "Do not apply mass allocation by default. Document the physical relationship assessment and use a reviewed alternative only with product-specific evidence and an explicit sensitivity disclosure."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_ingredient_bom
      process_id: "dough_forming"
      flow_role: "Principal and other formulation ingredients"
      record_type: "Batch issue, recipe, supplier, and stock records"
      raw_fields: "ingredient identity; supplier and origin when known; lot; accepted mass; source unit; moisture basis when relevant; product code; campaign"
      collection_method: "Reconcile approved formulation and batch issues with receiving and inventory records"
      unit: "kg and original source unit"
      frequency: "Each batch with reporting-period reconciliation"
      temporal_coverage: "Full declared reporting period; use 12 consecutive months for an annual dry-pasta dataset, or justify a representative campaign/season for other forms"
      site_scope: "Every included manufacturing site and line"
      aggregation_rule: "Sum accepted mass by ingredient and product; exclude unrelated products; normalize with normalize_dough_forming_totals"
      quality_evidence: "Calibrated scales; lot traceability; recipe approval; inventory reconciliation; documented conversions"
    - protocol_id: cp_process_water
      process_id: "dough_forming"
      flow_role: "Formulation and direct process water"
      record_type: "Batch dosing, flowmeter, or recipe records"
      raw_fields: "meter start/end or dose; water source; operation; product code; batch; timestamp; source unit"
      collection_method: "Read dedicated meters or validated dosing systems; otherwise reconcile recipe dose to campaign counts"
      unit: "kg or L with documented density conversion"
      frequency: "Each batch or continuous meter interval"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included line; shared meters require declared allocation"
      aggregation_rule: "Sum water assigned to the declared product and normalize with normalize_dough_forming_totals"
      quality_evidence: "Meter calibration; dosing-system checks; conversion record; shared-meter reconciliation"
    - protocol_id: cp_dough_forming_energy
      process_id: "dough_forming"
      flow_role: "Mixing, kneading, extrusion/sheeting/cutting electricity"
      record_type: "Submeter or facility-meter records and equipment runtime"
      raw_fields: "meter readings; equipment/line; timestamp; product code; runtime; allocation driver; kWh"
      collection_method: "Prefer line submetering; otherwise allocate reconciled facility electricity under section 7"
      unit: "kWh"
      frequency: "Meter interval and each reporting period"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included line and directly supporting equipment"
      aggregation_rule: "Sum direct electricity plus documented allocated share; normalize with normalize_dough_forming_totals"
      quality_evidence: "Meter calibration; utility invoice reconciliation; allocation worksheet; downtime and unrelated-load exclusions"
    - protocol_id: cp_intermediate_output
      process_id: "dough_forming"
      flow_role: "Formed uncooked intermediate transfer"
      record_type: "Production and transfer records"
      raw_fields: "product code; batch; mass; measurement point; moisture/conditioning state; destination; timestamp"
      collection_method: "Weigh accepted intermediate at transfer or reconcile validated continuous mass measurement"
      unit: "kg"
      frequency: "Each batch or shift"
      temporal_coverage: "Same period as input and energy records"
      site_scope: "Every included line"
      aggregation_rule: "Sum accepted transferred mass by product and state"
      quality_evidence: "Scale calibration; batch reconciliation; state definition; rejected-mass segregation"
    - protocol_id: cp_conditioning_energy
      process_id: "conditioning_release"
      flow_role: "Electricity, fuel, steam, or delivered heat"
      record_type: "Utility meters, fuel invoices, boiler/steam meters, and equipment logs"
      raw_fields: "energy carrier; meter readings or quantity; source unit; calorific value or conversion; equipment/line; product code; timestamp; allocation driver"
      collection_method: "Prefer line meters; reconcile energy-carrier totals to invoices and document every conversion"
      unit: "kWh for electricity; MJ for fuel or heat after conversion"
      frequency: "Meter interval with reporting-period reconciliation"
      temporal_coverage: "Same period as released product; 12 consecutive months for an annual dry-pasta dataset unless justified otherwise"
      site_scope: "Every included conditioning, inspection, and release line"
      aggregation_rule: "Sum by carrier and operation; allocate shared use under section 7; normalize with normalize_conditioning_totals"
      quality_evidence: "Meter calibration; invoice reconciliation; conversion source; allocation worksheet; equipment scope"
    - protocol_id: cp_packaging_bom
      process_id: "conditioning_release"
      flow_role: "Packaging inputs and packaging losses"
      record_type: "Packaging specification, purchase/stock, line issue, and waste records"
      raw_fields: "component identity; material; unit mass; units consumed; returned stock; waste mass; treatment route; product code; packaging configuration"
      collection_method: "Reconcile packaging specifications and line issues to packed output and material-specific waste"
      unit: "kg and component count"
      frequency: "Each packaging campaign with period reconciliation"
      temporal_coverage: "Same period as packed output"
      site_scope: "Every included packaging line; declare bulk release separately"
      aggregation_rule: "Packaging consumed equals opening stock plus receipts minus closing/returned stock; separate product packaging from waste"
      quality_evidence: "Verified component weights; stock reconciliation; packaging specification; waste tickets"
    - protocol_id: cp_manufacturing_waste
      process_id: "dough_forming"
      flow_role: "Pasta and ingredient losses by route"
      record_type: "Waste scale, production rejection, rework, and treatment records"
      raw_fields: "material/product; mass; cause; process; internal return flag; treatment route; hauler/record; timestamp"
      collection_method: "Weigh or mass-balance each waste stream; reconcile internal return so it is not counted as waste output"
      unit: "kg"
      frequency: "Each batch/shift and waste shipment"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included process and site"
      aggregation_rule: "Sum material that leaves the foreground system by treatment route; exclude documented internal return"
      quality_evidence: "Scale calibration; rejection log; waste transfer record; treatment evidence; mass-balance reconciliation"
    - protocol_id: cp_conditioning_waste
      process_id: "conditioning_release"
