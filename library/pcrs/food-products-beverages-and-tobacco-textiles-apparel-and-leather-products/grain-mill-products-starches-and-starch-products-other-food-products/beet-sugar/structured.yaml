allocation_rules:
  - rule_id: alloc_subdivide
    applies_to: "separable operations"
    rule: "Avoid allocation through meters, batch records and subdivision."
    source_ids:
      - iso-14044-2006
  - rule_id: alloc_internal_recycling
    applies_to: "internal loops"
    rule: "Do not treat an internal recovered flow as a co-product and do not credit it twice."
    source_ids:
      - ec-jrc-fdm-bref-2019
      - iso-14044-2006
  - rule_id: alloc_output_classification
    applies_to: "pulp, molasses, lime and recovered biogas"
    rule: "Use a product row only with documented specification, beneficial destination and economic status; otherwise use the corresponding waste row."
    source_ids:
      - ec-jrc-fdm-bref-2019
      - us-epa-beet-sugar-1974
      - iso-14044-2006
  - rule_id: alloc_economic_coproducts
    applies_to: "inseparable shared burdens"
    rule: "After subdivision, use same-period factory-gate net revenue only when no defensible physical relationship exists; disclose prices and sensitivity."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "all"
      flow_role: "feedstocks and intermediates"
      record_type: "scales, tanks, inventories and laboratory records"
      raw_fields: "flow; mass; inventory; moisture; sucrose; time"
      collection_method: "calibrated measurement and stock reconciliation"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "full campaign"
      site_scope: "site"
      aggregation_rule: "sum each atomic flow and normalise"
      quality_evidence: "calibration, ledger and analyses"
    - protocol_id: cp_water_balance
      process_id: "all"
      flow_role: "water and condensate"
      record_type: "flowmeters, tanks and moisture records"
      raw_fields: "source; destination; volume; density; reuse flag"
      collection_method: "meter external and internal streams separately"
      unit: "m3; kg"
      frequency: "continuous/shift"
      temporal_coverage: "full campaign"
      site_scope: "site"
      aggregation_rule: "close net site balance"
      quality_evidence: "calibration and water-loop diagram"
    - protocol_id: cp_energy_balance
      process_id: "all"
      flow_role: "electricity, steam, hot water and fuels"
      record_type: "meters, deliveries and stock"
      raw_fields: "carrier; quantity; LHV; source; destination"
      collection_method: "carrier-specific meter and stock reconciliation"
      unit: "kWh; MJ"
      frequency: "continuous/daily"
      temporal_coverage: "full campaign"
      site_scope: "site"
      aggregation_rule: "preserve carrier identity"
      quality_evidence: "meters, invoices and fuel analyses"
    - protocol_id: cp_chemical_inventory
      process_id: "purification_energy_and_treatment"
      flow_role: "each chemical"
      record_type: "purchase, stock and dosing records"
      raw_fields: "chemical; grade; purity; stock; dose"
      collection_method: "opening plus receipts minus closing and transfers"
      unit: "kg"
      frequency: "batch/daily"
      temporal_coverage: "full campaign"
      site_scope: "consuming unit"
      aggregation_rule: "sum each chemical separately"
      quality_evidence: "supplier specification and dosing log"
    - protocol_id: cp_refrigerant_records
      process_id: "sugar_finishing"
      flow_role: "refrigerant charge and loss"
      record_type: "service and stock records"
      raw_fields: "refrigerant; charge; recovery; addition; transfer"
      collection_method: "refrigerant mass balance"
      unit: "kg"
      frequency: "each service; annual"
      temporal_coverage: "reporting period"
      site_scope: "refrigeration system"
      aggregation_rule: "additions minus recovery and inventory change"
      quality_evidence: "service log"
    - protocol_id: cp_product_quality_release
      process_id: "crystallisation_and_finishing"
      flow_role: "crystals and reference sugar"
      record_type: "scale and laboratory release"
      raw_fields: "lot; mass; sucrose; moisture; grade; status"
      collection_method: "calibrated mass and declared analytical method"
      unit: "kg; fraction"
      frequency: "each lot"
      temporal_coverage: "full campaign"
      site_scope: "product system"
      aggregation_rule: "net released mass"
