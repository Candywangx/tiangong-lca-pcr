allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Shared and separable foreground operations"
    rule: "First use process subdivision and direct metering to assign burdens to bean preparation, alkalization, pressing, and powder finishing; retain unallocated totals for reconciliation."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_pressing_coproducts
    applies_to: "Joint cocoa cake and cocoa butter outputs from pressing"
    rule: "When subdivision cannot separate the joint pressing burdens, allocate those burdens between cocoa cake and cocoa butter using a documented physical relationship that reflects the process; if no defensible physical relationship is demonstrated, use economic allocation and report prices, currency, geography, averaging period, and calculation."
    source_ids:
      - icco-processing-cocoa
      - mass-balance-identity
  - rule_id: allocation_sensitivity
    applies_to: "Material co-product allocation"
    rule: "Report an alternative mass-based or economic sensitivity when the selected method materially changes the powder result; do not apply avoided-burden substitution unless the study explicitly expands the scenario and discloses it."
    source_ids: []
  - rule_id: allocation_waste_rework
    applies_to: "Shells, rejects, collected dust, wastewater, and internal rework"
    rule: "Treat internal rework as an internal loop; classify an outgoing material as product, co-product, residue, or waste from its documented destination and economic status, and do not assign negative burdens by default."
    source_ids:
      - mass-balance-identity
