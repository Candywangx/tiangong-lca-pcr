validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Fail validation when the reference amount is not 1 kg, the reference flow UUID differs, the Mass property/unit-group identity is missing, or required product qualifiers are absent."
    source_ids:
      - codex-cxs-105-1981
  - rule_id: validate_unsweetened_scope
    applies_to: "Product identity"
    rule: "Fail validation when sugar or sweetener is added, when the product is a dry cocoa-sugar mixture or chocolate powder, or when cocoa cake is not the declared powder precursor."
    source_ids:
      - codex-cxs-105-1981
  - rule_id: validate_moisture
    applies_to: "Reference powder"
    rule: "Where CXS 105-1981 applies, fail validation when measured moisture exceeds 7% m/m or the moisture result and basis are absent."
    source_ids:
      - codex-cxs-105-1981
  - rule_id: validate_route_boundary
    applies_to: "Process map and upstream datasets"
    rule: "Fail validation when an on-site route step is omitted or when an upstream starting material lacks a traceable dataset and omission disclosure."
    source_ids:
      - icco-processing-cocoa
  - rule_id: validate_inventory_identity
    applies_to: "Inventory flows"
    rule: "Before review or publication, require each selected product, waste, and elementary flow to resolve to a reread Tiangong UUID; reject aggregate elementary-flow candidates in a published dataset."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "Each included process"
    rule: "Require a moisture-consistent mass-balance result and investigation/disclosure of material residuals; verify that cocoa butter does not exceed liquor input on the same basis."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_allocation
    applies_to: "Pressing co-products"
    rule: "Require co-product classification, measured cake and cocoa-butter outputs, selected allocation basis, factors summing to one, and sensitivity disclosure when allocation is material."
    source_ids:
      - icco-processing-cocoa
      - mass-balance-identity
  - rule_id: validate_reasoned_estimates
    applies_to: "Provisional QA ranges"
    rule: "Treat values outside a provisional range as review flags rather than automatic non-conformance; publication requires replacement evidence or explicit methodology-review acceptance."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for unsweetened cocoa powder at the manufacturer's gate"
  downstream_use: "May serve as a secondary_dataset or background_dataset after methodology review, UUID resolution, and evidence replacement appropriate to the declared geography, technology, route, and period"
  allowed_use: "Product carbon-footprint or LCA models requiring unsweetened cocoa powder when product qualifiers, system boundary, allocation, geography, technology, and time are compatible"
  excluded_use: "Sweetened cocoa mixtures, chocolate powder, finished chocolate, cocoa butter as reference product, unexplained route substitution, or unreviewed use of provisional estimates as authoritative values"
  required_metadata: "PCR id/version; reference-flow UUID; product name and qualifiers; CPC reference; facility geography; reference period; starting material; route and technology; natural/alkalized status; fat category/result; moisture; packaging; upstream datasets; allocation method; cut-offs; data owner and review status"
  required_quality_disclosure: "Foreground versus secondary shares; meter and batch coverage; missing data and estimates; mass-balance residuals; allocation factors and sensitivity; provisional ranges retained; unresolved UUIDs; upstream proxy geography/time/technology; laboratory and monitoring methods"
  update_trigger: "Change in starting material, fat category, alkalization chemistry, roasting/pressing/milling technology, energy system, packaging, co-product destination or prices, allocation method, supplier mix, regulation/specification, or evidence that materially changes the inventory or its representativeness"
