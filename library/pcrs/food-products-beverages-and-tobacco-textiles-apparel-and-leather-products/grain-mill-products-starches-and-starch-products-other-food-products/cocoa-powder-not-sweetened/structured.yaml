  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = net process amount attributable to the declared route / net conforming packed powder output"
      inputs:
        - "corrected process amount"
        - "allocation result where applicable"
        - "conforming powder mass"
      output: "amount per 1 kg reference powder"
