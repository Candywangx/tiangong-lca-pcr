system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins at the declared receipt of fermented dry cocoa beans, cocoa liquor, or cocoa cake and ends with conforming unsweetened cocoa powder packed at the manufacturer's gate. The foreground includes all on-site steps used by the declared route, utilities, cleaning, dust control, wastewater handling before transfer, waste handling before transfer, rework, packaging, and direct releases."
      source_ids: []
    - rule_id: boundary_route_completeness
      applies_to: "Declared production route"
      rule: "Include every on-site process between the declared starting material and packed powder; a route may omit upstream bean, liquor, or pressing steps only when the omitted material enters with a documented upstream dataset."
      source_ids:
        - icco-processing-cocoa
    - rule_id: boundary_utilities_releases
      applies_to: "Foreground operations"
      rule: "Include process electricity, thermal energy, water, cleaning materials, alkalizing agents, packaging, direct air and water releases, wastewater, dust-control residues, shells, rejects, and other wastes when they cross the foreground boundary."
      source_ids:
        - icco-processing-cocoa
    - rule_id: boundary_low_moisture_hygiene
      applies_to: "Powder finishing and storage"
      rule: "Model cleaning, contamination control, and low-moisture food handling that materially changes inventory; declare excluded hygiene operations and retain the supporting production records."
      source_ids:
        - codex-cxs-105-1981
    - rule_id: boundary_factory_gate
      applies_to: "Reference product"
      rule: "End the default system at net conforming powder packed at the manufacturer's gate; exclude downstream distribution, preparation, use, and packaging end-of-life unless the study explicitly expands the boundary."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Receipt of fermented dry cocoa beans, cocoa liquor, or cocoa cake at the reporting facility, with material state, supplier, origin or blend, moisture, and fat-related specification declared"
  starting_condition_role: "Upstream cut-in point for the foreground route; all operations after this point that occur at the reporting facility are foreground"
  product_classification_scope: "Unsweetened cocoa powder under the semantic scope stated in this PCR, with CPC 3.0 code 23630 retained only as a classification reference"
  recursive_input_rule: "Internal powder rework from the same facility and campaign is an internal loop and is not added as a new upstream product input; externally acquired cocoa powder is a separate product input with its own upstream dataset and must not recursively duplicate the current foreground route"
  upstream_dataset_requirement: "Use traceable upstream datasets for purchased beans, liquor, cake, alkalizing agents, fuels, electricity, water, packaging, and other product inputs; disclose any proxy, geography mismatch, age, or excluded operation"
  disclosure: "Declare starting material, included and omitted process steps, natural or alkalized route, allocation method, packaging boundary, on-site treatment, storage duration, and all cut-offs or proxies"
