allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "cocoa butter and cocoa cake common processes"
    rule: "Avoid allocation where feasible by sub-metering or engineering subdivision of preparation, recovery, finishing, storage, and packaging operations; assign butter-only finishing directly to cocoa butter and cake-only handling directly to cocoa cake."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_physical_then_economic
    applies_to: "inseparable pressing or extraction burdens"
    rule: "If common burdens remain after subdivision, use a documented physical relationship that reflects causal demand. When no defensible physical relationship exists, use economic allocation based on consistent prices at the common-process exit."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_waste_status
    applies_to: "shells, cake, residues, and off-spec outputs"
    rule: "Treat an output as waste only when it has no economic value and is sent to treatment; if it is sold or used as a product, record it as a co-product and apply the selected allocation rule."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_internal_rework
    applies_to: "internally reworked cocoa fat"
    rule: "Do not allocate a second burden to internal rework that never crosses the system boundary; preserve mass and energy records and prevent double counting in product output."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_disclosure
    applies_to: "all multi-output datasets"
    rule: "Report subdivision boundaries, allocation formula, physical parameter or price basis, price period and currency where relevant, output quantities, and a sensitivity case when economic allocation materially affects results."
    source_ids:
      - ghg-protocol-product-standard-2011
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "cocoa_material_preparation_cocoa_fat_recovery_butter_finishing_and_release"
      flow_role: "cocoa materials entering each process"
      record_type: "weighbridge, calibrated scale, batch ticket, supplier certificate"
      raw_fields: "material identity; lot; gross mass; tare; net mass; moisture or dry matter when used; fat fraction when measured; origin; timestamp"
      collection_method: "reconcile receiving and batch records to physical inventory"
      unit: "kg; % m/m"
      frequency: "each lot or batch"
      temporal_coverage: "representative production year or justified campaign"
      site_scope: "all facilities and lines represented"
      aggregation_rule: "sum accepted net mass by material and batch; reconcile opening and closing stock"
      quality_evidence: "calibration record; lot certificate; stock reconciliation; rejected-lot record"
    - protocol_id: cp_energy_and_fuel
      process_id: "all_included_processes"
      flow_role: "electricity, heat, and fuel"
      record_type: "meter, sub-meter, invoice, fuel issue, runtime record"
      raw_fields: "meter start/end; fuel quantity; unit; heating value source; equipment hours; batch assignment"
      collection_method: "direct sub-metering preferred; otherwise documented engineering allocation"
      unit: "kWh; MJ; carrier mass or volume"
      frequency: "continuous or each batch; monthly reconciliation"
      temporal_coverage: "same period as production output"
      site_scope: "all included meters, boilers, and lines"
      aggregation_rule: "subtract non-production loads; allocate shared utilities with documented causal driver"
      quality_evidence: "meter calibration; invoices; fuel specification; allocation worksheet"
    - protocol_id: cp_process_outputs
      process_id: "cocoa_material_preparation_cocoa_fat_recovery"
      flow_role: "prepared feed, crude fat, cake, and other outputs"
      record_type: "batch scale, tank gauge, production log"
      raw_fields: "output identity; net mass; moisture; fat content where relevant; destination; timestamp"
      collection_method: "measure each transfer or batch and reconcile tanks and stock"
      unit: "kg; % m/m"
      frequency: "each batch"
      temporal_coverage: "same period as input data"
      site_scope: "every represented recovery line"
      aggregation_rule: "sum by product and destination; retain internal-transfer links"
      quality_evidence: "calibration; laboratory certificate; batch reconciliation"
    - protocol_id: cp_solvent_balance
      process_id: "cocoa_fat_recovery"
      flow_role: "solvent make-up, recovery, residue, and release"
      record_type: "purchase and stock records, recovery meter, product test, waste manifest, emission monitor"
      raw_fields: "solvent identity; opening stock; purchases; closing stock; recovered quantity; product residue; waste; direct release"
      collection_method: "complete solvent mass balance for each reporting period"
      unit: "kg; mg/kg product"
      frequency: "each batch plus period reconciliation"
      temporal_coverage: "same period as extraction production"
      site_scope: "every solvent-using line and recovery system"
      aggregation_rule: "make-up plus opening stock equals recovered, closing stock, product residue, waste, and release within disclosed balance closure"
      quality_evidence: "inventory reconciliation; laboratory result; monitor calibration; waste manifest"
    - protocol_id: cp_water_records
      process_id: "all_included_processes"
      flow_role: "make-up water and wastewater"
      record_type: "water meter, sub-meter, discharge meter, cleaning log"
      raw_fields: "source; meter readings; use; recirculation; discharge volume; treatment route; batch assignment"
      collection_method: "meter make-up and discharge separately; do not count recirculated volume as repeated input"
      unit: "m3"
      frequency: "continuous or each cleaning event; monthly reconciliation"
      temporal_coverage: "same period as production output"
      site_scope: "all included water systems"
      aggregation_rule: "sum net make-up and discharge by use and normalize to product"
      quality_evidence: "meter calibration; utility bill; discharge record; cleaning log"
    - protocol_id: cp_finishing_materials
      process_id: "butter_finishing_and_release"
      flow_role: "filter media, aids, inert gas, and packaging"
      record_type: "purchase, issue, return, stock, and batch records"
      raw_fields: "material identity; lot; opening stock; receipts; issues; returns; closing stock; recovered amount; batch"
      collection_method: "inventory difference cross-checked to batch issues"
      unit: "kg or material-specific unit"
      frequency: "each batch; monthly reconciliation"
      temporal_coverage: "same period as production output"
      site_scope: "all finishing and packaging lines"
      aggregation_rule: "opening plus receipts minus closing, returns, and recovered amount; allocate to batches by documented use"
      quality_evidence: "invoices; stock count; issue ticket; supplier specification"
    - protocol_id: cp_waste_and_emissions
      process_id: "all_included_processes"
      flow_role: "wastes and direct releases"
      record_type: "scale, waste manifest, discharge sample, stack test, continuous monitor, validated calculation input"
      raw_fields: "substance or waste identity; quantity; medium; destination; treatment; concentration; flow rate; operating time; control efficiency"
      collection_method: "direct measurement preferred; calculation retains formula and measured inputs"
      unit: "kg; m3; concentration and flow units"
      frequency: "each shipment or sampling event; continuous where monitored"
      temporal_coverage: "same period as production output"
      site_scope: "all included release points and waste destinations"
      aggregation_rule: "calculate substance mass from concentration and flow where required; sum by medium and destination"
      quality_evidence: "calibration; laboratory report; manifest; formula review; control-device record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period or batch amount × allocation share ÷ released cocoa butter net mass"
      inputs:
        - "measured amount"
        - "allocation share"
        - "released product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_route_yield
      applies_to: "recovery and finishing"
      rule: "route yield = released cocoa butter mass ÷ measured cocoa feed mass; report feed identity, moisture basis, and whether the denominator is beans, nibs, or liquor"
      inputs:
        - "released product mass"
        - "recovery feed mass"
        - "moisture basis"
      output: "kg product/kg declared feed"
      source_ids:
        - icco-processing-cocoa
        - codex-cxs-141-1983
    - id: calc_mass_balance
      applies_to: "each process and reporting period"
      rule: "inputs plus opening stock = products plus co-products plus wastes plus direct mass releases plus closing stock; report balance closure and unexplained difference without forcing it to zero"
      inputs:
        - "all measured mass flows and stock changes"
      output: "mass-balance closure and unexplained difference"
      source_ids:
        - eu-pef-method-2021
    - id: calc_liquor_fat_check
      applies_to: "cocoa mass or liquor feed"
      rule: "compare measured or supplier-declared cocoa-butter fraction with 0.47–0.60 kg/kg only when CXS 141-1983 conformity is applicable; do not use that interval as a default recovery yield"
      inputs:
        - "cocoa liquor mass"
        - "cocoa-butter fraction"
        - "product conformity claim"
      output: "composition QA finding"
      source_ids:
        - codex-cxs-141-1983
    - id: calc_solvent_balance
      applies_to: "solvent extraction route"
      rule: "solvent loss = opening stock + purchases − closing stock − recovered solvent − solvent in products − solvent in wastes; negative or unexplained results require reconciliation"
      inputs:
        - "solvent inventory"
        - purchase
        - recovery
        - product-test
        - waste
        - "and release records"
      output: "kg solvent loss per kg product and closure finding"
      source_ids:
        - codex-cxs-86-1981
    - id: calc_allocation_share
      applies_to: "shared preparation and recovery burdens"
      rule: "calculate the cocoa-butter share using the disclosed subdivision and allocation hierarchy; allocated shares across co-products shall sum to one"
      inputs:
        - "sub-process records"
        - "output quantities"
        - "physical parameter or prices"
      output: "allocation share by output"
      source_ids:
        - ghg-protocol-product-standard-2011
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all product and material rows"
      requirement: "Preserve lot-level material identity, starting condition, recovery route, product designation, and required qualifiers; do not merge press and non-press routes without a justified representative average."
      evidence: "lot certificates; batch records; route map; product specification"
    - id: dq_measurement
      applies_to: "mass, energy, water, solvent, and emission data"
      requirement: "Use calibrated or verified measurement systems; retain units, conversion factors, sampling methods, detection limits, and uncertainty or data limitations."
      evidence: "calibration certificates; meter register; laboratory reports; conversion worksheet"
    - id: dq_temporal
      applies_to: "foreground period"
      requirement: "Use a representative production year where available; a shorter campaign requires justification, coverage of material operating states, and disclosure of seasonal or batch limitations."
      evidence: "production calendar; downtime and campaign records; representativeness statement"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Reconcile material, solvent, and product balances and document every excluded flow, missing measurement, proxy, and cut-off; absence of a measured release is not evidence of zero."
      evidence: "balance worksheets; gap log; exclusion register; source-to-row trace"
    - id: dq_technology_geography
      applies_to: "foreground and upstream datasets"
      requirement: "Match represented technology, site geography, supplier region, energy system, and data period, or document the proxy and expected direction of bias."
      evidence: "dataset metadata; supplier records; proxy justification"
    - id: dq_allocation
      applies_to: "multi-output processes"
      requirement: "Retain the data and rationale needed to reproduce subdivision and allocation, including quantities and contemporaneous prices when economic allocation is used."
      evidence: "allocation workbook; meter map; quantity and price records; sensitivity result"
    - id: dq_source_traceability
      applies_to: "external rules and estimates"
      requirement: "Link every source-backed constraint to a listed source id and label every unsourced broad range as a replaceable reasoned_estimate."
      evidence: "source register; projection source_ids; review record"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Confirm flow UUID 402dbf23-610a-4be9-a34f-333ec03580a9, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass group 93a60a57-a4c8-11da-a746-0800200c9a66, reference unit kg, fixed amount 1, and all required qualifiers."
    source_ids:
      - codex-cxs-86-1981
  - rule_id: validate_scope_route
    applies_to: "process map and boundary"
    rule: "Confirm the declared starting material and actual route match included process sections, and that omitted preparation, extraction, deodorization, or packaging steps are explicitly not performed or lie in linked upstream/downstream datasets."
    source_ids:
      - icco-processing-cocoa
      - eu-pef-method-2021
  - rule_id: validate_mass_and_solvent_balance
    applies_to: "each process and solvent-using route"
    rule: "Recalculate mass and solvent balances from raw records; unresolved differences, negative solvent losses, or product output exceeding physically available feed fat are errors or documented inconclusive findings."
    source_ids:
      - codex-cxs-141-1983
      - codex-cxs-86-1981
  - rule_id: validate_coproduct_allocation
    applies_to: "cocoa cake and other valuable outputs"
    rule: "Confirm valuable outputs are treated as co-products, allocation is avoided where feasible, the remaining method follows the stated hierarchy, and shares sum to one without double counting internal rework."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: validate_product_specification
    applies_to: "released cocoa butter"
    rule: "When CXS 86-1981 conformity is claimed, verify product designation, analytical results, applicable free-fatty-acid and unsaponifiable-matter limits, and residual hexane limit for non-press cocoa butter."
    source_ids:
      - codex-cxs-86-1981
  - rule_id: validate_data_quality
    applies_to: "foreground data package"
    rule: "Check measurement calibration, temporal coverage, completeness, technological and geographical representativeness, source traceability, proxy disclosure, and replacement status of provisional estimates."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate unit-process dataset for factory-gate cocoa butter, fat, or oil production"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Route-, site-, geography-, period-, and specification-matched LCA models for cocoa butter and downstream products, with upstream datasets linked at the declared starting condition"
  excluded_use: "Unsupported product comparisons; substitution among press, extracted, refined, or deodorized products without qualifier alignment; representation of non-cocoa fats; use as a cradle-to-gate dataset when upstream cocoa production is absent"
  required_metadata: "PCR id and version state; reference-flow UUID; starting material; route and process map; product designation and specification; plant geography; data period; technology; allocation method; co-product destinations; packaging state; source ids; data owner and review status"
  required_quality_disclosure: "Measurement coverage and calibration; mass and solvent balance closure; temporal, technological, and geographical representativeness; missing UUIDs and flows; proxies; allocation sensitivity; cut-offs; provisional reasoned_estimate ranges; limitations"
  update_trigger: "Material change in starting-material mix, recovery or finishing technology, energy or water supply, solvent system, product specification, co-product use or prices, allocation method, packaging, emissions control, site coverage, or data period; replacement of provisional estimates or unresolved flow identities"
