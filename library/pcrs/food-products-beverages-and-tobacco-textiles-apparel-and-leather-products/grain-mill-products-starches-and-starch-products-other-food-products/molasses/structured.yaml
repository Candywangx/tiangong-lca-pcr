allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "All multi-output foreground processes"
    rule: "First assign directly measured feedstock, utilities, chemicals, emissions, wastes, and dedicated finishing operations to the output that causes them by process subdivision, sub-metering, or an engineering model. Do not allocate a dedicated molasses operation to sugar or another co-product."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_common_burdens
    applies_to: "Burdens remaining after subdivision"
    rule: "Where allocation cannot be avoided, use a quantified physical relationship only when it represents how changes in the co-product outputs cause the shared input use or emissions. If no defensible causal physical relationship exists, use economic allocation based on the values of sugar, molasses, and other valuable co-products when they leave the common process."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_economic_period
    applies_to: "Economic allocation"
    rule: "Use net prices at the common-process exit, before downstream processing, averaged over the same representative campaign or reporting period as the inventory. Record currency, price source, averaging period, quantities, values, and every factor; assess sensitivity where price volatility could change the result materially."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_waste_status
    applies_to: "Residues and outputs"
    rule: "An output with a documented market or beneficial-use value is a co-product and participates in the selected allocation approach. An output without economic value is a waste; assign its treatment to the process that generates it and do not give it a product allocation share."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_completeness
    applies_to: "Allocation calculation"
    rule: "Allocation factors for all valuable outputs of each common process must sum to 1. Apply the selected method consistently to shared inputs, emissions, and removals, prevent internal recycle from becoming a second product output, and disclose any system expansion separately."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_feedstock_receipts
      process_id: "liquor_preparation"
      flow_role: "received feedstock"
      record_type: "weighbridge, receiving, inventory, and quality records"
      raw_fields: "date; supplier/origin; route; gross, tare, and net mass; moisture or solids; lot; opening and closing inventory"
      collection_method: "calibrated weighbridge or reconciled mass meter with laboratory quality sampling"
      unit: "kg and declared quality unit"
      frequency: "each receipt and inventory period"
      temporal_coverage: "complete reporting campaign, normally at least 12 representative months or one complete seasonal campaign"
      site_scope: "all facilities in the dataset"
      aggregation_rule: "receipts plus opening inventory minus closing inventory, by route and lot"
      quality_evidence: "calibration, ticket, inventory reconciliation, sampling method, and missing-record log"
    - protocol_id: cp_material_and_water_inputs
      process_id: "liquor_preparation"
      flow_role: "water and processing inputs"
      record_type: "purchase, issue, tank, and meter records"
      raw_fields: "material identity; quantity; concentration; make-up water; recycled water; inventory change; process destination"
      collection_method: "calibrated meter, invoice, stock issue, or tank reconciliation"
      unit: "kg, m3, and concentration unit"
      frequency: "each transaction or continuous meter total"
      temporal_coverage: "same period as product output"
      site_scope: "all included operations"
      aggregation_rule: "net external input by material; internal recycle reported separately"
      quality_evidence: "meter calibration, invoice/issue record, concentration certificate, and reconciliation"
    - protocol_id: cp_energy_and_utilities
      process_id: "liquor_preparation_crystallization_separation"
      flow_role: "electricity, fuel, steam, heat, cooling, and compressed air"
      record_type: "meter, fuel, boiler, CHP, and utility-balance records"
      raw_fields: "carrier; quantity; unit; meter boundary; generation; import; export; return condensate; allocation meter"
      collection_method: "calibrated meter or engineering balance from collected fuel and utility records"
      unit: "kWh, MJ, kg steam, kg or m3 fuel as applicable"
      frequency: "continuous or each billing/production period"
      temporal_coverage: "same period as product output"
      site_scope: "all included utility systems and consuming operations"
      aggregation_rule: "gross generation and imports minus exports and documented returns; allocate only residual shared use"
      quality_evidence: "meter map, calibration, invoices, fuel properties, boiler/CHP balance, and gap treatment"
    - protocol_id: cp_process_outputs
      process_id: "liquor_preparation_crystallization_separation"
      flow_role: "internal transfers, molasses, sugar, and co-products"
      record_type: "mass meter, tank, weighbridge, production, and inventory records"
      raw_fields: "product identity; grade; mass or volume; density; temperature; opening/closing inventory; destination; internal return"
      collection_method: "calibrated mass measurement or volume-density conversion with inventory reconciliation"
      unit: "kg; m3; kg/m3; °C"
      frequency: "each batch, transfer, or dispatch"
      temporal_coverage: "complete reporting campaign"
      site_scope: "all included production lines and tanks"
      aggregation_rule: "net output by product and grade; internal recycle excluded from saleable output"
      quality_evidence: "calibration, batch/dispatch record, density method, tank reconciliation, and yield review"
    - protocol_id: cp_wastes_and_emissions
      process_id: "liquor_preparation_crystallization_separation_molasses_finishing_storage"
      flow_role: "wastes, waste water, and direct releases"
      record_type: "waste transfer, effluent meter, stack test, continuous monitor, laboratory, and activity records"
      raw_fields: "flow identity; quantity; concentration; destination; treatment; activity; factor; sampling time"
      collection_method: "direct measurement where available; otherwise calculation from collected activity and a cited factor"
      unit: "kg, m3, and pollutant-specific unit"
      frequency: "each transfer or monitoring period"
      temporal_coverage: "same period as product output and representative operating conditions"
      site_scope: "every included direct source and treatment system"
      aggregation_rule: "measured load or activity multiplied by cited factor; keep treatment transfers and direct releases separate"
      quality_evidence: "chain of custody, laboratory method, monitor calibration, factor citation, and completeness check"
    - protocol_id: cp_storage_quality_dispatch
      process_id: "molasses_finishing_storage"
      flow_role: "molasses quality, inventory, losses, finishing inputs, and dispatch"
      record_type: "tank, laboratory, dispatch, packaging, and loss records"
      raw_fields: "lot; route; grade; mass/volume; density and temperature; dry matter/soluble solids; water; sugar basis; packaging; off-spec quantity; destination"
      collection_method: "representative sampling and validated laboratory method plus calibrated dispatch measurement"
      unit: "kg and declared analytical units"
      frequency: "each lot or dispatch; inventory by reporting period"
      temporal_coverage: "same period as production inventory"
      site_scope: "all molasses tanks, finishing lines, and dispatch points"
      aggregation_rule: "conforming net dispatch plus inventory change; off-spec and losses reported separately"
      quality_evidence: "sampling plan, analytical method, certificates, calibration, release authorization, and inventory reconciliation"
    - protocol_id: cp_coproduct_values
      process_id: "crystallization_separation"
      flow_role: "economic allocation inputs"
      record_type: "sales and transfer-price records"
      raw_fields: "product/grade; net quantity; common-process exit price; currency; date; discounts; downstream cost adjustment"
      collection_method: "audited sales ledger or documented arm's-length transfer-price method"
      unit: "currency/kg and kg"
      frequency: "each sale or monthly average"
      temporal_coverage: "same campaign or reporting period as inventory"
      site_scope: "all valuable outputs of each common process"
      aggregation_rule: "quantity-weighted average net exit value by product; document missing or exceptional transactions"
      quality_evidence: "ledger extract, price basis, currency conversion, averaging method, and sensitivity record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = allocated campaign amount / net kg of conforming as-received molasses dispatched, with opening and closing molasses inventory reconciled"
      inputs:
        - "allocated campaign amount"
        - "conforming dispatch mass"
        - "molasses inventory change"
      output: "amount per 1 kg reference molasses"
      source_ids: []
    - id: calc_volume_to_mass
      applies_to: "Volumetric molasses and liquid records"
      rule: "mass = measured volume × representative measured density at the recorded temperature; do not use an undocumented default density"
      inputs:
        - volume
        - density
        - "measurement temperature"
        - "lot/campaign link"
      output: "kg liquid"
      source_ids: []
    - id: calc_dry_matter
      applies_to: "Molasses quality disclosure"
      rule: "dry-matter mass fraction = measured dry-matter mass / as-received sample mass; retain °Brix separately unless the method establishes equivalence"
      inputs:
        - "sample masses"
        - "analytical result"
        - method
        - basis
      output: "declared dry-matter fraction and basis"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_mass_balance
      applies_to: "Each included process and total facility"
      rule: "reconcile input mass, output products, wastes, direct mass releases, internal recycle, and inventory change on compatible wet and solids bases; define and disclose the facility's review threshold before validation"
      inputs:
        - "collected masses"
        - "quality/solids results"
        - "inventory changes"
        - "recycle records"
      output: "process and facility balance closure with explained residual"
      source_ids: []
    - id: calc_allocated_inventory
      applies_to: "Shared multi-output process"
      rule: "allocated burden for molasses = subdivided molasses burden + allocation factor × remaining common burden; factor follows the documented physical or economic rule and all factors sum to 1"
      inputs:
        - "subdivided burdens"
        - "common burdens"
        - "co-product quantities and causal property or exit values"
      output: "allocated molasses inventory by flow"
      source_ids:
        - ghg-protocol-product-standard-2011
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference and inventory flows"
      requirement: "Confirm the molasses reference UUID and select route-, carrier-, waste-, and pollutant-specific Tiangong flows before publication; retain unresolved non-reference flow identities as review findings."
      evidence: "Tiangong readback, flow-selection record, and identity review"
    - id: dq_temporal
      applies_to: "Foreground campaign"
      requirement: "Cover one complete and representative campaign; for seasonal beet or cane operations, include the full processing season and the associated storage/dispatch reconciliation. Explain shutdowns, abnormal operation, and substitutions."
      evidence: "dated production, meter, inventory, and dispatch records"
    - id: dq_mass_quality
      applies_to: "Material balance and product quality"
      requirement: "Use calibrated net mass or documented volume-density conversion, align wet and dry bases, and retain representative molasses sampling and analytical methods. External typical values are plausibility context, not replacements for foreground results."
      evidence: "calibration, density/temperature records, laboratory methods, balance review, and source comparison"
    - id: dq_completeness
      applies_to: "Processes, utilities, and outputs"
      requirement: "Demonstrate coverage of every process-map step, valuable co-product, waste, waste-water stream, direct emission source, and utility system; list missing data and quantify their estimated significance without silently setting them to zero."
      evidence: "process-flow diagram, meter map, source register, and completeness checklist"
    - id: dq_allocation
      applies_to: "Shared sugar-manufacturing burdens"
      requirement: "Match allocation quantities, prices or physical factors, and time period to the inventory; retain the unallocated common-process inventory and a reproducible factor calculation."
      evidence: "allocation workbook, ledgers, engineering basis, factor sum check, and sensitivity record"
    - id: dq_geography_technology
      applies_to: "Dataset representativeness"
      requirement: "State country/region, facility configuration, cane/beet/refinery route, purification and crystallization technology, energy system, treatment configuration, product grade, and dispatch state."
      evidence: "facility metadata and process description"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The reference product UUID, Mass flow-property UUID, Units of mass unit-group UUID, and kg unit must resolve; the dataset must declare every required qualifier and use exactly 1 kg net as-received conforming molasses as the quantitative reference."
    source_ids: []
  - rule_id: validate_scope_route
    applies_to: "Process coverage"
    rule: "The declared cane, beet, or refinery route must map to all three process-map stages, including route-specific preparation, evaporation/crystallization, centrifugal separation, and molasses finishing; any non-occurring operation must be justified by the actual facility configuration."
    source_ids:
      - us-epa-ap42-cane-sugar-1997
      - us-epa-ap42-beet-sugar-1997
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_mass_and_quality
    applies_to: "Foreground material balance"
    rule: "Wet-mass and solids-basis balances must be reproducible from raw records, inventory changes, internal recycle, wastes, and direct releases. Any residual beyond the facility's predeclared review threshold requires correction or a documented explanation; external typical molasses yield or solids values must not be substituted for missing site data."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_allocation
    applies_to: "Multi-output processes"
    rule: "Confirm subdivision is applied first; every valuable output is included; waste status is evidenced; common-process factors sum to 1; physical causality or economic exit-value data support the selected factor; and internal recycle, system expansion, or exported utilities are not double counted."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: validate_utilities_emissions
    applies_to: "Energy, water, wastes, and direct emissions"
    rule: "Reconcile imported, generated, returned, recycled, exported, and consumed utilities; verify all applicable combustion, lime/carbonation, evaporator, material-handling, waste-water, storage, and spill releases are measured or calculated from collected activity data with cited factors."
    source_ids:
      - us-epa-ap42-cane-sugar-1997
      - us-epa-ap42-beet-sugar-1997
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_data_lineage
    applies_to: "Every non-fixed amount"
    rule: "Each foreground or calculated row must link to its collection protocol and reporting period. Each external factor or method must link to a source id, and missing values must remain findings rather than implicit zeros."
    source_ids:
      - ghg-protocol-product-standard-2011
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate production dataset for saleable molasses; may be linked to upstream datasets to form a cradle-to-gate result"
  downstream_use: "secondary_dataset; background_dataset after methodology, identity, representativeness, and allocation review"
  allowed_use: "LCA of unblended molasses from the declared route, grade, geography, period, allocation approach, and dispatch state; use as an upstream dataset for feed, fermentation, food, or industrial systems when those qualifiers match"
  excluded_use: "Blended syrups, high-test/invert syrup, molassed pulp, compound feed, fermentation products, or another route/grade without representativeness review; comparative claims without applicable review and verification"
  required_metadata: "PCR id and version; reference UUIDs; route/feedstock; product designation and grade; dry matter or soluble-solids method/result; water and sugar basis; facility geography/configuration; reporting period; process boundary; dispatch state; allocation method/factors; co-products; upstream datasets; data owner and review status"
  required_quality_disclosure: "Primary-data share; meter and sampling coverage; missing-data treatment; mass/solids balance closure; allocation basis and sensitivity; important unresolved flow UUIDs; temporal, geographic, and technological representativeness; external factors; uncertainty and exclusions"
  update_trigger: "Change in feedstock route, purification/crystallization technology, energy system, product grade/specification, dry-matter basis, facility boundary, co-product status, allocation method or prices, treatment configuration, dispatch packaging, Tiangong identity, or evidence that materially changes the inventory"
