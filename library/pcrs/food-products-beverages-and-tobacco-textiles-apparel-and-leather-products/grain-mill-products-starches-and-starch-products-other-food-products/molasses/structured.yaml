system_boundary:
  rules:
    - rule_id: boundary_route_complete
      applies_to: "Supported production route"
      rule: "Include the route-specific chain from received cane, beet, or raw sugar through preparation/affination, juice or liquor purification, evaporation, crystallization, centrifugal separation, and molasses finishing and storage when those operations are controlled by the reporting facility."
      source_ids:
        - us-epa-ap42-cane-sugar-1997
        - us-epa-ap42-beet-sugar-1997
        - eu-jrc-fdm-bref-2019
    - rule_id: boundary_direct_operations
      applies_to: "Foreground facility"
      rule: "Include directly operated boilers, CHP, lime preparation or kiln operations, water supply, refrigeration, compressed air, storage, and waste or waste-water treatment to the extent they serve the included route; record utility exports and treatment transfers explicitly."
      source_ids:
        - us-epa-ap42-cane-sugar-1997
        - us-epa-ap42-beet-sugar-1997
        - eu-jrc-fdm-bref-2019
    - rule_id: boundary_upstream_and_downstream
      applies_to: "Product system links"
      rule: "Link purchased inputs to upstream datasets. Exclude transport after the declared production gate, downstream blending, feed manufacture, fermentation, use, and end-of-life unless the study explicitly expands the boundary and discloses the extension."
      source_ids:
        - ghg-protocol-product-standard-2011
    - rule_id: boundary_no_silent_cutoff
      applies_to: "Material and energy balance"
      rule: "Do not omit a shared sugar-manufacturing operation, valuable co-product, residue, waste-water stream, utility flow, or direct emission merely because it is not dedicated to molasses; address it by subdivision, allocation, or explicit documented exclusion."
      source_ids:
        - ghg-protocol-product-standard-2011
