                - eu-commission-pef-2021
            ranges:
              - role: qa_guardrail
                lower: "0"
                upper: "0.02"
                unit: "kg/kg net saleable product"
                basis: "direct refrigerant loss allocated to 1 kg net saleable product"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids: []
allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared lines, utilities, sanitation, and storage"
    rule: "Prefer subdivision using product-specific meters, batch records, equipment runtime, recipe records, and dedicated storage data; use system expansion only when the added function and reporting scope are explicit."
    source_ids:
      - eu-commission-pef-2021
  - rule_id: allocation_physical
    applies_to: "Unavoidable shared inputs and emissions"
    rule: "When subdivision is not feasible, allocate using a documented causal physical relationship such as metered energy, equipment time, occupied chilled volume-time, or cleaned surface-time. Do not default automatically to product mass."
    source_ids:
      - eu-commission-pef-2021
  - rule_id: allocation_mass_fallback
    applies_to: "Shared production with no better physical driver"
    rule: "Use saleable net product mass only when it reasonably represents the physical cause of the shared burden; disclose the denominator, period, included products, and sensitivity to an alternative driver."
    source_ids:
      - eu-commission-pef-2021
  - rule_id: allocation_economic_fallback
    applies_to: "Co-products with dissimilar functions and no defensible physical relation"
    rule: "Use economic allocation only after documenting why subdivision, system expansion, and physical allocation are not feasible; use revenue excluding taxes over a representative period and disclose price volatility."
    source_ids:
      - eu-commission-pef-2021
  - rule_id: allocation_waste_status
    applies_to: "Food residues and packaging scrap"
    rule: "Classify each output as saleable co-product, recoverable by-product, or waste using documented destination and economic status; do not assign avoided burdens inside the foreground dataset unless the chosen downstream method explicitly requires them."
    source_ids:
      - eu-commission-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_material_balance
      process_id: "ingredient_preparation_dish_assembly_thermal_conditioning"
      flow_role: "ingredients, internal transfers, recipe water, product, and losses"
      record_type: "Batch production, weighing, BOM, receiving, and inventory records"
      raw_fields: "batch_id; product_code; ingredient_id; supplier_lot; opening_mass; issued_mass; returned_mass; transfer_mass; product_mass; reject_mass; moisture_basis"
      collection_method: "Calibrated scales and reconciled batch records"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "At least 12 consecutive representative months or the full campaign for seasonal production"
      site_scope: "All lines producing the declared product at the site"
      aggregation_rule: "Sum compatible wet-mass records, reconcile by batch, then divide by net saleable product mass"
      quality_evidence: "Scale calibration; signed batch sheet; BOM revision; supplier and lot traceability; reconciliation residual"
    - protocol_id: cp_energy_and_runtime
      process_id: "dish_assembly_thermal_conditioning_packaging_and_storage"
      flow_role: "electricity, fuel, steam, heat, cooling, and compressed air"
      record_type: "Submeters, utility invoices, fuel stock, and equipment runtime"
      raw_fields: "meter_id; opening_reading; closing_reading; fuel_quantity; steam_quantity; runtime; rated_load; product_code; output_mass"
      collection_method: "Prefer submetering; otherwise allocate with a documented causal driver"
      unit: "kWh; MJ; kg fuel; h"
      frequency: "Batch, shift, or monthly meter period"
      temporal_coverage: "At least 12 consecutive representative months or full campaign"
      site_scope: "All foreground equipment and shared utilities included in the model"
      aggregation_rule: "Subtract meter readings, apply documented conversions, allocate shared use, and divide by saleable output"
      quality_evidence: "Meter calibration or invoice; conversion factor source; allocation-driver record; completeness reconciliation"
    - protocol_id: cp_temperature_and_storage
      process_id: "thermal_conditioning_packaging_and_storage"
      flow_role: "product condition and cold or ambient storage"
      record_type: "Validated route, logger, line control, and warehouse records"
      raw_fields: "batch_id; step; set_point; measured_temperature; start_time; end_time; storage_temperature; shelf_life; deviation"
      collection_method: "Calibrated sensors and retained route records"
      unit: "°C; min; h; day"
      frequency: "Each batch or validated continuous monitoring interval"
      temporal_coverage: "Representative reference period including seasonal extremes where relevant"
      site_scope: "All conditioning and storage zones serving the product"
      aggregation_rule: "Preserve batch profiles and calculate residence time from timestamps"
      quality_evidence: "Sensor calibration; route validation; deviation and corrective-action records"
    - protocol_id: cp_packaging_records
      process_id: "packaging_and_storage"
      flow_role: "packaging materials and line loss"
      record_type: "Packaging specification, purchase, issue, count, and scrap records"
      raw_fields: "component_id; material; unit_mass; units_issued; units_returned; scrap_mass; product_units; net_content"
      collection_method: "Component weighing plus issued-count and scrap reconciliation"
      unit: "kg; item"
      frequency: "Batch or packaging campaign"
      temporal_coverage: "At least 12 consecutive representative months or full campaign"
      site_scope: "All primary and allocated secondary packaging used for the product"
      aggregation_rule: "Component mass × net units consumed plus measured scrap, divided by net product mass"
      quality_evidence: "Approved packaging specification; scale calibration; purchase and scrap reconciliation"
    - protocol_id: cp_water_and_cleaning
      process_id: "sanitation_and_waste_management"
      flow_role: "sanitation water and cleaning agents"
      record_type: "Water meters, dosing logs, sanitation schedule, and chemical issue records"
      raw_fields: "meter_id; water_volume; agent_id; formulation_mass; solution_volume; concentration; cleaned_line; start_time; end_time"
      collection_method: "Submetering and controlled dosing records"
      unit: "kg; m3; L; %"
      frequency: "Each cleaning event or meter period"
      temporal_coverage: "At least 12 consecutive representative months or full campaign"
      site_scope: "All sanitation activities attributable to included lines"
      aggregation_rule: "Convert volume with measured or justified density, allocate shared events by causal driver, and divide by product mass"
      quality_evidence: "Meter calibration; dosing calibration; sanitation record; chemical inventory reconciliation"
    - protocol_id: cp_waste_and_wastewater
      process_id: "all_foreground_processes"
      flow_role: "food loss, packaging waste, wastewater, and treatment route"
      record_type: "Waste tickets, container weights, effluent meters, and disposal records"
      raw_fields: "waste_id; material; gross_mass; tare_mass; destination; effluent_volume; density; treatment_route; batch_or_period"
      collection_method: "Weighing and flow metering with destination reconciliation"
      unit: "kg; m3"
      frequency: "Batch, collection event, or meter period"
      temporal_coverage: "At least 12 consecutive representative months or full campaign"
      site_scope: "All foreground waste and effluent points"
      aggregation_rule: "Net gross-minus-tare mass or volume × density, allocate by documented driver, and divide by product mass"
      quality_evidence: "Scale or meter calibration; contractor ticket; treatment acceptance record; mass and water balance"
    - protocol_id: cp_refrigerant_inventory
      process_id: "thermal_conditioning_packaging_and_storage"
      flow_role: "direct refrigerant release"
      record_type: "Equipment register, charge, addition, recovery, and service records"
      raw_fields: "equipment_id; refrigerant_species; opening_charge; additions; recovered_mass; closing_charge; service_date; served_product_or_zone"
      collection_method: "Annual or campaign inventory balance by refrigerant species"
      unit: "kg"
      frequency: "Each service event and annual closure"
      temporal_coverage: "At least 12 consecutive representative months"
      site_scope: "Refrigeration equipment serving the product route"
      aggregation_rule: "Opening charge + additions - recovered mass - closing charge, allocated by documented cooling service driver"
      quality_evidence: "Certified service record; cylinder weights; equipment register; non-negative balance review"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = attributable foreground amount / net saleable product mass"
      inputs:
        - "Attributable amount"
        - "net saleable product mass in the same period"
      output: "Amount per 1 kg reference product"
      source_ids:
        - eu-commission-pef-2021
    - id: calc_batch_mass_balance
      applies_to: "Each production batch"
      rule: "total material input = saleable product + internal closing inventory change + measured food loss + wastewater-borne product solids + measured retained samples + unexplained residual; report water evaporation or uptake separately"
      inputs:
        - "Wet-basis ingredient"
        - water
        - transfer
        - product
        - waste
        - solids
        - "and inventory records"
      output: "Reconciled batch mass balance and residual"
      source_ids:
        - mass-balance-identity
    - id: calc_energy_allocation
      applies_to: "Shared energy services"
      rule: "attributable energy = total measured energy × documented causal-driver share; mass share is allowed only under allocation_mass_fallback"
      inputs:
        - "Metered energy"
        - "equipment time"
        - "metered sub-load"
        - volume-time
        - "or approved fallback driver"
      output: "Product-attributable kWh or MJ"
      source_ids:
        - eu-commission-pef-2021
    - id: calc_packaging_mass
      applies_to: "Packaging"
      rule: "packaging mass = sum(component unit mass × net components consumed) + allocated measured packaging scrap"
      inputs:
        - "Component specifications"
        - "counts issued and returned"
        - scrap
      output: "kg packaging per kg net product"
      source_ids:
        - mass-balance-identity
    - id: calc_refrigerant_loss
      applies_to: "Refrigeration equipment"
      rule: "refrigerant loss = opening charge + additions - recovered mass - closing charge; negative results require record correction and shall not be reported as emissions"
      inputs:
        - "Charge and service inventory by refrigerant species"
      output: "kg refrigerant emission allocated to product"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and batches"
      requirement: "Preserve product code, dish family, recipe/BOM revision, preparation state, storage state, packaging format, net content, shelf-life, manufacturing site, and reference period."
      evidence: "Approved product specification and batch traceability records; codex-cxc-1-1969-2022"
    - id: dq_temporal_coverage
      applies_to: "Foreground activity data"
      requirement: "Use at least 12 consecutive representative months unless the full production campaign is shorter; disclose shutdowns, new-product ramp-up, abnormal batches, and seasonal coverage."
      evidence: "Dated production, meter, purchasing, and waste records; eu-commission-pef-2021"
    - id: dq_measurement
      applies_to: "Mass, energy, water, temperature, and time"
      requirement: "Retain calibration or verification evidence for instruments and document every unit conversion, density, and allocation driver."
      evidence: "Calibration certificates, meter checks, conversion records; codex-cxc-1-1969-2022"
    - id: dq_completeness
      applies_to: "Process map and inventory"
      requirement: "Reconcile BOM, material, energy, water, packaging, waste, wastewater, and direct-release records to the included process map; quantify missing coverage and do not hide it as zero."
      evidence: "Completeness checklist, batch mass balances, utility reconciliation; eu-commission-pef-2021"
    - id: dq_representativeness
      applies_to: "Foreground and upstream datasets"
      requirement: "Assess technological, geographical, and time representativeness and precision; identify proxy datasets and material mismatches."
      evidence: "Data-quality assessment and proxy register; eu-commission-pef-2021"
    - id: dq_food_route_records
      applies_to: "Cooking, cooling, chilling, freezing, drying, storage, and packaging"
      requirement: "Retain route-specific time-temperature, moisture where relevant, packaging, allergen, deviation, and corrective-action evidence for the declared product state."
      evidence: "Validated route and batch records; codex-cxc-1-1969-2022"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The product-flow UUID shall equal 6ff6840a-8860-4e91-be9a-40d993df7105, the reference flow property shall be Mass 93a60a56-a3c8-11da-a746-0800200b9a66, the unit group shall be Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and the reference unit shall be kg."
    source_ids: []
  - rule_id: validate_reference_amount
    applies_to: "Reference output"
    rule: "Net saleable food product shall equal 1 kg; packaging mass shall be reported separately and shall not be included in the reference mass."
    source_ids:
      - eu-commission-pef-2021
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Every required qualifier in section 3 shall be present and internally consistent with the product specification and process route."
    source_ids:
      - codex-cxc-1-1969-2022
  - rule_id: validate_process_route
    applies_to: "Process map"
    rule: "Every required process shall have inventory coverage; thermal_conditioning shall be included or explicitly marked not applicable with the declared ready-to-eat/reheat/further-cooking and ambient/chilled/frozen route."
    source_ids:
      - codex-cxc-1-1969-2022
  - rule_id: validate_mass_balance
    applies_to: "Batch and annual foreground inventory"
    rule: "Inputs, product, measured losses, moisture change, wastewater-borne product material, and inventory change shall reconcile; report the residual and investigate material unexplained residuals rather than forcing closure."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_energy_water_waste_coverage
    applies_to: "Foreground inventory"
    rule: "Electricity, thermal energy, direct-contact water, sanitation water, packaging, food loss, packaging waste, wastewater, and direct refrigerant release shall each be quantified or explicitly documented as not applicable."
    source_ids:
      - eu-commission-pef-2021
      - codex-cxc-1-1969-2022
  - rule_id: validate_allocation
    applies_to: "Shared processes and co-products"
    rule: "Allocation shall follow the ordered rules in section 7 and disclose driver, denominator, period, co-products, waste classification, and any sensitivity test."
    source_ids:
      - eu-commission-pef-2021
  - rule_id: validate_data_quality
    applies_to: "Foreground and upstream data"
    rule: "Temporal, technological, geographical, precision, completeness, measurement, and proxy evidence shall be reported; missing data shall be disclosed as gaps rather than entered as zero."
    source_ids:
      - eu-commission-pef-2021
  - rule_id: validate_temporary_ranges
    applies_to: "All reasoned_estimate ranges"
    rule: "Treat each provisional range only as a QA screen; a foreground value outside the range requires review and explanation, while a value inside the range does not establish correctness. Replace these ranges with reviewed source-backed evidence before publication-critical use."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-production dataset for a declared prepared stuffed-pasta, noodle, dumpling, or couscous dish"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product carbon footprint or LCA models that need factory-gate manufacture of a product matching the declared recipe, preparation state, storage state, geography, period, and packaging format"
  excluded_use: "Agricultural or ingredient production without upstream datasets; generic restaurant meals; consumer cooking or reheating; distribution, retail, food loss after factory gate, or packaging end of life unless added separately; nutrition or food-safety certification"
  required_metadata: "PCR id and version when published; product-flow UUID; product code; recipe/BOM revision; dish family; filling share where applicable; preparation state; ambient/chilled/frozen state and temperature; net mass; packaging composition; shelf-life; site geography; reference period; technology route; allocation; upstream dataset versions"
  required_quality_disclosure: "Foreground coverage; temporal, geographical, and technological representativeness; precision; completeness; instrument calibration; mass-balance residual; allocation drivers; proxies; cut-offs; data gaps; temporary estimates; review status"
  update_trigger: "Recipe or filling change; change in cooking, cooling, freezing, drying, packaging, sanitation, or storage technology; new site or geography; material change in energy or water supply; shelf-life or product-state change; allocation change; data older than the declared representativeness period; replacement of a temporary estimate with reviewed evidence"
