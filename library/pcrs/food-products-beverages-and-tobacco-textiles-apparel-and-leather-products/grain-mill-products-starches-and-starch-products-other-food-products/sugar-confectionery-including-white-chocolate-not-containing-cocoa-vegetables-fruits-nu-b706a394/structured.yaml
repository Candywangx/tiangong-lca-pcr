allocation_rules:
  - rule_id: alloc_avoid_by_subdivision
    applies_to: "independently measurable products, routes and batches"
    rule: "Avoid allocation by subdividing lines, batches, route processes and directly metered utilities wherever records permit."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_physical_relationship
    applies_to: "inseparable multi-output operations"
    rule: "If subdivision or justified system expansion is not possible, allocate by a documented causal physical relationship such as recipe mass, measured processing time, energy demand or another parameter that represents the shared operation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_other_relationship
    applies_to: "operations lacking a defensible physical relationship"
    rule: "Use another relationship, including relative economic value at the point of co-production, only after documenting why subdivision, expansion and physical allocation are not representative; disclose prices, period and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_internal_rework
    applies_to: "rework, returned syrup, recovered starch and internal residues"
    rule: "Treat verified internal recovery as an internal transfer: subtract it from waste and do not create a co-product credit or duplicate upstream burden."
    source_ids:
      - uk-ea-pontefract-confectionery-2016
      - eu-fdm-bat-2019-2031
  - rule_id: alloc_waste_and_coproduct_status
    applies_to: "residues leaving the foreground system"
    rule: "Classify a stream as waste, recyclable residue or co-product according to its actual destination and economic/function status; document any burden or credit applied by the downstream modelling scheme."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: alloc_shared_site_services
    applies_to: "cleaning, boiler, cooling, compressed air and common utilities"
    rule: "Prefer submetering; otherwise use a documented causal driver and exclude unrelated product families, non-production buildings and periods outside the reporting scope."
    source_ids:
      - eu-fdm-bat-2019-2031
dataset_production:
  collection_protocols:
    - protocol_id: cp_ingredient_records
      process_id: "ingredient_receipt"
      flow_role: "purchased ingredients, internal releases and rejects"
      record_type: "purchase, inventory, scale, tank and batch issue records"
      raw_fields: "material_id; supplier; received_state; opening_stock; receipts; closing_stock; returns; issued_mass; reject_mass; destination"
      collection_method: "Reconcile calibrated scales, tank levels and inventory records by material and lot."
      unit: "kg"
      frequency: "each receipt and batch; monthly reconciliation"
      temporal_coverage: "full declared reporting period"
      site_scope: "all receiving and storage areas serving included products"
      aggregation_rule: "opening + receipts - closing - returns = issues + rejects + unexplained difference; normalize through saleable output"
      quality_evidence: "calibration records; lot traceability; inventory reconciliation; reject tickets"
    - protocol_id: cp_sugar_route_records
      process_id: "sugar_confectionery_manufacture"
      flow_role: "recipe inputs, water, energy, output, rework and waste"
      record_type: "batch sheet, meter, equipment log and quality release record"
      raw_fields: "batch_id; recipe_id; ingredient_mass; water_volume; energy_by_carrier; temperature; time; output_mass; rework_mass; waste_mass; destination"
      collection_method: "Collect per batch or homogeneous campaign and reconcile against route output."
      unit: "kg; m3; kWh; MJ; °C; h"
      frequency: "each batch or campaign"
      temporal_coverage: "representative full reporting period including product mix"
      site_scope: "all included sugar-confectionery lines"
      aggregation_rule: "aggregate separately by route and product family, then production-weight by released net mass"
      quality_evidence: "meter/calibration status; signed batch sheets; release tests; waste tickets"
    - protocol_id: cp_fruit_route_records
      process_id: "sugar_preserved_plant_manufacture"
      flow_role: "plant inputs, syrup, water, energy, soluble solids/moisture, output and wastes"
      record_type: "batch, refractometer, moisture, meter and waste records"
      raw_fields: "batch_id; plant_mass; sugar_mass; syrup_mass; water_volume; energy_by_carrier; Brix; moisture; soak_time; output_mass; spent_syrup; solid_waste; wastewater"
      collection_method: "Collect each impregnation/drying batch and preserve staged syrup and endpoint records."
      unit: "kg; m3; kWh; MJ; °Brix; mass %; h"
      frequency: "each batch"
      temporal_coverage: "full declared production season or reporting period"
      site_scope: "all included sugar-preservation lines"
      aggregation_rule: "reconcile plant, sugar, syrup, water removal, retained product, reuse and waste; normalize by conforming output"
      quality_evidence: "instrument calibration; batch traceability; endpoint test; waste and effluent records"
    - protocol_id: cp_white_route_records
      process_id: "white_chocolate_manufacture"
      flow_role: "formulation, energy, output, rework and waste"
      record_type: "recipe, batch, meter, composition and release records"
      raw_fields: "batch_id; ingredient_mass; cocoa_butter_fraction; milk_solids_fraction; energy_by_carrier; process_time; output_mass; rework_mass; waste_mass"
      collection_method: "Collect each batch or homogeneous campaign and verify the declared white-chocolate specification."
      unit: "kg; kWh; MJ; mass %; h"
      frequency: "each batch or campaign"
      temporal_coverage: "full declared reporting period"
      site_scope: "all included white-chocolate lines"
      aggregation_rule: "aggregate by formulation family, reconcile mass and normalize by conforming output"
      quality_evidence: "recipe authorization; composition evidence; meter status; release record"
    - protocol_id: cp_packaging_site_records
      process_id: "packaging_and_site_services"
      flow_role: "packaging, saleable output, cleaning, shared utilities, wastewater, emissions and refrigerants"
      record_type: "packaging issue, production release, utility meter, cleaning, waste, effluent, fuel and refrigerant records"
      raw_fields: "product_mass; packaging_material_mass; packaging_waste; water_volume; chemical_mass; energy_by_carrier; fuel_use; wastewater_volume; treatment_destination; refrigerant_stock; additions; recovery; emission_factor"
      collection_method: "Combine line records with calibrated site/submeters and documented allocation drivers; retain carrier and destination detail."
      unit: "kg; m3; kWh; MJ"
      frequency: "batch or shift for output and packaging; meter interval for utilities; each service event"
      temporal_coverage: "full declared reporting period"
      site_scope: "all directly controlled site services attributable to included products"
      aggregation_rule: "reconcile net output and packaging; allocate shared services causally; calculate direct emissions and normalize to 1 kg net saleable output"
      quality_evidence: "meter/calibration certificates; invoices; release records; cleaning logs; waste manifests; refrigerant service logs"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = reporting-period amount attributable to included products / reporting-period net saleable included product mass"
      inputs:
        - "attributable row amount"
        - "net saleable output mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_route_mass_balance
      applies_to: "each manufacturing route"
      rule: "input mass + opening work-in-process = conforming output + waste + material releases to water/air + closing work-in-process + documented difference; explain material imbalance"
      inputs:
        - ingredient
        - water-in-product
        - output
        - rework
        - waste
        - "inventory and release records"
      output: "route mass-balance statement and unexplained difference"
      source_ids:
        - eu-fdm-bat-2019-2031
        - eu-pef-2021-2279
    - id: calc_energy_by_carrier
      applies_to: "route and site energy"
      rule: "preserve measured carrier units; where attribution is required, attributable energy = metered total × documented causal share; record conversion factor and source"
      inputs:
        - "meter totals"
        - carrier
        - "operating driver"
        - "conversion factor"
      output: "carrier-specific kWh or MJ per reference flow"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_water_effluent_balance
      applies_to: "process water and wastewater"
      rule: "reconcile incoming metered water with water retained in product, evaporation, separately discharged non-contact water, wastewater and documented difference"
      inputs:
        - "water meters"
        - "product moisture"
        - "evaporation estimate"
        - "wastewater meters"
      output: "water-use and wastewater amount per reference flow"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_refrigerant_loss
      applies_to: "cooling and refrigeration"
      rule: "loss = opening stock + additions - closing stock - recovered quantity - documented transfers; report negative or unexplained balances as findings"
      inputs:
        - "refrigerant stock and service records"
      output: "kg loss by refrigerant substance per reference flow"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_allocation_share
      applies_to: "shared multi-product processes"
      rule: "calculate the declared allocation share from directly attributable records or the selected physical/economic driver; shares across outputs shall sum to 1 within rounding tolerance"
      inputs:
        - "process totals"
        - "product-specific records"
        - "allocation driver"
      output: "attributable inventory by product family"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and route"
      requirement: "Use the specified product-flow UUID, Mass property and kg unit; declare route, formulation/product subclass, packaging state and manufacturing geography."
      evidence: "Tiangong identity readback; product master; approved recipe; release specification"
    - id: dq_completeness
      applies_to: "foreground process map"
      requirement: "Cover both required processes and every applicable conditional route; record raw materials, water, energy, residues, wastewater, direct air releases and monitoring level appropriate to the process."
      evidence: "eu-fdm-bat-2019-2031; process flow sheet; inventory reconciliation"
    - id: dq_representativeness
      applies_to: "primary and secondary data"
      requirement: "Disclose technological, geographical and time representativeness, precision and completeness; justify proxies and route aggregation."
      evidence: "eu-pef-2021-2279; dataset metadata; proxy register"
    - id: dq_temporal_coverage
      applies_to: "foreground records"
      requirement: "Cover the declared reporting period and representative product/season mix; disclose shutdowns, trials, abnormal events and missing intervals."
      evidence: "dated meter, batch, inventory and production records"
    - id: dq_measurement
      applies_to: "meters, scales and analytical controls"
      requirement: "Retain calibration/verification status, measurement method, unit and conversion factors for mass, water, energy, temperature, soluble solids and moisture measurements used."
      evidence: "calibration certificates; instrument logs; laboratory or in-line test records"
    - id: dq_mass_and_water_balance
      applies_to: "route and site reconciliations"
      requirement: "Quantify and explain imbalances rather than forcing closure; identify inventory change, evaporation, wastewater and unrecovered losses."
      evidence: "mass-balance and water-balance calculations; reviewer sign-off"
    - id: dq_effluent_and_emissions
      applies_to: "relevant wastewater and waste-gas streams"
      requirement: "Record flow and relevant characteristics at an appropriate frequency and location; preserve treatment destination and the basis for any calculated pollutant flow."
      evidence: "eu-fdm-bat-2019-2031; meter, sampling, laboratory and treatment records"
    - id: dq_provisional_ranges
      applies_to: "all reasoned-estimate ranges"
      requirement: "Treat every reasoned_estimate range as a replaceable screening guardrail, never as a measured value or publication-critical allowed range."
      evidence: "manifest review metadata; foreground records; future reviewed category evidence"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the exact Tiangong product UUID, Mass property UUID, mass unit-group UUID, kg unit and exactly 1 kg net product excluding packaging."
    source_ids: []
  - rule_id: val_category_and_route
    applies_to: "product identity"
    rule: "Confirm the product is within the covered semantic boundary, all required qualifiers are declared, and at least one applicable route is included; reject undeclared mixing of materially different routes."
    source_ids:
      - codex-gsfa-confectionery-2025
      - codex-gsfa-candied-fruit-2025
      - codex-cxs-87-1981
  - rule_id: val_process_coverage
    applies_to: "foreground inventory"
    rule: "Confirm both required processes and every applicable conditional process have detailed inventory records, collection protocols and calculation links."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: val_mass_water_energy
    applies_to: "quantitative inventory"
    rule: "Recalculate route mass balances, water/effluent reconciliation and carrier-specific energy normalization; flag unexplained imbalance, mixed carriers or missing conversion evidence."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: val_rework_waste_and_emissions
    applies_to: "output classification"
    rule: "Confirm internal rework is not counted as waste or a new input, waste destinations are declared, and direct combustion and refrigerant releases are not duplicated with upstream datasets."
    source_ids:
      - uk-ea-pontefract-confectionery-2016
      - eu-fdm-bat-2019-2031
  - rule_id: val_allocation
    applies_to: "multi-product and shared services"
    rule: "Confirm the allocation hierarchy was followed, shares sum to 1 within declared rounding, causal drivers and exclusions are documented, and any economic allocation includes price period and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_cutoff_and_sources
    applies_to: "completeness and evidence"
    rule: "Reject implicit cut-offs in required foreground rows; disclose downstream-scheme omissions and verify every external source id resolves to section 11 while reasoned estimates carry no invented source."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_data_quality
    applies_to: "dataset readiness"
    rule: "Confirm reporting-period coverage, calibration and traceability evidence, route/geography/technology representativeness, proxy disclosure, and explicit treatment of provisional ranges and unresolved data gaps."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
published_dataset_profile:
  dataset_role: "Foreground plant-gate production dataset for a declared sugar-confectionery, sugar-preserved plant, white-chocolate route, or documented production-weighted route mix."
  downstream_use: "secondary_dataset; background_dataset after review and publication controls required by the consuming system."
  allowed_use: "Construction of process or lifecyclemodel inventories for products matching the declared semantic scope, route, geography, technology, reporting period and packaging state; hotspot and improvement analysis with disclosed limitations."
  excluded_use: "Unqualified substitution for cocoa-containing chocolate, bakery or flour confectionery, raw sugar, non-sugar-preserved fruit products, agricultural production, distribution, retail, use or end-of-life; comparative public claims without applicable verification."
  required_metadata: "PCR id and version used by the consuming package; reference UUID and unit; product subclass; formulation/route; product state; packaging boundary; site geography; technology; reporting period; route mix; allocation; rework; cut-offs/omissions; linked datasets; source ids; proxy and uncertainty disclosures."
  required_quality_disclosure: "Primary-data coverage and gaps; meter and calibration status; mass/water/energy reconciliation; representativeness; allocation drivers; waste/effluent destinations; emission calculations; all provisional reasoned estimates; review and verification status."
  update_trigger: "Material change in formulation, route, equipment, energy supply, cooling/refrigerant system, packaging, waste or effluent treatment, allocation, production mix or geography; expiry of representativeness; new reviewed category evidence; correction of UUID or classification scope."
