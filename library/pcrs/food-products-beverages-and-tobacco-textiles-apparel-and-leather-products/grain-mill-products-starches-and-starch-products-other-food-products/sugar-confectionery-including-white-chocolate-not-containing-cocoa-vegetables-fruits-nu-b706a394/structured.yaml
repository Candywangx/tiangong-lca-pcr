      name: "Temperature, moisture content, or soluble solids as applicable"
      uuid: ""
    required_unit: "°C, mass %, or °Brix"
    rule: "Preserve the measured route control variable and method. FAO route values are process guidance, not default inventory amounts: boiling temperature depends on confectionery type, while candied fruit uses staged syrup-strength increase and drying; declare the actual recipe target and measurement basis."
