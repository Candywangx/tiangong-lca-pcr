system_boundary:
  rules:
    - rule_id: sb_foreground_gate_to_gate
      applies_to: "all foreground packages"
      rule: "Include receipt and storage, ingredient preparation, every applicable manufacturing route step, forming/finishing, packaging, cleaning, directly controlled utilities, on-site waste and effluent handling, and direct releases up to the manufacturing gate."
      source_ids:
        - fao-sugar-confectionery-1992
        - uk-ea-pontefract-confectionery-2016
    - rule_id: sb_route_selection
      applies_to: "route-specific manufacturing"
      rule: "Include at least one declared manufacturing route and retain separate route records whenever production technologies or formulations would be obscured by aggregation."
      source_ids:
        - fao-sugar-confectionery-1992
        - fao-candied-fruit-2004
        - codex-cxs-87-1981
    - rule_id: sb_upstream_linking
      applies_to: "purchased inputs and outsourced operations"
      rule: "Keep purchased inputs visible and link them to representative upstream datasets; do not absorb their upstream production into untraceable site totals."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_no_double_counting
      applies_to: "rework and same-category intermediate products"
      rule: "Track internal rework and intermediate transfers without creating a second product input; apply the recursive input rule only to purchased or externally supplied same-category material."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_no_implicit_cutoff
      applies_to: "required foreground inventory"
      rule: "Do not cut off mandatory material, energy, water, waste, effluent or direct-emission rows in the first foreground package. Any permitted omission under a downstream scheme shall be quantified, justified and disclosed outside the foreground package."
      source_ids:
        - eu-pef-2021-2279
        - eu-fdm-bat-2019-2031
