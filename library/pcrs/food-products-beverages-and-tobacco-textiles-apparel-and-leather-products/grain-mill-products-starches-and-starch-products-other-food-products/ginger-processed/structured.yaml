  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground exchanges"
      rule: "normalized amount = reconciled route-specific exchange amount / net conforming processed ginger mass released on the declared basis"
      inputs:
        - "reconciled exchange amount"
        - "released net product mass"
      output: "exchange amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_brine_mass_disclosure
      applies_to: "ginger in brine"
      rule: "report net contents and drained ginger mass separately; calculate drained fraction only from measured container net and drained masses"
      inputs:
        - "measured net contents"
        - "measured drained ginger mass"
      output: "declared brine-route mass descriptors"
      source_ids:
        - codex-cxs-260-2007
    - id: calc_mass_balance
      applies_to: "each production batch"
      rule: "mass-balance difference = total measured product inputs - total measured product outputs - measured waste outputs - calculated elementary mass transfers"
      inputs:
        - "route-specific inputs"
        - products
        - wastes
        - "measured or calculated mass transfers"
      output: "batch mass-balance difference"
      source_ids:
        - fao-ginger-postharvest-operations
        - eu-pef-2021-2279
    - id: calc_combustion_emissions
      applies_to: "each fired utility"
      rule: "emission mass = measured fuel quantity × site-specific or documented supplier/regulatory emission factor; keep CO2, NO, NO2, SO2 and PM2.5 separate"
      inputs:
        - "fuel quantity"
        - "fuel property"
        - "factor provenance"
      output: "individual combustion emission mass"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_refrigerant_loss
      applies_to: "each refrigerant circuit"
      rule: "refrigerant loss = opening stock + additions - closing stock - documented recovery; calculate each refrigerant separately"
      inputs:
        - "opening stock"
        - additions
        - "closing stock"
        - recovery
      output: "individual refrigerant emission mass"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_wastewater_load
      applies_to: "each discharged pollutant"
      rule: "pollutant load = measured wastewater volume × representative measured concentration, with sampling period and method aligned"
      inputs:
        - "stream volume"
        - "pollutant concentration"
        - "sampling period"
      output: "individual pollutant mass"
      source_ids:
        - eu-fdm-bat-2019-2031
  data_quality_requirements:
    - id: dq_route_representativeness
      applies_to: "all activity data"
      requirement: "Data shall represent the declared site, line, route, raw-material state, product form, particle-size specification and package; mixed-route averages are not representative."
      evidence: "route key, batch genealogy and production dates"
    - id: dq_temporal_coverage
      applies_to: "foreground records"
      requirement: "Use a disclosed consecutive period covering normal operation and relevant cleaning cycles; disclose shutdowns, trials and abnormal batches."
      evidence: "dated meter intervals, batch records and cleaning logs"
    - id: dq_metering
      applies_to: "utilities and water"
      requirement: "Retain calibrated meter or invoice evidence and document any causal allocation from a shared meter."
      evidence: "calibration certificates, invoices, sub-meter records and allocation worksheet"
    - id: dq_mass_and_quality
      applies_to: "ginger products"
      requirement: "Retain scales, moisture tests, particle-size results and brine net/drained-mass checks appropriate to the locked product specification."
      evidence: "scale checks, laboratory methods, certificates of analysis and release records"
    - id: dq_waste_and_emissions
      applies_to: "wastes and emissions"
      requirement: "Retain waste tickets, wastewater flow and concentration records, emission-factor provenance and refrigerant service logs."
      evidence: "tickets, laboratory reports, monitoring reports and service logs"
    - id: dq_verification
      applies_to: "complete data package"
      requirement: "An independent reviewer shall verify route exclusivity, source traceability, formula implementation, mass balance, allocation and bilingual machine-field alignment."
      evidence: "signed review checklist and resolved findings"
validation_rules:
  - rule_id: val_identity
    applies_to: "product identity"
    rule: "Confirm CPC 23927 processed ginger and reject raw ginger, ginger oil, oleoresin, preserved confectionery products and any product outside the declared dry or brine form."
    source_ids:
      - un-cpc-3-0-2025
      - codex-cxs-343-2021
      - codex-cxs-260-2007
  - rule_id: val_route_exclusivity
    applies_to: "route metadata"
    rule: "Require exactly one route token, one raw-material state, one preparation style, one final product form and one packaging specification; reject dry/brine averages."
    source_ids:
      - codex-cxs-343-2021
      - codex-cxs-260-2007
      - eu-pef-2021-2279
  - rule_id: val_reference_uuid
    applies_to: "reference flow identity"
    rule: "Require the reference product UUID, Mass flow-property UUID, Units-of-mass unit-group UUID and kg unit to match the PCR reference definition."
    source_ids: []
  - rule_id: val_reference_mass
    applies_to: "reference amount"
    rule: "Normalize to 1 kg net conforming processed ginger excluding packaging; for ginger in brine also disclose net contents, packing-medium treatment and drained ginger mass."
    source_ids:
      - codex-cxs-260-2007
      - eu-fdm-bat-2019-2031
  - rule_id: val_atomic_inventory
    applies_to: "inventory exchanges"
    rule: "Require one specific exchange per row; reject selector or collection labels and require every unresolved non-reference UUID to remain blank and closed by manifest review metadata."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_primary_data
    applies_to: "foreground amounts"
    rule: "Require foreground_record or calculated_value from collected foreground records; reject undocumented defaults, ranges and reasoned estimates."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-pef-2021-2279
  - rule_id: val_mass_balance
    applies_to: "route mass balance"
    rule: "Require a reconciled batch mass balance and an explanation of losses, moisture removal, packing medium, residues and wastewater solids."
    source_ids:
      - fao-ginger-postharvest-operations
      - eu-pef-2021-2279
  - rule_id: val_utility_and_emissions
    applies_to: "utilities and emissions"
    rule: "Require stage-specific electricity, steam, hot water, each fuel, refrigerant, wastewater stream, pollutant and air emission actually present; require explicit non-applicability evidence for omitted conditional exchanges."
    source_ids:
      - jrc-fdm-bref-2019
      - eu-fdm-bat-2019-2031
  - rule_id: val_additives
    applies_to: "brine formulation"
    rule: "For each acid or preservative, require actual dose records, ingredient identity and current product/jurisdiction authorisation; Codex category permission is not a default recipe."
    source_ids:
      - codex-cxs-260-2007
      - codex-gsfa-04-2-2-3-2025
  - rule_id: val_bilingual_structure
    applies_to: "bilingual record"
    rule: "Require identical process_id, row_id, selected-flow identity, UUID, controlled tokens, collection protocol and source-id order in English and Chinese."
    source_ids: []
published_dataset_profile:
  dataset_role: "A site-specific foreground data package for one locked processed-ginger route and product specification."
  downstream_use: "Construction of processed-ginger product flows, unit processes and lifecycle models, and subsequent LCA studies with an explicit boundary."
  allowed_use: "Use when route, raw-material state, product form, mass basis, site, data period, packaging and data quality match the target study."
  excluded_use: "Do not use as a mixed dry/brine average, for raw ginger, ginger oil, oleoresin or candied ginger, or as a PCR-supplied industry-default inventory."
  required_metadata: "CPC; reference UUID; route; botanical identity; raw-material state; preparation style; product form; moisture or brine mass basis; particle size; packaging; site; line; data period; technology; allocation; cut-offs; upstream links."
  required_quality_disclosure: "coverage period, batch count, meters and calibration, laboratory methods, mass-balance difference, shared-service allocation, waste destinations, emission-factor provenance, unresolved UUIDs and verification status."
  update_trigger: "Material change in route, raw-material state, formulation, additive authorisation, equipment, heat carrier, fuel, refrigerant, packaging, site, quality specification or representative data period."
data_sources:
  - id: "un-cpc-3-0-2025"
    type: "standard"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0; retained repository row 23927,\"Ginger, processed\" in classifications/systems/cpc/3.0/raw/CPC_Ver_3.0_Structure_30Jun2025.csv; [official classification entry](https://unstats.un.org/unsd/classifications/Family/Detail/2107)."
    used_for: "Defines the exact CPC 23927 identity and distinguishes processed ginger from raw ginger."
  - id: "codex-cxs-343-2021"
    type: "standard"
    reference: "Codex Alimentarius, CXS 343-2021, Standard for Dried or Dehydrated Ginger, amended 2025; [official PDF](https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXS%2B343-2021%2FCXS_343e.pdf)."
    used_for: "Supports dried-ginger botanical identity, whole/piece/crushed/ground forms, hygiene, style declaration and conditional calcium-oxide processing-aid treatment; no quality limit is used as an LCI default."
  - id: "codex-cxs-260-2007"
    type: "standard"
    reference: "Codex Alimentarius, CXS 260-2007, Standard for Pickled Fruits and Vegetables; [official PDF](https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXS%2B260-2007%2FCXS_260e.pdf)."
    used_for: "Supports ginger in brine, packing-medium identity, salt and acidic-medium formulation, hygiene, net/drained-mass disclosure and product naming."
  - id: "codex-gsfa-04-2-2-3-2025"
    type: "dataset"
    reference: "Codex GSFA Online, food category 04.2.2.3, updated through CAC48 (2025); [official category page](https://www.fao.org/gsfaonline/foods/details.html?id=80)."
    used_for: "Confirms pickled ginger within the brined-vegetable category and identifies current category provisions for benzoates and sorbates; the site formula and applicable market law remain controlling."
  - id: "codex-cxc-75-2015"
    type: "official_guidance"
    reference: "Codex Alimentarius, CXC 75-2015, Code of Hygienic Practice for Low-Moisture Foods, Annex III for spices; [official PDF](https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXC%2B75-2015%2FCXC_075e.pdf)."
    used_for: "Supports controlled dry-area cleaning, dry residue removal, vacuum or filtered-air cleaning and conditional wet or alcohol-based sanitation for dried spice processing."
  - id: "fao-ginger-postharvest-operations"
    type: "extension_guidance"
    reference: "FAO INPhO, *Ginger: Post-harvest Operations*; [official PDF](https://www.fao.org/fileadmin/user_upload/inpho/docs/Post_Harvest_Compendium_-_Ginger.pdf)."
    used_for: "Supports receiving, debris/shoot/root removal, washing, scalding, scraping/peeling/slicing, calcium-oxide bleaching, drying, air screening, size reduction, grading and specific dry-product packaging forms; example quantities are not adopted as defaults."
  - id: "jrc-fdm-bref-2019"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, *Best Available Techniques (BAT) Reference Document for the Food, Drink and Milk Industries*, JRC118627, DOI [10.2760/243911](https://doi.org/10.2760/243911); [JRC record](https://publications.jrc.ec.europa.eu/repository/handle/JRC118627)."
    used_for: "Supports food-processing utilities, water and energy inventories, cleaning, refrigeration, waste, wastewater and air-emission process structure without category-default inventory amounts."
  - id: "eu-fdm-bat-2019-2031"
    type: "standard"
    reference: "Commission Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries; [EUR-Lex full text](https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj)."
    used_for: "Requires inventories of water, energy, raw materials, wastewater and waste gas; supports separate COD, BOD, TOC, TSS, TN, TP, chloride, dust, NOx and SOx records, refrigeration controls and measured/calculated monitoring."
  - id: "eu-pef-2021-2279"
    type: "method_factor"
    reference: "Commission Recommendation (EU) 2021/2279 on Environmental Footprint methods; [EUR-Lex full text](https://eur-lex.europa.eu/eli/reco/2021/2279/oj/eng)."
    used_for: "Requires product-specific bills of materials and company-specific manufacturing data, complete LCI, transparent allocation, data quality, reporting and verification."
