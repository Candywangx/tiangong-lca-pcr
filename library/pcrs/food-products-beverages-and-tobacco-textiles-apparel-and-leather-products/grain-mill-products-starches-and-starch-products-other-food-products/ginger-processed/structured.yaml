product_category_identity:
  canonical_pcr_id: "pcr.food-products-beverages-and-tobacco-textiles-apparel-and-leather-products.grain-mill-products-starches-and-starch-products-other-food-products.ginger-processed"
  classification_refs: "CPC 3.0: 23927 — Ginger, processed"
  covered_products: "Dried or dehydrated ginger in whole, piece/cut/diced/sliced, crushed, ground or powdered form; and ginger in brine."
  excluded_products: "Raw or otherwise unprocessed ginger; ginger essential oil or oleoresin; candied ginger; and products outside the declared dry or brine form."
  representative_product: "Site-specific processed ginger with one locked raw-material state, route, form, particle-size or brine specification, and package."
  production_route: "Mutually exclusive: dry processing; or preservation in brine. Dry and brined products shall not be averaged."
  market_state: "Packaged to the declared specification, quality-released, and at the processing-site gate."
functional_unit:
  what: "Processed ginger meeting the declared release specification under one locked dry or brine route."
  how_much: "1 kg net conforming product, excluding packaging mass. A brine route uses the declared sold-product net-content basis and separately reports drained ginger mass."
  how_well: "Meets the declared botanical identity, product form, moisture or packing-medium, particle-size, hygiene, additive-authorisation and packaging specification."
  how_long_or_cycle: "One traceable production batch at quality release from the processing site."
  reference_flow_link: "reference_processed_ginger"
system_boundary:
  rules:
    - rule_id: sb_route_lock
      applies_to: "all foreground packages"
      rule: "Use exactly one dry-processing route or one ginger-in-brine route per data package; never average their raw materials, utilities, yields, packaging, wastes or emissions."
      source_ids:
        - un-cpc-3-0-2025
        - codex-cxs-343-2021
        - codex-cxs-260-2007
    - rule_id: sb_foreground_gate
      applies_to: "foreground system"
      rule: "Start at receipt of the declared ginger state at the processing site and include controlled preparation, preservation, packaging, cleaning and conditional on-site wastewater treatment."
      source_ids:
        - fao-ginger-postharvest-operations
        - jrc-fdm-bref-2019
        - eu-fdm-bat-2019-2031
    - rule_id: sb_upstream_links
      applies_to: "purchased products"
      rule: "Keep cultivation, purchased-ginger production, ingredient manufacture, packaging manufacture, electricity, heat, fuel and refrigerant production outside the foreground and link each purchased input to an upstream dataset."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_downstream_exclusion
      applies_to: "downstream stages"
      rule: "Exclude outbound distribution, retail, preparation or consumption and end-of-life from the foreground; disclose any broader study boundary separately."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_recursive_input
      applies_to: "same-category purchased dried ginger"
      rule: "When purchased dried ginger within the same processed-ginger category is used for a grinding-only route, retain it as a visible product input and link an independently bounded upstream dataset rather than recursively expanding this PCR."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_release_basis
      applies_to: "reference product release"
      rule: "Include only net conforming processed ginger in the reference amount; packaging mass is excluded, while brine is included only when the declared sold product and net-content basis include it."
      source_ids:
        - codex-cxs-260-2007
        - eu-fdm-bat-2019-2031
boundary_abstraction:
  declared_starting_condition: "The declared ginger input state has been received, weighed and batch-identified at the processing site."
  starting_condition_role: "Foreground gate: cultivation, supplier processing and inbound transport are represented by appropriate upstream datasets."
  product_classification_scope: "CPC 23927 processed ginger, limited to the dry form or ginger-in-brine form declared under this PCR."
  recursive_input_rule: "Retain purchased dried ginger as a visible same-category product input and link an independently bounded upstream dataset; do not recursively expand this PCR."
  upstream_dataset_requirement: "Link every purchased ginger input, ingredient, package, utility, fuel and refrigerant to an upstream dataset matching the actual product and supply market."
  disclosure: "Declare site, line, route, material state, batches, data period, packaging, cut-offs, shared-service allocation and off-site treatment boundary."
