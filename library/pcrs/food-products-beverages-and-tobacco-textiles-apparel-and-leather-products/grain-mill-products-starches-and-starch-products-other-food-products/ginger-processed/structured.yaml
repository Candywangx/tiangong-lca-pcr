allocation_rules:
  - rule_id: alloc_route_subdivision
    applies_to: "shared or alternative routes"
    rule: "Subdivide dry processing and brine processing, and further subdivide distinct product forms, before allocating any shared burden; a combined average is non-conforming."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_direct_measurement
    applies_to: "directly metered exchanges"
    rule: "Assign directly measured raw materials, utilities, wastes and emissions to the batch or line that generated them."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-pef-2021-2279
  - rule_id: alloc_shared_services
    applies_to: "shared utilities and cleaning"
    rule: "For an unavoidable shared exchange, use a documented physical causal driver such as sub-metered energy, equipment operating time, cleaned surface-time or measured wastewater volume; disclose the driver and do not impose a PCR default factor."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-pef-2021-2279
  - rule_id: alloc_residues
    applies_to: "ginger residues and off-spec material"
    rule: "Treat peel, screenings, dust, off-spec ginger and spent brine as waste unless documented records show a marketable co-product; if a co-product exists, disclose the physical relationship and allocation method without applying an unverified avoided-burden credit."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_mass_balance
    applies_to: "all product and residue outputs"
    rule: "Reconcile route-specific input mass to conforming product, retained packing medium, water removed, product residues, wastewater solids and recorded losses before normalization."
    source_ids:
      - fao-ginger-postharvest-operations
      - eu-pef-2021-2279
