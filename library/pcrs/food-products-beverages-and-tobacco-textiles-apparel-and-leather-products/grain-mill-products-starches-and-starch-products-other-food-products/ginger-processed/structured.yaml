process_map:
  - id: route_scope_receiving
    name: "Route and raw-material lock; receiving"
    inclusion: "required"
    inclusion_condition: "Every data package must declare one route, one raw-ginger input state or purchased dried-ginger state, product form, particle size where relevant, and package specification."
    role: "foreground gate"
    quantitative_reference: "1 kg net conforming processed ginger output"
  - id: washing_trimming
    name: "Washing and trimming"
    inclusion: "required"
    inclusion_condition: "Required for a fresh-rhizome route; for a grinding-only route using purchased dried ginger, document this process as not operated at the reporting site."
    role: "foreground transformation"
    quantitative_reference: "1 kg net conforming processed ginger output"
  - id: scraping_peeling_slicing
    name: "Scraping, peeling and slicing"
    inclusion: "conditional"
    inclusion_condition: "Include only the single preparation style actually used before drying or brining."
    role: "foreground transformation"
    quantitative_reference: "1 kg net conforming processed ginger output"
  - id: drying_pretreatment
    name: "Drying pretreatment"
    inclusion: "conditional"
    inclusion_condition: "Include only for the locked dry route when scalding or calcium-oxide bleaching is actually applied."
    role: "foreground transformation"
    quantitative_reference: "1 kg net conforming dry processed ginger output"
  - id: drying
    name: "Drying"
    inclusion: "conditional"
    inclusion_condition: "Include for a dry processed-ginger route; declare dryer technology, heat carrier, fuel, residence time and moisture endpoint."
    role: "foreground transformation"
    quantitative_reference: "1 kg net conforming dry processed ginger output"
  - id: dry_cleaning_grading
    name: "Dry cleaning and grading"
    inclusion: "conditional"
    inclusion_condition: "Include when dried ginger is air-screened, separated, cleaned or graded before release or size reduction."
    role: "foreground transformation"
    quantitative_reference: "1 kg net conforming dry processed ginger output"
  - id: crushing_grinding_sieving
    name: "Crushing, grinding and sieving"
    inclusion: "conditional"
    inclusion_condition: "Include only when the declared dry product is crushed or ground; lock the equipment and declared particle-size specification."
    role: "foreground transformation"
    quantitative_reference: "1 kg net conforming crushed or ground ginger output"
  - id: brine_preparation
    name: "Brine preparation"
    inclusion: "conditional"
    inclusion_condition: "Include only for ginger in brine; record one actual formulation and each authorised ingredient separately."
    role: "foreground transformation"
    quantitative_reference: "1 kg net conforming ginger-in-brine output"
  - id: brine_filling_thermal
    name: "Brine filling, sealing and conditional thermal treatment"
    inclusion: "conditional"
    inclusion_condition: "Include only for ginger in brine; declare container, closure, fill medium and whether pasteurisation, sterilisation or no heat treatment is used."
    role: "foreground transformation"
    quantitative_reference: "1 kg net conforming ginger-in-brine output"
  - id: packaging_release
    name: "Packaging, specification check and release"
    inclusion: "required"
    inclusion_condition: "Package the single locked product form and release it against its moisture, particle-size or brine-medium specification; do not combine dry and brined products."
    role: "foreground release"
    quantitative_reference: "1 kg net conforming processed ginger output"
  - id: cleaning_sanitation
    name: "Cleaning and sanitation"
    inclusion: "required"
    inclusion_condition: "Include wet or dry cleaning actually attributable to the declared route; keep every cleaning chemical and utility atomic."
    role: "foreground support"
    quantitative_reference: "1 kg net conforming processed ginger output"
  - id: onsite_wastewater_treatment
    name: "On-site wastewater treatment"
    inclusion: "conditional"
    inclusion_condition: "Include only when the reporting site operates treatment; otherwise record each untreated wastewater product flow to the external treatment boundary."
    role: "foreground support"
    quantitative_reference: "1 kg net conforming processed ginger output"
