allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Shared preparation, decaffeination, roasting, grinding, packing, utilities, and treatment"
    rule: "First subdivide by line, batch, meter, operating time, or other causal record so the declared product receives its measured share."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_then_other
    applies_to: "Residual shared processes"
    rule: "If subdivision is not feasible, use a documented physical causal relationship; only if no defensible physical relation exists may another documented relationship, such as economic value, be used."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recovered_caffeine
    applies_to: "Recovered caffeine leaving as a product"
    rule: "Subdivide recovery where possible. Otherwise apply the hierarchy above; do not assign zero burden by default and disclose quantities, prices if used, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
      - eu-jrc-fdm-bref-2019
  - rule_id: allocation_internal_recovery
    applies_to: "Recovered solvent, carbon dioxide, coffee oil, heat, or water reused internally"
    rule: "Model the internal loop once; record net make-up input, inventory change, wastes, and direct releases without creating a second product credit."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_treatment
    applies_to: "Silverskin, rejected beans, dust, spent agents, wastewater, sludge, and packaging scrap"
    rule: "Record the treatment route. Do not grant an avoided-product credit inside the foreground unless the chosen downstream method explicitly requires it and all substitution assumptions are disclosed."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_green_coffee_records
      process_id: "green_coffee_preparation"
      flow_role: "Coffee, electricity, prepared output, foreign matter, rejects, and collected dust"
      record_type: "Weighbridge, lot, submeter, and waste records"
      raw_fields: "lot id; supplier; origin; green mass; moisture; electricity; output mass; waste masses; opening and closing stock"
      collection_method: "Reconcile calibrated scales and meter totals to production lots"
      unit: "kg; kWh"
      frequency: "Each lot and monthly reconciliation"
      temporal_coverage: "Representative consecutive reporting period, normally at least 12 months"
      site_scope: "All preparation equipment serving the declared product"
      aggregation_rule: "Sum records, subtract inventory change, and normalize by conforming net output"
      quality_evidence: "Calibration, invoices, lot sheets, stock records, and waste tickets"
    - protocol_id: cp_decaf_material_energy_records
      process_id: "decaffeination"
      flow_role: "Coffee, water, steam, electricity, purchased heat, and fuels"
      record_type: "Batch, meter, invoice, and stock records"
      raw_fields: "route; batch; coffee mass and moisture; water; steam; electricity; heat; each fuel; heating-value basis; operating hours"
      collection_method: "Read route-specific meters or allocate documented shared meters causally"
      unit: "kg; m3; MJ; kWh"
      frequency: "Each batch and monthly reconciliation"
      temporal_coverage: "Same reporting period as reference output"
      site_scope: "All foreground decaffeination and redrying equipment"
      aggregation_rule: "Sum by declared route; subtract inventory change; normalize by net output"
      quality_evidence: "Calibrations, invoices, batch sheets, and meter maps"
    - protocol_id: cp_decaf_route_agent_records
      process_id: "decaffeination"
      flow_role: "Carbon dioxide, ethyl acetate, dichloromethane, activated carbon, and coffee oil"
      record_type: "Purchase, charge, recovery, and inventory records"
      raw_fields: "agent identity; route; purchased; charged; recovered; opening stock; closing stock; waste"
      collection_method: "Complete an agent-specific inventory balance for the selected route"
      unit: "kg"
      frequency: "Each batch and monthly closure"
      temporal_coverage: "Same reporting period as decaffeination output"
      site_scope: "Selected route only"
      aggregation_rule: "Net make-up equals purchases plus opening stock minus closing stock and documented export"
      quality_evidence: "Supplier specification, tank or cylinder records, recovery logs, and stock checks"
    - protocol_id: cp_decaf_output_records
      process_id: "decaffeination"
      flow_role: "Decaffeinated coffee, caffeine, spent agents, wastewater, and sludge"
      record_type: "Scale, laboratory, flowmeter, and waste records"
      raw_fields: "output mass; moisture; caffeine result; recovered caffeine; each spent agent; wastewater; sludge; dry matter; destination"
      collection_method: "Reconcile output and residue records to each route batch"
      unit: "kg; m3; laboratory unit"
      frequency: "Each batch or shipment"
      temporal_coverage: "Same reporting period as decaffeination inputs"
      site_scope: "Selected route and its on-site treatment"
      aggregation_rule: "Sum each atomic output and normalize by conforming net product"
      quality_evidence: "Test reports, calibrated scales, flowmeters, and transfer notes"
    - protocol_id: cp_decaf_emission_records
      process_id: "decaffeination"
      flow_role: "Route-specific carbon dioxide, ethyl acetate, and dichloromethane releases"
      record_type: "Solvent or gas balance and emission test"
      raw_fields: "route; make-up; recovered; product retention; waste; stock change; measured exhaust concentration; flow; time"
      collection_method: "Close each agent balance and reconcile with stack or workplace exhaust testing"
      unit: "kg; concentration; volume"
      frequency: "Each campaign and legally required monitoring frequency"
      temporal_coverage: "Representative operating states in the reporting period"
      site_scope: "All release points for selected route"
      aggregation_rule: "Convert concentration and flow to mass and reconcile to inventory loss"
      quality_evidence: "Sampling plan, laboratory accreditation, instrument calibration, and balance closure"
    - protocol_id: cp_roasting_records
      process_id: "roasting_cooling"
      flow_role: "Green-coffee charge and roasted output"
      record_type: "Batch and scale records"
      raw_fields: "lot; regular or decaf status; green mass and moisture; roasted mass and moisture; roast specification; opening and closing stock"
      collection_method: "Reconcile calibrated scales by roast lot"
      unit: "kg"
      frequency: "Each batch and monthly reconciliation"
      temporal_coverage: "Same reporting period as packed output"
      site_scope: "All roasters and coolers serving the declared product"
      aggregation_rule: "Sum conforming lots and normalize by packed net output"
      quality_evidence: "Batch sheets, scale calibration, and moisture test reports"
    - protocol_id: cp_roasting_energy_records
      process_id: "roasting_cooling"
      flow_role: "Electricity, quench water, purchased heat, natural gas, and LPG"
      record_type: "Meter, invoice, and equipment records"
      raw_fields: "meter readings; fuel; heating value; quench water; operating time; thermal oxidizer use"
      collection_method: "Use dedicated meters; otherwise allocate by documented causal operating parameter"
      unit: "kWh; MJ; m3"
      frequency: "Each batch or daily, reconciled monthly"
      temporal_coverage: "Same reporting period as roasting output"
      site_scope: "Roaster, cooler, cyclone, and dedicated control equipment"
      aggregation_rule: "Sum each atomic utility and normalize by conforming output"
      quality_evidence: "Meter calibration, invoices, and equipment logs"
    - protocol_id: cp_roasting_output_records
      process_id: "roasting_cooling"
      flow_role: "Roasted beans, silverskin, and rejects"
      record_type: "Scale and waste records"
      raw_fields: "output mass; moisture; silverskin mass; reject mass; destinations; inventory change"
      collection_method: "Reconcile product and residue mass by campaign"
      unit: "kg"
      frequency: "Each campaign and monthly reconciliation"
      temporal_coverage: "Same reporting period as roasting inputs"
      site_scope: "All roasting output handling"
      aggregation_rule: "Sum each atomic output and close the coffee mass balance"
