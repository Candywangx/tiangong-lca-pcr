  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every foreground exchange"
      rule: "Normalized amount = reporting-period exchange × 1 kg / reporting-period conforming net coffee output."
      inputs:
        - "Atomic exchange total"
        - "conforming net output"
      output: "Amount per reference flow"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_coffee_mass_balance
      applies_to: "Preparation, decaffeination, roasting, grinding, and packing"
      rule: "Opening coffee stock + coffee input = closing coffee stock + conforming transfer or product + each coffee-bearing waste + measured or calculated direct coffee-material loss, all on declared moisture bases."
      inputs:
        - "Coffee masses"
        - moisture
        - stocks
        - wastes
        - emissions
      output: "Process closure and unexplained difference"
      source_ids:
        - eu-jrc-fdm-bref-2019
        - cheron-bessou-coffee-lca-2024
    - id: calc_route_agent_balance
      applies_to: "Each selected decaffeination agent"
      rule: "Opening stock + purchases = closing stock + recovered internal stock + product retention + exported recovery + waste + direct release."
      inputs:
        - "Agent-specific inventory and measurements"
      output: "Net make-up and route-specific loss"
      source_ids:
        - eu-jrc-fdm-bref-2019
        - shofinita-decaf-lca-2025
    - id: calc_shared_energy
      applies_to: "Shared meters"
      rule: "Allocate only the un-submetered remainder using documented causal operating time, throughput, or measured load; disclose the driver and test sensitivity."
      inputs:
        - "Shared meter"
        - "submetered use"
        - "causal driver"
      output: "Process-specific utility amount"
      source_ids:
        - eu-bat-fdm-2019-2031
        - eu-pef-2021-2279
    - id: calc_stack_mass
      applies_to: "Each direct air emission"
      rule: "Emitted mass = pollutant concentration × dry or wet gas flow × operating duration, with reference conditions, moisture, and oxygen corrections preserved."
      inputs:
        - "Pollutant result"
        - "gas flow"
        - duration
        - corrections
      output: "Pollutant-specific emitted mass"
      source_ids:
        - eu-bat-fdm-2019-2031
    - id: calc_packaging_mass
      applies_to: "Each packaging component"
      rule: "Net component mass = issued mass + opening stock − closing stock − separately weighed scrap − documented returns."
      inputs:
        - "Component issues"
        - stocks
        - scrap
        - returns
      output: "Component mass in conforming shipments"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_water_balance
      applies_to: "Decaffeination, cleaning, and effluent handling"
      rule: "Water input = water in product or evaporated + wastewater transferred + direct release + sludge water + inventory change; report the unexplained remainder."
      inputs:
        - "Metered water and all water outputs"
      output: "Water-balance closure"
      source_ids:
        - eu-bat-fdm-2019-2031
