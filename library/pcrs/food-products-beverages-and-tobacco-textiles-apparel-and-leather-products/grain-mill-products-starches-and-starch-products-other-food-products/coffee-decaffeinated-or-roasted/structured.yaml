    - id: dq_method_traceability
      applies_to: "Tests and calculations"
      requirement: "Preserve method version, samples, raw units, conversion factors, allocation drivers, and calculation workbook or query lineage."
      evidence: "Laboratory reports and reproducible calculation record"
    - id: dq_no_unsupported_ranges
      applies_to: "Important inventory rows"
      requirement: "Do not publish a range until at least two independent original sources support compatible boundary, unit, and normalization bases."
      evidence: "Source comparison record or open unresolved_range_evidence"
validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "Dataset identity"
    rule: "Product form is one covered CPC 23911 form and is not instant coffee, extract, preparation, beverage, substitute, or non-decaffeinated green coffee."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_reference_mass
    applies_to: "Reference flow"
    rule: "Reference output equals 1 kg net coffee with packaging excluded and all required qualifiers declared."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_reference_uuid
    applies_to: "Reference flow"
    rule: "Release validation remains inconclusive until an exact public Tiangong reference-product UUID is resolved; an approximate flow shall not be substituted."
    source_ids: []
  - rule_id: validate_route_exclusivity
    applies_to: "Decaffeination"
    rule: "Exactly one route is declared when decaffeination is in scope; alternative route-agent rows are not applicable and solvent, carbon-dioxide, or water-route losses are not merged."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_process_applicability
    applies_to: "Process map"
    rule: "Roasting is included only for roasted products, grinding only for ground products, and decaffeination only when performed in the foreground."
    source_ids:
      - un-cpc-3-2025
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_mass_balance
    applies_to: "Coffee processes"
    rule: "Coffee-material balances close within the facility's documented measurement uncertainty; unexplained differences are reported and reviewed."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - cheron-bessou-coffee-lca-2024
  - rule_id: validate_resource_inventory
    applies_to: "All processes"
    rule: "Water, steam, electricity, purchased heat, each fuel, each decaffeination agent, and each packaging component used are separate rows with source records."
    source_ids:
      - eu-bat-fdm-2019-2031
  - rule_id: validate_waste_emissions
    applies_to: "All processes"
    rule: "Silverskin, rejected beans, dust, spent agents, wastewater, sludge, packaging scrap, and each direct emission are recorded separately when present."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - eu-bat-fdm-2019-2031
  - rule_id: validate_decaf_claim
    applies_to: "Decaffeinated product"
    rule: "A lot-linked caffeine test or legally applicable claim basis is present, with method and result traceable; ISO 20481 is an applicable analytical method."
    source_ids:
      - iso-20481-2008
  - rule_id: validate_eu_dcm_residue
    applies_to: "EU-market dichloromethane route"
    rule: "When Directive 2009/32/EC applies, demonstrate the roasted-coffee dichloromethane residue limit of 2 mg/kg and applicable extraction-solvent requirements; otherwise document the governing jurisdiction."
    source_ids:
      - eu-extraction-solvents-2009-32
  - rule_id: validate_product_quality
    applies_to: "Roasted and ground products"
    rule: "Declare moisture method for roasted ground coffee and particle-size method for ground coffee where applicable; ISO 11817 and ISO 23134 are acceptable method identities."
    source_ids:
      - iso-11817-1994
      - iso-23134-2022
  - rule_id: validate_data_quality
    applies_to: "Dataset"
    rule: "Completeness, temporal, geographical, technological, and precision assessments and all allocation choices are disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_ranges
    applies_to: "Quantity ranges"
    rule: "No range may be added from one study, one point, incompatible bases, or equal lower and upper values."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site-specific foreground manufacturing package for one declared CPC 3.0 23911 coffee product and route"
  downstream_use: "Projection to process and lifecyclemodel datasets and linkage to upstream green coffee, utilities, chemicals, packaging, and treatment datasets"
  allowed_use: "Product carbon footprint or LCA studies when product form, route, geography, technology, period, allocation, and data quality are compatible"
  excluded_use: "Generic substitution for instant coffee, coffee beverage preparation, cultivation, primary cherry processing, or an undeclared decaffeination route"
  required_metadata: "PCR id and version; product form; route; caffeine status and test; roast and grind specifications; moisture basis; reference-flow qualifiers; site and period; process inclusion; UUID status; allocation; packaging; upstream links"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; mass, solvent, energy, packaging, and water balance closure; data-quality ratings; not-applicable rows; uncertainty; unresolved UUID and range-evidence status"
  update_trigger: "Product or route change; new decaffeination agent; equipment or control change; packaging specification change; material supplier or energy change; reporting-period refresh; regulatory or analytical-method change; exact reference UUID becoming available"
