allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "botanical, product-state, drying, formulation, utility, and packaging routes"
    rule: "Subdivide meters, batches, and process records before allocation so tea and maté, liquid and powder, spray and freeze drying, and different formulations are not averaged by default."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_internal_recovery
    applies_to: "recovered water, solvent, aroma, and rework"
    rule: "Treat material returned within the same product system as an internal loop; record make-up and losses and do not create an avoided-burden credit for internal recovery."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_residue_status
    applies_to: "spent leaves, filter cake, sludge, and product losses"
    rule: "Treat outputs as waste unless a documented specification, transfer, purchaser, and destination demonstrate a co-product. Do not assign a credit solely because a possible use exists."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_unavoidable_multifunctionality
    applies_to: "jointly produced saleable outputs after subdivision"
    rule: "If allocation remains unavoidable, document the physical relationship that drives the shared process and allocate on that basis; if no defensible physical relationship exists, use economic allocation and disclose prices, period, geography, and sensitivity."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_batch_records
      process_id: "raw_material_receipt"
      flow_role: "tea or maté input and screening"
      record_type: "weighbridge, lot, and laboratory records"
      raw_fields: "botanical identity; supplier; origin; input state; gross mass; tare; accepted mass; reject mass; moisture"
      collection_method: "calibrated scale and lot identity review"
      unit: "kg; % w/w"
      frequency: "every lot"
      temporal_coverage: "representative reporting year"
      site_scope: "all supplying lots to modelled line"
      aggregation_rule: "sum masses by botanical route; normalize only within the declared route"
      quality_evidence: "calibration, supplier document, lot trace"
    - protocol_id: cp_extraction_records
      process_id: "aqueous_extraction"
      flow_role: "water, solvent, aids, and extraction liquor"
      record_type: "batch sheet and meters"
      raw_fields: "batch id; raw material; water; solvent; enzyme; time; temperature; liquor mass; solids"
      collection_method: "calibrated meters, dosing logs, and laboratory solids test"
      unit: "kg; °C; min; % w/w"
      frequency: "every batch"
      temporal_coverage: "representative reporting year"
      site_scope: "all modelled extractors"
      aggregation_rule: "sum by declared extraction route and divide by released product"
      quality_evidence: "meter calibration, batch reconciliation"
    - protocol_id: cp_separation_records
      process_id: "solid_liquid_separation"
      flow_role: "separation media and operation"
      record_type: "maintenance and batch records"
      raw_fields: "medium identity; installed mass; replacement date; processed mass; retained solids"
      collection_method: "stock issue plus equipment log"
      unit: "kg"
      frequency: "every replacement and batch"
      temporal_coverage: "representative reporting year"
      site_scope: "all modelled separators"
      aggregation_rule: "allocate replacement mass over measured processed output"
      quality_evidence: "purchase and maintenance records"
    - protocol_id: cp_clarification_records
      process_id: "clarification_filtration"
      flow_role: "aids, media, filtrate, and filter cake"
      record_type: "batch, dosing, and maintenance records"
      raw_fields: "aid identity; dose; medium identity; replacement mass; feed; permeate; cake; solids"
      collection_method: "dosing system, scale, and laboratory test"
      unit: "kg; % w/w"
      frequency: "every batch"
      temporal_coverage: "representative reporting year"
      site_scope: "all modelled clarification lines"
      aggregation_rule: "retain one aid or medium per row; reconcile feed, permeate, and residue"
      quality_evidence: "dosing calibration, batch reconciliation"
    - protocol_id: cp_concentration_records
      process_id: "concentration"
      flow_role: "concentrate output"
      record_type: "batch and laboratory records"
      raw_fields: "feed mass; feed solids; concentrate mass; concentrate solids; condensate; technology"
      collection_method: "calibrated tanks or scales and solids test"
      unit: "kg; % w/w"
      frequency: "every batch"
      temporal_coverage: "representative reporting year"
      site_scope: "all modelled concentrators"
      aggregation_rule: "aggregate only compatible technology and botanical routes"
      quality_evidence: "calibration and solids method"
    - protocol_id: cp_aroma_records
      process_id: "aroma_recovery"
      flow_role: "recovered aroma"
      record_type: "recovery batch record"
      raw_fields: "botanical route; recovered mass; composition or solids; return, sale, or disposal destination"
      collection_method: "calibrated receiver and batch trace"
      unit: "kg"
      frequency: "every applicable batch"
      temporal_coverage: "representative reporting year"
      site_scope: "all modelled recovery equipment"
      aggregation_rule: "sum by botanical route and destination"
      quality_evidence: "calibration and destination record"
    - protocol_id: cp_drying_records
      process_id: "spray_drying_freeze_drying"
      flow_role: "dried product output"
      record_type: "dryer batch and laboratory records"
      raw_fields: "drying route; feed mass; feed solids; powder mass; moisture; rejects"
      collection_method: "calibrated scales and moisture test"
      unit: "kg; % w/w"
      frequency: "every batch"
      temporal_coverage: "representative reporting year"
      site_scope: "all modelled dryers"
      aggregation_rule: "never aggregate spray and freeze drying; normalize released output"
      quality_evidence: "calibration, moisture method, batch reconciliation"
    - protocol_id: cp_formulation_records
      process_id: "formulation_blending"
      flow_role: "each declared ingredient"
      record_type: "approved formula, issue, and batch records"
      raw_fields: "ingredient identity; supplier; lot; issued mass; returned mass; final formulation"
      collection_method: "weigh scale and electronic batch record"
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "representative reporting year"
      site_scope: "all modelled blending lines"
      aggregation_rule: "one atomic row per ingredient; reconcile issued, returned, output, and loss"
      quality_evidence: "approved formula and scale calibration"
    - protocol_id: cp_energy_records
      process_id: "all_foreground_processes"
      flow_role: "electricity, purchased steam, and purchased heat"
      record_type: "submeter and invoice records"
      raw_fields: "carrier identity; meter start/end; energy; process; batch or period; supplier"
      collection_method: "calibrated submeter preferred; reconciled invoice otherwise"
      unit: "kWh; MJ"
      frequency: "batch or monthly"
      temporal_coverage: "representative reporting year"
      site_scope: "all modelled equipment"
      aggregation_rule: "keep carriers separate; allocate shared meters by documented causal driver"
      quality_evidence: "calibration, invoice reconciliation"
    - protocol_id: cp_fuel_records
      process_id: "thermal_utility_generation"
      flow_role: "each on-site fuel"
      record_type: "meter, tank, and invoice records"
      raw_fields: "fuel identity; quantity; lower heating value; sulfur; biogenic fraction; unit"
      collection_method: "calibrated meter or stock reconciliation"
      unit: "kg; m3; MJ"
      frequency: "delivery and monthly reconciliation"
      temporal_coverage: "representative reporting year"
      site_scope: "all foreground combustion units"
      aggregation_rule: "one atomic row per fuel and unit; convert with documented properties"
      quality_evidence: "invoice, meter calibration, fuel certificate"
    - protocol_id: cp_refrigerant_records
      process_id: "refrigeration"
      flow_role: "refrigerant make-up and leakage"
      record_type: "equipment inventory and service logs"
      raw_fields: "equipment id; refrigerant identity; opening charge; additions; recovery; closing charge; confirmed leaks"
      collection_method: "mass-balance inventory and service weighing"
      unit: "kg"
      frequency: "every service and annual balance"
      temporal_coverage: "representative reporting year"
      site_scope: "all foreground cooling systems"
      aggregation_rule: "calculate loss separately for each refrigerant"
      quality_evidence: "service certificate and inventory reconciliation"
    - protocol_id: cp_cleaning_records
      process_id: "sanitation_wastewater"
      flow_role: "cleaning water and each chemical"
      record_type: "CIP or manual cleaning logs"
      raw_fields: "cycle id; equipment; water; chemical identity; concentration; dose; return; discharge"
      collection_method: "flow meter and chemical dosing record"
      unit: "kg; L"
      frequency: "every cleaning cycle"
      temporal_coverage: "representative reporting year"
      site_scope: "all foreground cleaning systems"
      aggregation_rule: "one atomic row per chemical; assign by cleaned equipment or batch"
      quality_evidence: "meter and dosing calibration"
    - protocol_id: cp_wastewater_records
      process_id: "sanitation_wastewater"
      flow_role: "wastewater and sludge"
      record_type: "discharge meter, sample, and sludge records"
      raw_fields: "stream; flow; COD; TSS; N; P; pH; sludge wet mass; dry solids; destination"
      collection_method: "calibrated flow meter, accredited laboratory, and scale"
      unit: "kg; m3; mg/L; % w/w"
      frequency: "continuous or batch; representative samples"
      temporal_coverage: "representative reporting year"
      site_scope: "all foreground discharges and treatment units"
      aggregation_rule: "retain streams and destinations; calculate pollutant loads from compatible flow and concentration periods"
      quality_evidence: "calibration, chain of custody, laboratory report"
    - protocol_id: cp_packaging_records
      process_id: "packaging_and_storage"
      flow_role: "each packaging component"
      record_type: "packaging BOM, stock issue, and line records"
      raw_fields: "component identity; material; mass per item; items issued; returned; damaged; pallet trips"
      collection_method: "supplier specification plus calibrated count or scale"
      unit: "kg; item"
      frequency: "each packaging run"
      temporal_coverage: "representative reporting year"
      site_scope: "all modelled packaging lines"
      aggregation_rule: "one atomic row per material component; calculate reuse per documented trips"
      quality_evidence: "BOM approval, supplier spec, scale check"
    - protocol_id: cp_waste_records
      process_id: "all_foreground_processes"
      flow_role: "residues, filter waste, product loss, and packaging waste"
      record_type: "scale, skip, rejection, and destination records"
      raw_fields: "waste identity; botanical identity where relevant; wet mass; dry solids; destination; treatment"
      collection_method: "calibrated scale and waste transfer record"
      unit: "kg; % w/w"
      frequency: "every batch or shipment"
      temporal_coverage: "representative reporting year"
      site_scope: "all foreground waste points"
      aggregation_rule: "never combine different waste identities or destinations"
      quality_evidence: "scale calibration and transfer receipt"
    - protocol_id: cp_emission_records
      process_id: "spray_drying_thermal_utility_generation"
      flow_role: "direct air emissions"
      record_type: "stack tests, continuous monitoring, and factor calculations"
      raw_fields: "source; pollutant; concentration; gas flow; operating time; fuel; factor; abatement"
      collection_method: "standard measurement or approved factor with activity data"
      unit: "kg; mg/Nm3"
      frequency: "permit or representative frequency"
      temporal_coverage: "representative reporting year"
      site_scope: "all foreground emission points"
      aggregation_rule: "calculate each pollutant separately and reconcile to operating period"
      quality_evidence: "laboratory report, monitor QA, factor reference"
    - protocol_id: cp_mass_balance_records
      process_id: "all_production_processes"
      flow_role: "yields, losses, and condensate"
      record_type: "batch mass balance"
      raw_fields: "input; output; water; residue; wastewater; loss; solids"
      collection_method: "reconciled calibrated measurements"
      unit: "kg; % w/w"
      frequency: "every batch"
      temporal_coverage: "representative reporting year"
      site_scope: "each declared botanical and product route"
      aggregation_rule: "input mass plus additions equals products plus wastes, wastewater, emissions, and documented inventory change within uncertainty"
      quality_evidence: "signed reconciliation and meter QA"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "every inventory row"
      rule: "normalized amount = route-compatible reporting-period amount / net released mass of the same declared final product"
      inputs:
        - "exchange amount"
        - "net released product mass"
      output: "amount per 1 kg final product"
      source_ids: []
    - id: calc_dry_solids_balance
      applies_to: "extraction through packaging"
      rule: "dry solids in = dry solids in products + residues + wastewater + losses + documented inventory change; investigate unreconciled difference"
      inputs:
        - "measured masses"
        - "measured solids or moisture"
      output: "dry-solids reconciliation"
      source_ids:
        - fao-who-jmpr-boscalid-2019
    - id: calc_refrigerant_loss
      applies_to: "each refrigerant"
      rule: "loss = opening charge + additions - recovered quantity - closing charge, adjusted for documented equipment transfers"
      inputs:
        - "equipment inventory and service masses"
      output: "refrigerant emission by identity"
      source_ids: []
    - id: calc_pollutant_load
      applies_to: "wastewater or air pollutant"
      rule: "load = compatible measured concentration × measured stream flow × operating duration, with unit conversion"
      inputs:
        - concentration
        - flow
        - time
      output: "pollutant mass"
      source_ids:
        - ec-jrc-fdm-bref-2019
    - id: calc_shared_meter
      applies_to: "shared equipment or utility meter"
      rule: "allocate only after subdivision is infeasible and use a documented causal driver such as equipment operating time, measured throughput, or delivered heat; disclose the driver"
      inputs:
        - "shared meter"
        - "route-specific causal driver"
      output: "route-specific amount"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "raw materials, intermediates, final product, ingredients, aids, media, fuels, refrigerants, and packaging"
      requirement: "Retain supplier, grade, botanical identity where relevant, formulation or material specification, lot, and exact flow-name evidence; unresolved UUIDs remain disclosed."
      evidence: "supplier documents, batch trace, Tiangong direct-read record"
    - id: dq_route
      applies_to: "all processes"
      requirement: "Records shall distinguish tea from maté, liquid from powder, spray drying from freeze drying, each formulation, each fuel, and each refrigerant."
      evidence: "process map, batch and meter tags"
    - id: dq_measurement
      applies_to: "mass, water, energy, solids, emissions, and waste"
      requirement: "Use calibrated instruments or documented reconciled invoices; retain units, conversions, detection limits, and missing-data treatment."
      evidence: "calibration and reconciliation records"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Cover a representative continuous 12-month period or justify a shorter campaign period and seasonal representativeness."
      evidence: "production calendar and coverage report"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Reconcile all batches and report excluded processes, missing providers, unmonitored direct emissions, and cut-offs; a missing range is not permission to omit a flow."
      evidence: "completeness and mass-balance check; eu-pef-method-2021"
    - id: dq_representativeness
      applies_to: "dataset publication"
      requirement: "Report technology, geography, reference period, product specification, and route share; do not publish an averaged default that merges incompatible routes."
      evidence: "metadata and route-separated calculation workbook"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Exactly one botanical source and one delivered product state are declared, the output row matches them, and no approximate Tiangong reference-product UUID is used."
    source_ids:
      - unsd-cpc-3-0-2025
      - iso-6079-2021
  - rule_id: validate_reference_mass
    applies_to: "reference amount"
    rule: "Net released product equals exactly 1 kg after normalization and packaging mass is separate."
    source_ids: []
  - rule_id: validate_route_exclusivity
    applies_to: "process map"
    rule: "Tea and maté, liquid and powder, spray and freeze drying, and different formulations are not simultaneously defaulted; every conditional process has a declared applicability decision."
    source_ids:
      - iso-6079-2021
      - dao-et-al-2021-tea-spray-drying
  - rule_id: validate_atomic_inventory
    applies_to: "inventory rows"
    rule: "Every selected flow is one material, carrier, ingredient, aid, medium, waste, or elementary emission; combined collections and selector labels fail validation."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_mass_solids_balance
    applies_to: "production batch"
    rule: "Wet-mass and dry-solids balances reconcile within the site's documented measurement uncertainty, or the difference is investigated and disclosed."
    source_ids:
      - fao-who-jmpr-boscalid-2019
  - rule_id: validate_energy_fuels
    applies_to: "utilities"
    rule: "Electricity, purchased steam, purchased heat, natural gas, and each other fuel are separately recorded; direct combustion emissions are present when fuel is combusted on site."
    source_ids:
      - ec-jrc-fdm-bref-2019
  - rule_id: validate_formulation
    applies_to: "preparation route"
    rule: "The approved formulation BOM equals the sum of separately inventoried ingredients and processing aids after returns and losses; undeclared carriers, sugars, sweeteners, or additives fail validation."
    source_ids: []
  - rule_id: validate_wastewater_waste
    applies_to: "outputs"
    rule: "Tea residue, maté residue, filter residue, product loss, wastewater, sludge, and each packaging-waste material have separate amounts and destinations when applicable."
    source_ids:
      - ec-jrc-fdm-bref-2019
  - rule_id: validate_refrigerants
    applies_to: "refrigeration"
    rule: "Each refrigerant identity, make-up, recovery, closing charge, and calculated leak are reconciled; a generic refrigerant row fails validation."
    source_ids:
      - ec-jrc-fdm-bref-2019
  - rule_id: validate_data_quality
    applies_to: "published dataset"
    rule: "Temporal, technological, geographical, completeness, and precision evidence is retained and the data-quality assessment is reported."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_ranges
    applies_to: "quantitative guidance"
    rule: "No empirical range is accepted unless at least two independent original sources have compatible boundary, unit, and basis evidence; otherwise the range is omitted and the manifest evidence gap remains open."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package for one declared tea-derived or maté-derived product route."
  downstream_use: "May be published as a secondary_dataset or background_dataset after review, UUID resolution, provider linking, quality assessment, and closure or acceptance of review blockers."
  allowed_use: "Route-matched LCA process or lifecyclemodel construction for the declared botanical source, product state, technology, formulation, geography, and reference period."
  excluded_use: "Generic substitution across tea and maté; substitution across liquid and powder or spray and freeze drying; comparative claims without equivalent functional and quality specifications; zero-burden treatment of unresolved providers."
  required_metadata: "PCR id; botanical source; delivered state; product specification; solids or moisture; extraction solvent; concentration method; aroma route; drying route; formulation; heat treatment; utility and refrigerant systems; packaging; storage; geography; reference period; allocation; provider links; exclusions."
  required_quality_disclosure: "Coverage, measurement methods, calibration, missing-data treatment, mass and solids reconciliation, wastewater and emissions monitoring, allocation, uncertainty, provider gaps, UUID gaps, and unresolved range evidence."
  update_trigger: "Change in botanical source, input state, extraction solvent, concentration or drying technology, formulation, heat treatment, fuel, refrigerant, packaging, storage, provider dataset, regulation, or evidence that materially changes the inventory."
data_sources:
  - id: "unsd-cpc-3-0-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 structure, code 23914, https://unstats.un.org/unsd/classifications/Econ/CPC.cshtml (retrieved 2026-08-24)"
    used_for: "Official category identity and scope."
  - id: "iso-6079-2021"
    type: "standard"
    reference: "ISO 6079:2021, Instant tea in solid form — Specification, https://www.iso.org/standard/80197.html (retrieved 2026-08-24)"
    used_for: "Public scope distinguishes pure solid instant tea from filled, aromatic, decaffeinated, and non-tea products; supports mandatory product-state and formulation qualification."
  - id: "fao-who-jmpr-boscalid-2019"
    type: "official_guidance"
    reference: "FAO/WHO Joint Meeting on Pesticide Residues, Pesticide residues in food 2019 — Boscalid evaluation, pp. 82–84, https://www.fao.org/fileadmin/user_upload/IPM_Pesticide/JMPR/Evaluations/2019_Extra/BOSCALID_221.pdf (retrieved 2026-08-24)"
    used_for: "Original verified tea-processing trial documenting hot-water extraction, centrifuge and sieve separation, vacuum concentration, conditional silica gel, maltodextrin, citric acid and sucrose addition, drying, and distinct extract/residue matrices; not used for category-wide ranges."
  - id: "ec-jrc-fdm-bref-2019"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Best Available Techniques Reference Document for the Food, Drink and Milk Industries, JRC118627, 2019, https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2020-01/JRC118627_FDM_Bref_2019_published.pdf (retrieved 2026-08-24)"
    used_for: "Water, energy, raw-material, cleaning-agent, wastewater, waste, refrigerant, and direct-emission inventory and monitoring requirements."
  - id: "eu-pef-method-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I Product Environmental Footprint Method, https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng (retrieved 2026-08-24)"
    used_for: "Functional unit and reference flow, completeness, company-specific data, data quality, system boundary, multi-functionality, allocation, and validation."
  - id: "dao-et-al-2021-tea-spray-drying"
    type: "literature"
    reference: "Dao, D.T.A. et al. (2021), Optimization of spray-drying process to manufacture green tea powder and its characters, Food Science & Nutrition 9:6566–6574, https://doi.org/10.1002/fsn3.2597 (full text verified 2026-08-24)"
    used_for: "Original process evidence for conditional washing/blanching, water/enzyme and ethanol-assisted extraction, sieving, carrier addition, atomization, hot-air drying, powder separation, and route-specific electricity/heat/material collection; not used for category-wide ranges."
