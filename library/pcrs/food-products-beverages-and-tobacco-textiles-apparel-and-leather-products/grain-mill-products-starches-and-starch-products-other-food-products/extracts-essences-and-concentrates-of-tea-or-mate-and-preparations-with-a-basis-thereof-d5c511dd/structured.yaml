system_boundary:
  rules:
    - rule_id: boundary_foreground_steps
      applies_to: "foreground manufacturing"
      rule: "Include raw-material receipt and screening, water addition, extraction, separation, clarification or filtration, concentration, applicable route steps, sanitation, packaging, storage, and directly controlled utilities."
      source_ids:
        - fao-who-jmpr-boscalid-2019
        - ec-jrc-fdm-bref-2019
    - rule_id: boundary_route_exclusivity
      applies_to: "route selection"
      rule: "Declare one botanical source and one delivered product state; include aroma recovery, spray drying, freeze drying, formulation, heat treatment, fuel combustion, and refrigeration only when the declared route uses them."
      source_ids:
        - iso-6079-2021
        - dao-et-al-2021-tea-spray-drying
    - rule_id: boundary_complete_exchanges
      applies_to: "process inventory"
      rule: "Record all materially relevant material and energy inputs, wastes, wastewater, and direct elementary flows without collection labels or combined utility rows."
      source_ids:
        - eu-pef-method-2021
        - ec-jrc-fdm-bref-2019
    - rule_id: boundary_upstream_links
      applies_to: "purchased inputs"
      rule: "Link each purchased raw material, ingredient, aid, filter medium, cleaning chemical, packaging component, refrigerant, and utility to an upstream dataset with matching identity and geography; do not assign zero burden when a provider is missing."
      source_ids:
        - eu-pef-method-2021
