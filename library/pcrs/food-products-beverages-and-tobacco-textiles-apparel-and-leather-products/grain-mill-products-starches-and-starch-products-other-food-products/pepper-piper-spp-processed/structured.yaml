validation_rules:
  - rule_id: val_identity_gate
    applies_to: "Product identity and route selection"
    rule: "Error: Every required gate has one declared value and the dataset scope matches CPC 3.0 23921 processed *Piper* pepper."
    source_ids:
      - un-cpc-v3
      - codex-cxs-326-2017
  - rule_id: val_reference_flow
    applies_to: "Reference product object"
    rule: "Error: processed_pepper_reference_output is exactly 1 kg net product with UUID 99d5d3c5-870f-458f-b492-a610d37c8034, Product flow, and Mass; packaging is excluded."
    source_ids:
      - un-cpc-v3
  - rule_id: val_no_implicit_averaging
    applies_to: "Mutually exclusive routes and forms"
    rule: "Error: Product classes, presentations, wet treatments, depericarping, drying, sanitization, and packaging formats are separate or combined only with disclosed route datasets and weights."
    source_ids:
      - codex-cxs-326-2017
      - ipc-pepper-standard-2015
  - rule_id: val_process_gate
    applies_to: "Required and conditional processes"
    rule: "Error: All required processes and every triggered conditional process are present; map tokens are only required or conditional."
    source_ids:
      - ipc-pepper-standard-2015
      - fao-spice-quality-assurance
  - rule_id: val_atomic_flows
    applies_to: "Atomic inventory"
    rule: "Error: Every actual carrier, material, chemical, packaging material, waste, wastewater, refrigerant, and elementary emission has its own flow card; no grouped placeholder is used."
    source_ids:
      - fao-spice-quality-assurance
      - ipcc-stationary-combustion-2006
  - rule_id: val_only_reference_uuid
    applies_to: "UUID ownership"
    rule: "Error: The reference product flow is the only flow card with a UUID; all other flow UUIDs remain blank for author mapping."
    source_ids:
      - un-cpc-v3
  - rule_id: val_mass_moisture_balance
    applies_to: "Wet- and dry-matter closure"
    rule: "Error: Process input, product, waste, and moisture records support reviewed wet-mass and dry-matter balances, with deviations explained."
    source_ids:
      - fao-spice-quality-assurance
      - codex-cxs-326-2017
  - rule_id: val_final_moisture
    applies_to: "Released-product moisture"
    rule: "Error: Final moisture is measured by a declared method and meets the declared applicable grade or buyer specification."
    source_ids:
      - codex-cxs-326-2017
      - ipc-pepper-standard-2015
  - rule_id: val_energy_separation
    applies_to: "Energy carrier identity"
    rule: "Error: Electricity, steam, hot water, natural gas, LPG, diesel, biomass, and any other actual carrier are separate and route-specific."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_wastewater
    applies_to: "Wet-route wastewater"
    rule: "Error: Every wet-process and cleaning wastewater stream has separate volume, destination, and matched pollutant results when tested."
    source_ids:
      - azman-retting-water-2020
      - fao-spice-quality-assurance
  - rule_id: val_combustion_emissions
    applies_to: "Fuel emissions"
    rule: "Error: Each used on-site fuel has separate CO2, CH4, and N2O measurement or transparent fuel-specific calculation."
    source_ids:
      - ipcc-stationary-combustion-2006
  - rule_id: val_packaging
    applies_to: "Package layers and scrap"
    rule: "Error: Every actual primary, secondary, and tertiary packaging material and its scrap is recorded separately and mass-reconciled."
    source_ids:
      - fao-spice-quality-assurance
  - rule_id: val_refrigerants
    applies_to: "Refrigerant identity and loss"
    rule: "Error: Each actual refrigerant chemical has separate addition and air-emission cards with an equipment-level charge balance; ambient storage records zero and not applicable."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_allocation
    applies_to: "Allocation hierarchy"
    rule: "Error: Subdivision is attempted first; any remaining physical or economic allocation has complete driver, formula, source, and sensitivity disclosure."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_temporal_completeness
    applies_to: "Period reconciliation"
    rule: "Error: Input, output, utility, waste, wastewater, emission, packaging, and storage records cover the same representative production period."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_source_closure
    applies_to: "Evidence traceability"
    rule: "Error: Every external method or number resolves to a listed Data Sources entry; each reasoned estimate is labelled with rationale, range, sensitivity, and provisional status."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "Foreground processing dataset for a single declared processed-pepper product and route vector"
  downstream_use: "May serve as secondary_dataset or background_dataset only when the consuming model matches its qualifiers and boundary"
  allowed_use: "Exact or explicitly justified match for species/cultivar, class, presentation, starting state, wet treatment, depericarping, drying, sanitization, grade, moisture, packaging, geography, technology, and period"
  excluded_use: "Unqualified generic pepper, implicit black/white/green mix, implicit whole/powder mix, undeclared wet or drying route, *Capsicum* pepper, or farm-gate raw pepper"
  required_metadata: "Reference flow, gate vector, process map, period, geography, capacity, net output, final moisture, allocation, cut-offs, source IDs, uncertainty, and evidence gaps"
  required_quality_disclosure: "Report primary-data share, measured versus calculated exchanges, reasoned estimates, mass/moisture closure, route representativeness, and unresolved gaps"
  update_trigger: "Re-author when product class, presentation, supplier starting state, wet or depericarping route, dryer, sanitization, package format, site, or material data period changes materially"
