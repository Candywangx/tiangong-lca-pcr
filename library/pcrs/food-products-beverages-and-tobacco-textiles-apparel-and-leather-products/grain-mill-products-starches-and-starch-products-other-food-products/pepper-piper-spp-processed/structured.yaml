allocation_rules:
  - rule_id: alloc_avoid_by_subdivision
    applies_to: "foreground_burden_allocation"
    rule: "Avoid allocation by separating product class, presentation, wet route, depericarping route, drying route, sanitization route, and packaging-format records."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_route_specific_records
    applies_to: "foreground_burden_allocation"
    rule: "Do not allocate or average across mutually exclusive route-gate values; calculate an intentional mix only from independently modelled routes and disclosed production weights."
    source_ids:
      - codex-cxs-326-2017
      - ipc-pepper-standard-2015
  - rule_id: alloc_residue_classification
    applies_to: "foreground_burden_allocation"
    rule: "Treat removed stalks, pericarp, dust, off-grade pepper, and rejected product as waste unless sale, specification, and a receiving market demonstrate a co-product."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_physical_relationship
    applies_to: "foreground_burden_allocation"
    rule: "When subdivision is impossible and a causal physical relationship exists, allocate shared inputs by the measured driver, such as pepper dry matter, equipment runtime, occupied mass-time, or treated volume."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_economic_fallback
    applies_to: "foreground_burden_allocation"
    rule: "Use economic allocation only when no defensible physical relationship exists; use a representative price period and test price sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "No avoided-burden credit is allowed inside the foreground inventory without an explicitly declared consequential study. Exported waste treatment and any substitution claim shall remain separate linked modelling choices."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_lot_records
      process_id: "receiving_and_lot_qualification"
      flow_role: "Received pepper, sampling, rejection, and accepted lots"
      record_type: "lot_record"
      raw_fields: "Scale tickets, supplier lot, route gate, moisture, foreign matter, and inspection"
      collection_method: "Calibrated weighing and controlled lot records"
      unit: "kg; mass fraction"
      frequency: "Every lot"
      temporal_coverage: "Complete reporting period"
      site_scope: "Every receiving point in scope"
      aggregation_rule: "Reconcile accepted plus rejected mass to received mass"
      quality_evidence: "Scale verification, lot genealogy, and inspection record"
    - protocol_id: cp_energy_carrier_records
      process_id: "hot_air_drying"
      flow_role: "Electricity, steam, hot water, natural gas, LPG, diesel, and biomass"
      record_type: "meter_and_invoice_record"
      raw_fields: "Meter, invoice, tank or cylinder balance, runtime, heating value, and allocation driver"
      collection_method: "Meter reading and source-document reconciliation"
      unit: "kWh; MJ; kg; m3"
      frequency: "Every campaign or monthly"
      temporal_coverage: "Complete reporting period"
      site_scope: "Every energy-consuming process in scope"
      aggregation_rule: "Reconcile process records to facility totals using the declared driver"
      quality_evidence: "Meter verification, invoices, and reconciliation worksheet"
    - protocol_id: cp_waste_records
      process_id: "dry_cleaning_and_grading"
      flow_role: "Every solid waste material"
      record_type: "waste_transfer_record"
      raw_fields: "Material identity, container tare and gross mass, destination, receipt, and route"
      collection_method: "Calibrated weighing and transfer-document review"
      unit: "kg"
      frequency: "Every removal"
      temporal_coverage: "Complete reporting period"
      site_scope: "Every waste-generating process in scope"
      aggregation_rule: "Aggregate by material, process, route, and campaign"
      quality_evidence: "Scale verification, transfer receipt, and route record"
    - protocol_id: cp_threshing_records
