system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground starts at receipt of the declared pepper material state and ends when packaged processed pepper is released at the factory gate. Receiving, separation, wet-route steps, drying, dry cleaning and grading, size reduction, sanitization, equipment cleaning, packaging, finished-goods storage, on-site utilities, direct emissions, wastes, and wastewater are included when they occur. Cultivation, supplier processing, purchased energy, purchased materials, treatment of exported waste, and inbound transport require upstream datasets but are not silently absorbed into foreground measurements."
      source_ids: []
    - rule_id: sb_route_gate
      applies_to: "All foreground records"
      rule: "Apply the product and route selection gate before aggregation; mutually exclusive product classes, presentations, wet treatments, depericarping routes, and drying routes shall not be averaged implicitly."
      source_ids:
        - codex-cxs-326-2017
        - ipc-pepper-standard-2015
        - fao-gi-control-plan-2009
    - rule_id: sb_required_operations
      applies_to: "Unit-process coverage"
      rule: "Include every listed required process and every conditional process whose gate condition is met; document a zero or not-applicable result rather than deleting an occurring route."
      source_ids:
        - ipc-pepper-standard-2015
        - fao-spice-quality-assurance
    - rule_id: sb_recursive_input
      applies_to: "Same-category processed pepper input"
      rule: "Link the upstream processed-pepper dataset and model only added foreground conversion; prevent recursion and double counting."
      source_ids:
        - eu-pef-method-2021
    - rule_id: sb_upstream_linkage
      applies_to: "Purchased inputs and exported treatments"
      rule: "Link upstream datasets for received pepper, utilities, chemicals, packaging, inbound transport, and treatment of wastes or wastewater outside the site."
      source_ids:
        - eu-pef-method-2021
    - rule_id: sb_factory_gate
      applies_to: "Reference product"
      rule: "End the foreground after final release and storage at the reporting facility; exclude outbound distribution, retail, use, and end-of-life unless a broader study adds them transparently."
      source_ids:
        - eu-pef-method-2021
    - rule_id: sb_atomic_flows
      applies_to: "All inventory exchanges"
      rule: "Use one row per identified carrier, material, chemical, packaging material, waste stream, wastewater stream, refrigerant, and elementary emission; grouped placeholders do not conform."
      source_ids:
        - fao-spice-quality-assurance
        - ipcc-stationary-combustion-2006
