  - id: "azman-retting-water-2020"
    type: "literature"
    reference: "Azman et al., “Evaluation of Various Soaking Agents as a Novel Tool for Heavy Metal Residues Mitigation from Pepper,” *Processes* 8(10), 1255 (2020). https://doi.org/10.3390/pr8101255 ; full text: https://psecommunity.org/wp-content/plugins/wpor/includes/file/2104/LAPSE-2021.0247-1v1.pdf"
