measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Normalize to net pepper mass at factory gate; exclude packaging mass and retain the measured product moisture."
  - id: moisture_wet_basis
    applies_to: "Incoming, intermediate, and final pepper"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "% wet basis"
    rule: "Report moisture as 100 × water mass / wet sample mass; identify the test method and sample time."
  - id: dry_matter_conversion
    applies_to: "Route yield and material balance"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg dry matter"
    rule: "Calculate dry matter as wet mass × (1 - moisture fraction wet basis); do not compare wet-route yields without this conversion."
  - id: energy_carrier_identity
    applies_to: "Electricity, steam, hot water, natural gas, LPG, diesel, and biomass"
    required_property_ref:
      name: "Energy and carrier quantity"
      uuid: ""
    required_unit: "kWh, MJ, kg, L, or m3"
    rule: "Preserve each carrier as a separate flow; retain supplier quantity, lower heating value when used, and conversion factor."
  - id: water_volume
    applies_to: "Washing, blanching, retting, steam, and cleaning water"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Meter or reconcile each water use separately; do not combine process water with wastewater volume."
  - id: packaging_net_mass
    applies_to: "Every packaging layer"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record purchased or issued mass by material and subtract verified unused returns; do not use package count without a measured mass-per-item conversion."
  - id: wastewater_load
    applies_to: "Each wastewater stream"
    required_property_ref:
      name: "Volume and concentration"
      uuid: ""
    required_unit: "m3 and kg/m3"
    rule: "Report volume separately from COD or other pollutant concentration; calculate load as volume × concentration."
  - id: refrigerant_mass_balance
    applies_to: "Any refrigerant-consuming storage equipment"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report each refrigerant chemical separately using opening charge + additions - closing charge - recovered mass."
  - id: direct_emission_mass
    applies_to: "On-site fuel combustion and dust releases"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Prefer stack or equipment records; otherwise calculate each pollutant separately from the recorded fuel and an identified factor source."
