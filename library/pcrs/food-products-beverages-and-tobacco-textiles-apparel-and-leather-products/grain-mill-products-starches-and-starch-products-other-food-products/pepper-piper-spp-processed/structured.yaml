      frequency: "Each campaign or representative monitored test"
      temporal_coverage: "Representative operating conditions and reporting period"
      site_scope: "Every dust release point in scope"
      aggregation_rule: "Apply measurements only to documented matching operating hours"
      quality_evidence: "Test report, sampling method, and operating log"
    - protocol_id: cp_wet_pretreatment_records
      process_id: "wet_pretreatment"
