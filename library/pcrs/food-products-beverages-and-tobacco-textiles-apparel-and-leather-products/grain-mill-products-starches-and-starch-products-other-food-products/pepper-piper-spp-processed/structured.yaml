  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "All foreground exchanges"
      rule: "Exchange per reference = campaign exchange / released net pepper mass"
      inputs:
        - "Exchange and released net mass from the same boundary and period"
      output: "Exchange per 1 kg reference product"
      source_ids: []
    - id: calc_moisture_removed
      applies_to: "Drying"
      rule: "Water removed = wet input × moisture fraction in - dry output × moisture fraction out"
      inputs:
        - "Input/output mass and paired wet-basis moisture"
      output: "kg water removed"
      source_ids: []
    - id: calc_dry_matter_balance
      applies_to: "Wet treatment, depericarping, drying, and milling"
      rule: "Dry-matter closure = (output dry matter + dry-matter wastes) / input dry matter"
      inputs:
        - "Paired masses and moisture for product and residues"
      output: "Dimensionless closure ratio"
      source_ids: []
    - id: calc_wastewater_load
      applies_to: "Each wastewater stream"
      rule: "Pollutant load = matched wastewater volume × matched concentration"
      inputs:
        - "m3 wastewater and kg/m3 concentration"
      output: "kg pollutant"
      source_ids:
        - azman-retting-water-2020
    - id: calc_fuel_emissions
      applies_to: "On-site fuel combustion"
      rule: "Pollutant mass = fuel amount × lower heating value × identified pollutant factor, with unit conversion"
      inputs:
        - "Atomic fuel record"
        - "heating value"
        - "factor source"
        - "and equipment scope"
      output: "kg CO2, CH4, or N2O per pollutant row"
      source_ids:
        - ipcc-stationary-combustion-2006
    - id: calc_refrigerant_loss
      applies_to: "Refrigerated storage"
      rule: "Loss = opening charge + additions - closing charge - recovered mass"
      inputs:
        - "Equipment- and chemical-specific charge records"
      output: "kg refrigerant emitted to air"
      source_ids:
        - eu-pef-method-2021
    - id: calc_packaging_mass
      applies_to: "Packaging"
      rule: "Consumed packaging = issued mass - verified unused return; reusable share uses measured mass divided by documented uses"
      inputs:
        - "Material identity"
        - "issue/return"
        - "measured mass"
        - "and reuse history"
      output: "kg of each packaging material"
      source_ids: []
    - id: calc_weighted_mix
      applies_to: "Explicitly declared product mix"
      rule: "Mixed exchange = sum of independently modelled route exchange × disclosed released-mass share"
      inputs:
        - "Route-specific datasets and shares summing to 1"
      output: "Disclosed intentional product mix only"
      source_ids:
        - eu-pef-method-2021
