allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "multi-product lines and shared processes"
    rule: "First avoid allocation by metering, temporal separation, recipe or line subdivision, or another technically justified causal split. Preserve measured product-specific ingredient, yield and energy records whenever available."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_internal_rework
    applies_to: "dough, crumbs, trim and returned same-site material"
    rule: "Treat material returned to the same production system as an internal loop. Do not create a co-product credit or duplicate the upstream product burden; disclose quality limits and any additional reprocessing inputs."
    source_ids:
      - iso-14044-2006
      - eu-jrc-food-beverage-bemp-2018
  - rule_id: allocation_saleable_co_products
    applies_to: "saleable crumbs, animal-feed material, recovered heat or other outputs with economic value"
    rule: "When subdivision cannot resolve shared burdens, allocate according to a documented physical relationship that reflects the way inputs and outputs change. Use economic allocation only when no defensible physical relationship exists, and report quantities, prices, reference period and a sensitivity result."
    source_ids:
      - iso-14044-2006
      - international-epd-gpi-5-0-1
  - rule_id: allocation_waste_no_avoided_burden
    applies_to: "outputs legally or operationally managed as waste"
    rule: "Assign bakery operations up to the waste boundary to the reference product unless an applicable method explicitly defines another rule. Link transport and treatment burdens without assuming an avoided-product credit merely because the waste is recovered."
    source_ids:
      - international-epd-gpi-5-0-1
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_ingredient_and_packaging_records
      process_id: "ingredient_and_dough_preparation_finishing_packaging_and_storage"
      flow_role: "ingredients and packaging"
      record_type: "receiving, invoice, recipe, issue and return records"
      raw_fields: "material id; supplier; lot; issued quantity; returned quantity; moisture or concentration; packaging material; packaged units"
      collection_method: "Calibrated scale records reconciled with purchasing and stock movement"
      unit: "kg"
      frequency: "Each lot or production batch"
      temporal_coverage: "Representative continuous 12-month period, or justified seasonal campaign"
      site_scope: "Every included bakery and warehouse"
      aggregation_rule: "Sum net issued mass by material and divide by conforming reference-product mass"
      quality_evidence: "Scale calibration; stock reconciliation; supplier specification; exception log"
    - protocol_id: cp_process_water_records
      process_id: "ingredient_and_dough_preparation_site_utilities_and_cleaning"
      flow_role: "formulation and cleaning water"
      record_type: "meter and batch records"
      raw_fields: "meter opening and closing; batch additions; return; reuse; source; density"
      collection_method: "Read line or submeter and batch controller; allocate only unmetered shared water by documented causal driver"
      unit: "kg or m3"
      frequency: "Each batch and monthly meter reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included site and water source"
      aggregation_rule: "Separate formulation, cleaning, cooling and directly abstracted water before normalization"
      quality_evidence: "Meter calibration; water balance; reuse register"
    - protocol_id: cp_energy_records
      process_id: "all_processes"
      flow_role: "electricity, fuel, steam and heat"
      record_type: "meter, invoice, fuel and operating records"
      raw_fields: "meter readings; invoices; tank balance; runtime; power; carrier; conversion factor; heat recovery"
      collection_method: "Use line or equipment meters first, then a documented causal allocation from site meters"
      unit: "kWh, MJ, kg or m3 by carrier"
      frequency: "Continuous or each batch; monthly reconciliation"
      temporal_coverage: "Same period as product output, covering seasonality"
      site_scope: "Every included meter and on-site generation unit"
      aggregation_rule: "Retain carriers separately; subtract exported energy and excluded loads; normalize by conforming product"
      quality_evidence: "Meter calibration; invoices; runtime logs; conversion-factor source; balance check"
    - protocol_id: cp_yield_and_loss_records
      process_id: "all_production_processes"
      flow_role: "intermediate yield, rework, rejects and waste"
      record_type: "production and waste records"
      raw_fields: "input mass; intermediate mass; conforming output; rework; reject; waste; destination; moisture"
      collection_method: "Calibrated scales and production or waste-management records"
      unit: "kg"
      frequency: "Each batch or daily line total"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included product line"
      aggregation_rule: "Reconcile mass by lot or defined campaign; internal rework is a loop, not waste"
      quality_evidence: "Scale calibration; batch genealogy; waste tickets; residual investigation"
    - protocol_id: cp_product_output_and_quality
      process_id: "baking_and_cooling_finishing_packaging_and_storage"
      flow_role: "reference product and intermediate"
      record_type: "production and quality-release records"
      raw_fields: "product id; subgroup; recipe; lot; net mass; moisture; temperature; quality status; packaging; storage duration"
      collection_method: "Calibrated checkweigher or scale plus product-quality release record"
      unit: "kg and product-specific quality units"
      frequency: "Each lot"
      temporal_coverage: "Same period as all foreground inputs"
      site_scope: "Every included line and product family"
      aggregation_rule: "Sum released net product mass only; reject or hold mass remains separate"
      quality_evidence: "Calibration; release certificate; moisture method; traceability record"
    - protocol_id: cp_direct_emission_records
      process_id: "ingredient_and_dough_preparation_baking_and_cooling_finishing_packaging_and_storage"
      flow_role: "dust, combustion, process and refrigerant emissions"
      record_type: "monitoring, calculation and service records"
      raw_fields: "substance; compartment; concentration; flow; runtime; fuel; factor; charge; additions; recovery"
      collection_method: "Direct monitoring where required; otherwise calculate from collected activity and documented factor"
      unit: "kg by substance"
      frequency: "Monitoring or service event; at least annual reconciliation"
      temporal_coverage: "Same period as activity data"
      site_scope: "Every relevant stack, oven, refrigerant circuit and abatement unit"
      aggregation_rule: "Calculate substance-specific mass; preserve biogenic and fossil carbon identities"
      quality_evidence: "Laboratory or monitor QA; factor source; service log; abatement status"
    - protocol_id: cp_cleaning_records
      process_id: "site_utilities_and_cleaning"
      flow_role: "cleaning chemicals and events"
      record_type: "issue and sanitation records"
      raw_fields: "chemical id; concentration; issue; return; cleaning line; duration; production allocation driver"
      collection_method: "Chemical issue records and sanitation log linked to line or area"
      unit: "kg formulated product and kg active substance where required"
      frequency: "Each cleaning event"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included production and support area"
      aggregation_rule: "Sum product-attributable consumption; keep concentration and active-substance conversion"
      quality_evidence: "Supplier specification; issue reconciliation; sanitation completion log"
    - protocol_id: cp_water_and_wastewater_records
      process_id: "site_utilities_and_cleaning"
      flow_role: "wastewater and monitored water emissions"
      record_type: "discharge-meter, sampling and analytical records"
      raw_fields: "discharge flow; pH; temperature; COD or TOC; BOD; nitrogen; phosphorus; suspended solids; substance concentrations; reuse"
      collection_method: "Metered discharge and accredited or controlled sampling according to permit and process variability"
      unit: "m3, kg and mg/L as applicable"
      frequency: "Continuous flow; analytical frequency justified by permit and variability"
      temporal_coverage: "Same period as product output"
      site_scope: "Every discharge and on-site treatment unit"
      aggregation_rule: "Flow-weight concentrations to mass loads; separate reused, uncontaminated and treated streams"
      quality_evidence: "Meter and laboratory QA; sample plan; permit record; water balance"
    - protocol_id: cp_waste_destination_records
      process_id: "all_processes"
      flow_role: "exported waste and treatment residues"
      record_type: "waste-transfer and destination records"
      raw_fields: "material; mass; hazardous status; transporter; destination; treatment; recovery status"
      collection_method: "Weighbridge, container weights and waste transfer documentation"
      unit: "kg"
      frequency: "Each shipment; monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included site and contractor"
      aggregation_rule: "Sum by material and verified destination; do not infer avoided burden from destination label"
      quality_evidence: "Waste manifest; contractor receipt; scale record; destination verification"
    - protocol_id: cp_shared_allocation_records
      process_id: "all_processes"
      flow_role: "shared facility burdens and co-products"
      record_type: "allocation and production records"
      raw_fields: "shared input; driver; product output; co-product output; prices; period; subdivision evidence"
      collection_method: "Meter, production, time, area or other causal driver linked to each product family"
      unit: "driver-specific"
      frequency: "Monthly and at reporting-period close"
      temporal_coverage: "Same period as product output"
      site_scope: "Every shared process and included product family"
      aggregation_rule: "Apply the approved hierarchy; totals before and after allocation must reconcile"
      quality_evidence: "Driver justification; source records; sensitivity calculation; allocation reconciliation"
  calculation_rules:
    - id: calc_normalized_amount
      applies_to: "every inventory row"
      rule: "normalized amount = reporting-period row quantity / reporting-period conforming net reference-product mass"
      inputs:
        - "Collected row quantity"
        - "released product mass"
      output: "Row quantity per 1 kg finished product"
      source_ids:
        - iso-14044-2006
    - id: calc_net_reference_product
      applies_to: "reference product"
      rule: "net reference-product mass excludes all packaging and excludes rejected, held or returned product not released at the factory gate"
      inputs:
        - "Checkweigher or scale mass"
        - "packaging mass"
        - "quality-release status"
      output: "Conforming net product mass"
      source_ids:
        - iso-14044-2006
    - id: calc_mass_balance
      applies_to: "each lot or justified production campaign"
      rule: "residual = total mass inputs - finished product - saleable co-products - exported waste - measured emissions - documented evaporation or fermentation loss - closing work in progress + opening work in progress"
      inputs:
        - Ingredient
        - water
        - intermediate
        - output
        - waste
        - "emission and stock records"
      output: "Absolute and percentage residual with disposition"
      source_ids:
        - eu-bat-food-drink-milk-2019
        - iso-14044-2006
    - id: calc_energy_conversion
      applies_to: "energy carriers"
      rule: "Convert only where needed using a documented net or gross calorific value consistent with the selected upstream dataset; retain original metered quantity and conversion basis"
      inputs:
        - "Carrier quantity"
        - "calorific value"
        - "electricity reading"
        - "purchased heat"
      output: "Carrier-specific energy normalized to reference product"
      source_ids:
        - eu-bat-food-drink-milk-2019
    - id: calc_direct_emissions
      applies_to: "direct air and water emissions"
      rule: "substance mass = measured concentration × measured flow integrated over the period, or collected activity × documented factor when direct measurement is unavailable"
      inputs:
        - Concentration
        - flow
        - runtime
        - "fuel or activity"
        - factor
      output: "kg emitted substance per 1 kg finished product"
      source_ids:
        - eu-bat-food-drink-milk-2019
    - id: calc_shared_utility_allocation
      applies_to: "shared utilities and cleaning"
      rule: "Prefer direct metering; otherwise multiply shared total by a causal driver share such as equipment time, cleaned area, line throughput or measured demand, then reconcile allocated totals to the shared total"
      inputs:
        - "Shared total"
        - "product-specific driver"
        - "total driver"
      output: "Product-attributable shared input"
      source_ids:
        - iso-14044-2006
        - eu-bat-food-drink-milk-2019
    - id: calc_co_product_allocation
      applies_to: "unavoidable multifunctionality"
      rule: "Apply documented physical allocation; if no defensible physical relation exists, economic share = co-product revenue / total revenue over a representative period and report sensitivity"
      inputs:
        - "Co-product masses"
        - "physical driver"
        - prices
        - "reporting period"
      output: "Allocated burdens and sensitivity result"
      source_ids:
        - iso-14044-2006
        - international-epd-gpi-5-0-1
  data_quality_requirements:
    - id: dq_identity_and_traceability
      applies_to: "product, ingredients and packaging"
      requirement: "Maintain product subgroup, recipe family, lot, supplier and material identity from receipt through released reference product."
      evidence: "Batch genealogy; supplier specifications; recipe and release records"
    - id: dq_measurement_control
      applies_to: "mass, water, energy and emissions"
      requirement: "Use calibrated or controlled measurement systems, retain units and original readings, and document conversion factors and missing-data substitutions."
      evidence: "Calibration certificates; meter QA; laboratory QA; conversion-factor register"
    - id: dq_temporal_representativeness
      applies_to: "all foreground data"
      requirement: "Use a continuous 12-month period that captures seasonality, or a complete justified campaign for seasonal products; align numerator and denominator periods."
      evidence: "Reporting-period declaration; production calendar; meter and inventory timestamps"
    - id: dq_site_and_technology_coverage
      applies_to: "multi-site or multi-line datasets"
      requirement: "Cover every declared site and material technology route; weight aggregation by conforming net product mass and disclose omitted sites or routes."
      evidence: "Site list; line inventory; weighted aggregation workbook; omission justification"
    - id: dq_completeness_and_balances
      applies_to: "material, water and energy inventory"
      requirement: "Reconcile ingredient/product mass, site water and purchased/on-site energy. Investigate material residuals and unassigned shared consumption rather than silently scaling them away."
      evidence: "Mass, water and energy balances; exception log; corrective-action record"
    - id: dq_upstream_representativeness
      applies_to: "linked background datasets"
      requirement: "Match ingredient or carrier identity, geography, technology and time as closely as practicable; disclose proxy datasets and material gaps."
      evidence: "Dataset mapping table; proxy justification; source metadata"
    - id: dq_reasoned_estimate_replacement
      applies_to: "all provisional QA ranges in this candidate PCR"
      requirement: "Treat every reasoned_estimate range as a non-mandatory, replaceable screening guardrail. It shall not replace foreground records or be presented as an observed industry benchmark."
      evidence: "Range review log; foreground comparison; replacement source or reviewer acceptance"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow and product metadata"
    rule: "Fail validation when the reference product is not a semantically included CPC 23490 ware, when the product subgroup or market state is missing, or when the reference quantity is not 1 kg net finished product excluding packaging."
    source_ids:
      - unsd-cpc-3-0-23490
  - rule_id: validate_required_qualifiers
    applies_to: "foreground data package"
    rule: "Fail validation when any required qualifier is absent, ambiguous or inconsistent across product metadata, the reference flow and process records."
    source_ids:
      - unsd-cpc-3-0-23490
      - federation-of-bakers-production-methods
  - rule_id: validate_process_coverage
    applies_to: "process map and inventory"
    rule: "Require ingredient and dough preparation, baking or equivalent thermal setting and cooling, and site utilities and cleaning. Require explicit inclusion or justified exclusion of fermentation/proofing, finishing, packaging and controlled storage."
    source_ids:
      - federation-of-bakers-production-methods
      - eu-jrc-food-beverage-bemp-2018
  - rule_id: validate_mass_and_period_balance
    applies_to: "material inventory"
    rule: "Require numerator and denominator period alignment, product/reject/rework separation and a disclosed mass-balance residual. Flag unexplained negative amounts, duplicate rework, packaging included in reference mass or unexplained residuals above the facility's documented investigation threshold."
    source_ids:
      - iso-14044-2006
      - eu-bat-food-drink-milk-2019
  - rule_id: validate_energy_water_and_emissions
    applies_to: "utilities and direct releases"
    rule: "Require energy carriers to remain separately identified, formulation water to be separated from cleaning water, and on-site air or water emissions to be substance- and compartment-specific without duplication of external treatment datasets."
    source_ids:
      - eu-bat-food-drink-milk-2019
  - rule_id: validate_allocation_and_proxies
    applies_to: "shared burdens, co-products and background links"
    rule: "Require the allocation hierarchy, causal driver, reconciliation and sensitivity where economic allocation is used; require every proxy or geographically mismatched upstream dataset to be disclosed."
    source_ids:
      - iso-14044-2006
      - international-epd-gpi-5-0-1
  - rule_id: validate_provisional_ranges
    applies_to: "QA screening ranges"
    rule: "A value outside a provisional reasoned_estimate range triggers investigation, not automatic rejection. Validation shall report that these broad ranges are temporary authoring estimates and shall prefer collected records and reviewed source-backed replacements."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific foreground bakery production dataset normalized to 1 kg net finished bread or other included baker's ware at the factory gate"
  downstream_use: "secondary_dataset; background_dataset after independent methodology review, identity review and publication controls"
  allowed_use: "Product carbon-footprint or LCA modelling of declared CPC 23490 products when geography, recipe, market state, technology, reference period, packaging and boundary are compatible"
  excluded_use: "Direct comparison of different product functions, moisture states, shelf lives or packaging formats without equivalence review; use for excluded bakery categories; nutritional, food-safety or legal conformity claims; use of candidate QA ranges as industry benchmarks"
  required_metadata: "Canonical PCR id and version; product subgroup; recipe family; base cereal or flour; leavening and fermentation route; market and moisture state; packaging; facility and geography; technology and oven route; reporting period; shelf life or storage duration; allocation choices; upstream dataset mapping"
  required_quality_disclosure: "Site and line coverage; mass, water and energy balances; measurement and calibration evidence; temporal coverage; missing data; proxy datasets; rework and waste destinations; allocation sensitivity; all provisional reasoned_estimate uses and replacements"
  update_trigger: "Recipe or product-subgroup change; greater than material change in technology, oven, fuel, energy source, preservation, packaging, site mix or allocation; new current bakery PCR/c-PCR; changed reference-flow identity; new source-backed evidence replacing provisional ranges; reporting data older than the programme's accepted representativeness period"
