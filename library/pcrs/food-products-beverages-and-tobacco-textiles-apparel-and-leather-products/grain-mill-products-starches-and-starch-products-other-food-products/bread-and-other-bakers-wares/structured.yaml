system_boundary:
  rules:
    - rule_id: boundary_bakery_gate_to_gate
      applies_to: "foreground production"
      rule: "Include all bakery operations from receipt of ingredients through the conforming product at the factory gate, including cleaning and on-site utilities attributable to the product."
      source_ids:
        - unsd-cpc-3-0-23490
        - federation-of-bakers-production-methods
    - rule_id: boundary_upstream_links
      applies_to: "purchased inputs and downstream treatment"
      rule: "Represent production of purchased ingredients, packaging, utilities and fuels and treatment of exported waste or wastewater through linked upstream or treatment datasets with geography and representativeness disclosed."
      source_ids:
        - iso-14044-2006
        - eu-bat-food-drink-milk-2019
    - rule_id: boundary_conditional_operations
      applies_to: "finishing, packaging, freezing and storage"
      rule: "Include slicing, coating, filling, packaging, freezing, chilled storage or other finishing only when performed before the declared factory gate; record an explicit exclusion when a normally relevant operation does not occur."
      source_ids:
        - federation-of-bakers-production-methods
        - eu-jrc-food-beverage-bemp-2018
    - rule_id: boundary_same_category_rework
      applies_to: "rework and returned intermediate product"
      rule: "Track same-category rework as an internal loop when it remains under facility control. If purchased or transferred across the foreground boundary, record it as a product flow and prevent recursive double counting."
      source_ids:
        - iso-14044-2006
boundary_abstraction:
  declared_starting_condition: "Ingredients, processing aids, packaging materials and utilities received at the bakery gate with supplier identity, quantity, moisture or concentration where relevant, geography and upstream dataset reference declared"
  starting_condition_role: "Gate-to-gate bakery foreground starting point backed by receiving, invoice, inventory and meter records"
  product_classification_scope: "Bread and other bakers' wares semantically within CPC 3.0 subclass 23490, independent of directory ancestry"
  recursive_input_rule: "A purchased finished CPC 23490 product used as an ingredient or rework input is recorded as a product input with its own upstream dataset; its production is not recursively recreated inside this foreground unless the same facility and reporting period provide separable measured production records"
  upstream_dataset_requirement: "Link upstream datasets for all material ingredients, processing aids, packaging, purchased energy and fuels, water supply, transport when included, and waste or wastewater treatment; disclose missing, proxy or geographically mismatched datasets"
  disclosure: "Declare facility and sites, reporting period, product subgroup and recipe family, technology and oven route, net product moisture, preservation and packaging state, included and excluded operations, shared-utility allocation, rework treatment, waste destinations and all proxy datasets"
