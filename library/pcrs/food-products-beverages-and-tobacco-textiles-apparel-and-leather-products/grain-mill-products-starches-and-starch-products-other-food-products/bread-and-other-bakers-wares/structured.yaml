measurement_rules:
  - id: reference_product_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground amounts to 1 kg of conforming finished product at the declared factory-gate market state, excluding packaging mass. Record the product mass after cooling and after any declared finishing loss."
  - id: packaging_mass_separate
    applies_to: "packaging inputs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure each packaging material separately. Packaging is within the inventory when used but shall not be added to the 1 kg reference product amount."
  - id: moisture_and_bake_loss
    applies_to: "dough, intermediate and final product masses"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record wet mass at each measured process state and declare moisture basis. Do not infer ingredient conversion or bake loss from nominal recipe mass when measured lot masses are available."
  - id: energy_carriers_not_merged
    applies_to: "electricity, fuels, steam and thermal energy"
    required_property_ref:
      name: "Carrier-specific property"
      uuid: ""
    required_unit: "kWh, MJ or carrier mass/volume"
    rule: "Preserve metered carrier and unit. Convert only with a documented factor and do not merge purchased electricity, on-site fuel combustion and purchased heat into one unqualified energy total."
  - id: production_and_loss_mass_balance
    applies_to: "each production lot"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile ingredients and process water with finished product, saleable co-products, rework, evaporation or fermentation loss, waste and other measured outputs. Disclose the residual and investigation threshold."
