system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "foreground_mill_operations"
      rule: "Include receipt and storage, cleaning, milling and separation, finishing, dispatch, site energy, and dust control; include conditioning, pearling/dehulling, drying, steaming, micronisation, blending, and packaging when performed for the reference product."
      source_ids:
        - eu-jrc-fdm-bref-2019
    - rule_id: boundary_rule_2
      applies_to: "upstream_product_inputs"
      rule: "Keep cultivation, harvest, external drying, and inbound transport outside the foreground mill process, but link upstream datasets whenever the study boundary includes those burdens."
      source_ids: []
    - rule_id: boundary_rule_3
      applies_to: "air_emissions_and_captured_material"
      rule: "Report dust released to the environment as an elementary output; report filter dust, screenings, husk, bran, and other captured material as product or waste outputs according to actual fate."
      source_ids:
        - eu-jrc-fdm-bref-2019
    - rule_id: boundary_rule_4
      applies_to: "conditional_routes"
      rule: "Exclude an unperformed conditional operation rather than inserting a zero-throughput process; document the evidence that the operation was not used for the represented batches."
      source_ids:
        - eu-jrc-fdm-bref-2019
