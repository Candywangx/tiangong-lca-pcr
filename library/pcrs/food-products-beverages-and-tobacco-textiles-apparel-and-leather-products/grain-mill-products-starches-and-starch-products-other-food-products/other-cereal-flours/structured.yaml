allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "independently_measurable_processes"
    rule: "First avoid allocation by subdividing receipt, preparation, milling, treatment, finishing, and utility operations and by using process- or line-specific measurements where technically feasible."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rule_2
    applies_to: "joint_milling_burdens"
    rule: "When subdivision cannot avoid allocation among flour and co-products, use a documented physical causal relationship when it reflects how inputs and burdens change with outputs. If no defensible physical relationship exists, use economic allocation based on a representative price period and perform a sensitivity check."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rule_3
    applies_to: "waste_and_coproduct_classification"
    rule: "Classify bran, germ, hulls, screenings, off-spec flour, and captured dust from their actual fate and evidence of intended use. Do not assign co-product status solely to avoid waste burdens, and do not allocate burdens to internally recycled material as if it crossed the system boundary."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rule_4
    applies_to: "allocation_disclosure"
    rule: "Report the allocation method, allocation factors summing to one, physical or economic data period, zero-burden exclusions, internally recycled streams, and the sensitivity result for any material co-product allocation."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "grain_receipt_cleaning"
      flow_role: "cereal receipts, cleaned transfer, and stock"
      record_type: "weighbridge, goods-receipt, silo, and supplier records"
      raw_fields: "cereal species; supplier lot; origin; mass; moisture; acceptance/rejection; silo; opening/closing stock"
      collection_method: "Calibrated weighbridge or receiving scale reconciled to supplier documents and silo stock"
      unit: "kg and % moisture"
      frequency: "Each delivery and monthly stock close"
      temporal_coverage: "Same representative period as product output; normally at least 12 consecutive months or a justified complete campaign"
      site_scope: "Each included mill and storage boundary"
      aggregation_rule: "Sum accepted receipts plus opening stock minus closing stock; keep cereals and moisture bases separate"
      quality_evidence: "Scale calibration; supplier record; stock reconciliation; exception log"
    - protocol_id: cp_process_batches
      process_id: "grain_conditioning_milling_separation_special_flour_treatment"
      flow_role: "process routing, intermediate transfers, water/additive recipes, and treated fractions"
      record_type: "batch, control-system, recipe, and production logs"
      raw_fields: "batch_id; cereal; route; input/output mass; moisture; process time; water; steam; additive; treatment setting"
      collection_method: "Metered transfers and signed batch or control-system records"
      unit: "kg; m3; carrier unit; process setting"
      frequency: "Each batch or continuous line shift"
      temporal_coverage: "Same representative period as product output"
      site_scope: "Each included line and treatment route"
      aggregation_rule: "Aggregate only batches matching the declared reference product and route"
      quality_evidence: "Meter calibration; batch genealogy; recipe revision; operator exception log"
    - protocol_id: cp_product_dispatch
      process_id: "milling_separation_special_flour_treatment_finishing_dispatch"
      flow_role: "saleable flour production and dispatch"
      record_type: "production, silo, quality-release, packaging, and dispatch records"
      raw_fields: "product_id; cereal; grade; whole/refined; extraction/ash; moisture; particle size; treatment; net mass; packaging state; destination"
      collection_method: "Reconcile released production, silo stock change, packaged output, and bulk dispatch"
      unit: "kg and product specification units"
      frequency: "Each batch and monthly close"
      temporal_coverage: "Same representative period as inputs"
      site_scope: "Each included mill and product line"
      aggregation_rule: "Sum only conforming net flour; exclude packaging and separately track rework"
      quality_evidence: "Scale calibration; laboratory certificate; release record; stock reconciliation"
    - protocol_id: cp_coproduct_waste
      process_id: "grain_receipt_cleaning_grain_conditioning_milling_separation_finishing_dispatch"
      flow_role: "co-products, rejects, captured dust, and wastes"
      record_type: "scale ticket, sales, waste-transfer, and internal-use records"
      raw_fields: "stream_id; material; mass; moisture; destination; revenue; legal status; internal reuse"
      collection_method: "Weigh each material stream or use documented container counts and verified conversion factors"
      unit: "kg and currency where economic allocation is used"
      frequency: "Each transfer; monthly reconciliation"
      temporal_coverage: "Same representative period as flour output"
      site_scope: "All included lines and waste destinations"
      aggregation_rule: "Sum by stream and fate; internal transfers cancel in the aggregated foreground system"
      quality_evidence: "Scale calibration; transfer note; customer or waste-contractor record; revenue ledger"
    - protocol_id: cp_energy_records
      process_id: "site_utilities_control"
      flow_role: "electricity, fuel, steam, on-site generation, and exports"
      record_type: "meters, invoices, tank stock, and generation logs"
      raw_fields: "carrier; meter_id; amount; unit; energy content/conversion factor; opening/closing stock; generated/exported amount; allocation key"
      collection_method: "Calibrated meters and invoices reconciled to fuel stock and generation records"
      unit: "original carrier unit and MWh"
      frequency: "Continuous or invoice period; monthly close"
      temporal_coverage: "Normally at least 12 consecutive months or justified full campaign"
      site_scope: "Whole site with documented exclusion or allocation of non-flour uses"
      aggregation_rule: "Convert each carrier once; subtract exports; reconcile generated and purchased energy; allocate to represented production transparently"
      quality_evidence: "Meter calibration; invoice; fuel specification; reconciliation record"
    - protocol_id: cp_water_records
      process_id: "grain_conditioning_site_utilities_control"
      flow_role: "conditioning water, other process water, and wastewater"
      record_type: "meters, batch recipes, and discharge logs"
      raw_fields: "meter_id; use_area; volume; batch_id; source; reused volume; discharge destination"
      collection_method: "Submeter where available; otherwise documented batch recipe or site balance"
      unit: "m3"
      frequency: "Continuous or per batch; monthly close"
      temporal_coverage: "Same representative period as flour output"
      site_scope: "Each included mill and use area"
      aggregation_rule: "Keep conditioning, other process, reused, and discharged water distinct; allocate unmetered shared use transparently"
      quality_evidence: "Meter calibration; recipe record; water-balance reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "finishing_dispatch"
      flow_role: "supplied packaging"
      record_type: "bill of materials, purchase, stock, and packaging-line records"
      raw_fields: "material_id; material type; unit mass; units used; opening/closing stock; scrap; product_id"
      collection_method: "Verified packaging specification reconciled with purchases and line counts"
      unit: "kg"
      frequency: "Each packaging run and monthly close"
      temporal_coverage: "Same representative period as packaged flour"
      site_scope: "Each included packaging line"
      aggregation_rule: "Sum packaging supplied with product by material; exclude reusable assets not transferred"
      quality_evidence: "Supplier specification; count reconciliation; scale check"
    - protocol_id: cp_air_emissions
      process_id: "grain_receipt_cleaning_milling_separation_site_utilities_control"
      flow_role: "channelled and material diffuse dust emissions"
      record_type: "stack test, continuous/periodic monitor, exhaust-flow, operating-hour, and abatement records"
      raw_fields: "source_id; concentration; gas volume; reference conditions; operating time; filter status; diffuse estimate method"
      collection_method: "Applicable standard measurement or documented engineering calculation using measured concentration and gas flow"
      unit: "mg/Nm3; Nm3; h; kg"
      frequency: "At legally required frequency and after material control changes"
      temporal_coverage: "Tests representative of included operating modes and production period"
      site_scope: "Every material emission point and documented diffuse source"
      aggregation_rule: "Convert concentration and dry-gas flow to mass; normalize by matching production; do not add captured dust"
      quality_evidence: "Accredited test report where required; instrument calibration; sampling plan; filter maintenance record"
  calculation_rules:
    - id: calc_dry_matter
      applies_to: "grain, flour, co-products, and wastes"
      rule: "dry mass = as-received mass × (1 − moisture mass fraction); convert back only using the target stream's measured moisture fraction"
      inputs:
        - "as-received mass"
        - "measured moisture fraction"
      output: "dry mass or transparently converted as-received mass"
      source_ids: []
    - id: calc_reference_normalization
      applies_to: "all foreground inventory rows"
      rule: "normalized amount = period amount attributable to represented product ÷ net kg of conforming dispatched flour in the same period"
      inputs:
        - "attributable flow amount"
        - "dispatched reference-product mass"
      output: "amount per 1 kg reference flour"
      source_ids: []
    - id: calc_site_energy
      applies_to: "site_energy_inputs"
      rule: "Convert each carrier to MWh with disclosed factors; purchased energy + on-site generation used − exports − excluded uses, with no double counting; divide by saleable flour tonnes"
      inputs:
        - "carrier records"
        - "conversion factors"
        - generation
        - exports
        - "excluded uses"
        - "product tonnes"
      output: "MWh/tonne saleable flour"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_dust_mass
      applies_to: "cleaning_dust_air; milling_dust_air"
      rule: "emitted mass = measured concentration × dry-gas volume over operating time, converted to kg, plus separately quantified diffuse releases"
      inputs:
        - concentration
        - "dry-gas flow or volume"
        - "operating time"
        - "diffuse release estimate"
      output: "kg particulate emission per reference output"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_mass_balance
      applies_to: "foreground mill system"
      rule: "cereal and other material inputs + opening stock = flour + co-products + wastes + direct material emissions + closing stock; report the absolute and percentage residual without forcing it to zero"
      inputs:
        - "moisture-aligned inputs"
        - outputs
        - emissions
        - "and stock changes"
      output: "mass-balance residual and completeness indicator"
      source_ids: []
    - id: calc_allocation_factors
      applies_to: "joint milling burdens"
      rule: "Calculate factors from the selected physical relation or economic values for the same representative period; normalize factors to sum to one and retain an unrounded audit table"
      inputs:
        - "co-product quantities or economic values"
        - "selected allocation basis"
      output: "allocation factors and sensitivity case"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Cereal species or blend and every required qualifier shall be present and consistent across flow, process, batch, and dispatch records."
      evidence: "Product specification, quality-release certificate, batch genealogy, and verified Tiangong flow identity"
    - id: dq_measurement
      applies_to: "mass, moisture, water, energy, and emissions"
      requirement: "Use calibrated instruments or documented supplier measurements; preserve raw units and reference conditions before conversion."
      evidence: "Calibration records, laboratory methods, invoices, meter register, and test reports"
    - id: dq_temporal
      applies_to: "foreground period"
      requirement: "Use a continuous representative period, normally at least 12 months; justify a shorter complete campaign and disclose seasonality, shutdowns, and abnormal batches."
      evidence: "Coverage table, production calendar, downtime log, and justification"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Reconcile inputs, outputs, stock change, internally recycled flows, energy, water, dust, co-products, wastes, and packaging; explain material gaps rather than balancing them with an invented flow."
      evidence: "Mass and utility balances, completeness checklist, and reconciliation residuals"
    - id: dq_route_specificity
      applies_to: "conditional operations"
      requirement: "Demonstrate whether conditioning, dehulling/pearling, special treatment, blending, and packaging were used for represented batches."
      evidence: "Process map, batch route records, and product specification"
    - id: dq_source_traceability
      applies_to: "external and upstream data"
      requirement: "Record source version or publication, retrieval date for web evidence, upstream dataset identity, geography, time, technology, and any substitution."
      evidence: "Source register and dataset metadata"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference_flow_identity"
    rule: "Confirm the reference amount is 1 kg, Mass is the reference property, and the generic Flour UUID is used only when cereal, grade, and other qualifiers make it representative; otherwise require a verified more specific flow."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "product_scope"
    rule: "Reject a data package that does not identify the cereal or that represents wheat/meslin flour, a non-cereal flour, starch, meal not sold as flour, or a prepared mix outside this PCR."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "boundary_and_route"
    rule: "Confirm all required operations are represented and every conditional operation is either included with records or excluded with route evidence; verify upstream and downstream exclusions are disclosed."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validation_rule_4
    applies_to: "mass_and_moisture"
    rule: "Recalculate dry-matter conversions and the foreground mass balance; flag inconsistent moisture bases, unexplained stock changes, duplicated internal transfers, or a material residual."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "energy_and_water"
    rule: "Recalculate carrier conversions and water separation; flag double-counted on-site generation, energy exports, conditioning water, or shared site utilities. Compare site energy with the cited screening range and require an explanation, not automatic rejection, when outside it."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validation_rule_6
    applies_to: "dust_and_waste"
    rule: "Confirm captured dust is not reported as an elementary emission, channelled dust mass uses compatible concentration and gas-volume reference conditions, and waste/co-product fate matches transfer evidence."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validation_rule_7
    applies_to: "allocation"
    rule: "Confirm subdivision was considered first, factors sum to one, the basis matches the causal or economic evidence, and a sensitivity result is disclosed for material joint burdens."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_rule_8
    applies_to: "data_coverage"
    rule: "Confirm raw records cover the same products, sites, routes, and period as the reference output; list every check not performed and treat missing identity or material inventory evidence as inconclusive."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific foreground gate-to-gate flour-milling dataset produced from real mill records"
  downstream_use: "secondary_dataset; background_dataset when reviewed for representativeness and linked to appropriate upstream datasets"
  allowed_use: "Process or lifecycle-model construction for the declared cereal flour, mill technology, geography, time period, grade, treatment, and delivery state"
  excluded_use: "Generic use for an undeclared cereal or grade; wheat/meslin flour; agricultural cultivation; retail or use stage; substitution for a product whose required qualifiers or flow identity differ"
  required_metadata: "canonical PCR id; verified reference-flow identity; cereal species/blend; grade; whole/refined status; extraction/ash where used; moisture and particle size; treatments/additives; bulk/packaged state; site/geography; technology; period; process route; upstream dataset identities; allocation method"
  required_quality_disclosure: "record coverage; calibration and laboratory evidence; mass-balance residual; energy and water reconciliation; emission method; co-product/waste fate; allocation factors and sensitivity; reasoned-estimate replacements; unresolved UUID substitutions"
  update_trigger: "Change in cereal or product specification, flow identity, mill route or equipment, energy mix, dust control, co-product fate, allocation basis, packaging, site boundary, or representative period that materially changes the dataset"
