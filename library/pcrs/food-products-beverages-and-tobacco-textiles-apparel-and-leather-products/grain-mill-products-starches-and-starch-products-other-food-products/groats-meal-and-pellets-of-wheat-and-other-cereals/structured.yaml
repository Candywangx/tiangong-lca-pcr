allocation_rules:
  - rule_id: avoid_allocation
    applies_to: "all processes"
    rule: "Use product-specific recipes, batch mass records, submeters, production time, and equipment state to avoid allocation wherever possible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: no_species_average
    applies_to: "all outputs"
    rule: "Never allocate or average one cereal species to another species or one product form to another form."
    source_ids:
      - un-cpc-3-2025
      - eu-pef-2021-2279
  - rule_id: internal_transfer
    applies_to: "internal intermediates"
    rule: "Record an internal intermediate once as an output and once as the matching downstream input; do not add an upstream burden twice."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: fines_rework
    applies_to: "pellet fines"
    rule: "Keep fines returned within the same locked batch inside its mass balance; record exported fines as a separate species-specific product output."
    source_ids:
      - us-epa-ap42-grain-2003
      - eu-pef-2021-2279
  - rule_id: co_product_identity
    applies_to: "bran, hulls, and germ"
    rule: "Keep every named species-specific bran, hull, and germ output separate with measured mass, destination, and economic or physical function."
    source_ids:
      - codex-cxs-155-1985
      - codex-cxs-178-1991
      - eu-pef-2021-2279
  - rule_id: physical_relation
    applies_to: "co-products"
    rule: "If allocation cannot be avoided, use a documented physical relationship only when it represents the causal production relationship."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: economic_fallback
    applies_to: "co-products"
    rule: "Use economic allocation only when the study method requires it and a physical relation is not representative; retain prices, period, currency, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: waste_treatment
    applies_to: "wastes"
    rule: "Do not assign avoided burdens or credits without an explicit downstream treatment model and disclosed method."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_disclosure
    applies_to: "published dataset"
    rule: "Disclose the allocation hierarchy, quantities, factors, co-product destinations, internal recycling, and unresolved choices."
    source_ids:
      - eu-pef-2021-2279
