  classification_refs: "CPC 3.0: 23130 — Groats, meal and pellets of wheat and other cereals (exact)"
  covered_products: "One explicitly named cereal species supplied as one declared form: groats, meal, or pellets."
  excluded_products: "Flour; flakes; rolled grain; malt; starch; breakfast cereal; couscous; compound feed; prepared multi-ingredient food; cross-species or cross-form averages; any “other cereal” fallback identity."
  representative_product: "One product-specific batch of net conforming groats, meal, or pellets from one declared botanical cereal species."
  production_route: "Exact facility route from grain receipt through the applicable cleaning, conditioning, dehulling, milling, sieving, pelleting, cooling, packaging, storage, hygiene, dust-control, heat-generation, and wastewater-treatment operations."
  market_state: "One declared dry bulk or packaged release state with product-specific moisture, particle-size or pellet-size specification, and storage condition."
functional_unit:
  what: "Provide one specific, specification-conforming CPC 23130 cereal product at the manufacturing facility gate."
  how_much: "1 kg net conforming product, excluding every packaging material."
  how_well: "Meets the locked species identity, product-form definition, composition, moisture, particle-size or pellet-size, hygiene, and release specification."
  how_long_or_cycle: "One released production batch; facility storage duration through release is disclosed."
  reference_flow_link: "Assign the 1 kg reference amount to exactly one final_<species>_<form> output row in packaging_storage_release; every other final-product row is not applicable."
system_boundary:
  rules:
    - rule_id: boundary_start
      applies_to: "foreground system"
      rule: "Begin at the manufacturing facility gate when the exact cereal grain and purchased utilities are received."
      source_ids:
        - un-cpc-3-2025
        - eu-pef-2021-2279
    - rule_id: boundary_end
      applies_to: "foreground system"
      rule: "End after one exact conforming product is stored, released, and measured at the facility gate."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: scope_lock
      applies_to: "product identity"
      rule: "Lock one botanical species, one groats or meal or pellets form, and one actual route; cross-species and cross-form averages are non-conforming."
      source_ids:
        - un-cpc-3-2025
        - codex-cxs-155-1985
        - codex-cxs-178-1991
    - rule_id: upstream_exclusion
      applies_to: "upstream stages"
      rule: "Keep cultivation, pre-receipt post-harvest operations, and inbound transport outside the foreground boundary and link separate upstream datasets."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: cleaning_inclusion
      applies_to: "grain preparation"
      rule: "Include the actual screening, aspiration, magnetic separation, de-stoning, scouring, washing, and grading steps used by the locked route."
      source_ids:
        - fao-grain-milling-quality-1995
        - us-epa-ap42-grain-2003
    - rule_id: conditioning_inclusion
      applies_to: "conditioning"
      rule: "Include water, purchased steam, purchased hot water, holding time, and moisture change only when physically applied."
      source_ids:
        - fao-grain-milling-quality-1995
        - us-epa-ap42-grain-2003
    - rule_id: pellet_route
      applies_to: "pellet products"
      rule: "Include meal conditioning, die pressing, cooling, screening, fines handling, and storage only for a pellet product."
      source_ids:
        - us-epa-ap42-grain-2003
    - rule_id: dust_boundary
      applies_to: "air emissions"
      rule: "Include captured dust, spent control media, dust-control utilities, and residual PM releases for every applicable source and control device."
      source_ids:
        - us-epa-ap42-grain-2003
        - eu-fdm-bat-2019-2031
    - rule_id: heat_boundary
      applies_to: "heat supply"
      rule: "Record purchased steam or hot water when heat crosses the facility boundary; record fuel and feedwater when heat is generated onsite; never count both for the same heat quantity."
      source_ids:
        - ec-jrc-fdm-bref-2019
        - eu-pef-2021-2279
    - rule_id: wastewater_boundary
      applies_to: "wastewater"
      rule: "Include onsite treatment only when physically operated in the foreground facility; otherwise record each named untreated wastewater stream at the facility boundary."
      source_ids:
        - ec-jrc-fdm-bref-2019
        - eu-fdm-bat-2019-2031
    - rule_id: downstream_exclusion
      applies_to: "downstream stages"
      rule: "Exclude distribution beyond the facility gate, retail, use, and end-of-life from the foreground boundary."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: unlisted_species_rule
      applies_to: "unlisted valid cereal"
      rule: "Before validation, add one exact atomic row for every in-scope cereal species, material, package, waste, pollutant, or emission not already listed; never use an “other cereal” selector."
      source_ids:
        - un-cpc-3-2025
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "Exact cereal species, supplier lot, moisture condition, contamination or screening status, mass, and storage state at the manufacturing facility gate."
  starting_condition_role: "Foreground receipt of one identified cereal grain; upstream cultivation, prior drying, and inbound transport remain separate datasets."
  product_classification_scope: "CPC 3.0 code 23130 only; each package represents one species and one of groats, meal, or pellets."
  recursive_input_rule: "A purchased CPC 23130 intermediate is recorded once as an upstream product input with its exact species and form; do not recursively reproduce its manufacturing inventory."
  upstream_dataset_requirement: "Use separate upstream datasets for cereal cultivation, prior post-harvest operations, inbound transport, purchased energy, water, chemicals, packaging, and waste treatment outside the facility."
  disclosure: "Declare geography, technology, batch period, species, form, grain condition, route, packaging, co-products, waste destinations, dust controls, onsite utilities, and wastewater boundary."
