  calculation_rules:
    - id: normalize_reference
      applies_to: "every inventory row"
      rule: "normalized amount = batch-attributable amount / net conforming selected final-product mass"
      inputs:
        - "batch-attributable amount"
        - "selected final-product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: net_mass
      applies_to: "mass records"
      rule: "net mass = gross mass - tare mass"
      inputs:
        - "gross mass"
        - "tare mass"
      output: "net mass"
      source_ids:
        - eu-pef-2021-2279
    - id: dry_matter
      applies_to: "moisture-sensitive flows"
      rule: "dry mass = measured mass × (1 - measured moisture mass fraction)"
      inputs:
        - "measured mass"
        - "batch moisture result"
      output: "dry mass"
      source_ids:
        - fao-grain-milling-quality-1995
    - id: process_mass_balance
      applies_to: "every process"
      rule: "reconciliation difference = total measured inputs - total measured products - total measured co-products - total measured wastes - stock change - measured releases"
      inputs:
        - "process input and output records"
      output: "reconciliation difference"
      source_ids:
        - eu-pef-2021-2279
    - id: shared_meter
      applies_to: "shared utilities"
      rule: "batch amount = meter-period amount × documented causal allocation key; use runtime only when equipment load is demonstrably stable"
      inputs:
        - "meter readings"
        - "batch timestamps"
        - "equipment state"
        - "allocation key"
      output: "batch-attributable utility amount"
      source_ids:
        - eu-pef-2021-2279
    - id: refrigerant_loss
      applies_to: "refrigerants"
      rule: "release = opening inventory + additions - closing inventory - documented recovery or transfer"
      inputs:
        - "refrigerant inventory and service records"
      output: "refrigerant release by exact substance"
      source_ids:
        - eu-pef-2021-2279
    - id: dust_balance
      applies_to: "dust control"
      rule: "residual release = dust entering control - captured dust - deposited dust - returned product dust, reconciled with direct monitoring where available"
      inputs:
        - "dust capture records"
        - "filter records"
        - "monitoring results"
      output: "residual particulate release"
      source_ids:
        - us-epa-ap42-grain-2003
        - eu-fdm-bat-2019-2031
    - id: combustion_emission
      applies_to: "onsite fuel combustion"
      rule: "emission = measured fuel amount × documented fuel-specific factor or direct monitored load; no default factor is supplied by this PCR"
      inputs:
        - "fuel record"
        - "fuel-specific factor or direct measurement"
      output: "pollutant mass by elementary flow"
      source_ids:
        - eu-pef-2021-2279
        - ec-jrc-fdm-bref-2019
    - id: wastewater_load
      applies_to: "wastewater pollutants"
      rule: "pollutant load = measured discharge volume × representative measured concentration with unit conversion"
      inputs:
        - "flow volume"
        - "laboratory concentration"
        - "sampling period"
      output: "pollutant mass by elementary flow"
      source_ids:
        - eu-fdm-bat-2019-2031
        - eu-pef-2021-2279
    - id: packaging_mass
      applies_to: "packaging"
      rule: "packaging mass = issued packaging stock - returned unused stock - verified clean reusable stock change"
      inputs:
        - "packaging issue and return records"
      output: "consumed packaging mass by material"
      source_ids:
        - eu-pef-2021-2279
    - id: final_output_selection
      applies_to: "reference product"
      rule: "exactly one final_<species>_<form> row receives the batch net conforming mass; all other final rows are not applicable"
      inputs:
        - "product specification"
        - "release record"
        - "net mass"
      output: "selected final-product mass"
      source_ids:
        - un-cpc-3-2025
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Retain botanical species, product form, whole or dehulled or degermed state, particle or pellet specification, moisture basis, and release state."
      evidence: "approved product specification and batch traveller"
    - id: dq_scope
      applies_to: "foreground package"
      requirement: "Demonstrate that one package contains one species, one form, and one route."
      evidence: "dataset metadata and process map"
    - id: dq_traceability
      applies_to: "grain and product"
      requirement: "Preserve supplier lot, internal batch, silo or bin, production campaign, and released lot links."
      evidence: "lot genealogy record"
    - id: dq_calibration
      applies_to: "measured values"
      requirement: "Use calibrated scales, meters, samplers, and laboratory instruments within their valid calibration period."
      evidence: "calibration certificates and instrument logs"
    - id: dq_moisture
      applies_to: "mass conversion"
      requirement: "Retain sampling location, test method, timestamp, replicate results, and wet or dry basis."
      evidence: "moisture laboratory record"
    - id: dq_particle_size
      applies_to: "groats, meal, and pellets"
      requirement: "Retain sieve set or pellet measurement method, sample basis, and release result."
      evidence: "particle-size or pellet-size test"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Cover a representative complete production campaign and disclose shutdowns, start-ups, and abnormal batches."
      evidence: "production calendar and exception log"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile every applicable atomic row, including zero or not-applicable decisions, co-products, wastes, wastewater, dust, and direct emissions."
      evidence: "signed completeness matrix"
    - id: dq_sources
      applies_to: "calculated values"
      requirement: "Retain every formula, factor source, unit conversion, and calculation version."
      evidence: "calculation workbook and source register"
    - id: dq_destinations
      applies_to: "co-products and wastes"
      requirement: "Retain quantity, recipient, treatment route, and transfer evidence for every outgoing stream."
      evidence: "weighbridge ticket and transfer document"
    - id: dq_uncertainty
      applies_to: "all rows"
      requirement: "Preserve instrument resolution, sampling uncertainty, missing-data treatment, and reconciliation difference."
      evidence: "uncertainty register"
    - id: dq_review
      applies_to: "published dataset"
      requirement: "Complete independent technical review of identity, boundary, allocation, mass balance, sources, and bilingual machine-field alignment."
      evidence: "signed review record"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "Reference flow shall match the verified CPC 23130 Product flow, Mass property, Units of mass group, and kg unit declared in section 3."
    source_ids:
      - un-cpc-3-2025
  - rule_id: val_reference_mass
    applies_to: "reference amount"
    rule: "Reference amount shall be 1 kg net conforming product and exclude packaging."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_species
    applies_to: "product identity"
    rule: "Botanical cereal species shall be explicit; “other cereal” is not a valid species identity."
    source_ids:
      - un-cpc-3-2025
  - rule_id: val_form
    applies_to: "product identity"
    rule: "Exactly one of groats, meal, or pellets shall be declared for the reference product."
    source_ids:
      - un-cpc-3-2025
  - rule_id: val_one_final_row
    applies_to: "final product"
    rule: "Exactly one final_<species>_<form> row shall carry the normalized 1 kg reference amount."
    source_ids:
      - un-cpc-3-2025
      - eu-pef-2021-2279
  - rule_id: val_process_map
    applies_to: "process inventory"
    rule: "Every process section shall match one process-map id and every required process-map row shall have one process section."
    source_ids:
      - us-epa-ap42-grain-2003
  - rule_id: val_atomic_flow
    applies_to: "inventory cards"
    rule: "Every selected flow shall be one concrete exchange; plural categories, carrier lists, and selector instructions are invalid."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_unlisted_flow
    applies_to: "valid unlisted exchange"
    rule: "Add an exact atomic row before validation when an in-scope species, input, package, co-product, waste, pollutant, or emission is absent."
    source_ids:
      - un-cpc-3-2025
      - eu-pef-2021-2279
  - rule_id: val_uuid_policy
    applies_to: "non-reference UUIDs"
    rule: "Keep a non-reference UUID blank unless exact atomic semantics are confirmed by flow-hybrid-search and public state-100 direct read."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_modes
    applies_to: "inventory amounts"
    rule: "Use only foreground_record or calculated_value; no fixed default, modelled estimate, or reasoned range is permitted here."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_protocols
    applies_to: "inventory cards"
    rule: "Every collected or calculated card shall link to an existing collection protocol."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_mass_balance
    applies_to: "every process"
    rule: "Complete a species-specific and form-specific process mass balance and disclose the reconciliation difference."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_conditioning
    applies_to: "conditioning"
    rule: "Conditioning water, steam, hot water, and holding shall appear only when physically used and measured."
    source_ids:
      - fao-grain-milling-quality-1995
      - us-epa-ap42-grain-2003
  - rule_id: val_pellet_route
    applies_to: "pellets"
    rule: "Pellet data shall include conditioning, die pressing, cooling, screening, fines, and off-spec pellet routing."
    source_ids:
      - us-epa-ap42-grain-2003
  - rule_id: val_packaging
    applies_to: "packaging"
    rule: "Each physical packaging material shall be separate and excluded from reference mass."
    source_ids:
      - codex-cxs-155-1985
      - codex-cxs-178-1991
      - eu-pef-2021-2279
  - rule_id: val_heat_double_count
    applies_to: "heat"
    rule: "Purchased heat and onsite fuel shall not represent the same heat quantity."
    source_ids:
      - ec-jrc-fdm-bref-2019
      - eu-pef-2021-2279
  - rule_id: val_dust
    applies_to: "dust"
    rule: "Record source-specific captured dust, control inputs, spent media, and residual PM releases without netting different species."
    source_ids:
      - us-epa-ap42-grain-2003
      - eu-fdm-bat-2019-2031
  - rule_id: val_wastewater
    applies_to: "wastewater"
    rule: "Keep each wastewater stream and each discharged pollutant separate; treatment inputs and sludge shall be explicit when onsite treatment applies."
    source_ids:
      - ec-jrc-fdm-bref-2019
      - eu-fdm-bat-2019-2031
  - rule_id: val_allocation
    applies_to: "co-products"
    rule: "Disclose allocation avoidance, internal recycling, co-product quantities, allocation basis, and sensitivity without a default factor."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_bilingual
    applies_to: "bilingual PCR"
    rule: "English and Chinese process ids, row ids, controlled tokens, protocol ids, rule ids, source ids, UUIDs, and order shall match."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_completeness
    applies_to: "published dataset"
    rule: "No applicable card, data source, calculation, uncertainty note, or destination evidence may be omitted."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "product-specific foreground dataset suitable for review as a secondary_dataset or background_dataset after approval"
  downstream_use: "lifecycle models that require one explicit cereal species and one CPC 23130 product form at a manufacturing facility gate"
  allowed_use: "modelling of the declared species, form, geography, technology, campaign, packaging state, and allocation method"
  excluded_use: "substitution across cereal species or product forms; undisclosed averages; use as a flour, starch, malt, breakfast cereal, compound-feed, or prepared-food dataset"
  required_metadata: "PCR id; CPC code; species; form; grain condition; route; facility geography; campaign; technology; moisture and particle or pellet specification; packaging; allocation; co-product and waste destinations"
  required_quality_disclosure: "completeness; data sources; foreground coverage; calibration; mass-balance difference; allocation; uncertainty; missing data; UUID gaps; review status"
  update_trigger: "changed species, form, formulation, route, equipment, energy supply, dust control, packaging, allocation, regulation, source evidence, UUID identity, or material data-quality result"
data_sources:
  - id: "un-cpc-3-2025"
    type: "dataset"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0, retained raw structure dated 30 June 2025, code 23130, https://unstats.un.org/unsd/classifications/Econ/cpc (retrieved 2026-08-13)."
    used_for: "Exact CPC title and scope boundary for groats, meal, and pellets of wheat and other cereals."
  - id: "fao-grain-milling-quality-1995"
    type: "official_guidance"
    reference: "FAO, Quality assurance for small-scale rural food industries, Chapter 2: grain cleaning, conditioning, milling, dehulling, and sieving, https://www.fao.org/4/v5380e/v5380e06.htm (retrieved 2026-08-13)."
    used_for: "Incoming-lot records, contaminant removal, conditioning water and moisture checks, dehulling, milling, sieving, and equipment-quality records."
  - id: "us-epa-ap42-grain-2003"
    type: "official_guidance"
    reference: "U.S. EPA, AP-42 Section 9.9.1, Grain Elevators and Processes, April 2003, https://www.epa.gov/sites/default/files/2020-10/documents/c9s0909-1.pdf (retrieved 2026-08-13)."
    used_for: "Receiving, cleaning, tempering, milling, steam conditioning, pelleting, cooling, screening, bagging, dust sources, oil suppression, cyclones, filters, and wet scrubbers."
  - id: "ec-jrc-fdm-bref-2019"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Best Available Techniques Reference Document for the Food, Drink and Milk Industries, JRC118627, EUR 29978 EN, DOI 10.2760/243911, https://publications.jrc.ec.europa.eu/repository/handle/JRC118627 (retrieved 2026-08-13)."
    used_for: "Food-sector process boundary, utilities, energy and water records, waste, wastewater, and air-emission control structure."
  - id: "eu-fdm-bat-2019-2031"
    type: "official_guidance"
    reference: "Commission Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries, https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj (retrieved 2026-08-13)."
    used_for: "Grain-milling dust monitoring and bag filtration, pellet-cooling dust, energy management, water-stream separation, and wastewater management."
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279 on Environmental Footprint methods, https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng (retrieved 2026-08-13)."
    used_for: "Functional and reference flow, product-specific company data, complete material-energy-waste-emission inventory, allocation, data quality, transparency, and verification."
  - id: "codex-cxs-155-1985"
    type: "standard"
    reference: "Codex Alimentarius CXS 155-1985, Standard for Degermed Maize (Corn) Meal and Maize (Corn) Grits, https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FStandards%252FCXS%2B155-1985%252FCXS_155e.pdf (retrieved 2026-08-13)."
    used_for: "Concrete maize species and groats/meal identity, cleaning, grinding, bran and germ removal, hygiene, particle properties, and packaging."
  - id: "codex-cxs-178-1991"
    type: "standard"
    reference: "Codex Alimentarius CXS 178-1991, Standard for Durum Wheat Semolina and Durum Wheat Flour, https://www.fao.org/input/download/standards/60/CXS_178e.pdf (retrieved 2026-08-13)."
    used_for: "Durum wheat species identity, milling and comminution, bran and germ separation, particle-size quality, hygiene, and packaging."
  - id: "codex-cxs-199-1995"
    type: "standard"
    reference: "Codex Alimentarius CXS 199-1995, Standard for Wheat and Durum Wheat, https://www.fao.org/input/download/standards/62/CXS_199e.pdf (retrieved 2026-08-13)."
    used_for: "Wheat and durum wheat identity, moisture and extraneous-matter records, cleaning and sorting, hygiene, lot identity, and packaging."
