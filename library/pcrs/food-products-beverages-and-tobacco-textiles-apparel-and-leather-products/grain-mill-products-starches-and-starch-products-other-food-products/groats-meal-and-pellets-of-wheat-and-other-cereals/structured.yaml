process_map:
  - id: grain_receiving_storage
    name: "Grain receiving and storage"
    inclusion: "required"
    inclusion_condition: "Always include receipt, lot identification, weighing, and facility storage for the locked cereal species."
    role: "Foreground receipt and storage of one declared cereal species."
    quantitative_reference: "mass of accepted grain assigned to the locked production batch"
  - id: grain_cleaning_grading
    name: "Grain cleaning and grading"
    inclusion: "required"
    inclusion_condition: "Always include the actual screening, aspiration, magnetic separation, de-stoning, scouring, washing, or grading steps used."
    role: "Foreground removal of named foreign materials and preparation of one clean grain stream."
    quantitative_reference: "mass of cleaned grain by exact species"
  - id: conditioning_tempering
    name: "Conditioning and tempering"
    inclusion: "conditional"
    inclusion_condition: "Include only when water, purchased steam, purchased hot water, or a holding step changes grain moisture or milling behaviour."
    role: "Foreground moisture adjustment and tempering of one cleaned grain stream."
    quantitative_reference: "mass of tempered grain by exact species"
  - id: dehulling_milling_sieving
    name: "Dehulling, milling and sieving"
    inclusion: "required"
    inclusion_condition: "Always include the actual dehulling, cutting, grinding, classification, and sieving operations needed for the locked groats, meal, or pellet route."
    role: "Foreground production of species-specific groats or meal and named co-products."
    quantitative_reference: "mass of each exact product form and co-product"
  - id: pellet_forming_cooling
    name: "Pellet forming and cooling"
    inclusion: "conditional"
    inclusion_condition: "Include only when the declared reference product form is pellets."
    role: "Foreground steam conditioning, die pressing, cooling, and screening for one species-specific pellet."
    quantitative_reference: "mass of conforming species-specific pellets"
  - id: packaging_storage_release
    name: "Packaging, finished storage and release"
    inclusion: "required"
    inclusion_condition: "Always include finished-product storage and release; include each packaging material only when it is physically used."
    role: "Foreground release of exactly one species-specific product form at the facility gate."
    quantitative_reference: "net mass of one conforming released product"
  - id: dust_collection_control
    name: "Dust collection and control"
    inclusion: "conditional"
    inclusion_condition: "Include when aspiration, a cyclone, a fabric filter, wet scrubbing, or oil suppression is used for the locked route."
    role: "Foreground capture, recovery, disposal, and residual release of process dust."
    quantitative_reference: "mass of captured dust and residual particulate release"
  - id: hygiene_cleaning
    name: "Hygiene and equipment cleaning"
    inclusion: "required"
    inclusion_condition: "Always include campaign-attributable dry cleaning and any wet cleaning or sanitation actually performed."
    role: "Foreground hygiene operations for food-contact equipment and production areas."
    quantitative_reference: "campaign-attributable cleaning records"
  - id: onsite_heat_generation
    name: "Onsite heat generation"
    inclusion: "conditional"
    inclusion_condition: "Include only when steam or hot water is generated inside the foreground facility boundary."
    role: "Foreground conversion of one recorded fuel into steam or hot water."
    quantitative_reference: "fuel inventory and useful heat output"
  - id: onsite_wastewater_treatment
    name: "Onsite wastewater treatment"
    inclusion: "conditional"
    inclusion_condition: "Include only when wastewater treatment is physically operated within the foreground facility boundary."
    role: "Foreground treatment of each named wastewater stream and recording of residual pollutants."
    quantitative_reference: "volume and pollutant load of each treated stream"
