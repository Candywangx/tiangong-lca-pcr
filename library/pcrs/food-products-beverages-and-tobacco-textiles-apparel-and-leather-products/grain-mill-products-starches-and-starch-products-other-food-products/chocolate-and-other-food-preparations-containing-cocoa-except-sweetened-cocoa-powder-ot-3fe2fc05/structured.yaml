allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "foreground burdens"
    rule: "Avoid allocation by subdividing processes, separately metering unit operations, and tracking internal intermediates and rework."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_internal_rework
    applies_to: "internal rework"
    rule: "Treat rework that returns to the same foreground system as an internal loop; do not credit it as an avoided product and do not count it as waste unless it leaves the boundary."
    source_ids: []
  - rule_id: allocation_physical_relation
    applies_to: "unavoidable co-product allocation"
    rule: "Use a demonstrable physical relationship that reflects how inputs and outputs change; disclose the relationship, factor, and affected flows."
    source_ids:
      - ec-pef-2021-2279
      - bianchi-2020-chocolate-lca
  - rule_id: allocation_fallback_sensitivity
    applies_to: "cocoa liquor, butter, powder, or other jointly produced outputs"
    rule: "If no more representative physical relation is available, use dry mass as the provisional allocation basis and test an energy-content or economic alternative when the result is material."
    source_ids:
      - bianchi-2020-chocolate-lca
  - rule_id: allocation_shared_utilities
    applies_to: "site totals not directly metered to products"
    rule: "Allocate using documented causal drivers such as equipment energy, operating time, throughput, or production mass; reconcile allocated totals to the site record and prevent double counting."
    source_ids:
      - ec-pef-2021-2279
      - eu-fdm-bat-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_cocoa_bean_inputs
      process_id: "cocoa_bean_processing"
      flow_role: "dried cocoa beans"
      record_type: "receiving and batch issue records"
      raw_fields: "lot id; supplier; origin; mass; moisture; receiving date; batch id"
      collection_method: "calibrated scale or weighbridge reconciled to inventory"
      unit: "kg"
      frequency: "per lot and batch"
      temporal_coverage: "representative production period, normally at least 12 consecutive months"
      site_scope: "all lines receiving beans for covered products"
      aggregation_rule: "sum attributable bean mass and normalize to released net product"
      quality_evidence: "scale calibration; lot traceability; inventory reconciliation"
    - protocol_id: cp_cocoa_intermediate_outputs
      process_id: "cocoa_bean_processing"
      flow_role: "cocoa liquor, butter, powder, and residues"
      record_type: "transfer and yield records"
      raw_fields: "batch id; intermediate identity; input mass; output mass; moisture or solids; destination"
      collection_method: "calibrated scale plus batch mass balance"
      unit: "kg"
      frequency: "per batch"
      temporal_coverage: "same period as reference product"
      site_scope: "all on-site bean-processing lines"
      aggregation_rule: "sum outputs by identity and reconcile to bean input and residues"
      quality_evidence: "scale calibration; batch yield report; reconciliation"
    - protocol_id: cp_formulation_inputs
      process_id: "ingredient_formulation"
      flow_role: "cocoa and non-cocoa formulation inputs"
      record_type: "recipe, batch issue, and inventory records"
      raw_fields: "product code; batch id; ingredient id; lot id; issued mass; return mass; moisture or concentration"
      collection_method: "calibrated dosing system and inventory reconciliation"
      unit: "kg"
      frequency: "per batch"
      temporal_coverage: "same period as reference product"
      site_scope: "all formulation lines for covered products"
      aggregation_rule: "net issued mass by ingredient divided by released net product"
      quality_evidence: "recipe version; dosing calibration; lot and stock reconciliation"
    - protocol_id: cp_process_transfers
      process_id: "refining_conching"
      flow_role: "internal formulated and refined chocolate transfers"
      record_type: "batch transfer records"
      raw_fields: "batch id; source process; destination process; material identity; gross mass; tare; timestamp"
      collection_method: "calibrated vessel, load-cell, or mass-balance transfer record"
      unit: "kg"
      frequency: "per transfer or batch"
      temporal_coverage: "same period as reference product"
      site_scope: "all covered refining, conching, and finishing lines"
      aggregation_rule: "reconcile incoming and outgoing transfers without adding upstream burdens twice"
      quality_evidence: "equipment calibration; batch genealogy; transfer reconciliation"
    - protocol_id: cp_finished_product_mass
      process_id: "tempering_forming_finishing"
      flow_role: "conforming finished edible product"
      record_type: "production and release records"
      raw_fields: "product code; batch id; gross mass; packaging tare; net edible mass; rejects; release status"
      collection_method: "calibrated checkweigher or reconciled production scale"
      unit: "kg"
      frequency: "per batch and packaging run"
      temporal_coverage: "same period as reference product"
      site_scope: "all covered forming and finishing lines"
      aggregation_rule: "sum released net edible mass; exclude packaging and unreleased rejects"
      quality_evidence: "scale calibration; release record; net-content reconciliation"
    - protocol_id: cp_packaging_materials
      process_id: "non_bulk_packaging"
      flow_role: "packaging consumption"
      record_type: "bill of materials, issue, return, and stock records"
      raw_fields: "packaging material id; composition; issued mass; returned mass; packaged units; scrap"
      collection_method: "measured issue/return or supplier mass verified by sampling"
      unit: "kg"
      frequency: "per packaging run and monthly reconciliation"
      temporal_coverage: "same period as reference product"
      site_scope: "all non-bulk packaging lines"
      aggregation_rule: "net consumed packaging mass by material divided by released net product"
      quality_evidence: "bill-of-material revision; stock reconciliation; sample weighing"
    - protocol_id: cp_waste_outputs
      process_id: "non_bulk_packaging"
      flow_role: "food and packaging wastes"
      record_type: "waste logs and transfer documents"
      raw_fields: "waste type; source process; mass; date; destination; treatment route; rework status"
      collection_method: "calibrated waste scale and contractor records"
      unit: "kg"
      frequency: "per collection and monthly reconciliation"
      temporal_coverage: "same period as reference product"
      site_scope: "all foreground processes"
      aggregation_rule: "sum only waste crossing the site boundary by type and route"
      quality_evidence: "scale calibration; transfer note; rework reconciliation"
    - protocol_id: cp_site_utilities
      process_id: "site_utilities_environmental_control"
      flow_role: "electricity, heat, fuels, and cooling"
      record_type: "meters, invoices, fuel receipts, and production logs"
      raw_fields: "meter id; opening and closing readings; fuel quantity; calorific value; production period; line operating hours"
      collection_method: "revenue meter, submeter, or reconciled engineering allocation"
      unit: "native meter unit, kWh, MJ, or kg"
      frequency: "continuous or per invoice; aggregate monthly"
      temporal_coverage: "representative production period, normally at least 12 consecutive months"
      site_scope: "complete site and all covered production lines"
      aggregation_rule: "subtract excluded uses, allocate with disclosed driver, and reconcile to site total"
      quality_evidence: "meter calibration; invoices; allocation worksheet; site-total reconciliation"
    - protocol_id: cp_water_wastewater
      process_id: "site_utilities_environmental_control"
      flow_role: "water and wastewater"
      record_type: "supply and discharge meters, water balance, and monitoring records"
      raw_fields: "source; inflow; use area; discharge route; flow; pH; temperature; monitored pollutant loads"
      collection_method: "meters and documented water balance; accredited analysis where applicable"
      unit: "kg, m3, and substance-specific units"
      frequency: "continuous or monthly flow; monitoring frequency appropriate to permit and source"
      temporal_coverage: "same period as reference product"
      site_scope: "complete site water system"
      aggregation_rule: "reconcile inflow, consumption, product incorporation, evaporation, and discharge"
      quality_evidence: "meter calibration; water-balance closure; laboratory reports"
    - protocol_id: cp_direct_emissions
      process_id: "site_utilities_environmental_control"
      flow_role: "direct emissions to air and water"
      record_type: "stack, fugitive, refrigerant, wastewater, and fuel records"
      raw_fields: "source id; substance; concentration; flow; operating time; fuel use; factor; refrigerant additions; compartment"
      collection_method: "direct monitoring or transparent calculation from collected activity data"
      unit: "kg substance and source-specific measurement units"
      frequency: "by monitoring plan and per material event"
      temporal_coverage: "same period as reference product"
      site_scope: "all foreground emission sources"
      aggregation_rule: "concentration x flow x time or collected activity x documented factor, then normalize"
      quality_evidence: "calibration; laboratory report; factor citation; calculation worksheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground inventory rows"
      rule: "normalized amount = attributable period amount / released net edible product kg"
      inputs:
        - "protocol-specific attributable amount"
        - cp_finished_product_mass
      output: "amount per 1 kg net edible reference product"
      source_ids: []
    - id: calc_formulation_balance
      applies_to: "ingredient formulation"
      rule: "net ingredient input = issued mass - returned unused mass; reconcile sum of net inputs to internal transfers, measured losses, and wastes"
      inputs:
        - cp_formulation_inputs
        - cp_process_transfers
        - cp_waste_outputs
      output: "reconciled kg ingredient by type per reference flow"
      source_ids:
        - codex-cxs-87-1981
    - id: calc_packaging_consumption
      applies_to: "packaging"
      rule: "net packaging consumed = issued mass - unused return; reconcile to packaged units and packaging scrap"
      inputs:
        - cp_packaging_materials
        - cp_waste_outputs
      output: "kg packaging material by type per reference flow"
      source_ids: []
    - id: calc_utility_allocation
      applies_to: "shared site utilities"
      rule: "attributable utility = complete site utility total - excluded uses, multiplied by disclosed causal allocation share; sum of shares must equal the allocable total"
      inputs:
        - cp_site_utilities
        - "operating hours"
        - throughput
        - "submeter data"
      output: "kWh, MJ, or kg utility per reference flow"
      source_ids:
        - ec-pef-2021-2279
        - eu-fdm-bat-2019
    - id: calc_water_balance
      applies_to: "water and wastewater"
      rule: "water input = product incorporation + evaporation + wastewater + other measured losses within documented uncertainty"
      inputs:
        - cp_water_wastewater
      output: "reconciled water input and wastewater per reference flow"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_direct_emissions
      applies_to: "direct emissions"
      rule: "emission mass = measured concentration x standardized volumetric flow x operating time, or collected activity x cited emission factor"
      inputs:
        - cp_direct_emissions
      output: "kg substance by compartment per reference flow"
      source_ids:
        - eu-fdm-bat-2019
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain product code, subtype, recipe version, cocoa-content declaration, physical form, filling or inclusions, packaging configuration, batch id, and release status."
      evidence: "product specification; recipe; release record; codex-cxs-87-1981"
    - id: dq_mass_measurement
      applies_to: "all material inputs and outputs"
      requirement: "Use calibrated weighing systems and reconcile ingredient, intermediate, product, rework, waste, and packaging masses for the same production population."
      evidence: "calibration records; batch and period mass balances"
    - id: dq_temporal_coverage
      applies_to: "foreground activity data"
      requirement: "Use a representative continuous period, normally at least 12 months, or disclose seasonality, campaign duration, start-up, shutdown, and other departures."
      evidence: "dated raw records; coverage statement"
    - id: dq_geography_technology
      applies_to: "site and upstream links"
      requirement: "Declare site geography, production technology, cocoa-material starting condition, energy supply, wastewater treatment, and representativeness of upstream datasets."
      evidence: "site description; supplier and dataset metadata"
    - id: dq_environmental_completeness
      applies_to: "utilities, wastes, wastewater, and emissions"
      requirement: "Maintain a complete inventory of water, energy, raw materials, waste water, waste gas, solid waste, and relevant direct emissions, with justified zeroes and omissions."
      evidence: "process flow sheet; inventories and monitoring plan; eu-fdm-bat-2019"
    - id: dq_allocation
      applies_to: "shared processes and co-products"
      requirement: "Retain subdivision attempts, allocation drivers, factors, reconciliations, and sensitivity results for material allocation choices."
      evidence: "allocation worksheet; meter reconciliation; sensitivity result"
    - id: dq_estimate_replacement
      applies_to: "provisional reasoned ranges"
      requirement: "Treat every reasoned_estimate range as a replaceable QA screen, never as a published default; replace or explicitly review it before methodology activation."
      evidence: "review record and source-backed or foreground range evidence"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require Chocolate UUID 4c4a6e1b-a4a8-4d16-ac36-1e5492e752a3, Product flow type, reference property Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "product identity"
    rule: "Require a non-bulk finished cocoa-containing preparation and reject sweetened cocoa powder, bulk cocoa/chocolate intermediates, cocoa-free confectionery, and prepared beverages."
    source_ids:
      - codex-cxs-87-1981
  - rule_id: validate_qualifiers
    applies_to: "reference product metadata"
    rule: "Fail completeness when any required qualifier in section 3 is absent."
    source_ids:
      - codex-cxs-87-1981
  - rule_id: validate_starting_condition
    applies_to: "system boundary"
    rule: "Require the incoming cocoa-material condition and inclusion or exclusion of on-site cocoa-bean processing to be explicit and consistent with process inventory."
    source_ids:
      - bianchi-2020-chocolate-lca
  - rule_id: validate_process_coverage
    applies_to: "process map and inventory"
    rule: "Require formulation, refining/conching, declared finishing operations, non-bulk packaging, and site utilities; require cocoa-bean processing when beans enter the site."
    source_ids:
      - bianchi-2020-chocolate-lca
      - eu-fdm-bat-2019
  - rule_id: validate_mass_balance
    applies_to: "material inventory"
    rule: "Reconcile ingredients and internal transfers to released edible product, packaging, wastes, emissions, and inventory change within disclosed uncertainty."
    source_ids: []
  - rule_id: validate_environmental_inventory
    applies_to: "site utilities and releases"
    rule: "Require complete water, energy, raw-material, wastewater, waste-gas, solid-waste, and relevant direct-emission records, with zeroes and omissions justified."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validate_allocation
    applies_to: "shared utilities and co-products"
    rule: "Require allocation avoidance evidence, disclosed causal driver or fallback basis, complete total reconciliation, and no duplicate utility or intermediate burden."
    source_ids:
      - ec-pef-2021-2279
      - bianchi-2020-chocolate-lca
  - rule_id: validate_reasoned_estimates
    applies_to: "QA ranges"
    rule: "Flag every reasoned_estimate as provisional and fail activation if a publication-critical allowed range still relies on unreviewed reasoned evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground unit-process data package for finished non-bulk chocolate and cocoa-containing food preparations"
  downstream_use: "secondary_dataset; background_dataset; process and lifecyclemodel projections"
  allowed_use: "Products matching CPC 3.0 23660 and the declared formulation, physical form, starting condition, geography, technology, packaging, and factory-gate boundary"
  excluded_use: "Sweetened cocoa powder; bulk cocoa/chocolate intermediates; cocoa-free confectionery; prepared beverages; products with materially different starting conditions or unit operations; comparative consumer claims without a separately justified functional equivalence"
  required_metadata: "canonical PCR id; reference UUID and mass basis; product subtype; formulation and cocoa-content declaration; dairy, filling, and inclusion status; physical form; starting cocoa material; site geography; reference year; technology; process coverage; packaging bill; allocation; cut-offs; upstream dataset identities"
  required_quality_disclosure: "raw-record coverage; calibration; mass, water, and utility reconciliation; data gaps; estimated shares; reasoned-estimate replacements; allocation and sensitivity; wastewater and direct-emission monitoring; upstream representativeness"
  update_trigger: "material recipe or cocoa-content change; new starting cocoa material; changed process route, equipment, energy mix, packaging, geography, allocation, environmental control, regulatory requirement, or data period; replacement of a material provisional estimate"
data_sources:
  - id: "codex-cxs-87-1981"
    type: "standard"
