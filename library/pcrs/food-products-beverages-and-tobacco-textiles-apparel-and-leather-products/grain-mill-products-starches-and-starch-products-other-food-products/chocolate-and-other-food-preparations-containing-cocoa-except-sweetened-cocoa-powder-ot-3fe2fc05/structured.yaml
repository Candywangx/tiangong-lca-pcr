    used_for: "Functional unit and reference flow framing, life-cycle boundary, inventory completeness, allocation hierarchy, data quality and robustness"
  - id: "eu-fdm-bat-2019"
    type: "official_guidance"
    reference: "Commission Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries, https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj (retrieved 2026-08-10)"
