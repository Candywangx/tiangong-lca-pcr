system_boundary:
  rules:
    - rule_id: boundary_default_gate
      applies_to: "foreground starting and ending gates"
      rule: "Begin at site receipt of cocoa materials, other ingredients, and packaging; end with released non-bulk product and separately recorded packaging at factory gate. Require upstream datasets for purchased inputs."
      source_ids:
        - ec-pef-2021-2279
        - bianchi-2020-chocolate-lca
    - rule_id: boundary_on_site_cocoa_processing
      applies_to: "sites receiving dried cocoa beans"
      rule: "Include cleaning and selection, roasting, winnowing, milling, and any on-site pressing or cake grinding used to produce cocoa liquor, butter, or powder."
      source_ids:
        - bianchi-2020-chocolate-lca
    - rule_id: boundary_environmental_inventory
      applies_to: "all foreground processes"
      rule: "Inventory raw materials, water, energy, waste water, waste gas, solid waste, and relevant direct emissions; retain a process flow sheet showing where emissions arise."
      source_ids:
        - eu-fdm-bat-2019
    - rule_id: boundary_downstream_separation
      applies_to: "distribution, use, and end of life"
      rule: "Exclude downstream stages from this foreground package but keep product and packaging outputs suitable for connection to a downstream cradle-to-grave model."
      source_ids:
        - ec-pef-2021-2279
    - rule_id: boundary_no_double_counting
      applies_to: "shared utilities and internal intermediates"
      rule: "Assign each input, emission, waste, and intermediate transfer once; where site totals are allocated to processes, do not also add the same submetered quantity."
      source_ids:
        - ec-pef-2021-2279
