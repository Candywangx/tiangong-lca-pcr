system_boundary:
  rules:
    - rule_id: boundary_route_specific_operations
      applies_to: "Foreground manufacturing"
      rule: "Include every applicable controlled operation from input receipt through the declared factory-gate product. For microbial products this may include culture and feed preparation, aerobic cultivation, recovery, inactivation, drying and finishing; for prepared baking powder it includes ingredient receipt, dosing, blending, quality control and packing."
      source_ids:
        - us-epa-ap42-yeast-1995
        - canada-cfcs-baking-powder
    - rule_id: boundary_upstream_links
      applies_to: "Purchased inputs and services"
      rule: "Keep purchased materials, cultures, ingredients, energy, water supply, packaging, transport services, and external treatment as explicit inputs linked to appropriate upstream datasets; do not omit a material input merely because it is outside direct operational control."
      source_ids:
        - iso-14044-2006
        - eu-commission-pef-2021
    - rule_id: boundary_direct_releases
      applies_to: "Direct emissions and wastes"
      rule: "Record direct releases and treatment transfers from applicable fermentation, separation, drying, powder handling, cleaning, and wastewater operations using facility records; do not use the absence of a default factor as evidence of zero."
      source_ids:
        - us-epa-ap42-yeast-1995
        - iso-14044-2006
    - rule_id: boundary_category_not_route_average
      applies_to: "Product and route selection"
      rule: "Include only the process modules that apply to the declared product. Do not apply a dried-yeast process, biological activity assumption, or reference UUID to inactive yeast, other dead single-cell organisms, or prepared baking powder without an explicit match."
      source_ids:
        - un-cpc-v3-23996
    - rule_id: boundary_packaging_and_dispatch
      applies_to: "Factory-gate market state"
      rule: "Include packaging and dispatch preparation when they are part of the declared market state, keep packaging mass outside net product mass, and disclose any deliberate packaging exclusion."
      source_ids:
        - eu-commission-pef-2021
boundary_abstraction:
  declared_starting_condition: "Purchased substrates, cultures, ingredients, processing aids, utilities, and packaging are received at the reporting facility in their documented as-received state."
  starting_condition_role: "Foreground manufacturing gate; upstream production remains in linked supplier or background datasets."
  product_classification_scope: "CPC 3.0 subclass 23996, while each data package represents one specifically declared product and route."
  recursive_input_rule: "A purchased input that is itself in CPC 23996 remains a visible product input linked to a separate upstream dataset; do not recursively absorb it into the same foreground process or relabel it with the representative UUID."
  upstream_dataset_requirement: "Link all material purchased substrates, ingredients, cultures, nutrients, utilities, packaging materials, and externally treated wastes to geographically, temporally, technologically, and product-form appropriate datasets."
  disclosure: "Declare the actual product family, biological state, formulation or organism, physical form, moisture basis, grade, production route, reporting period, facility coverage, packaging state, excluded operations, same-category inputs, and product-flow substitution decision."
