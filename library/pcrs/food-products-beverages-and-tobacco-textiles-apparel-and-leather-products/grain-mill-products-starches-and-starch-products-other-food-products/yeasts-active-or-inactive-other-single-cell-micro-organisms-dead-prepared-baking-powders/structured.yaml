allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Separable products, routes, batches, and operations"
    rule: "Avoid allocation by separately measuring and modelling distinct product routes, batches, unit operations, rework loops, and waste-treatment activities whenever practical."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_physical_driver
    applies_to: "Unavoidable shared inputs and emissions"
    rule: "When subdivision is not practical, allocate shared burdens using a documented causal physical driver such as metered equipment use, processing time, dry-matter throughput, or another measurable relationship appropriate to the shared operation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_other_relationship
    applies_to: "Shared burdens without a defensible physical relationship"
    rule: "Use another relationship, including economic allocation, only when no defensible causal physical basis exists; disclose the method, data period, prices or other parameters, and a sensitivity check."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_co_product_accounting
    applies_to: "Saleable co-products, recovered materials, and rework"
    rule: "Keep co-product quantities and destinations explicit. Do not treat internal rework as a second product, and do not credit exported material or energy without an explicitly declared system-expansion, substitution, or allocation method consistent with the study goal."
    source_ids:
      - iso-14044-2006
      - eu-commission-pef-2021
  - rule_id: allocation_category_routes
    applies_to: "Mixed production of microbial products and prepared baking powder"
    rule: "Do not allocate category-wide average burdens across materially different organisms, biological states, formulations, or product forms without documented representativeness and product-specific output quantities."
    source_ids:
      - un-cpc-v3-23996
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_raw_material_preparation
      process_id: "raw_material_preparation"
      flow_role: "Primary materials, water, energy, intermediate output, residues, wastewater"
      record_type: "Purchase and issue records; scales; meters; batch and cleaning logs; waste transfers"
      raw_fields: "material_id; supplier; lot; opening_stock; receipts; issues; returns; closing_stock; measured_mass; water_volume; energy_by_carrier; intermediate_mass; waste_mass; wastewater_volume; timestamp"
      collection_method: "Reconcile material and utility records to each batch or stable reporting period and retain route-specific identities"
      unit: "kg; m3; kWh; MJ"
      frequency: "Each batch with reporting-period reconciliation"
      temporal_coverage: "Declared representative production period covering routine and material campaign variation"
      site_scope: "Every facility included in the dataset"
      aggregation_rule: "Sum verified inputs and outputs, apply stock-change corrections, then normalize to net conforming factory-gate output"
      quality_evidence: "Calibrated scale and meter records; signed batch sheets; invoices; stock reconciliation; waste manifests"
    - protocol_id: cp_microbial_biomass_production
      process_id: "microbial_biomass_production"
      flow_role: "Cultivation inputs, wet biomass, wastewater, direct CO2 and VOC"
      record_type: "Fermentor batch records; dosing systems; utility meters; laboratory solids tests; discharge and emission records"
      raw_fields: "strain; batch_id; feed_mass; inoculum_mass; nutrient_mass; water; electricity; thermal_energy; aeration; broth_mass; solids_fraction; wastewater; measured_emissions; operating_time"
      collection_method: "Collect per fermentor or campaign and reconcile transfers to recovery; distinguish measured emissions from calculations"
      unit: "kg; m3; kWh; MJ; h"
      frequency: "Each cultivation batch or campaign"
      temporal_coverage: "Declared representative period including material product and seasonal variation"
      site_scope: "Each cultivation line and facility included"
      aggregation_rule: "Aggregate only comparable product and operating states; normalize to measured recovered-broth or culture output and then to reference product"
      quality_evidence: "Batch release records; calibrated meters; laboratory results; emission-monitoring method and calculation file"
    - protocol_id: cp_biomass_recovery_finishing
      process_id: "biomass_recovery_and_finishing"
      flow_role: "Recovery inputs, finished microbial product, wastes, wastewater, and direct air releases"
      record_type: "Transfer scales; moisture or solids tests; dosing and utility records; dryer and filter logs; waste and emission records"
      raw_fields: "batch_id; incoming_mass; incoming_solids; aids; water; electricity; thermal_energy; product_mass; moisture; biological_state_test; waste_mass; wastewater; pollutant_mass"
      collection_method: "Reconcile each recovery and finishing batch from incoming intermediate through conforming product and all losses"
      unit: "kg; m3; kWh; MJ"
      frequency: "Each batch with reporting-period reconciliation"
      temporal_coverage: "Declared representative period covering all included product forms and technologies"
      site_scope: "Each recovery, inactivation, drying, or finishing line included"
      aggregation_rule: "Normalize to conforming product at the declared moisture basis; keep routes and forms separate unless representativeness is demonstrated"
      quality_evidence: "Calibrated scale and meter records; laboratory moisture and state tests; equipment logs; waste manifests; emission records"
    - protocol_id: cp_baking_powder_formulation
      process_id: "baking_powder_formulation"
      flow_role: "Formulation ingredients, energy, conforming blend, off-specification material, recovered dust, and releases"
      record_type: "Supplier and lot records; calibrated dosing scales; batch sheets; utility meters; release tests; dust and waste records"
      raw_fields: "formulation_id; ingredient_identity; supplier; lot; dose_mass; opening_stock; closing_stock; energy; product_mass; release_result; rework_mass; waste_mass; collected_dust; emitted_dust"
      collection_method: "Collect each ingredient dose and output by batch and reconcile the complete formulation mass balance"
      unit: "kg; kWh; MJ"
      frequency: "Each formulation batch"
      temporal_coverage: "Declared representative period covering all included formulations"
      site_scope: "Each blending line and facility included"
      aggregation_rule: "Keep formulations separate unless a weighted average is justified by production volumes and equivalent performance"
      quality_evidence: "Approved formulation; supplier certificates; calibrated scale records; signed batch and release records; waste and dust-control records"
    - protocol_id: cp_packaging_and_dispatch
      process_id: "packaging_and_dispatch"
      flow_role: "Bulk product, packaging, energy, reference output, rejects and dispatch losses"
      record_type: "Transfer and dispatch scales; packaging issue records; component weights; utility meters; packing logs; waste records"
      raw_fields: "product_id; batch_id; bulk_mass; package_component; component_mass; component_count; energy; dispatched_net_mass; packaging_mass; reject_mass; recovered_product; timestamp"
      collection_method: "Reconcile bulk input, net dispatched product, packaging issued, rejects, recovered product, and stock change"
      unit: "kg; item; kWh; MJ"
      frequency: "Each packing or bulk-dispatch batch"
      temporal_coverage: "Same period as upstream foreground production"
      site_scope: "Every packing line, bulk-loading line, and facility included"
      aggregation_rule: "Sum net conforming dispatch mass and normalize all inventory to 1 kg net product; exclude packaging mass from reference amount"
      quality_evidence: "Calibrated dispatch scale; packaging specifications; issue records; shipment records; waste records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "Normalized amount = verified reporting-period or batch amount divided by net conforming factory-gate product mass on the declared basis."
      inputs:
        - "row amount"
        - "net conforming product mass"
        - "moisture basis where applicable"
      output: "Amount per 1 kg net declared product"
      source_ids:
        - iso-14044-2006
    - id: calc_stock_reconciliation
      applies_to: "Purchased and intermediate materials"
      rule: "Material consumed = opening stock + receipts - closing stock - documented returns; investigate material differences before normalization."
      inputs:
        - "opening stock"
        - receipts
        - "closing stock"
        - returns
        - "issue records"
      output: "Reconciled material consumption"
      source_ids:
        - iso-14044-2006
    - id: calc_dry_matter_conversion
      applies_to: "Microbial products reported on wet and dry bases"
      rule: "Dry mass = as-sold mass multiplied by measured dry-matter fraction. Do not use a generic moisture factor across product forms or lots."
      inputs:
        - "as-sold mass"
        - "measured dry-matter fraction"
      output: "Dry mass and retained conversion record"
      source_ids:
        - iso-14044-2006
    - id: calc_shared_utility_allocation
      applies_to: "Shared utility meters"
      rule: "Use direct submeters first; otherwise allocate by a measured causal driver such as equipment power multiplied by operating time and document unallocated baseload."
      inputs:
        - "meter total"
        - "submeter values"
        - "equipment power"
        - "operating time"
        - throughput
      output: "Product- and process-specific utility amount"
      source_ids:
        - iso-14044-2006
    - id: calc_direct_emissions
      applies_to: "Direct air and water releases"
      rule: "Use validated facility measurement or a documented calculation from collected concentration, flow, operating time, carbon balance, or mass balance. Do not treat AP-42 factors as product defaults."
      inputs:
        - "measured concentration"
        - "standardized gas or water flow"
        - "operating time"
        - "collected material and carbon records"
      output: "Pollutant-specific direct release"
      source_ids:
        - us-epa-ap42-yeast-1995
        - iso-14044-2006
    - id: calc_packaging_normalization
      applies_to: "Packaging"
      rule: "Packaging per reference flow = reconciled component mass placed on the market divided by net conforming product mass dispatched."
      inputs:
        - "packaging component counts and masses"
        - "net dispatched product mass"
        - "rejects and returns"
      output: "kg packaging component per 1 kg net product"
      source_ids:
        - eu-commission-pef-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and all product outputs"
      requirement: "Demonstrate the specific product family, organism and strain when relevant, biological state, form, moisture basis, grade, formulation when relevant, and exact Tiangong flow-match decision."
      evidence: "Approved product specification; batch release; flow readback or documented unresolved identity gap"
    - id: dq_route_separation
      applies_to: "Mixed facilities and product portfolios"
      requirement: "Keep materially different microbial routes, biological states, drying technologies, formulations, and packaging states separate unless a production-weighted aggregation is justified and disclosed."
      evidence: "Product-route matrix; batch list; production volumes; aggregation rationale"
    - id: dq_temporal_representativeness
      applies_to: "All foreground data"
      requirement: "Use one consistent, declared period that represents routine operation and captures material campaigns, seasonal conditions, downtime, rework, and abnormal exclusions."
      evidence: "Reporting-period statement; production schedule; exclusion log; reconciliation"
    - id: dq_measurement_control
      applies_to: "Mass, water, energy, moisture, emissions, and waste"
      requirement: "Use calibrated or verified instruments and retain units, conversion factors, detection limits where relevant, and responsible records."
      evidence: "Calibration certificates; meter checks; laboratory methods; chain of custody; calculation files"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Reconcile material, product, waste, water, energy, and direct-release records and document every material gap, estimate, exclusion, and cut-off decision."
      evidence: "Mass and utility reconciliation; completeness checklist; variance investigation; exclusion register"
    - id: dq_upstream_fit
      applies_to: "Linked upstream datasets"
      requirement: "Select datasets that match material identity, product form, technology, geography, time, and supplier situation; disclose proxies and substitution choices."
      evidence: "Supplier data; dataset metadata; proxy justification; sensitivity or improvement plan"
    - id: dq_source_traceability
      applies_to: "All calculated and source-constrained values"
      requirement: "Preserve the raw foreground record, formula, allocation driver, source identifier, operator, and revision so every normalized value can be reproduced."
      evidence: "Audit trail; versioned calculation workbook or script; source register; reviewer record"
    - id: dq_review_and_verification
      applies_to: "Shared or published datasets"
      requirement: "Review product identity, boundary, allocation, data quality, and reproducibility before publication; third-party disclosed studies follow the applicable verification requirements."
      evidence: "Review checklist; issue resolution; verification statement where applicable; eu-commission-pef-2021"
validation_rules:
  - rule_id: validate_product_identity
    applies_to: "Product category and dataset metadata"
    rule: "Fail conformance when the concrete product family, biological state, form, moisture or dry-matter basis, grade, formulation when applicable, production route, or packaging state is missing."
    source_ids:
      - un-cpc-v3-23996
  - rule_id: validate_reference_flow
    applies_to: "Reference flow"
    rule: "Require exactly 1 kg net conforming declared product at factory gate, Mass property, Units of mass unit group, kg reference unit, and all required qualifiers."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_representative_uuid
    applies_to: "Tiangong product-flow identity"
    rule: "Reject silent use of 3ea5b163-5e50-4f40-bf13-8a6c3f10d1b6 for a product that is not matching dried yeast, feed-grade; require a closer verified flow when available and an explicit identity gap when none is available."
    source_ids:
      - un-cpc-v3-23996
  - rule_id: validate_route_coverage
    applies_to: "Process map and inventory"
    rule: "Require all and only applicable route modules: preparation and dispatch always, microbial cultivation and recovery/finishing for relevant microbial routes, and baking-powder formulation for prepared baking powder."
    source_ids:
      - us-epa-ap42-yeast-1995
      - canada-cfcs-baking-powder
  - rule_id: validate_mass_and_units
    applies_to: "Measurement and normalization"
    rule: "Require consistent mass units, stock-change reconciliation, net-product normalization, separate packaging mass, and measured moisture conversion when wet and dry bases are compared."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_inventory_completeness
    applies_to: "Materials, utilities, wastes, and direct releases"
    rule: "Require material input, water, energy, product, waste, wastewater, packaging, and applicable direct-emission records; a missing default factor does not justify a zero flow."
    source_ids:
      - us-epa-ap42-yeast-1995
      - eu-commission-pef-2021
  - rule_id: validate_allocation
    applies_to: "Shared processes and co-products"
    rule: "Require subdivision where practical or a documented causal allocation driver; otherwise require the selected relationship, parameters, justification, and sensitivity check."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_data_quality
    applies_to: "Foreground evidence"
    rule: "Require the collection period, site and line coverage, instruments, raw records, formulas, exclusions, proxies, and quality evidence needed to reproduce every material normalized value."
    source_ids:
      - iso-14044-2006
      - eu-commission-pef-2021
  - rule_id: validate_source_traceability
    applies_to: "Evidence-backed rules"
    rule: "Require every cited source id to resolve in Data Sources and distinguish source-constrained rules from foreground measurements and author judgment."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for one specifically declared CPC 23996 product and route"
  downstream_use: "secondary_dataset; background_dataset after methodology review, quality review, and publication approval"
  allowed_use: "Product carbon-footprint or LCA modelling when product identity, route, geography, technology, time, moisture basis, grade, formulation and packaging state match the study and all upstream links are complete"
  excluded_use: "Generic representation of all CPC 23996 products; silent use of the dried-yeast UUID for another form; use-stage performance modelling; biological activity equivalence; cross-form or cross-formulation comparison without functional equivalence; public comparative claims without applicable review and verification"
  required_metadata: "Canonical PCR id; CPC reference; product and organism or formulation identity; active, inactive or dead state; form; moisture or dry-matter basis; grade and intended use; production route; geography; technology; reporting period; facility and line coverage; packaging state; product-flow substitution decision; allocation; exclusions; source ids"
  required_quality_disclosure: "Foreground-data share; meter and scale coverage; batch and temporal coverage; mass and utility reconciliation; emission method; allocation drivers; proxy datasets; cut-offs and exclusions; uncertainty and representativeness limits; review status"
  update_trigger: "Change in product identity, strain or formulation, biological state, product form, moisture basis, process technology, major supplier or energy source, packaging, facility boundary, allocation method, product-flow UUID, regulation or source evidence, or a material shift in measured inventory"
data_sources:
  - id: "un-cpc-v3-23996"
    type: "standard"
