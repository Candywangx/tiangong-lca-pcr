measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference product output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all inventory results to 1 kg net conforming product as sold at factory gate. Exclude primary, secondary, and tertiary packaging mass from the reference amount and report packaging separately."
  - id: ingredient_mass_basis
    applies_to: "Recipe ingredients, process water, intermediates, and product losses"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record wet mass as received and disclose dry matter, moisture, concentration, or solids content wherever it changes mass balance or comparability."
  - id: reconstitution_basis
    applies_to: "Concentrated or dehydrated products"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg prepared product per kg as-sold product"
    rule: "Calculate prepared mass using the manufacturer's declared preparation or reconstitution instructions. Keep the 1 kg as-sold reference result and report the prepared-product conversion as additional metadata."
  - id: packaging_mass_separation
    applies_to: "Packaging"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record each packaging material and component by mass per 1 kg net product; do not include packaging in product net mass."
  - id: energy_carrier_consistency
    applies_to: "Electricity, fuels, steam, heating, cooling, refrigeration, compressed air, and vacuum"
    required_property_ref:
      name: "Energy content or service property of the selected real flow"
      uuid: ""
    required_unit: "kWh, MJ, kg steam, or documented service unit"
    rule: "Preserve the unit and property of the selected upstream flow, document conversions and heating-value basis, and do not combine thermal and electrical energy without separate carrier records."
  - id: water_use_and_discharge
    applies_to: "Ingredient water, process water, cleaning water, cooling water, and wastewater"
    required_property_ref:
      name: "Volume or mass property of the selected real flow"
      uuid: ""
    required_unit: "m3 or kg"
    rule: "Distinguish water incorporated into product from washing, cleaning, cooling, boiler, and other technical uses; distinguish withdrawal, recirculation, consumption, and discharge and document density conversions."
