allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "multifunctional processes and shared lines"
    rule: "Avoid allocation where practicable by process subdivision, separate meters, batch records, or system expansion. Keep soup or broth production physically distinguishable from other products."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_causal_physical
    applies_to: "shared utilities, cleaning, storage, and treatment"
    rule: "When subdivision is not practicable, allocate using a documented causal physical driver such as equipment operating time, metered demand, cleanable surface and cycle count, wastewater load, or product mass only when mass is demonstrably causal."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_coproducts
    applies_to: "recovered food material, feed material, extracts, biogas, heat, or other co-products"
    rule: "Record gross co-product quantities first. Apply a relevant, quantifiable physical relationship when it represents causality; use economic allocation only when subdivision, system expansion, and a defensible physical relationship are not feasible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_disclosure
    applies_to: "economic allocation"
    rule: "If economic allocation is used, disclose the market, price basis, currency, averaging period, co-product condition and point of sale, factors, and sensitivity to price variation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_no_credit
    applies_to: "wastes sent to recycling, energy recovery, feed use, treatment, or disposal"
    rule: "Do not silently subtract an avoided burden. Record the physical waste output and treatment or recovery route; any substitution or recycling credit belongs to an explicitly documented expanded-system or lifecycle-model method."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_ingredient_batch_materials
      process_id: "ingredient_preparation"
      flow_role: "ingredients, prepared formulation, and residues"
      record_type: "batch tickets, receiving records, inventory, scales, formulation system"
      raw_fields: "material identity; supplier; lot; opening and closing inventory; received, returned, transferred, and residue mass; moisture or solids where material"
      collection_method: "calibrated scales and reconciled inventory or formulation records"
      unit: "kg and mass fraction"
      frequency: "each lot and batch"
      temporal_coverage: "representative continuous 12 months or complete declared campaign"
      site_scope: "all included lines and facilities"
      aggregation_rule: "sum by material and destination, reconcile each batch, then divide by qualifying output"
      quality_evidence: "scale calibration, lot traceability, formulation revision, and mass-balance reconciliation"
    - protocol_id: cp_ingredient_water
      process_id: "ingredient_preparation"
      flow_role: "preparation water and wastewater"
      record_type: "meters, tank records, recipes, and discharge records"
      raw_fields: "water source; meter start/end; recipe addition; recirculation; discharge; density conversion"
      collection_method: "dedicated meter where available, otherwise validated water balance"
      unit: "m3 and kg"
      frequency: "each batch or meter interval"
      temporal_coverage: "same period as product output"
      site_scope: "all preparation operations"
      aggregation_rule: "separate incorporated, recirculated, consumed, and discharged water before normalization"
      quality_evidence: "meter calibration and balance reconciliation"
    - protocol_id: cp_cooking_batch
      process_id: "cooking_and_blending"
      flow_role: "formulation input, recipe water, bulk output, and residues"
      record_type: "batch historian, recipe system, tank scales, transfer meters"
      raw_fields: "batch id; input masses; water addition; output mass; solids or moisture; rejects; rework"
      collection_method: "calibrated batch measurement and transfer reconciliation"
      unit: "kg and mass fraction"
      frequency: "each batch"
      temporal_coverage: "same period as product output"
      site_scope: "all included cooking, extraction, and blending lines"
      aggregation_rule: "reconcile input, output, evaporation, and residue by batch; aggregate qualifying batches"
      quality_evidence: "instrument calibration, approved recipe, batch release, and mass balance"
    - protocol_id: cp_cooking_energy
      process_id: "cooking_and_blending"
      flow_role: "cooking and blending energy"
      record_type: "electricity, fuel, steam, and heat meters; equipment runtime"
      raw_fields: "carrier; meter start/end; steam condition; equipment power; runtime; production mass"
      collection_method: "direct process meter or validated engineering calculation from measured operation"
      unit: "kWh, MJ, kg steam, or carrier unit"
      frequency: "continuous or each batch"
      temporal_coverage: "same period as product output"
      site_scope: "all included equipment"
      aggregation_rule: "subtract non-production baseload where evidenced and allocate by causal demand"
      quality_evidence: "meter calibration, energy conversion sheet, and operating log"
    - protocol_id: cp_cooking_emissions
      process_id: "cooking_and_blending"
      flow_role: "direct cooking emissions"
      record_type: "emissions monitoring, fuel analysis, fuel records, and approved factors"
      raw_fields: "pollutant; measured concentration and flow or fuel quantity; factor; oxidation basis; operating time"
      collection_method: "direct measurement preferred; otherwise activity data multiplied by documented factor"
      unit: "kg pollutant"
      frequency: "monitoring interval or each fuel period"
      temporal_coverage: "same period as product output"
      site_scope: "all direct-emission sources in scope"
      aggregation_rule: "sum pollutant mass and normalize to bulk output"
      quality_evidence: "monitoring QA, laboratory result, factor provenance, and calculation record"
    - protocol_id: cp_stabilization_batch
      process_id: "route_stabilization"
      flow_role: "bulk input and stabilized output"
      record_type: "batch historian, mass meters, moisture or solids tests, temperature records"
      raw_fields: "route; input/output mass; solids; moisture; concentration; time; temperature; release status"
      collection_method: "calibrated measurement and quality-control test"
      unit: "kg, mass fraction, °C, and time"
      frequency: "each batch or production run"
      temporal_coverage: "same period as product output"
      site_scope: "every included stabilization line"
      aggregation_rule: "reconcile each included operation and aggregate only released output"
      quality_evidence: "calibration, laboratory method, route record, and release record"
    - protocol_id: cp_stabilization_energy
      process_id: "route_stabilization"
      flow_role: "energy, refrigerants, and auxiliaries"
      record_type: "meters, equipment historian, refrigerant log, and purchase records"
      raw_fields: "carrier; meter start/end; runtime; make-up; leakage; output mass"
      collection_method: "direct metering or validated equipment calculation"
      unit: "flow-specific unit"
      frequency: "continuous, each run, or each make-up event"
      temporal_coverage: "same period as product output"
      site_scope: "all included stabilization equipment"
      aggregation_rule: "aggregate separately by carrier and route before normalization"
      quality_evidence: "meter calibration, service records, and engineering calculation"
    - protocol_id: cp_stabilization_residues
      process_id: "route_stabilization"
      flow_role: "condensate, wastewater, rejects, and direct emissions"
      record_type: "meters, waste tickets, mass balance, and emissions records"
      raw_fields: "stream identity; quantity; recovery; destination; pollutant; factor or measurement"
      collection_method: "direct measurement or documented mass/activity balance"
      unit: "kg, m3, or kg pollutant"
      frequency: "each run or dispatch"
      temporal_coverage: "same period as product output"
      site_scope: "all included stabilization operations"
      aggregation_rule: "report gross recovery and loss streams separately; normalize to released output"
      quality_evidence: "reconciliation, waste receipt, monitoring QA, and factor provenance"
    - protocol_id: cp_packaging_materials
      process_id: "filling_and_packaging"
      flow_role: "packaging incorporated and lost"
      record_type: "packaging specification, bills of material, counts, weights, inventory, and reject logs"
      raw_fields: "component; material; unit mass; units issued, returned, incorporated, and rejected"
      collection_method: "verified component weighing and line counts or inventory balance"
      unit: "kg and count"
      frequency: "each packaging batch or format"
      temporal_coverage: "same period as product output"
      site_scope: "all primary, secondary, and tertiary packaging"
      aggregation_rule: "calculate incorporated and loss mass separately by material and component"
      quality_evidence: "approved specification, scale calibration, inventory reconciliation, and reject log"
    - protocol_id: cp_packaging_energy
      process_id: "filling_and_packaging"
      flow_role: "filling, retort, cooling, inspection, and packaging energy"
      record_type: "line meters and equipment historian"
      raw_fields: "carrier; meter start/end; demand; runtime; line output"
      collection_method: "direct line meter or validated engineering calculation"
      unit: "kWh, MJ, kg steam, or carrier unit"
      frequency: "continuous or each production run"
      temporal_coverage: "same period as product output"
      site_scope: "all included filling and packaging equipment"
      aggregation_rule: "allocate by measured causal demand; separate post-fill treatment"
      quality_evidence: "meter calibration and production log"
    - protocol_id: cp_final_product
      process_id: "filling_and_packaging"
      flow_role: "bulk input, conforming product, and product rejects"
      record_type: "filler mass meter, checkweigher, batch release, reject and rework logs"
      raw_fields: "bulk input; unit net mass; units released; rejects; rework; product form; lot"
      collection_method: "calibrated mass measurement and released-unit count"
      unit: "kg and count"
      frequency: "each lot and batch"
      temporal_coverage: "same period as all other records"
      site_scope: "all included product formats and lines"
      aggregation_rule: "conforming net mass equals released units times verified net mass; report rejects before rework netting"
      quality_evidence: "checkweigher verification, release record, traceability, and mass balance"
    - protocol_id: cp_cleaning_materials
      process_id: "cleaning_utilities_and_residues"
      flow_role: "cleaning water and agents"
      record_type: "CIP historian, meters, chemical dosing, purchases, and inventory"
      raw_fields: "cycle; equipment; water; chemical concentration; solution recovery; discharge"
      collection_method: "direct meter/dosing records or validated recipe times cycles"
      unit: "m3, kg, and concentration"
      frequency: "each cleaning cycle"
      temporal_coverage: "same period as product output"
      site_scope: "all product-contact and allocated non-contact cleaning"
      aggregation_rule: "sum by chemical and water use, subtract documented recovered solution only once, allocate causally"
      quality_evidence: "meter calibration, dosing verification, cycle completion, and inventory reconciliation"
    - protocol_id: cp_shared_utilities
      process_id: "cleaning_utilities_and_residues"
      flow_role: "shared energy and utility services"
      record_type: "site and submeter data, utility bills, runtime, and production records"
      raw_fields: "carrier; meter start/end; submeter quantity; equipment runtime; output by line"
      collection_method: "metering hierarchy with documented residual allocation"
      unit: "flow-specific unit"
      frequency: "continuous or billing interval"
      temporal_coverage: "same period as product output"
      site_scope: "complete facility with included and excluded users identified"
      aggregation_rule: "direct assignment first; allocate residual only with causal physical driver"
      quality_evidence: "meter hierarchy, bill reconciliation, allocation worksheet, and sensitivity check"
    - protocol_id: cp_site_waste
      process_id: "cleaning_utilities_and_residues"
      flow_role: "waste, wastewater, recovered products, and treatment outputs"
      record_type: "flow meters, waste manifests, weighbridge, treatment logs, and sales records"
      raw_fields: "stream; origin; quantity; composition; treatment; destination; recovered output"
      collection_method: "measured dispatch/discharge and treatment mass balance"
      unit: "kg or m3"
      frequency: "each dispatch, discharge interval, or treatment batch"
      temporal_coverage: "same period as product output"
      site_scope: "all on-site and off-site routes used by the foreground"
      aggregation_rule: "reconcile origin, treatment input, recovered output, emissions, and final waste without netting"
      quality_evidence: "manifests, receiver confirmation, meter calibration, and treatment balance"
    - protocol_id: cp_site_emissions
      process_id: "cleaning_utilities_and_residues"
      flow_role: "direct utility and treatment emissions"
      record_type: "continuous monitoring, periodic tests, fuel/refrigerant records, treatment data, and approved factors"
      raw_fields: "source; pollutant; concentration; flow; activity; factor; operating time"
      collection_method: "direct measurement preferred; otherwise activity data multiplied by documented factor"
      unit: "kg pollutant"
      frequency: "monitoring interval or activity period"
      temporal_coverage: "same period as product output"
      site_scope: "every direct air, water, and soil release in scope"
      aggregation_rule: "calculate pollutant mass by source and normalize after allocation"
      quality_evidence: "monitoring QA, laboratory result, factor provenance, and calculation record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period flow quantity / period net mass of conforming finished product"
      inputs:
        - "period flow quantity"
        - "finished_product net mass"
      output: "flow amount per 1 kg net finished product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_product_net_mass
      applies_to: "conforming product"
      rule: "net finished mass = sum(released units × verified net product mass per unit); packaging mass is excluded"
      inputs:
        - "released count"
        - "checkweigher or declared verified net mass"
      output: "kg conforming product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_reconstituted_mass
      applies_to: "concentrated or dehydrated product"
      rule: "prepared product mass = as-sold product mass + water or other preparation additions required by declared instructions; report assumptions and any density conversion"
      inputs:
        - "as-sold mass"
        - "declared preparation ratio"
        - "preparation additions"
      output: "kg prepared product per kg as sold"
      source_ids:
        - codex-cxs-117-1981
        - eu-pef-2021-2279
    - id: calc_process_mass_balance
      applies_to: "each material process"
      rule: "input mass = conforming transfer + co-products + wastes + measured evaporation or discharge + inventory change; report closure and measurement uncertainty"
      inputs:
        - "batch inputs"
        - outputs
        - residues
        - water
        - "inventory change"
      output: "reconciled process mass balance"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_packaging_mass
      applies_to: "packaging"
      rule: "packaging mass = sum(component unit mass × component count consumed); split incorporated packaging and losses"
      inputs:
        - "component weights"
        - issued
        - returned
        - released
        - "and rejected counts"
      output: "kg by packaging material per kg product"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_energy_allocation
      applies_to: "shared and process energy"
      rule: "assign direct-metered demand first; allocate only residual shared demand using a documented causal physical driver; keep carriers separate"
      inputs:
        - "main and submeters"
        - "runtime or demand driver"
        - outputs
      output: "carrier-specific energy per kg product"
      source_ids:
        - eu-jrc-fdm-bref-2019
        - eu-pef-2021-2279
    - id: calc_direct_emissions
      applies_to: "direct site emissions"
      rule: "pollutant mass = measured concentration × measured exhaust or discharge flow × operating time, or collected activity × documented emission factor"
      inputs:
        - "monitoring data or activity and factor"
      output: "kg pollutant per kg product"
      source_ids:
        - eu-jrc-fdm-bref-2019
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and intermediates"
      requirement: "Preserve actual recipe or product family, market form, concentration or reconstitution basis, solids or moisture where material, preservation route, storage condition, and package configuration; do not infer one variant from the category flow name."
      evidence: "Product specification, approved recipe, label, preparation instructions, and batch release"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one representative continuous 12-month period for regular production or the complete declared campaign for seasonal or campaign production; align numerator and denominator periods and disclose abnormal shutdowns or substitutions."
      evidence: "Dated meters, batch records, production calendar, and reconciliation"
    - id: dq_geography_technology
      applies_to: "foreground and upstream links"
      requirement: "Identify facility geography and actual line technology; select upstream datasets matching source geography and technology or document proxy differences."
      evidence: "Facility metadata, equipment list, supplier origin, and dataset metadata"
    - id: dq_completeness
      applies_to: "all inventory"
      requirement: "Cover all known inputs and outputs, including water, cleaning, utilities, packaging, rejects, rework, co-products, wastes, wastewater, and direct emissions; quantify and justify any omission."
      evidence: "Process flow diagram, mass/energy/water balances, source inventory, and omission register"
    - id: dq_measurement
      applies_to: "meters, scales, tests, and calculations"
      requirement: "Retain calibration or verification status, raw readings, unit conversions, formulas, factors, and responsible source records; do not replace missing primary data with an undisclosed estimate."
      evidence: "Calibration certificates, laboratory reports, calculation sheets, and factor references"
    - id: dq_representativeness_precision
      applies_to: "published dataset"
      requirement: "Assess technological, geographical, and time-related representativeness and precision, and disclose uncertainty or sensitivity for material proxies and allocation choices."
      evidence: "Data-quality assessment and sensitivity record following the declared method"
validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "product identity"
    rule: "Confirm that the output is marketed primarily as a soup, broth, bouillon, consommé, or preparation thereof and that all required qualifiers are present. Reject silent use for sauces, non-soup prepared meals, infant preparations, or separately marketed extracts."
    source_ids:
      - unsd-cpc-3-0-explanatory-notes-2025
      - codex-cxs-117-1981
  - rule_id: validate_reference_uuid
    applies_to: "reference flow"
    rule: "Confirm the selected category flow UUID, Mass property UUID, Units of mass UUID, and kg unit, or document a reviewed replacement by a more product-specific real Tiangong flow."
    source_ids: []
  - rule_id: validate_reference_amount
    applies_to: "quantitative reference"
    rule: "Confirm that output equals exactly 1 kg net conforming product after normalization and that packaging mass is excluded from the reference amount."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_route_coverage
    applies_to: "process map"
    rule: "Confirm that every operation actually used for formulation, cooking or extraction, concentration or dehydration, preservation, chilling or freezing, filling, post-fill treatment, cleaning, utilities, and residue management is included or explicitly marked not applicable."
    source_ids:
      - codex-cxs-117-1981
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_reconstitution
    applies_to: "concentrated and dehydrated products"
    rule: "Require declared preparation instructions and verify the prepared-product conversion; prohibit comparison with ready-to-consume products on 1 kg as-sold mass alone."
    source_ids:
      - codex-cxs-117-1981
      - eu-pef-2021-2279
  - rule_id: validate_balances
    applies_to: "material, water, and energy data"
    rule: "Verify process and period balances, investigate closure outside documented measurement uncertainty, and prevent double counting of recycled water, recovered product, rework, shared utilities, waste transfers, and treatment inputs."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_allocation
