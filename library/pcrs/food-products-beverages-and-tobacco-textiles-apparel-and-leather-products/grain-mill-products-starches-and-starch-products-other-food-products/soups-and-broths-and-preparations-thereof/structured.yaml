system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground starts when recipe ingredients, water, packaging, energy carriers, and other supplies are received at the manufacturing site. It ends when the conforming, filled, sealed, and packaged product is ready to leave the factory gate. Include direct site operations, product and material losses, cleaning and sanitation, shared utilities, on-site wastewater or residue treatment, and direct emissions attributable to the product."
      source_ids: []
    - rule_id: boundary_factory_gate
      applies_to: "foreground manufacturing"
      rule: "Include ingredient receipt and preparation, formulation or cooking, route-specific stabilization, filling and packaging, cleaning, utilities, direct emissions, product losses, and on-site waste or wastewater handling through the factory gate."
      source_ids:
        - eu-jrc-fdm-bref-2019
        - eu-pef-2021-2279
    - rule_id: boundary_upstream_links
      applies_to: "purchased inputs and services"
      rule: "Represent production of purchased ingredients, packaging, energy, water, and off-site treatment through linked upstream datasets rather than silently excluding those burdens."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_route_conditionals
      applies_to: "concentration, dehydration, chilling, freezing, thermal preservation, or aseptic processing"
      rule: "Include every operation actually used for the declared market form and preservation route and mark non-applicable route processes explicitly."
      source_ids:
        - codex-cxs-117-1981
        - eu-jrc-fdm-bref-2019
    - rule_id: boundary_downstream_separation
      applies_to: "distribution, retail, use, and end-of-life"
      rule: "Exclude downstream stages from this factory-gate dataset; add them only in a clearly identified lifecycle model, including reconstitution energy and water, storage losses, and packaging end-of-life when relevant."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_no_unreported_cutoff
      applies_to: "all foreground flows"
      rule: "Record all known material, water, energy, product, co-product, waste, and direct elementary flows. Any omitted flow requires a quantified materiality justification and disclosure; no category-wide default cut-off is granted."
      source_ids:
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "Ingredients and intermediate soup or broth preparations are received at the factory with supplier identity, mass, moisture or solids basis where material, geography, and upstream dataset references declared; packaging and utilities are received as separate inputs"
  starting_condition_role: "Factory-gate input condition for the foreground manufacturing dataset"
  product_classification_scope: "Finished soups, broths, and preparations thereof corresponding to the full semantic scope of CPC 3.0 subclass 23992, independently of a particular recipe or physical form"
  recursive_input_rule: "A purchased input that is itself a soup, broth, or preparation thereof is recorded once as a technosphere product input at the actual received form and quantity; do not recursively reproduce its manufacture inside this foreground system"
  upstream_dataset_requirement: "Every purchased ingredient, same-category intermediate, packaging material, fuel, electricity supply, water supply, and off-site treatment service requires a geographically and technologically appropriate upstream dataset or a disclosed proxy"
  disclosure: "Declare product form, recipe family, concentration or reconstitution basis, preservation route, storage condition, packaging configuration, facility geography, production period, process inclusions, exclusions, and all proxy or allocation choices"
