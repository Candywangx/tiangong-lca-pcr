validation_rules:
  - rule_id: validation_identity
    applies_to: "product identity and scope"
    rule: "Confirm the product is husked rice with the husk removed and bran normally retained. Reject paddy rice, intentionally milled/whitened rice, parboiled rice, and further-processed rice products."
    source_ids:
      - codex-cxs-198-1995-rice
  - rule_id: validation_reference_flow
    applies_to: "quantitative reference"
    rule: "Require exactly 1 kg net husked rice using product-flow UUID f762700e-8463-40fa-a164-0ecd28c744d6, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids: []
  - rule_id: validation_qualifiers
    applies_to: "reference product metadata"
    rule: "Require every reference-flow qualifier, including dehusking state, gate, moisture basis, origin, technology, conditioning/packaging status, grade/specification, and production period."
    source_ids:
      - codex-cxs-198-1995-rice
  - rule_id: validation_process_completeness
    applies_to: "process inventory"
    rule: "Require paddy_receipt_and_cleaning and dehusking_and_separation; require conditional process sections when those operations occur before the declared gate."
    source_ids: []
  - rule_id: validation_mass_balance
    applies_to: "each foreground process and reporting period"
    rule: "Require a documented mass balance including inputs, products, husk, wastes, moisture change, and stock change; unresolved imbalance must be quantified and disclosed."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_moisture_and_quality
    applies_to: "direct-human-consumption product claiming Codex conformity"
    rule: "Verify moisture is no more than 15% m/m and check applicable extraneous-matter limits for husked rice; otherwise verify and disclose the controlling market specification."
    source_ids:
      - codex-cxs-198-1995-rice
  - rule_id: validation_allocation
    applies_to: "multifunctional operations"
    rule: "Require subdivision evidence or a justified allocation method, same-basis shares summing to 1, co-product destinations, and sensitivity disclosure when material."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_provisional_ranges
    applies_to: "provisional QA screens"
    rule: "Flag values outside a reasoned_estimate QA guardrail for review, but do not replace measured data or fail conformance solely because a provisional unsourced range is exceeded."
    source_ids: []
  - rule_id: validation_source_traceability
    applies_to: "non-foreground factors and datasets"
    rule: "Require stable identity, version/date, geography, technology, unit basis, and calculation linkage for each external dataset or factor used by the completed data package."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground production dataset for husked rice at a declared mill/factory gate"
  downstream_use: "secondary_dataset; background_dataset after methodology review, quality review, and publication"
  allowed_use: "LCI/LCA studies requiring non-parboiled husked rice with compatible geography, period, technology, moisture basis, product specification, gate, and allocation method"
  excluded_use: "Proxy for paddy cultivation alone; proxy for semi-/wholly milled, whitened, polished, parboiled, cooked, or flour products; unqualified substitution across materially different moisture, technology, or co-product allocation conditions"
  required_metadata: "PCR id/version; Tiangong flow UUID; CPC reference; normative and Tiangong Chinese names; declared gates; geography; period; facility/technology; paddy origin; moisture and impurity basis; grain class/variety when known; grade/specification; conditioning and packaging status; allocation method; co-product destinations; upstream dataset identities"
  required_quality_disclosure: "Measurement and calibration coverage; temporal/geographic/technology representativeness; mass-balance result; missing or estimated flows; provisional-range exceedances; secondary-data provenance; allocation sensitivity; review status"
  update_trigger: "Material change in paddy source, product definition, dehusking/conditioning technology, output gate, energy supply, co-product destination or allocation, packaging, applicable specification, or a new reviewed source replacing a provisional range"
