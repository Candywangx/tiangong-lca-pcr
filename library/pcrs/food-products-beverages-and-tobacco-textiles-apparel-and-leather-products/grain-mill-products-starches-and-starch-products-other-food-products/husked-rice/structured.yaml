measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report net husked-rice mass excluding packaging and normalize the foreground inventory to exactly 1 kg of conforming reference product."
  - id: moisture_declaration
    applies_to: "reference product and paddy input"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "% m/m"
    rule: "Measure or document moisture on the as-received basis for paddy and the as-produced basis for husked rice. Do not silently convert the commercial reference mass to dry matter; provide a separate dry-matter conversion only when comparison requires it."
  - id: codex_quality_basis
    applies_to: "direct-human-consumption product claiming Codex conformity"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "% m/m"
    rule: "Apply the Codex maximum moisture content of 15% m/m and the applicable husked-rice extraneous-matter limits only when the dataset claims this product/specification basis; otherwise declare the controlling market specification."
  - id: energy_conversion
    applies_to: "electricity and thermal energy"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Preserve metered units and conversion factors. Use 1 kWh = 3.6 MJ only for unit conversion, without treating electricity and fuel as environmentally equivalent."
  - id: mass_balance_basis
    applies_to: "paddy, husked rice, husk, rejects, dust, and stock change"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use measurements on a consistent moisture and time basis. Record opening/closing stocks and moisture change where they materially affect process mass balance."
