system_boundary:
  rules:
    - rule_id: boundary_paddy_start
      applies_to: "foreground starting boundary"
      rule: "Begin the foreground transformation with received paddy that retains its husk; keep upstream cultivation and off-site paddy delivery in linked upstream datasets."
      source_ids:
        - codex-cxs-198-1995-rice
    - rule_id: boundary_required_operations
      applies_to: "required foreground operations"
      rule: "Include paddy receipt/cleaning and dehusking/separation. Include all on-site energy, material inputs, husk, rejects, dust, and directly measured emissions attributable to those operations."
      source_ids: []
    - rule_id: boundary_conditional_operations
      applies_to: "conditioning, storage, and packaging"
      rule: "Include drying, aeration, storage, blending, and packaging only when performed before the declared output gate; disclose omitted or outsourced operations and link their datasets when they remain within the study boundary."
      source_ids: []
    - rule_id: boundary_product_exclusions
      applies_to: "product identity"
      rule: "Exclude intentional bran/germ removal, whitening, polishing, parboiling, cooking, and flour production from the reference-product process."
      source_ids:
        - codex-cxs-198-1995-rice
    - rule_id: boundary_recursive_input
      applies_to: "same-category product inputs"
      rule: "Record externally supplied husked rice as an upstream input to the applicable downstream step and prevent recursive re-creation of its dehusking burdens."
      source_ids: []
    - rule_id: boundary_coproducts_and_waste
      applies_to: "husk, recovered rice, rejects, and dust"
      rule: "Measure all output fractions and classify each destination as co-product, waste, internal recycle, treatment, or disposal; do not omit a fraction because it has no revenue."
      source_ids:
        - mass-balance-identity
boundary_abstraction:
  declared_starting_condition: "Paddy rice received at the selected mill/factory gate with husk retained; supplier/origin, receipt mass, moisture, impurity status, and delivery period declared"
  starting_condition_role: "Upstream product input to the foreground transformation; cultivation and off-site delivery burdens are supplied by linked upstream datasets"
  product_classification_scope: "The output reference product is CPC 3.0 23162 Husked rice; the classification reference does not include paddy rice or milled/whitened rice in this PCR"
  recursive_input_rule: "Purchased or transferred husked rice entering an included conditioning, storage, blending, or packaging step is recorded as a separate upstream product input and is not recursively regenerated by the dehusking inventory"
  upstream_dataset_requirement: "Link a geographically and temporally representative paddy-rice supply dataset and separate datasets for purchased electricity, fuels, packaging, transport, and waste treatment where those flows cross the selected boundary"
  disclosure: "Declare starting gate, output gate, included operations, outsourced operations, internal transfers, moisture basis, stock change, co-product destinations, packaging status, and any deviation from the default route"
