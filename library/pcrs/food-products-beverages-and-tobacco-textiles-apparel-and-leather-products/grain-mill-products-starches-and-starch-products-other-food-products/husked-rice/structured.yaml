  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period flow amount / net conforming husked-rice mass at the declared output gate"
      inputs:
        - "period flow amount"
        - "net conforming output mass"
      output: "amount per 1 kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: calc_stock_adjusted_input
      applies_to: "paddy and intermediate product transfers"
      rule: "consumed input = receipts + opening stock − closing stock − documented transfers out"
      inputs:
        - receipts
        - "opening stock"
        - "closing stock"
        - transfers
      output: "stock-adjusted process input"
      source_ids:
        - mass-balance-identity
    - id: calc_dry_matter
      applies_to: "optional moisture-normalized comparison"
      rule: "dry mass = as-received mass × (1 − moisture_percent/100); report alongside, never instead of, the commercial 1 kg reference mass unless the study explicitly changes the functional basis"
      inputs:
        - mass
        - moisture_percent
      output: "dry matter mass"
      source_ids:
        - mass-balance-identity
    - id: calc_process_mass_balance
      applies_to: "cleaning, dehusking, conditioning, and packaging"
      rule: "reconcile measured mass inputs with products, co-products, wastes, moisture change, and stock change; investigate and disclose unexplained imbalance rather than forcing closure"
      inputs:
        - "measured inputs"
        - outputs
        - moisture
        - stocks
      output: "mass-balance statement and unexplained difference"
      source_ids:
        - mass-balance-identity
    - id: calc_energy_normalization
      applies_to: "purchased electricity and thermal energy"
      rule: "energy per reference flow = attributable metered energy / net conforming output mass; retain original carrier and conversion basis"
      inputs:
        - "meter/invoice values"
        - "allocation driver"
        - "output mass"
      output: "kWh or MJ per kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: calc_allocation_share
      applies_to: "unavoidable shared burdens"
      rule: "allocated burden = shared burden × documented allocation share; shares across all co-products must sum to 1 on the same physical and moisture basis"
      inputs:
        - "shared burden"
        - "co-product quantities"
        - "selected physical relation"
      output: "burden assigned to husked rice and each co-product"
      source_ids:
        - iso-14044-2006
