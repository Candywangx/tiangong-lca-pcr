allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all multifunctional foreground operations"
    rule: "First avoid allocation through process subdivision, separate metering, and physical tracking of husked rice, husk, recovered kernels, and waste destinations."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_husk
    applies_to: "rice husk and any other co-product leaving the system"
    rule: "When subdivision cannot resolve shared burdens, use a documented physical relationship that reflects the underlying process. Mass allocation may be used only when justified for the declared goal and scope; record wet/dry basis and moisture."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_waste
    applies_to: "outputs classified as waste"
    rule: "Do not assign co-product credit solely because a waste is transferred. Model treatment and any accepted recycling, recovery, or substitution convention consistently with the governing study method and disclose it."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_internal_use
    applies_to: "husk or fines used on-site"
    rule: "Keep internal use visible: record the material output and its receiving process input, then prevent double counting of avoided purchased energy or material."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_sensitivity
    applies_to: "material allocation choices"
    rule: "Report allocation method, allocated shares, co-product status and destination, and a sensitivity case when a plausible alternative materially changes the reference-product result."
    source_ids:
      - iso-14044-2006
