allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "All foreground processes and shared site services"
    rule: "Avoid allocation first by sub-metering or subdividing batches, lines, tanks, cleaning events, refrigeration circuits, and treatment operations so directly attributable exchanges remain with the declared product."
    source_ids:
      - eu-pef-2021
      - ec-jrc-fdm-bref-2019
  - rule_id: allocation_physical_causality
    applies_to: "Shared operations that cannot be subdivided"
    rule: "Allocate remaining shared inputs and outputs using a documented physical causal driver such as product mass, tank occupancy, operating time, thermal load, cleaning event, wastewater volume, or pollutant load; state why the driver reflects causality."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_economic_fallback
    applies_to: "Multiple valuable outputs without a defensible physical relationship"
    rule: "Use a documented non-physical relationship such as contemporaneous economic value only after subdivision and physical causality are shown impracticable; disclose prices, reference period, factors, and a sensitivity result."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_residue_status
    applies_to: "Pomace, yeast, lees, recovered carbon dioxide, sludge, and other recovered outputs"
    rule: "Treat an output as a co-product only when it is separately measured, meets a declared specification, and has documented beneficial use or market value; otherwise record it as waste. Do not subtract an avoided-product credit within this facility-gate inventory unless a broader study applies a consistent substitution method."
    source_ids:
      - eu-pef-2021
      - ec-jrc-fdm-bref-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "all"
      flow_role: "Feedstock, must, intermediate, and product mass"
      record_type: "Scale, tank, density, batch, and dispatch records"
      raw_fields: "batch_id; material_identity; route; timestamp; gross_mass; tare_mass; volume; temperature; density; opening_stock; closing_stock; transfer_loss"
      collection_method: "Calibrated scale or calibrated volume converted with matched density"
      unit: "kg"
      frequency: "Each receipt, batch, transfer, and dispatch"
      temporal_coverage: "Complete representative campaign"
      site_scope: "All foreground operations"
      aggregation_rule: "Reconcile route-specific inputs, outputs, stock changes, emissions, and documented losses before normalization"
      quality_evidence: "Calibration certificates; tank charts; batch reconciliation; dispatch records"
    - protocol_id: cp_energy_records
      process_id: "all"
      flow_role: "Electricity, steam, and each fuel"
      record_type: "Meter, invoice, and equipment-allocation records"
      raw_fields: "carrier_identity; meter_id; timestamp; quantity; unit; heating_value_basis; process_assignment; allocation_driver"
      collection_method: "Direct sub-metering preferred; otherwise documented allocation from facility meters"
      unit: "kWh; MJ"
      frequency: "Continuous or invoice period"
      temporal_coverage: "Complete representative campaign"
      site_scope: "Foreground facility and onsite treatment"
      aggregation_rule: "Aggregate each carrier separately; no combined energy row"
      quality_evidence: "Meter calibration; invoices; allocation worksheet; completeness check"
    - protocol_id: cp_water_records
      process_id: "all"
      flow_role: "Formulation, process, and cleaning water"
      record_type: "Meter, batch, and cleaning-event records"
      raw_fields: "meter_id; timestamp; volume; temperature; source; process_assignment; reuse_flag"
      collection_method: "Direct meter or validated event estimate"
      unit: "kg; m3"
      frequency: "Continuous, batch, or each cleaning event"
      temporal_coverage: "Complete representative campaign"
      site_scope: "All foreground operations"
      aggregation_rule: "Sum by source and process; distinguish water incorporated into product, fresh intake, and reuse"
      quality_evidence: "Meter calibration; batch sheet; cleaning log; water balance"
    - protocol_id: cp_additive_records
      process_id: "all"
      flow_role: "Yeast, nutrient, additive, processing aid, sugar, and carbon dioxide"
      record_type: "Weighing, formulation, stock-issue, and gas-meter records"
      raw_fields: "material_identity; supplier; active_fraction; batch_id; issued_mass; returned_mass; gas_quantity"
      collection_method: "Weighed issue-and-return balance or calibrated dosing record"
      unit: "kg"
      frequency: "Each addition"
      temporal_coverage: "Complete representative campaign"
      site_scope: "Foreground beverage operations"
      aggregation_rule: "Aggregate each atomic material and route separately"
      quality_evidence: "Supplier specification; scale calibration; batch sheet; stock reconciliation"
    - protocol_id: cp_cleaning_records
      process_id: "site_services_wastewater"
      flow_role: "Each cleaning or disinfectant chemical"
      record_type: "CIP recipe, concentration, conductivity, stock, and event records"
      raw_fields: "chemical_identity; formulation; active_fraction; event_id; process; solution_volume; concentration; recovered_quantity"
      collection_method: "Active-mass calculation from issued formulation and measured concentration or stock balance"
      unit: "kg"
      frequency: "Each cleaning event"
      temporal_coverage: "Complete representative campaign"
      site_scope: "Foreground cleaning systems"
      aggregation_rule: "Aggregate each active chemical separately; retain reused solution and disposal records"
      quality_evidence: "Supplier specification; conductivity or titration record; stock reconciliation"
    - protocol_id: cp_refrigerant_records
      process_id: "site_services_wastewater"
      flow_role: "Each refrigerant addition and loss"
      record_type: "Asset register and service records"
      raw_fields: "equipment_id; refrigerant_identity; opening_charge; added_mass; recovered_mass; closing_charge; service_date; process_assignment"
      collection_method: "Circuit-level inventory balance"
      unit: "kg"
      frequency: "Each service and annual or campaign close"
      temporal_coverage: "Period overlapping declared campaign"
      site_scope: "Refrigeration systems serving foreground processes"
      aggregation_rule: "Calculate and report each refrigerant separately"
      quality_evidence: "Technician record; purchase receipt; asset register; reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "packaging_dispatch"
      flow_role: "Each packaging component"
      record_type: "Bill of materials, count, unit-mass, issue, return, and reject records"
      raw_fields: "component_identity; supplier; specification; unit_mass; issued_count; returned_count; reject_count; reusable_cycles"
      collection_method: "Count times verified unit mass or direct mass issue balance"
      unit: "kg"
      frequency: "Each packaging run"
      temporal_coverage: "Complete representative campaign"
      site_scope: "Packaging operations under foreground control"
      aggregation_rule: "Aggregate each component separately; reconcile product fill and rejects"
      quality_evidence: "Supplier specification; sampled unit mass; line reconciliation"
    - protocol_id: cp_waste_records
      process_id: "all"
      flow_role: "Each waste, residue, or co-product"
      record_type: "Scale, collection, dry-matter, status, and destination records"
      raw_fields: "waste_identity; wet_mass; dry_matter; batch_id; destination; market_status; specification; haulier"
      collection_method: "Calibrated scale or container count with verified net mass"
      unit: "kg"
      frequency: "Each removal"
      temporal_coverage: "Complete representative campaign"
      site_scope: "All foreground processes"
      aggregation_rule: "Aggregate each identity and destination separately; do not net sales against inputs"
      quality_evidence: "Weigh ticket; manifest; analysis; destination evidence"
    - protocol_id: cp_wastewater_records
      process_id: "all"
      flow_role: "Each source-process wastewater"
      record_type: "Flow meter, tank, sewer, reuse, and treatment records"
      raw_fields: "source_process; timestamp; volume; destination; sanitary_inclusion; product_loss; treatment_route"
      collection_method: "Metered flow or validated tank-volume balance"
      unit: "m3"
      frequency: "Continuous or each discharge batch"
      temporal_coverage: "Complete campaign including cleaning and peak production"
      site_scope: "Wastewater under foreground control"
      aggregation_rule: "Preserve source stream before aggregation; reconcile influent, effluent, reuse, and transfer"
      quality_evidence: "Meter calibration; sewer invoice; tank log; water balance"
    - protocol_id: cp_wastewater_monitoring
      process_id: "site_services_wastewater"
      flow_role: "Each wastewater pollutant"
      record_type: "Matched flow and laboratory sample records"
      raw_fields: "sample_id; interval; discharge_volume; cod; bod5; tss; total_nitrogen; total_phosphorus; method; detection_limit"
      collection_method: "Representative composite sampling and documented laboratory analysis"
      unit: "kg; mg/L; m3"
      frequency: "Per permit and sufficient to represent production variability"
      temporal_coverage: "Complete representative campaign"
      site_scope: "Direct discharge under foreground control"
      aggregation_rule: "Pair each concentration with the same flow interval and calculate each pollutant separately"
      quality_evidence: "Chain of custody; method; laboratory QA/QC; flow-meter calibration"
    - protocol_id: cp_direct_emission_records
      process_id: "all"
      flow_role: "Fermentation, combustion, and refrigerant releases"
      record_type: "Sugar, off-gas, fuel, factor, and asset records"
      raw_fields: "batch_id; sugar_before; sugar_after; offgas_mass; fuel_identity; fuel_quantity; factor_id; factor_value; refrigerant_identity; refrigerant_loss"
      collection_method: "Direct measurement preferred; otherwise documented stoichiometry, factor, or asset balance"
      unit: "kg"
      frequency: "Each batch, fuel period, or refrigerant service"
      temporal_coverage: "Complete representative campaign"
      site_scope: "Direct foreground emission sources"
      aggregation_rule: "Calculate each emitted substance separately"
      quality_evidence: "Analytical record; invoice; factor provenance; calculation worksheet"
  calculation_rules:
    - id: calc_reference_normalisation
      applies_to: "Every inventory exchange"
      rule: "normalized_amount = campaign_amount / net_saleable_reference_product_mass × 1,000 kg"
      inputs:
        - "Campaign exchange amount"
        - "net saleable product mass"
      output: "Exchange per 1,000 kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_volume_to_mass
      applies_to: "Must, beverage, water, and liquid materials"
      rule: "mass = calibrated_volume × density measured or justified for the material and temperature"
      inputs:
        - Volume
        - temperature
        - density
      output: "Material mass"
      source_ids:
        - eu-pef-2021
    - id: calc_active_chemical
      applies_to: "Formulated additives and cleaning agents"
      rule: "active_material_mass = formulation_mass × verified active_mass_fraction"
      inputs:
        - "Formulation mass"
        - "active fraction"
      output: "Atomic active-material mass"
      source_ids:
        - ec-jrc-fdm-bref-2019
    - id: calc_fermentation_co2
      applies_to: "Alcoholic fermentation"
      rule: "Use measured off-gas where reliable; otherwise CO2_mass = fermentable_hexose_equivalent_consumed × 88/180, adjusted for documented dissolved or recovered carbon dioxide"
      inputs:
        - "Sugar before and after"
        - "batch mass"
        - "measured off-gas"
        - "retained or recovered carbon dioxide"
      output: "Biogenic carbon dioxide to air"
      source_ids:
        - iglesias-mead-2014
    - id: calc_refrigerant_loss
      applies_to: "Each refrigeration circuit"
      rule: "loss = opening_charge + additions - recovered_mass - closing_charge; retain one calculation per refrigerant"
      inputs:
        - "Circuit-level refrigerant inventory"
      output: "Refrigerant emission to air"
      source_ids:
        - ec-jrc-fdm-bref-2019
    - id: calc_combustion_emissions
      applies_to: "Each fuel and emitted substance"
      rule: "emission_mass = fuel_activity × documented fuel- and substance-specific emission_factor"
      inputs:
        - "Fuel quantity"
        - "heating-value basis"
        - "factor identity"
      output: "Separate CO2, CH4, N2O, or NOx emission"
      source_ids:
        - eu-pef-2021
    - id: calc_wastewater_load
      applies_to: "Each direct water-emission indicator"
      rule: "load_kg = matched_discharge_volume_m3 × concentration_mg_per_L / 1,000"
      inputs:
        - "Discharge volume"
        - "matched concentration"
      output: "Separate COD, BOD5, TSS, total-N, or total-P load"
      source_ids:
        - ec-jrc-fdm-bref-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and every exchange"
      requirement: "Retain the product definition, raw-material route, atomic flow identity, material specification, packaging component, refrigerant identity, waste status, and destination."
      evidence: "Product standard; batch sheet; supplier specification; asset register; waste manifest"
    - id: dq_temporal
      applies_to: "Foreground data"
      requirement: "Cover one complete representative production campaign including preparation, fermentation, maturation, packaging, cleaning, refrigeration, stock changes, and wastewater attributable to the product; disclose deviations."
      evidence: "Dated meter exports; production calendar; opening and closing inventories"
    - id: dq_measurement
      applies_to: "Mass, volume, energy, water, chemical, packaging, and pollutant records"
      requirement: "Use calibrated instruments or documented engineering estimates; retain units, density, active fractions, heating values, detection limits, and allocation drivers."
      evidence: "Calibration certificate; laboratory QA/QC; calculation worksheet"
    - id: dq_completeness
      applies_to: "All included processes"
      requirement: "Reconcile feedstocks, products, intermediates, product loss, utilities, additives, aids, packaging, each waste, wastewater destination, refrigerant, and direct emission; explain every missing or excluded flow."
      evidence: "Campaign balance; signed completeness review; ec-jrc-fdm-bref-2019; eu-pef-2021"
    - id: dq_representativeness
      applies_to: "Foreground and linked upstream data"
      requirement: "Characterize time, geography, technology, precision, completeness, consistency, source, and uncertainty; prioritize site-specific records for controlled processes and representative upstream datasets."
      evidence: "Data-quality assessment; dataset metadata; eu-pef-2021"
    - id: dq_range_integrity
      applies_to: "Any future quantitative range"
      requirement: "Do not convert one plant, batch, scenario, or paper value into a range. Require at least two independent, boundary-compatible verified full texts before authoring an inferred empirical range."
      evidence: "Source comparison and range review record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require the exact 1,000 kg mass basis and all product qualifiers; keep the product-flow UUID empty until one Tiangong flow is confirmed to cover the complete category."
    source_ids:
      - un-cpc-3-2025
      - eu-cider-perry-market-standards-2023
  - rule_id: validate_scope
    applies_to: "Product identity"
    rule: "Confirm alcoholic fermentation is identity-forming and reject fresh-grape wine, malt beer, non-fermented beverages, vinegar, distilled spirits, and products that no longer retain fermented-beverage character."
    source_ids:
      - un-cpc-3-2025
      - eu-cn-2206-2019
  - rule_id: validate_route
    applies_to: "Process map"
    rule: "Require exactly one applicable must-preparation route, alcoholic fermentation, and all actually performed finishing, conditioning, packaging, utility, cleaning, refrigeration, and wastewater operations; prohibit combined route-selector exchanges."
    source_ids:
      - uk-welsh-cider-2015
      - uk-welsh-perry-2015
      - eu-czworniak-mead-2016
      - iglesias-mead-2014
  - rule_id: validate_atomic_inventory
    applies_to: "Inventory rows"
    rule: "Reject any selected flow that combines feedstocks, yeast and nutrients, electricity and heat, multiple fuels, multiple refrigerants, multiple chemicals, filtration aids, packaging components, wastes, wastewater indicators, or air emissions."
    source_ids:
      - ec-jrc-fdm-bref-2019
      - eu-pef-2021
  - rule_id: validate_mass_balance
    applies_to: "Each process and campaign"
    rule: "Reconcile opening stocks plus inputs against outputs, closing stocks, fermentation carbon dioxide, moisture or density changes, measured waste, wastewater product loss, and documented losses before publication."
    source_ids:
      - ec-jrc-fdm-bref-2019
      - eu-pef-2021
  - rule_id: validate_wastewater
    applies_to: "Wastewater and direct discharge"
    rule: "Require source-process volumes and destinations; reconcile onsite-treatment influent and effluent; calculate COD, BOD5, TSS, total nitrogen, and total phosphorus separately when monitored or required."
    source_ids:
      - ec-jrc-fdm-bref-2019
  - rule_id: validate_packaging
    applies_to: "Packaged product"
    rule: "Reconcile fill count and net product mass and require a separate mass for every container, closure, label, carton, and film actually used, plus separate reject wastes."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_allocation
    applies_to: "Shared operations and recovered outputs"
    rule: "Require documented subdivision attempts, causal drivers, residual allocation factors, output status, and sensitivity for any non-physical fallback; prohibit undisclosed avoided-product credits."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_sources_and_quality
    applies_to: "Foreground package"
    rule: "Require source ids for externally constrained rules, foreground records for controlled processes, documented proxies for unavailable upstream data, complete quality disclosure, and explicit unresolved range and UUID gaps."
    source_ids:
      - ec-jrc-fdm-bref-2019
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground production dataset for one declared fermented beverage in this product category at the producing-facility dispatch gate"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product and process LCA, supply-chain inventory, environmental-footprint studies, hotspot analysis, and scenario modelling consistent with the declared raw-material route, product standard, technology, geography, campaign, packaging, and facility-gate boundary"
  excluded_use: "Fresh-grape wine, malt beer, non-fermented beverage, vinegar, distilled spirit, or undisclosed substitution between fruit, honey, and other sugar-material routes; consumer claims implying cradle-to-grave coverage from this facility-gate dataset alone"
  required_metadata: "PCR id and version; product name and jurisdictional standard; fermentable raw material; actual alcohol content; residual-sugar or sweetness class; still or sparkling state; carbonation and heat-treatment routes; geography; campaign; bulk or packaged state; package bill of materials; reference mass; wastewater route; waste and co-product destinations; allocation method; upstream dataset identities"
  required_quality_disclosure: "Primary-versus-secondary data share; measurement and conversion methods; calibration and laboratory evidence; temporal, geographical, and technological representativeness; completeness; uncertainty; allocation sensitivity; unresolved flow UUIDs; missing range evidence; exclusions and proxy datasets"
  update_trigger: "Change in product identity or law, raw-material route or formulation, fermentation or finishing technology, energy system, refrigerant, cleaning regime, packaging configuration, wastewater route, recovered-output status, allocation method, production representativeness, or a material review finding"
