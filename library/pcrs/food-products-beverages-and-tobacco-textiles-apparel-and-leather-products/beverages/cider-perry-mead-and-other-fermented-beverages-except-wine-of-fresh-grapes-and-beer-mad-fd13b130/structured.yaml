system_boundary:
  rules:
    - rule_id: boundary_facility_gate
      applies_to: "Foreground beverage system"
      rule: "Include attributable operations from receipt of the declared feedstock or recursive same-category input through net saleable product dispatch, including route preparation, fermentation, finishing, filling or bulk preparation, cleaning, refrigeration, onsite utilities, direct releases, wastewater, residues, and wastes."
      source_ids:
        - un-cpc-3-2025
        - ec-jrc-fdm-bref-2019
        - eu-pef-2021
    - rule_id: boundary_route_selection
      applies_to: "Product route"
      rule: "Apply exactly one documented feedstock-preparation route; include only the finishing, secondary-fermentation, pasteurization, carbonation, and package routes actually performed, with every non-applicable process explicitly identified."
      source_ids:
        - uk-welsh-cider-2015
        - uk-welsh-perry-2015
        - eu-czworniak-mead-2016
        - iglesias-mead-2014
    - rule_id: boundary_complete_exchanges
      applies_to: "Every included process"
      rule: "Inventory each material, utility, refrigerant, packaging component, product, residue, waste, wastewater stream, and direct emission as a separate atomic exchange. Missing upstream data are disclosed data gaps, not zero burdens."
      source_ids:
        - ec-jrc-fdm-bref-2019
        - eu-pef-2021
    - rule_id: boundary_downstream
      applies_to: "Lifecycle model"
      rule: "Distribution, retail refrigeration, serving, consumption, packaging end of life, and other downstream stages are outside this facility-gate dataset and require linked datasets when a full life cycle is modelled."
      source_ids:
        - eu-pef-2021
boundary_abstraction:
  declared_starting_condition: "Fruit, natural honey, another declared fermentable sugar material, or one explicitly disclosed same-category must or bulk fermented-beverage input received at the producing-facility gate"
  starting_condition_role: "Foreground entry point for route-specific beverage manufacture"
  product_classification_scope: "CPC 3.0 24230 fermented beverages; excludes fresh-grape wine, malt beer, non-fermented beverages, vinegar, and distilled products"
  recursive_input_rule: "Record purchased must or bulk fermented beverage in this category once as one atomic product input with an upstream dataset; do not recursively reconstruct its production inside the receiving foreground process."
  upstream_dataset_requirement: "Require representative upstream datasets for each feedstock, same-category intermediate, yeast, additive, processing aid, water source, energy carrier, refrigerant, packaging component, inbound transport, and offsite treatment service."
  disclosure: "Disclose product definition, raw-material route, included and outsourced operations, excluded life-cycle stages, fermentation and conditioning route, product and alcohol losses, wastewater route, waste and co-product destinations, packaging configuration, and allocation choices."
