allocation_rules:
  - rule_id: al_avoid_first
    applies_to: "Multi-output and shared processes"
    rule: "Avoid allocation first by separately metering or subdividing oat-milk operations, recipes, packaging lines, cleaning cycles, and utilities whenever the records support it."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: al_residue_status
    applies_to: "Separated oat solids"
    rule: "Classify separated solids as product/co-product only when a documented beneficial destination and receiving specification exist; otherwise model them as waste with the actual treatment route. Do not record the same mass in both rows."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: al_physical_basis
    applies_to: "Unavoidable co-product allocation"
    rule: "When subdivision cannot resolve shared burdens and the applicable study or programme does not prescribe another method, use a documented physical relationship that reflects the process, such as dry-matter mass for oat milk and separated solids. Record wet mass, dry-matter measurements, formula, and allocation fractions; fractions shall sum to one."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: al_economic_exception
    applies_to: "Co-products lacking a defensible physical relationship"
    rule: "Use economic allocation only when a physical relationship is not defensible or an applicable programme requires it. Use a representative price period, identify price basis and currency, disclose volatility, and test sensitivity."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: al_recycling_substitution
    applies_to: "Avoided-product or substitution claims"
    rule: "Do not apply substitution or avoided-burden credit unless required by the declared study method. Identify the substituted function, dataset, displacement ratio, and sensitivity separately from the foreground inventory."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials_and_packaging
      process_id: "prepare_oat_slurry_separate_and_formulate_treat_fill_release"
      flow_role: "Oat ingredients, formulation materials, processing aids, and packaging"
      record_type: "receiving, issue, return, recipe, bill-of-material, and stock records"
      raw_fields: "material id; supplier; lot; received mass; issued mass; returned mass; moisture or concentration; package count; component mass; recipe variant"
      collection_method: "calibrated receiving or line scales, inventory system, supplier certificate, and verified bill of material"
      unit: "kg; item; mass fraction"
      frequency: "each delivery and production issue; aggregate monthly"
      temporal_coverage: "continuous 12 months or a declared representative campaign"
      site_scope: "representative facility and declared product variants"
      aggregation_rule: "reconcile opening stock + receipts - closing stock - returns to issued or consumed mass; normalise by released net product mass"
      quality_evidence: "calibration records; stock reconciliation; supplier specifications; approved recipe and bill of material"
    - protocol_id: cp_water_and_energy
      process_id: "all_processes"
      flow_role: "Process water, electricity, heat, fuel, refrigeration, and shared utilities"
      record_type: "meter, submeter, invoice, fuel receipt, and operating-hour records"
      raw_fields: "meter id; opening and closing reading; unit; carrier; process or line; operating period; production period; allocation driver; heat-recovery transfer"
      collection_method: "calibrated meter or submeter preferred; otherwise documented engineering allocation from facility totals"
      unit: "kg; m3; kWh; MJ; carrier-specific unit"
      frequency: "continuous or each batch where available; aggregate monthly"
      temporal_coverage: "continuous 12 months or a declared representative campaign"
      site_scope: "represented production lines plus disclosed shared services"
      aggregation_rule: "subtract documented non-production use and double-counted submeters; allocate shared totals using a causal driver; preserve carrier identity"
      quality_evidence: "meter calibration or verification; invoice reconciliation; allocation worksheet; operating log"
    - protocol_id: cp_product_and_intermediate_yield
      process_id: "prepare_oat_slurry_separate_and_formulate_treat_fill_release"
      flow_role: "Intermediate transfers, final product, rework, rejects, and stock change"
      record_type: "tank, flowmeter, filling-counter, weighbridge, release, rejection, and inventory records"
      raw_fields: "batch id; start and end tank mass or volume; density; transfer mass; filled count; net fill; released mass; rejected mass; rework mass; stock change"
      collection_method: "calibrated tank or flow measurement and released-package reconciliation"
      unit: "kg; L with density conversion; item"
      frequency: "each batch or campaign; aggregate by product variant and month"
      temporal_coverage: "continuous 12 months or a declared representative campaign"
      site_scope: "represented process train and declared product variants"
      aggregation_rule: "reconcile matched transfers and normalise only by conforming released net product mass"
      quality_evidence: "calibration; release certificate; density measurement; filling-control check; batch reconciliation"
    - protocol_id: cp_residue_waste_and_wastewater
      process_id: "all_processes"
      flow_role: "Oat solids, rejects, waste, and wastewater"
      record_type: "container scale, weighbridge, dry-matter test, effluent meter, manifest, and treatment invoice"
      raw_fields: "material type; wet mass; dry-matter fraction; destination; product or waste status; treatment route; effluent volume; sampling result; period"
      collection_method: "weigh each shipment or container; meter effluent; sample according to facility plan"
      unit: "kg wet; kg dry matter; m3; concentration unit"
      frequency: "each shipment and continuous or batch effluent reading; aggregate monthly"
      temporal_coverage: "continuous 12 months or a declared representative campaign"
      site_scope: "all represented waste and co-product destinations"
      aggregation_rule: "separate product outputs from waste; convert wet to dry mass when used for allocation; reconcile waste shipments and effluent totals"
      quality_evidence: "scale or meter calibration; laboratory result; receiving specification; transfer note; treatment manifest"
    - protocol_id: cp_cleaning_records
      process_id: "cleaning_and_utilities"
      flow_role: "Cleaning water, chemicals, cycles, and sanitation energy"
      record_type: "cleaning-in-place recipe, dosing, cycle counter, water meter, chemical issue, and temperature-time log"
      raw_fields: "circuit; cycle type; cycle count; water volume; chemical product; concentration; dose; temperature; duration; product line served"
      collection_method: "automated cleaning log and submeter preferred; otherwise validated recipe multiplied by cycle count"
      unit: "kg; m3; L; mass fraction; cycle; kWh; MJ"
      frequency: "every cleaning cycle; aggregate monthly"
      temporal_coverage: "continuous 12 months or a declared representative campaign"
      site_scope: "circuits and shared systems serving represented oat-milk production"
      aggregation_rule: "assign dedicated cycles directly; allocate shared cycles by causal driver such as cleaned circuit time or product-contact volume"
      quality_evidence: "validated cleaning recipe; dosing calibration; sanitation verification; meter record"
  calculation_rules:
    - id: cr_reference_normalisation
      applies_to: "Every inventory amount"
      rule: "normalised amount = amount attributable to represented product / kg conforming packaged oat milk released"
      inputs:
        - "attributable flow amount"
        - "released net product mass"
      output: "flow amount per 1 kg reference flow"
      source_ids:
        - mass-balance-identity
        - epd-international-pcr-2025-03
    - id: cr_volume_to_mass
      applies_to: "Product and water volume records"
      rule: "mass = measured volume x measured or disclosed density at the recorded condition"
      inputs:
        - volume
        - density
        - "temperature or measurement condition"
      output: "kg material"
      source_ids:
        - mass-balance-identity
    - id: cr_packaging_mass
      applies_to: "Count-based packaging records"
      rule: "packaging mass = component count x verified mass per component; reconcile to issued mass and scrap"
      inputs:
        - "component count"
        - "component mass"
        - "issued mass"
        - "returned stock"
        - scrap
      output: "kg packaging by material"
      source_ids:
        - mass-balance-identity
    - id: cr_dry_matter
      applies_to: "Oat ingredients and separated solids"
      rule: "dry-matter mass = wet mass x measured dry-matter fraction"
      inputs:
        - "wet mass"
        - "dry-matter fraction"
      output: "kg dry matter"
      source_ids:
        - mass-balance-identity
    - id: cr_mass_balance
      applies_to: "Each process and represented period"
      rule: "residual = total mass inputs + opening stock - product outputs - co-product outputs - waste outputs - measured elementary mass outputs - closing stock; investigate and disclose material residuals without forcing them into an invented flow"
      inputs:
        - "all measured mass flows"
        - "opening and closing stock"
      output: "mass-balance residual and reconciliation note"
      source_ids:
        - mass-balance-identity
    - id: cr_coproduct_fraction
      applies_to: "Unavoidable physical allocation"
      rule: "allocation fraction for output i = selected physical quantity of output i / sum of the selected physical quantity for all co-products; use the same wet- or dry-matter basis for all outputs"
      inputs:
        - "output quantities on common physical basis"
      output: "allocation fractions summing to 1"
      source_ids:
        - iso-14044-2006
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and recipe"
      requirement: "Retain product specification, recipe or bill of material, oat ingredient form, process route, net fill, packaging, release status, and required qualifiers sufficient to distinguish the represented oat milk from excluded products."
      evidence: "approved product specification; recipe; batch and release records"
    - id: dq_temporal
      applies_to: "Foreground data period"
      requirement: "Use a continuous 12-month period when representative annual production exists; a shorter campaign is acceptable only when seasonality, start-up, cleaning, product mix, and downtime are represented or their exclusion is disclosed."
      evidence: "dated meter, production, purchasing, cleaning, waste, and release records; representativeness rationale"
    - id: dq_technology
      applies_to: "Process and utility records"
      requirement: "Match extraction, separation, enzyme, heat-treatment, homogenisation, filling, cleaning, and refrigeration technologies to the declared route; disclose aggregated or proxy operations."
      evidence: "equipment list; process flow diagram; operating log; allocation worksheet"
    - id: dq_geography
      applies_to: "Upstream and utility datasets"
      requirement: "Use datasets matching the declared sourcing and production geography where material; disclose substitutions and their likely direction of bias."
      evidence: "supplier origin; facility location; electricity and fuel contract; dataset metadata"
    - id: dq_completeness
      applies_to: "Mass, water, energy, packaging, residues, waste, and direct emissions"
      requirement: "Include all material flows in collection protocols and reconcile product, co-product, waste, water, and energy records. Explain missing records, zero values, and mass-balance residuals."
      evidence: "completeness checklist; mass and water balance; invoice-to-meter reconciliation; waste manifests"
    - id: dq_precision
      applies_to: "Measured and calculated values"
      requirement: "Preserve raw readings, units, density or dry-matter conversions, calibration state, aggregation formulas, and allocation fractions so the normalised value can be reproduced."
      evidence: "source records; calibration evidence; calculation workbook or machine-readable transformation"
    - id: dq_provisional_ranges
      applies_to: "Every reasoned_estimate range"
      requirement: "Treat the range only as a review and QA screen. Do not substitute its midpoint or bound for a missing foreground value without an explicit scenario decision, and replace it with reviewed evidence before publication-critical use."
      evidence: "range provenance flag; replacement or exception review record"
validation_rules:
  - rule_id: va_product_identity
    applies_to: "Product metadata"
    rule: "Fail identity validation when the product is not predominantly oat-based, contains dairy milk as a blended base, is not a finished liquid beverage, or lacks the required product and route qualifiers."
    source_ids:
      - cpc-3-24425
      - eu-jrc-fdm-bref-2019
  - rule_id: va_reference_flow
    applies_to: "Quantitative reference"
    rule: "Require exactly one reference output using Oat milk ad17fd2f-4977-4a51-b80b-f52061c153ec, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and 1 kg after normalisation."
    source_ids: []
  - rule_id: va_process_coverage
    applies_to: "Process map and inventory"
    rule: "Require all four required processes or an explicit disclosed aggregation that preserves their inputs, outputs, yields, cleaning, and utility burdens without double counting."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: va_transfer_reconciliation
    applies_to: "Internal intermediates"
    rule: "Require prepared_oat_slurry_output to match prepared_oat_slurry_input and formulated_oat_base_output to match formulated_oat_base_input for the same period after documented stock changes and losses."
    source_ids:
      - mass-balance-identity
  - rule_id: va_mass_balance
    applies_to: "Each foreground process"
    rule: "Calculate and report cr_mass_balance; investigate material residuals and do not close the balance by adding an unsupported emission, waste, or water flow."
    source_ids:
      - mass-balance-identity
  - rule_id: va_residue_exclusivity
    applies_to: "Separated oat solids"
    rule: "Reject simultaneous reporting of the same separated-solids mass as both oat_solids_coproduct_output and oat_solids_waste_output; require destination, status, wet mass, and dry-matter evidence."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: va_allocation
    applies_to: "Multi-output and shared processes"
    rule: "Require documented avoidance effort, selected allocation rule, causal or physical basis, formulas, source records, and fractions summing to one; require sensitivity disclosure for economic allocation."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: va_range_use
    applies_to: "Provisional ranges"
    rule: "Flag every reasoned_estimate as provisional and fail publication-critical validation if it has been used as a final foreground value without an accepted scenario or replacement evidence."
    source_ids: []
  - rule_id: va_completeness
    applies_to: "Dataset package"
    rule: "Require raw-record links or documented gaps for oat ingredients, formulation materials, process and cleaning water, electricity, thermal energy, packaging, product yield, residues, waste, wastewater, and direct refrigerant emissions where applicable."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground oat-milk production dataset that may be published as a secondary_dataset or background_dataset after review, validation, and linkage of upstream datasets"
  downstream_use: "Product carbon footprint, environmental footprint, EPD-supporting LCA, process datasets, and lifecyclemodel projections consistent with the declared boundary and programme rules"
  allowed_use: "Facility- or route-specific modelling of packaged oat milk when product qualifiers, geography, period, upstream datasets, allocation, and data quality are visible"
  excluded_use: "Unqualified comparison of nutrition or consumer function; representation of other plant beverages or dairy blends; substitution for missing foreground data using provisional ranges without scenario disclosure; claims outside the modelled boundary"
  required_metadata: "canonical PCR id; product and recipe variant; oat ingredient form and origin; facility geography; production period; process route; heat treatment; packaging; storage regime; reference flow UUID and unit; included boundary; upstream datasets; co-product status; allocation method; collection protocols"
  required_quality_disclosure: "temporal, geographical, technological, and product representativeness; measured versus allocated records; meter and scale coverage; mass-balance residuals; missing or proxy flows; provisional estimates; allocation sensitivity; external treatment routes"
  update_trigger: "material recipe or oat-source change; new extraction, enzyme, separation, heat-treatment, filling, packaging, cleaning, energy, or waste technology; changed co-product destination or allocation; changed electricity or fuel supply; data older than the declared representativeness period; corrected UUID or source evidence"
