allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "all foreground operations"
    rule: "Prefer process subdivision and direct measurement. Assign separately metered ingredients, utilities, emissions, wastes, and packaging to the product lot before any allocation."
    source_ids:
      - iso-14044-lca-2006
  - rule_id: allocation_recovered_outputs
    applies_to: "spent grain, yeast, carbon dioxide, ethanol, and other recovered outputs"
    rule: "Treat an output as a co-product only when it is separately measured, meets a declared specification, and has documented beneficial use. Otherwise record it as waste. If subdivision cannot resolve shared burdens, use a documented physical relationship that reflects the process; use economic allocation only when no defensible physical relationship exists and report a sensitivity result."
    source_ids:
      - iso-14044-lca-2006
      - us-epa-ap42-malt-beverages-1996
  - rule_id: allocation_recycling_no_avoided_credit
    applies_to: "packaging scrap, organic residues, wastewater products, and recovered materials"
    rule: "Report the actual outgoing material and treatment route. Do not subtract an avoided-production credit inside this gate inventory unless the broader study applies and documents a consistent recycling or substitution method."
    source_ids:
      - iso-14044-lca-2006
  - rule_id: allocation_shared_site_services
    applies_to: "shared utilities, cleaning, refrigeration, and wastewater treatment"
    rule: "Allocate shared services using measured demand where available; otherwise use a documented causal driver such as operating hours, mass throughput, thermal load, or wastewater load. Do not allocate solely by total sales value without justification."
    source_ids:
      - iso-14044-lca-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_brewhouse_batch_records
      process_id: "brewhouse_preparation"
      flow_role: "ingredients, water, wort, residues, and waste"
      record_type: "batch sheets, weigh records, tank levels, density tests, and dispatch records"
      raw_fields: "batch_id; material_id; input_mass; input_volume; density; temperature; wort_output; residue_mass; destination"
      collection_method: "reconcile signed batch and inventory records to vessel transfers"
      unit: "kg; L; kg/L; °C"
      frequency: "each batch"
      temporal_coverage: "at least one representative continuous 12-month period or all batches if production is shorter"
      site_scope: "all foreground brewhouse lines producing the declared product"
      aggregation_rule: "sum batch quantities, adjust opening and closing inventory, then normalize to released net product mass"
      quality_evidence: "calibrated scales or meters; batch sign-off; density test; material and destination traceability"
    - protocol_id: cp_brewhouse_energy_records
      process_id: "brewhouse_preparation"
      flow_role: "electricity, heat, fuel, and direct emissions"
      record_type: "submeter, fuel invoice, steam record, operating log, and emissions test or factor record"
      raw_fields: "meter_id; start_reading; end_reading; fuel_quantity; steam_quantity; operating_hours; pollutant; factor; factor_source"
      collection_method: "read dedicated meters where available and document causal allocation for shared supply"
      unit: "kWh; MJ; kg fuel; kg pollutant"
      frequency: "monthly and each material campaign"
      temporal_coverage: "same period as product output"
      site_scope: "all brewhouse equipment and on-site residue drying in scope"
      aggregation_rule: "convert to MJ, calculate pollutant-specific releases, and normalize to released net product mass"
      quality_evidence: "meter calibration; invoice reconciliation; factor identity and version; allocation workbook"
    - protocol_id: cp_fermentation_batch_records
      process_id: "fermentation_conditioning"
      flow_role: "wort, energy, fermentation outputs, residues, and air releases"
      record_type: "transfer meter, fermentation log, refrigeration meter, gas-flow record, laboratory result, and waste ticket"
      raw_fields: "batch_id; inlet_mass; inlet_density; yeast_mass; energy; outlet_mass; alcohol_content; recovered_co2; recovered_yeast; residue_mass; vent_measurement"
      collection_method: "reconcile vessel transfers and laboratory release records for each lot"
      unit: "kg; L; kg/L; MJ; % vol"
      frequency: "each batch with monthly utility reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "all fermentation, aging, filtration, and conditioning vessels in scope"
      aggregation_rule: "calculate transfers, recovery, losses, and emissions on a batch basis and normalize to released net product mass"
      quality_evidence: "calibrated transfer and gas meters; laboratory QA; vessel reconciliation; waste destination records"
    - protocol_id: cp_alcohol_control_records
      process_id: "alcohol_control"
      flow_role: "inlet and outlet beverage, alcohol content, energy, media, recovered alcohol, and waste"
      record_type: "process run log, transfer meter, laboratory result, energy meter, media replacement, recovery log, and waste manifest"
      raw_fields: "run_id; route; inlet_mass; inlet_abv; outlet_mass; outlet_abv; energy; water; media_mass; recovered_ethanol; wastewater; waste_destination"
      collection_method: "record every alcohol-control run and preserve inlet/outlet mass and alcohol analysis"
      unit: "kg; L; % vol; MJ"
      frequency: "each run"
      temporal_coverage: "same period as product output"
      site_scope: "every alcohol-control unit or contracted operation used for the product"
      aggregation_rule: "reconcile route-specific mass and alcohol balance and normalize accepted output to released net product mass"
      quality_evidence: "analytical method and calibration; meter records; recovery specification; contractor data when outsourced"
    - protocol_id: cp_packaging_release_records
      process_id: "packaging_release"
      flow_role: "bulk beverage, packaging, energy, released product, filling loss, and rejects"
      record_type: "filler counters, tank levels, component specifications, weigh checks, line meters, release certificate, and reject log"
      raw_fields: "lot_id; inlet_mass; density; packed_units; net_content; component_mass; energy; rejected_units; beverage_loss; release_abv"
      collection_method: "reconcile line input, released output, rejects, and inventory change for each product-format lot"
      unit: "kg; item; kg/item; MJ; % vol"
      frequency: "each packaging lot"
      temporal_coverage: "same period as product output"
      site_scope: "all filling and packaging lines producing the declared product"
      aggregation_rule: "calculate net beverage output and component masses by format, then normalize to 1 kg net beverage"
      quality_evidence: "legal metrology or checkweigh records; component specifications; release approval; alcohol test; line reconciliation"
    - protocol_id: cp_site_service_records
      process_id: "site_services"
      flow_role: "service water, chemicals, shared energy, wastewater, sludge, and direct releases"
      record_type: "site and submeter readings, chemical inventory, utility invoices, discharge meter, laboratory analysis, waste ticket, and refrigerant log"
      raw_fields: "period; meter_id; water; energy; chemical_mass; wastewater; concentration; sludge_mass; refrigerant_added; fuel; allocation_driver"
      collection_method: "reconcile site totals with submetered processes and document residual service allocation"
      unit: "kg; m3; kWh; MJ; mg/L; kg pollutant"
      frequency: "monthly with annual reconciliation"
      temporal_coverage: "same representative period as product output"
      site_scope: "complete foreground facility, excluding documented unrelated production before allocation"
      aggregation_rule: "subtract directly assigned use, allocate residual services by causal drivers, and normalize to released net product mass"
      quality_evidence: "calibrated meters; invoice balance; discharge laboratory QA; waste manifests; refrigerant service records; allocation review"
  calculation_rules:
    - id: calc_normalize_to_reference_mass
      applies_to: "all inventory rows"
      rule: "normalized amount = period or batch amount / released net beverage mass for the same scope and period"
      inputs:
        - "collected amount"
        - "released net beverage mass"
      output: "amount per 1 kg released net beverage"
      source_ids:
        - iso-14044-lca-2006
    - id: calc_volume_to_mass
      applies_to: "beverage, water, and wastewater recorded by volume"
      rule: "mass = measured volume × measured product-specific density at the declared temperature"
      inputs:
        - volume
        - density
        - temperature
      output: "kg"
      source_ids: []
    - id: calc_energy_conversion
      applies_to: "electricity, steam, and fuels"
      rule: "preserve original quantity and convert to MJ using a documented unit conversion or fuel property; do not use an unreferenced combustion factor"
      inputs:
        - "original energy or fuel quantity"
        - "conversion factor"
      output: "MJ per 1 kg released net beverage"
      source_ids:
        - iso-14044-lca-2006
    - id: calc_packaging_mass
      applies_to: "packaging components"
      rule: "packaging mass = accepted packed units × measured or supplier-declared component mass + recorded component rejects"
      inputs:
        - "packed units"
        - "component mass"
        - "reject count or mass"
      output: "kg packaging by material per 1 kg released net beverage"
      source_ids: []
    - id: calc_batch_mass_balance
      applies_to: "each production and packaging stage"
      rule: "input mass + opening inventory = outputs + closing inventory + recovered products + wastes + measured or estimated releases; investigate and disclose residual imbalance"
      inputs:
        - "all batch mass records and inventory changes"
      output: "stage balance and unexplained residual"
      source_ids:
        - iso-14044-lca-2006
    - id: calc_alcohol_compliance
      applies_to: "product qualification and alcohol-control output"
      rule: "compare measured alcohol content with the explicitly declared jurisdictional or market threshold and retain the analytical method and decision record"
      inputs:
        - "measured alcohol content"
        - "analytical method"
        - "applicable threshold"
      output: "pass or fail and declared value"
      source_ids:
        - ttb-malt-beverage-alcohol-content-2023
    - id: calc_wastewater_load
      applies_to: "wastewater emissions where concentration data exist"
      rule: "pollutant load = discharged volume × measured concentration, with unit conversion and sampling representativeness documented"
      inputs:
        - "discharge volume"
        - "pollutant concentration"
        - "sampling period"
      output: "kg pollutant per 1 kg released net beverage"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and each product format"
      requirement: "Preserve formulation family, route, alcohol specification, measured alcohol content, carbonation, stabilization, package format, geography, and production period."
      evidence: "approved recipe; product specification; label or market specification; laboratory release result"
    - id: dq_temporal_representativeness
      applies_to: "all foreground data"
      requirement: "Use one continuous representative 12-month period when available; if production is seasonal or shorter, cover all production and disclose the period and missing seasons."
      evidence: "production calendar; meter period; batch list; justification of representativeness"
    - id: dq_measurement_control
      applies_to: "mass, volume, energy, alcohol, and emission records"
      requirement: "Identify instruments and methods, calibration or verification status, conversion factors, and data owners; distinguish measured, calculated, and estimated values."
      evidence: "calibration certificates; laboratory QA; meter register; calculation workbook"
    - id: dq_completeness
      applies_to: "process map and inventory"
      requirement: "Cover every required process and every applicable conditional process; reconcile material, alcohol, packaging, water, and energy balances and disclose excluded or unquantified flows."
      evidence: "process-flow diagram; balance checks; exclusion register; missing-data log"
    - id: dq_supplier_and_background_links
      applies_to: "purchased inputs and services"
      requirement: "Record supplier, grade or composition, geography, time period, and upstream dataset reference for material inputs; document proxy selection and substitution when exact data are unavailable."
      evidence: "purchase record; specification; supplier declaration; dataset mapping register"
    - id: dq_allocation_and_outsourcing
      applies_to: "shared services, co-products, and contracted operations"
      requirement: "Preserve subdivision, allocation drivers, co-product criteria, sensitivity results, and contractor data boundaries."
      evidence: "allocation workbook; dispatch records; contractor inventory; sensitivity calculation"
    - id: dq_provisional_ranges
      applies_to: "all reasoned-estimate ranges"
      requirement: "Treat provisional ranges only as QA screens; they shall not overwrite valid foreground records and shall be replaced or explicitly accepted during methodology review before publication."
      evidence: "QA report; reviewer decision; source update record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require exactly 1 kg net beverage using the declared Tiangong product flow, Mass property, units-of-mass group, and kg unit."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "dataset metadata"
    rule: "Fail completeness when any required qualifier is missing, including applicable alcohol threshold, measured alcohol content and method, formulation family, route, carbonation, stabilization, packaging, geography, period, and density basis where used."
    source_ids:
      - ttb-malt-beverage-alcohol-content-2023
  - rule_id: validate_alcohol_claim
    applies_to: "released product"
    rule: "Require a measured alcohol result and compare it with the declared jurisdictional or market specification; do not assume one global threshold or infer compliance from the product name."
    source_ids:
      - ttb-malt-beverage-alcohol-content-2023
  - rule_id: validate_process_coverage
    applies_to: "process inventory"
    rule: "Require brewhouse preparation, fermentation and conditioning, packaging and release, and site services; require the alcohol-control process whenever a distinct arrest, separation, dilution, or blending stage is declared."
    source_ids:
      - us-epa-ap42-malt-beverages-1996
  - rule_id: validate_interprocess_transfers
    applies_to: "wort, conditioned beverage, and bulk beverage"
    rule: "Match each inter-process output and input on the same mass, density, lot, and inventory-change basis; explain any difference."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "each process and reporting period"
    rule: "Flag unexplained stage or site mass-balance residuals and prohibit balancing by silently deleting losses, wastes, recovered outputs, or emissions."
    source_ids:
      - iso-14044-lca-2006
  - rule_id: validate_no_double_counting
    applies_to: "water, energy, recovered carbon dioxide, packaging, wastewater, and shared services"
    rule: "Ensure formulation and cleaning water, direct and shared energy, purchased and recovered carbon dioxide, packaging mass and net beverage mass, and process-specific and site wastewater are not double counted."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "co-products and shared services"
    rule: "Require documented subdivision or allocation driver, co-product criterion, and sensitivity when economic allocation is used."
    source_ids:
      - iso-14044-lca-2006
  - rule_id: validate_range_use
    applies_to: "provisional reasoned estimates"
    rule: "Treat values outside provisional ranges as review flags rather than automatic errors when verified foreground evidence is present; reject substitution of a provisional midpoint for missing foreground data without disclosure."
    source_ids: []
  - rule_id: validate_sources_and_background
    applies_to: "external evidence and purchased inputs"
    rule: "Require every cited source id to resolve and every material purchased input or treatment service to have an upstream dataset or a disclosed data gap."
    source_ids:
      - iso-14044-lca-2006
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate production dataset for finished packaged non-alcoholic beer, with linked upstream inputs and explicit direct releases"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product and facility LCA, supply-chain inventory, footprint screening, and lifecyclemodel construction when the declared product route, alcohol specification, packaging, geography, period, and boundary match the study"
  excluded_use: "Comparative public claims without review; alcoholic beer or unrelated soft drinks; use-phase or full cradle-to-grave results without added downstream stages; substitution of provisional QA ranges for site records"
  required_metadata: "canonical PCR id; product and formulation; applicable alcohol definition and threshold; measured alcohol content and method; route; package format and component masses; geography; production period; facility boundary; process coverage; allocation; upstream dataset links; data gaps"
  required_quality_disclosure: "measured versus calculated versus estimated shares; meter and laboratory QA; temporal and geographic representativeness; mass and alcohol balance; completeness; allocation sensitivity; source-backed and provisional ranges; outsourced data quality"
  update_trigger: "Material change in formulation, alcohol-control technology, energy or water system, package format, facility boundary, allocation, legal product definition, upstream dataset, or a change exceeding the producer's documented significance threshold"
