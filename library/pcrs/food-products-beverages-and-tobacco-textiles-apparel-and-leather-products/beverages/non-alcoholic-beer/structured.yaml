  market_state: "Finished liquid beverage, carbonated or still, in the declared primary packaging at plant gate"
functional_unit:
  what: "Provide a finished non-alcoholic beer-type beverage meeting the declared formulation and alcohol specification"
  how_much: "1 kg net beverage mass"
  how_well: "Released product meeting declared alcohol content, formulation, carbonation, stabilization, and packaging specifications"
  how_long_or_cycle: "One released production lot at the plant gate; no storage or service duration is included"
