system_boundary:
  rules:
    - rule_id: boundary_core_brewing
      applies_to: "foreground production"
      rule: "Include ingredient receiving and handling, wort preparation, fermentation, conditioning, stabilization, filling, packaging, on-site utilities, cleaning, and wastewater handling when performed by or for the reporting facility."
      source_ids:
        - us-epa-ap42-malt-beverages-1996
    - rule_id: boundary_route_specific_alcohol_control
      applies_to: "alcohol-control route"
      rule: "Include fermentation arrest, dilution or blending, membrane separation, thermal alcohol removal, recovered alcohol handling, and associated energy, water, media, losses, and emissions whenever used; disclose omitted route stages as not applicable."
