    - rule_id: boundary_direct_releases
      applies_to: "site emissions and wastes"
      rule: "Include measured or calculated fermentation carbon dioxide and volatile organic releases, combustion and refrigerant emissions, wastewater, sludge, spent yeast, spent grain, trub, filter media, cleaning losses, and packaging rejects."
      source_ids:
        - us-epa-ap42-malt-beverages-1996
    - rule_id: boundary_purchased_inputs
      applies_to: "upstream supply"
      rule: "Link each purchased material, packaging component, energy carrier, water supply, and outsourced treatment service to an upstream dataset; do not treat missing upstream burdens as zero."
      source_ids:
        - iso-14044-lca-2006
    - rule_id: boundary_downstream_exclusion
      applies_to: "gate dataset"
      rule: "Exclude distribution, retail, serving, consumer refrigeration, and end-of-life from this gate dataset and disclose them as downstream exclusions."
      source_ids:
        - iso-14044-lca-2006
