allocation_rules:
  - rule_id: alloc_avoid
    applies_to: "all shared and multi-output operations"
    rule: "First avoid allocation through process subdivision, separate metering, or expansion of the model to include the displaced function where justified by the study goal. Document the chosen approach and do not combine it with another approach for the same burden."
    source_ids:
      - iso-14044-2006
  - rule_id: alloc_internal_transfers
    applies_to: "internal intermediate transfers and same-lot rework"
    rule: "Do not allocate burdens between sequential internal stages. Carry measured inputs and outputs forward; do not count an internal transfer or same-lot recirculation as a new system-boundary input."
    source_ids:
      - iso-14044-2006
  - rule_id: alloc_ethanol_fraction
    applies_to: "recovered ethanol-rich fraction or other exported co-product"
    rule: "If subdivision or system expansion is not practicable and allocation remains necessary, use a physical relationship demonstrably governing resource or energy use; use mass only when that relationship is justified. If no physical relationship is defensible, use an economic relationship based on a representative period. Report quantities, properties, prices, period, and sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: alloc_waste
    applies_to: "ethanol-containing waste, wastewater, rejected wine, off-spec product, and packaging waste"
    rule: "Waste treatment burdens remain with the foreground product until the documented point at which a secondary product with a defined function leaves the waste system. Do not assign co-product credit merely because a waste stream contains recoverable ethanol or material."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_base_wine_lots
      process_id: "base_wine_acceptance"
      flow_role: "incoming base wine and rejection"
      record_type: "lot receipt and laboratory record"
      raw_fields: "lot_id; supplier_or_internal_source; upstream_dataset_ref; wine_category; origin; mass; volume; density; temperature; actual_alcohol_pct_vol; organoleptic_acceptance; accepted_or_rejected; destination"
      collection_method: "calibrated weighbridge, tank gauge, density record, laboratory or controlled in-line test, and signed acceptance record"
      unit: "kg; L; kg/L; % vol"
      frequency: "each lot"
      temporal_coverage: "all lots in the representative period"
      site_scope: "each foreground facility"
      aggregation_rule: "sum accepted and rejected mass by lot and preserve source-specific linkage"
      quality_evidence: "calibration status; test method; sample id; acceptance record; supplier or internal trace"
    - protocol_id: cp_dealcoholisation_feed
      process_id: "dealcoholisation"
      flow_role: "accepted wine feed"
      record_type: "batch and tank transfer record"
      raw_fields: "batch_id; source_tank; destination_equipment; technique; start_time; end_time; mass; volume; density; actual_alcohol_pct_vol"
      collection_method: "calibrated tank mass or volume measurement with density and batch linkage"
      unit: "kg; L; kg/L; % vol"
      frequency: "each batch"
      temporal_coverage: "all batches in the representative period"
      site_scope: "each dealcoholisation line"
      aggregation_rule: "sum measured feed by released-lot linkage; exclude recirculation double counting"
      quality_evidence: "meter calibration; tank reconciliation; batch genealogy"
    - protocol_id: cp_utilities
      process_id: "dealcoholisation_finishing_and_release"
      flow_role: "electricity, heat, steam, and fuels"
      record_type: "meter, invoice, and equipment allocation record"
      raw_fields: "meter_id; carrier; opening_reading; closing_reading; unit; batch_or_time_period; equipment_runtime; allocation_driver"
      collection_method: "dedicated meter preferred; otherwise documented allocation from shared meter or invoice"
      unit: "kWh; MJ; carrier-specific physical unit"
      frequency: "each batch or shortest available billing interval"
      temporal_coverage: "representative operating period covering production and cleaning"
      site_scope: "each facility and line"
      aggregation_rule: "subtract non-production use; allocate shared use with documented driver; normalize to released mass"
      quality_evidence: "meter class; invoice reconciliation; allocation calculation; missing-data flag"
    - protocol_id: cp_water
      process_id: "dealcoholisation_finishing_and_release"
      flow_role: "process water, cleaning water, and wastewater"
      record_type: "meter and cleaning log"
      raw_fields: "meter_id; operation; supplied_volume_or_mass; wastewater_volume_or_mass; density_if_used; treatment_route; cleaning_cycle"
      collection_method: "dedicated water meter and wastewater meter or reconciled tank/truck records"
      unit: "kg; m3"
      frequency: "each batch or cleaning cycle"
      temporal_coverage: "representative operating period including cleaning"
      site_scope: "each facility and discharge route"
      aggregation_rule: "separate product-contact, cleaning, and wastewater where possible; reconcile supply, product addition, evaporation, and discharge"
      quality_evidence: "meter calibration; cleaning log; discharge record; water-balance reconciliation"
    - protocol_id: cp_output_streams
      process_id: "dealcoholisation_finishing_and_release"
      flow_role: "intermediates and internal transfers"
      record_type: "tank transfer and laboratory record"
      raw_fields: "batch_id; stream_id; mass; volume; density; actual_alcohol_pct_vol; ethanol_concentration; aroma_recovery_status; source_tank; destination_tank"
      collection_method: "calibrated tank or scale measurement and laboratory analysis"
      unit: "kg; L; kg/L; % vol"
      frequency: "each transfer"
      temporal_coverage: "all production lots in the representative period"
      site_scope: "each line and tank"
      aggregation_rule: "reconcile linked output and input records; do not count internal transfer as boundary exchange"
      quality_evidence: "tank reconciliation; sample id; laboratory method; batch genealogy"
    - protocol_id: cp_finishing_materials
      process_id: "finishing_and_release"
      flow_role: "finishing and stabilisation materials"
      record_type: "batch formula and issue record"
      raw_fields: "batch_id; material_id; resolved_flow_ref; lot_id; issued_mass_or_volume; returned_mass; density; purpose"
      collection_method: "controlled recipe plus warehouse issue and return record"
      unit: "kg; L"
      frequency: "each batch"
      temporal_coverage: "all production lots in the representative period"
      site_scope: "each facility"
      aggregation_rule: "net issued amount by material; normalize to released mass"
      quality_evidence: "approved recipe; lot trace; scale calibration; material specification"
    - protocol_id: cp_packaging
      process_id: "finishing_and_release"
      flow_role: "packaging materials and scrap"
      record_type: "bill of materials, component mass, and line record"
      raw_fields: "format_id; component_id; resolved_flow_ref; count_used; count_rejected; unit_mass; returned_count; reusable_cycles; scrap_mass; destination"
      collection_method: "verified bill of materials, counted components, sampled component mass, and scrap weighing"
      unit: "count; kg"
      frequency: "each packaging run"
      temporal_coverage: "representative packaging period"
      site_scope: "each packaging line and declared format"
      aggregation_rule: "count times verified unit mass plus measured losses; separate materials and destinations"
      quality_evidence: "bill-of-material revision; scale calibration; count reconciliation; reuse record"
    - protocol_id: cp_waste_and_coproducts
      process_id: "base_wine_acceptance_dealcoholisation_finishing_and_release"
      flow_role: "rejected wine, recovered fractions, waste, and off-spec product"
      record_type: "transfer, weigh ticket, analysis, and destination record"
      raw_fields: "stream_id; batch_id; mass; volume; density; composition; ethanol_concentration; product_or_waste_status; destination; ownership_transfer; revenue_if_allocation_used"
      collection_method: "calibrated scale, tank record, laboratory analysis, and signed transfer document"
      unit: "kg; L; % mass or % vol; currency"
      frequency: "each transfer"
      temporal_coverage: "all production and waste transfers in the representative period"
      site_scope: "each facility and destination"
      aggregation_rule: "sum by stream status and destination; prevent product/waste double classification for the same mass"
      quality_evidence: "weigh ticket; laboratory method; destination evidence; contract or invoice"
    - protocol_id: cp_final_release
      process_id: "finishing_and_release"
      flow_role: "released reference product"
      record_type: "batch release and net-mass record"
      raw_fields: "batch_id; product_id; net_released_mass; actual_alcohol_pct_vol; residual_sugar_or_sweetness; still_or_sparkling; sensory_result; package_scope; release_time; disposition"
      collection_method: "calibrated tank or filling-line mass balance, laboratory test, sensory release, and quality authorisation"
      unit: "kg; % vol"
      frequency: "each released lot"
      temporal_coverage: "all released lots in the representative period"
      site_scope: "each facility and product format"
      aggregation_rule: "sum only conforming released net beverage mass; exclude packaging mass, rejects, and unreleased stock"
      quality_evidence: "signed release; laboratory method; calibration; product specification; lot trace"
  calculation_rules:
    - id: calc_reference_normalisation
      applies_to: "all foreground exchanges"
      rule: "Normalized exchange = attributable exchange quantity / measured released net beverage mass. Convert the denominator to kg before division and retain the original quantity and conversion."
      inputs:
        - "exchange quantity"
        - "released net beverage mass"
        - "density or unit conversion where needed"
      output: "exchange per 1 kg reference product"
      source_ids: []
    - id: calc_shared_utility
      applies_to: "shared electricity, heat, fuel, water, and cleaning services"
      rule: "Prefer dedicated metering. If shared, subtract independently measured non-product loads and allocate the remainder using a documented causal driver such as equipment runtime, throughput, or measured load; mass allocation is not an automatic default."
      inputs:
        - "shared total"
        - "excluded loads"
        - "causal driver by product lot"
      output: "attributable utility quantity"
      source_ids:
        - iso-14044-2006
    - id: calc_packaging_mass
      applies_to: "packaging inputs"
      rule: "Packaging mass = sum for each component of net component count multiplied by verified unit mass, plus separately measured uncounted scrap; report each material separately."
      inputs:
        - "component count"
        - "returned count"
        - "unit mass"
        - "scrap mass"
      output: "kg packaging material per kg reference product"
      source_ids: []
    - id: calc_material_balance
      applies_to: "base wine, additions, intermediate, released product, recovered fraction, waste, and wastewater"
      rule: "Reconcile measured input and output masses at batch level. Report measured evaporation or vented material when known and disclose unexplained imbalance within the combined measurement uncertainty; do not force balance by changing the reference output."
      inputs:
        - "measured inputs"
        - outputs
        - "stock change"
        - "evaporation or vented loss"
        - "measurement uncertainty"
      output: "documented mass-balance reconciliation"
      source_ids: []
    - id: calc_allocation
      applies_to: "exported co-products and shared operations"
      rule: "Apply the selected allocation hierarchy once, using the collected physical or economic driver and documenting sensitivity where the allocation materially affects results."
      inputs:
        - "subdivided burdens"
        - "exported quantities and properties"
        - "representative prices if used"
      output: "allocated foreground exchanges and disclosed allocation factor"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and base-wine lots"
      requirement: "Preserve product identity, wine category, origin, upstream-dataset linkage, still or sparkling state, and dealcoholisation technique for every included lot."
      evidence: "batch genealogy, supplier or internal record, product specification"
    - id: dq_measurement
      applies_to: "mass, volume, density, alcoholic strength, utilities, and waste"
      requirement: "Use calibrated or controlled measurement systems appropriate to the quantity. Retain method, calibration status, sampling point, time, and any conversion factor."
      evidence: "calibration certificate, laboratory method, meter record, conversion worksheet"
    - id: dq_representativeness
      applies_to: "foreground period"
      requirement: "Use a period covering the technologies, product formats, cleaning cycles, start-ups, shutdowns, and seasonal or campaign conditions represented by the dataset; explain exclusions and missing-data substitutions."
      evidence: "production schedule, batch list, coverage assessment, missing-data log"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Account for accepted and rejected wine, all material additions, electricity, heat or fuel, water, released product, recovered and discarded ethanol fractions, wastewater, packaging when in scope, off-spec product, and directly measured emissions or losses."
      evidence: "process map, material and water balances, utility reconciliation, waste register"
    - id: dq_allocation
      applies_to: "shared services and co-products"
      requirement: "Retain the unallocated totals, allocation hierarchy decision, driver data, calculation, and sensitivity needed to reproduce every allocation."
      evidence: "allocation worksheet and source records"
    - id: dq_product_release
      applies_to: "final reference product"
      requirement: "Retain actual alcoholic strength, sample and method, release decision, sensory conformity, minimum-durability determination where applicable, and packaging-scope declaration."
      evidence: "laboratory certificate, signed release, sensory record, label or specification review"
    - id: dq_provisional_ranges
      applies_to: "all reasoned estimates"
      requirement: "Treat every reasoned_estimate range as provisional authoring and QA guidance only. Replace it with reviewed foreground or source-backed evidence, or document explicit reviewer acceptance, before publication."
      evidence: "range-evidence review record"
validation_rules:
  - rule_id: val_identity
    applies_to: "foreground package"
    rule: "Fail identity validation if the product was not obtained from wine or special wine that first attained its applicable characteristics, or if the dataset represents a directly fermented juice, partially dealcoholised wine, or another excluded beverage."
    source_ids:
      - oiv-eco-432-2012
      - eu-reg-2021-2117
      - eu-commission-2024-694
  - rule_id: val_reference
    applies_to: "reference flow"
    rule: "Require exactly one reference output of 1 kg net beverage using product flow UUID 014d2659-f8e8-4a23-adfa-97cbda224bab, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg. Packaging mass shall not be included in the reference amount."
    source_ids: []
  - rule_id: val_alcoholic_strength
    applies_to: "released product"
    rule: "Require a recorded actual alcoholic strength below 0.5% vol for this canonical scope, plus test method and release evidence. A jurisdiction-specific threshold shall be declared and may impose additional requirements, but shall not broaden this PCR to partially dealcoholised wine."
    source_ids:
      - oiv-eco-432-2012
      - eu-commission-2024-694
  - rule_id: val_technique
    applies_to: "dealcoholisation process"
    rule: "Require a declared permitted technique or combination and evidence that dealcoholisation did not create an organoleptic defect. Flag simultaneous alcohol removal and compensating increase of sugar in the corresponding must as nonconforming."
    source_ids:
      - oiv-oeno-394a-2012
      - eu-reg-2021-2117
  - rule_id: val_mass_balance
    applies_to: "each production lot"
    rule: "Require linked input, output, stock-change, and waste records and a documented reconciliation within combined measurement uncertainty. Report unexplained imbalance; do not manufacture a balancing exchange."
    source_ids: []
  - rule_id: val_stream_classification
    applies_to: "removed ethanol and other secondary streams"
    rule: "The same stream mass shall not be reported simultaneously as recovered product and waste. Require composition, destination, ownership transfer, and allocation treatment."
    source_ids:
      - iso-14044-2006
  - rule_id: val_allocation
    applies_to: "shared and multi-output processes"
    rule: "Require avoidance or subdivision to be considered first. If allocation remains, require the chosen physical or economic relationship, period, factor calculation, and sensitivity to be reproducible."
    source_ids:
      - iso-14044-2006
  - rule_id: val_packaging
    applies_to: "declared packaged product"
    rule: "When packaging is declared in scope, require material-specific packaging inputs and packaging waste; when bulk is declared, require packaging exchanges to be absent and the bulk condition to be explicit."
    source_ids: []
  - rule_id: val_provisional_ranges
    applies_to: "candidate quantitative guidance"
    rule: "Report every value outside a provisional range for review, but do not treat a reasoned_estimate as a legal or publication-critical conformity limit."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for finished non-alcoholic wine at plant"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product footprints and lifecycle models that explicitly link appropriate upstream base-wine production and declared downstream stages; comparison only when scope, product state, packaging, geography, technology, reference period, and allocation are equivalent"
  excluded_use: "Direct representation of partially dealcoholised wine, grape juice beverages, non-grape fermented beverages, or a complete cradle-to-grave product system without linked upstream and downstream datasets"
  required_metadata: "canonical PCR id; reference flow UUID and mass property; production geography and period; base-wine category and source; still or sparkling state; dealcoholisation technique; incoming and final alcoholic strength; packaging scope and format; allocation method; linked datasets"
  required_quality_disclosure: "measurement and calibration coverage; laboratory and sensory methods; temporal and facility coverage; mass, water, and utility reconciliation; missing data; provisional ranges used; co-product and waste destinations; allocation sensitivity"
  update_trigger: "Change in product definition or legal threshold; change in dealcoholisation technology or energy system; material change in base-wine sourcing, formulation, packaging, yield, co-product fate, allocation, facility coverage, or reference period; replacement of provisional ranges with reviewed evidence"
