    required_property_ref:
      name: "Energy, mass or volume"
      uuid: ""
    required_unit: "kWh; MJ; kg; m3"
    rule: "Preserve invoiced or metered units, separately identify electricity, steam, natural gas, LPG and diesel, and disclose calorific-value and conversion bases."
  - id: water_stream_separation
    applies_to: "Product water, process water and cleaning water"
    required_property_ref:
      name: "Mass or volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Meter or calculate raw/product water, treatment process water and cleaning/sanitation water separately. Do not treat all site water as product water."
  - id: emission_load
    applies_to: "Direct air and water emissions"
    required_property_ref:
