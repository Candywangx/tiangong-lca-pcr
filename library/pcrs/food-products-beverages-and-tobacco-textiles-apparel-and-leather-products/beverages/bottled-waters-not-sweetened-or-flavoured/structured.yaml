    applies_to: "Water volumes converted to mass"
    required_property_ref:
      name: "Volume and density"
      uuid: ""
    required_unit: "L or m3; kg/L"
    rule: "Use measured product temperature and density or a documented water-density convention. Retain original volume, temperature, density and conversion calculation."
  - id: packaging_tare
    applies_to: "Primary, secondary and tertiary packaging"
    required_property_ref:
      name: "Mass and count"
      uuid: ""
    required_unit: "kg; item"
    rule: "Record each packaging component separately by material. Convert item counts to mass with lot-specific sampled unit weights and retain sample size and variation."
  - id: treatment_chemical_mass
    applies_to: "Each treatment and cleaning chemical"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
