allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared site operations"
    rule: "Subdivide by source, treatment train, carbonation state, package line and cleaning campaign wherever meters or production records permit; allocation is used only after practical subdivision."
    source_ids:
      - who-gdwq-2026
  - rule_id: allocation_mass_balance
    applies_to: "water treatment and filling losses"
    rule: "Assign raw water, treatment water, product, rejects and wastewater through a reconciled mass or volume balance. Do not allocate unexplained loss away from the declared product."
    source_ids:
      - fao-who-cxc-48-2001
  - rule_id: allocation_shared_utilities
    applies_to: "common electricity, compressed air, steam and fuels"
    rule: "Allocate a shared utility by submetered use; otherwise use documented equipment power and operating time, delivered thermal energy, or another causal engineering driver. Production mass alone is allowed only when causal equivalence is demonstrated."
    source_ids: []
  - rule_id: allocation_cleaning
    applies_to: "line and container cleaning"
    rule: "Assign product-dedicated cleaning directly. Allocate shared campaign cleaning by cleaned equipment time, internal surface area, cycle volume or another documented causal driver; disclose changeovers and reusable-container washing."
    source_ids:
      - fao-who-cxc-48-2001
  - rule_id: allocation_internal_recovery
    applies_to: "recovered water, CO2 or packaging material"
    rule: "Record internal recovery once as a transfer that reduces virgin input or waste output. Do not create an avoided-product credit inside the foreground inventory."
    source_ids: []
  - rule_id: allocation_waste_outputs
    applies_to: "PET, cap, label, carton, film, sludge and other residuals"
    rule: "Report physical waste quantities and treatment destinations. Any recycling or avoided-burden credit belongs to a separately declared lifecycle-model scenario and shall not reduce plant-gate waste mass."
    source_ids:
      - us-epa-awg-lca-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_raw_water
      process_id: "raw_water_receipt"
      flow_role: "raw-water receipt and transfer"
      record_type: "meter, tank, source approval and quality-release records"
      raw_fields: "source identity; legal water type; opening/closing meter; tank level; accepted and rejected volume; test result; transfer quantity"
      collection_method: "Calibrated intake and transfer meters reconciled to tank changes and release status"
      unit: "kg; m3"
      frequency: "Each lot or daily, with monthly reconciliation"
      temporal_coverage: "At least 12 consecutive representative months or the complete campaign"
      site_scope: "Every source and bottling site in scope"
      aggregation_rule: "Sum accepted source-specific quantity; keep rejected water and unexplained balance separate"
      quality_evidence: "Meter calibration; source authorization; laboratory release record; balance reconciliation"
    - protocol_id: cp_water_treatment
      process_id: "water_treatment"
      flow_role: "treatment inputs, output and residuals"
      record_type: "submeter, dosing, batch, replacement and discharge records"
      raw_fields: "feed/output water; electricity; each chemical name, concentration and dose; process water; wastewater; sludge; filter count and mass"
      collection_method: "Direct meters and issue records; calculate active or amortized mass only from collected fields"
      unit: "kg; m3; kWh"
      frequency: "Each batch or daily; replacements at event"
      temporal_coverage: "Same period as reference production"
      site_scope: "Each treatment train"
      aggregation_rule: "Preserve route totals, normalize by released treated water, and reconcile water balance"
      quality_evidence: "Calibration; chemical certificate; batch sheet; maintenance and replacement log; laboratory release result"
    - protocol_id: cp_carbonation
      process_id: "carbonation"
      flow_role: "carbonation input, product and loss"
      record_type: "water and CO2 mass-flow, electricity and product test records"
      raw_fields: "water feed; CO2 input; electricity; product CO2; recovered CO2; vented CO2"
      collection_method: "Calibrated mass flow and matched product testing"
      unit: "kg; kWh"
      frequency: "Each lot, summarized monthly"
      temporal_coverage: "Same period as carbonated production"
      site_scope: "Each carbonation line"
      aggregation_rule: "Carbon balance by lot; do not mix still and carbonated production"
      quality_evidence: "Meter calibration; gas certificate; product release test; balance reconciliation"
    - protocol_id: cp_filling_packaging
      process_id: "filling_packaging"
      flow_role: "filling, packaging and line losses"
      record_type: "filler meter, production count, packaging issue, sampled weight, electricity, compressed air and reject records"
      raw_fields: "water feed; good and rejected units; net fill; preform, cap, label, carton and film issues; component weights; PET/cap/label/carton/film scrap; electricity; compressed air; wastewater"
      collection_method: "Calibrated filler and utility meters, ERP issues, counted units and representative component weighing"
      unit: "kg; item; kWh; Nm3; m3"
      frequency: "Each lot or shift, summarized monthly"
      temporal_coverage: "At least 12 representative months or complete campaign"
      site_scope: "Each package format and filling line"
      aggregation_rule: "Net good water is denominator; preserve each component and waste stream separately"
      quality_evidence: "Check-weigher verification; scale and meter calibration; material reconciliation; reject log; package specification"
    - protocol_id: cp_cleaning_sanitation
      process_id: "cleaning_sanitation"
      flow_role: "cleaning water, chemicals, energy, fuels and discharges"
      record_type: "CIP/container-washer cycle, utility, chemical issue, fuel and drain records"
      raw_fields: "cleaning water; NaOH; peracetic acid; electricity; steam; natural gas; LPG; diesel; wastewater; spent concentrate; cycle and line"
      collection_method: "Automated cycle log and meters; issue records; calculate active mass and fuel emissions from collected quantities"
      unit: "m3; kg; kWh; MJ"
      frequency: "Every cleaning cycle, summarized monthly"
      temporal_coverage: "Same period as production"
      site_scope: "Each line, tank, filler and reusable-container washer in scope"
      aggregation_rule: "Assign dedicated cycles directly and shared cycles by documented causal driver"
      quality_evidence: "Approved sanitation programme; concentration verification; meter calibration; fuel invoice; discharge record"
    - protocol_id: cp_wastewater
      process_id: "wastewater_handling"
      flow_role: "influent, treatment inputs, effluent, sludge and emissions"
      record_type: "flow, laboratory, chemical issue, electricity, sludge and destination records"
      raw_fields: "source-stream and influent volume; electricity; ferric chloride; effluent volume; sludge; screenings; COD; BOD; TSS; total N; total P"
      collection_method: "Calibrated flow meters, representative composite sampling, laboratory analysis, scales and issue records"
      unit: "m3; kg; kWh; mg/L"
      frequency: "Continuous flow; sampling at permit or risk-based frequency; monthly balance"
      temporal_coverage: "Same period as production"
      site_scope: "Each treatment plant and discharge destination"
      aggregation_rule: "Match concentration and flow periods, calculate each load separately and reconcile influent/effluent/residuals"
      quality_evidence: "Sampling plan; laboratory QA/QC; meter and scale calibration; chain of custody; discharge compliance record"
  calculation_rules:
    - id: calc_net_product
      applies_to: "reference output"
      rule: "Sum conforming unit net fills or gross filled-unit mass minus measured package tare; exclude rejected units"
      inputs:
        - "conforming count"
        - "fill mass"
        - bottle
        - "cap and label tare"
      output: "kg net conforming bottled water"
      source_ids: []
    - id: calc_water_balance
      applies_to: "raw-water, treatment, filling and cleaning processes"
      rule: "Input water = net product water + wastewater + water in wastes + measured evaporation or vent loss + inventory change + unresolved balance; report unresolved balance rather than forcing closure"
      inputs:
        - "matched water meters"
        - tanks
        - "product and wastewater"
      output: "reconciled kg or m3 by process"
      source_ids:
        - fao-who-cxc-48-2001
    - id: calc_chemical_active_mass
      applies_to: "each treatment and cleaning solution"
      rule: "As-used solution mass = issued volume x measured density; active mass = as-used solution mass x verified active fraction"
      inputs:
        - issue
        - density
        - concentration
      output: "kg solution and kg active substance"
      source_ids: []
    - id: calc_packaging_mass
      applies_to: "each packaging component"
      rule: "Component mass = issued count x lot-specific sampled mean mass; reconcile with stock change, scrap and conforming units"
      inputs:
        - counts
        - "sampled weights"
        - "inventory and scrap"
      output: "kg of PET preform, cap, label, carton and film separately"
      source_ids:
        - us-epa-awg-lca-2019
        - garfi-et-al-2016
    - id: calc_shared_energy
      applies_to: "shared electricity, steam or fuel"
      rule: "Allocated quantity = matched total x causal driver for declared line / sum of matched causal drivers; retain driver and denominator"
      inputs:
        - "meter or invoice"
        - "operating time"
        - "rated load or delivered heat"
      output: "kWh, kg steam, MJ or kg fuel assigned"
      source_ids: []
    - id: calc_emission_load
      applies_to: "each direct water emission"
      rule: "Load = flow-weighted concentration x matched effluent volume with unit conversion; calculate COD, BOD, TSS, total N and total P separately"
      inputs:
        - concentration
        - "effluent volume and sampling coverage"
      output: "kg substance to water"
      source_ids: []
    - id: calc_combustion_emissions
      applies_to: "on-site fuel combustion"
      rule: "Apply verified fuel carbon balance and source-specific stack data or disclosed factors to each fuel separately; do not combine fuel quantities"
      inputs:
        - "natural gas"
        - "LPG or diesel quantity"
        - "carbon content"
        - "stack result or factor"
      output: "kg fossil CO2 and kg NOx to air"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and every lot"
      requirement: "Retain source type, legal water identity, still/carbonated state, complete treatment train, additions, bottle size and all package materials; demonstrate absence of sweeteners and flavourings."
      evidence: "Product specification, source authorization, formula or no-addition declaration, label and release record"
    - id: dq_route_separation
      applies_to: "source, treatment and package routes"
      requirement: "Keep prepared, origin-defined, spring and natural-mineral routes and each package format separate until transparent weighting; do not use a natural-mineral-water restriction for a prepared-water route or vice versa."
      evidence: "Route map, production ledger and weighted aggregation workbook"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use at least 12 consecutive representative months when production is continuous, or the complete campaign; disclose shutdowns, abnormal events and incomplete coverage."
      evidence: "Dated meter, batch, maintenance and production records"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Cover raw water, every applied chemical, electricity, every thermal or fuel input, PET preform, cap, label, carton, film, process water, cleaning water, every waste stream and every direct emission."
      evidence: "Atomic-flow reconciliation checklist and process balances"
    - id: dq_measurement
      applies_to: "meters, scales and laboratories"
      requirement: "Use in-calibration instruments and matched time bases; retain laboratory QA/QC and detection-limit treatment for release and emission data."
      evidence: "Calibration certificates, sampling plan, chain of custody and laboratory QA/QC"
    - id: dq_uuid_identity
      applies_to: "Tiangong references"
      requirement: "Do not assign a UUID until direct read confirms exact physical or chemical identity, flow type, property and unit support; apply the official Chinese baseName when available."
      evidence: "Tiangong direct-read evidence retained outside PCR content"
    - id: dq_range_evidence
      applies_to: "important-flow QA ranges"
      requirement: "Do not infer a range from one case or isolated point. A transferable empirical range requires at least two independent boundary-compatible originals and review of the inference and applicability."
      evidence: "Evidence review record and cited originals"
validation_rules:
  - rule_id: val_identity_scope
    applies_to: "product identity"
    rule: "Reject a data package containing sugar, sweetener, flavouring or another food ingredient, or one that cannot establish a covered bottled-water identity and sealed package."
    source_ids:
      - un-cpc-3-0-2023
      - fao-who-cxs-227-2001
  - rule_id: val_reference_flow
    applies_to: "reference flow"
    rule: "Require 1 kg net conforming bottled-water content, package tare excluded, and every required qualifier; flag the unresolved Tiangong reference identity until verified."
    source_ids: []
  - rule_id: val_treatment_route
    applies_to: "treatment inventory"
    rule: "Require the actual source-specific treatment train, applied chemicals and release controls. For natural mineral or spring water, reject disinfection or composition-changing treatment prohibited by the declared legal route."
    source_ids:
      - fao-who-cxs-227-2001
      - fao-who-cxc-48-2001
      - eu-2009-54-ec
  - rule_id: val_atomic_inventory
    applies_to: "process inventory"
    rule: "Reject combined selected flows for chemicals, electricity, steam, fuels, packaging, wastes or emissions. Require each PET preform, cap, label, carton, film, wastewater, sludge, waste and emitted substance as its own row."
    source_ids: []
  - rule_id: val_water_balance
    applies_to: "water processes"
    rule: "Require a disclosed, time-matched balance from raw water through net product, wastewater, wastes, inventory changes and identified losses; report unresolved difference."
    source_ids:
      - fao-who-cxc-48-2001
  - rule_id: val_hygienic_filling
    applies_to: "container preparation and filling"
    rule: "Require evidence that container preparation, filling and sealing protect against contamination and that cleaning water with possible product contact is potable."
    source_ids:
      - fao-who-cxc-48-2001
      - who-gdwq-2026
  - rule_id: val_packaging_balance
    applies_to: "packaging"
    rule: "Require component-specific input, conforming-unit consumption and scrap reconciliation for PET preform, cap, label, carton and film; package tare shall not enter reference-water mass."
    source_ids:
      - us-epa-awg-lca-2019
      - garfi-et-al-2016
  - rule_id: val_emission_loads
    applies_to: "direct emissions"
    rule: "Require each direct air or water emission to use matched activity and measurement periods, correct unit conversion and a disclosed calculation method; do not accept one combined wastewater-pollutant row."
    source_ids: []
  - rule_id: val_no_unsupported_range
    applies_to: "all amount ranges"
    rule: "Reject any empirical range derived from a single case, abstract, isolated point, or incompatible boundaries; require two independent compatible originals or omit the range and retain the foreground amount rule."
    source_ids: []
  - rule_id: val_dataset_profile
    applies_to: "publication candidate"
    rule: "Require complete metadata, quality disclosure, unresolved UUID disclosure, allocation, upstream dataset references, conditional-route decisions and update triggers before downstream publication."
    source_ids:
      - who-gdwq-2026
published_dataset_profile:
  dataset_role: "secondary_dataset; eligible for background_dataset use only after independent review, Tiangong identity resolution and declared representativeness"
  downstream_use: "Foreground process-data package for bottled-water production and input to process or lifecyclemodel projections for packaged drinking water"
  allowed_use: "Use for the declared source, legal water identity, treatment train, carbonation state, package format, geography, site technology and period; aggregate only with transparent production weighting"
  excluded_use: "Do not use as a proxy for sweetened or flavoured water, soft drinks, bulk municipal water, medicinal water, an undeclared natural-mineral route, another bottle material or size, distribution, refrigeration, consumer use or end of life"
  required_metadata: "PCR id and maturity; source and legal water identity; source location; still/carbonated state; treatment and additions; reference-flow qualifiers; bottle, cap, label, carton and film specification and tare; recycled content; site and line; geography; period; lot coverage; allocation; upstream datasets; waste and wastewater destinations; unresolved UUIDs"
  required_quality_disclosure: "Meter and scale calibration; source and product-release testing; laboratory QA/QC; record coverage; water and packaging balances; allocation drivers; exclusions; abnormal events; unresolved balances; missing UUIDs; absence of evidence-backed ranges"
  update_trigger: "Change in water source or legal identity, treatment or sanitation train, carbonation, bottle size/material/recycled content, cap/label/carton/film, line technology, electricity or fuel supply, wastewater route, allocation, site, representative period, release specification, Tiangong identity or independently reviewed range evidence"
data_sources:
  - id: "un-cpc-3-0-2023"
    type: "official_guidance"
    reference: "United Nations Statistics Division. CPC Version 3.0 Structure, subclass 24410, 2023. https://unstats.un.org/unsd/classifications/Meetings/UNCEISC2023/8-3_Background3_CPC3_Structure.pdf (retrieved 2026-08-23)."
    used_for: "Official classification scope and category title only; not quantitative evidence"
  - id: "fao-who-cxs-227-2001"
    type: "standard"
    reference: "FAO/WHO. General Standard for Bottled/Packaged Drinking Waters (Other than Natural Mineral Waters), CXS 227-2001, amended 2019. https://workspace.fao.org/sites/codex/Standards/CXS%20227-2001/CXS_227e.pdf (retrieved 2026-08-23)."
    used_for: "Product inclusion/exclusion, prepared and origin-defined water identities, permitted additions and treatment-route controls"
  - id: "fao-who-cxc-48-2001"
    type: "standard"
    reference: "FAO/WHO. Code of Hygienic Practice for Bottled/Packaged Drinking Waters (Other than Natural Mineral Waters), CXC 48-2001. https://workspace.fao.org/sites/codex/Standards/CXC%2048-2001/CXC_048e.pdf (retrieved 2026-08-23)."
    used_for: "Source control, treatment-train decomposition, chemical/physical treatment, potable cleaning water, container washing, hygienic filling and sealing, collection and validation rules"
  - id: "who-gdwq-2026"
    type: "official_guidance"
    reference: "World Health Organization. Guidelines for Drinking-water Quality, fourth edition incorporating the first, second and third addenda, 2026, ISBN 978-92-4-012122-5. https://www.who.int/publications/i/item/9789240121225 (retrieved 2026-08-23)."
    used_for: "Source-to-consumer risk management, system assessment, operational monitoring, review and drinking-water quality control"
