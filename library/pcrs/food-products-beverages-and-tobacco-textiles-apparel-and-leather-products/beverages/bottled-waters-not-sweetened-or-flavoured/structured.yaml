    used_for: "Natural mineral and spring-water source identity, permitted treatment, disinfection prohibition, bottling and closure route restrictions"
  - id: "us-epa-awg-lca-2019"
    type: "official_guidance"
    reference: "U.S. Environmental Protection Agency. Life Cycle and Cost Assessments of Atmospheric Water Generation Technologies and Alternative Potable Water Emergency Response Options, 2019, DOI 10.23719/1503094. https://pasteur.epa.gov/uploads/10.23719/1503094/AWG_LCA_Report_Final_1.29.19.pdf (retrieved 2026-08-23)."
    used_for: "Bottled-water system and process decomposition; ultrafiltration, ozone and UV examples; PET preform and bottle conversion; cap, label and film components; no PCR range derived"
  - id: "garfi-et-al-2016"
    type: "literature"
    reference: "Garfí, M.; Cadena, E.; Sanchez-Ramos, D.; Ferrer, I. Life cycle assessment of drinking water: Comparing conventional water treatment, reverse osmosis and mineral water in glass and plastic bottles. Journal of Cleaner Production 137 (2016) 997-1003. DOI 10.1016/j.jclepro.2016.07.218. Open full text: https://upcommons.upc.edu/bitstream/2117/102090/1/LCA%20water_v7_Revised2_POST%20PRINT.pdf (retrieved 2026-08-23)."
    used_for: "Full-text confirmation of bottled-water uptake, factory energy, PET bottle, cap, label, packaging and waste as important inventory elements; single-case quantities are not used as ranges"
