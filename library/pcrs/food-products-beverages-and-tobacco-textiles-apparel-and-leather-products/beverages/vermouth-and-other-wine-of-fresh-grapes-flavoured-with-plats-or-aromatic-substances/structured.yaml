validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
    rule: "The output UUID, Mass flow property, kg unit, net beverage basis, product subtype, and required qualifiers are present and internally consistent."
    source_ids: []
  - rule_id: validate_category_scope
    applies_to: "product category"
    rule: "The product is made from fresh-grape wine products and is flavoured with plants or aromatic substances; excluded wine-based drinks, cocktails, non-grape beverages, and spirits are rejected."
    source_ids:
      - eu-reg-251-2014-consolidated-2021
      - oiv-aromatised-wines-oeno-395-2011
  - rule_id: validate_vermouth_claim
    applies_to: "product sold as vermouth"
    rule: "When vermouth is claimed under the cited EU definition, appropriate *Artemisia* substances and the applicable composition and alcoholic-strength conditions are evidenced."
    source_ids:
      - eu-reg-251-2014-consolidated-2021
  - rule_id: validate_atomic_flows
    applies_to: "inventory"
    rule: "Every electricity, thermal carrier, fuel, refrigerant, water role, ingredient, chemical, packaging component, waste, wastewater indicator, and air emission used by the site is a separate row; collection labels and selector placeholders are rejected."
    source_ids: []
  - rule_id: validate_process_coverage
    applies_to: "process map"
    rule: "Aromatic preparation is included when performed on site; formulation and stabilisation are included; filling and packaging are included unless the reference product is explicitly bulk delivered."
    source_ids:
      - abreu-et-al-2021-fortified-wines
      - monteiro-2022-wine-lca
  - rule_id: validate_mass_balance
    applies_to: "each process and total foreground"
    rule: "Product, wastes, emissions, and inventory change are reconciled to measured inputs; unexplained residuals are investigated and disclosed."
    source_ids: []
  - rule_id: validate_wastewater
    applies_to: "wastewater"
    rule: "Wastewater volume and each measured COD, BOD5, total-nitrogen, and total-phosphorus load are reported at a declared treatment or discharge point without aggregation."
    source_ids:
      - monteiro-2022-wine-lca
  - rule_id: validate_packaging
    applies_to: "packaged product"
    rule: "The declared package format matches individual component rows and component masses; glass, PET, bag-in-box liner, corrugated board, closures, labels, film, and pallets are not aggregated."
    source_ids:
      - monteiro-2022-wine-lca
  - rule_id: validate_no_case_ranges
    applies_to: "all quantitative ranges"
    rule: "A single plant, batch, scenario, or literature observation is not represented as a range, and no range repeats a case value as equal lower and upper bounds."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for finished vermouth or other aromatised fresh-grape wine"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product carbon footprint, life-cycle inventory, environmental footprint, supply-chain comparison, and internal improvement where product subtype, geography, formulation, and package format are compatible"
  excluded_use: "Unflavoured wine, wine-based drinks or cocktails outside scope, non-grape fruit beverages, spirits, or undisclosed recipes and package formats"
  required_metadata: "PCR id and version; product subtype; target market; production site and period; base-wine origin; recipe and ingredient identities; ABV; grapevine-product fraction; sweetness and colour; maturation and filtration route; package format; net mass; allocation; upstream dataset links"
  required_quality_disclosure: "Primary-data coverage; meter and scale calibration; recipe completeness; mass-balance closure; wastewater sampling; direct-emission method; packaging unit-mass evidence; proxies; exclusions; uncertainty; unresolved UUIDs"
  update_trigger: "Recipe, base-wine source, sales denomination, production technology, energy or water system, wastewater treatment, packaging format, allocation method, site, or applicable legal specification changes materially"
