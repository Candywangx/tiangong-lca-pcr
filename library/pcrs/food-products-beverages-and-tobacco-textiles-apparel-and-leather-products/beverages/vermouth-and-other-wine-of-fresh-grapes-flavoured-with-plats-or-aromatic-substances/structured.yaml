allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "product-specific batches and lines"
    rule: "First subdivide meters, tanks, batches, extraction campaigns, and packaging lines so that product-specific inputs and outputs are directly assigned."
    source_ids: []
  - rule_id: allocation_mass
    applies_to: "inseparable shared operations"
    rule: "If subdivision is not practicable and products have comparable functions, allocate shared utilities and wastes by net conforming beverage mass; document the numerator, denominator, and reference period."
    source_ids: []
  - rule_id: allocation_causal
    applies_to: "shared operations with measurable drivers"
    rule: "Use a more specific causal driver, such as line operating time, tank occupancy, cleaning cycles, or packaging counts, when it better explains resource use than mass."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "same-category rework"
    rule: "Keep returned or reworked aromatised wine as a quantified product input and avoid double counting its prior production burdens."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "wastes sent for recovery"
    rule: "Report waste quantity and destination separately and disclose any substitution or recycling credit outside the foreground inventory; do not hide it in a reduced waste amount."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_aromatic_ingredients
      process_id: "aromatic_preparation"
      flow_role: "each individual botanical ingredient"
      record_type: "scale and batch issue record"
      raw_fields: "ingredient identity; supplier lot; gross and tare mass; returned mass; batch id"
      collection_method: "calibrated scale linked to recipe issue record"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative 12 months or all campaigns in the reporting period"
      site_scope: "all on-site extraction lines"
      aggregation_rule: "sum net issued mass by ingredient and divide by transferred aromatic preparation"
      quality_evidence: "scale calibration; batch genealogy; supplier specification"
    - protocol_id: cp_aromatic_liquids
      process_id: "aromatic_preparation"
      flow_role: "extraction ethanol or extraction water"
      record_type: "tank, flowmeter, or batch dosing record"
      raw_fields: "liquid identity; opening and closing tank level; meter reading; density or temperature if needed; batch id"
      collection_method: "calibrated tank or flowmeter reconciliation"
      unit: "kg or m3"
      frequency: "each batch"
      temporal_coverage: "representative 12 months"
      site_scope: "all extraction tanks"
      aggregation_rule: "sum each liquid separately and normalize to aromatic preparation output"
      quality_evidence: "meter calibration; tank chart; recipe record"
    - protocol_id: cp_aromatic_output
      process_id: "aromatic_preparation"
      flow_role: "aromatic preparation output"
      record_type: "transfer record"
      raw_fields: "source batch; destination tank; gross and tare mass; transfer loss"
      collection_method: "calibrated transfer tank or scale"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "representative 12 months"
      site_scope: "all extraction lines"
      aggregation_rule: "sum net transferred mass"
      quality_evidence: "transfer reconciliation; batch release record"
    - protocol_id: cp_formulation_ingredients
      process_id: "formulation_and_stabilisation"
      flow_role: "each base-wine, flavouring, alcohol, sweetener, water, must, or process-aid row"
      record_type: "tank, scale, invoice, and recipe record"
      raw_fields: "material identity; supplier lot; opening and closing quantity; gross and tare; density; batch id"
      collection_method: "calibrated tank, meter, or scale reconciled to recipe"
      unit: "kg or m3"
      frequency: "each batch"
      temporal_coverage: "representative 12 months"
      site_scope: "all formulation tanks"
      aggregation_rule: "calculate net quantity separately for every material row and normalize to conforming bulk output"
      quality_evidence: "calibration; supplier specification; batch reconciliation"
    - protocol_id: cp_process_electricity
      process_id: "each_applicable_process"
      flow_role: "electricity"
      record_type: "meter and operating record"
      raw_fields: "opening and closing meter reading; process id; operating hours; rated load if allocated"
      collection_method: "direct sub-meter preferred; documented engineering allocation otherwise"
      unit: "kWh"
      frequency: "each batch or monthly"
      temporal_coverage: "representative 12 months"
      site_scope: "all foreground equipment"
      aggregation_rule: "sum by process; shared use follows the declared causal allocation rule"
      quality_evidence: "meter calibration; equipment log; allocation worksheet"
    - protocol_id: cp_process_wastes
      process_id: "applicable_process"
      flow_role: "each solid or liquid waste row"
      record_type: "waste dispatch and internal container record"
      raw_fields: "waste identity; gross and tare mass; container count; destination; treatment route; batch or period"
      collection_method: "weighbridge, calibrated scale, or verified container method"
      unit: "kg"
      frequency: "each dispatch"
      temporal_coverage: "representative 12 months"
      site_scope: "all foreground operations"
      aggregation_rule: "sum separately by waste identity and destination"
      quality_evidence: "tickets; invoices; container-weight study"
    - protocol_id: cp_bulk_product_release
      process_id: "formulation_and_stabilisation"
      flow_role: "conforming bulk beverage and off-spec beverage"
      record_type: "tank release and quality record"
      raw_fields: "tank mass; product code; batch id; release status; ABV; grapevine fraction; sugar; colour"
      collection_method: "calibrated tank measurement plus laboratory release test"
      unit: "kg; % vol; g/L as applicable"
      frequency: "each batch"
      temporal_coverage: "all batches in reporting period"
      site_scope: "all formulation tanks"
      aggregation_rule: "sum only conforming released mass for denominator; keep off-spec mass separate"
      quality_evidence: "tank calibration; laboratory certificate; release authorization"
    - protocol_id: cp_wastewater_monitoring
      process_id: "formulation_and_stabilisation"
      flow_role: "wastewater volume, COD, BOD5, total nitrogen, and total phosphorus"
      record_type: "discharge meter and laboratory record"
      raw_fields: "volume; sampling time; COD; BOD5; total nitrogen; total phosphorus; treatment stage; discharge compartment"
      collection_method: "continuous or batch volume measurement with representative flow-weighted sampling"
      unit: "m3 and mg/L"
      frequency: "each discharge campaign or permit frequency"
      temporal_coverage: "representative 12 months including peak production"
      site_scope: "all foreground discharge points"
      aggregation_rule: "calculate every indicator separately at the declared discharge point"
      quality_evidence: "meter calibration; accredited laboratory reports; sampling plan"
    - protocol_id: cp_direct_air_emissions
      process_id: "formulation_and_stabilisation"
      flow_role: "ethanol to air"
      record_type: "monitoring or mass-balance record"
      raw_fields: "ethanol input; ethanol in product; ethanol in liquid waste; recovered ethanol; measured vent concentration and flow if available"
      collection_method: "direct monitoring preferred; otherwise closed documented batch mass balance"
      unit: "kg"
      frequency: "each monitored campaign or batch balance"
      temporal_coverage: "representative operating conditions over 12 months"
      site_scope: "all applicable equipment"
      aggregation_rule: "report the measured or residual loss separately and disclose uncertainty"
      quality_evidence: "instrument calibration; balance closure; engineering review"
    - protocol_id: cp_packaging_line_balance
      process_id: "filling_and_packaging"
      flow_role: "bulk beverage input, packaged beverage, and liquid line loss"
      record_type: "filler and tank record"
      raw_fields: "feed mass; filled units; net fill mass; rejects; recovered product; product code"
      collection_method: "calibrated tank and checkweigher reconciliation"
      unit: "kg"
      frequency: "each packaging batch"
      temporal_coverage: "representative 12 months"
      site_scope: "all filling lines"
      aggregation_rule: "reconcile input to net released beverage, recoveries, and losses"
      quality_evidence: "tank calibration; checkweigher verification; line reconciliation"
    - protocol_id: cp_packaging_water
      process_id: "filling_and_packaging"
      flow_role: "bottle-rinsing water or packaging-line wastewater"
      record_type: "water and discharge meter record"
      raw_fields: "supply meter; discharge meter; cleaning cycle; line id; batch id"
      collection_method: "line sub-meter or documented cycle-volume calculation"
      unit: "m3"
      frequency: "each batch or monthly"
      temporal_coverage: "representative 12 months"
      site_scope: "all filling lines"
      aggregation_rule: "keep supply water and wastewater separate; normalize to net packaged beverage"
      quality_evidence: "meter calibration; cleaning log; water balance"
    - protocol_id: cp_packaging_components
      process_id: "filling_and_packaging"
