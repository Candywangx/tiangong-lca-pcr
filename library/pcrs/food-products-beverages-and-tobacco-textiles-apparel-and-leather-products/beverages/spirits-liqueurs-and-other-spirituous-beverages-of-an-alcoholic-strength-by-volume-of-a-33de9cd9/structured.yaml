allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared processes and utilities"
    rule: "Avoid allocation first by submetering and subdividing route-, process- and product-specific records; system expansion may be used only when the added function and reporting scope are explicit."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical_second
    applies_to: "inseparable shared burdens"
    rule: "If subdivision or system expansion is not feasible, use a documented relevant physical relationship, such as process time, delivered heat or occupied cask-volume-time, that causally represents the shared service."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_other_last
    applies_to: "remaining multifunctionality"
    rule: "Use another relationship such as economic allocation only after documenting why subdivision, system expansion and physical allocation are not feasible; retain prices, period, geography and sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_distillery_coproducts
    applies_to: "spent grain, pot ale, spent wash, captured carbon dioxide and fusel oil"
    rule: "Record each output before choosing waste or co-product status. Do not apply avoided burdens by default. State the destination and apply the declared allocation method consistently to upstream and foreground burdens."
    source_ids:
      - eu-fdm-bref-2019
      - whiskey-lca-ireland-2025
      - scottish-whisky-byproducts-lca-2018
  - rule_id: allocation_rework
    applies_to: "off-specification beverage"
    rule: "Burdens remain with the product system when off-specification beverage is internally reworked; exported recovery or disposal is modelled at the point the material leaves the foreground boundary."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_raw_material_records
      process_id: "raw_material_preparation"
      flow_role: "named feedstocks, water, enzymes, prepared mash and spent grain"
      record_type: "weighbridge, batch sheet, meter and laboratory record"
      raw_fields: "lot id; material id; accepted mass; water; enzyme dose; mash transfer; spent-grain wet mass; moisture"
      collection_method: "reconcile receipts, issues, transfers and residues by lot"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "representative 12 months and all seasonal campaigns"
      site_scope: "all included preparation lines"
      aggregation_rule: "sum inputs and outputs by product lot, then normalize to packaged output"
      quality_evidence: "calibrated scales/meters; supplier identity; moisture method; reconciliation"
    - protocol_id: cp_fermentation_records
      process_id: "fermentation"
      flow_role: "mash, yeast, nutrient, water, electricity, cooling, fermented mash, spent yeast and carbon dioxide"
      record_type: "batch, meter and laboratory record"
      raw_fields: "fermenter id; charge mass; doses; utilities; ABV; transferred mass; captured CO2; yeast residue"
      collection_method: "collect each fermentation batch and reconcile carbon and alcohol"
      unit: "kg; kWh; % vol"
      frequency: "each batch"
      temporal_coverage: "representative 12 months"
      site_scope: "all included fermenters"
      aggregation_rule: "aggregate only batches assigned to the declared product"
      quality_evidence: "calibration; ABV method; batch completeness; carbon-balance check"
    - protocol_id: cp_distillation_records
      process_id: "distillation"
      flow_role: "mash, steam, electricity, cooling water, each fuel, spirit, residues, co-products and air emissions"
      record_type: "still log, meters, tank records and monitoring"
      raw_fields: "charge; retained cuts; ABV; steam; electricity; cooling water; fuel by type; residues; stack data"
      collection_method: "collect each run and reconcile mass and pure alcohol"
      unit: "kg; MJ; kWh; LPA"
      frequency: "each run; continuous meters monthly"
      temporal_coverage: "representative 12 months"
      site_scope: "all stills and thermal units serving the product"
      aggregation_rule: "submeter first; otherwise allocate with documented causal driver"
      quality_evidence: "meter calibration; fuel certificates; ABV test; monitoring method; balance closure"
    - protocol_id: cp_maturation_records
      process_id: "maturation"
      flow_role: "casks, spirit stocks, electricity and ethanol loss"
      record_type: "cask ledger, warehouse meter and stocktake"
      raw_fields: "cask id; mass; prior use; fill/withdrawal date; fill/withdrawal mass and ABV; electricity"
      collection_method: "follow cask or homogeneous maturation lot from fill to withdrawal"
      unit: "kg; LPA; kWh; day"
      frequency: "each cask movement; monthly meter"
      temporal_coverage: "full declared maturation period"
      site_scope: "all warehouses holding the product"
      aggregation_rule: "allocate warehouse service by occupied cask-volume-time"
      quality_evidence: "cask traceability; stocktake; meter calibration; loss reconciliation"
    - protocol_id: cp_liqueur_preparation_records
      process_id: "liqueur_preparation"
      flow_role: "neutral alcohol, each ingredient, water, electricity, steam and prepared base"
      record_type: "receipt certificate, recipe, dosing and meter record"
      raw_fields: "batch id; alcohol mass and ABV; each ingredient mass; water; utilities; transfer mass"
      collection_method: "reconcile certified receipts and actual dosing to prepared base"
      unit: "kg; LPA; kWh; MJ"
      frequency: "each batch"
      temporal_coverage: "representative 12 months"
      site_scope: "all preparation vessels"
      aggregation_rule: "aggregate batches for the declared formulation only"
      quality_evidence: "supplier certificates; calibrated dosing; approved recipe; ABV test"
    - protocol_id: cp_maceration_records
      process_id: "maceration_extraction"
      flow_role: "base, each botanical, flavoured base and each spent botanical"
      record_type: "batch and weigh record"
      raw_fields: "batch id; base mass; botanical identity and mass; duration; output mass; spent wet mass and moisture"
      collection_method: "follow each extraction batch and keep botanical records separate"
      unit: "kg; day"
      frequency: "each batch"
      temporal_coverage: "representative 12 months"
      site_scope: "all extraction vessels"
      aggregation_rule: "normalize declared product batches to packaged output"
      quality_evidence: "material identity; calibrated scale; batch reconciliation"
    - protocol_id: cp_blending_records
      process_id: "blending_reduction"
      flow_role: "route-specific base, reduction water, finishing ingredients, electricity and blended beverage"
      record_type: "batch, recipe, meter and laboratory record"
      raw_fields: "route; input masses and ABV; water; additives; electricity; output mass and ABV"
      collection_method: "reconcile mass and pure alcohol for each blend"
      unit: "kg; LPA; kWh"
      frequency: "each batch"
      temporal_coverage: "representative 12 months"
      site_scope: "all blend tanks"
      aggregation_rule: "aggregate only conforming declared-product batches"
      quality_evidence: "approved recipe; ABV test at 20 °C; calibrated meters; balance closure"
    - protocol_id: cp_filtration_records
      process_id: "filtration"
      flow_role: "beverage, each filter medium, electricity, filtered beverage and each spent medium"
      record_type: "issue, meter, transfer and waste record"
      raw_fields: "technology; input/output mass; each medium mass; electricity; spent wet mass"
      collection_method: "collect each filtration campaign and retain media separately"
      unit: "kg; kWh"
      frequency: "each campaign"
      temporal_coverage: "representative 12 months"
      site_scope: "all filters serving the product"
      aggregation_rule: "reconcile input, output, retained product and waste"
      quality_evidence: "scale and meter calibration; waste tickets; campaign completeness"
    - protocol_id: cp_packaging_records
      process_id: "packaging"
      flow_role: "beverage, each packaging component, electricity, packaged output, rejects and each packaging waste"
      record_type: "bill of materials, line count, unit mass, meter and waste record"
      raw_fields: "SKU; filled mass; component count and unit mass; electricity; conforming units; reject mass; waste by material"
      collection_method: "reconcile issued components and beverage to conforming output and rejects"
      unit: "kg; kWh; item"
      frequency: "each packaging lot"
      temporal_coverage: "representative 12 months"
      site_scope: "all packaging lines for the SKU"
      aggregation_rule: "calculate material mass from verified unit mass and count; allocate pallets by use cycles"
      quality_evidence: "approved bill of materials; checkweigher; unit-mass sample; waste tickets"
    - protocol_id: cp_site_utility_waste_records
      process_id: "site_cleaning_treatment"
      flow_role: "cleaning water, electricity, steam, each chemical, wastewater and sludge"
      record_type: "CIP log, meters, chemical issue, discharge and treatment record"
      raw_fields: "circuit; water; steam; electricity; solution mass and concentration; discharge; COD/BOD/TSS/pH/alcohol; sludge wet and dry mass"
      collection_method: "meter each cleaning circuit and treatment output; retain source-process tags"
      unit: "kg; kWh; MJ"
      frequency: "each clean; continuous discharge with composite sampling"
      temporal_coverage: "representative 12 months"
      site_scope: "all included foreground operations and treatment units"
      aggregation_rule: "submeter first; otherwise allocate by cleaning cycle or measured pollutant load"
      quality_evidence: "calibration; chemical certificates; laboratory QA; discharge and sludge records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every exchange"
      rule: "normalized exchange = exchange assigned to conforming product / packaged conforming product mass"
      inputs:
        - "assigned exchange"
        - "packaged product mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_abv_lpa
      applies_to: "alcohol balance"
      rule: "pure-alcohol volume = beverage volume at 20 °C × ABV fraction; retain density when converting beverage mass and volume"
      inputs:
        - volume
        - "ABV at 20 °C"
        - "density where needed"
      output: "LPA and alcohol-balance fields"
      source_ids:
        - eu-spirit-drinks-regulation-2019
    - id: calc_route_exclusivity
      applies_to: "process inclusion"
      rule: "require exactly one selected route; Route A process records and Route B process records shall not both be normalized into one reference product"
      inputs:
        - "route declaration"
        - "process ids"
      output: "route-conformance result"
      source_ids:
        - eu-spirit-drinks-regulation-2019
    - id: calc_mass_balance
      applies_to: "each process and lot"
      rule: "input mass = product output + co-product output + waste output + quantified emission/loss + stock change, within documented uncertainty"
      inputs:
        - "collected inputs"
        - outputs
        - "losses and stock"
      output: "closure percentage and unexplained difference"
      source_ids:
        - mass-balance-identity
    - id: calc_combustion_emissions
      applies_to: "each thermal fuel"
      rule: "apply fuel-specific measured composition or documented emission factor to measured fuel use; keep fossil and biogenic carbon dioxide separate"
      inputs:
        - "fuel by type"
        - "heating value"
        - "emission factor or stack result"
      output: "individual combustion emissions"
      source_ids:
        - eu-fdm-bref-2019
    - id: calc_maturation_loss
      applies_to: "maturation"
      rule: "ethanol loss = alcohol filled + alcohol added − alcohol withdrawn − samples − documented transfers, converted to ethanol mass"
      inputs:
        - "cask/lot LPA records"
      output: "ethanol to air"
      source_ids:
        - eu-fdm-bref-2019
    - id: calc_cask_pallet_reuse
      applies_to: "reusable oak casks and wooden pallets"
      rule: "allocated mass = item mass × losses or one service share / verified lifetime service cycles; disclose allocation convention"
      inputs:
        - "item mass"
        - cycles
        - losses
        - "product throughput"
      output: "allocated item mass"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain legal/commercial name, route, recipe, ABV at 20 °C, packaging bill and lot traceability."
      evidence: "product specification, batch release and approved bill of materials"
    - id: dq_primary_manufacturing_data
      applies_to: "all foreground processes"
      requirement: "Use company-specific activity data for the manufacturing processes and a product-specific bill of materials."
      evidence: "meters, batch records, invoices, recipes and line records; eu-pef-method-2021"
    - id: dq_temporal_coverage
      applies_to: "annual dataset"
      requirement: "Cover a representative continuous 12-month period or all campaigns in a seasonal year; disclose shutdowns, start-ups and missing periods."
      evidence: "dated raw-data register and coverage assessment"
    - id: dq_technology_geography
      applies_to: "foreground and upstream links"
      requirement: "Match still type, heat source, maturation, filtration, site geography, electricity market, ingredient origin and packaging technology; justify every proxy."
      evidence: "technology inventory and dataset-selection log"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Account for every listed applicable atomic flow and explain confirmed zero, not-applicable and missing records separately."
      evidence: "completeness matrix and mass/alcohol balances; eu-pef-method-2021"
    - id: dq_measurement
      applies_to: "measured and calculated quantities"
      requirement: "Retain calibration, sampling, laboratory method, density/temperature basis, emission factors and uncertainty for each material quantity."
      evidence: "calibration certificates, laboratory QA and calculation workbook"
    - id: dq_coproduct_destination
      applies_to: "spent grain, pot ale, spent wash, captured CO2 and fusel oil"
      requirement: "Retain quantity, moisture or concentration, legal status, recipient, destination and allocation decision."
      evidence: "dispatch tickets, contracts and allocation record"
validation_rules:
  - rule_id: validate_route_exactly_one
    applies_to: "product and process map"
    rule: "Fail when neither route or both routes are selected, or when inventory from both routes is silently combined."
    source_ids:
      - eu-spirit-drinks-regulation-2019
  - rule_id: validate_reference_product
    applies_to: "reference flow"
    rule: "Fail unless the output is 1 kg of packaged sale-ready product with declared product identity, packaging and ABV at 20 °C about 40% vol."
    source_ids:
      - unsd-cpc-3-0-24131
      - eu-spirit-drinks-regulation-2019
  - rule_id: validate_atomic_inventory
    applies_to: "every inventory row"
    rule: "Fail any selected flow that combines materials, utilities, fuels, refrigerants, wastes, packaging or emissions; each exchange shall be individually named."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_mass_alcohol_balance
    applies_to: "each process and production lot"
    rule: "Report closure and fail unexplained material or pure-alcohol imbalance outside the site's documented measurement uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_applicability
    applies_to: "conditional rows and processes"
    rule: "Require an explicit applicable/not-applicable decision supported by route, formulation and technology; absence of a record is not proof of zero."
    source_ids:
      - eu-fdm-bref-2019
  - rule_id: validate_energy_emissions
    applies_to: "thermal supply"
    rule: "Require each fuel separately and require matching fossil/biogenic carbon dioxide and applicable NOx, SO2 and particulate calculations or monitored results."
    source_ids:
      - eu-fdm-bref-2019
  - rule_id: validate_residues_wastewater
    applies_to: "residues and treatment"
    rule: "Require spent grain, pot ale/spent wash as applicable, wastewater, sludge, off-spec product and each packaging waste with measured quantity and destination."
    source_ids:
      - eu-fdm-bref-2019
      - whiskey-lca-ireland-2025
  - rule_id: validate_data_quality
    applies_to: "dataset"
    rule: "Require completeness, technological/geographical/time representativeness, precision, documentation, nomenclature and review evidence; disclose data gaps and proxies."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "Product-specific foreground manufacturing dataset for packaged spirituous beverage at about 40% ABV"
  downstream_use: "secondary_dataset; background_dataset when reviewed for representative market use"
  allowed_use: "Product carbon-footprint or LCA modelling when route, formulation, technology, geography, period, packaging and allocation are compatible"
  excluded_use: "Generic representation of all spirits or liqueurs; comparison across unlike ABV, packaging, maturation or system boundaries without adjustment; industrial ethanol modelling"
  required_metadata: "PCR id and version; route; legal/commercial identity; ABV at 20 °C; recipe; feedstock; still and heat technology; maturation; filtration; packaging bill; geography; period; allocation and co-product destinations"
  required_quality_disclosure: "Primary-data share; meter and sampling coverage; mass and alcohol closure; missing flows; proxy datasets; representativeness; uncertainty; review status"
  update_trigger: "Material change in recipe, alcohol source, still or energy system, maturation, filtration, packaging, site, allocation, co-product destination, annual data period or applicable product law"
