    - rule_id: boundary_foreground_gate
      applies_to: "manufacturing system"
      rule: "Begin at receipt of agricultural/sugar feedstock for Route A or purchased neutral agricultural alcohol and formulation ingredients for Route B; end with packaged sale-ready product."
      source_ids:
        - eu-fdm-bref-2019
    - rule_id: boundary_complete_inventory
      applies_to: "all foreground processes"
      rule: "Include all environmentally relevant material, energy, water, packaging, waste and elementary exchanges, including measured losses and treatment outputs."
      source_ids:
        - eu-pef-method-2021
    - rule_id: boundary_upstream_links
      applies_to: "purchased inputs"
      rule: "Link upstream datasets for every purchased feedstock, ingredient, chemical, fuel, utility, barrel, filter medium and packaging component; do not recursively recreate the same product category."
      source_ids:
        - eu-pef-method-2021
    - rule_id: boundary_downstream_exclusion
      applies_to: "distribution and use"
      rule: "Keep distribution, retail, consumer use and packaging end-of-life outside the foreground package unless the declared study adds them as separate downstream processes."
      source_ids:
        - whiskey-lca-ireland-2025
