validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The product flow UUID, Mass flow-property UUID, mass unit-group UUID, kg unit, and 1 kg net amount must match the reference-flow definition."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Fail completeness when any required qualifier is missing or when plant source, treatment route, packaging, or market state is ambiguous."
    source_ids:
      - fda-pbma-guidance-2023
      - codex-stan-206-1999
  - rule_id: validate_process_coverage
    applies_to: "Foreground inventory"
    rule: "Confirm that all three required process groups are represented and that omitted route-specific operations are explicitly not applicable rather than silently absent."
    source_ids:
      - redan-2024-almond-beverage-htst
      - eu-pef-2021
  - rule_id: validate_mass_balance
    applies_to: "Batch and period inventory"
    rule: "Require a documented mass-balance residual and investigate material unexplained differences before the dataset is released."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_water_separation
    applies_to: "Water inventory"
    rule: "Confirm that incorporated, preparation, cleaning, cooling, recirculated, and discharged water are separated or that any aggregation is justified and non-duplicative."
    source_ids: []
  - rule_id: validate_energy_carriers
    applies_to: "Energy inventory"
    rule: "Confirm that electricity and each thermal-energy carrier are reported separately and converted with documented factors."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_residue_allocation
    applies_to: "Almond residue and off-specification output"
    rule: "Confirm destination and waste or co-product status before applying allocation or treatment; no unsubstantiated avoided-product credit is allowed."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: validate_reasoned_estimates
    applies_to: "Provisional ranges"
    rule: "Treat every reasoned_estimate range as a screening flag only; do not replace collected foreground values with its midpoint or publish it as an allowed range without review."
    source_ids: []
  - rule_id: validate_data_quality_disclosure
    applies_to: "Published dataset package"
    rule: "Confirm temporal, geographical, technological, completeness, meter-quality, proxy, allocation, and uncertainty disclosures and identify every skipped check."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for packaged almond milk at the beverage plant gate"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product-system modelling in which the declared almond formulation, manufacturing route, geography, period, packaging, and market state are representative; comparison only after harmonising functional unit, boundary, allocation, and data quality"
  excluded_use: "Nutritional equivalence claims; animal-milk substitution claims; unqualified extrapolation to other plant beverages, powders, concentrates, fermented products, or materially different extraction and treatment routes"
  required_metadata: "PCR id and version; product and almond input identity; recipe or solids basis; fortification; extraction or reconstitution route; separation; homogenisation; thermal-treatment route; refrigeration or shelf-stable state; packaging; plant and geography; reference period; accepted output; upstream datasets; allocation; residue destinations"
  required_quality_disclosure: "Record coverage and temporal representativeness; meter and scale status; mass- and water-balance residuals; route deviations; data gaps and substitutions; proxy datasets; allocation sensitivity; provisional reasoned-estimate ranges remaining in guidance"
  update_trigger: "Material recipe, almond input form, plant or line, treatment technology, packaging, residue destination, allocation method, energy or water system, supplier geography, or evidence update; otherwise review at least every three years"
