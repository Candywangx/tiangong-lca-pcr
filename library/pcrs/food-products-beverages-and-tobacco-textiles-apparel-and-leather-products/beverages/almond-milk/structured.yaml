  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground rows"
      rule: "normalized amount = attributable batch amount / accepted net packaged beverage mass"
      inputs:
        - "Attributable amount"
        - "accepted unit count"
        - "verified net fill or accepted mass"
      output: "Amount per 1 kg net packaged almond milk"
      source_ids:
        - iso-14044-2006
    - id: calc_volume_to_mass
      applies_to: "Water, beverage, and wastewater volume records"
      rule: "mass = measured volume multiplied by measured or documented density at the applicable temperature"
      inputs:
        - Volume
        - density
        - "temperature and conversion basis"
      output: "kg"
      source_ids:
        - iso-14044-2006
    - id: calc_almond_dry_matter
      applies_to: "Unlike almond input forms"
      rule: "dry-matter input = as-supplied mass multiplied by measured solids fraction"
      inputs:
        - "As-supplied mass"
        - "moisture or solids result"
      output: "kg dry matter for comparability while retaining as-supplied mass"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "Each batch and reporting period"
      rule: "input mass = accepted product + exported co-products + wastes and emissions + inventory change + documented mass-balance residual"
      inputs:
        - "Ingredient and water inputs"
        - "intermediate inventory"
        - "accepted output"
        - residue
        - "off-specification product"
        - "wastewater and measured losses"
      output: "Reconciled mass-balance residual and completeness flag"
      source_ids:
        - eu-pef-2021
    - id: calc_shared_utility_allocation
      applies_to: "Shared utilities"
      rule: "attributable utility = reconciled shared total multiplied by documented causal driver share"
      inputs:
        - "Shared total"
        - "equipment time"
        - throughput
        - "or cycle driver"
      output: "Product-attributable utility by carrier"
      source_ids:
        - eu-pef-2021
