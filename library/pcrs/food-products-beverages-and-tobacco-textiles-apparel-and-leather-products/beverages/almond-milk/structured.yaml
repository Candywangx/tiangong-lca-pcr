allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "Shared operations and outputs"
    rule: "Avoid allocation first by process subdivision, separate metering, or expanding the data collection to preserve physical causality."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: allocation_physical_then_economic
    applies_to: "Unavoidable multifunctionality"
    rule: "When subdivision is not feasible, use a documented physical relationship that reflects causality; use economic allocation only when a defensible physical relationship cannot be established, and disclose prices, period, currency, and sensitivity."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: allocation_residue_status
    applies_to: "Almond residue and recovered off-specification product"
    rule: "Classify the output before allocation. Waste receives no co-product credit and carries its treatment; a saleable co-product receives the selected allocation only after its quantity, destination, and market status are evidenced."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_shared_utilities
    applies_to: "Shared energy, water, cleaning, and packaging lines"
    rule: "Prefer submetered or cycle-specific use; otherwise allocate by documented equipment operating time, throughput, or another causal driver and report the driver."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_almond_and_ingredient_records
      process_id: "almond_base_preparation"
      flow_role: "Almond and recipe inputs"
      record_type: "Purchase, receiving, inventory, and batch-issue records"
      raw_fields: "material id; supplier; origin; lot; input form; moisture or solids basis; opening and closing inventory; issued mass; returned mass"
      collection_method: "Reconcile lot and batch records to calibrated scales"
      unit: "kg as supplied and kg dry matter when converted"
      frequency: "Each batch; monthly reconciliation"
      temporal_coverage: "At least 12 consecutive representative months when available; otherwise the declared production period"
      site_scope: "All included lines and products"
      aggregation_rule: "Sum consumed mass equal to opening plus receipts minus closing, returns, and documented diversions; normalize to accepted output"
      quality_evidence: "Scale calibration; supplier specification; signed batch record; inventory reconciliation"
    - protocol_id: cp_water_and_wastewater_records
      process_id: "almond_base_preparation_cleaning_and_wastewater"
      flow_role: "Formulation, preparation, cleaning water, and wastewater"
      record_type: "Meter, batch, cleaning-cycle, and effluent records"
      raw_fields: "meter start and end; batch charge; cycle volume; incorporated water; cooling water; effluent volume or mass; density; pollutant tests; destination"
      collection_method: "Read calibrated meters and reconcile with batch recipes and water balance"
      unit: "kg or m3 with documented density"
      frequency: "Each batch or shift; monthly reconciliation"
      temporal_coverage: "Same reporting period as accepted product output, including seasonal and cleaning-cycle variation"
      site_scope: "All included water users and discharge points"
      aggregation_rule: "Separate incorporated, evaporated, recirculated, and discharged water; normalize net use and effluent to accepted output"
      quality_evidence: "Meter calibration; recipe record; cleaning log; laboratory result; utility invoice reconciliation"
