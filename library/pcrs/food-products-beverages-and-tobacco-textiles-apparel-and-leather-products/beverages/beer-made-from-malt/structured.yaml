allocation_rules:
  - rule_id: allocation_subdivide_coproduction
    applies_to: "Shared brewery operations"
    rule: "First subdivide meters, batches, lines, tanks, and cleaning events where feasible. Directly assign beer-specific ingredients and packaging."
    source_ids:
      - brewers-europe-beer-pefcr-2025
  - rule_id: allocation_beverages_by_volume
    applies_to: "Multiple beverages"
    rule: "Allocate residual shared brewery inputs and outputs among beverage products by finished volume produced in the same period; disclose denominator and included products."
    source_ids:
      - brewers-europe-beer-pefcr-2025
  - rule_id: allocation_feed_coproducts
    applies_to: "Brewers' grains or comparable residues used as feed"
    rule: "Assign brewery burdens to beer and no burden to the feed co-product while reporting quantity and destination. Any avoided-product credit is a separately disclosed scenario."
    source_ids:
      - brewers-europe-beer-pefcr-2025
  - rule_id: allocation_non_feed_coproduct_review
    applies_to: "Recovered carbon dioxide, yeast, extracts, or other non-feed co-products"
    rule: "Prefer subdivision or physical causal assignment. Otherwise document function, marketability, quantity, price, basis, and sensitivity; do not automatically apply the feed rule."
    source_ids:
      - brewers-europe-beer-pefcr-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "wort_production"
      flow_role: "brewing ingredients"
      record_type: "purchase, recipe, and stock records"
      raw_fields: "material; form; mass; moisture; batch; stock change"
      collection_method: "Reconcile purchases, transfers, recipe issues, and inventory"
      unit: "kg"
      frequency: "per receipt and batch"
      temporal_coverage: "continuous 12 months"
      site_scope: "brewery and product"
      aggregation_rule: "annual net use divided by conforming output"
      quality_evidence: "invoices; recipe system; inventory reconciliation"
    - protocol_id: cp_wort_batch_records
      process_id: "wort_production"
      flow_role: "wort and residues"
      record_type: "brew-house batch record"
      raw_fields: "volume; temperature; extract; evaporation; residue; transfer loss"
      collection_method: "Capture mash, kettle, separation, cooling, and transfer records"
      unit: "m3; kg"
      frequency: "per batch"
      temporal_coverage: "continuous 12 months"
      site_scope: "brew house and product"
      aggregation_rule: "sum conforming batches and normalize"
      quality_evidence: "calibrated instruments; batch reconciliation"
    - protocol_id: cp_utility_meters
      process_id: "wort_production_fermentation_and_finishing_filling_and_packaging"
      flow_role: "water and energy"
      record_type: "meter and equipment record"
      raw_fields: "meter value; fuel; steam; heat; runtime; factor; scope"
      collection_method: "Read calibrated meters or calculate from equipment load and logged runtime"
      unit: "native unit; MWh; m3"
      frequency: "daily to monthly"
      temporal_coverage: "continuous 12 months"
      site_scope: "meter area and brewery"
      aggregation_rule: "reconcile site total, subdivide, allocate, normalize"
      quality_evidence: "calibration; bills; meter map; calculation sheet"
    - protocol_id: cp_fermentation_records
      process_id: "fermentation_and_finishing"
      flow_role: "wort, yeast, beer, carbon dioxide"
      record_type: "tank and laboratory record"
      raw_fields: "volume; extract; temperature; yeast; transfer; loss; recovered CO2"
      collection_method: "Reconcile tank receipts, fermentation conversion, transfers, recovery, and finished volume"
      unit: "m3; kg"
      frequency: "per tank or batch"
      temporal_coverage: "continuous 12 months"
      site_scope: "fermentation train and product"
      aggregation_rule: "sum conforming production and normalize"
      quality_evidence: "tank log; laboratory result; recovery meter"
    - protocol_id: cp_packaging_records
      process_id: "filling_and_packaging"
      flow_role: "beer and packaging"
      record_type: "filler, bill-of-material, and dispatch record"
      raw_fields: "filled volume; rejects; material; package; trip count; loss"
      collection_method: "Reconcile filler counters, package issues, stock, rejects, and saleable output"
      unit: "m3; kg"
      frequency: "per production run"
      temporal_coverage: "continuous 12 months"
      site_scope: "line and product"
      aggregation_rule: "sum conforming runs and normalize"
      quality_evidence: "line counter; material issue; dispatch reconciliation"
    - protocol_id: cp_waste_coproduct_records
      process_id: "wort_production_fermentation_and_finishing_filling_and_packaging"
      flow_role: "co-products and wastes"
      record_type: "weighbridge, transfer, and treatment record"
      raw_fields: "quantity; moisture; destination; treatment; stock change"
      collection_method: "Reconcile measured dispatch, storage change, sale, reuse, and treatment"
      unit: "kg; m3"
      frequency: "per movement and monthly"
      temporal_coverage: "continuous 12 months"
      site_scope: "brewery"
      aggregation_rule: "annual net output divided by conforming beer"
      quality_evidence: "tickets; contracts; stock survey; treatment record"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "All foreground flows"
      rule: "Allocated annual net quantity / annual conforming beer volume x 0.1 m3"
      inputs:
        - "net flow quantity"
        - "conforming beer volume"
      output: "quantity per reference flow"
      source_ids: []
    - id: calc_total_energy
      applies_to: "Brewery energy"
      rule: "Convert electricity, fuel, steam, heat, and refrigeration to MWh with documented factors, sum before allocation, then apply the declared rule"
      inputs:
        - "native energy records"
        - "conversion factors"
        - "allocation data"
      output: "MWh/hl"
      source_ids:
        - eu-bat-fdm-2019
    - id: calc_water_balance
      applies_to: "Brewery water"
      rule: "Intake = beer + wastewater + evaporation + co-product moisture + other losses + stock change; report recycled water separately"
      inputs:
        - "intake and outlet records"
      output: "reconciled m3/hl and residual"
      source_ids:
        - ec-jrc-fdm-bref-2019
    - id: calc_material_balance
      applies_to: "Brewing and filling"
      rule: "Reconcile ingredient dry matter, wort volume and extract, beer transfers, losses, co-products, wastes, and stock changes for the same period"
      inputs:
        - "process and inventory records"
      output: "balance and unexplained residual"
      source_ids:
        - eu-bat-fdm-2019
    - id: calc_fermentation_co2
      applies_to: "Fermentation"
      rule: "Calculate generation from measured extract conversion or documented stoichiometry; report generated, recovered, reused, sold, and vented amounts distinctly"
      inputs:
        - "extract conversion"
        - "recovery and vent records"
      output: "kg biogenic CO2/hl by route"
      source_ids:
        - ec-jrc-fdm-bref-2019
    - id: calc_reusable_packaging
      applies_to: "Reusable containers"
      rule: "Divide container manufacture by documented expected trips and include washing, rejection, and replacement; test uncertain trip counts"
      inputs:
        - "pool records"
        - "packaging and utility data"
      output: "allocated packaging and washing per hl"
      source_ids:
        - brewers-europe-beer-pefcr-2025
    - id: calc_downstream_scaling
      applies_to: "Consumed-beer lifecycle profile"
      rule: "Use 0.102 m3 sold per 0.1 m3 consumed for default 2% loss; use 7% only under the shelf-life condition or replace with representative evidence"
      inputs:
        - "consumed amount"
        - "loss rate"
      output: "sold amount for downstream model"
      source_ids:
        - brewers-europe-beer-pefcr-2025
  data_quality_requirements:
    - id: dq_reporting_period
      applies_to: "Foreground records"
      requirement: "Use a continuous 12-month period covering normal and seasonal production."
      evidence: "dated source-system extracts and production reconciliation"
    - id: dq_data_age
      applies_to: "Company-specific data"
      requirement: "Use data no more than three years old unless a longer period is demonstrably representative."
      evidence: "data vintage and representativeness justification"
    - id: dq_product_specificity
      applies_to: "Ingredients and packaging"
      requirement: "Collect at beer-product or product-family level; site averages require an infeasibility and allocation record."
      evidence: "recipe, packaging bill, meter map, and allocation worksheet"
    - id: dq_inventory_completeness
      applies_to: "Brewery"
      requirement: "Maintain water, energy, raw-material, wastewater, waste-gas, waste, and co-product inventories with flow sheets and balances."
      evidence: "inventory register, process map, mass and volume balances"
    - id: dq_traceability
      applies_to: "Material foreground values"
      requirement: "Record source system, meter or document, frequency, gaps, stock change, conversion, allocation denominator, and uncertainty."
      evidence: "collection protocol evidence and audit trail"
    - id: dq_representativeness
      applies_to: "Upstream and PEF-aligned data"
      requirement: "Prefer supplier-specific data, assess temporal, geographical, technological, and precision or uncertainty quality, and target company-specific DQR of 1.5 or better where required."
      evidence: "supplier records and documented quality assessment"
validation_rules:
  - rule_id: validate_identity_qualifiers
    applies_to: "Dataset metadata"
    rule: "Confirm CPC 24310 alcoholic malt beer and record beer type, alcoholic strength, package, site, period, and shelf life; reject non-alcoholic beer and industrial ethanol broth."
    source_ids:
      - brewers-europe-beer-pefcr-2025
  - rule_id: validate_reference_volume
    applies_to: "Reference flow"
    rule: "Require exactly 0.1 m3 of active Beer flow 6da29594-9e39-48eb-82d1-c7a4484d3740 as the quantitative reference."
    source_ids: []
  - rule_id: validate_process_completeness
    applies_to: "Foreground"
    rule: "Require all three process-map stages with utilities, losses, wastes, and co-products."
    source_ids:
      - ec-jrc-fdm-bref-2019
  - rule_id: validate_total_energy
    applies_to: "Brewery total"
    rule: "Compare normalized annual energy with 0.02-0.05 MWh/hl; investigate, reconcile, and explain outside values without replacing measurements."
    source_ids:
      - eu-bat-fdm-2019
  - rule_id: validate_water_use
    applies_to: "Brewery total"
    rule: "Compare total intake with the 0.60 m3/hl screening ceiling; higher values require water-balance and boundary review."
    source_ids:
      - ec-jrc-fdm-bref-2019
  - rule_id: validate_wastewater
    applies_to: "Brewery total"
    rule: "Compare wastewater with 0.15-0.60 m3/hl; review discharge, evaporation, product, co-product moisture, recycling, and treatment boundary outside this range."
    source_ids:
      - ec-jrc-fdm-bref-2019
      - eu-bat-fdm-2019
  - rule_id: validate_mass_volume_balance
    applies_to: "Processes and period"
    rule: "Reconcile ingredients, water, wort, beer, carbon dioxide, co-products, wastes, evaporation, wastewater, filling loss, stock change, and internal transfers; disclose residual uncertainty."
    source_ids:
      - eu-bat-fdm-2019
  - rule_id: validate_allocation
    applies_to: "Multi-product site"
    rule: "Verify subdivision first, direct assignment of beer-specific materials, volume allocation of residual shared beverage operations, and disclosed denominators and co-product treatment."
    source_ids:
      - brewers-europe-beer-pefcr-2025
  - rule_id: validate_temporal_quality
    applies_to: "Foreground data"
    rule: "Require continuous 12-month coverage and flag company data older than three years unless representativeness is justified."
    source_ids:
      - brewers-europe-beer-pefcr-2025
  - rule_id: validate_downstream_scaling
    applies_to: "Lifecycle model"
    rule: "Reconcile sold and consumed volumes and verify the declared 2%, 7%, or evidence-based loss without changing the brewery-gate reference flow."
    source_ids:
      - brewers-europe-beer-pefcr-2025
published_dataset_profile:
  dataset_role: "Brewery-gate foreground dataset normalized to 0.1 m3 finished malt beer"
  downstream_use: "Project to a unit process or connect upstream and downstream datasets in a lifecyclemodel"
  allowed_use: "Brewery inventory; hotspot screening; supplier-data collection; process improvement; disclosed cradle-to-gate or cradle-to-grave study"
  excluded_use: "Comparative assertion or PEF claim without all applicable impact assessment, quality, review, and reporting provisions"
  required_metadata: "Beer type; alcoholic strength; package or bulk format; brewery site; reporting period; shelf life; reference-flow UUID; CPC identity"
  required_quality_disclosure: "Packaging mix; allocation; co-product destinations; recovered carbon dioxide; data gaps; temporary estimates; representativeness; deviations"
  update_trigger: "Material change in recipe, strength, package mix, production technology, site, allocation, co-product destination, background data, or applicable external method"
data_sources:
  - id: "brewers-europe-beer-pefcr-2025"
    type: "standard"
    reference: "The Brewers of Europe. *Product Environmental Footprint Category Rules for Beer*, revised version approved 21 March 2025, accessed 2026-08-10. https://brewersofeurope.eu/wp-content/uploads/2025/05/FINAL-Revised-draft-updated-PEFCR-as-approved-by-review-panel.pdf"
    used_for: "Beer identity and performance; lifecycle boundary; company data; allocation; brewery operations; data quality; product-loss scaling. EU PEF scope is broader than this brewery-gate foreground PCR."
  - id: "ec-jrc-fdm-bref-2019"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre. *Best Available Techniques Reference Document for the Food, Drink and Milk Industries*, 2019, accessed 2026-08-10. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2020-01/JRC118627_FDM_Bref_2019_published.pdf"
    used_for: "Brewing process map; resources and residues; water; wastewater; heat; operational records. Reported values are screening evidence for European installations, not product specifications."
  - id: "eu-bat-fdm-2019"
    type: "standard"
    reference: "European Commission. Commission Implementing Decision (EU) 2019/2031, 2019-11-12, accessed 2026-08-10. https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj"
    used_for: "Environmental inventory and beer BAT-associated energy and wastewater levels. These are installation reference ranges, not fixed inventory values or product conformity limits."
