measurement_rules:
  - id: reference_mass
    applies_to: "net conforming reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground exchanges to 1,000 kg net released product. Packaging mass is inventoried separately."
  - id: alcoholic_strength
    applies_to: "reference product and intermediate alcoholic liquids"
    required_property_ref:
      name: "Alcoholic strength by volume"
      uuid: ""
    required_unit: "% vol at 20 °C"
    rule: "Measure and report actual alcoholic strength at 20 °C using an applicable validated method; do not treat label strength or a nominal recipe target as a measured batch result. Sources: eu-reg-2019-787; oiv-spirit-analysis-compendium-2023."
  - id: volume_mass_conversion
    applies_to: "liquid records reported by volume"
    required_property_ref:
      name: "Mass and volume"
      uuid: ""
    required_unit: "kg; L or m3 at recorded temperature"
    rule: "Convert volume to mass using measured product density at the same stated temperature, preferably 20 °C, and retain density, temperature, instrument, and formula. Do not use water density for an ethanol-water mixture. Sources: eu-reg-2019-787; oiv-spirit-analysis-compendium-2023."
  - id: absolute_alcohol_check
    applies_to: "product and intermediate alcohol balance"
    required_property_ref:
      name: "Volume of pure alcohol"
      uuid: ""
    required_unit: "L alcohol at 20 °C"
    rule: "Calculate litres of pure alcohol as liquid volume at 20 °C multiplied by measured ABV/100; use it only as a composition and yield check, not as the PCR reference amount."
  - id: ingredient_mass
    applies_to: "each fermentable raw material, yeast, enzyme, nutrient, additive, and processing aid"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record every material identity as a separate net batch issue; no recipe group or combined material row is accepted."
  - id: energy_records
