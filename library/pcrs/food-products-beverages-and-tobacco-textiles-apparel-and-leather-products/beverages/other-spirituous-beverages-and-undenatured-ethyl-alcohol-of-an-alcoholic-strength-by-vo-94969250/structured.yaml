    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Calculate make-up and leakage separately for each refrigerant identity from opening charge, additions, recovery, and closing charge."
  - id: packaging_mass
    applies_to: "each bottle, closure, label, carton, and film"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record each component separately from issued count and verified unit mass or direct weighing."
