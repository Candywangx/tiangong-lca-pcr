    required_property_ref:
      name: "Energy or Mass"
      uuid: ""
    required_unit: "kWh, MJ, kg, or m3"
    rule: "Preserve each measured carrier and unit; convert only with a documented net calorific value or metered energy basis and do not combine carriers before inventory reporting."
  - id: refrigerant_balance
