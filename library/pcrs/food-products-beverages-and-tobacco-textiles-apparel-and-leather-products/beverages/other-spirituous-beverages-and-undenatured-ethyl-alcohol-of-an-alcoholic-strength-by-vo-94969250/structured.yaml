system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "foreground production"
      rule: "Include all directly controlled operations from the declared starting material received at the facility through release of conforming bulk or packaged reference product."
      source_ids:
        - eu-jrc-fdm-bref-2019
        - eu-reg-2019-787
    - rule_id: boundary_conditional_routes
      applies_to: "route selection"
      rule: "Activate feedstock preparation, fermentation, distillation or rectification, maturation, blending, filtration, on-site energy, cooling, and packaging only when performed for the reference product, and disclose every omitted route."
      source_ids:
        - eu-jrc-fdm-bref-2019
        - eu-reg-2019-787
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased products and services"
      rule: "Link every fermentable raw material, purchased alcohol or distillate, yeast, enzyme, auxiliary, water, energy carrier, refrigerant, barrel, and packaging component to a separate upstream dataset."
      source_ids:
        - eu-ef-method-2021
    - rule_id: boundary_wastes_emissions
      applies_to: "foreground outputs"
      rule: "Include fermentation carbon dioxide, ethanol losses, combustion releases, refrigerant leakage, each stillage or spent-liquid stream, cleaning wastewater, treatment sludge, each monitored wastewater indicator, and each packaging waste separately."
      source_ids:
        - eu-jrc-fdm-bref-2019
    - rule_id: boundary_atomic_inventory
      applies_to: "all inventory rows"
      rule: "Reject aggregate utility, fuel, ingredient, packaging, waste, or emission labels; one selected flow represents one physical or chemical exchange and one applicable route condition."
