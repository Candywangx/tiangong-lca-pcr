allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "product-specific batches and routes"
    rule: "First subdivide tanks, meters, fermentation batches, still campaigns, maturation lots, cleaning cycles, and packaging lines so that inputs and outputs are directly assigned to the product and route."
    source_ids:
      - eu-ef-method-2021
  - rule_id: allocation_causal
    applies_to: "shared utilities and cleaning"
    rule: "When subdivision is not practicable, use a documented physical driver that represents causality, such as metered energy, equipment operating time, steam demand, tank occupancy, cleaning cycles, or filled units."
    source_ids:
      - eu-ef-method-2021
  - rule_id: allocation_mass
    applies_to: "inseparable products of comparable function"
    rule: "Use net output mass only when subdivision and a more representative causal relationship are not practicable; disclose numerator, denominator, period, and sensitivity."
    source_ids:
      - eu-ef-method-2021
  - rule_id: allocation_co_products
    applies_to: "stillage, distillers solids, recovered carbon dioxide, and other marketable outputs"
    rule: "Record every co-product at its measured output quantity. Apply the study's accepted allocation hierarchy and disclose any substitution or recycling credit separately; do not hide it by reducing waste or fuel rows."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - eu-ef-method-2021
  - rule_id: allocation_rework
    applies_to: "same-category rework"
    rule: "Record returned or reworked alcoholic product as a separate quantified input and avoid double counting burdens already carried by its upstream dataset."
    source_ids:
      - eu-ef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_feedstock_materials
      process_id: "feedstock_preparation"
      flow_role: "each individual fermentable feedstock"
      record_type: "scale, silo, tank, and batch issue record"
      raw_fields: "material identity; supplier lot; gross; tare; return; batch id"
      collection_method: "calibrated weighing or tank reconciliation"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "all campaigns in representative 12 months"
      site_scope: "all preparation lines"
      aggregation_rule: "sum net issue separately by material and route"
      quality_evidence: "calibration; supplier specification; batch genealogy"
    - protocol_id: cp_feedstock_auxiliaries
      process_id: "feedstock_preparation"
      flow_role: "each enzyme or preparation auxiliary"
      record_type: "batch issue and formulation record"
      raw_fields: "chemical identity; active concentration; gross; tare; return; batch id"
      collection_method: "calibrated scale or dosing meter"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative 12 months"
      site_scope: "all preparation lines"
      aggregation_rule: "calculate active or formulated mass separately for each material"
      quality_evidence: "calibration; safety or technical sheet; recipe"
    - protocol_id: cp_fermentation_materials
      process_id: "alcoholic_fermentation"
      flow_role: "each molasses, wine, whey, or other fermentation input"
      record_type: "tank, scale, and batch record"
      raw_fields: "material identity; source; mass or volume; density; temperature; batch id"
      collection_method: "calibrated tank, meter, or scale"
      unit: "kg; L; m3"
      frequency: "each batch"
      temporal_coverage: "all campaigns in representative 12 months"
      site_scope: "all fermenters"
      aggregation_rule: "convert and sum each material separately"
      quality_evidence: "tank chart; density record; batch genealogy"
    - protocol_id: cp_fermentation_auxiliaries
      process_id: "alcoholic_fermentation"
      flow_role: "each yeast, nutrient, acid, or auxiliary"
      record_type: "dosing and batch record"
      raw_fields: "identity; strain or grade; active concentration; quantity; batch id"
      collection_method: "calibrated scale or dosing meter"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative 12 months"
      site_scope: "all fermenters"
      aggregation_rule: "sum net dose separately by identity"
      quality_evidence: "calibration; culture or supplier specification; recipe"
    - protocol_id: cp_process_water
      process_id: "each_applicable_process"
      flow_role: "each water-use role"
      record_type: "water meter and batch record"
      raw_fields: "opening and closing meter; process id; batch or period"
      collection_method: "dedicated sub-meter preferred; documented water balance otherwise"
      unit: "m3"
      frequency: "batch, daily, or monthly"
      temporal_coverage: "representative 12 months"
      site_scope: "all foreground water points"
      aggregation_rule: "retain preparation, fermentation, boiler, cooling, product, cleaning, and rinsing water separately"
      quality_evidence: "meter calibration; water balance"
    - protocol_id: cp_process_energy
      process_id: "each_applicable_process"
      flow_role: "electricity or delivered steam"
      record_type: "energy meter and operating record"
      raw_fields: "carrier; meter readings; process id; operating time; allocation driver"
      collection_method: "sub-meter preferred; documented engineering allocation otherwise"
      unit: "kWh; MJ"
      frequency: "batch or monthly"
      temporal_coverage: "representative 12 months"
      site_scope: "all foreground equipment"
      aggregation_rule: "aggregate separately by process and carrier"
      quality_evidence: "meter calibration; equipment log; allocation worksheet"
    - protocol_id: cp_alcoholic_liquid_balance
      process_id: "alcoholic_fermentation_distillation_rectification"
      flow_role: "each alcoholic liquid input and output"
      record_type: "calibrated tank, flowmeter, and laboratory record"
      raw_fields: "mass or volume; temperature; density; ABV; opening and closing inventory; batch id"
      collection_method: "tank or flowmeter reconciliation with laboratory ABV"
      unit: "kg; L; % vol"
      frequency: "each transfer or batch"
      temporal_coverage: "all batches in reporting period"
      site_scope: "all relevant tanks and flowmeters"
      aggregation_rule: "convert volume to mass at recorded density and keep each liquid identity separate"
      quality_evidence: "calibration; OIV-compatible method record; batch reconciliation"
    - protocol_id: cp_fuel_and_steam
      process_id: "onsite_energy_generation"
      flow_role: "each fuel and delivered steam or heat"
      record_type: "delivery, stock, meter, and boiler record"
      raw_fields: "fuel identity; quantity; moisture; calorific value; steam meter; condensate return"
      collection_method: "calibrated fuel and steam measurement"
      unit: "kg; m3; MJ"
      frequency: "each delivery and monthly"
      temporal_coverage: "representative 12 months"
      site_scope: "all boilers and heaters"
      aggregation_rule: "reconcile each fuel separately to net delivered energy"
      quality_evidence: "meter calibration; delivery ticket; fuel analysis; boiler log"
    - protocol_id: cp_combustion_emissions
      process_id: "onsite_energy_generation"
      flow_role: "each direct combustion emission"
      record_type: "stack test, continuous monitor, and fuel calculation record"
      raw_fields: "pollutant identity; concentration; flow; time; fuel quantity; factor"
      collection_method: "direct monitoring preferred; declared fuel-specific factor otherwise"
      unit: "kg"
      frequency: "permit frequency or representative campaign"
      temporal_coverage: "representative operating conditions"
      site_scope: "every emission point"
      aggregation_rule: "calculate fossil CO2, biogenic CO2, CH4, N2O, NO, NO2, SO2, and particulate matter independently"
      quality_evidence: "laboratory or monitor QA; factor source; calculation sheet"
    - protocol_id: cp_refrigerant_balance
      process_id: "cooling_refrigeration"
      flow_role: "each refrigerant make-up and leak"
      record_type: "circuit service and charge record"
      raw_fields: "refrigerant identity; opening charge; additions; recovery; closing charge; equipment id"
      collection_method: "annual mass balance by circuit, supported by leak service records"
      unit: "kg"
      frequency: "each service and annually"
      temporal_coverage: "representative 12 months"
      site_scope: "all relevant cooling circuits"
      aggregation_rule: "calculate each refrigerant independently and allocate by documented cooling service"
      quality_evidence: "technician record; cylinder weights; circuit register"
    - protocol_id: cp_distillation_residues
      process_id: "distillation_rectification"
      flow_role: "each stillage, spent-wash, spent-lees, or sludge output"
      record_type: "tank, scale, and dispatch record"
      raw_fields: "waste identity; mass or volume; density; dry matter; destination; batch"
      collection_method: "calibrated tank, scale, or verified container method"
      unit: "kg; m3"
      frequency: "each batch or dispatch"
      temporal_coverage: "representative 12 months"
      site_scope: "all stills and residue systems"
      aggregation_rule: "sum separately by waste identity and destination"
      quality_evidence: "calibration; dispatch ticket; dry-matter test"
    - protocol_id: cp_direct_air_emissions
      process_id: "applicable_process"
      flow_role: "fermentation CO2 or ethanol release"
      record_type: "monitor or closed balance record"
      raw_fields: "flow identity; vent concentration and flow; alcohol inputs and outputs; recovered quantity"
      collection_method: "direct measurement preferred; carbon or alcohol balance otherwise"
      unit: "kg"
      frequency: "each campaign or representative test"
      temporal_coverage: "representative 12 months"
      site_scope: "every applicable vent or process"
      aggregation_rule: "report each source and substance separately"
      quality_evidence: "calibration; balance closure; engineering review"
    - protocol_id: cp_maturation_records
      process_id: "maturation"
      flow_role: "barrel, storage energy, matured output, barrel waste, and ethanol loss"
      record_type: "vessel register, tank record, meter, and laboratory record"
      raw_fields: "vessel id; material; tare; fills; reuse count; dates; mass; ABV; temperature; electricity"
      collection_method: "vessel-by-vessel or tank-lot reconciliation"
      unit: "kg; kWh; days"
      frequency: "each fill, transfer, and release"
      temporal_coverage: "complete maturation lots released in period"
      site_scope: "all maturation stores"
      aggregation_rule: "allocate vessel and energy by occupancy; calculate ethanol loss separately"
      quality_evidence: "vessel register; calibration; laboratory result; inventory reconciliation"
    - protocol_id: cp_blending_materials
      process_id: "blending_conditioning"
      flow_role: "each alcohol, water, sweetener, colour, or flavour input"
      record_type: "recipe, scale, tank, and issue record"
      raw_fields: "identity; grade; concentration; gross; tare; return; batch id"
      collection_method: "calibrated dosing, scale, or tank reconciliation"
      unit: "kg; m3"
      frequency: "each batch"
      temporal_coverage: "representative 12 months"
      site_scope: "all blending tanks"
      aggregation_rule: "sum each material separately and normalize to conforming output"
      quality_evidence: "calibration; recipe approval; supplier specification"
    - protocol_id: cp_filtration_records
      process_id: "blending_conditioning"
      flow_role: "filter aid and filtration residue"
      record_type: "issue, filter, and waste record"
      raw_fields: "aid identity; dry input; wet residue; moisture; product recovery; batch"
      collection_method: "scale and filter campaign reconciliation"
      unit: "kg"
      frequency: "each filter campaign"
      temporal_coverage: "representative 12 months"
      site_scope: "all filters"
      aggregation_rule: "keep aid input and residue output separate"
      quality_evidence: "calibration; filter log; waste ticket"
    - protocol_id: cp_product_release
      process_id: "blending_conditioning"
      flow_role: "reference product and off-spec liquid"
      record_type: "tank release and quality record"
      raw_fields: "product identity; legal name; mass; volume; density; temperature; ABV; disposition; batch"
      collection_method: "calibrated tank plus laboratory release test"
      unit: "kg; L; % vol"
      frequency: "each batch"
      temporal_coverage: "all released batches in period"
      site_scope: "all release tanks"
      aggregation_rule: "use conforming net mass as denominator; retain rework and rejection separately"
      quality_evidence: "tank calibration; release certificate; batch reconciliation"
    - protocol_id: cp_cleaning_records
      process_id: "cleaning_wastewater"
      flow_role: "each cleaning water, cleaner, disinfectant, and electricity input"
      record_type: "CIP recipe, meter, tank, and cycle record"
      raw_fields: "chemical identity; active concentration; charge; return; discharge; water; energy; equipment"
      collection_method: "calibrated chemical, water, and energy measurement"
      unit: "kg; m3; kWh"
      frequency: "each cleaning cycle"
      temporal_coverage: "representative 12 months including product changes"
      site_scope: "all foreground CIP circuits and manual cleaning"
      aggregation_rule: "calculate each chemical and water role separately by assigned cycle"
      quality_evidence: "calibration; CIP log; concentration test"
    - protocol_id: cp_wastewater_monitoring
      process_id: "cleaning_wastewater"
      flow_role: "wastewater, sludge, COD, BOD5, nitrogen, or phosphorus"
      record_type: "discharge meter, sampling, laboratory, and sludge record"
      raw_fields: "volume; concentration; time; treatment stage; sludge mass; dry matter; destination"
      collection_method: "flow-weighted representative sampling and calibrated volume measurement"
      unit: "m3; mg/L; kg"
      frequency: "each campaign or permit frequency"
      temporal_coverage: "representative 12 months including peak production"
      site_scope: "all foreground discharge points"
      aggregation_rule: "calculate each load independently at the declared point"
      quality_evidence: "meter calibration; accredited laboratory report; sampling plan"
    - protocol_id: cp_packaging_components
      process_id: "filling_packaging"
      flow_role: "each bottle, closure, label, box, or film"
      record_type: "bill of materials, issue, count, and unit-mass record"
      raw_fields: "component identity; issued count; return; unit mass; supplier lot"
      collection_method: "net count multiplied by verified unit mass or direct issued mass"
      unit: "kg"
      frequency: "each packaging batch"
      temporal_coverage: "representative 12 months"
      site_scope: "all package formats and filling lines"
      aggregation_rule: "calculate each component separately"
      quality_evidence: "supplier specification; unit-mass sample; inventory reconciliation"
    - protocol_id: cp_packaging_water
      process_id: "filling_packaging"
      flow_role: "bottle-rinsing water"
      record_type: "line water meter and cycle record"
      raw_fields: "meter readings; line; format; batch; dry-rinse status"
      collection_method: "line sub-meter or verified cycle-volume calculation"
      unit: "m3"
      frequency: "each batch or monthly"
      temporal_coverage: "representative 12 months"
      site_scope: "all filling lines"
      aggregation_rule: "keep rinsing water separate from cleaning wastewater"
      quality_evidence: "meter calibration; line log; water balance"
    - protocol_id: cp_packaging_wastes
      process_id: "filling_packaging"
      flow_role: "each individual packaging waste"
      record_type: "rejection and waste dispatch record"
      raw_fields: "material identity; rejected count or mass; destination; batch"
      collection_method: "direct weighing or rejected count times verified unit mass"
      unit: "kg"
      frequency: "each batch and dispatch"
      temporal_coverage: "representative 12 months"
      site_scope: "all filling lines"
      aggregation_rule: "sum separately for glass, aluminium, cork, paper, corrugated board, and polyethylene film"
      quality_evidence: "rejection log; waste ticket; unit-mass verification"
  calculation_rules:
    - id: normalize_exchange
      applies_to: "every inventory row"
      rule: "normalized amount = net process amount / net conforming reference-product mass × 1,000 kg"
      inputs:
        - "net recorded exchange"
        - "conforming output mass"
      output: "amount per 1,000 kg reference product"
      source_ids: []
    - id: volume_to_mass
      applies_to: "every alcoholic liquid recorded by volume"
      rule: "mass = measured volume at stated temperature × measured density at the same temperature"
      inputs:
        - volume
        - density
        - temperature
      output: "kg alcoholic liquid"
      source_ids:
        - oiv-spirit-analysis-compendium-2023
    - id: litres_pure_alcohol
      applies_to: "alcohol-balance check"
      rule: "litres pure alcohol at 20 °C = liquid volume at 20 °C × measured ABV/100"
      inputs:
        - "volume at 20 °C"
        - "measured ABV"
      output: "L pure alcohol"
      source_ids:
        - eu-reg-2019-787
        - oiv-spirit-analysis-compendium-2023
    - id: refrigerant_leak
      applies_to: "each refrigeration circuit"
      rule: "leak = opening charge + additions − recovered refrigerant − closing charge, with unexplained residual disclosed"
      inputs:
        - "circuit charge and service records"
      output: "kg leaked refrigerant by identity"
      source_ids: []
    - id: wastewater_load
      applies_to: "each wastewater indicator"
      rule: "load = discharged volume × flow-weighted concentration with unit conversion; calculate each indicator independently"
      inputs:
        - "m3 wastewater"
        - "mg/L indicator"
      output: "kg indicator per 1,000 kg product"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: packaging_component_mass
      applies_to: "each packaging component"
      rule: "component mass = (issued count − returned unused count) × verified unit mass"
      inputs:
        - counts
        - "unit mass"
      output: "kg component per 1,000 kg product"
      source_ids: []
    - id: maturation_alcohol_loss
      applies_to: "matured alcoholic liquid"
      rule: "ethanol loss = opening pure-alcohol mass + additions − closing pure-alcohol mass − transferred or sampled pure-alcohol mass"
      inputs:
        - mass
        - density
        - ABV
        - transfers
        - samples
      output: "kg ethanol to air with residual uncertainty"
      source_ids:
        - eu-reg-2019-787
    - id: batch_mass_balance
      applies_to: "each process and total foreground"
      rule: "closure = accounted products + wastes + elementary releases + closing inventory − opening inventory, compared with measured inputs; investigate residuals"
      inputs:
        - "all input"
        - output
        - "and inventory records"
      output: "closure ratio and unexplained residual"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every product, waste, and elementary flow"
      requirement: "Retain one physical or chemical identity per row, with grade, composition, supplier, route, and destination data needed for an upstream or receiving-flow match."
      evidence: "specification; safety sheet; recipe; waste ticket; Tiangong UUID when confirmed"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use at least 12 consecutive representative months for continuous production; for campaigns and maturation releases, include all relevant campaigns or lots and disclose seasonality and stock changes."
      evidence: "meter exports; batch register; maturation register; production calendar"
    - id: dq_measurement
      applies_to: "mass, volume, ABV, density, energy, and emissions"
      requirement: "Use calibrated instruments and validated laboratory methods; document estimation, conversion, and allocation where direct measurement is unavailable."
      evidence: "calibration certificates; laboratory method; allocation worksheet"
    - id: dq_route_completeness
      applies_to: "process map"
      requirement: "Reconcile the declared starting condition and every activated route to detailed process rows; explain every omitted conditional process."
      evidence: "route diagram; batch genealogy; supplier records"
    - id: dq_inventory_completeness
      applies_to: "all exchanges"
      requirement: "Reconcile raw materials, yeast, enzymes, auxiliaries, water, electricity, steam, each fuel, each refrigerant, barrels, packaging, wastes, wastewater indicators, and direct emissions without aggregate placeholders."
      evidence: "completeness matrix; mass and alcohol balances"
    - id: dq_geography_technology
      applies_to: "upstream links"
      requirement: "Match raw-material, alcohol, electricity, fuel, water, refrigerant, barrel, and packaging datasets to supplier geography and production technology or disclose proxies."
      evidence: "supplier location; utility contract; proxy justification"
    - id: dq_case_evidence
      applies_to: "external quantitative evidence"
      requirement: "Do not turn a single plant, batch, product, or literature scenario into a category range. Retain unresolved range needs until at least two independent boundary-compatible original sources support synthesis."
      evidence: "source review record; boundary comparison"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "The product is an other spirituous beverage or undenatured ethyl alcohol below 80% vol within the declared semantic boundary; denatured alcohol, alcohol at or above 80% vol, and excluded fermented beverages are rejected."
    source_ids:
      - unsd-cpc-3-24139
      - eu-reg-2019-787
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Net mass, product identity, legal name, raw-material route, ABV at 20 °C, density, maturation state, formulation, package state, Mass UUID, unit-group UUID, and kg unit are present and consistent; the unresolved product-flow UUID remains a review blocker for publication."
    source_ids:
      - eu-reg-2019-787
      - oiv-spirit-analysis-compendium-2023
  - rule_id: validate_abv_conversion
    applies_to: "alcoholic liquids"
    rule: "Every volume-to-mass and pure-alcohol conversion retains measured volume, density, temperature, ABV method, formula, and unit conversion; water density and nominal label strength are not substituted."
    source_ids:
      - eu-reg-2019-787
      - oiv-spirit-analysis-compendium-2023
  - rule_id: validate_route_coverage
    applies_to: "process map"
    rule: "Each on-site feedstock-preparation, fermentation, energy, cooling, distillation, rectification, maturation, blending, filtration, cleaning, wastewater, and packaging operation is activated or explicitly documented as not applicable."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - eu-reg-2019-787
  - rule_id: validate_atomic_flows
    applies_to: "inventory"
    rule: "Every fermentable raw material, yeast, enzyme, auxiliary, water role, electricity use, steam or heat carrier, fuel, refrigerant, cleaner, barrel, bottle, closure, label, box, film, waste, wastewater indicator, and air emission is a separate atomic row."
    source_ids: []
  - rule_id: validate_energy_no_double_count
    applies_to: "steam and fuels"
    rule: "Purchased steam and on-site fuel combustion are reconciled so that internal steam transfer is not assigned a second upstream production burden."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_refrigerants
    applies_to: "cooling circuits"
    rule: "Each refrigerant identity has separate make-up and leakage rows derived from a circuit mass balance; refrigerants are not grouped or hidden in electricity."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_waste_emissions
    applies_to: "outputs"
    rule: "Fermentation CO2, ethanol releases by process, combustion pollutants, stillage, spent wash, spent lees, sludge, cleaning wastewater, COD, BOD5, total nitrogen, total phosphorus, and each packaging waste are independently reported at a declared boundary and destination."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_mass_balance
    applies_to: "process and total foreground"
    rule: "Material and pure-alcohol balances reconcile inputs, conforming product, co-products, wastes, direct releases, samples, rework, and stock change; residuals are investigated and disclosed."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "all quantitative ranges"
    rule: "No single-case value is expressed as a category range. A source-backed empirical range requires at least two independent boundary-compatible original sources and an explicit synthesis; otherwise the range is omitted and the evidence need remains in manifest review metadata."
    source_ids:
      - risner-et-al-2018-whey-spirits
published_dataset_profile:
  dataset_role: "Foreground production dataset for one finished other spirituous beverage or undenatured ethyl alcohol product below 80% vol"
  downstream_use: "secondary_dataset; background_dataset after methodology review, UUID resolution, and publication"
  allowed_use: "Life-cycle inventory, product carbon footprint, environmental footprint, supply-chain assessment, and facility improvement where product identity, raw-material route, ABV, technology, geography, maturation, formulation, and package format are compatible"
  excluded_use: "Denatured alcohol; alcohol at or above 80% vol; excluded beer, wine, cider, perry, mead, or other fermented beverages; another spirit type or route without compatibility review; comparative claims that ignore recipe, ABV, maturation, or packaging differences"
  required_metadata: "PCR id and version; product class and legal name; target market; site and period; raw-material and alcohol origin; yeast and enzyme route; process map; distillation technology; measured ABV and density at stated temperature; maturation vessel and duration; formulation and filtration; bulk or package format; allocation; upstream datasets"
  required_quality_disclosure: "Primary-data coverage; calibration and laboratory methods; mass and pure-alcohol balance closure; allocation; co-product treatment; wastewater sampling; direct-emission method; refrigerant balance; packaging evidence; proxies; exclusions; uncertainty; unresolved UUIDs and range evidence"
  update_trigger: "Material change in product identity, legal specification, raw material, fermentation organism, enzyme route, still or rectification technology, fuel or electricity supply, refrigerant, maturation, formulation, filtration, cleaning, wastewater treatment, package format, allocation, site, or applicable market requirements"
