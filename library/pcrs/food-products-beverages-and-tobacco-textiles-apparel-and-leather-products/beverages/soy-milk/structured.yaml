allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "Shared processes and co-products"
    rule: "Avoid allocation first by separately metering or subdividing extraction, formulation, treatment, packaging, sanitation, and utility operations; use system expansion only when the downstream function and substituted product are explicitly modelled and justified for the study goal."
    source_ids:
      - us-epa-lca-2006
  - rule_id: allocation_coproduct_status
    applies_to: "Okara, recovered soy solids, and recovered product"
    rule: "Establish whether each output is a marketable product, internally recycled material, or waste from documented destination and acceptance evidence before assigning burdens or credits."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: allocation_physical_relation
    applies_to: "Unavoidable shared burdens"
    rule: "If allocation cannot be avoided, use a documented physical causal relationship that reflects how the shared input or output changes with the products or functions; simple wet-mass allocation is not automatically valid, particularly when moisture differs."
    source_ids:
      - us-epa-lca-2006
  - rule_id: allocation_other_relation
    applies_to: "No defensible physical relation"
    rule: "Use another relationship, such as economic value, only when a physical relationship cannot be established; record prices, reference period, currency, market condition, calculation, and sensitivity to the chosen relationship."
    source_ids:
      - us-epa-lca-2006
  - rule_id: allocation_no_avoided_burden_default
    applies_to: "Waste recovery and co-product use"
    rule: "Do not apply avoided-burden credits by default. Model a substitution scenario only when required by the downstream study, with substituted function, market, quality equivalence, and displacement assumption disclosed separately from the foreground inventory."
    source_ids:
      - us-epa-lca-2006
  - rule_id: allocation_rework_internal
    applies_to: "Rework and internal recycling"
    rule: "Treat material returned within the same foreground system as an internal transfer; retain the original material and energy burdens and record any additional reprocessing inputs and losses without creating a second product credit."
    source_ids:
      - eu-jrc-fdm-bref-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "soy_receiving_preparation"
      flow_role: "received soy and other materials"
      record_type: "weighbridge, receiving, invoice, specification, and stock records"
      raw_fields: "supplier; lot; material form; accepted and rejected mass; moisture or solids basis where relevant; opening and closing stock; specification"
      collection_method: "reconcile receipts, issues, returns, and stock change by material and lot"
      unit: "kg"
      frequency: "each receipt and inventory period"
      temporal_coverage: "same production period as reference output, including opening and closing stock"
      site_scope: "all facilities and warehouses supplying the declared foreground site"
      aggregation_rule: "accepted input = receipts + opening stock − closing stock − documented returns; normalise by reference output"
      quality_evidence: "calibrated scale records; supplier specification; lot traceability; stock reconciliation"
    - protocol_id: cp_batch_mass_balance
      process_id: "soy_receiving_preparation_aqueous_extraction_separation_homogenisation_heat_treatment"
      flow_role: "intermediate transfers and losses"
      record_type: "batch sheet, tank level, inline meter, scale, and loss-event records"
      raw_fields: "batch id; input and output masses; tank heel; sample; spill; reject; rework; moisture or solids; timestamps"
      collection_method: "reconcile each linked batch across transfer points and retain unexplained difference"
      unit: "kg"
      frequency: "each batch or production run"
      temporal_coverage: "all batches represented by the dataset"
      site_scope: "declared site and included lines"
      aggregation_rule: "aggregate only after batch reconciliation; divide period totals by net conforming output"
      quality_evidence: "meter or scale calibration; signed batch records; reconciliation report"
    - protocol_id: cp_water_records
      process_id: "aqueous_extraction_separation_formulation_standardisation"
      flow_role: "ingredient, extraction, cooling, and process water"
      record_type: "dedicated meters, batch additions, tank records, and site water balance"
      raw_fields: "source; meter; purpose; volume; temperature; density if converted; reuse origin and destination"
      collection_method: "meter by use where available; otherwise documented allocation from reconciled site balance"
      unit: "m3 or kg"
      frequency: "continuous, batch, or billing interval"
      temporal_coverage: "full production period, including start-up and shutdown"
      site_scope: "all included production and utility areas"
      aggregation_rule: "separate incorporated, process, reused, evaporated, and discharged water; avoid double counting reused streams"
      quality_evidence: "meter calibration; batch sheet; utility bill; water-balance reconciliation"
    - protocol_id: cp_recipe_batch_records
      process_id: "formulation_standardisation"
      flow_role: "recipe inputs and formulated output"
      record_type: "approved recipe, material issue, batch sheet, laboratory result, and release record"
      raw_fields: "product code; batch; ingredient lot and quantity; water; aid; rework; protein or solids; output; reject"
      collection_method: "reconcile approved recipe with actual issued quantities and measured batch output"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "all represented product batches"
      site_scope: "all included formulations and lines"
      aggregation_rule: "aggregate by product subtype only after retaining formulation-specific totals"
      quality_evidence: "approved recipe; lot genealogy; laboratory certificate; batch release"
    - protocol_id: cp_treatment_records
      process_id: "homogenisation_heat_treatment"
      flow_role: "treatment feed, output, and operating condition"
      record_type: "flow meter, batch record, time-temperature logger, pressure record, and release test"
      raw_fields: "batch; feed and output mass; homogenisation setting; temperature; hold time; cooling; rework; reject"
      collection_method: "link continuous or batch treatment records to product lots and transfer quantities"
      unit: "kg and process-specific units"
      frequency: "each run with continuous critical-parameter logging where applicable"
      temporal_coverage: "all represented treatment runs"
      site_scope: "each treatment line and declared route"
      aggregation_rule: "aggregate only runs with matched feed, output, and release status"
      quality_evidence: "calibrated instruments; logger completeness; release authorisation"
    - protocol_id: cp_energy_records
      process_id: "aqueous_extraction_separation_homogenisation_heat_treatment_filling_packaging_storage_sanitation_utilities_wastewater"
      flow_role: "electricity, fuel, steam, heat, refrigeration, and shared utilities"
      record_type: "meter, invoice, fuel issue, boiler, refrigeration, and equipment operating records"
      raw_fields: "carrier; meter; quantity; period; equipment or area; operating hours; conversion factor; heating-value basis; allocation driver"
      collection_method: "use dedicated meters first; otherwise calculate from verified operating data or allocate shared totals with documented driver"
      unit: "kWh, MJ, kg, or m3"
      frequency: "continuous, shift, batch, or billing interval"
      temporal_coverage: "full production period including non-production support loads"
      site_scope: "all included process and utility areas"
      aggregation_rule: "reconcile carrier totals to invoices and stocks; prevent double counting across processes"
      quality_evidence: "meter calibration; invoice; stock balance; calculation sheet; allocation review"
    - protocol_id: cp_packaging_release_records
      process_id: "filling_packaging_storage"
      flow_role: "packaging inputs, packed output, and filling losses"
      record_type: "packaging issue and return, bill of materials, line count, checkweigher, scrap, and release records"
      raw_fields: "component; material; packaging level; unit mass; issued and returned units; good packs; rejects; nominal and measured net fill"
      collection_method: "reconcile packaging issue with returned stock, conforming packs, and scrap; determine net beverage mass from validated fill records"
      unit: "kg and units"
      frequency: "each packaging run"
      temporal_coverage: "all represented packaging runs and storage through release"
      site_scope: "all included filling lines and packaging levels"
      aggregation_rule: "sum net conforming beverage mass only; keep packaging mass separate"
      quality_evidence: "packaging specification; scale or checkweigher calibration; line reconciliation; release record"
    - protocol_id: cp_coproduct_records
      process_id: "aqueous_extraction_separation"
      flow_role: "okara and recovered soy solids"
      record_type: "scale, moisture test, transfer, sales, recipient, and dispatch records"
      raw_fields: "output id; wet mass; tare; moisture or dry matter; destination; recipient acceptance; price if economic allocation is used"
      collection_method: "weigh each transfer or dispatch and link analytical and destination evidence"
      unit: "kg"
      frequency: "each transfer or dispatch"
      temporal_coverage: "full production period"
      site_scope: "all separation lines and co-product destinations"
      aggregation_rule: "aggregate by consistent state and destination; convert basis only with measured moisture"
      quality_evidence: "calibrated scale; laboratory result; dispatch and recipient record"
    - protocol_id: cp_sanitation_records
      process_id: "sanitation_utilities_wastewater"
      flow_role: "cleaning water, chemicals, recovery, and sanitation cycles"
      record_type: "CIP recipe and cycle log, chemical issue, conductivity, turbidity, pH, temperature, flow, and recovery record"
      raw_fields: "circuit; cycle; water; chemical; concentration; time; temperature; conductivity; turbidity; pH; recovered quantity"
      collection_method: "capture automated logs or signed manual records and link each cycle to equipment and production period"
      unit: "m3, kg, and process-specific units"
      frequency: "each cleaning cycle"
      temporal_coverage: "all sanitation cycles attributable to represented production"
      site_scope: "all included circuits and open-cleaning areas"
      aggregation_rule: "allocate shared cycles by documented causal driver and preserve cycle totals"
      quality_evidence: "instrument calibration; recipe approval; cycle-completion record; recovery log"
    - protocol_id: cp_wastewater_records
      process_id: "aqueous_extraction_separation_sanitation_utilities_wastewater"
      flow_role: "wastewater and waterborne emissions"
      record_type: "flow meter, sampling, laboratory, transfer, treatment, and discharge records"
      raw_fields: "stream; volume; sampling time; pH; temperature; COD, BOD, TSS, nitrogen, phosphorus, oils or other measured substances; treatment; destination"
      collection_method: "monitor flow at relevant transfer and discharge points and pair representative concentrations with matched volume"
      unit: "m3 and kg substance"
      frequency: "continuous flow where available and sampling at declared frequency"
      temporal_coverage: "full production period, including cleaning and non-routine discharges"
      site_scope: "all included drains, treatment units, and discharge points"
      aggregation_rule: "calculate substance mass from matched volume and concentration; keep off-site transfer separate from direct discharge"
      quality_evidence: "meter calibration; chain of custody; laboratory method and result; permit or transfer record"
    - protocol_id: cp_residue_waste_records
      process_id: "all_process_ids"
      flow_role: "rejects, residues, packaging scrap, sludge, and other waste"
      record_type: "container weights, waste log, manifest, transfer, recovery, and disposal records"
      raw_fields: "material; source process; gross and tare mass; moisture; hazard status; destination; recovery or disposal operation"
      collection_method: "weigh at collection or dispatch and reconcile internal transfers to final destination"
      unit: "kg"
      frequency: "each container or dispatch"
      temporal_coverage: "full production period"
      site_scope: "all included process and waste-handling areas"
      aggregation_rule: "aggregate only equivalent material states and destinations; avoid counting internal transfer twice"
      quality_evidence: "calibrated scale; waste manifest; contractor receipt; recovery evidence"
    - protocol_id: cp_direct_emissions
      process_id: "soy_receiving_preparation_homogenisation_heat_treatment_sanitation_utilities_wastewater"
      flow_role: "direct emissions to air and water"
      record_type: "continuous monitor, stack test, leak log, fuel record, refrigerant service record, wastewater result, and factor calculation"
      raw_fields: "source; substance; measured concentration or factor; flow or activity; period; event type; calculation"
      collection_method: "use measured release where available; otherwise calculate from collected activity and documented factor"
      unit: "kg"
      frequency: "monitoring interval, event, or calculation period"
      temporal_coverage: "full production period including routine and relevant non-routine operation"
      site_scope: "all included direct-emission sources"
      aggregation_rule: "sum source-specific releases and normalise by reference output; keep generic upstream emissions out"
      quality_evidence: "calibration; test report; maintenance or leak record; factor source and calculation review"
  calculation_rules:
    - id: calc_reference_normalisation
      applies_to: "All inventory rows"
      rule: "normalised amount = included-period flow amount ÷ included-period net conforming soy milk mass"
      inputs:
        - "reconciled flow total"
        - "net conforming reference output"
      output: "flow amount per 1 kg net soy milk"
      source_ids:
        - us-epa-lca-2006
    - id: calc_net_reference_output
      applies_to: "Finished soy milk"
      rule: "net conforming output = released beverage net mass; packaging, rejects, retained samples, unshipped loss, and rework still inside the system are excluded"
      inputs:
        - "release records"
        - "fill mass"
        - "bulk loadout"
        - rejects
        - samples
        - rework
      output: "kg net conforming soy milk"
      source_ids:
        - codex-cxs-322r-2015
        - eu-jrc-fdm-bref-2019
    - id: calc_batch_mass_balance
      applies_to: "Each production process and linked batch"
      rule: "unexplained difference = total mass inputs − product outputs − co-product outputs − measured waste and direct releases − documented stock or hold-up change"
      inputs:
        - "batch input"
        - output
        - reject
        - rework
        - stock
        - sample
        - spill
        - evaporation
        - "and residue records"
      output: "mass-balance difference and completeness flag"
      source_ids:
        - us-epa-lca-2006
    - id: calc_water_balance
      applies_to: "Production, sanitation, and wastewater"
      rule: "water input = incorporated water + wastewater transfer or discharge + evaporation + exported moisture + closing hold-up − opening hold-up, with reused internal water shown on both matched transfer sides but counted once in net withdrawal"
      inputs:
        - "water meters"
        - "recipe water"
        - "wastewater flow"
        - "product and co-product moisture"
        - reuse
        - evaporation
        - "tank inventory"
      output: "reconciled water withdrawal, use, reuse, and discharge per reference flow"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_energy_by_carrier
      applies_to: "All energy-consuming processes"
      rule: "carrier use = metered quantity or verified operating load × time; convert only with documented factor and reconcile totals with invoices and stock change"
      inputs:
        - meters
        - invoices
        - stock
        - load
        - "operating time"
        - "conversion and heating-value basis"
      output: "carrier-specific energy or fuel per reference flow"
      source_ids:
        - us-epa-lca-2006
    - id: calc_packaging_balance
      applies_to: "Filling and packaging"
      rule: "packaging consumed = opening stock + receipts − closing stock − verified returns; reconcile with conforming packs and measured scrap by material"
      inputs:
        - "packaging inventory"
        - receipts
        - returns
        - "unit mass"
        - "good units"
        - scrap
      output: "packaging input and scrap mass per reference flow"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_wastewater_substance
      applies_to: "Direct waterborne emission"
      rule: "substance mass = matched discharge volume × measured concentration, with unit conversion and sampling representativeness documented"
      inputs:
        - "discharge volume"
        - concentration
        - "sampling interval"
        - "laboratory result"
      output: "kg substance per reference flow"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_allocation_factor
      applies_to: "Unavoidable shared burden"
      rule: "calculate factor from the selected causal physical relationship; if none is defensible, calculate from the declared alternative relationship and retain a sensitivity case"
      inputs:
        - "separately measured outputs"
        - "causal driver or price and period"
        - "shared burden"
      output: "documented allocation factor summing to one across functions"
      source_ids:
        - us-epa-lca-2006
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Product and reference flow"
      requirement: "Retain product code, CPC 24423 classification rationale, Codex subtype, recipe, lot genealogy, release status, required qualifiers, and Tiangong reference-flow UUID."
      evidence: "product specification; recipe; lot and release record; classification review"
    - id: dq_measurement_control
      applies_to: "Measured foreground records"
      requirement: "Identify instrument or source record, calibration or verification status, resolution, units, collection frequency, missing periods, corrections, and responsible facility."
      evidence: "calibration certificate; meter register; signed batch or utility record"
    - id: dq_temporal_coverage
      applies_to: "Dataset period"
      requirement: "Cover a declared production period representative of the reported product and include start-up, shutdown, cleaning, rework, and non-routine losses within that period; disclose excluded periods and seasonality."
      evidence: "production calendar; batch list; meter and sanitation completeness report"
    - id: dq_technological_geographic_scope
      applies_to: "Site and production route"
      requirement: "Match the recorded facility, whole-bean or derivative route, formulation, heat treatment, packaging line, utilities, and geography; do not merge materially different routes without separate results or justified weighting."
      evidence: "site and line description; route-specific production totals; weighting calculation"
    - id: dq_completeness_reconciliation
      applies_to: "Materials, energy, water, products, co-products, waste, and emissions"
      requirement: "Reconcile material, water, energy, packaging, and waste totals; list all known gaps and explain the treatment of unexplained balances instead of silently cutting them off."
      evidence: "balance worksheets; invoice and stock reconciliation; gap register"
    - id: dq_coproduct_destination
      applies_to: "Co-products and recovered materials"
      requirement: "Support product or waste classification, state, moisture basis, destination, and allocation with recipient, transfer, and analytical evidence for the same reporting period."
      evidence: "scale and moisture result; dispatch or internal transfer; recipient acceptance; allocation worksheet"
    - id: dq_wastewater_quality
      applies_to: "Wastewater and waterborne emissions"
      requirement: "Match monitored flow and concentration in time and location, retain sampling and analytical method, and distinguish transfer to treatment from direct environmental discharge."
      evidence: "flow record; sampling plan; chain of custody; laboratory result; treatment or discharge record"
    - id: dq_quality_indicators
      applies_to: "All primary and secondary data"
      requirement: "Assess and disclose precision, completeness, temporal and geographical representativeness, technological representativeness, consistency, and reproducibility in relation to intended downstream use."
      evidence: "data-quality assessment and reviewer trace"
    - id: dq_source_traceability
      applies_to: "Calculations and external rules"
      requirement: "Preserve source identifiers, formulas, conversion factors, versions or dates, and input records so every projected amount can be reproduced without authoring logs in the PCR."
      evidence: "calculation workbook or machine-readable calculation record; source register"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The reference output must be exactly 1 kg net Soy milk b0bd96e4-7b19-4d9c-8d80-ea47b97bbde3 using Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg; packaging mass must be excluded."
    source_ids:
      - unsd-cpc-3-2025
      - codex-cxs-322r-2015
  - rule_id: validate_product_scope
    applies_to: "Product identity"
    rule: "The dataset must describe a finished non-fermented soy beverage within CPC 24423 and declare Codex subtype, soy input form, formulation, protein basis, treatment, packaging, storage condition, geography, and period; excluded soy products and other plant milks fail scope."
    source_ids:
      - unsd-cpc-3-2025
      - codex-cxs-322r-2015
  - rule_id: validate_process_route
    applies_to: "Process map"
    rule: "Each required process must have included activity or an explicit route-specific explanation; aqueous extraction may be not operated only for a declared soy-derivative route with an upstream dataset, and actual treatment and packaging configurations must be stated."
    source_ids:
      - codex-cxs-322r-2015
  - rule_id: validate_inventory_completeness
    applies_to: "Foreground inventory"
    rule: "The package must contain or explicitly justify all known soy and ingredient inputs, incorporated and process water, energy carriers, packaging, reference product, co-products, rework, losses, residues, wastewater, and direct emissions for the same boundary and period."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - us-epa-lca-2006
  - rule_id: validate_internal_transfers
    applies_to: "Intermediate and recovered flows"
    rule: "Every internal product, rework, recovered water, or cleaning solution output must have a matched receiving input; internal circulation must not create net product or avoided-burden credit."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_mass_water_balances
    applies_to: "Batch and site balances"
    rule: "Material and water balances must be reproducible from collected records; unexplained differences, evaporation assumptions, stock changes, and reused streams must be disclosed and must not conceal missing inventory."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - us-epa-lca-2006
  - rule_id: validate_energy_reconciliation
    applies_to: "Energy inventory"
    rule: "Energy must be separated by carrier and reconciled with meters, invoices, fuel stocks, or verified calculations; purchased energy and on-site fuel use must not be double counted."
    source_ids:
      - us-epa-lca-2006
  - rule_id: validate_coproduct_allocation
    applies_to: "Co-products and shared burdens"
    rule: "Co-product status and destination evidence are required; allocation must follow avoidance, physical relationship, then documented alternative relationship, with factors summing to one and sensitivity disclosed where an alternative relationship is used."
    source_ids:
      - us-epa-lca-2006
  - rule_id: validate_wastewater_boundary
    applies_to: "Wastewater"
    rule: "Wastewater sent to treatment must remain a waste flow; only monitored releases after the included final treatment boundary may be elementary flows, calculated from matched flow and concentration."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_data_quality
    applies_to: "Dataset evidence"
    rule: "Required collection protocols, calibration or verification evidence, temporal and site coverage, gap disclosure, quality indicators, formulas, factors, and source links must be present and reproducible."
    source_ids:
      - us-epa-lca-2006
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package for finished soy milk, publishable as a unit-process dataset or aggregated production dataset after review"
  downstream_use: "Supports secondary_dataset and background_dataset use in product systems requiring CPC 24423 soy milk at the plant gate, and supports downstream process and lifecyclemodel projections"
  allowed_use: "Attributional LCI and LCA modelling for soy-milk supply where product subtype, formulation, treatment, packaging, geography, period, boundary, and allocation are compatible"
  excluded_use: "Food-safety or nutrition certification; unqualified comparison of soy milk with dairy or other plant beverages; fermented soy products, tofu or curd, soy ingredients, or non-soy plant milks; substitution or consequential claims without a separately justified model"
  required_metadata: "canonical PCR id; CPC 24423; Tiangong reference-flow UUID; all required qualifiers; site and geography; reporting period; technology and route; foreground boundary; included packaging levels; upstream dataset links; allocation method; co-product destinations; data-quality assessment; review status"
  required_quality_disclosure: "Primary versus calculated or secondary data; meter and calibration status; temporal, geographical, and technological representativeness; precision, completeness, consistency, and reproducibility; balance differences; proxy data; exclusions; allocation sensitivity; wastewater treatment boundary; unresolved UUIDs or data gaps"
  update_trigger: "Change in soy input form, recipe or Codex subtype; material change in protein or solids basis; new extraction, separation, homogenisation, heat-treatment, filling, packaging, sanitation, utility, or wastewater technology; changed co-product destination or allocation; changed site or geography; reporting period no longer representative; corrected flow identity or source rule"
