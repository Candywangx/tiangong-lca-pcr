  - id: roasting
    name: "Roasting, caramelisation, or smoking"
    inclusion: "conditional"
    inclusion_condition: "Included for roasted, crystal/caramel, coloured, or smoked malt"
    role: "Produces declared specialty colour and flavour"
    quantitative_reference: "1,000 kg net saleable malt"
  - id: finishing_dispatch
    name: "Cooling, deculming, blending, storage, packing, and dispatch"
    inclusion: "required"
    inclusion_condition: "All products; packaging cards apply only to actual dispatch configuration"
    role: "Produces released bulk or packaged malt"
    quantitative_reference: "1,000 kg net saleable malt"
  - id: sanitation_wastewater
