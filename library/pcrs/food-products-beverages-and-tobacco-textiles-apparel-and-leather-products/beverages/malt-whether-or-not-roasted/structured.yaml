allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "process_subdivision"
    rule: "Avoid allocation by sub-metering route-specific batches, utilities, roasting, packaging, wastewater, and emissions."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rootlets
    applies_to: "rootlets_and_screenings"
    rule: "Treat rootlets or screenings as co-products only when they leave for a documented beneficial use; first apply system expansion or a justified subdivision. If allocation remains, use a disclosed physical dry-mass relationship when it reflects causality; otherwise use economic allocation with period-matched prices and sensitivity analysis."
    source_ids:
      - eu-pef-method-2021
      - habschied-malting-byproducts-2020
  - rule_id: allocation_waste
    applies_to: "wastes_and_treatment"
    rule: "Do not allocate burdens to discarded dust, sludge, off-spec malt, or wastewater; assign collection and treatment burdens to malt production until the waste or recovery system boundary is reached."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "base_malt_production_finishing_dispatch"
      flow_role: "cereal inputs, intermediate malt, saleable malt"
      record_type: "weighbridge, batch and laboratory records"
      raw_fields: "species; variety; lot; wet mass; moisture; transfer/output mass; rejects"
      collection_method: "calibrated scales and malt-specific moisture test"
      unit: "kg; %"
      frequency: "each lot/batch"
      temporal_coverage: "representative 12 months or full campaign"
      site_scope: "all included lines"
      aggregation_rule: "moisture-correct only when dry-matter comparison is required; normalise to released malt"
      quality_evidence: "calibration, laboratory method, reconciliation"
    - protocol_id: cp_route_conditions
      process_id: "base_malt_production_roasting"
      flow_role: "steeping, germination, kilning, roasting"
      record_type: "control-system historian and batch sheet"
      raw_fields: "wet/dry periods; temperature; grain moisture; airflow; duration; kiln/roast profile; colour"
      collection_method: "direct sensors and batch records"
      unit: "h; °C; %; airflow unit"
      frequency: "continuous plus batch release"
      temporal_coverage: "every represented batch"
      site_scope: "each vessel/kiln/roaster"
      aggregation_rule: "retain profiles and mass-weight batches"
      quality_evidence: "sensor calibration, release record"
    - protocol_id: cp_water_records
      process_id: "all"
      flow_role: "steeping and sanitation water"
      record_type: "meter and batch ticket"
      raw_fields: "meter start/end; purpose; batch; reuse; discharge"
      collection_method: "calibrated sub-meter or batch measurement"
      unit: "kg or m3"
      frequency: "each batch/daily"
      temporal_coverage: "representative period"
      site_scope: "each use area"
      aggregation_rule: "sum by purpose; do not net reused water without both transfers"
      quality_evidence: "meter calibration and water-quality record"
    - protocol_id: cp_energy_records
      process_id: "all"
      flow_role: "electricity, steam, purchased heat"
      record_type: "utility meters and invoices"
      raw_fields: "carrier; meter; quantity; unit; pressure/temperature for steam/heat"
      collection_method: "calibrated meter and invoice reconciliation"
      unit: "kWh or MJ"
      frequency: "continuous/monthly"
      temporal_coverage: "representative period"
      site_scope: "all included equipment"
      aggregation_rule: "allocate shared use by defensible operating driver"
      quality_evidence: "meter checks and invoice reconciliation"
    - protocol_id: cp_fuel_records
      process_id: "base_malt_production_roasting"
      flow_role: "each fuel"
      record_type: "meter, tank and invoice"
      raw_fields: "fuel identity; quantity; density; heating-value basis; batch/period"
      collection_method: "calibrated meter or stock balance"
      unit: "kg, m3, MJ"
      frequency: "daily/monthly"
      temporal_coverage: "representative period"
      site_scope: "each combustion unit"
      aggregation_rule: "convert each fuel separately to MJ"
      quality_evidence: "invoice, stock and heating-value evidence"
    - protocol_id: cp_refrigerant_records
      process_id: "base_malt_production"
      flow_role: "each refrigerant"
      record_type: "equipment and service log"
      raw_fields: "chemical; charge; additions; recovery; disposal; leak event"
      collection_method: "annual stock reconciliation"
      unit: "kg"
      frequency: "each service event/annual"
      temporal_coverage: "representative period"
      site_scope: "each circuit"
      aggregation_rule: "loss = additions + opening stock - recovered - closing stock"
      quality_evidence: "signed service logs"
    - protocol_id: cp_roasting_batch_records
      process_id: "roasting"
      flow_role: "roasted-route materials and output"
      record_type: "batch and laboratory record"
      raw_fields: "input state/mass/moisture; time-temperature profile; output mass/moisture/colour"
      collection_method: "scales, historian and EBC/declared tests"
      unit: "kg; %; °C; h; colour unit"
      frequency: "each batch"
      temporal_coverage: "all represented roast batches"
      site_scope: "each roaster and specialty-malt line"
      aggregation_rule: "mass-weight by saleable output"
      quality_evidence: "test method and batch release"
    - protocol_id: cp_packaging_records
      process_id: "finishing_dispatch"
      flow_role: "each packaging component"
      record_type: "bill of materials and issue record"
      raw_fields: "component; material; unit mass; count; reuse/loss"
      collection_method: "supplier mass plus line count"
      unit: "kg"
      frequency: "each SKU/batch"
      temporal_coverage: "representative period"
      site_scope: "all dispatch forms"
      aggregation_rule: "component mass × net count, with reuse separately modelled"
      quality_evidence: "supplier specification and count reconciliation"
    - protocol_id: cp_chemical_records
      process_id: "sanitation_wastewater"
      flow_role: "each cleaner/disinfectant"
      record_type: "issue, concentration and sanitation log"
      raw_fields: "product; active ingredient; concentration; issued mass; returned mass; use"
      collection_method: "inventory reconciliation"
      unit: "kg active substance"
      frequency: "each sanitation event"
      temporal_coverage: "representative period"
      site_scope: "all included systems"
      aggregation_rule: "active mass = net formulation mass × active fraction"
      quality_evidence: "SDS/specification and issue log"
    - protocol_id: cp_residue_records
      process_id: "all"
      flow_role: "each co-product and waste"
      record_type: "scales and transfer notes"
      raw_fields: "residue identity; wet/dry mass; moisture; destination; revenue/status"
      collection_method: "calibrated scale and destination record"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "representative period"
      site_scope: "all included lines"
      aggregation_rule: "aggregate separately by identity and destination"
      quality_evidence: "weigh ticket and receiver evidence"
    - protocol_id: cp_wastewater_records
      process_id: "base_malt_production_sanitation_wastewater"
      flow_role: "wastewater and each pollutant"
      record_type: "flow meter and matched sample"
      raw_fields: "volume; COD; TN; TP; TSS; sampling time; destination"
      collection_method: "continuous flow plus representative composite sample"
      unit: "m3; mg/L; kg"
      frequency: "continuous and permit/sample frequency"
      temporal_coverage: "representative period"
      site_scope: "each outfall"
      aggregation_rule: "load = matched volume × concentration"
      quality_evidence: "laboratory accreditation and flow calibration"
    - protocol_id: cp_air_emissions
      process_id: "base_malt_production_roasting_finishing_dispatch"
      flow_role: "each direct air emission"
      record_type: "stack test, CEMS, dust capture and fuel record"
      raw_fields: "source; operating time; flow; concentration; fuel; control efficiency"
      collection_method: "direct measurement preferred; approved factor otherwise"
      unit: "kg"
      frequency: "permit frequency and each represented fuel/route"
      temporal_coverage: "representative period"
      site_scope: "each source"
      aggregation_rule: "calculate each pollutant separately"
      quality_evidence: "test report, factor reference and operating log"
  calculation_rules:
    - id: calc_normalise
      applies_to: "all exchanges"
      rule: "exchange per reference flow = period exchange × 1,000 / released net malt mass"
      inputs:
        - "period exchange"
        - "released malt mass"
      output: "exchange per 1,000 kg malt"
      source_ids:
        - mass-balance-identity
    - id: calc_dry_matter
      applies_to: "grain and malt"
      rule: "dry matter = as-received mass × (1 - moisture fraction)"
      inputs:
        - mass
        - moisture
      output: "kg dry matter"
      source_ids:
        - mass-balance-identity
        - ebc-analytica-malt
    - id: calc_refrigerant_loss
      applies_to: "each refrigerant"
      rule: "loss = opening stock + additions - recovered - closing stock"
      inputs:
        - "stock and service records"
      output: "kg chemical released"
      source_ids:
        - mass-balance-identity
    - id: calc_water_pollutant
      applies_to: "each water pollutant"
      rule: "load = matched discharge volume × concentration with unit conversion"
      inputs:
        - m3
        - "mg/L"
      output: "kg pollutant"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_combustion
      applies_to: "each fuel and pollutant"
      rule: "emission = measured fuel activity × pollutant-specific approved factor when direct measurement is unavailable"
      inputs:
        - "fuel activity"
        - factor
      output: "kg pollutant"
      source_ids:
        - eu-jrc-fdm-bref-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Preserve cereal species/variety, crop year, malt style, thermal route, moisture, colour, and dispatch form; do not average ordinary and roasted routes without disclosed production weighting."
      evidence: "batch release and product specification"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Reconcile grain, water, dry matter, saleable malt, rootlets, screenings, dust, wastewater, sludge, and other losses; keep every utility, fuel, refrigerant, chemical, packaging material, waste, and emission atomic."
      evidence: "signed balances and exception log"
    - id: dq_temporal
      applies_to: "all data"
      requirement: "Use a representative 12-month period or complete campaign and explain shutdowns, abnormal batches, and product-mix changes."
      evidence: "dated meters, invoices and batch records"
    - id: dq_hygiene
      applies_to: "product-contact operations"
      requirement: "Retain water suitability, sanitation verification, pest control, hazard analysis, corrective action, and release evidence."
      evidence: "GHP/HACCP records"
    - id: dq_method
      applies_to: "malt quality"
      requirement: "Declare the method used for moisture, colour, extract, modification/friability, and other claimed attributes."
      evidence: "EBC, MEBAK, or equivalent validated method record"
validation_rules:
  - rule_id: validate_identity
    applies_to: "dataset_metadata"
    rule: "Reject a package that does not identify cereal species, malt style, ordinary-kilned versus roasted/crystal/smoked route, finished moisture, and bulk or packaging form."
    source_ids:
      - unsd-cpc-v3-2025
      - ebc-analytica-malt
  - rule_id: validate_steeping_context
    applies_to: "steeping_and_germination"
    rule: "Require actual wet/dry periods, temperatures, moisture and duration. Use 12-16 °C, one to two days, and 42-45 % grain moisture only as jointly supported review context, not as a replacement for site records or a universal conformance limit."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - evans-malting-efficiency-2024
  - rule_id: validate_kilning_context
    applies_to: "ordinary_kilned_malt"
    rule: "Require the actual staged drying profile. Use 50-85 °C as jointly supported context for pale ordinary malt; higher-temperature styles require their declared product-specific profile."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - evans-malting-efficiency-2024
  - rule_id: validate_roasting_context
    applies_to: "roasted_or_crystal_malt"
    rule: "Require input state, saccharification stand when applicable, and complete time-temperature-moisture profile. Use 130-230 °C only as jointly supported context for roasted-malt production; product release follows the declared specification."
    source_ids:
      - eu-jrc-fdm-bref-2019
      - prado-specialty-malts-2021
  - rule_id: validate_atomic_inventory
    applies_to: "process_inventory"
    rule: "Fail any combined energy-carrier, multi-fuel, multi-refrigerant, multi-chemical, packaging-collection, waste-collection, or emission-collection row."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_mass_balance
    applies_to: "foreground_inventory"
    rule: "Require an explained wet- and dry-matter balance linking cereal inputs to saleable malt, rootlets, screenings, dust, wastewater, and other losses."
    source_ids:
      - mass-balance-identity
      - evans-malting-efficiency-2024
  - rule_id: validate_range_evidence
    applies_to: "quantitative_ranges"
    rule: "Reject an empirical inventory range supported by only one paper, plant, batch, or point; require at least two independent boundary-compatible full-text sources or an explicit authoritative conformance interval."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "Factory-gate foreground dataset for 1,000 kg net dry cereal malt, ordinary or roasted as declared"
  downstream_use: "secondary_dataset; background_dataset; input to brewing, distilling, malt-food, and other life-cycle models matching the declared malt identity"
  allowed_use: "Product- and route-matched studies with compatible cereal species, malt style, geography, technology, period, moisture, colour, and packaging form"
  excluded_use: "Substitution for unmalted roasted grain, malt extract/syrup/flour, beer, spirits, generic food, or an undisclosed average of materially different ordinary and roasted routes"
  required_metadata: "PCR id; cereal and crop identity; malt style; process route and condition profiles; reference moisture/colour/specification; geography; technology; period; bulk/packaging form; allocation; upstream links; co-product/waste destinations"
  required_quality_disclosure: "Data coverage and representativeness; metering; laboratory methods; mass-balance closure; route weighting; unresolved UUIDs and ranges; allocation sensitivity; wastewater and air-emission methods"
  update_trigger: "Change in cereal mix, malt style, kiln/roaster, fuel or refrigeration system, energy source, water reuse, sanitation chemistry, packaging, allocation, emission control, product specification, geography, or representative period"
