measurement_rules:
  - id: reference_mass
    applies_to: "Reference malt and mass-normalised exchanges"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalise to 1,000 kg net released malt; exclude packaging and keep input grain, intermediate green malt, rootlets, screenings, dust, and losses on separately measured as-received and dry-matter bases."
  - id: malt_moisture_basis
    applies_to: "Grain and malt mass balance"
    required_property_ref:
      name: "Mass and moisture fraction"
      uuid: ""
    required_unit: "kg and %"
    rule: "Retain as-received mass and measured moisture for incoming grain, green malt, kilned/roasted malt, and saleable output; use the malt-specific moisture method declared by the producer."
  - id: water_separation
    applies_to: "Steeping, germination spray, cleaning, and utility water"
    required_property_ref:
      name: "Mass or volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Meter each use separately; preserve raw volume and density assumptions when converted to mass."
  - id: energy_separation
    applies_to: "Electricity, steam, purchased heat, and fuels"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Keep electricity, steam, purchased heat, natural gas, gas oil, and fuel oil as separate exchanges; retain lower- or higher-heating-value basis and conversion factors."
  - id: refrigerant_mass
    applies_to: "Each refrigerant charge and loss"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record each refrigerant separately by chemical identity; calculate atmospheric loss from stock reconciliation and service records."
  - id: packaging_mass
    applies_to: "Each packaging component"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record paper, polyethylene, polypropylene, corrugated board, stretch film, and wood pallets as separate placed-on-market masses."
  - id: wastewater_load
    applies_to: "Each direct water emission"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Calculate COD, total nitrogen, total phosphorus, and total suspended solids separately from matched discharge volume and concentration records."
