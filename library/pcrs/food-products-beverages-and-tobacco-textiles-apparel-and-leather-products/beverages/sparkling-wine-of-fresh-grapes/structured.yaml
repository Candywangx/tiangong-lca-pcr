measurement_rules:
  - id: reference_mass
    applies_to: "Reference product and mass-normalised exchanges"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report exactly 1,000 kg net sparkling-wine liquid, excluding packaging, and normalise every exchange to that mass."
  - id: liquid_volume_to_mass
    applies_to: "Wine, must, water, and liquid additives measured by volume"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain raw volume, liquid temperature, batch-specific density, instrument identity, and the multiplication used to convert volume to mass; do not assume that one litre equals one kilogram."
  - id: alcohol_strength
    applies_to: "Finished reference product"
    required_property_ref:
      name: "Volume fraction"
      uuid: ""
    required_unit: "% vol at 20 degrees C"
    rule: "Report measured actual alcoholic strength and the applicable total-alcohol specification; identify the analytical method and sampling lot."
  - id: residual_sugar
    applies_to: "Finished reference product and dosage control"
    required_property_ref:
      name: "Mass concentration"
      uuid: ""
    required_unit: "g/L"
    rule: "Report measured residual sugar and declared sugar class on the same analytical basis; preserve dosage additions separately from the finished-product test."
  - id: sparkling_pressure
    applies_to: "Finished reference product"
    required_property_ref:
      name: "Pressure"
      uuid: ""
    required_unit: "bar gauge at 20 degrees C"
    rule: "Measure or verify excess pressure at 20 degrees C in the final closed container and retain temperature correction and test records."
  - id: bottle_and_fill_conversion
    applies_to: "Bottle count and filled-package records"
    required_property_ref:
      name: "Mass and count"
      uuid: ""
    required_unit: "kg and item"
    rule: "Record bottle type, empty bottle mass, nominal and actual fill volume, filled count, rejects, and net liquid density; calculate liquid mass and each packaging-component mass separately."
  - id: energy_and_fuel_separation
    applies_to: "Electricity, purchased steam, and onsite fuels"
    required_property_ref:
      name: "Energy or fuel mass/volume"
      uuid: ""
    required_unit: "kWh, MJ, kg, or m3"
    rule: "Keep purchased electricity, purchased steam, natural gas, LPG, diesel, and every other actual fuel as separate exchanges; retain lower or higher heating-value basis and conversion factors."
  - id: wastewater_load
    applies_to: "Direct water-emission indicators"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Calculate each pollutant load separately from matched discharge volume and concentration; never aggregate COD, BOD5, suspended solids, nitrogen, or phosphorus into one emission flow."
