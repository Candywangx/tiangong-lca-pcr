allocation_rules:
  - rule_id: allocation_avoid_subdivide
    applies_to: "Shared winery operations"
    rule: "First subdivide metered processes, route batches, storage periods, cleaning cycles, packaging runs, and wastewater loads so that physical records are assigned directly to the sparkling-wine product."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_recycled_internal
    applies_to: "Wine, lees, dosage material, cleaning solution, and water reused inside the foreground system"
    rule: "Model internal reuse as an internal transfer without a second upstream burden; inventory any additional treatment, energy, losses, and discharge."
    source_ids:
      - eu-fdm-bat-2019
      - eu-pef-2021
  - rule_id: allocation_residue_co_product
    applies_to: "Grape pomace, wine lees, and other exported material with economic value"
    rule: "Classify the output from documented destination and market evidence; if subdivision is impossible and allocation remains necessary, apply the governing study method consistently and disclose physical and economic sensitivity."
    source_ids:
      - luke-sparkling-carbon-footprint-2021
      - eu-pef-2021
  - rule_id: allocation_packaging_reuse
    applies_to: "Refillable bottles, crates, pallets, or pressure containers"
    rule: "Record first use, reuse cycles, losses, washing, and return transport separately and apply the governing study method; do not assume a reuse count without records."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_balance
      process_id: "base_wine_preparation_traditional_bottle_secondary_closed_tank_secondary_finishing_packaging"
      flow_role: "grape-derived inputs, intermediates, product, and losses"
      record_type: "Scale, tank, fill, and stock records"
      raw_fields: "lot_id; material_name; route; opening_stock; received_mass_or_volume; temperature; density; transfers; closing_stock; saleable_output; loss"
      collection_method: "Calibrated weighing or tank/fill volume converted with matched density"
      unit: "kg, L, degrees C, kg/L"
      frequency: "Every lot and transfer"
      temporal_coverage: "Complete declared campaign including maturation"
      site_scope: "All controlled winery areas and outsourced steps"
      aggregation_rule: "Reconcile by process and route before normalising to 1,000 kg product"
      quality_evidence: "Calibration, tank tables, batch sheets, fill reports, stock reconciliation"
    - protocol_id: cp_ingredient_records
      process_id: "all_production_processes"
      flow_role: "yeast, sugar, sulfiting material, clarifier, stabiliser, nutrient, carbon dioxide, and treatment chemical"
      record_type: "Batch recipe and issue record"
      raw_fields: "product_name; formulation; active_fraction; lot; quantity; unit; process; route; returned_quantity"
      collection_method: "Weighed issue and formulation calculation"
      unit: "kg or L"
      frequency: "Every addition"
      temporal_coverage: "Complete declared campaign"
      site_scope: "All included processes"
      aggregation_rule: "Sum active mass by atomic ingredient and route"
      quality_evidence: "Supplier specification, scale calibration, signed recipe"
    - protocol_id: cp_packaging_records
      process_id: "traditional_bottle_secondary_finishing_packaging"
      flow_role: "bottle, cap, closure, wire cage, label, carton, and film"
      record_type: "Packaging bill, count, and reject record"
      raw_fields: "component; material; supplier; unit_mass; issued_count; accepted_count; reject_count; refillability; bottle_pressure_rating"
      collection_method: "Count reconciliation multiplied by component-specific unit mass"
      unit: "item and kg"
      frequency: "Every packaging run"
      temporal_coverage: "Complete declared campaign"
      site_scope: "Onsite and contracted packaging"
      aggregation_rule: "Component mass = net used count multiplied by unit mass; no combined packaging row"
      quality_evidence: "Supplier declarations, pressure certificate, count and reject reconciliation"
    - protocol_id: cp_energy_records
      process_id: "closed_tank_secondary_finishing_packaging_cleaning_refrigeration_wastewater_treatment"
      flow_role: "electricity and purchased steam"
      record_type: "Meter, invoice, and runtime record"
      raw_fields: "meter_id; reading; time; process; route; steam_mass_or_energy; conversion_factor"
      collection_method: "Calibrated submeter preferred; defensible runtime allocation otherwise"
      unit: "kWh or MJ"
      frequency: "Continuous or per batch"
      temporal_coverage: "Complete campaign including cold storage and maturation"
      site_scope: "All included equipment"
      aggregation_rule: "Direct assignment first; documented physical driver for residual shared use"
      quality_evidence: "Meter calibration, invoices, runtime logs, allocation worksheet"
    - protocol_id: cp_fuel_records
      process_id: "cleaning_refrigeration"
      flow_role: "natural gas, LPG, diesel, and each other fuel"
      record_type: "Meter, delivery, stock, and equipment log"
      raw_fields: "fuel_identity; opening_stock; purchases; closing_stock; meter; heating_value; equipment; time"
      collection_method: "Inventory reconciliation and calibrated fuel metering"
      unit: "kg, m3, L, or MJ"
      frequency: "Delivery and campaign close"
      temporal_coverage: "Complete declared campaign"
      site_scope: "Onsite attributable combustion"
      aggregation_rule: "Calculate each fuel separately before any energy total"
      quality_evidence: "Invoices, tank dip, meter calibration, heating-value certificate"
    - protocol_id: cp_water_records
      process_id: "all_winery_processes"
      flow_role: "process and cleaning water"
      record_type: "Water-meter and cleaning-cycle record"
      raw_fields: "meter_id; start; end; process; cycle; reuse_source; destination"
      collection_method: "Submeter or validated cleaning-cycle estimate"
      unit: "m3"
      frequency: "Continuous or every cleaning cycle"
      temporal_coverage: "Complete declared campaign"
      site_scope: "All included processes"
      aggregation_rule: "Separate fresh, reused, process, and cleaning water by process"
      quality_evidence: "Meter calibration and cleaning logs"
    - protocol_id: cp_cleaning_agent_records
      process_id: "cleaning_refrigeration"
      flow_role: "each cleaning or disinfecting chemical"
      record_type: "Cleaning recipe and issue record"
      raw_fields: "chemical_identity; formulation; active_fraction; quantity; cycle; recovered_quantity; discharge_route"
      collection_method: "Weighed or metered addition and active-mass calculation"
      unit: "kg or L"
      frequency: "Every cleaning cycle"
      temporal_coverage: "Complete declared campaign"
      site_scope: "All included systems"
      aggregation_rule: "Sum active mass by single chemical; subtract documented recovered material only"
      quality_evidence: "Supplier safety/specification sheets and cleaning log"
    - protocol_id: cp_refrigerant_records
      process_id: "cleaning_refrigeration"
      flow_role: "each installed refrigerant and loss"
      record_type: "Equipment register, purchase, recovery, and service record"
      raw_fields: "equipment_id; refrigerant_identity; opening_charge; additions; recovered_mass; closing_charge; service_event; allocation_driver"
      collection_method: "Annual or campaign inventory balance by refrigerant"
      unit: "kg"
      frequency: "Every service event and campaign close"
      temporal_coverage: "Period covering the declared production campaign"
      site_scope: "All refrigeration equipment serving included processes"
      aggregation_rule: "Loss = opening + additions - recovered - closing; allocate with documented cooling-service driver"
      quality_evidence: "Certified technician record, purchase and recovery receipt, equipment register"
    - protocol_id: cp_residue_records
      process_id: "all_production_processes"
      flow_role: "stems, pomace, lees, glass rejects, sludge, and each other waste"
      record_type: "Container weight and destination record"
      raw_fields: "residue_identity; wet_mass; dry_matter; source_process; destination; market_status; treatment"
      collection_method: "Calibrated scale or weighed-container reconciliation"
      unit: "kg"
      frequency: "Every removal"
      temporal_coverage: "Complete declared campaign"
      site_scope: "All included processes and onsite treatment"
      aggregation_rule: "Sum each residue separately by destination"
      quality_evidence: "Scale calibration, waste manifest, sales or transfer record"
    - protocol_id: cp_wastewater_records
      process_id: "cleaning_refrigeration_wastewater_treatment"
      flow_role: "wastewater, treated water, and pollutant loads"
      record_type: "Flow meter and laboratory record"
      raw_fields: "source_process; flow; destination; sample_time; COD; BOD5; TSS; total_N; total_P; detection_limit"
      collection_method: "Flow-proportional sampling where practicable and accredited analysis"
      unit: "m3 and mg/L"
      frequency: "Continuous flow; representative sampling"
      temporal_coverage: "Complete declared campaign including cleaning peaks"
      site_scope: "Every controlled discharge and transfer point"
      aggregation_rule: "Match concentration to discharge volume; calculate each pollutant separately"
      quality_evidence: "Meter calibration, chain of custody, laboratory QA/QC"
    - protocol_id: cp_direct_emissions
      process_id: "all_production_processes"
      flow_role: "fermentation gas, ethanol, refrigerant loss, and fuel emissions"
      record_type: "Measurement, mass balance, or factor calculation"
      raw_fields: "substance; source; activity; retained_quantity; factor; factor_source; time; route"
      collection_method: "Direct measurement preferred; otherwise documented substance-specific calculation"
      unit: "kg"
      frequency: "Per batch or campaign"
      temporal_coverage: "Complete declared campaign"
      site_scope: "All included direct-emission sources"
      aggregation_rule: "Calculate each substance and source separately before summation"
      quality_evidence: "Instrument QA, mass balance, factor identity, calculation review"
  calculation_rules:
    - id: calc_liquid_mass
      applies_to: "Wine, must, water, and liquid additives recorded by volume"
      rule: "mass_kg = volume_L multiplied by density_kg_per_L at the matched temperature"
      inputs:
        - "Calibrated volume"
        - "measured temperature"
        - "batch-specific density"
      output: "Atomic liquid mass"
      source_ids:
        - reference-mass-identity
    - id: calc_reference_output
      applies_to: "Final filled packages"
      rule: "net_liquid_mass = sum accepted_fill_volume multiplied by matched finished-wine density; packaging mass is excluded"
      inputs:
        - "Accepted bottle count"
        - "actual fill volume"
        - density
        - temperature
        - rejects
      output: "Exactly 1,000 kg reference liquid after normalisation"
      source_ids:
        - reference-mass-identity
    - id: calc_packaging_mass
      applies_to: "Each packaging component"
      rule: "component_mass = net_used_count multiplied by component_unit_mass; film is weighed directly"
      inputs:
        - Issued
        - returned
        - rejected
        - "and accepted counts"
        - "unit mass"
      output: "Separate bottle, closure, cage, label, carton, and film masses"
      source_ids:
        - eu-pef-2021
    - id: calc_active_ingredient
      applies_to: "Sulfur dioxide, cleaning chemicals, and formulated aids"
      rule: "active_mass = formulation_mass multiplied by active_fraction"
      inputs:
        - "Formulation quantity and supplier concentration"
      output: "Atomic active-material mass"
      source_ids:
        - oiv-sparkling-code-2025
    - id: calc_fermentation_co2
      applies_to: "Primary and secondary fermentation"
      rule: "released_biogenic_CO2 = sugar-balance production minus dissolved product CO2 minus recovered CO2 minus measured contained losses"
      inputs:
        - "Sugar consumed"
        - "product CO2"
        - recovery
        - "batch losses"
      output: "Separate biogenic carbon-dioxide emission by process"
      source_ids:
        - oiv-sparkling-code-2025
    - id: calc_refrigerant_loss
      applies_to: "Each refrigerant"
      rule: "loss = opening_charge + additions - recovered_mass - closing_charge"
      inputs:
        - "Equipment inventory and service records"
      output: "Separate emission mass for ammonia, R-134a, R-404A, or another explicitly added atomic refrigerant row"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_combustion_emissions
      applies_to: "Each direct combustion emission"
      rule: "emission_mass = fuel_activity multiplied by documented fuel- and substance-specific factor"
      inputs:
        - "Each fuel amount"
        - "heating value"
        - "factor identity"
      output: "Separate fossil CO2, CH4, N2O, and NOx emissions"
      source_ids:
        - eu-pef-2021
    - id: calc_wastewater_load
      applies_to: "Each direct water-emission indicator"
      rule: "load_kg = discharge_volume_m3 multiplied by concentration_mg_per_L divided by 1,000"
      inputs:
        - "Matched discharge volume and concentration"
      output: "Separate COD, BOD5, TSS, total-N, and total-P loads"
      source_ids:
        - eu-fdm-bat-2019
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Retain actual alcohol, residual sugar, pressure at 20 degrees C, carbon-dioxide origin, route, grape basis, bottle type, closure, dosage, and maturation records for every represented product group."
      evidence: "Final-product certificate, laboratory report, pressure test, batch and packaging specification"
    - id: dq_route_completeness
      applies_to: "Process map"
      requirement: "Demonstrate one coherent route from entry material to finished package and include every performed conditional process without counting purchased base-wine production twice."
      evidence: "Route diagram, batch traveller, supplier dataset links, mass balance"
    - id: dq_atomic_inventory
      applies_to: "All exchanges"
      requirement: "Retain one identity, quantity, unit, source process, and destination per flow; add a separate atomic row if a site uses another fuel, refrigerant, additive, package component, waste, or emission."
      evidence: "General ledger, batch sheets, meter map, chemical and equipment registers"
    - id: dq_temporal
      applies_to: "Foreground records"
      requirement: "Cover one complete representative campaign including primary production when onsite, secondary fermentation, the full declared maturation or cold-storage period, packaging, cleaning, and wastewater treatment."
      evidence: "Dated meter exports, batch calendar, stock opening and closing records"
    - id: dq_measurement
      applies_to: "Mass, volume, energy, pressure, sugar, alcohol, water, and pollutants"
      requirement: "Use calibrated instruments or documented engineering estimates and retain temperature, density, conversion, detection limit, and uncertainty records."
      evidence: "Calibration certificates, laboratory QA/QC, conversion worksheet"
    - id: dq_completeness
      applies_to: "Material balance and emissions"
      requirement: "Reconcile grape-derived materials, product, wine loss, lees, pomace, packaging rejects, wastewater, sludge, fermentation carbon dioxide, refrigerants, and direct fuel emissions; explain all gaps."
      evidence: "Signed campaign balance and completeness review"
    - id: dq_range_evidence
      applies_to: "Important inventory amounts"
      requirement: "Treat site records as dataset values; do not author or enforce an empirical PCR range until at least two independent boundary-compatible original sources support synthesis."
      evidence: "Range evidence review linked to original full text"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require the singular product name, Mass UUID, mass unit-group UUID, kg unit, 1,000 kg net liquid amount, and all required alcohol, sugar, pressure, route, bottle, closure, density, and conversion qualifiers; the reference-product flow UUID may remain unresolved only while manifest review metadata records the gap."
    source_ids:
      - unsd-cpc-3-2025
      - eu-regulation-1308-2013
      - oiv-sparkling-definition-2025
  - rule_id: validate_product_eligibility
    applies_to: "Finished sparkling wine"
    rule: "Confirm fermentation origin of product carbon dioxide, applicable excess pressure at 20 degrees C, actual and total alcohol requirements, and residual-sugar declaration; reject aerated or semi-sparkling product substitution."
    source_ids:
      - eu-regulation-1308-2013
      - oiv-sparkling-definition-2025
  - rule_id: validate_route
    applies_to: "Process map"
    rule: "Require exactly one declared entry-material route and one declared sparkling route; for traditional bottle production require bottle fermentation and route finishing, and for closed-tank production require tank fermentation, clarification or stabilisation as performed, and isobaric bottling."
    source_ids:
      - oiv-sparkling-code-2025
      - andreola-charmat-energy-2025
  - rule_id: validate_atomic_inventory
    applies_to: "Inventory rows"
    rule: "Reject combined ingredient, chemical, utility, fuel, refrigerant, package, waste, wastewater, sludge, or emission labels; require every actual exchange to resolve to one physically or chemically specific flow."
    source_ids:
      - eu-fdm-bat-2019
      - eu-food-beverage-bemp-2017
  - rule_id: validate_mass_and_conversion
    applies_to: "Material balance"
    rule: "Reconcile opening stocks plus grape-derived inputs, ingredients, and packaging with saleable liquid, closing stocks, residues, wine losses, emissions, and rejects; verify every volume-to-mass and count-to-mass conversion."
    source_ids:
      - eu-pef-2021
      - luke-sparkling-carbon-footprint-2021
  - rule_id: validate_packaging
    applies_to: "Final package"
    rule: "Require bottle type and pressure rating, empty mass, nominal and actual fill, closure type, and separate bottle, cap, stopper, wire cage, label, carton, and film records when used; prohibit double counting the traditional fermentation bottle at final packaging."
    source_ids:
      - oiv-sparkling-code-2025
      - luke-sparkling-carbon-footprint-2021
  - rule_id: validate_wastewater_and_refrigerants
    applies_to: "Cleaning, refrigeration, and wastewater treatment"
    rule: "Require each refrigerant makeup and loss separately, source-process wastewater volumes, sludge destination, and separate COD, BOD5, TSS, total-N, and total-P discharge loads where monitored or required."
    source_ids:
      - eu-fdm-bat-2019
      - eu-food-beverage-bemp-2017
  - rule_id: validate_ranges
    applies_to: "Inventory amounts"
    rule: "Reject an authored empirical range based on one plant, one case, an abstract, or incompatible boundaries; until two independent compatible original sources are reviewed, require foreground values without a PCR range and retain the manifest unresolved-range record."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground production dataset for market-ready sparkling wine of fresh grapes in a declared pressure-resistant package at winery dispatch"
  downstream_use: "secondary_dataset; background_dataset after methodology review and publication"
  allowed_use: "Product and process LCA, environmental-footprint studies, supply-chain inventory, hotspot analysis, and scenario modelling consistent with the declared entry material, fermentation route, product specification, bottle system, campaign, geography, and boundary"
  excluded_use: "Aerated or semi-sparkling wine, still or aromatised wine, fruit wine, distilled products, undisclosed route substitution, or cradle-to-grave claims based only on this winery-gate dataset"
  required_metadata: "PCR id and version; entry material; grape variety or blend; vintage or campaign; actual alcohol; residual sugar and class; excess pressure at 20 degrees C; carbon-dioxide origin; traditional-bottle or closed-tank route; maturation duration; dosage; bottle material, colour, pressure rating, empty mass, volume and refillability; closure; net fill; density and temperature; geography; data period; refrigerants; wastewater route; residue destinations; allocation; upstream dataset identities"
  required_quality_disclosure: "Primary-versus-secondary data share; meter and laboratory coverage; measurement and conversion methods; calibration; temporal, geographical and technological representativeness; completeness; uncertainty; allocation sensitivity; missing UUIDs; missing range evidence; exclusions and outsourced steps"
  update_trigger: "Change in entry material, grape or wine source, product specification, fermentation or stabilisation route, maturation time, energy system, fuel, refrigerant, cleaning chemistry, bottle or closure system, wastewater treatment, residue destination, allocation method, applicable regulation, or a material data-quality finding"
