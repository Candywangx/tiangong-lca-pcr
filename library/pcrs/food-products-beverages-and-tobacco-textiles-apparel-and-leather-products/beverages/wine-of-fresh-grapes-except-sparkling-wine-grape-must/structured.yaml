allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Multi-output winery processes"
    rule: "Avoid allocation first by subdividing metered operations or expanding the system with separately modelled recovery processes where this is justified and consistently applied."
    source_ids:
      - oiv-ghg-2025
  - rule_id: allocation_physical
    applies_to: "Wine, grape must, pomace, lees, and other valuable co-products"
    rule: "Where subdivision is not possible and a physical causal relationship exists, allocate the remaining shared inputs and outputs using that documented physical relationship; do not allocate solely because a residue has mass."
    source_ids:
      - oiv-ghg-2025
  - rule_id: allocation_economic_fallback
    applies_to: "Joint valuable outputs without a defensible physical relationship"
    rule: "Use economic allocation only as a disclosed fallback based on contemporaneous values at the point where co-products leave the shared process; test sensitivity when the choice is material."
    source_ids:
      - oiv-ghg-2025
      - eu-pef-2021
  - rule_id: waste_no_credit
    applies_to: "Outputs managed as waste"
    rule: "Assign no avoided-product credit unless a documented consequential or substitution scenario is explicitly in scope; record transport and treatment in the selected waste route."
    source_ids:
      - oiv-viti-641-2020
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "all"
      flow_role: "Product and intermediate mass"
      record_type: "Scale, tank, density, and batch records"
      raw_fields: "batch_id; timestamp; gross_mass; tare_mass; volume; temperature; density; product_form; transfer_loss"
      collection_method: "Calibrated scale or calibrated volume converted with matched density"
      unit: "kg"
      frequency: "Each lot, transfer, and dispatch"
      temporal_coverage: "Complete declared campaign"
      site_scope: "All foreground winery operations"
      aggregation_rule: "Sum accepted or transferred mass by route; reconcile inputs, outputs, stocks, and documented losses before normalisation"
      quality_evidence: "Calibration certificates; tank charts; batch reconciliation; signed dispatch records"
    - protocol_id: cp_energy_records
      process_id: "all"
      flow_role: "Electricity, steam, and each fuel"
      record_type: "Meter, invoice, and equipment allocation records"
      raw_fields: "meter_id; timestamp; energy_quantity; unit; fuel_identity; heating_value_basis; process_assignment"
      collection_method: "Direct sub-metering preferred; otherwise documented engineering allocation from facility meters"
      unit: "kWh; MJ"
      frequency: "Continuous or invoice period"
      temporal_coverage: "At least one representative complete production campaign"
      site_scope: "Foreground winery and onsite treatment"
      aggregation_rule: "Aggregate each energy carrier separately and allocate shared meters using documented operating drivers"
      quality_evidence: "Meter calibration; invoices; allocation worksheet; completeness check"
    - protocol_id: cp_water_records
      process_id: "all"
      flow_role: "Process water"
      record_type: "Water meter and batch records"
      raw_fields: "meter_id; timestamp; volume; source; process_assignment; reuse_flag"
      collection_method: "Direct meter or validated batch estimate"
      unit: "m3"
      frequency: "Continuous or each cleaning event"
      temporal_coverage: "Complete declared campaign including peak vintage"
      site_scope: "Foreground winery"
      aggregation_rule: "Sum by process and water source; keep reused water separate from fresh intake"
      quality_evidence: "Meter calibration; cleaning logs; water balance"
    - protocol_id: cp_additive_records
      process_id: "all"
      flow_role: "Each additive, processing aid, yeast, nutrient, or inert gas"
      record_type: "Weighing, formulation, issue, and batch records"
      raw_fields: "material_identity; formulation; active_fraction; batch_id; issued_mass; returned_mass; gas_quantity"
      collection_method: "Weighed issue-and-return balance or calibrated dosing record"
      unit: "kg"
      frequency: "Each addition"
      temporal_coverage: "Complete declared campaign"
      site_scope: "Foreground winery"
      aggregation_rule: "Calculate active material where needed and aggregate by atomic material and product route"
      quality_evidence: "Supplier specification; scale calibration; batch sheet; stock reconciliation"
    - protocol_id: cp_refrigerant_records
      process_id: "alcoholic_fermentation"
      flow_role: "Each refrigerant and loss"
      record_type: "Refrigeration asset register and service records"
      raw_fields: "equipment_id; refrigerant_identity; opening_charge; added_mass; recovered_mass; closing_charge; service_date; process_assignment"
      collection_method: "Annual or campaign inventory balance for each refrigerant"
      unit: "kg"
      frequency: "Each service and annual/campaign close"
      temporal_coverage: "Period overlapping declared production"
      site_scope: "Refrigeration systems serving foreground processes"
      aggregation_rule: "Calculate losses separately by refrigerant and assign by documented service or cooling driver"
      quality_evidence: "Technician records; purchase receipts; equipment register; inventory reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "packaging_dispatch"
      flow_role: "Each packaging component"
      record_type: "Bill of materials, issue, count, unit-mass, and reject records"
      raw_fields: "component_identity; supplier; specification; unit_mass; issued_count; returned_count; reject_count; reuse_cycles"
      collection_method: "Count multiplied by verified unit mass, or direct mass issue balance"
      unit: "kg"
      frequency: "Each packaging run"
      temporal_coverage: "Complete declared campaign"
      site_scope: "Packaging operations under foreground control"
      aggregation_rule: "Aggregate each component separately; disclose reusable-pallet lifetime allocation"
      quality_evidence: "Supplier specification; sampled unit-mass check; line reconciliation"
    - protocol_id: cp_waste_records
      process_id: "all"
      flow_role: "Each solid or semisolid waste and by-product"
      record_type: "Container scale, collection, and destination records"
      raw_fields: "waste_identity; wet_mass; dry_matter; batch_id; destination; market_status; haulier"
      collection_method: "Calibrated scale or container count with verified net mass"
      unit: "kg"
      frequency: "Each removal"
      temporal_coverage: "Complete declared campaign"
      site_scope: "All foreground processes"
      aggregation_rule: "Aggregate each waste identity and destination separately; do not net sold co-products against inputs"
      quality_evidence: "Weigh tickets; manifests; dry-matter tests where relevant; destination evidence"
    - protocol_id: cp_wastewater_records
      process_id: "all"
      flow_role: "Each winery wastewater stream"
      record_type: "Flow meter, tank, sewer, and reuse records"
      raw_fields: "source_process; timestamp; volume; destination; sanitary_inclusion; product_loss"
      collection_method: "Metered flow or validated tank-volume balance"
      unit: "m3"
      frequency: "Continuous or each discharge batch"
      temporal_coverage: "Complete declared campaign including peak vintage"
      site_scope: "Winery wastewater under foreground control"
      aggregation_rule: "Sum by source process and destination; reconcile treatment influent and effluent"
      quality_evidence: "Meter calibration; sewer invoice; tank logs; water balance"
    - protocol_id: cp_wastewater_monitoring
      process_id: "wastewater_treatment"
      flow_role: "Each wastewater pollutant indicator"
      record_type: "Matched flow and laboratory sample records"
      raw_fields: "sample_id; start_time; end_time; discharge_volume; cod; bod5; tss; total_nitrogen; total_phosphorus; method; detection_limit"
      collection_method: "Representative composite sampling and accredited or documented laboratory analysis"
      unit: "kg; mg/L; m3"
      frequency: "Per permit and sufficient to represent vintage peaks"
      temporal_coverage: "Complete declared campaign"
      site_scope: "Direct discharge under foreground control"
      aggregation_rule: "Pair concentration with the same discharge interval; compute each pollutant load separately"
      quality_evidence: "Chain of custody; method; laboratory QA/QC; flow-meter calibration"
    - protocol_id: cp_direct_emission_records
      process_id: "all"
      flow_role: "Fermentation and combustion emissions"
      record_type: "Sugar balance, off-gas, fuel, and factor records"
      raw_fields: "batch_id; sugar_before; sugar_after; offgas_mass; fuel_quantity; factor_id; factor_value; factor_unit"
      collection_method: "Direct measurement where available, otherwise activity data multiplied by documented factor or stoichiometric relation"
      unit: "kg"
      frequency: "Each batch or fuel period"
      temporal_coverage: "Complete declared campaign"
      site_scope: "Direct foreground emission sources"
      aggregation_rule: "Calculate each emitted substance separately and normalise to reference mass"
      quality_evidence: "Analytical records; fuel invoices; factor provenance; calculation worksheet"
  calculation_rules:
    - id: calc_reference_normalisation
      applies_to: "Every inventory exchange"
      rule: "normalized_amount = campaign_amount / net_saleable_reference_product_mass × 1,000 kg"
      inputs:
        - "Campaign exchange amount"
        - "net saleable product mass"
      output: "Exchange per 1,000 kg reference product"
      source_ids:
        - oiv-ghg-2025
    - id: calc_volume_to_mass
      applies_to: "Wine and must volume records"
      rule: "mass = calibrated_volume × density measured or justified for the product and temperature"
      inputs:
        - Volume
        - temperature
        - density
      output: "Product mass"
      source_ids:
        - oiv-code-2025
    - id: calc_active_sulfur_dioxide
      applies_to: "Sulfiting additions"
      rule: "active_SO2_mass = formulation_mass × verified_SO2_mass_fraction"
      inputs:
        - "Formulation mass"
        - "supplier active fraction"
      output: "Sulfur dioxide mass"
      source_ids:
        - oiv-code-2025
    - id: calc_fermentation_co2
      applies_to: "Alcoholic fermentation"
      rule: "Use measured off-gas where reliable; otherwise CO2_mass = fermentable_hexose_equivalent_consumed × 88/180, with incomplete conversion and retained dissolved carbon disclosed"
      inputs:
        - "Sugar before and after fermentation"
        - "batch mass"
        - "off-gas or retention records"
      output: "Biogenic carbon dioxide to air"
      source_ids:
        - oiv-code-2025
        - lbnl-best-winery-2005
    - id: calc_refrigerant_loss
      applies_to: "Each refrigeration circuit"
      rule: "loss = opening_charge + additions - recovered_mass - closing_charge; report each refrigerant separately"
      inputs:
        - "Asset-level refrigerant inventory"
      output: "Refrigerant emission to air"
      source_ids:
        - oiv-ghg-2025
    - id: calc_combustion_emissions
      applies_to: "Each direct combustion emission"
      rule: "emission_mass = fuel_activity × documented substance-specific emission_factor"
      inputs:
        - "Fuel quantity"
        - "heating-value basis"
        - "factor identity"
      output: "Separate CO2, CH4, N2O, and NOx emissions"
      source_ids:
        - oiv-ghg-2025
    - id: calc_wastewater_load
      applies_to: "Each direct water-emission indicator"
      rule: "load_kg = matched_discharge_volume_m3 × concentration_mg_per_L / 1,000"
      inputs:
        - "Discharge volume"
        - "matched concentration"
      output: "Separate COD, BOD5, TSS, total-N, or total-P load"
      source_ids:
        - oiv-viti-641-2020
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and every exchange"
      requirement: "Retain product form, route, material identity, waste destination, packaging specification, and refrigerant identity at atomic-flow level."
      evidence: "Batch sheets; supplier specifications; waste manifests; equipment register"
    - id: dq_temporal
      applies_to: "Foreground data"
      requirement: "Cover one complete representative production campaign including peak vintage operations, finishing, storage, packaging, and wastewater treatment attributable to the product; disclose deviations."
      evidence: "Dated meter exports; batch calendar; inventory opening and closing records"
    - id: dq_measurement
      applies_to: "Mass, volume, energy, water, and pollutant records"
      requirement: "Use calibrated instruments or documented engineering estimates; retain units, conversion factors, detection limits, and allocation drivers."
      evidence: "Calibration certificates; calculation worksheets; laboratory QA/QC"
    - id: dq_completeness
      applies_to: "All included processes"
      requirement: "Reconcile product mass, utilities, additives, packaging components, each waste, wastewater destinations, refrigerants, and direct emissions; explain missing or excluded flows."
      evidence: "Campaign balance and signed completeness checklist"
    - id: dq_representativeness
      applies_to: "Foreground and linked upstream data"
      requirement: "Characterise time, geography, technology, precision, completeness, consistency, reproducibility, source, and uncertainty; prioritise site-specific data for controlled processes."
      evidence: "Data-quality assessment and dataset metadata"
    - id: dq_uncertainty
      applies_to: "Material measured, calculated, or allocated values"
      requirement: "Document measurement variability, estimation uncertainty, and sensitivity to allocation or secondary-data choices; do not convert one case value into an empirical range."
      evidence: "Uncertainty register; sensitivity calculation; source comparison"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm UUID, Product flow type, Mass reference property, kg unit, product_form qualifier, and explicit non-sparkling status."
    source_ids:
      - eu-regulation-1308-2013
      - oiv-code-2025
  - rule_id: validate_route
    applies_to: "Process map"
    rule: "Require must preparation for every dataset; prohibit fermentation for unfermented grape must unless the declared preservation route includes partial fermentation; require fermentation for wine and disclose every conditional finishing and packaging process."
    source_ids:
      - oiv-code-2025
      - lbnl-best-winery-2005
  - rule_id: validate_atomic_inventory
    applies_to: "Inventory rows"
    rule: "Reject any row that combines electricity with steam or fuel, multiple fuels, multiple refrigerants, multiple chemicals, multiple packaging components, multiple wastes, wastewater indicators, or air emissions."
    source_ids:
      - oiv-ghg-2025
      - oiv-viti-641-2020
  - rule_id: validate_mass_balance
    applies_to: "Each process and campaign"
    rule: "Check opening stocks plus inputs against outputs, closing stocks, measured emissions, moisture changes, and documented losses; investigate material imbalance before publication."
    source_ids:
      - oiv-ghg-2025
  - rule_id: validate_wastewater
    applies_to: "Wastewater treatment and discharge"
    rule: "Require source-process volumes and destinations; when discharge is under foreground control, calculate COD, BOD5, TSS, total nitrogen, and total phosphorus separately where monitored or required."
    source_ids:
      - oiv-viti-641-2020
  - rule_id: validate_packaging
    applies_to: "Packaged product"
    rule: "Reconcile fill count and net product mass; require separate masses for every component actually used and disclose reusable-component allocation."
    source_ids:
      - ferrara-de-feo-2018
      - oiv-viti-641-2020
  - rule_id: validate_sources_and_quality
    applies_to: "Foreground package"
    rule: "Require source ids for externally constrained rules, site-specific records for controlled processes, documented secondary data where primary data are impracticable, and complete data-quality disclosure."
    source_ids:
      - oiv-ghg-2025
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground production dataset for grape must or non-sparkling wine at the winery dispatch gate"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product and process LCA, supply-chain inventory, environmental footprint studies, hotspot analysis, and scenario modelling consistent with the declared route, geography, vintage or campaign, product form, packaging, and boundary"
  excluded_use: "Sparkling, carbonated, aromatised, distilled, vinegar, grape-juice, or non-grape products; undisclosed substitution between grape must and wine; consumer claims that imply cradle-to-grave coverage from this gate-to-gate dataset alone"
  required_metadata: "PCR id and version; product form; grape variety or blend; vintage or campaign; actual alcohol content for wine; still-wine confirmation; geography; technology route; bulk or packaged state; package bill of materials; reference mass; data period; wastewater route; co-product and waste destinations; allocation method; upstream dataset identities"
  required_quality_disclosure: "Primary-versus-secondary data share; measurement and conversion methods; calibration and laboratory evidence; temporal, geographical and technological representativeness; completeness; uncertainty; allocation sensitivity; missing UUIDs or flows; exclusions"
  update_trigger: "Change in product form, grape source or variety mix, vintage representativeness, fermentation or stabilisation technology, energy system, refrigerant, packaging configuration, wastewater route, co-product treatment, allocation method, applicable regulation, or a material data-quality finding"
