system_boundary:
  rules:
    - rule_id: sb_category_scope
      applies_to: "Product identity"
      rule: "Include only residual milk-like plant beverages and exclude separately named coconut, almond, soy, rice, and oat milk."
      source_ids:
        - un-cpc-30-2025
    - rule_id: sb_foreground_operations
      applies_to: "Facility foreground boundary"
      rule: "Include every facility-controlled operation that occurs from receiving through release, including conditional soaking, grinding, extraction, filtration, enzyme treatment, fermentation, homogenisation, heat treatment, filling, cold storage, cleaning, utility generation, and on-site wastewater treatment."
      source_ids:
        - aydar-plant-milk-2020
        - tangyu-fermentation-2019
        - eu-jrc-fdm-bref-2019
    - rule_id: sb_resource_inventory
