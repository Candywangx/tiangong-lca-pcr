allocation_rules:
  - rule_id: al_avoid
    applies_to: "Multi-output operations"
    rule: "First avoid allocation by submetering, batch-specific records, and subdivision of extraction, formulation, packaging, utility, and treatment operations."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_filtered_solids
    applies_to: "Filtered plant solids"
    rule: "Classify wet filtered solids as a co-product only when they meet a documented specification and leave for an economic use. If they are discarded or paid for as treatment, keep them as waste and do not assign an avoided-product credit without a governed consequential scenario."
    source_ids:
      - eu-pef-2021-2279
      - aydar-plant-milk-2020
  - rule_id: al_physical_then_economic
    applies_to: "Unavoidable shared burdens"
    rule: "When subdivision is not possible, use a justified physical relationship such as measured mass, dry matter, energy, or processing time. Use economic allocation only when no defensible physical relationship exists, and disclose prices, period, currency, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_recycling
    applies_to: "Packaging and recovered residues"
    rule: "Report gross inputs and outputs before recycling credits. Apply the chosen study programme's recycling method consistently and do not combine it with an unreported avoided-burden credit."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials_recipe
      process_id: "receive_prepare_base_formulate"
      flow_role: "Plant bases and recipe ingredients"
      record_type: "receiving, inventory, batch and recipe records"
      raw_fields: "material identity; supplier; lot; received mass; issued mass; returns; moisture or active content; recipe; product output"
      collection_method: "reconcile purchase, stock, issue and batch records"
      unit: "kg, kg dry matter, or kg active substance"
      frequency: "each lot and batch"
      temporal_coverage: "representative production period"
      site_scope: "all represented lines"
      aggregation_rule: "sum net issued mass by atomic material and recipe; normalise to released product"
      quality_evidence: "invoices, lot records, calibrated scales, recipe approval, stock reconciliation"
    - protocol_id: cp_water_utilities
      process_id: "soak_base_grind_extract_formulate_heat_treat_cleaning_utilities"
      flow_role: "Water, steam, and purchased heat"
      record_type: "meters and operating logs"
      raw_fields: "meter opening/closing; flow; steam pressure; temperature; condensate; heat meter; downtime"
      collection_method: "read dedicated meters or apply documented engineering allocation"
      unit: "kg, m3, MJ"
      frequency: "batch or daily"
      temporal_coverage: "representative production period"
      site_scope: "all represented utilities"
      aggregation_rule: "subtract unrelated use and normalise by released product"
      quality_evidence: "meter calibration, allocation rationale, operating logs"
    - protocol_id: cp_process_energy
      process_id: "all_foreground_production_processes"
      flow_role: "Process electricity"
      record_type: "submeter and equipment records"
      raw_fields: "kWh; runtime; load; line; batch; product output"
      collection_method: "submeter directly or allocate from verified equipment runtime and load"
      unit: "kWh"
      frequency: "batch, shift, or daily"
      temporal_coverage: "representative production period"
      site_scope: "all represented lines"
      aggregation_rule: "sum by process and normalise by released product"
      quality_evidence: "calibrated meter or documented allocation model"
    - protocol_id: cp_enzyme_fermentation
      process_id: "enzyme_treat_ferment"
      flow_role: "Enzymes, cultures, controls, and fermentation gas"
      record_type: "issue records, batch sheets, control historian"
      raw_fields: "identity; species; strain; issued mass; activity; inoculum; time; temperature; pH; endpoint; reject; vent data"
      collection_method: "record each enzyme and culture separately and retain validated process controls"
      unit: "kg, activity unit, h, degrees C, pH, kg gas"
      frequency: "each batch"
      temporal_coverage: "all represented fermented batches"
      site_scope: "all fermentation equipment serving represented batches"
      aggregation_rule: "aggregate only identical route and product variants"
      quality_evidence: "supplier certificate, batch record, calibrated sensors, release decision"
    - protocol_id: cp_packaging
      process_id: "fill_package"
      flow_role: "Packaging inputs and rejects"
      record_type: "issue, count, component specification and waste records"
      raw_fields: "component identity; material; count; unit mass; issued mass; returns; rejects"
      collection_method: "count components and verify unit mass or reconcile issued mass"
      unit: "item and kg"
      frequency: "each packaging run"
      temporal_coverage: "representative production period"
      site_scope: "each packaging format"
      aggregation_rule: "calculate each component separately and normalise by net product mass"
      quality_evidence: "component specification, calibrated scale, line reconciliation"
    - protocol_id: cp_product_release
      process_id: "fill_package"
      flow_role: "Reference product and product loss"
      record_type: "batch, tank, filler and release records"
      raw_fields: "tank mass or volume; density; filled count; net fill; rejects; release status"
      collection_method: "reconcile treated product, packaged output, retained stock, and loss"
      unit: "kg"
      frequency: "each batch and filling run"
      temporal_coverage: "representative production period"
      site_scope: "all represented products"
      aggregation_rule: "include only conforming released mass in denominator"
      quality_evidence: "calibrated tank/filler records, density record, release certificate"
    - protocol_id: cp_residues_wastewater
      process_id: "all_production_processes"
      flow_role: "Residues, rejects, product loss, and wastewater"
      record_type: "waste tickets, container weights, meters and mass balance"
      raw_fields: "stream identity; wet mass; dry solids; volume; density; destination; treatment"
      collection_method: "measure each stream separately; prohibit mixed residual labels"
      unit: "kg, kg dry matter, or m3"
      frequency: "batch, shift, or shipment"
      temporal_coverage: "representative production period"
      site_scope: "all represented lines"
      aggregation_rule: "subtract tare; convert volume with measured density; normalise to released product"
      quality_evidence: "scale tickets, meter records, analytical certificate, destination evidence"
    - protocol_id: cp_cleaning
      process_id: "cleaning_utilities"
      flow_role: "Cleaning water and chemicals"
      record_type: "CIP historian, issue and concentration records"
      raw_fields: "cycle; circuit; water; chemical identity; solution mass; active concentration; temperature; time; conductivity; pH; reuse; discard"
      collection_method: "collect by chemical and cleaning circuit"
      unit: "kg, m3, degrees C, min, pH"
      frequency: "each cleaning cycle"
      temporal_coverage: "representative production period"
      site_scope: "all product-contact circuits"
      aggregation_rule: "allocate only when dedicated data are unavailable and disclose driver"
      quality_evidence: "calibrated sensors, chemical certificates, sanitation verification"
    - protocol_id: cp_fuels_emissions
      process_id: "cleaning_utilities"
      flow_role: "Each fuel and direct combustion emission"
      record_type: "fuel meters, invoices, composition and stack records"
      raw_fields: "carrier; quantity; heating value; carbon and sulfur content; stack concentration; flow; runtime"
      collection_method: "record each fuel separately; calculate each emission with disclosed factor when not measured"
      unit: "MJ and kg"
      frequency: "monthly or operating period"
      temporal_coverage: "representative production period"
      site_scope: "all on-site combustion sources"
      aggregation_rule: "allocate by metered useful service or documented operating driver"
      quality_evidence: "supplier certificate, calibrated meter, stack test, factor reference"
    - protocol_id: cp_refrigerants_storage
      process_id: "cold_store"
      flow_role: "Refrigeration electricity and each refrigerant"
      record_type: "electricity meters, charge, purchase, service and leak records"
      raw_fields: "kWh; refrigerant identity; charge; top-up; recovery; disposal; storage mass; duration"
      collection_method: "inventory balance by refrigerant and allocate electricity by mass-time or measured load"
      unit: "kWh, kg, kg-day"
      frequency: "monthly and each service event"
      temporal_coverage: "representative production period"
      site_scope: "all cold stores serving product"
      aggregation_rule: "calculate loss separately for R717, R744, and R134a"
      quality_evidence: "service log, purchase/recovery tickets, leak inspection, meter record"
    - protocol_id: cp_wastewater_treatment
      process_id: "treat_wastewater"
      flow_role: "Influent, effluent, sludge, methane, and nitrous oxide"
      record_type: "meters, laboratory results, sludge tickets and treatment logs"
      raw_fields: "flow; pH; temperature; COD or TOC; nitrogen; phosphorus; solids; sludge mass and dry solids; gas"
      collection_method: "monitor at relevant inlet, treatment, discharge, and sludge-removal points"
      unit: "kg, m3, mg/L, kg dry matter"
      frequency: "continuous flow plus sampling frequency justified by permit and variability"
      temporal_coverage: "representative production period"
      site_scope: "on-site treatment system"
      aggregation_rule: "calculate loads as flow times concentration; normalise to released product"
      quality_evidence: "calibrated meters, accredited tests, permit reports, sludge destination records"
  calculation_rules:
    - id: calc_reference_mass
      applies_to: "Reference product"
      rule: "released mass = sum(conforming filled units × verified net mass), cross-checked against tank mass and density"
      inputs:
        - "fill count"
        - "net mass"
        - "tank volume"
        - density
        - rejects
      output: "kg conforming packaged beverage"
      source_ids:
        - mass-balance-identity
    - id: calc_normalise
      applies_to: "All foreground exchanges"
      rule: "normalised exchange = period exchange ÷ conforming released product mass for the same period"
      inputs:
        - "atomic exchange quantity"
        - "released product mass"
      output: "exchange per kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_packaging_mass
      applies_to: "Each packaging component"
      rule: "component mass = issued component count × verified unit mass, or net issued mass where directly weighed"
      inputs:
        - count
        - "unit mass"
        - "issued mass"
        - returns
      output: "kg of one packaging component"
      source_ids:
        - mass-balance-identity
    - id: calc_water_load
      applies_to: "Wastewater analytes"
      rule: "pollutant load = wastewater volume × measured concentration with consistent units"
      inputs:
        - flow
        - concentration
      output: "kg pollutant per period and per kg product"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_fuel_emission
      applies_to: "Each direct combustion emission"
      rule: "emission = each fuel quantity × disclosed carrier-specific factor, unless representative stack measurement is available"
      inputs:
        - "fuel quantity"
        - "heating value"
        - "factor or stack data"
      output: "kg emission by substance"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_refrigerant_loss
      applies_to: "Each refrigerant"
      rule: "loss = opening charge + additions − recovered amount − closing charge, calculated separately by refrigerant"
      inputs:
        - "charge and service records"
      output: "kg refrigerant emitted or unaccounted"
      source_ids:
        - eu-jrc-fdm-bref-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and materials"
      requirement: "Declare the plant species, ingredient form, supplier, recipe, and product variant; do not substitute a separately classified milk flow or a generic protein drink."
      evidence: "approved specification, supplier record, recipe, classification check"
    - id: dq_route
      applies_to: "Process inventory"
      requirement: "Record actual inclusion or exclusion of every conditional route and preserve route-specific batches rather than averaging incompatible extraction, fermentation, preservation, or packaging systems."
      evidence: "process flow diagram, batch record, equipment list"
    - id: dq_temporal
      applies_to: "Foreground period"
      requirement: "Use a period representative of normal production and disclose start/end dates, production volume, shutdowns, trials, and abnormal losses."
      evidence: "production and maintenance calendar"
    - id: dq_completeness
      applies_to: "Mass, water, and energy"
      requirement: "Reconcile plant bases, product output, residues, wastewater, packaging, water, electricity, heat, and fuels; explain every material imbalance or unmetered allocation."
      evidence: "signed reconciliation and meter coverage map"
    - id: dq_food_safety
      applies_to: "Product release and cleaning"
      requirement: "Retain validated preservation limits, monitoring, corrective action, cleaning verification, allergen controls, and release decision for the declared product."
      evidence: "HACCP or equivalent plan, sanitation record, release certificate"
    - id: dq_sources
      applies_to: "Secondary data"
      requirement: "Record provider, geography, technology, time, system boundary, version, and substitutions for every linked dataset."
      evidence: "dataset provenance record"
validation_rules:
  - rule_id: val_reference
    applies_to: "Reference flow"
    rule: "Require exactly 1 kg of conforming packaged other non-animal milk and all required qualifiers; fail if the reference UUID is filled with a narrower product flow."
    source_ids:
      - un-cpc-30-2025
      - mass-balance-identity
  - rule_id: val_atomic
    applies_to: "Inventory"
    rule: "Require one atomic exchange per card and reject combined plant bases, ingredients, utilities, fuels, refrigerants, packaging, wastes, or emissions."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: val_route
    applies_to: "Conditional processes"
    rule: "Require explicit applicability and operating evidence for soaking, extraction, filtration, enzyme treatment, fermentation, homogenisation, thermal route, and refrigeration; do not infer absent or present routes from product name."
    source_ids:
      - aydar-plant-milk-2020
      - tangyu-fermentation-2019
  - rule_id: val_mass_balance
    applies_to: "Product and residuals"
    rule: "Reconcile received plant material and other mass inputs with conforming product, filtered solids, rejects, wastewater, sludge, and stock change for the same period."
    source_ids:
      - mass-balance-identity
      - eu-jrc-fdm-bref-2019
  - rule_id: val_hygiene_release
    applies_to: "Cleaning and heat treatment"
    rule: "Require validated limits, monitoring records, corrective actions, verification, and release disposition for product safety controls."
    source_ids:
      - fao-who-food-hygiene-2023
  - rule_id: val_no_unsupported_range
    applies_to: "Amount ranges"
    rule: "Reject an empirical range derived from one case, an abstract, or incompatible routes; require at least two independent, original, boundary-compatible sources or omit the range and retain the collection rule."
    source_ids:
      - mass-balance-identity
published_dataset_profile:
  dataset_role: "Foreground plant-gate production dataset that may be published as a secondary_dataset or background_dataset after review"
  downstream_use: "Product carbon footprint, life-cycle assessment, procurement, formulation or packaging scenarios, and lifecyclemodel construction for the declared plant beverage"
  allowed_use: "Use only for products matching the declared plant species, recipe, process route, geography, period, packaging, preservation, storage, and allocation assumptions"
  excluded_use: "Do not use as a generic proxy for coconut, almond, soy, rice, oat, animal milk, powder, infant formula, spoonable fermented food, or an undeclared plant-base route"
  required_metadata: "plant identity and origin; ingredient form and recipe; functional and reference flow qualifiers; process inclusion; fermentation and heat-treatment controls; packaging; storage; facility and period; allocation; upstream datasets; uncertainty and data gaps"
  required_quality_disclosure: "meter and record coverage; mass, water, and energy reconciliation; sampling and calculation methods; route-specific exclusions; co-product and waste classification; unresolved UUID and range evidence; food-safety release evidence"
  update_trigger: "Change in plant species, recipe, supplier form, extraction or fermentation route, enzyme, preservation regime, packaging, refrigeration system, fuel mix, facility, allocation, regulation, or representative production period"
