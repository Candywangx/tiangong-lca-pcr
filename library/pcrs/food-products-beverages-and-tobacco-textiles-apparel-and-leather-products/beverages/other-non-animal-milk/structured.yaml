      rule: "Maintain process-level inventories of water, energy, raw materials, wastewater, waste gas, residues, and packaging waste; separately identify direct emissions and treatment routes."
      source_ids:
        - eu-jrc-fdm-bref-2019
    - rule_id: sb_food_safety
      applies_to: "Hygiene and preservation"
      rule: "Include validated hygiene controls and the actual preservation route; record monitoring, corrective action, verification, and documentation relevant to product release."
      source_ids:
