allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Processes producing rice milk and another valuable output"
    rule: "Avoid allocation by separately metering or subdividing independently operated preparation, separation, utility, and packaging activities whenever technically feasible."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical_then_economic
    applies_to: "Marketable rice solids, syrup, or other co-products"
    rule: "Where subdivision is not feasible, use a documented physical causal relationship when it represents how inputs and energy generate the co-products; otherwise use economic allocation based on representative prices and disclose quantities, prices, period, and sensitivity."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_waste_and_recycling
    applies_to: "Residues, wastewater, packaging scrap, and recovered materials"
    rule: "Classify each output as co-product, recyclable material, or waste before assigning burdens. Include foreground collection and treatment burdens; apply avoided-burden or recycling credits only when the downstream model declares the method and prevents double counting."
    source_ids:
      - eu-pef-2021
