allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "separable_processes_and_products"
    rule: "Avoid allocation wherever possible by subdividing preparation, extraction, formulation, filling, utility, and treatment operations using directly measured batch, meter, runtime, or mass-balance records."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_physical
    applies_to: "unavoidable_shared_burdens"
    rule: "When subdivision is not feasible, allocate shared burdens using a causal physical relationship. For coconut extract and solid co-products, consider dry matter or another composition-linked basis before wet mass because added water can distort causality."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_other_relationship
    applies_to: "no_defensible_physical_relationship"
    rule: "When no defensible physical relationship exists, use economic or another documented relationship, state the data period and prices or parameters, and report a sensitivity comparison with a plausible physical basis."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_waste_and_co_product_status
    applies_to: "coconut_residues_and_recovered_outputs"
    rule: "Classify each residue as waste, internal recovery, or co-product according to its actual destination. Do not assign avoided-burden credit within the gate-to-gate inventory unless an explicit system-expansion model and displaced product are documented."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_coconut_receipts
      process_id: "material_preparation_extraction"
      flow_role: "coconut material and rejects"
      record_type: "receiving and weighment records"
      raw_fields: "date; supplier; origin; receipt state; accepted mass; reject mass; moisture or solids result when available"
      collection_method: "calibrated scale and receiving inspection"
      unit: "kg; mass fraction"
      frequency: "every lot"
      temporal_coverage: "representative continuous 12-month period or justified campaign"
      site_scope: "all supplying lots to the modelled line"
      aggregation_rule: "sum accepted and rejected mass separately; normalize to released product"
      quality_evidence: "scale calibration; supplier specification; inspection record; sampling method"
    - protocol_id: cp_water_records
      process_id: "material_preparation_extraction_formulation_homogenization"
      flow_role: "washing, extraction, and formulation water"
      record_type: "meter and batch records"
      raw_fields: "meter start/end; batch volume or mass; use purpose; density assumption; potable-water evidence"
      collection_method: "dedicated meter or verified batch vessel"
      unit: "kg or m3"
      frequency: "each batch or daily"
      temporal_coverage: "same period as product output"
      site_scope: "all relevant water points"
      aggregation_rule: "separate product-incorporated, process, cleaning, cooling, and utility water before normalization"
      quality_evidence: "meter calibration; potable-water test; reconciliation to site water balance"
    - protocol_id: cp_formulation_batches
      process_id: "formulation_homogenization"
      flow_role: "coconut base, water, and ingredients"
      record_type: "recipe, issue, and weighment records"
      raw_fields: "batch id; ingredient id; supplier lot; charged mass; returned mass; solids or fat specification"
      collection_method: "calibrated scales and controlled recipe system"
      unit: "kg; mass fraction"
      frequency: "every batch"
      temporal_coverage: "same period as product output"
      site_scope: "all declared formulations"
      aggregation_rule: "net charged mass by ingredient divided by released product"
      quality_evidence: "scale calibration; approved recipe; lot traceability; laboratory specification"
    - protocol_id: cp_process_yields
      process_id: "all_production_processes"
      flow_role: "intermediate transfers, product output, and loss"
      record_type: "batch mass-balance records"
      raw_fields: "input mass; transfer mass; released net product; hold-up; sampling; spill; reject; rework; inventory change"
      collection_method: "calibrated tanks or scales plus batch reconciliation"
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "same period as product output"
      site_scope: "all foreground production steps"
      aggregation_rule: "reconcile inputs, outputs, inventory changes, losses, and residues without double counting"
      quality_evidence: "calibration; batch release record; documented reconciliation tolerance"
    - protocol_id: cp_energy_records
      process_id: "all_production_processes"
      flow_role: "electricity and thermal energy"
      record_type: "utility meters, fuel invoices, and equipment runtime"
      raw_fields: "carrier; meter start/end; purchased amount; equipment power; runtime; production quantity; recovered energy"
      collection_method: "submeters preferred; otherwise documented engineering calculation"
      unit: "kWh; MJ; carrier unit"
      frequency: "batch, shift, or monthly"
      temporal_coverage: "representative 12-month period or justified campaign"
      site_scope: "all foreground equipment and shared utilities"
      aggregation_rule: "assign direct meters first; allocate shared use by causal runtime, throughput, or measured demand"
      quality_evidence: "meter calibration; invoice reconciliation; equipment specification; allocation rationale"
    - protocol_id: cp_packaging_records
      process_id: "preservation_filling_packaging"
      flow_role: "packaging inputs and rejects"
      record_type: "bill of materials, issue, count, and reject records"
      raw_fields: "component id; material; unit mass; issued count; returned count; rejected count; released units"
      collection_method: "verified item mass and inventory reconciliation"
      unit: "kg; item"
      frequency: "each batch or production order"
      temporal_coverage: "same period as product output"
      site_scope: "all primary and secondary packaging components"
      aggregation_rule: "net issued mass by component divided by released product"
      quality_evidence: "supplier specification; item-mass check; inventory reconciliation"
    - protocol_id: cp_residue_records
      process_id: "material_preparation_extraction"
      flow_role: "coconut residues and destinations"
      record_type: "weighbridge, bin, sales, and disposal records"
      raw_fields: "residue type; wet mass; moisture basis; destination; revenue or internal use when relevant"
      collection_method: "calibrated scale and destination documentation"
      unit: "kg"
      frequency: "each shipment or batch"
      temporal_coverage: "same period as product output"
      site_scope: "all foreground residues"
      aggregation_rule: "aggregate separately by residue state and destination"
      quality_evidence: "scale calibration; transfer note; moisture sampling; destination evidence"
    - protocol_id: cp_cleaning_records
      process_id: "sanitation_wastewater"
      flow_role: "cleaning water and chemicals"
      record_type: "clean-in-place and sanitation logs"
      raw_fields: "cycle id; equipment; water volume; chemical product; concentration; dose; start/end time; shared-line basis"
      collection_method: "automated cycle log or operator record with meter and dosing verification"
      unit: "kg; L; mass fraction"
      frequency: "every cleaning cycle"
      temporal_coverage: "same period as product output"
      site_scope: "all attributable production and shared sanitation cycles"
      aggregation_rule: "assign dedicated cycles directly; allocate shared cycles using documented equipment surface, runtime, or throughput basis"
      quality_evidence: "meter and dosing calibration; sanitation release record; approved procedure"
    - protocol_id: cp_wastewater_records
      process_id: "sanitation_wastewater"
      flow_role: "wastewater, sludge, and direct effluent"
      record_type: "discharge meters, laboratory reports, and treatment logs"
      raw_fields: "flow; destination; sampling time; pollutant concentration; sludge mass; moisture; treatment chemical and energy references"
      collection_method: "calibrated flow meter, representative sampling, and laboratory analysis"
      unit: "kg; m3; mg/L; kg pollutant"
      frequency: "continuous or each discharge; laboratory frequency per permit or control plan"
      temporal_coverage: "same period as product output"
      site_scope: "all attributable discharge points and on-site treatment"
      aggregation_rule: "calculate pollutant load as flow multiplied by concentration; avoid overlap between process rows and total discharge"
      quality_evidence: "meter calibration; chain of custody; laboratory method; permit report; mass-balance reconciliation"
    - protocol_id: cp_refrigerant_records
      process_id: "preservation_filling_packaging"
      flow_role: "refrigerant leakage"
      record_type: "purchase, charge, recovery, service, and equipment inventory records"
      raw_fields: "refrigerant identity; opening charge; added mass; recovered mass; closing charge; equipment scope"
      collection_method: "annual mass balance with service records"
      unit: "kg"
      frequency: "each service event and annual reconciliation"
      temporal_coverage: "representative 12-month period"
      site_scope: "all site-controlled equipment serving the product"
      aggregation_rule: "attributable leakage divided by released product using documented equipment service share"
      quality_evidence: "service certificates; cylinder records; equipment inventory; reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground inventory rows"
      rule: "normalized amount = attributable period amount / released net coconut milk mass for the same period"
      inputs:
        - "attributable amount"
        - "released net product mass"
      output: "amount per 1 kg net coconut milk"
      source_ids:
        - ghg-protocol-product-standard-2011
    - id: calc_batch_mass_balance
      applies_to: "each production batch"
      rule: "opening inventory + measured inputs = measured transfers + released product + residues + wastewater-carried product solids + other losses + closing inventory; report the unreconciled difference"
      inputs:
        - "batch masses"
        - "inventory changes"
        - "solids data where used"
      output: "reconciled batch yield and unexplained mass difference"
      source_ids: []
    - id: calc_metered_water_mass
      applies_to: "volume-metered water"
      rule: "water mass = measured volume multiplied by documented density; use 1 kg/L only when temperature and quality make that approximation acceptable"
      inputs:
        - "water volume"
        - "density assumption"
      output: "kg water"
      source_ids:
        - codex-cxc-1-1969
    - id: calc_energy_from_runtime
      applies_to: "unmetered equipment"
      rule: "energy = verified rated demand multiplied by loaded operating time and documented load factor; do not use nameplate power alone as measured consumption"
      inputs:
        - "equipment demand"
        - runtime
        - "load factor"
      output: "kWh or MJ by carrier"
      source_ids: []
    - id: calc_packaging_mass
      applies_to: "packaging components"
      rule: "component mass = net issued item count multiplied by verified unit mass, with bulk materials taken from net issued mass"
      inputs:
        - "issued count"
        - "returned count"
        - "reject count"
        - "unit mass"
      output: "kg packaging by component"
      source_ids: []
    - id: calc_pollutant_load
      applies_to: "direct treated-effluent emissions"
      rule: "pollutant load = representative discharge volume multiplied by matched concentration, with unit conversion and non-detect treatment disclosed"
      inputs:
        - "discharge volume"
        - concentration
        - "sampling coverage"
      output: "kg pollutant per reference flow"
      source_ids: []
    - id: calc_shared_allocation
      applies_to: "unavoidable shared processes"
      rule: "apply the selected causal physical factor consistently to all shared inputs and outputs; if no physical factor is defensible, apply and disclose the selected alternative and sensitivity"
      inputs:
        - "shared burden"
        - "product and co-product driver data"
      output: "allocated foreground amount"
      source_ids:
        - ghg-protocol-product-standard-2011
  data_quality_requirements:
    - id: dq_identity_and_traceability
      applies_to: "coconut material, ingredients, and product"
      requirement: "Preserve supplier or internal lot identity, receipt state, formulation, batch link, and product-release link."
      evidence: "receiving record; recipe; lot genealogy; release record"
    - id: dq_technological_representativeness
      applies_to: "all significant processes"
      requirement: "Data must represent the actual extraction, homogenization, preservation, filling, cooling, cleaning, and treatment technology used."
      evidence: "equipment list; process diagram; meter coverage; technology description; ghg-protocol-product-standard-2011"
    - id: dq_geographical_representativeness
      applies_to: "foreground and linked upstream datasets"
      requirement: "Declare manufacturing geography and select upstream electricity, water, coconut material, transport, and treatment datasets appropriate to the supplying geography."
      evidence: "site address; supplier origin; dataset metadata; ghg-protocol-product-standard-2011"
    - id: dq_temporal_representativeness
      applies_to: "activity data and factors"
      requirement: "Use a continuous 12-month period when practical; a shorter campaign must cover representative operating states and be justified. Record factor years and update mismatched data."
      evidence: "dated records; production calendar; factor metadata; ghg-protocol-product-standard-2011"
    - id: dq_completeness
      applies_to: "process and flow coverage"
      requirement: "Include all required foreground processes and reconcile coconut material, water, product, packaging, residues, wastewater, energy, and losses. Quantify or justify every exclusion."
      evidence: "process map; mass and water balances; utility reconciliation; exclusion register; ghg-protocol-product-standard-2011"
    - id: dq_reliability
      applies_to: "measurements and calculations"
      requirement: "Retain calibration, laboratory method, sampling, invoice reconciliation, calculation inputs, allocation logic, and review evidence sufficient to reproduce every reported amount."
      evidence: "calibration certificate; laboratory report; invoice; calculation workbook; reviewer sign-off; codex-cxc-1-1969; ghg-protocol-product-standard-2011"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_product"
    rule: "The reference output must use Coconut milk UUID 683e1059-d269-4198-a67d-f306a86bcf8d, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and 1 kg net product excluding packaging."
    source_ids: []
  - rule_id: validate_scope_identity
    applies_to: "product_category"
    rule: "The product description must identify a dilute coconut-endosperm emulsion intended as a beverage and must not represent cooking coconut milk or cream, coconut water, fermented product, or a non-coconut-dominant mixed beverage."
    source_ids:
      - un-cpc-v3-explanatory-notes-2025
  - rule_id: validate_starting_condition
    applies_to: "foreground_boundary"
    rule: "The dataset must declare whether whole coconuts, kernel, extract, or another coconut base enters the foreground boundary and must link upstream datasets for all preceding operations."
    source_ids:
      - fao-coconut-postharvest-1999
      - ghg-protocol-product-standard-2011
  - rule_id: validate_qualifiers
    applies_to: "reference_flow_metadata"
    rule: "Every required qualifier in section 3 must be present and consistent with the formulation, process route, packaging, and market state."
    source_ids: []
  - rule_id: validate_process_and_mass_balance
    applies_to: "foreground_inventory"
    rule: "Required process sections, intermediate transfers, released product, residues, wastewater, and losses must reconcile within the site's documented tolerance; unexplained differences must be disclosed and investigated."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: validate_water_and_hygiene_records
    applies_to: "food_contact_and_preservation"
    rule: "Product-contact water quality, preservation time and temperature or validated alternative parameters, packaging release, and processing records must be retained for the represented production period."
    source_ids:
      - codex-cxc-1-1969
  - rule_id: validate_allocation
    applies_to: "shared_processes_and_co_products"
    rule: "Allocation must follow the section 7 hierarchy, use consistent factors for similar flows, and disclose co-product status, factor data, and sensitivity when an alternative relationship is used."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: validate_provisional_ranges
    applies_to: "reasoned_estimate_ranges"
    rule: "Provisional ranges are screening aids only; values outside them require review, while values inside them still require foreground evidence. Publication review must replace or explicitly accept every material reasoned estimate."
    source_ids: []
  - rule_id: validate_data_quality
    applies_to: "published_foreground_dataset"
    rule: "The data package must report technological, geographical, temporal, completeness, and reliability evidence for significant processes and identify improvement actions for material gaps."
    source_ids:
      - ghg-protocol-product-standard-2011
published_dataset_profile:
  dataset_role: "Site-specific foreground production dataset for packaged coconut milk at the manufacturing-site gate"
  downstream_use: "secondary_dataset; background_dataset after methodology and data-quality review"
  allowed_use: "Product-footprint and life-cycle models whose coconut milk scope, receipt state, formulation, preservation route, packaging, geography, and period are compatible with the dataset"
  excluded_use: "Direct representation of cooking coconut milk or coconut cream, coconut water, cultivation, retail, consumer use, or another site or formulation without representativeness review"
  required_metadata: "canonical PCR id; product-flow UUID; coconut receipt state and origin; formulation and solids or fat specification; preservation route; package components; geography; data period; site coverage; allocation method; upstream dataset references"
  required_quality_disclosure: "meter and scale coverage; mass and water balance; sample and laboratory methods; temporal coverage; exclusions; allocation factors; co-product and waste destinations; provisional estimates; technological, geographical, temporal, completeness, and reliability assessment"
  update_trigger: "Change in coconut receipt state, formulation, preservation or filling technology, package system, energy supply, co-product use, wastewater route, allocation method, site scope, or a material shift in yield, energy, water, loss, or data-quality evidence"
data_sources:
  - id: "un-cpc-v3-explanatory-notes-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, *Central Product Classification (CPC) Version 3.0 Explanatory Notes*, 30 June 2025, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-11)"
    used_for: "Classification context and reviewed inclusion/exclusion boundary for CPC 24421"
  - id: "fao-coconut-postharvest-1999"
    type: "handbook"
    reference: "P. G. Punchihewa and R. N. Arancon, *Coconut: Post-harvest Operations*, Asian and Pacific Coconut Community; edited by AGSI/FAO, last reviewed 14 October 1999, https://www.fao.org/fileadmin/user_upload/inpho/docs/Post_Harvest_Compendium_-_Coconut.pdf (retrieved 2026-08-11)"
    used_for: "Coconut receipt-state disclosure and process decomposition for selection, dehusking, kernel preparation, grating, aqueous extraction, pressing, and filtration"
  - id: "codex-cxc-1-1969"
    type: "standard"
    reference: "Codex Alimentarius, *General Principles of Food Hygiene*, CXC 1-1969, https://www.fao.org/input/download/standards/23/CXP_001e.pdf (retrieved 2026-08-11)"
    used_for: "Potable water, raw-material acceptance, time-temperature control, packaging protection, sanitation, documentation, and record retention"
  - id: "ghg-protocol-product-standard-2011"
