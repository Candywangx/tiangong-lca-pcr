  - id: preservation_filling_packaging
    name: "Preservation treatment, filling, cooling, and packaging"
    inclusion: "required"
    inclusion_condition: "Always included; actual heat, aseptic, or validated alternative route must be declared"
    role: "Produce released packaged coconut milk in its declared market state"
    quantitative_reference: "1 kg net coconut milk at plant gate"
  - id: sanitation_wastewater
    name: "Cleaning, sanitation, and on-site wastewater handling"
