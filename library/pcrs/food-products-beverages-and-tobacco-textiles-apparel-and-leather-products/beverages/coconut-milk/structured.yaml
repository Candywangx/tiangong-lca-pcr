  - id: coconut_material_mass
    applies_to: "Coconut fruit, kernel, extract, and base inputs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record each coconut input at its declared receipt state and moisture or solids basis; do not combine whole-fruit mass, kernel mass, and concentrated-base mass without an explicit conversion."
  - id: water_mass
    applies_to: "Water incorporated into product or used in processing"
