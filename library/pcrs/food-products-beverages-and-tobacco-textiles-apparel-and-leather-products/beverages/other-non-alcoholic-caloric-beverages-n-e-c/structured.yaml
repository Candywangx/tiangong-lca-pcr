allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared processes and co-products"
    rule: "Avoid allocation by sub-metering, batch or line subdivision, or separately modelling functions whenever practicable."
    source_ids:
      - ghg-protocol-product-2011
  - rule_id: allocation_physical
    applies_to: "unavoidable shared utilities, cleaning and common processes"
    rule: "When subdivision is not practicable, use a physical driver that represents causation, such as metered energy, water use, processing time, mass throughput or container count; document the driver and all products sharing it."
    source_ids:
      - ghg-protocol-product-2011
  - rule_id: allocation_fallback
    applies_to: "common process without defensible physical relation"
    rule: "If no defensible physical relationship exists, use economic or another documented relationship that best reflects the common process, disclose prices and period, and test sensitivity when allocation materially affects results."
    source_ids:
      - ghg-protocol-product-2011
  - rule_id: allocation_rework
    applies_to: "internal beverage rework and recovered streams"
    rule: "Treat on-site rework returned within the included system as an internal transfer. Retain burdens and losses in the system and do not create a co-product credit unless a separately marketed product leaves the boundary."
    source_ids:
      - ghg-protocol-product-2011
  - rule_id: allocation_waste
    applies_to: "outputs without economic value"
    rule: "Classify an output without economic value as waste and assign no co-product allocation to it; include the attributable handling and treatment burdens in the declared product system."
    source_ids:
      - ghg-protocol-product-2011
  - rule_id: allocation_packaging_returns
    applies_to: "reusable or returned packaging"
    rule: "Model returned packaging by the declared reuse-cycle method of the selected background system; disclose cycles, losses and any burden sharing and avoid a second credit for the same returned material."
    source_ids:
      - epd-food-beverage-pcr-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_product_identity
      process_id: "filling_packaging"
      flow_role: "reference product identity and qualifiers"
      record_type: "release specification and product master data"
      raw_fields: "product name; formula revision; caloric ingredient; sold concentration; dilution instruction; carbonation specification; particulate state; package; lot; net mass"
      collection_method: "Approved formula, product specification and lot release record cross-check"
      unit: "kg and declared product descriptors"
      frequency: "each product and formula revision; verify each reporting period"
      temporal_coverage: "Same period as the foreground inventory"
      site_scope: "Each represented product, site and line"
      aggregation_rule: "Retain one identity record per product/route and link all included lots"
      quality_evidence: "Approved specification, release record, calibrated net-content evidence and Tiangong flow selection rationale"
    - protocol_id: cp_water_preparation
      process_id: "water_preparation"
      flow_role: "source water, prepared water, reject, electricity and treatment media"
      record_type: "meter, invoice, stock and maintenance records"
      raw_fields: "source by type; opening/closing meter; prepared-water transfer; reject; electricity; media issued; lot/time"
      collection_method: "Calibrated meters reconciled with invoices and treatment logs"
      unit: "kg water; kWh; kg media"
      frequency: "continuous or per batch with monthly reconciliation"
      temporal_coverage: "Representative production period including cleaning and seasonal operation"
      site_scope: "Each supplying system at the represented site"
      aggregation_rule: "Sum by source and allocate only documented common use before normalising to reference output"
      quality_evidence: "Meter calibration, invoice reconciliation, treatment log and balance check"
    - protocol_id: cp_formulation_batch
      process_id: "formulation_blending"
      flow_role: "ingredients, water, energy, intermediate output and losses"
      record_type: "batch recipe, dosing, inventory and meter records"
      raw_fields: "batch id; formula revision; ingredient id; supplied concentration; issued mass; water; energy; output mass; rework; loss"
      collection_method: "Electronic batch record and calibrated dosing/utility meters, reconciled to inventory"
      unit: "kg; kWh; MJ"
      frequency: "each batch with reporting-period reconciliation"
      temporal_coverage: "Representative production period covering the declared formulation"
      site_scope: "Each represented product and blending line"
      aggregation_rule: "Sum conforming batches; separate formula revisions; normalise by net conforming output"
      quality_evidence: "Dosing calibration, inventory reconciliation, formula approval and batch mass balance"
    - protocol_id: cp_conditioning_operation
      process_id: "product_conditioning"
      flow_role: "conditioning feed, utilities, consumables, output and rejects"
      record_type: "run log, meters, consumable issues and mass balance"
      raw_fields: "operation type; equipment; feed/output mass; temperature/time; energy; consumables; reject"
      collection_method: "Run-specific process records and calibrated meters"
      unit: "kg; kWh; MJ"
      frequency: "each run or continuous campaign"
      temporal_coverage: "Same period as represented production"
      site_scope: "Each applied conditioning unit"
      aggregation_rule: "Aggregate only equivalent technologies and product states"
      quality_evidence: "Meter calibration, run log, release specification and mass balance"
    - protocol_id: cp_carbonation_run
      process_id: "carbonation"
      flow_role: "beverage feed/output, carbon dioxide input, energy, retained carbon dioxide, recovery, vent and loss"
      record_type: "supplier stock, mass flow, product test and run log"
      raw_fields: "CO2 opening/closing stock; purchases; charged mass; recovered mass; beverage feed/output; carbonation test; energy; loss"
      collection_method: "Reconciled tank/cylinder inventory plus calibrated mass flow and product specification test"
      unit: "kg; kWh; MJ"
      frequency: "each run with reporting-period stock reconciliation"
      temporal_coverage: "Same period as carbonated product output"
      site_scope: "Each carbonator and represented product"
      aggregation_rule: "Calculate net CO2 use and vent by run or campaign; normalise by conforming output"
      quality_evidence: "Supplier record, scale/flow calibration, stock reconciliation and carbonation test"
    - protocol_id: cp_filling_packaging
      process_id: "filling_packaging"
      flow_role: "beverage feed/output, packaging, energy, rejects and packaging waste"
      record_type: "filler meter, net-content check, component issue, line counter, waste weight and utility meter"
      raw_fields: "product/lot; beverage feed; conforming unit count; net mass; component id/material/mass; issued/returned components; rejects; waste; energy"
      collection_method: "Calibrated filler records, statistical net-content checks, packaging stock reconciliation and weighed waste"
      unit: "kg; item; kWh; MJ"
      frequency: "each run with reporting-period reconciliation"
      temporal_coverage: "Same period as represented packed product"
      site_scope: "Each package format and filling line"
      aggregation_rule: "Separate package formats; calculate net beverage and packaging per conforming output"
      quality_evidence: "Scale and meter calibration, packaging bill, stock balance and reject reconciliation"
    - protocol_id: cp_cleaning_wastewater
      process_id: "cleaning_wastewater"
      flow_role: "cleaning water, chemicals, energy, recovered streams, wastewater, residuals and releases"
      record_type: "clean-in-place log, meters, dosing, laboratory and waste records"
      raw_fields: "campaign/line; water; chemical/product concentration; energy; recovered volume; wastewater flow; pH; temperature; relevant pollutant concentrations; sludge mass/dry matter; destination"
      collection_method: "Calibrated flow and dosing meters with time-matched accredited or quality-controlled sampling and waste documentation"
      unit: "kg; m3; kWh; MJ; concentration units"
      frequency: "each cleaning campaign for use; wastewater flow continuously or by discharge; sampling at justified frequency"
      temporal_coverage: "Representative production period including start-up, changeover and cleaning"
      site_scope: "Each line, cleaning circuit and discharge point"
      aggregation_rule: "Assign campaign-specific use where possible; otherwise use documented physical driver; match concentration with corresponding flow before load calculation"
      quality_evidence: "Meter calibration, chemical stock reconciliation, sampling plan, laboratory QA and treatment/disposal record"
  calculation_rules:
    - id: calc_reference_normalisation
      applies_to: "all inventory rows"
      rule: "Normalised amount = attributable reporting-period amount / kg net conforming beverage at sold concentration."
      inputs:
        - "attributable amount"
        - "net conforming beverage mass"
      output: "row amount per 1 kg reference flow"
      source_ids:
        - ghg-protocol-product-2011
    - id: calc_concentrate_scenario
      applies_to: "as-consumed scenario for concentrate"
      rule: "Prepared beverage amount and added water shall be calculated from the product's declared mass-based preparation ratio; retain the as-sold 1 kg inventory as the source result and report the prepared scenario separately."
      inputs:
        - "as-sold concentrate mass"
        - "declared concentrate-to-water ratio"
        - "any density conversion"
      output: "separately labelled as-consumed scenario"
      source_ids:
        - codex-gsfa-beverage-forms-2025
    - id: calc_packaging_use
      applies_to: "packaging inputs"
      rule: "Packaging consumed = opening stock + receipts - closing stock - verified returns; reconcile with conforming units and weighed packaging waste before normalisation."
      inputs:
        - stock
        - receipts
        - returns
        - "component mass"
        - "output count and waste"
      output: "kg of each packaging component per 1 kg net beverage"
      source_ids:
        - epd-food-beverage-pcr-2025
    - id: calc_carbon_dioxide_vent
      applies_to: "carbonation direct emission"
      rule: "CO2 vent = CO2 supplied + opening stock - closing stock - CO2 retained in conforming product - recovered CO2 - CO2 in separately measured product loss; do not report a negative vent."
      inputs:
        - "supplier and stock records"
        - "retained/recovered CO2"
        - "product loss"
      output: "kg CO2 vented per 1 kg net beverage"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_wastewater_load
      applies_to: "direct water emissions"
      rule: "Pollutant load = time-matched concentration × discharge volume, with unit and density conversion documented; subtract an influent load only when the study method explicitly requires net treatment removal and both values are measured."
      inputs:
        - "discharge flow"
        - "pollutant concentration"
        - "sampling interval"
      output: "kg pollutant to the receiving compartment per 1 kg net beverage"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_mass_balance
      applies_to: "each process and facility total"
      rule: "Balance difference = total material inputs - product outputs - waste outputs - measured direct material emissions - stock increase. Report the difference and investigate its direction and materiality; do not force it to zero by adding an unidentified flow."
      inputs:
        - "all mass records and stock changes on a consistent wet-mass basis"
      output: "disclosed mass-balance result"
      source_ids:
        - eu-fdm-bat-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and reference flow"
      requirement: "Demonstrate that the product is caloric, non-alcoholic and not more specifically classified; retain the formulation, commercial form and Tiangong-flow selection or limited-proxy rationale."
      evidence: "Product specification, formula revision, classification review and cp_product_identity record; unsd-cpc-3-2025; codex-gsfa-beverage-forms-2025"
    - id: dq_primary_data
      applies_to: "foreground operations"
      requirement: "Use site-, line- and product-specific primary records for material, utility, product, waste and emission quantities. Estimates shall be identified, justified and replaced when measured records become available."
      evidence: "Collection protocol records and the GHG Protocol data-management principles in ghg-protocol-product-2011"
    - id: dq_temporal
      applies_to: "reporting period"
      requirement: "Cover a representative period including routine production, start-up, changeover, cleaning, downtime and seasonal effects relevant to the declared product. State exclusions and why the period remains representative."
      evidence: "Dated batch, meter, cleaning, waste and production records"
    - id: dq_completeness
      applies_to: "process and flow coverage"
      requirement: "Reconcile all required and triggered conditional processes. List omitted flows or processes with quantified or evidence-based justification; an undocumented zero is not acceptable."
      evidence: "Process map, mass/energy/water inventories, wastewater-stream inventory and balance checks; eu-fdm-bat-2019"
    - id: dq_technology_geography
      applies_to: "site and upstream datasets"
      requirement: "Describe actual water source, formulation route, conditioning, carbonation, package format, utilities, wastewater treatment, geography and technology; justify each upstream proxy."
      evidence: "Site records, supplier information and dataset metadata"
    - id: dq_measurement
      applies_to: "meters, conversions and laboratory data"
      requirement: "Retain calibration status, measurement uncertainty where available, conversion formula, sampling method, time matching and laboratory QA for values that materially influence the inventory."
      evidence: "Calibration certificates, sampling plan, laboratory QA and calculation workbook"
    - id: dq_allocation
      applies_to: "shared processes"
      requirement: "Preserve pre-allocation totals, allocation driver, products sharing the process, allocation factors and sensitivity evidence when results are materially affected."
      evidence: "Allocation worksheet and ghg-protocol-product-2011"
validation_rules:
  - rule_id: vr_category_identity
    applies_to: "product scope"
    rule: "Fail if caloric status, non-alcoholic status, sold form, formula class or not-elsewhere-classified rationale is missing, or if the product belongs to an excluded or more specific category."
    source_ids:
      - unsd-cpc-3-2025
      - codex-gsfa-beverage-forms-2025
  - rule_id: vr_reference_flow
    applies_to: "reference object"
    rule: "Require exactly 1 kg net beverage at sold concentration, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 and kg; packaging mass shall be separate."
    source_ids: []
  - rule_id: vr_flow_substitution
    applies_to: "product flow identity"
    rule: "Accept Carbonated beverage b6cb89fa-5fac-4d09-85d6-f6e1934200b2 only for a matching carbonated product or with an explicit limited-proxy disclosure. Require a more specific public Tiangong product flow when one matches the actual product."
    source_ids: []
  - rule_id: vr_process_coverage
    applies_to: "process inventory"
    rule: "Require water_preparation, formulation_blending, filling_packaging and cleaning_wastewater. Require each conditional process when route records show it occurred, and require an explicit evidence-backed omission otherwise."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: vr_recursive_input
    applies_to: "same-category input"
    rule: "Reject double counting when a purchased beverage base, concentrate or rework input is both linked to an upstream dataset and recursively recreated, or when an internal on-site transfer is counted as a new external input."
    source_ids:
      - ghg-protocol-product-2011
  - rule_id: vr_mass_balance
    applies_to: "material inventory"
    rule: "Require process and facility mass-balance disclosure on a consistent basis. Investigate and disclose differences rather than forcing balance with an unidentified flow."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: vr_water_wastewater
    applies_to: "water and direct water emissions"
    rule: "Require water-use and wastewater-stream quantities. Where direct discharge is in scope, require time-matched flow and relevant pollutant concentrations and project substance-specific elementary releases."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: vr_packaging
    applies_to: "packaging inventory"
    rule: "Require package component, material, mass, format, loss and reuse/return status separately from net beverage mass."
    source_ids:
      - epd-food-beverage-pcr-2025
  - rule_id: vr_allocation
    applies_to: "shared processes and co-products"
    rule: "Require subdivision where practicable; otherwise require the documented physical or fallback relationship, factors, pre-allocation totals and no duplicate credit."
    source_ids:
      - ghg-protocol-product-2011
  - rule_id: vr_data_traceability
    applies_to: "foreground data"
    rule: "Require source record, time period, site/line/product scope, collection protocol, calculation rule, unit conversion and quality evidence for each collected or calculated row."
    source_ids:
      - ghg-protocol-product-2011
  - rule_id: vr_inventory_identity
    applies_to: "non-reference inventory flows"
    rule: "Require every final dataset to record the actual public Tiangong UUID for selected product, waste and elementary flows where a matching public flow exists; semantic candidate labels in this PCR are not final UUID evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-, site-, route- and reporting-period-specific foreground beverage manufacturing data package, suitable for publication as a secondary dataset or background dataset after review."
  downstream_use: "Upstream-linked cradle-to-gate LCA, product carbon-footprint or lifecycle-model construction; manufacturing benchmarking within an equivalent product definition; supply-chain modelling with declared package and concentration."
  allowed_use: "Use when category identity, functional/reference unit, process coverage, allocation, upstream links, packaging, data period and quality disclosure meet this PCR and the downstream study method."
  excluded_use: "Do not use as a nutrition or food-safety assessment; do not use the carbonated representative flow to imply all category products are equivalent; do not compare products with different sold/as-consumed states, functions, package systems, boundaries or data quality without harmonisation; do not treat a candidate PCR as a verified comparative-claim programme rule."
  required_metadata: "Canonical PCR id and version state; actual product name and Tiangong product-flow UUID; complete required qualifiers; site, line, geography, technology and period; formula revision; process map; reference flow and net-mass evidence; sold concentration and preparation ratio; package bill; data sources; collection/calculation protocols; upstream dataset versions; allocation; cut-offs and downstream exclusions."
  required_quality_disclosure: "Primary-data share by relevant process; meter/calibration and sampling evidence; temporal, geographical and technological representativeness; mass-balance differences; wastewater coverage; allocation sensitivity; proxy flow and upstream-dataset limitations; uncertainty and excluded data."
  update_trigger: "Reassess when product classification, formula or concentration changes; when conditioning, carbonation, package format, site, line, utilities, water source, cleaning or wastewater route changes; when the representative Tiangong flow is superseded by a more specific public flow; when upstream data or allocation materially changes; or when the reporting period no longer represents current production."
