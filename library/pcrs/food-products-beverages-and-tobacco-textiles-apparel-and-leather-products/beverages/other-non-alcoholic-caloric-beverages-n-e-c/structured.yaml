measurement_rules:
  - id: reference_mass
    applies_to: "Reference beverage product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report exactly 1 kg net beverage at sold concentration. Exclude packaging mass and retain the weighing or filling record used to determine net mass."
  - id: concentrate_state
    applies_to: "Concentrated beverage products"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Keep the reference flow at 1 kg product as sold. Any as-consumed result shall be a separately calculated scenario using the declared preparation ratio; never mix as-sold and as-consumed inventories."
  - id: carbonation_mass
    applies_to: "Added or vented carbon dioxide"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Prefer supplier mass, mass-flow or cylinder inventory. If a volume-based record is converted, retain temperature, pressure, gas composition, conversion equation and source data."
  - id: packaging_separation
    applies_to: "Primary, secondary and tertiary packaging"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report packaging as separate product inputs per 1 kg net beverage; do not add packaging mass to the reference amount."
  - id: batch_mass_balance
    applies_to: "Each included foreground process and the aggregated facility"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use a consistent wet-mass basis for material inputs, product, rework, rejects, waste and measured losses; disclose any volume-to-mass conversion and unresolved balance difference."
