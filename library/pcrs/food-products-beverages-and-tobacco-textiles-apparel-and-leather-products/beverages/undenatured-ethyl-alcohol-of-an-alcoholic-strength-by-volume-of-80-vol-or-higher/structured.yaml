allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Multi-output foreground processes"
    rule: "First subdivide separately metered processes and internal transfers so ethanol, steam, electricity, stillage, fusel oil, carbon dioxide recovery, and other outputs receive only causally connected exchanges."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_system_expansion
    applies_to: "Marketable co-products"
    rule: "Where subdivision is insufficient and a documented displaced product exists, apply system expansion or substitution and disclose the substituted function, market, quality, and sensitivity case."
    source_ids:
      - eu-environmental-footprint-2021
      - arcentales-bastidas-ethanol-lca-2022
  - rule_id: allocation_physical_then_economic
    applies_to: "Residual unresolved multifunctionality"
    rule: "If substitution is not justified, use a relevant physical causal relation; use economic allocation only when no defensible physical relation exists, with prices, period, geography, and sensitivity disclosed."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_waste_or_coproduct
    applies_to: "Stillage, fusel oil, recovered carbon dioxide, lignin residue, and surplus energy"
    rule: "Classify each output by actual destination and marketability before allocation; do not grant a co-product credit to material sent for disposal or treatment."
    source_ids:
      - eu-environmental-footprint-2021
      - arcentales-bastidas-ethanol-lca-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "feedstock_preparation_storage_dispatch"
      flow_role: "Feedstocks, nitrogen, and other received materials"
      record_type: "invoices, weighbridge tickets, tank gauges, inventory logs, certificates"
      raw_fields: "material identity; supplier; mass or volume; density; moisture or concentration; beginning and ending inventory; batch; date"
      collection_method: "reconcile receipts plus beginning stock minus ending stock and transfers"
      unit: "native unit and kg"
      frequency: "each receipt and monthly close"
      temporal_coverage: "common reporting period"
      site_scope: "all included site operations"
      aggregation_rule: "aggregate by atomic material and route before reference normalization"
      quality_evidence: "calibrated scales or gauges; supplier certificate; inventory reconciliation"
    - protocol_id: cp_chemical_receipts
      process_id: "feedstock_preparation_fermentation_onsite_utilities_wastewater"
      flow_role: "Each enzyme, nutrient, antifoam, acid, alkali, or treatment chemical"
      record_type: "invoices, batch sheets, warehouse issues, formulation certificates"
      raw_fields: "chemical identity; formulated-product mass; active concentration or activity; purpose; batch; inventory"
      collection_method: "reconcile receipts, issues, return, and stock; allocate only to the consuming process"
      unit: "kg formulated product and declared active basis"
      frequency: "each batch and monthly close"
      temporal_coverage: "common reporting period"
      site_scope: "all included process areas"
      aggregation_rule: "sum each chemical separately and normalize after stock reconciliation"
      quality_evidence: "product specification; batch record; inventory record"
    - protocol_id: cp_process_batches
      process_id: "feedstock_preparation"
      flow_role: "Prepared mash and internal transfers"
      record_type: "batch sheets, transfer meters, laboratory results"
      raw_fields: "transfer mass or volume; density; dry matter; fermentable sugar; temperature; batch id; losses"
      collection_method: "pair source and destination records and reconcile line hold-up"
      unit: "kg or m3 plus composition"
      frequency: "each batch"
      temporal_coverage: "common reporting period"
      site_scope: "all included preparation lines"
      aggregation_rule: "aggregate matched transfers without counting internal circulation"
      quality_evidence: "calibrated transfer meter; laboratory certificate; reconciliation"
    - protocol_id: cp_fermentation_records
      process_id: "fermentation"
      flow_role: "Fermentation inputs, broth, and yeast"
      record_type: "batch logs, tank gauges, laboratory analyses"
      raw_fields: "mash input; yeast dose; fermentation time; broth mass or volume; density; ethanol; residual sugar; recovered carbon dioxide"
      collection_method: "reconcile each fermenter batch and product transfer"
      unit: "kg or m3 plus concentration"
      frequency: "each batch"
      temporal_coverage: "common reporting period"
      site_scope: "all fermenters in scope"
      aggregation_rule: "aggregate conforming batches and separately report aborted batches"
      quality_evidence: "calibrated tanks; laboratory method; batch approval"
    - protocol_id: cp_distillation_records
      process_id: "distillation_rectification"
      flow_role: "Broth, rectified ethanol, and recovery performance"
      record_type: "flowmeters, tank gauges, laboratory analyses, production logs"
      raw_fields: "broth input; ethanol concentration; product mass; alcohol strength; water or composition; temperature; reflux or recovery records; stillage"
      collection_method: "reconcile ethanol and total mass through recovery and transfer"
      unit: "kg and % vol"
      frequency: "each campaign or daily"
      temporal_coverage: "common reporting period"
      site_scope: "all recovery trains in scope"
      aggregation_rule: "aggregate only output meeting the category threshold"
      quality_evidence: "calibrated meter; alcohol-strength method; mass-balance closure"
    - protocol_id: cp_utility_meters
      process_id: "all_processes"
      flow_role: "Electricity, steam, water, and utility outputs"
      record_type: "meters, invoices, equipment runtime, steam logs"
      raw_fields: "meter id; start and end readings; process area; pressure; temperature; condensate; operating time; conversion factor"
      collection_method: "use submeters first; otherwise calculate from verified load and operating time"
      unit: "native utility unit"
      frequency: "continuous or each shift, monthly close"
      temporal_coverage: "common reporting period"
      site_scope: "all included meters and shared systems"
      aggregation_rule: "subtract internal circulation and allocate shared services with disclosed drivers"
      quality_evidence: "calibration; invoice reconciliation; engineering calculation"
    - protocol_id: cp_fuel_records
      process_id: "onsite_utilities_wastewater"
      flow_role: "Each on-site fuel"
      record_type: "flowmeters, weighbridge records, invoices, fuel certificates"
      raw_fields: "fuel identity; quantity; moisture; heating value; carbon and sulfur; stock change; boiler or turbine"
      collection_method: "reconcile fuel receipt and consumption by equipment"
      unit: "native unit, kg, and MJ"
      frequency: "each receipt and daily or monthly meter close"
      temporal_coverage: "common reporting period"
      site_scope: "all included combustion units"
      aggregation_rule: "aggregate each fuel separately and allocate to measured utility output"
      quality_evidence: "calibrated meter; supplier certificate; stock reconciliation"
    - protocol_id: cp_refrigerant_records
      process_id: "onsite_utilities_wastewater"
      flow_role: "Ammonia refrigerant"
      record_type: "purchase, inventory, recovery, and maintenance logs"
      raw_fields: "refrigerant identity; initial and final charge; purchase; recovery; service addition; incident loss"
      collection_method: "annual or campaign mass balance"
      unit: "kg"
      frequency: "each service event and annual close"
      temporal_coverage: "common reporting period"
      site_scope: "all included R717 systems"
      aggregation_rule: "purchases plus initial inventory minus recovery and final inventory"
      quality_evidence: "technician log; cylinder weights; incident record"
    - protocol_id: cp_storage_dispatch_records
      process_id: "storage_dispatch"
      flow_role: "Product storage, quality release, and dispatch"
      record_type: "tank gauges, weighbridge tickets, quality certificates, shipping records"
      raw_fields: "receipt; stock; rework; off-spec quantity; dispatched net mass; alcohol strength; temperature; package form"
      collection_method: "reconcile tank movements and net dispatch"
      unit: "kg and % vol"
      frequency: "each tank movement and shipment"
      temporal_coverage: "common reporting period"
      site_scope: "all product tanks and loading points"
      aggregation_rule: "normalize only released product meeting at least 80% vol"
      quality_evidence: "calibrated scale or tank; signed quality release; dispatch record"
    - protocol_id: cp_packaging_records
      process_id: "storage_dispatch"
      flow_role: "Each one-way packaging component"
      record_type: "purchase, issue, count, and unit-mass records"
      raw_fields: "package material; count; unit mass; reusable or one-way status; product allocation; waste count"
      collection_method: "multiply verified count by unit mass and reconcile stock"
      unit: "item and kg"
      frequency: "each filling run and monthly close"
      temporal_coverage: "common reporting period"
      site_scope: "all packaging lines in scope"
      aggregation_rule: "report each component separately and exclude reusable assets unless consumed"
      quality_evidence: "supplier specification; count reconciliation; sample weighing"
    - protocol_id: cp_waste_coproduct_records
      process_id: "all_processes"
      flow_role: "Each waste or co-product"
      record_type: "scales, tank gauges, manifests, invoices, destination records"
      raw_fields: "identity; wet mass; dry matter; composition; stock; destination; revenue; treatment"
      collection_method: "reconcile generation, internal reuse, sale, treatment, and stock"
      unit: "kg or m3"
      frequency: "each movement and monthly close"
      temporal_coverage: "common reporting period"
      site_scope: "all included waste and co-product stores"
      aggregation_rule: "separate marketable output, internal recycle, and waste by destination"
      quality_evidence: "calibrated measure; signed manifest; buyer or treatment record"
    - protocol_id: cp_wastewater_records
      process_id: "all_processes"
      flow_role: "Wastewater, treated effluent, and water pollutants"
      record_type: "flowmeters, composite samples, laboratory reports, discharge records"
      raw_fields: "source; influent and effluent volume; COD; total nitrogen; total phosphorus; pH; temperature; sampling time"
      collection_method: "pair representative concentration with flow over the same interval"
      unit: "m3 and kg pollutant"
      frequency: "continuous flow; representative composite sampling"
      temporal_coverage: "common reporting period"
      site_scope: "all included drains and discharge points"
      aggregation_rule: "calculate flow-weighted loads; do not sum concentration values"
      quality_evidence: "calibrated flowmeter; accredited or documented laboratory method; permit record"
    - protocol_id: cp_direct_emissions
      process_id: "all_processes"
      flow_role: "Each direct air emission"
      record_type: "stack tests, continuous monitoring, vent flow and concentration, mass-balance inputs"
      raw_fields: "source id; pollutant; flow; concentration; operating time; fuel; recovery; method"
      collection_method: "calculate each pollutant by source and reconcile recovered material"
      unit: "kg"
      frequency: "monitoring or test frequency required by permit, plus annual close"
      temporal_coverage: "common reporting period"
      site_scope: "all included vents, stacks, tanks, and loading points"
      aggregation_rule: "sum each elementary flow separately after source-level calculation"
      quality_evidence: "calibration; test report; permit method; mass-balance evidence"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every foreground exchange"
      rule: "normalized amount = reconciled exchange amount × 1,000 kg / reconciled conforming ethanol output kg"
      inputs:
        - "period exchange"
        - "net conforming output"
      output: "amount per 1,000 kg reference flow"
      source_ids:
        - eu-environmental-footprint-2021
    - id: calc_volume_to_mass
      applies_to: "Liquid transfers recorded by volume"
      rule: "mass = measured volume × density at the declared temperature; retain measured volume, density, temperature, and method"
      inputs:
        - volume
        - density
        - temperature
      output: "kg liquid"
      source_ids:
        - eu-environmental-footprint-2021
    - id: calc_ethanol_quality_gate
      applies_to: "Reference product"
      rule: "segregate output with measured alcohol strength below 80% vol from conforming output; no production-weighted averaging across the threshold"
      inputs:
        - "batch output"
        - "% vol"
        - "test method"
      output: "conforming output kg and off-spec kg"
      source_ids:
        - unsd-cpc-3-0-24110
    - id: calc_internal_transfer_reconciliation
      applies_to: "Prepared mash, broth, ethanol, steam, and recycled materials"
      rule: "destination input = source output - measured transfer loss - documented inventory change; internal transfers do not create upstream burden"
      inputs:
        - "paired records"
        - "line hold-up"
        - loss
      output: "reconciled transfer"
      source_ids:
        - eu-environmental-footprint-2021
    - id: calc_wastewater_load
      applies_to: "COD, total nitrogen, and total phosphorus"
      rule: "pollutant load = sum of representative interval volume × paired concentration, with unit conversion documented"
      inputs:
        - "effluent volume"
        - "paired concentration"
      output: "kg pollutant to water"
      source_ids:
        - nrel-ethanol-design-2011
    - id: calc_refrigerant_loss
      applies_to: "Ammonia refrigeration"
      rule: "loss = purchases + initial charge - recovered quantity - final charge, adjusted for documented transfers"
      inputs:
        - purchase
        - "initial and final inventory"
        - recovery
        - transfer
      output: "kg ammonia to air"
      source_ids:
        - nrel-ethanol-design-2011
    - id: calc_mass_balance
      applies_to: "Each process and full site"
      rule: "reconcile input, product, internal transfer, recovered co-product, waste, emission, and inventory change on compatible wet, dry, carbon, or ethanol bases; investigate material closure gaps"
      inputs:
        - "collected flow records"
        - composition
        - "stock change"
      output: "balance and unresolved difference"
      source_ids:
        - eu-environmental-footprint-2021
        - nrel-ethanol-design-2011
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Retain alcohol-strength result, measurement temperature and method, undenatured-status evidence, water or composition result, product grade, and dispatch form for every aggregated product family."
      evidence: "quality certificate; laboratory result; product specification"
    - id: dq_temporal
      applies_to: "Foreground data"
      requirement: "Use one common period of at least 12 consecutive months unless a shorter period is demonstrably representative of a new or changed operation; disclose seasonality and shutdowns."
      evidence: "dated raw records; production calendar; justification"
    - id: dq_technology_route
      applies_to: "Process inventory"
      requirement: "Identify feedstock and pretreatment route, fermentation organism, recovery configuration, dehydration step, utility supply, wastewater treatment, and co-product management."
      evidence: "process flow diagram; equipment list; operating narrative"
    - id: dq_measurement
      applies_to: "Metered and sampled data"
      requirement: "Use calibrated instruments and documented laboratory methods; retain native values and conversion factors."
      evidence: "calibration certificate; method; chain of custody; calculation sheet"
    - id: dq_completeness
      applies_to: "All included processes"
      requirement: "Reconcile all identified atomic material, energy, waste, co-product, and elementary flows and explain missing or estimated values."
      evidence: "completeness matrix; mass and energy balances; variance review"
    - id: dq_supplier_background
      applies_to: "Upstream links"
      requirement: "Match supplier, feedstock route, geography, technology, and year where material; disclose proxies and data quality limitations."
      evidence: "supplier data; dataset metadata; proxy rationale"
    - id: dq_allocation
      applies_to: "Multi-output processes"
      requirement: "Retain subdivision, substitution, physical relation, or economic data and the sensitivity case needed to reproduce allocation."
      evidence: "meter map; market evidence; price series; allocation calculation"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Reference flow"
    rule: "Fail category conformance if the product is denatured, the measured alcoholic strength is below 80% vol, or the strength, temperature, and method are missing."
    source_ids:
      - unsd-cpc-3-0-24110
  - rule_id: validate_reference_amount
    applies_to: "Reference flow"
    rule: "Require exactly 1,000 kg net conforming output after stock change, off-spec product, and dispatch loss reconciliation."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: validate_process_coverage
    applies_to: "Foreground dataset"
    rule: "Require feedstock preparation, fermentation, distillation and rectification, and storage/dispatch inventories; require each applicable on-site utility and wastewater process or an explicit linked external service."
    source_ids:
      - nrel-ethanol-design-2011
  - rule_id: validate_atomic_inventory
    applies_to: "Inventory rows"
    rule: "Reject aggregated selected-flow labels and require electricity, steam, each fuel, each refrigerant, each feedstock, each chemical, each package, each waste, and each elementary emission to remain separate."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: validate_transfer_balance
    applies_to: "Internal intermediates"
    rule: "Require paired preparation-to-fermentation, fermentation-to-recovery, recovery-to-storage, and on-site steam transfers to reconcile after explicit loss and inventory change."
    source_ids:
      - nrel-ethanol-design-2011
  - rule_id: validate_mass_and_ethanol_balance
    applies_to: "Process and site totals"
    rule: "Require documented mass and ethanol-balance checks and investigation of material unexplained differences."
    source_ids:
      - eu-environmental-footprint-2021
      - nrel-ethanol-design-2011
  - rule_id: validate_emissions_wastewater
    applies_to: "Direct emissions and discharge"
    rule: "Require each applicable vent, stack, refrigerant loss, wastewater flow, COD, nitrogen, and phosphorus record or a documented not-applicable determination."
    source_ids:
      - nrel-ethanol-design-2011
      - us-epa-ap42-distilled-spirits-1997
  - rule_id: validate_allocation
    applies_to: "Multi-output processes"
    rule: "Reject unreported or unreproducible allocation and any credit assigned to an output sent for treatment or disposal."
    source_ids:
      - eu-environmental-footprint-2021
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after independent review"
  downstream_use: "Plant-gate foreground production package for process datasets and lifecycle models of undenatured ethanol at least 80% vol"
  allowed_use: "Studies matching the declared feedstock route, technology, geography, alcohol strength, water or composition, utility supply, co-product treatment, dispatch form, and reference mass basis"
  excluded_use: "Denatured or synthetic ethanol; ethanol below 80% vol; beverage products; unqualified global average; downstream blending, distribution, or combustion without added stages"
  required_metadata: "PCR id and version; product flow UUID; alcohol strength, temperature, and test method; undenatured status; water or composition; feedstock and route; site and geography; technology; reporting period; dispatch form; boundary; upstream links; co-product and allocation method"
  required_quality_disclosure: "Primary-data share; meter and laboratory coverage; mass, ethanol, water, and energy balance results; missing flows; proxies; range-evidence gaps; uncertainty; allocation sensitivity; reviewer status"
  update_trigger: "Change in feedstock, fermentation or recovery technology, alcohol-strength specification, energy or water system, co-product destination, wastewater treatment, dispatch form, site boundary, or representative data period"
