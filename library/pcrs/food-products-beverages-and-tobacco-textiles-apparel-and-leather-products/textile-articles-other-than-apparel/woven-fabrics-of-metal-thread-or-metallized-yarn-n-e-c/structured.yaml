allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "shared foreground operations"
    rule: "First subdivide meters, batches, production lines, and waste records so that fabric-specific inputs and outputs are directly assigned."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_physical_when_unavoidable
    applies_to: "inseparable multi-product operations"
    rule: "When subdivision is not practicable, use a documented physical relation that reflects the causal use of the shared operation, such as machine time combined with measured power, treated mass, or wastewater volume."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_no_unjustified_credit
    applies_to: "wastes and recoverable material"
    rule: "Record each waste destination and any revenue or recovered-product status; do not apply an avoided-burden credit inside the foreground inventory without the declared downstream method and consistent system model."
    source_ids:
      - ec-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_weaving_batch_records
      process_id: "yarn_preparation_weaving"
      flow_role: "all yarn, sizing, electricity, compressed-air, product, waste, and measured release rows"
      record_type: "batch record; meter; issue-return log; scale ticket; waste ticket; test report"
      raw_fields: "batch_id; product_code; yarn identities; composition; opening and closing meter readings; issued and returned material; output mass; waste mass and destination; release method"
      collection_method: "reconcile timestamped production, meter, stock, scale, and waste records to the batch"
      unit: "native recorded unit and kg-normalized result"
      frequency: "each batch; meters at least monthly"
      temporal_coverage: "representative continuous 12 months or all batches in the declared shorter period"
      site_scope: "all equipment and utilities serving the declared foreground route"
      aggregation_rule: "subtract documented returns; allocate shared meters only by disclosed causal driver; normalize by net saleable mass"
      quality_evidence: "meter calibration; scale calibration; purchase and stock reconciliation; signed batch release; waste transfer record"
    - protocol_id: cp_finishing_batch_records
      process_id: "wet_finishing"
      flow_role: "unfinished fabric, water, each chemical, electricity, fuel, finished fabric, wastewater, and measured release rows"
      record_type: "recipe; batch record; meter; laboratory report; wastewater log"
      raw_fields: "batch_id; fabric mass; chemical identity and concentration; charged mass; water; energy; fuel; output mass; wastewater volume; destination; measured pollutant result"
      collection_method: "reconcile recipe, meter, laboratory, and transfer records to each route and batch"
      unit: "native recorded unit and kg-normalized result"
      frequency: "each batch; continuous or daily utilities"
      temporal_coverage: "representative continuous 12 months or all batches in the declared shorter period"
      site_scope: "all on-site wet operations and treatment serving the declared product"
      aggregation_rule: "convert solution charges to active substance; retain water and wastewater separately; normalize by released product mass"
      quality_evidence: "calibrated meters; recipe authorization; laboratory method; treatment and discharge records"
    - protocol_id: cp_release_packaging_records
      process_id: "inspection_packaging"
      flow_role: "inspected fabric, electricity, each packaging component, reference product, and reject rows"
      record_type: "inspection record; roll ticket; scale record; packaging issue record; meter"
      raw_fields: "roll_id; batch_id; net fabric mass; width; length; mass per area; quality grade; packaging component and mass; reject mass and destination"
      collection_method: "reconcile roll release, calibrated weighing, packaging issue, and rejection records"
      unit: "kg; m; m2; g/m2; kWh"
      frequency: "each released roll and batch"
      temporal_coverage: "all releases in the reporting period"
      site_scope: "final inspection, roll making, and packaging at the reporting site"
      aggregation_rule: "sum released net mass separately from packaging; normalize all assigned exchanges to 1 kg net released fabric"
      quality_evidence: "calibration records; signed quality release; packaging stock reconciliation; reject disposition"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "reference product"
      rule: "Sum measured released roll gross mass minus separately measured core and packaging mass; prefer direct net fabric weighing when available."
      inputs:
        - "roll mass"
        - "core mass"
        - "packaging mass"
      output: "kg net saleable fabric"
      source_ids:
        - ec-pef-method-2021
    - id: calc_area_to_mass
      applies_to: "area-based fabric records"
      rule: "Fabric mass equals measured length multiplied by finished width and measured mass per unit area; reconcile with scale mass and retain the discrepancy."
      inputs:
        - length
        - width
        - "mass per unit area"
        - "scale mass"
      output: "kg fabric and reconciliation difference"
      source_ids:
        - ec-pef-method-2021
    - id: calc_active_chemical
      applies_to: "chemical solution inputs"
      rule: "Active-substance mass equals charged solution mass multiplied by the documented active concentration."
      inputs:
        - "solution mass"
        - "active concentration"
      output: "kg active substance"
      source_ids:
        - jrc-textiles-bref-2023
    - id: calc_batch_normalization
      applies_to: "all foreground exchanges"
      rule: "Divide each batch-assigned exchange by net saleable fabric mass from that batch; exclude nonconforming output from the denominator and record it as waste."
      inputs:
        - "assigned exchange"
        - "net saleable mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - ec-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and material identity"
      requirement: "Preserve supplier and lot identity, metal or coating identity, yarn construction, other-fibre composition, weave, width, mass per area, and finish."
      evidence: "supplier specification; incoming inspection; bill of materials; laboratory or quality report"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Prefer a continuous 12-month period covering normal variability; disclose shorter periods, shutdowns, trials, abnormal batches, and seasonality."
      evidence: "dated meter exports; production calendar; batch register"
    - id: dq_completeness
      applies_to: "mass, energy, water, chemicals, wastes, and releases"
      requirement: "Reconcile all declared processes and explicitly mark every conditional process or atomic exchange present, absent, or outside the site boundary."
      evidence: "mass balance; utility reconciliation; chemical inventory; waste and wastewater register"
    - id: dq_technology_geography
      applies_to: "linked upstream datasets"
      requirement: "Match yarn construction, metal or metallization route, electricity geography, water supply, fuel, chemicals, and packaging technology; document every proxy."
      evidence: "supplier dataset; dataset metadata; proxy justification"
    - id: dq_measurement
      applies_to: "meters and calculations"
      requirement: "Retain raw readings, units, calibration status, allocation driver, conversion factor, and calculation version."
      evidence: "calibration certificate; meter log; calculation workbook or machine-readable record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
    rule: "Confirm the selected reference flow UUID, Product flow type, exact CPC 27994 classification, Mass property UUID, kg unit, and all required product qualifiers."
    source_ids:
      - un-cpc-3-0-27994-2025
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Reject combined or selector flows; every electricity supply, compressed-air supply, fuel, chemical, packaging component, waste, wastewater, and elementary release shall be a separate exchange with route applicability stated."
    source_ids:
      - ec-pef-method-2021
      - jrc-textiles-bref-2023
  - rule_id: validate_mass_balance
    applies_to: "foreground batches"
    rule: "Reconcile input materials with saleable product, intermediate transfers, retained material, waste, and measured releases on the declared moisture basis; investigate and disclose unexplained differences."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_route_completeness
    applies_to: "optional operations"
    rule: "Confirm that sizing and each wet-finishing operation are either represented with their atomic inputs and outputs or explicitly marked not applicable."
    source_ids:
      - jrc-textiles-bref-2023
  - rule_id: validate_evidence
    applies_to: "all reported values"
    rule: "Reject AI-generated amounts and unsupported default ranges; values shall come from foreground records or documented calculations, and every proxy or allocation shall be disclosed."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_bilingual_alignment
    applies_to: "PCR application"
    rule: "Confirm that English and Chinese machine identifiers, row order, UUIDs, controlled tokens, and normative rule ids are identical."
    source_ids:
      - ec-pef-method-2021
published_dataset_profile:
  dataset_role: "Foreground production dataset for woven fabrics of metal thread or metallized yarn n.e.c. at the factory gate"
  downstream_use: "secondary_dataset; background_dataset; input to process and lifecyclemodel projections"
  allowed_use: "Studies whose product scope, composition, technology, geography, period, finish, allocation, and packaging state match the dataset or are transparently adapted"
  excluded_use: "Metallized yarn production alone; ordinary non-metallic fabric; knitted or nonwoven fabric; apparel; undisclosed proxy use; comparative claims without method-consistent review"
  required_metadata: "PCR id and version; CPC 27994; reference flow UUID; geography; period; metal or metallized-yarn construction and fraction; other fibres; weave; width; mass per area; finish; route; allocation; waste and wastewater destinations; packaging state; source and dataset versions"
  required_quality_disclosure: "Primary-data coverage; meter and scale status; mass-balance result; missing flows; UUID gaps; proxy datasets; allocation shares; exclusions; uncertainty and limitations"
  update_trigger: "Material change in product construction, loom or finishing technology, energy or water supply, chemical recipe, waste treatment, allocation, site geography, data period, source method, or Tiangong identity"
