system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when purchased finished curtain fabric and separately purchased trims and packaging materials are received at the manufacturing site. It includes directly controlled cutting, sewing, accessory attachment, conditional wet finishing, inspection, rework handling, packaging, utilities, wastewater, and solid waste up to release of the packaged finished product at the factory gate."
      source_ids: []
    - rule_id: boundary_purchased_material_gate
      applies_to: "All foreground packages"
      rule: "Start the foreground system at receipt of purchased finished fabric and other purchased inputs; retain upstream production through linked datasets."
      source_ids:
        - us-census-naics-2022-314120
        - ilo-garment-supply-chain-2021
    - rule_id: boundary_direct_operations
      applies_to: "Site-controlled manufacture"
      rule: "Include cutting, sewing, assembly, inspection, packaging, directly controlled utilities, product rejects, textile scrap, and other wastes generated by the declared route."
      source_ids:
        - iso-14044-2006
        - iso-tr-14049-2012
    - rule_id: boundary_wet_finishing
      applies_to: "Sites performing wet or thermal textile treatment"
      rule: "Include each actual water, chemical, electricity, steam, wastewater, waste, and relevant direct-emission exchange as a separate atomic row; do not apply this conditional process when finishing occurs entirely upstream."
      source_ids:
        - jrc-textiles-bref-2023
        - eu-textiles-bat-2022-2508
    - rule_id: boundary_no_silent_cutoff
      applies_to: "Material and energy inputs"
      rule: "Do not omit an exchange solely because it is small; any exclusion requires measured evidence, a stated rationale, and a disclosed effect on mass and energy completeness."
      source_ids:
        - iso-14044-2006
