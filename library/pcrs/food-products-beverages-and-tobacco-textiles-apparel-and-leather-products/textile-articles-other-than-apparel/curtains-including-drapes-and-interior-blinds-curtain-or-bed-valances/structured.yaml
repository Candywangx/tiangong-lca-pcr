allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Distinct products, routes, batches, finishing lines, and packaging configurations"
    rule: "Use process subdivision and product-specific records before applying allocation."
    source_ids:
      - iso-14044-2006
      - iso-tr-14049-2012
  - rule_id: allocation_rework_internal
    applies_to: "Rework retained inside the site"
    rule: "Keep rework loops internal; count only additional measured materials and utilities, and do not create a co-product credit."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_recovered_scrap
    applies_to: "Textile scrap transferred for recycling or recovery"
    rule: "Record the outgoing waste mass and destination without an avoided-burden credit inside the foreground package; any downstream substitution belongs to the declared downstream model."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_shared_utilities
    applies_to: "Shared meters or equipment serving multiple products"
    rule: "Prefer submetering; otherwise use a documented physical allocation based on measured operating time, throughput, or another causal driver and disclose the method and sensitivity."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022-2508
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_records
      process_id: "material_cutting_sewing_assembly_inspection_packaging"
      flow_role: "Fabric, panels, thread, heading tape, eyelets and packaging components"
      record_type: "Receiving, issue, return, stock and verified unit-mass records"
      raw_fields: "material identity; composition; lot; gross issue; return; count; verified unit mass; net consumed mass"
      collection_method: "Calibrated scale plus controlled inventory records; eyelet mass may use counted items and verified mean unit mass"
      unit: "kg"
      frequency: "Each production lot"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included manufacturing lines"
      aggregation_rule: "Sum net consumed mass by row and lot; reconcile issues less returns to physical stock movement"
      quality_evidence: "Calibration records; lot traceability; stock reconciliation; unit-mass test record"
    - protocol_id: cp_process_electricity_records
      process_id: "material_cutting_sewing_assembly_wet_finishing_inspection_packaging"
      flow_role: "Low-voltage electricity"
      record_type: "Process-submeter record"
      raw_fields: "meter id; opening reading; closing reading; kWh; process id; lot; operating interval; allocation driver if shared"
      collection_method: "Calibrated submeter; documented physical allocation only when a dedicated submeter is unavailable"
      unit: "kWh"
      frequency: "Each lot or meter interval"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included processes"
      aggregation_rule: "Difference of validated readings, assigned to process and lot; no double counting across processes"
      quality_evidence: "Meter calibration; reading log; allocation worksheet; electricity invoice reconciliation"
    - protocol_id: cp_water_records
      process_id: "wet_finishing"
      flow_role: "Process water and textile-finishing wastewater"
      record_type: "Inlet and outlet meter records"
      raw_fields: "meter id; opening reading; closing reading; volume or mass; density conversion if used; lot; discharge route"
      collection_method: "Calibrated water and effluent meters with documented conversion to mass where required"
      unit: "kg"
      frequency: "Each finishing lot or meter interval"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included wet-finishing lines and discharge points"
      aggregation_rule: "Aggregate inlet and outlet separately by lot; retain water-balance reconciliation"
      quality_evidence: "Meter calibration; water-balance check; discharge log; laboratory record where relevant"
    - protocol_id: cp_chemical_issue_records
      process_id: "wet_finishing"
      flow_role: "Sodium hydroxide and hydrogen peroxide"
      record_type: "Batch recipe, issue and concentration records"
      raw_fields: "chemical identity; CAS or specification; supplier; formulation mass; active concentration; returned mass; lot"
      collection_method: "Controlled recipe and stock issue records reconciled to supplier specification or safety data sheet"
      unit: "kg active substance"
      frequency: "Each finishing batch"
      temporal_coverage: "Complete reporting period"
      site_scope: "Every included finishing recipe and line"
      aggregation_rule: "Formulation mass × verified active mass fraction, less documented return"
      quality_evidence: "Supplier specification; safety data sheet; batch sheet; stock reconciliation"
    - protocol_id: cp_steam_records
      process_id: "wet_finishing"
      flow_role: "Purchased saturated steam"
      record_type: "Steam-meter record"
      raw_fields: "meter id; opening reading; closing reading; steam mass; pressure; condensate return; lot"
      collection_method: "Calibrated steam meter and supplier record"
      unit: "kg"
      frequency: "Each finishing lot or meter interval"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included steam users"
      aggregation_rule: "Difference of validated readings assigned to the applicable finishing lot"
      quality_evidence: "Meter calibration; supplier invoice; pressure log; condensate record"
    - protocol_id: cp_waste_mass_records
      process_id: "material_cutting_inspection_packaging"
      flow_role: "Textile cutting scrap and rejected finished curtains"
      record_type: "Waste scale and transfer record"
      raw_fields: "waste identity; source process; lot; gross mass; tare; net mass; destination; rework status"
      collection_method: "Calibrated scale at generation or dispatch, reconciled to transfer documentation"
      unit: "kg"
      frequency: "Each waste transfer"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included waste generation points"
      aggregation_rule: "Sum net waste mass by row, lot and destination; exclude material retained as stock or internal rework"
      quality_evidence: "Scale calibration; transfer note; destination receipt; rework log"
    - protocol_id: cp_production_output_records
      process_id: "sewing_assembly_wet_finishing_inspection_packaging"
      flow_role: "Intermediate and accepted finished-product outputs"
      record_type: "Production and inspection records"
      raw_fields: "product id; lot; subtype; qualifiers; gross mass; packaging mass; net product mass; accepted quantity; rejected quantity"
      collection_method: "Calibrated scale linked to production and final-inspection release records"
      unit: "kg"
      frequency: "Each production lot"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included product lines"
      aggregation_rule: "Sum accepted net product mass; keep packaging and rejected product separate"
      quality_evidence: "Scale calibration; inspection release; product specification; lot genealogy"
  calculation_rules:
    - id: calc_net_consumption
      applies_to: "Every issued material input"
      rule: "net consumed mass = issued mass − documented return to inventory"
      inputs:
        - "issued mass"
        - "returned mass"
      output: "net material input mass"
      source_ids:
        - iso-tr-14049-2012
    - id: calc_active_chemical_mass
      applies_to: "Sodium hydroxide and hydrogen peroxide formulations"
      rule: "active-substance-equivalent mass = net formulation mass × verified active mass fraction"
      inputs:
        - "formulation issue"
        - "formulation return"
        - "active mass fraction"
      output: "kg active substance"
      source_ids:
        - eu-textiles-bat-2022-2508
    - id: calc_reference_normalization
      applies_to: "All inventory exchanges"
      rule: "normalized exchange = reporting-period exchange ÷ accepted net finished-product mass"
      inputs:
        - "exchange amount"
        - "accepted net finished-product mass"
      output: "exchange amount per 1 kg reference product"
      source_ids:
        - iso-14044-2006
        - iso-tr-14049-2012
    - id: calc_textile_mass_balance
      applies_to: "Cutting through final inspection"
      rule: "Reconcile purchased textile and trim inputs with accepted product, measured intermediate stock change, textile waste, rejected product, and retained rework; investigate and disclose residual differences."
      inputs:
        - "material inputs"
        - "product outputs"
        - "waste outputs"
        - "stock change"
        - "retained rework"
      output: "mass-balance reconciliation"
      source_ids:
        - iso-14044-2006
        - eu-textiles-bat-2022-2508
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Every flow row"
      requirement: "Preserve one chemically or physically specific exchange per row; retain exact UUID evidence when adopted and disclose any row without a confirmed UUID."
      evidence: "Flow identity register and direct-read verification record"
    - id: dq_product_specification
      applies_to: "Reference product"
      requirement: "Record all required qualifiers and link them to the lot-specific product specification."
      evidence: "Approved specification, bill of materials and inspection release"
    - id: dq_temporal_coverage
      applies_to: "Foreground activity data"
      requirement: "Cover a representative continuous reporting period and identify shutdowns, trial runs, abnormal operations, and missing intervals."
      evidence: "Dated meter, production, stock and waste records"
    - id: dq_meter_quality
      applies_to: "Mass, electricity, water and steam records"
      requirement: "Use calibrated equipment and retain calibration validity, reading resolution, conversion method, and treatment of shared meters."
      evidence: "Calibration certificates and meter logs"
    - id: dq_completeness
      applies_to: "Process inventory"
      requirement: "Reconcile material, water and energy inputs with product, waste, wastewater, emissions where relevant, and stock changes; explain every material residual and excluded exchange."
      evidence: "Mass balance, water balance, energy reconciliation and exclusion log"
    - id: dq_representativeness
      applies_to: "Upstream datasets"
      requirement: "Match geography, technology, material composition, recycled content, voltage, pressure and time period to the declared foreground input."
      evidence: "Dataset selection record and supplier specification"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require the accepted state100 CPC 27130 product-flow UUID, Mass property UUID, 1 kg reference amount, and all required product qualifiers; the missing unit-group UUID remains a declared review item."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: validate_atomic_inventory
    applies_to: "Every process inventory card"
    rule: "Require exactly one selected product, waste, or elementary exchange per card; reject collection labels, combined utilities, material selectors, and pending placeholders."
    source_ids:
      - eu-textiles-bat-2022-2508
  - rule_id: validate_bilingual_alignment
    applies_to: "English and Chinese PCR files"
    rule: "Require identical ordered process_id, row_id, controlled token, source-id, and UUID sequences in both language renderings."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_process_coverage
    applies_to: "Foreground route"
    rule: "Require all required processes and require wet_finishing only when the reporting site performs the declared wet or thermal treatment."
    source_ids:
      - us-census-naics-2022-314120
      - jrc-textiles-bref-2023
  - rule_id: validate_foreground_amounts
    applies_to: "Every inventory exchange"
    rule: "Require a linked collection protocol and reporting-period foreground record; do not accept AI-generated default values or ranges."
    source_ids:
      - iso-tr-14049-2012
  - rule_id: validate_mass_balance
    applies_to: "Textile materials and product outputs"
    rule: "Require documented reconciliation of textile and trim inputs with accepted product, stock change, waste, rejects, and retained rework."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022-2508
  - rule_id: validate_wet_finishing_records
    applies_to: "Conditional wet_finishing process"
    rule: "When applicable, require separate records for each actual chemical, process water, electricity, steam or heat, wastewater stream, waste stream, and relevant direct emission."
    source_ids:
      - jrc-textiles-bref-2023
      - eu-textiles-bat-2022-2508
  - rule_id: validate_packaging_separation
    applies_to: "Inspection and packaging"
    rule: "Require PE-LD film and corrugated board boxes as separate inputs and exclude their mass from the 1 kg reference product."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground production dataset for made-up textile curtain, drape, textile blind, curtain-valance, or bed-valance manufacture"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Cradle-to-factory-gate LCI, product-footprint and lifecycle-model construction when product qualifiers, route, geography and reporting period match"
  excluded_use: "Standalone representation of upstream fibre, yarn or fabric production; use-stage service life or cleaning; installation; end-of-life; non-textile blinds or shutters"
  required_metadata: "PCR id and version; product subtype; required qualifiers; factory geography; reporting period; included processes; wet-finishing state; allocation method; upstream dataset references; UUID review status"
  required_quality_disclosure: "Meter coverage and calibration; mass, water and energy reconciliation; missing records; shared-meter allocation; waste destinations; upstream representativeness; exclusions; rows without confirmed UUIDs"
  update_trigger: "Change in product construction or composition, finishing recipe, accessory or packaging configuration, production technology, site energy or water system, waste destination, upstream dataset, or any adopted Tiangong identity"
