      evidence: "Source register and original document review"
    - id: dq_range_status
      applies_to: "Important flows"
      requirement: "Do not infer a range from one case or repeat a single value as both bounds. Until two independent boundary-compatible original sources support a range, retain site-specific collection and the manifest unresolved-range record."
