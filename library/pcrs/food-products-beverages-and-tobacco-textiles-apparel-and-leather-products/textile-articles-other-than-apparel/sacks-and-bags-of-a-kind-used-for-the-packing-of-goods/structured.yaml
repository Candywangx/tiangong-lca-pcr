measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report exactly 1 kg net accepted sack or bag product. Include permanently attached liners, lifting loops, closures and fittings; exclude the packed good, detachable dispatch packaging and pallets."
  - id: conditioned_textile_mass
    applies_to: "Fibres, yarns, fabrics, product and textile wastes"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "State the moisture or conditioning basis for every textile mass. Do not combine dry, conditioned and as-received masses without a measured or documented conversion."
  - id: component_mass_reconciliation
    applies_to: "Product construction"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "kg/kg"
    rule: "Record each polymer, fibre, coating, liner, thread and permanently attached component separately and reconcile their accepted-product mass fractions to the declared product construction."
  - id: fabric_area_to_mass
    applies_to: "Fabric records"
    required_property_ref:
      name: "Mass and area"
      uuid: ""
    required_unit: "kg and m2"
    rule: "When fabric is purchased or issued by area, convert to mass with lot-specific measured mass per area; retain both the source area and measured conversion."
  - id: item_count_to_mass
    applies_to: "Bag production counts"
    required_property_ref:
      name: "Count and mass"
      uuid: ""
    required_unit: "item and kg"
    rule: "Convert accepted and rejected item counts to mass using representative lot-specific bag mass; retain the sampled mass, sample size and production lot."
  - id: electricity_measurement
    applies_to: "Electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Preserve meter or invoice values, voltage level, geography and supply mix. Shared electricity is allocated only with a documented physical driver."
  - id: fuel_and_steam_measurement
    applies_to: "Natural gas and purchased steam"
    required_property_ref:
      name: "Energy or delivered mass"
      uuid: ""
    required_unit: "MJ, Nm3 or kg"
    rule: "Keep every fuel and purchased steam separate. Record fuel calorific basis and steam pressure, temperature and condensate-return condition; retain all conversion factors."
  - id: water_measurement
    applies_to: "Process water and wastewater"
    required_property_ref:
      name: "Mass or volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Preserve the measured unit. Convert volume to mass only with a declared density and temperature basis, and reconcile intake, reuse, evaporation, product carry-over and discharge."
