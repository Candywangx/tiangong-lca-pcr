validation_rules:
  - rule_id: validation_scope
    applies_to: "Dataset identity"
    rule: "Confirm that the reference product is an empty textile sack or bag used for packing goods within CPC 27150 and not a consumer bag, paper sack, non-textile film sack or rigid container."
    source_ids:
      - un-cpc-v3-structure-2023
  - rule_id: validation_reference_flow
    applies_to: "Quantitative reference"
    rule: "Confirm exactly 1 kg net accepted finished product, excluding the packed good and detachable dispatch packaging but including permanently attached liners, loops and fittings."
    source_ids:
      - iso-23560-2015
      - iso-21898-2024
  - rule_id: validation_route_boundary
    applies_to: "Process coverage"
    rule: "Verify that every controlled tape/fibre preparation, weaving, coating, lamination, printing, cutting, sewing, joining, assembly, inspection and packing operation is included and every purchased intermediate has an upstream dataset."
    source_ids:
      - unido-jute-bag-factory-1990
      - sharma-alagh-pp-packaging-2021
      - eu-textiles-bref-2023
  - rule_id: validation_atomic_inventory
    applies_to: "Inventory rows"
    rule: "Reject grouped flow labels. Electricity, steam, each fuel, each refrigerant, water, each chemical, each packaging component, each waste stream and each direct emission must be represented by separate atomic exchanges."
    source_ids:
      - eu-textiles-bref-2023
      - eu-pef-2021
  - rule_id: validation_mass_balance
    applies_to: "Materials and outputs"
    rule: "Check process mass balances on compatible conditioning bases and require investigation and disclosure of residuals; waste and reusable scrap must not be silently netted from input."
    source_ids:
      - eu-pef-2021
  - rule_id: validation_allocation
    applies_to: "Shared processes"
    rule: "Confirm that subdivision was attempted first, every shared allocation uses a documented physical or justified economic driver, and allocated totals reconcile to source records."
    source_ids:
      - eu-pef-2021
  - rule_id: validation_product_conformity
    applies_to: "Woven PP sacks and FIBCs"
    rule: "Verify the declared applicable standard, capacity, construction, test and marking evidence; flag any claim that this PCR itself confers conformity."
    source_ids:
      - iso-23560-2015
      - iso-21898-2024
      - bis-is-14887-2014
  - rule_id: validation_ranges
    applies_to: "Quantitative ranges"
    rule: "Reject a range derived from one plant, one case, a search abstract, or identical lower and upper values. Accept an external empirical range only after two independent boundary-compatible original sources are documented."
    source_ids:
      - eu-pef-2021
  - rule_id: validation_uuid_status
    applies_to: "Tiangong identities"
    rule: "Reject the Sewn Bag UUID for the reference product. Keep every unresolved semantic flow without a UUID until an exact state-100 Tiangong identity is confirmed."
    source_ids: []
  - rule_id: validation_bilingual_alignment
    applies_to: "English and Chinese PCR"
    rule: "Confirm identical ordered rule ids, process ids, row ids, source ids and controlled tokens, with accurate Chinese names for every concrete unresolved flow."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production package for a route-specific textile sack or bag for packing goods; after review it may support a secondary_dataset or background_dataset projection"
  downstream_use: "Factory-gate process datasets and lifecycle models that require a specific empty packing sack or bag input with declared construction and geography"
  allowed_use: "Use for the declared material family, product subtype, capacity, construction, finishing system, facility technology, geography and reporting period; aggregation requires demonstrated representativeness"
  excluded_use: "Consumer bags; paper or non-textile film sacks; rigid containers; filled goods; dangerous-goods conformity without the applicable legal specification; use, reuse or end-of-life modelling not separately supplied"
  required_metadata: "PCR id and version; product subtype; intended packed good; capacity or safe working load; dimensions; full material composition; fabric construction and mass per area; liner/coating/printing/seam/FIBC component specification; net mass and conditioning state; included onsite operations; supplier gates; geography; technology; reporting period; allocation; cut-offs; UUID gaps; source ids"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; calibration; mass/water/energy reconciliation; route representativeness; upstream dataset quality; allocation sensitivity; product conformity evidence; unresolved flow identities and unresolved range evidence"
  update_trigger: "Change in material family, recycled content basis, capacity class, fabric or seam construction, liner/coating/printing system, FIBC design, supplier gate, technology, energy or fuel system, water/waste treatment, allocation driver, geography, applicable standard, product UUID availability or representative production mix"
