allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Foreground processes"
    rule: "Avoid allocation by subdividing independently metered substrate, conversion, finishing and packing operations and by preserving route-specific material and waste records."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_shared_utilities
    applies_to: "Shared meters and services"
    rule: "Allocate shared electricity, steam, fuel, compressed air, water and abatement by a documented physical driver such as metered machine time, mass processed or measured operating hours; disclose the driver and unallocated total."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_multiple_products
    applies_to: "Multiple bag products"
    rule: "Use a causal physical relationship when products jointly use a process. If no defensible physical relation exists, use an economic relation and report a sensitivity result; do not average materially different products without representativeness evidence."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_scrap_treatment
    applies_to: "Reusable or recyclable production scrap"
    rule: "Record the full scrap mass and treatment destination. Do not net scrap from material input or grant an avoided-product credit inside the gate-to-gate foreground inventory unless the downstream method explicitly requires and documents that treatment."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_rework
    applies_to: "Internal rework"
    rule: "Keep internal rework inside the process mass balance and include the energy and material needed to reprocess it; only material crossing the system boundary is reported as waste or co-product output."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_records
      process_id: "integrated_textile_substrate_bag_conversion_finishing"
      flow_role: "Resin, fibre, fabric, thread, film and component inputs"
      record_type: "Weighbridge, goods receipt, issue and stock records"
      raw_fields: "material identity; supplier; lot; opening stock; receipts; issues; closing stock; returned quantity; moisture/conditioning state"
      collection_method: "Reconcile issued mass from inventory movements and verified scales"
      unit: "kg"
      frequency: "Per lot with monthly reconciliation"
      temporal_coverage: "At least 12 consecutive representative months or the complete campaign"
      site_scope: "All controlled production lines in the declared dataset"
      aggregation_rule: "Sum net consumption by exact material identity; normalize after accepted-product reconciliation"
      quality_evidence: "Calibration records; supplier specification; lot traceability; stock reconciliation"
    - protocol_id: cp_chemical_records
      process_id: "integrated_textile_substrate_bag_conversion_finishing"
      flow_role: "Filler, masterbatch, batching oil, ink and adhesive inputs"
      record_type: "Batch sheet, formulation and issue records"
      raw_fields: "product identity; formulation; solids content; issued mass; recovered reusable mass; opening and closing stock"
      collection_method: "Weigh or meter each specific chemical product"
      unit: "kg"
      frequency: "Per batch with monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "Every controlled line using the chemical"
      aggregation_rule: "Net consumption equals issue minus recovered reusable material and stock change"
      quality_evidence: "Scale calibration; safety/technical data sheet; batch sign-off"
    - protocol_id: cp_energy_records
      process_id: "integrated_textile_substrate_bag_conversion_finishing"
      flow_role: "Electricity and each fuel"
      record_type: "Meter, invoice and equipment-hour records"
      raw_fields: "meter id; opening/closing reading; fuel quantity; unit; calorific value; line hours; allocation driver"
      collection_method: "Prefer dedicated meters; otherwise reconcile invoice total and physical allocation driver"
      unit: "kWh; MJ; Nm3"
      frequency: "Continuous or per invoice, reconciled monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "All included equipment and shared services"
      aggregation_rule: "Convert with documented factors; preserve each carrier; allocation totals must equal the facility record"
      quality_evidence: "Meter calibration; invoices; fuel certificate; allocation reconciliation"
    - protocol_id: cp_water_steam_records
      process_id: "integrated_textile_substrate_bag_conversion_finishing"
      flow_role: "Process water and purchased steam"
      record_type: "Meter, batch and supplier records"
      raw_fields: "water volume; steam mass; pressure; temperature; condensate return; reuse; evaporation estimate"
      collection_method: "Dedicated meter or documented batch recipe reconciled to site total"
      unit: "m3; kg"
      frequency: "Per batch or continuous, reconciled monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "All included wet, cooling and steam-using operations"
      aggregation_rule: "Preserve water and steam separately; reconcile water intake and discharge"
      quality_evidence: "Meter calibration; supplier statement; water balance"
    - protocol_id: cp_output_records
      process_id: "integrated_textile_substrate_bag_conversion_finishing"
      flow_role: "Intermediate and accepted product outputs"
      record_type: "Production and quality-release records"
      raw_fields: "product id; lot; gross mass; detachable packaging mass; net mass; item count; rejected mass; conditioning state"
      collection_method: "Weigh transferred and accepted outputs on calibrated scales"
      unit: "kg; item"
      frequency: "Per lot"
      temporal_coverage: "Same period as input records"
      site_scope: "All included lines and inspection points"
      aggregation_rule: "Sum accepted net mass by exact product specification; exclude detachable packaging"
      quality_evidence: "Scale calibration; release certificate; count-to-mass sample"
    - protocol_id: cp_waste_records
      process_id: "integrated_textile_substrate_bag_conversion_finishing"
      flow_role: "Each solid or liquid waste other than wastewater"
      record_type: "Waste log, container weight and transfer note"
      raw_fields: "waste identity; source process; gross/tare/net mass; contamination; destination; recovery or treatment route"
      collection_method: "Weigh each waste stream at transfer"
      unit: "kg"
      frequency: "Per transfer with monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "All included processes and storage points"
      aggregation_rule: "Sum by one material, contamination state and destination; no netting from inputs"
      quality_evidence: "Scale calibration; transfer note; contractor receipt"
    - protocol_id: cp_wastewater_records
      process_id: "integrated_textile_substrate_bag_conversion_finishing"
      flow_role: "Each wastewater stream"
      record_type: "Flow meter, batch discharge and treatment record"
      raw_fields: "source process; volume; density if used; treatment hand-off; monitored composition"
      collection_method: "Meter discharge or document batch volume at the treatment boundary"
      unit: "m3; kg"
      frequency: "Continuous or per batch, reconciled monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "All included wet and cleaning operations"
      aggregation_rule: "Sum by composition and receiving treatment; reconcile with water balance"
      quality_evidence: "Meter calibration; sampling record; treatment receipt"
    - protocol_id: cp_direct_emission_records
      process_id: "integrated_textile_substrate_bag_conversion_finishing"
      flow_role: "Each direct air emission"
      record_type: "Stack test, continuous monitor, permit calculation and fuel record"
      raw_fields: "substance; compartment; concentration; gas flow; duration; fuel amount; factor source"
      collection_method: "Prefer measured emissions; otherwise use an approved calculation tied to collected activity data"
      unit: "kg"
      frequency: "Per monitoring schedule and monthly calculation"
      temporal_coverage: "Same period as product output"
      site_scope: "Every onsite combustion, printing, coating and abatement source"
      aggregation_rule: "Calculate each substance separately and reconcile operating hours"
      quality_evidence: "Laboratory report; monitor calibration; permit factor; calculation sheet"
    - protocol_id: cp_refrigerant_records
      process_id: "bag_conversion_finishing"
      flow_role: "Each refrigerant loss"
      record_type: "Refrigerant service and stock record"
      raw_fields: "refrigerant identity; opening charge; purchase; addition; recovery; closing charge"
      collection_method: "Annual or campaign stock balance for each refrigerant"
      unit: "kg"
      frequency: "Per service event with annual reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "All included cooling systems"
      aggregation_rule: "Loss equals opening stock plus purchases minus recovery and closing stock, checked against service records"
      quality_evidence: "Technician record; cylinder weights; equipment register"
    - protocol_id: cp_packaging_records
      process_id: "bag_conversion_finishing"
      flow_role: "Each detachable dispatch packaging input"
      record_type: "Packing bill and material issue record"
      raw_fields: "packaging identity; issued mass; returned mass; packed product mass; shipment id"
      collection_method: "Weigh or calculate from verified unit mass and count"
      unit: "kg"
      frequency: "Per shipment with monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "All factory-gate dispatch packing"
      aggregation_rule: "Sum each packaging material separately and normalize to net product mass"
      quality_evidence: "Supplier specification; unit-mass sample; shipment reconciliation"
    - protocol_id: cp_quality_test_records
      process_id: "bag_conversion_finishing"
      flow_role: "Product conformity and qualifiers"
      record_type: "Specification, test and inspection records"
      raw_fields: "subtype; capacity; dimensions; mass; weave; seam; strength; coating; liner; lifting components; marking; result"
      collection_method: "Apply the declared product-specific standard and sampling plan"
      unit: "declared test units"
      frequency: "Per production lot"
      temporal_coverage: "Same period as product output"
      site_scope: "All released products"
      aggregation_rule: "Link each accepted mass to a passed or dispositioned lot"
      quality_evidence: "Test report; equipment calibration; release authorization"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "All inventory rows"
      rule: "Normalized amount = reporting-period exchange amount / reporting-period net accepted product mass."
      inputs:
        - "Collected exchange amount"
        - "net accepted product mass"
      output: "Exchange per 1 kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_inventory_consumption
      applies_to: "Materials and chemicals"
      rule: "Net consumption = opening stock + receipts - closing stock - documented return to supplier or reusable recovery."
      inputs:
        - "Stock and issue records"
      output: "Net consumed mass by atomic material identity"
      source_ids:
        - eu-pef-2021
    - id: calc_item_to_mass
      applies_to: "Count-based records"
      rule: "Product or reject mass = item count × representative measured mass per item for the same lot and subtype."
      inputs:
        - "Item count"
        - "sample mass"
        - "sample count"
      output: "Lot-specific product or reject mass"
      source_ids:
        - iso-23560-2015
        - iso-21898-2024
    - id: calc_material_balance
      applies_to: "Each process"
      rule: "Inputs = transferred product + accepted product + wastes + emissions + documented stock change, evaluated on compatible mass and moisture bases; investigate and disclose residuals."
      inputs:
        - "Material inputs"
        - outputs
        - wastes
        - emissions
        - "stock change"
      output: "Process material-balance residual"
      source_ids:
        - eu-pef-2021
    - id: calc_shared_utility
      applies_to: "Shared utilities"
      rule: "Allocated utility = reconciled facility total × documented physical driver share; allocated shares must sum to the source total."
      inputs:
        - "Facility total"
        - "driver values by process/product"
      output: "Utility amount assigned to each product"
      source_ids:
        - eu-pef-2021
    - id: calc_fuel_emissions
      applies_to: "Onsite combustion"
      rule: "Direct emission = collected fuel activity × documented site, supplier or authoritative emission factor; calculate each substance and fuel separately."
      inputs:
        - "Fuel amount"
        - "calorific conversion"
        - "emission factor"
      output: "Direct substance emission"
      source_ids:
        - eu-textiles-bref-2023
    - id: calc_refrigerant_loss
      applies_to: "Cooling systems"
      rule: "Refrigerant loss = opening charge + purchases/additions - recovered amount - closing charge, reconciled to service events."
      inputs:
        - "Refrigerant stock and service records"
      output: "Loss of one refrigerant to air"
      source_ids:
        - eu-pef-2021
    - id: calc_net_product_mass
      applies_to: "Reference product"
      rule: "Net product mass = gross released mass - detachable dispatch packaging mass; permanently attached liners and fittings remain in product mass."
      inputs:
        - "Gross mass"
        - "packaging mass"
        - "construction record"
      output: "Net accepted reference-product mass"
      source_ids:
        - iso-23560-2015
        - iso-21898-2024
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and all exchanges"
      requirement: "Preserve exact product subtype, material chemistry, grade, construction, conditioning state, supplier gate and route; do not merge semantically different flows."
      evidence: "Specifications, supplier records, batch sheets and flow mapping review"
    - id: dq_temporal
      applies_to: "Foreground dataset"
      requirement: "Cover at least 12 consecutive representative months or the entire shorter campaign, and explain shutdowns, start-up, abnormal production and seasonality."
      evidence: "Reporting-period calendar and production log"
    - id: dq_completeness
      applies_to: "Inputs and outputs"
      requirement: "Reconcile purchases, issues, stock, accepted output, rejects, waste, wastewater and direct emissions; disclose every exclusion and unquantified stream."
      evidence: "Mass, water and energy balance with signed gap review"
    - id: dq_measurement
      applies_to: "Meters and scales"
      requirement: "Use calibrated instruments suitable for the measured range and retain raw readings before conversion or allocation."
      evidence: "Calibration certificate, meter register and raw record"
    - id: dq_representativeness
      applies_to: "Aggregated dataset"
      requirement: "Demonstrate representativeness before combining different fibre/polymer families, capacities, coated and uncoated products, FIBCs and small sacks, or integrated and conversion-only routes."
      evidence: "Production-share analysis and route-specific sensitivity"
    - id: dq_source_traceability
      applies_to: "Method and external evidence"
