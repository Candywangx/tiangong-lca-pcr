      record_type: "warehouse issue, return, scale, and work-in-progress records"
      raw_fields: "batch_id; supplier_product_id; material_composition; opening_mass; issued_mass; returned_mass; closing_mass; transfer_mass; moisture_or_conditioning_state"
      collection_method: "Calibrated weighing and batch reconciliation"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Representative continuous 12-month period or all batches in a shorter declared campaign"
      site_scope: "All in-scope lines and storage points"
      aggregation_rule: "Sum net issues and transfers by exact material; reconcile opening + receipts - returns - closing inventory to outputs and waste; normalize to net saleable output"
      quality_evidence: "Scale calibration; supplier specification; stock reconciliation; exception log"
