allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared embroidery lines and support systems"
    rule: "First avoid allocation through batch-level metering, time-resolved records, equipment subdivision, or separate production runs."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical
    applies_to: "Shared electricity, preparation, inspection, and packing burdens"
    rule: "When subdivision is not feasible, allocate using a documented physical driver causally related to resource use, such as machine operating time, stitch count, compressed-air operating time, processed substrate mass, or packed mass. Do not use output mass alone when stitch density or machine time materially drives consumption."
    source_ids:
      - eu-pef-method-2021
      - cay-embroidery-energy-2018
  - rule_id: allocation_rejects
    applies_to: "Saleable output and rejected embroidery"
    rule: "Assign inputs and processing burdens to the batch before separating saleable output from rejects. Credit recycling or recovered material only under the declared downstream modelling method; do not subtract waste mass from input records without traceable internal reuse."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_economic_exception
    applies_to: "Joint products lacking a defensible physical relationship"
    rule: "Use economic allocation only when subdivision and a causal physical relationship are not feasible; document prices, period, currency, calculation, and sensitivity."
    source_ids:
      - eu-pef-method-2021
