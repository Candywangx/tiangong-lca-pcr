  calculation_rules:
    - id: calc_normalized_exchange
      applies_to: "Every inventory row"
      rule: "normalized exchange = collected exchange for the batch / net saleable embroidery mass from the same batch"
      inputs:
        - "collected exchange"
        - "net saleable mass"
      output: "row-specific unit per kg net saleable embroidery"
      source_ids:
        - eu-pef-method-2021
    - id: calc_thread_consumption
      applies_to: "Each embroidery-thread product"
      rule: "net thread consumption = issued thread mass - usable returned thread mass - closing stock increase; reconcile the result with incorporated thread and thread-trimming waste"
      inputs:
        - "thread issue"
        - return
        - stock
        - product
        - "and waste records"
      output: "kg thread consumed per batch and per kg product"
      source_ids: []
    - id: calc_batch_mass_balance
      applies_to: "Substrate, backing, thread, product, and textile waste"
      rule: "mass-balance residual = total material inputs + opening work-in-progress - net saleable output - separately measured waste - closing work-in-progress - documented returns; investigate and disclose non-zero residuals"
      inputs:
        - material
        - output
        - waste
        - return
        - "and work-in-progress records"
      output: "kg and % of material input"
      source_ids: []
    - id: calc_shared_electricity
      applies_to: "Shared electricity meters"
      rule: "allocated electricity = shared meter consumption x declared causal-driver share; report meter total, all allocation shares, and residual"
      inputs:
        - "meter consumption"
        - "machine time"
        - "stitch count"
        - "compressor time"
        - "processed mass"
        - "or another documented causal driver"
      output: "kWh assigned to the batch"
      source_ids:
        - eu-pef-method-2021
        - cay-embroidery-energy-2018
    - id: calc_supplementary_area
      applies_to: "Piece, strip, or motif reporting"
      rule: "Determine product and embroidered area from controlled dimensions or design data; state treatment of repeats, open areas, and partial motifs"
      inputs:
        - width
        - length
        - "motif count"
        - "motif dimensions"
        - "digitized embroidered area"
      output: "m2 per kg and declared form-specific supplementary result"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product, substrate, thread, backing, packaging, and waste"
      requirement: "Preserve exact supplier product or waste-stream identity, composition, production route, and Tiangong UUID where verified; unresolved UUIDs shall not be replaced with broader collection flows."
      evidence: "Supplier specifications; batch genealogy; composition records; UUID verification record"
    - id: dq_temporal
      applies_to: "Foreground activity data"
      requirement: "Use a representative continuous 12-month period where available. Shorter campaigns shall state dates, coverage, seasonality, product mix, downtime, and why the period is representative."
      evidence: "Meter dates; production calendar; coverage calculation; campaign justification"
    - id: dq_completeness
      applies_to: "Material and energy balance"
      requirement: "Include all route-defining materials, electricity, measured wastes, and actual finishing operations. Quantify and justify exclusions and demonstrate that they meet the declared cut-off rule."
      evidence: "Completeness checklist; mass balance; energy reconciliation; cut-off assessment"
    - id: dq_measurement
      applies_to: "Mass, electricity, dimensions, and counts"
      requirement: "Use calibrated instruments or verified supplier/utility records; retain units, resolution, uncertainty where available, and conversion factors."
      evidence: "Calibration certificates; utility bills; scale and meter checks; conversion worksheet"
    - id: dq_representativeness
      applies_to: "Upstream and treatment datasets"
      requirement: "Match geography, technology, time, substrate/thread/backing composition, electricity supply, packaging grade, and waste destination as closely as practicable; disclose proxies and their limitations."
      evidence: "Dataset selection log; data-quality rating; proxy justification"
    - id: dq_conditioning
      applies_to: "Textile mass comparisons"
      requirement: "Use one declared moisture or conditioning basis for substrate, intermediates, product, and textile waste or document corrections explicitly."
      evidence: "ISO 139 conditioning record or equivalent; moisture measurement; correction worksheet"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Product category and reference flow"
    rule: "Confirm exact CPC 27913 scope, piece/strip/motif form, reference UUID, Mass property, kg unit, and all required qualifiers; reject downstream garments, lace, tulle, tufted, quilted, or service-only outputs."
    source_ids:
      - un-cpc-3-0-27913-2025
  - rule_id: validate_atomic_inventory
    applies_to: "Process inventory"
    rule: "Confirm every card represents one concrete material, energy, waste, or product exchange. Reject combined utilities, mixed material selectors, plural waste collections, and UUIDs that were not confirmed by exact public-row readback."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "Substrate, backing, thread, product, rejects, waste, and work-in-progress"
    rule: "Require a batch mass-balance calculation and investigation of unexplained residuals; do not force closure by changing measured records."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_electricity
    applies_to: "Preparation, embroidery, and finalization electricity"
    rule: "Confirm meter boundaries, allocation drivers, operating periods, and kWh units. Shared electricity shall reconcile to the meter total without overlap or omitted residual."
    source_ids:
      - cay-embroidery-energy-2018
      - eu-pef-method-2021
  - rule_id: validate_composition
    applies_to: "Substrate, thread, and retained backing"
    rule: "Confirm declared composition from supplier records and representative verification; where ISO 1833 is used, record the applicable part, sampling, result, and tolerance."
    source_ids:
      - iso-1833-fibre-analysis-2020
  - rule_id: validate_conditioning
    applies_to: "Reference and balance masses"
    rule: "Confirm that textile masses share a declared conditioning or moisture basis and that packaging is excluded from the reference amount."
    source_ids:
      - iso-139-conditioning-2005
  - rule_id: validate_sources_and_quality
    applies_to: "Dataset package"
    rule: "Confirm all cited sources resolve, foreground records cover the declared period and site, proxies and cut-offs are disclosed, and unresolved UUIDs remain explicit."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "Foreground embroidery-manufacturing dataset that may be published as a secondary_dataset or background_dataset after review and completion"
  downstream_use: "Product-system modelling of embroidery supplied in piece, strip, or motif form and incorporation into downstream apparel, furnishing, accessory, or other textile-product models"
  allowed_use: "Use when product form, substrate, thread, backing, stitch construction, equipment route, electricity supply, finishing state, geography, production period, and gate boundary are materially representative"
  excluded_use: "Do not use as a proxy for lace, tulle, tufted or quilted textiles, embroidery services without product output, embroidered garments or made-up articles, or materially different substrate/thread/finishing routes without documented adjustment"
  required_metadata: "PCR id and version; product form; CPC reference; reference-flow UUID; substrate, thread, backing, and packaging identities and composition; stitch type/count/density; dimensions and embroidered area; conditioning state; site and period; process coverage; electricity supply; allocation; cut-offs; waste destinations; upstream datasets; unresolved identities"
  required_quality_disclosure: "Primary-data coverage; instrument and calibration evidence; mass-balance residual; meter allocation; temporal, geographical, and technological representativeness; composition verification; proxy use; exclusions; uncertainty; review status"
  update_trigger: "Change in product form, substrate/thread/backing composition, stitch construction, machine technology, compressor arrangement, electricity supply, finishing route, packaging, waste treatment, site, allocation method, or production mix that materially changes the inventory"
data_sources:
  - id: "un-cpc-3-0-27913-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 explanatory notes, subclass 27913, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Exact product-category scope and exclusions from neighbouring textile categories"
  - id: "eu-pef-method-2021"
