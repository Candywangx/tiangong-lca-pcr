    reference: "European Commission Recommendation (EU) 2021/2279, Annex I, Product Environmental Footprint Method. https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng"
    used_for: "Functional unit and reference flow, system boundary, company-specific data, allocation hierarchy, cut-off disclosure, data quality, validation, and proxy reporting"
  - id: "iso-139-conditioning-2005"
    type: "standard"
    reference: "ISO 139:2005, Textiles — Standard atmospheres for conditioning and testing; confirmed 2025. https://www.iso.org/standard/35179.html"
    used_for: "Consistent textile conditioning and mass-comparison evidence"
  - id: "iso-1833-fibre-analysis-2020"
    type: "standard"
    reference: "ISO 1833-1:2020, Textiles — Quantitative chemical analysis — Part 1: General principles of testing. https://www.iso.org/standard/74881.html"
    used_for: "Quantitative fibre-composition verification for substrate, thread, and retained textile backing"
  - id: "iso-4915-stitch-types-1991"
    type: "standard"
    reference: "ISO 4915:1991, Textiles — Stitch types — Classification and terminology; confirmed 2021. https://www.iso.org/standard/10932.html"
    used_for: "Consistent declaration of stitch construction and process/product qualifiers"
  - id: "cay-embroidery-energy-2018"
    type: "literature"
    reference: "Çay, A. (2018). Energy consumption and energy saving potential in clothing industry. Energy, 159, 74–85. https://doi.org/10.1016/j.energy.2018.06.128"
    used_for: "Peer-reviewed evidence that embroidery plants require explicit foreground electricity and direct-support energy records and that machine, compressor, and lighting loads should be measured or causally allocated"
