      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report exactly 1,000 kg net saleable nonwoven. Exclude roll cores, wrappers, cartons, pallets, edge trim and off-spec output from the reference amount."
  - id: conditioned_mass_basis
    applies_to: "Fibre inputs, intermediates, wastes and product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use one declared moisture or conditioning basis throughout the material balance. Do not combine oven-dry, conditioned and as-received masses without measured moisture and an explicit conversion."
  - id: basis_weight_measurement
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass per unit area"
      uuid: ""
    required_unit: "g/m2"
    rule: "Determine mass per unit area using ISO 9073-1:2023 or a documented equivalent. Retain specimen area, specimen mass, sampling position and conditioning record."
  - id: thickness_measurement
    applies_to: "Reference product"
    required_property_ref:
      name: "Length"
      uuid: ""
    required_unit: "mm"
    rule: "Report thickness with the applicable test method, pressure and conditioning state; do not compare thickness values measured under different pressures without disclosure."
  - id: tensile_measurement
    applies_to: "Reference product"
    required_property_ref:
      name: "Force and elongation"
      uuid: ""
    required_unit: "N and %"
    rule: "Report machine- and cross-direction results separately when tensile performance is a product qualifier, with specimen width, gauge length and conditioning stated."
  - id: composition_mass_fraction
    applies_to: "Fibre, polymer, binder and product composition"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "kg/kg"
    rule: "Record every intentionally added fibre, polymer and binder separately on a dry or declared conditioned basis. Fractions must reconcile with the declared product composition."
  - id: energy_carrier_separation
    applies_to: "Electricity, compressed air, steam, purchased heat and fuels"
    required_property_ref:
      name: "Energy or delivered service"
      uuid: ""
    required_unit: "kWh, MJ or Nm3"
    rule: "Preserve each carrier and meter basis. Do not combine electricity, steam, heat, compressed air or fuel into one energy row."
  - id: water_balance_units
    applies_to: "Wetlaid, hydroentanglement, washing and aqueous finishing"
    required_property_ref:
      name: "Volume or Mass"
      uuid: ""
    required_unit: "m3 or kg"
    rule: "Keep fresh intake, reused water, evaporation or carry-over and wastewater separate. State density and temperature assumptions for mass-volume conversion."
