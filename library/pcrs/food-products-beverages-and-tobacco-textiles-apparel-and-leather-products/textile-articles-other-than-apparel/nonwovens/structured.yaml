allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Multi-line and multi-product operations"
    rule: "Prefer process subdivision and route-, line- or product-specific metering. Do not allocate an avoidable shared exchange."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: allocation_shared_utilities
    applies_to: "Shared electricity, steam, compressed air, water and treatment"
    rule: "When subdivision is not possible, use a documented causal driver such as metered runtime multiplied by measured load, steam demand, water flow or treated pollutant load. Use product mass only when no more causal driver is available and disclose sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_internal_recycling
    applies_to: "Clean fibre, web and edge trim returned within the same foreground system"
    rule: "Record gross generation and gross return, but cancel the internal loop once in the net external inventory. Allocate collection and reprocessing energy to the process that uses it; do not claim avoided-product credit."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_exported_material
    applies_to: "Sold or exported off-spec nonwoven, fibre or polymer residue"
    rule: "Treat an exported material as a co-product only when it has a documented market and specification. Apply the PEF allocation hierarchy and report the method, driver, burden share and sensitivity; otherwise treat it as waste with its actual treatment."
    source_ids:
      - eu-pef-method-2021
      - iso-14044-2006
  - rule_id: allocation_reusable_packaging
    applies_to: "Reusable cores, pallets or containers"
    rule: "Allocate manufacturing and return burdens over documented trips or use cycles. Do not assume a reuse count without inventory records, loss rate and end-of-life disclosure."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_feedstock_records
      process_id: "feedstock_web_formation_web_consolidation"
      flow_role: "Polymer, fibre, pulp and bonding-fibre inputs"
      record_type: "Supplier specification, receipt, weigh ticket and stock ledger"
      raw_fields: "lot_id, supplier, material_identity, grade, polymer_or_fibre, mass_fraction, virgin_or_recycled_status, moisture, dry_solids, gross_mass, tare_mass, net_mass, receipt_time, process_id"
      collection_method: "Match every lot to supplier evidence and reconcile weighed use with stock change"
      unit: "kg and kg/kg"
      frequency: "Each receipt and issue; reconcile monthly or by campaign"
      temporal_coverage: "Same representative period as output"
      site_scope: "Every included facility, line and product stratum"
      aggregation_rule: "Aggregate only identical material and route strata after stock reconciliation"
      quality_evidence: "Calibrated scale, supplier certificate, lot traceability and signed stock reconciliation"
    - protocol_id: cp_energy_records
      process_id: "all_processes"
      flow_role: "Electricity, compressed air and purchased steam"
      record_type: "Submeter, utility invoice, flow meter or equipment runtime record"
      raw_fields: "carrier, meter_id, opening_reading, closing_reading, pressure, enthalpy_basis, equipment_id, runtime, measured_load, process_id, lot_or_period"
      collection_method: "Prefer process submetering; otherwise apply a documented causal allocation"
      unit: "kWh, MJ or Nm3"
      frequency: "Continuous or each batch; aggregate by matched period"
      temporal_coverage: "Representative normal-operation period"
      site_scope: "Every included line and utility"
      aggregation_rule: "Preserve each carrier and process; subtract non-production use where measured"
      quality_evidence: "Meter calibration, invoices, runtime log, load evidence and allocation worksheet"
    - protocol_id: cp_water_records
      process_id: "route_dependent_wet_processes"
      flow_role: "Fresh water, recirculation and wastewater"
      record_type: "Intake and discharge meter, tank record and laboratory analysis"
      raw_fields: "water_source, intake_volume, recirculated_volume, discharge_volume, carryover_or_evaporation, sample_time, substance, concentration, treatment_state, process_id"
      collection_method: "Build a process water balance and match samples with discharge volume"
      unit: "m3, kg and mg/L as applicable"
      frequency: "Continuous meter; sample according to permit and risk"
      temporal_coverage: "Same wet-route period as output"
      site_scope: "All wet circuits, treatment units and discharge points"
      aggregation_rule: "Keep fresh, internal reuse and discharge separate; calculate each pollutant load separately"
      quality_evidence: "Meter calibration, sampling plan, chain of custody, accredited result and balance reconciliation"
    - protocol_id: cp_chemical_records
      process_id: "web_consolidation_finishing_drying"
      flow_role: "Latex and individual finishing chemicals"
      record_type: "Recipe, batch dosing sheet, purchase issue, SDS and stock ledger"
      raw_fields: "product_name, supplier, function, composition, active_fraction, dose, opening_stock, receipts, closing_stock, lot_id, process_id"
      collection_method: "Record each commercial product separately and reconcile dose with stock change"
      unit: "kg commercial product and kg active substance"
      frequency: "Each batch or dosing event; reconcile monthly"
      temporal_coverage: "Same route and period as output"
      site_scope: "Every line applying the chemical"
      aggregation_rule: "Never aggregate different formulations; normalize commercial and active mass separately"
      quality_evidence: "Calibrated dosing record, signed recipe, SDS or composition certificate and stock reconciliation"
    - protocol_id: cp_mass_balance
      process_id: "all_processes"
      flow_role: "Feed, intermediates, product, internal return and removed material"
      record_type: "Hopper, bale, roll or platform scale and work-in-progress ledger"
      raw_fields: "process_id, lot_id, input_mass, output_mass, internal_return_mass, exported_waste_mass, opening_wip, closing_wip, moisture_basis"
      collection_method: "Construct process and line mass balances on one conditioning basis"
      unit: "kg"
      frequency: "Each lot where feasible; otherwise each shift or campaign"
      temporal_coverage: "Matched input-output period"
      site_scope: "Every included route and line"
      aggregation_rule: "Retain gross internal loops; use net external values only after reconciliation"
      quality_evidence: "Scale calibration, signed balance and reason for every unexplained difference"
    - protocol_id: cp_air_emissions
      process_id: "emission_relevant_processes"
      flow_role: "One named air substance per record"
      record_type: "Stack test, continuous monitor or substance-specific calculation"
      raw_fields: "emission_point, substance, compartment, concentration, gas_flow, operating_time, abatement_state, production_mass, method, detection_limit"
      collection_method: "Match concentration and flow in time or use a validated facility-specific factor"
      unit: "kg substance, mg/Nm3 and Nm3"
      frequency: "According to permit and process risk; repeat after material change"
      temporal_coverage: "Representative operating condition"
      site_scope: "Every relevant emission point"
      aggregation_rule: "Calculate each substance separately; do not combine VOCs, particles or compartments"
      quality_evidence: "Laboratory report, instrument calibration, sampling plan and operating log"
    - protocol_id: cp_waste_records
      process_id: "all_processes"
      flow_role: "One identified waste stream per record"
      record_type: "Container scale, waste manifest and treatment receipt"
      raw_fields: "waste_identity, composition, process_id, gross_mass, tare_mass, moisture_or_dry_solids, internal_return, destination, treatment, date"
      collection_method: "Weigh each stream and link it to the generating process and disposition"
      unit: "kg wet and kg dry where applicable"
      frequency: "Each container or shipment"
      temporal_coverage: "Same period as output"
      site_scope: "Every included process"
      aggregation_rule: "Keep waste identity, moisture and destination strata separate"
      quality_evidence: "Scale record, manifest, treatment receipt and composition evidence"
    - protocol_id: cp_packaging_records
      process_id: "slitting_packaging"
      flow_role: "Individual packaging component and packaging waste"
      record_type: "Bill of materials, unit-weight test and stock ledger"
      raw_fields: "component, material, grade, recycled_content, unit_mass, units_used, stock_change, shipped_units, damaged_units, waste_mass"
      collection_method: "Reconcile packaging issued, shipped and discarded by material"
      unit: "kg"
      frequency: "Each dispatch campaign; reconcile monthly"
      temporal_coverage: "Same period as reference output"
      site_scope: "Every packaging format"
      aggregation_rule: "Preserve each material and reuse status"
      quality_evidence: "Pack specification, unit-weight check, stock record and waste receipt"
    - protocol_id: cp_reference_output
      process_id: "slitting_packaging"
      flow_role: "Net reference product and qualifiers"
      record_type: "Calibrated scale, roll map, release record and laboratory test"
      raw_fields: "lot_id, gross_roll_mass, core_mass, external_packaging_tare, net_nonwoven_mass, composition, recycled_content, formation_route, bonding_route, finish, basis_weight, width, thickness, tensile_results, moisture_basis, geography, release_time"
      collection_method: "Calculate net product mass and verify all required qualifiers before release"
      unit: "kg and declared test units"
      frequency: "Every released lot"
      temporal_coverage: "Same period as normalized inputs and outputs"
      site_scope: "Every represented product and line"
      aggregation_rule: "Keep product strata separate until representativeness review"
      quality_evidence: "Scale calibration, release certificate, ISO-method test records and lot traceability"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "Released product lot"
      rule: "net_nonwoven_mass = gross_roll_or_pack_mass - roll_core_mass - external_packaging_tare"
      inputs:
        - "gross mass"
        - "core mass"
        - "packaging tare"
      output: "kg net nonwoven"
      source_ids:
        - iso-9073-1-2023
        - eu-pef-method-2021
    - id: calc_normalize_1000kg
      applies_to: "Every foreground exchange"
      rule: "normalized_amount = matched_period_or_lot_amount / matched_net_nonwoven_mass * 1000 kg"
      inputs:
        - "exchange amount"
        - "matched net product mass"
      output: "amount per 1,000 kg net nonwoven"
      source_ids:
        - eu-pef-method-2021
    - id: calc_basis_weight
      applies_to: "Reference product"
      rule: "basis_weight = conditioned_specimen_mass / specimen_area with ISO 9073-1 sampling and precision"
      inputs:
        - "specimen mass"
        - "specimen area"
      output: "g/m2"
      source_ids:
        - iso-9073-1-2023
    - id: calc_conditioned_mass
      applies_to: "Material converted between moisture states"
      rule: "target_mass = measured_mass * (1 - measured_initial_moisture_fraction) / (1 - declared_target_moisture_fraction); use consistent wet- or dry-basis fractions"
      inputs:
        - "measured mass"
        - "initial moisture"
        - "target moisture"
      output: "kg at declared conditioning state"
      source_ids:
        - eu-pef-method-2021
    - id: calc_process_mass_balance
      applies_to: "Each process and matched period"
      rule: "unexplained_difference = inputs + opening_wip - outputs - exported_waste - closing_wip; internal returns cancel within the same system"
      inputs:
        - inputs
        - outputs
        - wastes
        - "opening and closing WIP"
        - "internal returns"
      output: "kg unexplained difference"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_water_pollutant_load
      applies_to: "Direct wastewater discharge"
      rule: "substance_mass = matched_concentration * matched_discharge_volume with explicit unit conversion"
      inputs:
        - "substance concentration"
        - "discharge volume"
        - "sample period"
      output: "kg named substance"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_air_mass_load
      applies_to: "Channelled air emission"
      rule: "substance_mass = concentration * gas_flow_on_same_reference_basis * operating_time with explicit conversion"
      inputs:
        - concentration
        - "gas flow"
        - "operating time"
        - "reference conditions"
      output: "kg named substance"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_shared_utility
      applies_to: "Shared utility without submeter"
      rule: "Allocate by a documented causal driver; if none is available, disclose the gap and test a mass-allocation sensitivity rather than claiming measured site specificity"
      inputs:
        - "shared amount"
        - "causal driver"
        - "product strata"
      output: "allocated kWh, MJ, Nm3 or m3"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Inputs, intermediates and output"
      requirement: "Trace each released lot through feedstock lots, route, bonding, finishing, converting and tests; retain the exact CPC 27922 product identity."
      evidence: "Supplier records, route traveller, batch record, roll map and release certificate; un-cpc-v3-2025"
    - id: dq_route_representativeness
      applies_to: "Aggregated datasets"
      requirement: "Do not aggregate materially different composition, recycled-content, formation, bonding, finishing, basis-weight or line strata without a documented representativeness test."
      evidence: "Disaggregated inventory and aggregation review; eu-pef-method-2021; gaynor-nonwovens-2022"
    - id: dq_temporal_match
      applies_to: "All foreground data"
      requirement: "Match material, energy, water, waste, emissions and output to the same representative normal-operation period; identify startup, shutdown, maintenance and abnormal production."
      evidence: "Dated ledgers, meter periods and operating log; eu-pef-method-2021"
    - id: dq_measurement_quality
      applies_to: "Mass, utilities, tests and emissions"
      requirement: "Retain instrument identity, calibration or verification, method, sample location, detection limit and unit conversion. State whether each value is measured or calculated."
      evidence: "Calibration certificates, laboratory reports, meter exports and calculation workbook"
    - id: dq_completeness
      applies_to: "Included foreground processes"
      requirement: "Include every known individual material, utility, product, waste and direct-emission exchange. A missing Tiangong UUID does not justify omission."
      evidence: "Input-output register, material and water balances, waste manifests and emission-point register; eu-textiles-bat-2022"
    - id: dq_chemical_specificity
      applies_to: "Binder and finishing chemistry"
      requirement: "Record each commercial formulation as one product input and each reported emitted substance as one elementary flow; retain active fraction and SDS information."
      evidence: "Recipe, SDS, supplier composition, dosing and substance-specific monitoring; ec-jrc-txt-bref-2023"
    - id: dq_product_testing
      applies_to: "Reference product"
      requirement: "Use representative conditioned specimens and report basis weight, width, thickness and applicable tensile or end-use performance methods with lot linkage."
      evidence: "ISO 9073 test record and release specification; iso-9073-1-2023; iso-9073-2-1995; iso-9073-3-2023"
    - id: dq_no_ai_ranges
      applies_to: "Quantitative inventory guidance"
      requirement: "This candidate defines no AI-authored amount range. Obtain values from foreground records and introduce a range only when reviewed route-specific evidence or a foreground distribution supports it."
      evidence: "Foreground collection record or reviewed range source and approval record"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "Reference flow"
    rule: "Require Product flow UUID dd37c0b0-8d07-452a-a62a-aaffa8c42b61, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66 and kg."
    source_ids:
      - un-cpc-v3-2025
  - rule_id: validation_scope
    applies_to: "Product category"
    rule: "Confirm that the output is a nonwoven sheet, web or batt classified as CPC 27922. Reject felt, wadding, paper, woven, knitted, tufted and downstream converted articles."
    source_ids:
      - un-cpc-v3-2025
      - iso-9092-2026
  - rule_id: validation_required_qualifiers
    applies_to: "Product metadata"
    rule: "Fail completeness when composition, recycled content, formation route, bonding route, multilayer construction, basis weight, width, thickness, finish, moisture basis, line, geography or reporting period is missing."
    source_ids:
      - iso-9073-1-2023
      - eu-pef-method-2021
  - rule_id: validation_process_inclusion
    applies_to: "Process map"
    rule: "Require feedstock_web_formation, web_consolidation and slitting_packaging; include finishing_drying whenever any declared washing, finishing, coating, impregnation, drying or heat setting occurs."
    source_ids:
      - gaynor-nonwovens-2022
      - ec-jrc-txt-bref-2023
  - rule_id: validation_atomic_exchanges
    applies_to: "Inventory rows"
    rule: "Require one physical or chemical exchange per row. Reject combined energy carriers, plural material selectors, grouped packaging, grouped wastes and generic emitted-substance collections."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_mass_balance
    applies_to: "Process and line inventory"
    rule: "Require one moisture basis, matched work-in-progress, gross internal-return disclosure, net packaging exclusion and a signed explanation for every material-balance difference."
    source_ids:
      - eu-textiles-bat-2022
      - eu-pef-method-2021
  - rule_id: validation_wet_routes
    applies_to: "Wetlaid, hydroentangled and aqueous-finished routes"
    rule: "Require fresh water, recirculation, pumping and drying energy, each chemical, wastewater, treatment sludge and each reported direct release when the route applies."
    source_ids:
      - ec-jrc-txt-bref-2023
      - eu-textiles-bat-2022
  - rule_id: validation_air_emissions
    applies_to: "Formation, bonding and finishing emission points"
    rule: "Require captured waste and residual emissions to remain separate; record each emitted substance and compartment separately with measurement or validated calculation evidence."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validation_allocation
    applies_to: "Shared and multi-output operations"
    rule: "Verify subdivision was attempted first and every remaining allocation uses a documented causal driver, calculation and sensitivity where required. Reject silent avoided-burden credits."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: validation_product_tests
    applies_to: "Released nonwoven"
    rule: "Verify that basis weight uses ISO 9073-1 or a documented equivalent and that thickness and tensile claims identify method, conditioning and direction."
    source_ids:
      - iso-9073-1-2023
      - iso-9073-2-1995
      - iso-9073-3-2023
  - rule_id: validation_temporal_completeness
    applies_to: "Foreground data package"
    rule: "Verify that input, output, utility, water, waste and emission records cover the same representative operating window and that abnormal periods and missing measurements are disclosed."
    source_ids:
      - eu-pef-method-2021
      - eu-textiles-bat-2022
published_dataset_profile:
  dataset_role: "Route-, product-, line- and facility-specific foreground dataset for CPC 27922 nonwoven production at the manufacturing-facility gate"
  downstream_use: "May become a secondary_dataset or background_dataset for downstream articles only after methodology review, inventory UUID completion and evidence review"
  allowed_use: "Model the disclosed composition, recycled-content basis, web-formation route, bonding route, finish, basis-weight class, multilayer construction, geography, line and period"
  excluded_use: "Generic proxy for felt, wadding, paper, woven or knitted fabric; fibre or polymer production; downstream converted articles; undisclosed route or composition substitution; use or end-of-life"
  required_metadata: "Canonical PCR id; CPC coordinate; reference UUIDs; composition; recycled content; feedstock origin; formation and bonding routes; finish; multilayer construction; basis weight; width; thickness; performance tests; moisture basis; facility, line, geography and period; upstream datasets; allocation; review state"
  required_quality_disclosure: "Foreground and secondary shares; calibration and method status; temporal, geographical and technological coverage; mass and water reconciliation; internal recycling; allocation; missing UUIDs; data gaps; abnormal periods; uncertainty and source versions"
  update_trigger: "Change in product classification, reference-flow identity, material or recycled content, route, binder or finish chemistry, equipment, line, abatement, water circuit, packaging, allocation, upstream data, legal requirement, BAT conclusion or test standard; or resolution of missing UUIDs and reviewed quantitative evidence"
