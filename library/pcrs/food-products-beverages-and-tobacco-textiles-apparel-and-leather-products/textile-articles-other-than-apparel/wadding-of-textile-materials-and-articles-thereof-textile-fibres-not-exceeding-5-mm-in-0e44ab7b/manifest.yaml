  scientific_review:
    status: pending
    limitations:
      - Candidate authored methodology; no scientific approval, publication or accepted mapping.
      - Narrow virgin PET and PET-core/copolyester-sheath binder, dry-carded electric hot-air route
        only; no full CPC coverage.
      - No measured factory recipe, temperature, yield, energy, lifetime or emission default
        supplied.
  semantic_boundary_decision:
    decision: new_narrow_semantic_method
    rationale: "The existing PCR ID is retained and its existing methodology upgraded in place. The
      scoped CPC mapping is accepted; scientific approval, translation review and publication retain
      their separately recorded states. Classification rationale: Cushioning wadding is within 5601
      only with the retained supplier-established wadding identity; the method expressly rejects
      felt, nonwoven and medical products despite similar machinery. Historical author assessment:
      docs/reviews/pcr149-original-ids-20261127/27991.json."
  unresolved_flow_identities:
    - row_id: binder_fibre
      selected_flow: PET-core copolyester-sheath low-melt bicomponent staple fibre
      reason: "No reviewed public read establishes PET-core/copolyester-sheath low-melt bicomponent
        staple. Generic virgin polyester staple cannot establish the binder architecture."
    - row_id: captured_fibre
      selected_flow: Captured PET and copolyester fibre dust
      reason: "No read establishes captured loose PET/copolyester dust waste with actual contamination;
        airborne particulate and fabric wastes are not equivalent."
    - row_id: finished_wadding
      selected_flow: Thermobonded polyester wadding
      reason: "Bounded specific and exact-title searches and public reads do not establish thermobonded
        polyester wadding; generic nonwoven, cotton blend and medical wadding identities are not
        substitutes."
    - row_id: wadding_trim
      selected_flow: PET and copolyester wadding edge trim
      reason: "Generic fabric wastes do not establish bonded PET/copolyester cushioning-wadding trim and
        treatment state."
  classification_decision:
