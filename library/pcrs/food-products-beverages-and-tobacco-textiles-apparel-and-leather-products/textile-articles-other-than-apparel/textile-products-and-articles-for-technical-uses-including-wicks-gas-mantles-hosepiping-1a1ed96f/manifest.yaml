review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scientific_review:
    status: pending
    limitations:
      - Candidate methodology; scientific review and methodology approval remain pending; no
        publication or accepted mapping.
      - Narrow virgin PET monofilament woven, undyed uncoated electrically heat-set mesh route only;
        not whole CPC27998 coverage.
      - No foreground factory data supplied. Temperatures, dwell times, recipes, energy, losses,
        outputs and lifetime are not numerical defaults.
      - Sefar historical PDF could not be acquired (HTTP 429/404); not used as evidence. SAATI
        March2022 brochure used only for historical construction descriptions, corroborated by
        current manufacturer product context.
  semantic_boundary_decision:
    decision: new_narrow_semantic_method
    rationale: "The existing PCR ID is retained and its existing methodology upgraded in place. The
      scoped CPC mapping is accepted; scientific approval, translation review and publication retain
      their separately recorded states. Classification rationale: The delivered industrial straining
      cloth is a technical textile expressly listed in the CPC note; fabricated filters and ordinary
      clothing mesh are excluded. Historical author assessment:
      docs/reviews/pcr149-original-ids-20261127/27998.json."
  unresolved_flow_identities:
    - row_id: mineral_lubricant
      selected_flow: Mineral lubricating oil
      reason: Closest public lubricating-oil record specifies fully synthetic PAO, conflicting with
        mineral oil despite generic mineral-oil commentary.
    - row_id: spent_mineral_oil
      selected_flow: Spent mineral lubricating oil
      reason: Exact spent mineral lubricant composition and waste-to-treatment identity remain unconfirmed
        after public candidate searches and direct reads.
    - row_id: rinse_wastewater
      selected_flow: Untreated PET mesh rinse wastewater
      reason: Public textile-wastewater candidates specify to water, not transfer of untreated rinse
        wastewater to a technosphere treatment provider; sizing wastewater also has the wrong route.
    - row_id: corrugated_carton
      selected_flow: Corrugated paperboard shipping carton
      reason: Confirmed corrugated-box identity fixes 16.6% primary and 83.4% recycled fibre; no
        foreground carton composition was supplied to establish this condition.
    - row_id: finished_mesh
      selected_flow: Heat-set PET monofilament filter mesh
      reason: Public Polyester Mesh Fabric describes clothing-oriented woven or knitted mesh and does not
        confirm precision monofilament screening construction or heat-set endpoint; broader
        technical-textile entries are not this exact product. Direct-read Filter cloth candidate
        also leaves polymer, monofilament construction and finishing endpoint unspecified.
  unresolved:
    - Complete independent scientific methodology review before activation/publication.
    - Unresolved exact product and waste-to-treatment identities prevent pretending that every row
      has verified public identity.
    - Actual factories must demonstrate the narrow electric/no-chemical route and provide records;
      different supplies, finishing chemistry and treatment routes require extension.
  classification_decision:
    status: accepted
    code: "27998"
    mapping_type: narrower
    decision_ref: docs/adr/2026-11-27-review-149-existing-methods-original-ids.md
    review_ref: docs/reviews/pcr149-original-ids-20261127/27998.json
    decided_by: codex-primary-controller
    decided_at_utc: 2026-11-27T15:15:00.487Z
    scope: The delivered industrial straining cloth is a technical textile expressly listed in the CPC
      note; fabricated filters and ordinary clothing mesh are excluded.
