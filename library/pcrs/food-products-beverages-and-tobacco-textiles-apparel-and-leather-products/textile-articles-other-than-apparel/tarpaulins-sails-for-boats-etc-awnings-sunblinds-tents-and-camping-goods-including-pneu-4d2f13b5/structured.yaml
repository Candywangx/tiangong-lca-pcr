system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "Foreground product system"
      rule: "Include all manufacturer-controlled operations from the declared received-material condition through accepted finished product at the factory gate, including internally managed rejects, waste, waste water, and direct air emissions."
      source_ids:
        - iso-14044-2006
        - eu-textiles-bat-2022
    - rule_id: boundary_route_disclosure
      applies_to: "Conditional textile operations"
      rule: "Include in-house fabric production, pretreatment, coating, lamination, printing, finishing, drying or curing when performed; otherwise represent the purchased treated textile with an upstream dataset and declare the exclusion from foreground."
      source_ids:
        - eu-textiles-bat-2022
    - rule_id: boundary_packaging
      applies_to: "Dispatch preparation"
      rule: "Inventory packaging materials and packaging scrap but exclude detachable packaging from the 1 kg reference-product mass."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_no_recursive_double_count
      applies_to: "Purchased CPC 27160 intermediate"
      rule: "Model the supplied intermediate once at the receiving boundary and link its upstream dataset; do not recreate the same upstream production inside the receiving foreground process."
      source_ids:
        - iso-14044-2006
