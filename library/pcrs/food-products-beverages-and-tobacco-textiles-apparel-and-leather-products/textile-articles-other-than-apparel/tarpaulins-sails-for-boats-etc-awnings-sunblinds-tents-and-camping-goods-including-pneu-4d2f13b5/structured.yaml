allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Multi-output or shared operations"
    rule: "First avoid allocation through process subdivision or by using process-specific meters, material issues and production records."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_physical
    applies_to: "Unavoidable shared utilities or operations"
    rule: "When subdivision is not practicable, use a documented physical relationship that reflects the driver of resource use or emissions, such as machine time, treated textile mass, exhaust flow, or metered energy."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022
  - rule_id: allocation_economic_fallback
    applies_to: "Saleable secondary outputs without a defensible physical relationship"
    rule: "Use economic allocation only as a disclosed fallback with reporting-period prices, currency, geography, price date and sensitivity analysis."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_waste_no_credit
    applies_to: "Textile offcuts, coating waste, wastewater, rejected articles and packaging scrap"
    rule: "Report generated waste gross at the foreground boundary. Do not subtract an avoided-product or recycling credit inside the foreground inventory unless the downstream modelling convention is explicitly declared and applied consistently."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "textile_formation_preparation_coating_lamination_finishing_cutting_joining_assembly"
      flow_role: "Yarn, textile and polymer material input"
      record_type: "Weighbridge, scale, warehouse issue and stock record"
      raw_fields: "material identity; supplier; batch; opening stock; receipts; issues; returns; closing stock; measured mass; conditioning basis"
      collection_method: "Calibrated scale plus stock reconciliation"
      unit: "kg"
      frequency: "Per batch with monthly reconciliation"
      temporal_coverage: "At least one representative production year or the full campaign for campaign production"
      site_scope: "All controlled production lines in the dataset"
      aggregation_rule: "Sum net issues by exact material identity; reconcile opening plus receipts minus returns and closing stock; divide by accepted reference-product mass"
      quality_evidence: "Calibration record; stock reconciliation; supplier specification; exception log"
    - protocol_id: cp_chemical_records
      process_id: "coating_lamination_finishing_cutting_joining_assembly"
      flow_role: "Coating resin, latex and adhesive input"
      record_type: "Batch recipe and chemical issue record"
      raw_fields: "chemical identity; formulation; batch; as-supplied mass; solids content; returned amount; retained waste"
      collection_method: "Calibrated batch scale and signed recipe record"
      unit: "kg"
      frequency: "Per batch"
      temporal_coverage: "Same period as product output"
      site_scope: "Every applicable coating, lamination, finishing or bonding line"
      aggregation_rule: "Sum as-supplied net use by exact chemical; retain solids calculation separately; normalize by accepted reference-product mass"
      quality_evidence: "Scale calibration; safety or technical data sheet; recipe approval; mass reconciliation"
    - protocol_id: cp_component_records
      process_id: "cutting_joining_assembly"
      flow_role: "Closure, pole and stake input"
      record_type: "Bill of materials, issue count and sample mass"
      raw_fields: "component identity; specification; count issued; count returned; sample mass; batch"
      collection_method: "Count reconciliation with calibrated sample weighing or direct total weighing"
      unit: "kg"
      frequency: "Per production lot"
      temporal_coverage: "Same period as product output"
      site_scope: "All assembly lines and outsourced controlled assembly included in the dataset"
      aggregation_rule: "Convert counts only from measured representative component mass; reconcile issues, returns and rejects; normalize by accepted reference-product mass"
      quality_evidence: "Approved bill of materials; scale calibration; sampling record; supplier specification"
    - protocol_id: cp_utility_records
      process_id: "textile_formation_preparation_coating_lamination_finishing_cutting_joining_assembly_inspection_packaging_dispatch"
      flow_role: "Electricity, fuel and supplied water"
      record_type: "Meter, invoice and production-time record"
      raw_fields: "meter id; opening reading; closing reading; unit; fuel calorific value; process runtime; production mass"
      collection_method: "Direct submeter preferred; otherwise documented shared-meter allocation"
      unit: "kWh; MJ; kg; m3"
      frequency: "Meter interval or invoice period, reconciled monthly"
      temporal_coverage: "At least one representative production year or the full campaign"
      site_scope: "All controlled facilities and relevant shared utilities"
      aggregation_rule: "Difference readings; subtract documented non-production use; allocate shared quantities by physical driver; normalize by accepted reference-product mass"
      quality_evidence: "Meter calibration; invoice; fuel certificate; allocation worksheet; anomaly investigation"
    - protocol_id: cp_output_mass
      process_id: "textile_formation_preparation_coating_lamination_finishing_cutting_joining_assembly_inspection_packaging_dispatch"
      flow_role: "Intermediate and accepted product output"
      record_type: "Calibrated scale, production and quality record"
      raw_fields: "batch; product subtype; gross mass; tare; net mass; accepted mass; rejected mass; conditioning state"
      collection_method: "Calibrated weighing linked to production and quality disposition"
      unit: "kg"
      frequency: "Per batch or lot"
      temporal_coverage: "Same period as all inputs and outputs"
      site_scope: "Every included production line"
      aggregation_rule: "Sum accepted net output by subtype; retain rejected and rework quantities separately; use accepted net mass as normalization denominator"
      quality_evidence: "Scale calibration; lot genealogy; quality release; mass-balance reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "inspection_packaging_dispatch"
      flow_role: "Dispatch packaging input"
      record_type: "Packaging issue, count and sample-mass record"
      raw_fields: "packaging identity; count; sample mass; issues; returns; damaged units"
      collection_method: "Direct weighing or count times measured unit mass"
      unit: "kg"
      frequency: "Per lot with monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "All dispatch packing included in the dataset"
      aggregation_rule: "Sum packaging net use by exact material and normalize by accepted product mass; do not include in reference-product mass"
      quality_evidence: "Bill of materials; scale calibration; stock reconciliation"
    - protocol_id: cp_waste_records
      process_id: "textile_formation_preparation_coating_lamination_finishing_cutting_joining_assembly_inspection_packaging_dispatch"
      flow_role: "Specific solid or paste waste output"
      record_type: "Container weighing, transfer note and treatment record"
      raw_fields: "waste identity; source process; container tare; gross mass; destination; treatment route; hazardous status"
      collection_method: "Calibrated weighing at generation or dispatch, reconciled to transfer documentation"
      unit: "kg"
      frequency: "Per container or dispatch"
      temporal_coverage: "Same period as product output"
      site_scope: "All included processes and controlled waste storage"
      aggregation_rule: "Sum net waste by exact identity and route; keep rework, recycling, treatment and disposal destinations separate; normalize by accepted product mass"
      quality_evidence: "Scale calibration; transfer note; waste code; contractor receipt; mass reconciliation"
    - protocol_id: cp_wastewater_records
      process_id: "textile_formation_preparation_coating_lamination_finishing"
      flow_role: "Route-specific wastewater output"
      record_type: "Flow meter and wastewater monitoring record"
      raw_fields: "stream identity; flow; pH; temperature; concentration; sampling time; treatment route"
      collection_method: "Continuous or batch flow measurement with representative sampling"
      unit: "kg; m3"
      frequency: "Continuous or per discharge with periodic composition monitoring"
      temporal_coverage: "Same period as product output and sufficient to cover recipe variability"
      site_scope: "Each relevant discharge point before stream mixing where practicable"
      aggregation_rule: "Sum route-specific discharge; calculate pollutant mass only from aligned flow and concentration records; normalize by accepted product mass"
      quality_evidence: "Meter and laboratory QA; sampling plan; chain of custody; treatment record"
    - protocol_id: cp_air_emission_records
      process_id: "coating_lamination_finishing"
      flow_role: "Substance-specific direct air emission"
      record_type: "Stack or capture-system monitoring record"
      raw_fields: "substance; emission point; concentration; exhaust flow; operating time; method; below-detection treatment"
      collection_method: "Direct measurement using the applicable documented method; align monitoring with production"
      unit: "kg"
      frequency: "Monitoring frequency set by permit and route relevance; operating time recorded continuously"
      temporal_coverage: "Same period as product output and representative of recipes and operating states"
      site_scope: "Every relevant controlled and diffuse source included in the dataset"
      aggregation_rule: "Calculate each substance mass separately from aligned concentration, flow and operating time; normalize by accepted product mass"
      quality_evidence: "Laboratory report; instrument calibration; method; emission-point map; operating log"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every non-reference amount"
      rule: "normalized amount = reporting-period exchange amount / reporting-period accepted net product mass"
      inputs:
        - "Exchange total from its collection protocol"
        - "accepted net product mass from cp_output_mass"
      output: "Amount per 1 kg accepted reference product"
      source_ids:
        - iso-14044-2006
        - iso-14048-2002
    - id: calc_material_balance
      applies_to: "Each included process"
      rule: "input mass = transferred product mass + separately recorded waste mass + measured emissions + documented stock change, with any residual investigated rather than forced to zero"
      inputs:
        - "Material receipts"
        - "intermediate outputs"
        - "waste records"
        - "emission records"
        - "opening and closing work in progress"
      output: "Process mass-balance reconciliation and residual"
      source_ids:
        - eu-textiles-bat-2022
        - iso-14048-2002
    - id: calc_count_to_mass
      applies_to: "Poles, stakes, zippers and other counted components"
      rule: "component mass = accepted component count × measured representative unit mass, with sampling uncertainty retained"
      inputs:
        - "Count record"
        - "calibrated unit-mass sample"
        - "returns and rejects"
      output: "Component input mass"
      source_ids:
        - iso-14048-2002
    - id: calc_air_emission_mass
      applies_to: "Each monitored air substance"
      rule: "emitted mass = aligned concentration × dry or wet exhaust flow on the same basis × operating time; apply unit and standard-condition conversions explicitly"
      inputs:
        - "Substance concentration"
        - "exhaust flow"
        - "operating time"
        - "measurement-basis metadata"
      output: "Substance-specific emitted mass"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_shared_utility
      applies_to: "Shared water, electricity or fuel meter"
      rule: "allocated quantity = shared-meter quantity × documented physical driver fraction; the driver must reflect causal use and fractions must sum to one"
      inputs:
        - "Shared reading"
        - "process runtime"
        - "treated mass or other physical driver"
      output: "Process-specific utility amount"
      source_ids:
        - iso-14044-2006
        - eu-textiles-bat-2022
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and every inventory row"
      requirement: "Retain exact product subtype, material or substance identity, route applicability, flow type, property, unit, and Tiangong UUID review status. Do not substitute a collection label or neighboring classification flow."
      evidence: "Product specification; bill of materials; direct-read evidence retained outside PCR content; unstats-cpc-3-0-2025"
    - id: dq_temporal
      applies_to: "All foreground records"
      requirement: "Use one internally consistent period covering representative operation, seasonal or recipe variability, maintenance and abnormal exclusions. Disclose partial-year or campaign coverage."
      evidence: "Meter periods; production calendar; lot genealogy; maintenance and exception log"
    - id: dq_geography_technology
      applies_to: "Materials, utilities and processes"
      requirement: "Match suppliers, electricity geography and voltage, fuel supply, textile construction, coating chemistry, joining technology, abatement and waste routes to the represented facility."
      evidence: "Supplier records; process map; equipment list; utility contracts; treatment records"
    - id: dq_completeness
      applies_to: "Input/output inventory"
      requirement: "Reconcile materials, water, energy, wastewater, waste and relevant direct emissions by process. Investigate missing or residual quantities and disclose approved cut-offs."
      evidence: "Input/output inventory; material balance; water balance; energy records; waste and emission records; eu-textiles-bat-2022"
    - id: dq_measurement
      applies_to: "Measured quantities"
      requirement: "Retain meter or scale identity, calibration status, unit, reading interval, sampling method, detection-limit treatment and calculation workbook."
      evidence: "Calibration certificates; laboratory QA; invoices; signed batch sheets; iso-14048-2002"
    - id: dq_no_ai_quantities
      applies_to: "Inventory amounts and ranges"
      requirement: "Do not use AI-generated or reasoned-estimate quantities or ranges for this candidate PCR. Missing quantities remain foreground collection requirements."
      evidence: "Collection protocol coverage and reviewer confirmation"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require Product flow UUID 176ee965-23e5-444c-8b6c-9457334cae4c, exact CPC 27160 semantics, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, kg, amount 1, and all required qualifiers."
    source_ids:
      - unstats-cpc-3-0-2025
  - rule_id: validate_reference_mass
    applies_to: "Accepted product"
    rule: "Require net finished mass to exclude detachable packaging and include all components delivered as part of the article; reconcile gross packed mass separately when recorded."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_route_coverage
    applies_to: "Process map"
    rule: "Fail when an onsite or controlled fabric, pretreatment, coating, lamination, finishing, curing, joining, assembly or waste-treatment operation is omitted, or when an absent operation lacks a purchased upstream dataset and disclosure."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_atomic_flows
    applies_to: "Process inventory"
    rule: "Require every card to contain one concrete exchange. Reject combined utilities, materials, packaging, wastes, emissions, selectors, or unresolved collection labels."
    source_ids: []
  - rule_id: validate_uuid_gate
    applies_to: "UUID-bearing rows"
    rule: "Accept a Tiangong UUID only after hybrid search and public state-100 direct read confirm exact semantics, flow type, property and unit support; otherwise require the row-specific unresolved entry in manifest review metadata."
    source_ids: []
  - rule_id: validate_foreground_evidence
    applies_to: "Non-reference quantities"
    rule: "Require a collection record for every referenced protocol and forbid AI-generated or reasoned-estimate amounts and ranges."
    source_ids:
      - iso-14048-2002
      - eu-textiles-bat-2022
  - rule_id: validate_mass_balance
    applies_to: "Each included process"
    rule: "Require reconciled inputs, transferred output, waste, measured emissions and stock change; investigate and disclose residuals without silently assigning them to product."
    source_ids:
      - eu-textiles-bat-2022
      - iso-14048-2002
  - rule_id: validate_emission_specificity
    applies_to: "Direct emissions and wastewater"
    rule: "Require substance-specific elementary emissions and route-specific wastewater; reject a combined air-emission or wastewater-pollutant selector."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_bilingual_alignment
    applies_to: "English and Chinese PCR"
    rule: "Require identical ordered rule ids, process ids, row ids, UUIDs, controlled vocabulary tokens, source ids and numeric values in both language renderings."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production data package for a specified CPC 27160 finished article"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product-specific process or lifecyclemodel construction when subtype, specification, material system, included components, route, geography, technology, period and factory-gate boundary match"
  excluded_use: "Unqualified average for all CPC 27160 products; textile fabric production outside the declared route; non-textile inflatable goods; use-phase durability claims; end-of-life scenarios; direct substitution for a different subtype, coating system or component configuration"
  required_metadata: "PCR id and version; CPC 27160; product subtype and specification; reference-flow qualifiers; facility geography; reporting period; production volume; included and outsourced operations; bill of materials; coating and finish chemistry; joining route; allocation; cut-offs; upstream dataset references; UUID review status"
  required_quality_disclosure: "Record coverage; calibration and sampling status; mass-, water- and energy-balance residuals; shared-meter allocation; wastewater and air monitoring coverage; missing UUIDs; excluded abnormal operation; data gaps and limitations"
