allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all shared foreground operations"
    rule: "First avoid allocation by submetering, batch segregation, line-level mass balances, and subdivision of independently operated processes."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_causal
    applies_to: "shared utilities and common services"
    rule: "Where subdivision is not practicable, allocate with a documented physical causal driver such as machine runtime and load, steam demand, water meter, processed mass, or occupied batch capacity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_multi_product
    applies_to: "facilities producing several blanket SKUs or other textile products"
    rule: "Do not use revenue allocation unless a physical relationship cannot be established and the study explicitly justifies the alternative; disclose the allocation base, totals, assigned amounts, and sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_recycling
    applies_to: "offcuts, rejects, recovered chemicals, and reusable packaging"
    rule: "Record the actual destination and keep internal reuse as an internal loop; do not credit recycling, reuse, or avoided production without an explicitly declared downstream modelling convention."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "material_receipt_conditioning"
      flow_role: "received and conditioned textile mass"
      record_type: "weighbridge, scale, receipt, and lot release records"
      raw_fields: "material identity, fibre composition, construction, supplier lot, gross mass, tare, conditioned mass, moisture basis, release status"
      collection_method: "calibrated weighing and lot reconciliation"
      unit: "kg"
      frequency: "each receipt and release lot"
      temporal_coverage: "representative reporting year"
      site_scope: "all supplying stores and conditioning areas serving the product"
      aggregation_rule: "sum accepted lot mass and reconcile opening stock plus receipts minus issues and closing stock"
      quality_evidence: "scale calibration, supplier specification, lot traceability, stock reconciliation"
    - protocol_id: cp_cutting_mass_balance
      process_id: "cutting_makeup"
      flow_role: "textile, thread, output, and offcut mass"
      record_type: "issue, return, scale, and production records"
      raw_fields: "SKU, lot, issued textile, returned textile, thread issue/return, accepted output, offcuts, rejects"
      collection_method: "calibrated weighing; verified thread length-to-mass conversion only where weighing is impracticable"
      unit: "kg"
      frequency: "each production lot"
      temporal_coverage: "representative reporting year"
      site_scope: "all cutting and make-up lines"
      aggregation_rule: "reconcile material inputs with accepted output, offcuts, rejects, and inventory change"
      quality_evidence: "scale calibration, batch reconciliation, exception log"
    - protocol_id: cp_wet_process_batch
      process_id: "wet_finishing_drying"
      flow_role: "blanket and process-water balance"
      record_type: "batch sheet, water meter, tank level, and conditioned mass records"
      raw_fields: "route, batch, textile charge, water meter start/end, tank volume, dry output, moisture basis"
      collection_method: "batch-linked meters and calibrated weighing"
      unit: "kg"
      frequency: "each wet-process batch"
      temporal_coverage: "representative reporting year"
      site_scope: "all included wet-finishing and drying equipment"
      aggregation_rule: "sum batch records and normalize by accepted dry output"
      quality_evidence: "meter calibration, recipe version, mass/water reconciliation"
    - protocol_id: cp_chemical_dosing
      process_id: "wet_finishing_drying"
      flow_role: "detergent and finishing-agent dose"
      record_type: "recipe, issue, return, and dosing-system records"
      raw_fields: "product name, supplier, function, composition/SDS reference, batch, dose, returned quantity"
      collection_method: "calibrated dosing system or issue-minus-return weighing"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative reporting year"
      site_scope: "all chemical preparation and dosing points"
      aggregation_rule: "sum net dose by named chemical and product route"
      quality_evidence: "calibration, approved recipe, purchase/stock reconciliation, SDS"
    - protocol_id: cp_wastewater_records
      process_id: "wet_finishing_drying"
      flow_role: "wastewater to treatment"
      record_type: "flow meter, batch discharge, treatment transfer, and sampling records"
      raw_fields: "route, volume or mass, density if converted, destination, sampling time, monitored parameters"
      collection_method: "continuous meter or batch tank measurement linked to discharge route"
      unit: "kg"
      frequency: "each batch or continuous meter interval"
      temporal_coverage: "representative reporting year"
      site_scope: "all included wet-process discharges"
      aggregation_rule: "sum by treatment destination; convert volume only with documented density"
      quality_evidence: "meter calibration, sample chain of custody, influent/effluent reconciliation"
    - protocol_id: cp_energy_records
      process_id: "cutting_makeup"
      flow_role: "purchased electricity and steam"
      record_type: "utility meters, invoices, runtime, and load records"
      raw_fields: "meter start/end, carrier, voltage or steam condition, runtime, load, allocation driver, product output"
      collection_method: "submeter; otherwise reconciled site meter with documented causal allocation"
      unit: "kWh or kg"
      frequency: "meter interval and monthly reconciliation"
      temporal_coverage: "representative reporting year"
      site_scope: "all included equipment and utility headers"
      aggregation_rule: "sum direct readings; allocate documented shared remainder and reconcile to invoice/site meter"
      quality_evidence: "meter calibration, invoice reconciliation, allocation worksheet"
    - protocol_id: cp_fuel_combustion
      process_id: "onsite_heat_generation"
      flow_role: "natural gas and direct fossil CO2"
      record_type: "fuel meter, supplier calorific value, stack measurement, and calculation record"
      raw_fields: "gas quantity, unit, gross calorific value, meter period, equipment, operating hours, measured emission or factor identity"
      collection_method: "calibrated fuel meter plus stack result or documented accepted factor calculation"
      unit: "MJ and kg"
      frequency: "meter interval and reporting period"
      temporal_coverage: "representative reporting year"
      site_scope: "all on-site combustion serving included operations"
      aggregation_rule: "convert each period to MJ GCV and link emissions to the same fuel inventory"
      quality_evidence: "meter calibration, supplier certificate, stack report or factor provenance, reconciliation"
    - protocol_id: cp_packaging_release
      process_id: "inspection_packaging"
      flow_role: "packaging inputs and reference output"
      record_type: "packaging issue/return, label count, scale, inspection, and release records"
      raw_fields: "SKU, lot, blanket count, net product mass, box mass, film mass, label count/mass, rejected units, packaging state"
      collection_method: "calibrated weighing plus count-to-mass conversion from verified component mass"
      unit: "kg"
      frequency: "each packing lot"
      temporal_coverage: "representative reporting year"
      site_scope: "all inspection and packing lines"
      aggregation_rule: "reconcile net released product and each packaging material separately"
      quality_evidence: "scale calibration, component specification, release record, packaging reconciliation"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "all inventory exchanges"
      rule: "normalized exchange = total exchange assigned to conforming product / dry net kg of quality-released blanket"
      inputs:
        - "assigned exchange"
        - "dry net released product mass"
      output: "exchange per kg reference product"
      source_ids:
        - iso-14044-2006
    - id: calc_item_mass
      applies_to: "count-based product or label records"
      rule: "mass = verified count multiplied by representative measured mass per item from the same SKU and applicable lot or sampling period"
      inputs:
        - "item count"
        - "measured item masses"
        - "sampling record"
      output: "kg"
      source_ids:
        - iso-14048-2002
    - id: calc_water_volume_mass
      applies_to: "water and wastewater records"
      rule: "mass = measured volume multiplied by documented density at the applicable condition; retain original volume"
      inputs:
        - volume
        - density
        - "temperature or declared condition"
      output: "kg"
      source_ids:
        - iso-14048-2002
    - id: calc_natural_gas_energy
      applies_to: "natural gas input"
      rule: "energy = metered gas quantity multiplied by supplier gross calorific value for the same reporting period"
      inputs:
        - "gas quantity"
        - "gross calorific value"
      output: "MJ GCV"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_mass_balance
      applies_to: "material and wet-process batches"
      rule: "reconcile inputs = accepted outputs + wastes + emissions/transfers + inventory change; investigate and disclose unresolved imbalance"
      inputs:
        - "measured inputs"
        - outputs
        - wastes
        - transfers
        - "inventory change"
      output: "batch balance and unexplained difference"
      source_ids:
        - eu-textiles-bat-2022
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and intermediates"
      requirement: "Preserve product SKU, fibre composition, construction, finishing route, dimensions, mass per item, moisture basis, and lot through all process records."
      evidence: "product specification, bill of materials, lot traveller, release certificate"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use a representative continuous 12-month period where practicable; disclose shutdowns, start-ups, campaigns, and substitutions that affect representativeness."
      evidence: "dated meter series, production calendar, exception log"
    - id: dq_completeness
      applies_to: "each process"
      requirement: "Reconcile materials, water, chemicals, energy, products, waste, wastewater, and direct emissions; document every missing stream and estimation."
      evidence: "signed mass/energy reconciliation and completeness checklist"
    - id: dq_measurement
      applies_to: "measured exchanges"
      requirement: "Identify meter/scale, unit, calibration status, reading interval, and conversion factor; preserve source records and calculation lineage."
      evidence: "calibration certificate, raw reading, invoice, calculation worksheet"
    - id: dq_supplier
      applies_to: "upstream inputs"
      requirement: "Record supplier, production geography, technology/route, reference year, and dataset match for significant textile, chemical, energy, and packaging inputs."
      evidence: "supplier declaration, SDS, certificate, linked dataset metadata"
    - id: dq_chemical
      applies_to: "wet finishing chemicals"
      requirement: "Keep product identity, function, composition or SDS reference, batch dose, and applicable restricted-substance or substitution assessment."
      evidence: "approved recipe, SDS, purchase and dosing record, compliance declaration"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require flow UUID b7478885-d1a2-4ced-9240-4737fc0b8020, public state 100 Product flow evidence, exact CPC 27110 scope, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids:
      - un-stats-cpc-3-2025
  - rule_id: validate_required_qualifiers
    applies_to: "reference product metadata"
    rule: "Fail completeness when any required qualifier is missing or when the product contains an electrical device or circuit."
    source_ids:
      - eu-ecolabel-textiles-2014
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Require each inventory card to represent one exchange, retain only a directly verified UUID, and preserve an explicit unresolved reason for every UUID-free row."
    source_ids:
      - iso-14048-2002
  - rule_id: validate_process_route
    applies_to: "process boundary"
    rule: "Require all required processes and every applicable conditional operation; reconcile outsourced operations to linked datasets."
    source_ids:
      - jrc-textiles-bref-2023
      - eu-textiles-bat-2022
  - rule_id: validate_foreground_values
    applies_to: "inventory amounts"
    rule: "Require every published amount to originate from a foreground record or an identified calculation over foreground records; this candidate PCR supplies no AI-authored numerical ranges or defaults."
    source_ids:
      - iso-14044-2006
      - iso-14048-2002
  - rule_id: validate_mass_balance
    applies_to: "each production stage and reporting period"
    rule: "Require documented reconciliation of material inputs, accepted outputs, wastes, transfers, and inventory change, with investigated and disclosed residuals."
    source_ids:
      - eu-textiles-bat-2022
      - iso-14044-2006
  - rule_id: validate_allocation
    applies_to: "shared operations"
    rule: "Require subdivision or a documented causal physical allocation driver, complete totals, assigned quantities, and sensitivity where allocation materially affects results."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_source_traceability
    applies_to: "data package"
    rule: "Require raw-record lineage, calibration/quality evidence, source ids for normative rules, and linked upstream dataset metadata."
    source_ids:
      - iso-14048-2002
published_dataset_profile:
  dataset_role: "foreground blanket-manufacturing dataset eligible for secondary_dataset or background_dataset use after review and publication"
  downstream_use: "construction of product process datasets and downstream lifecyclemodel systems for non-electric blankets or travelling rugs matching the declared qualifiers"
  allowed_use: "gate-to-gate blanket manufacturing, or a linked manufacturing stage in a broader cradle-to-gate or cradle-to-grave model, when product, geography, technology, and time are representative"
  excluded_use: "electric blankets; floor coverings; sleeping bags; upstream textile production; use-phase service claims; products with materially different construction or finishing routes without adaptation"
  required_metadata: "canonical PCR id; CPC 27110; reference UUID/property/unit group; required qualifiers; process inclusions; geography; reference year; technology; allocation; data sources; unresolved identities; packaging state"
  required_quality_disclosure: "primary-data share; meter and scale coverage; calibration status; temporal coverage; supplier-data coverage; mass-balance residuals; allocation shares; missing or estimated exchanges; outsourced operation coverage"
  update_trigger: "change in fibre composition, construction, finishing chemistry or route, energy system, wastewater treatment, packaging configuration, production geography, supplier dataset, reference-flow identity, or a material data-quality finding"
