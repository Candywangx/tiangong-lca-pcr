  - rule_id: allocation_avoid
    applies_to: "route-specific foreground operations"
    rule: "Prefer separate metering, batch records, and route-specific process subdivision so that allocation is avoided."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: allocation_shared
    applies_to: "shared covering, coating, drying, ventilation, inspection, or packing equipment"
    rule: "Allocate measured shared totals using a documented causal driver such as equipment operating time, metered energy, dry coating mass, or machine throughput; mass allocation is allowed only when no better physical driver exists."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022
  - rule_id: allocation_rework
    applies_to: "internal rework"
    rule: "Material reprocessed within the same reporting boundary is not a new product output; count its additional utility use and losses once and disclose the rework rate."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_recycling
    applies_to: "offcuts and recovered coating material"
    rule: "Apply the study's declared recycling and end-of-waste convention consistently; do not give an avoided-burden credit without identifying the displaced product, substitution ratio, and supporting evidence."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_covering_materials
      process_id: "textile_covering_and_packing"
      flow_role: "substrate, covering yarn, and corrugated box inputs"
      record_type: "issue, return, purchase, stock, specification, and weigh records"
      raw_fields: "material identity; lot; opening stock; receipts; issues; returns; closing stock; unit mass; fibre or compound specification"
      collection_method: "Reconcile each atomic material separately and retain specification and scale evidence."
      unit: "kg"
      frequency: "per lot with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "producing site and route"
      aggregation_rule: "Sum verified consumption by material identity, then divide by net conforming output mass."
      quality_evidence: "calibrated scale records; stock reconciliation; supplier specification; lot traceability"
    - protocol_id: cp_covering_energy
      process_id: "textile_covering_and_packing"
      flow_role: "electricity input"
      record_type: "meter, invoice, equipment runtime, and rated-power records"
      raw_fields: "meter start; meter end; invoice quantity; equipment id; power; runtime; route output"
      collection_method: "Use route submetering where available; otherwise reconcile the site meter and apply a documented causal equipment driver."
      unit: "kWh"
      frequency: "continuous or per shift with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "producing site and route"
      aggregation_rule: "Subtract documented non-route loads, allocate shared loads, and divide by net conforming output mass."
      quality_evidence: "meter calibration; invoice; runtime log; allocation worksheet"
    - protocol_id: cp_covering_output_waste
      process_id: "textile_covering_and_packing"
      flow_role: "product output and covering-route wastes"
      record_type: "finished-goods, scale, rejection, waste-transfer, and treatment records"
      raw_fields: "lot; gross mass; packaging mass; net mass; moisture; accepted mass; rejected mass; waste mass; destination"
      collection_method: "Reconcile accepted output and each waste stream by lot and destination."
      unit: "kg"
      frequency: "per lot"
      temporal_coverage: "same period as material inputs"
      site_scope: "producing site and route"
      aggregation_rule: "Sum net accepted product and separately sum each waste identity by destination."
      quality_evidence: "calibrated scale; quality release; waste manifest; mass-balance worksheet"
    - protocol_id: cp_coating_materials
      process_id: "impregnation_coating_and_packing"
      flow_role: "substrate, formulation, and corrugated box inputs"
      record_type: "recipe, batch, issue, return, stock, purchase, specification, and weigh records"
      raw_fields: "material identity; formulation id; lot; as-received mass; solids fraction; moisture; issues; returns; stock; unit mass"
      collection_method: "Reconcile each atomic substrate and compound separately; preserve formulation and solids evidence."
      unit: "kg"
      frequency: "per batch or lot with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "producing site and route"
      aggregation_rule: "Calculate verified consumption by identity and retain dry and as-received masses without mixing bases."
      quality_evidence: "calibrated scale; recipe approval; safety or technical data sheet; stock reconciliation"
    - protocol_id: cp_coating_utilities
      process_id: "impregnation_coating_and_packing"
      flow_role: "process water, electricity, and natural gas inputs"
      record_type: "water meter, electricity meter, fuel meter, invoice, batch-volume, runtime, and heating-value records"
      raw_fields: "meter readings; batch water; electricity; fuel volume; heating value; equipment id; runtime; recovered water"
      collection_method: "Meter each utility independently and reconcile it to the route and reporting period."
      unit: "m3; kWh; MJ"
      frequency: "continuous or per batch with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "producing site and route"
      aggregation_rule: "Apply route-specific meter totals or documented causal allocation; separately close the water balance."
      quality_evidence: "meter calibration; invoice; batch sheet; heating-value certificate; water-balance worksheet"
    - protocol_id: cp_coating_output_waste
      process_id: "impregnation_coating_and_packing"
      flow_role: "product output, formulation waste, off-spec product, and named air emissions"
      record_type: "finished-goods, scale, batch, waste-transfer, analytical, stack-test, solvent-balance, and formulation records"
      raw_fields: "net output; moisture; dry substrate; dry coating; waste identity; waste mass; destination; substance input; measured concentration; gas flow; operating time"
      collection_method: "Reconcile product and material losses, keep each waste stream separate, and quantify only substances demonstrated by the formulation and release method."
      unit: "kg"
      frequency: "per batch or lot; emissions at permit or method frequency"
      temporal_coverage: "same period as inputs and output"
      site_scope: "producing site and route"
      aggregation_rule: "Sum net accepted output; sum each waste by identity and destination; calculate each named emission using the approved measurement or balance method."
      quality_evidence: "quality release; calibrated scale; waste manifest; laboratory or stack report; formulation record; mass-balance worksheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground exchanges"
      rule: "Normalized exchange equals reporting-period exchange divided by net conforming product mass at the declared moisture condition."
      inputs:
        - "exchange amount"
        - "net conforming product mass"
      output: "exchange per 1 kg net product"
      source_ids:
        - iso-14044-2006
    - id: calc_route_mass_balance
      applies_to: "each selected route"
      rule: "Mass-balance residual equals total material input minus net product output minus separately measured waste output minus measured material release; investigate and disclose the residual rather than forcing closure."
      inputs:
        - "dry and as-received material inputs"
        - product
        - wastes
        - "measured releases"
        - "moisture and solids"
      output: "route mass balance and residual"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_coating_pickup
      applies_to: "impregnation or coating route"
      rule: "Dry coating pickup equals net dry treated-product mass minus net dry substrate mass; report pickup also as a fraction of net dry treated-product mass when the required measurements exist."
      inputs:
        - "dry product mass"
        - "dry substrate mass"
      output: "dry coating mass and mass fraction"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_energy_normalization
      applies_to: "electricity and natural gas"
      rule: "Convert recorded utility quantities to the declared unit without combining electricity and fuel; fuel energy equals delivered amount multiplied by the documented heating value."
      inputs:
        - "electricity meter"
        - "fuel delivery"
        - "heating value"
        - "output mass"
      output: "kWh electricity per kg and MJ fuel per kg"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_allocation
      applies_to: "shared foreground totals"
      rule: "Allocated amount equals reconciled shared total multiplied by the selected product's causal-driver quantity divided by the sum of the same driver for all products sharing the total."
      inputs:
        - "shared total"
        - "product driver"
        - "total driver"
      output: "allocated foreground amount"
      source_ids:
        - iso-14044-2006
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and material inputs"
      requirement: "Declare route, substrate form and fibre family, formulation identifier, cover construction or coating pickup, physical specification, and packaging state."
      evidence: "product specification; formulation or recipe; lot traveller; packaging bill of materials"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use records from one coherent reporting period that captures representative operation and disclose shutdowns, trials, and abnormal batches."
      evidence: "reporting-period definition; production log; exception register"
    - id: dq_completeness
      applies_to: "all atomic exchanges"
      requirement: "Reconcile meters, stocks, product, each waste stream, and relevant named releases; no combined material, utility, waste, or emission placeholder is allowed."
      evidence: "inventory checklist; meter and stock reconciliation; waste and emission register"
    - id: dq_mass_balance
      applies_to: "each selected route"
      requirement: "Investigate material-balance residuals and explain moisture, volatile loss, sampling, stock, or measurement effects without inventing a balancing exchange."
      evidence: "signed mass-balance worksheet; measurement uncertainty record"
    - id: dq_chemicals
      applies_to: "coating route"
      requirement: "Maintain a formulation-level chemical inventory with identity, quantity, function, solids or solvent content, and batch linkage."
      evidence: "approved recipe; safety and technical data sheets; batch issue records"
    - id: dq_tests
      applies_to: "saleable output"
      requirement: "Record the applicable physical or mechanical specification and test history, including rubber-thread processing history where relevant and yarn linear-density method where relevant."
      evidence: "certificate of analysis; ISO 20058, ISO 2321, or ISO 2060 test record as applicable"
    - id: dq_uuid
      applies_to: "every implemented exchange"
      requirement: "Resolve each implemented atomic exchange to one exact Tiangong flow identity with compatible type, property, and unit; unresolved candidate rows remain review findings and must not be assigned a near-neighbour UUID."
      evidence: "hybrid-search evidence; independent state100 direct-read evidence; review log"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "dataset reference"
    rule: "Require the exact CPC 27992 Product flow UUID, Mass property UUID, kg reference unit, 1 kg net amount, and all required qualifiers."
    source_ids:
      - un-cpc-v3-27992
      - iso-14044-2006
  - rule_id: validate_route
    applies_to: "process selection"
    rule: "Require at least one applicable route and reject a single-lot dataset that mixes covering and coating exchanges without a documented production-weighted portfolio definition."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_atomic_inventory
    applies_to: "inventory structure"
    rule: "Require one physically or chemically specific exchange per row and reject collection flows, selector instructions, combined utilities, combined wastes, and combined emissions."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "route material balance"
    rule: "Require input, product, waste, moisture or solids, and measured release reconciliation and a documented explanation of residuals."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_formulation
    applies_to: "coating route"
    rule: "Require the actual substrate and compound formulation, dry solids, coating pickup or cover fraction, and applicability decisions for every conditional material and substance."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_utilities
    applies_to: "electricity, fuel, and water"
    rule: "Require separate quantities, compatible units, meter or allocation evidence, heating-value basis for fuel, and a water balance where process water is used."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_emissions_waste
    applies_to: "wastes and releases"
    rule: "Require each waste identity and destination separately and report ammonia or toluene only when formulation relevance and a measured or approved calculation are documented."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_sources_protocols
    applies_to: "foreground evidence"
    rule: "Require every foreground-record row to link to a declared collection protocol and require every method claim to cite an allowed source."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: validate_uuid_evidence
    applies_to: "Tiangong identities"
    rule: "Reject unverified or semantically broader, narrower, or proxy UUIDs; report each unresolved row by row_id until hybrid and state100 direct evidence both confirm an exact identity."
    source_ids:
      - un-cpc-v3-27992
published_dataset_profile:
  dataset_role: "Route-specific foreground data package for factory-gate production of a declared CPC 27992 product."
  downstream_use: "Construction and validation of LCA process and lifecycle-model datasets with linked upstream product systems."
  allowed_use: "Site- and period-specific product footprints, comparative work with equivalent reference-flow qualifiers and boundaries, and production improvement studies."
  excluded_use: "Generic substitution for bare rubber thread, untreated yarn, rubberized fabric, tyre cord fabric, finished elastic articles, or a product with undeclared formulation or route."
  required_metadata: "PCR id and version; CPC code; route; product and formulation qualifiers; site and geography; reporting period; technology; reference moisture; net and packaging mass; allocation method; linked upstream datasets; UUID evidence status."
  required_quality_disclosure: "Meter and scale coverage; stock reconciliation; formulation and solids evidence; route mass-balance residual; shared-equipment allocation; waste destinations; emission methods; test methods; unresolved UUIDs and exclusions."
  update_trigger: "Change in substrate, fibre family, formulation, cover construction, coating pickup, production route, thermal system, packaging, site, upstream supply, allocation driver, measurement method, or representative reporting period."
