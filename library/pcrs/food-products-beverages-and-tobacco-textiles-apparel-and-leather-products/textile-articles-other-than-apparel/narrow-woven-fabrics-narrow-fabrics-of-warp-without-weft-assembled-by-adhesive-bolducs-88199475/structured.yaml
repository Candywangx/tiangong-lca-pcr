allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "multi-product equipment and shared utilities"
    rule: "First meter or subdivide by process and product route. When subdivision is not feasible, use a documented physical driver that reflects causality, such as machine time, textile throughput, bath volume or measured energy demand."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_rule_2
    applies_to: "recovered textile material and wastewater sludge"
    rule: "Record the measured output and actual destination. Do not assign an avoided-product credit inside the plant-gate foreground inventory unless the chosen downstream method explicitly requires and documents it."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_rule_3
    applies_to: "unavoidable residual multi-functionality"
    rule: "Apply economic allocation only after subdivision and causal physical allocation are shown impracticable; disclose prices, reference period, sensitivity and the fraction assigned to the reference product."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_forming_material_energy
      process_id: "forming_assembly"
      flow_role: "yarns, adhesive, electricity, unfinished output, waste and dust"
      record_type: "issue records, BOM, stock ledger, meters, production log, waste tickets and emission records"
      raw_fields: "product code; lot; constituent identity; supplier; opening stock; issues; returns; closing stock; meter readings; output mass; waste mass and destination; dust measurement or calculation"
      collection_method: "collect by lot and reconcile material and energy records to the forming line"
      unit: "kg, kWh"
      frequency: "each lot with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or documented campaign"
      site_scope: "all equipment and shared services attributable to forming"
      aggregation_rule: "sum accepted records, subtract returns and stock increase, allocate shared meters with a documented physical driver, then divide by unfinished output"
      quality_evidence: "calibrated scales and meters; BOM approval; stock reconciliation; waste tickets; emission method and control-device status"
    - protocol_id: cp_finishing_material_energy_water
      process_id: "wet_thermal_finishing"
      flow_role: "incoming textile, each listed chemical, water, energy, finished output, wastewater and direct emissions"
      record_type: "lot sheet, chemical issue, water and energy meters, production log, discharge meter and emission record"
      raw_fields: "incoming and outgoing textile mass; supplied chemical identity and concentration; chemical issue mass; supplied and reused water; electricity; natural gas; steam; wastewater volume; direct-emission result"
      collection_method: "collect by recipe and lot, with process-level annual reconciliation"
      unit: "kg, m3, kWh, MJ"
      frequency: "each lot with monthly and annual reconciliation"
      temporal_coverage: "representative continuous 12-month period or documented campaign"
      site_scope: "all included wet and thermal finishing equipment"
      aggregation_rule: "sum measured inputs and outputs by recipe, preserve each chemical and energy carrier, and divide by finished output"
      quality_evidence: "calibrated meters; recipe approval; supplier specification; laboratory record; discharge record; process-change log"
    - protocol_id: cp_conversion_inspection
      process_id: "conversion_inspection"
      flow_role: "textile input, electricity, accepted product and off-cuts"
      record_type: "transfer ticket, meter, inspection log, scale and waste ticket"
      raw_fields: "incoming state and mass; electricity; accepted product subtype and mass; reject mass; off-cut mass; rework; destination"
      collection_method: "collect each production lot through final acceptance"
      unit: "kg, kWh"
      frequency: "each lot"
      temporal_coverage: "representative continuous 12-month period or documented campaign"
      site_scope: "all final conversion and inspection operations"
      aggregation_rule: "reconcile incoming textile with accepted output, rework, stock change and waste, then normalize to accepted output"
      quality_evidence: "scale calibration; acceptance specification; inspection record; waste ticket; rework log"
    - protocol_id: cp_wastewater_treatment
      process_id: "wastewater_treatment"
      flow_role: "wastewater input, electricity, treated discharge and sludge"
      record_type: "inlet and outlet meters, electricity meter, laboratory report and sludge ticket"
      raw_fields: "inlet volume; outlet volume; reuse volume; electricity; discharge point; sludge mass; moisture or dry solids; destination; monitored parameters"
      collection_method: "monitor at treatment inlet, final outlet and sludge transfer point"
      unit: "m3, kWh, kg"
      frequency: "continuous or per batch with monthly and annual reconciliation"
      temporal_coverage: "same period as represented finishing production"
      site_scope: "complete on-site wastewater treatment system attributable to included operations"
      aggregation_rule: "reconcile inlet, reuse, discharge and retained water; allocate shared treatment by measured pollutant load or volume with justification"
      quality_evidence: "meter calibration; sampling plan; laboratory accreditation; permit report; sludge transfer documentation"
  calculation_rules:
    - id: calc_rule_1
      applies_to: "reporting-period normalization"
      rule: "normalized exchange = attributable measured exchange / conforming saleable product mass on the common mass basis"
      inputs:
        - "attributable exchange"
        - "accepted product mass"
        - "moisture or conditioning conversion"
      output: "exchange per 1 kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_rule_2
      applies_to: "textile material balance"
      rule: "yarns + adhesive solids + incoming intermediate + opening stock = accepted product + waste + emissions + closing stock + documented moisture change, within declared measurement uncertainty"
      inputs:
        - "material issues and returns"
        - stock
        - product
        - waste
        - "adhesive solids"
        - moisture
      output: "reconciled textile and adhesive mass balance"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_rule_3
      applies_to: "length, area or item conversion"
      rule: "mass = measured length × measured usable width × measured mass per unit area, or item count × measured mean item mass, using values for the represented lot"
      inputs:
        - length
        - width
        - "area density"
        - count
        - "sampled item mass"
      output: "kg on reference mass basis"
      source_ids:
        - eu-pef-2021
    - id: calc_rule_4
      applies_to: "shared utility allocation"
      rule: "attributable utility = metered shared utility × documented causal driver for the product route / sum of the same driver for all served routes"
      inputs:
        - "shared meter"
        - "machine time"
        - throughput
        - "bath volume or measured demand"
      output: "allocated utility amount"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_requirement_1
      applies_to: "product identity"
      requirement: "Retain the specification, bill of materials and route record that establish CPC 27911 scope, subtype, constituents, construction, dimensions, colour, finish and saleable state."
      evidence: "approved product specification; BOM; lot traveller; acceptance report"
    - id: dq_requirement_2
      applies_to: "temporal and technological representativeness"
      requirement: "Use a continuous 12-month period where available; otherwise document the campaign, seasonality, downtime, technology, capacity utilisation and reason the shorter period represents the declared product."
      evidence: "production calendar; equipment list; change log; coverage calculation"
    - id: dq_requirement_3
      applies_to: "completeness"
      requirement: "Reconcile process-level textile material, chemical, water, energy, wastewater, waste and direct-emission records and list every identified missing exchange as a data gap."
      evidence: "balance sheets; meter register; chemical ledger; waste and discharge records; data-gap register"
    - id: dq_requirement_4
      applies_to: "measurement and conversion"
      requirement: "Retain instrument identity, calibration status, raw unit, conversion factor, sampling method and uncertainty or known limitation for each measured or converted field."
      evidence: "calibration certificate; raw export; laboratory method; conversion worksheet"
    - id: dq_requirement_5
      applies_to: "source and upstream data"
      requirement: "Match upstream datasets to constituent identity, supplier or geography, production technology and time period; disclose every proxy and its expected effect."
      evidence: "supplier declaration; dataset metadata; proxy assessment"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference flow"
    rule: "Reject a package unless the reference product uses UUID 706a70f1-432b-41bc-b000-ddf409e94f3f, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, unit kg, and all required qualifiers are present."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validation_rule_2
    applies_to: "route consistency"
    rule: "Reject a package when process rows contradict the declared route: a performed operation is absent, an unperformed conditional operation carries non-zero exchanges, or an outsourced operation lacks a linked upstream dataset."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validation_rule_3
    applies_to: "atomic exchange identity"
    rule: "Reject a process inventory that combines multiple yarns, chemicals, energy carriers, wastes or emissions in one exchange; each represented exchange shall name one physical or chemical flow and use one row."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validation_rule_4
    applies_to: "mass and stock reconciliation"
    rule: "Require reconciliation of incoming textile and adhesive solids with accepted product, waste, emissions, stock change and moisture change; investigate and disclose any residual beyond declared measurement uncertainty."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validation_rule_5
    applies_to: "wet-process inventory"
    rule: "When wet processing is included, require process-level records for supplied and reused water, each consumed chemical, electricity, each thermal-energy carrier, wastewater by destination, waste and direct emissions."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validation_rule_6
    applies_to: "allocation and data quality"
    rule: "Reject undocumented allocation, silent cut-offs, unit conversions without factors, or proxy upstream datasets without representativeness disclosure."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground production dataset for one declared CPC 27911 narrow textile product or a documented production mix of products with equivalent construction and process route."
  downstream_use: "May support a secondary_dataset or background_dataset for apparel, packaging, furnishings, industrial textiles or other systems after review of product and route representativeness."
  allowed_use: "Plant-gate product comparisons or downstream models using the same subtype, composition, construction, finish, geography, time period and included operations."
  excluded_use: "Unqualified use as an average for all CPC 27911 articles; substitution for embroidered, knitted, crocheted, lace, tulle, broad-fabric or apparel datasets; use-stage or end-of-life claims not modelled by the dataset."
  required_metadata: "PCR id and version; CPC reference; product subtype; constituent mass fractions; construction; dimensions or width; mass per length or area; colour and finish; mass basis; product presentation; geography; reporting period; technology; included and outsourced operations; allocation; upstream dataset list."
  required_quality_disclosure: "Raw-data coverage; meter and scale coverage; calibration; material and water balances; chemical completeness; wastewater and waste destinations; direct-emission methods; allocation drivers; proxies; cut-offs; uncertainty and unresolved identity references."
  update_trigger: "Change in product identity, constituent composition, construction, adhesive, coloration or finish; material technology or supplier; energy or water system; wastewater route; allocation method; site geography; or a material process or inventory change."
