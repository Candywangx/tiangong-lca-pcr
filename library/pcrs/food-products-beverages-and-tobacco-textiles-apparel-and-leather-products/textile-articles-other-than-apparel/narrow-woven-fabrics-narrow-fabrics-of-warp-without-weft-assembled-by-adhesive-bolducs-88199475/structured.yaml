system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "foreground production"
      rule: "Include every on-site operation that transforms received yarns, filaments or an incoming narrow textile into the declared saleable product, together with material, chemical, water, energy, waste, wastewater and direct-emission exchanges."
      source_ids:
        - eu-textiles-bat-2022
    - rule_id: boundary_rule_2
      applies_to: "route selection"
      rule: "Include narrow weaving, braiding, adhesive assembly, wet processing, thermal finishing and wastewater treatment only when performed for the declared product, and disclose each excluded or outsourced operation with its linked upstream dataset."
      source_ids:
        - eu-textiles-bat-2022
    - rule_id: boundary_rule_3
      applies_to: "first foreground inventory"
      rule: "Build a process-level inventory of consumed textile materials, chemicals, water and energy and generated wastewater, waste and direct emissions; disclose an unavailable identified exchange as a data gap rather than silently cutting it off."
      source_ids:
        - eu-textiles-bat-2022
        - eu-pef-2021
    - rule_id: boundary_rule_4
      applies_to: "upstream and downstream stages"
      rule: "Keep fibre and yarn production, off-site treatment, distribution, use and end-of-life outside the plant-gate foreground system unless the study explicitly extends the boundary; extended results shall remain separable."
      source_ids:
        - eu-pef-2021
