system_boundary:
  rules:
    - rule_id: sb_direct_operations
      applies_to: "Foreground manufacturing"
      rule: "Include all site-controlled receipt, cutting, sewing, filling or core insertion, quilting or closure, conditional wet finishing and drying, inspection, rework, labelling and packaging operations used for the declared article."
      source_ids:
        - epa-textile-sector-notebook-1997
        - uk-resource-efficiency-textiles-2024
    - rule_id: sb_purchased_inputs
      applies_to: "Purchased materials and utilities"
      rule: "Keep each purchased material and utility as a separate product input and link it to a geographically and technologically appropriate upstream dataset."
      source_ids:
        - eu-pef-2021
        - iso-14044-2006
    - rule_id: sb_direct_outputs
      applies_to: "Foreground wastes and emissions"
      rule: "Record each site-generated offcut, filling loss, foam scrap, metal scrap, wastewater, sludge and relevant direct air emission separately, with treatment destinations outside the site linked as downstream datasets."
      source_ids:
        - eu-textiles-bat-2022
    - rule_id: sb_recursive_category
      applies_to: "Same-category product inputs"
      rule: "Keep any purchased CPC 27180 article used as an input visible as one product input and require an upstream dataset for it; do not recursively reconstruct its manufacture inside this foreground package."
      source_ids:
        - eu-pef-2021
    - rule_id: sb_default_exclusions
      applies_to: "Distribution, use and end-of-life"
      rule: "Exclude distribution, consumer or institutional use, laundering during use and end-of-life from the default factory-gate package; an expanded study must identify and model them as additional stages."
      source_ids:
        - iso-14040-2006
        - eu-pef-2021
