allocation_rules:
  - rule_id: alloc_subdivision_first
    applies_to: "Multi-product lines and shared operations"
    rule: "Prefer batch, line or process subdivision and direct metering so that the declared product carries its measured foreground inputs and outputs before any allocation is used."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: alloc_shared_utilities
    applies_to: "Unavoidably shared electricity, heat, water and common wastes"
    rule: "Use a documented physical causal driver such as metered machine time, treated mass or measured throughput; retain the total, driver and calculation, and do not use revenue when a physical relation is available."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: alloc_multi_output_fallback
    applies_to: "Saleable co-products that remain after subdivision"
    rule: "Apply a documented physical relationship when it reflects causality; use economic allocation only when no defensible physical relationship exists, and disclose the method and sensitivity."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: alloc_rework_and_scrap
    applies_to: "Internal rework and production scrap"
    rule: "Return internal rework to the originating batch without treating it as a co-product; report net material consumption and each exported scrap or waste flow separately, without an unreviewed avoided-burden credit."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabrication_materials
      process_id: "article_fabrication"
      flow_role: "BOM material inputs"
      record_type: "Weighing, ERP issue/return and approved BOM records"
      raw_fields: "product_family; batch_id; material_name; material_grade; supplier; lot_id; mass_issued; mass_returned; unit; timestamp"
      collection_method: "Calibrated weighing plus ERP issue/return reconciliation"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Representative production period, normally at least 12 consecutive months"
      site_scope: "Each manufacturing site and declared line"
      aggregation_rule: "Sum net material consumption by exact material identity, then divide by net conforming product mass"
      quality_evidence: "Scale calibration; ERP transaction export; approved BOM revision; supplier specification"
    - protocol_id: cp_fabrication_energy
      process_id: "article_fabrication"
      flow_role: "Electricity input"
      record_type: "Submeter or dedicated equipment meter"
      raw_fields: "meter_id; opening_reading; closing_reading; kWh; batch_id; production_time; net_output_mass"
      collection_method: "Direct meter reading"
      unit: "kWh"
      frequency: "Each batch or shift"
      temporal_coverage: "Same period as product output"
      site_scope: "Each site and line"
      aggregation_rule: "Subtract opening from closing reading and normalize only after matching output mass"
      quality_evidence: "Meter calibration; invoice reconciliation; downtime log"
    - protocol_id: cp_fabrication_output_waste
      process_id: "article_fabrication"
      flow_role: "Unpackaged output and material-specific wastes"
      record_type: "Output and segregated waste weighing"
      raw_fields: "batch_id; output_mass; waste_material_identity; waste_mass; destination; timestamp"
      collection_method: "Calibrated output and waste scales"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same period as material inputs"
      site_scope: "Each site and line"
      aggregation_rule: "Sum each waste identity separately; do not combine materials"
      quality_evidence: "Scale calibration; waste ticket; batch yield report"
    - protocol_id: cp_fabrication_air
      process_id: "article_fabrication"
      flow_role: "PM10 emission"
      record_type: "Stack or workplace extraction measurement plus activity records"
      raw_fields: "sampling_point; method; concentration; gas_flow; abatement_state; operating_time; output_mass"
      collection_method: "Applicable standard measurement or documented calculation from collected data"
      unit: "kg"
      frequency: "Measurement frequency justified by relevance and operating change"
      temporal_coverage: "Representative normal operation and significant changes"
      site_scope: "Each relevant emission point"
      aggregation_rule: "Calculate emitted mass for the measured period and normalize to matched output"
      quality_evidence: "Laboratory report; instrument calibration; abatement operating log"
    - protocol_id: cp_wet_materials_output
      process_id: "wet_finishing_drying"
      flow_role: "Article and chemical inputs and finished output"
      record_type: "Batch weighing and dosing records"
      raw_fields: "batch_id; input_article_mass; chemical_identity; concentration; dosed_mass; output_article_mass; timestamp"
      collection_method: "Calibrated weighing and automated or manual dosing log"
      unit: "kg"
      frequency: "Each wet batch"
      temporal_coverage: "Same period as wet-route energy and water"
      site_scope: "Each wet-treatment line"
      aggregation_rule: "Preserve each chemical identity and derive active mass from recorded concentration"
      quality_evidence: "Scale calibration; dosing-system record; formulation revision; batch release record"
    - protocol_id: cp_wet_water_energy
      process_id: "wet_finishing_drying"
      flow_role: "Water, electricity and natural gas inputs"
      record_type: "Water, electricity and gas meters"
      raw_fields: "meter_id; opening_reading; closing_reading; reused_water; energy_unit; calorific_value; batch_id; output_mass"
      collection_method: "Direct meter readings and supplier records"
      unit: "m3; kWh; MJ"
      frequency: "Each batch or shift"
      temporal_coverage: "Same period as wet output"
      site_scope: "Each site and wet line"
      aggregation_rule: "Calculate net supplied water and measured energy separately, then normalize to matched output"
      quality_evidence: "Meter calibration; utility invoice; calorific-value record; water-balance reconciliation"
    - protocol_id: cp_wet_waste_emissions
      process_id: "wet_finishing_drying"
      flow_role: "Wastewater, sludge and fossil CO2"
      record_type: "Discharge meter, sludge scale, fuel record and emission calculation"
      raw_fields: "discharge_volume; sampling_point; treatment_boundary; sludge_wet_mass; sludge_solids; fuel_quantity; carbon_factor; factor_source; output_mass"
      collection_method: "Direct measurement; CO2 calculated only from collected fuel and documented carbon data"
      unit: "m3; kg"
      frequency: "Each batch or discharge; emissions matched to the reporting period"
      temporal_coverage: "Same period as wet inputs"
      site_scope: "Each site and wet-treatment line"
      aggregation_rule: "Keep wastewater, sludge and fossil CO2 separate and normalize to matched output"
      quality_evidence: "Meter/scale calibration; laboratory record; waste transfer note; factor documentation"
    - protocol_id: cp_pack_inputs_output
      process_id: "inspection_packaging"
      flow_role: "Unpackaged article, packaging, electricity and final product"
      record_type: "Weighing, packaging issue/return, meter and inspection records"
      raw_fields: "batch_id; input_mass; packaging_identity; packaging_mass_issued; packaging_mass_returned; electricity; accepted_output_mass; packaging_status"
      collection_method: "Calibrated weighing, ERP reconciliation and direct metering"
      unit: "kg; kWh"
      frequency: "Each batch"
      temporal_coverage: "Same period as accepted product output"
      site_scope: "Each site and packaging line"
      aggregation_rule: "Calculate each packaging component separately and exclude it from net product mass"
      quality_evidence: "Scale/meter calibration; packaging specification; inspection release; ERP export"
    - protocol_id: cp_pack_waste
      process_id: "inspection_packaging"
      flow_role: "Rejected article and packaging wastes"
      record_type: "Segregated waste weighing"
      raw_fields: "batch_id; waste_identity; waste_mass; destination; rework_status; timestamp"
      collection_method: "Calibrated waste scale and waste transfer record"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same period as packing inputs"
      site_scope: "Each site and packaging line"
      aggregation_rule: "Sum each waste identity separately and exclude successfully reworked product"
      quality_evidence: "Scale calibration; rework log; waste transfer note"
  calculation_rules:
    - id: calc_net_material
      applies_to: "Each fabrication or packaging material"
      rule: "net material = mass issued − mass returned to stock; returned material must retain the same identity and usable state"
      inputs:
        - mass_issued
        - mass_returned
      output: "net material consumption by atomic identity"
      source_ids:
        - uk-resource-efficiency-textiles-2024
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = reporting-period or batch amount / net kg of conforming finished article; packaging is not included in the denominator"
      inputs:
        - "collected row amount"
        - "net conforming finished-product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - iso-14044-2006
        - eu-pef-2021
    - id: calc_wet_water_balance
      applies_to: "Wet-process water and wastewater"
      rule: "reconcile supplied water, reused water, product moisture change, measured wastewater and documented evaporation; disclose any unresolved balance"
      inputs:
        - "inlet water"
        - "reused water"
        - "input/output article mass"
        - wastewater
        - "evaporation record"
      output: "reconciled process water balance"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_fossil_co2
      applies_to: "On-site natural-gas combustion"
      rule: "fossil CO2 = collected fuel quantity on the recorded energy basis × documented supplier or site carbon factor; retain factor source and basis"
      inputs:
        - "natural-gas quantity"
        - "calorific value"
        - "carbon factor"
      output: "kg fossil CO2"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_mass_balance
      applies_to: "Fabrication and packing"
      rule: "inputs = conforming product + each separately identified waste/output + documented inventory change, within measurement uncertainty"
      inputs:
        - "atomic material inputs"
        - "product output"
        - "atomic waste outputs"
        - "stock change"
      output: "material-specific mass-balance residual"
      source_ids:
        - eu-textiles-bat-2022
        - uk-resource-efficiency-textiles-2024
  data_quality_requirements:
    - id: dq_reference_identity
      applies_to: "Reference flow"
      requirement: "Confirm the public state-100 Product flow, CPC 27180 leaf, Mass property, Units of mass and kg reference; reject a semantically broader, narrower or different article flow."
      evidence: "Tiangong direct read and un-cpc-3-27180"
    - id: dq_product_stratification
      applies_to: "All foreground records"
      requirement: "Keep product family, dimensions, shell, filling/core, construction, finish and packaging status explicit; do not merge materially different routes into an undisclosed average."
      evidence: "Approved product specification and BOM"
    - id: dq_uuid_gate
      applies_to: "Every UUID-bearing inventory row"
      requirement: "Assign a Tiangong UUID only after flow-hybrid-search discovery and a state-100 direct read confirm exact atomic semantics, flow type, reference property and unit; otherwise leave it blank and retain the row-specific review item."
      evidence: "Tiangong identity evidence"
    - id: dq_completeness
      applies_to: "BOM, utilities, wastes and emissions"
      requirement: "Reconcile all material BOM lines and include every relevant site utility, material-specific waste, wastewater, sludge and direct emission as an atomic exchange."
      evidence: "ERP export; meter records; waste register; input-output inventory"
    - id: dq_temporal_geography
      applies_to: "Foreground and upstream data"
      requirement: "Use records representative of the declared production period, site, geography and technology; disclose data age, proxies and supplier coverage."
      evidence: "Dataset metadata and source records"
    - id: dq_measurement
      applies_to: "Collected foreground quantities"
      requirement: "Retain meter/scale identity, calibration status, original unit, batch or period linkage, aggregation rule and any missing-data treatment."
      evidence: "Calibration records and collection-protocol outputs"
    - id: dq_no_ai_quantity
      applies_to: "All quantitative inventory rows"
      requirement: "Do not use an AI-generated range or default amount; use collected foreground values or calculations from collected records under the declared protocols."
      evidence: "Row value modes and collection links"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "Fail if the reference UUID, Product flow type, CPC 27180 classification, Mass property UUID, Units of mass UUID, kg unit or 1 kg net-product amount differs from section 3."
    source_ids:
      - un-cpc-3-27180
  - rule_id: val_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Fail when any applicable required qualifier is missing or when packaging inclusion and factory-gate boundary are not explicit."
    source_ids:
      - eu-pef-2021
  - rule_id: val_atomic_rows
    applies_to: "Process inventory"
    rule: "Fail if a selected flow combines materials, utilities, fuels, wastes or emissions, or if bilingual process_id, row_id, direction, flow type, order or UUID differs."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: val_uuid_evidence
    applies_to: "UUID-bearing rows"
    rule: "Fail if a UUID lacks both hybrid-search discovery evidence and a state-100 direct read confirming exact semantics, flow type, reference property and unit."
    source_ids:
      - un-cpc-3-27180
  - rule_id: val_foreground_records
    applies_to: "Quantitative rows"
    rule: "Fail if a non-reference amount is an AI estimate, an unsupported default or lacks a linked collection protocol and traceable foreground record."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: val_mass_balance
    applies_to: "Fabrication and packing"
    rule: "Fail when product-family material inputs, net product, atomic wastes and stock change are not reconciled or a residual is left undisclosed."
    source_ids:
      - eu-textiles-bat-2022
      - uk-resource-efficiency-textiles-2024
  - rule_id: val_wet_route
    applies_to: "Conditional wet finishing"
    rule: "Fail when an on-site wet route is declared but water, electricity, fuel where used, each process chemical, wastewater, sludge where generated or relevant direct emission is omitted."
    source_ids:
      - eu-textiles-bat-2022
      - epa-textile-sector-notebook-1997
  - rule_id: val_allocation
    applies_to: "Shared processes and multi-output lines"
    rule: "Fail when allocation is used without first testing subdivision, documenting the causal driver, preserving totals and disclosing the method and sensitivity."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: val_scope
    applies_to: "System boundary"
    rule: "Fail when upstream purchased-material datasets are missing or distribution, use or end-of-life is silently included in or excluded from the declared factory-gate package."
    source_ids:
      - iso-14040-2006
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground unit-process data package for one declared CPC 27180 product family and production route"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Article-specific factory-gate process, product-system and lifecyclemodel construction when required qualifiers, foreground evidence, upstream links and review status are preserved"
  excluded_use: "Undisclosed category-wide averaging; substitution across materially different shells, fillings, cores, constructions or wet routes; consumer-use or end-of-life claims without added stage models; publication with unresolved UUID blockers"
  required_metadata: "PCR id and version; CPC reference; product family; intended function; dimensions; net mass; shell and construction; filling/core identity and content; spring and closure configuration; finish; performance grade; site; geography; period; BOM revision; technology; wet-route status; packaging status; boundary; allocation; upstream datasets; collection protocols"
  required_quality_disclosure: "Foreground coverage; supplier coverage; meter and scale calibration; mass-balance residuals; missing-data treatment; proxy use; data age; allocation drivers; cut-offs; unresolved UUIDs; wastewater and emission monitoring applicability"
  update_trigger: "Any material change in product family, BOM, filling/core, construction, chemical finish, manufacturing technology, wet route, site, energy supply, packaging system, production period, allocation basis or Tiangong identity"
