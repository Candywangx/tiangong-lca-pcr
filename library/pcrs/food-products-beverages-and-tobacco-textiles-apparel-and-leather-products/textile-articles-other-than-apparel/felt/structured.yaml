allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared equipment, utilities and treatment"
    rule: "First subdivide by line, process, lot, meter, time record, or treatment campaign so allocation is avoided wherever practicable."
    source_ids:
      - iso-14044-2006
      - ec-pef-method-2021
  - rule_id: allocation_physical
    applies_to: "Unavoidable shared foreground exchanges"
    rule: "If subdivision is not practicable, allocate using a documented physical causal driver such as machine time, metered energy, bath volume, or treated mass; do not default to economic allocation without justification."
    source_ids:
      - iso-14044-2006
      - ec-pef-method-2021
  - rule_id: allocation_rework
    applies_to: "Internally recycled web, edge trim and off-spec felt"
    rule: "Keep internal rework inside the foreground system and report gross generation and returned mass separately; assign no avoided-product credit within the foreground inventory."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_external_recycling
    applies_to: "Material leaving for recycling"
    rule: "Record the actual waste flow and destination; apply any end-of-life or recycled-content treatment only in the downstream study method and disclose it separately from foreground measured mass."
    source_ids:
      - ec-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_fibre_receipts
      process_id: "p_fibre_web"
      flow_role: "raw_wool_fibre; polyester_staple_fibre; viscose_staple_fibre"
      record_type: "weighbridge, scale, issue and stock records"
      raw_fields: "material identity; supplier lot; gross/tare/net mass; moisture basis; opening stock; closing stock; returns; recycled share"
      collection_method: "calibrated weighing and inventory reconciliation"
      unit: "kg"
      frequency: "each receipt and issue"
      temporal_coverage: "representative production period, minimum one complete lot"
      site_scope: "all fibre stores feeding the declared product"
      aggregation_rule: "net issued mass = issues + opening stock - closing stock - documented returns"
      quality_evidence: "calibration certificate; supplier specification; composition analysis; stock reconciliation"
    - protocol_id: cp_fibre_prep_electricity
      process_id: "p_fibre_web"
      flow_role: "electricity_fibre_prep"
      record_type: "submeter record"
      raw_fields: "meter id; start/end reading; multiplier; downtime; products and mass processed"
      collection_method: "dedicated meter or documented shared-meter allocation"
      unit: "kWh"
      frequency: "shift or batch"
      temporal_coverage: "same period as product mass"
      site_scope: "fibre preparation line and associated extraction"
      aggregation_rule: "sum corrected readings and allocate only documented shared loads"
      quality_evidence: "meter calibration; reading export; allocation log"
    - protocol_id: cp_fibre_web_output
      process_id: "p_fibre_web"
      flow_role: "prepared_fibre_web"
      record_type: "intermediate transfer record"
      raw_fields: "lot id; blend; web orientation; basis weight; width; conditioned mass"
      collection_method: "calibrated in-line or batch weighing"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "complete lot"
      site_scope: "fibre preparation output"
      aggregation_rule: "sum accepted transfers to each felting route"
      quality_evidence: "scale check; lot genealogy; operator sign-off"
    - protocol_id: cp_fibre_prep_waste
      process_id: "p_fibre_web"
      flow_role: "fibre_preparation_waste"
      record_type: "waste container record"
      raw_fields: "waste type; fibre composition; gross/tare/net mass; internal return; destination"
      collection_method: "container weighing and dispatch reconciliation"
      unit: "kg"
      frequency: "each container"
      temporal_coverage: "same period as product mass"
      site_scope: "opening, carding, laying, filters and housekeeping"
      aggregation_rule: "dispatched mass minus documented internal return"
      quality_evidence: "scale calibration; waste manifest; reuse log"
    - protocol_id: cp_fibre_prep_pm
      process_id: "p_fibre_web"
      flow_role: "particulate_matter_fibre_prep"
      record_type: "stack or workplace-exhaust monitoring"
      raw_fields: "sampling location; particle fraction; concentration; gas volume; operating hours; abatement status"
      collection_method: "applicable validated monitoring method"
      unit: "kg"
      frequency: "permit or campaign frequency"
      temporal_coverage: "representative operation"
      site_scope: "all relevant exhaust points"
      aggregation_rule: "concentration times corrected gas volume, summed by compartment"
      quality_evidence: "laboratory report; method; detection limit; operating log"
    - protocol_id: cp_needling_material
      process_id: "p_needle_felting"
      flow_role: "prepared_web_input"
      record_type: "transfer and scale record"
      raw_fields: "lot id; web mass; blend; width; basis weight"
      collection_method: "calibrated weighing"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "complete needle-felting lot"
      site_scope: "needle line input"
      aggregation_rule: "sum transferred web mass"
      quality_evidence: "scale check; lot genealogy"
    - protocol_id: cp_needling_electricity
      process_id: "p_needle_felting"
      flow_role: "electricity_needling"
      record_type: "submeter record"
      raw_fields: "meter readings; multiplier; operating time; product mass"
      collection_method: "dedicated meter or documented shared-meter allocation"
      unit: "kWh"
      frequency: "shift or batch"
      temporal_coverage: "same period as product mass"
      site_scope: "needle looms and associated equipment"
      aggregation_rule: "sum corrected readings"
      quality_evidence: "calibration; reading export; allocation log"
    - protocol_id: cp_needling_outputs
      process_id: "p_needle_felting"
      flow_role: "needle_felt_intermediate; needle_trim_waste"
      record_type: "production and waste records"
      raw_fields: "good intermediate mass; punch density; penetration; passes; trim/reject mass; internal rework; destination"
      collection_method: "calibrated weighing and lot reconciliation"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "complete needle-felting lot"
      site_scope: "needle line"
      aggregation_rule: "report good output, gross rejects and internal return separately"
      quality_evidence: "scale check; machine recipe; waste manifest; lot reconciliation"
    - protocol_id: cp_wet_materials
      process_id: "p_wet_felting"
      flow_role: "wool_batt_input; sodium_carbonate_wet_felting"
      record_type: "scale, recipe and issue record"
      raw_fields: "lot id; batt mass; chemical identity; grade; concentration; issued/returned mass"
      collection_method: "calibrated weighing and approved recipe reconciliation"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete wet-felting batch"
      site_scope: "wet-felting/fulling equipment"
      aggregation_rule: "net issued mass by atomic material"
      quality_evidence: "scale calibration; SDS/specification; signed recipe and batch sheet"
    - protocol_id: cp_wet_water
      process_id: "p_wet_felting"
      flow_role: "process_water_wet_felting"
      record_type: "water submeter or tank record"
      raw_fields: "source; start/end reading; tank volume; batch id; rinse count"
      collection_method: "calibrated submeter or verified tank-volume calculation"
      unit: "m3"
      frequency: "batch or shift"
      temporal_coverage: "same period as product mass"
      site_scope: "wetting, fulling, washing and rinsing"
      aggregation_rule: "gross intake without netting wastewater"
      quality_evidence: "calibration; meter export; batch sheet"
    - protocol_id: cp_wet_steam
      process_id: "p_wet_felting"
      flow_role: "steam_wet_felting"
      record_type: "steam meter record"
      raw_fields: "mass/energy reading; pressure; condensate return; supplier boundary"
      collection_method: "calibrated steam meter"
      unit: "MJ"
      frequency: "batch or shift"
      temporal_coverage: "same period as product mass"
      site_scope: "wet-felting heat users"
      aggregation_rule: "sum supplied steam on declared energy basis"
      quality_evidence: "calibration; pressure record; supplier invoice"
    - protocol_id: cp_wet_outputs_waste
      process_id: "p_wet_felting"
      flow_role: "wet_felt_intermediate; wet_felting_wastewater; wool_fibre_sludge"
      record_type: "output scale, effluent meter and waste records"
      raw_fields: "intermediate mass/moisture; effluent volume; sludge wet/dry mass; destination"
      collection_method: "calibrated weighing, flow metering and dispatch reconciliation"
      unit: "kg or m3"
      frequency: "each batch or discharge"
      temporal_coverage: "complete wet-felting batch and matching treatment period"
      site_scope: "wet process and hand-off to treatment"
      aggregation_rule: "report each atomic output separately; state wet/dry basis"
      quality_evidence: "calibration; laboratory solids result; waste manifest; lot reconciliation"
    - protocol_id: cp_finishing_materials
      process_id: "p_finishing_packing"
      flow_role: "needle_felt_input_finishing; wet_felt_input_finishing; acrylic_latex_binder"
      record_type: "transfer, scale, recipe and issue records"
      raw_fields: "intermediate id/mass; binder identity; wet mass; solids fraction; returns"
      collection_method: "calibrated weighing and recipe reconciliation"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "complete finishing lot"
      site_scope: "finishing line"
      aggregation_rule: "net issued mass by atomic material"
      quality_evidence: "scale calibration; supplier specification; signed recipe; lot genealogy"
    - protocol_id: cp_finishing_energy
      process_id: "p_finishing_packing"
      flow_role: "electricity_finishing; natural_gas_drying"
      record_type: "electricity and gas meter records"
      raw_fields: "readings; multipliers; heating-value basis; operating time; product mass"
      collection_method: "calibrated meters and documented shared-meter allocation"
      unit: "kWh or MJ"
      frequency: "shift or batch"
      temporal_coverage: "same period as product mass"
      site_scope: "dryers, calendars, cutters and packing equipment"
      aggregation_rule: "sum corrected readings by energy carrier"
      quality_evidence: "calibration; meter export; invoice; allocation log"
    - protocol_id: cp_packaging
      process_id: "p_finishing_packing"
      flow_role: "corrugated_paperboard_box; ldpe_packaging_film"
      record_type: "packaging issue record"
      raw_fields: "material identity; supplier lot; unit mass; units issued; returns; included product mass"
      collection_method: "count times verified unit mass or direct weighing"
      unit: "kg"
      frequency: "each packing lot"
      temporal_coverage: "complete product lot"
      site_scope: "packing area"
      aggregation_rule: "net issued mass by packaging component"
      quality_evidence: "unit-mass check; supplier specification; issue/return record"
    - protocol_id: cp_finished_felt
      process_id: "p_finishing_packing"
      flow_role: "finished_felt"
      record_type: "final scale and inspection record"
      raw_fields: "lot id; gross/tare/net mass; conditioning basis; basis weight; thickness/pressure; composition; route; finish; accepted/rejected status"
      collection_method: "calibrated weighing and specification testing"
      unit: "kg"
      frequency: "each accepted lot"
      temporal_coverage: "complete production lot"
      site_scope: "final inspection and dispatch boundary"
      aggregation_rule: "sum accepted net mass only"
      quality_evidence: "calibration; ISO/equivalent test reports; certificate of analysis; inspection release"
    - protocol_id: cp_finishing_wastes
      process_id: "p_finishing_packing"
      flow_role: "felt_offcuts; finishing_wastewater"
      record_type: "waste scale, effluent meter and dispatch record"
      raw_fields: "waste identity; mass/volume; internal rework; treatment destination; discharge period"
      collection_method: "calibrated weighing or flow metering"
      unit: "kg or m3"
      frequency: "each container or discharge"
      temporal_coverage: "same period as product mass"
      site_scope: "cutting, finishing and cleanup"
      aggregation_rule: "report dispatched waste after subtracting documented internal return"
      quality_evidence: "calibration; waste manifest; effluent record; rework log"
    - protocol_id: cp_combustion_emissions
      process_id: "p_finishing_packing"
      flow_role: "carbon_dioxide_fossil_drying; nitrogen_oxides_drying"
      record_type: "stack monitoring record"
      raw_fields: "pollutant species; concentration; gas volume; oxygen correction; operating hours; fuel use"
      collection_method: "applicable validated stack test or continuous monitoring"
      unit: "kg"
      frequency: "permit or campaign frequency"
      temporal_coverage: "representative combustion operation"
      site_scope: "on-site natural-gas exhaust points"
      aggregation_rule: "calculate from measured concentration and corrected gas volume only"
      quality_evidence: "test report; method; calibration gas; detection limit; operating log"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = period or lot amount / accepted finished felt mass on the same declared mass basis"
      inputs:
        - "atomic flow amount"
        - "accepted finished_felt mass"
      output: "amount per 1 kg finished felt"
      source_ids:
        - iso-14044-2006
        - ec-pef-method-2021
    - id: calc_fibre_issue
      applies_to: "Fibre inputs"
      rule: "net fibre issued = issues + opening stock - closing stock - supplier returns; internal returned fibre remains separately documented"
      inputs:
        - issue
        - "stock and return records"
      output: "net kg fibre input"
      source_ids:
        - ec-pef-method-2021
    - id: calc_fibre_composition
      applies_to: "Finished-felt composition"
      rule: "calculate percentage by mass using the declared regulatory or validated analytical method and report agreed moisture allowance and accuracy"
      inputs:
        - "test result"
        - "sample pretreatment"
        - "moisture allowance"
        - "component masses"
      output: "fibre percentage by mass"
      source_ids:
        - eu-textile-regulation-1007-2011
    - id: calc_mass_reconciliation
      applies_to: "Each process and complete foreground system"
      rule: "compare atomic mass inputs with product outputs, separately measured wastes, stock change and measured releases; investigate material unexplained residuals rather than assigning them to a generic flow"
      inputs:
        - "input/output masses"
        - "stock change"
        - "moisture change"
        - emissions
      output: "signed mass-reconciliation record"
      source_ids:
        - iso-14044-2006
        - ec-pef-method-2021
    - id: calc_shared_resource
      applies_to: "Shared meters and treatment"
      rule: "allocate only after subdivision is impracticable, using the documented physical causal driver selected under allocation_physical"
      inputs:
        - "shared total"
        - "causal-driver values"
      output: "allocated atomic flow amount"
      source_ids:
        - iso-14044-2006
        - ec-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product, intermediates and purchased inputs"
      requirement: "Preserve supplier/lot identity, fibre composition, route, recycled share, binder/finish, moisture basis, and Tiangong UUID decision for every used flow."
      evidence: "supplier specifications; lot genealogy; composition test; manifest UUID decision"
    - id: dq_measurement
      applies_to: "Foreground quantities"
      requirement: "Use calibrated meters or scales; retain reading interval, multiplier, corrections, detection limits, and allocation records."
      evidence: "calibration certificates; raw exports; laboratory reports; signed calculations"
    - id: dq_temporal
      applies_to: "Foreground dataset"
      requirement: "Cover a representative period that includes all declared routes and at least one complete production lot; disclose shutdown, start-up, and abnormal-event treatment."
      evidence: "production calendar; lot list; exception log"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Reconcile all applicable process cards and document non-applicability; keep fibres, energy carriers, packaging components, wastes, and emissions as their individual concrete exchanges."
      evidence: "completed applicability matrix; mass reconciliation; inventory review"
    - id: dq_testing
      applies_to: "Basis weight, thickness and composition"
      requirement: "State test method, specimen conditioning, sample size, applied pressure where relevant, result and uncertainty/accuracy."
      evidence: "ISO 139, ISO 9073-1/2 or declared equivalent test reports; composition analysis"
    - id: dq_uuid
      applies_to: "UUID-bearing and UUID-free rows"
      requirement: "Use a UUID only after hybrid candidate discovery and public state100 direct read confirm exact name, type, CPC or role, flow property, and unit; retain row-specific rejection reasons otherwise."
      evidence: "Tiangong readback evidence; manifest lookup decisions"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require the accepted state100 Felt product-flow UUID, CPC 27921 identity, Mass property UUID, 1 kg unit, and all required qualifiers."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: validate_scope
    applies_to: "Product classification"
    rule: "Reject nonwovens, floor coverings, garments, headgear, paper felt, and other separately classified made-up products from this PCR."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: validate_route
    applies_to: "Process completeness"
    rule: "Require p_fibre_web and p_finishing_packing; require at least one of p_needle_felting or p_wet_felting, and evidence for every omitted conditional operation."
    source_ids:
      - us-epa-textile-study-1979
      - us-epa-textile-development-1982
  - rule_id: validate_atomic_flows
    applies_to: "Inventory"
    rule: "Reject collection labels, combined energy carriers, unspecified fibre mixtures, combined packaging, combined wastes, and any card whose selected flow is not one atomic exchange."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_mass_basis
    applies_to: "Normalization"
    rule: "Require all numerator records and accepted product mass to use the same period and declared conditioning/dry-mass basis."
    source_ids:
      - iso-139-2005
      - iso-14044-2006
  - rule_id: validate_quality_tests
    applies_to: "Product specification"
    rule: "Require basis-weight, thickness, conditioning, and composition methods with applicable result metadata and declared alternatives where ISO 9073 scope does not apply."
    source_ids:
      - iso-9073-1-2023
      - iso-9073-2-1995
      - iso-139-2005
      - eu-textile-regulation-1007-2011
  - rule_id: validate_allocation
    applies_to: "Shared resources and wastes"
    rule: "Require documented subdivision attempt, physical causal driver when allocation remains, and separate gross waste/internal-rework records."
    source_ids:
      - iso-14044-2006
      - ec-pef-method-2021
  - rule_id: validate_uuid_status
    applies_to: "All inventory rows"
    rule: "Confirm accepted UUIDs by hybrid and state100 direct read; require every UUID-free row to retain its specific rejection reason in manifest review metadata."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground felt manufacturing dataset suitable for review and later publication as a secondary or background dataset"
  downstream_use: "LCA process datasets and lifecycle models requiring CPC 27921 felt at the factory gate"
  allowed_use: "The declared fibre composition, felt-forming route, basis weight, thickness, finish, geography, technology, mass basis and packaging state match the downstream system"
  excluded_use: "Nonwovens, felt floor coverings, made-up felt articles, paper felt, or products with materially different fibre chemistry, route, finish, performance, geography, or packaging boundary"
  required_metadata: "PCR id/version; CPC 27921; UUID decision; fibre composition and recycled share; wet/needle route; basis weight; thickness and pressure; conditioning basis; binder/finish; packaging; geography; technology; reference period; allocation; data quality; waste destinations"
  required_quality_disclosure: "Primary-data share, meter and test coverage, sampling and conditioning methods, composition method, mass reconciliation, allocation, missing UUIDs, proxy upstream datasets, abnormal events, and review status"
  update_trigger: "Change in fibre blend or recycled share, felt-forming route, binder/finish, basis weight or thickness class, energy/water system, waste treatment, packaging, site/technology, allocation method, Tiangong identity, source standard, or representative period"
data_sources:
  - id: "unsd-cpc-3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 structure and explanatory notes, updated 30 June 2025, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "CPC 27921 identity, adjacent exclusions and product boundary"
  - id: "us-epa-textile-study-1979"
    type: "official_guidance"
    reference: "US EPA, Technical Study Report: Textile Mills Point Source Category, NEPIS 9101NAZP, https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9101NAZP.TXT"
    used_for: "Felt material identity; web formation; mechanical, moisture, heat and chemical action; fibre preparation, bonding, drying and finishing decomposition"
  - id: "us-epa-textile-development-1982"
    type: "official_guidance"
    reference: "US EPA, Development Document for Effluent Limitations Guidelines and Standards for the Textile Mills Point Source Category, 1982, https://19january2021snapshot.epa.gov/sites/static/files/2016-04/documents/textile-mills_dd_1982.pdf"
    used_for: "Felted-fabric route, fulling/washing water use, wastewater and process-boundary completeness"
  - id: "us-epa-needle-punched-filtration-1976"
    type: "official_guidance"
    reference: "US EPA, Efficient Use of Fibrous Structures in Filtration, NEPIS 91015XYA, https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=91015XYA.TXT"
    used_for: "Needle-punching mechanism, web passes, needling parameters and needle-felt process records"
  - id: "ec-jrc-textiles-bref-2023"
