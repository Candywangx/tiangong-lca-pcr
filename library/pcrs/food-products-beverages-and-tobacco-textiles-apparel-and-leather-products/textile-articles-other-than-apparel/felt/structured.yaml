measurement_rules:
  - id: reference_mass
    applies_to: "Finished felt"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground exchanges to 1 kg of accepted finished felt on the declared conditioned or dry-mass basis; state which basis is used."
  - id: basis_weight
    applies_to: "Finished felt specification"
    required_property_ref:
      name: "Mass per unit area"
      uuid: ""
    required_unit: "g/m2"
    rule: "Determine and report mass per unit area using ISO 9073-1:2023 when applicable to the tested construction, or a declared equivalent validated method."
  - id: felt_thickness
    applies_to: "Finished felt specification"
    required_property_ref:
      name: "Length"
      uuid: ""
    required_unit: "mm"
    rule: "Report thickness together with applied pressure and test method; ISO 9073-2:1995 applies when the construction falls within its nonwoven scope."
  - id: conditioning_basis
    applies_to: "Physical testing and reference mass"
    required_property_ref:
      name: "Temperature and relative humidity"
      uuid: ""
    required_unit: "degC and % RH"
    rule: "Condition and test textile specimens using ISO 139:2005 or disclose the agreed alternative atmosphere; do not mix conditioned and oven-dry masses without conversion."
  - id: fibre_composition
    applies_to: "Finished felt and fibre inputs"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "% by mass"
    rule: "Use the applicable regulated textile fibre names and retain the sampling, analysis method, result, and accuracy evidence used to establish composition."
process_map:
