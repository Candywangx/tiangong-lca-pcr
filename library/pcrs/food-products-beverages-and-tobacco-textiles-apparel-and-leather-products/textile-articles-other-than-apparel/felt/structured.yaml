    name: "Fibre preparation and web or batt formation"
    inclusion: "required"
    inclusion_condition: "All felt production"
    role: "Receive, open, blend, card and form the declared fibre web or batt"
    quantitative_reference: "1 kg accepted finished felt"
  - id: p_needle_felting
    name: "Mechanical needle felting"
    inclusion: "conditional"
    inclusion_condition: "Declared needle-felted route"
    role: "Mechanically entangle the fibre web with barbed needles"
    quantitative_reference: "1 kg accepted finished felt"
  - id: p_wet_felting
    name: "Wet felting and fulling"
    inclusion: "conditional"
    inclusion_condition: "Declared wet-felted or fulled route"
    role: "Interlock feltable fibres through mechanical working, moisture, heat and any declared chemical aid"
    quantitative_reference: "1 kg accepted finished felt"
  - id: p_finishing_packing
    name: "Drying, finishing, inspection, cutting and packing"
    inclusion: "required"
    inclusion_condition: "All felt production; individual finish and fuel cards remain conditional"
    role: "Bring felt to declared sale specification and factory-gate state"
    quantitative_reference: "1 kg accepted finished felt"
