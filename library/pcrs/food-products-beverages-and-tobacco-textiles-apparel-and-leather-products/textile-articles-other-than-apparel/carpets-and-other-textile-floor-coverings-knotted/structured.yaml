measurement_rules:
  - id: reference_mass
    applies_to: "accepted finished knotted carpet"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine net dry carpet mass on a calibrated scale after conditioning or record the measured moisture condition; exclude reusable transport equipment and normalize all exchanges to 1 kg accepted product."
  - id: yarn_mass
    applies_to: "pile, warp, weft, and binding yarn inputs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record issued mass less returned unused yarn for each yarn identity and role; do not combine different fibre compositions or dyed states."
  - id: water_mass
    applies_to: "supplied process water"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated meter data or a documented density conversion from measured volume at the stated temperature; do not substitute wastewater volume for supplied water."
