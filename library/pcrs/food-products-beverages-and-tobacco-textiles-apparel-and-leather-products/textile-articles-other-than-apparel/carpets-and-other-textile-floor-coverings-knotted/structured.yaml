product_category_identity:
  canonical_pcr_id: "pcr.food-products-beverages-and-tobacco-textiles-apparel-and-leather-products.textile-articles-other-than-apparel.carpets-and-other-textile-floor-coverings-knotted"
  classification_refs: "CPC 3.0:27210 — Carpets and other textile floor coverings, knotted"
  covered_products: "Finished textile floor coverings with pile yarn individually knotted to warp yarn and secured by weft picks; declared hand-knotted rugs and carpets of wool, silk, cotton, other textile yarns, or declared blends"
  excluded_products: "Machine-woven non-knotted carpets; tufted or flocked carpets; needle-punched, braided, hooked, or non-textile floor coverings; installation systems and underlays sold separately"
  representative_product: "Wool-pile hand-knotted carpet with cotton warp and weft, washed, sheared, stretched, clipped, inspected, and packed"
  production_route: "Purchased yarn receipt; yarn opening and loom preparation; manual knotting and weft insertion; washing; shearing and side binding; drying and stretching; final clipping and inspection; packing"
  market_state: "Finished, dry, quality-accepted, packed product at the manufacturing plant gate"
functional_unit:
  what: "Finished knotted textile floor covering providing decorative and protective floor coverage"
  how_much: "1 kg net dry mass of accepted carpet, excluding transport pallet and reusable transport equipment but including non-reusable sales packaging when supplied"
  how_well: "Conforms to the declared fibre composition, knot type, knot density, dimensions, pile height, colour/design, finishing route, moisture condition, and quality acceptance criteria"
  how_long_or_cycle: "Production through the manufacturing plant gate; service life is declared separately and is not assumed by this mass-based production reference"
  reference_flow_link: "Output row knotted_carpet_output"
system_boundary:
  rules:
    - rule_id: boundary_integrated_route
      applies_to: "foreground manufacturing"
      rule: "Include receiving and issuing yarn, yarn opening, loom preparation, hand knotting and weft insertion, washing, shearing, side binding, applicable singeing, drying, stretching, final clipping, inspection, and non-reusable sales packaging controlled by the reporting site."
      source_ids:
        - cepc-carpet-production-process
    - rule_id: boundary_purchased_inputs
      applies_to: "purchased product inputs"
      rule: "Keep purchased yarn, electricity, water, detergent, and packaging as visible product inputs and connect each accepted identity to an upstream dataset; do not absorb them into an undocumented aggregate."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_inhouse_wet_processing
      applies_to: "in-house scouring or dyeing"
      rule: "When scouring or dyeing is controlled by the reporting site, add it as a separate foreground process and record every actual dye, auxiliary chemical, water input, energy input, waste stream, and direct emission as its own atomic exchange; apply the textiles BAT monitoring rules."
      source_ids:
        - eu-textiles-bat-2022
        - cepc-carpet-production-process
    - rule_id: boundary_direct_releases
      applies_to: "site-controlled releases"
      rule: "Record every measured or calculated direct release to air, water, or soil and every transferred waste stream separately; do not replace actual pollutant identities with a combined emissions row."
      source_ids:
        - eu-textiles-bat-2022
        - iso-14044-2006
    - rule_id: boundary_exclusions
      applies_to: "default production study"
      rule: "Exclude capital equipment, worker commuting, product installation, use-stage cleaning, service life, and end-of-life unless the declared goal and scope explicitly include them; disclose every applied exclusion."
      source_ids:
        - iso-14040-2006
        - iso-14044-2006
boundary_abstraction:
