allocation_rules:
  - rule_id: allocation_avoid_subdivide
    applies_to: "separately measurable products, batches, and process steps"
    rule: "Avoid allocation by separate metering, batch records, and process subdivision before applying an allocation factor."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_shared_utilities
    applies_to: "shared electricity, water, and site services"
    rule: "Use a documented causal driver such as machine hours, metered operating time, or measured water throughput; do not use production mass when it does not represent causality."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022
  - rule_id: allocation_recovered_material
    applies_to: "yarn trimmings or other recovered material"
    rule: "Keep recovered material as an explicit waste or co-product output according to its actual legal and operational status; do not credit avoided production inside the foreground inventory."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_unavoidable
    applies_to: "inseparable multi-product operations"
    rule: "If subdivision and causal allocation are not practicable, apply a disclosed physical relationship; use economic allocation only when no defensible physical relationship exists and report a sensitivity check."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_yarn_material_records
      process_id: "integrated_knotted_carpet_manufacturing"
      flow_role: "pile, warp, weft, and binding yarn inputs"
      record_type: "stock issue/return and batch bill of materials"
      raw_fields: "product_id; supplier; lot; fibre_content; dyed_state; yarn_count_ply; role; issued_mass; returned_mass; batch_id"
      collection_method: "calibrated scale plus controlled stock issue and return records"
      unit: "kg"
      frequency: "each issue and return"
      temporal_coverage: "all conforming batches in the reporting period"
      site_scope: "each manufacturing site"
      aggregation_rule: "sum issued minus returned mass by identity and role, then divide by accepted output mass"
      quality_evidence: "scale calibration; signed stock record; supplier specification; batch reconciliation"
    - protocol_id: cp_water_wastewater_records
      process_id: "integrated_knotted_carpet_manufacturing"
      flow_role: "process water input and carpet-washing wastewater output"
      record_type: "meter and discharge record"
      raw_fields: "meter_id; timestamp; batch_id; supplied_water; wastewater_volume_or_mass; temperature; density_method; destination; pH; COD_or_TOC; TSS; relevant_chemistry_parameters"
      collection_method: "calibrated water/discharge meters and representative sampling under the applicable monitoring plan"
      unit: "kg; m3; parameter-specific units"
      frequency: "each batch or continuous meter total; parameters at applicable monitoring frequency"
      temporal_coverage: "all washing operations in the reporting period"
      site_scope: "each manufacturing site and washing line"
      aggregation_rule: "reconcile opening/closing meter totals and allocate only with documented causal evidence"
      quality_evidence: "meter calibration; laboratory method; sample chain of custody; discharge log"
    - protocol_id: cp_washing_chemical_records
      process_id: "integrated_knotted_carpet_manufacturing"
      flow_role: "nonionic carpet-washing detergent"
      record_type: "formulation issue record"
      raw_fields: "supplier_product; formulation_id; lot; active_content; issued_mass; returned_mass; batch_id"
      collection_method: "calibrated scale or controlled dispensing system plus supplier specification"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "all washing batches in the reporting period"
      site_scope: "each washing location"
      aggregation_rule: "sum net issued mass by exact formulation and divide by accepted output mass"
      quality_evidence: "scale/dispenser calibration; supplier SDS or specification; issue/return record"
    - protocol_id: cp_energy_records
      process_id: "integrated_knotted_carpet_manufacturing"
      flow_role: "low-voltage alternating current"
      record_type: "meter and operating record"
      raw_fields: "meter_id; voltage_level; opening_reading; closing_reading; timestamp; process_step; machine_hours; batch_id"
      collection_method: "calibrated submeter; shared meter requires documented causal allocation"
      unit: "kWh"
      frequency: "continuous or each reporting interval"
      temporal_coverage: "representative full reporting period including seasonal drying conditions"
      site_scope: "each manufacturing site"
      aggregation_rule: "sum included-process electricity and divide by accepted output mass"
      quality_evidence: "meter calibration; invoices; operating logs; allocation worksheet"
    - protocol_id: cp_packaging_records
      process_id: "integrated_knotted_carpet_manufacturing"
      flow_role: "LDPE sales-packaging film"
      record_type: "packaging issue and product specification"
      raw_fields: "material_grade; supplier; recycled_content; thickness; issued_mass; returned_mass; product_batch"
      collection_method: "calibrated scale and controlled packaging issue/return record"
      unit: "kg"
      frequency: "each packaging batch"
      temporal_coverage: "all accepted product in the reporting period"
      site_scope: "each packing location"
      aggregation_rule: "net incorporated non-reusable film divided by accepted output mass"
      quality_evidence: "scale calibration; supplier specification; packaging reconciliation"
    - protocol_id: cp_solid_waste_records
      process_id: "integrated_knotted_carpet_manufacturing"
      flow_role: "wool trimmings and cotton offcuts"
      record_type: "segregated waste weighing and transfer record"
      raw_fields: "waste_identity; fibre_content; source_step; batch_id; gross_mass; tare_mass; destination; recovery_or_disposal_route"
      collection_method: "segregated containers, calibrated scale, and matched transfer note"
      unit: "kg"
      frequency: "each container or transfer"
      temporal_coverage: "all conforming production in the reporting period"
      site_scope: "each manufacturing site and destination"
      aggregation_rule: "sum net mass by exact waste identity and destination, then divide by accepted output mass"
      quality_evidence: "scale calibration; container log; transfer note; treatment confirmation"
    - protocol_id: cp_product_acceptance_records
      process_id: "integrated_knotted_carpet_manufacturing"
      flow_role: "accepted finished knotted carpet output"
      record_type: "final inspection and weighing record"
      raw_fields: "product_id; batch_id; fibre_composition; knot_type; knot_density; dimensions; pile_height; finishing_route; moisture_condition; net_carpet_mass; packaging_mass; acceptance_status"
      collection_method: "calibrated scale plus documented final inspection"
      unit: "kg"
      frequency: "each finished carpet"
      temporal_coverage: "all accepted carpets in the reporting period"
      site_scope: "each manufacturing site"
      aggregation_rule: "sum accepted net dry carpet mass; rejected product remains a separate disposition"
      quality_evidence: "scale calibration; inspection record; product specification; rejection log"
  calculation_rules:
    - id: normalize_reference_mass
      applies_to: "all foreground exchanges"
      rule: "normalized exchange = collected exchange amount / accepted net dry carpet mass"
      inputs:
        - "collected exchange amount"
        - "accepted net dry carpet mass"
      output: "exchange per 1 kg accepted carpet"
      source_ids:
        - iso-14044-2006
    - id: net_material_issue
      applies_to: "yarn, detergent, and packaging inputs"
      rule: "net consumed mass = issued mass - same-identity unused mass returned to controlled stock"
      inputs:
        - "issued mass"
        - "returned mass"
        - "exact material identity"
      output: "net input mass"
      source_ids:
        - iso-14044-2006
    - id: wastewater_mass_conversion
      applies_to: "metered wastewater reported by volume"
      rule: "wastewater mass = metered volume × documented density at the stated condition"
      inputs:
        - "discharge volume"
        - density
        - "temperature or stated condition"
      output: "kg wastewater"
      source_ids:
        - eu-textiles-bat-2022
    - id: pollutant_load
      applies_to: "monitored wastewater parameters"
      rule: "pollutant load = flow-proportional concentration × wastewater volume, with units converted consistently"
      inputs:
        - concentration
        - "matched discharge volume"
        - "sampling period"
      output: "pollutant mass for a separately identified elementary flow or treatment record"
      source_ids:
        - eu-textiles-bat-2022
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and yarn inputs"
      requirement: "Preserve exact product identity and required qualifiers; do not substitute woven, tufted, flocked, or generic carpet flows for CPC 27210."
      evidence: "Tiangong state_code 100 direct read; supplier specifications; final inspection record; un-cpc-3-0"
    - id: dq_measurement_traceability
      applies_to: "all foreground amounts"
      requirement: "Retain calibrated-meter, scale, invoice, stock, batch, sampling, and calculation records linking each normalized value to raw evidence."
      evidence: "calibration certificates; invoices; signed records; calculation worksheet; iso-14044-2006"
    - id: dq_process_completeness
      applies_to: "site inventory"
      requirement: "Reconcile annual or reporting-period consumption of water, energy, textile materials, process chemicals, wastewater, recovered material, and each waste type, broken down to process level as far as practicable."
      evidence: "site reconciliation; process meters; waste transfer records; eu-textiles-bat-2022"
    - id: dq_route_representativeness
      applies_to: "reporting period"
      requirement: "Cover a representative full production period or complete declared campaign, including applicable washing and drying conditions, and disclose exclusions, abnormal operation, and data gaps."
      evidence: "production schedule; operating log; disclosed data-quality statement; iso-14044-2006"
    - id: dq_wastewater_monitoring
      applies_to: "in-house washing, scouring, or dyeing"
      requirement: "Characterize relevant wastewater streams at key locations and use applicable EN, ISO, national, or equivalent scientific methods for relevant parameters."
      evidence: "sampling plan; laboratory reports; chain of custody; eu-textiles-bat-2022"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the output is the state_code 100 Product flow for CPC 27210 with Mass and kg, and confirm all required product qualifiers are present."
    source_ids:
      - un-cpc-3-0
  - rule_id: validate_atomic_inventory
    applies_to: "every inventory row"
    rule: "Confirm each row contains one specific exchange; reject collection labels, selector instructions, combined utilities, combined materials, combined wastes, or combined emissions."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_uuid_readback
    applies_to: "every UUID-bearing flow"
    rule: "Confirm each UUID by both flow-hybrid-search and Tiangong CLI state_code 100 direct read; remove or leave blank any UUID whose flow type, material/state, classification, property, unit, route, or destination is not semantically exact."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_foreground_evidence
    applies_to: "every amount"
    rule: "Confirm every non-reference amount is derived from the declared collection protocol and raw foreground record; reject AI estimates and undocumented default ranges."
    source_ids:
      - iso-14044-2006
      - eu-textiles-bat-2022
  - rule_id: validate_route_expansion
    applies_to: "in-house scouring, dyeing, combustion, or wastewater treatment"
    rule: "Confirm each controlled route is represented by a separate process and each actual chemical, energy carrier, waste, and direct emission is a separate atomic exchange."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_mass_reconciliation
    applies_to: "accepted product, yarn inputs, and segregated textile wastes"
    rule: "Reconcile issued and returned yarn, accepted product mass, measured textile wastes, inventory change, and documented moisture basis; investigate and disclose material discrepancies."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_allocation
    applies_to: "shared operations"
    rule: "Confirm subdivision was attempted first and every remaining allocation uses a documented causal or disclosed fallback basis with sensitivity where required."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_completeness_disclosure
    applies_to: "published dataset"
    rule: "Confirm included/excluded stages, geography, period, yarn dyed state, finishing steps, drying route, wastewater destination, waste routes, packaging basis, missing UUIDs, and data gaps are disclosed."
    source_ids:
      - iso-14040-2006
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "foreground production dataset for finished knotted carpet"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "LCI and LCA models needing a mass-based plant-gate dataset for a declared CPC 27210 knotted carpet route with matching qualifiers"
  excluded_use: "Machine-woven, tufted, flocked, needle-punched, braided, hooked, or non-textile floor coverings; service-life comparisons without a separately justified functional equivalence; undisclosed extrapolation across fibre composition, knot density, finishing route, geography, or period"
  required_metadata: "canonical PCR id; CPC reference; product and yarn qualifiers; plant geography; reporting period; technology and process route; foreground/upstream boundary; allocation; wastewater and waste destinations; reference-flow UUID/property/unit; source ids"
  required_quality_disclosure: "raw-record coverage; measurement and calibration methods; meter allocation; moisture basis; missing or rejected UUIDs; exclusions; data gaps; abnormal operations; uncertainty and representativeness limits"
  update_trigger: "Change in product identity, fibre composition, knotting or finishing route, yarn dyed state, washing chemistry, drying energy route, wastewater treatment, waste destination, packaging system, plant geography, or materially different reporting-period performance"
