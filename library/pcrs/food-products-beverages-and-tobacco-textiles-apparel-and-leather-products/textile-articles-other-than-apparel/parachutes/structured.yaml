system_boundary:
  rules:
    - rule_id: boundary_foreground_operations
      applies_to: "foreground_system_boundary"
      rule: "Include receipt inspection, layout and cutting, sewing, suspension-line and webbing operations, connector-hardware and deployment-component integration when performed on site, final inspection, functional release, packing, direct electricity, and separately measured material losses and rejects."
      source_ids:
        - faa-parachute-rigger-handbook-2015
    - rule_id: boundary_upstream_textiles
      applies_to: "foreground_system_boundary"
      rule: "Treat purchased fibre, fabric, thread, webbing, cord, dyeing, coating, and finishing as upstream background links unless the operation occurs at the reporting site; preserve the actual textile material and wet-processing route in supplier metadata."
      source_ids:
        - jrc-textiles-bref-2023
    - rule_id: boundary_configuration_separation
      applies_to: "foreground_system_boundary"
      rule: "Keep personnel, cargo, extraction, deceleration, drogue, canopy-shape, fibre-system, coating/finish, and included-assembly configurations separate unless production-weighted foreground records support aggregation."
      source_ids:
        - faa-parachute-rigger-handbook-2015
        - eu-environmental-footprint-2021
    - rule_id: boundary_downstream_exclusion
      applies_to: "foreground_system_boundary"
      rule: "Exclude transport after the factory gate, installation, packing for use, deployment, repacking, inspection during service, repair, and end-of-life from this manufacturing foreground; retain operating and service-life limitations as product metadata."
      source_ids:
        - faa-parachute-rigger-handbook-2015
    - rule_id: boundary_same_category_input
      applies_to: "foreground_system_boundary"
      rule: "Record a purchased finished parachute or complete same-category assembly as a single technosphere input and disclose its included mass; do not count its internal materials again."
      source_ids:
        - iso-14044-2006
boundary_abstraction:
  declared_starting_condition: "Qualified purchased fabrics, thread, webbing, suspension cord, connector hardware, deployment components, utilities, and packaging received at the parachute manufacturing site"
  starting_condition_role: "Starting condition for the dry manufacturing foreground; upstream fibre, fabric, coating, finishing, metal-part, electricity-generation, and packaging production remain linked background processes unless performed at the reporting site"
  product_classification_scope: "Finished parachutes and complete parachute assemblies under CPC 3.0 27170, separated by declared use class, canopy type, material system, and included component configuration"
  recursive_input_rule: "A purchased finished parachute or same-category complete assembly remains one technosphere product input with its supplier dataset; do not recursively rebuild it inside this foreground process"
  upstream_dataset_requirement: "Link supplier- or geography-representative datasets for every purchased material, component, utility, and packaging exchange; disclose textile pretreatment, dyeing, coating, and finishing routes where relevant"
  disclosure: "Declare which operations are on site, which components are purchased complete, all omitted configuration elements, site and period, textile finish/coating route, release basis, packaging basis, and allocation method"
