allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "foreground_burden_allocation"
    rule: "Prefer process subdivision, dedicated meters, and configuration-specific material records so that allocation is avoided."
    source_ids:
      - iso-14044-2006
      - eu-environmental-footprint-2021
  - rule_id: allocation_shared_electricity
    applies_to: "foreground_burden_allocation"
    rule: "Allocate a shared electricity meter by measured machine time, submetered load, or another documented causal driver; use output mass only when causality is demonstrated and report a sensitivity check for material shared loads."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_configuration_families
    applies_to: "foreground_burden_allocation"
    rule: "Allocate shared operations among configuration families using production records that preserve the declared product type and configuration; do not use an unweighted average across unlike parachutes."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_rework_and_scrap
    applies_to: "foreground_burden_allocation"
    rule: "Internal rework returned to the same lot is not a second product. Record saleable co-products separately and allocate by a documented physical relationship where feasible; do not apply an avoided-burden credit inside the foreground inventory."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_output_release
      process_id: "parachute_manufacturing"
      flow_role: "reference_output"
      record_type: "Release and weighing record"
      raw_fields: "product type; part number; lot; configuration; accepted units; net mass; packaging tare; operating limits; inspection status; functional-test status"
      collection_method: "Calibrated weighing linked to the controlled release record"
      unit: "kg"
      frequency: "Each released lot"
      temporal_coverage: "Same lot or declared production period as inventory inputs"
      site_scope: "Reporting manufacturing site"
      aggregation_rule: "Sum accepted net product mass only"
      quality_evidence: "Calibration record; release certificate; inspection and test record"
    - protocol_id: cp_material_bom
      process_id: "parachute_manufacturing"
      flow_role: "Material and component inputs"
      record_type: "BOM, receipt, issue, return, and inspection records"
      raw_fields: "row_id; material or component name; specification; supplier; part number; lot; issued quantity and mass; return quantity and mass; rejected quantity and mass"
      collection_method: "Reconcile controlled BOM with warehouse issue/return and calibrated mass records"
      unit: "kg"
      frequency: "Each production lot"
      temporal_coverage: "Same lot or declared production period as output"
      site_scope: "Reporting manufacturing site"
      aggregation_rule: "Issued minus unused return, retaining material-specific rows"
      quality_evidence: "Approved BOM; purchase/receipt record; scale calibration; lot traceability"
    - protocol_id: cp_energy_records
      process_id: "parachute_manufacturing"
      flow_role: "low_voltage_electricity_input"
      record_type: "Meter and operating record"
      raw_fields: "meter id; opening and closing readings; interval; machine or area; machine time; allocation driver; supply mix; geography"
      collection_method: "Read dedicated or shared meters and document the causal allocation driver"
      unit: "kWh"
      frequency: "Meter interval and each reporting period"
      temporal_coverage: "Covers the same declared production period"
      site_scope: "Reporting manufacturing site"
      aggregation_rule: "Sum included consumption, subtract documented non-production loads, then allocate by calc_shared_electricity"
      quality_evidence: "Meter calibration or utility statement; operating log; allocation worksheet"
    - protocol_id: cp_waste_records
      process_id: "parachute_manufacturing"
      flow_role: "Waste outputs"
      record_type: "Segregated weighing and disposition record"
      raw_fields: "row_id; material identity; container tare; gross and net mass; lot; internal reuse; return to supplier; destination"
      collection_method: "Weigh each material-specific waste stream and reconcile internal reuse or returns"
      unit: "kg"
      frequency: "Each waste collection event"
      temporal_coverage: "Same lot or declared production period as output"
      site_scope: "Reporting manufacturing site"
      aggregation_rule: "Sum net mass by row_id; exclude documented same-period internal reuse"
      quality_evidence: "Scale calibration; waste log; transfer or return record"
    - protocol_id: cp_packaging_records
      process_id: "parachute_manufacturing"
      flow_role: "Packaging inputs"
