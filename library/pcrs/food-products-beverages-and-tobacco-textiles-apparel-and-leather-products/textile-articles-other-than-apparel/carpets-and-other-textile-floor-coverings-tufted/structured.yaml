allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "product families, lines and campaigns"
    rule: "First avoid allocation by separating product families, campaigns and process lines and by using submeters, batch sheets and route-specific material records."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: allocation_shared_utilities
    applies_to: "shared electricity, thermal energy, water and treatment"
    rule: "Assign shared utilities with a measured causal driver such as machine operating time, metered load, oven throughput, water meter or pollutant load. If no causal relation can be demonstrated, use a documented physical basis and test the sensitivity."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: allocation_multi_product_output
    applies_to: "simultaneous saleable outputs"
    rule: "When a process produces more than one saleable product and subdivision is not feasible, prefer physical allocation that reflects the causal relationship; use economic allocation only when physical relationships are not meaningful, and disclose prices, period and sensitivity."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: allocation_waste_and_recycling
    applies_to: "recovered offcuts, residues and packaging scrap"
    rule: "Record the actual waste output and destination. Do not subtract an avoided-production credit from the foreground inventory or convert waste into a negative material input; model any recycling or recovery outside the factory-gate process with an explicitly declared downstream method."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_no_hidden_loss
    applies_to: "rejects, rework and internal returns"
    rule: "Keep internal returns visible in the process mass reconciliation and include resources consumed by rejected output in the accepted-product inventory; do not erase losses by netting them against purchased inputs without a traceable return record."
    source_ids:
      - eu-textiles-bat-2022
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_tufting_materials
      process_id: "tufting"
      flow_role: "pile yarn, primary backing, greige output and returned unused material"
      record_type: "scale, warehouse issue, return and transfer records"
      raw_fields: "material identity; lot; fibre grade; recycled content; issued mass; returned mass; backing area; measured mass per area; greige transfer mass; timestamp"
      collection_method: "calibrated scale and reconciled warehouse/line records"
      unit: "kg and m2"
      frequency: "each lot or shift"
      temporal_coverage: "representative production period, normally at least 12 consecutive months"
      site_scope: "every included tufting line"
      aggregation_rule: "sum net issued input and transferred output by homogeneous product route before normalization"
      quality_evidence: "calibration records; stock reconciliation; lot traceability; signed transfer records"
    - protocol_id: cp_tufting_electricity
      process_id: "tufting"
      flow_role: "electricity"
      record_type: "submeter or site-meter record"
      raw_fields: "meter id; start and end reading; interval; line operating hours; rated load where allocation is needed; production route"
      collection_method: "direct submeter preferred; otherwise reconciled causal allocation"
      unit: "kWh"
      frequency: "continuous or each shift"
      temporal_coverage: "same period as production"
      site_scope: "every included tufting line"
      aggregation_rule: "sum metered electricity or allocate reconciled site total with documented driver"
      quality_evidence: "meter calibration; energy reconciliation; operating log"
    - protocol_id: cp_backing_materials
      process_id: "backing_and_curing"
      flow_role: "greige input, latex, filler, secondary backing and backed output"
      record_type: "batch sheet, scale, tank, silo, warehouse and transfer records"
      raw_fields: "material identity; formulation; wet mass; solids fraction; filler mass; backing area and mass per area; returned mass; backed transfer mass"
      collection_method: "calibrated scales, tank/silo readings and batch reconciliation"
      unit: "kg and m2"
      frequency: "each batch or shift"
      temporal_coverage: "same period as production"
      site_scope: "every included backing and curing line"
      aggregation_rule: "sum by declared backing formulation and route before normalization"
      quality_evidence: "batch authorization; calibration; stock reconciliation; formulation revision"
    - protocol_id: cp_backing_water
      process_id: "backing_and_curing"
      flow_role: "process water"
      record_type: "flowmeter or batch-sheet record"
      raw_fields: "meter id; batch id; charged volume; water source; treatment grade; timestamp"
      collection_method: "direct meter or verified batch vessel volume"
      unit: "m3"
      frequency: "each batch or daily"
      temporal_coverage: "same period as production"
      site_scope: "every included backing and curing line"
      aggregation_rule: "sum intentional process-water charge separately from washwater"
      quality_evidence: "meter calibration; batch sheet; water balance"
    - protocol_id: cp_backing_energy
      process_id: "backing_and_curing"
      flow_role: "electricity and natural gas"
      record_type: "electricity and gas meter records"
      raw_fields: "meter id; readings; energy unit; gas volume; net calorific value; oven hours; throughput; route"
      collection_method: "direct line meters preferred; otherwise reconciled causal allocation"
      unit: "kWh, m3 and MJ"
      frequency: "continuous or each shift"
      temporal_coverage: "same period as production"
      site_scope: "every included backing and curing line"
      aggregation_rule: "keep each carrier separate; convert gas using period-specific net calorific value"
      quality_evidence: "meter calibration; supplier statement; energy balance; oven log"
    - protocol_id: cp_backing_wastewater
      process_id: "backing_and_curing"
      flow_role: "coating-equipment washwater"
      record_type: "flowmeter, tank-transfer and wastewater records"
      raw_fields: "source operation; volume; pH; solids or COD where monitored; destination; transfer date"
      collection_method: "metered discharge or calibrated tank volume at transfer"
      unit: "m3"
      frequency: "each cleaning event or discharge"
      temporal_coverage: "same period as production"
      site_scope: "every included coating-equipment cleaning and discharge point"
      aggregation_rule: "sum only the separately identified coating-equipment washwater stream"
      quality_evidence: "meter calibration; transfer manifest; laboratory chain of custody where sampled"
    - protocol_id: cp_backing_air_emissions
      process_id: "backing_and_curing"
      flow_role: "substance-specific direct air release"
      record_type: "stack test, continuous monitor or verified facility emission record"
      raw_fields: "substance; emission point; receiving compartment; sampling period; gas flow; concentration; mass emission; production throughput; control status"
      collection_method: "applicable standardized measurement or verified site inventory"
      unit: "kg"
      frequency: "each required monitoring event and annual reconciliation"
      temporal_coverage: "representative normal operations and relevant highest-emission state"
      site_scope: "every relevant coating, curing, filler-handling or combustion emission point"
      aggregation_rule: "calculate or record each substance mass separately and normalize by backed output"
      quality_evidence: "sampling plan; laboratory report; monitor QA; control-device log; production linkage"
    - protocol_id: cp_finishing_materials
      process_id: "finishing_and_packaging"
      flow_role: "backed input and packaging materials"
      record_type: "scale, packaging issue, return and shipment records"
      raw_fields: "backed input mass; film mass; core mass; pallet count and mass; returned packaging; shipment id"
      collection_method: "calibrated scale and reconciled packaging/dispatch records"
      unit: "kg and item"
      frequency: "each shift or shipment"
      temporal_coverage: "same period as production"
      site_scope: "every included finishing and packaging line"
      aggregation_rule: "sum consumed or non-returned packaging separately from net product"
      quality_evidence: "scale calibration; stock reconciliation; dispatch record; pallet-return ledger"
    - protocol_id: cp_finishing_electricity
      process_id: "finishing_and_packaging"
      flow_role: "electricity"
      record_type: "submeter or site-meter record"
      raw_fields: "meter id; readings; interval; equipment hours; accepted output"
      collection_method: "direct submeter preferred; otherwise reconciled causal allocation"
      unit: "kWh"
      frequency: "continuous or each shift"
      temporal_coverage: "same period as production"
      site_scope: "every included finishing and packaging line"
      aggregation_rule: "sum metered electricity or allocate reconciled total with documented driver"
      quality_evidence: "meter calibration; energy reconciliation; equipment log"
    - protocol_id: cp_final_product_release
      process_id: "finishing_and_packaging"
      flow_role: "accepted finished reference product"
      record_type: "final scale, area, inspection and release records"
      raw_fields: "product code; pile and backing qualifiers; accepted mass; accepted area; rejected mass; moisture condition; inspection disposition; packaging mass; timestamp"
      collection_method: "calibrated final-product weighing and quality release"
      unit: "kg and m2"
      frequency: "each roll, tile lot or shipment"
      temporal_coverage: "same period as production"
      site_scope: "every included finishing and packaging line"
      aggregation_rule: "sum accepted net mass; exclude removable shipping packaging; retain rejected mass separately"
      quality_evidence: "scale calibration; inspection record; release authorization; mass-area reconciliation"
    - protocol_id: cp_waste_records
      process_id: "all"
      flow_role: "each separately named waste output"
      record_type: "scale ticket, container log and transfer manifest"
      raw_fields: "waste identity; source process; mass; contamination state; destination; treatment code; date"
      collection_method: "direct weighing at source or verified transfer scale"
      unit: "kg"
      frequency: "each container or transfer"
      temporal_coverage: "same period as production"
      site_scope: "every included site and waste storage or transfer point"
      aggregation_rule: "sum each physical waste stream and destination separately; no avoided-burden netting"
      quality_evidence: "scale ticket; licensed transfer manifest; stock balance"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory exchange"
      rule: "normalized exchange = reporting-period exchange amount / reporting-period accepted net finished-product mass"
      inputs:
        - "raw exchange amount"
        - "accepted net mass from cp_final_product_release"
      output: "exchange per 1 kg accepted finished product"
      source_ids:
        - iso-14044-2006
        - eu-pef-2021
    - id: calc_area_to_mass
      applies_to: "area- or roll-based product and backing records"
      rule: "material mass = measured consumed area × product- or lot-specific measured mass per area; retain both raw measurements"
      inputs:
        - "consumed area"
        - "measured mass per area"
      output: "kg material input or product output"
      source_ids:
        - iso-14044-2006
    - id: calc_latex_dry_solids
      applies_to: "SBR latex and wet backing compound"
      rule: "dry solids = wet mass × measured or supplier-declared solids fraction; retain wet mass and water balance as separate fields"
      inputs:
        - "wet mass"
        - "solids fraction"
      output: "kg dry backing solids"
      source_ids:
        - us-epa-fabric-coating-1998
    - id: calc_gas_energy
      applies_to: "metered natural gas"
      rule: "energy = corrected gas volume × reporting-period supplier net calorific value"
      inputs:
        - "corrected gas volume"
        - "net calorific value"
      output: "MJ natural-gas input"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_process_mass_reconciliation
      applies_to: "tufting, backing and finishing"
      rule: "reconcile separately measured inputs, intermediate transfers, accepted output, internal returns, rejects, wastes and measured releases; investigate and disclose the residual without forcing it to zero"
      inputs:
        - "all process material records"
      output: "process-specific mass-balance residual and explanation"
      source_ids:
        - eu-textiles-bat-2022
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and represented mix"
      requirement: "Retain the required qualifiers and production share for each homogeneous route. Do not combine products with different pile fibre, backing chemistry, product format or integrated upstream operations unless the weighting is documented."
      evidence: "product specification; bill of materials; formulation; production and release records"
    - id: dq_temporal_representativeness
      applies_to: "all foreground exchanges"
      requirement: "Use a representative production period, normally at least 12 consecutive months. A shorter campaign is allowed only with reason, operating-state coverage and disclosure of seasonality, startup and shutdown treatment."
      evidence: "meter dates; production calendar; campaign log; exception rationale"
    - id: dq_measurement_traceability
      applies_to: "mass, area, water and energy records"
      requirement: "Use calibrated or verified instruments and preserve raw readings, units, conversion factors and allocation drivers."
      evidence: "calibration certificates; meter identifiers; raw logs; reconciliation"
    - id: dq_material_balance
      applies_to: "each required process"
      requirement: "Reconcile material inputs, intermediate transfers, output, returns, rejects and wastes. Investigate and disclose unexplained residuals; do not invent a balancing exchange."
      evidence: "batch and stock reconciliation; transfer records; waste manifests; residual review"
    - id: dq_emission_relevance
      applies_to: "air, wastewater and waste releases"
      requirement: "Establish and periodically review a site input-output inventory. Record every substance identified as relevant with the applicable measurement and receiving compartment; absence requires documented non-applicability, not a zero assumption."
      evidence: "chemical inventory; emission-point map; monitoring plan; laboratory or stack-test report; BAT applicability review"
    - id: dq_upstream_matching
      applies_to: "linked purchased-input datasets"
      requirement: "Match material grade, formulation, recycled content, geography and delivery state. Disclose every proxy, age gap and missing supplier dataset."
      evidence: "supplier specification; dataset metadata; proxy register"
    - id: dq_completeness
      applies_to: "foreground package"
      requirement: "Include all required processes and every applicable atomic row; report accepted inputs, checks performed, checks skipped and unresolved flow identities."
      evidence: "completeness matrix; validation report; manifest review metadata"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require UUID a01ef31e-fdc6-48be-a681-0a418c22c0cc, Product flow, CPC 3.0 subclass 27230, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg and reference amount 1."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_required_qualifiers
    applies_to: "reference product"
    rule: "Fail conformance when any required pile, backing, format, mass-per-area, process-route, geography, period, moisture or packaging-boundary qualifier is missing."
    source_ids:
      - unsd-cpc-3-0-2025
      - eu-pef-2021
  - rule_id: validate_process_coverage
    applies_to: "process map"
    rule: "Require tufting, backing_and_curing and finishing_and_packaging; require explicit route applicability for each conditional material or emission row."
    source_ids:
      - us-epa-fabric-coating-1998
      - us-epa-carpet-air-emissions-2002
  - rule_id: validate_atomic_flows
    applies_to: "process inventory"
    rule: "Fail any card whose selected flow is a collection, selector or combined exchange. Electricity, natural gas, each material, each packaging component, each waste stream and each emitted substance must remain a separate row."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_foreground_evidence
    applies_to: "inventory amounts"
    rule: "Require a linked collection protocol and real foreground record for every amount. No AI estimate or uncited generic carpet quantity is conforming."
    source_ids:
      - eu-textiles-bat-2022
      - eu-pef-2021
  - rule_id: validate_intermediate_handoffs
    applies_to: "process interfaces"
    rule: "Require tufted-greige output to reconcile with backing input and backed-carpet output to reconcile with finishing input for the same scope, with losses and inventory changes separately explained."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_mass_and_energy_separation
    applies_to: "balances"
    rule: "Require net reference-product mass to exclude removable packaging; require each energy carrier, wet/dry basis, return, reject, waste and direct emission to remain separately traceable."
    source_ids:
      - eu-textiles-bat-2022
      - iso-14044-2006
  - rule_id: validate_allocation
    applies_to: "shared operations"
    rule: "Fail when subdivision and causal assignment were not attempted before allocation, or when the allocation basis, driver, period and sensitivity are absent."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: validate_uuid_acceptance
    applies_to: "UUID-bearing rows"
    rule: "Accept a Tiangong UUID only after direct public state-code-100 readback confirms exact flow semantics, flow type, reference property, unit basis and required qualifiers. Otherwise reject the UUID for that row and keep the row-specific identity gap in review metadata."
    source_ids: []
  - rule_id: validate_data_quality_disclosure
    applies_to: "published data package"
    rule: "Require temporal coverage, site scope, instrument evidence, mass-balance residuals, proxy use, missing measurements, emission applicability and every skipped check to be disclosed."
    source_ids:
      - eu-textiles-bat-2022
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Factory-gate foreground production dataset for a declared tufted textile floor-covering product or production mix."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Construction of foreground data packages and downstream process or lifecycle-model projections for products matching the declared pile, backing, format, route, geography and period."
  excluded_use: "Comparative claims about floor-covering service, durability or use-stage performance without a separate verified area-and-service-life functional unit; proxying woven, knotted, flocked, needle-punched, felt or non-textile floor coverings; and use when required identity or route fields are missing."
  required_metadata: "PCR id; reference UUID; CPC coordinate; all reference qualifiers; site and geography; reporting period; product-mix weights; process coverage; integrated upstream operations; coating formulation and solids; energy-carrier split; packaging boundary; allocation method; linked upstream datasets; reviewer and validation status."
  required_quality_disclosure: "Instrument and calibration evidence; temporal and site representativeness; raw-record coverage; mass-balance residuals; allocation drivers; proxy register; waste destinations; emission relevance and measurement methods; unresolved UUIDs; checks performed and skipped."
  update_trigger: "Change in pile fibre or recycled content, backing chemistry or construction, product format, integrated dyeing or finishing, energy or curing route, emission controls, allocation driver, site geography, representative product mix, Tiangong identity, source method or material data gap."
