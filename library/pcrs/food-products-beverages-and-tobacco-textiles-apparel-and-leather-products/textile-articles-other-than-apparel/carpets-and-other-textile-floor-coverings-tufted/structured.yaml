measurement_rules:
  - id: reference_net_mass
    applies_to: "accepted finished reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh accepted dry finished product without removable shipping film, paperboard cores, pallets, rejected lengths or installation materials not sold as part of the product. Normalize all exchanges to exactly 1 kg accepted net output."
  - id: mass_per_area_conversion
    applies_to: "production records expressed per area or roll"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert area or roll records using product- and campaign-specific measured net mass per area and accepted area. Retain the measured mass, area and conversion result; do not use a generic carpet grammage."
  - id: wet_dry_basis
    applies_to: "latex, coating paste, wastewater, wet residue and dry solids"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record as-supplied wet mass and measured or supplier-declared solids fraction separately. Convert to dry solids only with a traceable batch-specific or formulation-specific factor and retain water as a separate balance."
  - id: energy_carrier_separation
    applies_to: "electricity and each thermal energy carrier"
    required_property_ref:
      name: "carrier-specific"
      uuid: ""
    required_unit: "kWh, MJ or carrier-native unit"
    rule: "Preserve metered electricity separately from natural gas and any other fuel or purchased heat. Convert units only with a documented factor; do not merge carriers into one energy exchange."
