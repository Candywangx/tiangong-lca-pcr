allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared lines and utilities"
    rule: "Prefer submetering, lot records, time records and physical separation so allocation is avoided."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical_relation
    applies_to: "Unavoidable shared inputs and outputs"
    rule: "When separation is impossible, use a documented causal physical relation such as machine time, metered energy, wet-process batch load or net product mass; do not default to revenue."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_multi_output_disclosure
    applies_to: "Saleable offcuts or co-products"
    rule: "Keep gross output and waste records visible, state whether the secondary output remains a waste or becomes a co-product, and disclose the allocation basis and sensitivity."
    source_ids:
      - eu-pef-2021
      - zlaugotne-fishing-net-waste-2025
  - rule_id: allocation_recycling_boundary
    applies_to: "Internal reuse and exported recycling"
    rule: "Subtract same-line reuse only when its return is measured and does not double count upstream burden. Report exported recycling destination separately and do not claim an avoided burden inside this gate-to-gate dataset without an explicitly declared downstream model."
    source_ids:
      - eu-pef-2021
      - zlaugotne-fishing-net-waste-2025
