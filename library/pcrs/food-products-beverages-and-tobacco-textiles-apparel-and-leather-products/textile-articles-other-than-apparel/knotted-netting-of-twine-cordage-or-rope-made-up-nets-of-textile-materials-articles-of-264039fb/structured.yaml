validation_rules:
  - rule_id: validation_identity
    applies_to: "Dataset identity"
    rule: "Fail if CPC 27320 scope, article form, material family, construction, product dimensions or conditioning state is absent or contradicts the reference flow."
    source_ids:
      - un-cpc-v3-2025
      - fao-fisheries-assessment-2013
  - rule_id: validation_reference_mass
    applies_to: "Quantitative reference"
    rule: "Fail unless net conforming product equals exactly 1,000 kg after normalization and removable packaging is excluded."
    source_ids:
      - eu-pef-2021
  - rule_id: validation_atomic_inventory
    applies_to: "Inventory rows"
    rule: "Fail if a row groups multiple polymers, energy carriers, chemicals, packaging components, waste streams or emissions, or if a UUID is used without exact hybrid and state-code-100 direct verification."
    source_ids:
      - eu-pef-2021
  - rule_id: validation_route_and_tests
    applies_to: "Production and quality"
    rule: "Fail if the actual unit operations are undisclosed or a mesh/breaking result lacks the applicable definition, test method and dry/wet condition."
    source_ids:
      - iso-1107-2017
      - iso-1805-2006
      - iso-1806-2002
      - iso-16663-1-2009
  - rule_id: validation_mass_balance
    applies_to: "Textile materials"
    rule: "Fail if material inputs, output, waste and WIP do not reconcile within a declared measured tolerance or if the residual is hidden by allocation."
    source_ids:
      - eu-pef-2021
  - rule_id: validation_waste_destination
    applies_to: "Offcuts and wastewater"
    rule: "Fail if polymer-specific manufacturing scraps or wastewater are omitted when generated, or if reuse, recycling, treatment and disposal destinations are not distinguished."
    source_ids:
      - zlaugotne-fishing-net-waste-2025
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Route-, product- and facility-specific foreground dataset for manufacturing CPC 27320 textile nets and related made-up articles"
  downstream_use: "secondary_dataset; background_dataset when upstream product inputs are complete and data quality is adequate"
  allowed_use: "Product-specific cradle-to-gate models, supplier comparisons and hotspot studies for the declared material, construction, finish, geography and period"
  excluded_use: "Unqualified cross-polymer averages; use-stage fishing or aquaculture modelling; lost-gear impacts; end-of-life claims; products outside CPC 27320; comparative assertions where required test, allocation or data-quality disclosures differ materially"
  required_metadata: "CPC scope; article form and application; bill of materials; polymer/fibre and recovered-content basis; yarn and net construction; dimensions and mesh definition; dry/wet test condition; breaking-force method; actual process route; finish and accessories; net mass and moisture basis; geography; period; upstream datasets; allocation; packaging; waste destinations"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; test methods; mass-, water- and energy-balance residuals; allocation drivers; supplier-data substitutions; unresolved UUIDs; exclusions; waste receiver evidence; representativeness limitations"
  update_trigger: "Change in material family or recovered content, yarn/net construction, product form, mesh or strength specification, process technology, finish chemistry, supplier route, packaging, allocation, waste destination, geography, or a material shift in foreground performance"
