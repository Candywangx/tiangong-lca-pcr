  - id: component_mass
    applies_to: "Core/lock, effect, pile, binder yarn and textile strip"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record each declared component separately by received mass and inventory change. Do not merge unlike fibre compositions or component roles."
