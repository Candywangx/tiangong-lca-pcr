allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared formation, winding, inspection, and packaging operations"
    rule: "First subdivide meters, production orders, machine time, material issues, and waste records so each product construction carries its directly measured burden."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_physical
    applies_to: "Residual shared inputs and outputs"
    rule: "When subdivision cannot eliminate a shared flow, use the physical driver that causes it: metered machine energy, machine-hours at documented operating state, processed mass, or package count and mass. Record the driver and all product totals."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_economic_last_resort
    applies_to: "Multi-output operation lacking a defensible physical relation"
    rule: "Economic allocation is permitted only when no causal physical relation can be demonstrated; use contemporaneous factory-gate values, disclose the method, and test sensitivity."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_internal_rework
    applies_to: "Recoverable start-up yarn, broken ends, and off-spec product"
    rule: "Return internally reused material to the originating process without credit and subtract it once from waste output. Do not count the same material as both avoided input and exported waste."
    source_ids:
      - eu-textiles-bat-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_material_records
      process_id: "component_preparation"
      flow_role: "Core/lock, effect, pile yarn and textile strip inputs"
      record_type: "Receiving, issue, BOM, lot and inventory records"
      raw_fields: "component role; fibre composition; supplier; lot; received/issued mass; opening/closing inventory; colour/finish; recycled content; order"
      collection_method: "Reconcile purchase and store records to production-order issues and physical inventory"
      unit: "kg"
      frequency: "Each receipt and issue; reconcile monthly or per campaign"
      temporal_coverage: "Same period as represented production"
      site_scope: "Every included site and store"
      aggregation_rule: "Sum issued mass plus inventory adjustment by row_id, material identity, lot, route and product order"
      quality_evidence: "Calibrated scales; signed receiving/issue records; BOM revision; lot traceability; inventory reconciliation"
    - protocol_id: cp_energy_records
      process_id: "specialty_yarn_formation"
      flow_role: "Electricity input"
      record_type: "Submeter, main meter, machine-hour and operating-state records"
      raw_fields: "meter id; opening/closing reading; timestamp; machine; order; run/idle time; shared load"
      collection_method: "Prefer dedicated submetering; reconcile shared meters to documented causal drivers"
      unit: "kWh"
      frequency: "Continuous or each shift/order; reconcile monthly"
      temporal_coverage: "Representative continuous period including normal losses"
      site_scope: "Every included production area"
      aggregation_rule: "Sum measured consumption; subtract separately metered excluded loads; allocate residual shared load under Section 7"
      quality_evidence: "Meter calibration; bills; reading logs; downtime and production logs; reconciliation"
    - protocol_id: cp_production_output_records
      process_id: "specialty_yarn_formation_winding_inspection_packaging"
      flow_role: "Formed, accepted, rejected, and reworked yarn"
      record_type: "Batch/order, winding, scale, inspection and dispatch records"
      raw_fields: "order; subtype; construction; gross/net mass; package/tare mass; accepted/rejected/reworked mass; date; machine; test result"
      collection_method: "Weigh output and tare; reconcile winding and inspection status by order"
      unit: "kg"
      frequency: "Every batch, order, or package"
      temporal_coverage: "Same period as inputs"
      site_scope: "Every included production and inspection line"
      aggregation_rule: "Sum status-specific net mass; normalize inventory only to accepted net output"
      quality_evidence: "Scale calibration; tare checks; inspection record; dispatch reconciliation; yield mass balance"
    - protocol_id: cp_waste_records
      process_id: "specialty_yarn_formation"
      flow_role: "Textile yarn offcuts"
      record_type: "Container weighing, waste transfer and treatment records"
      raw_fields: "composition; source order; gross/tare/net mass; internal reuse; destination; treatment"
      collection_method: "Weigh each composition-specific container and reconcile transfer documents"
      unit: "kg"
      frequency: "Each container or shift; reconcile monthly"
      temporal_coverage: "Same period as represented production"
      site_scope: "Every included machine and waste storage area"
      aggregation_rule: "Sum net exported waste by composition and destination after documented internal reuse"
      quality_evidence: "Scale calibration; labels; transfer note; treatment receipt; mass-balance reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "winding_inspection_packaging"
      flow_role: "Tube, carton and film inputs"
      record_type: "Purchase, issue, package specification and inventory records"
      raw_fields: "package material; supplier; unit mass; count; issued/returned count; recycled content; product order"
      collection_method: "Weigh representative package units and reconcile issue counts and inventory"
      unit: "kg and count"
      frequency: "Each lot or specification change; reconcile monthly"
      temporal_coverage: "Same period as dispatched output"
      site_scope: "Every included packing line"
      aggregation_rule: "Unit mass times net issued count, checked against purchased and inventory mass"
      quality_evidence: "Scale calibration; package specification; issue/return logs; invoice and inventory reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "Divide the reporting-period row quantity by accepted net CPC 27995 product mass for the same represented orders and sites."
      inputs:
        - "Row quantity"
        - "accepted net product mass"
      output: "Quantity per 1 kg reference product"
      source_ids:
        - ec-pef-2021
    - id: calc_component_mass_balance
      applies_to: "Component preparation and specialty-yarn formation"
      rule: "Reconcile component inputs = accepted product + exported waste + documented inventory change + other separately identified outputs; investigate unexplained difference rather than forcing balance."
      inputs:
        - "Component issues"
        - "formed/accepted/rejected/reworked mass"
        - waste
        - "inventory changes"
      output: "Mass-balance residual and completeness finding"
      source_ids:
        - eu-textiles-bat-2022
    - id: calc_linear_density
      applies_to: "Yarn linear-density reporting"
      rule: "Apply the declared test procedure to conditioned specimen mass and length and report the result in tex; retain original observations and conversion."
      inputs:
        - "Conditioned specimen mass"
        - "specimen length"
        - "conditioning and test method"
      output: "Finished and component yarn linear density"
      source_ids:
        - iso-2060-1994
    - id: calc_shared_energy
      applies_to: "Shared electricity"
      rule: "Allocate only residual shared metered consumption using a disclosed causal driver after subtracting directly metered excluded loads."
      inputs:
        - "Shared meter total"
        - "direct meters"
        - "machine-hours/processed mass and operating state"
      output: "Allocated kWh by represented order"
      source_ids:
        - ec-pef-2021
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Reference product and component inputs"
      requirement: "Preserve product subtype, component role, fibre composition, construction, colour/finish, supplier lot, route, and product-order linkage; do not infer composition from trade name alone."
      evidence: "Product specification, BOM, supplier declaration, receiving and order records"
    - id: dq_temporal_representativeness
      applies_to: "All foreground records"
      requirement: "Use a continuous period representing normal production, start-up losses, product changes, maintenance, rework, and rejects; disclose gaps and exceptional events."
      evidence: "Dated meters, production logs, maintenance records, inventory and waste reconciliations"
    - id: dq_technical_representativeness
      applies_to: "Product family datasets"
      requirement: "Weight only constructions actually produced in the reference period and retain route-specific component and energy records; disclose every weighting factor."
      evidence: "Order-level output mass, machine/route records, product specifications"
    - id: dq_measurement_control
      applies_to: "Mass, energy, linear density, twist, pile/loop geometry, and quality tests"
      requirement: "Identify equipment, calibration status, sampling plan, conditioning, units, raw observations, and data transformations."
      evidence: "Calibration certificates, test reports, laboratory worksheets, meter and scale logs"
    - id: dq_completeness
      applies_to: "Inventory and boundary"
      requirement: "Reconcile purchased/issued materials, accepted/rejected output, internal reuse, waste, packaging, and energy. Name every missing record and assess its possible significance."
      evidence: "Mass and energy balances, completeness checklist, source document index"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require state-code-100 Product flow b4b228c8-c8f8-4225-8e81-bebc83d9b8c8, exact CPC 27995 identity, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and exactly 1 kg accepted net product."
    source_ids:
      - unsd-cpc-27995
  - rule_id: validate_route_and_qualifiers
    applies_to: "Product identity"
    rule: "Fail when subtype, component roles and compositions, linear density, twist/binding construction, applicable pile/loop/gimp geometry, colour/finish state, packaging basis, site, geography, or period is missing."
    source_ids:
      - unsd-cpc-27995
      - iso-2060-1994
      - iso-2061-2015
      - ortlek-ulku-2004
  - rule_id: validate_atomic_inventory
    applies_to: "Process inventory"
    rule: "Require each recorded card to represent one concrete exchange. Reject collection labels, alternatives, unresolved selectors, combined utilities, combined packaging, combined waste, and combined emissions."
    source_ids:
      - eu-textiles-bat-2022
  - rule_id: validate_foreground_evidence
    applies_to: "Inventory quantities"
    rule: "Require each amount to trace to its declared collection protocol and raw records. Reject unsupported fixed values, invented ranges, and quantities normalized to output from another site or period."
    source_ids:
      - ec-pef-2021
  - rule_id: validate_balance_and_allocation
    applies_to: "Material, energy, output, waste, and shared operations"
    rule: "Require documented mass-balance residuals, meter reconciliation, subdivision attempts, allocation driver, and sensitivity where economic allocation is used."
    source_ids:
      - ec-pef-2021
      - eu-textiles-bat-2022
  - rule_id: validate_conditional_finishing
    applies_to: "Site-operated wet or thermal process"
    rule: "If included, require a separately expanded process with one card for every actual chemical, water, energy, wastewater, waste, and direct-emission flow; otherwise the finishing route is incomplete."
    source_ids:
      - eu-textiles-bref-2023
      - eu-textiles-bat-2022
published_dataset_profile:
  dataset_role: "Foreground factory-gate dataset for one declared CPC 27995 construction or a transparent production-weighted family"
  downstream_use: "May serve as a secondary_dataset or background_dataset for textiles, floor coverings, furnishings, apparel details, craft articles, and other products that consume the declared specialty yarn"
  allowed_use: "Cradle-to-factory-gate modelling when product subtype, component architecture, composition, route, colour/finish state, geography, technology, period, and packaging scope are compatible"
  excluded_use: "Proxying ordinary yarn, fabric, tufting/weaving/knitting, fibre or polymer production, an undisclosed wet-processing route, another product subtype, or use/end-of-life without added scenario data"
  required_metadata: "PCR id/version; CPC code; reference-flow UUID and unit; subtype; component roles, materials, recycled content and construction; linear density; twist/binding and effect geometry; colour/finish; route and equipment; site/geography/period; accepted output and packaging basis; allocations; upstream datasets; exclusions and data gaps"
  required_quality_disclosure: "Foreground share; meter/scale/test coverage; conditioning and sampling; mass/energy reconciliation; reject, rework and waste treatment; temporal and technical representativeness; allocation and family weighting; UUID gaps and upstream substitutions"
  update_trigger: "Change in product subtype or component construction, fibre composition or recycled content, formation technology, dyeing/finishing location, electricity supply, packaging, allocation, site, production mix, test specification, waste treatment, or reference period that can materially alter the inventory"
