allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared operations and utilities"
    rule: "Subdivide or meter product lines and batches before applying allocation; record the meter, production time, or batch key used."
    source_ids:
      - ec-environmental-footprint-2021
  - rule_id: allocation_physical_relation
    applies_to: "unavoidable shared foreground burdens"
    rule: "Allocate using a documented physical causal relation such as machine time, metered energy, processed mass, or occupied production time; use mass allocation only when no more representative causal relation is available."
    source_ids:
      - ec-environmental-footprint-2021
  - rule_id: allocation_scrap_disclosure
    applies_to: "sold, recycled, or internally reused scrap"
    rule: "Record scrap quantity and destination separately and disclose any burden or credit treatment; do not reduce gross material input by scrap output without showing both exchanges."
    source_ids:
      - ec-environmental-footprint-2021
      - epd-pcr2019-14-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_weaving_batch_records
      process_id: "yarn_preparation_and_weaving"
      flow_role: "yarn, electricity, greige output, and offcut records"
      record_type: "batch production record and utility meter allocation"
      raw_fields: "batch_id; product_id; yarn_material_id; yarn_mass_kg; electricity_kwh; accepted_output_kg; offcut_kg; treatment_route"
      collection_method: "reconcile warehouse issues and returns, batch scales, loom counters, and submeter or documented meter allocation"
      unit: "kg; kWh"
      frequency: "each batch, aggregated monthly"
      temporal_coverage: "at least 12 representative months or the full shorter production campaign"
      site_scope: "every reporting-site weaving line producing the declared product"
      aggregation_rule: "sum flow-specific records by batch, then divide by accepted greige output; do not combine different yarn identities before upstream datasets are assigned"
      quality_evidence: "calibrated scale records, meter records, stock reconciliation, batch release record, and treatment receipt"
    - protocol_id: cp_wet_processing_batch_records
      process_id: "wet_processing"
      flow_role: "greige input, water, dyestuff, electricity, finished output, and wastewater records"
      record_type: "recipe, batch record, meter record, and discharge record"
      raw_fields: "batch_id; product_id; input_kg; chemical_id; chemical_mass_kg; water_m3; electricity_kwh; output_kg; wastewater_m3; treatment_state"
      collection_method: "reconcile recipe charges and weighed additions with inlet, utility, output, and discharge meters"
      unit: "kg; m3; kWh"
      frequency: "each wet-processing batch, aggregated monthly"
      temporal_coverage: "at least 12 representative months or the full shorter production campaign"
      site_scope: "every reporting-site wet-processing line used for the declared product"
      aggregation_rule: "sum each chemically specific flow and utility separately, then divide by accepted wet-finished output"
      quality_evidence: "calibrated meters and scales, approved recipe, batch record, laboratory release record, and wastewater log"
    - protocol_id: cp_finishing_batch_records
      process_id: "finishing_and_packaging"
      flow_role: "woven web, backing compound, electricity, packaging film, saleable product, and trim waste records"
      record_type: "batch record, formulation issue, meter allocation, packing record, and quality release"
      raw_fields: "batch_id; product_id; input_web_kg; compound_id; compound_kg; electricity_kwh; packaging_film_kg; accepted_product_kg; trim_waste_kg; treatment_route"
      collection_method: "reconcile material issues, line meter data, scales, packing records, and final quality release"
      unit: "kg; kWh"
      frequency: "each finishing batch, aggregated monthly"
      temporal_coverage: "at least 12 representative months or the full shorter production campaign"
      site_scope: "every reporting-site finishing line producing the declared product"
      aggregation_rule: "sum each specific exchange by batch and normalize to net accepted product; exclude shipping pallets from reference mass"
      quality_evidence: "calibrated scale and meter records, formulation issue record, packaging reconciliation, quality release, and waste receipt"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "all inventory rows"
      rule: "normalized amount = recorded exchange amount / net accepted product mass in kg"
      inputs:
        - "flow-specific recorded amount"
        - accepted_product_kg
      output: "amount per kg reference product"
      source_ids:
        - ec-environmental-footprint-2021
    - id: calc_area_to_mass
      applies_to: "area-based production and sales records"
      rule: "product mass = product area multiplied by measured batch-specific mass per area"
      inputs:
        - product_area_m2
        - measured_mass_per_area_kg_per_m2
      output: "product_mass_kg"
      source_ids:
        - epd-cpcr004-2025
    - id: calc_energy_unit
      applies_to: "electricity or thermal-energy records"
      rule: "MJ = kWh multiplied by 3.6 when a common energy unit is required; keep electricity and thermal energy as distinct exchanges"
      inputs:
        - recorded_energy_kwh
      output: "energy_MJ"
      source_ids:
        - ec-environmental-footprint-2021
    - id: calc_mass_balance
      applies_to: "each process and reporting period"
      rule: "mass-balance difference = total mass inputs minus saleable and intermediate products, separately recorded wastes, and quantified direct mass emissions"
      inputs:
        - "mass input records"
        - "product output records"
        - "waste records"
        - "direct emission records"
      output: "disclosed unexplained mass-balance difference"
      source_ids:
        - jrc-textiles-bref-2023
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all product and material exchanges"
      requirement: "Preserve product, fibre, chemical formulation, supplier, batch, and treatment-route identifiers needed to select one upstream flow per exchange."
      evidence: "purchase specification, recipe, batch record, and supplier declaration"
    - id: dq_measurement
      applies_to: "mass, water, and energy records"
      requirement: "Use calibrated or legally controlled measurement devices where available and retain the allocation method when one meter serves multiple products."
      evidence: "calibration certificate, meter record, and allocation worksheet"
    - id: dq_temporal
      applies_to: "foreground reporting period"
      requirement: "Cover at least 12 representative months unless the production campaign is shorter; document shutdowns, atypical batches, and seasonality."
      evidence: "dated batch and utility records with coverage statement"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Reconcile purchased and issued materials, production output, packaging, waste, wastewater, and directly measured releases; explain missing or estimated exchanges."
      evidence: "mass balance, utility reconciliation, waste receipts, and exception log"
    - id: dq_upstream
      applies_to: "upstream datasets"
      requirement: "Document geography, technology, reference year, substitution, and data quality for every material, energy, water, packaging, and treatment dataset."
      evidence: "upstream dataset register and substitution log"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "Require the exact CPC 27220 public product-flow UUID, Mass property UUID, Units of mass UUID, kg unit, and all required qualifiers."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: validation_process_coverage
    applies_to: "foreground process map"
    rule: "Require weaving and finishing records; require wet-processing and backing or coating records whenever the declared route includes those operations."
    source_ids:
      - jrc-textiles-bref-2023
      - epd-cpcr004-2025
  - rule_id: validation_atomic_exchanges
    applies_to: "inventory rows"
    rule: "Reject a row that combines multiple materials, utilities, fuels, wastes, or emissions; each exchange must have one identity, amount rule, property, unit, and treatment route where applicable."
    source_ids:
      - ec-environmental-footprint-2021
  - rule_id: validation_collection_trace
    applies_to: "foreground amounts"
    rule: "Require every collected or calculated amount to trace to the declared protocol, reporting period, site scope, raw record, and normalization calculation."
    source_ids:
      - ec-environmental-footprint-2021
  - rule_id: validation_mass_balance
    applies_to: "each foreground process"
    rule: "Report inputs, products, wastes, and quantified emissions on a consistent moisture basis and explain any material unexplained balance difference."
    source_ids:
      - jrc-textiles-bref-2023
  - rule_id: validation_unresolved_uuid
    applies_to: "non-reference inventory flow identity"
    rule: "Before publication, resolve each manifest-listed row_id to one verified Tiangong flow UUID or document its explicit row-level rejection; never substitute a semantically broader or adjacent-category flow."
    source_ids:
      - unsd-cpc-3-2025
published_dataset_profile:
  dataset_role: "Product-specific or product-family foreground manufacturing dataset that may be released as a secondary_dataset or background_dataset after review"
  downstream_use: "Foreground process datasets and lifecyclemodel projections for woven carpets and textile floor coverings at the plant gate"
  allowed_use: "Studies matching the declared woven construction, fibre composition, finishing route, backing or coating state, geography, technology, and reporting period"
  excluded_use: "Knotted, tufted, flocked, felt, or non-textile floor coverings; installation, use, maintenance, or end-of-life without additional modules; products with materially different construction or formulation"
  required_metadata: "PCR id and version; reference-flow UUIDs; required qualifiers; site and geography; reporting period; technology; product-family weighting; process coverage; allocation; cut-offs; upstream dataset register"
  required_quality_disclosure: "primary-data share; temporal coverage; meter and scale basis; mass-balance result; data gaps; estimates; allocation; upstream substitutions; unresolved identity decisions; verification status"
  update_trigger: "Material change in fibre composition, woven construction, wet-processing route, backing or coating formulation, plant technology, energy supply, product mass per area, allocation, reporting period, or upstream datasets"
