measurement_rules:
  - id: reference_mass
    applies_to: "accepted saleable reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine net product mass after the declared conditioning procedure; exclude pallets, cartons, cores and wrapping from the 1 kg reference amount. Record gross, tare and net mass evidence."
  - id: conditioning_basis
    applies_to: "product, yarn and offcut mass measurements"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Condition specimens or lots under ISO 139 or a declared contractually equivalent atmosphere before using measured mass for product qualification or mass-balance validation; disclose any alternative atmosphere."
  - id: area_length_conversion
    applies_to: "records collected in m2 or linear m"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert area or length records to mass only with lot-specific measured mass per unit area or mass per unit length and declared width; do not substitute a generic fabric factor."
  - id: fibre_composition_basis
    applies_to: "mixed-fibre product and material inputs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "mass fraction"
    rule: "State fibre names and dry-mass fractions from supplier evidence or an applicable ISO 1833 method; keep finish/add-on mass separate when it is not included in the stated fibre composition."
  - id: water_mass_volume
    applies_to: "process water and wastewater"
    required_property_ref:
      name: "Mass or volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Preserve the metered unit. Convert volume to mass only with a documented density and temperature basis; never assume that chemical baths or concentrated wastewater have the density of pure water."
  - id: energy_carrier_separation
    applies_to: "electricity, natural gas and purchased steam"
    required_property_ref:
      name: "Energy or mass"
      uuid: ""
    required_unit: "kWh, MJ or kg"
    rule: "Preserve each metered carrier as a separate exchange and document every conversion factor; do not combine electricity, fuel and steam into one energy row."
