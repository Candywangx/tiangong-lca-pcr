system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary includes receipt and internal handling of yarn, thread, chemicals and packaging; bobbin winding or equivalent route-specific preparation; non-woven/non-knitted/non-crocheted net or lace formation; route-applicable washing, scouring, bleaching, dyeing, rinsing, drying, heat-setting or chemical finishing; inspection, mending where performed, trimming, packing; on-site utilities; internal material handling; direct emissions; and on-site waste and wastewater handling. Upstream production of purchased yarn, chemicals, energy, water and packaging is represented by upstream datasets. Capital goods, employee travel, product use and downstream end-of-life are outside this factory-gate dataset unless the study goal explicitly extends the boundary."
      source_ids: []
    - rule_id: boundary_factory_gate
      applies_to: "all foreground packages"
      rule: "Include all on-site operations from receipt of yarn/thread through packed saleable product and all associated direct wastes and emissions; identify outsourced operations and link their datasets rather than silently excluding them."
      source_ids:
        - ec-jrc-textiles-bref-2023
        - eu-pef-2021-2279
    - rule_id: boundary_route_specificity
      applies_to: "formation, wet processing and finishing"
      rule: "Mark each route-applicable operation as included or demonstrably not applicable; absence requires product and process evidence, not a zero inserted without explanation."
      source_ids:
        - irvine-ruskey-bobbin-lace-2014
        - ec-jrc-textiles-bref-2023
    - rule_id: boundary_no_recursive_rebuild
      applies_to: "purchased CPC 27912 intermediates"
      rule: "Stop foreground tracing at the declared supplier product and require an upstream dataset, preventing double counting of the same manufacturing steps."
      source_ids:
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "Purchased yarn or thread lots, purchased auxiliaries and packaging are received at the reporting-facility gate with supplier identity, quantity, fibre/composition specification and upstream dataset reference."
  starting_condition_role: "The received yarn or thread is the first foreground-controlled material state; upstream fibre, polymer, spinning, filament and transport burdens remain represented by linked upstream datasets."
  product_classification_scope: "Only products satisfying the CPC 27912 boundary are reference products; woven, knitted, crocheted, embroidered, knotted-net, made-up-article and separately classified coated-fabric outputs are excluded."
  recursive_input_rule: "A purchased CPC 27912 input used in another CPC 27912 product shall be recorded once as an upstream product input with its supplier dataset; its manufacture shall not be recursively reconstructed inside this foreground dataset."
  upstream_dataset_requirement: "Each purchased yarn/thread, chemical, energy carrier, water supply and packaging input requires a geographically and technologically representative upstream dataset or an explicit documented data gap."
  disclosure: "Declare fibre composition, formation route, wet-processing and finishing applicability, outsourced operations, site, period, allocation basis, rejected output, wastewater route, packaging state and all excluded operations."
