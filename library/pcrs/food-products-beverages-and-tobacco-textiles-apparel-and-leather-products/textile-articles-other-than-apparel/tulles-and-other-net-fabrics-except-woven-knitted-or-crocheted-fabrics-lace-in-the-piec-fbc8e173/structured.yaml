allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared production and utilities"
    rule: "Prefer submetering, batch records and physically separated inventories so allocation is avoided. Do not allocate avoidable material losses or rework away from the lot that caused them."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "shared equipment or meters serving multiple products"
    rule: "When separation is not feasible, allocate electricity, fuel, steam, water and common consumables using the measured causal driver: machine-hours adjusted by measured load, bath volume, dryer throughput or conditioned product mass, in that order of relevance. Record the denominator and coverage."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_exception
    applies_to: "multiple valuable outputs lacking a defensible physical relationship"
    rule: "Use economic allocation only after documenting why subdivision and physical causality fail; use contemporaneous factory-gate values, disclose price period and currency, and test sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework
    applies_to: "internal rework"
    rule: "Keep the original material and energy burdens in the reporting lot; record only additional rework inputs and do not count the same intermediate mass as a co-product."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_recovery
    applies_to: "offcuts, rejects, sludge and packaging waste"
    rule: "Report waste mass and destination separately. Apply the selected study's documented waste/recycling method consistently; do not credit recovery without a named downstream dataset and explicit burden/benefit boundary."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts_and_issues
      process_id: "integrated_net_lace_manufacturing"
      flow_role: "fibre-specific yarn/thread inputs"
      record_type: "supplier certificate, purchase receipt, warehouse issue, return and lot genealogy"
      raw_fields: "material identity; fibre name; supplier; lot; yarn/thread specification; dry/conditioned basis; received mass; issued mass; returned mass; recycled content; upstream dataset"
      collection_method: "Reconcile supplier and warehouse records to production-lot genealogy; verify fibre composition by applicable ISO 1833 analysis when claims are material or disputed."
      unit: "kg"
      frequency: "each receipt and production issue"
      temporal_coverage: "complete reporting period with opening and closing inventory"
      site_scope: "all reporting-site stores and production lines"
      aggregation_rule: "Sum net issues by exact material identity; keep materially different upstream datasets separate; normalize after accepted output is known."
      quality_evidence: "supplier certificate; calibrated scale record; inventory reconciliation; composition test report; lot trace"
    - protocol_id: cp_energy_records
      process_id: "integrated_net_lace_manufacturing"
      flow_role: "electricity, natural gas and purchased steam"
      record_type: "utility meter, submeter, invoice, batch and machine log"
      raw_fields: "carrier; meter id; opening/closing reading; unit; timestamp; machine-hours; load evidence; steam conditions; heating value; lot link"
      collection_method: "Prefer lot-level submeters; otherwise reconcile site meters to invoices and allocate using a validated causal driver."
      unit: "kWh; MJ; kg steam"
      frequency: "meter interval and each lot/campaign"
      temporal_coverage: "complete reporting period including shutdown and start-up assigned consistently"
      site_scope: "all on-site operations inside boundary"
      aggregation_rule: "Subtract opening from closing readings, correct documented meter resets, subtract excluded loads, then allocate and normalize by accepted mass."
      quality_evidence: "calibration status; invoice reconciliation; meter coverage; allocation worksheet"
    - protocol_id: cp_water_and_wastewater_records
      process_id: "integrated_net_lace_manufacturing"
      flow_role: "process water and wastewater"
      record_type: "supply/discharge meter, batch sheet, sampling and treatment-transfer record"
      raw_fields: "source; meter id; volume; timestamp; bath id; operation; discharge destination; sample id; concentration; treatment route"
      collection_method: "Meter supply and discharge; retain batch make-up and dump records; pair representative samples with contemporaneous flow."
      unit: "m3; mg/L; kg"
      frequency: "each batch and meter interval; sampling per permit or control plan"
      temporal_coverage: "complete reporting period and representative operating states"
      site_scope: "all wet-processing, cleaning and on-site treatment operations"
      aggregation_rule: "Reconcile water balance; aggregate by source and destination; calculate loads only from measured volume and concentration."
      quality_evidence: "meter calibration; chain of custody; laboratory accreditation; water-balance closure"
    - protocol_id: cp_chemical_ledger
      process_id: "integrated_net_lace_manufacturing"
      flow_role: "each atomic process chemical"
      record_type: "recipe, batch issue, return, purchase and stock record"
      raw_fields: "chemical identity; CAS or formulation id; supplier; concentration/solids; lot; issued mass; returned mass; bath id; operation; safety data sheet"
      collection_method: "Reconcile recipe issues and returns to stock movement; create one exchange per actual chemical or supplied formulation."
      unit: "kg supplied product"
      frequency: "each batch issue/return"
      temporal_coverage: "complete reporting period"
      site_scope: "all chemical stores and process lines inside boundary"
      aggregation_rule: "Sum net issue by exact identity and concentration; do not aggregate dyes, salts, auxiliaries or finishes into plural rows."
      quality_evidence: "signed batch sheet; stock reconciliation; supplier SDS/technical sheet; scale calibration"
    - protocol_id: cp_packaging_records
      process_id: "integrated_net_lace_manufacturing"
      flow_role: "each packaging component"
      record_type: "issue record, bill of materials and item mass check"
      raw_fields: "component identity; material; grade; recycled content; count; unit mass; issued mass; returned mass; product lot"
      collection_method: "Weigh packaging or multiply verified item mass by count; keep film, carton, core and pallet components separate."
      unit: "kg; count"
      frequency: "each packing lot"
      temporal_coverage: "complete reporting period"
      site_scope: "reporting-site packing operations"
      aggregation_rule: "Sum net issues by component and normalize by accepted product mass."
      quality_evidence: "approved bill of materials; item mass sample; issue/return reconciliation"
    - protocol_id: cp_finished_product_and_quality
      process_id: "integrated_net_lace_manufacturing"
      flow_role: "accepted and off-spec finished product"
      record_type: "production completion, conditioned mass, inspection, release, rework and rejection record"
      raw_fields: "lot; product form; formation route; composition; dimensions; mass; conditioning atmosphere; accepted mass; rejected mass; rework mass; defect reason; packaging tare"
      collection_method: "Condition and weigh product; reconcile accepted, rejected and reworked quantities to release records."
      unit: "kg; m; m2; count"
      frequency: "each production lot"
      temporal_coverage: "complete reporting period"
      site_scope: "all lines and quality-release points inside boundary"
      aggregation_rule: "Sum accepted conditioned net mass by declared product; exclude packaging tare; prevent double counting of rework."
      quality_evidence: "calibrated scale; ISO 139 conditioning record; inspection report; release authorization; mass reconciliation"
    - protocol_id: cp_solid_waste_records
      process_id: "integrated_net_lace_manufacturing"
      flow_role: "each fibre-specific offcut and sludge waste"
      record_type: "line collection, scale ticket, waste manifest and treatment receipt"
      raw_fields: "waste identity; fibre/material; wet/dry basis; mass; source lot; destination; recovery/disposal route; transporter; treatment dataset"
      collection_method: "Segregate and weigh at collection or dispatch; link each route to the generating lots."
      unit: "kg"
      frequency: "each container or dispatch"
      temporal_coverage: "complete reporting period"
      site_scope: "all production and on-site treatment areas"
      aggregation_rule: "Sum by exact waste identity and destination; allocate shared containers by weighed composition, not assumed percentages."
      quality_evidence: "calibrated scale; manifest; receiving receipt; solids test for sludge; route reconciliation"
    - protocol_id: cp_direct_emissions_records
      process_id: "integrated_net_lace_manufacturing"
      flow_role: "each direct air or water elementary flow"
      record_type: "continuous monitor, stack test, permit sample, fuel calculation or accredited laboratory result"
      raw_fields: "substance; compartment; location; timestamp; concentration; flow/volume; load; method; detection limit; linked fuel or discharge record"
      collection_method: "Use measured load where available; otherwise calculate only with a documented approved factor and collected activity record."
      unit: "kg; mg/L; mg/Nm3"
      frequency: "monitoring interval required by permit/control plan"
      temporal_coverage: "representative operating conditions across reporting period"
      site_scope: "all direct release points inside boundary"
      aggregation_rule: "Integrate measured load or concentration times contemporaneous flow; treat non-detects by the declared laboratory/permit rule."
      quality_evidence: "calibration; chain of custody; accredited method; permit report; calculation audit trail"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory exchange"
      rule: "normalized amount = attributable reporting-period exchange / accepted conditioned net product mass"
      inputs:
        - "exchange amount"
        - "accepted net product mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
        - iso-139-2005
    - id: calc_net_material_issue
      applies_to: "yarn/thread, chemical and packaging inputs"
      rule: "net issue = opening inventory + receipts - closing inventory - documented returns; reconcile to lot issues before normalization"
      inputs:
        - "inventory and receipt/return records"
      output: "net material input by exact identity"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_area_length_to_mass
      applies_to: "product records in m2 or m"
      rule: "mass = measured area or length × lot-specific measured mass per unit area or length; width is required for conversions that use area"
      inputs:
        - "measured dimension"
        - "lot-specific factor"
        - "width where relevant"
      output: "conditioned product mass"
      source_ids:
        - iso-139-2005
    - id: calc_shared_utility_allocation
      applies_to: "shared utility meter"
      rule: "attributable utility = shared-meter total × validated causal driver for target lots / sum of the same driver for all served lots"
      inputs:
        - "meter total"
        - "machine-hours/load"
        - "bath volume"
        - "throughput or mass driver"
      output: "allocated carrier amount"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_discharge_load
      applies_to: "monitored water emission"
      rule: "load = contemporaneous discharge volume × laboratory concentration with explicit unit conversion"
      inputs:
        - "discharge volume"
        - concentration
        - "sample representativeness"
      output: "kg substance or parameter to water"
      source_ids:
        - us-epa-textile-effluent-2004
    - id: calc_mass_balance
      applies_to: "material system"
      rule: "reconcile conditioned material inputs with accepted product, off-spec product, fibre-specific offcuts, retained inventory and documented emissions/add-on changes; investigate unexplained difference rather than forcing closure"
      inputs:
        - "material issues"
        - "accepted/rejected product"
        - wastes
        - "inventory change"
        - "finish add-on"
      output: "mass-balance residual and explanation"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and material flows"
      requirement: "Preserve exact fibre names, composition, yarn/thread grade, route, finish, supplier and lot; prohibit a generic textile-material row when the actual identity is available."
      evidence: "supplier specification; composition test; lot genealogy; product release record"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one continuous representative reporting period, normally at least twelve months or the complete campaign for campaign production; disclose start-up, shutdown and abnormal-event treatment."
      evidence: "dated record coverage; production calendar; exception log"
    - id: dq_geographical
      applies_to: "foreground and upstream data"
      requirement: "Foreground data shall represent the declared site; upstream datasets shall match supplier geography and technology where material, with gaps disclosed."
      evidence: "site identifier; supplier origin; upstream dataset metadata; gap register"
    - id: dq_completeness
      applies_to: "all boundary exchanges"
      requirement: "Reconcile material, utility, water, chemical, waste and product ledgers; document every excluded or not-applicable operation and all unmonitored direct releases."
      evidence: "reconciliation worksheets; meter coverage; permit inventory; exclusion register"
    - id: dq_measurement
      applies_to: "meters, scales and laboratory data"
      requirement: "Use calibrated instruments and documented methods; retain detection limits, uncertainty or accuracy information and sampling representativeness."
      evidence: "calibration certificates; laboratory reports; sampling plan; QA/QC records"
    - id: dq_allocation
      applies_to: "shared records"
      requirement: "Document source total, driver, denominator, affected products and sensitivity; allocation factors shall sum to one for every shared record."
      evidence: "allocation workbook; meter and driver evidence; sensitivity check"
    - id: dq_versioning
      applies_to: "published dataset"
      requirement: "Update when fibre composition, supplier, formation technology, wet-processing recipe, finish, energy system, wastewater route, site, allocation basis or representative period changes materially."
      evidence: "change-control record; annual representativeness review"
validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "product identity"
    rule: "Reject a package unless the reference product is within CPC 27912 and exclusions are checked; require declared product form, formation route, fibre composition, finish and market state."
    source_ids:
      - unsd-cpc-3-0-2025
      - eu-textile-fibre-regulation-1007-2011
  - rule_id: validate_reference_flow
    applies_to: "reference quantity"
    rule: "Require exactly 1 kg accepted conditioned net product, separate packaging tare, the verified product-flow UUID and Mass flow-property UUID, plus every required qualifier."
    source_ids:
      - iso-139-2005
  - rule_id: validate_atomic_exchanges
    applies_to: "inventory"
    rule: "Reject plural collections, combined utilities, selector instructions and unresolved placeholder identities. Every concrete material, chemical, energy carrier, packaging component, waste and elementary emission shall be one atomic row with route applicability."
    source_ids:
      - ec-jrc-textiles-bref-2023
      - eu-pef-2021-2279
  - rule_id: validate_uuid_evidence
    applies_to: "Tiangong references"
    rule: "Accept a UUID only after hybrid discovery and state-100 direct read agree on semantic identity, public state, flow type, classification where applicable, and reference property; otherwise omit it and retain the row-level rejection reason."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_foreground_amounts
    applies_to: "all inventory rows"
    rule: "Require a collected foreground record or a value calculated from collected records and a linked protocol. Reject AI-authored or uncited default quantity ranges."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_route_coverage
    applies_to: "process boundary"
    rule: "Require an operation ledger for preparation, formation, wet processing, finishing, inspection/trimming and packaging; each operation shall be included, outsourced with a dataset, or demonstrably not applicable."
    source_ids:
      - irvine-ruskey-bobbin-lace-2014
      - ec-jrc-textiles-bref-2023
  - rule_id: validate_mass_balance
    applies_to: "materials and outputs"
    rule: "Require reconciled yarn/thread and finish inputs against accepted product, rejects, fibre-specific offcuts, inventory change and documented releases; investigate material residuals."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_wastewater
    applies_to: "wet-processing routes"
    rule: "Require metered or batch-reconciled water, declared chemical identities, wastewater destination and applicable monitoring; do not report transfers to treatment as direct elementary emissions."
    source_ids:
      - ec-jrc-textiles-bref-2023
      - us-epa-textile-effluent-2004
  - rule_id: validate_allocation
    applies_to: "shared records"
    rule: "Require the allocation hierarchy, causal driver, factor-sum check and disclosure; reject unexplained allocation or unsupported recycling credit."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_bilingual_alignment
    applies_to: "PCR implementation"
    rule: "English and Chinese implementations shall preserve identical ordered process ids, row ids, rule ids, controlled tokens, source ids and UUIDs."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Factory-gate foreground dataset for a declared CPC 27912 tulle, non-woven/non-knitted/non-crocheted net fabric, or lace product"
  downstream_use: "May be used as a secondary_dataset or background_dataset for apparel, furnishings, components or other products that consume the declared textile, provided the product and route qualifiers match"
  allowed_use: "Product-system modelling with matching fibre composition, formation technology, finish, geography, period, quality grade, packaging state and wastewater route"
  excluded_use: "Generic use for woven, knitted, crocheted, embroidered, knotted-net, nonwoven, coated-fabric or made-up-article products; substitution across materially different fibre or finish routes without sensitivity analysis"
  required_metadata: "PCR id; product-flow UUID; product form; CPC scope; fibre names/fractions; yarn/thread grades; formation route; dimensions and mass factor; wet-processing/finish route; site and geography; period; accepted/rejected mass; allocation; wastewater and waste destinations; upstream dataset references; packaging state"
  required_quality_disclosure: "Foreground share; record and meter coverage; conditioning method; composition evidence; allocation factors; mass-balance residual; sampling and laboratory methods; unresolved UUIDs/data gaps; exclusions; representativeness and uncertainty evidence"
  update_trigger: "Material change in fibre composition, supplier/upstream dataset, formation technology, recipe or finish, utility system, wastewater treatment, allocation, site, product specification, or representative reporting period; otherwise review at least annually"
data_sources:
  - id: "unsd-cpc-3-0-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, *CPC Ver. 3.0 Explanatory Notes*, 30 June 2025, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Exact CPC 27912 scope and exclusions from adjacent textile categories"
  - id: "ec-jrc-textiles-bref-2023"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, *Best Available Techniques (BAT) Reference Document for the Textiles Industry*, 2023, https://bureau-industrial-transformation.jrc.ec.europa.eu/reference/textiles-industry"
    used_for: "Fibre preparation, pretreatment, dyeing, finishing, energy, water, chemical, wastewater and emissions process coverage"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279 on the use of the Environmental Footprint methods, https://eur-lex.europa.eu/eli/reco/2021/2279/oj/eng"
    used_for: "Functional unit, company-specific data, data quality, allocation, cut-off, waste/recycling and dataset rules"
  - id: "eu-textile-fibre-regulation-1007-2011"
    type: "standard"
    reference: "Regulation (EU) No 1007/2011 on textile fibre names and related labelling and marking of fibre composition, https://eur-lex.europa.eu/eli/reg/2011/1007/oj/eng"
    used_for: "Fibre names, composition disclosure, textile-product identity and quantitative analysis requirements"
  - id: "iso-139-2005"
    type: "standard"
    reference: "ISO 139:2005, *Textiles — Standard atmospheres for conditioning and testing*, https://www.iso.org/standard/35179.html"
    used_for: "Conditioning basis for product, yarn and waste mass evidence"
  - id: "iso-1833-1-2020"
    type: "standard"
