allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Route-specific production batch"
    rule: "First separate route, product, and rework records so that inputs, energy, accepted output, and rejects are directly assigned without allocation."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "Shared coating, twisting, inspection, winding, or utility records"
    rule: "When direct assignment is not possible, allocate by a documented physical relationship such as route-specific operating time, metered energy, or dry mass throughput; economic allocation is permitted only when no defensible physical relationship exists and must be disclosed."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_rework
    applies_to: "Internal rework"
    rule: "Keep reworked yarn inside the producing batch and count only its additional measured material and energy once; do not report the same reworked mass as both product and waste."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_scrap
    applies_to: "Off-spec yarn leaving the foreground boundary"
    rule: "Report the measured reject as a waste output. Any recycling credit or substituted-product claim belongs to an explicitly declared downstream scenario and shall not reduce the foreground inventory silently."
    source_ids:
      - ec-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_metal_coating_batch
      process_id: "metal_coating"
      flow_role: "substrate input, aluminium input, accepted output, reject output, and rework"
      record_type: "batch material record"
      raw_fields: "batch_id; substrate_item; substrate_mass; aluminium_item; aluminium_issued_mass; aluminium_return_mass; accepted_net_dry_mass; reject_mass; rework_mass; moisture_condition"
      collection_method: "Calibrated scale records reconciled to issue, return, production, quality, and waste tickets."
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "Representative continuous 12-month period or all batches in a shorter declared campaign"
      site_scope: "Every site included in the dataset"
      aggregation_rule: "Sum non-overlapping batch records, keep rework internal, then normalize by accepted net dry mass."
      quality_evidence: "Calibration certificate; signed batch record; material issue and return tickets; reject disposition; moisture-conditioning record."
    - protocol_id: cp_metal_coating_energy
      process_id: "metal_coating"
      flow_role: "coating, inspection, and winding electricity"
      record_type: "meter record"
      raw_fields: "meter_id; start_time; end_time; start_reading; end_reading; route_runtime; shared_meter_driver; batch_id"
      collection_method: "Read a route submeter; if shared, retain meter total and the physical allocation calculation."
      unit: "kWh"
      frequency: "every batch or meter interval"
      temporal_coverage: "Same period and site coverage as material records"
      site_scope: "Every coating line included in the dataset"
      aggregation_rule: "Subtract verified non-production loads when separately metered, allocate shared use by the declared physical driver, and normalize by accepted net dry mass."
      quality_evidence: "Meter identification; calibration or utility reconciliation; operating log; allocation workbook."
    - protocol_id: cp_metal_combination_batch
      process_id: "metal_filament_combination"
      flow_role: "base-yarn input, monofilament input, accepted output, reject output, and rework"
      record_type: "batch material record"
      raw_fields: "batch_id; base_yarn_item; base_yarn_mass; metal_monofilament_item; metal_monofilament_mass; accepted_net_dry_mass; reject_mass; rework_mass; moisture_condition"
      collection_method: "Calibrated scale records reconciled to issue, return, production, quality, and waste tickets."
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "Representative continuous 12-month period or all batches in a shorter declared campaign"
      site_scope: "Every site included in the dataset"
      aggregation_rule: "Sum non-overlapping batch records, keep rework internal, then normalize by accepted net dry mass."
      quality_evidence: "Calibration certificate; signed batch record; issue and return tickets; reject disposition; moisture-conditioning record."
    - protocol_id: cp_metal_combination_energy
      process_id: "metal_filament_combination"
      flow_role: "twisting, inspection, and winding electricity"
      record_type: "meter record"
      raw_fields: "meter_id; start_time; end_time; start_reading; end_reading; route_runtime; shared_meter_driver; batch_id"
      collection_method: "Read a route submeter; if shared, retain meter total and the physical allocation calculation."
      unit: "kWh"
      frequency: "every batch or meter interval"
      temporal_coverage: "Same period and site coverage as material records"
      site_scope: "Every combination line included in the dataset"
      aggregation_rule: "Subtract verified non-production loads when separately metered, allocate shared use by the declared physical driver, and normalize by accepted net dry mass."
      quality_evidence: "Meter identification; calibration or utility reconciliation; operating log; allocation workbook."
  calculation_rules:
    - id: calc_normalized_exchange
      applies_to: "Every collected material, energy, and waste exchange"
      rule: "normalized exchange = route-period exchange / accepted net dry metallized yarn from the same route and period"
      inputs:
        - "non-overlapping exchange total"
        - "accepted net dry yarn mass"
      output: "kg/kg or kWh/kg as applicable"
      source_ids:
        - ec-pef-2021-2279
    - id: calc_metal_consumption
      applies_to: "Direct-coating metal input"
      rule: "net metal input = issued metal - verified clean metal return; do not subtract metal contained in waste that leaves the foreground boundary"
      inputs:
        - "issued metal mass"
        - "clean return mass"
      output: "kg net metal input"
      source_ids:
        - ec-pef-2021-2279
    - id: calc_batch_mass_balance
      applies_to: "Each route and reporting period"
      rule: "mass-balance difference = total material inputs - accepted yarn output - measured material waste outputs - verified clean returns; investigate and disclose the residual rather than forcing it to zero"
      inputs:
        - "substrate and metal inputs"
        - "accepted output"
        - "waste outputs"
        - "clean returns"
      output: "kg and percent of total material input"
      source_ids:
        - ec-pef-2021-2279
    - id: calc_metal_mass_fraction
      applies_to: "Reference product qualifier"
      rule: "metal mass fraction = measured metal mass in accepted yarn / accepted net dry yarn mass, using batch mass reconciliation or a documented product-composition test"
      inputs:
        - "accepted-product metal mass"
        - "accepted net dry yarn mass"
      output: "kg metal/kg yarn"
      source_ids:
        - repon-mikucioniene-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and all inputs"
      requirement: "Retain exact substrate composition, metal species and form, route, yarn construction, linear density, coating or finish, and Tiangong UUID where confirmed."
      evidence: "Product specification; bill of materials; state-100 UUID evidence; supplier declaration."
    - id: dq_temporal
      applies_to: "Foreground records"
      requirement: "Use one representative continuous 12-month period unless the campaign is shorter; disclose the period, shutdowns, and excluded batches."
      evidence: "Production calendar; batch register; meter coverage report."
    - id: dq_completeness
      applies_to: "Each included route"
      requirement: "Reconcile material issue, return, accepted output, rework, rejects, and metered energy; document any route-specific water, chemical, solvent, wastewater, sludge, or direct-emission exchange that actually occurs."
      evidence: "Signed reconciliation; waste tickets; meter reconciliation; environmental monitoring records."
    - id: dq_measurement
      applies_to: "Mass, energy, and linear density"
      requirement: "Use calibrated or utility-reconciled instruments and retain method, condition, frequency, and uncertainty or tolerance information."
      evidence: "Calibration certificates; test report; utility invoice; instrument log."
    - id: dq_representativeness
      applies_to: "Multi-line or multi-site dataset"
      requirement: "Include all lines and sites claimed by the dataset or document a production-weighted sampling and aggregation method."
      evidence: "Line/site production totals; sampling plan; aggregation workbook."
    - id: dq_uuid_resolution
      applies_to: "Unresolved inventory flow identities"
      requirement: "Do not assign an inventory UUID until the named atomic exchange is confirmed independently by hybrid retrieval and a state-100 direct read."
      evidence: "Manifest row-level candidate record and direct-read evidence."
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The product flow UUID shall resolve at state 100 to Product flow, base name Metallized yarn, CPC 27993, quantitative reference Mass, and reference unit kg."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: validate_reference_amount
    applies_to: "Reference flow"
    rule: "Accepted output shall equal exactly 1 kg net dry yarn; carrier and packaging mass shall be excluded and moisture condition disclosed."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: validate_route_exclusivity
    applies_to: "Process map"
    rule: "Include metal_coating, metal_filament_combination, or both only when production records show the corresponding route; do not merge route inventories before route-level mass and energy reconciliation."
    source_ids:
      - repon-mikucioniene-2021
  - rule_id: validate_atomic_flows
    applies_to: "Inventory rows"
    rule: "Every selected flow shall be one concrete exchange. Different metals, textile substrates, chemicals, energy carriers, waste streams, and emitted substances shall remain separate rows."
    source_ids:
      - jrc-textiles-bref-2023
  - rule_id: validate_mass_balance
    applies_to: "Each route and period"
    rule: "Report the calculated mass-balance residual and investigate material discrepancies against issue, return, rework, reject, and accepted-output records."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: validate_uuid_evidence
    applies_to: "Inventory UUIDs"
    rule: "Reject an inventory UUID that lacks both hybrid-retrieval evidence and an exact state-100 direct read for the selected atomic flow."
    source_ids: []
  - rule_id: validate_bilingual_alignment
    applies_to: "English and Chinese PCR renderings"
    rule: "The ordered process ids, row ids, rule ids, controlled tokens, source ids, and UUIDs shall match exactly across languages."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground metallized-yarn production data package and publishable unit-process dataset."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA of downstream yarn processing, weaving, knitting, embroidery, textile products, and route-specific supply-chain studies when the required qualifiers and representativeness match."
  excluded_use: "Bare metal wire, uncombined textile yarn, woven fabric, garments, products with undisclosed metal or substrate, or comparisons that ignore different metal species, metal fractions, coating routes, or yarn constructions."
  required_metadata: "PCR id and version; CPC 27993; product-flow and Mass UUIDs; textile substrate; metal species and form; incorporation route; yarn construction; linear density; metal mass fraction; coating or finish; moisture condition; geography; period; route share; allocation; net-mass exclusions; unresolved UUIDs."
  required_quality_disclosure: "Record coverage; calibration and meter reconciliation; mass-balance residual; route-level allocation; rework and reject treatment; upstream dataset selection; missing route-specific exchanges; UUID verification state; data limitations."
  update_trigger: "Change in substrate, metal species or form, metal fraction, deposition/plating or combination route, protective finish, major equipment, electricity supply, site mix, allocation method, product specification, or representative period."
