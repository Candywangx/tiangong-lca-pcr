functional_unit:
  what: "Metallized yarn that supplies a declared metallic component within a textile-yarn construction for downstream textile manufacture."
  how_much: "1 kg net dry mass of saleable metallized yarn at the factory gate."
  how_well: "Conforms to the producer's declared substrate, metal species, metal mass fraction, yarn construction, linear density, coating state, and acceptance specification."
  how_long_or_cycle: "One completed production batch; no service duration is assigned to the intermediate product."
  reference_flow_link: "The functional unit is realized by the reference product flow below after rejection and rework are accounted for."
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when declared textile yarn, metallic feedstock or monofilament, and other route-specific inputs are received by the metallized-yarn producer. It includes route-specific metal incorporation, twisting or wrapping when applicable, in-line inspection, winding, rework, and handling of rejects generated by those operations. Production of textile yarn, aluminium, stainless steel, electricity, and other purchased inputs remains upstream and requires linked upstream datasets. Downstream weaving, knitting, embroidery, garment manufacture, use, and end-of-life are outside the foreground boundary."
      source_ids: []
    - rule_id: boundary_route_specific
      applies_to: "Foreground process map"
      rule: "Include only the declared route, but include every operation at the producing site from received inputs through accepted wound yarn, including route-specific coating or combination, rework, inspection, and reject handling."
      source_ids:
        - repon-mikucioniene-2021
        - jrc-textiles-bref-2023
    - rule_id: boundary_upstream_inputs
      applies_to: "Purchased material and energy inputs"
      rule: "Keep upstream production outside the foreground boundary and link a dataset for each separately identified textile substrate, metal, and energy carrier."
      source_ids:
        - ec-pef-2021-2279
    - rule_id: boundary_no_hidden_wet_steps
      applies_to: "Wet plating, cleaning, or coating steps when present"
      rule: "If the declared route uses water, chemicals, solvents, or wet treatment, add each actual chemical input, water input, wastewater output, sludge output, and substance-specific direct emission as an atomic exchange; absence of such steps must be documented rather than represented by a zero-value placeholder."
      source_ids:
        - jrc-textiles-bref-2023
boundary_abstraction:
  declared_starting_condition: "Received textile substrate and metallic feedstock at the metallized-yarn manufacturing site, with supplier, composition, mass, moisture condition, and upstream dataset identifiers declared."
  starting_condition_role: "Upstream product input to the foreground metallized-yarn operation."
  product_classification_scope: "CPC 3.0 code 27993 only; downstream woven fabric and other textile articles are outside this PCR."
  recursive_input_rule: "If metallized yarn is consumed as an input to produce the reference metallized yarn, record it once as an upstream product input with its own dataset and mass; do not recursively reopen its production inside the same foreground process."
  upstream_dataset_requirement: "Provide product-specific or representative upstream datasets for each textile substrate, each metal feedstock, electricity supply, and every other purchased input actually used."
  disclosure: "Disclose the metal species and form, substrate composition, incorporation technique, protective finish, rework loop, yield definition, excluded packaging or carrier mass, site, period, and any shared-process allocation."
