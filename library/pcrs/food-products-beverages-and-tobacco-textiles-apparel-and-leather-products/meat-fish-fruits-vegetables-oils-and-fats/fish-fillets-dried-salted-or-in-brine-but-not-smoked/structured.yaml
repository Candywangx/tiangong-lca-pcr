allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "multi-output foreground processes"
    rule: "First avoid allocation by subdividing independently metered receiving, preparation, curing, drying, packaging, storage, and residue-handling operations, or by expanding the system only when the substituted function is demonstrable and consistent with the study goal."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_co_product_status
    applies_to: "fish trimmings, offal, recovered salt, and other outputs"
    rule: "Determine and document whether each non-reference output is waste, recyclable material, or co-product at the facility gate using its actual destination, legal status, and economic function; do not assign co-product credit to a waste flow without evidence."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_then_economic
    applies_to: "unavoidable joint burdens"
    rule: "When subdivision or justified system expansion is not feasible, use a physical relation that reflects causality, such as measured mass, dry matter, or another documented process driver. If no defensible physical relation exists, use economic allocation based on contemporaneous net revenues and report the price period, currency, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_utilities
    applies_to: "shared refrigeration, water, sanitation, drying, and storage"
    rule: "Allocate shared measured utilities using a documented physical driver such as meter sub-reading, equipment operating time and rated load, mass throughput, storage mass-time, or dryer batch energy; do not use revenue allocation for utilities when a physical driver is available."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_upstream_consistency
    applies_to: "incoming fish and background datasets"
    rule: "Preserve the allocation method embedded in upstream fish-production or capture datasets, disclose it and any proxy mismatch, and do not reallocate upstream burdens inside the foreground processor model."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_batch
      process_id: "receiving_cold_handling"
      flow_role: "incoming, accepted, and rejected fish mass"
      record_type: "weighbridge or calibrated scale records; receiving inspection; supplier and lot records"
      raw_fields: "lot_id; species; origin; supplier; incoming form; temperature; gross_mass; glaze_or_free_liquid; accepted_mass; rejected_mass; disposition"
      collection_method: "reconcile receiving tickets, calibrated weights, and inspection records by lot"
      unit: "kg; deg C"
      frequency: "every lot"
      temporal_coverage: "representative continuous 12-month period or all lots in a shorter declared campaign"
      site_scope: "all facilities in the declared dataset"
      aggregation_rule: "sum mass by lot and normalize accepted, rejected, and final output through batch genealogy"
      quality_evidence: "calibration records; receiving logs; supplier specification; rejection disposition; temperature record"
    - protocol_id: cp_receiving_energy
      process_id: "receiving_cold_handling"
      flow_role: "receipt, thawing-control, ice, and cold-holding utilities"
      record_type: "electricity meter; ice invoice or production log; equipment log"
      raw_fields: "meter_start; meter_end; ice_mass; equipment_hours; rated_load; lots_served"
      collection_method: "use submeter data first, otherwise documented equipment-hour allocation"
      unit: "kWh; kg"
      frequency: "each lot or daily meter interval"
      temporal_coverage: "same period as production inventory"
      site_scope: "all receiving and cold-holding equipment in scope"
      aggregation_rule: "allocate shared utilities by measured equipment time, mass-time, or another documented physical driver"
      quality_evidence: "meter identity; invoice; equipment log; allocation worksheet"
    - protocol_id: cp_preparation_batch
      process_id: "preparation_filleting"
      flow_role: "accepted input and prepared fillet output"
      record_type: "calibrated batch weights and production records"
      raw_fields: "batch_id; input_mass; prepared_fillet_mass; species; operations_performed; start_time; end_time"
      collection_method: "weigh drained input and output at consistent defined states"
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "same period as production inventory"
      site_scope: "all preparation lines in scope"
      aggregation_rule: "sum paired batch input and output; retain route-specific yields"
      quality_evidence: "calibration; batch sheet; operator sign-off; state-definition record"
    - protocol_id: cp_preparation_water_waste
      process_id: "preparation_filleting"
      flow_role: "processing water, solid residues, and wastewater"
      record_type: "water meter; waste scales; discharge meter; destination records"
      raw_fields: "water_in; recirculated_water; wastewater_out; residue_type; residue_mass; destination; pollutant_measurements"
      collection_method: "meter water and wastewater and weigh residue containers; use a documented balance only for missing discharge meter"
      unit: "kg; m3"
      frequency: "daily or each batch"
      temporal_coverage: "same period as production inventory"
      site_scope: "all preparation and sanitation operations attributable to the line"
      aggregation_rule: "aggregate by stream and destination; avoid double counting recirculated water"
      quality_evidence: "meter records; scale calibration; waste transfer note; laboratory report"
    - protocol_id: cp_salting_batch
      process_id: "salting_curing"
      flow_role: "fillets, salt, brine water, cured output, and product condition"
      record_type: "batch recipe; calibrated scales; tank records; salinometer or laboratory records"
      raw_fields: "batch_id; fillet_input; salt_added; water_added; brine_reused; brine_concentration; curing_time; temperature; cured_mass; retained_brine; moisture_or_salt_result"
      collection_method: "reconcile issued materials, measured tank additions, drained output, and product tests"
      unit: "kg; hours; deg C; concentration as declared"
      frequency: "every batch"
      temporal_coverage: "same period as production inventory"
      site_scope: "every salting or brining route in scope"
      aggregation_rule: "calculate route-specific totals; report fresh and reused brine separately"
      quality_evidence: "recipe authorization; calibration; salinometer or laboratory record; time-temperature log"
    - protocol_id: cp_salting_energy_waste
      process_id: "salting_curing"
      flow_role: "curing utilities, spent brine, purge, and discarded salt"
      record_type: "electricity meter; equipment log; tank discharge and waste records"
      raw_fields: "electricity; pump_hours; cooling_hours; spent_brine_mass_or_volume; purge; discarded_salt; destination"
      collection_method: "meter utilities and weigh or meter each discharged stream"
      unit: "kWh; kg; m3"
      frequency: "each batch or daily interval"
      temporal_coverage: "same period as production inventory"
      site_scope: "all curing tanks, pumps, and cooling equipment in scope"
      aggregation_rule: "allocate shared utilities physically and aggregate wastes by destination"
      quality_evidence: "meter identity; tank record; waste transfer note; discharge record"
    - protocol_id: cp_drying_batch
      process_id: "hygienic_drying"
      flow_role: "dryer input, output, moisture, water activity, and calculated water removed"
      record_type: "calibrated scales; moisture or water-activity test; dryer batch record"
      raw_fields: "batch_id; input_mass; output_mass; inlet_moisture_basis; inlet_moisture; outlet_moisture_basis; outlet_moisture; water_activity; time; temperature; humidity; airflow"
      collection_method: "pair cooled, equilibrated mass measurements with identified laboratory or instrument methods"
      unit: "kg; percent or kg/kg; dimensionless; hours; deg C"
      frequency: "every drying batch"
      temporal_coverage: "same period as production inventory"
      site_scope: "every drying technology in scope"
      aggregation_rule: "calculate water removed with calc_drying_water_removed; aggregate only compatible moisture bases"
      quality_evidence: "scale calibration; instrument calibration; laboratory method; dryer log"
    - protocol_id: cp_drying_energy
      process_id: "hygienic_drying"
      flow_role: "electricity and fuel"
      record_type: "electricity meter; fuel meter or invoice; dryer control log"
      raw_fields: "electricity; fuel_quantity; fuel_unit; energy_factor; batch_id; shared_batches"
      collection_method: "use direct batch metering first; otherwise allocate from documented operating time and load"
      unit: "kWh; MJ; native fuel unit"
      frequency: "every batch or meter interval"
      temporal_coverage: "same period as production inventory"
      site_scope: "all dryers and ancillary equipment in scope"
      aggregation_rule: "convert units explicitly and allocate shared energy by batch operating time and load"
      quality_evidence: "meter; invoice; fuel factor source; allocation worksheet"
    - protocol_id: cp_packaging_batch
      process_id: "finishing_packaging_storage"
      flow_role: "processed input, retained brine, packaging, final product, and finishing waste"
      record_type: "line batch record; calibrated scales; packaging issue record"
      raw_fields: "lot_id; processed_input; retained_brine; packaging_by_material; net_product; reject_product; packaging_waste; units_packed"
      collection_method: "reconcile product and packaging issued, returned, packed, and rejected"
      unit: "kg; item count"
      frequency: "every lot"
      temporal_coverage: "same period as production inventory"
      site_scope: "all packaging formats and lines in scope"
      aggregation_rule: "aggregate separately by packaging material and product format; normalize net edible product to 1 kg"
      quality_evidence: "calibration; packaging bill of materials; issue-return record; packed-unit weight check"
    - protocol_id: cp_packaging_energy
      process_id: "finishing_packaging_storage"
      flow_role: "packaging-line and storage electricity"
      record_type: "meter; equipment log; storage inventory"
      raw_fields: "meter_start; meter_end; equipment_hours; storage_mass; storage_days; temperature_setpoint; lots_served"
      collection_method: "submeter directly or allocate shared energy by documented line time and storage mass-time"
      unit: "kWh; kg-day"
      frequency: "daily or meter interval"
      temporal_coverage: "same period as production inventory"
      site_scope: "all packaging and processor-gate storage equipment in scope"
      aggregation_rule: "allocate packaging by operating time and storage by mass-time within temperature zone"
      quality_evidence: "meter identity; equipment log; storage record; allocation worksheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground inventory"
      rule: "normalized amount = reporting-period amount divided by reporting-period net reference product mass"
      inputs:
        - "flow amount"
        - "net reference product mass"
      output: "amount per 1 kg net finished product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_receiving_acceptance
      applies_to: "receiving"
      rule: "accepted mass = received gross mass minus separately measured rejected mass, separated glaze or free liquid, and other excluded receipt components"
      inputs:
        - "gross mass"
        - "rejected mass"
        - "excluded free liquid or glaze"
      output: "accepted fish material"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_brine_balance
      applies_to: "salting and curing"
      rule: "fresh brine inputs + reused brine inputs = retained brine in product + reused brine returned + spent brine and purge + measured or disclosed balance difference"
      inputs:
        - salt
        - water
        - "incoming reused brine"
        - "retained brine"
        - "returned brine"
        - discharge
      output: "brine mass-balance reconciliation"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_drying_water_removed
      applies_to: "hygienic drying"
      rule: "water removed = inlet wet mass multiplied by inlet moisture fraction minus outlet wet mass multiplied by outlet moisture fraction, using the same declared moisture basis"
      inputs:
        - "inlet mass"
        - "inlet moisture"
        - "outlet mass"
        - "outlet moisture"
        - "moisture basis"
      output: "kg water removed"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_shared_utility_allocation
      applies_to: "shared utilities"
      rule: "allocated utility = measured shared total multiplied by the lot physical driver divided by the sum of physical drivers for all lots served"
      inputs:
        - "shared total"
        - "lot driver"
        - "total drivers"
      output: "utility amount attributable to the lot"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "product and raw-material identity"
      requirement: "Preserve lot linkage from received fish through final packed product, including species or species group, origin, supplier, capture or aquaculture status, incoming state, processing route, and product disposition."
      evidence: "supplier specification; receiving record; batch genealogy; final lot code; codex-cxc-52-2003"
    - id: dq_measurement_control
      applies_to: "mass, water, energy, time, temperature, salinity, moisture, and water activity"
      requirement: "Use calibrated or verified instruments appropriate to the measurement; retain calibration status, reading frequency, missing-data treatment, unit conversion, and the wet/dry/water-phase basis of analytical results."
      evidence: "calibration certificate; meter log; laboratory method; calculation worksheet; codex-cxc-52-2003"
    - id: dq_temporal_representativeness
      applies_to: "reporting period"
      requirement: "Use a representative continuous 12-month period where feasible, or disclose a shorter campaign and seasonality; align numerator and denominator periods and explain shutdowns, atypical lots, and missing periods."
      evidence: "production calendar; meter coverage; batch count; representativeness assessment; eu-pef-2021-2279"
    - id: dq_completeness_balance
      applies_to: "material and utility inventory"
      requirement: "Reconcile received fish, prepared and cured intermediates, final product, retained brine, residues, wastewater, salt, water, and major energy across compatible batch boundaries; investigate unexplained differences instead of forcing closure."
      evidence: "batch mass-balance report; brine balance; utility reconciliation; exception log"
    - id: dq_food_safety_control
      applies_to: "product-specific processing"
      requirement: "Retain the applicable hazard analysis and monitored controls for raw-material suitability, parasites and histamine where relevant, time-temperature conditions, potable water, food-grade salt, brine concentration, hygienic drying, contamination prevention, packaging, and storage."
      evidence: "HACCP or equivalent plan; control-point logs; corrective actions; laboratory tests; codex-cxc-52-2003; codex-cxs-190-1995"
    - id: dq_background_proxies
      applies_to: "upstream datasets"
      requirement: "Document provider, dataset version outside PCR UUID fields, geography, technology, time period, allocation method, and known proxy limitations for incoming fish, utilities, salt, water, packaging, treatment, and transport."
      evidence: "source register; proxy justification; data-quality rating; eu-pef-2021-2279"
    - id: dq_estimate_replacement
      applies_to: "provisional QA ranges"
      requirement: "Treat every reasoned_estimate interval as a replaceable screening flag, not as a default foreground value or industry benchmark; review it against collected data and replace or approve it before publication."
      evidence: "review record; collected distribution; source update"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "Verify exactly one reference product output with UUID b41d734d-e255-404c-b6bb-b2c408f653c6, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and normalized amount 1; packaging and non-product ice must not be included in that mass."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_scope_exclusions
    applies_to: "product category identity"
    rule: "Fail category conformance when smoking, smoke flavouring, or smoke drying is used, or when the output is not an edible fish fillet preserved by drying, salting, or brining."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validation_qualifiers
    applies_to: "dataset metadata"
    rule: "Verify all required qualifiers are present and consistent with process records, especially species, origin, incoming state, on-site filleting, salting route, drying state, final brine treatment, packaging, and storage conditions."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validation_process_coverage
    applies_to: "process inventory"
    rule: "Verify both required processes and every applicable conditional process have inventory rows, batch records, utilities, outputs, wastes, and direct emissions or discharges; an unperformed conditional process must be explicitly declared not applicable."
    source_ids:
      - codex-cxc-52-2003
      - eu-pef-2021-2279
  - rule_id: validation_mass_brine_balance
    applies_to: "batch calculations"
    rule: "Check compatible-state mass balances for receiving, preparation, curing, drying, and packing, plus a separate brine balance; flag missing streams, inconsistent moisture bases, double-counted reused brine, and unexplained differences."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validation_food_safety_evidence
    applies_to: "process controls"
    rule: "Verify product-specific food-safety evidence supports incoming material, time-temperature control, potable water, food-grade salt, brine concentration when applicable, hygienic drying, packaging, and storage; do not infer compliance from a broad QA range."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-190-1995
  - rule_id: validation_allocation
    applies_to: "multi-output and shared processes"
    rule: "Verify subdivision was attempted first, every non-reference output is classified by actual status and destination, the selected physical or economic allocation method is documented, shared utilities use a physical driver where available, and upstream allocation is disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_data_quality
    applies_to: "foreground and background evidence"
    rule: "Verify instrument control, temporal and site coverage, numerator-denominator alignment, batch traceability, completeness reconciliation, background proxy metadata, and estimate-replacement review are present; report missing dimensions as validation findings."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_uuid_review
    applies_to: "non-reference inventory flows"
    rule: "Before publication, require exact Tiangong identity review for every non-reference flow represented by a UUID; never substitute an approximate or semantically incorrect flow merely to fill an identity field."
    source_ids: []
published_dataset_profile:
  dataset_role: "Gate-to-gate foreground production dataset for finished dried, salted, or brined fish fillets not smoked"
  downstream_use: "secondary_dataset; background_dataset after methodology review and publication"
  allowed_use: "Product-specific process modelling when required qualifiers, foreground records, upstream links, allocation, food-safety control evidence, and data-quality disclosures are present"
  excluded_use: "Smoked or smoke-flavoured fish; whole or minced fish; fish livers or roes; frozen-only fillets; substitution for capture or aquaculture production; use of provisional reasoned estimates as verified industry averages"
  required_metadata: "canonical PCR id; reference-flow UUID and unit support; species and origin; raw-material state; salting and drying route; product moisture or water-activity control; retained-brine treatment; packaging; facility geography; reporting period; storage conditions; process coverage; allocation method; upstream dataset identities"
  required_quality_disclosure: "measurement and calibration coverage; batch and temporal completeness; mass and brine reconciliation; HACCP or equivalent control evidence; proxy geography, technology, age, and allocation; cut-offs; missing UUIDs; provisional estimates; uncertainty and known limitations"
  update_trigger: "Change in species mix, source fishery or aquaculture system, raw-material state, filleting yield, salting or brining technology, drying technology or fuel, product moisture specification, packaging, storage regime, co-product destination, allocation, facility geography, or evidence that materially changes the inventory"
data_sources:
  - id: "codex-cxc-52-2003"
    type: "official_guidance"
    reference: "Codex Alimentarius, CXC 52-2003, Code of Practice for Fish and Fishery Products, https://www.fao.org/input/download/standards/10273/CXP_052e.pdf (official text accessed 2026-08-11)"
    used_for: "Product and process scope; definitions of fillets, brining, dry-salting, wet-salting, salting, and drying; receiving, preparation, curing, water and salt, time-temperature, hygienic drying, packaging, storage, HACCP, and quality records"
  - id: "codex-cxs-190-1995"
    type: "standard"
    reference: "Codex Alimentarius, CXS 190-1995, Standard for Quick Frozen Fish Fillets (official standard identifier; applicability limited to incoming quick-frozen fillets)"
    used_for: "Incoming frozen-fillet identity, condition, handling, and quality controls when the raw-material route uses quick-frozen fillets"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on the use of the Environmental Footprint methods, CELEX 32021H2279, https://eur-lex.europa.eu/eli/reco/2021/2279/oj (official text accessed 2026-08-11)"
    used_for: "Reference-flow normalization, foreground and background boundary linkage, allocation hierarchy, shared-process allocation, cut-off disclosure, data quality, proxy documentation, and reporting"
