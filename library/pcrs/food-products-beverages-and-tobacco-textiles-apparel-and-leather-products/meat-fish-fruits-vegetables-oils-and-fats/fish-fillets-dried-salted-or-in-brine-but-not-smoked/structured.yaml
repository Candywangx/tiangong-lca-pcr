measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference finished fish fillets"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground inventory to 1 kg net edible finished product; exclude packaging, transport ice, and drained free brine unless the marketed product definition explicitly includes brine in the sold net quantity."
  - id: incoming_mass_state
    applies_to: "Incoming raw fish or fillets"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record weighed received mass and separately declare whether glaze, surface ice, free liquid, head, skin, bone, or other non-fillet material is included; do not silently convert gross receipt mass to edible fillet mass."
  - id: brine_component_accounting
    applies_to: "Brine preparation and final brine"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record water and food-grade salt as separate inputs. Record retained brine in the sold product separately from spent or discharged brine, and state whether the reference net quantity includes retained brine."
  - id: moisture_and_dry_matter
    applies_to: "Drying and curing"
    required_property_ref:
      name: "Mass; dimensionless fraction"
      uuid: ""
    required_unit: "kg; kg/kg or percent"
    rule: "Use paired wet-basis mass records before and after curing or drying. Declare whether moisture or salt concentration is reported on wet, dry, or water-phase basis and retain the laboratory method."
  - id: energy_conversion
    applies_to: "Refrigeration, pumps, drying, and packaging"
