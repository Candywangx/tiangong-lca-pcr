allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared preparation, freezing, packing, vessel, and storage operations"
    rule: "Avoid allocation where possible by submetering and subdividing lots, equipment, vessel activities, and storage periods so inputs and outputs are directly assigned."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_system_expansion
    applies_to: "Additional co-product functions"
    rule: "Where subdivision is not possible, evaluate system expansion when the substituted function and datasets can be represented consistently; report the expanded-system result transparently."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relationship
    applies_to: "Unresolved multifunctional processes"
    rule: "If subdivision or system expansion is not practicable, use a documented causal physical relationship. Wet mass at the separation point may be used only when no more relevant physical driver is justified, with sensitivity to another functionally relevant property."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_fallback
    applies_to: "Co-products lacking a defensible physical relationship"
    rule: "Use economic allocation only as a fallback; use representative net values at the same market boundary and disclose price source, period, currency, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_no_credit
    applies_to: "Residues, wastewater, packaging waste, and rejected product"
    rule: "Do not allocate product burden to material classified and managed as waste. Include waste-management burdens and disclose any separately modelled avoided-product credit."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_mass_reconciliation
    applies_to: "Fish product, co-products, and wastes"
    rule: "Preserve the unallocated wet-mass balance before allocation and report burden-bearing allocation factors that sum to one."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_mass_identity
      process_id: "receive_prepare_freeze_glaze_pack_store"
      flow_role: "Fish inputs, intermediates, product, co-products, residues, and losses"
      record_type: "Weighing, batch, traceability, and product-specification records"
      raw_fields: "lot_id; species; origin; production_system; presentation; gross_mass; tare_mass; glaze_mass; net_fish_mass; intermediate_mass; co_product_mass; waste_mass; destination"
      collection_method: "Calibrated scales linked to lot genealogy and transfers"
      unit: "kg"
      frequency: "Each lot and transfer"
      temporal_coverage: "At least 12 consecutive representative months or the full seasonal campaign"
      site_scope: "Every included facility, vessel, line, and product route"
      aggregation_rule: "Sum valid masses by lot and process; reconcile transfers and stock change; normalize to accepted net reference product"
      quality_evidence: "Calibration certificates; lot traceability; product specification; mass-reconciliation log"
    - protocol_id: cp_water_ice_records
      process_id: "receive_prepare_freeze_glaze"
      flow_role: "Preparation water, ice, glazing water, and retained glaze"
      record_type: "Meter, tank, issue, batch, and quality records"
      raw_fields: "meter_id; opening_reading; closing_reading; issued_mass; returned_mass; water_source; food_contact_quality; glaze_mass; lot_id"
      collection_method: "Submeter or tank/issue balance linked to the operating period and lot"
      unit: "kg or m3"
      frequency: "Daily and each relevant lot"
      temporal_coverage: "Same representative period as production"
      site_scope: "Each included water and ice system"
      aggregation_rule: "Convert volume using measured or documented density; subtract documented non-process use; report retained glaze separately"
      quality_evidence: "Meter checks; water-quality evidence; issue and batch records; deglazing or equivalent verification"
    - protocol_id: cp_energy_records
      process_id: "receive_prepare_freeze_glaze_pack_store"
      flow_role: "Electricity and direct fuels"
      record_type: "Meter, invoice, fuel, equipment-runtime, and storage-occupancy records"
      raw_fields: "meter_id; readings; fuel_quantity; unit; heating_value_basis; equipment_power; operating_hours; storage_days; occupied_capacity; allocation_key"
      collection_method: "Submeter first; otherwise reconcile invoices or fuel records with equipment operation and physical allocation drivers"
      unit: "kWh, MJ, or purchased fuel unit"
      frequency: "Monthly plus batch or shift submetering where available"
      temporal_coverage: "At least 12 consecutive representative months or full seasonal campaign"
      site_scope: "Each included facility, vessel, freezer, and cold room"
      aggregation_rule: "Assign direct meters; allocate residual shared use by documented physical drivers; normalize to process output"
      quality_evidence: "Calibration; invoices; fuel logs; runtime records; allocation worksheet; energy balance"
    - protocol_id: cp_wastewater_records
      process_id: "receive_prepare"
      flow_role: "Wastewater and entrained solids"
      record_type: "Effluent meter, tank, sampling, and treatment records"
      raw_fields: "discharge_volume; density; solids_mass; treatment_route; sampling_time; process_assignment"
      collection_method: "Meter or tank balance with representative sampling and treatment-route records"
      unit: "kg or m3"
      frequency: "Daily or per discharge event"
      temporal_coverage: "Same representative period as production"
      site_scope: "Each included discharge point"
      aggregation_rule: "Convert volume to mass; retain separately measured solids as distinct flows; normalize to prepared output"
      quality_evidence: "Meter checks; laboratory reports; discharge and treatment manifests"
    - protocol_id: cp_refrigerant_records
      process_id: "freeze_glaze_pack_store"
      flow_role: "Chemical-specific refrigerant loss"
      record_type: "Equipment charge, purchase, service, recovery, and transfer records"
      raw_fields: "refrigerant_id; opening_charge; additions; recovered; transferred; closing_charge; equipment_group; service_date"
      collection_method: "Complete inventory balance by refrigerant and equipment group"
      unit: "kg"
      frequency: "Each service event and period close"
      temporal_coverage: "At least one complete balance covering the production period"
      site_scope: "Each included freezer and cold-storage equipment group"
      aggregation_rule: "Loss = opening + additions - recovered - transferred - closing; allocate by equipment service or cooling-load driver"
      quality_evidence: "Service invoices; cylinder logs; recovery records; signed inventory balance"
    - protocol_id: cp_packaging_records
      process_id: "pack_store"
      flow_role: "Packaging input and waste"
      record_type: "Purchase, issue, bill-of-material, return, reuse, and scrap records"
      raw_fields: "material_id; material_type; issued_mass; returned_mass; scrap_mass; packs_produced; reuse_cycles"
      collection_method: "Mass reconciliation by material and product format"
      unit: "kg"
      frequency: "Each packaging run, aggregated monthly"
      temporal_coverage: "Same representative period as production"
      site_scope: "Each included packing line and format"
      aggregation_rule: "Net input = issued - returned; report scrap separately; allocate reusable packaging by verified use cycles"
      quality_evidence: "Supplier specification; stock reconciliation; reuse evidence; scrap tickets"
    - protocol_id: cp_temperature_food_safety
      process_id: "receive_prepare_freeze_glaze_pack_store"
      flow_role: "Time-temperature control, freezing endpoint, storage, and scombrotoxin controls"
      record_type: "Calibrated probe, logger, hazard-plan, test, and corrective-action records"
      raw_fields: "lot_id; receipt_time; preparation_time; thermal_centre_temperature; storage_temperature; timestamp; excursion_duration; criterion; test_result; corrective_action"
      collection_method: "Validated product-core measurement and continuous or justified interval logging linked to the food-safety plan"
      unit: "°C, time, and declared test unit"
      frequency: "Each lot at critical steps; continuous or justified interval during storage"
      temporal_coverage: "Entire included production and storage period"
      site_scope: "Each included facility, vessel, freezer, cold room, and lot"
      aggregation_rule: "Retain lot minima/maxima, exposure duration, applicable criteria, test results, and disposition; do not average away excursions"
      quality_evidence: "Calibration; logger records; hazard analysis; verification tests; corrective-action and lot-disposition records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "Normalized amount = valid foreground amount / net target frozen fish mass at the declared gate"
      inputs:
        - "Valid flow amount"
        - "net_fish_mass excluding glaze"
        - "free ice"
        - "and packaging"
      output: "Amount per 1 kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: calc_net_fish_mass
      applies_to: "Glazed or iced products"
      rule: "Net target fish mass = gross frozen product mass - verified glaze mass - free ice - packaging tare"
      inputs:
        - gross_mass
        - glaze_mass
        - free_ice_mass
        - packaging_tare
      output: "net_fish_mass"
      source_ids:
        - codex-cxs-190-1995
        - mass-balance-identity
    - id: calc_process_mass_balance
      applies_to: "Preparation, freezing, and packing"
      rule: "Difference = accepted material inputs + opening stock - product - co-products - waste - discharged material - closing stock; investigate rather than force-balance material differences"
      inputs:
        - "Lot and stock masses"
        - "retained water or ice"
        - product
        - co-products
        - waste
        - "wastewater solids"
      output: "Reconciled mass balance and unexplained difference"
      source_ids:
        - mass-balance-identity
    - id: calc_shared_energy
      applies_to: "Shared equipment and storage"
      rule: "Assigned energy = measured shared energy × documented physical allocation driver for the product / total driver"
      inputs:
        - "meter or fuel quantity"
        - runtime
        - "cooling load"
        - throughput
        - "or occupied-capacity driver"
      output: "Assigned kWh, MJ, or fuel quantity"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "Freezing and storage equipment"
      rule: "Refrigerant loss = opening charge + additions - recovered - transferred - closing charge"
      inputs:
        - "Chemical-specific equipment inventory"
      output: "kg refrigerant emitted and allocated to the process"
      source_ids:
        - mass-balance-identity
    - id: calc_physical_allocation
      applies_to: "Joint products"
      rule: "Allocation factor_i = selected causal physical quantity_i / sum of that quantity for all burden-bearing products"
      inputs:
        - "Measured quantities at the separation point"
        - "selected physical property"
      output: "Product-specific factors summing to one"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_economic_allocation
      applies_to: "Economic fallback"
      rule: "Allocation factor_i = representative net value_i / sum of net values for burden-bearing co-products at the same boundary"
      inputs:
        - "Representative prices"
        - "measured co-product quantities"
      output: "Economic factors summing to one"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Fish inputs and finished lots"
      requirement: "Preserve species, accepted market or scientific name, wild-caught or aquaculture system, origin, supplier or vessel, lot links, received state, non-fillet presentation, and product destination."
      evidence: "Supplier or landing records, catch or farm records, lot genealogy, product specification and label"
    - id: dq_temporal_representativeness
      applies_to: "All foreground flows"
      requirement: "Cover at least 12 consecutive representative months or the complete seasonal campaign; disclose shutdowns, missing periods, and extrapolation."
      evidence: "Dated meter, batch, invoice, service, and production records"
    - id: dq_site_route_coverage
      applies_to: "Multi-site, multi-vessel, or multi-route datasets"
      requirement: "Include every site, vessel, and route represented or report production-weighted coverage and exclusions; do not silently extrapolate one route to another."
      evidence: "Site and vessel list, route records, production totals, coverage calculation"
    - id: dq_measurement_control
      applies_to: "Mass, water, ice, energy, refrigerant, and temperature"
      requirement: "Use calibrated or verified instruments, retain raw units and conversions, and document estimation when direct measurement is unavailable."
      evidence: "Calibration, meter checks, conversion worksheet, estimation rationale"
    - id: dq_mass_completeness
      applies_to: "Fish, co-products, residues, glaze, packaging, and stock"
      requirement: "Reconcile major inputs, outputs, and stock changes; investigate unexplained differences and preserve product and waste destinations."
      evidence: "Process mass balance, stock reconciliation, waste and sales records"
    - id: dq_cold_chain
      applies_to: "Frozen product"
      requirement: "Retain the freezing endpoint, frozen-storage temperature and duration, excursions, actions, and applicable product specification for each included route."
      evidence: "Validated freezing study, probe and logger records, excursion and corrective-action records"
    - id: dq_food_safety_scombrotoxin
      applies_to: "Tuna, skipjack, and bonito lots"
      requirement: "Apply a documented food-safety plan for time-temperature abuse and scombrotoxin or histamine risk, using applicable regulatory or customer criteria; retain tests, disposition, and corrective actions without substituting this PCR for food law."
      evidence: "Hazard analysis, monitoring records, laboratory results, lot disposition, corrective actions"
    - id: dq_upstream_dataset_fit
      applies_to: "Fish and purchased inputs"
      requirement: "Document geography, technology, time, production system, and boundary for each upstream dataset; disclose proxy limitations and any onboard activity already represented."
      evidence: "Dataset metadata, boundary comparison, and data-quality assessment"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require exactly 1 kg net target product linked to flow e51735cd-08ba-4052-bb11-0e5d936b87f2, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, mass unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_category_scope
    applies_to: "Product identity"
    rule: "Require tuna, skipjack, or stripe-bellied bonito in a declared frozen non-fillet presentation; reject records whose product is a fillet, fish meat, liver, roe, fresh or chilled fish, or another preserved form."
    source_ids:
      - unsd-cpc-ver-3-0
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Fail completeness when species, origin, production system, non-fillet presentation, starting condition, route, upstream boundary, freezing endpoint, glazing status, storage regime, processing location, or net-mass basis is missing."
    source_ids:
      - unsd-cpc-ver-3-0
      - codex-cxc-52-2003
  - rule_id: validate_process_coverage
    applies_to: "Foreground inventory"
    rule: "Require receipt and grading, every performed preparation step, freezing, applicable glazing, packing, pre-gate frozen storage, energy, water or ice where used, refrigerant, co-product and waste handling, or an explicit justified zero/not-applicable declaration."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_cold_chain
    applies_to: "Each finished lot"
    rule: "Require the declared freezing endpoint, storage temperature and duration, excursion assessment, and corrective action. If quick-frozen status is claimed, require evidence of -18 °C or colder at the thermal centre after stabilization."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-190-1995
  - rule_id: validate_glaze_net_mass
    applies_to: "Glazed product"
    rule: "Require separately measured glaze and confirm that reference mass excludes glaze, free ice, and packaging; do not infer whole-product conformity with CXS 190-1995."
    source_ids:
      - codex-cxs-190-1995
  - rule_id: validate_mass_balance
    applies_to: "Each aggregation period"
    rule: "Require accepted inputs and stock changes to reconcile with net product, co-products, residues, wastewater solids, glaze or retained water, and losses; report unexplained differences and action."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_food_safety_controls
    applies_to: "Tuna, skipjack, and bonito lots"
    rule: "Require evidence of applicable hygiene, time-temperature, traceability, and scombrotoxin or histamine controls and lot disposition; flag missing or unassessed criteria."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_allocation
    applies_to: "Multifunctional processes"
    rule: "Require a documented subdivision or system-expansion assessment, justified fallback method, factors summing to one, and sensitivity disclosure where allocation may materially affect results."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_temporal_route_coverage
    applies_to: "Foreground dataset"
    rule: "Require declared representative period and site, vessel, and route coverage, with exclusions, missing periods, and extrapolation disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_provisional_ranges
    applies_to: "Candidate QA ranges"
    rule: "Treat every reasoned_estimate range only as a screening flag; do not substitute it for foreground records, and replace or explicitly review it before publication-critical use."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for frozen tuna, skipjack, or stripe-bellied bonito in a declared non-fillet presentation, normalized to 1 kg net product at the declared gate"
  downstream_use: "May serve as a secondary_dataset or background_dataset when species, origin, production system, presentation, route, upstream boundary, geography, technology, storage period, allocation, and data quality fit the study"
  allowed_use: "Cradle-to-gate or downstream product systems requiring a transparent frozen non-fillet tuna, skipjack, or bonito input and preserving declared upstream datasets and qualifiers"
  excluded_use: "Direct representation of fillets, minced or other fish meat, livers, roes, fresh or chilled fish, canned or cooked products, retail or consumer stages, or a different species, origin, presentation, or freezing route without representativeness assessment"
  required_metadata: "PCR id and version; product flow UUID; species; production system; catch area or farm origin; upstream datasets and onboard boundary; presentation; starting condition; freezing technology and endpoint; glazing and net-mass method; processing site or vessel; storage temperature and duration; electricity and fuel supply; refrigerant; co-product destinations; allocation; reference period"
  required_quality_disclosure: "Site, vessel, route, and temporal coverage; mass-balance difference; meter and scale quality; cold-chain and food-safety evidence; upstream proxies; provisional estimates; allocation sensitivity; excluded stages; applicability limits of CXS 190-1995"
  update_trigger: "Material change in species, origin, production system, presentation, onboard boundary, preparation yield, freezing or glazing technology, packaging, energy supply, refrigerant, storage period, co-product market, allocation basis, food-safety requirement, site or vessel coverage, or representative data period"
