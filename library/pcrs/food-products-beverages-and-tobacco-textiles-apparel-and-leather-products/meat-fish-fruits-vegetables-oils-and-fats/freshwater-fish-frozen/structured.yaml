system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground system starts when received freshwater fish crosses the freezing facility boundary. It includes acceptance control, unloading, washing and dressing when performed, freezing, optional glazing, packaging, frozen storage, internal handling, sanitation attributable to included operations, wastewater and residue transfers, refrigerant loss, and treatment activities operated inside the facility. Capital goods are excluded from the default foreground inventory unless material to the declared study or required by an applicable downstream method."
      source_ids: []
    - rule_id: boundary_received_fish_to_gate
      applies_to: "all datasets"
      rule: "Include all attributable foreground operations from receipt of freshwater fish through facility-gate dispatch of the frozen reference product."
      source_ids:
        - codex-cxc-52-2003
        - eu-pef-2021-2279
    - rule_id: boundary_upstream_link
      applies_to: "received fish and other purchased products"
      rule: "Represent production before facility receipt with separate upstream datasets; do not omit it or rebuild it as an undocumented foreground estimate."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_cold_chain
      applies_to: "freezing and storage"
      rule: "Include measured freezing, temperature control, frozen storage, refrigerant losses, and internal handling through the declared gate; disclose duration and temperature basis."
      source_ids:
        - codex-cxc-52-2003
    - rule_id: boundary_cutoff_disclosure
      applies_to: "all excluded flows or operations"
      rule: "Identify and justify exclusions using a materiality assessment; never use lack of data alone as the reason to omit a potentially material flow."
      source_ids:
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "Freshwater fish received at the processing facility with species, wild or farmed origin, supplier/source geography, received form, received mass, temperature state, and upstream dataset reference declared"
  starting_condition_role: "Upstream product input and auditable start of foreground frozen-fish processing"
  product_classification_scope: "Frozen freshwater fish that remain whole or dressed fish; excludes separately classified frozen fillets, fish meat, livers and roes, and other prepared products"
  recursive_input_rule: "A same-category frozen freshwater fish input used for re-freezing, repacking, or blending shall be represented by a separate upstream dataset and identified as such; its previous production shall not be recursively reconstructed inside this foreground system."
  upstream_dataset_requirement: "Link every received fish source to a representative fishing or aquaculture and landing/supply dataset, preserving wild/farmed origin, species, geography, technology, and temporal representativeness."
  disclosure: "Declare included preparation steps, glaze convention, packaging boundary, freezing and storage technology, storage duration, shared-service allocation, excluded operations, and all cut-offs."
