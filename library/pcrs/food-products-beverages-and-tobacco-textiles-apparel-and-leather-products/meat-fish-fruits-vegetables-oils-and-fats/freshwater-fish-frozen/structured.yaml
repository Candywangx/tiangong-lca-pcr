    rule: "Subdivide metered operations or use direct causal assignment before applying allocation. Preserve separate records where a process or utility can be measured independently."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "fish products, saleable by-products, residues, utilities, and shared storage"
    rule: "When allocation cannot be avoided, use a documented physical relationship that reflects the causal use of resources or generation of outputs; mass is not automatic when another physical driver is more causal."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relation
    applies_to: "multi-output operation lacking a defensible physical relation"
    rule: "Use another documented relationship, including economic allocation only where physical causality is not defensible; record values, currency, price period, geography, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_reclassification
    applies_to: "residues and rejected fish"
    rule: "Treat a flow as a co-product only when it has a documented product function and destination; otherwise model the declared waste treatment without assigning an invented credit."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_received_fish
      process_id: "receiving_preparation"
      flow_role: "received freshwater fish"
      record_type: "receiving record"
      raw_fields: "lot_id; supplier; species; wild_or_farmed; source_geography; received_form; temperature_state; gross_mass; accepted_mass; receipt_time"
      collection_method: "calibrated scale and acceptance log"
      unit: "kg; °C; timestamp"
      frequency: "each lot"
      temporal_coverage: "full reporting period"
      site_scope: "all included receiving points"
      aggregation_rule: "sum accepted mass by declared product and origin; retain excluded-lot records"
      quality_evidence: "scale calibration; supplier document; lot traceability; temperature record"
    - protocol_id: cp_water_records
      process_id: "receiving_preparation"
      flow_role: "process and sanitation water"
      record_type: "meter or utility record"
      raw_fields: "meter_id; opening_reading; closing_reading; period; shared_users; allocation_driver"
      collection_method: "dedicated meter or reconciled facility water balance"
      unit: "kg or m3 with measured conversion basis"
      frequency: "meter interval and at least monthly"
      temporal_coverage: "full reporting period"
      site_scope: "included preparation and sanitation areas"
      aggregation_rule: "subtract unrelated use and allocate shared use by documented causal driver"
      quality_evidence: "meter calibration; utility invoice; reconciliation"
    - protocol_id: cp_prepared_transfer
      process_id: "receiving_preparation"
      flow_role: "prepared fish transfer"
      record_type: "batch mass-balance record"
      raw_fields: "lot_id; accepted_mass; transfer_mass; residue_mass; wastewater_mass; inventory_change; timestamp"
      collection_method: "calibrated scale and batch reconciliation"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "full reporting period"
      site_scope: "all included preparation lines"
      aggregation_rule: "sum transfer mass and reconcile unexplained difference by lot"
      quality_evidence: "scale calibration; signed batch sheet; balance exception log"
    - protocol_id: cp_residue_records
      process_id: "receiving_preparation"
      flow_role: "residues and rejects"
      record_type: "waste or by-product dispatch record"
      raw_fields: "lot_id; material_type; mass; destination; product_or_waste_status; dispatch_reference"
      collection_method: "calibrated scale and destination document"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "full reporting period"
      site_scope: "all included preparation lines"
      aggregation_rule: "sum separately by material, status, and destination"
      quality_evidence: "scale calibration; invoice or waste transfer note"
    - protocol_id: cp_wastewater_records
      process_id: "receiving_preparation"
      flow_role: "wastewater to treatment"
      record_type: "meter or water-balance record"
      raw_fields: "meter_reading; water_input; retained_water; residue_water; discharge_or_transfer; treatment_route"
      collection_method: "dedicated meter or reconciled water balance"
      unit: "kg or m3 with measured conversion basis"
      frequency: "meter interval and at least monthly"
      temporal_coverage: "full reporting period"
      site_scope: "all included process drains"
      aggregation_rule: "sum by treatment route and reconcile to attributable water input"
      quality_evidence: "meter calibration; sampling or transfer record; reconciliation"
    - protocol_id: cp_energy_records
      process_id: "freezing_glazing"
      flow_role: "freezing electricity"
      record_type: "electricity meter record"
      raw_fields: "meter_id; opening_reading; closing_reading; period; frozen_output; shared_loads; allocation_driver"
      collection_method: "dedicated submeter or documented allocation from facility meter"
      unit: "kWh"
      frequency: "meter interval and at least monthly"
      temporal_coverage: "full reporting period"
      site_scope: "included freezing equipment and auxiliaries"
      aggregation_rule: "subtract separately metered loads and divide attributable kWh by frozen transfer output"
      quality_evidence: "meter calibration; invoice; allocation worksheet"
    - protocol_id: cp_glaze_records
      process_id: "freezing_glazing"
      flow_role: "retained glaze"
      record_type: "batch mass record"
      raw_fields: "lot_id; pre_glaze_mass; post_glaze_mass; supplied_water; nonretained_water; glaze_convention"
      collection_method: "calibrated scale and batch water record"
      unit: "kg"
      frequency: "each glazed batch"
      temporal_coverage: "full reporting period"
      site_scope: "all glazing lines"
      aggregation_rule: "retained glaze = post-glaze mass - pre-glaze mass, cross-checked against water balance"
      quality_evidence: "scale calibration; batch record; glaze convention approval"
    - protocol_id: cp_refrigerant_records
      process_id: "freezing_glazing"
      flow_role: "refrigerant makeup and emission"
      record_type: "equipment service and inventory record"
      raw_fields: "equipment_id; refrigerant_type; opening_charge; additions; recoveries; transfers; closing_charge; service_date; process_assignment"
      collection_method: "service log and refrigerant inventory reconciliation"
      unit: "kg"
      frequency: "each service event and annual reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "all included freezing and storage equipment, separately assigned where possible"
      aggregation_rule: "loss = opening charge + additions - recoveries - transfers - closing charge; allocate only shared equipment"
      quality_evidence: "technician record; purchase record; charge reconciliation"
    - protocol_id: cp_frozen_transfer
      process_id: "freezing_glazing"
      flow_role: "frozen intermediate transfer"
      record_type: "batch transfer record"
      raw_fields: "lot_id; prefreeze_mass; retained_glaze; reject_mass; frozen_transfer_mass; inventory_change; temperature; timestamp"
      collection_method: "calibrated scale and transfer log"
      unit: "kg; °C; timestamp"
      frequency: "each batch"
      temporal_coverage: "full reporting period"
      site_scope: "all freezing lines"
      aggregation_rule: "sum transfers on declared glaze basis and reconcile batch balance"
      quality_evidence: "scale calibration; lot traceability; temperature record"
    - protocol_id: cp_packaging_records
      process_id: "packaging_storage"
      flow_role: "packaging input and waste"
      record_type: "bill of material and issue record"
      raw_fields: "packaging_material; issued_mass; returned_mass; scrap_mass; packed_output; reusable_cycles"
      collection_method: "scale, procurement record, and production issue record"
      unit: "kg; count where converted by measured unit mass"
      frequency: "each lot and reporting-period reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "all included packing lines"
      aggregation_rule: "net packaging input = issued - returned; separate scrap and reusable allocation"
      quality_evidence: "supplier specification; scale calibration; reconciliation"
    - protocol_id: cp_storage_records
      process_id: "packaging_storage"
      flow_role: "frozen storage and dispatch"
      record_type: "meter and warehouse record"
      raw_fields: "meter_id; electricity; lot_id; entry_time; dispatch_time; stored_mass; storage_temperature; shared_users; allocation_driver"
      collection_method: "electricity meter plus warehouse management record"
      unit: "kWh; kg; °C; timestamp"
      frequency: "meter interval and each lot movement"
      temporal_coverage: "full reporting period"
      site_scope: "all included frozen rooms and dispatch points"
      aggregation_rule: "allocate shared electricity by documented causal driver and calculate lot-weighted storage days"
      quality_evidence: "meter calibration; temperature log; inventory reconciliation; dispatch record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = attributable reporting-period amount / net frozen freshwater fish reference output"
      inputs:
        - "attributable amount"
        - "net reference output"
      output: "amount per 1 kg reference product"
      source_ids:
        - reference-mass-identity
        - eu-pef-2021-2279
    - id: calc_preparation_balance
      applies_to: "receiving_preparation"
      rule: "accepted fish + attributable water = prepared transfer + residues + wastewater transfer + retained water + inventory change + documented balance difference"
      inputs:
        - "accepted mass"
        - water
        - transfer
        - residues
        - wastewater
        - "inventory change"
      output: "reconciled preparation mass balance"
      source_ids:
        - reference-mass-identity
        - codex-cxc-52-2003
    - id: calc_glaze_mass
      applies_to: "glazed product only"
      rule: "retained glaze mass = post-glaze mass - pre-glaze mass; cross-check against supplied and non-retained water"
      inputs:
        - "pre-glaze mass"
        - "post-glaze mass"
        - "water records"
      output: "kg retained glaze and declared inclusion in product mass"
      source_ids:
        - reference-mass-identity
        - codex-cxc-52-2003
    - id: calc_refrigerant_loss
      applies_to: "freezing and storage equipment"
      rule: "loss = opening charge + additions - recoveries - transfers - closing charge; allocate shared loss by documented equipment driver"
      inputs:
        - "charge and service inventory"
        - "equipment assignment"
      output: "kg refrigerant emitted by process"
      source_ids:
        - reference-mass-identity
        - eu-pef-2021-2279
    - id: calc_storage_duration
      applies_to: "frozen storage"
      rule: "lot-weighted storage days = sum(lot mass × elapsed days) / sum(dispatched lot mass)"
      inputs:
        - "entry time"
        - "dispatch time"
        - "lot mass"
      output: "day"
      source_ids:
        - reference-mass-identity
    - id: calc_packaging_mass
      applies_to: "packaging"
      rule: "net packaging input = issued mass - returned unused mass; reusable packaging burden uses documented lifetime cycles and losses"
      inputs:
        - issue
        - return
        - scrap
        - reuse-cycle
        - "and output records"
      output: "kg packaging and kg scrap per reference product"
      source_ids:
        - reference-mass-identity
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and received fish"
      requirement: "Preserve species or species group, wild/farmed origin, source geography, dressing state, glaze convention, packaging, and lot traceability; do not substitute a fillet, fish-meat, or marine-fish identity."
      evidence: "product specification; supplier record; lot record; unsd-cpc-3-0-21211; codex-cxs-190-1995"
    - id: dq_measurement
      applies_to: "mass, energy, water, temperature, and time"
      requirement: "Use calibrated or verified measurement systems; document conversions, shared-meter allocation, missing readings, and balance exceptions."
      evidence: "calibration record; meter record; calculation worksheet; eu-pef-2021-2279"
    - id: dq_temporal
      applies_to: "all foreground activity"
      requirement: "Cover a representative operating period including seasonal production and storage variation, or disclose limitations and justify extrapolation."
      evidence: "reporting-period completeness record; production schedule; eu-pef-2021-2279"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Reconcile production, inventory, utilities, packaging, residues, wastewater, refrigerant, and dispatch records; investigate material unexplained differences."
      evidence: "mass and energy reconciliation; exception log; eu-pef-2021-2279"
    - id: dq_representativeness
      applies_to: "downstream use"
      requirement: "Assess technological, geographical, temporal, and product representativeness against the declared frozen-fish system and disclose deviations."
      evidence: "representativeness assessment; metadata record; eu-pef-2021-2279"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Confirm exactly one reference output uses UUID 1c2a109f-6b9a-47eb-88a7-232025a03c81, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and amount 1 kg."
    source_ids:
      - reference-mass-identity
  - rule_id: validate_scope_identity
    applies_to: "product metadata"
    rule: "Confirm freshwater species or species group, wild/farmed origin, whole or dressing state, glaze convention, packaging, and upstream dataset are declared, and reject fillet, separated fish-meat, liver/roe, marine-fish, or other preserved-product substitutions."
    source_ids:
      - unsd-cpc-3-0-21211
      - codex-cxs-190-1995
  - rule_id: validate_process_coverage
    applies_to: "process map and inventory"
    rule: "Confirm receipt/preparation, freezing, optional glazing where used, packaging, frozen storage, sanitation, residues, wastewater, refrigerant, and dispatch are recorded or explicitly justified as not applicable."
    source_ids:
      - codex-cxc-52-2003
      - eu-pef-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "each lot and reporting period"
    rule: "Reconcile fish, retained glaze, packaging, residues, wastewater, and inventory change on the declared mass basis; flag unexplained differences for review rather than forcing balance."
    source_ids:
      - reference-mass-identity
      - eu-pef-2021-2279
  - rule_id: validate_energy_and_cold_storage
    applies_to: "freezing and storage"
    rule: "Confirm freezing and storage energy are not double counted, storage duration and temperature are declared, and shared loads use a documented allocation driver."
    source_ids:
      - codex-cxc-52-2003
      - eu-pef-2021-2279
  - rule_id: validate_provisional_ranges
    applies_to: "all reasoned_estimate ranges"
    rule: "Treat broad provisional ranges as screening aids only; a value outside them requires investigation, not automatic rejection, and reviewed evidence shall replace them before publication-critical use."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "multi-output and shared operations"
    rule: "Confirm subdivision or direct assignment was attempted first and every remaining allocation method, factor, and sensitivity is disclosed."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production dataset for processing freshwater fish into frozen whole or dressed fish at the declared facility gate"
  downstream_use: "May be published as a secondary_dataset or background_dataset for product LCAs and lifecycle models when the declared qualifiers and representativeness conditions are met"
  allowed_use: "Frozen freshwater fish studies with representative species, origin, dressing state, upstream production, facility technology, glaze convention, packaging, storage duration, geography, time period, and allocation"
  excluded_use: "Direct representation of fishing or aquaculture; live/fresh/chilled fish; frozen fillets or separated fish meat; marine fish; other preserved products; downstream distribution, retail, cooking, consumption, or end-of-life without additional datasets"
  required_metadata: "PCR id; dataset version; reference-flow UUID; species; wild/farmed origin; upstream dataset; received and final product state; dressing state; glaze convention; packaging; facility geography; technology; storage temperature and duration; reporting period; allocation; cut-offs; data sources"
  required_quality_disclosure: "Primary-data share; measurement and calibration coverage; mass/energy reconciliation; missing-data treatment; technological, geographical, and temporal representativeness; allocation sensitivity; unresolved UUIDs; replacement status of provisional ranges"
  update_trigger: "Material change in species mix, origin, dressing or glaze convention, freezing/storage technology, packaging, facility, energy supply, refrigerant, allocation, reporting period, official classification scope, source guidance, or verified Tiangong identity"
data_sources:
  - id: "unsd-cpc-3-0-21211"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 explanatory notes, subclass 21211 Freshwater fish, frozen, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-11)"
    used_for: "Product-category scope, included freshwater-fish forms, and exclusions for fillets and fish meat"
  - id: "codex-cxc-52-2003"
    type: "standard"
    reference: "Codex Alimentarius, Code of Practice for Fish and Fishery Products, CXC 52-2003, https://www.fao.org/input/download/standards/10273/CXP_052e.pdf (retrieved 2026-08-11)"
    used_for: "Process decomposition, receiving and hygiene controls, freezing, glazing, packaging, storage, temperature records, and traceability"
  - id: "codex-cxs-190-1995"
    type: "standard"
    reference: "Codex Alimentarius, Standard for Quick-Frozen Fish Fillets, CXS 190-1995, https://www.fao.org/input/download/standards/115/CXS_190e.pdf (retrieved 2026-08-11)"
    used_for: "Definition used only to distinguish and exclude fish fillets from this whole/dressed-fish PCR; not used to extend fillet requirements to CPC 21211"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on the use of the Environmental Footprint methods, CELEX 32021H2279, http://data.europa.eu/eli/reco/2021/2279/oj (retrieved 2026-08-11)"
    used_for: "System-boundary completeness, materiality, allocation hierarchy, packaging and energy modelling, data quality, representativeness, and disclosure"
  - id: "reference-mass-identity"
    type: "method_factor"
    reference: "PCR reference-flow and conservation identity: all attributable inventory quantities are normalized to the declared 1 kg net reference output and mass balances preserve measured inputs, outputs, and inventory change"
    used_for: "Reference normalization, mass balances, glaze, packaging, storage-duration, and refrigerant-inventory calculations"
