allocation_rules:
  - rule_id: allocation_route_subdivision
    applies_to: "all route inventories"
    rule: "Subdivide preparation and each preservation route using batch, meter, and material-issue records wherever possible. Do not average non-selected preservation routes into one foreground inventory."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residue_outputs
    applies_to: "shells, edible offcuts, recovered salt/brine, or other valuable outputs"
    rule: "First apply subdivision or a directly measured physical relationship. If allocation remains necessary, document the chosen physical or economic driver, allocation factors, data period, and sensitivity; wastes without economic product status receive no product allocation."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_preparation_batch
      process_id: "prepare_oysters"
      flow_role: "receipt, water, prepared mass, residues"
      record_type: "batch production and utility records"
      raw_fields: "received mass; presentation; accepted mass; prepared transfer mass; water meter/volume; shell and reject mass; lot time-temperature"
      collection_method: "calibrated scales, water meter or documented batch volume, and residue weighing or closed mass balance"
      unit: "kg"
      frequency: "each production lot"
      temporal_coverage: "representative production period, with season disclosed"
      site_scope: "each facility and preparation line"
      aggregation_rule: "sum lot inputs/outputs; normalize to measured prepared transfer mass; keep shell/presentation strata separate"
      quality_evidence: "calibration, lot traceability, water suitability, acceptance and sanitation records"
    - protocol_id: cp_freezing_batch
      process_id: "freeze_and_pack"
