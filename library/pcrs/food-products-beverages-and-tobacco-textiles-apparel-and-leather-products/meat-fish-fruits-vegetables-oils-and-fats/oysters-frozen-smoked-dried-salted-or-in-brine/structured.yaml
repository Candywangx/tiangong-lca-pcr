  calculation_rules:
    - id: calc_reference_mass
      applies_to: "route output"
      rule: "Net reference product mass = gross filled unit mass minus packaging mass minus free packing medium; brined product uses the declared drained-mass result and frozen product follows the declared glaze treatment"
      inputs:
        - "gross mass"
        - "packaging mass"
        - "free medium mass"
        - "drained mass or deglazed mass as applicable"
      output: "kg qualified reference product"
