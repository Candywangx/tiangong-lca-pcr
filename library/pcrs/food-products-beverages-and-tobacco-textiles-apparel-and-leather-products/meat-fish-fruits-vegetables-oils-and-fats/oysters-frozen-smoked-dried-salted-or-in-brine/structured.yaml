        - eu-pef-2021-2279
    - id: calc_route_yield
      applies_to: "each selected route"
      rule: "Route yield = qualified saleable output mass divided by prepared oyster input mass; do not pool different presentation, moisture, salt, glaze, or drained-mass bases"
      inputs:
