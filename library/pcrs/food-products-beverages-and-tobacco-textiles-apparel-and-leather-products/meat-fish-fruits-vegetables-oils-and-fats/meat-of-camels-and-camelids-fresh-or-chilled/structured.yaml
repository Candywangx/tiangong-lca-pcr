system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "foreground slaughterhouse"
      rule: "Include applicable reception, stunning, slaughter, bleeding, dressing, evisceration, inspection, chilling, cutting, packaging, sanitation, refrigeration, wastewater, direct waste, and emission operations."
      source_ids:
        - jrc-sa-bref-2024
    - rule_id: boundary_rule_2
      applies_to: "category scope"
      rule: "Require camel or camelid meat in fresh or chilled state; frozen meat and offal are outside the reference-product scope."
      source_ids:
        - un-cpc-3-0
    - rule_id: boundary_rule_3
      applies_to: "upstream boundary"
      rule: "Keep animal rearing and inbound transport outside the slaughterhouse foreground and connect them through traceable upstream datasets."
      source_ids:
        - ec-pef-method-2021
    - rule_id: boundary_rule_4
      applies_to: "downstream boundary"
      rule: "Exclude distribution, retail, cooking, consumption, and end-of-life unless a downstream lifecyclemodel adds them transparently without double counting."
      source_ids:
        - ec-pef-method-2021
    - rule_id: boundary_rule_5
      applies_to: "co-products and wastes"
      rule: "Keep blood, hide, fat, each edible organ, inedible viscera, bones, digestive contents, condemned material, wastewater, sludge, and packaging waste individually visible with destination and status."
      source_ids:
        - jrc-sa-bref-2024
    - rule_id: boundary_rule_6
      applies_to: "completeness"
      rule: "Record all applicable raw materials, energy, products, co-products, wastes, and direct emissions to air and water; unresolved UUIDs do not justify omission."
      source_ids:
        - ec-pef-method-2021
