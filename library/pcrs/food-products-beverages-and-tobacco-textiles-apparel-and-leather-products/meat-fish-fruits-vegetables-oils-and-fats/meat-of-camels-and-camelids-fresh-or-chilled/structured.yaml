allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground processes"
    rule: "Avoid allocation by separate metering, batch tracing, process subdivision, and direct mass assignment whenever records permit."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_rule_2
    applies_to: "edible and non-edible outputs"
    rule: "Record mass, legal or food status, destination, and revenue for reference meat, each edible organ, blood, hide, fat, bones, viscera, and condemned material before allocation."
    source_ids:
      - jrc-sa-bref-2024
      - ec-pef-method-2021
  - rule_id: allocation_rule_3
    applies_to: "physically attributable burdens"
    rule: "Assign operations and resources directly when a physical causal relationship is documented, such as cutting energy to the actual cut route or packaging to packed meat."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_rule_4
    applies_to: "residual multifunctionality"
    rule: "When subdivision and physical causality cannot resolve multifunctionality, use a documented PEF-consistent allocation basis supported by contemporaneous market values; disclose prices, averaging period, shares, and sensitivity."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_rule_5
    applies_to: "waste and recovery"
    rule: "Keep gross inputs, internal recovery, exported co-products, wastes, and final outputs visible; do not apply avoided-burden credits unless a downstream model explicitly requires them."
    source_ids:
      - ec-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_p1_reception_records
      process_id: "p1_reception_stunning"
      flow_role: "live animals, utilities, manure, bedding, mortalities, emissions"
      record_type: "receipt; scale; lairage; fuel and meter logs"
      raw_fields: "species; lot; count; live_mass; receipt_time; water; electricity; diesel; manure; bedding; mortality"
      collection_method: "Match accepted animals and reception records to stunned-animal output."
      unit: "kg; count; m3; kWh; MJ"
      frequency: "receipt and shift"
      temporal_coverage: "representative declared period"
      site_scope: "all reception/stunning areas"
      aggregation_rule: "Aggregate by species/class and reconcile count/mass."
      quality_evidence: "calibrated scale; traceability; meters"
    - protocol_id: cp_p2_slaughter_records
      process_id: "p2_slaughter_dressing"
      flow_role: "animal, utilities, carcass, co-products, waste, wastewater, emissions"
      record_type: "slaughter lot; scales; inspection; transfers"
      raw_fields: "lot; count; live_mass; hot_mass; each_output_mass; destination; utilities; wastewater; emission activity"
      collection_method: "Link each lot to carcass, every co-product, condemnation, and utility record."
      unit: "kg; count; m3; kWh; MJ"
      frequency: "lot and shift"
      temporal_coverage: "representative declared period"
      site_scope: "all slaughter/dressing lines"
      aggregation_rule: "Reconcile lot mass before normalization."
      quality_evidence: "calibrated scales/meters; inspection; receipts; balance"
    - protocol_id: cp_p3_chilling_records
      process_id: "p3_carcass_chilling"
      flow_role: "carcass, refrigeration, water, rejects, wastewater, emissions"
      record_type: "scales; temperature; meter; service"
      raw_fields: "lot; hot_mass; chilled_mass; time; temperature; electricity; water; refrigerant; reject; wastewater"
      collection_method: "Match mass and temperature history to refrigeration records."
      unit: "kg; Celsius; kWh; m3"
      frequency: "lot and continuous temperature"
      temporal_coverage: "representative declared period"
      site_scope: "all chill rooms"
      aggregation_rule: "Normalize to accepted chilled mass."
      quality_evidence: "scale; logger; meter; service record"
    - protocol_id: cp_p4_cutting_records
      process_id: "p4_cutting_deboning"
      flow_role: "carcass, utilities, meat, bones, fat, rejects, wastewater"
      record_type: "cutting lot; cut sheet; scales; meters"
      raw_fields: "lot; input; cuts; bones; fat; condemned; water; electricity; wastewater"
      collection_method: "Reconcile each cutting lot by form and bone status."
      unit: "kg; kWh; m3"
      frequency: "lot and shift"
      temporal_coverage: "representative declared period"
      site_scope: "all cutting rooms"
      aggregation_rule: "Aggregate compatible cuts after lot balance."
      quality_evidence: "scales/meters; cut sheet; inspection"
    - protocol_id: cp_p5_packaging_records
      process_id: "p5_packaging_storage"
      flow_role: "meat, refrigeration, packaging, reject, waste, reference output"
      record_type: "packing lot; scale; specs; cold-store meters"
      raw_fields: "lot; product_form; net_mass; each_packaging_mass; accepted; reject; electricity; refrigerant; temperature"
      collection_method: "Match packed lot and cold-store records to accepted net output."
      unit: "kg; kWh; Celsius"
      frequency: "lot and continuous temperature"
      temporal_coverage: "representative declared period"
      site_scope: "all packing/cold storage"
      aggregation_rule: "Normalize to exactly 1 kg net meat."
      quality_evidence: "scale; specs; logger; service record"
    - protocol_id: cp_p6_sanitation_records
      process_id: "p6_cleaning_sanitation"
      flow_role: "water, heat, utilities, chemicals, wastewater"
      record_type: "schedule; chemical issue; meters; concentration"
      raw_fields: "area; cycle; water; hot_water; steam; electricity; gas; each solution; concentration; wastewater"
      collection_method: "Match sanitation cycles to serviced areas and lots."
      unit: "kg; m3; kWh; MJ"
      frequency: "sanitation cycle"
      temporal_coverage: "representative declared period"
      site_scope: "all serviced areas"
      aggregation_rule: "Calculate active chemical mass and allocate by verified cleaning driver."
      quality_evidence: "sign-off; SDS; concentration; meters"
    - protocol_id: cp_p7_wastewater_records
      process_id: "p7_wastewater_treatment"
      flow_role: "wastewater, chemicals, electricity, effluent, screenings, sludge, water emissions"
      record_type: "flow meter; treatment log; issue; samples"
      raw_fields: "source; volume; electricity; chemical; effluent; screenings; sludge; COD; N; P; TSS"
      collection_method: "Keep source streams separate and reconcile treatment output and loads."
      unit: "m3; kg; kWh"
      frequency: "continuous flow and sampling"
      temporal_coverage: "representative declared period"
      site_scope: "on-site treatment"
      aggregation_rule: "Calculate loads from matched flow/concentration."
      quality_evidence: "calibration; lab QA; custody; balance"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all exchanges"
      rule: "normalized exchange = period exchange × attribution share ÷ accepted net reference-meat mass"
      inputs:
        - exchange
        - share
        - mass
      output: "exchange per kg"
      source_ids:
        - ec-pef-method-2021
    - id: calc_slaughter_mass_balance
      applies_to: "slaughter"
      rule: "live input = carcass + each co-product + each waste + process mass change + residual"
      inputs:
        - "input/output masses"
      output: "balance and residual"
      source_ids:
        - jrc-sa-bref-2024
    - id: calc_chilling_loss
      applies_to: "chilling"
      rule: "mass change = hot carcass mass − chilled carcass mass by matched lot/time"
      inputs:
        - "hot and chilled mass"
      output: "kg change"
      source_ids:
        - jrc-sa-bref-2024
    - id: calc_cutting_balance
      applies_to: "cutting"
      rule: "chilled carcass = unpacked meat + bones + fat + condemned meat + residual"
      inputs:
        - "input/output masses"
      output: "cutting balance"
      source_ids:
        - jrc-sa-bref-2024
    - id: calc_shared_utilities
      applies_to: "shared utilities"
      rule: "allocated utility = complete total × documented meter, runtime/load, area, or throughput share"
      inputs:
        - total
        - driver
      output: "utility by process"
      source_ids:
        - ec-pef-method-2021
    - id: calc_fuel_energy
      applies_to: "individual fuels"
      rule: "energy = measured fuel × documented net calorific value"
      inputs:
        - fuel
        - factor
      output: "MJ"
      source_ids:
        - ec-pef-method-2021
    - id: calc_refrigerant_loss
      applies_to: "individual refrigerants"
      rule: "loss = opening + purchases − closing − recovered − transfers"
      inputs:
        - "stock/service records"
      output: "kg loss"
      source_ids:
        - ec-pef-method-2021
    - id: calc_active_chemical
      applies_to: "individual chemicals"
      rule: "active mass = solution mass × documented active concentration"
      inputs:
        - solution
        - concentration
      output: "kg active"
      source_ids:
        - jrc-sa-bref-2024
    - id: calc_effluent_load
      applies_to: "individual water emissions"
      rule: "load = matched effluent volume × representative concentration with unit conversion"
      inputs:
        - volume
        - concentration
      output: "kg to water"
      source_ids:
        - jrc-sa-bref-2024
    - id: calc_economic_allocation
      applies_to: "residual co-product allocation"
      rule: "share = revenue of named output ÷ total contemporaneous revenue of allocated outputs"
      inputs:
        - mass
        - price
        - period
      output: "burden share"
      source_ids:
        - ec-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "animals and product"
      requirement: "Preserve species, lot, slaughter identity, product form, temperature, inspection status, and verified reference UUIDs; keep other UUID gaps explicit."
      evidence: "traceability; specification; manifest"
    - id: dq_mass_balance
      applies_to: "slaughter and cutting"
      requirement: "Reconcile live mass, hot/chilled carcass, meat, each co-product, each waste, mass change, and residual."
      evidence: "scales; lot balance"
    - id: dq_temperature
      applies_to: "chilled product"
      requirement: "Retain temperature records and evidence that reference meat was not frozen."
      evidence: "calibrated logger; release record"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Use one representative declared period and disclose atypical operations and seasonal limits."
      evidence: "logs; register"
    - id: dq_measurement
      applies_to: "measured/calculated flows"
      requirement: "Retain boundary, calibration, concentration, sampling, conversion, drivers, and limitations."
      evidence: "meter map; certificates; lab reports"
    - id: dq_completeness
      applies_to: "LCI"
      requirement: "Cover applicable materials, energy, products, co-products, wastes, and air/water releases; explain exclusions."
      evidence: "checklist; balances"
    - id: dq_destination
      applies_to: "outputs"
      requirement: "Record food status, disposition, treatment, sale, reuse, or disposal for every named output."
      evidence: "inspection; transfers"
    - id: dq_transparency
      applies_to: "publication"
      requirement: "Disclose boundary, allocation, prices, datasets, gaps, UUID gaps, exclusions, uncertainty, and verification."
      evidence: "report; review"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference identity"
    rule: "Require exactly the verified product-flow, Mass-property, Units-of-mass UUIDs, and kg."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "scope"
    rule: "Require camel or camelid meat in fresh or chilled state; reject frozen meat and offal as reference product."
    source_ids:
      - un-cpc-3-0
  - rule_id: validation_rule_3
    applies_to: "reference amount"
    rule: "Require exactly 1 kg accepted net meat and separate packaging and co-products."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validation_rule_4
    applies_to: "process coverage"
    rule: "Include actual reception, slaughter, dressing, chilling, cutting, packaging, sanitation, refrigeration, wastewater, waste, and emissions."
    source_ids:
      - jrc-sa-bref-2024
  - rule_id: validation_rule_5
    applies_to: "atomic inventory"
    rule: "Reject collection labels and combined utilities, fuels, refrigerants, chemicals, packaging, co-products, wastes, or emissions."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "balances"
    rule: "Require compatible slaughter, chilling, and cutting balances with disclosed residuals."
    source_ids:
      - jrc-sa-bref-2024
  - rule_id: validation_rule_7
    applies_to: "allocation"
    rule: "Verify subdivision, assignments, basis, totals, shares, prices, period, and sensitivity."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validation_rule_8
    applies_to: "temperature"
    rule: "Require point, criterion, monitoring, release status, and confirmation product was not frozen."
    source_ids:
      - un-cpc-3-0
      - jrc-sa-bref-2024
  - rule_id: validation_rule_9
    applies_to: "wastewater"
    rule: "Require each source stream, boundary, volume, sampling basis, and separate pollutant loads."
    source_ids:
      - jrc-sa-bref-2024
  - rule_id: validation_rule_10
    applies_to: "evidence gaps"
    rule: "Reject invented quantities and unconfirmed UUIDs; keep absent values as collection requirements."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validation_rule_11
    applies_to: "double counting"
    rule: "Do not duplicate rearing, inbound transport, upstream materials, external waste treatment, or downstream stages."
    source_ids:
      - ec-pef-method-2021
published_dataset_profile:
  dataset_role: "Foreground slaughtering and processing dataset for fresh or chilled camelid meat."
  downstream_use: "May be used as a secondary_dataset or background_dataset after all gates pass."
