allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "separately_metered_processes"
    rule: "First avoid allocation by subdividing slaughter, cutting, chilling, wastewater treatment, and packaging when their inputs and outputs are separately measured."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_mass_balance
    applies_to: "all_material_outputs"
    rule: "Reconcile live mass and each process transfer against reference meat, blood, hide, liver, heart, fat, bones, wastes, stock change, moisture change, and measured losses before allocating burdens."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-recommendation-2021-2279
  - rule_id: allocation_co_products
    applies_to: "blood_hide_organs_fat_bones"
    rule: "When subdivision cannot isolate burdens, apply and disclose a product-specific physical causal relation; if no defensible physical relation exists, use documented economic allocation with matching-period prices and sensitivity disclosure."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_waste_status
    applies_to: "waste_and_recovered_outputs"
    rule: "Classify each output as product, waste, or emission from its actual legal and operational destination; revenue or avoided treatment alone does not justify silently changing flow type."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-recommendation-2021-2279
  - rule_id: allocation_shared_utilities
    applies_to: "shared_meters"
    rule: "Allocate shared utilities using a documented causal driver such as equipment submetering, operating time and rated load, treated volume, or refrigerated mass-time; disclose residual unallocated use."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-recommendation-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_live_animal_receipts
      process_id: "animal_receiving_slaughter_and_dressing"
      flow_role: "live buffalo"
      record_type: "weighbridge ticket and animal receipt"
      raw_fields: "batch id; species; animal count; origin; supplier; arrival time; gross, tare, and net mass; calibration id"
      collection_method: "Reconcile calibrated scale tickets to animal-receipt and acceptance records"
      unit: "kg"
      frequency: "each received lot"
      temporal_coverage: "complete reporting period"
      site_scope: "receiving area"
      aggregation_rule: "Sum accepted net live mass by lot; retain rejected or dead-on-arrival animals separately"
      quality_evidence: "scale calibration; signed receipt; animal identity and health acceptance"
    - protocol_id: cp_slaughter_utility_records
      process_id: "animal_receiving_slaughter_and_dressing"
      flow_role: "water, electricity, steam, and hot water"
      record_type: "meters, supplier invoices, and operating logs"
      raw_fields: "meter id; opening and closing readings; timestamps; pressure; temperatures; condensate state; production hours"
      collection_method: "Use dedicated meters where available; otherwise calculate from documented shared-meter drivers"
      unit: "kg; kWh; MJ"
      frequency: "daily or batch"
      temporal_coverage: "representative full production period"
      site_scope: "slaughter and dressing area"
      aggregation_rule: "Subtract non-production use and normalize to accepted carcass transfer mass"
      quality_evidence: "meter calibration; invoices; boundary diagram; allocation calculation"
    - protocol_id: cp_slaughter_fuel_records
      process_id: "animal_receiving_slaughter_and_dressing"
      flow_role: "natural gas, diesel, and LPG"
