      record_type: "calibrated scales and transfer records"
      raw_fields: "batch id; output identity; gross; tare; net mass; acceptance status; destination; timestamp"
      collection_method: "Weigh each separately managed output and reconcile with received live mass"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete reporting period"
      site_scope: "slaughter and dressing line"
      aggregation_rule: "Sum accepted output by identity; retain stock and moisture changes separately"
      quality_evidence: "scale calibration; transfer ticket; destination record; mass-balance review"
    - protocol_id: cp_slaughter_waste_records
      process_id: "animal_receiving_slaughter_and_dressing"
