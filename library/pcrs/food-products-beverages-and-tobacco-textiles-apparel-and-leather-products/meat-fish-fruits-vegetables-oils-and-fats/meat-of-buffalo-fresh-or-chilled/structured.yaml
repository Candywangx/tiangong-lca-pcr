      unit: "kg"
      frequency: "reporting period"
      temporal_coverage: "same period as fuel records"
      site_scope: "on-site combustion equipment"
      aggregation_rule: "Attribute direct emissions using documented equipment service and normalize to process output"
      quality_evidence: "monitoring QA; fuel certificate; calculation workbook; equipment log"
    - protocol_id: cp_cutting_input_records
