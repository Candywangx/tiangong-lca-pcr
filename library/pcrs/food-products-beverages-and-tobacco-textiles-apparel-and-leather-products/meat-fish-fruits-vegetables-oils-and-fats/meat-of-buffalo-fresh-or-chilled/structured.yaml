      raw_fields: "waste identity; gross; tare; net mass; meter reading; moisture; destination; treatment code"
      collection_method: "Measure each waste stream separately and reconcile internal wastewater transfer"
      unit: "kg"
      frequency: "each batch or removal"
      temporal_coverage: "complete reporting period"
      site_scope: "slaughter and dressing line"
      aggregation_rule: "Sum by row identity and destination; do not combine solid waste with wastewater"
      quality_evidence: "scale or meter calibration; consignment record; treatment acceptance"
    - protocol_id: cp_combustion_emissions
      process_id: "animal_receiving_slaughter_and_dressing"
      flow_role: "fossil carbon dioxide and nitrogen oxides"
