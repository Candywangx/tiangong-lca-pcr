validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "Require exactly one 1 kg net accepted CPC 21112 reference output using the verified product-flow UUID, Mass property, Units of mass group, and kg; reject frozen meat, offal, packaging mass, and rejected meat in the reference amount."
    source_ids:
      - unsd-cpc-3-0-21112
  - rule_id: validate_scope_and_traceability
    applies_to: "buffalo_product"
    rule: "Require buffalo species, facility, production period, cut, bone state, fat trim, fresh-or-chilled state, release temperature, and batch linkage."
    source_ids:
      - unsd-cpc-3-0-21112
      - ec-jrc-sa-bref-jrc135916
  - rule_id: validate_atomic_flows
    applies_to: "process_inventory"
    rule: "Reject collection labels and combined exchanges; every live-animal input, water stream, stage electricity, steam, hot water, fuel, refrigerant, chemical, packaging material, co-product, waste, and emission must remain separate."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-recommendation-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "slaughter_and_cutting"
    rule: "Require stepwise reconciliation of received live mass, carcass transfers, meat, each co-product, each waste, stock change, moisture change, and rejected product."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-recommendation-2021-2279
  - rule_id: validate_conditional_inputs
    applies_to: "conditional_routes"
    rule: "Require evidence of actual use before recording purchased steam, purchased hot water, natural gas, diesel, LPG, R717 ammonia, ferric chloride, sodium hydroxide, peracetic acid, or sale packaging."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-recommendation-2021-2279
  - rule_id: validate_wastewater_and_releases
    applies_to: "wastewater"
    rule: "Require process-specific wastewater transfers, matched-period treatment records, and monitored discharge concentration and volume for each water emission."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-recommendation-2021-2279
  - rule_id: validate_uuid_resolution
    applies_to: "tiangong_references"
    rule: "Reject any non-reference UUID lacking both identity confirmation and a public state-100 direct read; unresolved identities remain blank with row-specific manifest metadata."
    source_ids: []
  - rule_id: validate_translation_alignment
    applies_to: "bilingual_pcr"
    rule: "Require identical ordered process_id, row_id, Selected flow, controlled-token, source-id, boundary-rule, allocation-rule, and validation-rule sequences in English and Chinese."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific foreground slaughter, cutting, chilling, and release dataset for CPC 21112 buffalo meat, fresh or chilled"
  downstream_use: "secondary_dataset; background_dataset only when species, product presentation, geography, facility technology, period, allocation, refrigerated state, and unresolved-flow limitations match the downstream study"
  allowed_use: "Slaughterhouse-gate LCI, supplier-specific data exchange, product-footprint modelling, and downstream process or lifecycle-model projection with all qualifiers retained"
  excluded_use: "Buffalo farming or transport; frozen buffalo meat; edible or non-edible offal as reference product; retail, preparation, consumption, or end-of-life claims; unqualified comparison across different cuts or allocation methods; automatic filling of unresolved UUIDs or quantities"
  required_metadata: "PCR id and version; buffalo species; facility and country; production period; batch; carcass or cut; bone and fat-trim state; fresh-or-chilled state; release temperature; net mass; process configuration; meters and scales; cleaning chemicals; refrigerant; fuels; packaging; wastewater route; co-product and waste destinations; allocation; source and proxy list"
  required_quality_disclosure: "Company-specific data coverage; temporal, geographic, and technological representativeness; meter, scale, thermometer, and laboratory QA; mass-balance residuals; allocation shares and sensitivity; unmeasured flows; conditional operations; direct-emission basis; upstream substitutions; unresolved Tiangong identities; data gaps and uncertainty"
  update_trigger: "Change in CPC scope, reference-flow identity, buffalo species, product cut or state, facility, slaughter or cutting technology, refrigeration system, fuel, chemical, packaging, wastewater treatment, co-product destination, allocation, or material foreground evidence"
