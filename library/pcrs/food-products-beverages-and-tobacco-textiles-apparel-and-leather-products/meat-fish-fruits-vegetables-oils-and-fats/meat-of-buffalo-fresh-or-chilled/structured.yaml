      applies_to: "cpc_21112_scope"
      rule: "Only buffalo meat released fresh or chilled is the reference product; frozen meat and edible or non-edible offal are excluded from its mass and recorded separately when produced."
      source_ids:
        - unsd-cpc-3-0-21112
        - ec-jrc-sa-bref-jrc135916
