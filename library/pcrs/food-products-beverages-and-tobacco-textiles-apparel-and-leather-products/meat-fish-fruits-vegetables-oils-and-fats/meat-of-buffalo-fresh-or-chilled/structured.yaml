      raw_fields: "fuel identity; opening stock; receipts; issues; returns; closing stock; heating value; equipment hours"
      collection_method: "Reconcile fuel inventory and assign only consumption serving in-scope equipment"
      unit: "kg; MJ"
      frequency: "daily or delivery cycle"
      temporal_coverage: "complete reporting period"
      site_scope: "on-site slaughter heat and handling equipment"
      aggregation_rule: "Calculate net consumption and normalize to accepted carcass transfer mass"
      quality_evidence: "fuel invoice; tank reconciliation; equipment log; heating-value record"
    - protocol_id: cp_slaughter_output_mass_balance
      process_id: "animal_receiving_slaughter_and_dressing"
