      temporal_coverage: "complete reporting period"
      site_scope: "cutting and deboning line"
      aggregation_rule: "Sum accepted incoming carcass mass by batch"
      quality_evidence: "scale calibration; matched transfer record; temperature record"
    - protocol_id: cp_cutting_utility_records
