system_boundary:
  rules:
    - rule_id: boundary_classification
      applies_to: "Reference product"
      rule: "Limit the reference product to CPC 21183 and preserve one exact species, one exact meat or edible-organ identity, one ordered preservation or powder route, and one finished state."
      source_ids:
        - unsd-cpc-3-21183
    - rule_id: boundary_exact_source
      applies_to: "Source material"
      rule: "Use an exact species-and-tissue row; an unlisted species or organ requires a new atomic row before dataset production and must not use a generic other-meat or other-offal exchange."
      source_ids:
        - unsd-cpc-3-21183
        - codex-cxc-58-2005
        - eu-pef-2021-2279
    - rule_id: boundary_route_sequence
      applies_to: "Preservation and powder routes"
      rule: "Declare the actual ordered sequence and include only the applicable dry-cure, immersion-brine, injection-cure, controlled-drying, natural-smoke, smoke-condensate, milling, or sieving operations."
      source_ids:
        - codex-cxs-192-1995
        - codex-cxc-68-2009
        - fao-meat-preservation-1990
        - eu-pef-2021-2279
    - rule_id: boundary_foreground_stages
      applies_to: "Foreground system"
      rule: "Include raw-material receipt and preparation, every declared preservation or powder step, packaging and release, sanitation, and applicable on-site wastewater treatment."
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - codex-cxc-58-2005
        - eu-fdm-bat-2019-2031
        - eu-pef-2021-2279
    - rule_id: boundary_upstream_downstream
      applies_to: "Study boundary"
      rule: "Treat animal husbandry, slaughter or raw-material production, and inbound transport as upstream; treat distribution, retail, preparation, consumption, and end-of-life as downstream unless explicitly extended."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_actual_formulation
      applies_to: "Ingredients and additives"
      rule: "Include only substances present in the approved product-specific formulation; legal permission or a technical example does not establish actual use or amount."
      source_ids:
        - codex-cxs-192-1995
        - fao-meat-preservation-1990
        - eu-pef-2021-2279
    - rule_id: boundary_wastewater
      applies_to: "On-site wastewater treatment"
      rule: "Include on-site treatment only for individually named foreground streams actually treated on site; otherwise retain each specific off-site wastewater transfer."
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-fdm-bat-2019-2031
        - eu-pef-2021-2279
    - rule_id: boundary_uuid_completeness
      applies_to: "Inventory completeness"
      rule: "Retain each physically or chemically specific material, utility, refrigerant, waste, wastewater, or emission row even when its non-reference Tiangong UUID remains unresolved."
      source_ids:
        - eu-pef-2021-2279
