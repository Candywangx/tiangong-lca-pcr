    - id: calc_moisture_loss
      applies_to: "Drying and powder conditioning"
      rule: "Calculate evaporated water from matched incoming and outgoing product mass and moisture measurements, correcting for added or removed solids."
      inputs:
        - "input mass and moisture"
        - "output mass and moisture"
        - "added solids"
        - "removed solids"
      output: "Water released to air"
      source_ids:
        - fao-meat-preservation-1990
        - eu-pef-2021-2279
    - id: calc_refrigerant_balance
      applies_to: "Each refrigerant system"
      rule: "Calculate release from substance-specific opening stock, purchases, make-up, recovery, transfer, and closing stock; retain R-744 origin."
      inputs:
        - "opening stock"
        - purchases
        - make-up
        - recovery
        - transfer
        - "closing stock"
      output: "Substance-specific refrigerant release"
      source_ids:
