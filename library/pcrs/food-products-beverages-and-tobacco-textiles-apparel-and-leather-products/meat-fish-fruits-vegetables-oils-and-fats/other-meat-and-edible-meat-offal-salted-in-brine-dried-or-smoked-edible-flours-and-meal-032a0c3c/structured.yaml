measurement_rules:
  - id: reference_mass
    applies_to: "Reference product output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Set the sole reference output to exactly 1 kg net qualified CPC 21183 product and exclude packaging mass."
  - id: product_identity_mass
    applies_to: "Every source, intermediate, reject, and finished product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep one exact species and either skeletal meat or one exact edible organ on each row through every applicable process."
  - id: route_state_identity
    applies_to: "Cure, drying, smoke, flour, and meal states"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Preserve the ordered route code and one finished physical and storage state; never aggregate routes or states in one amount."
  - id: ingredient_mass
    applies_to: "Each salt, brine ingredient, spice, additive, starter, and smoke medium"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record each exact formulation substance separately from batch issue and return records; permitted substances are not assumed to be used."
  - id: water_volume
    applies_to: "Each process-water or wastewater stream"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Measure each named stream separately before mixing where feasible and reconcile intake, transfer, treatment, and discharge."
  - id: electricity_energy
    applies_to: "Each process-specific electricity input"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Record receipt, curing, drying, smoking, milling, packaging, sanitation, and wastewater-treatment electricity independently."
  - id: thermal_energy
    applies_to: "Purchased steam and purchased hot water"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Meter each purchased thermal carrier separately and prevent double counting with fuel used for on-site heat generation."
  - id: fuel_quantity
    applies_to: "Natural gas, diesel, and liquefied petroleum gas"
    required_property_ref:
      name: "Volume or Mass"
      uuid: ""
    required_unit: "m3 or kg"
    rule: "Record each fuel separately and document density, energy, and allocation conversions."
  - id: refrigerant_mass
    applies_to: "R-717, R-134a, and R-744"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Maintain a substance-specific balance and keep make-up separate from release; retain fossil or biogenic origin for R-744."
  - id: packaging_mass
    applies_to: "Each packaging component and its scrap"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure each bill-of-materials component separately and exclude all packaging mass from the 1 kg reference amount."
  - id: pollutant_mass
    applies_to: "Each direct air or water release"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report one named substance or monitored parameter and one environmental compartment per row from matched foreground evidence."
process_map:
  - id: raw_material_receipt_and_preparation
    name: "Raw-material receipt and preparation"
    inclusion: "required"
    inclusion_condition: "Include for every dataset beginning with received meat or edible offal."
    role: "Accepts one exact species and tissue, preserves identity, trims, washes, and prepares the raw material."
    quantitative_reference: "Mass of accepted exact source material associated with the declared 1 kg reference output."
  - id: cure_formulation_and_application
    name: "Cure formulation and application"
    inclusion: "conditional"
    inclusion_condition: "Include when the declared route uses dry salting, immersion brining, brine injection, or a documented combination; declare exactly one cure method for each lot."
    role: "Applies the actual atomic formulation and preserves the selected cure-method identity."
    quantitative_reference: "Mass of cured exact source material leaving the declared cure method."
  - id: controlled_drying
    name: "Controlled drying"
    inclusion: "conditional"
    inclusion_condition: "Include when drying is part of the declared route; declare natural-air, hot-air, vacuum, freeze-drying, or another exactly documented technology."
    role: "Removes moisture using the one declared drying technology while preserving species and tissue identity."
    quantitative_reference: "Mass of dried exact source material and measured moisture loss."
  - id: smoke_treatment
    name: "Smoke treatment"
    inclusion: "conditional"
    inclusion_condition: "Include when natural wood smoke or purified food-grade smoke condensate is applied; declare one smoke-generation and application method."
    role: "Applies one declared smoke medium and records source-specific residues and emissions."
    quantitative_reference: "Mass of smoked exact source material leaving the declared smoke route."
  - id: edible_flour_meal_production
    name: "Edible flour or meal production"
    inclusion: "conditional"
    inclusion_condition: "Include only when the reference product is an edible flour or meal; the facility flow diagram must declare every conditioning, drying, grinding, sieving, and food-safety step actually used."
    role: "Produces one exact powder or meal state from a declared species and tissue without assuming a universal route."
    quantitative_reference: "Mass of qualified edible flour or meal and route-specific milling residues."
  - id: packaging_and_release
    name: "Packaging and release"
    inclusion: "required"
    inclusion_condition: "Include for every bulk or packaged reference lot."
    role: "Receives one qualified route-specific product, applies the actual packaging bill of materials, and releases the reference output."
    quantitative_reference: "Exactly 1 kg net qualified reference product, excluding packaging mass."
  - id: cleaning_and_disinfection
    name: "Cleaning and disinfection"
    inclusion: "required"
    inclusion_condition: "Include all sanitation serving the foreground processes; activate only the individual chemicals and utilities actually used."
    role: "Records individual sanitation inputs, wastewater streams, residues, and direct utility emissions."
    quantitative_reference: "Sanitation activity allocated causally to the declared reference lot."
  - id: onsite_wastewater_treatment
    name: "On-site wastewater treatment"
    inclusion: "conditional"
    inclusion_condition: "Include only for named foreground wastewater streams treated on site; otherwise retain each off-site transfer boundary."
    role: "Treats individually tracked wastewater streams and reports each residual and release separately."
    quantitative_reference: "Matched influent and effluent volumes plus pollutant loads allocated to the reference lot."
