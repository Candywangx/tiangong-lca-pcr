validation_rules:
  - rule_id: validate_reference_uuid
    applies_to: "Reference flow"
    rule: "Require UUID 47ac991c-00e2-4c29-8df0-7a7b867c3e97, Product flow type, exact CPC 21183 scope, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, kg, and exactly 1 kg net output."
    source_ids:
      - unsd-cpc-3-21183
  - rule_id: validate_scope_lock
    applies_to: "Product identity"
    rule: "Require one exact species, one exact meat or edible organ, one ordered route sequence, one finished physical state, one storage state, and food-use status; reject mixed identity."
    source_ids:
      - unsd-cpc-3-21183
      - codex-cxc-58-2005
      - eu-pef-2021-2279
  - rule_id: validate_exact_source_rows
    applies_to: "Source and intermediate inventory"
    rule: "Require exact species-and-tissue rows through every applicable process; an unlisted identity requires a new atomic row and cannot use an other-meat or other-offal selector."
    source_ids:
      - codex-cxc-58-2005
      - eu-pef-2021-2279
  - rule_id: validate_route_sequence
    applies_to: "Process selection"
    rule: "Require documented inclusion decisions and ordered links for curing, drying, smoking, flour or meal production, packaging, sanitation, and on-site wastewater treatment."
    source_ids:
      - codex-cxs-192-1995
      - codex-cxc-68-2009
      - fao-meat-preservation-1990
      - eu-pef-2021-2279
  - rule_id: validate_atomic_exchange
    applies_to: "Inventory"
    rule: "Reject any selected flow that combines carriers, ingredients, smoke media, packaging components, products, wastes, wastewater pollutants, or emissions."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-pef-2021-2279
  - rule_id: validate_actual_formulation
    applies_to: "Cure formulation"
    rule: "Require a product-specific approved recipe and foreground issue records for every included ingredient; legal permission and technical examples cannot populate default inputs."
    source_ids:
      - codex-cxs-192-1995
      - fao-meat-preservation-1990
      - eu-pef-2021-2279
  - rule_id: validate_smoke_medium
    applies_to: "Smoke treatment"
    rule: "Require one actual declared smoke medium and application method, separate control-device records, and substance-specific emission evidence; reject prohibited smoke fuel or waste."
    source_ids:
      - codex-cxc-68-2009
      - us-epa-ap42-meat-smokehouses
      - eu-pef-2021-2279
  - rule_id: validate_flour_route
    applies_to: "Edible flour or meal"
    rule: "Require enterprise-specific conditioning, drying, grinding, sieving, metal-control, and packaging records for each operation actually present; reject an assumed universal process."
    source_ids:
      - codex-cxc-58-2005
      - eu-pef-2021-2279
  - rule_id: validate_reference_amount
    applies_to: "Amount modes"
    rule: "Require the reference output as the sole fixed value and prohibit invented fixed quantities, default factors, or ranges for non-reference rows."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_unresolved_uuid
    applies_to: "Non-reference identities"
    rule: "Permit a blank UUID only when manifest.yaml contains matching selected_flow_candidates and rejected_candidates under the same row_id."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_balances
    applies_to: "Foreground balances"
    rule: "Require species-and-tissue mass balance, cure or brine balance where applicable, moisture balance for drying, packaging reconciliation, and refrigerant balance."
    source_ids:
      - fao-meat-preservation-1990
      - eu-fdm-bat-2019-2031
      - eu-pef-2021-2279
  - rule_id: validate_wastewater
    applies_to: "Wastewater"
    rule: "Require named wastewater inputs, matched discharge volume and concentration for each reported parameter, and documented off-site transfer when on-site treatment is absent."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-fdm-bat-2019-2031
      - eu-pef-2021-2279
  - rule_id: validate_data_quality
    applies_to: "Foreground package"
    rule: "Require primary-record traceability, representative temporal coverage, reproducible calculations, complete disclosures, and independent review evidence."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground unit-process package for 1 kg net qualified CPC 21183 product locked to one exact species, tissue, ordered preservation or powder route, and finished state"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product carbon footprinting, life-cycle assessment, supplier exchange, facility improvement, and reviewed aggregation when exact identity and route qualifiers remain explicit"
  excluded_use: "Direct representation of another CPC product, inedible tissue meal, feed meal, mixed-species or mixed-tissue product, undeclared formulation, undeclared route, or assumed universal edible-powder process"
  required_metadata: "PCR id; CPC code; reference UUID; exact species; exact meat or organ; food use; ordered route; actual formulation; smoke medium; equipment; process conditions; finished and storage state; packaging; net mass; facility; geography; technology; batch; period; allocation; residue destinations; refrigerants; wastewater route; unresolved UUID register"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; shared-record allocations; mass, brine, moisture, water, and refrigerant balances; smoke-emission evidence; powder-route evidence; data gaps; calculation provenance; validation findings"
  update_trigger: "Change in species, tissue, food use, formulation, cure method, drying technology, smoke medium or method, powder equipment, finished or storage state, refrigerant, thermal supply, packaging, sanitation chemistry, wastewater route, allocation, facility configuration, or representative period"
