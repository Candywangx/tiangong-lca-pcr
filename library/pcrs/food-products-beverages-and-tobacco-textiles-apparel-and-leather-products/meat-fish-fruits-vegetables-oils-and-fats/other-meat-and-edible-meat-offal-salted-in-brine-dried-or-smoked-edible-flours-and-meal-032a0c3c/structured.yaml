allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Shared processes"
    rule: "Prefer measured process subdivision and direct batch assignment before any allocation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_mass_balance
    applies_to: "Species, tissue, route, and state outputs"
    rule: "Reconcile accepted input, ingredients, product, rejects, residues, wastewater, and measured moisture change without counting one physical mass twice."
    source_ids:
      - fao-meat-preservation-1990
      - eu-fdm-bat-2019-2031
      - eu-pef-2021-2279
  - rule_id: allocation_product_waste_status
    applies_to: "Recovered materials"
    rule: "Classify an output as product only with a documented lawful use and destination; otherwise retain the exact waste identity."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-fdm-bat-2019-2031
      - eu-pef-2021-2279
  - rule_id: allocation_internal_recycle
    applies_to: "Reused brine and internal recirculation"
    rule: "Treat internal reuse as an internal transfer, record make-up and purge separately, and avoid reporting the recirculated quantity as a new external input."
    source_ids:
      - fao-meat-preservation-1990
      - eu-pef-2021-2279
  - rule_id: allocation_fallback
    applies_to: "Unavoidable shared burdens"
    rule: "If subdivision or a physical causal relation is not feasible, document the PEF-consistent allocation basis and preserve numerator, denominator, and affected rows."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_sensitivity
    applies_to: "Material allocations"
    rule: "Perform and disclose a sensitivity check when a shared slaughter, preservation, utility, or co-product allocation materially changes the result."
    source_ids:
      - eu-pef-2021-2279
