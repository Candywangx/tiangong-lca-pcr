allocation_rules:
  - rule_id: alloc_subdivision_first
    applies_to: "slaughter, dressing and cutting"
    rule: "Use subdivision and direct process measurement before allocation wherever separate operations and records are available."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_co_product_status
    applies_to: "feathers, blood, organs, fat, skin, bones, heads and feet"
    rule: "Determine product or waste status at the actual hand-off point and use only the matching product or waste row; never count the same physical mass in both."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: alloc_physical_relation
    applies_to: "unavoidable joint co-products"
    rule: "When subdivision is not possible, use an evidence-backed physical causal relation only when it reflects how inputs and emissions change with co-product production."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_economic_fallback
    applies_to: "remaining joint co-products"
    rule: "If no defensible physical relation exists, use a documented economic allocation consistent with the applicable study programme and reporting period; do not invent a default factor."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_waste_no_credit
    applies_to: "waste streams"
    rule: "Assign treatment burdens to the declared hand-off without an avoided-product credit unless the applicable downstream model explicitly requires and documents that scenario."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_internal_recovery
    applies_to: "treated water, biogas, steam, hot water and electricity"
    rule: "Treat internal recovery as a linked transfer; do not allocate or credit the same recovered quantity twice."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_live_bird_mass
      process_id: "live_guinea_fowl_reception"
      flow_role: "live-bird receipt and disposition"
      record_type: "weighbridge and lot records"
      raw_fields: "lot_id; supplier; origin; arrival_time; gross_mass; tare_mass; accepted_mass; rejected_mass; dead_on_arrival_mass"
      collection_method: "calibrated weighbridge or batch scale reconciled to receiving records"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full reporting period"
      site_scope: "all represented receipts"
      aggregation_rule: "sum by lot and reconcile accepted plus rejected dispositions"
      quality_evidence: "calibration record; signed receipt; disposition log"
    - protocol_id: cp_process_mass_balance
      process_id: "all_slaughter_and_meat_processes"
      flow_role: "carcasses, meat, organs and intermediates"
      record_type: "production and scale records"
      raw_fields: "batch_id; input_mass; output_mass; product_state; trim_mass; bone_mass; organ_mass; inventory_change"
      collection_method: "calibrated scales and line-production records"
      unit: "kg"
      frequency: "each batch or shift"
      temporal_coverage: "full reporting period"
      site_scope: "all represented lines"
      aggregation_rule: "reconcile inputs, outputs, inventory changes and documented losses before normalization"
      quality_evidence: "calibration; batch sheet; balance exception log"
    - protocol_id: cp_energy_records
      process_id: "all_processes"
      flow_role: "electricity, steam and hot water"
      record_type: "meter and utility records"
      raw_fields: "meter_id; timestamp; opening_reading; closing_reading; energy_carrier; generated_amount; transferred_amount"
      collection_method: "dedicated meters or documented causal allocation from reconciled site meters"
      unit: "kWh; MJ"
      frequency: "continuous or each billing period"
      temporal_coverage: "full reporting period"
      site_scope: "all represented equipment and utilities"
      aggregation_rule: "aggregate exact carriers separately and reconcile imports, generation and internal transfers"
      quality_evidence: "meter calibration; invoice; reconciliation"
    - protocol_id: cp_fuel_inventory
      process_id: "onsite_energy_generation"
      flow_role: "individual fuels"
      record_type: "fuel meter, invoice and tank records"
      raw_fields: "fuel_identity; quantity; unit; energy_basis; opening_stock; purchases; issues; closing_stock"
      collection_method: "meter or stock reconciliation for each fuel"
      unit: "MJ"
      frequency: "each delivery and reporting period"
      temporal_coverage: "full reporting period"
      site_scope: "all on-site combustion units"
      aggregation_rule: "calculate consumption separately by fuel and declared energy basis"
      quality_evidence: "invoice; tank calibration; fuel specification"
    - protocol_id: cp_water_balance
      process_id: "all_processes"
      flow_role: "process, pre-chilling and utility water"
      record_type: "water-meter records"
      raw_fields: "meter_id; source; destination; opening_reading; closing_reading; recirculation; discharge"
      collection_method: "dedicated meters and documented water balance"
      unit: "m3"
      frequency: "continuous or daily"
      temporal_coverage: "full reporting period"
      site_scope: "all represented water circuits"
      aggregation_rule: "separate external make-up, internal reuse and discharged water"
      quality_evidence: "meter calibration; balance reconciliation"
    - protocol_id: cp_material_inventory
      process_id: "applicable_processes"
      flow_role: "named processing materials, ice, gases and coolants"
      record_type: "purchase and stock records"
      raw_fields: "material_identity; concentration; opening_stock; purchases; issues; returns; closing_stock"
      collection_method: "material-specific stock reconciliation"
      unit: "kg"
      frequency: "each issue and reporting period"
      temporal_coverage: "full reporting period"
      site_scope: "all represented materials"
      aggregation_rule: "calculate each exact material separately"
      quality_evidence: "invoice; specification; inventory record"
    - protocol_id: cp_chemical_inventory
      process_id: "sanitation_and_utilities"
      flow_role: "named chemicals"
      record_type: "chemical issue and concentration records"
      raw_fields: "chemical_identity; formulation; active_fraction; opening_stock; purchases; issues; closing_stock"
      collection_method: "material balance converted to pure-substance-equivalent mass"
      unit: "kg"
      frequency: "each issue and reporting period"
      temporal_coverage: "full reporting period"
      site_scope: "all represented chemical stores and dosing points"
      aggregation_rule: "no aggregation across chemical identities"
      quality_evidence: "safety data sheet; concentration test; stock reconciliation"
    - protocol_id: cp_refrigerant_balance
      process_id: "prechilling_freezing"
      flow_role: "each refrigerant and fugitive component"
      record_type: "equipment and service records"
      raw_fields: "equipment_id; refrigerant_identity; blend_composition; opening_stock; purchases; charge; recovery; returns; closing_stock; service_loss"
      collection_method: "reporting-period refrigerant mass balance"
      unit: "kg"
      frequency: "each service event and reporting period"
      temporal_coverage: "full reporting period"
      site_scope: "every represented refrigeration circuit"
      aggregation_rule: "calculate each refrigerant input and each emitted component separately"
      quality_evidence: "service invoice; cylinder weights; composition specification"
    - protocol_id: cp_packaging_inventory
      process_id: "frozen_packaging_storage"
      flow_role: "each packaging material and scrap"
      record_type: "bill of materials, issue and scrap records"
      raw_fields: "material_identity; units_issued; unit_mass; returns; scrap_mass; reusable_cycles"
      collection_method: "item count multiplied by verified unit mass plus stock reconciliation"
      unit: "kg"
      frequency: "each production batch and reporting period"
      temporal_coverage: "full reporting period"
      site_scope: "every represented packaging line"
      aggregation_rule: "calculate each material separately and exclude packaging from product net mass"
      quality_evidence: "supplier specification; scale check; issue record"
    - protocol_id: cp_product_release
      process_id: "freezing_and_frozen_dispatch"
      flow_role: "conforming reference product"
      record_type: "lot-release records"
      raw_fields: "lot_id; net_mass; product_form; bone_status; skin_status; product_temperature; frozen_state; glazing_status; packaging_format; release_decision"
      collection_method: "calibrated final scale plus quality and temperature review"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full reporting period"
      site_scope: "all reference-product lots"
      aggregation_rule: "sum released net product only; exclude nonconforming and non-product mass"
      quality_evidence: "calibration; temperature log; release certificate"
    - protocol_id: cp_waste_byproduct_records
      process_id: "all_processes"
      flow_role: "individual co-products and wastes"
      record_type: "weighed dispatch and treatment records"
      raw_fields: "stream_identity; container_tare; gross_mass; net_mass; product_or_waste_status; destination; date"
      collection_method: "calibrated scale or documented container mass"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "full reporting period"
      site_scope: "every declared stream and destination"
      aggregation_rule: "keep each physical stream and status separate"
      quality_evidence: "weigh ticket; consignment note; destination evidence"
    - protocol_id: cp_wastewater_records
      process_id: "sanitation_wastewater_management"
      flow_role: "wastewater, treatment outputs and water emissions"
      record_type: "flow meter and laboratory records"
      raw_fields: "stream_identity; volume; sample_time; concentration; parameter; treatment_route; sludge_mass; destination"
      collection_method: "matched flow measurement and representative sampling"
      unit: "m3; kg"
      frequency: "continuous flow and risk-based sampling"
      temporal_coverage: "full reporting period"
      site_scope: "every discharge and treatment route"
      aggregation_rule: "calculate load as matched volume times concentration; reconcile sludge and off-site transfers"
      quality_evidence: "meter calibration; laboratory report; permit record"
    - protocol_id: cp_air_emissions
      process_id: "refrigeration_packaging_wastewater_and_energy"
      flow_role: "direct air emissions"
      record_type: "monitoring, mass-balance and service records"
      raw_fields: "emission_identity; source; activity; concentration; flow_rate; duration; composition; calculated_loss"
      collection_method: "direct monitoring or documented calculation from collected source records"
      unit: "kg"
      frequency: "continuous, campaign or service event as applicable"
      temporal_coverage: "full reporting period"
      site_scope: "every direct emission source"
      aggregation_rule: "calculate and report each elementary flow separately"
      quality_evidence: "monitoring report; service record; calculation worksheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "Divide the reporting-period amount for one atomic exchange by released net reference-product mass."
      inputs:
        - "exchange amount"
        - "released net product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_live_bird_balance
      applies_to: "reception through dressing"
      rule: "Reconcile accepted live mass with dressed carcass, separately measured co-products, wastes, wastewater-carried material and inventory change; investigate unexplained imbalance."
      inputs:
        - "accepted live mass"
        - "all measured outputs"
        - "inventory change"
      output: "reconciled slaughter mass balance"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - id: calc_internal_transfer
      applies_to: "intermediates, water and utilities"
      rule: "Match the sending-process output to the receiving-process input for the same identity and reporting period; remove any duplicate external exchange."
      inputs:
        - "linked output"
        - "linked input"
        - "inventory change"
      output: "reconciled internal transfer"
      source_ids:
        - eu-pef-method-2021
    - id: calc_freezing_balance
      applies_to: "freezing and storage"
      rule: "Reconcile prepared meat, ice or water, product mass, drip or frost losses, off-specification product and inventory change while excluding free ice from net reference mass."
      inputs:
        - "prepared meat"
        - ice
        - water
        - "product mass"
        - losses
        - "stock change"
      output: "reconciled frozen-product mass balance"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - id: calc_refrigerant_loss
      applies_to: "freezing refrigeration"
      rule: "Calculate each refrigerant loss from stock, purchase, charge, recovery and return records; for blends, calculate each emitted component using documented composition."
      inputs:
        - "refrigerant balance"
        - "blend composition"
      output: "refrigerant input and component-specific air releases"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - id: calc_packaging_mass
      applies_to: "packaging"
      rule: "Multiply issued units by verified unit mass, adjust for returns and inventory change, and keep each material and scrap stream separate."
      inputs:
        - units
        - "unit mass"
        - returns
        - stocks
        - scrap
      output: "material-specific packaging inputs and wastes"
      source_ids:
        - eu-pef-method-2021
    - id: calc_wastewater_load
      applies_to: "water emissions"
      rule: "Multiply matched discharged volume by the representative concentration for each parameter with unit conversion documented."
      inputs:
        - "effluent volume"
        - "parameter concentration"
      output: "parameter-specific mass release"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - id: calc_combustion_emissions
      applies_to: "on-site combustion"
      rule: "Use direct monitoring or a documented calculation tied to each fuel inventory and measured operating period; retain pollutant identities separately."
      inputs:
        - "fuel inventory"
        - monitoring
        - "operating time"
        - composition
      output: "pollutant-specific air releases"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
    - id: calc_allocation
      applies_to: "joint co-products"
      rule: "Apply the declared allocation hierarchy only after subdivision and direct measurement; disclose data, formula and reporting-period basis."
      inputs:
        - "joint-process inventory"
        - "co-product quantities"
        - "physical or economic basis"
      output: "allocated inventory by product"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all exchanges"
      requirement: "Preserve exact flow identity, direction, type, unit and process; unresolved non-reference UUIDs remain blank and manifest-listed."
      evidence: "inventory audit and UUID review"
    - id: dq_primary_data
      applies_to: "foreground manufacturing"
      requirement: "Use company-specific records for the represented plant, technology and reporting period."
      evidence: "meters, scales, invoices, logs and laboratory reports"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Cover raw materials, energy, products, co-products, wastes and releases to air and water; document non-applicability for every conditional card."
      evidence: "completeness matrix and process walk-through"
    - id: dq_temporal
      applies_to: "reporting period"
      requirement: "Cover a representative operating period and disclose shutdowns, abnormal events, stock changes and seasonal effects."
      evidence: "reporting-period reconciliation"
    - id: dq_mass_balance
      applies_to: "slaughter, cutting and freezing"
      requirement: "Reconcile live mass, carcass, meat, co-products, wastes, ice, water and inventory changes without hiding imbalance in a combined residual flow."
      evidence: "batch and period mass balances"
    - id: dq_refrigeration
      applies_to: "freezing and storage"
      requirement: "Retain equipment-specific refrigerant identity, blend composition, service records and component loss calculation."
      evidence: "refrigeration service file"
    - id: dq_frozen_state
      applies_to: "reference product"
      requirement: "Retain temperature records, frozen-state release criteria, glazing status and cold-storage duration."
      evidence: "temperature log and release certificate"
    - id: dq_packaging
      applies_to: "packaging"
      requirement: "Retain a product-specific packaging bill of materials and material-specific scrap records."
      evidence: "bill of materials and issue records"
    - id: dq_wastewater
      applies_to: "water management"
      requirement: "Match representative concentration samples to measured volumes and disclose treatment or off-site hand-off."
      evidence: "laboratory, meter and consignment records"
    - id: dq_transparency
      applies_to: "published dataset"
      requirement: "Disclose exclusions, allocation, data gaps, proxies, unresolved identities and calculation methods."
      evidence: "data-quality report"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "Use Meat of guinea fowl, frozen 4671befd-6e3d-446b-a29e-d8db90e539ef, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 and kg."
    source_ids: []
  - rule_id: val_product_scope
    applies_to: "reference product"
    rule: "Reject datasets whose reference product is fresh or chilled guinea fowl meat, fatty liver, foie gras, guinea fowl liver, heart, gizzard, intestines or another offal product."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: val_frozen_state
    applies_to: "reference product"
    rule: "Require declared frozen-state release criteria, measured product temperature and documented frozen storage through dispatch."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_atomic_inventory
    applies_to: "all inventory rows"
    rule: "Require one concrete exchange and a non-empty explanatory paragraph per card; reject collection labels and material, utility, waste or emission selectors."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_uuid_closure
    applies_to: "identity"
    rule: "Permit only dual-kernel-confirmed UUIDs; require every blank non-reference UUID to have the same row_id in manifest review metadata."
    source_ids: []
  - rule_id: val_no_inferred_quantities
    applies_to: "amounts"
    rule: "Require foreground records, calculated values or the fixed reference amount; reject AI-generated or inference-only ranges."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_mass_balance
    applies_to: "reception through freezing"
    rule: "Reconcile input mass with products, co-products, wastes, water or ice additions, discharged loads and inventory changes for the same period."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_energy_water_balance
    applies_to: "utilities"
    rule: "Reconcile imported, generated and internally transferred electricity, steam, hot water, fuels and water without double counting."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_refrigerant_balance
    applies_to: "refrigeration"
    rule: "Require each installed refrigerant and every emitted component to be separately identified and reconciled to service records."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_packaging
    applies_to: "frozen packaged product"
    rule: "Match each packaging input, scrap stream and declared pack format while excluding packaging mass from reference-product mass."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_wastewater
    applies_to: "wastewater"
    rule: "Match measured wastewater volumes to treatment, hand-off and parameter-specific discharge loads."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
  - rule_id: val_co_product_status
    applies_to: "slaughter by-products"
    rule: "Require one product or waste status and one destination for each feather, blood, organ, fat, skin, bone, head and foot stream; reject duplicate product-and-waste accounting."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_allocation
    applies_to: "co-products"
    rule: "Require the declared subdivision and allocation hierarchy, input data, formula and reporting-period basis."
    source_ids:
      - eu-pef-method-2021
