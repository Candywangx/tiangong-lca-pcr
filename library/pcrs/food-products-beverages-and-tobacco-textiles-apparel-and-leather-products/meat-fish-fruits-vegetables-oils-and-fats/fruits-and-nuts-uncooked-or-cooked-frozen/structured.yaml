allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Multi-output and shared processes"
    rule: "First avoid allocation by subdivision or by using directly metered batch, line, equipment, or storage-zone data."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relation
    applies_to: "Unavoidable multi-output process"
    rule: "Where subdivision is not possible, allocate inputs and emissions using an established physical relationship that reflects how changing output quantities changes burdens; disclose the parameter, data period, and calculation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relation
    applies_to: "No defensible physical relationship"
    rule: "If no defensible physical relationship exists, use another justified relationship, including economic allocation where appropriate, and report prices, reference period, sensitivity, and why physical allocation was not applicable."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residue_status
    applies_to: "Peels, shells, trimmings, rejected food, recovered material, and other outputs"
    rule: "Classify each output as product, co-product, material for recovery, animal feed, wastewater constituent, or waste before allocation. Record destination and do not assign avoided burdens without an explicit downstream substitution model."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_cold_store
    applies_to: "Shared frozen storage"
    rule: "Prefer dedicated metering. Otherwise allocate storage electricity and attributable refrigerant loss using recorded product mass multiplied by recorded dwell time, unless a validated engineering model better represents zone or temperature differences."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_batch_records
      process_id: "receiving_preparation"
      flow_role: "Raw, intermediate, ingredient, and conforming product masses across receiving, treatment, and freezing"
      record_type: "Weighbridge, scale, batch, recipe, and transfer records"
      raw_fields: "lot_id; species_or_mixture; supplier; origin; preparation_state; ingredient_id; gross_mass; tare_mass; net_mass; moisture_basis_if_used; timestamp; destination_batch"
      collection_method: "Calibrated weighing and controlled batch reconciliation"
      unit: "kg and original record units"
      frequency: "Every represented lot and batch"
      temporal_coverage: "Declared representative production period covering relevant seasonal and operating conditions"
      site_scope: "All facilities and lines included in the dataset"
      aggregation_rule: "Sum by material identity and batch; subtract tare; link transfers; normalize only after conforming output is known"
      quality_evidence: "Calibration records; lot traceability; recipe authorization; reconciliation sign-off"
    - protocol_id: cp_utility_records
      process_id: "freezing"
      flow_role: "Water, electricity, fuel, heat, steam, and shared utilities across included preparation, treatment, and freezing operations"
      record_type: "Meters, invoices, equipment logs, and production schedules"
      raw_fields: "meter_id; utility; opening_reading; closing_reading; unit; timestamp; equipment_or_area; batch_id; allocation_driver"
      collection_method: "Direct submetering preferred; otherwise documented allocation from synchronized production records"
      unit: "Original meter or invoice unit"
      frequency: "Each batch where metered; otherwise at the shortest available billing interval"
      temporal_coverage: "Same period as represented production"
      site_scope: "All included process equipment and shared systems"
      aggregation_rule: "Difference readings; subtract documented non-production use; allocate shared totals using the disclosed causal driver"
      quality_evidence: "Meter calibration or verification; invoices; operating-hour logs; allocation worksheet"
    - protocol_id: cp_temperature_and_release_records
      process_id: "freezing"
      flow_role: "Freezer operation, product-core temperature, stabilization, and release conformity"
      record_type: "Calibrated probes, continuous logger, freezer control record, and release test"
      raw_fields: "lot_id; product; standard_claim; probe_id; measurement_location; start_time; end_time; core_temperature; stabilization_condition; freezer_temperature; conformity_decision"
      collection_method: "Measure at defined representative or worst-case locations under the declared release procedure"
      unit: "°C and timestamp"
      frequency: "Every represented batch or validated sampling plan"
      temporal_coverage: "Same period as represented production"
      site_scope: "Every included freezer and product route"
      aggregation_rule: "Retain batch results; do not average away a failed release result; apply product-specific standard only within its scope"
      quality_evidence: "Probe calibration; sampling plan; signed release record; deviation and corrective-action log"
    - protocol_id: cp_packaging_records
      process_id: "packaging"
      flow_role: "Net product, packaging components, and packaging waste"
      record_type: "Packaging bill of materials, issue/return records, checkweigher, and waste logs"
      raw_fields: "packaging_component_id; material; supplier; unit_mass; issued_count; returned_count; net_product_mass; rejected_pack_count; scrap_mass; destination"
      collection_method: "Reconcile packaging issued, used, returned, and discarded with packed net product"
      unit: "kg, item count, and source units"
      frequency: "Each packaging batch"
      temporal_coverage: "Same period as represented production"
      site_scope: "Every included packaging line and format"
      aggregation_rule: "Convert counts using verified component mass; aggregate by material; keep packaging mass outside net product mass"
      quality_evidence: "Supplier specification; component-mass check; checkweigher verification; reconciliation record"
    - protocol_id: cp_waste_and_water_records
      process_id: "receiving_preparation"
      flow_role: "Residues, food losses, non-conforming product, wastewater, and destinations across included preparation, treatment, and freezing operations"
      record_type: "Scales, containers, wastewater meters, manifests, and laboratory reports"
      raw_fields: "stream_id; material_description; mass_or_volume; unit; batch_id; destination; treatment_route; recovery_status; pollutant_measurement; timestamp"
      collection_method: "Measure each material stream and retain destination evidence"
      unit: "kg, m3, and laboratory units"
      frequency: "Each batch or waste collection event"
      temporal_coverage: "Same period as represented production"
      site_scope: "All included processes and discharge points"
      aggregation_rule: "Aggregate by stream and destination; prevent double counting between product loss and wastewater solids"
      quality_evidence: "Scale or meter verification; waste transfer record; laboratory report; destination confirmation"
    - protocol_id: cp_refrigerant_records
      process_id: "freezing"
      flow_role: "Refrigerant stock, charge, replenishment, recovery, and attributable loss across freezing and frozen storage"
      record_type: "Refrigerant log, service invoice, cylinder weighing, and equipment register"
      raw_fields: "refrigerant_identity; equipment_id; opening_stock; additions; recovered_mass; closing_stock; service_date; leak_event; equipment_assignment"
      collection_method: "Reconcile identified refrigerant mass by equipment system and period"
      unit: "kg"
      frequency: "Every service, replenishment, recovery, or inventory event"
      temporal_coverage: "Same period as represented production, with opening and closing stock"
      site_scope: "All freezing and cold-storage systems serving included production"
      aggregation_rule: "Calculate loss from the documented stock balance; allocate shared-system loss using disclosed service or mass-time data"
      quality_evidence: "Technician record; cylinder weight; service invoice; equipment charge register; stock-balance review"
    - protocol_id: cp_storage_dispatch_records
      process_id: "frozen_storage_dispatch"
      flow_role: "Stored mass, dwell time, storage temperature, electricity allocation, and dispatch loss"
      record_type: "Warehouse management system, zone logger, dispatch record, and storage submeter"
      raw_fields: "lot_id; net_mass; entry_time; dispatch_time; storage_zone; setpoint; measured_temperature; electricity_reading; refrigerant_system; loss_mass; loss_destination"
      collection_method: "Link lot movements to zone temperature and energy records"
      unit: "kg, h, °C, kWh, and source units"
      frequency: "Every lot movement plus continuous or validated interval logging"
      temporal_coverage: "Same period as represented production"
      site_scope: "All on-site frozen stores used before factory-gate dispatch"
      aggregation_rule: "Calculate mass-time by lot; allocate zone totals using the disclosed rule; retain excursions and losses separately"
      quality_evidence: "Logger and meter verification; warehouse traceability; dispatch confirmation; excursion investigation"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "Reference product"
      rule: "Net frozen product mass = gross packed mass - tare and packaging mass; normalize the completed inventory to exactly 1 kg net conforming product."
      inputs:
        - "gross packed mass"
        - "tare mass"
        - "packaging mass"
        - "conforming status"
      output: "kg net reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_inventory_normalization
      applies_to: "Every foreground flow"
      rule: "Normalized amount = attributable batch amount / kg net conforming factory-gate product from the same represented production."
      inputs:
        - "attributable flow quantity"
        - "net conforming product mass"
      output: "flow quantity per kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_process_mass_reconciliation
      applies_to: "Each material transformation"
      rule: "Reconcile measured incoming fruit or nut material plus added food ingredients and retained water against product, co-product, residue, wastewater solids where measured, samples, spills, and documented mass change; investigate unexplained imbalance rather than forcing closure."
      inputs:
        - "all measured material inputs and outputs"
        - "moisture or evaporation evidence where relevant"
      output: "batch mass-reconciliation record"
      source_ids: []
    - id: calc_shared_utility_allocation
      applies_to: "Shared utilities"
      rule: "Allocate only after subtracting documented unrelated use; use direct submetering where available, otherwise a disclosed causal driver synchronized to production."
      inputs:
        - "shared meter total"
        - "non-production use"
        - "batch or equipment driver"
      output: "utility quantity attributable to represented product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_storage_mass_time
      applies_to: "Shared frozen storage"
      rule: "Product mass-time = sum of each lot's net mass multiplied by recorded dwell time; use the result as the default shared-zone allocation driver unless direct metering or a validated engineering model is available."
      inputs:
        - "lot net mass"
        - "entry time"
        - "dispatch time"
        - "zone utility total"
      output: "storage utility attributed to each product lot"
      source_ids: []
    - id: calc_refrigerant_loss
      applies_to: "Freezing and storage refrigerant emissions"
      rule: "Identified refrigerant loss = opening stock + additions - recovered mass - closing stock, reconciled with equipment service records and never below zero without investigation."
      inputs:
        - "opening stock"
        - additions
        - "recovered mass"
        - "closing stock"
        - "equipment assignment"
      output: "kg identified refrigerant loss"
      source_ids: []
  data_quality_requirements:
    - id: dqr_product_identity
      applies_to: "Reference flow and all product intermediates"
      requirement: "Species or mixture, preparation state, composition, presentation, freezing route, release condition, and intended use shall be traceable to each represented lot. The Banana UUID shall appear only for frozen banana unless a documented manual review accepts the exact use."
      evidence: "Product specification; lot records; Tiangong flow selection; identity-review record where applicable"
    - id: dqr_temporal
      applies_to: "Foreground activity data"
      requirement: "Use a declared period that represents the production route and relevant seasonal, start-up, shutdown, defrost, cleaning, and storage conditions; disclose excluded abnormal events and the reason."
      evidence: "Dataset reference period; production calendar; exception log"
    - id: dqr_technology_geography
      applies_to: "Facility processes and upstream links"
      requirement: "Identify facility, line, freezer technology, storage system, refrigerant, energy supply geography, and raw-material origin sufficiently to select representative upstream data."
      evidence: "Equipment register; supplier records; utility contract; dataset metadata"
    - id: dqr_measurement
      applies_to: "Mass, utility, temperature, and refrigerant records"
      requirement: "Retain instrument identity, unit, calibration or verification status, reading interval, allocation method, and responsible record."
      evidence: "Calibration certificates; meter checks; service logs; signed batch records"
    - id: dqr_completeness
      applies_to: "Foreground inventory"
      requirement: "Include every process performed within the declared boundary and reconcile material outputs, food loss, wastewater, packaging, utility use, and direct refrigerant losses. Any omission shall be quantified where possible, justified, and tested for significance."
      evidence: "Process map; reconciliation; missing-data register; significance assessment"
    - id: dqr_source_scope
      applies_to: "Codex-based requirements"
      requirement: "Demonstrate that the species, presentation, intended use, and process fall within the cited Codex standard before applying its requirements. Do not transfer CXS 52-1981, CXS 69-1981, or CXS 320-2015 limits to products outside their scope."
      evidence: "Applicable standard; product specification; conformity statement"
    - id: dqr_uncertainty
      applies_to: "Calculated and allocated values"
      requirement: "Identify measured inputs, calculation formula, allocation driver, data gaps, and sensitivity to material allocation or missing-data choices."
      evidence: "Calculation workbook; allocation record; sensitivity result; quality disclosure"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference product flow"
    rule: "Fail validation when Banana UUID ce6b2d04-9b60-4b60-a4e7-553d7ae67ce0 is used for a non-banana product, an undeclared mixture, or a materially different identity without documented manual review; require a replacement Tiangong product flow otherwise."
    source_ids: []
  - rule_id: validate_reference_mass
    applies_to: "Reference flow"
    rule: "Confirm that the quantitative reference is exactly 1 kg net conforming frozen product using Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, with packaging excluded."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_process_coverage
    applies_to: "Foreground system"
    rule: "Confirm receiving and preparation, freezing, and on-site frozen storage/dispatch are represented; include cooking or blanching and packaging when performed; account for cleaning, waste, wastewater, energy, and direct refrigerant loss where applicable."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_temperature_claim
    applies_to: "Quick-frozen strawberry or raspberry conformity claim"
    rule: "For a CXS 52-1981 strawberry or CXS 69-1981 raspberry claim, verify recorded thermal-centre temperature reached -18 °C after thermal stabilization and that handling, packaging, and product scope match the cited standard. Do not run this criterion for banana, nuts, or other non-covered products."
    source_ids:
      - codex-cxs-52-1981
      - codex-cxs-69-1981
  - rule_id: validate_mass_reconciliation
    applies_to: "Material-transforming processes"
    rule: "Confirm measured inputs and outputs are reconciled and that rejects, residues, co-products, wastewater solids where measured, samples, and losses are not hidden in product yield. Investigate and disclose unexplained imbalance."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "Multi-output and shared processes"
    rule: "Confirm allocation was first avoided where practical; otherwise verify the selected relationship, driver, reference period, and sensitivity are documented and consistently applied."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_source_scope
    applies_to: "All external-source rules"
    rule: "Reject a standard-derived rule when the represented product or process is outside the source scope. In particular, CXS 320-2015 shall not be treated as a frozen-fruit-or-nut standard."
    source_ids:
      - codex-cxs-320-2015
  - rule_id: validate_data_quality
    applies_to: "Foreground package"
    rule: "Confirm traceability, temporal and technological representativeness, instrument evidence, completeness, missing-data disclosure, and calculation records meet Section 8 requirements."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Factory-gate foreground dataset for an identified frozen fruit or nut product"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Use in process or lifecycle models whose product identity, composition, preparation state, freezing route, geography, time, packaging condition, storage profile, and system boundary are compatible with the published dataset"
  excluded_use: "Automatic representation of all CPC 21493 products by the Banana UUID; use for a non-banana species without flow replacement or manual review; use as a fresh, dried, canned, pureed, jammed, roasted, salted, or frozen-vegetable dataset; extrapolation of product-specific Codex requirements beyond covered products; undisclosed cradle-to-grave claims from this factory-gate profile"
  required_metadata: "PCR id and status; actual product-flow name and UUID; explicit Banana-UUID applicability decision; species or mixture and variety where material; ingredient composition; raw-material state and origin; uncooked/cooked/blanched state; presentation and freezing route; release-temperature specification and result; facility geography and technology; reference period; packaging; on-site storage temperature and duration; applicable standards; boundary; allocation; upstream datasets; data-quality and uncertainty disclosures"
  required_quality_disclosure: "Primary-data coverage; meter, scale, probe, and refrigerant-record evidence; process and mass reconciliation; allocation drivers; data gaps and exclusions; temporal, geographic, and technological representativeness; standard-scope checks; deviations and sensitivity results"
  update_trigger: "New or corrected Tiangong product-flow identity; use for any non-banana product; changed species, composition, cooking state, freezing technology, release specification, packaging, storage system, refrigerant, facility, material supplier region, allocation relationship, product-specific standard, or material foreground data; evidence that a cited source has been revised or superseded"
