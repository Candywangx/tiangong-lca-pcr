system_boundary:
  rules:
    - rule_id: boundary_foreground_operations
      applies_to: "foreground production"
      rule: "Include receipt, preparation, the one selected provisional-preservation route, storage and dispatch, together with all known material, water, energy, product, waste and direct elementary flows crossing those process boundaries."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_route_exclusivity
      applies_to: "preservation route"
      rule: "Select exactly one route for each modelled lot: solution_preservation or gas_non_solution_preservation. Do not model both as simultaneously occurring. A genuinely combined treatment is outside this candidate PCR until reviewed route-specific evidence expands the scope."
      source_ids: []
    - rule_id: boundary_upstream_links
      applies_to: "purchased inputs"
      rule: "Link representative upstream datasets for the incoming vegetable, water, preservative agents, energy, packaging and other purchased inputs; do not recreate those upstream processes inside the foreground."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_food_safety_controls
      applies_to: "food-contact operations"
      rule: "Include the activity records needed to describe and verify applicable GHP/HACCP controls, including water suitability, sanitation, formulation, time, temperature, pH or other facility-identified control parameters."
      source_ids:
        - codex-cxc-1-1969
boundary_abstraction:
  declared_starting_condition: "accepted fresh or otherwise declared pre-processed vegetable lot at the preserving facility gate"
  starting_condition_role: "purchased product input with identity, condition, mass basis and upstream dataset declared"
  product_classification_scope: "CPC 3.0 subclass 21330 intermediate vegetables provisionally preserved and unsuitable in that state for immediate consumption"
  recursive_input_rule: "if an input is already a provisionally preserved vegetable in this same category, record it as a purchased starting-condition input and link a separate upstream dataset; do not repeat its earlier preservation operations in this foreground"
  upstream_dataset_requirement: "representative datasets are required for all purchased vegetables, preservative agents, water, energy, packaging and waste-treatment services"
  disclosure: "declare vegetable identity, incoming condition, route, formulation, reference-mass basis, accompanying medium, storage conditions, factory gate, exclusions and all data gaps or temporary estimates"
