validation_rules:
  - rule_id: validate_reference_flow_semantics
    applies_to: "reference product flow"
    rule: "Fail if the dataset product is not tomato while the reference product UUID remains 4dc258f9-c5fc-47d7-821e-12526fe6b5d7; require a verified semantically appropriate flow before publication."
    source_ids: []
  - rule_id: validate_route_exclusivity
    applies_to: "process selection"
    rule: "Require exactly one of solution_preservation and gas_non_solution_preservation for each lot; fail on neither, both, or an undeclared combined route."
    source_ids: []
  - rule_id: validate_product_state
    applies_to: "category applicability"
    rule: "Require evidence that the output is provisionally preserved, unsuitable in that state for immediate consumption and intended for further processing; otherwise reject CPC-21330 applicability."
    source_ids:
      - unsd-cpc-v3-21330
  - rule_id: validate_reference_mass_basis
    applies_to: "reference and normalized amounts"
    rule: "Require one declared gross, net or drained mass basis, separate vegetable and medium masses, and consistent use of that basis in every normalization."
    source_ids: []
  - rule_id: validate_inventory_coverage
    applies_to: "foreground processes"
    rule: "Require all known material, water, energy, product, waste and direct elementary flows, with every exclusion and data gap disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "each batch and process"
    rule: "Require non-negative amounts and a documented mass-balance residual within the facility's declared acceptance criterion; investigate and disclose failures."
    source_ids: []
  - rule_id: validate_food_control_evidence
    applies_to: "applicable preservation controls"
    rule: "Require product description, intended use and applicable monitoring/verification records defined by the facility's GHP/HACCP system."
    source_ids:
      - codex-cxc-1-1969
  - rule_id: validate_reasoned_estimate
    applies_to: "temporary unmetered energy row"
    rule: "Require declared equipment, operating hours, load-factor rationale, scenario bounds, temporary status and replacement trigger; fail publication if the estimate remains unreviewed."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground unit-process data package for a provisionally preserved vegetable intermediate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "factory-gate datasets within CPC 21330 that match the declared vegetable, route, formulation, product-mass basis, storage conditions, geography and unsuitable-for-immediate-consumption state"
  excluded_use: "fresh, frozen, dried, ready-to-eat or finally preserved vegetables; undeclared combined preservation routes; non-tomato datasets using the Tomato UUID; comparative assertions across unlike products, mass bases or routes without further review"
  required_metadata: "vegetable species and cultivar; Tiangong flow and semantic review; CPC reference; route; formulation; vegetable and medium mass; reference-mass basis; batch and site; geography; storage temperature and duration; packaging; factory gate; further-processing requirement; temporal coverage; protocol coverage; allocation; exclusions"
  required_quality_disclosure: "foreground-data coverage; calibration and reconciliation evidence; technological, geographical and temporal representativeness; precision; mass-balance residuals; food-control records; reasoned estimates and replacement status"
  update_trigger: "change in vegetable or Tiangong flow; route, agent, formulation, equipment, storage, packaging, geography or allocation; representative-batch evidence replacing an estimate; revised CPC, Codex or PEF evidence; review finding affecting scope or controls"
