allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "route and process-specific burdens"
    rule: "Avoid allocation by separately recording preparation, the selected preservation route, storage and dispatch, and by submetering or subdividing shared operations where feasible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "inseparable shared operations"
    rule: "If subdivision is not feasible, allocate by a documented relevant physical relationship that reflects causality, such as metered operating time, treated mass or occupied storage capacity and duration. Report the factor and all quantities used."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relationship
    applies_to: "remaining multifunctionality"
    rule: "Use another relationship, including economic allocation, only after documenting why subdivision/system expansion and a relevant physical relationship are not feasible; disclose prices, period and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rejects
    applies_to: "vegetable rejects, spent solution and treatment residues"
    rule: "Treat a stream as waste and assign its treatment burden to the foreground unless a demonstrated product function and destination support co-product treatment; do not claim an avoided burden by default."
    source_ids:
      - eu-pef-2021-2279
