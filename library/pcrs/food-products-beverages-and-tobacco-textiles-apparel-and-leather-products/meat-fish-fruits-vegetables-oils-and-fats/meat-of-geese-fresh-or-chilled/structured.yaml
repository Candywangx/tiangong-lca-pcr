        - "refrigerant balance"
        - "blend composition"
      output: "refrigerant input and component-specific air releases"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - id: calc_packaging_mass
      applies_to: "packaging"
      rule: "Multiply issued units by verified unit mass, adjust for returns and inventory change, and keep each material and scrap stream separate."
      inputs:
        - units
        - "unit mass"
        - returns
        - stocks
        - scrap
      output: "material-specific packaging inputs and wastes"
      source_ids:
        - eu-pef-method-2021
    - id: calc_wastewater_load
      applies_to: "water emissions"
      rule: "Multiply matched discharged volume by the representative concentration for each parameter with unit conversion documented."
      inputs:
        - "effluent volume"
        - "parameter concentration"
      output: "parameter-specific mass release"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - id: calc_combustion_emissions
      applies_to: "on-site combustion"
      rule: "Use direct monitoring or a documented calculation tied to each fuel inventory and measured operating period; retain pollutant identities separately."
      inputs:
        - "fuel inventory"
        - monitoring
        - "operating time"
        - composition
      output: "pollutant-specific air releases"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
    - id: calc_allocation
      applies_to: "joint co-products"
      rule: "Apply the declared allocation hierarchy only after subdivision and direct measurement; disclose data, formula and reporting-period basis."
