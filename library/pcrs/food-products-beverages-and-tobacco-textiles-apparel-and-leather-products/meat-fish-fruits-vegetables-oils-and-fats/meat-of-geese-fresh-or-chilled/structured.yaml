validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "Use Meat of geese, fresh or chilled a2ca6142-7a35-485f-85fd-3f19301fa6c5, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 and kg."
    source_ids: []
  - rule_id: val_product_scope
    applies_to: "reference product"
    rule: "Reject datasets whose reference product is frozen goose meat, foie gras, goose liver, goose heart, goose gizzard, goose intestines or another offal product."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: val_atomic_inventory
    applies_to: "all inventory rows"
    rule: "Require one concrete exchange and a non-empty explanatory paragraph per card; reject collection labels and material, utility, waste or emission selectors."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_uuid_closure
    applies_to: "identity"
    rule: "Permit only dual-kernel-confirmed UUIDs; require every blank non-reference UUID to have the same row_id in manifest review metadata."
    source_ids: []
  - rule_id: val_no_inferred_quantities
    applies_to: "amounts"
    rule: "Require foreground records, calculated values or the fixed reference amount; reject AI-generated or inference-only ranges."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_mass_balance
    applies_to: "reception through cutting"
    rule: "Reconcile input mass with products, co-products, wastes, discharged loads and inventory changes for the same period."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_energy_water_balance
    applies_to: "utilities"
    rule: "Reconcile imported, generated and internally transferred electricity, steam, hot water, fuels and water without double counting."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_refrigerant_balance
    applies_to: "refrigeration"
    rule: "Require each installed refrigerant and every emitted component to be separately identified and reconciled to service records."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_packaging
    applies_to: "packaged product"
    rule: "Match each packaging input, scrap stream and declared pack format while excluding packaging mass from reference-product mass."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_wastewater
    applies_to: "wastewater"
    rule: "Match measured wastewater volumes to treatment, hand-off and parameter-specific discharge loads."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
  - rule_id: val_co_product_status
    applies_to: "slaughter by-products"
    rule: "Require one product or waste status and one destination for each feather, blood, organ, fat, skin, bone, head and foot stream; reject duplicate product-and-waste accounting."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_allocation
    applies_to: "co-products"
    rule: "Require the declared subdivision and allocation hierarchy, input data, formula and reporting-period basis."
    source_ids:
      - eu-pef-method-2021
