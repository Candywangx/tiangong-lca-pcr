allocation_rules:
  - rule_id: alloc_subdivision_first
    applies_to: "slaughter, dressing and cutting"
    rule: "Use subdivision and direct process measurement before allocation wherever separate operations and records are available."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_co_product_status
    applies_to: "feathers, blood, organs, fat, skin, bones, heads and feet"
    rule: "Determine product or waste status at the actual hand-off point and use only the matching product or waste row; never count the same physical mass in both."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: alloc_physical_relation
    applies_to: "unavoidable joint co-products"
    rule: "When subdivision is not possible, use an evidence-backed physical causal relation only when it reflects how inputs and emissions change with co-product production."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_economic_fallback
    applies_to: "remaining joint co-products"
    rule: "If no defensible physical relation exists, use a documented economic allocation consistent with the applicable study programme and reporting period; do not invent a default factor."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_waste_no_credit
    applies_to: "waste streams"
    rule: "Assign treatment burdens to the declared hand-off without an avoided-product credit unless the applicable downstream model explicitly requires and documents that scenario."
    source_ids:
