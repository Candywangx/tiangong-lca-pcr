  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "Divide the reporting-period amount for one atomic exchange by released net reference-product mass."
      inputs:
        - "exchange amount"
        - "released net product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_live_goose_balance
      applies_to: "reception through dressing"
      rule: "Reconcile accepted live mass with dressed carcass, separately measured co-products, wastes, wastewater-carried material and inventory change; investigate unexplained imbalance."
      inputs:
        - "accepted live mass"
        - "all measured outputs"
        - "inventory change"
      output: "reconciled slaughter mass balance"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - id: calc_internal_transfer
      applies_to: "intermediates, water and utilities"
      rule: "Match the sending-process output to the receiving-process input for the same identity and reporting period; remove any duplicate external exchange."
      inputs:
        - "linked output"
        - "linked input"
        - "inventory change"
      output: "reconciled internal transfer"
      source_ids:
        - eu-pef-method-2021
    - id: calc_refrigerant_loss
      applies_to: "refrigeration"
      rule: "Calculate each refrigerant loss from stock, purchase, charge, recovery and return records; for blends, calculate each emitted component using documented composition."
