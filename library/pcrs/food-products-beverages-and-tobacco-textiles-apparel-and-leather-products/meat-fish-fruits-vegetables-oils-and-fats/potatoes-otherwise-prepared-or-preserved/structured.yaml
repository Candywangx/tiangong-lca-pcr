allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Shared preparation, transformation, freezing, storage, packaging, and utility systems"
    rule: "First avoid allocation by sub-metering, separate batch records, and process subdivision. Collect inventory only for operations directly attributable to the declared product whenever subdivision is feasible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "Unavoidable multifunctional processes"
    rule: "If subdivision or system expansion is not feasible, use a documented physical relationship that reflects causality, such as measured processing time, delivered heat, refrigeration load, or another verified driver. Mass allocation alone is not automatically causal."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relationship
    applies_to: "Multifunctionality without a defensible physical relationship"
    rule: "Use economic or another relationship only after documenting why subdivision, system expansion, and physical allocation are not feasible; retain prices, reference period, currency, and sensitivity evidence."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residue_status
    applies_to: "Potato residues, spent oil, rework, and off-specification product"
    rule: "Distinguish internal rework, saleable co-product, recyclable material, and waste using actual disposition and economic status. Do not credit avoided production inside this foreground inventory; any downstream substitution or system expansion shall be a separate transparent scenario."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_inputs
      process_id: "receiving_and_preparation_product_transformation"
      flow_role: "potatoes, ingredients, oils, processing aids"
      record_type: "weighbridge, scale, batch issue, supplier lot, stock ledger"
      raw_fields: "material identity; supplier; lot; origin; opening stock; receipts; batch issue; returns; closing stock; measured mass"
      collection_method: "calibrated scales plus stock reconciliation"
      unit: "kg"
      frequency: "each lot and batch; monthly reconciliation"
      temporal_coverage: "declared representative production period covering normal product mix"
      site_scope: "all facilities and lines in the dataset"
      aggregation_rule: "sum net consumed mass by material and divide by net saleable output"
      quality_evidence: "calibration certificates; supplier records; inventory reconciliation; missing-data log"
    - protocol_id: cp_water_and_wastewater
      process_id: "receiving_and_preparation_product_transformation"
      flow_role: "fresh water and wastewater"
      record_type: "meter and water-balance records"
      raw_fields: "meter id; opening and closing reading; make-up water; recirculation; discharge; evaporation estimate; product carryover; treatment destination"
      collection_method: "line meter where available; otherwise documented facility balance and causal allocation"
      unit: "kg or m3 with density conversion"
      frequency: "continuous or shift readings; monthly reconciliation"
      temporal_coverage: "declared representative production period"
      site_scope: "all included preparation, transformation, and sanitation operations"
      aggregation_rule: "reconcile input, reuse, discharge, evaporation, and product carryover; normalize to reference output"
      quality_evidence: "meter calibration; balance closure; discharge invoice or treatment log"
    - protocol_id: cp_energy_records
      process_id: "product_transformation_quick_freezing_and_cold_storage_packaging_and_release"
      flow_role: "electricity, fuel, steam, and heat"
      record_type: "utility meters, invoices, equipment runtime"
      raw_fields: "carrier; meter id; readings; fuel quantity; calorific value; steam or heat quantity; runtime; product mass; storage residence time"
      collection_method: "sub-metering preferred; otherwise engineering allocation using verified runtime or refrigeration load"
      unit: "kWh, MJ, or carrier unit with conversion"
      frequency: "continuous or batch readings; monthly reconciliation"
      temporal_coverage: "declared representative production period including seasonal frozen-storage conditions where applicable"
      site_scope: "all included equipment and shared utilities"
      aggregation_rule: "subtract non-production loads; subdivide or apply documented causal driver; normalize to reference output"
      quality_evidence: "meter calibration; invoices; runtime logs; conversion-factor source"
    - protocol_id: cp_product_mass
      process_id: "all_processes"
      flow_role: "internal transfers, saleable output, rework, and losses"
      record_type: "calibrated scale and production ledger"
      raw_fields: "batch id; product form; input mass; transfer mass; saleable output; rework; samples; off-specification mass"
      collection_method: "weigh each transfer or reconcile calibrated continuous mass-flow measurement"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "full declared production period"
      site_scope: "all included product lines"
      aggregation_rule: "reconcile consecutive process outputs and normalize to exactly 1 kg net saleable output"
      quality_evidence: "scale calibration; batch mass balance; release records"
    - protocol_id: cp_waste_outputs
      process_id: "all_processes"
      flow_role: "residues, off-specification product, spent oil, wastewater solids, packaging scrap"
      record_type: "scales, waste manifests, internal treatment logs"
      raw_fields: "material; mass; moisture or concentration where relevant; destination; rework status; economic value; transporter"
      collection_method: "weigh by stream and retain destination evidence"
      unit: "kg"
      frequency: "each removal or batch; monthly reconciliation"
      temporal_coverage: "full declared production period"
      site_scope: "all included lines and waste-handling areas"
      aggregation_rule: "sum by material and disposition; do not net saleable co-products against waste"
      quality_evidence: "scale calibration; manifests; invoices; treatment acceptance records"
    - protocol_id: cp_direct_emissions
      process_id: "product_transformation"
      flow_role: "direct emissions to air, water, and soil"
      record_type: "stack or effluent measurement and activity-factor calculation"
      raw_fields: "pollutant; compartment; concentration; flow rate; operating time; fuel use; factor; factor source"
      collection_method: "direct measurement preferred; otherwise site activity multiplied by documented factor"
      unit: "pollutant-specific kg"
      frequency: "monitoring schedule or each operating period"
      temporal_coverage: "period representative of actual controls and product mix"
      site_scope: "all included direct release points"
      aggregation_rule: "calculate by pollutant and compartment, then normalize to reference output"
      quality_evidence: "laboratory accreditation; instrument calibration; sampling plan; factor reference"
    - protocol_id: cp_frozen_chain_records
      process_id: "quick_freezing_and_cold_storage"
      flow_role: "mass, entry temperature, thermal-centre temperature, storage and dispatch condition"
      record_type: "calibrated temperature sensor, batch record, cold-store log"
      raw_fields: "batch id; entry time and temperature; freezer exit time; thermal-centre temperature after stabilization; storage duration; air temperature; dispatch temperature; product mass"
      collection_method: "continuous air monitoring plus validated direct or indirect product-temperature checks"
      unit: "degree Celsius, hour, kg"
      frequency: "each batch plus continuous cold-store monitoring"
      temporal_coverage: "all frozen batches in the declared period"
      site_scope: "all quick-freezing equipment and cold stores serving included batches"
      aggregation_rule: "retain batch extrema and calculate mass-weighted storage duration; never average away a temperature excursion"
      quality_evidence: "sensor calibration; alarm and deviation log; corrective-action record"
    - protocol_id: cp_refrigerant_records
      process_id: "quick_freezing_and_cold_storage"
      flow_role: "refrigerant make-up, recovery, and release"
      record_type: "purchase, inventory, recovery, and maintenance records"
      raw_fields: "refrigerant identity; opening stock; purchases; charging; recovery; closing stock; equipment id"
      collection_method: "annual or campaign inventory reconciliation supported by service records"
      unit: "kg"
      frequency: "each service event and period-end reconciliation"
      temporal_coverage: "full declared period"
      site_scope: "all freezing and cold-storage equipment"
      aggregation_rule: "loss = opening stock + purchases + charged returns - closing stock - recovered or transferred quantity"
      quality_evidence: "service invoice; cylinder weights; leak test; reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "packaging_and_release"
      flow_role: "packaging materials and packed units"
      record_type: "bill of materials, purchase and stock records, pack counter"
      raw_fields: "material; component mass; units packed; opening stock; receipts; scrap; closing stock; reuse count"
      collection_method: "component weighing plus stock and unit-count reconciliation"
      unit: "kg and count"
      frequency: "each packaging specification; monthly reconciliation"
      temporal_coverage: "full declared production period"
      site_scope: "all packaging formats included in the dataset"
      aggregation_rule: "calculate material mass per net product mass by format, then aggregate using actual output shares"
      quality_evidence: "packaging specification; supplier declaration; stock reconciliation; reuse log"
  calculation_rules:
    - id: normalize_to_reference_mass
      applies_to: "Every foreground amount"
      rule: "normalized amount = recorded quantity / net saleable finished-product mass; convert the result to the required SI unit and retain original quantity and conversion"
      inputs:
        - "recorded quantity"
        - "net saleable finished-product mass"
        - "conversion factor"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: batch_mass_balance
      applies_to: "Each process and whole foreground package"
      rule: "Reconcile all material inputs with product, co-product, rework, waste, wastewater-carried material where measured, emissions, and documented stock change; investigate rather than silently allocate unexplained imbalance"
      inputs:
        - "material inputs"
        - outputs
        - rework
        - waste
        - "stock change"
        - "measured releases"
      output: "disclosed balance closure and unexplained difference"
      source_ids:
        - eu-pef-2021-2279
    - id: wastewater_balance
      applies_to: "Preparation and transformation wastewater"
      rule: "discharge = fresh make-up + imported water in materials - water in product - evaporation - exported or recovered water - stock change, using measured terms and disclosing estimated terms"
      inputs:
        - "water meter"
        - recirculation
        - "product moisture where available"
        - evaporation
        - "recovered water"
      output: "wastewater quantity by destination"
      source_ids:
        - eu-pef-2021-2279
    - id: direct_emission_calculation
      applies_to: "Pollutant-specific releases without continuous direct measurement"
      rule: "emission = site activity x documented emission factor x (1 - measured control efficiency where applicable); never reuse one factor across different pollutants or technologies without justification"
      inputs:
        - "activity record"
        - factor
        - "control efficiency"
        - "operating period"
      output: "pollutant mass by compartment per reference flow"
      source_ids:
        - eu-pef-2021-2279
    - id: refrigerant_balance
      applies_to: "Freezing and cold-storage refrigerants"
      rule: "Reconcile opening stock, purchases, charges, recovered mass, transfers, and closing stock by refrigerant; positive unexplained loss is recorded as emission to air"
      inputs:
        - "refrigerant inventory and service records"
      output: "refrigerant-specific release per reference flow"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and all batches"
      requirement: "Product form, recipe class, actual unit operations, packaging format, frozen state, plant, geography, and reference period shall be traceable to production and release records."
      evidence: "product specification; bill of materials; batch record; release record"
    - id: dq_measurement
      applies_to: "Mass, water, energy, temperature, and emissions"
      requirement: "Use calibrated meters or documented engineering calculations; retain units, conversion factors, meter coverage, allocation drivers, and missing-data treatment."
      evidence: "calibration certificates; meter map; calculation workbook or machine-readable equivalent"
    - id: dq_temporal_coverage
      applies_to: "Foreground averages"
      requirement: "Use a declared period representative of normal operation, product mix, maintenance, and seasonal cold-storage conditions; disclose shutdowns, start-up, atypical campaigns, and data gaps."
      evidence: "production calendar; meter and batch coverage report; missing-data log"
    - id: dq_completeness
      applies_to: "All foreground processes"
      requirement: "Demonstrate coverage of all known product, co-product, material, water, energy, packaging, waste, wastewater, and direct elementary flows; explicitly justify exclusions and quantify applicable cut-offs."
      evidence: "flow checklist; mass and water balances; source and proxy register; exclusion log"
    - id: dq_representativeness
      applies_to: "Foreground and linked upstream datasets"
      requirement: "Assess technological, geographical, and time-related representativeness and precision; disclose proxies and any mismatch to the declared route."
      evidence: "dataset metadata; DQR assessment; proxy justification"
    - id: dq_frozen_chain
      applies_to: "Quick-frozen product"
      requirement: "Retain calibrated temperature records, excursions, corrective actions, and storage duration for every included frozen batch; do not average away nonconforming excursions."
      evidence: "sensor calibration; batch and cold-store log; deviation and disposition record"
    - id: dq_allocation
      applies_to: "Shared or multifunctional processes"
      requirement: "Retain evidence that subdivision was attempted and document every driver, factor, price, reference period, and sensitivity used for remaining allocation."
      evidence: "meter map; allocation workbook; price record; sensitivity result"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "Reference output"
    rule: "Confirm the quantitative reference is exactly 1 kg net saleable product using flow b158bec4-e459-437d-8106-88d2f3d92c8a, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, mass unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids:
      - unstats-cpc-3-0
  - rule_id: validate_scope_and_qualifiers
    applies_to: "Product identity"
    rule: "Reject a package that omits product form, recipe or ingredient class, actual cooking or preservation route, frozen state, packaging format, production geography, technology, allocation status, or plant-gate release condition, or that falls in an explicitly excluded potato category."
    source_ids:
      - unstats-cpc-3-0
      - codex-cxs-114-1981
  - rule_id: validate_process_route
    applies_to: "Process map and inventory"
    rule: "Confirm every required process is represented, the conditional frozen process matches the declared product state, and every potentially applicable unit operation has an explicit included, not-applicable, or supplier-completed disposition."
    source_ids:
      - codex-cxs-114-1981
      - codex-cxc-8-1976
  - rule_id: validate_mass_and_water_balance
    applies_to: "Foreground inventory"
    rule: "Require process and whole-package mass reconciliation plus a water balance when water or wastewater is material; unresolved differences shall be findings, not silently allocated amounts."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_frozen_condition
    applies_to: "Quick-frozen product"
    rule: "Confirm thermal-centre temperature reached -18 degree Celsius or colder after stabilization and that on-site cold storage and dispatch records demonstrate temperature control; report every excursion and disposition."
    source_ids:
      - codex-cxs-114-1981
      - codex-cxc-8-1976
  - rule_id: validate_allocation
    applies_to: "Shared and multifunctional processes"
    rule: "Confirm the hierarchy of subdivision or system expansion, physical relationship, then other relationship was followed and documented; verify residue status and prevent undisclosed avoided-burden credits."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_completeness_and_cutoff
    applies_to: "Foreground and linked datasets"
    rule: "Confirm all known inputs and outputs are addressed, proxies and exclusions are disclosed, and any downstream PEF cut-off is screened, justified, and within the applicable cumulative threshold."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_source_traceability
    applies_to: "Records, factors, and generated dataset"
    rule: "Confirm foreground records are traceable to calibration, supplier, meter, batch, waste, emission, and temperature evidence; confirm every external factor has a stable source and that no provisional reasoned estimate is presented as observed data."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Product-specific foreground manufacturing data package normalized to 1 kg net finished potato product at plant gate"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product-specific process and lifecycle-model construction when route, recipe, technology, geography, frozen state, packaging, allocation, temporal coverage, and upstream links are compatible and disclosed"
  excluded_use: "Unqualified category-average claims; agricultural potato production without an upstream dataset; simple frozen, boiled, steamed, vinegar-preserved, or dried potato products outside this scope; consumer cooking; distribution, retail, or end-of-life claims not separately modelled; environmental declarations based on provisional reasoned-estimate ranges"
  required_metadata: "PCR id and version used; reference product UUID; product form; recipe or ingredient class; unit operations; frozen state; packaging format; net content; plant and geography; technology; reference period; source and proxy register; upstream dataset identities; allocation and cut-off declarations; data-quality assessment"
  required_quality_disclosure: "Meter and record coverage; calibration evidence; mass and water balance closure; temporal, technological, and geographical representativeness; missing data; proxy use; allocation sensitivity; co-product and waste disposition; temperature excursions for frozen product; status of provisional ranges"
  update_trigger: "Material change in product specification, recipe, yield, processing technology, energy or refrigerant system, frozen-state management, packaging, supplier geography, allocation relationship, regulatory or Codex requirement, data source, or representative production period"
