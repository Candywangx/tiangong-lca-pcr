validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require reference amount 1 kg, product flow UUID ab283f96-8c07-4a11-8904-4d5a6542d1fe, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Fail completeness when any required qualifier is absent or when liver and roe, species, route, packaging, storage state, or net-mass basis cannot be determined."
    source_ids:
      - unsd-cpc-3-0-21227
  - rule_id: validate_route_presence
    applies_to: "Process inventory"
    rule: "Require at least one of drying, smoking, dry salting, wet salting, or in-brine preservation and require every declared route operation to appear in the process map and records."
    source_ids:
      - codex-cxc-52-2003
      - fao-fish-processing-storage
  - rule_id: validate_route_conditional_flows
    applies_to: "Preservation inputs and outputs"
    rule: "Require salt for a declared salting or brining route, make-up water and spent brine accounting for a brining route, smoke material and direct-emission review for direct smoking, and energy or ambient-condition disclosure for drying. Mark non-applicable route flows explicitly rather than assigning an unexplained zero."
    source_ids:
      - codex-cxc-52-2003
      - fao-fish-processing-storage
  - rule_id: validate_mass_balance
    applies_to: "Each process and production lot"
    rule: "Check incoming material = transferred product + measured residuals + product losses + explained mass change, allowing declared moisture gain or loss and documented inventory change. Report the balance gap and basis."
    source_ids: []
  - rule_id: validate_collection_links
    applies_to: "Foreground and calculated inventory rows"
    rule: "Require a valid collection protocol for every foreground_record and calculated_value row and all calculation-rule inputs needed to reproduce the value."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "Multi-output processes and upstream input"
    rule: "Require the allocation hierarchy, driver, factors, co-product or waste classification, upstream liver or roe allocation treatment, and sensitivity disclosure where economic allocation is used."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_food_safety_records
    applies_to: "Preservation, packaging, and storage process identity"
    rule: "Require the applicable product- and line-specific hazard-control records and actual operating-condition records; do not claim product compliance from this LCA validation."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_estimate_status
    applies_to: "Provisional ranges and values"
    rule: "Reject presentation of a reasoned_estimate as a measured, source-backed, typical, or allowed industry range; require disclosure and replacement priority."
    source_ids: []
  - rule_id: validate_source_integrity
    applies_to: "Source references and quantitative factors"
    rule: "Require every non-empty source id to resolve in Data Sources. Require an actual external source for any emission factor, conversion factor, or quantitative constraint not derived solely from collected records."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for preserved fish liver or roe at the preserving facility gate"
  downstream_use: "secondary_dataset; background_dataset after review for scope and representativeness"
  allowed_use: "Product, process, or lifecycle-model studies matching the declared species or species group, liver or roe product, preservation route, packaging, storage condition, geography, period, net-mass basis, and upstream allocation context"
  excluded_use: "Fresh-only, chilled-only, frozen-only, canned, non-fish, or composite products; undeclared preservation routes; legal food-safety compliance claims; substitution across materially different species, product forms, technologies, packaging atmospheres, or storage regimes without sensitivity analysis"
  required_metadata: "Canonical PCR id and version used; product flow UUID; species or species group; liver or roe; upstream origin and dataset; incoming state; actual route sequence; product specification; net mass; moisture or drying-state basis; salt or brine basis; smoking technology; packaging materials and atmosphere; storage temperature class and duration; facility geography; reporting period; allocation; data sources; estimate status"
  required_quality_disclosure: "Foreground coverage and gaps; mass, water, energy, and packaging reconciliation; technological, geographical, and temporal representativeness; uncertainty; proxy datasets; upstream co-product treatment; missing UUIDs; retained reasoned estimates; food-safety record availability; sensitivity to allocation and important estimates"
  update_trigger: "Change in species or source mix, incoming state, preservation route, equipment, recipe or brine management, energy carrier, smoke fuel, packaging, storage regime, facility, reporting period, upstream allocation, important dataset, resolved UUID, source-backed benchmark, or a material validation finding"
