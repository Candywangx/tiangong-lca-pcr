system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground system covers operations controlled by the preserving facility from receipt of identified livers or roes through release of the finished packaged product. Include actual cleaning, sorting, membrane or tissue removal, draining, thawing, salting, brining, drying, smoking, cooling, intermediate storage, packaging, finished-product storage, sanitation-related process water, on-site waste handling, and on-site wastewater treatment when performed and attributable."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Use upstream datasets for incoming fish livers or roes, salt and other ingredients, water, energy carriers, fuels, packaging materials, refrigerants, transport services, and treatment services. Distribution after the facility gate, retail, consumer preparation, consumption, and end-of-life of packaging are outside the foreground boundary unless a study explicitly adds them as downstream scenarios."
      source_ids: []
    - rule_id: boundary_actual_route
      applies_to: "Foreground preservation system"
      rule: "Include every preparation, preservation, packaging, holding, and on-site treatment operation actually used for the declared lot; do not insert an unused drying, smoking, salting, or brining route."
      source_ids:
        - codex-cxc-52-2003
        - fao-fish-processing-storage
    - rule_id: boundary_upstream_inputs
      applies_to: "Inputs crossing the facility gate"
      rule: "Represent upstream production and inbound transport through traceable upstream datasets and disclose any missing or proxy dataset; do not assign zero burden to incoming livers, roes, salt, fuel, packaging, or utilities."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_food_safety_controls
      applies_to: "Product- and line-specific controls"
      rule: "Document the applicable hazard analysis, control points, monitoring records, and release criteria for the actual product and line. Food-safety records support process identity and quality but do not replace environmental inventory measurements."
      source_ids:
        - codex-cxc-52-2003
    - rule_id: boundary_storage_losses
      applies_to: "Intermediate and finished-product storage"
      rule: "Include electricity, refrigerant losses, product losses, and waste handling attributable to storage inside the declared facility boundary and period."
      source_ids:
        - fao-fish-processing-storage
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "Identified edible fish livers or roes received at the preserving facility in a declared fresh, chilled, or frozen state, with species or species group, source, supplier, lot, upstream dataset, and net received mass recorded"
  starting_condition_role: "Upstream product input to the foreground preserving system"
  product_classification_scope: "Fish livers and fish roes whose finished state is produced by drying, smoking, salting, or holding in brine within CPC 3.0 code 21227 mapping context"
  recursive_input_rule: "If an already preserved fish liver or roe product in this category is used as an input, record it once as an upstream product flow with its own dataset. Do not recursively re-run this PCR unless the foreground facility performs a further named preservation transformation."
  upstream_dataset_requirement: "Each incoming fish liver or roe input requires a traceable upstream dataset that declares capture or aquaculture origin, species, primary-processing boundary, co-product or by-product treatment, allocation method, geography, period, and incoming preservation state. Other material and energy inputs require representative upstream datasets or disclosed proxies."
  disclosure: "Declare facility location, reporting period, species or species group, liver or roe, incoming state, actual preservation sequence, product formulation, net-mass basis, packaging, storage condition and duration, rejected material, co-products, wastes, on-site treatment, upstream dataset choices, allocation, proxies, and retained reasoned estimates."
