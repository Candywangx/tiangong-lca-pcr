allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Multi-output preparation, preservation, packaging, and utility systems"
    rule: "Avoid allocation where measured process subdivision or direct metering can assign inputs, energy, emissions, wastes, and losses to the liver or roe product."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relation
    applies_to: "Unavoidable joint processes with multiple valuable outputs"
    rule: "When subdivision is not possible, use a documented physical causal relationship that reflects how the joint process changes with output production. Mass allocation may be used only when mass is an appropriate causal proxy."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_fallback
    applies_to: "Joint valuable outputs without a defensible physical causal relationship"
    rule: "Use economic allocation only as a fallback. Record prices, currency, geography, averaging period, product state, and treatment of abnormal or missing prices, and test material sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_incoming_material
    applies_to: "Upstream fish liver or roe dataset"
    rule: "Preserve and disclose the upstream dataset's treatment of livers or roes arising with fish meat or other co-products. Do not replace upstream allocation with zero burden at the preservation facility gate."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residual_destination
    applies_to: "Removed tissue, off-specification product, spent brine, and packaging residuals"
    rule: "Classify each output as waste or recovered co-product according to its actual destination and applicable rules. Do not grant an avoided-burden credit without an explicit downstream substitution model outside this foreground inventory."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "receipt_preparation_preservation_processing_packaging_storage"
      flow_role: "Incoming, transferred, finished, rejected, and lost liver or roe material"
      record_type: "Weighbridge, batch scale, production, and disposition records"
      raw_fields: "lot id; species; liver or roe; incoming state; gross mass; tare; accepted mass; transfer mass; finished net mass; rejected mass; destination; timestamp"
      collection_method: "Calibrated weighing at each transfer or reconciled lot records"
      unit: "kg"
      frequency: "Each lot and transfer"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All included lines, shifts, and sites"
      aggregation_rule: "Sum by lot and process; reconcile transfers and normalize to net finished product"
      quality_evidence: "Scale calibration; signed batch record; reconciliation record; disposition evidence"
    - protocol_id: cp_water_records
      process_id: "receipt_preparation_preservation_processing"
      flow_role: "Preparation water, brine water, condensate, and wastewater"
      record_type: "Meter, batch recipe, tank, and discharge records"
      raw_fields: "meter id; opening and closing readings; batch additions; reuse; discharge; condensate; process; lot; timestamp"
      collection_method: "Sub-meter where available; otherwise documented water balance using measured batch additions"
      unit: "kg or m3 with density conversion"
      frequency: "Each batch or meter interval"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All included water users and discharge points"
      aggregation_rule: "Subtract documented reuse and non-process use; allocate shared totals by disclosed causal driver"
      quality_evidence: "Meter calibration; recipe; tank log; discharge record; balance closure"
    - protocol_id: cp_ingredient_records
      process_id: "preservation_processing"
      flow_role: "Salt, brine constituents, and other declared preservation ingredients"
      record_type: "Purchase, issue, recipe, return, and inventory records"
      raw_fields: "ingredient; supplier; lot; composition; issued mass; returned mass; solution mass; concentration basis; production lot"
      collection_method: "Mass reconciliation by ingredient and batch"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All included preservation lines"
      aggregation_rule: "Net issued mass equals issued minus documented return; keep solution water and solute separately calculable"
      quality_evidence: "Invoice; specification; calibrated scale; recipe approval; inventory reconciliation"
    - protocol_id: cp_energy_records
      process_id: "receipt_preparation_preservation_processing"
      flow_role: "Electricity, purchased heat, direct fuel, and smoke material"
      record_type: "Meter, fuel issue, operating-hour, and equipment records"
      raw_fields: "carrier; meter; readings; fuel mass or volume; heating value source; operating time; equipment; process; lot"
      collection_method: "Direct metering preferred; engineering allocation only with documented driver"
      unit: "kWh, MJ, or kg by carrier"
      frequency: "Meter interval or batch"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All included process equipment"
      aggregation_rule: "Keep carriers separate; allocate shared use by measured operating parameter and normalize to process output"
      quality_evidence: "Meter calibration; invoice; fuel specification; operating log; allocation worksheet"
    - protocol_id: cp_packaging_records
      process_id: "packaging_storage"
      flow_role: "Packaging inputs, scrap, rejected packs, and finished-product loss"
      record_type: "Bill of materials, issue, return, scrap, and rejection records"
      raw_fields: "material; packaging level; unit mass; units issued; units returned; scrap mass; rejected product; destination"
      collection_method: "Unit-count times verified unit mass or direct mass reconciliation"
      unit: "kg"
      frequency: "Each packaging lot"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All packaging formats and lines"
      aggregation_rule: "Net material equals issued minus returned; separate material and level; normalize to net finished product"
      quality_evidence: "Supplier specification; unit-mass check; issue and scrap records"
    - protocol_id: cp_storage_records
      process_id: "packaging_storage"
      flow_role: "Storage duration, electricity, occupancy, and refrigerant service"
      record_type: "Warehouse, meter, inventory, and maintenance records"
      raw_fields: "product mass; entry and exit time; temperature class; meter readings; occupied capacity; refrigerant type; charge; recovery; stock change; service date"
      collection_method: "Mass-time inventory linked to meters and maintenance balance"
      unit: "kg·day, kWh, and kg refrigerant"
      frequency: "Storage movement and service event"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All included storage rooms and refrigeration systems"
      aggregation_rule: "Allocate shared electricity and refrigerant balance using disclosed mass-time, capacity, or measured load driver"
      quality_evidence: "Temperature log; meter record; inventory movement; maintenance invoice; refrigerant balance"
    - protocol_id: cp_direct_emission_records
      process_id: "preservation_processing"
      flow_role: "Direct fuel combustion or smoke-generation emissions"
      record_type: "Fuel records, stack measurements, and factor documentation"
      raw_fields: "fuel type; fuel quantity; emission substance; measured concentration and flow or factor; factor source; control equipment; operating time"
      collection_method: "Direct measurement where available; otherwise fuel-specific calculation from a cited factor"
      unit: "kg substance"
      frequency: "Each monitored campaign or calculation period"
      temporal_coverage: "Representative included operations"
      site_scope: "All direct smoking or combustion units"
      aggregation_rule: "Calculate each substance separately and normalize to smoked output"
      quality_evidence: "Monitoring report; factor source; fuel record; calculation worksheet"
  calculation_rules:
    - id: calc_normalize_reference_flow
      applies_to: "All inventory rows"
      rule: "normalized amount = attributable process amount / net mass of released finished product"
      inputs:
        - "Attributable amount"
        - "released net finished mass"
      output: "Amount per 1 kg reference flow"
      source_ids: []
    - id: calc_preparation_yield
      applies_to: "receipt_preparation"
      rule: "preparation yield = prepared transfer mass / accepted incoming mass"
      inputs:
        - "Accepted incoming mass"
        - "prepared transfer mass"
      output: "kg prepared product per kg accepted input"
      source_ids: []
    - id: calc_preservation_yield
      applies_to: "preservation_processing"
      rule: "preservation yield = acceptable preserved intermediate mass / prepared feed mass"
      inputs:
        - "Prepared feed mass"
        - "preserved intermediate mass"
      output: "kg preserved intermediate per kg prepared feed"
      source_ids: []
    - id: calc_water_balance
      applies_to: "Preparation and preservation water"
      rule: "wastewater estimate = measured water and solution inputs + relevant product water released - water retained in product or recovered for reuse - measured evaporation, with every term declared"
      inputs:
        - "Water inputs"
        - "brine inputs"
        - reuse
        - "product mass and moisture observations"
        - condensate
        - "evaporation information"
      output: "Wastewater or an explicit unresolved water-balance gap"
      source_ids: []
    - id: calc_shared_energy
      applies_to: "Shared utilities"
