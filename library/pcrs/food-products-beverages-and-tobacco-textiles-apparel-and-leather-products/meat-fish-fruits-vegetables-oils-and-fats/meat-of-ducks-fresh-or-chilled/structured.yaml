system_boundary:
  rules:
    - rule_id: boundary_primary_processing
      applies_to: "Required foreground route"
      rule: "Include slaughter, blood and feather removal, evisceration, inspection, washing, cooling, and all resource use and wastes needed to make the declared saleable fresh or chilled product. Include cutting and packaging when performed before the declared facility gate."
      source_ids:
        - fao-leap-poultry-2016
        - eu-sa-bref-2023
    - rule_id: boundary_upstream_live_ducks
      applies_to: "Delivered live-duck input"
      rule: "Represent duck farming and feed production through an upstream dataset. Model inbound live-bird transport separately unless it is demonstrably included in the delivered-live-duck dataset."
      source_ids:
        - fao-leap-poultry-2016
    - rule_id: boundary_hygiene_and_cold_chain
      applies_to: "Dressing, washing, chilling, cutting, storage, and dispatch"
      rule: "Include potable-water use, cleaning and sanitation, refrigeration energy, refrigerant losses, temperature control, and separation measures necessary to prevent contamination; do not exclude these activities merely because they are support operations."
      source_ids:
        - codex-cxc-58-2005
        - eu-regulation-853-2004
        - eu-sa-bref-2023
    - rule_id: boundary_waste_and_treatment
      applies_to: "Inedible material, condemned material, wastewater, sludge, and packaging waste"
      rule: "Include on-site treatment and direct releases. For off-site treatment, record the waste flow at the facility gate and link a representative treatment dataset; retain quantity and destination evidence."
      source_ids:
        - fao-leap-poultry-2016
        - eu-sa-bref-2023
    - rule_id: boundary_exclusions
      applies_to: "Downstream and non-reference products"
      rule: "Exclude retail, consumer storage and cooking, consumption, and end-of-life after the processing gate. Exclude further processing and freezing unless explicitly added by the study, in which case report them as processes outside this PCR reference boundary."
      source_ids:
        - fao-leap-poultry-2016
boundary_abstraction:
  declared_starting_condition: "Live ducks are received at the slaughter facility with origin, delivered mass, mortality or condemnation status, and whether inbound transport is embedded in the upstream dataset declared"
  starting_condition_role: "Upstream product input to the foreground slaughter and primary-processing system"
  product_classification_scope: "Fresh or chilled edible duck meat corresponding semantically to CPC 3.0 code 21122; the classification reference does not define canonical PCR identity"
  recursive_input_rule: "Any fresh or chilled duck meat rework or purchased meat entering the foreground system is recorded once as a product input with its own upstream dataset and is not recursively regenerated as the reference product; its quantity and disposition are disclosed"
  upstream_dataset_requirement: "Use representative upstream datasets for delivered live ducks and for electricity, fuels, water supply, chemicals, packaging, refrigerants, transport, and treatment services; disclose geography, technology, time, and whether transport and losses are included"
  disclosure: "Declare included unit operations, facility gate, cut and edible-yield convention, chilling system, on-site versus off-site by-product and wastewater treatment, packaging boundary, allocation method and keys, exclusions, data period, and any substitution of secondary for foreground data"
