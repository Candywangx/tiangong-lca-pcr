    required_unit: "°C and categorical state"
    rule: "Record product temperature at release and demonstrate that the product remained fresh or chilled and was never frozen. Apply the governing jurisdictional limit; where EU Regulation (EC) No 853/2004 is the applicable rule, poultry meat is chilled as soon as possible to no more than 4 °C."
