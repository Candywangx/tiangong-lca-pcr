allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Slaughter, cutting, rendering, refrigeration, and treatment operations"
    rule: "First subdivide the system and directly assign measured inputs, outputs, and emissions to the process or product that causes them whenever technically feasible."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: allocation_joint_products
    applies_to: "Jointly generated edible meat and non-edible or separately marketed co-products"
    rule: "When subdivision and a defensible physical causal relation are not feasible, allocate remaining joint burdens by the relative annual net revenue of the product groups at the point of separation. Use facility- and period-specific mass and revenue records; do not apply the illustrative chicken factors in the source as duck defaults."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: allocation_residuals_and_waste
    applies_to: "Residual materials and wastes"
    rule: "A zero-burden cut-off applies only to a residual that has a subsequent use and no positive or negative economic value at the boundary. If the facility pays for treatment or disposal, classify the stream as waste and include treatment burdens in the foreground system or linked treatment dataset."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: allocation_internal_energy_recovery
    applies_to: "Energy recovered from on-site waste"
    rule: "Credit only energy used on site by subtracting the displaced purchased energy within the documented facility balance. For exported energy, disclose and justify system expansion or an alternative allocation consistent with the study goal."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: allocation_disclosure
    applies_to: "All allocated foreground results"
    rule: "Report product grouping, separation points, revenue period and currency basis, treatment of edible offal, fat, feathers, blood, bones, condemned material, and sensitivity to an alternative mass or economic allocation where the choice materially changes results."
    source_ids:
      - fao-leap-poultry-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_mass_balance
      process_id: "duck_slaughter_dressing_duck_chilling_cutting_packaging"
      flow_role: "Live input, dressed carcass, saleable meat, rework, loss, and stock change"
      record_type: "Weighbridge, calibrated scale, batch and production records"
      raw_fields: "lot_id; duck_type; live_mass; dead_or_condemned_mass; dressed_mass; saleable_mass; rework_mass; stock_change; cut_form; bone_skin_status"
      collection_method: "Reconcile batch scales to daily production totals and investigate unmatched mass"
      unit: "kg"
      frequency: "Each lot, aggregated daily and monthly"
      temporal_coverage: "At least 12 consecutive representative months where practicable"
      site_scope: "Each included facility and line"
      aggregation_rule: "Sum compatible wet-mass fields; retain lot-level traceability; normalize only after monthly reconciliation"
      quality_evidence: "Calibration records, lot logs, reconciliation sign-off, and documented moisture or drip-loss convention"
    - protocol_id: cp_water_and_wastewater
      process_id: "duck_slaughter_dressing_residuals_and_wastewater_management"
      flow_role: "Supplied water, reused water, wastewater volume, and pollutant load"
      record_type: "Meters, invoices, flow meters, and representative laboratory samples"
      raw_fields: "meter_start; meter_end; source; reuse_volume; discharge_volume; sample_time; COD; BOD; TSS; nitrogen; phosphorus; other_regulated_parameters"
      collection_method: "Read meters at consistent intervals and pair flow-weighted or justified representative concentrations with discharge volumes"
      unit: "m3 and mg/L or kg/m3"
      frequency: "Metered continuously or daily; sampling per permit and process variability"
      temporal_coverage: "At least 12 representative months"
      site_scope: "Each facility; submeter major operations where available"
      aggregation_rule: "Purchased or abstracted water minus documented non-process uses; pollutant load = volume × concentration with unit conversion"
      quality_evidence: "Meter calibration, invoice reconciliation, laboratory accreditation or validated method, sampling plan"
    - protocol_id: cp_energy_records
      process_id: "duck_slaughter_dressing_duck_chilling_cutting_packaging_residuals_and_wastewater_management"
      flow_role: "Electricity and fuel by process"
      record_type: "Submeters, utility invoices, fuel receipts, tank and stock records"
      raw_fields: "carrier; meter_start; meter_end; purchase; opening_stock; closing_stock; process_share; heating_value; conversion_factor"
      collection_method: "Prefer submeters; otherwise allocate facility totals using documented equipment, runtime, or engineering evidence"
      unit: "kWh, MJ, kg, L, or m3 by carrier"
      frequency: "Monthly, with interval data retained when available"
      temporal_coverage: "At least 12 representative months"
      site_scope: "Each facility and major energy system"
      aggregation_rule: "Reconcile purchases and stock; preserve carrier-specific totals; convert with documented lower or higher heating value consistently"
      quality_evidence: "Meter and invoice reconciliation, fuel specifications, allocation worksheet, and energy-balance review"
    - protocol_id: cp_material_records
      process_id: "duck_slaughter_dressing_duck_chilling_cutting_packaging"
      flow_role: "Cleaning agents and packaging"
      record_type: "Purchase, formulation, stock, and waste records"
      raw_fields: "material_id; formulation; active_concentration; purchase_mass; opening_stock; closing_stock; returned_mass; waste_mass; product_assignment"
      collection_method: "Stock-change-adjusted material balance by declared formulation and packaging material"
      unit: "kg"
      frequency: "Monthly"
      temporal_coverage: "At least 12 representative months"
      site_scope: "Each facility and product family"
      aggregation_rule: "Consumption = purchases + opening stock - closing stock - returns; reconcile packaging to packed output and waste"
      quality_evidence: "Invoices, stock counts, bill of materials, packaging specifications, chemical safety data sheets"
    - protocol_id: cp_temperature_records
      process_id: "duck_chilling_cutting_packaging"
      flow_role: "Chilling and facility-gate product state"
      record_type: "Calibrated probes, continuous loggers, and release records"
      raw_fields: "lot_id; timestamp; location; product_temperature; room_temperature; corrective_action; release_status; never_frozen_confirmation"
      collection_method: "Measure representative product points and retain time-temperature history under the applicable food-safety plan"
      unit: "°C"
      frequency: "Continuous room monitoring and each lot at release"
      temporal_coverage: "Full reporting period"
      site_scope: "Each chilling, cutting, storage, and dispatch area"
      aggregation_rule: "Retain raw values; report lot maxima and exceptions without averaging away non-conformance"
      quality_evidence: "Probe calibration, logger records, HACCP verification, release authorization, corrective-action record"
    - protocol_id: cp_coproduct_and_waste_records
      process_id: "duck_slaughter_dressing_duck_chilling_cutting_packaging_residuals_and_wastewater_management"
      flow_role: "Co-products, residuals, condemned material, and waste"
      record_type: "Scales, transfer notes, invoices, disposal records, and destination confirmations"
      raw_fields: "stream_id; status; mass; moisture_basis; destination; revenue; treatment_cost; currency; date; transport_inclusion"
      collection_method: "Weigh each material stream where practicable and retain evidence distinguishing product, residual, and waste status"
      unit: "kg and currency"
      frequency: "Each shipment, aggregated monthly"
      temporal_coverage: "Same period as the main production data"
      site_scope: "Each facility and external destination"
      aggregation_rule: "Sum by stream and status; use consistent net-revenue period for allocation; reconcile to mass balance"
      quality_evidence: "Scale records, invoices, waste manifests, destination receipts, legal classification, allocation review"
    - protocol_id: cp_refrigerant_records
      process_id: "duck_chilling_cutting_packaging"
      flow_role: "Refrigerant stock, make-up, recovery, and leakage"
      record_type: "Service logs, cylinder records, leak inspections, and equipment inventory"
      raw_fields: "refrigerant; charge; opening_stock; purchases; recovered; closing_stock; system_served; leak_event"
      collection_method: "Reconcile each chemical and system; do not infer leakage from a generic factor when service records exist"
      unit: "kg"
      frequency: "Each service event and annual reconciliation"
      temporal_coverage: "At least 12 representative months"
      site_scope: "Each refrigeration system serving the foreground boundary"
      aggregation_rule: "Estimated release = purchases + opening stock - closing stock - recovered - documented transfers, subject to non-negative reconciliation"
      quality_evidence: "Certified service records, cylinder receipts, leak-test results, equipment inventory"
    - protocol_id: cp_treatment_records
      process_id: "residuals_and_wastewater_management"
      flow_role: "On-site treatment inputs and outputs"
      record_type: "Treatment meters, operator logs, laboratory results, and transfer records"
      raw_fields: "treatment_route; input_mass_or_volume; energy; chemicals; recovered_product; sludge; discharge; operating_time"
      collection_method: "Reconcile each treatment route to accepted streams and measured outputs"
      unit: "kg, m3, kWh, and MJ"
      frequency: "Daily or each batch, aggregated monthly"
      temporal_coverage: "Same period as production data"
      site_scope: "Each on-site treatment unit"
      aggregation_rule: "Sum by treatment route; maintain dry/wet basis and pollutant-load calculations separately"
      quality_evidence: "Operator logs, meter calibration, laboratory results, treatment performance review"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory amount"
      rule: "Normalized amount = period amount assigned to the product / period net mass of conforming reference duck meat"
      inputs:
        - "Assigned flow amount"
        - "conforming reference-product mass"
      output: "Flow amount per 1 kg reference product"
      source_ids:
        - fao-leap-poultry-2016
    - id: calc_product_yield
      applies_to: "Slaughter and finishing mass balance"
      rule: "Product yield = net reference duck-meat mass / delivered live-duck mass; report dressed-carcass and edible-product conventions separately"
      inputs:
        - "Delivered live mass"
        - "dressed mass"
        - "saleable reference-product mass"
      output: "Dimensionless yield and kg/kg live duck"
      source_ids:
        - fao-leap-poultry-2016
    - id: calc_material_consumption
      applies_to: "Cleaning agents, packaging, fuels, and refrigerants"
      rule: "Consumption = purchases + opening stock - closing stock - returns or documented transfers; preserve chemical or carrier identity"
      inputs:
        - "Purchase and stock records"
      output: "Consumed mass or energy by material"
      source_ids:
        - fao-leap-poultry-2016
        - eu-sa-bref-2023
    - id: calc_wastewater_load
      applies_to: "Wastewater pollutant rows"
      rule: "Pollutant load = representative discharge volume × concentration, with concentration and volume units converted explicitly; use flow-weighted averaging where data support it"
      inputs:
        - "Discharge volume"
        - concentration
        - "sampling basis"
      output: "kg pollutant per period and per kg reference product"
      source_ids:
        - fao-leap-poultry-2016
        - eu-sa-bref-2023
    - id: calc_joint_economic_allocation
      applies_to: "Remaining indivisible joint burdens"
      rule: "Allocation fraction for product group i = net revenue of group i / sum of positive net revenues of all allocated product groups for the same facility and period"
      inputs:
        - "Product quantities"
        - "contemporaneous prices or revenues"
        - "separable burdens"
      output: "Allocated foreground burden by product group"
      source_ids:
        - fao-leap-poultry-2016
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and inputs"
      requirement: "Product identity, duck type, cut form, bone and skin status, packaging convention, fresh or chilled state, facility geography, and production period must be unambiguous."
      evidence: "Product specification, lot and release records, and exact reference-flow UUID check"
    - id: dq_temporal
      applies_to: "Foreground activity data"
      requirement: "Use at least 12 consecutive representative months where practicable to capture seasonality, downtime, cleaning, and refrigeration loads; justify a shorter campaign and disclose extrapolation."
      evidence: "Dated raw records, coverage calculation, and representativeness statement"
    - id: dq_measurement
      applies_to: "Mass, water, energy, temperature, and emissions"
      requirement: "Use calibrated or verified measurement systems; retain original readings and conversion factors; do not replace measurable foreground quantities with the provisional ranges in this PCR."
      evidence: "Calibration certificates, meter logs, invoices, laboratory methods, and reconciliation records"
    - id: dq_completeness
      applies_to: "Process and material balance"
      requirement: "Cover all required processes and at least 95% of assessed impact per reported category where the FAO LEAP method is used; known small flows remain in the inventory or are estimated and disclosed rather than silently omitted."
      evidence: "Completeness checklist, cut-off register, scoping analysis, and mass/energy balance"
    - id: dq_allocation
      applies_to: "Co-products, residuals, and waste"
      requirement: "Allocation status, separation points, facility-period quantities, net revenues, treatment costs, and alternative-method sensitivity must be reviewable."
      evidence: "Allocation worksheet, invoices, destination records, and sensitivity calculation"
    - id: dq_hygiene_temperature
      applies_to: "Food-safety-related operating state"
      requirement: "Retain records demonstrating inspection, sanitation, chilling, and release-temperature compliance under the applicable jurisdiction."
      evidence: "HACCP or equivalent records, inspection disposition, sanitation logs, calibrated temperature logs"
    - id: dq_secondary_data
      applies_to: "Upstream and off-site datasets"
      requirement: "Select data representative of geography, technology, time, and treatment route; disclose mismatches and avoid double counting transport, treatment, or refrigerant emissions."
      evidence: "Dataset metadata, selection rationale, and boundary reconciliation"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The product-flow UUID must resolve exactly to an approved Product flow for Meat of ducks, fresh or chilled with CPC 21122 and the Mass reference property; stored PCR references must omit dataset versions."
    source_ids: []
  - rule_id: validate_reference_qualifiers
    applies_to: "Dataset metadata and reference exchange"
    rule: "Reject or mark incomplete any data package missing cut or carcass form, bone status, skin status, packaging inclusion, fresh or chilled state, never-frozen confirmation, release temperature, edible-yield convention, geography, or production period."
    source_ids:
      - fao-leap-poultry-2016
      - eu-regulation-853-2004
  - rule_id: validate_process_coverage
    applies_to: "Foreground process map"
    rule: "Confirm that slaughter and dressing, chilling and facility-gate release, process water, cleaning, energy, refrigeration, co-products, waste, and wastewater are present or explicitly justified as not applicable or represented by a linked dataset."
    source_ids:
      - fao-leap-poultry-2016
      - codex-cxc-58-2005
      - eu-sa-bref-2023
  - rule_id: validate_mass_balance
    applies_to: "Live-duck to product and residual flows"
    rule: "Reconcile mass on consistent wet-mass and stock-change conventions. Investigate and disclose unexplained differences; do not force the balance by changing the fixed 1 kg reference output."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: validate_temperature_state
    applies_to: "Chilling, storage, and release"
    rule: "Verify calibrated lot-level temperature evidence and never-frozen status against the applicable jurisdictional rule. When EU Regulation (EC) No 853/2004 applies, confirm chilling as soon as possible to no more than 4 °C."
    source_ids:
      - eu-regulation-853-2004
      - codex-cxc-58-2005
  - rule_id: validate_allocation
    applies_to: "Co-product handling"
    rule: "Confirm subdivision before allocation, consistent product grouping, contemporaneous facility-period net-revenue keys for remaining joint burdens, waste-treatment inclusion, and disclosed sensitivity where allocation choice is material."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: validate_provisional_ranges
    applies_to: "All reasoned-estimate ranges"
    rule: "Treat provisional ranges only as screening signals. A value outside a range requires investigation, while a value inside a range does not prove quality; publication-critical defaults require reviewed source evidence."
    source_ids: []
  - rule_id: validate_data_coverage
    applies_to: "Foreground data package"
    rule: "Report accepted inputs, checks performed, checks skipped, findings, and completeness. Missing required raw records, unresolved units, or unsupported allocation makes validation inconclusive rather than silently passing."
    source_ids:
      - fao-leap-poultry-2016
      - eu-sa-bref-2023
published_dataset_profile:
  dataset_role: "Foreground production dataset for fresh or chilled duck meat at the primary-processing facility gate"
  downstream_use: "May serve as a secondary_dataset or background_dataset after methodology and data review"
  allowed_use: "Product carbon footprint or LCA modelling where the declared product form, facility gate, geography, technology, data period, allocation, and temperature state match the study"
  excluded_use: "Frozen duck meat; live-duck farm-gate production; edible offal, fat, or foie gras as the reference product; further-processed duck products; unqualified global or sector averages; comparative public claims without required review"
  required_metadata: "PCR id and version when published; product-flow UUID; product qualifiers; facility geography; production period; process coverage; upstream dataset identities; allocation method and keys; packaging convention; release temperature; data-owner and review status"
  required_quality_disclosure: "Foreground coverage; measurement and calibration evidence; temporal representativeness; mass and energy reconciliation; cut-offs; secondary-data substitutions; unresolved UUIDs; provisional-range use; allocation sensitivity; validation checks skipped"
  update_trigger: "Material change in product form, slaughter or chilling technology, facility geography, energy or water system, refrigerant, packaging, treatment route, allocation economics, applicable hygiene rule, data older than the intended representativeness period, or resolution of provisional evidence and UUID gaps"
