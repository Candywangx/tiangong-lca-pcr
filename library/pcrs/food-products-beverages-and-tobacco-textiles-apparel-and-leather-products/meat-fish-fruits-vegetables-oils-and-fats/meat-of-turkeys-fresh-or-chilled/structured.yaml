allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Separately measurable operations and outputs"
    rule: "Avoid allocation by subdividing processes and assigning directly measured materials, utilities, chemicals, refrigeration, and treatment records to the operation and product that caused them whenever records support subdivision."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_named_co_products
    applies_to: "Blood, feathers, heads, feet, livers, hearts, gizzards, necks, fat, skin, bones, and meat trimmings"
    rule: "Record each named output's mass, composition, legal or commercial status, and destination before allocation. When subdivision is not feasible, use a documented physical relationship that reflects causality; any other relationship requires rationale, sensitivity analysis, and manual review."
    source_ids:
      - eu-pef-2021-2279
      - ec-jrc-sa-bref-jrc135916
  - rule_id: allocation_waste_status
    applies_to: "Condemned material and animal by-products"
    rule: "Do not relabel a recovered co-product as waste or a waste as a co-product to alter burdens. Record treatment burdens and any downstream credit according to the declared legal status and destination."
    source_ids:
      - eu-pef-2021-2279
      - ec-jrc-sa-bref-jrc135916
  - rule_id: allocation_shared_utilities
    applies_to: "Shared electricity, steam, hot water, fuels, refrigeration, cleaning, and cold storage"
    rule: "Allocate shared services using contemporaneous submetering or a documented causal driver such as operating time, equipment demand, throughput, refrigeration load, or sanitation cycle. Product mass alone is allowed only when its causal adequacy is demonstrated."
    source_ids:
      - eu-pef-2021-2279
      - ec-jrc-sa-bref-jrc135916
  - rule_id: allocation_wastewater_treatment
    applies_to: "Shared on-site wastewater treatment"
    rule: "Allocate treatment inputs, residues, and emissions using measured wastewater volume and pollutant load for each represented stream when available; disclose the selected driver and sensitivity."
    source_ids:
      - eu-pef-2021-2279
      - ec-jrc-sa-bref-jrc135916
dataset_production:
  collection_protocols:
    - protocol_id: cp_live_turkey_receipt
      process_id: "turkey_receipt_and_lairage"
      flow_role: "Live turkeys, water, electricity, accepted birds, mortalities, manure, and lairage wastewater"
      record_type: "Weighbridge, flock, meter, mortality, manure, cleaning, and transfer records"
      raw_fields: "supplier; flock id; delivery id; receipt time; live weight; bird count retained as context; accepted weight; dead-on-arrival mass; water; electricity; manure; wastewater; destination; calibration id"
      collection_method: "Link each delivery and flock record to calibrated incoming weight and the represented slaughter batch"
      unit: "kg; kWh"
      frequency: "Each delivery and slaughter batch"
      temporal_coverage: "Complete represented slaughter period"
      site_scope: "Each receipt point and lairage area serving the product"
      aggregation_rule: "Aggregate only compatible flocks and keep every named exchange separate; normalize after batch reconciliation"
      quality_evidence: "Weighbridge calibration, delivery ticket, flock record, mortality record, meter record, waste ticket, and signed reconciliation"
    - protocol_id: cp_slaughter_operations
      process_id: "slaughter_bleeding_defeathering_evisceration"
      flow_role: "Accepted birds, process inputs, carcasses, each co-product, each waste, wastewater, and air emission"
      record_type: "Slaughter line, scale, meter, fuel, gas, inspection, container, wastewater, and stack records"
      raw_fields: "accepted live weight; water; electricity; steam; hot water; each fuel; stunning gas; eviscerated carcass; each named co-product; each named waste; wastewater; fuel factor; stack result; operating time; destination"
      collection_method: "Collect atomic line records on one batch or campaign boundary and reconcile the live-bird material balance"
      unit: "kg; kWh; MJ"
      frequency: "Each slaughter batch or campaign, with utility-period reconciliation"
      temporal_coverage: "Complete represented slaughter period"
      site_scope: "Each slaughter line, utility system, and discharge point"
      aggregation_rule: "Sum only identical exchanges; allocate shared utilities with documented causal drivers and retain per-fuel calculations"
      quality_evidence: "Calibration, batch sheet, inspection record, meter, invoice, gas record, stack record, factor source, waste ticket, and mass-balance approval"
    - protocol_id: cp_carcass_dressing
      process_id: "carcass_dressing"
      flow_role: "Eviscerated carcass, water, electricity, dressed carcass, neck, fat, skin, condemned meat, and wastewater"
      record_type: "Line scale, water meter, electricity meter, inspection, transfer, waste, and discharge records"
      raw_fields: "eviscerated mass; water; electricity; dressed mass; neck; fat; skin; condemned meat; wastewater; opening hold-up; closing hold-up; calibration id"
      collection_method: "Measure and reconcile each named exchange for the same dressing batch"
      unit: "kg; kWh"
      frequency: "Each batch or campaign"
      temporal_coverage: "Complete represented production period"
      site_scope: "Each dressing line"
      aggregation_rule: "Sum identical product forms only and normalize reconciled totals to reference product"
      quality_evidence: "Scale and meter calibration, inspection log, transfer record, waste ticket, discharge record, and reconciliation"
    - protocol_id: cp_chilling_refrigeration
      process_id: "chilling_and_cold_storage"
      flow_role: "Carcass, water, ice, electricity, each refrigerant, wastewater, compressor oil, and chilled output"
      record_type: "Chiller, cold-store, water, ice, electricity, temperature, refrigerant service, oil, and discharge records"
      raw_fields: "carcass mass; water; ice; electricity; product temperature; storage time; refrigerant identity; opening charge; make-up; recovery; closing charge; transfer; wastewater; compressor oil; calibration id"
      collection_method: "Match product, water, energy, temperature, and circuit-level refrigerant records for the represented batch and period"
      unit: "kg; kWh"
      frequency: "Each batch plus each refrigerant service event; monthly utility reconciliation"
      temporal_coverage: "Complete represented chilling and storage period"
      site_scope: "Each chiller, cold room, and refrigeration circuit"
      aggregation_rule: "Keep each refrigerant identity separate; aggregate only compatible product states and normalize to reference product"
      quality_evidence: "Meter and sensor calibration, temperature log, service record, purchase record, recovery record, oil ticket, and refrigerant balance"
    - protocol_id: cp_cutting_portioning
      process_id: "cutting_and_portioning"
      flow_role: "Chilled carcass, water, electricity, each meat cut, each co-product, condemned meat, and wastewater"
      record_type: "Cutting line, scale, meter, specification, inspection, transfer, waste, and discharge records"
      raw_fields: "chilled carcass input; water; electricity; breast; thigh; drumstick; wing; trimming; fat; bone; skin; condemned meat; wastewater; opening hold-up; closing hold-up"
      collection_method: "Reconcile each named cut and residual stream to the same cutting batch"
      unit: "kg; kWh"
      frequency: "Each cutting batch or campaign"
      temporal_coverage: "Complete represented cutting period"
      site_scope: "Each cutting line and product specification"
      aggregation_rule: "Do not aggregate different cuts or bone and skin states; normalize compatible reconciled batches only"
      quality_evidence: "Scale and meter calibration, cutting specification, batch sheet, inspection record, transfer record, waste ticket, and reconciliation"
    - protocol_id: cp_packaging_release
      process_id: "packaging_and_release"
      flow_role: "Each product form, electricity, each packaging component, each packaging gas, reference product, packaging waste, and gas purge"
      record_type: "Packaging BOM, issue, return, filler, gas, meter, scale, waste, and dispatch records"
      raw_fields: "product form; bulk input; electricity; component identity; component count; component mass; issued; returned; unused; gas identity; gas use; purge; net released product; off-spec product; packaging waste; batch id"
      collection_method: "Reconcile product, every packaging component, packaging gases, and net dispatch mass for the same batch"
      unit: "kg; kWh; item count retained before conversion"
      frequency: "Each packaging batch or bulk dispatch"
      temporal_coverage: "Complete represented release period"
      site_scope: "Each packaging line and bulk release point"
      aggregation_rule: "Convert counts with measured component masses; keep every material and gas separate; exclude packaging from reference mass"
      quality_evidence: "Approved BOM, scale and meter calibration, issue and return records, gas record, waste ticket, and dispatch record"
    - protocol_id: cp_cleaning_disinfection
      process_id: "cleaning_and_disinfection"
      flow_role: "Water, electricity, steam, hot water, each fuel, each chemical, each sanitation wastewater, floor sweepings, and combustion emission"
      record_type: "Cleaning controller, water, energy, fuel, dosing, chemical issue, wastewater, sweepings, and stack records"
      raw_fields: "cycle id; equipment circuit; water; electricity; steam; hot water; each fuel; chemical identity; concentration; dose; reuse; wastewater identity; wastewater mass; sweepings; fuel factor; stack result; destination"
      collection_method: "Capture cycle-level atomic inputs and outputs and allocate only cycles attributable to represented equipment and period"
      unit: "kg; kWh; MJ"
      frequency: "Each sanitation cycle or discharge event, with utility-period reconciliation"
      temporal_coverage: "Same period as represented slaughter production"
      site_scope: "Each sanitation circuit, utility system, and discharge point"
      aggregation_rule: "Keep carriers, fuels, chemicals, wastewaters, and emissions separate; normalize attributable cycles only"
      quality_evidence: "Controller export, meter calibration, fuel invoice, dosing record, chemical register, discharge log, stack record, waste ticket, and allocation worksheet"
    - protocol_id: cp_wastewater_treatment
      process_id: "onsite_wastewater_treatment"
      flow_role: "Each wastewater input, treatment input, residue, treated water, water pollutant, and treatment air emission"
      record_type: "Influent, dosing, energy, flow, laboratory, sludge, grease, stack or gas, and discharge records"
      raw_fields: "wastewater identity; influent volume; electricity; water; each chemical; dose; treated flow; BOD5; COD; TSS; total nitrogen; total phosphorus; chloride; ammonium; screenings; DAF sludge; biological sludge; grease; methane; biogenic carbon dioxide; nitrous oxide; sampling time"
      collection_method: "Match each flow and laboratory result to the same treatment and sampling period, with explicit unit conversion"
      unit: "kg; kWh; concentration units retained before conversion"
      frequency: "Each treatment batch, discharge, sampling, or monitoring event"
      temporal_coverage: "Complete represented treatment period"
      site_scope: "Each on-site treatment train and discharge point"
      aggregation_rule: "Keep each influent, chemical, residue, pollutant, and air emission separate; allocate by measured volume and load"
      quality_evidence: "Flow-meter calibration, dosing record, laboratory report, chain of custody, sludge ticket, gas record, discharge permit record, and allocation worksheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground rows"
      rule: "normalized amount = reconciled exchange amount / net kg conforming fresh or chilled turkey meat released at the facility gate"
      inputs:
        - "reconciled atomic exchange"
        - "net reference-product mass excluding packaging"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_live_bird_mass_balance
      applies_to: "Receipt and slaughter"
      rule: "residual = accepted live weight - eviscerated carcass - each named co-product - each named waste - measured process loss adjusted for documented stock or hold-up; investigate rather than assigning residual to an invented flow"
      inputs:
        - "accepted live weight"
        - carcass
        - blood
        - feathers
        - organs
        - contents
        - "condemned carcass"
        - hold-up
      output: "reconciled live-bird balance and disclosed residual"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-2021-2279
    - id: calc_cutting_mass_balance
      applies_to: "Dressing, chilling, cutting, and packaging"
      rule: "residual = incoming carcass or meat mass - each named product - each named co-product - each named waste - closing hold-up plus opening hold-up; investigate material residuals"
      inputs:
        - "input mass"
        - outputs
        - wastes
        - "opening hold-up"
        - "closing hold-up"
      output: "reconciled process balance"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-2021-2279
    - id: calc_utility_allocation
      applies_to: "Shared electricity, steam, hot water, natural gas, diesel, and LPG"
      rule: "allocated carrier = measured total for one carrier × documented causal-driver share; calculate each carrier separately"
      inputs:
        - "one carrier total"
        - "operating time"
        - "equipment demand"
        - throughput
        - "sanitation cycle"
        - "refrigeration load"
      output: "allocated kWh or MJ for one carrier"
      source_ids:
        - eu-pef-2021-2279
        - ec-jrc-sa-bref-jrc135916
    - id: calc_combustion_emission
      applies_to: "Each direct combustion pollutant"
      rule: "pollutant mass = sum over fuels of collected fuel quantity × documented applicable factor for the same fuel, pollutant, technology, and period; preserve each fuel calculation before summing one elementary flow"
      inputs:
        - "fuel quantities"
        - "pollutant-specific factors"
        - technology
        - "validity period"
      output: "kg of one named air pollutant"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-2021-2279
    - id: calc_refrigerant_balance
      applies_to: "Each refrigeration circuit and refrigerant"
      rule: "emitted mass = opening charge + make-up - recovery - closing charge - documented transfers; calculate each refrigerant and carbon origin separately"
      inputs:
        - "refrigerant identity"
        - "carbon origin where relevant"
        - "opening charge"
        - make-up
        - recovery
        - "closing charge"
        - transfers
      output: "kg of one named refrigerant emitted to air"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-2021-2279
    - id: calc_packaging_mass
      applies_to: "Each packaging component"
      rule: "component mass = issued count × measured mass per component - returned unused component mass; preserve specification and conversion evidence"
      inputs:
        - "component identity"
        - "issued count"
        - "measured component mass"
        - returns
      output: "kg of one packaging component used or wasted"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_wastewater_pollutant_load
      applies_to: "Each treated-effluent pollutant"
      rule: "pollutant mass = matched treated-effluent volume × laboratory concentration for the same sampling period, with explicit unit conversion"
      inputs:
        - "treated flow"
        - "one pollutant concentration"
        - "sampling period"
        - "conversion factor"
      output: "kg of one pollutant to surface water"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-2021-2279
    - id: calc_wastewater_air_emission
      applies_to: "Each wastewater-treatment air emission"
