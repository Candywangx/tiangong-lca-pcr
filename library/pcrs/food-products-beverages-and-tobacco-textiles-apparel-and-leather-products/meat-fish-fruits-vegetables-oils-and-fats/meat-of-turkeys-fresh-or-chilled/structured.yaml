validation_rules:
  - rule_id: validate_scope_identity
    applies_to: "Product classification"
    rule: "Fail conformance when the reference product is not exact CPC 21124 turkey meat in the fresh or chilled state, is frozen turkey meat, is edible turkey offal, or is meat of another species."
    source_ids:
      - unsd-cpc-3-21124
  - rule_id: validate_reference_uuid
    applies_to: "Reference product"
    rule: "Require product flow 653bdb6e-5456-4a7d-88d3-8493b1f27bc7, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids:
      - unsd-cpc-3-21124
  - rule_id: validate_reference_net_mass
    applies_to: "Reference amount"
    rule: "Require exactly 1 kg net conforming product and exclude every packaging component from the reference mass."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_required_qualifiers
    applies_to: "Reference-flow metadata"
    rule: "Fail completeness when product form, bone state, skin state, preservation state, dispatch temperature, packaging format, production route, batch, or no-freezing evidence is missing."
    source_ids:
      - unsd-cpc-3-21124
      - eu-pef-2021-2279
  - rule_id: validate_process_boundary
    applies_to: "Foreground process map"
    rule: "Require every applicable receipt, slaughter, dressing, chilling, cutting, packaging, sanitation, and wastewater operation and explain each conditional process marked not applicable."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021-2279
  - rule_id: validate_atomic_inventory
    applies_to: "Every inventory card"
    rule: "Reject Selected flow values that are collections, selectors, alternatives, placeholders, or combined exchanges. Require each actual carrier, material, refrigerant, chemical, packaging component, product, co-product, waste, wastewater, and elementary emission to have its own card."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021-2279
  - rule_id: validate_uuid_review_closure
    applies_to: "Inventory identity"
    rule: "Require exactly one manifest unresolved review for each blank UUID and no unresolved review for the verified reference row. Reject any populated UUID without exact hybrid and public state100 direct-read confirmation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "Receipt, slaughter, dressing, chilling, cutting, and packaging"
    rule: "Require reconciled mass balances on common periods and investigation of residuals; do not force a residual into an invented product or waste flow."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021-2279
  - rule_id: validate_co_product_allocation
    applies_to: "Multi-output operations"
    rule: "Require direct assignment or subdivision where feasible; otherwise require a documented causal allocation method, all inputs and outputs, rationale, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_temperature_state
    applies_to: "Chilled product"
    rule: "Reject a dataset that lacks product-temperature evidence or that represents frozen turkey meat with the fresh-or-chilled reference flow."
    source_ids:
      - unsd-cpc-3-21124
      - ec-jrc-sa-bref-jrc135916
  - rule_id: validate_wastewater_emissions
    applies_to: "On-site wastewater treatment"
    rule: "Require matched flow and monitoring records for every reported pollutant and treatment air emission; prohibit use of BAT-associated levels as measured facility emissions."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021-2279
  - rule_id: validate_no_unsupported_estimate
    applies_to: "Inventory amounts and ranges"
    rule: "Reject any author-derived provisional estimate or unsupported numeric range in this PCR; all non-reference amounts require foreground records or calculations from those records."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate slaughterhouse production dataset for one declared CPC 21124 fresh or chilled turkey-meat product and route"
  downstream_use: "secondary_dataset or background_dataset in a process or lifecyclemodel when scope, geography, technology, time, and product state are compatible"
  allowed_use: "Product-specific modelling of whole carcasses or named turkey-meat cuts at the facility gate with the declared fresh or chilled state and complete atomic foreground records"
  excluded_use: "Frozen turkey meat; edible turkey offal as the reference product; meat of other species; inclusion of packaging mass in the reference amount; unsupported default values or ranges; collection or selector exchanges; unsupported comparative claims"
  required_metadata: "canonical PCR id; CPC coordinate; exact reference UUID; required qualifiers; facility geography; supplier and flock context; process diagram; slaughter, chilling, cutting, packaging, sanitation, and wastewater routes; production period; net product mass; co-product status; allocation; upstream datasets; treatment destinations; data-quality assessment"
  required_quality_disclosure: "Data coverage and gaps; measurement and calibration evidence; live-bird and product mass balances; temperature evidence; utility, fuel, refrigerant, chemical, packaging, waste, wastewater, and emission records; proxies; allocation sensitivity; conditional-operation decisions; unresolved UUID reviews"
  update_trigger: "Product classification, form, preservation state, slaughter or stunning technology, chilling or refrigeration system, cutting route, packaging, fuel system, sanitation chemistry, wastewater route, co-product status, allocation, or source method changes materially; an unresolved flow gains an exact public state100 identity"
