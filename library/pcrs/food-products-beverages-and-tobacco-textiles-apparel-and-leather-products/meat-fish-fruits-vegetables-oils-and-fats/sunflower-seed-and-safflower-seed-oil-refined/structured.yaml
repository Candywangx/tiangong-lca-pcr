allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared refinery operations and utilities"
    rule: "Avoid allocation where separately metered or otherwise separable operations can be subdivided. Do not allocate upstream crude-oil production to the foreground refinery."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_physical_first
    applies_to: "inseparable multi-output refining operations"
    rule: "If subdivision is not practicable, use a documented physical relationship that reflects the causation of inputs, energy use, residues, and emissions. Mass allocation shall not be used automatically when it does not reflect the physical relationship."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_economic_fallback
    applies_to: "saleable co-products lacking a defensible physical relationship"
    rule: "Economic allocation may be used only after documenting why subdivision, system expansion, and physical allocation are not practicable; use contemporaneous plant-gate values and disclose the price period and sensitivity."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_waste_status
    applies_to: "soapstock, acid oil, spent bleaching earth, filter residue, and wastewater"
    rule: "Classify an output as product or waste from its documented destination and economic status. Do not assign co-product credit to a waste output without a verified recovery function and receiving dataset."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass_inputs
      process_id: "oil_refining"
      flow_role: "crude oil, process water, bleaching aids, and refining chemicals"
      record_type: "weighbridge ticket, tank dip or calibrated meter, stock ledger, purchase record, laboratory concentration record"
      raw_fields: "date; batch; material identity; botanical source; gross and tare mass or meter reading; moisture or active concentration; returns; meter id"
      collection_method: "reconcile batch records to inventory movement and production output"
      unit: "kg; concentration as mass fraction where applicable"
      frequency: "per delivery or batch, aggregated monthly"
      temporal_coverage: "representative continuous 12-month period or complete declared campaign"
      site_scope: "all refining lines and storage feeding the reported output"
      aggregation_rule: "sum net inputs by material and divide by conforming net refined-oil output; avoid double counting transfers"
      quality_evidence: "calibration record; inventory reconciliation; supplier specification; laboratory result; exception log"
    - protocol_id: cp_energy_inputs
      process_id: "oil_refining"
      flow_role: "electricity, steam, and fuel"
      record_type: "utility meter, invoice, boiler log, steam flow and condition record"
      raw_fields: "timestamp; meter id; opening and closing reading; fuel quantity; steam pressure and temperature where used; allocation driver; downtime"
      collection_method: "direct submetering preferred; otherwise reconcile the complete facility balance and document allocation"
      unit: "kWh; MJ; kg steam; fuel-specific unit"
      frequency: "continuous or per shift, aggregated monthly"
      temporal_coverage: "same period as production output"
      site_scope: "all utilities serving the reported refining route"
      aggregation_rule: "subtract verified non-production use, convert with documented factors, and normalise to net refined-oil output"
      quality_evidence: "meter calibration; invoice reconciliation; conversion-factor source; allocation worksheet"
    - protocol_id: cp_outputs_and_wastes
      process_id: "oil_refining"
      flow_role: "refined oil, co-products, spent residue, and wastewater"
      record_type: "certified production mass, dispatch ticket, tank reconciliation, waste manifest, wastewater meter and test"
      raw_fields: "date; batch; output identity; net mass; moisture; retained oil; destination; economic status; wastewater volume or mass; treatment route"
      collection_method: "reconcile certified output, tank change, dispatch, and waste records"
      unit: "kg; m3 only when density and conversion are documented"
      frequency: "per batch or dispatch, aggregated monthly"
      temporal_coverage: "same period as inputs"
      site_scope: "all reported refining lines, storage, and waste hand-offs"
      aggregation_rule: "sum each distinct output; convert volumes only with measured or justified density; normalise to reference output"
      quality_evidence: "product release certificate; weighbridge record; waste manifest; treatment receipt; meter calibration; mass-balance review"
  calculation_rules:
    - id: calc_normalise_reference
      applies_to: "every inventory amount"
      rule: "Normalised amount = period amount / conforming net refined-oil output for the same period. The reference product is then set to exactly 1 kg."
      inputs:
        - "reconciled period amount"
        - "conforming net refined-oil output"
      output: "amount per kg refined oil"
      source_ids: []
    - id: calc_active_chemical
      applies_to: "chemicals reported as solutions or commercial products"
      rule: "Active amount = commercial product mass × measured active mass fraction. Retain both commercial-product and active-substance values."
      inputs:
        - "product mass"
        - "certificate or test concentration"
      output: "kg active substance and kg commercial product per kg refined oil"
      source_ids: []
    - id: calc_volume_to_mass
      applies_to: "oil, water, steam condensate, and wastewater recorded by volume"
      rule: "Mass = measured volume × density at the declared temperature. Do not apply an assumed density without marking the result as modelled and disclosing the assumption."
      inputs:
        - volume
        - density
        - temperature
      output: "kg per kg refined oil"
      source_ids:
        - codex-cxs-210-1999
    - id: calc_mass_balance
      applies_to: "refinery mass-bearing inputs and outputs"
      rule: "Mass-balance residual = total mass inputs − total measured product, co-product, waste, wastewater, and direct mass outputs. Investigate and disclose the residual rather than forcing it to zero."
      inputs:
        - "all mass-bearing rows on a consistent wet/dry basis"
      output: "residual kg and residual share per kg refined oil"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "crude and refined oils"
      requirement: "Preserve botanical source, blend share, refining route, oleic grade where claimed, product specification, batch or campaign, and the selected Tiangong flow identity."
      evidence: "supplier specification; batch record; product release certificate; flow UUID verification"
    - id: dq_measurement
      applies_to: "all foreground amounts"
      requirement: "Use calibrated meters, scales, tank reconciliations, invoices, or laboratory tests; disclose conversions, allocation drivers, missing records, and estimates."
      evidence: "calibration certificate; meter and invoice reconciliation; calculation worksheet; exception log"
    - id: dq_temporal
      applies_to: "foreground dataset"
      requirement: "Cover a representative continuous 12-month period or the complete declared production campaign and disclose shutdowns, abnormal batches, and seasonality."
      evidence: "production calendar; maintenance and downtime logs; monthly completeness table"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Account for reference output, crude feed, major aids, water, energy, co-products, waste, wastewater, and direct releases; document each excluded flow and demonstrate that it is immaterial to the intended use."
      evidence: "mass and energy balance; flow register; omission log; treatment receipts"
    - id: dq_representativeness
      applies_to: "foreground and linked upstream data"
      requirement: "Report technological, geographical, and time-related representativeness and disclose all proxy datasets and mismatches."
      evidence: "dataset metadata; supplier and facility records; proxy and limitation statement; ilcd-data-network-compliance-2010"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Verify exact flow UUID, Mass property UUID, Units of mass UUID, kg unit, botanical-source qualifier, refining route, and bulk plant-gate state."
    source_ids:
      - codex-cxs-210-1999
  - rule_id: validate_reference_amount
    applies_to: "quantitative reference"
    rule: "Require exactly 1 kg net refined oil and exclude packaging or container mass."
    source_ids: []
  - rule_id: validate_route_coverage
    applies_to: "process boundary"
    rule: "Confirm that every operated refining step, onsite utility, material aid, residue, wastewater hand-off, and direct release is included or explicitly justified as excluded."
    source_ids:
      - ec-jrc-fdm-bref-2019
      - nucci-et-al-2014-sunflower-oil-lca
  - rule_id: validate_mass_balance
    applies_to: "mass-bearing inventory"
    rule: "Recalculate the period mass balance on consistent wet/dry and concentration bases; any unexplained residual or forced closure is a finding requiring disclosure and correction."
    source_ids: []
  - rule_id: validate_no_double_counting
    applies_to: "utilities and upstream links"
    rule: "Reject simultaneous counting of purchased steam and the fuel used by an upstream steam dataset, or purchased crude oil and duplicated upstream extraction within the same foreground process."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: validate_allocation
    applies_to: "co-products and wastes"
    rule: "Confirm the allocation hierarchy, output economic status, factor period, and sensitivity disclosure; reject undocumented mass or economic allocation."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: validate_quality_state
    applies_to: "released reference product"
    rule: "Confirm the product is refined and meets the declared applicable food-grade identity and quality specification; reject crude, virgin, cold-pressed, off-spec, or packaged output as the reference product."
    source_ids:
      - codex-cxs-210-1999
  - rule_id: validate_provisional_ranges
    applies_to: "reasoned-estimate ranges"
    rule: "Treat every reasoned_estimate range as a non-conformance screen only; do not substitute it for foreground data, and flag it for replacement before publication-critical use."
