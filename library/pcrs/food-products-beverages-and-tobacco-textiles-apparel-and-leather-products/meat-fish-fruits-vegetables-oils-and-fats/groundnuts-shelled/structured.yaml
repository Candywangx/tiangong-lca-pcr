allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "Multi-output foreground operations"
    rule: "Avoid allocation by subdividing separately measured operations or by expanding the system only where the substituted function and dataset are explicitly justified. Do not create an avoided-product credit solely from a waste-disposal claim."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shell_route
    applies_to: "Groundnut shells"
    rule: "Treat shells as waste when they have no documented product function and model their treatment without co-product allocation. When shells are sold or transferred as a specified co-product, record only that measured portion as product and apply the PEF hierarchy to any shared burdens."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_burdens
    applies_to: "Shared burdens remaining after subdivision"
    rule: "Use a physical relationship only where it reflects the underlying causal relationship between inputs, outputs and functions; otherwise use economic allocation with contemporaneous, geographically and temporally representative prices. Report the method, factors, price basis and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rejected_material
    applies_to: "Rejected kernels and controlled material"
    rule: "Assign no co-product credit to material rejected for the declared use unless a lawful alternative specification, analytical release where required, recipient and function are documented. Product diversion and waste treatment are mutually exclusive for each measured portion."
    source_ids:
      - codex-cxc-22-1979
      - codex-cxc-55-2004-2025
      - eu-pef-2021-2279
  - rule_id: allocation_mass_balance
    applies_to: "All lot outputs"
    rule: "Preserve the unallocated physical mass balance separately from burden allocation: input mass equals accepted kernels plus shells, rejected material, dust/fines, samples, inventory change and measured losses on one moisture basis. Allocation shall not alter these physical quantities."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_incoming_lot_records
      process_id: "receiving_and_precleaning"
      flow_role: "incoming in-shell groundnuts"
      record_type: "weighbridge, receiving, supplier, moisture and inspection records"
      raw_fields: "lot_id; supplier_id; origin; delivery_basis; gross_mass; tare_mass; net_mass; moisture_value; moisture_basis; method; grade_observation; acceptance_decision; timestamp"
      collection_method: "Calibrated gross-minus-tare weighing linked to lot identity, with representative moisture sampling and receiving inspection."
      unit: "kg; %"
      frequency: "Each incoming lot"
      temporal_coverage: "Entire declared production period"
      site_scope: "All supplying lots entering the represented facility or sampled population"
      aggregation_rule: "Sum accepted net mass by lot; keep rejected lots separate; do not combine different moisture bases without correction."
      quality_evidence: "Calibration record; sampling record; supplier document; signed receiving decision."
    - protocol_id: cp_intermediate_and_residue_mass
      process_id: "receiving_and_precleaning_shelling_and_size_grading"
      flow_role: "intermediate transfers and pre-cleaning residues"
      record_type: "batch scale, hopper, inventory and reject logs"
      raw_fields: "lot_id; process_id; material_class; gross_mass; tare_mass; net_mass; moisture_value; destination; timestamp"
      collection_method: "Weigh transfers and separated material, or reconcile calibrated batch scales and inventory changes."
      unit: "kg; %"
      frequency: "Each lot or production run"
      temporal_coverage: "Entire declared production period"
      site_scope: "All represented lines and shifts"
      aggregation_rule: "Sum by lot, process and material class on a consistent moisture basis; retain inventory change."
      quality_evidence: "Scale calibration; batch log; inventory reconciliation; disposition record."
    - protocol_id: cp_energy_records
      process_id: "receiving_and_precleaning_shelling_and_size_grading_aflatoxin_control_and_lot_disposition_net_mass_packaging_and_dispatch"
      flow_role: "electricity by operation"
      record_type: "meter, submeter, equipment power and operating-time records"
      raw_fields: "meter_id; start_reading; end_reading; equipment_id; rated_or_measured_power; operating_time; lot_id; allocation_driver"
      collection_method: "Prefer calibrated submeters; otherwise calculate power multiplied by recorded operating time and reconcile to the facility meter."
      unit: "kWh"
      frequency: "Each lot/run or meter interval"
      temporal_coverage: "Representative period covering declared operating variability"
      site_scope: "All included equipment and represented shifts"
      aggregation_rule: "Subtract excluded loads; assign shared use by recorded operating time or another causal driver; normalize to accepted net output."
      quality_evidence: "Meter calibration; utility reconciliation; equipment log; allocation worksheet."
    - protocol_id: cp_shell_and_reject_disposition
      process_id: "shelling_and_size_grading_aflatoxin_control_and_lot_disposition"
      flow_role: "shells, rejects and controlled material"
      record_type: "batch scale, sort log, test release, sales/transfer and waste records"
      raw_fields: "lot_id; material_class; rejection_reason; gross_mass; tare_mass; net_mass; moisture_basis; analytical_release; recipient; intended_use; product_or_waste_route; treatment_destination; timestamp"
      collection_method: "Weigh each segregated stream and link it to its mutually exclusive product-diversion or waste-disposition evidence."
      unit: "kg"
      frequency: "Each lot and shipment"
      temporal_coverage: "Entire declared production period"
      site_scope: "All shell, reject, sample and controlled-material destinations"
      aggregation_rule: "Sum by lot, class and route; prohibit the same portion from appearing in both product and waste totals."
      quality_evidence: "Scale calibration; laboratory result; legal/contract specification; transfer note; waste manifest."
    - protocol_id: cp_aflatoxin_grade_and_lot_decision
      process_id: "aflatoxin_control_and_lot_disposition"
      flow_role: "kernel grade and aflatoxin-control decision"
      record_type: "sampling, laboratory, sorter and release/rejection records"
      raw_fields: "lot_id; intended_use; grade_or_size_class; sampling_plan; sample_mass; laboratory_id; analytical_method; result; unit; reporting_limit; applicable_limit; limit_source; sort_passes; accepted_mass; rejected_mass; decision; timestamp"
      collection_method: "Apply the declared representative sampling plan and validated analytical method; link results and visual/electronic sorting records to the exact lot and disposition."
      unit: "declared concentration unit; kg"
      frequency: "Each controlled lot and each retest"
      temporal_coverage: "Entire declared production period"
      site_scope: "Every lot represented as accepted output"
      aggregation_rule: "No averaging across independently accepted/rejected lots to conceal a non-conforming result; aggregate masses only after lot disposition."
      quality_evidence: "Chain of custody; accredited or otherwise qualified laboratory record; method identifier; sorter log; signed lot release."
    - protocol_id: cp_dust_records
      process_id: "receiving_and_precleaning_shelling_and_size_grading"
      flow_role: "captured and uncaptured particulate material"
      record_type: "stack/area monitoring, collector mass, maintenance and operating records"
      raw_fields: "process_id; lot_id; monitoring_method; concentration_or_mass; air_volume; captured_dust_mass; operating_time; control_efficiency_basis"
      collection_method: "Measure direct releases where feasible; otherwise calculate from monitored air volume and concentration or a documented equipment model, subtracting captured material recorded as waste."
      unit: "kg; supporting concentration and air-volume units"
      frequency: "Representative monitoring event and each production aggregation interval"
      temporal_coverage: "Representative period for equipment and control condition"
      site_scope: "All included dust-generating and control equipment"
      aggregation_rule: "Calculate released mass by process and period; prevent double counting captured dust and air emissions; normalize to accepted output."
      quality_evidence: "Monitoring report; calibration; collector log; maintenance record; calculation worksheet."
    - protocol_id: cp_final_net_mass_and_packaging
      process_id: "net_mass_packaging_and_dispatch"
      flow_role: "final output, packaging and gate storage"
      record_type: "packing line, scale, bill of materials, warehouse and dispatch records"
      raw_fields: "lot_id; output_gross_mass; tare_mass; net_mass; moisture_value; grade; package_type; packaging_material; packaging_mass; bulk_or_packaged; storage_start; storage_end; dispatch_time"
      collection_method: "Calibrated gross-minus-tare weighing; reconcile package counts and material specifications to packaging consumption and warehouse movement."
      unit: "kg; hour or day"
      frequency: "Each packed or bulk lot and dispatch"
      temporal_coverage: "Entire declared production period"
      site_scope: "All final output and packaging configurations in the represented dataset"
      aggregation_rule: "Sum final net mass by qualified lot; aggregate packaging by material and level; calculate included storage duration; normalize to 1 kg net output."
      quality_evidence: "Scale calibration; packing specification; bill of materials; warehouse record; dispatch document."
  calculation_rules:
    - id: calc_net_mass
      applies_to: "Incoming, intermediate and final weighed material"
      rule: "net_mass_kg = gross_mass_kg - tare_mass_kg; packaging tare is never part of the final product mass."
      inputs:
        - gross_mass
        - tare_mass
      output: "net_mass_kg"
      source_ids:
        - codex-cxs-200-1995
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized_amount = attributable_period_or_lot_amount / accepted_final_net_mass_kg. The denominator contains only output released for the declared intended use and moisture basis."
      inputs:
        - "attributable flow amount"
        - "accepted final net mass"
      output: "amount per 1 kg net shelled-groundnut output"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_moisture_consistency
      applies_to: "Physical mass balance"
      rule: "Compare masses on the same as-received basis; when dry-matter comparison is needed, dry_mass = as_received_mass × (1 - moisture_fraction), using matched representative samples."
      inputs:
        - "as-received mass"
        - "moisture fraction"
        - "sampling time"
      output: "disclosed dry-matter comparison"
      source_ids:
        - codex-cxs-200-1995
        - codex-cxc-22-1979
    - id: calc_lot_mass_balance
      applies_to: "Each process and complete foreground route"
      rule: "input_mass = accepted_output + product_coproducts + waste_and_rejects + direct_particulate_mass + samples + closing_inventory - opening_inventory + unexplained_difference. Report the unexplained difference and investigate material deviations."
      inputs:
        - "lot inputs"
        - outputs
        - shells
        - rejects
        - "dust/fines"
        - samples
        - inventories
      output: "process and route mass-balance result"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_energy_assignment
      applies_to: "Shared electricity"
      rule: "Assign metered use directly where possible; otherwise use recorded equipment operating time, measured power or another documented causal driver and reconcile assigned totals to the facility meter."
      inputs:
        - "meter readings"
        - power
        - "operating time"
        - "production records"
      output: "kWh assigned to lot and process"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mutually_exclusive_routes
      applies_to: "Shells and rejected material"
      rule: "For each material portion, product_route_mass × waste_route_mass shall not represent the same physical portion; route totals shall reconcile to the segregated measured mass and carry destination evidence."
      inputs:
        - "segregated mass"
        - "route flag"
        - "transfer or waste record"
      output: "product and waste route masses without overlap"
      source_ids:
        - codex-cxc-22-1979
        - codex-cxc-55-2004-2025
  data_quality_requirements:
    - id: dqr_identity_and_qualifiers
      applies_to: "Final output"
      requirement: "Preserve the exact generic Tiangong flow UUID and declare shelling route, starting condition, raw/dried state, moisture and basis, grade, intended use/specification, aflatoxin-control record, rejected-material disposition, net-mass basis, packaging, and included storage duration."
      evidence: "Product specification; lot record; reference-flow metadata; dispatch document."
    - id: dqr_lot_traceability
      applies_to: "All mass and control records"
      requirement: "Maintain a traceable link from incoming lot through intermediates, shell and reject partitions, sampling/testing, final net mass and destination records."
      evidence: "Lot genealogy; timestamps; chain of custody; reconciliation worksheet."
    - id: dqr_temporal_and_technological_representativeness
      applies_to: "Foreground data"
      requirement: "Cover the declared representative production period and relevant seasonal, supplier, grade, moisture, equipment, shift and packaging variability; disclose exclusions and unusual operating conditions."
      evidence: "Sampling plan; production calendar; equipment list; coverage statement."
    - id: dqr_measurement_quality
      applies_to: "Mass, moisture, energy and analytical results"
      requirement: "Use calibrated or verified instruments and retain units, method identifiers, calibration status, sampling procedures, detection/reporting limits where relevant, and raw-to-aggregated calculations."
      evidence: "Calibration certificates; laboratory report; meter records; calculation files."
    - id: dqr_aflatoxin_control
      applies_to: "Each accepted lot"
      requirement: "Retain the applicable limit source, intended-use basis, sampling plan, analytical method, result, reporting limit and signed lot decision; visual sorting alone shall not be represented as a quantitative aflatoxin result."
      evidence: "Laboratory result; sampling record; applicable regulation or contract; lot release."
    - id: dqr_completeness_and_cutoffs
      applies_to: "Foreground inventory"
      requirement: "Include all material and energy inputs, direct emissions, product outputs, wastes, shells, rejects, samples and inventory changes that cross the declared boundary; disclose and justify every cut-off."
      evidence: "Completeness checklist; mass and energy reconciliation; cut-off register."
    - id: dqr_reasoned_estimate_replacement
      applies_to: "Every reasoned_estimate range"
      requirement: "Treat the range as temporary screening guidance only when foreground records and reliable transferable quantitative evidence are unavailable. Disclose its use and replace it as soon as representative batch/period records, audited supplier evidence, equipment measurements, or reviewed external evidence become available; do not present it as a typical or allowed range."
      evidence: "Estimate register; applicability statement; replacement action and trigger record."
    - id: dqr_source_representativeness
      applies_to: "Linked upstream and downstream datasets"
      requirement: "Document geography, time, technology, product state, moisture basis and allocation compatibility; replace a material proxy when a more representative dataset becomes available."
      evidence: "Dataset metadata; applicability assessment; proxy replacement log."
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require product flow UUID 66ce8a77-8fe1-4513-910c-741aebeec043, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg; reject a substitute or more specific flow as the PCR reference identity."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_required_qualifiers
    applies_to: "Final dataset"
    rule: "Fail conformance if shelling route/starting condition, raw or dried state, moisture and basis, grade, intended use/specification, rejected-material rule, aflatoxin-control details, net-mass basis, packaging state, or included storage duration is missing."
    source_ids:
      - codex-cxs-200-1995
      - codex-cxc-22-1979
      - codex-cxc-55-2004-2025
  - rule_id: validate_route_exclusivity
    applies_to: "Alternative inputs and material dispositions"
    rule: "Verify one starting route per lot and verify that each measured shell or rejected-material portion appears in exactly one product-diversion or waste route. Fail on simultaneous duplicate routes or unsupported beneficial-use credit."
    source_ids:
      - codex-cxc-22-1979
      - codex-cxc-55-2004-2025
      - eu-pef-2021-2279
  - rule_id: validate_net_mass_and_moisture
    applies_to: "Reference amount and physical balance"
    rule: "Verify calibrated gross-minus-tare net mass, consistent moisture basis, and 1 kg normalization. If CXS 200-1995 applicability is claimed, verify kernel moisture does not exceed 9.0% and disclose any stricter destination limit."
    source_ids:
      - codex-cxs-200-1995
  - rule_id: validate_aflatoxin_control
    applies_to: "Accepted and rejected lots"
    rule: "Verify traceable sampling plan, analytical method, result, unit, reporting limit, applicable limit and intended-use basis, and lot decision. Fail if a visual observation is used as a numeric result or if a non-conforming lot is accepted for an unsupported destination."
    source_ids:
      - codex-cxc-22-1979
      - codex-cxc-55-2004-2025
  - rule_id: validate_mass_balance
    applies_to: "Each process and complete route"
    rule: "Recalculate the as-received and, where reported, dry-matter balances. Require shells, rejects, dust/fines, samples and inventory changes to be represented and require material unexplained differences to be investigated and disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_allocation_and_cutoff
    applies_to: "Multi-output modelling and exclusions"
    rule: "Verify the PEF allocation hierarchy, allocation factors and price/physical basis, and confirm that every cut-off is explicit and justified. Physical quantities shall remain unchanged by burden allocation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_packaging
    applies_to: "Bulk and packaged routes"
    rule: "Verify the bulk/packaged qualifier, packaging type and material, packaging mass, and tare exclusion. A packaged route with missing packaging inventory or an unpackaged route with unexplained packaging shall fail."
    source_ids:
      - codex-cxs-200-1995
      - eu-pef-2021-2279
  - rule_id: validate_reasoned_estimates
    applies_to: "Provisional quantitative ranges"
    rule: "Verify that every reasoned_estimate is identified as temporary screening guidance, used only under its stated no-data condition, excluded from claims of typical or allowed performance, and linked to a replacement trigger."
    source_ids: []
  - rule_id: validate_data_quality
    applies_to: "Dataset publication profile"
    rule: "Verify lot traceability, temporal and technological coverage, calibration and analytical evidence, upstream dataset representativeness, completeness, and disclosed limitations before the package is used as a secondary or background dataset."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production package for shelling, control and gate preparation of generic shelled groundnuts, with a downstream process/lifecyclemodel projection."
  downstream_use: "secondary_dataset; background_dataset after review, representative upstream linking, and documented allocation."
  allowed_use: "Product-footprint or life-cycle models needing a qualified facility-gate shelled-groundnut input whose route, moisture, grade, aflatoxin-control status, rejected-material disposition, net mass and packaging are compatible."
  excluded_use: "Unqualified substitution for groundnuts in shell, planting seed, roasted/cooked peanuts, peanut oil or other manufactured peanut products; comparative assertions without equivalent function, boundary, quality and data representativeness; food-safety certification."
  required_metadata: "Geography; facility and technology scope; period; shelling route and starting condition; incoming origin/delivery basis; raw/dried state; moisture values and basis; grade; intended use/specification; aflatoxin sampling/method/result/limit/decision; net-mass method; shell/reject routes; packaging bill; storage duration; allocation; cut-offs; linked dataset versions."
  required_quality_disclosure: "Coverage and sampling; calibration and laboratory competence; lot genealogy; mass/energy reconciliation; reasoned estimates and replacement status; proxies; uncertainty; rejected lots; unusual conditions; limitations."
  update_trigger: "Change in product-flow identity, CPC scope, shelling or sorting technology, representative moisture/grade mix, aflatoxin rule or sampling method, intended-use limits, shell/reject disposition, packaging configuration, energy mix, allocation basis, facility coverage, or availability of evidence that replaces a reasoned estimate or material proxy."
