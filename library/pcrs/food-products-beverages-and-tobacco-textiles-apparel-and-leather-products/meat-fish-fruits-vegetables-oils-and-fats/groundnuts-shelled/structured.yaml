measurement_rules:
  - id: reference_net_mass
    applies_to: "Final shelled groundnuts"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine net mass as calibrated gross mass minus packaging or container tare. Normalize all inventory results to 1 kg net shelled-groundnut output at the declared moisture basis."
  - id: moisture_as_received
    applies_to: "In-shell input, intermediate kernels, and final shelled groundnuts"
    required_property_ref:
      name: "Mass fraction and Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "% and kg"
    rule: "Record moisture content, sampling time, test method, and whether mass is as received or moisture-corrected. Do not mix wet-basis and dry-matter masses."
  - id: codex_kernel_moisture
    applies_to: "Lots claiming the CXS 200-1995 intended-use scope"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "%"
    rule: "For peanut kernels intended for processing for direct human consumption under CXS 200-1995, verify the specified maximum moisture content of 9.0%; a stricter destination requirement remains controlling and shall be disclosed."
  - id: internal_mass_consistency
    applies_to: "Each lot and process"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use one consistent as-received basis for input kernels, accepted kernels, shells, rejects, dust or fines, samples, inventory change, and final net output; report any separately calculated dry-matter balance."
  - id: aflatoxin_result_basis
    applies_to: "Aflatoxin-control records"
    required_property_ref:
      name: "Concentration and lot decision"
      uuid: ""
    required_unit: "declared test unit"
    rule: "Record the sampled lot, sampling plan, analytical method, result, reporting limit, applicable legal or contractual limit, intended use, and accept/reject/divert decision. Never infer a concentration from a visual sort result."
  - id: packaging_tare_separation
    applies_to: "Packaged output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Exclude packaging tare from the 1 kg reference amount and inventory packaging material separately by type and mass."
process_map:
  - id: receiving_and_precleaning
    name: "Receiving and pre-cleaning"
    inclusion: "required"
    inclusion_condition: "Always included for the in-shell route; for an already-shelled route record the alternative starting condition and only the applicable receiving/cleaning operations."
    role: "Establish lot identity, incoming net mass and quality state; remove loose foreign matter before shelling."
    quantitative_reference: "Per kg of pre-cleaned material transferred."
  - id: shelling_and_size_grading
    name: "Shelling and size grading"
    inclusion: "required"
    inclusion_condition: "Included for the in-shell route; represented by the upstream shelled-input dataset for an already-shelled route."
    role: "Remove pods, separate kernels and shells, remove foreign matter, and size-grade kernels."
    quantitative_reference: "Per kg of unsorted shelled kernels produced."
  - id: aflatoxin_control_and_lot_disposition
    name: "Aflatoxin control and lot disposition"
    inclusion: "required"
    inclusion_condition: "Always included; the sampling, analysis, sorting technology, and decision rule are lot-specific."
    role: "Inspect/sort kernels, sample and test as required, establish grade and aflatoxin-control decision, and segregate rejected material."
    quantitative_reference: "Per kg of accepted graded kernels transferred."
  - id: net_mass_packaging_and_dispatch
    name: "Net mass, packaging, and dispatch preparation"
    inclusion: "required"
    inclusion_condition: "Always includes net weighing and gate handover; packaging inputs are included only for packaged output and gate storage only for the declared duration."
    role: "Establish final net output, package or prepare bulk product, record storage and transfer at facility gate."
    quantitative_reference: "Per 1 kg net shelled-groundnut output."
