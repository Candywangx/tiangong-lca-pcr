system_boundary:
  rules:
    - rule_id: sb_unrendered_identity
      applies_to: "Product and all foreground processes"
      rule: "Include only goat fatty tissue or fat raw material that remains unrendered. Rendering, melt recovery, refining, and rendered-fat production are outside the default foreground and shall not be reported as production steps for this reference flow."
      source_ids:
        - unsd-cpc-3-0-structure-2025
        - codex-cxs-211-1999
    - rule_id: sb_actual_tissue_and_gate
      applies_to: "Starting condition and product identity"
      rule: "Identify the actual anatomical tissue source and attached non-fat material, and distinguish the post-mortem inspection/slaughter-dressing boundary from the later cutting or trimming boundary. A generic goat-fat label without these facts is incomplete."
      source_ids:
        - codex-cxc-58-2005
    - rule_id: sb_cold_chain_and_handover
      applies_to: "Cooling, freezing, storage, dispatch, and delivery"
      rule: "Include the actual cold-chain processes controlled by the reporting operator through the declared handover. Record temperature-control and duration evidence; stop at the contractual handover unless an included delivery leg is explicitly declared."
      source_ids:
        - codex-cxc-58-2005
        - eu-pef-2021-2279
    - rule_id: sb_inventory_completeness
      applies_to: "Foreground resource and emission inventory"
      rule: "For each included process, inventory actual product inputs/outputs, water, energy, cleaning materials, packaging, waste water, wastes, direct emissions, refrigerant losses, and relevant transport. Apply the FDM BAT source only as a completeness and monitoring prompt, not as a legal applicability decision, emission limit, or performance benchmark."
      source_ids:
        - eu-fdm-bat-2019-2031
    - rule_id: sb_exclusions_disclosed
      applies_to: "Dataset scope"
      rule: "Document and justify excluded life-cycle stages and processes, including upstream goat production, any shared slaughter process outside the starting gate, downstream rendering/refining, post-handover transport, use, and end of life."
      source_ids:
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "A traceable lot of post-mortem-inspected goat carcass parts or cuts bearing fat enters the separation/trimming gate; alternatively, already separated unrendered goat fat enters a later foreground step with a linked upstream dataset"
  starting_condition_role: "Upstream product input to the foreground production of unrendered goat fat"
  product_classification_scope: "Goat fat, unrendered; CPC 3.0 code 21515 is classification context, while anatomical tissue, grade, and cold-chain state remain mandatory foreground qualifiers"
  recursive_input_rule: "When unrendered goat fat is received for further cooling, packing, storage, or delivery, record it once as a technosphere product input and link its upstream dataset; do not recreate separation burdens or treat the input as burden-free"
  upstream_dataset_requirement: "Goat rearing, live-animal transport, slaughter, dressing, post-mortem inspection, and any shared cutting before the declared starting gate require traceable upstream datasets with species, geography, technology, co-product treatment, and allocation disclosed; sheep or cattle parameters shall not be silently substituted"
  disclosure: "Declare anatomical source and actual tissue condition, attached muscle/connective tissue/bone, edible or technical disposition, inspection status, separation gate, chilling/freezing history, packaging, storage, dispatch origin, contractual handover, and whether transport is inside or outside the foreground"
