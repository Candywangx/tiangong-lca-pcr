allocation_rules:
  - rule_id: alloc_define_outputs
    applies_to: "Slaughter, cutting, separation, and trimming gates"
    rule: "Identify unrendered goat fat, meat, edible offal, bone, hide/skin, other usable outputs, condemned material, and wastes as distinct outputs with mass and destination. Do not merge actual tissue states or dispositions into one generic co-product."
    source_ids:
      - eu-pef-2021-2279
      - codex-cxc-58-2005
  - rule_id: alloc_direct_first
    applies_to: "Directly attributable foreground operations"
    rule: "Subdivide and directly assign separable trimming, chilling/freezing, packaging, storage, and transport inputs and emissions to the output that causes them before allocating any shared residual."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_shared_residual
    applies_to: "Shared slaughter or cutting burdens"
    rule: "When subdivision is not possible, document the selected allocation relationship, factor inputs, prices or physical drivers, geography, time period, and sensitivity. A PEF-conformant study shall apply the applicable PEF slaughterhouse rules; other studies shall justify their chosen method and shall not silently copy sheep or cattle factors into a generic goat-fat dataset."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_waste_or_product
    applies_to: "Outputs with uncertain status"
    rule: "Treat an output as waste only when its regulatory/contractual disposition and destination support that status. A saleable or usable unrendered-fat output shall not be burden-free merely because it is called a by-product."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_no_rendering_merge
    applies_to: "Downstream rendering or refining"
    rule: "Keep downstream rendering/refining outside this product system by default. If a wider study includes it, represent unrendered goat fat as the input to a separate downstream process and prevent double counting of shared slaughter or separation burdens."
    source_ids:
      - unsd-cpc-3-0-structure-2025
      - codex-cxs-211-1999
      - eu-pef-2021-2279
  - rule_id: alloc_reconciliation
    applies_to: "Allocation result"
    rule: "Reconcile allocated burdens across all co-products and wastes to the complete shared-process inventory and disclose unallocated residuals, zero-burden outputs, and sensitivity to price or physical-driver changes."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_tissue_lot_and_mass
      process_id: "fat_separation_and_trimming"
      flow_role: "Goat carcass-part/cut input and tissue identity"
      record_type: "Lot receipt, cutting, and inspection records"
      raw_fields: "lot_id; goat species confirmation; animal/lot origin; post-mortem inspection and disposition; anatomical source; attached muscle/connective tissue/bone; gross_mass; tare_mass; net_mass; timestamp"
      collection_method: "Link scale tickets and inspection/cutting records to one lot; photograph or coded tissue description where available"
      unit: "kg"
      frequency: "Every lot"
      temporal_coverage: "Complete reporting period with no omitted production days"
      site_scope: "Every included slaughter or cutting site"
      aggregation_rule: "Sum verified net input mass by lot; retain site and tissue category before any aggregation"
      quality_evidence: "Scale calibration; inspection/disposition record; lot genealogy; species declaration; completeness reconciliation"
    - protocol_id: cp_fat_output_state
      process_id: "fat_separation_and_trimming"
      flow_role: "Unrendered-fat output mass and state"
      record_type: "Lot output and product specification records"
      raw_fields: "lot_id; output_mass; tare; anatomical_source; attached_nonfat_tissue; grade; unrendered_confirmation; product_temperature; state; timestamp"
      collection_method: "Verified net weighing and lot-linked product-state observation"
      unit: "kg and °C"
      frequency: "Every lot and handoff"
      temporal_coverage: "Complete reporting period"
      site_scope: "Every included production site"
      aggregation_rule: "Sum only conforming goat-only unrendered-fat outputs; keep edible/technical grade and state separate"
      quality_evidence: "Scale calibration; product specification; time-stamped temperature; lot traceability"
    - protocol_id: cp_resources_and_emissions
      process_id: "fat_separation_and_trimming"
      flow_role: "Water, energy, cleaning materials, waste water, wastes, and direct emissions"
      record_type: "Meter, batch, stock, service, and monitoring records"
      raw_fields: "meter_id; start/end readings; material_id; quantity; process_area; wastewater_volume; monitored_parameter; waste_mass; destination; reporting_period"
      collection_method: "Prefer submetering; otherwise use a documented causal allocation from facility totals and retain raw totals"
      unit: "Native meter or purchase unit, converted explicitly"
      frequency: "Continuous or each batch/shift; aggregate monthly"
      temporal_coverage: "At least one representative reporting year or all available production campaign days"
      site_scope: "Every included site and utility system"
      aggregation_rule: "Sum by process and period, allocate only shared residuals with disclosed drivers, normalize to conforming output"
      quality_evidence: "Meter calibration; invoices; stock reconciliation; monitoring reports; production-day coverage"
    - protocol_id: cp_coproduct_waste_allocation
      process_id: "fat_separation_and_trimming"
      flow_role: "Co-product and waste mass, disposition, and allocation inputs"
      record_type: "Output, sales, transfer, waste, and price records"
      raw_fields: "lot_id; output_category; mass; disposition; destination; revenue_or_price; currency; price_period; direct_resource_link; waste_status_basis"
      collection_method: "Link each output to mass and disposition; collect contemporaneous values only when allocation requires them"
      unit: "kg and declared currency/kg"
      frequency: "Every lot; price series at the selected allocation period"
      temporal_coverage: "Same period as shared-process inventory"
      site_scope: "Every included site and destination route"
      aggregation_rule: "Direct attribution first; allocate only shared residual; reconcile factors to 100% of allocable burden"
      quality_evidence: "Scale records; contracts/invoices; waste transfer records; allocation workbook and sensitivity check"
    - protocol_id: cp_cold_chain_energy_and_state
      process_id: "cold_conditioning"
      flow_role: "Chilling/freezing energy, time, temperature, and product mass"
      record_type: "Meter, batch, equipment, and temperature records"
      raw_fields: "lot_id; equipment_id; entry/exit_mass; entry/exit_temperature; state; start/end_time; electricity_reading; defrost_or_idle_allocation"
      collection_method: "Time-stamped product/room measurements plus submetering or documented equipment allocation"
      unit: "kg, °C, h, kWh"
      frequency: "Every lot; energy at meter interval"
      temporal_coverage: "Complete reporting period including start-up, idle, and defrost operation when attributable"
      site_scope: "Every included cold-conditioning system"
      aggregation_rule: "Aggregate by equipment and lot, reconcile mass change, normalize to conditioned conforming output"
      quality_evidence: "Calibrated temperature devices; meter calibration; equipment log; alarm/deviation record"
    - protocol_id: cp_refrigerant_records
      process_id: "cold_conditioning"
      flow_role: "Refrigerant make-up and emissions"
      record_type: "Refrigerant inventory and service records"
      raw_fields: "refrigerant_identity; equipment_id; opening_stock; purchases; additions; recoveries; closing_stock; service_date; leak_event"
      collection_method: "Annual or service-period mass balance for included equipment"
      unit: "kg refrigerant"
      frequency: "Each service/leak event; annual reconciliation"
      temporal_coverage: "Same reporting period as product output"
      site_scope: "Every included refrigeration system"
      aggregation_rule: "Calculate loss by substance and allocate using documented equipment service and output driver"
      quality_evidence: "Certified service record; purchase/recovery evidence; inventory reconciliation"
    - protocol_id: cp_packaging_and_tare
      process_id: "packaging"
      flow_role: "Packaging inputs, reuse, tare, and waste"
      record_type: "Bill-of-materials, count, weighing, stock, and waste records"
      raw_fields: "material_id; item_count; unit_mass; batch_mass; reuse_cycles; gross_pack_mass; tare_mass; free_ice_mass; waste_mass; destination"
      collection_method: "Weigh representative items and reconcile issued/returned stock to packaged lots"
      unit: "kg and item"
      frequency: "Each packaging configuration and lot"
      temporal_coverage: "Complete reporting period"
      site_scope: "Every included packing site"
      aggregation_rule: "Sum by material; amortize reusable items over verified uses; keep all tare outside net product mass"
      quality_evidence: "Calibrated scale; supplier specification; stock reconciliation; reuse log; waste transfer record"
    - protocol_id: cp_storage_dispatch_handover
      process_id: "cold_storage_and_dispatch"
      flow_role: "Storage energy, duration, dispatch mass, state, and rejects"
      record_type: "Warehouse, meter, inventory, and dispatch records"
      raw_fields: "lot_id; receipt/dispatch_mass; receipt/dispatch_temperature; state; receipt/dispatch_time; storage_zone; electricity; rejects; reject_reason; handover_party"
      collection_method: "Lot-linked warehouse management and meter records; zero-duration record for immediate transfer"
      unit: "kg, °C, h, kWh"
      frequency: "Every receipt and dispatch; energy at meter interval"
      temporal_coverage: "Complete reporting period"
      site_scope: "Every included store and dispatch gate"
      aggregation_rule: "Allocate shared energy by documented causal driver; retain lot-level duration and state; reconcile opening/closing inventory"
      quality_evidence: "Meter calibration; warehouse log; dispatch acceptance; temperature record; inventory reconciliation"
    - protocol_id: cp_storage_refrigerant_records
      process_id: "cold_storage_and_dispatch"
      flow_role: "Cold-storage refrigerant emissions"
      record_type: "Refrigerant inventory and service records"
      raw_fields: "refrigerant_identity; equipment_id; opening_stock; purchases; additions; recoveries; closing_stock; transfers; service_date; leak_event"
      collection_method: "Reporting-period mass balance for included cold-storage equipment"
      unit: "kg refrigerant"
      frequency: "Each service/leak event; annual or campaign reconciliation"
      temporal_coverage: "Same reporting period as dispatched product"
      site_scope: "Every included cold-storage refrigeration system"
      aggregation_rule: "Calculate loss by substance and allocate only to included storage equipment using a documented output or equipment-use driver"
      quality_evidence: "Certified service record; purchase/recovery evidence; inventory reconciliation"
    - protocol_id: cp_transport_and_handover
      process_id: "outbound_transport_to_handover"
      flow_role: "Included delivery service and acceptance at handover"
      record_type: "Shipment, route, carrier, fuel/service, temperature, and acceptance records"
      raw_fields: "shipment_id; lot_id; net_mass; origin; destination; contractual_handover; route_distance; vehicle_type; payload; empty_return; refrigeration; departure/arrival_time; temperatures; accepted_mass"
      collection_method: "Carrier record or telematics/route evidence linked to shipment and receiving acceptance"
      unit: "kg, km, t·km, °C, h"
      frequency: "Every included shipment"
      temporal_coverage: "Complete reporting period"
      site_scope: "Every included route and carrier mode"
      aggregation_rule: "Calculate t·km from net tonnes × route km; treat return/repositioning and refrigeration consistently; normalize to accepted mass"
      quality_evidence: "Weighbridge/dispatch record; route evidence; carrier invoice; temperature log; signed acceptance"
  calculation_rules:
    - id: calc_net_mass
      applies_to: "All product and material lots"
      rule: "net_mass_kg = gross_mass_kg − measured_tare_kg − free_ice_kg; do not subtract attached goat tissue that is part of the declared product condition"
      inputs:
        - gross_mass_kg
        - measured_tare_kg
        - free_ice_kg
        - tissue_condition
      output: "net_mass_kg"
      source_ids: []
    - id: calc_reference_normalization
      applies_to: "Every inventory exchange"
      rule: "normalized_exchange = exchange_quantity / conforming_reference_output_kg; use the output mass at the same declared gate and period"
      inputs:
        - exchange_quantity
        - conforming_reference_output_kg
      output: "exchange per 1 kg unrendered goat fat"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_lot_mass_balance
      applies_to: "Separation, conditioning, packaging, storage, and delivery"
      rule: "input_mass + opening_inventory = reference_product + other_coproducts + wastes + samples + closing_inventory + measured_or_disclosed_loss; report the residual and its percentage of input"
      inputs:
        - "input/output masses"
        - "opening/closing inventory"
        - samples
        - "measured losses"
      output: "lot mass-balance residual and completeness flag"
      source_ids: []
    - id: calc_refrigerant_loss
      applies_to: "Included refrigeration equipment"
      rule: "loss_by_substance = opening_stock + purchases − additions_to_other_systems − recovered − closing_stock, adjusted for documented transfers; allocate only to included equipment and output"
      inputs:
        - stock
        - purchase
        - addition
        - recovery
        - transfer
        - "and equipment-output records"
      output: "kg refrigerant emitted by substance per 1 kg product"
      source_ids: []
    - id: calc_transport_service
      applies_to: "Included outbound delivery"
      rule: "transport_service_tkm = net_delivered_mass_kg / 1000 × route_distance_km; document treatment of empty return/repositioning and refrigeration"
      inputs:
        - net_delivered_mass_kg
        - route_distance_km
        - "vehicle and return records"
      output: "t·km per delivered lot and per 1 kg accepted product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_shared_allocation
      applies_to: "Shared slaughter or cutting residual"
      rule: "Apply the documented study-specific or applicable PEF allocation factors only after direct attribution; factor inputs shall match goat outputs, time, geography, tissue/disposition categories, and system gate, and allocated shares shall reconcile to the allocable total"
      inputs:
        - "shared residual inventory"
        - "output categories"
        - "mass/physical drivers or economic values"
        - "allocation factors"
      output: "allocated burden by output plus reconciliation and sensitivity"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_species_and_tissue_identity
      applies_to: "All lots"
      requirement: "Demonstrate goat-only species identity and declare actual anatomical tissue source and attached muscle/connective tissue/bone; mixed or unknown species lots are non-conforming."
      evidence: "Supplier/lot declaration, slaughter/cutting record, inspection record, and tissue description"
    - id: dq_unrendered_state
      applies_to: "Reference product"
      requirement: "Demonstrate that no rendering, melt recovery, refining, fractionation, or chemical modification occurred before the declared handover."
      evidence: "Process flow, equipment/process records, product specification, and operator attestation"
    - id: dq_lot_traceability
      applies_to: "All foreground processes"
      requirement: "Maintain one lot genealogy from input tissue through separation, conditioning, packaging, storage, dispatch, and included delivery."
      evidence: "Lot IDs, mass records, timestamps, warehouse/dispatch records, and acceptance record"
    - id: dq_cold_chain
      applies_to: "Chilled or frozen product"
      requirement: "Retain measured temperature/state and duration records at conditioning exit, storage, dispatch, and included delivery handover; disclose deviations and their disposition."
      evidence: "Calibrated temperature logs, alarms, deviation records, and acceptance criteria"
    - id: dq_mass_and_allocation
      applies_to: "Multi-output gates"
      requirement: "Reconcile lot mass and shared-burden allocation; disclose residuals, output status, zero-burden treatment, factor period, and sensitivity."
      evidence: "Mass-balance worksheet, allocation workbook, sales/disposition evidence, and reviewer check"
    - id: dq_resource_completeness
      applies_to: "Included foreground"
      requirement: "Cover all production days/lots in the reporting period and reconcile water, energy, cleaning materials, packaging, waste water, wastes, refrigerants, and transport to facility totals or explain exclusions."
      evidence: "Meter/invoice/stock reconciliation and coverage matrix"
    - id: dq_representativeness
      applies_to: "Published dataset"
      requirement: "State geography, technology, site count, reporting period, tissue/grade mix, cold-chain states, packaging configurations, and included handover routes; do not claim representativeness beyond them."
      evidence: "Dataset metadata and sampling/aggregation record"
    - id: dq_no_cross_species_defaults
      applies_to: "Quantitative values and ranges"
      requirement: "Do not use sheep or cattle yields, tissue composition, energy, water, loss, or allocation parameters as undocumented goat defaults. Any proxy requires explicit source, applicability justification, uncertainty, and replacement trigger."
      evidence: "Source review, proxy justification, sensitivity analysis, and review metadata"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "The product-flow UUID shall be 40180a73-975d-407f-aa3e-63588b6bf076, reference property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, reference unit kg, and reference amount 1 kg net product."
    source_ids: []
  - rule_id: val_product_scope
    applies_to: "Product identity"
    rule: "Reject a data package when species is not goat or is mixed/unknown, anatomical tissue and attached non-fat material are undisclosed, or rendering/refining occurred before handover."
    source_ids:
      - unsd-cpc-3-0-structure-2025
      - codex-cxs-211-1999
  - rule_id: val_boundary_and_handover
    applies_to: "System boundary"
    rule: "Require the separation/start gate, post-mortem inspection/disposition, included cooling/freezing, packaging, storage, dispatch, contractual handover, and transport inclusion/exclusion to be explicit."
    source_ids:
      - codex-cxc-58-2005
      - eu-pef-2021-2279
  - rule_id: val_temperature_state
    applies_to: "Chilled or frozen lots"
    rule: "Require time-stamped temperature/state and storage/transit duration records at relevant gates. This validation checks record completeness against the declared specification and does not invent a universal temperature threshold."
    source_ids:
      - codex-cxc-58-2005
  - rule_id: val_mass_balance
    applies_to: "Each lot and reporting period"
    rule: "Require mass-balance reconciliation across product, co-products, waste, samples, drip/loss, and inventory change; flag unexplained residuals rather than forcing them into the reference product."
    source_ids: []
  - rule_id: val_allocation
    applies_to: "Shared multi-output processes"
    rule: "Require direct attribution before allocation, complete output/disposition records, disclosed method/factors/period/geography, reconciliation, and sensitivity. Reject silent use of sheep or cattle parameters as generic goat-fat defaults."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_inventory_completeness
    applies_to: "Foreground inventory"
    rule: "Require coverage or an explicit exclusion for water, energy, cleaning materials, packaging, waste water, wastes, refrigerants/direct emissions, storage, and included transport. FDM BAT values or legal thresholds are not conformance criteria for this PCR."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: val_no_double_count
    applies_to: "Linked upstream and downstream datasets"
    rule: "When separated fat enters a later foreground process, require one upstream separation dataset and prevent recreation of its burdens; when rendering is modelled downstream, require a separate rendered-fat process and prevent merging it into this reference product."
    source_ids:
      - eu-pef-2021-2279
      - codex-cxs-211-1999
  - rule_id: val_quantitative_evidence
    applies_to: "Defaults, ranges, and proxies"
    rule: "Require each non-foreground quantitative constraint to have an applicable source and declared tissue/state/technology/geography basis. No goat-specific default range is supplied by this candidate; site records take precedence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for a distinct intermediate product: unrendered goat fat"
  downstream_use: "May serve as a secondary_dataset or background_dataset for processes consuming unrendered goat fat, including a separately modelled rendering process"
  allowed_use: "Use for goat-only unrendered fatty tissue matching the declared anatomical source, attached tissue, grade, cold-chain state, geography, technology, packaging, and handover gate"
  excluded_use: "Rendered or refined fat; tallow; other or mixed animal species; unspecified fat tissue; datasets lacking post-mortem disposition, cold-chain state, co-product allocation, or handover boundary; comparative claims beyond demonstrated representativeness"
  required_metadata: "PCR id; reference-flow UUID/property/unit group; CPC context; species; anatomical source; attached tissue; edible/technical grade; inspection/disposition; unrendered confirmation; site/geography; technology; reporting period; lot coverage; chilling/freezing state; packaging; storage; dispatch and handover; included transport; allocation method; upstream/downstream dataset links"
  required_quality_disclosure: "Foreground versus secondary-data shares; meter and mass coverage; exclusions; mass-balance residuals; temperature deviations; co-product/waste dispositions; allocation factors and sensitivity; proxies and uncertainty; absence of goat-specific quantitative defaults"
  update_trigger: "New reviewed goat-fat-specific evidence; change in product-flow/property/unit identity; new rendering/unrendered classification guidance; changed tissue/grade scope; materially changed separation, cold-chain, packaging, storage, transport, or allocation practice; improved foreground records that replace a proxy"
data_sources:
  - id: "unsd-cpc-3-0-structure-2025"
    type: "dataset"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0, structure only, 30 June 2025, official CSV: https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv (retrieved 2026-08-11)"
    used_for: "Official identity for CPC 21515 “Goat fat, unrendered” and separation from CPC 2152 rendered-animal-fat classes. Limitation: classification identity only; it supplies no LCA process quantities, tissue composition, temperature, yield, or allocation factor."
  - id: "codex-cxc-58-2005"
    type: "standard"
    reference: "Codex Alimentarius, Code of Hygienic Practice for Meat, CXC 58-2005: https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXC%2B58-2005%2FCXC_058e.pdf (retrieved 2026-08-11)"
    used_for: "Slaughter/cutting hygiene and inspection context, documented process control, separation/cross-contamination control, chilling/freezing, storage, and transport handover records. Limitation: food-hygiene/process-control context only; it is not a goat-fat LCA dataset and supplies no category-level inventory defaults."
  - id: "codex-cxs-211-1999"
    type: "standard"
    reference: "Codex Alimentarius, Standard for Named Animal Fats, CXS 211-1999, amended through 2024: https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXS%2B211-1999%2FCXS_211e.pdf (retrieved 2026-08-11)"
    used_for: "Confirms that named products such as rendered lard, premier jus, and edible tallow are defined through rendering and therefore are not this unrendered category. Limitation: its composition, quality, additive, and analytical provisions concern the named fats within its scope and are not extrapolated to unrendered goat fat or used as LCA values."
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I Product Environmental Footprint Method: https://eur-lex.europa.eu/eli/reco/2021/2279/oj/eng (retrieved 2026-08-11)"
    used_for: "Declared-unit/reference-flow logic for an intermediate product, system-boundary and exclusion disclosure, co-product/waste identification, direct subdivision before residual allocation, transport data, and data-quality framing. Limitation: this PCR does not copy sheep/cattle composition or operating parameters; any PEF-specific slaughterhouse allocation is applied only when the study claims that scope and meets the method’s applicability conditions."
  - id: "eu-fdm-bat-2019-2031"
    type: "official_guidance"
    reference: "Commission Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries: https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj/eng (retrieved 2026-08-11)"
    used_for: "Completeness prompt for inventories of water, energy, raw materials, waste-water/waste-gas streams, wastes, and relevant process monitoring. Limitation: used only where applicable for process-inventory and monitoring completeness; legal scope thresholds, BAT-AELs, and performance values are not generalized or used as PCR defaults."
