    reference: "Commission Recommendation (EU) 2021/2279 of 15 December 2021 on Environmental Footprint methods, Annex I, consolidated ELI https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng (retrieved 2026-08-11)"
    used_for: "Functional unit/reference flow, system boundary, relevant-flow completeness, cut-off disclosure, company-specific data quality, and multifunctionality hierarchy."
