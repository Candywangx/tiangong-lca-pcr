    reference: "Codex Alimentarius, CXC 2-1969, Code of Hygienic Practice for Canned Fruit and Vegetable Products, official text https://www.fao.org/fao-who-codexalimentarius/sh-proxy/fr/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FStandards%252FCXC%2B2-1969%252FCXC_002e.pdf (retrieved 2026-08-11)"
    used_for: "Conditional definition and process-route applicability for hermetically sealed, heat-processed products only."
  - id: "codex-cxs-242-2003"
    type: "standard"
    reference: "Codex Alimentarius, CXS 242-2003, Standard for Canned Stone Fruits, official text https://www.fao.org/fao-who-codexalimentarius/sh-proxy/pl/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FStandards%252FCXS%2B242-2003%252FCXS_242e.pdf (retrieved 2026-08-11)"
    used_for: "Conditional route/product specification and net/drained-mass records for covered canned stone fruits; not category-wide and not applicable here to peaches."
  - id: "unece-ddp-standards-2025"
    type: "standard"
    reference: "UNECE, Dry and Dried Produce Standards and Standard Layout, 2025 edition, https://unece.org/trade/wp7/DDP-Standards and https://unece.org/trade/documents/2025/12/standard-layout-unece-standards-dry-and-dried-produce-2025 (retrieved 2026-08-11)"
    used_for: "Conditional named-product quality/measurement reference only; prevents extrapolating dry/dried-product limits to CPC 21499 and does not override the simple-drying exclusion."
