allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "processes producing saleable co-products, recoverable kernels/pits, feeds, extracts, or energy"
    rule: "First avoid allocation by separately measuring and subdividing attributable operations; investigate system expansion only when the additional function and substituted system are demonstrable."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_physical_second
    applies_to: "multifunctional processes that cannot be subdivided or expanded"
    rule: "Use a quantified physical relationship relevant to the functions of the outputs, document why it represents causality, and retain masses and the selected physical property for every output."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_other_last
    applies_to: "processes lacking a defensible physical relationship"
    rule: "Use another relationship such as economic value only after documenting why subdivision/system expansion and physical allocation were rejected; record prices, reference period, currency, allocation shares, and sensitivity."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_waste_status
    applies_to: "residues, spent liquor, wastewater, and rejected products"
    rule: "Classify each output as product, co-product, recyclable material, or waste from actual legal and market evidence before allocation. Do not assign co-product status solely to avoid burdens, and report treatment inputs/outputs separately."
    source_ids:
      - eu-pef-recommendation-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_mass_balance
      process_id: "receipt_and_sorting_preparation_packaging_and_stabilization"
      flow_role: "received, accepted, transferred, and saleable masses"
      record_type: "weighbridge, scale, batch, and inventory records"
      raw_fields: "lot id; species; supplier; gross/tare/net mass; opening/closing stock; transfer mass; saleable output"
      collection_method: "calibrated scale or reconciled inventory records"
      unit: "kg"
      frequency: "each lot and batch"
      temporal_coverage: "representative continuous 12-month period or all batches in a shorter justified campaign"
      site_scope: "every included site and production line"
      aggregation_rule: "sum by batch and species; reconcile stock change; normalize to conforming saleable output"
      quality_evidence: "calibration certificates; batch reconciliation; inventory sign-off"
    - protocol_id: cp_ingredients_and_aids
      process_id: "preparation_preservation_and_formulation"
      flow_role: "formulation ingredients, packing media, and process aids"
      record_type: "recipe, issue, return, and purchase records"
      raw_fields: "material id; supplier; concentration; issued mass; returned mass; lot; solution composition"
      collection_method: "calibrated dosing system or stock issue reconciliation"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "same period as reference production"
      site_scope: "every recipe and line in scope"
      aggregation_rule: "net issued mass divided by saleable output; keep materials separate"
      quality_evidence: "recipe approval; scale calibration; supplier specification"
    - protocol_id: cp_route_operations
      process_id: "preservation_and_formulation"
      flow_role: "preserved bulk product and route parameters"
      record_type: "batch control and laboratory records"
      raw_fields: "route; time; temperature; pressure/vacuum; pH/acidity; soluble solids; moisture; water activity; in/out mass; disposition"
      collection_method: "calibrated process sensors and approved test method applicable to the route"
      unit: "declared SI unit"
      frequency: "each batch or validated continuous log"
      temporal_coverage: "same period as reference production"
      site_scope: "every declared preservation route and line"
      aggregation_rule: "retain batch distribution; mass-weight averages only for homogeneous product-route strata"
      quality_evidence: "sensor calibration; method id; standard applicability record; release disposition"
    - protocol_id: cp_utilities
      process_id: "preparation_preservation_and_formulation_packaging_and_stabilization"
      flow_role: "water, electricity, fuel, heat, cooling, and direct emissions"
      record_type: "meters, invoices, fuel tickets, equipment logs, emission tests"
      raw_fields: "meter start/end; fuel quantity; heating value; operating time; production mass; emission test or factor id"
      collection_method: "submeter preferred; otherwise documented causal allocation"
      unit: "kg, kWh, MJ, and emission-specific unit"
      frequency: "continuous or each batch; monthly invoice reconciliation"
      temporal_coverage: "at least representative 12 months unless a seasonal campaign is justified"
      site_scope: "each site; separate major line/utility system where feasible"
      aggregation_rule: "subtract non-production use; allocate by causal driver; normalize to process output and reference flow"
      quality_evidence: "meter calibration; invoice reconciliation; operating logs; factor citation"
    - protocol_id: cp_packaging
      process_id: "packaging_and_stabilization"
      flow_role: "packaging materials and rejects"
      record_type: "bill of materials, component weights, issue/return, and reject records"
      raw_fields: "component id; material; count; sample mass; issued/returned/rejected quantity; recycled content"
      collection_method: "verified component weighing and stock reconciliation"
      unit: "kg and count"
      frequency: "each packaging specification and batch"
      temporal_coverage: "same period as reference production"
      site_scope: "every packaging configuration"
      aggregation_rule: "count times verified component mass, reconciled to issued mass; normalize to saleable output"
      quality_evidence: "approved BOM; scale calibration; supplier specification"
    - protocol_id: cp_waste_and_effluent
      process_id: "all_foreground_processes"
      flow_role: "rejects, residues, wastewater, spent liquor, packaging waste, and storage loss"
      record_type: "scales, tank/flow meters, manifests, laboratory results, and destination records"
      raw_fields: "waste id; mass/volume; dry matter where relevant; composition; batch; destination; legal status; revenue; treatment"
      collection_method: "direct weighing/metering; mass balance only when direct measurement is unavailable and disclosed"
      unit: "kg, m3, and composition-specific unit"
      frequency: "each batch or waste shipment; continuous effluent meter"
      temporal_coverage: "same period as reference production"
      site_scope: "every site and outlet"
      aggregation_rule: "keep streams and destinations separate; convert volume with measured density; normalize to reference flow"
      quality_evidence: "scale/flow calibration; waste manifest; laboratory method; receiving facility record"
    - protocol_id: cp_storage_dispatch
      process_id: "storage_and_dispatch"
      flow_role: "storage resources, duration, dispatched mass, refrigerant, and loss"
      record_type: "warehouse meters, stock movements, dispatch notes, and service logs"
      raw_fields: "entry/exit time; mass; temperature; electricity; occupied capacity; refrigerant added; loss mass/cause"
      collection_method: "warehouse meter plus mass-time or capacity-time allocation; dispatch scale"
      unit: "kg, h or day, kWh, kg refrigerant"
      frequency: "each stock movement; monthly utility reconciliation"
      temporal_coverage: "same period as reference production"
      site_scope: "every on-site warehouse in scope"
      aggregation_rule: "allocate by documented mass-time/capacity-time; normalize to dispatched mass"
      quality_evidence: "meter reconciliation; dispatch records; refrigerant service certificate"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every foreground inventory amount"
      rule: "normalized amount = attributable batch amount / conforming saleable batch output in kg"
      inputs:
        - "attributable flow amount"
        - "saleable output mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_mass_balance
      applies_to: "each process and batch"
      rule: "total measured inputs + opening stock = product outputs + co-products + wastes + measured direct mass emissions + closing stock + documented reconciliation difference"
      inputs:
        - "all batch masses and stock changes"
      output: "mass-balance residual and residual percentage"
      source_ids:
        - mass-balance-identity
    - id: calc_mass_convention
      applies_to: "products in packing medium"
      rule: "calculate and retain both net content and drained edible mass using the declared test method; choose exactly one as the reference convention and report the conversion ratio"
      inputs:
        - "gross/tare/net and drained-mass records"
      output: "declared reference mass and net-to-drained ratio"
      source_ids:
        - codex-cxs-242-2003
    - id: calc_utility_allocation
      applies_to: "shared utility systems"
      rule: "subtract documented non-production use and allocate the remainder using a measured causal driver such as run time, metered throughput, heat duty, or mass processed"
      inputs:
        - "utility total"
        - "non-production use"
        - "driver values"
      output: "attributable utility by process"
      source_ids:
        - eu-pef-recommendation-2021-2279
    - id: calc_allocation_share
      applies_to: "unavoidable multifunctionality"
      rule: "allocation share = selected output driver / sum of the same driver for all co-products; economic allocation uses contemporaneous net values at the co-production point"
      inputs:
        - "output quantities"
        - "physical driver or price"
        - "reference period"
      output: "allocation share summing to 1"
      source_ids:
        - eu-pef-recommendation-2021-2279
  data_quality_requirements:
    - id: dq_identity_gate
      applies_to: "product and reference flow"
      requirement: "Retain the signed classification gate, species/formulation, route, packing medium, mass convention, package, shelf life, market state, and the exact reference UUID objects."
      evidence: "product specification; batch master; classification decision; flow identity record"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Use a representative continuous 12-month period where production is continuous; a shorter seasonal/campaign period shall cover the full campaign and explain representativeness."
      evidence: "dated records; production calendar; coverage calculation"
    - id: dq_completeness
      applies_to: "all foreground processes"
      requirement: "Inventory all environmentally relevant material, energy, waste, and direct elementary flows; quantify coverage and list omissions, proxies, and cut-offs."
      evidence: "flow checklist; mass/energy reconciliation; PEF completeness assessment"
    - id: dq_measurement
      applies_to: "meters, scales, sensors, and laboratory tests"
      requirement: "Use calibrated instruments and retain method, detection limit where relevant, conversion, sampling, and calibration evidence."
      evidence: "calibration certificate; laboratory method; raw reading and conversion record"
    - id: dq_route_representativeness
      applies_to: "heterogeneous products and technologies"
      requirement: "Do not average across materially different species, preservation routes, packing media, package formats, or storage regimes until stratified results show the average is representative."
      evidence: "product-route strata; production shares; variability analysis"
    - id: dq_source_applicability
      applies_to: "Codex/UNECE or other product standards"
      requirement: "Record exact title, edition, product species/form, route, and clause applicability. A standard that covers only a named canned or dried product shall not support the whole residual class."
      evidence: "applicability checklist; product specification; standard reference"
    - id: dq_provisional_estimates
      applies_to: "every reasoned_estimate range"
      requirement: "Mark as provisional QA guidance only. Replace before methodology activation or use as an allowed/default value when route-specific metered data, supplier records, reviewed datasets, or source-backed evidence become available; retain the replacement decision."
      evidence: "open evidence gap; replacement source; reviewer decision"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "Require product flow UUID 661926c0-3215-431a-934f-ea41ced73059, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and a reference amount of 1."
    source_ids: []
  - rule_id: validation_scope_gate
    applies_to: "product eligibility"
    rule: "Fail when the signed gate is missing, any exclusion in section 1 applies, or evidence does not distinguish the product from CPC 21491-21496 and other expressly excluded classes."
    source_ids:
      - unsd-cpc-3-0-explanatory-notes-2025
  - rule_id: validation_required_qualifiers
    applies_to: "dataset metadata"
    rule: "Fail when any section 3 required qualifier is absent or when net/drained/edible mass conventions are inconsistent."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validation_route_trace
    applies_to: "process map and inventory"
    rule: "Require every performed preservation, packaging, stabilization, cleaning, and storage operation to appear once; reject unused route-specific operations presented as actual data."
    source_ids:
      - unsd-cpc-3-0-explanatory-notes-2025
  - rule_id: validation_mass_balance
    applies_to: "each process and batch aggregation"
    rule: "Calculate the section 8 mass-balance residual, disclose its value and treatment, and fail any unexplained residual outside the producer's documented measurement-uncertainty criterion."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_inventory_completeness
    applies_to: "foreground system"
    rule: "Require records or explicit justified data gaps for major ingredients, water, electricity, thermal energy, packaging, product output, residues, wastewater, direct emissions, and on-site storage when applicable."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validation_allocation
    applies_to: "multifunctional processes"
    rule: "Require the PEF decision hierarchy, shares summing to 1, source data for the selected driver, and justification/sensitivity for any non-physical relationship."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validation_standard_scope
    applies_to: "route/product standards"
    rule: "Reject a Codex or UNECE requirement used beyond the exact product, preservation route, and edition scope; CXS 242-2003 cannot be used here to admit or model peaches."
    source_ids:
      - codex-cxc-2-1969
      - codex-cxs-242-2003
      - unece-ddp-standards-2025
  - rule_id: validation_estimate_status
    applies_to: "provisional ranges"
    rule: "Require every reasoned_estimate to remain labelled as a non-binding QA screen with its replacement trigger; it shall not be treated as an observed typical or allowed range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for a declared CPC-21499-eligible product-route-package combination."
  downstream_use: "secondary_dataset; background_dataset after review of representativeness and upstream links"
  allowed_use: "Product, process, and lifecycle model construction for the declared product, route, site/geography, period, mass convention, package, and manufacturing-gate boundary; aggregation only across demonstrated representative strata."
  excluded_use: "Automatic use for the whole CPC 21499 residual class; any CPC 21491-21496 or other excluded product; comparison or comparative assertion without a common functional unit, aligned boundary, allocation, data quality, and review; use of provisional estimates as approved defaults."
  required_metadata: "PCR id/version used; product and reference UUIDs; classification gate; species/formulation; route; process map; mass convention; packaging; shelf life; storage; site/geography; reference period; technology; upstream datasets/proxies; cut-offs; allocation; standards and editions; data quality; uncertainty; provisional estimates."
  required_quality_disclosure: "Coverage of each process and flow family; meter/scale/lab quality; mass-balance residual; temporal, geographical, and technological representativeness; missing data and proxies; allocation sensitivity; route-standard applicability; estimate replacement status."
  update_trigger: "Change in product identity/classification, formulation, preservation route, package or mass convention; material technology/site/supplier mix change; new or revised applicable standard; new source-backed range; foreground data outside existing representativeness; UUID correction; or methodology review finding."
