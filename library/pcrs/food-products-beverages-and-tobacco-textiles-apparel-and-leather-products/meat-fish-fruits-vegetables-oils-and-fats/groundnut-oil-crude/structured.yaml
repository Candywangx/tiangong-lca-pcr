allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Oil, cake/meal, shells, and route-specific operations"
    rule: "First avoid allocation by subdividing the plant and assigning inputs, emissions, and post-separation operations directly to the product or production unit that causes them."
    source_ids:
      - fao-leap-animal-feeds-2016
  - rule_id: allocation_shared_burdens
    applies_to: "Remaining shared burdens before product separation"
    rule: "When subdivision cannot resolve shared burdens, use economic allocation among crude oil and beneficial co-products using contemporaneous, documented prices; calculate factors over a representative period and ensure factors sum to one."
    source_ids:
      - fao-leap-animal-feeds-2016
  - rule_id: allocation_sensitivity
    applies_to: "Material co-products"
    rule: "Report dry-mass and gross-energy allocation as sensitivity cases when data allow, and disclose how the selected method changes the crude-oil result."
    source_ids:
      - fao-leap-animal-feeds-2016
  - rule_id: allocation_waste_definition
    applies_to: "Shells, rejects, sludge, and off-spec meal"
    rule: "Treat an output as a co-product only when a documented recipient and beneficial use exist. Waste without marketable function receives no co-product credit; its handling remains with the generating process."
    source_ids:
      - fao-leap-animal-feeds-2016
  - rule_id: allocation_data_disclosure
    applies_to: "All allocated datasets"
    rule: "Disclose co-product wet and dry masses, moisture, prices and averaging period, energy-content data where used, allocation factors, excluded outputs, and sensitivity results."
    source_ids:
      - fao-leap-animal-feeds-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_balance
      process_id: "all_active_processes"
      flow_role: "Feedstock, intermediates, oil, cake/meal, shells, products, rejects, and stocks"
      record_type: "Weighbridge, calibrated scale, tank-gauge, dispatch, and inventory records"
      raw_fields: "timestamp; batch_id; material_id; route; gross_mass; tare_mass; net_mass; moisture; opening_stock; closing_stock; destination"
      collection_method: "Reconcile batch/shift records to monthly and annual totals; retain internal-transfer identifiers"
      unit: "kg; % moisture"
      frequency: "Each batch or shift; stock at reporting-period boundaries"
      temporal_coverage: "Complete representative reporting period, normally at least 12 consecutive months"
      site_scope: "All foreground lines and storage tanks producing the declared output"
      aggregation_rule: "Sum external inputs/outputs; cancel matched internal transfers; adjust for stock change; normalize with calc_reference_normalization"
      quality_evidence: "Calibration certificates; signed weigh tickets; tank tables; stocktake reconciliation; rejected-lot records"
    - protocol_id: cp_utilities
      process_id: "all_active_processes"
      flow_role: "Electricity, fuels, steam/heat, water, and consumables"
      record_type: "Meter, submeter, invoice, purchase, and operating-hour records"
      raw_fields: "meter_id; start_reading; end_reading; invoice_quantity; fuel_type; steam_condition; process_assignment; allocation_key"
      collection_method: "Prefer submeters; reconcile invoices to site totals and document any engineering allocation"
      unit: "kWh; MJ; kg; m3"
      frequency: "Continuous/shift/monthly as available"
      temporal_coverage: "Same period as product output"
      site_scope: "All included foreground equipment"
      aggregation_rule: "Directly assign metered quantities; allocate only residual shared utility use with a documented driver"
      quality_evidence: "Meter calibration; invoices; fuel certificates; reconciliation variance"
    - protocol_id: cp_solvent_balance
      process_id: "p_solvent_extraction"
      flow_role: "Hexane input, recovery, stock, product/waste content, and releases"
      record_type: "Purchase, tank inventory, recovery meter, laboratory, wastewater, waste, and monitoring records"
      raw_fields: "opening_stock; purchases; closing_stock; recovered_reused; product_residual; wastewater_loss; waste_loss; monitored_air_release; transfers"
      collection_method: "Perform one closed solvent balance over the reporting period and investigate unexplained imbalance"
      unit: "kg"
      frequency: "Daily/shift records aggregated monthly and annually"
      temporal_coverage: "Same period as solvent-route oil output"
      site_scope: "Entire solvent handling, extraction, recovery, storage, and vent system"
      aggregation_rule: "Apply calc_hexane_balance; do not count recovered internal solvent as new external input"
      quality_evidence: "Tank calibration; purchase invoices; laboratory methods; monitoring reports; signed waste manifests"
    - protocol_id: cp_waste_emissions
      process_id: "all_active_processes"
      flow_role: "Waste, wastewater, particulate, VOC, and other releases"
      record_type: "Weigh tickets, manifests, discharge meters, stack/fugitive monitoring, and documented emission calculations"
      raw_fields: "material_or_substance; quantity; compartment; particle_size; treatment; control_device; method; uncertainty"
      collection_method: "Record by physical identity and receiving compartment; retain calculation parameters and control status"
      unit: "kg; m3"
      frequency: "Per dispatch or monitoring campaign; aggregate to reporting period"
      temporal_coverage: "Representative of normal and abnormal operating conditions"
      site_scope: "All foreground emission points and waste routes"
      aggregation_rule: "Sum measured values; use documented site calculations only for unmeasured periods"
      quality_evidence: "Laboratory accreditation; method reference; monitoring calibration; manifests; control-device logs"
    - protocol_id: cp_route_quality
      process_id: "p_receiving_preparation_extraction_processes"
      flow_role: "Feedstock condition, extraction route, oil/cake quality, and operating state"
      record_type: "Receiving inspection, laboratory, batch sheet, and control-system records"
      raw_fields: "botanical_identity; in_shell_or_shelled; moisture; mould_or_aflatoxin_control; press_type; press_passes; conditioning_time; conditioning_temperature; solvent_identity; meal_desolventized; oil_solids; intended_grade"
      collection_method: "Sample representative lots and record route settings for each campaign"
      unit: "%, °C, min, categorical"
      frequency: "Each lot/campaign with periodic laboratory tests"
      temporal_coverage: "Same period as inventory"
      site_scope: "All feedstock lots and active extraction routes"
      aggregation_rule: "Report distribution and production-weighted average where meaningful; do not replace records with benchmark values"
      quality_evidence: "Sampling plan; laboratory method; certificates of analysis; control-system logs"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = reporting-period net flow amount / reporting-period net qualifying crude-oil output"
      inputs:
        - "Reconciled external flow totals"
        - "opening/closing stocks"
        - "qualifying oil output"
      output: "Amount per 1 kg crude groundnut oil"
      source_ids: []
    - id: calc_material_balance
      applies_to: "Each active process and whole foreground system"
      rule: "imbalance = total mass inputs - total mass outputs - documented releases - closing-stock increase + opening-stock increase; report absolute and percentage imbalance"
      inputs:
        - "Wet-mass records on consistent moisture basis"
        - releases
        - "stock changes"
      output: "Mass-balance result and unexplained difference"
      source_ids: []
    - id: calc_hexane_balance
      applies_to: "Solvent route"
      rule: "net external hexane input = purchases + opening stock - closing stock - documented net transfers; reconcile this with air, wastewater, waste, and product/meal residual solvent"
      inputs:
        - "Solvent purchase"
        - stock
        - recovery
        - "product/waste content"
        - "and monitoring records"
      output: "Net hexane input and compartment-specific releases per kg crude oil"
      source_ids:
        - us-epa-ap42-9-11-1-1995
    - id: calc_allocation_factors
      applies_to: "Shared extraction burdens"
      rule: "factor_i = economic value_i / sum of economic values of all beneficial co-products; also calculate dry-mass and gross-energy sensitivity factors when data allow"
      inputs:
        - "Co-product quantities"
        - moisture
        - prices
        - "averaging period"
        - "gross energy"
      output: "Allocation factors and sensitivity cases"
      source_ids:
        - fao-leap-animal-feeds-2016
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Feedstock and reference product"
      requirement: "Demonstrate groundnut botanical source and exclude refined or blended oil from the reference output."
      evidence: "Supplier/lot identity, route record, product specification, and reference-flow UUID; codex-cxs-210-1999"
    - id: dq_temporal
      applies_to: "Foreground inventory"
      requirement: "Use one consistent representative period; disclose shutdowns, abnormal losses, campaigns, and missing months."
      evidence: "Production calendar, meter coverage, and gap log"
    - id: dq_mass_balance
      applies_to: "Material and solvent balances"
      requirement: "Reconcile all major inputs, outputs, internal transfers, stocks, wastes, and releases; investigate unexplained imbalance rather than forcing closure."
      evidence: "calc_material_balance; calc_hexane_balance; signed reconciliation"
    - id: dq_route
      applies_to: "Mechanical and solvent routes"
      requirement: "Activate only performed process modules and retain press passes, conditioning, solvent recovery, desolventizing, and control-device status."
      evidence: "Batch sheets, process diagram, and operating/control logs; fao-groundnut-postharvest-2002; us-epa-ap42-9-11-1-1995"
    - id: dq_groundnut_quality
      applies_to: "Incoming groundnuts and meal/cake destination"
      requirement: "Retain moisture, mould/aflatoxin control, rejected-lot, and destination evidence; do not classify contaminated or unusable material as a beneficial co-product."
      evidence: "Sampling and laboratory records; fao-rural-oilseed-quality-1995"
    - id: dq_uuid
      applies_to: "Tiangong references"
      requirement: "Verify every selected UUID against the intended flow type, reference property, market state, and receiving compartment before publication."
      evidence: "Tiangong identity readback and dataset review record"
validation_rules:
  - rule_id: validate_product_identity
    applies_to: "Reference product"
    rule: "Fail if the output is refined, blended, from another botanical source, or lacks the crude-oil route/grade declaration."
    source_ids:
      - codex-cxs-210-1999
  - rule_id: validate_reference_flow
    applies_to: "Quantitative reference"
    rule: "Require exactly 1 kg after normalization, product-flow UUID 4becfdba-2a4c-4c6f-a503-75db987fdc16, Mass property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, and Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "Foreground system"
    rule: "Require mill receipt through physical clarification/storage/loadout, prohibit refining, and require upstream datasets rather than recursive reconstruction."
    source_ids:
      - fao-groundnut-postharvest-2002
      - us-epa-ap42-9-11-1-1995
  - rule_id: validate_route_inventory
    applies_to: "Active processes"
    rule: "Require preparation and clarification; require mechanical and/or solvent module consistent with the declared route and all route-specific inputs, co-products, wastes, and releases."
    source_ids:
      - fao-rural-oilseed-quality-1995
      - fao-groundnut-postharvest-2002
      - us-epa-ap42-9-11-1-1995
  - rule_id: validate_material_balance
    applies_to: "Each process and total system"
    rule: "Require a disclosed material-balance result on consistent wet/dry basis, stock changes, internal-transfer cancellation, and investigation of unexplained imbalance."
    source_ids: []
  - rule_id: validate_solvent_route
    applies_to: "Solvent extraction"
    rule: "If solvent is used, require solvent identity, recovery-system description, net external solvent input, stock-adjusted mass balance, product/waste residuals, and compartment-specific releases; otherwise mark the check skipped as not applicable."
    source_ids:
      - us-epa-ap42-9-11-1-1995
  - rule_id: validate_allocation
    applies_to: "Co-products"
    rule: "Require subdivision before allocation, documented beneficial-use decisions, economic factors summing to one for remaining shared burdens, and dry-mass/gross-energy sensitivity where data allow."
    source_ids:
      - fao-leap-animal-feeds-2016
  - rule_id: validate_qualifiers_and_quality
    applies_to: "Dataset metadata"
    rule: "Require all reference-flow qualifiers, temporal/site coverage, feedstock condition, co-product destinations, UUID review, and quality evidence."
    source_ids:
      - fao-rural-oilseed-quality-1995
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate production dataset for crude groundnut oil at the producing mill gate"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product carbon footprint and LCA models that need an explicit crude-groundnut-oil production stage; connection to representative upstream groundnut/utility datasets and downstream refining datasets"
  excluded_use: "Direct representation of refined retail oil; comparative public claims without equivalent upstream, allocation, and quality scope; use of route-inapplicable solvent or pressing data"
  required_metadata: "Geography; reporting period; plant technology; feedstock origin and in-shell/shelled state; route; oil grade; reference-flow qualifiers; upstream datasets; co-product fates; allocation; mass-balance and solvent-balance methods"
  required_quality_disclosure: "Foreground coverage; meter and scale coverage; stock reconciliation; moisture basis; abnormal operations; missing data; UUID selection; emission method; allocation sensitivity; unresolved imbalance"
  update_trigger: "Material change in feedstock state, extraction route, solvent/control system, clarification boundary, product grade, co-product destination, allocation method, technology, geography, or representative reporting period"
