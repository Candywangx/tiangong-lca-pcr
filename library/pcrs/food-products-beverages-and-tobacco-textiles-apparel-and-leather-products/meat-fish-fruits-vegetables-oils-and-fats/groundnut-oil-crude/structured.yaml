        - codex-cxs-210-1999
        - fao-groundnut-postharvest-2002
    - rule_id: boundary_route_specific_steps
      applies_to: "Extraction route"
      rule: "Include shelling, conditioning, pressing passes, solvent extraction, desolventizing, meal drying/cooling, solvent recovery, and clarification only when performed; the route declaration shall control which conditional processes are active."
      source_ids:
        - fao-rural-oilseed-quality-1995
        - fao-groundnut-postharvest-2002
        - us-epa-ap42-9-11-1-1995
    - rule_id: boundary_internal_recycling
      applies_to: "Recovered oil, solvent, water, and solids"
      rule: "Record internal loops once and report only net external inputs and releases, while retaining gross recovery data needed to verify the balance."
      source_ids:
        - us-epa-ap42-9-11-1-1995
    - rule_id: boundary_no_refining
      applies_to: "Crude-oil product"
      rule: "Stop before alkali or physical refining, bleaching, deodorization, winterization, fractionation, or formulation."
      source_ids:
        - us-epa-ap42-9-11-1-1995
