system_boundary:
  rules:
    - rule_id: boundary_received_to_crude_gate
      applies_to: "All datasets"
      rule: "Include all foreground operations from mill receipt of groundnuts through qualifying crude-oil storage and loadout; exclude cultivation and refining while linking their datasets only when required by the study system."
