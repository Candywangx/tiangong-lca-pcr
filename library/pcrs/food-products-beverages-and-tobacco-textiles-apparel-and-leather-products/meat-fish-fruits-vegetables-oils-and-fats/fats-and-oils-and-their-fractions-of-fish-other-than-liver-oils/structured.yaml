    reference: "Codex Alimentarius, CXS 211-1999, Standard for Named Animal Fats, adopted 1999 and amended through 2024. https://workspace.fao.org/sites/codex/Standards/CXS%20211-1999/CXS_211e.pdf (retrieved 2026-08-12)"
    used_for: "Scope contrast excluding named terrestrial animal fats such as lard and tallow from this fish-oil PCR"
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 of 15 December 2021 on the use of the Environmental Footprint methods. https://eur-lex.europa.eu/eli/reco/2021/2279/oj (retrieved 2026-08-12)"
    used_for: "Functional unit, explicit system boundary, company-specific foreground data, inventory completeness, data quality, allocation hierarchy, reporting, and validation"
  - id: "eu-fdm-bat-2019"
    type: "official_guidance"
    reference: "Commission Implementing Decision (EU) 2019/2031 of 12 November 2019 establishing BAT conclusions for the food, drink and milk industries. https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj (retrieved 2026-08-12)"
    used_for: "Applicability check: primary fish-oil production is excluded from FDM BAT scope; direct emission and wastewater records must rely on actual site methods and applicable sectoral rules rather than imported FDM values"
