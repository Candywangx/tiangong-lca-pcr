allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Multi-output extraction, refining, and fractionation"
    rule: "First avoid allocation by subdividing the performed processes and directly measuring material, utility, emission, and waste flows for independently operated stages or product lines."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_supplier_input
    applies_to: "Purchased fish-processing material or oil"
    rule: "Preserve the upstream burden and allocation status declared by the supplying dataset. Do not assign zero upstream burden merely because the input is described as a by-product, residue, or low-value material."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical_relation
    applies_to: "Unresolved jointly produced outputs"
    rule: "After practicable subdivision, apply a documented physical causal relationship when it reflects how changing co-product output changes foreground inputs and emissions. Simple mass allocation shall not be labelled causal without justification."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_economic_fallback
    applies_to: "Joint outputs without a defensible physical causal relationship"
    rule: "Use economic allocation only as a disclosed fallback. Record product-specific quantities, price source, price basis, currency, geography, reference period, treatment of negative or zero values, and a sensitivity test for material co-products."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_waste_and_recovery
    applies_to: "Wastes, residues, recovered materials, and treatment outputs"
    rule: "Classify each output from documented legal/market status and destination. Do not credit a waste as a co-product without a demonstrated function and market; model treatment burdens and any recovery consistently with the selected downstream dataset."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_mass_balance
    applies_to: "All multi-output processes"
    rule: "Before allocation, reconcile measured inputs, products, co-products, wastes, and measured stock change on a consistent wet or actual-state mass basis; disclose unexplained imbalance rather than forcing it into oil yield."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipt_identity
      process_id: "material_receipt_and_segregation"
      flow_role: "received and rejected material identity"
      record_type: "receiving log, supplier declaration, traceability record, weighbridge record"
      raw_fields: "lot_id; supplier; fish_scientific_name_or_taxon; common_name; wild_or_farmed; anatomical_part_or_stream; liver_exclusion_evidence; incoming_state; gross_mass; tare_mass; accepted_mass; rejected_mass; rejection_reason; destination"
      collection_method: "verify documentary identity against physical lot, record mass, and retain explicit liver-exclusion evidence"
      unit: "kg plus text qualifiers"
      frequency: "every lot"
      temporal_coverage: "all lots in reference period"
      site_scope: "all supplying origins and receiving points serving the dataset"
      aggregation_rule: "sum accepted and rejected masses by lot; do not combine lots before qualifiers are preserved"
      quality_evidence: "signed/controlled receiving record, supplier specification, traceability certificate, scale calibration, segregation record"
    - protocol_id: cp_process_mass_balance
      process_id: "oil_recovery_and_separation"
      flow_role: "process feeds, products, co-products, wastes, and stock change"
      record_type: "batch sheet, tank gauge, scale record, flowmeter, disposal record"
      raw_fields: "process_id; lot_id; stream_id; stream_role; opening_stock; input_mass; output_mass; closing_stock; moisture_or_carrier_basis; destination"
      collection_method: "reconcile calibrated measurements for every material stream on one stated mass basis"
      unit: "kg"
      frequency: "every batch or continuous production campaign"
      temporal_coverage: "representative period covering routine operating variability"
      site_scope: "all included lines and shifts"
      aggregation_rule: "calculate mass balance by process and lot/campaign before normalizing to product output"
      quality_evidence: "instrument calibration, batch sign-off, tank conversion table, reconciliation record"
    - protocol_id: cp_utilities_and_media
      process_id: "oil_recovery_and_separation"
      flow_role: "electricity, fuels, steam, heat, cooling, water, and processing media"
      record_type: "submeter, utility meter, batch issue, invoice reconciliation"
      raw_fields: "process_id; lot_or_period; utility_or_medium; opening_reading; closing_reading; quantity; unit; shared_load_basis; operating_hours; production_mass"
      collection_method: "prefer process submetering; otherwise allocate shared use with a documented engineering driver and reconcile to invoice totals"
      unit: "recorded physical unit"
      frequency: "each batch/campaign or at least monthly with production matching"
      temporal_coverage: "same period as production data"
      site_scope: "all included equipment and shared services"
      aggregation_rule: "subtract non-production use where measured, allocate shared use, convert units transparently, and normalize to actual product mass"
      quality_evidence: "meter calibration, invoice, boiler log, engineering allocation basis, completeness reconciliation"
    - protocol_id: cp_refining_inputs
      process_id: "refining_and_purification"
      flow_role: "refining aids and additives"
      record_type: "recipe, material issue, purchase and stock record"
      raw_fields: "lot_id; substance_name; function; concentration; issued_quantity; returned_quantity; stock_change; unit; supplier; recovery_or_destination"
      collection_method: "record net consumed quantity by named substance for each refining sequence"
      unit: "kg, L, or recorded unit"
      frequency: "every refining lot"
      temporal_coverage: "all refining lots in reference period"
      site_scope: "all included refining lines"
      aggregation_rule: "net issue equals issued minus returned plus attributable stock change; normalize to accepted refined oil"
      quality_evidence: "approved recipe, batch record, inventory reconciliation, supplier identity"
    - protocol_id: cp_emissions_and_discharges
      process_id: "oil_recovery_and_separation"
      flow_role: "direct air and water emissions"
      record_type: "continuous monitor, periodic test, discharge meter, laboratory analysis, fuel calculation"
      raw_fields: "process_id; source_id; substance; concentration; flow; duration; quantity; method; detection_limit; discharge_destination"
      collection_method: "use site permit or recognized measurement/calculation method and preserve non-detect treatment"
      unit: "kg, kg/m3, m3, or method unit"
      frequency: "as required by permit and sufficient to represent the reference period"
      temporal_coverage: "same production period, with episodic events identified"
      site_scope: "all attributable stacks, vents, and discharge points"
      aggregation_rule: "calculate substance load from concentration and flow where needed, map to production, and normalize to reference product"
      quality_evidence: "laboratory accreditation, method reference, calibration, permit report, uncertainty and detection-limit record"
    - protocol_id: cp_product_mass_and_quality
      process_id: "storage_packaging_and_dispatch"
      flow_role: "accepted oil/fraction mass and CXS conformity evidence"
      record_type: "tank/scale record, certificate of analysis, release record"
      raw_fields: "lot_id; product_mass; species_or_taxon; anatomical_source; liver_exclusion_confirmation; named_or_unnamed_oil; processing_state; applicable_cxs_section; test_result; test_unit; analytical_method; acceptance_status"
      collection_method: "measure released mass and retain test results needed for the declared CXS 329-2017 product type"
      unit: "kg and method-specific units"
      frequency: "every released lot"
      temporal_coverage: "all lots in reference period"
      site_scope: "every product grade and production line in scope"
      aggregation_rule: "sum only released conforming mass; keep off-specification mass as a separate output"
      quality_evidence: "calibrated mass record, chain of custody, accredited or controlled laboratory report, quality release signature"
    - protocol_id: cp_storage_packaging_dispatch
      process_id: "storage_packaging_and_dispatch"
      flow_role: "storage inputs, packaging, dispatch, and losses"
      record_type: "tank log, bill of materials, material issue, dispatch note, cleaning record"
      raw_fields: "lot_id; opening_stock; received_mass; dispatched_mass; closing_stock; loss_mass; electricity; inert_gas; additive; packaging_material; packaging_mass; cleaning_material; waste_destination"
      collection_method: "reconcile storage stock and record actual packaging and preservation inputs for the declared market state"
      unit: "kg, kWh, m3, or recorded unit"
      frequency: "each lot with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "all tanks, filling lines, and packaging formats in scope"
      aggregation_rule: "reconcile opening plus receipts to dispatch plus closing stock and losses; normalize inputs to net product mass"
      quality_evidence: "tank calibration, BOM revision, dispatch record, inventory reconciliation, waste transfer record"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "Reference product"
      rule: "net reference product mass = gross dispatched product-and-container mass - empty container/packaging mass; tank or bulk measurements use calibrated net oil mass directly"
      inputs:
        - "gross mass"
        - "tare or packaging mass"
        - "calibrated bulk mass"
      output: "kg net reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_process_yield
      applies_to: "Each performed conversion process"
      rule: "process yield = measured accepted target oil or fraction output / measured eligible feed input on the same stated mass basis; report the calculated value without applying a generic default"
      inputs:
        - "same-lot accepted output mass"
        - "eligible feed mass"
        - "mass-basis statement"
      output: "kg target output per kg eligible feed"
      source_ids:
        - codex-cxs-329-2017
    - id: calc_mass_balance_closure
      applies_to: "Each process and lot/campaign"
      rule: "closure = (total measured outputs + closing stock - opening stock) / total measured inputs; report unmeasured evaporation or sampling only when supported by records and disclose remaining imbalance"
      inputs:
        - "all input/output masses"
        - "opening and closing stock"
      output: "dimensionless closure and unexplained kg imbalance"
      source_ids:
        - eu-pef-2021
    - id: calc_normalized_inventory
      applies_to: "Foreground inventory rows"
      rule: "normalized amount = attributable measured or calculated flow quantity / net reference product mass from the same aligned production period"
      inputs:
        - "attributable flow quantity"
        - "net product mass"
        - "unit conversion"
      output: "flow amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_emission_load
      applies_to: "Measured discharges"
      rule: "substance load = measured concentration x measured discharge volume, with unit conversion and documented handling of non-detects; use direct mass measurement when available"
      inputs:
        - concentration
        - "volume or flow and duration"
        - "detection-limit treatment"
      output: "kg substance per period and per kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_allocation_factor
      applies_to: "Unavoidable allocation"
      rule: "factor_i = selected physical causal quantity_i / sum quantities, or economic value_i / sum values for the documented fallback; apply one consistent basis to all jointly attributable foreground flows"
      inputs:
        - "co-product quantities or values"
        - "allocation basis"
        - "reference period"
      output: "allocation factor by output"
      source_ids:
        - eu-pef-2021
    - id: calc_liver_exclusion_balance
      applies_to: "Receiving and product traceability"
      rule: "liver-containing accepted input shall equal zero; any detected or declared liver material is recorded as rejected/ineligible and excludes the affected product lot from this PCR"
      inputs:
        - "receiving identity records"
        - "segregation records"
        - "rejected mass"
        - "product genealogy"
      output: "pass/fail plus kg rejected liver-containing material"
      source_ids:
        - unsd-cpc-3-0-2025
        - codex-cxs-329-2017
  data_quality_requirements:
    - id: dqr_identity_traceability
      applies_to: "Product and material identity"
      requirement: "Trace every reference-product lot to species/taxon, anatomical part or material stream, origin, wild/farmed status when applicable, and explicit liver-exclusion evidence."
      evidence: "supplier declarations, receiving records, segregation records, batch genealogy, product release record"
    - id: dqr_measurement
      applies_to: "Mass, utilities, and emissions"
      requirement: "Use calibrated or controlled measurements; document conversion factors, shared-resource allocation drivers, detection limits, and measurement uncertainty where material."
      evidence: "calibration certificates, meter records, laboratory methods, invoice reconciliation, calculation sheets"
    - id: dqr_temporal
      applies_to: "Foreground data"
      requirement: "Use a common representative reference period, normally at least 12 consecutive months unless a shorter campaign is the entire production cycle; justify seasonality and abnormal-event treatment."
      evidence: "dated production, utility, purchase, emission, and dispatch records"
    - id: dqr_technological
      applies_to: "Included processes"
      requirement: "Match actual extraction, separation, refining, purification, fractionation, storage, and packaging technologies; do not substitute a generic fish-oil route without disclosure."
      evidence: "process flow diagram, equipment list, batch instructions, operating logs"
    - id: dqr_geographical
      applies_to: "Foreground and upstream data"
      requirement: "Represent the actual facility and supplying regions, electricity grid, fuels, water, transport, and treatment services; disclose any proxy geography."
      evidence: "site address, supplier origins, dataset metadata, utility contracts, treatment records"
    - id: dqr_completeness
      applies_to: "Foreground inventory"
      requirement: "Reconcile every performed process across material inputs, products, co-products, wastes, stock changes, utilities, wastewater, and direct emissions. Document exclusions and demonstrate they do not hide liver input or a material environmental flow."
      evidence: "mass and energy reconciliations, cut-off log, missing-data register, emission inventory"
    - id: dqr_no_generic_ranges
      applies_to: "Energy, composition, and yield"
      requirement: "Do not use a universal fish-oil energy, composition, or yield value. Where source-backed ranges are absent, retain a foreground-data requirement and flag missing observations for replacement before publication or comparative use."
      evidence: "foreground collection protocols, certificates of analysis, unresolved-data register, source review"
    - id: dqr_source_currency
      applies_to: "External rules and datasets"
      requirement: "Verify that CXS 329-2017, applicable legal requirements, upstream datasets, and analytical methods are current for the declared geography and product at dataset release."
      evidence: "dated source register, version record, dataset metadata, regulatory review"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The product flow UUID shall equal dacba994-e061-44ed-940e-61f7820422c6, the Mass property UUID shall equal 93a60a56-a3c8-11da-a746-0800200b9a66, the unit-group UUID shall equal 93a60a57-a4c8-11da-a746-0800200c9a66, and the net reference amount shall equal 1 kg."
    source_ids: []
  - rule_id: validate_species_and_part
    applies_to: "Product and eligible inputs"
    rule: "Fail validation when the fish species/taxon or anatomical part/material stream is missing, is only stated as generic fish material, or cannot be traced from reference product to received lot."
    source_ids:
      - codex-cxs-329-2017
  - rule_id: validate_no_liver
    applies_to: "Product category boundary"
    rule: "Fail validation when liver, liver-derived oil, a mixture containing fish-liver oil, or unresolved liver status enters the reference product genealogy."
    source_ids:
      - unsd-cpc-3-0-2025
      - codex-cxs-329-2017
  - rule_id: validate_excluded_categories
    applies_to: "Product classification"
    rule: "Fail validation for marine-mammal oil, shellfish oil, terrestrial animal fat, fatty-acid ethyl ester, or chemically modified oil outside CPC 21525."
    source_ids:
      - unsd-cpc-3-0-2025
      - codex-cxs-211-1999
      - codex-cxs-329-2017
  - rule_id: validate_cxs_applicability
    applies_to: "Declared product grade"
    rule: "Require the dataset to identify the applicable CXS 329-2017 product description and processing state and to retain the corresponding conformity evidence. Do not apply named-oil composition ranges to an undeclared or different oil type."
    source_ids:
      - codex-cxs-329-2017
  - rule_id: validate_process_route
    applies_to: "Process map and inventory"
    rule: "Every performed foreground step shall appear in the process map and inventory; every included process shall have matched-period inputs, outputs, utilities, wastes, and direct emissions or a documented zero/not-applicable basis."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_mass_balance
    applies_to: "Each performed process"
    rule: "Require a disclosed mass-balance closure and unexplained imbalance for each lot or aligned campaign; prohibit forced balancing through an invented product yield or composition."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_foreground_values
    applies_to: "Energy, water, aids, yield, and emissions"
    rule: "Require foreground records or documented calculations from those records. Reject generic energy, water, composition, and yield defaults not supported by a cited source and declared applicability."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_allocation
    applies_to: "Multi-output processes"
    rule: "Require subdivision evidence or a documented physical causal relationship; when economic allocation is used, require prices, period, geography, currency, treatment of zero/negative values, and sensitivity results."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_data_quality
    applies_to: "Published dataset"
    rule: "Require identity, technological, temporal, geographical, measurement, completeness, source-currency, missing-data, and proxy disclosures sufficient for review and downstream reuse."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_fdm_bat_scope
    applies_to: "BAT or regulatory claims"
    rule: "Reject any claim that Decision (EU) 2019/2031 supplies generic fish-oil BAT performance or emission values; its stated exclusion of primary fish-oil production shall be disclosed when the source is referenced."
    source_ids:
      - eu-fdm-bat-2019
published_dataset_profile:
  dataset_role: "Facility-gate foreground production dataset for one declared non-liver fish oil or physical fraction"
  downstream_use: "secondary_dataset; background_dataset when independently reviewed and the user confirms scope, geography, technology, and product-grade representativeness"
  allowed_use: "LCA of food-grade non-liver fish oil production and downstream food products when species/taxon, anatomical source, route, allocation, geography, period, and market state match the intended use"
  excluded_use: "Fish-liver oil; mixtures containing liver oil; shellfish or marine-mammal oil; terrestrial animal fats; chemically modified oils or fatty-acid ethyl esters outside CPC 21525; feed or technical-grade products; comparative assertions without applicable review and equivalent modelling choices"
  required_metadata: "PCR id and version; reference UUIDs; species/taxon; anatomical part/material stream; liver-exclusion evidence; wild/farmed status when applicable; crude/refined/fraction state; named/unnamed oil; performed process route; facility geography; reference period; allocation; cut-off; upstream dataset list; CXS applicability; packaging state"
  required_quality_disclosure: "Measurement and calibration basis; lot and temporal coverage; mass-balance closure; utility allocation; product-quality methods; co-product and waste classification; direct-emission methods; missing data; proxies; uncertainty; source versions; review status"
  update_trigger: "Change in species or anatomical source, inclusion of liver material, raw-material supply system, extraction/refining/fractionation technology, product grade or CXS applicability, allocation basis, packaging state, site, utility mix, emission controls, legal requirements, or a material improvement in foreground evidence"
