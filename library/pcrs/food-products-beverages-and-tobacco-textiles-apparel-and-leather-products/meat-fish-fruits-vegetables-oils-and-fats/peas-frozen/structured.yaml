allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared processes and utilities"
    rule: "Avoid allocation by subdividing processes and using process meters, lot masses, operating time, occupied cold-store volume and storage duration. System expansion may be used only when the additional function and substituted system are demonstrated and reported."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_internal_rework
    applies_to: "Peas reworked within the same production system"
    rule: "Treat internal rework as an internal transfer. Retain its mass in the lot balance and assign no avoided-product credit."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residue_status
    applies_to: "Pods, rejected peas and other organic residues"
    rule: "Classify residues as waste unless a stable intended product function and market are documented. If they are co-products, first apply a relevant quantifiable physical relationship; use another relationship such as economic value only when physical allocation is not defensible, and disclose prices, period and sensitivity."
    source_ids:
      - eu-pef-2021-2279
      - eu-jrc-fdm-bref-2019
  - rule_id: allocation_waste_treatment
    applies_to: "Waste and wastewater treatment"
    rule: "Assign on-site treatment directly where measured. Allocate shared treatment using a documented causal driver such as wastewater volume and pollutant load; link off-site treatment to the measured outgoing waste flow."
    source_ids:
      - eu-pef-2021-2279
      - eu-jrc-fdm-bref-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_mass_quality
      process_id: "pea_receipt_preparation_blanching_cooling_quick_freezing_packing_cold_storage"
      flow_role: "Pea inputs, intermediates, final output and product quality"
      record_type: "Scale tickets, batch records and laboratory or quality-control records"
      raw_fields: "lot_id; timestamp; gross_mass; tare_mass; net_mass; process_point; supplier; pea_type; size_grade; reject_reason; blanch_schedule; freezer_exit_temperature; final_grade"
      collection_method: "Calibrated scales and documented sampling or release tests linked by lot"
      unit: "kg; °C; min"
      frequency: "Each lot and each material transfer"
      temporal_coverage: "Full declared production campaign; aggregate no less than one complete representative campaign"
      site_scope: "All foreground lines and storage locations represented by the dataset"
      aggregation_rule: "Sum compatible net masses; retain lot traceability; calculate mass-weighted values per kg released product"
      quality_evidence: "Calibration records; tare checks; sampling plan; release authorization; outlier log"
    - protocol_id: cp_water_metering
      process_id: "pea_receipt_preparation_blanching_cooling"
      flow_role: "Purchased, reused and discharged water"
      record_type: "Meter logs, invoices and reuse-loop records"
      raw_fields: "meter_id; opening_reading; closing_reading; timestamp; process_area; reuse_volume; downtime; production_mass"
      collection_method: "Calibrated meters reconciled to invoices; estimate only with documented engineering calculation"
      unit: "m3"
      frequency: "Daily or per batch, reconciled monthly"
      temporal_coverage: "Same period as production data"
      site_scope: "Site and process-area meters covering washing, blanching, cooling and sanitation"
      aggregation_rule: "Net purchased water equals gross supply minus documented non-production uses; internal reuse reported separately"
      quality_evidence: "Meter calibration; invoice reconciliation; missing-data log"
    - protocol_id: cp_energy_metering
      process_id: "pea_receipt_preparation_blanching_cooling_quick_freezing_packing_cold_storage"
      flow_role: "Electricity and thermal-energy carriers"
      record_type: "Submeters, fuel invoices, boiler and equipment logs"
      raw_fields: "carrier; meter_id; opening_reading; closing_reading; fuel_mass_or_volume; steam_mass; operating_hours; equipment_power; production_mass"
      collection_method: "Carrier-specific meter or invoice reconciliation; engineering calculation only where submetering is absent"
      unit: "kWh; MJ; kg; m3"
      frequency: "Continuous or daily, reconciled monthly"
      temporal_coverage: "Same period as production data and seasonal campaign"
      site_scope: "All processing, refrigeration, storage and shared utilities assigned to the declared site"
      aggregation_rule: "Preserve carrier; subtract documented non-production use; allocate shared loads by causal driver"
      quality_evidence: "Meter calibration; invoice reconciliation; equipment run logs; conversion-factor source"
    - protocol_id: cp_waste_wastewater
      process_id: "pea_receipt_preparation_blanching_cooling_packing_cold_storage"
      flow_role: "Solid residues, rejects, packaging waste and wastewater"
      record_type: "Weighbridge tickets, waste manifests, discharge meters and laboratory results"
      raw_fields: "waste_type; mass; volume; destination; regulatory_status; rework_mass; BOD; COD; TSS; nitrogen; phosphorus; sampling_time"
      collection_method: "Weighing and metering by stream; laboratory analysis under the site's applicable method"
      unit: "kg; m3; mg/L"
      frequency: "Each shipment or continuous discharge with representative sampling"
      temporal_coverage: "Same period as production data"
      site_scope: "All on-site waste and wastewater outlets"
      aggregation_rule: "Sum by stream and destination; exclude documented internal rework from outgoing waste"
      quality_evidence: "Scale and meter checks; manifests; laboratory reports; chain of custody"
    - protocol_id: cp_refrigerant_inventory
      process_id: "quick_freezing_packing_cold_storage"
      flow_role: "Refrigerant make-up, recovery and release"
      record_type: "Refrigerant inventory, purchase, maintenance and recovery records"
      raw_fields: "refrigerant_species; opening_inventory; purchases; additions; recovered_mass; closing_inventory; equipment_id; service_date"
      collection_method: "Annual or campaign mass balance by refrigerant species and equipment system"
      unit: "kg"
      frequency: "Each service event; reconciled annually or per complete campaign"
      temporal_coverage: "Same period as production data, including shutdown service"
      site_scope: "All refrigeration equipment serving freezing and on-site storage"
      aggregation_rule: "Release equals opening plus purchases minus closing inventory and documented recovery, with unexplained imbalance disclosed"
      quality_evidence: "Certified service records; cylinder weights; inventory reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "packing_cold_storage"
      flow_role: "Packaging material inputs"
      record_type: "Bills of materials, purchase and inventory records"
      raw_fields: "packaging_format; material; unit_mass; units_used; opening_stock; purchases; closing_stock; packed_product_mass"
      collection_method: "Verified bill of materials reconciled to stock change"
      unit: "kg"
      frequency: "Each packaging format; reconciled monthly"
      temporal_coverage: "Same period as production data"
      site_scope: "All primary, secondary and attributable tertiary packaging"
      aggregation_rule: "Material mass per kg net packed product; bulk unpackaged product reported as zero with evidence"
      quality_evidence: "Supplier specification; sample weigh checks; stock reconciliation"
    - protocol_id: cp_temperature_storage
      process_id: "quick_freezing_packing_cold_storage"
      flow_role: "Freezer completion, cold-store temperature and storage electricity allocation"
      record_type: "Product-probe readings, continuous logger data and warehouse records"
      raw_fields: "lot_id; probe_id; location; timestamp; product_temperature; store_temperature; pallet_days; occupied_volume; electricity; alarms; corrective_action"
      collection_method: "Validated temperature probes and continuous cold-store monitoring linked to inventory movements"
      unit: "°C; day; m3; kWh"
      frequency: "Each lot at freezer exit; continuous storage monitoring"
      temporal_coverage: "Entire on-site storage period for included lots"
      site_scope: "Freezer exits and all cold rooms used by the dataset"
      aggregation_rule: "Calculate mass- or volume-time-weighted storage demand; retain excursions separately"
      quality_evidence: "Probe calibration; logger completeness; alarm and corrective-action records"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "All inventory amounts"
      rule: "normalized amount = period or lot amount / net kg conforming frozen peas released"
      inputs:
        - "Collected flow amount"
        - "reference_frozen_peas net mass"
      output: "Amount per 1 kg reference flow"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_pea_mass_balance
      applies_to: "Pea material through all four processes"
      rule: "fresh pea input + external frozen-pea input = reference frozen peas + outgoing rejects + measured product losses + inventory change; internal transfers and rework cancel"
      inputs:
        - "Mass records from cp_lot_mass_quality and cp_waste_wastewater"
      output: "Reconciled pea mass balance and unexplained difference"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_net_water
      applies_to: "Purchased and reused water"
      rule: "net technosphere water input = gross site supply - documented non-production use; internal reuse is reported but not added again"
      inputs:
        - "Meter and invoice fields from cp_water_metering"
      output: "Net purchased water and reuse indicator"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_refrigerant_release
      applies_to: "Refrigeration systems"
      rule: "release = opening inventory + purchases - closing inventory - documented recovery; negative or unexplained values require investigation"
      inputs:
        - "Refrigerant fields from cp_refrigerant_inventory"
      output: "Species-specific direct air emission"
      source_ids:
        - codex-cxc-8-1976
    - id: calc_storage_energy
      applies_to: "On-site cold storage"
      rule: "allocated storage electricity = cold-store electricity × lot occupied-volume-time / total occupied-volume-time, unless direct submetering is available"
      inputs:
        - kWh
        - "occupied m3 and duration from cp_temperature_storage"
      output: "kWh per kg reference flow"
      source_ids:
        - eu-jrc-fdm-bref-2019
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Product and reference flow"
      requirement: "Maintain lot-level linkage from received peas through finished frozen-pea release and retain the exact Tiangong reference-flow UUID, flow-property UUID and unit-group UUID."
      evidence: "Lot genealogy, batch records and dataset metadata"
    - id: dq_temporal_coverage
      applies_to: "Foreground activity data"
      requirement: "Cover one complete representative production campaign for seasonal processing and all included on-site storage; disclose dates, downtime and any extrapolation. Prefer a consecutive 12-month period when the site operates year-round."
      evidence: "Production calendar, meter coverage and missing-data log"
    - id: dq_measurement_quality
      applies_to: "Mass, water, energy, temperature and refrigerant records"
      requirement: "Use calibrated instruments or reconciled invoices. Record estimation method, conversion factors, missing-data treatment and uncertainty whenever direct measurement is unavailable."
      evidence: "Calibration certificates, invoices, reconciliation and calculation files"
    - id: dq_completeness
      applies_to: "Process inventory"
      requirement: "Demonstrate reconciled pea mass, water and refrigerant balances; include all listed required processes and all measured direct releases, waste and wastewater streams. Quantify rather than silently discard unexplained differences."
      evidence: "Balance worksheets, waste manifests, discharge records and review sign-off"
    - id: dq_representativeness
      applies_to: "Published dataset"
      requirement: "Report technological, geographical and time representativeness and precision for company-specific activity data, with the declared pea type, processing route, freezing technology, packaging and storage configuration."
      evidence: "Representativeness assessment and data-quality review record referencing eu-pef-2021-2279"
    - id: dq_temperature_records
      applies_to: "Quick freezing and storage"
      requirement: "Retain validated records showing that freezing was completed at -18 °C or colder at the thermal centre after stabilization and that on-site cold-chain conditions were maintained."
      evidence: "Probe calibration, freezer-exit checks, continuous logger data and corrective actions"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Fail validation unless the reference output is exactly 1 kg net Peas, frozen with product-flow UUID 7ee41d34-76b1-42c5-8f39-c3cdae327118, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids: []
  - rule_id: validate_product_scope
    applies_to: "Product identity"
    rule: "Fail validation when the product is not whole quick-frozen *Pisum sativum* peas or when excluded mixtures, seasonings or preservation routes are represented without a separate PCR decision."
    source_ids:
      - codex-cxs-320-2015
      - usda-frozen-peas-standard
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Fail validation when any required qualifier is missing, including presentation, quality specification, fresh-pea receipt state, freezing technology, release temperature, storage duration and packaging format."
    source_ids:
      - codex-cxs-320-2015
      - codex-cxc-8-1976
  - rule_id: validate_process_coverage
    applies_to: "Foreground boundary"
    rule: "Fail validation unless all four required processes and their linked mass, water, energy, waste, wastewater and direct-emission records are present, or a documented zero/not-applicable value is provided."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_blanching
    applies_to: "Blanching process"
    rule: "Fail validation unless the blanching schedule and evidence of adequate enzyme-inactivation or equivalent declared quality outcome are retained."
    source_ids:
      - codex-cxs-320-2015
      - codex-cxc-8-1976
  - rule_id: validate_freezing_temperature
    applies_to: "Freezer exit and cold storage"
    rule: "Fail validation unless the product reaches -18 °C or colder at its thermal centre after stabilization and on-site storage records demonstrate maintenance at -18 °C or colder, subject only to declared competent-authority tolerances."
    source_ids:
      - codex-cxs-320-2015
      - codex-cxc-8-1976
  - rule_id: validate_mass_balance
    applies_to: "Pea inputs and outputs"
    rule: "Fail validation when the pea mass balance is absent or has an unexplained difference; the dataset shall disclose the balance result and disposition of rejects and rework."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "Shared utilities and co-products"
    rule: "Fail validation when allocation is used without documenting why subdivision or system expansion was not applied, the causal relationship selected, all factors and the treatment of organic residues."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_provisional_ranges
    applies_to: "Reasoned estimates"
    rule: "Treat every reasoned_estimate range as a non-binding screening guardrail. Fail publication review if any such range is used as the reported foreground amount without accepted supporting evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for frozen peas at the factory cold-store gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Site-, technology- and product-specific LCI modelling of qualifying frozen peas; linking as the manufacturing-stage dataset in a broader food product lifecycle model; comparison only when functional unit, scope, geography, time, quality, packaging and cold-chain assumptions are aligned"
  excluded_use: "Agricultural pea cultivation; fresh, canned, dried or otherwise preserved peas; mixed or seasoned products; consumer cooking; downstream distribution without separate cold-chain modelling; public comparative claims without the required review"
  required_metadata: "Canonical PCR id and version; Tiangong flow identity; CPC reference; pea species/type and size; ingredient and grade specification; fresh-pea receipt state; production geography, facility and period; technologies; packaging format; net mass; freezer-exit and release temperatures; on-site storage duration; process coverage; upstream datasets; allocation and cut-off choices"
  required_quality_disclosure: "Data source by row; measured versus calculated amounts; meter and scale coverage; mass, water and refrigerant balance results; missing-data and estimation methods; technological, geographical and temporal representativeness; precision; provisional reasoned ranges; exclusions; independent review status"
  update_trigger: "Change in product specification, raw-pea state, process route, blanching schedule, freezing or refrigeration technology, refrigerant, packaging format, storage profile, allocation method, source evidence, reference UUID, or material foreground performance; otherwise review when the represented production period is no longer current"
