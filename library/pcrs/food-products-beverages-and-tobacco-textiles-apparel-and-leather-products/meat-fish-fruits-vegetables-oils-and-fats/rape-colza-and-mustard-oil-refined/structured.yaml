system_boundary:
  rules:
    - rule_id: boundary_refinery_gate
      applies_to: "Foreground product system"
      rule: "Include receipt and storage losses, degumming or pretreatment, route-conditional neutralisation, bleaching, deodorisation, internal recirculation, utility use, direct emissions, residue handling, wastewater sent to treatment, and the bulk refined-oil output up to the refinery gate."
      source_ids:
        - eu-fdm-bref-2019
    - rule_id: boundary_route_declaration
      applies_to: "Chemical and physical refining"
      rule: "Declare the actual route. Chemical refining includes degumming or neutralisation, bleaching, and deodorisation; physical refining includes adequate degumming or pretreatment, bleaching, and distillative deacidification or deodorisation. Do not insert a route-conditional operation that did not occur."
      source_ids:
        - eu-fdm-bref-2019
    - rule_id: boundary_upstream_crude_oil
      applies_to: "Crude-oil input"
      rule: "Keep cultivation, crushing, pressing, and solvent extraction in the linked upstream crude-oil dataset unless an integrated-site study explicitly expands the boundary and reports the additional processes separately."
      source_ids:
        - eu-fdm-bref-2019
    - rule_id: boundary_material_completeness
      applies_to: "Listed material and emission flows"
      rule: "Collect all material flows listed by this PCR. Any omission shall be identified, quantified where possible, justified for environmental insignificance, and included in the quality disclosure; no omitted flow may be hidden by a generic cut-off statement."
      source_ids:
        - eu-pef-2021
