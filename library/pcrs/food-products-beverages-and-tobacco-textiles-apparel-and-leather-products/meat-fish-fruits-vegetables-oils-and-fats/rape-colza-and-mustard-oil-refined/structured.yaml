allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "Refining train and shared utilities"
    rule: "First subdivide stage-level measurements and directly assign material and utility records to the refining train. Use system expansion only when the added function and substituted product can be represented consistently."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_output_status
    applies_to: "Gums, lecithin, soapstock, acid oil, deodoriser distillate, spent earth, and residues"
    rule: "Treat an output as a co-product only when it has a documented beneficial use or market and leaves the boundary as a product. Otherwise classify it as waste and include its treatment; do not change classification solely to obtain an allocation credit."
    source_ids:
      - eu-fdm-bref-2019
  - rule_id: allocation_physical_residual
    applies_to: "Unsubdivided burdens with multiple marketable oil-derived outputs"
    rule: "If subdivision and justified system expansion are not feasible, allocate the remaining shared burdens by measured dry or net mass among the refined oil and marketable oil-derived co-products. Exclude wastewater, recirculated water, and wastes from the denominator."
    source_ids:
      - eu-pef-2021
      - mass-balance-identity
  - rule_id: allocation_disclosure
    applies_to: "Published foreground package"
    rule: "Report output masses, allocation fractions, co-product status and destination, price period if an economic sensitivity is used, excluded waste-treatment burdens, and the change in results under a no-credit sensitivity."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "refining_train"
      flow_role: "Crude-oil input and internal oil transfers"
      record_type: "Weighbridge, calibrated tank gauge, batch sheet, and inventory reconciliation"
      raw_fields: "material identity; supplier; batch; opening stock; receipts; transfers; closing stock; net mass; temperature; moisture or volatile convention"
      collection_method: "Reconcile calibrated mass or volume-and-density records to each batch and monthly inventory"
      unit: "kg"
      frequency: "Each receipt and batch; monthly reconciliation"
      temporal_coverage: "At least 12 representative consecutive months or a declared complete campaign"
      site_scope: "All units supplying the reported refinery output"
      aggregation_rule: "Sum net input by oil identity and assign only to conforming output batches; document stock changes and rework"
      quality_evidence: "Calibration certificates; tank tables; weigh tickets; signed reconciliation; specification or certificate of analysis"
    - protocol_id: cp_water_records
      process_id: "refining_train"
      flow_role: "Fresh water, reused water, cooling water, and direct abstraction"
      record_type: "Meter and water-balance record"
      raw_fields: "source; meter id; opening and closing reading; withdrawal; recirculation; discharge; purpose; batch or period"
      collection_method: "Read source and sub-meters; reconcile fresh intake, reuse, evaporation, product carryover, and discharge"
      unit: "m3"
      frequency: "Daily or batch readings; monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "Whole refinery with sub-meter allocation to refining"
      aggregation_rule: "Net fresh water equals withdrawal minus exported or returned uncontaminated water; recirculated volume is disclosed separately"
      quality_evidence: "Meter calibration; utility invoice; water-balance sign-off"
    - protocol_id: cp_chemical_dosing
      process_id: "refining_train"
      flow_role: "Alkali, acid, bleaching earth, activated carbon, and filter aid"
      record_type: "Recipe, dosing meter, purchase, and stock record"
      raw_fields: "chemical identity; concentration; lot; gross solution mass; active fraction; batch; opening and closing stock"
      collection_method: "Reconcile automated dosing or weighed batch additions with purchase and inventory records"
      unit: "kg"
      frequency: "Each batch; monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "All refining lines in scope"
      aggregation_rule: "Calculate active reagent as solution mass multiplied by certified active fraction; retain each chemical separately"
      quality_evidence: "Dosing calibration; supplier certificate; batch recipe; stock reconciliation"
    - protocol_id: cp_energy_records
      process_id: "refining_train"
      flow_role: "Electricity, steam, purchased heat, and fuels"
      record_type: "Meter, invoice, boiler log, and energy-balance record"
      raw_fields: "carrier; meter id; quantity; unit; heating value; steam condition; generation efficiency; allocation key; period"
      collection_method: "Read sub-meters where available and reconcile with invoices or fuel stocks"
      unit: "kWh or MJ"
      frequency: "Continuous or daily; monthly reconciliation"
      temporal_coverage: "At least 12 representative consecutive months or a complete campaign"
      site_scope: "Refining train and declared shared utilities"
      aggregation_rule: "Preserve carriers; convert to final energy with documented factors; assign shared utility use by metered demand before any allocation"
      quality_evidence: "Meter calibration; invoices; boiler logs; documented conversion factors; energy-balance review"
    - protocol_id: cp_output_and_residue_mass
      process_id: "refining_train"
      flow_role: "Refined oil, co-products, and solid or liquid residues"
      record_type: "Tank, scale, dispatch, sales, and waste-transfer record"
      raw_fields: "output identity; product or waste status; batch; net mass; moisture; oil content where relevant; destination; revenue or disposal route"
      collection_method: "Reconcile production tanks, packaged bulk dispatch, co-product sales, and waste transfers"
      unit: "kg"
      frequency: "Each batch or dispatch; monthly reconciliation"
      temporal_coverage: "Same period as input and utility records"
      site_scope: "All output and residue handling areas in scope"
      aggregation_rule: "Sum by identity and destination; keep marketable co-products separate from wastes and internal recycle"
      quality_evidence: "Calibrated scales or tank tables; dispatch documents; sales records; waste transfer notes; laboratory oil-content result"
    - protocol_id: cp_wastewater_records
      process_id: "refining_train"
      flow_role: "Process wastewater and pollutant load"
      record_type: "Flow meter, composite sample, and treatment record"
      raw_fields: "stream; flow; COD; BOD; total suspended solids; total nitrogen; total phosphorus; oils and grease; pH; treatment destination"
      collection_method: "Meter discharge and sample under the applicable permit or site monitoring plan"
      unit: "m3 and kg pollutant"
      frequency: "Flow continuous or daily; laboratory frequency justified by variability"
      temporal_coverage: "Same period as product output and representative operating conditions"
      site_scope: "All refinery wastewater outlets in scope"
      aggregation_rule: "Calculate pollutant load as concentration multiplied by compatible measured flow; separate uncontaminated cooling water"
      quality_evidence: "Meter calibration; accredited laboratory report; chain of custody; treatment operator record"
    - protocol_id: cp_direct_emissions
      process_id: "refining_train"
      flow_role: "Direct air and water emissions"
      record_type: "Stack test, continuous monitor, leak record, and method calculation"
      raw_fields: "substance; compartment; concentration; flow; operating hours; fuel activity; factor; abatement status"
      collection_method: "Use measured emission and gas-flow data where available; otherwise calculate from collected activity and cited factor"
      unit: "kg"
      frequency: "Permit frequency and after material process change"
      temporal_coverage: "Same period as product output or a justified representative test"
      site_scope: "All direct emission points serving the refining train"
      aggregation_rule: "Integrate measured rate over operating time or multiply measured activity by the cited factor; prevent double counting with energy datasets"
      quality_evidence: "Accredited test report; monitor QA; activity record; factor reference; uncertainty statement"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "Every inventory row"
      rule: "normalized amount = period amount / net conforming refined-oil output in the same period"
      inputs:
        - "Period flow amount"
        - "net refined-oil output"
      output: "Amount per 1 kg or 1 tonne refined oil"
      source_ids:
        - mass-balance-identity
    - id: calc_active_reagent
      applies_to: "Alkali and acid solutions"
      rule: "active reagent mass = solution mass x certified active mass fraction"
      inputs:
        - "Solution mass"
        - "certificate concentration"
      output: "kg active reagent"
      source_ids:
        - eu-fdm-bref-2019
    - id: calc_final_energy
      applies_to: "Refinery energy screen"
      rule: "total final energy = purchased electricity + purchased heat + fuel lower-heating-value input + net imported steam energy; keep carrier rows available"
      inputs:
        - "Metered carrier quantities"
        - "heating values"
        - "steam enthalpy"
        - "exported energy"
      output: "MWh final energy per tonne refined oil"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_oil_phase_closure
      applies_to: "Oil-bearing inputs and outputs"
      rule: "closure = (refined oil + oil contained in co-products + oil contained in wastes + measured oil losses) / crude-oil input x 100"
      inputs:
        - "Crude-oil input"
        - "output masses"
        - "measured oil contents"
        - "identified losses"
      output: "Oil-phase mass closure percent"
      source_ids:
        - mass-balance-identity
    - id: calc_physical_allocation
      applies_to: "Remaining shared burdens"
      rule: "allocation fraction for output i = net mass of marketable output i / sum of net masses of all marketable outputs"
      inputs:
        - "Measured refined-oil and marketable co-product masses"
      output: "Output-specific allocation fractions summing to 1"
      source_ids:
        - eu-pef-2021
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and crude-oil input"
      requirement: "Preserve named oil source, species or commercial designation, low-erucic status when claimed, grade, route, pretreatment state, and applicable specification for every contributing batch."
      evidence: "Product specification; certificate of analysis; supplier declaration; batch genealogy"
    - id: dq_measurement
      applies_to: "Mass, water, energy, chemicals, and outputs"
      requirement: "Use calibrated measurement where material; document resolution, conversion factors, stock corrections, and uncertainty; estimates shall be separately flagged and sensitivity-tested."
      evidence: "Calibration certificate; meter register; reconciliation; uncertainty record"
    - id: dq_temporal
      applies_to: "Published average"
      requirement: "Use at least 12 representative consecutive months or a complete declared campaign; explain shutdowns, abnormal batches, and seasonal or feedstock shifts."
      evidence: "Production calendar; batch list; maintenance and exception log"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Reconcile all measured crude-oil, chemical, energy, and water records to the selected production basis and explicitly assess every omitted or unreconciled balance for environmental significance."
      evidence: "Completeness reconciliation by flow family; omission register; reviewer sign-off"
    - id: dq_route_and_site
      applies_to: "Technology and geography"
      requirement: "Identify chemical or physical refining, actual degumming, neutralisation, bleaching, and deodorisation configuration, vacuum and wastewater systems, site integration, and geography."
      evidence: "Process flow diagram; equipment list; site description; operator confirmation"
    - id: dq_source_currency
      applies_to: "External ranges and method rules"
      requirement: "Record source edition and retrieval date; treat BAT ranges as QA screens and reassess applicability after a material technology, feedstock, or regulatory change."
      evidence: "Source register; applicability review; change log"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "Reference flow"
    rule: "The reference output UUID shall be e30cf6ff-7dfb-4972-affc-6cab3ae17283, its quantitative flow property shall be Mass 93a60a56-a3c8-11da-a746-0800200b9a66, and the normalized amount shall be exactly 1 kg."
    source_ids: []
  - rule_id: validation_product_scope
    applies_to: "Product identity"
    rule: "Reject a package that does not declare named oil source, grade, refining route, crude-oil pretreatment, geography, period, and bulk delivery state, or that represents a crude, hydrogenated, interesterified, volatile, blended, or biodiesel product outside this scope."
    source_ids:
      - codex-cxs-210-1999
      - unsd-cpc-v3-2025
  - rule_id: validation_route_inventory
    applies_to: "Process completeness"
    rule: "Chemical refining shall include collected records for degumming or neutralisation, bleaching, and deodorisation. Physical refining shall include collected records for adequate pretreatment or degumming, bleaching, and distillative deacidification or deodorisation. Bypassed steps require explicit justification."
    source_ids:
      - eu-fdm-bref-2019
  - rule_id: validation_mass_closure
    applies_to: "Oil-phase mass balance"
    rule: "Investigate oil-phase closure outside 95-105 percent; do not force closure by changing the fixed reference output or hiding unmeasured residues. The interval is a provisional QA tolerance, not a permitted process loss."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_bat_screens
    applies_to: "Annual stand-alone refinery totals"
    rule: "Flag, but do not automatically reject, final energy outside 0.1-0.45 MWh/t oil or net water consumption outside 0.15-0.9 m3/t oil. Confirm installation type, boundary, route, and operating context before concluding that data are erroneous."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validation_coproduct_allocation
    applies_to: "Co-products and wastes"
    rule: "Allocation fractions shall sum to 1 within rounding; every included co-product shall have measured mass and documented beneficial destination, while every excluded residue shall be linked to waste treatment without an allocation credit."
    source_ids:
      - eu-pef-2021
      - eu-fdm-bref-2019
  - rule_id: validation_no_double_count
    applies_to: "Upstream and downstream datasets"
    rule: "Do not duplicate seed cultivation, crushing or extraction burdens contained in the crude-oil dataset, direct emissions already represented in purchased-energy datasets, or wastewater treatment both on site and in an off-site treatment dataset."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground production dataset for stand-alone refinery-gate refined named oil"
  downstream_use: "secondary_dataset; background_dataset after methodology and translation review and publication"
  allowed_use: "Product and process LCA requiring bulk refined rape, colza, canola, or mustard fixed oil at the refinery gate when geography, period, grade, route, upstream crude-oil dataset, and allocation are compatible"
  excluded_use: "Crude or virgin oil; farm-gate seed; integrated crushing and refining without explicit boundary expansion; hydrogenated or interesterified oil; biodiesel; volatile mustard oil; packaged retail oil; comparative food-safety or legal-conformity claims without separate verification"
  required_metadata: "PCR id and version state; reference-flow UUID; named oil source and low-erucic status where applicable; grade and specification; chemical or physical route; crude-oil pretreatment and upstream dataset; geography; technology; production period; bulk delivery state; co-product status and allocation; wastewater treatment; data owner and review state"
  required_quality_disclosure: "Foreground share; measurement and estimation shares; temporal coverage; completeness by flow family; mass closure; energy and water BAT-screen result; omitted flows; provisional reasoned ranges used; source applicability; allocation sensitivity; unresolved UUIDs"
  update_trigger: "Material change in feedstock identity or origin, refining route or equipment, energy or water system, co-product destination, allocation, product specification, regulation, site geography, or normalized major inputs or outputs beyond documented uncertainty or process-control limits"
