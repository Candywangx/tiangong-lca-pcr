allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "foreground burden allocation"
    rule: "Avoid allocation by subdividing independently measurable organ preparation, state conditioning, packaging, sanitation and treatment processes before applying any allocation key."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_direct_assignment
    applies_to: "direct process assignment"
    rule: "Assign metered electricity, thermal carriers, fuels, water, chemicals, packaging, wastes and emissions directly to the process and organ-state lot that caused them whenever records permit."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_slaughter_coproducts
    applies_to: "integrated slaughter"
    rule: "Treat the selected edible organ, pig carcass and each beneficially used named output as separate slaughter co-products; keep condemned or discarded outputs as wastes."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: allocation_slaughter_relation
    applies_to: "residual slaughter burden"
    rule: "For residual inseparable slaughter burdens, use a documented physical causal relationship where it can be demonstrated; if it cannot, use reporting-period economic values for the exact co-products and disclose the sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_no_defaults
    applies_to: "allocation factors"
    rule: "Calculate allocation shares from foreground co-product quantities and, where used, contemporaneous values; do not insert a PCR default share or price."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_purchased_organ
    applies_to: "purchased-organ route"
    rule: "Use the supplier slaughter dataset's disclosed organ allocation once and do not reallocate those upstream burdens again in the receiving preparation process."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_treatment
    applies_to: "waste treatment"
    rule: "Assign treatment burdens to the process generating each named waste or wastewater stream unless an explicitly documented facility-wide causal key is required; do not credit a waste as a co-product without a documented beneficial product destination."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: allocation_mass_balance
    applies_to: "allocation verification"
    rule: "Reconcile allocated process totals to unallocated facility totals and document any unassigned difference, shared-service key and organ-state denominator."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_pig_receipt_and_ante_mortem_animal_receipt_records
      process_id: "pig_receipt_and_ante_mortem"
      flow_role: "live-pig receipt and ante-mortem disposition"
      record_type: "weighbridge and inspection record"
      raw_fields: "lot_id; supplier_id; receipt_time; animal_count; gross_mass; tare_mass; acceptance_status; disposition"
      collection_method: "Reconcile calibrated weighbridge tickets with veterinary acceptance records by lot."
      unit: "kg and count"
      frequency: "each received lot"
      temporal_coverage: "all lots in the reporting period"
      site_scope: "reporting facility"
      aggregation_rule: "Sum accepted and rejected masses separately; retain lot identity."
      quality_evidence: "weighbridge calibration; veterinary record; reconciliation sign-off"
    - protocol_id: cp_pig_receipt_and_ante_mortem_receipt_waste_records
      process_id: "pig_receipt_and_ante_mortem"
      flow_role: "receipt waste mass and destination"
      record_type: "waste weighing and dispatch record"
      raw_fields: "lot_id; waste_identity; measured_mass; container_tare; destination; dispatch_date"
      collection_method: "Weigh each named waste stream and reconcile dispatch records."
      unit: "kg"
      frequency: "each lot or dispatch"
      temporal_coverage: "all included receipt operations"
      site_scope: "reporting facility"
      aggregation_rule: "Sum by exact waste identity and destination before allocation."
      quality_evidence: "scale calibration; waste transfer record; mass-balance review"
    - protocol_id: cp_pig_receipt_and_ante_mortem_water_records
      process_id: "pig_receipt_and_ante_mortem"
      flow_role: "single-source water consumption or abstraction"
      record_type: "water meter and allocation record"
      raw_fields: "meter_id; water_source_identity; opening_reading; closing_reading; timestamp; stage_allocation_key"
      collection_method: "Read calibrated source-specific meters and reconcile shared meters to operating records."
      unit: "m3"
      frequency: "continuous or each production shift"
      temporal_coverage: "all operating and cleaning periods assigned to the stage"
      site_scope: "reporting facility and stated source point"
      aggregation_rule: "Subtract opening from closing reading and allocate only with a documented causal key."
      quality_evidence: "meter calibration; meter map; reading log; reconciliation"
    - protocol_id: cp_pig_receipt_and_ante_mortem_electricity_records
      process_id: "pig_receipt_and_ante_mortem"
      flow_role: "grid-electricity consumption"
      record_type: "electricity meter and invoice record"
      raw_fields: "meter_id; supplier; tariff_or_grid_identity; opening_reading; closing_reading; timestamp; stage_allocation_key"
      collection_method: "Reconcile stage submeter readings with facility invoices."
      unit: "kWh"
      frequency: "continuous or each production shift"
      temporal_coverage: "all operating periods assigned to the stage"
      site_scope: "reporting facility"
      aggregation_rule: "Calculate net consumption by meter and assign shared use with a disclosed causal key."
      quality_evidence: "meter calibration; invoice reconciliation; submeter coverage"
    - protocol_id: cp_pig_receipt_and_ante_mortem_thermal_records
      process_id: "pig_receipt_and_ante_mortem"
      flow_role: "single purchased thermal carrier consumption"
      record_type: "thermal meter and supplier record"
      raw_fields: "carrier_identity; meter_id; opening_reading; closing_reading; temperature; pressure; enthalpy_basis; timestamp; allocation_key"
      collection_method: "Meter steam and hot water separately and convert only with recorded thermodynamic conditions."
      unit: "MJ with original meter unit retained"
      frequency: "continuous or each production shift"
      temporal_coverage: "all operating periods assigned to the stage"
      site_scope: "reporting facility"
      aggregation_rule: "Sum each carrier separately; never combine steam and hot water."
      quality_evidence: "meter calibration; supplier record; conversion worksheet"
    - protocol_id: cp_pig_receipt_and_ante_mortem_fuel_records
