        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - rule_id: boundary_integrated_slaughter
      applies_to: "integrated slaughter"
      rule: "When integrated slaughter is selected, include receipt, ante-mortem control, slaughter, bleeding, evisceration, organ segregation, all named co-products, rejects, water, energy, direct emissions and wastewater generated inside the reporting boundary."
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - rule_id: boundary_purchased_organ
      applies_to: "purchased recovered organ"
      rule: "When a recovered organ is purchased, exclude the two integrated-slaughter foreground processes and require a separate upstream slaughter dataset with organ-specific allocation and quality disclosure."
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - rule_id: boundary_exact_organ
      applies_to: "product identity"
      rule: "Select one exact pig organ identity per dataset; do not pool organ masses, prices, rejects or process records."
