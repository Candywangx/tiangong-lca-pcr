process_map:
  - id: pig_receipt_and_ante_mortem
    name: "Pig receipt and ante-mortem control"
    inclusion: "conditional"
    inclusion_condition: "Include only when slaughter is integrated in the reporting facility; otherwise start with one purchased recovered organ."
    role: "Foreground receipt, acceptance and segregation before slaughter."
    quantitative_reference: "accepted live-pig mass transferred to slaughter"
  - id: slaughter_and_organ_recovery
    name: "Slaughter and organ recovery"
    inclusion: "conditional"
    inclusion_condition: "Include only for an integrated-slaughter route and apply the declared slaughter allocation."
    role: "Foreground slaughter, bleeding, scalding or skin handling, evisceration and segregation of each organ."
    quantitative_reference: "mass of each recovered pig organ transferred to preparation"
  - id: edible_organ_preparation
    name: "Edible organ preparation"
    inclusion: "required"
    inclusion_condition: "Always include for the one declared organ; purchased-organ routes enter here."
    role: "Foreground inspection, trimming, emptying where applicable, washing and hygienic preparation."
    quantitative_reference: "prepared mass of the one declared organ"
  - id: fresh_state_conditioning
    name: "Fresh-state conditioning"
    inclusion: "conditional"
    inclusion_condition: "Include if and only if the declared market state is fresh."
    role: "Foreground fresh-product draining, grading and short-duration handling without chilling or freezing."
    quantitative_reference: "mass of the declared organ released from fresh conditioning"
  - id: chilled_state_conditioning
    name: "Chilled-state conditioning"
    inclusion: "conditional"
    inclusion_condition: "Include if and only if the declared market state is chilled."
    role: "Foreground chilling and temperature-controlled holding of the declared organ."
    quantitative_reference: "mass of the declared organ released at the chilled specification"
  - id: frozen_state_conditioning
    name: "Frozen-state conditioning"
    inclusion: "conditional"
    inclusion_condition: "Include if and only if the declared market state is frozen."
    role: "Foreground freezing and frozen holding of the declared organ."
    quantitative_reference: "mass of the declared organ released at the frozen specification"
  - id: packaging_storage_and_release
    name: "Packaging, state-controlled storage and release"
    inclusion: "required"
    inclusion_condition: "Always include; accept one organ from exactly one fresh, chilled or frozen branch."
    role: "Foreground primary and secondary packaging, state-appropriate storage and reference-product release."
    quantitative_reference: "1 kg net conforming reference product, excluding packaging"
  - id: sanitation_and_wastewater_management
    name: "Sanitation and wastewater management"
    inclusion: "required"
    inclusion_condition: "Always include cleaning and disinfection; include on-site treatment rows only when treatment is inside the reporting boundary."
    role: "Foreground cleaning-in-place or open-plant cleaning, disinfection, effluent segregation and conditional on-site treatment."
    quantitative_reference: "sanitation activity and wastewater load attributable to the 1 kg reference product"
