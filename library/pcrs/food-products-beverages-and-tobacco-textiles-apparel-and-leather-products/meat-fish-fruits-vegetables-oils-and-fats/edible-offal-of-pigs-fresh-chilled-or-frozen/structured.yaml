  calculation_rules:
    - id: calc_receipt_mass_balance
      applies_to: "pig_receipt_and_ante_mortem"
      rule: "Accepted live-pig mass equals measured received live-pig mass minus dead-at-reception and condemned-pig masses, with manure and bedding excluded from animal mass."
      inputs:
        - "received live-pig mass"
        - "dead-pig mass"
        - "condemned-pig mass"
      output: "accepted live-pig mass"
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - id: calc_slaughter_mass_balance
      applies_to: "slaughter_and_organ_recovery"
      rule: "Reconcile accepted live-pig mass with every separately weighed organ, carcass, co-product and waste; investigate and disclose any unaccounted mass before allocation."
      inputs:
        - "accepted live-pig mass"
        - "exact organ masses"
        - "carcass mass"
        - "co-product masses"
        - "waste masses"
      output: "reconciled slaughter mass balance by exact output identity"
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - id: calc_organ_preparation_mass_balance
      applies_to: "edible_organ_preparation"
      rule: "For the one declared organ, prepared mass equals received recovered-organ mass minus separately recorded trimming rejects and other measured mass loss, with retained moisture or drain change disclosed."
      inputs:
        - "received exact-organ mass"
        - "exact-organ trimming waste"
        - "measured drain or moisture change"
      output: "prepared exact-organ mass"
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - id: calc_state_conditioning_mass_balance
      applies_to: "fresh_state_conditioning; chilled_state_conditioning; frozen_state_conditioning"
      rule: "Within exactly one selected state branch, conforming organ output equals prepared-organ input minus state-specific rejects and measured conditioning mass change; never pool states."
      inputs:
        - "prepared exact-organ mass"
        - "state-specific reject mass"
        - "measured conditioning mass change"
      output: "conforming exact-organ mass in the declared state"
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - id: calc_combustion_air_emissions
      applies_to: "direct on-site combustion emissions"
      rule: "Calculate each named pollutant separately as matched stack concentration times exhaust volume, or as one exact fuel quantity times a disclosed approved factor when measurement is unavailable; allocate only the direct stage share."
      inputs:
        - "pollutant-specific stack records or exact fuel quantity and disclosed factor"
        - "stage allocation key"
      output: "stage-specific mass of one direct air pollutant"
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - id: calc_refrigerant_mass_balance
      applies_to: "chilled_state_conditioning; frozen_state_conditioning; packaging_storage_and_release"
      rule: "For each exact refrigerant substance, release equals opening charge plus make-up minus recovered mass minus closing charge, adjusted only for documented transfers; R-404A constituent emissions use supplier composition."
      inputs:
        - "opening charge"
        - make-up
        - "recovered mass"
        - "closing charge"
        - "documented transfers"
        - "supplier composition"
      output: "mass released for one refrigerant substance"
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - id: calc_wastewater_pollutant_load
      applies_to: "sanitation_and_wastewater_management"
      rule: "For each named pollutant and discharge compartment, load equals matched concentration times discharged effluent volume after unit conversion; subtracting treatment removal is allowed only when matched inlet and outlet records exist."
      inputs:
        - "pollutant concentration"
        - "matched effluent volume"
        - "unit conversion"
        - "discharge compartment"
      output: "mass of one pollutant discharged to water"
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - id: calc_reference_product_normalization
      applies_to: "reference product release"
      rule: "Verify one declared organ and exactly one fresh, chilled or frozen branch, subtract packaging mass from gross release mass, then divide all allocated foreground exchanges by conforming net product mass to report exactly 1 kg."
      inputs:
        - "exact organ identity"
        - "declared state"
        - "gross release mass"
        - "packaging mass"
        - "allocated foreground exchanges"
      output: "inventory normalized to 1 kg net conforming reference product"
      source_ids:
        - unsd-cpc-21153
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain exact pig organ identity, legal edible status, product form and one market state for every lot."
      evidence: "lot specification; legal release record; organ-state traceability"
    - id: dq_route_traceability
