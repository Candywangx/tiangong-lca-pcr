        - unsd-cpc-21153
        - eu-pef-2021-2279
    - rule_id: boundary_exact_state
      applies_to: "market state"
      rule: "Select exactly one of fresh, chilled or frozen; include only its state-conditioning branch and retain its temperature-time specification through release."
      source_ids:
        - unsd-cpc-21153
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - rule_id: boundary_upstream
      applies_to: "upstream exclusions"
      rule: "Keep pig production, feed, farm manure management and inbound transport upstream; represent them through linked upstream datasets rather than reopening them in this foreground package."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_downstream
      applies_to: "downstream exclusions"
      rule: "Exclude distribution beyond the reporting gate, retail, cooking, consumption and packaging or product end-of-life."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_packaging
      applies_to: "packaging"
      rule: "Include each primary, secondary and tertiary packaging component used before release as its own product input and waste output, but exclude packaging mass from the 1 kg reference amount."
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - rule_id: boundary_wastewater
      applies_to: "sanitation and wastewater"
      rule: "Include cleaning and disinfection throughout the foreground processes; include on-site wastewater treatment only when operated inside the reporting boundary, otherwise report each outgoing wastewater stream to its off-site destination."
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
