validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "Require UUID 17a80845-90d9-42a4-8a70-fee47fe2b380, Mass property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66 and unit kg for the reference object."
    source_ids:
      - unsd-cpc-21153
  - rule_id: validation_reference_amount
    applies_to: "reference amount"
    rule: "Require exactly 1 kg net conforming product and verify that packaging mass is excluded."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_single_organ
    applies_to: "organ identity"
    rule: "Require exactly one declared pig organ identity and reject any dataset that pools multiple organ identities under the reference amount."
    source_ids:
      - unsd-cpc-21153
      - eu-pef-2021-2279
  - rule_id: validation_single_state
    applies_to: "market state"
    rule: "Require exactly one fresh, chilled or frozen branch; reject simultaneous or ambiguous state-branch records."
    source_ids:
      - unsd-cpc-21153
      - eu-pef-2021-2279
  - rule_id: validation_route_exclusivity
    applies_to: "production route"
    rule: "Require exactly one route start and reject simultaneous inclusion of purchased recovered-organ input and integrated-slaughter upstream burdens for the same organ mass."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_process_map
    applies_to: "process coverage"
    rule: "Require detailed inventories for edible_organ_preparation, packaging_storage_and_release and sanitation_and_wastewater_management, plus the applicable route and state processes."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: validation_atomic_selected_flow
    applies_to: "inventory identity"
    rule: "Require every Selected flow other than the verified category reference flow to describe one specific exchange; reject collection labels, selector instructions and combined carriers."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_uuid_policy
    applies_to: "Tiangong identity"
    rule: "Accept only the three verified reference UUIDs in this candidate PCR; require any later non-reference UUID to have an exact hybrid match and direct public state=100 record before insertion."
    source_ids: []
  - rule_id: validation_mass_balance
    applies_to: "mass balance"
    rule: "Require reconciled receipt, slaughter when applicable, organ preparation, selected state and release mass balances with investigated discrepancies."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: validation_energy_separation
    applies_to: "energy inventory"
    rule: "Require grid electricity, purchased steam, purchased hot water, natural gas, diesel fuel and liquefied petroleum gas to remain separate wherever consumed."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: validation_refrigerant
    applies_to: "refrigeration inventory"
    rule: "For chilled, frozen and applicable state-controlled storage, require exact installed refrigerant identity, make-up and substance-specific release balance; reject an unspecified refrigerant total."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: validation_packaging
    applies_to: "packaging inventory"
    rule: "Require each used packaging component and each generated packaging-component waste to be separately recorded and reconciled to the product-specific bill of materials."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: validation_wastewater
    applies_to: "wastewater inventory"
    rule: "Require each wastewater stream, treatment output and discharged pollutant to be separately recorded, with concentration-volume matching for pollutant loads."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: validation_no_defaults
    applies_to: "amount evidence"
    rule: "Reject category default amounts, uncited numeric ranges, modelled estimates and reasoned estimates; require foreground_record or calculated_value backed by a declared protocol."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_quality_disclosure
    applies_to: "data quality"
    rule: "Require reporting-period coverage, geography, technology, allocation, missing-data, meter, laboratory, refrigerant and supplier-data disclosures before dataset release."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production dataset for one declared edible pig organ in one declared fresh, chilled or frozen state."
  downstream_use: "Eligible after review for use as a secondary_dataset or background_dataset in product systems that require the same organ, state, route, geography, technology and period."
  allowed_use: "Facility-gate modelling of the declared organ-state combination when reference identity, boundary, allocation, collection protocols and quality disclosures are satisfied."
  excluded_use: "Pooled organs; pooled fresh, chilled and frozen states; pig meat or carcass as the reference product; prepared or preserved organ foods; retail, use or end-of-life modelling; substitution without comparability review."
  required_metadata: "PCR id; CPC coordinate; exact organ; legal edible status; state; product form; net mass; temperature-time specification; packaging BOM; route start; facility; geography; period; technology; refrigerant; wastewater treatment; allocation; upstream dataset links."
  required_quality_disclosure: "Completeness; mass-balance reconciliation; meter and scale calibration; temperature coverage; supplier-data quality; laboratory methods; missing data; allocation sensitivity; non-reference UUID gaps; uncertainty and review status."
  update_trigger: "Change in organ scope, legal edible status, state specification, route start, slaughter allocation, process technology, refrigerant, packaging, sanitation chemistry, wastewater treatment, data period or verified Tiangong identity."
