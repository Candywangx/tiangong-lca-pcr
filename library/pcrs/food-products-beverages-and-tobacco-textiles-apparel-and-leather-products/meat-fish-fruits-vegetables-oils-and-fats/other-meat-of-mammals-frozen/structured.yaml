allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The foreground finishing route has one intended meat product and no co-product. Packaging rejects, rejected meat, wastewater, and sludge remain waste flows unless a documented downstream recovery contract establishes otherwise."
    source_ids: []
  - rule_id: alloc_upstream_cut_specific
    applies_to: "upstream chilled cut"
    rule: "Use the supplier's cut-specific dataset and its reviewed slaughter/carcass allocation; do not allocate generic live-animal or carcass burdens inside this finishing foreground system."
    source_ids:
      - unece-deer-meat-2013
  - rule_id: alloc_no_cross_instance_average
    applies_to: "species, cut, bone state, freezing, refrigerant, packaging, and wastewater route"
    rule: "Do not average another configuration with this instance; produce a separately reviewed package."
    source_ids:
      - unstats-cpc-3-2025
      - unece-deer-meat-2013
  - rule_id: alloc_shared_electricity
    applies_to: "shared electric meters"
    rule: "Prefer process submeters; otherwise allocate each equipment group's electricity by documented operating time and power or refrigeration-load driver, preserving separate atomic electricity rows. Economic allocation is not permitted."
    source_ids:
      - mass-balance-identity
  - rule_id: alloc_refrigerant_by_equipment
    applies_to: "R717 make-up and loss"
    rule: "Assign refrigerant by equipment-group mass balance; do not combine blast-freezer and frozen-storage R717 rows."
    source_ids:
      - mass-balance-identity
  - rule_id: alloc_waste_no_credit
    applies_to: "rejected meat, packaging waste, wastewater, and sludge"
    rule: "Report gross waste leaving each process. Do not apply avoided-burden credit in the foreground inventory; model any downstream recovery as a separate documented system."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_incoming_cut_receipt
      process_id: "incoming_cut_receipt"
      flow_role: "chilled cut receipt and identity"
      record_type: "scale, supplier, traceability, and temperature records"
      raw_fields: "lot_id; species; farmed_status; UNECE_cut_code; bone_state; supplier_dataset_id; origin; receipt_mass_kg; receipt_temperature_deg_c; scale_id; timestamp"
      collection_method: "weigh every received lot and verify identity and temperature before acceptance"
      unit: "kg; deg C"
      frequency: "every lot"
      temporal_coverage: "complete reporting period"
      site_scope: "declared facility receiving point"
      aggregation_rule: "sum accepted and rejected masses by lot without mixing species or cut configurations"
      quality_evidence: "calibration certificate; supplier specification; traceability record; temperature-device check"
    - protocol_id: cp_meat_rejects
      process_id: "incoming_cut_receipt"
      flow_role: "rejected meat"
      record_type: "reject log and scale record"
      raw_fields: "lot_id; reject_reason; reject_mass_kg; destination; scale_id; timestamp"
      collection_method: "weigh each reject batch and link it to the originating lot"
      unit: "kg"
      frequency: "each reject event"
      temporal_coverage: "complete reporting period"
      site_scope: "declared facility"
      aggregation_rule: "sum reject mass by reason and destination"
      quality_evidence: "scale calibration; signed reject record; destination receipt"
    - protocol_id: cp_meat_mass_balance
      process_id: "incoming_cut_receipt_vacuum_packaging_blast_quick_freezing_frozen_storage"
      flow_role: "meat transfer and mass balance"
      record_type: "calibrated scale and batch-transfer records"
      raw_fields: "lot_id; process_id; input_mass_kg; output_mass_kg; reject_mass_kg; timestamp; scale_id"
      collection_method: "reconcile process input, output, rejects, and documented mass change for each lot"
      unit: "kg"
      frequency: "every lot and process"
      temporal_coverage: "complete reporting period"
      site_scope: "all declared foreground meat processes"
      aggregation_rule: "normalize the closed lot mass balance to 1,000 kg dispatched net meat"
      quality_evidence: "scale calibration; batch reconciliation; signed deviation investigation"
    - protocol_id: cp_process_electricity
      process_id: "incoming_cut_receipt_vacuum_packaging_blast_quick_freezing_frozen_storage_sanitation_onsite_wastewater_treatment_cold_dock_dispatch"
      flow_role: "process electricity"
      record_type: "submeter or equipment operating log"
      raw_fields: "meter_id; start_kwh; end_kwh; process_id; equipment_id; rated_or_measured_power_kw; operating_hours; lot_id; storage_duration_h"
      collection_method: "subtract meter readings; where shared, calculate power multiplied by logged operating time or documented refrigeration-load driver"
      unit: "kWh"
      frequency: "each batch or daily, with monthly reconciliation"
      temporal_coverage: "complete reporting period including storage"
      site_scope: "declared equipment groups"
      aggregation_rule: "sum by process row, then normalize to the reference flow without combining rows"
      quality_evidence: "meter calibration; utility reconciliation; equipment log; allocation worksheet"
    - protocol_id: cp_packaging_materials
      process_id: "vacuum_packaging"
      flow_role: "each packaging input"
      record_type: "issue, return, count, and unit-mass records"
      raw_fields: "material_specification; material_type; issued_count; returned_count; used_count; unit_mass_kg; lot_id"
      collection_method: "reconcile issued, returned, and used units separately for PA/PE pouches, PP labels, and corrugated cartons"
      unit: "kg"
      frequency: "each packaging lot"
      temporal_coverage: "complete reporting period"
      site_scope: "declared packaging line"
      aggregation_rule: "used mass = used count x unit mass, separately by material"
      quality_evidence: "supplier specification; calibrated unit-mass sample; inventory reconciliation"
    - protocol_id: cp_packaging_waste
      process_id: "vacuum_packaging"
      flow_role: "each packaging waste"
      record_type: "segregated waste scale record"
      raw_fields: "material_type; waste_mass_kg; reason; destination; lot_id; scale_id"
      collection_method: "weigh PA/PE, PP-label, and corrugated-cardboard wastes separately"
      unit: "kg"
      frequency: "each waste transfer"
      temporal_coverage: "complete reporting period"
      site_scope: "declared packaging line"
      aggregation_rule: "sum by material and destination; reconcile with packaging inputs"
      quality_evidence: "scale calibration; waste transfer receipt; material reconciliation"
    - protocol_id: cp_freezing_batch
      process_id: "blast_quick_freezing"
      flow_role: "freezer output and thermal completion"
      record_type: "batch mass and temperature logger"
      raw_fields: "lot_id; freezer_id; load_mass_kg; start_time; end_time; product_thermal_centre_temperature_deg_c; sensor_id; reject_mass_kg"
      collection_method: "measure representative thermal-centre product temperature after equilibration and link it to batch mass and time"
      unit: "kg; deg C; h"
      frequency: "every freezer batch"
      temporal_coverage: "complete reporting period"
      site_scope: "declared forced-air blast freezer"
      aggregation_rule: "accept only batches reaching <= -18 deg C; investigate and segregate nonconforming batches"
      quality_evidence: "calibrated temperature probe/logger; freezer batch record; corrective-action record"
    - protocol_id: cp_frozen_storage_lot
      process_id: "frozen_storage"
      flow_role: "storage mass and temperature history"
      record_type: "warehouse and temperature records"
      raw_fields: "lot_id; entry_mass_kg; exit_mass_kg; entry_time; exit_time; storage_air_temperature_deg_c; product_check_temperature_deg_c; packaging_reject_mass_kg"
      collection_method: "track identified lot mass, duration, continuous air temperature, and release checks"
      unit: "kg; h; deg C"
      frequency: "continuous temperature and each lot movement"
      temporal_coverage: "full storage residence"
      site_scope: "declared R717 cold store"
      aggregation_rule: "calculate storage duration and reconcile entry, exit, and rejects by lot"
      quality_evidence: "calibrated logger; warehouse record; alarm and corrective-action history"
    - protocol_id: cp_r717_mass_balance
      process_id: "blast_quick_freezing_frozen_storage"
      flow_role: "R717 make-up and air loss"
      record_type: "refrigerant inventory and service records"
      raw_fields: "equipment_group; opening_charge_kg; additions_kg; closing_charge_kg; recovered_kg; service_date; lot_or_period_basis"
      collection_method: "close a separate R717 mass balance for the blast-freezer and frozen-storage equipment groups"
      unit: "kg"
      frequency: "every service event with at least annual closure"
      temporal_coverage: "reporting period and charge-balance interval"
      site_scope: "declared R717 equipment groups"
      aggregation_rule: "loss = opening + additions - closing - recovered; allocate by the documented equipment-group production or storage driver"
      quality_evidence: "technician record; cylinder weight; inventory reconciliation; leak-repair record"
    - protocol_id: cp_sanitation_water
      process_id: "sanitation"
      flow_role: "potable water"
      record_type: "dedicated water meter or sanitation log"
      raw_fields: "meter_id; start_m3; end_m3; campaign_id; lot_ids; date"
      collection_method: "meter potable water for assigned sanitation campaigns"
      unit: "m3"
      frequency: "each campaign or daily"
      temporal_coverage: "complete reporting period"
      site_scope: "declared food-contact sanitation system"
      aggregation_rule: "allocate campaign volume only to linked production lots"
      quality_evidence: "meter calibration; sanitation schedule; water-potability evidence"
    - protocol_id: cp_sanitation_chemicals
      process_id: "sanitation"
      flow_role: "sodium hydroxide and peracetic acid active ingredients"
      record_type: "issue/return and supplier composition records"
      raw_fields: "chemical_name; product_mass_kg; returned_mass_kg; active_fraction; campaign_id; lot_ids"
      collection_method: "weigh formulated product and calculate active mass separately for each chemical"
      unit: "kg active ingredient"
      frequency: "each campaign"
      temporal_coverage: "complete reporting period"
      site_scope: "declared sanitation system"
      aggregation_rule: "active mass = (issued product mass - returned mass) x active fraction"
      quality_evidence: "supplier SDS/specification; scale calibration; dosing log"
    - protocol_id: cp_sanitation_wastewater
      process_id: "sanitation"
      flow_role: "raw wastewater"
      record_type: "wastewater meter and water-balance record"
      raw_fields: "campaign_id; influent_volume_m3; potable_water_m3; retained_or_evaporated_water_m3; lot_ids"
      collection_method: "meter wastewater and reconcile it to sanitation water for the assigned campaigns"
      unit: "m3"
      frequency: "each campaign or daily"
      temporal_coverage: "complete reporting period"
      site_scope: "sanitation drain to on-site treatment inlet"
      aggregation_rule: "sum matched campaign volumes and normalize to reference flow"
      quality_evidence: "meter calibration; water-balance worksheet; drain routing verification"
    - protocol_id: cp_wastewater_treatment
      process_id: "onsite_wastewater_treatment"
      flow_role: "treatment input, electricity, and sludge"
      record_type: "treatment meter, operations, and sludge records"
