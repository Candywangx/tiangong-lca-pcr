system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground system is a gate-to-gate frozen-meat finishing operation. Product identity is inherited from a cut-specific upstream dataset and maintained through lot-level mass and traceability records."
      source_ids: []
    - rule_id: boundary_instance_gate
      applies_to: "all foreground packages"
      rule: "Include only the declared red-deer UNECE 9237 boneless forced-air/R717 configuration; do not average another species, cut, bone state, freezing technology, refrigeration system, packaging configuration, or temperature specification."
      source_ids:
        - unstats-cpc-3-2025
        - unece-deer-meat-2013
        - dinz-farmed-venison
        - wiklund-et-al-2014-venison
    - rule_id: boundary_upstream_cut
      applies_to: "chilled meat input"
      rule: "Require the upstream cut-specific dataset through chilled boneless-cut preparation and keep all upstream burdens outside the finishing foreground inventory to avoid double counting."
      source_ids:
        - unece-deer-meat-2013
        - fao-who-cxc-58-2005
    - rule_id: boundary_quick_freezing
      applies_to: "blast freezing and cold chain"
      rule: "Include measured freezing and storage operations until dispatch; quick freezing is complete only when product thermal-centre temperature reaches <= -18 deg C, and the cold chain must preserve that condition subject only to documented legal tolerances."
      source_ids:
        - fao-who-cxc-8-1976
        - fao-meat-cold-store-manual
    - rule_id: boundary_on_site_wastewater
      applies_to: "sanitation wastewater"
      rule: "Include the declared on-site aerobic treatment and direct discharge; another wastewater route requires a separately declared scenario and must not be averaged into this route."
      source_ids:
        - fao-who-cxc-58-2005
boundary_abstraction:
  declared_starting_condition: "Chilled, food-safe, boneless farmed red deer (*Cervus elaphus*) UNECE 9237 inner part of the leg, long-cut, received as an identified lot with measured net mass and temperature"
  starting_condition_role: "Upstream product input to the frozen-meat finishing foreground system"
  product_classification_scope: "Narrower data-package instance within CPC 3.0 21139; it is not a CPC-wide species or technology mix"
  recursive_input_rule: "If any frozen meat that itself satisfies this PCR enters the foreground system, record it as a separate product input with an upstream dataset and subtract it from newly produced output; never recursively re-create or silently merge it with the reference output."
  upstream_dataset_requirement: "Use a cut-specific dataset covering farmed red deer production, slaughter, dressing, chilling, boning, UNECE 9237 cut preparation, and allocation to the received boneless cut; a live-animal, generic carcass, generic venison, or mixed-species dataset is not sufficient."
  disclosure: "Declare the exact species, farmed status, cut code and description, bone state, origin, upstream dataset, facility, production dates, freezing equipment, R717 equipment group, packaging specification, storage duration, dispatch temperature, and every deviation from the boundary."
