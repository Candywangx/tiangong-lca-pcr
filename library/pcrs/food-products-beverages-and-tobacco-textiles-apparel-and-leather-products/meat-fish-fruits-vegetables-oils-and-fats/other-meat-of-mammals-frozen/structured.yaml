validation_rules:
  - rule_id: val_instance_identity
    applies_to: "package metadata and reference flow"
    rule: "Fail if species, farmed status, UNECE 9237 cut, boneless state, forced-air blast technology, R717 system, packaging configuration, or <= -18 deg C dispatch gate is missing or differs; do not infer a species market share."
    source_ids:
      - unstats-cpc-3-2025
      - unece-deer-meat-2013
      - dinz-farmed-venison
      - fao-who-cxc-8-1976
  - rule_id: val_reference_mass
    applies_to: "dispatched_frozen_red_deer_inner_leg"
    rule: "Fail unless reference output is exactly 1,000 kg net edible meat and packaging, pallet, frost, glaze, ice, and free liquid are excluded."
    source_ids:
      - unece-deer-meat-2013
      - mass-balance-identity
  - rule_id: val_reference_uuid
    applies_to: "all inventory cards"
    rule: "Fail unless UUID 1fc83e3b-ac93-4d3b-899e-eed337072097 appears only on dispatched_frozen_red_deer_inner_leg and every other card has no UUID."
    source_ids:
      - mass-balance-identity
  - rule_id: val_atomic_flows
    applies_to: "process inventory"
    rule: "Fail any aggregate or family card, including energy, materials, chemicals, fuels, refrigerants, packaging, wastes, emissions, or route-specific carriers; every crossing flow must have one row_id and non-empty description."
    source_ids:
      - mass-balance-identity
  - rule_id: val_no_undeclared_route
    applies_to: "process and inventory"
    rule: "Fail if another species, cut, bone state, freezing method, refrigerant, packaging configuration, wastewater route, fuel, steam, ice, heat carrier, or distribution transport is averaged into this instance."
    source_ids:
      - unstats-cpc-3-2025
      - unece-deer-meat-2013
      - fao-who-cxc-8-1976
  - rule_id: val_temperature_chain
    applies_to: "blast freezing, storage, and dispatch"
    rule: "Fail if freezer thermal-centre completion and dispatch product temperature records do not demonstrate <= -18 deg C, or if storage temperature history and excursions are missing."
    source_ids:
      - fao-who-cxc-8-1976
      - fao-meat-cold-store-manual
  - rule_id: val_mass_closure
    applies_to: "meat and packaging"
    rule: "Fail unresolved meat-balance differences and missing separate PA/PE, PP-label, and corrugated-cardboard input/waste reconciliations."
    source_ids:
      - mass-balance-identity
  - rule_id: val_refrigerant_closure
    applies_to: "blast and storage R717 systems"
    rule: "Fail if R717 make-up and loss are absent, combined across equipment groups, or not supported by charge/service/recovery records."
    source_ids:
      - fao-who-cxc-8-1976
      - mass-balance-identity
  - rule_id: val_wastewater_closure
    applies_to: "sanitation and on-site treatment"
    rule: "Fail if raw wastewater, treatment electricity, sludge, treated-water discharge, COD, or total-nitrogen records are missing or if pollutant samples and effluent volumes are not time matched."
    source_ids:
      - fao-who-cxc-58-2005
      - mass-balance-identity
  - rule_id: val_evidence_gap_disclosure
    applies_to: "candidate use"
    rule: "Mark validation inconclusive for publication if foreground quantities, non-reference UUID alignment, or the open species-market-share limitation is represented as reviewed default evidence rather than disclosed as an instance gate or evidence gap."
    source_ids:
      - mass-balance-identity
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset derived from a completed, reviewed foreground data package"
  downstream_use: "Process and lifecycle-model construction for the declared frozen farmed-red-deer UNECE 9237 boneless configuration"
  allowed_use: "Use only where the study product matches the declared species, cut, bone state, packaging, forced-air/R717 freezing and storage route, wastewater route, geography and period relevance, and loading-dock temperature gate"
  excluded_use: "CPC-wide species mix; generic venison; other cuts or bone states; fresh/chilled meat; offal; mixed-species production; alternative freezing or refrigerant systems; alternative wastewater routes; retail, cooking, or consumption modelling"
  required_metadata: "PCR id and version; lot and facility scope; geography; reporting period; species and farmed status; UNECE cut; bone state; upstream cut dataset; packaging specifications; freezer and R717 equipment groups; storage duration; wastewater route; allocation methods; reference-flow UUID; dispatch temperature"
  required_quality_disclosure: "Primary-data share; temporal coverage; calibration and laboratory status; meat and packaging mass closure; electricity allocation; R717 closure; temperature excursions; wastewater sampling; rejects; missing UUIDs; deviations and unresolved evidence gaps"
  update_trigger: "Change in species, cut, bone state, source-animal system, packaging, freezer technology, refrigerant, wastewater route, delivery temperature, upstream allocation, facility technology, regulation, source evidence, or data older than the declared representativeness period"
