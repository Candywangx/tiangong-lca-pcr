        - meter_kwh
        - equipment_power_kw
        - operating_time_h
        - refrigeration_load_driver
        - storage_duration_h
      output: "process electricity kWh"
      source_ids:
        - mass-balance-identity
    - id: calc_r717_loss
      applies_to: "each R717 equipment group"
      rule: "R717 loss = opening charge + additions - closing charge - recovered mass"
      inputs:
        - opening_charge_kg
        - additions_kg
        - closing_charge_kg
        - recovered_kg
      output: "R717 emitted to air, kg"
      source_ids:
