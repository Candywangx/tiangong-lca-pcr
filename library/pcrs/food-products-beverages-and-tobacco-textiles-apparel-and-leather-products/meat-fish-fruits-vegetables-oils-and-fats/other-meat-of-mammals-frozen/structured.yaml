        - unit_mass_kg
      output: "material_mass_kg"
      source_ids:
        - mass-balance-identity
    - id: calc_electricity_share
      applies_to: "shared electricity meters"
      rule: "assigned kWh = meter-period kWh x documented causal driver share; use operating power x time or refrigeration load and duration, never revenue"
