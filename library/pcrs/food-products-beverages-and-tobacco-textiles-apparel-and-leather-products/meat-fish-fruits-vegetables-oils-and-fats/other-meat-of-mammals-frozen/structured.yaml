  - id: sanitation
    name: "Food-contact cleaning and sanitation"
    inclusion: "required"
    inclusion_condition: "Always included for the declared sodium-hydroxide detergent and peracetic-acid sanitizer regime"
    role: "Clean and sanitize receiving, packaging, and freezer-contact equipment"
