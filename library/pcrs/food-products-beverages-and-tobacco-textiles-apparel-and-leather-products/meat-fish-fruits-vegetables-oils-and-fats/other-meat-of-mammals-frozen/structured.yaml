  - id: onsite_wastewater_treatment
    name: "On-site aerobic wastewater treatment and discharge"
    inclusion: "required"
    inclusion_condition: "Always included for the declared wastewater route; a different route requires a separate scenario"
    role: "Treat sanitation wastewater and quantify sludge and direct water emissions"
    quantitative_reference: "m3 raw sanitation wastewater treated"
  - id: cold_dock_dispatch
    name: "Frozen-product release and loading-dock dispatch"
    inclusion: "required"
    inclusion_condition: "Always included after quality and temperature release"
    role: "Weigh and release the reference product at the facility loading dock"
    quantitative_reference: "1,000 kg net frozen meat dispatched"
