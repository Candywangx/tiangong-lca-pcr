  - id: blast_quick_freezing
    name: "Forced-air blast quick freezing"
    inclusion: "required"
    inclusion_condition: "Always included for the declared freezing technology and R717 equipment group"
    role: "Pass the product rapidly through maximum ice crystallization and reach <= -18 deg C at the thermal centre"
    quantitative_reference: "kg blast-frozen meat output"
  - id: frozen_storage
    name: "R717 frozen storage"
    inclusion: "required"
    inclusion_condition: "Always included from freezer exit until lot release to dispatch"
