  calculation_rules:
    - id: calc_process_meat_balance
      applies_to: "each meat-bearing process"
      rule: "output meat = input meat - measured meat rejects - documented mass change; unresolved difference is a quality finding, not a flow to be hidden"
      inputs:
        - input_mass_kg
        - reject_mass_kg
        - documented_mass_change_kg
      output: "output_mass_kg"
      source_ids:
