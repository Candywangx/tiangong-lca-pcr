measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report 1,000 kg net edible meat; exclude pouch, label, carton, pallet, ice, frost, glaze, and free liquid from reference mass."
  - id: mass_balance_basis
    applies_to: "all meat-bearing processes"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use calibrated receipt, transfer, reject, and dispatch masses on the same lot basis; calculated transfers must preserve incoming mass = outgoing meat + meat rejects + measured mass change, with any unresolved difference disclosed."
  - id: packaging_mass_basis
    applies_to: "each packaging material"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure polyamide/polyethylene pouches, polypropylene labels, and corrugated cardboard cartons separately; do not report a combined packaging mass."
  - id: electricity_unit
    applies_to: "each electricity row"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Preserve submetered kWh by process; if a shared meter is used, apply and disclose one causal allocation calculation rather than combining process electricity rows."
  - id: refrigerant_mass_balance
    applies_to: "each R717 refrigeration process"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For each equipment group and period, calculate R717 loss as opening charge + make-up - closing charge - documented recovery; do not combine blast-freezer and storage-system leakage."
  - id: water_volume_mass
    applies_to: "sanitation water and wastewater"
    required_property_ref:
      name: "Volume and mass"
      uuid: ""
    required_unit: "m3 and kg"
    rule: "Record potable water and wastewater volume in m3 and pollutant loads in kg; calculate pollutant load from matched flow volume and concentration records."
  - id: temperature_basis
    applies_to: "freezing, storage, and dispatch"
    required_property_ref:
      name: "Temperature"
      uuid: ""
    required_unit: "deg C"
    rule: "Record calibrated product thermal-centre temperatures for freezer completion and dispatch and continuous or logged storage-air temperatures; the instance gate is <= -18 deg C for product thermal-centre temperature."
