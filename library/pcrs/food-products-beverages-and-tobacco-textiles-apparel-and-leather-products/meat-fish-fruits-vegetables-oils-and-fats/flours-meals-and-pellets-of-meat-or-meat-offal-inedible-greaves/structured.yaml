      applies_to: "size reduction and pressure sterilisation"
      rule: "When Method 1 is declared, retain daily size-reduction checks and uninterrupted time, core-temperature and absolute-pressure records; the route target is ≤50 mm, >133 °C, ≥20 minutes and ≥3 bar absolute, subject to the currently applicable jurisdictional rule."
