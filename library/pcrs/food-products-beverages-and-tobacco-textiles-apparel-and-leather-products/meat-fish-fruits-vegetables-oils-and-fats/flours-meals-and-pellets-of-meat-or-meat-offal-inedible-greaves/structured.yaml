allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "all multi-output foreground processes"
    rule: "First subdivide meters and records so receiving, sterilisation/rendering, pressing, finishing and control exchanges are directly assigned wherever technically possible. Do not allocate exchanges that can be measured for one process or output."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_shared_rendering
    applies_to: "MBM and rendered fat"
    rule: "For genuinely shared rendering exchanges that cannot be subdivided or expanded, test and document a relevant physical relationship. If none represents the distinct functions of meal and fat, allocate by each co-product's positive annual plant-gate net revenue using the same reporting period; disclose price, mass and factor for both outputs."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_waste_and_rework
    applies_to: "rejects, fines, sludge, off-spec meal and internal rework"
    rule: "Assign treatment burdens to the process generating each waste; give no avoided-burden credit without an explicit expanded-system study. Net internal rework once and retain both gross and net records."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_sensitivity
    applies_to: "published secondary or background dataset"
    rule: "Report an unallocated joint-process inventory and a mass-allocation sensitivity result alongside the selected revenue allocation when shared burdens materially affect the MBM result."
    source_ids:
      - ec-pef-2021
      - woodgate-2023-rendering
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "receiving_size_reduction_sterilisation_dry_rendering_fat_separation_pressing_meal_finishing_storage"
      flow_role: "raw material, intermediates, MBM and rendered fat"
      record_type: "scale, flowmeter, tank and stock records"
      raw_fields: "timestamp; lot; stream; gross; tare; net mass; moisture; opening stock; closing stock; recycle"
      collection_method: "calibrated scales/meters plus reconciled stock change"
      unit: "kg; kg dry matter"
      frequency: "each load/lot; daily reconciliation"
      temporal_coverage: "complete representative reporting period declared and justified by the dataset producer"
      site_scope: "all equipment and storage serving the declared route"
      aggregation_rule: "sum accepted mass by stream, adjust stock change and internal recycle once, then normalise to released MBM"
      quality_evidence: "calibration, lot traceability, stock reconciliation and signed mass-balance review"
    - protocol_id: cp_energy
      process_id: "all_processes"
      flow_role: "electricity and purchased steam"
      record_type: "meter, invoice, condensate and runtime records"
      raw_fields: "meter id; opening; closing; unit; steam pressure; steam temperature; condensate return; equipment power; runtime"
      collection_method: "dedicated meters preferred; documented allocation only for shared meters"
      unit: "kWh; MJ; kg steam"
      frequency: "continuous/daily meter; monthly invoice"
      temporal_coverage: "same period as mass records"
      site_scope: "all route equipment; shared services disclosed"
      aggregation_rule: "convert with documented factors, preserve carrier separation, subtract exports, normalise to released MBM"
      quality_evidence: "meter calibration, invoice reconciliation and conversion worksheet"
    - protocol_id: cp_water_wastewater
      process_id: "sterilisation_dry_rendering_odor_wastewater_control"
      flow_role: "supplied water, condensate and wastewater"
      record_type: "flowmeter, tank and laboratory records"
      raw_fields: "stream; volume; mass; density; COD; BOD; total suspended solids; nitrogen; phosphorus; discharge destination"
      collection_method: "separate meters and representative laboratory sampling"
      unit: "kg; m3; kg pollutant"
      frequency: "continuous/daily volume; sampling at permit or campaign frequency"
      temporal_coverage: "same period as production"
      site_scope: "all route water inlets, internal transfers and discharge points"
      aggregation_rule: "keep streams separate, calculate pollutant load as concentration × volume, normalise to released MBM"
      quality_evidence: "meter calibration, chain of custody, method and detection-limit record"
    - protocol_id: cp_air_emissions
      process_id: "all_processes"
      flow_role: "VOC, particulate and controlled off-gas"
      record_type: "source test, continuous/periodic monitor, duct flow, permit and runtime records"
      raw_fields: "source id; pollutant; concentration; standardised flow; temperature; moisture; capture efficiency; control efficiency; operating hours"
      collection_method: "direct source test preferred; otherwise documented regulatory calculation"
      unit: "kg pollutant; Nm3 gas"
      frequency: "each test and operating-period calculation"
      temporal_coverage: "representative operating states across reporting period"
      site_scope: "every declared source and control-device inlet/outlet"
      aggregation_rule: "concentration × standardised flow × time, adjusted only by measured capture/control efficiency, normalised to released MBM"
      quality_evidence: "test report, calibration, operating log and uncertainty statement"
    - protocol_id: cp_waste
      process_id: "all_processes"
      flow_role: "rejects, fines, off-spec meal and sludge"
      record_type: "waste ticket, scale, tank and treatment records"
      raw_fields: "date; waste class; gross; tare; net mass; moisture; destination; treatment; internal recycle"
      collection_method: "weigh each shipment or calibrated tank drawdown"
      unit: "kg as received; kg dry matter"
      frequency: "each shipment; monthly reconciliation"
      temporal_coverage: "same period as production"
      site_scope: "all route waste points"
      aggregation_rule: "sum by atomic waste stream and destination, subtract documented internal recycle once, normalise to released MBM"
      quality_evidence: "signed ticket, receiver, treatment code and moisture evidence"
    - protocol_id: cp_control_chemicals
      process_id: "odor_wastewater_control"
      flow_role: "sodium hypochlorite"
      record_type: "invoice, tank inventory and dosing records"
      raw_fields: "product; active concentration; opening stock; purchases; closing stock; dosing meter"
      collection_method: "stock balance reconciled to dosing meter"
      unit: "kg solution; kg active substance"
      frequency: "batch/monthly"
      temporal_coverage: "same period as production"
      site_scope: "all route scrubbers"
      aggregation_rule: "opening + purchases − closing, report solution and active mass, normalise to released MBM"
      quality_evidence: "supplier specification, invoice and dosing calibration"
    - protocol_id: cp_method1_ccp
      process_id: "receiving_size_reduction_sterilisation_dry_rendering"
      flow_role: "particle size, time, core temperature and absolute pressure"
      record_type: "daily size check and sterilisation batch/continuous control records"
      raw_fields: "timestamp; line; maximum particle size; core temperature; residence time; absolute pressure; alarm; deviation; disposition"
      collection_method: "validated instruments with uninterrupted electronic record and daily crusher check"
      unit: "mm; °C; min; bar absolute"
      frequency: "continuous for sterilisation; daily for size reduction"
      temporal_coverage: "every production campaign represented"
      site_scope: "complete declared route"
      aggregation_rule: "flag any interval below the declared minimum; segregate affected output until disposition is documented"
      quality_evidence: "calibration, validation, alarm history, deviation investigation and release approval"
    - protocol_id: cp_product_release
      process_id: "meal_finishing_storage"
      flow_role: "released MBM quality and reference mass"
      record_type: "lot scale and laboratory certificate"
      raw_fields: "lot; species mix; category; moisture; crude protein; crude fat; ash; particle size; release decision; legal use restriction"
      collection_method: "representative sampling and laboratory method declared by dataset producer"
      unit: "kg; mass %; mm"
      frequency: "each released lot"
      temporal_coverage: "all released lots in reporting period"
      site_scope: "all MBM silos serving route"
      aggregation_rule: "mass-weight lot results and report distribution; reference quantity remains as-produced mass"
      quality_evidence: "sampling plan, method, laboratory QA/QC and authorised release"
    - protocol_id: cp_allocation
      process_id: "fat_separation_pressing_shared_services"
      flow_role: "MBM/fat allocation"
      record_type: "dispatch, invoice, cost and production records"
      raw_fields: "product; saleable mass; net revenue; price period; currency; shared exchange; allocation factor"
      collection_method: "reconcile annual mass and positive net revenue to audited records"
      unit: "kg; currency; fraction"
      frequency: "monthly, aggregated annually"
      temporal_coverage: "same period as inventory"
      site_scope: "declared plant and route"
      aggregation_rule: "apply subdivision first; otherwise calculate selected and sensitivity factors from co-period output data"
      quality_evidence: "audited reconciliation, price source, formula and factor sum check"
  calculation_rules:
    - id: calc_normalise_reference
      applies_to: "every foreground exchange"
      rule: "exchange per kg MBM = reporting-period exchange ÷ reporting-period released as-produced MBM mass"
      inputs:
        - "atomic exchange record"
        - "released MBM mass"
      output: "exchange/kg MBM"
      source_ids:
        - ec-pef-2021
    - id: calc_mass_balance
      applies_to: "each process and complete foreground"
      rule: "closure = (total mass input − total mass output − documented stock increase) ÷ total mass input; investigate stream-specific causes rather than forcing closure"
      inputs:
        - "wet mass"
        - moisture
        - "stock change"
        - recycle
      output: "wet- and dry-matter closure"
      source_ids:
        - epa-ap42-953
        - woodgate-2023-rendering
    - id: calc_pollutant_load
      applies_to: "air and water pollutants"
      rule: "load = concentration × standardised gas flow or wastewater volume × operating time; apply capture/control efficiency only when measured for the same state"
      inputs:
        - concentration
        - flow
        - time
        - efficiency
      output: "kg pollutant"
      source_ids:
        - epa-ap42-953
    - id: calc_revenue_allocation
      applies_to: "inseparable shared burdens"
      rule: "factor_i = positive net revenue_i ÷ sum positive net revenue of MBM and rendered fat in the same period; factors shall sum to 1"
      inputs:
        - "saleable mass"
        - "net price/revenue for both co-products"
      output: "shared-burden allocation factor"
      source_ids:
        - ec-pef-2021
    - id: calc_dry_matter
      applies_to: "moisture-bearing material streams"
      rule: "dry mass = wet mass × (1 − moisture mass fraction) using co-period representative moisture"
      inputs:
        - "wet mass"
        - moisture
      output: "kg dry matter"
      source_ids:
        - woodgate-2023-rendering
  data_quality_requirements:
    - id: dq_route_identity
      applies_to: "dataset and reference flow"
      requirement: "Demonstrate mammalian MBM, declared species/category and exact route; exclude other CPC 21190 forms."
      evidence: "supplier declarations, process diagram, release specification and Tiangong reference identity"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use one common representative reporting period, justify its duration and disclose shutdowns, abnormal events and substitutions."
      evidence: "meter coverage report and production calendar"
    - id: dq_completeness
      applies_to: "atomic flow inventory"
      requirement: "Reconcile every listed card or document a card-specific zero with evidence; combined utilities, energy, water, waste or emissions entries are nonconforming."
      evidence: "completeness matrix and source ledger"
    - id: dq_ccp
      applies_to: "Method 1 route"
      requirement: "Retain complete size, time, temperature and pressure evidence and disposition every deviation."
      evidence: "validated electronic record, daily check and deviation log"
    - id: dq_mass_energy
      applies_to: "material, electricity and steam"
      requirement: "Reconcile meters to invoices, stock changes and production; disclose shared-meter allocation and conversion factors."
      evidence: "calibration, invoices, reconciliation and uncertainty statement"
    - id: dq_air_water
      applies_to: "emissions and wastewater"
      requirement: "Retain source-test and laboratory methods, detection limits, standard conditions, sampling representativeness and load calculations."
      evidence: "test reports, chain of custody, calculations and permits"
    - id: dq_allocation
      applies_to: "shared rendering burdens"
      requirement: "Preserve unallocated inventory, selected factors, prices/revenues and mass sensitivity for the same period."
      evidence: "cp_allocation worksheet and audited records"
    - id: dq_estimates
      applies_to: "every reasoned_estimate range"
      requirement: "Treat provisional ranges as screening aids only; foreground records replace them and publication-critical allowed ranges require reviewed evidence."
      evidence: "range register and reviewer disposition"
    - id: dq_uuid
      applies_to: "Tiangong-linked rows"
      requirement: "Use only directly verified UUIDs without dataset versions; unresolved inventory UUIDs remain explicitly unresolved."
      evidence: "UUID verification record outside PCR content and manifest review metadata"
validation_rules:
  - rule_id: validate_route
    applies_to: "identity and process map"
    rule: "Fail if the dataset mixes non-mammalian meals, greaves as final product, meat meal, wet/batch rendering, pelletising or on-site steam generation into the declared route."
    source_ids:
      - unsd-cpc30-21190
      - epa-ap42-953
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Require exactly 1 kg as-produced released MBM linked to c9d74b2c-9179-4330-a54e-f63cc2c86f95, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, with every required qualifier declared."
    source_ids:
      - woodgate-2023-rendering
  - rule_id: validate_method1
    applies_to: "size reduction and sterilisation"
    rule: "Require complete route evidence for ≤50 mm, >133 °C, ≥20 minutes uninterrupted and ≥3 bar absolute, plus documented disposition of deviations; also verify the currently applicable jurisdictional rule."
    source_ids:
      - eu-reg-142-2011-method1
  - rule_id: validate_atomic_flows
    applies_to: "process inventory"
    rule: "Require each atomic flow card to retain non-empty description, direction, flow type, requirement, quantity rule, unit, source/estimate basis and verified-or-unresolved Tiangong UUID state."
    source_ids:
      - epa-ap42-953
      - ec-pef-2021
  - rule_id: validate_mass_balance
    applies_to: "each process and complete foreground"
    rule: "Report wet- and dry-matter closure and investigate any imbalance outside a dataset-specific reviewed acceptance criterion; do not force closure by changing the reference output."
    source_ids:
      - epa-ap42-953
      - woodgate-2023-rendering
  - rule_id: validate_energy_water
    applies_to: "electricity, steam and water streams"
    rule: "Fail when electricity and steam are combined or when supplied water, condensate and wastewater are merged in raw records."
    source_ids:
      - ec-pef-2021
  - rule_id: validate_emissions_waste
    applies_to: "air, wastewater and solid waste"
    rule: "Require atomic source/destination records for VOC, particulate matter, condensate, wastewater, rejects, fines, off-spec meal and sludge, including documented zeros where applicable."
    source_ids:
      - epa-ap42-953
  - rule_id: validate_allocation
    applies_to: "MBM and rendered fat"
    rule: "Require subdivision evidence, same-period co-product mass and positive net revenue, factors summing to 1, unallocated inventory, and mass sensitivity; fail unexplained zero-burden or avoided-burden treatment."
    source_ids:
      - ec-pef-2021
  - rule_id: validate_provisional_ranges
    applies_to: "reasoned estimates"
    rule: "Flag every provisional range as replaceable and prohibit its use as a publication-critical allowed range without reviewed evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Route-specific foreground data package that may be published as a secondary_dataset or background_dataset after review"
  downstream_use: "Gate-to-gate MBM supply for product systems whose product, legal use and route match the declared qualifiers"
  allowed_use: "Attributional LCA, supply-chain screening and foreground model construction with explicit upstream animal-by-product, steam, electricity and treatment links"
  excluded_use: "Full CPC 21190 average; meat meal, greaves, poultry/fish/blood/feather meal; other regulatory categories or technologies; comparative public claims without critical review; legal compliance determination"
  required_metadata: "canonical PCR id; reference UUID/property; location; technology; reporting period; species mix; animal-by-product category; Method 1 records; product composition; energy suppliers; water and emission controls; co-product outputs; allocation factors; cut-offs; uncertainty; data owner and review status"
  required_quality_disclosure: "measurement coverage; calibration; mass/dry-matter closure; energy and water reconciliation; emission and wastewater methods; missing data; reasoned estimates; allocation sensitivity; unresolved UUIDs; deviations and corrective action"
  update_trigger: "material change in raw-material mix, regulatory category, hygienisation method, cooker/press technology, energy supply, control system, product specification, allocation relationship, geography, or data older than the programme review interval"
