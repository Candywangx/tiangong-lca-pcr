      collection_method: "Record exactly one primary route per batch; use route meters where available and document allocation from shared meters; reconcile refrigerant and direct emissions to activity records."
      unit: "kg; kWh; MJ"
      frequency: "each batch and each applicable meter, invoice, or service interval"
      temporal_coverage: "same declared representative production period as output data"
