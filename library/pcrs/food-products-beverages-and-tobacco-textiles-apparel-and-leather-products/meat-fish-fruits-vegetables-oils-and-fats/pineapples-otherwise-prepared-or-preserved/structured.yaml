allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "separable products, routes, and batches"
    rule: "Use process subdivision or direct metering first so different product forms, packing media, preservation routes, and package formats retain their own inputs and outputs."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_then_economic
    applies_to: "unavoidable joint production"
    rule: "When subdivision is not feasible, use a physical relationship only when it reflects the causal relationship between jointly produced outputs; otherwise use an economic relationship based on a declared representative period, and disclose quantities, prices, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recovered_material
    applies_to: "pineapple residues or other recovered outputs"
    rule: "Keep recovered outputs and their destinations visible. Do not credit substitution or avoided production unless the receiving model explicitly defines and documents that consequential treatment."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_treatment
    applies_to: "wastes and wastewater"
    rule: "Assign collection, on-site treatment, and external treatment burdens to the process generating the stream unless a documented receiving-system rule requires another treatment; never net unrelated waste destinations."
    source_ids:
      - eu-pef-2021-2279
