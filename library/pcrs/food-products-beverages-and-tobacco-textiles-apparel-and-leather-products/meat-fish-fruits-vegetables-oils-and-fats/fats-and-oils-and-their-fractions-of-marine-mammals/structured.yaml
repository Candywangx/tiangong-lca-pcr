allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "species, source lots, routes, and separately metered operations"
    rule: "Prefer subdivision and direct assignment; do not pool species, legal source routes, or product states when records permit separate modelling."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_internal_transfers
    applies_to: "intermediate oil transferred between foreground processes"
    rule: "Carry measured intermediate mass and directly attributable utilities forward without creating an artificial co-product credit or recursive same-category input."
    source_ids: []
  - rule_id: allocation_marketable_outputs
    applies_to: "oil, physical fractions, and other marketable outputs"
    rule: "Identify each independently usable output and assign directly measured operations first; if shared burdens remain, select a physical relationship that reflects the process, or use economic allocation when no defensible physical relationship exists, and disclose the method and rationale."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_fractionation
    applies_to: "target and co-fractions"
    rule: "Do not assume equal composition, value, or yield; use measured fraction masses and product-specific records, disclose shared-burden allocation, and test a materially plausible alternative allocation basis."
    source_ids: []
  - rule_id: allocation_residue_status
    applies_to: "residues, recovered materials, and wastes"
    rule: "Determine product, co-product, residue, or waste status from actual legal status, use, and destination; do not relabel a marketable output as waste to avoid allocation, and do not credit recovery without a documented substitution or end-of-waste model."
    source_ids: []
  - rule_id: allocation_upstream_source
    applies_to: "source material arising with other activities or products"
    rule: "Use the upstream dataset's reviewed multifunctionality treatment and disclose it; do not assign zero upstream burden merely because the material is called a by-product."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_source_chain_and_receipt
      process_id: "source_receipt_qualification"
      flow_role: "source identity, legal and ethical applicability, custody, received and accepted mass, and transport"
      record_type: "permits and authorizations; species record; stock/population and geography; acquisition route; custody documents; inspection and weigh records; shipment route"
      raw_fields: "lot_id; common_name; scientific_name; stock_population; origin_geography; acquisition_route; jurisdictions; permit_or_authorization_ids; validity_dates; custody_parties_and_dates; intended_use; destination_market; gross_mass; tare_mass; accepted_mass; rejection_mass; origin; mode; distance; payload"
      collection_method: "verify documents against lot identity and validity; retain copies or durable references; use calibrated receiving scale and carrier records"
      unit: "kg; km; tkm"
      frequency: "every lot and shipment"
      temporal_coverage: "all lots represented by the dataset"
      site_scope: "every supplying route and receiving site"
      aggregation_rule: "no aggregation across species or incompatible authorization routes; mass-weight only compatible lots"
      quality_evidence: "authorization validity check; custody reconciliation; scale calibration; shipment evidence; exception log"
    - protocol_id: cp_batch_mass_balance
      process_id: "all_production_processes"
      flow_role: "feed, intermediate, product, co-product, residue, retained stock, and loss mass"
      record_type: "scale tickets; tank gauges; calibrated meters; batch sheets; inventory movements"
      raw_fields: "batch_id; lot_ids; opening_stock; each_input_mass; each_output_mass; closing_stock; moisture_or_basis; measurement_time; instrument_id"
      collection_method: "measure each transfer on a consistent declared basis and reconcile the batch"
      unit: "kg"
      frequency: "every batch; stock reconciliation at least per reporting period"
      temporal_coverage: "all production batches represented"
      site_scope: "every foreground site and applicable unit process"
      aggregation_rule: "normalize only after batch reconciliation; aggregate mass-weighted by qualified product output"
      quality_evidence: "calibration records; signed batch sheet; reconciliation residual and investigation"
    - protocol_id: cp_water_and_steam
      process_id: "primary_oil_recovery"
      flow_role: "water and steam"
      record_type: "meters; condensate records; utility logs"
      raw_fields: "meter_id; opening_reading; closing_reading; water_source; steam_mass_or_energy; batch_or_period; allocation_driver"
      collection_method: "direct metering preferred; otherwise reconcile a submetered period using documented operating drivers"
      unit: "m3; kg; MJ"
      frequency: "each batch or shortest representative metered period"
      temporal_coverage: "representative operating periods including cleaning"
      site_scope: "each site and relevant operation"
      aggregation_rule: "allocate only to operations using the utility and normalize to reconciled output"
      quality_evidence: "meter calibration; reading logs; allocation calculation"
    - protocol_id: cp_energy_and_fuels
      process_id: "all_production_processes"
      flow_role: "electricity, fuel, purchased heat, and cooling"
      record_type: "submeters; fuel issue records; invoices; equipment logs"
      raw_fields: "carrier; quantity; unit; meter_or_invoice_id; batch_or_period; operating_driver; allocation_factor"
      collection_method: "meter by carrier and operation where practicable; reconcile invoices to site totals"
      unit: "kWh; MJ; kg; m3"
      frequency: "each batch or monthly with operational reconciliation"
      temporal_coverage: "representative operating and seasonal periods"
      site_scope: "each site and technology"
      aggregation_rule: "keep carriers separate; allocate shared energy using measured operating drivers"
      quality_evidence: "meter calibration; invoice reconciliation; calculation record"
    - protocol_id: cp_utilities_and_aids
      process_id: "oil_refining_physical_fractionation"
      flow_role: "water, energy, cooling, processing aids, filtration media, and refrigerant make-up"
      record_type: "issue records; recipes; weigh records; meters; maintenance logs"
      raw_fields: "material_or_carrier; concentration; quantity; unit; batch_id; recovered_quantity; disposal_route"
      collection_method: "weigh, meter, or reconcile issued quantity to batch and retained stock"
      unit: "kg; m3; kWh; MJ"
      frequency: "every batch or issue"
      temporal_coverage: "all applicable batches"
      site_scope: "each site and technology"
      aggregation_rule: "report each aid and carrier separately; subtract documented returned unused stock only"
      quality_evidence: "calibrated instrument; issue and return records; batch sign-off"
    - protocol_id: cp_waste_and_discharge
      process_id: "all_production_processes"
      flow_role: "rejected material, residues, co-products, solid waste, and wastewater"
      record_type: "weigh records; manifests; invoices; tank or flow meters; laboratory results"
      raw_fields: "stream_id; legal_status; mass_or_volume; destination; treatment; sale_or_transfer_value_if_applicable; flow; pH; temperature; relevant_pollutant_concentrations"
      collection_method: "measure each material stream and discharge; characterize wastewater for the selected treatment or emission model"
      unit: "kg; m3; kg pollutant"
      frequency: "every batch or shipment; wastewater by monitoring plan"
      temporal_coverage: "all represented production and discharge periods"
      site_scope: "each site and discharge or transfer point"
      aggregation_rule: "keep streams and destinations separate; calculate loads from matched flow and concentration records"
      quality_evidence: "scale or meter calibration; transfer manifest; laboratory QA; destination evidence"
    - protocol_id: cp_emissions_monitoring
      process_id: "all_production_processes"
      flow_role: "direct air and water emissions and refrigerant loss"
      record_type: "stack or discharge monitoring; permit calculations; leak and service records"
      raw_fields: "substance; source; concentration; flow; duration; direct_mass; method; detection_limit; service_addition; recovered_refrigerant; period"
      collection_method: "use applicable approved monitoring or mass-balance method and distinguish captured from directly released streams"
      unit: "kg substance; concentration and flow units"
      frequency: "at permit or method frequency and after material process changes"
      temporal_coverage: "all operating periods represented"
      site_scope: "source-specific before justified aggregation"
      aggregation_rule: "calculate load from matched measurements; normalize to reconciled product output"
      quality_evidence: "method reference; calibration; laboratory QA; maintenance and exception records"
    - protocol_id: cp_packaging_and_storage
      process_id: "product_finishing_storage"
      flow_role: "packaging, storage duration, product transfer, and allocated storage energy"
      record_type: "bill of materials; packaging issue records; warehouse logs; energy meters; dispatch weights"
      raw_fields: "packaging_material; quantity; unit; batch_id; storage_condition; entry_time; dispatch_time; storage_energy; allocation_driver; net_product_mass"
      collection_method: "reconcile issued packaging and storage records to dispatched batches; meter or allocate storage energy by documented driver"
      unit: "kg; item; day; kWh; MJ"
      frequency: "every dispatch batch; energy monthly or shorter"
      temporal_coverage: "all stored and shipped product represented"
      site_scope: "each warehouse and delivered form"
      aggregation_rule: "exclude packaging from reference mass; allocate storage energy by occupied capacity and duration or a better measured driver"
      quality_evidence: "bill-of-material check; stock reconciliation; meter and dispatch records"
  calculation_rules:
    - id: calc_net_received_mass
      applies_to: "each source lot"
      rule: "net received mass = gross loaded mass - tare mass; accepted and rejected masses shall reconcile to net received mass after documented sampling or retained-stock adjustments"
      inputs:
        - gross_mass
        - tare_mass
        - accepted_mass
        - rejection_mass
        - documented_adjustment
      output: "kg accepted and rejected source material"
      source_ids: []
    - id: calc_transport_service
      applies_to: "inbound shipment"
      rule: "transport service = verified payload mass in tonnes x route distance in kilometres; document empty-return or multi-drop allocation when included"
      inputs:
        - payload_mass
        - route_distance
        - trip_allocation
      output: "tkm by mode and route"
      source_ids:
        - eu-pef-2021
    - id: calc_batch_mass_balance
      applies_to: "every production batch"
      rule: "mass-balance residual = total measured inputs + opening stock - total measured outputs - closing stock; investigate and disclose material residuals rather than forcing them to zero"
      inputs:
        - input_masses
        - output_masses
        - opening_stock
        - closing_stock
      output: "kg residual and percent of total measured input"
      source_ids: []
    - id: calc_process_yield
      applies_to: "recovery, refining, and fractionation"
      rule: "process yield = measured qualified output mass / measured process feed mass on the same declared basis; report separately by species, lot mix, product state, and technology"
      inputs:
        - qualified_output_mass
        - feed_mass
        - measurement_basis
      output: "kg/kg process feed"
      source_ids: []
    - id: calc_utility_intensity
      applies_to: "each applicable process"
      rule: "utility intensity = utility quantity allocated to the process / measured qualified process output; keep water, electricity, each fuel, heat, and cooling separate"
      inputs:
        - utility_quantity
        - allocation_driver
        - qualified_output_mass
      output: "utility unit per kg process output"
      source_ids: []
    - id: calc_pollutant_load
      applies_to: "measured wastewater or waste-gas stream"
      rule: "pollutant load = matched stream volume or gas flow x measured concentration, with unit conversion and sampling representativeness documented"
      inputs:
        - flow_or_volume
        - concentration
        - operating_time
        - conversion_factor
      output: "kg pollutant per reporting period"
      source_ids: []
    - id: calc_reference_normalization
      applies_to: "finished product dataset"
      rule: "normalized inventory amount = reconciled foreground amount / net kg of qualified reference product transferred at the factory gate"
      inputs:
        - foreground_amount
        - qualified_reference_product_mass
      output: "inventory amount per 1 kg reference product"
      source_ids: []
  data_quality_requirements:
    - id: dqr_identity_chain
      applies_to: "every source lot"
      requirement: "Species, stock or population and geography, acquisition route, jurisdictions, authorization validity, custody transfers, intended use, and destination-market eligibility shall be complete and mutually consistent."
      evidence: "Source record, authorization reference, custody record, and lot reconciliation"
    - id: dqr_species_route_separation
      applies_to: "all aggregated data"
      requirement: "Do not aggregate different species, materially different source routes, incompatible legal statuses, or materially different product states unless separate results are retained and the aggregation rationale is disclosed."
      evidence: "Disaggregated batch table and aggregation record"
    - id: dqr_measurement
      applies_to: "mass, utilities, aids, wastes, and emissions"
      requirement: "Use calibrated or otherwise controlled measurement systems; retain raw readings, units, conversion factors, allocation drivers, detection limits, and correction records."
      evidence: "Calibration, meter, laboratory, invoice, and calculation records"
    - id: dqr_temporal
      applies_to: "foreground dataset"
      requirement: "Cover a representative production period and all material operating modes, cleaning, start-up, shutdown, storage, and seasonal conditions; disclose excluded or abnormal periods."
      evidence: "Production calendar, operating logs, and coverage assessment"
    - id: dqr_completeness
      applies_to: "each process"
      requirement: "Reconcile all material mass, water, energy, aids, products, co-products, wastes, wastewater, and direct emissions identified for the actual route; explain zero, not-applicable, and missing values separately."
      evidence: "Process flow sheet, balance tables, and gap log"
    - id: dqr_no_cross_species_defaults
      applies_to: "all quantitative values"
      requirement: "Do not substitute fish-oil, terrestrial-animal-fat, another species, or another technology value without an explicit reviewed proxy justification and uncertainty assessment; no such default is supplied by this PCR."
      evidence: "Source applicability review and uncertainty record"
    - id: dqr_source_applicability
      applies_to: "external standards and guidance"
      requirement: "Use cited sources only for the stated purpose: CPC for category scope, CXS 211 and CXS 329 for negative applicability screens, EU FDM BAT only to document that primary rendering and fat melting are outside its scope and that its BAT-AELs and environmental performance values must not be applied here, and EU PEF for lifecycle method and disclosure context."
      evidence: "Source-to-rule trace and reviewer check"
    - id: dqr_quantitative_evidence
      applies_to: "yield, composition, utilities, aids, emissions, waste, and allocation factors"
      requirement: "Use foreground records or reviewed representative batch evidence. The absence of reliable cross-species ranges is a data requirement, not permission to invent a value."
      evidence: "Collection protocol outputs and reviewed evidence record"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "Confirm product flow UUID e203a8c3-0e12-46f4-bef7-fb2bb53cc8a3, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, reference unit kg, and normalization to 1 kg net product."
    source_ids: []
  - rule_id: val_product_scope
    applies_to: "product identity"
    rule: "Confirm CPC 21526 scope, declared marine-mammal species and product state, and exclusion of fish oil, other animal fat, unidentified blends, and chemically modified products outside the subclass."
    source_ids:
      - unsd-cpc-3-exp-notes-2025
  - rule_id: val_regulatory_chain
    applies_to: "every represented lot"
    rule: "Fail conformance if species, source geography and population or stock, acquisition route, applicable jurisdictions, authorization validity, custody transfers, processing eligibility, intended use, or destination-market status is missing, inconsistent, expired, or inapplicable."
    source_ids: []
  - rule_id: val_route_completeness
    applies_to: "process map"
    rule: "Include every operation actually performed and exclude only genuinely absent conditional processes; link all upstream acquisition and transport outside the foreground gate to qualified datasets."
    source_ids:
      - eu-pef-2021
  - rule_id: val_mass_balance
    applies_to: "every batch and aggregation"
    rule: "Check consistent measurement basis and reconciliation of inputs, outputs, co-products, residues, retained stock, and loss; investigate and disclose material residuals."
    source_ids: []
  - rule_id: val_inventory_completeness
    applies_to: "each included process"
    rule: "Verify collected values or explicit not-applicable declarations for water, energy carriers, aids, outputs, wastes, wastewater, direct emissions, packaging, and storage relevant to the actual route."
    source_ids: []
  - rule_id: val_allocation
    applies_to: "multifunctional processes"
    rule: "Verify subdivision and direct assignment were attempted first, every marketable output is identified, the remaining allocation relationship and rationale are disclosed, and a materially plausible alternative is tested."
    source_ids:
      - eu-pef-2021
  - rule_id: val_standard_non_transfer
    applies_to: "standard use"
    rule: "Reject any use of CXS 329 fish-oil values or CXS 211 named-animal-fat values as marine-mammal composition, identity, process, or numerical defaults."
    source_ids:
      - codex-cxs-329-2017
      - codex-cxs-211-1999
  - rule_id: val_bat_claim
    applies_to: "BAT or regulatory claim"
    rule: "Reject a claim that EU FDM BAT provides product-specific BAT for primary rendering or fat melting; record the actually applicable jurisdictional requirement separately."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: val_data_quality
    applies_to: "publication candidate"
    rule: "Verify temporal, technological, geographical, species, route, and product-state representativeness; list data gaps and proxy use; do not publish a reasoned estimate as a measured foreground value."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "species-, route-, site-, and product-state-specific foreground unit-process or aggregated-process dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA modelling of the declared marine-mammal fat, oil, or physical fraction for the documented geography, period, route, product state, intended use, and destination market after conformance checks"
  excluded_use: "Legal, ethical, sustainability, food-safety, feed-safety, or trade certification; fish-oil proxy; cross-species or cross-route substitution without review; modelling illegal or authorization-incomplete material; generic composition claims"
  required_metadata: "All reference-flow qualifiers; included and excluded processes; upstream dataset links; species and source route; regulatory-chain references; product and fraction state; intended use and destination market; temporal, technological, and geographical coverage; cut-offs; allocation; collection protocols; data-owner and review status"
  required_quality_disclosure: "Foreground versus secondary data; measurement basis and calibration; batch coverage and mass-balance residuals; proxy use; allocation sensitivity; missing quantitative range evidence; uncertainty; applicable and non-applicable source statements"
  update_trigger: "Change in species, source population or geography, authorization or trade regime, destination-market eligibility, acquisition route, technology, product state or fraction, site, allocation, data age, material yield or utility profile, emission controls, or availability of reviewed quantitative evidence"
data_sources:
  - id: "unsd-cpc-3-exp-notes-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 Explanatory Notes, subclass 21526, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Category identity and exclusions from fish oils, other animal fats, and chemically modified animal fats"
  - id: "codex-cxs-211-1999"
    type: "standard"
    reference: "Codex Alimentarius, CXS 211-1999, Standard for Named Animal Fats. https://workspace.fao.org/sites/codex/Standards/CXS%20211-1999/CXS_211e.pdf"
    used_for: "Negative applicability screen only; not a marine-mammal identity, composition, process, or numerical source"
  - id: "codex-cxs-329-2017"
    type: "standard"
    reference: "Codex Alimentarius, CXS 329-2017, Standard for Fish Oils. https://www.fao.org/fao-who-codexalimentarius/sh-proxy/es/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXS+329-2017%2FCXS_329e.pdf"
    used_for: "Confirms fish-oil scope; negative applicability screen prohibiting transfer to marine-mammal fats and oils"
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 of 15 December 2021 on the use of the Environmental Footprint methods. https://eur-lex.europa.eu/eli/reco/2021/2279/oj"
    used_for: "Lifecycle boundary, high-quality and verifiable data, upstream linkage, allocation hierarchy, and disclosure context; no product-specific value"
  - id: "eu-fdm-bat-2019"
    type: "official_guidance"
    reference: "Commission Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries. https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj"
    used_for: "Scope limitation only: primary animal by-product production such as rendering and fat melting is not addressed; do not apply FDM BAT-AELs or environmental performance values to this PCR"
