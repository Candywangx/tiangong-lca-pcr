system_boundary:
  rules:
    - rule_id: sb_scope_identity
      applies_to: "product-category selection"
      rule: "Include only products within CPC 3.0 subclass 21526 and keep fish oils, other animal fats, and chemically modified animal fats outside this PCR."
      source_ids:
        - unsd-cpc-3-exp-notes-2025
    - rule_id: sb_regulatory_chain
      applies_to: "every source lot and destination market"
      rule: "Identify species, source population or stock and geography, acquisition route, applicable jurisdiction, authorization documents, chain-of-custody transfers, processing eligibility, intended use, and destination-market status; reject conformance when this chain is incomplete or inapplicable."
      source_ids: []
    - rule_id: sb_upstream_acquisition
      applies_to: "source-material acquisition before the first foreground gate"
      rule: "Link harvest, collection, landing, carcass handling, by-product generation, and transport to specific upstream datasets when they occur outside the foreground boundary; disclose excluded stages and do not treat legal or ethical screening as a substitute for their environmental inventory."
      source_ids:
        - eu-pef-2021
    - rule_id: sb_foreground_route
      applies_to: "processing under the operator's control"
      rule: "Include all actually performed receipt, preparation, oil recovery, separation, refining, physical fractionation, finishing, storage, treatment, and on-site utility operations through factory-gate transfer."
      source_ids:
        - eu-pef-2021
    - rule_id: sb_same_category_input
      applies_to: "purchased marine-mammal oil or fraction entering foreground processing"
      rule: "Keep the same-category input as an explicit product flow with its own upstream dataset and qualifiers; do not recursively re-create its upstream production inside the receiving process."
      source_ids: []
    - rule_id: sb_cxs_fish_oil_exclusion
      applies_to: "product specification and validation"
      rule: "Do not apply CXS 329-2017 fish-oil identities, composition ranges, or processing assumptions to marine-mammal fats or oils."
      source_ids:
        - codex-cxs-329-2017
    - rule_id: sb_named_animal_fat_limit
      applies_to: "product specification and validation"
      rule: "Do not use CXS 211-1999 as a marine-mammal composition, identity, or process specification."
      source_ids:
        - codex-cxs-211-1999
    - rule_id: sb_fdm_bat_scope_limit
      applies_to: "technology and emission claims"
      rule: "Do not present EU FDM BAT as a product-specific BAT basis for primary rendering or fat melting; its stated scope excludes primary products from animal by-products such as rendering and fat melting."
      source_ids:
        - eu-fdm-bat-2019
