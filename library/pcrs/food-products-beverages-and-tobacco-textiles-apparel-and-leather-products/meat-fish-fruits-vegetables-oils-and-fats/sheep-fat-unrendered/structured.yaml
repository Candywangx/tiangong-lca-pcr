allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Joint slaughter/dressing, cutting, utilities, cold storage, and packaging"
    rule: "First subdivide and directly assign separately metered material, energy, packaging, waste, and emission flows to the process and product that cause them. Document meters, equipment boundaries, and allocation periods."
    source_ids:
      - eu-2021-2279-pef
  - rule_id: allocation_joint_hierarchy
    applies_to: "Remaining multifunctional slaughter or cutting burdens"
    rule: "After subdivision, follow the PEF allocation hierarchy: avoid allocation through subdivision or other justified modelling where possible; where unavoidable, use a documented relevant physical causal relationship; if no defensible physical relationship exists, use another justified relationship such as economic value. Do not prescribe a sheep-fat allocation share in this PCR."
    source_ids:
      - eu-2021-2279-pef
  - rule_id: allocation_complete_denominator
    applies_to: "Joint-product denominator"
    rule: "Include every saleable or otherwise productive joint output from the same lot or allocation period. Record measured masses, product identities, disposition, prices and price period when economic allocation is used, and reconcile the allocation factors to one."
    source_ids:
      - eu-2021-2279-pef
  - rule_id: allocation_waste_and_credits
    applies_to: "Rejected tissue, wastewater, packaging waste, and productive residuals"
    rule: "Treat a flow as waste when the holder discards or is required to discard it. Do not award an avoided-product credit merely because a residual may have value; any substitution or recycling credit requires an explicitly documented downstream function and method consistent with the study goal."
    source_ids:
      - eu-2021-2279-pef
      - codex-cxc-58-2005
  - rule_id: allocation_no_cross_species_default
    applies_to: "All allocation factors"
    rule: "Do not import mass yields, price ratios, physical relationships, or allocation shares from cattle, buffalo, goats, other ruminants, or mixed-species operations as a sheep-fat default. Use represented sheep-route records or report the result as unresolved."
    source_ids:
      - unsd-cpc-3-0-21514
dataset_production:
  collection_protocols:
    - protocol_id: cp_joint_mass_and_identity
      process_id: "joint_recovery"
      flow_role: "Route input, gross sheep fat, and all joint products"
      record_type: "Scale tickets, production/lot records, species and disposition records"
      raw_fields: "lot_id; species; route; input_identity; input_mass_kg; gross_fat_mass_kg; co_product_id; co_product_mass_kg; anatomical_origin; disposition; scale_id; timestamp"
      collection_method: "Calibrated weighing linked to lot and species-segregation records"
      unit: "kg"
      frequency: "Each lot or production batch"
      temporal_coverage: "All represented lots; allocation period disclosed"
      site_scope: "Every represented slaughter/cutting site"
      aggregation_rule: "Sum by product and disposition over one consistent allocation period; retain lot-level linkage"
      quality_evidence: "Calibration/verification records; post-mortem disposition; species traceability; reconciliation report"
    - protocol_id: cp_trimming_mass_balance
      process_id: "fat_trimming"
      flow_role: "Gross fat input, net output, trims, downgrade, and drainage"
      record_type: "Batch sheets and scale records"
      raw_fields: "lot_id; gross_input_kg; net_output_kg; trim_kg; downgraded_product_kg; waste_kg; drain_loss_kg; pre_post_state; scale_id"
      collection_method: "Calibrated weighing before and after trimming and any washing/drainage"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "All represented batches"
      site_scope: "Every trimming site"
      aggregation_rule: "Reconcile input to net output plus all residual destinations before normalization"
      quality_evidence: "Scale verification; signed batch balance; disposition records"
    - protocol_id: cp_water_records
      process_id: "joint_recovery"
      flow_role: "Joint-recovery process water and wastewater"
      record_type: "Meter readings, invoices, batch logs, and wastewater records"
      raw_fields: "meter_id; start_reading; end_reading; unit; batch_or_period; operation; wastewater_volume; measurement_point; allocation_driver"
      collection_method: "Prefer process submeter; otherwise documented water balance or causal allocation"
      unit: "m3 or kg"
      frequency: "Each batch or at least each operating day, matched to production"
      temporal_coverage: "Full represented period including cleaning"
      site_scope: "Every represented joint-recovery facility; process level where practicable"
      aggregation_rule: "Subtract verified out-of-scope use and normalize by process output or allocation factor"
      quality_evidence: "Meter calibration; invoice reconciliation; water-balance closure; documented measurement point"
    - protocol_id: cp_trimming_water_records
      process_id: "fat_trimming"
      flow_role: "Trimming wash water, when used"
      record_type: "Meter readings, batch logs, and wastewater records"
      raw_fields: "meter_id; start_reading; end_reading; unit; lot_id; operation; wastewater_volume; measurement_point"
      collection_method: "Prefer batch or process submeter; otherwise documented water balance"
      unit: "m3 or kg"
      frequency: "Each trimming batch using water"
      temporal_coverage: "All represented wet-trimming batches"
      site_scope: "Every represented trimming site"
      aggregation_rule: "Subtract verified out-of-scope use and normalize by net trimmed output"
      quality_evidence: "Meter calibration; batch record; water-balance closure; documented measurement point"
    - protocol_id: cp_energy_records
      process_id: "joint_recovery"
      flow_role: "Electricity and fuel for joint recovery"
      record_type: "Meter readings, invoices, equipment logs"
      raw_fields: "carrier; meter_id; start_reading; end_reading; unit; operating_time; equipment; process; allocation_driver"
      collection_method: "Process submeter or documented equipment calculation reconciled to facility totals"
      unit: "kWh or MJ"
      frequency: "Each batch/day for variable loads; monthly reconciliation"
      temporal_coverage: "Full represented joint-recovery period"
      site_scope: "Every represented joint-recovery facility; process/equipment level where practicable"
      aggregation_rule: "Sum by carrier and process; normalize using direct measurement or documented causal driver"
      quality_evidence: "Meter calibration; invoice reconciliation; equipment specification and operating log"
    - protocol_id: cp_cold_chain_records
      process_id: "cold_conditioning"
      flow_role: "Product mass, temperature state, storage, and loss"
      record_type: "Temperature logger, warehouse, batch, and scale records"
      raw_fields: "lot_id; entry_mass_kg; exit_mass_kg; entry_temperature; exit_temperature; temperature_unit; specification; start_time; end_time; excursion; loss_mass_kg; disposition"
      collection_method: "Calibrated temperature monitoring and calibrated weighing linked to inventory movements"
      unit: "kg; temperature unit; h or day"
      frequency: "Each lot; continuous or facility-defined monitoring where appropriate"
      temporal_coverage: "Entire conditioning and storage interval"
      site_scope: "Every in-scope cold room/freezer and represented lot"
      aggregation_rule: "Time-weighted storage duration; sum lot mass and losses; no generic shrink factor"
      quality_evidence: "Logger calibration; alarm/excursion log; inventory reconciliation; written specification"
    - protocol_id: cp_cold_energy_records
      process_id: "cold_conditioning"
      flow_role: "Cold-stage electricity and fuels"
      record_type: "Meter readings, invoices, equipment and operating-time logs"
      raw_fields: "carrier; meter_id; start_reading; end_reading; unit; equipment_id; operating_time; load_record; storage_zone; allocation_driver"
      collection_method: "Cold-stage submeter or documented equipment calculation reconciled to the relevant meter"
      unit: "kWh or MJ"
      frequency: "Each batch/day for variable loads; monthly reconciliation"
      temporal_coverage: "Entire represented conditioning and storage interval"
      site_scope: "Every in-scope cold room/freezer"
      aggregation_rule: "Sum by carrier and equipment; normalize by conditioned output mass and disclose storage duration"
      quality_evidence: "Meter calibration; invoice reconciliation; equipment specification; operating/load log"
    - protocol_id: cp_refrigerant_records
      process_id: "cold_conditioning"
      flow_role: "Refrigerant make-up and release"
      record_type: "Charge, purchase, recovery, and maintenance records"
      raw_fields: "equipment_id; refrigerant_identity; opening_charge_kg; added_kg; recovered_kg; closing_charge_kg; service_date; operating_period; allocation_driver"
      collection_method: "Equipment-level refrigerant mass balance"
      unit: "kg"
      frequency: "Each service event with annual or represented-period reconciliation"
      temporal_coverage: "Full represented operating period"
      site_scope: "In-scope refrigeration equipment"
      aggregation_rule: "Calculate loss by refrigerant identity and allocate only with a documented causal driver"
      quality_evidence: "Certified service record; purchase/recovery record; mass-balance reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "packaging_dispatch"
      flow_role: "Packaging consumed and tare"
      record_type: "Purchase/issue records, bill of materials, item mass checks"
      raw_fields: "packaging_id; material; item_count; measured_item_mass_kg; purchased_mass_kg; returned_mass_kg; reusable_flag; lot_id"
      collection_method: "Reconcile issued packaging to lots; verify count-to-mass factors by weighing"
      unit: "kg and item"
      frequency: "Each packaging lot; period reconciliation"
      temporal_coverage: "Full represented period"
      site_scope: "Every represented packing line/site"
      aggregation_rule: "Net non-reusable packaging consumed divided by net reference-product mass"
      quality_evidence: "Supplier specification; weigh check; inventory reconciliation; reusable-equipment register"
    - protocol_id: cp_dispatch_records
      process_id: "packaging_dispatch"
      flow_role: "Reference product, on-site handling, and handover"
      record_type: "Dispatch scale ticket, loading record, equipment log, delivery terms"
      raw_fields: "lot_id; gross_mass_kg; tare_mass_kg; net_mass_kg; product_state; handover_temperature; packaging; loading_energy; handover_location; handover_time; transport_owner"
      collection_method: "Calibrated gross/tare weighing and signed transfer record"
      unit: "kg; temperature unit; kWh or MJ"
      frequency: "Each dispatch lot"
      temporal_coverage: "All represented dispatches"
      site_scope: "Every represented dispatch site"
      aggregation_rule: "Sum net product and in-scope handling resources; normalize to 1 kg net product"
      quality_evidence: "Scale verification; transfer document; temperature record; equipment log"
    - protocol_id: cp_joint_waste_and_disposition
      process_id: "joint_recovery"
      flow_role: "Joint-recovery waste and productive residual destinations"
      record_type: "Weigh tickets, container records, manifests, transfer and revenue records"
      raw_fields: "lot_or_period; flow_identity; mass_kg; container_count; count_to_mass_factor; destination; waste_or_product_status; treatment; revenue; currency; price_period"
      collection_method: "Direct weighing preferred; verified count conversion otherwise"
      unit: "kg; currency/kg when relevant"
      frequency: "Each removal or transfer"
      temporal_coverage: "Full represented joint-recovery period"
      site_scope: "Every represented joint-recovery site and residual stream"
      aggregation_rule: "Sum separately by identity, status, and destination; do not net against product mass"
      quality_evidence: "Scale/check records; transfer manifest; invoice; legal/operational disposition record"
    - protocol_id: cp_dispatch_waste_and_disposition
      process_id: "packaging_dispatch"
      flow_role: "Dispatch waste and productive residual destinations"
      record_type: "Weigh tickets, container records, manifests, transfer and revenue records"
      raw_fields: "lot_or_period; flow_identity; mass_kg; container_count; count_to_mass_factor; destination; waste_or_product_status; treatment; revenue; currency; price_period"
      collection_method: "Direct weighing preferred; verified count conversion otherwise"
      unit: "kg; currency/kg when relevant"
      frequency: "Each removal or transfer"
      temporal_coverage: "Full represented dispatch period"
      site_scope: "Every represented dispatch site and residual stream"
      aggregation_rule: "Sum separately by identity, status, and destination; do not net against product mass"
      quality_evidence: "Scale/check records; transfer manifest; invoice; legal/operational disposition record"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "Every inventory amount"
      rule: "normalized amount = represented-period amount / net reference-product mass at dispatch; retain the original unit and conversion record"
      inputs:
        - "Collected process amount"
        - "dispatch net mass"
      output: "Amount per 1 kg net unrendered sheep fat"
      source_ids:
        - eu-2021-2279-pef
    - id: calc_mass_balance
      applies_to: "joint_recovery; fat_trimming; cold_conditioning; packaging_dispatch"
      rule: "mass balance closure = accounted output mass / measured input mass; list product, co-product, waste, drainage, and measured storage losses separately and investigate unexplained differences"
      inputs:
        - "Matched input and output mass records"
      output: "Process mass-balance closure and unresolved difference"
      source_ids:
        - eu-2021-2279-pef
        - eu-2019-2031-fdm-bat
    - id: calc_joint_allocation
      applies_to: "Unsubdivided joint slaughter/cutting burdens"
      rule: "allocated burden to unrendered sheep fat = remaining joint burden × documented allocation factor; allocation factors across all joint outputs shall sum to 1; physical or economic driver and period shall be disclosed"
      inputs:
        - "Remaining joint burden"
        - "complete co-product denominator"
        - "causal data or masses and prices"
      output: "Allocated joint burden and audit trail"
      source_ids:
        - eu-2021-2279-pef
    - id: calc_cold_energy
      applies_to: "cold_conditioning"
      rule: "cold-stage energy = directly metered energy, or equipment power × measured operating time adjusted by documented load data and reconciled to the relevant meter; divide by conditioned output mass and disclose storage duration"
      inputs:
        - "Meter/equipment readings"
        - "operating time"
        - "conditioned output mass"
        - "storage duration"
      output: "Energy by carrier per kg conditioned product, with duration"
      source_ids:
        - eu-2019-2031-fdm-bat
    - id: calc_refrigerant_loss
      applies_to: "cold_conditioning"
      rule: "release by refrigerant = opening charge + additions - recovered amount - closing charge, adjusted only for documented transfers; negative or incomplete balances are inconclusive"
      inputs:
        - "Refrigerant charge"
        - addition
        - recovery
        - "and closing records"
      output: "kg refrigerant release by identity and represented period"
      source_ids:
        - eu-2019-2031-fdm-bat
    - id: calc_packaging_mass
      applies_to: "packaging_dispatch"
      rule: "non-reusable packaging mass = issued mass - returned unused mass; for count records, multiply verified item count by verified item mass; exclude reusable equipment and report it separately"
      inputs:
        - "Packaging issue/return"
        - count
        - "item mass"
        - "reusable flag"
      output: "kg packaging per kg net reference product"
      source_ids:
        - eu-2021-2279-pef
  data_quality_requirements:
    - id: dq_identity_and_scope
      applies_to: "Product and all upstream/intermediate tissue flows"
      requirement: "Demonstrate sheep-only segregation, actual anatomical tissue/source-cut description, route, disposition, and unrendered/no-refining status. Mixed or unidentified animal fat is nonconforming."
      evidence: "Lot traceability, production records, post-mortem/disposition records, product specification"
    - id: dq_mass_metrology
      applies_to: "Reference mass and all material balances"
      requirement: "Use calibrated or verified weighing; disclose gross/tare method, moisture/tissue convention, measurement stage, unexplained balance differences, and count-to-mass conversions."
      evidence: "Calibration/verification certificates, scale tickets, batch balance, weigh checks"
    - id: dq_temporal_representativeness
      applies_to: "All foreground records"
      requirement: "Cover the declared production period and relevant seasonal/operating states, including chilled/frozen storage. Explain exclusions, downtime, and abnormal lots."
      evidence: "Coverage table, production calendar, meter and batch record completeness"
    - id: dq_cold_chain
      applies_to: "Chilled or frozen routes"
      requirement: "Provide written temperature specification, measurement points, logger calibration, actual handover temperature where controlled, storage duration, and excursions; do not report a generic threshold as if source-backed."
      evidence: "Temperature logs, alarm records, calibration, warehouse records"
    - id: dq_allocation
      applies_to: "Joint slaughter/cutting and shared utilities"
      requirement: "Document subdivision attempts, reason for the chosen remaining allocation relationship, complete denominator, source period for masses/prices, factor reconciliation, and sensitivity where allocation is material."
      evidence: "Process diagram, meters, product ledger, prices, allocation workbook, sensitivity result"
    - id: dq_inventory_completeness
      applies_to: "In-scope operations"
      requirement: "Account for relevant water, energy, raw materials, packaging, wastewater, residues, direct emissions, and losses at process or site level as appropriate. State checks skipped and data gaps."
      evidence: "Resource/emission inventory, meters, invoices, waste manifests, reconciliation"
    - id: dq_reasoned_estimate_replacement
      applies_to: "Provisional gross-fat-input QA guardrail"
      requirement: "Treat 1.00-2.00 kg input per kg output only as a reasoned QA screen. Replace or retire it when reviewed sheep-fat-specific batch mass balances and metrology uncertainty are available for the represented route and tissue state; never convert it into a default yield or allocation factor."
      evidence: "Review record linking replacement evidence to gross_fat_input_mass_guardrail"
    - id: dq_source_applicability
      applies_to: "Use of external standards and guidance"
      requirement: "Apply CXC 58-2005 only to applicable meat-hygiene/process-control context; use CXS 211-1999 only to distinguish rendered named fats; use FDM BAT only for relevant inventory/monitoring completeness; do not import legal thresholds, composition values, or unrelated sector performance values."
      evidence: "Source applicability statement and reviewer sign-off"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow and product metadata"
    rule: "Fail if the product-flow UUID, Mass property UUID, Units of mass UUID, kg unit, CPC reference, or sheep-only unrendered identity does not exactly match this PCR."
    source_ids:
      - unsd-cpc-3-0-21514
  - rule_id: validate_required_qualifiers
    applies_to: "Foreground data package"
    rule: "Fail if route, anatomical tissue origin/source cut, disposition, unrendered status, temperature state, tissue/moisture convention, packaging/tare, facility/period/lot, handover, or transport ownership is missing."
    source_ids:
      - unsd-cpc-3-0-21514
      - codex-cxc-58-2005
  - rule_id: validate_rendering_excluded
    applies_to: "Process map and inventory"
    rule: "Fail if rendering, melting, extraction, refining, or production of tallow/rendered fat is included in the default foreground or if a CPC 21521-21529 product is used as the reference flow."
    source_ids:
      - unsd-cpc-3-0-21514
      - codex-cxs-211-1999
  - rule_id: validate_species_and_route
    applies_to: "Input and output identities"
    rule: "Fail if another species, a mixed-species fat stream, or a borrowed other-ruminant yield/allocation parameter is used without explicit exclusion from the reference product and separate scenario treatment."
    source_ids:
      - unsd-cpc-3-0-21514
  - rule_id: validate_mass_and_tare
    applies_to: "Mass balance and reference amount"
    rule: "Fail if net reference mass is not measured or verified, packaging tare is included in the 1 kg product, or material outputs and residuals are not reconciled; flag the provisional 1.00-2.00 QA interval only for review, never automatic substitution."
    source_ids:
      - eu-2021-2279-pef
  - rule_id: validate_allocation
    applies_to: "Joint slaughter/cutting burdens"
    rule: "Fail if direct subdivision was not considered, the allocation relationship is undocumented, joint outputs are omitted, factors do not sum to 1, or a default sheep-fat allocation share is asserted without represented evidence."
    source_ids:
      - eu-2021-2279-pef
  - rule_id: validate_cold_chain
    applies_to: "Chilled or frozen routes"
    rule: "Fail if conditioning/storage energy and product losses are omitted; fail if state, duration, measurement points, or excursions are undisclosed. Mark refrigerant emissions inconclusive when charge records are insufficient rather than assuming zero."
    source_ids:
      - codex-cxc-58-2005
      - eu-2019-2031-fdm-bat
  - rule_id: validate_transport_handover
    applies_to: "Dispatch and transport"
    rule: "Fail if the handover point or transport ownership is ambiguous. If delivery transport is included, require mode, distance, load, route, temperature-control energy where applicable, and a reference flow located at the delivery handover."
    source_ids:
      - codex-cxc-58-2005
      - eu-2021-2279-pef
  - rule_id: validate_source_limits
    applies_to: "Quantitative and legal claims"
    rule: "Fail if CXS 211-1999 composition/quality values are applied to unrendered fat, if CXC 58-2005 is used as LCA quantity evidence, or if EU 2019/2031 thresholds/performance values are generalized beyond their legal and sector scope."
    source_ids:
      - codex-cxs-211-1999
      - codex-cxc-58-2005
      - eu-2019-2031-fdm-bat
published_dataset_profile:
  dataset_role: "Foreground production dataset for unrendered sheep fat at a declared dispatch handover"
  downstream_use: "secondary_dataset; background_dataset after methodology and data-quality review"
  allowed_use: "LCA process or lifecyclemodel construction for sheep-only unrendered fat matching the declared route, anatomical tissue state, disposition, temperature state, packaging, geography, period, allocation method, and handover"
  excluded_use: "Rendered/refined fats or tallow; other or mixed animal species; substitution for meat, live-sheep, hide, offal, or rendering datasets; use of provisional QA bounds as default yields; public comparative assertions without applicable review/verification"
  required_metadata: "PCR id and version context; reference UUID/property/unit-group/unit; CPC reference; species; anatomical tissue/source cut; slaughter/cutting route; disposition; actual tissue/moisture convention; unrendered confirmation; temperature state/specification and handover temperature where controlled; storage duration; packaging/tare; facility/geography; period/lot; upstream dataset; process map; handovers; transport ownership; allocation method/factors/denominator; data sources"
  required_quality_disclosure: "Foreground versus calculated records; mass-balance closure; meter/scale coverage and calibration; temporal/site coverage; cold-chain coverage and excursions; refrigerant-data completeness; allocation sensitivity; missing UUIDs; reasoned-estimate use and replacement status; checks performed/skipped; unresolved findings"
  update_trigger: "Reviewed sheep-fat-specific mass-balance evidence; change in Tiangong reference identities; change in product scope or CPC classification; new applicable category-specific PCR/PEFCR; changed slaughter/cutting/cold-chain route; revised Codex hygiene or named-fat texts; revised PEF method; new applicable BAT conclusions; material foreground evidence that replaces the provisional QA guardrail"
data_sources:
  - id: "unsd-cpc-3-0-21514"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification (CPC) Version 3.0, code 21514, “Sheep fat, unrendered”, official structure CSV: https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv (retrieved 2026-08-11)"
    used_for: "Product name, sheep-only classification scope, and separation from the rendered-fat class. Limitation: classification evidence does not define production processes, tissue composition, yields, allocation shares, or LCA quantities."
  - id: "codex-cxc-58-2005"
    type: "standard"
    reference: "Codex Alimentarius, Code of Hygienic Practice for Meat, CXC 58-2005: https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FStandards%252FCXC%2B58-2005%252FCXC_058e.pdf (retrieved 2026-08-11)"
    used_for: "Applicable slaughter/dressing and post-mortem process-control context; segregation of unsafe/unsuitable parts; cooling/freezing, storage, packaging, transport protection, and temperature-monitoring completeness. Limitation: no sheep-fat LCA amounts, yields, allocation factors, or universal temperature threshold are inferred."
  - id: "codex-cxs-211-1999"
    type: "standard"
    reference: "Codex Alimentarius, Standard for Named Animal Fats, CXS 211-1999, amended 2024: https://www.fao.org/fao-who-codexalimentarius/sh-proxy/pl/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FStandards%252FCXS%2B211-1999%252FCXS_211e.pdf (retrieved 2026-08-11)"
    used_for: "Naming/exclusion evidence that edible tallow involving sheep is obtained by rendering. Limitation: the standard concerns named fats presented for human consumption, chiefly rendered products; its composition, quality, additive, and analytical values are not applied to unrendered sheep fat."
