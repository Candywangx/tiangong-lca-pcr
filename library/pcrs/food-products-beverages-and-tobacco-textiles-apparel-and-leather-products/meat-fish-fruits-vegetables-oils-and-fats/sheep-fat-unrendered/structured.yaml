system_boundary:
  rules:
    - rule_id: boundary_sheep_unrendered_only
      applies_to: "Product identity and every represented lot"
      rule: "Include only segregated actual sheep fatty tissue/raw fat that has not undergone rendering or refining. Exclude and separately model rendered tallow or other products in CPC 21521-21529."
      source_ids:
        - unsd-cpc-3-0-21514
        - codex-cxs-211-1999
    - rule_id: boundary_slaughter_cutting_trace
      applies_to: "Slaughter, dressing, cutting, separation, and trimming"
      rule: "Identify the operation where fat becomes a separately measured output and retain post-mortem disposition and species traceability through trimming and packaging."
      source_ids:
        - codex-cxc-58-2005
    - rule_id: boundary_cold_chain
      applies_to: "Chilling, freezing, cold storage, and temperature-controlled handling"
      rule: "Include actual conditioning energy, refrigerant make-up or measured loss, storage duration, and product losses when these operations occur before handover; retain temperature records and excursions without importing a generic threshold."
      source_ids:
        - codex-cxc-58-2005
        - eu-2019-2031-fdm-bat
    - rule_id: boundary_packaging_and_handover
      applies_to: "Packaging, loading, and transport interface"
      rule: "Include packaging and on-site handling consumed before the declared handover. Exclude transport after handover by default; if delivery to a customer gate is claimed, add route-specific transport and move the reference handover accordingly."
      source_ids:
        - codex-cxc-58-2005
        - eu-2021-2279-pef
    - rule_id: boundary_recursive_input
      applies_to: "Purchased unrendered sheep fat used as an input"
      rule: "Link the purchased material to a verified upstream dataset and report only the incremental consolidation, trimming, conditioning, packaging, and losses in the current foreground."
      source_ids:
        - eu-2021-2279-pef
    - rule_id: boundary_resource_emission_inventory
      applies_to: "Represented food-processing operations where the FDM BAT scope is relevant"
      rule: "Collect process-level water, energy, raw-material, residue, wastewater, and direct-emission records for inventory completeness. Apply this as a data-collection completeness rule only when relevant; do not import legal capacity thresholds, emission limits, or performance levels into this PCR."
      source_ids:
        - eu-2019-2031-fdm-bat
boundary_abstraction:
  declared_starting_condition: "Either sheep entering a represented slaughter/dressing joint process, or a documented sheep carcass/cut entering a separate cutting facility; the selected route and receipt condition shall be declared"
  starting_condition_role: "Upstream product input to a joint slaughter/cutting system from which unrendered sheep fat is recovered"
  product_classification_scope: "Sheep-only unrendered fatty tissue or raw fat corresponding to CPC 3.0 code 21514; no rendered fat and no other animal species"
  recursive_input_rule: "Purchased unrendered sheep fat of the same category that is consolidated, re-trimmed, conditioned, or repacked remains a technosphere product input with its own upstream dataset; it shall not be assigned zero burden or silently merged into foreground recovery"
  upstream_dataset_requirement: "A slaughter route requires an upstream sheep-production and live-animal transport dataset through the declared slaughter input; a cutting route requires an upstream carcass/cut dataset that includes sheep production, transport, slaughter, and prior joint-product allocation. Avoid gaps and double counting between the upstream dataset and this foreground"
  disclosure: "Declare route, facility, geography, period, lot, anatomical tissue origin, edible/other disposition, actual tissue convention, state before and after conditioning, cold-storage duration, packaging, inbound and outbound handovers, and whether downstream transport starts before or after the reference-flow handover"
