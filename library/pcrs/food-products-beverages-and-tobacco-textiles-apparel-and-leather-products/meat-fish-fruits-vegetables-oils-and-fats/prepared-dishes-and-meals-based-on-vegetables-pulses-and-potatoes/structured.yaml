  calculation_rules:
    - id: calc_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = reporting-period row amount / released net product mass × 1,000 kg"
      inputs:
        - "atomic row total"
        - "released net product mass"
      output: "amount per 1,000 kg net prepared meal"
      source_ids:
        - ec-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "ingredient preparation, cooking, and packaging"
      rule: "input mass + opening work-in-process = output mass + separately identified waste + closing work-in-process; investigate material imbalance before release"
      inputs:
        - "calibrated batch and inventory records"
      output: "reconciled process mass balance"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_energy_allocation
      applies_to: "shared energy"
      rule: "product energy = shared-meter energy × documented causal driver share; sum of all shares must equal the shared-meter total"
      inputs:
        - "meter total"
        - "equipment time/power"
        - "thermal duty"
        - "or storage driver"
      output: "product-attributed energy"
      source_ids:
        - ec-pef-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "each refrigerant"
      rule: "loss = opening inventory + purchases + additions received − closing inventory − recovered quantity − transfers out; negative or unexplained results require correction"
      inputs:
        - "equipment-level refrigerant records"
      output: "direct loss by refrigerant"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_emission_load
      applies_to: "each direct air or water pollutant"
      rule: "load = representative concentration × matched flow integrated over the same operating or discharge period, with documented unit conversion"
      inputs:
        - concentration
        - flow
        - duration
        - "reference conditions"
      output: "pollutant mass"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_packaging_balance
      applies_to: "each packaging component"
      rule: "purchased/issued mass − unused returns = mass on saleable packages + separately measured scrap + inventory change"
      inputs:
        - "component issue"
        - return
        - "product count"
        - "unit mass"
        - scrap
      output: "component mass and scrap"
      source_ids:
        - rasines-et-al-2024-precooked-vegetables
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and every atomic flow"
      requirement: "Preserve recipe version, supplier or equipment identity, physical state, market state, treatment destination, and any Tiangong UUID once resolved."
      evidence: "recipe, specification, lot records, service and transfer documents"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one common representative reporting period, normally at least 12 consecutive months; explain shorter campaigns and cover seasonal or preservation-route variation."
      evidence: "date-bounded extracts and production calendar"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Reconcile ingredient, water, energy, packaging, product, waste, and emission totals to facility control totals; disclose exclusions and unclosed balances."
      evidence: "signed reconciliation and variance investigation"
    - id: dq_measurement
      applies_to: "meters, scales, and analyses"
      requirement: "Use calibrated instruments and accredited or otherwise demonstrated fit-for-purpose laboratory methods; retain detection limits and reference conditions."
      evidence: "calibration certificates, laboratory scope, sampling reports"
    - id: dq_technology
      applies_to: "cooking, preservation, refrigeration, and treatment"
      requirement: "Record equipment type, fuel, heat source, preservation temperature/time control, refrigerant, storage temperature, and wastewater route."
      evidence: "equipment register, HACCP records, operating logs"
    - id: dq_supplier_background
      applies_to: "purchased inputs and services"
      requirement: "Select background datasets matching ingredient origin, technology, electricity geography, fuel, packaging resin/fibre, refrigerant, and waste destination; record every proxy."
      evidence: "dataset selection log and supplier evidence"
    - id: dq_no_unsupported_ranges
      applies_to: "all important flows"
      requirement: "Do not publish a quantitative range until at least two independent, boundary-, unit-, and basis-compatible original sources have been verified, unless a controlling specification prescribes the interval."
      evidence: "range-evidence review or unresolved-range entry"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "PCR identity and reference flow"
    rule: "Reject a data package if the product is not primarily vegetable-, pulse-, or potato-based, if its market/preservation state is undeclared, or if the reference amount includes packaging."
    source_ids:
      - un-cpc-3-0
  - rule_id: validation_rule_2
    applies_to: "recipe and inventory atomicity"
    rule: "Require the recipe ingredient sum, each utility, each fuel, each refrigerant, each packaging component, each waste, and each direct emission to have a separate row; reject collection labels and combined carriers."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validation_rule_3
    applies_to: "process completeness"
    rule: "Require every applicable preparation, cooking, packaging, preservation/storage, sanitation, waste, and treatment process to have inputs and outputs; require an explicit not-applicable statement for route-dependent rows that are absent."
    source_ids:
      - rasines-et-al-2024-precooked-vegetables
      - codex-cxc-1-1969
  - rule_id: validation_rule_4
    applies_to: "mass and utility reconciliation"
    rule: "Require process mass balances and reconciliation of electricity, heat, fuel, water, packaging, refrigerant, and waste records to facility totals within a documented acceptance criterion."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validation_rule_5
    applies_to: "direct emissions"
    rule: "Require each reported emission load to use matched concentration, flow, time, and reference conditions; do not report off-site wastewater treatment as a direct water emission."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validation_rule_6
    applies_to: "allocation"
    rule: "Require evidence that subdivision was attempted before allocation, that any physical driver is causally relevant, and that allocation factors reconcile to one; reject undisclosed economic allocation or embedded substitution credits."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: validation_rule_7
    applies_to: "food-safety route evidence"
    rule: "Require the declared preservation and storage conditions to be supported by validated control measures and monitored batch records; this PCR does not prescribe a universal time-temperature schedule."
    source_ids:
      - codex-cxc-1-1969
  - rule_id: validation_rule_8
    applies_to: "unresolved evidence"
    rule: "Fail publication readiness while Tiangong identities or important-flow range evidence remain unresolved; a candidate dataset may proceed only with the gaps explicitly disclosed and no invented UUID or range."
    source_ids:
      - ec-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for a declared prepared vegetable-, pulse-, or potato-based meal"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product-specific LCA and lifecycle models when recipe, market state, preservation route, geography, technology, allocation, and system boundary are compatible"
  excluded_use: "Nutrition equivalence claims; generic substitution for meat-, fish-, cereal-, pizza-, or single-ingredient preserved products; use-phase or end-of-life claims not modelled by the dataset"
  required_metadata: "PCR id and version state; product name and recipe; ingredient mass fractions; net reference mass; market state; preservation route; packaging components; site geography and technology; reporting period; allocation; storage condition; shelf life; data sources and unresolved identities"
  required_quality_disclosure: "Primary-data share; meter and mass-balance coverage; temporal and geographic representativeness; background proxies; excluded flows; allocation factors; wastewater route; refrigerant balance; unresolved UUIDs and ranges"
  update_trigger: "Recipe or dominant ingredient change; preservation or packaging redesign; fuel, electricity, refrigerant, storage, or wastewater-route change; site/technology change; allocation change; material production shift; new verified Tiangong identity or compatible range evidence"
