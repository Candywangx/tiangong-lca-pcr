allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "shared processes and equipment"
    rule: "Avoid allocation by submetering, batch records, or subdivision wherever the product-specific inputs and outputs can be isolated."
    source_ids:
      - ec-pef-2021-2279
      - eu-fdm-bat-2019
  - rule_id: allocation_rule_2
    applies_to: "shared utilities and storage"
    rule: "When subdivision is not possible, allocate a shared utility using a causally relevant physical driver such as measured equipment time and power, steam duty, occupied refrigerated volume-mass-time, or treated wastewater load; document the driver and reconciliation to the facility total."
    source_ids:
      - ec-pef-2021-2279
      - schmidt-rivera-et-al-2014-convenience-food
  - rule_id: allocation_rule_3
    applies_to: "shared mass-handling operations"
    rule: "Use mass allocation only when mass throughput is a demonstrably relevant physical relationship; do not apply it automatically to heating, cooling, or treatment operations with materially different intensities."
    source_ids:
      - ec-pef-2021-2279
      - rasines-et-al-2024-precooked-vegetables
  - rule_id: allocation_rule_4
    applies_to: "food residues and recovered materials"
    rule: "First determine and disclose whether each output is waste or a co-product under the applicable jurisdiction. For a co-product, follow subdivision or system expansion before physical allocation; any substitution credit belongs only to the declared expanded-system study and shall not be silently embedded in a gate-to-gate dataset."
    source_ids:
      - ec-pef-2021-2279
      - eu-fdm-bat-2019
  - rule_id: allocation_rule_5
    applies_to: "economic allocation"
    rule: "Use economic allocation only when subdivision, system expansion, and a relevant physical relationship are not feasible; use contemporaneous net values, disclose the period and sensitivity, and keep the unallocated facility totals."
    source_ids:
      - ec-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_ingredient_mass
      process_id: "ingredient_preparation"
      flow_role: "individual received ingredient"
      record_type: "receiving and batch record"
      raw_fields: "ingredient identity, supplier lot, gross mass, tare, accepted mass, moisture/solids where relevant"
      collection_method: "calibrated receiving scale reconciled to batch issue"
      unit: "kg"
      frequency: "each lot and batch"
      temporal_coverage: "representative production period, normally at least 12 consecutive months"
      site_scope: "each manufacturing site"
      aggregation_rule: "sum accepted mass by ingredient and product, then normalize"
      quality_evidence: "calibration, lot traceability, recipe reconciliation"
    - protocol_id: cp_preparation_mass_balance
      process_id: "ingredient_preparation"
      flow_role: "prepared ingredient and preparation loss"
      record_type: "batch mass balance"
      raw_fields: "input mass, prepared transfer mass, peel, reject, retained work-in-process"
      collection_method: "calibrated line scales and inventory reconciliation"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "same period as reference-product output"
      site_scope: "each preparation line"
      aggregation_rule: "input equals transfers plus measured losses and inventory change"
      quality_evidence: "scale calibration, signed batch record, closure result"
    - protocol_id: cp_recipe_batch
      process_id: "formulation_cooking"
      flow_role: "individual recipe ingredient"
      record_type: "recipe and dosing record"
      raw_fields: "recipe version, ingredient id, dose, returned amount, batch output"
      collection_method: "calibrated dosing equipment or verified manual weigh sheet"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "same period as reference-product output"
      site_scope: "each cooking line"
      aggregation_rule: "sum net doses by ingredient and recipe version"
      quality_evidence: "recipe authorization, calibration, batch traceability"
    - protocol_id: cp_energy_records
      process_id: "all"
      flow_role: "electricity, steam, and purchased heat"
      record_type: "meter, invoice, and operating log"
      raw_fields: "meter ids, opening/closing readings, steam mass/pressure, heat quantity, operating time, product throughput"
      collection_method: "calibrated submeter preferred; documented physical allocation otherwise"
      unit: "kWh, MJ, kg steam"
      frequency: "continuous or each billing interval"
      temporal_coverage: "full reporting period"
      site_scope: "site and relevant line"
      aggregation_rule: "reconcile process totals to site purchase/generation and normalize"
      quality_evidence: "meter calibration, invoices, reconciliation"
    - protocol_id: cp_fuel_records
      process_id: "formulation_cooking"
      flow_role: "each on-site fuel"
      record_type: "tank, meter, and invoice record"
      raw_fields: "fuel identity, quantity, density, heating-value basis, opening/closing inventory, equipment"
      collection_method: "calibrated meter or inventory balance"
      unit: "kg or m3"
      frequency: "each delivery and reporting interval"
      temporal_coverage: "full reporting period"
      site_scope: "each combustion unit"
      aggregation_rule: "reconcile receipts, inventory change, and consumption by unit"
      quality_evidence: "invoices, tank calibration, fuel certificate"
    - protocol_id: cp_water_balance
      process_id: "ingredient_preparation_sanitation_wastewater"
      flow_role: "preparation, recipe, sanitation, and discharge water"
      record_type: "meter and water-balance record"
      raw_fields: "meter ids, readings, recipe addition, discharge, evaporation estimate, product water, losses"
      collection_method: "calibrated submeters and site water balance"
      unit: "m3 and kg"
      frequency: "continuous or daily"
      temporal_coverage: "full reporting period"
      site_scope: "each water-use area and discharge point"
      aggregation_rule: "reconcile intake with product, discharge, evaporation, and inventory change"
      quality_evidence: "meter calibration, balance closure, maintenance log"
    - protocol_id: cp_packaging_records
      process_id: "filling_packaging"
      flow_role: "each packaging component"
      record_type: "purchase, issue, count, and scrap record"
      raw_fields: "material, specification, unit mass, issued count/mass, unused returns, scrap"
      collection_method: "verified bill of materials plus line issue and scrap weights"
      unit: "kg"
      frequency: "each production order"
      temporal_coverage: "full reporting period"
      site_scope: "each packaging line"
      aggregation_rule: "issued minus return equals saleable packaging plus scrap"
      quality_evidence: "supplier specification, unit-mass check, reconciliation"
    - protocol_id: cp_product_output
      process_id: "all"
      flow_role: "intermediate and final product"
      record_type: "production and release record"
      raw_fields: "batch id, gross/net mass, packaging tare, hold/rework/reject, market state"
      collection_method: "calibrated checkweigher and release records"
      unit: "kg"
      frequency: "each batch"
