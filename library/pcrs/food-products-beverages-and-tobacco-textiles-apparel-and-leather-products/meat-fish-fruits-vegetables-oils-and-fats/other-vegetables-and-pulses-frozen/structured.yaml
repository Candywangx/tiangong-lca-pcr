validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm the product-flow, Mass property, mass unit group, kg unit, and exactly 1 kg net reference amount; packaging mass shall be separate."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_scope_qualifiers
    applies_to: "Product identity"
    rule: "Reject an unspecified generic recipe: all required qualifiers and any production-mix shares shall be present and internally consistent."
    source_ids:
      - codex-cxs-320-2015
  - rule_id: validation_process_coverage
    applies_to: "Foreground boundary"
    rule: "Confirm both required processes and every route-applicable conditional operation, utility, reject, wastewater, package, storage interval, and treatment destination are represented."
    source_ids:
      - codex-cxp-8-1976
  - rule_id: validation_mass_balance
    applies_to: "Material inventory"
    rule: "Confirm internal transfers match, net output equals the quantitative reference, and material/water balance gaps are disclosed and investigated."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_temperature
    applies_to: "Frozen condition"
    rule: "Confirm batch-linked freezing endpoint, storage, and dispatch records demonstrate the declared -18 °C-or-colder condition and identify excursions."
    source_ids:
      - codex-cxp-8-1976
      - eu-directive-89-108-eec
      - eu-regulation-37-2005
  - rule_id: validation_no_double_counting
    applies_to: "Internal and upstream flows"
    rule: "Confirm internal prepared-product transfers carry no duplicate upstream burden and same-category purchased inputs use one matching upstream dataset."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_refrigerant
    applies_to: "Direct emissions"
    rule: "Confirm chemical-specific facility reconciliation, equipment scope, recovery, stock change, product allocation, and no unsupported zero-emission assumption."
    source_ids:
      - ipcc-2006-v3-ch7
  - rule_id: validation_provisional_evidence
    applies_to: "Candidate ranges"
    rule: "Confirm reasoned-estimate ranges are labelled provisional and have not replaced foreground records or been presented as universal category parameters."
    source_ids: []
  - rule_id: validation_allocation
    applies_to: "Multi-output and shared systems"
    rule: "Confirm subdivision was attempted first and every remaining allocation method, driver, period, share, and sensitivity is disclosed."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Product- and route-specific foreground factory data package for frozen vegetables or pulses"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "LCA process or lifecyclemodel construction when product, geography, technology, production period, package, and storage qualifiers match the study"
  excluded_use: "A universal recipe for all frozen vegetables/pulses; agricultural production; downstream distribution/retail/use without added datasets; products outside scope; use of provisional ranges as reviewed defaults"
  required_metadata: "PCR id and version used; actual product/type; mix shares; supplier/origin; site/geography; production period; incoming state; preparation/blanching/freezing route; glazing/additives; package; storage duration; dispatch temperature; allocation; upstream dataset references"
  required_quality_disclosure: "Temporal/site coverage; mass and water balance; meter and sensor coverage; missing data; allocation and sensitivity; refrigerant method; temperature excursions; provisional estimates; exclusions and uncertainty"
  update_trigger: "Change in product mix, supplier/origin, yield, pretreatment, freezing technology, package, refrigerant, energy source, cold-store duration, site, regulation, or evidence that materially changes the normalized inventory"
