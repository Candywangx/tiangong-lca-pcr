      collection_method: "Reconcile chemical-specific facility mass balance and document allocation to included equipment"
      unit: "kg by chemical"
      frequency: "Every service event and annual reconciliation"
      temporal_coverage: "Same period as production data with opening and closing stock"
      site_scope: "All freezing and cold-storage equipment serving represented output"
      aggregation_rule: "Calculate facility emission before product allocation; prohibit negative emissions without corrected records"
      quality_evidence: "Service invoices, cylinder weights, technician log, equipment register, and balance review"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory quantity"
      rule: "normalized quantity = included-period quantity / net conforming dispatched product mass × 1,000 kg"
      inputs:
        - "included quantity"
        - "net dispatched product mass"
      output: "Quantity per 1,000 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_material_reconciliation
      applies_to: "Preparation and finished-product mass"
      rule: "accepted input + water/additions incorporated + opening work-in-process = net product + rejects + wastewater solids + closing work-in-process + measured/estimated moisture change; disclose the unreconciled balance"
      inputs:
        - "Weighed inputs"
        - outputs
        - stocks
        - "retained water"
        - "and moisture change"
      output: "Yield, reject fraction, and balance gap"
      source_ids:
        - mass-balance-identity
    - id: calc_thermal_energy
      applies_to: "Fuel- or steam-based pretreatment"
      rule: "Convert the collected carrier quantity using documented heating value or enthalpy and measured efficiency; retain the original carrier record"
      inputs:
        - "Fuel/steam quantity"
        - "heating value or enthalpy"
        - efficiency
      output: "Delivered thermal energy in MJ"
      source_ids:
        - mass-balance-identity
    - id: calc_refrigerant_mass_balance
      applies_to: "Refrigerant emission to air"
      rule: "Calculate emissions by chemical from purchases/additions and opening/closing material and equipment stocks, subtracting documented recovery and transfers; calculate at facility level before causal allocation to included equipment"
      inputs:
        - "Opening/closing stocks"
        - purchases
        - additions
        - recoveries
        - transfers
        - "equipment charge change"
        - "allocation driver"
      output: "kg emitted by refrigerant chemical per reference product"
      source_ids:
        - ipcc-2006-v3-ch7
    - id: calc_shared_cold_load
      applies_to: "Shared freezing or storage systems"
      rule: "Prefer submetering; otherwise allocate measured electricity and calculated refrigerant emissions using validated thermal load or tonne-hours that include product mass, temperature pull-down, and storage duration"
      inputs:
        - "Metered utilities"
        - "product mass"
        - "inlet/outlet temperature"
        - "storage tonne-hours"
        - "equipment scope"
      output: "Product-attributable freezing/storage inventory"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Declare actual vegetable/pulse, cultivar/type, mix shares, incoming condition, preparation, blanching, freezing format, glazing/additives, package, and geography."
