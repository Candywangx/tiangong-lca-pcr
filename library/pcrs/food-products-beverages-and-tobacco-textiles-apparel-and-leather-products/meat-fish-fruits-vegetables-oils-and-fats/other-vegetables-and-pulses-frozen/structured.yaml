allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Separate products, lines, batches, or meters"
    rule: "First use subdivision, separate batch records, and submetering so burdens follow the product that caused them."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_internal_transfer
    applies_to: "Prepared-product internal flow"
    rule: "Do not allocate or add upstream burdens to the internal transfer between the two foreground processes; require input and output masses to match."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_multiple_saleable_products
    applies_to: "Joint production that cannot be subdivided"
    rule: "Use a documented physical relationship only when it reflects causality; otherwise use economic allocation and report prices, period, shares, and a sensitivity result."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rejects_and_recovery
    applies_to: "Rejects, by-products, recycling, energy recovery, or disposal"
    rule: "Keep quantities and destinations visible; disclose any credit, substitution, cut-off, or burden assignment and do not treat waste as burden-free by default."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_shared_refrigeration
    applies_to: "Shared freezer and cold-store utilities"
    rule: "Prefer submetering; otherwise allocate electricity and chemical-specific refrigerant emissions using a documented causal basis such as validated thermal load or tonne-hours, and disclose the sensitivity."
    source_ids:
      - ipcc-2006-v3-ch7
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "preparation_and_pretreatment_quick_freezing_packaging_storage"
      flow_role: "Incoming material, internal transfer, net product, and rejects"
      record_type: "Weighbridge, scale, batch, and disposition records"
      raw_fields: "product/type; supplier; batch; gross/tare/net mass; moisture/drained basis; reject type; destination; timestamp"
      collection_method: "Calibrated weighing at receipt, transfer, packing, and reject dispatch"
      unit: "kg"
      frequency: "Each batch or shift"
      temporal_coverage: "All represented campaigns, normally 12 consecutive months or a justified full season"
      site_scope: "All included lines and sites"
      aggregation_rule: "Sum by product and batch, reconcile inputs, outputs, stock change, moisture gain/loss, and sampling"
      quality_evidence: "Scale calibration, batch traceability, stock reconciliation, and exception log"
    - protocol_id: cp_utility_records
      process_id: "preparation_and_pretreatment"
      flow_role: "Water, electricity, steam, fuel, and heat"
      record_type: "Meter, invoice, equipment runtime, and carrier-property records"
      raw_fields: "meter start/end; invoice amount; runtime; power; fuel mass/volume; heating value; efficiency; batch association"
      collection_method: "Submetering preferred; otherwise documented engineering allocation"
      unit: "kg; kWh; MJ"
      frequency: "Meter interval and each production campaign"
      temporal_coverage: "Same period as production data"
      site_scope: "All included equipment and utilities"
      aggregation_rule: "Deduct unrelated loads and normalize to net dispatched product"
      quality_evidence: "Meter calibration, invoices, runtime logs, conversion source, and allocation worksheet"
    - protocol_id: cp_water_discharge_records
      process_id: "preparation_and_pretreatment"
      flow_role: "Wastewater and retained/evaporated water"
      record_type: "Discharge meter, treatment log, and water-balance record"
      raw_fields: "withdrawal; discharge; recirculation; product retention; evaporation; sludge; destination"
      collection_method: "Meter discharge or calculate a documented water balance"
      unit: "kg"
      frequency: "Daily or campaign"
      temporal_coverage: "Same period as production data"
      site_scope: "All included discharge points"
      aggregation_rule: "Reconcile withdrawal with discharge, recirculation, retention, evaporation, and removed solids"
      quality_evidence: "Meter checks, treatment receipts, sampling records, and balance exception log"
    - protocol_id: cp_freezing_storage_records
      process_id: "quick_freezing_packaging_storage"
      flow_role: "Freezing energy, storage energy, duration, and temperature"
      record_type: "Submeter, freezer log, cold-room log, and calibrated sensor record"
      raw_fields: "kWh; batch; freezer type; product inlet/thermal-centre/air temperature; storage entry/exit; defrost; door events"
      collection_method: "Continuous or interval logging linked to batches and storage inventory"
      unit: "kWh; °C; hour or day"
      frequency: "Continuous temperature; each meter interval"
      temporal_coverage: "All represented production and storage periods"
      site_scope: "All included freezing and cold-storage equipment"
      aggregation_rule: "Separate freezing and storage where possible; allocate shared loads by validated causal basis"
      quality_evidence: "Meter and sensor calibration, missing-data log, temperature excursions, and corrective actions"
    - protocol_id: cp_packaging_records
      process_id: "quick_freezing_packaging_storage"
