system_boundary:
  rules:
    - rule_id: boundary_foreground_operations
      applies_to: "Factory foreground"
      rule: "Include receiving, sorting, cleaning, trimming/cutting, conditional blanching and cooling, quick freezing, packaging, and frozen storage through factory dispatch when performed for the declared product."
      source_ids:
        - codex-cxp-8-1976
    - rule_id: boundary_upstream_links
      applies_to: "Purchased inputs"
      rule: "Link cultivation, inbound transport, water supply, electricity, fuels or steam, packaging, refrigerant manufacture, and waste treatment to geographically and technologically appropriate upstream datasets."
      source_ids:
        - codex-cxp-8-1976
    - rule_id: boundary_downstream_exclusion
      applies_to: "Factory-gate result"
      rule: "Exclude distribution after dispatch, retail storage, consumer thawing/cooking, and package end-of-life unless the study explicitly expands the boundary and reports them separately."
      source_ids: []
    - rule_id: boundary_cold_chain
      applies_to: "Frozen product"
      rule: "Include the actual on-site freezing and frozen-storage energy, refrigerant losses, and temperature-control records; the quick-freezing step ends only after the declared thermal centre reaches the required frozen condition."
      source_ids:
        - codex-cxp-8-1976
        - eu-directive-89-108-eec
    - rule_id: boundary_recursive_input
      applies_to: "Purchased frozen vegetables or pulses"
