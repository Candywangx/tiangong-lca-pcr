    - id: dq_refrigerant_completeness
      applies_to: "Refrigeration"
      requirement: "Report chemical-specific mass balance and equipment scope; do not infer zero leakage solely from a missing service record."
      evidence: "Service ledger, cylinder weights, equipment register, recovery records, and mass-balance review"
    - id: dq_provisional_ranges
      applies_to: "All reasoned estimates"
      requirement: "Treat every reasoned_estimate range as a replaceable screening value, never as a product recipe or publication-critical allowed value."
