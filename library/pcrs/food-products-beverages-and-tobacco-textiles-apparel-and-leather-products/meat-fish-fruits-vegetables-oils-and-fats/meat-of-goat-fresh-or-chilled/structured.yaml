      source_ids:
        - ec-pef-method-2021
    - rule_id: boundary_downstream_exclusion
      applies_to: "downstream life cycle"
      rule: "Exclude distribution, retail, cooking, consumption and end-of-life unless a study explicitly adds those stages outside this factory-gate PCR."
      source_ids:
        - ec-pef-method-2021
    - rule_id: boundary_actual_route
      applies_to: "conditional operations"
      rule: "Include on-site refrigeration, direct combustion and wastewater treatment only when present, and disclose absent or externally supplied operations without netting their exchanges into another process."
      source_ids:
        - jrc-sa-bref-2024
