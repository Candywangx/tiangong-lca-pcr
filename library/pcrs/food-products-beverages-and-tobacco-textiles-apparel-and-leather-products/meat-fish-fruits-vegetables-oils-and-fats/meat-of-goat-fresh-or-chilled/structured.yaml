allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "all foreground operations"
    rule: "First subdivide reception/slaughter, dressing, cutting, chilling, sanitation, wastewater treatment and packaging and directly measure product-specific exchanges before allocation."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_saleable_outputs
    applies_to: "meat and saleable blood, liver, heart, hide, fat or bones"
    rule: "Apply a documented physical causal relationship where it represents how burdens arise; when no physical relationship is defensible, apply the PEF allocation hierarchy and disclose any economic allocation period, prices, currency and sensitivity."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_waste_outputs
    applies_to: "condemned tissue, gut contents, manure, wastewater, sludge and packaging waste"
    rule: "Assign production burdens to the operation that generated the waste and model the actual receiving treatment; do not create an avoided-product credit without an explicitly justified downstream method."
    source_ids:
      - ec-pef-method-2021
      - jrc-sa-bref-2024
  - rule_id: allocation_shared_utilities
    applies_to: "shared electricity, water and heat meters"
    rule: "Allocate each measured utility separately using a causal driver such as operating time multiplied by measured power, water demand or heat demand; retain meter total, numerator, denominator and reconciliation."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_packaging
    applies_to: "grouped cartons"
    rule: "Assign a measured empty carton mass to products using contained net product mass for the same packing configuration and period."
    source_ids:
      - ec-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_reception_slaughter
      process_id: "animal_reception_slaughter"
      flow_role: "live goat, water, electricity, carcass, blood, manure, condemnation and wastewater"
      record_type: "livestock reception; calibrated scales; meters; slaughter and waste logs"
      raw_fields: "lot; origin; head count; live mass; accepted mass; meter readings; carcass mass; blood mass; manure mass; condemned mass; wastewater volume; destinations"
      collection_method: "Link all readings and outputs to the same accepted slaughter lot"
      unit: "kg; m3; kWh"
      frequency: "Per lot or shift, aggregated monthly"
      temporal_coverage: "Representative production period, normally 12 months or complete campaign"
      site_scope: "All reception, lairage and slaughter operations and subcontractors"
      aggregation_rule: "Sum homogeneous lots, reconcile mass and normalize by bled-carcass output"
      quality_evidence: "Scale and meter calibration; veterinary acceptance; lot reconciliation; transfer receipts"
    - protocol_id: cp_carcass_dressing
      process_id: "carcass_dressing_byproduct_recovery"
      flow_role: "carcass, water, electricity, dressed carcass, liver, heart, hide, gut contents, condemned viscera and wastewater"
      record_type: "rail scales; organ and hide scales; meters; inspection and transfer logs"
      raw_fields: "lot; input carcass mass; water; electricity; dressed mass; each output mass; wastewater; acceptance status; destination"
      collection_method: "Weigh each separated output and rejected stream for the same dressing lot"
      unit: "kg; m3; kWh"
      frequency: "Per lot or shift, aggregated monthly"
      temporal_coverage: "Representative production period"
      site_scope: "All dressing and inspection lines"
      aggregation_rule: "Sum by product specification and divide by dressed-carcass output"
      quality_evidence: "Calibration; inspection record; output destination; process mass balance"
    - protocol_id: cp_cutting_deboning
      process_id: "cutting_deboning"
      flow_role: "carcass, water, electricity, meat, bones, fat, condemned trimmings and wastewater"
      record_type: "batch scale; cutting records; meters; waste and co-product logs"
      raw_fields: "product code; bone state; input mass; water; electricity; meat mass; bone mass; fat mass; condemned mass; wastewater"
      collection_method: "Reconcile every cutting lot from dressed carcass through accepted meat and each separated output"
      unit: "kg; m3; kWh"
      frequency: "Per batch, aggregated monthly"
      temporal_coverage: "Representative production period"
      site_scope: "All cutting and deboning lines and subcontractors"
      aggregation_rule: "Aggregate only identical cut and bone specifications and normalize to accepted meat"
      quality_evidence: "Calibration; cut specification; yield reconciliation; destination receipts"
    - protocol_id: cp_chilling_storage
      process_id: "chilling_cold_storage"
      flow_role: "meat, electricity, defrost water, ammonia make-up, chilled meat, wastewater and ammonia release"
      record_type: "scales; temperature logger; refrigeration meter; water meter; refrigerant inventory and maintenance log"
      raw_fields: "lot; input/output mass; entry/exit temperature; time; electricity; water; ammonia opening stock, additions, recovery and closing stock; wastewater"
      collection_method: "Link mass, temperature, residence time and utility records to each chilling campaign"
      unit: "kg; °C; h; kWh; m3"
      frequency: "Continuous temperature, per batch mass, monthly utilities"
      temporal_coverage: "Representative production period covering seasonal operation"
      site_scope: "All chillers, cold rooms and refrigeration circuits"
      aggregation_rule: "Allocate refrigeration by measured load or documented causal driver and normalize to accepted meat"
      quality_evidence: "Calibrated logger and meters; refrigerant reconciliation; maintenance reports"
    - protocol_id: cp_cleaning_sanitation
      process_id: "cleaning_sanitation"
      flow_role: "water, electricity, steam, hot water, each fuel, each formulation, wastewater and combustion emissions"
      record_type: "sanitation schedule; utility meters; fuel invoices; chemical issue; effluent and stack records"
      raw_fields: "area/equipment; time; water; electricity; steam; hot water; natural gas; diesel; LPG; formulation mass and active content; wastewater; factor or measurement"
      collection_method: "Record every supplied carrier, fuel and formulation independently for the sanitation event"
      unit: "m3; kWh; MJ; kg"
      frequency: "Per sanitation event or shift, aggregated monthly"
      temporal_coverage: "Representative production period"
      site_scope: "All in-scope cleaning systems and heat equipment"
      aggregation_rule: "Allocate shared records with documented causal drivers and calculate each emission from its own fuel"
      quality_evidence: "Meter calibration; invoices; SDS; concentration; factor citation; stack result; reconciliation"
    - protocol_id: cp_onsite_wastewater
      process_id: "onsite_wastewater_treatment"
      flow_role: "equalized wastewater, sludge, COD, nitrogen, phosphorus and methane"
      record_type: "inlet/outlet flow meters; laboratory results; sludge scales; gas monitoring"
      raw_fields: "date; inlet and discharge volume; sample time; COD; total nitrogen; total phosphorus concentrations; sludge mass and moisture; methane measurement or model fields"
      collection_method: "Match representative samples to measured flows and calculate each discharge separately"
      unit: "m3; mg/L; kg"
      frequency: "Flow continuous or daily; sampling per permit and operating plan"
      temporal_coverage: "Representative production period"
      site_scope: "Complete on-site treatment boundary"
      aggregation_rule: "Sum mass loads by period and assign them to production using measured wastewater volumes"
      quality_evidence: "Laboratory accreditation; sampling plan; flow-meter calibration; sludge receipts; calculation file"
    - protocol_id: cp_packaging_dispatch
      process_id: "packaging_dispatch"
      flow_role: "meat, each package component, electricity, reference output and each package waste"
      record_type: "product scale; packaging specification; component counts and tare weights; meter; waste logs"
      raw_fields: "lot; cut; bone state; temperature; net meat mass; package counts; empty unit masses; carton contents; electricity; each waste mass"
      collection_method: "Reconcile meat and each package component for every packing configuration"
      unit: "kg; item; kWh; °C"
      frequency: "Per packing lot, aggregated monthly"
      temporal_coverage: "Representative production period"
      site_scope: "All packing and dispatch lines"
      aggregation_rule: "Convert component counts to mass, allocate cartons by contained net meat mass and normalize to 1 kg net meat"
      quality_evidence: "Scale calibration; package specification; packing list; meter identity; waste receipts"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period exchange amount / accepted net fresh-or-chilled goat-meat mass"
      inputs:
        - "period exchange amount"
        - "accepted reference-product mass"
      output: "exchange amount per 1 kg reference product"
      source_ids:
        - ec-pef-method-2021
    - id: calc_stage_mass_balance
      applies_to: "reception/slaughter, dressing and cutting"
      rule: "residual = measured mass inputs - accepted main output - each measured co-product - each measured waste - documented evaporation or retained water"
      inputs:
        - "all stage-specific mass records"
      output: "disclosed residual for each stage"
      source_ids:
        - jrc-sa-bref-2024
    - id: calc_refrigerant_loss
      applies_to: "ammonia refrigeration circuit"
      rule: "ammonia loss = opening inventory + additions - recovered quantity - closing inventory - documented transfer"
      inputs:
        - "refrigerant inventory and maintenance records"
      output: "kg ammonia released, subject to reconciliation and release-route evidence"
      source_ids:
        - ec-pef-method-2021
    - id: calc_effluent_load
      applies_to: "each wastewater emission"
      rule: "discharged mass = matched concentration × discharged effluent volume with documented unit conversion"
      inputs:
        - concentration
        - volume
        - "sampling representativeness"
      output: "kg of one specified water emission"
      source_ids:
        - jrc-sa-bref-2024
    - id: calc_combustion_emission
      applies_to: "each direct fuel emission"
      rule: "emission mass = recorded quantity of one fuel × one disclosed applicable factor, unless direct measurement is used"
      inputs:
        - "fuel quantity and properties"
        - "factor or measurement"
      output: "kg of one specified air emission"
      source_ids:
        - ec-pef-method-2021
    - id: calc_packaging_mass
      applies_to: "each packaging component"
      rule: "used mass = issued count × measured empty unit mass - returned unused mass; grouped carton mass is assigned by contained net product mass"
      inputs:
        - "issue/return counts"
        - "tare mass"
        - "contained net meat mass"
      output: "kg of one packaging component per kg product"
      source_ids:
        - ec-pef-method-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Demonstrate goat species, CPC 21116 fresh-or-chilled state, cut/carcass description, bone state, acceptance specification and dispatch temperature."
      evidence: "Product specification; lot record; temperature log; classification review"
    - id: dq_lot_traceability
      applies_to: "slaughter and meat outputs"
      requirement: "Preserve traceability from accepted live-goat population through carcass, cuts and dispatched product for the declared period."
      evidence: "Reception, veterinary, slaughter, cutting and dispatch records"
    - id: dq_mass_completeness
      applies_to: "mass balance"
      requirement: "Measure the main product and every actual blood, organ, hide, fat, bone, condemned tissue, gut-content, manure and sludge output separately; disclose unresolved residuals."
      evidence: "Calibrated weights; stage reconciliations; destination records"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Use a representative period, normally 12 consecutive months or the complete production campaign, and explain seasonal or abnormal operation."
      evidence: "Dated production, meter, purchase, maintenance and waste records"
    - id: dq_measurement
      applies_to: "foreground exchanges"
      requirement: "Identify instrument, calibration, frequency, meter boundary and allocation calculation for every material, water, utility, output, waste and emission record."
      evidence: "Calibration certificates; meter register; calculation workpapers"
    - id: dq_temperature
      applies_to: "fresh-or-chilled state"
      requirement: "Retain continuous or lot-representative temperature and time records demonstrating that the declared output was not frozen."
      evidence: "Calibrated temperature logger; cold-room and dispatch records"
    - id: dq_chemical_identity
      applies_to: "cleaning and disinfection"
      requirement: "Retain formulation name, supplier, SDS, active concentration and issued mass for every actual cleaning or disinfecting formulation."
      evidence: "SDS; supplier specification; chemical issue records"
    - id: dq_waste_destination
      applies_to: "each waste output"
      requirement: "Retain mass, classification and receiving-treatment evidence for each waste; do not infer recycling or recovery from sale alone."
      evidence: "Transfer note; invoice; treatment declaration"
    - id: dq_representativeness
      applies_to: "upstream datasets"
      requirement: "Document geographic, temporal and technological match for live goats, incoming transport, utilities, refrigerant, chemicals, packaging and external treatment."
      evidence: "Dataset metadata and PEF data-quality assessment"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The reference UUID must equal 20b4b0eb-d827-48d9-b744-d54842ba57ef, resolve as a public state-100 Product flow classified to CPC 21116, and use Mass 93a60a56-a3c8-11da-a746-0800200b9a66 with kg from Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66."
    source_ids:
      - un-cpc-3-0-21116
  - rule_id: validate_reference_amount
    applies_to: "reference flow"
    rule: "Output must normalize to exactly 1 kg net accepted goat meat, exclude packaging and separated outputs, and retain the measured unnormalized mass."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_scope_state
    applies_to: "product identity"
    rule: "Product must be goat meat dispatched fresh or chilled; frozen meat, edible offal, prepared meat and separately recovered outputs cannot be included in the reference mass."
    source_ids:
      - un-cpc-3-0-21116
  - rule_id: validate_actual_route
    applies_to: "process inventory"
    rule: "Reception/slaughter, dressing, cutting, temperature control, sanitation and packaging must be represented; on-site fuel combustion, refrigeration and wastewater treatment must be included whenever present."
    source_ids:
      - jrc-sa-bref-2024
  - rule_id: validate_atomic_rows
    applies_to: "process inventory"
    rule: "Every card must represent one concrete exchange; each utility, fuel, refrigerant, formulation, packaging component, by-product, waste and elementary emission must remain separate."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_uuid_evidence
    applies_to: "UUID-bearing rows"
    rule: "Store a Tiangong UUID only when both required lookup cores agree on identity, Product type, CPC where applicable and Mass support; otherwise leave it absent and retain a manifest review item."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "foreground processes"
    rule: "Reconcile live mass through carcass, meat, every separated co-product and every waste for each stage; unexplained netting or hidden yield factors are nonconformant."
    source_ids:
      - jrc-sa-bref-2024
  - rule_id: validate_temperature
    applies_to: "product state"
    rule: "Retain calibrated time-temperature evidence demonstrating fresh-or-chilled, not frozen, status at dispatch."
    source_ids:
      - un-cpc-3-0-21116
      - jrc-sa-bref-2024
  - rule_id: validate_utility_separation
    applies_to: "utilities and fuels"
    rule: "Electricity, steam, hot water, natural gas, diesel and LPG must not be pooled; shared records require meter boundary, period, driver, numerator and denominator."
    source_ids:
      - ec-pef-method-2021
      - jrc-sa-bref-2024
  - rule_id: validate_byproduct_separation
    applies_to: "separated outputs"
    rule: "Every actual edible or non-edible output must have its own measured row, declared destination and disclosed allocation treatment."
    source_ids:
      - jrc-sa-bref-2024
      - ec-pef-method-2021
  - rule_id: validate_wastewater_emissions
    applies_to: "on-site wastewater treatment"
    rule: "Report wastewater volume, sludge and each monitored emission separately; do not use an aggregate wastewater-pollutants exchange."
    source_ids:
      - jrc-sa-bref-2024
published_dataset_profile:
  dataset_role: "secondary_dataset; eligible for background_dataset use after methodology and data review"
  downstream_use: "Foreground process and lifecyclemodel construction for slaughterhouse-gate production of CPC 21116 goat meat"
  allowed_use: "Product-specific fresh-or-chilled goat-meat studies matching species, cut/carcass form, bone state, slaughter and cutting route, temperature regime, facility geography, period, wastewater route and packaging"
  excluded_use: "Frozen meat; edible offal; prepared meat; live-goat production; mismatched species or route; retail, cooking or consumption claims not separately modelled; comparative assertions without an applicable reviewed method"
  required_metadata: "canonical PCR id; reference UUID; CPC reference; species; origin; product form; bone state; lot; net meat mass; temperature and time; facility and period; animal count and live mass; process route; subcontractors; allocation; packaging; wastewater route; co-product and waste destinations; source ids"
  required_quality_disclosure: "primary-data coverage; scale and meter calibration; lot traceability; stage mass-balance residuals; temperature evidence; utility allocation; refrigerant reconciliation; chemical identity; wastewater sampling; emission calculation; upstream dataset representativeness; uncertainty and verification status"
  update_trigger: "Change in CPC scope, reference UUID, product state, species, cut or bone state, slaughter or cutting technology, refrigeration, sanitation chemistry, facility or supplier geography, wastewater treatment, allocation, packaging or applicable PEF/BREF guidance"
