system_boundary:
  rules:
    - rule_id: boundary_foreground_gate
      applies_to: "foreground operations"
      rule: "Begin at live-goat acceptance at the slaughterhouse and end with accepted fresh-or-chilled goat meat packaged for dispatch; include all in-house and subcontracted slaughter, dressing, cutting, chilling, sanitation, relevant wastewater management and packaging operations."
