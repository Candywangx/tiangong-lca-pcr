system_boundary:
  rules:
    - rule_id: boundary_required_operations
      applies_to: "foreground manufacturing"
      rule: "Include all applicable receipt, sorting, washing, conditional soaking, blanching or conditioning, packing-medium preparation, filling, exhausting, hermetic closure, scheduled thermal processing, cooling, drying, final packing, release, product loss, cleaning, wastewater, and residue handling that occur under the facility's operational control."
