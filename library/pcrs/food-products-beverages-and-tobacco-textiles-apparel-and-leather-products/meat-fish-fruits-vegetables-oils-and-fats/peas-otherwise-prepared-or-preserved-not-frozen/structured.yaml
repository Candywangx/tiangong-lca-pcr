measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all inventory amounts to 1,000 kg declared net contents at plant gate. Net contents include peas and packing medium and exclude every packaging layer. Record the campaign output mass used as the denominator."
  - id: drained_mass_separation
    applies_to: "peas and packing medium"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg and kg/kg net contents"
    rule: "Measure or test drained pea mass separately from packing-medium mass using the applicable product specification and sampling convention. Do not substitute net contents for drained mass when checking pea content; retain size or grade qualifiers that change the applicable minimum. Source: codex-cxs-297-2009-2023."
  - id: packaging_mass_separation
    applies_to: "primary, secondary, and tertiary packaging"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record each packaging material as a separate product input normalized to the reference flow; packaging mass must not be included in the 1,000 kg net-contents reference amount."
  - id: utility_measurement
    applies_to: "process water, electricity, fuels, steam, and heat"
    required_property_ref:
      name: "metered mass, volume, or energy property appropriate to the utility"
      uuid: ""
    required_unit: "kg or m3; kWh; MJ"
    rule: "Preserve metered units and conversion factors, distinguish purchased utilities from on-site generation, and allocate shared meters only through a documented physical driver. Record water, energy, raw materials, wastewater, and residues at the most appropriate process level. Source: eu-bat-fdm-2019-2031."
  - id: thermal_process_record
    applies_to: "filling, sealing, retorting, and cooling"
    required_property_ref:
      name: "temperature, time, pressure, pH where applicable, fill mass, headspace, and container dimensions"
      uuid: ""
    required_unit: "°C; min or s; kPa or bar; pH; kg; mm"
    rule: "Retain the qualified scheduled-process identifier and its critical factors. Use actual campaign records for initial temperature, process time and temperature, pressure where required, fill and headspace, container configuration, and cooling; never infer commercial sterility from a generic PCR default. Source: codex-cxc-23-1979."
