allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "multi-output and shared foreground operations"
    rule: "First avoid allocation by subdividing process records, meters, batches, and waste streams so that inputs and emissions directly attributable to the pea product are assigned to it. System expansion may be used only when the study explicitly represents the added function and reports the expanded result."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_driver
    applies_to: "shared utilities and services that cannot be subdivided"
    rule: "When subdivision is not practicable, allocate shared water, heat, electricity, cleaning, compressed air, and treatment services using the most relevant measured physical relationship, such as product mass, metered energy, operating time, water load, or pollutant load. Document the driver, period, denominator, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
      - eu-bat-fdm-2019-2031
  - rule_id: residue_classification
    applies_to: "pea residues, rejected product, wastewater sludge, and recovered materials"
    rule: "Classify each output by actual destination and legal/economic status. An output with no product function is a waste flow and receives treatment burdens; a sold or internally used output with a documented function is a co-product and must not be silently credited or netted from input mass."
    source_ids:
      - eu-pef-2021-2279
      - eu-bat-fdm-2019-2031
  - rule_id: no_default_avoided_burden
    applies_to: "recycling, feed use, energy recovery, and other recovery routes"
    rule: "Do not apply an avoided-burden credit by default. If a lifecycle study applies substitution or another end-of-life method, keep it outside the gate-to-gate inventory unless the expanded function is explicitly in scope, and disclose the substituted product, factor, quality relationship, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_batch_records
      process_id: "pea_receiving_preparation"
      flow_role: "peas and intermediate product mass"
      record_type: "receiving tickets, calibrated scale records, batch sheets"
      raw_fields: "lot_id; pea_route; gross_mass; tare_mass; accepted_mass; reject_mass; transfer_mass; timestamp"
      collection_method: "reconcile receiving and transfer scales to batch identifiers"
      unit: "kg"
      frequency: "every lot and batch"
      temporal_coverage: "all campaigns in representative period"
      site_scope: "all lines and receiving points serving represented product"
      aggregation_rule: "sum accepted and transferred mass by campaign; retain route-specific totals before normalization"
      quality_evidence: "calibration status; ticket and batch-sheet cross-reference; reject reconciliation"
    - protocol_id: cp_process_water_records
      process_id: "thermal_processing_cooling"
      flow_role: "preparation, soaking, blanching, cleaning, and cooling water"
      record_type: "flow meters, tank level records, reuse and blowdown logs"
      raw_fields: "process_id; meter_id; opening_reading; closing_reading; make_up; recirculation; discharge; timestamp"
      collection_method: "meter net withdrawals and discharges; use tank balance only where metering is absent"
      unit: "kg or m3"
      frequency: "each campaign or shift"
      temporal_coverage: "representative operating period including cleaning"
      site_scope: "every material water-using process and shared system"
      aggregation_rule: "calculate gross use, net make-up, reuse, and discharge separately; allocate shared water by documented physical driver"
      quality_evidence: "meter calibration; water-balance closure; reuse-loop diagram"
    - protocol_id: cp_energy_utility_records
      process_id: "thermal_processing_cooling"
      flow_role: "heat, electricity, steam, fuels, and treatment utilities"
      record_type: "submeters, utility invoices, steam and fuel meters, equipment runtime records"
      raw_fields: "utility_type; meter_id; quantity; unit; pressure_or_calorific_value; equipment_id; runtime; process_id; timestamp"
      collection_method: "direct submetering preferred; otherwise calculate from measured service quantity and documented conversion"
      unit: "kWh; MJ; kg steam; kg or m3 fuel"
      frequency: "each batch, shift, or billing interval with allocation to campaigns"
      temporal_coverage: "representative operating period"
      site_scope: "all utility systems serving represented processes"
      aggregation_rule: "convert without discarding original units; subtract exported or recovered energy only when separately metered"
      quality_evidence: "meter calibration; invoice reconciliation; conversion-factor provenance; allocation sensitivity"
    - protocol_id: cp_fill_closure_records
      process_id: "filling_closure"
      flow_role: "formulation, fill, headspace, vacuum, and closure integrity"
      record_type: "recipe issues, filler checks, seam or seal inspection, checkweigher records"
      raw_fields: "lot_id; recipe_id; ingredient_mass; pea_fill_mass; medium_mass; net_contents; drained_mass; headspace; vacuum_or_air_content; container_id; closure_result"
      collection_method: "collect formulation and fill-control records and link each lot to closure inspections"
      unit: "kg; mm; kPa or bar as applicable"
      frequency: "every formulation batch and at the scheduled inspection frequency"
      temporal_coverage: "all represented production lots"
      site_scope: "all filling and closure lines serving the represented product"
      aggregation_rule: "aggregate accepted fills only; retain rejected fills and closure defects separately"
      quality_evidence: "calibrated scales; inspection frequency; corrective-action record; traceable lot code"
    - protocol_id: cp_packaging_records
      process_id: "final_packing_release"
      flow_role: "primary, secondary, and tertiary packaging"
      record_type: "material issue and return records, packaging specifications, rejection logs"
      raw_fields: "material_id; material_type; unit_mass; issued_count; accepted_count; reject_count; return_count; recycled_content_claim"
      collection_method: "reconcile issued packaging to accepted, rejected, returned, and inventory-change quantities"
      unit: "kg and count"
      frequency: "every campaign"
      temporal_coverage: "all represented packaging formats"
      site_scope: "all packaging lines and material issue points serving the represented product"
      aggregation_rule: "calculate mass by material per released net-content mass; do not include packaging in reference product mass"
      quality_evidence: "supplier specification; unit-mass verification; stock reconciliation"
    - protocol_id: cp_thermal_process_records
      process_id: "thermal_processing_cooling"
      flow_role: "scheduled process and cooling"
      record_type: "retort charts or electronic records, scheduled-process specification, cooling-water records"
      raw_fields: "schedule_id; product_code; container_type; container_dimensions; fill_mass; headspace; initial_temperature; process_temperature; process_time; pressure; pH_if_applicable; cooling_method; cooling_endpoint; deviation_id"
      collection_method: "retain complete batch or continuous-run records and qualified schedule linkage"
      unit: "°C; min or s; kPa or bar; pH; kg; mm"
      frequency: "every thermal-process run"
      temporal_coverage: "every represented lot"
      site_scope: "all thermal-processing systems and container formats serving the represented product"
      aggregation_rule: "no averaging across non-equivalent schedules; aggregate only after confirming schedule conformity"
      quality_evidence: "instrument calibration; qualified-process authorization; deviation disposition; lot traceability"
    - protocol_id: cp_residue_wastewater_records
      process_id: "onsite_wastewater_treatment"
      flow_role: "rejects, residues, wastewater, sludge, and destinations"
      record_type: "weighbridge records, bins, flow meters, waste manifests, laboratory records"
      raw_fields: "source_process; stream_id; mass_or_volume; dry_matter_if_relevant; pH; COD_or_TOC_if_available; destination; treatment_route; timestamp"
      collection_method: "measure each major stream and retain destination evidence; calculate unmetered wastewater only through a closed water balance"
      unit: "kg or m3; supporting concentration units"
      frequency: "each batch, shift, or dispatch as appropriate"
      temporal_coverage: "representative operating period"
      site_scope: "all source processes, collection points, and on-site treatment units"
      aggregation_rule: "keep streams and destinations separate; aggregate after normalization to reference flow"
      quality_evidence: "manifest or invoice; meter calibration; laboratory method; water- and mass-balance closure"
    - protocol_id: cp_finished_product_records
      process_id: "final_packing_release"
      flow_role: "conforming released product"
      record_type: "finished-goods ledger, release certificate, checkweigher and inventory records"
      raw_fields: "lot_id; net_contents; drained_mass; accepted_count; rejected_count; release_mass; release_date; qualifier_set"
      collection_method: "reconcile released net contents to accepted production and inventory change"
      unit: "kg"
      frequency: "every lot"
      temporal_coverage: "all campaigns in representative period"
      site_scope: "all final inspection and finished-goods release points serving the represented product"
      aggregation_rule: "sum conforming released net contents; normalize inventory to 1,000 kg"
      quality_evidence: "release authorization; scale calibration; lot and formulation traceability"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = campaign-attributable amount / released net-content mass × 1,000 kg"
      inputs:
        - "collected row quantity"
        - "released campaign net-content mass"
      output: "amount per 1,000 kg reference product net contents"
      source_ids: []
    - id: calc_drained_fraction
      applies_to: "pea content and packing medium"
      rule: "drained fraction = tested drained pea mass / tested net contents; retain the applicable size, grade, method, and sampling result"
      inputs:
        - "drained pea mass"
        - "net contents"
        - "pea route and size or grade"
      output: "kg drained peas/kg net contents and lot conformity result"
      source_ids:
        - codex-cxs-297-2009-2023
    - id: calc_material_balance
      applies_to: "each preparation, filling, cooling, and release step"
      rule: "inputs + opening work-in-process = products + wastes + wastewater-carried solids where measured + closing work-in-process + documented balance difference"
      inputs:
        - "measured input"
        - output
        - reject
        - residue
        - spill
        - "and inventory-change masses"
      output: "balance difference and percentage closure by process"
      source_ids:
        - eu-bat-fdm-2019-2031
    - id: calc_utility_conversion
      applies_to: "steam, fuels, electricity, and heat"
      rule: "convert measured service quantities using source-specific pressure/enthalpy, calorific value, or unit conversion; retain raw quantity and factor"
      inputs:
        - "meter reading"
        - "utility specification"
        - "conversion factor"
      output: "kWh or MJ per reference flow with factor provenance"
      source_ids:
        - eu-bat-fdm-2019-2031
    - id: calc_shared_resource_allocation
      applies_to: "shared utilities and treatment"
      rule: "attributable quantity = total shared quantity × documented physical driver for represented product / sum of the same driver for all users"
      inputs:
        - "shared meter total"
        - "selected physical driver by product"
        - "denominator population"
      output: "allocated water, energy, cleaning, or treatment quantity plus sensitivity"
      source_ids:
        - eu-pef-2021-2279
        - eu-bat-fdm-2019-2031
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "reference product and all product lots"
      requirement: "Every inventory campaign must link received pea lots, formulation, container specification, scheduled-process record, accepted finished lot, and the reference product qualifiers."
      evidence: "receiving tickets; recipe and packaging specification; lot code; release record; scheduled-process identifier"
    - id: dq_measurement_control
      applies_to: "mass, water, energy, time, temperature, pressure, and pH records"
      requirement: "Use calibrated or verified instruments appropriate to the measurement. Retain raw readings, units, conversion factors, missing-data substitutions, and calibration status."
      evidence: "calibration certificates; meter logs; laboratory methods; conversion-factor records"
    - id: dq_temporal_representativeness
      applies_to: "foreground activity data"
      requirement: "Cover a representative production period including start-up, normal operation, cleaning, and product changeover where attributable. Explain seasonal pea campaigns, downtime, and excluded abnormal events."
      evidence: "campaign schedule; production ledger; operating and cleaning logs"
    - id: dq_completeness_balance
      applies_to: "raw materials, product, packaging, water, energy, residues, and wastewater"
      requirement: "Reconcile material and water balances at process or campaign level and investigate material differences. No important stream may be silently assigned zero because a meter is shared or absent."
      evidence: "material balance; water balance; unresolved-gap register; BAT-aligned resource inventory"
    - id: dq_thermal_conformity
      applies_to: "every released thermal-process lot"
      requirement: "Link each lot to a qualified scheduled process, critical-factor records, closure control, cooling record, deviations, and release disposition. A generic PCR range cannot demonstrate commercial sterility."
      evidence: "qualified scheduled-process specification; process chart; closure inspection; cooling record; deviation approval"
    - id: dq_source_and_estimate_status
      applies_to: "all non-foreground values"
      requirement: "Mark reasoned estimates as provisional, keep them separate from collected values, and replace them with source-backed or reviewed foreground ranges before activation."
      evidence: "structured amount evidence kind; source references; review record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow and metadata"
    rule: "Fail validation when the product-flow UUID, Mass property, mass unit group, 1,000 kg net-contents amount, or required product qualifiers are missing or inconsistent. Packaging mass must be separate from reference net contents."
    source_ids: []
  - rule_id: validate_scope_route
    applies_to: "product classification and process route"
    rule: "Confirm that the product is shelf-stable, not frozen, and a defining pea product. Require mature-pea soaking when the input is dried mature peas, and reject a dataset that silently treats refrigerated, frozen, fermented, vinegar-preserved, or composite products as in scope."
    source_ids:
      - codex-cxs-297-2009-2023
      - ecfr-21-cfr-155-170
  - rule_id: validate_process_coverage
    applies_to: "foreground process map"
    rule: "Require recorded values or an explicit documented zero/not-applicable reason for every applicable process, including cleaning, rejected product, packaging, thermal processing, cooling, and wastewater or residue handling."
    source_ids:
      - codex-cxc-23-1979
      - eu-bat-fdm-2019-2031
  - rule_id: validate_thermal_process
    applies_to: "sealed product release"
    rule: "Fail validation if a released lot lacks a qualified scheduled-process identifier, container and fill specification, critical time/temperature records, closure control, cooling method, or resolved deviation disposition. Do not validate sterility from provisional energy ranges."
    source_ids:
      - codex-cxc-23-1979
  - rule_id: validate_mass_and_water_balance
    applies_to: "each campaign and process"
    rule: "Flag unexplained mass or water imbalance and require the producer to state the investigation threshold used; no universal numerical tolerance is imposed by this candidate PCR."
    source_ids:
      - eu-bat-fdm-2019-2031
  - rule_id: validate_allocation
    applies_to: "shared operations and multi-output streams"
    rule: "Require subdivision where practicable. Otherwise require a documented relevant physical allocation driver and sensitivity; reject undisclosed economic allocation, netting of sold residues, or default avoided-burden credits."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_provisional_ranges
    applies_to: "reasoned-estimate ranges"
    rule: "Treat all reasoned_estimate ranges as QA prompts only. Flag an out-of-range foreground value for review rather than replacing it, and block activation until important provisional ranges are replaced or explicitly accepted through methodology review."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground manufacturing data package for prepared or preserved non-frozen peas, with a plant-gate reference product and process-resolved inventory"
  downstream_use: "may support secondary_dataset or background_dataset publication after review and may be linked into cradle-to-gate or cradle-to-grave process and lifecyclemodel studies"
  allowed_use: "route-, geography-, time-, formulation-, and container-representative modelling where the required qualifiers, scheduled-process evidence, linked upstream datasets, allocation, and data-quality disclosures are satisfied"
  excluded_use: "direct representation of frozen, refrigerated, dried-only, fermented, vinegar-preserved, pureed, soup, or composite pea products; food-safety release based only on this PCR; undisclosed transfer to materially different pea routes or container systems"
  required_metadata: "PCR id and status; product-flow UUID; CPC mapping context; pea maturity route; cultivar/style/size or grade where relevant; recipe and packing medium; net contents and drained-mass convention; container and closure; vacuum or acidification condition; scheduled-process identifier; facility geography; technology; reference period; foreground collection coverage; linked upstream datasets; allocation and cut-off decisions"
  required_quality_disclosure: "measured versus calculated versus provisional values; instrument and calibration status; temporal and site coverage; material and water balance closure; shared-meter allocation; data gaps; reasoned-estimate ranges; thermal-process and closure deviations; waste destinations; upstream dataset representativeness"
  update_trigger: "material change to pea route, formulation, product state, container geometry or closure, scheduled thermal process, cooling system, facility technology, allocation method, reference-flow identity, applicable product specification, or evidence supporting an important range"
