      rule: "Keep upstream cultivation and production of peas, ingredients, packaging, electricity, fuels, heat, and water outside the gate-to-gate foreground process but require explicit linked upstream datasets; outsourced steps replacing an in-scope plant operation must be disclosed and linked."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_downstream_exclusions
      applies_to: "post-plant-gate stages"
      rule: "Exclude distribution, warehousing after plant-gate release, retail, consumer storage and preparation, and packaging or food end-of-life from this foreground dataset; include them only in a declared downstream lifecycle model."
