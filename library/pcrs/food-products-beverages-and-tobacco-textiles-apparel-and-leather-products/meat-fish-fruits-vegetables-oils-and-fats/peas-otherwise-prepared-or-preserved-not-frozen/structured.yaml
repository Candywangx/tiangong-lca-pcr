      applies_to: "resource and emission streams"
      rule: "Do not omit a water, energy, raw-material, wastewater, waste-gas, or residue stream merely because it is shared or unmetered. Measure it, calculate it from a documented physical driver, or disclose it as an unresolved data gap."
      source_ids:
        - eu-bat-fdm-2019-2031
