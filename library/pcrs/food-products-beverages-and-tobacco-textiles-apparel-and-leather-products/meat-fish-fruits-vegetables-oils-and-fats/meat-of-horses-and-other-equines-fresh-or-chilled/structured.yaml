allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "allocation_avoid_subdivision: First avoid allocation through animal and lot genealogy, separate weighing, sub-metering, process subdivision and destination-specific co-product records. Source: ec-pef-method-2021-2279."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "allocation_record_gross_outputs: Record meat, edible blood, edible organs, hide, fat and bones at gross measured output before allocation; never net their quantities against waste or input amounts. Sources: ec-jrc-sa-bref-2024; ec-pef-method-2021-2279."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "allocation_physical_relationship: For an inseparable multi-output slaughter process, apply a documented physical relationship only when it represents the causal resource relationship; disclose the property, units and affected exchanges. Source: ec-pef-method-2021-2279."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "allocation_other_basis: When no representative physical relationship exists, follow the applicable PEF allocation hierarchy and disclose the chosen basis, prices or other parameters, reference period and sensitivity; this PCR supplies no default shares. Source: ec-pef-method-2021-2279."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "allocation_waste_boundary: Classify a stream as co-product or waste using its documented legal and operational destination; external treatment of waste remains an explicit output and is not silently credited. Sources: ec-jrc-sa-bref-2024; ec-pef-method-2021-2279."
    source_ids: []
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "allocation_shared_utilities: Allocate shared electricity, heat, refrigeration and sanitation by the closest measured driver, such as equipment time and load, metered energy, occupied chilled mass-time, cleaned area-time or process water. Sources: ec-jrc-sa-bref-2024; ec-pef-method-2021-2279."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_reception
      process_id: "p_animal_reception"
      flow_role: "Live animals, water, electricity, accepted animals and reception wastes"
      record_type: "Animal register, weighbridge, meter, bedding and waste records"
      raw_fields: "animal_or_lot_id; species; origin; liveweight; arrival; acceptance; water; electricity; bedding; manure; wastewater; rejected mass"
      collection_method: "Calibrated liveweight, meters, stock issue and waste weighing linked to lot identity"
      unit: "kg; m3; kWh"
      frequency: "Every lot"
      temporal_coverage: "Representative production period, normally 12 consecutive months or the complete shorter campaign"
      site_scope: "All controlled reception and lairage areas"
      aggregation_rule: "Sum each atomic exchange and normalize by accepted liveweight"
      quality_evidence: "Identity records; scale calibration; meters; stock and waste tickets"
    - protocol_id: cp_slaughter
      process_id: "p_slaughter_dressing"
      flow_role: "Animals, water, stage energy, carcass, specific co-products, wastes and combustion emissions"
      record_type: "Slaughter batch, meter, weighing, inspection and destination records"
      raw_fields: "lot_id; liveweight; water; electricity; steam; hot_water; gas; LPG; carcass_mass; each co-product; each waste; destination; factor"
      collection_method: "Calibrated scales, sub-meters, product and inspection records, destination tickets and documented emission calculations"
      unit: "kg; m3; kWh; MJ"
      frequency: "Every lot and meter period"
      temporal_coverage: "Same period as reference production"
      site_scope: "All controlled slaughter and dressing lines"
      aggregation_rule: "Normalize each exchange by accepted dressed carcass mass and retain gross outputs"
      quality_evidence: "Calibration; batch genealogy; meters; inspection; destination and factor records"
    - protocol_id: cp_chilling
      process_id: "p_carcass_chilling"
      flow_role: "Carcass, electricity, R-717, chilled output, condensate, rejects and release"
      record_type: "Lot transfer, refrigeration meter and maintenance records"
      raw_fields: "lot_id; input_mass; output_mass; temperature_state; electricity; refrigerant_issue; recovery; stock_change; condensate; reject_mass"
      collection_method: "Calibrated weighing, sub-metering, refrigeration logs and refrigerant balance"
      unit: "kg; kWh; m3"
      frequency: "Every lot and maintenance event"
      temporal_coverage: "Same period as reference production"
      site_scope: "All controlled carcass chillers"
      aggregation_rule: "Normalize by accepted chilled carcass mass"
      quality_evidence: "Lot record; meter; maintenance log; refrigerant reconciliation"
    - protocol_id: cp_cutting
      process_id: "p_cutting_deboning"
      flow_role: "Chilled carcass, water, electricity, meat, bones, fat, condemned tissue and wastewater"
      record_type: "Cutting batch, meter, weighing and destination records"
      raw_fields: "lot_id; presentation; bone_status; input_mass; water; electricity; accepted_meat; bones; fat; condemned_tissue; wastewater"
      collection_method: "Calibrated batch weighing, meters and destination records"
      unit: "kg; m3; kWh"
      frequency: "Every cutting lot"
      temporal_coverage: "Same period as reference production"
      site_scope: "All controlled cutting and deboning rooms"
      aggregation_rule: "Normalize by accepted meat before packaging and reconcile named outputs"
      quality_evidence: "Batch genealogy; calibration; meters; inspection and destination records"
    - protocol_id: cp_sanitation
      process_id: "p_cleaning_sanitation"
      flow_role: "Water, energy, active chemicals, wastewater, screenings, sludge and emissions"
      record_type: "Sanitation schedule, recipe, stock, meter and treatment records"
      raw_fields: "area; duration; water; electricity; steam; hot_water; gas; formulation_mass; active_concentration; wastewater; screenings; sludge; factors"
      collection_method: "Meters, verified formulation concentrations, stock reconciliation, waste weighing and documented emission calculations"
      unit: "kg; m3; kWh; MJ"
      frequency: "Every sanitation cycle and treatment period"
      temporal_coverage: "Same period as reference production"
      site_scope: "All controlled processing areas and on-site wastewater treatment"
      aggregation_rule: "Allocate by cleaned area-time or measured process driver and normalize by accepted meat"
      quality_evidence: "Schedule; SDS; recipe; meters; calibration; treatment and factor records"
    - protocol_id: cp_packaging_storage
      process_id: "p_packaging_cold_storage"
      flow_role: "Meat, each package, stage electricity, R-717, diesel, reference output, wastes and emissions"
      record_type: "Packaging BoM, count, weighing, meter, storage and maintenance records"
      raw_fields: "lot_id; net_meat; package_SKU; count; unit_mass; packaging_electricity; storage_electricity; mass_time; refrigerant; diesel; rejects; waste"
      collection_method: "Approved BoM, calibrated net weighing, component sampling, sub-metering and maintenance balance"
      unit: "kg; count; kWh; MJ"
      frequency: "Every lot, storage period and maintenance event"
      temporal_coverage: "Same period as reference production"
      site_scope: "All controlled packing and chilled-storage areas"
      aggregation_rule: "Normalize by net released meat; allocate shared cold storage by occupied mass-time"
      quality_evidence: "BoM; sample weights; scale and meter calibration; cold-room and maintenance logs"
  calculation_rules:
    - id: calc_reference_mass
      applies_to: "Reference meat"
      rule: "Accepted product mass minus removable packaging tare; include bone only for declared bone-in product"
      inputs:
        - "gross packed mass"
        - "packaging tare"
        - "bone status"
      output: "kg net fresh or chilled equine meat"
      source_ids:
        - ec-pef-method-2021-2279
    - id: calc_material_balance
      applies_to: "Slaughter and cutting"
      rule: "Live or carcass input = measured meat and named co-products + named wastes + documented stock or moisture change within uncertainty"
      inputs:
        - "all named input and output masses"
      output: "reconciled kg and residual"
      source_ids:
        - ec-jrc-sa-bref-2024
        - ec-pef-method-2021-2279
    - id: calc_active_chemical
      applies_to: "Sodium hydroxide and peracetic acid"
      rule: "Formulated-product mass × verified active concentration"
      inputs:
        - "issued formulation mass"
        - concentration
      output: "kg named active substance"
      source_ids:
        - ec-pef-method-2021-2279
    - id: calc_refrigerant_release
      applies_to: "R-717 refrigeration"
      rule: "Make-up refrigerant − documented recovered refrigerant − positive system stock change"
      inputs:
        - issue
        - recovery
        - "charge and stock records"
      output: "kg ammonia to air"
      source_ids:
        - ec-pef-method-2021-2279
    - id: calc_combustion_emission
      applies_to: "Natural gas, LPG and diesel"
      rule: "Multiply each foreground fuel record by a documented fuel- and equipment-specific factor for each named emission"
      inputs:
        - "fuel energy"
        - "factor and unit"
      output: "kg named elementary emission"
      source_ids:
        - ec-pef-method-2021-2279
    - id: calc_component_packaging_mass
      applies_to: "Counted packaging"
      rule: "Count × measured mean empty unit mass for the same packaging SKU and period"
      inputs:
        - count
        - "sampled unit masses"
      output: "kg named packaging component"
      source_ids:
        - ec-pef-method-2021-2279
    - id: calc_cold_storage_allocation
      applies_to: "Shared chilled storage"
      rule: "Metered cold-room electricity × declared product occupied mass-time / total occupied mass-time"
      inputs:
        - meter
        - "product mass"
        - "storage time"
        - "total mass-time"
      output: "kWh attributable to product lot"
      source_ids:
        - ec-pef-method-2021-2279
  data_quality_requirements:
    - id: dq_scope_identity
      applies_to: "Reference product"
      requirement: "Confirm equine skeletal meat, fresh or chilled and never frozen; keep offal and other co-products outside reference mass."
      evidence: "CPC record, product specification, inspection and temperature-state records"
    - id: dq_company_specific
      applies_to: "Controlled foreground"
      requirement: "Use company-specific process, BoM, utility, co-product, waste and direct-emission data for all controlled operations."
      evidence: "Batch records, meters, invoices, destination records and ec-pef-method-2021-2279"
    - id: dq_traceability
      applies_to: "Animal-to-meat genealogy"
      requirement: "Maintain lot links from live equines through carcass, cutting, packaging and release."
