      raw_fields: "lot_id; timestamp; process_stage; product_temperature_or_validated_proxy; set_point; alarm; corrective_action; package_integrity"
      collection_method: "retain continuous monitoring where available and lot-linked checks under the facility food-safety plan"
      unit: "declared temperature unit and time"
      frequency: "continuous or each lot as applicable"
      temporal_coverage: "entire included freezing and storage period"
      site_scope: "all included freezers, cold rooms, and transfer stages"
