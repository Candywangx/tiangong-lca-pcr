allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "multifunctional_foreground_processes"
    rule: "First avoid allocation by collecting separate process data, subdividing operations, or expanding the product system when a defensible substituted function is known."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "joint_products_and_co-products"
    rule: "When avoidance is not feasible, allocate inputs and outputs using a documented causal physical relationship. Mass may be used only when it represents that relationship; do not assign burdens by mass automatically."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic
    applies_to: "residual_multifunctionality"
    rule: "Use economic allocation only when no defensible causal physical relationship can be established; use a representative price period and report a sensitivity case for material co-products."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_status
    applies_to: "trimmings_skin_bone_rejects_and_recovered_material"
    rule: "Record whether each separated material is a co-product, recyclable material, animal-feed input, treatment input, or waste under the declared jurisdiction, and disclose any credit, avoided product, or burden transfer."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "reception_preparation_mincing_forming_freezing_glazing_packaging_storage"
      flow_role: "received, intermediate, net reference, glaze, and dispatched masses"
      record_type: "calibrated scale, batch, production, or inventory records"
      raw_fields: "timestamp; lot_id; species; origin; product_form; gross_mass; tare_mass; glaze_mass; net_mass; reject_mass; destination"
      collection_method: "reconcile scales and lot records, keeping gross, tare, glaze, and net fish mass distinct"
      unit: "kg"
      frequency: "each lot and monthly reconciliation"
      temporal_coverage: "declared production period covering representative operating conditions"
      site_scope: "all facilities and lines in the dataset"
      aggregation_rule: "sum equivalent flows by lot and normalize to 1 kg net reference product"
      quality_evidence: "scale calibration; lot traceability; reconciliation record; operator review"
    - protocol_id: cp_water_ice
      process_id: "reception_preparation_freezing_glazing"
      flow_role: "preparation water, ice, and glazing water"
      record_type: "meters, ice-production logs, purchase records, and glaze tests"
      raw_fields: "meter_start; meter_end; ice_mass; purchased_water; glaze_test_gross; glaze_test_net; lot_id"
      collection_method: "reconcile supplied water and ice to lots or allocate shared supply by a disclosed physical driver"
      unit: "kg or m3 with density/conversion record"
      frequency: "each shift or lot and monthly reconciliation"
      temporal_coverage: "same period as product mass records"
      site_scope: "all relevant preparation and glazing operations"
      aggregation_rule: "subtract unrelated use and normalize to the applicable process output"
      quality_evidence: "meter checks; invoice reconciliation; glaze-test record"
    - protocol_id: cp_energy
      process_id: "mincing_forming_freezing_glazing_packaging_storage"
      flow_role: "electricity and fuel use"
      record_type: "sub-meters, utility meters, invoices, equipment runtime, rated power, and storage logs"
      raw_fields: "meter_start; meter_end; fuel_quantity; equipment_id; runtime; rated_power; throughput; storage_days; occupied_capacity"
      collection_method: "prefer sub-metering; otherwise calculate and allocate shared utilities with a documented physical driver"
      unit: "kWh, MJ, or declared fuel unit"
      frequency: "continuous, shift, or monthly"
      temporal_coverage: "same period as production and storage records"
      site_scope: "all included equipment and shared utilities"
      aggregation_rule: "reconcile to invoices and normalize to process output or reference product and declared storage duration"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_residue_mass
      process_id: "reception_preparation_freezing_glazing"
      flow_role: "solid residues, rejects, wastewater-associated solids, and destinations"
      record_type: "scales, bins, manifests, sales, treatment, or disposal records"
      raw_fields: "material_type; mass; moisture_state; destination; regulatory_status; revenue; lot_id"
      collection_method: "weigh by destination or reconcile container counts with verified unit mass"
      unit: "kg"
      frequency: "each removal and monthly reconciliation"
      temporal_coverage: "same period as production records"
      site_scope: "all included residue and reject points"
      aggregation_rule: "aggregate by material and destination; reconcile with mass balance"
