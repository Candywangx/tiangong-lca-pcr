  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "reference product"
      rule: "net fish-meat mass = gross frozen product mass - external glaze mass; packaging is excluded independently"
      inputs:
        - "gross frozen mass"
        - "glaze mass"
        - "packaging mass"
      output: "kg net frozen fish meat"
      source_ids:
        - codex-cxs-190-1995
    - id: calc_normalized_inventory
      applies_to: "all inventory rows"
      rule: "normalized amount = included period amount / dispatched net fish-meat mass"
      inputs:
        - "reconciled flow amount"
        - "dispatched net mass"
      output: "amount per kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_process_yield
      applies_to: "preparation, mincing, and freezing"
      rule: "yield = measured net output mass / measured input mass for the same reconciled lot or period"
      inputs:
        - "input mass"
        - "output mass"
        - "lot or period link"
      output: "kg/kg process yield"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "each process and complete foreground system"
      rule: "reconcile measured inputs with net product, separated co-products, waste, retained glaze, wastewater-associated outputs, and documented inventory change; investigate unexplained imbalance"
      inputs:
        - input
        - output
        - waste
        - glaze
        - water
        - "and inventory-change records"
      output: "mass-balance residual and explanation"
      source_ids: []
    - id: calc_shared_energy
      applies_to: "shared utilities"
      rule: "allocate shared energy using a documented physical driver such as metered runtime, throughput, refrigeration load, occupied capacity, and storage duration; retain allocation factors"
      inputs:
        - "shared meter"
        - "driver quantities"
        - "included output"
      output: "energy per process output or reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_refrigerant_recharge
      applies_to: "refrigeration systems"
      rule: "net recharge = added refrigerant - recovered refrigerant - documented closing-charge increase, evaluated by named substance and attributed with a disclosed physical driver"
      inputs:
        - "service and charge records"
        - "operating driver"
      output: "kg refrigerant attributable to included operations"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "all product and material records"
      requirement: "Preserve species or species group, origin production system, upstream dataset, received form, minced/non-minced form, glaze status, additives, and packaging format at the level needed to avoid combining materially different products."
      evidence: "lot traceability, supplier specification, product specification, and upstream dataset references; cpc-v3-21223; codex-cxc-52-2003"
    - id: dq_temporal_representativeness
      applies_to: "foreground activity data"
      requirement: "Use a declared period representative of operating seasons, production mix, and storage duration; disclose shutdowns, abnormal lots, missing months, and extrapolation."
      evidence: "dated meter, production, storage, and utility records; eu-pef-2021-2279"
    - id: dq_technology_geography
      applies_to: "processes and utilities"
      requirement: "Identify freezing, mincing, glazing, packaging, refrigeration, and wastewater technologies and use geography-specific electricity, water, fuel, treatment, and upstream fish datasets where available."
      evidence: "equipment register, site records, supplier data, and dataset metadata; eu-pef-2021-2279"
    - id: dq_completeness
      applies_to: "foreground system"
      requirement: "Reconcile product, major materials, water/ice, energy, packaging, refrigerant, residues, wastewater, and co-products; list every excluded flow and justification rather than applying an undocumented cut-off."
      evidence: "mass/energy reconciliation, exclusion log, and source-to-row matrix; eu-pef-2021-2279"
    - id: dq_food_safety_quality
      applies_to: "freezing and frozen storage"
      requirement: "Retain records showing that applicable hazard-control, hygiene, freezing, temperature-control, package-integrity, and corrective-action requirements were applied throughout the included product cycle."
      evidence: "HACCP plan and records, monitoring logs, calibration, alarms, inspections, and corrective actions; codex-cxc-52-2003; codex-cxs-190-1995 when applicable"
    - id: dq_estimate_replacement
      applies_to: "provisional QA ranges"
      requirement: "Treat every reasoned_estimate range as a screening flag only; replace it with representative foreground or reviewed source-backed evidence before using it as a publication-critical allowed range."
      evidence: "review record and replacement source or representative dataset"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "Require product-flow UUID bbae8c72-d732-4f53-bdd5-aff8a0f39d48, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and exactly 1 kg net fish-meat reference mass."
    source_ids: []
  - rule_id: validate_scope_qualifiers
    applies_to: "dataset_identity"
    rule: "Reject guidance as incomplete when species/origin, upstream dataset, product form, minced status, glaze, packaging scope, freezing technology, storage regime and duration, geography, or data period are missing."
    source_ids:
      - cpc-v3-21223
      - codex-cxc-52-2003
  - rule_id: validate_process_coverage
    applies_to: "process_inventory"
    rule: "Require every required process and each applicable conditional process, including the complete on-site frozen chain, or a documented zero/not-applicable statement supported by facility evidence."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_mass_reconciliation
    applies_to: "mass_balance"
    rule: "Require lot- or period-consistent reconciliation of received input, net product, glaze, co-products, residues, rejects, wastewater-associated material, and inventory change; flag unexplained residuals for review."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "multifunctionality"
    rule: "Require allocation avoidance evidence or the selected physical/economic method, factors, co-product status, price period when relevant, and sensitivity disclosure."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_cold_chain_quality
    applies_to: "food_safety_and_quality"
    rule: "Require linked control records for freezing, storage, package integrity, excursions, and corrective actions under applicable requirements; do not infer compliance from an average temperature alone."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-190-1995
  - rule_id: validate_data_quality
    applies_to: "foreground_dataset"
    rule: "Require temporal, technological, geographical, completeness, traceability, calibration, and uncertainty/estimate disclosures, including identification of every provisional range used."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production dataset for frozen fish-meat manufacturing at the processing-facility gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA of declared frozen fish meat when species/origin, upstream production, product form, facility technology, glaze, packaging, storage duration, geography, time period, and allocation are representative"
  excluded_use: "Direct representation of fishing or aquaculture, whole frozen fish, separately classified frozen fillets, livers or roes, surimi/formulated products, other preservation routes, downstream distribution, retail, cooking, consumption, or end-of-life without added datasets"
  required_metadata: "PCR id and version context; product-flow UUID; species/origin; upstream datasets; minced status; product and packaging form; glaze fraction; additives; included operations; freezing and refrigeration technology; storage regime/duration; geography; data period; allocation method; co-product/waste status; cut-offs/proxies; data owner and review status"
  required_quality_disclosure: "Source-to-row traceability; measurement and calculation methods; calibration and reconciliation; temporal, technological, and geographical representativeness; mass balance; food-safety control evidence; allocation sensitivity; missing data; provisional estimates; uncertainty and limitations"
  update_trigger: "Material change in fish source or species mix, received form, product specification, mincing/freezing/glazing technology, refrigerant, energy supply, packaging, storage duration, allocation/co-product route, regulation, facility configuration, or representative data period"
