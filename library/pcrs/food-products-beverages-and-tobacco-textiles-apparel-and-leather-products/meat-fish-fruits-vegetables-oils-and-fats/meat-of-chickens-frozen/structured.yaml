system_boundary:
  rules:
    - rule_id: boundary_required_stages
      applies_to: "foreground plant operations"
      rule: "Include live-bird reception after facility acceptance, slaughter, dressing, carcass washing where used, chilling, conditional cutting or deboning, freezing, conditional glazing and packaging, frozen storage, cleaning and sanitation, on-site utilities allocated to these stages, and management of outputs crossing the foreground boundary."
      source_ids:
        - codex-cxc-58-2005
        - codex-cxc-8-1976
    - rule_id: boundary_upstream_live_birds
      applies_to: "live-chicken supply"
      rule: "Represent farm production, feed, hatchery burdens where applicable, and transport before slaughter-facility acceptance through traceable upstream datasets; do not silently treat live birds as burden-free."
      source_ids:
        - fao-leap-poultry-2016
    - rule_id: boundary_cold_chain
      applies_to: "freezing and plant frozen storage"
      rule: "Include electricity, thermal loads, refrigerant make-up and direct losses, defrosting, and duration-dependent frozen storage through plant-gate dispatch. Declare freezer technology, refrigerant, storage duration, and temperature records."
      source_ids:
        - codex-cxc-8-1976
    - rule_id: boundary_packaging
      applies_to: "packaging operations"
      rule: "Include packaging materials and packaging waste when packaging occurs before the declared plant gate. If packaging is excluded from the reference product mass, it still remains an inventory input when inside the boundary."
      source_ids:
        - codex-cxc-8-1976
    - rule_id: boundary_wastewater_and_byproducts
      applies_to: "slaughter, cutting, cleaning, and freezing"
      rule: "Record wastewater, edible co-products, animal by-products, condemned material, feathers, blood, bones, trimmings, product losses, and packaging waste separately when they cross the foreground boundary; link off-site treatment or recovery through appropriate datasets."
      source_ids:
        - codex-cxc-58-2005
    - rule_id: boundary_downstream_exclusion
      applies_to: "downstream life-cycle stages"
      rule: "Exclude distribution after plant dispatch, retail, cooking, consumption, and post-consumer end-of-life. Disclose any study-specific extension instead of presenting it as PCR-conforming plant-gate scope."
      source_ids:
        - fao-leap-poultry-2016
boundary_abstraction:
  declared_starting_condition: "Live domestic chickens accepted at the slaughter-facility reception point, with accepted mass, mortality or rejection, supplier, origin, and transport handover recorded"
  starting_condition_role: "Foreground plant-gate input and link point to upstream poultry-production and inbound-transport datasets"
  product_classification_scope: "Frozen raw chicken meat corresponding to CPC 3.0 code 21141; classification is mapping context and does not define canonical PCR identity"
  recursive_input_rule: "A purchased frozen chicken-meat input within this product category shall be recorded as an upstream product input with supplier, product form, mass, and dataset reference; do not recursively reproduce its upstream production inside the same foreground process"
  upstream_dataset_requirement: "Use traceable upstream datasets for live-chicken production, feed and hatchery burdens where applicable, inbound transport, purchased energy and materials, packaging, and off-site waste or wastewater treatment"
  disclosure: "Declare plant geography, reporting period, product mix, product form, allocation method, cut and bone/skin states, glazing fraction, packaging boundary, freezer and refrigerant technology, frozen-storage duration, dispatch temperature, upstream dataset choices, exclusions, and data gaps"
