measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report exactly 1 kg net frozen chicken meat as the quantitative reference. Exclude packaging and separately marketed co-products from the reference mass."
  - id: glaze_mass_separation
    applies_to: "glazed product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure gross frozen mass and glaze mass separately; calculate net chicken-meat mass after subtracting glaze water. Declare the measurement method and sampling plan."
  - id: input_output_mass_consistency
    applies_to: "live birds, meat intermediates, final meat, co-products, waste, and wastewater solids"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert all mass records to kg and retain wet/dry basis and measurement point. Reconcile each production period against the declared mass-balance perimeter."
  - id: frozen_temperature_condition
    applies_to: "reference product and frozen storage"
    required_property_ref:
      name: "Temperature"
      uuid: ""
    required_unit: "°C"
    rule: "Record product temperature at freezer exit and dispatch, plus continuous or representative cold-store records. The declared frozen product shall be maintained at -18 °C or colder, subject only to applicable documented tolerances."
  - id: storage_duration_basis
    applies_to: "frozen storage electricity and refrigerant losses"
    required_property_ref:
      name: "Time"
      uuid: ""
    required_unit: "day"
    rule: "Record average and range of residence time. Normalize duration-dependent inventories to the actual kg-day service before reporting them per 1 kg reference product."
  - id: energy_carrier_separation
    applies_to: "electricity, fuels, steam, heat, and refrigeration"
    required_property_ref:
      name: "Energy or carrier-specific property"
      uuid: ""
    required_unit: "kWh, MJ, or carrier mass/volume"
    rule: "Preserve measured carrier units and conversion factors. Do not combine electricity, thermal energy, and refrigerant make-up into one undifferentiated energy total."
