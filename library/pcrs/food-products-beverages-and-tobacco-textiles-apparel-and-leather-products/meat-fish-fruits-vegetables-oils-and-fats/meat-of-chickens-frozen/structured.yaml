allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "separately metered processes and product lines"
    rule: "Avoid allocation by subdividing processes and directly assigning measured materials, energy, emissions, and wastes to the product line whenever technically feasible."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_co_products
    applies_to: "edible co-products, recoverable animal by-products, and saleable cutting outputs"
    rule: "After subdivision, allocate remaining shared burdens using a documented physical causal relationship where one can be demonstrated. If no defensible causal relationship exists, use mass allocation on consistent wet-mass product outputs and report an economic-allocation sensitivity."
    source_ids:
      - iso-14044-2006
      - fao-leap-poultry-2016
  - rule_id: allocation_waste_treatment
    applies_to: "wastes and animal by-products sent to treatment"
    rule: "Do not assign avoided-product credits without an explicitly declared substitution method and receiving-system boundary. Include treatment burdens and disclose any recovery credit separately."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_shared_utilities
    applies_to: "refrigeration, boilers, water systems, sanitation, wastewater treatment, and site services"
    rule: "Allocate shared utilities using measured submetering where available; otherwise use a documented causal driver such as equipment load, operating hours, water volume, organic load, occupied cold-store kg-day, or throughput."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_consistency
    applies_to: "reference product and all co-products"
    rule: "Apply the selected allocation hierarchy consistently across the reporting period and disclose product quantities, allocation factors, factor sum, prices and reference period when economic sensitivity is used, and any material exclusions."
    source_ids:
      - iso-14044-2006
      - fao-leap-poultry-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_live_bird_intake
      process_id: "slaughter_dressing_chilling"
      flow_role: "accepted live chickens and reception losses"
      record_type: "weighbridge, receiving, supplier, and rejection records"
      raw_fields: "received gross mass; tare; accepted mass; rejected mass; dead-on-arrival mass; supplier; origin; arrival time; upstream dataset reference"
      collection_method: "calibrated weighbridge or verified scales reconciled to receiving records"
      unit: "kg"
      frequency: "each delivery"
      temporal_coverage: "full reporting period"
      site_scope: "all suppliers and reception points serving the product group"
      aggregation_rule: "sum accepted mass by supplier and product group; retain rejected and dead-on-arrival mass separately"
      quality_evidence: "scale calibration; ticket IDs; supplier traceability; completeness reconciliation"
    - protocol_id: cp_slaughter_records
      process_id: "slaughter_dressing_chilling"
      flow_role: "utilities, meat output, co-products, animal by-products, and wastewater"
      record_type: "meters, production logs, invoices, scales, waste manifests, and laboratory records"
      raw_fields: "water; electricity; fuel/steam/heat; chilled output mass; co-product mass; waste mass; wastewater volume; wastewater quality; operating hours"
      collection_method: "direct meters and scales preferred; reconcile invoices and stock changes for shared utilities"
      unit: "native unit and kg output"
      frequency: "shift or batch for production; at least monthly for reconciliations"
      temporal_coverage: "representative continuous period covering seasonality, normally at least 12 months"
      site_scope: "all relevant slaughter, dressing, chilling, sanitation, and utility areas"
      aggregation_rule: "allocate shared totals with declared causal driver; normalize to kg chilled output"
      quality_evidence: "meter calibration; invoice reconciliation; mass balance; laboratory QA; treatment manifests"
    - protocol_id: cp_cutting_records
      process_id: "cutting_deboning"
      flow_role: "chilled input, prepared output, utilities, and residues"
      record_type: "batch sheets, scales, meters, and waste records"
      raw_fields: "chilled input mass; prepared output mass; cut; bone and skin state; electricity; water; bones; skin; trimmings; rejects"
      collection_method: "calibrated batch scales and submetering or documented allocation from site totals"
      unit: "kg, kWh, m3"
      frequency: "each batch or shift"
      temporal_coverage: "all cutting campaigns in reporting period"
      site_scope: "all included cutting and deboning lines"
      aggregation_rule: "calculate yield and normalize utilities and residues to kg prepared output"
      quality_evidence: "scale calibration; batch reconciliation; product specification; residue destination evidence"
    - protocol_id: cp_freezing_packaging_records
      process_id: "freezing_glazing_packaging"
      flow_role: "freezer input/output, electricity, glaze, packaging, losses, and temperature"
      record_type: "batch scales, electricity meters, packaging issue records, temperature logger, and rejection records"
      raw_fields: "net meat input; net frozen output; gross glazed mass; glaze mass; packaging by material; electricity; freezer-exit temperature; losses; freezer technology"
      collection_method: "calibrated scales, submetering, material issue reconciliation, and logged temperature measurements"
      unit: "kg, kWh, °C"
      frequency: "each batch and continuous temperature logging"
      temporal_coverage: "all freezing campaigns in reporting period"
      site_scope: "all freezers, glazing stations, and packaging lines serving the reference product"
      aggregation_rule: "normalize to kg net frozen meat; keep glaze and packaging outside net meat mass"
      quality_evidence: "scale and meter calibration; packaging stock reconciliation; logger calibration; batch mass balance"
    - protocol_id: cp_cold_store_records
      process_id: "frozen_storage_dispatch"
      flow_role: "occupancy, residence time, electricity, temperature, dispatch, and losses"
      record_type: "warehouse management system, electricity meter, temperature logger, dispatch scale, and stock counts"
      raw_fields: "lot mass; entry and exit time; location; electricity; temperature; defrost events; dispatched net mass; losses"
      collection_method: "lot tracking, calibrated dispatch scales, submetering, and continuous or justified representative temperature logging"
      unit: "kg, day, kg-day, kWh, °C"
      frequency: "each lot; continuous temperature; monthly energy reconciliation"
      temporal_coverage: "full reporting period including seasonal ambient conditions"
      site_scope: "all on-site frozen stores serving the reference product"
      aggregation_rule: "allocate electricity by measured load or kg-day; normalize to actual lot residence time and kg dispatched"
      quality_evidence: "warehouse traceability; meter and logger calibration; stock reconciliation; excursion records"
    - protocol_id: cp_refrigerant_balance
      process_id: "freezing_glazing_packaging_frozen_storage_dispatch"
      flow_role: "refrigerant make-up and direct emissions"
      record_type: "refrigerant purchase, charge, recovery, service, transfer, and equipment records"
      raw_fields: "refrigerant species; opening stock; purchases; charges; recovery; transfers; closing stock; equipment identity; cooling load or operating hours"
      collection_method: "annual mass-balance reconciliation supplemented by leak detection and service records"
      unit: "kg refrigerant"
      frequency: "each service event with annual reconciliation"
      temporal_coverage: "full reporting year"
      site_scope: "all refrigeration equipment serving included processes"
      aggregation_rule: "calculate loss by species and allocate by direct equipment record, cooling load, or operating hours"
      quality_evidence: "purchase invoices; technician records; cylinder reconciliation; leak-test evidence"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground exchanges"
      rule: "normalized amount = exchange amount assigned to product group / net reference-product mass dispatched"
      inputs:
        - "assigned exchange amount"
        - "net dispatched meat mass"
      output: "exchange amount per 1 kg reference product"
      source_ids:
        - iso-14044-2006
    - id: calc_net_meat_mass
      applies_to: "glazed and packaged product"
      rule: "net chicken-meat mass = gross packaged product mass - packaging mass - retained glaze mass; verify with direct product specification and sampling"
      inputs:
        - "gross mass"
        - "packaging mass"
        - "glaze mass"
        - "sampling results"
      output: "kg net chicken meat"
      source_ids:
        - codex-cxc-8-1976
    - id: calc_process_yield
      applies_to: "slaughter, cutting, freezing, and storage"
      rule: "yield = qualifying process output mass / qualifying process input mass; keep co-products, waste, water gain, and losses as separate terms"
      inputs:
        - "input mass"
        - "output mass"
        - "co-product mass"
        - "waste mass"
        - "water gain"
        - "stock change"
      output: "dimensionless yield and reconciled mass balance"
      source_ids:
        - codex-cxc-58-2005
    - id: calc_storage_service
      applies_to: "frozen storage"
      rule: "kg-day = sum for each lot of net meat mass multiplied by residence time; allocated storage electricity = store electricity multiplied by product-group kg-day / total compatible kg-day"
      inputs:
        - "lot mass"
        - "entry time"
        - "exit time"
        - "store electricity"
        - "total occupancy"
      output: "kg-day and kWh per kg reference product"
      source_ids:
        - codex-cxc-8-1976
    - id: calc_refrigerant_loss
      applies_to: "freezing and cold storage"
      rule: "refrigerant loss by species = opening stock + purchases + received transfers - closing stock - recovered stock - outgoing transfers; allocate only the share serving included equipment"
      inputs:
        - "refrigerant inventory and service records"
        - "equipment allocation driver"
      output: "kg direct refrigerant emission per kg reference product"
      source_ids: []
    - id: calc_allocation_factors
      applies_to: "co-products and shared utilities"
      rule: "calculate factors from the declared causal driver; verify that the complete factor set sums to 1 within rounding tolerance and retain unrounded factors"
      inputs:
        - "product quantities"
        - "causal driver"
        - "optional market values"
        - "shared inventory"
      output: "documented allocation factors and sensitivity result"
      source_ids:
        - iso-14044-2006
        - fao-leap-poultry-2016
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and inventory flows"
      requirement: "Verify the reference UUID exactly as specified. Resolve every other product, waste, elementary, flow-property, and unit-group identity against Tiangong before publication; retain semantic descriptions where identity remains unresolved."
      evidence: "Tiangong readback; identity review record"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one coherent reporting period that represents normal operation and captures relevant seasonality; normally target at least 12 months or justify a shorter campaign."
      evidence: "record coverage table; operating calendar; exception justification"
    - id: dq_geographic_technology
      applies_to: "facility and upstream datasets"
      requirement: "Declare facility geography, freezer and refrigeration technology, refrigerant species, product route, and the geography and technology of material upstream datasets."
      evidence: "facility metadata; equipment register; dataset metadata"
    - id: dq_completeness
      applies_to: "mass, energy, water, co-products, wastes, wastewater, and refrigerants"
      requirement: "Reconcile production, utility, stock, and waste records. Explain missing meters, estimated shares, exclusions, and any unresolved mass-balance difference."
      evidence: "meter and invoice reconciliation; mass balance; waste manifests; data-gap log"
    - id: dq_temperature_traceability
      applies_to: "freezing and cold storage"
      requirement: "Retain calibrated freezer-exit and dispatch measurements plus continuous or justified representative storage records, including excursions and corrective actions."
      evidence: "temperature logs; calibration records; excursion reports; codex-cxc-8-1976"
    - id: dq_hygiene_route
      applies_to: "slaughter and dressing boundary"
      requirement: "Confirm that included operations correspond to the actual slaughter, dressing, chilling, cutting, and handling route and that condemned material and hygiene-related cleaning flows are represented."
      evidence: "process flow diagram; production records; codex-cxc-58-2005"
    - id: dq_provisional_ranges
      applies_to: "all reasoned_estimate ranges"
      requirement: "Treat broad ranges only as QA screens. Replace them with measured or source-backed ranges, or obtain explicit reviewer acceptance, before using them as publication-critical constraints."
      evidence: "range review log; accepted evidence references"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require product flow UUID 00dbb94a-580a-4aae-979b-a7b1f4278116, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and reference amount 1."
    source_ids: []
  - rule_id: validate_reference_qualifiers
    applies_to: "reference flow metadata"
    rule: "Fail completeness when any required qualifier is absent or when gross product, glaze, or packaging mass is substituted for net chicken-meat mass."
    source_ids:
      - codex-cxc-8-1976
  - rule_id: validate_product_scope
    applies_to: "product identity"
    rule: "Reject fresh or chilled meat, edible offal marketed separately, mechanically separated meat, cooked or manufactured products, and non-chicken poultry from this PCR scope."
    source_ids: []
  - rule_id: validate_process_coverage
    applies_to: "process map and inventory"
    rule: "Require detailed inventories for slaughter/dressing/chilling, freezing/glazing/packaging, and frozen storage/dispatch; require cutting/deboning when the declared product route includes it."
    source_ids:
      - codex-cxc-58-2005
      - codex-cxc-8-1976
  - rule_id: validate_frozen_condition
    applies_to: "freezer exit, storage, and dispatch"
    rule: "Require temperature records demonstrating -18 °C or colder for the declared frozen state, subject only to documented applicable tolerances; flag unexplained excursions."
    source_ids:
      - codex-cxc-8-1976
  - rule_id: validate_mass_balance
    applies_to: "each process and reporting period"
    rule: "Check input mass, output meat, co-products, wastes, added glaze water, wastewater terms where measured, and stock changes; require explanation for material imbalance and prevent double counting of intermediates."
    source_ids:
      - codex-cxc-58-2005
  - rule_id: validate_inventory_identity
    applies_to: "non-reference exchanges"
    rule: "Fail publication readiness when a semantic candidate is presented as a resolved Tiangong flow without exact UUID verification. Unresolved inventory UUIDs are acceptable only while lifecycle status remains candidate."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "shared burdens and co-products"
    rule: "Require declared allocation hierarchy, driver, complete factor set, unrounded factors, factor-sum check, product quantities, and economic sensitivity when mass allocation is used without a physical causal relation."
    source_ids:
      - iso-14044-2006
      - fao-leap-poultry-2016
  - rule_id: validate_cold_store_service
    applies_to: "storage inventories"
    rule: "Require storage duration and kg-day basis; reject a duration-independent allocation when residence time materially differs among product groups and no alternative causal measurement is supplied."
    source_ids:
      - codex-cxc-8-1976
  - rule_id: validate_refrigerants
    applies_to: "freezing and cold storage"
    rule: "Require refrigerant species, equipment scope, make-up/recovery balance, allocation method, and corresponding direct elementary emissions or an evidence-backed zero-loss statement."
    source_ids: []
  - rule_id: validate_packaging_glaze
    applies_to: "packaged or glazed product"
    rule: "Require separate masses for net chicken meat, glaze, and each packaging material; confirm that only net chicken meat forms the 1 kg reference amount."
    source_ids:
      - codex-cxc-8-1976
  - rule_id: validate_provisional_ranges
    applies_to: "reasoned_estimate QA guardrails"
    rule: "Emit a review finding when a measured value falls outside a provisional guardrail; do not automatically replace the measured value or treat the guardrail as an allowed range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground plant-gate production data package for frozen chicken meat, suitable after review for publication as a secondary_dataset or background_dataset"
  downstream_use: "Construction of process datasets and lifecyclemodel projections for frozen chicken meat where product form, geography, technology, allocation, glazing, packaging, storage, and temperature conditions are compatible"
  allowed_use: "Product carbon-footprint or LCA modelling, supply-chain inventory construction, benchmarking, and scenario analysis within the declared scope and data quality"
  excluded_use: "Claims about fresh/chilled chicken, edible offal, other poultry species, cooked or manufactured products, retail or consumer stages, or geographies and technologies not represented without explicit adaptation"
  required_metadata: "PCR id and version state; CPC mapping context; facility geography; reporting period; production route; product form; cut; bone and skin states; net-mass method; glaze fraction; packaging boundary; freezer technology; refrigerant; storage duration; dispatch temperature; allocation method; upstream datasets; unresolved identities; exclusions"
  required_quality_disclosure: "Primary-data coverage; meter and scale calibration; temporal and site coverage; mass-balance result; allocation factors and sensitivity; cold-chain records; refrigerant reconciliation; wastewater and waste coverage; source-backed versus reasoned ranges; uncertainty and data gaps"
  update_trigger: "Material change in product scope, plant route, freezer or refrigeration technology, refrigerant, packaging or glazing practice, allocation method, geography, upstream live-bird supply, storage duration, applicable regulation, verified Tiangong identities, or evidence replacing provisional ranges"
data_sources:
  - id: "codex-cxc-58-2005"
    type: "official_guidance"
    reference: "FAO/WHO Codex Alimentarius, Code of Hygienic Practice for Meat, CXC 58-2005, https://workspace.fao.org/sites/codex/Standards/CXC%2058-2005/CXC_058e.pdf (retrieved 2026-08-11)"
    used_for: "Slaughter, dressing, cutting, chilling, hygiene-process decomposition, product and waste handling, temperature traceability, and validation requirements"
  - id: "codex-cxc-8-1976"
