      applies_to: "conversion routes"
      rule: "Select either the cooked-mash route or the raw-piece route for each homogeneous lot; a combined inventory is conforming only when physically separate product quantities are modelled as separate lots or weighted datasets."
      source_ids: []
    - rule_id: boundary_grade_condition
      applies_to: "intended use"
