allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "route, batch, and separable operations"
    rule: "First subdivide records by facility, line, route, product lot, and directly metered operation so burdens remain causally linked and allocation is avoided where practicable."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_internal_rework
    applies_to: "internal rework"
    rule: "Keep internal rework inside the foreground mass balance and do not assign a separate avoided-product credit unless it crosses the system boundary as a documented co-product."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_co_products
    applies_to: "saleable co-products"
    rule: "When subdivision cannot resolve shared burdens, use a physical relation such as measured dry mass only when it reflects the underlying causal relation; otherwise use a documented economic relation and report a sensitivity result."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_treatment
    applies_to: "wastes and recoverable residues"
    rule: "Report destination, treatment, and any system-model credit consistently; do not treat a residue as both an allocated co-product and an unallocated waste."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_quality
      process_id: "potato_receiving_preparation"
      flow_role: "accepted raw potatoes and starting condition"
      record_type: "weighbridge, receiving, supplier, and quality records"
      raw_fields: "supplier; origin; lot_id; gross_mass; tare_mass; accepted_mass; rejection_mass; moisture_or_solids; acceptance_result"
      collection_method: "calibrated weighbridge or scales plus representative quality sampling"
      unit: "kg; percent"
      frequency: "every received lot"
      temporal_coverage: "representative production period, normally at least 12 months or all campaigns for seasonal operation"
      site_scope: "all supplying lots attributable to the declared facility and product"
      aggregation_rule: "sum accepted mass by lot and retain weighted quality results before normalization"
      quality_evidence: "calibration records; sampling method; supplier and lot traceability; acceptance records"
    - protocol_id: cp_preparation_resources
      process_id: "potato_receiving_preparation"
      flow_role: "water and electricity inputs"
      record_type: "meters, invoices, and equipment logs"
      raw_fields: "meter_start; meter_end; allocation_period; production_time; equipment_load; lot_output"
      collection_method: "direct meter preferred; otherwise reconciled invoice or verified load-time calculation"
      unit: "kg water; kWh"
      frequency: "each lot or shortest representative metering interval"
      temporal_coverage: "same period as product output"
      site_scope: "directly controlled preparation operations"
      aggregation_rule: "subtract unrelated uses, allocate only unavoidable shared totals with disclosed basis, and normalize to released net product"
      quality_evidence: "meter identification; calibration or invoice reconciliation; operating logs"
    - protocol_id: cp_preparation_outputs
      process_id: "potato_receiving_preparation"
      flow_role: "prepared material, residues, and wastewater"
      record_type: "transfer scales, waste tickets, and discharge meters"
      raw_fields: "prepared_mass; prepared_moisture; residue_mass_by_destination; wastewater_volume_or_mass; lot_id"
      collection_method: "calibrated scale and discharge meter or closed water balance"
      unit: "kg; percent"
      frequency: "each lot or campaign"
      temporal_coverage: "same period as associated input records"
      site_scope: "all preparation outputs for the declared product"
      aggregation_rule: "reconcile input potato and water with transfer, residue, wastewater, and retained or evaporated water"
      quality_evidence: "scale calibration; destination tickets; water-balance closure"
    - protocol_id: cp_wet_route_records
      process_id: "cooked_mash_conversion"
      flow_role: "cooked-route feed, utilities, outputs, and water balance"
      record_type: "batch sheets, scales, meters, fuel records, moisture tests, and waste records"
      raw_fields: "route_id; feed_mass; feed_moisture; steam_or_fuel; electricity; intermediate_mass; product_moisture; wastewater; rejects; operating_time"
      collection_method: "batch measurement with direct meters and representative moisture tests"
      unit: "kg; percent; MJ; kWh"
      frequency: "each batch or shortest representative metering interval"
      temporal_coverage: "all cooked-route campaigns in the declared period"
      site_scope: "cooked-mash route only"
      aggregation_rule: "reconcile mass, moisture, energy, waste, and output; normalize only to product from this route"
      quality_evidence: "route lock; meter and scale records; test method; mass and water closure"
    - protocol_id: cp_dry_route_records
      process_id: "raw_piece_conversion"
      flow_role: "raw-piece-route feed, utilities, outputs, water, rejects, and particulate"
      record_type: "batch sheets, scales, meters, moisture tests, waste records, and emission monitoring"
      raw_fields: "route_id; feed_mass; feed_moisture; heat_or_fuel; electricity; intermediate_mass; product_moisture; rejects; captured_dust; outlet_concentration; gas_flow; operating_time"
      collection_method: "batch measurement, direct meters, moisture tests, and site emission measurement where release occurs"
      unit: "kg; percent; MJ; kWh; concentration; gas volume"
      frequency: "each batch; emissions at the applicable monitoring frequency"
      temporal_coverage: "all raw-piece-route campaigns in the declared period"
      site_scope: "raw-piece route only"
      aggregation_rule: "reconcile mass, moisture, energy, waste, output, and measured releases; normalize only to product from this route"
      quality_evidence: "route lock; calibration; test method; waste tickets; monitoring records; mass and water closure"
    - protocol_id: cp_finishing_records
      process_id: "finishing_packaging"
      flow_role: "intermediate, ingredients, packaging, electricity, released product, and wastes"
      record_type: "batch formulation, issue, scale, meter, packaging bill-of-material, release, and waste records"
      raw_fields: "route_id; intermediate_mass; ingredient_issue_and_return; packaging_issue_and_return; electricity; gross_product_mass; net_product_mass; moisture; salt_or_salinity; glaze_mass; drained_mass; rejects; release_status"
      collection_method: "calibrated scales, formulation reconciliation, direct meters or verified load-time records, and quality testing"
      unit: "kg; percent; kWh"
      frequency: "every finishing lot or campaign"
      temporal_coverage: "all released lots in the declared period"
      site_scope: "all finishing and packing operations for the declared product"
      aggregation_rule: "include released lots and attributable rejects, exclude packaging and applicable glaze or free liquid from net product, and normalize to released net mass"
      quality_evidence: "formulation approval; packaging specification; calibration; test method; release and waste records"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "released product"
      rule: "Net reference mass equals gross filled product-system mass minus packaging, pallets, applicable glaze, and free liquid; when liquid is present use measured drained product mass."
      inputs:
        - "gross mass"
        - "tare and packaging mass"
        - "glaze mass"
        - "drained mass"
        - "release status"
      output: "kg net qualifying product"
      source_ids: []
    - id: calc_dry_matter
      applies_to: "potatoes, intermediates, and product"
      rule: "Dry matter equals measured mass multiplied by one minus wet-basis moisture fraction; retain the measured as-sold mass as the reference basis."
      inputs:
        - "measured mass"
        - "wet-basis moisture percent"
      output: "kg dry matter and kg as-sold mass"
      source_ids: []
    - id: calc_route_normalization
      applies_to: "each homogeneous route lot"
      rule: "Divide attributable input, waste, and direct-emission quantities by released net product from that same route and period; do not combine route totals before route-specific normalization."
      inputs:
        - "route-tagged inventory"
        - "released net product"
      output: "inventory per kg net product by route"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "each process and lot"
      rule: "Reconcile measured inputs with products, wastes, retained water, evaporated water, and stock change; investigate material imbalance beyond the facility's documented measurement uncertainty."
      inputs:
        - "input and output masses"
        - moisture
        - "stock change"
      output: "disclosed mass and water balance"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_shared_burden
      applies_to: "unavoidable shared operations"
      rule: "Apply the allocation hierarchy in section 7, retain the selected factor and basis, and report sensitivity when an economic fallback is used."
      inputs:
        - "shared burden"
        - "co-product quantities"
        - "physical or economic factor"
      output: "allocated inventory by product"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "all lots"
      requirement: "Retain supplier, potato origin, facility, product form, route, formulation, intended use, grade, and lot linkage through release."
      evidence: "Receiving, batch, formulation, and release records; CPC identity from unsd-cpc-3-0-21392"
    - id: dq_measurement
      applies_to: "mass, moisture, salinity, energy, water, and emissions"
      requirement: "Use calibrated or verified instruments and retain test methods, meter boundaries, conversion factors, and uncertainty or reconciliation evidence."
      evidence: "Calibration, laboratory, meter, invoice-reconciliation, and monitoring records"
    - id: dq_temporal_coverage
      applies_to: "foreground inventory"
      requirement: "Cover a representative production period and disclose seasonality, shutdowns, atypical lots, and any sampling or extrapolation."
      evidence: "Period coverage report consistent with eu-pef-2021-2279"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Account for the selected route's material, water, energy, packaging, wastes, and direct releases; document exclusions and close mass and water balances."
      evidence: "Balance worksheets and completeness review consistent with eu-pef-2021-2279"
    - id: dq_food_grade_condition
      applies_to: "food-grade lots only"
      requirement: "Retain hygiene-control and traceability evidence appropriate to food production; do not claim Codex conformity for non-food-grade lots."
      evidence: "Food safety plan and records guided by codex-cxc-1-1969"
    - id: dq_estimate_replacement
      applies_to: "provisional ranges"
      requirement: "Identify every reasoned_estimate used for screening and replace it with representative foreground evidence or reviewed transferable evidence before activation unless a reviewer explicitly accepts continued provisional use."
      evidence: "Range replacement log and methodology review record"
