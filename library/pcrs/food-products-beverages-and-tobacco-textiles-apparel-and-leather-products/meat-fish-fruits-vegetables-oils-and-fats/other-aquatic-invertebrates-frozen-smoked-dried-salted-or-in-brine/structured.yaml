    - id: dq_temporal_coverage
      applies_to: "Foreground dataset"
      requirement: "Cover a representative declared operating period, including seasonal or campaign variation where material, and disclose shutdowns, abnormal lots, and exclusions."
      evidence: "Production calendar, lot coverage summary, and representativeness assessment"
    - id: dq_completeness
      applies_to: "Included processes"
      requirement: "Account for material and energy inputs, packaging, reference product, secondary outputs, wastes, wastewater, and direct emissions for the common process and selected terminal route."
