allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared_processes"
    rule: "Avoid allocation by subdividing routes, lots, meters, and unit operations or by using a documented physical causal relationship."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residual_products
    applies_to: "co_products_and_residues"
    rule: "Classify each secondary output as product, co-product, recyclable material, or waste according to its actual destination and applicable study rules; do not assign avoided burdens without a separately declared substitution model."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_fallback
    applies_to: "inseparable_multioutput_process"
    rule: "If subdivision and physical causality are not feasible, apply an economic or other justified PEF-consistent allocation basis using representative values, disclose the formula and data period, and report sensitivity when the choice can materially change results."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_preparation
      process_id: "receiving_preparation"
      flow_role: "Received mass, preparation water, accepted intermediate, and residues"
      record_type: "Batch records and measurements"
      raw_fields: "lot_id; organism_identity; intended_use; input_mass; water_use; prepared_mass; residue_mass; destination"
      collection_method: "Calibrated scales, meters or tank records, and lot reconciliation"
      unit: "kg; m3"
      frequency: "Each lot, with utilities reconciled at least monthly"
      temporal_coverage: "Declared representative production period including seasonal campaigns"
      site_scope: "All included receiving and preparation operations"
      aggregation_rule: "Sum records by lot, reconcile mass, then divide by prepared output"
      quality_evidence: "Calibration records; invoices or meter logs; lot sheets; residue transfer records"
    - protocol_id: cp_freezing_route
      process_id: "freezing_route"
      flow_role: "Material, energy, glaze, packaging, output, wastes, and refrigerant"
      record_type: "Batch, meter, invoice, and maintenance records"
      raw_fields: "lot_id; prepared_mass; electricity; glaze_water; packaging_mass; gross_frozen_mass; glaze_mass; deglazed_mass; waste; refrigerant_charge; refrigerant_recovery"
      collection_method: "Lot weighing, submetering or allocation, packaging issue records, deglazing test, and refrigerant service balance"
      unit: "kg; kWh; m3"
      frequency: "Each lot; utilities and refrigerant reconciled over the declared period"
      temporal_coverage: "Declared representative freezing period"
      site_scope: "All included freezing, glazing, cold holding, and route-integrated packing equipment"
      aggregation_rule: "Convert output to deglazed mass, allocate shared utilities by documented causal driver, and normalize to 1 kg output"
      quality_evidence: "Scale and meter calibration; deglazing test; invoices; service records; lot reconciliation"
    - protocol_id: cp_smoking_drying_route
      process_id: "smoking_drying_route"
      flow_role: "Material, energy, smoke material, packaging, output, residues, and direct emissions"
      record_type: "Batch, meter, recipe, fuel, and emissions records"
      raw_fields: "lot_id; route_mode; prepared_mass; energy_by_carrier; smoke_material; packaging_mass; product_mass; moisture; waste_by_destination; emission_factor_or_measurement"
      collection_method: "Lot weighing, meters or invoices, recipe records, moisture test, and measured or factor-based emissions"
      unit: "kg; kWh; MJ"
      frequency: "Each lot, with utilities reconciled over the declared period"
      temporal_coverage: "Declared representative smoking or drying period"
      site_scope: "Only the selected smoking or drying equipment and route-integrated packing"
      aggregation_rule: "Keep energy carriers separate, calculate direct emissions where applicable, and normalize to 1 kg as-sold output"
      quality_evidence: "Calibration; invoices; recipe and moisture tests; emissions method record; lot reconciliation"
    - protocol_id: cp_salting_brining_route
      process_id: "salting_brining_route"
