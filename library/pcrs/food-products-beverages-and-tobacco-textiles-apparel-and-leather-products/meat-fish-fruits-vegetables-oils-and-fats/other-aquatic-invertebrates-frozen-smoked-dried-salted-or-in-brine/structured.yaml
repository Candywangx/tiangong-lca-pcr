    - id: calc_normalization
      applies_to: "All inventory rows"
      rule: "normalized quantity = period or lot quantity divided by conforming reference product mass in kg."
      inputs:
        - inventory_quantity
        - conforming_reference_mass_kg
      output: "quantity_per_kg_reference_product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "Each included process"
      rule: "Reconcile measured material inputs with product, co-product, waste, retained brine or glaze, and quantified mass transfer or loss; investigate and disclose material imbalance."
      inputs:
        - input_masses
        - product_masses
        - waste_masses
        - retained_or_removed_water
        - measured_losses
      output: "process_mass_balance"
      source_ids:
        - eu-pef-2021-2279
