      record_type: "Batch, recipe, meter, invoice, and product-test records"
      raw_fields: "lot_id; route_mode; prepared_mass; salt_mass; brine_water; brine_salinity; energy_by_carrier; packaging_mass; gross_product_mass; drained_mass; moisture; product_salt; spent_brine; waste"
      collection_method: "Lot weighing, recipe sheets, salinity and moisture tests, meters, invoices, and draining protocol"
      unit: "kg; kWh; MJ"
      frequency: "Each lot, with utilities reconciled over the declared period"
      temporal_coverage: "Declared representative salting or brining period"
      site_scope: "Only the selected dry-salting or brining equipment and route-integrated packing"
