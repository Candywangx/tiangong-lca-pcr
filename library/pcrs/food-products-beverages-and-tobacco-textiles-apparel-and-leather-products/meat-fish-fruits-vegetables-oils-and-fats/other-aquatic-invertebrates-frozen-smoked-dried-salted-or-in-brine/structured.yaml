      quality_evidence: "Scale and meter calibration; recipe sheets; salinity/moisture tests; draining record; lot reconciliation"
  calculation_rules:
    - id: calc_reference_mass
      applies_to: "Reference output"
      rule: "Frozen net mass = gross frozen mass minus measured glaze mass; brined net mass = measured drained product mass; other routes use as-sold product mass excluding packaging, with moisture and salt basis declared."
      inputs:
        - gross_product_mass
        - glaze_mass
        - drained_mass
        - packaging_mass
        - moisture
        - product_salt
      output: "conforming_reference_mass_kg"
      source_ids:
