    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_02
    applies_to: "shells, testa, off-grade kernels, and peelings"
    rule: "Classify each measured fraction once as internal reuse, product/co-product, or waste according to documented disposition. Never report the same mass simultaneously as co-product and waste."
    source_ids: []
  - rule_id: al_03
    applies_to: "unavoidable shared burdens with co-products"
    rule: "Use a documented physical causal relationship when it represents the process. If no defensible physical relationship exists, use contemporaneous net economic values and disclose prices, period, geography, and sensitivity. No default allocation factor is prescribed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_04
    applies_to: "waste and exported residues"
    rule: "Assign on-site handling and treatment burdens to the foreground process. Do not claim avoided-product or recycling credits unless a separately declared downstream modelling method and substitution evidence are provided."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "kernel_release_shelling_kernel_finishing"
      flow_role: "received material, internal transfers, kernels, shells, peelings, and rejects"
      record_type: "weighbridge, calibrated scale, batch sheet"
      raw_fields: "lot_id; route_id; timestamp; gross_mass; tare_mass; net_mass; moisture_or_conditioning_state; destination"
      collection_method: "weigh every received lot and material transfer; reconcile transfers and stock change"
      unit: "kg"
      frequency: "each lot and transfer"
      temporal_coverage: "representative production campaign covering normal route operation"
      site_scope: "each production site and route"
      aggregation_rule: "sum net masses by lot and route; retain opening and closing stock before normalization"
      quality_evidence: "scale calibration; signed batch record; lot traceability; reconciliation record"
    - protocol_id: cp_utility_records
      process_id: "all_processes"
      flow_role: "electricity, fuels, purchased heat, steam, water, compressed air, atmosphere gas"
      record_type: "submeter, invoice, tank or cylinder stock balance, operating log"
      raw_fields: "meter_start; meter_end; purchase_quantity; opening_stock; closing_stock; route_id; operating_hours; allocation_driver"
      collection_method: "prefer route or line metering; otherwise reconcile purchases and stock and allocate with a disclosed causal driver"
      unit: "original unit plus MJ for energy and kg for mass"
      frequency: "meter reading each shift or lot; invoice and stock reconciliation monthly"
      temporal_coverage: "same period as production output, covering normal operation and material start-up or shutdown events"
      site_scope: "each site, route, and packing line"
      aggregation_rule: "subtract closing from opening plus purchases; assign to route; convert units once; normalize to matching process output"
      quality_evidence: "meter calibration; invoices; conversion factors; allocation worksheet"
    - protocol_id: cp_residue_disposition
      process_id: "all_processes"
      flow_role: "co-products, internal reuse, rejects, waste, and treatment routes"
      record_type: "scale ticket, dispatch note, waste manifest, internal transfer record"
      raw_fields: "lot_id; material_type; mass; disposition_class; recipient; treatment; date"
      collection_method: "weigh each disposition and link it to the originating lot or campaign"
      unit: "kg"
      frequency: "each dispatch or internal transfer"
      temporal_coverage: "same campaign as product mass balance"
      site_scope: "each site and receiving route"
      aggregation_rule: "aggregate by material and mutually exclusive disposition; reconcile with mass balance"
      quality_evidence: "scale calibration; dispatch or waste document; recipient evidence"
    - protocol_id: cp_quality_and_output_records
      process_id: "kernel_finishing_kernel_packing"
      flow_role: "conforming grade, moisture or conditioning state, defects, pack release, and net output"
      record_type: "laboratory or production quality record, packing check, calibrated scale"
      raw_fields: "lot_id; kernel_form; grade; test_method; sample_plan; moisture_or_conditioning_result; defect_result; pack_size; net_mass; release_status"
      collection_method: "sample and assess the lot under the declared specification; weigh released output"
      unit: "kg plus method-specific quality units"
      frequency: "each released lot"
      temporal_coverage: "all lots included in the dataset period"
      site_scope: "each site, grade, and packing configuration"
      aggregation_rule: "retain lot results; sum released net mass only; do not merge incompatible grades or states without disclosure"
      quality_evidence: "test method; sampling record; instrument calibration; release authorization"
    - protocol_id: cp_packaging_records
      process_id: "kernel_packing"
      flow_role: "primary, secondary, and transport packaging"
      record_type: "purchase or issue record, bill of materials, item count and unit-mass test"
      raw_fields: "material_id; layer; item_count; unit_mass; issued_mass; returned_mass; pack_output_mass"
      collection_method: "weigh issued material or multiply counted items by verified unit mass; reconcile returns and scrap"
      unit: "kg"
      frequency: "each packaging batch or production campaign"
      temporal_coverage: "same period as packed output"
      site_scope: "each packing configuration"
      aggregation_rule: "issued minus returns, separated by material and layer, normalized to packed net output"
      quality_evidence: "supplier specification; unit-mass test; issue and return record"
    - protocol_id: cp_direct_emissions
      process_id: "kernel_release_shelling"
      flow_role: "on-site pollutant release from route-specific combustion or process equipment"
      record_type: "direct measurement or calculated emission record"
      raw_fields: "route_id; fuel_quantity; fuel_property; pollutant; factor; factor_source; control_efficiency; measured_release"
      collection_method: "measure each release or calculate from collected fuel using a reviewed pollutant-specific factor"
      unit: "kg per pollutant"
      frequency: "each monitoring period or fuel batch"
      temporal_coverage: "same period as route output"
      site_scope: "each on-site emission source"
      aggregation_rule: "calculate each pollutant separately; aggregate only identical elementary flows; normalize to separated kernel output"
      quality_evidence: "monitoring report or fuel record; factor citation; calculation sheet; control record"
  calculation_rules:
    - id: cal_01
      applies_to: "all inventory rows"
      rule: "normalized amount = lot- or campaign-assigned amount / net conforming packed-kernel output; preserve the process-output basis where a row is explicitly process-normalized"
      inputs:
        - "assigned quantity"
        - "net conforming packed output"
        - "process output when applicable"
      output: "quantity per reference flow or declared process output"
      source_ids:
        - eu-pef-2021-2279
    - id: cal_02
      applies_to: "as-received and dry-matter reporting"
      rule: "dry mass = as-received mass x (1 - measured moisture fraction); perform this conversion only when moisture fraction and method are available, and retain the original as-received mass"
      inputs:
        - "weighed mass"
        - "measured moisture fraction"
        - "test method"
      output: "separately labelled dry mass and conversion record"
      source_ids:
        - unece-ddp-17-cashew-kernels-2023
    - id: cal_03
      applies_to: "route and pack alternatives"
      rule: "keep each mutually exclusive conditioning or packing branch separate; aggregate only after weighting route-specific inventories by measured conforming output, never by adding full alternative inventories to one lot"
      inputs:
        - "route identifier"
        - "branch-specific inputs and outputs"
        - "conforming output"
      output: "route-specific inventory and any disclosed production-weighted aggregate"
      source_ids: []
    - id: cal_04
      applies_to: "packaging by count"
      rule: "packaging mass = issued item count x verified unit mass, adjusted for returned unused items and separately measured scrap"
      inputs:
        - "item count"
        - "unit mass"
        - returns
        - scrap
      output: "packaging input and packing waste by material"
      source_ids: []
    - id: cal_05
      applies_to: "mass balance"
      rule: "balance difference = received material inputs - product outputs - co-product outputs - waste outputs - documented stock change; investigate rather than force an unexplained difference into a product or waste row"
      inputs:
        - "all measured material masses"
        - "opening and closing stock"
      output: "disclosed mass-balance reconciliation and unresolved difference"
      source_ids: []
  data_quality_requirements:
    - id: dq_01
      applies_to: "product identity"
      requirement: "Preserve the CPC classification context, Tiangong product-flow UUID, kernel form, grade, lot, origin, moisture or conditioning state, and packing qualifiers."
      evidence: "product specification; unsd-cpc-3-0-21424; unece-ddp-17-cashew-kernels-2023"
    - id: dq_02
      applies_to: "representativeness"
      requirement: "Cover normal operation for each declared site, technology, conditioning route, grade, and pack configuration; disclose excluded lots, disruptions, start-ups, shutdowns, and seasonal limitations."
      evidence: "production schedule; route register; completeness statement; eu-pef-2021-2279"
    - id: dq_03
      applies_to: "measurements and calculations"
      requirement: "Use calibrated mass measurements, retain original utility units and conversion factors, document allocation drivers, and keep raw records traceable to normalized rows."
      evidence: "calibration records; invoices; batch sheets; calculation and allocation workbooks"
    - id: dq_04
      applies_to: "provisional ranges"
      requirement: "Treat every reasoned_estimate range as conditional candidate QA guidance, not as a default LCI amount. Replace it when the first complete representative campaign, reviewed supplier data, or source-backed range for the same route and basis becomes available."
      evidence: "replacement log; reviewed foreground dataset or external source record"
    - id: dq_05
      applies_to: "completeness"
      requirement: "Reconcile product, co-product, waste, and stock-change masses and document all exclusions, missing meters, proxy datasets, unquantified emissions, and data gaps."
      evidence: "mass-balance report; data-gap register; eu-pef-2021-2279"
validation_rules:
  - rule_id: val_01
    applies_to: "reference flow"
    rule: "Confirm that the reference output is exactly 1 kg net packed conforming kernel and uses product-flow UUID 8e888f2c-671c-44bf-8607-1bde41ac66b8, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids: []
  - rule_id: val_02
    applies_to: "product and lot metadata"
    rule: "Reject an incomplete data package when any required qualifier is missing or when product scope includes in-shell nuts or a formulated or further-processed excluded product."
    source_ids:
      - unsd-cpc-3-0-21424
      - unece-ddp-17-cashew-kernels-2023
  - rule_id: val_03
    applies_to: "route exclusivity"
    rule: "Confirm one primary kernel-release conditioning route per lot and one packing-atmosphere branch per pack output. When alternatives occur, require separate route records or production-weighted aggregation; reject simultaneous full-route inventories for one lot."
    source_ids: []
  - rule_id: val_04
    applies_to: "co-product and waste disposition"
    rule: "Confirm that every residue mass has one disposition and that no shell, testa, peeling, reject, or off-grade kernel mass is counted both as product/co-product and waste."
    source_ids: []
  - rule_id: val_05
    applies_to: "inventory evidence"
    rule: "Confirm collection-protocol linkage for collected and calculated rows, source identifiers for external or method evidence, original-unit retention, route-specific normalization, and disclosure of all substituted datasets and allocation choices."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_06
    applies_to: "provisional estimates"
    rule: "Flag every reasoned_estimate as candidate-only and verify its stated replacement trigger. Do not accept such a range as a publication-critical allowed range without explicit methodology review and source-backed replacement or documented acceptance."
    source_ids: []
  - rule_id: val_07
    applies_to: "mass balance and completeness"
    rule: "Confirm reconciliation of received nuts, kernels, co-products, wastes, and stock change; report the unexplained difference and all skipped checks rather than silently balancing it."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground unit-process data package for shelled cashew-kernel production and packing; eligible for publication as a secondary_dataset or background_dataset only after review"
  downstream_use: "Construction of TianGong process records and lifecyclemodel systems requiring a factory-gate shelled-cashew-kernel input"
  allowed_use: "Route-, site-, period-, grade-, and pack-specific gate-to-gate modelling with representative upstream datasets linked for received nuts, utilities, auxiliary materials, and packaging"
  excluded_use: "Agricultural production, post-gate distribution, retail, consumption, or end-of-life without added datasets; formulated or further-processed cashew foods; combining mutually exclusive full routes; using provisional ranges as unqualified default LCI amounts"
  required_metadata: "canonical PCR id; CPC context; Tiangong flow UUIDs; site and period; supplier-lot origin; conditioning route; kernel form and grade; moisture or conditioning state and test basis; defect and reject basis; pack material, size, and atmosphere; co-product and waste dispositions; allocation; upstream dataset references"
  required_quality_disclosure: "lot coverage and exclusions; calibration; mass-balance difference; utility allocation; on-site emissions; representativeness; data gaps; proxy datasets; provisional estimates and replacement status; source and method versions"
  update_trigger: "Material change in supplier origin, product specification, route, equipment, utility mix, yield or reject pattern, residue disposition, allocation, pack configuration, measurement method, dataset representativeness, or availability of evidence that replaces a provisional range"
