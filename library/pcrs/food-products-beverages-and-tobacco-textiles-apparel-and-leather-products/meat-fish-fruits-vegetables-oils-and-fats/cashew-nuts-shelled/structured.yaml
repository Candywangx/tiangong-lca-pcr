      rule: "Assign each lot to exactly one primary conditioning branch: steam/wet-heat, dry-heat/roasting, hot-oil, or another documented route. If a site uses multiple routes, split their records and outputs into separate unit processes or route-specific datasets; do not apply mutually exclusive branches simultaneously to one lot."
