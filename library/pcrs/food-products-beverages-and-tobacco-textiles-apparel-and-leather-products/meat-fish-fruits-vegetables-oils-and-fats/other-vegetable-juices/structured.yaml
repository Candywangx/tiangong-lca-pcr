      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert volume to mass using a batch- or product-specific density measured at a stated temperature; retain measured volume, density, temperature, and calculation. Do not assume water density."
