  production_route: "Receiving and preparation; extraction and separation; optional formulation, concentration, or reconstitution; stabilization; filling, packaging operations, and controlled storage"
  market_state: "Finished liquid juice, declared as refrigerated, frozen, aseptic shelf-stable, or otherwise shelf-stable, with packaging state disclosed"
functional_unit:
  what: "Other vegetable juice that meets the declared formulation, safety treatment, quality specification, and market state"
  how_much: "1 kg net finished juice, excluding the mass of sales and transport packaging"
  how_well: "Conforming saleable juice with declared vegetable species or blend, soluble-solids or composition specification, pulp or clarification state, concentration or reconstitution route, pathogen-control status, and storage class"
  how_long_or_cycle: "At the plant gate for one production batch; declared shelf life and storage temperature are product qualifiers, not an extension of the reference amount"
