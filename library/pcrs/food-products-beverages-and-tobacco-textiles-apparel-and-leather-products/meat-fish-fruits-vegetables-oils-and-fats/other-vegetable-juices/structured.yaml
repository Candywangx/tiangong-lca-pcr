system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate
      applies_to: "Foreground manufacture"
      rule: "Include all directly controlled operations from receipt of vegetables or juice intermediates through conforming finished juice at the plant gate, including cleaning, utilities, losses, wastewater, and controlled storage."
      source_ids:
        - eu-fdm-bat-2019
        - codex-cxc-1-1969
    - rule_id: boundary_upstream_links
      applies_to: "Purchased inputs"
      rule: "Link vegetables, concentrates, ingredients, packaging, electricity, fuels, steam, water supply, cleaning chemicals, and off-site waste treatment to appropriate upstream datasets without recreating those suppliers inside the foreground boundary."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_conditional_routes
      applies_to: "Concentration, reconstitution, pathogen control, cold storage, and on-site wastewater treatment"
      rule: "Include each conditional operation when performed by the reporting site and disclose excluded operations that are transferred to another facility."
      source_ids:
        - ecfr-21-cfr-120
        - fda-juice-haccp-guidance
        - eu-fdm-bat-2019
    - rule_id: boundary_food_safety_controls
      applies_to: "Juice safety controls"
      rule: "Record sanitation, hazard-control, monitoring, and validated stabilization operations that materially consume inputs, energy, or generate losses. Apply jurisdiction-specific legal requirements and identify the governing regime."
      source_ids:
        - ecfr-21-cfr-120
        - codex-cxc-1-1969
    - rule_id: boundary_exclusions
      applies_to: "Distribution and downstream life cycle"
      rule: "Exclude distribution, retail refrigeration, consumer use, and packaging end-of-life from the default foreground dataset; include them only in a separately declared downstream lifecycle model."
      source_ids:
        - iso-14044-2006
boundary_abstraction:
  declared_starting_condition: "Vegetables, direct juice, puree used as juice, or vegetable juice concentrate received at the manufacturing site with supplier identity, mass, composition or soluble-solids basis, and acceptance status recorded"
  starting_condition_role: "Entry point for foreground manufacturing; cultivation and manufacture of purchased juice intermediates remain upstream"
  product_classification_scope: "Other vegetable juices excluding tomato juice and fruit juices; mixed products require explicit classification and predominant product identity"
  recursive_input_rule: "Purchased other vegetable juice or concentrate remains a visible same-category product input with quantity and supplier dataset reference. Do not recursively expand it as if manufactured by the reporting site."
  upstream_dataset_requirement: "Use geographically and technologically representative upstream datasets for vegetables, purchased juice or concentrate, water, packaging, energy carriers, processing aids, cleaning chemicals, and off-site treatment"
  disclosure: "Declare vegetable species and blend, origin, received form, concentration or reconstitution route, soluble-solids or composition specification, yield basis, stabilization method, storage class, packaging scope, allocation method, site coverage, reference period, and material exclusions"
