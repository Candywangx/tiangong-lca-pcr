  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "reference product"
      rule: "net flatfish mass = gross frozen product mass - external glaze mass; exclude packaging independently"
      inputs:
        - "gross frozen mass"
        - "glaze mass"
        - "packaging mass"
      output: "kg net frozen flatfish"
      source_ids:
        - codex-cxs-36-1981
        - codex-cxs-190-1995
    - id: calc_normalized_inventory
      applies_to: "all inventory rows"
      rule: "normalized amount = included-period amount / dispatched net flatfish mass"
      inputs:
        - "reconciled flow amount"
        - "dispatched net mass"
      output: "amount per kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_process_yield
      applies_to: "preparation and freezing"
      rule: "yield = measured net output mass / measured input mass for the same lot or reconciled period"
      inputs:
        - "input mass"
        - "output mass"
        - "lot or period link"
      output: "kg/kg process yield"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "each process and foreground system"
      rule: "reconcile flatfish, removed material, product, glaze, wastewater-associated material, waste, and inventory change; investigate unexplained residuals"
      inputs:
        - input
        - output
        - waste
        - water
        - glaze
        - "and inventory-change records"
      output: "balance residual and explanation"
      source_ids: []
    - id: calc_shared_energy
      applies_to: "shared utilities"
      rule: "allocate shared energy using a documented physical driver such as runtime, throughput, refrigeration load, occupied capacity, and storage duration"
      inputs:
        - "shared meter"
        - "driver quantities"
        - "included output"
      output: "energy per process output or reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "refrigeration systems"
      rule: "attributable loss = added refrigerant - recovered refrigerant - documented charge increase, by named substance and disclosed allocation driver"
      inputs:
        - "service and charge records"
        - "operating driver"
      output: "kg refrigerant attributable to included operations"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
