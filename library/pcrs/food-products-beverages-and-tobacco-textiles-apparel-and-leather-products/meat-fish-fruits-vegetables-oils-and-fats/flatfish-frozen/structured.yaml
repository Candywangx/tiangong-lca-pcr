allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "multifunctional_foreground_processes"
    rule: "First avoid allocation by collecting separate process data, subdividing operations, or applying a defensible system-expansion approach."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "joint_products_and_co-products"
    rule: "When avoidance is not feasible, use a documented causal physical relationship. Use mass only when it represents that relationship and disclose factors."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic
    applies_to: "residual_multifunctionality"
    rule: "Use economic allocation only when no defensible causal physical relationship is available; document the representative price period and test material co-product sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_status
    applies_to: "heads_viscera_trimmings_rejects_and_recovered_material"
    rule: "Declare whether each separated material is a co-product, animal-feed input, recovered material, treatment input, or waste under the applicable jurisdiction, and disclose credits or burden transfers."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "reception_preparation_freezing_glazing_packaging_storage"
      flow_role: "received, prepared, frozen, glaze, tare, and dispatched masses"
      record_type: "calibrated scale, lot, production, or inventory records"
      raw_fields: "timestamp; lot_id; species; origin; presentation; gross_mass; tare_mass; removed_mass; glaze_mass; net_mass"
      collection_method: "reconcile lot-linked scales while keeping fish, glaze, tare, and packaging distinct"
      unit: "kg"
      frequency: "each lot with periodic reconciliation"
      temporal_coverage: "declared representative production period"
      site_scope: "every included facility and line"
      aggregation_rule: "sum materially equivalent lots and normalize to net reference mass"
      quality_evidence: "calibration; lot traceability; reconciliation; operator review"
    - protocol_id: cp_water_ice
      process_id: "reception_preparation_freezing_glazing"
      flow_role: "preparation water, ice, and glazing water"
      record_type: "meters, ice logs, purchase records, and glaze tests"
      raw_fields: "meter_start; meter_end; ice_mass; supplied_water; retained_glaze; lot_id"
      collection_method: "reconcile supplied water and ice to operations using a disclosed physical driver"
      unit: "kg or m3 with conversion record"
      frequency: "each shift or lot with periodic reconciliation"
      temporal_coverage: "same period as product mass"
      site_scope: "every included preparation and glazing operation"
      aggregation_rule: "subtract unrelated use and normalize to process output or reference product"
      quality_evidence: "meter check; invoice reconciliation; glaze test"
    - protocol_id: cp_energy_storage
      process_id: "freezing_glazing_packaging_storage"
      flow_role: "freezing, storage, and handling energy"
      record_type: "sub-meters, utility meters, invoices, equipment runtime, and storage logs"
      raw_fields: "meter_start; meter_end; equipment_id; runtime; rated_power; throughput; storage_days; occupied_capacity"
      collection_method: "prefer sub-metering; otherwise use documented physical allocation"
      unit: "kWh, MJ, or declared fuel unit"
      frequency: "continuous, shift, or periodic"
      temporal_coverage: "same period as production and storage"
      site_scope: "all included equipment and shared utilities"
      aggregation_rule: "reconcile to invoices and normalize to process output or storage basis"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_residue_wastewater
