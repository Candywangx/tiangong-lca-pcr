      applies_to: "provisional ranges"
      requirement: "Treat every reasoned_estimate range as a screening flag only and replace or explicitly review it before publication-critical use."
      evidence: "review record and representative foreground or source-backed replacement evidence"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "Require product-flow UUID d99b0e6e-06c2-4c08-8ae2-15a6dc1f0116, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and exactly 1 kg net reference mass."
    source_ids: []
  - rule_id: validate_scope_qualifiers
    applies_to: "dataset_identity"
    rule: "Treat the dataset as incomplete when species/origin, upstream dataset, product presentation, glaze, packaging, freezing route, storage regime/duration, geography, or data period is missing."
    source_ids:
      - unsd-cpc-v3-21213
      - codex-cxs-36-1981
  - rule_id: validate_process_coverage
    applies_to: "process_inventory"
    rule: "Require every required process and the complete on-site frozen chain, or a documented zero/not-applicable statement supported by facility evidence."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-36-1981
  - rule_id: validate_mass_reconciliation
    applies_to: "mass_balance"
    rule: "Require lot- or period-consistent reconciliation of received flatfish, prepared and net product, glaze, co-products, residues, rejects, wastewater-associated material, and inventory change; flag unexplained residuals."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "multifunctionality"
    rule: "Require evidence of allocation avoidance or the selected physical/economic method, factors, material status, price period when relevant, and sensitivity disclosure."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_cold_chain_quality
    applies_to: "food_safety_and_quality"
    rule: "Require linked freezing, storage, package-integrity, excursion, and corrective-action records under applicable requirements; do not infer conformity from an average temperature alone."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-36-1981
  - rule_id: validate_data_quality
    applies_to: "foreground_dataset"
    rule: "Require temporal, technological, geographical, completeness, traceability, calibration, missing-data, uncertainty, and provisional-estimate disclosures."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production dataset for frozen-flatfish processing at the processing-facility gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA of declared frozen flatfish when species/origin, upstream production, presentation, facility technology, glaze, packaging, storage duration, geography, data period, and allocation are representative"
  excluded_use: "Direct representation of fishing or aquaculture, live/fresh/chilled flatfish, fillets, fish meat, livers or roes, brine-frozen inputs for further processing, other preservation routes, downstream distribution, retail, cooking, consumption, or end-of-life without added datasets"
  required_metadata: "PCR id and version context; product-flow UUID; species/origin; upstream datasets; received and dispatched presentation; glaze; packaging scope; included operations; freezing and refrigeration technology; storage regime and duration; geography; data period; allocation; co-product/waste status; exclusions/proxies; data owner and review status"
  required_quality_disclosure: "Source-to-row traceability; measurement and calculation methods; calibration and reconciliation; temporal, technological, and geographical representativeness; mass balance; food-safety evidence; allocation sensitivity; missing data; provisional estimates; uncertainty and limitations"
  update_trigger: "Material change in flatfish species or source, received presentation, product specification, preparation/freezing/glazing technology, refrigerant, energy supply, packaging, storage duration, allocation or co-product route, regulation, facility configuration, or representative data period"
