allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "Multi-output processing"
    rule: "Avoid allocation by separately metering or subdividing filleting, mincing, chilling, and packing operations where technically feasible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relation
    applies_to: "Shared operations with saleable fish co-products"
    rule: "Where subdivision is not feasible and a defensible physical relationship represents resource use, allocate shared inputs and emissions using that relationship; wet mass may be used only when it reasonably reflects the underlying process relationship."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_fallback
    applies_to: "Joint outputs without a defensible physical relationship"
    rule: "Use a documented economic relationship only when subdivision and a representative physical relationship are not feasible; report prices, geography, time basis, averaging, and sensitivity to the allocation choice."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_not_coproduct
    applies_to: "Offcuts, spoiled fish, sludge, and packaging waste"
    rule: "Classify an output as a co-product only when it leaves as a product with a documented destination and value or function; otherwise model it as waste and include treatment attributable to the foreground system."
    source_ids:
      - eu-pef-2021-2279
