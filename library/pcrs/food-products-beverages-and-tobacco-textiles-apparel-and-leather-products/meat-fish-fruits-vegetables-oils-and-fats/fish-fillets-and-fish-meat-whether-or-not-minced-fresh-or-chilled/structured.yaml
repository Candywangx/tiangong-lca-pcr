validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "Reference product"
    rule: "Confirm exactly 1 kg net product mass, the specified product-flow UUID, Mass property UUID, unit-group UUID, kg unit, and all required qualifiers."
    source_ids: []
  - rule_id: validate_scope_state
    applies_to: "Product identity and boundary"
    rule: "Reject datasets for frozen or otherwise preserved product; verify that the received form and included processing route can produce the declared fresh or chilled fillet or fish-meat output."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_cold_chain_records
    applies_to: "Receipt through dispatch"
    rule: "Require time-temperature records and documented response to deviations for every declared control point."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_mass_balance
    applies_to: "Each process and reporting period"
    rule: "Reconcile fish inputs with edible output, saleable co-products, rejects, waste, and documented carryover; investigate rather than automatically accept values outside the provisional QA screen."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "Multi-output operations"
    rule: "Confirm that subdivision was considered first, the selected driver is justified, outputs are not double counted as both co-product and waste, and allocation fractions reconcile to the unallocated total."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_provisional_ranges
    applies_to: "QA guardrails"
    rule: "Treat all reasoned_estimate ranges as non-normative screening values; flag exceedances for review and replace or confirm the ranges with reviewed evidence before activation."
    source_ids: []
  - rule_id: validate_data_completeness
    applies_to: "Foreground package"
    rule: "Require full facility, temporal, route, utility, packaging, co-product, waste, wastewater, refrigerant, and source disclosure or an explicit documented exclusion."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production data package for fresh or chilled fish fillets and fish meat"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product and process LCA where species or species mix, origin, received form, processing route, market state, geography, technology, allocation, and data period are representative"
  excluded_use: "Frozen, preserved, cooked, or non-fish products; upstream capture or aquaculture impacts without a linked upstream dataset; retail, consumer preparation, or end-of-life claims outside the declared boundary"
  required_metadata: "PCR id and status; product-flow UUID; species and origin; received form; product form; skin/bone/mincing state; chilling medium and temperature criterion; packaging; facility geography; technology route; period; allocation method; co-product and waste destinations; upstream dataset references"
  required_quality_disclosure: "Temporal, geographic, and technological representativeness; facility and output coverage; measurement and calibration evidence; mass-balance result; missing-data treatment; provisional estimate use; allocation sensitivity; food-safety criterion and deviations"
  update_trigger: "Change in species mix, origin, received form, yield, equipment, refrigeration system, chilling or packing method, co-product destination, allocation driver, facility mix, regulation, or evidence that materially changes normalized results or scope"
data_sources:
  - id: "codex-cxc-52-2003"
    type: "standard"
    reference: "FAO/WHO Codex Alimentarius, CXC 52-2003, Code of Practice for Fish and Fishery Products, official PDF: https://www.fao.org/input/download/standards/10273/CXP_052e.pdf (retrieved 2026-08-11)"
    used_for: "Fresh/chilled product meaning; filleting, skinning, trimming, washing and hygiene process decomposition; time-temperature and cold-chain controls; quality and food-safety records"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on the use of the Environmental Footprint methods, Annex I Product Environmental Footprint method: https://eur-lex.europa.eu/eli/reco/2021/2279/oj/eng (retrieved 2026-08-11)"
    used_for: "System-boundary disclosure; allocation hierarchy; foreground data quality, representativeness, completeness, and validation requirements"
