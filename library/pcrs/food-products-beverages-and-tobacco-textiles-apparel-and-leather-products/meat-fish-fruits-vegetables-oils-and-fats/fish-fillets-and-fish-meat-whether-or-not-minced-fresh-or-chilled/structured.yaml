      collection_method: "Calibrated scale and calibrated temperature instrument, linked to production lot"
      unit: "kg; deg C"
      frequency: "Each lot and each required control point"
      temporal_coverage: "Representative continuous 12-month period or complete declared campaign"
      site_scope: "Every included facility and outsourced foreground step"
      aggregation_rule: "Sum masses by lot and product; calculate mass-weighted annual or campaign intensity; retain exceptional lots and explain exclusions"
      quality_evidence: "Calibration records; lot traceability; temperature-monitoring record; reconciliation sign-off"
    - protocol_id: cp_utilities_materials
      process_id: "all_processes"
      flow_role: "Water, ice, energy, packaging, and cleaning materials"
