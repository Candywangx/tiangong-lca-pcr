      collection_method: "Submetering preferred; otherwise reconciled procurement/stock record with documented engineering allocation"
      unit: "kg; m3; kWh; MJ"
      frequency: "Per batch where available and at least monthly"
      temporal_coverage: "Same period as product output, normally 12 consecutive months"
      site_scope: "Every included facility; separate material or energy carrier"
      aggregation_rule: "Net use divided by allocated packed output after stock reconciliation"
      quality_evidence: "Meter calibration; invoices; stock ledger; allocation worksheet"
    - protocol_id: cp_output_destination_mass
