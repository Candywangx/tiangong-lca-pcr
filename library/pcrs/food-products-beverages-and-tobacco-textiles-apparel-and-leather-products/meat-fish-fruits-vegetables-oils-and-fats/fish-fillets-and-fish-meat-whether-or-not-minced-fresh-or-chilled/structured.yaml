      unit: "kg"
      frequency: "Each dispatch or disposal event"
      temporal_coverage: "Same period as reference product"
      site_scope: "Every included facility and external destination category"
      aggregation_rule: "Sum by output identity and destination; no netting of product and waste"
      quality_evidence: "Scale calibration; sales or transfer record; waste manifest; mass-balance reconciliation"
