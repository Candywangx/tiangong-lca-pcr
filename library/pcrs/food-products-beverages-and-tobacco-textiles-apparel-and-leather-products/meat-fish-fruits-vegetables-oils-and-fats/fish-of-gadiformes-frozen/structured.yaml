      collection_method: "Calibrated scales linked to lot and production records"
      unit: "kg"
      frequency: "Each lot and reporting-period close"
      temporal_coverage: "At least the represented production period, including start/end stock"
      site_scope: "All facilities and lines represented"
      aggregation_rule: "Sum compatible lots; reconcile input + opening stock = outputs + losses + closing stock before normalization"
      quality_evidence: "Scale calibration, signed lot records, ERP extracts, and documented reconciliation"
    - protocol_id: cp_utility_records
      process_id: "fish_preparation"
