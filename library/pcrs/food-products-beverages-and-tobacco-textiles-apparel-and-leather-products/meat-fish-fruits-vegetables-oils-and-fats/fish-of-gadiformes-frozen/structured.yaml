      record_type: "Water meters, discharge meters, sampling, and treatment records"
      raw_fields: "water_input; product_retention; evaporation; wastewater_mass_or_volume; pollutant_load; destination"
      collection_method: "Metering plus documented balance; sample pollutant loads under applicable permit or plant plan"
      unit: "kg, m3, and measured load units"
      frequency: "Meter readings at least monthly; sampling at required frequency"
      temporal_coverage: "Same period as production"
      site_scope: "All represented wet-processing areas and discharge points"
      aggregation_rule: "Reconcile water input to retained, evaporated, reused, and discharged quantities without inventing missing pollutant concentrations"
      quality_evidence: "Meter calibration, laboratory results, permit records, and balance closure"
    - protocol_id: cp_refrigerant_balance
      process_id: "freezing_glazing_packing_storage"
      flow_role: "Refrigerant make-up, recovery, inventory, and fugitive loss"
      record_type: "Purchase, service, cylinder, and equipment records"
      raw_fields: "refrigerant_identity; opening_stock; purchases; additions; recovery; transfer; closing_stock; equipment_id; service_date"
      collection_method: "Technician records and mass balance by chemical"
      unit: "kg"
      frequency: "Each service event and annual/reporting-period close"
      temporal_coverage: "Same period as production, with stock boundaries"
