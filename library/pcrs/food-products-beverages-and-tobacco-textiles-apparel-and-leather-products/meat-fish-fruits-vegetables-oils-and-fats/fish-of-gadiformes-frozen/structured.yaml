allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Species, product forms, batches, and separable preparation lines"
    rule: "First avoid allocation by collecting separate records or subdividing operations where inputs and outputs can be causally assigned without creating artificial burden-free products."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_reuse_closed_loop
    applies_to: "Internal rework returned to the same product route"
    rule: "Do not create a co-product credit for internal rework; keep its energy, handling, losses, and stock movement in the foreground mass balance."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relation
    applies_to: "Joint fish products and co-products where subdivision is not feasible"
    rule: "Use a documented physical relation only when it represents the causal use or generation of the joint outputs; do not assume mass allocation is automatically causal."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_fallback
    applies_to: "Saleable co-products without a defensible physical causal relation"
    rule: "If allocation remains necessary, use contemporaneous net economic values with declared geography, period, price source, zero or negative-value treatment, and sensitivity analysis."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_destination
    applies_to: "Waste, residues, wastewater, and rejected product"
    rule: "Record treatment inputs, recovered outputs, fees or revenues, and the point where responsibility transfers; do not relabel a co-product as waste or omit burdens solely because a stream leaves the site."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "receipt_holding_fish_preparation_freezing_glazing_packing_storage"
      flow_role: "Fish inputs, transfers, product, stock, rejects, and co-products"
      record_type: "Scale, ERP, batch, and inventory records"
