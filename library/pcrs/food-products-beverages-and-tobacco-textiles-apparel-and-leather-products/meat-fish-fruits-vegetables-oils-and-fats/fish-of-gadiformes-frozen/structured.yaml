      collection_method: "Direct measurement preferred; documented engineering allocation otherwise"
      unit: "kWh, MJ, kg, L"
      frequency: "Continuous or per shift, reconciled monthly"
      temporal_coverage: "Same period as production plus represented storage"
      site_scope: "All relevant freezing, packing, and cold-store equipment"
      aggregation_rule: "Aggregate separately by carrier and process; allocate shared cold storage using measured energy and compatible product-time"
