    - protocol_id: cp_glaze_net_mass
      process_id: "freezing_glazing_packing_storage"
      flow_role: "Glaze application and net fish mass"
      record_type: "Batch recipe, water meter, gross/net weight, and deglazing test"
      raw_fields: "lot_id; pre_glaze_mass; applied_water; post_glaze_mass; deglazed_mass; test_method; sample_count"
      collection_method: "Lot measurement using documented glaze-exclusion method"
      unit: "kg"
      frequency: "Each represented glazing campaign and release lot"
      temporal_coverage: "Same period as reference output"
      site_scope: "Every glazing line and product form represented"
      aggregation_rule: "Calculate retained glaze and net fish by lot; production-weight aggregate only compatible products"
