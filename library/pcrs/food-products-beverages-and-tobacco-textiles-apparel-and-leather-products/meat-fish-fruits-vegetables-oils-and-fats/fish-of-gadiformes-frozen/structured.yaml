    - protocol_id: cp_residue_destination
      process_id: "receipt_holding_fish_preparation_packing_storage"
      flow_role: "Rejects, co-products, organic residues, and packaging waste"
      record_type: "Weighbridge, bin, sales, and waste-transfer records"
      raw_fields: "material; mass; wet_or_dry_basis; destination; sale_or_fee; transporter; treatment"
      collection_method: "Weigh each dispatch or use documented container tare and count"
      unit: "kg and currency where relevant"
      frequency: "Each transfer"
      temporal_coverage: "Full represented production period"
      site_scope: "All represented lines and contracted destinations"
      aggregation_rule: "Aggregate separately by material and destination; preserve saleable co-products separately from waste"
