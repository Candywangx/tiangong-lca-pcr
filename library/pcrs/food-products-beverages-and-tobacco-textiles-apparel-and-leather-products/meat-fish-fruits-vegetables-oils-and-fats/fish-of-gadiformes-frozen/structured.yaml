      record_type: "BOM, issue, return, scrap, and packed-unit records"
      raw_fields: "material; unit_mass; units_issued; units_returned; units_packed; scrap; reusable_cycles"
      collection_method: "Verified BOM plus periodic weighing and inventory reconciliation"
      unit: "kg"
      frequency: "Per configuration and reporting period"
      temporal_coverage: "Same period as packed output"
      site_scope: "All represented sale configurations"
      aggregation_rule: "Sum by material; reconcile issued = packed + scrap + returns + stock change"
      quality_evidence: "Supplier specifications, check weights, inventory records, and reusable-asset logs"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground exchanges"
      rule: "normalized amount = reporting-period exchange / reporting-period accepted net frozen fish excluding packaging and added glaze"
      inputs:
        - "Exchange totals"
        - "accepted net frozen fish"
      output: "Exchange per 1 kg reference product"
      source_ids:
        - codex-cxs-190-1995
    - id: calc_mass_balance
      applies_to: "Each process and the full facility route"
      rule: "opening stock + measured inputs = measured outputs + documented losses + closing stock; investigate rather than force-close unexplained difference"
      inputs:
        - Fish
        - "water where relevant"
        - co-products
        - residues
        - rejects
        - glaze
        - packaging
        - "and stocks"
      output: "Reconciled balance and disclosed closure difference"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_glaze_exclusion
      applies_to: "Glazed frozen product"
      rule: "net fish mass = gross glazed product mass - measured retained glaze mass using the declared test method"
      inputs:
        - "Gross mass"
        - "deglazed mass or retained-glaze measurement"
      output: "Net fish mass and glaze mass"
      source_ids:
        - codex-cxs-190-1995
    - id: calc_refrigerant_loss
      applies_to: "Freezing and cold-store equipment"
      rule: "loss = opening refrigerant inventory + purchases + transfers in - closing inventory - recovered refrigerant - transfers out"
      inputs:
        - "Refrigerant stock"
        - purchase
        - service
        - recovery
        - "and transfer records"
      output: "Loss to air by refrigerant chemical identity"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_allocation_factor
      applies_to: "Unavoidable joint production"
      rule: "physical factor = selected causal physical quantity for output / total selected causal quantity; economic factor = net value of output / total positive net value, with zero or negative values treated explicitly"
      inputs:
        - "Output quantities"
        - "causal measure or contemporaneous net values"
      output: "Declared allocation factors and sensitivity result"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and raw fish"
      requirement: "Preserve species or species mix, wild/farmed source, origin, product form, glazing state, lot, and supplier linkage; do not aggregate materially different products without disclosed weights."
      evidence: "Product specification, supplier records, lot traceability, and unsd-cpc-3-21214"
    - id: dq_temporal_geographic_technology
      applies_to: "All inputs and outputs"
      requirement: "Use foreground records and upstream datasets representative of the declared production period, facility geography, fishing/aquaculture system, preparation route, freezing technology, and storage duration."
      evidence: "Coverage matrix, dataset metadata, and variance explanation"
    - id: dq_completeness
      applies_to: "Process map"
      requirement: "Demonstrate that all required and applicable conditional processes, product flows, wastes, elementary emissions, utilities, refrigerants, and destinations were assessed; quantify any exclusion."
      evidence: "Completed inventory checklist and mass/energy reconciliation"
    - id: dq_food_safety_release
      applies_to: "Accepted reference output"
      requirement: "Link each represented lot to applicable hygiene, hazard-control, temperature, sensory/physical, and release records; PCR conformance does not replace legal food-safety compliance."
      evidence: "HACCP or equivalent records, temperature logs, inspection and release records, and codex-cxc-52-2003; codex-cxs-190-1995"
    - id: dq_estimate_replacement
      applies_to: "Provisional QA ranges"
      requirement: "Treat every reasoned_estimate range as a screening flag, not a default truth; replace or explicitly approve it with representative foreground or reviewed source evidence before activation."
      evidence: "Review decision, foreground distribution, or source-backed replacement"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require Product flow d2a5f478-6f93-455d-83df-ddfd9e622c9d, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, kg, and exactly 1 kg accepted net frozen fish excluding packaging and added glaze."
    source_ids:
      - unsd-cpc-3-21214
      - codex-cxs-190-1995
  - rule_id: validate_scope_identity
    applies_to: "Product category"
    rule: "Reject records that do not demonstrate Gadiformes identity and a frozen whole or declared dressed non-fillet/non-minced form; require a different PCR for excluded forms."
    source_ids:
      - unsd-cpc-3-21214
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Require every reference-flow qualifier or an explicit not-applicable justification, including species, source system, origin, form, freezing technology, glaze basis, package configuration, storage condition, geography, and period."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-190-1995
  - rule_id: validate_process_coverage
    applies_to: "Foreground inventory"
    rule: "Require receipt, applicable preparation, freezing, optional glazing disclosure, packaging, frozen storage, dispatch, cleaning allocation, rejects, residues, wastewater, and refrigerant review; identify every skipped conditional process."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-190-1995
  - rule_id: validate_mass_balance
    applies_to: "Process and route mass balances"
    rule: "Require measured or calculated closure using aligned periods and bases; report unexplained differences rather than silently assigning them to product, waste, or evaporation."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_cold_chain
    applies_to: "Freezing and frozen storage"
    rule: "Require time-temperature evidence for the declared freezing and storage condition; if claiming the CXS 190 benchmark, verify -18 °C or colder at the thermal centre after stabilization and the stated storage instruction."
    source_ids:
      - codex-cxs-190-1995
  - rule_id: validate_glaze_net_content
    applies_to: "Glazed products"
    rule: "Require measured glaze and net fish mass separately and prevent added glaze water from entering the 1 kg reference amount."
    source_ids:
      - codex-cxs-190-1995
  - rule_id: validate_allocation
    applies_to: "Multi-output operations"
    rule: "Require the allocation hierarchy, selected basis, input data, factors, zero/negative-value treatment, and sensitivity result; fail if saleable co-products are omitted or treated as waste without evidence."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_reasoned_estimates
    applies_to: "All provisional ranges"
    rule: "Flag every value outside a provisional QA guardrail for investigation and flag every unreplaced reasoned_estimate before activation; a value inside a broad range is not proof of quality."
    source_ids: []
  - rule_id: validate_uuid_completeness
    applies_to: "Tiangong references"
    rule: "Accept the exact UUIDs only for the reference flow, Mass property, and Units of mass group; keep every other semantic inventory flow unresolved until exact Tiangong review and reject approximate UUID substitution."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for frozen Gadiformes fish at the processing-facility gate"
  downstream_use: "May support secondary_dataset or background_dataset use after independent review, validation, and publication"
  allowed_use: "Product-footprint, process comparison, supply-chain, and life-cycle modelling where species/form, source system, geography, technology, glaze basis, storage duration, allocation, and data quality are compatible"
  excluded_use: "Unqualified proxy for other fish orders, fillets or minced meat, fresh/chilled or otherwise preserved fish, fisheries or aquaculture production alone, post-dispatch cold chain, retail, cooking, nutrition, or food-safety certification"
  required_metadata: "PCR id and version; reference-flow UUIDs; species/mix; wild/farmed source; origin; received and sale forms; freezing and glazing methods; net-mass method; package configuration; facility geography; period; storage temperature/duration; process coverage; allocation method; upstream dataset identities"
  required_quality_disclosure: "Foreground and upstream coverage, sample and meter quality, mass/energy closure, estimate share, data gaps, allocation sensitivity, co-product and waste destinations, temperature evidence, glaze exclusion, refrigerant calculation, and unresolved UUIDs"
  update_trigger: "Material change in species mix, source system, facility or line, preparation form, freezing technology, glaze practice, packaging, storage duration, co-product market, allocation basis, refrigerant, upstream datasets, regulation, Codex guidance, or reviewed range evidence"
