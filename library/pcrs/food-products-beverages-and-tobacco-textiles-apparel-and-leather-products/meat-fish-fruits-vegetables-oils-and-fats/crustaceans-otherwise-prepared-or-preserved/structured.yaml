system_boundary:
  rules:
    - rule_id: sb_gate_to_gate
      applies_to: "foreground_manufacturing"
      rule: "Include all on-site operations from accepted incoming crustacean material through release of packaged product at the manufacturing plant gate, including utilities, cleaning, refrigeration, and on-site emission or waste handling attributable to production."
      source_ids:
        - codex-cxc-52-2003
        - eu-pef-2021-2279
        - eu-fdm-bat-2019-2031
    - rule_id: sb_route_conditionals
      applies_to: "route_specific_operations"
      rule: "Model only the preparation, cooking, frying, smoking, marination, sauce, breading, canning, pasteurization, sterilization, cooling, freezing, and storage operations that occur for the declared product; provide a process-flow diagram and identify excluded alternatives."
      source_ids:
        - unsd-cpc-3-0-21270
        - codex-cxc-52-2003
    - rule_id: sb_upstream_links
      applies_to: "purchased_inputs"
      rule: "Represent raw crustacean production, ingredients, additives, packaging, energy, water supply, refrigerants, and external treatment with linked upstream datasets rather than omitting their burdens."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_foreground_streams
      applies_to: "waste_and_emissions"
      rule: "Identify foreground co-products, residues, product losses, wastewater streams, waste gases, refrigerant losses, and direct emissions to air, water, and soil; keep clean segregated water distinct from contaminated wastewater."
      source_ids:
        - eu-pef-2021-2279
        - eu-fdm-bat-2019-2031
    - rule_id: sb_cutoff_disclosure
      applies_to: "exclusions_and_cutoffs"
      rule: "Avoid cut-offs. Any excluded process or flow must be explicitly identified, justified using material, energy, and environmental significance, and reported as a limitation; known hazardous, toxic, or route-defining flows may not be excluded solely for low mass."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_downstream_exclusion
      applies_to: "downstream_stages"
      rule: "Exclude distribution beyond the plant gate, retail, consumer preparation, consumption, and end-of-life from this foreground dataset; broader studies must link separate datasets and avoid double counting."
      source_ids:
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "Accepted crustacean raw material at the processing facility, with species or commercial group, wild or farmed origin when known, supplier, incoming live/chilled/frozen/previously processed state, shell state, preservation history, temperature condition, additives, lot mass, and rejection status declared"
  starting_condition_role: "Upstream product input to foreground manufacturing"
  product_classification_scope: "Crustaceans prepared or preserved beyond simple freezing, salting, drying, or brining, consistent with CPC 3.0 subclass 21270"
  recursive_input_rule: "A purchased input already within this PCR category is linked as a separate upstream product dataset and is not recursively decomposed inside the consuming process; its mass, route, supplier, and dataset reference must be disclosed"
  upstream_dataset_requirement: "Link representative datasets for wild capture or aquaculture and primary handling of raw crustaceans, all purchased ingredients and additives, packaging materials, electricity, fuels, water supply, refrigerants, and externally treated wastes or wastewater"
  disclosure: "Declare included and omitted route steps, facility and geography, reporting period, product mix, allocation, material state, formulation, thermal or preservation treatment, cooling or storage regime, packaging, upstream dataset choices, cut-offs, and data gaps"
