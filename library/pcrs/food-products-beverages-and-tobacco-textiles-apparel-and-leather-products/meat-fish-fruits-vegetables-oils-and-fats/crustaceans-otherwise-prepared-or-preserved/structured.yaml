allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared_processes_and_outputs"
    rule: "Avoid allocation first by subdividing production lines, batches, meters, and process records or by expanding the system when the additional function is explicitly part of the study."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "unavoidable_multifunctionality"
    rule: "When subdivision or system expansion is not practicable, allocate inputs and outputs using a documented causal physical relationship such as independently measured mass, processing time, equipment load, or another driver relevant to the shared operation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relationship
    applies_to: "no_relevant_physical_relationship"
    rule: "Use another relationship, including economic value at the specific production stage, only after documenting why subdivision, system expansion, and relevant physical allocation are not applicable; disclose price period, geography, source, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residue_status
    applies_to: "shells_offcuts_recovered_material_and_waste"
    rule: "Determine whether each shell, offcut, spent medium, recovered ingredient, or other residue is a co-product or waste from its legal status, actual destination, quality specification, and transaction evidence; do not assign avoided burdens automatically."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: allocation_factor_check
    applies_to: "allocated_inventory"
    rule: "Allocation factors for each shared inventory block must be non-negative, mutually exclusive, sum to 1 within rounding tolerance, and preserve the unallocated totals in an audit table."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_materials
      process_id: "receipt_preparation_preservation_processing_cooling_storage_packaging_release_cleaning_waste_management"
      flow_role: "raw material, intermediate, ingredients, additives, chemicals, and final product"
      record_type: "weighbridge, calibrated scale, recipe, batch, invoice, and stock record"
      raw_fields: "lot_id; product_id; supplier; species_or_group; origin; incoming_state; shell_state; material_id; concentration; opening_stock; received; issued; returned; closing_stock; measured_mass; timestamp"
      collection_method: "Reconcile calibrated scale and batch records with procurement and stock change; retain recipe revisions and rejected-lot records"
      unit: "kg and declared concentration basis"
      frequency: "each lot or batch, aggregated monthly"
      temporal_coverage: "full representative reporting period; normally 12 consecutive months or a complete seasonal campaign with justification"
      site_scope: "all included lines and production shifts at the declared facility"
      aggregation_rule: "Sum consumed mass by material and route, link to released product lots, and normalize under calc_reference_normalization"
      quality_evidence: "calibration records; inventory reconciliation; lot traceability; signed recipe and release records"
    - protocol_id: cp_route_conditions
      process_id: "receipt_preparation_preservation_processing_cooling_storage_packaging_release"
      flow_role: "processing route and product state"
      record_type: "process log, HACCP or control record, equipment historian, and release specification"
      raw_fields: "lot_id; process_step; equipment_id; start_time; end_time; temperature; pressure; humidity; storage_condition; preservation_medium; cooking_or_treatment_status; deviation; corrective_action"
      collection_method: "Export verified process records and retain route-specific critical or quality control evidence without replacing applicable food-safety requirements"
      unit: "native process units"
      frequency: "each lot and monitored control interval"
      temporal_coverage: "full reporting period"
      site_scope: "all included route equipment"
      aggregation_rule: "Associate each lot with the steps actually used; summarize duration and condition distributions without averaging away deviations"
      quality_evidence: "instrument calibration; reviewed control logs; deviation and release decisions"
    - protocol_id: cp_utility_meters
      process_id: "receipt_preparation_preservation_processing_cooling_storage_packaging_release_cleaning_waste_management"
      flow_role: "water, ice, electricity, fuel, steam, heat, refrigeration, and compressed air"
      record_type: "submeter, utility invoice, tank gauge, production historian, and equipment log"
      raw_fields: "meter_id; utility_type; opening_reading; closing_reading; unit; timestamp; equipment_id; line_id; operating_hours; production_mass; excluded_use; reused_water"
      collection_method: "Prefer process or line submeters; reconcile to site totals and use a documented physical driver for shared services"
      unit: "native meter or invoice unit"
      frequency: "continuous, shift, batch, or monthly according to source"
      temporal_coverage: "full reporting period with startup, shutdown, cleaning, and storage included"
      site_scope: "all included foreground operations"
      aggregation_rule: "Subtract excluded uses, prevent double counting between meters, allocate shared totals under calc_shared_resources, then normalize"
      quality_evidence: "meter calibration or verification; invoices; site reconciliation; allocation worksheet"
    - protocol_id: cp_packaging_records
      process_id: "packaging_release"
      flow_role: "primary and sale-unit packaging"
      record_type: "packaging specification, bill of materials, issue and scrap records, and component weighing"
      raw_fields: "product_id; packaging_component; material; supplier; component_mass; units_issued; units_returned; units_scrapped; released_units"
      collection_method: "Verify component mass by specification or representative weighing and reconcile issue, return, and scrap quantities"
      unit: "kg and item count"
      frequency: "each packaging specification and production lot"
      temporal_coverage: "full reporting period"
      site_scope: "all packaging lines serving the product"
      aggregation_rule: "Calculate packaging consumed as issued minus returned, separate scrap, and divide by released net product mass"
      quality_evidence: "approved specification; scale calibration; stock reconciliation; packaging change history"
    - protocol_id: cp_residue_waste_records
      process_id: "receipt_preparation_preservation_processing_packaging_release_cleaning_waste_management"
      flow_role: "co-products, shells, offcuts, rejects, spent media, packaging scrap, sludge, and other wastes"
      record_type: "bin or container weighing, waste manifest, sales record, transfer ticket, and treatment certificate"
      raw_fields: "stream_id; material_description; legal_status; wet_or_dry_basis; mass; destination; treatment; sale_value; batch_or_period; transporter; receipt"
      collection_method: "Weigh each segregated stream where practicable and reconcile internal transfers with external destination records"
      unit: "kg"
      frequency: "each transfer, aggregated monthly"
      temporal_coverage: "full reporting period"
      site_scope: "all included foreground operations and destinations"
      aggregation_rule: "Sum by stream, status, and destination; internal transfers cancel once between processes; external outputs remain exchanges"
      quality_evidence: "calibrated scale; manifest or transfer receipt; destination and status evidence"
    - protocol_id: cp_emission_monitoring
      process_id: "receipt_preparation_preservation_processing_cooling_storage_cleaning_waste_management"
      flow_role: "wastewater, waste gas, direct emissions, and refrigerant loss"
      record_type: "flow meter, composite or spot sample, laboratory result, stack test, fuel record, refrigerant service log, and treatment report"
      raw_fields: "stream_id; location; flow_or_activity; sampling_period; concentration; pollutant; analytical_method; detection_limit; fuel_use; emission_factor; refrigerant_charge; top_up; recovery; unit"
      collection_method: "Monitor relevant streams at representative points; pair concentrations with flow for the same period; use documented factors only when direct measurement is unavailable"
      unit: "native measurement units"
      frequency: "frequency appropriate to variability and applicable permits; at least sufficient to represent the reporting period"
      temporal_coverage: "full reporting period and all operating modes"
      site_scope: "all direct discharge and emission points attributable to the foreground system"
      aggregation_rule: "Calculate loads under calc_emission_load, keep below-detection handling explicit, and allocate shared emissions under calc_shared_resources"
      quality_evidence: "laboratory accreditation or method record; instrument calibration; chain of custody; permit report; service record"
    - protocol_id: cp_reference_release
      process_id: "packaging_release"
      flow_role: "reference product output and qualifiers"
      record_type: "release record, label, product specification, warehouse transaction, and sales-unit weight check"
      raw_fields: "lot_id; reference_flow_uuid; species_or_group; origin; route; formulation; shell_state; cooking_status; package_type; net_mass; storage_condition; shelf_life; released_mass; release_status"
      collection_method: "Link released product mass and every required qualifier to the production and packaging records used in the inventory"
      unit: "kg"
      frequency: "each released lot"
      temporal_coverage: "full reporting period"
      site_scope: "declared facility and product variants"
      aggregation_rule: "Include only released conforming mass in the denominator and preserve excluded or rejected mass as separate waste or rework records"
      quality_evidence: "release authorization; label and specification; calibrated net-weight checks; traceability link"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground exchanges"
      rule: "normalized exchange = attributable exchange quantity / released net product mass; multiply by 1 kg reference amount"
      inputs:
        - "attributable exchange quantity"
        - "released net product mass from cp_reference_release"
      output: "exchange amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_material_consumption
      applies_to: "raw materials, ingredients, additives, chemicals, and packaging"
      rule: "consumed = opening stock + receipts - closing stock - documented returns; reconcile with direct issue and batch records"
      inputs:
        - stock
        - purchase
        - return
        - issue
        - recipe
        - "and batch fields from cp_lot_materials or cp_packaging_records"
      output: "consumed mass by material and product route"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "each process and complete foreground system"
      rule: "reconcile mass inputs with product, co-product, waste, wastewater, evaporation, retained water, and other quantified outputs on consistent wet, dry, or concentration bases; investigate and disclose the residual"
      inputs:
        - "material records"
        - wastewater
        - residues
        - "product transfers"
        - "moisture and concentration conversions"
      output: "mass-balance table and residual by process and reporting period"
      source_ids:
        - eu-pef-2021-2279
        - eu-fdm-bat-2019-2031
    - id: calc_shared_resources
      applies_to: "shared utilities, cleaning, storage, emissions, and treatment"
      rule: "assign direct-metered quantities first; allocate remaining shared quantity using the most causal verified driver such as operating time, equipment load, water flow, or product mass; preserve total and factor sum"
      inputs:
        - "site and submeter totals"
        - "driver records"
        - "excluded uses"
        - "released product by route"
      output: "attributable shared inventory and allocation audit table"
      source_ids:
        - eu-pef-2021-2279
        - eu-fdm-bat-2019-2031
    - id: calc_emission_load
      applies_to: "wastewater and waste-gas pollutants"
      rule: "pollutant load = matched stream flow or gas volume × representative concentration, with density, dry or wet basis, reference conditions, and unit conversions documented"
      inputs:
        - flow
        - concentration
        - "sampling period"
        - "analytical result"
        - "gas conditions"
      output: "pollutant mass per reporting period and per reference product"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_refrigerant_loss
      applies_to: "refrigeration systems"
      rule: "loss = verified top-up + opening charge - closing charge - recovered quantity - documented transfers, with negative or implausible results investigated"
      inputs:
        - "refrigerant charge"
        - top-up
        - recovery
        - transfer
        - "and service records"
      output: "refrigerant-specific loss to air allocated to reference product"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_allocation
      applies_to: "multifunctional process blocks"
      rule: "apply the hierarchy and evidence requirements in Section 7; store unallocated totals, factor, driver, assigned amount, and sensitivity for every output"
      inputs:
        - "process totals"
        - "output quantities"
        - "physical driver or economic data"
        - "allocation decision"
      output: "allocated inventory by output with factor sum equal to 1"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_traceability
      applies_to: "reference product and raw material"
      requirement: "Link each included released product lot to species or commercial group, origin when known, incoming state, processing route, formulation, packaging, and source lots."
      evidence: "lot genealogy; supplier and receipt records; route logs; release specification; codex-cxc-52-2003"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Cover all known material and energy inputs, products, co-products, wastes, wastewater, and direct emissions within the declared boundary; report reconciliation residuals, cut-offs, and data gaps."
      evidence: "process-flow diagram; mass, water, and energy reconciliations; emission inventory; eu-pef-2021-2279; eu-fdm-bat-2019-2031"
    - id: dq_temporal_coverage
      applies_to: "activity data"
      requirement: "Use a full representative period, normally 12 consecutive months; a complete seasonal campaign is acceptable when annual operation is not representative and the limitation is documented."
      evidence: "dated meter, batch, stock, waste, emission, and release records; production calendar; BAT yearly-average basis in eu-fdm-bat-2019-2031"
    - id: dq_representativeness
      applies_to: "foreground and linked datasets"
      requirement: "Disclose technological, geographical, time-related representativeness, precision, methodological consistency, and completeness for foreground and material upstream datasets."
      evidence: "data-quality assessment and dataset metadata; eu-pef-2021-2279"
    - id: dq_measurement_control
      applies_to: "measured and calculated values"
      requirement: "Retain calibration, analytical method, detection-limit, sampling, chain-of-custody, meter reconciliation, and calculation-version evidence appropriate to each record."
      evidence: "calibration certificates; laboratory and sampling records; calculation workbook or reproducible script; codex-cxc-52-2003; eu-fdm-bat-2019-2031"
    - id: dq_route_conditions
      applies_to: "route-specific process controls"
      requirement: "Retain the treatment, cooling, storage, and deviation records needed to prove which operations occurred and that released lots represent the declared market state; do not infer food-safety compliance from LCA data alone."
      evidence: "process historian; monitored control records; deviation and corrective-action records; release decision; codex-cxc-52-2003"
    - id: dq_allocation_audit
      applies_to: "shared and multifunctional inventory"
      requirement: "Preserve direct measurements, allocation hierarchy decision, driver, factor calculation, factor sum, price basis when used, and sensitivity."
      evidence: "allocation audit table and supporting records; eu-pef-2021-2279"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference_flow"
    rule: "The reference product UUID, Mass flow-property UUID, Units of mass UUID, 1 kg amount, and net-product basis must match Section 3."
    source_ids: []
  - rule_id: val_required_qualifiers
    applies_to: "dataset_metadata"
    rule: "Every required qualifier must be present and consistent across reference flow, product description, process records, packaging, and release data."
    source_ids:
      - unsd-cpc-3-0-21270
      - codex-cxc-52-2003
  - rule_id: val_scope_exclusions
    applies_to: "product_scope"
    rule: "Reject complete prepared meals, simple frozen/salted/dried/brined crustaceans, extracts, and juices from this PCR unless a separately justified broader study uses this dataset only for the qualifying prepared-crustacean component."
    source_ids:
      - unsd-cpc-3-0-21270
  - rule_id: val_process_route
    applies_to: "process_map"
    rule: "Every operation actually used by the declared route must appear in the process-flow diagram and inventory; unused alternatives must not contribute inventory."
    source_ids:
      - codex-cxc-52-2003
      - eu-pef-2021-2279
  - rule_id: val_mass_balance
    applies_to: "material_inventory"
    rule: "Raw materials and ingredients must reconcile with product, co-products, residues, wastewater, retained water, evaporation, and other outputs on consistent bases; residuals require explanation and uncertainty disclosure."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: val_water_energy_coverage
    applies_to: "utility_inventory"
    rule: "Water, ice, electricity, fuel, steam, refrigeration, cleaning, and storage must be measured or explicitly shown not applicable; shared quantities require an allocation audit."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: val_waste_emission_coverage
    applies_to: "waste_and_emissions"
    rule: "Each solid residue, wastewater stream, waste gas, refrigerant loss, and direct emission must have an identity, amount method, destination or compartment, and double-counting check."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: val_packaging
    applies_to: "packaging_inventory"
    rule: "Packaging components must reconcile issued, returned, scrapped, and released quantities; reference product mass must exclude transport packaging not sold with the product."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_allocation_hierarchy
    applies_to: "allocation"
    rule: "Subdivision or expansion must be considered before physical allocation, and another relationship may be used only with the required rejection rationale and sensitivity; factors must sum to 1."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_upstream_links
    applies_to: "background_datasets"
    rule: "Material raw crustacean, ingredient, additive, packaging, energy, water, refrigerant, and external-treatment exchanges must link to representative datasets or disclose a validated data gap."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_temporal_representativeness
    applies_to: "reporting_period"
    rule: "Activity data must cover the declared representative period and include startup, shutdown, cleaning, storage, rejected production, and all included shifts or document each exclusion."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: val_reasoned_estimates
    applies_to: "provisional_ranges"
    rule: "A reasoned_estimate range is a candidate-stage screening aid only; it may not replace foreground collection and must be replaced or explicitly accepted during methodology review before activation."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product- and facility-specific foreground manufacturing dataset for prepared or preserved crustaceans"
  downstream_use: "May be published and consumed as a secondary_dataset or background_dataset after review, with upstream and downstream datasets linked according to study scope"
  allowed_use: "Factory-gate manufacturing inventory for the declared species or product group, recipe, route, packaging, technology, facility, geography, reporting period, and market state; component in cradle-to-gate or broader product systems when boundaries are connected without overlap"
  excluded_use: "Raw capture or aquaculture production; simple freezing, salting, drying, or brining; complete prepared meals; crustacean extracts or juices; an undeclared recipe, route, technology, geography, or storage state; food-safety certification"
  required_metadata: "PCR id and version; reference UUIDs; all required qualifiers; facility and geography; reporting period; process-flow diagram; technology and capacity; included and excluded operations; product and co-product status; upstream dataset references; allocation; cut-offs; data gaps; source and calculation versions"
  required_quality_disclosure: "Mass, water, and energy reconciliation; temporal, technological, geographical, and precision assessment; meter and laboratory evidence; route-control coverage; allocation audit; provisional ranges; uncertainty and limitations; review status"
  update_trigger: "Material change in species or sourcing profile, recipe, preparation or preservation route, technology, capacity, energy or water system, refrigerant, packaging, product market state, waste or wastewater treatment, allocation, applicable regulation, reference UUID, or evidence that invalidates a rule or provisional range"
