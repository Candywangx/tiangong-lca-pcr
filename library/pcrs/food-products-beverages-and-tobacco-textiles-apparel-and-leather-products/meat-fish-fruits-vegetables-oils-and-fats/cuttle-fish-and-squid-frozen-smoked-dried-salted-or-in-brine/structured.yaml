                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids: []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_subdivide_routes
    applies_to: "All batches and route technologies"
    rule: "Use physical batch segregation and process subdivision first. Do not combine controlled solar/open-air and heated-air inventories or any excluded preservation route into one average unless an explicitly measured hybrid batch and energy split are documented."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework_and_residues
    applies_to: "Rework, residues, and co-products"
    rule: "Treat internal rework as an internal transfer without duplicate burden. Record waste treatment by destination. If a residue is a saleable co-product, first seek a separable process or physical relationship; document and justify any remaining allocation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_fallback
    applies_to: "Unavoidable shared inputs or outputs"
    rule: "When subdivision and a defensible physical relationship cannot resolve a multifunctional process, use an economic allocation based on contemporaneous prices, disclose the price basis and period, and test sensitivity; do not apply this fallback silently."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_reception_mass_and_state
      process_id: "raw_material_reception_and_preparation"
      flow_role: "received and prepared cephalopod mass and state"
      record_type: "batch receipt and transfer records"
      raw_fields: "batch id; species group; origin; capture or aquaculture status; supplier; received mass; prepared mass; temperature; prior preservation; moisture result and basis"
      collection_method: "calibrated scales plus receiving and transfer logs"
      unit: "kg; °C; kg/kg"
      frequency: "every batch"
      temporal_coverage: "representative production period, normally 12 consecutive months or the full campaign if shorter"
      site_scope: "each included site and line"
      aggregation_rule: "retain batch values, then mass-weight by saleable output; do not average incompatible material states without disclosure"
      quality_evidence: "scale calibration; supplier documents; laboratory method; reconciliation sign-off"
    - protocol_id: cp_preparation_utilities
      process_id: "raw_material_reception_and_preparation"
      flow_role: "preparation water and electricity"
      record_type: "meter, submeter, or equipment log"
      raw_fields: "meter openings and closings; recirculation; equipment power; run time; batch allocation driver"
      collection_method: "direct metering preferred; otherwise documented engineering calculation"
      unit: "kg water; kWh"
      frequency: "each batch or at least daily with justified allocation"
      temporal_coverage: "same period as reference-product output"
      site_scope: "each included site and utility system"
      aggregation_rule: "subtract documented recirculation only once and allocate shared use using measured time, mass throughput, or another disclosed driver"
      quality_evidence: "meter calibration; invoices; equipment specifications; allocation worksheet"
    - protocol_id: cp_residue_and_wastewater
      process_id: "raw_material_reception_and_preparation"
      flow_role: "residues and wastewater"
      record_type: "weigh tickets, discharge meter, treatment and destination records"
      raw_fields: "residue type; mass; by-product or waste status; destination; water discharge; monitored load where available"
      collection_method: "weigh each batch or reconciled container; meter discharge or calculate site water balance"
      unit: "kg"
      frequency: "every batch or disposal event"
      temporal_coverage: "same period as production"
      site_scope: "each site and treatment route"
      aggregation_rule: "aggregate separately by material status and destination; link treatment datasets without merging unlike routes"
      quality_evidence: "scale or meter calibration; manifests; treatment invoices; water-balance reconciliation"
    - protocol_id: cp_drying_batch_controls
      process_id: "route_specific_drying"
      flow_role: "feed, dried output, moisture, salt, rejects, and operating controls"
      record_type: "batch production and laboratory records"
      raw_fields: "route id; feed and output mass; feed and output moisture with basis; salt content; time; temperature; humidity or equivalent control; rejects; rework"
      collection_method: "calibrated scales and documented test methods; retain route-control logs consistent with the Codex code"
      unit: "kg; kg/kg; °C; h"
      frequency: "every batch"
      temporal_coverage: "representative production period by technology route"
      site_scope: "each dryer, line, or controlled drying area"
      aggregation_rule: "keep routes separate; aggregate only batches with the same declared technology and compatible product specification"
      quality_evidence: "scale and sensor calibration; test reports; route log; release record"
    - protocol_id: cp_drying_energy
      process_id: "route_specific_drying"
      flow_role: "electricity and thermal energy by carrier"
      record_type: "meters, fuel purchase and inventory, heat meter, equipment log"
      raw_fields: "route id; electricity; fuel quantity; net calorific value; purchased heat; start and end inventory; run time; allocation driver"
      collection_method: "direct metering preferred; reconcile fuel inventory and invoices; document conversions"
      unit: "kWh; MJ; carrier unit"
      frequency: "every batch or at least daily with batch allocation"
      temporal_coverage: "same period as route-specific output"
      site_scope: "each dryer and energy system"
      aggregation_rule: "report each carrier separately; forbid duplicate fuel and delivered-heat accounting; disclose hybrid split"
      quality_evidence: "meter calibration; invoices; tank reconciliation; conversion source; allocation worksheet"
    - protocol_id: cp_finished_product_release
      process_id: "finishing_and_packaging"
      flow_role: "saleable net mass and required qualifiers"
      record_type: "batch release, weigh, and laboratory records"
      raw_fields: "batch id; dried-bulk input; saleable net mass; grade; moisture and basis; salt content; glaze declaration; drained-mass applicability; rejects"
      collection_method: "calibrated scales and documented quality tests before release"
      unit: "kg; kg/kg"
      frequency: "every batch"
      temporal_coverage: "same period as included production"
      site_scope: "each finishing line and product specification"
      aggregation_rule: "sum only conforming saleable net product; exclude packaging; retain product-specific moisture and salt results"
      quality_evidence: "scale calibration; laboratory report; release authorization; label specification"
    - protocol_id: cp_packaging_and_finishing_utilities
      process_id: "finishing_and_packaging"
      flow_role: "packaging, finishing electricity, and waste"
      record_type: "bills of materials, issue records, meter or equipment log, waste records"
      raw_fields: "packaging material and mass; returns; electricity; equipment time; product rejects; packaging scrap; destination"
      collection_method: "measured issue and return records; metering or documented calculation; waste weighing"
      unit: "kg; kWh"
      frequency: "every batch or production day"
      temporal_coverage: "same period as saleable output"
      site_scope: "each finishing line"
      aggregation_rule: "normalize net packaging use and utility share to saleable net product; keep each material and destination separate"
      quality_evidence: "supplier specification; stock reconciliation; meter or equipment evidence; waste manifest"
  calculation_rules:
    - id: calc_reference_net_mass
      applies_to: "Reference product"
      rule: "Net saleable product mass equals gross packed mass minus packaging and any non-product mass. Glaze must be zero or not applicable and drained mass must be not applicable; otherwise stop and review scope."
      inputs:
        - "gross packed mass"
        - "packaging mass"
        - "glaze declaration"
        - "drained-mass applicability"
        - "release status"
      output: "kg net conforming saleable dried product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_normalize_inventory
      applies_to: "All inventory rows"
      rule: "Divide the batch-attributable quantity by batch net conforming saleable product mass to report the quantity per 1 kg reference flow."
      inputs:
        - "batch flow quantity"
        - "batch net saleable product mass"
      output: "normalized inventory amount"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_drying_water_loss
      applies_to: "Drying water balance"
      rule: "Water removed equals feed wet mass multiplied by feed moisture fraction minus dried-output wet mass multiplied by output moisture fraction, after aligning both moisture results to wet basis and accounting separately for sampled rejects or transfers."
      inputs:
        - "feed mass and moisture"
        - "dried-output mass and moisture"
        - "reject and transfer masses and moisture"
      output: "kg calculated water removed"
      source_ids: []
    - id: calc_process_mass_balance
      applies_to: "Each foreground process"
      rule: "Reconcile measured input mass with product, waste, transfer, retained-stock change, and calculated water outputs; investigate rather than force-close material discrepancies."
      inputs:
        - "all batch mass records"
        - "stock change"
        - "moisture results"
      output: "documented process mass-balance residual"
      source_ids: []
    - id: calc_route_energy
      applies_to: "Drying energy"
      rule: "Report electricity and each thermal carrier separately. Convert fuel with a disclosed calorific basis and never add delivered heat produced from the same counted fuel."
      inputs:
        - "electricity meters"
        - "fuel records"
        - "calorific value"
        - "purchased heat"
        - "hybrid split"
      output: "kWh and MJ per kg reference product by carrier"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_scope_identity
      applies_to: "Product and batch identity"
      requirement: "Demonstrate that the product is a dried cuttlefish or squid product and not a frozen, smoked, salt-cured, or brine-preserved product; retain all required reference-flow qualifiers."
      evidence: "product specification; label; batch release; route declaration; unsd-cpc-3-0-21266"
    - id: dq_route_separation
      applies_to: "Drying technology"
      requirement: "Keep controlled solar/open-air, heated-air, and measured hybrid batches distinguishable; disclose any hybrid split and exclude route averages that mix incompatible technologies."
      evidence: "route logs; energy records; batch genealogy"
    - id: dq_measurement
      applies_to: "Mass, moisture, salt, temperature, and utilities"
      requirement: "Use calibrated instruments or documented methods at the declared sampling point and retain units, moisture basis, detection limits where relevant, and conversion formulas."
      evidence: "calibration certificates; laboratory reports; meter records; codex-cxc-52-2003"
    - id: dq_temporal_coverage
      applies_to: "Foreground averages"
      requirement: "Prefer 12 consecutive months; if seasonal production or a shorter campaign is represented, cover the full campaign and disclose omitted periods, atypical downtime, and production weighting."
      evidence: "production calendar; batch register; coverage calculation"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Reconcile product, residue, wastewater, water, and energy records; disclose missing flows, cut-offs, substitutions, and mass-balance residuals rather than replacing them silently."
      evidence: "reconciliation workbook; data-gap register; eu-pef-2021-2279"
    - id: dq_estimate_replacement
      applies_to: "All reasoned_estimate ranges"
      requirement: "Treat reasoned estimates only as candidate screening guardrails. Replace each used estimate with protocol-based foreground records or reviewed route-specific evidence before methodology activation or dataset release for normal use."
      evidence: "record-to-range replacement log; reviewer decision; cited replacement source"
validation_rules:
  - rule_id: validation_scope
    applies_to: "Product applicability"
    rule: "Confirm the output is dried cuttlefish or squid and that frozen, smoked, salt-cured, and brine-preserved market routes are absent; non-zero glaze or applicable drained mass fails scope."
    source_ids:
      - unsd-cpc-3-0-21266
  - rule_id: validation_reference_flow
    applies_to: "Quantitative reference"
    rule: "Confirm exactly 1 kg net conforming saleable output uses product-flow UUID ae437668-712c-407b-b8d5-7f3daf53040e, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, with every required qualifier declared."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_route_exclusivity
    applies_to: "Drying process"
    rule: "Confirm one technology route per batch. A controlled solar/open-air and heated-air combination is allowed only as an explicitly documented hybrid with measured energy split; never average an excluded preservation route into the dataset."
    source_ids: []
  - rule_id: validation_mass_and_quality
    applies_to: "Process and product records"
    rule: "Reconcile received, prepared, dried-bulk, saleable, reject, residue, wastewater, stock-change, and calculated moisture-loss records; verify moisture and salt bases and explain material residuals."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validation_energy
    applies_to: "Drying utilities"
    rule: "Confirm electricity and each thermal carrier are separately reported, conversions are disclosed, and fuel is not double counted with heat produced from that fuel."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_estimates
    applies_to: "Candidate quantitative screening"
    rule: "Flag every value that still relies on reasoned_estimate; such a value is provisional and cannot satisfy normal-use release until replaced by collected records or reviewed route-specific evidence."
    source_ids: []
  - rule_id: validation_sources_and_destinations
    applies_to: "Upstream and waste links"
    rule: "Confirm every material input, energy carrier, packaging input, wastewater, residue, reject, and other waste has an identified source or destination dataset and that substitutions and allocation are disclosed."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production data package for one declared dried cephalopod product and drying technology"
  downstream_use: "May be published as a secondary_dataset or background_dataset after review, complete upstream linking, and replacement of relied-upon reasoned estimates"
  allowed_use: "Factory-gate modelling of dried cuttlefish or squid products matching the declared species group, source-material state, drying technology, moisture, salt, net-mass, geography, and time period"
  excluded_use: "Frozen, smoked, salt-cured, or brine-preserved products; liquid-packed products; products with non-zero glaze; mixed seafood without separable records; generic representation of all CPC 21266 routes"
  required_metadata: "PCR id; product-flow UUID; species group; origin and capture or aquaculture status; site; period; source-material state; drying technology and hybrid split if any; net-mass basis; moisture content and basis; salt content; glaze declaration; drained-mass applicability; grade; allocation; upstream datasets; waste destinations"
  required_quality_disclosure: "Data coverage; instrument and method evidence; batch weighting; mass and energy reconciliation; cut-offs; substitutions; allocation; reasoned-estimate replacement status; route exclusions; uncertainty and data gaps"
  update_trigger: "Change in species mix, raw-material state, drying technology or energy carrier, product moisture or salt specification, packaging, site, allocation, upstream dataset, regulation, or reviewed evidence; any observed value outside a screening guardrail also triggers review rather than automatic rejection"
