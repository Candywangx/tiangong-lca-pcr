allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Route batches and separable operations"
    rule: "Keep sun-dried and mechanically dehydrated batches separate and subdivide metered operations before allocating shared burdens."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_operations
    applies_to: "Unavoidable shared utilities or finishing"
    rule: "When subdivision or direct metering is not possible, apply and justify an allocation basis consistent with the PEF method hierarchy; disclose quantities, relationship, formula, and sensitivity where material."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recovered_outputs
    applies_to: "Pits and other recovered outputs"
    rule: "Record recovered outputs and their destinations separately; do not assign zero burdens solely because an output is called a residue, and document any allocation or substitution treatment."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_mass_and_quality
      process_id: "receipt_and_preparation"
      flow_role: "Fresh-plum receipt, accepted transfer, and finished lot quality"
      record_type: "Scale tickets and quality-control records"
      raw_fields: "lot_id; date; origin; cultivar_or_type; gross_mass; tare_mass; accepted_mass; rejected_mass; moisture_result; moisture_basis; condition_or_grade"
      collection_method: "Calibrated weighing plus documented sampling and test method"
      unit: "kg; % or kg/kg for moisture"
      frequency: "Each received and finished lot"
      temporal_coverage: "At least one representative production campaign and the stated reference period"
      site_scope: "All facilities and suppliers represented"
      aggregation_rule: "Sum traceable lot quantities; reconcile accepted input, transfers, and output before normalization"
      quality_evidence: "Calibration records, sample plan, test method, lot traceability, and exceptions"
    - protocol_id: cp_utility_records
      process_id: "all_applicable_processes"
      flow_role: "Water, electricity, fuels, and purchased heat"
      record_type: "Meter, invoice, tank, or equipment-runtime records"
      raw_fields: "period; process_or_equipment; carrier; opening_reading; closing_reading; purchase_quantity; allocation_driver; unit; heating_value_basis"
      collection_method: "Prefer submetering; otherwise use documented engineering allocation to represented batches"
      unit: "kg; m3; kWh; MJ; carrier unit"
      frequency: "Each batch or no longer than monthly"
      temporal_coverage: "Same representative campaign and reference period as production"
      site_scope: "Every in-scope facility and outsourced operation"
      aggregation_rule: "Subtract non-production uses, allocate with a disclosed driver, preserve carrier identity, and normalize to process output"
      quality_evidence: "Meter calibration, invoices, runtime logs, conversion factors, and allocation worksheet"
    - protocol_id: cp_reject_and_residue_records
      process_id: "receipt_and_preparation_and_finishing"
      flow_role: "Preparation rejects, pits, and finishing residues"
      record_type: "Weigh tickets, container counts, and destination records"
      raw_fields: "batch_id; residue_type; gross_mass; tare_mass; destination; sale_or_disposal_status; moisture_basis_if_material"
      collection_method: "Weigh each stream or use validated container factors with periodic checks"
      unit: "kg"
      frequency: "Each batch or shipment"
      temporal_coverage: "Same representative campaign and reference period as production"
      site_scope: "All represented facilities"
      aggregation_rule: "Aggregate by stream and destination; reconcile against process input and output"
      quality_evidence: "Scale checks, container-factor validation, destination receipts, and mass-balance reconciliation"
    - protocol_id: cp_water_balance
      process_id: "receipt_and_preparation"
      flow_role: "Preparation water and wastewater"
      record_type: "Supply and discharge meter records or documented water balance"
      raw_fields: "batch_or_period; supplied_water; retained_water; discharged_water; evaporation_or_other_loss; allocation_driver"
      collection_method: "Meter supply and discharge where practicable; otherwise calculate with disclosed balance terms"
      unit: "kg or m3 with density conversion"
      frequency: "Each batch or no longer than monthly"
      temporal_coverage: "Same representative campaign and reference period as production"
      site_scope: "All water-using preparation operations"
      aggregation_rule: "Reconcile supply with discharge, retention, and other losses; normalize to final output"
      quality_evidence: "Meter calibration, density conversion, discharge record, and balance closure"
    - protocol_id: cp_route_batch_balance
      process_id: "selected_drying_route"
      flow_role: "Route input, dried intermediate, moisture change, and transfers"
      record_type: "Batch weights, moisture tests, route logs, and transfer records"
      raw_fields: "batch_id; drying_route; input_mass; input_moisture; output_mass; output_moisture; rejects; other_transfers; start_time; end_time"
      collection_method: "Weigh route input and output and test moisture on the same declared basis"
      unit: "kg; % or kg/kg for moisture"
      frequency: "Each drying batch"
      temporal_coverage: "At least one representative campaign covering declared route conditions"
      site_scope: "Every represented drying site and route"
      aggregation_rule: "Calculate water removed and yield on a consistent mass and moisture basis; keep route batches separate"
      quality_evidence: "Scale calibration, moisture method, route log, and closed batch balance"
    - protocol_id: cp_combustion_inventory
      process_id: "mechanical_dehydration"
      flow_role: "On-site combustion elementary flows"
      record_type: "Fuel records, equipment logs, and documented emission factors"
      raw_fields: "carrier; quantity; unit; heating_value_basis; substance; factor; factor_unit; factor_source; control_efficiency"
      collection_method: "Calculate each substance from measured carrier quantity and an explicitly cited applicable factor"
      unit: "kg per substance"
      frequency: "Each batch or reporting period matching fuel records"
      temporal_coverage: "Same representative campaign and reference period as mechanical dehydration"
      site_scope: "Every represented on-site combustion source"
      aggregation_rule: "Sum substance-specific results and normalize to mechanical route output without merging carriers or factor bases"
      quality_evidence: "Fuel reconciliation, factor citation, applicability check, and calculation worksheet"
    - protocol_id: cp_packaging_records
      process_id: "finishing_and_packaging"
      flow_role: "Primary, secondary, and tertiary packaging"
      record_type: "Bill of materials, purchase records, and packed-output records"
      raw_fields: "package_format; material; component_mass; units_used; recycled_content_if_claimed; packed_net_output; losses"
      collection_method: "Weigh representative components or use verified supplier specifications and reconcile purchases and stock"
      unit: "kg"
      frequency: "Each package design and production campaign"
      temporal_coverage: "Current package design during the stated reference period"
      site_scope: "Every package format represented"
      aggregation_rule: "Sum component mass and packaging losses by material; normalize to net packed output"
      quality_evidence: "Component weigh records, supplier specification, bill-of-material revision, and stock reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "normalized amount = quantity assigned to represented output / net kg dried-plum output after allocation"
      inputs:
        - "assigned quantity"
        - "net dried-plum output"
        - "allocation result"
      output: "Amount per 1 kg reference flow"
      source_ids: []
    - id: calc_drying_water_balance
      applies_to: "Selected drying route"
      rule: "water transferred to air = route input mass - dried intermediate mass - rejects - other documented mass transfers, with every term on a consistent measurement basis"
      inputs:
        - "input and output weights"
        - "moisture basis"
        - rejects
        - "other transfers"
      output: "kg water transferred per route basis"
      source_ids: []
    - id: calc_direct_combustion_releases
      applies_to: "On-site fuel combustion"
      rule: "substance amount = measured carrier quantity × applicable documented factor × (1 - documented control efficiency), with carrier and factor units reconciled"
      inputs:
        - "carrier quantity"
        - "heating-value basis where relevant"
        - "substance factor"
        - "control efficiency"
      output: "kg of each elementary flow"
      source_ids: []
    - id: calc_route_selection
      applies_to: "Drying process map"
      rule: "Exactly one route flag is true for each represented batch; separately metered route batches may be aggregated only after independent normalization"
      inputs:
        - batch_id
        - sun_route_flag
        - mechanical_route_flag
        - "route-specific output"
      output: "Validated exclusive route assignment"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and input lots"
      requirement: "Retain CPC context, product name, cultivar or commercial type when known, pit status, treatment status, packaging format, and applicable grade or contract specification."
      evidence: "Lot and product specifications; unsd-cpc-30-21412; unece-ddp-07-2025 when applicable"
    - id: dq_measurement_traceability
      applies_to: "Mass, moisture, utilities, and packaging"
      requirement: "Retain calibration, sampling, test method, meter, invoice, conversion, and allocation evidence sufficient to reproduce normalized amounts."
      evidence: "Protocol records and calculation worksheets; unece-ddp-07-2025 for applicable quality and moisture measurement"
    - id: dq_temporal_and_site_coverage
      applies_to: "Foreground production"
      requirement: "Cover a representative campaign for each declared route, site, seasonal condition, and package format, and disclose any omitted or estimated operation."
      evidence: "Production calendar, batch register, site list, and coverage assessment; eu-pef-2021-2279"
    - id: dq_completeness_and_balance
      applies_to: "Each process and route"
      requirement: "Reconcile input, output, reject, residue, wastewater, moisture-loss, and stock-change terms; explain every material imbalance and provisional estimate."
      evidence: "Process mass balances, destination records, and estimate-replacement log"
    - id: dq_source_and_factor_currency
      applies_to: "Upstream datasets and emission factors"
      requirement: "Record geography, technology, reference year, version, and applicability; replace provisional estimates when representative foreground records or reviewed source-backed values become available."
      evidence: "Dataset metadata, factor citations, update log, and eu-pef-2021-2279"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "Reference product"
    rule: "Confirm the Tiangong product-flow UUID, Mass UUID, Units-of-mass UUID, kg unit, and exactly 1 kg net output; packaging mass shall not be included in the reference amount."
    source_ids: []
  - rule_id: validate_product_condition
    applies_to: "Product identity and quality"
    rule: "Confirm drying route, pit status, moisture result and basis, grade or contract specification, treatment status, package format, geography, and reference period; apply UNECE DDP-07 condition and measurement rules only when its product scope applies."
    source_ids:
      - unece-ddp-07-2025
  - rule_id: validate_route_exclusivity
    applies_to: "Process map and inventory"
    rule: "Confirm exactly one of sun drying and mechanical dehydration is active for each represented batch and that no quantity or burden is counted in both routes."
    source_ids: []
  - rule_id: validate_upstream_links
    applies_to: "Product inputs"
    rule: "Confirm fresh plums, utilities, fuels, packaging, processing aids, and waste-treatment services use declared upstream datasets with representative metadata."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_mass_and_moisture_balance
    applies_to: "Each batch and process"
    rule: "Confirm a consistent mass and moisture basis reconciles inputs, outputs, rejects, pits, wastewater, water transferred to air, and other transfers; investigate and disclose material imbalance."
    source_ids: []
  - rule_id: validate_direct_releases
    applies_to: "On-site combustion"
    rule: "When fuel is combusted on site, confirm substance-specific elementary flows are calculated from measured carrier use and cited applicable factors with unit and control-efficiency checks."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_allocation_and_estimates
    applies_to: "Shared operations and provisional values"
    rule: "Confirm the allocation hierarchy and basis are disclosed, every reasoned estimate is identified as temporary and conditional, and each is replaced when its stated foreground-record trigger is met."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground dried-plum production data package and facility-gate product dataset"
  downstream_use: "May be published as a secondary_dataset or background_dataset for food-product process and lifecyclemodel construction after review"
  allowed_use: "Comparative or attributional studies whose product identity, route, geography, period, quality, pit status, treatment, and package format are compatible with the dataset metadata"
  excluded_use: "Fresh plums, plum preparations other than dried whole or pitted fruit, materially distinct freeze-drying, undeclared route mixtures, or studies requiring an unrepresented quality or packaging state"
  required_metadata: "PCR id and version; reference-flow UUIDs; CPC context; geography; reference period; facility and route coverage; drying route; cultivar or commercial type when known; pit status; moisture result and basis; grade or contract specification; treatments; packaging format; allocation; upstream datasets; source and factor versions"
  required_quality_disclosure: "Foreground versus estimated shares; meter and scale coverage; sampling and moisture methods; route and site coverage; mass-balance closure; allocation; exclusions; data gaps; provisional estimates and their replacement status"
  update_trigger: "New or changed route, equipment, fuel, package design, product specification, pit or treatment status, facility mix, upstream dataset, emission factor, allocation method, or representative foreground evidence that replaces a provisional estimate"
data_sources:
  - id: "unsd-cpc-30-21412"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification (CPC) Version 3.0, subclass 21412, “Plums, dried”"
    used_for: "Classification context and product-category identity only"
  - id: "unece-ddp-07-2025"
    type: "standard"
    reference: "UNECE Standard DDP-07 concerning the marketing and commercial quality control of prunes, current UNECE WP.7 listing (2025)"
    used_for: "Prune and dried-plum identity, condition, moisture determination, and commercial-quality measurement when applicable; not LCI default amounts"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on the use of the Environmental Footprint methods"
    used_for: "System-boundary completeness, allocation hierarchy, data-quality disclosure, calculation traceability, and validation method"
