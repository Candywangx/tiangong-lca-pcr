      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_route_exclusivity
      applies_to: "Drying operations"
      rule: "Select sun drying or mechanical dehydration for a represented batch; never include both route processes for the same dried-plum quantity unless separately metered batches are modelled and recombined transparently."
