allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Build separate unit processes and meter route-specific operations wherever practicable. Avoid allocation by directly weighing product, ingredients, packaging, wastes and route utilities. For a shared operation, first subdivide by line, batch, preservation route or time period. If subdivision is not feasible, apply system expansion only when a documented substituted function and market are defensible; otherwise allocate using a measured physical relationship that represents the driver of consumption or loss, such as equipment time, useful steam, refrigeration load, wastewater volume or net product mass. Economic allocation is a last resort and shall use a representative price period with sensitivity analysis. [eu-pef-2021-2279, iso-14044-2006]"
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Saleable tomato skins, seeds, vegetable residues, recovered brine ingredients, recovered packaging material, energy exports or sludge are co-products only when they meet a product specification and leave for a documented beneficial use. Otherwise they remain waste flows with the receiving treatment linked. Do not assign avoided burdens to waste recycling or energy recovery inside the foreground inventory unless the declared LCA method explicitly requires it; disclose the chosen recycling and end-of-life convention."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: protocol_materials
      process_id: "preparation_preservation"
      flow_role: "vegetable or pulse input; intermediate"
      record_type: "weighbridge, scale or batch record"
      raw_fields: "material identity, supplier, lot, gross mass, tare, accepted mass, route, batch"
      collection_method: "Calibrated weighing reconciled to inventory movement"
      unit: "kg"
      frequency: "Each receipt or batch"
      temporal_coverage: "At least one representative annual period including seasonal campaigns"
      site_scope: "Each included site and route"
      aggregation_rule: "Sum accepted mass by exact material and route; no aggregation across botanical identities"
      quality_evidence: "Calibration, lot traceability and annual mass balance"
    - protocol_id: protocol_ingredients
      process_id: "preservation"
      flow_role: "ingredient"
      record_type: "formulation and dispensing record"
      raw_fields: "ingredient identity, batch, issued mass, returned mass, concentration"
      collection_method: "Calibrated dispensing or verified formulation record"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same period as product output"
      site_scope: "Each included line"
      aggregation_rule: "Sum net additions by atomic ingredient"
      quality_evidence: "Formula authorization and stock reconciliation"
    - protocol_id: protocol_packaging
      process_id: "packaging_release"
      flow_role: "packaging component"
      record_type: "component issue and line return"
      raw_fields: "component identity, composition, unit mass, issued count, returned count, rejects"
      collection_method: "Count multiplied by verified unit mass"
      unit: "kg"
      frequency: "Each production order"
      temporal_coverage: "Same period as product output"
      site_scope: "Each package format"
      aggregation_rule: "Sum each component separately; allocate shared tertiary packaging by shipped mass"
      quality_evidence: "Supplier specification, count reconciliation and unit-mass checks"
    - protocol_id: protocol_product
      process_id: "preservation_packaging_release"
      flow_role: "conforming output"
      record_type: "filler, check-weigher and release record"
      raw_fields: "product identity, route, gross mass, tare, net mass, packing medium, solids, package, status"
      collection_method: "Calibrated weighing and quality release"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same period as all inputs"
      site_scope: "Each included product route"
      aggregation_rule: "Sum only conforming released net content"
      quality_evidence: "Calibration and release certificate"
    - protocol_id: protocol_water
      process_id: "all_applicable_processes"
      flow_role: "incoming water"
      record_type: "water meter and tank record"
      raw_fields: "meter id, opening, closing, recirculation, use area"
      collection_method: "Submeter or reconciled water balance"
      unit: "m3"
      frequency: "Daily or per batch"
      temporal_coverage: "Representative annual period"
      site_scope: "Each included site"
      aggregation_rule: "Sum make-up water by use; do not count recirculation as new input"
      quality_evidence: "Meter calibration and site water balance"
    - protocol_id: protocol_energy
      process_id: "all_applicable_processes"
      flow_role: "electricity, heat or steam"
      record_type: "meter and utility record"
      raw_fields: "meter id, opening, closing, export, steam state, condensate return, process time"
      collection_method: "Calibrated submeter; documented allocation only for shared meter"
      unit: "kWh or MJ"
      frequency: "Daily or per batch"
      temporal_coverage: "Representative annual period"
      site_scope: "Each included site and line"
      aggregation_rule: "Sum by energy carrier and route; subtract documented exports"
      quality_evidence: "Meter calibration, invoices and allocation check"
    - protocol_id: protocol_fuels
      process_id: "onsite_utilities"
      flow_role: "individual fuel"
      record_type: "meter, purchase and tank record"
      raw_fields: "fuel identity, quantity, density, LHV, moisture, opening and closing stock"
      collection_method: "Metered or stock-reconciled consumption"
      unit: "MJ LHV"
      frequency: "Delivery and monthly reconciliation"
      temporal_coverage: "Representative annual period"
      site_scope: "Each on-site utility unit"
      aggregation_rule: "Convert each fuel separately; do not use a combined fuel flow"
      quality_evidence: "Invoice, tank reconciliation and supplier LHV"
    - protocol_id: protocol_refrigerants
      process_id: "onsite_utilities"
      flow_role: "individual refrigerant loss"
      record_type: "service and inventory record"
      raw_fields: "chemical identity, opening stock, additions, recovery, closing stock, equipment"
      collection_method: "Refrigerant mass balance"
      unit: "kg"
      frequency: "Every service event and annual reconciliation"
      temporal_coverage: "Representative annual period"
      site_scope: "Each refrigeration system"
      aggregation_rule: "Calculate each chemical separately"
      quality_evidence: "Service tickets and inventory reconciliation"
    - protocol_id: protocol_cleaning
      process_id: "cleaning"
      flow_role: "individual cleaning agent"
      record_type: "dosing and chemical issue record"
      raw_fields: "chemical identity, concentration, issued mass, returned mass, program"
      collection_method: "Calibrated dosing or stock reconciliation"
      unit: "kg"
      frequency: "Each cleaning program"
      temporal_coverage: "Representative annual period"
      site_scope: "Each included line"
      aggregation_rule: "Sum active supplied product by chemical"
      quality_evidence: "Dosing calibration and safety-data-sheet identity"
    - protocol_id: protocol_treatment_chemicals
      process_id: "wastewater_treatment"
      flow_role: "individual treatment chemical"
      record_type: "dosing and chemical issue record"
      raw_fields: "chemical identity, concentration, issued mass, returned mass, treatment stage"
      collection_method: "Calibrated dosing or stock reconciliation"
      unit: "kg"
      frequency: "Each dosing period"
      temporal_coverage: "Representative annual period"
      site_scope: "Each on-site treatment system"
      aggregation_rule: "Sum net addition by chemical; do not aggregate coagulant and flocculant"
      quality_evidence: "Dosing calibration, chemical identity and stock reconciliation"
    - protocol_id: protocol_waste
      process_id: "all_applicable_processes"
      flow_role: "solid waste or sludge"
      record_type: "waste scale and consignment record"
      raw_fields: "waste identity, gross mass, tare, dry matter, destination, recovery status"
      collection_method: "Calibrated scale or contractor ticket"
      unit: "kg"
      frequency: "Each collection"
      temporal_coverage: "Same period as product output"
      site_scope: "Each included site"
      aggregation_rule: "Sum each physically separate waste stream and destination"
      quality_evidence: "Ticket reconciliation and dry-matter analysis for sludge"
    - protocol_id: protocol_wastewater
      process_id: "all_applicable_processes"
      flow_role: "wastewater volume"
      record_type: "flow meter and batch discharge"
      raw_fields: "stream identity, volume, destination, recirculation"
      collection_method: "Submeter or verified water balance"
      unit: "m3"
      frequency: "Continuous total or each discharge"
      temporal_coverage: "Representative annual period"
      site_scope: "Each source and treatment system"
      aggregation_rule: "Preserve source streams before treatment aggregation"
      quality_evidence: "Meter calibration and water-balance closure"
    - protocol_id: protocol_effluent
      process_id: "wastewater_treatment"
      flow_role: "pollutant to water"
      record_type: "flow and laboratory record"
      raw_fields: "sampling time, flow, concentration, method, detection limit"
      collection_method: "Flow-weighted sampling and accredited analysis"
      unit: "kg"
      frequency: "Permit frequency or representative composite sampling"
      temporal_coverage: "Same period as treatment operation"
      site_scope: "Final discharge point"
      aggregation_rule: "Multiply flow-weighted concentration by discharge volume for each pollutant"
      quality_evidence: "Laboratory report, method and detection-limit treatment"
    - protocol_id: protocol_emissions
      process_id: "preservation_onsite_utilities_wastewater_treatment"
      flow_role: "direct emission to air"
      record_type: "stack, off-gas or engineering record"
      raw_fields: "species, concentration or factor, gas flow, fuel or activity, control state"
      collection_method: "Measurement preferred; otherwise equipment-specific calculation from collected activity"
      unit: "kg"
      frequency: "Permit frequency and representative operation"
      temporal_coverage: "Representative annual period"
      site_scope: "Each direct emission source"
      aggregation_rule: "Calculate each species separately"
      quality_evidence: "Monitoring report or calculation inputs and factor provenance"
  calculation_rules:
    - id: normalize_reference
      applies_to: "All exchanges"
      rule: "normalized exchange = reporting-period exchange / reporting-period conforming net product content"
      inputs:
        - "atomic exchange amount"
        - "kg net product"
      output: "exchange per 1 kg net product"
      source_ids:
        - eu-pef-2021-2279
    - id: material_balance
      applies_to: "Each route"
      rule: "accepted raw material + ingredients + retained packing water = conforming product + measured product losses + residues + water removed, after consistent moisture basis"
      inputs:
        - "mass records"
        - "solids or moisture analyses"
      output: "route mass-balance closure"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: steam_energy
      applies_to: "Purchased or on-site steam"
      rule: "useful steam energy = steam mass × (supply enthalpy - returned-condensate enthalpy)"
      inputs:
        - "steam mass"
        - pressure
        - temperature
        - "condensate state"
      output: "MJ useful steam"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: pollutant_load
      applies_to: "Wastewater release"
      rule: "pollutant mass = flow-weighted concentration × discharged volume, with explicit unit conversion"
      inputs:
        - concentration
        - "discharge volume"
      output: "kg pollutant"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: refrigerant_loss
      applies_to: "Each refrigerant"
      rule: "loss = opening inventory + additions - recovered mass - closing inventory; investigate negative or implausible balances"
      inputs:
        - "refrigerant inventory and service records"
      output: "kg emitted chemical"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and all inputs"
      requirement: "Preserve exact product, vegetable or pulse, ingredient, package, fuel, refrigerant, waste and emission identity; prohibit selector text and unverified UUID substitution."
      evidence: "Product specification, supplier document, Tiangong direct-read evidence where a UUID is used"
    - id: dq_time
      applies_to: "All foreground data"
      requirement: "Use one consistent representative reporting period covering seasonal starts, shutdowns and normal campaigns; disclose exclusions and exceptional production."
      evidence: "Production calendar, meter coverage and reconciliation"
    - id: dq_technology
      applies_to: "Preservation route"
      requirement: "Record actual equipment, scheduled thermal process or cold condition, solids, packing medium and process control; do not substitute a generic route."
      evidence: "Process authority record, batch log, equipment list and product release record"
    - id: dq_geography
      applies_to: "Upstream links"
      requirement: "Match electricity, heat, water, agricultural inputs, packaging and treatment to the supplying geography; disclose proxies."
      evidence: "Supplier location, contracts and dataset metadata"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Account for all atomic inputs, outputs, wastes and direct emissions in Section 6 that apply to the route; document a true zero or non-applicability."
      evidence: "Signed route checklist and annual mass, water and energy balances"
    - id: dq_measurement
      applies_to: "Foreground amounts"
      requirement: "Prefer calibrated meters and scales; document calibration, estimation method, uncertainty and any shared-meter allocation."
      evidence: "Calibration certificates and raw records"
    - id: dq_source
      applies_to: "External evidence"
      requirement: "Use original official or peer-reviewed sources for method and route rules; do not use search snippets or another PCR as evidence."
      evidence: "Source register in Section 11"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "The product does not satisfy CPC 3.0 21399, or the vegetable or pulse, route, product state, packing medium, package and reference basis are not declared."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "The reference output is not exactly 1 kg net product content, packaging mass is included in that kilogram, or packing medium inclusion is inconsistent across records."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "A card contains more than one electricity, steam, heat, fuel, refrigerant, ingredient, packaging component, waste, sludge or direct-emission species; an applicable card is replaced with “other”, “various”, “as applicable”, or selector text."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "Merely frozen vegetables are included without the preparation or preservation condition required by CPC 21399, or vinegar, acetic acid or sugar is the principal preservative."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "A generic heat schedule replaces the product-, container- and retort-specific scheduled process, or the frozen route lacks recorded thermal-centre and cold-chain evidence."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "Purchased electricity, steam and heat are double counted with on-site fuel and utility output, or recirculated water is counted as new water input."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "Refrigerant loss is aggregated across chemicals, direct combustion emissions are missing while on-site fuel is used, or treated-effluent pollutants are embedded only in a wastewater volume flow."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Packaging components, cleaning agents, wastewater source streams, primary sludge, biological sludge, screenings, food residues and package scrap are aggregated in a way that conceals a physically separate record or destination."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Allocation is used before subdivision, lacks a measured causal basis, or omits sensitivity analysis when economic allocation is used."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "A non-empty amount range lacks at least two independent, compatible original sources and traceable source ids. This PCR authors no ranges; absence of a range never authorizes a default amount."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "Any UUID-bearing identity was not verified by direct read, or a full-category reference flow was replaced by a narrower Tiangong candidate."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "foreground_dataset_conformance"
    rule: "Annual mass, water and energy reconciliations are absent, source records do not cover the product reporting period, or cut-offs and proxies are undisclosed."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site- and route-specific foreground data package for one qualifying preserved vegetable or pulse"
  downstream_use: "Construction of TianGong LCA flow, process and lifecycle-model datasets and comparative or product-footprint studies with matched functions"
  allowed_use: "Factory-gate inventory, hotspot analysis, supplier engagement and downstream modelling when product identity, reference basis, boundary and data quality are compatible"
  excluded_use: "Direct comparison of products with different edible-content, drained-content, solids, storage or packaging functions; representation of an excluded CPC class; use of this candidate as a published reviewed PCR"
  required_metadata: "CPC code; botanical/product identity; preservation route; recipe and packing medium; drained basis; solids where relevant; scheduled process or cold condition; package composition and level; geography; technology; reporting period; allocation; cut-offs; upstream datasets; treatment destinations"
  required_quality_disclosure: "Meter coverage, calibration, mass/water/energy balance closure, estimation and allocation shares, seasonal representativeness, proxy datasets, unresolved UUIDs, missing applicable records and uncertainty"
  update_trigger: "Product reformulation, preservation-route or package change, new scheduled process, refrigeration or fuel change, site or supplier change, material meter change, reporting-period refresh, classification revision, verified flow identity or compatible range evidence"
