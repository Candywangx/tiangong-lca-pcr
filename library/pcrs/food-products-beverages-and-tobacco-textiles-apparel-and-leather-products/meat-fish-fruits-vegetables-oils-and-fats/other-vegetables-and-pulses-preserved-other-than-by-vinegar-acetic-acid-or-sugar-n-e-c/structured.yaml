    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Include receiving, sorting, washing, trimming or peeling, cutting or size reduction, product-specific preparation, blanching when used, formulation or brining, filling, exhausting, closure, scheduled heat processing and cooling for thermally stable products; concentration and optional drying for tomato products; salting, washing, seasoning and controlled fermentation for kimchi; alkali treatment, washing, brining, fermentation, oxidation or sterilization for table olives; freezing and frozen storage for qualifying further-processed frozen products; package inspection, cleaning, on-site utilities, refrigerant loss, waste handling and on-site wastewater treatment. [codex-cxc-23-1979, codex-cxs-297-2009, codex-cxs-13-1981, codex-cxs-57-1981, codex-cxs-66-1981, codex-cxs-223-2001, codex-cxs-320-2015, eu-jrc-fdm-bref-2019]"
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Do not substitute a universal time-temperature schedule. Record the product-, fill-, container- and retort-specific scheduled process and its validation evidence. The quick-frozen route shall reach and maintain the applicable product temperature condition, including the Codex -18 °C thermal-centre criterion where that standard applies, but this conformance value is not an inventory amount range. [codex-cxc-23-1979, codex-cxs-320-2015]"
      source_ids: []
