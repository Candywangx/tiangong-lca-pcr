allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared refinery processes and utilities"
    rule: "Prefer direct metering and subdivision of the refining train, storage, and treatment processes before applying allocation."
    source_ids:
      - eu-ef-recommendation-2021-2279
  - rule_id: allocation_internal_recycle
    applies_to: "internally recovered oil and rework"
    rule: "Keep internal recycle inside the foreground system; record recovered mass and energy without creating a second product credit or duplicate upstream burden."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_co_products
    applies_to: "sold soapstock, acid oil, distillate, or recovered oil"
    rule: "If subdivision or system expansion is not practicable, use a relevant physical relationship; use economic allocation only when no defensible physical relationship exists, and disclose prices, period, currency, and sensitivity."
    source_ids:
      - eu-ef-recommendation-2021-2279
  - rule_id: allocation_waste_treatment
    applies_to: "wastes and treatment residuals"
    rule: "Assign collection and treatment burdens to the refinery product unless a recovered material qualifies as a co-product under the declared study method; disclose any burden transfer or credit."
    source_ids:
      - eu-ef-recommendation-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass_ledger
      process_id: "feed_reception_refining_train_finished_storage"
      flow_role: "feed, intermediates, reference product, rejects, stock changes"
      record_type: "weighbridge tickets, calibrated tank gauges, batch transfer records, dispatch records"
      raw_fields: "timestamp; lot; material identity; gross, tare, net mass; opening stock; closing stock; destination; quality release"
      collection_method: "reconcile custody-transfer and tank records by campaign and reporting period"
      unit: "kg"
      frequency: "each receipt, transfer, and dispatch"
      temporal_coverage: "complete representative reporting period including opening and closing stock"
      site_scope: "all refinery tanks and transfer points in scope"
      aggregation_rule: "receipts + opening stock - closing stock - separately recorded outbound non-product streams; normalize by conforming dispatched mass"
      quality_evidence: "calibration certificates, reconciliation sign-off, exception log"
    - protocol_id: cp_utility_meters
      process_id: "refining_train_finished_storage"
      flow_role: "water, electricity, steam, fuel, purchased heat"
      record_type: "meter readings, invoices, boiler logs, steam conditions, allocation driver"
      raw_fields: "meter id; timestamp; opening and closing reading; unit; pressure; temperature; heating value; shared-use driver"
      collection_method: "direct submetering preferred; reconcile to site totals"
      unit: "native meter unit, kWh, MJ, kg steam, or m3"
      frequency: "continuous or batch readings with monthly reconciliation"
      temporal_coverage: "same period as product mass ledger"
      site_scope: "all in-scope utility meters and justified shared systems"
      aggregation_rule: "usage difference minus documented exports, allocated by causal driver where direct metering is unavailable"
      quality_evidence: "meter calibration, invoice reconciliation, missing-data log"
    - protocol_id: cp_chemical_ledger
      process_id: "refining_train"
      flow_role: "acids, alkalis, bleaching earth, filtration aids, treatment chemicals"
      record_type: "purchase, stock, issue, return, and concentration records"
      raw_fields: "substance; supplier; lot; solution mass; concentration; opening stock; closing stock; process issue"
      collection_method: "stock balance reconciled to batch issues"
      unit: "kg solution and kg active substance"
      frequency: "each issue with monthly reconciliation"
      temporal_coverage: "same period as product mass ledger"
      site_scope: "all in-scope chemical stores and dosing points"
      aggregation_rule: "purchases + opening stock - closing stock - documented returns; active mass = solution mass × mass fraction"
      quality_evidence: "supplier certificate, scale calibration, concentration test where used"
    - protocol_id: cp_waste_and_byproduct_records
      process_id: "refining_train"
      flow_role: "soapstock, acid oil, gums, distillate, spent earth, filtration residue"
      record_type: "weigh tickets, tank or container records, sales and disposal manifests"
      raw_fields: "stream identity; mass; moisture or dry-solids basis; oil content when measured; destination; economic status"
      collection_method: "measure each named stream and reconcile to mass balance"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "same period as product mass ledger"
      site_scope: "all refining residual collection points"
      aggregation_rule: "sum by stream and disposition; never combine sold co-products with disposed waste"
      quality_evidence: "manifest, invoice, laboratory result, destination receipt"
    - protocol_id: cp_wastewater_monitoring
      process_id: "refining_train_wastewater_treatment"
      flow_role: "wastewater, treated discharge, pollutants, sludge"
      record_type: "flow meter, sampling log, laboratory result, sewer or discharge record"
      raw_fields: "volume; sample time; concentration; method; detection limit; treatment status; sludge mass; moisture"
      collection_method: "representative composite or legally required sampling plus continuous or batch flow measurement"
      unit: "m3, kg, and mg/L as measured"
      frequency: "per permit and operating cycle"
      temporal_coverage: "same period as product mass ledger"
      site_scope: "all in-scope wastewater outlets and on-site treatment"
      aggregation_rule: "pollutant load = measured volume × concentration with unit conversion; disclose non-detect treatment"
      quality_evidence: "calibration, chain of custody, accredited or documented laboratory method"
    - protocol_id: cp_air_emissions
      process_id: "refining_train"
      flow_role: "direct process and combustion emissions"
      record_type: "stack test, continuous monitor, fuel record, activity record, accepted factor"
      raw_fields: "pollutant; concentration or factor; gas flow or activity; time; method; uncertainty"
      collection_method: "direct monitoring preferred; otherwise calculate from measured activity and cited factor"
      unit: "substance-specific mass"
      frequency: "per permit and representative operation"
      temporal_coverage: "same period as product mass ledger"
      site_scope: "all in-scope process vents and combustion sources"
      aggregation_rule: "calculate each substance separately; aggregate only after preserving substance rows"
      quality_evidence: "calibration, test report, factor source, uncertainty record"
    - protocol_id: cp_quality_release
      process_id: "finished_storage"
      flow_role: "refined-olive-oil identity and release"
      record_type: "lot certificate, laboratory result, release or quarantine decision"
      raw_fields: "lot; sampling date; method; free acidity; required physicochemical fields; disposition"
      collection_method: "sample and test according to declared product specification and jurisdiction"
      unit: "specification-specific"
      frequency: "each released lot or representative batch defined by the quality plan"
      temporal_coverage: "all lots contributing to reference output"
      site_scope: "all finished-product tanks and release points"
      aggregation_rule: "include only released conforming mass in reference product; report quarantined and reworked mass separately"
      quality_evidence: "signed certificate, method identifier, laboratory competence evidence"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = reporting-period amount / net conforming refined olive oil dispatched"
      inputs:
        - "measured row amount"
        - "conforming dispatched mass"
      output: "amount per 1 kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: calc_stock_adjustment
      applies_to: "feed, product, chemicals, wastes, and intermediates"
      rule: "period consumption or production = receipts or transfers + opening stock - closing stock - separately documented returns or exports"
      inputs:
        - receipts
        - transfers
        - "opening and closing stock"
        - returns
        - exports
      output: "stock-adjusted period amount"
      source_ids:
        - mass-balance-identity
    - id: calc_mass_balance
      applies_to: "refinery foreground system"
      rule: "input oil and mass-bearing auxiliaries = product + separately measured co-products and wastes + emissions + closing-minus-opening work-in-progress, within declared measurement uncertainty"
      inputs:
        - "stock-adjusted material rows"
        - "inventory change"
        - "measured emissions"
      output: "mass-balance residual and relative residual"
      source_ids:
        - mass-balance-identity
    - id: calc_active_chemical
      applies_to: "chemical inputs"
      rule: "active-substance mass = solution mass × measured or supplier-declared mass fraction"
      inputs:
        - "solution mass"
        - concentration
      output: "kg active substance"
      source_ids:
        - ifc-vegetable-oil-ehs-2015
    - id: calc_energy_conversion
      applies_to: "electricity and thermal energy"
      rule: "convert electricity using 1 kWh = 3.6 MJ only when a common energy unit is required; preserve native carrier quantities and declared steam or fuel basis"
      inputs:
        - "native energy record"
        - "conversion factor"
        - "steam or fuel basis"
      output: "converted energy with traceable native value"
      source_ids:
        - mass-balance-identity
    - id: calc_pollutant_load
      applies_to: "wastewater and air emissions"
      rule: "pollutant load = measured flow or activity × measured concentration or accepted factor, with explicit unit conversion and non-detect rule"
      inputs:
        - "flow or activity"
        - "concentration or factor"
        - "sampling coverage"
      output: "substance-specific mass emission"
      source_ids:
        - ifc-vegetable-oil-ehs-2015
  data_quality_requirements:
    - id: dq_identity
      applies_to: "feed and reference product"
      requirement: "Retain supplier identity, lot traceability, declared refining route, product specification, and release result; exclude pomace-oil and refined-and-virgin blend categories."
      evidence: "supplier documents, batch genealogy, quality-release certificate, codex-cxs-33-1981-2024"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one complete representative reporting period that captures normal route operation, start/end stocks, downtime, rework, and seasonal variation; disclose exclusions and abnormal campaigns."
      evidence: "period coverage report and production log"
    - id: dq_measurement
      applies_to: "mass, utilities, chemicals, wastes, and emissions"
      requirement: "Use calibrated direct measurement where practicable; document meter coverage, allocation drivers, conversions, detection limits, and uncertainty."
      evidence: "calibration certificates, meter map, laboratory methods, reconciliation report"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Account for every named major input, output, waste, wastewater stream, and direct emission; quantify or explicitly flag every unmeasured stream rather than treating it as zero."
      evidence: "signed mass and utility balance, missing-data register, waste manifests"
    - id: dq_representativeness
      applies_to: "published dataset"
      requirement: "Report geography, technology, feed grade, chemical or physical route, capacity utilization, product state, and temporal coverage so users can judge representativeness."
      evidence: "dataset metadata and facility declaration, eu-ef-recommendation-2021-2279"
    - id: dq_estimate_replacement
      applies_to: "reasoned-estimate ranges"
      requirement: "Treat every reasoned_estimate as a replaceable QA screen only; foreground records determine dataset values and methodology review must accept or replace any estimate before publication-critical use."
      evidence: "review record and foreground evidence manifest"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require product flow UUID 4637b050-f60f-4ebb-af43-5128ebf416bf, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg reference unit."
    source_ids:
      - codex-cxs-33-1981-2024
  - rule_id: validate_product_quality
    applies_to: "released refined olive oil"
    rule: "Require the declared jurisdiction or Codex specification, test method, lot result, and release decision; under the Codex default, refined olive oil shall be obtained from virgin olive oils by permitted refining and have free acidity not more than 0.3 g oleic acid per 100 g."
    source_ids:
      - codex-cxs-33-1981-2024
  - rule_id: validate_route_boundary
    applies_to: "process map and inventory"
    rule: "Require one declared chemical or physical refining route and inventory coverage for applicable deacidification, bleaching or filtration, deodorization, direct utilities, residuals, storage, and treatment location."
    source_ids:
      - ifc-vegetable-oil-ehs-2015
  - rule_id: validate_mass_reconciliation
    applies_to: "refinery foreground system"
    rule: "Calculate and report the mass-balance residual; a nonzero residual is not silently allocated or set to zero and requires investigation or explicit uncertainty disclosure."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_internal_transfers
    applies_to: "aggregated dataset"
    rule: "Match internal product-flow outputs to corresponding inputs and cancel them exactly in the aggregated gate-to-gate result."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_allocation
    applies_to: "multifunctional outputs"
    rule: "Require subdivision evidence or a documented physical allocation basis; if economic allocation is used, require prices, period, currency, and sensitivity disclosure."
    source_ids:
      - eu-ef-recommendation-2021-2279
  - rule_id: validate_data_package
    applies_to: "foreground data package"
    rule: "Require all collection protocols used by collected or calculated rows, complete required qualifiers, source references, quality evidence, and explicit disclosure of unmeasured streams and provisional estimates."
    source_ids:
      - eu-ef-recommendation-2021-2279
published_dataset_profile:
  dataset_role: "Gate-to-gate foreground refinery dataset normalized to bulk refined olive oil at plant gate"
  downstream_use: "secondary_dataset; background_dataset after methodology review and publication"
  allowed_use: "Refinery-stage LCI and lifecycle-model projections for refined olive oil when feed grade, route, geography, product state, allocation, and boundary are compatible"
  excluded_use: "Virgin or extra-virgin olive oil; olive-pomace oil; refined-and-virgin blends; consumer-packaged product without an added packaging module; comparative public claims without complete compatible life-cycle modelling and review"
  required_metadata: "facility geography; reporting period; feed identity and origin; refining route and unit operations; bulk or packaged state; product specification and release method; allocation method; upstream dataset references; treatment locations; data ownership and review status"
  required_quality_disclosure: "meter and sampling coverage; calibration; mass-balance residual; missing or estimated data; reasoned-estimate usage; co-product disposition; data age; technological and geographic representativeness; verification status"
  update_trigger: "material change in feed grade, refining route, energy system, pollution control, allocation, product specification, plant configuration, data ownership, or representative reporting period"
