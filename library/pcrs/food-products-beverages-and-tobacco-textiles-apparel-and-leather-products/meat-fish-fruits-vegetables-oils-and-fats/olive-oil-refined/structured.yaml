system_boundary:
  rules:
    - rule_id: boundary_refinery_gate
      applies_to: "foreground refinery system"
      rule: "Include measured feed reception, route-specific refining, bleaching or filtration, deodorization, finished-product storage, direct utility use, direct emissions, wastes, by-products, and on-site treatment attributable to the reporting facility."
      source_ids:
        - ifc-vegetable-oil-ehs-2015
    - rule_id: boundary_upstream_separation
      applies_to: "purchased feed and supplies"
      rule: "Exclude olive cultivation and virgin-oil extraction from the refinery foreground inventory and link them as upstream datasets; separately link purchased energy, water, chemicals, and off-site treatment."
      source_ids:
        - eu-ef-recommendation-2021-2279
    - rule_id: boundary_product_separation
      applies_to: "product identity"
      rule: "Do not combine refined olive oil with refined olive-pomace oil, olive-pomace oil, virgin oils, or refined-and-virgin blends under this reference product."
      source_ids:
        - codex-cxs-33-1981-2024
    - rule_id: boundary_packaging
      applies_to: "packaging and distribution"
      rule: "Exclude packaging and outbound distribution from the default bulk-at-plant reference flow; if included for a study, model and disclose them as separate downstream processes."
      source_ids:
        - eu-ef-recommendation-2021-2279
