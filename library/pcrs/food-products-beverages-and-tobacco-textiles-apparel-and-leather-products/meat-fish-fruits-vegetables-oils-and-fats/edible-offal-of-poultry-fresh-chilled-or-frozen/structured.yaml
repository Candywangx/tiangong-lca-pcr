    - protocol_id: cp_fuel_inventory
      process_id: "onsite_energy_generation"
      flow_role: "each fuel"
      record_type: "fuel meter, invoice and stock records"
      raw_fields: "fuel_identity; quantity; unit; energy_basis; opening_stock; purchases; issues; closing_stock"
      collection_method: "meter or stock reconciliation by fuel"
      unit: "MJ"
      frequency: "each delivery and reporting period"
      temporal_coverage: "full reporting period"
      site_scope: "every combustion unit"
      aggregation_rule: "calculate consumption separately for every fuel identity"
      quality_evidence: "invoice; tank calibration; fuel specification"
  calculation_rules:
    - id: calc_variant_lock
      applies_to: "all records"
      rule: "Construct one immutable key from poultry species, organ identity and market state; reject a record set containing more than one value on any axis."
      inputs:
        - "identity and release records"
      output: "one conforming species-organ-state key"
      source_ids:
        - un-cpc-3-0-2025
        - eu-pef-method-2021
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "Divide the reporting-period amount for one atomic exchange by released net product mass for the same species-organ-state key."
      inputs:
        - "exchange amount"
        - "released net product mass"
        - "variant key"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_organ_mass_balance
      applies_to: "receipt and preparation"
      rule: "Reconcile exact raw-organ mass with prepared organ, edible trim, waste, wastewater-carried material and inventory change for the same species-organ key."
      inputs:
        - "receipt mass"
        - "prepared mass"
        - trim
        - waste
        - "wastewater load"
        - "stock change"
      output: "reconciled organ mass balance"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - id: calc_state_balance
      applies_to: "conditioning and packaging"
      rule: "Reconcile prepared organ, ice or water additions, released product, off-specification product, drainage, glazing and inventory change for the selected market state."
      inputs:
        - "prepared mass"
        - water
        - ice
        - "released mass"
        - rejects
        - "stock change"
      output: "reconciled state-specific product balance"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - id: calc_internal_transfer
      applies_to: "intermediates, wastewater and utilities"
      rule: "Match sending-process output to receiving-process input for the same identity and period and remove any duplicate external exchange."
      inputs:
        - "linked output"
        - "linked input"
        - "stock change"
      output: "reconciled internal transfer"
      source_ids:
        - eu-pef-method-2021
    - id: calc_refrigerant_loss
      applies_to: "refrigeration"
      rule: "Calculate each refrigerant loss from stock and service records; calculate every emitted blend component using documented composition."
      inputs:
        - "refrigerant balance"
        - "blend composition"
      output: "refrigerant input and component-specific air releases"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - id: calc_packaging_mass
      applies_to: "packaging"
      rule: "Multiply issued units by verified unit mass, adjust for returns and stock change, and retain every material and scrap identity separately."
      inputs:
        - units
        - "unit mass"
        - returns
        - stocks
        - scrap
      output: "material-specific packaging inputs and wastes"
      source_ids:
        - eu-pef-method-2021
    - id: calc_wastewater_load
      applies_to: "water emissions"
      rule: "Multiply matched discharged volume by representative concentration for each declared parameter with unit conversion documented."
      inputs:
        - "effluent volume"
        - "parameter concentration"
      output: "parameter-specific mass release"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - id: calc_combustion_emissions
      applies_to: "on-site combustion"
      rule: "Use direct monitoring or a documented calculation tied to every fuel inventory and operating period; retain pollutant identities separately."
      inputs:
        - "fuel inventory"
        - monitoring
        - "operating time"
        - composition
      output: "pollutant-specific air releases"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
    - id: calc_allocation
      applies_to: "linked slaughter and joint outputs"
      rule: "Apply the declared hierarchy only after subdivision and direct measurement; disclose data, formula and reporting-period basis."
      inputs:
        - "joint inventory"
        - "output quantities"
        - "physical or economic basis"
      output: "allocated inventory by exact product"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all exchanges"
      requirement: "Preserve exact flow identity, direction, type, unit and process; unresolved non-reference UUIDs remain blank and manifest-listed."
      evidence: "inventory audit and UUID review"
    - id: dq_variant_lock
      applies_to: "all records"
      requirement: "Retain one immutable species-organ-state key through receipt, preparation, release, normalization and publication."
      evidence: "lot genealogy and key-cardinality check"
    - id: dq_primary_data
      applies_to: "foreground processing"
      requirement: "Use company-specific records for the represented plant, technology and reporting period."
      evidence: "meters, scales, invoices, logs and laboratory reports"
    - id: dq_upstream_traceability
      applies_to: "raw organ"
      requirement: "Retain slaughter source, lot, species, organ identity, transfer mass and upstream allocation disclosure."
      evidence: "receipt and linked-dataset records"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Cover exact materials, energy, products, co-products, wastes and direct releases; document non-applicability for every conditional card."
      evidence: "completeness matrix and process walk-through"
    - id: dq_temporal
      applies_to: "reporting period"
      requirement: "Cover a representative operating period and disclose shutdowns, abnormal events, stock changes and seasonal effects."
      evidence: "reporting-period reconciliation"
    - id: dq_mass_balance
      applies_to: "preparation and conditioning"
      requirement: "Reconcile raw organ, prepared product, edible trim, reject, water or ice, wastewater-carried material and stock changes without a combined residual flow."
      evidence: "batch and period mass balances"
    - id: dq_refrigeration
      applies_to: "chilling, freezing and storage"
      requirement: "Retain equipment-specific refrigerant identity, blend composition, service records and component-loss calculation."
      evidence: "refrigeration service file"
    - id: dq_market_state
      applies_to: "reference product"
      requirement: "Retain state criterion, product temperature, glazing status, storage duration and release decision."
      evidence: "temperature log and release certificate"
    - id: dq_packaging
      applies_to: "packaged product"
      requirement: "Retain a variant-specific packaging bill of materials and material-specific scrap records."
      evidence: "bill of materials and issue records"
    - id: dq_wastewater
      applies_to: "water management"
      requirement: "Match representative concentration samples to measured volumes and disclose treatment or off-site hand-off."
      evidence: "laboratory, meter and consignment records"
    - id: dq_transparency
      applies_to: "published dataset"
      requirement: "Disclose exclusions, allocation, data gaps, proxies, unresolved identities and calculation methods."
      evidence: "data-quality report"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "Use Edible offal of poultry, fresh, chilled or frozen c294500e-2de6-44fd-a578-a1534dafb1b4, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 and kg."
    source_ids: []
  - rule_id: val_variant_lock
    applies_to: "reference dataset"
    rule: "Require exactly one poultry species, exactly one specifically named organ or fatty liver, and exactly one fresh, chilled or frozen market state."
    source_ids:
      - un-cpc-3-0-2025
      - eu-pef-method-2021
  - rule_id: val_species_scope
    applies_to: "poultry species"
    rule: "Accept chicken, turkey, goose, duck or guinea fowl; reject mixed species and non-poultry species."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: val_organ_scope
    applies_to: "organ identity"
    rule: "Require a concrete organ name; if the exact organ lacks an inventory card, add one atomic row and obtain identity review before dataset use; reject “offal”, “organ mix” and “other offal” as selected identities."
    source_ids:
      - un-cpc-3-0-2025
      - eu-pef-method-2021
  - rule_id: val_market_state
    applies_to: "product state"
    rule: "Require one declared state criterion and measured release temperature; prohibit combining fresh, chilled and frozen lots."
    source_ids:
      - un-cpc-3-0-2025
      - ec-jrc-sa-bref-jrc135916
  - rule_id: val_atomic_inventory
    applies_to: "all inventory rows"
    rule: "Require one concrete exchange and a non-empty explanatory paragraph per card; reject collection labels and material, utility, chemical, packaging, waste or pollutant selectors."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_uuid_closure
    applies_to: "identity"
    rule: "Permit only dual-kernel-confirmed UUIDs and require every blank non-reference UUID to have the same row_id in manifest review metadata."
    source_ids: []
  - rule_id: val_no_inferred_quantities
    applies_to: "amounts"
    rule: "Require foreground records, calculated values or the fixed reference amount; reject inference-only defaults and unsupported ranges."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_mass_balance
    applies_to: "receipt through release"
    rule: "Reconcile raw organ with product, co-products, wastes, water or ice additions, discharged loads and stock changes for the same variant key and period."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_upstream_allocation
    applies_to: "linked slaughter dataset"
    rule: "Require disclosed subdivision or allocation method, co-product status, source quantities, formula and period."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_energy_water_balance
    applies_to: "utilities"
    rule: "Reconcile imported, generated and internally transferred electricity, steam, hot water, heat, fuels and water without double counting."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_refrigerant_balance
    applies_to: "refrigeration"
    rule: "Require each installed refrigerant and every emitted component to be separately identified and reconciled to service records."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_packaging
    applies_to: "packaged product"
    rule: "Match every packaging input, scrap stream and declared package format while excluding packaging from reference-product mass."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_wastewater
    applies_to: "wastewater"
    rule: "Match measured wastewater volumes to internal transfer, treatment, off-site hand-off and parameter-specific discharge loads."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
  - rule_id: val_co_product_status
    applies_to: "recovered trim and biogas"
    rule: "Require one product or waste status and one destination for every physical stream; reject duplicate product-and-waste accounting."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: val_allocation
    applies_to: "joint outputs"
    rule: "Require the declared subdivision and allocation hierarchy, input data, formula and reporting-period basis."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "Factory-gate foreground processing dataset for one exact edible-poultry-offal species-organ-state variant"
  downstream_use: "secondary_dataset; background_dataset; product-footprint and life-cycle model construction"
  allowed_use: "Systems matching the declared poultry species, organ identity, market state, slaughter source, plant, technology, geography, reporting period, packaging and allocation"
  excluded_use: "Mixed species; mixed organs; mixed market states; mammalian offal; non-edible organs; whole carcasses; meat cuts; cooked or preserved offal; post-gate distribution, preparation, use or end-of-life"
  required_metadata: "PCR id; CPC reference; UUID chain; species; organ identity; fatty-liver status; market state; product temperature; glazing; net mass; slaughter source; plant; period; preparation; refrigeration; packaging; treatment; allocation"
  required_quality_disclosure: "primary-data coverage; scale and meter quality; mass, energy, water and refrigerant balances; sampling; non-applicability; proxies; unresolved UUIDs; allocation; uncertainty"
  update_trigger: "change in species, organ identity, market state, source slaughter allocation, preparation, refrigeration, fuel, chemical, package, treatment, plant, geography, period, evidence or UUID"
