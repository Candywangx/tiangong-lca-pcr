  classification_refs: "CPC 3.0: 21160 Edible offal of poultry, fresh, chilled or frozen"
  covered_products: "One specifically named edible organ or fatty liver from one declared chicken, turkey, goose, duck or guinea-fowl population, delivered in one declared fresh, chilled or frozen state"
  excluded_products: "Mixed poultry species; mixed organ identities; mixed market states; mammalian offal; non-edible organs; whole carcasses; meat cuts; live poultry; cooked, cured, canned or otherwise preserved offal; an unnamed residual offal category"
  representative_product: "Net conforming edible offal with one declared poultry species, one declared organ identity and one declared market state"
  production_route: "Receipt of individually segregated raw organ from a linked slaughter dataset; inspection; cleaning; trimming; organ-specific preparation; exact market-state conditioning; packaging; storage; factory-gate dispatch"
  market_state: "Food-grade fresh, chilled or frozen product at the offal-processing factory gate, with species, organ, product temperature, packaging, glazing and lot state declared"
functional_unit:
  what: "Provision of food-grade edible poultry offal for one declared poultry species, one declared organ identity and one declared fresh, chilled or frozen state at the producing factory gate"
  how_much: "1 kg net conforming edible offal, excluding packaging, retained packaging gas, free glazing ice and pallet mass"
  how_well: "Declared species; exact organ identity or fatty-liver identity; food-grade release status; market state; product temperature; whole-organ or trimmed form; glazing status; packaging format"
  how_long_or_cycle: "One released production lot or a reporting-period aggregation containing only the same species-organ-state key"
  reference_flow_link: "reference_edible_poultry_offal in state_conditioning_packaging"
system_boundary:
  rules:
    - rule_id: sb_foreground_scope
      applies_to: "offal processing"
      rule: "Include receipt, inspection, cleaning, trimming, organ-specific preparation, exact market-state conditioning, packaging, storage, sanitation and directly controlled environmental management through factory-gate dispatch."
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - rule_id: sb_upstream_slaughter_link
      applies_to: "raw organ input"
      rule: "Link each raw organ to a species- and organ-specific slaughter and evisceration dataset carrying the applicable live-bird, slaughter and joint-production burdens."
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - rule_id: sb_company_specific_inventory
      applies_to: "bill of materials and manufacturing"
      rule: "Collect product-specific materials and company-specific process data for the represented plant, technology and reporting period."
      source_ids:
        - eu-pef-method-2021
    - rule_id: sb_variant_separation
      applies_to: "all processes"
      rule: "Keep species, organ identity and market state separate through records, internal transfers, allocation and normalization; reject a mixed reference dataset."
      source_ids:
        - un-cpc-3-0-2025
        - eu-pef-method-2021
    - rule_id: sb_atomic_exchanges
      applies_to: "process inventory"
      rule: "Record every utility, fuel, refrigerant, coolant, chemical, packaging material, co-product, waste and elementary emission as one concrete exchange."
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - rule_id: sb_internal_transfers
      applies_to: "intermediates, wastewater and utilities"
      rule: "Represent an internal transfer once at each linked boundary and prevent the equivalent external input, disposal or credit from being counted twice."
      source_ids:
        - eu-pef-method-2021
    - rule_id: sb_conditional_technology
      applies_to: "state conditioning, packaging, treatment and energy"
      rule: "Populate only atomic cards used by the represented technology; document non-applicability and add a new specific card before using an unlisted exact organ, material or refrigerant."
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
    - rule_id: sb_direct_releases
      applies_to: "air and water"
      rule: "Include measured or calculated direct releases from refrigeration, packaging gas, wastewater treatment and combustion without substituting a pollutant collection selector."
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-method-2021
