      raw_fields: "stream_identity; volume; sample_time; concentration; parameter; treatment_route; sludge_mass; destination"
      collection_method: "matched flow measurement and representative sampling"
      unit: "m3; kg"
      frequency: "continuous flow and risk-based sampling"
      temporal_coverage: "full reporting period"
      site_scope: "every discharge and treatment route"
