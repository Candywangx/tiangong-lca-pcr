      frequency: "each lot"
      temporal_coverage: "full reporting period"
      site_scope: "all reference-product lots"
      aggregation_rule: "sum only released lots sharing the same species-organ-state key"
      quality_evidence: "calibration; temperature log; release certificate"
    - protocol_id: cp_energy_records
      process_id: "all_processes"
      flow_role: "electricity"
      record_type: "meter and utility records"
      raw_fields: "meter_id; timestamp; opening_reading; closing_reading; source; destination"
      collection_method: "dedicated meter or documented causal share from reconciled site meters"
