      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "full reporting period"
      site_scope: "every declared stream and destination"
      aggregation_rule: "retain each physical identity and status separately"
      quality_evidence: "weigh ticket; consignment note; destination evidence"
    - protocol_id: cp_wastewater_records
      process_id: "applicable_processes"
      flow_role: "wastewater, sludge and water emissions"
