  - rule_id: alloc_upstream_joint_production
    applies_to: "raw organ, carcass and slaughter co-products"
    rule: "Retain the allocation applied by the linked slaughter dataset and disclose its co-product quantities, status, formula and reporting-period basis."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: alloc_direct_processing
    applies_to: "offal preparation and conditioning"
    rule: "Assign directly measured preparation, conditioning, packaging, storage and treatment burdens to the exact species-organ-state product before allocating any unavoidable joint burden."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_co_product_status
    applies_to: "recovered edible trim and recovered biogas"
    rule: "Determine product or waste status at the actual hand-off and use only the matching product or waste exchange; never count one physical stream in both roles."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-method-2021
  - rule_id: alloc_physical_relation
    applies_to: "unavoidable joint outputs"
    rule: "If subdivision is impossible, use an evidence-backed physical causal relation only when it represents how inputs and releases change with joint output production."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_economic_fallback
    applies_to: "remaining joint outputs"
    rule: "If no defensible physical relation exists, use a documented economic allocation consistent with the applicable study programme and reporting period; do not invent a default factor."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_waste_no_credit
    applies_to: "waste streams"
    rule: "Assign treatment burdens to the declared hand-off without an avoided-product credit unless a downstream model explicitly requires and documents that scenario."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_internal_recovery
    applies_to: "treated water, biogas, steam, hot water, heat and electricity"
    rule: "Treat internal recovery as a linked transfer and do not allocate or credit the same recovered quantity twice."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_raw_offal_records
      process_id: "offal_receipt_preparation"
      flow_role: "exact raw species-organ receipt"
      record_type: "lot, supplier and scale records"
      raw_fields: "lot_id; slaughter_source; poultry_species; organ_identity; fatty_liver_status; receipt_time; product_temperature; gross_mass; tare_mass; accepted_mass; rejected_mass"
      collection_method: "calibrated batch scale plus identity and inspection review"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full reporting period"
      site_scope: "all represented receipts"
      aggregation_rule: "aggregate only identical species-organ keys and reconcile dispositions"
      quality_evidence: "calibration; receipt; inspection; source dataset"
    - protocol_id: cp_process_mass_balance
      process_id: "offal_receipt_preparation_state_conditioning_packaging"
