allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Multi-output or shared operations"
    rule: "Avoid allocation where possible by subdividing route-, line-, or product-specific records or by expanding the system when a justified substituted function is demonstrated."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_route_separation
    applies_to: "Direct and cured/fermented routes"
    rule: "Treat the two preservation routes as mutually exclusive at lot level. For a reporting period containing both, normalize each route separately and aggregate using measured conforming product mass; do not charge both route inventories to every kilogram."
    source_ids:
      - eu-pef-2021-2279
      - codex-cxs-115-1981
  - rule_id: allocation_residual
    applies_to: "Inseparable co-products and shared utilities"
    rule: "After subdivision and system expansion are demonstrably impracticable, use an underlying physical relationship when one can be established. Otherwise use a documented economic relationship with consistent prices and reference period, and report the method, factor, affected flows, and sensitivity. Waste treatment receives burdens and credits only according to the selected life-cycle method and documented destination."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_preparation_records
      process_id: "receiving_preparation"
      flow_role: "All received material, preparation water and energy, prepared output, rejects, and wastewater"
      record_type: "Lot, scale, meter, issue, transfer, and waste records"
      raw_fields: "product identity; supplier and lot; fresh or cured state; gross, tare, and net mass; water meter; energy meter and carrier; prepared transfer mass; reject mass; wastewater volume or mass; destination; timestamps"
      collection_method: "Reconcile calibrated scale tickets, batch sheets, utility meters, and waste manifests to the same lot or declared allocation period"
      unit: "kg; m3 with measured density conversion; kWh; MJ"
      frequency: "Each lot for materials and outputs; meter interval aligned to production"
      temporal_coverage: "Declared representative production period covering normal product and operating variation"
      site_scope: "All facilities and lines included in the dataset"
      aggregation_rule: "Sum lot records by product and route, subtract documented returns and internal reuse, then normalize through calc_reference_normalization"
      quality_evidence: "Scale and meter calibration; signed batch record; supplier specification; reconciliation and exception log"
    - protocol_id: cp_direct_acidulation_records
      process_id: "direct_acidulation"
      flow_role: "Prepared material, acid medium, every formulation ingredient, energy, transfer output, pH, and waste"
      record_type: "Lot formulation, issue, meter, transfer, laboratory, and waste records"
      raw_fields: "route id; product lot; ingredient id and concentration; individual charge mass; energy by carrier; transfer mass; equilibrium pH, sample phase and time; waste stream and destination"
      collection_method: "Link approved formulation and actual issues to calibrated masses, submetered utilities, transfer records, and lot test results"
      unit: "kg; kWh; MJ; pH units"
      frequency: "Each lot; continuous or interval utility data allocated to documented equipment operation"
      temporal_coverage: "Declared representative period for the direct route"
      site_scope: "All direct-acidulation lines in scope"
      aggregation_rule: "Keep ingredient rows separate, reconcile input and output mass, and normalize only direct-route output"
      quality_evidence: "Approved formulation; calibration; laboratory method and calibration; batch release; mass-balance review"
    - protocol_id: cp_cured_route_records
      process_id: "curing_fermentation_acid_adjustment"
      flow_role: "Prepared material, brine and salt, acid and ingredients, energy, tank output, duration, pH, spent brine, wastewater, and product waste"
      record_type: "Lot, tank, formulation, issue, meter, laboratory, transfer, and waste records"
      raw_fields: "route id; product lot; tank id; charge and discharge mass; brine concentration and reuse; ingredient concentration and mass; start and end time; temperature; energy by carrier; equilibrium pH; each waste stream and destination"
      collection_method: "Reconcile tank logs, approved formulation, actual issues, calibrated masses, meters, laboratory results, and waste records"
      unit: "kg; h; degrees C; kWh; MJ; pH units"
      frequency: "Each lot or tank; interval utilities aligned to occupied tank time"
      temporal_coverage: "Declared representative period for the cured or fermented route"
      site_scope: "All curing or fermentation tanks and acid-adjustment lines in scope"
      aggregation_rule: "Exclude internal brine recirculation from repeated inputs, keep waste streams separate, reconcile mass, and normalize route output"
      quality_evidence: "Tank and batch record; calibration; laboratory method and calibration; release record; mass-balance and reuse log"
    - protocol_id: cp_filling_stabilization_records
      process_id: "filling_sealing_stabilization"
      flow_role: "Preserved lot, packaging, water, energy, finished product, package scrap, product loss, wastewater, pH, and stabilization conditions"
      record_type: "Lot, package bill, issue, meter, process-control, release, waste, and laboratory records"
      raw_fields: "source route and lot; product-and-medium mass; package component and issue mass; conforming unit count; net mass; drained mass where applicable; time and temperature or other stabilization parameter; water and energy; equilibrium pH; each waste mass and destination"
      collection_method: "Link route transfer to package issues, calibrated checkweigher or scale, process controls, utility meters, waste records, and release tests"
      unit: "kg; count; kWh; MJ; degrees C and time; pH units"
      frequency: "Each lot; utility and process-control intervals aligned to the filling campaign"
      temporal_coverage: "Declared representative period covering package and stabilization variants"
      site_scope: "All filling and stabilization lines in scope"
      aggregation_rule: "Calculate conforming net product mass, separate packaging mass, reconcile product and package losses, and normalize to 1 kg"
      quality_evidence: "Package specification; scale and meter calibration; process-control record; release record; laboratory evidence; reconciliation log"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory amount"
      rule: "q_normalized = q_attributable / conforming_net_product_mass_kg; report q_normalized per 1 kg reference product. Keep packaging mass outside the denominator and edible sold packing medium inside it."
      inputs:
        - "attributable flow amount"
        - "conforming net product mass"
        - "package tare"
      output: "normalized amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_route_exclusivity
      applies_to: "Preservation-route inventories"
      rule: "Assign each lot to exactly one route id. Aggregate route results only as sum(route-normalized amount × route conforming product mass) / total conforming product mass."
      inputs:
        - "lot route id"
        - "route-specific flow totals"
        - "route-specific conforming product mass"
      output: "reporting-period route-weighted inventory"
      source_ids:
        - codex-cxs-115-1981
        - codex-cxs-260-2007
        - eu-pef-2021-2279
    - id: calc_mass_reconciliation
      applies_to: "Each process and production lot"
      rule: "mass_balance_gap = total measured mass inputs − total measured product, waste, recovered material, retained inventory change, and measured discharges. Investigate and disclose material gaps; do not create an elementary emission solely to force closure."
      inputs:
        - "input masses"
        - "product and waste masses"
        - "inventory change"
        - "discharge masses"
      output: "process mass-balance gap and reconciliation status"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_shared_utility
      applies_to: "Shared metered utilities"
      rule: "Allocate only after attempted subdivision. Use measured equipment consumption or a causal driver such as operating time and rated load; document the driver and reconcile allocated shares to the meter total."
      inputs:
        - "meter total"
        - "equipment measurement or causal driver"
        - "production records"
      output: "attributable utility amount by process and route"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and all product flows"
      requirement: "Preserve biological product identity, preservation route, starting condition, presentation, and packing medium. The Cucumbers UUID is acceptable only for cucumber datasets; another vegetable, pulse, or potato requires a semantically appropriate flow before publication."
      evidence: "Product specification, label, supplier record, batch record, and product-flow review"
    - id: dq_primary_records
      applies_to: "Foreground facility processes"
      requirement: "Use facility-specific records for all known material, water, energy, product, waste, and direct-emission flows. Document proxies and the reason direct records were unavailable."
      evidence: "Records required by the four collection protocols and eu-pef-2021-2279"
    - id: dq_representativeness
      applies_to: "Dataset reference period"
      requirement: "Select and disclose a period that represents the declared product, route, technology, geography, package format, and normal operating variation; disclose abnormal campaigns and excluded downtime."
      evidence: "Production schedule, route and product mix, facility scope, reference-period rationale, and PEF representativeness assessment"
    - id: dq_completeness
      applies_to: "Inventory and linked datasets"
      requirement: "Reconcile known inputs and outputs, link upstream datasets for purchased inputs and waste treatment, and disclose cut-offs, data gaps, allocation, and mass-balance gaps."
      evidence: "Mass and utility reconciliation, source list, exclusion register, and eu-pef-2021-2279"
    - id: dq_provisional_ranges
      applies_to: "All reasoned_estimate ranges"
      requirement: "Treat ranges as temporary QA screens only. Before publication replace them with ranges from representative foreground batches or reviewed transferable evidence, record applicability, and revise the PCR when evidence materially changes a guardrail."
      evidence: "Range replacement register, representative batch summary or reviewed source, approval record, and update log"
    - id: dq_test_and_calibration
      applies_to: "Mass, pH, temperature, time, concentration, and utility measurements"
      requirement: "Retain instrument identity, method, calibration or verification status, sample timing, sampled phase, and corrective action for failed checks."
      evidence: "Calibration certificates, laboratory method, quality-control results, process-control logs, and batch release record"
validation_rules:
  - rule_id: val_identity_and_flow
    applies_to: "Reference product"
    rule: "Verify the declared product is within the semantic category and that Cucumbers 54b947e7-ab56-45c8-8210-9c91b85eb845 is used only for cucumber datasets. Fail publication of another vegetable, pulse, or potato until a semantically appropriate product flow is selected."
    source_ids:
      - unsd-cpc-3-0-21340
      - codex-cxs-115-1981
      - codex-cxs-260-2007
  - rule_id: val_route_exclusive
    applies_to: "Process map and each lot"
    rule: "Verify exactly one preservation route is active for each lot, that route-specific inputs and wastes remain in that route, and that any period aggregation uses measured conforming product mass shares."
    source_ids:
      - codex-cxs-115-1981
      - codex-cxs-260-2007
  - rule_id: val_reference_mass
    applies_to: "Quantitative reference"
    rule: "Verify the denominator is exactly 1 kg net edible product including sold packing medium and excluding packaging; check tare removal and lot normalization."
    source_ids:
      - eu-pef-2021-2279
      - codex-cxs-260-2007
  - rule_id: val_equilibrium_ph
    applies_to: "Released acid-preserved product"
    rule: "Verify a calibrated, lot-linked equilibrium-pH result of 4.6 or less for products modelled under the cited Codex product definitions, together with sample phase, timing, method, and release decision."
    source_ids:
      - codex-cxs-115-1981
      - codex-cxs-260-2007
  - rule_id: val_foreground_completeness
    applies_to: "All four foreground processes"
    rule: "Verify all known material, water, energy, product, waste, packaging, wastewater, and direct-emission records are represented or explicitly justified as absent; verify linked upstream datasets and waste destinations."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_mass_and_utility_reconciliation
    applies_to: "Each process and reporting period"
    rule: "Verify process mass-balance gaps are investigated and shared utilities reconcile to meters without double counting or arbitrary closure flows."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_provisional_range_replacement
    applies_to: "Candidate quantitative guidance"
    rule: "Fail publication while any reasoned_estimate range is being used as a default amount or lacks a documented replacement assessment based on representative batches or reviewed evidence. Values outside a provisional QA range require investigation and disclosure, not automatic substitution."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_allocation_and_exclusions
    applies_to: "Allocation, cut-offs, and reporting"
    rule: "Verify subdivision was attempted, the chosen residual allocation is documented and reproducible, packaging is included, exclusions are justified, and limitations prevent unsupported comparison or comparative assertion."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Facility-specific foreground data package and factory-gate product dataset for the declared acid-preserved vegetable, pulse, or potato"
  downstream_use: "secondary_dataset; background_dataset after methodology review and publication"
  allowed_use: "Product-specific process and lifecycle-model construction for the declared species, route, formulation, geography, period, package, and stabilization technology; aggregation across routes only by the prescribed rule"
  excluded_use: "Non-cucumber modelling with the Cucumbers UUID; unqualified generic modelling of all CPC 21340 products; direct comparison or comparative assertion without aligned function, product flow, route, system boundary, data quality, and review"
  required_metadata: "Product species and common name; selected product-flow UUID; CPC context; cucumber/non-cucumber status; route; fresh or cured starting condition; presentation; packing medium and formulation; pH method and result; net and drained mass basis; package components; stabilization method; facility geography; technology; reference period; allocation; cut-offs; upstream dataset choices"
  required_quality_disclosure: "Foreground coverage; route and product representativeness; calibration and release evidence; mass and utility reconciliation; shared-service allocation; waste and wastewater destinations; proxy and data-gap register; provisional-range replacement status; limitations of the narrower cucumber representative"
  update_trigger: "A change in product-flow semantics or UUID; modelling of another vegetable, pulse, or potato; material formulation, route, stabilization, package, technology, geography, or supplier change; revised CPC, Codex, or PEF source; representative batch evidence that replaces or materially changes a provisional range; review finding affecting boundary, allocation, or validation"
