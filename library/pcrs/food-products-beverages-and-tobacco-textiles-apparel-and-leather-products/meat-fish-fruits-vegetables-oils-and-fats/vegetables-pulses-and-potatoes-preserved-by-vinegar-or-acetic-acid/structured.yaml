measurement_rules:
  - id: reference_product_mass
    applies_to: "Reference product output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine net edible product mass on a calibrated mass basis. Include edible packing medium sold with the product and exclude all packaging mass. Normalize the inventory to exactly 1 kg."
  - id: batch_material_mass
    applies_to: "Raw material, ingredients, packing medium, product, rejects, and wastes"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record gross, tare, and net mass or a documented equivalent for each production lot; do not mix volume and mass without a measured lot-specific density and conversion record."
  - id: equilibrium_ph
    applies_to: "Stabilized product and packing medium"
    required_property_ref:
      name: "Dimensionless pH"
      uuid: ""
    required_unit: "pH units"
    rule: "Measure equilibrium pH after the declared equilibration or stabilization condition using a calibrated method, identify the sampled phase and lot, and retain the test result and calibration evidence."
