    rule: "Preserve the metered unit and conversion factor; allocate shared utilities only under section 7 and report normalized energy in a consistent unit without treating energy conversion as a mass conversion."
process_map:
  - id: receiving_preparation
    name: "Receiving and preparation"
    inclusion: "required"
    inclusion_condition: "Always"
    role: "Receive, inspect, sort, wash, trim, cut, and prepare the declared product material"
    quantitative_reference: "kg prepared material transferred"
  - id: direct_acidulation
    name: "Direct acidulation and formulation"
    inclusion: "conditional"
    inclusion_condition: "Include only when fresh or otherwise uncured prepared material is directly acidulated; exclude when the cured/fermented route is selected"
    role: "Formulate prepared material with vinegar or acetic-acid medium and declared ingredients"
    quantitative_reference: "kg acidulated lot transferred"
  - id: curing_fermentation_acid_adjustment
    name: "Curing or fermentation and acid adjustment"
    inclusion: "conditional"
    inclusion_condition: "Include only when curing or fermentation occurs within the foreground boundary; exclude when direct acidulation is selected, and treat supplier curing as upstream if received already cured"
    role: "Cure or ferment material, then adjust with vinegar or acetic acid as declared"
    quantitative_reference: "kg cured and acid-adjusted lot transferred"
  - id: filling_sealing_stabilization
    name: "Filling, sealing, and stabilization"
    inclusion: "required"
    inclusion_condition: "Always; use the output of the one selected preservation route"
    role: "Fill product and medium, close the package, apply the declared heat or non-heat stabilization, cool if needed, and release the finished product"
    quantitative_reference: "1 kg net preserved product"
