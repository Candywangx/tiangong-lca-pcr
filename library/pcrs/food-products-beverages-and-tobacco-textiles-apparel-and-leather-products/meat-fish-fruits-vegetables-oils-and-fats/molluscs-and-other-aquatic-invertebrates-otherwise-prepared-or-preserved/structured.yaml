  - id: drained_and_glaze_mass
    applies_to: "Solid product in liquid medium or glazed product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure total net mass, drained edible-solid mass, packing-medium mass, and glaze mass separately. Use drained net mass when the liquid is only an adjunct; exclude glaze from the declared food net mass."
  - id: internal_mass_transfer
    applies_to: "Internal intermediate product and rework"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
