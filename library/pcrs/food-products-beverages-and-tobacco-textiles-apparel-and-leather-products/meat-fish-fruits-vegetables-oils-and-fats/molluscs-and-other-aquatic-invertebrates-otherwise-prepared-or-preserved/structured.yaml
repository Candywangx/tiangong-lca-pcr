allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "Process subdivision"
    rule: "Avoid allocation by separately metering materially different product lines, preservation routes, species groups, and packaging formats whenever technically practicable."
    source_ids:
      - iso-14044-2006-lca
  - rule_id: allocation_rule_2
    applies_to: "Internal rework"
    rule: "Treat rework returned to the same production system as an internal loop. Record its mass and any additional processing, but do not create a co-product or duplicate upstream burden."
    source_ids:
      - iso-14044-2006-lca
  - rule_id: allocation_rule_3
    applies_to: "Joint edible co-products"
    rule: "After subdivision, allocate inseparable shared burdens using a documented causal physical relationship. If no better causal relationship is demonstrated, use wet mass at the split point and test sensitivity to a justified economic relationship."
    source_ids:
      - iso-14044-2006-lca
  - rule_id: allocation_rule_4
    applies_to: "Shells and other non-edible outputs"
    rule: "Classify each output as marketable co-product, recoverable residue, or waste according to its actual legal status and destination. Apply allocation only to a genuine co-product; assign handling and treatment caused by waste to the foreground product system."
    source_ids:
      - iso-14044-2006-lca
  - rule_id: allocation_rule_5
    applies_to: "Shared utilities and cleaning"
    rule: "Allocate shared electricity, heat, refrigeration, water, cleaning, and wastewater using a causal driver such as metered use, operating time, mass-time, occupied-volume-time, or wastewater load. Disclose the driver and denominator."
    source_ids:
      - iso-14044-2006-lca
  - rule_id: allocation_rule_6
    applies_to: "Allocation closure"
    rule: "Allocation factors for each shared process must sum to 1.0, and unallocated internal transfers, losses, and rework must remain visible in the mass balance."
    source_ids:
      - iso-14044-2006-lca
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "raw_material_reception_and_cold_storage"
      flow_role: "aquatic raw material, accepted mass, and rejects"
      record_type: "supplier lot and receiving record"
      raw_fields: "supplier; species; origin; catch/aquaculture status when known; incoming state; shell-on/off; temperature; gross, tare, net, accepted, and rejected mass; reject reason"
      collection_method: "Calibrated scale plus receiving inspection and supplier documentation"
      unit: "kg and degC"
      frequency: "Every lot"
      temporal_coverage: "Representative production year with seasonal coverage"
      site_scope: "All reporting-facility receiving points and suppliers in scope"
      aggregation_rule: "Sum lot masses; retain species and state strata; calculate accepted mass as received minus rejects"
      quality_evidence: "Scale calibration, lot identifiers, supplier documents, temperature log, and reject record"
    - protocol_id: cp_cold_storage_energy
      process_id: "raw_material_reception_and_cold_storage_packaging_storage_and_release"
      flow_role: "chilled and frozen storage electricity"
      record_type: "electricity meter and storage occupancy log"
      raw_fields: "meter start/end; storage zone; operating hours; product mass; occupied volume; temperature set point; entry and release time"
      collection_method: "Submeter where available; otherwise allocate facility meter by documented mass-time or volume-time"
      unit: "kWh, h, kg, m3"
      frequency: "Meter interval and every lot movement"
      temporal_coverage: "Same period as production data"
      site_scope: "All cold stores serving in-scope product"
      aggregation_rule: "Subtract unrelated loads and allocate by recorded causal driver"
      quality_evidence: "Meter identifier, calibration or utility bill reconciliation, occupancy log, and allocation worksheet"
    - protocol_id: cp_preparation_water
      process_id: "preparation_and_cleaning"
      flow_role: "thawing, deglazing, washing, and preparation water"
      record_type: "water meter and operating log"
      raw_fields: "source; freshwater/seawater; meter start/end; recirculation; discharge; line; lot; operating time"
      collection_method: "Dedicated meter or reconciled facility water balance"
      unit: "m3"
      frequency: "Shift or batch"
      temporal_coverage: "Representative production year including cleaning and peak season"
      site_scope: "All preparation lines in scope"
      aggregation_rule: "Net withdrawal = intake minus separately measured returned or internally recycled water"
      quality_evidence: "Meter calibration, water-treatment record, and monthly utility reconciliation"
    - protocol_id: cp_preparation_mass_balance
      process_id: "preparation_and_cleaning"
      flow_role: "prepared edible material, shells, trimmings, and internal transfers"
      record_type: "batch mass-balance record"
      raw_fields: "incoming mass; thaw/drip loss; edible output; co-product; shell; viscera; trim; wastewater solids; rework"
      collection_method: "Calibrated scales and reconciled batch sheet"
      unit: "kg"
      frequency: "Every batch or statistically justified continuous-line interval"
      temporal_coverage: "Representative production year and all material species/routes"
      site_scope: "All preparation operations and mass-transfer points in scope"
      aggregation_rule: "Sum outputs and inventory change; reconcile against input by wet-mass state"
      quality_evidence: "Scale calibration, batch identifier, signed reconciliation, and exception investigation"
    - protocol_id: cp_ingredient_and_filling
      process_id: "formulation_and_filling"
      flow_role: "recipe ingredients, packing medium, filled mass, and losses"
      record_type: "recipe issue, return, filler, and check-weigher records"
      raw_fields: "ingredient id; issued/returned/wasted mass; formulation; container count; fill mass; drained mass; headspace; overfill; rework"
      collection_method: "Inventory issue reconciliation plus calibrated filler/check-weigher"
      unit: "kg, count"
      frequency: "Every formulation lot and routine in-process checks"
      temporal_coverage: "Representative production year and all declared formulations"
      site_scope: "All formulation, portioning, and filling lines in scope"
      aggregation_rule: "Net ingredient use = issued minus returned and separately recovered amounts; aggregate only identical formulations"
      quality_evidence: "Recipe approval, instrument calibration, fill-control chart, and lot traceability"
    - protocol_id: cp_preservation_schedule
      process_id: "qualifying_preservation"
      flow_role: "qualifying route and preserved output"
      record_type: "batch, retort, cooker, smoker, fryer, pasteurizer, or other validated process record"
      raw_fields: "route; equipment; product/container format; fill or initial temperature; time; temperature; pressure; flow; critical limits; deviations; conforming output"
      collection_method: "Automated recorder or qualified operator record under the validated site process"
      unit: "route-specific units and kg"
      frequency: "Every batch or continuous production lot"
      temporal_coverage: "Full reporting period"
      site_scope: "Every in-scope preservation line and product-container combination"
      aggregation_rule: "Link each released lot to one complete process record; do not average critical-limit compliance"
      quality_evidence: "Calibration, validation approval, operator sign-off, deviation disposition, and release authorization"
    - protocol_id: cp_preservation_energy
      process_id: "qualifying_preservation"
      flow_role: "electricity, steam, heat, fuel, refrigeration, and direct emissions"
      record_type: "submeter, fuel issue, steam meter, and operating log"
      raw_fields: "carrier; meter start/end; fuel mass/volume; steam/heat quantity; recovered heat; equipment time; throughput; emission factor source when calculated"
      collection_method: "Metered energy preferred; otherwise fuel inventory and causal allocation"
      unit: "kWh, MJ, kg, m3"
      frequency: "Batch, shift, or billing interval"
      temporal_coverage: "Same period as production data"
      site_scope: "All preservation equipment and on-site energy generation serving in-scope product"
      aggregation_rule: "Separate carriers; subtract exported or recovered energy; allocate shared load by operating time or throughput"
      quality_evidence: "Meter calibration, utility reconciliation, fuel invoice, and calculation record"
    - protocol_id: cp_packaging_records
      process_id: "formulation_and_filling_packaging_storage_and_release"
      flow_role: "primary, secondary, tertiary, and reject packaging"
      record_type: "packaging bill of materials, issue, return, and reject records"
      raw_fields: "component id; material; unit mass; issued/returned count; conforming units; rejects; reusable cycles"
      collection_method: "Supplier specification verified by sample weighing and stock reconciliation"
      unit: "kg and count"
      frequency: "Packaging batch and production lot"
      temporal_coverage: "Representative production year and all formats"
      site_scope: "All packaging issue, application, and reject points in scope"
      aggregation_rule: "Component mass = verified unit mass times net consumed count; allocate reusable packaging by documented cycles"
      quality_evidence: "Supplier specification, scale calibration, bill of materials, and stock reconciliation"
    - protocol_id: cp_product_release
      process_id: "packaging_storage_and_release"
      flow_role: "reference product, net/drained mass, release state, and final rejects"
      record_type: "release, label, check-weigher, storage, and disposition record"
      raw_fields: "product id; species; route; lot; net mass; drained mass; glaze mass; container count; release state; storage temperature; release/reject quantity; shelf-life"
      collection_method: "Calibrated weighing, label verification, quality release, and warehouse record"
      unit: "kg, count, degC, day"
      frequency: "Every released lot"
      temporal_coverage: "Full reporting period"
      site_scope: "All factory-gate release and finished-product reject points in scope"
      aggregation_rule: "Sum only conforming released product on the declared reference-mass basis"
      quality_evidence: "Calibration, release authorization, label approval, code traceability, and storage log"
    - protocol_id: cp_cleaning_and_wastewater
      process_id: "cleaning_and_wastewater_management"
      flow_role: "cleaning water, chemicals, wastewater, and pollutant load"
      record_type: "CIP/manual sanitation record, water meter, chemical issue, effluent flow and analysis"
      raw_fields: "water intake; recycled water; chemical product and active concentration; cleaned area/equipment; wastewater flow; COD; solids; nutrients; salt; oil/grease; treatment route"
      collection_method: "Metering and laboratory analysis under site monitoring plan"
      unit: "m3, kg, mg/L"
      frequency: "Each cleaning cycle for inputs; effluent sampling at permit or study frequency"
      temporal_coverage: "Representative production year including high-load campaigns"
      site_scope: "All cleaning systems and wastewater discharge or treatment points serving in-scope production"
      aggregation_rule: "Aggregate flow-weighted pollutant loads and allocate shared cleaning by causal driver"
      quality_evidence: "Meter and dosing calibration, laboratory method and QA/QC, chain of custody, and permit report"
    - protocol_id: cp_waste_and_coproducts
      process_id: "all_processes"
      flow_role: "residues, co-products, rejects, and treatment destinations"
      record_type: "scale ticket, transfer note, inventory, and disposal or sales record"
      raw_fields: "material type; legal status; wet/dry state; mass; destination; treatment; revenue when economic sensitivity is used; internal rework"
      collection_method: "Weighing or verified container count conversion plus destination documentation"
      unit: "kg and currency when needed"
      frequency: "Every transfer or batch"
      temporal_coverage: "Same period as production data"
      site_scope: "All in-scope processes and residue, co-product, reject, and waste transfer points"
      aggregation_rule: "Sum by material, status, and destination; keep internal rework separate"
      quality_evidence: "Scale calibration, transfer documentation, purchaser or treatment receipt, and reconciliation to mass balance"
  calculation_rules:
    - id: calc_reference_output
      applies_to: "Saleable reference product"
      rule: "Reference output = conforming released net mass excluding packaging; use drained edible-solid mass for a solid in non-decisive liquid medium; use total net mass when the liquid or sauce is integral; exclude glaze."
      inputs:
        - "net mass"
        - "drained mass"
        - "packing-medium mass"
        - "glaze mass"
        - "release quantity"
      output: "kg reference product"
      source_ids:
        - eu-1169-2011-food-information
    - id: calc_accepted_material
      applies_to: "Reception"
      rule: "Accepted raw material = received net mass - reception rejects - documented holding loss."
      inputs:
        - received
        - rejected
        - "and holding-loss masses"
      output: "kg accepted raw material"
      source_ids: []
    - id: calc_preparation_yield
      applies_to: "Preparation"
      rule: "Preparation yield = prepared edible material / accepted aquatic raw material on aligned wet-mass and shell-state bases."
      inputs:
        - "accepted input and prepared edible output"
      output: "kg/kg"
      source_ids: []
    - id: calc_water_intensity
      applies_to: "Preparation and cleaning"
      rule: "Water intensity = net external water withdrawal / applicable received raw material or reference-product mass; report freshwater and seawater separately."
      inputs:
        - "water intake"
        - "returned or recycled water"
        - "raw material"
        - "reference output"
      output: "m3/t or m3/kg"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_energy_intensity
      applies_to: "Preservation and storage"
      rule: "Energy intensity by carrier = net metered carrier input / conforming process output. Keep electricity, steam, fuel, and recovered heat separate; 1 kWh = 3.6 MJ only when a common energy display is needed."
      inputs:
        - "energy meters"
        - "fuel issues"
        - "recovered/exported energy"
        - "process output"
      output: "kWh/kg, MJ/kg, or carrier unit/kg"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_wastewater_load
      applies_to: "Wastewater"
      rule: "Pollutant load = flow-weighted concentration times wastewater flow, converted to kg; internally recycled water is not counted as discharge."
      inputs:
        - flow
        - concentration
        - "sample period"
        - recycling
      output: "m3 and kg pollutant per reference product"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_mass_balance
      applies_to: "Each process and total foreground"
      rule: "Mass-balance difference = inputs + opening inventory - outputs - closing inventory. Investigate sign, state-basis, moisture, evaporation, wastewater solids, rework, and measurement uncertainty before accepting a residual."
      inputs:
        - "all measured mass transfers and inventory change"
      output: "kg and percent of input"
      source_ids:
        - iso-14044-2006-lca
    - id: calc_allocation
      applies_to: "Shared processes and co-products"
      rule: "Allocated burden = shared burden times documented allocation factor; all factors for a shared process must sum to 1.0."
      inputs:
        - "shared burden"
        - "causal driver"
        - "allocation factors"
      output: "allocated inventory by product"
      source_ids:
        - iso-14044-2006-lca
  data_quality_requirements:
    - id: dqr_identity
      applies_to: "Product and raw material"
      requirement: "Preserve species or species mix, incoming state, formulation, qualifying route, final state, and lot linkage."
      evidence: "Supplier records, product specification, route record, and release record."
    - id: dqr_measurement
      applies_to: "Mass, water, energy, and packaging"
      requirement: "Use calibrated instruments or reconcile utility and stock records; retain raw readings, units, conversion factors, and allocation drivers."
      evidence: "Calibration certificates, meter logs, invoices, stock reconciliation, and calculation worksheet."
    - id: dqr_temporal
      applies_to: "Foreground representation"
      requirement: "Use one representative production year where available and cover seasonal species supply, shutdowns, cleaning campaigns, route mix, and storage duration. Disclose any shorter period and its representativeness."
      evidence: "Production calendar, lot register, meter period, and representativeness assessment."
    - id: dqr_completeness
      applies_to: "Inventory"
      requirement: "Reconcile material mass and disclose every excluded material, utility, emission, residue, and process. Do not treat a source proxy as a substitute for missing foreground data."
      evidence: "Mass balance, exclusion register, and source-to-field binding."
    - id: dqr_preservation_control
      applies_to: "Canned, retorted, pasteurized, smoked, cooked, or other controlled product"
      requirement: "Link each released lot to the applicable validated process and deviation disposition. A generic PCR temperature-time value is not acceptable."
      evidence: "Validated process schedule, continuous record, calibration, deviation review, and release authorization."
    - id: dqr_water_proxy
      applies_to: "Water-use review"
      requirement: "JRC reports about 1 m3/t raw fish for thawing, 5-11 m3/t for filleting, 15 m3/t for canning, and 23-32 m3/t for shrimp processing. Use these only as sector-proxy QA context; explain route/species differences and replace with site data."
      evidence: "eu-jrc-fdm-bref-2019 plus foreground meters."
    - id: dqr_energy_proxy
      applies_to: "Energy-use review"
      requirement: "JRC reports 150-190 kWh/t raw fish for canning. Treat it as a fish-sector screening benchmark for combined process-energy review, not as a mollusc-specific default or a substitute for carrier-level meters."
      evidence: "eu-jrc-fdm-bref-2019 plus foreground energy records."
    - id: dqr_source_age
      applies_to: "External evidence"
      requirement: "Recheck official regulations, standards, PCR validity, and technical guidance at each methodology review; record the applicable edition."
      evidence: "Source register and review date."
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "Reference identity"
    rule: "The reference flow UUID must be 5102ffa5-d24d-4e8c-b18d-d22f74677182, its flow property must be Mass 93a60a56-a3c8-11da-a746-0800200b9a66, its unit group must be Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and the reference unit must be kg."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "Category eligibility"
    rule: "Reject a package that represents crustaceans, a complete meal, an extract or juice, raw/live/fresh/chilled-only product, or product preserved only by freezing, drying, salting, or brining."
    source_ids:
      - codex-cxc-52-2003-fish-fishery-products
  - rule_id: validation_rule_3
    applies_to: "Required qualifiers"
    rule: "Reject an incomplete package when species, qualifying preservation route, formulation and packing medium, product form, ready-to-eat status, reference-mass basis, packaging, release state, geography, reference period, or included conditional operations are missing."
    source_ids:
      - codex-cxc-52-2003-fish-fishery-products
      - eu-1169-2011-food-information
  - rule_id: validation_rule_4
    applies_to: "Reference mass"
    rule: "Confirm that packaging is excluded, glaze is excluded, and drained mass is used for a solid in a non-decisive liquid medium; otherwise require an integral-product declaration and composition."
    source_ids:
      - eu-1169-2011-food-information
  - rule_id: validation_rule_5
    applies_to: "Process coverage"
    rule: "Confirm all six required process-map entries are represented. Operations not performed may have zero flow only when the actual route and meter boundary make that explicit; at least one qualifying preservation operation is mandatory."
    source_ids:
      - codex-cxc-52-2003-fish-fishery-products
  - rule_id: validation_rule_6
    applies_to: "Thermal-process integrity"
    rule: "For canned, retorted, or other heat-controlled product, require a product-container-specific validated process schedule and complete time, temperature, pressure where relevant, monitoring, calibration, deviation, cooling, and release records."
    source_ids:
      - codex-cxc-52-2003-fish-fishery-products
  - rule_id: validation_rule_7
    applies_to: "Mass balance"
    rule: "Confirm process and foreground mass balances use aligned wet/dry, shell, drained, and moisture states. Investigate unexplained residuals rather than assigning them silently to waste or evaporation."
    source_ids:
      - iso-14044-2006-lca
  - rule_id: validation_rule_8
    applies_to: "Utilities and wastewater"
    rule: "Confirm electricity, thermal carriers, water sources, cleaning inputs, wastewater flow and relevant pollutant loads are collected without meter overlap. Flag JRC proxy figures used as dataset values instead of QA context."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validation_rule_9
    applies_to: "Allocation"
    rule: "Confirm subdivision was considered, the selected causal driver is documented, factors sum to 1.0, internal rework is not a co-product, and waste status matches actual destination."
    source_ids:
      - iso-14044-2006-lca
  - rule_id: validation_rule_10
    applies_to: "Evidence and provisional estimates"
    rule: "Each external-source constraint must cite a listed source. Every reasoned_estimate is a temporary screening range and must not override foreground records or be presented as a publication-critical allowed range without explicit review."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for otherwise prepared or preserved molluscs and other non-crustacean aquatic invertebrates."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Route-, species-, formulation-, geography-, technology-, packaging-, and storage-matched LCA process or lifecyclemodel construction after upstream raw-material and purchased-input datasets are linked."
  excluded_use: "Representation of capture or aquaculture; crustaceans; raw or simply frozen/dried/salted/brined products; complete meals; retail or consumer stages; safety certification; comparative claims across unmatched reference-mass bases or preservation routes."
  required_metadata: "PCR id and version; reference-flow UUID and mass basis; species and origin; incoming state; preparation and preservation route; product form and formulation; net/drained/glaze treatment; ready-to-eat status; packaging bill of materials; storage state and duration; facility geography; reference year; technology; supplier and route mix; process coverage; allocation method; upstream dataset links."
  required_quality_disclosure: "Foreground coverage; instrument and meter quality; temporal and seasonal representativeness; mass-balance residuals; missing UUIDs; exclusions; proxy benchmarks; all provisional reasoned_estimate ranges; allocation sensitivity; wastewater monitoring coverage; heat-process validation evidence; source editions and retrieval dates."
  update_trigger: "New representative year; material change in species or supplier mix, raw-material state, formulation, qualifying preservation technology, container or packaging format, storage regime, energy or water system, wastewater treatment, co-product destination, regulation, PCR requirement, or external evidence that changes a rule or screening benchmark."
