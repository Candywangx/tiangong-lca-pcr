  - id: batch_time_allocation
    applies_to: "Shared meters and batch campaigns"
    required_property_ref:
      name: "Mass and time"
      uuid: ""
    required_unit: "kg and h"
    rule: "Allocate shared consumption to product lots using recorded operating time, throughput, or another causal driver; retain the driver and all production included in the denominator."
