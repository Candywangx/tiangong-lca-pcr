      unit: "kg or converted kg"
      frequency: "Each production lot and every material issue or transfer"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "Every foreground line and storage location used for the declared product"
      aggregation_rule: "Sum only records with the same row_id after lot reconciliation; normalize through measured process outputs."
      quality_evidence: "Calibration, lot genealogy, supplier specification, recipe authorization, release record, and reconciliation sign-off"
