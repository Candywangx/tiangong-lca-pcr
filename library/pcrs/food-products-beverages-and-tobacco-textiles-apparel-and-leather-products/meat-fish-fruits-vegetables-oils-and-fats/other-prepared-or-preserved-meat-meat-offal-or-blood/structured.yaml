  - id: thermal_preservation
    name: "Declared cooking, frying, roasting, or steaming route"
    inclusion: "conditional"
    inclusion_condition: "Include when the locked preservation route is cooking, frying, roasting, or steaming; choose one named route and one concrete product-form transfer."
    role: "foreground production"
    quantitative_reference: "1 kg thermally processed product released"
  - id: hermetic_canning
    name: "Hermetic filling, closure, thermal processing, and cooling"
    inclusion: "conditional"
    inclusion_condition: "Include only for a declared hermetically sealed canned product made under a documented scheduled process."
    role: "foreground production"
    quantitative_reference: "1 kg net canned product released, excluding container mass"
  - id: pickling_seasoning
    name: "Declared pickling or seasoning preservation route"
    inclusion: "conditional"
    inclusion_condition: "Include when pickling or seasoning is the locked route and freezing, salting, brining, smoking, and drying are not the defining preservation method."
    role: "foreground production"
    quantitative_reference: "1 kg pickled or seasoned product released"
  - id: packaging_storage_release
    name: "Final packaging, finished-product storage, and release"
    inclusion: "required"
    inclusion_condition: "Always included; final state is ambient shelf-stable or chilled, and primary preservation is not freezing."
    role: "foreground production"
    quantitative_reference: "1 kg net conforming reference product released"
  - id: sanitation_wastewater
    name: "Sanitation and conditional on-site wastewater treatment"
    inclusion: "required"
    inclusion_condition: "Sanitation is always included; on-site wastewater treatment is included only when operated by the reporting facility."
    role: "foreground support"
    quantitative_reference: "Sanitation records allocated to the same production lot"
