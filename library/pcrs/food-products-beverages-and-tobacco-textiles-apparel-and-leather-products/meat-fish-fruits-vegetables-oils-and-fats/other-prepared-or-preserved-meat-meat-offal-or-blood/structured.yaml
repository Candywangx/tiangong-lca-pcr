allocation_rules:
  - rule_id: al_subdivision
    applies_to: "All foreground operations"
    rule: "First subdivide processes, meters, batch records, and route-specific equipment so that direct attribution is used wherever feasible. Do not allocate an exchange to an operation that demonstrably did not use or emit it."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_mass_balance
    applies_to: "Animal material, ingredients, products, co-products, and wastes"
    rule: "Close the lot mass balance before allocation. A reported co-product must have a documented function and destination; otherwise retain it as a waste to its actual management route."
    source_ids:
      - eu-pef-2021-2279
      - eu-jrc-sa-bref-2024
  - rule_id: al_avoid_double_count
    applies_to: "Broth, drippings, bone, adipose tissue, spent liquid, and rejects"
    rule: "Use the product card only for documented beneficial output and the waste card only for documented waste management. Never report the same physical mass in both alternatives."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_residual
    applies_to: "Unavoidable shared multi-output operation"
    rule: "After subdivision, apply an established physical causal relation when it represents the operation. If no defensible physical relation exists, apply economic allocation using contemporaneous, geography-matched, quality-documented prices and disclose the sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_waste_recovery
    applies_to: "Waste sent to recovery"
    rule: "Do not assign an avoided-product credit inside the foreground inventory unless the selected study method explicitly requires it and the substitution, quality, yield, and system-boundary treatment are documented. Preserve waste mass and destination before any downstream modelling."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_upstream
    applies_to: "Purchased inputs"
    rule: "Retain the allocation method of a qualified supplier dataset and disclose material deviations; do not recreate upstream slaughter allocation inside this foreground process unless the facility is integrated and separately modelled."
    source_ids:
      - eu-pef-2021-2279
      - eu-jrc-sa-bref-2024
dataset_production:
  collection_protocols:
    - protocol_id: cp_raw_material_receipt_material
      process_id: "raw_material_receipt"
      flow_role: "Individual atomic product input, transfer, package article, co-product, or conforming output"
      record_type: "Lot-scale mass, count, recipe, transfer, package issue, or release record"
      raw_fields: "lot_id; exact flow identity; supplier; animal species; tissue or blood source; product form; route; gross_mass; tare_mass; item_count; item_mass; timestamp; equipment_id; destination"
      collection_method: "Collect from calibrated scales, recipe systems, stock issues, transfer tickets, package counts, and release records; reconcile to the same lot."
      unit: "kg or converted kg"
      frequency: "Each production lot and every material issue or transfer"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "Every foreground line and storage location used for the declared product"
      aggregation_rule: "Sum only records with the same row_id after lot reconciliation; normalize through measured process outputs."
      quality_evidence: "Calibration, lot genealogy, supplier specification, recipe authorization, release record, and reconciliation sign-off"
    - protocol_id: cp_raw_material_receipt_resource
      process_id: "raw_material_receipt"
      flow_role: "One named electricity, heat, fuel, compressed-air, water-source, ice, or refrigerant exchange"
      record_type: "Meter, invoice, tank, cylinder, maintenance, or withdrawal record"
      raw_fields: "timestamp; process_id; meter_id; carrier_name; opening_reading; closing_reading; invoice_quantity; unit; calorific_value; water_source; refrigerant_type; opening_stock; make_up; recovered_mass; closing_stock"
      collection_method: "Read dedicated meters where available; otherwise allocate a shared reading with documented operating time or measured load while preserving each carrier identity."
      unit: "native unit plus kWh, MJ, m3, or kg"
      frequency: "At each meter interval, delivery, batch, or maintenance event"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All on-site equipment supplying the declared process"
      aggregation_rule: "Aggregate by process_id and exact row_id only; never combine energy carriers, water sources, or refrigerants."
      quality_evidence: "Meter calibration, invoice, tank dip, cylinder issue, maintenance log, allocation worksheet, and reviewer sign-off"
    - protocol_id: cp_raw_material_receipt_residue
      process_id: "raw_material_receipt"
      flow_role: "One named reject, point-of-generation wastewater, spent solution, sludge, package waste, or treatment residue"
      record_type: "Scale, tank, flow-meter, waste manifest, destination, or treatment log"
      raw_fields: "timestamp; lot_id; row_id; point_of_generation; gross_mass; tare_mass; volume; density; destination; waste_code; recovery_status; treatment_record"
      collection_method: "Measure at the point of generation or dispatch; convert volume only with documented density; match internal treatment inputs to the originating row."
      unit: "kg or converted kg"
      frequency: "Each lot, discharge batch, container, or waste dispatch"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All foreground generation points and on-site treatment units"
      aggregation_rule: "Sum by exact row_id and destination; never net against co-product output or pollutant removal."
      quality_evidence: "Scale or meter calibration, manifest, tank record, destination receipt, internal transfer match, and mass-balance sign-off"
    - protocol_id: cp_raw_material_receipt_emission
      process_id: "raw_material_receipt"
      flow_role: "One named air species, refrigerant species, discharged water substance, or discharged water quantity"
      record_type: "Fuel record, factor provenance, refrigerant balance, exhaust measurement, effluent flow, or laboratory result"
      raw_fields: "interval_start; interval_end; row_id; fuel_quantity; factor_value; factor_unit; factor_source; exhaust_flow; concentration; effluent_flow; sample_time; laboratory_method; detection_limit; compartment"
      collection_method: "Match activity and measurement intervals; calculate one substance and compartment at a time; retain raw observations, factor provenance, non-detect treatment, and calculation workbook."
      unit: "kg"
      frequency: "Each monitoring or balance interval, aggregated to the reporting period"
      temporal_coverage: "Complete declared reporting period with matched activity coverage"
      site_scope: "Every direct emission point assigned to the declared foreground processes"
      aggregation_rule: "Sum only the same species, direction, and compartment after unit checks; no cross-substance aggregation."
      quality_evidence: "Accredited or documented laboratory result, stack record, factor source, refrigerant service log, calculation workbook, and independent review"
