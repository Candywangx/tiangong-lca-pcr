measurement_rules:
  - id: mu_ref_net_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Determine net conforming product mass on calibrated equipment after excluding every package component, nonconforming product, retained sample not sold, and measurable free liquid not included in the declared product specification."
  - id: mu_stage_mass
    applies_to: "Animal inputs, ingredients, transfers, products, co-products, and solid wastes"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Preserve gross readings and tare records; report net mass by exact atomic identity and normalize only after the stage mass balance is closed."
  - id: mu_package_count
    applies_to: "Package articles"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "When purchasing records use item counts, multiply count by a lot-specific measured item mass; keep each container, closure, film, label, adhesive, pallet, or strap as a separate exchange."
  - id: mu_energy_carrier
    applies_to: "Grid electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Preserve metered electricity in kWh and never aggregate it with steam, hot water, natural gas, diesel, liquefied petroleum gas, or compressed air."
  - id: mu_thermal_carrier
    applies_to: "Steam, hot water, natural gas, diesel, liquefied petroleum gas"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert each carrier separately with the documented invoice basis or measured net calorific value; do not create a combined thermal-energy value."
  - id: mu_compressed_air
    applies_to: "Purchased compressed air"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Use separately metered delivered volume at the declared reference conditions and disclose those conditions."
  - id: mu_water_source
    applies_to: "Mains water, groundwater, surface water, wastewater"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep each source or point-of-generation stream separate; volume may be converted only with documented density and temperature assumptions."
  - id: mu_refrigerant
    applies_to: "Refrigerant make-up, recovery, and leakage species"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Close a refrigerant inventory balance by named refrigerant; split R404A loss into HFC-125, HFC-134a, and HFC-143a emissions using the supplier composition record."
  - id: mu_effluent_load
    applies_to: "Each wastewater substance"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Calculate one pollutant at a time from matched effluent flow and laboratory concentration over the same interval; retain units, sampling basis, non-detect treatment, and discharge compartment."
  - id: mu_route_yield
    applies_to: "Every process transfer"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Calculate input, conforming output, co-product, waste, and stock change by process and lot; never infer a missing flow by borrowing another product form or route."
process_map:
