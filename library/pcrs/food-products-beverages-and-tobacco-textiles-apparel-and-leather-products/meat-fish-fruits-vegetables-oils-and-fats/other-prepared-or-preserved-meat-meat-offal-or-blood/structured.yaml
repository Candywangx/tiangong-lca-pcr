  - id: preparation_formulation
    name: "Preparation, formulation, mincing, mixing, and forming"
    inclusion: "required"
    inclusion_condition: "Always included; record only the declared cutting, deboning, mincing, mixing, seasoning, filling, or forming operations."
    role: "foreground production"
