  calculation_rules:
    - id: cr_stage_normalization
      applies_to: "All foreground exchanges"
      rule: "Normalized row amount = reconciled row quantity × chained downstream conforming-transfer factors ÷ net conforming reference-product mass. Keep each row identity unchanged through normalization."
      inputs:
        - "Lot quantities"
        - "process transfer masses"
        - "reference net mass"
      output: "kg, MJ, kWh, or m3 per 1 kg reference product as appropriate"
      source_ids:
        - eu-pef-2021-2279
    - id: cr_item_mass
      applies_to: "Package articles recorded by count"
      rule: "Package mass = issued item count × lot-specific mean item mass measured from a documented sample; report each article separately."
      inputs:
        - "Item count"
        - "sample item masses"
        - "tare record"
      output: "kg of the named package article"
      source_ids:
        - eu-pef-2021-2279
    - id: cr_energy_conversion
      applies_to: "Steam, hot water, natural gas, diesel, liquefied petroleum gas"
      rule: "Carrier energy = recorded carrier quantity × documented invoice energy basis or measured net calorific value. Electricity remains in kWh and compressed air remains in m3."
      inputs:
        - "Carrier-specific meter or invoice quantity"
        - "conversion basis"
      output: "MJ for the same named carrier"
      source_ids:
        - eu-pef-2021-2279
    - id: cr_combustion_emission
      applies_to: "Each direct combustion air species"
      rule: "Emission mass = sum over each separately metered fuel of fuel energy × documented facility-, equipment-, or supplier-specific emission factor for that one species. No uncited PCR factor is permitted."
      inputs:
        - "Fuel energy by carrier"
        - "factor value"
        - "factor unit"
        - "operating assignment"
      output: "kg of one named air species"
      source_ids:
        - eu-jrc-sa-bref-2024
        - eu-pef-2021-2279
    - id: cr_refrigerant_balance
      applies_to: "Each installed refrigerant system"
      rule: "Refrigerant loss = opening stock + additions + make-up − closing stock − recovered mass − documented transfers. Report ammonia and HFC-134a directly; split R404A loss into HFC-125, HFC-134a, and HFC-143a using supplier composition."
      inputs:
        - "Opening stock"
        - additions
        - make-up
        - "closing stock"
        - "recovered mass"
        - transfers
        - "supplier composition"
      output: "kg of each named refrigerant species to air"
      source_ids:
        - eu-pef-2021-2279
    - id: cr_effluent_load
      applies_to: "Each direct-water-discharge row"
      rule: "Discharged load = sum of matched effluent volume × laboratory concentration after unit conversion and documented non-detect handling. Water quantity is calculated separately from pollutant mass."
      inputs:
        - "Effluent flow"
        - concentration
        - "time interval"
        - "laboratory unit"
        - "density where needed"
      output: "kg of one named substance or water to freshwater"
      source_ids:
        - eu-jrc-sa-bref-2024
        - eu-pef-2021-2279
    - id: cr_process_mass_balance
      applies_to: "Each foreground process and lot"
      rule: "Mass-balance discrepancy = material inputs − conforming product outputs − co-product outputs − waste outputs − closing stock + opening stock. Investigate and disclose rather than forcing the discrepancy to zero."
      inputs:
        - "Atomic material rows"
        - "stock change"
        - "process transfers"
      output: "Documented process mass balance and unresolved discrepancy"
      source_ids:
        - eu-pef-2021-2279
    - id: cr_reference_net_mass
      applies_to: "Reference product"
      rule: "Reference net mass = gross released package mass − measured package-component mass − nonconforming product mass excluded from release. Normalize to exactly 1 kg only after reconciliation."
      inputs:
        - "Gross release mass"
        - "each package mass"
        - "excluded product mass"
      output: "1 kg net conforming reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: cr_allocation_share
      applies_to: "Unavoidable shared multi-output operation"
      rule: "Allocated exchange = shared exchange × documented physical or economic allocation share; all shares for the same exchange must sum to one, with unrounded inputs retained."
      inputs:
        - "Shared exchange"
        - "causal parameter or contemporaneous price"
        - "co-product quantities"
      output: "Allocated atomic exchange by product"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and animal-origin inputs"
      requirement: "Demonstrate CPC 21189 identity, exact species, anatomical tissue or blood source, non-sausage form, one preservation route, and ambient or chilled release state. Do not use the reference-flow comment's incorrect 22182 or 22183 cross-references."
      evidence: "Retained CPC raw record, product specification, recipe, label, supplier specification, and lot genealogy"
    - id: dq_route
      applies_to: "Preservation process"
      requirement: "Retain actual equipment, operating sequence, batch, time-temperature or scheduled-process records, cooling, deviation review, and release authorization for the selected branch."
      evidence: "Codex-aligned process record and signed release review"
    - id: dq_canning
      applies_to: "Hermetic canning"
      requirement: "Retain container specification, closure checks, scheduled-process authority, critical-factor records, retort record, cooling record, container-integrity inspection, and deviation disposition."
      evidence: "CXC 23 process file for every canning campaign"
    - id: dq_temporal
      applies_to: "All foreground data"
      requirement: "Cover the complete declared reporting period and all included production lots; disclose shutdowns, campaigns, abnormal events, missing intervals, and substitutions."
      evidence: "Production calendar, meter coverage, lot list, gap log, and representativeness statement"
    - id: dq_technology
      applies_to: "Energy, refrigerant, package, and treatment rows"
      requirement: "Match records to actual site equipment, installed refrigerant, carrier, package specification, and treatment configuration; do not borrow another route's row."
      evidence: "Equipment register, utility diagram, refrigeration log, package bill, and treatment flow diagram"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Reconcile raw inputs, ingredients, water, each energy carrier, refrigerant make-up and emissions, package components, products, co-products, rejects, wastewater, residues, and direct air or water exchanges; justify every omitted applicable card."
      evidence: "Atomic-row completeness matrix and process mass balance"
    - id: dq_measurement
      applies_to: "Measured quantities"
      requirement: "Use calibrated equipment and preserve gross readings, tare, unit, timestamp, lot, equipment ID, conversion basis, and correction records."
      evidence: "Calibration certificates, raw exports, invoices, laboratory reports, and reviewed calculation workbook"
    - id: dq_allocation
      applies_to: "Shared operations and co-products"
      requirement: "Document subdivision attempts, allocation relation, parameters, prices where used, waste status, destination, and sensitivity. Prevent product/waste alternative double counting."
      evidence: "Allocation memo, price or physical-causality evidence, and sensitivity result"
    - id: dq_uuid
      applies_to: "Flow identities"
      requirement: "Only the verified reference product may carry the supplied UUID. Every other blank UUID must remain matched to exactly one manifest unresolved row until hybrid search and public state=100 direct read confirm exact identity."
      evidence: "UUID whitelist and row_id closure audit"
    - id: dq_source_use
      applies_to: "External evidence"
      requirement: "Use official sources for classification and method rules only within their stated purpose. Do not convert process descriptions into default amounts, ranges, or emission factors."
      evidence: "Source-to-rule matrix and absence of unsupported defaults"
    - id: dq_verification
      applies_to: "Dataset release"
      requirement: "A reviewer independent of data preparation must check identity, boundary, route, records, calculations, unit conversions, material balance, allocation, UUID closure, and disclosures before publication."
      evidence: "Signed verification checklist and resolved finding log"
validation_rules:
  - rule_id: vr_cpc_identity
    applies_to: "Dataset identity"
    rule: "Pass only when CPC is exactly 21189 and the product specification matches the declared included scope; fail use of 22182 or 22183 as exclusion references."
    source_ids:
      - unsd-cpc-3-21189
  - rule_id: vr_exclusions
    applies_to: "Dataset identity"
    rule: "Fail sausages, meat extracts or juices, complete meals, homogenized infant-type preparations, fish preparations, or products defined by freezing, salting, brining, smoking, or drying."
    source_ids:
      - unsd-cpc-3-21189
  - rule_id: vr_reference_uuid
    applies_to: "Reference product"
    rule: "Require UUID 61b39162-1ed6-4d66-b54b-9c0889bd9fc4, Product flow type, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids: []
  - rule_id: vr_reference_amount
    applies_to: "Reference product"
    rule: "Require exactly 1 kg net conforming product after package mass and nonconforming product are excluded."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: vr_qualifiers
    applies_to: "Reference product"
    rule: "Fail when exact animal and anatomical recipe, concrete product form, receipt state, one preservation route, final state, package specification, lot, site, time period, or allocation disclosure is missing."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: vr_route_lock
    applies_to: "Process selection"
    rule: "Require exactly one matching product-form route through thermal preservation, hermetic canning, or pickling/seasoning. Within thermal preservation, require exactly one named cooking, frying, roasting, or steaming method for the selected product transfer."
    source_ids:
      - codex-cxc-58-2005
      - codex-cxc-23-1979
      - fao-meat-processing-2007
  - rule_id: vr_canning_records
    applies_to: "Hermetic canning"
    rule: "Fail a canning dataset without documented filling, closure, scheduled process, cooling, integrity review, deviation handling, and lot records."
    source_ids:
      - codex-cxc-23-1979
  - rule_id: vr_atomic_flow
    applies_to: "Inventory"
    rule: "Require every Selected flow except the official broad reference product to name one concrete material, article, waste stream, substance, or compartment exchange; fail collection labels and and/or selectors."
    source_ids: []
  - rule_id: vr_energy_split
    applies_to: "Inventory"
    rule: "Require grid electricity, purchased steam, purchased hot water, natural gas, diesel, liquefied petroleum gas, and purchased compressed air to remain distinct by process; fail combined energy values."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: vr_water_split
    applies_to: "Inventory"
    rule: "Require mains water, groundwater, and surface water to remain distinct; preserve each point-of-generation wastewater stream and discharge destination."
    source_ids:
      - eu-jrc-sa-bref-2024
      - eu-pef-2021-2279
  - rule_id: vr_refrigerant
    applies_to: "Cold operations"
    rule: "Require the installed refrigerant identity, make-up, recovery, inventory balance, and individual leakage species; fail a pooled refrigerant emission."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: vr_package_mass
    applies_to: "Packaging"
    rule: "Require every package article separately and exclude total package mass from the 1 kg product mass."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: vr_mass_balance
    applies_to: "Each process"
    rule: "Require a reconciled material balance with documented discrepancies and prevent simultaneous reporting of the same mass as both co-product and waste."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: vr_effluent
    applies_to: "Direct discharge"
    rule: "Require matched flow and laboratory sampling for each pollutant and receiving compartment; fail a pooled pollutant row or an uncited default concentration."
    source_ids:
      - eu-jrc-sa-bref-2024
      - eu-pef-2021-2279
  - rule_id: vr_amount_mode
    applies_to: "All non-reference rows"
    rule: "Require foreground_record or calculated_value; fail unsupported fixed values, modelled estimates, reasoned-estimate ranges, or source-description-derived defaults."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: vr_uuid_closure
    applies_to: "All inventory rows"
    rule: "Require the reference UUID only on packaging_storage_release_reference_product; every other blank UUID must have exactly one matching manifest unresolved entry with candidate and rejection reason."
    source_ids: []
  - rule_id: vr_bilingual
    applies_to: "PCR projection"
    rule: "Require identical process_id, row_id, direction, flow type, controlled tokens, protocol_id, source-id order, and card order in English and Chinese."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific foreground manufacturing dataset for one declared CPC 21189 product."
  downstream_use: "May become a secondary_dataset or background_dataset only after methodology review, UUID resolution, aligned projection, data verification, and publication controls."
  allowed_use: "Comparative or attributional modelling only when product form, animal recipe, route, site, market state, time period, technology, package, allocation, and geography are sufficiently representative and disclosed."
  excluded_use: "Not a category-average default; not valid for sausages, complete meals, extracts, infant preparations, fish preparations, or freezing-, salting-, brining-, smoking-, or drying-defined products; not authorization for marine-mammal sourcing or sale."
  required_metadata: "PCR id; CPC 21189; reference UUID; exact recipe species and anatomy; product form; route; receipt and release states; site; geography; time period; process technologies; package bill; refrigerant; water source; wastewater route; allocation; co-product and waste destinations; source and verification references."
  required_quality_disclosure: "Coverage, missing data, substitutions, meter allocation, laboratory methods, non-detect handling, mass-balance discrepancy, conversion factors, data-quality assessment, UUID gaps, independent verification, and limitations."
  update_trigger: "Change in recipe species or anatomy, product form, preservation route, scheduled process, equipment, refrigerant, package, site, utility mix, wastewater treatment, allocation, co-product destination, reporting period, classification scope, reference identity, or governing source."
data_sources:
  - id: "unsd-cpc-3-21189"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0, retained official structure CSV, subclass 21189, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv (accessed 2026-08-13)"
    used_for: "Exact subclass title, parent context, and exclusions from CPC 21181–21184 and complete-meal subclass 21186."
  - id: "eu-jrc-sa-bref-2024"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Best Available Techniques Reference Document for the Slaughterhouses, Animal By-products and Edible Co-products Industries, JRC135916, DOI 10.2760/18199, https://doi.org/10.2760/18199 (accessed 2026-08-13)"
    used_for: "Separate upstream animal-material datasets, receipt handling, cleaning, utilities, wastewater, residues, co-products, and direct-emission inventory structure; no default quantities imported."
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279 on the use of the Environmental Footprint methods, consolidated text, https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng (accessed 2026-08-13)"
    used_for: "Product-specific bill of materials, company-specific manufacturing data, complete LCI, allocation hierarchy, transparency, data quality, and verification."
  - id: "codex-cxc-58-2005"
    type: "standard"
    reference: "Codex Alimentarius, Code of Hygienic Practice for Meat, CXC 58-2005, https://workspace.fao.org/sites/codex/Standards/CXC%2058-2005/CXC_058e.pdf (accessed 2026-08-13)"
    used_for: "Meat-product definitions, raw and processed segregation, process control, cooking records, cold storage, packaging, sanitation, traceability, and lot documentation."
  - id: "codex-cxc-23-1979"
    type: "standard"
    reference: "Codex Alimentarius, Code of Hygienic Practice for Low and Acidified Low-Acid Canned Foods, CXC 23-1979, https://workspace.fao.org/sites/codex/Standards/CXC%2023-1979/CXC_023e.pdf (accessed 2026-08-13)"
    used_for: "Hermetic-container filling and closure, scheduled thermal processing, rapid cooling, container-integrity control, deviation handling, and production records; no numerical process defaults imported."
  - id: "fao-meat-processing-2007"
    type: "handbook"
    reference: "Gunter Heinz and Peter Hautzinger, Meat Processing Technology for Small- to Medium-Scale Producers, FAO Regional Office for Asia and the Pacific, RAP Publication 2007/20, ISBN 978-974-7946-99-4, https://www.fao.org/3/a-ai407e.pdf (accessed 2026-08-13)"
    used_for: "Independent process decomposition for cutting, comminution, mixing, forming, cooking, frying, roasting, steaming, canning, formulation ingredients, packaging, and hygiene; no default quantities imported."
  - id: "eu-reg-853-2004"
    type: "standard"
    reference: "Regulation (EC) No 853/2004 laying down specific hygiene rules for food of animal origin, consolidated official text, https://eur-lex.europa.eu/eli/reg/2004/853/oj/eng (accessed 2026-08-13)"
    used_for: "Official identity for processed meat products, products of animal origin including blood, and anatomical product distinctions."
