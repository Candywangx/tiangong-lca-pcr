allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Shared foreground operations"
    rule: "Avoid allocation by separate route batches, direct metering or process subdivision wherever technically feasible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_output_status
    applies_to: "Products, co-products and waste"
    rule: "Classify each output from documented intended use, legal status and destination. Non-food or unfit-for-human-consumption status alone does not make an output waste and does not justify zero burden."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_fallback
    applies_to: "Unavoidable shared burdens"
    rule: "When subdivision is not feasible, use a demonstrable physical causal relationship; if none can be established, use an economic or other justified relationship and disclose the method, prices or physical parameters, period and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recovery
    applies_to: "Recycling, recovery or waste treatment"
    rule: "Keep treatment burdens and recovered-material or energy benefits consistent with the selected PEF-compatible end-of-life approach; do not add an avoided-product credit without declaring the substituted function and method."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receipt_lot
      process_id: "receipt_classification"
      flow_role: "incoming lot, eligible lot and rejects"
      record_type: "scale tickets, supplier records, inspection and disposition records"
      raw_fields: "lot_id; supplier; taxon_or_composition; legal_status; non_food_reason; intended_destination; gross_mass; tare_mass; net_received_mass; reject_mass_by_destination; eligible_mass; receipt_condition; receipt_time"
      collection_method: "Calibrated weighing plus documented lot inspection and reconciliation"
      unit: "kg"
      frequency: "Every lot"
      temporal_coverage: "Representative reporting period, normally at least 12 months or all campaigns if seasonal"
      site_scope: "Every included foreground site"
      aggregation_rule: "Sum by lot and destination, then normalize to qualified reference-product mass; investigate unresolved mass difference"
      quality_evidence: "Calibration records, supplier declaration, inspection record, disposition record and signed reconciliation"
    - protocol_id: cp_conditioning_route
      process_id: "conditioning_stabilization"
      flow_role: "route inputs, output and liquid waste"
      record_type: "batch log and meter records"
      raw_fields: "batch_id; route_code; input_mass; water_mass; ice_mass; salt_or_brine_mass; salinity; electricity_kwh; output_mass; moisture; glaze_mass; drained_mass; liquid_waste_mass; inventory_change"
      collection_method: "Calibrated weighing, meters, route log and applicable moisture or salinity tests"
      unit: "kg; kWh; declared composition unit"
      frequency: "Every conditioning batch"
      temporal_coverage: "Representative period covering seasonal and route variation"
      site_scope: "Each route and site separately"
      aggregation_rule: "Aggregate within one route and site; reconcile mass; normalize to route output and reference product"
      quality_evidence: "Calibration, test method, route log, batch reconciliation and exception record"
    - protocol_id: cp_final_mass_dispatch
      process_id: "final_mass_dispatch"
      flow_role: "net product, excluded mass, packaging and rejects"
      record_type: "dispatch weighing and packing record"
      raw_fields: "lot_id; route_code; gross_mass; tare_mass; packaging_mass; glaze_or_ice_mass; free_liquid_mass; drained_mass; net_product_mass; moisture; salt_or_salinity; reject_mass; destination; dispatch_time"
      collection_method: "Calibrated gross-tare weighing, applicable deglazing or draining, and packaging reconciliation"
      unit: "kg; declared composition unit"
      frequency: "Every dispatch lot"
      temporal_coverage: "Representative period, normally at least 12 months or all seasonal campaigns"
      site_scope: "Every included foreground site"
      aggregation_rule: "Separate net product from packaging, removable glaze, free liquid and rejects; normalize to 1 kg net product"
      quality_evidence: "Calibration, deglazing or draining record, packaging specification, dispatch record and lot sign-off"
  calculation_rules:
    - id: calc_received_net_mass
      applies_to: "Receipt lot"
      rule: "received net mass = gross received mass - tare mass"
      inputs:
        - gross_mass
        - tare_mass
      output: "net_received_mass"
      source_ids:
        - mass-balance-identity
    - id: calc_reference_net_mass
      applies_to: "Final dispatch lot"
      rule: "reference net mass = gross dispatch mass - tare and packaging mass - separately removable glaze or ice - free packing liquid; use documented drained mass when liquid-packed"
      inputs:
        - gross_mass
        - tare_mass
        - packaging_mass
        - glaze_or_ice_mass
        - free_liquid_mass
        - drained_mass
      output: "qualified_net_product_mass"
      source_ids:
        - codex-cxc-52-2003
        - mass-balance-identity
    - id: calc_route_mass_balance
      applies_to: "Each receipt or conditioning batch"
      rule: "unresolved mass difference = measured inputs + opening inventory - measured products - measured wastes - closing inventory; disclose evaporation or retained water separately when material"
      inputs:
        - input_masses
        - opening_inventory
        - product_masses
        - waste_masses
        - closing_inventory
        - moisture_or_water_change
      output: "unresolved_mass_difference"
      source_ids:
        - mass-balance-identity
        - eu-pef-2021-2279
    - id: calc_normalized_inventory
      applies_to: "All inventory rows"
      rule: "normalized amount = reporting-period attributable amount / qualified net reference-product mass from the same route and period"
      inputs:
        - attributable_amount
        - qualified_net_product_mass
      output: "amount per kg reference product"
      source_ids:
        - eu-pef-2021-2279
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Every lot"
      requirement: "Retain taxon or mixed-material description, supplier, legal status, non-food reason, intended destination, route and lot linkage; no record may imply food conformity."
      evidence: "Supplier declaration, inspection and disposition record, lot identifier and dispatch record"
    - id: dq_measurement
      applies_to: "Mass, energy, moisture and salinity records"
      requirement: "Use calibrated instruments or documented purchase reconciliation; retain test method, precision and conversions for moisture, salinity, glaze and drained mass."
      evidence: "Calibration certificates, meter records, laboratory or operational test sheets and calculation workbook"
    - id: dq_temporal_route_coverage
      applies_to: "Foreground averages"
      requirement: "Cover representative seasonal and route variation; keep route-specific data separate and disclose excluded campaigns, abnormal events and data gaps."
      evidence: "Coverage table by month, site and route; exception log"
    - id: dq_completeness_balance
      applies_to: "Each process and reporting period"
      requirement: "Reconcile material inputs, qualified output, rejects, liquid wastes and material inventory; investigate and disclose material unresolved differences."
      evidence: "Signed lot or batch mass balance and corrective-action record"
    - id: dq_secondary_data
      applies_to: "Upstream and treatment links"
      requirement: "Record geography, technology, time period, cut-off, allocation and substitution rationale for each secondary dataset."
      evidence: "Dataset metadata and PEF data-quality assessment"
validation_rules:
  - rule_id: validate_identity_non_food
    applies_to: "Product identity"
    rule: "The canonical id and CPC 3.0 code 21299 are declared; non-food status, reason, intended use and destination are explicit; neither names nor metadata represent the reference product as food."
    source_ids:
      - unsd-cpc-3-0-21299
  - rule_id: validate_reference_mass
    applies_to: "Reference flow"
    rule: "The reference amount equals 1 kg qualified net product using the stated UUIDs and Mass/kg basis; packaging, removable glaze or ice and free liquid are excluded, and moisture, salt or salinity, deglazed or drained mass qualifiers are present when applicable."
    source_ids:
      - codex-cxc-52-2003
      - mass-balance-identity
  - rule_id: validate_route_exclusivity
    applies_to: "Process map"
    rule: "Exactly one route code is declared; conditioning inventory is absent for direct_dispatch, and only the selected route's inputs and outputs are present otherwise."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "Receipt, conditioning and dispatch"
    rule: "Lot and batch mass balances reconcile within the site's documented scale and inventory uncertainty; any unresolved difference is quantified, investigated and disclosed rather than hidden in the reference product."
    source_ids:
      - mass-balance-identity
      - eu-pef-2021-2279
  - rule_id: validate_allocation_destinations
    applies_to: "Shared burdens and outputs"
    rule: "Subdivision is attempted first; every co-product and waste has legal status and destination; any fallback allocation or recovery credit is justified, parameterized and sensitivity-tested."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production dataset for an exact generic CPC 21299 non-food aquatic product"
  downstream_use: "secondary_dataset; background_dataset; input to process and lifecyclemodel projections"
  allowed_use: "Modelling a declared non-food CPC 21299 product from the stated receiving condition through the site gate for the same route, mass basis, legal status and geography"
  excluded_use: "Food products; CPC 21291 meals, flours or pellets; undeclared route mixtures; substitution for capture, aquaculture, rendering, feed, fertilizer, disposal, use or end-of-life datasets without an explicit scope extension"
  required_metadata: "Canonical PCR id, CPC reference, product UUID, Mass and unit-group UUIDs, non-food reason and destination, taxon or composition, legal status, route, condition, site and period, upstream links, net-mass basis, moisture, salinity or salt, glaze or drained mass where applicable, packaging, allocation and waste destinations"
  required_quality_disclosure: "Primary-data share, route and seasonal coverage, calibration and test methods, mass-balance differences, reasoned-estimate substitutions, secondary-dataset quality, allocation sensitivity and limitations"
  update_trigger: "Replace each provisional reasoned estimate when reviewed route- and site-specific evidence is available or before active review; update when product legal status, route, reference-flow UUID, measurement method, allocation method or material process technology changes"
