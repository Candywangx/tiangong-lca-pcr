    quantitative_reference: "kg received lot and kg eligible lot"
  - id: conditioning_stabilization
    name: "Route-specific conditioning or stabilization"
    inclusion: "conditional"
    inclusion_condition: "Include only for chilled_or_iced, frozen_or_glazed, salted_or_brined, or dried_or_other_stabilized; exactly one route is selected"
    role: "Preserve or adjust the declared non-food product state"
    quantitative_reference: "kg route output"
  - id: final_mass_dispatch
    name: "Net-mass determination, packaging and dispatch"
    inclusion: "required"
    inclusion_condition: "Always; packaging inputs are recorded only when used"
    role: "Produce the qualified non-food reference product at the site gate"
