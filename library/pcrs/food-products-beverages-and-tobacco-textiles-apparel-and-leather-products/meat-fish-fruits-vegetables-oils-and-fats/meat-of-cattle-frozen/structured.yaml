measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report exactly 1 kg of net frozen cattle meat as the quantitative reference; exclude pallets, reusable transport items, and separately reported packaging."
  - id: net_product_mass
    applies_to: "product and intermediate meat masses"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated scale records. State whether weights are hot carcass, chilled carcass, prepared meat, or frozen net product, and do not mix these bases without an explicit conversion."
  - id: frozen_state_temperature
    applies_to: "freezing release and frozen storage"
    required_property_ref:
      name: "Temperature"
      uuid: ""
    required_unit: "°C"
    rule: "Measure the thermal-centre release temperature and record time-resolved cold-store temperatures; the product shall reach -18 °C or colder after stabilization and remain at -18 °C or colder subject only to documented applicable tolerances."
  - id: water_mass_conversion
    applies_to: "water inputs and wastewater outputs"
    required_property_ref:
      name: "Mass or volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Preserve measured volume and temperature; when converting volume to mass, record the density assumption and conversion formula."
  - id: storage_duration
    applies_to: "frozen storage"
    required_property_ref:
      name: "Time"
      uuid: ""
    required_unit: "day"
    rule: "Record entry and exit timestamps by lot and calculate storage duration; storage electricity and losses shall be normalized using the same lot-time coverage."
