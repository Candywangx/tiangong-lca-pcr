  - id: cutting_and_packaging
    name: "Cutting, deboning, trimming, portioning, mincing, and packaging"
    inclusion: "conditional"
    inclusion_condition: "Include the operations actually used to obtain the declared product presentation and packaging form"
    role: "foreground product preparation"
    quantitative_reference: "kg prepared chilled cattle meat transferred to freezing"
  - id: quick_freezing
    name: "Quick freezing and release"
    inclusion: "required"
    inclusion_condition: "Always required for the frozen product identity"
    role: "foreground state conversion"
    quantitative_reference: "kg frozen cattle meat released at -18 °C or colder at the thermal centre"
  - id: frozen_storage
    name: "Frozen storage to the declared plant gate"
    inclusion: "required"
    inclusion_condition: "Include storage from freezing release until the declared gate; a zero-duration direct transfer shall still be recorded"
