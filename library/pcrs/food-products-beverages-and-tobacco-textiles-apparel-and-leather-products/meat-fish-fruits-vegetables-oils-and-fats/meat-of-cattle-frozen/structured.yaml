system_boundary:
  rules:
    - rule_id: boundary_route_accounting
      applies_to: "all foreground routes"
      rule: "Include every foreground operation from the declared starting condition through released frozen cattle meat, including animal deconstruction where applicable, packaging, refrigeration, water use, wastewater handling, and within-plant transport; explicitly disclose any omitted operation and its upstream dataset."
      source_ids:
        - fao-leap-large-ruminants-2016
        - codex-cxc-58-2005
    - rule_id: boundary_quick_freezing
      applies_to: "quick freezing and transfer to storage"
      rule: "Include energy, refrigerant make-up and leakage, product losses, freezing release checks, and transfer to cold storage; freezing is complete only after the thermal centre reaches -18 °C or colder after stabilization."
      source_ids:
        - codex-cxc-8-1976-2008
        - fao-meat-cold-store-1991
    - rule_id: boundary_cold_storage
      applies_to: "frozen storage before the declared gate"
      rule: "Include storage electricity, refrigerant losses, defrost-related resources, product losses, and the actual lot storage duration; preserve the cold-chain temperature record."
      source_ids:
        - codex-cxc-8-1976-2008
        - fao-meat-cold-store-1991
    - rule_id: boundary_cutoff_disclosure
      applies_to: "material and energy flows"
      rule: "Do not omit a flow known to be environmentally or mass-balance significant. Any screened-out flow shall be identified with the screening basis and included in completeness and sensitivity review."
      source_ids:
        - fao-leap-large-ruminants-2016
boundary_abstraction:
  declared_starting_condition: "Slaughter-ready live cattle at the abattoir gate for an integrated route, or purchased traceable chilled cattle carcasses or meat at the receiving gate for a partial route"
  starting_condition_role: "Primary material input whose upstream production and any omitted slaughter or chilling are represented by linked upstream datasets"
  product_classification_scope: "Frozen cattle meat corresponding to CPC 3.0:21131; fresh or chilled cattle meat and edible offal remain outside this product identity"
  recursive_input_rule: "If frozen cattle meat in the same category is used as an input, record it once as a traceable upstream product input with its own dataset and do not recursively recreate its already completed production stages"
  upstream_dataset_requirement: "Link geographically and temporally representative datasets for live cattle or purchased chilled meat and for purchased electricity, fuels, water, packaging, cleaning agents, refrigerants, transport, and waste treatment"
  disclosure: "Declare the actual starting material, included and omitted unit processes, product presentation, co-product treatment, cut-offs, storage duration, temperature-control regime, data gaps, and unresolved flow identities"
