allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "multifunctional foreground processes"
    rule: "First subdivide separately metered slaughter, dressing, cutting, freezing, storage, rendering, and utility operations wherever technically feasible; apply allocation only to genuinely shared burdens."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: allocation_revenue_products
    applies_to: "meat and revenue-generating co-products"
    rule: "When subdivision cannot resolve shared primary-processing burdens, allocate those burdens among frozen meat and all revenue-generating co-products using the revenue share for a representative period; retain quantities, prices, currency, geography, period, and calculation."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: allocation_residuals_and_waste
    applies_to: "non-revenue residuals and waste"
    rule: "Assign no product share to a material with no revenue at the processing gate, but retain collection, treatment, transport, and direct-emission burdens caused inside the foreground; do not classify a revenue-generating output as waste."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: allocation_shared_species
    applies_to: "facilities processing multiple animal species"
    rule: "Prefer species-specific metering or campaigns. If shared burdens remain, document the allocation basis using processed mass and operational differences; do not transfer burdens between species without an explicit calculation and sensitivity check."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: allocation_consistency
    applies_to: "all allocated results"
    rule: "Use one internally consistent allocation period and method across mass balance, utility use, waste handling, and co-product revenue; disclose sensitivity to materially different prices or methods."
    source_ids:
      - fao-leap-large-ruminants-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_slaughter_material_balance
      process_id: "slaughter_and_dressing"
      flow_role: "live cattle, dressed meat, and saleable co-products"
      record_type: "lot weight and dispatch records"
      raw_fields: "lot_id; animal_count; live_weight; hot_carcass_weight; chilled_weight; co_product_type; co_product_mass; timestamp"
      collection_method: "calibrated scales reconciled to production and dispatch records"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "all production days in the representative period"
      site_scope: "each included abattoir"
      aggregation_rule: "sum by lot and output category; reconcile opening and closing work-in-process"
      quality_evidence: "scale calibration, lot traceability, reconciliation sign-off, and exception log"
    - protocol_id: cp_slaughter_utilities
      process_id: "slaughter_and_dressing"
      flow_role: "electricity, fuels, thermal energy, and water"
      record_type: "meter, invoice, and operating-hour records"
      raw_fields: "meter_id; opening_reading; closing_reading; fuel_quantity; water_volume; operating_hours; production_mass; allocation_basis"
      collection_method: "direct meters or documented sub-meter/allocation method"
      unit: "kWh; MJ; kg; m3"
      frequency: "shift, day, or invoice period"
      temporal_coverage: "representative continuous 12-month period where available"
      site_scope: "each included facility and utility system"
      aggregation_rule: "subtract non-production uses; allocate shared use consistently; normalize to chilled output"
      quality_evidence: "meter calibration, invoices, allocation worksheet, and missing-data flags"
    - protocol_id: cp_slaughter_wastes
      process_id: "slaughter_and_dressing"
      flow_role: "wastewater, condemned material, and non-revenue residuals"
      record_type: "flowmeter, weighbridge, manifest, and laboratory records"
      raw_fields: "stream_id; mass_or_volume; destination; treatment_route; COD; nitrogen; sampling_time"
      collection_method: "metering or weighing plus representative composite sampling where treatment data require composition"
      unit: "kg; m3; mg/L"
      frequency: "each dispatch and scheduled sampling"
      temporal_coverage: "same period as product and utilities"
      site_scope: "each included discharge and waste route"
      aggregation_rule: "aggregate by stream and route; preserve sampled loads and uncertainty"
      quality_evidence: "meter or scale checks, laboratory report, waste manifest, and mass-balance reconciliation"
    - protocol_id: cp_cutting_material_balance
      process_id: "cutting_and_packaging"
      flow_role: "chilled meat, prepared meat, packaging, co-products, and rejects"
      record_type: "batch weights and stock issue records"
      raw_fields: "batch_id; input_mass; output_mass; presentation; bone_state; packaging_material; packaging_mass; co_product_mass; reject_mass"
      collection_method: "calibrated scales and inventory issue/return records"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "all batches in representative period"
      site_scope: "each included cutting or packaging line"
      aggregation_rule: "reconcile mass by batch; aggregate only like presentations"
      quality_evidence: "calibration, batch traveller, packaging bill, and yield reconciliation"
    - protocol_id: cp_cutting_utilities
      process_id: "cutting_and_packaging"
      flow_role: "cutting-room and packaging electricity"
      record_type: "meter and operating records"
      raw_fields: "meter_id; reading; operating_hours; line_output; allocation_basis"
      collection_method: "sub-meter or documented engineering allocation from facility meter"
      unit: "kWh"
      frequency: "shift or day"
      temporal_coverage: "same period as prepared-meat output"
      site_scope: "each included line and shared utility"
      aggregation_rule: "allocate shared electricity consistently and normalize to prepared output"
      quality_evidence: "meter evidence, equipment schedule, and allocation review"
    - protocol_id: cp_freezing_batch_energy
      process_id: "quick_freezing"
      flow_role: "meat input, frozen output, electricity, rejects, and release temperature"
      record_type: "batch or continuous-run records"
      raw_fields: "lot_id; input_mass; output_mass; electricity; start_time; end_time; inlet_temperature; thermal_centre_temperature; reject_mass"
      collection_method: "calibrated scales, electricity meter, and calibrated product-temperature sensors"
      unit: "kg; kWh; °C; h"
      frequency: "each lot or continuous run"
      temporal_coverage: "all freezing runs in representative period"
      site_scope: "each freezer and production line"
      aggregation_rule: "match energy and mass time windows; normalize to released frozen output"
      quality_evidence: "meter calibration, temperature-sensor calibration, release record, and downtime log"
    - protocol_id: cp_refrigerant_balance
      process_id: "quick_freezing"
      flow_role: "freezer and cold-store refrigerant make-up and emissions"
      record_type: "refrigerant inventory and service records"
      raw_fields: "refrigerant_species; opening_inventory; additions; recovery; transfers; closing_inventory; equipment_id; service_date"
      collection_method: "mass balance from weighed cylinders, purchase records, and service logs"
      unit: "kg"
      frequency: "each service event with annual reconciliation"
      temporal_coverage: "representative 12-month period including seasonal operation"
      site_scope: "each refrigeration system serving included processes"
      aggregation_rule: "calculate unrecovered loss by species and allocate using documented equipment service or load basis"
      quality_evidence: "cylinder weights, invoices, technician logs, leak test, and reconciliation"
    - protocol_id: cp_storage_lot_energy_temperature
      process_id: "frozen_storage"
      flow_role: "stored mass, duration, electricity, temperatures, losses, and release mass"
      record_type: "warehouse management, interval meter, temperature logger, and loss records"
      raw_fields: "lot_id; entry_mass; exit_mass; entry_time; exit_time; interval_kWh; air_temperature; product_temperature; loss_reason; loss_mass"
      collection_method: "lot timestamps linked to interval electricity and calibrated continuous temperature loggers"
      unit: "kg; day; kWh; °C"
      frequency: "continuous temperature and meter intervals; each lot movement"
      temporal_coverage: "complete declared storage period and representative annual facility period"
      site_scope: "each included cold room and lot"
      aggregation_rule: "calculate lot-days; allocate electricity consistently by capacity and time; reconcile losses"
      quality_evidence: "logger and meter calibration, alarm history, stock reconciliation, and corrective-action record"
    - protocol_id: cp_coproduct_revenue
      process_id: "slaughter_and_dressing"
      flow_role: "allocation shares for meat and co-products"
      record_type: "sales and production records"
      raw_fields: "product_id; mass; net_price; currency; market; transaction_date; excluded_fees"
      collection_method: "audited or traceable invoices matched to production quantities"
      unit: "kg and currency/kg"
      frequency: "each transaction, summarized monthly"
      temporal_coverage: "representative 12-month period aligned with inventory"
      site_scope: "each included facility and output market"
      aggregation_rule: "calculate revenue by product and representative revenue shares; test material price variation"
      quality_evidence: "invoice sample, currency method, reconciliation to accounts, and sensitivity worksheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground amounts"
      rule: "normalized amount = attributable lot or period amount / net frozen cattle meat mass at the declared gate"
      inputs:
        - "attributable amount"
        - "net reference-product mass"
      output: "amount per 1 kg reference flow"
      source_ids:
        - fao-leap-large-ruminants-2016
    - id: calc_process_yield
      applies_to: "slaughter, preparation, freezing, and storage"
      rule: "process yield = accepted process output mass / accepted process input mass; report numerator and denominator states separately"
      inputs:
        - "accepted input mass"
        - "accepted output mass"
      output: "mass yield and loss fraction"
      source_ids:
        - fao-leap-large-ruminants-2016
    - id: calc_water_mass
      applies_to: "water and wastewater"
      rule: "converted mass = measured volume × documented density at the recorded or justified temperature; preserve original volume"
      inputs:
        - "measured volume"
        - density
        - temperature
      output: "kg water or wastewater"
      source_ids: []
    - id: calc_refrigerant_loss
      applies_to: "freezing and storage refrigeration"
      rule: "unrecovered loss by species = opening inventory + additions + inbound transfers - recovery - outbound transfers - closing inventory; negative results require investigation"
      inputs:
        - "inventory and service records by refrigerant species"
      output: "kg refrigerant emitted or unresolved balance"
      source_ids:
        - fao-leap-large-ruminants-2016
    - id: calc_storage_energy
      applies_to: "frozen storage"
      rule: "allocated storage electricity = interval electricity × documented lot allocation share; lot result = sum allocated electricity over entry-to-exit intervals"
      inputs:
        - "interval electricity"
        - "lot mass"
        - "occupied capacity"
        - "entry and exit time"
      output: "kWh per stored lot and kWh/(kg·month)"
      source_ids:
        - codex-cxc-8-1976-2008
        - fao-meat-cold-store-1991
    - id: calc_revenue_share
      applies_to: "shared slaughter and preparation burdens"
      rule: "revenue share_i = quantity_i × representative net price_i / sum(quantity_j × representative net price_j) for all revenue-generating co-products j"
      inputs:
        - "product quantities"
        - "net prices"
        - "currency and period"
      output: "allocation share by product"
      source_ids:
        - fao-leap-large-ruminants-2016
    - id: calc_mass_balance
      applies_to: "each process and full foreground"
      rule: "mass-balance gap = total measured inputs - total measured product outputs - total measured waste outputs - documented inventory change; investigate rather than force-close material gaps"
      inputs:
        - inputs
        - outputs
        - wastes
        - "inventory change"
      output: "absolute and relative mass-balance gap"
      source_ids:
        - fao-leap-large-ruminants-2016
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "cattle, meat, co-products, and reference product"
      requirement: "Preserve lot linkage from declared starting material through the frozen reference product and declare presentation, bone state, packaging, route, and gate."
      evidence: "receiving, production, warehouse, and release records linked by lot identifier"
    - id: dq_temporal_representativeness
      applies_to: "routine foreground data"
      requirement: "Use a recent representative 12-month period where available, or justify a shorter campaign and disclose seasonality, downtime, and exceptional operation."
      evidence: "dated raw records, production calendar, and representativeness statement"
    - id: dq_measurement_control
      applies_to: "mass, energy, water, temperature, and refrigerant data"
      requirement: "Use calibrated instruments or traceable invoices; identify estimated intervals and the substitution method."
      evidence: "calibration certificates, invoices, meter register, and gap log"
    - id: dq_completeness
      applies_to: "process and foreground mass and energy balance"
      requirement: "Account for material inputs, meat outputs, co-products, wastes, water, wastewater, packaging, energy, refrigerants, and storage losses; explain every material balance gap and cut-off."
      evidence: "process mass balances, utility reconciliation, cut-off register, and corrective actions"
    - id: dq_temperature_history
      applies_to: "freezing release and storage"
      requirement: "Retain thermal-centre release measurement, continuous or sufficiently frequent storage temperature records, alarms, excursions, and corrective actions for the declared lot period."
      evidence: "calibrated logger export, release record, alarm log, and disposition decision"
    - id: dq_allocation
      applies_to: "multifunctional processes"
      requirement: "Retain subdivision decisions, all revenue-generating outputs, representative prices, currency treatment, allocation shares, and sensitivity to materially different prices or methods."
      evidence: "allocation workbook, invoice evidence, and sensitivity result"
    - id: dq_uncertainty_and_estimates
      applies_to: "reasoned estimates, proxy data, and calculated values"
      requirement: "Flag every estimate, retain its basis and range, quantify or qualitatively discuss uncertainty, and replace candidate-stage reasoned estimates with records or reviewed evidence before publication unless explicitly accepted."
      evidence: "data-quality register, uncertainty statement, reviewer decision, and replacement record"
    - id: dq_geography_and_technology
      applies_to: "upstream and background datasets"
      requirement: "Match facility geography, electricity market, fuel, water, treatment route, refrigerant species, freezing technology, and reference year; document every proxy."
      evidence: "dataset metadata and proxy-justification log"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require exactly 1 kg net Meat of cattle, frozen with product UUID 16e6d353-2acd-4dc3-99b3-fce9d27fbbd7, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg; reject substitution by fresh/chilled meat or edible offal."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "reference product metadata"
    rule: "Fail conformance when cattle class, product presentation, bone state, net mass basis, packaging form, freezing technology, release temperature, storage duration, geography, period, or gate is missing."
    source_ids: []
  - rule_id: validate_route_completeness
    applies_to: "process map and upstream links"
    rule: "Require quick freezing and frozen storage records. When live cattle enter the foreground require slaughter and dressing; when purchased chilled meat enters require a linked upstream dataset covering omitted stages."
    source_ids:
      - fao-leap-large-ruminants-2016
      - codex-cxc-58-2005
  - rule_id: validate_frozen_state
    applies_to: "quick freezing release and cold storage"
    rule: "Require evidence that the thermal centre reached -18 °C or colder after stabilization and that storage maintained -18 °C or colder subject only to documented applicable tolerances; treat missing temperature evidence as inconclusive."
    source_ids:
      - codex-cxc-8-1976-2008
  - rule_id: validate_mass_balance
    applies_to: "every included process and full foreground"
    rule: "Calculate and report mass-balance gaps; any unexplained gap outside the reviewed tolerance is an error and shall not be hidden by adjusting the reference product."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: validate_allocation
    applies_to: "shared foreground burdens"
    rule: "Require subdivision evidence or complete revenue allocation across all revenue-generating co-products, with no allocation share assigned to non-revenue residuals and no saleable product misclassified as waste."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: validate_refrigerants
    applies_to: "freezing and storage refrigeration"
    rule: "Require refrigerant species, equipment scope, inventory balance, and substance-specific elementary emissions; reject an unidentified aggregate refrigerant emission as final inventory."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: validate_data_coverage
    applies_to: "foreground records"
    rule: "Report accepted inputs, checks performed, checks skipped, findings, and completeness; missing required process, utility, wastewater, temperature, allocation, or loss evidence makes validation inconclusive."
    source_ids:
      - fao-leap-large-ruminants-2016
      - codex-cxc-8-1976-2008
  - rule_id: validate_reasoned_estimates
    applies_to: "all reasoned_estimate ranges"
    rule: "Treat candidate-stage ranges only as QA guardrails, never as collected values or publication-critical allowed ranges; require replacement or explicit methodology-review acceptance before publication."
    source_ids: []
  - rule_id: validate_unresolved_uuids
    applies_to: "non-reference inventory identities"
    rule: "Before publication, resolve every used product, waste, and elementary flow to the correct Tiangong identity or document an approved identity exception; never reuse the reference-product UUID for another inventory role."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground frozen-cattle-meat production data package and its process or lifecyclemodel projection"
  downstream_use: "secondary_dataset; background_dataset when geography, technology, allocation, and data-quality metadata are adequate for the intended model"
  allowed_use: "Attributional LCA and inventory construction for the declared frozen cattle meat route, presentation, geography, period, gate, and storage duration"
  excluded_use: "Fresh or chilled meat, edible offal, cooked or prepared products, non-cattle meat, undisclosed proxy routes, food-safety certification, or comparative assertions without harmonized scope and reviewed quality"
  required_metadata: "PCR id and version; CPC reference; product qualifiers; facility geography; reference year; route and gate; included processes; upstream dataset links; storage duration; temperature regime; allocation method; cut-offs; data sources; unresolved identities; reviewer status"
  required_quality_disclosure: "Primary-data share and coverage; instrument and invoice basis; mass-balance gaps; temperature excursions; allocation sensitivity; refrigerant balance; wastewater characterization; proxy datasets; reasoned estimates; uncertainty; limitations"
  update_trigger: "Change in product presentation, starting condition, freezing or refrigeration technology, refrigerant species, packaging, storage duration, facility geography, energy supply, allocation economics, regulation, source evidence, or a material data-quality finding"
