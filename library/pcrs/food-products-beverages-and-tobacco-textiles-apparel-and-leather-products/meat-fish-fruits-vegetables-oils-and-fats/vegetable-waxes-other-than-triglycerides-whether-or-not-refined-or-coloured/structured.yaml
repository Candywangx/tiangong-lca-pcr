validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Resolve CPC 21931 and the verified reference Product flow while excluding triglycerides, CPC 21932 residues and non-vegetable waxes."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "Declare exactly one botanical source, starting condition, route, refined state, colour state, product form and release specification."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "Report exactly 1 kg net conforming wax and exclude every packaging component from reference mass."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "Include every required process and each applicable conditional process, with one atomic exchange per inventory card."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "Keep electricity, purchased saturated steam, purchased hot water, natural gas, diesel, LPG, each refrigerant, each solvent, each chemical, each packaging component, each waste and each emission separate."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "Use only foreground records or calculations from collected records; no default amount, default range, modelled estimate or reasoned estimate is supplied by this PCR."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile wax mass, each solvent, each refrigerant and the reporting-period wastewater volume and loads."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Preserve co-product identity and disclose subdivision or allocation with data, method and sensitivity."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Leave each non-reference UUID blank until exact dual verification and maintain row_id closure in manifest review metadata."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Reject a dataset whose English and Chinese process_id, row_id, direction, flow type, Selected flow, UUID, property/unit, value mode, specificity, basis kind, evidence kind, collection protocol or source-id ordering differ."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific foreground data package for one botanical wax production or refining route"
  downstream_use: "Projection to TianGong flow, process and lifecyclemodel records and reviewed comparative or footprint studies"
  allowed_use: "Use only for the declared botanical identity, route, product specification, site and reporting period"
  excluded_use: "Generic vegetable-wax average; substitution among carnauba, candelilla and rice bran wax; triglyceride, animal, mineral, petroleum or synthetic wax; CPC 21932 residue; unsupported botanical wax identity"
  required_metadata: "CPC code, botanical and scientific identity, supplier/source geography, starting condition, exact route and technology, refined and colour state, product form and specification, reference UUID, site, period, capacity and utilization, allocation, wastewater destination, packaging, exclusions and unresolved UUID register"
  required_quality_disclosure: "Primary-data share, temporal/geographical/technological representativeness, meter and scale coverage, laboratory methods, mass/solvent/refrigerant/water reconciliations, allocation sensitivity, missing data and verification result"
  update_trigger: "New botanical wax identity or route; product-specification change; solvent, refrigerant, bleaching, extraction, forming, packaging or treatment technology change; material supplier, allocation or boundary change; new dual-verified Tiangong UUID; material evidence or regulatory change"
