    inclusion_condition: "Include when the declared botanical wax is melted, clarified or filtered before release or further refinement."
    role: "foreground_transformation"
    quantitative_reference: "Clarified botanical wax"
  - id: bleaching_acid_refinement
    name: "Botanical-wax bleaching and acid refinement"
    inclusion: "conditional"
    inclusion_condition: "Include only when the locked product specification requires hydrogen-peroxide bleaching, sulfuric-acid treatment, activated-clay treatment, or a documented combination; each actual treatment remains an individual card."
    role: "foreground_transformation"
    quantitative_reference: "Refined botanical wax"
  - id: forming_cooling
    name: "Wax forming and cooling"
    inclusion: "conditional"
    inclusion_condition: "Include when bulk wax is remelted, flaked, slabbed or otherwise formed at the reporting site; lock one botanical identity and one actual product form."
    role: "foreground_transformation"
    quantitative_reference: "Formed botanical wax"
  - id: packaging_release
    name: "Packaging, quality release and reference-product normalization"
    inclusion: "required"
    inclusion_condition: "Include for every dataset; use only the packaging components actually crossing the boundary and normalize net conforming wax mass without packaging."
