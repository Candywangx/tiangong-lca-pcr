allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "First avoid allocation by retaining route-specific unit processes and separate botanical identities. Attribute directly metered or batch-recorded inputs and outputs to the process that caused them. Internal wax intermediates and recovered solvents are not double-counted when transferred between foreground processes."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Where one process yields two externally usable products, such as crude wax and dewaxed rice bran oil, first test physical subdivision using batch, mass, composition, energy and equipment records. If subdivision is not feasible, apply a documented product-specific allocation method consistent with the study goal and EU PEF hierarchy, disclose the allocation key, data period and sensitivity, and never classify a co-product as waste merely to avoid allocation. Burdens and credits for reused solvents, recycled wax scrap, botanical residues, spent media, sludge and packaging waste follow their documented destination and the chosen system model; no avoided-burden default is prescribed."
    source_ids: []
