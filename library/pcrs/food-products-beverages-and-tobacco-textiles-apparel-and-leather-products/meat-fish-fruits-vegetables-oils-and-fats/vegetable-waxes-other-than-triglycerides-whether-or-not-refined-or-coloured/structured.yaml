  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "reference_vegetable_wax"
      rule: "net conforming wax mass = gross released pack mass minus tare and all packaging mass; normalize inventory by net mass"
      inputs:
        - "gross release mass"
        - tare
        - "each packaging-component mass"
        - "reject mass"
      output: "kg net conforming wax"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_reconciliation
      applies_to: "each wax transformation"
      rule: "calculate the same-basis batch mass balance and investigate unexplained loss before release"
      inputs:
        - "named feedstock and intermediate masses"
        - "conforming output"
        - residues
        - "wastewater wax"
        - "off-spec wax"
        - "retained wax"
      output: "reconciled batch mass balance"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_solvent_release
      applies_to: "each named solvent-air row"
      rule: "solvent release = fresh solvent plus returned inventory minus recovered solvent minus solvent transferred in product, wastewater and residues, adjusted for verified stock change"
      inputs:
        - fresh
        - recovered
        - "stock-change and carry-over records for one chemical"
      output: "kg of that solvent to air"
      source_ids:
        - usda-ams-carnauba-wax-2014
        - usda-nifa-rice-bran-wax-0209429
    - id: calc_refrigerant_release
      applies_to: "each named refrigerant-air row"
      rule: "use equipment-specific inventory, make-up, recovery and service records for the exact refrigerant; do not use one mixed-refrigerant line"
      inputs:
        - "opening and closing charge"
        - make-up
        - "recovered refrigerant"
        - "service record"
      output: "kg of named refrigerant to air"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_effluent_load
      applies_to: "each named pollutant-to-water row"
      rule: "load = matched analytical concentration multiplied by treated effluent volume with documented unit conversion and sampling representativeness"
      inputs:
        - concentration
        - "flow volume"
        - "sampling period"
        - "analytical method"
      output: "kg of named parameter to water"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_combustion_release
      applies_to: "each named combustion-air row"
      rule: "multiply measured fuel use by site-specific monitored or permitted factor for the exact pollutant and document oxidation or control assumptions"
      inputs:
        - "named fuel quantity"
        - "lower or higher heating value basis"
        - "pollutant-specific factor"
        - "abatement record"
      output: "kg of named substance to air"
      source_ids:
        - eu-fdm-bat-2019-2031
