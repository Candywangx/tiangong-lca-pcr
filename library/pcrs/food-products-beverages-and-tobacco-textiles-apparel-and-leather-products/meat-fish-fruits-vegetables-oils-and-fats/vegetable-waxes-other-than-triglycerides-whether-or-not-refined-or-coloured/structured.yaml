    role: "foreground_transformation"
    quantitative_reference: "Crude carnauba wax"
  - id: candelilla_hot_water_extraction
    name: "Candelilla acidified-water extraction and filter pressing"
    inclusion: "conditional"
    inclusion_condition: "Include only for the declared acidified-water candelilla route."
    role: "foreground_transformation"
    quantitative_reference: "Crude candelilla wax"
  - id: rice_bran_wax_recovery
    name: "Rice-bran-wax recovery"
    inclusion: "conditional"
    inclusion_condition: "Include only for a declared dry, wet, solvent-winterization, high-temperature n-hexane, or supercritical-carbon-dioxide rice-bran route; lock one technology in the dataset."
    role: "foreground_transformation"
    quantitative_reference: "Crude rice bran wax"
  - id: carnauba_solvent_extraction
    name: "Carnauba wax-powder solvent extraction"
    inclusion: "conditional"
