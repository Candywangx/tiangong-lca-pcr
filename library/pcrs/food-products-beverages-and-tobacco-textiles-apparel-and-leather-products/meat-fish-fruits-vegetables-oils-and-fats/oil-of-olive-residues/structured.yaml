allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "separately metered processes and batches"
    rule: "Avoid allocation by subdividing drying, extraction, refining, blending, storage, and packaging records wherever direct metering or batch records permit."
    source_ids:
      - eu-environmental-footprint-2021-2279
  - rule_id: allocation_internal_pomace_fuel
    applies_to: "extracted pomace combusted on site"
    rule: "Treat measured extracted pomace burned in the dryer as an internal product input and subtract it from exported extracted-pomace output; do not credit it again as exported fuel."
    source_ids:
      - alonso-farinas-olive-pomace-oil-lca-2020
  - rule_id: allocation_exported_co_products
    applies_to: "exported extracted olive pomace and other marketable outputs"
    rule: "If subdivision cannot isolate burdens, apply a documented physical relationship that reflects the process function; use another relationship only after explaining why subdivision, system expansion, and physical allocation are not feasible."
    source_ids:
      - eu-environmental-footprint-2021-2279
  - rule_id: allocation_soap_stock
    applies_to: "soap stock"
    rule: "Treat soap stock as waste unless reviewed evidence demonstrates a marketable product and the foreground records support co-product treatment."
    source_ids:
      - alonso-farinas-olive-pomace-oil-lca-2020
  - rule_id: allocation_disclosure
    applies_to: "all multifunctional processes"
    rule: "Report output masses, internal use, exported quantities, chosen allocation method, factors, prices or physical parameters, reference period, and sensitivity result."
    source_ids:
      - eu-environmental-footprint-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_integrated_batch_inventory
      process_id: "integrated_pomace_oil_production"
      flow_role: "all integrated production exchanges"
      record_type: "batch production record and meter ledger"
      raw_fields: "batch id; input and output masses; pomace moisture; electricity; each fuel; water; hexane purchased and recovered; sodium hydroxide solution mass and concentration; wastewater; each waste; each direct emission; product grade"
      collection_method: "calibrated scales and meters, invoices, solvent mass balance, laboratory records, and verified emission calculation"
      unit: "row-specific"
      frequency: "per batch with monthly reconciliation"
      temporal_coverage: "at least 12 representative months or the full shorter campaign"
      site_scope: "all foreground drying, extraction, recovery, and refining equipment"
      aggregation_rule: "sum exchange records, reconcile mass and solvent balances, and divide by conforming oil mass"
      quality_evidence: "calibration records; invoices; laboratory results; meter reconciliation; documented emission factors"
    - protocol_id: cp_blending_batch_inventory
      process_id: "grade_specific_blending"
      flow_role: "all blending exchanges"
      record_type: "blend batch sheet"
      raw_fields: "batch id; refined olive-pomace oil mass; virgin olive oil mass and grade; electricity; accepted output; rejected oil"
      collection_method: "calibrated batch scales, tank gauges, and electricity meter"
      unit: "row-specific"
      frequency: "per blend batch"
      temporal_coverage: "at least 12 representative months or the full shorter campaign"
      site_scope: "all foreground blending equipment"
      aggregation_rule: "sum batch exchanges and divide by accepted blended-oil mass"
      quality_evidence: "scale calibration; supplier certificate; blend formula; mass-balance closure"
    - protocol_id: cp_bulk_storage_loading_inventory
      process_id: "bulk_storage_and_loading"
      flow_role: "all storage and loading exchanges"
      record_type: "tank and dispatch log"
      raw_fields: "tank id; product grade; opening and closing mass; electricity; hot-water energy; steam energy; rinse water; dispatched mass; rinse wastewater; cleaning inspection"
      collection_method: "calibrated tank gauge or weighbridge, utility meters, and cleaning log"
      unit: "row-specific"
      frequency: "per tank campaign and dispatch"
      temporal_coverage: "at least 12 representative months or the full shorter campaign"
      site_scope: "all foreground tanks, pumps, heating, and loading equipment"
      aggregation_rule: "reconcile opening stock plus receipts minus closing stock and losses, then divide utilities by dispatched oil mass"
      quality_evidence: "calibration; temperature log; cleaning inspection; previous-cargo declaration where relevant"
    - protocol_id: cp_packaging_run_inventory
      process_id: "consumer_packaging"
      flow_role: "all packaging exchanges"
      record_type: "packaging bill of materials and run reconciliation"
      raw_fields: "run id; net oil input and output; electricity; mass of each container, closure, label, carton, pallet, and film; each material-specific scrap; rejected oil; pallet reuse count"
      collection_method: "purchase and issue records, component specifications, line meter, reject log, and net-fill checks"
      unit: "row-specific"
      frequency: "per packaging run with monthly reconciliation"
      temporal_coverage: "at least 12 representative months or the full shorter campaign"
      site_scope: "all foreground filling, capping, labelling, case packing, and palletizing equipment"
      aggregation_rule: "reconcile each component separately and divide by accepted net packaged-oil mass"
      quality_evidence: "supplier specifications; count-to-mass conversion; meter calibration; reject log; net-fill verification"
  calculation_rules:
    - id: normalize_exchange_to_reference_flow
      applies_to: "every inventory exchange"
      rule: "normalized amount = exchange amount attributable to the product / conforming declared oil mass"
      inputs:
        - "row-specific exchange record"
        - "conforming oil mass"
      output: "row-specific amount per 1 kg reference flow"
      source_ids:
        - eu-environmental-footprint-2021-2279
    - id: pomace_dry_matter
      applies_to: "received and extracted pomace"
      rule: "dry matter = wet mass × (1 − moisture mass fraction)"
      inputs:
        - "wet mass"
        - "moisture mass fraction"
      output: "kg dry matter"
      source_ids:
        - alonso-farinas-olive-pomace-oil-lca-2020
    - id: solvent_loss_to_air
      applies_to: "technical hexane"
      rule: "hexane loss = opening solvent inventory + purchases − closing inventory − documented solvent in products and wastes; reconcile measured vent capture separately"
      inputs:
        - "solvent inventory"
        - purchases
        - recovery
        - "product and waste tests"
      output: "kg technical hexane loss to air"
      source_ids:
        - alonso-farinas-olive-pomace-oil-lca-2020
    - id: exported_pomace_balance
      applies_to: "extracted olive pomace"
      rule: "exported extracted pomace = total extracted pomace produced − extracted pomace combusted on site − other measured internal use"
      inputs:
        - "total extracted-pomace output"
        - "internal fuel mass"
        - "other internal use"
      output: "kg exported extracted olive pomace"
      source_ids:
        - alonso-farinas-olive-pomace-oil-lca-2020
    - id: blend_mass_balance
      applies_to: "olive-pomace-oil blend"
      rule: "accepted blend output + rejected oil + measured losses = refined olive-pomace oil input + virgin olive oil input"
      inputs:
        - "both oil inputs"
        - "accepted output"
        - "rejected output"
        - "measured loss"
      output: "batch mass-balance closure and component mass fractions"
      source_ids:
        - fao-who-cxs-33-1981-2024
        - ioc-trade-standard-2026
    - id: packaging_component_mass
      applies_to: "each packaging component"
      rule: "component mass per kg oil = issued component count × verified unit mass / accepted net packaged-oil mass; reusable pallet mass is divided by verified reuse count"
      inputs:
        - "issued count"
        - "unit mass"
        - "net oil mass"
        - "reuse count when applicable"
      output: "kg of the specific component per kg net oil"
      source_ids:
        - eu-environmental-footprint-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain grade-specific laboratory certificates and declarations demonstrating CPC 21673 identity and distinguishing crude, refined, and blended olive-pomace oil from olive oil and re-esterified or other-oil mixtures."
      evidence: "product specification; laboratory results; fao-who-cxs-33-1981-2024; ioc-trade-standard-2026"
    - id: dq_temporal_coverage
      applies_to: "foreground inventory"
      requirement: "Use at least 12 representative months unless the campaign is shorter; disclose campaign dates, seasonality, downtime, and missing-data treatment."
      evidence: "production calendar; meter coverage; reconciliation report; eu-environmental-footprint-2021-2279"
    - id: dq_mass_balance
      applies_to: "pomace, oil, solvent, and waste records"
      requirement: "Close wet and dry pomace balances, oil-grade balances, solvent balance, and packaging-component reconciliation; investigate material residuals rather than forcing closure."
      evidence: "signed balance sheets; moisture tests; tank and scale calibration"
    - id: dq_atomic_exchanges
      applies_to: "all inventory rows"
      requirement: "Every electricity, hot-water, steam, natural-gas, diesel, chemical, packaging component, waste stream, and elementary emission actually used must be represented by its own atomic exchange. Any additional cleaning chemical or packaging component must be added as another row before conformance."
      evidence: "row-id audit; purchase ledger; bill of materials; waste manifest"
    - id: dq_storage_integrity
      applies_to: "bulk storage and loading"
      requirement: "Retain tank cleanliness, dryness, material compatibility, temperature, previous-cargo, and loading inspection records, and minimize air contact and overheating."
      evidence: "inspection reports; temperature logs; previous-cargo declarations; fao-who-cxc-36-1987-2024"
    - id: dq_background_links
      applies_to: "upstream and treatment datasets"
      requirement: "Match geography, technology, reference period, product grade, fuel route, packaging material, and waste-treatment route; disclose proxies and their sensitivity."
      evidence: "dataset metadata and data-quality assessment; eu-environmental-footprint-2021-2279"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The product flow UUID, Mass property UUID, Units of mass UUID, kg unit, CPC 21673 coordinate, declared product grade, and full product semantics must all match."
    source_ids:
      - unsd-cpc-3-0-2025
      - fao-who-cxs-33-1981-2024
      - ioc-trade-standard-2026
  - rule_id: validate_grade_and_route
    applies_to: "product dataset"
    rule: "Reject a dataset that omits crude/refined/blended grade, solvent or physical extraction route, refining status, blend composition when applicable, intended use, or gate."
    source_ids:
      - fao-who-cxs-33-1981-2024
      - ioc-trade-standard-2026
  - rule_id: validate_mass_and_moisture
    applies_to: "production inventory"
    rule: "Require measured oil output, wet pomace mass, pomace moisture or dry matter, extracted-pomace output, internal fuel use, and an investigated mass-balance residual."
    source_ids:
      - alonso-farinas-olive-pomace-oil-lca-2020
  - rule_id: validate_solvent
    applies_to: "solvent extraction route"
    rule: "Require technical-hexane purchase, recovery, inventory, and loss records; reject halogenated-solvent use for a conforming edible product and apply the applicable residual-solvent quality checks."
    source_ids:
      - fao-who-cxs-33-1981-2024
      - alonso-farinas-olive-pomace-oil-lca-2020
  - rule_id: validate_atomic_inventory
    applies_to: "all process inventories"
    rule: "Reject any selected flow that is a plural collection, combined carrier, combined packaging label, combined waste label, or unresolved selector instruction; every actual exchange must be a separate row."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "multifunctional processes"
    rule: "Require subdivision evidence or the documented allocation hierarchy, factors, co-product output quantities, internal use, and sensitivity result; reject double credit for extracted pomace used as on-site fuel."
    source_ids:
      - eu-environmental-footprint-2021-2279
      - alonso-farinas-olive-pomace-oil-lca-2020
  - rule_id: validate_storage_and_packaging
    applies_to: "declared bulk or packaged gate"
    rule: "Require storage inspection and temperature records; for packaged product require a component-level bill of materials and jurisdiction-specific package and labelling conformance."
    source_ids:
      - fao-who-cxc-36-1987-2024
      - eu-olive-oil-marketing-2022-2104
  - rule_id: validate_single_case_evidence
    applies_to: "literature case evidence"
    rule: "Treat the Alonso-Fariñas case only as non-constraining process and calculation context. Do not derive an amount range from one publication, one facility case, or two scenarios within that same case; foreground quantities require collected or independently calculated evidence."
    source_ids:
      - alonso-farinas-olive-pomace-oil-lca-2020
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Foreground or background modelling of crude, refined, or blended oil of olive residues with matching grade, route, geography, period, allocation, package state, and gate"
  excluded_use: "Virgin or refined olive oil made directly from olives; olive pomace feedstock; exhausted pomace; re-esterified or chemically modified oil; undeclared mixtures; unmatched extraction or refining routes"
  required_metadata: "reference-flow UUIDs; CPC coordinate; product grade; intended use; extraction solvent or physical treatment; drying fuel; refining and blending status; blend fractions; pomace origin and moisture; allocation method; packaging state; geography; reference period; gate"
  required_quality_disclosure: "foreground coverage; calibration; mass, dry-matter, solvent, and blend balances; actual utility and packaging rows; direct-emission method; waste treatment; treatment of non-constraining literature cases; proxy datasets; data-quality assessment; unresolved UUIDs"
  update_trigger: "Change in product standard, classification scope, extraction solvent or technology, drying fuel, refining or blending route, allocation method, package format, material yield, emission control, geography, or representative foreground evidence"
