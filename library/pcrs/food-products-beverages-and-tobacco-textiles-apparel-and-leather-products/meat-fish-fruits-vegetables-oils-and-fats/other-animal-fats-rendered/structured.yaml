system_boundary:
  rules:
    - rule_id: boundary_foreground_gate
      applies_to: "foreground operations"
      rule: "Include source acceptance, segregation, the declared conversion and separation route, purification, controlled storage/packaging, allocated cleaning, and conditional on-site wastewater treatment through dispatch-ready release."
      source_ids:
        - ec-jrc-sa-bref-2024
        - us-epa-ap42-rendering
        - eu-pef-2021-2279
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased inputs"
      rule: "Keep animal source materials, pre-rendered pig fat or tallow, crude wool grease, electricity, steam, hot water, fuels, water, each chemical, each filtration medium and each packaging component as explicit upstream product inputs."
      source_ids:
        - eu-pef-2021-2279
        - eu-regulation-1069-2009
    - rule_id: boundary_downstream_exclusions
      applies_to: "downstream life cycle"
      rule: "Exclude upstream animal production and inbound transport from the foreground gate; exclude distribution, retail, use and end-of-life after dispatch, while linking these activities to separate datasets when the study boundary requires them."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_route_lock
      applies_to: "route identity"
      rule: "Require one exact source, one exact product identity and a documented route: dry or wet rendering for directly rendered tissue products, an upstream rendering link plus fractionation for fractions, or wool-scouring grease recovery for wool-grease products."
      source_ids:
        - un-cpc-3-0-explanatory-notes
        - us-epa-ap42-rendering
        - us-epa-wool-processing
    - rule_id: boundary_atomic_exchange
      applies_to: "inventory exchanges"
      rule: "Author and collect one physically or chemically specific exchange per card; add another card for every additional actual source, chemical, filtration medium, package, waste, pollutant or emission."
      source_ids:
        - eu-pef-2021-2279
        - ec-jrc-sa-bref-2024
    - rule_id: boundary_no_unrecorded_cutoff
      applies_to: "completeness"
      rule: "Do not omit an environmentally relevant exchange solely because this PCR provides no UUID or quantity; leave UUID unresolved and obtain foreground evidence."
      source_ids:
        - eu-pef-2021-2279
