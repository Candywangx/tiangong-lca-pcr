    rule: "First subdivide by source species, named product, route, line, batch and directly metered stage so separable burdens are not allocated."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_direct_assignment
    applies_to: "route-specific inputs and outputs"
    rule: "Directly assign metered materials, utilities, chemicals, packaging, products, wastes and emissions to the batch that caused them."
    source_ids:
      - eu-pef-2021-2279
      - ec-jrc-sa-bref-2024
  - rule_id: allocation_physical_relation
    applies_to: "inseparable co-production"
    rule: "When subdivision is impossible, use a documented physical causal relationship that reflects how changing outputs changes the shared process burden."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_fallback
    applies_to: "no defensible physical relation"
    rule: "If no defensible physical relationship exists, use a documented economic allocation based on contemporaneous product values and report a sensitivity result; do not assign zero burden to a saleable output."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_status
    applies_to: "solids and aqueous phases"
    rule: "Classify each named output as product, by-product or waste from documented legal status and actual destination before allocation; do not change status merely to improve results."
    source_ids:
      - eu-regulation-1069-2009
      - eu-regulation-142-2011
      - eu-pef-2021-2279
  - rule_id: allocation_mass_balance
    applies_to: "all routes"
    rule: "Reconcile input mass, net reference product, every named co-product, water transfer, stock change, evaporation, wastewater and solid waste before applying allocation."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-pef-2021-2279
