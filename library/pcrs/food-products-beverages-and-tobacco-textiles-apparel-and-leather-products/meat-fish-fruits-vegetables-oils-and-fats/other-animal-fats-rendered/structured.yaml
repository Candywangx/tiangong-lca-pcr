process_map:
  - id: source_material_receiving
    name: "Source-material receiving and segregation"
    inclusion: "required"
    inclusion_condition: "Include for every dataset; record each accepted animal source or pre-rendered feedstock as a separate atomic input."
    role: "foreground_stage"
    quantitative_reference: "accepted mass assigned to the declared product batch"
  - id: dry_rendering_separation
    name: "Dry rendering, separation and purification"
    inclusion: "conditional"
    inclusion_condition: "Include when the declared route releases fat by heating and dehydration without adding water to the rendering charge."
    role: "foreground_stage"
    quantitative_reference: "mass of dispatchable rendered-fat output attributable to the dry route"
  - id: wet_rendering_separation
    name: "Wet rendering, separation and purification"
    inclusion: "conditional"
    inclusion_condition: "Include when the declared route adds water or direct steam to cook source material before phase separation."
    role: "foreground_stage"
    quantitative_reference: "mass of dispatchable rendered-fat output attributable to the wet route"
  - id: rendered_fat_fractionation
    name: "Rendered-fat fractionation"
    inclusion: "conditional"
    inclusion_condition: "Include for lard oil, lard stearin, oleo-oil, oleostearin or tallow oil; link the incoming pig fat or tallow to its upstream rendering dataset."
    role: "foreground_stage"
    quantitative_reference: "mass of the declared CPC 21529 fraction"
  - id: wool_grease_processing
    name: "Wool-grease separation and derivative processing"
    inclusion: "conditional"
    inclusion_condition: "Include only for lanolin, wool alcohols, wool grease olein or wool grease stearin explicitly included in CPC 21529."
    role: "foreground_stage"
    quantitative_reference: "mass of the declared wool-grease-derived CPC 21529 product"
  - id: packaging_storage_release
    name: "Packaging, finished storage and release"
    inclusion: "required"
    inclusion_condition: "Include every packaging configuration and bulk-storage operation under foreground control up to dispatch-ready release."
    role: "foreground_stage"
    quantitative_reference: "1 kg net compliant product, excluding packaging mass"
  - id: cleaning_disinfection
    name: "Equipment cleaning and disinfection"
    inclusion: "required"
    inclusion_condition: "Include cleaning and disinfection assigned to the declared production campaign; keep every chemical in a separate atomic card."
    role: "foreground_support_stage"
    quantitative_reference: "cleaning campaign allocated to the declared product output"
  - id: onsite_wastewater_treatment
    name: "On-site wastewater treatment"
    inclusion: "conditional"
    inclusion_condition: "Include only when the facility treats a listed wastewater stream on site; otherwise record the specific wastewater sent to the external treatment dataset."
    role: "foreground_support_stage"
    quantitative_reference: "treated wastewater volume assigned to the declared product output"
