  calculation_rules:
    - id: calc_reference_net_mass
      applies_to: "dispatch product"
      rule: "net compliant mass = gross filled mass - verified packaging tare - rejected/nonconforming product mass"
      inputs:
        - "gross filled mass"
        - "packaging tare"
        - "rejected product mass"
      output: "net compliant product mass in kg"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_normalize_reference
      applies_to: "every inventory row"
      rule: "normalized quantity = quantity assigned to declared product / net compliant product mass"
      inputs:
        - "assigned row quantity"
        - "net compliant product mass"
      output: "row quantity per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_air_emission
      applies_to: "each named air emission"
      rule: "use direct measured mass; otherwise measured activity multiplied by a documented site-specific factor with matching technology, fuel and period"
      inputs:
        - "direct measurement or activity record"
        - "site-specific factor"
      output: "mass of one named substance to air"
      source_ids:
        - us-epa-ap42-rendering
        - ec-jrc-sa-bref-2024
    - id: calc_effluent_load
      applies_to: "each named water discharge"
      rule: "discharged load = matched effluent volume multiplied by representative measured concentration, with unit conversion documented"
      inputs:
        - "effluent volume"
        - concentration
        - "sampling representativeness"
      output: "mass of one named pollutant to water"
      source_ids:
        - ec-jrc-sa-bref-2024
        - us-epa-wool-processing
    - id: calc_thermal_energy
      applies_to: "purchased steam or hot water where supplier reports mass"
      rule: "energy = measured carrier mass multiplied by documented inlet/outlet enthalpy difference"
      inputs:
        - "carrier mass"
        - pressure
        - temperature
        - "condensate return condition"
      output: "MJ of the named thermal carrier"
      source_ids:
        - ec-jrc-sa-bref-2024
    - id: calc_fuel_energy
      applies_to: "each named fuel"
      rule: "energy = measured fuel quantity multiplied by supplier- or batch-specific net calorific value"
      inputs:
        - "fuel quantity"
        - "net calorific value"
      output: "MJ of the named fuel"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "each batch or campaign"
      rule: "inputs + opening stock = products + wastes + wastewater transfers + measured evaporation + closing stock; investigate and disclose unreconciled difference"
      inputs:
        - "all measured mass records and stock changes"
      output: "route-level mass-balance statement"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-pef-2021-2279
    - id: calc_shared_allocation
      applies_to: "unavoidable shared records"
      rule: "allocate only after subdivision using the declared causal physical relation; where unavailable, apply documented contemporaneous economic shares and sensitivity"
      inputs:
        - "shared quantity"
        - "output quantities"
        - "causal driver or product values"
      output: "allocated atomic row quantities"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "source and reference product"
      requirement: "Preserve supplier, animal/source identity, anatomical or upstream feedstock, product name, legal category, batch, route and destination."
      evidence: "Receiving records, supplier declarations, batch genealogy and release certificate."
    - id: dq_temporal
      applies_to: "all foreground rows"
      requirement: "Use a reporting period representative of declared operation and identify shutdowns, abnormal batches and seasonal source changes."
      evidence: "Dated raw records and coverage statement."
    - id: dq_metering
      applies_to: "meters and scales"
      requirement: "Record equipment identifier, calibration status, reading interval, missing-data treatment and any shared-meter allocation."
      evidence: "Calibration certificates, meter extracts and reconciliation workbook."
    - id: dq_sampling
      applies_to: "emissions and wastewater"
      requirement: "Document sampling location, method, laboratory, detection limit, QA/QC, representativeness and matched flow period for each named substance or parameter."
      evidence: "Chain of custody, laboratory report and flow record."
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile every actual material, energy, product, waste and elementary exchange; absence must be demonstrated rather than inferred from a blank PCR card."
      evidence: "Completeness checklist, purchase ledger, process walkdown and mass/energy reconciliation."
    - id: dq_source_quality
      applies_to: "secondary links and factors"
      requirement: "Record dataset identity, geography, time, technology, unit and reason for selection; never treat this PCR source table as an amount source."
      evidence: "Dataset citation and selection memorandum."
    - id: dq_verification
      applies_to: "published package"
      requirement: "Retain calculations, allocation decisions, raw-to-normalized lineage and reviewer findings sufficient for independent reproduction."
      evidence: "Versioned calculation file, evidence index and verification record."
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "The only populated inventory UUID is the verified Product flow 42e4d7de-ef5e-4dd5-96f9-8680da80c5db; its property is Mass 93a60a56-a3c8-11da-a746-0800200b9a66, unit group is 93a60a57-a4c8-11da-a746-0800200c9a66, unit is kg, and output is exactly 1 kg net product."
    source_ids:
      - un-cpc-3-0-retained-structure
  - rule_id: validation_scope
    applies_to: "product classification"
    rule: "The declared product is explicitly included in CPC 21529 and is not a product of 21521-21526, 2151 or 21590."
    source_ids:
      - un-cpc-3-0-explanatory-notes
  - rule_id: validation_qualifiers
    applies_to: "dataset metadata"
    rule: "Exact animal or wool source, feedstock, named product, route, separation train, grade, intended-use status, geography, period, packaging and output disposition are all present."
    source_ids:
      - un-cpc-3-0-explanatory-notes
      - eu-regulation-1069-2009
  - rule_id: validation_route
    applies_to: "process inventory"
    rule: "The process map includes the one applicable primary route, receiving, packaging/release and allocated cleaning; on-site wastewater treatment is included only when performed."
    source_ids:
      - us-epa-ap42-rendering
      - us-epa-wool-processing
      - ec-jrc-sa-bref-2024
  - rule_id: validation_atomicity
    applies_to: "inventory cards"
    rule: "Every exchange card contains one named flow; each additional actual source, energy carrier, fuel, chemical, filter medium, package, product, waste, pollutant and emission has its own row_id."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_uuid_closure
    applies_to: "Tiangong identity"
    rule: "Every non-reference UUID remains blank until exact semantic dual verification; every blank UUID row_id appears in manifest review metadata with candidate status and rejection reason."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_amount_evidence
    applies_to: "quantities"
    rule: "Every non-reference amount is collected or calculated from collected records under a listed protocol; no external source value is used as a default."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_mass_balance
    applies_to: "batch reconciliation"
    rule: "Inputs, products, stock changes, evaporation, wastewater and wastes reconcile under calc_mass_balance, and any remaining difference is disclosed and investigated."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-pef-2021-2279
  - rule_id: validation_allocation
    applies_to: "co-products and wastes"
    rule: "Each output has documented status and destination; shared burdens follow the declared allocation hierarchy with calculations and sensitivity where required."
    source_ids:
      - eu-regulation-1069-2009
      - eu-pef-2021-2279
  - rule_id: validation_emissions
    applies_to: "air and water exchanges"
    rule: "Each reported pollutant or emission is a separate named card linked to measured activity, monitoring or laboratory evidence with method and period disclosed."
    source_ids:
      - us-epa-ap42-rendering
      - ec-jrc-sa-bref-2024
published_dataset_profile:
  dataset_role: "Product-specific foreground data package and dataset projection for one exact CPC 21529 product and route."
  downstream_use: "LCI dataset creation, process projection, lifecycle-model linking, Environmental Footprint modelling and independent review."
  allowed_use: "Use only when product, source, route, geography, period, quality, regulatory status and allocation match the declared package."
  excluded_use: "Do not use as a default dataset for pig fat, poultry fat, tallow, fish or marine-mammal oil, unrendered fat, chemically modified fat, or an unidentified “other animal fat”."
  required_metadata: "PCR id; CPC code; reference UUID; exact product/source/feedstock; route and separation train; batch mode; grade; intended use; geography; period; packaging; upstream links; co-product status; allocation; data-owner and reviewer."
  required_quality_disclosure: "Raw-record coverage, calibration, sampling QA/QC, calculation lineage, mass-balance result, allocation sensitivity, unresolved UUIDs, exclusions and limitations."
  update_trigger: "Source species/feedstock, named product, route, separation or purification technology, fuel, chemical, packaging, wastewater treatment, regulatory status, allocation, site, supplier or representative period changes materially."
data_sources:
  - id: "un-cpc-3-0-retained-structure"
    type: "official_guidance"
    reference: "United Nations Statistics Division, retained CPC Version 3.0 structure, classifications/systems/cpc/3.0/raw/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Exact subclass title and neighbouring-code boundary."
  - id: "un-cpc-3-0-explanatory-notes"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Explanatory Notes (30 June 2025), https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Included named fats, oils, fractions and wool-grease products; exclusions to 21521-21526 and 21590."
  - id: "ec-jrc-sa-bref-2024"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Best Available Techniques Reference Document for the Slaughterhouses, Animal By-products and/or Edible Co-products Industries, JRC135916, 2024, DOI 10.2760/18199, https://publications.jrc.ec.europa.eu/repository/handle/JRC135916"
    used_for: "Rendering, fat melting, utilities, cleaning, wastewater, waste and emission inventory structure; no BREF quantity is adopted as a default."
  - id: "us-epa-ap42-rendering"
    type: "official_guidance"
    reference: "US EPA, AP-42 Section 9.5.3 background document, Meat Rendering Plants, https://www3.epa.gov/ttn/chief/ap42/ch09/bgdocs/b09s05-3.pdf"
    used_for: "Dry and wet rendering distinction; size reduction, steam heating, draining, pressing, centrifugation, filtration, storage and named potential air emissions."
  - id: "fao-rendering-manual"
    type: "extension_guidance"
    reference: "FAO, Manual for the slaughter of small ruminants in developing countries, section 10.3, https://www.fao.org/4/X6552E/X6552E10.htm"
    used_for: "Independent technical corroboration of wet rendering with water and steam, dry rendering without added water, phase separation and recovery of fat, aqueous and solid streams."
  - id: "eu-regulation-1069-2009"
    type: "standard"
    reference: "Regulation (EC) No 1069/2009 on animal by-products and derived products not intended for human consumption, https://eur-lex.europa.eu/eli/reg/2009/1069/oj/eng"
    used_for: "Animal-by-product source category, segregation, traceability, approved processing and intended-use controls."
  - id: "eu-regulation-142-2011"
    type: "standard"
    reference: "Commission Regulation (EU) No 142/2011 implementing Regulation (EC) No 1069/2009, https://eur-lex.europa.eu/eli/reg/2011/142/oj/eng"
    used_for: "Processing, storage, packaging, hygiene and record controls for applicable rendered fats; regulatory parameters are not imported as LCI defaults."
  - id: "us-epa-wool-processing"
    type: "official_guidance"
    reference: "US EPA, Development Document for Effluent Limitations Guidelines and Standards for the Textile Mills, https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=10004LF3.TXT"
    used_for: "Wool-scouring liquor separation, centrifugation, grease recovery, lanolin refining context, sulfuric-acid cracking option and specific wastewater structure."
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279 on the use of Environmental Footprint methods, https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng"
    used_for: "Product-specific bill of materials, company-specific manufacturing data, complete LCI, allocation, transparency, data quality and verification."
