      requirement: "Use calibrated equipment or documented invoice reconciliation; identify sampling and test methods, energy conversion convention, missing intervals and estimation method."
      evidence: "Calibration, laboratory, meter and invoice records"
    - id: dq_temporal_and_operating_coverage
      applies_to: "foreground dataset"
