  - rule_id: validate_inedible_scope
    applies_to: "product_identity"
    rule: "Reject a dataset presented as edible fish meal, seafood powder or other food ingredient, or lacking an explicit inedible/non-food declaration."
    source_ids:
      - unsd-cpc-3-0-21291
  - rule_id: validate_route_selection
    applies_to: "process_map"
    rule: "Require exactly one of wet_thermal_conversion and direct_drying_conversion for each lot or separately modelled segment; require raw_material_receiving and final_conditioning."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "reference_flow"
    rule: "Require every applicable qualifier, including net mass, moisture basis, salt/salinity, packaging and gross/deglazed/drained mass treatment; mark non-applicable conditions explicitly."
    source_ids: []
  - rule_id: validate_mass_and_transfer_balance
    applies_to: "foreground_inventory"
    rule: "Reconcile transfers between processes and calculate wet-mass and, when material, dry-matter balances; flag unexplained discrepancy for review rather than silently scaling outputs."
