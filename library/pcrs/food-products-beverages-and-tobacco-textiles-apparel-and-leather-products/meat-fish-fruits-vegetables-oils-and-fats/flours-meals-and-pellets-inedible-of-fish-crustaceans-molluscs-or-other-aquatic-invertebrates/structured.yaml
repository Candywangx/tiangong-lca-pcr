allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "route_and_process_outputs"
    rule: "Avoid allocation by route separation, process subdivision and direct metering wherever outputs can be separately modelled. Keep the two conversion routes separate before any facility-level aggregation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_then_other
    applies_to: "unavoidable_multi_output_process"
    rule: "When subdivision is not possible, use a documented causal physical relationship between inputs/emissions and outputs. If no defensible physical relationship exists, use an economic or other justified relationship, disclose prices and period, and test sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_output_classification
    applies_to: "coproduct_waste_and_internal_recycle"
    rule: "Classify marketable recovered oil or other usable output as a co-product, treatment-bound material as waste, and same-process recirculation as internal recycle. Do not double count internal recycle or assign zero upstream burden solely from a residue label."
    source_ids:
      - eu-pef-2021-2279
