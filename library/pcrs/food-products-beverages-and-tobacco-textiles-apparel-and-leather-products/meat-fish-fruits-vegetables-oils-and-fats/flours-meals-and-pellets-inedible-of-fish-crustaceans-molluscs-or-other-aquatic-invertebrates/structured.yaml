      quality_evidence: "scale/meter calibration; bill of materials; release test; route traceability; reconciliation sign-off"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "factory-gate product"
      rule: "net_reference_mass = gross_mass - packaging_mass - removable_glaze_mass - free_liquid_mass; use direct net weighing when available and retain the reconciliation"
      inputs:
        - gross_mass
        - packaging_mass
        - removable_glaze_mass
