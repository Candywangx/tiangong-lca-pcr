allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "Multi-output preparation and extraction processes"
    rule: "First subdivide directly attributable operations or expand the system when justified by the study goal. Do not allocate burdens that can be assigned from separate meters, batches, or process records."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_then_other
    applies_to: "Remaining shared burdens among crude oil, meal/cake, hulls, and other co-products"
    rule: "If allocation cannot be avoided, use a documented relevant physical relationship. If no relevant physical relationship can be demonstrated, use another justified relationship such as economic value with a representative price period. Apply one internally consistent method and disclose the rationale."
    source_ids:
      - eu-pef-2021-2279
      - ilcd-format-1-1-process
  - rule_id: allocation_fraction_check
    applies_to: "Every allocated multi-output process"
    rule: "Allocation fractions must cover all co-products, use the same reporting period and basis, and sum to 1.000 within rounding tolerance. Report unallocated wastes separately and perform a sensitivity result when allocation choice materially changes the crude-oil result."
    source_ids:
      - ilcd-format-1-1-process
