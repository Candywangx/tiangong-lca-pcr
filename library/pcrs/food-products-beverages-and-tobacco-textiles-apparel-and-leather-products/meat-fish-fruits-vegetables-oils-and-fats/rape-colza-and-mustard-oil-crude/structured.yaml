    - id: dq_completeness
      applies_to: "Each included process"
      requirement: "Reconcile seed, oil, co-products, wastes, solvent, and stocks. List excluded flows and demonstrate that route-conditional solvent and emission rows were not silently omitted."
      evidence: "Signed mass/solvent balance; completeness checklist; exception log"
    - id: dq_representativeness
      applies_to: "Aggregated production mix"
      requirement: "Report site coverage, geography, seed shares, technology shares, capacity/utilisation, and reasons the period represents the published dataset."
      evidence: "Facility roster; production summary; supplier and technology records"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The reference product UUID must be 092932e3-7b6d-430d-b6e5-722b8f4e1c6d, the property must be Mass 93a60a56-a3c8-11da-a746-0800200b9a66, the unit group must be Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and normalized amount must equal 1 kg."
    source_ids:
      - codex-cxs-210-named-vegetable-oils
  - rule_id: validate_crude_state
    applies_to: "Product identity and boundary"
    rule: "Reject a package that includes alkali neutralisation, bleaching, deodorisation, or another refining step in the reference-product process without separating it into a downstream refined-oil dataset. Require the declared clarification/degumming state."
    source_ids:
      - codex-cxs-210-named-vegetable-oils
      - us-epa-ap42-9-11-1-vegetable-oil-processing
  - rule_id: validate_route_completeness
    applies_to: "Mechanical and solvent routes"
    rule: "The process map and inventory must match the declared route. If solvent is used, require solvent identity, make-up, recovery, stock, carryover, wastewater, and air-loss reconciliation; if not used, mark those checks not applicable."
    source_ids:
      - us-epa-ap42-9-11-1-vegetable-oil-processing
  - rule_id: validate_mass_balance
    applies_to: "Seed preparation, extraction, and storage"
    rule: "Require linked internal transfers and a disclosed mass balance across seed, crude oil, co-products, wastes, moisture change, and stocks. Unexplained imbalance must be reported and reviewed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "Multi-output processes"
    rule: "Require allocation hierarchy, basis, period, fractions, co-product list, and fractions summing to 1.000 within rounding tolerance; reject soybean-meal or other semantically mismatched proxy identities."
    source_ids:
      - eu-pef-2021-2279
      - ilcd-format-1-1-process
  - rule_id: validate_qualifiers
    applies_to: "Dataset metadata"
    rule: "Require all reference-flow qualifiers, site/geography, reporting period, source ids, measurement basis, and unresolved UUID declarations before publication."
    source_ids:
      - ilcd-format-1-1-process
published_dataset_profile:
  dataset_role: "Foreground data package for crude rape/colza/mustard oil production, publishable after review as a secondary_dataset and, when representative, as a background_dataset"
  downstream_use: "Process and lifecyclemodel construction for products consuming qualifying crude oil before downstream refining or conversion"
  allowed_use: "Site-specific or declared production-mix cradle-to-plant-gate modelling when product identity, route, boundary, allocation, geography, and period match the study"
  excluded_use: "Refined-oil reference product; retail cooking oil; biodiesel or chemical conversion; comparative assertion without compatible reviewed scope; extrapolation to an undeclared seed type or extraction route"
  required_metadata: "PCR id; product flow UUID; seed types and shares; extraction route; solvent identity when applicable; clarification/degumming state; mass basis; geography; sites; reporting period; allocation method; co-products; upstream seed datasets; data sources"
  required_quality_disclosure: "Measurement coverage; meter and scale calibration; stock reconciliation; seed and oil mass balance; solvent balance where applicable; shared-utility allocation; missing flows; cut-offs; uncertainty; representativeness; unresolved UUIDs"
  update_trigger: "Material change in product identity, flow UUID, feedstock mix, extraction technology, solvent, boundary, allocation method, site coverage, reporting period, quality specification, or external method/source requirements"
