      flow_role: "Solvent make-up, recovery, stock, carryover, wastewater, and air loss"
      record_type: "Purchase, tank, recovery meter, laboratory, emission, and wastewater records"
      raw_fields: "solvent_identity; purchases; opening_stock; closing_stock; recovered_internal; offsite_transfer; oil_carryover; meal_carryover; wastewater_load; measured_air_release; density; unit"
