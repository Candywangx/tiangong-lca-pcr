      frequency: "Meter interval and monthly close"
      temporal_coverage: "Same period as product output"
      site_scope: "Each facility and utility system"
      aggregation_rule: "Sum direct meters; allocate only shared use with documented causal key"
      quality_evidence: "Meter calibration; invoices; stock reconciliation; allocation worksheet"
    - protocol_id: cp_material_outputs
