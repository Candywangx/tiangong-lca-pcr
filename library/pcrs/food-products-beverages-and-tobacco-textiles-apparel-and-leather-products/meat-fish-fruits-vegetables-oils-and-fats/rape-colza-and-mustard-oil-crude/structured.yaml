  calculation_rules:
    - id: calc_net_seed_mass
      applies_to: "Seed receipts"
      rule: "accepted_seed_mass = gross_mass - tare_mass - separately weighed rejected material; any dry-matter conversion uses measured moisture for the same batch"
      inputs:
        - gross_mass
        - tare_mass
        - rejected_mass
        - measured_moisture
        - "declared mass basis"
      output: "accepted seed mass by type and basis"
