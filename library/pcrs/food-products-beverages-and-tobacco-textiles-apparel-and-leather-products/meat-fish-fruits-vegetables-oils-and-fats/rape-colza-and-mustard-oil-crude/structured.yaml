    - id: calc_solvent_loss
      applies_to: "Solvent route"
      rule: "residual solvent loss = solvent inputs + opening stock - closing stock - recovered/offsite solvent - quantified carryover to oil, meal, wastewater, and other destinations; compare the residual with measured air release and disclose imbalance"
