  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and seed inputs"
      requirement: "Retain seed type/species, crude versus refined state, extraction route, conditioning/degumming state, low-erucic or canola claim when applicable, and matching Tiangong flow identity."
      evidence: "Product specification; batch record; flow UUID; Codex identity test or supplier certificate when used"
    - id: dq_temporal
      applies_to: "All foreground data"
      requirement: "Use one closed, representative reporting period shared by inputs and outputs; normally 12 consecutive months or a complete seasonal campaign. Explain outages, abnormal campaigns, and extrapolation."
      evidence: "Dated meter, production, stock, and shipment records; period reconciliation"
    - id: dq_measurement
