allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Multi-output refinery processes"
    rule: "First avoid allocation through process subdivision and separately metered inventories; use system expansion only when the added function and substituted product are demonstrable and consistent with the study goal."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical
    applies_to: "Unavoidable co-product allocation"
    rule: "When subdivision or system expansion is not feasible, use a documented physical relationship that reflects causation; simple mass allocation is allowed only when mass is the relevant physical relationship."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_other_relation
    applies_to: "Cases without a defensible physical relationship"
    rule: "Use another documented relationship, such as economic value, only after the prior options fail; use a representative price period and disclose price source, currency, geography, and sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_waste_recovery
    applies_to: "Soapstock, acid oil, recovered oil, spent bleaching earth, distillate, and other residues"
    rule: "Classify each output from its actual destination and economic function. Do not assign co-product credit to a waste stream without evidence of a substituted function, and do not double count internally recovered oil."
    source_ids:
      - eu-pef-method-2021
      - eu-fdm-bat-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_records
      process_id: "receipt_pretreatment_degumming_neutralization_bleaching_filtration"
      flow_role: "Raw oils, water, acids, alkali, bleaching media, and filter aids"
      record_type: "Weighbridge, calibrated tank, batch sheet, purchase, and inventory record"
      raw_fields: "material_id; supplier; batch_id; opening_stock; receipts; returns; closing_stock; measured_mass; moisture_or_concentration; timestamp"
      collection_method: "Reconcile calibrated measurements and stock movements by material and batch or reporting period"
      unit: "kg; concentration fraction"
      frequency: "Each batch, aggregated monthly"
      temporal_coverage: "Representative production period, normally 12 consecutive months"
      site_scope: "All foreground refinery units and storage tanks"
      aggregation_rule: "Consumption = opening stock + receipts - returns - closing stock; normalize only after the conforming product mass is known"
      quality_evidence: "Calibration record; stock reconciliation; supplier specification; batch authorization"
    - protocol_id: cp_intermediate_transfer_balance
      process_id: "all_foreground_processes"
      flow_role: "Intermediate oil feed and output"
      record_type: "Tank gauge, mass-flow meter, batch transfer, and loss record"
      raw_fields: "process_id; batch_id; opening_inventory; input_transfer; output_transfer; closing_inventory; recovered_oil; residue_oil; timestamp"
      collection_method: "Reconcile each transfer across adjacent processes and investigate unmatched transfers"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same period as the represented production"
      site_scope: "All intermediate oil tanks and transfer points"
      aggregation_rule: "Intermediate output = opening + inputs - closing - separated outputs - documented losses"
      quality_evidence: "Meter calibration; tank strapping table; signed batch reconciliation"
    - protocol_id: cp_utility_records
      process_id: "all_foreground_processes"
      flow_role: "Electricity, fuel, steam, and process heat"
      record_type: "Submeter, boiler record, invoice, and operating-hour allocation"
      raw_fields: "carrier; meter_start; meter_end; import; export; steam_mass; pressure; temperature; fuel_mass_or_volume; heating_value_basis; process_hours"
      collection_method: "Prefer process meters; allocate common utilities using a causal driver and disclose the allocation"
      unit: "kWh; MJ; kg steam; carrier unit"
      frequency: "Continuous or per batch, aggregated monthly"
      temporal_coverage: "Same period as the represented production"
      site_scope: "Foreground refinery and shared utilities used by it"
      aggregation_rule: "Net use by carrier; convert with documented factors; no summation across unlike units before conversion"
      quality_evidence: "Meter calibration; invoice reconciliation; boiler efficiency and conversion-factor record"
    - protocol_id: cp_water_wastewater_records
      process_id: "all_foreground_processes"
      flow_role: "Water withdrawal, recirculation, condensate, and wastewater"
      record_type: "Water meter, loop balance, effluent meter, and laboratory analysis"
      raw_fields: "source; withdrawal; recirculation; makeup; condensate_return; discharge; pH; temperature; COD_or_TOC; TSS; chloride; conductivity; sample_time"
      collection_method: "Measure net withdrawal and discharge and retain route-specific water balance and sampling results"
      unit: "m3; parameter-specific units"
      frequency: "Continuous flow where available; quality sampling at the applicable regulatory or management frequency"
      temporal_coverage: "Same period as the represented production, with sampling dates retained"
      site_scope: "Refinery water system and discharge points"
      aggregation_rule: "Net withdrawal excludes recirculated passes; discharge is normalized to conforming product"
      quality_evidence: "Meter calibration; laboratory method; chain of custody; water-balance closure"
    - protocol_id: cp_residue_wastewater_records
      process_id: "all_foreground_processes"
      flow_role: "Residues, co-products, recovered materials, and wastes"
      record_type: "Receiver weight, removal ticket, laboratory result, and destination record"
      raw_fields: "stream_id; mass_or_volume; moisture; oil_content; destination; economic_value; waste_code_if_applicable; timestamp"
      collection_method: "Record each destination separately and reconcile recovered oil to internal returns"
      unit: "kg or m3"
      frequency: "Each batch or shipment"
      temporal_coverage: "Same period as the represented production"
      site_scope: "All foreground separation and waste handling points"
      aggregation_rule: "Sum by stream identity and destination; do not net saleable and disposed fractions"
      quality_evidence: "Calibrated scale; transporter receipt; treatment or sale record; laboratory result"
    - protocol_id: cp_emission_monitoring_records
      process_id: "deodorization_finishing"
      flow_role: "Direct air releases"
      record_type: "Stack/vent measurement or engineering calculation based on collected operating data"
      raw_fields: "pollutant; concentration; gas_flow; operating_time; capture_efficiency; calculation_inputs; method; timestamp"
      collection_method: "Apply relevant monitoring method at identified emission points and retain raw results"
      unit: "kg pollutant; concentration and flow units"
      frequency: "Campaign-specific or applicable monitoring frequency"
      temporal_coverage: "Representative operating campaigns within the production period"
      site_scope: "Deodorizer, vacuum, storage, and treatment vents within the boundary"
      aggregation_rule: "Emission = measured concentration x flow x time or validated mass-balance result; subtract captured material only once"
      quality_evidence: "Sampling report; instrument calibration; calculation review; treatment performance record"
    - protocol_id: cp_product_quality_records
      process_id: "deodorization_finishing"
      flow_role: "Conforming refined coconut oil"
      record_type: "Certificate of analysis, batch release, and specification record"
      raw_fields: "batch_id; origin; grade; specification; fatty_acid_profile; acidity; peroxide_value; moisture_and_volatiles; contaminants_if_required; release_status"
      collection_method: "Test or verify against the declared market specification using applicable methods"
      unit: "parameter-specific units"
      frequency: "Each released batch or justified lot grouping"
      temporal_coverage: "All released batches represented by the production period"
      site_scope: "Finished product tanks and loading points"
      aggregation_rule: "Only released conforming mass enters the reference output"
      quality_evidence: "Laboratory accreditation or method record; signed certificate of analysis; release decision"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "normalized quantity = period or batch quantity / net conforming refined coconut oil output in kg"
      inputs:
        - "collected row quantity"
        - "conforming product mass"
      output: "quantity per 1 kg reference product"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_oil_mass_balance
      applies_to: "Each oil-processing stage and the combined refinery"
      rule: "opening oil inventory + oil-bearing inputs = closing oil inventory + intermediate/final oil outputs + measured oil in residues/wastewater + documented losses; report unresolved residual separately"
      inputs:
        - transfer
        - stock
        - "residue oil"
        - "recovered oil"
        - "and product records"
      output: "stage and refinery mass-balance closure"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_water_balance
      applies_to: "Refinery water system"
      rule: "net withdrawal = gross withdrawal - returned water received from outside the reporting system; report recirculation, evaporation, condensate return, and discharge separately"
      inputs:
        - "water meter and loop records"
      output: "water inventory per reference flow"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_allocation_factor
      applies_to: "Unavoidable burden allocation"
      rule: "selected allocation factor for output i = documented physical or other relationship value for output i / sum of the same relationship values for all co-products; apply consistently to shared inputs and emissions"
      inputs:
        - "subdivision result"
        - "co-product quantities"
        - "physical relation or economic values"
      output: "disclosed allocation factors and allocated inventory"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and upstream crude oil"
      requirement: "Verify coconut origin, refined/crude state, route, grade, specification, and Tiangong reference-flow identity; prevent substitution with palm-kernel oil, virgin coconut oil, or generic vegetable oil."
      evidence: "Product specification; supplier record; batch certificate; flow UUID verification"
    - id: dq_temporal
      applies_to: "Foreground data"
      requirement: "Use a continuous representative period, normally at least 12 months where operations are not campaign-limited; disclose shutdowns, abnormal events, and shorter periods."
      evidence: "Dated meter, batch, invoice, and production records"
    - id: dq_technology
      applies_to: "Refinery route"
      requirement: "Keep chemical and physical refining data separate unless production-weighted from documented output; identify degumming chemistry, neutralization status, bleaching media, deodorizer configuration, temperature, pressure/vacuum, residence time, and post-treatment."
      evidence: "Process flow sheet; operating log; production-weight calculation; codex-cxc-79-2019"
    - id: dq_geography
      applies_to: "Site and upstream datasets"
      requirement: "Use site geography for foreground operations and representative geographies for crude oil, electricity, fuels, water, treatment, and transport."
      evidence: "Site metadata; supplier origin; background dataset metadata"
    - id: dq_precision_completeness
      applies_to: "Material, utility, residue, wastewater, and air inventories"
      requirement: "Reconcile oil and water balances; quantify data gaps; document measurement uncertainty, allocation, and important exclusions; evaluate technological, geographical and time representativeness plus precision."
      evidence: "Balance reports; calibration; gap register; DQR record; eu-pef-method-2021; eu-fdm-bat-2019"
    - id: dq_product_conformance
      applies_to: "Finished refined coconut oil"
      requirement: "Retain a batch release or certificate showing conformity with the declared product specification; when marketed for food, apply the relevant Codex or jurisdictional composition, contaminant, hygiene, and analysis requirements."
      evidence: "Certificate of analysis; declared standard; codex-cxs-210-1999"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The dataset shall contain exactly one quantitative-reference output using Coconut oil, refined 570397b9-62ae-4576-b584-56691c7fed08, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and 1 kg after normalization."
    source_ids:
      - codex-cxs-210-1999
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "All required qualifiers shall be present and mutually consistent; crude, virgin, cold-pressed, hydrogenated, interesterified, fractionated, blended, or isolated MCT products fail category identity."
    source_ids:
      - codex-cxs-210-1999
  - rule_id: validate_route_processes
    applies_to: "Process map and inventory"
    rule: "Receipt/pretreatment, bleaching/filtration, and deodorization/finishing shall be represented; degumming and neutralization shall match the declared route, and all exclusions or combined operations shall be justified."
    source_ids:
      - codex-cxc-79-2019
  - rule_id: validate_inventory_coverage
    applies_to: "Foreground exchanges"
    rule: "The dataset shall account for crude oil, route-specific processing materials, electricity and thermal utilities, water, refined oil, intermediate transfers, residues/co-products, wastewater, direct emissions, and treatment destinations, or explicitly justify a non-applicable stream."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validate_mass_balance
    applies_to: "Oil-bearing streams"
    rule: "Oil mass balances shall close within the declared measurement uncertainty; residual imbalance shall be quantified, investigated, and not hidden by allocation or normalization."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validate_water_range
    applies_to: "Net refinery wastewater"
    rule: "Compare net discharge with the 0.00015-0.0009 m3/kg indicative stand-alone refining range; values outside it trigger review but do not automatically invalidate a site-specific dataset."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validate_contaminant_controls
    applies_to: "Refining conditions and product release"
    rule: "Record route-specific precursor assessment and deodorization conditions relevant to 3-MCPDE and GE control, and retain evidence that mitigation remains compatible with the declared product quality."
    source_ids:
      - codex-cxc-79-2019
      - codex-cxs-210-1999
  - rule_id: validate_allocation
    applies_to: "Multi-output operations"
    rule: "Confirm the hierarchy of subdivision/system expansion, relevant physical relationship, then other relationship; all factors, values, destinations, and sensitivities shall be reproducible and internally recovered oil shall not receive duplicate credit."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_data_quality
    applies_to: "Foreground and linked background data"
    rule: "Confirm temporal, technological, geographical, and precision evidence, source traceability, calibration, batch/product conformance, and disclosure of gaps and provisional ranges."
    source_ids:
      - eu-pef-method-2021
      - eu-fdm-bat-2019
published_dataset_profile:
  dataset_role: "Foreground refinery-gate production dataset for bulk refined coconut oil"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Attributional LCA of products using refined coconut oil; supplier or site comparisons with harmonized route, boundary, allocation, product grade, geography, and data quality; linkage into broader cradle-to-gate models"
  excluded_use: "Virgin/cold-pressed oil, palm-kernel oil, fractionated or isolated MCT products, retail packaged oil without added packaging/distribution, consequential claims without an appropriate market model, or public comparative claims without review"
  required_metadata: "PCR id/version; flow UUID; product and grade; applicable specification; chemical/physical route; site/geography; reference period; technology; crude-oil origin and upstream boundary; allocation; co-product/waste destinations; product quality release; data sources"
  required_quality_disclosure: "Foreground coverage; meter/calibration status; oil and water balance; route weighting; data gaps; provisional estimates; uncertainty; background dataset representativeness; allocation sensitivity; deviations from this PCR"
  update_trigger: "Change in feed origin or quality, refining route, degumming/neutralization practice, bleaching media, deodorizer conditions, energy or water system, contaminant controls, co-product destination, allocation basis, product specification, site geography, or evidence that makes a provisional range obsolete"
