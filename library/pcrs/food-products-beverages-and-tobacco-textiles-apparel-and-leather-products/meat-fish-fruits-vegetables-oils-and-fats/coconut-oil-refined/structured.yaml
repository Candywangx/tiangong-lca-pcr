system_boundary:
  rules:
    - rule_id: boundary_refinery_gate
      applies_to: "Foreground refinery system"
      rule: "Include all material and energy flows from crude-oil receipt through route-applicable degumming or neutralization, bleaching, deodorization, polishing, cooling, and bulk storage/loading; packaging and downstream distribution are excluded unless separately declared."
      source_ids:
        - codex-cxc-79-2019
        - eu-fdm-bat-2019
    - rule_id: boundary_route_disclosure
      applies_to: "Chemical and physical refining routes"
      rule: "Model the actual route: chemical refining includes neutralization when performed, while physical refining omits neutralization and relies on degumming, bleaching, and deodorization; do not combine route inventories without a production-weighted calculation."
      source_ids:
        - codex-cxc-79-2019
    - rule_id: boundary_environmental_streams
      applies_to: "Resource and emission inventory"
      rule: "Include water, energy, raw materials, wastewater, waste gas, residues, recovered materials, and treatment operations at the most appropriate process or installation level."
      source_ids:
        - eu-fdm-bat-2019
    - rule_id: boundary_contaminant_control
      applies_to: "Degumming, bleaching, deodorization, and any post-refining treatment"
      rule: "Record process conditions and additional treatment that materially control 3-MCPDE and GE formation; the selected mitigation shall not be assumed identical across oil types or equipment."
      source_ids:
        - codex-cxc-79-2019
boundary_abstraction:
  declared_starting_condition: "Crude coconut oil received at the refinery inlet, with origin, supplier, water/moisture, free-fatty-acid and relevant precursor information declared where available"
  starting_condition_role: "Upstream product input to the refinery foreground system"
  product_classification_scope: "Refined coconut oil only; intermediates remain process-linked product flows and do not create separate refined-coconut-oil reference products"
  recursive_input_rule: "If refined coconut oil is reworked within the refinery, record it as a separately identified rework input and exclude its earlier burdens from duplicate counting; purchased refined coconut oil must use an upstream dataset and must not be represented as crude coconut oil."
  upstream_dataset_requirement: "Use a geographically, temporally, and technologically representative upstream dataset for crude coconut oil and disclose whether cultivation, copra preparation, extraction, transport, and storage are included."
  disclosure: "Declare refinery route, batch or averaging period, site geography, crude-oil origin and quality, product grade/specification, co-product and waste destinations, treatment systems, allocation choices, recycled loops, and any excluded process."
