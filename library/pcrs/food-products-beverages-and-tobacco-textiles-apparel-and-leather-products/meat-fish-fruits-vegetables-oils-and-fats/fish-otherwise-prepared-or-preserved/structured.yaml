allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "separately measurable lines, batches, or operations"
    rule: "Avoid allocation where practicable by subdividing independently metered production lines, batches, storage periods, and treatment operations."
    source_ids:
      - ghg-protocol-product-2011
  - rule_id: allocation_physical_relation
    applies_to: "unavoidable shared burdens and co-products"
    rule: "When subdivision is not practicable, use a documented physical relationship that reflects how inputs and emissions change with surimi and co-product outputs; use measured wet mass only when mass is the relevant causal relation."
    source_ids:
      - ghg-protocol-product-2011
  - rule_id: allocation_economic_fallback
    applies_to: "co-products without a defensible physical relationship"
    rule: "If no defensible physical relationship exists, apply economic allocation using aligned price, quantity, geography, and reporting-period records, and disclose sensitivity to the selected period."
    source_ids:
      - ghg-protocol-product-2011
  - rule_id: allocation_waste_status
    applies_to: "fish residues, recovered solids, and other outputs"
    rule: "Classify an output as waste only when the holder discards it and no product revenue or intended beneficial use is represented; otherwise treat it as a co-product and apply the allocation hierarchy."
    source_ids:
      - ghg-protocol-product-2011
  - rule_id: allocation_consistency
    applies_to: "all foreground products and residues"
    rule: "Apply the same allocation method consistently to similar inputs and outputs, report allocation factors before normalization, and retain an unallocated mass-and-energy reconciliation."
    source_ids:
      - ghg-protocol-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_input_records
      process_id: "surimi_manufacturing"
      flow_role: "accepted fish and formulation ingredients"
      record_type: "receiving, weigh, issue, return, formulation, and lot records"
      raw_fields: "date; lot_id; supplier; species; origin; state; ingredient_id; gross_mass; tare_mass; returned_mass; unit"
      collection_method: "calibrated scales and inventory reconciliation"
      unit: "kg"
      frequency: "each lot and batch"
      temporal_coverage: "full represented production period"
      site_scope: "all represented receiving and formulation points"
      aggregation_rule: "sum accepted or net-issued mass by material and batch, then normalize to net output"
      quality_evidence: "calibration records; supplier and lot traceability; formulation authorization; reconciliation"
    - protocol_id: cp_water_records
      process_id: "surimi_manufacturing"
      flow_role: "process and cleaning water"
      record_type: "meter, batch, and sanitation records"
      raw_fields: "meter_id; start_reading; end_reading; batch_id; use_area; unit"
      collection_method: "submeter reading or reconciled facility water balance"
      unit: "kg or m3"
      frequency: "each batch where metered, otherwise at least monthly"
      temporal_coverage: "full represented production period"
      site_scope: "all represented process and sanitation uses"
      aggregation_rule: "convert volume using declared density when necessary, subtract excluded uses, and normalize to net output"
      quality_evidence: "meter calibration; coverage map; balance reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "surimi_manufacturing"
      flow_role: "packaging inputs"
      record_type: "packing-line count, issue, return, and component-mass records"
      raw_fields: "component_id; material; count_used; count_returned; sampled_component_mass; unit"
      collection_method: "verified count-to-mass calculation reconciled to stores"
      unit: "kg"
      frequency: "each packaging configuration and batch"
      temporal_coverage: "full represented production period"
      site_scope: "all represented packing lines"
      aggregation_rule: "net component count multiplied by verified component mass, summed by material"
      quality_evidence: "sampling record; scale calibration; issue-return reconciliation"
    - protocol_id: cp_energy_records
      process_id: "surimi_manufacturing"
      flow_role: "electricity and other energy"
      record_type: "utility meter, invoice, submeter, equipment runtime, and production records"
      raw_fields: "meter_id; opening; closing; unit; period; equipment; runtime; output_mass"
      collection_method: "direct submetering preferred; otherwise documented engineering or production allocation"
      unit: "kWh or MJ"
      frequency: "continuous or monthly, aligned to production"
      temporal_coverage: "full represented production period including declared frozen storage"
      site_scope: "all represented processing, refrigeration, storage, sanitation, and treatment operations"
      aggregation_rule: "subtract excluded loads, allocate shared loads under section 7, convert units explicitly, and normalize to net output"
      quality_evidence: "meter calibration; invoices; load inventory; reconciliation"
    - protocol_id: cp_product_output_records
      process_id: "surimi_manufacturing"
      flow_role: "conforming surimi output"
      record_type: "batch, checkweigh, grade, moisture, release, storage, and dispatch records"
      raw_fields: "batch_id; product_id; species; formulation; gross_mass; packaging_mass; net_mass; moisture; grade; freeze_time; storage_duration; release_status"
      collection_method: "calibrated checkweighing and quality-release system"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "full represented production period"
      site_scope: "all represented output and cold-storage locations"
      aggregation_rule: "sum released net mass by product, exclude packaging and rejects, retain gross pre-normalization total"
      quality_evidence: "scale calibration; quality release; lot traceability; cold-chain log"
    - protocol_id: cp_residue_records
      process_id: "surimi_manufacturing"
      flow_role: "fish residues and recovered solids"
      record_type: "bin weights, dispatch tickets, recovery records, and mass balance"
      raw_fields: "batch_id; residue_type; wet_mass; moisture_or_solids; destination; revenue_status; unit"
      collection_method: "direct weighing preferred; reconciled mass balance when direct measurement is unavailable"
      unit: "kg"
      frequency: "each batch or dispatch"
      temporal_coverage: "full represented production period"
      site_scope: "all preparation, washing, refining, and wastewater-solids points"
      aggregation_rule: "sum by residue type and destination, then normalize to net output"
      quality_evidence: "scale calibration; dispatch ticket; receiver record; mass-balance closure"
    - protocol_id: cp_wastewater_records
      process_id: "surimi_manufacturing"
      flow_role: "process wastewater"
      record_type: "discharge meter, tank, laboratory, and treatment records"
      raw_fields: "period; discharge_mass_or_volume; solids; organic_load; destination; treatment_stage; unit"
      collection_method: "direct discharge measurement or documented water balance with sampling"
      unit: "kg or m3"
      frequency: "continuous, batch, or representative sampling"
      temporal_coverage: "full represented production period"
      site_scope: "all represented discharge points"
      aggregation_rule: "aggregate by treatment destination, convert volume when necessary, and normalize to net output"
      quality_evidence: "meter calibration; sampling plan; laboratory result; water-balance closure"
    - protocol_id: cp_packaging_waste_records
      process_id: "surimi_manufacturing"
      flow_role: "packaging and other solid waste"
      record_type: "waste weights, counts, dispatch tickets, and treatment records"
      raw_fields: "period; material; count; component_mass; waste_mass; destination; unit"
      collection_method: "direct weighing or verified count-to-mass calculation"
      unit: "kg"
      frequency: "each batch or dispatch"
      temporal_coverage: "full represented production period"
      site_scope: "all represented packing and storage areas"
      aggregation_rule: "sum by material and destination, then normalize to net output"
      quality_evidence: "scale calibration; dispatch ticket; count-to-mass sampling"
    - protocol_id: cp_refrigerant_records
      process_id: "surimi_manufacturing"
      flow_role: "refrigerant makeup and emissions"
      record_type: "inventory, purchase, charge, recovery, disposal, and service records"
      raw_fields: "refrigerant_id; opening_stock; purchases; additions; recoveries; disposals; closing_stock; equipment_id; period; unit"
      collection_method: "substance-specific refrigerant mass balance"
      unit: "kg"
      frequency: "each service event and reporting-period close"
      temporal_coverage: "full represented production period"
      site_scope: "all represented freezing and cold-storage systems"
      aggregation_rule: "calculate loss by substance, allocate shared systems under section 7, and normalize to net output"
      quality_evidence: "service tickets; invoices; inventory reconciliation; equipment register"
  calculation_rules:
    - id: calc_net_surimi_mass
      applies_to: "packaged surimi output"
      rule: "net_surimi_mass = gross_packaged_mass - packaging_mass - nonconforming_product_mass"
      inputs:
        - "gross packaged mass"
        - "packaging mass"
        - "nonconforming product mass"
      output: "kg conforming net surimi"
      source_ids: []
    - id: calc_normalized_amount
      applies_to: "every inventory row"
      rule: "normalized_amount = allocated_period_or_batch_amount / conforming_net_surimi_mass"
      inputs:
        - "allocated row amount"
