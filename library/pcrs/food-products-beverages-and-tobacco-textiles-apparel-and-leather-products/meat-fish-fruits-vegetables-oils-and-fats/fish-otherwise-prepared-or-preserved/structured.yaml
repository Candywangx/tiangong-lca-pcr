system_boundary:
  rules:
    - rule_id: boundary_foreground_route
      applies_to: "representative frozen-surimi manufacture"
      rule: "Include the actual facility steps from raw-material reception through preparation, meat separation, repeated washing and dewatering, refining, final dewatering, ingredient mixing, packaging, freezing, metal detection, frozen storage, and dispatch preparation."
