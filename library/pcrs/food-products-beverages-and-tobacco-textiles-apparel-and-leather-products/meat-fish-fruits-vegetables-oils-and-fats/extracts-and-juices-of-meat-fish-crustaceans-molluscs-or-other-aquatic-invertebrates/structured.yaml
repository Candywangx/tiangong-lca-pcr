allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared production"
    rule: "Subdivide by species, tissue, product identity, route, and production lot wherever meters and records permit; never allocate a mixed campaign before segregated records have been exhausted."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_direct_assignment
    applies_to: "dedicated operations"
    rule: "Assign feedstock, ingredients, filtration media, packaging, waste, and directly metered utilities to the product that caused them."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relation
    applies_to: "inseparable shared operations"
    rule: "For a remaining shared operation, use a documented causal physical relation such as measured throughput, evaporated water, solids processed, or useful heat demand."
    source_ids:
      - eu-pef-2021-2279
      - fao-fishmeal-process
  - rule_id: allocation_economic_fallback
    applies_to: "multifunctional outputs"
    rule: "Use economic allocation only when subdivision and a defensible causal physical relation are unavailable; use contemporaneous prices, disclose the period and currency, and test sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_coproduct_classification
    applies_to: "separated fat, oil, shell, or other fraction"
    rule: "Treat a separated fraction as a co-product only when it meets a declared specification and leaves the facility for an evidenced beneficial use; otherwise record the exact stream as waste."
    source_ids:
      - jrc-sa-bref-2024
  - rule_id: allocation_no_avoided_burden
    applies_to: "recycling or recovery"
    rule: "Do not subtract an avoided product burden inside the foreground inventory; any substitution credit belongs to an explicitly declared downstream scenario."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_no_double_counting
    applies_to: "purchased and on-site utilities"
    rule: "A user process shall consume either a purchased carrier or an internally generated carrier for the same metered delivery; do not count both as external input."
    source_ids:
      - eu-pef-2021-2279
