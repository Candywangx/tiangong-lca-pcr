system_boundary:
  rules:
    - rule_id: boundary_foreground_operations
      applies_to: "foreground system"
      rule: "Include receipt, preparation, extraction or hydrolysis, separation, clarification, applicable concentration or drying, cooling, packaging, storage, cleaning, wastewater management, and on-site energy operations used by the declared lot."
      source_ids:
        - eu-pef-2021-2279
        - fao-fishmeal-process
        - codex-cxs-117-1981
    - rule_id: boundary_upstream_links
      applies_to: "purchased inputs"
      rule: "Represent upstream animal production or capture, primary processing, utilities, chemicals, filtration media, refrigerants, and packaging through linked datasets rather than silently omitting them."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_route_lock
      applies_to: "reference product"
      rule: "Model one exact species, tissue, extract-or-juice identity, route, physical state, and concentration state; aggregation across those choices is prohibited."
      source_ids:
        - un-cpc-3.0-21185
        - codex-cxs-117-1981
        - fao-fisheries-paper-540
    - rule_id: boundary_nonoperated_upstream_exclusion
      applies_to: "non-operated upstream processes"
      rule: "Do not import slaughter, rendering, fishmeal, oil production, or other upstream operations into the foreground unless the facility actually performs them for the declared product."
      source_ids:
        - jrc-sa-bref-2024
    - rule_id: boundary_complete_lci
      applies_to: "all exchanges"
      rule: "Inventory raw materials, energy, water, product and co-product outputs, wastes, and emissions to air and water without substituting a collection label for an exchange."
      source_ids:
        - eu-pef-2021-2279
        - jrc-sa-bref-2024
boundary_abstraction:
  declared_starting_condition: "One segregated, species- and tissue-specific animal material is received at the extraction facility with measured mass, state, supplier, preservation history, and upstream dataset link."
  starting_condition_role: "Foreground gate; livestock production, capture or aquaculture, slaughter or landing, and primary cutting are upstream."
  product_classification_scope: "CPC 3.0 subclass 21185 only after the product is demonstrably an extract or juice; category membership does not merge species, tissues, routes, or states."
  recursive_input_rule: "A purchased CPC 21185 extract or juice used as an ingredient is recorded as one exact upstream product flow with its own dataset and is not reopened as foreground animal feedstock in the same package."
  upstream_dataset_requirement: "Link every received animal material, purchased extract or juice, ingredient, utility, filtration medium, refrigerant, and package component to a geographically and temporally appropriate upstream dataset."
  disclosure: "Declare species, tissue, product identity, route, state, solids content, fat-removal status, preservation, packaging, storage, geography, period, co-product fate, waste treatment, and every boundary exclusion."
