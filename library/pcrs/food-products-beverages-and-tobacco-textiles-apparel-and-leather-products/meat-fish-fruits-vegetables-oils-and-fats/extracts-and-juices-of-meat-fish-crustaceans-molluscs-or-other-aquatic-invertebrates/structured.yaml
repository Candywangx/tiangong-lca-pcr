validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "The reference product UUID, Mass property UUID, Units of mass UUID, kg unit, and exactly 1 kg net output shall match section 3."
    source_ids:
      - un-cpc-3.0-21185
  - rule_id: validation_qualifier_lock
    applies_to: "data package identity"
    rule: "Reject a package that mixes species, tissues, extract and juice identities, physical states, or concentration states, or omits any required qualifier."
    source_ids:
      - un-cpc-3.0-21185
      - codex-cxs-117-1981
  - rule_id: validation_process_applicability
    applies_to: "process map"
    rule: "Every required process has foreground records; each conditional process is either evidenced as operated or explicitly not applicable with a route explanation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_atomic_rows
    applies_to: "process inventory"
    rule: "Reject a collection or selector row; each actual exchange is represented by one concrete flow card and every actual unlisted exchange is added as a new atomic row."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_uuid_closure
    applies_to: "Tiangong identities"
    rule: "The reference UUIDs shall equal the verified identities; every other UUID remains blank until independently resolved and the manifest unresolved register shall exactly match all blank-UUID row ids."
    source_ids:
      - un-cpc-3.0-21185
  - rule_id: validation_inventory_completeness
    applies_to: "LCI"
    rule: "Confirm raw feedstock, utilities, water, ingredients, filtration media, packaging, co-products, wastes, wastewater pollutants, refrigerant losses, and direct air emissions for the operated route."
    source_ids:
      - eu-pef-2021-2279
      - jrc-sa-bref-2024
  - rule_id: validation_mass_solids_balance
    applies_to: "mass balance"
    rule: "Wet-mass and dry-matter balances shall reconcile feedstock, product, separated fractions, waste, inventory changes, and water removal; every residual is quantified and explained."
    source_ids:
      - fao-fishmeal-process
      - fao-fisheries-paper-540
  - rule_id: validation_quantity_provenance
    applies_to: "inventory amounts"
    rule: "Every non-fixed value shall link to a foreground collection protocol or a calculation using collected records; unsupported defaults, ranges, and reasoned estimates are prohibited."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_allocation
    applies_to: "shared operations and co-products"
    rule: "Verify subdivision, direct assignment, the documented causal driver, any economic fallback, co-product classification, and absence of double counting or embedded avoided burden."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_language_alignment
    applies_to: "bilingual PCR"
    rule: "English and Chinese shall have the same ordered process ids, row ids, controlled tokens, UUIDs, source ids, calculation ids, and normative rule ids."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Company-specific foreground production dataset for one locked extract or juice"
  downstream_use: "Product carbon footprint, environmental-footprint study, LCA process dataset, lifecycle model, supplier disclosure, and internal process improvement"
  allowed_use: "Use only for the declared species, tissue, product identity, route, physical state, solids or concentration state, facility, geography, period, package, and storage condition"
  excluded_use: "Generic poultry, generic fish, generic crustacean, generic mollusc, mixed animal input, mixed extract-and-juice product, another concentration state, soup or broth, fishmeal, gelatine, principal-product oil, or an unrepresented facility"
  required_metadata: "All reference qualifiers; facility and period; process applicability; exact BoM; meters and protocols; upstream dataset links; co-product fate; allocation; waste destinations; discharge points; unresolved UUID status"
  required_quality_disclosure: "Primary-data coverage; meter and laboratory QA; wet-mass and solids reconciliation; allocation sensitivity; missing data; representativeness; any added atomic rows"
  update_trigger: "Change of species, tissue, product identity, extraction route, physical or concentration state, formulation, filtration technology, packaging, refrigerant, fuel, wastewater treatment, allocation basis, facility, or representative period"
