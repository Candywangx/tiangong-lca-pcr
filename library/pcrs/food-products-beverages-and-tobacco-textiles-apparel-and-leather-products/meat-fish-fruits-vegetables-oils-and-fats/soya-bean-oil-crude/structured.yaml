system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate
      applies_to: "Foreground crude-oil production"
      rule: "Include receiving and storage, cleaning, preparation, extraction, desolventizing, solvent recovery, crude-oil finishing and storage, co-product handling inside the plant, utilities, wastes, wastewater, and direct releases up to crude-oil loadout."
