    used_for: "Soybean-processing decomposition, crude/refined boundary, solvent recovery, co-products, particulate and hexane releases, plant-specific solvent balance, source oil-content and residual-oil observations used only to infer the temporary soybean-input QA guardrail, and the D-rated temporary hexane-loss screen"
