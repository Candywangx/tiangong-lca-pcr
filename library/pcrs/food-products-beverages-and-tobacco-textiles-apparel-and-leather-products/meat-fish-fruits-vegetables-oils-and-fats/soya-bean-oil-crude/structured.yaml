allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Crude oil, meal or cake, hulls, and other co-products"
    rule: "First avoid allocation by sub-metering and subdividing receiving, preparation, extraction, meal handling, and storage operations wherever their inputs and releases can be measured separately."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_physical_then_other
    applies_to: "Remaining shared burdens"
    rule: "Where subdivision or system expansion consistent with the study goal is not feasible, allocate using a documented physical relationship that reflects the shared process. If no defensible physical relationship exists, use another relationship such as economic value and justify the choice."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_measure_before_partition
    applies_to: "All product and co-product streams"
    rule: "Measure oil, meal or cake, hulls, recovered saleable products, wastes, moisture, and storage changes before calculating allocation factors; allocation must not hide an omitted mass stream."
    source_ids:
      - iso-14044-2006
      - us-epa-ap42-9-11-1-1995
  - rule_id: allocation_internal_recovery
    applies_to: "Recovered solvent, water, heat, and internal transfers"
    rule: "Treat closed internal recovery loops as internal flows without avoided-product credit. Record only net external inputs and direct losses at the foreground boundary."
    source_ids:
      - iso-14044-2006
      - us-epa-ap42-9-11-1-1995
  - rule_id: allocation_sensitivity_disclosure
    applies_to: "Comparative or public downstream studies"
    rule: "Report the allocation basis and factors and test at least one plausible alternative for materially important co-products; disclose the influence on the crude-oil result."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_soybean_receipts
      process_id: "soybean_receiving_preparation"
      flow_role: "Received soya beans"
      record_type: "Weighbridge, receiving inspection, and supplier lot records"
      raw_fields: "lot_id; supplier; origin; receipt_time; gross_mass; tare_mass; net_mass; moisture; foreign_matter; damaged_seed_fraction; accepted_mass"
      collection_method: "Calibrated weighbridge plus representative lot sampling"
      unit: "kg; mass %"
      frequency: "Every delivery"
      temporal_coverage: "At least 12 consecutive months or all campaigns in the declared period"
      site_scope: "All supplying lots to the represented plant"
      aggregation_rule: "Sum accepted net mass; retain rejected mass separately; calculate weighted moisture and foreign matter"
      quality_evidence: "Scale calibration, sample plan, laboratory results, and reconciliation to inventory"
    - protocol_id: cp_utility_records
      process_id: "soybean_receiving_preparation_oil_extraction_recovery"
      flow_role: "Electricity, fuel, steam, heat, and water"
      record_type: "Meters, invoices, boiler logs, and sub-meter records"
      raw_fields: "carrier; meter_id; opening_reading; closing_reading; unit; steam_pressure_temperature; fuel_LHV_HHV_basis; allocation_driver; operating_hours"
      collection_method: "Prefer calibrated sub-metering; otherwise documented engineering allocation from whole-site records"
      unit: "kWh; MJ; kg steam; kg water; carrier-specific"
      frequency: "Continuous or each billing period"
      temporal_coverage: "Same period as product and co-product records"
      site_scope: "All included equipment and on-site utility systems"
      aggregation_rule: "Sum by carrier and process; convert only with documented factors; normalize after period reconciliation"
      quality_evidence: "Meter calibration, invoices, boiler efficiency records, and allocation worksheet"
    - protocol_id: cp_process_transfer_records
      process_id: "soybean_receiving_preparation_oil_extraction_recovery"
      flow_role: "Prepared feed and intermediate crude oil"
      record_type: "Belt-scale, tank gauge, batch sheet, and transfer log"
      raw_fields: "timestamp; source_process; destination_process; mass_or_volume; density; temperature; moisture; opening_stock; closing_stock; samples"
      collection_method: "Direct measurement at internal transfer points"
      unit: "kg preferred; L with density and temperature"
      frequency: "Every batch or continuous totalizer"
      temporal_coverage: "Same period as reference output"
      site_scope: "All internal transfers between included processes"
      aggregation_rule: "Reconcile sending and receiving records and storage changes before normalization"
      quality_evidence: "Calibration, batch traceability, and signed transfer reconciliation"
    - protocol_id: cp_solvent_balance_records
      process_id: "oil_extraction_recovery"
      flow_role: "Fresh, recovered, stored, transferred, residual, and released solvent"
      record_type: "Purchase records, tank gauges, flow meters, recovery meters, product/residue tests, and incident logs"
      raw_fields: "solvent_identity; receipts; opening_stock; closing_stock; external_transfers; recovered_internal; residual_in_oil; residual_in_meal; residual_in_wastewater; measured_vent_release; spill_release"
      collection_method: "Period material balance with measured stock change and separately measured non-air exits"
      unit: "kg preferred; L with measured density"
      frequency: "Each delivery and daily or batch stock; period balance monthly and annually"
      temporal_coverage: "Full declared production period"
      site_scope: "Entire solvent system, storage, recovery, vents, products, and wastewater"
      aggregation_rule: "Calculate net make-up and reconcile destinations; prevent double counting of storage and vent losses"
      quality_evidence: "Tank calibration, density and temperature records, purchase invoices, recovery-meter checks, and incident reports"
    - protocol_id: cp_coproduct_waste_records
      process_id: "soybean_receiving_preparation_oil_extraction_recovery"
      flow_role: "Hulls, meal or cake, rejects, wastewater, and residues"
      record_type: "Scales, tank meters, laboratory tests, waste manifests, and sales records"
      raw_fields: "stream_id; quantity; moisture; grade; protein_or_oil_content_if_relevant; destination; sale_or_waste_status; treatment"
      collection_method: "Measure each distinct stream and destination"
      unit: "kg; kg water; m3 only with density where mass conversion is required"
      frequency: "Every batch, shipment, or disposal"
      temporal_coverage: "Same period as reference output"
      site_scope: "All co-products and wastes from included processes"
      aggregation_rule: "Sum by stream, grade, and destination; do not net co-products against inputs"
      quality_evidence: "Scale calibration, sales invoices, manifests, laboratory results, and mass-balance reconciliation"
    - protocol_id: cp_storage_loadout_records
      process_id: "crude_oil_storage_loadout"
      flow_role: "Crude-oil storage, finishing, and reference loadout"
      record_type: "Tank gauges, load-cell or flow-meter tickets, utility issue records, and quality tests"
      raw_fields: "tank_id; opening_stock; closing_stock; receipts; loadout_mass; density; temperature; filtration_or_degumming_status; storage_days; nitrogen; utilities; samples; off_spec; spills"
      collection_method: "Calibrated tank and custody-transfer measurement plus lot testing"
      unit: "kg preferred; L with density and temperature"
      frequency: "Every transfer and daily stock; each loadout lot"
      temporal_coverage: "Full declared production period"
      site_scope: "All crude-oil tanks and loadout lines in scope"
      aggregation_rule: "Reconcile extraction transfer, stock change, loadout, samples, off-spec material, and spills; normalize net conforming loadout"
      quality_evidence: "Calibration and custody-transfer tickets, tank reconciliation, batch genealogy, and laboratory reports"
    - protocol_id: cp_direct_release_records
      process_id: "soybean_receiving_preparation_oil_extraction_recovery_crude_oil_storage_loadout"
      flow_role: "Direct elementary releases"
      record_type: "Stack tests, continuous monitoring, solvent balance, permit calculations, wastewater tests, and incident logs"
      raw_fields: "source_id; pollutant; method; concentration; flow_rate; operating_time; control_device; control_efficiency; discharge_quantity; incident_quantity"
      collection_method: "Source-specific monitoring or disclosed approved calculation"
      unit: "kg pollutant; concentration and flow supporting fields"
      frequency: "Monitoring frequency required by method or permit; incidents when they occur"
      temporal_coverage: "Same period as activity data"
      site_scope: "Every included vent, stack, discharge, tank, and fugitive source"
      aggregation_rule: "Calculate each elementary flow separately and reconcile solvent releases to the solvent balance"
      quality_evidence: "Method reference, calibration, detection limit, control operating log, and reviewer trace"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "normalized amount = reconciled period quantity / reconciled net kg of conforming crude soya bean oil loaded out"
      inputs:
        - "Period flow quantity"
        - "net reference-product loadout"
      output: "Amount per 1 kg reference product"
      source_ids:
        - iso-14044-2006
    - id: calc_soybean_dry_clean_basis
      applies_to: "Soya bean inputs and solid co-products"
      rule: "dry clean mass = as-received mass × (1 − moisture fraction − separately measured foreign-matter fraction); retain the as-received value and avoid subtracting overlapping fractions"
      inputs:
        - "As-received mass"
        - moisture
        - "foreign matter"
        - "sampling basis"
      output: "Dry clean mass with conversion audit trail"
      source_ids:
        - us-epa-ap42-9-11-1-1995
    - id: calc_solvent_makeup_balance
      applies_to: "Solvent route"
      rule: "net external make-up = external receipts + opening stock − closing stock − documented external transfers; reconcile net make-up to air loss, residuals in products and wastewater, spills, and unexplained difference"
      inputs:
        - "Solvent receipts"
        - stocks
        - transfers
        - "residual tests"
        - releases
        - "and incidents"
      output: "Net make-up and destination balance per period and per kg oil"
      source_ids:
        - us-epa-ap42-9-11-1-1995
    - id: calc_hexane_temporary_screen
      applies_to: "Solvent route with missing plant-specific balance"
      rule: "The AP-42 3.3 L/Mg raw-soybean factor is a D-rated temporary screening default only. Convert it using documented density and measured soybean throughput, label the result as temporary, and replace it before comparative or publication-grade use."
      inputs:
        - "Raw-soybean throughput"
        - "3.3 L/Mg screening factor"
        - "representative density"
      output: "Explicitly flagged temporary total-loss screen"
      source_ids:
        - us-epa-ap42-9-11-1-1995
    - id: calc_process_mass_balance
      applies_to: "Each process and full foreground system"
      rule: "reconcile measured inputs = products + co-products + wastes + releases + stock change + documented measurement difference on consistent moisture and solvent bases"
      inputs:
        - "All mass flows"
        - stocks
        - moisture
        - "and residual-solvent records"
      output: "Balance closure and unexplained difference"
      source_ids:
        - iso-14044-2006
        - us-epa-ap42-9-11-1-1995
    - id: calc_allocation_factors
      applies_to: "Shared process burdens"
      rule: "allocation factor for output i = declared allocation quantity or value for i / sum of the same basis over all co-products; factors must sum to 1 within rounding tolerance"
      inputs:
        - "Measured co-product quantities"
        - "chosen physical relation or values"
        - "and declared period"
      output: "Allocation factors and sensitivity case"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_reference_identity
      applies_to: "Reference product"
      requirement: "Verify the product-flow UUID, Product flow type, Mass reference property, CPC 21611 classification, crude/unrefined state, and separation from CPC 21612 refined oil."
      evidence: "Tiangong flow readback, batch specification, and classification record"
    - id: dq_temporal_representativeness
      applies_to: "All foreground activity"
      requirement: "Use at least 12 consecutive months or all campaigns in the declared period; explain shutdowns, start-ups, atypical lots, and partial-year extrapolation."
      evidence: "Production calendar, meter coverage, purchase records, and loadout ledger"
    - id: dq_technology_route
      applies_to: "Extraction and recovery"
      requirement: "Declare mechanical, solvent, or combined route, solvent identity, recovery and control equipment, meal-desolventizing route, optional degumming, and actual included operations."
      evidence: "Process flow diagram, equipment list, operating procedure, and source-specific records"
    - id: dq_mass_completeness
      applies_to: "Foreground inventory"
      requirement: "Reconcile soya beans, oil, meal or cake, hulls, rejects, wastes, solvent, wastewater, stock changes, and direct releases; disclose unexplained differences and omitted streams."
      evidence: "Signed mass-balance worksheet and variance investigation"
    - id: dq_primary_over_default
      applies_to: "Important inputs and releases"
      requirement: "Prefer calibrated measurements and period records. Any AP-42 or other default must be identified as temporary, quality-rated, and replaced when plant-specific records become available."
      evidence: "Meter and calibration evidence, invoices, tests, and explicit default register"
    - id: dq_geographic_supplier_fit
      applies_to: "Upstream datasets"
      requirement: "Match the plant, soybean origin, electricity market, fuels, solvent, water, and treatment services to the represented geography and period or disclose proxies."
      evidence: "Supplier metadata, dataset geography and year, and proxy justification"
    - id: dq_allocation_transparency
      applies_to: "Co-product burdens"
      requirement: "Retain pre-allocation inventory, co-product measurements, chosen hierarchy step, factors, rationale, and sensitivity result."
      evidence: "Allocation workbook and reviewer sign-off"
    - id: dq_test_method_traceability
      applies_to: "Crude-oil identity screens"
      requirement: "For Codex-related property screens, retain test method, temperature, units, sample and lot identity, laboratory, detection limits, and result."
      evidence: "Laboratory certificate and sampling chain of custody"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The reference output must be 1 kg net Soya bean oil, crude 6464d0d3-fb5d-4e46-bfb3-01327a3ddbd3 using Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: validate_scope_and_route
    applies_to: "Product and process boundary"
    rule: "Confirm soya bean origin, crude/unrefined state, declared extraction route, desolventizing and degumming status, and absence or subdivision of alkali refining, bleaching, deodorization, and other refined-oil operations."
    source_ids:
      - unsd-cpc-3-2025
      - us-epa-ap42-9-11-1-1995
  - rule_id: validate_process_coverage
    applies_to: "Process map"
    rule: "Receiving and preparation, route-specific extraction and recovery, crude-oil storage and loadout, utilities, co-product handling, wastes, wastewater, and direct releases must be represented or explicitly not applicable with evidence."
    source_ids:
      - us-epa-ap42-9-11-1-1995
  - rule_id: validate_solvent_balance
    applies_to: "Solvent route"
    rule: "Check net make-up, stock change, internal recovery, residual solvent in products and wastewater when measured, direct air loss, spills, and unexplained difference; reject double counting of circulating recovered solvent."
    source_ids:
      - us-epa-ap42-9-11-1-1995
  - rule_id: validate_mass_and_allocation
    applies_to: "Full foreground system"
    rule: "Require a documented mass balance, measured co-product streams, allocation factors summing to 1 within declared rounding tolerance, and preservation of the unallocated inventory."
    source_ids:
      - iso-14044-2006
      - us-epa-ap42-9-11-1-1995
  - rule_id: validate_codex_crude_oil_screen
    applies_to: "Optional identity-test results"
    rule: "When Codex Table A2 tests are used, screen ordinary crude soyabean oil against relative density 0.919–0.925 at 20 °C, refractive index 1.466–1.470 at 40 °C, saponification value 189–195 mg KOH/g oil, iodine value 124–139, and unsaponifiable matter no more than 15 g/kg. Any result outside the screen requires investigation and disclosure; the screen is not a food-safety certification."
    source_ids:
      - codex-cxs-210-1999-2026
  - rule_id: validate_temporary_defaults
    applies_to: "Publication and comparative use"
    rule: "Identify every temporary factor or proxy. A result using the AP-42 D-rated 3.3 L/Mg soybean hexane-loss default fails publication-grade completeness until replaced by a plant-specific period balance or explicitly accepted by review for a limited use."
    source_ids:
      - us-epa-ap42-9-11-1-1995
      - iso-14044-2006
  - rule_id: validate_bilingual_and_period_alignment
    applies_to: "Dataset package"
    rule: "Confirm that qualifiers, period totals, calculations, allocation basis, and source identifiers are internally consistent and that no process amount is normalized to a different oil output period."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground production dataset for crude soya bean oil at extraction-plant gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Gate-to-gate oilseed-processing studies; cradle-to-gate models when upstream soya bean and utility datasets are linked; downstream refined-oil models using crude oil as an input; scenario analysis with disclosed route and allocation"
  excluded_use: "Representation of refined soya bean oil or consumer-ready edible oil; food-safety certification; undisclosed substitution for another vegetable oil; public comparative assertions when temporary defaults, unresolved identity, material balance gaps, or unreviewed allocation choices remain"
  required_metadata: "PCR id; reference UUID and unit support; plant geography; period; soybean origin, grade, moisture, and foreign matter; extraction route; solvent and recovery system; degumming status; storage duration; process coverage; co-product grades and destinations; allocation basis and factors; upstream dataset identities"
  required_quality_disclosure: "Meter and scale coverage; calibration; sampling and laboratory methods; mass- and solvent-balance closure; stock changes; direct-release method; missing streams; proxy datasets; temporary defaults and quality ratings; allocation sensitivity; Codex identity-screen results when used"
  update_trigger: "Material change in soybean supply, extraction or recovery technology, energy system, solvent, emission control, degumming or storage practice, co-product market or allocation relation, plant geography, product specification, source standard, UUID support, or a temporary default being replaced by foreground evidence"
