        - us-epa-ap42-9-11-1-1995
    - rule_id: boundary_refining_exclusion
      applies_to: "Downstream oil treatment"
      rule: "Exclude alkali neutralization, bleaching, deodorization, and finished refined-oil production. If these occur at the same site, meter or subdivide them and assign only pre-refining burdens to this PCR."
      source_ids:
        - unsd-cpc-3-2025
        - us-epa-ap42-9-11-1-1995
    - rule_id: boundary_solvent_route
      applies_to: "Solvent extraction route"
      rule: "Include solvent make-up, storage changes, recovery, vents and leaks, residual solvent leaving in oil or meal when measured, wastewater-related losses, and control equipment. Do not treat recovered internal solvent as a new external input."
      source_ids:
        - us-epa-ap42-9-11-1-1995
    - rule_id: boundary_upstream_linking
      applies_to: "Purchased inputs"
      rule: "Keep upstream production outside the foreground gate while linking each material, energy, water, and service input to an appropriate upstream dataset; disclose missing or proxy datasets."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_route_specificity
      applies_to: "Mechanical, solvent, or combined route"
      rule: "Declare one route and include only operations actually performed. Solvent-only rows are not zero-filled for a mechanical route; they are marked not applicable with route evidence."
      source_ids:
        - us-epa-ap42-9-11-1-1995
