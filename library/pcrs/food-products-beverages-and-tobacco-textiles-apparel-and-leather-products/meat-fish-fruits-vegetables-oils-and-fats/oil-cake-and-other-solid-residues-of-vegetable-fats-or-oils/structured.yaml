functional_unit:
  what: "Saleable oil-cake or other solid residue providing a material or feed-ingredient function after extraction of vegetable fat or oil"
  how_much: "1 kg of as-sold product at the producing mill gate"
  how_well: "Conforms to the declared species, route, moisture, residual-oil, hull-content, treatment, contamination-control, and market-grade specifications"
