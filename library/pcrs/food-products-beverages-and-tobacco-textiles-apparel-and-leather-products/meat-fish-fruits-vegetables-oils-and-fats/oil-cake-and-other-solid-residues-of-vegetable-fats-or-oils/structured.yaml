system_boundary:
  rules:
    - rule_id: boundary_extraction_chain
      applies_to: "all routes"
      rule: "Include receiving/handling, preparation, extraction, and the conditioning required to make the solid residue saleable at the mill gate; include cleaning, dehulling, cracking, conditioning, flaking, pressing, extraction, desolventizing/toasting, drying, cooling, grinding, sizing, pelleting, storage, and loadout when performed."
      source_ids:
        - epa-ap42-vegetable-oil-1995
    - rule_id: boundary_route_specific
      applies_to: "route selection"
      rule: "Include mechanical and solvent operations only when used by the declared route. For solvent extraction, include solvent recovery, condensate handling, and measured fugitive or vent releases; do not model recovered solvent as both avoided production and a negative input."
      source_ids:
        - us-epa-solvent-extraction-neshap
        - epa-ap42-vegetable-oil-1995
    - rule_id: boundary_upstream_and_downstream
      applies_to: "life-cycle coverage"
      rule: "Link received oil-bearing materials and purchased utilities to upstream datasets. Exclude crude-oil refining, feed formulation, distribution beyond the mill gate, and product use unless the study explicitly extends the boundary and reports those additions separately."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_waste_and_internal_recycling
      applies_to: "wastes and internal loops"
      rule: "Record wastes and releases at the point they cross the foreground boundary. Keep recovered solvent and internally recirculated intermediate solids inside the process balance; record only net external inputs and outputs in the published exchange set while retaining gross loop records for QA."
      source_ids:
        - epa-ap42-vegetable-oil-1995
        - mass-balance-identity
boundary_abstraction:
  declared_starting_condition: "Oilseeds or oleaginous fruits received at the extraction facility, with incoming mass, moisture, oil content where available, origin, lot identity, and any prior drying or dehulling declared"
  starting_condition_role: "Upstream product input to the foreground oil-extraction system"
  product_classification_scope: "Solid saleable residues produced by extraction of vegetable fats or oils; adjacent non-extraction meals, refining residues, waxes, and animal-fat residues are excluded"
  recursive_input_rule: "Purchased oil-cake or extracted residue of the same category used for blending or reprocessing is recorded once as an external product input with its own upstream dataset; do not recursively recreate its extraction history inside this foreground package"
  upstream_dataset_requirement: "Use a geographically, technologically, and temporally representative upstream dataset for each received oil-bearing material and for material utilities; disclose proxy use and any excluded cultivation or preprocessing stage"
  disclosure: "Declare facility gate, product and co-product cut points, route, solvent loop, internal recycling, included residue finishing, upstream coverage, infrastructure policy, transport coverage, and excluded downstream use"
