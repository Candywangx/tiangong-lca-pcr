  - rule_id: allocation_shared_extraction
    applies_to: "crude oil, oil-cake, hulls, and other saleable outputs from shared extraction"
    rule: "When subdivision cannot resolve shared burdens, first test and document a defensible physical causal relation. If no representative physical relation can be established, allocate shared burdens by contemporaneous economic value at the common separation point using measured saleable masses and auditable prices; disclose the method and provide a sensitivity result for a plausible alternative."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_route_consistency
    applies_to: "internal intermediates and solvent recovery"
    rule: "Do not allocate burdens to internal transfers or recovered solvent recirculated within the facility. Assign solvent-recovery energy and releases to the solvent-extraction system before allocating shared extraction burdens to saleable outputs."
    source_ids:
      - epa-ap42-vegetable-oil-1995
      - eu-pef-2021-2279
  - rule_id: allocation_waste_and_system_expansion
    applies_to: "wastes and avoided-product claims"
    rule: "Keep treatment burdens for discarded material in the system unless a governing study rule specifies otherwise. Do not grant avoided-product credit or apply system expansion by default; if a governing method requires it, report the substituted product, substitution ratio, evidence, and a result without the credit."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "oilseed_preparation"
      flow_role: "received oil-bearing material"
      record_type: "weighbridge, receipt, supplier, and laboratory records"
      raw_fields: "lot_id; species; origin; supplier; gross_mass; tare_mass; moisture; oil_content_if_used; foreign_matter; receipt_time"
      collection_method: "calibrated weighbridge plus representative laboratory sample"
      unit: "kg; mass fraction"
      frequency: "each incoming lot"
      temporal_coverage: "same representative period as output"
      site_scope: "all oil-bearing material supplying the declared product"
      aggregation_rule: "net lot mass assigned by production batch or documented inventory reconciliation"
      quality_evidence: "calibration record; sampling plan; laboratory method; supplier traceability"
    - protocol_id: cp_utilities
      process_id: "all_included_processes"
      flow_role: "electricity, steam, fuel, water, and additions"
      record_type: "utility meter, invoice, and allocation records"
      raw_fields: "meter_id; opening; closing; unit; fuel/addition mass; allocation_driver; process_id; timestamp"
      collection_method: "dedicated meter preferred; shared meter allocated by documented operating time, throughput, or engineering driver"
      unit: "source unit and converted kWh, MJ, kg, or m3"
      frequency: "at least monthly and for material batch campaigns"
      temporal_coverage: "representative continuous 12-month period or documented campaign"
      site_scope: "all included equipment and utilities"
      aggregation_rule: "sum dedicated use plus disclosed allocation of shared use; exclude unrelated production"
      quality_evidence: "meter calibration; invoices; allocation worksheet; conversion factors"
    - protocol_id: cp_mass_outputs
      process_id: "all_included_processes"
      flow_role: "intermediates, products, co-products, rejects, and stock"
      record_type: "scale, stock, dispatch, and laboratory records"
      raw_fields: "lot_id; flow_role; gross_mass; tare_mass; moisture; residual_oil_if_relevant; opening_stock; closing_stock; destination"
      collection_method: "calibrated scale, weighbridge, tank gauge, or validated mass balance"
      unit: "kg; mass fraction"
      frequency: "each batch or transfer, reconciled monthly"
      temporal_coverage: "same period as material and utility records"
      site_scope: "all included output and internal transfer points"
      aggregation_rule: "sum external outputs and reconcile internal transfers and stock changes without double counting"
      quality_evidence: "calibration record; stock reconciliation; laboratory method; dispatch record"
    - protocol_id: cp_solvent_balance
      process_id: "solvent_extraction"
      flow_role: "solvent makeup, recovery, inventory, products, wastes, and releases"
      record_type: "purchase, tank, recovery, emission, and analytical records"
      raw_fields: "solvent_identity; purchased_mass; returned_mass; opening_stock; closing_stock; recovered_internal_mass; product_or_waste_solvent; measured_release"
      collection_method: "purchase and inventory records plus recovery meters and analytical tests"
      unit: "kg"
      frequency: "each solvent receipt and at least monthly balance"
      temporal_coverage: "full reporting period"
      site_scope: "complete solvent loop and emission points"
      aggregation_rule: "calculate net external makeup and close the solvent balance; retain gross recovery separately"
      quality_evidence: "purchase invoice; tank calibration; analytical method; balance reconciliation"
    - protocol_id: cp_air_emissions
      process_id: "all_included_processes"
      flow_role: "particulate and organic-solvent releases"
      record_type: "stack test, monitoring, leak-survey, and engineering-calculation records"
      raw_fields: "source_id; pollutant; concentration; gas_flow; operating_time; fugitive_method; control_efficiency; detection_limit"
      collection_method: "compliant stack test, continuous/periodic monitoring, leak survey, or documented mass-balance/engineering method"
      unit: "kg and source measurement units"
      frequency: "legal or permit frequency and each material route change"
      temporal_coverage: "representative reporting period"
      site_scope: "all included point and fugitive sources"
      aggregation_rule: "convert measured concentrations and activity to pollutant mass; do not substitute generic VOC for known solvent"
      quality_evidence: "test report; instrument calibration; permit report; method statement"
    - protocol_id: cp_product_quality
      process_id: "residue_finishing"
      flow_role: "reference-product quality and grade"
      record_type: "release-lot laboratory, specification, and nonconformance records"
      raw_fields: "lot_id; moisture; dry_matter; residual_oil; hull_content; protein_if_claimed; solvent_residue_if_relevant; physical_form; grade; intended_use; nonconformance"
      collection_method: "representative lot sampling and validated laboratory or specification method"
      unit: "mass fraction and declared units"
      frequency: "each release lot or documented risk-based plan"
      temporal_coverage: "same output lots as reference mass"
      site_scope: "all reference-product grades in scope"
      aggregation_rule: "retain lot results; mass-weight averages may describe the reporting period but shall not erase grade differences"
      quality_evidence: "sampling plan; method identifier; laboratory competence; certificate of analysis"
    - protocol_id: cp_prices_and_allocation
      process_id: "mechanical_extraction_solvent_extraction"
      flow_role: "co-product allocation"
      record_type: "invoice, contract, production, and representative market records"
      raw_fields: "product_id; saleable_mass; price; currency; price_basis; contract_date; separation_point"
      collection_method: "audited sales records or representative market records at the common separation point"
      unit: "currency/kg as sold and dry matter"
      frequency: "monthly or each contract period"
      temporal_coverage: "same period as physical production"
      site_scope: "all saleable co-products receiving shared burdens"
      aggregation_rule: "calculate mass and revenue shares on consistent moisture and price bases; document zero-price or non-saleable outputs"
      quality_evidence: "invoices; contracts; currency conversion; sensitivity worksheet"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "every external exchange"
      rule: "normalized amount = period exchange amount / period as-sold reference-product mass x 1,000 kg"
      inputs:
        - "reconciled exchange amount"
        - "reconciled reference-product output"
      output: "amount per 1,000 kg as-sold reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_dry_matter
      applies_to: "solid material and product"
      rule: "dry mass = as-sold mass x (1 - moisture mass fraction); retain both masses and test basis"
      inputs:
        - "as-sold mass"
        - "measured moisture"
      output: "kg dry matter and dry-matter fraction"
      source_ids:
        - mass-balance-identity
    - id: calc_mass_balance
      applies_to: "each process and total foreground"
      rule: "imbalance = inputs + opening stock - outputs - closing stock; investigate rather than forcing an unexplained residual to the reference product"
      inputs:
        - "measured product/waste masses"
        - stock
        - "measured emissions where material"
      output: "signed imbalance and percentage of total measured input"
      source_ids:
        - mass-balance-identity
    - id: calc_net_solvent_makeup
      applies_to: "solvent-extraction route"
      rule: "net external solvent makeup = purchases + external receipts - external returns - inventory increase; reconcile with solvent in products, wastes, and releases while recording internal recovery separately"
      inputs:
        - "purchase/return records"
        - "opening/closing stock"
        - "product/waste tests"
        - "measured emissions"
      output: "kg net makeup and solvent-balance closure"
      source_ids:
        - epa-ap42-vegetable-oil-1995
        - mass-balance-identity
    - id: calc_economic_allocation
      applies_to: "shared extraction burdens when physical allocation is not defensible"
      rule: "revenue share i = saleable mass i x representative price i / sum of saleable mass x price for all co-products at the separation point"
      inputs:
        - "co-product masses"
        - "contemporaneous comparable prices"
        - "moisture basis"
      output: "allocation factor for each saleable co-product"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_and_traceability
      applies_to: "reference product and oil-bearing input"
      requirement: "Retain lot identity, species, origin, supplier, route, intended use, production date, and trace-forward destination. Feed-grade products shall support timely withdrawal/recall and risk-based inspection, sampling, and analysis."
      evidence: "codex-cxc-54-2004"
    - id: dq_temporal_alignment
      applies_to: "all foreground records"
      requirement: "Material, utility, output, price, stock, and emission records shall cover the same representative period; shorter campaigns require documented representativeness and stock reconciliation."
      evidence: "eu-pef-2021-2279"
    - id: dq_measurement_quality
      applies_to: "mass, moisture, oil, solvent, utilities, and emissions"
      requirement: "Identify instrument or method, calibration or competence evidence, detection limits where relevant, missing-data treatment, and uncertainty or sensitivity for material calculations."
      evidence: "codex-cxc-54-2004; eu-pef-2021-2279"
    - id: dq_feed_safety
      applies_to: "products declared for animal feed"
      requirement: "Document safe source, stable and protected storage condition, risk-based undesirable-substance controls, applicable legal specifications, clear handling/use information, lot identification, and validated sampling/analysis."
      evidence: "codex-cxc-54-2004"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Reconcile at least 95% of measured oil-bearing-material mass by identified product, co-product, waste, emission where measured, and stock change; disclose the residual and do not invent a balancing flow."
      evidence: "mass-balance-identity"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Fail when oil-bearing species, extraction route, mill-gate state, moisture/dry-matter basis, residual-oil state, hull treatment, intended use, or physical form is missing; fail if the representative mustard flow UUID is used for a different product."
    source_ids:
      - fao-oilseeds-postharvest
      - mass-balance-identity
  - rule_id: validate_route_boundary
    applies_to: "process map"
    rule: "Require at least one extraction route, require solvent_extraction when solvent contacts the feed, and reject simultaneous mechanical and solvent stages unless the combined route and intermediate handoff are declared."
    source_ids:
      - epa-ap42-vegetable-oil-1995
      - us-epa-solvent-extraction-neshap
  - rule_id: validate_reference_mass
    applies_to: "reference flow"
    rule: "Require exactly 1 kg for the declared reference flow and a reported moisture result or specification; require 1,000 kg as-sold output in normalized inventory and verify the dry-matter conversion independently."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_mass_and_solvent_balance
    applies_to: "foreground inventory"
    rule: "Report process and total mass-balance residuals. For solvent routes, require solvent identity, purchases, recovery, stock change, product/waste solvent, and releases; unresolved material imbalance is an error, not an invented flow."
    source_ids:
      - epa-ap42-vegetable-oil-1995
      - mass-balance-identity
  - rule_id: validate_allocation
    applies_to: "shared burdens"
    rule: "Require subdivision evidence or a documented allocation hierarchy, complete co-product list, consistent separation point, auditable factors summing to 1, price/physical basis, and sensitivity result where economic allocation is used."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_feed_claim
    applies_to: "feed-grade declaration"
    rule: "Require lot traceability, safe-source evidence, applicable undesirable-substance controls, handling/storage information, sampling plan, validated analyses, and nonconformance disposition before a feed-grade claim is accepted."
    source_ids:
      - codex-cxc-54-2004
  - rule_id: validate_completeness
    applies_to: "published dataset"
    rule: "Require all required and triggered conditional processes, aligned temporal coverage, disclosed proxy datasets, explicit wastes and releases, and data-quality evidence; mark validation inconclusive when required source records are unavailable."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production dataset for oil-cake or another saleable solid residue of vegetable-oil extraction"
  downstream_use: "secondary_dataset; background_dataset after methodology review and publication controls"
  allowed_use: "Product carbon-footprint or LCA models requiring mill-gate oil-cake production; supplier and facility comparisons only when product qualifiers, boundaries, allocation, geography, technology, and period are equivalent"
  excluded_use: "Legal feed-safety certification; nutritional equivalence; substitution credit without a governing method; use as a generic proxy across different oilseeds, extraction routes, grades, or moisture states without documented justification"
  required_metadata: "PCR id/version; product flow UUID; species; origin; facility/geography; period; extraction route; solvent; dehulling/hull blending; moisture/dry matter; residual oil; treatment; form; grade/intended use; boundary; upstream datasets; allocation; technology; data owner"
  required_quality_disclosure: "Primary-data share; measurement and sampling methods; calibration/laboratory evidence; temporal and geographical representativeness; proxy data; missing-data treatment; mass and solvent balance; allocation sensitivity; uncertainty; feed-safety evidence when claimed"
  update_trigger: "Change in oil-bearing species mix, extraction or solvent technology, solvent recovery, energy source, residue finishing, hull blending, product grade/specification, allocation relation/prices, facility boundary, regulation, or a material shift in yield, utility use, emissions, or product quality"
data_sources:
  - id: "epa-ap42-vegetable-oil-1995"
    type: "official_guidance"
    reference: "U.S. EPA, AP-42 Section 9.11.1, Vegetable Oil Processing, November 1995. https://gaftp.epa.gov/ap42/ch09/s1101/final/c9s1101_nov1995.pdf (retrieved 2026-08-10)"
    used_for: "Oilseed handling and preparation; solvent extraction; desolventizing/toasting; drying/cooling; grinding, sizing, storage and loadout; particulate and hexane release points"
  - id: "us-epa-solvent-extraction-neshap"
    type: "official_guidance"
    reference: "U.S. EPA, Solvent Extraction for Vegetable Oil Production: National Emission Standards for Hazardous Air Pollutants. https://www.epa.gov/stationary-sources-air-pollution/solvent-extraction-vegetable-oil-production-national-emission (retrieved 2026-08-10)"
    used_for: "Solvent-route definition, solvent recovery, and chemically specific n-hexane release requirements"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on the use of the Environmental Footprint methods, Annex I, especially Section 4.5. ELI: https://data.europa.eu/eli/reco/2021/2279/oj (retrieved 2026-08-10)"
    used_for: "Life-cycle data quality, multifunctionality hierarchy, subdivision, physical relation, economic allocation, system expansion disclosure, and verification"
  - id: "codex-cxc-54-2004"
    type: "standard"
    reference: "FAO/WHO Codex Alimentarius, Code of Practice on Good Animal Feeding, CXC 54-2004, amended 2008 and 2024. https://www.fao.org/fao-who-codexalimentarius/codex-texts/codes-of-practice/en/ (retrieved 2026-08-10)"
    used_for: "Safe sourcing, contamination control, feed-grade handling and storage, labelling information, lot traceability, risk-based sampling, validated analysis, and records"
  - id: "fao-oilseeds-postharvest"
    type: "official_guidance"
    reference: "FAO Technical Platform on Food Loss and Waste, Oilseeds post-harvest operations. https://www.fao.org/platform-food-loss-waste/resources/publications/grains-and-pulses/3/en (retrieved 2026-08-10)"
    used_for: "Category semantics: oilseed crushing yields oil and a protein-rich cake used as livestock feed"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Foreground conservation-of-mass identity: measured inputs plus opening stock equal measured outputs plus closing stock and quantified losses, subject to an explicitly reported residual."
    used_for: "Normalization, dry-matter conversion, mass and solvent reconciliation, fixed reference output, and completeness QA"
