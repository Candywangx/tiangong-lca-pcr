system_boundary:
  rules:
    - rule_id: sb_route_lock
      applies_to: "foreground system"
      rule: "Include only the integrated chilled-sheep-liver route stated in section 1; do not average tissues, fresh/chilled/frozen states or mutually exclusive wastewater and refrigeration routes."
      source_ids:
        - fao-small-ruminant-slaughter-manual
        - eu-ec-853-2004-meat-hygiene
    - rule_id: sb_upstream_scope
      applies_to: "upstream supply"
      rule: "Include sheep husbandry and inbound transport through traceable upstream datasets attached to live_sheep_input; keep those upstream processes outside foreground measurements."
      source_ids:
        - fao-who-cxc-58-2005-meat-hygiene
    - rule_id: sb_foreground_scope
      applies_to: "slaughterhouse foreground"
      rule: "Include slaughter/evisceration, red-offal separation, liver trimming, potable-water washing, forced-air chilling and cold holding, packaging, sanitation, waste handling and transfer of wastewater to off-site treatment."
      source_ids:
        - fao-who-cxc-58-2005-meat-hygiene
        - fao-slaughter-meat-processing-guidelines
        - fao-small-ruminant-slaughter-manual
    - rule_id: sb_temperature_gate
      applies_to: "product release"
      rule: "Release only liver with a measured core temperature of 0–3 °C; maintain the cold chain and exclude any frozen lot."
      source_ids:
        - eu-ec-853-2004-meat-hygiene
    - rule_id: sb_wastewater_route
      applies_to: "wastewater"
      rule: "Model the locked off-site-treatment route: record carrier volume and each listed pollutant load separately at the facility sewer boundary; do not also model a direct elementary discharge."
      source_ids:
        - ifc-2007-meat-processing-ehs
    - rule_id: sb_exclusions
      applies_to: "downstream stages"
      rule: "Exclude distribution after the factory gate, retail, cooking, consumption, packaging end-of-life and off-site wastewater treatment beyond the transfer boundary."
      source_ids: []
