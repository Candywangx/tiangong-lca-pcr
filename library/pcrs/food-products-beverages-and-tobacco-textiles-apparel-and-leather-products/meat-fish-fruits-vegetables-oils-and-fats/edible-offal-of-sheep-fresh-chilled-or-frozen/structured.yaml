        []
allocation_rules:
  - rule_id: alloc_subdivide_direct_operations
    applies_to: "liver_washing; air_chilling_cold_holding; primary_packaging"
    rule: "Attribute metered post-separation liver operations directly to liver; do not dilute these burdens across carcass, skin or other organs."
    source_ids:
      - bamber-et-al-2026-allocation-review
  - rule_id: alloc_joint_block_definition
    applies_to: "slaughter_evisceration; liver_separation_trimming"
    rule: "Treat slaughter through completion of organ separation as one joint-production block when its shared inputs cannot be subdivided; retain separate measured masses and destinations for carcass, liver, heart, lungs, trachea, sheepskin and recovered blood."
    source_ids:
      - le-feon-2020-meat-coproduct-allocation
  - rule_id: alloc_primary_economic
    applies_to: "joint-production block"
    rule: "Apply calc_economic_allocation using contemporaneous net ex-works revenue for every marketable output at the common separation gate. Waste and legally condemned material receive no co-product share; their handling burden remains with the joint block."
    source_ids:
      - eu-pef-2013-allocation-hierarchy
      - le-feon-2020-meat-coproduct-allocation
  - rule_id: alloc_price_evidence
    applies_to: "co-product price ledger"
    rule: "Use invoiced net prices and saleable masses for the same reporting period, currency and gate; disclose zero-price, internal-transfer and missing-price treatment. Do not infer a liver price from another organ."
    source_ids:
      - eu-pef-2013-allocation-hierarchy
  - rule_id: alloc_economic_sensitivity
    applies_to: "liver allocation result"
    rule: "Recalculate the liver share using every observed monthly net price in the reporting period and report the minimum, maximum and mass-weighted base result; if fewer than 12 months exist, report all observed months and the evidence gap without inventing prices."
    source_ids:
      - le-feon-2020-meat-coproduct-allocation
      - bamber-et-al-2026-allocation-review
  - rule_id: alloc_method_sensitivity
    applies_to: "liver allocation result"
    rule: "Also report mass-based allocation across marketable outputs and, only when tissue-growth data support it, a biophysical allocation result; keep these as sensitivity scenarios and do not merge them with the primary economic result."
    source_ids:
      - le-feon-2020-meat-coproduct-allocation
      - bamber-et-al-2026-allocation-review
dataset_production:
  collection_protocols:
    - protocol_id: cp_slaughter_mass_outputs
      process_id: "slaughter_evisceration"
      flow_role: "live sheep and joint-product masses"
      record_type: "receiving, scale and dispatch records"
      raw_fields: "batch_id; slaughter_date; live_weight_kg; carcass_mass_kg; pluck_mass_kg; sheepskin_mass_kg; recovered_blood_mass_kg; scale_id; weighing_state"
      collection_method: "calibrated scales linked by slaughter batch"
      unit: "kg"
      frequency: "every slaughter batch"
      temporal_coverage: "complete reporting period"
      site_scope: "target slaughterhouse"
      aggregation_rule: "sum each atomic output by row_id; preserve batch links"
      quality_evidence: "calibration certificates; receiving tickets; dispatch records; reconciliation sign-off"
    - protocol_id: cp_slaughter_utilities
      process_id: "slaughter_evisceration"
      flow_role: "water, electricity and purchased hot water"
      record_type: "meter records"
      raw_fields: "timestamp; meter_id; potable_water_m3; grid_electricity_kWh; hot_water_energy_MJ; hot_water_volume_m3; supply_temperature_C; return_temperature_C; allocation_driver"
      collection_method: "dedicated meters; documented meter allocation only when no sub-meter exists"
      unit: "m3; kWh; MJ; °C"
      frequency: "daily or finer"
      temporal_coverage: "complete reporting period"
      site_scope: "slaughter and evisceration line"
      aggregation_rule: "sum readings by utility; subtract verified non-route loads"
      quality_evidence: "meter calibration; invoices; allocation worksheet"
    - protocol_id: cp_slaughter_wastes
      process_id: "slaughter_evisceration"
      flow_role: "paunch contents and inedible trim"
      record_type: "waste container and consignment records"
      raw_fields: "date; batch_id; waste_row_id; gross_mass_kg; tare_mass_kg; destination; manifest_id"
      collection_method: "calibrated container scale and waste consignment record"
      unit: "kg"
      frequency: "every consignment"
      temporal_coverage: "complete reporting period"
      site_scope: "slaughter floor"
      aggregation_rule: "sum net mass separately by row_id and destination"
      quality_evidence: "scale checks; waste manifests; contractor receipts"
    - protocol_id: cp_slaughter_wastewater
      process_id: "slaughter_evisceration"
      flow_role: "wastewater carrier and pollutant loads"
      record_type: "flow meter and laboratory records"
      raw_fields: "sample_id; start_time; end_time; wastewater_volume_m3; COD_mg_L; TN_mg_L; TP_mg_L; TSS_mg_L; oil_grease_mg_L; laboratory_method; sewer_destination"
      collection_method: "flow-proportional composite sampling matched to effluent volume"
      unit: "m3; mg/L"
      frequency: "representative composite per production day or permit frequency, whichever is stricter"
      temporal_coverage: "complete reporting period"
      site_scope: "slaughter wastewater substream before sewer mixing"
      aggregation_rule: "calculate each pollutant with calc_wastewater_pollutant_load; volume-weight across samples"
      quality_evidence: "accredited laboratory reports; meter calibration; chain of custody"
    - protocol_id: cp_separation_outputs
      process_id: "liver_separation_trimming"
      flow_role: "pluck input, tissue outputs, trim, rejection and electricity"
      record_type: "batch scale, disposition and meter records"
      raw_fields: "batch_id; pluck_input_kg; trimmed_liver_kg; heart_kg; lungs_kg; trachea_kg; inedible_trim_kg; rejected_liver_kg; rejection_reason; destination; electricity_kWh"
      collection_method: "calibrated scales, veterinary disposition records and sub-meter"
      unit: "kg; kWh"
      frequency: "every batch; electricity daily or finer"
      temporal_coverage: "complete reporting period"
      site_scope: "red-offal separation line"
      aggregation_rule: "sum each atomic row_id; reconcile tissue outputs and wastes to pluck input"
      quality_evidence: "scale calibration; inspection record; signed mass-balance review"
    - protocol_id: cp_washing_mass_water
      process_id: "liver_washing"
      flow_role: "liver mass, potable water and electricity"
      record_type: "batch scale and meter records"
      raw_fields: "batch_id; trimmed_liver_input_kg; washed_liver_drained_kg; drip_time_min; potable_water_m3; electricity_kWh; meter_id"
      collection_method: "calibrated scales and dedicated meters"
      unit: "kg; min; m3; kWh"
      frequency: "every batch; meters daily or finer"
      temporal_coverage: "complete reporting period"
      site_scope: "liver washing line"
      aggregation_rule: "sum by row_id; preserve batch transfer equality"
      quality_evidence: "calibration records; potable-water compliance record; batch sheet"
    - protocol_id: cp_washing_wastewater
      process_id: "liver_washing"
      flow_role: "washing wastewater and pollutant loads"
      record_type: "flow meter and laboratory records"
      raw_fields: "sample_id; start_time; end_time; wastewater_volume_m3; COD_mg_L; TN_mg_L; TP_mg_L; TSS_mg_L; oil_grease_mg_L; laboratory_method; sewer_destination"
      collection_method: "flow-proportional composite sampling matched to washing volume"
      unit: "m3; mg/L"
      frequency: "representative composite per production day or permit frequency, whichever is stricter"
      temporal_coverage: "complete reporting period"
      site_scope: "liver washing substream before sewer mixing"
      aggregation_rule: "calculate each pollutant with calc_wastewater_pollutant_load; volume-weight across samples"
      quality_evidence: "accredited laboratory reports; meter calibration; chain of custody"
    - protocol_id: cp_chilling_energy_temperature
      process_id: "air_chilling_cold_holding"
      flow_role: "liver mass, electricity, temperature and holding time"
      record_type: "batch, sub-meter and temperature logger records"
      raw_fields: "lot_id; washed_liver_input_kg; chilled_liver_output_kg; chamber_id; entry_time; release_time; holding_hours; core_temperature_C; air_temperature_C; electricity_kWh; freezing_deviation"
      collection_method: "calibrated core probes, continuous air logger and refrigeration sub-meter"
      unit: "kg; h; °C; kWh"
      frequency: "every lot; continuous temperature"
      temporal_coverage: "complete reporting period"
      site_scope: "R717 liver chilling chamber"
      aggregation_rule: "accept only lots with all release core readings 0–3 °C and no freezing; sum route electricity"
      quality_evidence: "probe calibration; logger audit trail; sub-meter calibration; deviation log"
    - protocol_id: cp_refrigerant_inventory
      process_id: "air_chilling_cold_holding"
      flow_role: "R717 replenishment and air loss"
      record_type: "refrigerant inventory and service records"
      raw_fields: "period_start; opening_charge_kg; purchases_kg; transfers_in_kg; closing_charge_kg; recovered_kg; returned_kg; transfers_out_kg; service_event; total_refrigeration_kWh; liver_route_refrigeration_kWh"
      collection_method: "closed annual refrigerant mass balance reconciled to service invoices"
      unit: "kg; kWh"
      frequency: "every service event and annual close"
      temporal_coverage: "same reporting period as product dataset"
      site_scope: "central R717 system and liver-route allocation"
      aggregation_rule: "calculate total loss with calc_refrigerant_loss; allocate by metered refrigeration electricity share"
      quality_evidence: "technician records; purchase invoices; recovery receipts; signed balance"
    - protocol_id: cp_packaging_materials
      process_id: "primary_packaging"
      flow_role: "chilled liver, LDPE and fibreboard"
      record_type: "batch and material inventory records"
      raw_fields: "lot_id; chilled_liver_input_kg; packaged_net_liver_kg; material_row_id; opening_stock_kg; receipts_kg; closing_stock_kg; returned_stock_kg; trim_waste_kg"
      collection_method: "calibrated product scale and material inventory reconciliation"
      unit: "kg"
      frequency: "every lot; material inventory monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "liver packaging line"
      aggregation_rule: "calculate consumption separately by material row_id; exclude packaging tare from reference mass"
      quality_evidence: "scale calibration; purchase invoices; stock count; reconciliation worksheet"
    - protocol_id: cp_packaging_energy
      process_id: "primary_packaging"
      flow_role: "packaging electricity"
      record_type: "meter or equipment-runtime records"
      raw_fields: "date; meter_id; electricity_kWh; equipment_id; rated_power_kW; runtime_h; allocation_driver"
      collection_method: "line sub-meter; runtime calculation only if sub-meter unavailable"
      unit: "kWh; kW; h"
      frequency: "daily or finer"
      temporal_coverage: "complete reporting period"
      site_scope: "liver packaging line"
      aggregation_rule: "sum sub-meter; otherwise sum rated_power_kW * runtime_h with disclosed load factor from measured evidence"
      quality_evidence: "meter check; equipment log; calculation review"
    - protocol_id: cp_packaging_waste
      process_id: "primary_packaging"
      flow_role: "LDPE and fibreboard waste"
      record_type: "waste-bin and consignment records"
      raw_fields: "date; waste_row_id; gross_mass_kg; tare_mass_kg; destination; manifest_id"
      collection_method: "dedicated labelled bins and calibrated scale"
      unit: "kg"
      frequency: "every waste removal"
      temporal_coverage: "complete reporting period"
      site_scope: "liver packaging line"
      aggregation_rule: "sum net mass separately by material row_id"
      quality_evidence: "scale check; waste manifest; bin labelling audit"
    - protocol_id: cp_sanitation_inputs
      process_id: "equipment_sanitation"
      flow_role: "water, hot water, electricity, detergent and disinfectant"
      record_type: "sanitation event, meter and chemical issue records"
      raw_fields: "event_id; start_time; end_time; potable_water_m3; hot_water_energy_MJ; hot_water_volume_m3; supply_temperature_C; return_temperature_C; electricity_kWh; detergent_solution_kg; detergent_NaOH_mass_fraction; hypochlorite_solution_kg; available_chlorine_mass_fraction; covered_area"
      collection_method: "event-level meters and reconciled chemical issue records"
      unit: "m3; MJ; °C; kWh; kg solution; mass fraction"
      frequency: "every sanitation event"
      temporal_coverage: "complete reporting period"
      site_scope: "all route equipment and rooms"
      aggregation_rule: "sum each atomic input; retain concentration and covered-area evidence"
      quality_evidence: "sanitation log; meter calibration; supplier certificate; stock reconciliation"
    - protocol_id: cp_sanitation_wastewater
      process_id: "equipment_sanitation"
      flow_role: "sanitation wastewater and pollutant loads"
      record_type: "flow meter and laboratory records"
      raw_fields: "sample_id; start_time; end_time; wastewater_volume_m3; COD_mg_L; TN_mg_L; TP_mg_L; TSS_mg_L; oil_grease_mg_L; residual_chlorine_mg_L; laboratory_method; sewer_destination"
      collection_method: "flow-proportional composite sampling matched to sanitation volume; grab sample for residual chlorine when method requires"
      unit: "m3; mg/L"
      frequency: "representative sample per sanitation regime and permit frequency, whichever is stricter"
      temporal_coverage: "complete reporting period"
      site_scope: "sanitation substream before sewer mixing"
      aggregation_rule: "calculate each pollutant with calc_wastewater_pollutant_load; volume-weight across samples"
      quality_evidence: "accredited laboratory reports; meter calibration; chain of custody"
    - protocol_id: cp_coproduct_prices
      process_id: "slaughter_evisceration"
      flow_role: "economic allocation evidence"
      record_type: "sales invoice and internal transfer ledger"
      raw_fields: "month; product_row_id; saleable_mass_kg; gross_revenue; rebates; transport_after_gate; net_exworks_revenue; currency; exchange_rate; invoice_id; zero_price_reason"
      collection_method: "invoice reconciliation at common separation gate; no cross-organ price proxy"
      unit: "kg; currency"
      frequency: "every sale; monthly close"
      temporal_coverage: "same reporting period, normally 12 consecutive months"
      site_scope: "all marketable outputs of the joint-production block"
      aggregation_rule: "mass-weighted net price by product_row_id; preserve every observed monthly price for sensitivity"
      quality_evidence: "invoices; audited ledger; exchange-rate source; signed zero-price review"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "all inventory rows"
      rule: "normalized_amount = period_amount / packaged_net_liver_kg * 1000"
      inputs:
        - period_amount
        - packaged_net_liver_kg
      output: "amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_hot_water_energy
      applies_to: "purchased hot water"
      rule: "hot_water_energy_MJ = water_mass_kg * specific_heat_MJ_per_kgK * (supply_temperature_C - return_temperature_C)"
      inputs:
        - hot_water_volume_m3
        - "measured density"
        - supply_temperature_C
        - return_temperature_C
        - "accepted specific heat"
      output: "MJ delivered thermal energy"
      source_ids: []
    - id: calc_wastewater_pollutant_load
      applies_to: "each wastewater pollutant row"
      rule: "pollutant_load_kg = wastewater_volume_m3 * concentration_mg_L / 1000"
      inputs:
        - "matched wastewater_volume_m3"
        - "pollutant-specific concentration_mg_L"
      output: "kg pollutant transferred to off-site treatment"
      source_ids:
        - ifc-2007-meat-processing-ehs
    - id: calc_refrigerant_loss
      applies_to: "R717 input and air output"
      rule: "refrigerant_loss_kg = opening_charge_kg + purchases_kg + transfers_in_kg - closing_charge_kg - recovered_kg - returned_kg - transfers_out_kg; liver_route_loss_kg = refrigerant_loss_kg * liver_route_refrigeration_kWh / total_refrigeration_kWh"
      inputs:
        - "closed refrigerant inventory"
        - "liver-route and total refrigeration electricity"
      output: "kg R717 replenishment and kg NH3 to air assigned to liver route"
      source_ids: []
    - id: calc_joint_mass_balance
      applies_to: "slaughter and separation joint block"
      rule: "mass_balance_gap_kg = live_weight_kg - sum(all measured product and waste output masses) - measured_evaporation_or_untracked_liquid_kg"
      inputs:
        - "every atomic mass output"
        - live_weight_kg
        - "disclosed untracked liquid or evaporation term"
      output: "kg and percent mass-balance gap"
      source_ids: []
    - id: calc_liver_yield
      applies_to: "liver route"
      rule: "liver_yield = packaged_net_liver_kg / live_weight_kg"
      inputs:
        - packaged_net_liver_kg
        - live_weight_kg
      output: "kg packaged chilled liver per kg live sheep"
      source_ids: []
    - id: calc_economic_allocation
      applies_to: "joint-production block"
      rule: "AF_i = max(net_exworks_revenue_i, 0) / sum_j(max(net_exworks_revenue_j, 0)); net_exworks_revenue_i = saleable_mass_i * net_exworks_price_i"
      inputs:
        - "saleable mass and contemporaneous net ex-works price for each marketable product_row_id"
      output: "allocation fraction for each marketable output"
      source_ids:
        - eu-pef-2013-allocation-hierarchy
        - le-feon-2020-meat-coproduct-allocation
    - id: calc_liver_joint_burden
      applies_to: "chilled sheep liver"
      rule: "liver_joint_burden = AF_liver * total_joint_block_burden; add direct post-separation liver burdens without allocation"
      inputs:
        - AF_liver
        - "joint block inventory and impacts"
        - "direct liver operations"
      output: "allocated upstream and slaughter burden plus direct liver burden"
      source_ids:
        - le-feon-2020-meat-coproduct-allocation
    - id: calc_economic_sensitivity
      applies_to: "liver allocation"
      rule: "recompute AF_liver for each observed monthly price vector; report base mass-weighted AF_liver, minimum AF_liver and maximum AF_liver with the associated month and price vector"
      inputs:
        - "monthly cp_coproduct_prices records"
      output: "reproducible economic-allocation sensitivity interval"
      source_ids:
        - le-feon-2020-meat-coproduct-allocation
        - bamber-et-al-2026-allocation-review
    - id: calc_mass_allocation_sensitivity
      applies_to: "joint-production block"
      rule: "mass_AF_i = saleable_mass_i / sum_j(saleable_mass_j) for the same marketable-output set"
      inputs:
        - "saleable mass by product_row_id"
      output: "mass-allocation sensitivity result"
      source_ids:
        - le-feon-2020-meat-coproduct-allocation
  data_quality_requirements:
    - id: dq_route_identity
      applies_to: "full dataset"
      requirement: "Dataset metadata must declare sheep liver, chilled 0–3 °C, never frozen, forced-air R717 refrigeration, LDPE plus fibreboard packaging and off-site wastewater treatment."
      evidence: "lot specification; process map; signed route declaration"
    - id: dq_temporal_match
      applies_to: "all records"
      requirement: "Product, utilities, wastes, wastewater, refrigerant inventory and price evidence must cover the same reporting period; disclose any justified gap."
      evidence: "date-range reconciliation"
    - id: dq_mass_traceability
      applies_to: "slaughter through packaging"
      requirement: "Preserve batch or lot links through every intermediate liver row and reconcile all joint outputs by atomic row_id."
      evidence: "batch ledger; calc_joint_mass_balance review"
    - id: dq_meter_quality
      applies_to: "utilities and wastewater"
      requirement: "Use calibrated meters; disclose estimation only when a named meter is unavailable and retain the allocation worksheet."
      evidence: "calibration certificate; meter register; worksheet"
    - id: dq_temperature_quality
      applies_to: "chilled liver"
      requirement: "Use calibrated core probes and continuous chamber logs; retain every deviation and disposition."
      evidence: "logger file; probe certificate; release record"
    - id: dq_water_hygiene
      applies_to: "washing and sanitation"
      requirement: "Potable-water status and cleaning/disinfection records must be valid for the reporting period."
      evidence: "potable-water certificate; sanitation verification"
    - id: dq_pollutant_sampling
      applies_to: "wastewater"
      requirement: "Match concentration samples to volume and operating regime; do not use permit limits as measured concentrations."
      evidence: "chain of custody; accredited laboratory report; sampling plan"
    - id: dq_price_audit
      applies_to: "allocation"
      requirement: "Prices must be organ-specific, contemporaneous, net ex-works and invoice-reconciled; retain all months used in sensitivity."
      evidence: "invoice ledger; monthly price vector; audit sign-off"
    - id: dq_no_default_amounts
      applies_to: "all non-reference rows"
      requirement: "Missing quantities remain explicit evidence gaps; they must not be filled with generic PCR defaults."
      evidence: "completeness register keyed by row_id"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "Require the exact Tiangong UUID, Mass property UUID, 1,000 kg net amount and all required qualifiers."
    source_ids: []
  - rule_id: val_single_tissue_state
    applies_to: "product identity"
    rule: "Reject organ averaging, mixed-offal reference products, fresh liver, frozen liver or any lot with freezing history."
    source_ids: []
  - rule_id: val_process_completion
    applies_to: "process map"
    rule: "Require all six processes in the declared order and a detailed section for every process_id."
    source_ids: []
  - rule_id: val_atomic_rows
    applies_to: "process inventory"
    rule: "Require one card per actual material, utility, chemical, refrigerant, packaging material, co-product, waste, wastewater pollutant and air emission; reject aggregate cards such as energy, materials, chemicals, packaging, wastes or emissions."
    source_ids: []
  - rule_id: val_uuid_policy
    applies_to: "flow identity"
    rule: "Permit a flow UUID only on packaged_chilled_sheep_liver; require every other atomic flow UUID to remain blank pending separate reviewed identity selection."
    source_ids: []
  - rule_id: val_transfer_equality
    applies_to: "intermediate liver and pluck rows"
    rule: "Require batch-linked output/input equality at every adjacent process transfer; differences must be represented as a named product or waste row, not hidden loss."
    source_ids: []
  - rule_id: val_mass_balance
    applies_to: "joint-production block"
    rule: "Calculate and disclose the mass-balance gap and every included term; unexplained differences make completeness inconclusive."
    source_ids: []
  - rule_id: val_temperature
    applies_to: "product release"
    rule: "Reject lots without calibrated core readings or with any release reading below 0 °C or above 3 °C; retain evidence that product never froze."
    source_ids:
      - eu-ec-853-2004-meat-hygiene
  - rule_id: val_refrigerant_balance
    applies_to: "R717 system"
    rule: "Require a closed inventory and equality of allocated R717 replenishment input and ammonia-to-air loss unless documented recovery, return or transfer terms explain the difference."
    source_ids: []
  - rule_id: val_wastewater_no_double_count
    applies_to: "wastewater"
    rule: "Require carrier volume and each pollutant load as separate rows; because wastewater is transferred off site, reject simultaneous direct-to-water elementary emissions for the same load."
    source_ids:
      - ifc-2007-meat-processing-ehs
  - rule_id: val_allocation_ledger
    applies_to: "joint-production block"
    rule: "Require masses, destinations and price records for carcass, liver, heart, lungs, trachea, sheepskin and recovered blood, plus explicit treatment of zero-price and waste outputs."
    source_ids:
      - le-feon-2020-meat-coproduct-allocation
  - rule_id: val_allocation_sensitivity
    applies_to: "liver burden"
    rule: "Require reproducible monthly economic sensitivity and mass-allocation sensitivity; do not accept a single undocumented economic fraction."
    source_ids:
      - le-feon-2020-meat-coproduct-allocation
      - bamber-et-al-2026-allocation-review
  - rule_id: val_foreground_amounts
    applies_to: "non-reference amounts"
    rule: "Require foreground_record or calculated_value, its collection protocol, and reporting-period evidence; reject uncited generic defaults."
    source_ids: []
  - rule_id: val_bilingual_structure
    applies_to: "PCR source"
    rule: "Require identical ordered process_id, row_id, controlled token, formula, numeric value, UUID, URL, source_id and collection-protocol field sequences in en-US and zh-CN."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; eligible as background_dataset only after independent methodology and data-quality review"
  downstream_use: "Foreground data packages and downstream process or lifecyclemodel projections for packaged chilled sheep liver at the processing-facility gate"
  allowed_use: "Studies whose species, tissue, chilled state, integrated slaughter route, refrigeration, packaging, wastewater boundary, geography and period are demonstrably representative"
  excluded_use: "Other organs; mixed offal; fresh or frozen liver; goat offal; cooked products; retail or consumption stages; facilities using materially different refrigeration or wastewater routes without adaptation"
  required_metadata: "all required qualifiers; site and period; live-sheep origin; process map; meter coverage; inspection regime; temperature evidence; package specification; wastewater destination; R717 balance; allocation ledger and sensitivities"
