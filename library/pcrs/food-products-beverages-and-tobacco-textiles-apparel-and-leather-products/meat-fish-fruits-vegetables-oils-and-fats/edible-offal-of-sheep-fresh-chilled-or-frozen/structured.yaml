            specificity: "site_specific"
            basis:
              text: "per 1,000 kg packaged chilled sheep liver"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_sanitation_wastewater
              source_ids:
                - ifc-2007-meat-processing-ehs
            ranges: []
        - row_id: sanitation_wastewater_residual_chlorine
          role: "Total residual chlorine in sanitation wastewater"
          name: "Total residual chlorine in sanitation wastewater"
          flow_type: "waste"
          property_unit: "Mass / kg as Cl2"
          description: "Record total residual chlorine separately because the locked route uses sodium hypochlorite."
          amount:
            expression: "calc_wastewater_pollutant_load using matched volume and total-residual-chlorine concentration records"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1,000 kg packaged chilled sheep liver"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
