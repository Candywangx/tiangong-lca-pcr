allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "separable rendering, refining, utility, and treatment operations"
    rule: "First use direct metering, batch segregation, or process subdivision to assign inputs and outputs to rendered poultry fat and other products; retain only directly attributable inventory where subdivision is feasible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relationship
    applies_to: "shared processes that cannot be subdivided or expanded"
    rule: "If subdivision or system expansion is not feasible, use a relevant and quantifiable physical relationship that reflects how shared inputs and emissions relate to the outputs. Do not default to mass merely because mass data are available; justify the selected relationship."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relationship
    applies_to: "multifunctionality without a defensible physical relationship"
    rule: "Use another relationship, such as economic allocation at the point and conditions where co-products arise, only after documenting why subdivision, system expansion, and physical allocation are not applicable; report data period, prices, allocation shares, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_upstream_status
    applies_to: "poultry fat-bearing raw material"
    rule: "Preserve the upstream dataset's product, co-product, by-product, residue, or waste status and assigned burden. Do not assign zero upstream burden solely from terminology or local disposal cost."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_output_classification
    applies_to: "proteinaceous solids, recovered material, residues, and energy recovery"
    rule: "Classify an output as co-product only when it has a documented function and destination. Otherwise model it as waste with the actual treatment route. Avoided-product credits require the chosen study method, evidence of substitution, and separate disclosure."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_and_identity
      process_id: "raw_material_receipt_preparation_rendering_fat_separation_additional_refining_finishing_storage_dispatch"
      flow_role: "received raw material, internal transfers, product, co-products, rejects, residues, losses"
      record_type: "weighbridge, scale, tank-level, batch, dispatch, supplier, and laboratory records"
      raw_fields: "timestamp; batch; supplier; poultry species; material description; prior processing; preservation state; upstream status; gross; tare; net mass; internal transfer; product state; destination"
      collection_method: "Calibrated mass measurement reconciled to batch and inventory changes; use tank-volume conversion only with measured density and temperature"
      unit: "kg"
      frequency: "Each receipt, batch, transfer, and dispatch"
      temporal_coverage: "Representative continuous period, normally at least 12 months; shorter campaigns disclosed"
      site_scope: "Every included rendering and finishing site"
      aggregation_rule: "Sum net masses by homogeneous route and period; reconcile opening/closing stock; normalize to conforming product mass"
      quality_evidence: "Calibration records, weigh tickets, batch sheets, stock reconciliation, supplier declarations, and product test records"
    - protocol_id: cp_energy_records
      process_id: "raw_material_receipt_preparation_rendering_fat_separation_finishing_storage_dispatch"
      flow_role: "electricity, fuels, steam, purchased heat, recovered energy"
      record_type: "submeter, main meter, fuel invoice, steam/heat meter, and energy-recovery records"
      raw_fields: "meter id; reading time; carrier; quantity; unit; calorific value or conversion factor; process assignment; recovered energy; operating hours"
      collection_method: "Prefer process submeters; otherwise allocate shared meters using documented operating data and disclose the basis"
      unit: "Original unit and kWh"
      frequency: "At least monthly, with batch or shift records where available"
      temporal_coverage: "Same period as product mass; seasonal coverage required"
      site_scope: "Every included site and utility system"
      aggregation_rule: "Convert carriers separately to kWh; sum consumed heat and electricity; subtract only documented recovered energy consistent with the net-energy definition"
      quality_evidence: "Meter calibration, invoices, conversion-factor source, allocation worksheet, and energy balance"
    - protocol_id: cp_water_and_wastewater_records
      process_id: "rendering_fat_separation_additional_refining_finishing_storage_dispatch"
      flow_role: "water withdrawal, supplied water, reused water, and waste-water discharge"
      record_type: "water and effluent meters, treatment records, and sampling logs"
      raw_fields: "source; meter id; volume; reuse loop; discharge point; destination; flow; pH; temperature; COD/TOC; nitrogen; phosphorus; sampling time"
      collection_method: "Meter volumes at key points and sample relevant quality parameters for identified streams"
      unit: "m3 and parameter-specific units"
      frequency: "Continuous or batch volume totals; quality frequency appropriate to permit and process variability"
      temporal_coverage: "Same period as product mass, including cleaning and abnormal events"
      site_scope: "Every included site, water source, and discharge route"
      aggregation_rule: "Report gross withdrawal, supplied water, reuse, and discharge separately; calculate intensity per kg raw material and per kg reference product"
      quality_evidence: "Meter calibration, laboratory reports, discharge records, treatment logs, and water balance"
    - protocol_id: cp_waste_gas_monitoring
      process_id: "rendering_fat_separation"
      flow_role: "TVOC, NH3, H2S, odour, gas flow, temperature, and abatement"
      record_type: "stack test, continuous or periodic monitoring, operating log, and abatement record"
      raw_fields: "emission point; pollutant; concentration; standard conditions; gas flow; temperature; moisture; oxygen correction; operating time; production; abatement state; abnormal operation"
      collection_method: "Use applicable recognized methods and match concentration, gas flow, and operating time at representative conditions"
      unit: "mg/Nm3, Nm3/h, h, and kg"
      frequency: "Legal or BAT-consistent frequency plus representative operating-condition coverage"
      temporal_coverage: "Same production period, including identified abnormal operation"
      site_scope: "Every relevant emission point at included sites"
      aggregation_rule: "Calculate pollutant mass by matched concentration and standardized gas volume; aggregate points and normalize to product mass"
      quality_evidence: "Laboratory accreditation, method reference, calibration, raw stack-test report, flow record, and operating log"
    - protocol_id: cp_refining_input_records
      process_id: "additional_refining"
      flow_role: "energy, water, steam, adsorbents, filter media, non-incorporated process aids, residues, and waste water"
      record_type: "batch recipe, dosing meter, inventory, purchase, utility, classification-review, and waste records"
      raw_fields: "operation; batch; input identity; quantity; concentration; recycled share; output identity; physical treatment state; chemical-modification confirmation; CPC decision; residue; waste-water volume; destination"
      collection_method: "Record each actual physical-refining flow separately, reconcile material entering and leaving, and stop CPC 21522 production if chemical modification occurs or classification is not confirmed"
      unit: "Carrier-appropriate unit"
      frequency: "Each batch or production campaign"
      temporal_coverage: "All included physical-refining or deodorization campaigns in the reporting period"
      site_scope: "Each included physical-refining line"
      aggregation_rule: "Sum by flow and route, reconcile stock, and normalize only confirmed CPC 21522 final product mass"
      quality_evidence: "Dosing calibration, batch sheet, certificate, invoice, stock reconciliation, classification decision, and waste manifest"
    - protocol_id: cp_packaging_records
      process_id: "finishing_storage_dispatch"
      flow_role: "primary, secondary, tertiary, and reusable packaging"
      record_type: "bill of materials, purchase, packing, return, and dispatch records"
      raw_fields: "component; material; unit mass; units used; product mass; recycled content claim; return rate; reuse cycles; disposal responsibility"
      collection_method: "Weigh representative components and reconcile to packed dispatch quantities"
      unit: "kg"
      frequency: "Each packaging specification and monthly reconciliation"
      temporal_coverage: "Same period as packaged output"
      site_scope: "Each included dispatch site"
      aggregation_rule: "Calculate packaging mass per kg packed product; report zero for verified bulk unpackaged output"
      quality_evidence: "Packaging specifications, scale records, purchase/dispatch reconciliation, and return records"
    - protocol_id: cp_refrigerant_records
      process_id: "raw_material_receipt_preparation_finishing_storage_dispatch"
      flow_role: "refrigerant leakage"
      record_type: "equipment inventory, recharge, recovery, maintenance, and leak-detection records"
      raw_fields: "refrigerant; equipment; opening charge; additions; recovered quantity; closing charge; event; date"
      collection_method: "Mass balance by refrigerant and equipment, supplemented by direct leak detection where available"
      unit: "kg"
      frequency: "Each service event and annual reconciliation"
      temporal_coverage: "Reporting period and rolling history where available"
      site_scope: "All refrigeration equipment serving included operations"
      aggregation_rule: "Additions minus documented recovery and inventory increase; normalize by product mass"
      quality_evidence: "Service invoices, cylinder weights, leak alarms, equipment register, and reconciliation worksheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory exchanges"
      rule: "normalized exchange = period exchange × 1 kg / net conforming rendered poultry fat dispatched in the same allocation period"
      inputs:
        - "period exchange"
        - "conforming product mass"
        - "stock changes"
        - "allocation share"
      output: "exchange per 1 kg rendered poultry fat"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "each process and the whole foreground system"
      rule: "Reconcile measured input mass with product, co-products, wastes, waste water where mass is available, stock change, and quantified losses. Investigate differences exceeding the facility's documented measurement uncertainty; do not insert an unmeasured balancing flow without disclosure."
      inputs:
        - "input masses"
        - "output masses"
        - "stock change"
        - "water content where used"
        - "measurement uncertainty"
      output: "mass-balance closure and unresolved difference"
      source_ids: []
    - id: calc_net_energy_intensity
      applies_to: "rendering and fat-melting installation"
      rule: "final net energy intensity = (consumed heat + electricity - recovered energy) / raw material processed. For facilities within the source applicability, compare the annual result with 0.12-0.91 kWh/kg raw material; the range covers the combined rendering, fat-melting, blood, and feather process group and is a QA screen, not a poultry-specific default."
      inputs:
        - "carrier-specific energy records"
        - "recovered energy"
        - "raw material mass"
      output: "kWh/kg raw material and per-reference-product conversion"
      source_ids:
        - eu-sa-bat-2023-2749
    - id: calc_wastewater_intensity
      applies_to: "rendering and fat-melting installation"
      rule: "waste-water intensity = annual discharged waste-water volume / annual raw material processed. For facilities within the source applicability, compare with 0.0002-0.00155 m3/kg raw material and disclose differences in scope or process mix."
      inputs:
        - "discharged waste-water volume"
        - "raw material mass"
      output: "m3/kg raw material and per-reference-product conversion"
      source_ids:
        - eu-sa-bat-2023-2749
    - id: calc_channelled_air_emission
      applies_to: "each monitored emission point and pollutant"
      rule: "emitted mass = corrected concentration × standardized dry gas volume over the matching operating period, with unit conversion; sum relevant points and normalize to reference product mass. Keep odour concentration as additional information rather than an LCI mass flow."
      inputs:
        - concentration
        - "gas flow"
        - "operating time"
        - "correction basis"
        - "product mass"
      output: "kg pollutant/kg reference product"
      source_ids:
        - eu-sa-bat-2023-2749
    - id: calc_allocation_shares
      applies_to: "shared multifunctional operations"
      rule: "Apply the declared hierarchy: subdivision or system expansion first, then a relevant physical relationship, then another justified relationship. Allocation shares shall sum to one for the allocated inventory and use data from the co-production point and reporting period."
      inputs:
        - "direct metering"
        - "output quantities"
        - "physical relationship data"
        - "co-product values"
        - "selected method"
      output: "allocated exchange quantities and allocation shares"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and raw material"
      requirement: "Confirm poultry origin and distinguish unrendered input from rendered output. Confirm that no hydrogenation, inter-esterification, re-esterification, elaidinization, or other classification-changing chemical modification occurred. For a separately marketed physical fraction or additive-containing mixture, retain the fresh CPC classification decision. Declare species mixture, product state, intended market, and actual specification without claiming CXS 211-1999 or CXS 329-2017 conformance."
      evidence: "Supplier declarations, receiving records, process records, classification decision, product description, and applicable specification"
    - id: dq_reference_measurement
      applies_to: "product mass and normalization"
      requirement: "Use calibrated net-mass measurement, exclude packaging tare, reconcile stock, and match the reporting period used for inputs and outputs."
      evidence: "Calibration certificate, weigh or tank records, dispatch data, and stock reconciliation"
    - id: dq_temporal_representativeness
      applies_to: "foreground activity data"
      requirement: "Cover representative operating conditions and seasonality, normally at least 12 consecutive months. If a shorter campaign is used, disclose dates, reason, and representativeness limits."
      evidence: "Dated meter, batch, purchase, production, and maintenance records"
    - id: dq_process_completeness
      applies_to: "rendering route"
      requirement: "Include all actual foreground steps, utilities, water, treatment, co-products, wastes, and relevant emissions; document omitted flows and show they are immaterial under the chosen study rule."
      evidence: "Process flow diagram, input/output inventory, meter map, waste manifests, and omission assessment"
    - id: dq_source_applicability
      applies_to: "BAT energy, waste-water, and air screens"
      requirement: "Verify installation, process-group, averaging period, denominator, emission-point, and abatement applicability before using a BAT range. Never use a concentration range as an LCI mass quantity."
      evidence: "Applicability memo, calculation worksheet, monitoring report, and source citation"
    - id: dq_allocation_transparency
      applies_to: "multifunctional operations and upstream raw material"
      requirement: "Record the allocation hierarchy step, data, shares, co-product status, price period when relevant, and sensitivity. Preserve rather than overwrite the upstream dataset's assigned burdens."
      evidence: "Allocation worksheet, contracts or price records, mass/energy relationships, upstream metadata, and sensitivity results"
    - id: dq_geographic_technology_fit
      applies_to: "upstream and foreground datasets"
      requirement: "Select energy, water, transport, treatment, and material datasets representative of the actual geography, technology, and period; disclose proxies and substitution triggers."
      evidence: "Dataset metadata, supplier evidence, technology description, and proxy register"
validation_rules:
  - rule_id: validate_rendered_scope
    applies_to: "product identity"
    rule: "Reject the data package if the reference output is unrendered poultry fat or tissue, non-poultry fat, fish oil, marine-mammal oil, used cooking oil, or an inseparable mixed-species fat blend."
    source_ids:
      - unsd-cpc-3-0-exp-notes-2025
      - codex-cxs-329-2017
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require exactly 1 kg after normalization, product-flow UUID d37d81e1-9262-437f-ac04-7a190b4a1756, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg, with every required qualifier present."
    source_ids: []
  - rule_id: validate_route_boundary
    applies_to: "foreground process inventory"
    rule: "Require receipt/preparation, rendering/fat separation, and finishing/storage/dispatch records. Require physical-refining or deodorization records only when that non-chemical operation is included and the final product is confirmed as CPC 21522. Do not extend this PCR through a classification-changing chemical modification."
    source_ids:
      - eu-sa-bat-2023-2749
      - unsd-cpc-3-0-exp-notes-2025
  - rule_id: validate_chemical_modification_exclusion
    applies_to: "final product and production route"
    rule: "Fail CPC 21522 conformance if the final animal fat or fraction is partly or wholly hydrogenated, inter-esterified, re-esterified, elaidinized, or otherwise chemically modified in a classification-changing way. Route the output to CPC 21590 and do not use the CPC 21522 reference-flow UUID for it."
    source_ids:
      - unsd-cpc-3-0-exp-notes-2025
  - rule_id: validate_fraction_mixture_classification
    applies_to: "separately marketed physical fraction or additive-containing mixture"
    rule: "Require a fresh documented CPC classification decision. If CPC 21522 is not explicitly confirmed, or the decision is absent, the output cannot be the reference product under this PCR."
    source_ids:
      - unsd-cpc-3-0-exp-notes-2025
  - rule_id: validate_upstream_linkage
    applies_to: "poultry raw material and purchased inputs"
    rule: "Require an upstream dataset and status/allocation disclosure for each material input. Flag an unexplained zero-burden poultry raw material as non-conforming."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "each foreground process and total system"
    rule: "Require reconciled input, product, co-product, waste, stock-change, and loss masses within documented measurement uncertainty; unresolved differences shall be reported and shall make validation inconclusive rather than silently balanced."
    source_ids: []
  - rule_id: validate_energy_screen
    applies_to: "annual rendering installation energy"
    rule: "Calculate final net energy on the source denominator before comparing with 0.12-0.91 kWh/kg raw material. A result outside the range triggers investigation, not automatic replacement; skip the comparison with an explicit reason when installation or process-group applicability differs."
    source_ids:
      - eu-sa-bat-2023-2749
  - rule_id: validate_wastewater_screen
    applies_to: "annual rendering installation waste water"
    rule: "Calculate 0.0002-0.00155 m3/kg raw material as the applicable official screening range. A result outside it triggers investigation, not substitution; skip with an explicit reason when applicability differs."
    source_ids:
      - eu-sa-bat-2023-2749
  - rule_id: validate_air_emissions
    applies_to: "relevant rendering waste-gas streams"
    rule: "Require TVOC and NH3 relevance assessment and H2S relevance assessment; when monitored, convert concentration and standardized gas flow to mass. Do not enter odour units or mg/Nm3 directly as kg elementary flows."
    source_ids:
      - eu-sa-bat-2023-2749
  - rule_id: validate_allocation
    applies_to: "multifunctional foreground system"
    rule: "Require the allocation hierarchy, selected relationship, shares, co-product/waste status, and sensitivity to be documented. Allocation shares for each allocated inventory block shall sum to one."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_codex_non_extension
    applies_to: "product quality claims"
    rule: "Reject any poultry-fat composition, fatty-acid, quality, or contaminant limit copied from CXS 211-1999 or fish-oil rule copied from CXS 329-2017 unless an independent poultry-applicable source is cited and the scope is explicitly justified."
    source_ids:
      - codex-cxs-211-1999
      - codex-cxs-329-2017
published_dataset_profile:
  dataset_role: "Foreground production dataset for rendered poultry fat at a declared facility gate"
  downstream_use: "secondary_dataset; background_dataset after methodology, representativeness, and review requirements are met"
  allowed_use: "LCA of food, feed, oleochemical, fuel, or other systems that use rendered poultry fat when species, market, product state, boundary, allocation, geography, technology, and period match the study"
  excluded_use: "Unrendered poultry fat; non-poultry or mixed unidentified animal fat; hydrogenated, inter-esterified, re-esterified, elaidinized, or otherwise classification-changing chemically modified animal fat under CPC 21590; separately marketed physical fractions or additive-containing mixtures without a fresh CPC 21522 confirmation; automatic food/feed legal compliance; poultry slaughter dataset; default use of BAT concentration values as LCI amounts"
  required_metadata: "PCR id and version; product and flow UUIDs; poultry species; raw-material identity and upstream status; rendering and optional physical-refining or deodorization technology; product state and intended market; chemical-modification confirmation; classification decision for any separately marketed physical fraction or additive-containing mixture; facility geography; period; reference temperature/physical state; packaging state; system boundary; allocation method and shares; upstream datasets; treatment routes"
  required_quality_disclosure: "Measurement and calibration basis; mass balance; temporal coverage; process completeness; BAT applicability; energy and waste-water intensities; emission calculation methods; allocation sensitivity; proxy datasets; uncertainty; abnormal operations; exclusions and deviations"
  update_trigger: "New poultry-specific official specification or PCR; change in Tiangong identity; rendering or physical-refining technology or boundary change; chemical modification, physical fraction, additive mixture, or CPC classification change; species or market change; material allocation or upstream-status change; new representative foreground evidence; sustained movement outside applicable BAT screens; source revision; reviewer correction"
data_sources:
  - id: "unsd-cpc-3-0-exp-notes-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Explanatory Notes, updated 30 June 2025, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf, retrieved 2026-08-12"
    used_for: "Product identity; rendered-versus-unrendered poultry-fat boundary; CPC 21590 exclusion for hydrogenated, inter-esterified, re-esterified, or elaidinized animal fats; reclassification gate for classification-changing outputs"
  - id: "codex-cxs-211-1999"
    type: "standard"
    reference: "Codex Alimentarius, CXS 211-1999, Standard for Named Animal Fats, amended 2024, https://workspace.fao.org/sites/codex/Standards/CXS%20211-1999/CXS_211e.pdf, retrieved 2026-08-12"
    used_for: "Negative scope comparison only: named pork, bovine, and sheep fats; no poultry composition or quality limits imported"
  - id: "codex-cxs-329-2017"
    type: "standard"
    reference: "Codex Alimentarius, CXS 329-2017, Standard for Fish Oils, amended 2024, https://workspace.fao.org/sites/codex/Standards/CXS%20329-2017/CXS_329e.pdf, retrieved 2026-08-12"
    used_for: "Negative scope comparison only: fish oils are outside this PCR; no fish-oil rules imported"
