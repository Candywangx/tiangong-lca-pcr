product_category_identity:
  canonical_pcr_id: "pcr.food-products-beverages-and-tobacco-textiles-apparel-and-leather-products.meat-fish-fruits-vegetables-oils-and-fats.poultry-fat-rendered"
  classification_refs: "CPC 3.0: 21522, Poultry fat, rendered"
  covered_products: "Fat and grease from poultry that have been rendered and separated; single-poultry-species or declared poultry-species mixtures; crude, filtered, centrifuged, physically refined, or deodorized states only when no chemical modification occurs and CPC 21522 classification is confirmed"
  excluded_products: "Unrendered poultry fat or tissue; fats from non-poultry animals; fish or marine-mammal oils; used cooking oils; inseparable mixed-species animal-fat blends; hydrogenated, inter-esterified, re-esterified, elaidinized, or otherwise classification-changing chemically modified animal fats under CPC 21590; separately marketed physical fractions or additive-containing mixtures without a fresh classification decision confirming CPC 21522"
  representative_product: "Bulk rendered poultry fat at the rendering or finishing facility gate"
  production_route: "Receipt of poultry-origin fat-bearing material; preparation; thermal rendering or equivalent fat release; fat/solids/water separation; clarification; optional non-chemical physical refining or deodorization; cooling, storage, and dispatch"
  market_state: "Bulk liquid, semi-solid, or solid rendered poultry fat at a declared reference temperature; intended market, poultry species, crude/filtered/centrifuged/physically refined/deodorized state, packaging state, applicable quality specification, chemical-modification status, and any required CPC reclassification decision declared"
functional_unit:
  what: "Rendered poultry fat supplied at the reporting facility gate"
  how_much: "1 kg net mass of rendered poultry fat"
  how_well: "Poultry origin confirmed; rendering and separation completed; crude, filtered, centrifuged, physically refined, or deodorized state declared as applicable; no hydrogenation, inter-esterification, re-esterification, elaidinization, or other classification-changing chemical modification; a separately marketed physical fraction or additive-containing mixture accepted only after a fresh classification decision confirms CPC 21522; conformance assessed against the producer's declared market specification rather than CXS 211-1999 or CXS 329-2017"
  how_long_or_cycle: "One production lot at dispatch; no service-life function is assigned"
  reference_flow_link: "poultry_fat_rendered_reference"
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when separately identified poultry-origin fat-bearing raw material is received at the rendering facility. It includes receiving and storage losses, size reduction or preparation, thermal rendering or equivalent fat release, mechanical separation, clarification, internal transfers, cleaning, on-site utilities, emission control, waste-water handling, cooling, product storage, and dispatch preparation. Non-chemical physical refining or deodorization is included only when performed before the declared product gate and classification review confirms that the final product remains CPC 21522. Hydrogenation, inter-esterification, re-esterification, elaidinization, and other classification-changing chemical modification are outside this PCR; the CPC 21522 product gate must be placed before such operations."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary ends with 1 kg of conforming rendered poultry fat at the declared facility gate. Upstream poultry production, slaughtering, and production of the received raw material are represented by linked upstream datasets; they shall not be assumed burden-free merely because the input is called a by-product, co-product, residue, or waste. Downstream distribution, use, further formulation, and end-of-life are excluded unless an expanded study reports them separately."
      source_ids: []
    - rule_id: boundary_rendered_state
      applies_to: "reference product and raw-material entry"
      rule: "The reference product shall have undergone rendering and fat-phase separation. Unrendered poultry fat or tissue shall be recorded only as an input and shall never be used as the reference output."
      source_ids:
        - unsd-cpc-3-0-exp-notes-2025
    - rule_id: boundary_core_operations
      applies_to: "foreground rendering facility"
      rule: "Include the operations and controls directly required to receive, render, separate, clarify, cool, store, and dispatch the declared product, plus associated energy, water, waste-water, waste-gas, residue, and treatment flows."
      source_ids:
        - eu-sa-bat-2023-2749
    - rule_id: boundary_bat_scope_routing
      applies_to: "environmental performance guidance"
      rule: "Do not apply FDM sector performance levels to rendering or fat melting. The FDM BAT explicitly routes these operations to the slaughterhouses and animal by-products BAT, which is the process source used here."
      source_ids:
        - eu-fdm-bat-2019-2031
        - eu-sa-bat-2023-2749
    - rule_id: boundary_optional_refining
      applies_to: "physical refining or deodorization"
      rule: "Include only non-chemical physical refining or deodorization performed before the declared gate and only after confirming that its output remains CPC 21522. Identify the operation and exclude any classification-changing chemical modification."
      source_ids:
        - unsd-cpc-3-0-exp-notes-2025
    - rule_id: boundary_chemical_modification_exclusion
      applies_to: "final product classification"
      rule: "If the final animal fat or a fraction is partly or wholly hydrogenated, inter-esterified, re-esterified, elaidinized, or otherwise chemically modified in a classification-changing way, stop the CPC 21522 workflow: the output is outside this PCR and shall be classified under CPC 21590."
      source_ids:
        - unsd-cpc-3-0-exp-notes-2025
    - rule_id: boundary_fraction_mixture_reclassification
      applies_to: "separately marketed physical fractions and additive-containing mixtures"
      rule: "Do not inherit CPC 21522 from the rendered poultry-fat feed. Perform a fresh CPC classification determination; without documented confirmation of CPC 21522, the output cannot be this PCR's reference product."
      source_ids:
        - unsd-cpc-3-0-exp-notes-2025
    - rule_id: boundary_upstream_linkage
      applies_to: "received poultry material and other purchased inputs"
      rule: "Link each received input to an upstream dataset with its actual status and allocation. A waste or by-product label does not by itself authorize zero upstream burden."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_codex_limit
      applies_to: "product specification"
      rule: "Do not apply CXS 211-1999 named-fat composition or quality limits or CXS 329-2017 fish-oil requirements to rendered poultry fat. They are scope comparisons only."
      source_ids:
        - codex-cxs-211-1999
        - codex-cxs-329-2017
boundary_abstraction:
  declared_starting_condition: "Separately identified poultry-origin fat-bearing material received at the rendering facility, with supplier, species, material description, prior processing, preservation state, mass, and upstream classification declared"
  starting_condition_role: "Upstream product, co-product, by-product, residue, or waste input whose assigned upstream burdens and status are preserved from a documented upstream dataset"
  product_classification_scope: "Rendered poultry fat under CPC 21522 only; unrendered poultry fat remains an upstream input; chemically modified animal fats under CPC 21590 are excluded; separately marketed physical fractions and additive-containing mixtures require a fresh CPC determination before any CPC 21522 claim"
  recursive_input_rule: "Purchased rendered poultry fat used for blending or reprocessing remains an explicit same-category product input linked to a separate upstream dataset; disclose its mass share and do not recursively embed this PCR or count its production twice"
  upstream_dataset_requirement: "Provide representative upstream datasets for all received raw materials, energy carriers, water supplies, chemicals, packaging, and external treatment; disclose zero-burden or cut-off treatment with the governing method and evidence"
  disclosure: "Declare poultry species, raw-material status, prior processing, rendering technology, included physical refining or deodorization, chemical-modification status, any physical-fraction or additive-mixture classification decision, product specification, intended market, allocation method, temporal and geographic coverage, abnormal operating periods, treatment routes, and all deviations from this boundary"
