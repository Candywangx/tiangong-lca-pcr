allocation_rules:
  - rule_id: allocation_preserve_upstream
    applies_to: "incoming carcass or primal cut"
    rule: "Do not reallocate upstream husbandry, hunting, or slaughter burdens inside this gate-to-gate PCR; use the burden already carried by the accepted incoming product dataset and disclose its allocation method."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_subdivision_first
    applies_to: "shared foreground equipment and utilities"
    rule: "Prefer submetering, batch records, equipment time, mass-time, or another causal subdivision before allocation."
    source_ids:
      - eu-pef-2021-2279
      - eu-bat-2023-2749
  - rule_id: allocation_joint_cutting
    applies_to: "meat, recoverable bone, fat, and trimmings"
    rule: "If cutting cannot be subdivided, partition residual shared burdens by measured wet output mass because mass is the directly observed physical relationship; disclose all mass fractions and test economic allocation as a sensitivity when co-product value could change conclusions."
    source_ids:
      - eu-pef-2021-2279
      - rotz-et-al-2019
  - rule_id: allocation_waste
    applies_to: "discarded material, wastewater, sludge, and packaging waste"
    rule: "Do not assign a co-product credit to waste. Assign segregation and onsite treatment burdens to the process that generates the waste; model downstream treatment with the declared waste destination."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_no_double_count
    applies_to: "internal product transfers"
    rule: "Internal transfers between required processes carry no new upstream burden; reconcile them once in the process mass balance and count only exchanges crossing the foreground system boundary in the published inventory."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_mass_identity
      process_id: "p01_receiving"
      flow_role: "incoming and accepted deer meat"
      record_type: "lot receipt, inspection, and scale record"
      raw_fields: "species; scientific name; origin; carcass/primal route; cut; bone status; fresh/chilled state; incoming temperature; gross; tare; net; accepted; rejected"
      collection_method: "calibrated scale joined to traceability and inspection record"
      unit: "kg; degrees C"
      frequency: "every lot"
      temporal_coverage: "full reporting period"
      site_scope: "all receiving points"
      aggregation_rule: "sum accepted and rejected net mass by declared route; retain lot links"
      quality_evidence: "scale calibration; supplier document; inspection disposition; temperature record"
    - protocol_id: cp_process_electricity
      process_id: "p01_receiving_p07_dispatch"
      flow_role: "process electricity"
      record_type: "meter and operating-time record"
      raw_fields: "meter start/end; equipment; rated power; operating hours; shared-load driver; product mass"
      collection_method: "direct submeter preferred; documented equipment-time or causal allocation otherwise"
      unit: "kWh"
      frequency: "each batch or meter interval"
      temporal_coverage: "full reporting period"
      site_scope: "all included processes"
      aggregation_rule: "sum by process; allocate shared load with disclosed causal driver"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_cutting_yield
      process_id: "p02_cutting"
      flow_role: "cut meat, bone, fat, and trimmings"
      record_type: "lot mass-balance record"
      raw_fields: "input route; input mass; cut identity; meat; recoverable bone; recoverable fat; recoverable trimmings; discarded fractions; rejects; drip"
      collection_method: "calibrated scales at input and each output destination"
      unit: "kg wet mass"
      frequency: "every lot or representative campaign with coverage proof"
      temporal_coverage: "representative operating period within reporting year"
      site_scope: "all cutting lines"
      aggregation_rule: "sum each atomic output; calculate unexplained mass difference"
      quality_evidence: "scale calibration; destination tickets; lot reconciliation"
    - protocol_id: cp_product_washing
      process_id: "p03_washing"
      flow_role: "conditional meat washing"
      record_type: "route flag, water meter, ice issue, product scale, and electricity record"
      raw_fields: "washing performed; meat in/out; water in; ice in; electricity; start/end; wastewater"
      collection_method: "dedicated meters and lot records"
      unit: "kg; m3; kWh"
      frequency: "every washing batch"
      temporal_coverage: "all washing events in reporting period"
      site_scope: "all washing equipment"
      aggregation_rule: "sum only applicable batches; zero is allowed only with route evidence"
      quality_evidence: "meter checks; sanitation SOP; batch record"
    - protocol_id: cp_refrigeration
      process_id: "p04_chilling"
      flow_role: "chilling, storage, refrigerant make-up, and leakage"
      record_type: "temperature logger, electricity meter, refrigerant stock/service record"
      raw_fields: "meat in/out; product temperatures and times; storage hours; electricity; refrigerant identity; opening/closing stock; purchases; charges; recovery; transfer"
      collection_method: "continuous temperature and electricity records plus refrigerant mass reconciliation"
      unit: "kg; kWh; degrees C; h"
      frequency: "continuous for temperature; each service event for refrigerant"
      temporal_coverage: "full reporting period"
      site_scope: "all systems serving included meat"
      aggregation_rule: "allocate energy by product mass-time; calculate each refrigerant separately"
      quality_evidence: "calibrated logger; submeter; service invoice; cylinder weights; leak-alarm record"
    - protocol_id: cp_packaging_components
      process_id: "p05_packaging"
      flow_role: "meat and each packaging component"
      record_type: "bill of materials, stock issue, count, and scale record"
      raw_fields: "meat in/out; package route; component material; unit count; unit mass; opening/closing stock; purchases; returns"
      collection_method: "verified BOM reconciled to stock and packaged units"
      unit: "kg; item"
      frequency: "each packaging lot"
      temporal_coverage: "full reporting period"
      site_scope: "all packaging lines"
      aggregation_rule: "calculate each component mass separately; no combined packaging total substitutes for components"
      quality_evidence: "supplier specification; scale check; stock reconciliation"
    - protocol_id: cp_packaging_gases
      process_id: "p05_packaging"
      flow_role: "each MAP gas"
      record_type: "gas meter or cylinder reconciliation"
      raw_fields: "gas identity; purity; opening/closing stock; purchases; pressure/temperature conversion; conforming MAP units"
      collection_method: "mass meter preferred; cylinder stock reconciliation otherwise"
      unit: "kg"
      frequency: "each lot or cylinder change"
      temporal_coverage: "all MAP production in reporting period"
      site_scope: "all MAP packaging lines"
      aggregation_rule: "allocate each gas separately to conforming MAP product"
      quality_evidence: "meter calibration; cylinder invoice; gas-composition check"
    - protocol_id: cp_packaging_waste
      process_id: "p05_packaging"
      flow_role: "each packaging waste"
      record_type: "waste scale and destination record"
      raw_fields: "material identity; mass; contamination status; destination; date"
      collection_method: "segregated weighing by material"
      unit: "kg"
      frequency: "each collection"
      temporal_coverage: "full reporting period"
      site_scope: "all packaging lines"
      aggregation_rule: "sum each material and destination separately"
      quality_evidence: "weigh ticket; recycler or treatment receipt"
    - protocol_id: cp_sanitation_inputs_outputs
      process_id: "p06_sanitation"
      flow_role: "water, steam, chemicals, wastewater, and sludge"
      record_type: "meter, stock, formulation, and waste record"
      raw_fields: "water; steam; chemical product; active concentration; issue mass; electricity; wastewater; sludge wet mass; dry solids; destination"
      collection_method: "dedicated meters and stock reconciliation; active mass calculation"
      unit: "m3; MJ; kWh; kg"
      frequency: "each sanitation cycle or meter interval"
      temporal_coverage: "full reporting period"
      site_scope: "all included rooms and equipment"
      aggregation_rule: "sum each atomic chemical and output; allocate shared sanitation by cleaned area-time or production mass with disclosure"
      quality_evidence: "meter calibration; SDS/product specification; stock record; treatment ticket"
    - protocol_id: cp_fuel_and_combustion
      process_id: "p06_sanitation"
      flow_role: "each onsite fuel and CO2, CH4, N2O"
      record_type: "fuel meter/invoice, stock, calorific value, and emission-factor record"
      raw_fields: "fuel identity; quantity; opening/closing stock; net calorific value; combustion technology; factor source; CO2; CH4; N2O"
      collection_method: "reconcile each fuel, then apply verified fuel- and technology-specific factors"
      unit: "kg; MJ; kg emission"
      frequency: "each meter interval; annual reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "all stationary combustion serving foreground operations"
      aggregation_rule: "calculate each gas per fuel before summing the same elementary flow"
      quality_evidence: "invoice; meter check; supplier calorific value; factor version; calculation sheet"
    - protocol_id: cp_wastewater_streams
      process_id: "p02_cutting_p03_washing_p06_sanitation"
      flow_role: "blood-contaminated drainage, washing wastewater, and sanitation wastewater"
      record_type: "segregated flow meter and sampling record"
      raw_fields: "stream identity; flow; density if mass conversion; COD; total N; total P; treatment destination"
      collection_method: "separate meters or validated water balance; representative sampling"
      unit: "m3; kg"
      frequency: "continuous or each discharge batch"
      temporal_coverage: "full reporting period"
      site_scope: "each segregated drain and treatment route"
      aggregation_rule: "sum by stream; never merge streams before retaining origin data"
      quality_evidence: "meter calibration; sampling chain of custody; treatment invoice"
    - protocol_id: cp_waste_and_rejects
      process_id: "p01_receiving_p02_cutting_p05_packaging_p07_dispatch"
      flow_role: "rejects and animal material wastes"
      record_type: "scale and disposition record"
      raw_fields: "row identity; mass; reason; edible/co-product/waste status; destination; date"
      collection_method: "segregated weighing and disposition log"
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "full reporting period"
      site_scope: "all included processes"
      aggregation_rule: "sum each atomic row and destination"
      quality_evidence: "scale check; rejection record; destination receipt"
    - protocol_id: cp_dispatch
      process_id: "p07_dispatch"
      flow_role: "reference product delivery"
      record_type: "final scale, temperature, label, seal, and shipment record"
      raw_fields: "species; scientific name; cut; bone status; net meat mass; package; atmosphere; product temperature; time; lot; customer/jurisdiction limit"
      collection_method: "calibrated final scale and product-temperature measurement"
      unit: "kg; degrees C"
      frequency: "every dispatch lot"
      temporal_coverage: "full reporting period"
      site_scope: "all factory-gate dispatches"
      aggregation_rule: "sum conforming net meat mass; normalize all exchanges to 1 kg"
      quality_evidence: "scale calibration; temperature calibration; release record; label review"
  calculation_rules:
    - id: calc_normalization
      applies_to: "every foreground exchange"
      rule: "normalized amount = reporting-period exchange amount / reporting-period conforming net meat mass at factory gate"
      inputs:
        - "atomic exchange total"
        - "delivered_deer_meat total"
      output: "amount per 1 kg net reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_process_mass_balance
      applies_to: "receiving, cutting, washing, packaging, and dispatch"
      rule: "input wet mass = product outputs + co-product outputs + waste outputs + measured liquid transfer + recorded stock change + unexplained difference; report the difference rather than forcing balance"
      inputs:
        - "calibrated input/output masses"
        - stock
        - "liquid records"
      output: "process balance and unexplained mass difference"
      source_ids:
        - eu-bat-2023-2749
        - eu-pef-2021-2279
    - id: calc_refrigerant_leakage
      applies_to: "each refrigerant"
      rule: "emitted mass = make-up charged + opening system inventory - closing system inventory - recovered mass - transferred mass; calculate R717, R744, R134a, R404A, and any other actual refrigerant as separate substances"
      inputs:
        - stock
        - purchase
        - charge
        - recovery
        - transfer
        - "service records"
      output: "kg of each refrigerant emitted to air"
      source_ids:
        - eu-bat-2023-2749
    - id: calc_combustion_emissions
      applies_to: "natural gas, LPG, and stationary diesel"
      rule: "emission by gas = fuel activity on the factor's calorific basis x verified factor; retain fuel-level CO2, CH4, and N2O calculations before aggregation"
      inputs:
        - "each fuel amount"
        - "net calorific value"
        - "combustion technology"
        - factor
      output: "kg fossil CO2, kg CH4, and kg N2O"
      source_ids:
        - ipcc-2006-stationary-combustion
    - id: calc_active_chemical
      applies_to: "sodium hydroxide, nitric acid, sodium hypochlorite, and peracetic acid"
      rule: "active substance mass = formulated product mass x verified active mass fraction"
      inputs:
        - "issued product mass"
        - "supplier concentration"
      output: "kg active chemical"
      source_ids:
        - eu-bat-2023-2749
    - id: calc_packaging_component
      applies_to: "each package component"
      rule: "component mass = verified unit mass x used units, reconciled to opening stock + purchases - closing stock - returned usable stock - measured waste"
      inputs:
        - BOM
        - counts
        - stock
        - waste
      output: "kg of each component in product and kg of each component wasted"
      source_ids:
        - eu-pef-2021-2279
        - rotz-et-al-2019
    - id: calc_allocation
      applies_to: "inseparable shared cutting or support process"
      rule: "apply measured causal subdivision first; if impossible for joint cutting, allocate residual shared burden by measured wet output mass and disclose an economic sensitivity when material"
      inputs:
        - "submeter or causal driver"
        - "output masses"
        - "value evidence if sensitivity is needed"
      output: "allocated foreground burden by output"
      source_ids:
        - eu-pef-2021-2279
        - rotz-et-al-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "meat inputs and reference product"
      requirement: "Preserve traceability to one declared mammal species, scientific name, origin, anatomical cut, bone status, and fresh/chilled state for every lot; reject undeclared aggregate meat."
      evidence: "supplier record; inspection record; lot link; product label"
    - id: dq_temperature
      applies_to: "receipt through dispatch"
      requirement: "Use calibrated product-temperature measurements and time records sufficient to demonstrate the applicable chilled-meat limit and continuous cold control."
      evidence: "calibration certificate; logger export; release record; applicable regulation or specification"
    - id: dq_completeness
      applies_to: "all processes and flows"
      requirement: "Include every required process and every actual atomic material, energy, refrigerant, package component, waste, wastewater, and direct emission. Add a separate row for any actual refrigerant, fuel, chemical, package component, waste, or emission not enumerated here."
      evidence: "signed completeness checklist; purchase-to-inventory reconciliation; process flow diagram"
    - id: dq_representativeness
      applies_to: "foreground activity data"
      requirement: "Cover a full year where practical, or document season, operating modes, species/cut mix, production volume, and why a shorter representative campaign is adequate."
      evidence: "reporting-period record; production schedule; campaign justification"
    - id: dq_metering
      applies_to: "mass, utility, temperature, gas, and wastewater records"
      requirement: "Retain calibration or verification status and reconcile submeter totals to site invoices or master meters where applicable."
      evidence: "calibration record; invoice; reconciliation worksheet"
    - id: dq_waste_destination
      applies_to: "animal material, packaging waste, wastewater, and sludge"
      requirement: "Record co-product or waste status, treatment or recovery destination, and mass for each atomic stream; do not infer destination from a generic waste contract."
      evidence: "weigh ticket; transfer note; treatment or recycler receipt"
    - id: dq_range_evidence
      applies_to: "amount ranges"
      requirement: "Do not use a single paper, single facility value, or duplicated endpoint as an empirical range. Keep the foreground record requirement and manifest unresolved-range entry until two compatible original sources support synthesis."
      evidence: "source review record or explicit unresolved entry"
    - id: dq_uuid_resolution
      applies_to: "reference and inventory flows"
      requirement: "UUID cells may remain blank for this authored candidate, but each named atomic flow must be resolved and directly verified before active review or publication."
      evidence: "manifest unresolved list; future Tiangong direct-read evidence"
validation_rules:
  - rule_id: validation_identity
    applies_to: "dataset identity"
    rule: "Fail if mammal species, scientific name, anatomical cut, bone status, or fresh/chilled state is missing, or if an undeclared multi-species \"other mammal meat\" aggregate is used."
    source_ids:
      - unsd-cpc-3-21119
  - rule_id: validation_boundary
    applies_to: "system boundary"
    rule: "Fail if husbandry, hunting, or slaughter burdens are omitted from the incoming product dataset, or if they are also added inside the foreground boundary and double counted."
    source_ids:
      - codex-cxc-58-2005
      - eu-pef-2021-2279
  - rule_id: validation_process_coverage
    applies_to: "process map"
    rule: "Fail if any required process lacks a detailed inventory; require evidence of non-applicability for product washing and every conditional packaging gas, refrigerant, fuel, chemical, or package component."
    source_ids:
      - codex-cxc-58-2005
      - eu-bat-2023-2749
  - rule_id: validation_temperature
    applies_to: "cold chain"
    rule: "Fail when product-temperature/time evidence does not demonstrate the declared applicable limit at receipt, cutting as applicable, chilling, cold holding, and dispatch."
    source_ids:
      - eu-853-2004-consolidated
      - codex-cxc-58-2005
  - rule_id: validation_atomic_flows
    applies_to: "inventory"
    rule: "Fail when electricity, steam, fuels, refrigerants, chemicals, gases, packaging components, animal residues, wastewater streams, wastes, or emissions are combined into a selector or collection row."
    source_ids:
      - eu-pef-2021-2279
      - eu-bat-2023-2749
  - rule_id: validation_mass_balance
    applies_to: "process quantities"
    rule: "Flag any unexplained mass difference and fail if input, product, co-product, waste, liquid transfer, and stock-change records are insufficient to reproduce the process balance."
    source_ids:
      - eu-bat-2023-2749
      - eu-pef-2021-2279
  - rule_id: validation_refrigerant
    applies_to: "refrigeration"
    rule: "Fail if an actual refrigerant lacks separate make-up and leakage calculations or if stock, service, recovery, and transfer records are not reconciled."
    source_ids:
      - eu-bat-2023-2749
  - rule_id: validation_combustion
    applies_to: "onsite fuels"
    rule: "Fail if natural gas, LPG, or stationary diesel is used without separate activity records and direct fossil CO2, CH4, and N2O calculations using a documented factor basis."
    source_ids:
      - ipcc-2006-stationary-combustion
  - rule_id: validation_reference_mass
    applies_to: "reference flow"
    rule: "Fail unless the output is normalized to exactly 1 kg net boneless meat excluding packaging and the delivered_deer_meat output is linked to the reference flow."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_ranges
    applies_to: "ranges"
    rule: "Fail any empirical range supported only by one case, one point, duplicated endpoints, an abstract, or incompatible boundaries. Absence of a range remains an unresolved candidate evidence gap, not permission to invent an estimate."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Gate-to-gate secondary_dataset or background_dataset for post-slaughter cutting, chilling, packaging, and dispatch of one declared CPC 21119 mammal meat product"
  downstream_use: "Link after a species- and route-compatible upstream carcass or primal-cut dataset in a process or lifecyclemodel; use for factory-gate fresh/chilled meat studies"
  allowed_use: "Product systems matching the declared species, origin, cut, input route, packaging route, chilling technology, jurisdiction, facility scale, and reporting period"
  excluded_use: "Undeclared aggregate other-mammal meat; cattle/buffalo/pig/rabbit/hare/sheep/goat/camelid/equine categories; frozen/offal/minced/prepared/preserved meat; standalone slaughter; retail or consumer stage; comparative claims without equivalent upstream allocation and quality"
  required_metadata: "PCR id and version; species common/scientific name; farmed/wild origin; cut; bone status; fresh/chilled and never-frozen declaration; input route; upstream dataset; facility geography and scale; reporting period; temperature limits and records; package components and atmosphere; refrigerant and fuel identities; allocation; cut-offs; data quality; unresolved UUIDs"
  required_quality_disclosure: "primary-data share; meter and scale coverage; temporal, geographic, and technological representativeness; mass-balance difference; shared-operation allocation; refrigerant reconciliation; waste destinations; source and factor versions; deviations; missing range evidence"
  update_trigger: "Change in species/cut scope, input route, packaging system or gas mix, refrigerant, fuel or heat supply, sanitation chemistry, cold-chain limit, allocation method, waste destination, facility technology, reporting-period representativeness, source rule, or resolved Tiangong identity"
