        - unsd-cpc-3-21119
        - codex-cxc-58-2005
    - rule_id: boundary_required_operations
      applies_to: "foreground process coverage"
      rule: "Include receiving, inspection/grading, trimming/cutting, chilling/cold holding, packaging, sanitation, and factory-gate dispatch; include meat washing only when it is actually performed."
      source_ids:
        - codex-cxc-58-2005
        - fao-meat-cutting-guidelines
        - rotz-et-al-2019
    - rule_id: boundary_cold_chain
      applies_to: "meat temperature control"
      rule: "Maintain and record the declared fresh/chilled state through cutting, packaging, cold holding, and dispatch. For the representative EU large-wild-game deer route, apply the 7 degrees C product limit where Regulation (EC) No 853/2004 governs; otherwise record and apply the competent jurisdiction's limit."
