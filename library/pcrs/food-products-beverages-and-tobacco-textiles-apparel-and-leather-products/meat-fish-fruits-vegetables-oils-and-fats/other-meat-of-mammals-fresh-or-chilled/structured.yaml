system_boundary:
  rules:
    - rule_id: boundary_start_handover
      applies_to: "foreground boundary"
      rule: "Begin at physical transfer of a post-mortem-inspected carcass or primal cut; exclude husbandry/hunting and slaughter while requiring those burdens in the incoming meat dataset."
