        - eu-853-2004-consolidated
        - codex-cxc-58-2005
    - rule_id: boundary_complete_inventory
      applies_to: "foreground exchanges"
      rule: "Inventory all known material and energy inputs, products, co-products, wastes, direct emissions, and refrigerant losses; do not hide an actual flow in an aggregate energy, material, packaging, or waste row."
