system_boundary:
  rules:
    - rule_id: boundary_unrendered_identity
      applies_to: "product identity and process list"
      rule: "The reference product shall remain unrendered tissue/raw fat. Any rendering, fat melting, extraction, refining, fractionation, hydrogenation, or manufacture of named rendered fat is excluded and requires another product system."
      source_ids:
        - unsd-cpc-3-0-2025
        - codex-cxs-211-1999
    - rule_id: boundary_foreground_operations
      applies_to: "foreground system"
      rule: "Include attributable separation/trimming, sorting, hygienic handling, weighing, conditional chilling/freezing, packaging, storage, loading, and transport controlled before the declared handover."
      source_ids:
        - codex-cxc-58-2005
        - eu-pef-2021-2279
    - rule_id: boundary_cold_chain
      applies_to: "chilled or frozen product"
      rule: "Record cooling/freezing, cold-storage duration, temperature control, losses, and any included refrigerated transport; do not infer a universal temperature or holding time from this PCR."
      source_ids:
        - codex-cxc-58-2005
    - rule_id: boundary_transport_handover
      applies_to: "outbound logistics"
      rule: "Include transport only to the declared contractual or physical handover point and identify every included leg; downstream transport after handover is excluded unless explicitly brought into the study scope."
      source_ids:
        - codex-cxc-58-2005
        - eu-pef-2021-2279
    - rule_id: boundary_upstream_coproduct
      applies_to: "slaughter and cutting joint processes"
      rule: "Identify the point at which fat becomes a co-product and keep separately attributable post-separation burdens with the fat; jointly incurred slaughter/cutting burdens require the allocation rules in section 7."
      source_ids:
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "Fatty tissue or raw fat material from a declared pig or poultry species has been identified after slaughter/dressing/post-mortem disposition and/or cutting, has not been rendered, and is available for separation or has just been separated as a co-product."
  starting_condition_role: "Co-product/raw-material handover from a slaughter or cutting system into the unrendered-fat foreground; the exact burden-transfer point is declared."
  product_classification_scope: "CPC 3.0 21511 only; rendered pig fat 21521, rendered poultry fat 21522, and other rendered fats/oils 21523-21529 are excluded."
  recursive_input_rule: "Purchased CPC 21511 material entering a foreground operation is recorded as a separate product input with its own upstream dataset and qualifiers; it is not absorbed recursively into the reference output. A single dataset shall not merge pig and poultry inputs into an unspecified reference product."
  upstream_dataset_requirement: "When slaughter, dressing, or cutting occurs before the declared starting point, use a separately documented upstream dataset and its co-product allocation. When those operations are inside the foreground, collect the joint-process inputs and all co-product/waste outputs needed for allocation."
  disclosure: "Declare animal source, species, tissue/product form, disposition/grade, fresh/chilled/frozen state, separation point, included operations, packaging, cold-storage duration, handover point, included transport, and whether upstream slaughter/cutting burdens are included."
