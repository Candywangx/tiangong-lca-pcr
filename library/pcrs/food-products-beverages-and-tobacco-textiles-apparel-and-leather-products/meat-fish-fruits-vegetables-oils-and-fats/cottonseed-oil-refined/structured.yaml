allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Refinery unit operations and dedicated batches"
    rule: "Avoid allocation by collecting unit-operation, batch, tank, and meter records that directly assign inputs, outputs, wastes, and emissions to the refined-oil route."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical_relation
    applies_to: "Shared foreground burdens that cannot be subdivided"
    rule: "Allocate only by a documented, quantifiable physical relationship that reflects how the shared input or emission is caused; mass allocation is not automatic merely because all outputs are measured in kg."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_economic_fallback
    applies_to: "Marketable co-products without a defensible physical relationship"
    rule: "If subdivision and a relevant physical relationship are not feasible, use economic allocation based on contemporaneous plant-gate values for the specific reporting period and disclose prices, currency, averaging, zero-value outputs, and sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_waste_classification
    applies_to: "Soapstock, acid oil, deodorizer distillate, winterization solids, spent earth, and residues"
    rule: "Treat an output as a co-product only when function, positive economic value, mass, and destination are documented; otherwise retain it as a waste output with treatment burdens and no avoided-product credit in the attributional foreground package."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_upstream_separation
    applies_to: "Crude cottonseed oil input"
    rule: "Do not reallocate cotton cultivation, ginning, extraction, cottonseed meal, or lint burdens inside the refining foreground; preserve the allocation already declared by the linked crude-oil dataset and report its method."
    source_ids:
      - eu-pef-method-2021
