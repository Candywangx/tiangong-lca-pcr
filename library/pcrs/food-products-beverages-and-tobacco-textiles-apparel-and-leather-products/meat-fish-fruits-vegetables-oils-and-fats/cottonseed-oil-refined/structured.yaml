validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Foreground data package"
    rule: "The quantitative reference is exactly 1 kg or an explicit multiple of bulk Cottonseed oil, refined 5c448d72-c368-4fd2-a3d0-e1cc73572241, using Mass 93a60a56-a3c8-11da-a746-0800200b9a66 and kg from Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66."
    source_ids: []
  - rule_id: validate_product_scope
    applies_to: "Reference product"
    rule: "The product is Gossypium-derived refined cottonseed oil; crude, hydrogenated, interesterified, fractionated, blended, formulated, non-food, or packaged products are not silently represented by this reference flow."
    source_ids:
      - codex-cxs-210-1999
  - rule_id: validate_route_logic
    applies_to: "Refinery process"
    rule: "Every declared unit operation has matching input/output records; chemical and physical refining are not double counted, and winterization is included only when declared."
    source_ids:
      - epa-vegetable-oil-voc-1978
      - fsanz-cot102-2004
  - rule_id: validate_upstream_link
    applies_to: "Crude-oil input"
    rule: "A separate upstream crude-cottonseed-oil dataset is linked and its extraction route and allocation are disclosed; cottonseed seed flow a60671ff-7325-4636-9fba-bcc5f6afaeeb is rejected as a crude-oil substitute."
    source_ids:
      - us-epa-vegetable-oil-neshap
  - rule_id: validate_quality_release
    applies_to: "Refined-oil output"
    rule: "The output has a laboratory release against the declared specification. If CXS 210-1999 is used, verify its applicable refined-oil quality limits and cottonseed-oil identity provisions using declared sampling and analysis methods."
    source_ids:
      - codex-cxs-210-1999
  - rule_id: validate_inventory_completeness
    applies_to: "Foreground reporting period"
    rule: "All material, utility, product, co-product, waste, wastewater, direct-emission, and inventory-change records required by the operated route are present or explicitly zero/not applicable with evidence."
    source_ids:
      - eu-fdm-bref-2019
  - rule_id: validate_mass_balance
    applies_to: "Mass-bearing inventory"
    rule: "The foreground mass-balance residual is calculated and explained; values are not altered merely to force closure, and wet/dry basis and stock changes are consistent."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "Shared burdens and recovered outputs"
    rule: "Subdivision is attempted first; any physical or economic allocation is justified, uses reporting-period evidence, sums to 100% for allocated burdens, and includes a disclosed sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_uuid_specificity
    applies_to: "Inventory identities"
    rule: "Generic or semantically wrong UUIDs are rejected; in particular, do not use the cottonseed seed flow for crude oil or the electrolytic-manganese-slag wastewater flow for refinery wastewater."
    source_ids: []
  - rule_id: validate_provisional_ranges
    applies_to: "Candidate-stage QA ranges"
    rule: "Reasoned-estimate ranges are screening flags only; foreground values outside them trigger review rather than automatic rejection, and publication requires reviewed acceptance or stronger evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground refinery data package that may support a published unit-process secondary_dataset or background_dataset after review"
  downstream_use: "Link to a representative crude-cottonseed-oil dataset and use the refinery process in product systems for bulk refined cottonseed oil"
  allowed_use: "Gate-to-gate refinery modelling and cradle-to-gate studies when upstream and any added downstream modules are explicit and compatible"
  excluded_use: "Comparative claims without equivalent specification, route, geography, time, allocation, and packaging boundary; direct representation of crude, modified, blended, formulated, packaged, or non-food oil"
  required_metadata: "PCR id/version; reference-flow UUID; refinery geography and period; crude-oil origin and upstream dataset; route; winterization; specification and tests; utilities; co-products and wastes; allocation; background substitutions; packaging boundary"
  required_quality_disclosure: "Measurement coverage, calibration, mass-balance residual, data gaps, estimates, allocation sensitivity, proxy datasets, quality-test results, and unresolved UUIDs"
  update_trigger: "Material change in crude-oil source, refining route, winterization, utility system, yield or losses, co-product market, waste treatment, geography, product specification, or reporting period; or availability of exact unresolved Tiangong identities"
data_sources:
  - id: "codex-cxs-210-1999"
    type: "standard"
    reference: "Codex Alimentarius, *Standard for Named Vegetable Oils*, CXS 210-1999, current redesigned publication incorporating amendments through 2024, https://workspace.fao.org/sites/codex/Standards/CXS%20210-1999/CXS_210e.pdf (retrieved 2026-08-10)"
    used_for: "Cottonseed-oil identity, edible-product scope, quality and composition checks, sampling/analysis linkage"
  - id: "fsanz-cot102-2004"
    type: "official_guidance"
    reference: "Food Standards Australia New Zealand, *Final Assessment Report, Application A509: Food derived from insect-protected cotton line COT102*, 4 August 2004, https://www.fao.org/fileadmin/user_upload/gmfp/docs/1_A509_GM_Cotton_FAR_Final.pdf (retrieved 2026-08-10)"
    used_for: "Cottonseed-specific refining evidence: gossypol removal and bleaching/deodorization reduction of cyclopropenoid fatty acids"
  - id: "epa-vegetable-oil-voc-1978"
    type: "official_guidance"
    reference: "U.S. EPA, *Control of Volatile Organic Emissions from Manufacture of Vegetable Oils*, EPA-450/2-78-035, 1978, https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9102156N.TXT (retrieved 2026-08-10)"
    used_for: "Refining process decomposition, alkali neutralization, adsorptive bleaching, vacuum steam deodorization, and emissions awareness"
  - id: "us-epa-vegetable-oil-neshap"
    type: "official_guidance"
    reference: "U.S. EPA, *Solvent Extraction for Vegetable Oil Production: National Emission Standards for Hazardous Air Pollutants (NESHAP)*, https://www.epa.gov/stationary-sources-air-pollution/solvent-extraction-vegetable-oil-production-national-emission (retrieved 2026-08-10)"
    used_for: "Upstream cottonseed solvent-extraction boundary, solvent recovery, and hexane-release completeness"
  - id: "eu-fdm-bref-2019"
    type: "official_guidance"
    reference: "European Commission JRC, *Best Available Techniques (BAT) Reference Document for the Food, Drink and Milk Industries*, 2019, DOI 10.2760/243911, https://doi.org/10.2760/243911 (retrieved 2026-08-10)"
    used_for: "Vegetable-oil-refining environmental scope; energy, water, wastewater, air emissions, resource efficiency, monitoring, and data-quality priorities"
  - id: "eu-pef-method-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on the use of Environmental Footprint methods, corrected consolidated text, https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32021H2279R(01) (retrieved 2026-08-10)"
    used_for: "Allocation hierarchy: subdivision/system expansion, relevant physical relationship, then justified other relationship including economic allocation"
