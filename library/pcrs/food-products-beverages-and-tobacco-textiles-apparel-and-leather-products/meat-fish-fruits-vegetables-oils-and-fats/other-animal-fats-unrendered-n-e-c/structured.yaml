  reference_flow_link: "The functional unit is fulfilled by 1 kg of the Tiangong product flow identified below"
system_boundary:
  rules:
    - rule_id: boundary_unrendered_gate
      applies_to: "Product and foreground process boundary"
      rule: "The qualifying product must remain unrendered through the declared handover. Rendering, fat melting, extraction producing an animal oil or fraction, refining, and chemical modification are excluded and require another product category and process system."
      source_ids:
        - unsd-cpc-3-0-2025
        - codex-cxs-211-1999
    - rule_id: boundary_route_start
      applies_to: "Foreground start"
      rule: "Start at the measured entry of accepted source material to physical recovery/separation. Include only route-specific operations and resource or emission flows actually controlled within the declared foreground system; link rather than erase upstream burdens."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_conditioning
      applies_to: "Chilling, freezing, washing, trimming, storage, and packing"
      rule: "Include these operations when performed before the declared handover and record their actual water, energy, auxiliary, packaging, waste, wastewater, refrigerant, and direct-emission flows. Applicable meat-hygiene controls govern only slaughter/meat routes and do not define composition or LCA values for aquatic or wool-grease routes."
      source_ids:
        - codex-cxc-58-2005
        - eu-fdm-bat-2019
    - rule_id: boundary_handover
      applies_to: "Distribution boundary"
      rule: "The default foreground ends when the qualifying product is weighed and transferred at the declared dispatch gate. Outbound transport is outside unless the declared delivery handover includes it; if included, record route, distance, mode, load, temperature control, and allocation separately."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_no_silent_cutoff
      applies_to: "Inventory completeness"
      rule: "Identify all environmentally relevant material and energy flows, co-products, wastes, wastewater, and direct releases. Any exclusion must be explicit, justified, and assessed for significance; this candidate PCR sets no category-specific numerical cut-off."
      source_ids:
        - eu-pef-2021
        - eu-fdm-bat-2019
boundary_abstraction:
  declared_starting_condition: "Identified, accepted animal-derived fat tissue or raw fatty material enters physical recovery/separation after the upstream slaughter, dressing, cutting, or analogous animal-processing decision; for crude wool grease, identified greasy wool or a separately measured scouring stream enters non-rendering grease recovery"
  starting_condition_role: "Foreground entry condition for route-specific physical recovery; upstream animal production, slaughter, fishing/aquaculture, wool production, and prior processing remain linked upstream systems unless demonstrably included in the same measured facility system"
  product_classification_scope: "Residual CPC 21519 scope only after exclusion of CPC 21511-21515, CPC 21521-21529, fish or marine-mammal oils, other extracted oils/fractions, and other specifically classified products"
  recursive_input_rule: "Purchased or transferred CPC 21519 material is an explicit same-category input with its own upstream dataset and is excluded from newly recovered output when calculating facility yield; internal transfers between mapped foreground processes are not counted twice"
  upstream_dataset_requirement: "Provide compatible upstream datasets for source animal material and other purchased inputs. At a shared slaughter, cutting, animal-processing, or wool-scouring boundary, the upstream dataset must disclose subdivision or the allocation method and factor applied at the point where the qualifying material becomes a distinct output"
  disclosure: "Declare species/taxon, source material, route, included operations, rendering/refining exclusion, product grade, physical and temperature state, packaging, storage duration, handover point, upstream boundary, co-products, allocation method and factors, and any excluded flow with justification"
