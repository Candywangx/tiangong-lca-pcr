allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Shared slaughter, dressing, cutting, recovery, scouring, conditioning, and utility processes"
    rule: "Avoid allocation first by separately metering or otherwise subdividing operations directly attributable to the qualifying fat, other products, co-products, and wastes. Internal transfers are not co-products."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical_second
    applies_to: "Multifunctional process that cannot be subdivided"
    rule: "Use a demonstrated, quantifiable physical relationship only when it represents how the shared inputs and outputs provide the functions of the co-products. Record the relationship, measurements, period, and factor; mass alone is not automatically relevant."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_other_relationship_last
    applies_to: "Multifunctional process with no defensible subdivision or physical relationship"
    rule: "Use another justified relationship, normally economic allocation at the point the co-products become distinct, with contemporaneous route-, species-, grade-, and market-specific quantities and prices. Explain why earlier hierarchy steps failed and test sensitivity where the allocation materially affects results."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_no_cross_species_default
    applies_to: "n.e.c. source material and co-products"
    rule: "Do not apply a unified allocation factor across animal species, tissue states, crude wool grease, aquatic invertebrate material, or other recovery routes. PEF slaughterhouse default factors for cattle, pigs, sheep, and goats are outside this residual category and must not be imported as defaults."
    source_ids:
      - unsd-cpc-3-0-2025
      - eu-pef-2021
  - rule_id: allocation_upstream_transfer
    applies_to: "Purchased or transferred source material and same-category input"
    rule: "A zero-burden or waste designation is not automatic. Retain the supplier/upstream treatment of burdens, co-product status, and allocation at the transfer point; reconcile it with the foreground method to avoid omission or double counting."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_identity_mass
      process_id: "physical_recovery_separation"
      flow_role: "Source identity and incoming mass"
      record_type: "Receiving, supplier, classification, scale, and lot records"
      raw_fields: "lot_id; supplier; species_or_taxon; source_tissue_or_material; route; intended_grade; rendered_or_extracted_indicator; acceptance_decision; gross_mass; tare_mass; net_mass; scale_id; timestamp"
      collection_method: "Verify documentary identity and physical state at receipt; calibrated weighing; retain classification review for residual-category acceptance"
      unit: "kg and declared descriptors"
      frequency: "Each lot"
      temporal_coverage: "All lots in the representative period"
      site_scope: "Every included site and supplier route"
      aggregation_rule: "Keep species/material/route strata separate; sum only accepted net masses with disclosed weights"
      quality_evidence: "Supplier records; photographs or specifications where used; classification review; calibration certificate; receiving log"
    - protocol_id: cp_resource_use
      process_id: "physical_recovery_separation"
      flow_role: "Water, energy, and auxiliaries"
      record_type: "Meters, invoices, dosing logs, and equipment records"
      raw_fields: "meter_start; meter_end; fuel_or_energy_type; water_use; auxiliary_name; auxiliary_mass; equipment_time; allocation_driver; lot_id; reporting_period"
      collection_method: "Prefer submetering; otherwise allocate reporting-period use with a documented causal driver and reconcile to invoices"
      unit: "kg; m3; kWh; MJ; carrier-specific units"
      frequency: "Per lot or meter interval"
      temporal_coverage: "Representative operation including seasonal/throughput variation"
      site_scope: "Each foreground site"
      aggregation_rule: "Sum by resource and stratum; normalize to accepted net reference output; report allocation share"
      quality_evidence: "Meter calibration; invoices; stock reconciliation; equipment log; allocation worksheet"
    - protocol_id: cp_output_co_product_waste
      process_id: "physical_recovery_separation"
      flow_role: "Product, co-product, reject, and waste mass"
      record_type: "Scale, yield, dispatch, and waste records"
      raw_fields: "lot_id; output_type; species_or_taxon; material_state; gross_mass; tare_mass; net_mass; destination; saleable_status; handover_point"
      collection_method: "Calibrated weighing of each output class; retain route and classification strata"
      unit: "kg and declared descriptors"
      frequency: "Each lot"
      temporal_coverage: "All lots in the representative period"
      site_scope: "Each foreground site"
      aggregation_rule: "Reconcile input, product, co-products, drainage, wastewater, stock change, and wastes before normalization"
      quality_evidence: "Calibration certificate; lot yield sheet; waste transfer note; dispatch record; inventory reconciliation"
    - protocol_id: cp_emissions_wastewater
      process_id: "physical_recovery_separation"
      flow_role: "Wastewater and direct releases"
      record_type: "Flow meters, sampling, maintenance, fuel, and emission records"
      raw_fields: "stream_id; flow; pH; temperature; pollutant_or_release; concentration_or_mass; sampling_time; method; refrigerant_addition; fuel_use; destination"
      collection_method: "Monitor relevant streams at declared locations; calculate loads only from recorded flow/activity and documented factors"
      unit: "m3; kg; concentration and flow-specific units"
      frequency: "Per discharge, sample, event, or reporting period"
      temporal_coverage: "Representative period with abnormal events identified"
      site_scope: "Each foreground site and relevant discharge point"
      aggregation_rule: "Sum measured loads by stream; allocate shared reporting-period loads with disclosed causal driver"
      quality_evidence: "Laboratory report; meter calibration; maintenance log; factor reference; discharge record"
    - protocol_id: cp_conditioning_storage
      process_id: "conditioning_storage"
      flow_role: "Product condition, duration, energy, losses, and direct releases"
      record_type: "Scale, temperature, time, meter, stock, and maintenance records"
      raw_fields: "lot_id; input_mass; output_mass; temperature_profile; start_time; end_time; storage_volume_or_mass; energy_use; refrigerant_addition; drainage; reject_mass"
      collection_method: "Calibrated weighing and temperature logging; submetering or documented load-time calculation; inventory balance for refrigerant"
      unit: "kg; °C; hour or day; kWh; refrigerant-specific unit"
      frequency: "Each lot with continuous or periodic temperature records"
      temporal_coverage: "Full included conditioning/storage duration"
      site_scope: "Each included cold room, freezer, or conditioning line"
      aggregation_rule: "Normalize product and losses by lot; allocate shared energy by documented mass-time, volume-time, or measured load driver"
      quality_evidence: "Scale and temperature calibration; meter data; stock reconciliation; maintenance record"
    - protocol_id: cp_packing_dispatch
      process_id: "packing_dispatch_handover"
      flow_role: "Packaging, final mass, dispatch utilities, waste, and custody transfer"
      record_type: "Bills of material, issue/return logs, scales, meters, and dispatch documents"
      raw_fields: "lot_id; package_format; material; issued_mass; returned_mass; packed_units; gross_mass; tare_mass; net_product_mass; dispatch_energy; reject_mass; handover_location; handover_time; temperature"
      collection_method: "Reconcile packaging issues and returns; calibrated final weighing; document custody transfer and temperature condition"
      unit: "kg; item count; kWh; °C; timestamp"
      frequency: "Each dispatch lot"
      temporal_coverage: "All dispatches in representative period"
      site_scope: "Every packing and dispatch site"
      aggregation_rule: "Calculate packaging by material and net product; normalize site utilities and waste with disclosed driver"
      quality_evidence: "Packaging bill of material; purchase/stock record; calibration; dispatch note; meter record"
    - protocol_id: cp_allocation_evidence
      process_id: "physical_recovery_separation"
      flow_role: "Shared-process allocation"
      record_type: "Submeter, physical-driver, quantity, and price records"
      raw_fields: "shared_process; co_product; direct_metered_use; physical_driver; co_product_quantity; price_basis; price_period; currency; allocation_factor; hierarchy_step; justification"
      collection_method: "Test subdivision first, then relevant physical relationship, then another justified relationship; retain factor calculation and sensitivity inputs"
      unit: "Driver-specific units; kg; currency per declared unit"
      frequency: "Each allocation period and whenever route or market changes"
      temporal_coverage: "Same period as foreground inventory or justified representative period"
      site_scope: "Each shared facility and route/species stratum"
      aggregation_rule: "Calculate factors within one coherent multifunctional boundary; factors sum to one for allocated burdens"
      quality_evidence: "Metering evidence; production ledger; invoices or market records; signed allocation worksheet; sensitivity check"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "Final product mass"
      rule: "net product mass = gross measured mass - tare - packaging mass - separately removed free drainage; normalize inventory by net qualifying mass at handover"
      inputs:
        - gross_mass
        - tare_mass
        - packaging_mass
        - free_drainage_mass
        - "classification acceptance"
      output: "kg qualifying product and normalization factor"
      source_ids:
        - eu-pef-2021
    - id: calc_lot_mass_balance
      applies_to: "Each recovery and conditioning lot"
      rule: "Reconcile measured source inputs and additions with qualifying product, co-products, wastes, wastewater or drainage, direct mass releases, and stock change. Investigate rather than force-close unexplained imbalance"
      inputs:
        - "all measured mass inputs and outputs"
        - "stock change"
        - "moisture/free-drainage notes"
      output: "disclosed mass-balance residual and completeness finding"
      source_ids:
        - eu-fdm-bat-2019
        - eu-pef-2021
    - id: calc_shared_resource_use
      applies_to: "Shared water, energy, auxiliary, and dispatch records"
      rule: "normalized use = total recorded use × documented foreground allocation share ÷ net qualifying product mass; the share must use a causal meter or activity driver and remain separate by route/species stratum"
      inputs:
        - "meter or invoice total"
        - "allocation driver"
        - "allocation share"
        - "net product mass"
      output: "resource use per kg reference product"
      source_ids:
        - eu-fdm-bat-2019
        - eu-pef-2021
    - id: calc_co_product_allocation
      applies_to: "Multifunctional upstream or foreground process"
      rule: "Apply the ordered hierarchy: subdivision; relevant physical relationship; then another justified relationship. Record factors and verify allocated shares sum to one within the shared burden pool"
      inputs:
        - "direct measurements"
        - "driver data"
        - quantities
        - prices
        - period
        - "burden pool"
      output: "allocated inputs, outputs, and emissions by co-product"
      source_ids:
        - eu-pef-2021
    - id: calc_reasoned_estimate_replacement
      applies_to: "Provisional QA ranges"
      rule: "Reasoned-estimate ranges are screening flags only and never substitute for foreground amounts. Replace a range when reviewed batch, metering, bill-of-material, route, storage, or allocation evidence is available, or when the species/material/technology/boundary changes"
      inputs:
        - "provisional range"
        - "new foreground evidence"
        - "change trigger"
      output: "retained, revised, or removed QA range with review record"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity_classification
      applies_to: "Every product and source-material stratum"
      requirement: "Demonstrate residual-category eligibility, species/taxon, source material, unrendered state, route, grade, and non-overlap with exclusions. Ambiguity requires manual classification review before use."
      evidence: "Receiving and supplier records; physical-state evidence; CPC review"
    - id: dq_measurement
      applies_to: "Mass, resource, temperature, time, and release records"
      requirement: "Use calibrated or verified instruments where applicable; preserve raw units, conversions, meter coverage, sampling methods, and allocation drivers."
      evidence: "Calibration and verification records; raw meter/sample files; conversion worksheet"
    - id: dq_temporal_geographic_technology
      applies_to: "Representative dataset"
      requirement: "State geography, sites, technologies, throughput, seasonality, production period, and storage profile. Explain gaps and why the period represents the declared product stratum."
      evidence: "Production calendar; facility description; coverage statistics; PEF DQR disclosure"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Include or explicitly justify exclusion of relevant material, energy, co-product, waste, wastewater, packaging, refrigerant, and direct-release flows; report the mass-balance residual and omitted-flow assessment."
      evidence: "Process-flow diagram; BAT-style inventory where applicable; mass balance; exclusion register"
    - id: dq_allocation
      applies_to: "Shared processes"
      requirement: "Retain hierarchy step, boundary, factors, period, species/route stratum, and evidence; do not transplant factors from another animal category or tissue state."
      evidence: "Allocation worksheet; meter/driver/price evidence; sensitivity result"
    - id: dq_hygiene_condition
      applies_to: "Edible slaughter/meat-derived routes"
      requirement: "Retain applicable process-control, post-mortem acceptance, time-temperature, wrapping/packing, refrigeration, and custody records. CXC 58 is contextual and does not establish a product composition or LCA amount."
      evidence: "Applicable establishment control records; temperature log; inspection/acceptance and dispatch documentation"
    - id: dq_source_limits
      applies_to: "Use of external evidence"
      requirement: "Preserve each source's declared use and limitation. Do not convert Codex composition tables, BAT applicability thresholds/performance levels, or PEF species-specific defaults into category-wide values for CPC 21519."
      evidence: "Source-use review and dataset-method note"
validation_rules:
  - rule_id: validate_category_gate
    applies_to: "Product identity"
    rule: "Pass only when species/taxon, source material, route, and unrendered state establish CPC 21519 residual scope. Unknown species or possible overlap with CPC 21511-21515, rendered fats, animal oils/fractions, or another explicit category produces a manual-review finding and no automatic PCR selection."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_reference_uuid
    applies_to: "Reference flow identity"
    rule: "Require product flow 0907e9e5-7e3d-493d-91a2-3810e2b5bc9a, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and a 1 kg net reference amount."
    source_ids: []
  - rule_id: validate_unrendered_process
    applies_to: "Process route"
    rule: "Fail conformity if rendering, fat melting, oil/fraction extraction, refining, or chemical modification occurs before handover, or if rendered/oil output is represented with this reference flow."
    source_ids:
      - unsd-cpc-3-0-2025
      - codex-cxs-211-1999
  - rule_id: validate_strata
    applies_to: "Species, source material, and route aggregation"
    rule: "Require separate inventory strata for unlike species/materials/routes or disclosed weights and stratum-specific calculations. A single undifferentiated default for slaughter-derived tissue, crude wool grease, or other animal sources is non-conforming."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_boundary_handover
    applies_to: "Included operations"
    rule: "Require declared foreground start, included trimming/washing/conditioning/storage/packing, dispatch or delivery handover, and treatment of outbound transport. Rendering/refining must remain excluded."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_inventory_completeness
    applies_to: "Process inventory"
    rule: "Require measured or explicitly not-applicable treatment of source material, product, co-products, water, energy, auxiliaries, rejects, wastewater/drainage, packaging, refrigerants/direct releases, and stock changes; justify every exclusion."
    source_ids:
      - eu-pef-2021
      - eu-fdm-bat-2019
  - rule_id: validate_mass_balance
    applies_to: "Recovery, conditioning, and dispatch lots"
    rule: "Require raw measurements and a disclosed mass-balance residual. Do not force an unexplained residual to zero or use a reasoned-estimate range as the recorded amount."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validate_allocation
    applies_to: "Multifunctional burdens"
    rule: "Require evidence that subdivision was tested first, followed by a relevant physical relationship and only then another justified relationship; factors must be route- and period-specific and reconcile within the shared burden pool."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_estimate_replacement
    applies_to: "Reasoned-estimate ranges"
    rule: "Confirm that every reasoned_estimate is labelled provisional, is used only as a QA screen, has no invented source, and states replacement triggers. Foreground values remain mandatory."
    source_ids: []
  - rule_id: validate_source_limitations
    applies_to: "External-source use"
    rule: "Reject use of CXS 211 composition values as an unrendered-fat recipe or LCA value, CXC 58 outside applicable slaughter/meat hygiene context, or FDM BAT thresholds/performance values as universal requirements."
    source_ids:
      - codex-cxs-211-1999
      - codex-cxc-58-2005
      - eu-fdm-bat-2019
published_dataset_profile:
  dataset_role: "Foreground product-system dataset for one declared species/material/recovery-route stratum, suitable after review for publication as a secondary_dataset and/or background_dataset"
  downstream_use: "LCA process and lifecyclemodel projections requiring 1 kg of other animal fat, unrendered, n.e.c., at a specified dispatch or delivery condition"
  allowed_use: "Studies matching the declared species/taxon, material, route, grade, geography, technology, period, temperature state, handover, upstream-boundary treatment, and allocation method"
  excluded_use: "Rendered/refined/modified fats or oils; CPC 21511-21515; rendered fats 21521-21529; fish or marine-mammal oils; unknown or mixed source identity without stratification; substitution across materially different species, wool-grease and tissue routes, or handover states without review"
  required_metadata: "PCR id/version; product and all three reference UUIDs; species/taxon; source tissue/material; route; residual-category review; intended grade/use; physical and temperature state; moisture/free-drainage and net-mass basis; geography; period; technology; included operations; packaging; storage duration; handover; upstream datasets; co-products; allocation; data sources"
  required_quality_disclosure: "Raw-data coverage; calibration; temporal/geographic/technological representativeness; mass-balance residual; water/energy/emission coverage; exclusions; allocation factors and sensitivity; use and replacement status of reasoned estimates; source limitations; unresolved flow UUIDs selected in the concrete dataset"
  update_trigger: "New CPC or official scope guidance; corrected Tiangong identity; reviewed route/species evidence; changed recovery, conditioning, packaging, or handover technology; new foreground ranges; changed co-product markets/allocation; source revision; evidence that a product belongs to a more specific category"
data_sources:
  - id: "unsd-cpc-3-0-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Ver. 3.0 Explanatory Notes, subclass 21519, updated 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-11)"
    used_for: "Authoritative residual-category inclusion/exclusion gate. It defines classification scope only and supplies no process recipe, allocation factor, or LCA quantity."
  - id: "codex-cxc-58-2005"
    type: "standard"
    reference: "Codex Alimentarius, Code of Hygienic Practice for Meat, CXC 58-2005. https://workspace.fao.org/sites/codex/Standards/CXC%2058-2005/CXC_058e.pdf (retrieved 2026-08-11)"
    used_for: "Applicable slaughter/meat-route context for process control, post-mortem acceptance, time-temperature control, immediate wrapping/packing and refrigeration. It is not applied to aquatic-invertebrate or crude-wool-grease routes and supplies no category-wide LCA values."
  - id: "codex-cxs-211-1999"
    type: "standard"
    reference: "Codex Alimentarius, Standard for Named Animal Fats, CXS 211-1999, amended 2024. https://openknowledge.fao.org/handle/20.500.14283/ce0093en (retrieved 2026-08-11)"
    used_for: "Boundary contrast: its named fats are presented for human consumption and include rendered products such as lard, rendered pork fat, premier jus, and tallow. It is not used as an unrendered-fat composition specification, recipe, or source of LCA quantities."
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I Product Environmental Footprint Method. https://eur-lex.europa.eu/eli/reco/2021/2279/oj (retrieved 2026-08-11)"
    used_for: "Functional-unit/reference-flow structure; system-boundary and inventory completeness; data-quality disclosure; multi-functionality hierarchy. Species-specific PEF slaughter/farm defaults for cattle, pigs, sheep, and goats are not adopted for this n.e.c. PCR."
  - id: "eu-fdm-bat-2019"
    type: "official_guidance"
    reference: "Commission Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries. https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj (retrieved 2026-08-11)"
    used_for: "Process-flow, water/energy/raw-material, wastewater/waste-gas inventory and monitoring completeness where relevant. Legal applicability, capacity thresholds, emission levels, and performance values are not generalized; the decision notes that slaughterhouse/animal-by-product activities may be covered by other BAT conclusions."
