system_boundary:
  rules:
    - rule_id: boundary_live_goat_to_dispatch
      applies_to: "Covered route"
      rule: "Include slaughter, bleeding, evisceration, liver separation and trimming, washing, chilling, packaging, refrigerated holding, and attributable sanitation from accepted live goat through dispatch of chilled liver."
      source_ids:
        - fao-small-ruminant-slaughter
        - fao-who-cxc-58-2005
    - rule_id: boundary_identity_and_inspection
      applies_to: "Slaughter products"
      rule: "Keep each animal's liver identifiable with its carcass until post-mortem disposition; exclude condemned material from edible product and record it separately."
      source_ids:
        - eu-reg-853-2004
        - fao-small-ruminant-slaughter
    - rule_id: boundary_temperature
      applies_to: "Chilled route"
      rule: "Chill immediately after post-mortem handling along a continuously decreasing temperature path and hold offal at no more than 3 °C; this PCR further fixes dispatch at 0–3 °C."
      source_ids:
        - eu-reg-853-2004
        - fao-who-cxc-58-2005
    - rule_id: boundary_atomic_inputs
      applies_to: "All foreground processes"
      rule: "Record every actually used material, water, electricity, chemical, packaging component, refrigerant, and fuel as a separate chemically or physically specific exchange; do not use collection flows."
      source_ids:
        - fao-who-cxc-58-2005
    - rule_id: boundary_atomic_outputs
      applies_to: "All foreground processes"
      rule: "Record each coproduct, waste, wastewater stream, refrigerant emission, and directly discharged pollutant separately. Wastewater-to-treatment and direct-to-water pollutant routes are mutually exclusive for the same quantity."
      source_ids:
        - fao-small-ruminant-sanitation
    - rule_id: boundary_state_route
      applies_to: "Product state"
      rule: "Include only the chilled route. A fresh unchilled or frozen route requires a separate PCR-conforming dataset and cannot be averaged with this route."
      source_ids:
        - unsd-cpc3-21156
        - eu-reg-853-2004
