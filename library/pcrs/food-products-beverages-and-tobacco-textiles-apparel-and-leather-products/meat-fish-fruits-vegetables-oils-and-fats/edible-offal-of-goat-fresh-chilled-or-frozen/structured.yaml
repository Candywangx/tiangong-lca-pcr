process_map:
  - id: slaughter_bleeding
    name: "Slaughter and bleeding"
    inclusion: "required"
    inclusion_condition: "Every covered lot."
    role: "Convert accepted live goats to bled bodies while separately collecting food-grade blood or blood for treatment."
    quantitative_reference: "kg bled goat body"
  - id: evisceration_separation
    name: "Hygienic evisceration and organ separation"
    inclusion: "required"
    inclusion_condition: "Every covered lot."
    role: "Separate the liver and every other coproduct or waste while retaining carcass identity through inspection."
    quantitative_reference: "kg liver with gallbladder"
  - id: liver_trimming
    name: "Liver inspection, gallbladder removal, and trimming"
    inclusion: "required"
    inclusion_condition: "Every covered liver lot after post-mortem disposition."
    role: "Produce only fit whole goat liver meeting the trimming specification."
    quantitative_reference: "kg trimmed goat liver"
  - id: liver_washing
    name: "Potable-water liver washing"
    inclusion: "required"
    inclusion_condition: "Every covered trimmed-liver lot; dry-clean-only routes are outside this representative route."
    role: "Remove residual surface contamination without mixing tissues or lots."
    quantitative_reference: "kg washed goat liver"
  - id: forced_air_chilling
    name: "Forced-air chilling with R717 refrigeration"
    inclusion: "required"
    inclusion_condition: "Every covered washed-liver lot."
    role: "Reduce product temperature continuously to 0–3 °C and quantify electricity and R717 loss."
    quantitative_reference: "kg chilled goat liver"
  - id: vacuum_packaging
    name: "PA/PE vacuum packaging and corrugated casing"
    inclusion: "required"
    inclusion_condition: "Every covered chilled-liver lot."
    role: "Protect the selected product and establish declared net pack mass."
    quantitative_reference: "kg vacuum-packed goat liver"
  - id: cold_holding_dispatch
    name: "Refrigerated holding and dispatch"
    inclusion: "required"
    inclusion_condition: "Every covered packaged lot until slaughterhouse dispatch."
    role: "Maintain 0–3 °C and deliver the reference product."
    quantitative_reference: "1,000 kg net chilled goat liver"
  - id: lot_sanitation
    name: "Lot-attributable sanitation and effluent handling"
    inclusion: "required"
    inclusion_condition: "Direct lot records or a disclosed allocation of shared sanitation are required for every covered lot."
    role: "Clean and disinfect equipment and surfaces; route wastewater and solids without hiding direct emissions."
    quantitative_reference: "sanitation attributable to 1,000 kg net product"
