allocation_rules:
  - rule_id: allocation_avoid_where_possible
    applies_to: "Separable post-slaughter operations"
    rule: "Assign liver-specific washing, chilling, packaging, cold holding, and directly measured trimming burdens to liver by subdivision; do not allocate those burdens across the carcass and unrelated organs."
    source_ids:
      - lefeon-2020-slaughter-allocation
  - rule_id: allocation_joint_slaughter_base
    applies_to: "Live-goat upstream, slaughter, bleeding, and joint evisceration burdens"
    rule: "Use one declared primary allocation method with lot-specific coproduct masses and destinations. The primary result must not silently switch between mass, economic, or biophysical allocation."
    source_ids:
      - lefeon-2020-slaughter-allocation
  - rule_id: allocation_mass_sensitivity
    applies_to: "Joint slaughter outputs"
    rule: "Calculate a wet-mass sensitivity using AF_liver_mass = M_liver / sum(M_i) over all marketable coproduct outputs included in the joint system; excluded waste receives no coproduct share but its treatment remains in the system."
    source_ids:
      - lefeon-2020-slaughter-allocation
  - rule_id: allocation_economic_sensitivity
    applies_to: "Joint slaughter outputs"
    rule: "Calculate an economic sensitivity using AF_liver_economic = (M_liver * P_liver) / sum(M_i * P_i) with contemporaneous lot- or period-specific prices, common currency and price basis; zero-value and waste destinations are disclosed."
    source_ids:
      - lefeon-2020-slaughter-allocation
  - rule_id: allocation_no_lamb_default
    applies_to: "Goat-specific model"
    rule: "Lamb allocation factors may demonstrate sensitivity but are not goat defaults. If goat-specific biophysical data are unavailable, disclose the evidence gap rather than transplanting a lamb factor."
    source_ids:
      - lefeon-2020-slaughter-allocation
  - rule_id: allocation_sanitation
    applies_to: "Shared sanitation and cold-room operations"
    rule: "Prefer submetering and event records; otherwise allocate shared electricity, water, chemicals, effluent, and cold-room loads using a disclosed causal driver such as equipment time, cleaned area, or mass-time occupancy, and test the driver where material."
    source_ids:
      - fao-who-cxc-58-2005
dataset_production:
  collection_protocols:
    - protocol_id: cp_live_goat_and_slaughter
      process_id: "slaughter_bleeding"
      flow_role: "live goat, bled body, lot identity"
      record_type: "scale_and_slaughter_log"
      raw_fields: "lot_id; animal_ids; accepted_live_mass_kg; bled_body_mass_kg; slaughter_time; scale_id"
      collection_method: "Calibrated scales and linked slaughter log."
      unit: "kg; timestamp"
      frequency: "Every lot"
      temporal_coverage: "All covered lots in reporting period"
      site_scope: "Slaughterhouse"
      aggregation_rule: "Sum accepted masses by lot; preserve animal-to-lot link."
      quality_evidence: "Scale calibration, acceptance records, slaughter log reconciliation."
    - protocol_id: cp_slaughter_utilities
      process_id: "slaughter_bleeding"
      flow_role: "slaughter water and electricity"
      record_type: "meter_and_equipment_log"
      raw_fields: "lot_id; water_meter_open_m3; water_meter_close_m3; electricity_meter_open_kWh; electricity_meter_close_kWh; equipment_id; runtime_h"
      collection_method: "Dedicated meters or documented equipment-time calculation."
      unit: "m3; kWh; h"
      frequency: "Every lot or meter interval"
      temporal_coverage: "Representative operation including cleaning boundaries"
      site_scope: "Slaughter area"
      aggregation_rule: "Difference meters; allocate only shared intervals with disclosed driver."
      quality_evidence: "Meter IDs, calibration, interval completeness, equipment ratings."
    - protocol_id: cp_evisceration_liver
      process_id: "evisceration_separation"
      flow_role: "organ identity, liver and utility records"
      record_type: "inspection_scale_and_meter_log"
      raw_fields: "lot_id; animal_id; carcass_id; inspection_disposition; liver_with_gallbladder_kg; evisceration_water_m3; evisceration_electricity_kWh; transfer_time"
      collection_method: "Carcass-organ identity tags, inspection records, calibrated scales and meters."
      unit: "kg; m3; kWh; timestamp"
      frequency: "Every animal and lot"
      temporal_coverage: "All covered lots"
      site_scope: "Evisceration and inspection line"
      aggregation_rule: "Sum only fit goat liver assigned to the selected lot; keep other organ masses separate."
      quality_evidence: "Inspection signature, identity-chain audit, scale and meter checks."
    - protocol_id: cp_coproduct_mass_destination
      process_id: "slaughter_bleeding_evisceration_separation"
      flow_role: "individual coproduct and waste destinations"
      record_type: "scale_destination_and_price_log"
      raw_fields: "lot_id; row_id; wet_mass_kg; disposition; destination; invoice_id; price_currency_per_kg; price_basis; price_date"
      collection_method: "Calibrated mass records linked to disposition, destination, and invoice or zero-value evidence."
      unit: "kg; currency/kg; date"
      frequency: "Every lot; price by transaction"
      temporal_coverage: "All covered lots and a representative price period"
      site_scope: "Slaughterhouse"
      aggregation_rule: "Aggregate by exact row_id and destination; never combine organs for allocation."
      quality_evidence: "Scale calibration, dispatch notes, invoices, waste manifests."
    - protocol_id: cp_trimming_liver
      process_id: "liver_trimming"
      flow_role: "liver input, trimmed liver, gallbladder, condemned liver"
      record_type: "scale_and_disposition_log"
      raw_fields: "lot_id; liver_input_kg; trimmed_liver_kg; gallbladder_bile_kg; condemned_liver_kg; electricity_kWh; disposition; operator; time"
      collection_method: "Calibrated before/after scales, disposition records, and electricity meter or equipment-time log."
      unit: "kg; kWh; timestamp"
      frequency: "Every lot"
      temporal_coverage: "All covered lots"
      site_scope: "Liver trimming line"
      aggregation_rule: "Maintain liver_input_kg = trimmed_liver_kg + gallbladder_bile_kg + condemned_liver_kg + documented_mass_difference_kg."
      quality_evidence: "Scale calibration, inspection disposition, balance reconciliation."
    - protocol_id: cp_liver_washing
      process_id: "liver_washing"
      flow_role: "liver and direct wash-water records"
      record_type: "scale_meter_and_temperature_log"
      raw_fields: "lot_id; trimmed_liver_kg; washed_drained_liver_kg; wash_water_input_m3; wash_water_discharge_m3; water_potability_record; wash_start; wash_end"
      collection_method: "Calibrated scales, dedicated water meter, and potability records."
      unit: "kg; m3; timestamp"
      frequency: "Every lot"
      temporal_coverage: "All covered lots"
      site_scope: "Dedicated liver-washing line"
      aggregation_rule: "Sum by lot; keep sanitation water outside the wash-water field."
      quality_evidence: "Potability certificate, meter and scale calibration, lot reconciliation."
    - protocol_id: cp_chilling
      process_id: "forced_air_chilling"
      flow_role: "liver mass, electricity, time-temperature path"
      record_type: "scale_meter_and_temperature_log"
      raw_fields: "lot_id; liver_input_kg; liver_output_kg; chiller_id; electricity_kWh; product_temp_start_degC; product_temp_end_degC; temp_points; start_time; end_time; fan_runtime_h"
      collection_method: "Calibrated product probes, continuous logger, scales, and chiller submeter."
      unit: "kg; kWh; °C; timestamp; h"
      frequency: "Every lot; continuous temperature"
      temporal_coverage: "All covered lots and seasonal operating conditions"
      site_scope: "Selected forced-air chiller"
      aggregation_rule: "Accept only lots with continuous decrease and all dispatch-bound product at 0–3 °C; sum electricity by meter interval."
      quality_evidence: "Probe calibration, logger completeness, alarm and corrective-action records."
    - protocol_id: cp_packaging
      process_id: "vacuum_packaging"
      flow_role: "product and individual packaging components"
      record_type: "scale_issue_and_waste_log"
      raw_fields: "lot_id; net_liver_kg; pa_pe_issued_kg; pa_pe_returned_kg; label_issued_kg; label_returned_kg; corrugated_issued_kg; corrugated_returned_kg; lldpe_roll_open_kg; lldpe_roll_close_kg; each_waste_kg; electricity_kWh; seal_test_result"
      collection_method: "Calibrated product scales, material issue/return weights, waste weights, electricity meter, and seal test."
      unit: "kg; kWh"
      frequency: "Every packaging lot"
      temporal_coverage: "All covered lots"
      site_scope: "Packaging line"
      aggregation_rule: "Calculate each material use and waste separately; never include packaging in net liver mass."
      quality_evidence: "Scale calibration, bill of materials, issue/return records, seal integrity tests."
    - protocol_id: cp_cold_holding
      process_id: "cold_holding_dispatch"
      flow_role: "product mass, occupancy, electricity, temperature"
      record_type: "dispatch_meter_and_logger"
      raw_fields: "lot_id; net_liver_kg; cold_room_id; entry_time; dispatch_time; mass_time_kg_h; electricity_kWh; product_temp_points_degC; room_temp_points_degC; dispatch_temp_degC"
      collection_method: "Dispatch scales, continuous temperature logger, occupancy record, and submeter."
      unit: "kg; kg*h; kWh; °C; timestamp"
      frequency: "Every lot; continuous temperature"
      temporal_coverage: "Full holding period"
      site_scope: "Selected cold room"
      aggregation_rule: "Allocate shared electricity by measured mass-time occupancy unless a better causal submeter exists."
      quality_evidence: "Probe and scale calibration, logger completeness, dispatch record."
    - protocol_id: cp_refrigerant
      process_id: "forced_air_chilling_cold_holding_dispatch"
      flow_role: "R717 charge and loss"
      record_type: "refrigerant_service_log"
      raw_fields: "equipment_id; period_start; period_end; opening_charge_kg; additions_kg; closing_charge_kg; recovered_kg; service_event; leak_location; allocation_driver"
      collection_method: "Technician-verified inventory and service-cylinder mass records by equipment."
      unit: "kg; date"
      frequency: "Each service event and reporting period"
      temporal_coverage: "Period covering all reported lots"
      site_scope: "Selected R717 systems"
      aggregation_rule: "Apply R717_loss = opening_charge + additions - closing_charge - recovered; allocate by equipment and documented causal time."
      quality_evidence: "Service tickets, cylinder weights, inventory reconciliation, leak repair records."
    - protocol_id: cp_sanitation
      process_id: "lot_sanitation"
      flow_role: "water, electricity, NaOH and peracetic acid"
      record_type: "meter_issue_and_concentration_log"
      raw_fields: "event_id; lot_ids; cleaned_area_m2; equipment_time_h; water_m3; electricity_kWh; naoh_solution_kg; naoh_fraction; paa_solution_kg; paa_fraction; unused_return_kg"
      collection_method: "Event meters, chemical issue/return weights, concentration certificates, and sanitation schedule."
      unit: "m2; h; m3; kWh; kg; mass fraction"
      frequency: "Every sanitation event"
      temporal_coverage: "Events attributable to covered lots"
      site_scope: "Slaughter, offal, chilling, packaging and cold-room areas"
      aggregation_rule: "Attribute event inputs by direct lot record or disclosed cleaned-area/equipment-time driver."
      quality_evidence: "Meter checks, chemical certificate, sanitation completion and verification records."
    - protocol_id: cp_effluent
      process_id: "slaughter_bleeding_liver_washing_lot_sanitation"
      flow_role: "wastewater, screened solids, and direct-discharge pollutants"
      record_type: "flow_composite_sample_and_waste_log"
      raw_fields: "stream_id; route; volume_m3; sample_start; sample_end; COD_kg_per_m3; BOD5_kg_per_m3; TN_kg_per_m3; TP_kg_per_m3; TSS_kg_per_m3; screened_solids_kg; treatment_manifest"
      collection_method: "Calibrated flow measurement, time- or flow-proportional composite sample, accredited analysis, and waste manifest."
      unit: "m3; kg/m3; kg; timestamp"
      frequency: "Each discharge event or representative composite interval"
      temporal_coverage: "Full production and sanitation coverage"
      site_scope: "Final discharge point and each segregated waste stream"
      aggregation_rule: "Calculate each pollutant mass separately. If route = treatment_service, do not also report untreated direct emissions."
      quality_evidence: "Sampler and flow-meter calibration, laboratory report, chain of custody, manifest reconciliation."
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "All inventory rows"
      rule: "normalized_amount = attributable_amount / net_chilled_liver_kg * 1000"
      inputs:
        - attributable_amount
        - net_chilled_liver_kg
      output: "amount per 1,000 kg net chilled goat liver"
      source_ids: []
    - id: calc_trimming_balance
      applies_to: "liver_trimming"
      rule: "documented_mass_difference_kg = liver_input_kg - trimmed_liver_kg - gallbladder_bile_kg - condemned_liver_kg"
      inputs:
        - liver_input_kg
        - trimmed_liver_kg
        - gallbladder_bile_kg
        - condemned_liver_kg
      output: "documented mass difference"
      source_ids:
        - fao-small-ruminant-slaughter
    - id: calc_washing_wastewater
      applies_to: "liver_washing"
      rule: "wash_wastewater_m3 = wash_water_input_m3 - retained_water_m3 - documented_loss_m3"
      inputs:
        - wash_water_input_m3
        - retained_water_m3
        - documented_loss_m3
      output: "liver-washing wastewater volume"
      source_ids:
        - fao-small-ruminant-sanitation
    - id: calc_refrigerant_loss
      applies_to: "R717 systems"
      rule: "R717_loss = opening_charge + additions - closing_charge - recovered"
      inputs:
        - opening_charge_kg
        - additions_kg
        - closing_charge_kg
        - recovered_kg
      output: "R717 emitted to air before equipment/time allocation"
      source_ids: []
    - id: calc_pollutant_mass
      applies_to: "Direct final effluent"
      rule: "pollutant_mass = final_effluent_volume * measured_pollutant_concentration"
      inputs:
        - final_effluent_volume
        - measured_pollutant_concentration
      output: "separate COD, BOD5, TN, TP, or TSS mass"
      source_ids:
        - fao-small-ruminant-sanitation
    - id: calc_mass_allocation
      applies_to: "Joint slaughter burdens"
      rule: "AF_liver_mass = M_liver / sum(M_i)"
      inputs:
        - "wet masses of all marketable coproduct outputs in the joint system"
      output: "liver wet-mass allocation factor"
      source_ids:
        - lefeon-2020-slaughter-allocation
    - id: calc_economic_allocation
      applies_to: "Joint slaughter burdens"
      rule: "AF_liver_economic = (M_liver * P_liver) / sum(M_i * P_i)"
      inputs:
        - "coproduct wet masses and contemporaneous prices on one basis"
      output: "liver economic allocation factor"
      source_ids:
        - lefeon-2020-slaughter-allocation
    - id: calc_cold_room_share
      applies_to: "Shared cold-room electricity"
      rule: "lot_electricity = interval_electricity * lot_mass_time / sum(all_mass_time)"
      inputs:
        - interval_electricity_kWh
        - lot_mass_time_kg_h
        - all_mass_time_kg_h
      output: "cold-holding electricity attributable to the lot"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and all internal liver transfers"
      requirement: "Preserve goat species, liver tissue, chilled state, slaughter lot, carcass/organ link through inspection, and package lot."
      evidence: "Identity tags, inspection record, transfer and dispatch logs."
    - id: dq_mass_balance
      applies_to: "Slaughter and liver-processing chain"
      requirement: "Reconcile live mass, bled body, separately measured coproducts and wastes, liver input/output, packaging-excluded net product, and documented mass differences."
      evidence: "Calibrated scale records and signed balance review."
    - id: dq_temperature
      applies_to: "Chilling and holding"
      requirement: "Continuous records must show a decreasing chilling path and 0–3 °C product at packaging transfer and dispatch; retain alarms and corrective actions."
      evidence: "Calibrated probe certificates, raw logger export, release record."
    - id: dq_temporal
      applies_to: "Utilities, refrigerant, prices, and effluent"
      requirement: "Meter intervals, refrigerant periods, price periods, and sampling intervals must overlap the production period and disclose any extrapolation."
      evidence: "Meter timestamps, service records, invoices, sampler timestamps."
    - id: dq_completeness
      applies_to: "Atomic inventory"
      requirement: "Confirm every actually used utility, material, chemical, package component, refrigerant, coproduct, waste, wastewater stream, and direct emission has one specific card or a documented zero/not-applicable gate."
      evidence: "Purchase/issue reconciliation, process walk-through, waste and discharge manifests."
    - id: dq_allocation
      applies_to: "Joint slaughter and shared operations"
      requirement: "Retain all masses, destinations, prices, denominators, and causal drivers needed to reproduce primary and sensitivity allocation results."
      evidence: "Allocation workbook linked to raw mass and price evidence."
    - id: dq_no_default_quantities
      applies_to: "All quantitative inventory"
      requirement: "Do not insert an unverified default for goat-liver yield, utility demand, packaging, refrigerant loss, or effluent pollutant load. Missing foreground evidence is an explicit evidence gap."
      evidence: "Data-gap register and reviewer sign-off."
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Fail if species is not goat, tissue is not liver, state is not chilled, gallbladder removal or trimming specification is missing, package route differs without separate review, or the reference product UUID differs from 378f6bb6-a27a-41ef-890a-2243f652a9fc."
    source_ids:
      - unsd-cpc3-21156
  - rule_id: validate_temperature
    applies_to: "Chilling and dispatch"
    rule: "Fail if final product has any recorded temperature above 3 °C, if dispatch temperature is below 0 °C, or if the time-temperature record is incomplete."
    source_ids:
      - eu-reg-853-2004
      - fao-who-cxc-58-2005
  - rule_id: validate_route_exclusivity
    applies_to: "Product route"
    rule: "Fail if fresh unchilled, frozen, or another organ route is averaged with this chilled whole-liver route."
    source_ids:
      - unsd-cpc3-21156
  - rule_id: validate_inspection_chain
    applies_to: "Evisceration and trimming"
    rule: "Fail if the liver cannot be linked to its carcass through post-mortem disposition or if condemned tissue enters edible output."
    source_ids:
      - eu-reg-853-2004
      - fao-small-ruminant-slaughter
  - rule_id: validate_atomic_flows
    applies_to: "Process inventory"
    rule: "Fail if an actual input or output is represented by a collection card such as energy, materials, chemicals, fuels, refrigerants, packaging, wastes, or emissions instead of one specific exchange per card."
    source_ids:
      - fao-who-cxc-58-2005
  - rule_id: validate_mass_balance
    applies_to: "Liver chain"
    rule: "Fail if an unexplained mass difference exceeds the facility's documented scale uncertainty and no corrective record closes the discrepancy."
    source_ids:
      - fao-small-ruminant-slaughter
  - rule_id: validate_effluent_gate
    applies_to: "Effluent inventory"
    rule: "Fail if the same wastewater or untreated pollutant mass is counted both as a waste flow to treatment and as a direct elementary emission."
    source_ids:
      - fao-small-ruminant-sanitation
  - rule_id: validate_refrigerant
    applies_to: "R717 systems"
    rule: "Fail if R717 additions are recorded without equipment-level balance, or if calculated loss is omitted from air emissions."
    source_ids:
      - fao-who-cxc-58-2005
  - rule_id: validate_allocation_sensitivity
    applies_to: "Joint slaughter burdens"
    rule: "Fail if joint burdens lack one declared primary allocation and both lot-specific wet-mass and economic sensitivity results, or if a lamb factor is used as an undisclosed goat default."
    source_ids:
      - lefeon-2020-slaughter-allocation
  - rule_id: validate_source_closure
    applies_to: "Evidence references"
    rule: "Fail if a source id used by a row or rule is absent from section 11, or if a listed source id is unused."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for chilled whole goat liver at the slaughterhouse dispatch gate."
  downstream_use: "secondary_dataset; background_dataset after review and publication."
  allowed_use: "LCA of products using chilled whole goat liver with matching species, tissue, trimming, washing, chilling, package, temperature, geography, technology, and allocation context."
  excluded_use: "Mixed offal; another goat organ; sheep or other species; fresh unchilled or frozen liver; prepared or preserved liver; a route lacking slaughter coproduct allocation; a product outside the 0–3 °C dispatch gate."
  required_metadata: "PCR id and version; CPC 21156; reference UUID; species; tissue; state; trimming and washing specifications; facility and geography; slaughter and processing period; chilling equipment and refrigerant; time-temperature evidence; packaging bill; sanitation and wastewater route; allocation method and sensitivity factors; data gaps."
  required_quality_disclosure: "Primary versus calculated records; scale, meter, logger and laboratory coverage; missing data and extrapolations; mass-balance closure; refrigerant reconciliation; effluent route; coproduct destinations and prices; allocation sensitivity; package exclusion from net mass."
  update_trigger: "Change in organ or state; slaughter boundary; trimming or washing specification; cooling technology or refrigerant; dispatch-temperature specification; package configuration; sanitation chemistry; effluent route; coproduct destination or price structure; allocation method; regulatory requirements; reference-flow identity."
