    type: "standard"
    reference: "FAO and WHO, General Principles of Food Hygiene, CXC 1-1969, revised 2022, Rome 2023, DOI 10.4060/cc6125en, https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXC%2B1-1969%2FCXC_001e.pdf (retrieved 2026-08-11)"
    used_for: "Food-processing scope; time-temperature records; safe water; cleaning and disinfection cycles; drainage, wastewater, and waste-management process inclusion; quality evidence for product-state declarations"
  - id: "codex-cxc-58-2005"
