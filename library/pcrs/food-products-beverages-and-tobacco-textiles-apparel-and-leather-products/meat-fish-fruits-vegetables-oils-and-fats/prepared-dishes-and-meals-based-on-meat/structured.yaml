  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground rows"
      rule: "Normalized amount = attributable row amount / net conforming product mass released at factory gate"
      inputs:
        - "Attributable amount"
        - "net conforming product mass"
      output: "Amount per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_batch_mass_balance
      applies_to: "Preparation, thermal processing, post-cook handling, and residual management"
      rule: "Reconcile inputs and opening inventory against products, co-products, wastes, closing inventory, and explained evaporation or moisture change; investigate and disclose the residual rather than forcing it to zero"
      inputs:
        - cp_ingredient_bom
        - cp_mass_balance
        - cp_waste_records
        - cp_water_records
      output: "Process- and period-level mass balance with explained residual"
      source_ids:
        - eu-pef-method-2021
    - id: calc_shared_utility_allocation
      applies_to: "Shared energy, water, storage, cleaning, and treatment systems"
      rule: "Apply the allocation hierarchy: direct sub-metering or subdivision first; otherwise use a documented causal physical driver; use another relationship only with justification and sensitivity"
      inputs:
        - "Shared utility total"
        - "covered and total driver quantities"
      output: "Attributable utility amount by product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_inbound_transport
      applies_to: "Supplier-to-site transport not embedded upstream"
      rule: "Transport work = delivered mass in tonnes × route distance in kilometres, summed by mode and leg"
      inputs:
        - "cp_inbound_transport fields"
      output: "tkm per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_refrigerant_loss
      applies_to: "Cooling and storage equipment"
      rule: "Refrigerant loss = opening charge + additions − recovered mass − closing charge; resolve any negative result as a data-quality error before normalization"
      inputs:
        - "cp_refrigerant_records fields"
      output: "kg leakage by substance per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_direct_emission
      applies_to: "On-site combustion and treatment emissions"
      rule: "Emitted mass by substance = measured mass or collected activity data × disclosed factor, adjusted only by documented control efficiency; do not use the provisional QA range as a factor"
      inputs:
        - "cp_direct_emissions fields"
      output: "kg direct emission by substance per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_waterborne_release
      applies_to: "Direct wastewater discharge"
      rule: "Emitted mass = representative concentration × matching discharge volume with explicit unit conversion; state non-detect handling and treatment state"
      inputs:
        - "cp_wastewater_quality fields"
      output: "kg released substance per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Product, ingredients, packaging, wastes, and source data"
      requirement: "Retain product formulation, lot or batch, supplier, site, reporting period, flow identity, and unit basis so every aggregated value can be traced to its source records."
      evidence: "Batch genealogy, purchase and issue records, specifications, and data extract audit trail"
    - id: dq_temporal_coverage
      applies_to: "Foreground activity data"
      requirement: "Use one representative reporting period that covers declared seasonal, recipe, route, and operating variation. State excluded shutdowns, campaigns, missing intervals, and any extrapolation."
      evidence: "Coverage table, production calendar, meter completeness, and gap log"
    - id: dq_representativeness
      applies_to: "Foreground and upstream datasets"
      requirement: "Assess technological, geographical, and time-related representativeness and precision. Explain proxies and mismatches for meat species, ingredient technology, electricity geography, packaging, transport, treatment, and market state."
      evidence: "Representativeness assessment and proxy justification"
    - id: dq_completeness_consistency
      applies_to: "Complete inventory"
      requirement: "Demonstrate completeness and methodological consistency for ingredients, packaging, utilities, products, co-products, wastes, wastewater, and direct releases. Apply consistent wet/dry, gross/net, and edible/package mass bases."
      evidence: "Mass, water, energy, and waste reconciliation; documented cut-off screen"
    - id: dq_measurement_control
      applies_to: "Scales, meters, temperature sensors, laboratory data, and calculated values"
      requirement: "Retain calibration or verification status, resolution, sampling basis, conversion factors, and calculation worksheets. Do not replace foreground values with provisional PCR screening ranges."
      evidence: "Calibration certificates, laboratory reports, formulas, and review record"
    - id: dq_method_disclosure
      applies_to: "Allocation, cut-off, data gaps, and downstream exclusions"
      requirement: "Document the allocation hierarchy applied, every exclusion, cumulative cut-off evidence, data gaps, proxy datasets, and the gate nature of the published dataset."
      evidence: "Method statement, sensitivity where relevant, limitation register, and reviewer evidence"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require exactly 1 kg net edible product using Sauce braised products UUID 61b586fc-1d4a-4abe-981d-19c27f9a33b0, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg. Reject packaging-inclusive reference mass."
    source_ids: []
  - rule_id: validate_representative_flow_scope
    applies_to: "Product identity"
    rule: "Require a declaration that Sauce braised products is the representative real CPC 21186 product flow, not a generic name for all meat-based dishes. For another covered product, require the actual product name and a representativeness limitation."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "Functional unit and reference product"
    rule: "Require all listed qualifiers, including meat species and content basis, formulation family, readiness state, process route, market state, packaging, storage temperature, shelf-life, geography, and production period."
    source_ids:
      - eu-pef-method-2021
      - codex-cxc-1-1969-2022
      - codex-cxc-58-2005
  - rule_id: validate_process_coverage
    applies_to: "Foreground process map"
    rule: "Require all applicable receiving, preparation, thermal, post-cook, packaging, cleaning, residual-management, and finished-storage operations. Any omitted applicable operation shall be justified and assessed under the cut-off rule."
    source_ids:
      - eu-pef-method-2021
      - codex-cxc-1-1969-2022
      - codex-cxc-58-2005
  - rule_id: validate_mass_balance
    applies_to: "Product routes and reporting period"
    rule: "Require reconciled ingredient, product, co-product, rework, waste, wastewater-solids, inventory-change, evaporation, and moisture-change terms. Unexplained residuals shall be reported and resolved; do not force balance by adjusting the reference product."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_no_double_counting
    applies_to: "Upstream and foreground modelling"
    rule: "Reject duplicate upstream burdens, internal-transfer exchanges, treatment emissions, or rework. Purchased energy includes upstream supply while only on-site direct emissions are elementary foreground outputs."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_allocation_hierarchy
    applies_to: "Shared and multifunctional processes"
    rule: "Require subdivision or system expansion assessment first, a relevant physical relationship second, and another relationship only with justification. Require drivers and allocated totals to reconcile to the shared total."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_cutoff_and_completeness
    applies_to: "Exclusions and inventory completeness"
    rule: "Reject cut-off of specified important flows. For any other exclusion, require documented screening, cumulative 3% checks for material, energy, and environmental significance, and limitation disclosure."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_food_process_records
    applies_to: "Thermal processing, cooling, storage, water, and sanitation"
    rule: "Require route-appropriate time-temperature, water-source, cleaning-cycle, and waste-disposition records sufficient to support the inventory and declared product state."
    source_ids:
      - codex-cxc-1-1969-2022
      - codex-cxc-58-2005
  - rule_id: validate_provisional_ranges
    applies_to: "Every reasoned_estimate range"
    rule: "Treat provisional ranges only as QA screens. Require actual dataset amounts from foreground records or calculations, and flag any use of a provisional bound as a default emission factor or final amount."
    source_ids: []
published_dataset_profile:
  dataset_role: "Factory-gate foreground production dataset for a declared prepared meat-based dish or meal"
  downstream_use: "secondary_dataset; background_dataset for lifecycle models whose product, technology, geography, market state, packaging, and time period match the declared profile"
  allowed_use: "Modelling production of the declared prepared meat-based dish or meal through factory-gate release; comparative or aggregate use only after checking reference-flow, recipe, meat species, processing route, packaging, storage, allocation, and data-quality compatibility"
  excluded_use: "Generic representation of every CPC 21186 product without qualification; raw meat, slaughter, meat preparation sold raw, fish- or vegetable-based meals, catering service, retail, consumer cooking, consumption, or end-of-life without additional modules; use of provisional ranges as final inventory factors"
  required_metadata: "PCR id and version state; actual product name; representative-flow relationship; CPC mapping context; meat species and content basis; recipe family; preparation and thermal route; ready state; chilled, frozen, or shelf-stable state; packaging; net mass basis; site and geography; production period; storage temperature and shelf-life; included and excluded stages; allocation; cut-offs; upstream dataset list"
  required_quality_disclosure: "Foreground period and coverage; mass, water, energy, and waste reconciliation; meter and scale status; ingredient and packaging BoM specificity; technological, geographical, and temporal representativeness; precision; proxies; data gaps; allocation drivers; exclusions; direct-emission calculation methods; status of every provisional range"
  update_trigger: "Material change in recipe or meat-content basis, meat species, thermal route, packaging, market state, storage requirement, site or geography, energy or water system, waste or wastewater treatment, allocation method, reference-flow identity, source method, or foreground data older than the producer's accepted representativeness period"
data_sources:
  - id: "eu-pef-method-2021"
    type: "official_guidance"
    reference: "European Commission, Commission Recommendation (EU) 2021/2279 on the use of the Environmental Footprint methods, Annex I Product Environmental Footprint method, CELEX 32021H2279, https://eur-lex.europa.eu/eli/reco/2021/2279/oj/eng/pdf (retrieved 2026-08-11)"
    used_for: "Functional-unit dimensions; supply-chain system boundary; company-specific BoM and manufacturing data; co-product, by-product, and waste disclosure; allocation hierarchy; cut-off controls; completeness and data-quality requirements"
