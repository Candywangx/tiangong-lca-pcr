    reference: "Codex Alimentarius Commission, Code of Hygienic Practice for Meat, CXC 58-2005, https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXC%2B58-2005%2FCXC_058e.pdf (retrieved 2026-08-11)"
    used_for: "Meat preparation and manufactured-meat identity; temperature-controlled handling; cooling, chilling, packaging, sanitation, wastewater, and waste process decomposition; product and waste-status evidence"
