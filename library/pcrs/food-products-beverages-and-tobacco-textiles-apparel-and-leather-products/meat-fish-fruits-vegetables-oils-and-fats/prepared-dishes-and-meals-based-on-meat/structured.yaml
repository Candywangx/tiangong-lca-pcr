allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared lines, utilities, storage, cleaning, and treatment processes"
    rule: "Avoid allocation by sub-metering, batch tracking, or subdividing processes so that inputs, outputs, and emissions directly attributable to the covered product are isolated. System expansion may be used only when the additional function and reporting purpose are explicit."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical_driver
    applies_to: "Shared burdens that cannot be subdivided"
    rule: "Allocate using a documented causal physical driver such as measured equipment time, energy demand, mass-time storage occupancy, cleaning cycle, wastewater load, or product mass when that driver represents the relationship between the shared process and outputs."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_other_relationship_last
    applies_to: "Multifunctional processes with no defensible physical relationship"
    rule: "Use another relationship, including economic allocation, only after documenting why subdivision, system expansion, and a relevant physical relationship are not feasible. Record prices, period, market, and sensitivity where economic allocation is used."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rework_internal_loop
    applies_to: "Rework returned to the same covered product system"
    rule: "Treat internal rework as an internal mass loop. Count only added processing burdens and losses; do not create an external co-product credit or duplicate the rework input."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_product_waste_status
    applies_to: "Fats, broths, trimmings, rejects, packaging residues, and wastewater"
    rule: "Classify an output as a co-product only when it meets a declared product specification and has a documented beneficial destination. Otherwise model it as waste with its treatment route. Keep the classification and any allocation decision consistent across mass balance, inventory, and dataset metadata."
    source_ids:
      - eu-pef-method-2021
      - codex-cxc-58-2005
dataset_production:
  collection_protocols:
    - protocol_id: cp_ingredient_bom
      process_id: "ingredient_receiving_storage_preparation_formulation"
      flow_role: "Meat and other ingredient receipt, acceptance, issue, and internal transfer"
      record_type: "Purchase, receiving, warehouse issue, recipe, batch, and weigh-scale records"
      raw_fields: "ingredient_id; supplier; lot; species_or_material; physical_state; received_mass; accepted_mass; issued_mass; rework_mass; basis; batch_id"
      collection_method: "Reconcile calibrated scale and ERP or batch records by ingredient and formulation"
      unit: "kg"
      frequency: "Each receipt and batch"
      temporal_coverage: "Representative reporting period covering declared season and product mix"
      site_scope: "Every included site and covered line"
      aggregation_rule: "Sum accepted and issued mass by ingredient, exclude unrelated products, and normalize by conforming reference-product mass"
      quality_evidence: "Scale calibration, lot traceability, recipe revision, acceptance record, and mass reconciliation"
    - protocol_id: cp_inbound_transport
      process_id: "ingredient_receiving_storage"
      flow_role: "Supplier-to-site transport"
      record_type: "Delivery note, route, carrier, vehicle-mode, and distance record"
      raw_fields: "material_id; delivered_mass_t; origin; destination; mode; distance_km; load_factor_if_used; upstream_dataset_scope"
      collection_method: "Collect actual route records where available; otherwise document route model and distance source"
      unit: "tkm"
      frequency: "Each route or representative route class"
      temporal_coverage: "Same period as ingredient receipts"
      site_scope: "All material groups crossing the site gate"
      aggregation_rule: "Sum mass_t × distance_km by mode and avoid duplication with delivered-product datasets"
      quality_evidence: "Delivery notes, route evidence, and scope check"
    - protocol_id: cp_water_records
      process_id: "preparation_formulation_thermal_processing_cleaning_sanitation"
      flow_role: "Ingredient, process, cleaning, abstracted, and discharged water"
      record_type: "Meter, recipe, sanitation-cycle, abstraction, and discharge records"
      raw_fields: "meter_id; source_route; use_route; opening; closing; unit; batch_or_period; discharge_route"
      collection_method: "Read dedicated meters where available and reconcile shared meters by documented driver"
      unit: "kg or m3"
      frequency: "Each batch, sanitation cycle, or meter interval"
      temporal_coverage: "Representative reporting period"
      site_scope: "Every included site and water route"
      aggregation_rule: "Convert only with declared density; preserve original unit; reconcile water input, product incorporation, evaporation, and wastewater"
      quality_evidence: "Meter calibration, invoices, abstraction permits, recipe records, and water balance"
    - protocol_id: cp_utilities
      process_id: "ingredient_receiving_storage_preparation_formulation_thermal_processing_post_cook_packaging_finished_storage_dispatch"
      flow_role: "Electricity, fuel, steam, heat, refrigeration, and utility consumption"
      record_type: "Meter, invoice, fuel issue, equipment runtime, and production records"
      raw_fields: "carrier; meter_id; opening; closing; unit; heating_value_basis; runtime; batch_id; line_id; product_mass"
      collection_method: "Prefer sub-metering; otherwise allocate shared utilities with a documented causal driver"
      unit: "kWh, MJ, or carrier unit"
      frequency: "Meter interval and production batch"
