measurement_rules:
  - id: reference_product_mass
    applies_to: "Conforming prepared dish or meal at factory-gate release"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record net edible product mass after cooking, cooling, draining where applicable, and before or after packaging only as declared; exclude packaging mass. Normalize all foreground inventory to 1 kg reference product."
  - id: ingredient_mass_consistency
    applies_to: "Meat, other ingredients, sauces, edible process water, rework, and recipe additions"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert batch recipe and issue records to kg on a consistent as-received or prepared basis and declare the basis for moisture-bearing, frozen, concentrated, or reconstituted inputs."
  - id: packaging_mass_separation
    applies_to: "Primary, secondary, and tertiary packaging entering the gate system"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report packaging separately by material and level; packaging shall not be included in the 1 kg edible reference-product mass."
  - id: energy_unit_preservation
    applies_to: "Electricity, steam, fuel, hot water, refrigeration, and other energy services"
    required_property_ref:
      name: "Applicable energy property"
      uuid: ""
    required_unit: "kWh or MJ, as recorded"
    rule: "Preserve the metered or invoice unit, document every conversion and heating-value basis, and avoid converting energy carriers into mass without an explicit conversion factor."
  - id: water_route_separation
    applies_to: "Ingredient water, process water, cleaning water, direct abstraction, and wastewater"
    required_property_ref:
      name: "Mass or volume, consistently converted"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Separate water by use and source route. Use measured density or the declared water-density convention for mass-volume conversion and retain the original meter unit."
