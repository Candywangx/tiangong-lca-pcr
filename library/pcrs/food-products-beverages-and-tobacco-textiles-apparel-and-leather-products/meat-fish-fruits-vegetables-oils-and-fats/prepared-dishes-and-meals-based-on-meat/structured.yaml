system_boundary:
  rules:
    - rule_id: boundary_foreground_gate
      applies_to: "Factory-gate foreground system"
      rule: "Include receipt and controlled storage, preparation and formulation, thermal processing, post-cook handling, portioning or filling, packaging, cleaning and sanitation, wastewater and solid-waste handling, and finished-product storage through factory-gate release when they occur."
      source_ids:
        - eu-pef-method-2021
        - codex-cxc-1-1969-2022
        - codex-cxc-58-2005
    - rule_id: boundary_upstream_links
      applies_to: "Purchased products and services"
      rule: "Keep all purchased ingredients, packaging, utilities, refrigerants, transport services, and treatment services as boundary-crossing product or waste flows with representative upstream datasets; do not treat the site gate as a cut-off of their supply chains."
      source_ids:
        - eu-pef-method-2021
    - rule_id: boundary_waste_and_coproducts
      applies_to: "Foreground outputs other than the reference product"
      rule: "Identify all co-products, by-products, rework, food loss, packaging waste, wastewater, and direct elementary releases; disclose their fate and avoid combining saleable products with wastes."
      source_ids:
        - eu-pef-method-2021
        - codex-cxc-1-1969-2022
        - codex-cxc-58-2005
    - rule_id: boundary_cutoff_control
      applies_to: "Excluded processes and flows"
      rule: "Avoid cut-offs for meat and other recipe ingredients, packaging, process energy, water, reference product, saleable co-products, food losses, wastewater, and direct releases. Any other exclusion requires screening, explicit justification, and demonstration that cumulative exclusions remain within 3% of material and energy flows and environmental significance; disclose the excluded items and limitation."
      source_ids:
        - eu-pef-method-2021
    - rule_id: boundary_downstream_exclusion
      applies_to: "Distribution after factory gate, retail, consumer storage and preparation, consumption, and end-of-life"
      rule: "Exclude these stages from this gate dataset and state the exclusion. Add separate downstream modules when the study goal requires a cradle-to-grave result."
      source_ids:
        - eu-pef-method-2021
boundary_abstraction:
  declared_starting_condition: "Meat, other food ingredients, packaging, utilities, and purchased services received at the preparing establishment, with temperature, physical state, supplier geography, and upstream dataset identity declared"
  starting_condition_role: "Factory-gate foreground starting point; upstream agriculture, slaughter, meat processing, ingredient manufacture, packaging manufacture, energy supply, and inbound transport remain connected background requirements"
  product_classification_scope: "Prepared dishes and meals based on meat; the CPC 3.0 code 21186 reference is mapping context and does not replace the semantic product description"
  recursive_input_rule: "A purchased input that is itself a prepared meat-based dish or meal shall be recorded once as a product input with its own upstream dataset. Do not recursively rebuild it inside this foreground dataset. Rework generated and reused within the same reporting boundary is recorded as an internal loop and not duplicated as a new external product input."
  upstream_dataset_requirement: "Link representative upstream datasets for every meat and non-meat ingredient, packaging material, energy carrier, water supply route, purchased transport service, refrigerant make-up, waste treatment route, and wastewater treatment route that crosses the boundary"
  disclosure: "Declare included and excluded stages, product recipe family, storage state, co-products, rework, food losses, wastewater, direct emissions, packaging levels, allocation methods, cut-offs, data gaps, and whether downstream distribution, retail, use, and end-of-life are outside the dataset"
