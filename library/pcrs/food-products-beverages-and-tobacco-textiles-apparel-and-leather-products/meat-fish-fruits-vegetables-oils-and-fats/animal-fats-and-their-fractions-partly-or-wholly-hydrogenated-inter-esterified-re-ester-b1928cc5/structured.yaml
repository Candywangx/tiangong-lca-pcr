allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "separable processes, batches, meters, and product lines"
    rule: "Avoid allocation by subdividing unit processes and collecting directly attributable material, energy, emission, and waste records for the covered product."
    source_ids:
      - eu-environmental-footprint-2021-2279
  - rule_id: allocation_system_expansion
    applies_to: "multifunctional outputs with a defensible substituted function"
    rule: "If subdivision is not possible, evaluate system expansion before partitioning burdens and document the substituted function and dataset."
    source_ids:
      - eu-environmental-footprint-2021-2279
  - rule_id: allocation_physical
    applies_to: "remaining shared inputs and outputs"
    rule: "If allocation cannot be avoided, use a relevant quantifiable physical relationship that reflects the function provided; simple mass allocation is allowed only when mass is demonstrably relevant."
    source_ids:
      - eu-environmental-footprint-2021-2279
  - rule_id: allocation_other_relationship
    applies_to: "cases without a defensible physical relationship"
    rule: "Use another relationship such as economic value only after documenting why subdivision, system expansion, and physical allocation are not applicable; prices must match the process stage and reporting period."
    source_ids:
      - eu-environmental-footprint-2021-2279
  - rule_id: allocation_internal_recycle
    applies_to: "internal rework, recovered catalyst, recovered fat, and solvent or water recycle"
    rule: "Keep internal recycle inside the foreground balance and count only net purchased inputs and net outputs crossing the boundary. Do not assign avoided burdens to internal recycle."
    source_ids:
      - eu-environmental-footprint-2021-2279
  - rule_id: allocation_residue_status
    applies_to: "recovered fat, distillate, spent catalyst, filter media, and other residues"
    rule: "Classify an output as co-product, recoverable material, or waste from documented destination and market function. Disclose the allocation or treatment applied and test sensitivity when the choice is material."
    source_ids:
      - eu-environmental-footprint-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_feedstock_records
      process_id: "feedstock_receipt_conditioning"
      flow_role: "source fat, utilities, conditioned intermediate, residues, wastewater"
      record_type: "weighbridge, tank, meter, batch, supplier, laboratory, and waste-shipment records"
      raw_fields: "lot id; species/source-fat family; supplier; rendering/refining status; grade; opening/closing inventory; gross/tare/net mass; moisture; impurities; electricity; water; conditioned output; residues; wastewater; timestamps"
      collection_method: "calibrated scales and tanks, utility meters, supplier documents, laboratory results, and signed waste records"
      unit: "kg; kWh; MJ; m3"
      frequency: "each lot and batch; utility meters at least monthly or per campaign"
      temporal_coverage: "complete representative campaign and the declared reporting period"
      site_scope: "all receipt, storage, and conditioning equipment in the foreground facility"
      aggregation_rule: "reconcile inventory and batch transfers; normalize by conforming final-product mass; keep unlike species, grades, or routes separate"
      quality_evidence: "calibration status; meter coverage; supplier traceability; lab method; inventory reconciliation; missing-data log"
    - protocol_id: cp_hydrogenation_records
      process_id: "hydrogenation"
      flow_role: "fat feed, hydrogen, catalyst, electricity, steam, intermediate, spent catalyst, and vented hydrogen"
      record_type: "batch sheet, gas meter, cylinder or tank inventory, catalyst issue/return, utility meter, product test, recovery and waste records"
      raw_fields: "batch id; feed mass and quality; hydrogen opening/purchase/closing/recovery/vent; catalyst composition and active content; fresh/reused/recovered mass; kWh; steam state and mass; output mass and quality; spent catalyst; timestamps"
      collection_method: "calibrated mass and gas measurement, inventory reconciliation, batch control system, utility meters, laboratory results, and shipment records"
      unit: "kg; kWh; MJ"
      frequency: "every batch with monthly or campaign reconciliation"
      temporal_coverage: "complete representative hydrogenation campaign and declared reporting period"
      site_scope: "all hydrogenation reactors, gas systems, separation, and directly controlled utilities"
      aggregation_rule: "calculate net hydrogen and catalyst use; reconcile mass and hydrogen balance; normalize by hydrogenated intermediate and final product"
      quality_evidence: "meter calibration; gas purity record; catalyst certificate; batch genealogy; product analysis; balance residual and investigation"
    - protocol_id: cp_non_hydrogenation_records
      process_id: "non_hydrogenation_modification"
      flow_role: "fat and co-feed, route reagent, enzyme or catalyst, utilities, intermediate, residue, and wastewater"
      record_type: "batch sheet, material issue/return, utility meter, enzyme-bed or reactor log, lab, recovery and waste records"
      raw_fields: "route id; feed and co-feed mass; catalyst/enzyme/reagent identity, concentration and mass; reuse and recovery; kWh; steam; water; output mass and quality; residue; wastewater; timestamps"
      collection_method: "calibrated scales and meters, batch control records, supplier certificates, laboratory tests, and shipment records"
      unit: "kg; kWh; MJ; m3"
      frequency: "every batch with monthly or campaign reconciliation"
      temporal_coverage: "complete representative route campaign and declared reporting period"
      site_scope: "each chemically or enzymatically distinct route in the foreground facility"
      aggregation_rule: "keep routes separate; calculate net reagent use and route yield; normalize by route output and final product"
      quality_evidence: "calibration; supplier certificate; route conditions; enzyme activity where applicable; lab method; mass-balance residual"
    - protocol_id: cp_finishing_records
      process_id: "finishing_and_dispatch"
      flow_role: "intermediate, bleaching earth, utilities, reference product, co-products, filter media, wastewater, and quality"
      record_type: "tank and batch records, filter and deodoriser logs, material issue, utility meter, lab release, shipment and waste records"
      raw_fields: "intermediate mass; inventory; bleaching-earth or filter-aid mass; kWh; steam state and mass; wastewater; condensate; filter residue; recovered fraction; final product net mass; grade; route; quality results; delivery state; timestamps"
      collection_method: "calibrated scales, tanks and meters, process logs, laboratory release records, dispatch documents, and signed waste records"
      unit: "kg; kWh; MJ; m3"
      frequency: "every batch and shipment with monthly or campaign reconciliation"
      temporal_coverage: "complete representative finishing campaign and declared reporting period"
      site_scope: "all finishing, storage, forming, and bulk dispatch equipment inside the boundary"
      aggregation_rule: "count only conforming output as reference product; reconcile inputs, outputs, recycle, residues, inventory, and wastewater; normalize to 1,000 kg"
      quality_evidence: "calibration; batch genealogy; lab release; dispatch mass; treatment destination; balance residual and corrective action"
  calculation_rules:
    - id: calc_batch_normalization
      applies_to: "every foreground amount"
      rule: "normalized amount per 1,000 kg = recorded amount divided by conforming final-product mass from the same coherent period, multiplied by 1,000"
      inputs:
        - "recorded amount"
        - "conforming final-product mass"
        - "aligned time and batch scope"
      output: "normalized inventory amount"
      source_ids: []
    - id: calc_inventory_change
      applies_to: "tanks, cylinders, warehouses, catalyst, and reusable materials"
      rule: "net consumption = opening inventory + purchases or receipts - closing inventory - verified transfers out; internal transfers cancel within the boundary"
      inputs:
        - "opening inventory"
        - receipts
        - "closing inventory"
        - transfers
      output: "net input crossing the boundary"
      source_ids: []
    - id: calc_route_yield
      applies_to: "each conditioning, modification, and finishing process"
      rule: "yield = conforming process output divided by total relevant feed input; report rework, co-product, waste, evaporation, and inventory change separately"
      inputs:
        - "process feed"
        - "process output"
        - rework
        - co-product
        - waste
        - "inventory change"
      output: "route yield and reconciled mass table"
      source_ids: []
    - id: calc_hydrogen_balance
      applies_to: "hydrogenation"
      rule: "hydrogen consumed or unaccounted = opening inventory + purchases - closing inventory - recovered hydrogen - measured transfers - measured vent; investigate unexplained residual"
      inputs:
        - "hydrogen inventory"
        - purchases
        - recovery
        - transfer
        - "vent measurements"
      output: "hydrogen use, release, and balance residual"
      source_ids:
        - ec-jrc-fdm-bref-2019
    - id: calc_shared_utility
      applies_to: "shared electricity, steam, heat, water, vacuum, and treatment"
      rule: "use direct metering first; if unavailable, allocate only by a documented relevant physical driver and report the basis and sensitivity"
      inputs:
        - "facility utility total"
        - "direct meter data"
        - "operating time"
        - throughput
        - "equipment duty"
      output: "product-attributed utility amount"
      source_ids:
        - eu-environmental-footprint-2021-2279
    - id: calc_steam_energy
      applies_to: "steam inputs"
      rule: "calculate useful heat from steam and condensate enthalpy at declared pressure and temperature; do not substitute steam mass for energy"
      inputs:
        - "steam mass"
        - pressure
        - temperature
        - "condensate state and return"
      output: "useful heat in MJ and retained steam mass record"
      source_ids: []
    - id: calc_water_balance
      applies_to: "each water-using process"
      rule: "water input = discharged wastewater + evaporation + water in products and residues + inventory change + documented losses; retain recirculation separately"
      inputs:
        - "water intake"
        - discharge
        - evaporation
        - "product/residue water"
        - inventory
        - recycle
      output: "water balance and unexplained residual"
      source_ids:
        - ec-jrc-fdm-bref-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "source and reference products"
      requirement: "Preserve batch-level source animal or source-fat family, origin, rendering/refining status, grade, modification route sequence, and final product specification; do not merge materially different routes without separate results."
      evidence: "supplier records; batch genealogy; final certificate; codex-cxs-211-1999; unsd-cpc-3-0-21590"
    - id: dq_measurement
      applies_to: "mass, gas, energy, water, and quality data"
      requirement: "Use calibrated or verified measurement systems; record method, unit, resolution, calibration status, missing values, substitutions, and uncertainty."
      evidence: "calibration certificates; meter register; laboratory method; eu-environmental-footprint-2021-2279"
    - id: dq_temporal
      applies_to: "reporting period"
      requirement: "Cover a complete representative production campaign and the declared reporting period. When annual representativeness is claimed, include the relevant operating and shutdown periods or justify exclusions."
      evidence: "production calendar; batch list; meter coverage; downtime log"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Include all environmentally relevant material, energy, water, waste, and elementary flows inside the declared boundary. Identify every omission and its reason; do not use an undisclosed cut-off during initial screening."
      evidence: "completeness checklist; mass, hydrogen, energy, and water balances; eu-environmental-footprint-2021-2279"
    - id: dq_representativeness
      applies_to: "foreground and linked upstream datasets"
      requirement: "Assess technological, geographical, and time representativeness and precision; document dataset substitutions and why they are the best available match."
      evidence: "data-quality assessment; dataset metadata; eu-environmental-footprint-2021-2279"
    - id: dq_allocation
      applies_to: "multifunctional operations"
      requirement: "Retain direct-meter and process-separation evidence and document the complete allocation hierarchy, factors, prices or physical relationships, and sensitivity where material."
      evidence: "allocation worksheet; meter map; product and co-product records; eu-environmental-footprint-2021-2279"
    - id: dq_provisional_ranges
      applies_to: "every reasoned_estimate range"
      requirement: "Treat provisional ranges only as QA or authoring screens. A value inside a range is not evidence; replace publication-critical provisional ranges with reviewed foreground or external evidence."
      evidence: "manifest review metadata; foreground records; reviewer decision"
validation_rules:
  - rule_id: validate_identity
    applies_to: "product category and reference flow"
    rule: "The canonical PCR id, reference flow UUID, mass property UUID, unit-group UUID, CPC context, product name, and required qualifiers are present and mutually consistent."
    source_ids:
      - unsd-cpc-3-0-21590
  - rule_id: validate_reference_mass
    applies_to: "final dataset"
    rule: "Exactly one reference product is normalized to 1 kg conforming net output; packaging, off-spec material, rework, and co-products are not counted as reference product."
    source_ids:
      - eu-environmental-footprint-2021-2279
  - rule_id: validate_route_processes
    applies_to: "process map"
    rule: "feedstock_receipt_conditioning and finishing_and_dispatch are present; every declared hydrogenation, interesterification, re-esterification, or elaidinisation route has a matching process inventory and collection protocol."
    source_ids:
      - ec-jrc-fdm-bref-2019
  - rule_id: validate_uuid_integrity
    applies_to: "all UUID-bearing rows"
    rule: "Every stored UUID is confirmed without a dataset version and its flow type, property, unit, route, and compartment match the row. Unresolved route-specific identities remain explicit blockers and are never replaced by a semantically wrong proxy."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "each process and full foreground"
    rule: "Inputs, outputs, wastes, elementary releases, recycle, and inventory change reconcile; every unexplained residual is quantified, investigated, and disclosed."
    source_ids:
      - eu-environmental-footprint-2021-2279
  - rule_id: validate_hydrogenation
    applies_to: "hydrogenation route"
    rule: "Hydrogen supply route, net use, vent or fugitive release, catalyst identity, active content, reuse, recovery, spent-catalyst destination, and achieved product modification are reported."
    source_ids:
      - ec-jrc-fdm-bref-2019
  - rule_id: validate_water_and_waste
    applies_to: "water, wastewater, catalyst, filter media, and residues"
    rule: "Intake, recirculation, discharge, treatment destination, pollutant data, recovered materials, and waste status are consistent with water and mass balances."
    source_ids:
      - ec-jrc-fdm-bref-2019
  - rule_id: validate_allocation
    applies_to: "shared and multifunctional operations"
    rule: "Allocation is avoided by subdivision or system expansion where possible; any physical or other allocation is justified, reproducible, and disclosed with sensitivity when material."
    source_ids:
      - eu-environmental-footprint-2021-2279
  - rule_id: validate_grade_and_law
    applies_to: "food-, feed-, or technical-grade output"
    rule: "The declared grade, jurisdiction, source-fat eligibility, quality specification, and applicable legal or customer limits are supported by current records; this PCR does not convert Codex or EU examples into universal limits."
    source_ids:
      - codex-cxs-211-1999
      - eu-regulation-853-2004
  - rule_id: validate_data_quality
    applies_to: "foreground and upstream data"
    rule: "Coverage, calibration, technological, geographical and time representativeness, precision, substitutions, missing data, and every provisional estimate are reported."
    source_ids:
      - eu-environmental-footprint-2021-2279
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset produced from a reviewed foreground data package; the role is declared."
  downstream_use: "Construction of foreground process datasets and downstream lifecyclemodel projections for modified animal fats matching the declared source, route, grade, geography, technology, and period."
  allowed_use: "Gate-to-gate modelling of bulk covered modified animal fats when reference-flow qualifiers, boundary, allocation, upstream datasets, and data-quality disclosures match the intended study."
  excluded_use: "Unmodified animal fat; vegetable or microbial fat; slaughter or rendering without added unit processes; further-prepared formulations or foods; biodiesel or fuels; another species, route, grade, jurisdiction, geography, technology, or period without representativeness review; cradle-to-grave claims from this gate-to-gate dataset alone."
  required_metadata: "canonical PCR id and version when published; source species or source-fat family; source-fat route; modification route sequence and degree; catalyst, enzyme, or reagent identity; refining and post-treatment; grade; product specification; reference amount and UUIDs; geography; technology; reporting period; boundary; allocation; upstream datasets; co-products; wastes; water; data sources; collection protocols; unresolved identities; reasoned estimates."
  required_quality_disclosure: "measurement and calibration coverage; batch and temporal coverage; mass, hydrogen, energy, and water balance residuals; missing data; substitutions; allocation factors and sensitivity; upstream dataset representativeness; uncertainty; provisional ranges; legal and product-specification applicability."
  update_trigger: "Material change in source species or feedstock route, modification chemistry or degree, catalyst or enzyme, process equipment, product grade or specification, energy or water supply, recovery or waste route, allocation, jurisdictional requirement, reporting period representativeness, Tiangong identity, or authoritative evidence."
