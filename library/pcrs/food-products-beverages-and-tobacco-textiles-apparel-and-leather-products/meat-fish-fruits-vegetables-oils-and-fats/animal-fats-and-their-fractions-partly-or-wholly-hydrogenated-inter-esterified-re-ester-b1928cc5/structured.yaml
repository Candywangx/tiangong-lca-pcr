  how_much: "1 kg net mass of conforming product, excluding packaging."
  how_well: "Meets the declared product specification for source animal, modification route and degree, refining status, grade, moisture and impurities, fatty-acid or solid-fat profile where relevant, and applicable legal or customer limits."
  how_long_or_cycle: "One representative production campaign or the declared reporting period, normalized to 1 kg of conforming output."
  reference_flow_link: "Reference product output of finishing_and_dispatch; internal intermediate flows are not additional functional units."
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when qualified rendered or refined animal fat is received at the modification facility and ends when conforming bulk modified animal fat is ready for dispatch at the same facility gate. It includes receipt, heated storage where needed, conditioning, the declared modification reaction, catalyst or reagent recovery, filtration, optional bleaching or deodorisation, product finishing, directly controlled utilities, process water, wastewater, residues, off-gas, and fugitive releases."
      source_ids: []
    - rule_id: boundary_included_operations
      applies_to: "foreground facility"
      rule: "Include every directly controlled operation from received qualified animal-fat feedstock through conforming bulk product, including route-specific reaction, separation, filtration, optional bleaching or deodorisation, and directly controlled waste and wastewater handling."
      source_ids:
        - ec-jrc-fdm-bref-2019
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased inputs"
      rule: "Link rendered or refined source fat, electricity, steam or heat, hydrogen, catalysts, enzymes, reagents, water, filter aids, and treatment services to representative upstream datasets; do not assign zero upstream burden merely because they are purchased."
      source_ids:
        - eu-environmental-footprint-2021-2279
    - rule_id: boundary_recursive_inputs
      applies_to: "same-category rework or purchased modified fat"
      rule: "Record same-category rework or purchased modified animal fat as an explicit product input. Internal recycle stays inside the foreground mass balance; purchased same-category material requires an upstream dataset and must not recursively invoke this PCR without termination."
      source_ids:
        - eu-environmental-footprint-2021-2279
    - rule_id: boundary_source_fat
      applies_to: "slaughter and rendering"
      rule: "Treat slaughter, rendering, and prior refining as upstream unless they are under the same data-control boundary and separately inventoried. For food-grade source fat, preserve evidence of eligible animal origin and hygienic raw-material handling."
      source_ids:
        - codex-cxs-211-1999
        - eu-regulation-853-2004
    - rule_id: boundary_exclusions
      applies_to: "downstream life cycle"
      rule: "Exclude packaging, distribution, use, formulation into further-prepared products, and end of life unless the study explicitly expands the boundary and reports those additions separately from the gate-to-gate PCR result."
      source_ids:
        - eu-environmental-footprint-2021-2279
boundary_abstraction:
  declared_starting_condition: "Qualified rendered or refined animal fat is received at the modification facility gate with source species or source-fat family, prior rendering and refining status, grade, quantity, quality specification, and supplier lot declared."
  starting_condition_role: "Upstream product input to the foreground modification system; it is not a burden-free waste by default."
  product_classification_scope: "Semantic category of animal fats and their fractions modified by the covered routes; CPC 3.0 code 21590 is mapping context only."
  recursive_input_rule: "Internal rework is tracked within the foreground balance. Purchased modified animal fat is an explicit same-category product input linked once to an upstream dataset; no silent recursion or burden-free substitution is allowed."
  upstream_dataset_requirement: "Use representative upstream datasets for source animal fat, purchased energy, hydrogen, catalysts, enzymes, reagents, water, filter aids, transport included by the study, and off-site treatment. Record geography, technology, period, grade, and allocation compatibility."
  disclosure: "Declare source animal, feedstock route, grade, modification route sequence, reaction and post-treatment technology, upstream boundary, allocation decisions, internal recycle, co-products, waste destinations, included utilities, packaging status, jurisdiction, reporting period, and data gaps."
