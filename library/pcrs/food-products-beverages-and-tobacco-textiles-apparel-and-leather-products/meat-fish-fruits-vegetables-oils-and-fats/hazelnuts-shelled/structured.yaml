  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Reference product and all normalized rows"
      rule: "net reference mass = gross released mass - tare and included packaging mass; divide each reconciled inventory quantity by net reference mass in kg"
      inputs:
        - gross_output_mass
        - tare_mass
        - included_packaging_mass
        - reconciled_inventory_quantity
      output: "kg net reference product and inventory amount per kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_moisture_conversion
      applies_to: "Masses compared at different moisture contents"
      rule: "dry matter = wet mass × (1 - moisture fraction on wet basis); convert only from recorded measurements and retain the original values and equation"
      inputs:
        - wet_mass
        - moisture_fraction
        - stated_basis
      output: "dry-matter-equivalent mass and disclosed conversion"
      source_ids: []
    - id: calc_process_mass_balance
      applies_to: "Each foreground process"
      rule: "reconciled input = products + co-products + wastes + net inventory change + separately quantified moisture loss or gain; investigate and disclose unresolved residuals rather than forcing closure"
      inputs:
        - "input masses"
        - "output masses"
        - "waste masses"
        - "inventory change"
        - "moisture measurements"
      output: "process balance and unresolved residual"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_utility_intensity
      applies_to: "Each utility row"
      rule: "normalized utility = reconciled process utility divided by the compatible process output mass; keep carrier and route separate"
      inputs:
        - metered_or_allocated_utility
        - compatible_output_mass
        - carrier
        - route
      output: "utility per process output or reference flow"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_wet_route_water_balance
      applies_to: "wet_route"
      rule: "wastewater = measured discharge when available; otherwise wash-water input - separately measured retained water - separately measured evaporation or other documented output"
      inputs:
        - wash_water_quantity
        - measured_discharge
        - retained_water
        - evaporation_or_other_output
      output: "wet-route wastewater quantity with method flag"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity_and_traceability
      applies_to: "All lots and reference flow"
      requirement: "Preserve supplier or origin, crop year or lot period, incoming condition, commercial type or variety where declared, kernel form, release designation, and Tiangong reference UUID through the data package."
      evidence: "Lot trace, release record, and reference-flow metadata; product qualifiers informed by unsd-cpc-3-0-21423 and unece-ddp-04-2010"
    - id: dq_measurement_consistency
