      frequency: "Each lot; aggregate over the declared reporting period"
      temporal_coverage: "All represented receipt lots"
      site_scope: "Each included facility"
      aggregation_rule: "Sum compatible masses; keep moisture corrections and inventory changes separate; normalize only after reconciliation"
