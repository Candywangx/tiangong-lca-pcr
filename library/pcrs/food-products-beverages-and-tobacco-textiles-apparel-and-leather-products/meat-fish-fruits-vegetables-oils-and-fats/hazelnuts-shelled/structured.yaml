validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "The output must use Hazelnuts, shelled UUID 310457e0-388d-4c3a-9090-b4bbc5288d05, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, with every required qualifier populated."
    source_ids:
      - unsd-cpc-3-0-21423
      - unece-ddp-04-2010
  - rule_id: val_reference_amount
    applies_to: "Reference flow"
    rule: "Net reference output after tare and packaging deduction must normalize to exactly 1 kg."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_route_exclusivity
    applies_to: "Final conditioning"
    rule: "Each represented lot must declare exactly one of dry_route or wet_route; washing water, wet-route drying energy, and wastewater must be absent from dry_route and linked only to wet_route."
    source_ids: []
  - rule_id: val_process_completeness
    applies_to: "Foreground system"
    rule: "All three required processes must be represented, and any excluded on-site operation must be stated with evidence that it did not occur."
    source_ids: []
  - rule_id: val_mass_and_moisture_balance
    applies_to: "Each foreground process"
    rule: "Inputs, products, co-products, wastes, inventory change, and quantified moisture change must be reconciled on a consistent basis; unresolved residuals must be disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_fraction_exclusivity
    applies_to: "Shells and other kernel fractions"
    rule: "A physical fraction must occur in either a product row or a waste row for its destination, never both."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_estimate_status
    applies_to: "Provisional ranges"
    rule: "Every reasoned_estimate must carry its condition and replacement trigger; validation is inconclusive for reviewed use until it is replaced by verified foreground or reviewed source evidence."
    source_ids: []
