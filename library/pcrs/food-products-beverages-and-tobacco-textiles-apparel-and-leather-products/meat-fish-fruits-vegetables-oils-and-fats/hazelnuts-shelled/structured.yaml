      record_type: "Meter, sub-meter, invoice, batch record, and discharge record"
      raw_fields: "period; lot_id; route; electricity_quantity; wash_water_quantity; heat_quantity; energy_carrier; wastewater_quantity; retained_water; allocation_driver; net_output_mass"
      collection_method: "Direct batch metering preferred; otherwise documented meter allocation and water balance"
      unit: "kWh; kg water; MJ; kg wastewater"
