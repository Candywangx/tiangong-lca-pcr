allocation_rules:
  - rule_id: alloc_avoid_by_subdivision
    applies_to: "Shared operations"
    rule: "First avoid allocation by separately metering or subdividing operations for different lots, routes, and product fractions where practicable."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_shell_and_kernel_status
    applies_to: "Shells and non-reference kernel fractions"
    rule: "Classify each physical fraction exactly once: as a product only with a documented product destination and acceptance, otherwise as waste to its treatment route. Do not report the same mass in both product and waste rows."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_remaining_joint_inputs
    applies_to: "Reference kernels and co-products after subdivision"
    rule: "If allocation remains necessary, use a documented physical relationship that reflects the underlying process relationship. Use economic allocation only when a defensible physical relationship is unavailable; align values to the reporting period, disclose the method and inputs, and test sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_no_unstated_credit
    applies_to: "Waste treatment and beneficial use"
    rule: "Do not subtract an avoided-burden credit inside the foreground inventory unless the governing study method explicitly requires it; disclose any downstream substitution or recycling treatment separately."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
