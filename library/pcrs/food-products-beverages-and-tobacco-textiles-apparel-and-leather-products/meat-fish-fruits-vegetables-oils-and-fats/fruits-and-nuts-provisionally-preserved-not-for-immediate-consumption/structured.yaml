allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all multifunctional foreground processes"
    rule: "Avoid allocation by separately metering and subdividing route, batch, holding, conditioning, packaging, and treatment operations wherever feasible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "shared operations that cannot be subdivided"
    rule: "Allocate shared burdens using a documented causal physical relationship, such as measured mass throughput, vessel occupancy time, pumping time, or treatment load, chosen to represent the driver of resource use or emissions."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_fallback
    applies_to: "shared operations lacking a defensible physical relationship"
    rule: "Use economic allocation only as a documented fallback, record prices, currency, reference period, and sensitivity, and do not use it to reclassify wastes as co-products."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recovered_material
    applies_to: "rejects, recovered medium, and recovered packaging"
    rule: "Treat an output as a co-product only when it has documented intended use, a receiving user or market, and non-waste status under the applicable jurisdiction; otherwise model it as waste and link treatment."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_route_separation
    applies_to: "brine, SO2 or sulfite, other, and hybrid routes"
    rule: "Do not average burdens across preservation routes as one default formula. A multi-route facility shall report route-specific inventories or disclose the production-weighted aggregation and its underlying route shares."
    source_ids:
      - unsd-cpc-3-0-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_mass
      process_id: "raw_receiving_preparation"
      flow_role: "received, accepted, and rejected product mass"
      record_type: "scale tickets and batch records"
      raw_fields: "batch_id; product identity; supplier; origin; receipt date; gross mass; tare; accepted mass; reject mass; reject destination; preparation state"
      collection_method: "calibrated scales reconciled to batch ledger"
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "representative campaign and stated reference period"
      site_scope: "all facilities and lines in scope"
      aggregation_rule: "sum by batch and product; normalize to saleable reference product"
      quality_evidence: "calibration records; signed batch reconciliation; completeness check"
    - protocol_id: cp_preparation_water
      process_id: "raw_receiving_preparation"
      flow_role: "preparation make-up, reused, and discharged water"
      record_type: "meter and batch log"
      raw_fields: "meter_id; opening and closing readings; batch_id; make-up water; recirculated water; discharge water; allocation driver"
      collection_method: "dedicated meter or validated water balance"
      unit: "kg or m3"
      frequency: "every batch or shift"
      temporal_coverage: "representative campaign and stated reference period"
      site_scope: "each preparation line in scope"
      aggregation_rule: "allocate by measured batch use; convert volume using measured or documented density"
      quality_evidence: "meter calibration; water balance; exception log"
    - protocol_id: cp_preservation_route
      process_id: "temporary_preservation_holding"
      flow_role: "product, medium, agents, route conditions, and preserved output"
      record_type: "batch formulation, assay, vessel, and holding records"
      raw_fields: "batch_id; product identity; route_id; ordered route stages; vessel_id; input and output mass; water; each agent name; formulation; purity; charge; replenishment; recovered amount; retained amount; concentration; contact time; holding duration; temperature; other controlled condition"
      collection_method: "calibrated scales, dosing records, concentration or residual analysis, and vessel log"
      unit: "kg; concentration unit; h; °C as applicable"
      frequency: "every batch and each charge or adjustment"
      temporal_coverage: "representative campaign and stated reference period"
      site_scope: "every preservation vessel and route in scope"
      aggregation_rule: "retain route-specific records; calculate per preserved output; never blend unused route rows"
      quality_evidence: "scale and dosing calibration; supplier assay; laboratory result; signed route record"
    - protocol_id: cp_utilities
      process_id: "temporary_preservation_holding"
      flow_role: "electricity, fuel, and purchased heat"
      record_type: "meter, invoice, and equipment runtime records"
      raw_fields: "meter_id; fuel_type; native_quantity; energy_content; opening and closing readings; runtime; batch_id; allocation driver"
      collection_method: "submetering preferred; otherwise documented engineering allocation from facility records"
      unit: "kWh; MJ; native fuel unit"
      frequency: "continuous, batch, shift, or invoice period"
      temporal_coverage: "at least one representative campaign and the stated reference period"
      site_scope: "all included preservation and holding equipment"
      aggregation_rule: "allocate using causal driver and convert to reference flow"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_waste_emissions
      process_id: "temporary_preservation_holding"
      flow_role: "spent liquid, rejects, treatment feed, treatment waste, and direct emissions"
      record_type: "weigh tickets, flow meters, laboratory analyses, manifests, and emission records"
      raw_fields: "batch_id; stream_id; route_id; mass or volume; composition; concentration; pH; temperature; pollutant species; compartment; recovery; destination; treatment; moisture basis"
      collection_method: "direct measurement or calculation from measured activity and reviewed factor or mass balance"
      unit: "kg; m3; mg/L or other analyte unit"
      frequency: "every batch or discharge event; continuous where required"
      temporal_coverage: "representative campaign and stated reference period"
      site_scope: "all included discharge, emission, and treatment points"
      aggregation_rule: "calculate species-specific loads; prevent double counting of internal treatment transfers"
      quality_evidence: "meter calibration; laboratory report; waste manifest; mass balance; monitoring record"
    - protocol_id: cp_conditioning
      process_id: "predispatch_conditioning"
      flow_role: "product transfer, conditioning water, drained medium, and conditioned output"
      record_type: "batch, meter, and scale records"
      raw_fields: "batch_id; route_id; input mass; water; recovered medium; drained medium; discharge; output mass; retained medium; continued further-processing designation"
      collection_method: "calibrated scales, meter, and batch balance"
      unit: "kg or m3"
      frequency: "every conditioned batch"
      temporal_coverage: "representative campaign and stated reference period"
      site_scope: "each conditioning line in scope"
      aggregation_rule: "normalize to conditioned output and reference flow; retain route identity"
      quality_evidence: "calibration records; batch mass balance; disposition record"
    - protocol_id: cp_packaging
      process_id: "packaging_dispatch"
      flow_role: "product, packaging materials, reusable trips, and packaging waste"
      record_type: "packaging bill, component weights, batch and shipment records"
      raw_fields: "batch_id; product net mass; declared mass basis; component_id; material; component mass; count; reusable trip count; waste mass; shipment_id"
      collection_method: "calibrated scale, supplier specification verified by sampling, and packaging issue record"
      unit: "kg; count; trips"
      frequency: "every packaging format and representative shipment"
      temporal_coverage: "representative campaign and stated reference period"
      site_scope: "all packaging formats and dispatch points in scope"
      aggregation_rule: "component mass times count divided by reference product mass; divide reusable items by validated trips"
      quality_evidence: "packaging bill; weighing record; supplier specification; trip log; shipment reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "Normalized amount = batch-attributed amount / saleable reference product mass on the declared as-packed or drained basis. Packaging is never included in the denominator."
      inputs:
        - "batch-attributed amount"
        - "saleable reference product mass"
        - "declared mass basis"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_product_yield
      applies_to: "receiving, preservation, and conditioning"
      rule: "Yield = measured saleable output mass / measured incoming product mass for the stated process; separately reconcile retained medium, rejects, samples, and unexplained difference."
      inputs:
        - "input mass"
        - "output mass"
        - "retained medium"
        - rejects
        - samples
      output: "process yield and mass-balance closure"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_active_agent
      applies_to: "sulfur dioxide, sulfite, salt, and other formulated agents"
      rule: "Active amount = formulation mass × measured or supplier-certified active fraction; preserve the as-supplied amount as a separate inventory value."
      inputs:
        - "formulation mass"
        - "active fraction"
        - "assay basis"
      output: "active-agent amount and as-supplied amount"
      source_ids: []
    - id: calc_liquid_load
      applies_to: "wastewater and spent medium"
      rule: "Pollutant load = measured liquid quantity × measured concentration, with density and unit conversion documented; do not apply one composition to another route."
      inputs:
        - "liquid mass or volume"
        - density
        - "species concentration"
        - route_id
      output: "species-specific load by stream and compartment"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_packaging_amount
      applies_to: "packaging"
      rule: "Packaging amount = component mass × component count / saleable reference product mass; divide reusable component burden by validated lifetime trips only when the study method requires trip allocation."
      inputs:
        - "component mass"
        - count
        - "trip count"
        - "reference product mass"
      output: "kg packaging per kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_shared_burden
      applies_to: "shared equipment and treatment"
      rule: "Apply the allocation hierarchy in section 7 and retain the measured or calculated driver, route share, and sensitivity record."
      inputs:
        - "shared burden"
        - "physical driver"
        - "route share"
        - "economic fallback data if used"
      output: "route- and product-attributed burden"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and reference flow"
      requirement: "Match the declared product to the category, preserve the exact reference UUID, and declare every required qualifier."
      evidence: "product specification; batch record; reference-flow record"
    - id: dq_route_specificity
      applies_to: "preservation inventory"
      requirement: "Records shall identify one primary route or an ordered hybrid sequence and shall not silently populate salt, SO2 or sulfite, and other-agent rows as one default formulation."
      evidence: "route sheet; batch formulation; agent issue record; vessel log"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Cover a representative campaign and the stated reference period, including seasonal or product-change variability where material."
      evidence: "date-bounded batch list; production calendar; coverage calculation"
    - id: dq_completeness
      applies_to: "mass, water, energy, waste, and emissions"
      requirement: "Reconcile incoming and outgoing product, medium, water, agents, wastes, and retained inventory; explain exclusions and unresolved balance differences."
      evidence: "mass and water balance; meter reconciliation; waste manifests; exception log"
    - id: dq_measurement
      applies_to: "measured values"
      requirement: "Use calibrated instruments or documented supplier records and retain units, detection limits, sampling methods, and conversions."
      evidence: "calibration certificate; laboratory report; invoice; conversion worksheet"
    - id: dq_estimates
      applies_to: "all reasoned_estimate ranges"
      requirement: "Treat ranges marked reasoned_estimate only as provisional screening or default values and replace them when the stated product-, route-, facility-, or campaign-specific trigger is met."
      evidence: "estimate register; replacement record; reviewed source or foreground data"
    - id: dq_source_limit
      applies_to: "Codex, UNECE, EU PEF, and EU BAT use"
      requirement: "Apply each source only within its scope: do not transfer direct-consumption pickled-product requirements, product-specific commercial standards, legal thresholds, or sector performance levels to this whole category."
      evidence: "source applicability assessment; documented exclusions and assumptions"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The product-flow UUID shall be 70b546f4-bfbc-4e64-a70d-4ff57cedcc6d, the Mass flow-property UUID shall be 93a60a56-a3c8-11da-a746-0800200b9a66, the Units of mass UUID shall be 93a60a57-a4c8-11da-a746-0800200c9a66, and the reference unit shall be kg."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "dataset metadata"
    rule: "Fail validation when any required qualifier is absent, including route identifier, mass basis, medium status, holding duration, intended next processing step, or packaging system."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_not_immediate_consumption
    applies_to: "product scope"
    rule: "The dataset shall state that the product remains intended for further processing and is not ready for immediate consumption; otherwise a different product category is required."
    source_ids:
      - unsd-cpc-3-0-2025
      - codex-cxs-260-2007
  - rule_id: validate_route_exclusivity
    applies_to: "preservation inventory"
    rule: "A single-route dataset shall populate only the applicable route-specific agent rows. A hybrid route shall declare ordered stages and separate their activity data; a blended generic salt/SO2/other formula is invalid."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_reference_mass
    applies_to: "mass normalization"
    rule: "The reference output shall equal 1 kg on the declared as-packed or drained basis; packaging shall be excluded, and retained medium inclusion shall agree with the declaration."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: validate_inventory_balance
    applies_to: "foreground inventory"
    rule: "Check product and preservation-medium mass balances, water balance where material, energy coverage, rejects, spent liquid, treatment transfers, and route-relevant direct emissions; unexplained differences require disclosure and review."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: validate_packaging
    applies_to: "packaging"
    rule: "Require packaging material, mass, component count, reusable-trip basis, and on-site packaging waste for every packaging format represented at the producer gate."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_estimate_replacement
    applies_to: "reasoned estimates"
    rule: "Every reasoned_estimate shall retain its provisional label and replacement trigger; it shall not be presented as a source-backed typical or allowed range."
    source_ids: []
  - rule_id: validate_source_applicability
    applies_to: "external standards and guidance"
    rule: "Reject any use of Codex direct-consumption pickled-product composition or pH rules, a product-specific UNECE standard, or EU BAT performance levels unless the concrete product and facility applicability are separately demonstrated."
    source_ids:
      - codex-cxs-260-2007
      - eu-fdm-bat-2019-2031
published_dataset_profile:
  dataset_role: "Foreground production dataset for a declared fruit or nut and one actual provisional-preservation route at the producer gate"
  downstream_use: "secondary_dataset; background_dataset after review of representativeness, source applicability, estimate replacement, and data quality"
  allowed_use: "Product-, route-, geography-, technology-, and time-representative modelling of provisionally preserved fruits or nuts destined for further processing; aggregation only when route shares and allocation are disclosed"
  excluded_use: "Ready-to-eat pickled or canned products; fresh, frozen, simply dried, or sugar-preserved products; undisclosed route mixtures; consumer use; downstream final processing; comparative assertions based on unresolved reasoned estimates"
  required_metadata: "canonical PCR id; product and commercial form; Tiangong reference-flow UUID; route and ordered stages; agent identity, formulation, and concentration; mass basis; retained medium state; holding duration and conditions; intended next process; packaging; facility and geography; reference period; allocation; data sources; estimate register"
  required_quality_disclosure: "foreground coverage; meter and scale calibration; batch and campaign coverage; mass and water balance; allocation basis; source applicability; route share; treatment destinations; unresolved UUIDs; every reasoned_estimate and its replacement status"
  update_trigger: "Change in fruit or nut, commercial form, preservation route or agent, formulation, equipment, holding condition, mass basis, retained medium, packaging, treatment, facility, geography, allocation, regulation, source applicability, or availability of reviewed evidence replacing a reasoned estimate"
data_sources:
  - id: "unsd-cpc-3-0-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0, Explanatory Notes, 30 June 2025, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-11)"
    used_for: "CPC 21496 category identity, provisional-preservation and further-processing boundary, and exclusions; it does not supply a route recipe or quantitative factors"
