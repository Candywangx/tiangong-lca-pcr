  - id: medium_mass_basis
    applies_to: "preservation medium and treated product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "State whether the reference mass is as-packed net contents or drained product. Include retained medium in the reference mass only when the declared commercial mass basis includes it; separately report medium added, recovered, retained, drained, and discarded."
  - id: agent_as_supplied
    applies_to: "salt, sulfur dioxide, sulfite, and other preservation agents"
