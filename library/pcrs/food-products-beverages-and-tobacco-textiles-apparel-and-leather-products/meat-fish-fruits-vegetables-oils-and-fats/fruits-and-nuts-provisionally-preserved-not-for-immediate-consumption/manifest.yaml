review_metadata:
  evidence_limitations:
    - "UNSD CPC 3.0 defines the category boundary but does not provide one preservation recipe or route-specific inventory factors."
    - "Codex CXS 260-2007 covers pickled products offered for direct consumption and explicitly excludes products intended for further processing; its composition, pH, drained-weight, and additive provisions are not generalized to this PCR."
    - "No UNECE commercial-quality standard identified for fresh or dry/dried produce covers this whole provisional-preservation category; any product-specific UNECE standard requires a separate applicability check."
    - "Commission Implementing Decision (EU) 2019/2031 is used only for generic inventory and monitoring completeness; its legal scope and sector performance levels are not generalized to every facility or product in this PCR."
  unresolved:
    - "Replace every reasoned_estimate range with reviewed product-, route-, facility-, and campaign-specific evidence before methodology review or publication-critical use."
    - "Resolve Tiangong UUIDs for non-reference inventory flows when authoritative matching rows become available; semantic flow names remain provisional identity candidates."
