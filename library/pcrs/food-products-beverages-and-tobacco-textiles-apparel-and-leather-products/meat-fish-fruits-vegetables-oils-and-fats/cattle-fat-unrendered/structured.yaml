allocation_rules:
  - rule_id: allocation_separate_direct_loads
    applies_to: "fat separation, conditioning, packing, and delivery"
    rule: "First subdivide and assign directly measured inputs, emissions, wastes, and services to the process and output that caused them. Do not allocate a fat-specific trimming or cooling load across unrelated carcass outputs."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_hierarchy
    applies_to: "multifunctional processes outside a prescribed PEF slaughterhouse rule"
    rule: "Where direct subdivision is not possible, investigate system expansion; otherwise use a relevant quantifiable physical relationship. Use another relationship such as economic allocation only after documenting why the earlier steps are not practicable and why the selected driver represents the shared process."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_cattle_slaughter_pef
    applies_to: "PEF-conformant cradle-to-handoff studies including cattle slaughter"
    rule: "Apply the cattle slaughterhouse method in Recommendation (EU) 2021/2279 section 4.5.1.6 to upstream burdens and outputs leaving the slaughterhouse. Preserve its output classes and applicability; do not reinterpret its European-average mass fractions, prices, economic shares, or allocation ratios as universal cattle-fat composition, yield, or market values."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_non_pef_slaughter
    applies_to: "studies not claiming PEF conformity"
    rule: "Report the shared slaughter boundary, full co-product set, direct-load subdivision, selected allocation or system-expansion method, data period, geography, masses, prices or physical driver, and sensitivity result. Do not silently copy PEF default factors into a different market or time period."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_disposition_separation
    applies_to: "edible, prescribed-treatment, feed, non-food, condemned, and pending streams"
    rule: "Keep masses and destinations separate. A condemned or waste stream must not be merged with a valuable co-product merely to change the allocated burden, and a food claim must follow the recorded judgement."
    source_ids:
      - codex-cxc-58-2005
      - eu-pef-2021-2279
  - rule_id: allocation_mass_balance
    applies_to: "every allocation model"
    rule: "Allocation changes burden shares, not physical mass. Preserve the unallocated process mass balance and require allocated fractions to reconcile to the declared shared burden without double counting."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_identity_mass
      process_id: "fat_separation_trimming"
      flow_role: "incoming cattle fat-bearing stream and reference output"
      record_type: "lot receipt, production, scale, and disposition records"
      raw_fields: "cattle lot; establishment; date and time; tissue or process stream; anatomical description; eligibility class and decision evidence; gross mass; tare; net mass; temperature; physical state; included non-fat tissues; intended next use"
      collection_method: "calibrated scale record joined to slaughter or cutting lot and competent disposition record"
      unit: "kg and °C"
      frequency: "each lot or batch"
      temporal_coverage: "all lots represented by the dataset period"
      site_scope: "each establishment and line in scope"
      aggregation_rule: "sum net mass only within identical declared product strata; report any aggregation across strata"
      quality_evidence: "scale calibration; lot trace; inspection or disposition record; operator sign-off"
    - protocol_id: cp_mass_balance_disposition
      process_id: "fat_separation_trimming"
      flow_role: "product, co-product, waste, stock change, and unexplained balance"
      record_type: "batch mass-balance and destination records"
      raw_fields: "input mass; reference product mass; each co-product mass; each waste mass; retained stock; added or removed water or ice; destination; eligibility; measurement time"
      collection_method: "reconciled calibrated scale records and inventory change"
      unit: "kg"
      frequency: "each batch, reconciled for each reporting period"
      temporal_coverage: "full dataset period"
      site_scope: "each process line before site aggregation"
      aggregation_rule: "calculate by stream and eligibility first; aggregate only after retaining strata"
      quality_evidence: "scale calibration; reconciliation report; destination ticket; exception log"
    - protocol_id: cp_utilities_emissions
      process_id: "fat_separation_trimming"
      flow_role: "electricity, fuel, water, cleaning inputs, wastewater, wastes, and direct releases"
      record_type: "meter, invoice, material issue, monitoring, and treatment records"
      raw_fields: "meter start and end; invoice quantity; equipment or area; operating hours; allocation driver; water source; wastewater volume; measured parameter; waste mass; emission value; factor and source when calculated"
      collection_method: "direct meter preferred; otherwise invoice reconciliation and documented process-level allocation"
      unit: "flow-specific unit"
      frequency: "meter interval or each production campaign; at least each dataset reporting period"
      temporal_coverage: "representative operating period stated by the data producer"
      site_scope: "each included site; process-level where material"
      aggregation_rule: "normalize after reconciling facility totals; retain shared allocation and uncertainty"
      quality_evidence: "meter calibration; invoices; laboratory report; factor citation; mass and water balance"
    - protocol_id: cp_temperature_conditioning
      process_id: "temperature_conditioning"
      flow_role: "product mass and temperature, cooling energy, storage duty, refrigerant"
      record_type: "conditioning lot, meter, logger, and maintenance records"
      raw_fields: "input and output mass; timestamps; product temperature; storage duration; electricity or fuel; equipment; refrigerant make-up; recovered refrigerant; stock change; allocation driver"
      collection_method: "calibrated scale and temperature logger; submeter or equipment record; maintenance log"
      unit: "kg; °C; h; kWh or MJ; kg refrigerant"
      frequency: "each lot for mass and temperature; meter interval for energy; each service event for refrigerant"
      temporal_coverage: "complete conditioning and storage period represented"
      site_scope: "each cooling or freezing system in scope"
      aggregation_rule: "allocate shared duty by documented mass-time or another justified physical driver; keep chilled and frozen strata separate"
      quality_evidence: "logger calibration; meter data; maintenance and recovery records; cold-chain deviation log"
    - protocol_id: cp_packaging_handoff
      process_id: "packing_dispatch"
      flow_role: "packaging, net mass, tare, dispatch, and rejects"
      record_type: "packaging issue, weighing, dispatch, and rejection records"
      raw_fields: "package material; item count; item mass; reusable cycles; gross mass; tare; net mass; dispatch temperature; storage time; rejected mass and destination; handoff time and place"
      collection_method: "issue records and package specifications reconciled to calibrated gross and tare weights"
      unit: "kg; item; °C; h"
      frequency: "each packaging specification and lot; each handoff"
      temporal_coverage: "all dispatched lots represented"
      site_scope: "each packing and dispatch site"
      aggregation_rule: "calculate packaging per net kg by material; do not include tare in product mass"
      quality_evidence: "supplier specification; weigh check; reuse log; dispatch and rejection records"
    - protocol_id: cp_transport_handoff
      process_id: "delivery_handoff"
      flow_role: "freight service, refrigeration, loss, and receipt condition"
      record_type: "shipment, carrier, energy, temperature, and receipt records"
      raw_fields: "origin; destination; actual distance; mode; vehicle; net load; capacity; load factor; empty return; refrigeration energy or fuel; dispatch and receipt time and temperature; delivered mass; loss; handoff point"
      collection_method: "carrier document, route record, fuel or electricity record, and receiver proof"
      unit: "km; kg or t; tkm; kWh or fuel unit; °C"
      frequency: "each shipment or representative route stratum"
      temporal_coverage: "all deliveries represented by a delivered-handoff dataset"
      site_scope: "each route and transport mode"
      aggregation_rule: "calculate tkm by shipment; aggregate by route and mode weighted by delivered mass"
      quality_evidence: "bill of lading; route evidence; fuel or energy record; temperature log; proof of delivery"
    - protocol_id: cp_shared_slaughter_allocation
      process_id: "fat_separation_trimming"
      flow_role: "upstream cattle and slaughter co-product allocation"
      record_type: "slaughter campaign output, direct-load, price, and method record"
      raw_fields: "cattle live-weight basis; upstream dataset; each slaughter output class; mass; disposition; directly attributable load; shared burden; price at common production stage if used; physical driver; allocation factor; method; geography; period"
      collection_method: "reconcile slaughter output ledger and direct process records; apply the declared hierarchy or applicable PEF rule"
      unit: "kg; currency/kg; dimensionless factor; flow-specific units"
      frequency: "each representative campaign and each material price period"
      temporal_coverage: "same period as upstream slaughter dataset or justified alignment"
      site_scope: "each slaughter establishment and output point represented"
      aggregation_rule: "calculate factors at the common co-product point; factors must cover the declared co-product set and reconcile to the shared burden"
      quality_evidence: "output ledger; price evidence; method version; calculation workbook; sensitivity result"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "all reference outputs"
      rule: "net product mass = gross loaded mass - verified packaging and equipment tare - separately measured ice or coolant not sold as product"
      inputs:
        - "gross mass"
        - tare
        - "excluded ice or coolant mass"
      output: "kg net unrendered cattle fat"
      source_ids: []
    - id: calc_normalized_inventory
      applies_to: "every inventory row"
      rule: "normalized amount = attributable flow amount / net reference-product kg at the same handoff"
      inputs:
        - "attributable flow amount"
        - "net output mass"
      output: "flow unit per kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "each foreground process"
      rule: "unexplained balance = total mass inputs + opening stock - total mass outputs - closing stock; added or removed water, ice, and packaging are explicit flows"
      inputs:
        - "stream-specific input"
        - output
        - waste
        - stock
        - water
        - ice
        - "and packaging masses"
      output: "kg and percent of total measured input, reported without forced adjustment"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_transport_service
      applies_to: "delivery_handoff"
      rule: "tkm = net shipped mass in tonnes × actual one-way route km; empty return and refrigeration are separate model parameters"
      inputs:
        - "net shipped mass"
        - distance
        - mode
        - "empty return"
        - "refrigeration record"
      output: "tkm and separate refrigeration inventory"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_shared_allocation
      applies_to: "shared cattle-production or slaughter burden"
      rule: "Apply direct subdivision first. If a shared factor is required, calculate it from the documented method and common-stage data; for a PEF-conformant cattle slaughter model use section 4.5.1.6 without converting its values into a product yield claim"
      inputs:
        - "shared burden"
        - "full co-product set"
        - "direct loads"
        - method
        - "physical or economic driver"
        - "PEF applicability"
      output: "allocated burden by output plus reconciliation and sensitivity record"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and all same-category inputs"
      requirement: "Demonstrate cattle origin, unrendered state, stream identity, lot, eligibility or disposition, temperature state, packaging basis, handoff, geography, and period. Missing stream or disposition qualifiers make the dataset incomplete."
      evidence: "lot trace, product specification, inspection or disposition record, photographs or process declaration where useful"
    - id: dq_no_cross_stream_default
      applies_to: "yield, loss, utility, packaging, transport, and allocation values"
      requirement: "Do not create a single default by pooling different animal species, anatomical streams, tissue conditions, eligibility classes, chilled and frozen routes, or rendered and unrendered products. Stratify or report the unresolved representativeness limitation."
      evidence: "retained strata, aggregation rationale, sensitivity or separate datasets"
    - id: dq_completeness
      applies_to: "included foreground processes"
      requirement: "Reconcile all known product, co-product, material, water, energy, waste, wastewater, waste-gas, and direct elementary flows. Identify exclusions and avoid double counting with upstream supply or downstream treatment datasets."
      evidence: "process flow diagram, mass and water balances, meter and waste records, cut-off register"
    - id: dq_representativeness
      applies_to: "foreground and linked upstream data"
      requirement: "State technological, geographical, temporal, and product-stream representativeness and precision. Align cattle-production, slaughter, separation, conditioning, and dispatch periods or document the mismatch."
      evidence: "dataset metadata, DQR or equivalent assessment, data-source dates, uncertainty disclosure"
    - id: dq_reasoned_estimates
      applies_to: "candidate-stage values lacking product-specific evidence"
      requirement: "A temporary scenario value may be labelled reasoned_estimate only when its formula, input assumptions, tissue stream, eligibility class, route, geography, and uncertainty are explicit. It is not an allowed range or a category default, cannot support a comparative assertion, and must be replaced when the first representative site, lot, meter, supplier, route, or price records become available. No numeric reasoned-estimate range is prescribed by this PCR."
      evidence: "estimate worksheet, assumption owner and date, replacement trigger, validation finding kept open until replacement"
    - id: dq_source_limits
      applies_to: "use of external standards and guidance"
      requirement: "Use CPC for category identity, CXC 58-2005 for meat-hygiene process and disposition context, CXS 211-1999 only to distinguish rendered named fats, PEF for LCA boundary and multifunctionality, and FDM BAT only for inventory and monitoring completeness. Do not promote source-specific legal thresholds or rendered-fat composition values into universal PCR defaults."
      evidence: "source-use matrix and reviewer check"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "Require product flow UUID f41d4291-946e-4a03-91f4-f55731e84062, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and exactly 1 kg net reference amount."
    source_ids: []
  - rule_id: validation_unrendered_boundary
    applies_to: "product and process list"
    rule: "Fail if rendering, melting for fat recovery, extraction, refining, or a rendered-fat output is included before the reference handoff or is presented as CPC 21512."
    source_ids:
      - unsd-cpc-3-0-2025
      - codex-cxs-211-1999
  - rule_id: validation_cattle_and_stream
    applies_to: "identity and inventory"
    rule: "Require cattle-only origin and separately reported tissue or trimming stream, eligibility, physical state, and temperature state. Fail a generic default derived by merging other species, rendered fats, or materially different tissue streams."
    source_ids:
      - unsd-cpc-3-0-2025
      - codex-cxc-58-2005
  - rule_id: validation_disposition
    applies_to: "edible and non-food claims"
    rule: "Require evidence of safe and suitable, prescribed-treatment, non-food, condemned, or pending disposition. Fail any food-use claim inferred solely from the flow title or from CXS 211-1999 rendered-fat descriptions."
    source_ids:
      - codex-cxc-58-2005
      - codex-cxs-211-1999
  - rule_id: validation_mass_balance
    applies_to: "each included foreground process"
    rule: "Require measured input, product, co-product, waste, stock, water or ice change, and unexplained balance. Report material imbalance as a finding; do not correct it through allocation."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: validation_conditionals
    applies_to: "conditioning, packaging, storage, and delivery"
    rule: "When any conditional process is included, require its collection protocol fields and inventory. When excluded, require an explicit handoff and route statement that supports exclusion."
    source_ids:
      - codex-cxc-58-2005
      - eu-pef-2021-2279
  - rule_id: validation_allocation
    applies_to: "shared cattle-production and slaughter burdens"
    rule: "Require direct-load subdivision, full co-product set, method hierarchy, factors, common-stage data, reconciliation, period, geography, and sensitivity. For a PEF claim, verify section 4.5.1.6 applicability and method separately."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_inventory_completeness
    applies_to: "foreground data package"
    rule: "Require known inputs and outputs, including resource use, products, co-products, emissions, and wastes, plus disclosed exclusions. FDM BAT values must not be used as generic cattle-fat performance thresholds."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: validation_estimate_replacement
    applies_to: "reasoned estimates"
    rule: "Flag every reasoned_estimate with its assumptions and replacement trigger. A final comparative or reviewed background dataset is inconclusive while a material estimate lacks representative foreground or reviewed external evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground product data package for unrendered cattle fat and its process-level projection; may become a reviewed secondary_dataset or background_dataset after evidence and allocation review"
  downstream_use: "LCA process or lifecyclemodel construction for an explicitly qualified cattle-fat stream at the declared pre-rendering handoff"
  allowed_use: "Stream-specific cattle-fat production, supply-chain modelling, downstream rendering input, food or feed pathway modelling where eligibility evidence supports it, and route-specific chilled or frozen delivery scenarios"
  excluded_use: "Rendered tallow or named animal-fat composition modelling; cross-species default; whole-animal or slaughterhouse average without the declared allocation model; nutritional or legal food-compliance claim; comparative assertion based on unresolved material estimates"
  required_metadata: "canonical PCR id; CPC reference; all reference-flow qualifiers; cattle and lot origin; tissue stream; disposition; start and end gates; included processes; upstream datasets; co-product method; time; geography; technology; net and tare basis; storage and transport handoff; data owners; source and estimate status"
  required_quality_disclosure: "data completeness; mass-balance result; direct versus shared loads; allocation factors and sensitivity; technological, geographical, temporal, and stream representativeness; UUID gaps; cut-offs; conditional-process exclusions; unresolved estimates and their replacement triggers"
  update_trigger: "New or corrected Tiangong identities; change in CPC scope; revised relevant Codex or PEF rules; new product-stream evidence; changed eligibility regime; changed conditioning, packaging, handoff, or allocation method; representative foreground data replacing an estimate; material mass-balance or validation finding"
data_sources:
  - id: "unsd-cpc-3-0-2025"
    type: "standard"
    reference: "United Nations Statistics Division, Central Product Classification (CPC) Version 3.0 Explanatory Notes, subclass 21512, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-11)"
    used_for: "Exact cattle and unrendered category identity; exclusion of tallow, greaves fat, and marrow, bone, or foot oil. It supplies no product composition, yield, utility, emission, or allocation value."
  - id: "codex-cxc-58-2005"
    type: "standard"
    reference: "Codex Alimentarius, Code of Hygienic Practice for Meat, CXC 58-2005. https://workspace.fao.org/sites/codex/Standards/CXC%2058-2005/CXC_058e.pdf (retrieved 2026-08-11)"
    used_for: "Dressing and separation context; edible and inedible parts; post-mortem judgement; handling, chilling, freezing, packaging, storage, transport, and temperature-control records. It is hygiene and process-control guidance, not an LCA factor source or a universal legal temperature threshold."
  - id: "codex-cxs-211-1999"
    type: "standard"
    reference: "Codex Alimentarius, Standard for Named Animal Fats, CXS 211-1999, amended through 2024. https://workspace.fao.org/sites/codex/Standards/CXS%20211-1999/CXS_211e.pdf (retrieved 2026-08-11)"
    used_for: "Boundary contrast: premier jus and edible tallow are obtained by rendering cattle tissues. The standard applies to named animal fats presented for human consumption; its rendered-fat definitions, composition ranges, and quality factors are not unrendered-fat category specifications or LCA defaults."
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission, Recommendation (EU) 2021/2279 on Environmental Footprint methods, Annex I sections 4.5 and 4.5.1, including cattle slaughterhouse allocation. http://data.europa.eu/eli/reco/2021/2279/2021-12-30 (retrieved 2026-08-11)"
    used_for: "Functional-unit linkage, life-cycle inventory completeness, direct-load subdivision, multifunctionality hierarchy, cattle slaughterhouse co-product method, data quality, transport, and disclosure. PEF cattle default factors represent the prescribed PEF context and are not adopted here as universal composition, yield, price, or allocation defaults."
  - id: "eu-fdm-bat-2019-2031"
    type: "official_guidance"
    reference: "European Commission, Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries, especially BAT 2 inventory and monitoring provisions. https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019D2031 (retrieved 2026-08-11)"
    used_for: "Checklist for process-level water, energy, raw materials, wastewater, waste gas, residues, and monitoring records where applicable to included food-processing operations. It is not used to assert legal applicability or to transfer BAT-AELs or performance levels into this PCR."
