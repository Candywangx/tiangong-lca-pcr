system_boundary:
  rules:
    - rule_id: boundary_unrendered_identity
      applies_to: "product scope and end gate"
      rule: "The reference product must remain unrendered. Stop the default foreground before any rendering, melting for fat recovery, extraction, fractionation, or refining operation, and do not relabel a rendered output as this product."
      source_ids:
        - unsd-cpc-3-0-2025
        - codex-cxs-211-1999
    - rule_id: boundary_cattle_disposition
      applies_to: "start gate and product qualification"
      rule: "Maintain cattle-lot linkage and the competent disposition of the relevant parts. Separate material safe and suitable for food, material requiring a prescribed treatment, non-food eligible material, condemned material, and material pending judgement."
      source_ids:
        - codex-cxc-58-2005
    - rule_id: boundary_conditioning_handoff
      applies_to: "trimming, cooling, packing, storage, and delivery"
      rule: "Include only the trimming, sorting, chilling or freezing, packaging, storage, and delivery activities performed before the declared handoff. Record temperature-control and cold-chain interruptions where applicable."
      source_ids:
        - codex-cxc-58-2005
    - rule_id: boundary_shared_slaughter
      applies_to: "cattle-production and slaughter burdens"
      rule: "Treat the unrendered cattle-fat stream as an output related to slaughter or cutting. Directly attributable recovery loads belong to the fat foreground; shared livestock and slaughter loads require an explicit upstream dataset and co-product treatment."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_inventory_completeness
      applies_to: "every included foreground process"
      rule: "Inventory all known material, energy, water, product, co-product, waste, wastewater, waste-gas, and direct elementary flows at the most appropriate process level. FDM BAT is used only as a completeness and monitoring checklist, not as a legal applicability claim or a source of universal performance values."
      source_ids:
        - eu-pef-2021-2279
        - eu-fdm-bat-2019-2031
    - rule_id: boundary_transport_gate
      applies_to: "transport"
      rule: "Exclude transport after a dispatch-gate handoff. Include route-specific transport only when the declared reference handoff is after delivery, and disclose distance, mode, load, empty return treatment, refrigeration, and responsibility transfer."
      source_ids:
        - eu-pef-2021-2279
