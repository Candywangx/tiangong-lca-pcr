allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared slaughterhouse operations"
    rule: "First subdivide processes, meters, batches, and treatment records wherever separately measured data can assign burdens directly."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_avoid
    applies_to: "multi-output processes"
    rule: "Avoid allocation through process subdivision or a justified system-function approach when consistent with the study goal and PEF method."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical
    applies_to: "unavoidable co-production"
    rule: "When allocation cannot be avoided, use a documented physical causal relationship only when it represents how inputs and emissions change with outputs."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_economic
    applies_to: "outputs without defensible physical causality"
    rule: "If no defensible physical relationship exists, use economic allocation with product-specific prices, a declared representative period, and sensitivity disclosure."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_disposition
    applies_to: "blood, organs, skin, fat, bone, trimming, and condemned material"
    rule: "Classify each anatomical output by actual legal and commercial disposition before deciding whether it is a co-product, recyclable material, or waste; do not allocate to a waste output unless the chosen method requires it."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021
  - rule_id: allocation_consistency
    applies_to: "reference product and co-products"
    rule: "Reconcile output masses, allocation keys, revenues when used, and the share assigned to the 1 kg reference product; disclose zero-value and missing-price treatment."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_animal_receiving_lairage
      process_id: "animal_receiving_lairage"
      flow_role: "live sheep, water, electricity, diesel, rested sheep, manure, wastewater, carcass waste, diesel CO2"
      record_type: "receiving and batch records, meters, fuel logs, scales, waste records"
      raw_fields: "batch_id; supplier; species; accepted_live_kg; rejected_live_kg; rested_live_kg; water_m3; electricity_kWh; diesel_quantity; manure_kg; wash_water_m3; dead_carcass_kg; destination"
      collection_method: "Link calibrated weighbridge or count-to-mass records, stage meters, inventory movements, and waste documents by batch and period"
      unit: "kg; m3; kWh; L or kg"
      frequency: "each batch; utilities by meter interval"
      temporal_coverage: "justified representative production period or complete campaign, with gaps disclosed"
      site_scope: "every included receiving and lairage site"
      aggregation_rule: "sum linked records and normalize to rested sheep and final reference output without double counting"
      quality_evidence: "scale and meter calibration; supplier and acceptance records; fuel reconciliation; waste transfer records"
    - protocol_id: cp_slaughter_dressing
      process_id: "slaughter_dressing"
      flow_role: "sheep input, water, electricity, steam, fuels, carcass, anatomical outputs, wastes, wastewater, combustion CO2"
      record_type: "slaughter batch, meter, scale, fuel, product, inspection, and waste records"
      raw_fields: "batch_id; sheep_input_kg; water_m3; electricity_kWh; steam_kg; natural_gas_quantity; gas_calorific_value; lpg_kg; carcass_kg; blood_kg; liver_kg; kidney_kg; heart_kg; skin_kg; fat_kg; rumen_content_kg; condemned_lung_kg; wastewater_m3; destinations"
      collection_method: "Link every measured carrier and anatomical output to slaughter batch and inspection disposition"
      unit: "kg; m3; kWh; MJ"
      frequency: "each batch; utilities by meter interval"
      temporal_coverage: "justified representative production period or complete campaign, with gaps disclosed"
      site_scope: "every included slaughter and dressing site"
      aggregation_rule: "reconcile input, carcass, each co-product, waste, wastewater, and allocation keys before normalization"
      quality_evidence: "scale and meter calibration; inspection records; product dispatch; fuel invoices; waste manifests"
    - protocol_id: cp_carcass_chilling
      process_id: "carcass_chilling"
      flow_role: "carcass input, electricity, R-717, chilled carcass, condensate, R-717 loss"
      record_type: "batch, temperature, meter, refrigerant, service, scale, and condensate records"
      raw_fields: "batch_id; hot_carcass_kg; chilled_carcass_kg; inlet_temperature; release_temperature; start_time; release_time; electricity_kWh; r717_charge_kg; r717_purchase_kg; r717_recovery_kg; condensate_m3"
      collection_method: "Link carcass mass and time-temperature records to refrigeration meters and a closed refrigerant balance"
      unit: "kg; kWh; m3"
      frequency: "each batch; refrigerant by service event"
      temporal_coverage: "justified representative production period or complete campaign, with gaps disclosed"
      site_scope: "every included carcass-chilling system"
      aggregation_rule: "calculate chilling loss and unrecovered refrigerant only from reconciled records; normalize to chilled carcass"
      quality_evidence: "scale and temperature calibration; meter checks; service reports; refrigerant inventory reconciliation"
    - protocol_id: cp_cutting_packaging
      process_id: "cutting_packaging"
      flow_role: "carcass, water, electricity, carton, LDPE, packaged meat, trimming, bone, fat, wastewater, rejects, packaging wastes"
      record_type: "cutting batch, BOM, meter, issue-return, scale, inspection, and waste records"
      raw_fields: "batch_id; carcass_input_kg; water_m3; electricity_kWh; carton_input_kg; carton_return_kg; ldpe_input_kg; ldpe_return_kg; packaged_meat_kg; trimming_kg; bone_kg; fat_kg; wastewater_m3; rejected_meat_kg; carton_waste_kg; ldpe_waste_kg; destinations"
      collection_method: "Reconcile cut yields, packaging issues and returns, meters, and disposition-specific outputs by batch"
      unit: "kg; m3; kWh"
      frequency: "each batch; utilities by meter interval"
      temporal_coverage: "justified representative production period or complete campaign, with gaps disclosed"
      site_scope: "every included cutting and packaging site"
      aggregation_rule: "reconcile input mass to all product and waste outputs, then normalize to packaged net meat"
      quality_evidence: "scale and meter calibration; BOM and packaging specifications; inspection and dispatch records; waste manifests"
    - protocol_id: cp_chilled_storage
      process_id: "chilled_storage"
      flow_role: "packaged meat, electricity, R-717, reference output, reject, R-717 loss"
      record_type: "storage batch, temperature, time, meter, scale, refrigerant, service, and release records"
      raw_fields: "batch_id; input_meat_kg; output_meat_kg; rejected_kg; entry_temperature; release_temperature; storage_hours; electricity_kWh; r717_charge_kg; r717_purchase_kg; r717_recovery_kg"
      collection_method: "Link net product mass and time-temperature history to storage electricity and refrigerant records"
      unit: "kg; kWh; h"
      frequency: "each release batch; refrigerant by service event"
      temporal_coverage: "justified representative production period or complete campaign, with gaps disclosed"
      site_scope: "every included factory-gate chilled store"
      aggregation_rule: "sum batch-specific records and normalize to net conforming reference output"
      quality_evidence: "scale, temperature, and meter calibration; release records; service reports; refrigerant reconciliation"
    - protocol_id: cp_sanitation_wastewater
      process_id: "sanitation_wastewater"
      flow_role: "water, electricity, hot water, cleaner, disinfectant, stage wastewater, effluent, screenings, sludge, water emissions"
      record_type: "sanitation log, chemical issue-return, meters, laboratory, treatment, sludge, and transfer records"
      raw_fields: "period_id; water_m3; electricity_kWh; hot_water_quantity; supply_temperature; return_temperature; sodium_hydroxide_product_kg; sodium_hydroxide_concentration; peracetic_product_kg; peracetic_concentration; lairage_wastewater_m3; slaughter_wastewater_m3; condensate_m3; cutting_wastewater_m3; offsite_effluent_m3; screenings_kg; sludge_kg; sludge_dry_matter; discharge_m3; cod_concentration; total_n_concentration; total_p_concentration"
      collection_method: "Reconcile chemical use and stage water flows; pair accredited or controlled sampling with final-discharge volume"
      unit: "kg; m3; kWh; MJ"
      frequency: "each cleaning cycle or meter interval; emissions by sampling plan"
      temporal_coverage: "justified representative production period or complete campaign, with gaps disclosed"
      site_scope: "every included sanitation and wastewater system"
      aggregation_rule: "preserve stage wastewater identities; calculate each direct water emission separately from discharge volume and concentration"
      quality_evidence: "meter calibration; chemical inventory; sampling plan; laboratory QA; treatment log; waste and off-site transfer records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground exchanges"
      rule: "Divide the reconciled exchange assigned to the reference product by net conforming CPC 21115 output for the same period."
      inputs:
        - "assigned exchange"
        - "net reference output kg"
      output: "exchange per 1 kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_mass_balance
      applies_to: "live sheep through products and wastes"
      rule: "Reconcile live input, carcass and meat outputs, anatomical co-products, waste, retained stock, moisture change, and documented gaps without forcing unlike measurement points to equality."
      inputs:
        - "calibrated masses"
        - "stock change"
        - "moisture-state records"
      output: "disclosed batch and period mass reconciliation"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-2021
    - id: calc_energy
      applies_to: "steam, hot water, natural gas, diesel, and LPG"
      rule: "Preserve purchased quantities and calculate energy only with documented pressure, temperatures, density, and calorific values applicable to the recorded carrier."
      inputs:
        - "meter or invoice quantities"
        - "carrier properties"
      output: "carrier-specific energy use"
      source_ids:
        - eu-pef-2021
    - id: calc_refrigerant_loss
      applies_to: "R-717 systems"
      rule: "Calculate unrecovered loss from opening stock, purchases, additions, recovery, transfers, and closing stock; assign by system records or documented load."
      inputs:
        - "refrigerant inventory and service fields"
      output: "kg R-717 to air and make-up input"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
    - id: calc_water_emission
      applies_to: "direct final wastewater discharge"
      rule: "For each pollutant, multiply representative final-effluent concentration by the matched discharge volume, apply unit conversion, and do not sum different substances."
      inputs:
        - "discharge volume"
        - COD
        - "total N"
        - "or total P concentration"
      output: "kg of the named emission to water"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
    - id: calc_allocation
      applies_to: "multi-output process"
      rule: "Apply the declared allocation hierarchy and key to reconciled shared burdens; retain pre-allocation totals, output quantities, prices if used, and allocated shares."
      inputs:
        - "shared inventory"
        - "output masses"
        - "causal parameter or prices"
      output: "inventory assigned to the reference product"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Demonstrate sheep species, CPC 21115 fresh-or-chilled state, cut form, bone status, net mass, and exclusion of frozen meat and offal reference products."
      evidence: "product specification; traceability and temperature records; release label"
    - id: dq_primary_data
      applies_to: "foreground manufacturing"
      requirement: "Use company-specific records for every included operated and subcontracted foreground process and disclose missing primary data."
      evidence: "site and subcontractor records; meter and batch coverage matrix"
    - id: dq_temporal
      applies_to: "declared production period"
      requirement: "Use a justified representative period or complete campaign and disclose seasonality, shutdowns, abnormal operation, and data gaps."
      evidence: "production calendar; period completeness report; gap log"
    - id: dq_measurement
      applies_to: "mass, utilities, temperature, chemical, and emission data"
      requirement: "Retain calibration, sampling, laboratory, conversion, and reconciliation evidence appropriate to each measured quantity."
      evidence: "calibration certificates; sampling plan; laboratory QA; signed reconciliations"
    - id: dq_completeness
      applies_to: "full LCI"
      requirement: "Account for relevant raw materials, utilities, products, each co-product, waste, refrigerant, and direct air and water emission; state every exclusion and unresolved UUID."
      evidence: "completeness matrix; mass, water, energy, chemical, and refrigerant balances"
    - id: dq_transparency
      applies_to: "data package"
      requirement: "Disclose upstream datasets, allocation, proxies, wastewater route, co-product disposition, uncertainty, and deviations from this PCR."
      evidence: "dataset metadata; calculation workbook; deviation and uncertainty log"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require UUID f77c69e0-fe2f-421a-9f33-23b4a09bd9ba, Product flow type, exact CPC 21115 identity, Mass property, and kg unit."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_reference_amount
    applies_to: "reference flow"
    rule: "Require exactly 1 kg net conforming fresh or chilled sheep meat, with packaging, offal, rejected material, and free liquid excluded from reference mass."
    source_ids:
      - un-cpc-3-2025
      - eu-pef-2021
  - rule_id: validate_product_state
    applies_to: "product metadata"
    rule: "Reject a dataset whose reference output is frozen meat, offal, another species, or lacks declared cut, bone, temperature, and factory-gate state."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_process_coverage
    applies_to: "foreground boundary"
    rule: "Require receiving, slaughter, chilling, chilled release, sanitation, wastewater routing, and any applicable cutting, packaging, fuel, or refrigerant operation."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
  - rule_id: validate_atomic_inventory
    applies_to: "inventory"
    rule: "Reject combined carriers, chemicals, packaging, anatomical outputs, wastes, wastewater streams, refrigerants, or emissions; require any additional anatomical output to be added as its own exchange."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021
  - rule_id: validate_balances
    applies_to: "foreground records"
    rule: "Require reconciled mass, water, energy, chemical, and refrigerant balances with explicit stock changes and gaps."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021
  - rule_id: validate_allocation
    applies_to: "multi-output inventory"
    rule: "Require the allocation hierarchy, output disposition, key, period, pre-allocation totals, allocated shares, and economic sensitivity when prices are used."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_completeness
    applies_to: "data package"
    rule: "Require company-specific manufacturing data and complete relevant LCI coverage with transparent exclusions, proxies, quality evidence, and unresolved identities."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Product-specific foreground production dataset for fresh or chilled sheep meat under CPC 21115"
  downstream_use: "May be used as a secondary_dataset or background_dataset when species, product form, bone status, temperature state, technology, geography, allocation, and period are compatible"
  allowed_use: "Factory-gate modelling of declared fresh or chilled sheep meat and aggregation into wider life-cycle models with separate upstream and downstream datasets"
  excluded_use: "Frozen meat; offal as reference product; goat or other species meat; farming, transport, retail, cooking, use, or end-of-life without separate modelling; materially different slaughter or product route without adjustment"
  required_metadata: "PCR id and version; species; product form; bone status; temperature; net mass; sites and subcontractors; live-mass basis; process route; holding time; packaging; geography; period; co-product disposition; allocation; wastewater route; upstream datasets"
  required_quality_disclosure: "Primary-data coverage; calibration and sampling; mass, water, energy, chemical, and refrigerant balances; allocation sensitivity; proxies; unresolved UUIDs; exclusions; uncertainty; abnormal operations; review status"
  update_trigger: "Change in species or source, product form, bone status, temperature state, site, subcontractor, slaughter or cutting route, refrigeration, fuel, sanitation, packaging, wastewater treatment, co-product destination, allocation, upstream dataset, or production period"
