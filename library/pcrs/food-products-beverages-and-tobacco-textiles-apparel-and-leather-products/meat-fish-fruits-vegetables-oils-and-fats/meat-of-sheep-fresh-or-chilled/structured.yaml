system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground starts when live sheep are accepted at the slaughterhouse gate and ends when conforming fresh or chilled sheep meat leaves chilled storage at the factory gate. Animal husbandry and inbound livestock transport remain upstream. The foreground includes directly operated and subcontracted slaughter, chilling, cutting, packaging, sanitation, and wastewater operations when they contribute to the declared product."
      source_ids: []
    - rule_id: boundary_gate
      applies_to: "foreground system"
      rule: "Start at accepted live sheep and end at net conforming fresh or chilled meat released from factory-gate chilled storage."
      source_ids:
        - un-cpc-3-2025
        - ec-jrc-sa-bref-jrc135916
    - rule_id: boundary_exclusions
      applies_to: "wider life cycle"
      rule: "Keep farming, feed, inbound transport, distribution, retail, cooking, use, and end-of-life outside this foreground package and link them separately when required."
      source_ids:
        - un-cpc-3-2025
        - eu-pef-2021
    - rule_id: boundary_product_state
      applies_to: "reference product"
      rule: "Reject frozen meat and offal as the reference product; disclose temperature state, cut form, and bone status."
      source_ids:
        - un-cpc-3-2025
    - rule_id: boundary_site_coverage
      applies_to: "manufacturing sites"
      rule: "Include all operated and subcontracted foreground sites responsible for slaughter, chilling, cutting, packaging, sanitation, or wastewater handling."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_complete_lci
      applies_to: "inventory"
      rule: "Record relevant material, energy, product, co-product, waste, and air and water exchanges separately, with transparent exclusions."
      source_ids:
        - eu-pef-2021
        - ec-jrc-sa-bref-jrc135916
boundary_abstraction:
  declared_starting_condition: "Live sheep accepted after identity and ante-mortem controls, with supplier, origin, live mass, batch, and transport handover recorded."
  starting_condition_role: "Live sheep are the purchased biological product input; husbandry and inbound transport are represented by separate upstream datasets."
  product_classification_scope: "Fresh or chilled sheep meat under CPC 3.0 code 21115; frozen meat and offal reference products are excluded."
  recursive_input_rule: "Purchased fresh or chilled sheep meat already within this category is recorded as one upstream product input with its own dataset and is not recursively decomposed inside the foreground package."
  upstream_dataset_requirement: "Link live sheep, farming, inbound transport, water, electricity, fuels, steam, hot water, refrigerant, chemicals, and packaging to traceable upstream datasets; disclose every proxy and geographic mismatch."
  disclosure: "Declare species evidence, live-mass basis, slaughter and cutting configuration, product form, bone status, chilling route, temperature, holding time, sites and subcontractors, co-product destinations, allocation, sanitation, wastewater treatment, geography, period, and data gaps."
