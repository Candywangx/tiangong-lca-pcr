allocation_rules:
  - rule_id: alloc_avoid
    applies_to: "all foreground processes"
    rule: "Prefer subdivision, direct metering, and lot-level mass balance so that allocation is avoided."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_route_specific
    applies_to: "shared equipment and utilities"
    rule: "Allocate measured shared utilities using the most physically representative driver available, such as equipment time, metered energy, processed mass, or storage mass-time; disclose the driver and affected flows."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_reject_destinations
    applies_to: "rejects, samples, and recovered material"
    rule: "Treat outputs according to their documented destination and economic function; do not assign avoided burdens or co-product credit without a goal-consistent, source-supported allocation or substitution rule."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_reception_mass_and_lot
      process_id: "reception_and_lot_definition"
      flow_role: "received mass, qualifiers, accepted mass, rejects, samples"
      record_type: "weighbridge or calibrated scale records; receiving inspection; laboratory or rapid moisture records"
      raw_fields: "lot_id; supplier_or_origin; crop_year_or_period; variety_or_type; treatment; received_net_mass; accepted_mass; reject_mass; sample_mass; moisture_value; moisture_basis; method; grade; size"
      collection_method: "Capture each received lot and reconcile acceptance records to scale tickets and inspection records"
      unit: "kg; kg/kg or % by mass"
      frequency: "each lot"
      temporal_coverage: "all lots in reporting period"
      site_scope: "all foreground receiving points"
      aggregation_rule: "Sum mass by lot and destination; retain lot-level results before normalization"
      quality_evidence: "calibration status; ticket or batch record; sampling record; moisture method; reviewer sign-off"
    - protocol_id: cp_sorting_records
      process_id: "cleaning_sorting_and_grading"
      flow_role: "transferred kernels, energy, conditional water, graded output, rejects, wastewater"
      record_type: "batch mass records; submeter or invoice allocation; water meter; grade and size inspection"
      raw_fields: "lot_id; input_mass; energy_by_carrier; wet_cleaning_flag; water_input; graded_mass_by_class; reject_mass_by_fraction; wastewater_volume"
      collection_method: "Capture each batch and preserve grade, size, treatment, and wet-cleaning route"
      unit: "kg; kWh; MJ; m3"
      frequency: "each batch and meter period"
      temporal_coverage: "all batches in reporting period"
      site_scope: "all foreground sorting lines"
      aggregation_rule: "Reconcile batch inputs to graded output, rejects, samples, wastewater, and measured mass change; allocate shared utilities by disclosed driver"
      quality_evidence: "scale and meter calibration; grade inspection; allocation worksheet; mass-balance review"
    - protocol_id: cp_conditioning_records
      process_id: "moisture_conditioning"
      flow_role: "conditioning-route mass, energy, conditioned output, rejects, direct emissions"
      record_type: "route assignment; batch scales; moisture tests; energy meters; fuel records; accepted emission factors or measurements"
      raw_fields: "lot_id; conditioning_flag; input_mass; input_moisture; output_mass; output_moisture; energy_by_carrier; reject_mass; fuel_quantity; emission_factor_id; measured_emission"
      collection_method: "Record only conditioned lots and keep direct-packaging lots outside this protocol"
      unit: "kg; kg/kg or % by mass; kWh; MJ; carrier-specific emission unit"
      frequency: "each conditioned batch and meter period"
      temporal_coverage: "all conditioned batches in reporting period"
      site_scope: "all foreground conditioning equipment"
      aggregation_rule: "Normalize to conditioned output; calculate direct emissions only from collected fuel or measurement fields and a disclosed accepted factor"
      quality_evidence: "route check; scale, moisture, and meter calibration; factor provenance; mass-balance review"
    - protocol_id: cp_packaging_storage_records
      process_id: "packaging_and_storage"
      flow_role: "route-specific kernel input, packaging, energy, reference output, losses, refrigerant emissions"
      record_type: "packaging batch records; package specifications or measured item mass; energy meter; warehouse inventory; refrigerant service logs"
      raw_fields: "lot_id; source_route; kernel_input_mass; packaged_net_mass; package_material; package_count; mass_per_item; packaging_energy; storage_energy; storage_start; storage_end; temperature_condition; loss_mass; waste_mass; refrigerant_type; refrigerant_loss"
      collection_method: "Capture each packaging batch and included storage interval; verify exclusive source route"
      unit: "kg; item; kWh; MJ; day; degC; carrier-specific emission unit"
      frequency: "each packaging batch; monthly for storage and refrigerant records"
      temporal_coverage: "all packaged lots and included storage days in reporting period"
      site_scope: "all foreground packaging and included storage facilities"
      aggregation_rule: "Convert counts to mass; allocate storage utilities and leakage by net mass-time; normalize to 1 kg packaged output"
      quality_evidence: "package weighing record; meter record; inventory reconciliation; service log; route and duration review"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "all inventory rows"
      rule: "normalized amount = lot or period quantity divided by packaged net kernel mass; for storage rows also retain the included mass-time denominator"
      inputs:
        - "row quantity"
        - packaged_net_mass
        - "storage duration when applicable"
      output: "amount per 1 kg reference flow, with storage time disclosed"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_reception_balance
      applies_to: "reception"
      rule: "accepted_mass = received_net_mass - reject_mass - sample_mass, adjusted only when a documented moisture-basis conversion is required"
      inputs:
        - received_net_mass
        - reject_mass
        - sample_mass
        - "moisture values and bases"
      output: "accepted received kernel mass"
      source_ids: []
    - id: calc_sorting_balance
      applies_to: "cleaning and sorting"
      rule: "reconcile input_mass with graded_mass_by_class, reject_mass_by_fraction, sample mass, and measured moisture-related mass change; report unresolved difference"
      inputs:
        - "input and output mass fields"
        - "moisture fields"
      output: "graded output, rejects, and mass-balance difference"
      source_ids: []
    - id: calc_conditioning_balance
      applies_to: "conditioning route"
      rule: "reconcile conditioned input and output on the declared moisture basis and keep evaporated or added water distinct from solid rejects"
      inputs:
        - input_mass
        - output_mass
        - input_moisture
        - output_moisture
        - reject_mass
      output: "conditioned output, water-related mass change, rejects"
      source_ids: []
    - id: calc_packaging_mass
      applies_to: "packaging materials"
      rule: "packaging mass = package_count multiplied by measured or supplier-specific mass_per_item for each material and format"
      inputs:
        - package_count
        - mass_per_item
        - package_material
      output: "kg packaging per 1 kg reference flow"
      source_ids: []
    - id: calc_storage_allocation
      applies_to: "included storage"
      rule: "allocate storage energy and verified refrigerant loss by net packaged mass multiplied by storage duration, unless a more representative measured driver is documented"
      inputs:
        - "storage energy"
        - "refrigerant loss"
        - "packaged mass"
        - "storage duration"
      output: "storage inventory per 1 kg reference flow and declared duration"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_and_condition
      applies_to: "all lots"
      requirement: "Retain lot identity and the available commercial-condition qualifiers, including moisture method, defect/grade class, size designation or method, treatment, and package format."
      evidence: "receiving, inspection, laboratory, and packaging records; unece-ddp-06-2024"
    - id: dq_route_exclusivity
      applies_to: "each mass portion after sorting"
      requirement: "Demonstrate that the mass follows either direct packaging or conditioning followed by packaging, with no duplication."
      evidence: "route assignment and packaging source-route reconciliation"
    - id: dq_measurement
      applies_to: "mass, moisture, energy, water, and direct-emission records"
      requirement: "Use calibrated or verified instruments where applicable, retain units and moisture basis, and document allocation of shared meters."
      evidence: "calibration certificates, meter checks, laboratory methods, and allocation worksheets"
    - id: dq_temporal_and_site_coverage
      applies_to: "reporting period"
      requirement: "Cover all foreground sites and all lots in the declared reporting period; disclose exclusions, downtime, abnormal lots, and storage intervals."
      evidence: "lot register, production calendar, site list, and exception log"
    - id: dq_mass_balance
      applies_to: "every lot or batch"
      requirement: "Reconcile inputs, saleable outputs, rejects, samples, waste, and moisture-related mass change and investigate unresolved differences."
      evidence: "signed lot or batch mass-balance worksheet"
    - id: dq_provisional_range_replacement
      applies_to: "every reasoned_estimate range"
      requirement: "Treat the range as conditional and temporary; replace it when an accepted source-backed range or at least 12 consecutive representative lot records are available, and document the replacement decision."
      evidence: "source review record or retained lot-series analysis"
