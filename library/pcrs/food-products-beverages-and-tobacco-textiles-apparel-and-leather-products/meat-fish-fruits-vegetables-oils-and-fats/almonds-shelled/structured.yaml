system_boundary:
  rules:
    - rule_id: sb_start_shelled
      applies_to: "all datasets"
      rule: "Start the foreground boundary with received shelled kernels; do not include cultivation, hulling, or shell removal as foreground operations."
      source_ids:
        - unsd-cpc-3-0-21422
        - unece-ddp-06-2024
    - rule_id: sb_route_exclusivity
      applies_to: "post-sorting lot"
      rule: "Assign each mass portion either to direct packaging or to conditioning followed by packaging; never model both branches for the same mass."
      source_ids: []
    - rule_id: sb_upstream_inputs
      applies_to: "purchased inputs"
      rule: "Link received kernels, energy, water, packaging, and other purchased inputs to appropriate upstream datasets and disclose dataset substitutions."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_completeness
      applies_to: "foreground operations"
      rule: "Record all included material and energy inputs, product, reject and waste outputs, and measured direct emissions; disclose exclusions and missing data without applying an unsupported numerical cut-off."
      source_ids:
        - eu-pef-2021-2279
