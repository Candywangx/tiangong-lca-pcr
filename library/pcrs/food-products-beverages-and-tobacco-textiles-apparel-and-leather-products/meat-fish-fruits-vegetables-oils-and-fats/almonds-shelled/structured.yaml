    name: "Cleaning, sorting and grading"
    inclusion: "required"
    inclusion_condition: "All foreground datasets; wet cleaning only when actually performed"
    role: "Remove foreign matter and nonconforming kernels and establish the saleable grade and size class"
    quantitative_reference: "kg graded kernels"
  - id: moisture_conditioning
    name: "Moisture conditioning"
    inclusion: "conditional"
    inclusion_condition: "Include only when the lot is dried or otherwise moisture-conditioned before packaging; omit for the direct-packaging branch"
    role: "Adjust and verify the declared commercial moisture condition"
    quantitative_reference: "kg conditioned kernels"
  - id: packaging_and_storage
    name: "Packaging and storage"
