validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require exactly 1 kg net fish fillet mass linked to product flow 130aa38f-8c63-4d0b-ad05-0b2c4426cdd8, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, mass unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids:
      - codex-cxs-190-1995
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Fail completeness when species, production system and origin, fillet presentation, skin/bone status, glazing status and mass, freezing technology, processing location, storage duration, or net-mass basis is missing."
    source_ids:
      - codex-cxs-190-1995
      - codex-cxc-52-2003
  - rule_id: validate_freezing_endpoint
    applies_to: "Each finished-product lot"
    rule: "Require evidence that the thermal centre reached -18 °C or colder after stabilization and that the product remained frozen during the included storage period; flag unassessed excursions."
    source_ids:
      - codex-cxs-190-1995
  - rule_id: validate_glaze_exclusion
    applies_to: "Glazed products"
    rule: "Require separately measured glaze and confirm that declared net fish mass excludes glaze and packaging."
    source_ids:
      - codex-cxs-190-1995
  - rule_id: validate_process_coverage
    applies_to: "Foreground inventory"
    rule: "Require receiving/preparation, filleting/trimming/washing, quick freezing, optional glazing when used, packing, factory frozen storage, co-product and waste handling, wastewater, energy, and refrigerant records or explicit justified zero/not-applicable declarations."
    source_ids:
      - codex-cxs-190-1995
      - codex-cxc-52-2003
  - rule_id: validate_mass_balance
    applies_to: "Each aggregation period"
    rule: "Require accepted source fish and other retained material inputs to reconcile with net product, co-products, residues, glaze, wastewater solids, and stock change; report the unexplained difference and corrective action rather than silently balancing it."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_allocation
    applies_to: "Multifunctional processes"
    rule: "Require documented subdivision attempt, selected physical relationship or justified economic fallback, allocation factors summing to one, and sensitivity disclosure where the method could materially change results."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_temporal_site_coverage
    applies_to: "Foreground dataset"
    rule: "Require the declared representative period and site coverage, with missing periods, excluded sites, and extrapolation disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_provisional_ranges
    applies_to: "Candidate QA ranges"
    rule: "Treat every reasoned_estimate range only as a screening flag; do not replace foreground records with the range and require review or replacement before publication-critical use."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground frozen-fish-fillet production dataset normalized to 1 kg net product at the processing-facility gate"
  downstream_use: "May be used as a secondary_dataset or background_dataset for food-product LCAs when species, origin, production system, geography, technology, storage duration, allocation, and data quality fit the study"
  allowed_use: "Cradle-to-gate or downstream product systems that need a transparent frozen fish fillet input and preserve the declared upstream source-fish datasets and qualifiers"
  excluded_use: "Direct representation of fresh fish, minced fish, breaded/battered products, smoked/dried/salted/canned/cooked products, retail or consumer stages, or another species/origin/technology without a documented representativeness assessment"
  required_metadata: "PCR id and version; product flow UUID; species; wild-caught or aquaculture production system; source origin; upstream datasets; fillet presentation; skin/bone and glaze status; net-mass method; processing site; freezing technology; storage duration; electricity mix; refrigerant; co-product destinations; allocation method; reference period"
  required_quality_disclosure: "Site and temporal coverage; mass-balance difference; meter and scale quality; temperature and food-safety evidence; source-data gaps; proxy datasets; provisional estimates; allocation sensitivity; excluded stages"
  update_trigger: "Material change in species or source-fish production system, filleting yield, freezing or glazing technology, packaging, electricity mix, refrigerant, storage duration, co-product market, allocation basis, site coverage, food-safety requirement, or representative data period"
