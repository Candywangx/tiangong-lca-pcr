    - id: dq_site_coverage
      applies_to: "Multi-site datasets"
      requirement: "Include every site represented by the dataset or report production-weighted coverage and excluded sites; do not silently extrapolate one site to another."
      evidence: "Site list, production totals, coverage calculation"
    - id: dq_measurement_control
      applies_to: "Mass, energy, water, refrigerant, and temperature"
