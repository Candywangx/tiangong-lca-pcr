system_boundary:
  rules:
    - rule_id: boundary_foreground_gate
      applies_to: "Foreground processing"
      rule: "Include all material and energy flows from facility receipt of source fish through filleting, trimming, washing, quick freezing, optional glazing, packing, and frozen storage to the facility gate."
      source_ids:
        - codex-cxs-190-1995
        - codex-cxc-52-2003
    - rule_id: boundary_upstream_links
      applies_to: "Source fish and inbound supplies"
      rule: "Link upstream datasets for source fish, inbound transport, water, energy carriers, packaging, and other purchased materials; do not omit their burdens from a cradle-to-gate result."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_cold_chain
      applies_to: "Freezing and frozen storage"
      rule: "Include electricity, fuel, refrigerant losses, and product losses associated with freezing and the declared factory frozen-storage period."
      source_ids:
        - codex-cxs-190-1995
        - codex-cxc-52-2003
    - rule_id: boundary_waste_treatment
      applies_to: "Residues, wastewater, and packaging waste"
      rule: "Include on-site treatment and link off-site transport and treatment datasets for wastes crossing the facility boundary; separately identify co-products that leave for beneficial use."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_downstream_exclusion
      applies_to: "Downstream stages"
      rule: "Exclude post-gate distribution, retail, thawing, consumer cooking, consumption, and end-of-life unless the study explicitly expands the declared system; disclose every added downstream stage."
      source_ids:
        - eu-pef-2021-2279
