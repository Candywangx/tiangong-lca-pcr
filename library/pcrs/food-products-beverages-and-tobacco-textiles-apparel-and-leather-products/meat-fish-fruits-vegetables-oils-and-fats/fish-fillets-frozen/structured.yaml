allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared preparation, freezing, packing, and storage operations"
    rule: "Avoid allocation where possible by submetering and subdividing operations, lots, equipment, and storage periods so inputs and outputs are directly assigned to the frozen fillet product."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relationship
    applies_to: "Unresolved multifunctional processes"
    rule: "When subdivision or system expansion is not practicable, apply a documented causal physical relationship; for jointly processed fish outputs with no stronger causal parameter, use wet mass measured at the separation point and test sensitivity to dry matter or another functionally relevant property."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_fallback
    applies_to: "Co-products lacking a defensible physical relationship"
    rule: "Use economic allocation only when no defensible physical relationship can be established; use representative annual average net prices at the same market boundary and disclose price sources, period, currency, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_no_credit
    applies_to: "Fish residues, wastewater, packaging waste, and rejected product"
    rule: "Do not assign co-product credit to material classified and managed as waste. Include treatment burdens and report any system-expansion or avoided-product credit separately with the substituted function and dataset disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_mass_reconciliation
    applies_to: "All co-products and wastes"
    rule: "Preserve the unallocated wet-mass balance before applying allocation and report allocation factors that sum to one across burden-bearing products."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_mass_identity
      process_id: "prepare_fillets_quick_freeze_glaze_pack_store"
      flow_role: "Fish inputs, intermediates, product, co-products, residues, glaze"
      record_type: "Weighbridge, scale, batch, and product-specification records"
      raw_fields: "lot_id; species; origin; production_system; preservation_state; gross_mass; tare_mass; glaze_mass; net_fish_mass; co_product_mass; residue_mass; destination"
      collection_method: "Calibrated scales with linked lot and transfer records; verified deglazing or equivalent method for glaze"
      unit: "kg"
      frequency: "Each lot and transfer"
      temporal_coverage: "At least 12 consecutive representative months or the full seasonal campaign"
      site_scope: "Each included processing site and relevant line"
      aggregation_rule: "Sum valid masses by lot and process; reconcile transfers; normalize to accepted net reference product"
      quality_evidence: "Calibration certificates; lot traceability; product specification; deglazing method; reconciliation log"
    - protocol_id: cp_water_records
      process_id: "prepare_fillets_quick_freeze_glaze"
      flow_role: "Preparation and glazing water"
      record_type: "Meter, tank, and batch records"
      raw_fields: "meter_id; opening_reading; closing_reading; batch_volume; water_source; food_contact_quality; allocation_key"
      collection_method: "Submetered supply or documented tank balance linked to operating period"
      unit: "kg or m3"
      frequency: "Daily and each glazing lot"
      temporal_coverage: "Same representative period as production"
      site_scope: "Each included site and water system"
      aggregation_rule: "Convert volume using measured or documented density; subtract documented non-process use; normalize to process output"
      quality_evidence: "Meter checks; potable or clean-seawater verification; batch records"
    - protocol_id: cp_energy_records
      process_id: "prepare_fillets_quick_freeze_glaze_pack_store"
      flow_role: "Electricity and fuels"
      record_type: "Meter, invoice, equipment-runtime, and storage-occupancy records"
      raw_fields: "meter_id; opening_reading; closing_reading; fuel_quantity; unit; equipment_power; operating_hours; storage_days; occupied_capacity; allocation_key"
      collection_method: "Submeter first; otherwise reconcile invoices with documented equipment load, runtime, and occupied capacity"
      unit: "kWh, MJ, or purchased fuel unit"
      frequency: "Monthly plus batch or shift submetering where available"
      temporal_coverage: "At least 12 consecutive representative months or full seasonal campaign"
      site_scope: "Each included site, line, freezer, and cold room"
      aggregation_rule: "Assign direct meters; allocate residual shared use by documented physical driver; normalize to process output"
      quality_evidence: "Meter calibration; invoices; runtime logs; allocation worksheet; energy balance"
    - protocol_id: cp_wastewater_records
      process_id: "prepare_fillets_quick_freeze_glaze"
      flow_role: "Wastewater and entrained solids"
      record_type: "Effluent meter, tank, sampling, and treatment records"
      raw_fields: "discharge_volume; density; solids_mass; treatment_route; sampling_time; process_assignment"
      collection_method: "Meter or tank balance with representative sampling and treatment-route records"
      unit: "kg or m3"
      frequency: "Daily or per discharge event"
      temporal_coverage: "Same representative period as production"
      site_scope: "Each included discharge point"
      aggregation_rule: "Convert volume to mass; keep separately measured solids distinct; normalize to process output"
      quality_evidence: "Meter checks; laboratory reports; discharge and treatment manifests"
    - protocol_id: cp_refrigerant_records
      process_id: "quick_freeze_glaze_pack_store"
      flow_role: "Chemical-specific refrigerant loss"
      record_type: "Equipment charge, purchase, service, recovery, and transfer records"
      raw_fields: "refrigerant_id; opening_charge; additions; recovered; transferred; closing_charge; equipment_service"
      collection_method: "Annual or campaign inventory balance by refrigerant and equipment group"
      unit: "kg"
      frequency: "Each service event and annual close"
      temporal_coverage: "At least one complete inventory balance covering the production period"
      site_scope: "Each included freezer and cold-storage equipment group"
      aggregation_rule: "Loss = opening + additions - recovered - transferred - closing; allocate by equipment service or documented cooling load"
      quality_evidence: "Service invoices; cylinder logs; recovery records; inventory sign-off"
    - protocol_id: cp_packaging_records
      process_id: "pack_store"
      flow_role: "Packaging input and waste"
      record_type: "Purchase, issue, bill-of-material, return, and scrap records"
      raw_fields: "material_id; material_type; purchased_mass; issued_mass; returned_mass; scrap_mass; packs_produced; pallet_reuse_cycles"
      collection_method: "Mass reconciliation by packaging material and product format"
      unit: "kg"
      frequency: "Each packaging run, aggregated monthly"
      temporal_coverage: "Same representative period as production"
      site_scope: "Each included packing line and product format"
      aggregation_rule: "Net input = issued - returned; keep scrap output separate; allocate reusable tertiary packaging by verified use cycles"
      quality_evidence: "Supplier specification; purchase records; stock reconciliation; scrap tickets"
    - protocol_id: cp_temperature_records
      process_id: "quick_freeze_glaze_pack_store"
      flow_role: "Freezing endpoint and frozen storage"
      record_type: "Calibrated probe and cold-room logger records"
      raw_fields: "lot_id; probe_id; thermal_centre_temperature; stabilization_time; room_temperature; timestamp; excursion_action"
      collection_method: "Product-core measurements at validated locations plus continuous or justified interval storage logging"
      unit: "°C"
      frequency: "Each lot at freezing completion; continuous or justified interval for storage"
      temporal_coverage: "Entire included production and storage period"
      site_scope: "Each freezer, lot, and cold room"
      aggregation_rule: "Retain lot minimum/maximum and excursion duration; link corrective action to affected lot"
      quality_evidence: "Calibration certificate; validation study; logger record; excursion and corrective-action log"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "Normalized amount = valid foreground amount / net frozen fish fillet mass at facility gate"
      inputs:
        - "Valid flow amount"
        - "net_fish_mass excluding glaze and packaging"
      output: "Amount per 1 kg reference flow"
      source_ids:
        - codex-cxs-190-1995
    - id: calc_net_fish_mass
      applies_to: "Glazed products"
      rule: "Net fish mass = gross frozen product mass - verified glaze mass; packaging is excluded from both product masses"
      inputs:
        - gross_mass
        - glaze_mass
        - "packaging tare"
      output: "net_fish_mass"
      source_ids:
        - codex-cxs-190-1995
    - id: calc_process_mass_balance
      applies_to: "prepare_fillets and quick_freeze_glaze"
      rule: "Mass-balance difference = accepted material inputs - separately measured product, co-product, waste, retained glaze, and discharged material outputs; investigate material unexplained differences"
      inputs:
        - "Lot masses"
        - "water retained where relevant"
        - product
        - co-product
        - residue
        - wastewater-solid
        - "and glaze masses"
      output: "Reconciled mass-balance record and unexplained difference"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_refrigerant_loss
      applies_to: "Freezing and storage equipment"
      rule: "Refrigerant loss = opening charge + additions - recovered - transferred - closing charge"
      inputs:
        - "Chemical-specific equipment inventory fields"
      output: "kg refrigerant emitted, allocated to process output"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_physical_allocation
      applies_to: "Joint products"
      rule: "Allocation factor_i = selected causal physical quantity_i / sum of that quantity for all burden-bearing products"
      inputs:
        - "Measured quantities at separation point"
        - "selected physical property"
      output: "Product-specific allocation factors summing to one"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_economic_allocation
      applies_to: "Economic fallback"
      rule: "Allocation factor_i = representative net market value_i / sum of net market values for all burden-bearing co-products at the same boundary"
      inputs:
        - "Annual average prices"
        - "measured co-product quantities"
      output: "Economic allocation factors summing to one"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
