  classification_refs: "CPC 3.0: 21495 — Nuts, groundnuts and other seeds, roasted, salted or otherwise prepared, n.e.c."
  covered_products: "Edible nuts, groundnuts and edible seeds sold after roasting, salting, seasoning, coating, sterilization, osmotic dehydration, airtight preservation or another preparation route consistent with CPC 21495; mixtures are covered only when the finished mixture is within this category."
  excluded_products: "Unprepared or merely shelled nuts; seed for planting; simple dried nut or dried-fruit mixtures; sugar-preserved products; frozen products; jams, jellies, purees and pastes; nut or seed oils; nut or seed meals; nut or seed butters where classified separately; prepared meals; non-food seed products."
  representative_product: "One kilogram of saleable prepared edible nuts or seeds at the preparation-facility gate, with route and formulation declared."
  production_route: "Declare one or more of roasted, salted, and other_preparation; additionally declare dry or oil roasting, dry salting or wet/brine salting, and the specific other-preparation technology when applicable."
  market_state: "Finished, saleable, packaged food product at the preparation-facility gate; ready for distribution or further use as a food ingredient."
functional_unit:
  what: "Prepared edible nuts, groundnuts or other edible seeds providing the declared species, formulation, preparation route and market quality."
  how_much: "1 kg net mass of saleable product, excluding packaging."
  how_well: "Meets the declared product specification, route, salt/seasoning or coating formulation, moisture or water-activity state, and food-safety release criteria."
  how_long_or_cycle: "One production lot at the preparation-facility gate; no use-duration function is assigned."
  reference_flow_link: "The reference flow is exactly the 1 kg net saleable product output defined below."
system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate
      applies_to: "foreground system"
      rule: "Include receiving/preparation, every active preparation route, post-treatment handling, finishing, packing, internally generated wastes, wastewater and direct emissions up to the packaged facility-gate product. Link all crossing product and service inputs to upstream datasets."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_route_activation
      applies_to: "route-specific operations"
      rule: "Activate roasting only for a roasted or thermally treated route, salting only for dry-salted or wet/brine-salted routes, and other preparation only for the specifically declared alternative operation; never apply a generic combined route to every product."
      source_ids:
        - unsd-cpc-3-0-21495
    - rule_id: boundary_low_moisture_controls
      applies_to: "products with water activity at or below 0.85"
      rule: "Include resource use, rejects and cleaning consequences associated with applicable raw-material control, microbial-reduction treatment, dry-area control and post-treatment handling. This hygiene boundary applies only when the product and process fall within CXC 75-2015 and supplies no LCA quantity."
      source_ids:
        - codex-cxc-75-2015
    - rule_id: boundary_post_treatment_additions
      applies_to: "ingredients added after a microbial-reduction step"
      rule: "Include the ingredient input and associated handling, hygiene control, losses and packaging exposure because post-treatment additions can change the relevant process boundary."
      source_ids:
        - codex-cxc-75-2015
    - rule_id: boundary_excluded_stages
      applies_to: "distribution, retail, use and end-of-life"
      rule: "Exclude these stages from the foreground gate-to-gate inventory unless explicitly added for the study goal; disclose any added stage and keep it separate from facility production."
      source_ids:
        - eu-pef-2021-2279
