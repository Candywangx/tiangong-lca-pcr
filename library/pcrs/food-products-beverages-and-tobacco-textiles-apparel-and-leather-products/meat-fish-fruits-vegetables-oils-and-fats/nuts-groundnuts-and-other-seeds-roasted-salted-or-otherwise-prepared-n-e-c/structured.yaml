allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "all multi-output and shared-utility operations"
    rule: "First avoid allocation through process subdivision, separate metering and direct mass or energy assignment to each product or route."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residue_classification
    applies_to: "shells, skins, recovered seasoning, off-specification product and other outputs"
    rule: "Classify each output as waste, recyclable material or co-product according to its actual control and destination; do not assign avoided burden merely because a residue has a downstream use."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_then_economic
    applies_to: "inseparable remaining shared burdens"
    rule: "Where subdivision or direct causality is not feasible, use a documented physical relationship that reflects causality. Use economic allocation only when no defensible physical relationship exists, and disclose prices, period, geography and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recycled_or_reused_brine
    applies_to: "internally reused brine, seasoning, heat or intermediate material"
    rule: "Keep internal reuse inside the foreground mass and energy balance; record only makeup inputs and actual discharges crossing the system boundary, with losses reconciled."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_received_materials
      process_id: "receiving_preparation"
      flow_role: "received nuts, seeds and ingredients"
      record_type: "weighbridge, scale and supplier-lot records"
      raw_fields: "species; form; supplier; origin; lot; gross mass; tare; net mass; moisture or water activity when relevant; prior treatment"
      collection_method: "calibrated scale reconciled to receipt and inventory records"
      unit: "kg"
      frequency: "each delivery and lot"
      temporal_coverage: "representative reporting period covering material sourcing and production variability"
      site_scope: "all facilities and suppliers in declared scope"
      aggregation_rule: "sum net received mass by species and lot; separately retain already prepared inputs"
      quality_evidence: "calibration certificate; receipt reconciliation; supplier specification"
    - protocol_id: cp_route_materials
      process_id: "roasting_treatment_salting_seasoning_other_preparation"
      flow_role: "route feed and transfers"
      record_type: "batch and transfer records"
      raw_fields: "route; batch; species; input mass; output mass; timestamp; recipe; endpoint; moisture or water activity when relevant"
      collection_method: "calibrated batch scales and transfer meters"
      unit: "kg"
      frequency: "each campaign"
      temporal_coverage: "all campaigns in reporting period"
      site_scope: "every active line and route"
      aggregation_rule: "sum by route and reconcile transfers without double counting"
      quality_evidence: "scale checks; batch genealogy; exception log"
    - protocol_id: cp_process_energy
      process_id: "all_active_processes"
      flow_role: "electricity, fuel, steam and heat"
      record_type: "meter, invoice and equipment records"
      raw_fields: "carrier; meter boundary; opening and closing reading; quantity; unit; operating hours; batch; allocation driver; calorific value if converted"
      collection_method: "sub-meter preferred; otherwise reconciled facility meter and documented allocation"
      unit: "native carrier unit, kWh or MJ"
      frequency: "continuous or each campaign; invoice reconciliation monthly"
      temporal_coverage: "representative reporting period including normal startup, shutdown and failed production"
      site_scope: "every included line and utility system"
      aggregation_rule: "aggregate by carrier and process; normalize to measured process output; disclose allocation"
      quality_evidence: "meter calibration; invoice reconciliation; conversion source; allocation check"
    - protocol_id: cp_ingredient_use
      process_id: "salting_seasoning_other_preparation"
      flow_role: "salt, seasoning, coating and preparation media"
      record_type: "recipe issue, return and inventory records"
      raw_fields: "material identity; lot; issued mass; returned mass; recovered mass; retained estimate; batch"
      collection_method: "calibrated ingredient scales plus inventory reconciliation"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "all applicable batches"
      site_scope: "every declared formulation and line"
      aggregation_rule: "net issue equals issued minus documented return or recovery; report materials separately"
      quality_evidence: "recipe version; scale check; stock reconciliation"
    - protocol_id: cp_water_brine
      process_id: "salting_seasoning_other_preparation"
      flow_role: "water, brine and wastewater"
      record_type: "flow meter, tank and laboratory records"
      raw_fields: "makeup water; reused volume or mass; salt concentration; discharge mass or volume; total solids; destination; batch"
      collection_method: "calibrated flow or tank measurement; sampling for concentration where material"
      unit: "kg, m3 and concentration unit"
      frequency: "each batch or continuous; discharge sampling at representative frequency"
      temporal_coverage: "all wet-operation periods in reporting period"
      site_scope: "every wet-operation line, reuse loop and discharge point in scope"
      aggregation_rule: "mass-balance water and salt; convert volume using measured or documented density"
      quality_evidence: "meter calibration; sample chain; treatment manifest; balance closure"
    - protocol_id: cp_intermediate_outputs
      process_id: "all_active_preparation_processes"
      flow_role: "accepted intermediate output"
      record_type: "batch output and quality-release records"
      raw_fields: "batch; route; output mass; endpoint; moisture; water activity if relevant; reject mass; release status"
      collection_method: "calibrated output scale linked to quality release"
      unit: "kg"
      frequency: "each campaign"
      temporal_coverage: "all campaigns in reporting period"
      site_scope: "every active preparation route and line"
      aggregation_rule: "sum accepted outputs only and reconcile with next-process inputs"
      quality_evidence: "scale check; release record; batch genealogy"
    - protocol_id: cp_waste_outputs
      process_id: "all_active_processes"
      flow_role: "residues, rejects, effluent and packaging scrap"
      record_type: "waste scale, manifests and treatment records"
      raw_fields: "stream identity; mass; moisture if relevant; hazardous status; destination; sale or fee; batch or period"
      collection_method: "calibrated scale or documented haulier measurement; effluent meter for liquid streams"
      unit: "kg or m3"
      frequency: "each removal or discharge"
      temporal_coverage: "reporting period"
      site_scope: "all included facilities, processes and waste destinations"
      aggregation_rule: "aggregate separately by stream and fate; no netting against product input"
      quality_evidence: "waste manifest; scale record; destination evidence"
    - protocol_id: cp_final_packaging
      process_id: "finishing_packaging"
      flow_role: "bulk product, packaging and saleable output"
      record_type: "packing-line, bill-of-material and finished-goods records"
      raw_fields: "product SKU; route; formulation; bulk input; net saleable output; package material; unit mass; units used; scrap; gas use if applicable"
      collection_method: "calibrated checkweigher, packaging BOM verification and inventory reconciliation"
      unit: "kg"
      frequency: "each production lot and packaging change"
      temporal_coverage: "all saleable lots in reporting period"
      site_scope: "every packaging format and line in the declared scope"
      aggregation_rule: "normalize packaging and line inputs to net released product mass"
      quality_evidence: "checkweigher checks; BOM revision; finished-goods reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground flows"
      rule: "normalized amount = flow amount attributable to included product / net mass of released saleable product"
      inputs:
        - "attributable flow amount"
        - "released net product mass"
      output: "flow amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_route_energy
      applies_to: "each active route"
      rule: "route energy intensity = carrier-specific route energy / measured accepted route output; preserve carrier identity and report any shared-meter allocation"
      inputs:
        - "carrier meter records"
        - "accepted route output"
        - "allocation driver if needed"
      output: "kWh or MJ per kg active-route output"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_material_balance
      applies_to: "each process and full foreground system"
      rule: "closing discrepancy = total measured mass inputs - total measured product outputs - measured waste outputs - separately estimated evaporation or retained inventory; report sign and percentage of input"
      inputs:
        - input
        - output
        - waste
        - "moisture and inventory-change records"
      output: "process and system mass-balance closure"
      source_ids: []
    - id: calc_brine_balance
      applies_to: "wet or brine salting"
      rule: "reconcile water and salt in makeup, reuse, retained product, discharge and inventory change; do not count internal recirculation as a new boundary input"
      inputs:
        - water
        - salt
        - concentration
        - reuse
        - "discharge and product records"
      output: "net water and salt flows per kg salted output"
      source_ids: []
    - id: calc_allocation
      applies_to: "remaining shared processes"
      rule: "apply the selected allocation rule only after subdivision and direct assignment have been attempted; retain driver values and sensitivity where economic allocation is used"
      inputs:
        - "shared burden"
        - "physical driver or price data"
        - "product outputs"
      output: "allocated foreground flow amounts"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_route_identity
      applies_to: "reference product and all active routes"
      requirement: "Species, physical form, route family, formulation, technology, product state, packaging, geography and reporting period shall be explicit and traceable to production lots."
      evidence: "product specification; batch genealogy; route declaration"
    - id: dq_temporal_representativeness
      applies_to: "all foreground records"
      requirement: "Use a period representative of normal production and relevant seasonal, supplier, formulation and startup/shutdown variation; disclose actual dates, excluded events and coverage share rather than assuming a universal duration."
      evidence: "record coverage analysis; production schedule; exception log"
    - id: dq_measurement_traceability
      applies_to: "mass, water and energy"
      requirement: "Identify meter or scale boundary, calibration status, native unit, conversion and allocation method. Shared-meter allocations require reconciliation to the facility total."
      evidence: "calibration records; meter map; invoices; reconciliation worksheet"
    - id: dq_completeness
      applies_to: "active foreground processes"
      requirement: "Include all material, energy, water, product, waste, wastewater and direct-emission flows that can materially affect the result; quantify or explicitly justify omissions."
      evidence: "completeness checklist; mass and energy reconciliation; waste manifests"
    - id: dq_low_moisture_scope
      applies_to: "use of CXC 75-2015 controls"
      requirement: "Apply CXC-derived boundary controls only when water activity is at or below 0.85 and the product falls within the Code scope; disclose the test method and do not use the Code as a quantitative LCA source."
      evidence: "water-activity test; food-safety plan; codex-cxc-75-2015"
    - id: dq_reasoned_estimate_replacement
      applies_to: "every reasoned_estimate range"
      requirement: "A reasoned range is a screening aid only. Replace it with source-backed or representative foreground evidence when meter, scale, recipe, waste, moisture or batch records become available; any retained range shall be explicitly reviewed and disclosed before publication."
      evidence: "estimate register; replacement decision; reviewer approval"
    - id: dq_upstream_data
      applies_to: "upstream datasets"
      requirement: "Select datasets representative of material identity, geography, technology and time; disclose proxies and material limitations."
      evidence: "dataset metadata and selection record; eu-pef-2021-2279"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference flow"
    rule: "Confirm the exact product-flow UUID, Mass flow-property UUID, Units of mass UUID, kg unit and 1 kg net product amount; packaging mass shall not be included."
    source_ids: []
  - rule_id: validation_route_consistency
    applies_to: "process map and product qualifiers"
    rule: "Every declared route shall activate its corresponding process and flows, and no inactive route may contribute generic energy, water, ingredient or loss values."
    source_ids:
      - unsd-cpc-3-0-21495
  - rule_id: validation_scope_classification
    applies_to: "product identity"
    rule: "Confirm the finished product is a prepared nut, groundnut or edible seed within the declared semantic boundary; reject excluded unprepared, simply dried, sugar-preserved, frozen, paste, oil, meal or planting-seed products."
    source_ids:
      - unsd-cpc-3-0-21495
  - rule_id: validation_mass_balance
    applies_to: "each process and full foreground system"
    rule: "Report mass-balance closure and investigate discrepancies material to the study; distinguish physical waste, retained product, inventory change and evaporation."
    source_ids: []
  - rule_id: validation_energy_separation
    applies_to: "energy inventory"
    rule: "Confirm carrier-specific electricity, fuel, steam and purchased heat records are not merged and share the same reporting and production coverage."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_low_moisture_boundary
    applies_to: "low-moisture products"
    rule: "When CXC 75-2015 is invoked, verify water activity at or below 0.85, applicable treatment and post-treatment ingredient/handling controls; otherwise mark this check not applicable."
    source_ids:
      - codex-cxc-75-2015
  - rule_id: validation_reasoned_estimates
    applies_to: "all provisional ranges"
    rule: "List every reasoned_estimate, its active route, use, replacement trigger and review status. A provisional range shall not silently become a fixed, typical or allowed value."
