      evidence: "eu-pef-2021-2279; model report and data-quality assessment"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "Require product flow UUID 4b21f535-008c-42a3-a6b7-04565095a86a, Mass property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, mass unit group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and amount 1 on a net edible product basis."
    source_ids: []
  - rule_id: val_scope
    applies_to: "Product identity"
    rule: "Reject or flag products that are fresh/chilled, dried, smoked, salted, brined, cooked, canned, fermented, seasoned, non-fish, non-food, or preparations in which liver or roe is only an ingredient."
    source_ids:
      - unsd-cpc-3-0-21226
  - rule_id: val_qualifiers
    applies_to: "Dataset metadata"
    rule: "Fail completeness when any required qualifier is absent or when gross, net, packaging, and glaze mass conventions are ambiguous."
    source_ids: []
  - rule_id: val_freezing
    applies_to: "Freezing lot"
    rule: "Require evidence that the product thermal centre reached -18 °C or lower after thermal stabilization; retain nonconformance and corrective-action records."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: val_frozen_storage
    applies_to: "Cold store"
    rule: "Require a frozen-storage temperature record demonstrating maintenance at -18 °C or the stricter declared specification; flag excursions and their disposition."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: val_process_coverage
    applies_to: "Foreground inventory"
    rule: "Require all three process-map rows and all applicable inventory rows; a missing flow must have a documented zero, not-applicable, or excluded-with-justification decision."
    source_ids: []
  - rule_id: val_mass_balance
    applies_to: "Process and system mass flows"
    rule: "Require lot- and period-compatible mass reconciliation; report closure residual and investigate unresolved differences before dataset release."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_allocation
    applies_to: "Multi-output operations"
    rule: "Require evidence that allocation was avoided where possible; otherwise require the causal physical or economic basis, complete output set, factor sum, allocation point, and sensitivity disclosure."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_refrigerant
    applies_to: "Refrigeration systems"
    rule: "Require substance identity and mass-balance records when refrigerant additions or losses occur; reject an unidentified generic refrigerant emission."
    source_ids: []
  - rule_id: val_reasoned_ranges
    applies_to: "Provisional QA screens"
    rule: "Treat values outside reasoned-estimate ranges as review findings, not automatic replacements; never substitute a midpoint for missing foreground data, and disclose every retained estimate."
    source_ids: []
  - rule_id: val_data_quality
    applies_to: "Published data package"
    rule: "Require temporal, technological, geographic, completeness, measurement, food-safety, proxy, and uncertainty evidence defined in section 8; mark validation inconclusive when required records are unavailable."
    source_ids:
      - eu-pef-2021-2279
      - codex-cxc-52-2003
published_dataset_profile:
  dataset_role: "Foreground production dataset for frozen edible fish livers and/or roes at the producing facility's frozen cold-store gate"
  downstream_use: "secondary_dataset; background_dataset after methodology review and publication"
  allowed_use: "LCA studies whose species, organ state, origin, starting condition, production route, geography, period, freezing technology, glaze, packaging, storage, and allocation are representative or transparently adjusted"
  excluded_use: "Fresh/chilled, salted, smoked, dried, brined, cooked, canned, fermented, seasoned, non-fish, non-food, or ingredient-containing preparations; unidentified fish supply; undisclosed allocation; unverified net mass"
  required_metadata: "PCR id and version; reference-flow UUIDs; all required qualifiers; facility or vessel; geography; reporting period; upstream dataset links; process coverage; technology; glaze and packaging; storage duration and temperature; allocation; data sources; validation status"
  required_quality_disclosure: "Foreground coverage, measurement and calibration evidence, mass and energy reconciliation, co-product status, allocation factors and sensitivity, upstream allocation, proxy datasets, reasoned estimates, uncertainty, exclusions, cold-chain excursions, wastewater treatment, and refrigerant identity"
  update_trigger: "Species or origin change; whole-fish versus organ starting-condition change; new allocation or price basis; material process, freezer, glaze, packaging, cold-store, energy mix, refrigerant, treatment, supplier, geography, or period change; new reviewed quantitative evidence; or failed validation"
