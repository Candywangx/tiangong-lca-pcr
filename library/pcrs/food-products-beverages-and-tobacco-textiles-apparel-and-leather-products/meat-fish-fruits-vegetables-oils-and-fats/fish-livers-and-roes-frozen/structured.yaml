  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "Reference product and glaze"
      rule: "Net edible frozen mass = gross frozen packaged mass - packaging mass - separately determined retained glaze mass"
      inputs:
        - "gross mass"
        - "packaging mass"
        - "glaze mass"
      output: "kg net reference product"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_yield
      applies_to: "Separation and freezing"
      rule: "Yield = net frozen edible product mass / accepted incoming fish-material mass; report starting condition with the result"
      inputs:
        - "net product mass"
        - "incoming material mass"
      output: "kg/kg and percent"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "Each process and complete foreground system"
      rule: "Reconcile measured mass inputs with product, co-product, waste, wastewater, retained water or ice, inventory change, and documented evaporation; investigate material residuals before normalization"
      inputs:
        - "all mass rows"
        - "inventory change"
      output: "kg residual and percent closure"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_energy_normalization
      applies_to: "Electricity, fuel, heat, and cold service"
      rule: "Convert each carrier with a declared factor and divide attributable use by compatible process output or kg-day storage service; never merge carriers before impact modelling"
      inputs:
        - "carrier quantity"
        - "conversion factor"
        - "allocation driver"
        - output
        - "storage days"
      output: "kWh/kg, MJ/kg, or kWh/(kg day)"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_wastewater_load
      applies_to: "Wastewater"
      rule: "Pollutant load = paired discharge volume × measured concentration with unit conversion; normalize only after period alignment"
      inputs:
        - "discharge volume"
        - concentration
        - "unit factor"
        - output
      output: "kg pollutant/kg output"
      source_ids: []
    - id: calc_refrigerant_loss
      applies_to: "Freezing and cold storage"
      rule: "Substance-specific loss = opening charge + additions - recovered mass - closing charge, adjusted for documented transfers; allocate shared-system loss by declared refrigeration or storage service"
      inputs:
        - "charge inventory"
        - additions
        - recovery
        - "closing charge"
        - "allocation driver"
      output: "kg refrigerant/kg output or kg-day"
      source_ids: []
    - id: calc_allocation_factor
      applies_to: "Joint products"
      rule: "Physical factor = selected causal physical quantity for one output / total selected quantity; economic factor = output revenue / total joint-output revenue at the allocation point"
      inputs:
        - "output quantities"
        - "causal property or prices"
        - currency
        - period
      output: "dimensionless allocation factor"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dqr_identity
      applies_to: "Product and upstream fish material"
      requirement: "Declare species or species group, organ state, origin system, starting condition, product form, glaze, packaging, and facility or vessel; prevent aggregation of materially different routes without stratification"
      evidence: "Product specification, supplier record, lot record, reference-flow qualifiers"
    - id: dqr_temporal
