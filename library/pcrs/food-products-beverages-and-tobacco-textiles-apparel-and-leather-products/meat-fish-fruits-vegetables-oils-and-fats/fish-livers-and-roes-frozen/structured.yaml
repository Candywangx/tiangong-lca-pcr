      evidence: "Dated meter, batch, inventory, and invoice coverage table"
    - id: dqr_technology_geography
      applies_to: "Freezing, cold storage, utilities, and upstream datasets"
      requirement: "Match actual freezer, refrigeration system, electricity geography, water treatment, waste route, fish origin, and production system; justify every proxy"
      evidence: "Equipment list, utility contract, supplier origin, dataset metadata, proxy rationale"
    - id: dqr_completeness
      applies_to: "Inventory"
      requirement: "Include all mapped process rows or document a measured zero/not-applicable decision; quantify co-products, wastes, wastewater, packaging, cold storage, and direct refrigerant losses"
      evidence: "Process-to-row completeness matrix and mass/energy reconciliation"
    - id: dqr_measurement
      applies_to: "Mass, utility, temperature, and refrigerant records"
      requirement: "Retain equipment identity, calibration or verification status, sampling method, allocation worksheet, and unit conversions; distinguish measurement from estimate"
      evidence: "Calibration certificates, logger files, laboratory reports, service logs, calculations"
    - id: dqr_food_safety
      applies_to: "Water, handling, freezing, and storage"
      requirement: "Retain evidence that water is suitable for its intended food-contact use, hygienic handling controls are applied, the thermal-centre freezing requirement is met, and frozen storage temperature is controlled"
      evidence: "codex-cxc-52-2003; sanitation and HACCP records; temperature logs"
