allocation_rules:
  - rule_id: alloc_avoid
    applies_to: "Multi-output foreground operations"
    rule: "First avoid allocation through process subdivision, direct metering, separate batch records, or expansion of separately operated lines."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_status
    applies_to: "Whole fish, organ streams, co-products, and residues"
    rule: "Document the physical point and evidence at which liver, roe, other fish outputs, or residues become products with an economic function rather than wastes; do not change status merely to shift burdens."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_physical
    applies_to: "Joint separation and shared utilities"
    rule: "When subdivision is not possible and a physical relation represents causality, allocate by that documented physical relation; mass allocation may be used only with justification and complete output mass records."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_economic
    applies_to: "Joint outputs without a defensible causal physical relation"
    rule: "Use contemporaneous economic value at the allocation point, disclose prices, currency, period, quantities, treatment of zero-value outputs, and uncertainty, and test a mass-based sensitivity case."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_upstream
    applies_to: "Linked fish-production datasets"
    rule: "Preserve the allocation already embedded in accepted upstream datasets and disclose it; do not allocate the same upstream burden again in the foreground model."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_recycling_treatment
    applies_to: "Packaging recycling, residue recovery, and waste treatment"
    rule: "Apply the declared downstream treatment or recycling method consistently, disclose credits or substitutions, and prevent double counting between product, waste, and avoided-product claims."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass_lot_records
      process_id: "p01_receipt_separation_cleaning_p02_freezing_glazing_p03_packaging_storage_dispatch"
      flow_role: "Incoming material, intermediates, products, co-products, residues, and losses"
      record_type: "Calibrated scale tickets, batch sheets, inventory movements, disposition records"
      raw_fields: "timestamp; lot_id; species; organ_state; gross_mass; tare_mass; glaze_mass; net_mass; destination; scale_id"
      collection_method: "Capture each lot or batch, reconcile transfers, and aggregate only compatible product states"
