measurement_rules:
  - id: reference_mass
    applies_to: "Reference orange juice output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report net product mass excluding transport packaging not sold with the product. The normalized reference output is exactly 1 kg; retain measured batch mass before normalization."
  - id: as_sold_concentration
    applies_to: "All reference products"
    required_property_ref:
      name: "Mass and measured soluble solids"
      uuid: ""
    required_unit: "kg and °Brix"
    rule: "Keep the 1 kg reference on the as-sold product. Do not silently convert concentrate to single-strength juice. Record the measured °Brix, sampling temperature or correction method, and directly expressed, reconstituted, or concentrated status."
  - id: reconstitution_basis
    applies_to: "Juice from concentrate"
    required_property_ref:
      name: "Mass and measured soluble solids"
      uuid: ""
    required_unit: "kg and °Brix"
    rule: "Record concentrate mass, potable reconstitution water, measured final mass, and final °Brix. Apply the applicable market rule; CXS 247-2005 is the default international specification and identifies 11.8–11.2 °Brix for reconstituted orange juice subject to importing-country provisions, with the stated origin exception not below 10 °Brix."
  - id: concentrate_status
    applies_to: "Concentrated orange juice"
    required_property_ref:
      name: "Mass and measured soluble solids"
      uuid: ""
    required_unit: "kg and °Brix"
    rule: "Declare the degree of concentration. Under CXS 247-2005, concentrated fruit juice has sufficient physically removed water to raise °Brix by at least 50 percent above the corresponding reconstituted-juice value."
  - id: single_strength_equivalent
    applies_to: "Optional comparison across concentration states"
    required_property_ref:
      name: "Mass and measured soluble solids"
      uuid: ""
    required_unit: "kg and °Brix"
    rule: "When a study reports a single-strength equivalent, calculate it as as-sold mass multiplied by measured product °Brix divided by the declared single-strength target °Brix. Report this as an additional result and do not replace the 1 kg reference flow."
  - id: utility_conversion
    applies_to: "Electricity, fuels, steam, cooling, water, and wastewater"
    required_property_ref:
      name: "Property matching the selected Tiangong flow"
      uuid: ""
    required_unit: "Selected flow reference unit"
    rule: "Preserve meter or invoice units, document conversion factors, and normalize only after allocation to the orange juice route. Do not treat steam mass, thermal energy, and fuel mass or volume as interchangeable."
