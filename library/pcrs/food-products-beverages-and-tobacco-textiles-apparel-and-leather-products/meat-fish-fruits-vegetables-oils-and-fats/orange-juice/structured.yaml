allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Multi-output orange juice operations"
    rule: "First avoid allocation by separately metering or subdividing operations that serve only orange juice, peel oil, pulp, dried peel, feed material, pectin feedstock, recovered aroma, or another co-product. Internal recycling or return of pulp, aroma, water, condensate, or rework to the same product route is not a co-product."
    source_ids:
      - eu-pef-method-2021
      - fao-fruit-juice-processing-2001
  - rule_id: allocation_physical
    applies_to: "Remaining indivisible multi-output processes"
    rule: "Where subdivision is not possible, use a documented causal physical relationship only when it represents how process inputs or operating intensity change with the co-product functions. Mass alone shall not be used merely because it is available."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_economic
    applies_to: "Co-products without a defensible physical relationship"
    rule: "If no defensible causal physical relationship exists, allocate the remaining shared burden by the relative economic value of co-products using prices and quantities from the same representative period. Disclose zero-price, negative-price, seasonal, or subsidized outputs and test sensitivity when allocation is material."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_waste_recovery
    applies_to: "Residues, wastes, recycling, energy recovery, and avoided-product claims"
    rule: "Material leaving as waste carries the treatment burden assigned by the selected waste modelling convention. Do not grant an avoided-product credit inside this foreground dataset unless a declared consequential or system-expansion scenario is separately reported with its substitution assumptions."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "orange_receiving_preparation_juice_extraction_finishing_juice_reconstitution_blending"
      flow_role: "Fruit, ingredients, aids, intermediate transfers, rejects, residues, and losses"
      record_type: "Scale tickets, batch sheets, inventory issues, and destination records"
      raw_fields: "timestamp; batch_id; material_id; gross_mass; tare_mass; net_mass; route; destination; instrument_id"
      collection_method: "Calibrated scales and reconciled batch or inventory records"
      unit: "kg"
      frequency: "Each batch or receipt"
      temporal_coverage: "At least 12 representative months, or the full shorter seasonal campaign with season disclosed"
      site_scope: "Every included facility and outsourced controlled operation"
      aggregation_rule: "Sum net mass by material and destination; reconcile opening inventory plus receipts against closing inventory plus outputs and losses; normalize after allocation"
      quality_evidence: "Scale calibration, batch sign-off, inventory reconciliation, and destination evidence"
    - protocol_id: cp_product_quality_mass
      process_id: "juice_extraction_finishing_juice_concentration_storage_juice_reconstitution_blending_stabilization_filling_handoff"
      flow_role: "Juice mass, °Brix, route state, pulp, treatment, and handoff quality"
      record_type: "Flowmeter or scale records, laboratory results, product specification, and batch release"
      raw_fields: "timestamp; batch_id; input_mass; output_mass; brix; sample_temperature; method; pulp_content; treatment; product_state; release_status"
      collection_method: "Paired mass and representative product sampling using the applicable analytical method"
      unit: "kg and °Brix"
      frequency: "Each batch, tank, or custody-transfer lot"
      temporal_coverage: "Same period as the inventory"
      site_scope: "Every included product line and product state"
      aggregation_rule: "Mass-weight batch results; do not average concentrate and single-strength states without separate strata"
      quality_evidence: "Instrument calibration, laboratory method, sample chain, product specification, and release record"
    - protocol_id: cp_utility_records
      process_id: "juice_concentration_storage_stabilization_filling_handoff"
      flow_role: "Electricity, fuels, steam, heat, cooling, and refrigerant balance"
      record_type: "Dedicated meters, invoices, equipment logs, and refrigerant service records"
      raw_fields: "timestamp; meter_id; opening; closing; unit; fuel_or_refrigerant_id; purchase; recovery; closing_inventory; operating_hours"
      collection_method: "Prefer dedicated meters; otherwise allocate shared utilities using a documented engineering driver"
      unit: "Native meter or invoice unit"
      frequency: "Continuous or monthly, with batch links where available"
      temporal_coverage: "At least 12 representative months or the full seasonal campaign"
      site_scope: "Every included facility and relevant utility system"
      aggregation_rule: "Subtract non-production use and internal transfers; allocate shared use using the declared driver; convert once and normalize after allocation"
      quality_evidence: "Meter calibration, invoices, runtime logs, service records, and allocation calculation"
    - protocol_id: cp_water_wastewater
      process_id: "orange_receiving_preparation_juice_extraction_finishing_juice_concentration_storage_stabilization_filling_handoff"
      flow_role: "Water supply, internal recirculation, net wastewater, and pollutant load"
      record_type: "Supply and discharge meters, cleaning logs, treatment records, and laboratory analyses"
      raw_fields: "timestamp; source; supplied_volume; recirculated_volume; discharged_volume; destination; pollutant; concentration; sample_method"
      collection_method: "Meter each major water circuit and discharge point; sample pollutants at representative operating conditions"
      unit: "m3 and pollutant-specific units"
      frequency: "Continuous or per batch; analyses at permit or risk-based frequency"
      temporal_coverage: "At least 12 representative months or the full seasonal campaign"
      site_scope: "Every included facility, discharge point, and outsourced treatment route"
      aggregation_rule: "Report gross supply, internal recirculation, and net discharge separately; calculate pollutant mass as volume times measured concentration"
      quality_evidence: "Meter calibration, sampling plan, laboratory reports, permit records, and treatment receipts"
    - protocol_id: cp_coproduct_allocation
      process_id: "juice_extraction_finishing_juice_concentration_storage"
      flow_role: "Saleable co-product quantity, function, price, and destination"
      record_type: "Scale tickets, sales records, specifications, and contracts"
      raw_fields: "timestamp; batch_id; coproduct_id; mass; specification; destination; price; currency; price_basis; revenue"
      collection_method: "Measure exported quantity and use transaction or contract prices from the same period"
      unit: "kg and currency per declared unit"
      frequency: "Each shipment; prices summarized monthly or seasonally"
      temporal_coverage: "Same representative period as the inventory"
      site_scope: "All facilities producing co-products"
      aggregation_rule: "Apply subdivision first; otherwise calculate allocation shares from the selected physical driver or same-period economic values"
      quality_evidence: "Scale calibration, invoices, contracts, specification, allocation workbook, and sensitivity record"
    - protocol_id: cp_packaging_records
      process_id: "stabilization_filling_handoff"
      flow_role: "Primary, secondary, and tertiary packaging"
      record_type: "Bills of materials, issue and return records, item counts, and package mass tests"
      raw_fields: "packaging_id; material; items_issued; items_returned; item_mass; filled_units; scrap_mass"
      collection_method: "Reconcile issued and returned items and verify item mass with representative weighing"
      unit: "item and kg"
      frequency: "Each production batch or packaging run"
      temporal_coverage: "Same representative period as the inventory"
      site_scope: "Each included packaging configuration and line"
      aggregation_rule: "Net items used times measured item mass plus measured scrap, divided by conforming product mass"
      quality_evidence: "Approved bill of materials, scale calibration, package mass sample, and reconciliation"
    - protocol_id: cp_waste_records
      process_id: "stabilization_filling_handoff"
      flow_role: "Rejected juice, packaging waste by material, and filling or cleaning wastewater"
      record_type: "Reject logs, packaging reconciliation, waste dispatch records, and wastewater meters"
      raw_fields: "timestamp; batch_id; waste_id; material; mass; volume; origin; destination; treatment; rework_or_recovery"
      collection_method: "Measure each waste material and discharge separately before rework, recovery, treatment, or allocation"
      unit: "kg and m3"
      frequency: "Each batch, waste dispatch, or discharge interval"
      temporal_coverage: "Same representative period as the inventory"
      site_scope: "Every included filling line, package configuration, and discharge point"
      aggregation_rule: "Sum by flow identity and destination; reconcile packaging waste to issue/return records and wastewater to the water balance"
      quality_evidence: "Calibrated scales and meters, reject log, waste receipt, discharge record, and reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground inventory rows"
      rule: "Divide the post-allocation amount by conforming net orange juice output mass in kg; multiply by 1 kg"
      inputs:
        - "Post-allocation amount"
        - "conforming net product mass"
      output: "Amount per 1 kg reference orange juice"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "Each process and the linked foreground route"
      rule: "Reconcile opening inventory plus measured inputs with closing inventory plus measured product outputs, co-products, wastes, emissions, and documented internal transfers; investigate material residuals rather than creating an unlabelled balancing flow"
      inputs:
        - "Mass records from cp_material_mass_balance and cp_product_quality_mass"
      output: "Process and route mass-balance residual with explanation"
      source_ids:
        - fao-fruit-juice-processing-2001
    - id: calc_reconstituted_juice
      applies_to: "Juice from concentrate"
      rule: "Final batch mass equals concentrate mass plus potable water plus permitted additions minus measured losses; soluble-solids balance shall be checked against measured input and final °Brix"
      inputs:
        - "Concentrate mass and °Brix"
        - water
        - additions
        - losses
        - "final mass and °Brix"
      output: "Reconstituted orange juice mass and soluble-solids reconciliation"
      source_ids:
        - fao-who-cxs-247-2005
    - id: calc_single_strength_equivalent
      applies_to: "Optional cross-concentration result"
      rule: "Single-strength-equivalent mass equals as-sold mass multiplied by measured as-sold °Brix divided by the declared single-strength target °Brix"
      inputs:
        - "As-sold mass"
        - "measured °Brix"
        - "target °Brix"
      output: "Additional kg single-strength-equivalent result"
      source_ids:
        - fao-who-cxs-247-2005
    - id: calc_pollutant_load
      applies_to: "Wastewater pollutant releases"
      rule: "Pollutant mass equals net discharged wastewater volume multiplied by representative measured concentration with consistent unit conversion"
      inputs:
        - "Discharged volume"
        - "measured concentration"
        - "sampling period"
      output: "Pollutant mass by discharge destination"
      source_ids:
        - world-bank-fruit-vegetable-processing-1998
    - id: calc_economic_allocation
      applies_to: "Shared burdens assigned economically"
      rule: "Allocation share for a co-product equals its same-period quantity times price divided by the sum of quantity times price for all co-products; apply the share only to the remaining indivisible burden"
      inputs:
        - "Co-product quantities"
        - "same-period prices"
        - "remaining shared inputs and outputs"
      output: "Allocated inventory by co-product"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and all external flows"
      requirement: "Record flow UUID after exact Tiangong CLI readback, flow property, reference unit, product state, route qualifiers, and upstream dataset identity. Search ranking alone is not evidence."
      evidence: "CLI readback record retained outside the PCR; dataset metadata; supplier and product specifications"
    - id: dq_temporal
      applies_to: "Foreground activity data"
      requirement: "Use at least 12 representative months unless production is seasonal or the site has operated for a shorter period; then cover the full available campaign and disclose omitted seasons, downtime, and abnormal runs."
      evidence: "Dated source records and coverage calculation"
    - id: dq_technology_geography
      applies_to: "Foreground and upstream data"
      requirement: "Match extraction, concentration, preservation, packaging, water, energy, waste treatment, geography, and supplier technology to the declared route; justify every proxy."
      evidence: "Process description, supplier records, selected dataset metadata, and proxy rationale"
    - id: dq_completeness
      applies_to: "All included processes"
      requirement: "Reconcile major material, product, co-product, waste, water, utility, packaging, and direct-emission records; list missing flows and quantify their known coverage where possible."
      evidence: "Mass and utility reconciliations, missing-data register, and destination records"
    - id: dq_measurement
      applies_to: "Mass, °Brix, water, utilities, emissions, and packaging"
      requirement: "Retain instrument identity, calibration or verification status, sampling method, conversion factor, and responsible reviewer for every material measurement family."
      evidence: "Calibration certificates, laboratory methods, invoices, meter logs, and review sign-off"
    - id: dq_allocation
      applies_to: "Multi-output processes"
      requirement: "Retain subdivision evidence, selected allocation relationship, quantities, prices or physical drivers, representative period, and sensitivity results when allocation materially affects the orange juice result."
      evidence: "Allocation workbook, contracts, price records, and sensitivity analysis"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Reference product"
    rule: "Fail if the actual product is not orange juice, if it is nectar, a drink, a mixed-fruit juice, fermented, or an isolated by-product, or if required product-state qualifiers are missing."
    source_ids:
      - unsd-cpc-3-2025
      - fao-who-cxs-247-2005
  - rule_id: validate_reference_mass
    applies_to: "Quantitative reference"
    rule: "Require exactly 1 kg net as-sold orange juice output after normalization, Mass property, kg unit, and the declared generic or more specific read-back Tiangong product flow."
    source_ids: []
  - rule_id: validate_route_completeness
    applies_to: "Process coverage"
    rule: "Require every controlled operation between the declared starting condition and handoff. Fresh-fruit routes require receiving and extraction; concentration and reconstitution routes require their applicable processes; all routes require final conditioning or an explicit untreated bulk handoff."
    source_ids:
      - fao-fruit-juice-processing-2001
  - rule_id: validate_concentration
    applies_to: "Concentrated and from-concentrate products"
    rule: "Require measured input and output mass and °Brix, water additions or removals, applicable Codex or market specification, and a soluble-solids reconciliation. Do not compare concentration states as if 1 kg provided an equal quantity of orange soluble solids."
    source_ids:
      - fao-who-cxs-247-2005
  - rule_id: validate_mass_balance
    applies_to: "Each process and the route"
    rule: "Require a documented mass-balance reconciliation covering product, co-products, internal transfers, wastes, wastewater where mass is available, and identified residuals; reject an unexplained balancing flow."
    source_ids:
      - fao-fruit-juice-processing-2001
  - rule_id: validate_allocation
    applies_to: "Multi-output operations"
    rule: "Require evidence that subdivision was attempted first and that any physical or economic allocation follows the declared hierarchy with same-period data and disclosed sensitivity when material."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_environmental_releases
    applies_to: "Water, waste, and direct emissions"
    rule: "Require net water and wastewater records, treatment destinations, solid-residue destinations, and any direct refrigerant or other measured releases; do not transform purchased inputs into direct emissions."
    source_ids:
      - world-bank-fruit-vegetable-processing-1998
  - rule_id: validate_upstream_datasets
    applies_to: "Inputs crossing the boundary"
    rule: "Require an appropriate upstream dataset or an explicit unresolved data gap for oranges, purchased juice or concentrate, ingredients, packaging, water, energy, and treatment services; reject recursive duplication of supplier orange-juice operations."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_atomic_inventory
    applies_to: "Utility, packaging, waste, and refrigerant identity"
    rule: "Fail if electricity, steam, natural gas, cooling-water make-up, each refrigerant, each packaging material, packaging waste, rejected juice, or filling wastewater covered by this PCR is represented by a combined placeholder instead of a separately identifiable flow row."
    source_ids:
      - eu-pef-method-2021
      - eu-jrc-fdm-bref-2019
published_dataset_profile:
  dataset_role: "Foreground orange juice production dataset at a declared manufacturer-gate handoff"
  downstream_use: "secondary_dataset; background_dataset when reviewed, representative, and accompanied by the required quality disclosure"
  allowed_use: "LCA models that match the declared orange juice route, concentration, composition, preservation, packaging boundary, geography, technology, reference period, and handoff state"
  excluded_use: "Silent substitution for orange nectar, drinks, mixed-fruit juice, fermented products, isolated citrus by-products, orchard production alone, or orange juice with materially different concentration or processing qualifiers; comparative claims without functional-equivalence review"
  required_metadata: "PCR id and version; reference flow UUID and qualifiers; starting condition; included facilities and processes; geography; reference period; product mass and °Brix; pulp, ingredient, preservation, packaging, and handoff state; upstream dataset identities; cut-offs; allocation method; data owners and review status"
  required_quality_disclosure: "Temporal, geographical, and technological representativeness; foreground coverage; instrument and sampling quality; mass and soluble-solids reconciliation; missing data and proxies; allocation shares and sensitivity; wastewater, waste, and refrigerant coverage; any added downstream stages"
  update_trigger: "Change in starting material, orange specification, concentration or reconstitution route, extraction or stabilization technology, energy or water system, packaging, product °Brix, co-product market, allocation relationship, facility geography, upstream datasets, regulation, or representative period that can materially alter the inventory"
