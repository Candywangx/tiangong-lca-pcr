allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared_processes"
    rule: "Avoid allocation by separately metering route, product form, cooking, preparation, packing, and storage operations whenever technically feasible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_joint_outputs
    applies_to: "marketable_co_products"
    rule: "When subdivision is not feasible, apply a documented physical relation that reflects the underlying process. If no defensible physical relation exists and economic allocation is used, record price basis, reference period, currency, route, and a sensitivity result."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residue_status
    applies_to: "shells_rejects_and_liquids"
    rule: "Outputs sent to treatment remain wastes and receive treatment burdens without avoided-product credit unless a consequential study explicitly requires it. A sold or internally used material is a co-product and shall be included in the allocation decision."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_route_separation
    applies_to: "multi_route_facilities"
    rule: "Allocate shared utilities using measured drivers such as equipment meter, operating time, throughput, storage volume-time, or another documented causal driver before aggregating separately calculated route results."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_mass_balance
      process_id: "reception_and_preparation_declared_preservation_packing_and_storage"
      flow_role: "raw, intermediate, final, residue, and free-liquid masses"
      record_type: "weigh tickets and batch records"
      raw_fields: "lot_id; route; product_form; incoming_mass; prepared_mass; preserved_mass; packed_net_mass; glaze_mass; free_liquid_mass; residue_mass"
      collection_method: "calibrated scales and reconciled batch records"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "representative production period, normally at least 12 months or disclosed shorter campaign"
      site_scope: "each reporting facility and route"
      aggregation_rule: "sum by lot and route, then divide by eligible net reference-product mass"
      quality_evidence: "scale calibration, lot traceability, and signed mass-balance review"
    - protocol_id: cp_water_ice_records
      process_id: "reception_and_preparation"
      flow_role: "water and ice"
      record_type: "meters, invoices, and batch charge logs"
      raw_fields: "meter_start; meter_end; ice_mass; allocation_driver; sanitation_share"
      collection_method: "direct measurement preferred; documented causal allocation otherwise"
      unit: "kg"
      frequency: "each lot or meter period"
      temporal_coverage: "same period as product data"
      site_scope: "each facility"
      aggregation_rule: "subtract non-production use and allocate to route/product using documented driver"
      quality_evidence: "meter checks, invoices, and allocation worksheet"
    - protocol_id: cp_route_input_records
      process_id: "declared_preservation"
      flow_role: "electricity, thermal energy, salt, and brining water"
      record_type: "meters, fuel/steam records, and formulation sheets"
      raw_fields: "route; equipment; electricity; fuel_or_heat; conversion_factor; salt_charge; fresh_water; recirculated_brine"
      collection_method: "route meter or batch formulation record"
      unit: "kWh; MJ; kg"
      frequency: "each lot or meter period"
      temporal_coverage: "same period as product data"
      site_scope: "each facility and preservation route"
      aggregation_rule: "aggregate only within the declared route and normalize to preserved output"
      quality_evidence: "meter calibration, invoices, formulation approval, and unit-conversion record"
    - protocol_id: cp_waste_effluent_records
      process_id: "reception_and_preparation_declared_preservation"
      flow_role: "residues, wastewater, spent brine, and treatment destination"
      record_type: "scales, discharge meters, manifests, and balance calculations"
      raw_fields: "stream_id; saline_status; mass_or_volume; density; treatment; sale_status; destination"
      collection_method: "direct measurement preferred; documented balance where unavailable"
      unit: "kg"
      frequency: "each lot or reporting period"
      temporal_coverage: "same period as product data"
      site_scope: "each facility and stream"
      aggregation_rule: "keep treatment destinations and saline/non-saline streams separate"
      quality_evidence: "manifests, meter records, sampling plan, and balance reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "packing_and_storage"
      flow_role: "packaging incorporated and scrap"
      record_type: "bill of materials, purchase records, and scrap weights"
      raw_fields: "material; units_issued; unit_mass; returned_units; scrap_mass; packed_net_mass"
      collection_method: "specification mass verified by sample weighing"
      unit: "kg"
      frequency: "packaging run"
      temporal_coverage: "same period as product data"
      site_scope: "each product format and facility"
      aggregation_rule: "calculate incorporated mass by material per net product mass"
      quality_evidence: "current specifications, sample weights, and stock reconciliation"
    - protocol_id: cp_storage_refrigeration_records
      process_id: "declared_preservation_packing_and_storage"
      flow_role: "storage electricity, duration, and refrigerant loss"
      record_type: "meters, warehouse logs, refrigerant service records"
      raw_fields: "route; storage_temperature; entry_time; dispatch_time; electricity; refrigerant_type; charge_added; recovered_mass; throughput"
      collection_method: "meter and service-log calculation"
      unit: "kWh; h or day; kg"
      frequency: "monthly and each service event"
      temporal_coverage: "same period as product data"
      site_scope: "each facility"
      aggregation_rule: "allocate by measured zone meter or documented mass-volume-time driver"
      quality_evidence: "meter record, temperature log, service invoice, and leak calculation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = eligible lot or period amount / net kg of conforming reference product; exclude packaging, separately draining brine, and disclosed glaze from denominator"
      inputs:
        - "collected flow amount"
        - "packed net mass"
        - "glaze/free-liquid status"
      output: "amount per 1 kg net reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "each production lot"
      rule: "reconcile received material, added water/ice/salt retained, intermediates, product, residues, discharged liquid, evaporated water, and documented unmeasured difference"
      inputs:
        - cp_lot_mass_balance
        - cp_water_ice_records
        - cp_waste_effluent_records
      output: "lot mass-balance statement and yield"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_route_separation
      applies_to: "multi-route facilities"
      rule: "calculate each preservation route independently; aggregate only using measured net-product route shares for the declared reporting period"
      inputs:
        - "route inventory"
        - "route net output"
      output: "explicitly weighted product mix"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_shared_utilities
      applies_to: "shared meters and storage"
      rule: "allocated utility = shared total × documented causal driver share; disclose driver and unallocated remainder"
      inputs:
        - "meter total"
        - "route operating time"
        - throughput
        - "or storage mass-volume-time"
      output: "route-specific utility amount"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and raw material"
      requirement: "Retain species/commercial group, origin, form, raw/cooked state, preservation route, lot, and dispatch condition; do not substitute shrimp/prawn or mollusc data without a disclosed proxy review."
      evidence: "classification record, supplier specification, lot traceability, and unsd-cpc-3-0-2025"
    - id: dq_route_and_food_safety
      applies_to: "preparation and preservation"
      requirement: "Retain route-specific time-temperature, salting/brining or drying-control records and food-safety release evidence appropriate to the product; a failed or rejected lot is not conforming reference output."
      evidence: "HACCP or equivalent control records and codex-cxc-52-2003; fao-seafood-safety-quality-2003"
    - id: dq_temporal_coverage
      applies_to: "foreground activity data"
      requirement: "Use a representative period covering seasonal and operational variability, normally 12 consecutive months; disclose a shorter seasonal campaign and justify representativeness."
      evidence: "dated meters, invoices, production logs, and eu-pef-2021-2279"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Cover at least 95% of measured foreground input and output mass and all known environmentally relevant energy, refrigerant, saline-effluent, and waste streams; list exclusions and assess their significance."
      evidence: "mass balance, exclusion log, and eu-pef-2021-2279"
    - id: dq_measurement
      applies_to: "foreground records"
      requirement: "Prefer calibrated measurement; document estimates, meter allocation, density conversions, missing-data treatment, and uncertainty."
      evidence: "calibration records, worksheets, and meter/invoice reconciliation"
    - id: dq_provisional_ranges
      applies_to: "reasoned_estimate ranges"
      requirement: "Treat every provisional range as a screening flag, not a default publication value; replace it with foreground data or reviewed source evidence before activation unless methodology review explicitly accepts it."
      evidence: "review record and source replacement log"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference_product"
    rule: "Confirm exactly 1 kg net product uses product flow ecae55b8-a320-44e8-9ea2-98d7ff34e4e3, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids: []
  - rule_id: validate_route_declaration
    applies_to: "product_and_process_map"
    rule: "Confirm preservation route, raw/cooked state, form, glaze/moisture/salt/brine basis, dispatch temperature, and storage duration are declared; reject unconditional mixing of routes."
    source_ids:
      - unsd-cpc-3-0-2025
      - codex-cxc-52-2003
  - rule_id: validate_conditional_inputs
    applies_to: "declared_preservation"
    rule: "Confirm freezing and frozen-storage records occur only for frozen product, thermal drying only when used, salt only when added, and brining water/spent brine only for the brined route."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_mass_balance
    applies_to: "each lot"
    rule: "Confirm raw, intermediate, product, residue, retained water/salt, wastewater/free liquid, evaporation, and unmeasured loss are reconciled without counting packaging as product."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_allocation
    applies_to: "co_products_and_shared_operations"
    rule: "Confirm subdivision was attempted first and every remaining allocation has a causal driver, co-product/waste decision, and sensitivity when economic allocation is used."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_food_safety_release
    applies_to: "conforming_output"
    rule: "Confirm the lot has the route-specific acceptance and food-safety control evidence required for its declared market state; rejected product is recorded as waste or rework, not reference output."
    source_ids:
      - codex-cxc-52-2003
      - fao-seafood-safety-quality-2003
  - rule_id: validate_provisional_estimates
    applies_to: "inventory_ranges"
    rule: "Flag every reasoned_estimate as unresolved for methodology review and confirm it is not represented as measured, source-backed, or mandatory."
    source_ids: []
  - rule_id: validate_uuid_gaps
    applies_to: "non_reference_flows"
    rule: "Confirm unresolved non-reference Tiangong UUIDs remain explicit review items and are not replaced by unverified approximate flows."
    source_ids: []
published_dataset_profile:
  dataset_role: "Facility-gate foreground production dataset for a declared preserved other-crustacean product"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product and facility comparisons only when route, species/group, product form, dispatch condition, geography, technology, allocation, and storage basis are sufficiently comparable; may be linked with separate upstream and downstream datasets"
  excluded_use: "Unqualified average across frozen, dried, dry-salted, and brined routes; proxy for shrimp/prawn, mollusc, canned, smoked-only, fermented, fresh/chilled, harvest/aquaculture, distribution, retail, cooking, or consumption"
  required_metadata: "PCR id; facility and geography; reporting period; species/commercial group and origin; product form; raw/cooked state; declared route; glaze, moisture, salt/brine and net-mass basis; technology; storage duration/temperature; packaging; allocation; upstream datasets; waste treatment; data owners and review state"
  required_quality_disclosure: "Primary-data share and period; meter coverage and allocation drivers; mass-balance difference; route shares; missing data and proxies; reasoned estimates; non-reference UUID gaps; food-safety release basis; uncertainty and exclusions"
  update_trigger: "Material change in species mix, raw-material origin, product form, preservation technology or route share, energy/refrigerant system, formulation, yield, packaging, storage, allocation, regulation/food-safety control, or data older than the organization’s review interval"
