allocation_rules:
  - rule_id: alloc_avoid
    applies_to: "multi-output foreground processes"
    rule: "First avoid allocation through process subdivision and direct measurement of route-specific inputs, utilities, residues, and products."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_physical
    applies_to: "unavoidable joint operations"
    rule: "If subdivision is not possible, use a documented physical causal relation; mass allocation may be used only when it reasonably represents causality for the joint operation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_economic_last_resort
    applies_to: "co-products without defensible physical relation"
    rule: "Use economic allocation only as a last resort, state the market, price period, and sensitivity, and keep wastes assigned to the process that generates them."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass_balance
      process_id: "octopus_receiving_preparation_route_preservation_packaging_storage"
      flow_role: "received, prepared, preserved, saleable, reject, rework, glaze, and drained masses"
      record_type: "scales, batch sheets, yield and disposition records"
      raw_fields: "lot_id; species_or_commercial_designation; route; incoming_state; gross_mass; tare_mass; accepted_mass; intermediate_mass; final_net_mass; glaze_mass; drained_mass; reject_mass; rework_mass"
      collection_method: "Calibrated weighing by lot; preserve gross, tare, deglazed, and drained observations where applicable."
      unit: "kg"
      frequency: "each production lot"
      temporal_coverage: "At least 12 consecutive representative months or the full seasonal campaign with justification."
      site_scope: "All facilities represented by the dataset."
      aggregation_rule: "Sum accepted masses and normalize flows to qualified saleable mass; do not net rework across the boundary."
      quality_evidence: "Scale calibration, lot traceability, reconciliation sign-off, and product specification."
    - protocol_id: cp_route_inputs
      process_id: "octopus_receiving_preparation_route_preservation"
      flow_role: "each atomic water, salt, wood-chip, electricity, steam, hot-water, natural-gas, diesel, LPG, R717, R404A, wastewater, spent-brine, reject, ash, combustion-emission, and refrigerant-emission row"
      record_type: "meters, invoices, issue records, recipes, fuel and refrigerant ledgers, equipment logs, stack records, and discharge records"
      raw_fields: "lot_id; route; atomic_flow_id; flow_uuid; quantity; unit; meter_start; meter_end; stock_start; stock_end; returned_quantity; operating_time; discharge_quantity; destination; emission_factor; factor_source"
      collection_method: "Direct metering preferred; otherwise reconcile each named material or carrier separately from purchases, stock, recipes, and equipment logs using a documented allocation."
      unit: "kg; m3; kWh; carrier-specific SI unit"
      frequency: "per lot or monthly with traceable lot allocation"
      temporal_coverage: "Same period as product mass records."
      site_scope: "Each included line and shared utility system."
      aggregation_rule: "Never aggregate carriers, materials, wastes, or pollutants into one exchange; subtract only measured closed-loop recovery; normalize each atomic row to preserved output."
      quality_evidence: "Meter calibration, invoice or stock reconciliation, recipe approval, refrigerant ledger, flow UUID readback, and allocation rationale."
    - protocol_id: cp_packaging_storage
      process_id: "packaging_storage"
      flow_role: "plastic film, corrugated cardboard, each additional packaging material, storage electricity, each refrigerant make-up, each packaging scrap, and each refrigerant emission"
      record_type: "packaging bill of materials, packed-unit counts, warehouse meters, refrigerant ledgers, temperature and inventory logs"
      raw_fields: "packaging_material; flow_uuid; packaging_mass; packed_units; stored_mass; storage_start; storage_end; temperature; electricity; refrigerant_identity; refrigerant_makeup; refrigerant_recovery; refrigerant_release"
      collection_method: "Reconcile each packaging material to packed units; allocate electricity by documented mass-time; close a separate mass balance for each refrigerant identity."
      unit: "kg; kWh; degree Celsius; day"
      frequency: "each packaging campaign and monthly storage reconciliation"
      temporal_coverage: "Same period as product mass records."
      site_scope: "All packaging lines and storage rooms represented."
      aggregation_rule: "Normalize every packaging material separately to product mass, electricity to occupied mass-time, and each refrigerant make-up and release separately; retain route and temperature strata."
      quality_evidence: "BOM revision, stock reconciliation, meter calibration, refrigerant ledger, flow UUID readback, and temperature-log completeness."
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period or lot amount / qualified saleable reference mass, then express per 1 kg."
      inputs:
        - "collected flow amount"
        - "qualified saleable mass"
      output: "amount per kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_route_reference_mass
      applies_to: "glazed frozen or in-brine products"
      rule: "frozen reference mass = measured deglazed product mass; in-brine reference mass = measured drained octopus mass; all other routes use net saleable octopus mass excluding packaging."
      inputs:
        - gross
        - tare
        - glaze
        - deglazed
        - drained
        - "and net masses"
      output: "route-consistent reference mass"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_storage_energy
      applies_to: "shared storage"
      rule: "allocated energy = metered storage energy × represented product mass-time / total occupied mass-time for the same temperature zone and period."
      inputs:
        - "meter energy"
        - "product mass"
        - "storage duration"
        - "total occupied mass-time"
      output: "kWh per kg reference product for declared duration"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_route
      applies_to: "product and route"
      requirement: "Preserve lot-level species or commercial designation, incoming state, product form, exactly one primary route, and required route qualifiers."
      evidence: "Product specification, label, batch sheet, and route log."
    - id: dq_measurement
      applies_to: "mass, utilities, and storage"
      requirement: "Use calibrated measurements where available, retain raw readings and conversion factors, and reconcile product, waste, rework, water, brine, packaging, and energy records."
      evidence: "Calibration records, meter logs, mass-balance review, and invoice or stock reconciliation."
    - id: dq_representativeness
      applies_to: "reporting period and facilities"
      requirement: "Cover all represented facilities and at least 12 representative months or a justified complete seasonal campaign; disclose temporal, technological, and geographical limitations."
      evidence: "Coverage table and data-quality assessment following eu-pef-2021-2279."
    - id: dq_reasoned_estimates
      applies_to: "provisional ranges"
      requirement: "Do not substitute the reasoned_estimate ranges for available foreground records; replace them when reviewed route-specific batch, meter, recipe, packaging, storage, or discharge evidence becomes available."
      evidence: "Review record identifying each replaced or retained provisional range."
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "Require product flow UUID 5c8cdbc1-2f53-47ac-aa4a-e44125c18761, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and reference amount 1."
    source_ids:
      - unstats-cpc-v3-2025
  - rule_id: val_route_one_of
    applies_to: "product route"
    rule: "Require exactly one of frozen, smoked, dried, salted, or in_brine; reject a package that applies every route or omits the actual integral substeps."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: val_mass_condition
    applies_to: "reference mass"
    rule: "Require packaging exclusion and the applicable net, deglazed, or drained mass basis; require moisture, salt or brine, glaze, edible/saleable portion, storage, and shelf-life qualifiers when applicable."
    source_ids:
      - codex-cxc-52-2003
      - eu-pef-2021-2279
  - rule_id: val_process_completeness
    applies_to: "foreground inventory"
    rule: "Require all three processes and one atomic row for every applicable exchange: electricity; steam or hot water; each fuel; each refrigerant make-up and emission; water; salt; smoke material; each waste stream; each pollutant; and each packaging material and scrap. Reject collection labels, combined carrier lists, and selector instructions; zero is accepted only when records demonstrate non-use or non-generation."
    source_ids:
      - codex-cxc-52-2003
      - eu-pef-2021-2279
  - rule_id: val_mass_balance
    applies_to: "each production lot or reconciled period"
    rule: "Reconcile received, intermediate, final, waste, rework, glaze, brine, and moisture-related mass changes; disclose unexplained imbalance and do not force water-loss routes to equal wet-product yields."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: val_estimate_replacement
    applies_to: "reasoned estimates"
    rule: "Flag every retained provisional range and require replacement when reviewed foreground or source-backed route-specific evidence becomes available; provisional ranges are not publication-critical allowed ranges."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate preserved-octopus production dataset."
  downstream_use: "secondary_dataset; background_dataset; process and lifecyclemodel projections."
  allowed_use: "Route-matched modelling where product form, net-mass condition, storage, geography, technology, and reporting period are compatible and upstream datasets are linked."
  excluded_use: "Direct comparison or substitution across preservation routes without harmonized moisture, salt or brine, glaze, drained-mass, edible/saleable portion, packaging, storage, and shelf-life conditions; modelling live/fresh/chilled or canned products."
  required_metadata: "PCR id and version; product flow UUID; CPC reference; species or commercial designation; product form; cooked/raw state; primary route; integral substeps; net/deglazed/drained mass basis; moisture, salt or brine, and glaze qualifiers; facility geography; technology; reporting period; packaging; storage temperature and duration; shelf life; allocation; upstream dataset references."
  required_quality_disclosure: "Data coverage, measurement and calibration, mass-balance closure, route separation, allocation, missing data, retained reasoned_estimate ranges, source versions, and temporal, technological, and geographical representativeness."
  update_trigger: "Change in route, species mix, product form, cooking state, preservation technology, recipe or brine, moisture or salt specification, glaze, packaging, storage regime, allocation, facility coverage, reference UUID, applicable official guidance, or replacement evidence that materially changes results."
