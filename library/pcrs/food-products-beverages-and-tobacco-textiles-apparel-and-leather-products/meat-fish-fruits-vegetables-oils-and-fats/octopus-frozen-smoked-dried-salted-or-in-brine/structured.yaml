    used_for: "Cephalopod receiving and thawing; ice, water, hygiene, freezing, glazing, salting, brining, drying, smoking, packaging, storage and lot controls."
  - id: "codex-cxc-68-2009"
    type: "official_guidance"
    reference: "Codex Alimentarius, CXC 68-2009, Code of Practice for the Reduction of Contamination of Food with Polycyclic Aromatic Hydrocarbons (PAH) from Smoking and Direct Drying Processes, official full text, https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FStandards%252FCXC%2B68-2009%252FCXC_068e.pdf (retrieved 2026-08-24)."
