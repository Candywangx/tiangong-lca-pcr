allocation_rules:
  - rule_id: alloc_avoid
    applies_to: "shared or multi-output processes"
    rule: "First avoid allocation by route subdivision and direct metering of each named input, waste and emission."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_physical
    applies_to: "unavoidable shared operations"
    rule: "Use a documented physical causal relation, such as occupied mass-time for a common temperature zone, when subdivision is impossible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_economic_last_resort
    applies_to: "co-products without defensible physical relation"
    rule: "Use economic allocation only as a last resort and disclose market, price period and sensitivity."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass_balance
      process_id: "all_production_processes"
      flow_role: "each octopus input, intermediate, saleable output, loss, reject and rework row"
      record_type: "scales, batch sheets, moisture and disposition records"
      raw_fields: "lot_id; route; species; incoming_state; gross_mass; tare_mass; intermediate_mass; final_mass; glaze_mass; drained_mass; moisture; reject_mass; rework_mass"
      collection_method: "Calibrated weighing and route-specific lot reconciliation."
      unit: "kg; percent"
      frequency: "each lot"
      temporal_coverage: "Full representative period."
      site_scope: "Every represented line and site."
      aggregation_rule: "Close each route separately and normalize to qualified saleable mass."
      quality_evidence: "Calibration, lot traceability and signed reconciliation."
    - protocol_id: cp_common_inputs
      process_id: "common_preparation"
      flow_role: "ice, liquid water, electricity, each cleaner and each disinfectant"
      record_type: "meters, invoices, production and issue logs"
      raw_fields: "lot_id; flow_id; quantity; active_fraction; unit; meter_start; meter_end; stock_start; stock_end; assigned_process"
      collection_method: "Meter or reconcile each atomic input separately and prevent double counting with facility sanitation."
      unit: "kg; kWh"
      frequency: "per lot or monthly with traceable allocation"
      temporal_coverage: "Same period as mass balance."
      site_scope: "All preparation lines."
      aggregation_rule: "Normalize to prepared output without combining ice, water, electricity or chemicals."
      quality_evidence: "Meter calibration, active-fraction record and stock/invoice reconciliation."
    - protocol_id: cp_frozen_route
      process_id: "frozen_route"
      flow_role: "glaze water, freezing electricity, holding electricity and freezing loss"
      record_type: "meters, glaze records, freezer and cold-room logs"
      raw_fields: "lot_id; freezer_id; water; electricity; temperature; start_time; end_time; product_mass; loss_mass"
      collection_method: "Direct meter or engineering allocation by documented equipment time and mass-time."
      unit: "kg; kWh; degree Celsius; hour"
      frequency: "each lot and monthly reconciliation"
      temporal_coverage: "Same period as mass balance."
      site_scope: "All freezers and pre-packaging cold rooms."
      aggregation_rule: "Keep freezing and holding electricity separate."
      quality_evidence: "Meter calibration and temperature-log completeness."
    - protocol_id: cp_smoked_route
      process_id: "smoked_route"
      flow_role: "salt, brine, water, wood chips, electricity, steam, ash and smoke-route residues"
      record_type: "recipes, meters, issue and stack records"
      raw_fields: "lot_id; salt; brine; water; wood_species; wood_moisture; electricity; steam; ash; process_time; temperature"
      collection_method: "Reconcile each material and utility separately by lot."
      unit: "kg; kWh; hour; degree Celsius"
      frequency: "each lot"
      temporal_coverage: "Same period as mass balance."
      site_scope: "Every smoking line."
      aggregation_rule: "Do not combine smoke material, electricity, steam or fuel."
      quality_evidence: "Approved recipe, meter calibration and material ledger."
    - protocol_id: cp_dried_route
      process_id: "dried_route"
      flow_role: "drying electricity, steam, moisture and rejects"
      record_type: "meters, moisture tests, dryer and batch logs"
      raw_fields: "lot_id; inlet_mass; outlet_mass; inlet_moisture; outlet_moisture; electricity; steam; time; temperature; reject_mass"
      collection_method: "Meter utilities and close a moisture balance by lot."
      unit: "kg; kWh; percent"
      frequency: "each lot"
      temporal_coverage: "Same period as mass balance."
      site_scope: "Every dryer."
      aggregation_rule: "Calculate removed water from compatible moisture measurements."
      quality_evidence: "Meter and moisture-method QA."
    - protocol_id: cp_salted_brined_route
      process_id: "salted_brined_route"
      flow_role: "salt, water, brine and each additive"
      record_type: "recipes, scales, meters and issue records"
      raw_fields: "lot_id; route; ingredient_id; quantity; concentration; returned_quantity; reused_brine"
      collection_method: "Reconcile each ingredient and brine loop separately."
      unit: "kg; percent"
      frequency: "each lot"
      temporal_coverage: "Same period as mass balance."
      site_scope: "Every salting/brining line."
      aggregation_rule: "Never combine additives or net discharged brine from input."
      quality_evidence: "Recipe approval and scale/meter calibration."
    - protocol_id: cp_combustion_fuels
      process_id: "smoked_route_dried_route"
      flow_role: "natural gas, diesel and LPG"
      record_type: "fuel meters, invoices, tank and cylinder ledgers"
      raw_fields: "equipment_id; fuel_id; quantity; unit; stock_start; stock_end; net_calorific_value; operating_time"
      collection_method: "Reconcile each actual fuel separately to equipment and route."
      unit: "kg; MJ"
      frequency: "monthly with lot allocation"
      temporal_coverage: "Same period as route production."
      site_scope: "Every on-site combustion source."
      aggregation_rule: "No generic thermal-energy or combined-fuel row."
      quality_evidence: "Meter, invoice and stock reconciliation."
    - protocol_id: cp_combustion_emissions
      process_id: "smoked_route_dried_route"
      flow_role: "CO2, CH4, N2O, NOx, SO2, CO and PM2.5"
      record_type: "stack monitoring and fuel-specific calculations"
      raw_fields: "source_id; pollutant; measured_concentration; gas_flow; fuel_quantity; factor; factor_source; control_efficiency"
      collection_method: "Prefer source-specific monitoring; otherwise use documented fuel- and equipment-specific factors."
      unit: "kg"
      frequency: "monitoring campaign or monthly calculation"
      temporal_coverage: "Same period as fuel records."
      site_scope: "Every stack or direct smoke source."
      aggregation_rule: "Calculate each pollutant separately after controls."
      quality_evidence: "Monitoring QA, fuel specification and factor provenance."
    - protocol_id: cp_refrigerant_balance
      process_id: "frozen_route_packaging_storage"
      flow_role: "each refrigerant make-up and release"
      record_type: "refrigerant ledger and service records"
      raw_fields: "equipment_id; refrigerant_id; charge_start; purchases; additions; recovery; charge_end; measured_release"
      collection_method: "Close a separate mass balance for each refrigerant identity and equipment group."
      unit: "kg"
      frequency: "each service event and annual closure"
      temporal_coverage: "Same period as product data."
      site_scope: "Every refrigeration system."
      aggregation_rule: "Never combine refrigerants or assume R717 and R404A both apply."
      quality_evidence: "Technician records and reconciled ledger."
    - protocol_id: cp_packaging_storage
      process_id: "packaging_storage"
      flow_role: "each packaging component, scrap, storage electricity and storage condition"
      record_type: "BOM, issue records, packed counts, warehouse meters and logs"
      raw_fields: "component_id; flow_uuid; mass; units; scrap; destination; stored_mass; temperature; start; end; electricity"
      collection_method: "Reconcile each component separately and allocate storage electricity by compatible temperature-zone mass-time."
      unit: "kg; kWh; day"
      frequency: "each campaign and monthly"
      temporal_coverage: "Same period as product data."
      site_scope: "All packaging lines and storage rooms."
      aggregation_rule: "No combined packaging-material or packaging-waste row."
      quality_evidence: "BOM revision, stock reconciliation and temperature logs."
    - protocol_id: cp_wastewater
      process_id: "all_wastewater_generating_processes"
      flow_role: "each non-saline wastewater and spent-brine stream"
      record_type: "flow meters, batch and discharge records"
      raw_fields: "source_process; stream_id; volume; mass; salinity; chloride; destination; start; end"
      collection_method: "Meter each saline and non-saline stream before mixing."
      unit: "m3; kg"
      frequency: "daily or per batch"
      temporal_coverage: "Same period as production."
      site_scope: "Every discharge point."
      aggregation_rule: "Keep brine separate from ordinary wastewater."
      quality_evidence: "Meter calibration and destination documentation."
    - protocol_id: cp_sanitation_treatment
      process_id: "sanitation_wastewater"
      flow_role: "sanitation water, each chemical, electricity, effluent and sludge"
      record_type: "sanitation logs, chemical ledgers, meters and treatment records"
      raw_fields: "chemical_id; active_fraction; quantity; water; electricity; influent; effluent; sludge; dry_solids; destination"
      collection_method: "Record each chemical and treatment output separately."
      unit: "kg; m3; kWh"
      frequency: "daily or sanitation event"
      temporal_coverage: "Same period as production."
      site_scope: "Whole represented facility."
      aggregation_rule: "Normalize after reconciling stock and wastewater flow."
      quality_evidence: "Approved sanitation schedule, meter and laboratory QA."
    - protocol_id: cp_effluent_quality
      process_id: "sanitation_wastewater"
      flow_role: "COD, BOD, TN, TP, TSS and chloride"
      record_type: "accredited sampling and laboratory records"
      raw_fields: "sample_id; point; date; flow; parameter; concentration; method; detection_limit"
      collection_method: "Pair representative concentration with same-period effluent flow."
      unit: "mg/L; m3"
      frequency: "permit/BAT-compatible frequency"
      temporal_coverage: "Same period as effluent flow."
      site_scope: "Final discharge and key treatment points."
      aggregation_rule: "pollutant load = concentration × compatible effluent volume."
      quality_evidence: "Chain of custody, method, blanks, calibration and accreditation."
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all rows"
      rule: "normalized amount = lot or period amount / qualified saleable reference mass."
      inputs:
        - "atomic flow amount"
        - "applicable net/deglazed/drained mass"
      output: "amount per kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_route_mass_balance
      applies_to: "each route"
      rule: "received or prepared input = route output + measured product losses + retained/reworked material + measured moisture or brine change, with imbalance disclosed."
      inputs:
        - "mass and moisture records"
      output: "route yield and unresolved imbalance"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_combustion_emissions
      applies_to: "each on-site fuel and pollutant"
      rule: "use source monitoring or fuel quantity × documented fuel/equipment factor; calculate every pollutant separately."
      inputs:
        - "fuel records"
        - "monitoring or factors"
      output: "kg pollutant per kg route output"
      source_ids:
        - ipcc-2006-stationary-combustion
        - eu-fdm-bat-2019-2031
    - id: calc_refrigerant_release
      applies_to: "each refrigeration system"
      rule: "release = opening charge + additions - recovery - closing charge, adjusted only for documented transfers."
      inputs:
        - "refrigerant ledger"
      output: "kg refrigerant released"
      source_ids: []
    - id: calc_effluent_load
      applies_to: "each effluent pollutant"
      rule: "load = compatible effluent volume × measured concentration, with unit conversion and non-detect treatment disclosed."
      inputs:
        - "flow and laboratory result"
      output: "kg pollutant per kg reference product"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_storage_energy
      applies_to: "shared storage"
      rule: "allocated electricity = zone electricity × represented product mass-time / total compatible occupied mass-time."
      inputs:
        - meter
        - "temperature zone"
        - "mass and duration"
      output: "kWh per kg for declared duration"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_route
      applies_to: "product and process"
      requirement: "Preserve lot-level species, incoming state, form, exactly one primary route, and all applicable qualifiers."
      evidence: "Product specification, label and batch route log."
    - id: dq_atomic_inventory
      applies_to: "every exchange"
      requirement: "Retain one flow identity, direction, flow type, unit, amount rule and applicability condition per row; do not aggregate carriers, materials, wastes or pollutants."
      evidence: "Atomic-flow reconciliation and Tiangong readback where UUID is present."
    - id: dq_measurement
      applies_to: "meters, scales and laboratory results"
      requirement: "Retain raw readings, calibration, conversions, sampling point and method."
      evidence: "Calibration, chain of custody and laboratory QA."
    - id: dq_representativeness
      applies_to: "period and sites"
      requirement: "Cover the represented facilities and a justified representative period; disclose temporal, technological and geographical limits."
      evidence: "Coverage table and data-quality assessment."
    - id: dq_unresolved_ranges
      applies_to: "important rows without ranges"
      requirement: "Do not invent a range from a single study or single point; retain foreground collection until at least two independent, original, boundary-compatible sources support an inferred range."
      evidence: "Evidence review record linked to manifest unresolved item."
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "Require product UUID 5c8cdbc1-2f53-47ac-aa4a-e44125c18761, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, kg, and reference amount 1."
    source_ids:
      - unstats-cpc-v3-2025
  - rule_id: val_route_one_of
    applies_to: "route"
    rule: "Require exactly one of frozen, smoked, dried, salted, or in_brine; reject application of all route rows."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: val_route_completeness
    applies_to: "applicable route"
    rule: "Require every applicable named material, electricity row, steam row, actual fuel, refrigerant, waste, product loss and direct pollutant; accept non-applicability only with process evidence."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxc-68-2009
      - eu-pef-2021-2279
  - rule_id: val_no_collection_flows
    applies_to: "inventory"
    rule: "Reject a selected flow that is a plural collection, carrier list, material list, utility list, input/output placeholder, or selector instruction."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_refrigerant_pairing
    applies_to: "freezing and storage"
    rule: "For each actual refrigerant require separate make-up and release rows; do not imply R717 and R404A are both used."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_wastewater_pollutants
    applies_to: "on-site treatment and discharge"
    rule: "Require separate wastewater, brine, sludge, COD, BOD, TN, TP, TSS and applicable chloride records with sampling point and destination."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: val_mass_balance
    applies_to: "each lot or period"
    rule: "Reconcile inputs, route output, loss, reject, moisture, glaze and brine changes and disclose unexplained imbalance."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: val_range_evidence
    applies_to: "any authored range"
    rule: "Reject equal lower/upper empirical ranges and any inferred external range lacking at least two independent, original, boundary-compatible sources."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate preserved-octopus production dataset."
  downstream_use: "secondary_dataset; background_dataset; process and lifecyclemodel projections."
  allowed_use: "Route-matched modelling with compatible product form, mass condition, technology, storage, geography and period."
  excluded_use: "Cross-route comparison without harmonized moisture, salt/brine, glaze, drained-mass, packaging, storage and shelf-life conditions; modelling fresh/chilled or canned products."
  required_metadata: "PCR id/version; reference UUID; CPC ref; species; product form; cooked/raw state; one primary route; integral substeps; net/deglazed/drained basis; moisture/salt/brine/glaze; facility; technology; actual fuels and refrigerants; period; packaging; storage; allocation; wastewater destination; upstream datasets."
  required_quality_disclosure: "Coverage, calibration, route mass balance, atomic-flow completeness, allocation, missing data, unresolved UUIDs and ranges, source versions, and representativeness."
  update_trigger: "Material change in route, species, form, technology, recipe, moisture/salt/glaze, fuel, refrigerant, packaging, storage, wastewater treatment, allocation, coverage, UUID, official guidance, or evidence."
data_sources:
  - id: "unstats-cpc-v3-2025"
