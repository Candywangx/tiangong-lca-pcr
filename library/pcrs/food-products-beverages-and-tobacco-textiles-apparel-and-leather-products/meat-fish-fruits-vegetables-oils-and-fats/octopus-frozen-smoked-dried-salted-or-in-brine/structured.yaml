    reference: "European Commission, Commission Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries, https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj/eng (retrieved 2026-08-24)."
    used_for: "Separate inventories of water, energy, raw materials, wastewater and waste gas; monitoring of COD, BOD, TN, TP, TSS, chloride and relevant air pollutants."
  - id: "eu-pef-2021-2279"
