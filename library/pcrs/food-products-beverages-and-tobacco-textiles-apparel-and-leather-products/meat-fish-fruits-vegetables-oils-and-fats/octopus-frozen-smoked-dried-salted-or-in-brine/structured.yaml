    used_for: "Functional unit, reference flow, complete atomic LCI, packaging, allocation, foreground collection, completeness and data quality."
  - id: "ipcc-2006-stationary-combustion"
    type: "method_factor"
    reference: "IPCC, 2006 Guidelines for National Greenhouse Gas Inventories, Volume 2 Energy, Chapter 2 Stationary Combustion, corrected chapter, https://www.ipcc-nggip.iges.or.jp/public/2006gl/vol2.html (retrieved 2026-08-24)."
