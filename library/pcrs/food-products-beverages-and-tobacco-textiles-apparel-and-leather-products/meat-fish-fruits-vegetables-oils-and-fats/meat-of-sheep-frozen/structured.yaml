allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Multi-output slaughter and cutting"
    rule: "First subdivide receiving, slaughter, dressing, freezing, packaging, sanitation and wastewater treatment using meters, batch records and transfer measurements so directly attributable burdens require no allocation."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: allocation_product_status
    applies_to: "Blood, sheepskin, edible organs, fat and bones"
    rule: "Treat a stream as a co-product only when it has documented product status and a beneficial destination; otherwise keep its treatment burden as waste."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: allocation_residual_shared_burdens
    applies_to: "Saleable meat and co-products"
    rule: "After subdivision, allocate only residual shared burdens using the governing study method; document the physical or economic relation, factors, reference period and affected processes."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: allocation_waste_no_credit
    applies_to: "Condemned carcass, digestive contents, rejected material, wastewater, sludge and packaging waste"
    rule: "Do not assign avoided-product credit solely because a waste stream has incidental revenue; disclose downstream treatment and any separately justified recovery model."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: allocation_consistency_and_sensitivity
    applies_to: "Foreground and upstream datasets"
    rule: "Preserve disclosed upstream allocation, apply one consistent foreground method during the reference period and test a material alternative when the allocation choice materially changes the reference-product result."
    source_ids:
      - eu-recommendation-2021-2279-pef
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_lairage_records
      process_id: "live_sheep_receiving_and_lairage"
      flow_role: "Live sheep; stage utilities; accepted sheep; dead-on-arrival sheep; manure; lairage wastewater; direct air emissions"
      record_type: "Weighbridge or livestock scale, receipt log, meter, invoice, stock record and waste transfer record"
      raw_fields: "timestamp; lot; supplier and origin; live weight; acceptance; meter or stock quantity by exact carrier; water; output mass or volume; destination; emission measurement or factor"
      collection_method: "Record each receipt and exact exchange, then reconcile accepted live weight to slaughter transfer"
      unit: "kg, kWh, MJ or m3 as specified by the card"
      frequency: "Each receipt and each meter period"
      temporal_coverage: "At least one representative continuous 12-month period or every campaign in a disclosed shorter seasonal period"
      site_scope: "Every included receiving and lairage area"
      aggregation_rule: "Aggregate only identical exchanges within the same site and period; retain rejected lots and destinations separately"
      quality_evidence: "Scale and meter calibration; supplier record; invoice; stock reconciliation; signed waste transfer record"
    - protocol_id: cp_slaughter_records
      process_id: "slaughter_bleeding_skinning_evisceration"
      flow_role: "Accepted sheep; stage utilities; carcass; blood; sheepskin; organs; digestive contents; condemned carcass; high-load wastewater; direct air emissions"
      record_type: "Slaughter lot record, calibrated scale, meter, collection vessel record, laboratory result and waste transfer record"
      raw_fields: "lot; input live weight; carcass mass; exact co-product or waste identity; mass; wastewater volume; destination; meter or stock quantity; emission basis"
      collection_method: "Record each slaughter lot and separately weigh or meter every named output and utility"
      unit: "kg, kWh, MJ or m3 as specified by the card"
      frequency: "Each lot or production shift"
      temporal_coverage: "Same period as reference-product output"
      site_scope: "Every included slaughter line"
      aggregation_rule: "Reconcile live weight, carcass, co-products, wastes and quantified losses by lot and reporting period"
      quality_evidence: "Scale and meter calibration; signed lot record; inspection or release record; destination evidence; mass-balance worksheet"
    - protocol_id: cp_dressing_cutting_records
      process_id: "carcass_dressing_and_cutting"
      flow_role: "Carcass; stage utilities; meat cuts; fat; bones; trimmings; off-spec meat; wastewater; direct air emissions"
      record_type: "Cutting-lot record, calibrated scale, meter, product release and waste record"
      raw_fields: "lot; carcass input; net meat output; exact co-product or waste identity; mass; wastewater volume; destination; meter or stock quantity; emission basis"
      collection_method: "Record each dressing or cutting lot and preserve bone-in or boneless product identity"
      unit: "kg, kWh, MJ or m3 as specified by the card"
      frequency: "Each lot or shift"
      temporal_coverage: "Same period as reference-product output"
      site_scope: "Every included dressing and cutting line"
      aggregation_rule: "Reconcile input carcass mass to meat, co-products, wastes and stock change without merging stream identities"
      quality_evidence: "Scale and meter calibration; cut specification; release record; waste record; reconciliation worksheet"
    - protocol_id: cp_freezing_records
      process_id: "prechilling_and_freezing"
      flow_role: "Unfrozen meat; stage utilities; R-717; R-134a; frozen intermediate; defrost wastewater; off-spec meat; direct emissions"
      record_type: "Batch or continuous-line record, energy meter, refrigerant service and inventory record, temperature log and scale"
      raw_fields: "lot; input and output mass; start and end time; declared frozen-state evidence; electricity and each thermal carrier; refrigerant stock, purchase, recharge, recovery and closing stock; wastewater; rejects"
      collection_method: "Record each freezing lot or campaign and reconcile product, energy, refrigerant and wastewater records"
      unit: "kg, kWh, MJ, m3 and recorded temperature unit"
      frequency: "Each lot or campaign; refrigerant at each service event"
      temporal_coverage: "Same period as reference-product output"
      site_scope: "Every included pre-chilling and freezing system"
      aggregation_rule: "Keep each energy carrier and refrigerant separate; calculate net refrigerant loss by substance; aggregate only conforming like product forms"
      quality_evidence: "Scale, meter and temperature-sensor calibration; service certificate; stock reconciliation; batch release"
    - protocol_id: cp_packaging_storage_release_records
      process_id: "packaging_frozen_storage_and_release"
      flow_role: "Frozen meat; exact packaging products; stage utilities; R-717; R-134a; reference product; product loss; each packaging waste; wastewater; direct emissions"
      record_type: "Filler or packing scale, packaging issue record, warehouse movement, refrigerant record, meter and release record"
      raw_fields: "lot; frozen input; net packed output; exact packaging identity and mass; return and reuse; waste mass; storage time and condition; refrigerant fields; meter quantity; release status"
      collection_method: "Record each lot through released warehouse quantity and exclude packaging from net product mass"
      unit: "kg, kWh, MJ, m3 and recorded storage-condition unit"
      frequency: "Each lot plus continuous storage meters"
      temporal_coverage: "Same period as reference-product output"
      site_scope: "Every included packing line and on-site frozen store"
      aggregation_rule: "Net product excludes packaging; keep every product, packaging material, waste and refrigerant identity separate"
      quality_evidence: "Scale and meter calibration; packaging specification; warehouse reconciliation; release record; refrigerant service evidence"
    - protocol_id: cp_cleaning_disinfection_records
      process_id: "cleaning_and_disinfection"
      flow_role: "Stage utilities; sodium hydroxide; nitric acid; sodium hypochlorite; peracetic acid; sanitation wastewater; solid residue; direct air emissions"
      record_type: "Sanitation schedule, chemical issue record, water and energy meter, wastewater record and residue transfer record"
      raw_fields: "serviced process; time; exact chemical; formulated mass and concentration; unused return; water; energy carrier; wastewater volume; residue mass; destination; emission basis"
      collection_method: "Record each sanitation event and allocate only shared service using a documented causal driver"
      unit: "kg, kWh, MJ or m3 as specified by the card"
      frequency: "Each sanitation event and meter period"
      temporal_coverage: "Same period as reference-product output"
      site_scope: "All sanitation serving included processes"
      aggregation_rule: "Keep each chemical and energy carrier separate; do not double count water reused internally"
      quality_evidence: "Chemical certificate and issue reconciliation; meter calibration; sanitation verification; wastewater and waste record"
    - protocol_id: cp_onsite_wastewater_records
      process_id: "onsite_wastewater_treatment"
      flow_role: "Ordinary wastewater; high-load wastewater; exact treatment chemicals; stage utilities; treated wastewater; sludge; screenings; air and water emissions"
      record_type: "Influent and effluent meter, composite sample, laboratory report, chemical issue, energy meter, sludge scale and transfer record"
      raw_fields: "date and time; influent class and volume; chemical identity and quantity; energy carrier; effluent volume; COD; total nitrogen; total phosphorus; suspended solids; sludge and screenings mass; destination; air-emission basis"
      collection_method: "Match flow-weighted samples to discharge volume and keep ordinary and high-load influent separate"
      unit: "kg, kWh, MJ, m3 and concentration unit"
      frequency: "Continuous volume with sampling frequency disclosed"
      temporal_coverage: "Same period as reference-product output"
      site_scope: "Every included on-site treatment line and discharge point"
      aggregation_rule: "Calculate each water pollutant independently from matched volume and concentration; separately reconcile sludge and screenings"
      quality_evidence: "Flowmeter and laboratory QA; sampling plan; chemical issue; sludge scale; discharge and transfer records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All included inventory"
      rule: "normalized amount = reporting-period exchange amount divided by net conforming frozen sheep-meat mass released; packaging is excluded from the denominator"
      inputs:
        - "period exchange amount"
        - "released net reference-product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-recommendation-2021-2279-pef
    - id: calc_process_mass_balance
      applies_to: "Each foreground process"
      rule: "opening stock plus external and internal inputs equals closing stock plus products, co-products, wastes, internal transfers and quantified loss; report the residual without forcing closure"
      inputs:
        - stock
        - input
        - output
        - "transfer and reject records"
      output: "process mass-balance residual"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-recommendation-2021-2279-pef
    - id: calc_live_to_carcass_reconciliation
      applies_to: "Receiving and slaughter"
      rule: "reconcile accepted live weight to dressed carcass, blood, skin, organs, digestive contents, condemned material and documented residual"
      inputs:
        - live-weight
        - "carcass and separated-stream records"
      output: "slaughter mass-balance residual"
      source_ids:
        - ec-jrc-sa-bref-2024
    - id: calc_stage_utility_allocation
      applies_to: "Shared utilities"
      rule: "assign a directly metered quantity first; allocate only the reconciled shared residual using a documented causal driver such as operating time, throughput or measured load"
      inputs:
        - sub-meter
        - "site total"
        - export
        - "operating driver and process output"
      output: "carrier amount by process"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-recommendation-2021-2279-pef
    - id: calc_combustion_emissions
      applies_to: "Natural gas, diesel and LPG use"
      rule: "calculate each named air emission from the measured fuel amount and the documented site measurement or emission factor; preserve factor basis and fuel convention"
      inputs:
        - "fuel amount"
        - "measured concentration or factor"
        - "operating record"
      output: "kg of each named air emission"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-recommendation-2021-2279-pef
    - id: calc_refrigerant_loss
      applies_to: "R-717 and R-134a systems"
      rule: "unrecovered loss = opening stock plus purchases plus recharge transfers in minus recovered quantity minus closing stock minus documented transfers out; calculate separately by substance"
      inputs:
        - "refrigerant stock and service records"
      output: "kg make-up and kg unrecovered emission by substance"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-recommendation-2021-2279-pef
    - id: calc_wastewater_load
      applies_to: "On-site treatment discharge"
      rule: "pollutant load = matched treated-wastewater volume multiplied by the measured concentration; calculate COD, total nitrogen, total phosphorus and suspended solids independently"
      inputs:
        - "discharge volume"
        - "matched concentration"
        - "sampling period"
      output: "kg of each named water emission"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-recommendation-2021-2279-pef
    - id: calc_coproduct_allocation
      applies_to: "Residual shared burdens"
      rule: "allocated burden for output i = residual shared burden multiplied by the disclosed allocation factor for output i; factors shall sum to one across the allocated outputs"
      inputs:
        - "residual burden"
        - "product quantities"
        - "physical relation or economic value"
        - "reference period"
      output: "allocated residual burden and sensitivity result"
      source_ids:
        - eu-recommendation-2021-2279-pef
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and intermediate meat"
      requirement: "Demonstrate sheep species, frozen state, product form, bone status, lot identity and conformity; do not use the CPC 21135 UUID for edible offal or prepared meat."
      evidence: "Product specification; lot record; release record; selected Tiangong UUID"
    - id: dq_temporal_representativeness
      applies_to: "All foreground records"
      requirement: "Use one representative continuous 12-month period for year-round operation or all production campaigns in a shorter disclosed seasonal period; register gaps and substitutions."
      evidence: "Meter and batch coverage; production calendar; gap register"
    - id: dq_geographic_and_technical_scope
      applies_to: "Site and upstream datasets"
      requirement: "Match actual slaughter geography, sheep supply, process technology, freezing system and wastewater route; disclose every proxy and material mismatch."
      evidence: "Site metadata; supplier origin; equipment records; dataset geography and technology"
    - id: dq_inventory_completeness
      applies_to: "All included processes"
      requirement: "Cover all known energy, water, material and chemical inputs and every product, co-product, waste and direct emission output; document a specific non-applicability or cut-off reason for omissions."
      evidence: "Complete LCI checklist; bills; stock records; meters; batch and waste records"
    - id: dq_mass_balance
      applies_to: "Sheep, carcass, meat and separated streams"
      requirement: "Reconcile live weight and each process mass balance, disclose measurement uncertainty and investigate material residuals instead of inserting an unmeasured loss."
      evidence: "Signed balance worksheets; calibrated scales; residual investigation"
    - id: dq_cold_chain_and_release
      applies_to: "Pre-chilling, freezing and frozen storage"
      requirement: "Retain lot-linked evidence of the declared frozen state, storage condition, duration and release status without inventing a default temperature or residence time."
      evidence: "Temperature log; sensor calibration; warehouse movement; release record"
    - id: dq_emissions_and_wastewater
      applies_to: "Air and water emissions"
      requirement: "Link every calculated emission to measured activity data, a documented measurement or factor, applicable compartment and reference period."
      evidence: "Measurement report; factor source; fuel record; laboratory QA; calculation worksheet"
    - id: dq_coproduct_and_waste_status
      applies_to: "Blood, skin, organs, fat, bones and rejected material"
      requirement: "Document destination and legal or commercial product status for each stream before treating it as a co-product; retain waste transfer evidence otherwise."
      evidence: "Sales or transfer record; product specification; waste manifest; allocation worksheet"
    - id: dq_data_provenance_and_review
      applies_to: "Foreground data package"
      requirement: "Retain company-specific source records, transformations, allocation, data-quality ratings, reviewer findings and limitations sufficient to reproduce the inventory."
      evidence: "Data lineage register; calculation workbook; review record; limitation disclosure"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "Reference flow"
    rule: "The selected flow UUID shall be 7a898ac1-b845-4943-bae3-94e7c24ae06d, a Product flow for exact CPC 21135 using Mass and kg; do not apply it to fresh or chilled sheep meat, edible offal, other species or prepared meat."
    source_ids:
      - un-cpc-3-0
  - rule_id: validation_reference_amount
    applies_to: "Quantitative reference"
    rule: "The reference output shall equal exactly 1 kg net conforming frozen sheep meat using Mass 93a60a56-a3c8-11da-a746-0800200b9a66 and kg from unit group 93a60a57-a4c8-11da-a746-0800200c9a66; packaging mass shall be excluded."
    source_ids:
      - un-cpc-3-0
  - rule_id: validation_process_selection
    applies_to: "Process map"
    rule: "Include all six required processes and include onsite_wastewater_treatment whenever wastewater is treated at the represented facility."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: validation_atomic_inventory
    applies_to: "Foreground inventory"
    rule: "Each card shall contain one exact exchange and one property-unit pair. Reject collection labels, selectors, combined energy carriers, multiple chemicals, multiple packaging materials, multiple wastes or multiple emissions in one Selected flow."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: validation_inventory_coverage
    applies_to: "Foreground inventory"
    rule: "Verify separate cards for live sheep, stage water and each energy carrier, each refrigerant make-up and emission, each cleaner and disinfectant, each packaging product and packaging waste, each product or co-product, each waste stream and each direct air or water emission actually present."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: validation_mass_balance
    applies_to: "Foreground processes"
    rule: "Report process and reporting-period mass-balance residuals with measurement uncertainty and investigate material residuals; do not fabricate closure."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: validation_frozen_state
    applies_to: "Reference product"
    rule: "Demonstrate the declared frozen state and preserve lot-linked pre-chilling, freezing, frozen-storage duration, condition and release evidence; no default temperature or duration may be inferred."
    source_ids:
      - un-cpc-3-0
      - ec-jrc-sa-bref-2024
  - rule_id: validation_no_utility_double_counting
    applies_to: "Utilities"
    rule: "Verify that purchased steam and fuels, purchased hot water and its upstream heat supply, fresh and reused water, and shared utility allocations are each counted once."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: validation_refrigerants
    applies_to: "Refrigeration"
    rule: "Reconcile each refrigerant substance independently; a make-up product flow and its corresponding unrecovered air emission shall not be merged or duplicated."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: validation_wastewater
    applies_to: "Wastewater and on-site treatment"
    rule: "Keep ordinary and high-organic-load wastewater distinct, reconcile influent, effluent and sludge, and calculate each reported water emission from matched flow and concentration records."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: validation_allocation
    applies_to: "Co-products and shared operations"
    rule: "Subdivide directly attributable burdens before allocation; residual allocation factors shall sum to one and the method, period, product status and material sensitivity result shall be disclosed."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: validation_collection_links
    applies_to: "Collected and calculated rows"
    rule: "Every collected or calculated row shall reference an implemented collection protocol; every calculation shall identify its rule or reproducible worksheet."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: validation_data_quality_and_transparency
    applies_to: "Published data package"
    rule: "Disclose company-specific data coverage, sources, transformations, proxies, gaps, cut-offs, uncertainty, allocation, data quality and reviewer findings."
    source_ids:
      - eu-recommendation-2021-2279-pef
published_dataset_profile:
  dataset_role: "Site-specific foreground data package for frozen sheep meat, publishable as a unit process or reviewed gate-to-gate dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Attributional product LCA, supply-chain modelling, facility improvement, hotspot analysis and comparison of like frozen sheep-meat forms when geography, technology, allocation and frozen-state specification are compatible"
  excluded_use: "Claims for fresh or chilled meat, edible offal, goat or other species, prepared meat, food-safety certification, nutrition claims, or use outside the represented geography, period and technology without representativeness review"
  required_metadata: "PCR id and lifecycle state; CPC 21135 product identity and Tiangong UUID; sheep origin; facility and geography; carcass or cut form; bone status; freezing and storage technology; frozen-storage duration and condition; reference period; system boundary; upstream datasets; packaging; wastewater route; co-product status; allocation; data owners and review status"
  required_quality_disclosure: "Primary-data coverage; scale, meter, sensor and laboratory methods; live-weight and process mass-balance residuals; unresolved flow UUIDs; proxy datasets; temporal, geographic and technology limitations; cut-offs; allocation sensitivity; uncertainty; data-quality ratings and reviewer findings"
  update_trigger: "Change in product form, sheep supply, slaughter or freezing technology, energy system, refrigerant, packaging, wastewater route, co-product status or allocation; new verified Tiangong identity; better representative foreground data; corrected mass balance or source revision"
