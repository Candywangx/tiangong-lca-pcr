allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "Shared or multi-output foreground operations"
    rule: "First avoid allocation through process subdivision or by expanding the system where the substituted function is demonstrable and consistent with the study goal."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_second
    applies_to: "Unavoidable joint processes with a causal physical relationship"
    rule: "Allocate by a measured causal physical relationship such as mass, processing time, occupied capacity-time, or metered energy; explain why the driver represents resource use or emissions."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relation_last
    applies_to: "Unavoidable joint processes without a defensible physical relationship"
    rule: "Use another documented relationship, normally economic value over a representative period, only after the preceding options are infeasible; disclose prices, period, currency, shares, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: co_product_or_waste_status
    applies_to: "Offcuts, rejected fish, recovered salt/brine, and other outputs"
    rule: "Classify an output as a co-product only when it has a documented destination and function or market value; otherwise model it as waste to the actual treatment. Do not credit avoided burden without an explicit system-expansion model."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: internal_flow_no_double_count
    applies_to: "Intermediate fish transferred between foreground steps"
    rule: "Internal transfers carry mass for balance checks but do not introduce a second upstream burden."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_fish_receipt
      process_id: "fish_receipt_and_conditioning"
      flow_role: "Received fish, rejects, thaw loss, and conditioning energy"
      record_type: "Weighbridge/scale, receiving inspection, temperature log, meter, supplier lot record"
      raw_fields: "lot_id; species; product_form; origin; input_state; gross_mass; tare_mass; accepted_mass; reject_mass; thaw_loss; receipt_temperature; holding_time; electricity; fuel; disposition"
      collection_method: "Calibrated weighing, acceptance inspection, continuous or batch temperature record, and attributable meter/invoice reading"
      unit: "kg; °C; h; kWh; MJ"
      frequency: "Every lot; energy at least each production campaign"
      temporal_coverage: "Representative operating period including normal seasonal variation"
      site_scope: "Each included facility and receiving/storage area"
      aggregation_rule: "Sum lot quantities; subtract tare; allocate shared conditioning energy by measured causal driver; normalize to conforming output"
      quality_evidence: "Calibration, supplier specification, acceptance decision, temperature trace, meter reconciliation, and lot linkage"
    - protocol_id: cp_preparation
      process_id: "fish_preparation"
      flow_role: "Fish input/output, water, offcuts, and wastewater"
      record_type: "Batch sheet, calibrated scale, water meter, waste ticket"
      raw_fields: "lot_id; input_mass; prepared_mass; water_input; offcut_mass_by_disposition; reject_mass; wastewater_volume; solids_mass"
      collection_method: "Batch weighing and metering with disposition-specific waste records"
      unit: "kg; m3"
      frequency: "Every batch or continuous meter interval linked to batches"
      temporal_coverage: "Representative operating period"
      site_scope: "Each preparation line"
      aggregation_rule: "Mass balance by batch; aggregate only like product forms and routes; normalize to prepared and final outputs"
      quality_evidence: "Scale/meter calibration, batch reconciliation, and waste destination evidence"
    - protocol_id: cp_salting_batch
      process_id: "salting_or_brining"
      flow_role: "Fish, salt, brine water, preserved output, spent brine, time, and temperature"
      record_type: "Recipe/batch sheet, scales, flow meter, salinometer or validated concentration test, temperature logger"
      raw_fields: "lot_id; method; fish_input_mass; salt_mass; brine_water; brine_concentration; make_up; time; temperature; output_mass; spent_brine; discharge_destination"
      collection_method: "Weigh each batch addition and output; monitor concentration, time, and temperature under the validated plan"
      unit: "kg; m3; concentration unit; °C; h"
      frequency: "Every batch with monitoring frequency defined by HACCP/quality plan"
      temporal_coverage: "Representative operating period"
      site_scope: "Each salting/brining line and vessel"
      aggregation_rule: "Batch mass balance; no averaging across materially different methods; normalize to preserved output and reference product"
      quality_evidence: "Calibration, recipe authorization, concentration checks, temperature/time record, corrective action, and lot release"
    - protocol_id: cp_drying_batch
      process_id: "non_smoking_drying"
      flow_role: "Dryer input/output, energy, endpoint, and rejects"
      record_type: "Batch sheet, calibrated scales, energy meters, time/temperature/humidity logs, validated endpoint test"
      raw_fields: "lot_id; dryer_id; input_mass; output_mass; reject_mass; electricity; fuel; start_time; end_time; temperature_profile; humidity_profile; endpoint_method; endpoint_result"
      collection_method: "Weigh input/output; meter energy; record operating profile; test the declared endpoint by validated method"
      unit: "kg; kWh; MJ; °C; h; declared endpoint unit"
      frequency: "Every batch or continuous run segment"
      temporal_coverage: "Representative seasons and loading conditions"
      site_scope: "Each dryer technology and site"
      aggregation_rule: "Separate technologies and recipes; calculate yield and specific energy; normalize to dried and final product"
      quality_evidence: "Calibration, meter reconciliation, endpoint test record, deviation/corrective action, and lot release"
    - protocol_id: cp_packing_storage
      process_id: "packing_and_storage"
      flow_role: "Product, packaging, rejects, storage energy, duration, and temperature"
      record_type: "Packing bill of materials, scales, warehouse system, temperature logger, meter, waste record"
      raw_fields: "lot_id; packed_net_mass; drained_mass_if_applicable; packaging_mass_by_material; rejects; storage_start; storage_end; temperature_profile; energy; occupied_capacity; waste_destination"
      collection_method: "Weigh or reconcile packing materials and product; meter storage energy; continuously or periodically log storage condition under validated plan"
      unit: "kg; h; °C; kWh; MJ"
      frequency: "Every packing lot; storage energy and conditions over attributable intervals"
      temporal_coverage: "Representative operating period"
      site_scope: "Each packing line and storage system"
      aggregation_rule: "Normalize packaging by net product; allocate storage energy by occupied capacity-time unless a better causal driver is measured"
      quality_evidence: "Net-content check, material reconciliation, temperature trace, meter calibration, lot code, and release record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every foreground inventory row"
      rule: "normalized amount = attributable row amount / conforming net reference-product mass"
      inputs:
        - "attributable row amount"
        - "conforming net product kg"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calc_process_mass_balance
      applies_to: "Each fish-processing step"
      rule: "mass-balance residual = total measured mass inputs - total measured product, co-product, waste, wastewater-solids, retained-brine, and measured moisture-loss outputs; investigate material residuals using uncertainty and missing-flow records"
      inputs:
        - "batch input/output masses and moisture/brine basis"
      output: "residual and completeness flag"
      source_ids: []
    - id: calc_yield
      applies_to: "Preparation, preservation, drying, and packing"
      rule: "process yield = conforming process-output mass / eligible process-input fish mass on the same declared basis"
      inputs:
        - "eligible fish input"
        - "conforming output"
      output: "kg/kg yield"
      source_ids: []
    - id: calc_shared_energy
      applies_to: "Shared meters"
      rule: "attributable energy = measured shared energy x documented causal share; use production time, metered load, occupied capacity-time, or another justified physical driver before economic allocation"
      inputs:
        - "meter total"
        - "causal driver totals"
        - "product share"
      output: "attributable kWh or MJ"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_allocation_share
      applies_to: "Multi-output process"
      rule: "Apply the selected Section 7 hierarchy and calculate shares from the same period and boundary as the allocated inventory; shares must sum to 1 within numerical tolerance"
      inputs:
        - "subdivided inventory or physical/economic driver data"
      output: "allocated inventory and allocation shares"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Fish and reference product"
      requirement: "Preserve supplier, species/product identity, origin where known, lot chain, input and output state, and the declared CPC 21231 route through final lot release."
      evidence: "Receiving record, supplier specification, batch genealogy, product specification, and lot code"
    - id: dq_measurement_control
      applies_to: "Mass, water, energy, concentration, temperature, time, and endpoint measurements"
      requirement: "Use calibrated or verified instruments suitable for the operating range; preserve raw readings, units, conversion factors, calibration status, and data substitutions."
      evidence: "Calibration/verification records, meter reconciliation, laboratory method, and calculation sheet"
    - id: dq_temporal_representativeness
      applies_to: "Foreground activity data"
      requirement: "Cover a representative operating period including relevant species, route, technology, load, and seasonal variation; disclose shutdowns, atypical batches, and exclusions."
      evidence: "Production calendar, batch coverage table, and representativeness assessment"
    - id: dq_completeness
      applies_to: "Process inventory"
      requirement: "Reconcile fish mass through each process and collect all material fish, salt, brine, water, energy, packaging, refrigerant loss where relevant, wastewater, rejects, co-products, and treatment destinations."
      evidence: "Process mass balance, utility reconciliation, waste tickets, and completeness checklist"
    - id: dq_food_safety_quality
      applies_to: "Processing and release controls"
      requirement: "Maintain prerequisite programmes and a product/route-specific HACCP and defect-control plan, including limits, monitoring, corrective actions, verification, and release criteria required by applicable law and specification."
      evidence: "HACCP plan, monitoring logs, deviations, corrective actions, verification, test results, and release authorization; codex-cxc-52-2003"
    - id: dq_proxy_disclosure
      applies_to: "Upstream and missing foreground data"
      requirement: "Identify every proxy, gap-filled value, estimate, allocation, and unverified UUID; report its effect and replacement priority."
      evidence: "Data-gap register, sensitivity result, and review record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require reference product UUID 39347f84-4a1d-414b-89f0-746f31b01aa6, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and exactly 1 kg net product."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata and product description"
    rule: "Fail completeness when any required qualifier in Section 3 is missing or when drained/undrained basis is ambiguous for a brined product."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_route_scope
    applies_to: "Process map"
    rule: "Require salting/brining only when used, require non-smoking drying for the dried route, prohibit smoking under this PCR, and disclose all omitted conditional steps."
    source_ids:
      - codex-cxc-52-2003
      - unsd-cpc-3-0-2025
  - rule_id: validate_mass_balance
    applies_to: "Each foreground process and whole foreground system"
    rule: "Require a documented mass balance on consistent wet/drained/dry bases; investigate and disclose material residuals rather than forcing closure."
    source_ids: []
  - rule_id: validate_haccp_records
    applies_to: "Food-safety and quality controls"
    rule: "Require a route- and product-specific HACCP/prerequisite record set with monitoring, corrective action, verification, and lot-release evidence."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_salting_brining_controls
    applies_to: "Salted or brined routes"
    rule: "Require food-grade salt, potable brine water, measured salt or brine input, declared method, time/temperature and concentration controls where applicable, and spent-brine destination."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_drying_endpoint
    applies_to: "Dried route"
    rule: "Require a product-specific validated drying endpoint and method, recorded operating conditions, and confirmation that no smoking operation occurred; this PCR does not supply a universal endpoint value."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_chilled_storage
    applies_to: "Salt-matured fish requiring chilled storage"
    rule: "Require storage between 1 °C and 4 °C with recorded time and temperature unless a stricter applicable product specification governs."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_allocation
    applies_to: "Multi-output and shared operations"
    rule: "Require the Section 7 hierarchy, causal-driver evidence, shares summing to 1, and disclosure/sensitivity for any economic or other-relation allocation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_provisional_ranges
    applies_to: "Reasoned-estimate QA ranges"
    rule: "Treat every reasoned_estimate range as a non-binding review screen; do not substitute it for foreground data or claim source-backed representativeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for a declared dried, salted, or brined fish route"
  downstream_use: "secondary_dataset; background_dataset when reviewed for representativeness and reuse"
  allowed_use: "Product carbon footprint, LCA, EPD, supply-chain, and process-improvement studies that match the declared species/product form, preservation route, geography, technology, storage, and time"
  excluded_use: "Smoked or smoke-dried fish, edible fish meal, fish offal categories, cooked/canned or otherwise prepared fish, unqualified generic seafood proxies, or public comparative assertions without applicable review"
  required_metadata: "PCR id/version; reference UUIDs; species and origin; product form; input state; preservation route and method; dried endpoint claim; brine/net-mass basis; storage regime; packaging; facility geography; technology; reference year; allocation; upstream datasets; exclusions"
  required_quality_disclosure: "Foreground coverage, calibration, mass balance, HACCP/quality evidence, route-specific limits, proxies, provisional estimates, unverified UUIDs, allocation sensitivity, data gaps, and review status"
  update_trigger: "Material change in species mix, source fish, route, salting/brining recipe, dryer or storage technology, preservation endpoint, packaging, energy supply, facility, law/specification, allocation driver, or representative data period"
