system_boundary:
  rules:
    - rule_id: boundary_rule_slaughter_route
      applies_to: "Foreground slaughter and chilling"
      rule: "Include live-bird reception and inspection, stunning, bleeding, scalding, defeathering, head and feet removal as applicable, evisceration, post-mortem inspection, washing, chilling, chilled holding, and dispatch. Include cutting, deboning, and primary packaging when performed before the declared product gate."
      source_ids:
        - ifc-poultry-processing-ehs-2007
        - codex-cxc-58-2005
    - rule_id: boundary_rule_cold_chain
      applies_to: "Chilled product"
      rule: "Include refrigeration and handling needed to reduce product temperature rapidly and maintain the declared chilled state through the plant gate. A temporary cold-chain interruption may be represented only when necessary for documented operations and its duration and temperature consequence are recorded."
      source_ids:
        - codex-cxc-58-2005
    - rule_id: boundary_rule_upstream
      applies_to: "Live chickens and other supplied inputs"
      rule: "Exclude farming, hatchery, feed production, and off-site supply processes from the slaughter foreground, but link their burdens through upstream datasets. Include inbound transport separately when it is not already included in the delivered live-chicken dataset."
      source_ids:
        - ifc-poultry-processing-ehs-2007
    - rule_id: boundary_rule_stream_separation
      applies_to: "Meat, edible co-products, inedible material, and wastewater"
      rule: "Keep reference meat, edible offal, saleable by-products, condemned material, blood, feathers, other solids, and wastewater as distinct streams. Do not route recoverable organic material implicitly into wastewater."
      source_ids:
        - ifc-poultry-processing-ehs-2007
        - ec-bat-slaughterhouses-2023
    - rule_id: boundary_rule_treatment
      applies_to: "On-site and off-site treatment"
      rule: "Include on-site wastewater or by-product treatment burdens when operated within the declared plant boundary. Otherwise record the outgoing waste or co-product and link the appropriate off-site treatment or processing dataset."
      source_ids:
        - ec-bat-slaughterhouses-2023
boundary_abstraction:
  declared_starting_condition: "Live chickens accepted for slaughter at the slaughterhouse receiving point, with supplier, origin, arrival mass, bird count, mortality, and inspection disposition recorded"
  starting_condition_role: "Foreground-gate input condition; upstream husbandry and feed production are supplied by linked background datasets rather than repeated inside the slaughter foreground"
  product_classification_scope: "Edible chicken meat that remains fresh or chilled under CPC 3.0 21121; frozen meat, edible offal, and prepared or preserved chicken products remain outside this PCR identity"
  recursive_input_rule: "If fresh or chilled chicken meat enters a cutting, deboning, repacking, or rework operation, record it as a separate same-category technosphere input with an upstream dataset and do not recursively reproduce its slaughter inventory in the receiving process"
  upstream_dataset_requirement: "Require traceable upstream datasets for live-chicken production and any inbound transport, electricity, fuel or heat, water supply, chemicals, packaging, refrigerant, and off-site treatment that crosses the selected boundary"
  disclosure: "Declare geography, plant type, product form, chilling method, gate temperature limit, drainage convention, reporting period, included optional operations, treatment ownership, co-product destinations, allocation method, and all deviations from this boundary"
