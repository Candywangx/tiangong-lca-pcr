  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory flow"
      rule: "normalized amount = reporting-period flow amount / reporting-period net conforming reference-product mass × 1,000"
      inputs:
        - "collected flow amount"
        - "net product mass"
      output: "flow amount per 1,000 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_live_to_product_yield
      applies_to: "Live birds and reference product"
      rule: "yield = net conforming reference-product mass / accepted net live mass; report separately by product form and route"
      inputs:
        - "accepted live mass"
        - "net product mass"
      output: "kg reference product per kg accepted live weight"
      source_ids:
        - ifc-poultry-processing-ehs-2007
    - id: calc_energy_intensity
      applies_to: "Electricity and process heat"
      rule: "convert each carrier to kWh on the declared basis, sum only after conversion, and divide by net product mass; additionally calculate the source-compatible cold-carcass basis for BAT comparison when available"
      inputs:
        - electricity
        - fuels
        - "steam or heat"
        - "heating values"
        - "net product mass"
        - "cold carcass mass"
      output: "kWh per 1,000 kg reference product and, when available, kWh per tonne cold carcass"
      source_ids:
        - ec-bat-slaughterhouses-2023
    - id: calc_water_balance
      applies_to: "Water and wastewater"
      rule: "supplied process water = process wastewater + water retained in product or by-products + evaporation + exported moisture + documented losses, within stated uncertainty"
      inputs:
        - supply
        - wastewater
        - uptake
        - outputs
        - "evaporation estimate"
      output: "reconciled water balance and unexplained difference"
      source_ids:
        - ec-bat-slaughterhouses-2023
        - ifc-poultry-processing-ehs-2007
    - id: calc_chilling_uptake
      applies_to: "Water-chilled product"
      rule: "uptake fraction = (post-drain product mass − comparable pre-chill product mass) / comparable pre-chill product mass"
      inputs:
        - "paired pre-chill and post-drain masses"
      output: "kg retained water per kg pre-chill product"
      source_ids:
        - ifc-poultry-processing-ehs-2007
    - id: calc_refrigerant_loss
      applies_to: "Refrigeration systems"
      rule: "refrigerant loss = opening charge + additions − recovered refrigerant − closing charge, adjusted for documented transfers"
      inputs:
        - "charge and service records"
      output: "kg refrigerant emitted by identity"
      source_ids:
        - ec-bat-slaughterhouses-2023
    - id: calc_mass_balance
      applies_to: "Slaughter route"
      rule: "compare accepted live mass and other material inputs with reference meat, co-products, wastes, retained water change, and documented stock changes; explain the residual rather than forcing closure"
      inputs:
        - "all material inputs and outputs"
        - "stock changes"
        - "moisture or uptake"
      output: "mass-balance residual and relative closure"
      source_ids:
        - mass-balance-identity
        - ifc-poultry-processing-ehs-2007
    - id: calc_allocation_fractions
      applies_to: "Shared burdens"
      rule: "allocation fraction for each co-product = selected allocation quantity for that co-product / sum of selected allocation quantities for all product outputs; fractions must sum to 1 within rounding tolerance"
      inputs:
        - "direct assignments"
        - "product masses or other physical driver"
        - "or documented market values"
      output: "allocation fraction and allocated burden by output"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Reference product and incoming birds"
      requirement: "Preserve lot-level linkage from supplier and accepted birds through inspection, chilling, product form, temperature release, and plant-gate dispatch."
      evidence: "receiving, inspection, production, grading, temperature, and dispatch records"
    - id: dq_measurement_control
      applies_to: "Mass, temperature, water, energy, and flow records"
      requirement: "Use calibrated or verified devices appropriate to the measured range; retain calibration status, reading frequency, missing-data treatment, and reconciliation results."
      evidence: "calibration certificates; meter map; device logs; reconciliation report"
    - id: dq_temporal_representativeness
      applies_to: "Foreground reporting period"
      requirement: "Use at least 12 consecutive months when seasonal throughput or refrigeration loads are material; a shorter complete campaign must state season, product mix, and limitation."
      evidence: "reporting-period declaration; throughput and operating calendar"
    - id: dq_completeness
      applies_to: "Process inventory"
      requirement: "Cover every included shift, line, product form, optional operation, co-product, waste route, and material abnormal event. Quantify data coverage and disclose exclusions rather than silently applying zero."
      evidence: "completeness matrix; production reconciliation; incident and downtime log"
    - id: dq_stream_status
      applies_to: "Co-products and wastes"
      requirement: "Substantiate edible, saleable, waste, risk-class, and destination status independently for each output stream."
      evidence: "inspection disposition; legal classification; contracts; dispatch tickets; treatment receipts"
    - id: dq_source_basis
      applies_to: "External QA ranges"
      requirement: "Preserve the original source denominator and compare a foreground value only after documenting any conversion between live-bird, cold-carcass, and net reference-product bases."
      evidence: "calculation sheet; source citation; mass and yield records"
    - id: dq_geography_technology
      applies_to: "Background datasets"
      requirement: "Match electricity voltage and geography, fuel and heat technology, water supply, packaging material, refrigerant identity, and treatment route to the foreground plant."
      evidence: "background dataset metadata and selection rationale"
validation_rules:
  - rule_id: validation_rule_identity
    applies_to: "Product category"
    rule: "Fail if the reference output is live chicken, frozen chicken meat, edible offal, rendered fat, or a prepared/preserved chicken product, or if the declared product is not edible chicken meat in a fresh or chilled state."
    source_ids:
      - unsd-cpc-v3-21121
  - rule_id: validation_rule_reference_flow
    applies_to: "Functional unit and reference object"
    rule: "Require exactly 1 kg net reference product linked to product flow 562d85c5-f2c0-4a72-b866-5b3587bf4f29, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_rule_qualifiers
    applies_to: "Dataset metadata"
    rule: "Fail completeness when any required qualifier is absent, including product form, bone and skin status, chilling method, gate temperature, net-mass and drainage convention, packaging state, geography, period, or included optional operations."
    source_ids:
      - codex-cxc-58-2005
      - ifc-poultry-processing-ehs-2007
  - rule_id: validation_rule_boundary
    applies_to: "Foreground process map"
    rule: "Require the complete declared slaughter-and-chilling route and explicit upstream datasets for live birds and other supplied inputs. Reject double counting of farming or feed burdens in both the live-bird dataset and slaughter foreground."
    source_ids:
      - ifc-poultry-processing-ehs-2007
      - codex-cxc-58-2005
  - rule_id: validation_rule_temperature
    applies_to: "Chilled product release"
    rule: "Require measured product-temperature evidence and the applicable limit. Flag values above 4 °C against the default IFC guideline unless the dataset documents a competent-authority or customer specification and disposition."
    source_ids:
      - ifc-poultry-processing-ehs-2007
      - codex-cxc-58-2005
  - rule_id: validation_rule_streams
    applies_to: "Products, co-products, wastes, and wastewater"
    rule: "Require separate amounts and destinations for reference meat, edible offal, other marketed by-products, condemned or inedible material, and wastewater; reject unexplained netting or routing of solids into wastewater."
    source_ids:
      - ifc-poultry-processing-ehs-2007
      - ec-bat-slaughterhouses-2023
  - rule_id: validation_rule_allocation
    applies_to: "Multi-functional burdens"
    rule: "Require direct attribution before allocation, a documented reason for the selected allocation relationship, a complete output set, and allocation fractions summing to 1 within ±0.001."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_rule_mass_balance
    applies_to: "Material inventory"
    rule: "Require a documented mass-balance residual. Investigate a relative residual greater than 5% of accepted live mass; do not force closure by assigning the residual to the reference product or wastewater."
    source_ids:
      - mass-balance-identity
      - ifc-poultry-processing-ehs-2007
  - rule_id: validation_rule_energy_qa
    applies_to: "Total net energy"
    rule: "When a source-compatible cold-carcass basis is available, compare total net energy with the EU BAT screening interval of 170–490 kWh per tonne cold chicken carcass. Treat an outlier as a review trigger, not an automatic replacement value, and explain boundary or technology differences."
    source_ids:
      - ec-bat-slaughterhouses-2023
  - rule_id: validation_rule_wastewater_qa
    applies_to: "Wastewater discharge"
    rule: "When a source-compatible cold-carcass basis is available, compare wastewater discharge with 1.45–6.30 m3 per tonne cold chicken carcass. Treat an outlier as a review trigger and preserve separately discharged cooling water and stormwater distinctions."
    source_ids:
      - ec-bat-slaughterhouses-2023
  - rule_id: validation_rule_evidence
    applies_to: "Foreground package"
    rule: "Require source records, collection protocols, calculation inputs, calibration or reconciliation evidence, and explicit disclosure of missing or estimated fields. Reasoned-estimate ranges in this PCR are replaceable authoring aids and must not override collected foreground values."
    source_ids:
      - ec-bat-slaughterhouses-2023
published_dataset_profile:
  dataset_role: "Foreground production dataset that may be published as a secondary_dataset or background_dataset after review"
  downstream_use: "Construction of chicken-meat product systems, food-product footprints, supply-chain LCAs, process datasets, and lifecycle models requiring fresh or chilled chicken meat at a declared plant gate"
  allowed_use: "Use for the declared chicken product form, geography, technology, chilling route, packaging state, reporting period, and allocation method; adapt only with documented representativeness checks"
  excluded_use: "Frozen or further-prepared chicken products; live-chicken farming; edible offal as the reference product; retail, cooking, consumption, or packaging end of life; comparative claims across unlike product forms or allocation methods without harmonization"
  required_metadata: "Canonical PCR id; product and flow UUID; all reference-flow qualifiers; plant geography and technology; gate and boundary; reporting period; data coverage; product temperature specification; optional operations; upstream datasets; co-product and waste destinations; allocation method; source ids; review status"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; calibration status; missing-data treatment; yield and mass-balance residual; water balance; energy and wastewater source-basis comparisons; refrigerant method; allocation sensitivity; temporal, geographical, and technological limitations; all replaceable provisional estimates"
  update_trigger: "Material change in product form, chilling or packaging technology, plant boundary, supplier or geography, reporting period, throughput, energy or water system, refrigerant, treatment route, legal temperature or hygiene requirement, co-product market, allocation relationship, Tiangong identity reference, or stronger source evidence"
