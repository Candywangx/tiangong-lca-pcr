measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh saleable fresh or chilled chicken meat after chilling and the declared drainage period. Deduct packaging tare, free ice, containers, separately marketed offal, and separately marketed by-products. Normalize the completed inventory to 1 kg net reference product."
  - id: product_temperature
    applies_to: "Reference product at plant gate"
    required_property_ref:
      name: "Temperature"
      uuid: ""
    required_unit: "°C"
    rule: "Record product temperature using the applicable lot sampling plan. Use 4 °C or below as the default guideline for chilled poultry unless a stricter competent-authority or customer limit applies; retain the actual limit, measurement points, and exceptions."
  - id: water_uptake_disclosure
    applies_to: "Water-chilled product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "When immersion or spray chilling changes product mass, determine uptake from documented pre-chill and post-drain mass measurements and disclose the method. Do not hide retained water by changing the declared reference amount."
  - id: live_mass_basis
    applies_to: "Incoming live chickens"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg live weight"
    rule: "Record both bird count and measured net live weight by lot. Use mass, not bird count alone, for yield and mass-balance calculations."
  - id: energy_conversion
    applies_to: "Electricity, fuels, steam, heat, and refrigeration"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Preserve source meter units. Convert MJ to kWh by dividing by 3.6 and disclose lower- or higher-heating-value conventions for fuels. Do not combine purchased electricity and fuel energy until both are converted to the same net-energy basis."
  - id: water_volume_conversion
    applies_to: "Supplied water and wastewater"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Use metered volume; convert litres to cubic metres by dividing by 1,000. Keep separately discharged non-contact cooling water and stormwater distinct from process wastewater."
  - id: packaging_exclusion
    applies_to: "Reference product and packaging"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Packaging is excluded from reference-product mass and recorded as a separate input when primary packaging occurs before the declared plant gate."
  - id: normalization_denominator
    applies_to: "All foreground inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "per 1,000 kg reference product"
    rule: "Aggregate the declared reporting period first, then divide each flow by net conforming reference-product mass and multiply by 1,000. Do not normalize by total live-bird mass, total carcass mass, or total co-product output unless a source range explicitly uses that separate basis."
