allocation_rules:
  - rule_id: allocation_rule_subdivision
    applies_to: "Separately metered operations and outputs"
    rule: "Avoid allocation first by subdividing the process and assigning inputs, wastes, and emissions directly to chilling, cutting, packaging, wastewater treatment, or by-product operations when records support that distinction."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rule_system_expansion
    applies_to: "Multi-functional output systems"
    rule: "If the declared study goal permits system expansion and a representative substituted function is demonstrable, model and disclose the expanded system consistently. Do not apply an avoided-product credit merely because a residue has a possible use."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rule_physical
    applies_to: "Shared slaughter burdens after subdivision is exhausted"
    rule: "When system expansion is not used, prefer a relevant, quantified physical relationship that reflects how shared burdens arise. Document the selected relationship, included output streams, measurement period, and why it represents the process."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rule_other_relationship
    applies_to: "Shared burdens without a defensible physical relationship"
    rule: "If a physical relationship is not defensible, use another documented relationship such as site-specific economic value at the co-product split point. Report prices, currency, period, zero-value streams, and sensitivity to material price changes."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rule_waste_status
    applies_to: "Condemned or inedible outputs"
    rule: "Treat an output as waste unless its legal status, quality, purchaser or user, and actual destination demonstrate a product function. Waste treatment burdens remain with the system that generates the waste unless the selected method and study goal justify another treatment."
    source_ids:
      - ifc-poultry-processing-ehs-2007
      - codex-cxc-58-2005
  - rule_id: allocation_rule_closure
    applies_to: "All reference and co-product outputs"
    rule: "The allocation model must include reference meat, edible offal, blood, feet, feathers, fat, skin, other marketed streams, and waste status as applicable; allocation fractions for partitioned burdens must sum to 1 within rounding tolerance."
    source_ids:
      - ec-bat-slaughterhouses-2023
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
