      raw_fields: "lot_id; supplier_id; farm_origin; arrival_time; gross_vehicle_mass; tare_mass; net_live_mass; bird_count; dead_on_arrival_count; rejected_mass; accepted_mass; inspection_disposition"
      collection_method: "calibrated weighbridge or platform scale linked to receiving and inspection records"
      unit: "kg; item"
      frequency: "each incoming lot"
      temporal_coverage: "all lots in reporting period"
      site_scope: "all suppliers and receiving lines feeding the declared product"
      aggregation_rule: "sum accepted live mass and counts; keep rejected and dead-on-arrival streams separate"
      quality_evidence: "calibration certificate; lot log; inspection record; reconciliation to slaughter schedule"
    - protocol_id: cp_product_output_records
      process_id: "slaughter_chill_gate"
