system_boundary:
  rules:
    - rule_id: boundary_cradle_to_gate
      applies_to: "all datasets"
      rule: "Include upstream production and transport of the route-defining pineapple or concentrate and all material foreground processing through conforming packaged product at the final manufacturing gate."
      source_ids:
        - iso-14044-2006
        - del-rio-2020-pineapple-lca
        - environdec-pcr-2019-10
    - rule_id: boundary_route_specific
      applies_to: "direct and from-concentrate routes"
      rule: "Do not combine direct extraction and from-concentrate reconstitution into an undeclared generic recipe. Report route shares when a production mix is modelled."
      source_ids:
        - codex-cxs-247-2005
        - eu-directive-2012-12
    - rule_id: boundary_foreground_operations
      applies_to: "processing plant"
      rule: "Include receipt and sorting, washing and preparation, extraction and finishing when applicable, reconstitution or blending when applicable, preservation, filling, packaging, cleaning, wastewater, rejects, residues, and on-site utilities."
      source_ids:
        - fao-fruit-processing-1995
        - fao-fruit-juice-processing-2001
        - walker-et-al-2018
    - rule_id: boundary_downstream_exclusion
      applies_to: "default plant-gate dataset"
      rule: "Exclude distribution, retail, consumer storage or use, and packaging end-of-life unless the study explicitly adds and labels those scenarios."
      source_ids:
        - iso-14044-2006
        - environdec-pcr-2019-10
