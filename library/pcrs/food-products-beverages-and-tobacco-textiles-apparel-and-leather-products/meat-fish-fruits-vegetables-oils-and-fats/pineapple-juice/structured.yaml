allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared processes and utilities"
    rule: "First avoid allocation through process subdivision, separate metering, batch records, and route-specific mass and energy balances."
    source_ids:
      - iso-14044-2006
      - walker-et-al-2018
  - rule_id: allocation_internal_recycling
    applies_to: "internally reused juice, water, or residues"
    rule: "Keep internal recycling within the foreground system. Record any additional treatment, pumping, and losses, but do not create a second saleable output or avoided burden."
    source_ids:
      - iso-14044-2006
      - walker-et-al-2018
  - rule_id: allocation_residue_status
    applies_to: "crowns, peels, cores, pulp, rejects, and sludge"
    rule: "Declare each stream as waste, co-product, or internally recycled material using its actual legal and commercial status and treatment route. Do not assign co-product credit to an unmarketed waste stream."
    source_ids:
      - iso-14044-2006
      - del-rio-2020-pineapple-lca
  - rule_id: allocation_physical_then_economic
    applies_to: "unavoidable multi-output processes"
    rule: "When subdivision cannot resolve shared burdens, use a documented physical causal relation where one exists. If no defensible physical relation exists, use a documented economic relation based on a representative reporting-period average and report a sensitivity case."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_route_mix
    applies_to: "production-mix datasets"
    rule: "Calculate direct-route and from-concentrate-route inventories separately, then combine them using measured conforming output shares for the declared period."
    source_ids:
      - codex-cxs-247-2005
      - eu-directive-2012-12
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "fruit_or_concentrate_receipt_juice_extraction"
      flow_role: "starting material, accepted material, intermediates, and residues"
      record_type: "weighbridge, calibrated scale, tank, and batch records"
      raw_fields: "lot id; route; material name; gross mass; reject mass; transfer mass; density and temperature if volume-derived"
      collection_method: "direct weighing or calibrated tank measurement"
      unit: "kg"
      frequency: "each lot or batch"
      temporal_coverage: "full declared production period"
      site_scope: "every included site and route"
      aggregation_rule: "sum by material and route; reconcile opening and closing inventories"
      quality_evidence: "calibration records; batch tickets; inventory reconciliation"
    - protocol_id: cp_transport_records
      process_id: "fruit_or_concentrate_receipt"
      flow_role: "incoming transport"
      record_type: "supplier dispatch and freight records"
      raw_fields: "material; shipped mass; origin; destination; distance; mode; vehicle; load factor; empty return"
      collection_method: "document review and route calculation"
      unit: "kg, km, tkm"
      frequency: "each shipment or representative route with coverage stated"
      temporal_coverage: "full declared production period"
      site_scope: "all material incoming routes"
      aggregation_rule: "mass-weighted tkm by material and mode"
      quality_evidence: "invoices; delivery notes; route evidence"
    - protocol_id: cp_water_records
      process_id: "fruit_or_concentrate_receipt_cleaning_and_residuals"
      flow_role: "washing, cleaning, cooling, and incorporated water"
      record_type: "meters, tank records, and utility bills"
      raw_fields: "meter id; opening and closing readings; reuse; purpose; downtime; production output"
      collection_method: "calibrated meter preferred; documented balance otherwise"
      unit: "kg or m3"
      frequency: "continuous or each shift; monthly reconciliation"
      temporal_coverage: "full declared production period"
      site_scope: "each site and major water circuit"
      aggregation_rule: "withdrawal minus measured reuse, normalized to conforming output"
      quality_evidence: "meter calibration; bill reconciliation; water balance"
    - protocol_id: cp_energy_records
      process_id: "juice_extraction_preservation_and_packaging"
      flow_role: "electricity, fuel, steam, heat, and refrigeration"
      record_type: "submeters, main meters, fuel invoices, and equipment logs"
      raw_fields: "carrier; quantity; unit; meter; process; operating time; conversion factor; losses"
      collection_method: "submetering preferred; documented allocation if shared"
      unit: "kWh, MJ, and supplier unit"
      frequency: "continuous or each shift; monthly reconciliation"
      temporal_coverage: "full declared production period"
      site_scope: "each site and route"
      aggregation_rule: "sum by carrier and process; normalize to conforming output"
      quality_evidence: "meter calibration; invoices; conversion-factor source"
    - protocol_id: cp_batch_formulation
      process_id: "reconstitution_and_blending"
      flow_role: "juice base, water, permitted inputs, samples, and output"
      record_type: "formulation sheet and batch tank records"
      raw_fields: "batch id; route; ingredient identity; input mass; Brix; temperature; output mass; samples; spills; hold-up"
      collection_method: "batch weighing and quality-control measurement"
      unit: "kg and degrees Brix"
      frequency: "every batch"
      temporal_coverage: "full declared production period"
      site_scope: "all formulation tanks and routes"
      aggregation_rule: "reconcile batch inputs, output, losses, and inventory"
      quality_evidence: "signed batch sheet; refractometer calibration; release result"
    - protocol_id: cp_packaging_records
      process_id: "preservation_and_packaging"
      flow_role: "packaging components"
      record_type: "issue, purchase, return, and production records"
      raw_fields: "component; material; unit mass; issued count; returned count; rejected count; net product mass"
      collection_method: "component weighing plus inventory reconciliation"
      unit: "kg and count"
      frequency: "each packaging run; monthly reconciliation"
      temporal_coverage: "full declared production period"
      site_scope: "every packaging format and site"
      aggregation_rule: "net component mass divided by conforming net juice"
      quality_evidence: "supplier specification; scale calibration; stock reconciliation"
    - protocol_id: cp_final_product_release
      process_id: "preservation_and_packaging"
      flow_role: "conforming final juice"
      record_type: "filler, checkweigher, tank, and release records"
      raw_fields: "lot; package count; net fill; bulk mass; nonconforming mass; route; Brix; preservation; storage requirement"
      collection_method: "calibrated mass measurement and quality release"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full declared production period"
      site_scope: "every included line, route, and format"
      aggregation_rule: "sum only conforming net juice; exclude packaging"
      quality_evidence: "checkweigher and scale calibration; signed release record"
    - protocol_id: cp_cleaning_records
      process_id: "cleaning_and_residuals"
      flow_role: "cleaning chemicals and cycles"
      record_type: "chemical issue, concentration, and cleaning schedule records"
      raw_fields: "chemical; formulation; concentration; issued quantity; return; cycle; equipment; date"
      collection_method: "inventory difference and dosing records"
      unit: "kg"
      frequency: "each cleaning cycle; monthly reconciliation"
      temporal_coverage: "full declared production period"
      site_scope: "all included cleaning circuits"
      aggregation_rule: "sum net chemical use by process; normalize to conforming output"
      quality_evidence: "stock reconciliation; dosing calibration; sanitation log"
    - protocol_id: cp_wastewater_records
      process_id: "cleaning_and_residuals"
      flow_role: "wastewater and treatment residuals"
      record_type: "discharge meter, laboratory analysis, hauler, and treatment records"
      raw_fields: "volume or mass; source; destination; COD or other measured load; sludge mass; dry matter; treatment"
      collection_method: "direct meter and laboratory measurement preferred; documented water balance otherwise"
      unit: "kg, m3, and concentration unit"
      frequency: "continuous or each discharge; periodic analysis"
      temporal_coverage: "full declared production period"
      site_scope: "each outfall and treatment route"
      aggregation_rule: "sum by destination; retain concentration and load separately"
      quality_evidence: "meter calibration; laboratory report; treatment or hauler receipt"
    - protocol_id: cp_residual_records
      process_id: "all_foreground_processes"
      flow_role: "rejects, residues, spills, and packaging waste"
      record_type: "scales, bins, stock movement, sale, and waste transfer records"
      raw_fields: "stream; source process; wet mass; dry matter; destination; legal status; revenue if co-product"
      collection_method: "direct weighing and destination documentation"
      unit: "kg"
      frequency: "each removal or shift; monthly reconciliation"
      temporal_coverage: "full declared production period"
      site_scope: "all included sites and residual routes"
      aggregation_rule: "sum by stream and destination; prevent double counting"
      quality_evidence: "scale calibration; transfer note; sale or treatment receipt"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "every foreground inventory amount"
      rule: "normalized amount = reporting-period amount / reporting-period conforming net pineapple juice mass"
      inputs:
        - "collected amount"
        - "conforming net juice mass"
      output: "amount per 1 kg reference flow"
      source_ids:
        - iso-14044-2006
    - id: calc_transport_tkm
      applies_to: "incoming and outgoing transport"
      rule: "tkm = transported mass in tonnes x loaded one-way distance in kilometres, plus separately modelled empty return when applicable"
      inputs:
        - "shipment mass"
        - distance
        - mode
        - "return assumption"
      output: "tkm per 1 kg reference flow"
      source_ids:
        - del-rio-2020-pineapple-lca
    - id: calc_route_mix
      applies_to: "production-mix dataset"
      rule: "mixed inventory = sum of route-specific normalized inventories x measured route share of conforming output"
      inputs:
        - "direct-route output"
        - "from-concentrate output"
        - "route inventories"
      output: "declared production-mix inventory"
      source_ids:
        - codex-cxs-247-2005
        - eu-directive-2012-12
    - id: calc_batch_mass_balance
      applies_to: "extraction and formulation"
      rule: "input mass + opening inventory = output mass + closing inventory + measured residues + rejects + samples + spills + other losses"
      inputs:
        - "batch and inventory records"
      output: "closure ratio and unexplained loss"
      source_ids:
        - walker-et-al-2018
    - id: calc_water_balance
      applies_to: "plant water"
      rule: "withdrawal + water in inputs = incorporated water + wastewater + evaporation + water in products and residues + inventory change; report unresolved difference"
      inputs:
        - "water meters"
        - formulation
        - wastewater
        - "evaporation estimate"
        - "output mass"
      output: "water balance per period and normalized water rows"
      source_ids:
        - walker-et-al-2018
    - id: calc_shared_utility_allocation
      applies_to: "shared energy and water"
      rule: "allocate only after subdivision and metering have been attempted; use a measured causal driver such as operating time, throughput, or thermal duty and disclose the driver"
      inputs:
        - "facility total"
        - "submeter data"
        - "operating driver"
        - "route output"
      output: "process- and route-specific utility amount"
      source_ids:
        - iso-14044-2006
        - walker-et-al-2018
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every released lot"
      requirement: "Retain product name, pineapple identity, direct or from-concentrate route, juice form, preservation technology, packaging format, measured Brix, and storage requirement."
      evidence: "release specification; batch record; label or product description"
    - id: dq_temporal
      applies_to: "foreground inventory"
      requirement: "Cover a representative continuous production period or complete seasonal campaign and disclose shutdowns, start-ups, abnormal batches, and any extrapolation."
      evidence: "dated meter, production, purchase, and waste records"
    - id: dq_geography
      applies_to: "upstream and foreground data"
      requirement: "Identify plant location, pineapple or concentrate origin, transport routes, electricity market, water source, and treatment destinations."
      evidence: "supplier record; route evidence; utility contract; treatment receipt"
    - id: dq_technology
      applies_to: "process and utilities"
      requirement: "Identify extraction, finishing, preservation, filling, cooling, refrigeration, water-reuse, and wastewater-treatment technologies that materially affect flows."
      evidence: "equipment list; process diagram; operating records"
    - id: dq_completeness
      applies_to: "required process map"
      requirement: "Provide records for every required process and every applicable conditional process; explain verified zeros and all gaps."
      evidence: "process-to-record coverage matrix"
    - id: dq_mass_balance
      applies_to: "fruit, concentrate, juice, residues, and packaging"
      requirement: "Reconcile inputs, outputs, inventories, samples, spills, rejects, and residues. Treat any screening tolerance as provisional until reviewed against site measurement uncertainty."
      evidence: "signed mass-balance worksheet; calibration evidence"
    - id: dq_source_traceability
      applies_to: "secondary and proxy data"
      requirement: "Record dataset identity, geography, technology, time, version, mapping rationale, and substitution limits."
      evidence: "dataset metadata and source register"
    - id: dq_reasoned_estimates
      applies_to: "all provisional ranges"
      requirement: "Use reasoned_estimate ranges only for screening. Do not silently replace foreground records, and list each estimate remaining in a shared or published dataset."
      evidence: "validation report and unresolved-evidence register"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require the exact pineapple-juice product UUID, Mass flow-property UUID, Units-of-mass UUID, 1 kg net reference amount, and all required qualifiers."
    source_ids:
      - codex-cxs-247-2005
      - eu-directive-2012-12
  - rule_id: validate_route_declaration
    applies_to: "all datasets"
    rule: "Require exactly one declared route or a measured route mix with separately calculated direct and from-concentrate inventories."
    source_ids:
      - codex-cxs-247-2005
      - eu-directive-2012-12
  - rule_id: validate_brix
    applies_to: "released product"
    rule: "Require lot-level Brix result, measurement temperature or correction, instrument calibration, and comparison with the applicable product specification. For reconstituted juice use 12.8 degrees Brix at 20 degrees C unless a documented applicable authenticity provision applies."
    source_ids:
      - codex-cxs-247-2005
      - eu-directive-2012-12
  - rule_id: validate_process_coverage
    applies_to: "process map"
    rule: "Require all required processes and every applicable conditional process; a zero flow needs a record-backed explanation."
    source_ids:
      - fao-fruit-processing-1995
      - walker-et-al-2018
  - rule_id: validate_mass_and_water_balance
    applies_to: "foreground package"
    rule: "Require route-specific material and water balances with all inventory changes, residues, samples, spills, incorporated water, wastewater, and unexplained differences disclosed."
    source_ids:
      - walker-et-al-2018
  - rule_id: validate_energy_separation
    applies_to: "utilities"
    rule: "Require electricity and thermal carriers to remain separate, with original units, conversion factors, meter coverage, and allocation drivers disclosed."
    source_ids:
      - walker-et-al-2018
  - rule_id: validate_packaging
    applies_to: "packaged product"
    rule: "Require packaging by component and material while excluding packaging from the 1 kg net reference mass."
    source_ids:
      - environdec-pcr-2019-10
      - del-rio-2020-pineapple-lca
  - rule_id: validate_residual_fate
    applies_to: "rejects, pineapple residues, wastewater, and sludge"
    rule: "Require mass, destination, treatment, internal recycling, and waste or co-product status; prohibit simultaneous waste treatment and co-product credit for the same quantity."
    source_ids:
      - iso-14044-2006
      - del-rio-2020-pineapple-lca
  - rule_id: validate_allocation
    applies_to: "shared or multi-output processes"
    rule: "Require evidence that subdivision or direct measurement was attempted, the chosen relation and reporting period, route-share basis, and a sensitivity case when economic allocation is used."
    source_ids:
      - iso-14044-2006
      - walker-et-al-2018
  - rule_id: validate_evidence_status
    applies_to: "quantitative guidance"
    rule: "Reject an unlabeled inferred range. Preserve reasoned_estimate as provisional screening guidance and list unresolved identity or range-evidence gaps."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground product-system data package for pineapple juice production at the final manufacturing plant gate"
  downstream_use: "secondary_dataset; background_dataset after methodology and data-quality review"
  allowed_use: "Route-specific or measured production-mix cradle-to-gate LCI; supply-chain hotspot analysis; verified environmental declarations when the applicable programme rules and downstream stages are also satisfied"
  excluded_use: "Pineapple nectar, mixed juice, fruit drinks, fermented beverages, concentrate as the sold product, or a consumer/distribution claim without explicit downstream modelling"
  required_metadata: "Reference UUIDs; route and route share; variety or source identity; Brix and measurement basis; preservation and packaging technology; net fill; storage requirement; geography; period; upstream dataset identities; allocation; waste and co-product fates"
  required_quality_disclosure: "Meter and record coverage; calibration; mass and water balance; shared-utility allocation; proxy datasets; data gaps; verified zeros; every remaining reasoned_estimate; review status"
  update_trigger: "Material change in fruit or concentrate sourcing, route share, formulation, extraction yield, preservation or filling technology, energy or water system, packaging, waste or co-product fate, allocation basis, product specification, or governing source"
data_sources:
  - id: "codex-cxs-247-2005"
    type: "standard"
    reference: "FAO and WHO, Codex Alimentarius Commission. General Standard for Fruit Juices and Nectars, CXS 247-2005, adopted 2005 and amended through 2025. https://openknowledge.fao.org/handle/20.500.14283/cd9081en (retrieved 2026-08-11)"
    used_for: "Pineapple-juice identity; direct and reconstituted routes; permitted processing and components; authenticity and quality verification; 12.8 degrees Brix pineapple reference"
  - id: "eu-directive-2012-12"
    type: "standard"
    reference: "Directive 2012/12/EU amending Directive 2001/112/EC relating to fruit juices and certain similar products. CELEX 32012L0012. https://eur-lex.europa.eu/eli/dir/2012/12/oj/eng (retrieved 2026-08-11)"
    used_for: "Legal juice and from-concentrate definitions; permitted ingredients and treatments; direct-juice Brix rule; 12.8 degrees Brix for reconstituted pineapple juice"
  - id: "fao-fruit-processing-1995"
    type: "handbook"
    reference: "FAO. Fruit and Vegetable Processing, Appendix I: Fruit and vegetable processing flow-sheets, Agricultural Services Bulletin 119, 1995. https://www.fao.org/4/V5030E/V5030E0y.htm (retrieved 2026-08-11)"
    used_for: "Pineapple-juice process decomposition; pineapple starting materials; shredding, extraction, finishing, blending, pasteurization, filling, cooling, and packaging"
  - id: "fao-fruit-juice-processing-2001"
    type: "handbook"
    reference: "Bates, R.P., Morris, J.R., and Crandall, P.G. Principles and Practices of Small- and Medium-scale Fruit Juice Processing. FAO Agricultural Services Bulletin 146, 2001. https://www.fao.org/4/y2515e/y2515e00.htm (retrieved 2026-08-11)"
    used_for: "Fruit selection and washing; extraction and finishing; pasteurization; filling; cooling; packaging; cleaning and process design"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management - Life cycle assessment - Requirements and guidelines, with Amendments 1:2017 and 2:2020; confirmed current in 2022. https://www.iso.org/standard/38498.html (retrieved 2026-08-11)"
    used_for: "Goal and scope, inventory, interpretation, reporting, review, allocation hierarchy, and source-traceability framework"
  - id: "walker-et-al-2018"
    type: "literature"
    reference: "Walker, C., Beretta, C., Sanjuan, N., and Hellweg, S. Calculating the energy and water use in food processing and assessing the resulting impacts. International Journal of Life Cycle Assessment 23 (2018), 824-839. DOI: 10.1007/s11367-017-1327-6"
    used_for: "Process-specific energy and water measurement; food-loss and operating data; cleaning records; facility reconciliation; documented allocation of shared facility data"
  - id: "del-rio-2020-pineapple-lca"
    type: "literature"
    reference: "Del Rio, D.D.F. et al. Environmental Impacts Associated to Different Stages Spanning from Harvesting to Industrialization of Pineapple through Life Cycle Assessment. Applied Sciences 10 (2020), 7007. DOI: 10.3390/app10197007"
    used_for: "Cradle-to-gate pineapple boundary; fruit receipt, washing, preparation and packaging; electricity, water, fuel, transport, residual, effluent, and supplier/foreground-data collection needs"
  - id: "environdec-pcr-2019-10"
    type: "official_guidance"
    reference: "International EPD System. PCR 2019:10, Prepared and preserved vegetable and fruit products, including juice, version 2.0, valid until 2027-03-29. https://www.environdec.com/pcr-library/pcr2019-10 (retrieved 2026-08-11)"
    used_for: "Category applicability to CPC 214 products including juice; packaging and downstream environmental-declaration context; no inaccessible document text used as a quantitative source"
