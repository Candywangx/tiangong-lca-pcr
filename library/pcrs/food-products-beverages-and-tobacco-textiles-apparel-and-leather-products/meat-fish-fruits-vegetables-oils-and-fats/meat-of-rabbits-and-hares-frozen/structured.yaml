        - unsd-cpc-21134
        - eu-pef-2021-2279
    - rule_id: boundary_recursive_input
      applies_to: "purchased CPC 21134 input"
      rule: "If frozen rabbit or hare meat is purchased as an input, record that single product input and link its documented upstream dataset; do not recursively recreate its slaughter and freezing inventory inside the receiving process."
