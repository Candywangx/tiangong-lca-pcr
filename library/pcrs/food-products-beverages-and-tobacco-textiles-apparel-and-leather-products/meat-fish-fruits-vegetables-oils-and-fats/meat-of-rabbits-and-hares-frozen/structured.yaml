allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "multi-output foreground processes"
    rule: "First avoid allocation through process subdivision, species-separated records, and direct assignment of utilities, chemicals, packaging, wastes, and emissions to the operation that causes them."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_species
    applies_to: "rabbit and hare production"
    rule: "Do not transfer rabbit burdens to hare output or hare burdens to rabbit output when species-specific measured records are available; disclose any shared-service allocation between species."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_output_status
    applies_to: "blood, skins, organs, fat, bones, and trimmings"
    rule: "Determine the product, co-product, or waste status of each segregated output from its documented quality, destination, and contractual disposition; do not infer a useful co-product solely from its physical presence."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relation
    applies_to: "unavoidable co-product allocation"
    rule: "Where subdivision cannot avoid allocation, use a documented underlying physical relationship that reflects how inputs and outputs change; do not select mass merely because mass data are available."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_relation
    applies_to: "co-products without a defensible physical relation"
    rule: "Use an economic relationship only when a defensible physical relationship cannot be established, and retain the price source, averaging period, currency basis, market, and sensitivity disclosure."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_treatment
    applies_to: "waste outputs and treatment"
    rule: "Assign collection, handling, and treatment burdens to each documented waste destination once; apply no avoided-burden credit unless the selected study method explicitly requires it and the assumption is disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_services
    applies_to: "shared water, energy, refrigeration, sanitation, and wastewater services"
    rule: "Prefer submetering or operational logs; otherwise use a documented causal driver such as operating time, cleaned area, thermal load, wastewater volume, or product mass only where that driver represents consumption."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: allocation_disclosure
    applies_to: "reported dataset"
    rule: "Report the allocation hierarchy, equations, drivers, values, co-product destinations, unresolved data gaps, and sensitivity results so that no measured input or output is counted twice or omitted."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_live_animal_receipt
      process_id: "live_animal_receipt"
      flow_role: "live rabbit, live hare, accepted animals, arrival losses, and holding balance"
      record_type: "supplier, receipt, weighbridge, holding, and mortality records"
      raw_fields: "species; supplier; origin; lot; arrival time; animal count; gross mass; tare; accepted mass; rejected mass; mortality; opening and closing holding inventory"
      collection_method: "weigh each lot with calibrated equipment and reconcile acceptance and holding records by species"
      unit: "kg; animal"
      frequency: "each received lot"
      temporal_coverage: "complete reporting period including opening and closing holding inventory"
      site_scope: "all receipt and holding areas serving the represented facility"
      aggregation_rule: "sum by species and lot, then normalize once to net released reference mass"
      quality_evidence: "calibration records, signed receipts, rejection records, mortality logs, and inventory reconciliation"
    - protocol_id: cp_slaughter_byproduct_balance
      process_id: "slaughter_dressing"
      flow_role: "accepted animals, dressed carcasses, blood, skins, organs, fat, stomach contents, intestinal contents, and condemned carcasses"
      record_type: "batch production, inspection, weighing, and destination records"
      raw_fields: "species; lot; accepted live mass; carcass mass; output identity; output mass; quality status; destination; opening and closing inventory; purge or moisture change"
      collection_method: "weigh segregated outputs by species and close one lot or period mass balance without a fabricated balancing item"
      unit: "kg"
      frequency: "each slaughter lot or production shift"
      temporal_coverage: "complete reporting period"
      site_scope: "all slaughter, bleeding, skinning, evisceration, inspection, and dressing lines in scope"
      aggregation_rule: "sum species-specific measured masses and retain every documented destination before normalization"
      quality_evidence: "scale calibration, batch sheets, veterinary or quality disposition, destination tickets, and signed mass balance"
    - protocol_id: cp_cutting_mass_balance
      process_id: "carcass_cutting"
      flow_role: "carcasses, meat cuts, bones, cutting fat, trimmings, and rejected meat"
      record_type: "cutting batch, weighing, yield, rejection, and inventory records"
      raw_fields: "species; lot; carcass input; cut output; bone; fat; trimming; reject; opening and closing inventory; purge"
      collection_method: "weigh each segregated stream and reconcile measured inputs, outputs, inventory, and documented purge"
      unit: "kg"
      frequency: "each cutting lot or shift"
      temporal_coverage: "complete reporting period"
      site_scope: "all trimming, deboning, portioning, and cutting operations in scope"
      aggregation_rule: "sum by species and output identity before normalization"
      quality_evidence: "calibrated scale records, cutting sheets, yield reconciliation, and disposition records"
    - protocol_id: cp_freezing_transfer
      process_id: "chilling_freezing"
      flow_role: "meat entering cooling, frozen meat output, and off-specification frozen meat"
      record_type: "cold-process batch, transfer, temperature, time, mass, and rejection records"
      raw_fields: "species; lot; input mass; output mass; reject mass; cooling start and end; freezing start and end; measured product temperature; opening and closing inventory"
      collection_method: "link calibrated mass records to retained time and temperature records for each represented cold-process lot"
      unit: "kg; degree Celsius; hour"
      frequency: "each freezing lot"
      temporal_coverage: "complete reporting period including cold-store inventory change"
      site_scope: "all pre-chilling and freezing equipment in scope"
      aggregation_rule: "sum mass by species; retain actual time and temperature descriptors without imposing a category default"
      quality_evidence: "calibrated scales and sensors, batch logs, alarm logs, and inventory reconciliation"
    - protocol_id: cp_packaging_release
      process_id: "packaging_frozen_storage"
      flow_role: "frozen meat transfer, each packaging component, reference output, and packaged rejects"
      record_type: "packing order, material issue, tare, release, dispatch, and frozen-store records"
      raw_fields: "species; lot; product form; input mass; package component identity; component mass; package count; tare; net released mass; reject mass; storage time; release status"
      collection_method: "measure net product after tare deduction, record every component separately, and reconcile packing and frozen-store inventory"
      unit: "kg; package; hour"
      frequency: "each packing and release lot"
      temporal_coverage: "complete reporting period including opening and closing frozen inventory"
      site_scope: "all final packing, bulk dispatch, frozen storage, and release points in scope"
      aggregation_rule: "sum component and product masses separately; normalize reference output to exactly 1 kg net meat"
      quality_evidence: "material issue records, packaging specifications, scale calibration, release certificates, dispatch records, and stock reconciliation"
    - protocol_id: cp_water_records
      process_id: "all_foreground_processes"
      flow_role: "mains water, groundwater withdrawal, and surface-water withdrawal by process"
      record_type: "meter, invoice, withdrawal, and submeter records"
      raw_fields: "source identity; meter identity; opening and closing reading; volume; process coverage; reading time; allocation driver; calibration status"
      collection_method: "read each source meter and submeter, prevent supply-withdrawal duplication, and assign shared volume with a documented causal driver"
      unit: "m3"
      frequency: "at least each reporting interval and whenever process assignment changes"
      temporal_coverage: "complete reporting period with opening and closing readings"
      site_scope: "all meters and withdrawals serving the foreground boundary"
      aggregation_rule: "difference readings by source and process, subtract documented non-production use, then normalize once"
      quality_evidence: "meter calibration, invoices, permits, logs, and allocation workbook"
    - protocol_id: cp_utility_records
      process_id: "all_foreground_processes"
      flow_role: "grid electricity, purchased steam, purchased hot water, natural gas, diesel, and LPG by process"
      record_type: "meter, invoice, delivery, tank, boiler, and operational records"
      raw_fields: "carrier identity; supplier; meter or tank identity; measured quantity; unit; supply conditions; heating value; opening and closing inventory; process coverage; allocation driver"
      collection_method: "collect each carrier separately, reconcile purchases and inventory, and calculate energy only with retained supplier data or measured conditions"
      unit: "kWh for electricity; MJ for steam, hot water, and fuels"
      frequency: "each meter interval, delivery, or production shift as available"
      temporal_coverage: "complete reporting period with opening and closing inventory"
      site_scope: "all utility points serving each foreground process"
      aggregation_rule: "sum each carrier separately by process and use a documented causal allocation for shared meters"
      quality_evidence: "calibration, invoices, delivery notes, supplier heating values, meter logs, and allocation workbook"
    - protocol_id: cp_refrigerant_records
      process_id: "cold_chain_processes"
      flow_role: "R-717, HFC-134a, and R-404A make-up plus ammonia, HFC-134a, HFC-125, and HFC-143a emissions"
      record_type: "refrigerant purchase, service, charge, recovery, leak, and inventory records"
      raw_fields: "equipment; process served; refrigerant product; chemical composition; opening charge; additions; removals; recovered mass; closing charge; leak event; service date; technician"
      collection_method: "close an equipment-level mass balance, retain actual blend composition, and assign make-up and emitted species separately to the cold process served"
      unit: "kg"
      frequency: "each service or leak event and at reporting-period boundaries"
      temporal_coverage: "complete reporting period with opening and closing charge"
      site_scope: "all refrigeration equipment serving pre-chilling, freezing, and frozen storage"
      aggregation_rule: "sum by refrigerant product, emitted chemical species, equipment, and process without double counting recovered material"
      quality_evidence: "purchase invoices, service logs, leak tests, recovery tickets, composition specification, and signed balance"
    - protocol_id: cp_cleaning_chemical_records
      process_id: "sanitation_wastewater"
      flow_role: "each cleaning, disinfection, and wastewater-treatment chemical"
      record_type: "chemical issue, purchase, formulation, concentration, and use records"
      raw_fields: "chemical identity; supplier; commercial-product mass; active concentration; batch; use point; date; opening and closing inventory; returned mass"
      collection_method: "record each commercial chemical separately and reconcile issued mass with inventory and returns"
      unit: "kg"
      frequency: "each issue or preparation batch"
      temporal_coverage: "complete reporting period with opening and closing stock"
      site_scope: "all cleaning, disinfection, and conditional on-site treatment points"
      aggregation_rule: "sum by single chemical identity and use point before process assignment and normalization"
      quality_evidence: "safety data sheet, purchase invoice, issue log, concentration record, and stock reconciliation"
    - protocol_id: cp_waste_records
      process_id: "all_foreground_processes"
      flow_role: "each species-specific or material-specific waste stream and destination"
      record_type: "weighing, rejection, container, transfer, recovery, and treatment records"
      raw_fields: "row identity; species or material; lot; mass; container tare; quality status; destination; carrier; treatment route; transfer date; document number"
      collection_method: "weigh each stream separately, deduct tare, and assign its documented destination exactly once"
      unit: "kg"
      frequency: "each waste transfer or production lot"
      temporal_coverage: "complete reporting period"
      site_scope: "all waste generation and dispatch points within the foreground boundary"
      aggregation_rule: "sum by row identity, species or material, and destination; prevent transfer and treatment duplication"
      quality_evidence: "calibrated scale, rejection record, transfer note, treatment receipt, and destination reconciliation"
    - protocol_id: cp_wastewater_records
      process_id: "sanitation_wastewater"
      flow_role: "ordinary-strength wastewater, high-strength wastewater, sludge, screen residue, separated fat, and direct water pollutants"
      record_type: "flowmeter, sampling, laboratory, sludge, screening, grease-separation, sewer-transfer, and discharge records"
      raw_fields: "stream identity; destination; discharge status; volume; sampling point; sampling time; sampling method; concentration; analyte; unit; sludge mass; residue mass; species identity for separated fat"
      collection_method: "meter segregated wastewater, use representative measured concentrations, weigh solids, and distinguish sewer transfer from direct environmental discharge"
      unit: "m3; kg; concentration unit retained"
      frequency: "continuous or each discharge interval for flow and according to the documented representative sampling plan for concentration"
      temporal_coverage: "complete reporting period including bypasses and abnormal events"
      site_scope: "all wastewater collection, treatment, sewer-transfer, and direct-discharge points in scope"
      aggregation_rule: "calculate each pollutant separately from compatible volume and concentration records; report direct emissions only for direct discharge"
      quality_evidence: "meter calibration, sampling plan, chain of custody, accredited or documented laboratory results, discharge permit, and mass reconciliation"
    - protocol_id: cp_direct_air_emissions
      process_id: "all_foreground_processes"
      flow_role: "each direct combustion substance emitted to air by process"
      record_type: "fuel, equipment, stack-test, continuous-monitoring, operating-hour, and verified-factor records"
      raw_fields: "process served; equipment; fuel identity; fuel quantity; operating time; substance; measured concentration or verified factor; exhaust flow; test period; unit"
      collection_method: "use direct measurement where representative; otherwise calculate each substance separately from collected fuel or activity data and a retained verified factor"
      unit: "kg"
      frequency: "each representative test or monitoring interval and each fuel-reporting interval"
      temporal_coverage: "complete reporting period including abnormal operation"
      site_scope: "all on-site combustion equipment serving the foreground processes"
      aggregation_rule: "sum each chemical species by process and equipment; do not merge NO with NO2 or fine with coarse particulate matter"
      quality_evidence: "calibration, test report, monitoring log, fuel record, verified factor source, and calculation workbook"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized exchange = attributable foreground exchange for the reporting period divided by net conforming frozen meat released in the same period; the reference output itself is fixed at 1 kg"
      inputs:
        - "attributable exchange"
        - "net conforming released mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_reconciliation
      applies_to: "receipt, slaughter, cutting, freezing, and packing mass balances"
      rule: "mass-balance difference = measured inputs plus opening inventory minus measured products, co-products, wastes, closing inventory, and documented moisture or purge change; investigate rather than fabricate an unmeasured balancing exchange"
      inputs:
        - "measured masses"
        - "opening and closing inventory"
        - "documented purge or moisture change"
      output: "species-specific mass-balance difference and reconciliation status"
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - id: calc_delivered_thermal_energy
      applies_to: "purchased steam and purchased hot water"
      rule: "use metered delivered energy where available; otherwise calculate energy from measured delivered quantity and retained supply conditions using a documented engineering relation"
      inputs:
        - "measured steam mass or water flow"
        - "supply pressure or temperature"
        - "return temperature where relevant"
        - "documented relation"
      output: "delivered energy in MJ for one carrier"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_fuel_energy
      applies_to: "natural gas, diesel, and LPG"
      rule: "fuel energy = measured fuel quantity multiplied by the retained supplier heating value after unit conversion; keep each fuel separate"
      inputs:
        - "measured fuel quantity"
        - "supplier heating value"
        - "unit conversion"
      output: "energy in MJ for one fuel"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_refrigerant_balance
      applies_to: "refrigerant make-up and chemical-specific air emissions"
      rule: "close each equipment mass balance from opening charge, purchases or additions, removals, recovered mass, and closing charge; allocate an evidenced loss to its refrigerant product and calculate each emitted chemical species only from retained actual composition"
      inputs:
        - "opening and closing charge"
        - additions
        - removals
        - recovery
        - "leak records"
        - "actual composition"
      output: "make-up mass by refrigerant product and emitted mass by chemical species"
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - id: calc_wastewater_pollutant_load
      applies_to: "direct water emissions"
      rule: "pollutant load = metered direct-discharge volume multiplied by representative measured concentration after compatible unit conversion; subtract intake background only when paired representative measurements and the selected method justify it"
      inputs:
        - "direct-discharge volume"
        - "measured concentration"
        - "unit conversion"
        - "paired intake result if used"
      output: "mass of one pollutant directly discharged to water"
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - id: calc_shared_service_assignment
      applies_to: "shared meters and support services"
      rule: "assign the measured shared total first by direct submeter data and otherwise by one documented causal driver whose totals reconcile to the shared record; retain the unrounded calculation"
      inputs:
        - "shared measured total"
        - "submeter records or causal-driver values"
        - "process coverage"
      output: "attributable amount for one process and one atomic exchange"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_company_specific
      applies_to: "foreground manufacturing inventory"
      requirement: "Use company-specific facility, lot, meter, invoice, service, laboratory, and production records for the represented reporting period."
      evidence: "record register with owner, date, system of origin, and retained record reference"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use one coherent reporting period that captures normal production, shutdowns, abnormal events, and opening and closing inventory; disclose substitutions or gaps."
      evidence: "reporting calendar, production log, downtime log, and inventory reconciliation"
    - id: dq_geographic
      applies_to: "site and upstream links"
      requirement: "Declare facility geography, water sources, electricity supply geography, fuel suppliers, waste destinations, and direct discharge receiving environment."
      evidence: "site metadata, supplier records, utility contracts, permits, and destination documents"
    - id: dq_technology
      applies_to: "slaughter, cutting, freezing, refrigeration, sanitation, and wastewater treatment"
      requirement: "Document the actual equipment and operations represented, including product form, freezing equipment, refrigerant identity, cleaning practice, and on-site treatment status."
      evidence: "process map, equipment register, refrigerant register, work instructions, and treatment description"
    - id: dq_completeness
      applies_to: "life-cycle inventory"
      requirement: "Reconcile the atomic card register to purchase, production, maintenance, laboratory, waste, and discharge records; list every missing card record as an explicit data gap."
      evidence: "completeness matrix with included, absent, and unresolved status by row_id"
    - id: dq_precision
      applies_to: "measured and calculated quantities"
      requirement: "Retain instrument resolution, calibration, sampling variability, conversion factors, allocation drivers, unrounded calculations, and final rounding rule."
      evidence: "calibration certificates, sampling records, calculation workbook, and uncertainty statement"
    - id: dq_consistency
      applies_to: "species, units, flow identities, and destinations"
      requirement: "Apply one documented convention for rabbit versus hare identity, gross versus net mass, units, co-product status, waste destination, and direct versus sewer discharge throughout the dataset."
      evidence: "data dictionary, unit-conversion register, flow mapping register, and reviewer sign-off"
    - id: dq_transparency
      applies_to: "method and results"
      requirement: "Disclose boundary choices, conditional operations, exclusions, allocation, upstream dataset selection, calculations, unresolved UUIDs, data gaps, and verification findings."
      evidence: "method report, manifest review metadata, source register, calculation workbook, and verification report"
    - id: dq_verification
      applies_to: "completed foreground data package"
      requirement: "Perform an independent review of identity, scope, records, balances, calculations, allocation, source use, and bilingual rule alignment before lifecycle advancement."
      evidence: "dated review checklist, reviewer identity, findings, corrections, and closure evidence"
validation_rules:
  - rule_id: validate_identity
    applies_to: "PCR and reference flow identity"
    rule: "Confirm canonical_pcr_id, CPC 3.0 code 21134, exact product title, Product flow type, reference UUID, Mass property UUID, Units of mass UUID, and kg unit; reject fresh or chilled meat and edible offal."
    source_ids:
      - unsd-cpc-21134
  - rule_id: validate_reference_amount
    applies_to: "reference output"
    rule: "Require exactly 1 kg net conforming frozen meat at factory-gate release and verify that packaging mass is excluded."
    source_ids:
      - unsd-cpc-21134
      - eu-pef-2021-2279
  - rule_id: validate_scope
    applies_to: "dataset scope"
    rule: "Verify frozen market state, declared rabbit or hare species, product form, process coverage, facility gate, reporting period, and exclusions for upstream farming and inbound transport and downstream stages."
    source_ids:
      - unsd-cpc-21134
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: validate_process_map
    applies_to: "foreground processes"
    rule: "Require detailed inventories for every required process and for each conditional process that is performed; document why an unperformed conditional process is absent."
    source_ids:
