        - eu-jrc-sa-bref
    - rule_id: boundary_required_operations
      applies_to: "required foreground operations"
      rule: "Include receipt, species identity control, slaughter, bleeding, skinning, evisceration, carcass dressing, pre-chilling, freezing, release, frozen storage, cleaning, disinfection, wastewater collection, and all attributable utilities."
