system_boundary:
  rules:
    - rule_id: boundary_rendering_gate_to_gate
      applies_to: "foreground_rendering_system"
      rule: "Include receipt/preparation, rendering or melting, fat/water/solids separation, filtration, required purification or refining, internal transfers, storage, dispatch, cleaning, utilities, direct emissions, residues, wastewater, and on-site treatment attributable to the declared product."
      source_ids:
        - unsd-cpc-3-0-2025
        - eu-pef-2021
    - rule_id: boundary_upstream_traceability
      applies_to: "raw_fatty_material"
      rule: "Link upstream husbandry, slaughter, collection, and inbound-logistics datasets by declared species and material grade; do not assign zero upstream burden merely because the material is called a by-product."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_edible_claim
      applies_to: "edible_tallow"
      rule: "Apply the CXS 211-1999 edible-tallow definition only to eligible bovine and/or sheep raw material and retain evidence of fitness for human consumption; disclose refining and labelling status."
      source_ids:
        - codex-cxs-211-1999
    - rule_id: boundary_fdm_bat_applicability
      applies_to: "regulatory_method_selection"
      rule: "Do not use the EU Food, Drink and Milk BAT conclusions as a rendering/fat-melting process benchmark: their scope explicitly excludes primary products from animal by-products such as rendering and fat melting. Use the applicable local permit and animal-by-product requirements instead."
      source_ids:
        - eu-fdm-bat-2019
    - rule_id: boundary_no_silent_cutoff
      applies_to: "foreground_inventory"
      rule: "Record all known foreground inputs and outputs. Any goal-specific cut-off must be explicitly justified, quantified, and reported; a PEF-conformant study follows the PEF cut-off rule and limitations reporting."
      source_ids:
        - eu-pef-2021
boundary_abstraction:
  declared_starting_condition: "Fatty material received at the rendering facility, identified by animal species or traceable species shares, source establishment and lot, grade/eligibility, preservation condition, and mass basis"
  starting_condition_role: "Foreground gate-in input; upstream animal husbandry, slaughter, collection, and inbound logistics remain linked upstream processes rather than disappearing at the gate"
  product_classification_scope: "Rendered animal fats within the semantic scope of CPC 3.0 subclass 21523, independent of any classification tree as canonical identity"
  recursive_input_rule: "Purchased tallow or another CPC 21523 product used as an input is recorded as a distinct upstream product flow with its own conforming dataset; it is not recursively re-rendered into the same foreground record or treated as burden-free feedstock"
  upstream_dataset_requirement: "Provide species- and grade-specific upstream datasets for raw fatty material and other purchased inputs, including the declared slaughterhouse/rendering allocation status and inbound logistics. PEF-based studies must apply the applicable species-specific animal-husbandry and slaughterhouse rules rather than a cross-species average"
  disclosure: "Declare included unit processes, species/subtype/grade/use, raw-material source and eligibility, rendering and refining technology, allocation, recycled or recovered energy, wastewater and air treatment, packaging, excluded processes, cut-offs, data gaps, and any boundary extension"
