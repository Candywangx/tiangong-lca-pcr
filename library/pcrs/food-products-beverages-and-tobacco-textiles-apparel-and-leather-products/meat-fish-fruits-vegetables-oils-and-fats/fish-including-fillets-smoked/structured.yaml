allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "All multifunctional operations"
    rule: "First avoid allocation through process subdivision or expansion with separately measured process and destination records where technically justified."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residue_status
    applies_to: "Fish trimmings, recovered edible material, spent smoking medium, and other outputs"
    rule: "Classify each output as product, co-product, recyclable material, or waste using its documented destination and market function; do not assign co-product credit to material sent for treatment as waste."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_then_economic
    applies_to: "Unavoidable shared burdens"
    rule: "Where subdivision is not feasible, use a documented physical relationship that reflects the causal use of resources. If no defensible physical relationship exists, use economic allocation with prices, reference period, currency, and sensitivity disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_mass_balance
    applies_to: "Lot outputs"
    rule: "Reconcile received fish, added ingredients, moisture change, reference product, co-products, residues, and wastewater before allocation; explain material imbalance outside measured uncertainty."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_raw_fish_receipts
      process_id: "receive_prepare"
      flow_role: "received fish"
      record_type: "supplier and receiving records"
      raw_fields: "supplier; species; origin; capture_or_aquaculture; cut; state; gross_mass; tare; accepted_mass; receipt_temperature; date; lot"
      collection_method: "Calibrated scale plus receiving and traceability records"
      unit: "kg; °C"
      frequency: "every lot"
      temporal_coverage: "full study period"
      site_scope: "all supplying routes to included site"
      aggregation_rule: "sum accepted net mass by product and lot"
      quality_evidence: "scale calibration; supplier traceability; rejection log"
    - protocol_id: cp_water_records
      process_id: "receive_prepare_cure_smoke"
      flow_role: "process water"
      record_type: "meter and production records"
      raw_fields: "opening_meter; closing_meter; shared_use_allocation; lot; process; date"
      collection_method: "Sub-meter or documented allocation from calibrated site meter"
      unit: "kg or m3"
      frequency: "daily or batch"
      temporal_coverage: "full study period with seasonal coverage"
      site_scope: "all included water users"
      aggregation_rule: "convert volume using recorded conditions when material; allocate shared use by documented causal driver"
      quality_evidence: "meter calibration; reconciliation to invoice or main meter"
    - protocol_id: cp_ice_records
      process_id: "receive_prepare"
      flow_role: "ice"
      record_type: "purchase or production records"
      raw_fields: "purchased_mass; produced_mass; issued_mass; returned_mass; lot; date"
      collection_method: "Weighing, invoices, and issue records"
      unit: "kg"
      frequency: "every lot or daily"
      temporal_coverage: "full study period"
      site_scope: "included preparation operations"
      aggregation_rule: "net issued ice; separately account on-site production water and energy"
      quality_evidence: "scale record; invoice; production log"
    - protocol_id: cp_preparation_mass_balance
      process_id: "receive_prepare"
      flow_role: "preparation transfers"
      record_type: "batch mass balance"
      raw_fields: "accepted_fish; prepared_transfer; residues; wastewater; stock_change; lot"
      collection_method: "Calibrated batch scales and reconciled production records"
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "full study period"
      site_scope: "included preparation lines"
      aggregation_rule: "calculate lot balance and aggregate mass-weighted values"
      quality_evidence: "calibration; batch reconciliation; explanation of imbalance"
    - protocol_id: cp_salt_brine_records
      process_id: "cure_smoke"
      flow_role: "salt and brine"
      record_type: "formulation and issue records"
      raw_fields: "ingredient; concentration; fresh_makeup; recirculated_mass; discard_mass; lot; date"
      collection_method: "Formulation sheets, calibrated weighing, and tank records"
      unit: "kg; mass fraction"
      frequency: "every batch"
      temporal_coverage: "full study period"
      site_scope: "all included curing systems"
      aggregation_rule: "count fresh input once; track recirculation internally"
      quality_evidence: "formulation approval; scale calibration; tank reconciliation"
    - protocol_id: cp_smoking_medium_records
      process_id: "cure_smoke"
      flow_role: "smoking medium"
      record_type: "purchase and issue records"
      raw_fields: "medium_type; supplier; mass; moisture_basis; returned_mass; batch"
      collection_method: "Calibrated weighing and inventory reconciliation"
      unit: "kg"
      frequency: "every batch or delivery"
      temporal_coverage: "full study period"
      site_scope: "all smoke generators serving included production"
      aggregation_rule: "net consumed mass by medium and batch"
      quality_evidence: "invoice; scale calibration; stock reconciliation"
    - protocol_id: cp_energy_records
      process_id: "cure_smoke_cool_pack_store"
      flow_role: "electricity and thermal energy"
      record_type: "meters, fuel records, and runtime logs"
      raw_fields: "meter_start; meter_end; fuel_quantity; heating_value_basis; equipment; runtime; throughput; holding_duration; date"
      collection_method: "Sub-metering preferred; otherwise documented engineering allocation reconciled to facility totals"
      unit: "kWh; MJ; fuel unit"
      frequency: "batch, daily, or monthly meter interval"
      temporal_coverage: "at least one representative year or justified full campaign"
      site_scope: "all included equipment and storage zones"
      aggregation_rule: "aggregate by energy carrier and allocate shared use using causal driver"
      quality_evidence: "meter calibration; invoice reconciliation; equipment log"
    - protocol_id: cp_smoking_batch_records
      process_id: "cure_smoke"
      flow_role: "smoking controls and output"
      record_type: "validated food-safety and batch records"
      raw_fields: "species; cut; salting_or_brining; smoke_route; medium; chamber_time; chamber_temperature; product_temperature; moisture_or_aw_if_controlled; input_mass; output_mass; deviations; disposition"
      collection_method: "Approved batch record and calibrated control instruments"
      unit: "kg; time; °C; declared moisture or aw unit"
      frequency: "every batch"
      temporal_coverage: "full study period"
      site_scope: "every included smoking chamber and product route"
      aggregation_rule: "retain batch values; aggregate mass-weighted only after deviation review"
      quality_evidence: "instrument calibration; food-safety plan; release authorization"
    - protocol_id: cp_residue_records
      process_id: "receive_prepare_cure_smoke_cool_pack_store"
      flow_role: "residues and waste"
      record_type: "weighing and destination records"
      raw_fields: "material; mass; destination; product_or_waste_status; transporter; date; lot"
      collection_method: "Calibrated scale, container records, and dispatch documentation"
      unit: "kg"
      frequency: "every batch or dispatch"
      temporal_coverage: "full study period"
      site_scope: "all included process wastes and recovered outputs"
      aggregation_rule: "sum by material, status, and destination; do not net unlike outputs"
      quality_evidence: "calibration; waste transfer note; sales record where applicable"
    - protocol_id: cp_wastewater_records
      process_id: "receive_prepare_cure_smoke"
      flow_role: "wastewater"
      record_type: "meter, balance, and treatment records"
      raw_fields: "inflow; discharge; stock_change; evaporation; stream; salt_load_if_measured; treatment; destination; period"
      collection_method: "Discharge meter preferred; otherwise documented water balance"
      unit: "kg or m3; concentration where measured"
      frequency: "daily, batch, or billing period"
      temporal_coverage: "full study period"
      site_scope: "all included drains and segregated streams"
      aggregation_rule: "convert and aggregate by stream and treatment route"
      quality_evidence: "meter calibration; sampling record; treatment invoice; balance closure"
    - protocol_id: cp_air_emission_records
      process_id: "cure_smoke"
      flow_role: "direct air emissions"
      record_type: "monitoring or factor calculation records"
      raw_fields: "pollutant; measured_concentration; gas_flow; fuel; smoking_medium; factor; factor_source; runtime; control_device"
      collection_method: "Stack monitoring or calculation from recorded activity and reviewed factors"
      unit: "pollutant-specific mass"
      frequency: "monitoring campaign or every calculation period"
      temporal_coverage: "representative operating modes in study period"
      site_scope: "all included on-site combustion and smoke generation"
      aggregation_rule: "pollutant-specific mass; retain method and uncertainty"
      quality_evidence: "laboratory report; instrument calibration; factor reference"
    - protocol_id: cp_packaging_records
      process_id: "cool_pack_store"
      flow_role: "packaging"
      record_type: "bill of materials and issue records"
      raw_fields: "component; material; unit_mass; units_packed; scrap; returned_material; supplier"
      collection_method: "Component weighing and stock reconciliation"
      unit: "kg"
      frequency: "each packaging specification and reporting period"
      temporal_coverage: "full study period"
      site_scope: "all included packaging formats"
      aggregation_rule: "component mass times packed units plus measured attributable scrap"
      quality_evidence: "specification; calibrated scale; purchase reconciliation"
    - protocol_id: cp_refrigerant_records
      process_id: "cool_pack_store"
      flow_role: "refrigerant"
      record_type: "service and stock-balance records"
      raw_fields: "substance; opening_stock; purchases; additions; recovery; closing_stock; equipment; throughput; period"
      collection_method: "Maintenance system, invoices, and cylinder mass balance"
      unit: "kg by substance"
      frequency: "every service event and annual closure"
      temporal_coverage: "full study period"
      site_scope: "all refrigeration serving included operations"
      aggregation_rule: "additions minus documented recovery and stock transfers, allocated by causal equipment use"
      quality_evidence: "service invoice; technician record; cylinder reconciliation"
    - protocol_id: cp_product_output_records
      process_id: "cool_pack_store"
      flow_role: "reference product"
      record_type: "packing and dispatch records"
      raw_fields: "product_code; species; form; smoke_route; pack_count; gross_mass; tare; net_mass; rejects; lot; date"
      collection_method: "Calibrated checkweigher or batch scales linked to release records"
      unit: "kg"
      frequency: "every lot"
      temporal_coverage: "full study period"
      site_scope: "all included final products"
      aggregation_rule: "sum conforming net mass excluding packaging"
      quality_evidence: "calibration; release record; inventory reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = attributable period or lot amount / conforming net packaged smoked-fish mass"
      inputs:
        - "attributable amount"
        - "conforming net output"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_preparation_yield
      applies_to: "receive_prepare"
      rule: "prepared-fish yield = prepared transfer mass / accepted received-fish mass"
      inputs:
        - "accepted received fish"
        - "prepared transfer"
      output: "kg/kg"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_smoking_yield
      applies_to: "cure_smoke"
      rule: "smoking yield = smoked-fish transfer mass / prepared-fish input mass; report ingredient uptake and moisture loss when measured"
      inputs:
        - "prepared fish"
        - ingredients
        - "smoked-fish transfer"
        - "measured moisture data"
      output: "kg/kg and disclosed mass-change drivers"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_water_balance
      applies_to: "Wastewater rows"
      rule: "wastewater = measured discharge, or water and ice inputs plus relevant product water released minus retained water, evaporation, and other documented outputs"
      inputs:
        - water
        - ice
        - brine
        - "stock change"
        - "retained water"
        - evaporation
      output: "kg wastewater by stream"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "refrigerant_r717_emission; refrigerant_r404a_emission; refrigerant_r134a_emission; refrigerant_r744_emission"
      rule: "substance loss = additions + opening stock + purchases - recovery - closing stock - documented transfers, constrained to the equipment boundary"
      inputs:
        - "substance-specific refrigerant records"
      output: "kg substance emitted"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "Each process and whole foreground system"
      rule: "inputs + opening stock = products + co-products + wastes + measured emissions + closing stock + documented moisture change and uncertainty"
      inputs:
        - "all mass records"
      output: "closure percentage and unexplained imbalance"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Raw fish and final product"
      requirement: "Retain lot-level linkage for species, origin, capture or aquaculture system, incoming state, process route, packaging, and final storage specification."
      evidence: "Supplier traceability, receiving, batch, release, and dispatch records; codex-cxc-52-2003"
    - id: dq_measurement
      applies_to: "Mass, water, energy, temperature, time, and control parameters"
      requirement: "Use calibrated instruments appropriate to the decision and retain calibration status, units, missing-data treatment, and conversion basis."
      evidence: "Calibration certificates, meter reconciliation, approved procedures; codex-cxc-52-2003"
    - id: dq_temporal
      applies_to: "Foreground study period"
      requirement: "Cover a representative production year or the complete seasonal campaign and disclose shutdowns, atypical lots, storage duration, and substitutions."
      evidence: "Production calendar, meter periods, purchasing and dispatch reconciliation; eu-pef-2021-2279"
    - id: dq_technology_geography
      applies_to: "Process and upstream datasets"
      requirement: "Match smoking technology, smoke medium, hot/cold route, cooling/storage system, geography, species, and capture/aquaculture origin; document proxy use."
      evidence: "Site specification, supplier records, dataset metadata; eu-pef-2021-2279"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Reconcile fish, ingredients, water, energy, packaging, products, co-products, wastes, wastewater, direct emissions, and refrigerant losses; explain exclusions and material imbalances."
      evidence: "Mass, water, energy, refrigerant, and waste balances; eu-pef-2021-2279"
    - id: dq_food_safety_controls
      applies_to: "Smoking, cooling, packaging, and storage"
      requirement: "Retain the approved product-specific control plan, monitored critical parameters, deviations, corrective action, and release decision; this PCR does not invent universal time-temperature, microbiological, contaminant, moisture, or shelf-life limits."
      evidence: "Food-safety plan and batch records; codex-cxc-52-2003"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "Reference output"
    rule: "Confirm exactly 1 kg net packaged smoked fish using the declared product UUID, Mass property, mass unit group, and kg; packaging mass shall not be included."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: validate_qualifiers
    applies_to: "Dataset metadata"
    rule: "Reject an incomplete package when required species, form, incoming state, smoking route and medium, salting/brining, storage state, packaging, origin, geography, or production/holding dates are absent."
    source_ids:
      - unsd-cpc-3-0
      - codex-cxc-52-2003
  - rule_id: validate_process_route
    applies_to: "Foreground inventory"
    rule: "Confirm that each required process has a matched detailed inventory, route-specific records, and no double counting of intermediate fish, smoking medium versus fuel, ice production, or shared utilities."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_mass_balance
    applies_to: "Process and system totals"
    rule: "Calculate process and overall mass-balance closure and require explanation of moisture change, stock change, measurement uncertainty, or missing flows for material imbalance."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "Multifunctional processes"
    rule: "Confirm allocation avoidance was attempted first and that every remaining physical or economic allocation key, co-product status, data period, and sensitivity is disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_food_safety_evidence
    applies_to: "Smoking and finishing records"
    rule: "Confirm that the actual product specification supplies applicable smoking, cooling, storage, microbiological, chemical-contaminant, moisture or water-activity, and shelf-life criteria plus monitored release evidence; report inconclusive if these criteria are absent."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_provisional_ranges
    applies_to: "Important inventory flows"
    rule: "Treat every reasoned_estimate interval only as a QA flag. A value outside the interval requires explanation, while a value inside it does not constitute evidence; replace provisional ranges before publication-critical use."
    source_ids: []
  - rule_id: validate_data_quality
    applies_to: "Completed data package"
    rule: "Report temporal, geographical, technological, precision, completeness, consistency, and source representativeness, including proxy datasets and skipped checks."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production dataset for smoked fish at the smoking-facility gate"
  downstream_use: "secondary_dataset; background_dataset when geography, species, production route, technology, storage state, and data-quality needs are compatible"
  allowed_use: "Cradle-to-gate or broader models that add compatible upstream fish and input datasets and avoid overlap with this foreground boundary; comparisons only when functional, quality, storage, and route specifications are equivalent"
  excluded_use: "Direct representation of unsmoked, canned, salted-only, dried-only, pickled, fermented, or merely smoke-flavoured fish; substitution across materially different species, hot/cold routes, production systems, storage states, or geographies without review"
  required_metadata: "PCR id and status; product-flow UUID; species and form; origin and capture/aquaculture system; incoming state; smoking and smoke-generation route; salt/brine route; storage and packaging specification; facility geography and technology; study period; net output; upstream datasets; co-products and allocation; data sources and provisional estimates"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; temporal, geographical, and technological representativeness; data gaps and proxy datasets; mass/water/energy balance closure; food-safety control evidence; uncertainty; all reasoned_estimate uses and unresolved UUIDs"
  update_trigger: "Change in species mix, sourcing or production system, smoking route or medium, formulation, equipment, energy carrier, cooling/freezing/storage route, packaging, co-product destination, allocation, wastewater or emissions control, refrigerant, regulation, product safety specification, or evidence causing a material inventory change"
data_sources:
  - id: "unsd-cpc-3-0"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification (CPC) Version 3.0, code 21232, Fish including fillets, smoked. https://unstats.un.org/unsd/classifications/Econ/cpc"
    used_for: "Product category boundary and classification context"
