allocation_rules:
  - rule_id: allocation_avoid_where_separable
    applies_to: "Separately metered processes and product campaigns"
    rule: "Prefer subdivision or direct measurement so burdens are assigned to the process or product that causes them before applying allocation."
    source_ids:
      - mpob-yung-2020-refining-lca
  - rule_id: allocation_pfads_economic
    applies_to: "RBD palm oil and PFAD from physical refining"
    rule: "When PFAD is a marketable co-product and subdivision is not possible, allocate shared refining burdens by the contemporaneous economic value of RBD palm oil and PFAD using masses and representative prices from the same declared period and market."
    source_ids:
      - mpob-yung-2020-refining-lca
  - rule_id: allocation_chemical_route
    applies_to: "Soapstock, palm acid oil, and other chemical-refining outputs"
    rule: "Classify each output as co-product, internally recovered material, or waste from documented destination and market evidence; apply the same economic-allocation rule to marketable co-products and assign treatment burdens to wastes."
    source_ids:
      - mpob-yung-2020-refining-lca
  - rule_id: allocation_internal_recovery
    applies_to: "Internally recycled oil or material"
    rule: "Do not allocate burdens to an internally recycled flow as a separate product; keep recovery operations and any displaced fresh input visible in the foreground mass balance."
    source_ids:
      - mpob-yung-2020-refining-lca
  - rule_id: allocation_price_evidence
    applies_to: "Economic allocation"
    rule: "Retain product masses, price sources, currency, price basis, averaging period, and calculation. Do not reuse the historical 96.2:3.8 RBD-palm-oil:PFAD ratio without demonstrating that its market period represents the study."
    source_ids:
      - mpob-yung-2020-refining-lca
  - rule_id: allocation_sensitivity
    applies_to: "Material multi-output results"
    rule: "Report a mass-allocation sensitivity when the allocation choice materially affects interpretation, and disclose the result beside the primary economic-allocation result."
    source_ids:
      - mpob-yung-2020-refining-lca
dataset_production:
  collection_protocols:
    - protocol_id: cp_cpo_transport
      process_id: "cpo_inbound_transport"
      flow_role: "crude palm oil delivery"
      record_type: "weighbridge and logistics records"
      raw_fields: "shipment_mass_t; origin; destination; loaded_distance_km; mode; vehicle_class; empty_return"
      collection_method: "Match shipment-level weighbridge tickets to route or carrier records"
      unit: "t; km"
      frequency: "Per shipment"
      temporal_coverage: "Same reporting period as refinery output"
      site_scope: "All included CPO deliveries"
      aggregation_rule: "Sum shipment mass times loaded distance; treat empty returns separately"
      quality_evidence: "Weighbridge tickets, carrier invoices, route evidence, and reconciliation to CPO receipts"
    - protocol_id: cp_material_balance
      process_id: "palm_oil_refining"
      flow_role: "crude palm oil and refining aids"
      record_type: "weighbridge, tank, invoice, and dosing records"
      raw_fields: "opening_stock; receipts; issues_or_dosing; returns; closing_stock; rejected_or_reworked_mass; material_identity"
      collection_method: "Reconcile calibrated meters, tank measurements, weighbridge tickets, invoices, and batch dosing logs"
      unit: "kg by material"
      frequency: "Per batch with monthly reconciliation"
      temporal_coverage: "Complete declared reporting period and representative operating conditions"
      site_scope: "All refinery lines and storage tanks serving the declared product"
      aggregation_rule: "Consumption equals opening stock plus receipts minus closing stock minus documented transfers; normalise by conforming output"
      quality_evidence: "Calibration records, stock reconciliation, supplier identity, batch logs, and exception records"
    - protocol_id: cp_energy_and_water
      process_id: "palm_oil_refining"
      flow_role: "electricity, steam, boiler fuel, water, and direct emissions"
      record_type: "meter, purchase, tank, boiler, and stack records"
      raw_fields: "meter_readings; purchases; stocks; carrier_identity; heating_value; steam_import; water_source; emission_measurement_or_factor"
      collection_method: "Use calibrated sub-meters where available; otherwise document allocation of common utilities from plant totals"
      unit: "kWh; MJ; kg; m3; emission kg"
      frequency: "Continuous or per shift, aggregated monthly"
      temporal_coverage: "Same reporting period as product output"
      site_scope: "All utility systems serving the declared refinery process"
      aggregation_rule: "Reconcile purchases and stocks, prevent steam/fuel double counting, and normalise by conforming output"
      quality_evidence: "Meter calibration, invoices, boiler logs, fuel analysis, factor provenance, and reconciliation"
    - protocol_id: cp_outputs_and_wastes
      process_id: "palm_oil_refining"
      flow_role: "refined oil, co-products, wastes, and wastewater"
      record_type: "tank, weighbridge, dispatch, waste-transfer, and laboratory records"
      raw_fields: "opening_stock; production; dispatch; closing_stock; destination; market_status; wastewater_volume; BOD; COD"
      collection_method: "Reconcile production and dispatch records with tanks and waste manifests; sample wastewater using the applicable site method"
      unit: "kg; m3; mg/L"
      frequency: "Per batch or shipment; wastewater per permit or operating plan"
      temporal_coverage: "Same reporting period as material and utility inputs"
      site_scope: "All output tanks and waste routes for the declared product"
      aggregation_rule: "Sum net output after stock change by named product or waste and preserve destination"
      quality_evidence: "Calibrated scales or tanks, sales records, waste manifests, sample chain of custody, and laboratory reports"
    - protocol_id: cp_wastewater_treatment
      process_id: "wastewater_treatment"
      flow_role: "treatment inputs, residues, and treated-water emissions"
      record_type: "treatment meter, chemical, sludge, and laboratory records"
      raw_fields: "influent_volume; effluent_volume; chemical_use; energy_use; sludge_mass; analyte; concentration; sampling_time"
      collection_method: "Match influent, effluent, chemical, energy, sludge, and laboratory records for the same treatment period"
      unit: "m3; kg; kWh; mg/L"
      frequency: "Continuous or per treatment batch; sampling per permit"
      temporal_coverage: "Same reporting period as refinery wastewater"
      site_scope: "Onsite system or documented external treatment route"
      aggregation_rule: "Calculate loads from matched flow and concentration; normalise treatment inventory per m3 treated"
      quality_evidence: "Meter calibration, treatment log, laboratory QA/QC, waste transfer record, and mass/load reconciliation"
    - protocol_id: cp_product_quality
      process_id: "palm_oil_refining"
      flow_role: "refined palm oil conformity"
      record_type: "batch certificate and laboratory results"
      raw_fields: "batch_id; route; grade; specification; test_method; result; acceptance_status; rework_or_rejection"
      collection_method: "Sample and test each declared product according to the applicable specification and site quality plan"
      unit: "specification-dependent"
      frequency: "Per batch or lot"
      temporal_coverage: "Entire reporting period"
      site_scope: "Every lot counted as conforming output"
      aggregation_rule: "Only accepted output enters the reference amount; rejected or reworked oil remains in the mass balance"
      quality_evidence: "Certificate of analysis, test method, laboratory QA/QC, and release record"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "Every refinery inventory quantity"
      rule: "normalised_quantity = reporting_period_quantity / conforming_refined_palm_oil_kg * 1000"
      inputs:
        - "reporting-period flow quantity"
        - "conforming refined palm oil output in kg"
      output: "Flow quantity per 1,000 kg reference product"
      source_ids:
        - mpob-yung-2020-refining-lca
    - id: calc_cpo_transport
      applies_to: "Inbound transport"
      rule: "tkm = CPO shipment mass in tonnes * loaded distance in kilometres"
      inputs:
        - shipment_mass_t
        - loaded_distance_km
      output: "tkm per shipment and per reference flow"
      source_ids:
        - mpob-yung-2020-refining-lca
    - id: calc_wastewater_load
      applies_to: "Pollutant discharged to water"
      rule: "load_kg = treated_water_volume_m3 * concentration_mg_per_L / 1000"
      inputs:
