      requirement: "Preserve current mass and market evidence for economic allocation and provide the required sensitivity when material."
      evidence: "Price references, product quantities, allocation workbook, and sensitivity result; mpob-yung-2020-refining-lca"
    - id: dq_background_match
      applies_to: "Linked upstream datasets"
      requirement: "Match geography, technology, time, grade, delivery condition, electricity mix, fuels, water source, chemicals, transport, and waste treatment as closely as available; disclose material mismatches."
      evidence: "Dataset metadata and mismatch register"
    - id: dq_traceability
      applies_to: "Foreground dataset"
      requirement: "Every normalised value must trace to a source record, collection protocol, conversion, and calculation version."
      evidence: "Record identifiers, calculation workbook, reviewer sign-off, and retained QA evidence"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The reference output must use Palm oil, refined 029b6008-a809-4d77-8612-47451f7c98fa, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and exactly 1,000 kg."
    source_ids:
      - codex-cxs-210-1999
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset identity"
    rule: "All required qualifiers must be present and must identify the refining route, grade, specification, geography, time, bulk state, fractionation status, and allocation basis."
    source_ids:
      - codex-cxs-210-1999
      - mpob-yung-2020-refining-lca
  - rule_id: validate_route_inventory
    applies_to: "Process inventory"
    rule: "Physical refining must include degumming, bleaching, spent bleaching earth, deodorisation, PFAD, electricity, thermal energy, water, wastewater, and direct emissions; chemical refining must replace the FFA-removal and co-product rules with its documented caustic-neutralisation route."
    source_ids:
      - mpob-yung-2020-refining-lca
  - rule_id: validate_boundary_links
    applies_to: "System boundary"
    rule: "Upstream crude palm oil and every purchased input must have an upstream dataset or an explicit unresolved gap; fractionation and packaging must not be silently included in the reference process."
    source_ids:
      - mpob-yung-2020-refining-lca
  - rule_id: validate_mass_balance
    applies_to: "Material balance"
    rule: "The normalised material balance must include stock changes, rework, co-products, wastes, and documented measurement terms, and every unexplained gap must be reported as a finding."
    source_ids:
      - mpob-yung-2020-refining-lca
  - rule_id: validate_allocation
    applies_to: "Co-products"
    rule: "PFAD and any other marketable co-product must have documented status and allocation; economic allocation must use representative study-period evidence and must not copy a historical ratio without justification."
    source_ids:
      - mpob-yung-2020-refining-lca
  - rule_id: validate_foreground_evidence
    applies_to: "Data production"
    rule: "Every foreground-record or calculated value must link to its collection protocol and retained source evidence for the declared period."
    source_ids:
      - mpob-yung-2020-refining-lca
  - rule_id: validate_completeness
    applies_to: "Publication readiness"
    rule: "Validation must report accepted inputs, checks performed, checks skipped, findings, and completeness; missing identity, unresolved mass balance, missing required flow, unsupported allocation, or absent source record is an error or an inconclusive result."
    source_ids:
      - mpob-yung-2020-refining-lca
published_dataset_profile:
  dataset_role: "Foreground refinery data package and unit-process dataset for bulk refined palm oil production"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Attributional product systems requiring declared bulk refined palm oil at refinery gate; linkage to matching upstream CPO and downstream users; regionalised studies when geography and technology are represented"
  excluded_use: "Direct representation of crude palm oil, palm-kernel oil, fractionated palm olein or stearin, blended or packaged cooking oil, biodiesel, or a refinery route and geography not disclosed by the dataset"
  required_metadata: "PCR id and version; Tiangong reference flow UUID; process UUID when available; refining route; grade and specification; geography; reporting period; technology; bulk state; fractionation status; CPO origin and delivery condition; transport scope; boiler-fuel mix; wastewater route; allocation basis; source ids; collection protocol ids"
  required_quality_disclosure: "Site and line coverage; temporal coverage; meter and stock reconciliation; mass-balance result; product conformity; background-data mismatches; co-product status and price evidence; allocation sensitivity; missing or estimated records; wastewater and direct-emission calculation methods"
  update_trigger: "Material change in refinery route, product grade or specification, reference flow identity, CPO supply geography, energy or fuel system, wastewater treatment, co-product market status, allocation evidence, reporting period, or external method evidence"
