    - id: calc_economic_allocation
      applies_to: "Shared refining burdens for marketable co-products"
      rule: "allocation_share_i = mass_i * representative_price_i / sum(mass_j * representative_price_j) for all marketable co-products j"
      inputs:
        - "co-product masses"
        - "representative prices"
        - "price period"
        - "currency and basis"
      output: "Allocation share for each marketable co-product"
      source_ids:
        - mpob-yung-2020-refining-lca
    - id: calc_mass_balance
      applies_to: "Refinery material balance"
      rule: "balance_gap = total_mass_inputs - total_mass_outputs - net_inventory_change, with separately documented evaporation or measurement terms where material"
      inputs:
        - "measured material inputs"
        - products
        - co-products
        - wastes
        - "stock changes"
      output: "Mass-balance gap and reconciliation statement"
      source_ids:
        - mpob-yung-2020-refining-lca
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference output"
      requirement: "Demonstrate refined palm oil identity, route, grade, specification, bulk state, and exclusion of fractionated products; edible claims must identify the applicable specification."
      evidence: "Batch release and certificate of analysis; codex-cxs-210-1999"
    - id: dq_temporal_alignment
      applies_to: "All foreground flows"
      requirement: "Inputs, outputs, stock changes, utilities, wastes, and prices must cover the same declared period; disclose shutdowns, abnormal campaigns, missing months, and seasonal limitations."
