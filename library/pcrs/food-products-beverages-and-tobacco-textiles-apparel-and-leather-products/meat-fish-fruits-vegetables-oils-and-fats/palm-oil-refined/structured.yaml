system_boundary:
  rules:
    - rule_id: boundary_refinery_operations
      applies_to: "Foreground palm oil refinery"
      rule: "Include crude palm oil receipt and storage, degumming, bleaching and spent-earth removal, route-specific deacidification or neutralisation, deodorisation, cooling, polishing filtration, bulk storage, utilities, direct emissions, wastewater, wastes, and co-products."
      source_ids:
        - mpob-yung-2020-refining-lca
    - rule_id: boundary_inbound_transport
      applies_to: "Crude palm oil delivery"
      rule: "Include inbound transport when controlled by the refinery or included in the declared study scope; otherwise disclose its exclusion and retain the upstream delivery condition."
      source_ids:
        - mpob-yung-2020-refining-lca
    - rule_id: boundary_upstream_linkage
      applies_to: "Purchased crude palm oil and other product inputs"
      rule: "Keep upstream production outside the foreground refinery process but link every purchased input to a geographically and temporally appropriate upstream dataset."
      source_ids:
        - mpob-yung-2020-refining-lca
    - rule_id: boundary_route_specificity
      applies_to: "Physical and chemical refining"
      rule: "Declare the route. Physical refining must represent PFAD from deodorisation; chemical refining must represent caustic neutralisation and its soapstock or palm-acid-oil route when present."
      source_ids:
        - mpob-yung-2020-refining-lca
    - rule_id: boundary_downstream_exclusions
      applies_to: "Fractionation and downstream stages"
      rule: "Exclude fractionation, retail packaging, distribution, use, biodiesel conversion, and end-of-life from the default foreground system; add them only as explicitly separate processes for an expanded study scope."
      source_ids:
        - mpob-yung-2020-refining-lca
    - rule_id: boundary_completeness
      applies_to: "Foreground inventory"
      rule: "Do not omit crude palm oil, electricity, steam or boiler fuel, refining aids, refined oil, route-specific co-products, spent bleaching earth, wastewater, or direct fuel-combustion emissions. Disclose and justify any other omitted flow and assess its materiality."
      source_ids:
        - mpob-yung-2020-refining-lca
