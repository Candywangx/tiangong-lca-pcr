  calculation_rules:
    - id: calc_reference_mass
      applies_to: "saleable product"
      rule: "Reference mass = gross packed mass − packaging mass − glaze mass for frozen glazed product − separable packing brine; use documented drained mass for the brine route."
      inputs:
