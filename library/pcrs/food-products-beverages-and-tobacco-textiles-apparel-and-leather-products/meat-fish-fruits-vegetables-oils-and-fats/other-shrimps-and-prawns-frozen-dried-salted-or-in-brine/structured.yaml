        - eu-pef-2021
    - rule_id: exclusive_preservation_route
      applies_to: "preservation route"
      rule: "Model exactly one included route—frozen, dried, salted, or in brine. Do not cumulate route candidates. Smoking and cooking move the product outside CPC 21256."
      source_ids:
        - unsd-cpc-3-0
        - codex-cxs-92-1981
    - rule_id: upstream_linkage
      applies_to: "purchased inputs"
      rule: "Link raw shrimp, water, energy carriers, salt or prepared brine, packaging, and treatment services to geographically and technologically appropriate upstream datasets; do not omit them merely because production occurs outside the foreground facility."
      source_ids:
        - eu-pef-2021
    - rule_id: downstream_exclusion
      applies_to: "downstream stages"
      rule: "Exclude distribution beyond the facility gate, retail, consumer preparation, use, and end-of-life unless the declared study scope extends them; disclose every extension separately."
