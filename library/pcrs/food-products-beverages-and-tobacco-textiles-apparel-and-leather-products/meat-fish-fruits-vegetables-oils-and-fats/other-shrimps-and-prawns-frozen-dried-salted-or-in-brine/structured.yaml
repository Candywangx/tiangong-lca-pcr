allocation_rules:
  - rule_id: avoid_allocation
    applies_to: "separable routes and batches"
    rule: "First avoid allocation by separating preservation routes, batches, meters, and independently measured preparation or packaging steps."
    source_ids:
      - eu-pef-2021
  - rule_id: physical_allocation
    applies_to: "unavoidable joint production"
    rule: "When subdivision is not possible, use a documented physical causal relationship that reflects how inputs and emissions change with the co-product output; mass alone is not automatically causal."
    source_ids:
      - eu-pef-2021
  - rule_id: economic_fallback
    applies_to: "valuable co-products without defensible physical causality"
    rule: "Use economic allocation only as a documented fallback, based on consistent prices and a declared time/geography basis; disclose a sensitivity result when allocation materially affects conclusions."
    source_ids:
      - eu-pef-2021
  - rule_id: waste_and_residue_status
    applies_to: "shells, heads, offal, rejects, and recovered salt or brine"
    rule: "Declare legal and market status, destination, and any revenue. Do not credit waste as a co-product without evidence that it leaves the system for a useful function."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_mass_balance
      process_id: "receiving_preparation_route_preservation_packaging_storage"
      flow_role: "raw, intermediate, product, reject, and residue masses"
      record_type: "calibrated scale records and batch ledger"
      raw_fields: "batch_id; species; origin; presentation; route; received_mass; transfer_mass; product_mass; residue_mass; destination"
      collection_method: "direct weighing at receipt and transfer points"
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "minimum three representative batches; preferably twelve months"
      site_scope: "each facility and line"
      aggregation_rule: "sum by batch, reconcile inputs and outputs, then divide by route-conditioned reference output"
      quality_evidence: "scale calibration; signed batch ledger; reconciliation explanation"
    - protocol_id: cp_utility_preservation_records
      process_id: "receiving_preparation_route_preservation"
      flow_role: "water, electricity, heat/fuel, salt/brine, wastewater, and spent brine"
      record_type: "meters, invoices, formulation sheets, and discharge logs"
      raw_fields: "batch_id; meter_start; meter_end; carrier; quantity; salt_mass; brine_mass; concentration; discharge_mass; reuse_mass"
      collection_method: "submeter where possible; otherwise documented allocation from facility totals"
      unit: "native carrier units, kg, kWh, MJ"
