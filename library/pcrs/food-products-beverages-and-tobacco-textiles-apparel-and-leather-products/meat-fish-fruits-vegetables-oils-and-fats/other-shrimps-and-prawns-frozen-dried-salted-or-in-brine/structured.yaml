system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate
      applies_to: "foreground processing"
      rule: "Include receiving, sorting, washing, trimming or peeling when performed, the one declared preservation route, packaging, route-required on-site storage, directly used utilities, rejects, wastewater or spent brine, and directly controlled waste handling through transfer from the facility."
