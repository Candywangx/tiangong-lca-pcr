validation_rules:
  - rule_id: validate_scope_route
    applies_to: "product and route"
    rule: "The product shall be raw CPC 21256 shrimp or prawn preserved by exactly one of frozen, dried, salted, or brined routes; cooked and smoked products fail this PCR scope."
    source_ids:
      - unsd-cpc-3-0
      - codex-cxs-92-1981
  - rule_id: validate_flow_semantics
    applies_to: "reference flow UUID"
    rule: "Use e7d7c254-044d-4a15-9d72-2e2a871bb67b only for a product semantically consistent with processed South American white shrimp; the UUID alone never proves coverage of all CPC 21256 products."
    source_ids: []
  - rule_id: validate_reference_mass
    applies_to: "reference flow"
    rule: "Confirm exactly 1 kg net saleable product, packaging excluded, with the applicable deglazed, drained, moisture, salt, presentation, and edible-fraction qualifiers recorded."
    source_ids:
      - codex-cxs-92-1981
  - rule_id: validate_route_inventory
    applies_to: "process inventory"
    rule: "Rows for non-selected preservation routes shall be zero or absent; all material and energy rows applicable to the selected route shall be present and linked to records."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "batch and process outputs"
    rule: "Reconcile received mass to product, co-products, residues, retained packing medium, wastewater, and measured losses at each process; investigate and disclose unexplained imbalance."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_reasoned_estimates
    applies_to: "provisional ranges"
    rule: "Identify every reasoned_estimate as provisional, record its applicability, and replace it when reviewed source evidence or at least three representative batches become available; it shall not become a publication-critical allowed range without review."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "multifunctionality"
    rule: "Document subdivision, allocation basis, prices or physical causality, co-product status, and sensitivity when allocation materially changes the result."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground production data package for one product, facility, presentation, and mutually exclusive preservation route."
  downstream_use: "May be reviewed and published as a secondary_dataset or background_dataset, and projected to process and lifecyclemodel entities."
  allowed_use: "Route-matched modelling of raw frozen, dried, salted, or brined other shrimp/prawn products when reference-mass and product-flow semantics match."
  excluded_use: "Generic representation of all CPC 21256 products from the selected white-shrimp UUID; cooked or smoked products; cross-route comparison without a common disclosed mass basis; use of provisional ranges as verified performance."
  required_metadata: "PCR id; CPC code; product-flow UUID and semantic limitation; species; origin; raw state; presentation; preservation route; facility and geography; reference-mass condition; packaging; storage; temporal coverage; allocation; upstream datasets; waste destinations."
  required_quality_disclosure: "Completeness and reconciliation results; meter and scale coverage; proxy use; allocation sensitivity; mass-condition tests; route separation; uncertainty; remaining reasoned_estimate values and replacement plan."
  update_trigger: "Change in species or product-flow identity, presentation, preservation route, facility technology, energy supply, storage condition, packaging, yield, allocation, waste destination, applicable CPC/Codex/PEF guidance, or availability of stronger evidence replacing a reasoned estimate."
