  data_quality_requirements:
    - id: dq_identity_scope
      applies_to: "product identity"
      requirement: "Trace species, origin, raw state, presentation, CPC scope, and preservation route; demonstrate South American white shrimp compatibility when using the selected Tiangong flow or document a reviewed alternative flow."
