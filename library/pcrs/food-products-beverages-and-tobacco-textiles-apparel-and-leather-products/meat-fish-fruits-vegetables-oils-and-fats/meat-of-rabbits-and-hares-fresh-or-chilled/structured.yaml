validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
    rule: "Confirm CPC 21114, species, fresh-or-chilled state, exclusion of frozen meat and offal, net mass, presentation, and plant-gate release."
    source_ids:
      - un-cpc-v3-2025
  - rule_id: validate_reference_uuid
    applies_to: "reference flow"
    rule: "Confirm that the reference output alone uses UUID 6fb95713-8813-4a4e-a0cd-1a3139e8347a, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids: []
  - rule_id: validate_process_completeness
    applies_to: "foreground process map"
    rule: "Confirm all six required process records exist and that any off-site wastewater treatment is linked rather than omitted."
    source_ids:
      - ec-jrc-sa-bref-2024
  - rule_id: validate_atomic_inventory
    applies_to: "inventory"
    rule: "Reject collection labels and require separate rows for each species, material, utility, fuel, refrigerant, chemical, packaging item, waste, co-product, and elementary emission."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-pef-2021
  - rule_id: validate_mass_balance
    applies_to: "receiving, slaughter, cutting, chilling, and packaging"
    rule: "Reconcile measured inputs, conforming outputs, specific co-products, specific wastes, rejects, and stock change for every lot and investigate unexplained differences."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-pef-2021
  - rule_id: validate_energy_refrigerant
    applies_to: "utilities and refrigeration"
    rule: "Reconcile stage electricity and each thermal fuel separately; reconcile each refrigerant from opening charge, make-up, recovery, closing charge, and transfer records."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-pef-2021
  - rule_id: validate_effluent
    applies_to: "wastewater treatment"
    rule: "Match effluent volume and each reported pollutant load to the same sampling period, analytical result, discharge route, and operating record."
    source_ids:
      - ec-jrc-sa-bref-2024
  - rule_id: validate_transparency
    applies_to: "published dataset"
    rule: "Retain company-specific records, allocation choices, exclusions, data gaps, factors, representativeness, and quality evidence sufficient for independent review."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground production dataset for fresh or chilled rabbit or hare meat at the processing-plant gate"
  downstream_use: "secondary_dataset; background_dataset when reviewed and representative for the consuming model"
  allowed_use: "Link to downstream food products and lifecycle models whose species, product state, presentation, geography, technology, period, allocation, and quality needs match the dataset"
  excluded_use: "Frozen meat, edible offal as the reference product, other species, live-animal production, retail or use-stage modelling, or an unmatched technology or allocation context"
  required_metadata: "PCR id; CPC 21114; reference UUID; species; presentation; bone-in status; offal exclusion; fresh-or-chilled condition and temperature; net mass; packaging; site; geography; technology; period; process coverage; allocation; destinations; upstream and downstream links"
  required_quality_disclosure: "Company-specific data coverage; meter and scale coverage; laboratory methods; mass-balance closure; allocation sensitivity; refrigerant balance; data gaps; exclusions; substitutions; dataset quality and representativeness"
  update_trigger: "Change in species mix, product presentation, process route, chilling system, refrigerant, fuel, cleaning chemistry, wastewater route, packaging format, allocation basis, site, regulation, or representative period"
