allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "slaughter, dressing, and cutting"
    rule: "Use subdivision or direct metering to assign separately measurable operations to rabbit meat, hare meat, edible organs, skins, blood, fat, meat trimmings, and other outputs before applying allocation."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_causal_then_economic
    applies_to: "unavoidable multifunctionality"
    rule: "When subdivision cannot eliminate multifunctionality, apply a documented physical causal relationship; if no defensible physical relationship exists, use representative economic values and disclose prices, period, geography, and sensitivity."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_gross_output_records
    applies_to: "all co-products and wastes"
    rule: "Record the gross measured mass and destination of each specific output before allocation and do not net revenues, treatment credits, or avoided products against foreground inventory quantities."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-pef-2021
  - rule_id: allocation_waste_boundary
    applies_to: "waste treatment"
    rule: "Assign waste handling to the producer up to the documented waste-system boundary; any downstream recycling or substitution credit belongs to the declared downstream model and must not be embedded silently."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_animal_receiving
      process_id: "animal_receiving"
      flow_role: "Live-animal, water, electricity, acceptance, mortality, manure, and reception-wastewater records"
      record_type: "lot receipt, scale, inspection, meter, pen-cleaning, and waste records"
      raw_fields: "species; lot; supplier; arrival time; live mass; accepted mass; dead-on-arrival mass; water; electricity; manure; wastewater"
      collection_method: "Calibrated livestock scales, meters, inspection logs, and destination records"
      unit: "kg; m3; kWh"
      frequency: "Per production lot with monthly reconciliation"
      temporal_coverage: "At least one representative continuous 12-month period or the complete production campaign"
      site_scope: "All included equipment and operating areas for this process"
      aggregation_rule: "Sum each atomic flow separately by species and lot, reconcile balances, then normalize to the process quantitative reference"
      quality_evidence: "Calibration, approved specifications, signed logs, laboratory reports where applicable, and mass-balance review"
