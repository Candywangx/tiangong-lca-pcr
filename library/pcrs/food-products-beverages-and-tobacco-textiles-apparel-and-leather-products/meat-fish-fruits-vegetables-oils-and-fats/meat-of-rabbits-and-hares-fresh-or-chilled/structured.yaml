  calculation_rules:
    - id: calc_receiving_balance
      applies_to: "animal reception"
      rule: "Opening live mass plus receipts equals accepted transfer plus dead-on-arrival carcasses plus measured removals plus closing live mass; investigate differences."
      inputs:
        - species
        - receipts
        - "accepted mass"
        - "dead-on-arrival mass"
        - removals
        - "opening and closing live mass"
      output: "Species-specific receiving balance"
      source_ids:
        - ec-jrc-sa-bref-2024
    - id: calc_slaughter_balance
      applies_to: "slaughter and dressing"
      rule: "Reconcile accepted live mass to dressed carcass, each edible organ, blood, skin, inedible viscera, digestive content, wastewater-carried solids where quantified, and stock change."
      inputs:
        - "species-specific slaughter and destination records"
      output: "Species-specific slaughter mass balance"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-pef-2021
    - id: calc_cutting_balance
      applies_to: "carcass finishing and cutting"
      rule: "Reconcile dressed carcass input to prepared meat, edible fat, edible meat trimming, bone, inedible trimming, wastewater-carried solids where quantified, and stock change."
      inputs:
        - "species-specific cutting records"
      output: "Species-specific cutting mass balance"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-pef-2021
    - id: calc_fuel_co2
      applies_to: "direct fuel combustion"
      rule: "Multiply each fuel energy record by its documented site, supplier, or regulatory fossil-carbon factor without combining fuels."
      inputs:
        - "fuel identity"
        - energy
        - factor
        - "factor source and validity period"
      output: "Fossil CO2 for one fuel and process"
      source_ids:
        - eu-pef-2021
    - id: calc_refrigerant_loss
      applies_to: "chilling and refrigerated holding"
      rule: "Opening charge plus make-up minus recovered quantity minus closing charge minus documented transfers equals loss to air for each refrigerant."
      inputs:
        - "refrigerant identity"
        - "opening charge"
        - make-up
        - recovery
        - "closing charge"
        - transfers
      output: "Loss to air for one refrigerant"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-pef-2021
    - id: calc_effluent_load
      applies_to: "wastewater discharge"
      rule: "Multiply matched treated-effluent volume by the laboratory concentration for one pollutant and convert units explicitly."
      inputs:
        - "effluent volume"
        - "pollutant concentration"
