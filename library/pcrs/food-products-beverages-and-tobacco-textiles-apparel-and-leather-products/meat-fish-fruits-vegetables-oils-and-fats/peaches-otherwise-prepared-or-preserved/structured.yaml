    - rule_id: boundary_foreground_operations
      applies_to: "all foreground processes"
      rule: "Include all directly controlled operations and utilities from declared facility receipt through release of the packed product, including measured rejects, wastewater, and direct emissions."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_upstream_links
      applies_to: "purchased inputs and external treatment"
      rule: "Represent material purchased inputs, packaging, energy carriers, water supply, transport in scope, and external waste treatment with traceable upstream or downstream datasets."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_route_exclusivity
      applies_to: "preservation and packing"
      rule: "Instantiate exactly one declared preservation route for the reference product. Treat canned_heat_preservation as a covered route and not as the default for all products in the category."
      source_ids:
        - unsd-cpc-3-0-21492
        - codex-cxs-242-2003
    - rule_id: boundary_exclusions
      applies_to: "downstream life cycle and products classified elsewhere"
      rule: "Keep distribution, retail, use, and end-of-life outside this facility-gate dataset, and do not use this PCR for the excluded product categories listed in section 1."
      source_ids:
        - unsd-cpc-3-0-21492
        - eu-pef-2021-2279
