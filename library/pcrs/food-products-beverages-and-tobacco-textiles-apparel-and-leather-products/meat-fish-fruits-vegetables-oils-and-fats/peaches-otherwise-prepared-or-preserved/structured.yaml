allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "independently measurable routes, products, and operations"
    rule: "Avoid allocation by separating the exclusive preservation routes and by subdividing independently measured operations, batches, utilities, and waste handling."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_coproduct_status
    applies_to: "pits, kernels, peels, pulp, recovered medium, or other marketed outputs"
    rule: "Determine output status from documented destination. Treat an output with a market or productive use as a co-product; treat material sent for treatment without productive use as waste."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residual_burdens
    applies_to: "unavoidable shared burdens after subdivision"
    rule: "Apply a documented causal physical relation where one can be demonstrated. If no defensible physical relation exists, use a documented economic relation consistent with the study method and disclose values, period, sensitivity, and assigned shares."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recovery_claims
    applies_to: "recovered material and exported energy"
    rule: "Do not subtract avoided burdens or recovery credits unless the chosen study method explicitly requires them; report the method, substituted function, data source, and sensitivity separately."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_records
      process_id: "receiving_sorting"
      flow_role: "received peaches, water, accepted transfer, rejects, and discharge"
      record_type: "weigh tickets, batch sheets, water meters, and discharge records"
      raw_fields: "delivery_id; supplier; origin; feedstock_state; received_mass; reject_mass; accepted_mass; water_supply; recirculated_water; discharge; timestamp"
      collection_method: "record each delivery and reconcile to production batch"
      unit: "kg and m3"
      frequency: "each delivery and batch"
      temporal_coverage: "complete declared reference period including representative incoming quality"
      site_scope: "all receiving and washing lines in dataset scope"
      aggregation_rule: "sum by route and product specification, then normalize to accepted output and reference product as stated"
      quality_evidence: "calibrated-scale and meter records; batch reconciliation; exception log"
    - protocol_id: cp_preparation_records
      process_id: "peach_preparation"
      flow_role: "preparation inputs, output, residues, and wastewater"
      record_type: "batch sheets, scales, issue records, meters, and destination tickets"
      raw_fields: "batch_id; input_mass; water; aid_identity; aid_mass; prepared_output_mass; residue_mass_by_destination; discharge; product_state"
      collection_method: "record each preparation batch and reconcile input, output, retained liquid, residues, and discharge"
      unit: "kg and m3"
      frequency: "each batch"
      temporal_coverage: "complete declared reference period with normal and changeover operation"
      site_scope: "all preparation lines in dataset scope"
      aggregation_rule: "aggregate separately by product form and preparation technology before normalization"
      quality_evidence: "calibration records; formulation or aid issue records; mass- and water-balance review"
    - protocol_id: cp_preservation_materials
      process_id: "preservation_packing"
      flow_role: "peach transfer, formulation ingredients, and packaging components"
      record_type: "batch formulations, scales, ingredient issues, packaging issues and returns"
      raw_fields: "route; batch_id; peach_input_mass; ingredient_identity; ingredient_mass; package_component; component_mass_or_count; unused_return; packed_units"
      collection_method: "collect each exclusive-route batch and reconcile issued and returned materials"
      unit: "kg and item"
      frequency: "each batch"
      temporal_coverage: "complete declared reference period for the selected route and package format"
      site_scope: "all preservation and packing lines in dataset scope"
      aggregation_rule: "aggregate only within one route, formulation, and package format before normalization"
      quality_evidence: "approved batch sheet; scale checks; inventory reconciliation; package specification"
    - protocol_id: cp_preservation_energy
      process_id: "preservation_packing"
      flow_role: "energy, utilities, and direct releases"
      record_type: "submeters, invoices, fuel logs, equipment logs, and reviewed factor calculations"
      raw_fields: "route; batch_id; carrier; meter_start; meter_end; allocation_driver; fuel_quantity; equipment_charge; refill; recovered_charge; emission_factor_id"
      collection_method: "meter by route where feasible; otherwise allocate documented facility records using a causal operating driver"
      unit: "recorded carrier unit, MJ, kWh, and kg substance"
      frequency: "each batch or meter interval"
      temporal_coverage: "complete declared reference period including start-up, shutdown, and cleaning attributable to production"
      site_scope: "all preservation utilities and direct-release equipment in dataset scope"
      aggregation_rule: "aggregate by carrier and substance for the selected route; disclose all conversions and allocations"
      quality_evidence: "meter calibration; invoices; equipment service records; factor identity and version"
    - protocol_id: cp_preservation_outputs
      process_id: "preservation_packing"
      flow_role: "packed output, process loss, packaging scrap, and wastewater"
      record_type: "net-content checks, batch release, waste weights, inventory reconciliation, and discharge records"
      raw_fields: "route; batch_id; mass_basis; packed_net_mass; drained_mass_if_used; product_loss; waste_class; waste_destination; discharge"
      collection_method: "record each batch and keep product, package, and discharge records separate"
      unit: "kg and m3"
      frequency: "each batch"
      temporal_coverage: "complete declared reference period for the selected route"
      site_scope: "all filling, preservation, packing, and cleaning operations in dataset scope"
      aggregation_rule: "reconcile outputs to material and water inputs, then normalize to packed output"
      quality_evidence: "net-content or drained-mass checks; waste tickets; discharge meters; balance review"
    - protocol_id: cp_finished_goods
      process_id: "finished_product_release"
      flow_role: "transferred product, holding utilities, release mass, rejects, and direct releases"
      record_type: "warehouse movements, release records, submeters, service logs, and reject records"
      raw_fields: "batch_id; transfer_mass; hold_start; hold_end; storage_condition; energy_by_carrier; release_mass; reject_mass; package_count; component_mass; direct_release"
      collection_method: "track each batch from packed transfer through release at the facility gate"
      unit: "kg, item, h, carrier unit, MJ, kWh, and kg substance"
      frequency: "each movement, release, and meter interval"
      temporal_coverage: "complete declared reference period including representative holding conditions"
      site_scope: "all controlled finished-goods areas before the facility gate"
      aggregation_rule: "aggregate by product specification and holding condition; normalize to released net mass"
      quality_evidence: "release authorization; inventory reconciliation; meter and service records; exception log"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory exchanges"
      rule: "Divide the reconciled exchange total by released net product mass measured on the declared reference basis; keep packaging mass outside the denominator."
      inputs:
        - "exchange total"
        - "released net mass"
        - "mass-basis declaration"
      output: "exchange per 1 kg reference product"
      source_ids: []
    - id: calc_route_separation
      applies_to: "shared facility records"
      rule: "Assign directly measured records first; allocate only the remaining shared amount to the selected route using a documented causal driver and retain a reconciliation to the facility total."
      inputs:
        - "route meters or batch records"
        - "shared total"
        - "driver values"
      output: "route-specific exchange"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_process_mass_balance
      applies_to: "each foreground process"
      rule: "Reconcile measured inputs with product, co-product, waste, discharge, retained water, and documented stock change on consistent state and time boundaries; investigate rather than force-close material discrepancies."
      inputs:
        - "measured inputs"
        - outputs
        - "stock change"
        - "state-basis records"
      output: "documented mass-balance check"
      source_ids: []
    - id: calc_package_mass
      applies_to: "count-based package records"
      rule: "Multiply issued net component count by measured or supplier-declared component mass and retain the component-specific conversion evidence."
      inputs:
        - "issued count"
        - "returned count"
        - "component mass"
      output: "kg packaging component per reference product"
      source_ids: []
    - id: calc_direct_release
      applies_to: "direct emissions"
      rule: "Calculate substance-specific release only from collected activity records and an identified reviewed factor or material balance; preserve factor identity and units."
      inputs:
        - "fuel or equipment activity"
        - "factor or charge balance"
        - "released product mass"
      output: "kg substance per reference product"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "reference product and peach inputs"
      requirement: "Preserve the reference-flow UUID, supplier or internal flow identity, product form, selected exclusive route, packing medium or formulation, package format, mass basis, origin, and batch linkage."
      evidence: "dataset metadata, approved specification, supplier record, and batch trace"
    - id: dq_measurement
      applies_to: "mass, water, energy, count, and direct-release records"
      requirement: "Use calibrated or verified instruments where material; retain raw units, conversions, zero-use evidence, allocation drivers, and exception treatment."
      evidence: "calibration or verification record, meter or scale log, invoice, conversion record, and exception log"
    - id: dq_temporal
      applies_to: "foreground reference period"
      requirement: "Cover representative production, cleaning, start-up, shutdown, and holding conditions for the declared route; identify and justify excluded abnormal periods."
      evidence: "production calendar, batch list, meter intervals, and exclusion rationale"
    - id: dq_completeness
      applies_to: "all four foreground processes"
      requirement: "Reconcile received peach input through released reference product, co-products, wastes, wastewater, stock change, and direct releases; document missing records without substituting unstated zeros."
      evidence: "process mass and water balances, completeness checklist, and missing-data register"
    - id: dq_route_specificity
      applies_to: "preservation and packing"
      requirement: "Keep canned-route records separate from other preservation-route records and apply CXS 242-2003 only to the canned stone-fruit route."
      evidence: "route code, line or batch identifier, approved recipe, and product specification"
    - id: dq_provisional_replacement
      applies_to: "every reasoned_estimate screening envelope"
      requirement: "Treat the envelope as conditional and temporary, with no preset numeric constraint. Replace it when representative foreground records, reviewed empirical ranges, or source-backed quantitative evidence become available; record the replacement and affected batches."
      evidence: "missing-data register, replacement decision, reviewed record coverage, and versioned calculation file"
validation_rules:
  - rule_id: validation_identity
    applies_to: "manifest, reference flow, and dataset metadata"
    rule: "Confirm the canonical PCR id, Tiangong product-flow UUID, Mass UUID, Units-of-mass UUID, kg unit, and all required qualifiers exactly match the declared reference object."
    source_ids:
      - unsd-cpc-3-0-21492
  - rule_id: validation_mass_basis
    applies_to: "reference amount and process balances"
    rule: "Confirm the 1 kg quantitative reference excludes packaging mass and declares total net contents or drained peach solids for a product in liquid medium; reject an undocumented conversion between bases."
    source_ids:
      - codex-cxs-242-2003
  - rule_id: validation_route_exclusivity
    applies_to: "process map and inventory"
    rule: "Confirm exactly one preservation route is instantiated. A dataset containing both canned_heat_preservation and other_declared_preservation as concurrent routes is nonconforming."
    source_ids:
      - unsd-cpc-3-0-21492
      - codex-cxs-242-2003
  - rule_id: validation_process_coverage
    applies_to: "foreground inventory"
    rule: "Confirm all four process ids are present, each conditionally occurring flow is supported by occurrence or zero-use evidence, and all inputs, outputs, wastes, wastewater, and direct releases within the foreground boundary are addressed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_record_linkage
    applies_to: "collected and calculated values"
    rule: "Confirm every collected_record or calculated_from_collection row links to a declared protocol and reconciles to raw records on the same route, product specification, period, and mass basis."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_allocation
    applies_to: "co-products and shared operations"
    rule: "Confirm subdivision was attempted first and every residual allocation or recovery claim states method, driver, values, reference period, assigned shares, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_source_scope
    applies_to: "use of external sources"
    rule: "Confirm CPC supports only the category reference, CXS 242-2003 is used only for the canned-stone-fruit route, and PEF guidance is not treated as product-specific quantitative evidence."
    source_ids:
      - unsd-cpc-3-0-21492
      - codex-cxs-242-2003
      - eu-pef-2021-2279
  - rule_id: validation_estimate_replacement
    applies_to: "provisional screening envelopes"
    rule: "Confirm every reasoned_estimate is explicitly conditional, contains no invented source id or mandatory numeric value, and is replaced once its stated representative-record or source-evidence trigger is met."
    source_ids: []
published_dataset_profile:
  dataset_role: "Route-specific foreground production dataset suitable for review as a unit-process or aggregated facility-gate dataset"
  downstream_use: "May support secondary_dataset and background_dataset use in process or lifecyclemodel projections after methodology and data review"
  allowed_use: "Facility-gate modelling of the declared prepared or preserved peach product when route, form, packing medium or formulation, package, geography, period, mass basis, and data quality are compatible"
  excluded_use: "Fresh, solely frozen or dried, sugar-preserved, jam, jelly, marmalade, beverage, or mixed-fruit products; an undeclared mix of preservation routes; comparison across incompatible net-content bases; reviewed or published use while material provisional evidence remains unresolved"
  required_metadata: "canonical PCR id; reference-flow UUID and mass object; CPC context; exclusive preservation route; product and particle form; packing medium or formulation; net-content basis; package format; feedstock condition; facility geography; technology; reference period; allocation; cut-offs; upstream dataset identities"
  required_quality_disclosure: "raw-record coverage; calibration and conversion evidence; mass and water reconciliation; route separation; missing-data treatment; provisional screening envelopes and replacement status; source versions; allocation sensitivity; data-quality limitations"
  update_trigger: "Change in product scope, preservation route, formulation or packing medium, net-content basis, package format, feedstock condition, facility technology, energy or water system, allocation, or representative period; availability of representative records or reviewed source-backed quantitative evidence that triggers replacement of a provisional envelope"
