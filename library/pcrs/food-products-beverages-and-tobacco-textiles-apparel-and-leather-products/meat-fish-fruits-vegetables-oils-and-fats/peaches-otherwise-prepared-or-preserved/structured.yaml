system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins with peaches or a declared peach intermediate received at the processing facility and ends with the released prepared or preserved peach product at the producing facility gate. It includes directly controlled receiving, sorting, preparation, preservation, packing, finished-product handling, on-site utilities, wastes, wastewater, and direct emissions. Purchased peaches, ingredients, utilities, packaging, waste treatment, and transport outside direct control are linked as upstream or downstream datasets rather than silently omitted."
