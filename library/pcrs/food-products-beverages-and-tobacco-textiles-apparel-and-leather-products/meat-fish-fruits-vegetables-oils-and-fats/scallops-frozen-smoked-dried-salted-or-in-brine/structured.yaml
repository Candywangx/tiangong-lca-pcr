allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "multifunctional foreground operations"
    rule: "First avoid allocation through process subdivision or, where justified by the study goal, system expansion."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "inseparable shared inputs and emissions"
    rule: "If subdivision or system expansion is not feasible, allocate using a documented physical relationship that reflects the function causing the shared burden."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other
    applies_to: "no defensible physical relationship"
    rule: "Use another relationship, including economic allocation, only after documenting why the preceding options fail, the prices and period used, and sensitivity to the choice."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residue_status
    applies_to: "shells, trimmings, spent brine, and rejected product"
    rule: "Classify each output as product, co-product, or waste at the point it leaves the process; do not allocate upstream burdens to a waste flow, but include its handling and treatment."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_raw_mass_balance
      process_id: "raw_preparation"
      flow_role: "incoming scallops, water or ice, prepared output, residues"
      record_type: "batch mass balance"
      raw_fields: "lot id; species; incoming form; gross mass; edible mass; shell and reject mass; water and ice; temperature"
      collection_method: "calibrated scales, meters, production and disposition records"
      unit: "kg; °C"
      frequency: "each lot or batch"
      temporal_coverage: "representative reporting period including normal variation"
      site_scope: "reporting facility and contracted preparation under operational control"
      aggregation_rule: "reconcile inputs, outputs, retained water, and losses per batch, then production-weight"
      quality_evidence: "scale and meter calibration; lot traceability; reconciliation residual"
    - protocol_id: cp_preservation_batch
      process_id: "route_preservation"
      flow_role: "ingredients, preserved output, and waste"
      record_type: "route batch record"
      raw_fields: "route; ancillary steps; recipe masses; input and output masses; moisture; salt or salinity; glaze; drain method and time; wastewater; rejects"
      collection_method: "calibrated scales, formulation records, laboratory or validated plant measurements"
      unit: "kg; mass fraction; salinity"
      frequency: "each batch"
      temporal_coverage: "representative reporting period by route"
      site_scope: "reporting facility and declared preservation line"
      aggregation_rule: "calculate each route separately; do not average across primary routes"
      quality_evidence: "calibration; recipe issue record; test method; route-specific mass balance"
    - protocol_id: cp_preservation_energy
      process_id: "route_preservation"
      flow_role: "electricity, fuels, heat, and direct releases"
      record_type: "meter and fuel record"
      raw_fields: "meter readings; fuel quantity; energy carrier; equipment; operating time; batch throughput; direct emission measurement or factor"
      collection_method: "submeter, invoice reconciliation, fuel log, and emission monitoring or calculation"
