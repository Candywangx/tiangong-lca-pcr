system_boundary:
  rules:
    - rule_id: sb_start_gate
      applies_to: "foreground_start"
      rule: "Start at measured receipt of crude soya bean oil at the refinery gate; represent cultivation and oil extraction through upstream datasets, not duplicated foreground operations."
      source_ids:
        - us-epa-ap42-9-11-1
    - rule_id: sb_include_refining
      applies_to: "unit_operations"
      rule: "Include all route-applicable degumming, neutralisation or deacidification, washing, bleaching, deodorisation, filtration and intermediate or finished-oil storage operated by the reporting site."
      source_ids:
        - us-epa-ap42-9-11-1
    - rule_id: sb_utilities_and_treatment
      applies_to: "utilities_and_waste"
      rule: "Include on-site electricity, heat, steam, fuels, water supply, cleaning, vacuum generation, air-pollution control, wastewater treatment and residue handling attributable to the refined oil."
      source_ids:
        - eu-jrc-fdm-bref-2019
    - rule_id: sb_direct_releases
      applies_to: "elementary_flows"
      rule: "Report measured or calculated site-specific direct releases to air and water by pollutant and receiving compartment; do not substitute a generic total-release row in the final dataset."
