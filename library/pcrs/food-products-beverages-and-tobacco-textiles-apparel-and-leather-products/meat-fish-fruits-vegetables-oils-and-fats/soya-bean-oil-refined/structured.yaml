allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared_refinery_operations"
    rule: "First subdivide unit operations and directly meter inputs, outputs and releases attributable to refined soya bean oil. Use system expansion only when the declared study method permits it and the substituted function is demonstrated."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical
    applies_to: "unavoidable_shared_burdens"
    rule: "If subdivision or permitted system expansion is not feasible, allocate by a documented physical relationship that represents causal use of the shared operation; mass allocation is not automatic merely because outputs are measured in kg."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_other
    applies_to: "no_physical_relationship"
    rule: "If no defensible physical relationship exists, use another documented relationship such as economic allocation based on a representative price period; disclose prices, currency, period, shares and sensitivity."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_residue_status
    applies_to: "gums_distillate_soapstock_spent_earth"
    rule: "Determine product, co-product or waste status from specification, legal status and actual destination before allocation. Apply no avoided-burden credit inside this gate-to-gate dataset unless an explicit system-expansion scenario is separately reported."
    source_ids:
      - eu-pef-2021
      - eu-jrc-fdm-bref-2019
  - rule_id: allocation_consistency
    applies_to: "all_allocated_rows"
    rule: "Apply one internally consistent allocation set to shared inputs, direct releases and treatment burdens, and retain unallocated totals so the allocation can be audited."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_refined_output
      process_id: "process_refining"
      flow_role: "refined product and quality"
      record_type: "calibrated scale, tank reconciliation and laboratory records"
      raw_fields: "batch id; product grade; gross and tare mass; tank opening and closing stock; off-spec return; acid value; peroxide value; method; specification"
      collection_method: "reconcile dispatch, production and tank records; retain representative laboratory certificates"
      unit: "kg and method-specific quality units"
      frequency: "each batch with monthly reconciliation"
      temporal_coverage: "representative consecutive 12 months or declared campaign"
      site_scope: "all in-scope refinery lines and tanks"
      aggregation_rule: "net conforming output equals production plus opening stock minus closing stock minus returns and off-spec diversions"
      quality_evidence: "calibration, tank gauge checks, batch traceability, laboratory QA and signed reconciliation"
    - protocol_id: cp_material_inputs
      process_id: "process_refining"
      flow_role: "crude oil and refining aids"
      record_type: "weighbridge, tank, invoice, issue and concentration records"
      raw_fields: "material id; supplier; flow UUID; gross and tare mass; opening and closing stock; returned quantity; concentration; operation; lot"
      collection_method: "reconcile purchases or issues with inventory change by material"
      unit: "kg delivered and kg active substance"
      frequency: "each receipt or issue with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "all in-scope lines and common storage"
      aggregation_rule: "net input equals receipts plus opening stock minus closing stock minus returns; active mass equals solution mass times mass fraction"
      quality_evidence: "calibrated scales or meters, supplier certificates, stock reconciliation and lot traceability"
    - protocol_id: cp_water_records
      process_id: "process_refining"
      flow_role: "purchased and abstracted water"
      record_type: "supply and abstraction meters"
      raw_fields: "meter id; source; opening and closing reading; recirculated quantity; calibration; downtime estimate"
      collection_method: "read source-specific meters and separate recirculation"
      unit: "kg or m3"
      frequency: "daily or shift, aggregated monthly"
      temporal_coverage: "same period as product output"
      site_scope: "all in-scope operations and utilities"
      aggregation_rule: "sum net source withdrawals and supplies; convert volume only with documented density"
      quality_evidence: "meter calibration, completeness log and documented gap filling"
    - protocol_id: cp_energy_records
      process_id: "process_refining"
      flow_role: "electricity, steam, heat and fuels"
      record_type: "utility meters, invoices and fuel stock records"
      raw_fields: "carrier; meter id; opening and closing reading; fuel receipts; stock change; calorific value; steam pressure and dryness; shared-utility driver"
      collection_method: "reconcile meters and invoices; allocate common utilities only after direct metering"
      unit: "kWh, MJ and carrier unit"
      frequency: "shift or daily, aggregated monthly"
      temporal_coverage: "same period as product output"
      site_scope: "all in-scope operations, storage and treatment"
      aggregation_rule: "net purchased energy plus on-site generation inputs minus exports; convert with documented factors"
      quality_evidence: "meter calibration, invoice reconciliation, calorific-value evidence and allocation record"
    - protocol_id: cp_outputs_and_residues
      process_id: "process_refining"
      flow_role: "co-products, recovered materials and wastes"
      record_type: "scale, tank, manifest and destination records"
      raw_fields: "material id; status; specification; gross and tare mass; moisture; oil content; destination; treatment; opening and closing stock"
      collection_method: "weigh each transfer and reconcile storage"
      unit: "kg wet and dry basis where available"
      frequency: "each transfer with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "all in-scope operations and storage"
      aggregation_rule: "net output equals transfers plus closing stock minus opening stock; keep product and waste totals separate"
      quality_evidence: "scale calibration, product certificate or waste manifest, destination evidence and stock reconciliation"
    - protocol_id: cp_wastewater_and_releases
      process_id: "process_refining"
      flow_role: "wastewater and direct releases"
      record_type: "discharge meters, laboratory results, stack or fuel records and permits"
      raw_fields: "stream; volume; sampling time; pollutant; concentration; detection limit; compartment; control efficiency; activity data"
      collection_method: "pair concentration with same-period flow; calculate combustion releases from measured fuel only where direct monitoring is absent"
      unit: "m3, kg, mg/L and pollutant-specific units"
      frequency: "continuous or permit-defined sampling, aggregated monthly"
      temporal_coverage: "same period as product output and representative operating conditions"
      site_scope: "every in-scope discharge and emission point"
      aggregation_rule: "pollutant load equals paired concentration times discharge volume; sum measured and calculated points without overlap"
      quality_evidence: "accredited laboratory reports, meter calibration, permit records, QA blanks, detection-limit treatment and calculation sheet"
  calculation_rules:
    - id: calc_normalise
      applies_to: "all inventory rows"
      rule: "Normalised amount equals period net amount multiplied by 1 kg divided by period net conforming refined-oil output."
      inputs:
        - "reconciled row quantity"
        - "reconciled refined output"
      output: "amount per 1 kg reference flow"
      source_ids:
        - eu-pef-2021
    - id: calc_active_substance
      applies_to: "formulated chemicals"
      rule: "Active-substance mass equals delivered solution mass multiplied by supplier- or test-supported mass fraction; retain both delivered and active amounts."
      inputs:
        - "solution mass"
        - concentration
      output: "kg delivered product and kg active substance"
      source_ids:
        - us-epa-ap42-9-11-1
    - id: calc_water_load
      applies_to: "direct water releases"
      rule: "Pollutant mass equals paired concentration multiplied by discharge volume with unit conversion; document non-detect rule and do not pair mismatched periods."
      inputs:
        - concentration
        - flow
        - "sampling period"
        - "detection limit"
      output: "kg pollutant by receiving compartment"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_mass_balance
      applies_to: "oil and material balance"
      rule: "Reconcile crude oil, aids and water against refined oil, recovered products, wastes, wastewater, measured releases and documented stock change; investigate unexplained oil loss separately from water evaporation."
      inputs:
        - "all mass records"
        - "stock changes"
        - "moisture and oil content"
      output: "balance closure and unexplained residual"
      source_ids:
        - us-epa-ap42-9-11-1
        - eu-jrc-fdm-bref-2019
    - id: calc_shared_utility
      applies_to: "common utilities"
      rule: "Allocate only residual common-utility use after direct metering, using the selected documented causal driver; preserve unallocated total and shares."
      inputs:
        - "total utility"
        - "directly metered use"
        - "allocation driver"
      output: "allocated utility quantity"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and crude input"
      requirement: "Flow identities, grades, routes and UUIDs must match the actual products; proxy use requires written semantic and property compatibility review."
      evidence: "product specification, supplier data, Tiangong identity lookup and proxy review"
    - id: dq_time
      applies_to: "all foreground records"
      requirement: "Use one consistent representative period, normally a consecutive 12 months; shorter campaigns must cover stable operation and disclose start, end, shutdowns and atypical events."
      evidence: "period register, production log and representativeness statement"
    - id: dq_completeness
      applies_to: "all in-scope operations"
      requirement: "Cover every in-scope line, tank, utility, treatment unit and release point; quantify missing-record fractions and document gap filling without silently applying cut-off."
      evidence: "source register, completeness reconciliation and missing-data log"
    - id: dq_measurement
      applies_to: "material, water and energy quantities"
      requirement: "Use calibrated instruments or reconciled invoices and stock records; retain raw readings, conversion factors, uncertainty and responsible reviewer."
      evidence: "calibration certificates, invoices, meter exports and calculation workbook"
    - id: dq_quality
      applies_to: "edible-grade claims"
      requirement: "Retain specification, sampling and analytical evidence. Codex quality values may be used only where that standard is the declared applicable specification; local legal or customer requirements may be stricter."
      evidence: "laboratory certificates, method references and applicable specification"
    - id: dq_representativeness
      applies_to: "foreground and upstream datasets"
      requirement: "Report technological, geographical, temporal and precision representativeness and replace provisional reasoned ranges with reviewed evidence before publication-critical use."
      evidence: "data-quality assessment and source comparison"
validation_rules:
  - rule_id: val_identity
    applies_to: "product_identity"
    rule: "The reference flow UUID, Mass property, Units of mass group and kg unit must match this PCR; grade, route and bulk state qualifiers must be present."
    source_ids:
      - unsd-cpc-3-21612
  - rule_id: val_reference_amount
    applies_to: "quantitative_reference"
    rule: "The normalised refined-oil output must equal exactly 1 kg and every inventory amount must state the same reference-flow basis or a traceable conversion."
    source_ids:
      - eu-pef-2021
  - rule_id: val_boundary
    applies_to: "system_boundary"
    rule: "The dataset must start with crude soya bean oil at the refinery gate and include all operated refining, utility, storage, cleaning and treatment steps; excluded upstream and downstream stages must not be duplicated."
    source_ids:
      - us-epa-ap42-9-11-1
      - eu-jrc-fdm-bref-2019
  - rule_id: val_route
    applies_to: "technology_route"
    rule: "Declared chemical or physical refining route must agree with recorded unit operations and aids; zero-use conditional rows require an explicit not-applicable reason."
    source_ids:
      - us-epa-ap42-9-11-1
  - rule_id: val_mass_balance
    applies_to: "material_balance"
    rule: "The oil and total material balances must report inputs, outputs, stock changes and residuals; unexplained oil loss or an omitted major stream is an error requiring correction or documented investigation."
    source_ids:
      - us-epa-ap42-9-11-1
      - eu-jrc-fdm-bref-2019
  - rule_id: val_allocation
    applies_to: "multifunctionality"
    rule: "Subdivision, system expansion or allocation choice must follow the declared hierarchy, apply consistently to all shared burdens, and disclose factors and sensitivity."
    source_ids:
      - eu-pef-2021
  - rule_id: val_releases
    applies_to: "elementary_flows"
    rule: "Final data must replace aggregate release patterns with pollutant-specific elementary flows, compartments and measured or calculated amounts; wastewater sent off site must not also be reported as direct water release."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: val_food_grade
    applies_to: "product_quality"
    rule: "A food-grade claim requires applicable specification and test evidence. If Codex CXS 210-1999 is declared, refined-oil acid value must not exceed 0.6 mg KOH/g oil and peroxide value must not exceed 10 milliequivalents active oxygen/kg oil, subject to stricter applicable rules."
    source_ids:
      - codex-cxs-210-1999
  - rule_id: val_data_quality
    applies_to: "dataset_production"
    rule: "The dataset must disclose period, geography, technology, source coverage, calibration, missing data, uncertainty, proxy use and all remaining provisional estimates."
    source_ids:
      - eu-pef-2021
      - eu-jrc-fdm-bref-2019
published_dataset_profile:
  dataset_role: "Foreground refinery-gate production dataset for bulk refined soya bean oil"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Refinery-gate inventories, product footprints and lifecycle models whose product grade, route, geography, period and allocation match the dataset"
  excluded_use: "Crude-oil production, chemically modified oils, formulated or blended oils, biodiesel, retail packaged oil, or another refinery route without representativeness review"
  required_metadata: "PCR id; product and process UUIDs; product grade and specification; route and unit operations; site and geography; period; technology; bulk or packaged state; upstream crude-oil dataset; allocation; cut-off; data owners and review status"
  required_quality_disclosure: "Primary-data coverage; calibration; stock reconciliation; balance closure; missing-data treatment; proxy use; uncertainty; direct-release method; co-product or waste status; all reasoned estimates and replacements"
  update_trigger: "Material change in feed or product specification, refining route, aids, energy system, treatment, co-product destination, allocation, regulation, Tiangong identity, or data period representativeness"
