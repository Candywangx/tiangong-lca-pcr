        - eu-jrc-fdm-bref-2019
        - us-epa-ap42-9-11-1
    - rule_id: sb_exclusions
      applies_to: "downstream_and_capital"
      rule: "Exclude consumer packaging, distribution, retail, use and end-of-life. Exclude capital goods unless required by the declared study method, and disclose any added stage separately."
      source_ids:
        - eu-pef-2021
    - rule_id: sb_no_double_count
      applies_to: "recovered_materials"
      rule: "Distinguish internal recirculation from external inputs and outputs so recovered oil, condensate, water, heat and refining aids are not counted twice."
      source_ids:
        - eu-pef-2021
