allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "Shared foreground operations"
    rule: "First avoid allocation through process subdivision, separate metering and lot-specific material and energy records wherever the relevant operations can be distinguished."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_upstream_organs
    applies_to: "Whole-fish or viscera inputs yielding liver, roe and other outputs"
    rule: "Carry the upstream dataset and its documented multifunctionality treatment to the separation point; include every co-product and residual, and do not assign zero burden solely because an organ was formerly treated as low value."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_then_other
    applies_to: "Remaining inseparable multifunctionality"
    rule: "When subdivision or system expansion is not applicable, use a documented physical relationship that reflects the causal relationship; if no defensible physical relationship exists, use an economic or other justified relationship and report prices, reference period and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_status
    applies_to: "Residual and waste outputs"
    rule: "Document legal or contractual waste status, treatment destination, credits and burdens consistently; marketable or internally used outputs shall not be silently classified as waste."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "receipt_separation_washing_grading_chilling_storage_packing_dispatch"
      flow_role: "Incoming, intermediate, product, co-product and residual mass"
      record_type: "Weighing and lot records"
      raw_fields: "lot_id; species; origin; incoming_form; separation_location; gross_mass; net_mass; tare; output_mass; destination; timestamp"
      collection_method: "Calibrated scales and reconciled production records"
      unit: "kg"
      frequency: "Each lot and material movement"
      temporal_coverage: "At least one representative continuous 12-month period or the full campaign when seasonal"
      site_scope: "Each foreground facility and relevant line"
      aggregation_rule: "Sum by lot and normalize to net reference output; retain separate species and product forms"
      quality_evidence: "Calibration records, tare checks, lot reconciliation and signed production records"
    - protocol_id: cp_water_records
      process_id: "washing_grading"
      flow_role: "Process water"
      record_type: "Meter or batch records"
      raw_fields: "meter_start; meter_end; batch_volume; product_contact_use; cleaning_use; lot_id"
      collection_method: "Submetering preferred; otherwise documented batch measurement or defensible allocation"
      unit: "kg or m3"
      frequency: "Each batch or daily with lot allocation"
      temporal_coverage: "Same period as production data"
      site_scope: "Each foreground facility and water source"
      aggregation_rule: "Convert volume with declared density when needed, allocate by measured driver and normalize to reference output"
      quality_evidence: "Meter calibration, invoices, allocation rationale and water-source identity"
    - protocol_id: cp_cold_chain_records
      process_id: "chilling_storage"
