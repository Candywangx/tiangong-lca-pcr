validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "Product identity"
    rule: "Fail when the output is not edible fish liver and/or roe in fresh or chilled state, or when excluded preservation methods or product forms are present."
    source_ids:
      - unsd-cpc-3-0-21225
  - rule_id: validate_reference_flow
    applies_to: "Reference flow"
    rule: "Fail unless the reference output is exactly 1 kg net product using the specified product-flow, Mass-property and unit-group UUIDs and all required qualifiers are declared."
    source_ids:
      - unsd-cpc-3-0-21225
  - rule_id: validate_boundary_processes
    applies_to: "Process coverage"
    rule: "Fail when receipt/inspection, applicable separation, preparation, chilling/cold storage, packing, wastewater/residual handling or required upstream dataset linkage is missing without a documented scope reason."
    source_ids:
      - codex-cxc-52-2003
      - eu-pef-2021-2279
  - rule_id: validate_cold_chain_records
    applies_to: "Cold chain"
    rule: "Fail when storage duration, temperature-control method, energy or ice route, or applicable refrigerant records are absent for foreground-controlled chilling and storage."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_mass_balance
    applies_to: "Material flows"
    rule: "Fail when product, co-product, residual, waste and stock-change records cannot be reconciled to incoming material on a consistent wet-mass basis or the unexplained difference is not investigated and disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "Multifunctionality"
    rule: "Fail when a multifunctional separation or shared operation lacks avoided-allocation analysis, complete output inventory, selected allocation rationale, factors and sensitivity where material."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_data_quality
    applies_to: "Dataset production"
    rule: "Fail when temporal, geographic, technological, completeness, calibration or source-traceability evidence required by section 8 is missing or material gaps are undisclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_reasoned_estimates
    applies_to: "Provisional ranges"
    rule: "Flag each retained reasoned_estimate for reviewer replacement; it shall not be represented as an industry benchmark or source-backed allowed range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production data package that may be published after review as a secondary_dataset and/or background_dataset"
  downstream_use: "Construction of product flows, unit processes, aggregated processes and lifecyclemodel projections for fresh or chilled fish liver/roe supply"
  allowed_use: "Studies whose product identity, starting condition, production route, geography, technology, time period, allocation and preservation state match the declared dataset"
  excluded_use: "Frozen, salted, smoked, cooked, canned, fermented, prepared-caviar, oil, whole-fish, fish-meat, retail, cooking or consumption modelling without an explicit scope extension"
  required_metadata: "PCR id and version; species/origin; liver/roe form; incoming condition; separation location; facility and geography; technology; reporting period; net-mass basis; cold-storage duration; temperature-control route; packaging; upstream datasets; allocation; cut-offs; data sources"
  required_quality_disclosure: "Protocol coverage; measured versus calculated values; unresolved UUIDs; retained reasoned estimates; mass-balance closure; data gaps; allocation sensitivity; cold-chain records; representativeness and uncertainty limitations"
  update_trigger: "Material change in species mix, origin, incoming form, separation point, process route, refrigeration system, storage duration, packaging, allocation, regulation, source evidence or foreground data quality"
