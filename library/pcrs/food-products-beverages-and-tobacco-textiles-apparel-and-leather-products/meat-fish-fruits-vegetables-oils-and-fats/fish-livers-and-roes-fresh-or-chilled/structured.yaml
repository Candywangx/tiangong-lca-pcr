    - id: calc_mass_balance
      applies_to: "Each material transformation"
      rule: "Compare wet input mass with product, co-product, residual, wastewater-carried solids and documented stock change on the same weighing basis; investigate unexplained difference."
      inputs:
        - "Input and output masses"
        - "stock change"
        - "moisture or drainage basis"
      output: "Lot mass-balance closure and unexplained difference"
