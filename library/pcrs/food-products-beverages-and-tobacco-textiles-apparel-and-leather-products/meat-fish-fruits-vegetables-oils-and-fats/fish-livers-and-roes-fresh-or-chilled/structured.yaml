  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "Divide the period or lot amount assigned to this product by net reference product output; keep packaging and free ice outside the denominator."
      inputs:
        - "Assigned flow amount"
        - "net product kg"
      output: "Flow amount per 1 kg reference product"
      source_ids:
