allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "allocation_subdivide_first: Keep preparation and the selected preservation route at lot or line level and subdivide shared utilities whenever records permit. Do not average inactive routes into the reference product."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "allocation_physical_then_economic: Where subdivision or system expansion is not feasible, use a physical relationship that reflects the process causality. Mass allocation is allowed only when mass is a defensible causal relationship and the same declared mass basis is used. If no defensible physical relationship exists, use economic allocation with representative prices, period, geography, and sensitivity disclosed, following the PEF hierarchy."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "allocation_non_food_outputs: Food rejects, inedible fractions, spent brine, and wastes receive no edible reference product. If an output is sold or used as a non-food co-product, document its quantity, destination, substituted function if any, allocation treatment, and the effect of treating it as waste instead."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_mass_quality
      process_id: "prepare_molluscs"
      flow_role: "received, prepared, rejected, and qualifying masses and quality"
      record_type: "weighbridge/batch/quality records"
      raw_fields: "lot_id; taxon; supplier/source; prior_state; received_mass; prepared_mass; reject_mass; edible_status; temperature; timestamp"
      collection_method: "calibrated scales plus acceptance and release records"
      unit: "kg; °C where applicable"
      frequency: "each lot"
      temporal_coverage: "representative production period, with season disclosed"
      site_scope: "each included facility"
      aggregation_rule: "sum by lot and reconcile transfers before normalization"
      quality_evidence: "calibration, lot traceability, acceptance/release record, discrepancy explanation"
    - protocol_id: cp_preparation_records
      process_id: "prepare_molluscs"
      flow_role: "water, wastewater, rejects, and preparation operations"
      record_type: "meter/batch/waste records"
      raw_fields: "lot_id; operation; water_reading; wastewater_reading_or_balance; reject_type; reject_mass; destination; operating_time"
      collection_method: "submeters where available; documented allocation otherwise"
      unit: "kg or m3 with density; kg waste"
      frequency: "each lot or meter period"
      temporal_coverage: "same period as product records"
      site_scope: "each included line/facility"
      aggregation_rule: "allocate only across documented drivers and retain raw totals"
      quality_evidence: "meter identification, density/conversion, destination receipt, allocation check"
    - protocol_id: cp_frozen_route_records
      process_id: "freeze_product"
      flow_role: "transfers, electricity, glaze, packaging, refrigerant, and frozen output"
      record_type: "meter/line/service records"
      raw_fields: "lot_id; input_mass; output_mass; electricity; storage_time; glaze_added; glaze_percent; packaging_by_material; refrigerant_charge_and_service"
      collection_method: "batch meters, scales, packing records, and refrigerant service mass balance"
      unit: "kg; kWh; h"
      frequency: "each lot; service event for refrigerant"
      temporal_coverage: "representative frozen-route campaigns"
      site_scope: "each included freezing line"
      aggregation_rule: "sum by lot, allocate shared refrigeration by documented operating driver, normalize to glaze-excluded output"
      quality_evidence: "meter and scale calibration, service logs, glaze test, allocation rationale"
    - protocol_id: cp_smoke_dry_records
      process_id: "smoke_or_dry_product"
      flow_role: "transfers, energy carriers, smoking medium, packaging, moisture, residues, and output"
      record_type: "batch/meter/quality records"
      raw_fields: "lot_id; technique; input_mass; output_mass; electricity; fuel; heat; smoking_material; packaging_by_material; moisture; residue_mass_and_destination"
      collection_method: "meters, invoices reconciled to stock, scales, and moisture test"
      unit: "kg; kWh; MJ; fuel unit; mass fraction"
      frequency: "each lot or meter period"
      temporal_coverage: "representative technique-specific campaigns"
      site_scope: "each included smoking/drying line"
      aggregation_rule: "retain energy carriers separately, allocate shared use by documented driver, normalize to as-sold output"
      quality_evidence: "meter/scale calibration, fuel reconciliation, moisture method, waste receipt"
    - protocol_id: cp_salt_brine_records
      process_id: "salt_or_brine_product"
      flow_role: "transfers, salt, brine water, salinity, packaging, spent brine, drained mass, and output"
      record_type: "batch/quality/discharge records"
      raw_fields: "lot_id; technique; input_mass; salt_charge; water_charge; reuse; brine_salinity; product_salt_content; net_contents; drained_mass; drainage_method; packaging_by_material; spent_brine_mass; destination"
      collection_method: "scales, batch sheets, salinity test, standardized declared drainage method, and discharge records"
      unit: "kg; salinity or mass fraction"
      frequency: "each lot"
      temporal_coverage: "representative dry-salt or brine campaigns"
      site_scope: "each included curing line"
      aggregation_rule: "close salt/water balance where practicable and normalize to declared net or drained output"
      quality_evidence: "calibration, salinity method, drainage method, batch reconciliation, destination receipt"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all selected route inventories"
      rule: "normalized amount = route-attributable amount / measured qualifying reference-product mass"
      inputs:
        - "route amount"
        - "qualifying output on declared mass basis"
      output: "amount per 1 kg reference flow"
      source_ids:
        - eu-pef-recommendation-2021-2279
    - id: calc_preparation_balance
      applies_to: "prepare_molluscs"
      rule: "reconcile received mass with prepared transfer, rejects, retained material, and documented mass change; explain unresolved difference rather than forcing balance"
      inputs:
        - received
        - prepared
        - reject
        - retained
        - "and wastewater records"
      output: "preparation yield and reconciliation"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_glaze_exclusion
      applies_to: "freeze_product"
      rule: "qualifying mass = gross frozen mass - measured glaze mass - excluded packaging mass"
      inputs:
        - "gross mass"
        - "glaze test or glaze mass"
        - "packaging mass"
      output: "glaze-excluded net product mass"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_drained_mass
      applies_to: "salt_or_brine_product"
      rule: "use the declared standardized drainage result for reference mass; retain net contents and covering-liquid mass separately"
      inputs:
        - "net contents"
        - "drained mass test"
        - "drainage method"
      output: "qualifying drained product mass and conversion"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_refrigerant_release
      applies_to: "freeze_product"
      rule: "attributable release = documented system loss multiplied by a disclosed allocation share based on operating records"
      inputs:
        - charge
        - additions
        - recovery
        - "inventory change"
        - "operating driver"
      output: "substance-specific refrigerant release"
      source_ids:
        - eu-pef-recommendation-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and inputs"
      requirement: "Retain taxon, product state, route, edible status, supplier/source, and lot traceability; do not use the Cephalopod UUID for a non-cephalopod product."
      evidence: "product specification, lot and flow-identity review; unsd-cpc-3-0-21268"
    - id: dq_measurement
      applies_to: "mass, water, energy, salt, brine, moisture, glaze, and waste"
      requirement: "Use calibrated or controlled measurements and retain conversion, allocation, sampling, drainage, moisture, and salinity methods."
      evidence: "calibration and method records; codex-cxc-52-2003"
    - id: dq_representativeness
      applies_to: "all foreground values"
      requirement: "Cover representative route-specific production, disclose season, technology, geography, capacity utilization, and anomalies, and keep inactive routes out of averages."
      evidence: "campaign coverage report and PEF data-quality review; eu-pef-recommendation-2021-2279"
    - id: dq_completeness
      applies_to: "all foreground processes"
      requirement: "Reconcile lot transfers and account for material inputs, utilities, packaging, direct emissions, wastes, and treatment destinations; explain missing or zero values."
      evidence: "mass/energy checks and completeness register; eu-pef-recommendation-2021-2279"
    - id: dq_estimate_replacement
      applies_to: "every reasoned_estimate"
      requirement: "Mark estimates provisional and replace them when representative foreground records or reviewed external quantitative evidence become available; methodology review must resolve or explicitly accept remaining estimates."
      evidence: "replacement log and reviewer decision"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "validate_scope: Confirm the product is an edible mollusc in one declared covered market state and is not a non-food product, fish, crustacean, or an undeclared fresh-only product."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "validate_reference_identity: If product flow f8506281-c8fe-4960-b1eb-331d5d75811f is used, confirm the product is a cephalopod and disclose that the flow is narrower than CPC 21268; otherwise require a verified taxon-appropriate flow."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "validate_route: Require prepare_molluscs and exactly one finishing route family. Reject datasets that combine two route outputs or average inactive routes without an explicit combined-product specification and allocation model."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "validate_reference_basis: Require 1 kg qualifying output and all applicable net-mass, moisture, salt/salinity, glaze, drained-mass, packaging, geography, and period qualifiers. Recalculate the normalization from raw records."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "validate_inventory: Confirm that selected-process inputs, utilities, packaging, direct emissions, rejects, wastewater or spent brine, and output destinations are present or explicitly justified as not applicable; require traceable upstream datasets for purchased inputs."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "validate_balance_and_allocation: Reperform mass and route-transfer reconciliations and verify subdivision/allocation choices and non-food output treatment; unresolved differences or undocumented allocation make validation inconclusive."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "validate_estimates: Identify every reasoned_estimate; fail reviewed use when replacement evidence is available but not applied, or when an estimate is used as a mandatory conformance limit without explicit reviewer acceptance."
    source_ids: []
published_dataset_profile:
  dataset_role: "Route-specific foreground product dataset for a declared edible mollusc product"
  downstream_use: "May be used as a secondary_dataset or background_dataset after review and publication"
  allowed_use: "LCA process or lifecycle-model construction matching the declared taxon, route, geography, technology, time, and mass basis"
  excluded_use: "Generic representation of all CPC 21268 products from the Cephalopod UUID; non-food products; undeclared mixed routes; nutritional or food-safety certification"
  required_metadata: "PCR id; CPC reference; product-flow UUID and semantic limitation; taxon; route/technique; edible status; net/drained/glaze/moisture/salt basis; facility geography; technology; production period; storage; packaging; upstream dataset choices; allocation"
  required_quality_disclosure: "data coverage and representativeness; measurement and conversion methods; mass reconciliation; allocation; exclusions; substitutions; estimates and uncertainty; treatment of non-food outputs"
  update_trigger: "New product-flow identity; change in taxon, route, technology, facility, specification, mass basis, or allocation; revised Codex/CPC/PEF rule; or availability of representative measurements or reviewed evidence that can replace a reasoned_estimate"
