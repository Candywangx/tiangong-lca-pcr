system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground begins when edible molluscs and ancillary materials are accepted at the processing facility and ends when the conforming preserved product is packaged and released at the factory gate. Include actual cleaning, evisceration or shell removal when performed, grading, route-specific preservation, cold or ambient holding attributable to the lot, packaging, direct water and energy use, food rejects, wastewater or spent brine, refrigerant leakage when applicable, and other direct emissions that cross the foreground boundary."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Purchased raw molluscs, ingredients, utilities, refrigerants, and packaging require linked upstream datasets. Excluded capital goods or minor inputs may be omitted only under the applicable study rules and must be disclosed; the PCR sets no unsupported numeric cut-off. Transport within the declared foreground and transport separately purchased for the lot must not be double counted."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "boundary_route_exclusivity: Include prepare_molluscs and exactly one finishing route family: freeze_product, smoke_or_dry_product, or salt_or_brine_product. A combined commercial product must be assigned to the route that defines its declared market state and must disclose any additional unit operations without activating a second reference-product route."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "boundary_non_food: Material not accepted as edible product must remain a waste or explicitly identified non-food co-product. It must not be counted in the reference flow or silently modelled as food."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "boundary_completeness: Include all material, energy, water, direct-emission, waste, and treatment flows that materially cross the declared foreground; disclose any rule-based exclusions and the rule applied."
      source_ids: []
