    applies_to: "all processes"
    rule: "Use batch-specific recipe, submeter, production-time, equipment-state, and waste records to avoid allocation wherever possible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: recipe_partition
    applies_to: "shared formulation records"
    rule: "Partition material inputs by the actual locked batch recipe and scale tickets; do not use a category-average formula."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: utility_partition
    applies_to: "shared utilities"
    rule: "Partition shared electricity, heat, refrigeration, cleaning, and wastewater records using measured process time, meter intervals, mass throughput, or another documented causal driver."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: physical_relation
    applies_to: "multi-output processes"
    rule: "Use a physical causal relation when it explains resource use or emission generation; document the relation and calculation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: mass_allocation
    applies_to: "unresolved physical split"
    rule: "Use mass allocation only when no more direct physical relation is available and all output masses share the same campaign basis."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: economic_residual
    applies_to: "residual multifunctionality"
    rule: "Use economic allocation only as a documented residual method when physical relations cannot represent the function; retain price period, geography, and sensitivity disclosure."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: rework_once
    applies_to: "internal rework"
    rule: "Do not allocate a second burden to internal rework that remains within the same locked batch mass balance."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: waste_no_credit
    applies_to: "waste outputs"
    rule: "Do not assign an avoided-product credit to a waste stream without a separately evidenced downstream substitution model outside this foreground package."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: route_no_average
    applies_to: "product families"
    rule: "Do not average fresh, cooked, fermented, dried, smoked, chilled, frozen, meat, organ, or blood routes into one reference output."
    source_ids:
      - un-cpc-3-2025
      - eu-pef-2021-2279
      - codex-cxs-192-1995
dataset_production:
  collection_protocols:
    - protocol_id: cp_animal_material_mass
      process_id: "formulation_material_receiving"
      flow_role: "animal-derived formulation inputs"
      record_type: "delivery lot mass records"
      raw_fields: "supplier lot id; species; anatomical material; receiving state; gross mass; tare mass; accepted mass; rejected mass"
      collection_method: "Calibrated receiving scale reconciled to supplier delivery documents."
      unit: "kg"
      frequency: "each delivery lot"
      temporal_coverage: "complete production campaign"
      site_scope: "all incoming animal-material receiving points"
      aggregation_rule: "Sum accepted net mass by exact material identity and allocate only to the locked batch."
      quality_evidence: "Scale calibration, supplier specification, lot traceability, acceptance record"
    - protocol_id: cp_stage_electricity
      process_id: "multiple"
      flow_role: "stage electricity"
      record_type: "submeter interval records"
      raw_fields: "meter id; opening reading; closing reading; timestamp; process state; batch id"
      collection_method: "Read a dedicated submeter; where one meter covers several batches, retain the causal attribution calculation."
      unit: "kWh"
      frequency: "each batch or metered interval"
      temporal_coverage: "complete production campaign"
      site_scope: "all included foreground stages"
      aggregation_rule: "Difference meter readings and attribute only intervals demonstrably serving the locked batch."
      quality_evidence: "Meter calibration, interval log, coverage statement"
    - protocol_id: cp_refrigerant_reconciliation
      process_id: "multiple"
      flow_role: "refrigerant makeup and release"
      record_type: "refrigerant inventory records"
      raw_fields: "refrigerant identity; opening stock; purchases; additions; recovery; transfer; closing stock; equipment id; batch attribution"
      collection_method: "Reconcile each refrigerant separately using inventory and service records."
      unit: "kg"
      frequency: "each service event and reporting campaign"
      temporal_coverage: "complete production campaign"
      site_scope: "Calculate unrecovered release separately for R717, R744, and R290; do not net different refrigerants."
      aggregation_rule: "Service invoices, cylinder weights, stock reconciliation"
      quality_evidence: "undefined"
    - protocol_id: cp_material_waste_mass
      process_id: "multiple"
      flow_role: "specific solid or product waste"
      record_type: "waste scale records"
      raw_fields: "row_id; exact material identity; gross mass; tare mass; destination; batch id"
      collection_method: "Weigh each named waste stream separately before storage or dispatch."
      unit: "kg"
      frequency: "each container or batch"
      temporal_coverage: "complete production campaign"
      site_scope: "Sum net mass by row_id and locked batch; no cross-material consolidation."
      aggregation_rule: "Scale calibration, waste ticket, destination record"
      quality_evidence: "undefined"
    - protocol_id: cp_recipe_component_mass
      process_id: "comminution_batching_mixing"
      flow_role: "recipe component"
      record_type: "batch formulation records"
      raw_fields: "component identity; supplier grade; lot id; gross mass; tare mass; actual charged mass; batch id"
      collection_method: "Use calibrated dosing scales or mass-flow records for every concrete component."
      unit: "kg"
      frequency: "each charge"
      temporal_coverage: "complete production campaign"
      site_scope: "Sum actual charged mass by exact component and reconcile to the approved locked recipe."
      aggregation_rule: "Scale calibration, recipe revision, supplier specification"
      quality_evidence: "undefined"
    - protocol_id: cp_process_utility_volume
      process_id: "comminution_batching_mixing"
      flow_role: "compressed air"
      record_type: "utility meter records"
      raw_fields: "meter id; opening reading; closing reading; pressure basis; temperature basis; batch id"
      collection_method: "Read the dedicated utility meter and preserve standard-condition conversion inputs."
      unit: "m3"
      frequency: "each batch or interval"
      temporal_coverage: "complete production campaign"
      site_scope: "Difference readings on one declared condition basis and attribute to the locked batch."
      aggregation_rule: "Meter calibration, condition-conversion record"
      quality_evidence: "undefined"
    - protocol_id: cp_intermediate_product_mass
      process_id: "multiple"
      flow_role: "specific intermediate product"
      record_type: "batch scale records"
      raw_fields: "exact intermediate name; batch id; gross mass; tare mass; net mass; treatment state"
      collection_method: "Weigh each concrete intermediate at the named process transfer."
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "complete production campaign"
      site_scope: "Sum only the one locked product route and reconcile transfers between consecutive stages."
      aggregation_rule: "Scale calibration, batch traveller, route record"
      quality_evidence: "undefined"
    - protocol_id: cp_process_water_mass
      process_id: "multiple"
      flow_role: "process water"
      record_type: "water meter or weighed charge records"
      raw_fields: "water source; meter id or scale id; opening; closing; charged mass; batch id"
      collection_method: "Meter or weigh the named process-water exchange separately from cleaning water."
      unit: "kg"
      frequency: "each batch or interval"
      temporal_coverage: "complete production campaign"
      site_scope: "Calculate net water mass on the recorded density basis and attribute to the locked batch."
      aggregation_rule: "Meter or scale calibration, water-source record"
      quality_evidence: "undefined"
    - protocol_id: cp_wastewater_volume
      process_id: "multiple"
      flow_role: "specific wastewater stream"
      record_type: "flow-meter records"
      raw_fields: "stream identity; meter id; opening; closing; timestamp; batch id"
      collection_method: "Meter each named wastewater stream before mixing with another stream."
      unit: "m3"
      frequency: "continuous total with batch reconciliation"
      temporal_coverage: "complete production campaign"
      site_scope: "Difference readings and attribute the measured volume to the locked campaign."
      aggregation_rule: "Flow-meter calibration, drainage map, batch reconciliation"
      quality_evidence: "undefined"
    - protocol_id: cp_direct_emission_measurement
      process_id: "multiple"
      flow_role: "specific direct air emission"
      record_type: "stack or workplace emission measurements"
      raw_fields: "pollutant identity; sampling point; sample time; concentration; flow; detection limit; operating state; batch id"
      collection_method: "Use validated direct monitoring or sampling for the one named pollutant."
      unit: "kg"
      frequency: "each valid sampling campaign"
      temporal_coverage: "representative operation during the production campaign"
      site_scope: "Integrate measured concentration and flow over attributable operating time; do not substitute an uncited factor."
      aggregation_rule: "Laboratory report, method id, detection limit, operating log"
      quality_evidence: "undefined"
    - protocol_id: cp_casing_mass
      process_id: "portion_forming"
      flow_role: "specific casing"
      record_type: "casing issue and return records"
      raw_fields: "casing identity; species or polymer; lot id; issued mass; returned mass; trim mass; batch id"
      collection_method: "Weigh each exact casing material issued, returned, and trimmed."
      unit: "kg"
      frequency: "each casing lot and batch"
      temporal_coverage: "complete production campaign"
      site_scope: "Issued mass minus verified return; retain trim as its own waste row."
      aggregation_rule: "Scale calibration, casing specification, issue-return log"
      quality_evidence: "undefined"
    - protocol_id: cp_purchased_heat
      process_id: "multiple"
      flow_role: "purchased steam or purchased hot water"
      record_type: "utility meter and invoice records"
      raw_fields: "carrier identity; meter id; mass or energy; inlet state; outlet state; timestamp; batch id"
      collection_method: "Meter purchased steam and purchased hot water as separate carriers."
      unit: "MJ"
      frequency: "each batch or utility interval"
      temporal_coverage: "complete production campaign"
      site_scope: "Use metered energy or calculate enthalpy only from recorded state data; never combine the two carriers."
      aggregation_rule: "Meter calibration, invoice, state record"
      quality_evidence: "undefined"
    - protocol_id: cp_internal_heat_output
      process_id: "multiple"
      flow_role: "onsite steam or onsite hot water"
      record_type: "heat-output meter records"
      raw_fields: "carrier identity; output meter id; mass; temperature; pressure; enthalpy basis; timestamp; batch id"
      collection_method: "Meter onsite-generated steam and onsite-generated hot water separately at the generator outlet and point of use."
      unit: "MJ"
      frequency: "each batch or utility interval"
      temporal_coverage: "complete production campaign"
      site_scope: "Reconcile generator output and process use by carrier; prevent double counting with purchased heat."
      aggregation_rule: "Meter calibration, state record, heat-balance reconciliation"
      quality_evidence: "undefined"
    - protocol_id: cp_fuel_inventory
      process_id: "multiple"
      flow_role: "specific fuel"
      record_type: "tank, mass-flow, or invoice records"
      raw_fields: "fuel identity; opening stock; receipts; closing stock; meter reading; density; batch id"
      collection_method: "Reconcile natural gas, diesel, and LPG separately; preserve supplier lower-heating-value data if energy conversion is required."
      unit: "kg"
      frequency: "each batch or reporting interval"
      temporal_coverage: "complete production campaign"
      site_scope: "Opening plus receipts minus closing and verified transfers, attributed only to the operating interval serving the locked batch."
      aggregation_rule: "Meter or tank calibration, invoice, supplier fuel specification"
      quality_evidence: "undefined"
    - protocol_id: cp_packaging_material_mass
      process_id: "packaging_cold_storage_release"
      flow_role: "specific packaging material"
      record_type: "packaging issue and return records"
      raw_fields: "material identity; supplier grade; lot id; issued mass; returned mass; scrap mass; batch id"
      collection_method: "Weigh each packaging material separately; do not infer one material from total pack count."
      unit: "kg"
      frequency: "each packaging lot and batch"
      temporal_coverage: "complete production campaign"
      site_scope: "Issued mass minus verified return; reconcile scrap to the matching material-specific waste row."
      aggregation_rule: "Scale calibration, supplier specification, issue-return log"
      quality_evidence: "undefined"
    - protocol_id: cp_final_product_mass
      process_id: "packaging_cold_storage_release"
      flow_role: "one concrete final product"
      record_type: "release scale and quality records"
      raw_fields: "exact product name; animal and tissue identity; formulation id; route sequence; market state; gross mass; tare mass; packaging mass; conforming net mass; batch id"
      collection_method: "Weigh conforming saleable food mass after final treatment and before including packaging mass."
      unit: "kg"
      frequency: "each released batch"
      temporal_coverage: "complete production campaign"
      site_scope: "Sum only conforming net product for one locked product row; exclude packaging and all rejects."
      aggregation_rule: "Scale calibration, release certificate, product specification, route record"
      quality_evidence: "undefined"
    - protocol_id: cp_cleaning_water_mass
      process_id: "hygiene_cleaning_sanitation"
      flow_role: "cleaning water"
      record_type: "dedicated meter records"
      raw_fields: "meter id; opening; closing; cleaning event id; equipment or area; batch attribution"
      collection_method: "Meter potable cleaning water separately from formulation and cooking water."
      unit: "kg"
      frequency: "each cleaning event"
      temporal_coverage: "complete attributable cleaning campaign"
      site_scope: "Difference readings and attribute only the cleaning event serving the locked campaign."
      aggregation_rule: "Meter calibration, sanitation schedule, event log"
      quality_evidence: "undefined"
    - protocol_id: cp_cleaning_chemical_mass
      process_id: "hygiene_cleaning_sanitation"
      flow_role: "specific cleaning chemical"
      record_type: "chemical issue records"
      raw_fields: "chemical identity; concentration as supplied; lot id; issued mass; returned mass; event id; batch attribution"
      collection_method: "Weigh sodium hydroxide, nitric acid, phosphoric acid, peracetic acid, and sodium hypochlorite separately."
      unit: "kg"
      frequency: "each cleaning event"
      temporal_coverage: "complete attributable cleaning campaign"
      site_scope: "Issued mass minus verified return for the exact chemical; retain concentration as supplied."
      aggregation_rule: "Scale calibration, safety data sheet, chemical issue log"
      quality_evidence: "undefined"
    - protocol_id: cp_wwtp_chemical_mass
      process_id: "onsite_wastewater_treatment"
      flow_role: "specific wastewater-treatment chemical"
      record_type: "chemical dosing records"
      raw_fields: "chemical identity; concentration as supplied; opening stock; receipts; closing stock; dosing meter; campaign id"
      collection_method: "Reconcile each named treatment chemical separately."
      unit: "kg"
      frequency: "each treatment campaign"
      temporal_coverage: "complete attributable treatment campaign"
      site_scope: "Opening plus receipts minus closing and verified transfer, reconciled with dosing records."
      aggregation_rule: "Scale or dosing-pump calibration, invoice, stock record"
      quality_evidence: "undefined"
    - protocol_id: cp_sludge_mass
      process_id: "onsite_wastewater_treatment"
      flow_role: "specific sludge"
      record_type: "dewatered sludge scale records"
      raw_fields: "sludge identity; gross mass; tare mass; dry matter; destination; campaign id"
      collection_method: "Weigh each named sludge separately and retain measured dry-matter content."
      unit: "kg"
      frequency: "each container or dispatch"
      temporal_coverage: "complete attributable treatment campaign"
      site_scope: "Sum net wet mass by sludge identity; disclose dry matter without converting unless required."
      aggregation_rule: "Scale calibration, dry-matter test, dispatch ticket"
      quality_evidence: "undefined"
    - protocol_id: cp_wastewater_pollutant_load
      process_id: "onsite_wastewater_treatment"
      flow_role: "specific water or air pollutant"
      record_type: "flow and laboratory records"
      raw_fields: "pollutant identity; sample point; concentration; detection limit; wastewater flow; air flow where relevant; time interval; campaign id"
      collection_method: "Use validated sampling for each named pollutant and pair it with the corresponding measured flow."
      unit: "kg"
      frequency: "each representative sampling interval"
      temporal_coverage: "complete attributable treatment campaign"
      site_scope: "Calculate load as concentration times matching flow and integrate over the attributable campaign; keep each pollutant separate."
      aggregation_rule: "Laboratory accreditation, analytical method, detection limit, flow-meter calibration"
      quality_evidence: "undefined"
  calculation_rules:
    - id: normalize_to_reference
      applies_to: "all inventory amounts"
      rule: "normalized_amount = batch_attributable_amount / net_conforming_product_mass"
      inputs:
        - batch_attributable_amount
        - net_conforming_product_mass
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: recipe_reconciliation
      applies_to: "formulation"
      rule: "recipe_difference = accepted_animal_materials + charged_components - mixture_output - named_losses"
      inputs:
        - "accepted material masses"
        - "component charges"
        - "mixture output"
        - "named losses"
      output: "recipe mass-balance difference"
      source_ids:
        - eu-pef-2021-2279
    - id: forming_reconciliation
      applies_to: "portion forming"
      rule: "forming_difference = mixture_input + casing_input - formed_product_output - casing_trim - product_reject"
      inputs:
        - "mixture mass"
        - "casing mass"
        - "formed output"
        - trim
        - reject
      output: "forming mass-balance difference"
      source_ids:
        - eu-pef-2021-2279
    - id: refrigerant_release
      applies_to: "each refrigerant"
      rule: "release = opening_stock + purchases + additions - closing_stock - recovered_mass - verified_transfers"
      inputs:
        - "refrigerant inventory fields for one chemical"
      output: "unrecovered refrigerant release"
      source_ids:
        - eu-pef-2021-2279
    - id: wastewater_pollutant_load
      applies_to: "each wastewater pollutant"
      rule: "pollutant_load = concentration × matching_wastewater_volume with documented unit conversion"
      inputs:
        - "pollutant concentration"
        - "matching flow volume"
      output: "pollutant mass"
      source_ids:
        - eu-pef-2021-2279
        - jrc-sa-bref-2024
    - id: packaging_use
      applies_to: "each packaging material"
      rule: "packaging_use = issued_mass - returned_unused_mass"
      inputs:
        - "issued mass"
        - "returned unused mass"
      output: "packaging material input"
      source_ids:
        - eu-pef-2021-2279
    - id: packaging_scrap
      applies_to: "each packaging material"
      rule: "packaging_scrap = trim_mass + damaged_mass + unrecovered_setup_mass"
      inputs:
        - trim
        - "damaged material"
        - "setup loss"
      output: "material-specific packaging waste"
      source_ids:
        - eu-pef-2021-2279
    - id: fuel_reconciliation
      applies_to: "each fuel"
      rule: "fuel_use = opening_stock + receipts - closing_stock - verified_transfers"
      inputs:
        - "stock and meter records for one fuel"
      output: "fuel mass attributable to the campaign"
      source_ids:
        - eu-pef-2021-2279
        - jrc-sa-bref-2024
    - id: heat_reconciliation
      applies_to: "steam and hot water"
      rule: "heat_difference = measured_generator_output + purchased_heat - measured_process_heat_use - measured_distribution_loss"
      inputs:
        - "carrier-specific generator"
        - purchase
        - use
        - "and loss records"
      output: "carrier-specific heat reconciliation"
      source_ids:
        - eu-pef-2021-2279
        - jrc-sa-bref-2024
    - id: yield
      applies_to: "final product"
      rule: "conforming_yield = net_conforming_product_mass / total_locked_recipe_input_mass"
      inputs:
        - "net conforming output"
        - "locked recipe input mass"
      output: "route-specific conforming yield"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference and final output"
      requirement: "Retain exact product name, animal species, skeletal meat or named organ or blood identity, formulation revision, casing or shape-forming method, ordered treatment sequence, and final market state."
      evidence: "Approved product specification and batch traveller"
    - id: dq_lot_traceability
      applies_to: "animal and recipe inputs"
      requirement: "Retain supplier, lot, receiving state, acceptance decision, and link from each concrete input to the locked batch."
      evidence: "Supplier certificate, receiving log, batch genealogy"
    - id: dq_measurement
      applies_to: "mass and utility records"
      requirement: "Use calibrated equipment and retain raw readings, tare, units, timestamps, and operator or automated record identity."
      evidence: "Calibration certificate and immutable raw record"
    - id: dq_treatment_parameters
      applies_to: "curing, fermentation, drying, smoking and heat treatment"
      requirement: "Retain actual time, temperature, humidity, airflow, smoke application, and internal product temperature fields applicable to the locked route."
      evidence: "Validated process record and control chart"
    - id: dq_cold_chain
      applies_to: "receiving, cooling and storage"
      requirement: "Retain continuous or batch-resolved temperature records and deviations for chilled or frozen material and product."
      evidence: "Temperature logger record and deviation disposition"
    - id: dq_completeness
      applies_to: "complete LCI"
      requirement: "Account for every concrete recipe component, utility carrier, refrigerant, cleaning chemical, package material, product, reject, waste stream, wastewater pollutant, and direct air emission that physically crosses the boundary."
      evidence: "Row-level completeness checklist tied to process map"
    - id: dq_mass_balance
      applies_to: "material processes"
      requirement: "Reconcile recipe, forming, treatment, packaging, product, and waste masses for the same campaign; investigate unexplained differences."
      evidence: "Signed batch mass-balance worksheet"
    - id: dq_temporal
      applies_to: "campaign data"
      requirement: "Use records from the same production campaign or a disclosed representative period with exact route equivalence."
      evidence: "Time-stamped production and utility records"
    - id: dq_specificity
      applies_to: "shared records"
      requirement: "Document every attribution driver and demonstrate that it represents the single locked product rather than a facility or CPC-category average."
      evidence: "Allocation worksheet and meter map"
    - id: dq_wastewater
      applies_to: "wastewater and pollutants"
      requirement: "Retain sampling point, method, detection limit, matching flow interval, treatment state, and laboratory accreditation."
      evidence: "Laboratory report and flow-meter record"
    - id: dq_emissions
      applies_to: "direct emissions"
      requirement: "Retain pollutant-specific monitoring or sampling method, operating state, detection limit, and temporal representativeness."
      evidence: "Monitoring report and operating log"
    - id: dq_no_defaults
      applies_to: "all quantitative rows"
      requirement: "Do not replace missing foreground data with uncited default amounts, ranges, or estimates in this candidate PCR."
      evidence: "Data-gap register identifying the missing record"
    - id: dq_source_transparency
      applies_to: "method rules"
      requirement: "Retain source identifiers and disclose where CPC scope, Codex process categories, JRC process structure, or PEF modelling rules are applied."
      evidence: "Source-to-rule traceability record"
validation_rules:
  - rule_id: val_identity
    applies_to: "reference flow"
    rule: "Reference product UUID shall equal d4e41d5c-a905-4fb7-ad9d-8f442be1f833, flow property UUID shall equal 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID shall equal 93a60a57-a4c8-11da-a746-0800200c9a66, and unit shall be kg."
    source_ids:
      - un-cpc-3-2025
  - rule_id: val_single_route
    applies_to: "dataset identity"
    rule: "Reject a package that does not lock one concrete product form, named animal and tissue or blood recipe, exact formulation revision, ordered treatment sequence, and final market state."
    source_ids:
      - un-cpc-3-2025
      - eu-pef-2021-2279
      - codex-cxs-192-1995
  - rule_id: val_scope
    applies_to: "product identity"
    rule: "Reject complete meals and any galantine, meat paste, pâté, or rillettes output that is not supplied in a casing or sausage form."
    source_ids:
      - un-cpc-3-2025
  - rule_id: val_reference_mass
    applies_to: "reference amount"
    rule: "Reference amount shall be 1 kg net conforming edible product and shall exclude packaging."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_atomic_selected_flow
    applies_to: "inventory cards"
    rule: "Reject any Selected flow that names a collection, selector, alternative list, unspecified ingredient, seasoning, casing, carrier, packaging material, waste, pollutant, or emission."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_uuid_policy
    applies_to: "inventory identity"
    rule: "Every non-reference UUID shall remain blank unless both exact hybrid-search and public state-100 direct-read evidence confirm the same atomic semantics."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_manifest_closure
    applies_to: "inventory identity"
    rule: "Every blank inventory UUID row_id shall have exactly one unresolved manifest entry with the same candidate flow and a concrete rejection reason."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_process_map
    applies_to: "process inventory"
    rule: "Every required process shall have one detailed section; each conditional process shall be present exactly when its named operation occurs in the locked route."
    source_ids:
      - eu-pef-2021-2279
      - codex-cxs-192-1995
      - codex-cxc-58-2005
  - rule_id: val_recipe_completeness
    applies_to: "formulation"
    rule: "Reject a package with any actual meat, named organ, blood, fat, water, ice, salt, spice, additive, binder, starter, or casing hidden inside an aggregate recipe row."
    source_ids:
      - eu-pef-2021-2279
      - codex-cxs-192-1995
  - rule_id: val_casing_identity
    applies_to: "portion forming"
    rule: "Require the exact animal species for natural casing or exact polymer for manufactured casing; reject a generic casing exchange."
    source_ids:
      - codex-cxs-192-1995
  - rule_id: val_energy_split
    applies_to: "utilities"
    rule: "Require separate rows for grid electricity, purchased steam, purchased hot water, onsite steam, onsite hot water, natural gas, diesel, and LPG when applicable."
    source_ids:
      - eu-pef-2021-2279
      - jrc-sa-bref-2024
  - rule_id: val_heat_double_count
    applies_to: "heat"
    rule: "Reject simultaneous counting of purchased heat and its onsite fuel-generation burden for the same heat quantity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_refrigerant_split
    applies_to: "refrigeration"
    rule: "Require separate makeup and release reconciliation for each refrigerant actually used; reject a generic refrigerant flow."
    source_ids:
      - eu-pef-2021-2279
      - jrc-sa-bref-2024
  - rule_id: val_chemical_split
    applies_to: "chemicals"
    rule: "Require one row per exact additive, curing agent, cleaning chemical, sanitiser, and wastewater-treatment chemical."
    source_ids:
      - eu-pef-2021-2279
      - codex-cxs-192-1995
      - codex-cxc-58-2005
  - rule_id: val_packaging_split
    applies_to: "packaging"
    rule: "Require one row per exact packaging material and a matching material-specific scrap row when scrap occurs."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_product_output
    applies_to: "final output"
    rule: "Exactly one concrete final-product output row shall carry the 1 kg normalized reference amount; all other final-product rows shall be not applicable."
    source_ids:
      - un-cpc-3-2025
      - eu-pef-2021-2279
  - rule_id: val_waste_split
    applies_to: "wastes"
    rule: "Require separate rows for each concrete product reject, casing trim, packaging scrap, sludge, residue, and wastewater stream that occurs."
    source_ids:
      - eu-pef-2021-2279
      - jrc-sa-bref-2024
  - rule_id: val_pollutant_split
    applies_to: "emissions"
    rule: "Require one row per named water pollutant and one row per named air emission; reject a combined pollutants or emissions row."
    source_ids:
      - eu-pef-2021-2279
      - jrc-sa-bref-2024
  - rule_id: val_mass_balance
    applies_to: "mass balance"
    rule: "Recipe, forming, treatment, final product, reject, and waste records shall reconcile for the same campaign or disclose and investigate the difference."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_nonnegative
    applies_to: "amounts"
    rule: "Reject negative mass, energy, volume, concentration, or emission values."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_foreground_modes
    applies_to: "amount production"
    rule: "Inventory amounts shall use foreground_record or calculated_value only; reject fixed_value, modelled_estimate, reasoned_estimate, and uncited ranges."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_protocol_links
    applies_to: "collection"
    rule: "Every collected_record or calculated_from_collection row shall reference an existing collection protocol."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_source_whitelist
    applies_to: "sources"
    rule: "Source ids shall be limited to the retained UN CPC 3.0 source, JRC135916, Recommendation (EU) 2021/2279, CXC 58-2005, and CXS 192-1995."
    source_ids:
      - un-cpc-3-2025
      - jrc-sa-bref-2024
      - eu-pef-2021-2279
      - codex-cxc-58-2005
      - codex-cxs-192-1995
  - rule_id: val_bilingual
    applies_to: "translation"
    rule: "English and Chinese shall preserve identical ordered process_id, row_id, direction, flow_type, Selected flow, controlled tokens, protocol ids, source ids, and normative rule ids."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_temperature_records
    applies_to: "treated products"
    rule: "Require actual time and temperature records for heat treatment and actual time, temperature, humidity, or airflow records for each applicable conditioning step."
    source_ids:
      - codex-cxc-58-2005
      - codex-cxs-192-1995
  - rule_id: val_unlisted_variant
    applies_to: "scope variants"
    rule: "Reject use of an aggregate fallback row for an in-scope unlisted species, organ, blood source, formulation component, product form, package, waste, pollutant, or emission; add an exact atomic row first."
    source_ids:
      - un-cpc-3-2025
      - eu-pef-2021-2279
      - codex-cxs-192-1995
published_dataset_profile:
  dataset_role: "secondary_dataset candidate suitable for later reviewed use as a background_dataset only when all exact-route requirements and validation rules are satisfied."
  downstream_use: "Product-specific process and lifecycle-model construction for the same concrete product form, animal-derived formulation, treatment sequence, market state, geography, technology, and period."
  allowed_use: "Use for a matching sausage or sausage-like product when the complete product identity, recipe, applicable process map, atomic inventory, allocation, data quality, and unresolved UUID disclosures are available."
  excluded_use: "Do not use as a CPC-wide average, a proxy across animal species, organs, blood sources, recipes, casing systems, treatment routes, or market states, or for complete meals and related products outside a casing or sausage form."
  required_metadata: "PCR id; CPC 21184; exact product name; animal species and anatomical material identity; formulation revision; batch id and dates; ordered route; casing or forming method; treatment controls; final state; net reference mass; packaging composition; site and geography; technology; allocation method; source ids; UUID-resolution status."
  required_quality_disclosure: "Meter and scale coverage; calibration; recipe and mass-balance differences; conditional-process applicability; cold-chain and treatment records; sampling methods and detection limits; shared-resource attribution; data gaps; unresolved UUID rows; deviations and corrective actions."
  update_trigger: "New product form, animal species, organ, blood source, formulation revision, casing, treatment technology, refrigerant, package material, waste route, pollutant, emission, site configuration, source revision, or verified Tiangong UUID."
data_sources:
  - id: "un-cpc-3-2025"
    type: "dataset"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0, retained raw structure dated 30 June 2025, code 21184, https://unstats.un.org/unsd/classifications/Econ/cpc (retrieved 2026-08-13)."
    used_for: "Exact CPC 21184 category title and semantic scope boundary, including the distinction from complete meals and related non-sausage-form products."
  - id: "jrc-sa-bref-2024"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Best Available Techniques Reference Document for the Slaughterhouses, Animal By-products and/or Edible Co-products Industries, JRC135916, EUR 31752 EN, DOI 10.2760/18199, https://publications.jrc.ec.europa.eu/repository/handle/JRC135916 (retrieved 2026-08-13)."
    used_for: "Process decomposition for animal-derived material handling, utilities, refrigeration, cleaning, wastes, wastewater treatment, and named emissions; no default quantities imported."
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279 on Environmental Footprint methods, consolidated text, https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng (retrieved 2026-08-13)."
    used_for: "Product-specific bill of materials, company-specific manufacturing data, complete LCI, allocation, data quality, reporting, and verification."
  - id: "codex-cxc-58-2005"
    type: "standard"
    reference: "Codex Alimentarius, Code of Hygienic Practice for Meat, CXC 58-2005, https://www.fao.org/fao-who-codexalimentarius/sh-proxy/pl/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXC+58-2005%2FCXC_058e.pdf (retrieved 2026-08-13)."
    used_for: "Manufactured-meat process control, sanitation, wastewater drainage, temperature control, heat-treatment parameter records, storage, and batch verification structure; no default quantities imported."
  - id: "codex-cxs-192-1995"
    type: "standard"
    reference: "Codex Alimentarius, General Standard for Food Additives, CXS 192-1995, food-category descriptions 08.3 and 08.4, https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXS+192-1995%2FCXS_192e.pdf (retrieved 2026-08-13)."
    used_for: "Official full-text taxonomy for cured, dried, fermented, heat-treated and frozen comminuted meat products and concrete natural, collagen, cellulose, and synthetic casing identities; additive limits were not imported."
