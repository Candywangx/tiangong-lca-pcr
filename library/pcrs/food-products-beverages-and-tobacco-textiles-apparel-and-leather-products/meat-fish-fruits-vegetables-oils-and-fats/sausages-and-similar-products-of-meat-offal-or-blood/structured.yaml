process_map:
  - id: formulation_material_receiving
    name: "Formulation material receiving and cold storage"
    inclusion: "required"
    inclusion_condition: "Always include for food-grade animal materials and other formulation inputs entering the facility."
    role: "Foreground receipt, lot identity, weighing, and cold-storage activity."
    quantitative_reference: "mass of each incoming material for the locked production batch"
  - id: comminution_batching_mixing
    name: "Comminution, batching and mixing"
    inclusion: "required"
    inclusion_condition: "Always include; record the exact recipe and equipment sequence used by the locked product."
    role: "Foreground size reduction, recipe dosing, and mixture preparation."
    quantitative_reference: "mass of one product-specific mixture batch"
  - id: portion_forming
    name: "Portion forming"
    inclusion: "required"
    inclusion_condition: "Always include the exact casing-filling or sausage-shape forming operation used."
    role: "Foreground filling, linking, clipping, moulding, or equivalent product-specific forming."
    quantitative_reference: "mass of one concrete formed product before treatment"
  - id: curing
    name: "Curing"
    inclusion: "conditional"
    inclusion_condition: "Include only when the locked treatment sequence contains a curing step."
    role: "Foreground salt or curing-agent contact under recorded time and temperature conditions."
    quantitative_reference: "mass of the one concrete cured intermediate"
  - id: fermentation
    name: "Fermentation"
    inclusion: "conditional"
    inclusion_condition: "Include only when the locked treatment sequence contains controlled fermentation."
    role: "Foreground starter addition and controlled fermentation."
    quantitative_reference: "mass of the one concrete fermented intermediate"
  - id: drying
    name: "Drying"
    inclusion: "conditional"
    inclusion_condition: "Include only when the locked treatment sequence contains hot-air, vacuum, or another explicitly named drying technology."
    role: "Foreground moisture removal under recorded time, temperature, humidity, and airflow."
    quantitative_reference: "mass of the one concrete dried intermediate"
  - id: smoking
    name: "Smoking"
    inclusion: "conditional"
    inclusion_condition: "Include only when the locked treatment sequence contains direct smoke or smoke-condensate treatment."
    role: "Foreground smoke generation or condensate application for one named product."
    quantitative_reference: "mass of the one concrete smoked intermediate"
  - id: thermal_processing
    name: "Thermal processing and controlled cooling"
    inclusion: "conditional"
    inclusion_condition: "Include only when the locked treatment sequence contains cooking, pasteurisation, sterilisation, or another named heat treatment."
    role: "Foreground heat treatment with documented process parameters and subsequent controlled cooling."
    quantitative_reference: "mass of the one concrete heat-treated intermediate"
  - id: packaging_cold_storage_release
    name: "Packaging, cold storage and release"
    inclusion: "required"
    inclusion_condition: "Always include the actual packaging system, final storage state, and one concrete saleable product output."
    role: "Foreground primary and secondary packaging, final temperature control, inspection, and gate release."
    quantitative_reference: "1 kg net conforming saleable product, excluding packaging"
  - id: hygiene_cleaning_sanitation
    name: "Hygiene cleaning and sanitation"
    inclusion: "required"
    inclusion_condition: "Always include product-contact and area cleaning attributable to the locked production campaign."
    role: "Foreground cleaning, rinsing, sanitation, and residue removal."
    quantitative_reference: "cleaning campaign attributable to the locked product batch"
  - id: onsite_heat_generation
    name: "Onsite heat generation"
    inclusion: "conditional"
    inclusion_condition: "Include only when steam or hot water is generated within the foreground facility."
    role: "Foreground boiler or heater operation for internally supplied steam or hot water."
    quantitative_reference: "measured onsite steam or hot-water output attributable to the locked batch"
  - id: onsite_wastewater_treatment
    name: "Onsite wastewater treatment"
    inclusion: "conditional"
    inclusion_condition: "Include only when wastewater is treated inside the foreground facility boundary."
    role: "Foreground physical, chemical, and biological treatment of the two named wastewater streams."
    quantitative_reference: "measured wastewater volume treated for the locked production campaign"
