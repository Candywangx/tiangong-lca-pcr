  classification_refs: "CPC 3.0: 21184 — Sausages and similar products of meat, offal or blood (exact)"
  covered_products: "One concrete sausage or sausage-like product made from meat, a named edible organ, or blood; includes fresh, cured, fermented, dried, smoked, cooked, chilled, frozen, or shelf-stable routes and galantine, meat paste, pâté, or rillettes only in a casing or sausage form."
  excluded_products: "Complete meals; related meat, offal, blood, galantine, meat paste, pâté, or rillettes products outside a casing or sausage form; any package that averages species, organs, blood sources, recipes, treatment routes, or market states."
  representative_product: "One product-specific 1 kg net conforming sausage or sausage-like product matching a single final-product card."
  production_route: "Exact batch sequence beginning with ingredient receipt and comprising only the named applicable operations among comminution, mixing, forming, curing, fermentation, drying, smoking, heat treatment, cooling, packaging, storage, hygiene, onsite heat generation, and onsite wastewater treatment."
  market_state: "Exactly one documented release state, such as fresh chilled, frozen, cooked chilled, fermented dried shelf-stable, or another explicit in-scope state; never a combined state."
functional_unit:
  what: "Provide one concrete, specification-conforming CPC 21184 sausage or sausage-like food product at the manufacturing facility gate."
  how_much: "1 kg net conforming edible product, excluding every packaging material."
  how_well: "Meets the locked product specification, formulation revision, process-control release criteria, and final temperature or shelf-stability condition."
  how_long_or_cycle: "One released production batch; storage duration through facility-gate release is disclosed."
  reference_flow_link: "The reference amount is assigned to exactly one concrete final-product output row in packaging_cold_storage_release; every other final-product row is not applicable."
system_boundary:
  rules:
    - rule_id: boundary_start
      applies_to: "foreground system"
      rule: "Begin at receipt of food-grade meat, named organ, blood, fat, casing, recipe component, packaging material, and purchased utility at the manufacturing facility."
      source_ids:
        - un-cpc-3-2025
        - eu-pef-2021-2279
        - codex-cxc-58-2005
    - rule_id: upstream_requirement
      applies_to: "animal and recipe inputs"
      rule: "Animal production, slaughter, ingredient manufacture, casing manufacture, packaging manufacture, and purchased energy production require separate upstream datasets."
      source_ids:
        - eu-pef-2021-2279
        - jrc-sa-bref-2024
    - rule_id: route_lock
      applies_to: "foreground package"
      rule: "One package shall represent exactly one product form, one exact animal-derived formulation, one approved recipe revision, one ordered treatment sequence, and one final market state."
      source_ids:
        - un-cpc-3-2025
        - eu-pef-2021-2279
        - codex-cxs-192-1995
    - rule_id: scope_inclusions
      applies_to: "product identity"
      rule: "Include sausages, liver or other named-organ sausages, blood sausages or puddings, and galantine, meat paste, pâté, or rillettes only when supplied in a casing or sausage form."
      source_ids:
        - un-cpc-3-2025
        - codex-cxs-192-1995
    - rule_id: scope_exclusions
      applies_to: "product identity"
      rule: "Exclude complete prepared meals and related meat, offal, blood, galantine, meat paste, pâté, or rillettes products supplied outside a casing or sausage form."
      source_ids:
        - un-cpc-3-2025
    - rule_id: route_processes
      applies_to: "treatment sequence"
      rule: "Include curing, fermentation, drying, smoking, thermal processing, freezing, or cold storage only when the locked route contains that named operation."
      source_ids:
        - codex-cxs-192-1995
        - codex-cxc-58-2005
    - rule_id: cleaning_boundary
      applies_to: "hygiene"
      rule: "Include campaign-attributable product-contact and area cleaning, each cleaning chemical, resulting wastewater, and residue removal."
      source_ids:
        - jrc-sa-bref-2024
        - codex-cxc-58-2005
    - rule_id: wastewater_boundary
      applies_to: "wastewater treatment"
      rule: "Include onsite treatment only when physically inside the foreground boundary; otherwise record each wastewater stream crossing the facility boundary."
      source_ids:
        - jrc-sa-bref-2024
        - eu-pef-2021-2279
    - rule_id: heat_boundary
      applies_to: "heat supply"
      rule: "Use purchased heat cards when heat crosses the facility boundary and onsite heat-generation cards when fuel and feedwater cross the boundary; never count both for the same heat quantity."
      source_ids:
        - eu-pef-2021-2279
        - jrc-sa-bref-2024
    - rule_id: rework_boundary
      applies_to: "rework"
      rule: "Keep internal rework inside the batch mass balance and record it once; rework imported from another campaign is a separately named product input."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: downstream_exclusion
      applies_to: "downstream stages"
      rule: "Distribution beyond the facility gate, retail, consumer preparation, use, and packaging or food end-of-life are outside the foreground boundary."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: unlisted_atomic_row
      applies_to: "unlisted valid variant"
      rule: "When an in-scope species, named organ, blood source, recipe component, casing, product form, package material, waste, pollutant, or emission is absent from the cards, add one new exact atomic row before dataset validation."
      source_ids:
        - un-cpc-3-2025
        - eu-pef-2021-2279
        - codex-cxs-192-1995
boundary_abstraction:
  declared_starting_condition: "Food-grade meat, each named edible organ, each named blood source, animal fat, casing, recipe component, packaging material, and purchased utility physically received at the sausage-manufacturing facility."
  starting_condition_role: "Foreground facility-gate inputs with upstream production represented by separate supplier or background datasets."
  product_classification_scope: "CPC 21184 only, constrained to one concrete sausage or sausage-like product route; complete meals and related products outside a casing or sausage form are excluded."
  recursive_input_rule: "An externally purchased CPC 21184 intermediate is recorded as one exact product input with its own species, anatomical material, recipe, treatment state, and supplier dataset; do not recursively reproduce its upstream manufacture inside the receiving row."
  upstream_dataset_requirement: "Require upstream datasets for animal production and slaughter, every food ingredient and additive, casing, packaging material, purchased electricity and heat, each fuel, refrigerant manufacture, cleaning chemical, and wastewater-treatment chemical."
  disclosure: "Disclose exact product identity, recipe revision, batch boundary, process sequence, applicable conditional operations, shared-resource attribution, internal rework, final state, excluded stages, and every unresolved flow UUID."
