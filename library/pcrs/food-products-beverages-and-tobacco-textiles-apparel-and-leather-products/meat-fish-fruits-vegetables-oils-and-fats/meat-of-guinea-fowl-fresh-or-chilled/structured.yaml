                - eu-pef-recommendation-2021-2279
            ranges: []
allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "all multifunctional foreground operations"
    rule: "Avoid allocation by separately metering and subdividing receiving, slaughter, cutting, chilling, packing, sanitation and wastewater-treatment operations wherever their exchanges can be directly attributed."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_physical_relation
    applies_to: "meat and saleable blood, feathers, organs, fat, bones, skin, necks or feet"
    rule: "When subdivision cannot eliminate multifunctionality, use a documented physical causal relationship only when it reflects how the process inputs and outputs change; retain measured masses and the basis for every factor."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_economic_fallback
    applies_to: "remaining saleable co-products"
    rule: "When no defensible physical relationship exists, apply the declared Environmental Footprint allocation hierarchy and use consistent, contemporaneous economic data if economic allocation is required; disclose factors and sensitivity."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_waste_destination
    applies_to: "condemned material, organic residues and recovered materials"
    rule: "Classify each stream as product, co-product or waste from its documented destination and applicable study rule; do not credit a waste without a transparent substitution or system-expansion model and linked destination dataset."
    source_ids:
      - eu-pef-recommendation-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_lairage_records
      process_id: "live_bird_receiving_lairage"
      flow_role: "live birds; drinking water; electricity; mortality; manure; litter; wastewater; ammonia"
      record_type: "receiving, scale, meter, mortality and waste records"
      raw_fields: "supplier; lot; bird count; live mass; accepted mass; water; electricity; mortality mass; manure; litter; wastewater; ammonia measurement or model fields"
      collection_method: "reconcile each lot and each separately metered or weighed exchange"
      unit: "kg; kWh"
      frequency: "each lot, with monthly utility reconciliation"
      temporal_coverage: "representative continuous 12-month period or all lots in a shorter campaign"
      site_scope: "every foreground receiving site"
      aggregation_rule: "preserve lot identity and normalize each exchange to net reference product"
      quality_evidence: "scale and meter calibration; receiving log; veterinary disposition; waste ticket; calculation workpaper"
    - protocol_id: cp_slaughter_dressing_records
      process_id: "slaughter_dressing"
      flow_role: "accepted birds; water; each utility and fuel; carcass; each co-product; each waste; each wastewater; each combustion emission"
      record_type: "line, batch, scale, meter, inspection and destination records"
      raw_fields: "live input; water; electricity; steam; hot water; natural gas; diesel; LPG; carcass mass; each organ, blood, feather, fat and waste mass; wastewater; emission fields"
      collection_method: "reconcile every slaughter lot and each named output on a common mass basis"
      unit: "kg; kWh; MJ"
      frequency: "each lot, with monthly carrier reconciliation"
      temporal_coverage: "representative continuous 12-month period or all campaign lots"
      site_scope: "every foreground slaughter line"
      aggregation_rule: "keep every carrier, co-product, waste and emission separate and normalize to net reference product"
      quality_evidence: "calibrated scales and meters; inspection record; destination ticket; fuel record; mass-balance sign-off"
    - protocol_id: cp_cutting_portioning_records
      process_id: "carcass_cutting_portioning"
      flow_role: "carcass; water; electricity; cuts; bones; skin; fat; trim; wastewater"
      record_type: "cutting batch, scale, meter and waste records"
      raw_fields: "carcass input; cut output; bone, skin, fat and trim masses; water; electricity; wastewater; stock change"
      collection_method: "reconcile each cutting batch and named output separately"
      unit: "kg; kWh"
      frequency: "each batch, with monthly meter reconciliation"
      temporal_coverage: "representative continuous 12-month period or all cutting batches"
      site_scope: "every foreground cutting line"
      aggregation_rule: "normalize each exchange to released net meat while preserving cut identity"
      quality_evidence: "scale and meter calibration; cut specification; genealogy; waste ticket; mass-balance sign-off"
    - protocol_id: cp_chilling_storage_records
      process_id: "chilling_cold_storage"
      flow_role: "carcass or cuts; water; each utility and fuel; each refrigerant; chilled output; wastes; each direct emission"
      record_type: "temperature, mass, utility, refrigerant and maintenance records"
      raw_fields: "input and output mass; temperature; water; electricity; steam; hot water; each fuel; beginning, purchase, recovery and ending mass for each refrigerant; wastes; emission fields"
      collection_method: "reconcile product mass, temperature, each carrier and each refrigerant substance independently"
      unit: "kg; kWh; MJ; degrees Celsius"
      frequency: "each lot and refrigerant service event, with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or all campaign lots"
      site_scope: "every foreground chilling and cold-storage system"
      aggregation_rule: "calculate each refrigerant loss separately and normalize all rows to net reference product"
      quality_evidence: "thermometer, scale and meter calibration; refrigerant service log; inventory reconciliation; maintenance record"
    - protocol_id: cp_packaging_release_records
      process_id: "packaging_release"
      flow_role: "chilled meat; electricity; each packaging component; reference product; off-spec product; each packaging waste"
      record_type: "issue, filling, weighing, release and waste records"
      raw_fields: "meat input; electricity; component count and mass; reusable-component use share; gross mass; tare; net mass; off-spec mass; each waste mass"
      collection_method: "reconcile each released lot, subtract tare and keep every package component separate"
      unit: "kg; kWh; item"
      frequency: "each released lot, with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or all lots"
      site_scope: "every foreground packing line"
      aggregation_rule: "normalize exactly to 1 kg conforming net product"
      quality_evidence: "scale calibration; packaging specification; issue and return log; release record; waste ticket"
    - protocol_id: cp_cleaning_sanitation_records
      process_id: "plant_cleaning_sanitation"
      flow_role: "water; each utility and fuel; each chemical; each wastewater; cloth waste; each combustion emission"
      record_type: "sanitation schedule, meter, issue, wastewater and emission records"
      raw_fields: "water; electricity; steam; hot water; natural gas; diesel; LPG; each formulation mass and concentration; each wastewater; cloth waste; emission fields"
      collection_method: "record every sanitation event and every named carrier, formulation, wastewater and emission independently"
      unit: "kg; kWh; MJ"
      frequency: "each sanitation event, aggregated monthly"
      temporal_coverage: "representative continuous 12-month period or all campaign events"
      site_scope: "all in-scope sanitation systems"
      aggregation_rule: "assign shared sanitation by a documented causal driver and normalize to net reference product"
      quality_evidence: "calibration; invoice; formulation specification; sanitation log; waste receipt; calculation workpaper"
    - protocol_id: cp_wastewater_treatment_records
      process_id: "onsite_wastewater_treatment"
      flow_role: "each influent; electricity; each treatment chemical; sludge; screenings; fat; each water and air emission"
      record_type: "inlet, meter, chemical, sludge, laboratory and gas records"
      raw_fields: "each wastewater quantity; electricity; each chemical mass; sludge, screenings and fat mass; matched concentration and discharge quantity for each pollutant; methane and nitrous-oxide fields"
      collection_method: "preserve each influent, treatment material, waste and emission as a separate record"
      unit: "kg; kWh; mg/L"
      frequency: "flow continuous or daily; sampling under the operating plan"
      temporal_coverage: "representative continuous 12-month period or complete campaign"
      site_scope: "complete on-site treatment boundary"
      aggregation_rule: "calculate each discharged load separately and normalize treatment rows to net reference product"
      quality_evidence: "laboratory QA; sampling plan; meter calibration; chemical record; waste receipt; calculation workpaper"
  calculation_rules:
    - id: calc_reference_normalisation
      applies_to: "every foreground row"
      rule: "normalized amount = reporting-period row amount / conforming net guinea-fowl meat output"
      inputs:
        - "collected row amount"
        - "conforming net product mass excluding tare"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-recommendation-2021-2279
    - id: calc_process_mass_balance
      applies_to: "each material process"
      rule: "residual = opening stock + measured inputs - measured outputs - closing stock; investigate the signed and absolute residual against measurement uncertainty"
      inputs:
        - "all named product"
        - "co-product and waste masses"
        - "stock change"
      output: "process mass-balance residual"
      source_ids:
        - eu-pef-recommendation-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "each named refrigerant"
      rule: "substance loss = beginning inventory + purchases + charged mass - recovered mass - returned mass - ending inventory; use direct leak measurement when available"
      inputs:
        - "substance-specific inventory and service records"
      output: "kg of one refrigerant emitted or otherwise lost"
      source_ids:
        - eu-jrc-sa-bref-2024
        - eu-pef-recommendation-2021-2279
    - id: calc_combustion_emission
      applies_to: "each named combustion air emission"
      rule: "emission mass = each separately recorded fuel quantity multiplied by its disclosed factor, summed only for the same elementary flow"
      inputs:
        - "natural gas"
        - "diesel or LPG record"
        - "fuel properties"
        - "measurement or factor"
      output: "kg of one specified air emission"
      source_ids:
        - eu-jrc-sa-bref-2024
        - eu-pef-recommendation-2021-2279
    - id: calc_effluent_load
      applies_to: "each treated-effluent emission"
      rule: "discharged mass = matched concentration multiplied by measured discharge quantity with documented density and unit conversion"
      inputs:
        - "one parameter concentration"
        - "discharge quantity"
        - "sampling representativeness"
      output: "kg of one specified water emission"
      source_ids:
        - eu-jrc-sa-bref-2024
        - eu-pef-recommendation-2021-2279
    - id: calc_packaging_component
      applies_to: "each packaging input"
      rule: "component mass = issued count multiplied by measured empty unit mass minus returned unused mass; reusable items use a documented use share"
      inputs:
        - count
        - "unit mass"
        - returns
        - "reuse history"
      output: "kg of one packaging component"
      source_ids:
        - eu-pef-recommendation-2021-2279
    - id: calc_allocation_factor
      applies_to: "each multifunctional process"
      rule: "calculate each allocation factor from the declared physical or economic variable, verify all factors sum to one, and retain the unrounded fields"
      inputs:
        - "measured output quantities"
        - "causal variable or contemporaneous economic data"
      output: "disclosed co-product allocation factors"
      source_ids:
        - eu-pef-recommendation-2021-2279
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "live birds, carcasses, cuts and released product"
      requirement: "Retain guinea-fowl species, supplier, lot, slaughter date, product form, bone and skin state, temperature state and genealogy from receipt to release."
      evidence: "receiving record; line genealogy; cut specification; release record"
    - id: dq_measurement_control
      applies_to: "mass, energy, water, refrigerant, chemical and waste records"
      requirement: "Use calibrated or verified measurement systems and retain unit, conversion, calibration status and calculation flag for every value."
      evidence: "calibration certificate; meter register; approved conversion sheet; calculation workpaper"
    - id: dq_temporal_representativeness
      applies_to: "foreground dataset"
      requirement: "Cover a representative continuous 12-month period for continuous operation or all lots in the declared campaign; disclose shutdowns, atypical lots and missing periods."
      evidence: "production calendar; completeness reconciliation; exception log"
    - id: dq_complete_lci
      applies_to: "all foreground processes"
      requirement: "Include all known material and energy inputs and all products, co-products, wastes and air or water emissions, or document process evidence that one named row is not applicable."
      evidence: "signed inventory checklist; process mass balance; applicability record"
    - id: dq_atomic_exchange_identity
      applies_to: "every inventory card"
      requirement: "Preserve one physical or chemical exchange per row; never substitute a collection label for a named carrier, refrigerant, chemical, package component, waste or emission."
      evidence: "row-level review; Tiangong lookup disposition; signed applicability checklist"
    - id: dq_cold_chain_state
      applies_to: "chilling, storage and release"
      requirement: "Retain continuous or lot-representative temperature evidence showing the product was released fresh or chilled and was not frozen."
      evidence: "calibrated temperature log; alarm record; lot release"
    - id: dq_destination_and_allocation
      applies_to: "co-products and wastes"
      requirement: "Retain destination, legal or commercial classification, quantity, allocation variable and linked treatment or receiving dataset for every material output."
      evidence: "dispatch or waste ticket; allocation workpaper; destination dataset"
    - id: dq_source_currency
      applies_to: "external classification and method rules"
      requirement: "Confirm the applicable CPC version, JRC BREF and Environmental Footprint text before activation or publication."
      evidence: "source review record; applicability statement"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Require exactly 1 kg net product, Tiangong product-flow UUID 8c683807-f79b-46a9-90e4-c005d506a98a, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_product_scope
    applies_to: "product identity"
    rule: "Require guinea-fowl identity and fresh or chilled state; reject frozen meat, fatty liver, separately sold edible offal, another bird species and prepared or preserved meat from the reference flow."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_process_route
    applies_to: "foreground route"
    rule: "Require receiving, slaughter and dressing, chilling, packaging, sanitation and release; require cutting only when performed and on-site wastewater treatment only when present."
    source_ids:
      - eu-jrc-sa-bref-2024
  - rule_id: validate_mass_balance
    applies_to: "every material process"
    rule: "Reconcile input, product, co-product, waste and stock-change masses and investigate residuals outside the site's approved measurement uncertainty."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_atomic_flows
    applies_to: "process inventory"
    rule: "Require one concrete exchange per card; keep each carrier, refrigerant substance, chemical formulation, packaging component, co-product, waste and elementary emission separate."
    source_ids:
      - eu-jrc-sa-bref-2024
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_refrigerants
    applies_to: "refrigeration systems"
    rule: "Require a separate make-up and emission record for every refrigerant substance present; mark named substances not applicable only with equipment and service-log evidence."
    source_ids:
      - eu-jrc-sa-bref-2024
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_combustion_emissions
    applies_to: "on-site fuel use"
    rule: "For every used fuel, calculate or measure fossil carbon dioxide, nitrogen oxides, sulfur oxides and primary PM2.5 separately using disclosed foreground records and factors."
    source_ids:
      - eu-jrc-sa-bref-2024
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_wastewater
    applies_to: "wastewater and on-site treatment"
    rule: "Keep ordinary-load and high-organic-load wastewater separate and report sludge, screenings, recovered fat, COD, BOD5, total nitrogen, total phosphorus, suspended solids, animal fat, methane and nitrous oxide as individual rows when applicable."
    source_ids:
      - eu-jrc-sa-bref-2024
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_allocation
    applies_to: "saleable co-products"
    rule: "Confirm subdivision was attempted first, the selected allocation relationship is documented, factors sum to one, product and waste classifications follow destinations, and sensitivity is disclosed when material."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_data_quality
    applies_to: "foreground dataset"
    rule: "Require company-specific activity data for operated processes, a complete known LCI, product-specific material and packaging records, DQ evidence, transparent calculations and a verification-ready audit trail."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_uuid_resolution
    applies_to: "non-reference inventory flows"
    rule: "Leave every non-reference flow UUID absent until flow-hybrid-search and state-100 direct readback agree on the exact atomic identity; activation or publication requires resolution or an approved explicit exception."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground company-specific dataset suitable for reviewed publication as a secondary_dataset or background_dataset"
  downstream_use: "Supports process and lifecyclemodel construction for guinea-fowl meat systems when the declared boundary, geography, technology, period and product state match"
  allowed_use: "Gate-to-gate slaughter and processing studies; broader studies with explicit upstream and downstream links; internal improvement and reviewed Environmental Footprint modelling"
  excluded_use: "Frozen guinea-fowl meat, fatty liver, separately sold edible offal, another species, prepared meat, retail, cooking or end-of-life modelling without additional datasets"
  required_metadata: "CPC 21125; reference UUID; product form; bone and skin state; fresh or chilled temperature; live-bird origin; slaughter, cutting and refrigeration route; refrigerants; co-product destinations; allocation; packaging; wastewater destination; geography; technology; reference period"
  required_quality_disclosure: "Primary-data coverage; scale and meter calibration; lot and mass-balance completeness; refrigerant reconciliation; direct-emission method; wastewater sampling; allocation factors; data gaps; proxies; DQ assessment and verification status"
  update_trigger: "Change in species or product scope, slaughter or cutting technology, refrigeration substance, packaging, allocation, wastewater route, supplier mix, site, reference period, official classification or governing method"
