validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "Require product UUID b40a9b04-158a-4482-8c52-022d30f1a99a, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and exactly 1 kg qualified product."
    source_ids:
      - unsd-cpc-30-21263
  - rule_id: validation_qualifiers
    applies_to: "product metadata"
    rule: "Fail completeness when preservation route, shell state, edible-portion basis, packaging inclusion, or any applicable moisture, salt/brine, glaze, drainage, smoking, or cooking qualifier is missing."
    source_ids:
      - unsd-cpc-30-21263
      - codex-cxc-52-2003
  - rule_id: validation_route_exclusivity
    applies_to: "process inventory"
    rule: "Require exactly one covered preservation route and reject cross-route averaging; flag an intentional combined route for separate methodology review."
    source_ids:
      - unsd-cpc-30-21263
      - codex-cxc-52-2003
  - rule_id: validation_mass_basis
    applies_to: "reference product"
    rule: "Require packaging to be excluded; require glaze exclusion for frozen product, drained product mass and disclosed drainage for brined product, and harmonized shell and composition basis before comparisons."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validation_inventory
    applies_to: "foreground processes"
    rule: "Require the three core processes, require controlled storage when its condition applies, reconcile measured inputs, outputs, wastes, and stock changes, and disclose residuals and upstream data gaps."
    source_ids:
      - codex-cxc-52-2003
      - eu-pef-2021
  - rule_id: validation_estimates
    applies_to: "reasoned estimates"
    rule: "Require each reasoned estimate to remain labelled provisional with its applicability and replacement trigger; it must not silently override foreground data or become a publication-critical allowed range."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground production dataset for one declared mussel preservation route and facility-gate output"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Route-specific process or lifecycle modelling when geography, technology, time, shell state, mass basis, packaging, storage, allocation, and data quality are compatible"
  excluded_use: "Generic averaging across preservation routes; comparison across unlike shell, edible-portion, moisture, salt/brine, glaze, drainage, or packaging bases; use of candidate reasoned estimates as reviewed default factors"
  required_metadata: "PCR id; product UUID; CPC reference; species or mix; origin; facility geography; technology; reporting period; preservation route; shell state; edible-portion basis; packaging; applicable moisture, salt/brine, glaze, drainage, smoking and cooking qualifiers; storage; allocation; cut-offs; upstream datasets"
  required_quality_disclosure: "Primary-data share; measurement and calibration evidence; temporal and route representativeness; mass-balance residuals; exclusions; proxies; allocation sensitivity; reasoned estimates and replacement status"
  update_trigger: "New reviewed route-specific evidence; changed product specification, technology, regulation, source, UUID, or system boundary; representative foreground records replacing any reasoned estimate; material mass-balance or validation failure"
