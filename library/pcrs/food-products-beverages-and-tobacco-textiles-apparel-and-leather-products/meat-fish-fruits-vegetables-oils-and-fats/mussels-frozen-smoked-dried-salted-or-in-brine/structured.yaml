measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report exactly 1 kg qualified saleable product, excluding packaging. Include shell mass only for a product declared and sold in shell; otherwise use edible mussel meat mass."
  - id: frozen_net_mass
    applies_to: "frozen route"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Exclude ice glaze and packaging from the 1 kg reference mass; record glaze water and packaging separately."
  - id: brine_drained_mass
    applies_to: "product packed in brine"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use drained mussel product mass after the declared, reproducible drainage procedure; record packing brine separately and disclose the procedure and brine strength."
  - id: route_composition_basis
    applies_to: "dried, salted, brined, or smoked route"
