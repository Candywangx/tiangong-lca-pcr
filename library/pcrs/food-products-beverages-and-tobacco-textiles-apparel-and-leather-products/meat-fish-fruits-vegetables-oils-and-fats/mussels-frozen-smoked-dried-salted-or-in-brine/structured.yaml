      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure product at release and report moisture for dried product, salt content or brine strength for salted or brined product, and smoking and cooking state for smoked product. Do not compare routes unless shell state and mass/composition basis are harmonized."
  - id: packaging_separation
    applies_to: "all routes"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Packaging is inventoried inside production but is never counted in the 1 kg product mass."
