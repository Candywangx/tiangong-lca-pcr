allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all foreground processes"
    rule: "Avoid allocation by subdividing separately metered operations and directly assigning route-specific inputs, outputs, wastes, and emissions wherever feasible."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_residuals
    applies_to: "shells, rejects, recovered materials, or other co-products"
    rule: "First distinguish waste from a co-product using the applicable study rules. Assign treatment burdens to waste; for a co-product, use a documented physical causal relationship when defensible, otherwise use economic allocation and disclose prices, period, geography, and sensitivity."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_no_cross_route
    applies_to: "shared equipment or utilities"
    rule: "Allocate shared services only among products actually using them during the reporting period; never distribute burdens from an unselected preservation route to the selected route."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_preparation_batch
      process_id: "raw_material_preparation"
      flow_role: "received mass, utilities, prepared output, rejects and effluent"
      record_type: "batch ticket, scale record, meter, invoice, waste manifest"
      raw_fields: "batch_id; species; origin; received_condition; shell_state; input_mass; water; energy_by_carrier; prepared_mass; waste_by_type"
      collection_method: "calibrated scales and meters, reconciled to batch records"
      unit: "kg; kWh; carrier-specific unit"
      frequency: "each batch with monthly reconciliation"
      temporal_coverage: "representative reporting year or disclosed campaign"
      site_scope: "each processing facility"
      aggregation_rule: "sum by flow and divide by conforming prepared or final output as specified"
      quality_evidence: "calibration records, invoices, batch traceability, waste receipts"
    - protocol_id: cp_preservation_batch
      process_id: "route_preservation"
      flow_role: "route feed, route inputs, preserved output, wastes and direct emissions"
      record_type: "batch recipe, meter, scale, process log, laboratory result"
      raw_fields: "batch_id; preservation_route; feed_mass; energy_by_carrier; water; salt; brine; smoking_medium; output_mass; moisture; salt_content; glaze_mass; drained_mass; waste; direct_emission_inputs"
      collection_method: "route-specific metering and scales with laboratory or specification checks"
