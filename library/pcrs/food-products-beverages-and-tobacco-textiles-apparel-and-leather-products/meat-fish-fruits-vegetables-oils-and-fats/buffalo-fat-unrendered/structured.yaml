  what: "Provide unrendered buffalo fatty tissue or raw buffalo fat material at a declared handoff point for a declared downstream use"
  how_much: "1 kg net product mass, excluding packaging and transport equipment"
  how_well: "Buffalo identity is traceable; the material remains unrendered; tissue/source description, intended grade or use, acceptance status, temperature state, and packaging state are declared"
