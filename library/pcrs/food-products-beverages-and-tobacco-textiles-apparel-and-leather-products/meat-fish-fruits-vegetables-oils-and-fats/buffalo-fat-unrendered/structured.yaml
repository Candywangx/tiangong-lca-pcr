allocation_rules:
  - rule_id: alloc_subdivide_first
    applies_to: "Joint slaughter, dressing, cutting, separation, chilling, packaging, and transport operations"
    rule: "Subdivide and directly assign inputs, emissions, wastes, and treatment flows that are causally attributable to unrendered buffalo-fat recovery or to another output before allocating residual joint burdens."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_joint_residual
    applies_to: "Residual joint slaughter and dressing burdens"
    rule: "When subdivision is not possible, calculate site- and period-specific economic allocation among all marketable buffalo outputs using measured output mass and matched net revenue or price records: allocation factor i = (mass i × price i) / sum(mass j × price j). Report every output, value basis, currency, period, and factor."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_no_cattle_proxy
    applies_to: "Buffalo-fat allocation"
    rule: "Do not use cattle, pig, sheep, or goat slaughter mass fractions, prices, yields, composition, or default allocation factors. Recommendation (EU) 2021/2279 provides slaughter defaults for cattle, pigs, sheep, and goats, not buffalo; absence of buffalo site data makes the allocation incomplete rather than authorising a cattle proxy."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_fat_specific_operations
    applies_to: "Fat trimming, conditioning, packaging, and delivery"
    rule: "Assign operations performed solely for the unrendered-fat output directly to that output. Do not dilute these burdens across carcass meat, offal, hide, or other joint outputs."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_waste_and_negative_value
    applies_to: "Condemned material, residues, and outputs without a positive market function"
    rule: "Record actual classification and destination. Assign treatment burdens to the process that generates the waste; apply no avoided-burden or negative-value credit unless a separately declared downstream modelling method and evidence justify it."
    source_ids:
      - eu-pef-2021-2279
      - codex-cxc-58-2005
  - rule_id: alloc_sensitivity
    applies_to: "Economic allocation result"
    rule: "If prices are volatile, related-party, missing, or materially change the result, disclose the issue and test a documented alternative price period and mass-allocation sensitivity. The reported primary model remains the site-specific economic allocation unless the study goal mandates another reviewed method."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_joint_batch
      process_id: "slaughter_fat_recovery"
      flow_role: "buffalo input, joint outputs, and allocation evidence"
      record_type: "batch production and sales/transfer records"
      raw_fields: "buffalo lot and species evidence; live or received mass; accepted and rejected status; mass of fat, carcass/meat, offal, hide/skin, bone, residues, and every other output; output destination; net revenue or matched price; currency; date"
      collection_method: "calibrated scales linked to batch records and finance or transfer records"
      unit: "kg and currency/kg"
      frequency: "each joint-production batch; prices matched to the inventory period"
      temporal_coverage: "representative production period, with season and exceptional batches disclosed"
      site_scope: "every included slaughter/cutting site"
      aggregation_rule: "sum physical quantities by output and calculate allocation from matched period-specific values; preserve zero-value and waste outputs separately"
      quality_evidence: "scale calibration; batch reconciliation; species and lot traceability; invoices or approved transfer-pricing basis; reviewer sign-off"
    - protocol_id: cp_fat_output
      process_id: "slaughter_fat_recovery_packaging_handoff"
      flow_role: "accepted unrendered-fat mass and state"
      record_type: "lot weighing and handoff record"
      raw_fields: "gross mass; tare; net mass; scale id; date/time; lot; tissue/source description; intended grade/use; acceptance status; unrendered declaration; temperature state and value; package/bulk state; handoff point"
      collection_method: "calibrated net weighing and lot inspection"
      unit: "kg and °C where applicable"
      frequency: "each lot and each handoff"
      temporal_coverage: "full inventory period"
      site_scope: "every included site and handoff"
      aggregation_rule: "sum accepted net mass by declared state; keep rejected, retained, and transferred masses separate"
      quality_evidence: "calibration certificate; lot record; state and temperature record; acceptance or dispatch documentation"
    - protocol_id: cp_utilities
      process_id: "slaughter_fat_recovery"
      flow_role: "electricity, fuels, steam, water, and provisional energy fallback"
      record_type: "meter, invoice, equipment, and production records"
      raw_fields: "meter readings; carrier; billing quantity; submeter boundary; equipment id; rated power; runtime; documented load factor if fallback used; allocation driver; conversion factor"
      collection_method: "direct metering preferred; reconciled invoice allocation second; equipment model only as labelled fallback"
      unit: "kWh, MJ, kg, or m3 by carrier"
      frequency: "meter interval or each production shift; at least monthly reconciliation"
      temporal_coverage: "same period as production output"
      site_scope: "each included facility and relevant utility boundary"
      aggregation_rule: "direct meter assignment first; otherwise allocate by documented causal driver; never use metered and fallback energy for the same carrier/period"
      quality_evidence: "meter calibration or invoice; equipment nameplate; runtime log; calculation sheet; double-count check"
    - protocol_id: cp_operating_materials
      process_id: "slaughter_fat_recovery"
      flow_role: "cleaning, sanitation, and operating materials"
      record_type: "purchase, issue, and dosing records"
      raw_fields: "material identity; amount purchased/issued; opening and closing stock; dosing record; process assignment; waste or return"
      collection_method: "inventory reconciliation and dosing logs"
      unit: "kg, L, or documented item unit"
      frequency: "each issue or batch; monthly reconciliation"
      temporal_coverage: "same period as production output"
      site_scope: "each included facility"
      aggregation_rule: "consumption = opening stock + receipts - closing stock - documented transfer; allocate shared use by documented driver"
      quality_evidence: "inventory record; supplier record; dosing equipment check"
    - protocol_id: cp_waste_emissions
      process_id: "slaughter_fat_recovery_temperature_conditioning_packaging_handoff"
      flow_role: "wastes, wastewater, direct emissions, and treatment handoff"
      record_type: "waste tickets, discharge meters, monitoring records, and emission calculations"
      raw_fields: "waste identity and mass; destination; wastewater volume and available characteristics; emitted substance and compartment; direct activity data; factor and source when calculated"
      collection_method: "direct measurement or calculation from collected foreground activity and documented factor"
      unit: "kg, m3, or parameter-specific unit"
      frequency: "each shipment or monitoring interval"
      temporal_coverage: "same period as production output"
      site_scope: "each included site and discharge/emission point"
      aggregation_rule: "sum by flow and destination/compartment; keep direct emissions separate from background-service emissions"
      quality_evidence: "weigh tickets; laboratory/monitoring record; calculation sheet; treatment acceptance record"
    - protocol_id: cp_temperature_conditioning
      process_id: "temperature_conditioning"
      flow_role: "product mass, time-temperature state, conditioning energy, refrigerant, and losses"
      record_type: "lot, logger, meter, and refrigeration-service records"
      raw_fields: "input/output mass; entry/exit time; temperature readings; set point; storage duration; energy by carrier; refrigerant type; opening/closing charge where available; additions; recovery; rejected/lost mass"
      collection_method: "calibrated scale and temperature logger; energy meter; refrigeration service mass balance"
      unit: "kg, °C, h, kWh/MJ, and kg refrigerant"
      frequency: "each lot; continuous or risk-based temperature record; each refrigerant service event"
      temporal_coverage: "full conditioning period in the inventory"
      site_scope: "each included cold room, freezer, or conditioning unit"
      aggregation_rule: "aggregate mass and energy by actual holding time and causal driver; calculate refrigerant release from verified mass balance"
      quality_evidence: "logger and scale calibration; meter records; service reports; lot reconciliation"
    - protocol_id: cp_packaging_handoff
      process_id: "packaging_handoff"
      flow_role: "packaging, internal handling, scrap, and loading"
      record_type: "material issue, return, equipment, and dispatch records"
      raw_fields: "material identity; item count; item mass; issued/returned/reused count; handling energy; scrap; product loss; dispatch lot, mass, temperature, and time"
      collection_method: "count and weigh packaging; meter or fuel log for handling; dispatch scale"
      unit: "kg, item, kWh/MJ, °C"
      frequency: "each lot or dispatch; monthly reconciliation"
      temporal_coverage: "full inventory period"
      site_scope: "each packaging and loading location"
      aggregation_rule: "convert counts with measured item mass; apply actual reuse/return cycles; normalize to net dispatched mass"
      quality_evidence: "supplier specification or sampled item weight; inventory reconciliation; dispatch record"
    - protocol_id: cp_transport_handoff
      process_id: "transport_to_handoff"
      flow_role: "delivered mass and transport service"
      record_type: "shipment, carrier, route, and receipt records"
      raw_fields: "origin/destination; mode; vehicle class; route distance; net shipped and accepted mass; payload; empty return; refrigeration condition; dispatch/receipt time and temperature; loss or rejection"
      collection_method: "carrier documents, route record, dispatch and receipt scales/loggers"
      unit: "km, kg, t·km, h, °C"
      frequency: "each shipment"
      temporal_coverage: "all included deliveries in the inventory period"
      site_scope: "each declared route and handoff"
      aggregation_rule: "tonne-kilometres = shipped net tonnes × actual distance; model return and refrigeration only from documented route data"
      quality_evidence: "bill of lading; carrier record; route evidence; dispatch/receipt reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground flows"
      rule: "normalized amount = period or batch flow amount / accepted net unrendered buffalo-fat mass at the declared reference handoff"
      inputs:
        - "matched-period flow amount"
        - "accepted handoff mass"
      output: "amount per 1 kg reference flow"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_economic_allocation
      applies_to: "Residual joint slaughter/dressing burdens"
      rule: "allocation factor i = (mass i × matched net price i) / sum(mass j × matched net price j); allocated flow to fat = residual joint flow × buffalo-fat factor"
      inputs:
        - "measured masses"
        - "matched prices or net revenues"
        - "residual joint flow after subdivision"
      output: "site-specific allocation factors and allocated buffalo-fat flow"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_energy_fallback
      applies_to: "separation_energy_provisional"
      rule: "provisional energy = sum(rated power × recorded runtime × documented load factor), separated by energy carrier; replace with metered or verified allocated energy when available"
      inputs:
        - "equipment id and rated power"
        - runtime
        - "documented load factor"
        - "accepted fat output"
      output: "provisional kWh or MJ per 1 kg reference flow with uncertainty disclosure"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "Joint batch and each conditioning/handoff process"
      rule: "residual = measured inputs - measured products - measured co-products - measured wastes - measured retained/transferred mass; report residual magnitude and explanation"
      inputs:
        - "all matched mass records"
      output: "mass-balance residual and reconciliation status"
      source_ids:
        - eu-pef-2021-2279
        - eu-fdm-bat-2019-2031
    - id: calc_refrigerant_release
      applies_to: "Refrigeration equipment"
      rule: "release = opening charge + additions - closing charge - documented recovery; allocate only to the relevant equipment, period, and products"
      inputs:
        - charge
        - addition
        - recovery
        - "and equipment/product operation records"
      output: "kg refrigerant emission per 1 kg conditioned output"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_transport_service
      applies_to: "Included delivered handoff"
      rule: "t·km = actual route km × shipped net kg / 1,000; keep empty return and refrigeration as separately documented model parameters"
      inputs:
        - "route distance"
        - "shipped mass"
        - "payload/return/cold-chain records"
      output: "t·km per delivered reference flow"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_species_state_identity
      applies_to: "Reference product and joint input"
      requirement: "Trace buffalo species, lot, unrendered state, tissue/source description, and intended grade/use through the handoff; segregate other species and rendered material."
      evidence: "supplier/animal identity; batch and lot records; product declaration; separation record; unsd-cpc-3-21513"
    - id: dq_temporal_match
      applies_to: "All foreground records"
      requirement: "Use production, utility, price, waste, conditioning, packaging, and transport records from matched periods; disclose shutdowns, exceptional batches, seasonality, and missing intervals."
      evidence: "dated records and coverage table; eu-pef-2021-2279"
    - id: dq_mass_and_allocation
      applies_to: "Joint production"
      requirement: "Reconcile batch mass and preserve every marketable or waste output used in allocation; retain source records for mass, value, currency, period, and direct-attribution decisions."
      evidence: "batch mass balance; scale calibration; invoices/transfer basis; allocation workbook; eu-pef-2021-2279"
    - id: dq_process_completeness
      applies_to: "Foreground facility"
      requirement: "Check water, energy, raw materials, waste water, direct emissions/waste gas where relevant, and residues; document zero, not applicable, excluded, or unavailable status rather than omitting a category silently."
      evidence: "process flow sheet; meter and material inventory; waste/emission register; eu-fdm-bat-2019-2031"
    - id: dq_hygiene_food_route
      applies_to: "Product intended for human consumption"
      requirement: "Retain applicable inspection/acceptance, hygienic separation, temperature, storage, contamination-control, and packaging evidence. Do not interpret this PCR as a legal compliance determination."
      evidence: "inspection/acceptance and process-control records; temperature logs; sanitation records; codex-cxc-58-2005"
    - id: dq_reasoned_estimate
      applies_to: "Provisional separation energy"
      requirement: "Keep equipment, runtime, load-factor rationale, uncertainty, and double-count checks. Replace the estimate when process submetering, a verified utility allocation, or materially changed equipment/operation becomes available."
      evidence: "equipment nameplate; runtime log; calculation and uncertainty record; replacement review"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The reference product UUID shall be 788db006-278e-41d6-ac60-d33b1d3edf34; the Mass property UUID shall be 93a60a56-a3c8-11da-a746-0800200b9a66; the Units of mass UUID shall be 93a60a57-a4c8-11da-a746-0800200c9a66; and the reference amount shall be 1 kg net product."
    source_ids: []
  - rule_id: validate_unrendered_scope
    applies_to: "Product and process boundary"
    rule: "Fail if rendering, extraction, refining, or another conversion to rendered fat is included in the default foreground or if the reference output is tallow, oil, a fraction, or another rendered product."
    source_ids:
      - unsd-cpc-3-21513
      - codex-cxs-211-1999
  - rule_id: validate_buffalo_identity
    applies_to: "Product and allocation"
    rule: "Fail if another species is mixed into the reference mass or if cattle or other-species yield, composition, price, mass fraction, or allocation defaults are used for buffalo."
    source_ids:
      - unsd-cpc-3-21513
      - eu-pef-2021-2279
  - rule_id: validate_required_qualifiers
    applies_to: "Reference-flow metadata"
    rule: "Fail if species, unrendered state, tissue/source description, intended grade/use, temperature state, packaging state, lot, geography, or handoff point is missing; require acceptance status for an applicable food route."
    source_ids:
      - unsd-cpc-3-21513
      - codex-cxc-58-2005
  - rule_id: validate_mass_balance
    applies_to: "Joint batch and foreground processes"
    rule: "Require measured input/output reconciliation and an explained residual; fail if missing co-products, wastes, retained material, or losses could materially alter normalization or allocation."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: validate_allocation
    applies_to: "Joint slaughter/dressing burdens"
    rule: "Require direct subdivision before residual allocation and complete site-specific buffalo output mass/value evidence for economic allocation. A cattle or generic allocation proxy is not acceptable."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_conditioning_handoff
    applies_to: "Cooling, freezing, storage, packaging, and transport"
    rule: "Require actual state, temperature, holding time, packaging, dispatch point, and included transport route. Fail on unexplained duplicate transport service and foreground fuel/emissions."
    source_ids:
      - codex-cxc-58-2005
      - eu-pef-2021-2279
  - rule_id: validate_inventory_completeness
    applies_to: "Foreground inventory"
    rule: "Require an explicit status and evidence for water, energy, raw materials, wastewater, direct emissions/waste gas where relevant, and residues. Do not apply EU BAT legal thresholds or performance values as PCR defaults."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: validate_reasoned_estimate
    applies_to: "Provisional energy row"
    rule: "Permit separation_energy_provisional only when metered or verified allocated energy is unavailable, inputs and uncertainty are disclosed, no amount is copied from another animal species, and a replacement trigger is recorded."
    source_ids: []
  - rule_id: validate_cxs_limit
    applies_to: "Product specification"
    rule: "Do not apply CXS 211-1999 rendered-fat composition or quality values to unrendered buffalo fat; the source supports only the rendered/unrendered distinction and limitation."
    source_ids:
      - codex-cxs-211-1999
published_dataset_profile:
  dataset_role: "Foreground production dataset for unrendered buffalo fat at a declared producer-dispatch or delivered handoff"
  downstream_use: "May serve as a reviewed secondary_dataset or background_dataset for systems that require unrendered buffalo fatty tissue or raw fat material and preserve the declared state and allocation context"
  allowed_use: "Product-footprint and LCA modelling with matched buffalo species, unrendered state, grade/use, geography, technology, temperature route, handoff, and allocation interpretation"
  excluded_use: "Rendered tallow or oil; CPC 21521-21529 rendered fats; other animal species; undisclosed mixed-species fat; legal food-compliance certification; application of cattle defaults; comparative claims without the applicable PEF/verification requirements"
  required_metadata: "PCR id and version; product UUID; CPC reference; buffalo traceability; tissue/source description; unrendered declaration; intended grade/use; post-mortem or acceptance status where applicable; geography; technology; inventory period; temperature and storage; packaging; handoff; transport; co-products; allocation formula, factors, masses, values, period, and currency; data sources"
  required_quality_disclosure: "Coverage and calibration of foreground records; mass-balance residual; missing data; reasoned-estimate use and uncertainty; representativeness; allocation sensitivity; excluded processes; direct/background emission split; hygiene evidence scope for a food route"
  update_trigger: "New buffalo-specific evidence; change in product state, tissue mix, grade, slaughter or separation route, equipment, energy source, cooling/freezing, packaging, handoff, transport, co-product markets, allocation result, regulation, Tiangong UUID identity, or replacement of the provisional energy estimate"
data_sources:
  - id: "unsd-cpc-3-21513"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0, Explanatory Notes, subclass 21513 “Buffalo fat, unrendered”, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-11)"
    used_for: "Authoritative product identity and classification boundary: includes fat from buffaloes unrendered; excludes rendered buffalo tallow and marrow, bone, or foot oil/fractions. It does not supply LCA yields, composition, or allocation factors."
  - id: "codex-cxc-58-2005"
    type: "standard"
    reference: "Codex Alimentarius, Code of Hygienic Practice for Meat, CXC 58-2005, adopted 2005, editorial amendments 2013. https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FStandards%252FCXC%2B58-2005%252FCXC_058e.pdf (retrieved 2026-08-11)"
    used_for: "Applicable food-route background for slaughter/dressing process control, post-mortem inspection, hygienic separation, contamination prevention, temperature control, storage, packaging, and transport. It is not used as an LCA quantity source or as a universal legal threshold."
  - id: "codex-cxs-211-1999"
    type: "standard"
    reference: "Codex Alimentarius, Standard for Named Animal Fats, CXS 211-1999, amended 2024. https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FStandards%252FCXS%2B211-1999%252FCXS_211e.pdf (retrieved 2026-08-11)"
    used_for: "Distinguishes named rendered fats such as premier jus and edible tallow from this unrendered category. Its rendered-fat descriptions, composition tables, and quality values are explicitly not product specifications or LCA defaults for unrendered buffalo fat."
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission, Recommendation (EU) 2021/2279 of 15 December 2021 on the use of the Environmental Footprint methods, Annex I Product Environmental Footprint Method. https://eur-lex.europa.eu/eli/reco/2021/2279/oj (retrieved 2026-08-11)"
    used_for: "Functional-unit/reference-flow structure, system-boundary completeness, company-specific foreground data, direct subdivision, and residual slaughter co-product allocation framework. Its slaughter defaults cover cattle, pigs, sheep, and goats, not buffalo; no such default is transferred here."
  - id: "eu-fdm-bat-2019-2031"
    type: "official_guidance"
    reference: "European Commission, Commission Implementing Decision (EU) 2019/2031 of 12 November 2019 establishing BAT conclusions for the food, drink and milk industries. https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj (retrieved 2026-08-11)"
    used_for: "Process-inventory and monitoring completeness for water, energy, raw materials, wastewater, waste gas/direct emissions, and residues where applicable. It is not used to extend legal applicability, monitoring frequencies, emission levels, or performance thresholds to this PCR."
projection_metadata:
