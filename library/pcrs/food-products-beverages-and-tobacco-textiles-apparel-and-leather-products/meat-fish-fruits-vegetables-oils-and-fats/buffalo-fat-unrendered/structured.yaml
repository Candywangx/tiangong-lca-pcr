  reference_flow_link: "1 kg of the reference product output at the declared handoff, after measured batch quantities are normalized"
system_boundary:
  rules:
    - rule_id: boundary_joint_origin
      applies_to: "Slaughter, dressing, cutting, and fat separation"
      rule: "Include the operation where unrendered buffalo fat is physically separated and the joint outputs needed to apply the co-product rules. When that operation is represented upstream, its allocated result and handoff shall be explicit."
      source_ids:
        - unsd-cpc-3-21513
        - eu-pef-2021-2279
    - rule_id: boundary_unrendered
      applies_to: "All foreground operations"
      rule: "Do not include rendering or refining in the default foreground. Heating whose purpose or effect is to render, melt out, extract, refine, or fractionate fat changes the product state and requires a rendered-fat PCR or separately declared downstream system."
      source_ids:
        - unsd-cpc-3-21513
        - codex-cxs-211-1999
    - rule_id: boundary_conditioning
      applies_to: "Cooling, freezing, storage, and packaging"
      rule: "Include actual electricity, refrigerant, water, packaging, product loss, and waste for conditioning and packaging performed before the declared handoff; record temperature and holding time rather than applying a generic buffalo-fat assumption."
      source_ids:
        - codex-cxc-58-2005
        - eu-fdm-bat-2019-2031
    - rule_id: boundary_transport_handoff
      applies_to: "Transport"
      rule: "The default handoff is producer dispatch after loading, so outbound transport is excluded. Include transport only when the declared reference product is delivered to another handoff, and then record actual route, payload, temperature control, and return assumptions."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_hygiene
      applies_to: "Product intended for human consumption"
      rule: "Record post-mortem acceptance, hygienic separation, contamination control, temperature control, storage, and packaging controls applicable to the actual food route. This PCR does not create legal limits or certify food compliance."
      source_ids:
        - codex-cxc-58-2005
    - rule_id: boundary_inventory_completeness
      applies_to: "Foreground facility"
      rule: "Inventory water, energy, raw materials, waste water, waste gas or direct air-emission streams, and residues at the process or facility level appropriate to the operation. EU BAT values or legal applicability thresholds are not imported into this PCR."
      source_ids:
        - eu-fdm-bat-2019-2031
boundary_abstraction:
  declared_starting_condition: "Identified buffaloes entering the slaughter/dressing operation that jointly produces the fat, or an upstream buffalo slaughter/dressing dataset that ends at the same post-mortem-approved separation point"
  starting_condition_role: "Joint-production starting condition for attribution of buffalo production and slaughter burdens before direct fat recovery, trimming, conditioning, and handoff"
  product_classification_scope: "Unrendered buffalo fat only; CPC 3.0 code 21513 is a classification reference and does not expand the boundary to rendered fats or other species"
  recursive_input_rule: "Purchased unrendered buffalo fat entering the foreground is recorded once as a technosphere product input with an upstream dataset ending at its supplier handoff; do not recursively recreate its prior slaughter and separation inside the receiving process"
  upstream_dataset_requirement: "Use traceable buffalo-production and supplier datasets for live buffaloes and purchased inputs; an upstream unrendered-fat dataset must disclose the same species, state, handoff, and joint-production allocation basis"
  disclosure: "Declare actual starting point, facility operations, tissue/source description, inspection or acceptance status where applicable, temperature route, storage duration, packaging, included transport, handoff point, excluded operations, and all allocation choices"
