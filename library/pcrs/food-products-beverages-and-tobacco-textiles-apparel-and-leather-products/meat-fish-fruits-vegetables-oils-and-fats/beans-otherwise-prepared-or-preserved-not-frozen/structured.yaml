allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Separately measurable products, recipes, lines, or batches"
    rule: "Avoid allocation by subdividing operations or using direct lot, line, equipment, recipe, and metering records whenever technically feasible."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_recovery
    applies_to: "Recovered materials or exported energy"
    rule: "Apply system expansion or substitution only when the goal and scope support it and the substituted product, quality, market, and method are documented; otherwise keep recovery treatment and any revenue-free waste burden in the foreground system."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_physical
    applies_to: "Unavoidable shared burdens with multiple valuable outputs"
    rule: "Allocate by a documented physical relationship that reflects causality, such as product mass, dry bean solids, energy content, or measured process use; do not use net filled mass when differences in packing medium would distort the relationship."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_economic_fallback
    applies_to: "Shared burdens lacking a defensible physical relationship"
    rule: "Use economic allocation only as a disclosed fallback with price period, currency, co-product status, and sensitivity analysis retained."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_records
      process_id: "receiving_and_preparation"
      flow_role: "Beans, preparation water, prepared intermediate, rejects, and wastewater"
      record_type: "Weighbridge, batch, water-meter, waste, and discharge records"
      raw_fields: "lot_id; supplier; bean_state; incoming_mass_kg; accepted_mass_kg; water_makeup_kg; reject_mass_kg; wastewater_kg; destination"
      collection_method: "Reconcile calibrated scales and meters to batch and waste-transfer records"
      unit: "kg"
      frequency: "Each lot or production shift"
      temporal_coverage: "At least one representative annual or seasonal production period, with shutdown and abnormal periods identified"
      site_scope: "Each producing site"
      aggregation_rule: "Sum accepted inputs and outputs by lot, then normalize to released net product mass"
      quality_evidence: "Calibration records; lot traceability; water balance; waste transfer documents; missing-data log"
    - protocol_id: cp_cooking_records
      process_id: "cooking_and_formulation"
      flow_role: "Recipe inputs, electricity, heat, intermediate product, and losses"
      record_type: "Batch recipe, material issue, meter, boiler, and production records"
      raw_fields: "batch_id; ingredient_mass_kg; water_mass_kg; electricity_kWh; steam_or_fuel_quantity; carrier_unit; intermediate_mass_kg; loss_mass_kg"
      collection_method: "Record recipe issues and direct meters; allocate shared utilities using documented equipment time or throughput"
      unit: "kg; kWh; MJ or carrier unit"
      frequency: "Each batch or shift"
      temporal_coverage: "Representative operating period covering product and route variability"
      site_scope: "Each cooking or formulation line"
      aggregation_rule: "Convert carriers without aggregation loss, calculate lot totals, and normalize to released net product mass"
      quality_evidence: "Recipe authorization; meter calibration; utility invoices; allocation worksheet; mass balance"
    - protocol_id: cp_preservation_records
      process_id: "filling_and_preservation"
      flow_role: "Primary packaging, preservation energy and water, filled product, critical factors, wastewater, and rejected units"
      record_type: "Packaging issue, filler, seamer, retort or preservation-system, meter, and quality records"
      raw_fields: "lot_id; container_type; packaging_mass_kg; net_fill_kg; drained_mass_kg_if_applicable; initial_temperature; process_time; process_temperature; pH_or_aw_if_applicable; energy; water_makeup_kg; wastewater_kg; rejected_units"
      collection_method: "Capture contemporaneous line and scheduled-process records; reconcile packaging and utility totals to accepted filled units"
      unit: "kg; kWh; MJ; °C; min; pH or aw where applicable"
      frequency: "Each lot, with critical-factor frequency set by the validated preservation process"
      temporal_coverage: "All preservation campaigns in the reporting period"
      site_scope: "Each preservation line or system"
      aggregation_rule: "Sum accepted product, packaging, water, energy, and rejects by lot and normalize to released net product mass"
      quality_evidence: "Scheduled-process authority; instrument calibration; container closure checks; deviation and disposition records"
    - protocol_id: cp_release_records
      process_id: "post_process_packaging"
      flow_role: "Accepted product, secondary packaging, release electricity, rejects, and final reference output"
      record_type: "Finished-goods, packaging issue, meter, quality release, and waste records"
      raw_fields: "lot_id; accepted_net_product_kg; package_format; secondary_packaging_kg; electricity_kWh; storage_time_h; storage_temperature_if_applicable; reject_mass_kg; release_status"
      collection_method: "Reconcile released finished-goods mass with packaging use, storage, rejection, and waste records"
      unit: "kg; kWh; h; °C"
      frequency: "Each released lot or shift"
      temporal_coverage: "Same period as foreground production data"
      site_scope: "Each packaging and release line"
      aggregation_rule: "Sum only released product, allocate shared storage by occupied mass-time, and normalize all inventory to 1 kg net product"
      quality_evidence: "Release authorization; inventory reconciliation; meter records; packaging specifications; rejected-lot disposition"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground flows"
      rule: "normalized amount = lot-attributable flow amount / released net finished-product mass"
      inputs:
        - "lot flow amount"
        - "released net product kg"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calc_net_product_mass
      applies_to: "Filled and released product"
      rule: "net product mass = gross filled unit mass - tare mass of primary container and closure; do not subtract packing medium"
      inputs:
        - "gross filled mass"
        - "container and closure tare"
      output: "net finished-product kg"
      source_ids:
        - codex-cxs-297-2009
    - id: calc_mass_balance
      applies_to: "Each process and complete foreground system"
      rule: "mass-balance difference = total mass inputs - product outputs - waste outputs - measured evaporation or other declared losses; investigate material unexplained differences"
      inputs:
        - "material inputs"
        - "product outputs"
        - "waste outputs"
        - "declared losses"
      output: "mass-balance closure and unexplained difference"
      source_ids: []
    - id: calc_energy_conversion
      applies_to: "Electricity, fuels, steam, and purchased heat"
      rule: "Convert each carrier to the declared reporting unit using a documented lower or higher heating value, steam enthalpy, or supplier factor while retaining the original quantity and factor"
      inputs:
        - "metered carrier quantity"
        - "conversion factor"
        - "factor basis"
      output: "carrier-specific energy per reference product"
      source_ids: []
    - id: calc_water_balance
      applies_to: "Preparation and preservation water"
      rule: "wastewater estimate = make-up water + water in inputs - retained water in product - measured evaporation - water in exported residues; do not use the estimate when a direct discharge meter is available without explaining the difference"
      inputs:
        - "make-up water"
        - "ingredient water"
        - "product water"
        - evaporation
        - "residue water"
      output: "wastewater kg and water-balance closure"
      source_ids:
        - eu-2019-2031-fdm-bat
    - id: calc_shared_burden_allocation
      applies_to: "Unavoidable shared operations"
      rule: "Apply the selected allocation basis consistently to all shared inputs, emissions, and wastes and retain a sensitivity result for any economic fallback"
      inputs:
        - "shared burdens"
        - "output quantities"
        - "allocation basis"
      output: "allocated foreground inventory by product"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and incoming beans"
      requirement: "Declare all required qualifiers and preserve the exact reference-flow UUID; distinguish raw, soaked, cooked, acidified, and otherwise preprocessed incoming states."
      evidence: "Product specification; recipe; supplier record; Tiangong identity reference"
    - id: dq_temporal_representativeness
      applies_to: "Foreground activity data"
      requirement: "Use a representative production period that covers normal product and route variability; identify start and end dates, shutdowns, trials, and abnormal lots."
      evidence: "Production calendar; lot list; exclusion log"
    - id: dq_measurement_traceability
      applies_to: "Mass, water, energy, temperature, time, pH, aw, and waste records"
      requirement: "Retain instrument identity, calibration or verification status, raw reading, unit, timestamp, operator or system source, and any transformation applied."
      evidence: "Calibration certificates; meter exports; signed batch or system records"
    - id: dq_inventory_completeness
      applies_to: "Complete foreground system"
      requirement: "Reconcile bean, ingredient, product, packaging, water, energy, wastewater, and waste records across all included processes and document every proxy, zero, estimate, and data gap."
      evidence: "Mass and water balances; energy reconciliation; completeness checklist"
    - id: dq_preservation_controls
      applies_to: "Preserved product release"
      requirement: "Retain route-specific critical factors and deviations. For applicable low-acid or acidified low-acid hermetically sealed products, retain the scheduled process, process authority, time, temperature, fill, headspace, pH or aw where relevant, container integrity, cooling, and release review."
      evidence: "Scheduled-process file; contemporaneous processing records; deviation disposition; codex-cxc-23-1979; us-ecfr-21-cfr-113"
    - id: dq_provisional_ranges
      applies_to: "Rows with reasoned estimates"
      requirement: "Treat every reasoned_estimate range as a nonconformance-screening prior only; never replace measured foreground values with the midpoint and replace the range with reviewed evidence before publication-critical use."
      evidence: "Range-evidence review record and replacement plan"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "The output must use product flow e1ec238e-9181-4fd3-912e-a88b4a45ad56, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Mass unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, normalized to exactly 1 kg net finished product."
    source_ids: []
  - rule_id: val_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Bean type, incoming state, recipe or packing medium, preservation route, net-content basis, solid or drained fraction when relevant, container type, market state, geography, and production period must be declared."
    source_ids:
      - codex-cxs-297-2009
      - codex-cxc-23-1979
  - rule_id: val_process_completeness
    applies_to: "Process inventory"
    rule: "Every required process and every applicable conditional process must be represented; any omitted conditional process must have a documented non-applicability reason."
    source_ids: []
  - rule_id: val_packaging_separation
    applies_to: "Reference amount and packaging inventory"
    rule: "Primary, secondary, and tertiary packaging mass must not be included in the 1 kg net reference amount and must remain explicit inventory inputs when used."
    source_ids: []
  - rule_id: val_mass_water_energy_balance
    applies_to: "Foreground calculations"
    rule: "Mass balance, water balance, carrier-specific energy reconciliation, and released-product reconciliation must be calculated, and material unexplained differences must be investigated and disclosed."
    source_ids:
      - eu-2019-2031-fdm-bat
  - rule_id: val_preservation_record
    applies_to: "Preservation process"
    rule: "The declared route must have contemporaneous critical-factor records and deviation disposition; applicable low-acid or acidified low-acid hermetically sealed products must demonstrate conformity with the authorized scheduled process."
    source_ids:
      - codex-cxc-23-1979
      - us-ecfr-21-cfr-113
  - rule_id: val_canned_fill_check
    applies_to: "Canned vegetable variants within CXS 297-2009 scope"
    rule: "For non-vacuum canned variants claiming conformity with CXS 297-2009, verify container fill against the standard's minimum-fill requirement and record drained weight where the applicable annex requires it."
    source_ids:
      - codex-cxs-297-2009
  - rule_id: val_allocation_disclosure
    applies_to: "Multi-output operations"
    rule: "The allocation hierarchy, selected basis, quantities, co-product status, recovery treatment, and any sensitivity analysis must be present and arithmetically consistent."
    source_ids:
      - iso-14044-2006
  - rule_id: val_estimate_status
    applies_to: "Provisional ranges"
    rule: "A reasoned-estimate range may only screen or initialize data; validation must flag use of a range midpoint as a foreground value and any publication-critical range lacking reviewed evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for prepared or preserved non-frozen beans at the manufacturing gate"
  downstream_use: "May serve as a secondary_dataset or background_dataset for food products, meals, catering, retail, and packaging or distribution models when scope and qualifiers match"
  allowed_use: "Attributional or consequential modelling consistent with the declared allocation and recovery method; product, process, and lifecyclemodel projections using the same net-product basis"
  excluded_use: "Direct comparison of products with different bean states, solid fractions, preservation routes, package formats, shelf-life requirements, or geography without adjustment; substitution for fresh, dried-unprepared, or frozen beans"
  required_metadata: "PCR id; reference UUID; bean type; incoming state; recipe; preservation route; net and drained-mass basis; container and packaging materials; market state; geography; technology; reporting period; site coverage; allocation; upstream datasets"
  required_quality_disclosure: "Data coverage; meter and calibration status; mass, water, and energy closure; scheduled-process applicability; deviations; proxies; provisional ranges; unresolved flow UUIDs; uncertainty and allocation sensitivity"
  update_trigger: "Material change in bean source or state, recipe, solid fraction, preservation process, package format, energy or water system, site or geography, allocation, regulation or scheduled process, or a shift outside the represented production period"
