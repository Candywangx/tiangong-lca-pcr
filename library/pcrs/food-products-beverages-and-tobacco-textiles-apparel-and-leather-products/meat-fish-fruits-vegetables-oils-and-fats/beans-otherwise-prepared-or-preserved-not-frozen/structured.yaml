system_boundary:
  rules:
    - rule_id: sb_foreground_operations
      applies_to: "Directly controlled manufacturing"
      rule: "Include receiving and preparation, on-site hydration or cooking, formulation, filling, sealing, preservation, cooling, cleaning attributable to production, post-process handling, packaging, on-site utility use, rejects, wastewater, and directly controlled waste treatment when present."
      source_ids:
        - codex-cxs-297-2009
        - codex-cxc-23-1979
        - eu-2019-2031-fdm-bat
    - rule_id: sb_upstream_links
      applies_to: "Purchased inputs"
      rule: "Represent purchased beans, ingredients, water supply, energy carriers, packaging, and any in-scope inbound transport as product inputs linked to appropriate upstream datasets; do not recreate their upstream production inside this foreground package."
      source_ids:
        - iso-14044-2006
    - rule_id: sb_same_category_input
      applies_to: "Incoming prepared or preserved beans"
      rule: "If an input already belongs to this product category, record it once as a purchased product input with declared preparation state and supplier dataset; do not recursively apply this PCR to that input within the same foreground system."
      source_ids:
        - iso-14044-2006
    - rule_id: sb_preservation_route
      applies_to: "Thermal, aseptic, acidified, or other preservation"
      rule: "Declare the preservation route and collect its critical control records. For low-acid or acidified low-acid food in hermetically sealed containers, use a scheduled process established by a competent authority or qualified process specialist and retain the applicable critical factors."
      source_ids:
        - codex-cxc-23-1979
        - us-ecfr-21-cfr-113
    - rule_id: sb_post_gate_exclusion
      applies_to: "Downstream stages"
      rule: "Exclude distribution, retail, consumer storage or preparation, and packaging or product end-of-life from the foreground result unless the declared study scope explicitly adds them as separate downstream processes."
      source_ids:
        - iso-14044-2006
