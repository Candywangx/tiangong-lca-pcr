allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "juice, grapefruit oil, usable citrus solids, and other co-products"
    rule: "First avoid allocation by subdividing independently measured operations or by expanding the system when the additional functions and substituted products are robustly demonstrated."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_physical
    applies_to: "inseparable multifunctional operations"
    rule: "If subdivision or system expansion is not practicable, use a documented, quantifiable physical relationship that reflects how inputs and outputs provide the functions; do not default to mass merely because masses are available."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_other_relationship
    applies_to: "multifunctional operations lacking a defensible physical relationship"
    rule: "Use another relationship, such as site- and period-specific economic value, only after documenting why subdivision, system expansion, and physical allocation were rejected; disclose prices, period, currency, factors, and sensitivity."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_waste_status
    applies_to: "peel, pulp, seeds, rejected fruit, off-specification juice, and sludge"
    rule: "Classify each output as product, co-product, or waste from its documented destination and function. Waste treatment remains in the generating system; do not assign avoided-production credits without a separately justified system-expansion model."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_shared_site_services
    applies_to: "utilities and site services shared with other products"
    rule: "Prefer sub-metering. Otherwise allocate only the residual shared amount using a causal driver such as process time, metered throughput, cleaning cycle, or equipment demand, and retain the calculation."
    source_ids:
      - ec-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_fresh_route_mass_records
      process_id: "fresh_fruit_extraction"
      flow_role: "Fruit, juice intermediate, citrus oil, usable residue, and waste masses"
      record_type: "weighbridge, batch ticket, tank level, dispatch record"
      raw_fields: "lot_id; timestamp; accepted_fruit_mass_kg; rejected_fruit_mass_kg; juice_intermediate_mass_kg; oil_mass_kg; usable_residue_mass_kg; waste_mass_kg; moisture_basis; destination"
      collection_method: "Reconcile calibrated scales, tank measurements, and dispatch records by production lot."
      unit: "kg"
      frequency: "each lot or shift"
      temporal_coverage: "complete represented production period"
      site_scope: "all controlled fresh-fruit lines"
      aggregation_rule: "Sum by lot and route; normalize to net reference-product mass; retain separate co-product and waste destinations."
      quality_evidence: "scale calibration; batch reconciliation; signed dispatch or waste record"
    - protocol_id: cp_fresh_route_utility_records
      process_id: "fresh_fruit_extraction"
      flow_role: "Water and electricity"
      record_type: "meter, invoice, equipment log"
      raw_fields: "meter_id; opening_reading; closing_reading; timestamp; route_runtime; production_mass_kg; allocation_driver"
      collection_method: "Use route sub-meters; when absent, reconcile site totals and allocate only residual use with a documented causal driver."
      unit: "kg water; kWh"
      frequency: "meter interval and each production campaign"
      temporal_coverage: "complete represented production period"
      site_scope: "all controlled fresh-fruit lines"
      aggregation_rule: "Subtract verified non-production use, assign to route, and normalize to reference-product mass."
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_reconstitution_batch_records
      process_id: "reconstitution_blending"
      flow_role: "Grapefruit-derived inputs, water, ingredients, intermediate output, and loss"
      record_type: "formulation, batch sheet, tank meter, laboratory result"
      raw_fields: "batch_id; input_id; supplier; origin; concentration_state; input_mass_kg; water_mass_kg; ingredient_mass_kg; output_mass_kg; brix_20c; temperature; loss_mass_kg"
      collection_method: "Reconcile issued materials, calibrated tank or scale readings, and laboratory soluble-solids results for each batch."
      unit: "kg; degrees Brix"
      frequency: "each batch"
      temporal_coverage: "complete represented production period"
      site_scope: "all controlled blending lines"
      aggregation_rule: "Sum by product recipe and route share; calculate mass balance and normalize to net reference-product mass."
      quality_evidence: "approved formula; instrument calibration; batch release record"
    - protocol_id: cp_reconstitution_utility_records
      process_id: "reconstitution_blending"
      flow_role: "Electricity and other route utilities"
      record_type: "meter and equipment runtime log"
      raw_fields: "meter_id; opening_reading; closing_reading; runtime; rated_load; batch_id; output_mass_kg"
      collection_method: "Prefer sub-metering; otherwise use validated runtime and load data for residual allocation."
      unit: "kWh"
      frequency: "meter interval and each batch campaign"
      temporal_coverage: "complete represented production period"
      site_scope: "all controlled blending lines"
      aggregation_rule: "Assign route utility use to batches and normalize to reference-product mass."
      quality_evidence: "meter calibration; runtime log; calculation worksheet"
    - protocol_id: cp_factory_gate_batch_records
      process_id: "stabilisation_factory_gate"
      flow_role: "Juice input, finished output, packaging, and product or packaging loss"
      record_type: "batch ticket, filler counter, package bill, scale, warehouse release"
      raw_fields: "batch_id; input_mass_kg; finished_net_mass_kg; package_component; package_mass_kg; rejected_product_mass_kg; packaging_scrap_mass_kg; preservation_method; storage_state"
      collection_method: "Reconcile process transfers, filler or scale records, packaging issues, rejects, and warehouse releases."
      unit: "kg"
      frequency: "each lot or shift"
      temporal_coverage: "complete represented production period"
      site_scope: "all controlled preservation and filling lines"
      aggregation_rule: "Sum released net product and separately normalize packaging and losses to 1 kg reference product."
      quality_evidence: "scale and filler calibration; packaging stock reconciliation; release record"
    - protocol_id: cp_stabilisation_utility_records
      process_id: "stabilisation_factory_gate"
      flow_role: "Thermal energy, electricity, cooling, and refrigeration"
      record_type: "meter, fuel or steam invoice, equipment log"
      raw_fields: "carrier_id; quantity; unit; energy_content; meter_reading; runtime; preservation_method; product_mass_kg"
      collection_method: "Use process meters or reconcile carrier invoices and equipment records with documented conversion factors."
      unit: "kWh; MJ; carrier-specific unit"
      frequency: "meter interval and each campaign"
      temporal_coverage: "complete represented production period"
      site_scope: "all controlled preservation, cooling, filling, and storage equipment"
      aggregation_rule: "Keep carriers separate, assign to represented operations, and normalize to reference-product mass."
      quality_evidence: "meter calibration; invoice; energy-conversion record"
    - protocol_id: cp_site_water_effluent_records
      process_id: "site_services_effluent"
      flow_role: "Cleaning water, cleaning chemicals, and wastewater"
      record_type: "water meter, dosing log, effluent meter, laboratory sample"
      raw_fields: "meter_id; water_source; water_mass_kg; chemical_id; chemical_mass_kg; effluent_mass_kg; COD; BOD; TSS; pH; discharge_destination; sampling_time"
      collection_method: "Reconcile inlet, reuse, product water, evaporation, and effluent meters; retain chemical dosing and representative effluent analyses."
      unit: "kg; mg/L where analysed"
      frequency: "each cleaning cycle or meter interval; effluent sampling per permit or site plan"
      temporal_coverage: "complete represented production period"
      site_scope: "all controlled process and effluent systems"
      aggregation_rule: "Allocate only residual shared services with a documented driver and normalize to reference-product mass."
      quality_evidence: "meter calibration; dosing record; accredited or documented laboratory report; water balance"
    - protocol_id: cp_site_service_utility_records
      process_id: "site_services_effluent"
      flow_role: "Electricity and other utilities for shared site services"
      record_type: "sub-meter, invoice, equipment log"
      raw_fields: "meter_id; quantity; unit; runtime; service_area; production_mass_kg; allocation_driver"
      collection_method: "Sub-meter where possible; otherwise reconcile site totals and causally allocate residual service use."
      unit: "kWh; MJ; carrier-specific unit"
      frequency: "meter interval"
      temporal_coverage: "complete represented production period"
      site_scope: "all relevant controlled site services"
      aggregation_rule: "Remove separately metered product-process use, allocate the residual, and normalize to reference-product mass."
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_site_environmental_records
      process_id: "site_services_effluent"
      flow_role: "Refrigerant losses, treatment residues, and direct releases"
      record_type: "refrigerant service log, residue ticket, permit monitoring, emission calculation"
      raw_fields: "substance_id; opening_inventory; purchases; closing_inventory; recovered_mass; emitted_mass; residue_mass; moisture_basis; destination; monitoring_result; factor_source"
      collection_method: "Use substance-specific inventory balance, calibrated measurement, or an approved factor applied to collected activity data."
      unit: "kg; release-specific unit"
      frequency: "each service event and reporting period"
      temporal_coverage: "complete represented production period"
      site_scope: "all controlled refrigeration and treatment systems"
      aggregation_rule: "Calculate each substance or residue separately and normalize to reference-product mass."
      quality_evidence: "service certificate; inventory reconciliation; laboratory or permit record; factor citation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = amount assigned to represented production / released net grapefruit-juice mass"
      inputs:
        - "assigned amount"
        - "released net grapefruit-juice mass"
      output: "amount per 1 kg reference grapefruit juice"
      source_ids: []
    - id: calc_fresh_route_yield
      applies_to: "fresh_fruit_extraction"
      rule: "fresh-route juice yield = screened juice intermediate mass / accepted fresh-grapefruit mass"
      inputs:
        - "screened juice intermediate mass"
        - "accepted fresh-grapefruit mass"
      output: "kg juice intermediate/kg accepted fresh grapefruit"
      source_ids:
        - jrc-fdm-bref-2019
    - id: calc_route_mass_balance
      applies_to: "each route and production lot"
      rule: "mass-balance discrepancy = total measured mass inputs - total measured product, co-product, waste, and measured release outputs; investigate rather than force the discrepancy to zero"
      inputs:
        - "all measured mass inputs and outputs"
        - "moisture and concentration states"
      output: "disclosed discrepancy and reconciliation status"
      source_ids: []
    - id: calc_reconstitution_brix_check
      applies_to: "reconstituted grapefruit juice"
      rule: "compare the corrected refractometric soluble-solids result at 20 degrees C with the 10.0 degrees Brix Codex minimum and any stricter declared market rule"
      inputs:
        - "corrected soluble-solids result"
        - "measurement temperature and correction"
        - "applicable market threshold"
      output: "pass/fail plus measured value and cited threshold"
      source_ids:
        - codex-cxs-247-2005
        - us-21-cfr-146-132
    - id: calc_allocation_factor
      applies_to: "residual multifunctional burdens"
      rule: "allocation factor for output i = documented driver for output i / sum of the same driver across all co-products; apply only after the hierarchy in Section 7"
      inputs:
        - "output quantities or values for one consistent driver"
        - "subdivision assessment"
      output: "disclosed allocation factor by output"
      source_ids:
        - ec-pef-method-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "every represented product"
      requirement: "Retain product name, grapefruit species or declared legal identity, route shares, concentration state, soluble solids, preservation, packaging state, added ingredients, geography, period, and shelf-life or storage condition."
      evidence: "Approved specification, laboratory result, recipe, label or release record"
    - id: dq_temporal_coverage
      applies_to: "foreground activity data"
      requirement: "Cover the full declared production period and capture seasonal or campaign variation; explain shutdowns, missing intervals, and extrapolation."
      evidence: "Meter completeness report, production calendar, and gap log"
    - id: dq_measurement_traceability
      applies_to: "measured quantities"
      requirement: "Use calibrated or verified measurement systems and preserve raw readings, units, conversion factors, and responsible record owner."
      evidence: "Calibration certificate, meter or scale log, and conversion worksheet"
    - id: dq_mass_balance
      applies_to: "fruit, juice, concentrate, water, co-products, wastes, and losses"
      requirement: "Reconcile route-specific mass inputs and outputs on consistent moisture and concentration states; disclose unexplained discrepancies and corrective action."
      evidence: "Lot or campaign mass-balance worksheet"
    - id: dq_allocation
      applies_to: "shared operations and co-products"
      requirement: "Document the allocation hierarchy assessment, causal driver, factors, data period, and sensitivity; retain unallocated measurements where subdivision is possible."
      evidence: "Allocation decision record and calculation worksheet"
    - id: dq_upstream_representativeness
      applies_to: "linked datasets"
      requirement: "Match input identity, geography, technology, concentration state, temporal coverage, transport hand-off, and treatment route; disclose proxies."
      evidence: "Dataset metadata and proxy justification"
    - id: dq_provisional_ranges
      applies_to: "all reasoned_estimate ranges"
      requirement: "Treat provisional ranges only as authoring or QA screens; they must not overwrite collected values and must be replaced by reviewed evidence or explicitly accepted before publication-critical use."
      evidence: "Review record and replacement source or acceptance decision"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference output"
    rule: "Confirm exactly one reference output of 1 kg net Grapefruit juice uses product-flow UUID 796385da-cb79-4275-8087-13bc9656ff65, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg; packaging mass is separate."
    source_ids: []
  - rule_id: validate_product_scope
    applies_to: "product identity"
    rule: "Reject nectar, concentrate sold as concentrate, multi-fruit juice, flavoured drinks outside the declared juice identity, fermented beverages, and fresh fruit from this PCR."
    source_ids:
      - codex-cxs-247-2005
      - us-21-cfr-146-132
  - rule_id: validate_route_completeness
    applies_to: "represented production mix"
    rule: "Confirm route shares sum to the represented production, every occurring conditional process is included, purchased juice or concentrate has an upstream dataset, and no controlled operation is omitted."
    source_ids:
      - jrc-fdm-bref-2019
  - rule_id: validate_soluble_solids
    applies_to: "reconstituted grapefruit juice"
    rule: "Confirm a corrected soluble-solids result at 20 degrees C is present and is at least 10.0 degrees Brix under the Codex baseline, or meets the cited stricter applicable market threshold."
    source_ids:
      - codex-cxs-247-2005
      - us-21-cfr-146-132
  - rule_id: validate_inventory_completeness
    applies_to: "foreground inventory"
    rule: "Confirm all product, co-product, waste, wastewater, packaging, utility, and direct elementary releases crossing the controlled boundary are represented or explicitly documented as not applicable."
    source_ids:
      - jrc-fdm-bref-2019
      - ec-pef-method-2021
  - rule_id: validate_mass_balance
    applies_to: "each route and production lot"
    rule: "Confirm masses use consistent states, the mass-balance discrepancy is calculated, and material discrepancies are investigated and disclosed rather than silently allocated."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "multifunctional and shared operations"
    rule: "Confirm the Section 7 hierarchy is followed, drivers and factors are reproducible, and waste treatment or avoided-production credits are not double counted."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_data_quality
    applies_to: "published foreground dataset"
    rule: "Confirm protocol coverage, calibration or verification evidence, temporal and geographic representativeness, source links, proxy disclosure, and provisional-range review status are complete."
    source_ids:
      - ec-pef-method-2021
published_dataset_profile:
  dataset_role: "Foreground production dataset for finished grapefruit juice at the processing-site gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product-footprint, process, and lifecyclemodel studies whose product identity, route mix, geography, period, preservation, packaging state, and boundary match the dataset or are transparently adapted"
  excluded_use: "Direct representation of grapefruit concentrate, nectar, multi-fruit or flavoured drinks, fermented beverages, fresh grapefruit, or downstream distribution, use, and end-of-life without additional modelling"
  required_metadata: "Canonical PCR id; reference-flow UUIDs; route shares; input origin and concentration state; soluble-solids result and method; preservation; packaging state and mass; geography; period; technology; shelf-life or storage condition; co-product and waste destinations; allocation; data gaps; upstream dataset links"
  required_quality_disclosure: "Foreground coverage and protocol completeness; calibration and reconciliation evidence; route mass balance; temporal and geographic representativeness; allocation sensitivity; proxy datasets; provisional reasoned estimates and their review status; excluded stages"
  update_trigger: "Material change in fruit or concentrate sourcing, recipe or soluble-solids target, route mix, extraction or preservation technology, energy or water system, packaging, site allocation, co-product destination, waste or wastewater treatment, regulatory identity requirement, or a foreground-data period no longer representative"
data_sources:
  - id: "codex-cxs-247-2005"
    type: "standard"
    reference: "Codex Alimentarius, General Standard for Fruit Juices and Nectars, CXS 247-2005, https://www.fao.org/input/download/standards/10154/CXS_247e.pdf (retrieved 2026-08-11)"
    used_for: "Fruit-juice identity and composition; potable reconstitution water; authenticity and quality checks; minimum 10.0 degrees Brix for reconstituted grapefruit juice"
  - id: "us-21-cfr-146-132"
    type: "standard"
    reference: "U.S. eCFR, 21 CFR 146.132, Grapefruit juice, https://www.ecfr.gov/current/title-21/section-146.132 (official XML issue date 2026-08-06; retrieved 2026-08-11)"
    used_for: "Grapefruit-juice identity, directly expressed and from-concentrate distinctions, 10 percent soluble-solids rule for the U.S. standard, permitted preservation, and market-specific labelling context"
  - id: "jrc-fdm-bref-2019"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Best Available Techniques (BAT) Reference Document for the Food, Drink and Milk Industries, EUR 29978 EN, JRC118627, 2019, doi:10.2760/243911, https://eippcb.jrc.ec.europa.eu/sites/default/files/2020-01/JRC118627_FDM_Bref_2019_published.pdf (retrieved 2026-08-11)"
    used_for: "Citrus-juice process decomposition; sorting, washing, oil recovery, mechanical extraction, screening, preservation, concentration, cleaning, wastewater, energy, and solid-residue boundary"
  - id: "ec-pef-method-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on the Environmental Footprint methods, Annex I, Sections 4.5 and 4.6, https://eur-lex.europa.eu/eli/reco/2021/2279/oj/eng (retrieved 2026-08-11)"
    used_for: "Multifunctionality hierarchy, subdivision and system expansion, physical and other allocation relationships, company-specific inventory collection, and data-quality expectations"
