system_boundary:
  rules:
    - rule_id: boundary_controlled_operations
      applies_to: "foreground operations"
      rule: "Include every controlled operation needed to convert the declared received grapefruit-derived inputs into the reference product, including route-specific preparation, extraction, screening, reconstitution or blending, preservation, cooling, filling, cleaning, and on-site residue or effluent management."
      source_ids:
        - jrc-fdm-bref-2019
    - rule_id: boundary_upstream_links
      applies_to: "purchased inputs and services"
      rule: "Represent excluded upstream production and off-site treatment with linked datasets rather than treating purchased grapefruit, concentrate, ingredients, packaging, energy, transport, or waste treatment as burden-free."
      source_ids:
        - ec-pef-method-2021
    - rule_id: boundary_route_specificity
      applies_to: "route selection"
      rule: "Include only processes that occurred for the represented production mix, but declare the not-from-concentrate and from-concentrate shares and retain intermediate mass balances for each route."
      source_ids: []
    - rule_id: boundary_direct_releases
      applies_to: "controlled site releases"
      rule: "Record direct emissions, refrigerant losses, wastewater, solid residues, and product losses that cross the controlled-site boundary; do not hide them in a generic utility total."
      source_ids:
        - jrc-fdm-bref-2019
    - rule_id: boundary_downstream_exclusion
      applies_to: "factory-gate dataset"
      rule: "Exclude distribution, retail, consumer use, and end-of-life from this foreground package unless the declared study extends the boundary and reports those stages separately."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Harvested grapefruit, single-strength grapefruit juice, and/or grapefruit concentrate received at the processing site, with quantity, origin, supplier, concentration state, and transport hand-off declared"
  starting_condition_role: "Gate-to-gate foreground starting condition with linked upstream supply datasets"
  product_classification_scope: "Grapefruit juice only; route intermediates remain explicit and must not broaden the PCR to grapefruit nectar, mixed juice, fresh fruit, or concentrate sold as the reference product"
  recursive_input_rule: "Record purchased grapefruit juice or concentrate as an explicit product input and link it to an upstream dataset; do not recursively reproduce its manufacture inside the same foreground package unless those operations are under the reporting site's control and are subdivided as foreground processes"
  upstream_dataset_requirement: "Link representative upstream datasets for grapefruit cultivation and harvest, purchased juice or concentrate, ingredients and processing aids, packaging, utilities, fuels, refrigerants, inbound transport, and off-site waste or wastewater treatment"
  disclosure: "Declare route shares, origin and concentration state of each grapefruit-derived input, controlled operations, preservation and packaging state, temporal and geographic coverage, cut-offs, data gaps, co-product fate, and allocation choices"
