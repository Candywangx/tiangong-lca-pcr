system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate
      applies_to: "foreground_system_boundary"
      rule: "Include receipt, inspection, washing and preparation, the declared preservation operation, packaging, and controlled finished-product storage through the plant gate."
      source_ids:
        - codex-cac-rcp-52-2003
        - iso-14044-2006
    - rule_id: boundary_route_specificity
      applies_to: "preservation_route"
      rule: "Instantiate and disclose the actual freezing, smoking, drying, salting, or brining operations; do not model mutually exclusive routes as if all occurred."
      source_ids:
        - codex-cac-rcp-52-2003
        - codex-cxs-311-2013
    - rule_id: boundary_cold_chain
      applies_to: "chilled_and_frozen_storage"
      rule: "Include refrigeration or freezing energy and refrigerant losses under operational control from receipt through the plant gate; frozen storage shall record time and temperature."
      source_ids:
        - codex-cac-rcp-52-2003
        - fda-seafood-hazards-controls-2022
    - rule_id: boundary_sanitation
      applies_to: "sanitation_and_wastewater"
      rule: "Include process and sanitation water, approved cleaning agents when material, wastewater or brine discharge, and on-site treatment; use potable or otherwise legally suitable water for product-contact operations."
      source_ids:
        - codex-cac-rcp-52-2003
    - rule_id: boundary_capital_goods
      applies_to: "infrastructure"
      rule: "Exclude buildings and capital equipment from the default gate-to-gate dataset unless the governing study, PCR programme, or materiality review explicitly requires them; disclose any inclusion."
      source_ids:
        - iso-14044-2006
