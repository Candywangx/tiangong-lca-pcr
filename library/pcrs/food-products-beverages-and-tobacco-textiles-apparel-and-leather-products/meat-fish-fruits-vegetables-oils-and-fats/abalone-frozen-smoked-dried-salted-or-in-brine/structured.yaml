allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "route_and_batch_operations"
    rule: "Avoid allocation by separately metering or subdividing wild and farmed sources, preservation routes, product forms, and materially different packaging or storage conditions."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: allocation_shared_utilities
    applies_to: "shared_water_energy_and_storage"
    rule: "Allocate shared utilities using a documented physical driver that reflects causality, such as metered equipment use, operating time, refrigeration load times storage duration, or product mass when no better driver exists."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: allocation_shells_and_residues
    applies_to: "shells_offal_and_other_outputs"
    rule: "First document whether each output is a waste or a co-product. For a co-product, prefer subdivision; if subdivision is not possible, use a relevant physical relationship and disclose it. Use economic allocation only when a physical relationship cannot be established, and report a sensitivity result."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_reuse_and_recycling
    applies_to: "reused_brine_packaging_and_residues"
    rule: "Credit no avoided burden inside the gate-to-gate dataset unless an explicit system-expansion or recycling method is required by the governing study. Record recovered material and the receiving treatment or product system separately."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: allocation_mass_balance
    applies_to: "foreground_mass_reconciliation"
    rule: "Reconcile raw abalone, water, salt, packaging, product, residues, wastewater, covering liquid, and moisture removal on consistent wet- or dry-mass bases; report unexplained imbalance rather than forcing it into a co-product."
    source_ids:
      - codex-cac-rcp-52-2003
      - lemus-mondaca-2018-abalone-drying
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_batch
      process_id: "receipt_and_preparation"
      flow_role: "wild and farmed raw abalone"
      record_type: "receiving lot record"
      raw_fields: "lot_id; species; wild_or_farmed; supplier; harvest_or_farm_geography; shell_state; receipt_time; receipt_temperature; gross_mass; rejected_mass; accepted_mass; supplier_dataset_ref"
      collection_method: "calibrated scale, receiving inspection, and supplier traceability record"
      unit: "kg; degrees C"
      frequency: "every lot"
      temporal_coverage: "all lots in reporting period"
      site_scope: "every included facility"
      aggregation_rule: "sum accepted mass by source and product route; retain rejected mass separately"
      quality_evidence: "scale calibration; lot tickets; supplier certificate; species and source verification"
    - protocol_id: cp_preparation_utilities
      process_id: "receipt_and_preparation"
      flow_role: "preparation water, electricity, and wastewater"
      record_type: "meter and production log"
      raw_fields: "meter_start; meter_end; submeter_id; batch_id; water_source; wastewater_destination; operating_time; allocation_driver"
      collection_method: "direct submeter preferred; otherwise reconciled main meter with documented physical allocation"
      unit: "kg water; kWh or MJ electricity; kg wastewater"
      frequency: "each batch or shift"
      temporal_coverage: "complete reporting period"
      site_scope: "each included preparation line"
      aggregation_rule: "subtract documented non-process use; allocate only residual shared use with declared driver"
      quality_evidence: "meter calibration; invoices; shift logs; water suitability record"
    - protocol_id: cp_preparation_yield
      process_id: "receipt_and_preparation"
      flow_role: "prepared product, shells, and residues"
      record_type: "batch mass balance"
      raw_fields: "accepted_raw_mass; prepared_mass; shell_mass; viscera_mass; other_residue_mass; retained_product_mass; destinations"
      collection_method: "calibrated scales at transfer and waste collection points"
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "complete reporting period"
      site_scope: "each included line"
      aggregation_rule: "sum each mass by batch and route; report unresolved imbalance"
      quality_evidence: "scale calibration; batch sheet; waste transfer record"
    - protocol_id: cp_preservation_batch
      process_id: "preservation_route"
      flow_role: "preservation input and output"
      record_type: "route batch record"
      raw_fields: "batch_id; route_sequence; input_mass; output_mass; species; shell_state; cook_status; time; temperature; pressure_if_any; storage_transition"
      collection_method: "calibrated scales plus validated route control log"
      unit: "kg; minutes or hours; degrees C"
      frequency: "every batch"
      temporal_coverage: "complete reporting period"
      site_scope: "every route and equipment train"
      aggregation_rule: "aggregate only batches with equivalent route and product qualifiers"
      quality_evidence: "calibration; HACCP or process-control record; batch release result"
    - protocol_id: cp_preservation_materials
      process_id: "preservation_route"
      flow_role: "salt, water, brine, and route ingredients"
      record_type: "batch formulation record"
      raw_fields: "batch_id; salt_mass; water_mass; reused_brine_mass; discharged_brine_mass; ingredient_identity; food_grade_status; concentration_measurement"
      collection_method: "weigh tickets, flow meter, and formulation log"
      unit: "kg; mass fraction"
      frequency: "every batch"
      temporal_coverage: "complete reporting period"
      site_scope: "each route and facility"
      aggregation_rule: "report virgin, reused, retained, and discharged quantities separately"
      quality_evidence: "scale or meter calibration; ingredient specification; formulation approval"
    - protocol_id: cp_preservation_energy
      process_id: "preservation_route"
      flow_role: "electricity, thermal fuel, smoke medium, and direct emissions"
      record_type: "meter, fuel, and maintenance record"
      raw_fields: "batch_id; electricity_kWh; fuel_quantity; fuel_LHV; steam_quantity; equipment_time; smoke_medium; refrigerant_top_up; emission_factor_id; direct_measurement"
      collection_method: "submeter and purchase records; direct emissions measurement or cited factor when calculated"
      unit: "kWh; MJ; kg"
      frequency: "batch, shift, or monthly with batch allocation"
      temporal_coverage: "complete reporting period"
      site_scope: "each preservation equipment train"
      aggregation_rule: "convert energy units explicitly; allocate shared energy by causal driver; calculate each emission by substance"
      quality_evidence: "meter calibration; invoices; fuel certificate; factor citation; leak and stack records"
    - protocol_id: cp_preservation_quality
      process_id: "preservation_route"
      flow_role: "moisture, water activity, salt, temperature, and product state"
      record_type: "laboratory and process-control record"
      raw_fields: "batch_id; sample_id; sampling_location; moisture_result; moisture_method; aw_result; aw_method; salt_result; core_temperature; storage_requirement; specification_limit"
      collection_method: "validated laboratory or calibrated in-line method"
      unit: "mass fraction; aw; degrees C"
      frequency: "each batch or validated sampling plan"
      temporal_coverage: "complete reporting period"
      site_scope: "every declared product specification"
      aggregation_rule: "retain batch result and report production-weighted summary without replacing specification limits"
      quality_evidence: "method identifier; calibration; laboratory result; release decision"
    - protocol_id: cp_preservation_waste
      process_id: "preservation_route"
      flow_role: "spent brine, wastewater, condensate, and route residues"
      record_type: "discharge and waste record"
      raw_fields: "batch_id; stream_identity; mass_or_volume; density; salt_concentration; destination; treatment; reuse_quantity"
      collection_method: "flow meter, tank level, weigh ticket, or documented mass balance"
      unit: "kg; m3; mass fraction"
      frequency: "each discharge or batch"
      temporal_coverage: "complete reporting period"
      site_scope: "each discharge point"
      aggregation_rule: "convert volume with recorded density; separate reuse, on-site treatment, and off-site treatment"
      quality_evidence: "meter calibration; manifest; treatment receipt; mass-balance review"
    - protocol_id: cp_packaging_materials
      process_id: "packaging_and_storage"
      flow_role: "primary and secondary packaging and scrap"
      record_type: "packaging issue and waste record"
      raw_fields: "material_id; supplier; mass_per_item; items_issued; conforming_packs; unused_returns; reject_mass; destination"
      collection_method: "bill of materials verified by weigh check and inventory reconciliation"
      unit: "kg; item"
      frequency: "each packaging run"
      temporal_coverage: "complete reporting period"
      site_scope: "every included pack format"
      aggregation_rule: "calculate used mass from verified item mass and reconcile issues, returns, and scrap"
      quality_evidence: "supplier specification; scale check; inventory and waste records"
    - protocol_id: cp_packaging_storage_energy
      process_id: "packaging_and_storage"
      flow_role: "packaging electricity, cold storage, and refrigerant"
      record_type: "meter and refrigeration log"
      raw_fields: "equipment_id; electricity_kWh; storage_temperature; entry_time; exit_time; storage_mass; refrigerant_type; top_up_mass; leak_event"
      collection_method: "equipment submeter or main-meter allocation; temperature logger; maintenance record"
      unit: "kWh; degrees C; kg*h; kg refrigerant"
      frequency: "continuous or shift meter; each storage lot"
      temporal_coverage: "complete reporting period including plant-gate storage"
      site_scope: "each packaging line and cold room"
      aggregation_rule: "allocate cold-room electricity by refrigeration-load proxy and mass-time; report refrigerant by substance"
      quality_evidence: "meter calibration; continuous temperature record; maintenance invoice; allocation workbook"
    - protocol_id: cp_final_product_mass
      process_id: "packaging_and_storage"
      flow_role: "reference product and net-mass convention"
      record_type: "pack-out and batch release record"
      raw_fields: "batch_id; gross_pack_mass; packaging_mass; covering_liquid_mass; drained_abalone_mass; shell_included; conforming_product_mass; route; expiry_or_storage_instruction"
      collection_method: "calibrated scale and declared net/drained-mass procedure"
      unit: "kg"
      frequency: "every lot or statistically controlled pack check"
      temporal_coverage: "complete reporting period"
      site_scope: "every included product and pack format"
      aggregation_rule: "normalize inventory to measured conforming mass using the declared net-mass convention"
      quality_evidence: "scale calibration; legal-metrology check; label; batch release certificate"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = reporting-period amount / reporting-period conforming reference-product mass"
      inputs:
        - "flow amount"
        - "conforming reference-product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - iso-14044-2006
    - id: calc_net_product_mass
      applies_to: "brined and packaged product"
      rule: "net reference mass = gross filled-pack mass - packaging mass; report covering-liquid mass and drained abalone mass separately and declare which is the saleable-product basis"
      inputs:
        - "gross pack mass"
        - "packaging mass"
        - "covering-liquid mass"
        - "drained mass"
      output: "net product mass and drained-mass qualifier"
      source_ids:
        - codex-cxs-311-2013
    - id: calc_energy_conversion
      applies_to: "electricity"
      rule: "MJ = kWh x 3.6; retain the original kWh record and do not treat the conversion as an energy estimate"
      inputs:
        - "metered kWh"
      output: "MJ"
      source_ids:
        - iso-14044-2006
    - id: calc_route_yield
      applies_to: "preparation and preservation"
      rule: "yield = measured conforming output mass / measured input abalone mass, using consistent shell, covering-liquid, and moisture bases"
      inputs:
        - "input mass"
        - "output mass"
        - "shell state"
        - "moisture basis"
      output: "route-specific mass yield"
      source_ids:
        - lemus-mondaca-2018-abalone-drying
    - id: calc_brine_composition
      applies_to: "salting and brining"
      rule: "initial brine salt fraction = salt mass / (salt mass + water mass); report reused brine and final measured concentration separately"
      inputs:
        - "salt mass"
        - "water mass"
        - "reused-brine record"
        - "measured concentration"
      output: "prepared brine fraction and final concentration"
      source_ids:
        - codex-cac-rcp-52-2003
        - codex-cxs-311-2013
    - id: calc_removed_water
      applies_to: "drying and smoke-drying"
      rule: "removed water = input water mass + added water - output product water mass - liquid waste water mass, with every term based on measured mass and moisture"
      inputs:
        - "input/output masses"
        - "moisture results"
        - "added water"
        - "liquid wastes"
      output: "water removed to air and balance residual"
      source_ids:
        - lemus-mondaca-2018-abalone-drying
    - id: calc_shared_utilities
      applies_to: "shared meters"
      rule: "allocate shared amount using the documented causal driver; sum allocated amounts back to the measured total and report unallocated residual"
      inputs:
        - "meter total"
        - "excluded use"
        - "equipment time"
        - "refrigeration load"
        - mass-time
      output: "allocated utility amount and residual"
      source_ids:
        - iso-14044-2006
        - eu-pef-method-2021
    - id: calc_mass_balance
      applies_to: "each process and reporting period"
      rule: "mass-balance residual = total measured mass inputs - total measured mass outputs; investigate and disclose moisture change, evaporation, sampling, stock change, and measurement uncertainty"
      inputs:
        - "all mass inputs"
        - "all mass outputs"
        - "inventory change"
      output: "residual mass and explanation"
      source_ids:
        - iso-14044-2006
        - codex-cac-rcp-52-2003
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and raw material"
      requirement: "Identify *Haliotis* species or justified mix, wild or farmed source, supplier geography, shell state, preservation route, cooking status, pack format, and storage condition."
      evidence: "lot traceability; supplier declaration; product specification; label"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Cover a complete representative reporting period including seasonal and storage-load variation; if shorter, disclose the period, campaign context, and representativeness limitation."
      evidence: "dated batch, meter, purchase, and production records; eu-pef-method-2021"
    - id: dq_technological
      applies_to: "preservation and packaging"
      requirement: "Match collected data to the actual equipment train, preservation sequence, packaging atmosphere, and cold-store operation represented."
      evidence: "equipment list; process flow; batch controls; eu-pef-method-2021"
    - id: dq_geographical
      applies_to: "utilities and upstream links"
      requirement: "Use site-specific utilities and geographically appropriate upstream datasets or explain proxy selection."
      evidence: "site address; utility supplier; dataset metadata; eu-pef-method-2021"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Include every required process and all measured raw material, water, salt, energy, packaging, product, waste, wastewater, and direct-emission streams; document zero, not-applicable, and unavailable records separately."
      evidence: "reconciled ledger; meter coverage map; mass and energy checks"
    - id: dq_measurement
      applies_to: "mass, energy, temperature, moisture, and aw"
      requirement: "Use calibrated instruments or verified invoices and retain method, calibration, sampling, and conversion evidence."
      evidence: "calibration certificate; laboratory method; invoice; logger record"
    - id: dq_route_separation
      applies_to: "multi-product facilities"
      requirement: "Separate routes and materially different product forms by direct records or a documented causal allocation driver."
      evidence: "submeter; batch schedule; allocation workbook; iso-14044-2006"
    - id: dq_estimate_status
      applies_to: "provisional ranges"
      requirement: "Treat every reasoned_estimate range as a QA screen only; replace it with collected values and source-backed factors before a dataset is released for normal use."
      evidence: "dataset review record; completed collection protocols"
validation_rules:
  - rule_id: validate_identity_and_scope
    applies_to: "product_identity"
    rule: "Confirm *Haliotis* identity, one declared raw-material source, covered preservation route, shell/form state, packaging, and storage condition; reject otherwise prepared products and undeclared route mixtures."
    source_ids:
      - environdec-fish-and-fish-products-pcr-v1
      - codex-cac-rcp-52-2003
  - rule_id: validate_reference_flow
    applies_to: "reference_flow"
    rule: "Confirm product flow 61e83c4f-6657-4762-9a2b-9423a54b7bd5, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass group 93a60a57-a4c8-11da-a746-0800200c9a66, kg unit, and a reproducible net-mass convention."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_process_completeness
    applies_to: "process_inventory"
    rule: "Confirm receipt and preparation, the actual preservation operation, packaging, and plant-gate storage are present, while non-occurring preservation routes are absent or explicitly not applicable."
    source_ids:
      - codex-cac-rcp-52-2003
  - rule_id: validate_mass_balance
    applies_to: "mass_inventory"
    rule: "Reconcile measured input, product, residue, wastewater, covering-liquid, moisture-removal, and inventory-change masses for each process and disclose unresolved residuals."
    source_ids:
      - iso-14044-2006
      - codex-cac-rcp-52-2003
  - rule_id: validate_frozen_route
    applies_to: "frozen_product"
    rule: "For frozen product, retain freezing and storage time-temperature records; use at or colder than -18 degrees C as the Codex benchmark unless a governing product or jurisdictional specification requires a different validated limit."
    source_ids:
      - codex-cac-rcp-52-2003
  - rule_id: validate_smoked_dried_route
    applies_to: "smoked_dried_product"
    rule: "Record smoking, drying, salt, packaging, storage, moisture, and water-activity controls. If shelf stability is claimed using the CXS 311 smoke-dried benchmark, demonstrate aw at or below 0.75 or moisture at or below 10 percent; otherwise retain the validated product-specific limit and storage requirement."
    source_ids:
      - codex-cxs-311-2013
      - fda-seafood-hazards-controls-2022
  - rule_id: validate_brine_and_salt
    applies_to: "salted_or_brined_product"
    rule: "Reconcile food-grade salt, water, reused brine, retained covering liquid, and spent brine; record measured formulation or final concentration rather than assuming salt uptake."
    source_ids:
      - codex-cac-rcp-52-2003
      - codex-cxs-311-2013
  - rule_id: validate_packaging_and_label
    applies_to: "packaged_product"
    rule: "Confirm packaging material and atmosphere, net or drained-mass convention, lot identity, and storage/handling instructions match the represented product."
    source_ids:
      - codex-cxs-311-2013
      - fda-seafood-hazards-controls-2022
  - rule_id: validate_data_quality
    applies_to: "dataset_release"
    rule: "Confirm temporal, technological, geographical, completeness, and precision evidence and disclose proxy datasets, allocation, exclusions, and uncertainty."
    source_ids:
      - eu-pef-method-2021
      - iso-14044-2006
  - rule_id: validate_no_estimate_as_observation
    applies_to: "quantitative_inventory"
    rule: "Fail release when a provisional reasoned_estimate has been copied into the foreground inventory as if observed; only collected or transparently calculated values may populate the released foreground amounts."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; may be used as background_dataset only after methodology review, aggregation, and uncertainty disclosure"
  downstream_use: "Foreground process datasets and downstream lifecyclemodel projections for processed abalone supply at the plant gate"
  allowed_use: "Gate-to-gate product modelling with explicit upstream wild-harvest or aquaculture links; route-specific supply-chain studies; inventory development and reviewed aggregation"
  excluded_use: "Direct comparison across shell, drained-mass, route, or storage conventions without conversion; attribution of aquaculture or harvest burdens to this gate-to-gate dataset; legal food-safety certification; use of provisional ranges as measured data"
  required_metadata: "PCR id and version state; species/source; supplier geography; shell and product form; route sequence; cooking status; net/drained/covering-liquid mass basis; moisture and aw where applicable; packaging and atmosphere; storage temperature and duration; reporting period; site geography; allocation; upstream dataset references"
  required_quality_disclosure: "Meter and batch coverage; calibration and laboratory methods; data gaps and proxies; reasoned estimates remaining as QA screens; mass-balance residuals; shared-utility allocation; co-product decisions; uncertainty and representativeness limitations"
  update_trigger: "Change in raw-material source, species mix, preservation equipment or sequence, formulation, shelf-stability specification, packaging atmosphere or material, refrigeration system, storage duration, allocation method, or evidence that materially changes a rule or QA range"
