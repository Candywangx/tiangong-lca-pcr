measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Normalize all foreground exchanges to 1 kg of saleable meal excluding every packaging component; derive net mass from verified pack fill weights and accepted units, not nominal gross package weight."
  - id: ingredient_wet_mass
    applies_to: "seafood and other ingredients"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record each ingredient separately on the as-received wet-mass basis and retain moisture or solids content when it is needed for recipe or yield reconciliation."
  - id: packaging_component_mass
    applies_to: "primary, secondary, and tertiary packaging"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record each material component separately and allocate reusable transport packaging by measured uses or documented lifetime."
  - id: energy_carrier_separation
    applies_to: "electricity, steam, purchased heat, and fuels"
    required_property_ref:
      name: "Energy or fuel mass/volume"
      uuid: ""
    required_unit: "kWh, MJ, kg, or m3"
    rule: "Preserve metered or invoiced carrier units and convert with documented calorific value and density where needed; never combine carriers in one exchange."
  - id: water_balance
    applies_to: "ingredient water, process water, sanitation water, wastewater, and treated effluent"
    required_property_ref:
      name: "Mass or volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Keep water uses and discharges separate by role; if volume is converted to mass, document measured density or the water-density convention."
  - id: refrigerant_component_mass
    applies_to: "refrigerant make-up and direct leakage"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record ammonia and each halocarbon component separately; derive leakage from charge, purchases, recovery, and stock change rather than a generic refrigerant percentage."
  - id: mass_reconciliation
    applies_to: "each production lot"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile ingredient and processing-water inputs to saleable product, co-products, food losses, seafood residues, packaging scrap, wastewater, sludge, and retained inventory, with all terms normalized to the reference flow."
process_map:
  - id: receipt_cold_storage
    name: "Ingredient receipt and temperature-controlled storage"
    inclusion: "required"
    inclusion_condition: "Always; non-refrigerated shelf-stable inputs shall report refrigeration rows as not applicable"
    role: "foreground receipt and storage"
    quantitative_reference: "kg accepted seafood ingredients"
  - id: seafood_preparation_formulation
    name: "Seafood preparation and recipe formulation"
    inclusion: "required"
    inclusion_condition: "Always; individual seafood and recipe-component rows apply only when present in the declared recipe"
    role: "foreground preparation and mixing"
    quantitative_reference: "kg formulated uncooked meal mix"
  - id: cooking_preservation
    name: "Cooking or validated preservation treatment"
    inclusion: "required"
    inclusion_condition: "Always; energy-carrier rows apply only to carriers actually used"
    role: "foreground transformation"
    quantitative_reference: "kg cooked or otherwise preserved meal base"
  - id: packaging_cooling
    name: "Portioning, packaging, cooling or freezing"
    inclusion: "required"
    inclusion_condition: "Always; MAP gases, freezing, and refrigerant-component rows apply only when used"
    role: "foreground finishing"
    quantitative_reference: "kg saleable packaged meal"
  - id: sanitation_wastewater
    name: "Sanitation and on-site wastewater management"
    inclusion: "required"
    inclusion_condition: "Sanitation is always included; on-site treatment outputs apply when the facility operates treatment before discharge"
    role: "foreground support and treatment"
    quantitative_reference: "kg saleable packaged meal"
