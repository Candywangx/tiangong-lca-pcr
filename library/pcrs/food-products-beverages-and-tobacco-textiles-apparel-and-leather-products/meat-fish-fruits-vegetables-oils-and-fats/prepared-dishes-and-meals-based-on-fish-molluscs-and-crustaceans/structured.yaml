allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared manufacturing and support processes"
    rule: "Avoid allocation by submetering or subdividing storage, preparation, cooking, packaging, sanitation, and wastewater operations wherever practicable."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_driver
    applies_to: "residual shared utilities"
    rule: "When subdivision is not practicable, allocate a shared utility by a documented causal physical driver such as metered equipment time and load, occupied storage volume-time, treated wastewater volume and load, or packaging-machine throughput; use mass only when it represents the physical relationship."
    source_ids:
      - eu-pef-2021-2279
      - schmidt-rivera-azapagic-2019-ready-meals
  - rule_id: allocation_seafood_outputs
    applies_to: "seafood residues and recovered materials"
    rule: "Classify each outgoing material as co-product or waste from its actual legal and economic status. For a co-product, prefer subdivision or system expansion, then a documented physical relationship; use economic allocation only when no defensible physical relationship exists. Do not credit a waste destination as avoided production inside the factory-gate result unless an explicit system-expansion scenario is reported separately."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recipe_batches
    applies_to: "multi-product batches"
    rule: "Allocate shared batch inputs to saleable meal variants using measured recipe mass, actual yields, equipment occupancy, and rework transfers; disclose the rule and prohibit allocation to rejected product as if it were saleable output."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "receipt_cold_storage_seafood_preparation_formulation_cooking_preservation_packaging_cooling"
      flow_role: "seafood and recipe material inputs"
      record_type: "receiving records, batch sheets, scales, recipe system"
      raw_fields: "material identity; supplier; species; origin; input state; lot; gross mass; tare; accepted mass; recipe issue"
      collection_method: "calibrated scale and controlled batch record"
      unit: "kg"
      frequency: "every receipt and batch"
      temporal_coverage: "representative continuous 12-month period, or full shorter campaign"
      site_scope: "all facilities producing the declared product"
      aggregation_rule: "sum accepted mass by atomic material and lot; normalize to accepted process output and reference flow"
      quality_evidence: "scale calibration, supplier lot traceability, recipe version, acceptance record"
    - protocol_id: cp_output_mass
      process_id: "all_production_processes"
      flow_role: "intermediate and final product output"
      record_type: "batch yield and pack records"
      raw_fields: "batch id; output identity; good mass; rework mass; retained inventory; pack count; net fill"
      collection_method: "calibrated scale and verified pack-count reconciliation"
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "same period as input records"
      site_scope: "all included lines and sites"
      aggregation_rule: "sum accepted outputs and reconcile transfers between processes"
      quality_evidence: "scale calibration, release record, mass-balance sign-off"
    - protocol_id: cp_energy_meter
      process_id: "all_production_processes"
      flow_role: "electricity, steam, and purchased heat"
      record_type: "submeters, utility meters, invoices, equipment logs"
      raw_fields: "carrier; meter id; opening and closing reading; batch time; load; production mass"
      collection_method: "prefer direct submetering; otherwise allocate by documented physical driver"
      unit: "kWh or MJ"
      frequency: "continuous or each batch; invoice reconciliation monthly"
      temporal_coverage: "representative continuous 12-month period"
      site_scope: "every included line and support system"
      aggregation_rule: "subtract baseline where justified, allocate by causal driver, normalize to process output"
      quality_evidence: "meter calibration or verification, invoice reconciliation, allocation worksheet"
    - protocol_id: cp_fuel_records
      process_id: "cooking_preservation"
      flow_role: "each on-site fuel"
      record_type: "fuel meter, tank dip, delivery invoice, boiler log"
      raw_fields: "fuel identity; quantity; density; lower heating value; sulfur and carbon content; boiler id; operating time"
      collection_method: "meter or stock balance reconciled to deliveries"
      unit: "m3 or kg"
      frequency: "each batch or daily; monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period"
      site_scope: "all included boilers and direct-fired equipment"
      aggregation_rule: "sum each fuel separately and normalize to treated meal output"
      quality_evidence: "meter check, invoice, stock reconciliation, fuel specification"
    - protocol_id: cp_water_chemicals
      process_id: "receipt_cold_storage_seafood_preparation_formulation_sanitation_wastewater"
      flow_role: "ice, water, cleaner, and disinfectant"
      record_type: "water meters, batch dosing records, purchase and stock records"
      raw_fields: "material identity; solution concentration; active content; opening and closing meter or stock; batch id"
      collection_method: "dedicated meter or mass/stock balance; calculate active chemical from solution mass and assay"
      unit: "kg or m3"
      frequency: "each batch or shift; monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period"
      site_scope: "all included preparation and sanitation areas"
      aggregation_rule: "sum by atomic material and role; normalize to process output"
      quality_evidence: "meter calibration, chemical certificate, dosing-system check, stock reconciliation"
    - protocol_id: cp_packaging_bom
      process_id: "packaging_cooling"
      flow_role: "packaging components and MAP gases"
      record_type: "approved bill of materials, issue records, scrap records, gas meter"
      raw_fields: "component material and layer; item mass; units issued; units returned; trim; rejected packs; gas identity and use"
      collection_method: "component weighing plus inventory issue and return; gas meter or cylinder balance"
      unit: "kg"
      frequency: "each packaging lot"
      temporal_coverage: "representative continuous 12-month period"
      site_scope: "all included package formats and lines"
      aggregation_rule: "calculate consumed mass per component, subtract returned stock, include scrap, normalize to net meal mass"
      quality_evidence: "packaging specification, scale check, stock reconciliation, approved artwork and gas recipe"
    - protocol_id: cp_refrigerant_balance
      process_id: "receipt_cold_storage_packaging_cooling"
      flow_role: "refrigerant make-up and direct emissions"
      record_type: "equipment register, service log, purchase, recovery, and stock records"
      raw_fields: "equipment id; refrigerant trade name; component composition; charge; additions; recovery; disposal; opening and closing stock"
      collection_method: "annual mass balance for each equipment system and each chemical component"
      unit: "kg"
      frequency: "every service event with annual reconciliation"
      temporal_coverage: "representative continuous 12-month period"
      site_scope: "all included cold stores, chillers, and freezers"
      aggregation_rule: "loss = opening stock + purchases + additions - recovered - transferred - closing stock; apportion by equipment service and physical storage driver"
      quality_evidence: "technician record, cylinder weights, refrigerant specification, balance closure"
    - protocol_id: cp_waste_mass
      process_id: "all_production_processes"
      flow_role: "each solid or liquid waste"
      record_type: "waste scales, bins, transfer notes, destruction and recovery records"
      raw_fields: "waste identity; process source; legal status; wet mass; dry solids where relevant; destination; date"
      collection_method: "dedicated weighing or verified container count and average mass"
      unit: "kg"
      frequency: "every batch or waste collection"
      temporal_coverage: "representative continuous 12-month period"
      site_scope: "all included lines and waste areas"
      aggregation_rule: "sum separately by atomic waste and destination; normalize to process output"
      quality_evidence: "scale calibration, transfer note, destination contract, classification record"
    - protocol_id: cp_effluent_monitoring
      process_id: "seafood_preparation_formulation_sanitation_wastewater"
      flow_role: "wastewater, sludge, and direct water emissions"
      record_type: "flow meter, composite samples, laboratory reports, sludge records"
      raw_fields: "wastewater source; volume or mass; sampling period; BOD; COD; total nitrogen; total phosphorus; TSS; oil and grease; sludge wet mass and dry solids"
      collection_method: "flow-proportional composite sampling where practicable and accredited laboratory analysis"
      unit: "m3, kg, or mg/L"
      frequency: "continuous flow; pollutant sampling at permit or representative operating frequency"
      temporal_coverage: "same representative period as production"
      site_scope: "all included drains and treatment units; separate external-transfer and direct-discharge routes"
      aggregation_rule: "pair concentration with flow for the same period; calculate pollutant mass; normalize to reference flow"
      quality_evidence: "meter calibration, chain of custody, laboratory accreditation, sampling plan, permit report"
    - protocol_id: cp_stack_emissions
      process_id: "cooking_preservation"
      flow_role: "direct combustion emissions"
      record_type: "continuous or periodic stack measurements, fuel records, equipment-specific factors"
      raw_fields: "pollutant; concentration; exhaust flow; operating time; fuel quantity; factor source; control efficiency"
      collection_method: "direct measurement preferred; otherwise calculate from atomic fuel records and documented factors"
      unit: "kg"
      frequency: "continuous or permit test; calculate for each reporting period"
      temporal_coverage: "same period as fuel inventory"
      site_scope: "every included combustion unit"
      aggregation_rule: "calculate each pollutant separately and normalize to treated meal output"
      quality_evidence: "calibration and test report or factor reference, fuel specification, calculation sheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every foreground exchange"
      rule: "normalized exchange = reporting-period exchange / reporting-period net saleable meal mass"
      inputs:
        - "atomic exchange quantity"
        - "accepted net meal mass"
      output: "quantity per 1 kg reference flow"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_recipe_yield
      applies_to: "preparation, cooking, and packaging"
      rule: "yield = accepted output mass / total recipe-material input mass; separately report evaporation, residues, wastewater transfers, rework, and unexplained imbalance"
      inputs:
        - "atomic ingredient masses"
        - "accepted outputs"
        - "waste and wastewater masses"
        - "inventory change"
      output: "stage yield and mass-balance closure"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_active_chemical
      applies_to: "cleaning agents"
      rule: "active chemical mass = solution mass × supplier-certified active mass fraction"
      inputs:
        - "solution mass"
        - "active fraction"
      output: "kg sodium hydroxide or sodium hypochlorite"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_refrigerant_components
      applies_to: "refrigeration"
      rule: "allocate system loss to each chemical component using the documented refrigerant composition; do not report only the blend trade name"
      inputs:
        - "system mass loss"
        - "component mass fractions"
        - "equipment service"
      output: "kg of each refrigerant component emitted"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_effluent_load
      applies_to: "direct discharge"
      rule: "pollutant mass = paired treated-effluent volume × pollutant concentration with consistent units"
      inputs:
        - "flow and BOD"
        - COD
        - "total nitrogen"
        - "total phosphorus"
        - TSS
        - "or oil-and-grease concentration"
      output: "kg of each pollutant to water"
      source_ids:
        - fao-fisheries-technical-paper-355
        - us-epa-seafood-effluent-guidelines
    - id: calc_shared_utility
      applies_to: "shared support systems"
      rule: "allocated quantity = measured shared quantity × product-specific causal driver / sum of drivers for all products; mass is allowed only when it represents the causal relationship"
      inputs:
        - "shared meter"
        - "equipment time/load"
        - "storage volume-time"
        - "wastewater load"
        - "or throughput"
      output: "product-attributed utility quantity"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and ingredients"
      requirement: "Preserve recipe version, seafood species, origin, input state, supplier lot, preservation route, package format, storage state, intended use, and net mass for every represented product."
      evidence: "batch record, supplier specification, product specification, approved label"
    - id: dq_temporal_alignment
      applies_to: "all foreground records"
      requirement: "Use one common representative reporting period, normally a continuous 12 months; a shorter campaign shall cover all operating states and disclose seasonality, start-up, shutdown, and abnormal events."
      evidence: "meter and batch date coverage, production calendar, variance review"
    - id: dq_mass_balance
      applies_to: "each process and the whole foreground"
      requirement: "Reconcile all material inputs, outputs, waste, wastewater, evaporation estimates, rework, and inventory change; investigate and disclose unexplained imbalance."
      evidence: "signed process and facility mass balance"
    - id: dq_atomicity
      applies_to: "inventory"
      requirement: "Keep each ingredient, packaging component, energy carrier, fuel, refrigerant component, chemical, waste, and direct emission as a separate exchange with its own identity and amount."
      evidence: "atomic row audit and source-record crosswalk"
    - id: dq_measurement
      applies_to: "meters, scales, and analyses"
      requirement: "Retain calibration or verification status, detection limits, sampling method, laboratory quality evidence, and conversion factors."
      evidence: "calibration certificates, laboratory reports, sampling and calculation records"
    - id: dq_representativeness
      applies_to: "upstream and foreground datasets"
      requirement: "Assess technological, geographical, and time-related representativeness and precision; disclose every proxy and substitution."
      evidence: "dataset quality assessment and proxy register"
    - id: dq_completeness
      applies_to: "known inputs and outputs"
      requirement: "Account for all known inputs and outputs, including direct air and water emissions; a justified exclusion shall identify the flow, basis, and expected significance."
      evidence: "completeness checklist, process walk-through, environmental permit cross-check"
validation_rules:
  - rule_id: validate_scope
    applies_to: "product identity"
    rule: "Confirm that the product is a composite prepared dish or meal characterized by fish, molluscs, crustaceans, or a declared combination and is not an excluded single seafood product."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_reference_mass
    applies_to: "reference flow"
    rule: "Confirm that the reference amount is exactly 1 kg net saleable meal excluding packaging and that pack-count and fill-mass records reconcile to it."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_qualifiers
    applies_to: "reference flow metadata"
    rule: "Fail completeness if recipe, seafood species and origin, seafood input state, seafood fraction, preservation route, intended use, storage state, package system, net mass, production geography, or reporting period is missing."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_process_coverage
    applies_to: "foreground boundary"
    rule: "Confirm that every applicable process in the map has records and that omitted or not-applicable steps are justified for the declared route."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_atomic_inventory
    applies_to: "all exchanges"
    rule: "Reject combined ingredient, utility, packaging, refrigerant, waste, or emission rows; each selected flow shall represent one atomic exchange."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_recipe_and_yield
    applies_to: "material balance"
    rule: "Confirm recipe issue, ingredient inputs, intermediate transfers, saleable output, rework, seafood residues, food loss, wastewater, and inventory change reconcile within a site-defined documented tolerance."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_refrigerants
    applies_to: "refrigeration"
    rule: "Confirm the equipment register covers every included cold store, chiller, and freezer and that make-up and leakage are resolved to individual chemical components."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_emissions
    applies_to: "direct emissions"
    rule: "Confirm every known direct air and water emission is measured or calculated separately and that concentration, flow, fuel, and operating-period records are temporally aligned."
    source_ids:
      - eu-pef-2021-2279
      - fao-fisheries-technical-paper-355
  - rule_id: validate_allocation
    applies_to: "shared processes and co-products"
    rule: "Confirm subdivision was attempted first, the chosen allocation driver is causal and documented, seafood outputs are classified as co-product or waste, and sensitivity is disclosed when an economic fallback materially affects results."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_data_quality
    applies_to: "published foreground dataset"
    rule: "Confirm temporal, technological, and geographical representativeness, measurement quality, proxy disclosure, and completeness of known inputs and outputs are documented."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Factory-gate foreground production dataset for a declared prepared seafood dish or meal"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product-specific process datasets and lifecycle models when recipe, seafood species and origin, preservation route, storage state, package format, geography, technology, allocation, and reporting period are compatible"
  excluded_use: "Comparative claims across dissimilar meal functions or serving qualities; substitution for unformulated seafood products; use without linked upstream ingredients and packaging; use as a cradle-to-grave result without explicit downstream modules"
  required_metadata: "canonical PCR id; recipe id and version; seafood species, origin, and input state; seafood mass fraction; complete ingredient list; process route; preservation and thermal treatment; ready-to-eat or heat-and-eat status; storage state and temperature; shelf-life basis; net mass; package components and MAP gas recipe; facility geography; technology; reporting period; allocation; waste and wastewater destinations"
  required_quality_disclosure: "collection coverage; calibration and laboratory evidence; material and energy balance; refrigerant balance; direct-emission method; temporal, geographical, and technological representativeness; proxy register; allocation drivers; completeness exclusions; unresolved Tiangong identities and range evidence"
  update_trigger: "recipe or seafood-species change; supplier-origin change; preservation or cooking technology change; package redesign; refrigerant conversion; energy-system change; wastewater-treatment or discharge change; allocation change; facility or geography change; or foreground data older than the declared representativeness period"
data_sources:
