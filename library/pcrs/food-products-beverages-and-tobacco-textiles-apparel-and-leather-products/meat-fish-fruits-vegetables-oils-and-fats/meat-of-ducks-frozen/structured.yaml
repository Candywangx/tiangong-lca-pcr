      frequency: "each lot"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "route plant"
      aggregation_rule: "accepted net live mass summed"
      quality_evidence: "calibration and lot reconciliation"
    - protocol_id: cp_utility_meters
      process_id: "all_processes"
      flow_role: "electricity"
      record_type: "meter/energy log"
      raw_fields: "meter id, opening/closing reading, interval, downtime, shared load"
