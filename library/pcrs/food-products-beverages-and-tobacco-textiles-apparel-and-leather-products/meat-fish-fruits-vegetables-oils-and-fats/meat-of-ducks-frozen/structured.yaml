      frequency: "batch/month"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "DAF unit"
      aggregation_rule: "consumption divided by matched influent"
      quality_evidence: "invoices, tank readings and concentration certificate"
  calculation_rules:
    - id: cr_normalize
      applies_to: "all inventory rows"
      rule: "reporting-period flow ÷ saleable reference-product mass × 1,000 kg"
      inputs:
        - "matched-period flow and frozen_duck_cuts net mass"
      output: "flow per reference amount"
      source_ids: []
    - id: cr_mass_balance
      applies_to: "slaughter and cut-up"
      rule: "inputs − outputs − inventory change; report absolute and percentage closure without forcing balance"
      inputs:
        - "all atomic wet-mass flows and inventory change"
      output: "unexplained mass and closure percentage"
      source_ids: []
    - id: cr_storage_energy
      applies_to: "frozen storage"
      rule: "matched storage kWh × product tonne-days ÷ total room tonne-days"
      inputs:
        - "daily inventory"
        - "residence time"
        - "room electricity"
      output: "kWh per reference-product tonne-day"
      source_ids:
        - fao-who-cxc-8-1976
    - id: cr_refrigerant
      applies_to: "refrigerant emission"
      rule: "opening charge + additions − closing charge − recovered mass"
      inputs:
        - "charge and service records"
      output: "kg named refrigerant to air, floored at zero only after investigation"
      source_ids: []
    - id: cr_allocation
      applies_to: "shared slaughter/cut burdens"
      rule: "shared burden × recipient plant-gate revenue ÷ total eligible revenue; repeat by split-point wet mass for sensitivity"
      inputs:
        - "eligible product masses"
        - prices
        - revenues
        - "shared burden"
      output: "economic allocation result and wet-mass sensitivity"
      source_ids:
        - ec-pef-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Prove species/strain, skin-on bone-in form, named-cut shares, air-blast technology, and package specification for every represented product family"
      evidence: "product specification, labels, batch and equipment records"
    - id: dq_time
      applies_to: "foreground data"
      requirement: "Use one representative continuous 12-month period; disclose shutdowns, seasonal gaps, and any shorter period"
      evidence: "dated raw records and coverage calculation"
    - id: dq_measurement
      applies_to: "measured flows"
      requirement: "Use calibrated meters/scales and retain meter-to-process maps; engineering allocation is allowed only when a dedicated meter is unavailable and uncertainty is disclosed"
      evidence: "calibration certificates, meter maps, allocation workbook"
    - id: dq_completeness
      applies_to: "all atomic flows"
      requirement: "Account for at least 95% of measured input mass and 95% of metered energy by included rows; list and justify exclusions individually"
      evidence: "mass/energy completeness reconciliation"
    - id: dq_sources
      applies_to: "external datasets"
      requirement: "Document geography, year, technology, provider, version, and transformation for each linked dataset"
      evidence: "dataset provenance register"
    - id: dq_estimates
      applies_to: "provisional ranges"
      requirement: "Do not publish a foreground amount taken from a reasoned_estimate range; replace it with collected/calculated evidence or disclose the dataset as incomplete"
      evidence: "estimate replacement log and review record"
validation_rules:
  - rule_id: val_identity
    applies_to: "Reference flow and product identity"
    rule: "Reference flow UUID, Mass property UUID, 1,000 kg amount, CPC identity, Pekin-duck qualifier, skin-on bone-in cut form, air-blast technology, and R717 ammonia refrigerant must match this PCR."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: val_route
    applies_to: "Required process route"
    rule: "All four required processes must be present in order; whole-duck, other cut-form, offal-reference, and non-air-blast routes may not be averaged into the dataset."
    source_ids:
      - unsd-cpc-3-2025
      - fao-slaughterhouses-poultry
  - rule_id: val_mass_balance
    applies_to: "Slaughter and cut-up mass balances"
    rule: "Slaughter and cut-up wet-mass balances must be reported; unexplained difference above 5% of input requires correction or a reviewed, flow-specific explanation."
    source_ids:
      - fao-slaughterhouses-poultry
  - rule_id: val_atomic
    applies_to: "All foreground exchanges"
    rule: "Electricity, steam, water, polymer film, cartons, ferric chloride, each product/co-product, each waste, wastewater, and named refrigerant emission must remain separate atomic rows."
    source_ids:
      - fao-slaughterhouses-poultry
      - ec-pef-2021
  - rule_id: val_temperature
    applies_to: "Freezing and frozen storage"
    rule: "Batch evidence must show product thermal centre no warmer than -18 °C after freezing stabilisation and frozen storage maintained at -18 °C or colder, with deviations disclosed."
    source_ids:
      - fao-who-cxc-8-1976
  - rule_id: val_allocation
    applies_to: "Shared burdens and co-products"
    rule: "Subdivision, eligible co-product status, plant-gate economic factors, and wet-mass sensitivity must all be present; waste may not receive co-product allocation."
    source_ids:
      - ec-pef-2021
  - rule_id: val_completeness
    applies_to: "Completed foreground package"
    rule: "Foreground records must cover the declared period and meet the 95% mass and energy completeness tests; provisional reasoned ranges cannot substitute for measured amounts."
    source_ids:
      - ec-pef-2021
  - rule_id: val_uuid
    applies_to: "All UUID-bearing fields"
    rule: "Blank non-reference flow UUIDs and the blank Mass unit-group UUID must remain explicitly unresolved and must never be populated by semantic guesswork."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific foreground unit-process package and aggregated factory-gate result for the locked frozen cut-up duck route"
  downstream_use: "secondary_dataset; may be used as a background_dataset only where the receiving study matches the declared route and qualifiers"
  allowed_use: "Comparative or attributional LCA of packaged frozen skin-on bone-in Pekin duck cuts when geography, time, technology, cut mix, and allocation are compatible"
  excluded_use: "Representation of frozen whole ducks, a single cut without composition adjustment, fresh/chilled meat, boneless/skinless products, offal, prepared duck, other freezing technologies, duck farming, distribution, retail, cooking, or consumption"
  required_metadata: "Plant geography and year; species/strain; cut names and mass shares; skin/bone state; slaughter and chilling configuration; freezer technology and refrigerant; package bill; storage temperature and tonne-days; wastewater route; upstream dataset versions; allocation factors"
  required_quality_disclosure: "Coverage period; missing or allocated meters; calibration status; mass and energy completeness; mass-balance closure; wastewater sampling; temperature deviations; refrigerant reconciliation; data-source representativeness; reasoned estimates; unresolved UUIDs"
  update_trigger: "Change in species/strain, cut composition, skin/bone form, slaughter/chilling line, principal freezing technology, refrigerant, packaging, wastewater treatment, storage regime, allocation status, plant geography, or data older than three years"
