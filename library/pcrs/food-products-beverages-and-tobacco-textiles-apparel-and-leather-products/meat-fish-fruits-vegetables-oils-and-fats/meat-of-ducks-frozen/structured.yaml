      collection_method: "annual charge reconciliation"
      unit: "kg"
      frequency: "each service and annual close"
      temporal_coverage: "same 12-month period"
      site_scope: "freezer and frozen store"
      aggregation_rule: "mass balance by named refrigerant"
      quality_evidence: "invoices, service sheets and recovery records"
    - protocol_id: cp_treatment_chemical
      process_id: "wastewater_pretreatment"
      flow_role: "ferric chloride"
