      unit: "kWh"
      frequency: "shift or batch"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "route equipment"
      aggregation_rule: "sum by process; storage by tonne-day"
      quality_evidence: "meter calibration and panel map"
    - protocol_id: cp_water_steam
      process_id: "slaughter_dress_chill"
      flow_role: "water and steam"
      record_type: "meter log"
      raw_fields: "water volume, steam mass, state, condensate return, interval"
      collection_method: "calibrated flow meter"
      unit: "m3; kg; MJ"
      frequency: "shift or batch"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "route process"
      aggregation_rule: "net use by batch"
      quality_evidence: "calibration and mass/energy reconciliation"
    - protocol_id: cp_output_mass
      process_id: "production_processes"
      flow_role: "products and co-products"
      record_type: "scale/production log"
      raw_fields: "flow identity, gross, tare, net, cut name, moisture basis, destination"
      collection_method: "calibrated scales and batch reconciliation"
      unit: "kg"
      frequency: "each batch/dispatch"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "route plant"
      aggregation_rule: "sum net mass by atomic flow"
      quality_evidence: "scale calibration and signed batch record"
    - protocol_id: cp_packaging
      process_id: "cut_pack"
      flow_role: "packaging inputs"
      record_type: "issue/return and specification record"
      raw_fields: "material, units issued, returns, unit mass, supplier spec"
      collection_method: "inventory reconciliation plus sample weighing"
      unit: "kg"
      frequency: "batch"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "packed route"
      aggregation_rule: "issued minus returned mass"
      quality_evidence: "purchase and sample-weight records"
    - protocol_id: cp_waste_mass
      process_id: "all_processes"
      flow_role: "solid wastes and rejects"
      record_type: "waste manifest/scale log"
      raw_fields: "waste identity, gross, tare, wet mass, dry matter if relevant, destination"
      collection_method: "calibrated scale"
      unit: "kg"
      frequency: "each dispatch"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "route plant"
      aggregation_rule: "sum by atomic waste and destination"
      quality_evidence: "manifests, tickets, sampling record"
    - protocol_id: cp_wastewater
      process_id: "slaughter_dress_chill_wastewater_pretreatment"
      flow_role: "wastewater"
      record_type: "flow meter and laboratory record"
      raw_fields: "volume, sample time, COD, BOD5, TSS, TN, TP, sampling basis"
      collection_method: "continuous flow meter and flow-proportional composite sample"
      unit: "m3; mg/L; kg"
      frequency: "continuous flow; at least monthly composite"
      temporal_coverage: "representative 12 consecutive months"
      site_scope: "route drains and pretreatment"
      aggregation_rule: "volume sum; concentration × matched volume"
      quality_evidence: "meter calibration, laboratory method and chain of custody"
    - protocol_id: cp_temperature
      process_id: "slaughter_dress_chill_air_blast_freeze_store"
      flow_role: "product and room temperature"
      record_type: "logger record"
      raw_fields: "sensor id, location, time, product-core temperature, room temperature, batch"
      collection_method: "calibrated continuous logger plus representative core probes"
      unit: "°C; h"
      frequency: "continuous per batch/store"
      temporal_coverage: "all reported batches"
