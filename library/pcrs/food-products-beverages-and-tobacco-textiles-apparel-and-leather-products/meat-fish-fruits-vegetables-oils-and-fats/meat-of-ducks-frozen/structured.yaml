allocation_rules:
  - rule_id: al_avoid
    applies_to: "All foreground processes"
    rule: "Avoid allocation first by separating metered process stages, destination-specific residue handling, freezing from storage, and product-specific cut-up batches."
    source_ids:
      - ec-pef-2021
  - rule_id: al_subdivide
    applies_to: "Separable outputs and operations"
    rule: "Attribute operations that exclusively produce or handle edible offal, recovered blood, feathers, trimmings, packaging scrap, rejects, or wastewater directly to those flows before allocating shared burdens."
    source_ids:
      - ec-pef-2021
  - rule_id: al_residual_economic
    applies_to: "Indivisible shared slaughter and cut-up burdens"
    rule: "Allocate remaining indivisible slaughter and cut-up burdens among the reference cut batch and co-products with positive revenue and intended beneficial use by contemporaneous plant-gate economic value; price source, currency, averaging period, and factors are mandatory. Do not transfer the PEF mammal default factors to ducks."
    source_ids:
      - ec-pef-2021
  - rule_id: al_mass_sensitivity
    applies_to: "Co-products receiving shared burden"
    rule: "For every co-product receiving residual shared burden, also report a wet-mass allocation sensitivity using measured split-point mass and disclosed moisture basis."
    source_ids:
      - ec-pef-2021
  - rule_id: al_waste
    applies_to: "Waste outputs"
    rule: "A residual with no intended beneficial use or positive revenue is waste, receives no co-product allocation, and carries its collection, on-site treatment, transport, and off-site treatment burdens from the point of generation."
    source_ids:
      - ec-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_live_mass
      process_id: "slaughter_dress_chill"
