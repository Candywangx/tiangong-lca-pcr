  reference_flow_link: "Factory-gate output of air_blast_freeze_store"
system_boundary:
  rules:
    - rule_id: sb_route_lock
      applies_to: "Declared route"
      rule: "Model only the declared Pekin-duck, immersion-chilled, skin-on bone-in cut-up, air-blast-frozen route; do not average whole ducks, individual cuts, offal, or other freezing technologies into the reference product."
      source_ids:
        - unsd-cpc-3-2025
        - fao-slaughterhouses-poultry
    - rule_id: sb_foreground_extent
      applies_to: "Foreground system"
      rule: "Include receiving through frozen-store dispatch plus on-site screening and dissolved-air-flotation pretreatment; treat farming, supplied materials and energy, off-site treatment, distribution, retail, and use as linked processes."
      source_ids:
        - fao-slaughterhouses-poultry
        - ec-pef-2021
    - rule_id: sb_upstream_link
      applies_to: "Purchased inputs"
      rule: "Every purchased product input shall link to a non-recursive upstream dataset with geography, technology, and time representativeness disclosed."
      source_ids:
        - ec-pef-2021
    - rule_id: sb_atomic_utilities
      applies_to: "All foreground exchanges"
      rule: "Record electricity, steam, process water, packaging materials, treatment chemical, wastewater, individual solid residues, and refrigerant emission as separate atomic flows; aggregated utility, waste, or emission placeholders are forbidden."
      source_ids:
        - fao-slaughterhouses-poultry
        - ec-pef-2021
    - rule_id: sb_temperature
      applies_to: "Chilling, freezing and storage"
      rule: "Separate immersion chilling, air-blast freezing, and frozen storage and retain their respective water, energy, temperature, and time evidence."
      source_ids:
        - fao-who-cxc-8-1976
