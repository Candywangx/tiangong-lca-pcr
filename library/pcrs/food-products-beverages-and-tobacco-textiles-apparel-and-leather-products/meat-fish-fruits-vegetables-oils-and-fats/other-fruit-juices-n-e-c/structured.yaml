  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period amount × 1,000 kg / saleable reference-product kg from the same period and scope"
      inputs:
        - "period exchange amount"
        - "saleable output kg"
      output: "exchange per 1,000 kg reference product"
      source_ids: []
    - id: calc_juice_mass_balance
      applies_to: "each production route"
      rule: "reconcile fruit, purchased juice, concentrate, incorporated water, aids, saleable juice, co-products, wastes, retained stock, and measured losses; investigate unexplained imbalance before publication"
      inputs:
        - "matched mass and stock records"
      output: "closed route-specific mass balance"
      source_ids:
        - codex-cxs-247-2005
        - fao-2001-fruit-juice-processing
    - id: calc_reconstitution_control
      applies_to: "reconstituted juice"
      rule: "verify final measured °Brix and species-specific formulation against concentrate and incorporated-water records; retain the applicable product specification and method"
      inputs:
        - "concentrate mass and °Brix"
        - water
        - "final juice mass and °Brix"
      output: "verified reconstitution record"
      source_ids:
        - codex-cxs-247-2005
    - id: calc_packaging_bom
      applies_to: "packaging inputs"
      rule: "component mass = issued component count × verified unit mass, reconciled with opening stock, purchases, closing stock, saleable units, and component-specific scrap"
      inputs:
        - "product-specific BoM"
        - counts
        - "unit masses"
        - "stock and scrap"
      output: "kg of each packaging component per reference flow"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "each refrigeration system"
      rule: "direct refrigerant emission = opening inventory + purchases + additions − recovered amount − closing inventory, with unexplained differences investigated"
      inputs:
        - "refrigerant inventory and service records"
      output: "kg of each refrigerant emitted"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_effluent_load
      applies_to: "each direct water pollutant"
      rule: "pollutant load = sum of matched effluent volume × laboratory concentration with unit conversion and sampling coverage disclosed"
      inputs:
        - "effluent volume"
        - "substance concentration"
        - "sampling coverage"
      output: "kg of one pollutant discharged"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain fruit species or mixture, route, °Brix and temperature, clarity, preservation, package, storage state, geography, and reference period; verify applicable identity and authenticity requirements."
