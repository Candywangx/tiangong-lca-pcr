allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared_operations"
    rule: "Avoid allocation by submetering or subdividing fruit species, product routes, batches, packaging lines, storage, sanitation, and wastewater operations wherever directly attributable records can be obtained."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_second
    applies_to: "unavoidable_shared_burdens"
    rule: "When subdivision is not feasible, use a documented physical relationship that represents the causal use of the shared input or service; mass, operating time, metered volume, or mass-time occupancy may be used only when it is relevant to that shared operation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_last
    applies_to: "co_products"
    rule: "If no relevant physical relationship can be justified for saleable juice, recovered aroma, or pomace co-products, allocate remaining shared burdens by consistent factory-gate economic value using a representative price period and disclose currency, period, quantities, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
      - esparza-2020-fruit-vegetable-waste
  - rule_id: allocation_waste_destination
    applies_to: "residues_and_wastes"
    rule: "Classify each residue once as a product or waste according to its documented destination. Do not simultaneously use the pomace product and pomace waste rows for the same mass, and do not credit avoided products inside the default attributional foreground dataset."
    source_ids:
      - esparza-2020-fruit-vegetable-waste
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_batch_balance
      process_id: "fruit_receiving_preparation"
      flow_role: "received fruit, preparation inputs, prepared fruit, rejects, wash wastewater"
      record_type: "weighbridge, batch, meter, dosing, and waste records"
      raw_fields: "fruit species; supplier; accepted kg; rejected kg; prepared kg; wash-water m3; sanitizer kg; electricity kWh; wastewater m3; destination"
      collection_method: "reconcile batch records with monthly purchase, meter, and waste totals"
      unit: "kg; m3; kWh"
      frequency: "each batch with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or full seasonal campaign"
      site_scope: "all in-scope receiving and preparation lines"
      aggregation_rule: "sum by fruit species and route, then normalize with calc_reference_normalization"
      quality_evidence: "calibrated scales and meters; supplier tickets; stock reconciliation; waste transfer notes"
    - protocol_id: cp_extraction_batch_balance
      process_id: "juice_extraction_separation"
      flow_role: "extraction inputs, juice, aroma, pomace, wastewater"
      record_type: "batch, meter, dosing, transfer, and waste records"
      raw_fields: "prepared fruit kg; enzyme kg; water m3; electricity kWh; raw juice kg and °Brix; aroma kg; pomace kg and destination; wastewater m3"
      collection_method: "close mass and water balances for each extraction route"
      unit: "kg; m3; kWh; °Brix"
      frequency: "each batch with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or full seasonal campaign"
      site_scope: "all in-scope extraction lines"
      aggregation_rule: "keep species and route separate before reference-flow normalization"
      quality_evidence: "calibrated scales and meters; laboratory °Brix; dosing logs; transfer and destination records"
    - protocol_id: cp_finishing_material_utility_balance
      process_id: "formulation_finishing"
      flow_role: "juice formulation, aids, utilities, refrigerants, bulk output, finishing wastes"
      record_type: "batch recipe, stock, meter, refrigerant, transfer, and waste records"
      raw_fields: "juice and concentrate kg and °Brix; water m3; each aid kg; electricity kWh; steam MJ; natural gas MJ; refrigerant additions and recovery kg; bulk juice kg and °Brix; wastes kg or m3"
      collection_method: "reconcile formulation and concentration balances with utility and stock records"
      unit: "kg; m3; kWh; MJ; °Brix"
      frequency: "each batch; utilities at least monthly"
      temporal_coverage: "representative continuous 12-month period or full seasonal campaign"
      site_scope: "all in-scope finishing equipment"
      aggregation_rule: "calculate species-specific soluble-solids and mass balance before aggregation"
      quality_evidence: "calibrated instruments; recipes; invoices; stock reconciliation; refrigerant service logs; laboratory records"
    - protocol_id: cp_packaging_bom_balance
      process_id: "stabilization_packaging"
      flow_role: "juice input, actual packaging components, electricity, product and packaging rejects"
      record_type: "bill of materials, packaging issue, line meter, production, warehouse, and scrap records"
      raw_fields: "juice input kg; each component identity and kg; electricity kWh; saleable output kg; off-spec juice kg; each scrap material kg and destination"
      collection_method: "reconcile product-specific BoM and packaging issues with saleable units, inventory change, and scrap"
      unit: "kg; kWh"
      frequency: "each product run with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or full seasonal campaign"
      site_scope: "all in-scope stabilization and packaging lines"
      aggregation_rule: "preserve every packaging component as an individual exchange before normalization"
      quality_evidence: "approved BoM; purchase and issue records; line counts; calibrated scales; scrap transfer notes"
    - protocol_id: cp_storage_energy_refrigerant
      process_id: "cold_storage"
      flow_role: "stored product, electricity, refrigerant and leakage"
      record_type: "warehouse, submeter, occupancy, and refrigerant-service records"
      raw_fields: "product kg; entry and release times; temperature setpoint; electricity kWh; installed refrigerant; additions, recovery, and inventory change kg"
      collection_method: "allocate submetered energy by documented mass-time occupancy and close refrigerant mass balance"
      unit: "kg; kg·day; kWh; °C"
      frequency: "warehouse movement continuously; energy monthly; refrigerant per service event and annually"
      temporal_coverage: "representative continuous 12-month period or full seasonal campaign"
      site_scope: "all in-scope cold rooms and refrigeration systems"
      aggregation_rule: "normalize only the occupancy and refrigerant share attributable to the declared product"
      quality_evidence: "warehouse logs; calibrated temperature and energy meters; service invoices; leak checks"
    - protocol_id: cp_sanitation_wastewater_records
      process_id: "sanitation_wastewater"
      flow_role: "sanitation inputs, wastewater, sludge and screenings"
      record_type: "cleaning-cycle, purchase, meter, treatment, laboratory, and waste records"
      raw_fields: "water m3; each cleaner and disinfectant kg; electricity kWh; steam MJ; wastewater m3; sludge and screenings kg; destinations; treatment operation"
      collection_method: "reconcile cleaning cycles and treatment records with purchase, meter, and waste totals"
      unit: "kg; m3; kWh; MJ"
