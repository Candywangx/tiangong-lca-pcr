      applies_to: "residues and waste"
      requirement: "Record actual destination, product-versus-waste status, moisture or dry matter where relevant, and transfer evidence without assigning the same mass to two routes."
      evidence: "weigh tickets; contracts; transfer notes; treatment invoices; esparza-2020-fruit-vegetable-waste"
validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "product_identity"
    rule: "The declared product must be unfermented fruit juice within CPC 21439 and must not be one of the five separately classified juices, vegetable juice, nectar, purée sold as purée, or an alcoholic or non-juice drink."
    source_ids:
      - unstats-cpc-3-21439
      - codex-cxs-247-2005
  - rule_id: validate_reference_flow
    applies_to: "reference_product"
    rule: "The output must normalize to 1,000 kg using the confirmed mass property and unit group, and all required product qualifiers must be present."
    source_ids:
      - codex-cxs-247-2005
  - rule_id: validate_route_processes
    applies_to: "process_coverage"
    rule: "Every process used by the declared route must appear, including sanitation; direct-fruit routes require receiving and extraction, reconstituted routes require concentrate and incorporated-water records, and chilled or frozen routes require cold storage."
    source_ids:
      - conidi-2020-fruit-juice-membranes
      - fao-2001-fruit-juice-processing
      - codex-cxc-1-1969
  - rule_id: validate_atomic_inventory
    applies_to: "inventory_rows"
    rule: "Each ingredient, aid, packaging component, electricity supply, purchased steam, fuel, refrigerant, waste, and direct emission must be represented as one atomic exchange; collection labels and combined carrier rows are nonconforming."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_no_double_count
    applies_to: "utilities_and_residues"
    rule: "Purchased steam and fuel used to generate onsite steam must not represent the same heat, and a residue mass must not be recorded simultaneously as both co-product and waste."
    source_ids:
      - eu-pef-2021-2279
      - esparza-2020-fruit-vegetable-waste
  - rule_id: validate_balances
    applies_to: "mass_water_packaging"
    rule: "Species- and route-specific mass, reconstitution, packaging, water, refrigerant, and waste balances must be reconciled and unexplained differences documented before release."
    source_ids:
      - codex-cxs-247-2005
      - eu-pef-2021-2279
  - rule_id: validate_direct_releases
    applies_to: "elementary_flows"
    rule: "Every direct air or water release must identify one substance, release compartment, calculation method, matched activity record, and evidence source; wastewater volume alone does not represent its pollutant loads."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_ranges
    applies_to: "quantitative_ranges"
    rule: "No empirical or QA range may be added until at least two independent, original, boundary-compatible sources support the same unit and normalization basis; absent evidence remains an unresolved range need rather than an invented value."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for other fruit juice, n.e.c., at the processing-site factory gate."
  downstream_use: "secondary_dataset; background_dataset after review and publication."
  allowed_use: "Product-specific LCI and lifecycle models whose fruit species or mixture, concentration state, route, preservation, packaging, storage, geography, technology, and period are compatible with the dataset."
  excluded_use: "Generic substitution for separately classified juices; use for nectar, vegetable juice, purée, fermented beverages, or non-juice drinks; comparative assertions without equivalent product qualifiers and downstream boundaries."
  required_metadata: "canonical PCR id; fruit species or mixture; route and starting material; °Brix and measurement temperature; clarity; preservation; packaging BoM; storage state; site geography; reference period; technology; allocation; waste destinations; exclusions; data sources; unresolved identities and limitations"
  required_quality_disclosure: "foreground coverage and reconciliation; meter and record quality; representativeness and precision; upstream proxies; allocation sensitivity; laboratory and emissions methods; cut-offs; unresolved flow UUIDs and unresolved range evidence"
  update_trigger: "Change in fruit species or formulation, starting material, concentration or preservation technology, package, storage regime, energy or refrigerant system, waste destination, allocation, site geography, or representative reference period; or resolution of material UUID or range-evidence gaps."
