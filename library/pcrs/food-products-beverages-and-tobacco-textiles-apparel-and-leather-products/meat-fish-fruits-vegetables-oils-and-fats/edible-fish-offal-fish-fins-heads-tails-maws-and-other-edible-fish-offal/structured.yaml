    - id: dq_food_safety_traceability
      applies_to: "Edible disposition and preservation"
      requirement: "Retain traceability, temperature or preservation-control, sanitation, rejection, and corrective-action records required for the declared product and market."
      evidence: "HACCP or equivalent control records; lot release records codex-cxc-52-2003"
validation_rules:
  - rule_id: vr_reference_flow
    applies_to: "Reference product"
    rule: "Verify exactly one reference output of 1 kg net edible fish offal with the specified product-flow, Mass-property, unit-group UUIDs, and all required qualifiers."
    source_ids: []
  - rule_id: vr_scope_route
    applies_to: "Product identity and boundary"
    rule: "Verify the dataset represents edible fish offal for human consumption, declares one or more preservation routes, and includes every performed foreground step and linked upstream supply."
    source_ids:
      - unsd-cpc-3-2025
      - codex-cxc-52-2003
  - rule_id: vr_mass_balance
    applies_to: "All mass flows"
    rule: "Verify consistent mass bases, a documented mass balance, and a justified site-specific reconciliation tolerance; a difference outside that tolerance shall produce a finding."
    source_ids: []
  - rule_id: vr_energy_water_waste
    applies_to: "Foreground inventory"
    rule: "Verify water, ice, energy, salt or brine, smoking material, packaging, waste, wastewater, and refrigerant rows are present when applicable, with collected values or an explicit justified zero or non-applicability statement."
    source_ids:
      - codex-cxc-52-2003
      - eu-pef-2021
  - rule_id: vr_allocation
    applies_to: "Shared and joint operations"
    rule: "Verify allocation choice, driver, co-product set, upstream separation treatment, and sensitivity are disclosed and no burden or credit is double counted."
    source_ids:
      - eu-pef-2021
  - rule_id: vr_estimate_disclosure
    applies_to: "Provisional data"
    rule: "Verify every use of a provisional range is labelled reasoned_estimate; such ranges are screening flags, not evidence of conformity, and require replacement or uncertainty disclosure."
    source_ids: []
  - rule_id: vr_food_safety_disclosure
    applies_to: "Route controls"
    rule: "Verify applicable food-safety control records and market-specific numeric limits are identified; do not validate legal compliance from this PCR's LCA QA ranges."
    source_ids:
      - codex-cxc-52-2003
published_dataset_profile:
  dataset_role: "Foreground production dataset for packed edible fish offal at the processor gate"
  downstream_use: "secondary_dataset; background_dataset after methodology review and quality disclosure"
  allowed_use: "Product-footprint and LCA modelling for the declared species or group, anatomical part, preservation route, geography, technology, and period"
  excluded_use: "Whole-fish, fillet, fish-meal, fish-oil, gelatin, feed, pet-food, pharmaceutical, composite-meal, or unrepresented preservation routes; legal food-safety conformity assessment"
  required_metadata: "PCR id; product-flow UUID; species or group; anatomical part; edible status; preservation route; product temperature/state; packaging; net-mass basis; geography; technology; reference period; upstream dataset; allocation; cut-off; route shares"
  required_quality_disclosure: "Record coverage; mass-balance closure; meter and scale quality; route representativeness; estimates and proxies; reasoned-estimate replacements; allocation sensitivity; food-safety record scope; unresolved UUIDs"
  update_trigger: "Material change in species mix, anatomical part, preservation technology, energy system, packaging, yield, allocation, plant geography, legal control, or data older than the declared representativeness period"
