    - id: dq_identity
      applies_to: "Product and reference flow"
      requirement: "Record species or group, anatomical part, edible status, route, product state, net-mass basis, packaging, geography, and period."
      evidence: "product specification; lot records; label; flow UUID confirmation"
    - id: dq_temporal
      applies_to: "Foreground activity data"
      requirement: "Use a representative 12-month period where continuous production exists, or disclose the complete campaign and seasonal limitation."
      evidence: "dated meter, lot, invoice, stock, and production records"
    - id: dq_completeness
      applies_to: "Process inventory"
      requirement: "Cover all in-scope process steps, declare the achieved coverage of attributable foreground mass and energy, and disclose every omitted or estimated remainder rather than silently cutting it off."
      evidence: "coverage table; meter map; mass and energy reconciliation"
    - id: dq_mass_balance
      applies_to: "Material flows"
      requirement: "Reconcile incoming mass, additions, product, co-products, wastes, stock change, moisture change, and losses; declare and justify the site-specific reconciliation tolerance and investigate differences outside it."
      evidence: "signed balance worksheet and basis conversions"
    - id: dq_route_representativeness
      applies_to: "Preservation route"
      requirement: "Do not combine chilled/frozen, salted/brined, dried, and smoked routes without production-weighted data and explicit route shares."
