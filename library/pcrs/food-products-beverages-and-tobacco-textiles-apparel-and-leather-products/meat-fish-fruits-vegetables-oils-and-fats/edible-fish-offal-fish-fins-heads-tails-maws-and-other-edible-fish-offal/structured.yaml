allocation_rules:
  - rule_id: al_avoid_by_subdivision
    applies_to: "Shared fish-processing and preservation operations"
    rule: "Prefer process subdivision, submetering, and lot-specific mass records so burdens can be assigned directly before allocation."
    source_ids:
      - eu-pef-2021
  - rule_id: al_upstream_separation
    applies_to: "Incoming edible offal separated with a main fish product"
    rule: "Require the upstream dataset to disclose the separation point and allocation. Where a measurable physical causal relation supports joint production, apply it consistently; otherwise use an economic relation based on representative prices and report a sensitivity case."
    source_ids:
      - eu-pef-2021
  - rule_id: al_foreground_coproducts
    applies_to: "Saleable products leaving the foreground route"
    rule: "Treat an output as a co-product only when it has a demonstrated market or intended beneficial use. Allocate shared burdens with the selected physical or economic driver and report quantities, prices or physical parameters, reference period, and sensitivity."
    source_ids:
      - eu-pef-2021
  - rule_id: al_waste_and_credits
    applies_to: "Wastes, recovered materials, and energy"
    rule: "Keep waste handling burdens in the foreground system. Do not apply avoided-burden or recycling credits unless the declared study method explicitly requires them; disclose the formula and prevent double counting."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass_balance
      process_id: "receiving_preparation_preservation_packing"
      flow_role: "incoming, intermediate, product, residue, and loss masses"
      record_type: "weighbridge, scale, lot, and stock records"
      raw_fields: "lot_id; species_or_group; anatomical_part; state; gross_mass; tare; net_mass; moisture_or_drained_basis; disposition"
      collection_method: "calibrated scales and reconciled lot records"
      unit: "kg"
      frequency: "each lot; monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or declared campaign"
      site_scope: "all foreground lines and storage steps in scope"
      aggregation_rule: "sum net mass by homogeneous product route; normalize to accepted net reference output"
      quality_evidence: "calibration records; stock reconciliation; rejected-lot log; mass-balance closure"
    - protocol_id: cp_water_energy
      process_id: "both_processes"
      flow_role: "water, electricity, heat, and fuels"
      record_type: "meters, invoices, and equipment logs"
      raw_fields: "meter_id; opening; closing; unit; fuel_type; heating_value_basis; allocation_driver; production_mass"
      collection_method: "submeter first; otherwise documented facility-meter allocation"
      unit: "native unit and normalized kg, m3, kWh, or MJ"
      frequency: "meter interval and monthly"
      temporal_coverage: "same period as production, covering seasonal operation"
      site_scope: "all equipment serving the declared route"
      aggregation_rule: "subtract documented non-production use; allocate shared use with operating time, throughput, or another causal driver"
      quality_evidence: "meter checks; invoices; conversion factors; allocation worksheet"
    - protocol_id: cp_preservation_inputs
