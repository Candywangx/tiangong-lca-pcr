  calculation_rules:
    - id: calc_net_reference_output
      applies_to: "Reference product"
      rule: "net product mass = gross packed mass - packaging tare; normalize all flows by total conforming net product mass"
      inputs:
        - "gross packed mass"
        - tare
        - "rejected output"
      output: "kg net reference product"
      source_ids: []
    - id: calc_normalized_flow
      applies_to: "Every quantitative inventory row"
      rule: "normalized amount = amount attributable to homogeneous route / kg net reference product output"
      inputs:
        - "collected amount"
        - "allocation driver"
        - "net output"
      output: "amount per kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_mass_balance
      applies_to: "Both processes"
      rule: "incoming material + added materials = product + co-products + wastes + measured stock change + quantified losses, using consistent wet, dry, drained, and salt bases"
      inputs:
        - "all mass rows"
        - "stock change"
        - "basis conversions"
      output: "mass-balance closure and unexplained difference"
      source_ids: []
    - id: calc_refrigerant_loss
      applies_to: "Refrigeration equipment"
      rule: "loss by substance = opening stock + purchases - closing stock - recovered stock, reconciled to equipment additions; allocate only the route-attributable share"
      inputs:
        - "refrigerant inventory and service records"
        - "allocation driver"
      output: "kg refrigerant emitted per kg reference product"
      source_ids: []
    - id: calc_allocation_share
      applies_to: "Joint operations"
      rule: "allocation share = declared product driver / sum of the same driver for all co-products; apply one consistent driver to shared burdens"
      inputs:
        - "product masses or other physical driver"
        - "representative net revenues where economic allocation is used"
      output: "dimensionless allocation share"
      source_ids:
        - eu-pef-2021
