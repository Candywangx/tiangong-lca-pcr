      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use drained mass when the marketed specification declares drained mass; otherwise use net contents and report product and packing-medium fractions. Do not mix drained-mass and net-contents datasets."
  - id: moisture_salt_condition
    applies_to: "Dried, salted, smoked or brined product"
    required_property_ref:
