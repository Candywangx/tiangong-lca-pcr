      process_id: "receiving_preparation"
      flow_role: "received and accepted bivalve masses"
      record_type: "receiving lot and calibrated scale records"
      raw_fields: "lot_id; supplier; source_area; harvest_or_supplier_status; species_or_group; incoming_state; shell_presentation; prior_treatment; receipt_temperature; gross_mass; tare_mass; accepted_mass; reject_mass"
      collection_method: "weigh each lot and link records to traceability documentation"
      unit: "kg; deg C where recorded"
      frequency: "each received lot"
      temporal_coverage: "complete represented production period, normally 12 consecutive months or a justified seasonal campaign"
      site_scope: "all source suppliers and facility receiving points represented"
      aggregation_rule: "sum net mass by route, presentation and destination; no cross-route averaging"
      quality_evidence: "scale calibration; lot reconciliation; traceability and applicable harvest/processing control evidence"
    - protocol_id: cp_water_waste_balance
      process_id: "receiving_preparation_primary_preservation"
      flow_role: "water, wastewater, rejects and spent brine"
      record_type: "meter, batch, tank and waste destination records"
      raw_fields: "meter_start; meter_end; batch_water; retained_water; discharge_mass_or_volume; salt_mass; reject_mass; waste_destination"
      collection_method: "meter where available, otherwise reconciled batch balance with conversion evidence"
      unit: "kg; m3 with measured density where converted"
      frequency: "each batch or at least monthly meter interval"
      temporal_coverage: "complete represented production period"
      site_scope: "all included lines and discharge points"
      aggregation_rule: "allocate only by documented causal driver, then normalize to relevant process output"
      quality_evidence: "meter calibration; tank calibration; balance closure; destination receipts"
    - protocol_id: cp_route_inputs_energy
      process_id: "primary_preservation"
      flow_role: "route inputs, electricity, fuels and smoking media"
      record_type: "route batch sheets, meters, invoices and material issue/return records"
      raw_fields: "route; batch_id; input_mass; output_mass; ingredient_mass; electricity_kwh; fuel_quantity; smoking_medium_issue; returned_quantity; operating_time"
      collection_method: "segregate records by exactly one route and reconcile invoices to meters or batch issues"
      unit: "kg; kWh; carrier-specific unit"
      frequency: "each batch with monthly reconciliation"
      temporal_coverage: "complete represented production period or justified route campaign"
      site_scope: "each included route line and technology"
      aggregation_rule: "subtract documented returns; allocate shared utilities by measured operating driver; normalize to route output"
      quality_evidence: "meter calibration; invoice reconciliation; formulation and batch authorization"
    - protocol_id: cp_product_condition_mass
      process_id: "primary_preservation_packaging_holding_release"
      flow_role: "moisture, salt, glaze, packing medium and saleable mass condition"
      record_type: "laboratory, QA and check-weigh records"
      raw_fields: "route; presentation; cooked_state; moisture_value_and_basis; salt_value_and_basis; gross_frozen_mass; deglazed_mass; glaze_mass; net_contents; drained_mass; packing_medium_mass; release_status"
      collection_method: "use documented facility methods and calibrated balances; keep test basis with result"
      unit: "kg; mass fraction; percent as declared"
      frequency: "each release lot or statistically justified lot plan"
      temporal_coverage: "complete represented product families and period"
      site_scope: "every route-presentation-mass-basis combination"
      aggregation_rule: "calculate separate averages for each declared combination; do not pool incompatible bases"
      quality_evidence: "method identifier; laboratory or QA record; calibration; sample plan"
    - protocol_id: cp_packaging_holding_release
      process_id: "packaging_holding_release"
      flow_role: "packaging, holding energy, duration, scrap and released product"
      record_type: "bill of material, packaging issue, storage meter, inventory movement and release records"
      raw_fields: "packaging_material; packaging_issue; returned_packaging; scrap_mass; storage_zone; meter_reading; entry_time; release_time; released_content_mass; release_specification"
      collection_method: "reconcile material issue and storage energy to released lots and actual residence time"
      unit: "kg; kWh; hour or day"
      frequency: "each lot with monthly reconciliation"
      temporal_coverage: "complete represented production period"
      site_scope: "all packaging formats and in-facility controlled storage zones"
      aggregation_rule: "normalize material and allocated holding energy to released product content mass"
      quality_evidence: "specification revision; meter and scale calibration; issue-return reconciliation; release authorization"
  calculation_rules:
    - id: calc_reference_mass
      applies_to: "Reference product"
      rule: "Select the declared mass basis: in-shell or marketed shucked content; deglazed mass for glazed frozen product unless another market basis is disclosed; drained mass for brined product when that is the marketed basis, otherwise net contents with packing-medium fraction. Exclude immediate packaging."
      inputs:
        - "release mass"
        - presentation
        - "gross and deglazed mass"
        - "drained mass"
        - "net contents"
        - "packing-medium mass"
        - "release specification"
      output: "kg qualified saleable product content"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_preparation_mass_balance
      applies_to: "Receiving and preparation"
      rule: "accepted prepared mass = received net mass - rejects - removed shell - other documented losses, with any retained water separately reported"
      inputs:
        - "received net mass"
        - rejects
        - "removed shell"
        - "other losses"
        - "retained water"
      output: "kg accepted prepared material and balance closure"
      source_ids: []
    - id: calc_route_yield
      applies_to: "Primary preservation"
      rule: "route yield = preserved route output mass / prepared route input mass; calculate separately for each route, presentation and moisture/salt condition"
      inputs:
        - "prepared input mass"
        - "preserved output mass"
        - "route and condition qualifiers"
      output: "route-specific mass yield"
      source_ids: []
    - id: calc_specific_inventory
      applies_to: "All foreground inputs and outputs"
      rule: "specific amount = reconciled amount assigned to the process / corresponding process output or PCR reference mass stated on the row"
      inputs:
        - "collected amount"
        - "allocation driver"
        - "process output"
        - "reference mass"
      output: "row amount on declared basis"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_holding_energy
      applies_to: "Controlled holding"
      rule: "lot holding electricity = zone electricity x documented lot occupancy driver / total zone occupancy driver; retain actual holding duration and do not assign storage to lots that bypass it"
      inputs:
        - "zone electricity"
        - "entry and release time"
        - "mass or pallet occupancy driver"
      output: "kWh per kg released content for applicable lots"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Received and released product"
      requirement: "Preserve lot-level source, species or commercial group, incoming state, route, presentation and release identity, together with applicable harvest, growing-area, purification or approved processing evidence."
      evidence: "receiving records, supplier documents, traceability link and release record; codex-cxc-52-2003"
    - id: dq_route_separation
      applies_to: "All inventory"
      requirement: "Maintain separate batch or allocation records for each mutually exclusive route and each incompatible mass basis; report shared-utility allocation drivers."
      evidence: "route batch sheets, meters and allocation workbook"
    - id: dq_temporal_coverage
      applies_to: "Foreground activity data"
      requirement: "Represent normally 12 consecutive months; a shorter seasonal campaign is allowed only when it covers the complete production season and its representativeness is justified."
      evidence: "date-stamped source records and representativeness statement"
    - id: dq_mass_condition
      applies_to: "Reference flow"
      requirement: "Retain measured or specified moisture, salt, glaze, drained-mass or net-contents data wherever applicable; never infer cross-route equivalence from equal wet mass."
      evidence: "QA tests, check-weighs and release specification"
    - id: dq_completeness
      applies_to: "Foreground boundary"
      requirement: "Reconcile product, water, salt/brine, energy, packaging, waste and direct-release records; disclose missing flows, proxies and excluded operations."
      evidence: "mass/energy reconciliation and completeness checklist; eu-pef-2021-2279"
    - id: dq_reasoned_estimates
      applies_to: "All provisional ranges"
      requirement: "Treat every reasoned_estimate range only as a candidate-stage QA screen, not as a measured default or publication-critical allowed range. Replace it when the row-specific trigger stated in the Amount rule or Basis is met; until then disclose use, route, condition and uncertainty."
      evidence: "estimate register linked to foreground collection gaps and replacement evidence"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Reference flow"
    rule: "Require product-flow UUID 7a159b9e-de7a-4ef0-906e-8f2e8615d6cd, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg and reference amount exactly 1."
    source_ids:
      - unsd-cpc-3-0-21265
  - rule_id: validate_scope_route
    applies_to: "Product category"
    rule: "Require a covered presentation and exactly one route token from frozen, smoked, dried, salted, or brine; reject live/fresh/chilled, otherwise-preserved, inedible or unfit products and unreviewed combined routes."
    source_ids:
      - unsd-cpc-3-0-21265
  - rule_id: validate_mass_basis
    applies_to: "Reference product"
    rule: "Require packaging exclusion and all applicable in-shell/shucked, moisture, salt, glaze/deglazed, drained-mass/net-contents and packing-medium declarations before accepting the 1 kg reference."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_processes
    applies_to: "Process map"
    rule: "Require all three process inventories and confirm that route-inapplicable preservation rows are absent; require additional carrier, refrigerant, ingredient, emission or waste rows whenever they actually cross the foreground boundary."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_traceability_control
    applies_to: "Bivalve receipt and release"
    rule: "Require lot linkage and evidence of applicable source-area, harvest, purification or approved processing controls, plus controlled storage and handling conditions."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_inventory_records
    applies_to: "Foreground amounts"
    rule: "Require collection protocol links for collected or calculated rows, compatible normalization bases, route-separated calculations and disclosure of proxies or missing records."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "Shared processes and outputs"
    rule: "Require subdivision or direct measurement first; where allocation remains, require the selected causal or economic basis, factors, data period and sensitivity disclosure."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_reasoned_estimates
    applies_to: "Provisional QA ranges"
    rule: "Flag every used reasoned_estimate as temporary and route/condition-specific; fail reviewed use if a replacement trigger has been met but the range has not been replaced by foreground or source-backed evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground processing dataset for one declared CPC 21265 product route, presentation and saleable mass basis"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Attributional modelling of the represented route, technology, geography, period, presentation and mass condition; connection to documented upstream cultivation or harvest datasets and downstream distribution or life-cycle models"
  excluded_use: "Live, fresh or chilled molluscs; other prepared or preserved products; unfit products; route-average substitution; unreviewed multi-route products; comparisons across in-shell/shucked, wet/dry, glazed/deglazed or drained/net-content bases without explicit conversion"
  required_metadata: "Species or commercial group; origin and traceability basis; incoming state; shell presentation; exactly one route; cooked state; final moisture and salt condition; glaze and deglazed mass; drained-mass or net-contents basis and packing-medium fraction; packaging; facility geography; production period; technology; holding condition; upstream dataset links"
  required_quality_disclosure: "Temporal and site coverage; meter and scale calibration; mass and energy balance closure; route separation; allocation method; rejected lots; waste destinations; proxies; missing flows; all reasoned_estimate uses and replacement status"
  update_trigger: "Change in route, species/presentation mix, mass-basis specification, food-safety control, formulation, technology, packaging, holding regime, allocation basis, source requirement or upstream dataset; or availability of foreground/source evidence that replaces a provisional estimate"
