      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report final moisture and salt concentration on the declared test basis. Normalize on the as-sold basis unless a dry-matter conversion is explicitly required and the measured conversion is disclosed."
