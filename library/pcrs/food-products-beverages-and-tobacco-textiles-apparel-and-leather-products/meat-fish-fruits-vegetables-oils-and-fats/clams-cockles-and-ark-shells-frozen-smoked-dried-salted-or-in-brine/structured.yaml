measurement_rules:
  - id: reference_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Set the quantitative reference to exactly 1 kg of qualified saleable product content at facility release; exclude immediate packaging mass."
  - id: presentation_mass_basis
    applies_to: "In-shell, shucked and comminuted presentations"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "For an in-shell product, shell mass remains in the product content mass; for a shucked or flour/meal/pellet product, use only the marketed content. Report edible-part fraction separately when relevant and do not compare presentations without conversion."
  - id: frozen_glaze_basis
    applies_to: "Frozen glazed product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record gross frozen mass, glaze mass and deglazed product mass using the facility's documented control method. Use deglazed product mass as the reference basis unless the applicable market specification defines another basis, which shall be disclosed."
  - id: brine_mass_basis
    applies_to: "Product in brine or other packing medium"
