allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Route, product and line burdens"
    rule: "First avoid allocation through route-specific records, process subdivision and direct measurement. Never average the five mutually exclusive preservation routes into one foreground result."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_coproduct
    applies_to: "Saleable shell, meat, meal or other co-products"
    rule: "Where subdivision is not feasible, use a documented physical causal relationship; use economic allocation only when no defensible physical relationship exists, and report the method, factor basis, prices and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_credit
    applies_to: "Rejects, shells, spent brine and packaging waste"
    rule: "Treat an output as waste when the holder discards or pays for its management. Do not assign an avoided-burden credit inside this foreground dataset unless a separate consequential or circularity scenario is explicitly selected and documented."
    source_ids:
      - eu-pef-2021-2279
