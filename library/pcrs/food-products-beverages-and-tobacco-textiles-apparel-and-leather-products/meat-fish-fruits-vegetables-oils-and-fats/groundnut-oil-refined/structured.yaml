allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "Multi-output refinery operations"
    rule: "Avoid allocation by subdivision and direct metering of degumming, bleaching, deodorisation, utilities, wastes and recovered streams wherever technically feasible."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rule_2
    applies_to: "Soapstock, acid oil, gums and deodoriser distillate"
    rule: "Classify each stream from documented destination and economic value. If a saleable co-product remains after subdivision, allocate the inseparable residual burden using site-specific economic shares averaged over the representative period and report a mass-allocation sensitivity. If the stream is waste, assign treatment without co-product allocation."
    source_ids:
      - iso-14044-2006
      - jrc-fdm-bref-2019
  - rule_id: allocation_rule_3
    applies_to: "Recycling, recovery and avoided products"
    rule: "Do not grant an avoided-product credit solely because recovery is possible. A substitution model requires a documented receiving market, substituted product, quality relationship and separate scenario; never count the same stream as both co-product and waste."
    source_ids:
      - iso-14044-2006
