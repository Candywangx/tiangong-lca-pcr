  calculation_rules:
    - id: calculation_rule_1
      applies_to: "All foreground exchanges"
      rule: "normalized amount = reporting-period exchange divided by saleable refined-oil output; preserve the unnormalized totals and unit conversions"
      inputs:
        - "exchange totals"
        - "saleable output"
      output: "amount per 1 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calculation_rule_2
      applies_to: "Crude-oil yield"
      rule: "refining yield = saleable refined-oil mass divided by crude-oil input after consistent stock corrections"
      inputs:
        - "crude receipts"
        - "crude stock change"
        - "refined output"
        - "refined stock change"
      output: "mass yield and crude input per kg product"
      source_ids:
        - mass-balance-identity
    - id: calculation_rule_3
      applies_to: "Acid and alkali"
      rule: "active substance = solution mass multiplied by measured or certificate concentration"
      inputs:
        - "solution mass"
        - "mass fraction"
      output: "kg active chemical"
      source_ids:
        - jrc-fdm-bref-2019
    - id: calculation_rule_4
      applies_to: "Process and site mass balance"
      rule: "mass-balance difference = inputs plus stock decrease minus products, co-products, wastes, emissions and stock increase; report the closure percentage and investigated residual"
      inputs:
        - "all measured mass streams and stock changes"
      output: "mass-balance residual and closure"
      source_ids:
        - mass-balance-identity
    - id: calculation_rule_5
      applies_to: "Economic allocation"
      rule: "co-product share = net sales value of each co-product divided by total net sales value of all allocated outputs over the representative period; use consistent price basis and report mass sensitivity"
      inputs:
        - "output mass"
        - "net price"
        - period
      output: "allocation shares"
      source_ids:
        - iso-14044-2006
    - id: calculation_rule_6
      applies_to: "Direct air emission"
      rule: "emitted mass = measured concentration multiplied by standardized dry gas flow and operating time, with units and below-detection treatment documented"
      inputs:
        - "stack concentration"
        - "gas flow"
        - time
      output: "kg substance per kg product"
      source_ids:
        - jrc-fdm-bref-2019
  data_quality_requirements:
    - id: data_quality_1
      applies_to: "Temporal representativeness"
      requirement: "Use a representative 12-month period including normal shutdowns and product changes, or justify a shorter campaign and disclose seasonality."
      evidence: "dated production, meter and stock records"
    - id: data_quality_2
      applies_to: "Geographic and technological representativeness"
      requirement: "Match electricity, heat, water, crude oil, chemicals and treatment datasets to the site and actual refining route; disclose proxies."
      evidence: "supplier, geography, technology and route metadata"
    - id: data_quality_3
      applies_to: "Completeness"
      requirement: "Include all required processes and all material inputs, outputs, wastes and direct emissions; explain exclusions and detection limits."
      evidence: "process map, mass balance, waste manifests, emission reports"
    - id: data_quality_4
      applies_to: "Measurement quality"
      requirement: "Prefer calibrated meters and scales; document allocation of shared utilities and uncertainty of calculated records."
      evidence: "calibration certificates, allocation workbook, reconciliation records"
    - id: data_quality_5
      applies_to: "Source and estimate transparency"
      requirement: "Keep source-backed ranges distinct from foreground quantities and replace every reasoned estimate before active publication unless a reviewer accepts and documents it."
      evidence: "source ids, review record, replacement foreground evidence"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "Product identity and reference flow"
    rule: "Confirm CPC 3.0 code 21622, the refined groundnut-oil flow UUID, Mass flow-property UUID, Units of mass unit-group UUID, 1 kg reference amount, edible quality basis and all required qualifiers."
    source_ids:
      - codex-cxs-210-1999
  - rule_id: validation_rule_2
    applies_to: "Route and boundary completeness"
    rule: "Verify that degumming, the declared chemical or physical route branch, bleaching, deodorisation, finishing, utilities and conditional on-site treatment are represented and that crude-oil production is linked upstream rather than counted as foreground refining."
    source_ids:
      - jrc-fdm-bref-2019
      - list-pattee-2020-peanut-oil
  - rule_id: validation_rule_3
    applies_to: "Mass and intermediate balance"
    rule: "Reconcile crude oil, chemicals, water and intermediate transfers with refined oil, co-products, wastes, emissions and stock changes for the reporting period; investigate and disclose residuals rather than forcing closure."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_rule_4
    applies_to: "Chemicals and energy"
    rule: "Check solution concentration corrections, route applicability, active-substance units, electricity geography and voltage, and steam heat conversion; reject silent substitution of solution mass for active mass or steam mass for delivered heat."
    source_ids:
      - jrc-fdm-bref-2019
  - rule_id: validation_rule_5
    applies_to: "Outputs, waste and allocation"
    rule: "Verify each gums, soapstock, acid-oil, spent-earth and distillate destination and economic status; ensure no stream is simultaneously a co-product, waste and avoided-product credit, and reproduce allocation shares and sensitivity."
    source_ids:
      - iso-14044-2006
      - jrc-fdm-bref-2019
  - rule_id: validation_rule_6
    applies_to: "Quality, sources and estimates"
    rule: "Confirm saleable output meets the declared Codex or market specification, source ids resolve, source-backed ranges retain their basis, and every remaining reasoned estimate is flagged for replacement or accepted by review."
    source_ids:
      - codex-cxs-210-1999
published_dataset_profile:
  dataset_role: "Secondary or background unit-process dataset for bulk refined groundnut oil at the refinery gate"
  downstream_use: "Food-product LCIs, ingredient supply-chain models, process datasets and lifecycle models that consume bulk refined groundnut oil"
  allowed_use: "Declared refinery geography, period, refining route, quality specification and bulk market state consistent with collected data"
  excluded_use: "Crude groundnut oil, blended or modified oils, consumer packaging, cultivation or extraction, and unqualified claims for another geography, route or period"
  required_metadata: "PCR id and version; CPC 21622; reference-flow UUID, Mass property and Units of mass unit group; geography; reference year; technology and route; crude-oil origin; allocation method; data owner and review state"
  required_quality_disclosure: "Coverage and mass-balance closure; foreground measurement share; shared-utility allocation; proxy datasets; reasoned estimates; co-product destinations and prices; uncertainty and review findings"
  update_trigger: "Material change in route, site, crude-oil sourcing, yield, energy system, pollution controls, co-product destination or allocation; new reviewed evidence; revised Codex product requirements; changed Tiangong support or flow identity"
