  - rule_id: validate_product_scope
    applies_to: "Product identity"
    rule: "Reject skeletal meat, inedible offal, mixed-species offal, non-buffalo offal, and cooked, cured, smoked, dried, salted, or further-preserved products."
    source_ids:
      - unsd-cpc-3-21152
  - rule_id: validate_exact_organ
    applies_to: "Organ identity"
    rule: "Require one exactly named organ for the reference lot and an atomic row in every applicable process; reject an “other offal” selected flow."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021-2279
  - rule_id: validate_state_exclusivity
    applies_to: "State routes"
    rule: "Require exactly one of fresh, chilled, or frozen for each reference lot and reject mixed-state normalization."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021-2279
  - rule_id: validate_process_coverage
    applies_to: "Process inventory"
    rule: "Require all required processes and documented inclusion decisions for the three state branches and on-site wastewater treatment."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021-2279
  - rule_id: validate_atomic_exchange
    applies_to: "Inventory"
    rule: "Reject combined carriers, chemicals, packaging components, organs, co-products, wastes, wastewater pollutants, or emissions in one selected flow."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021-2279
  - rule_id: validate_fixed_value
    applies_to: "Amount modes"
    rule: "Require the reference output as the sole fixed value and prohibit invented fixed quantities or ranges for non-reference rows."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_mass_allocation
    applies_to: "Slaughter and organ preparation"
    rule: "Require mass reconciliation, product-versus-waste exclusivity, allocation disclosure, and sensitivity where allocation materially affects results."
    source_ids:
