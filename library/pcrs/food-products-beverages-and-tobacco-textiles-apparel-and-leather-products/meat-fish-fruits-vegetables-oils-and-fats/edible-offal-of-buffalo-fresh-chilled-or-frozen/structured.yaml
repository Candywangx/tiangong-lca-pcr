allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Shared slaughter and utility operations"
    rule: "Prefer measured process subdivision and direct assignment to the organ batch before applying an allocation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_slaughter
    applies_to: "Carcass, edible organs, blood, hide, head frame, horn, hoof, fat, and tail"
    rule: "When shared burdens remain, use a documented physical relationship reflecting the process; use mass only when it is defensible, and disclose any economic relationship used after the applicable hierarchy is evaluated."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021-2279
  - rule_id: allocation_product_waste_status
    applies_to: "Every recovered material"
    rule: "Classify a measured quantity once as product or waste according to legal status and documented destination; never duplicate the same mass in both roles."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021-2279
  - rule_id: allocation_organ_mass_balance
    applies_to: "Slaughter and organ preparation"
    rule: "Reconcile accepted live mass with carcass, each organ, other recovered products, condemned material, contents, residues, wastewater solids, inventory change, and documented measurement difference."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021-2279
  - rule_id: allocation_waste_treatment
    applies_to: "Waste and wastewater"
    rule: "Assign foreground collection and on-site treatment activity to this system, disclose the off-site treatment boundary, and report any credit separately."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_reusable_packaging
    applies_to: "Reusable crate and wooden pallet"
    rule: "Allocate only measured replacement or loss consumption through actual issue and return records; disclose lifetime and loss assumptions."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receipt_live_mass
      process_id: "buffalo_receipt_and_holding"
      flow_role: "Live-buffalo mass at the named boundary"
      record_type: "Livestock scale or weighbridge record"
      raw_fields: "row_id; batch_id; gross_mass; tare_mass; net_mass; unit; scale_id; timestamp"
      collection_method: "Measure gross and tare on calibrated equipment, calculate net live mass, and reconcile receipt with accepted, mortality, and slaughter records."
      unit: "kg"
      frequency: "Each batch with reporting-period reconciliation"
      temporal_coverage: "Complete declared foreground reporting period"
      site_scope: "Foreground slaughterhouse or offal-processing facility"
