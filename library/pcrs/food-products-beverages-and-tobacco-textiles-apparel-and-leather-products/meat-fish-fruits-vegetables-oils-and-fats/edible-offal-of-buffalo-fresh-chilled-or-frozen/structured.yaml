  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every non-reference row"
      rule: "Divide the batch or reporting-period exchange by the matched net mass of qualified reference product; retain unrounded numerator and denominator."
      inputs:
        - "row-specific quantity"
        - "net qualified organ mass"
      output: "Quantity per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_organ_mass_balance
      applies_to: "Receipt, slaughter, preparation, state conditioning, and packaging"
      rule: "Reconcile measured input with organ outputs, carcass products, co-products, rejects, wastes, inventory change, and documented measurement difference; do not invent a balancing flow."
      inputs:
        - "calibrated mass records"
        - "inventory change"
      output: "Disclosed organ and facility mass balance"
      source_ids:
        - ec-jrc-sa-bref-jrc135916
        - eu-pef-2021-2279
    - id: calc_state_route
      applies_to: "Fresh, chilled, and frozen branches"
      rule: "Assign a reference batch to one state route from release records; normalize only that branch and reject any calculation that mixes branch quantities."
      inputs:
        - "organ batch id"
        - "release state"
        - "branch records"
      output: "One state-specific foreground inventory"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_combustion_release
      applies_to: "Each combustion-pollutant row"
      rule: "Multiply the separately collected fuel quantity by a documented facility-specific pollutant factor, or use a matched direct stack result; preserve source, unit, and period."
      inputs:
        - "fuel quantity"
        - "pollutant factor or stack result"
      output: "Pollutant mass to air"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "Each refrigerant-emission row"
      rule: "Calculate opening stock plus receipts minus closing stock, recovered mass, and transfers for one substance, then reconcile with service-loss records."
      inputs:
        - "substance-specific stock and service records"
      output: "Refrigerant mass to air"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_shared_meter
      applies_to: "Shared utility meters"
      rule: "Use a documented causal driver only after evaluating direct submetering; preserve the unallocated total and allocation worksheet."
      inputs:
        - "shared-meter quantity"
        - "operating time"
        - load
        - "or throughput"
      output: "Process-specific utility quantity"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_packaging_consumption
      applies_to: "Each packaging component"
      rule: "Calculate opening stock plus receipts minus closing stock, returns, and unused transfers; for reusable items use measured replacement or loss."
      inputs:
        - "component-specific stock"
        - issue
        - return
        - "and loss records"
      output: "Component mass per reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_effluent_load
      applies_to: "Each wastewater-pollutant row"
      rule: "Multiply matched discharge volume by a representative measured concentration from the same point and period with explicit unit conversion."
