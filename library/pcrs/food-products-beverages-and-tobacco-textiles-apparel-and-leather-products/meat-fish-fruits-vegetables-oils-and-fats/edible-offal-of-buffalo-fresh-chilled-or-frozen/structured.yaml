process_map:
  - id: buffalo_receipt_and_holding
    name: "Buffalo receipt and holding"
    inclusion: "required"
    inclusion_condition: "Include for every slaughterhouse dataset beginning with live buffalo."
    role: "Establishes accepted live-buffalo mass, holding utilities, mortality, manure, and washwater before slaughter."
    quantitative_reference: "Accepted live-buffalo mass associated with the declared 1 kg offal reference output."
  - id: slaughter_bleeding_and_organ_recovery
    name: "Slaughter, bleeding, and organ recovery"
    inclusion: "required"
    inclusion_condition: "Include for every edible-offal dataset produced from accepted live buffalo."
    role: "Performs slaughter and evisceration, recovers each candidate edible organ separately, and records shared carcass products, residues, wastewater, utilities, and combustion releases."
    quantitative_reference: "Raw organ mass and shared slaughter inventory associated with the declared 1 kg offal reference output."
  - id: offal_separation_trimming_and_washing
    name: "Offal separation, trimming, and washing"
    inclusion: "required"
    inclusion_condition: "Include for every declared edible organ before state-specific conditioning."
    role: "Separates one organ identity at a time, removes organ-specific rejects, washes the organ, and preserves organ-specific washwater and thermal records."
    quantitative_reference: "Cleaned eligible organ mass associated with the declared 1 kg reference output."
  - id: fresh_offal_conditioning
    name: "Fresh offal conditioning"
    inclusion: "conditional"
    inclusion_condition: "Include only when the reference lot is released fresh; exclude the chilled and frozen branches for that lot."
    role: "Maintains the fresh state during short controlled handling and records each organ output and organ-specific rejection separately."
    quantitative_reference: "Fresh organ mass associated with the declared 1 kg fresh reference output."
  - id: chilling_and_chilled_storage
    name: "Chilling and chilled storage"
    inclusion: "conditional"
    inclusion_condition: "Include only when the reference lot is released chilled; exclude the fresh and frozen branches for that lot."
    role: "Chills each eligible organ, stores it at the declared chilled temperature, and tracks refrigerant substances, water, ice, rejects, wastewater, and compressor oil separately."
    quantitative_reference: "Chilled organ mass associated with the declared 1 kg chilled reference output."
  - id: freezing_and_frozen_storage
    name: "Freezing and frozen storage"
    inclusion: "conditional"
    inclusion_condition: "Include only when the reference lot is released frozen; exclude the fresh and chilled branches for that lot."
    role: "Freezes each eligible organ, stores it at the declared frozen temperature, and tracks glazing water, refrigerants, rejects, defrost water, and compressor oil independently."
    quantitative_reference: "Frozen organ mass associated with the declared 1 kg frozen reference output."
  - id: packaging_and_release
    name: "Packaging and product release"
    inclusion: "required"
    inclusion_condition: "Include after exactly one declared state branch for each reference lot; record only packaging components and gases actually used."
    role: "Receives organ-specific fresh, chilled, or frozen material, records each packaging component, and releases the sole generic CPC 21152 reference flow with explicit organ and state qualifiers."
    quantitative_reference: "Exactly 1 kg net qualified edible buffalo offal in one declared state, excluding packaging mass."
  - id: cleaning_and_disinfection
    name: "Cleaning and disinfection"
    inclusion: "required"
    inclusion_condition: "Include facility sanitation and retain each chemical or thermal carrier only when actually used."
    role: "Records water, power, each thermal carrier, each fuel, each cleaning chemical, each chemical-specific wastewater, solid sweepings, and individual combustion pollutants."
    quantitative_reference: "Sanitation activity allocated to the declared 1 kg reference output."
  - id: onsite_wastewater_treatment
    name: "On-site wastewater treatment"
    inclusion: "conditional"
    inclusion_condition: "Include only when at least one named foreground wastewater stream is treated on site before discharge or transfer."
    role: "Receives each named wastewater separately, records each treatment consumable, separates residues, and reports each final water or air release as one exchange."
    quantitative_reference: "Treatment activity and discharge associated with the declared 1 kg reference output."
