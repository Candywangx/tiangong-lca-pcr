validation_rules:
  - rule_id: validate_reference_uuid
    applies_to: "Reference flow"
    rule: "Require UUID ed9e2fcf-3bf3-4b09-a893-dc5250a65f5c, Product flow type, exact CPC 21152 scope, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, kg, and exactly 1 kg net output."
