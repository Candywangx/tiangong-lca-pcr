allocation_rules:
  - rule_id: alloc_subdivision_first
    applies_to: "Multi-product facility and shared process lines"
    rule: "Prefer process subdivision, lot separation, and direct metering. Do not allocate a directly measured lot input or emission to unrelated products."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_physical_driver
    applies_to: "Shared utilities, water, refrigeration, storage, and cleaning"
    rule: "Allocate remaining shared flows using documented causal physical drivers such as metered energy, equipment operating time, mass throughput, cleaning events, or product-mass-days; disclose the driver and denominator."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_coproducts
    applies_to: "Marketable fish parts or other exported co-products"
    rule: "Where subdivision is not possible, use a demonstrated physical causal relationship; if no defensible physical relationship exists, use lot- or annual-period economic allocation based on recorded quantities and representative prices and disclose sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_waste_and_recovery
    applies_to: "Residues, wastewater, packaging scrap, recovered refrigerant, and recycled materials"
    rule: "Classify outputs by actual legal and commercial status and destination. Do not assign avoided-burden credits inside this foreground package unless the downstream substitution method is explicitly declared and consistently applied."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_mass_traceability
      process_id: "receipt_preparation"
      flow_role: "received fish, prepared fish, residues, lot identity"
      record_type: "scale tickets and lot records"
      raw_fields: "species; scientific name if available; origin; supplier/vessel; lot id; presentation; inbound mass; prepared mass; residue mass by destination; timestamps"
      collection_method: "calibrated scales linked to lot traceability records"
      unit: "kg"
      frequency: "every lot and material transfer"
      temporal_coverage: "representative production period, at least all included lots"
      site_scope: "all reporting-facility lines in scope"
      aggregation_rule: "sum masses by lot and normalize to verified net dispatch mass"
      quality_evidence: "calibration certificates; reconciliation record; supplier/landing records; disposition evidence"
    - protocol_id: cp_water_ice_records
      process_id: "receipt_preparation"
      flow_role: "preparation water, ice, wastewater"
      record_type: "meter, purchase, production, and discharge records"
      raw_fields: "water meter readings; ice issues; recovered ice/water; wastewater meter or balance fields"
      collection_method: "process meters where available; otherwise documented facility balance and allocation"
      unit: "kg or m3 with density conversion"
      frequency: "each production day or lot"
      temporal_coverage: "same period as production inventory"
      site_scope: "all relevant preparation operations"
      aggregation_rule: "net use and discharge allocated by causal process driver"
      quality_evidence: "meter checks; potable-water evidence; balance reconciliation"
    - protocol_id: cp_energy_records
      process_id: "receipt_preparation_freezing_finishing_packaging"
      flow_role: "process electricity"
      record_type: "meter and equipment records"
      raw_fields: "meter start/end; equipment; operating hours; allocation driver; conversion factor"
      collection_method: "dedicated meter preferred; otherwise documented physical allocation"
      unit: "kWh"
      frequency: "each lot, shift, or day"
      temporal_coverage: "same period as production inventory"
      site_scope: "all in-scope equipment"
      aggregation_rule: "sum by process and allocate to lots using documented causal driver"
      quality_evidence: "meter calibration or invoice reconciliation; allocation worksheet"
    - protocol_id: cp_freezing_records
      process_id: "freezing"
      flow_role: "freezer load, temperature, time, and output"
      record_type: "freezer batch and continuous logger records"
      raw_fields: "lot id; load mass; entry temperature; start/end time; freezing method; thermal-centre measurements; unload mass; alarms; corrective actions"
      collection_method: "calibrated probes and continuous or batch time-temperature logs"
      unit: "kg; °C; h"
      frequency: "every freezer batch or continuous lot"
      temporal_coverage: "all included production lots"
      site_scope: "all in-scope freezers"
      aggregation_rule: "link each lot to its actual freezing record; mass-weight aggregates only after lot checks"
      quality_evidence: "probe calibration; logger file; HACCP/CCP or equivalent control record"
    - protocol_id: cp_packaging_glaze_records
      process_id: "finishing_packaging"
      flow_role: "glaze, net mass, packaging, scrap, wastewater"
      record_type: "recipe/BOM, scales, water meter, and waste records"
      raw_fields: "gross product mass; net fish mass; glaze mass; packaging mass by material; packaging scrap; water input; discharge; label claims"
      collection_method: "calibrated scales, packaging issue records, and water balance"
      unit: "kg"
      frequency: "every lot and packaging configuration"
      temporal_coverage: "all included production lots"
      site_scope: "all in-scope finishing and packaging lines"
      aggregation_rule: "calculate lot net mass and material intensities, then mass-weight"
      quality_evidence: "scale calibration; label/net-content check; packaging specifications; water-quality evidence"
    - protocol_id: cp_storage_dispatch_records
      process_id: "frozen_storage"
      flow_role: "storage duration, temperature, energy, and dispatch mass"
      record_type: "warehouse management, temperature logger, and energy meter records"
      raw_fields: "lot entry/exit; mass; entry/exit temperature; chamber temperature; alarms; kWh; storage zone; dispatch net mass"
      collection_method: "continuous chamber logging with lot timestamps and metered energy"
      unit: "kg; day; °C; kWh"
      frequency: "continuous temperature; each lot movement; daily or billing-period energy"
      temporal_coverage: "full storage period for all included lots"
      site_scope: "all in-scope cold rooms and dispatch zones"
      aggregation_rule: "allocate energy by product-mass-days or more causal driver and normalize to dispatch net mass"
      quality_evidence: "logger calibration; alarm/corrective-action records; meter/invoice reconciliation"
    - protocol_id: cp_refrigerant_records
      process_id: "freezing_frozen_storage"
      flow_role: "refrigerant make-up and emissions"
      record_type: "equipment inventory and service records"
      raw_fields: "substance; equipment id; opening/closing charge; additions; recovery; transfers; service loss; allocation driver"
      collection_method: "annual or campaign mass balance reconciled to service records"
      unit: "kg by refrigerant substance"
      frequency: "every service event and inventory period"
      temporal_coverage: "inventory period overlapping reported production"
      site_scope: "all in-scope freezing and storage refrigeration equipment"
      aggregation_rule: "calculate loss by substance and allocate by equipment-specific causal driver"
      quality_evidence: "invoices; technician reports; recovery records; charge reconciliation"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "Glazed or packaged output"
      rule: "net fish mass = gross packed mass - measured glaze mass - packaging mass; for unglazed product, set glaze mass to measured zero"
      inputs:
        - "gross packed mass"
        - "glaze mass"
        - "packaging mass"
      output: "kg net frozen fish"
      source_ids:
        - codex-cxs-190-1995
    - id: calc_preparation_yield
      applies_to: "Receipt and preparation"
      rule: "preparation yield = prepared fish mass / received eligible fish mass; separately report excluded or diverted lots"
      inputs:
        - "prepared fish mass"
        - "received fish mass"
      output: "kg/kg"
      source_ids: []
    - id: calc_water_balance
      applies_to: "Preparation and finishing"
      rule: "wastewater = water input + ice melt + other measured liquid input - product/glaze retention - measured reuse - evaporation or other measured destination"
      inputs:
        - water
        - ice
        - retention
        - reuse
        - "discharge records"
      output: "kg wastewater"
      source_ids: []
    - id: calc_energy_intensity
      applies_to: "Each energy-using process"
      rule: "process energy intensity = process-metered or physically allocated energy / net reference output"
      inputs:
        - "meter readings"
        - "allocation driver"
        - "net fish mass"
      output: "kWh/kg net frozen fish"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_storage_energy
      applies_to: "Frozen storage"
      rule: "storage energy intensity = allocated storage electricity / sum of product-mass-days; report lot storage duration separately"
      inputs:
        - "chamber electricity"
        - "lot mass"
        - "entry/exit timestamps"
      output: "kWh/(kg·day) and kWh/kg lot"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "Refrigeration systems"
      rule: "refrigerant loss = opening charge + additions + received transfers - closing charge - recovered refrigerant - outgoing transfers, calculated separately by substance"
      inputs:
        - "charge inventory and service records"
      output: "kg refrigerant emitted, subject to reconciliation"
      source_ids: []
    - id: calc_shared_flow_allocation
      applies_to: "Shared processes"
      rule: "allocate only residual shared flow after subdivision using the documented causal physical driver; retain numerator, denominator, and sensitivity for any economic fallback"
      inputs:
        - "shared-flow total"
        - "product driver values"
        - "price/quantity records if needed"
      output: "allocated flow per product lot"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Product and received fish"
      requirement: "Preserve one-to-one lot linkage for species, origin, supplier/vessel, presentation, production system, and dispatch product; excluded tuna/bonito categories and fillets must be detectably rejected from scope."
      evidence: "lot genealogy; species declaration; supplier/landing documents; product specification"
    - id: dq_measurement
      applies_to: "Mass, energy, water, temperature, and time"
      requirement: "Use calibrated instruments where available, retain unit conversions, and document estimation and allocation whenever direct measurement is unavailable."
      evidence: "calibration records; meter logs; conversion worksheet; allocation record"
    - id: dq_temporal_coverage
      applies_to: "Foreground inventory"
      requirement: "Cover a representative production period including seasonal species mix and operational variation; disclose excluded downtime, abnormal batches, and data gaps."
      evidence: "production calendar; lot list; completeness reconciliation"
    - id: dq_completeness
      applies_to: "Foreground boundary"
      requirement: "Reconcile received fish, net product, residues, water/wastewater, energy, packaging, refrigerant, and cold-storage records; explain any material imbalance or missing flow."
      evidence: "signed mass and utility balances; exception log"
    - id: dq_food_safety_quality
      applies_to: "Product-contact operations and frozen chain"
      requirement: "Retain potable-water evidence, sanitation prerequisites, hazard-control records, freezing endpoint, storage temperature, alarms, corrective actions, and net-content checks appropriate to the declared product."
      evidence: "HACCP/CCP or equivalent records; water tests; time-temperature logs; quality-release records"
    - id: dq_provisional_ranges
      applies_to: "All reasoned-estimate ranges"
      requirement: "Treat provisional ranges only as QA screens, never as evidence that foreground values are correct; replace with reviewed evidence or accumulated foreground distributions before publication-critical use."
      evidence: "range-review record and replacement plan"
validation_rules:
  - rule_id: val_identity_scope
    applies_to: "Product identity"
    rule: "Fail if species/category or presentation falls in an excluded tuna/bonito, fillet, fish-meat, liver/roe, coated, canned, smoked, dried, salted, or cooked scope, or if the required qualifiers are absent."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: val_reference_mass
    applies_to: "Reference flow"
    rule: "Verify exactly 1 kg net fish mass and separate non-negative glaze and packaging masses; gross packaged mass must reconcile with declared components."
    source_ids:
      - codex-cxs-190-1995
  - rule_id: val_mass_balance
    applies_to: "Lot and process mass"
    rule: "Check received fish against prepared fish, reference product, glaze retention, residues, wastewater solids where measured, and retained intermediates; flag unexplained imbalance for review."
    source_ids: []
  - rule_id: val_freezing_cold_chain
    applies_to: "Freezing and storage"
    rule: "Require lot-linked time-temperature evidence, freezing endpoint, storage duration, alarm handling, and dispatch condition; for a quick-frozen route, verify thermal-centre temperature reached -18 °C or colder after stabilization and was maintained deep frozen."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-190-1995
  - rule_id: val_food_safety_records
    applies_to: "Product-contact operations"
    rule: "Require water-quality, sanitation, hazard-control, product release, and traceability evidence appropriate to the facility and destination market; missing evidence makes validation inconclusive."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-190-1995
  - rule_id: val_allocation
    applies_to: "Shared processes and co-products"
    rule: "Verify subdivision was attempted, the selected allocation driver is causal and reproducible, exported co-products and wastes are classified by actual destination, and any economic fallback includes quantities, prices, period, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_inventory_completeness
    applies_to: "Foreground package"
    rule: "Require accepted input, checks performed, checks skipped, findings, and completeness for fish mass, water, ice, energy, packaging, wastes, wastewater, refrigerants, freezing, and storage; do not interpret skipped checks as passed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_provisional_estimates
    applies_to: "Reasoned-estimate ranges"
    rule: "Flag every provisional range as replaceable review evidence; values outside a range require explanation, while values inside a range do not establish conformity."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production data package for frozen eligible pelagic fish at the processing-facility dispatch gate"
  downstream_use: "secondary_dataset; background_dataset after methodology, identity, evidence, and translation review"
  allowed_use: "Species-, origin-, presentation-, technology-, geography-, time-, and storage-duration-matched LCA process or lifecycle model; supply-chain studies that add compatible upstream capture/aquaculture and transport datasets"
  excluded_use: "Unqualified substitution for tuna/bonito products, fillets or fish meat, other preservation routes, unknown species/origin, retail or cooked products, or frozen products with materially different foreground boundaries"
  required_metadata: "PCR id and version; product flow UUID; species and scientific name if available; origin and production system; harvest area; supplier/vessel lot; presentation; freezing method; glaze status and fraction; packaging; net mass; geography; period; storage temperature and duration; allocation method; upstream dataset references"
  required_quality_disclosure: "Data coverage and representativeness; scale/meter/logger calibration; mass and utility balance; cold-chain and food-safety evidence; shared-utility and co-product allocation; provisional estimates; unresolved UUIDs; excluded processes and data gaps"
  update_trigger: "Change in species or origin mix, product presentation, freezing or glazing technology, packaging, refrigeration system, storage duration, facility geography, allocation basis, applicable food-safety specification, Tiangong identity, or replacement of provisional ranges with reviewed evidence"
