    - "Preparation water, handling ice, preparation wastewater, glazing water, and finishing wastewater retain deliberately broad replaceable reasoned_estimate QA guardrails because no reviewed category-specific industry dataset was available in the authoring timebox. Aggregate ranges formerly attached to selector cards were not copied onto atomic rows."
    - "CXS 190-1995 is used only as a comparable quick-frozen fish quality, glazing, net-mass, packaging, and cold-chain reference; its fillet scope does not expand this PCR to frozen fillets, which CPC 21216 excludes."
    - "Allocation rules require foreground subdivision and physical causality first; the fallback economic allocation basis and any exported co-product treatment require methodology review before activation."
    - "The canonical frozen-product UUID was retained because its direct-read name, CPC category, Product flow type, state_code=100, and Mass reference property exactly match the PCR identity. Narrower lookup found only a fillet-route flow and an unqualified generic Frozen Fish flow, both rejected; the retained flow's landing-site route qualifier must not be reused as process-route evidence."
