system_boundary:
  rules:
    - rule_id: boundary_route_gate
      applies_to: "Foreground apple-juice route"
      rule: "Include all operations under the reporting entity's control from the declared starting condition through finished apple juice at the manufacturing gate, including cleaning, utilities, residues, wastewater, and direct emissions."
      source_ids:
        - fao-fruit-juice-processing-2001
        - eu-jrc-fdm-bref-2019
    - rule_id: boundary_apple_condition
      applies_to: "Routes receiving apples"
      rule: "Include receiving inspection, rejection, sorting, washing, and the management of rejected fruit before milling or pressing; do not assume later thermal treatment removes patulin already present."
      source_ids:
        - codex-cxc-50-2003
    - rule_id: boundary_route_variants
      applies_to: "Route-specific operations"
      rule: "Include clarification, filtration, depectinization, deaeration, concentration, aroma recovery, reconstitution, blending, homogenization, preservation, cold storage, or aseptic handling whenever performed for the declared product."
      source_ids:
        - codex-cxs-247-2005-2025
        - fao-fruit-juice-processing-2001
    - rule_id: boundary_food_safety_control
      applies_to: "Preservation and release"
      rule: "Record the actual validated control step, monitoring records, failures, rework, and final release status. A regulatory 5-log requirement, when applicable, is a product-safety constraint and not a substitute for measured energy or yield inventory."
      source_ids:
        - us-fda-juice-haccp-21-cfr-120-24
    - rule_id: boundary_background_linkage
      applies_to: "Upstream and downstream services"
      rule: "Keep off-site agriculture, material production, purchased utilities, transport, and treatment outside the foreground only when their quantities and linked upstream or treatment datasets are retained."
      source_ids:
        - iso-14044-2006
boundary_abstraction:
  declared_starting_condition: "Declare one: apples at the receiving gate; purchased single-strength apple juice at the receiving gate; or purchased apple juice concentrate plus reconstitution inputs at the receiving gate"
  starting_condition_role: "Foreground entry point that determines which preparation, extraction, concentration, and reconstitution operations are included"
  product_classification_scope: "Apple juice within this PCR; apple juice concentrate is an intermediate or same-category recursive input unless concentrate itself is the separately governed reference product"
  recursive_input_rule: "Record purchased single-strength apple juice or apple juice concentrate as a product input with amount, composition, supplier gate, and upstream dataset reference; do not recreate the same apple-juice category recursively inside the receiving process"
  upstream_dataset_requirement: "Link upstream datasets for apples, purchased juice or concentrate, ingredients, processing aids, packaging, energy, transport, and treatment services that cross the foreground boundary"
  disclosure: "Disclose the starting condition, included unit operations, outsourced operations, technology and preservation route, geography, reporting period, package/bulk state, and any excluded operation"
