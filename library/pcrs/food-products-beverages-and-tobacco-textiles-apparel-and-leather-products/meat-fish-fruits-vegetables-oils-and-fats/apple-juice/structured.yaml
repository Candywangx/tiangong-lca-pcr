  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground inventory rows"
      rule: "normalized amount = period-attributable amount / kg released reference apple juice in the same period"
      inputs:
        - "attributable flow amount"
        - "released apple juice mass"
        - "stock change"
        - "rework status"
      output: "amount per 1 kg reference apple juice"
      source_ids:
        - iso-14044-2006
    - id: calc_process_mass_balance
      applies_to: "Every included process"
      rule: "mass-balance residual = total mass inputs - product outputs - co-product outputs - waste outputs - measured wastewater constituents or bulk stream mass - evaporation - stock increase; investigate and disclose material residuals"
      inputs:
        - "process input/output masses"
        - "moisture or solids data"
        - evaporation
        - "stock change"
      output: "reconciled process mass balance and residual"
      source_ids:
        - iso-14044-2006
    - id: calc_reconstitution_solids
      applies_to: "Reconstituted juice batches"
      rule: "dry-solids proxy balance = sum(input mass x measured soluble-solids fraction) compared with output mass x measured output soluble-solids fraction; use this as a QA balance, not as a universal conversion of Brix to dry matter"
      inputs:
        - concentrate
        - water
        - ingredient
        - "and output masses"
        - "measured soluble solids"
      output: "batch solids-balance check and reconstitution ratio"
      source_ids:
        - codex-cxs-247-2005-2025
    - id: calc_packaging_mass
      applies_to: "Packaged apple juice"
      rule: "packaging mass per kg juice = sum(items used x verified mass per item) / released juice mass, adjusted for rejects and documented reuse cycles"
      inputs:
        - "packaging counts"
        - "item masses"
        - rejects
        - "reuse cycles"
        - "released juice mass"
      output: "packaging inventory per 1 kg reference product"
      source_ids:
        - fao-fruit-juice-processing-2001
    - id: calc_allocation_factor
      applies_to: "Evidenced co-products"
      rule: "Calculate factors from the selected physical relationship or from contemporaneous output quantity x price at a common gate; factors for one process must sum to one"
      inputs:
        - "output quantities"
        - "physical relation or prices"
        - "period and currency"
      output: "disclosed allocation factors and sensitivity result where material"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and same-category inputs"
      requirement: "Preserve product name, apple-only status, route, source, clear/cloudy state, soluble solids, preservation, package/bulk state, storage regime, and manufacturing gate."
      evidence: "Product specification, label, recipe, supplier certificate, and laboratory record"
    - id: dq_route_separation
      applies_to: "Aggregated foreground data"
      requirement: "Keep directly expressed/NFC, from-concentrate, clear/cloudy, concentration, preservation, and packaging routes separate until route-specific inventories are complete; weight only by released product mass and disclose shares."
      evidence: "Production schedule, batch route, line, recipe, and warehouse records"
    - id: dq_temporal_representativeness
      applies_to: "All foreground records"
      requirement: "Use a representative continuous period that captures seasonal apple supply, cleaning cycles, product formats, start-up/shutdown losses, and normal operating variability; justify exclusions."
      evidence: "Dated record census, coverage statement, and exception log"
    - id: dq_meter_and_conversion
      applies_to: "Measured and converted quantities"
      requirement: "Retain calibration status, original unit, density and temperature for liquid conversion, solids or moisture basis, and the calculation used."
      evidence: "Calibration certificate, raw meter/scale record, laboratory result, and calculation sheet"
    - id: dq_mass_balance
      applies_to: "Each included process and the whole foreground"
      requirement: "Reconcile product, co-product, residue, wastewater, evaporation, rework, and stock change on a consistent period and investigate material residuals."
      evidence: "Signed mass-balance worksheet and corrective-action record"
    - id: dq_coverage
      applies_to: "Inventory completeness"
      requirement: "Include all material inputs, utilities, processing aids, packaging, outputs, wastes, wastewater, and direct emissions; a zero entry requires evidence that the flow is absent, not merely unmeasured."
      evidence: "Purchase, meter, recipe, maintenance, waste, discharge, and release record cross-check"
    - id: dq_source_linkage
      applies_to: "Purchased apples, juice, concentrate, ingredients, packaging, energy, and treatment"
      requirement: "Link a temporally and geographically appropriate upstream or treatment dataset and disclose any proxy or data gap."
      evidence: "Supplier identity, dataset UUID/reference, geography, year, and proxy rationale"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference product"
    rule: "Fail conformance if the reference flow is not apple juice, if net as-is mass is not 1 kg after normalization, or if packaging mass is included in product mass."
    source_ids:
      - codex-cxs-247-2005-2025
  - rule_id: validate_required_qualifiers
    applies_to: "Reference flow metadata"
    rule: "Fail conformance when any required qualifier is absent, including route, soluble solids, clear/cloudy state, preservation, package/bulk state, storage regime, geography, gate, or shelf life."
    source_ids:
      - codex-cxs-247-2005-2025
      - codex-cxc-50-2003
  - rule_id: validate_route_processes
    applies_to: "Process map and inventory"
    rule: "Fail conformance when a process used by the declared route is omitted, when a process is included without corresponding inputs and outputs, or when a purchased same-category input lacks an upstream dataset."
    source_ids:
      - fao-fruit-juice-processing-2001
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_reconstitution
    applies_to: "From-concentrate route"
    rule: "Fail conformance when concentrate mass, concentrate soluble solids, reconstitution water, output mass, output soluble solids, governing market specification, or batch solids-balance evidence is missing."
    source_ids:
      - codex-cxs-247-2005-2025
  - rule_id: validate_apple_condition_control
    applies_to: "Whole-apple route"
    rule: "Fail conformance when receiving acceptance, sorting/rejection, washing, and apple-condition records are missing or when rejected fruit is hidden in a yield adjustment."
    source_ids:
      - codex-cxc-50-2003
  - rule_id: validate_preservation_release
    applies_to: "Released apple juice"
    rule: "Fail conformance when the declared preservation or food-safety control lacks its applicable validation, monitoring, deviation, and product-release evidence; do not infer compliance from a process label."
    source_ids:
      - us-fda-juice-haccp-21-cfr-120-24
      - codex-cxc-50-2003
  - rule_id: validate_mass_balance
    applies_to: "Each included process and complete foreground"
    rule: "Fail conformance when mass-balance periods differ, internal transfers are double counted, stock or rework is omitted, or a material unexplained residual remains undisclosed."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_coproduct_status
    applies_to: "Pomace and recovered streams"
    rule: "Fail conformance when a claimed co-product lacks quantity, destination, beneficial-use evidence, and an explicit allocation treatment, or when a waste stream is silently assigned zero burden."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_uuid_selection
    applies_to: "Tiangong-linked flow rows"
    rule: "Fail conformance when the Apple juice, Mass, or Units of mass UUID differs from the declared reference object without a documented, semantically more specific replacement and public-record readback."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground apple-juice production dataset normalized to 1 kg net as-is apple juice at a declared manufacturing gate"
  downstream_use: "secondary_dataset; background_dataset after review of representativeness, upstream linkage, allocation, and uncertainty disclosures"
  allowed_use: "Product carbon footprint or LCA models matching the declared route, geography, period, product specification, package/bulk state, and gate; aggregation with route shares retained"
  excluded_use: "Apple nectar, cider, vinegar, concentrate as the sold reference product, mixed-fruit beverages, generic global apple juice without route disclosure, or consumer use and end-of-life beyond the declared gate"
  required_metadata: "PCR id and version context; reference flow UUID; route and starting condition; product and market qualifiers; geography; technology; reporting period; site coverage; package/bulk state; process list; upstream dataset references; allocation method; reviewer status"
  required_quality_disclosure: "Record coverage; meter and conversion quality; mass-balance residuals; route shares; seasonal coverage; supplier and upstream data quality; proxies; co-product treatment; rejected/reworked quantities; wastewater and direct-emission coverage; uncertainty and known limitations"
  update_trigger: "Change in starting condition, supplier or concentrate source, formulation or Brix specification, clear/cloudy route, extraction/finishing/concentration/preservation technology, package format, energy or water system, waste destination, allocation basis, regulation, or a material shift in yield or utilities"
