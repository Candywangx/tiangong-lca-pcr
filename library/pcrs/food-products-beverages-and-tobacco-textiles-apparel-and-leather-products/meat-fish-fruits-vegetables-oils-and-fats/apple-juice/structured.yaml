allocation_rules:
  - rule_id: allocation_separate_outputs
    applies_to: "Pomace, recovered aroma, usable condensate, and other outputs"
    rule: "Record gross process inputs and every output before allocation. A stream is a co-product only when its product status, destination, quantity, and beneficial use are evidenced; otherwise model it as waste with its treatment route."
    source_ids:
      - iso-14044-2006
      - fao-fruit-juice-processing-2001
  - rule_id: allocation_avoid_where_possible
    applies_to: "Multi-output foreground processes"
    rule: "First subdivide metered operations or apply a documented physical relationship that reflects the causal use of resources. Do not assign zero burden to a co-product merely because it is low value."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_fallback
    applies_to: "Multi-output process where subdivision or a causal physical relationship is not feasible"
    rule: "Apply an economic allocation using contemporaneous quantities and prices at a common gate, run a sensitivity case when the allocation is material, and disclose method, period, currency, price source, and allocation factors."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_internal_transfers
    applies_to: "Juice, concentrate, recovered aroma, and rework transferred within the foreground"
    rule: "Treat internal transfers consistently and count their burdens once. Rework returned to production is not a co-product and must retain the additional processing and loss burdens."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_records
      process_id: "apple_receiving_preparation"
      flow_role: "apples; water; cleaners; prepared apples; rejects; wastewater"
      record_type: "weighbridge, receiving, dosing, meter, quality, and discharge records"
      raw_fields: "lot_id; supplier; received_mass_kg; accepted_mass_kg; rejected_mass_kg; water_m3; density; cleaner_mass_kg; wastewater_m3; destination; stock_change"
      collection_method: "Calibrated scales and meters reconciled with lot acceptance and dispatch records"
      unit: "kg; m3"
      frequency: "Each lot or batch, aggregated monthly"
      temporal_coverage: "Representative production period covering seasonal apple supply"
      site_scope: "Each included receiving and preparation line"
      aggregation_rule: "Sum accepted production records; allocate shared cleaning by measured run time or documented driver; reconcile stock change"
      quality_evidence: "Calibration, lot acceptance, invoice, meter, cleaning, and waste-transfer records"
    - protocol_id: cp_extraction_records
      process_id: "juice_extraction"
      flow_role: "prepared apples; energy; aids; raw juice; pomace"
      record_type: "batch, scale, tank, meter, dosing, and residue records"
      raw_fields: "batch_id; apple_mass_kg; juice_mass_kg; juice_brix; pomace_mass_kg; pomace_moisture; electricity_kWh; steam_kg; aid_mass_kg; destination"
      collection_method: "Calibrated scales, tank measurements, meters, and production logs"
      unit: "kg; kWh"
      frequency: "Each batch or production run, aggregated monthly"
      temporal_coverage: "Representative production period covering operating modes"
      site_scope: "Each included mill and press line"
      aggregation_rule: "Reconcile input, output, residue, moisture, evaporation, and stock change before normalization"
      quality_evidence: "Scale and meter calibration, batch logs, laboratory results, and residue dispatch records"
