allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared foreground processes"
    rule: "First subdivide metered preparation, boiler, hydrogenation, filtration, deodorization, storage, cleaning and wastewater operations by batch or campaign. Do not allocate a combined plant total when process-level records are available."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
  - rule_id: allocation_steam_and_shared_utilities
    applies_to: "steam, shared electricity, cooling water and nitrogen"
    rule: "Allocate shared utilities to the selected route by measured delivery; if direct measurement is unavailable, use a documented engineering driver such as steam enthalpy, operating time and rated load, and test sensitivity."
    source_ids:
      - iso-14044-2006
      - eu-fdm-bat-2019
  - rule_id: allocation_rework
    applies_to: "reworked hydrogenated oil"
    rule: "Keep reworked oil as a separately quantified internal or upstream product flow. Assign the additional processing actually caused by rework and prevent double counting of its original production burden."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_residue_and_recovery
    applies_to: "spent nickel catalyst, deodorizer distillate, recovered oil and packaging"
    rule: "Do not subtract recycling or recovery credits inside the foreground inventory. Declare waste or coproduct status, mass, composition, destination and price where relevant; apply the selected study's documented end-of-life or multifunctionality method outside this unit process."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_oil_preparation
      process_id: "refined_oil_reception_preparation"
      flow_role: "oil, electricity, steam, nitrogen, prepared oil, oil loss and vent"
      record_type: "weighbridge, tank gauge, transfer meter, utility submeter, batch sheet and vent record"
      raw_fields: "batch id; supplier oil id; opening and closing inventory; received and transferred mass; electricity; steam; nitrogen pressure/temperature/composition; waste oil; vent flow/concentration"
      collection_method: "calibrated direct measurement with batch mass reconciliation"
      unit: "kg; kWh"
      frequency: "every batch; utilities at meter interval"
      temporal_coverage: "at least 12 consecutive representative months or all batches for a shorter campaign"
      site_scope: "all preparation equipment serving the declared product"
      aggregation_rule: "sum batch records and normalize by conforming product mass; reconcile opening stock + receipts = transfers + closing stock + losses"
      quality_evidence: "calibration certificates, supplier certificate, batch sheet, stock reconciliation and exception log"
    - protocol_id: cp_steam_generation
      process_id: "natural_gas_steam_generation"
      flow_role: "fuel, water, electricity, steam, blowdown and stack emissions"
      record_type: "fuel meter, water meter, electricity meter, steam meter, gas-composition certificate and stack monitoring"
      raw_fields: "fuel energy and heating-value basis; gas carbon/sulfur; feedwater; condensate return; electricity; steam; blowdown; stack flow and pollutant concentrations"
      collection_method: "calibrated meters and documented emission calculations"
      unit: "MJ; kg; kWh"
      frequency: "continuous or per shift; stack frequency per permit"
      temporal_coverage: "same period as product data"
      site_scope: "boiler and steam header supplying the foreground route"
      aggregation_rule: "allocate delivered steam by measured process use; calculate each pollutant separately from measured fuel or stack load"
      quality_evidence: "meter calibration, gas certificate, stack report, calculation workbook and steam balance"
    - protocol_id: cp_hydrogenation_batch
      process_id: "nickel_catalytic_hydrogenation"
      flow_role: "oil, hydrogen, nickel catalyst, electricity, steam, nitrogen, cooling water, product and vents"
      record_type: "reactor batch sheet, scales, gas meter, utility submeters, laboratory release results and vent log"
      raw_fields: "oil charge; catalyst mass and nickel content; hydrogen supply/recovery/vent conditions; nitrogen; electricity; steam; cooling-water make-up/discharge; reactor heel; product mass; time/temperature/pressure/agitation; iodine value; trans fat"
      collection_method: "calibrated measurement and batch mass balance"
      unit: "kg; kWh; process-condition units"
      frequency: "every batch"
      temporal_coverage: "all representative batches in reporting period"
      site_scope: "every reactor producing the declared product"
      aggregation_rule: "calculate batch totals and normalize by released conforming product; do not pool different catalysts or oils"
      quality_evidence: "calibration, catalyst certificate, batch record, laboratory chromatogram, deviation and vent records"
    - protocol_id: cp_catalyst_filtration
      process_id: "catalyst_removal_post_treatment"
      flow_role: "crude oil, filter aid, utilities, filtered oil, catalyst, cake, off-spec oil and vent"
      record_type: "scales, transfer meters, filter log, waste manifest and laboratory analysis"
      raw_fields: "inlet/outlet oil; filter aid; electricity; steam; spent catalyst wet mass and nickel; cake mass/oil/nickel; free off-spec oil; vent flow/concentration"
      collection_method: "direct weighing, calibrated flow measurement and representative sampling"
      unit: "kg; kWh"
      frequency: "every filtration batch"
      temporal_coverage: "same period as hydrogenation data"
      site_scope: "all filters serving the route"
      aggregation_rule: "reconcile oil and solids without double counting oil in cake as free oil loss"
      quality_evidence: "calibration, laboratory results, filter log, waste manifest and mass balance"
    - protocol_id: cp_deodorization
      process_id: "conditional_deodorization"
      flow_role: "oil, steam, electricity, cooling water, nitrogen, product, distillate, wastewater and vent"
      record_type: "batch sheet, utility meters, tank gauge, condensate receiver, wastewater meter and stack or vent record"
      raw_fields: "inlet/outlet oil; steam; electricity; cooling water; nitrogen; distillate; wastewater; vent flow/concentration; vacuum, time and temperature"
      collection_method: "direct measurement when the process is included"
      unit: "kg; kWh"
      frequency: "every deodorized batch"
      temporal_coverage: "all included batches in reporting period"
      site_scope: "every deodorizer serving the declared product"
      aggregation_rule: "normalize only included batches and declare the share of reference product deodorized"
      quality_evidence: "calibration, batch sheet, quality release, distillate/waste records and inclusion declaration"
    - protocol_id: cp_storage_packaging
      process_id: "cooling_storage_packaging"
      flow_role: "product, electricity, cooling water, nitrogen, steam, packaging, product loss, packaging waste and vent"
      record_type: "tank gauge, filling scale, utility submeter, packaging issue records, waste records and vent record"
      raw_fields: "inlet oil; shipped net oil; electricity; cooling water; nitrogen; steam; HDPE drum mass; LDPE film mass; pallet mass/reuse; product loss; each packaging waste; vent flow/concentration"
      collection_method: "direct measurement and packaging mass reconciliation"
      unit: "kg; kWh"
      frequency: "each lot and dispatch"
      temporal_coverage: "same period as product data"
      site_scope: "all product tanks and filling lines"
      aggregation_rule: "exclude packaging from net reference mass; separate bulk and packaged configurations"
      quality_evidence: "calibrated filling scales, packaging purchase/issue records, reuse log, waste tickets and stock balance"
    - protocol_id: cp_cleaning_wastewater
      process_id: "cleaning_wastewater_treatment"
      flow_role: "cleaning water, sodium hydroxide, treatment electricity, wash water, sludge and effluent"
      record_type: "CIP log, water and chemical meters, treatment submeter, influent/effluent meter, sludge scale and laboratory results"
      raw_fields: "water; NaOH solution/concentration; recovered cleaner; electricity; wastewater flow/pH/temperature/COD or TOC/oil/solids; sludge wet and dry mass; effluent TN/TP/TSS"
      collection_method: "calibrated meters, batch chemical issue and representative sampling"
      unit: "kg; kWh; concentration and load units"
      frequency: "every cleaning event; effluent monitoring per permit"
      temporal_coverage: "same reporting period as product data"
      site_scope: "cleaning circuits and on-site treatment serving the route"
      aggregation_rule: "allocate campaign records by cleaned batches and pollutant load; keep uncontaminated cooling water separate"
      quality_evidence: "CIP record, calibration, laboratory chain of custody, treatment log and discharge record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every foreground exchange"
      rule: "normalized amount = reporting-period exchange amount / reporting-period conforming product mass × 1,000 kg"
      inputs:
        - "exchange amount"
        - "conforming product mass"
      output: "amount per 1,000 kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_oil_mass_balance
      applies_to: "preparation, hydrogenation, filtration, deodorization and filling"
      rule: "opening oil + oil inputs + hydrogen incorporated = closing oil + conforming product + measured oil-bearing wastes + samples + documented losses; report the residual and investigate it rather than assigning it to one waste"
      inputs:
        - inventory
        - transfer
        - product
        - waste
        - "sample and hydrogen-incorporation records"
      output: "reconciled mass balance and residual"
      source_ids:
        - iso-14044-2006
    - id: calc_gas_mass
      applies_to: "hydrogen and nitrogen"
      rule: "gas mass = corrected gas volume × composition-specific density at the declared pressure and temperature reference; subtract separately measured recovery only once"
      inputs:
        - "meter volume"
        - pressure
        - temperature
        - composition
        - "recovered gas"
      output: "kg gas"
      source_ids:
        - fillion-morsi-soybean-hydrogenation-2002
    - id: calc_boiler_emissions
      applies_to: "each boiler emission"
      rule: "pollutant mass = measured stack load when available; otherwise measured natural-gas activity × documented applicable factor, with CO2 based on fuel carbon and SO2 based on sulfur; calculate every pollutant independently"
      inputs:
        - "fuel use"
        - "heating value"
        - "gas carbon/sulfur"
        - "stack flow/concentration or factor"
      output: "kg CO2, CH4, N2O, NOx, CO, SO2 or particulate matter"
      source_ids:
        - eu-fdm-bat-2019
        - eu-pef-2021
    - id: calc_steam_assignment
      applies_to: "steam-consuming processes"
      rule: "assigned steam = metered process steam; if unavailable, boiler-header steam × documented process duty share based on enthalpy and operating records"
      inputs:
        - "process meter or header steam"
        - pressure
        - condensate
        - "duty and operating time"
      output: "kg steam by process"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_packaging_reuse
      applies_to: "reusable wooden pallets"
      rule: "pallet input per reference flow = purchased replacement pallet mass / documented total product mass dispatched over verified reuse cycles; do not assume a reuse count"
      inputs:
        - purchases
        - "pallet mass"
        - "reuse and loss records"
        - "dispatched product"
      output: "kg pallet per 1,000 kg packaged product"
      source_ids:
        - eu-pef-2021
    - id: calc_wastewater_load
      applies_to: "wastewater and treated effluent"
      rule: "pollutant load = flow-proportional concentration × wastewater flow for each reported parameter; preserve sampling and averaging period"
      inputs:
        - flow
        - concentration
        - "sampling duration"
      output: "kg pollutant load and kg water per 1,000 kg product"
      source_ids:
        - eu-fdm-bat-2019
  data_quality_requirements:
    - id: dq_route_identity
      applies_to: "product and process identity"
      requirement: "Records shall prove soybean-oil feed, supported nickel catalyst, partial-hydrogenation endpoint, filtration and post-deodorization status; batches from other oils, catalysts or routes are excluded."
      evidence: "supplier certificates, catalyst certificate, batch record and release test"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Use a continuous representative period covering seasonal and operational variability; justify any period shorter than 12 months and disclose shutdowns, trials and abnormal batches."
      evidence: "dated meter extracts, production calendar and representativeness statement"
    - id: dq_completeness
      applies_to: "mass, energy, water, waste and emissions"
      requirement: "Reconcile all required atomic exchanges and explain every missing meter, zero or excluded process; do not replace missing data with an unlabelled aggregate."
      evidence: "completeness checklist, balances, zero-evidence and gap register"
    - id: dq_measurement
      applies_to: "meters, scales and laboratory data"
      requirement: "Use in-calibration instruments and preserve sampling, detection limit, method and uncertainty for iodine value, trans fat, residual nickel, wastewater and stack measurements."
      evidence: "calibration, chain of custody, method report and uncertainty record"
    - id: dq_source_technology
      applies_to: "upstream datasets"
      requirement: "Match geography, technology, energy mix, hydrogen source, catalyst composition, packaging and treatment route; disclose proxy age and mismatch."
      evidence: "dataset metadata and proxy justification"
    - id: dq_range_evidence
      applies_to: "quantitative QA ranges"
      requirement: "No empirical amount range may be added until at least two independent original sources are verified as compatible in process boundary, unit and normalization basis; single cases remain context only."
      evidence: "range evidence review record"
validation_rules:
  - rule_id: validate_reference_and_route
    applies_to: "identity and reference flow"
    rule: "Reject a data package unless it reports exactly 1,000 kg net conforming product after normalization and declares soybean feed identity, supported nickel catalyst, partial-hydrogenation endpoint, filtration, deodorization status and dispatch configuration."
    source_ids:
      - unsd-cpc-3-0
      - fao-who-codex-cxs19-1981
  - rule_id: validate_atomic_inventory
    applies_to: "inventory structure"
    rule: "Reject combined oil, utility, chemical, packaging, waste or emission labels; every selected flow in Section 6 is checked independently, including each boiler pollutant and each packaging material and waste."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validate_mass_balance
    applies_to: "oil and solids"
    rule: "Require an oil mass balance and separate balances for nickel catalyst/filter aid and packaging; flag unexplained residuals and prevent double counting oil in filter cake as free oil loss."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_food_quality
    applies_to: "reference product release"
    rule: "Require declared test methods and results for iodine value or equivalent endpoint, trans fat, residual nickel, moisture/volatile matter, insoluble impurities, acid value and peroxide value; applicable legal and customer limits control acceptance."
    source_ids:
      - fao-who-codex-cxs19-1981
      - eu-trans-fat-regulation-2019
  - rule_id: validate_trans_fat_market
    applies_to: "product placed on the EU final-consumer or retail market"
    rule: "Confirm industrial trans fat does not exceed 2 g per 100 g fat under Commission Regulation (EU) 2019/649; for other markets, record and test against the applicable limit without treating the EU value as universal."
    source_ids:
      - eu-trans-fat-regulation-2019
      - who-replace-trans-fat-2020
  - rule_id: validate_environmental_records
    applies_to: "wastewater and waste gas"
    rule: "Require water, energy and raw-material inventories plus wastewater flow/pH/temperature/pollutant load and waste-gas flow/temperature/NMVOC/CO/NOx/SOx/particulate records where relevant; missing monitoring is an explicit data gap."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validate_uuid_and_range_gaps
    applies_to: "publication readiness"
    rule: "Keep unresolved selected-flow UUIDs and unresolved range evidence visible as review blockers; do not select an approximate Tiangong flow or invent an estimate to remove a warning."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "foreground production dataset that may be published as a secondary_dataset or background_dataset after review"
  downstream_use: "attributional process or lifecycle-model construction for food-grade partly hydrogenated soybean oil produced by the declared supported-nickel route"
  allowed_use: "studies matching oil identity, hydrogenation endpoint, catalyst, filtration, deodorization status, geography, period, utility system and dispatch configuration"
  excluded_use: "other vegetable oils; full hydrogenation; interesterification, re-esterification or elaidinisation; biodiesel hydroprocessing; formulated fats; undisclosed trans-fat compliance; proxy selection based only on CPC code"
  required_metadata: "reference-flow qualifiers; facility geography; reporting period; batch coverage; oil supplier/refining status; hydrogen source; catalyst composition and fate; reactor and endpoint; filtration; deodorization; utility meters; cleaning/treatment; packaging; allocation; upstream dataset versions; unresolved identity and range gaps"
  required_quality_disclosure: "mass-balance residuals; meter and laboratory uncertainty; missing records; proxy datasets; abnormal batches; wastewater and waste-gas monitoring coverage; trans-fat and residual-nickel methods/results; waste destinations"
  update_trigger: "change in vegetable oil, catalyst, hydrogen source, reactor or endpoint, filtration, deodorization, fuel/steam system, cleaning chemistry, wastewater treatment, packaging, legal trans-fat limit, production geography, or a material shift in annual energy, water, yield, waste or emission performance"
