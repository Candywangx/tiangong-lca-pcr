allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Shared foreground operations"
    rule: "First avoid allocation by process subdivision, separate metering, or expanding separately controllable unit operations."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_direct_assignment
    applies_to: "Meal, recovered oil, soluble fractions, saleable residuals, and waste streams"
    rule: "Directly assign inputs, emissions, and treatment burdens when causal records identify the receiving output. Materials classified as waste receive no co-product share before the selected waste-treatment boundary."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_then_economic
    applies_to: "Unavoidable multifunctional processes"
    rule: "If direct assignment is not possible, use a documented physical relation that reflects the causal production relationship. If no defensible physical relation exists, allocate by economic value using representative annual quantities and prices; disclose the method and test a reasonable alternative."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_mass_balance
    applies_to: "Internal transfers and rework"
    rule: "Do not allocate burdens to internal recirculation. Reconcile fish material, water incorporated or removed, meal, saleable co-products, wastewater, and residuals before allocating shared burdens."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "receipt_preparation_stabilization_drying_milling_finishing_packaging_release"
      flow_role: "Raw material, intermediates, product, rejects, and residuals"
      record_type: "Weighbridge, scale, production, moisture, and disposition records"
      raw_fields: "lot_id; species/source; input_mass_kg; output_mass_kg; residual_mass_kg; moisture_fraction; destination; timestamp"
      collection_method: "Calibrated weighing with lot reconciliation and retained moisture test"
      unit: "kg; mass fraction"
      frequency: "Each lot; daily reconciliation"
      temporal_coverage: "Representative continuous 12-month period or all lots for a shorter declared campaign"
      site_scope: "All foreground lines and outsourced steps attributed to the product"
      aggregation_rule: "Sum by lot and normalize released quantities to 1 kg net product; reconcile wet and dry matter separately"
      quality_evidence: "Calibration records; laboratory result; lot release; reconciliation sign-off"
    - protocol_id: cp_utility_records
      process_id: "stabilization_drying_milling_finishing_wastewater_residuals"
      flow_role: "Water, electricity, fuel, steam, and heat"
      record_type: "Meter, invoice, fuel stock, and operating-hour records"
      raw_fields: "meter_id; opening; closing; unit; carrier; lot_or_period; allocation_driver; conversion_factor"
      collection_method: "Prefer submetering; otherwise document a physical allocation driver"
      unit: "kg or m3; kWh; MJ; carrier unit"
      frequency: "Meter interval or monthly, matched to production"
      temporal_coverage: "Representative continuous 12-month period or declared campaign"
      site_scope: "All foreground equipment and shared utilities"
      aggregation_rule: "Carrier-specific total divided by reconciled output; retain conversions"
      quality_evidence: "Meter verification; invoices; stock reconciliation; allocation worksheet"
    - protocol_id: cp_cold_chain_records
      process_id: "receipt_preparation_packaging_release"
      flow_role: "Ice, storage electricity, temperature, and duration"
      record_type: "Purchase, meter, temperature logger, and inventory records"
      raw_fields: "ice_mass_kg; electricity_kwh; storage_mass_kg; start_time; end_time; setpoint; measured_temperature"
      collection_method: "Weigh ice; meter electricity; retain continuous or defined-interval temperature records"
      unit: "kg; kWh; h; degC"
      frequency: "Each lot plus meter interval"
      temporal_coverage: "All relevant storage within the reporting period"
      site_scope: "All foreground chilled/frozen receiving and storage serving the product"
      aggregation_rule: "Allocate shared electricity by mass-time and temperature-zone where defensible"
      quality_evidence: "Scale/meter checks; logger calibration; excursion log"
    - protocol_id: cp_ingredient_records
      process_id: "stabilization_drying"
      flow_role: "Salt, smoke treatment, and other ingredients/additives"
      record_type: "Batch sheet and stock issue"
      raw_fields: "material_id; supplier_lot; mass_kg; batch_id; purpose"
      collection_method: "Weigh each charged material and reconcile stock"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "All batches in the reporting period"
      site_scope: "All declared formulations/routes"
      aggregation_rule: "Sum by material and normalize to released product"
      quality_evidence: "Scale calibration; supplier specification; batch authorization"
    - protocol_id: cp_packaging_records
      process_id: "packaging_release"
      flow_role: "Immediate packaging"
      record_type: "Bill of materials, purchase, stock, and packing records"
      raw_fields: "material; unit_mass_kg; units_used; scrap_kg; returned_kg"
      collection_method: "Weigh representative packaging units and reconcile issues"
      unit: "kg"
      frequency: "Each packaging format; monthly reconciliation"
      temporal_coverage: "All formats in the reporting period"
      site_scope: "All immediate packaging at the reference gate"
      aggregation_rule: "Net issued packaging plus attributable scrap divided by released net product"
      quality_evidence: "Scale record; bill of materials; stock reconciliation"
    - protocol_id: cp_waste_records
      process_id: "all_applicable_processes"
      flow_role: "Wastewater, residuals, treatment inputs, recovered outputs, and dispatched waste"
      record_type: "Meter, manifest, scale, laboratory, and destination records"
      raw_fields: "stream_id; mass_or_volume; moisture; destination; classification; treatment; recovered_product_status"
      collection_method: "Measure by stream; document density conversion and product/waste decision"
      unit: "kg; m3; mass fraction"
      frequency: "Each transfer or meter interval"
      temporal_coverage: "Representative continuous 12-month period or declared campaign"
      site_scope: "All foreground waste and recovery routes"
      aggregation_rule: "Aggregate by stream and destination; normalize to reference flow or treatment output as specified"
      quality_evidence: "Meter/scale checks; manifests; analyses; receiving documentation"
    - protocol_id: cp_emission_records
      process_id: "stabilization_drying_wastewater_residuals"
      flow_role: "Direct substance-specific releases"
      record_type: "Monitoring, permit, fuel analysis, and approved calculation records"
      raw_fields: "substance; compartment; measured_value; unit; flow_rate; operating_time; factor; source"
      collection_method: "Use measured monitoring where available; otherwise document formula and factor provenance"
      unit: "substance-appropriate"
      frequency: "Monitoring/permit frequency and each calculation period"
      temporal_coverage: "Same period as production data"
      site_scope: "All foreground emission points and diffuse sources that can be quantified"
      aggregation_rule: "Calculate each substance and normalize to the applicable output"
      quality_evidence: "Laboratory QA; instrument calibration; permit report; calculation file"
    - protocol_id: cp_refrigerant_records
      process_id: "packaging_release"
      flow_role: "Refrigerant losses"
      record_type: "Equipment register, charge, purchase, recovery, and service records"
