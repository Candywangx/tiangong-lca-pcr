          property_unit: "Mass / kg"
          description: "Record reconciled refrigerant loss attributed to the product's actual frozen-storage service."
          amount:
            expression: "facility refrigerant loss allocated by documented refrigeration service driver and actual storage duration"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg net frozen target product dispatched"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_refrigerant
              source_ids: []
            ranges: []
allocation_rules:
  - rule_id: alloc_01_avoid
    applies_to: "Multi-output foreground operations"
    rule: "First avoid allocation by subdivision, separate metering, or expansion of independently operated steps when this is consistent with the declared goal and system model."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_02_physical
    applies_to: "Unavoidable joint production"
    rule: "When subdivision is not feasible, use a documented physical causal relationship that reflects how inputs and emissions change with the co-products; do not select mass merely because mass data are available."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_03_economic_fallback
    applies_to: "Joint production lacking a defensible physical relationship"
    rule: "Use economic allocation only as a disclosed fallback, based on temporally and geographically representative prices and accompanied by a sensitivity result against a plausible physical basis."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_04_waste_status
    applies_to: "Fish residuals, rejects, wastewater, and packaging waste"
    rule: "Classify an output as a co-product only when it has a documented destination and economic or functional value. Otherwise model it as waste and include treatment burdens; do not assign an avoided-product credit without an explicit consequential scenario."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_05_shared_utilities
    applies_to: "Shared refrigeration, water, cleaning, and warehouse services"
    rule: "Allocate shared utilities using measured process energy, operating time and load, occupied kg-day, water submetering, or another documented causal driver; disclose the driver and test material shared loads."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_mass_identity
      process_id: "p01_reception_p02_preparation"
      flow_role: "Lot identity and fish mass"
      record_type: "Receiving, scale, and production record"
      raw_fields: "lot_id, supplier, species_or_taxon, origin_route, presentation, received_state, gross_mass, tare, accepted_mass, rejected_mass, transfer_mass, timestamp"
      collection_method: "Calibrated scales joined to traceable lot records"
      unit: "kg"
      frequency: "Every lot and transfer"
      temporal_coverage: "Representative production period, normally at least 12 months or justified campaign"
      site_scope: "All included lines and facilities"
      aggregation_rule: "Sum by lot and process; preserve species, origin, presentation, and state; normalize only after reconciliation"
      quality_evidence: "Scale calibration, lot traceability, invoices, weigh tickets, and reconciliation record"
    - protocol_id: cp_water_ice
      process_id: "p02_preparation_p04_glazing_packaging"
      flow_role: "Water, ice, and glaze"
      record_type: "Meter, batch, or purchase record"
      raw_fields: "meter_start, meter_end, ice_mass, recovered_water, glaze_applied, use_type, lot_id, timestamp"
      collection_method: "Submetering preferred; otherwise documented water balance"
      unit: "kg"
      frequency: "Each batch or shift"
      temporal_coverage: "Same period as production"
      site_scope: "All included water and ice points"
      aggregation_rule: "Net supplied mass by use divided by corresponding process output"
      quality_evidence: "Meter calibration, purchase record, batch sheet, and water-balance closure"
    - protocol_id: cp_energy
      process_id: "p02_preparation_p03_freezing_p05_frozen_storage_dispatch"
      flow_role: "Electricity and fuel"
      record_type: "Meter and equipment operating record"
      raw_fields: "meter_start, meter_end, carrier, fuel_quantity, conversion_factor, equipment, runtime, load, production_mass, storage_kg_day"
      collection_method: "Process submetering preferred; otherwise reconcile facility meters and allocate by documented causal driver"
      unit: "kWh, MJ, or physical fuel unit"
      frequency: "Continuous, batch, shift, or monthly with production reconciliation"
      temporal_coverage: "Same representative period as production and seasonal storage"
      site_scope: "All included lines, freezers, and cold stores"
      aggregation_rule: "Sum by carrier and process; subtract documented excluded uses; normalize by process output or kg-day"
      quality_evidence: "Meter calibration, invoices, equipment logs, and allocation worksheet"
    - protocol_id: cp_freezing_cold_chain
      process_id: "p03_freezing_p05_frozen_storage_dispatch"
      flow_role: "Freezing completion and cold chain"
      record_type: "Time-temperature and dispatch record"
      raw_fields: "lot_id, sensor_id, sensor_location, start_time, end_time, core_temperature, store_temperature, excursion, corrective_action, dispatch_condition"
      collection_method: "Calibrated sensors and recorded checks at defined critical locations"
      unit: "°C, h, d"
      frequency: "Each lot plus continuous or defined periodic storage monitoring"
      temporal_coverage: "Entire freezing and storage interval"
      site_scope: "Every included freezer, cold room, and dispatch lot"
      aggregation_rule: "Preserve raw time series or checks; summarize completion, duration, and excursions by lot"
      quality_evidence: "Calibration certificates, alarm logs, corrective-action records, and dispatch checks"
    - protocol_id: cp_glaze_packaging
      process_id: "p04_glazing_packaging"
      flow_role: "Glaze, packaging, gross and net mass"
      record_type: "Batch, bill-of-material, and weight-control record"
      raw_fields: "lot_id, gross_mass, tare, package_mass, glaze_mass_or_fraction, net_product_mass, packaging_material, packaging_mass, rejected_packaging"
      collection_method: "Calibrated scales, documented deglazing or validated net-content procedure, and packaging bill of materials"
      unit: "kg"
      frequency: "Each lot and packaging specification"
      temporal_coverage: "Same period as production"
      site_scope: "All included products and packaging lines"
      aggregation_rule: "Calculate net product mass and aggregate packaging by material; reconcile to output count and mass"
      quality_evidence: "Scale calibration, net-content checks, packaging specifications, and stock reconciliation"
    - protocol_id: cp_refrigerant
      process_id: "p03_freezing_p05_frozen_storage_dispatch"
      flow_role: "Refrigerant additions and losses"
      record_type: "Service and charge inventory record"
      raw_fields: "refrigerant_identity, opening_charge, additions, recovery, closing_charge, confirmed_release, equipment, service_date, runtime_or_load_driver"
      collection_method: "Reconciled refrigerant mass balance by system and chemical"
      unit: "kg"
      frequency: "Every service event and at least annual reconciliation"
      temporal_coverage: "Same representative period as production"
      site_scope: "All refrigeration systems serving included processes"
      aggregation_rule: "Calculate loss by chemical; allocate shared system loss by documented causal refrigeration-service driver"
      quality_evidence: "Technician service records, purchase and recovery records, charge inventory, and leak-test records"
    - protocol_id: cp_residuals_wastewater
      process_id: "p01_reception_p02_preparation_p04_glazing_packaging"
      flow_role: "Co-products, solid waste, and wastewater"
      record_type: "Scale, container, manifest, meter, and laboratory record"
      raw_fields: "material, mass, destination, sale_status, wastewater_volume_or_mass, pollutant_parameter, concentration, sampling_time, treatment_route"
      collection_method: "Weighing or stock balance for solids; metering and representative sampling for wastewater"
      unit: "kg and parameter-specific units"
      frequency: "Each lot, container, shipment, or sampling plan"
      temporal_coverage: "Same period as production"
      site_scope: "All included discharge and residual points"
      aggregation_rule: "Aggregate by material, status, and destination; calculate pollutant load from flow and concentration without double counting treated effluent"
      quality_evidence: "Weigh tickets, sales records, waste manifests, meter calibration, laboratory reports, and treatment invoices"
  calculation_rules:
    - id: calc_01_net_mass
      applies_to: "Reference product"
      rule: "net target-product mass = gross packaged mass - packaging mass - removable glaze mass - free water and non-product tare"
      inputs:
        - gross_mass
        - package_mass
        - glaze_mass_or_fraction
        - tare
      output: "kg net frozen target product"
      source_ids:
        - codex-cxc-52-2003
        - codex-cxs-190-1995
    - id: calc_02_yield
      applies_to: "Preparation and full foreground"
      rule: "net yield = net frozen target-product mass / accepted salmonid input mass; report co-product and waste fractions separately"
      inputs:
        - accepted_mass
        - net_product_mass
        - co-product_mass
        - waste_mass
      output: "yield ratio and reconciled mass fractions"
      source_ids: []
    - id: calc_03_energy
      applies_to: "Each foreground process"
      rule: "process energy per process output = reconciled carrier-specific process energy / measured process output"
      inputs:
        - "meter readings"
        - "excluded use"
        - "allocation driver"
        - "output mass"
      output: "kWh or MJ per kg process output"
      source_ids: []
    - id: calc_04_storage_service
      applies_to: "Frozen storage"
      rule: "storage service = occupied product mass multiplied by actual storage duration; allocate storage electricity and shared refrigerant loss by the documented service driver"
      inputs:
        - "kg in storage"
        - "entry and exit time"
        - "storage electricity"
        - "shared system loss"
      output: "kg-day, kWh/kg-day, and kg refrigerant per kg-day"
      source_ids: []
    - id: calc_05_refrigerant_loss
      applies_to: "Refrigeration systems"
      rule: "refrigerant loss = opening charge + additions - recovery - closing charge, reconciled by chemical and excluding transfers documented to another system"
      inputs:
        - opening_charge
        - additions
        - recovery
        - closing_charge
      output: "kg loss by refrigerant chemical"
      source_ids: []
    - id: calc_06_allocation
      applies_to: "Multi-output operations"
      rule: "apply subdivision first; otherwise apply the selected documented causal physical relationship; use economic fallback only with price-period and sensitivity disclosure"
      inputs:
        - "process inputs and emissions"
        - "co-product quantities"
        - "physical driver or representative prices"
      output: "allocated inventory by output"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_01_identity_traceability
      applies_to: "All product lots"
      requirement: "Preserve species or taxon, origin route, supplier, presentation, received state, lot links, and mass transfers from receipt through dispatch."
      evidence: "Receiving records, production genealogy, labels, and dispatch documents; unsd-cpc-v3-2025; codex-cxc-52-2003"
    - id: dq_02_temporal_representativeness
      applies_to: "Foreground inventory"
      requirement: "Cover a representative production period including material seasonality and cold-storage duration, normally 12 months; justify a shorter campaign and disclose excluded shutdowns or abnormal operation."
      evidence: "Meter coverage, production calendar, storage records, and representativeness statement"
    - id: dq_03_measurement
      applies_to: "Mass, water, energy, temperature, and refrigerant data"
      requirement: "Use calibrated instruments where measurement is required; retain units, conversion factors, missing-data treatment, and meter-to-process reconciliation."
      evidence: "Calibration certificates, raw readings, invoices, and reconciliation worksheets"
    - id: dq_04_completeness
      applies_to: "Foreground boundary"
      requirement: "Account for all included processes, utilities, packaging, glaze, co-products, wastes, wastewater, refrigerant losses, rework, and product loss; quantify and justify exclusions."
      evidence: "Process map, mass and energy balances, waste manifests, and gap register; eu-pef-2021-2279"
    - id: dq_05_cold_chain_quality
      applies_to: "Freezing and storage"
      requirement: "Retain lot-specific freezing completion evidence, storage duration, temperature monitoring, excursions, corrective action, and packaging or glaze integrity checks."
      evidence: "Time-temperature records, alarms, inspections, and corrective-action records; codex-cxc-52-2003"
    - id: dq_06_safety_context
      applies_to: "Food-contact operations"
      requirement: "Retain hygiene, water suitability, hazard-control, contamination prevention, and packaging conformity records needed to demonstrate that the modelled output was marketable product."
      evidence: "Facility prerequisite and hazard-control records; codex-cxc-52-2003; conditionally codex-cxs-190-1995"
    - id: dq_07_provisional_ranges
      applies_to: "Every reasoned-estimate range"
      requirement: "Treat the range as a replaceable screening guardrail, flag values outside it for investigation, and replace it with foreground or reviewed source-backed evidence before reviewed or published use where material."
      evidence: "Manifest review metadata, reviewer decision, and replacement evidence"
validation_rules:
  - rule_id: val_01_reference_identity
    applies_to: "Reference flow"
    rule: "Require exactly 1 kg net target-product mass, product flow UUID a9f77412-4b2a-4d64-b893-7356d0173ed0, Mass property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids:
      - unsd-cpc-v3-2025
  - rule_id: val_02_qualifiers
    applies_to: "Reference product metadata"
    rule: "Fail completeness when species or taxon, origin route, presentation, received state, glaze status, packaging, freezing route, storage duration, dispatch condition, geography, or production period is absent."
    source_ids:
      - unsd-cpc-v3-2025
      - codex-cxc-52-2003
  - rule_id: val_03_net_mass
    applies_to: "Product amount"
    rule: "Check that packaging, removable glaze, free water, pallets, and transport containers are excluded from the reference amount and that gross-to-net calculation inputs reconcile."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-190-1995
  - rule_id: val_04_process_coverage
    applies_to: "Foreground boundary"
    rule: "Require reception, applicable preparation, actual freezing or explicit already-frozen starting condition, applicable glazing and packaging, frozen storage, and dispatch; require reasons for every omitted conditional process."
    source_ids:
      - codex-cxc-52-2003
      - eu-pef-2021-2279
  - rule_id: val_05_cold_chain
    applies_to: "Frozen product validity"
    rule: "Require freezing-completion and storage time-temperature records, excursion and corrective-action disclosure, and a frozen condition at the declared dispatch gate."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: val_06_balances
    applies_to: "Mass, water, and energy data"
    rule: "Require lot mass reconciliation, water and ice separation, carrier-specific energy totals, allocation of shared utilities, and quantified unexplained balance gaps."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_07_allocation
    applies_to: "Co-products and shared services"
    rule: "Require the allocation hierarchy, selected driver, co-product or waste classification, price period when economic fallback is used, and sensitivity disclosure for material allocation choices."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_08_refrigerants
    applies_to: "Refrigeration"
    rule: "Require refrigerant chemical identity and reconciled service records; reject treating the full equipment charge as an emission and flag unassigned confirmed losses."
    source_ids: []
  - rule_id: val_09_reasoned_estimates
    applies_to: "Provisional ranges"
    rule: "Identify every reasoned_estimate, require justification and replacement status, and flag values outside a QA range for investigation rather than automatic substitution."
    source_ids: []
  - rule_id: val_10_food_safety_context
    applies_to: "Product validity"
    rule: "Require the applicable hygiene, hazard-control, water-suitability, glaze or net-content, packaging-integrity, and lot-traceability evidence; report that PCR validation is not food-safety certification."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-190-1995
published_dataset_profile:
  dataset_role: "Foreground production dataset for frozen Salmonidae at the processor frozen-store dispatch gate"
  downstream_use: "secondary_dataset; background_dataset after review of representativeness and upstream links"
  allowed_use: "Attributional LCA, product footprinting, supply-chain modelling, procurement comparisons, and lifecycle-model construction for the declared species or taxon, origin route, presentation, geography, technology, and period"
  excluded_use: "Food-safety certification; nutritional claims; comparisons that ignore species, wild or farmed origin, presentation, glaze, storage duration, allocation, or upstream differences; use for fillets, minced meat, non-salmonid fish, or non-frozen products without explicit adaptation"
  required_metadata: "PCR id and version; product-flow UUID; species or taxon; origin route; received and sold presentation; glaze and packaging; facility geography; production period; freezing technology and location; cold-storage duration; dispatch condition; upstream dataset links; co-product fate; allocation; data owners and review status"
  required_quality_disclosure: "Measurement coverage and calibration; mass, water, and energy reconciliation; meter allocation; cold-chain records and excursions; refrigerant accounting; co-product and waste destinations; wastewater data; provisional estimates; source and technology mismatches; exclusions and uncertainty"
  update_trigger: "Material change in species mix, wild or farmed origin, received state, presentation, facility, freezing or refrigeration technology, glaze or packaging specification, storage duration, refrigerant, energy supply, yield, co-product market, allocation, regulation, source evidence, or data older than the declared representativeness period"
