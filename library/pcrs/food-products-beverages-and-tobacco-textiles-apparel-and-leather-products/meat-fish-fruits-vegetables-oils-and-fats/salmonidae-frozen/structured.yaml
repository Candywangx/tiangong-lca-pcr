system_boundary:
  rules:
    - rule_id: sb_01_foreground_gate
      applies_to: "Foreground system"
      rule: "Include all operations actually performed from receipt of identified salmonid input through frozen-store dispatch, including rejects, cleaning, freezing, glazing, packaging, storage, utility use, refrigerant losses, wastewater, and residual handling."
      source_ids:
        - codex-cxc-52-2003
        - eu-pef-2021-2279
    - rule_id: sb_02_cold_chain
      applies_to: "Freezing and frozen handling"
      rule: "Preserve the frozen-state chain from completion of freezing through dispatch; record time-temperature monitoring, excursions, product losses, and rework instead of assuming uninterrupted cold storage."
      source_ids:
        - codex-cxc-52-2003
    - rule_id: sb_03_upstream_links
      applies_to: "Upstream inputs"
      rule: "Keep aquaculture or capture, feed, vessel operation, inbound transport, electricity generation, material manufacture, and downstream treatment outside the foreground only when explicit upstream datasets are linked."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_04_recursive_input
      applies_to: "Already-frozen same-category input"
      rule: "Prevent double counting by treating received already-frozen Salmonidae as an upstream product input and modelling only the subsequent operations actually performed by the reporting facility."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_05_food_safety_records
      applies_to: "Product validity"
      rule: "Retain lot identity, hygiene controls, hazard-control records, freezing records, glaze and net-mass records, and packaging integrity evidence needed to show that inventory represents marketable frozen fish."
      source_ids:
        - codex-cxc-52-2003
        - codex-cxs-190-1995
boundary_abstraction:
