validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference_flow"
    rule: "Require product flow e7b009bd-ea26-4617-9ccf-f14d12e2c0b6, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, kg, and all required product qualifiers."
    source_ids: []
  - rule_id: validation_process_coverage
    applies_to: "foreground_processes"
    rule: "Require all three process ids and an explicit declaration of actual cutting, trimming, packaging sequence, freezing technology, frozen-storage duration, and any integrated upstream stages."
    source_ids:
      - fao-meat-industry-2004
  - rule_id: validation_mass_balance
    applies_to: "meat_and_packaging_balances"
    rule: "Require reconciled incoming, intermediate, reference-product, co-product, waste, packaging, and stock-change masses; unexplained residuals are findings and must not be silently assigned to the reference product."
    source_ids:
      - fao-leap-pig-2018
  - rule_id: validation_energy_temperature
    applies_to: "freezing_and_storage"
    rule: "Require electricity records, freezing time-temperature records, storage duration, temperature monitoring, and a documented allocation method for any shared meter."
    source_ids: []
  - rule_id: validation_refrigerant
    applies_to: "refrigeration_system"
    rule: "Require refrigerant identity and a non-negative, record-reconciled mass balance by refrigerant; unresolved elementary-flow UUIDs remain explicit and the reference-product UUID must not be reused."
    source_ids: []
  - rule_id: validation_allocation
    applies_to: "multifunctional_outputs"
    rule: "Require subdivision evidence or the selected physical, biophysical, or economic allocation key, product grouping, price period where relevant, and sensitivity analysis for material allocation choices."
    source_ids:
      - fao-leap-pig-2018
  - rule_id: validation_estimate_status
    applies_to: "provisional_qa_ranges"
    rule: "Flag any final inventory amount populated from a reasoned_estimate QA guardrail as nonconforming unless reviewed evidence explicitly authorizes that use."
    source_ids: []
  - rule_id: validation_data_quality
    applies_to: "dataset_completeness"
    rule: "Require temporal, technological, geographical, completeness, and accuracy assessment; disclose cut-offs, proxies, missing records, and validation checks skipped."
    source_ids:
      - fao-leap-pig-2018
published_dataset_profile:
  dataset_role: "Foreground data package for frozen pig meat production at the freezing facility dispatch gate"
  downstream_use: "secondary_dataset; background_dataset after methodology review, source resolution, and quality disclosure"
  allowed_use: "Attributional LCI and lifecycle-model construction for frozen pork matching the declared product qualifiers, technology, geography, period, upstream linkage, and facility gate"
  excluded_use: "Unsupported comparative assertions; fresh or chilled meat; prepared or preserved pork; different species; studies that omit required upstream pig-meat datasets or substitute QA estimates for foreground values"
  required_metadata: "PCR id and version state; product and reference-flow UUIDs; CPC mapping context; cut or carcass form; bone status; net-mass convention; packaging state; freezing technology; dispatch temperature specification; storage duration; facility geography; period; upstream dataset ids; cut-offs; allocation method; unresolved UUIDs"
  required_quality_disclosure: "Record coverage; calibration status; meter and scale allocation; mass-balance residuals; proxy and estimate use; source versions; temporal, technological, and geographical representativeness; completeness; uncertainty and sensitivity results; checks skipped"
  update_trigger: "Material change in incoming meat specification, supplier or upstream dataset, cut mix, freezing or refrigeration technology, packaging, storage duration, allocation, facility geography, regulation, or representative energy and material performance"
data_sources:
  - id: "fao-leap-pig-2018"
