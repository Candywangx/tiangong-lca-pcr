allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared_foreground_inputs"
    rule: "Avoid allocation by separately metering and subdividing receipt, preparation, freezing, packaging, storage, and waste-treatment operations wherever technically feasible."
    source_ids:
      - fao-leap-pig-2018
  - rule_id: allocation_frozen_pork_group
    applies_to: "covered_frozen_pork_presentations"
    rule: "Do not allocate among carcass, half-carcass, bone-in, or boneless frozen pork presentations that remain inside the declared covered-product group; aggregate their net mass unless the goal requires separately measured product packages."
    source_ids:
      - fao-leap-pig-2018
  - rule_id: allocation_coproduct_hierarchy
    applies_to: "marketed_non_reference_outputs"
    rule: "When subdivision is not feasible, apply a documented physical or biophysical relationship only for outputs with similar functions and markets; otherwise allocate shared burdens by contemporaneous net economic value and test sensitivity to the allocation choice."
    source_ids:
      - fao-leap-pig-2018
  - rule_id: allocation_waste_treatment
    applies_to: "waste_and_residual_outputs"
    rule: "Do not treat a disposal-bound output as a co-product. Retain attributable collection and treatment burdens in the foreground package; if an output has a documented market and subsequent use, reclassify it consistently and apply the co-product hierarchy."
    source_ids:
      - fao-leap-pig-2018
