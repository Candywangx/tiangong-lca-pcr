    - id: calc_refrigerant_release
      applies_to: "Refrigeration circuits serving freezing and storage"
      rule: "release = opening_charge + additions - closing_charge - recovered_mass - returned_mass, bounded at zero only after investigating inconsistent records"
      inputs:
        - "Refrigerant-specific opening and closing charge"
        - additions
        - recovery
        - returns
        - "attributable operation share"
      output: "kg release by refrigerant and normalized reference flow"
      source_ids: []
    - id: calc_packaging_consumption
      applies_to: "Packaging materials"
      rule: "consumed_packaging = opening_stock + receipts - closing_stock - reusable_returns; report scrap and product-associated packaging separately"
      inputs:
        - "Packaging stock"
        - receipts
        - "reusable returns"
        - scrap
        - "and product assignment by material"
      output: "kg packaging consumed and kg scrap by material"
