system_boundary:
  rules:
    - rule_id: sb_foreground_operations
      applies_to: "frozen_pork_foreground"
      rule: "Include receipt and temperature-controlled handling, on-site cutting and trimming when performed, packaging, freezing, frozen storage until dispatch, cleaning attributable to these operations, electricity, fuels, water, refrigerant management, packaging, wastes, wastewater, and direct releases."
      source_ids:
        - fao-meat-industry-2004
        - fao-leap-pig-2018
    - rule_id: sb_upstream_linkage
      applies_to: "incoming_unfrozen_pig_meat"
      rule: "Represent pig production, live-animal transport, slaughter, dressing, and off-site chilled transport through separately identifiable upstream datasets matching the declared incoming meat state."
      source_ids:
        - fao-leap-pig-2018
    - rule_id: sb_downstream_exclusion
      applies_to: "post_dispatch_stages"
      rule: "Exclude transport beyond the dispatch gate, distribution, retail, thawing, cooking, consumption, and end-of-life unless the study explicitly extends the system and reports those stages separately."
      source_ids:
        - fao-leap-pig-2018
    - rule_id: sb_cutoff_disclosure
      applies_to: "completeness_and_cutoffs"
      rule: "Draw and retain a process and material-flow map, disclose every cut-off, and justify exclusions; do not exclude a flow merely because its Tiangong UUID is unresolved."
      source_ids:
        - fao-leap-pig-2018
boundary_abstraction:
  declared_starting_condition: "Unfrozen edible pig meat received at the freezing facility gate after upstream slaughter and dressing, with actual temperature, carcass or cut form, bone status, net mass, and upstream dataset reference declared"
  starting_condition_role: "Purchased or internally transferred upstream product input to the frozen-meat foreground package"
  product_classification_scope: "Frozen edible meat of pigs corresponding to CPC 3.0 code 21133; classification is mapping context and does not replace the semantic product boundary"
  recursive_input_rule: "If frozen pig meat in the same category is used as an input, record it as a separately quantified technosphere input with its own upstream dataset and declared purpose; do not recursively reapply this PCR to hide the input"
  upstream_dataset_requirement: "Link representative upstream datasets for pig production, live-animal transport, slaughter, dressing, and any off-site chilled transport embodied in the incoming unfrozen meat"
  disclosure: "Disclose facility gates, incoming meat state, included preparation operations, freezing technology, packaging sequence, storage duration, cut-offs, allocation method, and any integrated upstream stages represented as separate linked inventories"
