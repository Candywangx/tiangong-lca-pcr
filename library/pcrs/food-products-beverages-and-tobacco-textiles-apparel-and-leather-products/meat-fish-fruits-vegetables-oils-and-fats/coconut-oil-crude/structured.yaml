allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Shared operations and utilities"
    rule: "First avoid allocation through process subdivision, submetering, lot tracking, or another physically defensible separation of copra preparation, pressing, optional solvent recovery, and clarification."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: allocation_cake_meal
    applies_to: "Crude coconut oil and saleable press cake or desolventised meal"
    rule: "When subdivision cannot resolve the joint operation, prefer a documented physical causal relationship. If none can be demonstrated, allocate by site-specific economic value using consistent net revenue at the same mill gate over a representative period; disclose prices, period, currency, allocation shares, and sensitivity to a mass-based result."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: allocation_residual_status
    applies_to: "Rejects, residues, recovered solvent, and wastes"
    rule: "Do not assign co-product credit to internal solvent recycle, internal rework, or material sent for disposal. Treat a residual as a co-product only when it meets a declared specification and has a documented beneficial destination and value."
    source_ids:
      - iso-14044-2006
      - eu-jrc-fdm-bref-2019
  - rule_id: allocation_shared_services
    applies_to: "Shared electricity, steam, water, treatment, and storage"
    rule: "Allocate shared services using measured consumption where possible; otherwise use a documented causal driver such as operating hours, throughput, heat duty, or discharge load and test material shared-service allocations for sensitivity."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_quality
      process_id: "all_mapped_processes"
      flow_role: "copra, intermediates, oil, cake or meal, filter aid"
      record_type: "weighbridge tickets, scale logs, tank gauges, transfer records, laboratory certificates"
      raw_fields: "timestamp; lot_id; material_id; gross_mass; tare_mass; net_mass; moisture; impurities; FFA_or_acid_value; origin; destination; instrument_id"
      collection_method: "calibrated weighing or tank gauging with representative sampling and stated test method"
      unit: "kg; mass %; declared test unit"
      frequency: "each receipt, transfer, and dispatch lot"
      temporal_coverage: "at least one representative production year or complete declared campaign"
      site_scope: "each included mill and production line"
      aggregation_rule: "reconcile opening stock + receipts - closing stock - transfers by lot and normalize to net dispatched oil"
      quality_evidence: "calibration records; sampling plan; laboratory method; stock reconciliation"
    - protocol_id: cp_energy_by_process
      process_id: "all_mapped_processes"
      flow_role: "electricity, fuel, and purchased steam"
      record_type: "meters, fuel invoices, boiler logs, run-time records"
      raw_fields: "timestamp; process_id; carrier; meter_start; meter_end; fuel_mass_or_volume; heating_value; steam_mass; allocation_driver"
      collection_method: "submetering preferred; otherwise documented engineering allocation from shared meters"
      unit: "kWh; MJ; kg carrier"
      frequency: "monthly and each production campaign"
      temporal_coverage: "same period as product output"
      site_scope: "each included line; shared utility boundary declared"
      aggregation_rule: "subtract exports, retain conversion factors, and allocate shared utilities by causal driver"
      quality_evidence: "meter calibration; invoices; fuel specification; allocation worksheet"
    - protocol_id: cp_water_balance
      process_id: "solvent_oil_recovery_and_cleaning_operations"
      flow_role: "make-up water, recirculated water, wastewater"
      record_type: "water meters, tank records, discharge meters"
      raw_fields: "timestamp; source; make_up_volume; recirculated_volume; discharge_volume; density; treatment_destination"
      collection_method: "meter boundary-crossing water and identify internal recycle separately"
      unit: "m3; kg"
      frequency: "monthly and each production campaign"
      temporal_coverage: "same period as product output"
      site_scope: "each included mill and discharge point"
      aggregation_rule: "net make-up and discharge are separately normalized; internal recirculation is memo information"
      quality_evidence: "meter calibration; water-balance reconciliation; discharge record"
    - protocol_id: cp_solvent_balance
      process_id: "solvent_oil_recovery"
      flow_role: "make-up solvent, recovered solvent, transfers, destruction, releases"
      record_type: "purchase records, tank levels, recovery meters, stack tests, leak records"
      raw_fields: "solvent_identity; opening_stock; receipts; closing_stock; recovered_recycle; offsite_transfer; destroyed_mass; measured_air_release; unexplained_loss"
      collection_method: "closed campaign mass balance supplemented by measured release-pathway data"
      unit: "kg"
      frequency: "each campaign and monthly reconciliation"
      temporal_coverage: "complete solvent-route operating period"
      site_scope: "each extraction and recovery system"
      aggregation_rule: "reconcile all solvent inputs, inventories, recycle, transfers, destruction, and releases; do not assign all make-up to air"
      quality_evidence: "calibrated tank or flow meters; purchase records; leak survey; stack-test report; signed balance"
    - protocol_id: cp_residuals_emissions
      process_id: "all_mapped_processes"
      flow_role: "rejects, wastes, residues, dust, direct releases"
      record_type: "waste tickets, scales, stack tests, exhaust logs, treatment manifests"
      raw_fields: "timestamp; row_id; mass; concentration; exhaust_flow; operating_time; destination; treatment; recovery_status"
      collection_method: "weigh residuals and calculate releases from measured concentration × flow × operating time where applicable"
      unit: "kg; mg/Nm3; Nm3/h; h"
      frequency: "each shipment and monitoring event"
      temporal_coverage: "same period as product output"
      site_scope: "each included source and destination"
      aggregation_rule: "aggregate by row and destination, then normalize to dispatched oil"
      quality_evidence: "calibration; laboratory report; chain-of-custody or waste manifest"
    - protocol_id: cp_coproduct_value
      process_id: "mechanical_oil_extraction_and_solvent_oil_recovery"
      flow_role: "allocation drivers for oil, cake, and meal"
      record_type: "sales invoices, transfer prices, quantity records"
      raw_fields: "product_id; quantity; specification; net_price; currency; date; destination; internal_transfer_basis"
      collection_method: "collect comparable mill-gate values net of separable downstream handling"
      unit: "kg; currency/kg"
      frequency: "each transaction; summarized monthly"
      temporal_coverage: "representative 12-month period or justified campaign"
      site_scope: "each included mill"
      aggregation_rule: "calculate quantity-weighted net value using one currency and price basis"
      quality_evidence: "invoice sample; currency conversion; price-basis review"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = period or lot amount / net kg of crude_coconut_oil_output dispatched for the same boundary and period"
      inputs:
        - "row amount"
        - "net crude-oil output"
      output: "amount per 1 kg crude coconut oil"
      source_ids:
        - iso-14044-2006
    - id: calc_material_balance
      applies_to: "Each process and whole mill"
      rule: "opening stocks + external receipts + internal transfers in = closing stocks + external outputs + internal transfers out + measured wastes and emissions + documented balance difference; internal transfers cancel at whole-mill level"
      inputs:
        - "mass and stock records"
      output: "process and whole-mill balance plus unexplained difference"
      source_ids:
        - iso-14044-2006
    - id: calc_direct_air_release
      applies_to: "Measured dust or solvent releases"
      rule: "released mass = concentration × dry or wet exhaust flow × operating time, with reference conditions and unit conversions documented"
      inputs:
        - concentration
        - "exhaust flow"
        - "operating time"
      output: "kg released by pathway"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_solvent_reconciliation
      applies_to: "Solvent route"
      rule: "unexplained solvent loss = opening stock + receipts - closing stock - off-site transfers - documented destruction; report measured air/water/waste pathways separately and reconcile, without forcing the entire difference to air"
      inputs:
        - "solvent balance fields"
      output: "kg solvent by fate and unexplained difference"
      source_ids:
        - eu-jrc-fdm-bref-2019
    - id: calc_economic_allocation
      applies_to: "Joint oil and saleable cake or meal"
      rule: "product value share = quantity × consistent net mill-gate price / sum of quantity × net price for all co-products; apply shares only after subdivision has been exhausted"
      inputs:
        - "product quantities"
        - "comparable prices"
        - "currency basis"
      output: "allocation factors summing to 1"
      source_ids:
        - iso-14044-2006
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and copra"
      requirement: "Retain lot linkage, botanical origin as coconut kernel or copra, extraction route, unrefined status, and declared moisture, impurity, and FFA or acid-value test bases."
      evidence: "receiving records; product certificate; laboratory method; codex-cxs-210-1999"
    - id: dq_temporal
      applies_to: "Foreground inventory"
      requirement: "Use at least one representative production year; a shorter complete campaign is allowed only for seasonal or batch production with dates, throughput, downtime, and representativeness justification disclosed."
      evidence: "dated meters, invoices, batch records, and production logs"
    - id: dq_geography_technology
      applies_to: "Foreground and upstream data"
      requirement: "Identify mill location, copra origin, extraction technology, solvent use, energy carriers, and pollution controls; justify upstream datasets against those characteristics."
      evidence: "site metadata; supplier declarations; equipment list; dataset selection record"
    - id: dq_completeness
      applies_to: "Material, energy, water, wastes, and emissions"
      requirement: "Reconcile all process maps and report missing, estimated, or allocated flows. Solvent, direct emissions, wastewater, and hazardous wastes cannot be omitted only because their mass is small."
      evidence: "process balance; utility reconciliation; solvent balance; waste manifests; eu-jrc-fdm-bref-2019"
    - id: dq_measurement
      applies_to: "Collected foreground values"
      requirement: "Identify instrument, calibration state, sampling method, test method, frequency, and any data substitution; preserve raw records and conversion factors."
      evidence: "calibration certificates; sampling plan; laboratory reports; calculation workbook"
    - id: dq_estimate_replacement
      applies_to: "Every provisional QA range"
      requirement: "Treat reasoned_estimate ranges only as screening flags. Replace or confirm them with reviewed coconut-oil foreground evidence before active status; values outside a guardrail require investigation, not automatic rejection."
      evidence: "review record; site evidence; documented investigation"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require exactly 1 kg net output of Tiangong flow 8b18e824-f237-4a70-9127-ddabde706d15 with Mass 93a60a56-a3c8-11da-a746-0800200b9a66, unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and all required qualifiers."
    source_ids:
      - codex-cxs-210-1999
  - rule_id: validate_scope_route
    applies_to: "Process coverage"
    rule: "Require all required processes and require solvent_oil_recovery only when solvent extraction occurs; reject inclusion of refining inside the crude-oil unit process unless it is separately metered or allocated to a downstream dataset."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_internal_transfers
    applies_to: "Process links"
    rule: "Require prepared copra, cake sent to extraction, and crude-oil intermediate inputs to reconcile with their corresponding outputs over the same lot or period."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_material_balance
    applies_to: "Each process and whole mill"
    rule: "Require a disclosed mass-balance difference and investigation of unexplained losses; do not silently close the balance by changing the reference output or assigning the difference to air."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_energy_water
    applies_to: "Utilities"
    rule: "Require carrier-specific energy, net make-up water, internal recirculation memo flows, and wastewater discharge to use consistent boundaries and conversions without double counting."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_solvent_route
    applies_to: "Conditional solvent route"
    rule: "Require solvent identity and a reconciled balance covering make-up, inventories, recovered recycle, transfers, destruction, and measured releases; omission is an error when the route is included."
    source_ids:
      - eu-jrc-fdm-bref-2019
  - rule_id: validate_allocation
    applies_to: "Joint products and shared services"
    rule: "Require the allocation hierarchy, driver, values, period, factor sum, and sensitivity result to be disclosed whenever subdivision does not fully avoid allocation."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: validate_provisional_ranges
    applies_to: "QA guardrails"
    rule: "Flag values outside a provisional reasoned_estimate QA guardrail for review. Do not substitute the guardrail midpoint or treat the range as an allowed conformance interval."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for crude coconut oil at the oil-mill gate"
  downstream_use: "secondary_dataset; background_dataset after independent methodology and data-quality review"
  allowed_use: "Cradle-to-gate or later life-cycle models that add representative upstream copra and utility datasets and downstream refining, transport, use, and end-of-life as required by goal and scope"
  excluded_use: "Direct representation of virgin or refined coconut oil; direct consumer product claims; substitution for coconut cultivation or copra drying; comparative public claims without applicable review"
  required_metadata: "PCR id; reference-flow UUID and qualifiers; mill and copra geography; production period; extraction route; included processes; upstream datasets; utility carriers; allocation method and factors; co-product status; quality test methods"
  required_quality_disclosure: "Foreground coverage; measured, calculated, allocated, and estimated shares; mass- and solvent-balance differences; missing UUIDs; provisional range use; data age; laboratory and meter quality; exclusions and sensitivity results"
  update_trigger: "Change in copra origin or preparation, extraction technology, solvent, energy system, co-product market, allocation driver, pollution control, product specification, or a material foreground value; or evidence showing provisional guardrails are no longer appropriate"
