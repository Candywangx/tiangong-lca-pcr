system_boundary:
  rules:
    - rule_id: boundary_core_operations
      applies_to: "All datasets"
      rule: "Include copra receiving and preparation, mechanical pressing, crude-oil separation or filtration, transfers, and storage through the oil-mill dispatch point."
      source_ids:
        - eu-jrc-fdm-bref-2019
        - codex-cxs-210-1999
    - rule_id: boundary_conditional_solvent
      applies_to: "Solvent-assisted mills"
      rule: "Include pressed-cake extraction, miscella distillation, meal desolventising, solvent recovery, make-up solvent, wastewater, waste, and fugitive or channelled solvent releases when this route is operated."
      source_ids:
        - eu-jrc-fdm-bref-2019
    - rule_id: boundary_refining_exclusion
      applies_to: "All datasets"
      rule: "Exclude degumming, neutralisation, bleaching, deodorisation, fractionation, and hydrogenation; if performed at the same site, meter or allocate them to a downstream refining dataset."
      source_ids:
        - eu-jrc-fdm-bref-2019
    - rule_id: boundary_upstream_disclosure
      applies_to: "Copra supply"
      rule: "Exclude cultivation, harvest, dehusking, shelling, and copra drying only when they are represented by an upstream dataset; on-site performance of any such operation must be separately inventoried and disclosed."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_no_hazardous_cutoff
      applies_to: "Materiality screening"
      rule: "Do not omit solvent, direct air emissions, wastewater, hazardous chemicals, or hazardous wastes solely because their mass share is small; disclose any other excluded flow and its screening basis."
      source_ids:
        - iso-14044-2006
        - eu-jrc-fdm-bref-2019
boundary_abstraction:
  declared_starting_condition: "Dried coconut kernel (copra) received at the first oil-mill control point, with supplier, origin, received mass, moisture basis, and whether upstream dehusking, shelling, and drying are included in the upstream dataset declared"
  starting_condition_role: "Gate-to-gate foreground starting condition for crude-oil extraction; copra production and drying are upstream product systems unless performed within the reporting facility"
  product_classification_scope: "Crude, unrefined coconut oil derived from coconut kernel or copra; downstream refining and consumer-grade virgin or cold-pressed oil are outside this PCR"
  recursive_input_rule: "Returned or reworked crude coconut oil from the same lot or facility is an internal loop and is not counted as a new product input; externally purchased crude coconut oil is disclosed and modelled with a separate upstream dataset and must not be silently relabelled as foreground output"
  upstream_dataset_requirement: "Use geographically and temporally representative upstream datasets for copra, purchased energy, fuels, water, solvent, filter aids, and other technosphere inputs; disclose missing upstream coverage"
  disclosure: "Declare the mill gate, included unit operations, mechanical or solvent route, treatment of internal recycle, allocation method, excluded upstream and downstream stages, geography, production period, and any shared utilities"
