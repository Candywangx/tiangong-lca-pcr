    - id: dq_food_safety_records
      applies_to: "Product-contact water and preservation controls"
      requirement: "Retain evidence of potable water or clean seawater and route-appropriate hygiene, endpoint, temperature, drying, salt/brine, and storage controls."
      evidence: "HACCP/control and release records; codex-cxc-52-2003; codex-cxs-92-1981"
    - id: dq_estimate_replacement
      applies_to: "Reasoned-estimate ranges"
      requirement: "Treat candidate ranges only as QA flags. Replace them with reviewed external evidence or foreground records before active status; explain any retained outlier rather than clipping it."
