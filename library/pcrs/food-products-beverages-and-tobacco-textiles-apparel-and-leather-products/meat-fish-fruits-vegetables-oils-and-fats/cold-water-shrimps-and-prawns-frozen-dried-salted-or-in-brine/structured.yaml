validation_rules:
  - rule_id: validation_identity
    applies_to: "Reference product"
    rule: "Fail if the reference flow UUID, Mass property UUID, mass unit-group UUID, kg unit, CPC/product meaning, or canonical PCR identity differs from this PCR."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: validation_route
    applies_to: "Dataset scope"
    rule: "Fail if exactly one route is not declared, if route-inapplicable flows are included without explanation, or if multiple routes are averaged without an explicit weighted scenario."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-92-1981
  - rule_id: validation_reference_mass
    applies_to: "Reference amount"
    rule: "Fail if 1 kg is not net shrimp product mass or includes packaging, frozen glaze, or free brine/draining liquid."
    source_ids:
      - codex-cxs-92-1981
  - rule_id: validation_inventory
    applies_to: "Foreground inventory"
    rule: "Fail if any required process is absent or if product inputs/outputs, water/ice, route energy/materials, packaging, residues, wastewater, storage, and refrigerant are omitted without an applicability statement."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_allocation
    applies_to: "Multi-output processes"
    rule: "Fail if co-product/waste disposition or allocation method, driver, shares, price period where relevant, and sensitivity are not disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_controls
    applies_to: "Frozen and other declared routes"
    rule: "For frozen product, fail if quick-freezing and -18 degC or colder storage evidence is absent; for every route, fail if applicable product-contact water, hygiene, endpoint, and storage controls are undocumented."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-92-1981
  - rule_id: validation_quality
    applies_to: "Data package"
    rule: "Fail if collection coverage, mass-balance closure, data period, geography, technology, site coverage, proxies, exclusions, and estimate status are not disclosed."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production dataset for one declared preservation route"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product- and route-matched LCA process or lifecyclemodel studies with compatible reference mass, boundary, geography, technology, and period"
  excluded_use: "Undeclared route mixes; substitution for fresh, warm-water, canned, breaded, fermented, or composite shrimp products; nutritional or food-safety certification"
  required_metadata: "PCR id and version; product and route qualifiers; reference-flow UUID; site/geography; period; technology; product form; origin/production system; yield; allocation; source datasets; collection coverage"
  required_quality_disclosure: "Mass-balance closure; meter and lot coverage; route separation; proxy and estimate list; data gaps; uncertainty/outliers; refrigerant method; excluded operations; food-safety control evidence status"
  update_trigger: "Material change in route, product form, supplier/origin mix, technology, energy system, packaging, storage, allocation, regulation, source evidence, UUID identity, or representative data period"
