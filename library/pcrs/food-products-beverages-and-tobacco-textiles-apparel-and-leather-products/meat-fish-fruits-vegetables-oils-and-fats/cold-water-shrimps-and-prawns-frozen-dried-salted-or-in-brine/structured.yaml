    - id: dq_route_separation
      applies_to: "Preservation"
      requirement: "Keep route, technology, energy, material, yield, and control records separate; do not average frozen, dried, salted, and brined production."
      evidence: "Batch route and equipment records"
    - id: dq_representativeness
