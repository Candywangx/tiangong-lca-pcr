allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Multi-output preparation and preservation"
    rule: "First subdivide metered processes or use a physically causal assignment so separately measured product lines and routes receive their own inputs and emissions."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residues
    applies_to: "Heads, shells, undersized shrimp, and other recovered materials"
    rule: "Classify each output by actual disposition. Waste receives its treatment burden and no avoided-product credit inside the foreground inventory; a marketable co-product receives an explicit allocation after subdivision is exhausted."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_fallback
    applies_to: "Unavoidable joint inputs and emissions"
    rule: "Prefer a documented physical relationship such as wet mass, dry matter, or another causal parameter. If no defensible physical relation exists, use economic allocation with contemporaneous prices and disclose shares, price period, sensitivity, and excluded flows."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_and_preparation
      process_id: "receive_prepare"
      flow_role: "Lot identity, received/prepared mass, water, ice, energy, residues, wastewater"
      record_type: "Weigh tickets, meters, invoices, batch and sanitation records"
      raw_fields: "lot_id; species; origin; raw_or_cooked_state; product_form; receipt_temperature; received_mass; prepared_mass; water_mass; ice_mass; electricity; thermal_energy; residue_mass_by_destination; wastewater_quantity"
      collection_method: "Calibrated scales and meters; reconcile purchases and batch logs"
      unit: "kg; m3; kWh; MJ; degC"
      frequency: "Every lot for mass and identity; meter/invoice interval allocated to lots"
      temporal_coverage: "Representative operating period, normally 12 months, with seasonality disclosed"
      site_scope: "All foreground lines and utilities serving the product"
      aggregation_rule: "Sum by process and route, allocate shared utilities by measured driver, normalize to prepared output"
      quality_evidence: "Calibration, invoices, lot traceability, meter coverage, mass-balance closure"
    - protocol_id: cp_preservation_route
      process_id: "preserve_route"
      flow_role: "Route materials, energy, controls, output, losses, wastewater, refrigerant"
      record_type: "Batch recipes, control logs, meters, scales, maintenance and discharge records"
      raw_fields: "route; input_mass; output_mass; water; ice; salt; brine_ingredients; electricity; fuel_or_heat; time_temperature_or_drying_endpoint; glaze_mass; spent_brine; wastewater; solids; refrigerant_species; refrigerant_recharge"
      collection_method: "Record actual route per lot; meter or calculate from documented equipment runtime; reconcile material and refrigerant balances"
      unit: "kg; m3; kWh; MJ; degC; h"
      frequency: "Every lot for route and mass; continuous or batch controls; annual refrigerant reconciliation"
      temporal_coverage: "Representative operating period, normally 12 months, stratified by route"
      site_scope: "Each route and technology line; no cross-route averaging"
      aggregation_rule: "Aggregate within one declared route only; normalize to preserved output"
      quality_evidence: "Route logs, calibrated controls, recipes, invoices, maintenance logs, release records"
    - protocol_id: cp_packaging_and_storage
      process_id: "pack_store"
      flow_role: "Net mass, glaze/free liquid, packaging, energy, duration, rejects, refrigerant"
      record_type: "Pack weights, BOM, meters, warehouse and maintenance logs"
      raw_fields: "lot_id; gross_mass; packaging_mass; glaze_or_free_liquid_mass; net_product_mass; packaging_by_material; electricity; storage_temperature; storage_duration; rejects; refrigerant_species; refrigerant_recharge"
      collection_method: "Determine net mass by documented deglazing or draining method; reconcile packaging and warehouse energy"
      unit: "kg; kWh; degC; day"
      frequency: "Every lot for net mass and BOM; continuous temperature; invoice/meter interval for energy"
      temporal_coverage: "Representative operating period, normally 12 months"
      site_scope: "All packaging lines and on-site storage used before release"
      aggregation_rule: "Normalize packaging and rejects to net product; allocate storage energy and leakage by load and duration"
      quality_evidence: "Scale calibration, BOM, deglazing/draining method, temperature logs, meter coverage, maintenance records"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "Reference product"
      rule: "net product mass = gross packed mass - packaging mass - glaze mass - free brine/draining liquid mass"
      inputs:
        - gross_mass
        - packaging_mass
        - glaze_or_free_liquid_mass
      output: "net_product_mass"
      source_ids:
        - codex-cxs-92-1981
    - id: calc_process_yield
      applies_to: "receive_prepare; preserve_route"
      rule: "yield = measured product output / measured product input; report separately by route and product form"
      inputs:
