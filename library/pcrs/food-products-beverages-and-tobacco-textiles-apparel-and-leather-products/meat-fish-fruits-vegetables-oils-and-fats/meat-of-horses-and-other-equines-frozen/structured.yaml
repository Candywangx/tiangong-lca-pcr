validation_rules:
  - rule_id: val_identity
    applies_to: "reference_flow"
    rule: "The sole reference flow UUID shall be b1d61fc0-90f2-4ef0-959b-b62596caca1a, public state 100, version 01.01.000, Product, exact CPC 21138, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids:
      - un-cpc-3-0
  - rule_id: val_reference_mass
    applies_to: "reference_quantity"
    rule: "The quantitative reference shall equal exactly 1 kg net conforming frozen product, and every packaging-component mass shall be excluded from that net mass."
    source_ids:
      - un-cpc-3-0
      - eu-recommendation-2021-2279-pef
  - rule_id: val_scope_state
    applies_to: "product_scope"
    rule: "Dataset metadata shall identify frozen equine meat and shall not present fresh or chilled meat or edible offal as the reference product."
    source_ids:
      - un-cpc-3-0
  - rule_id: val_process_coverage
    applies_to: "process_map"
    rule: "All six required processes shall contain records; on-site wastewater treatment shall be present when its inclusion condition is met and explicitly marked not applicable with evidence otherwise."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: val_atomic_inventory
    applies_to: "process_inventory"
    rule: "Every inventory card shall contain one named atomic exchange; no utility, refrigerant, chemical, packaging, waste, or emission selector may replace a flow identity."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: val_uuid_integrity
    applies_to: "inventory_flow_identity"
    rule: "Only the verified reference UUID may be populated from the supplied evidence; every non-reference UUID remains blank until hybrid discovery and public state-100 direct read independently confirm exact semantics, type, property, unit group, and unit, with unresolved row metadata updated together."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: val_value_mode
    applies_to: "inventory_amounts"
    rule: "The reference output alone uses fixed_value; measured records use foreground_record, derived balances use calculated_value, and no author-estimated range or default amount is permitted."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: val_card_completeness
    applies_to: "process_inventory"
    rule: "Every card shall have a non-empty description, selected flow, property and unit, amount rule, controlled value mode, specificity, basis, basis kind, evidence kind, collection protocol, and source ids."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: val_mass_balance
    applies_to: "foreground_mass_flows"
    rule: "Reception, slaughter, cutting, freezing, packaging, and wastewater volume or mass balances shall be reconciled and residuals explained without inserting a default yield."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: val_stage_energy
    applies_to: "energy_inventory"
    rule: "Electricity, purchased steam, purchased hot water, natural gas, diesel, and LPG shall remain separate by stage, with shared-meter allocation drivers documented."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: val_refrigerants
    applies_to: "refrigeration_inventory"
    rule: "Make-up and air emission shall be separately balanced for each named refrigerant at freezing and frozen storage; any additional site-used refrigerant requires its own atomic input and emission records before release."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: val_wastewater
    applies_to: "wastewater_inventory"
    rule: "Each originating wastewater stream, treated wastewater, sludge, screenings, and each water emission shall be separately reconciled to flow and analytical records with destination disclosed."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: val_allocation
    applies_to: "allocation"
    rule: "Every joint-output burden decision shall follow the declared hierarchy, disclose data and period, preserve waste status evidence, and reconcile allocated totals."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: val_sources
    applies_to: "evidence"
    rule: "Method claims shall cite only the three declared sources; foreground quantities shall trace to facility records rather than a source-derived default."
    source_ids:
      - un-cpc-3-0
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: val_bilingual_alignment
    applies_to: "localized_markdown"
    rule: "English and Chinese files shall preserve identical ordered process_id, row_id, direction, flow_type, UUID, controlled amount fields, collection protocol, and source-id sequences."
    source_ids:
