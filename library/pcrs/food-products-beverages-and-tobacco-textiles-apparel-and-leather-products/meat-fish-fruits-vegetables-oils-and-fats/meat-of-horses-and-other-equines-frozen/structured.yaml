allocation_rules:
  - rule_id: alloc_subdivision_first
    applies_to: "separable_processes"
    rule: "Avoid allocation first by subdividing metered operations and directly assigning stage utilities, packaging, chemicals, wastes, and emissions to the process output that causes them."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: alloc_product_waste_status
    applies_to: "all_non_reference_outputs"
    rule: "Classify every blood, hide, organ, fat, bone, trimming, condemned-material, digestive-content, sludge, screening, and packaging output as a product, co-product, or waste from documented legal, technical, and destination evidence; do not infer saleable status."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: alloc_physical_relation
    applies_to: "joint_products"
    rule: "When subdivision cannot avoid burden sharing and a causal physical relation can be demonstrated, allocate the residual burden with that documented physical relation and report the driver values."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: alloc_economic_fallback
    applies_to: "joint_products"
    rule: "When no defensible physical relation exists, use a documented economic relation for the same representative period and disclose prices, currency, geography, period, and sensitivity; this PCR supplies no default shares."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: alloc_waste_no_credit
    applies_to: "waste_outputs"
    rule: "Assign no co-product credit to a waste output unless the foreground record demonstrates recovered product status and a receiving product use; preserve treatment burdens and destination records otherwise."
    source_ids:
      - ec-jrc-sa-bref-2024
      - eu-recommendation-2021-2279-pef
  - rule_id: alloc_reference_consistency
    applies_to: "reference_product"
    rule: "Normalize only after applying one consistently documented allocation method across the reporting period, and reconcile allocated burdens to the unallocated foreground total."
    source_ids:
      - eu-recommendation-2021-2279-pef
