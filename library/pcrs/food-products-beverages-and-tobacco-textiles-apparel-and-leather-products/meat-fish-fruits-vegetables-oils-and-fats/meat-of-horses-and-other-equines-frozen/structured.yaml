  calculation_rules:
    - id: calc_receiving_mass_balance
      applies_to: "live equine receiving"
      rule: "accepted live mass = received live mass - dead carcass mass - documented reception mass adjustment; retain lot-level reconciliation"
      inputs:
        - "received live mass"
        - "dead carcass mass"
        - "documented adjustment"
      output: "accepted live equine animal mass"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-recommendation-2021-2279-pef
    - id: calc_slaughter_mass_balance
      applies_to: "slaughter outputs"
      rule: "reconcile accepted live mass to carcass, blood, hide, organ, digestive-content, condemned-material, wastewater-solids, and documented process-loss records without assigning a default yield"
      inputs:
        - "accepted live mass"
        - "every weighed slaughter output"
        - "documented stock change"
      output: "slaughter mass-balance residual"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-recommendation-2021-2279-pef
    - id: calc_cutting_mass_balance
      applies_to: "dressing and cutting outputs"
      rule: "reconcile carcass input to unfrozen meat, fat, bone, trimming, condemned-meat, inedible-tissue, and stock-change records without assigning a default yield"
      inputs:
        - "carcass mass"
        - "every weighed cutting output"
        - "documented stock change"
      output: "cutting mass-balance residual"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-recommendation-2021-2279-pef
    - id: calc_stage_utility_normalization
      applies_to: "stage utilities"
      rule: "stage quantity per basis = validated stage meter, invoice, or stock quantity divided by the matching process output or reference-product mass"
      inputs:
        - "validated stage quantity"
        - "matching denominator mass"
      output: "normalized atomic utility quantity"
      source_ids:
        - eu-recommendation-2021-2279-pef
    - id: calc_refrigerant_loss
      applies_to: "each refrigerant circuit"
      rule: "refrigerant loss = opening stock + documented additions - closing stock - documented recovered or transferred mass; calculate separately for each named refrigerant and stage"
      inputs:
        - "opening stock"
        - additions
        - "closing stock"
        - "recovered mass"
        - "transferred mass"
      output: "named refrigerant emission mass"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-recommendation-2021-2279-pef
    - id: calc_packaging_material_balance
      applies_to: "each packaging material"
      rule: "packaging consumed = issued mass - returned unused mass - closing work-in-process stock; reusable packaging allocation uses recorded cycles with the method disclosed"
      inputs:
        - "issued mass"
        - "returned mass"
        - "stock change"
        - "recorded reuse cycles"
      output: "material-specific packaging input per reference product"
      source_ids:
        - eu-recommendation-2021-2279-pef
    - id: calc_combustion_emission
      applies_to: "each stage combustion emission"
      rule: "emission mass = stage fuel quantity multiplied by the disclosed site-measurement or factor basis; calculate each named air emission separately and do not assign a PCR default factor"
      inputs:
        - "stage fuel quantity"
        - "disclosed measurement or factor"
        - "oxidation and unit-conversion records"
      output: "single air-emission mass"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-recommendation-2021-2279-pef
    - id: calc_wastewater_flow_balance
      applies_to: "on-site wastewater treatment"
      rule: "treated volume balance = sum of separately recorded inlet wastewater volumes plus treatment water - treated wastewater volume - documented water retained in sludge - documented evaporation"
      inputs:
        - "each inlet volume"
        - "treatment water"
        - "effluent volume"
        - "sludge water"
        - "evaporation record"
      output: "wastewater-treatment volume-balance residual"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-recommendation-2021-2279-pef
    - id: calc_effluent_pollutant_load
      applies_to: "each water emission"
      rule: "discharged mass = time-matched final-effluent volume multiplied by validated final-effluent concentration with unit conversion; calculate each analyte separately"
      inputs:
        - "final-effluent volume"
        - "analyte concentration"
        - "sample time"
        - "unit conversion"
      output: "single water-emission mass"
      source_ids:
        - ec-jrc-sa-bref-2024
        - eu-recommendation-2021-2279-pef
    - id: calc_reference_product_mass
      applies_to: "reference product"
      rule: "net reference mass = gross released packaged lot mass - all packaging-component mass; normalize the foreground inventory to exactly 1 kg net conforming frozen product"
      inputs:
        - "gross released mass"
        - "each packaging-component mass"
        - "release status"
      output: "1 kg net reference product"
      source_ids:
        - un-cpc-3-0
        - eu-recommendation-2021-2279-pef
  data_quality_requirements:
    - id: dq_technological
      applies_to: "all foreground stages"
      requirement: "Represent the actual slaughter, cutting, freezing, packaging, sanitation, and wastewater technologies used during the declared reporting period."
      evidence: "equipment list; process diagram; operating log"
    - id: dq_temporal
      applies_to: "all collected records"
      requirement: "Use one declared reporting period that covers all in-scope operations and disclose shutdowns, atypical lots, missing intervals, and substitutions."
      evidence: "dated meter logs; production calendar; gap register"
    - id: dq_geographical
      applies_to: "facility and utilities"
      requirement: "Declare facility location, electricity supply geography, water source, fuel supply basis, wastewater destination, and co-product destination."
      evidence: "site metadata; invoices; permits; dispatch records"
    - id: dq_completeness
      applies_to: "all atomic exchanges"
      requirement: "Collect every known material, utility, product, co-product, waste, and air, water, or soil emission; explain any verified zero and do not hide a flow through aggregation."
      evidence: "flow register; completeness reconciliation; zero-evidence record"
    - id: dq_mass_balance
      applies_to: "animal, carcass, meat, co-product, and waste masses"
      requirement: "Maintain lot or reporting-period mass balances with gross, tare, net, stock-change, moisture, and destination records sufficient to explain residuals."
      evidence: "weigh tickets; stock records; balance worksheet"
    - id: dq_energy
      applies_to: "electricity, steam, hot water, natural gas, diesel, and LPG"
      requirement: "Keep each carrier separate by stage and reconcile meters, invoices, stock movements, allocation drivers, and unit conversions."
      evidence: "meter logs; invoices; tank records; allocation worksheet"
    - id: dq_refrigerant
      applies_to: "each named refrigerant"
      requirement: "Keep make-up and emission balances separate by refrigerant and by freezing or frozen-storage stage; disclose maintenance, recovery, and data gaps."
      evidence: "service logs; cylinder records; inventory balance"
    - id: dq_wastewater
