allocation_rules:
  - rule_id: alloc_avoid
    applies_to: "Shared processes and multiple outputs"
    rule: "First avoid allocation by sub-metering, subdividing the process, or keeping vegetable identities, product grades, and drying routes in separate unit processes."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_physical
    applies_to: "Unavoidable joint production with a defensible physical relationship"
    rule: "If subdivision or system expansion cannot be applied, allocate according to the physical relationship that reflects how inputs and burdens change with the outputs, such as dry-solids mass or another documented causal parameter; do not select a basis only because data are convenient."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_other_relationship
    applies_to: "Unavoidable joint production without a defensible physical relationship"
    rule: "If no physical relationship can be established, use another documented relationship, such as economic value, with contemporaneous prices, reference period, calculation, and sensitivity disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_residues
    applies_to: "Rejects, by-products, recovered material, and wastes"
    rule: "Classify each output consistently with its actual destination. Do not assign zero burden or a credit merely from its name; document any burden split, substitution, treatment, and avoided-product assumption."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_raw_material
      process_id: "raw_preparation"
      flow_role: "Vegetable receipt, transfer, rejects, and identity"
      record_type: "Lot receipt, weighbridge, scale, moisture test, and disposition records"
      raw_fields: "vegetable identity; origin; received form; received mass; incoming moisture value; moisture basis; rejected mass; prepared transfer mass; dates; lot id"
      collection_method: "Reconcile calibrated mass records and representative moisture tests to each production lot"
      unit: "kg; % or kg water/kg material"
      frequency: "Each lot, with moisture sampling appropriate to within-lot variability"
      temporal_coverage: "Representative production period, normally at least 12 consecutive months or a justified shorter campaign"
      site_scope: "Each facility and product identity"
      aggregation_rule: "Sum masses by lot; calculate mass-weighted moisture only among records with the same basis; normalize to prepared output"
      quality_evidence: "Calibration records; sampling plan; laboratory method; lot reconciliation; origin and identity records"
    - protocol_id: cp_preparation_inputs
      process_id: "raw_preparation"
      flow_role: "Water, pretreatment inputs, and wastewater"
      record_type: "Meter, batch sheet, recipe, purchasing, and discharge records"
      raw_fields: "water make-up; recirculation; discharge; each aid identity and mass; operating time; treated mass; wastewater destination"
      collection_method: "Prefer dedicated meters and verified batch issues; document shared-meter allocation"
      unit: "m3; kg; h"
      frequency: "Each lot or meter interval linked to production"
      temporal_coverage: "Same period as represented production"
      site_scope: "Each preparation line and facility"
      aggregation_rule: "Subtract documented internal recirculation only once; aggregate each material separately and normalize to prepared output"
      quality_evidence: "Meter checks; batch sheets; formulation approval; invoices; discharge records"
    - protocol_id: cp_drying_route
      process_id: "declared_drying"
      flow_role: "Route identity, feed/output, moisture, energy, rejects, and direct emissions"
      record_type: "Dryer batch, control-system, meter, fuel, laboratory, and maintenance records"
      raw_fields: "route; equipment; feed mass and moisture basis; output mass and moisture basis; electricity; purchased heat; fuel by carrier; direct-contact status; time; temperature/pressure as relevant; rejects; emission measurement or factor reference"
      collection_method: "Use calibrated meters and representative moisture sampling; retain route configuration and factor provenance"
      unit: "kg; % or kg water/kg material; kWh; MJ; fuel unit; h; process-condition unit"
      frequency: "Each lot or meter interval linked to one route"
      temporal_coverage: "Route-representative production period, normally at least 12 consecutive months or a justified seasonal campaign"
      site_scope: "Each dryer and facility; never pool incompatible technologies without separate datasets"
      aggregation_rule: "Reconcile feed dry solids and output; aggregate each carrier separately; normalize to measured dryer output at declared moisture"
      quality_evidence: "Meter calibration; lab method; control-system export; fuel invoices; route diagram; maintenance and factor records"
    - protocol_id: cp_finishing_packaging
      process_id: "finishing_packaging"
      flow_role: "Net product, packaging, electricity, and finishing wastes"
      record_type: "Packing, scale, bill-of-material, meter, quality-release, and waste records"
      raw_fields: "product identity; route link; input and net output mass; final moisture and basis; form; package format; each packaging mass; electricity; rejects; scrap destination; lot id"
      collection_method: "Reconcile calibrated net-content and packaging records to released lots"
      unit: "kg; % or kg water/kg material; kWh"
      frequency: "Each released lot or meter interval"
      temporal_coverage: "Same period as represented production"
      site_scope: "Each finishing or packaging line and facility"
      aggregation_rule: "Sum released net product excluding packaging; keep packaging materials and waste destinations separate; normalize to 1 kg net product"
      quality_evidence: "Scale calibration; bill of materials; quality certificate; packaging specification; meter and waste records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground flows"
      rule: "normalized flow = period flow / net kg of conforming dried product at the declared finished-product moisture"
      inputs:
        - "period flow"
        - "released net product mass"
        - "final moisture record"
      output: "flow amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_dry_solids_balance
      applies_to: "Preparation and drying"
      rule: "dry solids = material mass × (1 − moisture fraction on wet basis); when a dry-basis moisture is reported, convert it to wet basis before balancing and retain the original result"
      inputs:
        - "input and output masses"
        - "moisture values"
        - "moisture bases"
        - "rejects and samples"
      output: "reconciled dry-solids balance and unexplained difference"
      source_ids: []
    - id: calc_removed_water
      applies_to: "Declared drying route"
      rule: "removed water = feed water − product water − measured water in removed material; report unmeasured condensate or exhaust moisture as the balance term, not as freshwater consumption"
      inputs:
        - "feed and output mass/moisture"
        - "reject mass/moisture"
      output: "kg water removed per kg dryer output"
      source_ids: []
    - id: calc_route_mix
      applies_to: "Higher-level production or market mix only"
      rule: "combine separately normalized route datasets using documented net-product mass shares summing to 1 for the same product specification and reference period"
      inputs:
        - "route-specific datasets"
        - "production shares"
        - "common qualifier set"
      output: "qualified mixed-production dataset"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_on_site_emissions
      applies_to: "On-site fuel combustion"
      rule: "calculate each emission from measured fuel and a disclosed applicable factor, or use direct measurement; do not add the same combustion emission when it is already included in a purchased-energy dataset"
      inputs:
        - "fuel consumption"
        - "factor or measurement"
        - "energy dataset boundary"
      output: "substance-specific elementary emission per reference flow"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_route
      applies_to: "All represented production"
      requirement: "Trace each record to vegetable identity, product form, pretreatment, one drying route/technology, facility, lot or meter interval, and reference period."
      evidence: "Lot genealogy, route diagram, batch records, and dataset metadata"
    - id: dq_mass_moisture
      applies_to: "Mass and moisture data"
      requirement: "Use calibrated mass measurements and a documented sampling and analytical method; state moisture basis and sampling coverage, and reconcile dry solids across the foreground system."
      evidence: "Calibration certificates, sampling plan, lab records, and mass-balance worksheet"
    - id: dq_temporal_geographic
      applies_to: "Foreground and linked data"
      requirement: "Use data representative of the declared geography, technology, and reference period; explain seasonal campaigns, shutdowns, shared facilities, proxies, and any period shorter than 12 consecutive months."
      evidence: "Production calendar, meter coverage, supplier metadata, proxy justification, and sensitivity record"
    - id: dq_completeness
      applies_to: "Inventory completeness"
      requirement: "Check all material and energy inputs, water, packaging, saleable output, rejects, wastewater, waste destinations, and direct emissions relevant to the declared configuration; document exclusions and their expected significance."
      evidence: "Completeness checklist, process flow diagram, purchase-to-meter reconciliation, and exclusion log"
    - id: dq_source_quality
      applies_to: "Secondary datasets and factors"
      requirement: "Record dataset or factor provider, version, geography, technology, reference year, access date, boundary, and substitution rationale; replace a proxy when representative reviewed data become available."
      evidence: "Source register and replacement log"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "The output shall use Dried Vegetables dc43358a-8159-496d-b2e9-a30c8fb3e38a, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, normalized to exactly 1 kg net product excluding packaging."
    source_ids: []
  - rule_id: val_required_qualifiers
    applies_to: "Product and dataset metadata"
    rule: "Reject conformance when vegetable identity, product form, incoming and final moisture values and bases, pretreatment, drying route/technology, packaging state, or net-mass basis is missing."
    source_ids:
      - codex-cxc-5-1971
  - rule_id: val_route_exclusivity
    applies_to: "Process map"
    rule: "Confirm that the unit-process inventory represents one declared route. A higher-level mix is acceptable only when route datasets remain separate and documented shares sum to 1 for a common specification and period."
    source_ids:
      - codex-cxc-5-1971
      - eu-pef-2021-2279
  - rule_id: val_mass_balance
    applies_to: "Foreground inventory"
    rule: "Confirm that input vegetable mass and dry solids reconcile with net product, removed water, rejects, samples, and other losses; report the unexplained residual and its investigation."
    source_ids: []
  - rule_id: val_inventory_completeness
    applies_to: "Foreground and linked inventory"
    rule: "Confirm coverage of applicable water, pretreatment materials, electricity, heat and fuels by carrier, packaging, rejects, wastewater, direct emissions, upstream links, and waste destinations without double counting."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_codex_controls
    applies_to: "Processing and storage records"
    rule: "Confirm that the dataset declares applicable sorting, washing/preparation, drying-medium contact, finished-product moisture control, packaging protection, and storage humidity controls; absence from the physical process must be explicit rather than silently assumed."
    source_ids:
      - codex-cxc-5-1971
  - rule_id: val_data_quality
    applies_to: "Dataset evidence"
    rule: "Confirm temporal, geographic, technological, and measurement representativeness, record calibration and sampling evidence, disclose proxies and exclusions, and identify the trigger for replacing any reasoned_estimate."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Route-specific factory-gate foreground dataset for the manufacture of an identified dried potato or other dried vegetable"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product carbon-footprint or LCA models requiring a qualified dried-vegetable manufacturing dataset; route-specific benchmarking when functional unit, vegetable identity, product form, moisture, pretreatment, technology, geography, period, and allocation are equivalent"
  excluded_use: "Unqualified substitution across vegetables, product forms, moisture specifications, pretreatments, or incompatible drying technologies; direct comparison of route mixes with different shares or periods; claims extending beyond the declared boundary without downstream stages"
  required_metadata: "Reference UUIDs and unit; vegetable identity; product form; feed and final moisture values and bases; pretreatment; drying route, technology, and medium contact; facility geography; reference period; bulk/packaging format; net-mass basis; yield; allocation; upstream datasets; exclusions and proxies"
  required_quality_disclosure: "Meter and lot coverage; calibration and moisture method; mass/dry-solids reconciliation; route share if a higher-level mix; data quality and proxy assessment; allocation basis and sensitivity; completeness and uncertainty; any reasoned_estimate and replacement trigger"
  update_trigger: "Replace the dataset when the vegetable or form changes materially, final moisture specification changes, pretreatment or drying technology changes, route share changes, packaging changes materially, facility or energy supply changes, the data age no longer represents production, or representative campaign/reviewed evidence becomes available for a provisional estimate"
