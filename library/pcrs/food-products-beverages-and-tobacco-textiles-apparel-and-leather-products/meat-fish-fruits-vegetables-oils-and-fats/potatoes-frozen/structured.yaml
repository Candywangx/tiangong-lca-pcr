allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "shared foreground operations"
    rule: "Avoid allocation where practicable by subdividing uncooked and cooked routes, freezing lines, package formats, and storage periods, and by directly metering their material and energy use."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rule_2
    applies_to: "potato residues and saleable secondary outputs"
    rule: "First classify each output as reference product, saleable co-product, recoverable material, or waste and maintain a reconciled mass balance. Do not assign zero burden to a saleable output without justification."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rule_3
    applies_to: "unavoidable shared burdens"
    rule: "Use a physical causal driver such as measured mass, equipment time, thermal load, or occupied mass-time when subdivision is not possible. Use economic allocation only when no defensible physical relation exists, and disclose prices, reference period, shares, and a sensitivity check."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rule_4
    applies_to: "recycling, recovery, and avoided products"
    rule: "Keep collection and treatment burdens within the declared boundary and apply any recycling or substitution credit only in the downstream model under one disclosed method; do not count both a recovered-material output and an avoided-product credit in the foreground dataset."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_mass_balance
      process_id: "receiving_preparation"
      flow_role: "raw potatoes, prepared transfer, and residues"
      record_type: "weighbridge, receiving, batch, transfer, reject, and waste records"
      raw_fields: "lot_id; received_mass; prepared_transfer_mass; reject_or_residue_mass; destination; inventory_change; timestamp"
      collection_method: "calibrated scales and reconciled production records"
      unit: "kg"
      frequency: "each lot or batch"
      temporal_coverage: "all represented production days"
      site_scope: "all included receiving and preparation lines"
      aggregation_rule: "sum attributable masses by route and divide by conforming reference-product output; reconcile inventory change"
      quality_evidence: "calibration records; lot traceability; signed mass-balance reconciliation"
    - protocol_id: cp_preparation_water
      process_id: "receiving_preparation"
      flow_role: "preparation water and wastewater"
      record_type: "meter, invoice, tank, and discharge records"
      raw_fields: "opening_reading; closing_reading; water_source; discharge_quantity; production_period; shared_use_driver"
      collection_method: "calibrated meter preferred; reconcile invoice or tank records when dedicated metering is absent"
      unit: "kg or m3 with documented conversion"
      frequency: "continuous or each production shift"
      temporal_coverage: "same period as represented production"
      site_scope: "all included preparation equipment and sanitation attributable to the product"
      aggregation_rule: "subtract non-production and non-attributable use, then normalize to conforming output"
      quality_evidence: "meter calibration; invoices; water-balance check; allocation record"
    - protocol_id: cp_preparation_energy
      process_id: "receiving_preparation"
      flow_role: "preparation electricity"
      record_type: "meter and equipment-runtime records"
      raw_fields: "meter_open; meter_close; runtime; rated_load_if_needed; production_period; shared_use_driver"
      collection_method: "dedicated meter preferred; otherwise reconciled facility meter with documented causal allocation"
      unit: "kWh"
      frequency: "continuous or each shift"
      temporal_coverage: "same period as represented production"
      site_scope: "all included preparation equipment"
      aggregation_rule: "sum measured use or calculate reconciled allocated use and normalize to conforming output"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_cooking_mass_balance
      process_id: "cooking_conditioning"
      flow_role: "prepared input and cooked transfer"
      record_type: "batch and scale records"
      raw_fields: "batch_id; route; prepared_input_mass; cooked_output_mass; drain_or_dewater_condition; timestamp"
      collection_method: "calibrated batch or line scales"
      unit: "kg"
      frequency: "each cooked batch"
      temporal_coverage: "all represented cooked-route production"
      site_scope: "all included boiling, steaming, cooling, and dewatering lines"
      aggregation_rule: "sum by boiled or steamed route and normalize to its conforming output"
      quality_evidence: "calibration; batch traceability; mass-balance check"
    - protocol_id: cp_cooking_utilities
      process_id: "cooking_conditioning"
      flow_role: "cooking water, wastewater, steam, fuel, and electricity"
      record_type: "meter, supplier, boiler, batch, and discharge records"
      raw_fields: "carrier; quantity; unit; meter_readings; batch_id; wastewater_quantity; conversion_factor"
      collection_method: "dedicated metering where available; otherwise documented engineering reconciliation"
      unit: "kg, kWh, MJ, or supplier unit"
      frequency: "each batch, shift, or meter period"
      temporal_coverage: "same period as represented cooked-route production"
      site_scope: "all included cooking, cooling, and attributable utility equipment"
      aggregation_rule: "aggregate by route, avoid steam/fuel double counting, convert with documented factors, and normalize to cooked-route output"
      quality_evidence: "meter calibration; supplier records; conversion worksheet; water and energy reconciliation"
    - protocol_id: cp_freezing_mass_balance
      process_id: "freezing_packaging"
      flow_role: "freezer input and frozen output"
      record_type: "transfer, freezer, and packing records"
      raw_fields: "route; input_mass; frozen_net_output_mass; rejected_mass; inventory_change; timestamp"
      collection_method: "calibrated line scales and packing records"
      unit: "kg"
      frequency: "each lot or shift"
      temporal_coverage: "all represented freezing production"
      site_scope: "all included freezing and packing lines"
      aggregation_rule: "reconcile input, output, loss, and inventory change by route and normalize to net reference product"
      quality_evidence: "calibration; lot traceability; mass-balance check"
    - protocol_id: cp_freezing_energy
      process_id: "freezing_packaging"
      flow_role: "freezing and packing electricity"
      record_type: "submeter, facility meter, runtime, and production records"
      raw_fields: "meter_open; meter_close; freezer_runtime; defrost_energy; packed_output_mass; shared_use_driver"
      collection_method: "dedicated submeter preferred; otherwise documented engineering or causal allocation"
      unit: "kWh"
      frequency: "continuous or each shift"
      temporal_coverage: "same period as represented freezing production"
      site_scope: "all included freezing, refrigeration-auxiliary, and packing equipment"
      aggregation_rule: "separate freezing from storage where possible and normalize attributable use to net packed output"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_packaging_records
      process_id: "freezing_packaging"
      flow_role: "packaging inputs and waste"
      record_type: "bill of materials, purchase, issue, return, and scrap records"
      raw_fields: "package_format; material; unit_mass; units_used; scrap_mass; returned_mass; packed_output_mass"
      collection_method: "item-count times verified unit mass, reconciled to material issues and scrap"
      unit: "kg"
      frequency: "each package-format lot or campaign"
      temporal_coverage: "same period as represented production"
      site_scope: "all included packaging formats and packing lines"
      aggregation_rule: "calculate net material input and scrap by material per kg net packed output"
      quality_evidence: "supplier specification; sample weighing; inventory reconciliation"
    - protocol_id: cp_freezing_refrigerant
      process_id: "freezing_packaging"
      flow_role: "freezing-system refrigerant loss"
      record_type: "service, purchase, recovery, charge, and equipment records"
      raw_fields: "refrigerant_species; opening_charge; additions; recovery; closing_charge; equipment_id; service_date"
      collection_method: "equipment-specific mass balance using verified service records"
      unit: "kg"
      frequency: "each service event and at least annually"
      temporal_coverage: "covers the represented production period"
      site_scope: "all freezing-system equipment serving the represented production"
      aggregation_rule: "calculate net loss and allocate using equipment service, runtime, or cooling-load driver"
      quality_evidence: "service certificates; cylinder weights; equipment log; calculation worksheet"
    - protocol_id: cp_storage_product_records
      process_id: "frozen_storage"
      flow_role: "stored product input, output, duration, and losses"
      record_type: "warehouse management, dispatch, write-off, and temperature records"
      raw_fields: "lot_id; mass_in; mass_out; entry_time; dispatch_time; write_off_mass; loss_reason; temperature_series"
      collection_method: "warehouse records reconciled to periodic physical inventory"
      unit: "kg and d"
      frequency: "each movement with daily monitoring"
      temporal_coverage: "complete declared factory-storage period"
      site_scope: "all frozen-storage rooms and lots serving the represented product"
      aggregation_rule: "calculate occupied mass-time and reconcile dispatch plus loss to receipts and inventory change"
      quality_evidence: "inventory reconciliation; lot traceability; temperature-monitoring completeness"
    - protocol_id: cp_storage_energy
      process_id: "frozen_storage"
      flow_role: "frozen-storage electricity"
      record_type: "submeter, facility meter, occupancy, and operating records"
      raw_fields: "meter_open; meter_close; occupied_mass_time; defrost_energy; shared_use_driver; period"
      collection_method: "dedicated submeter preferred; otherwise documented causal allocation based on storage service"
      unit: "kWh"
      frequency: "continuous or monthly meter period"
      temporal_coverage: "complete declared factory-storage period"
      site_scope: "all included cold rooms and attributable storage auxiliaries"
      aggregation_rule: "allocate attributable use to occupied mass-time and normalize to the declared reference-product duration"
      quality_evidence: "meter calibration; invoice reconciliation; occupancy record; allocation worksheet"
    - protocol_id: cp_storage_refrigerant
      process_id: "frozen_storage"
      flow_role: "storage-system refrigerant loss"
      record_type: "service, purchase, recovery, charge, and equipment records"
      raw_fields: "refrigerant_species; opening_charge; additions; recovery; closing_charge; equipment_id; service_date"
      collection_method: "equipment-specific mass balance using verified service records"
      unit: "kg"
      frequency: "each service event and at least annually"
      temporal_coverage: "covers the declared factory-storage period"
      site_scope: "all storage-system equipment serving the represented product"
      aggregation_rule: "calculate net loss and allocate by equipment service and occupied mass-time"
      quality_evidence: "service certificates; cylinder weights; equipment log; calculation worksheet"
  calculation_rules:
    - id: calculation_rule_1
      applies_to: "all inventory rows"
      rule: "Normalized amount = attributable quantity for the represented period / net conforming frozen potato output for the same period."
      inputs:
        - "attributable quantity"
        - "net conforming output"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calculation_rule_2
      applies_to: "preparation and cooking mass balances"
      rule: "Reconcile opening inventory + inputs = outputs + residues + wastewater-carried solids when quantified + closing inventory + documented unexplained difference; report the unexplained difference rather than forcing balance."
      inputs:
        - "measured masses"
        - "inventory changes"
        - "residue and loss records"
      output: "reconciled mass balance and unexplained difference"
      source_ids: []
    - id: calculation_rule_3
      applies_to: "mixed uncooked, boiled, or steamed production"
      rule: "Aggregate only after calculating route-specific inventories: combined amount = sum(route amount x conforming route output) / sum(conforming route output)."
      inputs:
        - "route-specific amount"
        - "route-specific conforming output"
      output: "production-weighted combined amount"
      source_ids:
        - un-cpc-3-0-21313
    - id: calculation_rule_4
      applies_to: "storage energy"
      rule: "Storage amount = attributable storage electricity / occupied net-product mass-time, multiplied by the declared reference-product storage duration."
      inputs:
        - electricity
        - "occupied mass-time"
        - "declared duration"
      output: "kWh per kg reference product for declared duration"
      source_ids:
        - codex-cxc-8-1976
    - id: calculation_rule_5
      applies_to: "refrigerant emissions"
      rule: "Refrigerant loss = opening charge + additions - recovered quantity - closing charge, adjusted for documented transfers; allocate only the equipment share serving the represented product."
      inputs:
        - "charge inventory"
        - additions
        - recovery
        - transfers
        - "allocation driver"
      output: "kg emitted refrigerant species per reference flow"
      source_ids: []
    - id: calculation_rule_6
      applies_to: "packaging"
      rule: "Packaging input by material = verified unit mass x units used + attributable line loss - reusable packaging returned within the same accounting treatment; normalize by net product mass."
      inputs:
        - "unit mass"
        - "item count"
        - loss
        - returns
        - "net product mass"
      output: "kg packaging material per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: data_quality_1
      applies_to: "product identity and scope"
      requirement: "Retain evidence for CPC 21313 scope, cut form, peel status, uncooked/boiled/steamed route, exclusion of mashed or fried products, package format, factory gate, and represented storage period."
      evidence: "product specification; label; batch recipe or route record; un-cpc-3-0-21313"
    - id: data_quality_2
      applies_to: "temporal representativeness"
      requirement: "Cover a representative operating period that includes normal production, sanitation, defrosting, start-up, shutdown, and storage conditions, or disclose exclusions and their expected influence."
      evidence: "production calendar; meter coverage; downtime and cleaning logs; eu-pef-2021-2279"
    - id: data_quality_3
      applies_to: "geographical and technological representativeness"
      requirement: "Identify facility geography, electricity and fuel supply, water source, preparation and cooking configuration, freezing technology, refrigerant species, package format, and storage system."
      evidence: "facility metadata; supplier records; equipment register; eu-pef-2021-2279"
    - id: data_quality_4
      applies_to: "completeness and reconciliation"
      requirement: "Reconcile product mass, water, energy, packaging, wastes, and refrigerants across the represented period; quantify missing coverage, allocation shares, inventory changes, and unexplained differences."
      evidence: "signed reconciliation; meter and invoice cross-check; completeness statement"
    - id: data_quality_5
      applies_to: "provisional ranges"
      requirement: "Treat every reasoned_estimate range only as a QA screen. Flag values outside the range for review, and replace the range with representative foreground or source-backed evidence before publication-critical use unless a reviewer explicitly accepts it."
      evidence: "review record; replacement source or approved foreground summary"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference flow and identity"
    rule: "Confirm the canonical PCR id, product-flow UUID, Mass UUID, Units of mass UUID, kg reference unit, 1 kg net reference amount, and all required qualifiers; reject mashed, fried, chipped, fat-precooked, or otherwise prepared products."
    source_ids:
      - un-cpc-3-0-21313
  - rule_id: validation_rule_2
    applies_to: "route and process coverage"
    rule: "Require preparation, freezing and packaging, and declared factory storage; require cooking-conditioning only for boiled or steamed product, and confirm that route-specific inventories or production-weighted aggregation are used."
    source_ids:
      - un-cpc-3-0-21313
      - codex-cxc-8-1976
  - rule_id: validation_rule_3
    applies_to: "mass balance"
    rule: "Check that raw-potato inputs, intermediate transfers, final output, residues, losses, wastewater-related mass where material, and inventory changes reconcile; report any unexplained difference and do not silently force closure."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "cold-chain inventory"
    rule: "Confirm that freezing and storage electricity or purchased cooling, declared storage duration, temperature records, defrosting where material, refrigerant species and losses, and frozen-product losses are included or explicitly justified as zero or unavailable."
    source_ids:
      - codex-cxc-8-1976
  - rule_id: validation_rule_5
    applies_to: "allocation and completeness"
    rule: "Confirm that shared burdens use subdivision, direct metering, or a disclosed causal driver; verify allocation shares sum to one and that no recycling or substitution benefit is double counted."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_rule_6
    applies_to: "evidence readiness"
    rule: "Report unresolved Tiangong inventory-flow UUIDs, missing collection coverage, and every retained reasoned_estimate; candidate guidance is inconclusive for publication until those issues are resolved or explicitly accepted through review."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Factory-gate foreground dataset for frozen potato production"
  downstream_use: "secondary_dataset; background_dataset after methodology review, identity resolution, and evidence-quality review"
  allowed_use: "Modelling frozen whole or cut potatoes that are uncooked or boiled/steamed in water, with declared route, package, factory storage, geography, technology, and reference period"
  excluded_use: "Frozen mashed potatoes, French fries, potato chips, fat-precooked or formulated potato products; downstream cold-chain, retail, consumer preparation, or end-of-life unless separately modelled"
  required_metadata: "canonical PCR id; product-flow UUID; CPC reference; product form; peel and cooking state; facility geography; reference period; technology; package format; net mass; storage duration and temperature-monitoring basis; allocation; upstream dataset identities"
  required_quality_disclosure: "foreground coverage; meter and mass-balance completeness; allocation shares; route aggregation; temporal, geographical, and technological representativeness; refrigerant method; exclusions; unresolved UUIDs; retained reasoned estimates and review status"
  update_trigger: "Material change in product scope, cooking route, preparation yield, freezing or storage technology, refrigerant, package format, allocation, facility energy or water supply, storage duration, upstream datasets, or representative foreground evidence"
data_sources:
  - id: "un-cpc-3-0-21313"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 Explanatory Notes, subclass 21313, pp. 81 and 83, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-11)"
    used_for: "Product-category inclusions and exclusions; distinction between uncooked/boiled/steamed frozen potatoes and otherwise prepared potatoes"
  - id: "codex-cxc-8-1976"
    type: "standard"
    reference: "Codex Alimentarius, CXC 8-1976, Code of Practice for the Processing and Handling of Quick Frozen Foods, last modified 2008, https://www.fao.org/fao-who-codexalimentarius/codex-texts/codes-of-practice/en/ (retrieved 2026-08-11)"
    used_for: "High-level quick-freezing, handling, storage, and cold-chain process and record scope; no product-specific quantitative range is taken from this source"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission, Commission Recommendation (EU) 2021/2279 on the use of the Environmental Footprint methods, Official Journal L 471, https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32021H2279 (retrieved 2026-08-11)"
    used_for: "Life-cycle inventory completeness, representative and verifiable data, allocation disclosure, dataset quality, and downstream-use controls"
