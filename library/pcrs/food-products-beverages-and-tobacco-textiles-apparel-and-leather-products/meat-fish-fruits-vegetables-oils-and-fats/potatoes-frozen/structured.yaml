system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground factory production"
      rule: "Include receiving and sorting, preparation, the declared conditional cooking route, cooling or dewatering when used, freezing, packaging, factory frozen storage, direct utilities, refrigerant losses, wastes, wastewater, and on-site treatment that occur before the declared gate."
      source_ids:
        - codex-cxc-8-1976
    - rule_id: system_boundary_rule_2
      applies_to: "upstream inputs"
      rule: "Link each purchased product or service input to a representative upstream dataset; do not omit upstream potato production, electricity, fuels, water supply, packaging production, refrigerant production, or external treatment merely because those processes are outside the foreground facility."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: system_boundary_rule_3
      applies_to: "conditional cooking"
      rule: "Include boiling or steaming and associated cooling or dewatering only when the reference product is sold in that state; the dataset must not mix uncooked and cooked routes without a documented production-weighted aggregation."
      source_ids:
        - un-cpc-3-0-21313
    - rule_id: system_boundary_rule_4
      applies_to: "downstream stages"
      rule: "Exclude outbound transport, distribution storage, retail, consumer preparation, and end-of-life from the default factory-gate dataset. If included for a declared study, model and disclose them as separate downstream stages."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: system_boundary_rule_5
      applies_to: "cold chain and losses"
      rule: "Include electricity or purchased cooling, refrigerant make-up or calculated leakage, temperature monitoring, product losses, and waste handling attributable to freezing and the declared factory storage period."
      source_ids:
        - codex-cxc-8-1976
boundary_abstraction:
  declared_starting_condition: "Fresh potatoes received at the processing facility, with received mass, origin or supplier group, storage condition before processing, and quality or reject status declared"
