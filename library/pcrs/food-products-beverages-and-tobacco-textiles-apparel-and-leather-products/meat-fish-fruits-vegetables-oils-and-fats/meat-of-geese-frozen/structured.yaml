allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "multi-output foreground processes"
    rule: "First avoid allocation through process subdivision and direct assignment of utilities, chemicals, packaging, wastes, and emissions to the operation that causes them."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_output_status
    applies_to: "blood, feathers, down, head, feet, organs, fat, bones, and trimmings"
    rule: "Determine the product, co-product, or waste status of each segregated output from its documented quality, destination, and contractual disposition; do not infer a useful co-product solely from its physical presence."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: allocation_foie_gras_separation
    applies_to: "goose liver and foie gras outputs"
    rule: "Treat goose liver or foie gras as a separate non-reference output with its own measured mass and destination; do not include its mass in frozen goose meat or hide its co-product treatment inside the reference flow."
    source_ids:
      - unsd-cpc-21143
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relation
    applies_to: "unavoidable co-product allocation"
    rule: "Where subdivision cannot avoid allocation, use a documented underlying physical relationship that reflects how inputs and outputs change; do not select mass merely because mass data are available."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_relation
    applies_to: "co-products without a defensible physical relation"
    rule: "Use an economic relationship only when a defensible physical relationship cannot be established, and retain the price source, averaging period, currency basis, market, and sensitivity disclosure."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_treatment
    applies_to: "waste outputs and treatment"
    rule: "Assign collection, handling, and treatment burdens to each documented waste destination once; apply no avoided-burden credit unless the selected study method explicitly requires it and the assumption is disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_services
    applies_to: "shared water, energy, refrigeration, sanitation, and wastewater services"
    rule: "Prefer submetering or operational logs; otherwise use a documented causal driver such as operating time, cleaned area, thermal load, wastewater volume, or product mass only where that driver represents consumption."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: allocation_disclosure
    applies_to: "reported dataset"
    rule: "Report the allocation hierarchy, equations, drivers, values, co-product destinations, unresolved data gaps, and sensitivity results so that no measured input or output is counted twice or omitted."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_live_goose_receipt
      process_id: "live_goose_receipt"
      flow_role: "live geese, accepted birds, arrival losses, rejected birds, and holding balance"
      record_type: "supplier, receipt, weighbridge, holding, and mortality records"
      raw_fields: "supplier; origin; lot; arrival time; bird count; gross mass; tare; accepted mass; rejected mass; mortality; opening and closing holding inventory"
      collection_method: "weigh each lot with calibrated equipment and reconcile acceptance and holding records"
      unit: "kg; bird"
      frequency: "each received lot"
      temporal_coverage: "complete reporting period including opening and closing holding inventory"
      site_scope: "all receipt and holding areas serving the represented facility"
      aggregation_rule: "sum by lot, then normalize once to net released reference mass"
      quality_evidence: "calibration records, signed receipts, rejection records, mortality logs, and inventory reconciliation"
    - protocol_id: cp_slaughter_byproduct_balance
      process_id: "slaughter_defeathering_evisceration"
      flow_role: "accepted geese, dressed carcasses, blood, feathers, down, head, feet, organs, fat, stomach contents, intestinal contents, and condemned outputs"
      record_type: "batch production, inspection, weighing, and destination records"
      raw_fields: "lot; accepted live mass; bird count; carcass mass; output identity; output mass; quality status; destination; opening and closing inventory; purge or moisture change"
      collection_method: "weigh segregated outputs and close one lot or period mass balance without a fabricated balancing item"
      unit: "kg; bird"
      frequency: "each slaughter lot or production shift"
      temporal_coverage: "complete reporting period"
      site_scope: "all slaughter, bleeding, scalding, defeathering, evisceration, inspection, and initial dressing lines in scope"
      aggregation_rule: "sum measured masses by output identity and retain every documented destination before normalization"
      quality_evidence: "scale calibration, batch sheets, veterinary or quality disposition, destination tickets, and signed mass balance"
    - protocol_id: cp_cutting_mass_balance
      process_id: "carcass_dressing_cutting"
