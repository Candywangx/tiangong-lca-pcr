      record_type: "meter, invoice, withdrawal, and submeter records"
      raw_fields: "source identity; meter identity; opening and closing reading; volume; process coverage; reading time; allocation driver; calibration status"
      collection_method: "read each source meter and submeter, prevent supply-withdrawal duplication, and assign shared volume with a documented causal driver"
      unit: "m3"
      frequency: "at least each reporting interval and whenever process assignment changes"
      temporal_coverage: "complete reporting period with opening and closing readings"
      site_scope: "all meters and withdrawals serving the foreground boundary"
