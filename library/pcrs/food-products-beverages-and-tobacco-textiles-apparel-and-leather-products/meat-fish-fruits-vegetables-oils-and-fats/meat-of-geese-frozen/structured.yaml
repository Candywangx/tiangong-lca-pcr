      quality_evidence: "calibrated scales and sensors, batch logs, alarm logs, and inventory reconciliation"
    - protocol_id: cp_packaging_release
      process_id: "packaging_frozen_storage"
      flow_role: "frozen goose meat transfer, each packaging component, reference output, and packaged rejects"
      record_type: "packing order, material issue, tare, release, dispatch, and frozen-store records"
      raw_fields: "lot; product form; bone and skin state; input mass; package component identity; component mass; package count; tare; net released mass; reject mass; storage time; release status"
      collection_method: "measure net product after tare deduction, record every component separately, and reconcile packing and frozen-store inventory"
      unit: "kg; package; hour"
      frequency: "each packing and release lot"
      temporal_coverage: "complete reporting period including opening and closing frozen inventory"
      site_scope: "all final packing, bulk dispatch, frozen storage, and release points in scope"
      aggregation_rule: "sum component and product masses separately; normalize reference output to exactly 1 kg net goose meat"
      quality_evidence: "material issue records, packaging specifications, scale calibration, release certificates, dispatch records, and stock reconciliation"
    - protocol_id: cp_water_records
      process_id: "all_foreground_processes"
