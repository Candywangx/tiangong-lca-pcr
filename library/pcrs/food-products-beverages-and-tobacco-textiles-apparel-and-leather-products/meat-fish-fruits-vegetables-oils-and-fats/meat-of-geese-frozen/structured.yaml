      flow_role: "grid electricity, purchased steam, purchased hot water, natural gas, diesel, and LPG by process"
      record_type: "meter, invoice, delivery, tank, boiler, and operational records"
      raw_fields: "carrier identity; supplier; meter or tank identity; measured quantity; unit; supply conditions; heating value; opening and closing inventory; process coverage; allocation driver"
      collection_method: "collect each carrier separately, reconcile purchases and inventory, and calculate energy only with retained supplier data or measured conditions"
      unit: "kWh for electricity; MJ for steam, hot water, and fuels"
      frequency: "each meter interval, delivery, or production shift as available"
      temporal_coverage: "complete reporting period with opening and closing inventory"
      site_scope: "all utility points serving each foreground process"
      aggregation_rule: "sum each carrier separately by process and use a documented causal allocation for shared meters"
      quality_evidence: "calibration, invoices, delivery notes, supplier heating values, meter logs, and allocation workbook"
    - protocol_id: cp_refrigerant_records
      process_id: "cold_chain_processes"
      flow_role: "R-717, HFC-134a, and R-404A make-up plus ammonia, HFC-134a, HFC-125, and HFC-143a emissions"
      record_type: "refrigerant purchase, service, charge, recovery, leak, and inventory records"
      raw_fields: "equipment; process served; refrigerant product; chemical composition; opening charge; additions; removals; recovered mass; closing charge; leak event; service date; technician"
      collection_method: "close an equipment-level mass balance, retain actual blend composition, and assign make-up and emitted species separately to the cold process served"
      unit: "kg"
      frequency: "each service or leak event and at reporting-period boundaries"
      temporal_coverage: "complete reporting period with opening and closing charge"
      site_scope: "all refrigeration equipment serving pre-chilling, freezing, and frozen storage"
      aggregation_rule: "sum by refrigerant product, emitted chemical species, equipment, and process without double counting recovered material"
      quality_evidence: "purchase invoices, service logs, leak tests, recovery tickets, composition specification, and signed balance"
    - protocol_id: cp_cleaning_chemical_records
      process_id: "sanitation_wastewater"
      flow_role: "each cleaning, disinfection, and wastewater-treatment chemical"
      record_type: "chemical issue, purchase, formulation, concentration, and use records"
      raw_fields: "chemical identity; supplier; commercial-product mass; active concentration; batch; use point; date; opening and closing inventory; returned mass"
      collection_method: "record each commercial chemical separately and reconcile issued mass with inventory and returns"
      unit: "kg"
      frequency: "each issue or preparation batch"
      temporal_coverage: "complete reporting period with opening and closing stock"
      site_scope: "all cleaning, disinfection, and conditional on-site treatment points"
      aggregation_rule: "sum by single chemical identity and use point before process assignment and normalization"
      quality_evidence: "safety data sheet, purchase invoice, issue log, concentration record, and stock reconciliation"
    - protocol_id: cp_waste_records
      process_id: "all_foreground_processes"
      flow_role: "each animal-specific or material-specific waste stream and destination"
      record_type: "weighing, rejection, container, transfer, recovery, and treatment records"
      raw_fields: "row identity; animal output or material; lot; mass; container tare; quality status; destination; carrier; treatment route; transfer date; document number"
      collection_method: "weigh each stream separately, deduct tare, and assign its documented destination exactly once"
      unit: "kg"
      frequency: "each waste transfer or production lot"
      temporal_coverage: "complete reporting period"
      site_scope: "all waste generation and dispatch points within the foreground boundary"
      aggregation_rule: "sum by row identity, animal output or material, and destination; prevent transfer and treatment duplication"
      quality_evidence: "calibrated scale, rejection record, transfer note, treatment receipt, and destination reconciliation"
    - protocol_id: cp_wastewater_records
      process_id: "sanitation_wastewater"
      flow_role: "ordinary-strength wastewater, high-strength wastewater, sludge, screen residue, separated goose fat, and direct water pollutants"
      record_type: "flowmeter, sampling, laboratory, sludge, screening, grease-separation, sewer-transfer, and discharge records"
      raw_fields: "stream identity; destination; discharge status; volume; sampling point; sampling time; sampling method; concentration; analyte; unit; sludge mass; residue mass; separated-fat mass"
      collection_method: "meter segregated wastewater, use representative measured concentrations, weigh solids, and distinguish sewer transfer from direct environmental discharge"
      unit: "m3; kg; concentration unit retained"
      frequency: "continuous or each discharge interval for flow and according to the documented representative sampling plan for concentration"
      temporal_coverage: "complete reporting period including bypasses and abnormal events"
      site_scope: "all wastewater collection, treatment, sewer-transfer, and direct-discharge points in scope"
      aggregation_rule: "calculate each pollutant separately from compatible volume and concentration records; report direct emissions only for direct discharge"
      quality_evidence: "meter calibration, sampling plan, chain of custody, accredited or documented laboratory results, discharge permit, and mass reconciliation"
    - protocol_id: cp_direct_air_emissions
      process_id: "all_foreground_processes"
      flow_role: "each direct combustion substance emitted to air by process"
      record_type: "fuel, equipment, stack-test, continuous-monitoring, operating-hour, and verified-factor records"
      raw_fields: "process served; equipment; fuel identity; fuel quantity; operating time; substance; measured concentration or verified factor; exhaust flow; test period; unit"
      collection_method: "use direct measurement where representative; otherwise calculate each substance separately from collected fuel or activity data and a retained verified factor"
      unit: "kg"
      frequency: "each representative test or monitoring interval and each fuel-reporting interval"
      temporal_coverage: "complete reporting period including abnormal operation"
      site_scope: "all on-site combustion equipment serving the foreground processes"
      aggregation_rule: "sum each chemical species by process and equipment; do not merge NO with NO2 or fine with coarse particulate matter"
      quality_evidence: "calibration, test report, monitoring log, fuel record, verified factor source, and calculation workbook"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized exchange = attributable foreground exchange for the reporting period divided by net conforming frozen goose meat released in the same period; the reference output itself is fixed at 1 kg"
      inputs:
        - "attributable exchange"
        - "net conforming released mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_reconciliation
      applies_to: "receipt, slaughter, dressing, cutting, freezing, and packing mass balances"
      rule: "mass-balance difference = measured inputs plus opening inventory minus measured products, co-products, wastes, closing inventory, and documented moisture or purge change; investigate rather than fabricate an unmeasured balancing exchange"
      inputs:
        - "measured masses"
        - "opening and closing inventory"
        - "documented purge or moisture change"
      output: "mass-balance difference and reconciliation status"
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - id: calc_delivered_thermal_energy
      applies_to: "purchased steam and purchased hot water"
      rule: "use metered delivered energy where available; otherwise calculate energy from measured delivered quantity and retained supply conditions using a documented engineering relation"
      inputs:
        - "measured steam mass or water flow"
        - "supply pressure or temperature"
        - "return temperature where relevant"
        - "documented relation"
      output: "delivered energy in MJ for one carrier"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_fuel_energy
      applies_to: "natural gas, diesel, and LPG"
      rule: "fuel energy = measured fuel quantity multiplied by the retained supplier heating value after unit conversion; keep each fuel separate"
      inputs:
        - "measured fuel quantity"
        - "supplier heating value"
        - "unit conversion"
      output: "energy in MJ for one fuel"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_refrigerant_balance
      applies_to: "refrigerant make-up and chemical-specific air emissions"
      rule: "close each equipment mass balance from opening charge, purchases or additions, removals, recovered mass, and closing charge; allocate an evidenced loss to its refrigerant product and calculate each emitted chemical species only from retained actual composition"
      inputs:
        - "opening and closing charge"
        - additions
        - removals
        - recovery
        - "leak records"
        - "actual composition"
      output: "make-up mass by refrigerant product and emitted mass by chemical species"
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - id: calc_wastewater_pollutant_load
      applies_to: "direct water emissions"
      rule: "pollutant load = metered direct-discharge volume multiplied by representative measured concentration after compatible unit conversion; subtract intake background only when paired representative measurements and the selected method justify it"
      inputs:
        - "direct-discharge volume"
        - "measured concentration"
        - "unit conversion"
        - "paired intake result if used"
      output: "mass of one pollutant directly discharged to water"
      source_ids:
        - eu-jrc-sa-bref
        - eu-pef-2021-2279
    - id: calc_shared_service_assignment
      applies_to: "shared meters and support services"
      rule: "assign the measured shared total first by direct submeter data and otherwise by one documented causal driver whose totals reconcile to the shared record; retain the unrounded calculation"
      inputs:
        - "shared measured total"
        - "submeter records or causal-driver values"
        - "process coverage"
      output: "attributable amount for one process and one atomic exchange"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_company_specific
      applies_to: "foreground manufacturing inventory"
      requirement: "Use company-specific facility, lot, meter, invoice, service, laboratory, and production records for the represented reporting period."
      evidence: "record register with owner, date, system of origin, and retained record reference"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use one coherent reporting period that captures normal production, shutdowns, abnormal events, and opening and closing inventory; disclose substitutions or gaps."
      evidence: "reporting calendar, production log, downtime log, and inventory reconciliation"
    - id: dq_geographic
      applies_to: "site and upstream links"
      requirement: "Declare facility geography, water sources, electricity supply geography, fuel suppliers, waste destinations, and direct discharge receiving environment."
      evidence: "site metadata, supplier records, utility contracts, permits, and destination documents"
    - id: dq_technology
      applies_to: "slaughter, defeathering, cutting, freezing, refrigeration, sanitation, and wastewater treatment"
      requirement: "Document the actual equipment and operations represented, including product form, defeathering and freezing equipment, refrigerant identity, cleaning practice, and on-site treatment status."
      evidence: "process map, equipment register, refrigerant register, work instructions, and treatment description"
    - id: dq_completeness
      applies_to: "life-cycle inventory"
      requirement: "Reconcile the atomic card register to purchase, production, maintenance, laboratory, waste, and discharge records; list every missing card record as an explicit data gap."
      evidence: "completeness matrix with included, absent, and unresolved status by row_id"
    - id: dq_precision
      applies_to: "measured and calculated quantities"
      requirement: "Retain instrument resolution, calibration, sampling variability, conversion factors, allocation drivers, unrounded calculations, and final rounding rule."
      evidence: "calibration certificates, sampling records, calculation workbook, and uncertainty statement"
    - id: dq_consistency
      applies_to: "units, flow identities, product form, output status, and destinations"
      requirement: "Apply one documented convention for gross versus net mass, whole carcass versus cut form, bone and skin state, units, co-product status, waste destination, and direct versus sewer discharge throughout the dataset."
      evidence: "data dictionary, unit-conversion register, flow mapping register, and reviewer sign-off"
    - id: dq_transparency
      applies_to: "method and results"
      requirement: "Disclose boundary choices, conditional operations, exclusions, allocation, upstream dataset selection, calculations, unresolved UUIDs, data gaps, and verification findings."
      evidence: "method report, manifest review metadata, source register, calculation workbook, and verification report"
    - id: dq_verification
      applies_to: "completed foreground data package"
      requirement: "Perform an independent review of identity, scope, records, balances, calculations, allocation, source use, and bilingual rule alignment before lifecycle advancement."
      evidence: "dated review checklist, reviewer identity, findings, corrections, and closure evidence"
validation_rules:
  - rule_id: validate_identity
    applies_to: "PCR and reference-flow identity"
    rule: "Confirm canonical_pcr_id, CPC 3.0 code 21143, exact product title, Product flow type, reference UUID, Mass property UUID, Units of mass UUID, and kg unit; reject fresh or chilled goose meat, foie gras, and edible offal."
    source_ids:
      - unsd-cpc-21143
  - rule_id: validate_reference_amount
    applies_to: "reference output"
    rule: "Require exactly 1 kg net conforming frozen goose meat at factory-gate release and verify that packaging, liver, offal, feathers, down, blood, fat, bone, and other separated outputs are excluded."
    source_ids:
      - unsd-cpc-21143
      - eu-pef-2021-2279
  - rule_id: validate_scope
    applies_to: "dataset scope"
    rule: "Verify frozen market state, goose identity, product form, bone and skin state, process coverage, facility gate, reporting period, and exclusions for upstream farming and inbound transport and downstream stages."
    source_ids:
      - unsd-cpc-21143
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: validate_process_map
    applies_to: "foreground processes"
    rule: "Require detailed inventories for receipt, slaughter and defeathering, carcass dressing and actual cutting, pre-chilling and freezing, release and frozen storage, and sanitation and wastewater management; document conditional packaging and on-site treatment status."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: validate_atomic_inventory
    applies_to: "all inventory cards"
    rule: "Require one concrete exchange per row_id, a non-empty description, property and unit, amount rule, value mode, specificity, normalization basis, basis kind, evidence kind, collection protocol, and ordered source ids; reject collection selectors."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_goose_mass_balance
    applies_to: "goose receipt, carcass, meat, co-product, reject, waste, and inventory records"
    rule: "Check bird-count and mass reconciliation through receipt, slaughter, dressing, cutting, freezing, packing, and every separated animal output; investigate each unresolved mass-balance difference."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: validate_utility_separation
    applies_to: "water and energy"
    rule: "Check each process separately for mains water, groundwater, surface water, grid electricity, purchased steam, purchased hot water, natural gas, diesel, and LPG and verify no carrier is merged or double counted."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: validate_refrigerants
    applies_to: "pre-chilling, freezing, and frozen storage"
    rule: "Reconcile equipment-level refrigerant records and verify separate product make-up and chemical-specific emissions, actual blend composition, recovery, and absence of double counting."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: validate_wastewater
    applies_to: "wastewater and direct water emissions"
    rule: "Distinguish ordinary-strength and high-strength wastewater, sewer transfer, on-site treatment, and direct discharge; verify volume-concentration calculations, solids records, and receiving compartment."
    source_ids:
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "co-products, wastes, and shared services"
    rule: "Verify subdivision and direct assignment first, separate treatment of foie gras and offal, the documented status and destination of every output, the causal basis of unavoidable allocation, equations, reconciliation, and sensitivity disclosure."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_evidence
    applies_to: "sources and foreground records"
    rule: "Accept only the three declared external source ids for PCR support, require company-specific records for amounts, reject unsubstantiated defaults or ranges, and retain every unresolved non-reference UUID in manifest review metadata."
    source_ids:
      - unsd-cpc-21143
      - eu-jrc-sa-bref
      - eu-pef-2021-2279
  - rule_id: validate_data_quality
    applies_to: "completed foreground data package"
    rule: "Review temporal, geographic, technological, precision, completeness, consistency, transparency, and verification evidence and block lifecycle advancement until material findings are closed."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Company-specific factory-gate foreground data package for 1 kg net conforming frozen goose meat under CPC 21143"
  downstream_use: "May serve as a secondary_dataset or background_dataset in a complete life-cycle model with separately selected upstream and downstream datasets, and may project to TianGong flow, process, lifecyclemodel, and dataset entities"
  allowed_use: "Product-specific LCA and environmental-footprint modelling when product form, facility, period, technology, packaging, storage, allocation, and data quality match the study"
  excluded_use: "Generic category-wide default quantities; fresh or chilled goose meat; foie gras; edible offal; another species; retail, cooking, use, or end-of-life modelling without added datasets"
  required_metadata: "PCR id; CPC code; reference UUIDs; product form; bone and skin state; frozen release specification; net mass; facility and period; process map; refrigeration system and refrigerants; packaging; storage duration; foie gras and offal separation; wastewater and waste destinations; allocation; source ids"
  required_quality_disclosure: "Primary-data coverage; meter and scale calibration; bird-count and mass-balance reconciliation; sampling representativeness; calculation factors; allocation choices; uncertainty; missing records; unresolved non-reference UUIDs; reviewer and verification status"
  update_trigger: "Change in product form, process route, facility, defeathering, freezing or refrigeration technology, refrigerant, packaging, storage practice, wastewater treatment, co-product destination, foie gras or offal relation, allocation, reporting period, source method, or reference identity"
