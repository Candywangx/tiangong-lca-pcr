      record_type: "cold-process batch, transfer, temperature, time, mass, and rejection records"
      raw_fields: "lot; product form; input mass; output mass; reject mass; cooling start and end; freezing start and end; measured product temperature; opening and closing inventory"
      collection_method: "link calibrated mass records to retained time and temperature records for each represented cold-process lot"
      unit: "kg; degree Celsius; hour"
      frequency: "each freezing lot"
      temporal_coverage: "complete reporting period including cold-store inventory change"
      site_scope: "all pre-chilling and freezing equipment in scope"
