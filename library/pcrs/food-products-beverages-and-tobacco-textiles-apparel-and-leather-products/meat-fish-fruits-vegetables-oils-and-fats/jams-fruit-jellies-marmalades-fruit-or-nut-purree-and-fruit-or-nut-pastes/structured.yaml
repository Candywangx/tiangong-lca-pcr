  how_much: "1 kg net marketable product, excluding packaging mass"
  how_well: "Meets the declared route-specific composition, food-safety release, quality, preservation, and market specification; CXS 296-2009 requirements apply only when cxs_jam_jelly_marmalade is declared"
  how_long_or_cycle: "One released production lot at the factory gate; declared shelf life and its packaging dependence are metadata but downstream storage losses and service are outside this factory-gate unit"
