allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "multi_product_lines_and_shared_services"
    rule: "Avoid allocation first by product-specific batch records, submetering, process subdivision, or system expansion. Collect only flows directly attributable to the declared product when subdivision is possible."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_physical_second
    applies_to: "unavoidable_shared_inputs_and_outputs"
    rule: "If subdivision or system expansion is not possible, use and justify a measurable causal physical relationship such as batch mass, operating time, metered energy, or equipment throughput that represents resource use."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_other_last
    applies_to: "no_defensible_physical_relationship"
    rule: "Use economic or another relationship only after documenting why subdivision, system expansion, and physical allocation are not feasible; use process-stage market values and disclose period, geography, prices, and sensitivity."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_residue_status
    applies_to: "preparation_and_transformation_outputs"
    rule: "Classify edible or saleable residues as co-products when they carry a function or value; classify only streams sent for treatment or disposal as waste. Record rework as an internal loop, not a co-product or avoided burden."
    source_ids:
      - eu-pef-recommendation-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_formula_records
      process_id: "ingredient_preparation"
      flow_role: "Main and formulation ingredients plus prepared transfers"
      record_type: "Batch and inventory records"
      raw_fields: "lot_id; product_code; ingredient_id; species; origin; received_state; opening_stock; receipts; issued_mass; returns; closing_stock; formulation_version; prepared_transfer_mass"
      collection_method: "Calibrated scales, weighbridge, tank level with verified density, and inventory reconciliation"
      unit: "kg"
      frequency: "Each receipt and batch"
      temporal_coverage: "Entire declared reporting period"
      site_scope: "All included receiving, preparation, and formulation areas"
      aggregation_rule: "Reconcile beginning stock plus receipts minus ending stock and non-product dispositions; allocate only by documented batch linkage"
      quality_evidence: "Calibration certificates, supplier lot records, formulation approval, stock reconciliation, and variance investigation"
    - protocol_id: cp_product_release_records
      process_id: "final_conditioning_packout"
      flow_role: "Bulk transfer, route quality, and released net product"
      record_type: "Batch, laboratory, fill, and release records"
      raw_fields: "route_family; cxs_applicability; product_definition; batch_id; bulk_mass; net_fill; released_units; released_net_mass; soluble_solids_or_dry_matter; method; preservation_state; shelf_life; disposition"
      collection_method: "Calibrated transfer/fill measurements and approved laboratory or quality records"
      unit: "kg and declared quality units"
      frequency: "Each batch and release lot"
      temporal_coverage: "Entire declared reporting period"
      site_scope: "All included transformation and pack-out lines"
      aggregation_rule: "Sum released net mass excluding packaging; preserve route-specific quality results and rejected or reworked quantities separately"
      quality_evidence: "Scale calibration, test method, sampling plan, release authorization, and lot traceability"
    - protocol_id: cp_waste_byproduct_records
      process_id: "ingredient_preparation"
      flow_role: "Preparation residues, co-products, rework, and transformation wastes"
      record_type: "Waste, by-product, and disposition records"
      raw_fields: "batch_id; stream_id; material_type; mass; moisture_or_solids_if_used; destination; waste_or_coproduct_status; revenue_if_economic_allocation; rework_return"
      collection_method: "Calibrated scales, container counts with verified tare, and transfer documentation"
      unit: "kg"
      frequency: "Each batch or removal"
      temporal_coverage: "Entire declared reporting period"
      site_scope: "All included process areas and destinations"
      aggregation_rule: "Aggregate by stream and disposition; subtract documented rework returned to the same product system"
      quality_evidence: "Scale or tare evidence, transfer notes, treatment receipts, sales records, and classification rationale"
    - protocol_id: cp_packaging_records
      process_id: "final_conditioning_packout"
      flow_role: "Packaging inputs and wastes"
      record_type: "Bill-of-packaging and issue-return records"
      raw_fields: "packaging_item; material; unit_mass; issued_count; returned_count; rejected_count; reusable_trips; loss_rate; net_fill"
      collection_method: "Supplier specifications verified by tare measurements and inventory reconciliation"
      unit: "kg and count"
      frequency: "Each packaging lot and production batch"
      temporal_coverage: "Entire declared reporting period"
      site_scope: "All primary, closure, label, secondary, transport, and bulk-container materials"
      aggregation_rule: "Convert counts to mass with verified unit mass; subtract unused returns; separate reusable trip allocation and losses"
      quality_evidence: "Supplier specification, sampled tare, line issue-return record, and waste reconciliation"
    - protocol_id: cp_utility_records
      process_id: "site_utilities_cleaning"
      flow_role: "Water, electricity, fuels, steam, purchased heat, and cleaning materials"
      record_type: "Meter, invoice, and operating records"
      raw_fields: "meter_id; carrier; opening_reading; closing_reading; unit; calibration; batch_or_line; operating_time; heating_value_if_used; cleaning_cycle; internal_reuse"
      collection_method: "Submeters preferred; otherwise main meter or invoices allocated by documented physical driver"
      unit: "Carrier-specific unit"
      frequency: "Continuous, shift, batch, or billing interval"
      temporal_coverage: "Entire declared reporting period with complete meter reconciliation"
      site_scope: "All included production, utilities, and sanitation areas"
      aggregation_rule: "Difference readings, subtract documented excluded loads, allocate shared loads using section 7 hierarchy, and preserve carrier units"
      quality_evidence: "Meter calibration, invoices, control-system export, operating logs, and allocation worksheet"
    - protocol_id: cp_wastewater_records
      process_id: "site_utilities_cleaning"
      flow_role: "Wastewater quantity and pollutant data"
      record_type: "Effluent meter, sampling, and transfer records"
      raw_fields: "outlet_id; volume; density_if_mass_conversion; flow_period; COD; BOD; suspended_solids; nutrients; pH; treatment_destination; internal_reuse"
      collection_method: "Calibrated effluent meter plus representative sampling or verified off-site treatment records"
      unit: "kg or m3 and analyte-specific units"
      frequency: "Continuous or each discharge and sampling event"
      temporal_coverage: "Entire declared reporting period"
      site_scope: "All included wastewater outlets"
      aggregation_rule: "Convert volume to mass only with documented density; flow-weight pollutant concentrations; exclude verified internal reuse"
      quality_evidence: "Meter calibration, laboratory reports, chain of custody, permit monitoring, and treatment receipts"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = attributable reporting-period amount / released net product mass; packaging mass is excluded from the denominator"
      inputs:
        - "attributable flow amount"
        - "released net product mass"
      output: "flow amount per 1 kg reference product"
      source_ids:
        - eu-pef-recommendation-2021-2279
    - id: calc_batch_mass_balance
      applies_to: "Each transformation route"
      rule: "mass-balance residual = total measured inputs - released product - co-products - wastes - wastewater - measured or calculated evaporated water - documented inventory change; report residual and investigation"
      inputs:
        - "all batch input and output masses"
        - "inventory change"
        - "evaporation evidence"
      output: "reconciled mass balance and residual"
      source_ids: []
    - id: calc_cxs_fruit_content
      applies_to: "Declared CXS jam, jelly, or marmalade route"
      rule: "Calculate fruit ingredient as a percentage of finished product under the applicable CXS 296-2009 Section 3.1.2 provision; for jelly deduct water used to prepare aqueous extracts where required; apply fruit-specific and mixed-fruit provisions rather than a generic threshold"
      inputs:
        - "fruit ingredient mass by type"
        - "finished product mass"
        - "aqueous-extract water"
        - "declared CXS product definition"
      output: "CXS fruit-content result and applicable threshold"
      source_ids:
        - codex-cxs-296-2009
    - id: calc_packaging_mass
      applies_to: "Packaging inputs"
      rule: "packaging mass = sum of material-specific net issued counts multiplied by verified unit mass, adjusted for documented reusable trips or losses"
      inputs:
        - counts
        - "unit masses"
        - returns
        - "rejected units"
        - "reusable-trip data"
      output: "kg packaging per kg reference product"
      source_ids:
        - eu-pef-recommendation-2021-2279
    - id: calc_shared_service_allocation
      applies_to: "Shared utilities and services"
      rule: "Apply section 7 hierarchy and calculate the declared product share from submetered use or the justified physical driver; economic allocation is last resort"
      inputs:
        - "shared total"
        - "product-specific meter or physical driver"
        - "co-product values if last resort"
      output: "attributable shared-service amount and allocation factor"
      source_ids:
        - eu-pef-recommendation-2021-2279
  data_quality_requirements:
    - id: dq_completeness_consistency
      applies_to: "Foreground dataset"
      requirement: "Include all known inputs and outputs for included processes and reconcile process, batch, utility, packaging, waste, and wastewater records to the same reporting period and product scope."
      evidence: "Completeness checklist, reconciliations, and documented cut-offs or data gaps; PEF completeness and methodological consistency principles"
    - id: dq_representativeness
      applies_to: "Foreground and secondary data"
      requirement: "Assess technological, geographical, and time-related representativeness and precision; state product, route, site, geography, reporting period, measurement basis, and uncertainty or proxy status."
      evidence: "DQR or equivalent documented assessment following Recommendation (EU) 2021/2279"
    - id: dq_cxs_scope
      applies_to: "CXS claims"
      requirement: "Retain evidence that the product definition, direct-consumption purpose, formulation, fruit content, soluble solids, fill, labelling, and applicable national choice correspond to the relevant CXS provision. Do not mark non-CXS routes as compliant."
      evidence: "Approved specification, formula, laboratory results, fill records, label, and applicable legal review"
    - id: dq_reasoned_estimates
      applies_to: "All reasoned_estimate ranges"
      requirement: "Treat every provisional range as screening-only. Validate it against foreground records, replace it with site-specific or reviewed evidence before maturity advances beyond candidate, and investigate and disclose any out-of-range result."
      evidence: "Range replacement log, foreground records, reviewed source, and variance investigation"
    - id: dq_source_traceability
      applies_to: "Purchased inputs and treatment services"
      requirement: "Link each material upstream and treatment dataset to supplier, geography, technology, time period, and any proxy decision; do not use an unqualified category average when product-specific information exists."
      evidence: "Supplier records, dataset metadata, and proxy justification"
validation_rules:
  - rule_id: validate_identity_and_reference
    applies_to: "dataset_identity"
    rule: "Confirm the manifest PCR id, common product-flow UUID, Mass flow-property UUID, Units of mass UUID, kg unit, route family, product identity, net-mass basis, and all required qualifiers are present and consistent."
    source_ids:
      - unsd-cpc-3-0-21494
  - rule_id: validate_exactly_one_route
    applies_to: "process_inventory"
    rule: "Confirm exactly one transformation route family describes the reference product and that the matching conditional process is included; exclude the other transformation process unless separately metered co-production is explicitly modelled and allocated."
    source_ids: []
  - rule_id: validate_cxs_scope_and_composition
    applies_to: "cxs_jam_jelly_marmalade"
    rule: "Only for a declared CXS route, verify scope and the applicable CXS product definition and Section 3.1.2 formulation: jam/jelly uses the applicable 45% or 35% general provision with its listed fruit exceptions and mixed-fruit adjustment; citrus marmalade uses at least 200 g citrus ingredient per 1000 g finished product including at least 75 g endocarp; non-citrus marmalade uses at least 30% fruit generally or 11% for ginger. Do not apply these thresholds to non-CXS preserves, finished purées, or nut pastes."
    source_ids:
      - codex-cxs-296-2009
  - rule_id: validate_cxs_solids_fill
    applies_to: "cxs_jam_jelly_marmalade"
    rule: "Only for a declared CXS route, verify the applicable national choice for soluble solids and the CXS provision: products under Section 3.1.2(a-c) are 60-65% or greater as applicable, non-citrus marmalade is 40-65% or less as applicable, and container fill is at least 90% of water capacity minus necessary headspace. Preserve the test and fill evidence."
    source_ids:
      - codex-cxs-296-2009
  - rule_id: validate_non_cxs_boundary
    applies_to: "non_cxs_and_puree_paste_routes"
    rule: "Confirm the data package does not cite CXS thresholds as compliance evidence for reduced-sugar or further-processing preserves, special-diet or sweetener-formulated products, or any finished fruit purée, nut purée, or fruit/nut paste; validate against the declared applicable specification instead."
    source_ids:
      - codex-cxs-296-2009
  - rule_id: validate_mass_and_allocation
    applies_to: "foreground_inventory"
    rule: "Reconcile reference product, ingredients, packaging, residues, co-products, wastes, wastewater, evaporation, and inventory changes; confirm shared flows follow the allocation hierarchy and all factors sum to one for the allocated total."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_data_quality_and_ranges
    applies_to: "foreground_and_secondary_data"
    rule: "Confirm completeness, methodological consistency, technological, geographical, and temporal representativeness, precision, source traceability, and disposition of every reasoned-estimate range and out-of-range value."
    source_ids:
      - eu-pef-recommendation-2021-2279
published_dataset_profile:
  dataset_role: "Product-specific factory-gate foreground data package and resulting unit-process dataset for one declared route and market state"
  downstream_use: "secondary_dataset; background_dataset after review and publication under the library lifecycle contract"
  allowed_use: "Product-system modelling for the declared product, route, site, geography, reporting period, and packaging or bulk state; downstream models may add distribution, storage, use, loss, and end-of-life stages"
  excluded_use: "Unqualified category-average claims; comparative assertions between unlike route families or product specifications; CXS conformity claims for non-CXS products; direct extrapolation to fruit juices, whole fruit or nuts, or other excluded products"
  required_metadata: "PCR id; UUID references; route family; product and species; formulation; CXS applicability; quality and solids basis; preservation technology; packaging or bulk state; net fill; shelf life and storage condition; site, geography, reporting period; allocation; cut-offs; upstream datasets; proxies; data gaps"
  required_quality_disclosure: "Record coverage and reconciliation; measurement and calculation methods; calibration; representativeness and precision; CXS evidence where applicable; allocation and cut-offs; reasoned-estimate status and replacement; out-of-range investigations; uncertainty and missing-flow limitations"
  update_trigger: "Material change to product identity, formulation, route, preservation, packaging, site, utility supply, allocation, applicable law or standard; revised official CPC or CXS scope; new reviewed evidence replacing a reasoned estimate; or a data-quality finding that changes results or fitness for use"
