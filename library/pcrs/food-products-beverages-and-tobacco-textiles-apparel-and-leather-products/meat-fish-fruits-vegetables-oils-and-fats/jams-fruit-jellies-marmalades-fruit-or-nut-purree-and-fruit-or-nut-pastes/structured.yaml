system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary starts when fruit, nuts, fruit-derived intermediates, sweetening ingredients, formulation ingredients, packaging, utilities, and cleaning materials are received at the manufacturing site. It ends when released net product and its declared packaging or bulk containment leave the factory gate. Upstream production and inbound transport are linked as secondary datasets. Distribution after the factory gate, retail and consumer storage, use, food loss after the gate, and end-of-life are excluded from this foreground dataset and must be added by a downstream full-life-cycle model when relevant."
      source_ids: []
    - rule_id: boundary_known_flows
      applies_to: "foreground_manufacturing"
      rule: "Record all known product, energy, water, waste, wastewater, and direct elementary flows for included manufacturing processes; avoid cut-off. If a downstream PEF study applies cut-off, it may exclude no more than the PEF cumulative 3% condition and shall explicitly justify environmental significance."
      source_ids:
        - eu-pef-recommendation-2021-2279
    - rule_id: boundary_packaging
      applies_to: "packaging_and_packout"
      rule: "Include production of primary, secondary, transport, and bulk-container packaging required at the factory gate, plus on-site packaging losses; exclude packaging mass from the 1 kg net reference product."
      source_ids:
        - eu-pef-recommendation-2021-2279
    - rule_id: boundary_route_evidence
      applies_to: "route_specific_processes"
      rule: "Apply CXS 296-2009 requirements only when the declared product and market purpose fall within its scope. For non-CXS preserves and all finished fruit or nut purée/paste routes, use actual foreground specifications and applicable legal or buyer requirements without extrapolating CXS thresholds."
      source_ids:
        - codex-cxs-296-2009
    - rule_id: boundary_upstream_links
      applies_to: "purchased_inputs"
      rule: "Link each purchased ingredient, packaging material, energy carrier, water supply, and externally treated waste to geographically, technologically, and temporally representative upstream datasets; disclose proxies and missing links."
      source_ids:
        - eu-pef-recommendation-2021-2279
