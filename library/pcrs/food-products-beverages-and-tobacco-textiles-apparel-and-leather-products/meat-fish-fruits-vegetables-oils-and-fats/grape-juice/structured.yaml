system_boundary:
  rules:
    - rule_id: boundary_product_identity
      applies_to: "Product scope"
      rule: "Include only unfermented grape juice made by a declared directly expressed or from-concentrate route. Keep nectars, mixed juices, fermented products and concentrate sold as the reference product outside this PCR."
      source_ids:
        - codex-cxs-247-2005
        - eu-directive-2001-112-ec
    - rule_id: boundary_factory_gate
      applies_to: "Foreground processes"
      rule: "Include receipt and preparation, juice recovery or reconstitution, all site clarification/stabilization operations, preservation, filling, in-scope storage, cleaning, utilities, wastewater generation, product losses and packaging used before the declared factory gate."
      source_ids:
        - codex-cxs-247-2005
    - rule_id: boundary_route_specificity
      applies_to: "Direct and from-concentrate routes"
      rule: "Model only operations actually performed. If concentrate or an intermediate is purchased, link its upstream dataset and do not add a fictitious concentration step at the reconstitution site."
      source_ids:
        - codex-cxs-247-2005
        - eu-directive-2001-112-ec
    - rule_id: boundary_food_safety_controls
      applies_to: "Safety-related operations"
      rule: "Record the actual preservation or pathogen-control operation and its monitored parameters. Apply jurisdiction-specific HACCP and pathogen-reduction requirements only where legally or contractually applicable."
      source_ids:
        - codex-cxs-247-2005
        - us-ecfr-21-cfr-120
    - rule_id: boundary_excluded_life_cycle
      applies_to: "Upstream and downstream stages"
      rule: "Vineyard cultivation, off-site production of purchased inputs, distribution after the factory gate, retail, use and end-of-life require linked datasets or explicit scope extension; they are not silently absorbed into the foreground inventory."
      source_ids:
        - iso-14044-2006
boundary_abstraction:
  declared_starting_condition: "For directly expressed juice, sound grapes measured at the processing-facility receiving point; for juice from concentrate, grape-juice concentrate and reconstitution water measured at the reconstitution facility receiving point; identify any upstream step brought into the foreground."
  starting_condition_role: "The declared starting material is the first foreground technosphere input; its upstream production remains represented by a linked dataset rather than being recreated inside this PCR."
  product_classification_scope: "Single-fruit grape juice corresponding to CPC 3.0 code 21434; classification is mapping context and does not override the semantic exclusions in this PCR."
  recursive_input_rule: "When grape juice or grape-juice concentrate enters from outside the foreground system, record it as a purchased intermediate with route, concentration, origin and supplier-dataset reference; do not recursively model it as the same foreground output."
  upstream_dataset_requirement: "Use representative upstream datasets for grapes, purchased concentrate or juice intermediates, water, energy carriers, processing aids, cleaning materials and packaging. Disclose geography, technology, time, allocation and data-quality mismatches."
  disclosure: "Declare route, starting material, included unit operations, outsourced operations, concentration/reconstitution steps, preservation and filling method, storage condition, product and packaging state, cut-offs, co-product destinations and excluded life-cycle stages."
