validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The selected reference product must resolve to Grape juice d030caf4-ad0f-4371-8e04-b15ce67cc4fb, a public state-100 Product flow classified as CPC 21434, with Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg as the reference unit."
    source_ids: []
  - rule_id: validate_product_scope
    applies_to: "Product identity"
    rule: "Reject datasets for grape nectar, mixed juice, concentrate sold as the product, fermented products or other excluded products; require the declared direct or from-concentrate route."
    source_ids:
      - codex-cxs-247-2005
      - eu-directive-2001-112-ec
  - rule_id: validate_reference_quantity
    applies_to: "Reference amount"
    rule: "Confirm exactly 1 kg net released grape juice after in-scope loss, with packaging mass excluded and all required qualifiers present."
    source_ids: []
  - rule_id: validate_route_processes
    applies_to: "Process map"
    rule: "Require preservation and filling and every route-triggered conditional process; prohibit a fictitious concentration or extraction step when the corresponding intermediate is purchased."
    source_ids:
      - codex-cxs-247-2005
      - eu-directive-2001-112-ec
  - rule_id: validate_concentration_reconstitution
    applies_to: "Concentrated and from-concentrate routes"
    rule: "Require measured mass and concentration evidence for feed, concentrate, water, restored components, output and losses; do not accept an unsupported universal dilution factor."
    source_ids:
      - codex-cxs-247-2005
      - eu-directive-2001-112-ec
  - rule_id: validate_inventory_completeness
    applies_to: "Foreground inventory"
    rule: "Check grapes or concentrate, water by use, electricity, thermal carriers, processing aids, cleaning, packaging, products, residues, wastewater, losses and direct emissions; every omission must be explicitly zero, not applicable or outside scope."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "Each route and process"
    rule: "Require a disclosed mass-balance residual, investigation threshold and reviewer decision; wet, dry, concentrated and diluted states shall be traceably converted."
    source_ids: []
  - rule_id: validate_safety_control
    applies_to: "Preservation and release"
    rule: "Require actual preservation or pathogen-control parameters and release evidence. Where 21 CFR Part 120 applies, require the facility-specific hazard analysis, HACCP records and applicable pathogen-reduction evidence rather than assuming a generic treatment."
    source_ids:
      - codex-cxs-247-2005
      - us-ecfr-21-cfr-120
  - rule_id: validate_allocation
    applies_to: "Co-products and shared processes"
    rule: "Require output destination and waste/co-product status, allocation-avoidance review, selected allocation relation, parameters and sensitivity; reject automatic credits for possible but unverified uses."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_route_weighting
    applies_to: "Multi-route or multi-SKU dataset"
    rule: "Require actual released-mass shares and route-specific inventories before aggregation; packaging and storage configurations must remain traceable."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_uuid_resolution
    applies_to: "Inventory identity"
    rule: "The reference product and Mass support chain are resolved. Every other Tiangong inventory flow or property UUID remains unresolved until independently confirmed; no semantic candidate may be presented as an exact database identity."
    source_ids: []
  - rule_id: validate_provisional_ranges
    applies_to: "QA ranges"
    rule: "Flag values outside a provisional guardrail for review, but do not substitute the guardrail for foreground data. Publication review must replace, explicitly accept, or remove each reasoned_estimate range."
    source_ids: []
  - rule_id: validate_source_traceability
    applies_to: "Evidence"
    rule: "Every externally constrained boundary, identity, safety, quality or allocation rule must reference a listed source; web retrieval notes and Tiangong command traces must remain outside the PCR."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for grape juice at the declared factory gate"
  downstream_use: "secondary_dataset; background_dataset after methodology review, source review and resolution or explicit acceptance of identity and quantitative gaps"
  allowed_use: "Route- and market-state-matched LCA studies, supply-chain models and downstream products when geography, time, technology, concentration route, packaging and storage are representative"
  excluded_use: "Grape nectar, mixed juice, concentrate as the reference product, fermented products, vineyard cultivation by itself, or another route/geography/market state without documented representativeness review"
  required_metadata: "PCR id and version; reference-flow UUID and unit support chain; geography; production period; direct/from-concentrate route and shares; grape or concentrate origin; soluble-solids basis; clear/cloudy state; preservation method; packaging; storage condition; process coverage; allocation; upstream datasets; unresolved identities; data owners and review status"
  required_quality_disclosure: "Foreground versus proxy shares; meter and scale coverage; route separation; concentration and mass balance; data gaps; provisional ranges; allocation choices; safety-control applicability; upstream representativeness; uncertainty and reviewer decisions"
  update_trigger: "Change in product identity or law; route, formulation, grape or concentrate sourcing, technology, preservation, packaging or storage change; new material co-product destination; material data-quality change; resolved Tiangong UUID; replacement of provisional evidence; or expiry of the declared representative period"
