measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize the foreground inventory to exactly 1 kg of released net grape juice after all in-scope processing losses and before packaging mass is added."
  - id: material_mass_state
    applies_to: "Grapes, juice intermediates, concentrate, ingredients, processing aids, packaging, wastes and co-products"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record actual mass and the measured material state. Wet mass, dry mass, concentrate mass and diluted mass shall not be mixed without a documented conversion."
  - id: soluble_solids_separate
    applies_to: "Juice and concentrate streams"
    required_property_ref:
      name: "Route-specific concentration measurement"
      uuid: ""
    required_unit: "declared method and unit"
    rule: "Record soluble solids or the legally applicable concentration indicator separately from mass. Do not convert volume to mass or infer concentrate dilution from nominal labels without measured density or batch formulation evidence."
  - id: water_mass_by_use
    applies_to: "Ingredient, reconstitution, process and cleaning water"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record water by use. Reconstitution water shall remain separate from extraction, cleaning and utility water."
  - id: energy_carrier_preservation
    applies_to: "Electricity, fuels, steam, heat, cooling and compressed utilities"
    required_property_ref:
      name: "Carrier-specific energy property"
      uuid: ""
    required_unit: "kWh, MJ or metered carrier unit"
    rule: "Preserve the metered carrier and unit, document lower/higher heating value where relevant, and convert only with a stated factor. Do not combine electricity and thermal energy before impact calculation."
  - id: packaging_mass_separate
    applies_to: "Primary, secondary and transport packaging"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure packaging material by type and include it when inside the declared factory-gate product system, but exclude packaging mass from the 1 kg reference amount."
  - id: batch_mass_balance
    applies_to: "Each route and production period"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile recorded mass inputs with product, intermediates, co-products, wastes, wastewater and measured or calculated water losses; disclose the residual and investigation threshold."
