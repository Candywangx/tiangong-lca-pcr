allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "Multi-output foreground processes"
    rule: "First avoid allocation by separately measuring and subdividing processes or by expanding the system only when the substituted function and linked dataset are explicitly justified."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue_status
    applies_to: "Pomace, seeds, stems, lees, recovered aroma, concentrate by-products and off-spec juice"
    rule: "Determine from the actual destination and applicable rules whether each output is waste, internal reuse or a co-product. Do not assign an avoided burden or co-product credit merely because a stream has a possible use."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_physical_then_other
    applies_to: "Unavoidable allocation"
    rule: "Use a documented causal physical relation where it represents the joint process. If no defensible physical relation exists, use another declared relation such as economic value with geography, period, prices, sensitivity and zero-value treatment disclosed."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_internal_recycling
    applies_to: "Internal juice recirculation, rework, water recovery and recovered heat"
    rule: "Keep internal loops inside the foreground process and count only net external inputs and outputs. Disclose loop losses and do not credit the same recovery twice."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_route_mix
    applies_to: "Datasets representing more than one production route or product configuration"
    rule: "Calculate route-specific inventories first and weight them by actual released net product mass for the declared production period. Do not average directly expressed and from-concentrate routes without route shares."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_batch_records
      process_id: "grape_receipt_preparation_juice_extraction_conditioning_juice_reconstitution_preservation_filling"
      flow_role: "Grapes, concentrate, processing aids and cleaning materials"
      record_type: "Weighbridge, receiving, formulation, stock issue and lot records"
      raw_fields: "material identity; supplier; lot; origin; route; gross/tare/net mass; concentration; moisture or active basis; timestamp; batch"
      collection_method: "Calibrated scale or verified inventory issue reconciled to production batch"
      unit: "kg and declared concentration basis"
      frequency: "Each lot or batch"
      temporal_coverage: "Entire representative production period"
      site_scope: "Each foreground facility and outsourced operation included in scope"
      aggregation_rule: "Sum net material by batch and route; subtract documented returns; normalize to released net product mass"
      quality_evidence: "Scale calibration; supplier certificate where relevant; lot traceability; reconciliation sign-off"
    - protocol_id: cp_water_records
      process_id: "all_applicable_processes"
      flow_role: "Ingredient, reconstitution, process, cleaning and utility water"
      record_type: "Meter, batch formulation and quality-test records"
      raw_fields: "meter start/end; water use; batch; source; treatment; quality result; timestamp"
      collection_method: "Calibrated meter preferred; batch tank or engineering calculation only when documented"
      unit: "kg or m3 with measured density/conversion"
      frequency: "Each batch or meter interval"
      temporal_coverage: "Entire representative production period"
      site_scope: "Each facility; separate major use and reconstitution water"
      aggregation_rule: "Convert to mass with documented density when needed; allocate shared use by a recorded causal driver"
      quality_evidence: "Meter calibration; water-quality result; completeness reconciliation"
    - protocol_id: cp_energy_records
      process_id: "all_applicable_processes"
      flow_role: "Electricity, fuels, steam, heat, cooling and compressed utilities"
      record_type: "Meter, sub-meter, invoice and equipment-log records"
      raw_fields: "carrier; meter start/end; quantity; unit; heating-value basis; batch or period; equipment; allocation driver"
      collection_method: "Direct metering preferred; documented allocation from facility meter where sub-metering is unavailable"
      unit: "carrier unit, kWh or MJ"
      frequency: "Continuous, batch or billing interval"
      temporal_coverage: "Entire representative production period including seasonal operation"
      site_scope: "Each facility and in-scope utility system"
      aggregation_rule: "Preserve carriers; subtract unrelated loads; allocate shared utilities by metered time, mass throughput or documented engineering driver"
      quality_evidence: "Meter calibration; invoice reconciliation; conversion-factor source; allocation review"
    - protocol_id: cp_intermediate_batch_records
      process_id: "grape_receipt_preparation_juice_extraction_conditioning_juice_concentration_juice_reconstitution_preservation_filling"
      flow_role: "Prepared grapes, juice, concentrate, condensate and transfers"
      record_type: "Batch sheet, tank level, scale, flow meter and laboratory records"
      raw_fields: "batch; input/output mass or volume; density; soluble solids or concentration; route; tank; timestamp; recovered components"
      collection_method: "Calibrated mass or flow measurement linked to representative sampling"
      unit: "kg plus declared analytical unit"
      frequency: "Each batch and transfer"
      temporal_coverage: "Entire representative production period"
      site_scope: "Each relevant process line"
      aggregation_rule: "Reconcile transfers and calculate route-specific yields from measured states"
      quality_evidence: "Calibration; sampling method; laboratory QA; batch sign-off"
    - protocol_id: cp_residue_wastewater_records
      process_id: "all_applicable_processes"
      flow_role: "Rejects, pomace, lees, off-spec product, packaging scrap, wastewater and treatment outputs"
      record_type: "Scale, container, manifest, meter, treatment and destination records"
      raw_fields: "stream; mass or volume; density; moisture; composition; destination; waste/co-product status; date; batch"
      collection_method: "Direct weighing or metering; documented water balance only for unmetered wastewater"
      unit: "kg or m3 with conversion"
      frequency: "Each shipment, batch or meter interval"
      temporal_coverage: "Entire representative production period"
      site_scope: "Each facility and destination"
      aggregation_rule: "Aggregate separately by stream, state and destination; do not net co-products against inputs"
      quality_evidence: "Scale/meter calibration; transfer document; treatment record; destination confirmation"
    - protocol_id: cp_packaging_release_records
      process_id: "preservation_filling"
      flow_role: "Packaging and released product"
      record_type: "Packaging bill of materials, filling counter, net-content, scale, QA release and rejection records"
      raw_fields: "SKU; packaging component; material; component mass; units filled; net content; accepted/rejected quantity; batch; release status"
      collection_method: "Verified bill of materials plus calibrated net-mass and line-count records"
      unit: "kg and item count"
      frequency: "Each SKU and batch"
      temporal_coverage: "Entire representative production period"
      site_scope: "Each filling line and product configuration"
      aggregation_rule: "Convert counts to mass by verified component mass; normalize accepted net juice separately from packaging"
      quality_evidence: "Scale calibration; bill-of-material revision; release certificate; reconciliation"
    - protocol_id: cp_storage_dispatch_records
      process_id: "finished_storage"
      flow_role: "Stored product, storage energy, loss and dispatch"
      record_type: "Warehouse inventory, temperature, time, meter and dispatch records"
      raw_fields: "batch; mass; entry/exit time; temperature class; meter quantity; loss; destination"
      collection_method: "Inventory transaction linked to monitored storage condition and meter period"
      unit: "kg, h or day, temperature and kWh"
      frequency: "Each lot and meter interval"
      temporal_coverage: "Entire in-scope storage period"
      site_scope: "Each ambient, chilled or frozen zone"
      aggregation_rule: "Allocate energy by occupied mass-time or another documented causal driver; reconcile entry, dispatch and loss"
      quality_evidence: "Temperature log; meter evidence; inventory reconciliation; dispatch record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground rows"
      rule: "normalized amount = route-specific amount / released net grape-juice mass; packaging mass is excluded from the denominator"
      inputs:
        - "measured row amount"
        - "accepted released net product mass"
      output: "amount per 1 kg grape juice"
      source_ids:
        - iso-14044-2006
    - id: calc_direct_route_yield
      applies_to: "Directly expressed route"
      rule: "yield = measured extracted or released juice mass / accepted grape mass, with material states and soluble-solids basis reported"
      inputs:
        - "accepted grape mass"
        - "intermediate and product mass"
        - "concentration results"
      output: "route yield and reconciliation evidence"
      source_ids:
        - codex-cxs-247-2005
    - id: calc_reconstitution_balance
      applies_to: "From-concentrate route"
      rule: "reconcile concentrate, reconstitution water, restored components and losses to measured reconstituted output; use measured lot concentration rather than a universal factor"
      inputs:
        - "concentrate mass and concentration"
        - water
        - "restored components"
        - "output mass and concentration"
        - losses
      output: "reconstituted batch balance"
      source_ids:
        - codex-cxs-247-2005
        - eu-directive-2001-112-ec
    - id: calc_mass_balance
      applies_to: "Each process and route"
      rule: "residual = total measured mass inputs - total measured mass outputs - separately quantified transfer or water loss; report residual and signed review"
      inputs:
        - "input masses"
        - "product and co-product masses"
        - waste
        - wastewater
        - "measured/calculated loss"
      output: "mass-balance residual"
      source_ids: []
    - id: calc_shared_utility_allocation
      applies_to: "Shared utilities"
      rule: "allocate only the measured shared total using a documented causal driver; preserve carrier and unit"
      inputs:
        - "shared meter quantity"
        - "sub-meter data if any"
        - "operating time"
        - "throughput or engineering driver"
      output: "process-specific utility amount"
      source_ids:
        - iso-14044-2006
    - id: calc_route_weighted_result
      applies_to: "Multi-route dataset"
      rule: "total normalized inventory = sum(route normalized inventory × route released-mass share)"
      inputs:
        - "route inventories"
        - "released product mass by route"
      output: "production-weighted dataset inventory"
      source_ids:
        - iso-14044-2006
    - id: calc_packaging_mass
      applies_to: "Packaging"
      rule: "packaging mass = verified component mass × accepted packed units, reconciled to issued and scrapped packaging"
      inputs:
        - "component mass"
        - "accepted units"
        - "issued material"
        - scrap
      output: "packaging mass per kg net juice"
      source_ids: []
    - id: calc_storage_energy
      applies_to: "In-scope storage"
      rule: "storage energy allocated to product = metered zone energy × documented product mass-time share"
      inputs:
        - "zone meter"
        - "product mass"
        - "residence time"
        - "total occupied mass-time"
      output: "storage electricity per kg dispatched product"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Product and route"
      requirement: "Retain product specification, route declaration, grape identity, concentrate status, clear/cloudy state, preservation method, packaging and storage state for every represented product configuration."
      evidence: "Batch specification, label or bulk specification, formulation and release record; codex-cxs-247-2005; eu-directive-2001-112-ec"
    - id: dq_temporal_coverage
      applies_to: "Foreground data"
      requirement: "Cover a representative continuous production period or all relevant campaigns and disclose shutdowns, vintage or harvest effects, seasonal storage and exceptional batches."
      evidence: "Dated production, meter and dispatch records with coverage statement"
    - id: dq_mass_and_energy_measurement
      applies_to: "Material and utility rows"
      requirement: "Use calibrated or verified measurement where material; disclose estimated shares, conversion factors, missing intervals and allocation drivers."
      evidence: "Calibration, invoices, meter reconciliation and uncertainty note"
    - id: dq_route_separation
      applies_to: "Direct, concentrated and reconstituted routes"
      requirement: "Keep route-specific input, yield, energy, water, waste and product records separate until route weighting."
      evidence: "Route-coded batch and production records"
    - id: dq_completeness
      applies_to: "All foreground processes"
