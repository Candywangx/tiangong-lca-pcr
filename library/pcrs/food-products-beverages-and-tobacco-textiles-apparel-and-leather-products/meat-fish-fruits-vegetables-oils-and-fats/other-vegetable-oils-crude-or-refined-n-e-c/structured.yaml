    reference: "European Commission, Commission Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries, 2019, https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj (retrieved 2026-08-23)"
