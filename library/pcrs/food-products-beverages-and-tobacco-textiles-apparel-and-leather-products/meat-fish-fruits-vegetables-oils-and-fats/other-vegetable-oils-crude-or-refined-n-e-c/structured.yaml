system_boundary:
  rules:
    - rule_id: boundary_route_complete
      applies_to: "foreground manufacture"
      rule: "Include every controlled operation from the declared receiving condition through release; a crude route stops after crude-oil finishing, while a refined route includes the actual degumming, neutralization when used, bleaching and deodorization steps."
      source_ids:
        - fao-oil-processing-1994
        - fao-cxc-79-2019
        - sun-rice-bran-oil-2022
        - gonzalez-sesame-biorefinery-2025
    - rule_id: boundary_atomic_exchanges
      applies_to: "inventory"
      rule: "Keep each botanical feedstock, electricity, steam, fuel, refrigerant, water, solvent, chemical, package, waste stream and emitted substance as a separate exchange."
      source_ids:
        - eu-fdm-bat-2019
        - eu-pef-method-2021
    - rule_id: boundary_route_conditionals
      applies_to: "conditional processes"
      rule: "Include only the feedstock, extraction, refining, winterization, storage, packaging and treatment operations actually performed; document bypassed or outsourced operations and link their datasets."
      source_ids:
        - fao-oil-processing-1994
        - fao-cxc-79-2019
    - rule_id: boundary_direct_releases
      applies_to: "emissions and wastes"
      rule: "Include measured or calculated direct releases after control equipment, wastewater transfers, spent media, residues, off-spec oil and packaging waste with medium and destination."
      source_ids:
        - eu-fdm-bat-2019
        - eu-pef-method-2021
    - rule_id: boundary_upstream_downstream
      applies_to: "linked life-cycle stages"
      rule: "Link purchased inputs upstream; exclude distribution, downstream formulation, use and end of life from this factory-gate foreground dataset unless separately added."
      source_ids:
        - iso-14044-2006
        - eu-pef-method-2021
