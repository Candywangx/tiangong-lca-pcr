allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "extraction, refining, utilities and packaging"
    rule: "Avoid allocation through process subdivision, submetering and direct assignment; assign botanical-oil-specific preparation and finishing directly to that oil."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: allocation_causal_physical
    applies_to: "inseparable oil and cake, meal, gums, soapstock or distillate"
    rule: "When subdivision is not feasible, use a physical relationship only when it reflects the causal relationship between inputs and outputs and document the parameter and moisture basis."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: allocation_economic_fallback
    applies_to: "remaining multi-output burden"
    rule: "If no defensible physical relationship exists, use economic allocation with consistent prices at the common process exit and report price period, currency and sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_waste_status
    applies_to: "residues and off-spec outputs"
    rule: "Treat an output as a co-product when it has a documented market or beneficial use; otherwise record it as waste with treatment destination and do not apply an avoided-burden credit inside this unit process."
    source_ids:
      - eu-pef-method-2021
      - jasaw-shea-resource-use-2015
  - rule_id: allocation_internal_loops
    applies_to: "recovered oil, solvent, water, heat and rework"
    rule: "Record internal transfers once and prevent simultaneous external input, product credit or waste burden for the same quantity."
    source_ids:
      - eu-pef-method-2021
      - eu-fdm-bat-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "oil_material_preparation_oil_extraction_crude_finishing_oil_refining"
      flow_role: "botanical feed and crude oil"
      record_type: "weighbridge, scale, tank gauge, supplier certificate, batch ticket"
      raw_fields: "botanical name; material state; lot; gross mass; tare; net mass; moisture; oil content when measured; origin; timestamp"
      collection_method: "reconcile accepted receipts, batch issues and stock"
      unit: "kg; % m/m"
      frequency: "each lot or batch"
      temporal_coverage: "same representative period as output"
      site_scope: "all represented sites and lines"
      aggregation_rule: "sum by exact botanical material and state; never aggregate different oils"
      quality_evidence: "calibration; supplier certificate; rejection record; stock reconciliation"
    - protocol_id: cp_process_outputs
      process_id: "all_production_processes"
      flow_role: "prepared feed, crude oil, refined oil and reference product"
      record_type: "scale, tank gauge, meter, batch and release record"
      raw_fields: "identity; route/state; mass; moisture; quality result; destination; opening/closing stock; timestamp"
      collection_method: "measure each transfer and reconcile tank or packaged stock"
      unit: "kg"
      frequency: "each batch; period reconciliation"
      temporal_coverage: "same period as inputs"
      site_scope: "every represented line"
      aggregation_rule: "sum conforming output by exact botanical identity and state"
      quality_evidence: "calibration; batch reconciliation; laboratory release"
    - protocol_id: cp_energy_records
      process_id: "all_included_processes"
      flow_role: "electricity and steam"
      record_type: "meter, submeter, invoice, steam flow and condition record"
      raw_fields: "meter readings; carrier; pressure; temperature; condensate return; equipment; batch assignment"
      collection_method: "direct metering preferred; otherwise documented causal allocation"
      unit: "kWh; MJ"
      frequency: "continuous or each batch; monthly reconciliation"
      temporal_coverage: "same period as output"
      site_scope: "all relevant meters and utility systems"
      aggregation_rule: "subtract non-production loads; prevent double counting fuel-generated energy"
      quality_evidence: "calibration; invoice; meter map; allocation worksheet"
    - protocol_id: cp_fuel_records
      process_id: "preparation_extraction_refining_release_and_utilities"
      flow_role: "each individual fuel"
      record_type: "flow meter, tank gauge, purchase, stock and fuel specification"
      raw_fields: "fuel identity; quantity; unit; density; heating value; sulfur; biomass moisture; equipment; period"
      collection_method: "reconcile purchase, stock and metering for each carrier"
      unit: "kg; m3; MJ"
      frequency: "continuous or each delivery; monthly reconciliation"
      temporal_coverage: "same period as output"
      site_scope: "every combustion unit"
      aggregation_rule: "convert with documented carrier-specific factors; no generic fuel total"
      quality_evidence: "meter calibration; invoice; fuel certificate; stock balance"
    - protocol_id: cp_water_records
      process_id: "preparation_extraction_and_refining"
      flow_role: "fresh and recirculated water"
      record_type: "supply meter, submeter, cleaning log"
      raw_fields: "source; readings; use; recirculation; evaporation estimate; destination"
      collection_method: "meter external make-up and internal loops separately"
      unit: "m3"
      frequency: "continuous or each event; monthly reconciliation"
      temporal_coverage: "same period as output"
      site_scope: "all represented water systems"
      aggregation_rule: "external withdrawal minus documented export; do not count recirculation as repeated input"
      quality_evidence: "calibration; utility bill; loop diagram; balance closure"
    - protocol_id: cp_solvent_balance
      process_id: "oil_extraction_crude_finishing"
      flow_role: "n-hexane"
      record_type: "purchase, stock, recovery meter, product/cake test, waste and emission record"
      raw_fields: "opening stock; purchase; closing stock; recovered solvent; product residue; cake residue; waste; release"
      collection_method: "complete period solvent mass balance"
      unit: "kg"
      frequency: "each batch plus period reconciliation"
      temporal_coverage: "same period as solvent route output"
      site_scope: "every solvent-using line"
      aggregation_rule: "input equals recovery, stock, residues, waste and releases within disclosed closure"
      quality_evidence: "stock count; recovery calibration; test report; waste manifest"
    - protocol_id: cp_chemical_records
      process_id: "oil_refining"
      flow_role: "each refining chemical or processing aid"
      record_type: "purchase, issue, recipe, return and stock record"
      raw_fields: "chemical identity; concentration; lot; opening; receipt; issue; return; closing; batch"
      collection_method: "calculate active substance separately for each chemical"
      unit: "kg active substance"
      frequency: "each batch; monthly reconciliation"
      temporal_coverage: "same period as output"
      site_scope: "all refining lines"
      aggregation_rule: "opening plus receipts minus closing and returns; assign by actual recipe"
      quality_evidence: "invoice; certificate; recipe authorization; stock count"
    - protocol_id: cp_refrigerant_records
      process_id: "preparation_and_release"
      flow_role: "ammonia refrigerant"
      record_type: "cylinder, service and recovery log"
      raw_fields: "refrigerant identity; opening stock; added; recovered; transferred; closing; incident"
      collection_method: "annual or campaign mass balance with event attribution"
      unit: "kg"
      frequency: "each service event; annual reconciliation"
      temporal_coverage: "same period as output"
      site_scope: "all included refrigeration systems"
      aggregation_rule: "make-up minus recovery and stock change equals loss by documented destination"
      quality_evidence: "service certificate; leak test; cylinder record"
    - protocol_id: cp_packaging_records
      process_id: "storage_packaging_release"
      flow_role: "each packaging component"
      record_type: "bill of materials, count, sample mass, purchase and scrap record"
      raw_fields: "material; component; units; sample mass; oil filled; return; scrap"
      collection_method: "count and verify component mass"
      unit: "kg; item"
      frequency: "each packaging format; monthly reconciliation"
      temporal_coverage: "same period as packaged output"
      site_scope: "all represented lines"
      aggregation_rule: "component mass divided by net conforming oil; bulk product records zero packaging"
      quality_evidence: "BOM; calibrated scale; purchase and scrap reconciliation"
    - protocol_id: cp_coproduct_records
      process_id: "extraction_and_refining"
      flow_role: "cake, gums, soapstock and distillate"
      record_type: "scale, tank gauge, sales and destination record"
      raw_fields: "identity; wet mass; dry matter; residual oil; quality; destination; price where allocated"
      collection_method: "measure each output and preserve product/waste decision"
      unit: "kg"
      frequency: "each batch or dispatch"
      temporal_coverage: "same period as output"
      site_scope: "every co-product outlet"
      aggregation_rule: "sum by identity and destination; retain allocation inputs"
      quality_evidence: "calibration; sale record; destination evidence; laboratory result"
    - protocol_id: cp_waste_records
      process_id: "all_included_processes"
      flow_role: "each waste stream"
      record_type: "scale, manifest, collection and treatment record"
      raw_fields: "waste identity; mass; moisture; hazardous status; destination; treatment; date"
      collection_method: "weigh each shipment or reconcile container counts"
      unit: "kg"
      frequency: "each shipment"
      temporal_coverage: "same period as output"
      site_scope: "all waste generation points"
      aggregation_rule: "sum by exact waste and destination"
      quality_evidence: "scale calibration; manifest; contractor receipt"
    - protocol_id: cp_wastewater_records
      process_id: "extraction_refining_and_treatment"
      flow_role: "wastewater and water emissions"
      record_type: "influent/discharge meter, flow-proportional sample, laboratory report"
      raw_fields: "volume; sampling time; COD; phosphorus; other substance concentrations; treatment; destination"
      collection_method: "meter flow and use representative composite sampling"
      unit: "m3; mg/L; kg"
      frequency: "continuous flow; sampling by permit or justified plan"
      temporal_coverage: "same period as output"
      site_scope: "all included discharge points"
      aggregation_rule: "concentration × volume; sum by substance and destination"
      quality_evidence: "meter calibration; chain of custody; accredited laboratory report"
    - protocol_id: cp_emission_records
      process_id: "all_included_processes"
      flow_role: "each direct air emission"
      record_type: "stack test, continuous monitor, fuel and operating record"
      raw_fields: "substance; concentration; flow; duration; fuel; control efficiency; uncertainty"
      collection_method: "direct measurement preferred; calculations retain formula and measured inputs"
      unit: "kg; mg/Nm3"
      frequency: "continuous or representative campaign"
      temporal_coverage: "same period as output"
      site_scope: "every included source"
      aggregation_rule: "calculate and sum separately by substance and medium"
      quality_evidence: "monitor calibration; stack report; factor review; control log"
    - protocol_id: cp_treatment_chemical_records
      process_id: "onsite_utilities_wastewater"
      flow_role: "each treatment chemical"
      record_type: "purchase, issue, concentration and stock record"
      raw_fields: "chemical; concentration; issue; return; opening/closing stock; treated volume"
      collection_method: "calculate active substance from solution records"
      unit: "kg active substance"
      frequency: "each batch; monthly reconciliation"
      temporal_coverage: "same period as wastewater"
      site_scope: "all treatment units"
      aggregation_rule: "assign to treated volume and normalize to released oil"
      quality_evidence: "invoice; certificate; stock reconciliation; operator log"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period amount × documented allocation share ÷ net released oil mass"
      inputs:
        - "measured amount"
        - "allocation share"
        - "released oil mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_mass_balance
      applies_to: "each production process"
      rule: "opening stock + product inputs = closing stock + product outputs + co-products + wastes + direct mass releases + unexplained difference"
      inputs:
        - "all mass and stock records"
      output: "balance closure and unexplained difference"
      source_ids:
        - eu-pef-method-2021
        - jasaw-shea-resource-use-2015
        - naangmenyele-shea-input-output-2023
    - id: calc_oil_yield
      applies_to: "extraction and refining"
      rule: "net conforming oil output ÷ as-received botanical feed or crude-oil input; report moisture, oil-content and route basis"
      inputs:
        - "input and output mass"
        - moisture
        - route
      output: "route-specific yield, not a category default"
      source_ids:
        - sun-rice-bran-oil-2022
        - gonzalez-sesame-biorefinery-2025
    - id: calc_solvent_closure
      applies_to: "solvent route"
      rule: "opening stock + purchases = closing stock + recovered solvent + product/cake residues + wastes + releases + unexplained difference"
      inputs:
        - "complete solvent records"
      output: "solvent closure and loss by destination"
      source_ids:
        - eu-fdm-bat-2019
        - sun-rice-bran-oil-2022
    - id: calc_water_emission
      applies_to: "treated discharge"
      rule: "emitted substance mass = discharge volume × flow-proportional concentration with unit conversion"
      inputs:
        - "discharge volume"
        - concentration
        - "sampling coverage"
      output: "kg substance per reference product"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_allocation_share
      applies_to: "multi-output processes"
      rule: "apply the declared subdivision and allocation hierarchy; shares across co-products at one common process shall sum to one"
      inputs:
        - "direct assignments"
        - "physical parameters or consistent prices"
      output: "reproducible allocation share"
      source_ids:
        - iso-14044-2006
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every product row"
      requirement: "Preserve one botanical identity, material state, process route and grade from receipt through release; do not substitute a generic vegetable-oil identity for missing facts."
      evidence: "supplier certificate; lot genealogy; process map; release specification"
    - id: dq_measurement
      applies_to: "mass, energy, water, solvent, chemical and emissions"
      requirement: "Use calibrated or verified systems and retain units, conversion factors, analytical methods, detection limits and uncertainty or limitations."
      evidence: "calibration register; laboratory report; conversion worksheet; meter map"
    - id: dq_temporal
      applies_to: "foreground period"
      requirement: "Use a representative production year where available; justify a campaign and cover start-up, shutdown, cleaning and route changes that materially affect results."
      evidence: "production calendar; downtime log; representativeness statement"
    - id: dq_completeness
      applies_to: "process and exchange coverage"
      requirement: "Reconcile material, solvent, water and energy records; disclose every missing measurement, proxy, exclusion and unresolved UUID; absence of a measurement is not evidence of zero."
      evidence: "balance worksheets; gap register; source-to-row trace"
    - id: dq_route_geography
      applies_to: "foreground and upstream datasets"
      requirement: "Match botanical origin, extraction/refining technology, site geography, electricity and fuel supply, water source and period, or document the proxy and bias."
      evidence: "dataset metadata; supplier record; proxy justification"
    - id: dq_allocation
      applies_to: "multi-output operations"
      requirement: "Retain subdivision evidence, quantities, physical parameters, prices, price period, currency and sensitivity needed to reproduce allocation."
      evidence: "allocation workbook; meter map; sales records; sensitivity result"
    - id: dq_range_status
      applies_to: "all important inventory rows"
      requirement: "Treat the absence of a range as an explicit evidence gap; do not create a range from one case or from equal lower and upper values."
      evidence: "manifest unresolved-range record; literature review; review decision"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Confirm exactly 1 kg net released oil, Mass property and mass unit group UUIDs, one botanical identity, one crude/virgin/cold-pressed/refined state and every required qualifier; fail if the unresolved product-flow UUID is represented as resolved."
    source_ids:
      - unsd-cpc-3-2025
      - eu-pef-method-2021
  - rule_id: validate_scope_route
    applies_to: "process map and boundary"
    rule: "Confirm that the starting condition and route match the included processes and that every bypassed, outsourced or non-applicable operation is disclosed and linked where needed."
    source_ids:
      - fao-oil-processing-1994
      - fao-cxc-79-2019
  - rule_id: validate_atomic_inventory
    applies_to: "all inventory rows"
    rule: "Reject any combined electricity/steam/fuel, chemical collection, packaging collection, waste collection or multi-substance emission row; each selected flow shall be one physical exchange."
    source_ids:
      - eu-fdm-bat-2019
      - eu-pef-method-2021
  - rule_id: validate_balances
    applies_to: "material, solvent, water and energy"
    rule: "Recalculate closures from raw records, investigate unexplained differences and prevent double counting internal recovery, recirculation and utility conversion."
    source_ids:
      - eu-fdm-bat-2019
      - eu-pef-method-2021
  - rule_id: validate_refining_route
    applies_to: "refined oil"
    rule: "Verify whether the route is chemical or physical and whether degumming, neutralization, bleaching and deodorization inputs, residues, wastewater and operating conditions match the declared route."
    source_ids:
      - fao-cxc-79-2019
      - fao-oil-processing-1994
  - rule_id: validate_coproduct_allocation
    applies_to: "cake, meal, gums, soapstock and distillate"
    rule: "Confirm product-versus-waste status, avoid allocation where feasible, apply the hierarchy consistently and require all shares at a common process to sum to one."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: validate_data_quality
    applies_to: "foreground package"
    rule: "Check identity, calibration, temporal coverage, site and route representativeness, source traceability, missing UUIDs, range gaps, proxies, cut-offs and update triggers."
    source_ids:
      - eu-pef-method-2021
      - eu-fdm-bat-2019
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate unit-process dataset for one botanically identified other vegetable oil in one declared factory-gate state"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA models whose botanical oil, crude/refined state, route, grade, technology, geography, period and packaging match the dataset and whose upstream boundary is linked at the declared starting condition"
  excluded_use: "Unspecified average vegetable oil; substitution for separately classified named oils; comparison of botanical oils or crude/refined states without aligned functions and qualifiers; chemically modified oil; cradle-to-gate claim when cultivation or received crude-oil production is absent"
  required_metadata: "PCR id and lifecycle state; botanical common and scientific name; oil-bearing material; product state; route; grade/specification; site and geography; period; process map; energy, water and solvent systems; co-products and allocation; packaging; source ids; unresolved UUIDs and range evidence"
  required_quality_disclosure: "Measurement and calibration coverage; material, solvent, water and energy closure; temporal, technological and geographical representativeness; missing data and proxies; cut-offs; allocation sensitivity; unresolved flow identities; absence of source-backed ranges; limitations"
  update_trigger: "Change in botanical input, extraction or refining route, grade/specification, energy or water supply, solvent system, co-product destination or price, allocation, packaging, treatment, site coverage or data period; resolution of a UUID or range evidence gap"
data_sources:
  - id: "unsd-cpc-3-2025"
