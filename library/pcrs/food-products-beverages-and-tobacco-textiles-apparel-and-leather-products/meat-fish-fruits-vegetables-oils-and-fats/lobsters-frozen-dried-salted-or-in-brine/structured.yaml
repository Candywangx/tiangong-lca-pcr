allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Lots, routes, and independently metered operations"
    rule: "First separate lots and preservation routes and use direct mass and utility records; do not allocate burdens from an unperformed route or average unlike route inventories."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_inputs
    applies_to: "Shared utilities, storage, and common preparation"
    rule: "Prefer a documented physical causal parameter such as equipment time, thermal load, or metered use. Use mass only when it reasonably represents the physical relation; if no physical relation is defensible, use documented economic allocation and report a sensitivity result."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residues
    applies_to: "Shells, meat fractions, and other secondary outputs"
    rule: "Treat discarded or treatment-bound material as waste with treatment included. If an output is intentionally produced and sold as a co-product, disclose its status, quantity, price or physical relation, allocation method, and sensitivity; do not credit an unverified market."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_mass_balance
      process_id: "receiving_preparation_preservation_route_packing_storage"
      flow_role: "Material inputs, transfers, outputs, residues, wastewater, packaging"
      record_type: "Scales, invoices, issue records, drain meter or batch mass balance"
      raw_fields: "batch_id, route_id, species, presentation, received_mass_kg, water_kg, ice_kg, prepared_mass_kg, salt_kg, brine_water_kg, preserved_mass_kg, packaging_by_material_kg, final_net_mass_kg, glaze_kg, free_brine_kg, residues_by_destination_kg, wastewater_kg, spent_brine_kg"
      collection_method: "Calibrated scales and meters; reconcile transfers by batch"
      unit: "kg"
      frequency: "Each batch; utilities at shortest representative meter interval"
      temporal_coverage: "Representative production year, with season and atypical lots identified"
      site_scope: "Each included facility and route"
      aggregation_rule: "Sum by homogeneous route and lot, then normalize by qualifying final net mass; production-weight only after route-specific results are retained"
      quality_evidence: "Calibration, invoices, batch sheets, reconciliation, destination records, and missing-data log"
    - protocol_id: cp_utility_records
      process_id: "preservation_route_packing_storage"
      flow_role: "Electricity and thermal energy"
      record_type: "Submeters, fuel records, invoices, equipment runtime and rated load"
      raw_fields: "meter_id, carrier, opening_reading, closing_reading, unit, route_id, equipment_id, runtime_h, allocation_driver, storage_duration"
      collection_method: "Meter by operation where possible; otherwise document physical allocation"
      unit: "native kWh, MJ, kg, or m3"
      frequency: "Meter interval or each campaign"
      temporal_coverage: "Same representative period as production"
      site_scope: "Each energy system serving included operations"
      aggregation_rule: "Subtract opening from closing, deduct excluded loads, allocate with disclosed physical driver, and preserve carrier-specific results"
      quality_evidence: "Meter calibration, invoice reconciliation, load map, and allocation worksheet"
    - protocol_id: cp_route_control_records
      process_id: "preservation_route"
      flow_role: "Preservation controls and product acceptance"
      record_type: "Batch control, laboratory, and food-safety records"
      raw_fields: "route_id, time, product_temperature, room_temperature, salt_mass_fraction, brine_concentration, moisture, water_activity, cooking_state, nonconformance, rework"
      collection_method: "Record parameters required by the applicable route specification and sampling plan"
      unit: "native units including h, °C, %, and water activity"
      frequency: "Each batch or validated continuous logger interval"
      temporal_coverage: "Full included production period"
      site_scope: "Each route and line"
      aggregation_rule: "Keep route-specific distributions and link rejected or reworked lots to the mass balance"
      quality_evidence: "Calibrated instruments, laboratory methods, logger completeness, corrective-action records"
    - protocol_id: cp_cold_chain_records
      process_id: "packing_storage"
      flow_role: "Frozen storage and refrigerant"
      record_type: "Temperature loggers, refrigerant inventory and service logs"
      raw_fields: "equipment_id, refrigerant_identity, opening_charge_kg, additions_kg, recovered_kg, closing_charge_kg, frozen_throughput_kg, storage_duration, temperature_series"
      collection_method: "Continuous temperature logging and reconciled refrigerant balance"
      unit: "°C, h or day, kg"
      frequency: "Continuous temperature; each service event and annual/campaign balance"
      temporal_coverage: "Full frozen-product period"
      site_scope: "Each refrigeration system serving included product"
      aggregation_rule: "Allocate calculated loss and energy only to served frozen throughput with disclosed driver"
      quality_evidence: "Logger calibration/completeness and signed service records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory quantities"
      rule: "normalized amount = qualifying route-specific quantity / final net target-product mass; packaging, glaze, and free brine are excluded from the denominator"
      inputs:
        - "Route-specific collected quantity"
        - final_net_mass_kg
      output: "Amount per 1 kg reference flow"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "Each batch and route"
      rule: "unexplained mass = total mass inputs - identified product, co-product, waste, wastewater, moisture, and other outputs; report the signed difference and investigate material imbalance"
      inputs:
        - "All mass fields from cp_batch_mass_balance and moisture from cp_route_control_records"
      output: "Yield, residue fractions, and unexplained mass"
      source_ids: []
    - id: calc_route_weighting
      applies_to: "Multi-lot reporting"
      rule: "Calculate each declared route separately; if a portfolio result is required, production-weight route results by qualifying net product mass and publish the route shares and route-specific results alongside it"
      inputs:
        - "Route-specific normalized results"
        - "route final_net_mass_kg"
      output: "Transparent route-specific and optional portfolio results"
      source_ids: []
    - id: calc_refrigerant_loss
      applies_to: "Frozen-route refrigeration"
      rule: "loss = opening charge + additions - recovered refrigerant - closing charge; allocate only a positive reconciled loss using the documented refrigeration-service driver"
      inputs:
        - "Refrigerant charge and service fields"
        - "served frozen throughput"
      output: "kg refrigerant emission per kg frozen target product"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and route"
      requirement: "Species, CPC scope, preservation route, presentation, cooked/raw state, net-mass convention, origin, and lot linkage shall be complete."
      evidence: "Product specification, supplier record, lot traceability, and batch sheet; unsd-cpc-3-0; codex-cxc-52-2003"
    - id: dq_measurement
      applies_to: "Mass, utilities, controls, and refrigerant"
      requirement: "Use calibrated or reconciled measurements; retain native units, conversion factors, allocation drivers, and treatment destinations."
      evidence: "Calibration certificates, invoices, meter records, laboratory methods, service logs; eu-pef-2021-2279"
    - id: dq_temporal
      applies_to: "Representative production"
      requirement: "Cover a representative production year or justify a shorter campaign; disclose seasonality, downtime, exceptional losses, and storage duration."
      evidence: "Coverage report and production schedule; eu-pef-2021-2279"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Reconcile every included route from received lobster to qualifying product and identify unmeasured water, ice, energy, salt/brine, packaging, residues, wastewater, moisture, and refrigerant flows."
      evidence: "Mass/energy reconciliation and missing-data log"
    - id: dq_food_safety
      applies_to: "Route acceptance"
      requirement: "Retain applicable hygiene and preservation-control evidence. For quick-frozen lobster, verify the applicable temperature requirement and document deviations and corrective action."
      evidence: "Route-control records; codex-cxc-52-2003; codex-cxs-95-1981"
    - id: dq_estimates
      applies_to: "Provisional ranges and substituted data"
      requirement: "Reasoned-estimate ranges are QA screens only, not foreground values; disclose every proxy and replace it with reviewed evidence before activation."
      evidence: "Data-quality disclosure and manifest review metadata"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Reference flow and product metadata"
    rule: "Fail if the reference amount is not 1 kg net target-product mass, the product UUID or Mass UUID/unit group differs, or any required product or route qualifier is missing."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: validate_route
    applies_to: "Process inventory"
    rule: "Fail if alternative route inputs are included without an actual declared route, if unlike routes are unconditionally averaged, or if sequential preservation lacks batch evidence."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_balance
    applies_to: "Batch mass and energy records"
    rule: "Flag unexplained mass, negative calculated refrigerant loss, missing conversion factors, or unresolved allocation; the producer shall investigate and disclose the resolution rather than silently balancing."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_frozen_control
    applies_to: "Frozen products"
    rule: "Require complete time-temperature records and conformity with the applicable quick-frozen lobster specification; nonconforming or reworked lots remain represented in resource and waste flows."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-95-1981
  - rule_id: validate_sources_and_estimates
    applies_to: "Evidence and data quality"
    rule: "Fail activation readiness while non-reference UUIDs or source-backed replacements for provisional reasoned-estimate ranges remain unresolved; candidate use shall disclose these limits."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production dataset for preserved lobster at the facility gate"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product-footprint and LCA models matching the declared lobster species, source, preservation route, presentation, geography, technology, and reference period"
  excluded_use: "Fresh or live lobster; other crustaceans; undeclared mixes of freezing, drying, salting, and brining; consumer-ready meals; comparisons that ignore material route, origin, or allocation differences"
  required_metadata: "PCR id/version, facility and geography, period, species and source, raw/cooked state, presentation, preservation route, net-mass convention, yield, storage time and temperature, packaging, allocation, upstream datasets, proxy and estimate flags"
  required_quality_disclosure: "Route-specific coverage, measurement and calibration, missing data, mass/energy balance, cold-chain and food-safety records, co-product/waste treatment, allocation sensitivity, provisional estimates, UUID gaps, and source representativeness"
  update_trigger: "Change in species/source, preservation route, cooking or presentation, facility technology, energy/refrigerant system, yield, packaging, allocation, regulation/specification, or data older than the accepted representativeness period"
