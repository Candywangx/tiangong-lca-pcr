      collection_method: "Use process meters where available; otherwise reconcile facility records with a documented causal allocation driver."
      unit: "kg; kWh"
      frequency: "per_batch_or_shift"
      temporal_coverage: "reporting_period"
      site_scope: "foreground_site"
      aggregation_rule: "Allocate only the slaughter share and normalize through released product mass."
      quality_evidence: "Meter coverage; calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_slaughter_mass_balance
