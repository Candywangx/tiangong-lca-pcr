      applies_to: "product_scope"
      rule: "Exclude fresh or chilled turkey meat, poultry edible offal, meat of other poultry species, mechanically separated meat, and prepared or preserved turkey products from the reference product."
      source_ids:
        - un-cpc-3-0-2025
