validation_rules:
  - rule_id: validate_cpc_scope
    applies_to: "reference_product"
    rule: "Reference product identity must be exact CPC 21144 frozen turkey meat; reject fresh or chilled turkey meat, edible offal, other poultry species, mechanically separated meat, and prepared products."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_reference_uuid
    applies_to: "reference_product"
    rule: "Reference product flow UUID must equal 2cf4dbce-c2cf-4ca6-a1bc-5366fad13063 and use the verified Mass property, Units of mass group, and kg reference unit."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_reference_amount
    applies_to: "reference_product"
    rule: "Normalized reference output must equal exactly 1 kg net released product after packaging tare exclusion."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_frozen_state
    applies_to: "reference_product"
    rule: "Frozen-state criterion, product-core measurement point, release temperature record, storage temperature, and storage duration must be declared."
