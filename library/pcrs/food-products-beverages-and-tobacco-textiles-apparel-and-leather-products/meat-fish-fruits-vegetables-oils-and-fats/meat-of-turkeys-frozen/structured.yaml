allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "all_foreground_processes"
    rule: "Use process subdivision, separate metering, batch tracing, and direct assignment before applying allocation."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_physical_relation
    applies_to: "joint_process_outputs"
    rule: "When subdivision cannot avoid allocation, use a documented physical relationship that reflects the causal relation between inputs, operations, and separately marketed outputs."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_economic_fallback
    applies_to: "joint_process_outputs"
    rule: "Use economic allocation only when no defensible physical relationship can be established; use contemporaneous net values and document price source, period, currency, and sensitivity."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_named_coproducts
    applies_to: "blood_feathers_offal_fat_bone_skin_trim"
    rule: "Classify every named output by actual destination as product, co-product, recyclable material, or waste before allocation; do not group destinations."
    source_ids:
      - eu-jrc-sa-bref-2024
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_waste_treatment
    applies_to: "waste_and_wastewater"
    rule: "Assign treatment burdens to the process generating the named waste or wastewater stream unless a documented shared-treatment causal driver is applied consistently."
    source_ids:
      - eu-jrc-sa-bref-2024
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_reusable_packaging
    applies_to: "reusable_packaging"
    rule: "Allocate reusable crate and pallet manufacture over documented realized or expected use cycles, and disclose losses and return geography."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_mass_balance_check
    applies_to: "all_material_outputs"
    rule: "Reconcile allocated and unallocated quantities against the same batch mass balance; allocation must not create or remove physical mass."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_disclosure
    applies_to: "dataset_metadata"
    rule: "Disclose subdivision, allocation hierarchy, factors, factor sources, co-product destinations, excluded credits, and sensitivity results."
    source_ids:
      - eu-pef-recommendation-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_lairage_records
      process_id: "live_turkey_receiving_lairage"
      flow_role: "received_birds; drinking_water; utilities; mortality; manure; litter; wastewater; air_releases"
      record_type: "weighbridge_log; bird_count_log; meter_log; waste_transfer_record"
      raw_fields: "supplier_lot_id; bird_count; live_mass_kg; water_kg; electricity_kwh; fuel_kg; mortality_kg; manure_kg; litter_kg; wastewater_kg; operating_hours"
      collection_method: "Use calibrated receiving scales, meters, stock reconciliation, environmental monitoring, and destination records."
      unit: "kg; kWh; count"
      frequency: "per_batch"
      temporal_coverage: "reporting_period"
      site_scope: "foreground_site"
      aggregation_rule: "Attribute records to the received lot and normalize through released product mass."
      quality_evidence: "Calibration records; lot reconciliation; waste destination evidence; monitoring method"
    - protocol_id: cp_slaughter_utility_records
      process_id: "turkey_slaughter_dressing"
