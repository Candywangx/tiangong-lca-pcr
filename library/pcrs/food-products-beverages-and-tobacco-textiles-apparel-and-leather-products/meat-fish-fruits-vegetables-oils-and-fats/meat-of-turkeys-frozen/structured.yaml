      - eu-jrc-sa-bref-2024
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_refrigerant_balance
    applies_to: "refrigerant_rows"
    rule: "Validate separate make-up and release balances for R717, R744, R404A, and R507A; reject any combined refrigerant row."
    source_ids:
      - eu-jrc-sa-bref-2024
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_chemical_separation
    applies_to: "chemical_rows"
    rule: "Validate each cleaning, disinfection, and wastewater-treatment chemical as a separately identified formulation with concentration and quantity."
    source_ids:
      - eu-jrc-sa-bref-2024
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_packaging_tare
    applies_to: "packaging_rows"
    rule: "Validate separate packaging-component records, packaging-tare exclusion from product mass, and disclosed allocation for reusable items."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_byproduct_destinations
