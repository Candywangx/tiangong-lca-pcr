validation_rules:
  - rule_id: vr_reference_uuid
    applies_to: "Reference flow identity"
    rule: "Reference output UUID equals be81d099-544d-4fdf-be56-81f76427d52f, flow type is Product flow, CPC is 21132, and flow property is Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: vr_reference_amount
    applies_to: "Reference amount"
    rule: "Quantitative reference equals 1,000 kg net deboned frozen buffalo meat."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: vr_temperature
    applies_to: "Freezing and frozen storage"
    rule: "A calibrated record shows product thermal centre ≤ -18 °C after stabilization and frozen storage ≤ -18 °C."
    source_ids:
      - fao-who-cxc-8-1976
  - rule_id: vr_route_complete
    applies_to: "Required process route"
    rule: "All seven required processes are present or a disclosed equivalent preserves every inventory boundary."
    source_ids:
      - ec-jrc-sa-bref-2024
  - rule_id: vr_atomic_flows
    applies_to: "All foreground exchanges"
    rule: "Electricity, natural gas, water, wastewater, ammonia, packaging, chemicals, solid residues, fossil CO2 and NOx remain separate atomic flows."
    source_ids:
      - eu-sa-bat-2023-2749
      - eu-pef-2021-2279
  - rule_id: vr_transfer_balance
    applies_to: "Internal transfers"
    rule: "Each internal product-flow output matches the next process input by lot."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: vr_species_product_separation
    applies_to: "Reference product and co-products"
    rule: "Carcass, bone-in meat, edible offal, hide, blood, bones and saleable trim are not included in the reference product mass."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: vr_allocation
    applies_to: "Shared burdens and co-products"
    rule: "Subdivision is attempted first; any economic fallback discloses buffalo-specific masses, prices, period and sensitivity and uses no cattle default factor."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: vr_storage_duration
    applies_to: "Frozen storage"
    rule: "Frozen-storage duration and tonne-days are declared; storage electricity is not represented as an unqualified monthly total."
    source_ids:
      - fao-who-cxc-8-1976
  - rule_id: vr_estimates
    applies_to: "Reasoned estimates"
    rule: "Every reasoned_estimate is flagged as provisional and accompanied by a replacement or confirmation record."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: vr_uuid_resolution
    applies_to: "Non-reference UUID fields"
    rule: "Non-reference Tiangong UUIDs remain unresolved and must not be invented; resolve them before a UUID-bearing exchange is published."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground unit-process package and factory-gate aggregation for one deboned frozen buffalo-meat route"
  downstream_use: "Cradle-to-gate or life-cycle models after linking upstream supply and downstream treatment/market datasets"
  allowed_use: "Site-specific LCA, EPD/PCR development support, process improvement and audited inventory compilation where route qualifiers match"
  excluded_use: "Generic cattle or mixed-meat proxy; carcass, bone-in, offal, minced or prepared buffalo products; unqualified national average"
  required_metadata: "Reference qualifiers, geography, period, technology, process map, meter coverage, mass balance, allocation, co-product masses/prices, frozen-storage duration, temperature evidence, treatment destinations"
  required_quality_disclosure: "All proxies, exclusions, engineering allocations, reasoned estimates, unresolved UUIDs and deviations from the seven-process map"
  update_trigger: "Material change in species/product specification, yield, allocation, refrigerant, freezer, energy source, packaging, storage duration, plant geography or evidence base"
