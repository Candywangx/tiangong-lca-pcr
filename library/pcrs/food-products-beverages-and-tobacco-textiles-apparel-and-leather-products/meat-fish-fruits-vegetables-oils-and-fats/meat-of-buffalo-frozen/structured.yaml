      applies_to: "foreground_system_boundary"
      rule: "Included foreground operations are animal holding, potable-water use, stunning/bleeding/dressing, segregation of edible and inedible material, chilling, temperature-controlled deboning, packaging, quick freezing, frozen storage, refrigeration loss, cleaning and sanitation, wastewater generation, solid residues, and on-site combustion emissions. Codex requires hygienic separation, controlled deboning and packaging, rapid cooling and cold-chain records (fao-who-cxc-58-2005; fao-who-cxc-8-1976). Resource, wastewater, waste and refrigerant inventories are mandatory because they are explicit environmental-performance inventory elements for slaughterhouses (eu-sa-bat-2023-2749)."
