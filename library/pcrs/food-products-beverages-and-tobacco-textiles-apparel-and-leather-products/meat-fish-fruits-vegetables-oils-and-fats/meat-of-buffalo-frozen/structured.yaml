allocation_rules:
  - rule_id: al_subdivide_first
    applies_to: "All processes"
    rule: "Subdivide metered inputs, wastes and emissions by physical line or process before any allocation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_direct_causality
    applies_to: "Chilling, deboning, packaging, freezing and storage"
    rule: "Assign flows directly to the product or co-product that causes them using mass throughput, runtime, refrigerated volume or tonne-day only where that driver is demonstrably causal."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_slaughter_coproducts
    applies_to: "Slaughter and dressing"
    rule: "Keep carcass, edible offal, hide and collected blood as separate outputs. Where subdivision is impossible, use a site-specific economic allocation based on contemporaneous plant-gate revenue and disclose masses, prices, period and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_deboning_coproducts
    applies_to: "Cutting and deboning"
    rule: "Keep deboned meat, saleable fat/trimmings and food-grade bones separate. Apply the same subdivision-first and site-specific economic fallback hierarchy."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_no_bovine_default
    applies_to: "All co-products"
    rule: "Do not apply cattle default allocation factors to buffalo; the cited PEF slaughterhouse defaults do not provide a buffalo factor."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: al_waste_no_credit
    applies_to: "Wastes"
    rule: "A zero-revenue waste receives no co-product allocation, but the generating process retains collection and pre-treatment burdens. Any avoided-burden scenario must be reported separately."
    source_ids:
      - eu-pef-2021-2279
