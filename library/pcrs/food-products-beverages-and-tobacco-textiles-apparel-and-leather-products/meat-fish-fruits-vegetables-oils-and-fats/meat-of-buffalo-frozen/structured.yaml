  calculation_rules:
    - id: cr_normalize
      applies_to: "Every inventory flow"
      rule: "normalized amount = period flow × 1,000 / conforming net reference-product kg"
      inputs:
        - "period flow"
        - "conforming product mass"
      output: "amount per 1,000 kg"
      source_ids:
        - eu-pef-2021-2279
    - id: cr_transfer_match
      applies_to: "Internal product flows"
      rule: "Upstream output and downstream input must match by lot before losses in the next process are calculated."
      inputs:
        - "paired transfer records"
      output: "reconciled internal flow"
      source_ids:
        - eu-pef-2021-2279
    - id: cr_mass_closure
      applies_to: "Each transformation"
      rule: "Report mass inputs - product outputs - waste outputs - measured mass loss; investigate absolute unexplained imbalance above 2% of total mass input."
      inputs:
        - "mass records"
      output: "closure and unexplained balance"
      source_ids:
        - reasoned_estimate
    - id: cr_storage_energy
      applies_to: "Frozen storage"
      rule: "storage intensity = frozen-store electricity / tonne-days; add lot-attributed blast-freezing electricity separately."
      inputs:
        - kWh
        - "daily inventory"
        - days
      output: "kWh per reference product"
      source_ids:
        - fao-who-cxc-8-1976
    - id: cr_refrigerant_release
      applies_to: "Chilling/freezing"
      rule: "release = opening charge + additions - closing charge - recovered amount; negative results require investigation."
      inputs:
        - "circuit refrigerant log"
      output: "kg ammonia to air"
      source_ids:
        - eu-sa-bat-2023-2749
    - id: cr_economic_allocation
      applies_to: "Unsubdividable co-product burden"
      rule: "allocated share_i = revenue_i / sum positive co-product revenue; report price basis and sensitivity."
      inputs:
        - mass
        - "plant-gate price"
        - period
      output: "allocated burden share"
      source_ids:
        - eu-pef-2021-2279
