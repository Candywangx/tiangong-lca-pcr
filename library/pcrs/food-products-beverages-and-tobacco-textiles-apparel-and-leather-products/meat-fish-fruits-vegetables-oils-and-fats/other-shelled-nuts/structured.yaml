system_boundary:
  rules:
    - rule_id: sb_foreground_gate
      applies_to: "foreground production"
      rule: "Include lot receipt and identity control, applicable shelling and separation, cleaning or conditioning, sorting and grading, optional product-specific safety treatment, packing, and controlled on-site storage through dispatch. An omitted listed operation must be marked not applicable with the product and route reason."
      source_ids:
        - codex-cxc-6-1972-tree-nuts
        - eu-recommendation-2021-2279-pef
    - rule_id: sb_upstream_links
      applies_to: "cradle-to-gate projection"
      rule: "Keep agricultural production, supplier processing, purchased energy and materials, and inbound transport outside the foreground gate only when their product-specific upstream datasets are linked and the exclusion from direct foreground collection is disclosed."
      source_ids:
        - eu-recommendation-2021-2279-pef
    - rule_id: sb_downstream_limit
      applies_to: "dataset use"
      rule: "Distribution beyond facility dispatch, retail, consumer preparation or consumption, and end-of-life are outside this foreground dataset. A full life-cycle study must add and justify the applicable downstream stages and may not present this gate-to-gate dataset alone as a complete PEF study."
      source_ids:
        - eu-recommendation-2021-2279-pef
    - rule_id: sb_standard_scope
      applies_to: "product-specific standard use"
      rule: "Use CXC 6-1972 process and hygiene provisions only for tree nuts covered by its scope. Use DDP-06 only for qualifying sweet whole almond kernels. For non-tree nuts and other product forms, apply verified product-specific legal or technical rules or require manual review."
      source_ids:
        - codex-cxc-6-1972-tree-nuts
        - unece-ddp-06-almond-kernels-2024
        - unsd-cpc-3-0-explanatory-notes-2025
boundary_abstraction:
  declared_starting_condition: "Nut material received at the first foreground-controlled operation, identified by species, origin, crop year or lot, in-shell or shelled state, moisture basis, prior treatment, and supplier."
  starting_condition_role: "Foreground gate input. Include shelling when in-shell material is received; treat already-shelled material as a same-category recursive input rather than recreating its upstream production."
  product_classification_scope: "Output product must be confirmed within CPC 3.0 subclass 21429. The Almond UUID is an almond-only representative and is not a scope-equivalent identity for the subclass."
  recursive_input_rule: "Record purchased or transferred shelled nuts of the same category as a technosphere input with an upstream dataset. Do not re-run the generic shelling route or silently substitute the Almond UUID."
  upstream_dataset_requirement: "Link product-specific upstream datasets for received nut material, electricity, fuels, water supply, packaging materials, transport, and treatment services needed by the study boundary. Unresolved product identity requires manual review."
  disclosure: "Declare species, product-flow decision, origin, lot or crop year, receipt state, processing and treatment route, mass and moisture bases, yield, reject and co-product disposition, packaging, storage conditions, geography, technology, time period, and all foreground exclusions."
