allocation_rules:
  - rule_id: alloc_avoid
    applies_to: "all multifunctional foreground processes"
    rule: "First avoid allocation by collecting subdivided process data or, when consistent with the study goal, by system expansion. Keep directly attributable inputs and emissions with the product or function that causes them."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: alloc_physical
    applies_to: "unavoidable allocation among kernels, shells, hulls, downgraded products, or services"
    rule: "When subdivision or system expansion is not possible, use a documented, quantifiable physical relationship relevant to the functions delivered. Mass allocation is not automatic; justify why mass reflects the underlying relationship and use aligned moisture bases."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: alloc_economic
    applies_to: "multifunctionality with no defensible physical relationship"
    rule: "If economic allocation is used, document product status, market, price source, averaging period, currency, and calculation; apply the method consistently and disclose a sensitivity check. Do not assign zero burden solely because an output has low value."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: alloc_disposition
    applies_to: "shells, hulls, rejects, fines, and downgraded product"
    rule: "Classify each output once as reference product, co-product, or waste from documented disposition. Do not duplicate it between product and waste rows. Waste treatment burdens remain linked to the process unless the chosen reviewed method states otherwise."
    source_ids:
      - eu-recommendation-2021-2279-pef
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_identity_mass
      process_id: "lot_receipt_shelling_separation_kernel_conditioning_grading"
      flow_role: "received, accepted, and transferred nut material"
      record_type: "receiving ticket, scale record, lot genealogy record"
      raw_fields: "lot_id; supplier; common_name; scientific_name; origin; crop_year; receipt_state; treatment_state; gross_mass; tare_mass; net_mass; moisture_value; moisture_method; product_flow_uuid_decision"
      collection_method: "calibrated scales plus identity and traceability review"
      unit: "kg; percent moisture"
      frequency: "every lot and transfer"
      temporal_coverage: "declared reporting period"
      site_scope: "each reporting facility and line"
      aggregation_rule: "retain lot-level records; aggregate only after reconciling transfers and moisture bases"
      quality_evidence: "calibration record; signed receiving record; supplier specification; flow-identity review decision"
    - protocol_id: cp_mass_outputs_disposition
      process_id: "lot_receipt_shelling_separation_kernel_conditioning_grading"
      flow_role: "products, co-products, rejects, shells, hulls, fines, and wastewater"
      record_type: "scale ticket, bin count with item mass, waste manifest, transfer record"
      raw_fields: "lot_id; output_type; mass_or_volume; moisture_basis; destination; product_or_waste_status; customer_or_treatment"
      collection_method: "weigh each stream or use documented container count conversion; meter wastewater when applicable"
      unit: "kg; m3"
      frequency: "every batch or removal event"
      temporal_coverage: "same period as product output"
      site_scope: "each reporting facility and process"
      aggregation_rule: "sum by process, output status, and destination; prevent duplicate product/waste classification"
      quality_evidence: "scale calibration; destination receipt; waste manifest; conversion record"
    - protocol_id: cp_resources_operations
      process_id: "shelling_separation_kernel_conditioning_grading"
      flow_role: "electricity, fuel, water, process aids, wastewater, and direct emissions"
      record_type: "meter, invoice, fuel issue, chemical issue, maintenance and abatement log"
      raw_fields: "timestamp; meter_id; opening_reading; closing_reading; fuel_or_material; quantity; unit; process; allocation_driver; production_lot; emission_factor_source"
      collection_method: "direct submetering preferred; otherwise documented allocation from shared records"
      unit: "native unit; kWh; MJ; kg; m3"
      frequency: "each batch or at the shortest available meter interval"
      temporal_coverage: "same period as covered production"
      site_scope: "each reporting facility and relevant equipment"
      aggregation_rule: "subtract documented non-production use; allocate shared records using the declared driver; normalize after lot mass reconciliation"
      quality_evidence: "meter calibration; invoices; issue logs; factor reference; allocation worksheet"
    - protocol_id: cp_quality_and_product_release
      process_id: "kernel_conditioning_grading_packing_storage"
      flow_role: "graded and released shelled product"
      record_type: "laboratory result, inspection sheet, release certificate"
      raw_fields: "lot_id; common_name; scientific_name; form; treatment_state; moisture_value; moisture_method; defects; grade_or_specification; origin; crop_year; release_mass; standard_claim"
      collection_method: "product-specific sampling and recognized test or inspection method"
      unit: "kg; percent; declared defect unit"
      frequency: "every released lot"
      temporal_coverage: "same period as production"
      site_scope: "each product and facility"
      aggregation_rule: "no cross-species averaging; retain result with the released lot"
      quality_evidence: "laboratory accreditation or method; inspector record; applicable standard and scope decision"
    - protocol_id: cp_packing_storage
      process_id: "packing_storage"
      flow_role: "packaging, packed product, storage energy, losses, and refrigerant"
      record_type: "packaging issue, packing line record, warehouse log, meter, refrigerant service record"
      raw_fields: "lot_id; package_component; material; issued_quantity; returned_quantity; packed_gross_mass; tare_mass; storage_start; storage_end; storage_condition; energy; refrigerant_recharge; refrigerant_recovery; loss_destination"
      collection_method: "measured issue and mass records linked to warehouse and maintenance logs"
      unit: "kg; count; kWh; MJ; day"
      frequency: "every packing lot and storage period"
      temporal_coverage: "same period as dispatch output"
      site_scope: "each reporting facility and storage system"
      aggregation_rule: "calculate net dispatched mass; aggregate storage loads over actual lot residence time; reconcile refrigerant recharge and recovery"
      quality_evidence: "package specification; scale and meter calibration; warehouse log; service invoice"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "packed dispatch product"
      rule: "net product mass = packed gross mass - tare and excluded packaging mass; normalize all inventory quantities by net dispatched mass"
      inputs:
        - "packed gross mass"
        - "tare mass"
        - "packaging mass"
        - "released lot identity"
      output: "kg net reference product and normalized inventory per kg"
      source_ids:
        - eu-recommendation-2021-2279-pef
    - id: calc_process_yield
      applies_to: "receipt, shelling, conditioning, and grading"
      rule: "yield = aligned-basis product output mass / aligned-basis accepted input mass; report species, route, and moisture basis with the result"
      inputs:
        - "accepted input mass"
        - "product output mass"
        - "moisture values and conversions"
      output: "product-specific process yield"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "each foreground process and full foreground route"
      rule: "mass-balance difference = aligned-basis input mass - sum of product, co-product, waste, measured emission, and documented inventory-change masses; investigate and disclose the difference without applying an invented tolerance"
      inputs:
        - "all input and output masses"
        - "inventory change"
        - "moisture conversions"
      output: "reconciled mass balance and disclosed residual"
      source_ids: []
    - id: calc_resource_intensity
      applies_to: "energy, water, process aids, and packaging"
      rule: "resource intensity = reconciled resource quantity / applicable process output or net reference product mass, using documented unit conversion"
      inputs:
        - meter
        - invoice
        - issue
        - "and output records"
      output: "resource use per declared basis"
      source_ids:
        - eu-recommendation-2021-2279-pef
    - id: calc_allocation_factors
      applies_to: "multifunctional process"
      rule: "apply alloc_avoid, then alloc_physical, then alloc_economic; factors for included co-products must sum to the complete allocated share and be retained with source data"
      inputs:
        - "subdivision evidence"
        - "physical driver"
        - "or price and market records"
      output: "documented allocation factors and allocated inventory"
      source_ids:
        - eu-recommendation-2021-2279-pef
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "every foreground data package"
      requirement: "Resolve the actual product identity and CPC 21429 applicability. Retain the Almond UUID only for the confirmed almond representative; otherwise store a verified product-specific UUID or a manual-review decision before publication."
      evidence: "lot identity; product description; Tiangong flow decision; unsd-cpc-3-0-explanatory-notes-2025"
    - id: dq_traceability
      applies_to: "all product and material flows"
      requirement: "Maintain lot genealogy from receipt through dispatch, including origin, crop year or lot, receipt state, treatment state, moisture basis, specification, and disposition of removed material."
      evidence: "receiving, transfer, inspection, and dispatch records"
    - id: dq_completeness
      applies_to: "all foreground processes"
      requirement: "Cover all listed applicable processes and reconcile major material, water, energy, packaging, waste, co-product, wastewater, and direct-emission records. Mark non-applicable rows with a route-specific reason."
      evidence: "process map; meter and mass-balance reconciliation; exclusion log"
    - id: dq_representativeness
      applies_to: "activity data and linked datasets"
      requirement: "Assess and disclose technological, geographical, time representativeness, and precision for the actual species, facility, technology, and reporting period; do not average different nut products without a documented representativeness and weighting decision."
      evidence: "foreground records and DQR disclosure; eu-recommendation-2021-2279-pef"
    - id: dq_standard_scope
      applies_to: "standard or specification claims"
      requirement: "Verify botanical species, product form, treatment, and market claim before applying a commodity standard. DDP-06 data may constrain only qualifying sweet whole almond kernels; CXC 6-1972 process rules may support only tree nuts within its scope."
      evidence: "applicability checklist; laboratory or inspection record; unece-ddp-06-almond-kernels-2024; codex-cxc-6-1972-tree-nuts"
    - id: dq_range_evidence
      applies_to: "important inventory flows"
      requirement: "Foreground values are mandatory. No category-wide numerical default or QA range is supplied because reviewed cross-product evidence is unavailable; replace this evidence gap with product- and route-specific reviewed ranges before moving the PCR to active methodology."
      evidence: "source review record and product-specific evidence added during methodology review"
validation_rules:
  - rule_id: val_identity_scope
    applies_to: "product identity"
    rule: "Fail automated validation if CPC 21429 applicability, species, and product state are missing, or if the Almond UUID is used for a non-almond product. A missing verified product-specific flow for another nut requires manual review."
    source_ids:
      - unsd-cpc-3-0-explanatory-notes-2025
  - rule_id: val_reference_flow
    applies_to: "reference product"
    rule: "Confirm exactly 1 kg net product on the declared moisture basis, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg; packaging mass must be excluded."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: val_process_coverage
    applies_to: "foreground boundary"
    rule: "Confirm all four process-map entries are addressed, shelling_separation is included for in-shell receipt, and every omitted conditional operation has a documented product- and route-specific reason."
    source_ids:
      - codex-cxc-6-1972-tree-nuts
      - eu-recommendation-2021-2279-pef
  - rule_id: val_mass_balance
    applies_to: "each process and full route"
    rule: "Confirm aligned moisture and unit bases, reconcile product, co-product, waste, wastewater, emissions, and inventory change, and report every unexplained residual; this PCR supplies no invented acceptance tolerance."
    source_ids: []
  - rule_id: val_allocation
    applies_to: "multifunctional processes"
    rule: "Confirm allocation was avoided where possible; otherwise verify the selected physical or economic relationship, input records, factor calculation, completeness, consistent application, and disclosure."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: val_almond_ddp06
    applies_to: "claimed DDP-06 almond product"
    rule: "When and only when DDP-06 conformity is claimed, confirm the product is a qualifying sweet whole almond kernel, excluded forms and treatments are absent, moisture does not exceed 6.5% by mass using the applicable method, and required quality, presentation, and marking evidence is retained."
    source_ids:
      - unece-ddp-06-almond-kernels-2024
  - rule_id: val_data_quality
    applies_to: "dataset release"
    rule: "Confirm lot traceability, measurement evidence, calibration, temporal coverage, site and technology coverage, linked upstream datasets, exclusions, and representativeness disclosure. An unresolved product-flow identity or missing major foreground record makes validation inconclusive."
    source_ids:
      - eu-recommendation-2021-2279-pef
published_dataset_profile:
  dataset_role: "Product- and route-specific foreground production data package for a declared CPC 21429 shelled nut at facility dispatch."
  downstream_use: "secondary_dataset; background_dataset after review, product-flow resolution, completion of upstream links, and quality disclosure."
  allowed_use: "Product-specific process or cradle-to-gate modelling for the declared species, origin, product state, facility, technology, period, and packaging; aggregation only where representativeness and weighting are documented."
  excluded_use: "Automatic representation of the full CPC 21429 subclass by the Almond UUID; substitution among nut species without review; use for in-shell, roasted, salted, sugared, flavoured, composite, or otherwise out-of-scope products; comparative claims or claims of PEF conformity without the additional applicable rules, life-cycle stages, verification, and harmonized scenarios."
  required_metadata: "PCR id; CPC coordinate and scope decision; product common and scientific names; selected product-flow UUID and representative limitation; origin; crop year or lot; facility; technology; receipt and market states; form; treatment; moisture value, method, and basis; grade or specification; time period; geography; process coverage; yield; allocation; packaging; storage; linked upstream datasets."
  required_quality_disclosure: "Data sources and collection coverage; calibration and test methods; mass-balance residuals; missing important-flow ranges; product-flow review status; technological, geographical, time representativeness, and precision; exclusions; allocation method and sensitivity; commodity-standard applicability."
  update_trigger: "Change of species or product identity, route, facility, technology, product state, moisture or grade basis, treatment, packaging, storage system, allocation relationship, reporting period, legal or commercial specification, Tiangong product-flow resolution, or material source evidence."
data_sources:
  - id: "unsd-cpc-3-0-explanatory-notes-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification (CPC) Version 3.0 Explanatory Notes, subclass 21429, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-11)"
    used_for: "Official product-category scope and examples; not process or amount evidence."
  - id: "codex-cxc-6-1972-tree-nuts"
    type: "standard"
    reference: "Codex Alimentarius, CXC 6-1972, Code of Hygienic Practice for Tree Nuts. https://workspace.fao.org/sites/codex/Standards/CXC%206-1972/CXC_006e.pdf (retrieved 2026-08-11)"
    used_for: "Tree-nut-only process decomposition, receipt controls, shelling, drying, defect separation, packing, storage, and hygiene requirements; not extended to non-tree nuts."
  - id: "unece-ddp-06-almond-kernels-2024"
    type: "standard"
    reference: "UNECE Standard DDP-06 concerning the marketing and commercial quality control of almond kernels, 2024. https://unece.org/sites/default/files/2025-02/DDP-06_Almond_kernels_2024_e.pdf (retrieved 2026-08-11)"
    used_for: "Narrow Almond representative qualifiers, moisture, quality, presentation, and marking only for the standard's stated product scope."
  - id: "eu-recommendation-2021-2279-pef"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279 of 15 December 2021, Annex I, Product Environmental Footprint Method. https://eur-lex.europa.eu/eli/reco/2021/2279/oj/eng (retrieved 2026-08-11)"
    used_for: "Functional or declared unit, reference flow, supply-chain boundary disclosure, multifunctionality hierarchy, company-specific data, and data-quality dimensions; not nut process evidence."
