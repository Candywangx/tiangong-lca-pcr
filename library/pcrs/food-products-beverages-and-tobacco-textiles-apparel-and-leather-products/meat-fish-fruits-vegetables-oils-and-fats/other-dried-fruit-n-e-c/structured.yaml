allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "multifunctional foreground processes"
    rule: "Avoid allocation first by separately measuring product-specific batches, equipment, meters, and waste streams; use system expansion only when the additional function and substituted product are demonstrable and consistently modelled."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "unavoidable joint production"
    rule: "If subdivision and system expansion are not feasible, use a documented physical relationship that reflects causation between inputs and co-product functions; do not default to mass merely because mass is available."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic
    applies_to: "no defensible physical relationship"
    rule: "Use economic allocation only when no relevant physical relationship can be demonstrated; use representative price and quantity records for the same reference period and disclose sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste
    applies_to: "rejects, peel, pits, cores, fines, packaging scrap, and sludge"
    rule: "Keep collection and treatment burdens in the product system for discarded waste. Treat a residue as a co-product only when it has a documented market or function, and apply the preceding hierarchy."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_mixtures
    applies_to: "dried-fruit or nut mixtures"
    rule: "Model each purchased component as an input with its own mass and upstream dataset; mixture composition does not justify averaging away component identity."
    source_ids:
      - unsd-cpc-3-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "receive_and_prepare_blanching_sulphiting_conditioning"
      flow_role: "fruit, additives, intermediate products, rejects, and residues"
      record_type: "scales, batch sheets, inventory and destination records"
      raw_fields: "lot id; fruit identity; gross mass; tare; net mass; moisture basis; additive issue and return; residue destination"
      collection_method: "calibrated scale and batch reconciliation"
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "representative continuous 12-month period or full seasonal campaign"
      site_scope: "all lines and shifts in scope"
      aggregation_rule: "sum net masses by process and normalize to conforming reference product"
      quality_evidence: "scale calibration; signed batch sheets; stock reconciliation; destination receipts"
    - protocol_id: cp_water_wastewater
      process_id: "receive_and_prepare_blanching_sulphiting_drying"
      flow_role: "make-up water, wastewater, spent solution, and condensate"
      record_type: "meters, tank levels, batch sheets, and discharge records"
      raw_fields: "meter readings; tank change; recirculation; discharge destination; concentration when relevant"
      collection_method: "meter difference or documented mass balance"
      unit: "kg"
      frequency: "each batch or daily with batch allocation"
      temporal_coverage: "same period as product inventory"
      site_scope: "all water systems serving the processes"
      aggregation_rule: "subtract recirculation and allocate shared systems by measured throughput or operating time"
      quality_evidence: "meter calibration; balance closure; treatment receipts"
    - protocol_id: cp_energy_fuel
      process_id: "all_production_processes"
      flow_role: "electricity, steam, natural gas, LPG, diesel, and wood pellets"
      record_type: "meters, invoices, tank and stock records, operating logs"
      raw_fields: "meter readings; fuel quantity; density; heating value basis; steam state; operating time"
      collection_method: "direct measurement preferred; documented allocation for shared meters"
      unit: "kWh, MJ, kg, m3, or L"
      frequency: "each batch, shift, or billing interval"
      temporal_coverage: "same period as product inventory"
      site_scope: "all included equipment and utility systems"
      aggregation_rule: "convert with documented factors and normalize by conforming process output"
      quality_evidence: "meter calibration; invoices; stock reconciliation; factor source"
    - protocol_id: cp_drying_operation
      process_id: "drying"
      flow_role: "input fruit, dried output, moisture removal, technology, and operating conditions"
      record_type: "dryer batch logs and laboratory results"
      raw_fields: "fruit mass; initial and final moisture with basis; condensate; time; temperature; humidity; pressure; product status"
      collection_method: "calibrated scales, sensors, and validated moisture or water-activity method"
      unit: "kg and declared process units"
      frequency: "every drying batch"
      temporal_coverage: "full represented campaign"
      site_scope: "every dryer and recipe in scope"
      aggregation_rule: "calculate fruit and water mass balances by declared technology and recipe"
      quality_evidence: "calibration; test method; batch traceability; mass-balance closure"
    - protocol_id: cp_direct_emissions
      process_id: "sulphiting_drying"
      flow_role: "sulphur dioxide and combustion pollutants"
      record_type: "stack tests, continuous monitoring, fuel analysis, and factor calculations"
      raw_fields: "pollutant result; flow rate; operating time; fuel quantity; carbon or sulphur content; oxidation and emission factors; factor source"
      collection_method: "direct measurement preferred; otherwise fuel-specific calculation"
      unit: "kg"
      frequency: "each required test and each inventory period"
      temporal_coverage: "same period as fuel inventory"
      site_scope: "all on-site emission points"
      aggregation_rule: "sum pollutant mass by source and normalize to process output"
      quality_evidence: "accredited test report or documented factor lineage; reconciliation with fuel use"
    - protocol_id: cp_refrigerant
      process_id: "drying_cold_storage"
      flow_role: "refrigerant make-up and leakage"
      record_type: "service logs, purchase records, cylinder weights, recovery records"
      raw_fields: "refrigerant identity; opening stock; purchases; closing stock; recovered; transferred; equipment"
      collection_method: "equipment-level annual mass balance"
      unit: "kg"
      frequency: "every service event and annually"
      temporal_coverage: "same period as product inventory"
      site_scope: "every refrigerant circuit in scope"
      aggregation_rule: "calculate loss by named refrigerant and allocate by equipment output or mass-time"
      quality_evidence: "technician records; cylinder scale calibration; stock reconciliation"
    - protocol_id: cp_packaging
      process_id: "packaging"
      flow_role: "each package component and its scrap"
      record_type: "bills of materials, receipts, counts, unit masses, and scrap scales"
      raw_fields: "material identity; layer or component; count; unit mass; issued; returned; scrap; destination"
      collection_method: "component mass balance"
      unit: "kg"
      frequency: "each packaging batch"
      temporal_coverage: "same period as product inventory"
      site_scope: "every package format in scope"
      aggregation_rule: "calculate each component and scrap mass per net kg product"
      quality_evidence: "supplier specification; verified unit mass; stock and scrap reconciliation"
    - protocol_id: cp_storage
      process_id: "cold_storage"
      flow_role: "stored product, electricity, temperature, and duration"
      record_type: "warehouse records, meters, and temperature logs"
      raw_fields: "entry and release mass; timestamps; chamber; temperature; electricity"
      collection_method: "mass-time inventory and metered energy"
      unit: "kg, h, kWh, degC"
      frequency: "continuous or each release"
      temporal_coverage: "represented storage period"
      site_scope: "all controlled chambers in scope"
      aggregation_rule: "allocate electricity by measured chamber load or mass-time and disclose method"
      quality_evidence: "calibrated temperature sensor; inventory reconciliation; meter records"
    - protocol_id: cp_sanitation
      process_id: "sanitation"
      flow_role: "sanitation water, active chemicals, electricity, and wastewater"
      record_type: "sanitation logs, formulation sheets, meters, and chemical issue records"
      raw_fields: "cleaning event; water; formulated product mass; active fraction; electricity; wastewater"
      collection_method: "event-level measurement and formulation calculation"
      unit: "kg and kWh"
      frequency: "every sanitation event"
      temporal_coverage: "same period as product inventory"
      site_scope: "all food-contact equipment and rooms in scope"
      aggregation_rule: "sum events attributable to represented production and normalize to reference product"
      quality_evidence: "sanitation sign-off; chemical specification; meter records"
    - protocol_id: cp_wastewater_treatment
      process_id: "wastewater_treatment"
      flow_role: "influent streams, utilities, sludge, final effluent, and pollutant loads"
      record_type: "influent and effluent meters, laboratory results, chemical dosing, electricity, and sludge tickets"
      raw_fields: "stream identity; flow; COD; BOD; total N; total P; suspended solids; chemical dose; electricity; sludge mass and dry solids"
      collection_method: "flow-proportional sampling and process records"
      unit: "kg, concentration units, and kWh"
      frequency: "continuous flow with representative sampling"
      temporal_coverage: "same period as product inventory"
      site_scope: "on-site treatment and discharge points"
      aggregation_rule: "calculate each pollutant load from flow and concentration; allocate shared treatment by justified load driver"
      quality_evidence: "laboratory QA; sampling plan; meter calibration; sludge destination record"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "all foreground exchanges"
      rule: "Divide the exchange assigned to conforming product by net conforming dried-fruit mass; packaging mass is not included in the denominator."
      inputs:
        - "exchange amount"
        - "net conforming dried-fruit mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_water_balance
      applies_to: "drying"
      rule: "Water removed equals water in fruit entering drying minus water in dried output, adjusted for measured liquid additions and withdrawals; split removed water into collected condensate and vented water."
      inputs:
        - "wet- and dry-basis moisture results"
        - "fruit masses"
        - condensate
        - "added water"
      output: "kg condensate and kg water to air"
      source_ids: []
    - id: calc_shared_energy
      applies_to: "shared electricity and heat"
      rule: "Allocate only after subdivision by metering; remaining shared energy is assigned using documented equipment operating time and load, product throughput, or another causal driver."
      inputs:
        - "meter total"
        - "equipment time and load"
        - "process output"
      output: "process-specific kWh or MJ"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_fuel_emissions
      applies_to: "on-site fuel combustion"
      rule: "Calculate each pollutant separately from fuel-specific quantity and documented factor; calculate fossil and biogenic carbon dioxide separately and retain factor source and heating-value basis."
      inputs:
        - "fuel by type"
        - "carbon or sulphur content"
        - "oxidation or emission factor"
        - "stack result"
      output: "kg of each direct air emission"
      source_ids: []
    - id: calc_refrigerant_loss
      applies_to: "drying and storage refrigerants"
      rule: "Opening stock plus purchases minus closing stock, recovered amount, and documented transfers equals loss for each named refrigerant."
      inputs:
        - "equipment-level refrigerant records"
      output: "kg emitted by refrigerant identity"
      source_ids: []
    - id: calc_effluent_load
      applies_to: "final effluent pollutants"
      rule: "Multiply final effluent volume by representative measured concentration and convert to pollutant mass; do not combine COD, BOD, nitrogen, phosphorus, or suspended solids."
      inputs:
        - "final effluent flow"
        - "analyte concentration"
      output: "kg of each pollutant to water"
      source_ids: []
    - id: calc_packaging_mass
      applies_to: "package components"
      rule: "Multiply verified unit component mass by conforming package count and reconcile against issued, returned, and scrap masses for each material."
      inputs:
        - "component count and unit mass"
        - "issue and scrap records"
      output: "kg of each package material per reference product"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and process route"
      requirement: "Preserve lot-to-batch-to-package traceability and the declared fruit, pretreatment, dryer, package, and storage identity."
      evidence: "batch genealogy, product specification, recipe, and package bill of materials"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Cover a representative continuous 12-month period or the complete seasonal campaign; disclose start, end, shutdowns, and exceptional batches."
      evidence: "dated meters, logs, invoices, and production ledger"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile fruit mass, water balance, energy, fuels, package materials, refrigerants, wastes, and direct emissions; explain every material imbalance or missing row."
      evidence: "signed balance sheets and unresolved-data register"
    - id: dq_measurement
      applies_to: "measured data"
      requirement: "Use calibrated instruments and retain units, moisture basis, sampling method, detection limits, and conversion factors."
      evidence: "calibration certificates, laboratory QA, and calculation workbook"
    - id: dq_representativeness
      applies_to: "foreground and upstream data"
      requirement: "Assess technological, geographical, and time representativeness and precision; document proxies and why they are appropriate."
      evidence: "data-quality assessment consistent with the PEF criteria"
    - id: dq_source_lineage
      applies_to: "calculated values"
      requirement: "Retain the raw record, formula, factor identity, factor source, and version used for every calculated exchange."
      evidence: "auditable calculation lineage and factor record"
validation_rules:
  - rule_id: validate_reference_mass
    applies_to: "reference product"
    rule: "Confirm that the denominator is exactly 1 kg net conforming dried fruit and excludes all packaging mass."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_qualifiers
    applies_to: "product identity"
    rule: "Fail conformance when fruit composition, preparation form, pretreatment, drying technology, final moisture or water-activity specification, package format, geography, or reference period is missing."
    source_ids:
      - unsd-cpc-3-2025
      - codex-cxc-3-1969
  - rule_id: validate_process_map
    applies_to: "foreground boundary"
    rule: "Confirm that every applied operation has a process inventory and that every conditional operation is either supported by records or explicitly not applicable."
    source_ids:
      - fao-processing-dried-fruits-2004
      - codex-cxc-3-1969
  - rule_id: validate_atomic_inventory
    applies_to: "process exchanges"
    rule: "Fail when electricity, steam, any fuel, refrigerant, water, chemical, packaging component, waste stream, or direct emission is combined with another exchange or represented by a selector label."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "fruit and water"
    rule: "Reconcile incoming fruit with conforming product, residues, rejects, condensate, vented water, and inventory change; investigate unexplained imbalance rather than forcing closure."
    source_ids:
      - codex-cxc-1-1969
  - rule_id: validate_energy_emissions
    applies_to: "drying utilities and direct emissions"
    rule: "Reconcile each fuel and electricity record to the declared dryer route and verify that each on-site combustion pollutant and each named refrigerant loss is represented separately."
    source_ids:
      - sagar-kumar-drying-2010
      - eu-pef-2021-2279
  - rule_id: validate_wastewater
    applies_to: "wastewater and discharge"
    rule: "Reconcile each wastewater stream to treatment or external transfer and verify separate final-effluent loads for COD, BOD, total nitrogen, total phosphorus, and suspended solids when on-site discharge occurs."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_food_safety_records
    applies_to: "hygiene and product release"
    rule: "Verify potable water, sanitation, process-control, moisture or water-activity, package integrity, deviation, and release records for the represented batches."
    source_ids:
      - codex-cxc-1-1969
      - codex-cxc-3-1969
  - rule_id: validate_allocation
    applies_to: "co-products and shared processes"
    rule: "Verify the allocation hierarchy, driver, same-period quantities and prices where relevant, and sensitivity; fail undocumented burden-free residues or co-products."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_data_quality
    applies_to: "dataset"
    rule: "Verify temporal coverage, calibration, representativeness, precision, completeness, proxy disclosure, and calculation lineage before release."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production dataset for other dried fruit, n.e.c. at the processor gate."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA process and lifecycle-model construction for a product matching the declared fruit, route, moisture or water-activity specification, packaging, geography, technology, and period."
  excluded_use: "Comparative assertion or substitution across materially different fruit species, sweetened versus unsweetened products, drying technologies, moisture states, package formats, or geographies without additional review."
  required_metadata: "PCR id and version; fruit and mixture identity; origin and incoming condition; preparation form; pretreatment and additives; drying technology; utility and fuel sources; final moisture content and basis or water activity; package bill of materials; storage regime; geography; technology; reference period; cut-offs; allocation; upstream dataset identifiers."
  required_quality_disclosure: "Coverage and balance results; measured versus calculated values; calibration and sampling; temporal, technological, and geographical representativeness; precision; proxies; unresolved UUIDs and range evidence; allocation sensitivity; deviations."
  update_trigger: "Change in fruit or mixture recipe, incoming state, pretreatment, drying technology or fuel, package format, storage regime, facility, wastewater treatment, allocation, upstream dataset, legal product specification, or representative reference period."
data_sources:
  - id: "unsd-cpc-3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division. *CPC Ver. 3.0 Explanatory Notes*, last updated 30 June 2025, subclass 21419. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-24)."
    used_for: "Product-category scope, included dried fruits, and mixture identity."
  - id: "codex-cxc-3-1969"
    type: "standard"
    reference: "Codex Alimentarius Commission. *Code of Hygienic Practice for Dried Fruits*, CXC 3-1969, adopted 1969, editorial amendments 2011. https://www.fao.org/fao-who-codexalimentarius/sh-proxy/ro/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXC+3-1969%2FCXC_003e.pdf (retrieved 2026-08-24)."
    used_for: "Dried-fruit scope, raw-material protection, potable water, preparation, drying-yard controls, packaging, moisture stability, storage, sanitation, and records."
