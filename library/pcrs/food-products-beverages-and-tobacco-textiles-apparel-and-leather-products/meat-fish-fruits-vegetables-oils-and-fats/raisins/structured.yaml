allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared receiving, drying, finishing, and packaging operations"
    rule: "Avoid allocation by subdividing batches, lines, or metered operations whenever separate records are available."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_then_other
    applies_to: "unavoidable multi-functional operations"
    rule: "When subdivision is not possible, use and document a relevant causal physical relationship. Use another relationship, such as economic value, only when no defensible physical relationship exists; disclose quantities, prices, period, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residue_status
    applies_to: "rejected grapes, stems, seeds, recovered raisins, and other outputs"
    rule: "Treat an output sent for disposal as waste and assign its treatment to the process. If an output is sold or used as a co-product, preserve its mass and destination and apply the declared allocation hierarchy; do not award an undocumented avoided-burden credit."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_packaging_line
    applies_to: "shared packaging utilities"
    rule: "Allocate shared packaging energy and consumables using a measured driver that reflects causality, such as machine time, filled net mass, or package count; state the driver and ensure all line outputs are covered."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_batch
      process_id: "grape_receiving_pretreatment"
      flow_role: "received grapes, water, treatment materials, prepared grapes, and residues"
      record_type: "batch record"
      raw_fields: "batch_id; supplier_lot; grape_species; variety_group; origin; received_mass_kg; incoming_condition; water_kg; material_name; material_mass_kg; prepared_mass_kg; residue_type; residue_mass_kg; destination"
      collection_method: "calibrated scales, meters, formulation sheets, and waste records reconciled to one batch"
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "all batches in represented production period"
      site_scope: "all included receiving and pre-treatment operations"
      aggregation_rule: "sum by identified flow and batch, then divide by verified net packaged output"
      quality_evidence: "calibration records; supplier certificates; formulation records; batch mass balance; waste transfer records"
    - protocol_id: cp_drying_batch
      process_id: "grape_drying"
      flow_role: "grape input, energy carriers, dried output, moisture, and water removed"
      record_type: "batch and meter record"
      raw_fields: "batch_id; drying_technique; sequence; grape_input_kg; input_moisture_pct; energy_carrier; energy_quantity; energy_unit; dried_output_kg; exit_moisture_pct; liquid_loss_kg; drying_time"
      collection_method: "batch-linked scales, moisture tests, utility meters, invoices, and equipment logs"
      unit: "kg; % by mass; kWh; MJ; h"
      frequency: "every batch and meter period"
      temporal_coverage: "all represented drying batches, covering seasonal variation"
      site_scope: "all declared drying equipment and stages"
      aggregation_rule: "reconcile energy to batch; calculate output-weighted moisture and batch mass balance; normalize to net packaged output"
      quality_evidence: "scale and moisture-method records; meter reconciliation; route log; mass-balance closure"
    - protocol_id: cp_finishing_batch
      process_id: "raisin_finishing"
      flow_role: "dried input, conditioning materials, energy, accepted raisins, and residues"
      record_type: "batch record"
      raw_fields: "batch_id; dried_input_kg; operation; water_added_kg; material_name; material_mass_kg; energy_quantity; energy_unit; accepted_mass_kg; release_moisture_pct; style; treatment_status; residue_type; residue_mass_kg; destination"
      collection_method: "calibrated scales, laboratory or validated moisture method, formulation sheets, meters, and disposition records"
      unit: "kg; % by mass; kWh; MJ"
      frequency: "every batch"
      temporal_coverage: "all finishing batches in represented period"
      site_scope: "all included conditioning, cleaning, sorting, coating, and pasteurization operations"
      aggregation_rule: "sum separately by flow; mass-weight moisture results; normalize to net packaged output"
      quality_evidence: "calibration and test records; food-grade supplier specification; batch release; residue reconciliation"
    - protocol_id: cp_packaging_batch
      process_id: "raisin_packaging"
      flow_role: "raisin input, net output, packaging materials, energy, and scrap"
      record_type: "packaging run record"
      raw_fields: "batch_id; package_format; units_filled; declared_net_mass_kg; verified_net_mass_kg; tare_kg; material_name; material_mass_kg; energy_quantity; energy_unit; scrap_type; scrap_mass_kg; destination"
      collection_method: "check-weigher or calibrated scales, packaging bill of materials, stock reconciliation, meters, and scrap records"
      unit: "kg; kWh; MJ; count"
      frequency: "every packaging run"
      temporal_coverage: "all runs associated with represented raisin batches"
      site_scope: "all included bulk and retail packaging configurations"
      aggregation_rule: "calculate verified net output; sum each packaging material and waste route separately; normalize to net output"
      quality_evidence: "scale checks; legal-metrology or internal verification record; bill of materials; stock and scrap reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every foreground flow"
      rule: "normalized amount = batch-assigned flow quantity / verified net packaged raisin mass"
      inputs:
        - "batch flow quantity"
        - "verified net packaged raisin mass"
      output: "amount per 1 kg net packaged raisins"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_drying_water_balance
      applies_to: "water removed to air"
      rule: "water to air = prepared-grape input mass + added drying-stage materials - dried-grape output mass - separately measured liquid and solid outputs; compare with moisture-basis calculation and investigate material discrepancy"
      inputs:
        - "input and output masses"
        - "input and exit moisture"
        - "liquid and solid losses"
      output: "kg water to air and mass-balance closure"
      source_ids: []
    - id: calc_net_packaged_mass
      applies_to: "packaged reference output"
      rule: "verified net mass = gross filled-package mass - measured tare, or sum of independently verified net contents; packaging mass shall not enter the reference output"
      inputs:
        - "gross mass"
        - tare
        - "check-weigher or net-content records"
      output: "kg net packaged raisins"
      source_ids:
        - codex-cxs-360-2020
    - id: calc_shared_operation_assignment
      applies_to: "unavoidable shared utilities"
      rule: "assigned amount = total shared quantity × documented causal driver share; shares across all outputs shall sum to one"
      inputs:
        - "total shared quantity"
        - "driver for each output"
      output: "assigned batch utility or material amount"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "all represented batches"
      requirement: "Trace the output to *Vitis vinifera* grape lots and retain variety or varietal group, seed type and form, drying technique, treatment history, conditioning, coating, moisture class, food-grade release, and package format."
      evidence: "supplier lot records; route and formulation logs; batch release certificate"
    - id: dq_measurement
      applies_to: "mass, moisture, water, material, and energy records"
      requirement: "Use calibrated or verified instruments and retain test methods, unit conversions, meter allocation, tare determination, and missing-data treatment."
      evidence: "calibration certificates; moisture-method record; meter and scale checks; conversion worksheet"
    - id: dq_temporal_coverage
      applies_to: "represented production period"
      requirement: "Cover all batches or a justified representative sample spanning relevant grape origins, drying routes, seasonal conditions, and package formats; state exclusions."
      evidence: "production schedule; batch list; sampling rationale; coverage calculation"
    - id: dq_completeness
      applies_to: "each foreground process"
      requirement: "Reconcile product inputs, product outputs, residues, wastewater, water to air, treatment materials, energy carriers, and packaging. Explain material mass-balance gaps and disclose unmeasured direct elementary flows."
      evidence: "process mass balances; utility reconciliation; waste records; completeness checklist"
    - id: dq_representativeness
      applies_to: "foreground and linked upstream data"
      requirement: "Assess and disclose technological, geographical, time-related representativeness, and precision for important datasets and flows."
      evidence: "data-quality assessment following eu-pef-2021-2279; proxy justification"
    - id: dq_provisional_ranges
      applies_to: "every reasoned_estimate range"
      requirement: "Treat the range only as a temporary QA screen when stronger evidence is unavailable. Do not substitute its midpoint for foreground data. Replace or retire it when representative batch measurements, audited supplier data, or reviewed transferable evidence are obtained, and document the replacement decision."
      evidence: "range register; data-improvement plan; reviewed replacement evidence"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the exact Raisins product-flow UUID, Mass property UUID, Units of mass UUID, 1 kg net amount, and every required qualifier; reject a gross-package-mass reference."
    source_ids:
      - unsd-cpc-3-21411
      - codex-cxs-360-2020
  - rule_id: validation_grape_identity
    applies_to: "product and inputs"
    rule: "Confirm sound dried *Vitis vinifera* grape identity and exclusion of currant types and other dried fruits; verify that upstream starting condition matches fresh, partly dried, or purchased-raisin inputs actually used."
    source_ids:
      - codex-cxs-360-2020
  - rule_id: validation_route_exclusivity
    applies_to: "drying inventory"
    rule: "Confirm one declared primary drying technique per batch, or a documented sequential hybrid. Reject simultaneous sun/solar and heated-route burdens when no hybrid evidence exists."
    source_ids:
      - codex-cxs-360-2020
  - rule_id: validation_moisture_and_conditioning
    applies_to: "released raisins"
    rule: "Confirm the release moisture result, applicable product style, test method, and all water addition, further drying, pasteurization, treatment, or coating records; apply the Codex maximum corresponding to the declared type."
    source_ids:
      - codex-cxs-360-2020
  - rule_id: validation_mass_balance
    applies_to: "all four processes"
    rule: "Confirm linked intermediate masses and investigate unexplained mass-balance gaps; moisture removed to air, wastewater, residues, recovered product, and packaging scrap shall not be silently omitted or double counted."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_packaging_net_mass
    applies_to: "packaged output"
    rule: "Confirm package format, packaging material masses, tare, verified net edible raisin mass, and separate packaging scrap; normalized net output shall equal exactly 1 kg."
    source_ids:
      - codex-cxs-360-2020
      - eu-pef-2021-2279
  - rule_id: validation_foreground_priority
    applies_to: "important inventory flows"
    rule: "Confirm that actual batch records produce inventory values. Flag any retained reasoned_estimate as provisional and require its applicability, temporary status, and replacement trigger to remain disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_allocation
    applies_to: "shared or multi-output operations"
    rule: "Confirm subdivision first, documented causal allocation when unavoidable, full coverage of outputs, and disclosure of any non-physical relationship and sensitivity."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground raisin-production dataset from received grapes to packaged raisins at the packaging-facility gate"
  downstream_use: "secondary_dataset; background_dataset when independently reviewed and sufficiently representative for reuse"
  allowed_use: "Foreground food-production modelling, supply-chain inventories, packaging-gate comparisons within equivalent scope, and full life-cycle studies that add representative upstream and downstream stages"
  excluded_use: "Claims about grape cultivation, consumer storage or use, packaging end of life, other dried fruits, or comparative assertions across unmatched drying routes, moisture classes, treatments, grape identities, or package formats without additional modelling and review"
  required_metadata: "canonical PCR id and version used; product-flow UUID; grape and batch identity; geography and period; drying technique and sequence; treatment and conditioning; release moisture and method; seed type and form; coating; net mass and package format; foreground boundary; upstream datasets; allocation; exclusions"
  required_quality_disclosure: "data coverage; scale, meter, and moisture-method quality; mass-balance closure; technological, geographical, and temporal representativeness; precision; proxies; missing flows; provisional reasoned estimates and replacement status"
  update_trigger: "new reviewed Codex or classification scope; changed product-flow identity; material route, treatment, moisture, packaging, or allocation change; representative batch evidence that replaces a provisional range; audit finding; or data older than the declared representativeness period"
