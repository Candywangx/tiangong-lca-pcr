allocation_rules:
  - rule_id: alloc_subdivision_first
    applies_to: "Shared processes and mutually exclusive routes"
    rule: "Prefer process subdivision and route-specific metering. Do not allocate a blended facility inventory while separable route records are available."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_residual_status
    applies_to: "Shells, rejected crab, spent salt/brine, and other outputs"
    rule: "Classify each output as product, co-product, recyclable material, or waste using documented ownership, intended use, treatment, and economic value. Waste treatment burdens remain with the process that generates the waste."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_fallback
    applies_to: "Unavoidable multi-output process"
    rule: "After subdivision and other justified avoidance are exhausted, use a documented physical causal relation; if none can be justified, use economic allocation with contemporaneous prices and sensitivity analysis."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_disclosure
    applies_to: "All allocated inventories"
    rule: "Report allocation driver, quantities, prices or physical parameters, period, resulting factors, treatment of zero-value outputs, and sensitivity result."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_mass
      process_id: "receipt_preparation_route_preservation_route_storage_packaging_dispatch"
      flow_role: "Crab inputs, transfers, outputs, glaze/free-brine mass, and losses"
      record_type: "Scale tickets and batch records"
      raw_fields: "batch_id; route; species/grouping; shell_state; incoming_state; gross_mass; tare; net_crab_mass; glaze_mass; free_brine_mass; output_mass; timestamp; scale_id"
      collection_method: "Calibrated scales and reconciled batch records"
      unit: "kg"
