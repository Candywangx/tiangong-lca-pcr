validation_rules:
  - rule_id: val_identity
    applies_to: "Reference product"
    rule: "Confirm CPC scope, uncooked crab identity, shell state, actual preservation route, and all required qualifiers; reject excluded cooked, smoked, canned, or merely fresh/chilled products."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: val_reference_mass
    applies_to: "Reference flow"
    rule: "Confirm exactly one quantitative reference output of 1 kg net product mass using the specified product-flow, Mass-property, and unit-group UUIDs; packaging shall be excluded and glaze/free-brine treatment disclosed."
    source_ids: []
  - rule_id: val_route
    applies_to: "Process map and inventory"
    rule: "Confirm the actual route is declared and only applicable route operations, materials, controls, storage, and emissions are included."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: val_mass_balance
    applies_to: "Each process and lot"
    rule: "Reconcile input, product output, retained water/salt, residual, wastewater, evaporation, and storage loss; investigate material imbalance rather than forcing closure."
    source_ids: []
  - rule_id: val_inventory_completeness
    applies_to: "Foreground boundary"
    rule: "Confirm all four process roles are represented and applicable water, ice, salt/brine, energy, packaging, wastewater, residual, on-site treatment, and refrigerant records are present or explicitly zero/not applicable."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_food_safety_controls
    applies_to: "Preservation and storage"
    rule: "Confirm route-specific time, temperature, concentration, drying, hygiene, monitoring, and corrective-action evidence is retained; this PCR does not replace a facility-specific HACCP plan."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: val_allocation
    applies_to: "Shared and multi-output processes"
    rule: "Confirm subdivision was attempted first and any remaining physical or economic allocation is documented with factors summing to one and sensitivity where required."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_provisional_ranges
    applies_to: "All reasoned estimates"
    rule: "Flag values outside provisional QA ranges and all uses of a provisional range as a default; a flag requires review and does not by itself prove non-conformance."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for preserved uncooked crab at the preserving facility gate"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Route-, geography-, technology-, and time-representative process or lifecycle models that preserve the declared qualifiers and boundary"
  excluded_use: "Live/fresh/chilled, cooked, smoked, canned, or other crab products; another preservation route; undisclosed route blends; geographies or technologies without representativeness review"
  required_metadata: "PCR id/version; product and route qualifiers; facility/geography; reference period; upstream dataset links; process map; storage duration/conditions; packaging; allocation; data-quality assessment"
  required_quality_disclosure: "Primary-data coverage; mass and utility reconciliation; missing data; provisional estimates; instrument quality; allocation and sensitivity; excluded operations; route and seasonal representativeness"
  update_trigger: "Material change in route, recipe, equipment, energy supply, refrigerant, yield, packaging, supplier/origin, allocation, regulation, evidence, or data older than the declared representativeness period"
