system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground begins when raw or previously chilled/frozen crab and auxiliary materials are accepted by the preserving facility. It ends when the declared preserved crab is packaged and released at the factory gate. Include preparation, the actual preservation route, route-appropriate storage, packaging, water and ice, salt or brine ingredients, electricity and thermal energy, refrigerant losses, product loss, residues, wastewater, and on-site treatment directly attributable to the lot. Upstream production and transport of crab and other product inputs require linked datasets. Distribution, retail, use, and end-of-life after the factory gate are outside this foreground."
      source_ids: []
    - rule_id: sb_facility_gate
      applies_to: "All datasets"
      rule: "Include all attributable foreground operations from receipt through packaged factory-gate release and link upstream datasets for crab and other product inputs."
      source_ids:
        - codex-cxc-52-2003
        - eu-pef-2021-2279
    - rule_id: sb_route_exclusivity
      applies_to: "Preservation route"
      rule: "Include only the actual declared route steps; do not combine mutually exclusive freezing, drying, dry-salting, and brining inventories without a documented sequential route."
      source_ids:
        - codex-cxc-52-2003
    - rule_id: sb_losses_and_controls
      applies_to: "All included processes"
      rule: "Include product losses, residues, wastewater, on-site treatment, route-control energy, and measured refrigerant losses when they occur."
      source_ids:
        - codex-cxc-52-2003
        - eu-pef-2021-2279
    - rule_id: sb_food_safety_records
      applies_to: "Preservation and storage"
      rule: "Retain route-specific time, temperature, salt/brine concentration, drying, hygiene, and corrective-action records required by the facility HACCP or equivalent food-safety plan."
      source_ids:
        - codex-cxc-52-2003
boundary_abstraction:
  declared_starting_condition: "Crab received at the preserving facility, with species/grouping, shell state, raw or previously frozen/chilled condition, supplier/landing origin, receipt mass, receipt temperature, and upstream dataset reference declared"
  starting_condition_role: "Foreground entry condition for preservation; upstream capture/aquaculture, landing, and inbound transport remain represented by linked upstream datasets"
  product_classification_scope: "Uncooked crabs in CPC 3.0 subclass 21251 and the semantic scope stated in this PCR"
  recursive_input_rule: "If a received input is already a product in this PCR category, record it once as an upstream product input with its preservation state and upstream dataset; do not recreate its prior preservation inventory in the current foreground"
  upstream_dataset_requirement: "Require traceable upstream datasets for crab and material or energy inputs; disclose substitutions, geography, time period, technology, and unresolved gaps"
  disclosure: "Declare actual route sequence, shell state, incoming and final product states, yield, glaze/brine treatment, storage conditions and duration, packaging, excluded operations, allocation, data gaps, and provisional estimates"
