  calculation_rules:
    - id: calc_normalized_flow
      applies_to: "Every quantified foreground flow"
      rule: "normalized amount = attributable flow quantity / net conforming final rendered pig fat output"
      inputs:
        - "Collected flow quantity"
        - "net final product mass"
      output: "Flow amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_internal_transfer
      applies_to: "Prepared material and rendered-fat intermediate"
      rule: "transferred amount = measured transfer + opening stock - closing stock for the corresponding intermediate and period; use the same corrected amount on the sending and receiving processes"
      inputs:
        - "Transfer measurements"
        - "opening and closing stock"
      output: "Reconciled internal intermediate amount"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_energy_conversion
      applies_to: "Fuel, steam, and purchased heat records"
      rule: "converted energy = recorded carrier quantity × documented carrier-specific conversion factor; retain original quantity, factor, source, and converted result"
      inputs:
        - "Carrier quantity"
        - "conversion factor"
      output: "Energy by carrier and process"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "Complete foreground system"
      rule: "mass balance residual = total mass inputs + opening stock - total product, co-product, waste, measured emission outputs - closing stock; investigate and disclose the residual rather than forcing it to zero"
      inputs:
        - "All mass flows and stock changes on a consistent basis"
      output: "Mass-balance residual and reconciliation statement"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_economic_allocation
      applies_to: "Residual shared burden after subdivision"
      rule: "allocation factor_i = net revenue_i / sum of net revenues for all marketable outputs at the same gate and period; allocated burden_i = shared burden × allocation factor_i"
      inputs:
        - "Output quantities"
        - "contemporaneous net prices"
        - "shared burden"
      output: "Allocation factors and allocated residual burdens"
      source_ids:
        - eu-pef-2021-2279
