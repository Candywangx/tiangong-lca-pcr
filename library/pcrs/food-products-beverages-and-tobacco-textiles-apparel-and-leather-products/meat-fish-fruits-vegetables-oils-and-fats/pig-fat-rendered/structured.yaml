system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate
      applies_to: "Foreground rendering system"
      rule: "Include receipt and preparation of eligible pig raw material, rendering and separation, directly attributable utilities and emissions, and any on-site conditioning required to deliver the declared factory-gate reference product. Link rather than recreate upstream production and downstream use."
      source_ids:
        - unsd-cpc-3-0-explanatory-notes-2025
        - eu-pef-2021-2279
    - rule_id: boundary_product_designation
      applies_to: "Lard or rendered pork fat designation"
      rule: "For lard, enforce the declared CXS 211-1999 tissue restrictions. For rendered pork fat, disclose any permitted bones, skin, ears, tails, or other tissues. Do not infer one designation from the other."
      source_ids:
        - codex-cxs-211-1999
    - rule_id: boundary_scope_exclusions
      applies_to: "Category boundary"
      rule: "Exclude unrendered pig fat, separately marketed lard oil or lard stearin, chemically modified animal fats, and non-pig fats. Route such outputs to the appropriate product or waste identity instead of the reference product."
      source_ids:
        - unsd-cpc-3-0-explanatory-notes-2025
        - codex-cxs-211-1999
    - rule_id: boundary_conditional_operations
      applies_to: "Refining, conditioning, storage, and packaging"
      rule: "Include each operation only when performed within the declared facility gate and needed for the delivered product state; otherwise exclude it and state the transfer point. Clearly label post-render processing where the declared food specification requires it."
      source_ids:
        - codex-cxs-211-1999
        - eu-pef-2021-2279
    - rule_id: boundary_fdm_bat_scope
      applies_to: "Environmental performance evidence"
      rule: "Do not use energy, water, or emission performance levels from the EU Food, Drink and Milk BAT conclusions as rendering defaults because that source explicitly excludes primary rendering and fat melting; use site records and applicable rendering-specific requirements instead."
      source_ids:
        - eu-fdm-bat-2019-2031
boundary_abstraction:
  declared_starting_condition: "Eligible pig fatty tissues and, when allowed by the declared product designation, cleaned bones, detached skin, head skin, ears, tails, or other pig tissues arrive at the rendering facility; supplier, species, tissue categories, mass, fitness or grade status, and prior treatment are known"
  starting_condition_role: "Foreground gate-to-gate starting condition for rendering; upstream pig production, slaughter, and supplier-side preparation are represented by linked upstream datasets"
  product_classification_scope: "Rendered pig fat under CPC 3.0 subclass 21521, with lard and rendered pork fat distinguished by declared raw-material and product-designation facts"
  recursive_input_rule: "Purchased rendered pig fat in the same category shall be recorded as a separate product input with quantity and upstream dataset; its prior production shall not be recreated inside this foreground system, and blending or reprocessing shall be disclosed"
  upstream_dataset_requirement: "Link representative upstream datasets for pig raw materials, electricity, fuels or purchased heat, water, auxiliaries, packaging, transport when included, and off-site waste or wastewater treatment; disclose allocation inherited from slaughter or supplier datasets"
  disclosure: "Declare facility and geography, technology and operating mode, batch or averaging period, raw-material tissue categories, intended use or grade, product designation, post-render treatment, co-products and wastes, allocation method, cut-offs, storage and packaging scope, and all data gaps"
