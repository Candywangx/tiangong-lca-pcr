allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Rendering, separation, conditioning, and shared utilities"
    rule: "First subdivide the process and directly assign measured inputs, outputs, emissions, and waste treatment to the output that causes them whenever technically feasible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residual_shared_flows
    applies_to: "Residual multifunctional burdens after subdivision"
    rule: "If subdivision cannot resolve shared flows, allocate the residual shared burden among marketable outputs using economic allocation based on documented, contemporaneous net revenues at the same gate and averaging period. Report quantities, prices, currency, period, calculation, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_status
    applies_to: "Outputs without a marketable product function"
    rule: "Treat an output as waste only when its legal and economic status and destination support that treatment; assign its handling and treatment burdens to the foreground system and do not give it a co-product credit without documented substitution or another governing method."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_upstream_inheritance
    applies_to: "Pig raw material and other purchased inputs"
    rule: "Use the upstream burden and allocation already documented by the representative supplier dataset; do not reallocate the supplier process inside this gate-to-gate system. Disclose when the raw material has zero upstream burden and the rule that authorizes that choice."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_governing_method_override
    applies_to: "Studies governed by a programme-specific method"
    rule: "When a declared study method such as PEF prescribes fixed allocation factors or another mandatory rule, apply that method and disclose the departure from the generic residual-flow rule above. Do not mix allocation systems without reconciliation."
    source_ids:
      - eu-pef-2021-2279
