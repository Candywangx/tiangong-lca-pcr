validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The reference product UUID shall be 940c22ad-d154-42ac-9988-374cbfeb86b4, the reference property UUID shall be 93a60a56-a3c8-11da-a746-0800200b9a66, the unit-group UUID shall be 93a60a57-a4c8-11da-a746-0800200c9a66, and the reference unit shall be kg."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset identity"
    rule: "Fail completeness when any required qualifier is absent, including product designation, intended use or grade, raw-material tissue categories, rendering route, post-render treatment, physical state, quality specification, packaging state, factory gate, or batch/period."
    source_ids:
      - codex-cxs-211-1999
      - unsd-cpc-3-0-explanatory-notes-2025
  - rule_id: validate_category_scope
    applies_to: "Product and co-product identities"
    rule: "Reject unrendered pig fat, lard oil, lard stearin, chemically modified fats, and non-pig fats as the reference product; record them under their actual identity when present."
    source_ids:
      - unsd-cpc-3-0-explanatory-notes-2025
  - rule_id: validate_process_coverage
    applies_to: "Process map"
    rule: "Require raw-material receipt/preparation and rendering/separation; require conditioning/dispatch only when performed before the declared gate, with included and excluded operations disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_foreground_amounts
    applies_to: "Material, energy, water, auxiliaries, products, wastes, and emissions"
    rule: "Require measured or calculated-from-collection amounts, collection protocol links, period alignment, and normalization to 1 kg final product. Reject uncited default energy, water, emission, or yield values."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "Complete foreground system"
    rule: "Require a documented mass balance including stock changes, co-products, wastes, wastewater, and measured mass emissions; investigate and disclose material residuals."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "Multifunctional processes"
    rule: "Require evidence of subdivision first and complete documentation of any residual allocation, output status, quantities, prices, period, and governing method."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_codex_claim
    applies_to: "Food-grade or CXS 211-1999 conformity claim"
    rule: "When such a claim is made, require a designation-specific crosswalk and batch evidence; do not treat CPC 21521 identity or supplementary appendix values alone as proof of conformity."
    source_ids:
      - codex-cxs-211-1999
  - rule_id: validate_source_applicability
    applies_to: "External evidence"
    rule: "Require each source to support the rule for which it is cited. Record that EU FDM BAT excludes primary rendering and fat melting and therefore supplies no rendering performance default."
    source_ids:
      - eu-fdm-bat-2019-2031
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate production dataset for rendered pig fat"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA of rendered pig fat and downstream products when product designation, grade, geography, technology, allocation, gate, and data quality match the study"
  excluded_use: "Unrendered pig fat, separate lard oil or stearin, chemically modified fat, non-pig fat, undisclosed mixtures, or claims of food/Codex conformity without supporting evidence"
  required_metadata: "Canonical PCR id; reference UUIDs; CPC mapping context; facility geography; technology and operating mode; product designation; intended use or grade; raw-material tissue categories; rendering route; post-render treatment; physical and packaging state; batch or averaging period; foreground gate; co-products and wastes; allocation method; linked upstream datasets; cut-offs and data gaps"
  required_quality_disclosure: "Measurement and calibration basis; mass and utility reconciliation; temporal, technological, and geographical representativeness; completeness; uncertainty and mass-balance residual; source applicability; laboratory and conformity evidence where claimed"
  update_trigger: "Change in raw-material eligibility, product designation or grade, technology, facility or geography, energy system, refining or packaging scope, co-product status or prices, allocation rule, applicable legal or Codex requirement, reference UUID, or availability of better rendering-specific evidence"
data_sources:
  - id: "unsd-cpc-3-0-explanatory-notes-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, *Central Product Classification (CPC) Version 3.0 Explanatory Notes*, subclass 21521, 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-12)"
    used_for: "Category inclusion of rendered pig fat and lard; exclusion of unrendered pig fat, lard oil, and lard stearin"
  - id: "codex-cxs-211-1999"
    type: "standard"
    reference: "Codex Alimentarius, *Standard for Named Animal Fats*, CXS 211-1999, amended 2024. https://workspace.fao.org/sites/codex/Standards/CXS%20211-1999/CXS_211e.pdf (retrieved 2026-08-12)"
    used_for: "Lard and rendered pork fat definitions, eligible raw-material distinctions, conditional post-render processing and labelling, quality and conformity evidence"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279, Annex I, Product Environmental Footprint method. https://eur-lex.europa.eu/eli/reco/2021/2279/oj (retrieved 2026-08-12)"
    used_for: "Functional unit, foreground company-specific data, inventory completeness, system-boundary disclosure, subdivision and residual allocation, data quality"
  - id: "eu-fdm-bat-2019-2031"
    type: "official_guidance"
    reference: "Commission Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries. https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj (retrieved 2026-08-12)"
    used_for: "Applicability limitation: primary rendering and fat melting are excluded, so its performance levels are not used as rendering defaults"
