  classification_refs: "CPC 3.0: 21524 Fish-liver oils and their fractions (exact scope reference)"
  covered_products: "Crude, refined, named or unnamed fish liver oils intended for human consumption; cod liver oil from declared eligible Gadidae species; food-grade fractions and concentrates derived exclusively from fish liver oils and remaining classified in CPC 21524"
  excluded_products: "Oils from whole fish or non-liver fish tissues; fish oils mixed with liver oils; shellfish oils; marine-mammal oils; land-animal fats; vegetable oils; products classified as chemically modified animal fats outside CPC 21524; non-food technical oils; retail capsules and formulated foods"
  representative_product: "One released bulk lot of food-grade fish liver oil or a declared fish-liver-oil fraction at the producing facility gate"
  production_route: "Declared fish livers -> extraction and oil separation -> conditional refining and purification -> conditional fractionation or concentration -> product release and bulk packing"
  market_state: "Crude for further food processing, refined edible oil, or declared food-grade fraction/concentrate; bulk at producing facility gate"
functional_unit:
  what: "Provision of fish-liver oil or a fish-liver-oil fraction made exclusively from declared fish livers"
  how_much: "1 kg net mass of released product"
  how_well: "Product state, source species, liver-only origin, applied route and intended food market are declared; the lot has applicable CXS 329-2017 product-integrity evidence"
  how_long_or_cycle: "One production lot at release; no use-duration function is claimed"
  reference_flow_link: "The functional unit is realized by exactly 1 kg of the reference product flow"
system_boundary:
  rules:
    - rule_id: sb_liver_only
      applies_to: "Product and feedstock identity"
      rule: "Include only oil extracted from declared fish livers. Exclude whole-fish oil, non-liver fish oil and mixtures with non-liver oil."
      source_ids:
        - unsd-cpc-3-0-2025
        - codex-cxs-329-2017
    - rule_id: sb_actual_route
      applies_to: "Foreground processes"
      rule: "Include extraction and separation plus every physical refining, purification, winterization, physical fractionation, concentration, solvent-use or recovery, conditioning and packing step actually applied before the declared gate, provided the final product retains CPC 21524 identity. Do not insert an unperformed generic route."
      source_ids:
        - codex-cxs-329-2017
        - unsd-cpc-3-0-2025
    - rule_id: sb_crude_state
      applies_to: "Crude fish liver oil"
      rule: "A crude product is released only with an explicit further-processing requirement. A product declared ready for direct human consumption must include all applicable processing and product-integrity evidence."
      source_ids:
        - codex-cxs-329-2017
    - rule_id: sb_cpc_chemical_modification_gate
      applies_to: "Product classification exclusion"
      rule: "Hydrolysis, hydrogenation, inter-esterification, re-esterification, elaidinisation, esterification and other chemical-form adjustment routes are outside the eligible CPC 21524 route whenever the resulting product belongs in CPC 21590 or another applicable category. Such a product must fail this PCR's classification gate and be routed to CPC 21590 or the applicable category. Codex fish-oil chemical-form descriptions do not determine CPC classification."
      source_ids:
        - unsd-cpc-3-0-2025
        - codex-cxs-329-2017
    - rule_id: sb_fdm_bat_not_applicable
      applies_to: "Applicability of FDM BAT conclusions"
      rule: "Commission Implementing Decision (EU) 2019/2031 explicitly excludes production of primary products from animal by-products, including fish-oil production. Its BAT-AELs, environmental performance levels, sector ranges, process defaults and monitoring prescriptions must not be applied to this PCR."
      source_ids:
        - eu-fdm-bat-2019
    - rule_id: sb_inventory_completeness
      applies_to: "Each included foreground process"
      rule: "Record process-level raw materials, water, electricity, heat and fuels, products, co-products, residues, wastewater and relevant waste-gas or direct-emission streams from foreground records."
      source_ids:
        - eu-pef-2021
    - rule_id: sb_upstream_livers
      applies_to: "Received fish livers"
      rule: "Include a linked upstream dataset through liver separation and disclose its allocation or burden-assignment rule. The liver input may not be assigned zero upstream burden without reviewed, source-supported justification."
      source_ids:
        - eu-pef-2021
    - rule_id: sb_exclusion_disclosure
      applies_to: "Excluded processes or flows"
      rule: "Justify and document each exclusion and its potential significance. Convenience, missing data or an unsubstantiated generic cut-off is not an acceptable reason."
      source_ids:
        - eu-pef-2021
