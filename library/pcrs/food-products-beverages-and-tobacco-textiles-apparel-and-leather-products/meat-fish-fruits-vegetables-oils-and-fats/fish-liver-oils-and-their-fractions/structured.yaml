allocation_rules:
  - rule_id: alloc_subdivision_first
    applies_to: "Multi-output foreground processes"
    rule: "First subdivide extraction, refining and fractionation records so directly attributable inputs and releases remain with the output that causes them. System expansion may be used when its added function and substituted system are explicitly modelled."
    source_ids:
      - eu-pef-2021
  - rule_id: alloc_physical_relationship
    applies_to: "Residual shared burdens after subdivision"
    rule: "If subdivision or system expansion is not feasible, use a documented, quantifiable physical relationship relevant to the process function. Mass alone is not automatically relevant; justify the chosen relationship."
    source_ids:
      - eu-pef-2021
  - rule_id: alloc_other_relationship
    applies_to: "Shared burdens lacking a defensible physical relationship"
    rule: "Use another relationship, such as relative economic value at the point of co-production, only after documenting why the earlier hierarchy steps failed. Record prices, currency, geography, averaging period, factor and sensitivity."
    source_ids:
      - eu-pef-2021
  - rule_id: alloc_waste_treatment
    applies_to: "Residues, wastewater and off-spec material"
    rule: "Assign collection, treatment and direct-release burdens to the process that generates the waste. Do not give an avoided-product credit unless a reviewed system-expansion substitution is explicitly modelled."
    source_ids:
      - eu-pef-2021
  - rule_id: alloc_upstream_liver_burden
    applies_to: "Fish livers obtained from a fish-processing operation"
    rule: "Import the supplier dataset's disclosed burden-assignment rule and allocation factor through liver separation. Do not prescribe a generic fish-liver allocation factor and do not default the livers to zero burden."
    source_ids:
      - eu-pef-2021
  - rule_id: alloc_mass_reconciliation
    applies_to: "All multi-output lots"
    rule: "Reconcile measured input, product, co-product, waste and measured loss quantities before allocation. Allocation changes burden shares, not the physical mass balance."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_extraction_lot_records
      process_id: "liver_oil_extraction"
      flow_role: "Liver identity, material/energy/water inputs, crude oil, co-products, wastes, wastewater and direct releases"
      record_type: "Production lot and meter records"
      raw_fields: "supplier; fish species; scientific name; liver-only declaration; preservation state; received mass; input/output masses; water meters; electricity/heat/fuel records; wastewater volume and characteristics; waste destination; emission activity data"
      collection_method: "Calibrated scales and meters, batch sheets, supplier records, invoices, laboratory or discharge records"
      unit: "Native recorded units plus kg-reference normalization"
      frequency: "Each lot; utilities at the shortest available interval that can be assigned to production"
      temporal_coverage: "At least one representative production period with start/end dates and seasonal coverage disclosed"
      site_scope: "All foreground lines and shared utilities serving extraction"
      aggregation_rule: "Sum accepted records by lot; subtract documented returns; allocate shared meters by disclosed causal driver; normalize using calc_reference_normalization"
      quality_evidence: "Calibration records; meter coverage; batch closure; supplier traceability; reconciliation statement"
    - protocol_id: cp_refining_lot_records
      process_id: "refining_and_purification"
      flow_role: "Refining feed, materials, water, energy, output, residues, wastewater and direct releases"
      record_type: "Refining batch and utility records"
      raw_fields: "input lot; applied step; transferred mass; chemical/process-aid issue; water; electricity; heat; fuel; product mass; residue and wastewater; release activity data"
      collection_method: "Batch sheets, calibrated scales/meters, warehouse issues, invoices and environmental monitoring"
      unit: "Native recorded units plus kg-reference normalization"
      frequency: "Each refining lot and each applicable utility/accounting interval"
      temporal_coverage: "Same period as the represented product, with mismatches disclosed"
      site_scope: "All included refining and purification equipment and shared services"
      aggregation_rule: "Aggregate by actual step and lot; prevent double counting of recovered materials; normalize using calc_reference_normalization"
      quality_evidence: "Step log; calibration; material balance; utility allocation record; waste manifests"
    - protocol_id: cp_fractionation_lot_records
      process_id: "fractionation_and_concentration"
      flow_role: "Feed, physical-fractionation materials, solvents, energy/water, target and other fractions, wastes and direct releases"
      record_type: "Stepwise batch and recovery records"
      raw_fields: "feed lot; physical operation; material addition; solvent make-up/recovery; energy; water; target output; other fractions; waste; emission activity data; CPC classification decision"
      collection_method: "Batch sheets, mass-flow or tank records, meters, solvent inventory and environmental monitoring"
      unit: "Native recorded units plus kg-reference normalization"
      frequency: "Each applicable physical-transformation lot"
      temporal_coverage: "Same period and technology as the represented fraction or concentrate"
      site_scope: "Every included physical fractionation, winterization or concentration step that retains CPC 21524 identity"
      aggregation_rule: "Close each step balance before aggregation; record recovered loops gross and net; normalize using calc_reference_normalization"
      quality_evidence: "Step lineage; instrument calibration; solvent reconciliation; CPC classification confirmation"
    - protocol_id: cp_release_lot_records
      process_id: "release_and_bulk_packing"
      flow_role: "Final intermediate, additions, packaging, release energy, reference product, rejects and direct releases"
      record_type: "Release batch, packaging issue and certificate records"
      raw_fields: "input lot; additions; packaging items/mass; energy; released net mass; rejected mass; samples; waste; test method/result/pass-fail; product state; intended market"
      collection_method: "Batch and warehouse records, calibrated scales, utility records and controlled laboratory certificate"
      unit: "Native recorded units; final reference mass in kg"
      frequency: "Each released lot"
      temporal_coverage: "Same release lots as the represented dataset period"
      site_scope: "Release, bulk storage and packing operations at the foreground site"
      aggregation_rule: "Count only conforming released mass; reconcile all output dispositions; normalize using calc_reference_normalization"
      quality_evidence: "Certificate of analysis; release authorization; scale calibration; packaging issue reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every variable foreground row"
      rule: "normalized amount = accepted lot quantity / net conforming released product mass from the same represented lot or accounting period"
      inputs:
        - "Raw quantity in native unit"
        - "net released product mass in kg"
      output: "Native unit per 1 kg reference product"
      source_ids: []
    - id: calc_process_mass_balance
      applies_to: "Each extraction, refining, fractionation and release lot"
      rule: "reconciliation residual = total measured mass inputs - total measured product outputs - total measured co-product outputs - total measured waste outputs - separately measured releases; disclose sign, magnitude, likely cause and site acceptance decision"
      inputs:
        - "All measured mass inputs and outputs on consistent wet/dry bases"
      output: "Lot-level reconciliation record; not an invented yield"
      source_ids: []
    - id: calc_shared_utility_assignment
      applies_to: "Shared water and energy meters"
      rule: "assigned quantity = measured shared-meter quantity x documented causal assignment factor; factors across covered products must sum to one for the interval"
      inputs:
        - "Meter total"
        - "operating time"
        - "throughput or other justified causal driver"
      output: "Assigned utility quantity with factor and rationale"
      source_ids:
        - eu-pef-2021
    - id: calc_direct_release
      applies_to: "Calculated direct elementary flows"
      rule: "release = collected activity quantity x declared emission or loss factor; retain factor source, version, applicability and unit conversion"
      inputs:
        - "Fuel/material/refrigerant/solvent activity record"
        - "reviewed factor"
      output: "Compartment-specific direct elementary flow"
      source_ids: []
    - id: calc_totox
      applies_to: "Fish-liver-oil oxidation evidence where applicable"
      rule: "ToTox = 2 x peroxide value + anisidine value; use analytical results from the same applicable release sample basis"
      inputs:
        - "Peroxide value"
        - "anisidine value"
      output: "ToTox product-integrity result"
      source_ids:
        - codex-cxs-329-2017
    - id: calc_allocation_factor
      applies_to: "Shared multi-output burdens"
      rule: "Apply the selected hierarchy rule to each shared inventory row; allocated quantity = shared quantity x documented factor, while directly attributable rows remain unallocated"
      inputs:
        - "Shared inventory row"
        - "chosen relationship"
        - "factor evidence"
      output: "Product-specific allocated row and complete factor set"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Fish livers, intermediates and released product"
      requirement: "Maintain lot lineage from supplier and species through each process; demonstrate liver-only origin and prevent mixing with non-liver fish oil."
      evidence: "Supplier declaration, receiving record, tank/batch genealogy and release record"
    - id: dq_measurement
      applies_to: "Mass, water, energy, material and release records"
      requirement: "Use calibrated or controlled instruments and retain native readings, conversion factors, data owner and uncertainty or resolution."
      evidence: "Calibration certificate, meter specification, scale check and calculation record"
    - id: dq_temporal_coverage
      applies_to: "Dataset period"
      requirement: "Represent the production technology and meaningful operating variation; disclose shutdowns, abnormal lots, seasonality and any mismatch between utility and production periods."
      evidence: "Dated batch list, operating calendar and coverage statement"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Reconcile all major inputs and outputs, document exclusions and identify unmetered shared services. Missing values may not be silently set to zero."
      evidence: "Process flow sheet, mass balance, utility coverage map and gap register"
    - id: dq_representativeness
      applies_to: "Site, technology and geography"
      requirement: "State the represented site(s), equipment route, species mix, product state, geography and market; explain extrapolation beyond the collected data."
      evidence: "Dataset metadata, sampling plan and representativeness assessment"
    - id: dq_product_integrity
      applies_to: "Released lot"
      requirement: "Retain applicable CXS 329-2017 identity, quality, vitamin, contaminant, hygiene and labelling evidence for the declared product and market state; do not substitute a generic composition profile."
      evidence: "Controlled specification, certificate of analysis, compliance decision and label/dispatch record"
    - id: dq_secondary_datasets
      applies_to: "Upstream fish, energy, materials, transport and treatment"
      requirement: "Record dataset identity, version, geography, technology, temporal reference and reason for selection; identify proxies and replacement triggers."
      evidence: "Dataset register and data-quality assessment"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "Require product flow UUID 895379c3-482c-42db-8aee-5d4805685442, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg and reference amount 1."
    source_ids: []
  - rule_id: val_liver_origin
    applies_to: "Product eligibility"
    rule: "Fail eligibility if liver-only origin, fish species or lot lineage is absent, or if whole-fish/non-liver oil enters the product without separately proving that it is outside the reference product."
    source_ids:
      - codex-cxs-329-2017
      - unsd-cpc-3-0-2025
  - rule_id: val_route_completeness
    applies_to: "Process map"
    rule: "Require extraction and release plus every physical refining, purification, winterization, physical fractionation, concentration and solvent-use or recovery step actually applied. A declared crude product must state that further processing is required."
    source_ids:
      - codex-cxs-329-2017
      - unsd-cpc-3-0-2025
  - rule_id: val_cpc_chemical_modification_gate
    applies_to: "Reference-product eligibility"
    rule: "Fail CPC 21524 eligibility when hydrolysis, hydrogenation, inter-esterification, re-esterification, elaidinisation, esterification or another chemical-form adjustment produces a final product classified in CPC 21590 or another applicable category. Require the dataset to route to that category; Codex fish-oil product-form descriptions cannot override the CPC decision."
    source_ids:
      - unsd-cpc-3-0-2025
      - codex-cxs-329-2017
  - rule_id: val_inventory_completeness
    applies_to: "Foreground process inventory"
    rule: "Require collected or transparently calculated materials, water, energy, products, co-products, wastes, wastewater and applicable direct-release rows for each included process; reject silent zeroes and unlabeled defaults."
    source_ids:
      - eu-pef-2021
  - rule_id: val_mass_balance
    applies_to: "Each production lot or represented period"
    rule: "Require a documented mass-balance reconciliation with all dispositions and residual explanation before normalization and allocation."
    source_ids: []
  - rule_id: val_allocation
    applies_to: "Multi-output processes and upstream livers"
    rule: "Require subdivision first, documented hierarchy choice, complete factors and sensitivity where another relationship is used. Reject an unexplained zero burden for received fish livers."
    source_ids:
      - eu-pef-2021
  - rule_id: val_product_integrity
    applies_to: "Released product"
    rule: "Require applicable CXS 329-2017 identity and product-integrity test evidence for the declared named/unnamed, crude/refined/fraction state and intended market. Fail when the certificate basis does not match the released lot."
    source_ids:
      - codex-cxs-329-2017
  - rule_id: val_no_generic_values
    applies_to: "Inventory and product evidence"
    rule: "Reject any generic energy, water, composition or yield value presented as foreground fact without a cited applicable source or collected-record basis. Reasoned estimates, if ever introduced during later review, must be explicit, provisional and carry a replacement trigger."
    source_ids:
      - eu-pef-2021
  - rule_id: val_scope_exclusions
    applies_to: "Excluded flows and processes"
    rule: "Require documented rationale and potential significance for each exclusion; fail if an exclusion broadens the product to non-liver fish oil or removes an actually applied foreground operation."
    source_ids:
      - eu-pef-2021
      - unsd-cpc-3-0-2025
published_dataset_profile:
  dataset_role: "Foreground production dataset for a declared fish-liver oil or fish-liver-oil fraction at the producing facility gate"
  downstream_use: "secondary_dataset; background_dataset when independently reviewed, representative and accompanied by the required disclosures"
  allowed_use: "LCA of food-grade fish-liver oils or eligible fractions matching the declared species, liver-only origin, product state, technology, geography, period and market"
  excluded_use: "Non-liver fish oil, mixed fish oil, shellfish or marine-mammal oil, land-animal fat, technical oil, retail formulation, or a route/geography materially different from the dataset without an explicit scenario adjustment"
  required_metadata: "PCR id and version; reference UUIDs; species and scientific name; liver-only evidence; supplier/upstream dataset; wild/farmed status where applicable; named/unnamed and crude/refined/fraction/concentrate physical state; CPC classification decision; actual physical process map; facility geography; reference period; product-integrity specification; allocation; packaging; exclusions; data owners"
  required_quality_disclosure: "Measurement and calibration; lot and temporal coverage; mass-balance residuals; utility assignment; allocation factors; upstream-liver burden rule; secondary-dataset register; product-integrity evidence; missing data, proxies, uncertainty and review status"
  update_trigger: "Change in source species or liver origin, supplier allocation, extraction/physical-refining/purification/winterization/physical-fractionation/concentration route, CPC classification, physical product state, facility technology, material energy/water system, waste or emission treatment, product specification, applicable regulation, reference-flow identity, or a material data-quality correction"
data_sources:
  - id: "unsd-cpc-3-0-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 Explanatory Notes, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Exact CPC 21524 classification reference, separation from non-liver fish oils and other animal fats, and the gate to CPC 21590 or another applicable category"
  - id: "codex-cxs-329-2017"
    type: "standard"
    reference: "Codex Alimentarius, CXS 329-2017, Standard for Fish Oils, amended 2024. https://workspace.fao.org/sites/codex/Standards/CXS%20329-2017/CXS_329e.pdf"
    used_for: "Fish-oil and fish-liver-oil definitions, liver source identity, crude/direct-consumption distinction, physical processing descriptions used within this PCR, product integrity and release evidence; Codex product descriptions do not determine CPC classification"
  - id: "codex-cxs-211-1999"
    type: "standard"
    reference: "Codex Alimentarius, CXS 211-1999, Standard for Named Animal Fats, amended 2024. https://workspace.fao.org/sites/codex/Standards/CXS%20211-1999/CXS_211e.pdf"
    used_for: "Negative-scope check for named land-animal fats; no composition or quantitative factor is imported into this PCR"
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on the use of the Environmental Footprint methods. https://eur-lex.europa.eu/eli/reco/2021/2279/oj"
    used_for: "System-boundary completeness, exclusion disclosure, company-specific data, allocation hierarchy and data-quality requirements"
  - id: "eu-fdm-bat-2019"
    type: "official_guidance"
    reference: "Commission Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries. https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj"
    used_for: "Scope exclusion only: primary fish-oil production is excluded, so its BAT-AELs, environmental performance levels, sector ranges, process defaults and monitoring prescriptions must not be applied"
