system_boundary:
  rules:
    - rule_id: boundary_start
      applies_to: "foreground system"
      rule: "Start when one explicitly identified animal species enters facility receiving after inbound transport ends."
      source_ids:
        - un-cpc-3-0-structure-2025
        - ec-jrc-2024-sa-bref-jrc135916
    - rule_id: boundary_upstream
      applies_to: "upstream activities"
      rule: "Model farming, lawful capture or hunting, and inbound transport in separate upstream datasets."
      source_ids:
        - eu-2021-2279-environmental-footprint
    - rule_id: boundary_core
      applies_to: "foreground processes"
      rule: "Include receiving, slaughter, primary separation, tissue preparation, conditional chilling or freezing, packaging, storage, release, and sanitation."
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
    - rule_id: boundary_end
      applies_to: "foreground system"
      rule: "End with 1 kg net conforming CPC 21170 product at the facility gate, excluding packaging mass."
      source_ids:
        - un-cpc-3-0-structure-2025
        - ec-jrc-2024-sa-bref-jrc135916
    - rule_id: boundary_downstream
      applies_to: "downstream activities"
      rule: "Exclude distribution after the facility gate, retail, use, and end-of-life from this foreground inventory."
      source_ids:
        - eu-2021-2279-environmental-footprint
    - rule_id: boundary_wwtp
      applies_to: "on-site wastewater treatment"
      rule: "Include on-site treatment only when operated inside the reporting facility boundary; otherwise record each wastewater transfer."
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
    - rule_id: boundary_species
      applies_to: "species identity"
      rule: "Require one common and scientific species name; never aggregate reptile, game-bird, or multi-species production into one dataset."
      source_ids:
        - un-cpc-3-0-structure-2025
        - eu-2021-2279-environmental-footprint
    - rule_id: boundary_tissue
      applies_to: "product identity"
      rule: "Require skeletal meat or one explicitly named edible organ; never combine meat and edible offal in one reference output."
      source_ids:
        - un-cpc-3-0-structure-2025
        - eu-2021-2279-environmental-footprint
    - rule_id: boundary_state
      applies_to: "market state"
      rule: "Require exactly one fresh, chilled, or frozen state and enable only matching state-specific rows."
      source_ids:
        - un-cpc-3-0-structure-2025
        - eu-2021-2279-environmental-footprint
    - rule_id: boundary_poultry_exclusion
      applies_to: "classification scope"
      rule: "Exclude poultry meat and poultry edible offal classified under CPC 2112, 2114, or 21160."
      source_ids:
        - un-cpc-3-0-structure-2025
    - rule_id: boundary_completeness
      applies_to: "all foreground exchanges"
      rule: "Record every known exchange atomically or disclose verified absence; do not apply a category cut-off."
      source_ids:
        - eu-2021-2279-environmental-footprint
    - rule_id: boundary_extension
      applies_to: "unlisted in-scope species or organ"
      rule: "Add new fully species- and tissue-specific rows when the selected in-scope variant is not represented; never use an other-species or other-organ flow."
      source_ids:
        - un-cpc-3-0-structure-2025
        - eu-2021-2279-environmental-footprint
    - rule_id: boundary_recursive
      applies_to: "same-category intermediate input"
      rule: "Declare origin for any CPC 21170 intermediate and prevent recursive counting of the same production."
      source_ids:
        - eu-2021-2279-environmental-footprint
