      temporal_coverage: "full study period"
      site_scope: "heat systems serving sanitation"
      aggregation_rule: "convert each carrier with documented properties; prohibit double counting"
      quality_evidence: "invoice; calibrated meter; fuel-quality record; boiler log"
    - protocol_id: cp_hygiene_wastewater
