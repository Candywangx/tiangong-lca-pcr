  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "Divide each lot-attributed exchange by released net conforming reference-product mass."
      inputs:
        - "lot-attributed exchange"
        - "released net mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_variant_gate
      applies_to: "all species-tissue-state rows"
      rule: "Filter the inventory to one declared scientific species name, one skeletal-meat or organ identity, and one market state before normalization."
      inputs:
        - "species identity"
        - "tissue identity"
        - "market state"
        - "row applicability"
      output: "one active reference variant"
      source_ids:
        - un-cpc-3-0-structure-2025
        - eu-2021-2279-environmental-footprint
    - id: calc_stage_electricity
      applies_to: "each stage electricity row"
      rule: "Use a direct submeter or multiply a shared metered total by an auditable equipment activity, residence, or occupancy share."
      inputs:
        - "meter total"
        - "activity or occupancy"
        - "lot mass"
      output: "stage electricity per reference flow"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_species_mass_balance
      applies_to: "each species lot"
      rule: "Reconcile live mass with all separately measured edible tissues, co-products, residuals, wastewater-associated solids, and stock change."
      inputs:
        - "species-specific input and output masses"
      output: "species-specific process mass balance"
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
    - id: calc_tissue_mass_balance
      applies_to: "each meat or organ route"
      rule: "Reconcile untrimmed tissue with accepted product and tissue-specific trimming waste without forced balancing."
      inputs:
        - "untrimmed mass"
        - "accepted mass"
        - "reject mass"
        - "stock change"
      output: "tissue-specific mass balance"
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
    - id: calc_refrigerant_loss
      applies_to: "each refrigerant species"
      rule: "For each circuit, reconcile opening stock plus receipts against closing stock, recovery, and documented transfers."
      inputs:
        - "opening stock"
        - receipts
        - "closing stock"
        - "recovered mass"
        - transfers
      output: "species-specific refrigerant loss"
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
    - id: calc_packaging_mass
      applies_to: "each packaging component"
      rule: "Use issued mass less returned mass, or count multiplied by verified unit mass; apply documented reuse cycles only to pallets."
      inputs:
        - "issued mass"
        - "returned mass"
        - count
        - "unit mass"
        - "reuse ledger"
      output: "component mass per reference flow"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_heat_energy
      applies_to: "each heat carrier and on-site fuel"
      rule: "Convert measured carrier quantity using period-matched temperature, pressure, density, or heating value."
      inputs:
        - "measured carrier quantity"
        - "carrier properties"
      output: "MJ per reference flow"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_combustion_release
      applies_to: "each direct combustion substance"
      rule: "Use direct measured mass flow or a verified equipment-specific factor applied to measured fuel."
      inputs:
        - "measured fuel"
        - "concentration and flow or verified factor"
      output: "substance mass to air per reference flow"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_wastewater_volume
      applies_to: "each wastewater stream"
      rule: "Use a dedicated meter or subtract only documented retained, recovered, or evaporated water from matched metered supply."
      inputs:
        - "stream meter or matched water-balance records"
      output: "m3 wastewater per reference flow"
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
    - id: calc_water_release
      applies_to: "each direct water-release parameter"
      rule: "Multiply measured final-effluent volume by a temporally matched measured concentration and convert units."
      inputs:
        - "effluent volume"
        - "parameter concentration"
        - "unit conversion"
      output: "parameter mass to surface water per reference flow"
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
  data_quality_requirements:
    - id: dq_variant_identity
      applies_to: "reference product"
      requirement: "Use one scientific species identity, one skeletal-meat or named organ identity, and one market state."
      evidence: "signed variant declaration; species record; release record"
    - id: dq_scope_exclusion
      applies_to: "species scope"
      requirement: "Prove that the selected animal is an in-scope reptile or non-poultry bird and is not poultry under CPC 2112, 2114, or 21160."
      evidence: "classification review; species identity; origin record"
    - id: dq_product_specific
      applies_to: "reference product and packaging"
      requirement: "Use variant-specific net mass, BoM, storage, and release records."
      evidence: "approved specification; BoM; signed release"
    - id: dq_site_specific
      applies_to: "foreground operations"
      requirement: "Use company-specific activity data and direct releases for facility-operated processes."
      evidence: "meter; scale; ledger; laboratory; service records"
    - id: dq_temporal
      applies_to: "all foreground rows"
      requirement: "Cover a representative production period and disclose shutdowns, maintenance, seasonal operation, and gaps."
      evidence: "coverage statement; gap register; operating calendar"
    - id: dq_technology
      applies_to: "conditioning, heat, and wastewater treatment"
      requirement: "Identify actual equipment, refrigerant species, heat route, and treatment configuration."
      evidence: "equipment register; piping diagram; service log; process-flow diagram"
    - id: dq_species_mass_balance
      applies_to: "slaughter and separation"
      requirement: "Reconcile one declared species without combining records from another species."
      evidence: "signed species-specific mass balance"
    - id: dq_tissue_mass_balance
      applies_to: "preparation and release"
      requirement: "Reconcile each named meat or organ route and investigate residuals."
      evidence: "signed tissue-specific mass balance"
    - id: dq_meter_reconciliation
      applies_to: "utilities and wastewater"
      requirement: "Reconcile submeters to facility meters and document every allocation driver."
      evidence: "meter hierarchy; calibration; allocation worksheet"
    - id: dq_destination
      applies_to: "co-products and wastes"
      requirement: "Retain destination and legal-status evidence so one physical stream is not both product and waste."
      evidence: "contract; dispatch ticket; acceptance record"
    - id: dq_uuid
      applies_to: "all inventory identities"
      requirement: "Use a Tiangong UUID only after exact semantic hybrid search and public state=100 direct-read verification; otherwise keep it absent."
      evidence: "dual-verification evidence or manifest unresolved entry"
    - id: dq_uncertainty
      applies_to: "all inventory rows"
      requirement: "Document resolution, calibration, missing-data treatment, factor provenance, and allocation uncertainty without inventing a range."
      evidence: "uncertainty register; calculation review"
    - id: dq_completeness
      applies_to: "full inventory"
      requirement: "Demonstrate coverage of species-specific products, utilities, chemicals, packaging, wastes, and direct air and water exchanges."
      evidence: "process-flow diagram; row checklist; reconciliation"
validation_rules:
  - rule_id: validate_reference_uuid
    applies_to: "reference flow"
    rule: "Require Product flow e67d4710-2094-4972-85a2-9e593546ae82, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_reference_amount
    applies_to: "reference output"
    rule: "Require exactly 1 kg net conforming product and exclude packaging mass."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_species_lock
    applies_to: "reference qualifier"
    rule: "Require exactly one common and scientific species identity."
    source_ids:
      - un-cpc-3-0-structure-2025
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_tissue_lock
    applies_to: "reference qualifier"
    rule: "Require exactly one skeletal-meat or explicitly named edible-organ identity."
    source_ids:
      - un-cpc-3-0-structure-2025
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_state_lock
    applies_to: "reference qualifier"
    rule: "Require exactly one of fresh, chilled, or frozen."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_variant_rows
    applies_to: "inventory applicability"
    rule: "Require exactly one species-tissue-state input to the release process and prohibit activating any conflicting variant row."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_scope
    applies_to: "species classification"
    rule: "Require an in-scope reptile or non-poultry bird and reject poultry under CPC 2112, 2114, and 21160."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_unlisted_variant
    applies_to: "unlisted in-scope species or organ"
    rule: "Add new species- and tissue-specific rows before use; reject reptile, game bird, declared species, other organ, or similar selector labels."
    source_ids:
      - un-cpc-3-0-structure-2025
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_boundary
    applies_to: "process coverage"
    rule: "Require every mandatory process and a documented decision for state conditioning and on-site wastewater treatment."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_atomic
    applies_to: "inventory rows"
    rule: "Require one physical or chemical exchange per row_id and nonempty description, amount rule, protocol, uncertainty, applicability, and sources."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_selector_free
    applies_to: "selected flows"
    rule: "Reject collection labels and selection instructions; keep species products, utilities, fuels, refrigerants, chemicals, packaging, wastes, and releases separate."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_official_name_exception
    applies_to: "reference selected flow"
    rule: "Permit collection words only in the official CPC 21170 reference-flow name; every non-reference Selected flow must be selector-free."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_uuid
    applies_to: "inventory UUIDs"
    rule: "Accept a non-reference UUID only after exact semantic hybrid search and public state=100 direct-read verification; otherwise require no UUID."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_manifest_closure
    applies_to: "unresolved UUIDs"
    rule: "Require each UUID-free row_id exactly once in manifest review metadata with candidate identity and rejection reason."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_value_mode
    applies_to: "inventory amounts"
    rule: "Allow only foreground_record or calculated_value backed by collected records; reject unsupported authored quantities and default ranges."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_species_mass_balance
    applies_to: "physical outputs"
    rule: "Reconcile one species-specific live input with all named tissues, co-products, residuals, and stock change without forced balancing."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_tissue_mass_balance
    applies_to: "meat and organ routes"
    rule: "Reconcile every selected tissue input, accepted output, trimming waste, and reject without mixing tissues."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_heat_routes
    applies_to: "thermal inputs"
    rule: "Prevent duplicate accounting of purchased steam, purchased hot water, and on-site fuel for the same heat."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_refrigerants
    applies_to: "cold system"
    rule: "Identify each actual refrigerant species and circuit; require its own make-up and direct-release row when loss occurs."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_hygiene_chemicals
    applies_to: "sanitation"
    rule: "Identify every cleaning and disinfection substance separately from stock and dosing records."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_packaging
    applies_to: "packaging"
    rule: "Match each packaging component and material-specific waste to the product BoM and exclude packaging mass from reference mass."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_destinations
    applies_to: "co-products and wastes"
    rule: "Require destination and status evidence and prohibit assigning one physical quantity to both product and waste."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_wastewater
    applies_to: "wastewater"
    rule: "Keep routine and high-organic-load wastewater separate and distinguish sewer transfer, direct discharge, and on-site treatment."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_air_releases
    applies_to: "direct air releases"
    rule: "Require substance-specific measurement or calculation and factor provenance; reject aggregate combustion or refrigerant-release rows."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_water_releases
    applies_to: "direct water releases"
    rule: "Require temporally matched effluent volume and parameter concentration for each direct-discharge row."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_sources
    applies_to: "evidence"
    rule: "Use only the listed UN CPC, EC JRC SA BREF, and Commission Recommendation sources; do not treat UUID lookup as amount evidence."
    source_ids:
      - un-cpc-3-0-structure-2025
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_bilingual
    applies_to: "bilingual record"
    rule: "Require identical ordered process_id, direction, flow_type, row_id, UUID, controlled tokens, protocol ids, and source-id sequences in en-US and zh-CN."
    source_ids:
      - eu-2021-2279-environmental-footprint
published_dataset_profile:
  dataset_role: "Facility-specific foreground data package for one CPC 21170 species-tissue-state variant"
  downstream_use: "Construction and validation of TianGong flow, process, lifecyclemodel, and dataset projections"
  allowed_use: "Product-specific modelling when one in-scope species, one skeletal-meat or edible-organ identity, one market state, facility boundary, technology, and collection period are disclosed"
  excluded_use: "Category-default inventory; multi-species product; combined meat and offal; mixed states; poultry CPC 2112, CPC 2114, or CPC 21160; unidentified reptile or game-bird selector"
  required_metadata: "Facility geography; period; production volume; lot; common and scientific species name; origin; meat or organ identity; exact tissue; one market state; net-mass method; process configuration; conditioning technology; storage duration; heat route; refrigerant species; packaging BoM; destinations; wastewater route"
  required_quality_disclosure: "Identity evidence; meter and scale calibration; temporal coverage; missing data; calculation inputs; allocation decisions; species and tissue mass balances; uncertainty; UUID status"
  update_trigger: "Change in classification scope, species, tissue, state, production origin, process configuration, conditioning or storage technology, heat route, refrigerant, packaging BoM, destination, wastewater route, or evidence source"
data_sources:
  - id: "un-cpc-3-0-structure-2025"
    type: "dataset"
    reference: "United Nations Statistics Division, CPC Ver. 3.0 official page, https://unstats.un.org/unsd/classifications/Econ/CPC; retained raw structure classifications/systems/cpc/3.0/raw/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Exact CPC 21170 identity; reptile and non-poultry bird meat and edible-offal scope; fresh, chilled, or frozen states; exclusion of poultry CPC 2112, CPC 2114, and CPC 21160"
  - id: "ec-jrc-2024-sa-bref-jrc135916"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Best Available Techniques Reference Document for the Slaughterhouses, Animal By-products and/or Edible Co-products Industries, JRC135916, 2024, DOI 10.2760/18199, https://publications.jrc.ec.europa.eu/repository/handle/JRC135916"
    used_for: "Receiving, slaughter, primary separation, tissue preparation, chilling and freezing, sanitation, utilities, refrigerants, residuals, wastewater, sludge, and direct air and water releases"
  - id: "eu-2021-2279-environmental-footprint"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, consolidated 30 December 2021, https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng"
    used_for: "Product-specific identity and BoM; company-specific manufacturing data; complete LCI; allocation hierarchy; completeness, transparency, data quality, and verification"
