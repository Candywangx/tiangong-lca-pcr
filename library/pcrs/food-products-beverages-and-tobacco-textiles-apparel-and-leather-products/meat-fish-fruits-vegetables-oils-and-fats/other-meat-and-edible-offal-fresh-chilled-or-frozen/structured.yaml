allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "multi-output slaughter and separation"
    rule: "First avoid allocation through subdivision and direct measurement of every named tissue, co-product, utility, and waste."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_expand
    applies_to: "co-products with additional functions"
    rule: "If subdivision cannot resolve function, investigate transparent system expansion before partitioning burdens."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_physical
    applies_to: "remaining multi-output process"
    rule: "Use a documented physical relationship reflecting causal input use and output formation when allocation remains necessary."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_economic
    applies_to: "remaining unresolved relationship"
    rule: "Use economic allocation only when subdivision, system expansion, and a relevant physical relationship are not defensible; disclose sensitivity."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_status
    applies_to: "each co-product and waste"
    rule: "Establish product or waste status from quality, legal status, and destination evidence before allocation; never assign one quantity to both."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_reference_variant
    applies_to: "reference species-tissue-state variant"
    rule: "Assign the reference product only to the one declared variant; other edible outputs remain separately measured co-products."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_waste
    applies_to: "waste treatment"
    rule: "Do not credit a waste destination unless the selected LCA method and documented receiving function require it."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_capture
    applies_to: "upstream production or lawful capture"
    rule: "Keep farming, capture, or hunting burdens in upstream datasets; disclose the upstream method selected."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_consistency
    applies_to: "all process links"
    rule: "Do not double count species-tissue transfers, alternative heat routes, refrigerant make-up and loss, or wastewater outputs and treatment inputs."
    source_ids:
      - eu-2021-2279-environmental-footprint
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_inputs
      process_id: "species_receiving"
      flow_role: "species-specific live animals, electricity, and water"
      record_type: "scale ticket; species record; origin record; utility meter"
      raw_fields: "timestamp; lot_id; species_common_name; scientific_name; origin_status; scale_id; gross_mass; tare_mass; meter_id; opening_reading; closing_reading"
      collection_method: "Link calibrated animal mass and utilities to the lot after inbound transport ends."
      unit: "kg; kWh; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "receiving and holding area"
      aggregation_rule: "sum each row_id once; allocate shared utilities by documented activity"
      quality_evidence: "scale and meter calibration; species identity; lawful-origin record; meter reconciliation"
    - protocol_id: cp_receiving_outputs
      process_id: "species_receiving"
      flow_role: "accepted species transfer, excreta, and species-specific wash wastewater"
      record_type: "transfer scale; acceptance log; waste scale; drain meter"
      raw_fields: "timestamp; lot_id; row_id; species_common_name; scientific_name; accepted_mass; waste_mass; drain_volume; destination"
      collection_method: "Measure each species-specific output independently and retain destination evidence."
      unit: "kg; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "receiving and holding area"
      aggregation_rule: "sum each row_id once; no cross-species aggregation"
      quality_evidence: "calibration; signed acceptance; waste destination; water balance"
    - protocol_id: cp_slaughter_inputs
      process_id: "slaughter_primary_separation"
      flow_role: "accepted animals, slaughter electricity, and water"
      record_type: "transfer scale; electricity meter; water meter"
      raw_fields: "timestamp; lot_id; species_common_name; scientific_name; source_process; mass; meter_id; opening_reading; closing_reading"
      collection_method: "Link one species-specific accepted transfer and utilities to the slaughter lot."
      unit: "kg; kWh; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "slaughter line"
      aggregation_rule: "sum direct records; allocate shared utilities by documented equipment activity"
      quality_evidence: "transfer reconciliation; scale and meter calibration; operating log"
    - protocol_id: cp_slaughter_outputs
      process_id: "slaughter_primary_separation"
      flow_role: "species-tissue intermediates, named co-products, residuals, and wastewater"
      record_type: "scale; inspection record; destination record; wastewater meter"
      raw_fields: "timestamp; lot_id; row_id; species_common_name; scientific_name; tissue_identity; legal_status; mass; volume; destination"
      collection_method: "Weigh each physical output separately and determine product or waste status before aggregation."
      unit: "kg; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "slaughter and primary-separation area"
      aggregation_rule: "sum each row_id once; prohibit overlap between product and waste status"
      quality_evidence: "scale calibration; inspection; destination evidence; species mass balance"
    - protocol_id: cp_slaughter_air
      process_id: "slaughter_primary_separation"
      flow_role: "ammonia and hydrogen sulfide direct releases"
      record_type: "airflow and concentration monitoring"
      raw_fields: "timestamp; operating_state; exhaust_flow; substance; concentration; method; detection_limit"
      collection_method: "Match each substance concentration to exhaust flow and slaughter operation."
      unit: "kg"
      frequency: "monitoring campaign and material change"
      temporal_coverage: "representative operation within study period"
      site_scope: "slaughter release points"
      aggregation_rule: "integrate each substance mass flow over applicable operating time"
      quality_evidence: "laboratory report; method; instrument calibration"
    - protocol_id: cp_preparation_inputs
      process_id: "meat_offal_preparation"
      flow_role: "untrimmed species-tissue inputs, electricity, and water"
      record_type: "transfer scale; utility meter; preparation log"
      raw_fields: "timestamp; lot_id; species_common_name; scientific_name; tissue_identity; mass; meter_id; opening_reading; closing_reading"
      collection_method: "Link every species-tissue transfer and utility record to preparation."
      unit: "kg; kWh; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "meat and offal preparation area"
      aggregation_rule: "sum each row_id once; allocate shared utilities by documented operation"
      quality_evidence: "scale and meter calibration; transfer and preparation records"
    - protocol_id: cp_preparation_outputs
      process_id: "meat_offal_preparation"
      flow_role: "fresh species-tissue outputs, trimming waste, and wash wastewater"
      record_type: "product scale; reject scale; inspection record; drain meter"
      raw_fields: "timestamp; lot_id; row_id; species_common_name; scientific_name; tissue_identity; accepted_mass; rejected_mass; volume; destination"
      collection_method: "Measure accepted product, trimming waste, and wastewater independently."
      unit: "kg; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "meat and offal preparation area"
      aggregation_rule: "sum each row_id once; reconcile each tissue input to outputs"
      quality_evidence: "scale calibration; inspection; destination; mass and water balance"
    - protocol_id: cp_conditioning_products
      process_id: "state_conditioning"
      flow_role: "fresh inputs and chilled or frozen outputs"
      record_type: "transfer scale; temperature record; state release"
      raw_fields: "timestamp; lot_id; row_id; species_common_name; scientific_name; tissue_identity; market_state; mass; temperature; residence_time"
      collection_method: "Link every species-tissue input and output to exactly one declared market state."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "chiller and freezer"
      aggregation_rule: "sum each state-specific row once; prevent state mixing"
      quality_evidence: "scale calibration; temperature log; state release"
    - protocol_id: cp_conditioning_utilities
      process_id: "state_conditioning"
      flow_role: "chilling electricity, freezing electricity, water, defrost wastewater, and condensate"
      record_type: "submeter; water meter; drain meter; operating log"
      raw_fields: "timestamp; lot_id; equipment_id; meter_id; opening_reading; closing_reading; residence_time; occupancy; destination"
      collection_method: "Measure each cold-system utility and aqueous output separately."
      unit: "kWh; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "cold-system equipment"
      aggregation_rule: "sum each row_id once; allocate by measured residence and occupancy"
      quality_evidence: "meter calibration; equipment log; water balance"
    - protocol_id: cp_refrigerant_inventory
      process_id: "state_conditioning"
      flow_role: "R717, R744, and R290 make-up and releases"
      record_type: "purchase; cylinder stock; service log; leak record; circuit inventory"
      raw_fields: "date; circuit_id; refrigerant_code; opening_stock; receipts; closing_stock; recovered_mass; transferred_mass; leak_event"
      collection_method: "Reconcile each refrigerant species and circuit independently."
      unit: "kg"
      frequency: "each service event and annual closure"
      temporal_coverage: "full study period"
      site_scope: "cold-system circuits inside boundary"
      aggregation_rule: "opening stock plus receipts minus closing stock, recovery, and documented transfers"
      quality_evidence: "invoice; cylinder weights; service record; leak-detector log"
    - protocol_id: cp_variant_selection
      process_id: "variant_packaging_release"
      flow_role: "fully specified species-tissue-state inputs"
      record_type: "product scale; variant declaration; release record"
      raw_fields: "timestamp; lot_id; species_common_name; scientific_name; tissue_identity; tissue_kind; market_state; net_mass"
      collection_method: "Measure exactly one fully specified variant for the reference output."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "packaging and release area"
      aggregation_rule: "sum exactly one applicable variant row to released net product mass"
      quality_evidence: "scale calibration; signed variant declaration; state record"
    - protocol_id: cp_packaging_bom
      process_id: "variant_packaging_release"
      flow_role: "each named packaging component"
      record_type: "product-specific BoM; issue-return record; component count"
      raw_fields: "lot_id; component_identity; issued_mass; returned_mass; count; unit_mass; reuse_cycles"
      collection_method: "Calculate every named packaging component separately from BoM and stock records."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "packaging line"
      aggregation_rule: "sum each component separately; reusable pallets by documented use cycles"
      quality_evidence: "approved BoM; stock ledger; unit-mass test; pallet ledger"
    - protocol_id: cp_release_records
      process_id: "variant_packaging_release"
      flow_role: "packaging electricity, state-specific storage electricity, and reference output"
      record_type: "electricity submeter; storage occupancy; release scale; quality record"
      raw_fields: "timestamp; lot_id; species_common_name; scientific_name; tissue_identity; market_state; output_net_mass; meter_reading; storage_duration; release_status"
      collection_method: "Determine net conforming product mass and stage electricity for the released variant."
      unit: "kg; kWh"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "packaging, storage, and release area"
      aggregation_rule: "sum released net product once; exclude packaging mass"
      quality_evidence: "scale and meter calibration; signed release; temperature record"
    - protocol_id: cp_packaging_waste
      process_id: "variant_packaging_release"
      flow_role: "state-specific rejects and each packaging waste"
      record_type: "waste scale; reject log; component count"
      raw_fields: "timestamp; lot_id; row_id; species_common_name; scientific_name; tissue_identity; market_state; gross_mass; tare_mass; count; destination"
      collection_method: "Measure each fully specified reject and each material-specific packaging waste separately."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "packaging and release area"
      aggregation_rule: "sum each row_id once; exclude rejects from reference mass"
      quality_evidence: "waste ticket; reject record; scale calibration"
    - protocol_id: cp_hygiene_inputs
