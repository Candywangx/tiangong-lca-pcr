    rule: "First avoid allocation by separately metering or subdividing reception, extraction, kernel recovery, energy generation, effluent treatment, and residue handling; assign inputs and emissions directly where a physical process relationship is documented."
    source_ids:
      - eu-jrc-ilcd-handbook-2010
  - rule_id: allocation_residual_choice
    applies_to: "crude palm oil, palm kernels, exported residues, recovered oil, and exported energy"
    rule: "When subdivision cannot resolve a remaining shared burden, select and document a causal physical relationship. If no defensible physical relationship exists, use a documented economic relationship based on consistent reporting-period prices; disclose the method, data, co-product status, and allocation shares."
    source_ids:
      - eu-jrc-ilcd-handbook-2010
  - rule_id: allocation_internal_energy
    applies_to: "fibre, shells, empty bunches, steam, and electricity used within the mill"
    rule: "Treat internal residue fuel and internally generated energy as transfers and do not create an avoided-product credit. Assign boiler and generation burdens to consuming mill processes by metered energy delivery or another documented physical relationship."
    source_ids:
      - fao-palm-oil-processing-2002
      - eu-jrc-ilcd-handbook-2010
  - rule_id: allocation_export_sensitivity
    applies_to: "exported co-products"
    rule: "Do not apply substitution or avoided-burden credits inside the attributional foreground dataset. When exported co-products materially affect results, report a sensitivity case using an alternative defensible allocation basis."
    source_ids:
      - eu-jrc-ilcd-handbook-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_ffb_receipt
      process_id: "ffb_reception_preparation"
      flow_role: "fresh fruit bunch receipt and origin"
      record_type: "weighbridge ticket, supplier record, harvest or dispatch record"
      raw_fields: "timestamp; supplier or estate; gross mass; tare mass; net mass; rejected mass; origin; transport mode and distance; receipt condition"
      collection_method: "calibrated weighbridge or scale reconciled to supplier and inventory records"
      unit: "kg"
      frequency: "every delivery or batch"
      temporal_coverage: "full reporting period"
      site_scope: "all fruit received by the declared mill"
      aggregation_rule: "sum accepted net mass by origin; reconcile rejects and opening or closing stock"
      quality_evidence: "calibration certificate; ticket sequence check; supplier reconciliation"
    - protocol_id: cp_water_energy_records
      process_id: "all_processes"
      flow_role: "water, electricity, fuel, steam, and internally generated energy"
      record_type: "meter reading, invoice, tank record, fuel analysis, operating log"
      raw_fields: "meter id; opening and closing reading; purchase quantity; fuel type; heating-value basis; biomass moisture; steam or electricity generation; internal delivery; downtime"
      collection_method: "calibrated meters and invoice or stock reconciliation; engineering calculation only from recorded operating data"
      unit: "kg water; kWh electricity; MJ fuel or steam"
      frequency: "continuous or each receipt, aggregated monthly"
      temporal_coverage: "full reporting period"
      site_scope: "all foreground operations and shared utilities"
      aggregation_rule: "subtract documented non-PCR users and stock change; normalize attributable net use to crude palm oil output"
      quality_evidence: "meter calibration; invoices; fuel certificates; reconciliation worksheet"
    - protocol_id: cp_coproduct_residue_records
      process_id: "all_processes"
      flow_role: "crude oil, kernels, internal transfers, co-products, residues, and stock changes"
      record_type: "calibrated scale or tank record, dispatch note, laboratory moisture result, inventory record"
      raw_fields: "flow type; origin process; destination; gross and net mass; moisture; quality grade; opening stock; closing stock; dispatch quantity; revenue status"
      collection_method: "direct weighing or calibrated tank volume with density and temperature record; documented mass balance where direct weighing is unavailable"
      unit: "kg"
      frequency: "each batch or dispatch, aggregated monthly"
      temporal_coverage: "full reporting period"
      site_scope: "all production lines, storage tanks, and residue destinations"
      aggregation_rule: "sum by flow and destination; correct only with measured moisture, density, and stock data"
      quality_evidence: "scale or tank calibration; dispatch reconciliation; laboratory result; mass-balance review"
    - protocol_id: cp_effluent_emissions
      process_id: "mill_energy_residue_management"
      flow_role: "effluent, treatment, final waste, and direct emissions"
      record_type: "flow meter, sampling result, fuel record, treatment log, waste manifest, emission monitoring record"
      raw_fields: "flow or mass; sampling time; concentration; detection limit; treatment technology; capture or flare operation; fuel quantity; factor identity; discharge compartment; waste destination"
      collection_method: "continuous or batch flow measurement plus representative sampling; direct emissions monitoring or calculation from collected activity data and cited factors"
      unit: "kg; m3; kg substance; operating hours"
      frequency: "continuous or each batch with sampling at a documented representative frequency"
      temporal_coverage: "full reporting period including shutdown and upset events"
      site_scope: "every treatment unit, discharge point, boiler, generator, flare, and final waste route"
      aggregation_rule: "calculate pollutant load as measured flow times concentration; aggregate by compartment and event; retain zeros only when measurement supports them"
      quality_evidence: "meter calibration; laboratory QA/QC; chain of custody; factor citation; treatment and flare logs; waste manifests"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = attributable reporting-period amount / reporting-period mass of conforming crude palm oil output"
      inputs:
        - "attributable amount"
        - "crude palm oil output mass"
        - "stock adjustments"
      output: "amount per 1 kg crude palm oil"
      source_ids:
        - eu-jrc-ilcd-handbook-2010
    - id: calc_oil_extraction_ratio
      applies_to: "fresh fruit bunch input and crude palm oil output"
      rule: "oil extraction ratio = conforming crude palm oil output mass / accepted fresh fruit bunch input mass"
      inputs:
        - crude_palm_oil_output
        - fresh_fruit_bunch_input
      output: "kg crude palm oil/kg accepted fresh fruit bunches"
      source_ids:
        - fao-palm-oil-processing-2002
    - id: calc_material_balance
      applies_to: "each process and total foreground system"
      rule: "balance closure = (accounted outputs + closing stock - opening stock) / accounted inputs; report the balance gap without forcing closure by an undocumented residual"
      inputs:
        - "measured inputs"
        - outputs
        - "internal transfers"
        - stocks
      output: "balance closure and unexplained mass gap"
      source_ids:
        - eu-jrc-ilcd-handbook-2010
    - id: calc_pollutant_load
      applies_to: "treated effluent and sampled releases"
      rule: "pollutant load = measured discharge mass or volume times measured concentration, with unit conversion and below-detection treatment documented"
      inputs:
        - "discharge flow"
        - concentration
        - "density if needed"
        - "sampling coverage"
      output: "kg substance per reporting period and per kg crude palm oil"
      source_ids:
        - eu-jrc-ilcd-handbook-2010
    - id: calc_factor_emissions
      applies_to: "non-measured boiler or treatment emissions"
      rule: "emission = collected activity datum times a cited, technology- and region-appropriate factor; factor identity, version, unit, and applicability are mandatory"
      inputs:
        - "fuel or treatment activity"
        - factor
        - "capture or oxidation data"
      output: "kg elementary flow per kg crude palm oil"
      source_ids:
        - eu-jrc-ilcd-handbook-2010
  data_quality_requirements:
    - id: dq_identity_and_traceability
      applies_to: "fruit, oil, co-products, and residues"
      requirement: "Preserve origin, destination, reporting period, process route, quality state, and the link between raw records and each normalized row."
      evidence: "weighbridge tickets; dispatch records; process logs; record-to-row traceability table"
    - id: dq_temporal_coverage
      applies_to: "all foreground data"
      requirement: "Cover one complete, declared reporting period, normally 12 consecutive months; a shorter campaign is allowed only when seasonality, startup, shutdown, maintenance, and representativeness are explicitly assessed."
      evidence: "dated meter series; production calendar; downtime and maintenance logs; representativeness justification"
    - id: dq_measurement_control
      applies_to: "mass, water, energy, effluent, and laboratory data"
      requirement: "Use calibrated instruments or document the engineering calculation and uncertainty; retain calibration status, sampling method, detection limits, and corrections."
      evidence: "calibration certificates; laboratory QA/QC; meter and sampling procedures"
    - id: dq_completeness
      applies_to: "all required processes and important flows"
      requirement: "Include every required process and all material product, waste, energy, water, and elementary flows; quantify or explicitly disclose gaps rather than assigning unsupported zeros."
      evidence: "completeness checklist; mass and energy reconciliation; gap register"
    - id: dq_representativeness
      applies_to: "upstream datasets and foreground factors"
      requirement: "Document time, geography, technology, and supplier coverage and justify any proxy dataset or factor."
      evidence: "dataset metadata; supplier coverage table; factor citation and applicability review"
    - id: dq_allocation_review
      applies_to: "multifunctional processes"
      requirement: "Preserve direct assignments, selected allocation relationship, period data, shares, and sensitivity results sufficient for an independent recalculation."
      evidence: "allocation worksheet; prices or physical relationship data; sensitivity calculation"
validation_rules:
  - rule_id: validate_reference_flow_identity
    applies_to: "reference flow"
    rule: "Confirm the product flow UUID is c25748fe-ebcf-4a0e-bcf9-544edb1645b1, the flow property UUID is 93a60a56-a3c8-11da-a746-0800200b9a66, the unit group UUID is 93a60a57-a4c8-11da-a746-0800200c9a66, the reference amount is 1, and the reference unit is kg."
    source_ids: []
  - rule_id: validate_scope_and_qualifiers
    applies_to: "dataset identity"
    rule: "Confirm the dataset represents unrefined crude palm oil at the producing mill gate and declares every required qualifier; reject refined, fractionated, or palm-kernel-oil outputs as this PCR's reference product."
    source_ids:
      - fao-palm-oil-processing-2002
  - rule_id: validate_process_completeness
    applies_to: "process inventory"
    rule: "Confirm all three required processes are present and that fresh fruit bunches, process water, energy, crude palm oil, kernels, residues, effluent, direct emissions, final treatment, and stock changes are recorded or supported by an explicit, reviewed non-applicability statement."
    source_ids:
      - fao-palm-oil-processing-2002
      - eu-jrc-ilcd-handbook-2010
  - rule_id: validate_mass_balance_and_yield
    applies_to: "material inventory"
    rule: "Recalculate the extraction ratio and process or system mass balances. Values outside a cited or provisional QA guardrail trigger investigation, not automatic replacement; unresolved material gaps make validation inconclusive."
    source_ids:
      - fao-palm-oil-processing-2002
      - eu-jrc-ilcd-handbook-2010
  - rule_id: validate_energy_effluent_emissions
    applies_to: "utilities and environmental flows"
    rule: "Reconcile purchased and internally generated energy, verify effluent route and sampled loads, and confirm that boiler and anaerobic-treatment emissions are measured or calculated from collected activity data with cited factors; unsupported zero emissions are errors."
    source_ids:
      - fao-palm-oil-processing-2002
      - eu-jrc-ilcd-handbook-2010
  - rule_id: validate_allocation_recalculation
    applies_to: "co-products"
    rule: "Recalculate allocation shares from retained foreground data, confirm internal transfers receive no avoided-product credit, and verify the selected method and sensitivity case are disclosed."
    source_ids:
      - eu-jrc-ilcd-handbook-2010
  - rule_id: validate_data_quality
    applies_to: "complete foreground package"
    rule: "Confirm calibration, temporal coverage, origin and destination traceability, representativeness, gap disclosure, and raw-record-to-row lineage; missing evidence produces a finding and may make validation inconclusive."
    source_ids:
      - eu-jrc-ilcd-handbook-2010
published_dataset_profile:
  dataset_role: "Foreground unit-process or aggregated mill-gate dataset for crude palm oil production"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Attributional LCI and LCA models requiring unrefined crude palm oil at a declared producing mill gate, provided geography, technology, fruit origin, quality state, allocation, energy, and effluent-treatment qualifiers match the study"
  excluded_use: "Direct representation of refined or fractionated palm oil, palm kernel oil, cultivation-only systems, generic markets without geography and time qualification, or comparative claims lacking compatible scope and critical review"
  required_metadata: "PCR id and version; reference flow UUID and unit; geography; reporting period; mill route and scale; fruit origin and upstream dataset links; oil quality basis; process coverage; energy configuration; effluent and residue routes; allocation method and shares; source and factor identities; completeness and uncertainty statements"
  required_quality_disclosure: "Primary-data share; instrument and sampling coverage; mass and energy balance gaps; temporal, geographical, and technological representativeness; proxy data and emission factors; provisional QA guardrail findings; unresolved non-reference UUIDs; allocation sensitivity"
  update_trigger: "Material change in fruit supply, mill technology or capacity, oil quality basis, energy system, methane capture, effluent or residue treatment, co-product destination or value, allocation method, regulatory requirements, or evidence showing the dataset is no longer representative"
