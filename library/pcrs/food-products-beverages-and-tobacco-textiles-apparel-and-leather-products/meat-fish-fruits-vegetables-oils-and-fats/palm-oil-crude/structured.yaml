      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize every reported inventory to exactly 1 kg of as-delivered crude palm oil after clarification and drying; report measured oil moisture and impurities so alternative dry-matter calculations remain reproducible."
