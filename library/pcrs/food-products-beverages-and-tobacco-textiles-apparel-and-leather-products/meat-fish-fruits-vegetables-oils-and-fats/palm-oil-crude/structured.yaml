system_boundary:
  rules:
    - rule_id: boundary_mill_gate_operations
      applies_to: "foreground crude palm oil production"
      rule: "Include fresh-fruit-bunch receipt, sterilization or cooking, threshing, digestion, pressing, clarification, drying, bulk mill storage, kernel and residue recovery, on-site energy generation, and effluent or residue management when operated by or physically integrated with the mill."
      source_ids:
        - fao-palm-oil-processing-2002
    - rule_id: boundary_upstream_traceability
      applies_to: "fresh fruit bunches and purchased utilities"
      rule: "Model cultivation and inbound fresh-fruit-bunch transport as traceable upstream product inputs, and model purchased electricity, fuels, water, chemicals, and waste services with geographically and technologically representative upstream datasets."
      source_ids:
        - eu-jrc-ilcd-handbook-2010
    - rule_id: boundary_excluded_downstream
      applies_to: "downstream processing"
      rule: "Exclude refining, bleaching, deodorization, fractionation, manufacture of palm kernel oil, packaging for consumer sale, and distribution beyond the producing mill gate from the foreground reference-product dataset."
      source_ids:
        - fao-palm-oil-processing-2002
    - rule_id: boundary_no_unreported_disposal
      applies_to: "effluent, residues, and direct emissions"
      rule: "Do not assume mill effluent, empty fruit bunches, fibre, shells, ash, sludge, or direct emissions are burden-free or zero; record their measured disposition and the treatment route or document a justified data gap."
      source_ids:
        - fao-palm-oil-processing-2002
        - eu-jrc-ilcd-handbook-2010
boundary_abstraction:
  declared_starting_condition: "Fresh fruit bunches or loose oil-palm fruit received at the mill, with supplier or estate origin, receipt mass, receipt time, and inbound transport treatment declared"
  starting_condition_role: "Upstream product input to the mill foreground system"
  product_classification_scope: "Crude palm oil from oil-palm fruit mesocarp; palm-kernel oil and refined or fractionated palm-oil products are outside the category"
  recursive_input_rule: "Any externally purchased crude palm oil entering blending or reprocessing is recorded as a separate same-category input with its own upstream dataset and quantity; it is not reclassified as fresh fruit bunch input or silently merged with mill-produced oil"
  upstream_dataset_requirement: "Use supplier-, estate-, route-, and period-representative datasets for fresh fruit bunch production and inbound transport, and representative datasets for purchased utilities, fuels, chemicals, and external treatment services"
  disclosure: "Declare the share and origin of own-estate and third-party fruit, mill route and scale, receipt-to-processing control, energy configuration, effluent treatment, residue destinations, co-product treatment, allocation method, and any upstream or foreground data gaps"
