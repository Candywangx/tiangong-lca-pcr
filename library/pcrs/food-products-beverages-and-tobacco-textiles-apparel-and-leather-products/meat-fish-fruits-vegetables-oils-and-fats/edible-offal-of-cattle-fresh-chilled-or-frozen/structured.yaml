  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "Divide the lot-attributed exchange by released net conforming cattle edible-offal mass."
      inputs:
        - "lot-attributed exchange"
        - "released net reference-product mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_composition_sum
      applies_to: "all organ-component rows"
      rule: "Sum only the applicable organ-specific component masses in one declared market state and reconcile the sum to released net reference-product mass."
      inputs:
        - "organ identity"
        - "organ net mass"
        - "market state"
        - "released net mass"
      output: "declared organ composition and composition mass balance"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_stage_electricity
      applies_to: "each stage electricity row"
      rule: "Use a direct stage submeter; for a shared meter, multiply the metered total by an auditable activity, residence-time, or occupancy share."
      inputs:
        - "meter total"
        - "activity or occupancy"
        - "lot release mass"
      output: "stage electricity per reference flow"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_mass_balance
      applies_to: "cattle, carcass, organ, co-product, and waste mass rows"
      rule: "Reconcile measured mass entering each process with separately recorded product and waste outputs; investigate rather than distribute unexplained imbalance."
      inputs:
        - "input masses"
        - "output masses"
        - "moisture or stock change"
      output: "documented process mass balance"
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
    - id: calc_refrigerant_loss
      applies_to: "each refrigerant species"
      rule: "For each circuit and species, reconcile opening stock plus receipts against closing stock, recovered mass, and documented transfers."
      inputs:
        - "opening stock"
        - receipts
        - "closing stock"
        - "recovered mass"
        - transfers
        - "service records"
      output: "species-specific refrigerant loss"
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
    - id: calc_packaging_mass
      applies_to: "each packaging component"
      rule: "Calculate use from issued mass less returned mass, or component count multiplied by verified unit mass; apply documented reuse cycles only to reusable pallets."
      inputs:
        - "issued mass"
        - "returned mass"
        - count
        - "unit mass"
        - "reuse ledger"
      output: "component mass per reference flow"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_thermal_energy
      applies_to: "each purchased heat carrier and on-site fuel"
      rule: "Convert measured carrier quantity to delivered energy using period-matched temperature, pressure, density, or heating-value records."
      inputs:
        - "measured carrier quantity"
        - "carrier property records"
      output: "MJ per reference flow"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_combustion_release
      applies_to: "each direct combustion substance"
      rule: "Use direct measured mass flow where available; otherwise apply a verified equipment-specific factor to measured fuel and retain provenance."
      inputs:
        - "measured fuel"
        - "direct concentration and flow or verified factor"
      output: "substance mass to air per reference flow"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_wastewater_volume
      applies_to: "each wastewater stream"
      rule: "Use a dedicated meter; when calculated, subtract only documented retained, recovered, or evaporated water from matched metered supply."
      inputs:
        - "stream meter or matched water-balance records"
      output: "m3 wastewater per reference flow"
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
    - id: calc_water_release
      applies_to: "each direct water-release parameter"
      rule: "Multiply measured final-effluent volume by a temporally matched measured concentration and convert units without substituting a limit for a measurement."
      inputs:
        - "effluent volume"
        - "parameter concentration"
        - "unit conversion"
      output: "parameter mass to surface water per reference flow"
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
  data_quality_requirements:
    - id: dq_product_specific
      applies_to: "reference product and packaging"
      requirement: "Use product-specific organ composition, market state, net mass, BoM, storage, and release records."
      evidence: "approved composition; BoM; signed lot release"
    - id: dq_site_specific
      applies_to: "foreground operations"
      requirement: "Use company-specific activity data and direct releases for processes operated by the reporting facility."
      evidence: "meter, scale, ledger, laboratory, and service records"
    - id: dq_state_identity
      applies_to: "all organ components"
      requirement: "Declare exactly one of fresh, chilled, or frozen for the reference product and preserve that state on every applicable component row."
      evidence: "temperature record; state release; composition sheet"
    - id: dq_temporal
      applies_to: "all foreground rows"
      requirement: "Cover a representative production period and disclose shutdowns, maintenance, seasonal storage, and missing intervals."
      evidence: "coverage statement; gap register; operating calendar"
    - id: dq_technology
      applies_to: "conditioning, storage, thermal utility, and wastewater treatment"
      requirement: "Identify actual equipment, refrigerant species, heat route, and treatment configuration."
      evidence: "equipment register; piping diagram; service log; process-flow diagram"
    - id: dq_mass_balance
      applies_to: "cattle and organ conversion"
      requirement: "Reconcile live cattle, carcass, each organ, co-products, residuals, wastewater-associated solids, and stock change."
      evidence: "signed mass-balance worksheet and investigated residuals"
    - id: dq_meter_reconciliation
      applies_to: "utilities and wastewater"
      requirement: "Reconcile submeters to facility meters and document each allocation driver."
      evidence: "meter hierarchy; calibration record; allocation worksheet"
    - id: dq_destination
      applies_to: "co-products and wastes"
      requirement: "Retain destination, legal status, and acceptance evidence so one physical stream is not both a product and a waste."
      evidence: "contract; dispatch ticket; inspection or acceptance record"
    - id: dq_uuid
      applies_to: "all inventory identities"
      requirement: "Use a Tiangong UUID only after exact semantic hybrid search and public state=100 direct-read verification; keep UUID absent while unresolved."
      evidence: "dual-verification evidence or manifest unresolved entry"
    - id: dq_uncertainty
      applies_to: "all inventory rows"
      requirement: "Document measurement resolution, calibration, missing-data treatment, factor provenance, and allocation uncertainty without inventing a category range."
      evidence: "uncertainty register and calculation review"
    - id: dq_completeness
      applies_to: "full inventory"
      requirement: "Demonstrate coverage of organ components, material, energy, waste, and direct air and water exchanges inside the boundary."
      evidence: "process-flow diagram; row checklist; input-output reconciliation"
validation_rules:
  - rule_id: validate_reference_uuid
    applies_to: "reference flow"
    rule: "Require Product flow a6673976-2ef4-4502-b9f5-bbc57099bb40, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_reference_amount
    applies_to: "reference output"
    rule: "Require exactly 1 kg net conforming cattle edible offal and exclude packaging mass."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_scope
    applies_to: "product identity"
    rule: "Reject buffalo edible offal and every non-cattle species."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_composition
    applies_to: "reference composition"
    rule: "Require a nonempty organ composition and organ-specific measured masses whose applicable sum equals released net reference-product mass."
    source_ids:
      - un-cpc-3-0-structure-2025
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_state
    applies_to: "market state"
    rule: "Require exactly one of fresh, chilled, or frozen and reject mixing state-specific component rows in one reference product."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_additional_organs
    applies_to: "organ identities"
    rule: "When a cattle organ not represented by an authored row is included, add one new organ-specific input and output row rather than using a residual category."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_boundary
    applies_to: "process coverage"
    rule: "Require every mandatory process and a documented inclusion decision for temperature conditioning and on-site wastewater treatment."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_atomic
    applies_to: "inventory rows"
    rule: "Require one specific physical or chemical exchange per row_id and nonempty description, amount rule, protocol, uncertainty, applicability, and sources."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_selector_free
    applies_to: "selected flows"
    rule: "Reject collection labels and instructions in Selected flow; organs, utilities, fuels, refrigerants, chemicals, packaging, wastes, and releases remain separate."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_official_or
    applies_to: "reference selected flow"
    rule: "Permit the word or only in the official CPC 21151 reference-product Selected flow; every non-reference Selected flow must be selector-free."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_uuid
    applies_to: "inventory UUIDs"
    rule: "Accept a non-reference UUID only after exact semantic hybrid search and public state=100 direct-read verification; otherwise require no UUID."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_manifest_closure
    applies_to: "unresolved UUIDs"
    rule: "Require every UUID-free row_id to appear exactly once in manifest review_metadata with candidate identity and rejection reason."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_value_mode
    applies_to: "inventory amounts"
    rule: "Allow foreground_record or calculated_value supported by collected records; reject unsupported authored quantities and category default ranges."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_mass_balance
    applies_to: "physical outputs"
    rule: "Reconcile cattle, carcass, each organ, co-products, residuals, contents, wastewater-associated solids, and stock change without forced balancing."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_heat_routes
    applies_to: "thermal inputs"
    rule: "Prevent duplicate recording of purchased steam, purchased hot water, and on-site fuel used to generate the same heat."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_refrigerants
    applies_to: "cold system"
    rule: "Identify each actual refrigerant by species and circuit; require its own make-up and direct-release row when loss occurs."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_cleaning_agents
    applies_to: "cleaning"
    rule: "Identify each cleaning or disinfection substance separately from stock and dosing records; add a new atomic row for every additional substance."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_packaging
    applies_to: "packaging"
    rule: "Match each packaging component and its material-specific waste to the product BoM and exclude packaging mass from reference-product mass."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_destinations
    applies_to: "co-products and wastes"
    rule: "Require destination and status evidence and prohibit assigning one physical quantity to both a product row and a waste row."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_wastewater
    applies_to: "wastewater"
    rule: "Keep routine and high-organic-load wastewater separate; distinguish sewer transfer, direct surface-water discharge, and on-site treatment."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_air_releases
    applies_to: "direct air releases"
    rule: "Require substance-specific measurement or calculation and factor provenance; reject an aggregate combustion or refrigerant-release row."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_water_releases
    applies_to: "direct water releases"
    rule: "For direct discharge, require temporally matched effluent volume and parameter concentration for each release row."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_sources
    applies_to: "evidence"
    rule: "Use only the listed UN CPC, EC JRC SA BREF, and Commission Recommendation sources; do not treat UUID lookup as amount evidence."
    source_ids:
      - un-cpc-3-0-structure-2025
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_bilingual
    applies_to: "bilingual record"
    rule: "Require identical ordered process_id, direction, flow_type, row_id, UUID, controlled tokens, protocol ids, and source-id sequences in en-US and zh-CN."
    source_ids:
      - eu-2021-2279-environmental-footprint
published_dataset_profile:
  dataset_role: "Facility-specific foreground data package for CPC 21151 cattle edible offal"
  downstream_use: "Construction and validation of TianGong flow, process, lifecyclemodel, and dataset projections"
  allowed_use: "Product-specific modelling when organ composition, single market state, facility boundary, technology, and collection period are disclosed"
  excluded_use: "Category-default inventory; buffalo edible offal; non-cattle edible offal; undeclared organ composition; mixed market states"
  required_metadata: "Facility geography; reporting period; production volume; lot definition; organ identities and component masses; single market state; net-mass method; slaughter and preparation configuration; conditioning technology; storage duration; heat route; refrigerant species; packaging BoM; co-product and waste destinations; wastewater route"
  required_quality_disclosure: "Meter and scale calibration; temporal coverage; missing data; calculation inputs; allocation decisions; organ and total mass balances; uncertainty; UUID status"
  update_trigger: "Change in product scope, organ composition, market state, slaughter or preparation configuration, conditioning or storage technology, energy route, refrigerant species, packaging BoM, co-product destination, wastewater route, or evidence source"
