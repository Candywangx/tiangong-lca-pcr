allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "multi-output slaughter and preparation"
    rule: "First avoid allocation through process subdivision and direct measurement of carcass, each organ, co-product, utility, and waste stream."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_expand
    applies_to: "co-products with additional functions"
    rule: "If subdivision cannot resolve a co-product function, investigate transparent system expansion before partitioning burdens."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_physical
    applies_to: "remaining multi-output process"
    rule: "When allocation remains necessary, use a documented physical relationship reflecting causal input use and output generation."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_economic
    applies_to: "remaining unresolved relationship"
    rule: "Use economic allocation only when subdivision, system expansion, and a relevant physical relationship are not defensible; use period-matched facility records and disclose sensitivity."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_status
    applies_to: "each carcass, hide, blood, fat, organ, water, and residue row"
    rule: "Establish product or waste status from quality, legal status, and destination evidence before allocation; never assign the same quantity to both statuses."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_composition
    applies_to: "reference-product organ components"
    rule: "Do not allocate burdens among organ components merely because they are assembled into one declared reference product; their measured masses form the product composition."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_waste
    applies_to: "waste treatment"
    rule: "Do not credit a waste destination unless the selected LCA method and documented receiving function require it; disclose the modelling choice."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_consistency
    applies_to: "all process links"
    rule: "Do not double count an intermediate organ transfer, purchased heat and its upstream fuel, refrigerant make-up and an unrelated loss, or wastewater output and the same treatment input."
    source_ids:
      - eu-2021-2279-environmental-footprint
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_records
      process_id: "cattle_receiving"
      flow_role: "live cattle, receiving utilities, accepted transfer, manure, and lairage wastewater"
      record_type: "scale ticket; acceptance log; utility meter; waste record"
      raw_fields: "timestamp; lot_id; meter_or_scale_id; opening_reading; closing_reading; gross_mass; tare_mass; destination"
      collection_method: "Reconcile calibrated measurements and destination records to the production lot."
      unit: "kg; m3; kWh"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "receiving and lairage"
      aggregation_rule: "sum each row_id once; allocate shared electricity by documented activity"
      quality_evidence: "calibration certificates; signed acceptance and destination records; meter reconciliation"
    - protocol_id: cp_separation_inputs
      process_id: "slaughter_offal_separation"
      flow_role: "accepted cattle, separation electricity, and process water"
      record_type: "transfer record; electricity meter; water meter"
      raw_fields: "timestamp; lot_id; source_process; meter_id; opening_reading; closing_reading"
      collection_method: "Link accepted-cattle transfer and calibrated utility meters to the slaughter lot."
      unit: "kg; kWh; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "slaughter and evisceration line"
      aggregation_rule: "sum direct records; allocate shared meters by documented equipment activity"
      quality_evidence: "transfer reconciliation; meter calibration; operating log"
    - protocol_id: cp_separation_outputs
      process_id: "slaughter_offal_separation"
      flow_role: "carcass, co-products, organ intermediates, residuals, and slaughter wastewater"
      record_type: "scale record; inspection log; destination record; wastewater meter"
      raw_fields: "timestamp; lot_id; row_id; gross_mass; tare_mass; destination; legal_status; flow_reading"
      collection_method: "Weigh each physical output separately and establish product or waste status before aggregation."
      unit: "kg; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "slaughter and offal-separation area"
      aggregation_rule: "sum each row_id once; prohibit overlap between productive and waste destinations"
      quality_evidence: "scale calibration; inspection record; destination evidence; mass balance"
    - protocol_id: cp_slaughter_air
      process_id: "slaughter_offal_separation"
      flow_role: "ammonia and hydrogen sulfide direct releases"
      record_type: "airflow and concentration monitoring"
      raw_fields: "timestamp; operating_state; exhaust_flow; substance; concentration; method; detection_limit"
      collection_method: "Match each substance concentration to exhaust flow and slaughter operation."
      unit: "kg"
      frequency: "monitoring campaign and material change"
      temporal_coverage: "representative operation within study period"
      site_scope: "slaughter air-release points"
      aggregation_rule: "integrate each measured substance mass flow over applicable operating time"
      quality_evidence: "laboratory report; method; instrument calibration"
    - protocol_id: cp_preparation_inputs
      process_id: "offal_preparation"
      flow_role: "untrimmed organ inputs, preparation electricity, and wash water"
      record_type: "transfer scale; utility meter; preparation log"
      raw_fields: "timestamp; lot_id; organ_identity; mass; meter_id; opening_reading; closing_reading"
      collection_method: "Link every organ-specific transfer and utility record to the preparation lot."
      unit: "kg; kWh; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "organ-preparation area"
      aggregation_rule: "sum each row_id once; allocate shared utilities by documented operation"
      quality_evidence: "scale and meter calibration; transfer and preparation records"
    - protocol_id: cp_organ_components
      process_id: "offal_preparation"
      flow_role: "fresh organ components, organ-specific trimming waste, and washing wastewater"
      record_type: "component scale; inspection record; waste scale; wastewater meter"
      raw_fields: "timestamp; lot_id; organ_identity; accepted_mass; rejected_mass; market_state; destination"
      collection_method: "Measure accepted and rejected mass separately for every organ identity."
      unit: "kg; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "organ-preparation area"
      aggregation_rule: "sum each organ row once and reconcile organ input to accepted and rejected outputs"
      quality_evidence: "scale calibration; food-safety inspection; destination record; mass balance"
    - protocol_id: cp_conditioning_records
      process_id: "temperature_conditioning"
      flow_role: "fresh inputs, chilled outputs, frozen outputs, cold-system utilities, and aqueous waste"
      record_type: "transfer scale; electricity meter; water meter; temperature and residence log; drain meter"
      raw_fields: "timestamp; lot_id; organ_identity; market_state; mass; meter_reading; temperature; residence_time; drain_volume"
      collection_method: "Link each organ and declared state to cold-system activity and transfer records."
      unit: "kg; kWh; m3"
