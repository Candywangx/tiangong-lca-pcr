  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "Divide the lot-attributed exchange by released net conforming frozen goat meat mass."
      inputs:
        - "lot-attributed exchange"
        - "released net reference-product mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_stage_electricity
      applies_to: "each stage electricity row"
      rule: "Use a direct stage submeter; when a meter is shared, multiply the metered period total by an auditable equipment-activity or occupancy share."
      inputs:
        - "meter total"
        - "equipment activity or storage occupancy"
        - "lot release mass"
      output: "stage electricity per reference flow"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_mass_balance
      applies_to: "animal, carcass, meat, co-product, and waste mass rows"
      rule: "Reconcile measured mass entering each process with its separately recorded product and waste outputs; investigate rather than distribute unexplained imbalance."
      inputs:
        - "measured input masses"
        - "measured output masses"
        - "moisture or stock change records"
      output: "documented process mass balance"
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
    - id: calc_refrigerant_loss
      applies_to: "each refrigerant species"
      rule: "For each circuit and species, reconcile opening stock plus receipts against closing stock, recovered mass, and documented transfers; record the residual only when supported by service and leak evidence."
      inputs:
        - "opening stock"
        - receipts
        - "closing stock"
        - "recovered mass"
        - transfers
        - "service records"
      output: "species-specific refrigerant loss"
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
    - id: calc_packaging_mass
      applies_to: "each packaging component"
      rule: "Calculate component use from issued mass less returned mass, or component count multiplied by verified unit mass; apply documented reuse cycles only to reusable pallets."
      inputs:
        - "issued mass"
        - "returned mass"
        - "component count"
        - "unit mass"
        - "reuse ledger"
      output: "component mass per reference flow"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_thermal_energy
      applies_to: "each purchased heat carrier and on-site fuel"
      rule: "Convert measured carrier quantity to delivered energy using documented temperature, pressure, density, or heating-value records that match the reporting period."
      inputs:
        - "measured carrier quantity"
        - "carrier property records"
      output: "MJ per reference flow"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_combustion_release
      applies_to: "each direct combustion substance"
      rule: "Use direct measured mass flow where available; otherwise apply a verified equipment-specific factor to measured fuel use and preserve the factor provenance."
      inputs:
        - "measured fuel"
        - "direct concentration and flow or verified factor"
      output: "substance mass to air per reference flow"
      source_ids:
        - eu-2021-2279-environmental-footprint
    - id: calc_wastewater_volume
      applies_to: "each wastewater stream"
      rule: "Use a dedicated flow meter; when calculated, subtract only documented retained, product-bound, recovered, or evaporated water from the matched metered supply."
      inputs:
        - "stream meter or matched water balance records"
      output: "m3 wastewater per reference flow"
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
    - id: calc_water_release
      applies_to: "each direct water-release parameter"
      rule: "Multiply measured final-effluent volume by a temporally matched measured concentration and convert units without substituting a concentration limit for a measured result."
      inputs:
        - "effluent volume"
        - "parameter concentration"
        - "unit conversion"
      output: "parameter mass to surface water per reference flow"
      source_ids:
        - ec-jrc-2024-sa-bref-jrc135916
