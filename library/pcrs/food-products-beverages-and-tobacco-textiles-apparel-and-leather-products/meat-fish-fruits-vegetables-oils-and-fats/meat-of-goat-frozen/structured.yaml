validation_rules:
  - rule_id: validate_reference_uuid
    applies_to: "reference flow"
    rule: "Require Product flow cf1026b3-d517-4896-b54b-0ba4e919a40b, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids:
