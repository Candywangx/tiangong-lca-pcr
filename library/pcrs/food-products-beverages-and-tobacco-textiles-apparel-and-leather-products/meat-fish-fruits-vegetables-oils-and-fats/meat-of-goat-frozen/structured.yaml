allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "multi-output processes"
    rule: "First avoid allocation by process subdivision and direct metering of slaughter, cutting, freezing, packaging, cleaning, and treatment activities."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_expand
    applies_to: "co-products with additional functions"
    rule: "If subdivision cannot resolve a co-product function, investigate transparent system expansion before partitioning burdens."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_physical
    applies_to: "remaining multi-output process"
    rule: "When allocation remains necessary, use a documented physical relationship that reflects the causal use of inputs and generation of outputs."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_economic
    applies_to: "remaining unresolved relationship"
    rule: "Use economic allocation only when neither subdivision, system expansion, nor a relevant physical relationship is defensible; use period-matched facility records and disclose sensitivity."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_status
    applies_to: "each blood, hide, fat, organ, bone, water, and residue row"
    rule: "Establish product or waste status from quality, legal status, and destination evidence before allocation; do not assign the same physical quantity to both statuses."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_waste
    applies_to: "waste treatment"
    rule: "Do not credit a waste destination unless the selected LCA method and documented receiving function require it; disclose the modelling choice."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_consistency
    applies_to: "all process links"
    rule: "Do not double count an intermediate transfer, purchased heat and its upstream fuel, a refrigerant make-up and an unrelated loss, or a wastewater output and the same treatment input."
    source_ids:
      - eu-2021-2279-environmental-footprint
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_records
      process_id: "live_goat_receiving"
      flow_role: "live-goat, electricity, water, accepted transfer, manure, and lairage wastewater"
      record_type: "weighbridge ticket; animal acceptance log; utility meter; waste dispatch record"
      raw_fields: "timestamp; lot_id; meter_or_scale_id; opening_reading; closing_reading; gross_mass; tare_mass; destination"
      collection_method: "Reconcile calibrated measurements and dispatch records to the production lot."
      unit: "kg; m3; kWh"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "receiving area"
      aggregation_rule: "sum lot records once; allocate shared electricity by documented equipment activity"
      quality_evidence: "calibration certificates; signed acceptance and dispatch records; meter reconciliation"
    - protocol_id: cp_slaughter_inputs
      process_id: "slaughter_dressing"
      flow_role: "accepted live-goat input, line electricity, and process water"
      record_type: "transfer record; electricity meter; water meter"
      raw_fields: "timestamp; lot_id; source_process; meter_id; opening_reading; closing_reading"
      collection_method: "Link receiving transfer and calibrated utility meters to the slaughter lot."
      unit: "kg; kWh; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "slaughter line"
      aggregation_rule: "sum direct records; allocate shared meters with documented equipment activity"
      quality_evidence: "transfer reconciliation; calibration; meter logs"
    - protocol_id: cp_slaughter_outputs
      process_id: "slaughter_dressing"
      flow_role: "carcass, co-product, condemned stream, contents, and wastewater output"
      record_type: "scale record; condemnation log; destination record; wastewater meter"
      raw_fields: "timestamp; lot_id; row_id; gross_mass; tare_mass; destination; legal_status; flow_reading"
      collection_method: "Weigh each physical output separately and document product or waste status before aggregation."
      unit: "kg; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "slaughter line"
      aggregation_rule: "sum each row_id once; prohibit overlap between productive and condemned destinations"
      quality_evidence: "scale calibration; inspection record; destination evidence; mass balance"
    - protocol_id: cp_slaughter_air_releases
      process_id: "slaughter_dressing"
      flow_role: "ammonia and hydrogen sulfide direct releases"
      record_type: "stack or capture-flow monitoring record"
      raw_fields: "timestamp; operating_state; exhaust_flow; substance; concentration; method; detection_limit"
      collection_method: "Match substance-specific concentration measurements to exhaust flow and slaughter operation."
      unit: "kg"
      frequency: "monitoring campaign and each material change"
      temporal_coverage: "representative operating period within study period"
      site_scope: "slaughter air-release points"
      aggregation_rule: "integrate measured mass flow over applicable operating time"
      quality_evidence: "laboratory report; monitoring method; instrument calibration"
    - protocol_id: cp_cutting_records
      process_id: "carcass_cutting"
      flow_role: "carcass input, utilities, meat output, bone, fat, trimming waste, and wastewater"
      record_type: "scale record; submeter; destination record; wastewater meter"
      raw_fields: "timestamp; lot_id; row_id; mass; meter_reading; destination; legal_status"
      collection_method: "Link calibrated cutting records and each separated output to the lot."
      unit: "kg; kWh; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "cutting area"
      aggregation_rule: "sum each row_id once and reconcile input-output mass"
      quality_evidence: "scale and meter calibration; destination record; mass balance"
    - protocol_id: cp_freezing_records
      process_id: "chilling_freezing"
      flow_role: "meat transfer, cold-system electricity, water, frozen output, off-spec meat, and aqueous wastes"
      record_type: "scale record; refrigeration submeter; water meter; storage occupancy log; drain meter"
      raw_fields: "timestamp; lot_id; mass; meter_id; opening_reading; closing_reading; storage_duration; drain_volume"
      collection_method: "Link measured cold-system activity and frozen-meat transfers to each released lot."
      unit: "kg; kWh; m3"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "pre-chiller; freezer; frozen store"
      aggregation_rule: "sum direct records; allocate frozen-store electricity by measured occupancy"
      quality_evidence: "scale and meter calibration; temperature and occupancy logs; release record"
    - protocol_id: cp_refrigerant_inventory
      process_id: "chilling_freezing"
      flow_role: "R717, R744, and R290 make-up and direct releases"
      record_type: "refrigerant purchase; cylinder stock; service log; leak record; system charge inventory"
      raw_fields: "date; circuit_id; refrigerant_code; opening_stock; receipts; closing_stock; recovered_mass; transferred_mass; leak_event"
      collection_method: "Reconcile each refrigerant species and circuit independently; never substitute a combined refrigerant total."
      unit: "kg"
      frequency: "each service event and annual closure"
      temporal_coverage: "full study period"
      site_scope: "all cold-system circuits inside boundary"
      aggregation_rule: "opening stock plus receipts minus closing stock, recovery, and documented transfers"
      quality_evidence: "purchase invoice; cylinder weights; service certification; leak-detector log"
    - protocol_id: cp_packaging_bom
      process_id: "packaging_release"
      flow_role: "each packaging component input"
      record_type: "product-specific BoM; issue-return record; component count"
      raw_fields: "lot_id; component_identity; issued_mass; returned_mass; count; unit_mass; reuse_cycles"
      collection_method: "Calculate each named packaging component from product-specific BoM and verified stock records."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "packaging line"
      aggregation_rule: "sum each component separately; allocate reusable pallets by documented use cycles"
      quality_evidence: "approved BoM; stock ledger; unit-mass test; pallet ledger"
    - protocol_id: cp_packaging_release
      process_id: "packaging_release"
      flow_role: "frozen-meat input, packaging electricity, and reference-product output"
      record_type: "transfer scale; electricity submeter; release scale; quality-release record"
      raw_fields: "timestamp; lot_id; input_net_mass; output_net_mass; meter_reading; release_status; temperature"
      collection_method: "Determine net conforming product mass and packaging-line electricity for the released lot."
      unit: "kg; kWh"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "packaging and release area"
      aggregation_rule: "sum released net product once; exclude packaging mass"
      quality_evidence: "scale and meter calibration; signed release; temperature record"
    - protocol_id: cp_packaging_waste
      process_id: "packaging_release"
      flow_role: "off-spec meat and each packaging waste"
      record_type: "waste scale; reject log; component count"
      raw_fields: "timestamp; lot_id; row_id; gross_mass; tare_mass; count; destination"
      collection_method: "Measure each material-specific packaging waste and rejected meat separately."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full study period"
      site_scope: "packaging area"
      aggregation_rule: "sum each row_id once; prohibit transfer of packaging mass into reference product"
      quality_evidence: "waste tickets; reject records; scale calibration"
