    applies_to: "reference output"
    rule: "Require exactly 1 kg net conforming frozen goat meat and exclude packaging mass."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_scope
    applies_to: "product identity"
    rule: "Reject fresh or chilled goat meat, edible offal as the reference product, and any non-goat meat."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_boundary
    applies_to: "process coverage"
    rule: "Require every mandatory process and require a documented inclusion decision for on-site wastewater treatment."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_atomic
    applies_to: "inventory rows"
    rule: "Require one specific physical or chemical exchange per row_id and a nonempty description, amount rule, protocol, uncertainty statement, applicability statement, and source list."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_selector_free
    applies_to: "selected flows"
    rule: "Reject collection labels or instructions in Selected flow; utilities, fuels, refrigerants, chemicals, packaging components, wastes, and releases must remain separate."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_uuid
    applies_to: "inventory UUIDs"
    rule: "Accept a non-reference UUID only after exact semantic flow-hybrid-search and public state=100 direct-read verification; otherwise require no UUID."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_manifest_closure
    applies_to: "unresolved UUIDs"
    rule: "Require every UUID-free row_id to appear once in manifest review_metadata with its candidate identity and rejection reason."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_value_mode
    applies_to: "inventory amounts"
    rule: "Allow foreground_record or calculated_value supported by collected records; reject unsupported authored quantities and category default ranges."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_mass_balance
    applies_to: "physical outputs"
    rule: "Reconcile accepted live mass, carcass, meat, co-products, condemned streams, contents, wastewater-associated solids, and stock change without forced balancing."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_heat_routes
    applies_to: "thermal inputs"
    rule: "Prevent duplicate recording of purchased steam, purchased hot water, and on-site fuel used to generate the same heat."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_refrigerants
    applies_to: "cold system"
    rule: "Identify each actual refrigerant by species and circuit; require its own make-up and direct-release row when a loss occurs."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_cleaning_agents
    applies_to: "cleaning"
    rule: "Identify each cleaning or disinfection substance separately from stock and dosing records; add a new atomic row for every additional substance used."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_packaging
    applies_to: "packaging"
    rule: "Match each actual packaging component and its material-specific waste to the product BoM and exclude packaging mass from the reference product."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_destinations
    applies_to: "co-products and wastes"
    rule: "Require destination and status evidence and prohibit assigning one physical quantity to both a co-product row and a waste row."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_wastewater
    applies_to: "wastewater"
    rule: "Keep routine and high-organic-load wastewater separate; distinguish sewer transfer from direct surface-water discharge and on-site treatment."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_air_releases
    applies_to: "direct air releases"
    rule: "Require substance-specific measured or calculated releases and factor provenance; do not report an aggregate combustion or refrigerant release row."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_water_releases
    applies_to: "direct water releases"
    rule: "For direct discharge, require temporally matched effluent volume and parameter concentration for each release row."
    source_ids:
      - ec-jrc-2024-sa-bref-jrc135916
  - rule_id: validate_sources
    applies_to: "evidence"
    rule: "Use only the listed UN CPC, EC JRC SA BREF, and Commission Recommendation sources for this PCR; do not treat UUID lookup as amount evidence."
    source_ids:
      - un-cpc-3-0-structure-2025
      - ec-jrc-2024-sa-bref-jrc135916
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_bilingual
    applies_to: "bilingual record"
    rule: "Require identical ordered process_id, direction, flow_type, row_id, UUID, controlled tokens, protocol ids, and source-id sequences in en-US and zh-CN."
    source_ids:
      - eu-2021-2279-environmental-footprint
published_dataset_profile:
  dataset_role: "Facility-specific foreground data package for CPC 21136 frozen goat meat"
  downstream_use: "Construction and validation of TianGong flow, process, lifecyclemodel, and dataset projections"
  allowed_use: "Product-specific modelling when the facility boundary, reference qualifiers, actual technology, and collection period are disclosed"
  excluded_use: "Category-default inventory; fresh or chilled goat meat; edible-offal reference product; retail or meal modelling"
  required_metadata: "Facility geography; reporting period; production volume; lot definition; net-mass method; slaughter and cutting configuration; freezing technology; frozen-storage duration; heat route; refrigerant species; packaging BoM; co-product and waste destinations; wastewater route"
  required_quality_disclosure: "Meter and scale calibration; temporal coverage; missing data; calculation inputs; allocation decisions; mass balance; uncertainty; UUID status"
  update_trigger: "Change in product scope, slaughter or cutting configuration, freezing or storage technology, energy route, refrigerant species, packaging BoM, co-product destination, wastewater route, or evidence source"
