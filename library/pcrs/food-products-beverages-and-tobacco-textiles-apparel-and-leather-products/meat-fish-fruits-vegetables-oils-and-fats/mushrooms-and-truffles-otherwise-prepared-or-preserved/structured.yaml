      record_type: "meter, fuel, refrigerant, and process record"
      raw_fields: "lot_id; meter_id; electricity; heat; cooling; fuel_by_type; refrigerant_makeup; stabilization_cycle_if_any; measured_emissions; factor_source"
      collection_method: "submeters and equipment logs; documented allocation where direct measurement is unavailable"
      unit: "original units plus kWh, MJ, and kg emission"
      frequency: "lot or at least monthly"
      temporal_coverage: "same period as fermentation-route production"
      site_scope: "each fermentation and finishing system"
      aggregation_rule: "keep carriers separate, allocate by causal operating time or vessel use, calculate substance-specific emissions, and normalize to accepted net product"
