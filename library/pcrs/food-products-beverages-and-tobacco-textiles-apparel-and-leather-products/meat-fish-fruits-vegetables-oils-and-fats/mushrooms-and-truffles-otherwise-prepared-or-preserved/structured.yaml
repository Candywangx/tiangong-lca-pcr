  classification_refs: "CPC 3.0: 21397 — Mushrooms and truffles, otherwise prepared or preserved"
  covered_products: "Edible mushrooms and truffles materially prepared or preserved other than by vinegar or acetic acid, including thermally stabilized sealed products, non-acetic fermented products, and other substantively cooked, seasoned, or oil-formulated products"
  excluded_products: "Fresh product; simply frozen product; dried product; vinegar- or acetic-acid-preserved product; provisional preserves not ready for immediate consumption; extracts and concentrates; homogenized vegetable preparations; complete dishes or meals"
  representative_product: "Declared species of prepared or preserved mushrooms or truffles, in the marketed style and formulation, at the processing facility gate"
  production_route: "Exactly one of thermal_container, fermented_non_acetic, or other_prepared; route precedence and preservation mechanism shall be disclosed"
  market_state: "Finished saleable product at factory gate; storage regime, net-content basis, packing medium or formulation, container format, and declared shelf life shall be specified"
functional_unit:
  what: "Provide an edible, saleable mushroom or truffle product that has been prepared or preserved by the declared in-scope route"
  how_much: "1 kg net product, including edible packing medium or formulation sold as part of the product and excluding primary packaging"
  how_well: "Meets the declared species, style, formulation, preservation route, storage regime, food-safety release criteria, and applicable quality specification"
  how_long_or_cycle: "Maintains the declared product specification from factory release through the producer-declared shelf-life period under the declared storage conditions"
  reference_flow_link: "One kilogram of the exact generic CPC-classified reference product flow, normalized at the processing facility gate"
system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate
      applies_to: "Foreground production"
      rule: "Include receiving, sorting, cleaning, trimming, route-specific preparation or preservation, filling or formulation, container handling, stabilization, cooling where applicable, and treatment or transfer of foreground wastes through the processing facility gate. Represent cultivation, ingredients, utilities, packaging production, and inbound transport as upstream inputs."
      source_ids:
        - eu-pef-2021
        - codex-cxs-38-1981
        - codex-cxs-297-2009
    - rule_id: boundary_route_exclusivity
      applies_to: "Route selection"
      rule: "Select exactly one route process. Never model the three route processes as consecutive or simultaneous steps for one reference flow. A batch using lactic fermentation remains fermented_non_acetic even when it receives declared post-fermentation stabilization; hermetically sealed heat-stable non-fermented product is thermal_container."
      source_ids:
        - codex-cxs-38-1981
        - codex-cxs-297-2009
    - rule_id: boundary_classification_exclusions
      applies_to: "Product eligibility"
      rule: "Exclude vinegar- or acetic-acid-preserved mushrooms, simple frozen or dried products, provisional preserves, extracts or concentrates, homogenized vegetable preparations, and complete dishes or meals."
      source_ids:
        - unsd-cpc-3-0
        - codex-cxs-38-1981
    - rule_id: boundary_capital_goods
      applies_to: "Equipment and infrastructure"
      rule: "Exclude capital goods from the foreground inventory unless required by the goal and scope or shown material in screening; disclose the decision consistently for all compared scenarios."
      source_ids:
        - eu-pef-2021
