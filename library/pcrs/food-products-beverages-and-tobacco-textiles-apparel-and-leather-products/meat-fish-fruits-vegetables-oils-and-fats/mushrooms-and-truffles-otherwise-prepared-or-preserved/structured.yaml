    - protocol_id: cp_other_batch
      process_id: "other_prepared"
      flow_role: "route material inputs, packaging, product, and wastes"
      record_type: "batch and packaging record"
      raw_fields: "batch_id; route_code; preparation_description; intermediate_mass; ingredient_mass_by_material; packaging_mass_by_material; net_product_mass; rejects; wastewater; destinations"
      collection_method: "approved recipe, issue records, calibrated scales, packaging records, and waste logs"
      unit: "kg and unit count"
      frequency: "every batch"
      temporal_coverage: "representative continuous 12-month period or all production in a shorter declared campaign"
      site_scope: "each cooking or formulation line and product style"
      aggregation_rule: "retain ingredient identity, aggregate only comparable recipes and storage regimes, reconcile mass, and normalize to accepted net product"
      quality_evidence: "calibrated scales; approved recipe; release record; container specification; waste log"
    - protocol_id: cp_other_energy
      process_id: "other_prepared"
      flow_role: "route energy and direct emissions"
      record_type: "meter, fuel, refrigerant, and process record"
      raw_fields: "batch_id; meter_id; electricity; heat; cooling; cold_holding_time; fuel_by_type; refrigerant_makeup; measured_emissions; factor_source"
      collection_method: "submeters and equipment logs; documented allocation where direct measurement is unavailable"
      unit: "original units plus kWh, MJ, and kg emission"
      frequency: "batch or at least monthly"
      temporal_coverage: "same period as other-prepared-route production"
      site_scope: "each cooking, formulation, cooling, and storage system"
      aggregation_rule: "keep carriers separate, allocate by causal cycle or operating time, calculate substance-specific emissions, and normalize to accepted net product"
      quality_evidence: "meter calibration; equipment log; fuel invoice; refrigerant log; factor citation; calculation worksheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Selected route"
      rule: "normalized amount = period or batch amount / accepted net product mass in kg; packaging mass is excluded from the denominator and edible packing medium is included"
      inputs:
        - "flow amount"
        - "accepted units"
        - "measured net content"
        - "edible-medium status"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021
        - codex-cxs-297-2009
    - id: calc_preprocessing_transfer
      applies_to: "Common preprocessing"
      rule: "route-attributed preprocessing amount = total preprocessing amount × measured intermediate mass transferred to selected route / total prepared intermediate mass; use a more causal measured driver when documented"
      inputs:
        - "common preprocessing records"
        - "route transfer masses"
      output: "preprocessing inventory assigned to selected route"
      source_ids:
        - eu-pef-2021
    - id: calc_route_mass_balance
      applies_to: "Each selected route"
      rule: "mass balance difference = total measured mass inputs − saleable net product − separately measured co-products − separately measured wastes; investigate rather than silently allocate an unexplained material difference"
      inputs:
        - "batch material"
        - product
        - co-product
        - "and waste masses on consistent wet-mass basis"
      output: "disclosed reconciliation difference and completeness flag"
      source_ids:
        - eu-pef-2021
    - id: calc_direct_emissions
      applies_to: "Onsite fuel and refrigerant use"
      rule: "emission by substance = collected activity × documented applicable factor, with oxidation, density, and unit conversions retained; use direct measurements where available"
      inputs:
        - "fuel by carrier"
        - "refrigerant makeup"
        - "measured emission"
        - "factor and conversion records"
      output: "kg substance-specific elementary flow per kg reference product"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and route"
      requirement: "Verify the exact generic reference-flow UUID, species or declared mixture, product style, incoming state, route code, preservation mechanism, container, storage regime, and shelf life."
      evidence: "Product specification, approved recipe, label, batch release, and route decision record"
    - id: dq_route_exclusivity
      applies_to: "Process map"
      requirement: "Demonstrate that exactly one route process supplies the reference product and that alternative-route inventories are absent."
      evidence: "Batch route code, process flow diagram, and inventory completeness review"
    - id: dq_measurement
      applies_to: "Mass, water, and energy"
      requirement: "Use calibrated instruments or reconciled supplier records; retain raw units, conversions, allocation drivers, and meter coverage."
      evidence: "Calibration certificates, invoices, meter maps, batch records, and calculation worksheets"
    - id: dq_temporal
      applies_to: "Foreground dataset"
      requirement: "Prefer a representative continuous 12-month period; a shorter seasonal or campaign period shall cover the full campaign and disclose why it represents the product."
      evidence: "Dated production calendar and coverage calculation"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Reconcile material balance, include utilities and direct emissions, and identify every excluded flow, missing month, proxy, and waste destination."
      evidence: "Mass balance, utility reconciliation, emission-factor register, and gap log"
    - id: dq_provisional_estimates
      applies_to: "Missing foreground quantity"
      requirement: "No default numeric estimate is supplied by this PCR. If a quantity is temporarily gap-filled, tag it as reasoned_estimate, state the applicable route, technology, geography, and basis, state that it is provisional, and replace it when representative batch records, calibrated measurements, supplier primary data, or reviewed evidence become available. Such estimates shall not support verified comparative assertions."
      evidence: "Assumption register, applicability statement, uncertainty disclosure, owner, and explicit replacement trigger"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require the product-flow UUID a73856a4-8862-40be-b505-65863a6cfb66, Mass property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and reference unit kg."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "Product eligibility"
    rule: "Reject fresh, simply frozen, dried, vinegar- or acetic-acid-preserved, provisionally preserved, extract or concentrate, homogenized, or complete-meal products."
    source_ids:
      - unsd-cpc-3-0
      - codex-cxs-38-1981
  - rule_id: validate_route
    applies_to: "Route processes"
    rule: "Require exactly one of thermal_container, fermented_non_acetic, or other_prepared to produce the reference flow. Reject a dataset that sums alternative routes or lacks the route precedence decision."
    source_ids:
      - codex-cxs-38-1981
      - codex-cxs-297-2009
  - rule_id: validate_reference_mass
    applies_to: "Quantitative reference"
    rule: "Require 1 kg accepted net product excluding packaging and including edible medium or formulation sold as product; require the edible-medium share and net-content basis."
    source_ids:
      - codex-cxs-297-2009
  - rule_id: validate_inventory
    applies_to: "Foreground completeness"
    rule: "Require incoming fungi or truffles, ingredients and media, packaging, water where used, carrier-specific energy, saleable output, residues, wastewater where generated, rejects, and applicable direct emissions; require consistent period and mass basis."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_mass_balance
    applies_to: "Material inventory"
    rule: "Require a documented route mass balance and investigation of unexplained difference; do not accept silent balancing through an unspecified waste flow."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_data_quality
    applies_to: "Dataset production"
    rule: "Require temporal coverage, site and technology representation, calibration or reconciliation evidence, upstream dataset metadata, proxy disclosure, and replacement triggers for every reasoned_estimate."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Factory-gate foreground data package for one declared prepared or preserved mushroom or truffle product and one mutually exclusive route"
  downstream_use: "secondary_dataset; background_dataset after review of representativeness, projection readiness, and data quality"
  allowed_use: "Product carbon or environmental footprint modelling, supply-chain inventory, process improvement, and scenario analysis for products matching the declared species, formulation, route, geography, technology, storage regime, and reference-mass basis"
  excluded_use: "Fresh, simply frozen, dried, vinegar- or acetic-acid-preserved, provisional, extract or concentrate, homogenized, or complete-meal products; aggregation of mutually exclusive routes; verified comparative assertions based on unreviewed proxies or reasoned_estimate values"
  required_metadata: "PCR id and version state; exact flow UUIDs; species and origin type; product style; route code and precedence decision; preservation mechanism; recipe and edible-medium share; net-content basis; container; storage regime; shelf life; facility geography; technology; data period; upstream dataset identities; allocation method"
  required_quality_disclosure: "Meter and batch coverage; calibration and reconciliation; material-balance difference; excluded flows; missing data; proxies and provisional estimates; factor sources; uncertainty; representativeness limits; co-products and waste destinations"
  update_trigger: "New or changed product-flow identity; classification scope; preservation route; recipe or edible-medium share; container; storage regime; technology; supplier or geography; material allocation basis; evidence affecting rules; or replacement of provisional estimates by representative batch, supplier, or reviewed evidence"
