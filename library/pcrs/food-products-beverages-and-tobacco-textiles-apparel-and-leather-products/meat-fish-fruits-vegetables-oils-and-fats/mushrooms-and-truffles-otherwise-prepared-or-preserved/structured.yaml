allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared and multifunctional foreground operations"
    rule: "First avoid allocation through batch, line, time, meter, or recipe subdivision. Keep route-specific operations separate and assign common preprocessing to the selected route using measured batch transfers."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_co_products
    applies_to: "Saleable co-products other than the reference product"
    rule: "Where subdivision is not possible, apply a documented physical relationship that reflects the causal use of the process. If no defensible physical relationship exists, use economic allocation with contemporaneous factory-gate prices and test sensitivity."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_wastes
    applies_to: "Residues and waste treatment"
    rule: "Do not assign avoided burdens to residues merely because they leave the site. Record their treatment or recovery route and apply any substitution or recycling model only in the downstream study with the method, quality, and displaced product disclosed."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_packing_medium
    applies_to: "Edible packing medium and recipe ingredients"
    rule: "Treat edible medium sold with the product as part of the reference product mass, not as a co-product. Packaging remains a separate input and is excluded from reference mass."
    source_ids:
      - codex-cxs-297-2009
dataset_production:
  collection_protocols:
    - protocol_id: cp_preprocessing_batch
      process_id: "preprocessing"
      flow_role: "incoming material, prepared intermediate, and residues"
      record_type: "batch production record"
      raw_fields: "batch_id; species; origin_type; supplier; incoming_state; input_mass; intermediate_mass; residue_mass; moisture_or_solids_if_measured; disposition"
      collection_method: "calibrated scales, receiving tickets, production and waste logs"
      unit: "kg wet mass"
      frequency: "every batch"
      temporal_coverage: "representative continuous 12-month period or all production in a shorter declared campaign"
      site_scope: "each included facility and line"
      aggregation_rule: "sum like flows by batch, reconcile mass balance, then divide by prepared intermediate output"
      quality_evidence: "scale calibration; signed batch record; supplier specification; reconciliation record"
    - protocol_id: cp_preprocessing_utilities
      process_id: "preprocessing"
      flow_role: "water, energy, and wastewater"
      record_type: "meter and allocation record"
      raw_fields: "meter_id; period; water_in; water_recirculated; wastewater_out; electricity; steam; fuel; production_hours; batch_id; allocation_driver"
      collection_method: "submeters preferred; otherwise documented engineering or production allocation"
      unit: "original units plus kg water, m3 wastewater, kWh electricity, and MJ thermal energy"
      frequency: "batch or at least monthly"
      temporal_coverage: "same period as production data"
      site_scope: "each included facility and utility system"
      aggregation_rule: "subtract documented recirculation only once, allocate shared totals by causal driver, and normalize to prepared intermediate output"
      quality_evidence: "meter calibration; invoices; allocation worksheet; completeness check"
    - protocol_id: cp_thermal_batch
      process_id: "thermal_container"
      flow_role: "route material inputs, packaging, product, and rejects"
      record_type: "batch and packaging record"
      raw_fields: "batch_id; route_code; intermediate_mass; ingredient_mass_by_material; packaging_mass_by_material; filled_units; net_content; accepted_units; rejected_product; rejected_packaging; treatment_destination"
      collection_method: "formulation sheets, issue records, checkweigher or net-content records, packaging bills, and reject logs"
      unit: "kg and unit count"
      frequency: "every batch"
      temporal_coverage: "representative continuous 12-month period or all production in a shorter declared campaign"
      site_scope: "each thermal line and container format"
      aggregation_rule: "retain material identity, calculate accepted net product mass, reconcile route mass, and normalize to accepted net product"
      quality_evidence: "calibrated scales; approved recipe; net-content verification; container specification; reject log"
    - protocol_id: cp_thermal_energy
      process_id: "thermal_container"
      flow_role: "route energy and direct emissions"
      record_type: "meter, fuel, refrigerant, and process record"
      raw_fields: "batch_id; meter_id; electricity; steam; fuel_by_type; retort_or_heat_cycle; cooling; refrigerant_makeup; measured_emissions; factor_source"
      collection_method: "submeters and cycle logs; invoices and documented allocation only where submetering is unavailable"
      unit: "original units plus kWh, MJ, and kg emission"
      frequency: "batch or at least monthly"
      temporal_coverage: "same period as thermal-route production"
      site_scope: "each thermal line and utility system"
      aggregation_rule: "keep carriers separate, allocate by causal cycle or operating time, calculate substance-specific emissions, and normalize to accepted net product"
      quality_evidence: "meter calibration; cycle record; fuel invoice; refrigerant log; factor citation; calculation worksheet"
    - protocol_id: cp_fermentation_batch
      process_id: "fermented_non_acetic"
      flow_role: "route material inputs, packaging, product, and wastes"
      record_type: "fermentation lot record"
      raw_fields: "lot_id; route_code; species; intermediate_mass; water; salt; starter; ingredient_mass_by_material; fermentation_time; control_measurements; packaging_mass; net_product_mass; spent_liquid; rejects; destinations"
      collection_method: "approved formulation, issue records, tank records, control logs, scales, and packaging records"
      unit: "kg, hours, and declared control units"
      frequency: "every lot"
      temporal_coverage: "representative continuous 12-month period or all production in a shorter declared campaign"
      site_scope: "each fermentation vessel, finishing line, and product formulation"
      aggregation_rule: "retain ingredient identity, aggregate only comparable lots, reconcile mass, and normalize to accepted net product"
      quality_evidence: "calibrated instruments; approved formulation; fermentation control log; release record; waste transfer record"
    - protocol_id: cp_fermentation_energy
