allocation_rules:
  - rule_id: allocation_subdivide_routes
    applies_to: "frozen, dried, dry-salted, and brined production"
    rule: "Subdivide route-specific processes, utilities, yields, and wastes before allocation. Report each route result separately and do not use an unconditional multi-route average."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_operations
    applies_to: "shared preparation, packaging, and site utilities"
    rule: "Use direct measurement first; otherwise use a documented physical causal driver such as processed mass, metered operating time, or capacity-time. If no physical relationship can be justified, use a documented economic allocation with contemporaneous prices and a sensitivity result."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residues_and_coproducts
    applies_to: "shell, viscera, rejects, recovered product, and other outputs"
    rule: "Classify each output as product, co-product, or waste using its actual destination. Avoid allocation by process subdivision; when unavoidable, apply the same physical-then-economic hierarchy and disclose any credits or substituted products separately."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receipt_mass_balance
      process_id: "receipt_and_preparation"
      flow_role: "received mass, prepared transfer, residues"
      record_type: "weighbridge or calibrated scale records"
      raw_fields: "lot_id; species; received_state; presentation; received_mass; prepared_mass; residue_mass_by_destination; cooking_status"
      collection_method: "reconcile receiving, transfer, and waste records by lot"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "representative production period with all included lots"
      site_scope: "each facility and line"
      aggregation_rule: "sum by lot and route, then divide by conforming net output"
      quality_evidence: "calibration records; lot reconciliation; destination records"
    - protocol_id: cp_receipt_utilities
      process_id: "receipt_and_preparation"
      flow_role: "water, ice, electricity, wastewater"
      record_type: "meters, invoices, production logs, water balance"
      raw_fields: "meter_start; meter_end; purchased_ice_mass; recycled_water; discharge_mass; operating_time; lot_output"
      collection_method: "direct submetering preferred; documented allocation where shared"
      unit: "kg; kWh"
      frequency: "each lot or meter interval"
      temporal_coverage: "same period as production lots"
      site_scope: "each facility and relevant utility system"
      aggregation_rule: "subtract recycled loops and allocate shared utilities by measured driver"
      quality_evidence: "meter calibration; invoices; allocation worksheet; water balance"
    - protocol_id: cp_preservation_mass_and_route
      process_id: "route_specific_preservation"
      flow_role: "route identity, input/output mass, salt, water, spent brine"
      record_type: "batch sheets, scales, formulation and discharge records"
      raw_fields: "route_code; batch_id; input_mass; output_mass; salt_issued; unused_salt; route_water; retained_salt; spent_brine; wastewater; time; temperature; moisture_or_drainage_basis"
      collection_method: "collect separately for exactly one declared route per batch"
      unit: "kg; h; °C"
      frequency: "each batch"
      temporal_coverage: "all included preservation batches"
      site_scope: "each facility, line, and route"
      aggregation_rule: "aggregate only within the same route and declared product state"
      quality_evidence: "calibrated scales; formulation records; route control logs; mass balance"
    - protocol_id: cp_preservation_utilities
      process_id: "route_specific_preservation"
      flow_role: "electricity and thermal energy"
      record_type: "submeters, fuel records, steam or heat meters"
      raw_fields: "route_code; meter_start; meter_end; fuel_quantity; fuel_energy; steam_or_heat; operating_time; output_mass"
      collection_method: "direct route metering preferred; documented equipment-time allocation otherwise"
      unit: "kWh; MJ"
      frequency: "each batch or meter interval"
      temporal_coverage: "same period as preservation batches"
      site_scope: "each facility, equipment set, and route"
      aggregation_rule: "convert with documented factors and divide by route-specific net output"
      quality_evidence: "meter calibration; invoices; conversion factors; allocation worksheet"
    - protocol_id: cp_packaging_records
      process_id: "packaging"
      flow_role: "product mass, packaging, electricity, scrap"
      record_type: "line scales, material issues, meters, scrap records"
      raw_fields: "batch_id; input_mass; net_output_mass; material_type; issued_mass; returned_mass; scrap_mass; electricity; package_count"
      collection_method: "reconcile packaging-line mass and material issues by batch"
      unit: "kg; kWh; item"
      frequency: "each packaging batch"
      temporal_coverage: "all included packaging batches"
      site_scope: "each facility and packaging line"
      aggregation_rule: "aggregate by packaging format and divide by conforming net output"
      quality_evidence: "scale and meter calibration; bill of materials; stock reconciliation"
    - protocol_id: cp_frozen_storage_records
      process_id: "frozen_storage"
      flow_role: "stored mass, duration, temperature, electricity, refrigerant"
      record_type: "warehouse movements, temperature loggers, meters, refrigerant service records"
      raw_fields: "lot_id; entry_mass; dispatch_mass; entry_time; dispatch_time; temperature_series; electricity; refrigerant_substance; opening_inventory; additions; closing_inventory; recovery"
      collection_method: "collect only for frozen-route lots through producer-gate dispatch"
      unit: "kg; day; °C; kWh"
      frequency: "continuous temperature; each movement; monthly utility and refrigerant reconciliation"
      temporal_coverage: "full included storage period"
      site_scope: "each cold store and refrigeration system"
      aggregation_rule: "allocate electricity by documented capacity-time or measured load; calculate substance-specific loss by inventory balance"
      quality_evidence: "calibrated logger and meter records; service invoices; inventory reconciliation"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "packaged preserved output"
      rule: "net target product mass = gross filled unit mass - primary packaging mass - free glaze mass - free packing brine after the declared drainage procedure"
      inputs:
        - "gross mass"
        - "packaging mass"
        - "glaze mass"
        - "drained free-brine mass"
        - "shell-in-presentation declaration"
      output: "kg net target product"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_process_mass_balance
      applies_to: "preparation, preservation, and packaging"
      rule: "reconcile measured inputs with product outputs, separately measured residues, wastewater or spent brine, retained water or salt, and documented stock change; investigate unexplained imbalance"
      inputs:
        - "protocol mass records by process and lot"
      output: "route-specific yield and reconciliation result"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_normalized_utilities
      applies_to: "all utilities"
      rule: "normalized utility = route-attributed utility quantity / conforming net reference-product output"
      inputs:
        - "meter or invoice quantity"
        - "allocation driver"
        - "net output"
      output: "kWh or MJ per kg net reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "frozen storage"
      rule: "refrigerant loss by substance = opening inventory + additions - closing inventory - documented recovery; allocate only to included equipment and storage period"
      inputs:
        - "substance-specific inventory and service records"
        - "stored output"
      output: "kg refrigerant emitted per kg net frozen product"
      source_ids:
        - fao-fisheries-technical-paper-340
  data_quality_requirements:
    - id: dq_identity_and_route
      applies_to: "every dataset"
      requirement: "Declare species or commercial group, presentation, shell/cooking status, exactly one preservation route, net-mass method, packaging, and gate condition."
      evidence: "product specification; batch record; label; route code"
    - id: dq_temporal_and_site_coverage
      applies_to: "foreground records"
      requirement: "Use a representative period covering all included lots, routes, shifts, and seasonal conditions; disclose exclusions, shutdowns, and shared-service allocation."
      evidence: "production calendar; lot list; meter coverage; exclusion log"
    - id: dq_measurement_and_reconciliation
      applies_to: "mass, water, energy, salt, packaging, waste, and refrigerant"
      requirement: "Retain calibration or invoice evidence, reconcile process balances, and investigate missing records, outliers, and unexplained losses before aggregation."
      evidence: "calibration certificates; invoices; balance worksheets; corrective-action records"
    - id: dq_upstream_and_proxy_quality
      applies_to: "upstream datasets"
      requirement: "Assess technological, geographical, temporal, and precision/completeness suitability; disclose proxy choices and material mismatches."
      evidence: "dataset metadata and documented data-quality rating consistent with eu-pef-2021-2279"
    - id: dq_reasoned_estimates
      applies_to: "all provisional ranges"
      requirement: "Do not use these QA ranges as measured foreground values. Replace each with collected or accepted source-backed evidence, or document reviewer acceptance and uncertainty before activation."
      evidence: "review record; replacement source or approved uncertainty note"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference flow and packaged output"
    rule: "Verify one reference flow equals exactly 1 kg net target product using the declared drainage, glaze, packaging, and shell basis and the specified Mass property and unit group UUIDs."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_single_route
    applies_to: "process map and inventory"
    rule: "Verify exactly one of frozen, dried, dry_salted, or brined is declared for each result; frozen storage shall appear only for frozen, while salt and brine inputs shall appear only when used by the declared route."
    source_ids:
      - codex-cxc-52-2003
      - unsd-cpc-3-0-2025
  - rule_id: validate_mass_and_utility_completeness
    applies_to: "foreground inventory"
    rule: "Verify process mass reconciliation and coverage of material water or ice, electricity, thermal energy, salt, packaging, residues, wastewater or spent brine, and refrigerant flows applicable to the route; require a documented zero or exclusion for any applicable missing flow."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_food_safety_traceability
    applies_to: "lot and route records"
    rule: "Verify traceable lots and applicable time-temperature, hygiene, drying, salting/brining, and release-control records are retained; failure is a data-quality finding and this PCR does not certify legal compliance."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_provisional_ranges
    applies_to: "reasoned-estimate QA guardrails"
    rule: "Flag values outside a provisional range for investigation, but never replace foreground records with the range; all provisional ranges remain review items before activation."
    source_ids: []
  - rule_id: validate_uuid_completeness
    applies_to: "non-reference inventory flows"
    rule: "Before activation, resolve and review Tiangong UUIDs for material non-reference flows or document an approved semantic fallback; the reference flow UUID is mandatory."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for one declared preserved-lobster or crawfish route"
  downstream_use: "secondary_dataset; background_dataset after review of representativeness and completeness"
  allowed_use: "Product and process LCA models matching the declared species group, presentation, preservation route, technology, geography, period, packaging, storage duration, and producer-gate boundary"
  excluded_use: "Unqualified substitution among frozen, dried, dry-salted, and brined routes; live/fresh/chilled or canned products; legal or food-safety certification; use of provisional ranges as measured inventory"
  required_metadata: "PCR id; species or commercial group; presentation; shell/cooking status; route code; net-mass and drainage basis; location; technology; reference period; packaging; frozen storage duration and temperature; upstream datasets; allocation; cut-offs; data-quality assessment"
  required_quality_disclosure: "Foreground coverage; meter and scale basis; process reconciliation; missing data; reasoned estimates; allocation drivers; route aggregation; upstream proxies; unresolved UUIDs; uncertainty and review status"
  update_trigger: "Change in species mix, presentation, preservation route or technology, yield, energy system, salt or brine practice, packaging, cold-store system or duration, refrigerant, site, regulation, upstream dataset, or source evidence"
