      collection_method: "sub-meter reading or reconciled purchase and stock records"
      unit: "kWh; MJ; kg fuel"
      frequency: "continuous or each shift; reconcile monthly"
      temporal_coverage: "all months overlapping the campaign"
      site_scope: "all utility meters and supply points serving the campaign"
      aggregation_rule: "subtract exports and unrelated loads; convert with documented factors; allocate shared loads only through an auditable driver"
      quality_evidence: "meter calibration; invoice; fuel certificate; reconciliation"
    - protocol_id: cp_hexane_balance
      process_id: "crude_oil_extraction_and_clarification"
      flow_role: "hexane make-up, recovery, and losses"
      record_type: "purchase, tank, recovery, product, waste-water, waste, and emission records"
      raw_fields: "solvent composition; purchases; opening/closing stock; transfers; recovered volume; density/temperature; oil/meal/water/waste solvent; channelled/fugitive emissions"
      collection_method: "mass balance supported by calibrated tanks/meters and analytical measurements"
      unit: "kg"
      frequency: "daily operating record; campaign and annual reconciliation"
      temporal_coverage: "complete declared campaign and annual reconciliation period"
      site_scope: "every solvent-extraction line in scope"
      aggregation_rule: "convert volumes at measured temperature/density; total input minus recovered closing inventory and quantified outputs equals unresolved loss; report air fraction separately"
      quality_evidence: "tank calibration; purchase records; laboratory results; leak/vent monitoring; closure statement"
    - protocol_id: cp_water_wastewater
      process_id: "crude_oil_extraction_and_clarification"
      flow_role: "process water and waste water"
      record_type: "water-meter and discharge record"
      raw_fields: "intake; recycle; segregated cooling water; discharge volume; destination; COD/TOC; TSS; oil and grease; pH; temperature"
      collection_method: "calibrated meters and representative sampling at relevant discharge points"
      unit: "m3; mg/L; pH"
      frequency: "continuous volume; sampling per permit or monitoring plan"
      temporal_coverage: "complete declared campaign"
      site_scope: "all relevant water intake and discharge points"
      aggregation_rule: "prevent double counting recycled water; report direct, indirect, and separately discharged uncontaminated water by route"
