      frequency: "each tank batch and dispatch"
      temporal_coverage: "complete declared campaign"
      site_scope: "all in-scope crude-oil tanks and dispatch points"
      aggregation_rule: "sum only batches meeting the declared crude-oil identity; normalise all exchanges to net qualifying mass"
      quality_evidence: "calibration; laboratory method and result; batch release; dispatch reconciliation"
    - protocol_id: cp_coproduct_residue_mass
      process_id: "seed_receipt_and_preparation_crude_oil_extraction_and_clarification"
      flow_role: "co-products, hulls, screenings, meal, cake, and residues"
      record_type: "scale, stock, dispatch, and waste-transfer record"
      raw_fields: "material id; product/waste status; mass; moisture; residual oil; destination; price; currency; disposal/treatment"
      collection_method: "calibrated scale plus stock and dispatch reconciliation"
      unit: "kg; %; currency/kg"
      frequency: "each batch or dispatch"
      temporal_coverage: "complete declared campaign"
      site_scope: "all preparation, extraction, storage, and waste-transfer points"
      aggregation_rule: "aggregate by material, moisture basis, status, and destination; do not merge valued products with wastes"
