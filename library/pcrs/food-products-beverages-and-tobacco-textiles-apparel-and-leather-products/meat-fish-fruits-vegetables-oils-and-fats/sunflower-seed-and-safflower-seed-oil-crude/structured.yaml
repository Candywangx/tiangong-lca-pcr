allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "independently measurable preparation, pressing, extraction, clarification, and treatment operations"
    rule: "Avoid allocation by subdivision and direct measurement wherever the operation or utility can be separated; do not allocate a separately metered route through a plant-wide revenue key."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_coproducts
    applies_to: "crude oil, press cake, extracted meal, and valued hulls from an inseparable campaign"
    rule: "After subdivision is exhausted, use a documented physical relationship only when it represents a verified causal relationship between inputs and co-product functions. Otherwise allocate remaining shared burdens by relative economic value at the mill gate using contemporaneous prices, and report a mass-allocation sensitivity result."
    source_ids:
      - eu-pef-2021-2279
      - fao-ebrd-sunflower-oils-2010
  - rule_id: allocation_residue_status
    applies_to: "hulls, screenings, clarification solids, spent filter aid, and waste water"
    rule: "Determine product, co-product, or waste status from intended use, legal status, and economic value. Assign waste handling to the generating process; do not grant an avoided-product credit without an empirically supported substitution scenario."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: allocation_documentation
    applies_to: "every multifunctional or shared operation"
    rule: "Retain unallocated quantities, co-product masses and moisture, prices and currency, price period, allocation factors, excluded flows, and sensitivity results so the allocation is reproducible and sums to one."
    source_ids:
      - eu-pef-2021-2279
