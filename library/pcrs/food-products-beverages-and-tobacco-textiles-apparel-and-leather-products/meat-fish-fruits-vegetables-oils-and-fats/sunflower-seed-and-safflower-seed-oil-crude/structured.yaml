      raw_fields: "pollutant/flow; compartment; concentration; flow rate; operating time; control device; efficiency; fugitive method"
      collection_method: "applicable standard measurement or documented activity-factor calculation"
      unit: "kg; mg/Nm3"
      frequency: "per permit/monitoring plan and after material changes"
      temporal_coverage: "representative normal operation plus abnormal-event disclosure"
      site_scope: "all relevant emission points, fugitive sources, and control devices"
      aggregation_rule: "calculate mass emission from measured concentration, gas flow, and time; add separately estimated fugitives; avoid double counting captured material"
      quality_evidence: "test report; instrument calibration; operating log; control-device record"
  calculation_rules:
    - id: calc_seed_input
      applies_to: "received oilseed"
      rule: "accepted received seed kg assigned to campaign / qualifying crude-oil kg"
      inputs:
        - cp_received_oilseed
        - cp_crude_oil_output_quality
      output: "kg received seed/kg crude oil"
      source_ids:
        - fao-ebrd-sunflower-oils-2010
    - id: calc_preparation_balance
      applies_to: "seed preparation"
      rule: "received seed + opening stock = prepared seed + separated co-products/residues + closing stock + quantified loss"
      inputs:
        - cp_received_oilseed
        - cp_prepared_seed_mass
        - cp_coproduct_residue_mass
      output: "preparation mass-balance closure and unresolved difference"
      source_ids:
        - fao-ebrd-sunflower-oils-2010
    - id: calc_energy_intensity
      applies_to: "electricity and thermal energy"
      rule: "attributable energy / qualifying crude-oil mass; retain electricity and thermal results separately"
      inputs:
        - cp_energy_records
        - cp_crude_oil_output_quality
      output: "kWh/kg oil and MJ/kg oil"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_hexane_loss
      applies_to: "solvent route"
      rule: "(make-up + opening stock + imports - closing stock - exports - recovered stock change) / cleaned seed tonnes; reconcile oil, meal, water, waste, and air fractions"
      inputs:
        - cp_hexane_balance
        - cp_prepared_seed_mass
      output: "kg total hexane loss/t cleaned seed and kg hexane-to-air/t cleaned seed"
      source_ids:
        - eu-fdm-bat-2019-2031
        - us-epa-ap42-9-11-1-1995
    - id: calc_water_intensity
      applies_to: "process water and waste water"
      rule: "external water or waste-water discharge / qualifying crude-oil tonnes, reported separately"
      inputs:
        - cp_water_wastewater
        - cp_crude_oil_output_quality
      output: "m3/t crude oil"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_allocation_factors
      applies_to: "inseparable shared burdens"
      rule: "selected driver value for each co-product / sum of driver values; verify factors sum to 1.000 within rounding tolerance"
      inputs:
        - cp_coproduct_residue_mass
        - "allocation decision record"
      output: "allocation factors and mass-allocation sensitivity factors"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_extraction_mass_balance
      applies_to: "extraction and clarification"
      rule: "prepared seed + material auxiliaries = crude oil + co-products + wastes + measured stock change + quantified emissions + unresolved difference"
      inputs:
        - cp_prepared_seed_mass
        - cp_crude_oil_output_quality
        - cp_coproduct_residue_mass
        - cp_hexane_balance
        - cp_water_wastewater
        - cp_air_emissions
      output: "campaign mass-balance closure and unresolved difference"
      source_ids:
        - fao-ebrd-sunflower-oils-2010
        - eu-fdm-bat-2019-2031
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and oilseed input"
      requirement: "Demonstrate species, oil type, crude/unrefined state, route, solvent use, degumming status, and mill gate for every included batch."
      evidence: "lot certificates; route log; laboratory release; reference-flow UUID check"
    - id: dq_measurement
      applies_to: "mass, energy, solvent, and water records"
      requirement: "Use calibrated instruments or reconciled purchase/stock records; retain units, conversions, missing-data treatment, and instrument coverage."
      evidence: "calibration certificates; invoices; stock reconciliation; calculation workbook"
    - id: dq_temporal
      applies_to: "declared reporting period"
      requirement: "Use a continuous campaign or at least 12 representative months for an annual dataset; disclose shutdowns, abnormal releases, and seasonality."
      evidence: "production calendar; operating log; exception record"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Cover all material seed, crude-oil, co-product, utility, solvent, water, residue, waste-water, and direct-emission flows; quantify or justify exclusions."
      evidence: "signed completeness checklist; mass/energy/solvent reconciliation"
    - id: dq_representativeness
      applies_to: "geography and technology"
      requirement: "Match seed source, mill geography, extraction route, solvent-recovery technology, and production scale, or document and assess extrapolation."
      evidence: "site description; supplier geography; technology record; extrapolation note"
    - id: dq_source_scope
      applies_to: "external QA ranges"
      requirement: "Apply the FAO sunflower ranges only to matching sunflower routes and the EU BAT-AEL only to matching regulated solvent-route scope; do not silently transfer them to safflower or mechanical-only cases."
      evidence: "applicability assessment linked to source ids"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Fail if the reference UUID, Mass property, Units of mass group, 1 kg amount, species qualifier, crude/unrefined state, or mill gate is missing or inconsistent."
    source_ids:
      - codex-cxs-210-1999-2026
  - rule_id: validate_route_completeness
    applies_to: "process map and inventory"
    rule: "Fail if the declared mechanical, solvent, or combined route omits a required route operation; a solvent route must include solvent recovery/desolventising and solvent balance, while refining operations must not be included in the crude-oil foreground result."
    source_ids:
      - fao-ebrd-sunflower-oils-2010
      - us-epa-ap42-9-11-1-1995
  - rule_id: validate_species_separation
    applies_to: "combined datasets"
    rule: "Fail if sunflower and safflower batches are aggregated without production weights, species-specific input/output records, and disclosure of the aggregation method."
    source_ids:
      - codex-cxs-210-1999-2026
  - rule_id: validate_mass_balance
    applies_to: "each process and campaign"
    rule: "Flag an unexplained preparation or extraction mass-balance difference above 2% of the largest material throughput; require correction or documented investigation rather than forced closure."
    source_ids:
      - fao-ebrd-sunflower-oils-2010
      - eu-fdm-bat-2019-2031
  - rule_id: validate_hexane_balance
    applies_to: "solvent route"
    rule: "Fail if make-up, stock change, recovered solvent, quantified product/water/waste fractions, and air emissions are not reconciled; flag a matching-scope sunflower yearly loss outside 0.2-0.7 kg/t cleaned seed for investigation, not automatic replacement."
    source_ids:
      - eu-fdm-bat-2019-2031
      - us-epa-ap42-9-11-1-1995
  - rule_id: validate_allocation
    applies_to: "co-products and shared services"
    rule: "Fail if allocation is used before documented subdivision review, factors do not sum to one, waste and co-product status is inconsistent, or price/physical-driver evidence and sensitivity results are absent."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_quality_and_coverage
    applies_to: "published foreground package"
    rule: "Fail if required qualifiers, protocol coverage, calibration evidence, temporal coverage, direct emissions, quality tests, or excluded-flow justifications are missing."
    source_ids:
      - codex-cxs-210-1999-2026
      - eu-fdm-bat-2019-2031
published_dataset_profile:
  dataset_role: "unit_process foreground data package for crude-oil production"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA models requiring crude sunflower-seed or safflower-seed oil at a matching mill gate, species/oil type, geography, period, extraction route, solvent practice, degumming status, and allocation method"
  excluded_use: "refined or packaged edible oil; other oilseed oils; undisclosed sunflower/safflower averages; routes or geographies with materially different extraction and recovery technology; direct food-compliance claims without applicable testing"
  required_metadata: "PCR id and version; reference-flow UUID; oilseed species and variety/oil type; geography; period; mill gate; route; solvent and recovery; degumming status; crude quality basis; upstream seed dataset; allocation method; protocol coverage; data-quality assessment"
  required_quality_disclosure: "measured versus calculated coverage; missing-data substitutions; provisional-range use; instrument calibration; mass, energy, water, and solvent reconciliation; co-product status and allocation sensitivity; abnormal operations; excluded flows"
  update_trigger: "material change in oilseed species/oil type, seed source, extraction or solvent-recovery route, degumming/clarification, geography, energy or water system, co-product market, allocation method, legal status, reference UUID, or evidence base"
