      raw_fields: "lot id; species; variety/oil type; origin; gross mass; tare; net mass; moisture; damaged/foreign matter; receipt time"
      collection_method: "calibrated weighbridge plus representative lot sampling"
      unit: "kg; %"
      frequency: "each received lot"
      temporal_coverage: "complete declared campaign"
      site_scope: "all receiving points serving the campaign"
      aggregation_rule: "sum accepted lot net mass; retain rejected lots separately; report production-weighted moisture"
      quality_evidence: "scale calibration; sampling procedure; lot certificates; reconciliation to inventory"
    - protocol_id: cp_prepared_seed_mass
      process_id: "seed_receipt_and_preparation"
      flow_role: "prepared oilseed and separated preparation material"
      record_type: "transfer scale and preparation log"
      raw_fields: "campaign id; preparation route; input mass; output mass; hulls; screenings; moisture; stock change"
      collection_method: "calibrated belt scale, hopper scale, or batch mass reconciliation"
      unit: "kg; %"
      frequency: "each batch or continuous shift total"
      temporal_coverage: "complete declared campaign"
      site_scope: "all preparation lines serving the campaign"
      aggregation_rule: "input plus opening stock minus outputs and closing stock; normalise after moisture-basis disclosure"
      quality_evidence: "calibration; batch log; mass-balance closure"
    - protocol_id: cp_energy_records
      process_id: "crude_oil_extraction_and_clarification"
      flow_role: "electricity, fuel, heat, and steam"
      record_type: "meter, invoice, and fuel-stock record"
