allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared_foreground_operations"
    rule: "Avoid allocation by submetering or subdividing species, formulation, package format, pasteurization route, storage zone, sanitation campaign, and waste handling whenever separately operated or measured."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_shared_utilities
    applies_to: "shared_utilities"
    rule: "When subdivision is not possible, allocate electricity, water, sanitation, and cold-storage services using a documented causal physical driver such as equipment time, cleaned area, occupied volume-time, or product mass; justify the chosen driver."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_upstream_roe_supply
    applies_to: "supplier_roe_dataset"
    rule: "The upstream roe dataset shall disclose treatment of fish meat, heads, viscera, skin, frames or cartilage, swim bladders, and other recovered fractions. Prefer subdivision; if inseparable co-products have material market value, disclose the economic-allocation prices, reference period, geography, and sensitivity."
    source_ids:
      - dudu-georgescu-2024-sturgeon
      - eu-pef-2021-2279
  - rule_id: allocation_recycling_no_automatic_credit
    applies_to: "wastes_and_recovered_materials"
    rule: "Record each waste or recovered material at the foreground boundary. Do not award avoided-product or recycling credits unless the downstream substitution, quality, market, and allocation convention are explicitly modelled and disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_mass_balance
    applies_to: "all_processes"
    rule: "Preserve unallocated physical mass balances before applying any allocation and report allocation factors so that the foreground inventory can be reconstructed."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "all_production_processes"
      flow_role: "Each named roe or intermediate product"
      record_type: "Scale and lot record"
      raw_fields: "date; lot_id; species; material_state; gross_mass; tare_mass; net_mass; destination_process"
      collection_method: "Calibrated scale reconciled to lot movement"
      unit: "kg"
      frequency: "Every lot and transfer"
      temporal_coverage: "Full reporting period"
      site_scope: "All included lines"
      aggregation_rule: "Sum net mass by species, route, and process; normalize only after yield reconciliation"
      quality_evidence: "Calibration certificate; supplier lot record; transfer record"
    - protocol_id: cp_ingredient_mass
      process_id: "egg_separation_washing_formulation_grading"
      flow_role: "Each named salt or additive"
      record_type: "Batch formulation record"
      raw_fields: "batch_id; ingredient_name; supplier_lot; gross_mass; tare_mass; net_mass; active_fraction; legal_authorization"
      collection_method: "Calibrated scale and formulation sign-off"
      unit: "kg"
      frequency: "Every batch"
      temporal_coverage: "Full reporting period"
      site_scope: "All formulations"
      aggregation_rule: "Sum active or as-used mass separately for each named ingredient"
      quality_evidence: "Scale calibration; recipe approval; certificate of analysis"
    - protocol_id: cp_output_mass
      process_id: "all_production_processes"
      flow_role: "Each named conforming product output"
      record_type: "Release and transfer record"
      raw_fields: "lot_id; product_name; species; package_route; gross_mass; tare_mass; net_mass; release_status"
      collection_method: "Calibrated scale"
      unit: "kg"
      frequency: "Every lot"
      temporal_coverage: "Full reporting period"
      site_scope: "All included products"
      aggregation_rule: "Sum released net mass by route; rejected mass remains outside the denominator"
      quality_evidence: "Calibration certificate; release record; net-content check"
    - protocol_id: cp_utility_meter
      process_id: "all_production_processes"
      flow_role: "Electricity or purchased steam"
      record_type: "Meter or invoice"
      raw_fields: "meter_id; carrier; start_reading; end_reading; unit; timestamp; process_assignment; downtime"
      collection_method: "Submeter preferred; otherwise invoice reconciled to a documented driver"
      unit: "kWh or MJ"
      frequency: "Continuous or each invoice period"
      temporal_coverage: "Full reporting period"
      site_scope: "All included equipment and shared services"
      aggregation_rule: "Difference readings, subtract documented non-PCR loads, allocate with disclosed driver"
      quality_evidence: "Meter calibration; invoice; allocation worksheet"
    - protocol_id: cp_water_meter
      process_id: "egg_separation_washing_filling_preservation_sanitation_effluent"
      flow_role: "Potable process water"
      record_type: "Water meter"
      raw_fields: "meter_id; start_reading; end_reading; unit; temperature; process_assignment"
      collection_method: "Submeter or calibrated batch vessel"
      unit: "kg or m3"
      frequency: "Each batch or daily"
      temporal_coverage: "Full reporting period"
      site_scope: "All included water points"
      aggregation_rule: "Convert volume to mass with declared density; avoid double counting between process and sanitation"
      quality_evidence: "Meter calibration; water-quality record; conversion record"
    - protocol_id: cp_packaging_mass
      process_id: "filling_preservation"
      flow_role: "Each named packaging component"
      record_type: "Issue, count, and tare record"
      raw_fields: "component_id; material; supplier_lot; count_issued; count_rejected; mean_tare_mass; measured_total_mass"
      collection_method: "Count plus representative tare weighing, or direct warehouse mass"
      unit: "kg"
      frequency: "Each packaging lot"
      temporal_coverage: "Full reporting period"
      site_scope: "All primary, closure, label, and secondary components"
      aggregation_rule: "Calculate component mass separately and reconcile issued, packed, and rejected counts"
      quality_evidence: "Tare sample record; specification; warehouse issue record"
    - protocol_id: cp_fuel_meter
      process_id: "filling_preservation"
      flow_role: "Each named on-site fuel"
      record_type: "Meter, tank, or invoice"
      raw_fields: "fuel_name; quantity; unit; lower_heating_value; start_stock; receipts; end_stock; equipment"
      collection_method: "Meter or stock balance reconciled to invoices"
      unit: "kg, m3, or MJ"
      frequency: "Each batch and monthly reconciliation"
      temporal_coverage: "Full reporting period"
      site_scope: "All pasteurization boilers"
      aggregation_rule: "Calculate use separately by fuel; preserve heating-value source"
      quality_evidence: "Meter or tank calibration; invoice; stock reconciliation"
    - protocol_id: cp_refrigerant_balance
      process_id: "roe_receipt_cold_holding_finished_cold_storage"
      flow_role: "Each named refrigerant input and emission"
      record_type: "Refrigerant maintenance log"
      raw_fields: "refrigerant_name; equipment_id; opening_charge; additions; recoveries; closing_charge; service_date; process_assignment"
      collection_method: "Equipment-level inventory balance"
      unit: "kg"
      frequency: "Each service event and annual reconciliation"
      temporal_coverage: "Full reporting period plus opening and closing inventories"
      site_scope: "All included refrigeration equipment"
      aggregation_rule: "Loss equals opening plus additions minus recovery and closing; allocate only with equipment-specific service basis"
      quality_evidence: "Technician log; cylinder weights; equipment register"
    - protocol_id: cp_waste_mass
      process_id: "all_production_processes"
      flow_role: "Each named solid, organic, packaging, sludge, or rejected-product waste"
      record_type: "Waste scale and consignment record"
      raw_fields: "waste_name; source_process; gross_mass; tare_mass; net_mass; moisture_or_solids; destination; treatment"
      collection_method: "Calibrated scale or verified container count and tare"
      unit: "kg"
      frequency: "Each dispatch or batch"
      temporal_coverage: "Full reporting period"
      site_scope: "All included waste destinations"
      aggregation_rule: "Sum each waste identity separately; do not net against co-products or recycling receipts"
      quality_evidence: "Scale calibration; consignment note; treatment receipt"
    - protocol_id: cp_wastewater_balance
      process_id: "egg_separation_washing_formulation_grading_filling_preservation_sanitation_effluent"
      flow_role: "Each named wastewater or brine stream"
      record_type: "Effluent meter and mass balance"
      raw_fields: "stream_name; meter_reading; batch_water_input; retained_water; sampled_solids; salinity; destination"
      collection_method: "Effluent meter preferred; otherwise water-input mass balance"
      unit: "kg or m3"
      frequency: "Continuous, daily, or every batch"
      temporal_coverage: "Full reporting period"
      site_scope: "All included discharge points"
      aggregation_rule: "Calculate each stream separately; reconcile to water input and disclose unmeasured evaporation or carry-over"
      quality_evidence: "Meter calibration; laboratory result; discharge record"
    - protocol_id: cp_cleaning_chemical
      process_id: "sanitation_effluent"
      flow_role: "Each named cleaner or disinfectant"
      record_type: "Chemical issue and dilution record"
      raw_fields: "chemical_name; concentrate_mass; active_fraction; dilution_water; application_area; batch_id"
      collection_method: "Warehouse issue plus concentration record"
      unit: "kg active ingredient"
      frequency: "Each sanitation event"
      temporal_coverage: "Full reporting period"
      site_scope: "All included sanitation zones"
      aggregation_rule: "Multiply concentrate mass by certified active fraction and keep each chemical separate"
      quality_evidence: "Safety data sheet; certificate of analysis; sanitation log"
    - protocol_id: cp_combustion_emissions
      process_id: "filling_preservation"
      flow_role: "Each named direct combustion emission"
      record_type: "Stack test or calculation worksheet"
      raw_fields: "fuel_name; fuel_use; heating_value; emission_name; factor; factor_source; control_technology; measured_concentration; flue_flow"
      collection_method: "Validated stack measurement preferred; otherwise declared jurisdiction- or supplier-approved factor"
      unit: "kg"
      frequency: "Each test and monthly calculation"
      temporal_coverage: "Full reporting period"
      site_scope: "All included combustion units"
      aggregation_rule: "Calculate each emission separately by fuel and unit; retain factor version and measurement basis"
      quality_evidence: "Stack-test report; fuel analysis; factor publication; calculation review"
    - protocol_id: cp_cold_storage
      process_id: "finished_cold_storage"
      flow_role: "Electricity and stored-product service"
      record_type: "Cold-store meter and occupancy log"
      raw_fields: "meter_reading; room_id; temperature_log; product_mass; occupied_volume; entry_time; release_time"
      collection_method: "Submeter plus warehouse management record"
      unit: "kWh and kg-hour or m3-hour"
      frequency: "Continuous and every lot movement"
      temporal_coverage: "Full reporting period"
      site_scope: "All included cold rooms"
      aggregation_rule: "Assign direct room loads, then allocate shared load by documented occupied volume-time or pallet-time"
      quality_evidence: "Meter calibration; temperature logger; warehouse record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period amount attributable to the route / conforming net product mass released for that route"
      inputs:
        - "route-specific period amount"
        - "released net mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_packaging_mass
      applies_to: "packaging components"
      rule: "component mass = packed component count × measured mean tare mass; rejected component mass is reported separately"
      inputs:
        - count
        - "tare sample"
        - "reject count"
      output: "kg component and kg component waste"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_refrigerant_loss
      applies_to: "refrigerant emissions"
      rule: "loss = opening charge + additions - recovered mass - closing charge; negative or implausible balances require investigation"
      inputs:
        - "charge inventory"
        - additions
        - recoveries
      output: "kg refrigerant emitted by named refrigerant"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_wastewater
      applies_to: "wastewater streams"
      rule: "discharge mass = metered discharge, or water inputs minus documented retained water and evaporation; do not merge brine with sanitation wastewater"
      inputs:
        - "water meter"
        - "product mass change"
        - "discharge meter"
      output: "kg of each named wastewater stream"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_combustion_emission
      applies_to: "each direct combustion emission"
      rule: "emission = fuel use × declared fuel- and technology-specific factor, unless a validated stack result is used"
      inputs:
        - "fuel use"
        - "heating value if required"
        - "factor or stack result"
      output: "kg of one named elementary emission"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "each production lot"
      rule: "input mass = conforming output + each co-product or waste output + wastewater-borne or evaporated mass + documented inventory change and residual"
      inputs:
        - "all mass records"
      output: "closure percentage and unresolved mass"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "roe and final product"
      requirement: "Record common and scientific species name, farmed or wild origin, supplier, lot, ovulated status where applicable, and whether the receipt is intact ovary, separated eggs, salted roe, or another intermediate."
      evidence: "Supplier specification; traceability record; receiving inspection"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use a continuous period representative of normal operations and covering seasonal production, maturation, and cold-storage effects; disclose shutdowns and exceptional lots."
      evidence: "Dated meter, batch, warehouse, and maintenance records"
    - id: dq_completeness
      applies_to: "all inventory"
      requirement: "Include every material, packaging component, energy carrier, fuel, refrigerant, water stream, cleaner, waste, wastewater, sludge, and direct emission actually used or generated; zero and not-applicable values require evidence."
      evidence: "Completeness checklist; purchase-to-use reconciliation; mass and energy balances"
    - id: dq_route_separation
      applies_to: "caviar and substitute routes"
      requirement: "Keep species, formulation, package format, pasteurization, and cold-storage routes separate until a documented allocation step."
      evidence: "Batch routing; submetering; allocation worksheet"
    - id: dq_upstream
      applies_to: "received roe supply"
      requirement: "Supplier data shall include the upstream fish-production system, harvest, slaughter or egg-recovery boundary, co-products, allocation, geography, year, and transport to the foreground gate."
      evidence: "Supplier LCI or audited primary-data questionnaire"
    - id: dq_measurement
      applies_to: "meters and scales"
      requirement: "Maintain calibration status, units, conversion factors, sampling methods, and uncertainty or precision information for every primary measurement."
      evidence: "Calibration certificates; sampling plan; calculation review"
    - id: dq_waste_destination
      applies_to: "wastes and wastewater"
      requirement: "Record the physical identity, wet or dry basis, destination, treatment technology, and whether a material is sold, donated, recycled, rendered, treated, or disposed."
      evidence: "Consignment note; treatment receipt; sales record"
    - id: dq_representativeness
      applies_to: "foreground and upstream datasets"
      requirement: "Assess technological, geographical, time-related representativeness, precision, completeness, methodological consistency, documentation, nomenclature, and review status."
      evidence: "Data-quality assessment and review record consistent with the EF method"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference_product"
    rule: "Confirm that the denominator is 1 kg net conforming product excluding packaging and that every required qualifier is present."
    source_ids:
      - codex-cxs-291-2010
      - codex-gsfa-09-3-3
  - rule_id: validate_species_scope
    applies_to: "product_identity"
    rule: "Confirm that caviar is made from declared sturgeon eggs and that every substitute names its actual non-sturgeon fish species; reject generic or plant-based analogues from this PCR."
    source_ids:
      - codex-cxs-291-2010
      - codex-gsfa-09-3-3
      - unsd-cpc-v3-21243
  - rule_id: validate_process_route
    applies_to: "process_map"
    rule: "Reconcile the facility flow diagram to receipt, separation or verified pre-separation, washing, draining, formulation, filling, preservation, maturation, cold storage, sanitation, and effluent handling; explain every omitted or added step."
    source_ids:
      - codex-cxc-52-2003
  - rule_id: validate_atomic_inventory
    applies_to: "process_inventory"
    rule: "Reject any selected flow that combines multiple materials, packaging components, utilities, fuels, refrigerants, wastes, wastewater streams, or emissions; each card shall represent one exchange."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_formulation
    applies_to: "formulation"
    rule: "Reconcile every named ingredient and additive to the approved lot formulation and applicable legal authorization; do not infer additive use from a permitted-additive list."
    source_ids:
      - codex-cxs-291-2010
      - codex-gsfa-09-3-3
  - rule_id: validate_temperature_and_preservation
    applies_to: "cold_chain"
    rule: "Verify lot temperature logs, preservation route, pasteurization records when applicable, maturation records, shelf-life specification, and corrective actions against the declared product specification."
    source_ids:
      - codex-cxs-291-2010
      - codex-cxc-52-2003
  - rule_id: validate_mass_balance
    applies_to: "each_process_and_period"
    rule: "Require a documented mass balance for roe inputs, ingredients, conforming product, rejects, residues, brine, wastewater, sludge, and inventory change; investigate unexplained loss before release."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_upstream_completeness
    applies_to: "received_roe"
    rule: "Fail completeness when farming or capture, feed where relevant, harvest, supplier slaughter or egg recovery, co-products, allocation, or inbound cold-chain burdens are omitted without a declared cut-off justification."
    source_ids:
      - dudu-georgescu-2024-sturgeon
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "multifunctional_processes"
    rule: "Confirm subdivision was attempted first, allocation drivers are causal and documented, upstream co-product treatment is disclosed, and results can be reconstructed before and after allocation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_data_quality
    applies_to: "dataset"
    rule: "Confirm completeness, methodological consistency, technology, geography, time, precision, documentation, nomenclature, and review evidence; disclose every unresolved flow UUID and range-evidence gap."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Factory-gate foreground production dataset for packaged caviar or one species-specific caviar substitute route"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product LCA, environmental-footprint studies, supply-chain inventories, process improvement, and comparative work only when species, quality, route, package, preservation, geography, allocation, and boundary are compatible"
  excluded_use: "Claims about animal welfare, legality, food safety certification, biodiversity, nutritional superiority, or product equivalence; substitution across species or preservation routes without documented comparability; use as an upstream aquaculture dataset"
  required_metadata: "PCR id and version; product and scientific species name; caviar or substitute status; roe origin and state; supplier boundary; formulation; additives; preservation and pasteurization status; package components; net mass; geography; technology; reporting period; cold-storage duration; allocation; cut-offs; data sources; unresolved identities"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; mass-balance closure; seasonal and capacity representativeness; upstream roe-data quality; allocation sensitivity; refrigerant method; wastewater and waste destinations; additive authorization; uncertainty and unresolved evidence"
  update_trigger: "Change in fish species or origin, upstream production system, formulation, additive authorization, package format, pasteurization or cold-storage technology, refrigerant, energy supply, wastewater treatment, allocation, supplier boundary, or a material shift in yield or data quality"
