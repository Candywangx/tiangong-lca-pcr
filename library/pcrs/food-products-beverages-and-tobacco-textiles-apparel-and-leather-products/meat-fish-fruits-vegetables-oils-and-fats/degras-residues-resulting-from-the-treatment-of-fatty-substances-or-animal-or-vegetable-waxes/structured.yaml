  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every foreground row"
      rule: "normalized row quantity = row quantity for the declared study period / net conforming reference-product kg for the same period"
      inputs:
        - "linked collection protocol"
        - cp_release_reference_product
      output: "row-declared unit per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_shared_utility_allocation
      applies_to: "a utility meter serving more than one process"
      rule: "allocate the carrier-specific meter total by documented operating time, equipment power or heat duty, or another measured causal driver; preserve the unallocated total and reconciliation"
      inputs:
        - "carrier meter"
        - "operating records"
        - "causal driver"
      output: "stage-specific carrier quantity"
      source_ids:
        - eu-fdm-bat-2019-2031
        - eu-sa-bat-2023-2749
        - eu-pef-2021-2279
    - id: calc_foreground_mass_balance
      applies_to: "declared route"
      rule: "mass-balance closure = named mass inputs - named products - named co-products - named wastes - named emissions - documented inventory change"
      inputs:
        - "all linked mass records for one lot or period"
      output: "disclosed closure and unexplained difference"
      source_ids:
        - eu-fdm-bat-2019-2031
        - eu-tanning-bat-2013-84
        - eu-sa-bat-2023-2749
        - eu-pef-2021-2279
    - id: calc_n_hexane_release
      applies_to: "n-hexane route"
      rule: "unrecovered n-hexane = purchases + opening stock - closing stock - recovered stock - product retention - named wastes; allocate measured releases separately to air and water"
      inputs:
        - cp_solvent_materials
        - cp_solvent_products
        - cp_solvent_wastes
        - cp_solvent_emission_balance
      output: "kg n-hexane to each receiving medium"
      source_ids:
        - eu-fdm-bat-2019-2031
        - eu-pef-2021-2279
    - id: calc_refrigerant_release
      applies_to: "each actual refrigerant"
      rule: "release = opening stock + purchases + charge additions - recovery - closing stock - documented equipment inventory change"
      inputs:
        - cp_finishing_materials
        - cp_finishing_refrigerant_balance
      output: "kg of the named refrigerant to air"
      source_ids:
        - eu-sa-bat-2023-2749
        - eu-pef-2021-2279
    - id: calc_combustion_emission
      applies_to: "each named combustion emission"
      rule: "emission load = measured named-fuel activity multiplied by a documented facility-specific or cited substance factor, or direct calibrated stack mass; keep fuels and substances separate"
      inputs:
        - cp_thermal_utilities
        - cp_thermal_air_emissions
        - "factor provenance"
      output: "kg of one named substance to air"
      source_ids:
        - eu-fdm-bat-2019-2031
        - eu-sa-bat-2023-2749
        - eu-pef-2021-2279
    - id: calc_effluent_parameter_load
      applies_to: "each named water-emission parameter"
      rule: "parameter load = matched treated-effluent volume multiplied by laboratory concentration with explicit unit conversion"
      inputs:
        - cp_wwt_effluent_analysis
        - "treated-flow record"
      output: "kg of one named parameter to water"
      source_ids:
        - eu-fdm-bat-2019-2031
        - eu-sa-bat-2023-2749
        - eu-pef-2021-2279
    - id: calc_allocation_factor
      applies_to: "unavoidable shared burden"
      rule: "allocation factor = declared causal quantity or economic value of the reference product / corresponding total across all co-products for the same period"
      inputs:
        - "product and co-product quantities"
        - "causal driver or prices"
      output: "disclosed allocation factor and sensitivity where required"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_source_identity
      applies_to: "starting residue"
      requirement: "Identify one exact residue stream, source material, generating operation, supplier or internal source, lot, and legal status."
      evidence: "receiving specification, supplier record, internal transfer record, and process flow diagram"
    - id: dq_route_traceability
      applies_to: "all processes"
      requirement: "Map every active card to one declared route and justify every conditional process and non-applicable row."
      evidence: "dated facility flow diagram, batch record, and applicability matrix"
    - id: dq_temporal_match
      applies_to: "all collected records"
      requirement: "Use the same representative period for inputs, outputs, stocks, and emissions, or document and reconcile any mismatch."
      evidence: "record coverage table and reconciliation"
    - id: dq_meter_scale_quality
      applies_to: "meters and scales"
      requirement: "Retain calibration status, reading frequency, missing-data treatment, and shared-meter allocation evidence."
      evidence: "calibration certificates, logs, and allocation worksheets"
    - id: dq_laboratory_quality
      applies_to: "wastewater and direct emission measurements"
