allocation_rules:
  - rule_id: alloc_subdivision_first
    applies_to: "shared and multi-output operations"
    rule: "Use process subdivision or direct metering first so that the reference product, recovered fatty phases, recovered solvent, and wastes retain separate quantities."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_source_residue_burden
    applies_to: "declared starting residue"
    rule: "State the upstream burden or cut-off treatment inherited from the source system and its governing rule; do not assume the residue is burden-free merely because it is a residue."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_physical_causality
    applies_to: "unavoidable shared inputs or emissions"
    rule: "When subdivision is not possible, use a documented physical causal relation that reflects the actual process driver and report the denominator and period."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_economic_sensitivity
    applies_to: "multi-output operations without defensible physical causality"
    rule: "If economic allocation is necessary, use contemporaneous site-specific prices, disclose price period and currency, and report a sensitivity case; no default price is provided."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_internal_recovery_no_credit
    applies_to: "recovered n-hexane, water, heat, or material returned within the foreground system"
    rule: "Subtract verified internal recovery from gross external demand without assigning an avoided-product credit or counting the same recovery as a co-product."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-pef-2021-2279
  - rule_id: alloc_waste_treatment
    applies_to: "waste and wastewater outputs"
    rule: "Include foreground collection and on-site treatment; document the transfer point and dataset used for off-site treatment without netting waste against the reference product."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-tanning-bat-2013-84
      - eu-sa-bat-2023-2749
      - eu-pef-2021-2279
