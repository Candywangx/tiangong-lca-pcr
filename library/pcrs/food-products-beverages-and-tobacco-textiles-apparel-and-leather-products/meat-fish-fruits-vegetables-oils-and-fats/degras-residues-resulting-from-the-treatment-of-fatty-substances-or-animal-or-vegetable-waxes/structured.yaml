system_boundary:
  rules:
    - rule_id: sb_declared_residue_gate
      applies_to: "foreground starting gate"
      rule: "Begin at the first transfer of the exact declared source residue into this foreground recovery or treatment system; identify the upstream generating operation and do not silently assign zero upstream burden."
      source_ids:
        - un-cpc-3-0-retained
        - eu-pef-2021-2279
    - rule_id: sb_route_lock
      applies_to: "process inclusion"
      rule: "Include only operations shown in the facility flow diagram for the declared route and retain one exact residue-source identity throughout the mass balance."
      source_ids:
        - eu-fdm-bat-2019-2031
        - eu-tanning-bat-2013-84
        - eu-sa-bat-2023-2749
        - eu-pef-2021-2279
    - rule_id: sb_upstream_separation
      applies_to: "upstream systems"
      rule: "Keep production of the original fatty substance or wax and the operation generating the source residue outside this foreground gate unless the study explicitly expands the boundary and reports them separately."
      source_ids:
        - un-cpc-3-0-retained
        - eu-pef-2021-2279
    - rule_id: sb_downstream_exclusion
      applies_to: "downstream systems"
      rule: "Exclude transport after the factory gate, further conversion, use, recycling, and final disposal unless the declared study scope explicitly adds them."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: sb_internal_recovery
      applies_to: "internal solvent, water, heat, or material recovery"
      rule: "Treat internal recovery as an internal transfer that reduces net external input; do not create an avoided-product credit unless a distinct output crosses the foreground gate."
      source_ids:
        - eu-fdm-bat-2019-2031
        - eu-pef-2021-2279
    - rule_id: sb_no_unlisted_selector
      applies_to: "inventory completeness"
      rule: "If an actual exchange is absent from the cards, add and review one exact atomic row; never use a generic materials, chemicals, energy, fuels, waxes, residues, wastes, emissions, or other-residue selector."
      source_ids:
        - eu-pef-2021-2279
