      evidence: "manifest reference-flow audit and category-scope review"
validation_rules:
  - rule_id: v_cpc_scope_exact
    applies_to: "product identity"
    rule: "The dataset must be CPC 21932 degras or a treatment residue from one declared fatty substance, animal wax, or vegetable wax and must not represent a finished fat, oil, wax, dairy product, or unrelated residue."
    source_ids:
      - un-cpc-3-0-retained
  - rule_id: v_reference_identity
    applies_to: "reference flow"
    rule: "The product-flow UUID, Mass property UUID, Units of mass UUID, kg unit, and exact baseName must match the reference definition."
    source_ids: []
  - rule_id: v_reference_general_comment_defect
    applies_to: "reference-flow evidence"
    rule: "The inconsistent remote generalComment must be disclosed and rejected as semantic evidence; any dairy interpretation fails conformance."
    source_ids: []
  - rule_id: v_reference_quantity
    applies_to: "reference amount"
    rule: "The normalized output must equal exactly 1 kg net conforming product and exclude packaging and co-product mass."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: v_source_route_lock
    applies_to: "foreground package"
    rule: "Exactly one source-residue identity and one actual route flow diagram must govern the dataset; unrelated routes or origins must not be averaged."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-tanning-bat-2013-84
      - eu-sa-bat-2023-2749
      - eu-pef-2021-2279
  - rule_id: v_atomic_selected_flow
    applies_to: "inventory cards"
    rule: "Every active card must contain one concrete exchange only; aggregate selectors and unlisted catch-all residues fail conformance."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: v_conditional_applicability
    applies_to: "conditional rows and processes"
    rule: "Each conditional item must be supported by the facility route or marked not applicable with evidence; zero must not conceal missing data."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: v_nonreference_uuid_gate
    applies_to: "non-reference flow UUIDs"
    rule: "A non-reference UUID must remain blank unless exact hybrid discovery and direct public state-100 semantic read are both documented."
    source_ids: []
  - rule_id: v_no_default_amount
    applies_to: "inventory amounts and factors"
    rule: "Every non-reference amount must come from a foreground record or calculation from collected records; BREF values, BAT-AELs, and author estimates must not be used as defaults."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-sa-bat-2023-2749
      - eu-pef-2021-2279
  - rule_id: v_carrier_separation
    applies_to: "energy inventory"
    rule: "Electricity, purchased steam, purchased hot water, natural gas, diesel fuel, and LPG must remain separate rows and calculations."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-sa-bat-2023-2749
      - eu-pef-2021-2279
  - rule_id: v_solvent_balance
    applies_to: "n-hexane route"
    rule: "The n-hexane balance must close purchases, stocks, recovery, retention, wastes, and separate air and water releases."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: v_refrigerant_balance
    applies_to: "cooling systems"
    rule: "Every actual refrigerant must have separate makeup and release rows and a closed mass balance."
    source_ids:
      - eu-sa-bat-2023-2749
  - rule_id: v_mass_balance
    applies_to: "declared route"
    rule: "The package must disclose its foreground mass-balance closure and explain any residual difference."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-tanning-bat-2013-84
      - eu-sa-bat-2023-2749
      - eu-pef-2021-2279
  - rule_id: v_emission_media
    applies_to: "elementary flows"
    rule: "Each substance or analytical parameter and receiving medium must remain separate and must be calculated from matched records."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-sa-bat-2023-2749
      - eu-pef-2021-2279
  - rule_id: v_allocation_disclosure
    applies_to: "shared burdens and co-products"
    rule: "The package must disclose subdivision, allocation method, factor, denominator, period, and required sensitivity without double-crediting internal recovery."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: v_packaging_exclusion
    applies_to: "reference mass and packaging"
    rule: "Each packaging component and scrap must remain separate, while all package mass is excluded from the 1 kg product mass."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-pef-2021-2279
  - rule_id: v_completeness
    applies_to: "foreground LCI"
    rule: "The completeness matrix must cover every actual named material, chemical, water, utility, refrigerant, packaging component, product, co-product, waste, wastewater stream, and emission."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-tanning-bat-2013-84
      - eu-sa-bat-2023-2749
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "foreground unit-process system for one exact CPC 21932 source-residue and route"
  downstream_use: "process dataset; lifecycle-model input; verified foreground data package"
  allowed_use: "studies matching the declared source-residue identity, generating operation, route, technology, geography, period, quality state, legal status, gate, and allocation"
  excluded_use: "generic averages mixing residue sources or routes; dairy products; finished fats, oils, or waxes; unverified proxy UUIDs; datasets using PCR or BAT defaults as amounts"
  required_metadata: "CPC code; reference UUID; exact source-residue identity; source material; generating operation; route flow diagram; active and non-applicable rows; quality state; legal status; geography; period; technology; packaging; co-products; allocation; gate"
  required_quality_disclosure: "record coverage; meter and scale quality; analytical methods; mass, solvent, refrigerant, water, and energy balances; factor provenance; allocation; unresolved UUID list; reference generalComment defect"
  update_trigger: "change in source residue, generating operation, route, technology, solvent, refrigerant, packaging, co-product status, allocation, geography, study period, specification, legal status, or reference-flow metadata"
