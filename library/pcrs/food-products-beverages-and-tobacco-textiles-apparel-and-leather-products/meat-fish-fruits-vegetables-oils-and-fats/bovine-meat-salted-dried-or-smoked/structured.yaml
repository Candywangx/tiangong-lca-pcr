  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory cards"
      rule: "Normalized amount = atomic exchange quantity attributable to the locked route and product specification / net conforming reference-product mass released in the same campaign."
      inputs:
        - "attributable atomic exchange quantity"
        - "net conforming product mass"
      output: "amount per 1 kg net conforming product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_stage_utility_allocation
      applies_to: "shared utility meters"
      rule: "Use a dedicated submeter where available. Otherwise allocate a shared meter only with a documented causal driver such as measured runtime multiplied by verified load; retain total reconciliation."
      inputs:
        - "shared-meter total"
        - "submeter or causal-driver records"
        - "route and specification ids"
      output: "stage-specific carrier quantity"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_recipe_input
      applies_to: "ingredients and packaging"
      rule: "Atomic input = opening stock + receipts - closing stock - documented return, reconciled to dispensing or issue records for the locked batch."
      inputs:
        - "opening stock"
        - receipts
        - "closing stock"
        - returns
        - "dispensing records"
      output: "product-specific atomic input mass"
      source_ids:
        - eu-pef-2021-2279
        - fao-dried-salted-meats-1985
        - fao-meat-preservation-manual-1990
    - id: calc_product_yield
      applies_to: "each preservation stage"
      rule: "Yield = measured conforming output mass / measured input meat mass for the same locked batch. Report co-products, rejects, wastewater and evaporation separately."
      inputs:
        - "input meat"
        - "conforming output"
        - co-products
        - waste
        - wastewater
        - evaporation
      output: "stage yield and mass-balance residual"
      source_ids:
        - eu-pef-2021-2279
        - fao-dried-salted-meats-1985
        - fao-meat-preservation-manual-1990
    - id: calc_evaporated_water
      applies_to: "drying and thermal finishing"
      rule: "Evaporated water = water mass in measured inputs - water mass in measured products - water mass in separately recorded liquid and solid outputs, using batch-specific moisture results."
      inputs:
        - "batch masses"
        - "moisture results"
        - "liquid outputs"
        - "solid outputs"
      output: "water to air"
      source_ids:
        - eu-pef-2021-2279
        - fao-dried-salted-meats-1985
        - fao-meat-preservation-manual-1990
    - id: calc_refrigerant_stock_balance
      applies_to: "each named refrigerant"
      rule: "Emission = opening equipment charge + additions - closing equipment charge - recovered mass. Investigate negative or unreconciled results; do not substitute a default leak rate."
      inputs:
        - "opening charge"
        - additions
        - "closing charge"
        - "recovered mass"
      output: "named refrigerant emission to air"
      source_ids:
        - eu-pef-2021-2279
        - jrc-sa-bref-2024
    - id: calc_stationary_combustion_emission
      applies_to: "each direct air pollutant"
      rule: "Emission = sum of each exact burned fuel or named wood quantity multiplied by a documented pollutant-specific factor, unless direct monitoring is used. Store each pollutant separately."
      inputs:
        - "fuel or named wood quantity"
        - "pollutant factor and provenance"
        - "direct monitoring"
      output: "one named elementary emission"
      source_ids:
        - eu-pef-2021-2279
        - jrc-sa-bref-2024
        - fao-meat-preservation-manual-1990
    - id: calc_wastewater_pollutant_load
      applies_to: "each wastewater pollutant"
      rule: "Pollutant load = matched discharge volume multiplied by its laboratory concentration, with unit conversion and sampling representativeness documented."
      inputs:
        - "discharge volume"
        - "pollutant concentration"
        - "sampling time"
        - conversion
      output: "one named pollutant mass to water"
      source_ids:
        - eu-pef-2021-2279
        - jrc-sa-bref-2024
    - id: calc_allocation_factor
      applies_to: "shared operations and co-products"
      rule: "After subdivision and causal allocation are exhausted, allocation factor = declared product-specific driver / sum of the same driver for all jointly produced outputs. Record driver, period, outputs, factor and sensitivity."
      inputs:
        - "joint inventory"
        - "output identities"
        - "physical or economic driver"
        - period
      output: "documented allocation factor"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_route_identity
      applies_to: "every package"
      requirement: "Approve the route id, operation order and finished-product specification before aggregation; do not average across routes."
      evidence: "Approved specification, route map and batch link."
    - id: dq_primary_records
      applies_to: "foreground amounts"
      requirement: "Use calibrated measurements, invoices, stock reconciliation, batch records, laboratory results or signed waste records representative of the declared period."
      evidence: "Source record, calibration or supplier evidence and sign-off."
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Reconcile ingredients, utilities, product, co-products, packaging, waste, wastewater and direct emissions for every active process."
      evidence: "Process checklist and mass or energy reconciliation."
    - id: dq_temporal_alignment
      applies_to: "campaign data"
      requirement: "Align recipes, product mass, meters, maintenance, waste and samples to one representative campaign; disclose shutdowns and abnormal batches."
      evidence: "Timestamped records and inclusion log."
    - id: dq_representativeness
      applies_to: "all data"
      requirement: "Assess technological, geographical and temporal representativeness and document material gaps or proxies."
      evidence: "Data-quality assessment and source metadata."
    - id: dq_calculation_traceability
      applies_to: "calculated values"
      requirement: "Retain raw inputs, formula version, units, conversion factors, source provenance and reviewer check for every calculation."
      evidence: "Reproducible calculation and review record."
    - id: dq_no_default_substitution
      applies_to: "missing amounts"
      requirement: "Do not insert a PCR recipe, time, temperature, yield, energy, emission factor or numerical range. Obtain a foreground record or document a data gap."
      evidence: "Gap register and collection action."
    - id: dq_uuid_review
      applies_to: "non-reference flows"
      requirement: "Keep UUID blank until flow-hybrid-search and public state-100 direct read both confirm exact semantics, flow type, property and unit."
      evidence: "Dual-verification record outside PCR content."
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference flow"
    rule: "Confirm the sole reference-product UUID, Mass UUID, Units of mass UUID and kg unit exactly match this PCR; reject any non-CPC-21182 reference product."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_route_spec
    applies_to: "dataset identity"
    rule: "Reject a package that lacks one locked route identifier, exact operation order, finished-product specification, ingredient list, smoke medium where applicable, preservation endpoint, storage condition or packaging declaration."
    source_ids:
      - fao-dried-salted-meats-1985
      - fao-meat-preservation-manual-1990
      - eu-pef-2021-2279
  - rule_id: validate_atomic_flows
    applies_to: "inventory cards"
    rule: "Reject any Selected flow that contains alternatives, plural categories, unnamed carriers, unnamed ingredients, unnamed chemicals, unnamed packaging, mixed wastes or combined emissions. Keep every non-reference UUID empty until dual exact verification."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_process_applicability
    applies_to: "process map"
    rule: "Confirm every active route operation has a process section and every omitted conditional process has documentary non-applicability evidence. Never merge direct wood smoking with liquid smoke application."
    source_ids:
      - fao-meat-preservation-manual-1990
      - eu-pef-2021-2279
  - rule_id: validate_reference_mass
    applies_to: "quantitative inventory"
    rule: "Confirm all amounts normalize to 1 kg net conforming product and packaging mass is excluded. Reconcile released net mass to batch and pack records."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_recipe_completeness
    applies_to: "ingredients and packaging"
    rule: "Reconcile the product-specific ingredient bill and every packaging component to stock, issue, return and batch records. Any unlisted actual flow requires a new atomic card."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_utility_reconciliation
    applies_to: "utilities"
    rule: "Reconcile electricity, steam, hot water and each fuel to meters or invoices. Document causal allocation of shared records and prohibit double counting purchased heat with upstream supplier fuel."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_refrigerants_emissions
    applies_to: "refrigeration and direct emissions"
    rule: "Reconcile every named refrigerant by stock balance. For each pollutant, retain direct measurements or the exact activity record, factor, factor source, unit conversion and calculation."
    source_ids:
      - eu-pef-2021-2279
      - jrc-sa-bref-2024
  - rule_id: validate_wastewater
    applies_to: "wastewater"
    rule: "Reconcile each generating wastewater stream to treatment inflow and discharge. Match volume and concentration periods for each named pollutant load."
    source_ids:
      - eu-pef-2021-2279
      - jrc-sa-bref-2024
  - rule_id: validate_mass_balance
    applies_to: "all production stages"
    rule: "Check stage and campaign mass balances across meat, ingredients, product, co-products, waste, wastewater and evaporation. Investigate residuals instead of forcing them into an aggregate flow."
    source_ids:
      - eu-pef-2021-2279
      - fao-dried-salted-meats-1985
      - fao-meat-preservation-manual-1990
  - rule_id: validate_temporal_scope
    applies_to: "foreground evidence"
    rule: "Confirm route, specification, recipes, meters, waste records and laboratory samples cover the same representative period and identify shutdowns, abnormal batches and exclusions."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_quality_verification
    applies_to: "published dataset"
    rule: "Retain evidence for completeness, precision, temporal, technological and geographical representativeness, calculations, source provenance and reviewer sign-off. External communication requires the applicable PEF verification and validation procedure."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after methodology and data review"
  downstream_use: "Foreground preservation-process modelling and linked life-cycle models for the exact declared route and finished-product specification."
  allowed_use: "Attributional studies whose geography, technology, period, route, ingredients, smoke medium, preservation endpoint, packaging and storage state match the metadata."
  excluded_use: "A generic average across salted, dried and smoked routes; substitution for unpreserved bovine meat, offal, another species or another meat preparation; comparative assertion without applicable review and verification."
  required_metadata: "PCR id; CPC reference; reference UUIDs; route id; operation order; product specification; complete ingredient and packaging bill; smoke technology and exact medium; preservation endpoints; facility and line; geography; period; allocation; sources; data-quality assessment; exclusions."
  required_quality_disclosure: "Primary-data share; meter and mass-balance coverage; calculation and factor provenance; refrigerant reconciliation; emission and wastewater monitoring; temporal, technological and geographical representativeness; uncertainty and gaps; reviewer and verification status."
  update_trigger: "Change in route, recipe, smoke medium, wood species, thermal endpoint, drying endpoint, equipment, refrigerant, energy supply, packaging, wastewater treatment, allocation, regulation, reference-flow identity, or a material data-quality finding."
data_sources:
  - id: "un-cpc-3-0-2025"
    type: "dataset"
    reference: "United Nations Statistics Division, *Central Product Classification (CPC) Version 3.0 Structure*, 30 June 2025, retained exact row 21182. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv (accessed 2026-08-13)."
    used_for: "Exact product boundary and exclusions from neighbouring preserved-meat classes."
  - id: "fao-dried-salted-meats-1985"
    type: "official_guidance"
    reference: "FAO Animal Production and Health Paper 51, G. A. Norman and O. O. Corte, *Dried salted meats: charque and carne-de-sol*, ISBN 92-5-102219-4, 1985. https://www.fao.org/4/x6555e/x6555e00.htm (accessed 2026-08-13)."
    used_for: "Bovine raw-material preparation, distinct salted-dried routes, salt and water inputs, brine and used-salt wastes, drying, packaging and sanitation structure; no example quantity is adopted."
  - id: "fao-meat-preservation-manual-1990"
    type: "official_guidance"
    reference: "FAO Animal Production and Health Paper 79, *Manual on simple methods of meat preservation*, ISBN 92-5-102744-7, 1990, Chapter 2. https://www.fao.org/4/x6932e/x6932e02.htm (accessed 2026-08-13)."
    used_for: "Drying and direct-wood-smoking structure, controls, exact salt treatment, smoke-medium declaration and packaging candidates; no example quantity is adopted."
  - id: "jrc-sa-bref-2024"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, *Best Available Techniques Reference Document for the Slaughterhouses, Animal By-products and/or Edible Co-products Industries*, JRC135916, EUR 31752 EN, 2024, DOI 10.2760/18199. https://publications.jrc.ec.europa.eu/repository/handle/JRC135916 (accessed 2026-08-13)."
    used_for: "Animal-product-site utility, cleaning, refrigeration, wastewater, waste and direct-emission collection candidates; no BREF level is adopted as a cured-meat default."
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I, Product Environmental Footprint Method, consolidated text. https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng (accessed 2026-08-13)."
    used_for: "Product-specific bill of materials, company-specific foreground data, complete LCI, allocation, transparency, data quality, reporting, verification and validation."
