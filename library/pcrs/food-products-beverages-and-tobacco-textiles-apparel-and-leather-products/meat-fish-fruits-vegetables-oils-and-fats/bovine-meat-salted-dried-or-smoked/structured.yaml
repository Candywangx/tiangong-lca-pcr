system_boundary:
  rules:
    - rule_id: boundary_route_lock
      applies_to: "foreground data package"
      rule: "Declare one route identifier before collection: one concrete salted, dried, direct-wood-smoked or liquid-smoke route, or one explicitly ordered combination. Declare the exact finished-product specification. Do not aggregate different combinations."
      source_ids:
        - un-cpc-3-0-2025
