allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared operations"
    rule: "First subdivide lines, rooms, meters and batch records to the locked route and finished-product specification wherever technically feasible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_causal
    applies_to: "shared utilities"
    rule: "When subdivision is infeasible, use a documented physical causal driver for each shared utility or treatment operation and reconcile allocated values to the measured total."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_coproduct_identity
    applies_to: "trimmings and recovered fat"
    rule: "Classify food-grade bovine trimmings or recovered bovine fat as co-products only when a documented beneficial destination and positive product function exist; otherwise retain the exact waste flow."
    source_ids:
      - eu-pef-2021-2279
      - jrc-sa-bref-2024
  - rule_id: allocation_joint_process
    applies_to: "joint co-products"
    rule: "If a joint process remains after subdivision and causal modelling, apply calc_allocation_factor with a justified physical driver; use an economic driver only when no defensible physical relation exists. Disclose values, period and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_no_hidden_credit
    applies_to: "waste and recovery"
    rule: "Do not subtract an avoided burden or hide a recovery credit in a foreground amount. Model substitution, recycling or treatment consequences as explicit downstream scenarios outside this attributional foreground inventory."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_mass_balance
    applies_to: "all stages"
    rule: "Reconcile input meat, ingredients and water with conforming product, co-products, waste, wastewater and calculated evaporation for every locked batch; investigate and disclose residuals."
    source_ids:
      - eu-pef-2021-2279
      - fao-dried-salted-meats-1985
      - fao-meat-preservation-manual-1990
