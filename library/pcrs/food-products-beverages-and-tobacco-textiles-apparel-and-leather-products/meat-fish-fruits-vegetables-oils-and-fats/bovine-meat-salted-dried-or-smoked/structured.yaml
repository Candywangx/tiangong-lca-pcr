        - fao-meat-preservation-manual-1990
        - eu-pef-2021-2279
    - rule_id: boundary_start
      applies_to: "foreground system"
      rule: "Start at facility-gate receipt of one exact incoming bovine-meat state or one exact purchased preserved-bovine-meat input. Keep supplier production and inbound transport in linked upstream datasets."
      source_ids:
        - un-cpc-3-0-2025
        - eu-pef-2021-2279
    - rule_id: boundary_end
      applies_to: "foreground system"
      rule: "End at factory-gate release of 1 kg net conforming product after the declared preservation, packaging and conditioned-storage steps. Packaging mass is outside the reference-product mass."
      source_ids:
        - un-cpc-3-0-2025
        - eu-pef-2021-2279
    - rule_id: boundary_upstream
      applies_to: "upstream modelling"
      rule: "Bovine rearing, feed production, slaughter, primary chilling or freezing and inbound transport are outside foreground collection; link representative upstream datasets and disclose geography, technology and allocation."
      source_ids:
        - jrc-sa-bref-2024
        - eu-pef-2021-2279
    - rule_id: boundary_downstream
      applies_to: "downstream modelling"
      rule: "Distribution, retail, consumer preparation, use, food loss and packaging end of life are outside this foreground boundary unless a study adds them as separate downstream stages."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_conditional_processes
      applies_to: "process map"
      rule: "Include only preservation and utility processes that physically occur in the locked route. Document every omitted conditional process with plant evidence."
      source_ids:
        - fao-dried-salted-meats-1985
        - fao-meat-preservation-manual-1990
        - eu-pef-2021-2279
    - rule_id: boundary_recursive_input
      applies_to: "same-category input"
      rule: "When an incoming flow already meets CPC 21182, keep its exact salted, dried or smoked identity as a purchased input and require a separate upstream dataset; do not recreate it recursively inside this package."
      source_ids:
        - un-cpc-3-0-2025
