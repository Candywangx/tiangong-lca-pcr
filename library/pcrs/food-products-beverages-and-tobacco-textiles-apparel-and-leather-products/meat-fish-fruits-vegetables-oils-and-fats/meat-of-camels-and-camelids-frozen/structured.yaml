process_map:
  - id: camelid_receipt_and_holding
    name: "Camelid receipt and holding"
    inclusion: "required"
    inclusion_condition: "Always include for slaughterhouse production from accepted live animals."
    role: "Establishes species-specific live-animal receipt, acceptance, holding utilities, and receipt losses."
    quantitative_reference: "Accepted live-animal mass linked to the 1 kg reference output."
  - id: slaughter_bleeding_skinning_evisceration
    name: "Slaughter, bleeding, skinning, and evisceration"
    inclusion: "required"
    inclusion_condition: "Always include for production from accepted live camelids."
    role: "Transforms accepted live animals into skinned eviscerated carcasses while separately recording utilities, co-products, wastes, wastewater, and combustion emissions."
    quantitative_reference: "Skinned eviscerated carcass mass linked to the 1 kg reference output."
  - id: carcass_dressing_and_cutting
    name: "Carcass dressing and cutting"
    inclusion: "required"
    inclusion_condition: "Include carcass dressing for every product; include cutting and deboning operations only for the declared product form."
    role: "Prepares eligible carcasses and, where declared, separates specific meat cuts while recording bone, fat, rejects, wastewater, water, and electricity separately."
    quantitative_reference: "Eligible dressed carcass or cut mass linked to the 1 kg reference output."
  - id: precooling_and_freezing
    name: "Pre-cooling and freezing"
    inclusion: "required"
    inclusion_condition: "Always include to establish the frozen market state; record only the refrigerant substances actually present at the facility."
    role: "Pre-cools eligible meat, freezes it to the declared frozen state, and keeps electricity, refrigerant make-up, refrigerant leakage, water, ice, wastewater, and compressor oil as separate exchanges."
    quantitative_reference: "Frozen eligible meat mass linked to the 1 kg reference output."
  - id: packaging_and_frozen_storage
    name: "Packaging and frozen storage"
    inclusion: "required"
    inclusion_condition: "Always include product release packaging and frozen storage up to the facility gate; include each packaging component and protective gas only when used."
    role: "Receives frozen meat, records each packaging component and storage utility separately, rejects off-spec product, and releases the sole 1 kg reference product."
    quantitative_reference: "Exactly 1 kg net qualified frozen reference product, excluding packaging mass."
  - id: cleaning_and_disinfection
    name: "Cleaning and disinfection"
    inclusion: "required"
    inclusion_condition: "Always include facility sanitation; record each chemical and thermal carrier only when actually used and assign shared cleaning records once."
    role: "Records sanitation water, electricity, steam, hot water, each fuel, each cleaning chemical, each chemical-specific wastewater, floor sweepings, and combustion emission separately."
    quantitative_reference: "Sanitation activity allocated to the 1 kg reference output."
  - id: onsite_wastewater_treatment
    name: "On-site wastewater treatment"
    inclusion: "conditional"
    inclusion_condition: "Include only when one or more named foreground wastewater streams are treated on site before discharge or transfer."
    role: "Treats each named wastewater input, records each treatment consumable, separates each sludge or grease output, and reports each final water or air emission individually."
    quantitative_reference: "Treatment activity and discharge allocated to the 1 kg reference output."
