allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Foreground multifunctionality"
    rule: "First seek process subdivision or a defensible expansion of the system. If multifunctionality remains, apply a documented physical relationship that reflects the underlying process; use mass only when it is the defensible relationship."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recovered_outputs
    applies_to: "Blood, hide, liver, heart, kidney, head, fat, bone, grease, or another recovered output"
    rule: "Classify each quantity once as a recovered product or as waste according to documented legal status and destination, then disclose the allocation method and sensitivity."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021-2279
  - rule_id: allocation_mass_balance
    applies_to: "Slaughter and cutting yields"
    rule: "Preserve a batch mass balance across accepted live mass, eligible meat, recovered outputs, condemned material, wastewater solids, and other measured losses without assigning the same mass twice."
    source_ids:
      - ec-jrc-sa-bref-jrc135916
      - eu-pef-2021-2279
  - rule_id: allocation_waste_treatment
    applies_to: "Waste and wastewater"
    rule: "Assign foreground collection and on-site treatment burdens to this product system; assign downstream treatment burdens according to the declared waste-boundary convention and disclose credits separately."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_reusable_packaging
    applies_to: "Reusable crate or wooden pallet"
    rule: "Use actual issue, return, lifetime, and replacement records to allocate only the consumed share to the declared product; disclose losses and reuse assumptions."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receipt_animal_mass
      process_id: "camelid_receipt_and_holding"
      flow_role: "Species-specific or material-specific mass exchange"
      record_type: "Weighbridge, calibrated scale, and batch mass record"
      raw_fields: "row_id; species_or_material; batch_id; gross_mass; tare_mass; net_mass; unit; scale_id; timestamp"
      collection_method: "Capture gross and tare mass on calibrated equipment, calculate net mass, and reconcile input, output, co-product, and reject lots by batch."
      unit: "kg"
      frequency: "Per batch with reporting-period reconciliation"
      temporal_coverage: "Continuous over the declared foreground reporting period"
      site_scope: "Foreground facility"
      aggregation_rule: "Sum only records assigned to this process and row_id, prevent double counting, then normalize to net qualified reference-product mass."
      quality_evidence: "Scale calibration; weigh tickets; batch ledger; mass-balance reconciliation"
    - protocol_id: cp_receipt_utilities
      process_id: "camelid_receipt_and_holding"
      flow_role: "Single water, electricity, heat, or fuel exchange"
      record_type: "Meter, invoice, tank, cylinder, and allocation record"
      raw_fields: "row_id; meter_or_stock_id; opening_reading; closing_reading; delivered_quantity; return_quantity; unit; allocation_driver; batch_id"
      collection_method: "Read each carrier separately; reconcile purchases and stocks; document any shared-meter allocation before normalization."
      unit: "m3, kWh, MJ, or kg as declared by the card"
      frequency: "Per batch with reporting-period reconciliation"
      temporal_coverage: "Continuous over the declared foreground reporting period"
      site_scope: "Foreground facility"
      aggregation_rule: "Sum only records assigned to this process and row_id, prevent double counting, then normalize to net qualified reference-product mass."
      quality_evidence: "Meter calibration; supplier invoice; stock reconciliation; allocation worksheet"
    - protocol_id: cp_receipt_waste_records
      process_id: "camelid_receipt_and_holding"
