system_boundary:
  rules:
    - rule_id: boundary_facility_operations
      applies_to: "foreground facility"
      rule: "Include all applicable onsite operations from receipt of source materials through conforming tomato juice release, including cleaning, packaging, onsite utility use, residual handling, and direct releases."
      source_ids:
        - fao-fruit-vegetable-processing-1995
        - us-ecfr-21-cfr-156-145
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased inputs"
      rule: "Link upstream datasets for tomatoes, concentrate, ingredients, packaging, water supply, fuels, electricity, and other purchased inputs; do not recreate their external production as foreground operations."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_concentrate_route
      applies_to: "from-concentrate production"
      rule: "Include concentration only when it occurs inside the declared foreground facility boundary; otherwise record purchased tomato juice concentrate as an input and disclose its upstream dataset."
      source_ids:
        - us-ecfr-21-cfr-156-145
    - rule_id: boundary_preservation_route
      applies_to: "preservation and filling"
      rule: "Include the actual thermal, chilled, or frozen preservation route and its monitored operations; do not substitute a generic thermal profile for the validated site process."
      source_ids:
        - fda-juice-haccp-2004
        - us-ecfr-21-cfr-156-145
    - rule_id: boundary_residual_treatment
      applies_to: "wastewater and solid residuals"
      rule: "Include onsite treatment and recovery as foreground processes. Record offsite treatment or recovery as waste or product flows linked to the applicable external datasets."
      source_ids:
        - iso-14044-2006
