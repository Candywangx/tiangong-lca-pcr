allocation_rules:
  - rule_id: allocation_avoid_subdivide
    applies_to: "multifunctional foreground operations"
    rule: "First seek process subdivision or expansion of separately measured operations so that tomato juice and recovered outputs receive directly attributable inputs and releases."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_physical_relation
    applies_to: "unavoidable joint processing"
    rule: "When subdivision is not practicable and a physical causal relationship can be justified, allocate remaining shared burdens using that documented physical relationship and report the factor and sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_other_relation
    applies_to: "no defensible physical relation"
    rule: "When no defensible physical relation exists, use another documented relationship consistent with the study goal, such as economic value, and disclose prices, reference period, calculation, and sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residual_status
    applies_to: "pomace, rejects, sludge, recovered materials, and energy"
    rule: "Do not assign coproduct status solely to avoid waste burdens. Record the actual destination and evidence of a useful product or service before applying coproduct allocation or substitution."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "raw_receipt_preparation"
      flow_role: "accepted source material, prepared tomatoes, and preparation rejects"
      record_type: "weighbridge, calibrated scale, receiving, and stock records"
      raw_fields: "timestamp; batch; supplier lot; gross; tare; net mass; acceptance status; stock change; destination"
      collection_method: "Reconcile accepted deliveries, preparation output, rejects, returns, and inventory"
      unit: "kg"
      frequency: "Each load or batch"
      temporal_coverage: "At least one representative continuous production period, normally 12 months where available"
      site_scope: "All included lines and storage points at the reporting facility"
      aggregation_rule: "Sum by product and route; subtract returns; reconcile opening and closing stock; normalize with calc_reference_normalization"
      quality_evidence: "Scale calibration, delivery tickets, batch records, stock reconciliation, and exception log"
    - protocol_id: cp_water_use
      process_id: "raw_receipt_preparation_formulation_reconstitution_preservation_packaging"
      flow_role: "washing, recipe, cleaning, cooling, and other water"
      record_type: "water meter, batch meter, or justified water balance"
      raw_fields: "meter id; opening and closing reading; batch; use area; recycled volume; discharge volume"
      collection_method: "Meter each material water use where practicable and separate recipe water from cleaning and utility water"
      unit: "m3 or kg"
      frequency: "Each batch or daily meter interval"
      temporal_coverage: "Same representative period as product output"
      site_scope: "All included water users"
      aggregation_rule: "Subtract documented recirculated internal water; aggregate by use and normalize with calc_reference_normalization"
      quality_evidence: "Meter calibration, meter map, batch sheet, and water-balance reconciliation"
    - protocol_id: cp_extraction_mass
      process_id: "juice_extraction_finishing"
      flow_role: "extraction feed, juice intermediate, and extraction residuals"
      record_type: "flowmeter, tank level, calibrated scale, and batch records"
      raw_fields: "batch; input mass; intermediate output mass; residual mass; stock change; rework"
      collection_method: "Measure transfers and reconcile the extraction mass balance"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same representative period as product output"
      site_scope: "All included extraction and finishing lines"
      aggregation_rule: "Sum accepted transfers; account for rework once; reconcile stock change and normalize"
      quality_evidence: "Instrument calibration, batch sheet, and signed mass-balance review"
    - protocol_id: cp_recipe_inputs
      process_id: "formulation_reconstitution"
      flow_role: "concentrate, extracted juice, water, salt, acid, other ingredients, and conditioned juice"
      record_type: "recipe system, batch scale, laboratory, and supplier lot records"
      raw_fields: "batch; ingredient identity; lot; quantity; soluble-solids result; recipe revision; output mass; loss; stock change"
      collection_method: "Record each addition and verify the finished product against the declared recipe and product specification"
      unit: "kg and declared laboratory unit"
      frequency: "Each batch"
      temporal_coverage: "Same representative period as product output"
      site_scope: "Every included formulation tank and product variant"
      aggregation_rule: "Aggregate by product variant; calculate with calc_reconstitution_balance; normalize"
      quality_evidence: "Scale calibration, recipe authorization, certificates, laboratory results, and deviation records"
    - protocol_id: cp_metered_energy
      process_id: "juice_extraction_finishing_preservation_packaging_onsite_residuals_treatment"
      flow_role: "electricity, steam, hot water, fuels, refrigeration, and compressed air"
      record_type: "submeter, utility invoice, fuel issue, and operating-hour record"
      raw_fields: "meter id; opening and closing reading; fuel mass or volume; heating value; operating time; allocation driver"
      collection_method: "Prefer submeters; otherwise allocate facility totals with documented operating or engineering evidence"
      unit: "kWh or MJ"
      frequency: "Continuous, batch, shift, or invoice interval"
      temporal_coverage: "Same representative period as product output"
      site_scope: "All included equipment and shared utilities"
      aggregation_rule: "Convert with documented factors; subtract exports; allocate shared use transparently; normalize"
      quality_evidence: "Meter calibration, invoices, fuel specifications, equipment logs, and allocation calculation"
    - protocol_id: cp_packaging_mass
      process_id: "preservation_packaging"
      flow_role: "packaging issued, returned, rejected, and incorporated"
      record_type: "bill of materials, count, supplier unit mass, and scale record"
      raw_fields: "component; material; count; unit mass; issued; returned; rejected; reuse cycles"
      collection_method: "Calculate each component mass from verified count and unit mass or direct measurement"
      unit: "kg"
      frequency: "Each packaging lot or product batch"
      temporal_coverage: "Same representative period as product output"
      site_scope: "Primary, secondary, tertiary, and reusable packaging in scope"
      aggregation_rule: "Issued minus returned stock; separate product packaging from scrap; normalize"
      quality_evidence: "Supplier specification, sampled unit-mass check, bill of materials, and stock record"
    - protocol_id: cp_product_output
      process_id: "preservation_packaging"
      flow_role: "preservation feed, conforming net tomato juice, off-specification product, and rework"
      record_type: "batch meter, filler count, checkweigher, tank record, and release record"
      raw_fields: "batch; product code; route; gross; tare; net mass; package count; released mass; off-spec mass; rework; stock change"
      collection_method: "Measure conforming net product separately from packaging and reconcile preservation and filling outputs"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same representative period as all inventory inputs"
      site_scope: "Every included product and filling line"
      aggregation_rule: "Sum released net mass; exclude packaging; account for rework once; normalize to 1,000 kg"
      quality_evidence: "Instrument calibration, quality release, checkweigher results, batch record, and reconciliation"
    - protocol_id: cp_waste_records
      process_id: "all_foreground_processes"
      flow_role: "rejects, pomace, off-specification product, packaging scrap, wastewater, and other waste"
      record_type: "scale, waste manifest, meter, invoice, and internal transfer record"
      raw_fields: "waste identity; origin; mass or volume; destination; date; carrier; recovery status; stock change"
      collection_method: "Measure or reconcile each material waste stream and destination"
      unit: "kg or m3"
      frequency: "Each dispatch, batch, or meter interval"
      temporal_coverage: "Same representative period as product output"
      site_scope: "All included foreground processes"
      aggregation_rule: "Sum by identity and destination; prevent duplicate internal transfers; normalize"
      quality_evidence: "Scale or meter calibration, manifests, invoices, treatment receipts, and stock records"
    - protocol_id: cp_thermal_process
      process_id: "preservation_packaging"
      flow_role: "actual preservation process and release evidence"
      record_type: "validated process schedule, temperature, time, flow, pressure, and deviation records"
      raw_fields: "process authority or validation reference; product; pH or relevant property; temperature; residence time; flow rate; hold; deviation; disposition"
      collection_method: "Retain the site- and product-specific validated schedule and continuous or batch monitoring required by the selected process"
      unit: "Declared process units"
      frequency: "Each batch with continuous records where applicable"
      temporal_coverage: "Same representative period as product output and current validated process"
      site_scope: "Every included preservation line and product route"
      aggregation_rule: "No averaging across failed critical limits; link each released batch to valid monitoring and deviation disposition"
      quality_evidence: "Validation study or process authority record, calibrated sensors, monitoring charts, deviation and release records"
    - protocol_id: cp_treatment_records
      process_id: "onsite_residuals_treatment"
      flow_role: "received residuals, treatment inputs, recovered outputs, sludge, and stored material"
      record_type: "meter, scale, treatment log, laboratory, dispatch, and stock record"
      raw_fields: "stream identity; input; chemical; electricity; output; quality; destination; stock change"
      collection_method: "Reconcile each treatment operation and retain evidence for recovered product status"
      unit: "kg, m3, kWh, or MJ"
      frequency: "Each batch, day, or dispatch"
      temporal_coverage: "Same representative period as product output"
      site_scope: "All onsite residual treatment and recovery"
      aggregation_rule: "Sum inputs and outputs; reconcile stock and moisture basis; normalize"
      quality_evidence: "Meter and scale calibration, laboratory reports, treatment logs, recipient evidence, and manifests"
    - protocol_id: cp_direct_emissions
      process_id: "preservation_packaging_onsite_residuals_treatment"
      flow_role: "refrigerants, treated effluent, and measured direct releases"
      record_type: "service record, charge balance, stack or effluent monitoring, and permit record"
      raw_fields: "substance; compartment; measured value; method; detection limit; equipment; charge added or recovered; effluent volume; sampling period"
      collection_method: "Record each substance and compartment separately using measured or permitted-monitoring evidence"
      unit: "kg or m3"
      frequency: "Per event and reporting interval"
      temporal_coverage: "Same representative period as product output"
      site_scope: "All included direct release points"
      aggregation_rule: "Apply documented sampling and allocation method; report below-detection treatment; normalize"
      quality_evidence: "Laboratory accreditation where applicable, calibration, service records, permits, and calculation file"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory amount"
      rule: "normalized amount = period or batch amount / conforming net tomato juice output × 1,000 kg"
      inputs:
        - "collected amount"
        - "conforming net product mass"
      output: "amount per 1,000 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_process_mass_balance
      applies_to: "each foreground process"
      rule: "measured inputs + opening stock = measured outputs + closing stock + quantified loss; report the unexplained difference and do not force it to zero"
      inputs:
        - input
        - output
        - stock
        - rework
        - "and loss records"
      output: "reconciled mass balance and unexplained difference"
      source_ids:
        - mass-balance-identity
    - id: calc_reconstitution_balance
      applies_to: "from-concentrate and formulation routes"
      rule: "conditioned juice mass = measured tomato input + measured recipe water + measured ingredients + eligible returns - measured losses, adjusted for stock change; verify the declared product specification from measured laboratory and recipe records"
      inputs:
        - "recipe inputs"
        - returns
        - losses
        - "stock change"
        - "laboratory results"
      output: "conditioned juice mass and specification check"
      source_ids:
        - mass-balance-identity
        - us-ecfr-21-cfr-156-145
    - id: calc_energy_conversion
      applies_to: "energy records"
      rule: "convert electricity to kWh and delivered fuel or heat to MJ using retained supplier or measured conversion data; do not assume an efficiency or heating value"
      inputs:
        - "meter readings"
        - "fuel quantity"
        - "heating value"
        - "conversion factor"
      output: "kWh or MJ by process"
      source_ids: []
    - id: calc_packaging_mass
      applies_to: "packaging materials and scrap"
      rule: "component mass = verified component count × verified unit mass; reconcile issued, returned, incorporated, and rejected components"
      inputs:
        - counts
        - "sampled or supplier unit mass"
        - "stock movement"
      output: "packaging and packaging-scrap mass by material"
      source_ids: []
    - id: calc_allocation_factor
      applies_to: "unavoidable shared burdens"
      rule: "calculate the selected physical or other relationship from period-matched records and document sensitivity to a reasonable alternative"
      inputs:
        - "separately attributable burdens"
        - "coproduct quantities"
        - "selected allocation driver"
      output: "allocation factor and sensitivity result"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and source materials"
      requirement: "Verify product name, UUID for the reference flow, production route, recipe, product specification, preservation state, and package or bulk state."
      evidence: "Tiangong flow readback, batch specification, label or sales specification, and release record"
    - id: dq_representativeness
      applies_to: "all foreground data"
      requirement: "State geography, technology, facility, reference period, seasonal coverage, capacity utilization, and material product variants; justify any proxy period or site."
      evidence: "Dataset metadata, production schedule, site description, and variance review"
    - id: dq_completeness
      applies_to: "process map and inventory"
      requirement: "Cover every required process and every applicable conditional process; reconcile material, water, energy, waste, and direct-release records without double counting internal transfers."
      evidence: "Process flow diagram, meter map, mass and water balances, inventory reconciliation, and gap log"
    - id: dq_measurement
      applies_to: "collected and calculated values"
      requirement: "Retain instrument identity, calibration or verification status, raw units, conversion factors, aggregation, and data owner."
      evidence: "Calibration certificates, raw exports, calculation workbook, and signed review"
    - id: dq_thermal_validation
      applies_to: "preservation and filling"
      requirement: "Link each released product route to the current validated process and retain critical monitoring and deviation disposition; generic time-temperature values are not a substitute for route-specific validation."
      evidence: "Validated process schedule, process authority or equivalent evidence, monitoring records, deviations, and release approval"
    - id: dq_provisional_ranges
      applies_to: "every reasoned_estimate range"
      requirement: "Treat the range only as a broad screening or QA prior. Replace it with foreground measurements or reviewed source evidence before publication-critical use and explain deviations rather than clipping data."
      evidence: "Range replacement log, foreground records, reviewed source, and reviewer disposition"
    - id: dq_unresolved_uuid
      applies_to: "non-reference inventory flows"
