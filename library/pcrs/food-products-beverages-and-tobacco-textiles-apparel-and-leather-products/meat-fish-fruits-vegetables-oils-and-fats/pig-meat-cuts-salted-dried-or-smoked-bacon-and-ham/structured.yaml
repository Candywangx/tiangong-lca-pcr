    - id: dq_temporal_coverage
      applies_to: "foreground records"
      requirement: "Cover a representative continuous 12-month period or justify a shorter campaign for seasonal or infrequent products; disclose abnormal production and shutdowns."
      evidence: "Date-stamped records and representativeness statement"
    - id: dq_measurement
      applies_to: "meters, scales, laboratory data"
      requirement: "Use calibrated equipment and retain method, frequency, detection limit, missing-data treatment, and uncertainty for measured utilities and emissions."
      evidence: "Calibration, laboratory QA, maintenance, and missing-data logs"
    - id: dq_source_and_factor
      applies_to: "calculated values"
      requirement: "Retain the exact source, version, applicability, unit conversion, and control state for every external factor; a source used only for process decomposition cannot supply an amount."
      evidence: "Calculation workbook and original source"
    - id: dq_range_evidence
      applies_to: "all important flows"
      requirement: "Do not author an empirical range from a single case or one point. A future inferred range requires at least two independent verified originals with compatible boundary, unit, and normalization basis."
      evidence: "Range evidence review; unresolved-range register"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "Confirm 1 kg net reference product, Mass UUID, Units of mass UUID, kg, and all required qualifiers; fail if a narrower bacon-only, ham-only, or broader processed-meat UUID is substituted for unresolved CPC 21181 identity."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: validate_route_exclusivity
    applies_to: "process_map"
    rule: "Require exactly one of dry_cure, brine_injection, or brine_immersion. Reject cooking outside cooked ham, smoking outside a smoked route, drying or ripening outside a dried route, or slicing outside a sliced product route."
    source_ids:
      - usda-fsis-bacon-food-safety
      - usda-fsis-hams-food-safety
      - usda-fsis-rte-salt-cured-dried-2023
  - rule_id: validate_atomic_inventory
    applies_to: "process_inventory"
    rule: "Reject any combined ingredient, energy-carrier, fuel, refrigerant, packaging, waste, wastewater, sludge, or emission collection row; every selected flow must resolve to one Tiangong flow before publication."
    source_ids:
      - eu-commission-pef-2021-2279
  - rule_id: validate_recipe_completeness
    applies_to: "curing"
    rule: "Match every declared recipe ingredient to one input row and active mass record, including salt, nitrite, nitrate, sugar, each spice, ascorbate, phosphate, and any additional ingredient."
    source_ids:
      - usda-fsis-bacon-food-safety
      - usda-fsis-hams-food-safety
      - fao-who-codex-cxc-58-2005
  - rule_id: validate_smoke_inventory
    applies_to: "smoking"
    rule: "For natural-smoke routes require smoke-material identity and assess PM2.5, carbon monoxide, acrolein, acetaldehyde, formaldehyde, acetic acid, nitrogen oxides, sulfur oxides, and benzo[a]pyrene individually; record measurement, calculation, not-applicable basis, or disclosed data gap for each."
    source_ids:
      - us-epa-ap42-meat-smokehouses-1995
      - fao-who-codex-cxc-68-2009
  - rule_id: validate_mass_balance
    applies_to: "each_material_process"
    rule: "Check batch and annual mass-balance residuals and trace all co-products, purge, drip, rejects, wastewater, sludge, and packaging waste to destinations."
    source_ids:
      - mass-balance-identity
      - eu-commission-pef-2021-2279
  - rule_id: validate_data_quality
    applies_to: "foreground_dataset"
    rule: "Verify route, technological, geographical, and temporal representativeness; calibrated measurement; documented allocation; source applicability; and separation of foreground records from external evidence."
    source_ids:
      - eu-commission-pef-2021-2279
      - fao-who-codex-cxc-58-2005
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset derived from a completed, reviewed foreground data package"
  downstream_use: "Process and lifecycle-model construction for pig meat cuts preserved by the declared salted, dried, or smoked route at the factory gate"
  allowed_use: "The represented product form, pig cut, curing method, conditional process route, recipe, packaging, geography, technology, reference period, and storage condition"
  excluded_use: "Unrepresented curing or preservation routes; fresh pig meat; sausages or comminuted products; non-pig meat; consumer cooking; distribution; substitution of unresolved or approximate UUIDs"
  required_metadata: "PCR id and version; product and route qualifiers; reference flow; geography; reference period; technology; site coverage; allocation drivers; upstream links; data sources; UUID resolution status"
  required_quality_disclosure: "Data coverage and gaps; mass-balance residuals; meter and laboratory quality; source and factor applicability; route shares if averaged; co-product treatment; wastewater route; emission and refrigerant gaps; absence of qualified ranges"
  update_trigger: "Change in product scope, curing method, recipe, cooking, smoking or drying technology, packaging, refrigeration system, wastewater route, allocation driver, geography, representative period, regulation, or confirmed Tiangong identity"
