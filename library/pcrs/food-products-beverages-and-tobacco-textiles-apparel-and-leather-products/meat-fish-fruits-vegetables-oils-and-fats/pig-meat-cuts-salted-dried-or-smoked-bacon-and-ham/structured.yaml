  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "all_inventory_rows"
      rule: "normalized amount = route-attributable amount / net kg of conforming reference product after declared storage"
      inputs:
        - "atomic exchange amount"
        - "packaged_refrigerated_product net mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-commission-pef-2021-2279
    - id: calc_mass_reconciliation
      applies_to: "each_material_process"
      rule: "input mass = product outputs + co-products + wastes + measured purge or drip + documented inventory change; investigate residuals rather than assigning them to an invented flow"
      inputs:
        - "all mass rows for the batch"
      output: "batch mass-balance residual and completeness finding"
      source_ids:
        - mass-balance-identity
    - id: calc_active_ingredient
      applies_to: "nitrite_nitrate_ascorbate_phosphate_and_cleaners"
      rule: "active substance mass = formulated product mass × documented active fraction"
      inputs:
        - "issued product mass"
        - "supplier active fraction"
      output: "active ingredient mass"
      source_ids:
        - eu-commission-pef-2021-2279
    - id: calc_refrigerant_leak
      applies_to: "each_refrigerant"
      rule: "leakage = beginning charge + additions − recovered amount − ending charge − documented transfers; allocate the result using the refrigeration service driver"
      inputs:
        - "refrigerant inventory and service records"
      output: "kg of one named refrigerant to air"
      source_ids:
        - eu-commission-pef-2021-2279
    - id: calc_effluent_load
      applies_to: "each_direct_water_pollutant"
      rule: "discharged load = measured concentration × direct-discharge volume, with unit and density conversion documented"
      inputs:
        - "pollutant concentration"
        - "discharge volume"
      output: "kg pollutant to water"
      source_ids:
        - eu-jrc-fdm-bref-2019
        - eu-commission-pef-2021-2279
    - id: calc_smoke_emission
      applies_to: "each_smoke_pollutant"
      rule: "pollutant mass = measured stack concentration × dry gas flow × test duration, or activity data × one documented smokehouse-specific factor; never apply one factor to a different pollutant or control state"
      inputs:
        - "pollutant-specific stack or activity record"
      output: "kg of one named pollutant to air"
      source_ids:
        - us-epa-ap42-meat-smokehouses-1995
        - eu-commission-pef-2021-2279
  data_quality_requirements:
    - id: dq_route_identity
      applies_to: "product and process map"
      requirement: "Document one curing method and the actual cooking, smoking, drying, slicing, packaging, and refrigeration route; no mutually exclusive process may be silently averaged in."
      evidence: "Batch route declaration, recipe, equipment records, product specification"
    - id: dq_atomic_bill_of_materials
