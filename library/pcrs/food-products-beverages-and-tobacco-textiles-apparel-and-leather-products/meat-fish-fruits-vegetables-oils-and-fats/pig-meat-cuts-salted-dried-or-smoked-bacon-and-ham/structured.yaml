allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "all_shared_operations"
    rule: "First subdivide route-specific processing and directly metered utilities, sanitation, refrigeration, packaging, waste, and emissions. Do not allocate excluded or non-applicable routes to the reference product."
    source_ids:
      - eu-commission-pef-2021-2279
  - rule_id: allocation_physical_driver
    applies_to: "shared_facility_inputs"
    rule: "When subdivision is not possible, allocate shared electricity, steam, heat, natural gas, water, sanitation, and storage using a documented physical driver that reflects causality, such as submetered operating time, equipment load, product mass-time, or occupied refrigerated volume-time."
    source_ids:
      - eu-commission-pef-2021-2279
  - rule_id: allocation_trimming_coproducts
    applies_to: "edible_pork_fat_trimmings_and_edible_pork_skin_trimmings"
    rule: "Keep saleable edible fat and skin as separate co-product outputs. Prefer process subdivision; if residual burdens remain, document the physical relationship or other justified allocation basis and disclose factors. Do not treat saleable co-products as zero-burden waste."
    source_ids:
      - eu-commission-pef-2021-2279
  - rule_id: allocation_rework_and_rejects
    applies_to: "off_specification_product"
    rule: "Return rework to the originating process without creating avoided product; track repeated inputs and losses. Assign treatment burdens and credits only to the documented final destination of rejected material."
    source_ids:
      - fao-who-codex-cxc-58-2005
      - eu-commission-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_receipt_trimming
      process_id: "receipt_trimming"
      flow_role: "received meat, trimmed product, co-products, trimmings, rejects"
      record_type: "weighbridge, scale, lot disposition"
      raw_fields: "lot_id; cut; received_state; gross_mass; tare; accepted_mass; trimmed_mass; each output mass; destination"
      collection_method: "Calibrated scales reconciled to lot and disposition records"
      unit: "kg"
      frequency: "Every lot or batch"
      temporal_coverage: "Representative production year, including seasonal products"
      site_scope: "All sites in dataset scope"
      aggregation_rule: "Sum each atomic exchange; normalize to reference output; reconcile input to outputs and recorded loss"
      quality_evidence: "Calibration certificates; supplier lots; disposition records; mass-balance reconciliation"
    - protocol_id: cp_dry_curing
      process_id: "dry_curing"
      flow_role: "meat, each dry ingredient, cured output, purge, spent cure, reject"
      record_type: "recipe issue, scale, batch sheet"
      raw_fields: "batch_id; ingredient_identity; active_concentration; issued_mass; returned_mass; meat_in; product_out; purge; spent_cure; reject; cure_time; cure_temperature"
      collection_method: "Calibrated weighing and batch reconciliation"
      unit: "kg"
      frequency: "Every batch"
      temporal_coverage: "Representative production year"
      site_scope: "Every dry-cure line and site"
      aggregation_rule: "Sum each ingredient and output separately; normalize by reference output"
      quality_evidence: "Approved formula; scale calibration; batch sheet; cure-control records"
    - protocol_id: cp_brine_curing
