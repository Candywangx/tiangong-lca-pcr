allocation_rules:
  - rule_id: al_avoid_allocation
    applies_to: "shared preparation, freezing, storage, and utilities"
    rule: "Prefer subdivision, direct metering, batch records, or physically meaningful process separation so that burdens are assigned without allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: al_internal_recycling
    applies_to: "rework, recirculated water, recovered refrigerant, and internally reused intermediates"
    rule: "Treat internal loops as internal exchanges; record make-up inputs, purge or loss outputs, and the energy needed for recovery, and do not credit the same recovered material twice."
    source_ids:
      - mass-balance-identity
  - rule_id: al_joint_products
    applies_to: "marketable co-products produced with frozen beans"
    rule: "If allocation cannot be avoided, use a documented physical relationship that reflects causality. If no defensible physical relationship exists, use economic allocation based on a representative twelve-month price period and disclose price sources, volatility, and a physical-allocation sensitivity result."
    source_ids:
      - iso-14044-2006
  - rule_id: al_waste_treatment
    applies_to: "residues and nonconforming product sent to treatment or recovery"
    rule: "Record the waste flow at the facility gate and apply the chosen treatment or recovery convention consistently; disclose any avoided-product credit and prevent overlap with treatment-provider datasets."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving_preparation_records
      process_id: "receiving_and_preparation"
      flow_role: "fresh beans, prepared beans, water, electricity, residues, and wastewater"
      record_type: "receiving, production, meter, and waste records"
      raw_fields: "lot id; species/type; supplier; incoming mass; accepted mass; prepared mass; water intake; recycled water; discharge; electricity; residue mass; destination; timestamps"
      collection_method: "calibrated scales, calibrated water and electricity meters, batch records, and waste transfer records"
      unit: "kg; m3; kWh"
      frequency: "per lot or batch with monthly meter reconciliation"
      temporal_coverage: "representative production period, normally at least 12 consecutive months or the full seasonal campaign"
      site_scope: "all lines and shifts producing the declared product at the facility"
      aggregation_rule: "sum attributable records, reconcile inventory change, allocate shared meters by documented causal driver, then normalize to net reference output"
      quality_evidence: "calibration certificates, meter identifiers, lot traceability, reconciliation, and signed waste records"
    - protocol_id: cp_blanching_cooling_records
      process_id: "blanching_and_cooling"
      flow_role: "bean transfer, thermal energy, water, wastewater, time, and temperature"
      record_type: "batch, meter, boiler or heat-supply, and temperature records"
      raw_fields: "batch id; input/output mass; blanch time; blanch temperature; cooling condition; steam/heat/fuel; make-up water; recycled water; discharge; timestamps"
      collection_method: "calibrated scales and temperature sensors, energy and water meters, and batch-control export"
      unit: "kg; °C; s or min; MJ; m3"
      frequency: "per batch for mass and temperature; continuous or shift meter readings with monthly reconciliation"
      temporal_coverage: "representative production period, normally at least 12 consecutive months or the full seasonal campaign"
      site_scope: "all relevant blanchers, coolers, lines, and shifts"
      aggregation_rule: "reconcile batch mass and utility meters; allocate shared utilities by measured run time, throughput, or heat duty; normalize to stage output and reference flow"
      quality_evidence: "sensor and meter calibration, batch completeness, utility reconciliation, and deviation records"
    - protocol_id: cp_quick_freezing_records
      process_id: "quick_freezing"
      flow_role: "freezer feed, freezer output, electricity, and product temperature"
      record_type: "batch, meter, freezer-control, and temperature records"
      raw_fields: "batch id; feed mass; conforming output mass; electricity; freezer technology; air set point; thermal-centre measurement; stabilization time; excursion record"
      collection_method: "calibrated scales, submeter or defensible meter allocation, and calibrated product-temperature probe or validated equivalent method"
      unit: "kg; kWh; °C; min"
      frequency: "per batch for mass and thermal-centre verification; continuous or shift electricity data"
      temporal_coverage: "representative production period, normally at least 12 consecutive months or the full seasonal campaign"
      site_scope: "every freezer and shift producing the declared product"
      aggregation_rule: "reconcile feed and output mass; allocate freezer electricity by metered line use or throughput-time; normalize to conforming output"
      quality_evidence: "scale and temperature-probe calibration, meter coverage, control-system export, and excursion disposition"
    - protocol_id: cp_refrigerant_inventory_records
      process_id: "quick_freezing"
      flow_role: "refrigerant make-up and emission"
      record_type: "refrigeration-system inventory and maintenance records"
      raw_fields: "refrigerant identity; opening charge; additions; recovery; transfer; closing charge; service date; leak event; connected equipment; frozen throughput"
      collection_method: "annual or campaign mass-balance reconciliation supported by purchase, recovery, and maintenance records"
      unit: "kg"
      frequency: "each service event with annual or campaign reconciliation"
      temporal_coverage: "same reporting period as production data"
      site_scope: "all refrigeration systems serving freezing and included frozen storage"
      aggregation_rule: "unrecovered loss = opening charge + additions - recovery - transfers - closing charge; allocate once by metered refrigeration duty or documented throughput-time"
      quality_evidence: "invoices, service logs, recovery records, charge inventory, and reconciliation sign-off"
    - protocol_id: cp_packaging_storage_records
      process_id: "packaging_and_frozen_storage"
      flow_role: "bulk frozen input, packaging, storage electricity, finished product, and wastes"
      record_type: "packaging issue, production, warehouse, dispatch, meter, and waste records"
      raw_fields: "batch id; product input/output mass; packaging material and mass; packaging inventory; storage entry/exit; storage duration; air and product temperatures; electricity; waste mass; destination"
      collection_method: "calibrated scales, packaging inventory records, warehouse-management timestamps, calibrated temperature monitoring, electricity meters, and waste records"
      unit: "kg; kWh; °C; day"
      frequency: "per batch or dispatch; continuous temperature; monthly electricity reconciliation"
      temporal_coverage: "representative production period, normally at least 12 consecutive months or the full seasonal campaign"
      site_scope: "all packaging lines and frozen stores serving the declared product"
      aggregation_rule: "reconcile product and packaging balances; allocate storage electricity by occupied capacity-time or measured refrigeration duty; normalize to net dispatched product"
      quality_evidence: "scale and sensor calibration, inventory reconciliation, dispatch traceability, temperature logs, and excursion disposition"
  calculation_rules:
    - id: cr_reference_normalization
      applies_to: "all foreground exchanges"
      rule: "normalized amount = attributable exchange amount / net conforming frozen beans dispatched, then multiply by 1 kg reference flow"
      inputs:
        - "attributable exchange amount"
        - "net conforming dispatched mass"
      output: "exchange amount per 1 kg reference frozen beans"
      source_ids:
        - mass-balance-identity
    - id: cr_stage_mass_balance
      applies_to: "each process stage"
      rule: "mass-balance residual = total mass inputs - product outputs - waste outputs - measured water removal or addition - inventory change; investigate and disclose material residuals rather than forcing them to zero"
      inputs:
        - "calibrated mass and water records"
        - "inventory change"
      output: "stage yield, losses, and residual"
      source_ids:
        - mass-balance-identity
    - id: cr_shared_utility_allocation
      applies_to: "shared electricity, heat, water, and cold storage"
      rule: "allocate shared totals using the most causal measured driver available, in order: submetered use, equipment run-time multiplied by measured load, mass-throughput time, or occupied capacity-time; disclose the chosen driver"
      inputs:
        - "shared meter total"
        - "driver measurements"
        - "production output"
      output: "attributable utility amount"
      source_ids:
        - iso-14044-2006
    - id: cr_refrigerant_loss
      applies_to: "connected refrigeration systems"
      rule: "unrecovered refrigerant loss = opening charge + additions - recovery - transfers - closing charge; allocate the result once across products served by the system"
      inputs:
        - "charge inventory"
        - purchases
        - recovery
        - transfers
        - "throughput or refrigeration-duty driver"
      output: "kg refrigerant emitted per reference flow"
      source_ids:
        - mass-balance-identity
    - id: cr_storage_duration
      applies_to: "frozen-storage electricity"
      rule: "storage allocation driver = occupied product mass × storage duration; allocate common storage electricity by the declared driver unless direct metering is available"
      inputs:
        - "warehouse entry/exit timestamps"
        - "occupied mass"
        - "electricity meter"
      output: "kWh storage electricity per reference flow and declared duration"
      source_ids:
        - codex-cxc-8-1976
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "product and reference flow"
      requirement: "Trace every reported lot to species or commercial type, pod or seed form, cut style, additives, package format, facility, production period, and the exact Tiangong reference-flow UUID."
      evidence: "lot genealogy, product specification, label, and dataset metadata"
    - id: dq_measurement_control
      applies_to: "mass, utilities, temperature, and refrigerant"
      requirement: "Use identified instruments within calibration; document estimation for gaps and prohibit an undocumented freezer set point from replacing product thermal-centre evidence."
      evidence: "calibration certificates, meter coverage map, gap log, and thermal-centre records"
    - id: dq_temporal_representativeness
      applies_to: "foreground activity data"
      requirement: "Cover at least 12 consecutive months where year-round operation exists, or the complete declared seasonal campaign; disclose abnormal shutdowns, crop-season effects, and storage-duration distribution."
      evidence: "dated production, meter, warehouse, and dispatch records"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Reconcile fresh-bean input, conforming output, residues, wastewater, packaging, energy, and refrigerant records; explain every excluded process and every material balance residual."
      evidence: "reconciliation workbook, exclusion register, and signed review"
    - id: dq_provider_alignment
      applies_to: "upstream and treatment datasets"
      requirement: "Match geography, technology, time, bean production route, electricity mix, packaging material, water supply, refrigerant, and treatment route where material; disclose proxies and sensitivity."
      evidence: "provider-dataset metadata and proxy register"
    - id: dq_cold_chain
      applies_to: "quick freezing and in-plant storage"
      requirement: "Retain continuous air-temperature monitoring and periodic or validated equivalent product-temperature evidence, with calibration and documented disposition of excursions."
      evidence: "temperature logs, probe calibration, alarm history, and corrective-action records"
validation_rules:
  - rule_id: vr_reference_identity
    applies_to: "reference flow"
    rule: "The reference product UUID must be d6a6b877-75b8-48c5-b219-857c70de3e3d, the flow property UUID must be 93a60a56-a3c8-11da-a746-0800200b9a66, the unit-group UUID must be 93a60a57-a4c8-11da-a746-0800200c9a66, and the normalized reference amount must equal 1 kg net frozen beans."
    source_ids: []
  - rule_id: vr_scope_qualifiers
    applies_to: "product identity"
    rule: "Reject the data package as incomplete when species or commercial type, pod or seed form, cut style, blanching status, additives, freezing technology, packaging format, facility gate, production period, storage duration, or product-temperature basis is missing."
    source_ids:
      - codex-cxs-320-2015
      - usda-frozen-green-wax-beans-1996
      - usda-frozen-lima-beans-2013
  - rule_id: vr_process_completeness
    applies_to: "process inventory"
    rule: "Require all four declared foreground processes and require explicit zero, not-applicable, or exclusion evidence for every prescribed flow that does not occur."
    source_ids:
      - codex-cxs-320-2015
      - codex-cxc-8-1976
  - rule_id: vr_temperature_condition
    applies_to: "quick freezing and in-plant cold chain"
    rule: "Require evidence that the thermal centre reached -18 °C or colder after stabilization and that frozen storage was maintained at -18 °C or colder subject to declared permitted tolerances; flag undocumented excursions as nonconforming."
    source_ids:
      - codex-cxs-320-2015
      - codex-cxc-8-1976
  - rule_id: vr_mass_balance
    applies_to: "each process and total foreground"
    rule: "Require documented input-output reconciliation for each stage and the total foreground; fail validation when a material residual is neither corrected nor explained."
    source_ids:
      - mass-balance-identity
  - rule_id: vr_allocation_disclosure
    applies_to: "shared utilities and co-products"
    rule: "Require the allocation hierarchy, driver, allocation factors, co-product treatment, price period when used, and sensitivity result to be present and internally consistent."
    source_ids:
      - iso-14044-2006
  - rule_id: vr_no_double_counting
    applies_to: "utilities, refrigerant, internal recycling, and waste treatment"
    rule: "Ensure that purchased heat and on-site fuel, refrigerant make-up and direct loss, internal recycling and make-up, and foreground treatment and provider treatment are not counted twice."
    source_ids:
      - mass-balance-identity
      - iso-14044-2006
  - rule_id: vr_data_coverage
    applies_to: "foreground records"
    rule: "Require declared temporal, site, line, and shift coverage plus calibration evidence and a documented treatment for missing records before the dataset is used as reviewed background data."
    source_ids:
      - codex-cxc-8-1976
published_dataset_profile:
  dataset_role: "unit_process foreground dataset"
  downstream_use: "secondary_dataset; background_dataset after methodology and data review"
  allowed_use: "frozen-bean production models matching the declared product form, preparation route, freezing technology, facility gate, geography, period, packaging, and storage duration"
  excluded_use: "fresh, dried, canned, mixed, seasoned, or cooked bean products; cultivation-only datasets; downstream cold-chain or consumer-use models without an explicitly extended boundary"
  required_metadata: "canonical PCR id; Tiangong reference-flow UUID; species or commercial type; pod or seed form; cut style; blanching status; additives; freezing technology; package format; net mass basis; facility; geography; production period; storage duration; temperature evidence; allocation method; provider dataset references"
  required_quality_disclosure: "foreground-record coverage; instrument calibration; mass and water balance; energy-meter allocation; refrigerant reconciliation; temperature excursions; product losses; proxy providers; reasoned-estimate screening results; data-quality review status"
  update_trigger: "material change in bean scope, preparation or blanching route, freezer or refrigerant technology, packaging, storage duration, facility geography, energy supply, allocation, data coverage, quality specification, or controlling external standard"
