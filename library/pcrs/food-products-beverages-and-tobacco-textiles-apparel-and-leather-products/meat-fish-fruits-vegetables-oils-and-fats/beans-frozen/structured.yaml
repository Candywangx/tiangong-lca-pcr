system_boundary:
  rules:
    - rule_id: sb_foreground_gate
      applies_to: "default foreground system"
      rule: "Include fresh-bean receiving, trimming or shelling where applicable, washing, sorting, cutting where applicable, blanching and cooling, draining or dewatering, quick freezing, packaging or bulk containment, in-plant frozen storage, product losses, wastewater, and direct site emissions through dispatch from the facility gate."
      source_ids:
        - codex-cxs-320-2015
        - usda-frozen-green-wax-beans-1996
        - usda-frozen-lima-beans-2013
    - rule_id: sb_cold_chain_condition
      applies_to: "freezing and in-plant cold chain"
      rule: "Demonstrate that quick freezing passes the maximum-crystallization range rapidly, reaches -18 °C or colder at the product thermal centre after stabilization, and maintains the product at -18 °C or colder subject to declared permitted tolerances; retain temperature-monitoring and excursion records."
      source_ids:
        - codex-cxs-320-2015
        - codex-cxc-8-1976
    - rule_id: sb_upstream_links
      applies_to: "supplies entering the foreground"
      rule: "Keep cultivation, inbound transport, packaging production, energy supply, water supply, and refrigerant production outside the foreground only when linked provider datasets represent them; disclose missing or proxy providers."
      source_ids:
        - iso-14044-2006
    - rule_id: sb_waste_and_emissions
      applies_to: "residues, wastewater, packaging waste, refrigerants, and combustion"
      rule: "Record every material waste output and direct elementary emission that crosses the foreground boundary. Link external treatment datasets and avoid counting the same treatment burden in both the foreground and a provider dataset."
      source_ids:
        - iso-14044-2006
    - rule_id: sb_downstream_exclusion
      applies_to: "activities after facility dispatch"
      rule: "Exclude downstream distribution, retail storage, cooking, consumption, and end-of-life from the default system; include them only in an explicitly extended study and report them separately from this foreground result."
      source_ids:
        - iso-14044-2006
