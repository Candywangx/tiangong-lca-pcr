    rule: "Avoid allocation by subdividing route, line, batch and presentation inventories. Do not allocate a combined multi-route inventory to the reference product when route-specific records can be obtained."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_co_products
    applies_to: "Marketed shell, meat, residual or other co-product"
    rule: "First seek process subdivision or a documented physical causal relationship. If this is not feasible, use an economic relationship based on contemporaneous net revenue and report prices, period and sensitivity; do not assign zero burden solely because an output is secondary."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_resources
    applies_to: "Shared water, energy, packaging equipment and storage"
    rule: "Prefer direct metering. Otherwise use a documented physical driver such as equipment time and load, line throughput, occupied cold-store capacity and storage duration; disclose the driver and test whether it materially changes results."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_treatment
    applies_to: "Rejects, wastewater, spent brine, packaging scrap and refrigerant losses"
    rule: "Do not treat waste as a co-product unless a documented market function exists. Include in-boundary collection or treatment operations and emissions, and disclose any downstream waste-treatment dataset and recycling or recovery convention."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot_mass_route
      process_id: "receive_prepare_route_preservation_pack_product"
      flow_role: "Lot identity, route and mass balance"
      record_type: "Weighbridge, scale, batch and release records"
      raw_fields: "lot_id; species; source; wild_or_farmed; incoming_state; route; presentation; raw_mass; prepared_mass; preserved_mass; packed_net_mass; free_brine_or_glaze_mass; residual_mass"
      collection_method: "Calibrated weighing linked by lot; route and presentation recorded at each transfer"
      unit: "kg"
      frequency: "Each lot"
      temporal_coverage: "Representative production period, normally at least 12 consecutive months or all seasonal campaigns"
      site_scope: "All in-scope lines and sites"
      aggregation_rule: "Sum by lot and route; normalize only after mass-state reconciliation"
      quality_evidence: "Calibration, lot traceability, release record and reconciliation explanation"
    - protocol_id: cp_material_energy_records
      process_id: "receive_prepare_route_preservation"
      flow_role: "Water, ice, salt, electricity, fuel and heat"
      record_type: "Meter, invoice, tank, batch issue and equipment records"
      raw_fields: "timestamp; meter_or_record_id; material_or_energy; quantity; unit; route; line; lot_or_period; allocation_driver"
      collection_method: "Direct submeter or batch issue preferred; reconcile shared totals to invoices"
      unit: "Native unit plus converted m3, kg, kWh or MJ"
      frequency: "Each batch or meter interval"
      temporal_coverage: "Same period as production data"
      site_scope: "All in-scope utilities and route equipment"
      aggregation_rule: "Sum by route and lot/period; allocate only under allocation_shared_resources"
      quality_evidence: "Meter calibration, invoices, conversion factors and reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "pack_product"
      flow_role: "Packaging input and scrap"
      record_type: "Bill of materials, purchase, issue and scrap records"
      raw_fields: "component_id; material; item_mass; items_issued; reusable_cycles; scrap_mass; packed_units; lot_id"
      collection_method: "Reconcile issued components, packed units, stock change and scrap"
      unit: "kg and item"
      frequency: "Each packaging campaign"
      temporal_coverage: "Same period as production data"
      site_scope: "All primary and secondary packaging in scope"
      aggregation_rule: "Convert items using measured item mass; report each material separately"
      quality_evidence: "Supplier specification, item-mass sample and inventory reconciliation"
    - protocol_id: cp_storage_records
      process_id: "store_dispatch"
      flow_role: "Stored mass, time, temperature and energy"
      record_type: "Warehouse management, temperature logger and meter records"
      raw_fields: "lot_id; mass_in; mass_out; loss_mass; entry_time; exit_time; temperature_series; meter_use; occupied_capacity"
      collection_method: "Link dispatch lots to storage interval and monitored condition"
      unit: "kg; h or day; °C; kWh or MJ"
      frequency: "Continuous temperature; each receipt/dispatch; each meter interval"
      temporal_coverage: "Same period as production data"
      site_scope: "All in-scope storage rooms"
      aggregation_rule: "Product-time and capacity-weighted aggregation; preserve route and temperature regime"
      quality_evidence: "Logger calibration, alarms, corrective actions and meter reconciliation"
    - protocol_id: cp_waste_and_emissions
      process_id: "receive_prepare_route_preservation_pack_product_store_dispatch"
      flow_role: "Residuals, wastewater and destinations"
      record_type: "Scales, flow meters, manifests and treatment records"
      raw_fields: "waste_id; type; mass_or_volume; unit; route; lot_or_period; destination; treatment; co_product_status"
      collection_method: "Measure separately by material and destination; water balance only when meters are unavailable"
      unit: "kg or m3"
      frequency: "Each batch, shipment or reporting interval"
      temporal_coverage: "Same period as production data"
      site_scope: "All in-scope discharge and waste points"
      aggregation_rule: "Sum by type and destination; reconcile to mass and water balances"
      quality_evidence: "Manifests, meter records, treatment invoices and reconciliation"
    - protocol_id: cp_refrigerant_records
      process_id: "route_preservation_store_dispatch"
      flow_role: "Refrigerant stock and service balance"
      record_type: "Equipment register, purchase, charge, recovery and service records"
      raw_fields: "equipment_id; refrigerant; opening_stock; purchases; charged; recovered; closing_stock; service_date; operating_scope"
      collection_method: "Substance-specific stock/service balance; exclude equipment outside the foreground boundary"
      unit: "kg"
      frequency: "Each service event and annual reconciliation"
      temporal_coverage: "Same period as production data"
      site_scope: "All in-scope refrigeration equipment"
      aggregation_rule: "Calculate loss by calc_refrigerant_loss, then allocate to in-scope throughput"
      quality_evidence: "Service certificates, stock reconciliation and equipment register"
    - protocol_id: cp_food_safety_route
      process_id: "receive_prepare_route_preservation_pack_product_store_dispatch"
      flow_role: "Route endpoint and release controls"
      record_type: "HACCP, sanitation, temperature, salinity, moisture and release records as applicable"
      raw_fields: "lot_id; route; control_point; limit; result; timestamp; corrective_action; release_status"
      collection_method: "Use the facility's validated route-specific food-safety plan and applicable Codex controls"
      unit: "Route-specific"
      frequency: "Each control point and lot"
      temporal_coverage: "Same period as production data"
      site_scope: "Every declared route and line"
      aggregation_rule: "No averaging across failed and released lots; link exceptions to corrective action"
      quality_evidence: "HACCP validation, monitoring, verification and release authorization"
  calculation_rules:
    - id: calc_net_product_mass
      applies_to: "Packaged reference product"
      rule: "Net product mass = gross filled-container mass - packaging tare - free preserving brine - external ice or glaze. Use the legally applicable drained or deglazed method and retain shell/presentation state."
      inputs:
        - "gross mass"
        - "packaging tare"
        - "free brine mass"
        - "external ice/glaze mass"
      output: "kg net product mass"
      source_ids:
        - codex-cxs-95-1981
    - id: calc_route_yield
      applies_to: "Receipt, preparation and preservation"
      rule: "Yield = net preserved product mass / eligible raw lobster input mass for the same lot and route. Report residual destinations and explain unreconciled mass; do not use an uncited default yield."
      inputs:
        - "eligible raw mass"
        - "net preserved mass"
        - "residual and discharge records"
      output: "route-specific kg/kg yield and reconciliation"
      source_ids:
        - codex-cxc-52-2003
    - id: calc_inventory_normalization
      applies_to: "All inventory rows"
      rule: "Normalized amount = allocated foreground amount / dispatched net product mass for the same route, site and period."
      inputs:
        - "foreground amount"
        - "allocation record"
        - "dispatched net product mass"
      output: "amount per 1 kg reference flow"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "Refrigeration equipment"
      rule: "Refrigerant loss = opening stock + purchases + charged quantity - recovered quantity - closing stock, reconciled with service records and restricted to in-scope equipment."
      inputs:
        - "substance-specific stock and service fields"
      output: "kg refrigerant emitted by substance before allocation"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Raw input and reference product"
      requirement: "Demonstrate *Nephrops norvegicus* identity, lot traceability, route, raw state, presentation and processor-gate net-mass basis."
      evidence: "Supplier/landing record, species identification, lot record, label and release record; unsd-cpc-3-0; codex-cxs-95-1981"
    - id: dq_temporal_geographic_technology
      applies_to: "All foreground data"
      requirement: "Use data representative of the declared sites, technologies, seasonal production and reporting period; disclose gaps, outsourced operations and substitutions."
      evidence: "Site list, equipment register, production calendar and representativeness assessment; eu-pef-2021-2279"
    - id: dq_completeness_reconciliation
      applies_to: "Mass, water, energy, packaging, waste and refrigerant records"
      requirement: "Reconcile inputs and outputs at route and reporting-period level. Investigate rather than silently close material gaps; report data coverage and estimation share."
      evidence: "Mass/water/energy balances, invoices, meter coverage and gap log; eu-pef-2021-2279"
    - id: dq_measurement_quality
      applies_to: "Metered and weighed records"
      requirement: "Retain units, calibration status, sampling frequency, conversion factors and responsible data owner."
      evidence: "Calibration certificates, raw exports, scale logs and calculation workbook"
    - id: dq_food_safety_records
      applies_to: "All declared routes"
      requirement: "Retain validated route-specific controls, monitoring, corrective action and release evidence. Frozen product records shall demonstrate the applicable freezing and storage condition."
      evidence: "HACCP and release records; codex-cxc-52-2003; codex-cxs-95-1981"
    - id: dq_provisional_values
      applies_to: "Missing foreground quantities"
      requirement: "Do not introduce a numerical default or QA range without reviewed evidence. Any temporary estimate shall be labelled reasoned_estimate, documented as replaceable and reported in the data-quality disclosure."
      evidence: "Data-gap register and reviewer decision"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Fail if the product-flow UUID, Mass property UUID, unit-group UUID, 1 kg amount, species, raw state, route, presentation or net-mass qualifiers are missing or inconsistent."
    source_ids:
      - unsd-cpc-3-0
      - codex-cxs-95-1981
  - rule_id: validate_single_route
    applies_to: "Process map and inventory"
    rule: "Fail if no preservation route is declared, more than one route is combined without separate inventories, or a route-specific input is applied unconditionally to another route."
    source_ids:
      - unsd-cpc-3-0
      - codex-cxc-52-2003
  - rule_id: validate_mass_and_units
    applies_to: "Lot and normalized inventory"
    rule: "Fail if reference mass includes packaging, free brine or external glaze; if mass states are mixed without conversion; or if lot inputs, products and residuals lack a documented reconciliation."
    source_ids:
      - codex-cxs-95-1981
  - rule_id: validate_route_controls
    applies_to: "Preservation and storage"
    rule: "Fail if applicable food-safety release records are absent. For frozen product, fail if the thermal centre did not reach -18 °C or colder after stabilization or storage was not maintained at -18 °C or colder."
    source_ids:
      - codex-cxc-52-2003
      - codex-cxs-95-1981
  - rule_id: validate_allocation
    applies_to: "Co-products and shared resources"
    rule: "Fail if avoidable route aggregation remains, an allocation driver lacks records, a marketed co-product is assigned zero burden without justification, or waste conventions are undisclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_data_completeness
    applies_to: "Foreground package"
    rule: "Fail if required protocols omit route/site/period coverage, if material data gaps are hidden, or if any numerical temporary value is not labelled reasoned_estimate and disclosed as replaceable."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground product-system dataset for preserved raw Norway lobster at the processor gate"
  downstream_use: "secondary_dataset; background_dataset after review for scope, representativeness and data quality"
  allowed_use: "Route-specific process or lifecycle modelling that matches species, raw state, presentation, geography, technology, period and processor-gate boundary"
  excluded_use: "Live/fresh/chilled, cooked, smoked, canned or other lobster products; other species; undisclosed multi-route averages; capture/aquaculture claims not supported by the linked upstream dataset"
  required_metadata: "PCR id; CPC reference; product-flow UUID; species; raw state; preservation route; presentation; net-mass method; site and geography; technology; reporting period; raw-material source; allocation method; storage temperature and duration; upstream datasets"
  required_quality_disclosure: "Protocol coverage; metered/weighed share; estimation share; mass/water/energy reconciliation; representativeness; route controls; allocation drivers; non-reference UUID gaps; temporary reasoned_estimate values and replacement plan"
  update_trigger: "Change in species/scope, preservation route, line technology, energy or refrigerant system, packaging, co-product market, allocation driver, upstream source, site mix, regulation or food-safety specification; or new reviewed quantitative evidence"
data_sources:
  - id: "unsd-cpc-3-0"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0, official structure and explanatory notes, https://unstats.un.org/unsd/classifications/Econ/cpc (retrieved 2026-08-11)"
    used_for: "Product-category scope, *Nephrops norvegicus* identity and preservation-route exclusions"
  - id: "codex-cxc-52-2003"
    type: "standard"
    reference: "Codex Alimentarius, CXC 52-2003, Code of Practice for Fish and Fishery Products, https://www.fao.org/4/a1553e/a1553e00.pdf (retrieved 2026-08-11)"
    used_for: "Process decomposition, prerequisite programmes, HACCP-based controls, hygienic handling, route and storage records"
  - id: "codex-cxs-95-1981"
    type: "standard"
    reference: "Codex Alimentarius, CXS 95-1981, Standard for Quick-Frozen Lobsters, amended 2024, https://openknowledge.fao.org/handle/20.500.14283/ce0070en (retrieved 2026-08-11)"
    used_for: "Norway lobster species and frozen-route definition, -18 °C endpoint/storage, glazing water, deglazed net mass, labelling and release checks"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission, Recommendation (EU) 2021/2279 on the use of Environmental Footprint methods, CELEX 32021H2279, https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32021H2279 (retrieved 2026-08-11)"
    used_for: "Boundary consistency, allocation hierarchy, shared-resource allocation, packaging, data quality, completeness and disclosure"
