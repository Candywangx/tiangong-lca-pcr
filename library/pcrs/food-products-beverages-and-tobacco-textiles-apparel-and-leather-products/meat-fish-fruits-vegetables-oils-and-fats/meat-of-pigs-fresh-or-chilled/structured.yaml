measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record net meat or carcass mass at the declared gate. Exclude transport and secondary packaging; state whether immediate primary packaging is excluded or separately inventoried."
  - id: cold_carcass_basis
    applies_to: "pig carcass output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "When the declared product is a carcass, disclose the cold-carcass definition and excluded body parts; do not silently substitute live weight or hot carcass weight."
  - id: temperature_state
    applies_to: "reference product condition"
    required_property_ref:
      name: "Temperature"
      uuid: ""
    required_unit: "degrees Celsius"
    rule: "Record fresh/chilled status, measured product temperature, measurement location and time. A concrete dataset must apply its governing legal or customer specification; for EU-context datasets, other meat is chilled to no more than 7 degrees Celsius unless an applicable authorised exception is documented."
  - id: energy_conversion
    applies_to: "purchased electricity and thermal energy"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Preserve the measured energy unit and conversion trace. Use 1 kWh = 3.6 MJ when conversion is required; do not combine electricity and thermal energy without retaining their separate carrier identities."
  - id: water_volume
    applies_to: "process water and wastewater"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Prefer metered volume. If mass is converted to volume, disclose density, temperature and conversion formula."
