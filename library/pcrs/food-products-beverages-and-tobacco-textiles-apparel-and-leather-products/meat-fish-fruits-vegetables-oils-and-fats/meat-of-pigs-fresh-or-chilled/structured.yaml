                evidence_kind: "reasoned_estimate"
                source_ids: []
      elementary:
        []
allocation_rules:
  - rule_id: alloc_avoid
    applies_to: "all_multifunctional_operations"
    rule: "First avoid allocation by separately metering and subdividing independently operated activities; use system expansion only when a direct, demonstrable substitution can be represented consistently with the study goal."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_physical
    applies_to: "inseparable_slaughter_and_cutting_burdens"
    rule: "When subdivision or justified system expansion is not possible, allocate shared burdens using a documented relevant physical relationship that reflects how the process burdens relate to the co-products; do not assume that mass is automatically the relevant relationship."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: alloc_other_relationship
    applies_to: "residual_multifunctionality"
    rule: "If no relevant physical relationship can be demonstrated, use another documented relationship, such as economic value, and retain product quantities, prices, price period, currency and calculation factors for review."
    source_ids:
      - eu-pef-2021-2279
      - fao-leap-pig-2018
  - rule_id: alloc_waste_boundary
    applies_to: "wastes_and_coproducts"
    rule: "Assign no co-product credit to a material classified as waste unless a documented downstream use and the chosen allocation or substitution method justify it; record treatment burdens through the declared waste boundary."
    source_ids:
      - eu-pef-2021-2279
      - eu-bat-sa-2023
  - rule_id: alloc_disclosure
    applies_to: "dataset_reporting"
    rule: "Report the hierarchy step used, factors for every product and co-product, excluded outputs, price or physical data periods, treatment of edible and inedible outputs, and a sensitivity result when the choice materially affects the reference product."
    source_ids:
      - eu-pef-2021-2279
      - fao-leap-pig-2018
dataset_production:
  collection_protocols:
    - protocol_id: cp_live_pig_receipt
      process_id: "slaughter_dress_chill"
      flow_role: "live pigs"
      record_type: "weighbridge and livestock receipt records"
      raw_fields: "supplier; origin; lot id; animal count; gross, tare and net live mass; receipt time"
      collection_method: "calibrated scale or weighbridge reconciled to receipt records"
      unit: "kg; head"
      frequency: "each lot"
      temporal_coverage: "representative 12-month period or declared campaign"
      site_scope: "all pigs feeding the included line"
      aggregation_rule: "sum accepted live mass by lot, excluding rejected animals not processed"
      quality_evidence: "calibration records; receipt reconciliation; rejection log"
    - protocol_id: cp_slaughter_water
      process_id: "slaughter_dress_chill"
      flow_role: "process water"
      record_type: "water-meter and utility records"
      raw_fields: "meter id; opening and closing readings; submeter boundary; operating days; shared-use allocation"
      collection_method: "direct meter preferred; documented allocation from facility meter if no submeter"
      unit: "m3"
      frequency: "daily or shift readings, aggregated monthly"
      temporal_coverage: "representative 12-month period"
      site_scope: "included slaughter, cleaning and chilling operations"
      aggregation_rule: "subtract unrelated uses and normalize attributable volume to product output"
      quality_evidence: "meter calibration; utility invoice reconciliation; allocation worksheet"
    - protocol_id: cp_slaughter_energy
      process_id: "slaughter_dress_chill"
      flow_role: "electricity, fuels and heat"
      record_type: "meters, invoices and fuel stock records"
      raw_fields: "carrier; meter or invoice quantity; conversion factor; opening and closing fuel stock; included equipment"
      collection_method: "direct metering or invoice/stock-balance reconciliation by carrier"
      unit: "kWh; MJ; carrier unit"
      frequency: "monthly, with production-period matching"
      temporal_coverage: "representative 12-month period"
      site_scope: "included slaughter, chilling, cold storage and attributable treatment"
      aggregation_rule: "calculate net purchased energy by carrier, retain recovered energy separately, then normalize"
      quality_evidence: "meter checks; invoices; conversion-factor source; reconciliation"
    - protocol_id: cp_slaughter_materials
      process_id: "slaughter_dress_chill"
      flow_role: "cleaning and sanitation materials"
      record_type: "purchase, stock and dosing records"
      raw_fields: "product id; concentration; opening and closing stock; purchased and issued mass; dosing log"
      collection_method: "stock balance reconciled to dosing records"
      unit: "kg"
      frequency: "monthly"
      temporal_coverage: "representative 12-month period"
      site_scope: "included slaughter and sanitation areas"
      aggregation_rule: "net issue = opening + purchases - closing - unrelated uses"
      quality_evidence: "stock count; invoices; dosing calibration"
    - protocol_id: cp_slaughter_product_output
      process_id: "slaughter_dress_chill"
      flow_role: "chilled carcass output"
      record_type: "scale, inspection and dispatch records"
      raw_fields: "lot id; hot or cold mass flag; cold carcass definition; output mass; temperature; inspection status; dispatch time"
      collection_method: "calibrated carcass or dispatch scale with temperature record"
      unit: "kg; degrees Celsius"
      frequency: "each lot"
      temporal_coverage: "same period as inputs"
      site_scope: "included slaughter line and pre-dispatch cold store"
      aggregation_rule: "sum conforming output only and normalize all flows to 1,000 kg"
      quality_evidence: "scale calibration; inspection release; temperature log; mass reconciliation"
    - protocol_id: cp_slaughter_coproducts
      process_id: "slaughter_dress_chill"
      flow_role: "co-products and solid residues"
      record_type: "scales, containers, sales and waste transfer records"
      raw_fields: "material id; product/waste status; mass; destination; price and currency if sold; treatment route"
      collection_method: "direct weighing preferred; container count times verified unit mass only when weighing is unavailable"
      unit: "kg; currency/kg"
      frequency: "each lot or dispatch"
      temporal_coverage: "same period as reference output"
      site_scope: "all co-products and solid residues from the included slaughter line"
      aggregation_rule: "aggregate separately by material and destination; never net products against wastes"
      quality_evidence: "scale calibration; sales invoice; waste transfer note; destination evidence"
    - protocol_id: cp_slaughter_wastewater
      process_id: "slaughter_dress_chill"
      flow_role: "wastewater"
      record_type: "effluent meter and treatment records"
      raw_fields: "flow; boundary point; treatment status; pH; temperature; monitored pollutant parameters"
      collection_method: "continuous or periodic metering at the declared boundary"
      unit: "m3; parameter-specific units"
      frequency: "continuous where available, aggregated monthly"
      temporal_coverage: "representative 12-month period"
      site_scope: "included slaughter line and declared wastewater-treatment boundary"
      aggregation_rule: "avoid double counting pre-treatment and post-treatment volume; normalize declared discharge"
      quality_evidence: "meter checks; sampling plan; laboratory reports; treatment logs"
    - protocol_id: cp_refrigerant_records
      process_id: "slaughter_dress_chill"
      flow_role: "refrigerant loss"
      record_type: "refrigerant inventory and maintenance records"
      raw_fields: "refrigerant id; system id; opening stock; purchases; recoveries; closing stock; recharge; disposal"
      collection_method: "annual stock balance supported by service records"
      unit: "kg"
      frequency: "each service event and annual reconciliation"
      temporal_coverage: "representative 12-month period"
      site_scope: "refrigeration systems serving the included chilling and cold storage"
      aggregation_rule: "loss = opening + purchases - closing - recovered - disposed, allocated to included cooling load"
      quality_evidence: "service certificates; cylinder records; stock reconciliation"
    - protocol_id: cp_cutting_input_output
      process_id: "cut_pack"
      flow_role: "meat input, product, co-products and wastes"
      record_type: "line scales, yield sheets, packaging and dispatch records"
      raw_fields: "input product id and mass; output cut id and mass; bone status; temperature; co-product mass; waste mass; destination"
      collection_method: "calibrated line and dispatch scales reconciled by production batch"
      unit: "kg; degrees Celsius"
      frequency: "each batch"
      temporal_coverage: "representative 12-month period or declared campaign"
      site_scope: "all included cutting, deboning and packaging lines"
      aggregation_rule: "mass-balance each batch, then aggregate like product specifications and normalize to 1,000 kg output"
      quality_evidence: "scale calibration; batch yield report; release record; mass-balance review"
    - protocol_id: cp_cutting_energy_water
      process_id: "cut_pack"
      flow_role: "cutting electricity and water"
      record_type: "submeter, invoice and operating-hour records"
      raw_fields: "meter readings; line hours; production mass; shared-service driver"
      collection_method: "direct submeter preferred; documented engineering allocation if shared"
      unit: "kWh; m3"
      frequency: "daily or monthly"
      temporal_coverage: "same period as cutting output"
      site_scope: "included cutting, refrigeration, cleaning and packaging operations"
      aggregation_rule: "subtract unrelated uses and normalize attributable quantities to output"
      quality_evidence: "meter checks; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_primary_packaging
      process_id: "cut_pack"
      flow_role: "primary packaging"
      record_type: "bill of materials and stock records"
      raw_fields: "packaging material; unit mass; units issued; rejects; returned stock"
      collection_method: "bill-of-materials quantity reconciled to stock issue and packaged units"
      unit: "kg; item"
      frequency: "each packaging run"
      temporal_coverage: "same period as packaged output"
      site_scope: "all packaged product specifications in the declared output"
      aggregation_rule: "packaging mass = verified unit mass times net units used, by material"
      quality_evidence: "supplier specification; unit-mass check; stock reconciliation"
  calculation_rules:
    - id: calc_normalize_1000kg
      applies_to: "all inventory rows"
      rule: "normalized amount = period-attributable amount / qualifying reference-product mass x 1,000 kg"
      inputs:
        - "attributable flow amount"
        - "qualifying product output mass"
      output: "amount per 1,000 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_energy_total
      applies_to: "slaughter energy QA"
      rule: "convert each carrier to kWh using documented factors, sum purchased heat and electricity, subtract only measured recovered energy, and compare the result with the BAT-AEPL on its stated yearly-average basis"
      inputs:
        - electricity
        - fuels
        - "purchased heat"
        - "recovered energy"
        - "carcass output"
      output: "net kWh per 1,000 kg carcass output"
      source_ids:
        - eu-bat-sa-2023
    - id: calc_refrigerant_loss
      applies_to: "refrigerant loss"
      rule: "annual loss = opening stock + purchases - closing stock - recovered quantity - documented disposal; allocate only the share serving included refrigeration"
      inputs:
        - "inventory and service-event fields"
      output: "kg refrigerant loss per 1,000 kg product"
      source_ids:
        - eu-bat-sa-2023
    - id: calc_mass_balance
      applies_to: "slaughter and cutting batches"
      rule: "compare measured animal or meat inputs with reference product, co-products, wastes, wastewater-borne solids when measured, stock change and documented losses; investigate unexplained imbalance rather than forcing closure"
      inputs:
        - "all measured mass inputs and outputs"
        - "stock change"
      output: "mass-balance residual and explanation"
      source_ids:
        - mass-balance-identity
    - id: calc_allocation_factors
      applies_to: "shared burdens"
      rule: "derive factors only after applying the allocation hierarchy; factors across included products must sum to 1 for each shared burden pool"
      inputs:
        - "subdivision data"
        - "physical relationship data"
        - quantities
        - "prices and price period where used"
      output: "allocation factor by output and burden pool"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and same-category inputs"
      requirement: "Product form, bone status, fresh/chilled state, temperature, gate, packaging and Tiangong flow identity must match the declared dataset; a carcass flow must not silently represent a processed or frozen product."
      evidence: "product specification; dispatch record; temperature log; flow UUID check"
    - id: dq_temporal
      applies_to: "foreground inventory"
      requirement: "Use a representative continuous 12-month period where seasonal operation permits; otherwise disclose the campaign dates, production share and reason it is representative."
      evidence: "dated meter, production and dispatch records"
    - id: dq_measurement
      applies_to: "mass, water and energy"
      requirement: "Use calibrated direct measurement where available and retain any shared-service allocation driver and conversion factor."
      evidence: "calibration certificates; meter logs; invoices; allocation worksheet"
    - id: dq_completeness
      applies_to: "included operations"
      requirement: "Cover live-pig input, qualifying product, all material co-products and wastes, water, wastewater, electricity, thermal energy, cleaning materials and refrigerant losses; justify any omitted relevant flow."
      evidence: "signed completeness checklist; process flow diagram; mass and utility reconciliation"
    - id: dq_mass_balance
      applies_to: "each production stage"
      requirement: "Investigate and disclose material residuals; do not use an allocation factor or an invented loss to hide an unexplained imbalance."
      evidence: "batch and period mass-balance worksheet; corrective-action record"
    - id: dq_allocation
      applies_to: "multifunctional outputs"
      requirement: "Retain the evidence for the selected hierarchy step and all factor inputs; price data must state currency, geography, time period and averaging method."
      evidence: "allocation workbook; quantity records; price evidence; sensitivity result"
    - id: dq_temperature
      applies_to: "fresh/chilled claim"
      requirement: "Retain product-temperature measurements and the applicable legal or customer limit at the declared measurement point."
      evidence: "calibrated temperature log; specification; release record"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "Fail if the product UUID, mass property, unit group, reference unit or required product qualifiers are missing or inconsistent with fresh or chilled pig meat."
    source_ids:
      - unstats-cpc-3-0-2025
      - unece-porcine-meat-2018
  - rule_id: val_boundary
    applies_to: "process coverage"
    rule: "Fail if slaughter/dressing/chilling is omitted for a live-pig starting condition, or if cutting/packaging burdens are omitted when the declared product form requires them."
    source_ids:
      - codex-cxc-58-2005
      - eu-853-2004
  - rule_id: val_upstream
    applies_to: "upstream supply"
    rule: "Fail if live-pig or purchased same-category input burdens are neither linked to a representative upstream dataset nor explicitly reported as an unresolved coverage gap."
    source_ids:
      - fao-leap-pig-2018
  - rule_id: val_temperature
    applies_to: "market state"
    rule: "Fail if a chilled product lacks its temperature specification and measurement evidence; flag values outside the applicable specification for review."
    source_ids:
      - eu-853-2004
  - rule_id: val_mass_balance
    applies_to: "slaughter and cutting inventory"
    rule: "Fail if reference output, co-products and wastes are not separately quantified; flag an unexplained material imbalance for correction."
    source_ids:
      - mass-balance-identity
      - fao-leap-pig-2018
  - rule_id: val_energy_water
    applies_to: "utility QA"
    rule: "Compare annualized net energy and wastewater discharge with the source-backed pig-slaughter BAT-AEPL ranges only on a comparable exclusive-slaughtering basis; an outlier is a review finding, not automatic replacement by a default."
    source_ids:
      - eu-bat-sa-2023
  - rule_id: val_allocation
    applies_to: "co-product handling"
    rule: "Fail if shared burdens are allocated without the hierarchy step, factor basis and factors being disclosed, or if factors for a burden pool do not sum to 1."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_reasoned_estimates
    applies_to: "provisional ranges"
    rule: "Treat every reasoned_estimate range as a temporary, replaceable QA screen; fail publication readiness if it is used as a mandatory allowed range or as a substitute for collected foreground data."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground product and unit-process data package for fresh or chilled pig meat at a declared slaughterhouse or cutting-plant gate"
  downstream_use: "secondary_dataset; background_dataset after review of representativeness, allocation, completeness and source coverage"
  allowed_use: "Product LCAs and supply-chain models whose product form, fresh/chilled state, geography, technology, gate and time period are compatible with the dataset"
  excluded_use: "Frozen or further processed pork; edible offal as reference product; live-pig production alone; comparative public claims without method and representativeness review; direct use of provisional reasoned estimates as site data"
  required_metadata: "PCR id and version when published; product form and bone status; flow UUID; gate; geography; reference period; temperature state; packaging; included processes; upstream dataset links; allocation method and factors; data ownership and review status"
  required_quality_disclosure: "Metering and estimation shares; temporal and geographic representativeness; mass-balance residual; omitted flows; co-product treatment; BAT-AEPL comparison basis; provisional ranges still present; uncertainty and review findings"
  update_trigger: "Material change in product form, slaughter or cutting technology, chilling system, utility mix, co-product markets or allocation, legal temperature specification, supplier system, geography, or foreground data older than the programme's accepted representativeness period"
