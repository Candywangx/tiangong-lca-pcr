system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary starts when live pigs cross the slaughterhouse gate and ends when the declared fresh or chilled carcass, side or meat cut is ready for dispatch at the declared slaughterhouse or cutting-plant gate. It includes on-site utilities, cleaning and sanitation, chilling, cold storage before dispatch, wastewater handling and treatment attributable to the included operations, and management of slaughter co-products and wastes. Upstream pig rearing, feed production and inbound transport are represented by linked upstream datasets. Downstream distribution, retail, cooking, consumption and end-of-life of packaging are excluded unless the study goal explicitly extends the boundary and reports them separately."
      source_ids: []
    - rule_id: sb_required_operations
      applies_to: "slaughter_dress_chill"
      rule: "Include receiving/lairage activities attributable to the lot, slaughter, bleeding, scalding and dehairing, evisceration, inspection, dressing/splitting, washing, chilling, pre-dispatch cold storage, cleaning, utilities and attributable wastewater management."
      source_ids:
        - codex-cxc-58-2005
        - eu-853-2004
        - eu-bat-sa-2023
    - rule_id: sb_conditional_cutting
      applies_to: "cut_pack"
      rule: "Include cutting, deboning, trimming, product handling, primary packaging and their utilities and wastes when the declared reference product is a cut or packaged product."
      source_ids:
        - unece-porcine-meat-2018
        - eu-853-2004
    - rule_id: sb_upstream_live_pig
      applies_to: "live_pig_supply"
      rule: "Keep pig rearing, feed production and inbound transport outside the foreground slaughter process and link representative upstream datasets rather than omitting their burdens."
      source_ids:
        - fao-leap-pig-2018
    - rule_id: sb_same_category_recursion
      applies_to: "purchased_fresh_chilled_pork"
      rule: "Stop recursion at a purchased same-category product and link its upstream dataset; disclose the purchased product form and gate."
      source_ids:
        - fao-leap-pig-2018
    - rule_id: sb_downstream_exclusions
      applies_to: "post_gate_activities"
      rule: "Exclude downstream transport, retail, cooking and consumption from this plant-gate PCR unless the study explicitly adds and reports them as separate processes."
      source_ids:
        - fao-leap-pig-2018
boundary_abstraction:
  declared_starting_condition: "Live pigs received at the slaughterhouse gate, with supplier, origin, live mass, animal count, transport handover and receipt time declared"
  starting_condition_role: "Upstream product input that anchors the foreground slaughter and primary-processing dataset"
  product_classification_scope: "Raw edible meat of domesticated pigs in fresh or chilled carcass, side or cut form; CPC 3.0 code 21113 is an exact classification reference"
  recursive_input_rule: "If fresh or chilled pig carcasses, sides or cuts are purchased for further cutting or packing, record them as linked upstream product inputs and do not recreate their slaughter burden inside the cutting process"
  upstream_dataset_requirement: "Use a geographically and temporally representative live-pig or fresh/chilled pig-meat supplier dataset with declared gate, production system, mass basis and allocation method"
  disclosure: "Declare the starting product, gate, included processes, product form, temperature state, cold-storage duration, packaging, treatment of purchased same-category inputs, and any excluded on-site operation"
