            expression: "Measured sludge mass with dry-solids fraction and treatment destination"
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg crude cottonseed oil"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_wastewater_treatment_records
              source_ids:
                - eu-bat-food-drink-milk-2019
            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "route_and_unit_processes"
    rule: "First subdivide seed preparation, conditioning, extraction, clarification, utilities, and treatment using meters, batch records, equipment operating time, or another documented causal key. Do not allocate burdens from route steps that are not operated."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rule_2
    applies_to: "residual_common_burdens"
    rule: "For the attributional baseline, after subdivision allocate residual common foreground burdens by dry mass among crude cottonseed oil and marketable cotton linters, hulls, press cake, and meal leaving the system. Waste streams receive no co-product share. Record moisture conversions and all allocation factors."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rule_3
    applies_to: "system_expansion_alternative"
    rule: "System expansion may replace the mass-allocation baseline only when the study goal requires it and a transparent, quality-matched displaced-product model exists for every credited co-product. Report the substituted product, substitution ratio, geography, quality adjustment, and sensitivity result; do not mix system expansion and allocation for the same burden."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rule_4
    applies_to: "foots_and_internal_recycling"
    rule: "Treat foots returned to meal and recovered hexane returned to extraction as internal loops. Allocate or credit only net external outputs, and disclose any foots sold or sent to waste treatment."
    source_ids:
      - us-epa-ap42-vegetable-oil-background-1995
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_seed_preparation_records
      process_id: "seed_preparation"
      flow_role: "cottonseed, electricity, linters, hulls, rejects"
      record_type: "weighbridge, scale, meter, production log"
      raw_fields: "receipt mass; moisture; foreign matter; electricity; linter mass; hull mass; reject mass"
      collection_method: "calibrated instruments and reconciled production records"
      unit: "kg; kWh"
      frequency: "each load or shift, aggregated monthly"
      temporal_coverage: "representative continuous campaign or at least 12 months"
      site_scope: "all seed-preparation equipment serving the product"
      aggregation_rule: "sum external flows and reconcile prepared-kernel transfer by mass"
      quality_evidence: "calibration certificates; weigh tickets; meter mapping; reconciliation"
    - protocol_id: cp_conditioning_records
      process_id: "conditioning_flaking"
      flow_role: "meats, water, steam, electricity"
      record_type: "transfer scale, flowmeter, steam meter, electricity meter, batch log"
      raw_fields: "feed and output mass; moisture; water; steam; electricity; expander status"
      collection_method: "direct metering or documented equipment allocation"
      unit: "kg; kWh"
      frequency: "shift or batch"
      temporal_coverage: "same reporting period as reference product"
      site_scope: "all conditioning, flaking, cooking, and expansion equipment"
      aggregation_rule: "sum by declared route and reconcile internal transfers"
      quality_evidence: "meter calibration; operating log; moisture tests"
    - protocol_id: cp_pressing_records
      process_id: "mechanical_pressing"
      flow_role: "press feed, electricity, oil, cake"
      record_type: "scale, electricity meter, press log"
      raw_fields: "feed mass; electricity; pressed oil; cake mass; cake destination"
      collection_method: "direct measurement or documented equipment allocation"
      unit: "kg; kWh"
      frequency: "shift or batch"
      temporal_coverage: "route operating period"
      site_scope: "all presses serving the declared route"
      aggregation_rule: "aggregate only periods when pressing operates"
      quality_evidence: "scale calibration; press log; mass balance"
    - protocol_id: cp_extraction_records
      process_id: "hexane_extraction"
      flow_role: "extractor feeds, electricity, miscella, solvent-laden meal"
      record_type: "transfer measurement, electricity meter, composition sample"
      raw_fields: "feed mass by route; electricity; miscella mass and composition; meal mass and solvent content"
      collection_method: "direct measurement and laboratory sampling"
      unit: "kg; kWh; mass fraction"
      frequency: "shift or batch"
      temporal_coverage: "solvent-route operating period"
      site_scope: "extractor and assigned auxiliaries"
      aggregation_rule: "reconcile oil, solids, water, and solvent transfers"
      quality_evidence: "meter calibration; laboratory methods; solvent balance"
    - protocol_id: cp_desolventizing_records
      process_id: "desolventizing_stripping"
      flow_role: "miscella, meal, steam, electricity, crude oil, meal output"
      record_type: "transfer scale, steam and electricity meters, lab sample"
      raw_fields: "internal inputs; steam; electricity; crude oil; meal; moisture; residual solvent"
      collection_method: "direct measurement and laboratory sampling"
      unit: "kg; kWh; mass fraction"
      frequency: "shift or batch"
      temporal_coverage: "solvent-route operating period"
      site_scope: "evaporators, stripper, desolventizer-toaster, dryer, cooler, condensers"
      aggregation_rule: "aggregate route-specific operation and reconcile internal transfers"
      quality_evidence: "calibration; lab QA; production balance"
    - protocol_id: cp_solvent_balance_records
      process_id: "hexane_extraction_desolventizing_stripping"
      flow_role: "make-up hexane and air loss"
      record_type: "tank gauge, purchases, flowmeter, stack test, leak survey"
      raw_fields: "opening stock; purchases; closing stock; recovered hexane; retained solvent; wastewater solvent; vent emissions; fugitive estimate"
      collection_method: "site solvent mass balance supported by measurements"
      unit: "kg"
      frequency: "daily or monthly balance; annual reconciliation"
      temporal_coverage: "full solvent-route reporting period"
      site_scope: "all solvent storage and solvent-using/recovery equipment"
      aggregation_rule: "purchases plus opening stock minus closing stock minus retained/recovered transfers equals loss, with uncertainty disclosed"
      quality_evidence: "tank calibration; purchase records; stack test; leak survey; closure error"
    - protocol_id: cp_clarification_records
      process_id: "crude_oil_clarification"
      flow_role: "oil transfers, reference product, electricity, water, cleaning agent, foots"
      record_type: "tank or scale records, meters, issue logs, lab tests"
      raw_fields: "input oil; dispatchable crude oil; electricity; water; cleaning agent; foots; moisture; insoluble impurities; residual solvent"
      collection_method: "direct measurement and representative sampling"
      unit: "kg; kWh; mass fraction"
      frequency: "batch or shift"
      temporal_coverage: "full product reporting period"
      site_scope: "clarification, filtration, tanks, and assigned cleaning"
      aggregation_rule: "reconcile incoming oil to crude oil, foots, wastewater, and stock change"
      quality_evidence: "tank calibration; laboratory QA; cleaning issue records; mass balance"
    - protocol_id: cp_heat_generation_records
      process_id: "onsite_heat_generation"
      flow_role: "fuels, feed water, electricity, steam"
      record_type: "fuel meter or tank, invoices, water and electricity meters, steam meter"
      raw_fields: "natural gas; fuel oil; lower heating value; water; electricity; steam; condensate return; blowdown"
      collection_method: "direct measurement and stock reconciliation"
      unit: "MJ; kg; kWh"
      frequency: "daily or monthly"
      temporal_coverage: "full reporting period"
      site_scope: "on-site boilers and direct heaters serving foreground production"
      aggregation_rule: "allocate only after metered subdivision where feasible"
      quality_evidence: "meter calibration; fuel certificates; boiler log; steam balance"
    - protocol_id: cp_combustion_emission_records
      process_id: "onsite_heat_generation"
      flow_role: "combustion emissions"
      record_type: "stack measurements or fuel-specific calculation"
      raw_fields: "fuel quantity; carbon and sulfur content; stack concentration and flow; operating hours; emission factors"
      collection_method: "direct monitoring or documented calculation from collected activity data"
      unit: "kg"
      frequency: "permit or monitoring frequency and annual aggregation"
      temporal_coverage: "full reporting period"
      site_scope: "each boiler or direct heater in scope"
      aggregation_rule: "sum measured/calculated emissions without double counting"
      quality_evidence: "stack-test report; fuel analysis; calculation workbook"
    - protocol_id: cp_wastewater_records
      process_id: "desolventizing_stripping_crude_oil_clarification"
      flow_role: "wastewater"
      record_type: "flowmeter, tank record, laboratory analysis"
      raw_fields: "flow; oil and grease; suspended solids; hexane where applicable; destination"
      collection_method: "continuous or batch flow measurement and representative sampling"
      unit: "kg or m3; concentration"
      frequency: "daily or batch"
      temporal_coverage: "full operating period"
      site_scope: "all in-scope wastewater sources"
      aggregation_rule: "aggregate mass and pollutant loads by source and destination"
      quality_evidence: "flowmeter calibration; chain of custody; laboratory QA"
    - protocol_id: cp_wastewater_treatment_records
      process_id: "onsite_wastewater_treatment"
      flow_role: "treated effluent, electricity, sludge"
      record_type: "influent/effluent meters, electricity meter, sludge scale, lab tests"
      raw_fields: "influent; effluent; electricity; sludge mass; dry solids; pollutant concentrations; destination"
      collection_method: "direct measurement and laboratory analysis"
      unit: "kg; m3; kWh; concentration"
      frequency: "daily, batch, or permit frequency"
      temporal_coverage: "full treatment operating period"
      site_scope: "on-site wastewater-treatment plant"
      aggregation_rule: "reconcile influent, effluent, sludge, evaporation, and stock change"
      quality_evidence: "calibration; permit reports; lab QA; treatment balance"
    - protocol_id: cp_air_emission_records
      process_id: "seed_preparation"
      flow_role: "process dust"
      record_type: "stack test, bag-filter/cyclone monitoring, fugitive survey"
      raw_fields: "concentration; gas flow; operating time; control status; fugitive estimate"
      collection_method: "direct monitoring and documented calculation"
      unit: "kg"
      frequency: "monitoring frequency and annual aggregation"
      temporal_coverage: "full operating period"
      site_scope: "receiving, cleaning, delinting, dehulling, and meal handling assigned to this PCR"
      aggregation_rule: "sum controlled and fugitive emissions by source"
      quality_evidence: "stack-test report; control inspection; calculation workbook"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "all external inventory rows"
      rule: "reporting-period row amount / reporting-period clarified crude cottonseed oil mass"
      inputs:
        - "collected row amount"
        - "reference product mass"
      output: "amount per 1 kg crude cottonseed oil"
      source_ids:
        - eu-pef-method-2021
    - id: calc_internal_mass_balance
      applies_to: "every unit process"
      rule: "opening stock + inputs = closing stock + products + co-products + wastes + measured releases + reported unaccounted difference"
      inputs:
        - transfer
        - stock
        - product
        - waste
        - "and emission records"
      output: "process mass-balance closure and discrepancy"
      source_ids:
        - eu-pef-method-2021
    - id: calc_hexane_loss
      applies_to: "solvent route"
      rule: "opening hexane + purchases - closing hexane - net recovered inventory - quantified solvent retained in products/wastewater = total hexane loss; partition measured sources and report the residual as fugitive/unresolved"
      inputs:
        - "solvent records"
        - samples
        - "vent data"
      output: "hexane make-up and loss per reference flow"
      source_ids:
        - us-epa-ap42-vegetable-oil-processing-1995
        - eu-bat-food-drink-milk-2019
    - id: calc_fuel_energy
      applies_to: "on-site heat generation"
      rule: "measured fuel quantity × documented lower heating value"
      inputs:
        - "fuel quantity"
        - "lower heating value"
      output: "fuel energy in MJ per reference flow"
      source_ids:
        - eu-bat-food-drink-milk-2019
    - id: calc_allocation_mass
      applies_to: "residual common burdens"
      rule: "burden × dry mass of selected marketable output / total dry mass of all selected marketable outputs"
      inputs:
        - "common burden"
        - "output wet masses"
        - "moisture fractions"
      output: "allocated burden and allocation factor"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and route"
      requirement: "Demonstrate that the output is crude cottonseed oil rather than refined oil and identify the actual extraction route and solvent configuration."
      evidence: "product specification or dispatch record; process flow diagram; route declaration"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use one consistent reporting period that covers representative operation, shutdowns, start-ups, route changes, and seasonal campaigns; disclose exclusions."
      evidence: "dated logs; production calendar; reporting-period reconciliation"
    - id: dq_completeness
      applies_to: "mass, energy, solvent, water, co-products, wastes, and emissions"
      requirement: "Account for every listed important flow or document why its atomic row is not applicable to the declared technology."
      evidence: "completeness matrix; signed not-applicable justification; mass and utility balances"
    - id: dq_measurement
      applies_to: "meters, scales, tanks, and laboratory results"
      requirement: "Retain instrument identity, calibration or verification status, sampling method, detection limits, and unit conversions."
      evidence: "calibration records; laboratory QA/QC; calculation workbook"
    - id: dq_representativeness
      applies_to: "upstream and secondary datasets"
      requirement: "Report technological, geographical, and temporal representativeness and identify all proxies, especially cottonseed supply, electricity, fuels, hexane, and waste treatment."
      evidence: "dataset metadata; proxy register; data-quality assessment"
    - id: dq_allocation
      applies_to: "co-products"
      requirement: "Retain unallocated totals, subdivision keys, dry-mass conversions, allocation factors, destinations, and any system-expansion sensitivity model."
      evidence: "allocation workbook; sales or dispatch records; moisture tests; sensitivity results"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference_flow"
    rule: "Fail validation if the reference output is refined cottonseed oil, if the reference product UUID is represented by the known refined-oil UUID, or if the output is not measured in kg on a declared mass basis."
    source_ids:
      - unsd-cpc-3-0-structure-2025
  - rule_id: validation_rule_2
    applies_to: "route_consistency"
    rule: "Fail validation if mechanical-only data include hexane extraction/desolventizing burdens, or if a declared solvent route omits hexane make-up, recovery, wastewater, and air-loss accounting."
    source_ids:
      - us-epa-ap42-vegetable-oil-processing-1995
      - eu-bat-food-drink-milk-2019
  - rule_id: validation_rule_3
    applies_to: "inventory_completeness"
    rule: "Require separate atomic rows for cottonseed, electricity, steam, each fuel, process water, hexane, cleaning agent, linters, hulls, meal, foots, wastewater, sludge, hexane/VOC, dust, and each reported combustion emission when applicable."
    source_ids:
      - eu-pef-method-2021
      - us-epa-ap42-vegetable-oil-processing-1995
  - rule_id: validation_rule_4
    applies_to: "balances"
    rule: "Require disclosed closure for process mass balances, the site solvent balance on solvent routes, water/wastewater balance, and fuel-to-energy calculation. Flag unexplained discrepancies rather than forcing them into the reference product."
    source_ids:
      - us-epa-ap42-vegetable-oil-processing-1995
      - eu-bat-food-drink-milk-2019
  - rule_id: validation_rule_5
    applies_to: "allocation"
    rule: "Require one declared attributional mass-allocation result after subdivision, or one fully documented system-expansion alternative; fail if burdens are left unassigned or the same co-product receives both allocation and substitution credit."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_rule_6
    applies_to: "quantitative_ranges"
    rule: "Treat all amount ranges as unresolved for this candidate PCR until at least two independent original sources with compatible cottonseed-oil route, boundary, unit, and normalization basis are verified; do not infer a range from a single point or from soybean, rapeseed, or sunflower BAT values."
    source_ids:
      - us-epa-ap42-vegetable-oil-background-1995
      - eu-bat-food-drink-milk-2019
published_dataset_profile:
  dataset_role: "Foreground unit-process data package for crude cottonseed oil production, publishable after review as a secondary_dataset or background_dataset"
  downstream_use: "Product flow, process dataset, and lifecyclemodel construction for systems requiring crude cottonseed oil at the mill gate"
  allowed_use: "Attributional modelling with declared mass allocation; system-expansion scenarios when fully documented; route-specific benchmarking that does not imply unsupported quantitative ranges"
  excluded_use: "Refined cottonseed oil; generic vegetable oil without identity disclosure; comparative assertions across routes without aligned boundaries and data quality; automatic use of unresolved UUIDs or ranges"
  required_metadata: "Geography; reporting period; cottonseed receipt condition; extraction route; technology; product moisture and impurities; residual solvent status; process coverage; energy supply; solvent recovery; wastewater boundary; co-product destinations; allocation method; upstream dataset identities"
  required_quality_disclosure: "Foreground coverage; measurement and calculation split; mass/solvent/water closure; missing-flow justifications; proxy list; allocation factors; uncertainty and detection limits; unresolved reference-product and inventory UUIDs; absence of source-backed ranges"
  update_trigger: "New exact public Tiangong crude-cottonseed-oil flow; material route or equipment change; revised official BAT/PEF method; two compatible quantitative sources enabling a range; changed solvent, energy, co-product, or treatment practice; review finding"
