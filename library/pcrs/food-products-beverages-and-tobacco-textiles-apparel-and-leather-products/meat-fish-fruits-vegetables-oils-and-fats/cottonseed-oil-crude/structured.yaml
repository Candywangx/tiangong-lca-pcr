system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "foreground_start_and_end"
      rule: "Start at cottonseed receipt from the gin and end at clarified crude cottonseed oil at the mill gate; keep cultivation, ginning, and downstream refining outside this foreground boundary unless explicitly added and disclosed."
      source_ids:
        - unsd-cpc-3-0-structure-2025
        - us-epa-ap42-vegetable-oil-background-1995
    - rule_id: boundary_rule_2
      applies_to: "route_selection"
      rule: "Model only the declared mechanical, prepress-solvent, or direct/expander-solvent route. Solvent extraction and desolventizing are not applicable to a mechanical-only route."
      source_ids:
        - us-epa-ap42-vegetable-oil-background-1995
        - zia-cottonseed-oil-review-2021
    - rule_id: boundary_rule_3
      applies_to: "solvent_route"
      rule: "When hexane extraction is used, include extraction, oil/solvent evaporation and stripping, meal desolventizing, condensation and recovery, make-up solvent, wastewater containing solvent, and vented or fugitive hexane."
      source_ids:
        - us-epa-ap42-vegetable-oil-processing-1995
        - eu-bat-food-drink-milk-2019
    - rule_id: boundary_rule_4
      applies_to: "utilities_and_treatment"
      rule: "Include on-site steam or heat generation and on-site wastewater treatment only when operated by the reporting facility; otherwise represent purchased steam/heat and external treatment as product or waste-service inputs."
      source_ids:
        - eu-bat-food-drink-milk-2019
        - eu-pef-method-2021
