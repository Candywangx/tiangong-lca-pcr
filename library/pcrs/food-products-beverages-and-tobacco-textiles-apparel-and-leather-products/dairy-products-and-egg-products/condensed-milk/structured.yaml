allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "separable operations and product lines"
    rule: "Avoid allocation by subdividing independently metered reception, concentration, finishing, utility, and treatment operations wherever technically feasible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_internal_intermediates
    applies_to: "standardized milk, bulk condensed milk, rework, and recovered condensate"
    rule: "Internal transfers carry their measured upstream burdens and are not co-products. Rework must retain the burden of its originating lot; recovered condensate used internally reduces gross purchased-water demand without an avoided-product credit."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_exported_milk_components
    applies_to: "cream, skim milk, or other exported dairy co-products"
    rule: "After subdivision, allocate remaining shared burdens using a documented physical relationship that reflects the causal mass or solids transformation; if no defensible physical relationship exists, use economic allocation with contemporaneous prices and report a physical-allocation sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_and_recycling
    applies_to: "waste treatment, recovered material, and exported condensate"
    rule: "Keep treatment burdens with the generating system unless the selected downstream dataset implements another disclosed convention; do not claim avoided burdens or recycling credits twice."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_materials
      process_id: "milk_reception_and_standardization_concentration_and_formulation"
      flow_role: "received materials, internal transfers, formulation ingredients, composition, and exported dairy components"
      record_type: "weighbridge, calibrated tank or line meter, batch sheet, inventory ledger, laboratory release record"
      raw_fields: "material id; supplier; lot; opening and closing inventory; received, issued, returned, transferred, and exported mass; milkfat; total milk solids; protein in milk-solids-not-fat; sweetener fraction"
      collection_method: "reconcile physical meter or scale records with batch and inventory records"
      unit: "kg; kg/kg"
      frequency: "each lot, aggregated monthly or annually"
      temporal_coverage: "at least 12 representative consecutive months or the full campaign when shorter"
      site_scope: "all included lines and storage tanks"
      aggregation_rule: "sum net consumed or transferred mass by material and lot, then divide by net saleable reference-product mass"
      quality_evidence: "calibration records; inventory reconciliation; lot traceability; laboratory method and quality-control results"
    - protocol_id: cp_utilities
      process_id: "all_process_ids"
      flow_role: "electricity, fuels, steam, water, and recovered condensate"
      record_type: "fiscal or submeter reading, fuel invoice, boiler log, utility allocation record"
      raw_fields: "meter id; opening and closing reading; unit; fuel quantity; heating-value basis; steam conditions; condensate quantity; allocation driver; downtime"
      collection_method: "prefer process submeters; otherwise allocate a reconciled site total using documented operating hours, throughput, or engineering load"
      unit: "kWh; MJ; kg; m3"
      frequency: "continuous or per shift, aggregated monthly"
      temporal_coverage: "same reference period as production"
      site_scope: "all included utilities and directly attributable auxiliaries"
      aggregation_rule: "subtract verified non-PCR uses and divide the remaining amount by net saleable product; retain the allocation driver"
      quality_evidence: "meter calibration; invoice reconciliation; site energy and water balance; allocation worksheet"
    - protocol_id: cp_wastewater_and_losses
      process_id: "milk_reception_and_standardization_concentration_and_formulation"
      flow_role: "product loss, cleaning liquid, condensate disposition, wastewater, and treatment route"
      record_type: "effluent meter, waste ticket, batch deviation, mass-balance record, laboratory analysis"
      raw_fields: "stream id; origin; mass or volume; density; product solids; COD or other reported pollutant; destination; treatment; date"
      collection_method: "measure each material route; calculate unmeasured product loss only as a disclosed residual"
      unit: "kg; m3; kg pollutant"
      frequency: "per batch or daily, aggregated monthly"
      temporal_coverage: "same reference period as production"
      site_scope: "every included discharge and loss route"
      aggregation_rule: "sum by stream and destination, convert with measured density where needed, and normalize to reference output"
      quality_evidence: "meter calibration; chain-of-custody or treatment ticket; laboratory result; signed mass-balance review"
    - protocol_id: cp_packaging_and_output
      process_id: "final_packaging_and_dispatch"
      flow_role: "packaging input, gross product, net saleable output, off-spec product, and packaging reject"
      record_type: "bill of materials, line counter, checkweigher, warehouse release, reject log"
      raw_fields: "product lot; package material; units issued, returned, filled, accepted, and rejected; declared net mass; bulk dispatch mass; waste destination"
      collection_method: "reconcile packaging issue and line-output records to released product and rejects"
      unit: "kg; item"
      frequency: "each packaging lot or production shift"
      temporal_coverage: "same reference period as production"
      site_scope: "every included package or bulk-dispatch format"
      aggregation_rule: "calculate net saleable product from accepted units and verified net mass; aggregate materials and rejects by type"
      quality_evidence: "checkweigher calibration; bill of materials; warehouse reconciliation; reject disposition record"
    - protocol_id: cp_direct_emissions
      process_id: "concentration_and_formulation"
      flow_role: "direct fuel-combustion and other measured releases"
      record_type: "fuel record, continuous monitor, stack test, leak log, emission calculation"
      raw_fields: "fuel quantity; carbon content or factor; oxidation factor; monitored concentration and flow; operating time; refrigerant added and recovered"
      collection_method: "use monitored mass where available; otherwise calculate from collected activity and a cited carrier-specific factor"
      unit: "kg; kg/h; concentration unit"
      frequency: "per fuel lot, monitoring interval, test, or maintenance event"
      temporal_coverage: "same reference period as production"
      site_scope: "all in-boundary combustion and direct release points"
      aggregation_rule: "calculate by source, sum over the reference period, and divide by net saleable output without including upstream emissions"
      quality_evidence: "meter or monitor calibration; laboratory report; factor reference; calculation review"
  calculation_rules:
    - id: calc_net_material_consumption
      applies_to: "each material input"
      rule: "net consumed mass = opening inventory + receipts - closing inventory - documented returns or transfers out"
      inputs:
        - "inventory and movement records from cp_batch_materials or cp_packaging_and_output"
      output: "kg material consumed"
      source_ids:
        - mass-balance-identity
    - id: calc_reference_output
      applies_to: "reference product"
      rule: "net saleable mass = accepted package count × verified net mass per package + metered accepted bulk-dispatch mass"
      inputs:
        - "accepted unit count"
        - "checkweigher result"
        - "bulk meter from cp_packaging_and_output"
      output: "kg net saleable condensed milk"
      source_ids:
        - mass-balance-identity
    - id: calc_normalized_inventory
      applies_to: "every inventory row"
      rule: "normalized amount = period amount attributable to this PCR divided by net saleable condensed-milk mass in the same period"
      inputs:
        - "collected or calculated period amount"
        - calc_reference_output
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
        - mass-balance-identity
    - id: calc_mass_balance
      applies_to: "each process and reporting period"
      rule: "mass-balance residual = total wet-mass inputs - measured product and co-product outputs - measured waste and wastewater outputs - quantified water vapour or other measured releases; investigate and disclose material residuals"
      inputs:
        - "batch materials"
        - "product output"
        - condensate
        - waste
        - wastewater
        - emissions
      output: "kg and percent residual"
      source_ids:
        - mass-balance-identity
    - id: calc_energy
      applies_to: "purchased energy"
      rule: "delivered energy = metered energy or fuel quantity × documented heating value; keep electricity and each fuel carrier separate"
      inputs:
        - "utility records from cp_utilities"
      output: "kWh electricity and MJ thermal energy per reference product"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_allocation_factor
      applies_to: "exported co-products"
      rule: "allocation factor = selected documented physical or economic indicator for one output divided by the sum of that indicator across jointly produced outputs"
      inputs:
        - "output quantities and solids or contemporaneous price records"
      output: "dimensionless burden share"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and every inventory exchange"
      requirement: "Use the verified condensed-milk reference UUID and resolve every non-reference Tiangong flow UUID before activation; retain product subtype, composition, package, geography, technology, and period qualifiers."
      evidence: "Tiangong exact readback; product specification; lot and supplier records"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Use at least 12 representative consecutive months unless production is a shorter campaign; explain shutdowns, abnormal lots, and extrapolation."
      evidence: "dated meter, batch, inventory, and release records"
    - id: dq_completeness
      applies_to: "material, energy, water, waste, wastewater, and direct emissions"
      requirement: "Reconcile all included processes and report coverage by mass, energy, and operating time; do not omit a material stream solely because its Tiangong UUID remains unresolved."
      evidence: "mass, energy, and water balances; source register; unresolved-identity register"
    - id: dq_measurement
      applies_to: "foreground records and calculations"
      requirement: "Retain calibration, laboratory methods, meter hierarchy, conversion factors, allocation drivers, and calculation worksheets sufficient for independent reproduction."
      evidence: "calibration certificates; laboratory QA; signed calculation review"
    - id: dq_representativeness
      applies_to: "upstream datasets and foreground aggregation"
      requirement: "Match geography, technology, product state, and reference period; disclose every proxy and assess sensitivity for raw milk, sugar, packaging, and energy proxies."
      evidence: "dataset metadata and proxy assessment"
    - id: dq_reasoned_ranges
      applies_to: "every reasoned_estimate range"
      requirement: "Treat the range only as a provisional QA screen; never substitute its midpoint for a foreground value without explicit scenario justification, and replace it with reviewed foreground or source-backed evidence before publication-critical use."
      evidence: "range-evidence review log and replacement decision"
    - id: dq_source_value_limits
      applies_to: "Codex specifications and BAT performance information"
      requirement: "Use composition limits, quality factors, naming provisions, BAT-associated performance levels, and monitoring frequencies only for identity, applicability, compliance context, or data-quality checks; never insert them as generic LCI amounts."
      evidence: "product specification and source-use review against codex-cxs-282-1971, codex-cxs-206-1999, and eu-fdm-bat-2019-2031"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require exactly one reference output of 1 kg using Condensed Milk UUID 5db242cb-3e7b-46fc-89cc-d676dd2a1fd3, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids: []
  - rule_id: validate_product_scope
    applies_to: "product identity and composition"
    rule: "Require CPC 3.0 code 22222 and declared subtype, sweetener, milkfat, total milk solids, and milk protein in milk-solids-not-fat; reject CPC 22221, CPC 22229, milk powders, and ordinary liquid milk, and require dairy terms to match the declared product."
    source_ids:
      - unsd-cpc-3-0-22222
      - codex-cxs-282-1971
      - codex-cxs-206-1999
  - rule_id: validate_process_coverage
    applies_to: "foreground process map"
    rule: "Require all three process ids and evidence that cleaning, directly serving utilities, losses, wastewater routes, and direct site emissions were included or explicitly demonstrated not applicable."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: validate_mass_and_yield
    applies_to: "process and overall mass balance"
    rule: "Require measured net output, input and output reconciliation, and a reviewed explanation for every material residual; reasoned-estimate ranges are warnings, not replacement values."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_allocation
    applies_to: "multi-output operations"
    rule: "Require subdivision evidence or a declared allocation method, indicator values, factors summing to one, and sensitivity when economic allocation is used."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_data_quality
    applies_to: "reporting period and source package"
    rule: "Require aligned temporal coverage, calibration and laboratory evidence, upstream dataset metadata, proxy disclosure, and an explicit list of unresolved identities or range evidence."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: validate_no_double_counting
    applies_to: "energy, water recovery, rework, waste, and recycling"
    rule: "Reject double counting between site totals and process submeters, between fuel combustion and purchased heat, between recovered condensate and purchased water, or between waste treatment and recycling credits."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground condensed-milk production dataset at the manufacturing gate"
  downstream_use: "secondary_dataset; background_dataset after methodology review, UUID resolution, and representative upstream linking"
  allowed_use: "LCA process and lifecyclemodel construction for the declared condensed-milk subtype, composition, technology, geography, package format, and reference period"
  excluded_use: "Evaporated milk, milk powder, infant formula, non-dairy condensed beverages, undeclared product subtypes, or geography and technology outside the documented representativeness without sensitivity analysis"
  required_metadata: "PCR id and version state; CPC code; product subtype; composition; package or bulk format; reference UUIDs; site geography; technology; reference period; capacity and utilization context; allocation; included operations; upstream datasets; data owner and review status"
  required_quality_disclosure: "Coverage and reconciliation; calibration and laboratory evidence; temporal, geographic, and technological representativeness; proxy datasets; allocation sensitivity; losses and wastewater routes; unresolved UUIDs; all reasoned-estimate ranges and their replacement status"
  update_trigger: "Change in product subtype or composition, milk sourcing, concentration technology, energy or water system, package format, allocation, wastewater route, site geography, material throughput, applicable standard, reference-flow identity, or evidence that invalidates a QA guardrail"
