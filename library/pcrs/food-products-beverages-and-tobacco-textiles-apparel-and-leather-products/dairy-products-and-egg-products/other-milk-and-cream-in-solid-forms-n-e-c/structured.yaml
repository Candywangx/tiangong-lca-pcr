allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "multifunctional foreground processes"
    rule: "First use separate meters, batch records, and unit-process subdivision to assign inputs, outputs, wastes, and emissions directly. Consider system expansion only when the additional function and study result are reported consistently."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical_relationship
    applies_to: "inseparable shared operations"
    rule: "If subdivision or system expansion is not feasible, use a quantified physical relationship that represents the causal use of the shared operation, such as measured equipment time, evaporated-water load, dryer feed solids, net product mass, or occupied storage volume-time. Record the driver and calculation."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_other_relationship
    applies_to: "residual multifunctionality"
    rule: "Use economic or another relationship only when no defensible physical relationship exists. Use contemporaneous values at the point of co-production, disclose the period and sensitivity, and do not apply a generic dairy allocation factor."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_internal_recovery
    applies_to: "recovered powder, condensate, permeate, rework, and reusable water"
    rule: "Treat an internal recovery loop as an internal flow and avoid burden or credit duplication. An exported stream is a co-product or waste according to its documented destination and regulatory status."
    source_ids:
      - eu-fdm-bat-2019
      - eu-pef-2021
  - rule_id: allocation_mass_balance_check
    applies_to: "all allocation results"
    rule: "Reconcile allocated material, energy, product, co-product, waste, and emission totals to the unallocated facility or batch records. Report unallocated residuals and the reason."
    source_ids:
      - eu-pef-2021
      - eu-fdm-bat-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_receipt_identity_and_composition
      process_id: "receipt_and_identity_gate"
      flow_role: "received, accepted, rejected, and returned dairy material; identity gate"
      record_type: "weighbridge, tank gauge, lot record, product specification, certificate, laboratory result, disposition record"
      raw_fields: "supplier lot; species; commercial name; received state; mass; temperature where material; moisture or total solids; fat; protein; other identity constituents; ingredients; standard status; gate decision; destination"
      collection_method: "Calibrated mass measurement plus representative batch sampling and documented analytical method; retain the gate checklist and rejected alternatives."
      unit: "kg; kg/kg; declared analytical units"
      frequency: "each receipt lot and production batch"
      temporal_coverage: "all lots contributing to the represented batch or campaign"
      site_scope: "each supplying site and receiving facility"
      aggregation_rule: "Sum masses only after lot identity and analytical basis are aligned; retain weighted composition and rejected mass separately."
      quality_evidence: "calibration, sampling plan, laboratory method, certificates, chain of custody, and release or rejection record"
    - protocol_id: cp_formulation_and_standardisation
      process_id: "formulation_and_standardisation"
      flow_role: "formulation inputs, prepared feed, separated streams, and losses"
      record_type: "recipe, batch sheet, scale or flowmeter, separator record, laboratory result, inventory issue, disposition record"
      raw_fields: "component identity; supplier lot; input and output mass; composition; total solids; equipment time; separated stream; loss; destination"
      collection_method: "Reconcile recipe issues and measured process transfers to batch outputs on a consistent wet-mass and solids basis."
      unit: "kg; kg/kg; h"
      frequency: "each included batch"
      temporal_coverage: "full represented batch or campaign"
      site_scope: "each included line and facility"
      aggregation_rule: "Calculate per-batch component and solids balances before normalization; do not average across materially different formulations."
      quality_evidence: "approved recipe, scale or meter calibration, laboratory result, batch reconciliation, and deviation record"
    - protocol_id: cp_concentration_mass_energy_and_water
      process_id: "concentration"
      flow_role: "feed, concentrate, condensate or permeate, rejects, electricity, and heat"
      record_type: "flowmeter, tank gauge, laboratory result, utility meter, steam meter, fuel invoice, operating log"
      raw_fields: "technology; stage; feed and output mass; moisture or total solids; electricity; steam or heat; fuel; recovered water; reject; operating time; heat recovery"
      collection_method: "Collect synchronized material and utility records for each concentration stage and document conversion and recovered-energy treatment."
      unit: "kg; kg/kg; m3; kWh; MJ; original invoice units"
      frequency: "each batch, meter interval, and campaign"
      temporal_coverage: "all concentration runs contributing to the dataset"
      site_scope: "each included concentration line and utility source"
      aggregation_rule: "Reconcile stage mass and solids, then allocate shared utilities by a documented physical driver and normalize to net reference product."
      quality_evidence: "meter calibration, laboratory result, invoice reconciliation, equipment log, and mass-balance review"
    - protocol_id: cp_drying_batch_records
      process_id: "drying"
      flow_role: "dryer feed, energy, bulk product, recovered powder, and drying loss"
      record_type: "batch sheet, feed and product scales, moisture analysis, electricity and heat meters, recovery-system record, waste record"
      raw_fields: "dryer technology; feed mass and solids; product mass and moisture; electricity; heat or fuel; recovered powder; rework; off-spec mass; operating time"
      collection_method: "Synchronize feed, release, utility, recovery, and disposition records to the same dryer batch or campaign."
      unit: "kg; kg/kg; kWh; MJ; h"
      frequency: "each dryer batch and meter interval"
      temporal_coverage: "all drying runs contributing to the represented product"
      site_scope: "each included dryer and finishing stage"
      aggregation_rule: "Calculate wet-mass, solids, and water-removal balances before normalization; exclude internal recirculation from gross output."
      quality_evidence: "calibrated meters and scales, analytical method, release record, rework trace, and batch mass-balance sign-off"
    - protocol_id: cp_conditioning_and_packaging
      process_id: "conditioning_and_packaging"
      flow_role: "bulk transfer, net product, packaging, packing energy, and losses"
      record_type: "batch transfer, checkweigher, packaging specification, material issue and return, electricity meter, scrap and disposition record"
      raw_fields: "bulk input; net released product; product moisture; packaging component and mass; units packed; electricity; product loss; packaging scrap"
      collection_method: "Reconcile net packed product and each packaging component to batch issues, returns, and scrap."
      unit: "kg; item; kWh"
      frequency: "each packing batch"
      temporal_coverage: "all packing batches contributing to the dataset"
      site_scope: "each packing line and packaging configuration"
      aggregation_rule: "Normalize packaging and energy to net product mass; keep packaging outside the 1 kg reference amount."
      quality_evidence: "checkweigher verification, packaging bill of materials, meter records, stock reconciliation, and release record"
    - protocol_id: cp_site_energy_records
      process_id: "receipt_and_identity_gate"
      flow_role: "shared and process electricity"
      record_type: "submeter, main meter, invoice, equipment run log"
      raw_fields: "meter id; time interval; kWh; supplier mix; equipment; run time; batch; physical allocation driver"
      collection_method: "Prefer process submeters; otherwise reconcile the site meter or invoice and allocate only by a documented physical driver."
      unit: "kWh; h; driver-specific unit"
      frequency: "meter interval and each campaign"
      temporal_coverage: "representative operating period covering all modelled batches"
      site_scope: "each included site and electricity source"
      aggregation_rule: "Assigned process electricity plus disclosed unassigned use shall reconcile to the site total for the same interval."
      quality_evidence: "meter calibration or verification, invoice, supplier evidence, run logs, and allocation workbook"
    - protocol_id: cp_cleaning_and_environmental_records
      process_id: "cleaning_and_environmental_control"
      flow_role: "water, cleaning and treatment chemicals, energy, recovery, wastewater, sludge, and wastes"
      record_type: "water meter, dosing log, chemical issue, CIP log, energy meter, recovered-stream log, waste-transfer record"
      raw_fields: "water; chemical identity and strength; dose; cycle; electricity; heat; recovered material; wastewater; sludge; waste mass; destination"
      collection_method: "Record each CIP or cleaning cycle and environmental-control operation, separating reusable streams from wastewater and waste."
      unit: "kg; m3; kWh; MJ; cycle"
      frequency: "each cycle and monitoring interval"
      temporal_coverage: "all operations serving the represented batch or campaign"
      site_scope: "each process area and treatment system in scope"
      aggregation_rule: "Allocate shared cleaning only by documented equipment, cycle, or production driver; reconcile water inputs to reuse, effluent, retention, and loss where measurable."
      quality_evidence: "calibrated meters, dosing verification, CIP log, waste manifest, destination evidence, and water-balance review"
    - protocol_id: cp_emissions_and_effluent_monitoring
      process_id: "cleaning_and_environmental_control"
      flow_role: "drying dust, wastewater pollutants, and direct site emissions"
      record_type: "stack test, continuous or periodic monitor, wastewater flowmeter, laboratory result, fuel record, emission-factor calculation"
      raw_fields: "source; pollutant; flow; concentration; sampling time; operating state; treatment state; fuel activity; factor; result; detection limit"
      collection_method: "Match flow and concentration in time, or calculate from collected activity data with a documented factor; identify untreated, treated, and discharge points."
      unit: "kg; m3; kg/m3; original instrument units"
      frequency: "each required monitoring event and representative operating period"
      temporal_coverage: "period aligned to the represented production campaign"
      site_scope: "every relevant controlled emission and discharge point"
      aggregation_rule: "Convert to emitted mass for the same period, then normalize to net product; do not replace measurements with permit or BAT limits."
      quality_evidence: "accredited method where applicable, sampling chain, laboratory QA, instrument calibration, operating log, and calculation record"
  calculation_rules:
    - id: calc_reference_normalisation
      applies_to: "every inventory row"
      rule: "normalized amount = amount attributable to represented batches / net mass of conforming factory-gate product; packaging mass is not included in the denominator"
      inputs:
        - "attributable flow amount"
        - "net released product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_product_specific_bom
      applies_to: "formulation and packaging"
      rule: "Build the product-specific ingredient and packaging bill of materials from issued quantity minus returned and separately recorded scrap; retain each component as an underlying flow."
      inputs:
        - recipe
        - issue
        - return
        - scrap
        - "net product"
      output: "kg component per kg net product"
      source_ids:
        - eu-pef-2021
    - id: calc_solids_and_water_balance
      applies_to: "receipt, formulation, concentration, and drying"
      rule: "For each aligned batch, reconcile wet mass and measured solids across inputs, product, co-products, recovered streams, wastewater, dust, rejects, hold-up, and documented uncertainty; never infer composition from a CXS limit."
      inputs:
        - masses
        - "moisture or total-solids analyses"
        - "recovery and loss records"
      output: "batch solids and water reconciliation plus unresolved residual"
      source_ids:
        - eu-fdm-bat-2019
        - eu-pef-2021
    - id: calc_shared_utility_assignment
      applies_to: "shared electricity, heat, water, cleaning, storage, and treatment"
      rule: "Assign directly measured use first; otherwise multiply the matched facility total by the documented physical driver share. Report unassigned use and avoid double counting recovered energy or internal loops."
      inputs:
        - "facility total"
        - "process meter"
        - "equipment time or another causal driver"
        - "recovery record"
      output: "attributable utility amount per process and batch"
      source_ids:
        - eu-pef-2021
        - eu-fdm-bat-2019
    - id: calc_emission_mass
      applies_to: "stack and wastewater emissions"
      rule: "emitted mass = matched flow or discharged volume multiplied by measured concentration, with unit conversion and treatment point stated; alternatively use collected activity multiplied by a documented source factor."
      inputs:
        - "flow or volume"
        - concentration
        - activity
        - factor
        - "time alignment"
      output: "kg pollutant per represented period and per kg product"
      source_ids:
        - eu-fdm-bat-2019
        - eu-pef-2021
    - id: calc_allocation_reconciliation
      applies_to: "multifunctional processes"
      rule: "Sum directly assigned and allocated burdens across all outputs and compare with the unallocated process total for the same period; disclose allocation driver, residual, and sensitivity where another relationship is used."
      inputs:
        - "process totals"
        - "direct assignments"
        - "output quantities"
        - "allocation drivers"
      output: "reconciled burden by output"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_scope_identity
      applies_to: "product eligibility"
      requirement: "Retain the CPC gate decision, commercial identity, species, bill of material, composition, applicable-standard decision, and reasons CPC 22211, CPC 22212, and other specific categories were rejected."
      evidence: "product specification, label or sales description, batch recipe, laboratory results, supplier evidence, and signed gate review"
    - id: dq_route_specificity
      applies_to: "process map"
      requirement: "Identify the received-feed state and each actual formulation, separation, concentration, drying, conditioning, recovery, and treatment technology; do not substitute the representative cream-powder route for unverified site facts."
      evidence: "process flow diagram, equipment list, operating procedure, batch sheet, and site confirmation"
    - id: dq_temporal_alignment
      applies_to: "all foreground records"
      requirement: "Use records covering the same batch, campaign, or justified representative period. State the reference year, seasonality, downtime, abnormal operations, and excluded batches."
      evidence: "timestamped batch, meter, laboratory, invoice, maintenance, and deviation records"
    - id: dq_completeness
      applies_to: "material, energy, waste, and emissions"
      requirement: "Reconcile all known inputs and outputs at process and site level, including internal recovery, rework, losses, wastewater, dust, packaging, and direct emissions. List every data gap or omission."
      evidence: "product and solids balances, utility reconciliation, water balance, waste manifests, emission inventory, and completeness checklist"
    - id: dq_measurement_quality
      applies_to: "measured and calculated quantities"
      requirement: "Document instrument identity, calibration or verification, sampling, analytical method, detection limit where relevant, unit conversion, and calculation version."
      evidence: "calibration certificates, sampling plan, laboratory QA, meter checks, invoices, and calculation workbook"
    - id: dq_representativeness
      applies_to: "foreground and upstream datasets"
      requirement: "Assess technological, geographical, time-related representativeness, precision, completeness, methodological consistency, documentation, nomenclature, and review for material datasets."
      evidence: "data-quality assessment and source metadata consistent with the study goal"
    - id: dq_no_limit_as_inventory
      applies_to: "standard and BAT references"
      requirement: "Use product-standard provisions and BAT levels only for applicability, specification, or QA context. Do not enter them as measured composition, resource use, wastewater, dust, or other LCI amounts."
      evidence: "source-use review showing each numeric inventory value originates from a site, batch, supplier, dataset, or documented factor record"
validation_rules:
  - rule_id: validate_residual_gate
    applies_to: "product identity"
    rule: "Fail validation unless the dataset records a positive CPC 22219 gate and explicit rejection of CPC 22211, CPC 22212, and every other plausible specific category."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_required_qualifiers
    applies_to: "reference flow"
    rule: "Fail validation when commercial name, species, measured composition basis, ingredients or constituents, applicable-standard decision, received-feed state, concentration route, drying technology, batch, site, or time period is missing."
    source_ids:
      - codex-cxs-206-1999
      - codex-cxs-207-1999
  - rule_id: validate_reference_mass
    applies_to: "reference product"
    rule: "The quantitative reference shall equal 1 kg net conforming product using the stated Mass flow property and unit group; packaging shall be inventoried but excluded from net mass."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_process_route
    applies_to: "process map and inventory"
    rule: "Receipt and gate, drying, conditioning and packaging, and cleaning and environmental control shall be present. Formulation and concentration shall match the declared route and cannot be silently omitted when performed."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validate_product_specific_records
    applies_to: "foreground inventory"
    rule: "Reject a generic or standard-limit-derived inventory where product-specific BOM, manufacturing activity, composition, and release records are required."
    source_ids:
      - eu-pef-2021
      - codex-cxs-207-1999
  - rule_id: validate_mass_and_solids
    applies_to: "batch balance"
    rule: "Require a wet-mass and milk-solids reconciliation covering product, co-products, recovered streams, rework, losses, wastewater, dust, and stated residual uncertainty."
    source_ids:
      - eu-fdm-bat-2019
      - eu-pef-2021
  - rule_id: validate_energy_water_emissions
    applies_to: "utilities and direct flows"
    rule: "Require site or batch records for electricity, heat or fuel, water, cleaning chemicals, wastewater, dust, and other material direct emissions. A BAT or permit limit is not acceptable as an LCI value."
    source_ids:
      - eu-fdm-bat-2019
      - eu-pef-2021
  - rule_id: validate_allocation
    applies_to: "multifunctionality"
    rule: "Verify the hierarchy of subdivision or system expansion, then physical relationship, then another disclosed relationship; require reconciliation to unallocated totals and prevent double counting internal recovery."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_upstream_linkage
    applies_to: "purchased materials and services"
    rule: "Require traceable upstream datasets and state, geography, time, technology, and quality metadata for dairy materials, ingredients, utilities, chemicals, packaging, transport in scope, and treatment services."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_data_quality_and_gaps
    applies_to: "dataset publication"
    rule: "Require temporal coverage, calibration and analytical evidence, representativeness assessment, completeness review, disclosure of exclusions and data gaps, and an update trigger."
    source_ids:
      - eu-pef-2021
      - eu-fdm-bat-2019
published_dataset_profile:
  dataset_role: "Product-specific foreground production dataset for one declared CPC 22219 solid milk or cream product and factory-gate route."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Use as a factory-gate foreground dataset or reviewed background dataset only for products that pass the same residual-category gate and match species, composition, received-feed state, technology, geography, time, allocation, and packaging conditions."
  excluded_use: "Do not use for whole milk powder, skim milk powder, whey powder, liquid products, other specifically classified dairy products, unverified formulations, a generic dairy-powder average, or downstream stages not modelled."
  required_metadata: "PCR id; CPC gate and rejected alternatives; product and commercial name; species; bill of material; measured composition and basis; applicable standards; site and geography; reference period; received-feed state; concentration and drying route; process map; allocation; packaging; upstream dataset references; collection and calculation protocol versions."
  required_quality_disclosure: "Data source for every material flow; meter and laboratory coverage; technological, geographical, and temporal representativeness; precision; completeness; mass, solids, utility, and water reconciliation; direct-emission monitoring; allocation drivers; data gaps; exclusions; deviations; reviewer status."
  update_trigger: "Reassess and update when product identity or classification changes; species, formulation, composition, supplier feed state, concentration or drying technology, recovery, packaging, site, allocation, monitoring method, product standard, or source evidence changes materially; or when the represented data period no longer reflects normal production."
data_sources:
  - id: "unsd-cpc-3-0-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 structure, 30 June 2025, official source file: https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv (retrieved 2026-06-23)"
    used_for: "CPC 22219 residual-leaf identity and exclusion of the named sibling leaves CPC 22211 and CPC 22212."
  - id: "codex-cxs-206-1999"
    type: "standard"
    reference: "Codex Alimentarius, CXS 206-1999, General Standard for the Use of Dairy Terms."
    used_for: "Dairy-term applicability and product-identity gate only; no LCI amounts."
  - id: "codex-cxs-207-1999"
    type: "standard"
    reference: "Codex Alimentarius, CXS 207-1999, Standard for Milk Powders and Cream Powder."
    used_for: "Concrete-product scope and specification applicability only when the product is covered; compositional provisions are not extrapolated across CPC 22219 and are not LCI amounts."
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on the use of the Environmental Footprint methods, CELEX 32021H2279: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32021H2279 (retrieved 2026-08-12)"
    used_for: "Product-specific bill of materials and manufacturing data, complete LCI, company-specific data, allocation hierarchy, data quality, packaging, and disclosure."
  - id: "eu-fdm-bat-2019"
    type: "official_guidance"
    reference: "Commission Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries, CELEX 32019D2031: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32019D2031 (retrieved 2026-08-12)"
    used_for: "Dairy process decomposition, resource and emission inventory, concentration and drying route disclosure, cleaning, wastewater, dust, monitoring, and record-quality requirements; BAT levels are not used as LCI values."
