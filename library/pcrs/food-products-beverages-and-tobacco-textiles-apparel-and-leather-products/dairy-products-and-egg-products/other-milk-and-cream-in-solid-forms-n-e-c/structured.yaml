system_boundary:
  rules:
    - rule_id: boundary_scope_gate
      applies_to: "product eligibility"
      rule: "Apply and retain the CPC 22219 gate before modelling. A product with unresolved identity or a match to CPC 22211, CPC 22212, or another more specific category shall not use this PCR."
      source_ids:
        - unsd-cpc-3-0-2025
        - codex-cxs-206-1999
        - codex-cxs-207-1999
    - rule_id: boundary_foreground_operations
      applies_to: "foreground facility"
      rule: "Include receipt and gate records, formulation or standardisation when performed, concentration when performed, drying, post-drying conditioning, packing, cleaning, product recovery, on-site wastewater or waste handling, and controlled direct emissions."
      source_ids:
        - eu-fdm-bat-2019
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased inputs and services"
      rule: "Link upstream datasets for all environmentally relevant dairy materials, ingredients, utilities, chemicals, packaging, transport, and treatment services that cross the boundary."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_complete_inventory
      applies_to: "cut-off and omissions"
      rule: "Inventory all known environmentally relevant material, energy, product, co-product, waste, and elementary flows. Disclose and justify every omission; neither a product standard nor a BAT performance level authorizes an LCI cut-off."
      source_ids:
        - eu-pef-2021
        - eu-fdm-bat-2019
    - rule_id: boundary_route_disclosure
      applies_to: "route-specific modelling"
      rule: "Keep separate records for membrane concentration, evaporation, spray drying, roller drying, freeze drying, fluidised-bed finishing, agglomeration, or another declared route actually used. Do not model an unverified representative route as site fact."
      source_ids:
        - eu-fdm-bat-2019
    - rule_id: boundary_downstream_exclusion
      applies_to: "default factory-gate study"
      rule: "Distribution, retail, use, and end-of-life are outside the default foreground boundary. Include them only under an explicitly expanded study scope and report them separately."
      source_ids:
        - eu-pef-2021
boundary_abstraction:
  declared_starting_condition: "Milk, cream, or a documented milk/cream intermediate received at the foreground facility gate, with species, supplier, physical state, temperature where material, composition, and moisture or total-solids basis declared."
  starting_condition_role: "Upstream dairy production and any supplier processing are represented by linked upstream datasets; the foreground begins with site receipt, identity gate, and storage or handling of the declared feed."
  product_classification_scope: "CPC 3.0 code 22219 only after the residual-category gate excludes CPC 22211, CPC 22212, and every more specific applicable product category."
  recursive_input_rule: "A purchased input that itself meets CPC 22219 is recorded once as a technosphere product input with a compatible upstream dataset and declared state; do not recursively reconstruct its production unless it is under foreground operational control."
  upstream_dataset_requirement: "Provide traceable upstream datasets for received dairy materials, added ingredients or milk constituents, electricity, fuels or heat, water supply, cleaning chemicals, packaging materials, transport brought into the study scope, and waste treatment."
  disclosure: "State the species, composition, received-feed state, concentration and drying route, included site processes, outsourced steps, allocation choices, rework, product losses, monitoring coverage, exclusions, and whether each input is primary, supplier-specific, or secondary."
