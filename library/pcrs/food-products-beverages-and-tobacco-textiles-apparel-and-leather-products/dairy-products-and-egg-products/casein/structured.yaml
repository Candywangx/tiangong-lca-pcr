allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared casein production operations"
    rule: "First use process subdivision, route-specific metering, or another documented separation that avoids allocation while preserving mass and energy balances."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_liquid_coproduct
    applies_to: "casein and beneficial liquid serum co-product"
    rule: "When subdivision cannot resolve shared burdens, apply a documented physical relationship only when it reflects the causal use of resources. If no defensible physical relationship exists, use an economic relationship based on a representative declared period and report a sensitivity result."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_cream_or_other_output
    applies_to: "additional milk-derived co-products"
    rule: "If cream separation or another milk-processing step is inside the foreground, disclose all co-products and apply the same hierarchy. Do not import a supplier allocation without confirming that its boundary and product state match the declared starting condition."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_and_rework
    applies_to: "wastes, residues, and internal rework"
    rule: "Do not treat internal rework as a second output. Record net rework once. Classify a liquid or solid stream as co-product only when its beneficial use and product status are evidenced; otherwise model its actual waste treatment."
    source_ids:
      - eu-fdm-bat-2019-2031
dataset_production:
  collection_protocols:
    - protocol_id: cp_coagulation_batch_records
      process_id: "casein_coagulation"
      flow_role: "feed, route agent, curd, and serum"
      record_type: "batch production record"
      raw_fields: "batch id; route; feed identity and mass; acidulant, starter, or enzyme identity and amount; curd mass; serum mass or volume and density; moisture or dry matter; timestamps"
      collection_method: "calibrated scales, tank levels, flow meters, formulation records, and laboratory results reconciled by batch"
      unit: "kg; L; kg/L; mass fraction"
      frequency: "each batch or continuous campaign with defined cut points"
      temporal_coverage: "all batches or campaigns in the declared reporting period"
      site_scope: "each producing facility and route"
      aggregation_rule: "sum attributable records, convert volumes with measured density, calculate dry mass with measured moisture, and normalize to net dry casein output"
      quality_evidence: "calibration records; batch sheets; laboratory certificates; reconciliation sign-off"
    - protocol_id: cp_washing_dewatering_records
      process_id: "curd_recovery_washing"
      flow_role: "curd transfer, water, dewatered curd, and wastewater"
      record_type: "batch and meter record"
      raw_fields: "batch id; inlet curd mass and moisture; make-up and recovered water; outlet curd mass and moisture; wastewater flow; recycle; destination"
      collection_method: "transfer scales, water and wastewater meters, moisture tests, and batch mass balance"
      unit: "kg; L; mass fraction"
      frequency: "each batch plus meter total for each campaign"
      temporal_coverage: "all production days in the declared reporting period"
      site_scope: "each washing and dewatering line"
      aggregation_rule: "reconcile inlet, outlet, recycle, and wastewater; count internal recirculation once; normalize to net dry casein"
      quality_evidence: "meter calibration; laboratory results; signed water balance; destination records"
    - protocol_id: cp_drying_finishing_records
      process_id: "drying_finishing"
      flow_role: "dryer feed, casein product, packaging, waste, and internal rework"
      record_type: "batch, inventory, and quality record"
      raw_fields: "campaign id; route; wet feed mass and moisture; net casein mass and moisture; grade; product specification; packaging issued and returned; off-specification mass; fines; rework; destinations"
      collection_method: "calibrated scales, moisture tests, warehouse issue records, quality release records, and waste manifests"
      unit: "kg; mass fraction"
      frequency: "each batch or dryer campaign"
      temporal_coverage: "all campaigns in the declared reporting period"
      site_scope: "each dryer and finishing line"
      aggregation_rule: "reconcile dry solids, net internal rework once, subtract packaging from reference product mass, and normalize to 1 kg net casein"
      quality_evidence: "scale calibration; laboratory certificate; release record; inventory reconciliation; waste manifest"
    - protocol_id: cp_resource_meter_records
      process_id: "casein_coagulation_curd_recovery_washing_drying_finishing"
      flow_role: "electricity and thermal energy"
      record_type: "meter and utility record"
      raw_fields: "meter id; process or line; timestamp; opening and closing readings; energy carrier; steam or fuel amount; conversion factor; operating time; allocation driver"
      collection_method: "calibrated submeters where available; otherwise documented engineering allocation from main meters and operating records"
      unit: "kWh; MJ; carrier-specific units"
      frequency: "meter interval and each production campaign"
      temporal_coverage: "complete declared reporting period including shutdown and cleaning where attributable"
      site_scope: "each facility, route, and major process"
      aggregation_rule: "subtract verified non-production loads, allocate shared use with documented causal driver, preserve electricity and thermal energy separately, and normalize to net casein"
      quality_evidence: "meter calibration; invoices; conversion-factor source; allocation worksheet; operating log"
    - protocol_id: cp_emission_and_wastewater_records
      process_id: "drying_finishing_onsite_wastewater_treatment"
      flow_role: "particulate release, treatment inputs, sludge, and treated discharge"
      record_type: "monitoring and transfer record"
      raw_fields: "source id; flow; concentration; parameter; sampling time; operating time; treatment electricity and chemicals; sludge mass and solids; receiving compartment; destination"
      collection_method: "site monitoring, laboratory analysis, flow meters, emission calculations, chemical issue records, and waste transfer records"
      unit: "kg; kg/h; mg/Nm3; m3; mg/L; kWh; mass fraction"
      frequency: "according to permit and monitoring plan, plus each material operating change"
      temporal_coverage: "representative normal operation and declared reporting period"
      site_scope: "each relevant emission point and treatment system"
      aggregation_rule: "integrate measured concentration and flow over attributable operation, calculate loads, normalize to net casein, and retain non-detect treatment"
      quality_evidence: "monitoring report; laboratory accreditation; calibration; chain of custody; permit record; calculation worksheet"
  calculation_rules:
    - id: calc_dry_mass
      applies_to: "curd and casein mass"
      rule: "dry mass = measured as-received mass × measured dry-matter fraction; never substitute a Codex maximum or minimum for the batch measurement"
      inputs:
        - "as-received mass"
        - "measured moisture or dry matter"
      output: "kg dry matter"
      source_ids:
        - codex-cxs-290-1995
    - id: calc_reference_normalisation
      applies_to: "all inventory rows"
      rule: "normalized amount = attributable process amount ÷ net kg casein reference product for the same route, facility, and period"
      inputs:
        - "attributable amount"
        - "net casein mass"
      output: "amount per 1 kg casein"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_route_weighting
      applies_to: "result containing both acid and enzyme routes"
      rule: "calculate each route first; combined amount = sum of route amount × route net-casein mass share, with shares and period disclosed"
      inputs:
        - "route-specific normalized amounts"
        - "route net-casein masses"
      output: "production-mass-weighted amount"
      source_ids:
        - codex-cxs-290-1995
        - eu-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "coagulation, washing, and drying"
      rule: "reconcile measured inputs with products, co-products, wastes, releases, inventory change, and documented measurement uncertainty on consistent moisture or dry-matter bases"
      inputs:
        - "measured masses"
        - moisture
        - recycle
        - "inventory change"
      output: "signed process mass balance and unexplained difference"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_emission_load
      applies_to: "monitored air and water releases"
      rule: "emitted load = representative measured concentration × measured flow integrated over attributable operating time, with unit conversions and non-detect handling documented"
      inputs:
        - concentration
        - flow
        - time
        - "detection-limit rule"
      output: "kg release per 1 kg casein"
      source_ids:
        - eu-fdm-bat-2019-2031
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Demonstrate that the output is casein and not a caseinate, other derivative, glue, adhesive, or formulated blend; declare edible or technical grade and the applicable route."
      evidence: "product specification; sales description; process flow; CXS 290 declaration when edible"
    - id: dq_route_specificity
      applies_to: "production inventory"
      requirement: "Keep acid and enzyme routes separate through data collection and calculation; record only the route agents actually used."
      evidence: "batch route code; formulation record; process flow; route-specific mass and energy reconciliation"
    - id: dq_primary_data
      applies_to: "foreground processes"
      requirement: "Use facility- and product-specific records for feed, route agents, water, energy, products, co-products, wastes, and direct releases. A reasoned estimate is not an acceptable final foreground value."
      evidence: "signed batch records; calibrated meters; invoices; laboratory and monitoring reports; calculation worksheets"
    - id: dq_temporal_completeness
      applies_to: "reporting period"
      requirement: "Cover every production batch or campaign and attributable shutdown, cleaning, rework, and treatment event in the declared period, or disclose and justify each gap."
      evidence: "production calendar; completeness reconciliation; missing-data log; gap treatment"
    - id: dq_estimate_replacement
      applies_to: "provisional ranges"
      requirement: "Treat every reasoned_estimate range as temporary authoring or QA screening only. Replace it with reviewed site- or batch-specific evidence once a complete declared reporting period is available, or immediately after a material change in route, equipment, grade, feed, packaging, or treatment."
      evidence: "approved replacement dataset; review record; change-control record"
    - id: dq_source_limits
      applies_to: "Codex and BAT sources"
      requirement: "Use Codex provisions for edible-product identity and route distinction and use BAT for process and monitoring coverage. Do not use composition limits, quality factors, BAT-AELs, or indicative BAT performance levels as generic casein LCI values."
      evidence: "source-use review linked to codex-cxs-290-1995 and eu-fdm-bat-2019-2031"
    - id: dq_representativeness
      applies_to: "published dataset"
      requirement: "Disclose technological, geographical, temporal, and precision representativeness, including the actual dryer, coagulation route, facility, period, and data gaps."
      evidence: "data quality assessment; dataset metadata; verification record"
validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "product identity"
    rule: "Fail validation if the declared output is a caseinate, other derivative, casein glue, adhesive, or formulation rather than casein."
    source_ids:
      - un-cpc-3-0-casein
      - codex-cxs-290-1995
      - codex-cxs-206-1999
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require product flow UUID 53f7b47f-8d1a-4420-8e79-e931990656e6, Mass property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and exactly 1 kg net casein after normalization."
    source_ids:
      - un-cpc-3-0-casein
  - rule_id: validate_route
    applies_to: "coagulation inventory"
    rule: "Require exactly the actual declared route for each batch or campaign. Acid-route agents shall not be reported for an enzyme-only route, and rennet or other enzyme agents shall not be reported for an acid-only route."
    source_ids:
      - codex-cxs-290-1995
  - rule_id: validate_boundary
    applies_to: "process coverage"
    rule: "Require coagulation, curd recovery and washing, drying and finishing, route-specific utilities, wastewater routing, wastes, direct releases, co-product destinations, and upstream milk-derived-feed dataset disclosure."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-pef-2021-2279
  - rule_id: validate_mass_basis
    applies_to: "mass and yield"
    rule: "Require consistent as-received, wet, dry, or corrected bases; reject any conversion that substitutes a Codex composition limit for measured batch moisture or dry matter."
    source_ids:
      - codex-cxs-290-1995
  - rule_id: validate_allocation
    applies_to: "multi-output processes"
    rule: "Require allocation hierarchy, selected relationship, period, factors, co-product classification, and sensitivity where economic allocation is used; factors shall sum to one within documented rounding."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_primary_records
    applies_to: "foreground values"
    rule: "Reject reasoned_estimate as a final amount for a published foreground dataset. Require traceable site or batch records and disclosed calculation for every material foreground row."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: validate_source_use
    applies_to: "source-derived constraints"
    rule: "Reject use of Codex composition or quality limits and BAT emission or performance levels as uniform inventory quantities. Site monitoring and production records shall determine the LCI."
    source_ids:
      - codex-cxs-290-1995
      - eu-fdm-bat-2019-2031
  - rule_id: validate_bilingual_alignment
    applies_to: "PCR renderings"
    rule: "Require the same ordered system-boundary, allocation, and validation rule identifiers in the English and Chinese renderings."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground casein production data package and factory-gate unit-process dataset"
  downstream_use: "May support secondary_dataset or background_dataset use after review of route, geography, time, technology, allocation, and data quality"
  allowed_use: "Route- and grade-matched modelling of casein production and downstream lifecycle models that preserve the declared reference-flow qualifiers"
  excluded_use: "Direct proxy for caseinates, other derivatives, casein glues or adhesives; substitution between acid and enzyme routes without disclosed weighting; use of provisional ranges as final LCI"
  required_metadata: "PCR id; casein flow UUID; facility and geography; reporting period; acid or enzyme route; edible or technical grade; moisture or dry-matter basis; animal origin; feed state; dryer and treatment technology; packaging status; allocation; upstream datasets"
  required_quality_disclosure: "Meter and batch coverage; laboratory and monitoring methods; data gaps; estimate replacement; mass-balance difference; allocation sensitivity; technological, geographical, temporal, and precision representativeness"
  update_trigger: "New reviewed site or batch evidence replacing a provisional range; material change in feed, route, equipment, grade, drying, packaging, wastewater treatment, abatement, allocation, or product specification; corrected UUID identity"
