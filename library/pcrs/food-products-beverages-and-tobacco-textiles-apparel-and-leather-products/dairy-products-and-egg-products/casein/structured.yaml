system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "foreground production"
      rule: "Include receipt of the declared milk-derived feed, route-specific coagulation, curd separation, washing, dewatering, drying, finishing, on-site utilities directly attributable to production, and treatment of foreground wastes through the point at which dry casein is ready at the manufacturing gate."
      source_ids:
        - codex-cxs-290-1995
        - eu-fdm-bat-2019-2031
    - rule_id: boundary_route_actual
      applies_to: "coagulation route"
      rule: "Include acidulant or starter-culture operations only for an acid route and rennet or other coagulating-enzyme operations only for an enzyme route. Do not create a hybrid average unless the reporting product and period actually contain both routes and the weighting is disclosed."
      source_ids:
        - codex-cxs-290-1995
    - rule_id: boundary_upstream_feed
      applies_to: "milk-derived feed"
      rule: "Represent milk production and supplier processing before the declared facility receipt point with traceable upstream datasets; do not silently recreate them inside the casein foreground."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_downstream
      applies_to: "post-gate stages"
      rule: "Exclude distribution, customer formulation, use, and end-of-life from the foreground production dataset. A downstream lifecycle model may add them without changing this reference flow."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_no_conversion
      applies_to: "product scope"
      rule: "Stop the casein foreground before neutralisation to caseinate or conversion to another derivative, glue, or adhesive."
      source_ids:
        - un-cpc-3-0-casein
        - codex-cxs-290-1995
boundary_abstraction:
  declared_starting_condition: "Milk-derived feed material received at the casein facility, normally skimmed milk or another declared product obtained from milk"
  starting_condition_role: "Upstream product input to foreground casein manufacture"
  product_classification_scope: "CPC 3.0 22260 Casein; the foreground output remains casein and excludes caseinates, derivatives, glues, and adhesives"
  recursive_input_rule: "Purchased casein entering reprocessing shall be recorded as a same-category input with its upstream dataset and shall not cause its upstream production to be recreated; internal rework that does not cross the facility boundary shall be disclosed and netted once in the batch balance"
  upstream_dataset_requirement: "Supplier- and route-representative dataset for the milk-derived feed, including geography, technology, time period, product state, dry-matter or moisture basis, and allocation status"
  disclosure: "Declare feed material, animal origin, edible or technical grade, coagulation route, facility location, reporting period, drying technology, on-site or off-site wastewater treatment, packaging status, and all allocation choices"
