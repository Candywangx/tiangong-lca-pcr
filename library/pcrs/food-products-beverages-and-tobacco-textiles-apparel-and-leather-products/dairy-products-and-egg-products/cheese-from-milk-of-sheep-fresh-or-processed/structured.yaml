allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Distinct product lines, routes, and batches"
    rule: "Subdivide or meter fresh, ripened, whey-cheese, brined, and processed routes and shared services before applying allocation. Do not use one category-wide factor."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_whey_and_coproducts
    applies_to: "Cheese, whey, cream, fines, and other valuable co-products"
    rule: "First determine whether process subdivision or an independently measurable physical relationship avoids allocation. If residual multifunctionality remains, document the selected physical or economic relationship, site-period masses and values, and a sensitivity result; do not infer a factor from Codex composition provisions."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_internal_whey
    applies_to: "Whey transferred to whey_cheese_recovery"
    rule: "Treat the whey as an explicit intermediate transfer and prevent double counting between primary cheesemaking and whey-cheese recovery. The final dataset shall state how upstream burdens accompany that transfer."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_shared_utilities
    applies_to: "Electricity, heat, refrigeration, water, cleaning, and wastewater"
    rule: "Use submetering where available; otherwise apply a documented causal driver such as operating time, equipment load, cleaned surface, water balance, or batch throughput. Record the driver and reconcile it to the facility total."
    source_ids:
      - eu-fdm-bat-2019
      - eu-pef-2021
  - rule_id: allocation_non_sheep_prohibited
    applies_to: "Mixed-species dairy inputs"
    rule: "Allocation shall never be used to relabel a mixed-milk or non-sheep-dairy product as sheep-milk cheese. Such a product is outside scope and shall be reclassified."
    source_ids:
      - unsd-cpc-3-0-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_lot_records
      process_id: "milk_reception_conditioning_primary_cheesemaking_whey_cheese_recovery_salting_ripening_brining_processed_cheese_manufacture"
      flow_role: "Milk, whey, and cheese intermediate inputs and transfers"
      record_type: "receiving ticket, batch sheet, tank or scale record, supplier declaration"
      raw_fields: "lot_id; supplier; animal_species; material_state; raw_or_heat_treated_status; gross_mass; tare_mass; net_mass; volume; density_basis; timestamp; destination_batch"
      collection_method: "Calibrated weighing or metering linked to lot and batch; retain sheep-origin evidence"
      unit: "kg; L or m3 with applicable density"
      frequency: "Each receipt and transfer"
      temporal_coverage: "All qualifying batches in the declared period"
      site_scope: "Each included facility and supplier lot"
      aggregation_rule: "Sum accepted net mass by material and batch; keep rejects and non-sheep lots separate"
      quality_evidence: "Scale or meter calibration; supplier species declaration; lot trace; reconciliation to inventory"
    - protocol_id: cp_ingredient_formula_records
      process_id: "primary_cheesemaking_whey_cheese_recovery_processed_cheese_manufacture"
      flow_role: "Cultures, coagulants, salt, acidulants, water additions, and other ingredients"
      record_type: "approved formulation, issue ticket, dosing log"
      raw_fields: "batch_id; ingredient_id; supplier_lot; dairy_species_origin; issued_mass; returned_mass; dosed_mass; concentration; formulation_revision"
      collection_method: "Reconcile issued, returned, and dosed quantities to approved batch formula"
      unit: "kg; L with density where applicable"
      frequency: "Each batch"
      temporal_coverage: "All qualifying batches"
      site_scope: "Each product and formulation at each facility"
      aggregation_rule: "Net ingredient use by batch and ingredient; no default recipe substitution"
      quality_evidence: "Formula approval; lot trace; dosing-device calibration; issue-return reconciliation"
    - protocol_id: cp_batch_output_records
      process_id: "milk_reception_conditioning_primary_cheesemaking_whey_cheese_recovery_salting_ripening_brining_processed_cheese_manufacture_final_conditioning_packaging"
      flow_role: "Intermediates, co-products, and saleable output"
      record_type: "batch yield sheet, scale record, tank meter, warehouse release"
      raw_fields: "batch_id; product_state; entry_mass; output_mass; whey_mass_or_volume; brine_state; ripening_start_end; pack_basis; disposition; timestamp"
      collection_method: "Direct weighing or metering, linked across process steps and dispositions"
      unit: "kg; L or m3 with applicable density"
      frequency: "Each batch or lot movement"
      temporal_coverage: "All qualifying batches"
      site_scope: "Each included process line"
      aggregation_rule: "Sum measured outputs by batch and disposition; normalize only after qualified reference mass is known"
      quality_evidence: "Calibration; batch genealogy; warehouse reconciliation; retained product-state declaration"
    - protocol_id: cp_brine_records
      process_id: "salting_ripening_brining"
      flow_role: "Salt, make-up water, reused brine, cheese carried brine, and spent brine"
      record_type: "tank log, dosing log, laboratory record, discharge ticket"
      raw_fields: "tank_id; cycle_id; initial_mass_or_volume; salt_addition; water_addition; transferred_in_out; concentration; cheese_lot; spent_brine_mass_or_volume; destination"
      collection_method: "Meter or weigh additions and removals; sample concentration when used in process calculation"
      unit: "kg; m3; concentration in recorded unit"
      frequency: "Each tank cycle and cheese lot"
      temporal_coverage: "All applicable cycles"
      site_scope: "Each brine system"
      aggregation_rule: "Tank mass balance by cycle; allocate only with documented cheese-lot driver"
      quality_evidence: "Meter/scale calibration; sample result; tank reconciliation; destination record"
    - protocol_id: cp_utility_records
      process_id: "facility_utilities_cleaning"
      flow_role: "Electricity, fuels, thermal energy, water, and cleaning materials"
      record_type: "meter, invoice, stock issue, production log"
      raw_fields: "meter_id; opening_closing_reading; carrier; unit; fuel_quality_or_calorific_value; water_use; chemical_id; concentration; operating_time; process_or_line"
      collection_method: "Read submeters where available; reconcile invoices and stocks; document shared-service allocation driver"
      unit: "kWh; MJ; kg; m3"
      frequency: "Per batch where metered, otherwise daily or monthly"
      temporal_coverage: "Representative declared period including seasonal and product-mix variation"
      site_scope: "Each facility and meter boundary"
      aggregation_rule: "Subtract verified non-process use; allocate shared totals with a documented causal driver; reconcile to facility total"
      quality_evidence: "Meter calibration; invoice; stock reconciliation; allocation worksheet; completeness check"
    - protocol_id: cp_wastewater_records
      process_id: "facility_utilities_cleaning"
      flow_role: "Wastewater and separately managed water streams"
      record_type: "discharge meter, water balance, sample and treatment record"
      raw_fields: "stream_id; destination; volume; sampling_time; pH; temperature; COD_or_TOC; nitrogen; phosphorus; chloride; conductivity; treatment"
      collection_method: "Meter discharge where possible; otherwise validated water balance; sample parameters relevant to treatment and permit context"
      unit: "m3 and parameter-specific units"
      frequency: "Continuous or per discharge; representative sampling"
      temporal_coverage: "Declared period"
      site_scope: "Each discharge point and treatment destination"
      aggregation_rule: "Sum by stream and destination; report loads only from matched flow and concentration data"
      quality_evidence: "Meter calibration; laboratory method; sampling plan; water-balance reconciliation"
    - protocol_id: cp_refrigerant_records
      process_id: "facility_utilities_cleaning"
      flow_role: "Refrigerant losses"
      record_type: "equipment service and refrigerant inventory log"
      raw_fields: "equipment_id; refrigerant; opening_charge; additions; recovery; closing_charge; service_date; leak_event"
      collection_method: "Substance-specific mass reconciliation over the declared period"
      unit: "kg"
      frequency: "Each service event and period close"
      temporal_coverage: "Declared period"
      site_scope: "All refrigeration serving included operations"
      aggregation_rule: "Additions plus opening charge minus recovered and closing charge, checked for unexplained imbalance"
      quality_evidence: "Service certificate; cylinder records; equipment inventory; reconciliation sign-off"
    - protocol_id: cp_packaging_records
      process_id: "final_conditioning_packaging"
      flow_role: "Primary, secondary, and tertiary packaging"
      record_type: "bill of materials, issue record, component specification, weighed sample"
      raw_fields: "packaging_component; material; supplier; component_mass; count_issued; count_returned; scrap_count; recycled_content_claim; pack_format"
      collection_method: "Reconcile issued and returned counts; convert using supplier specification or representative weighing"
      unit: "item; kg"
      frequency: "Each pack format and batch"
      temporal_coverage: "All qualifying production"
      site_scope: "Each product and packaging format"
      aggregation_rule: "Net count multiplied by verified component mass; keep materials and packaging levels separate"
      quality_evidence: "Current specification; sample-weighing record; issue-return reconciliation"
    - protocol_id: cp_loss_waste_records
      process_id: "all_included_processes"
      flow_role: "Rejected material, spills, curd fines, residual whey, spent brine, off-specification cheese, packaging waste, and other losses"
      record_type: "waste scale, production loss log, transfer note, treatment or sales record"
      raw_fields: "batch_id; material; mass_or_volume; solids_or_concentration_if_relevant; cause; destination; recovery_status; ticket_id"
      collection_method: "Weigh or meter at transfer; otherwise close a documented material balance"
      unit: "kg; m3"
      frequency: "Each event or batch"
      temporal_coverage: "Declared period"
      site_scope: "Each process and destination"
      aggregation_rule: "Sum by material, cause, and destination; do not net valuable co-products against waste"
      quality_evidence: "Scale/meter evidence; destination ticket; mass-balance reconciliation; supervisor review"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "Divide the qualifying period or batch quantity by released reference-product mass on the same declared net, drained, or as-packed basis."
      inputs:
        - "Row quantity"
        - "qualified released mass"
        - "packaging/brine basis"
      output: "Quantity per 1 kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_product_mass_basis
      applies_to: "Brined and packaged products"
      rule: "Reference mass equals measured cheese mass when declared drained/net; when declared as-packed, separately report cheese, free brine, and packaging and include only components explicitly stated by the functional unit."
      inputs:
        - Gross
        - tare
        - "drained cheese"
        - "free brine"
        - "and packaging masses"
      output: "Declared reference-product mass and component disclosure"
      source_ids:
        - fao-who-cxs-208-1999
        - eu-pef-2021
    - id: calc_batch_mass_balance
      applies_to: "Each included batch and process step"
      rule: "Reconcile measured inputs, outputs, transfers, retained inventory, and identified losses. Report the unexplained difference; do not force it into whey, wastewater, or product yield."
      inputs:
        - "Opening and closing inventory"
        - "all measured inputs and outputs"
      output: "Mass-balance residual and completeness flag"
      source_ids:
        - mass-balance-identity
        - eu-fdm-bat-2019
    - id: calc_volume_to_mass
      applies_to: "Milk, whey, brine, and liquid ingredients"
      rule: "Multiply measured volume by a batch-, temperature-, or supplier-applicable density; retain original volume and density provenance."
      inputs:
        - Volume
        - density
        - "material and temperature context"
      output: "Mass in kg"
      source_ids:
        - mass-balance-identity
    - id: calc_shared_services
      applies_to: "Shared utilities and cleaning"
      rule: "Allocate only after direct metering and subdivision are exhausted, using the documented causal driver and reconciling allocated totals to facility totals."
      inputs:
        - "Shared total"
        - "driver values"
        - "qualifying output mass"
      output: "Allocated service quantity per reference product"
      source_ids:
        - eu-pef-2021
        - eu-fdm-bat-2019
    - id: calc_coproduct_allocation
      applies_to: "Residual multi-output processes"
      rule: "Apply the reviewed site-period physical or economic relationship only when subdivision or a measurable physical relationship does not avoid allocation; preserve unallocated masses and sensitivity results."
      inputs:
        - "Co-product masses"
        - "physical driver or revenue"
        - period
        - "currency and prices where used"
      output: "Documented allocation factors and sensitivity result"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_species_traceability
      applies_to: "All milk, whey, cheese, and dairy ingredients"
      requirement: "Evidence shall demonstrate sheep-only dairy origin for every lot. Any mixed or unresolved species origin blocks use of this PCR."
      evidence: "Supplier declaration, lot genealogy, formula and receiving records"
    - id: dq_route_representativeness
      applies_to: "Product and process route"
      requirement: "Data shall represent the declared fresh/unripened, ripened, whey-cheese, brined, grated/powdered, or processed route and its actual technology, product mix, and operating pattern."
      evidence: "Process flow diagram, batch list, formulation revision, technology and operating records"
    - id: dq_temporal_coverage
      applies_to: "Foreground inventory"
      requirement: "Use a stated period that captures relevant seasonal milk composition, product mix, ripening occupancy, cleaning, and utility variation; justify exclusions and abnormal events."
      evidence: "Coverage register, production calendar, meter completeness report"
    - id: dq_measurement
      applies_to: "Mass, volume, energy, packaging, and discharge data"
      requirement: "Identify meter and scale boundaries, calibration status, conversions, missing-data treatment, and reconciliation residuals."
      evidence: "Calibration certificates, raw readings, conversion worksheet, mass and water balances"
    - id: dq_no_standard_as_lci
      applies_to: "Codex and BAT references"
      requirement: "Do not use product permissions, quality limits, BAT applicability thresholds, or indicative performance levels as foreground inventory values unless a separate, applicability-matched modelling decision is explicitly documented."
      evidence: "Source applicability review and site-record comparison"
    - id: dq_upstream_compatibility
      applies_to: "Sheep milk and dairy intermediate datasets"
      requirement: "Disclose supplier geography, production system, time, species, raw/processed state, and allocation method; explain proxies and avoid goat-milk substitution."
      evidence: "Upstream dataset metadata and supplier linkage"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The product-flow UUID shall equal d2800438-b79a-4065-98ab-b7b0fe10ce97, the flow-property UUID shall equal 93a60a56-a3c8-11da-a746-0800200b9a66, the unit-group UUID shall equal 93a60a57-a4c8-11da-a746-0800200c9a66, and the reference amount shall be 1 kg."
    source_ids: []
  - rule_id: validate_sheep_only
    applies_to: "Product and input identity"
    rule: "Fail when any dairy input is goat, cattle, buffalo, other-animal, mixed-species, or unresolved species origin. Mixed-milk products require reclassification."
    source_ids:
      - unsd-cpc-3-0-2025
      - fao-who-cxs-206-1999
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Fail when product state, raw-milk/heat-treatment status where relevant, ripening/holding duration where applicable, brine mass basis, ingredient/formulation state, packaging basis, facility-gate geography, or period is missing."
    source_ids:
      - fao-who-cxs-283-1978
      - fao-who-cxs-221-2001
      - fao-who-cxs-208-1999
  - rule_id: validate_route_processes
    applies_to: "Process map and inventory"
    rule: "Every included operation shall have a matching process section and records; every omitted conditional operation shall be justified against the declared route."
    source_ids:
      - eu-pef-2021
      - eu-fdm-bat-2019
  - rule_id: validate_atomic_inventory
    applies_to: "Inventory flow cards"
    rule: "Fail any card that combines multiple energy carriers, fuels, water uses, cleaning chemicals, refrigerants, wastewater pollutants, packaging materials, wastes, or emissions. Require one row per named substance, carrier, component, or waste stream; instantiate only rows used by the declared route."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validate_mass_reconciliation
    applies_to: "Batch and period balances"
    rule: "Report input, output, transfer, inventory-change, and loss terms plus the unexplained residual. Fail completeness when a material stream is silently forced into product, whey, wastewater, or waste."
    source_ids:
      - mass-balance-identity
      - eu-fdm-bat-2019
  - rule_id: validate_no_universal_intensity
    applies_to: "Yield, recipe, salt, water, energy, and waste quantities"
    rule: "Fail when a Codex limit, BAT contextual level, or generic category value is inserted as site foreground data without an applicability-matched source and declared modelling role."
    source_ids:
      - fao-who-cxs-283-1978
      - eu-fdm-bat-2019
  - rule_id: validate_allocation
    applies_to: "Multi-output and shared-service processes"
    rule: "Require subdivision assessment, the selected causal or allocation relationship, site-period inputs, reconciliation, and sensitivity disclosure; fail if allocation is used to conceal non-sheep dairy material."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_sources_and_period
    applies_to: "Foreground and upstream data"
    rule: "Require source provenance, temporal coverage, facility and supplier scope, measurement or calculation method, and disclosure of proxies and missing-data treatment."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset derived from a completed, reviewed foreground data package"
  downstream_use: "Product or process LCA for exclusively sheep-milk cheese at the declared facility-gate state; lifecycle model inputs with compatible geography, technology, product state, and time"
  allowed_use: "Fresh/unripened, ripened, whey-cheese/curd, brined, grated/powdered, or processed sheep-milk cheese when route, species origin, brine basis, ingredients, packaging, allocation, and data quality match"
  excluded_use: "Goat-, cattle-, buffalo-, other-animal-, or mixed-milk cheese; non-dairy analogues; substitution across unreported product states; use of Codex or BAT values as unverified foreground inventory"
  required_metadata: "PCR id; reference UUIDs; CPC context; sheep-only origin evidence; route and product state; raw-milk/heat-treatment status where relevant; ripening/holding duration; brine and packaging basis; formulation; facility geography and technology; period; upstream links; allocation method"
  required_quality_disclosure: "Batch and period coverage; calibration and meter boundaries; mass, water, and utility reconciliation; product and co-product yields from records; missing-data and proxy treatment; upstream compatibility; allocation drivers and sensitivity; source applicability"
  update_trigger: "Change in species or dairy origin, product state, recipe, brine or packaging basis, process technology, facility boundary, supplier or upstream dataset, allocation method, representative period, or applicable PCR/source rule"
data_sources:
  - id: "unsd-cpc-3-0-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, *Central Product Classification Version 3.0 Explanatory Notes*, subclass 22253, 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-12)"
    used_for: "Sheep-milk-only CPC scope; included fresh, whey/curd, grated/powdered, processed, blue-veined and other cheese states; exclusions of goat, cattle, buffalo, and other-animal cheese"
  - id: "fao-who-cxs-206-1999"
    type: "standard"
    reference: "Codex Alimentarius, *General Standard for the Use of Dairy Terms*, CXS 206-1999, amended 2022. https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXS+206-1999%2FCXS_206e.pdf (retrieved 2026-08-12)"
    used_for: "Dairy terminology and animal-origin declaration context; not an LCI quantity source"
  - id: "fao-who-cxs-283-1978"
    type: "standard"
    reference: "Codex Alimentarius, *General Standard for Cheese*, CXS 283-1978, amended 2024. https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXS+283-1978%2FCXS_283e.pdf (retrieved 2026-08-12)"
    used_for: "General cheese definition, product-state and ingredient applicability, and route declarations; no inferred recipe, yield, or LCI amount"
  - id: "fao-who-cxs-221-2001"
    type: "standard"
    reference: "Codex Alimentarius, *Group Standard for Unripened Cheese Including Fresh Cheese*, CXS 221-2001, amended 2022. https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXS+221-2001%2FCXS_221e.pdf (retrieved 2026-08-12)"
    used_for: "Applicability to unripened/fresh cheese and associated ingredient and product-state declarations; no inferred formulation or LCI amount"
  - id: "fao-who-cxs-208-1999"
    type: "standard"
    reference: "Codex Alimentarius, *Group Standard for Cheeses in Brine*, CXS 208-1999, amended 2022. https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXS+208-1999%2FCXS_208e.pdf (retrieved 2026-08-12)"
    used_for: "Brined-cheese applicability and the need to declare drained versus in-brine state; no inferred salt or brine amount"
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "European Commission, Commission Recommendation (EU) 2021/2279 on the use of Environmental Footprint methods, Annex I Product Environmental Footprint Method. http://data.europa.eu/eli/reco/2021/2279/oj (retrieved 2026-08-12)"
    used_for: "Functional unit and reference flow, system boundary, company-specific data, data quality, multifunctionality, allocation hierarchy, and reporting"
  - id: "eu-fdm-bat-2019"
    type: "official_guidance"
    reference: "European Commission, Commission Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries. http://data.europa.eu/eli/dec_impl/2019/2031/oj (retrieved 2026-08-12)"
    used_for: "Process, water, energy, raw-material, wastewater, waste-gas, and waste inventory design; metering and reconciliation; applicability-limited contextual checks only"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation-of-mass identity implemented through calc_batch_mass_balance; all terms are obtained from foreground records."
    used_for: "Batch completeness, volume-to-mass support, and unexplained-residual reporting; no category-wide yield factor"
