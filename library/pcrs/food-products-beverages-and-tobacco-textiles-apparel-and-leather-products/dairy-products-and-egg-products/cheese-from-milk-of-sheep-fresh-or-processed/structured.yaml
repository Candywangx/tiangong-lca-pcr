system_boundary:
  rules:
    - rule_id: boundary_sheep_only
      applies_to: "All dairy material entering the foreground system"
      rule: "Include only lots documented as sheep milk or sheep-milk-derived material. A mixed-species lot or non-sheep dairy ingredient makes the product outside this PCR and requires reclassification."
      source_ids:
        - unsd-cpc-3-0-2025
        - fao-who-cxs-206-1999
    - rule_id: boundary_factory_gate
      applies_to: "Foreground process chain"
      rule: "Include receipt and conditioning, applicable cheesemaking or processing operations, facility utilities and cleaning, product losses, wastewater and waste streams, final conditioning, packaging, and on-site storage through facility-gate release."
      source_ids:
        - eu-pef-2021
        - eu-fdm-bat-2019
    - rule_id: boundary_route_declaration
      applies_to: "Product state and route"
      rule: "Include only the operations actually performed and declare every omitted conditional process. Fresh/unripened, ripened, whey-cheese, brined, grated/powdered, and processed routes shall not be represented by one assumed recipe or process intensity."
      source_ids:
        - fao-who-cxs-283-1978
        - fao-who-cxs-221-2001
        - fao-who-cxs-208-1999
    - rule_id: boundary_upstream_link
      applies_to: "Sheep milk and sheep-milk dairy intermediates"
      rule: "Link upstream datasets rather than recursively reproducing their inventories; preserve supplier, geography, production system, and period compatibility."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_exclusions
      applies_to: "Downstream stages"
      rule: "Exclude distribution, retail, consumer use, and end-of-life unless the study explicitly expands the boundary and reports those stages separately."
      source_ids:
        - eu-pef-2021
boundary_abstraction:
  declared_starting_condition: "Sheep milk received at the cheese facility for primary manufacture, or separately identified sheep-milk cheese/whey intermediate received for processed or whey-cheese manufacture"
  starting_condition_role: "Defines the factory foreground entry point and preserves whether the route starts from sheep milk, sheep whey, or a sheep-milk cheese intermediate"
  product_classification_scope: "Cheese whose dairy origin is exclusively sheep milk and whose fresh/ripened/processed, brine, ingredient, and packaging state is declared"
  recursive_input_rule: "A sheep-milk cheese input used to make processed, grated, powdered, or otherwise further-processed cheese remains an explicit technosphere input with its own upstream dataset; do not recreate or double-count its prior cheese manufacture inside the receiving process"
  upstream_dataset_requirement: "Use traceable upstream datasets for sheep milk and all received sheep-milk dairy intermediates, ingredients, energy carriers, water, packaging, transport to the facility when in study scope, and waste treatment"
  disclosure: "Declare the foreground entry material, sheep-only evidence, process route, raw-milk/heat-treatment status where relevant, fresh/ripened/processed state, ripening or holding time, brine basis, ingredients, packaging basis, geography, technology, allocation method, and data period"
