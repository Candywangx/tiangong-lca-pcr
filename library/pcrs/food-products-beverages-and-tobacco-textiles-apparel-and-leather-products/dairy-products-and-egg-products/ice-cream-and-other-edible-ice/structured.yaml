allocation_rules:
  - rule_id: allocation_01
    applies_to: "Shared production and utility processes"
    rule: "Avoid allocation where practicable by submetering, batch tracing, and subdivision of mix preparation, freezing, packaging, cleaning, and cold-storage operations."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_02
    applies_to: "Unavoidable shared burdens"
    rule: "Use a causal physical driver: measured mass or batch time for formulation and line operations, metered energy or equipment runtime for freezing and hardening, storage occupancy multiplied by duration for frozen rooms, and cleaning event or circuit volume for sanitation."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_03
    applies_to: "Multiple saleable products"
    rule: "If a physical relationship cannot be established, use economic or another justified relationship only after documenting why subdivision and physical allocation are not feasible; disclose prices, period, geography, and sensitivity to the alternative allocation."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_04
    applies_to: "Rework and internal loops"
    rule: "Return controlled rework to the receiving batch without creating a second product output or duplicating upstream burdens. Record cross-period or cross-product transfers and apply the same causal allocation basis used for the receiving production."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_05
    applies_to: "Waste and recovered material"
    rule: "Treat outputs with no economic value as waste and include their treatment burdens. If a recovered output is sold or used as a co-product, disclose its quantity, destination, value status, and allocation or substitution method; do not grant an undocumented credit."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_recipe_and_mass
      process_id: "mix_preparation_and_control_freezing_and_finishing_packaging_hardening_storage"
      flow_role: "Ingredient, inclusion, intermediate, reference-product, and batch mass flows"
      record_type: "Batch production and recipe records"
      raw_fields: "product code; batch id; ingredient and inclusion id; supplier and origin; issued mass; returned mass; prepared-mix transfer mass; freezer output mass; packaged net mass; density; overrun convention; sample and heel mass; timestamps"
      collection_method: "Calibrated scales, formulation system, filling checks, and batch reconciliation"
      unit: "kg; declared volume unit where used for density"
      frequency: "Each batch or production campaign"
      temporal_coverage: "Representative production period covering declared formulations and seasonal operation"
      site_scope: "Each manufacturing site and line in scope"
      aggregation_rule: "Sum valid batch records by product and divide by released net edible mass; keep formulation variants separate until an aggregation rule is justified"
      quality_evidence: "Scale calibration; recipe authorization; batch reconciliation; release records; density or fill-weight checks"
    - protocol_id: cp_energy_and_runtime
      process_id: "mix_preparation_and_control_freezing_and_finishing"
      flow_role: "Electricity, fuel, steam, heat, and line runtime"
      record_type: "Meter, invoice, and equipment log"
      raw_fields: "meter id; opening and closing reading; carrier; unit; conversion factor; equipment runtime; batch id; throughput; shared users; allocation driver"
      collection_method: "Submeter preferred; otherwise reconcile invoices to site meters and allocate with measured runtime or throughput"
      unit: "original meter unit; kWh; MJ; carrier mass or volume"
      frequency: "Meter interval and each production campaign"
      temporal_coverage: "Same period as product output, including representative start-up and shutdown operation"
      site_scope: "Each site, utility system, and production line in scope"
      aggregation_rule: "Subtract non-production use where evidenced, then allocate shared use by documented causal driver and normalize to output"
      quality_evidence: "Meter calibration or verification; invoice reconciliation; runtime logs; conversion-factor source"
    - protocol_id: cp_cold_chain_and_refrigerant
      process_id: "freezing_and_finishing_packaging_hardening_storage"
      flow_role: "Freezing, hardening, frozen-storage energy, duration, temperature, and refrigerant"
      record_type: "Meter, warehouse, maintenance, and refrigerant ledger"
      raw_fields: "equipment id; refrigerant substance; nameplate charge; opening and closing stock; purchases; additions; recovery; transfers; meter readings; runtime; storage entry and exit; mass stored; temperature profile; defrost events"
      collection_method: "Equipment or system meter plus refrigerant mass-balance ledger and warehouse records"
      unit: "kg refrigerant; kWh or MJ; kg product; hour or day; °C"
      frequency: "Continuous or per meter interval; refrigerant reconciliation at least for the declared data period"
      temporal_coverage: "Full declared production and on-site storage period"
      site_scope: "Each refrigeration system, freezer, hardening unit, and frozen room serving the product"
      aggregation_rule: "Calculate system loss by mass balance; allocate energy and loss by causal equipment service, occupancy, throughput, and duration; retain uncertainty for shared systems"
      quality_evidence: "Maintenance invoices; calibrated scales; leak-test and recovery records; meter checks; warehouse movement and temperature logs"
    - protocol_id: cp_packaging_records
      process_id: "packaging_hardening_storage"
      flow_role: "Packaging inputs, packaging losses, and packaged-product losses"
      record_type: "Purchase, bill-of-materials, count, and waste records"
      raw_fields: "component id; material; supplier; item count; verified unit mass; issued and returned count; damaged count; waste mass; product-loss mass; pallet and film allocation"
      collection_method: "Procurement reconciliation, representative unit weighing, line counters, and segregated waste weighing"
      unit: "item; kg"
      frequency: "Each packaging lot and production campaign"
      temporal_coverage: "Same period as product output"
      site_scope: "Each packaging line and pack format in scope"
      aggregation_rule: "Convert counts to mass using verified unit mass; allocate shared tertiary packaging by shipped units or mass and document reuse cycles"
      quality_evidence: "Scale calibration; supplier specification; line-counter checks; waste tickets; bill-of-materials revision"
    - protocol_id: cp_waste_and_rework
      process_id: "mix_preparation_and_control_freezing_and_finishing"
      flow_role: "Food losses, rejects, samples, retained heel, and controlled rework"
      record_type: "Batch disposition and waste records"
      raw_fields: "batch id; material state; quantity; reason; destination; rework source and receiving batch; waste ticket; treatment route"
      collection_method: "Segregated weighing and batch disposition tracking"
      unit: "kg"
      frequency: "Each event and batch"
      temporal_coverage: "Same period as product output"
      site_scope: "Each site and line in scope"
      aggregation_rule: "Sum by material state and destination; link rework once to receiving batch and prevent duplicate waste or product output"
      quality_evidence: "Scale checks; disposition approval; receiving-batch link; waste contractor record"
    - protocol_id: cp_cleaning_and_effluent
      process_id: "cleaning_and_wastewater"
      flow_role: "Cleaning water, agents, energy, wastewater, residues, and direct discharges"
      record_type: "Cleaning event, utility, stock, flow, and analytical records"
      raw_fields: "cleaning circuit and event; water meter; chemical opening and closing stock; purchases; energy meter; discharge volume; sample time; concentration; parameter; receiving compartment; sludge and residue mass; treatment route"
      collection_method: "Event logs, meters, stock balance, representative sampling, and laboratory analysis"
      unit: "m3 or kg water; kg agent or residue; kWh or MJ; kg pollutant"
      frequency: "Each cleaning event and monitoring interval"
      temporal_coverage: "Representative period including product changeovers and sanitation cycles"
      site_scope: "Each relevant circuit, treatment system, and outfall"
      aggregation_rule: "Allocate shared cleaning by measured event, circuit volume, runtime, or contacted production; calculate direct releases as discharge volume times representative concentration"
      quality_evidence: "Meter and dosing calibration; chemical inventory reconciliation; sampling plan; laboratory QA/QC; discharge permit or treatment record"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "Reference product"
      rule: "Net edible mass = gross filled unit mass - packaging tare; aggregate released units only."
      inputs:
        - "Gross filled mass"
        - "packaging tare"
        - "released unit count"
      output: "kg net edible reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_volume_to_mass
      applies_to: "Volume-based product records"
      rule: "Product mass = measured volume × batch- or product-specific density at the declared temperature and state."
      inputs:
        - Volume
        - "measured density"
        - temperature
        - "process state"
      output: "kg product"
      source_ids:
        - mass-balance-identity
    - id: calc_overrun
      applies_to: "Aerated product"
      rule: "Use the plant-declared overrun equation based on paired unfrozen-mix and finished-product mass-per-volume measurements; retain equation, temperature basis, and replicate results rather than assuming a universal value."
      inputs:
        - "Mix mass and volume"
        - "finished-product mass and volume"
        - temperature
      output: "Declared overrun value and uncertainty"
      source_ids:
        - uoguelph-ice-cream-manufacture
    - id: calc_process_mass_balance
      applies_to: "Each production process"
      rule: "Inputs = product outputs + controlled rework + measured waste and samples + inventory change + disclosed unexplained difference."
      inputs:
        - "Batch material inputs"
        - outputs
        - rework
        - waste
        - samples
        - "opening and closing work in progress"
      output: "Reconciled process mass balance and unexplained difference"
      source_ids:
        - mass-balance-identity
    - id: calc_refrigerant_loss
      applies_to: "Refrigeration systems"
      rule: "Loss = opening stock + purchases + transfers in - closing stock - recovered quantity - transfers out - documented non-emission use; allocate only the share serving the product system."
      inputs:
        - "Refrigerant ledger fields"
        - "equipment service allocation"
      output: "kg refrigerant loss by substance and process"
      source_ids:
        - konstantas-et-al-2019
    - id: calc_direct_effluent
      applies_to: "Direct discharge"
      rule: "Release mass = discharge volume × representative concentration, with unit conversion, sampling representativeness, and non-detect treatment documented."
      inputs:
        - "Discharge volume"
        - concentration
        - "sampling metadata"
        - "unit factors"
      output: "kg substance to named receiving compartment"
      source_ids:
        - ec-jrc-fdm-bref-2019
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Product and reference flow"
      requirement: "Retain product code, product family, complete recipe revision, inclusion and packaging format, dairy or non-dairy status, density or overrun where applicable, hazard-control route, release state, and the reason for any reference-flow replacement."
      evidence: "Approved specification, recipe, label, batch record, and Tiangong flow readback"
    - id: dq_temporal_representativeness
      applies_to: "All foreground data"
      requirement: "Use one common declared period that captures representative product mix, start-up, shutdown, changeover, defrost, cleaning, and seasonal effects; disclose exclusions or shorter campaign data."
      evidence: "Dated production, meter, warehouse, maintenance, and cleaning records"
    - id: dq_measurement_traceability
      applies_to: "Mass, energy, water, temperature, refrigerant, and analytical data"
      requirement: "Identify measuring device, unit, calibration or verification status, reading frequency, data gaps, substitutions, and conversion factors."
      evidence: "Calibration certificates, meter checks, laboratory QA/QC, invoices, and data-gap log"
    - id: dq_completeness
      applies_to: "Process map and inventory"
      requirement: "Account for every required process and every material recipe, packaging, utility, refrigerant, waste, wastewater, and direct-release stream, or explicitly justify its absence or non-applicability."
      evidence: "Completeness checklist cross-referenced to bills of materials, meters, purchase records, waste tickets, and process map"
    - id: dq_mass_balance
      applies_to: "Batch and period aggregation"
      requirement: "Reconcile material inputs, product outputs, rework, waste, samples, and inventory change. Report the absolute and relative unexplained difference rather than forcing it to zero."
      evidence: "Signed batch reconciliation and period-level mass-balance report"
    - id: dq_shared_systems
      applies_to: "Utilities, cleaning, storage, and refrigeration"
      requirement: "Document shared users, causal allocation driver, numerator and denominator, data period, and sensitivity to a plausible alternative allocation."
      evidence: "Meter topology, runtime or occupancy records, allocation workbook, and sensitivity result"
    - id: dq_source_and_geography
      applies_to: "Upstream datasets"
      requirement: "Match ingredient origin, electricity geography, fuel and water supply, packaging material, refrigerant substance, and waste treatment route as closely as available; disclose proxies."
      evidence: "Supplier records, invoices, origin declarations, upstream dataset metadata, and proxy log"
validation_rules:
  - rule_id: validation_01
    applies_to: "Reference flow"
    rule: "Confirm that the reference amount is exactly 1 kg net edible product, uses Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and excludes packaging mass."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_02
    applies_to: "Representative product coverage"
    rule: "Confirm that Ice cream 00b6b084-f103-4934-9d2a-cf449572cf12 is not used as an undeclared compositional proxy for water-based, plant-based, or otherwise more specific products; require the actual product family and any flow replacement decision."
    source_ids:
      - un-cpc-3-0-22270
      - codex-gsfa-category-03
  - rule_id: validation_03
    applies_to: "Required qualifiers"
    rule: "Reject an incomplete package when product family, formulation, density or overrun applicability, hazard-control route, inclusions, release temperature, hardening or stabilization route, storage duration, packaging, geography, or data period is missing."
    source_ids:
      - codex-cxc-57-2004
      - uoguelph-ice-cream-manufacture
  - rule_id: validation_04
    applies_to: "Process coverage"
    rule: "Confirm that all four required processes are represented. Permit variant-specific operations to be marked not applicable only with a product-route justification."
    source_ids:
      - uoguelph-ice-cream-manufacture
      - codex-cxc-57-2004
  - rule_id: validation_05
    applies_to: "Mass balance and rework"
    rule: "Verify batch and period mass balances, ensure controlled rework is linked once to a receiving batch, and require disclosure of the unexplained difference."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_06
    applies_to: "Energy and cold chain"
    rule: "Confirm separate accounting for mix treatment, freezing, hardening, on-site storage, storage duration, temperature profile, and refrigerant identity and loss; reject use of nameplate charge as an emission amount without a mass balance."
    source_ids:
      - konstantas-et-al-2019
      - ec-jrc-fdm-bref-2019
  - rule_id: validation_07
    applies_to: "Packaging, cleaning, and releases"
    rule: "Confirm packaging mass is separate from edible reference mass and that cleaning inputs, wastewater, food residues, packaging losses, and direct effluent releases are accounted for without double counting."
    source_ids:
      - ec-jrc-fdm-bref-2019
      - konstantas-et-al-2019
  - rule_id: validation_08
    applies_to: "Allocation"
    rule: "Confirm subdivision or causal physical allocation is attempted before economic or other allocation, and require the shared-system driver and sensitivity disclosure."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: validation_09
    applies_to: "Boundary consistency"
    rule: "Reject a factory-gate result that silently includes or omits outbound distribution, retail storage, consumer storage or serving, or end-of-life; extended scenarios must be reported separately."
    source_ids:
      - ghg-protocol-product-standard-2011
      - konstantas-et-al-2019
published_dataset_profile:
  dataset_role: "Product-specific foreground manufacturing dataset for finished ice cream or another declared edible-ice product at the factory gate"
  downstream_use: "May be used as a secondary_dataset or background_dataset for food products, catering, retail, cold-chain, packaging, and lifecyclemodel systems when product identity, geography, technology, formulation, packaging, and time period are representative."
  allowed_use: "Attributional modelling of declared factory-gate production; hotspot analysis; scenario analysis with separately modelled downstream cold chain; internal improvement and supply-chain studies consistent with the stated boundary and allocation."
  excluded_use: "Undeclared substitution between dairy, plant-based, and water-based product families; nutritional or sensory equivalence claims; public comparative assertions without a common functional equivalence, boundary, allocation, data-quality, and review framework; use as an unpackaged product when packaging burdens are embedded but not separable."
  required_metadata: "PCR id and version state; product and flow identity; full required qualifiers; recipe and packaging revision; site and geography; production technology; hazard-control route; reference period; cut-offs; allocation; upstream dataset versions; release temperature; hardening and on-site storage conditions; data-quality and uncertainty statements."
  required_quality_disclosure: "Foreground versus secondary-data shares; meter coverage; mass-balance unexplained difference; proxy list; missing data and substitutions; shared-system allocation; refrigerant accounting basis; storage duration; formulation coverage; temporal, geographic, and technological representativeness; review status."
  update_trigger: "Change in product family or recipe, principal ingredient origin, packaging format, hazard-control or freezing technology, refrigerant substance or refrigeration system, hardening or storage conditions, site or energy supply, allocation basis, upstream dataset, regulation, or evidence that materially changes the inventory."
