measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report 1 kg net edible product. Exclude all packaging mass and separately inventory packaging inputs."
  - id: volume_to_mass_conversion
    applies_to: "Volume-based production, sales, or meter records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert volume to mass using batch- or product-specific measured density at a declared temperature and process state. Do not use one default density across different aeration or product families."
  - id: overrun_and_density
    applies_to: "Aerated products"
    required_property_ref:
      name: "Mass and measured volume"
      uuid: ""
    required_unit: "kg and declared volume unit"
    rule: "Record unfrozen-mix mass and volume and finished-product mass and volume on a consistent temperature basis; calculate overrun using the declared plant convention and retain the equation. Mass output remains the quantitative reference."
  - id: energy_conversion
    applies_to: "Electricity, fuel, steam, and refrigeration energy"
    required_property_ref:
      name: "Metered energy or fuel quantity"
      uuid: ""
    required_unit: "Original meter unit and converted kWh or MJ"
    rule: "Preserve the original meter or invoice unit, conversion factor, and allocation basis. Do not combine electricity, thermal energy, and fuel mass or volume without explicit conversion."
  - id: refrigerant_accounting
    applies_to: "Freezing, hardening, and frozen storage"
    required_property_ref:
      name: "Refrigerant mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record refrigerant identity, opening and closing stock where available, purchases, charge additions, recoveries, and transfers. Calculate unaccounted loss by mass balance and do not infer leakage solely from equipment nameplate charge."
process_map:
  - id: mix_preparation_and_control
    name: "Mix preparation and validated hazard control"
    inclusion: "required"
    inclusion_condition: "All products require declared formulation, blending, and a validated food-safety control route; the exact control technology is product- and jurisdiction-specific."
    role: "Foreground preparation of a safe, declared mix or solution for freezing"
    quantitative_reference: "kg prepared mix leaving the process"
  - id: freezing_and_finishing
    name: "Freezing, aeration, and finishing"
    inclusion: "required"
    inclusion_condition: "Applies to every product; aeration, homogenization, conditioning, and inclusion addition are recorded only when used."
    role: "Formation of the frozen edible product and its declared structure"
    quantitative_reference: "kg unfinished or bulk frozen product leaving the freezer"
  - id: packaging_hardening_storage
    name: "Filling, packaging, hardening, and on-site frozen storage"
    inclusion: "required"
    inclusion_condition: "Packaging may be absent for declared bulk transfer; hardening may be replaced by another validated frozen-stabilization route, but the release state and storage duration remain required."
    role: "Delivery of the reference product at the factory gate"
    quantitative_reference: "1 kg net edible reference product"
  - id: cleaning_and_wastewater
    name: "Cleaning, sanitation, and wastewater handling"
    inclusion: "required"
    inclusion_condition: "Apply to all production routes and allocate shared clean-in-place or sanitation systems using measured causal drivers."
    role: "Supporting foreground hygiene and environmental-control process"
    quantitative_reference: "kg reference product supported"
