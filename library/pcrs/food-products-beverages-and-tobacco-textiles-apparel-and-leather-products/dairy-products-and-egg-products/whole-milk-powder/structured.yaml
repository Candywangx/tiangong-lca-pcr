measurement_rules:
  - id: reference_mass
    applies_to: "released whole milk powder"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use net product mass after subtracting packaging tare. Moisture present in the released powder remains part of the reference mass."
  - id: composition_identity
    applies_to: "released whole milk powder"
    required_property_ref:
      name: "mass fraction"
      uuid: ""
    required_unit: "% m/m"
    rule: "Measure and report milk fat, water, and milk protein in milk solids-not-fat using the applicable product specification and test methods. The product must meet the whole-milk-powder identity limits in Codex CXS 207-1999."
  - id: energy_reporting
    applies_to: "electricity and thermal energy"
    required_property_ref:
      name: "energy"
      uuid: ""
    required_unit: "kWh for electricity; MJ for fuels, steam, and purchased heat"
    rule: "Preserve metered carrier quantities and conversion factors. Do not combine electricity and thermal energy into one unqualified energy value."
  - id: water_reporting
    applies_to: "process water, cleaning water, condensate, and wastewater"
    required_property_ref:
      name: "volume or mass"
      uuid: ""
    required_unit: "m3 or kg"
    rule: "Keep intake water, recovered evaporator condensate, reused water, and wastewater separate. State density or conversion assumptions when mass and volume are converted."
  - id: mass_balance_basis
    applies_to: "milk solids, product, recovered fines, rejects, and losses"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg dry matter and kg wet mass"
    rule: "Report wet mass and dry matter consistently so retained milk solids, removed water, recovered fines, off-specification powder, and unexplained loss can be reconciled for the same batch period."
  - id: packaging_basis
    applies_to: "packaging materials"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg material/kg net product"
    rule: "Report each packaging material separately and declare whether packaging is included in the factory-gate product system."
