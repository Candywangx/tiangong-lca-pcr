allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "separately metered unit operations"
    rule: "Avoid allocation by subdividing reception, standardisation, evaporation, drying, finishing, cleaning, and packaging wherever process meters and mass balances permit direct assignment."
    source_ids:
      - idf-bulletin-445-2010
  - rule_id: allocation_rule_2
    applies_to: "internal fines, condensate, heat recovery, and rework"
    rule: "Treat material or energy returned to the same production system as an internal loop. Record gross generation and return where available, but do not create a co-product credit or double count the returned flow."
    source_ids:
      - idf-bulletin-445-2010
  - rule_id: allocation_rule_3
    applies_to: "cream, skim milk, or other saleable dairy co-products from standardisation"
    rule: "When subdivision cannot assign shared burdens, use a documented physicochemical allocation reflecting milk-component and resource relationships. Apply factors to each shared input or emission category rather than assuming one mass-only factor for all resources."
    source_ids:
      - idf-bulletin-445-2010
  - rule_id: allocation_rule_4
    applies_to: "residual shared burdens without a defensible physicochemical relationship"
    rule: "Use economic allocation only as a disclosed fallback or sensitivity case, based on representative multi-year prices where available. Report quantities, prices, period, geography, and resulting factors."
    source_ids:
      - idf-bulletin-445-2010
  - rule_id: allocation_rule_5
    applies_to: "off-specification powder and material sent to feed, rework, or disposal"
    rule: "Classify the output according to its actual destination and market function. Do not assign avoided-burden credits unless an explicitly extended lifecycle model applies system expansion and reports the substituted product and sensitivity."
    source_ids:
      - idf-bulletin-445-2010
  - rule_id: allocation_rule_6
    applies_to: "shared site utilities and cleaning"
    rule: "Allocate only the residual shared quantity after direct metering, using documented causal drivers such as operating time, clean-in-place circuit volume, heat duty, throughput, or wastewater load; disclose the driver and reconciliation to site totals."
    source_ids:
      - idf-bulletin-445-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_raw_milk_receipt
      process_id: "milk_reception_standardisation"
      flow_role: "raw milk quantity, composition, origin, and transport"
      record_type: "weighbridge or calibrated flowmeter plus intake laboratory record and delivery log"
      raw_fields: "accepted mass; rejected mass; species; supplier/origin; collection date; fat; protein; total solids or water; transport distance and mode"
      collection_method: "reconcile delivery tickets to intake meter and laboratory sample identifier"
      unit: "kg; % m/m; km"
      frequency: "each delivery and batch"
      temporal_coverage: "representative continuous 12-month period or declared seasonal campaign"
      site_scope: "all suppliers and receiving points serving the product"
      aggregation_rule: "sum accepted mass and mass-weight composition by batch; retain supplier stratification"
      quality_evidence: "calibration; sampling plan; laboratory method; delivery-ticket reconciliation"
    - protocol_id: cp_standardisation_balance
      process_id: "milk_reception_standardisation"
      flow_role: "standardised milk and adjustment constituents"
      record_type: "calibrated meters, tank levels, and laboratory composition results"
      raw_fields: "input and output masses; fat; protein; total solids; cream/skim/retentate/permeate/lactose additions or withdrawals"
      collection_method: "closed batch mass and milk-solids balance"
      unit: "kg; % m/m"
      frequency: "each batch"
      temporal_coverage: "same period as product output"
      site_scope: "all standardisation trains"
      aggregation_rule: "reconcile inputs, outputs, inventory change, and losses"
      quality_evidence: "meter calibration; sample chain; balance closure"
    - protocol_id: cp_evaporation_mass_balance
      process_id: "heat_treatment_evaporation"
      flow_role: "heat treatment and concentrate production"
      record_type: "batch records, time-temperature recorder, flowmeters, density and total-solids tests"
      raw_fields: "feed mass; feed solids; time-temperature; concentrate mass; concentrate solids; condensate by destination; start-up/shutdown loss"
      collection_method: "link control-system records to batch identifier"
      unit: "kg; % m/m; °C; s or min"
      frequency: "each batch"
      temporal_coverage: "same period as product output"
      site_scope: "all heat-treatment and evaporator lines"
      aggregation_rule: "dry-matter and water balance by batch, then production-weight average"
      quality_evidence: "sensor calibration; laboratory duplicates; condensate meter check"
    - protocol_id: cp_dryer_mass_balance
      process_id: "homogenisation_spray_drying"
      flow_role: "dryer feed, powder, fines, rejects, and emissions activity"
      record_type: "feed and powder meters, hopper or silo inventory, total-solids and moisture tests, filter or cyclone recovery logs"
      raw_fields: "concentrate feed mass and solids; powder output and moisture; recovered fines; rework; rejects; inventory change; dryer hours"
      collection_method: "reconcile milk-solids entering and leaving dryer system"
      unit: "kg; % m/m; h"
      frequency: "each batch or shift"
      temporal_coverage: "same period as product output"
      site_scope: "all dryers and powder recovery equipment"
      aggregation_rule: "dry-matter balance with recycled fines counted once"
      quality_evidence: "meter calibration; moisture method; inventory reconciliation; exception log"
    - protocol_id: cp_batch_output_quality
      process_id: "powder_finishing_packaging"
      flow_role: "net released product and product identity"
      record_type: "released-lot weights, packaging tare, and certificate of analysis"
      raw_fields: "gross mass; tare; net mass; fat; water; protein in milk solids-not-fat; product form; heat class; lot status"
      collection_method: "sum released net mass and link laboratory results to lots"
      unit: "kg; % m/m"
      frequency: "each released lot"
      temporal_coverage: "same period as inventory"
      site_scope: "all finished-product silos and packing lines"
      aggregation_rule: "exclude rejected lots until release or rework; production-weight quality results"
      quality_evidence: "scale calibration; laboratory accreditation or QA; release authorisation"
    - protocol_id: cp_finishing_ingredients
      process_id: "powder_finishing_packaging"
      flow_role: "lecithin, vitamins, minerals, and other additions"
      record_type: "batch dosing records and inventory balance"
      raw_fields: "ingredient identity; supplier lot; mass added; concentration; destination batch"
      collection_method: "reconcile weighed additions with stock issue and returns"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "same period as product output"
      site_scope: "all finishing lines"
      aggregation_rule: "sum by ingredient and divide by released product"
      quality_evidence: "calibrated scales; formulation approval; lot traceability"
    - protocol_id: cp_packaging_records
      process_id: "powder_finishing_packaging"
      flow_role: "primary, secondary, and tertiary packaging and gases"
      record_type: "bill of materials, issue/return records, packaged-unit counts, and scrap logs"
      raw_fields: "material; unit mass; units used; unused returns; scrap; gas mass; product format"
      collection_method: "material balance by packaging format"
      unit: "kg"
      frequency: "each lot or shift"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "all packaging lines for the product"
      aggregation_rule: "net issued material divided by released net product"
      quality_evidence: "supplier specification; unit-mass check; inventory reconciliation"
    - protocol_id: cp_energy_and_utilities
      process_id: "all_foreground_processes"
      flow_role: "electricity, fuels, steam, heat, compressed air, and refrigeration"
      record_type: "calibrated sub-meters, utility invoices, fuel meters, and operating logs"
      raw_fields: "carrier; meter start/end; fuel mass or volume; lower heating value; steam mass, pressure and enthalpy; operating hours; allocation driver"
      collection_method: "direct assignment first; reconcile residual allocation to site totals"
      unit: "kWh; MJ; kg; m3"
      frequency: "continuous or each shift; invoice monthly"
      temporal_coverage: "at least 12 representative months or full campaign"
      site_scope: "all relevant equipment and shared utility systems"
      aggregation_rule: "sum by carrier and process; normalize to released product after allocation"
      quality_evidence: "meter calibration; invoice reconciliation; documented conversion factors"
    - protocol_id: cp_water_and_wastewater
      process_id: "cleaning_wastewater_management"
      flow_role: "water intake, condensate reuse, wastewater, and sludge"
      record_type: "source and discharge meters, sampling, treatment logs, and sludge tickets"
      raw_fields: "water by source/use; condensate by destination; discharge volume; COD; BOD; total nitrogen; total phosphorus; sludge wet mass and solids; treatment route"
      collection_method: "meter balance plus representative composite sampling"
      unit: "m3; kg pollutant; kg sludge"
      frequency: "continuous volume; representative samples by permit or operating plan"
      temporal_coverage: "at least 12 representative months or full campaign"
      site_scope: "all water sources, clean-in-place circuits, and treatment routes serving product"
      aggregation_rule: "reconcile intake, reuse, evaporation, product water, discharge, and inventory"
      quality_evidence: "meter calibration; sample chain; laboratory QA; permit reports"
    - protocol_id: cp_cleaning_records
      process_id: "cleaning_wastewater_management"
      flow_role: "cleaning and sanitation chemicals"
      record_type: "clean-in-place recipe, dosing meter, chemical issue record, and inventory balance"
      raw_fields: "chemical identity; concentration; dose; cycle count; circuit; recovered or discarded solution"
      collection_method: "sum active product by circuit and allocate residual shared cycles causally"
      unit: "kg product and kg active substance"
      frequency: "each cleaning cycle"
      temporal_coverage: "same period as production"
      site_scope: "all circuits used by covered processes"
      aggregation_rule: "direct assignment by circuit; reconcile to purchases and inventory"
      quality_evidence: "dosing calibration; concentration verification; cycle log"
    - protocol_id: cp_material_losses
      process_id: "all_foreground_processes"
      flow_role: "spills, rejects, rework, waste, and co-products"
      record_type: "incident, rework, waste transfer, and sales records"
      raw_fields: "material identity; wet mass; solids; destination; recovered quantity; treatment; batch"
      collection_method: "reconcile losses and destinations with process mass balances"
      unit: "kg wet mass; kg dry matter"
      frequency: "each event and batch"
      temporal_coverage: "same period as production"
      site_scope: "all covered lines and storage areas"
      aggregation_rule: "sum by material and destination; count rework only at final destination"
      quality_evidence: "weigh tickets; transfer records; mass-balance closure"
    - protocol_id: cp_direct_emissions
      process_id: "relevant_foreground_processes"
      flow_role: "combustion, refrigerant, particulate, and treatment emissions"
      record_type: "stack test or continuous monitor, fuel records, refrigerant inventory, maintenance logs, and treatment activity"
      raw_fields: "pollutant; compartment; measured concentration and flow; test period; fuel activity; refrigerant charge and refill; emission factor and source"
      collection_method: "use measurements where representative; otherwise multiply collected activity by disclosed factor"
      unit: "kg pollutant; mg/Nm3; Nm3; kg refrigerant"
      frequency: "continuous, periodic test, or annual inventory as applicable"
      temporal_coverage: "representative operating states in the production period"
      site_scope: "all direct emission points serving covered processes"
      aggregation_rule: "aggregate by pollutant and compartment; prevent overlap between measurement and factor methods"
      quality_evidence: "method, detection limit, calibration, operating-state evidence, factor reference"
  calculation_rules:
    - id: calc_reference_mass
      applies_to: "released product"
      rule: "Net released powder mass = gross packed mass - packaging tare; normalize all allocated foreground quantities by net released powder mass."
      inputs:
        - "gross mass"
        - tare
        - "released-lot status"
      output: "kg input or output per 1 kg net released powder"
      source_ids:
        - idf-bulletin-445-2010
    - id: calc_milk_solids_balance
      applies_to: "standardisation through drying"
      rule: "For the same batch period, dry matter in raw milk and added milk constituents = dry matter in released powder + saleable co-products + off-specification material + wastewater/product losses + inventory change + unexplained difference. Report the unexplained percentage."
      inputs:
        - "mass and solids fraction for all milk-bearing inputs and outputs"
      output: "closed dry-matter balance and unexplained difference"
      source_ids:
        - codex-cxs-207-1999
        - tetra-pak-milk-powder-handbook
    - id: calc_water_balance
      applies_to: "evaporation, drying, and cleaning"
      rule: "Water input in milk, ingredients, and utility water = water in product and co-products + separately recovered condensate + wastewater + evaporated water + inventory change + unexplained difference. Keep internal reuse out of net intake."
      inputs:
        - "wet mass"
        - "solids or moisture"
        - "water meters"
        - condensate
        - wastewater
      output: "water balance by destination per reference flow"
      source_ids:
        - idf-bulletin-445-2010
        - fao-dairy-industry
    - id: calc_energy_normalisation
      applies_to: "each energy carrier"
      rule: "Normalize collected carrier quantity after direct assignment and disclosed allocation. For fuels, retain quantity and lower-heating-value conversion; for steam, retain mass and enthalpy difference."
      inputs:
        - "meter records"
        - "fuel properties"
        - "steam state"
        - "released product"
      output: "kWh electricity or MJ thermal energy per reference flow"
      source_ids:
        - idf-bulletin-445-2010
    - id: calc_physicochemical_allocation
      applies_to: "multi-product dairy processing"
      rule: "After subdivision, allocate each residual shared input or emission using the documented physicochemical or resource-use factor applicable to that stream; factor for product i = quantity_i × relation_factor_i divided by the sum over co-products."
      inputs:
        - "co-product quantities"
        - "stream-specific relation factors"
        - "shared burden"
      output: "allocation factor by burden stream and product"
      source_ids:
        - idf-bulletin-445-2010
    - id: calc_packaging_intensity
      applies_to: "packaging"
      rule: "Packaging intensity by material = net packaging material issued to released lots divided by net released whole milk powder."
      inputs:
        - "issued material"
        - returns
        - "scrap attribution"
        - "released net product"
      output: "kg packaging material per kg net product"
      source_ids:
        - idf-bulletin-445-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and reference flow"
      requirement: "Demonstrate whole-milk-powder identity and exact Tiangong product-flow UUID; retain released-lot fat, water, and protein-in-milk-solids-not-fat results and all required qualifiers."
      evidence: "certificate of analysis; specification; Tiangong identity reference; lot release record"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one coherent representative period, preferably 12 consecutive months for continuous plants or the complete declared campaign; explain shutdowns, abnormal production, seasonality, and substitutions."
      evidence: "meter dates; production calendar; invoice period; exception log"
    - id: dq_technological
      applies_to: "process route"
      requirement: "Identify evaporator, homogeniser, dryer stage configuration, powder recovery, agglomeration or lecithination, utility generation, emission controls, and packaging line represented by the data."
      evidence: "equipment list; process flow diagram; operating records"
    - id: dq_geographical
      applies_to: "raw milk and upstream datasets"
      requirement: "Match raw-milk origin, transport, electricity, fuel, heat, water, and treatment datasets to the declared geography or justify proxies."
      evidence: "supplier origin; route records; dataset metadata; proxy rationale"
    - id: dq_completeness
      applies_to: "mass, energy, water, and emissions"
      requirement: "Reconcile milk-solids, wet-mass, water, energy-carrier, packaging, wastewater, and waste records to site or line totals; quantify and explain unresolved differences and exclusions."
      evidence: "signed balance sheets; meter and invoice reconciliation; exclusion register"
    - id: dq_measurement
      applies_to: "measured and calculated values"
      requirement: "Record instrument identifier, calibration status, sampling method, laboratory method, detection limit where relevant, calculation formula, and responsible record owner."
      evidence: "calibration certificates; laboratory QA; calculation workbook; audit trail"
    - id: dq_allocation
      applies_to: "shared processes and co-products"
      requirement: "Preserve direct measurements, shared totals, co-product quantities, factors, prices when used, allocation period, formulas, and sensitivity results."
      evidence: "allocation workbook; production and price records; reconciliation to site total"
    - id: dq_source_age
      applies_to: "external factors and secondary datasets"
      requirement: "Use factors and secondary datasets current for the study period where available; record version, geography, technology, and replacement rationale for every proxy."
      evidence: "dataset metadata; factor citation; update log"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "PCR and reference identity"
    rule: "The manifest id, Markdown canonical_pcr_id, and reference product flow must identify whole milk powder, and the reference amount must be exactly 1 kg net product using Mass and the Units of mass unit group."
    source_ids:
      - codex-cxs-207-1999
  - rule_id: validation_rule_2
    applies_to: "released product composition"
    rule: "Reject the dataset as outside this PCR if released powder has milk fat below 26% or at or above 42% m/m, water above 5% m/m, or milk protein below 34% m/m of milk solids-not-fat."
    source_ids:
      - codex-cxs-207-1999
  - rule_id: validation_rule_3
    applies_to: "required qualifiers"
    rule: "Fail completeness when species/origin, composition, product form, heat treatment, drying route, packaging state, geography/time, allocation method, or factory-gate release specification is missing."
    source_ids:
      - codex-cxs-207-1999
      - idf-bulletin-445-2010
  - rule_id: validation_rule_4
    applies_to: "process coverage"
    rule: "Require records for reception and standardisation, heat treatment and evaporation, drying, finishing and packaging, cleaning and wastewater, and all applicable transport, utilities, refrigerants, wastes, and direct emissions; mark a step not applicable only with evidence."
    source_ids:
      - idf-bulletin-445-2010
      - fao-dairy-industry
      - tetra-pak-milk-powder-handbook
  - rule_id: validation_rule_5
    applies_to: "mass and water balances"
    rule: "Require a common batch or production period for milk-solids and water balances. Report unexplained differences and block review when balance scope, inventory change, or recycled fines could cause material double counting."
    source_ids:
      - idf-bulletin-445-2010
      - tetra-pak-milk-powder-handbook
  - rule_id: validation_rule_6
    applies_to: "allocation"
    rule: "Require subdivision before allocation, documented factors for every residual shared burden, factors summing to one for each shared burden, and reconciliation of allocated quantities to site totals."
    source_ids:
      - idf-bulletin-445-2010
  - rule_id: validation_rule_7
    applies_to: "data provenance"
    rule: "Every foreground or calculated value must link to a collection protocol and period; every external factor or rule must link to a listed source id. Tiangong UUID lookup is identity evidence and is not listed as an external data source."
    source_ids:
      - idf-bulletin-445-2010
  - rule_id: validation_rule_8
    applies_to: "double counting"
    rule: "Internal fines, condensate, heat recovery, rework, and shared-site utility allocation must be checked so generation and reuse are visible without counting the same burden or product twice."
    source_ids:
      - idf-bulletin-445-2010
published_dataset_profile:
  dataset_role: "Foreground whole-milk-powder production data package and factory-gate product dataset"
  downstream_use: "May be published as a secondary_dataset or background_dataset after review and combined with representative upstream raw-milk, energy, material, transport, and treatment datasets"
  allowed_use: "Attributional factory-gate modelling of whole milk powder with matching composition, species, geography, technology, packaging state, period, and allocation method; extended lifecycle models may add downstream stages explicitly"
  excluded_use: "Skim, partly skimmed, whey, cream, fat-filled, infant-formula, or formulated powders; comparative claims when product identity, allocation, geography, technology, packaging, or data quality is not equivalent; use as a cradle-to-consumer dataset without added downstream stages"
  required_metadata: "PCR id and version; product-flow UUID; facility geography; reference period; raw-milk species and origin; composition; product form and heat class; evaporation and drying technology; packaging state; included processes; upstream dataset identities; allocation method; data owner and review status"
  required_quality_disclosure: "Metering and sampling coverage; laboratory methods; mass, dry-matter, and water balance closure; allocation factors and sensitivity; temporal, geographical, and technological representativeness; data gaps, proxies, exclusions, uncertainty, and unresolved identities"
