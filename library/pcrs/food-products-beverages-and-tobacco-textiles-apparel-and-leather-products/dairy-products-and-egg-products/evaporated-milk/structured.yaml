  - rule_id: allocation_subdivision_first
    applies_to: "Shared plant operations and utilities"
    rule: "Use direct metering or process subdivision first. Where this is unavailable, allocate shared utilities using a documented causal engineering driver such as metered operating time, steam demand, refrigeration load, or throughput, and report the allocated share."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_exported_milk_components
    applies_to: "Cream, skim milk, or other milk-derived outputs exported from the foreground system"
    rule: "Prefer separate process data or physical mass-and-composition tracking. If allocation remains necessary, use a documented physical relationship appropriate to the joint operation, disclose the formula and co-product quantities, and test a materially plausible alternative; do not silently default to economic allocation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_and_recovery
    applies_to: "Product losses, packaging scrap, condensate, sludge, and recovered materials"
    rule: "Classify each output by actual fate. Apply burdens or credits only for documented external treatment, recovery, or substitution; do not credit material that is internally reused and already reduces input demand."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "milk_receipt_and_storage_standardization_and_heat_treatment"
      flow_role: "milk, milk-derived materials, adjustment inputs, rejects"
      record_type: "weighbridge, tank meter, receiving inspection, batch issue record"
      raw_fields: "material identity; supplier; lot; accepted mass or volume; density; solids; fat; protein; temperature; reject quantity; opening and closing storage"
      collection_method: "calibrated weighing or metering reconciled to receiving and batch records"
      unit: "kg; L with density conversion; mass fraction"
      frequency: "each delivery and batch"
      temporal_coverage: "every eligible lot in the declared production period"
      site_scope: "all receipt and storage points serving the declared product"
      aggregation_rule: "sum accepted quantities and inventory changes by material; normalize only after lot eligibility and allocation are resolved"
      quality_evidence: "calibration records; receiving certificates; laboratory results; stock reconciliation; reject log"
    - protocol_id: cp_composition_and_yield
      process_id: "standardization_and_heat_treatment_concentration_and_homogenization"
      flow_role: "intermediate mass, composition, evaporated water, yield"
      record_type: "batch record, transfer meter, laboratory test, evaporator log"
      raw_fields: "input and output mass; fat; total solids; solids-not-fat; protein basis; temperature; time; evaporator feed and concentrate; condensate; samples; rework; line hold-up"
      collection_method: "calibrated transfer measurement and representative laboratory analysis with batch mass balance"
      unit: "kg; mass fraction; process-control units"
      frequency: "each batch or continuous production run"
      temporal_coverage: "all declared production campaigns"
      site_scope: "all relevant preparation and concentration lines"
      aggregation_rule: "reconcile input solids and mass to concentrate, condensate, rework, losses, and inventory change"
      quality_evidence: "meter calibration; laboratory method and control samples; signed batch release; mass-and-solids balance closure"
    - protocol_id: cp_energy_and_utilities
      process_id: "concentration_and_homogenization_filling_stabilization_and_cooling"
      flow_role: "electricity, steam, fuel, cooling, and direct emissions"
      record_type: "submeter, boiler log, fuel invoice, operating log, emissions record"
      raw_fields: "electricity; steam mass and condition; hot-water quantity and temperature; fuel quantity; heating value basis; operating hours; allocation driver; pollutant measurement or factor"
      collection_method: "direct submetering preferred; otherwise documented engineering allocation and reviewed emission factor"
      unit: "kWh; MJ; kg steam; fuel-specific units; kg pollutant"
      frequency: "continuous or shift/batch total"
      temporal_coverage: "the declared production period, including all material operating modes"
      site_scope: "all utility systems serving the declared processes"
      aggregation_rule: "subtract non-production use; allocate shared supply by causal driver; convert units once; normalize to accepted product"
      quality_evidence: "meter calibration; invoice reconciliation; boiler balance; allocation worksheet; factor source and version"
    - protocol_id: cp_output_and_packaging
      process_id: "filling_stabilization_and_cooling"
      flow_role: "accepted net product, packaging, rejects, and packaging scrap"
      record_type: "filler total, check-weigher, packaging issue, finished-goods, reject and release records"
      raw_fields: "filled units; nominal and measured net mass; accepted and rejected units; samples; rework; packaging item mass; packaging issued and returned; heat-stabilization route; release status"
      collection_method: "calibrated check-weighing and mass reconciliation to released finished goods"
      unit: "kg product; item; kg packaging"
      frequency: "each lot and packaging run"
      temporal_coverage: "all declared production lots"
      site_scope: "all filling and stabilization lines for the product"
      aggregation_rule: "accepted net product equals released units times verified mean net mass; reconcile packaging issue to packed units and scrap"
      quality_evidence: "check-weigher calibration; release certificate; packaging specification; reject and rework log; container-closure control records"
    - protocol_id: cp_water_and_cleaning
      process_id: "concentration_and_homogenization_cleaning_and_wastewater_management"
      flow_role: "water supply, recovered condensate, cleaning water, and chemicals"
      record_type: "water submeter, condensate meter, CIP recipe and dosing log, purchase or issue record"
      raw_fields: "supplied water; condensate generated, recovered and reused; CIP cycle; rinse volume; chemical identity, concentration and dose; destination"
      collection_method: "submetering and automated CIP logs preferred; otherwise documented equipment-cycle calculation"
      unit: "kg or m3 water; kg or L chemical with density and concentration"
      frequency: "each CIP cycle and periodic meter reconciliation"
      temporal_coverage: "the declared production period, including all material cleaning regimes"
      site_scope: "all product-contact and attributable service systems"
      aggregation_rule: "separate fresh water from recovered water; allocate shared cleaning by cycle, equipment volume, or operating time; prevent condensate double counting"
      quality_evidence: "meter and dosing calibration; CIP completion record; chemical safety/specification record; periodic water balance"
    - protocol_id: cp_waste_and_effluent
      process_id: "all_foreground_processes"
      flow_role: "product loss, residues, wastewater, sludge, and direct discharge"
      record_type: "loss log, waste manifest, effluent meter, laboratory analysis, treatment log"
      raw_fields: "material and route; wet mass; dry matter; wastewater volume; destination; pollutant concentration; treatment status; recovery; disposal"
      collection_method: "direct weighing or metering; pollutant load calculated from matched volume and concentration"
      unit: "kg; m3; mg/L; kg pollutant"
      frequency: "each event or continuous discharge with representative sampling"
      temporal_coverage: "the declared production period, including material abnormal conditions"
      site_scope: "all drains, waste stores, treatment and discharge points serving the declared product"
      aggregation_rule: "segregate by destination; calculate pollutant mass from matched flow and concentration; reconcile product-containing losses to material balance"
      quality_evidence: "waste transfer records; meter calibration; accredited or controlled laboratory results; treatment operating record; destination evidence"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = eligible foreground amount ÷ accepted net evaporated-milk mass; apply the documented shared-process allocation before division"
      inputs:
        - "eligible amount"
        - "allocation share"
        - "accepted net product mass"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calc_product_mass
      applies_to: "Accepted reference product"
      rule: "accepted net product mass = sum of released units × verified mean net product mass, or direct accepted mass meter total; packaging mass is excluded"
      inputs:
        - "released units"
        - "check-weigher results or mass meter"
        - rejects
        - samples
      output: "kg accepted net evaporated milk"
      source_ids: []
    - id: calc_mass_and_solids_balance
      applies_to: "Receipt through concentration"
      rule: "reconcile material input and opening inventory with accepted product, removed water, co-products, waste, rework, samples, and closing inventory; calculate and disclose both total-mass and milk-solids closure"
      inputs:
        - "measured masses"
        - "composition tests"
        - "inventory changes"
        - condensate
        - losses
      output: "mass closure; solids closure; unresolved difference"
      source_ids:
        - codex-cxs-281-1971
    - id: calc_water_routes
      applies_to: "Evaporation, cleaning, and wastewater"
      rule: "removed water = recovered condensate + condensate to treatment + verified water-to-air release + change in process hold-up; wastewater pollutant load = matched discharge volume × concentration after unit conversion"
      inputs:
        - "condensate meters"
        - "water balance"
        - "discharge volume"
        - "pollutant concentrations"
      output: "kg water by route; kg pollutant"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_energy
      applies_to: "Process energy"
      rule: "convert each metered energy carrier once to the reported unit, retain the original meter unit and conversion basis, then allocate by the documented causal driver"
      inputs:
        - "meter totals"
        - "steam condition"
        - "fuel amount"
        - "heating value"
        - "operating driver"
      output: "kWh electricity or MJ thermal energy per reference product"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: calc_allocation
      applies_to: "Joint or shared operations"
      rule: "allocated amount = shared amount × documented causal or accepted physical allocation fraction; fractions for one shared total must sum to 1 within rounding tolerance"
      inputs:
        - "shared amount"
        - "allocation driver by product"
        - "co-product mass and composition where relevant"
      output: "allocated foreground amount and allocation fractions"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and inputs"
      requirement: "Match the declared product to unsweetened evaporated-milk scope and retain fat class, composition, reconstitution status, milk species, and heat-stabilization route; unresolved non-reference Tiangong flow identities must be reviewed before publication."
      evidence: "product specification; label; batch formula; laboratory release; Tiangong identity review"
    - id: dq_measurement
      applies_to: "Mass, energy, water, and effluent records"
      requirement: "Use calibrated meters or scales where material; retain conversion, density, heating-value, sampling, and allocation calculations."
      evidence: "calibration certificates; meter list; calculation workbook; laboratory method"
    - id: dq_temporal
      applies_to: "All foreground data"
      requirement: "Use a declared period representative of the product and technology, covering every eligible lot or campaign and all material operating modes; identify maintenance, shutdown, start-up, and abnormal events and justify exclusions."
      evidence: "production calendar; meter series; event log; exclusion record; technological, geographical, temporal, and precision review consistent with eu-pef-2021-2279"
    - id: dq_completeness
      applies_to: "Material and utility balance"
      requirement: "Include all material measured foreground inputs, outputs, wastes, and direct emissions; explicitly list and justify every omitted flow and never omit hazardous or legally controlled releases through a generic cut-off."
      evidence: "completeness calculation; omitted-flow register; reviewer sign-off; eu-pef-2021-2279 data-quality review"
    - id: dq_mass_balance
      applies_to: "Receipt through released product"
      requirement: "Define a site- and batch-specific investigation threshold before validation; investigate every unexplained total-mass or milk-solids difference that exceeds that threshold and retain the corrective-action decision. No universal percentage is prescribed by this PCR."
      evidence: "signed mass-and-solids balance; documented site threshold; corrective-action record"
    - id: dq_range_evidence
      applies_to: "Important inventory flows"
      requirement: "Do not author an empirical range from a single publication, plant, batch, scenario, or point value. Require at least two independent original sources with compatible foreground boundary, unit, and normalization basis, or a reviewed foreground distribution; otherwise keep the range evidence gap unresolved. Exact reference-flow normalization identities are not empirical ranges."
      evidence: "original source texts; boundary-and-unit compatibility review; foreground distribution; unresolved-range register"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow and dataset metadata"
    rule: "Fail if the product-flow UUID, Mass flow-property UUID, Units of mass UUID, reference unit kg, net-mass basis, or required qualifiers are missing or inconsistent."
    source_ids: []
  - rule_id: validate_product_scope
    applies_to: "Product identity"
    rule: "Fail if added sugar/sweetener, concentrated cream, solid milk/cream, non-milk-fat substitution, or another excluded identity is represented as this reference product; verify declared composition against the applicable product specification."
    source_ids:
      - codex-cxs-281-1971
  - rule_id: validate_process_coverage
    applies_to: "Foreground process map"
    rule: "Fail if receipt, standardization/heat treatment, concentration, final filling/heat stabilization/cooling, or attributable cleaning is omitted without a documented route-specific explanation."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: validate_mass_and_solids_balance
    applies_to: "Material balance"
    rule: "Flag total-mass or milk-solids imbalance above the declared site- and batch-specific investigation threshold and fail if the difference is unexplained, if internal rework is double-counted, or if removed water routes overlap."
    source_ids:
      - codex-cxs-281-1971
      - eu-fdm-bat-2019-2031
  - rule_id: validate_wastewater_route
    applies_to: "Waste and elementary flows"
    rule: "Fail if the same wastewater or condensate is reported both as a waste flow to treatment and as a direct elementary release, or if product-containing losses and cleaning compounds have no destination."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: validate_range_evidence
    applies_to: "Inventory amount ranges"
    rule: "Fail if an empirical range copies a single case or point value, lacks at least two independent boundary-, unit-, and basis-compatible original sources, or is presented without its inference and applicability. Permit an exact lower-equals-upper value only for a declared physical, specification, or normalization identity."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "Shared operations and co-products"
    rule: "Fail if shared-operation allocation, exported co-products, internal rework, or recovery credits are material but the method, driver, fractions, quantities, and sensitivity are not disclosed and reconciled."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate production dataset for evaporated milk"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product carbon-footprint or LCA studies that combine this factory-gate dataset with representative upstream milk, material, energy, packaging, transport, and downstream scenarios and preserve the declared product qualifiers"
  excluded_use: "Stand-alone cradle-to-grave claim; sweetened condensed milk, concentrated cream, milk powder, dairy analogue, or flavoured-product proxy; comparative assertion without equivalent composition, boundary, allocation, geography, technology, and data period"
  required_metadata: "canonical PCR id; reference UUIDs; product subclass and composition; milk species and material route; reconstitution status; plant geography; technology and heat-stabilization route; packaging; production period; boundary; allocation; upstream datasets; data owners; review status"
  required_quality_disclosure: "primary-data share; meter and laboratory coverage; temporal and site coverage; mass-and-solids balance closure; water and energy allocation; waste and wastewater destinations; unresolved UUIDs and range-evidence gaps; exclusions; uncertainty and reviewer decisions"
  update_trigger: "material change in formulation, milk source, composition class, concentration or sterilization technology, packaging, plant energy or water system, allocation, waste route, product-flow identity, applicable standard, or a change exceeding the dataset owner's significance threshold"
data_sources:
  - id: "unsd-cpc-3-22221"
    type: "standard"
    reference: "United Nations Statistics Division, *Central Product Classification (CPC) Version 3.0 Explanatory Notes*, subclass 22221, Evaporated milk. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-12)"
    used_for: "CPC 22221 inclusion and explicit exclusions for 22222, 22229, and solid milk or cream; classification context only"
  - id: "codex-cxs-281-1971"
    type: "standard"
    reference: "FAO and WHO, Codex Alimentarius, CXS 281-1971, *Standard for Evaporated Milks*, revised 1999 and amended through 2023. https://workspace.fao.org/sites/codex/Standards/CXS%20281-1971/CXS_281e.pdf (retrieved 2026-08-12)"
    used_for: "Evaporated-milk identity; direct-consumption and further-processing scope; partial-water-removal route; permitted milk-derived material categories; declared composition-class conformance. Composition limits and quality criteria are not used as universal LCI amounts"
  - id: "codex-cxs-206-1999"
    type: "standard"
    reference: "FAO and WHO, Codex Alimentarius, CXS 206-1999, *General Standard for the Use of Dairy Terms*, amended 2022. https://workspace.fao.org/sites/codex/Standards/CXS%20206-1999/CXS_206e.pdf (retrieved 2026-08-12)"
    used_for: "Milk-product, reconstituted-product, and recombined-product identity; milk-species and processing-route disclosure; prevention of non-milk substitution being treated as evaporated milk"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission, Recommendation (EU) 2021/2279 on the use of Environmental Footprint methods, Annex I Product Environmental Footprint method. https://eur-lex.europa.eu/eli/reco/2021/2279/oj (retrieved 2026-08-12)"
    used_for: "Life-cycle dataset modelling, allocation hierarchy, representativeness, precision, disclosure, and data-quality review; no generic PEF numeric value is adopted as a product-specific LCI amount"
  - id: "eu-fdm-bat-2019-2031"
    type: "official_guidance"
    reference: "European Commission, Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries. https://eur-lex.europa.eu/eli/dec_impl/2019/2031/oj (retrieved 2026-08-12)"
    used_for: "Dairy-process environmental inventory and monitoring context for water, energy, raw materials, wastewater, waste gas, residues, process flow sheets, and cleaning; BAT performance levels are not adopted as universal LCI values or as a claim of regulatory applicability"
