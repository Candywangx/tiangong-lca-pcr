product_category_identity:
  canonical_pcr_id: "pcr.food-products-beverages-and-tobacco-textiles-apparel-and-leather-products.dairy-products-and-egg-products.whey"
  classification_refs: "CPC 3.0 22130 Whey"
  covered_products: "sweet whey and acid whey marketed or transferred as fluid dairy products; untreated, clarified, pasteurised, cooled, or concentrated liquid whey when the state is declared"
  excluded_products: "whey and acid whey powders; dried whey ingredients; whey protein concentrate or isolate sold as dry products; lactose; whey permeate powder; whey cheese; formulated whey beverages; cheese, casein, milk, cream, and non-dairy analogues"
  representative_product: "saleable fluid whey at the declared plant gate"
  production_route: "recovery after cheese or casein coagulation and curd separation, followed by route-specific conditioning, storage, and dispatch"
  market_state: "bulk or packaged pumpable liquid; sweet or acid; declared solids, composition, temperature, treatment, and concentration state"
functional_unit:
  what: "conforming fluid whey supplied for food, feed, fermentation, ingredient manufacture, or another declared downstream use"
  how_much: "1 kg wet product at the declared plant gate"
  how_well: "meets the declared sweet/acid identity, source-process specification, solids and composition basis, pH or acidity, microbiological or commercial specification, and treatment state"
  how_long_or_cycle: "one production batch or reporting-period output, normalized to 1 kg dispatched product"
  reference_flow_link: "reference product output whey_reference_product from storage_and_dispatch"
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The dataset shall represent the declared fluid-whey route without silently importing upstream cheese burdens, downstream powder manufacture, or disposal credits."
      source_ids: []
    - rule_id: boundary_product_identity
      applies_to: "product inclusion"
      rule: "Include only fluid whey separated from curd after coagulation in cheese, casein, or similar dairy manufacture and preserve sweet/acid and source-process identity."
      source_ids:
        - codex-cxs-289-1995-whey-powders
        - fao-2013-milk-dairy-human-nutrition
    - rule_id: boundary_start_and_end
      applies_to: "foreground gate"
      rule: "Start at whey separation into the recovery line or at purchased-fluid-whey receipt; end at conforming fluid whey ready for dispatch at the declared plant gate."
      source_ids:
        - codex-cxs-289-1995-whey-powders
        - us-epa-ap42-9-6-1-cheese
    - rule_id: boundary_included_operations
      applies_to: "on-site whey handling"
      rule: "Include collection, transfer, clarification, cooling, pasteurisation, liquid concentration, storage, cleaning, packaging, and on-site effluent handling when performed for the declared product."
      source_ids:
        - eu-2019-2031-fdm-bat
        - us-epa-ap42-9-6-1-cheese
    - rule_id: boundary_acid_whey_timing
      applies_to: "acid whey route"
      rule: "Record the time from separation to conditioning and avoid unreported holding that changes acidity; acid whey should be processed promptly and the actual residence time shall be disclosed."
      source_ids:
        - eu-2019-2031-fdm-bat
    - rule_id: boundary_downstream_exclusions
      applies_to: "powders and derived ingredients"
      rule: "Exclude drying and downstream manufacture of whey powder, protein concentrates or isolates, lactose, permeate powder, whey cheese, and formulated beverages from the fluid-whey foreground gate."
      source_ids:
        - codex-cxs-289-1995-whey-powders
        - fao-2013-milk-dairy-human-nutrition
    - rule_id: boundary_recursive_whey_input
      applies_to: "purchased or transferred fluid whey"
      rule: "Record same-category whey as an input with an upstream dataset and do not double-count its upstream dairy or recovery burdens."
      source_ids: []
    - rule_id: boundary_emissions_and_waste
      applies_to: "direct releases and treatment"
      rule: "Include measured on-site wastewater, product losses, residues, refrigerant losses, combustion releases, and treatment outputs attributable to included operations; disclose off-site treatment links."
      source_ids:
        - eu-2019-2031-fdm-bat
        - us-epa-ap42-9-6-1-cheese
boundary_abstraction:
  declared_starting_condition: "separated wet whey entering the recovery line, or purchased fluid whey received at the facility"
  starting_condition_role: "product identity and upstream-burden hand-off for the fluid-whey foreground system"
  product_classification_scope: "CPC 3.0 22130 Whey, interpreted as fluid whey rather than the separately classified powder product"
  recursive_input_rule: "an input already classified as fluid whey is recorded as a product input with the Whey flow UUID, its wet mass and qualifiers, and a linked upstream dataset; do not recreate its upstream whey-production burdens inside the receiving process"
  upstream_dataset_requirement: "link milk, cheese or casein production and shared coagulation/separation burdens through reviewed upstream datasets and the declared allocation treatment; link purchased whey when the foreground starts at receipt"
  disclosure: "disclose whey origin, sweet/acid status, source dairy product, species, solids and composition basis, treatment state, receipt or separation point, included operations, allocation method, losses, co-products, effluent route, geography, period, and plant gate"
