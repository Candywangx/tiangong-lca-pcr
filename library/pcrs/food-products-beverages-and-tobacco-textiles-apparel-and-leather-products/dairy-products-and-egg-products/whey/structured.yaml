allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "separately measurable whey recovery, conditioning, storage, cleaning, and treatment operations"
    rule: "Avoid allocation by subdividing metered processes and assigning directly attributable inputs, emissions, and wastes to whey operations."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_system_expansion
    applies_to: "explicitly expanded product systems"
    rule: "Use system expansion only when the additional co-product function and substituted product are explicitly modelled and empirically justified; report the expanded-system result rather than silently crediting whey."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_physical_relation
    applies_to: "inseparable shared dairy or treatment operations"
    rule: "When subdivision or justified system expansion is not possible, use a documented causal physical relationship relevant to the functions of whey and the other outputs; wet mass alone is not sufficient unless its functional relevance is demonstrated."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_other_relation
    applies_to: "multifunctional operations lacking a defensible physical relation"
    rule: "Use another documented relationship, such as route-specific economic value at the co-product production stage, only after explaining why subdivision, system expansion, and physical allocation were rejected; disclose prices, period, geography, factors, and sensitivity."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_upstream_whey
    applies_to: "shared coagulation, curd separation, and upstream dairy operations"
    rule: "Do not assign zero upstream burden to marketable whey by default. Link the reviewed upstream dataset and disclose whether whey entered as co-product, product, or waste under the actual route and destination."
    source_ids:
      - eu-2021-2279-environmental-footprint
      - eu-2019-2031-fdm-bat
  - rule_id: allocation_recovered_outputs
    applies_to: "recovered cream, solids, biogas, reusable water, and other outputs"
    rule: "Classify an output as a co-product only when quantity, quality, further use, and destination are documented; otherwise record it as waste or an emission according to the actual handling route."
    source_ids:
      - eu-2019-2031-fdm-bat
      - eu-2021-2279-environmental-footprint
dataset_production:
  collection_protocols:
    - protocol_id: cp_whey_batch_mass_and_composition
      process_id: "whey_receipt_and_recovery_liquid_whey_conditioning_storage_and_dispatch"
      flow_role: "whey feedstock, intermediates, product, co-products, and losses"
      record_type: "batch, tank, laboratory, and dispatch records"
      raw_fields: "batch/lot id; source process; species; sweet/acid status; timestamp; wet mass; total solids; protein/fat/lactose/ash when available; pH or acidity; temperature; treatment state; destination"
      collection_method: "calibrated tank, load cell, flow meter, weighbridge, and representative laboratory sampling"
      unit: "kg and declared composition units"
      frequency: "each batch, transfer, or dispatch lot"
      temporal_coverage: "representative continuous 12-month period or complete declared campaign"
      site_scope: "all included whey lines, tanks, and dispatch points"
      aggregation_rule: "reconcile opening stock + inputs = outputs + closing stock + losses, then normalize conforming dispatch mass to 1 kg"
      quality_evidence: "calibration, sample chain of custody, laboratory method, batch reconciliation, and signed release record"
    - protocol_id: cp_energy_and_utilities
      process_id: "whey_receipt_and_recovery_liquid_whey_conditioning_storage_and_dispatch"
      flow_role: "electricity, fuel, steam, heat, refrigeration, and other utilities"
      record_type: "meter, invoice, and operating-hour records"
      raw_fields: "meter id; start/end reading; fuel quantity; steam pressure/temperature or enthalpy; equipment hours/load; allocation driver; production mass"
      collection_method: "dedicated meter preferred; otherwise documented engineering allocation reconciled to facility totals"
      unit: "kWh, MJ, kg fuel, kg steam, or source unit"
      frequency: "continuous or each billing period"
      temporal_coverage: "same period as product output"
      site_scope: "all included whey equipment and shared utility systems"
      aggregation_rule: "subtract unrelated loads, allocate documented shared loads, convert with recorded factors, and divide by conforming product kg"
      quality_evidence: "meter calibration, invoices, operating logs, conversion factors, and allocation reconciliation"
    - protocol_id: cp_cleaning_water_and_materials
      process_id: "liquid_whey_conditioning_storage_and_dispatch"
      flow_role: "process water, CIP water, cleaning and disinfection products"
      record_type: "water meter, CIP recipe, dosing, and purchase/issue records"
      raw_fields: "CIP cycle id; water volume; rinse endpoint; chemical product and active concentration; dose; temperature; line/tank; recovered or discharged quantity"
      collection_method: "submeter and dosing controller preferred; otherwise validated tank volume and recipe record"
      unit: "kg or m3 water; kg product; active concentration"
      frequency: "each cleaning cycle or daily"
      temporal_coverage: "same period as product output"
      site_scope: "all included lines, tanks, and loading systems"
      aggregation_rule: "assign cycles to equipment and product route, reconcile purchases, and normalize to conforming product kg"
      quality_evidence: "meter calibration, dosing calibration, CIP logs, conductivity/pH/turbidity endpoint, and purchase reconciliation"
    - protocol_id: cp_packaging_and_dispatch
      process_id: "storage_and_dispatch"
      flow_role: "packaging and dispatched whey"
      record_type: "bill of materials, packaging issue, count, loading, and dispatch records"
      raw_fields: "packaging item/material; item mass; count; tare; gross/net product mass; bulk/packaged state; destination; lot id"
      collection_method: "calibrated scale, item-count reconciliation, and dispatch documentation"
      unit: "kg"
      frequency: "each dispatch lot"
      temporal_coverage: "same period as product output"
      site_scope: "all included dispatch modes"
      aggregation_rule: "convert counts to mass, exclude reusable assets unless loss/replacement is attributable, and normalize to dispatched product kg"
      quality_evidence: "scale calibration, supplier specification, issue reconciliation, and dispatch record"
    - protocol_id: cp_waste_effluent_and_emissions
      process_id: "whey_receipt_and_recovery_liquid_whey_conditioning_storage_and_dispatch_onsite_effluent_management"
      flow_role: "product loss, residues, wastewater, sludge, direct releases, and treatment outputs"
      record_type: "waste transfer, flow-meter, sampling, laboratory, incident, and treatment records"
      raw_fields: "stream id; source process; wet/dry mass; wastewater volume; sample time; concentration; destination; treatment route; recovery output; incident loss"
      collection_method: "calibrated scales/meters and representative sampling under documented analytical methods"
      unit: "kg, m3, mg/L, or pollutant-specific unit"
      frequency: "each transfer and representative sampling event"
      temporal_coverage: "same period as product output, covering operating and cleaning periods"
      site_scope: "all included lines and on-site treatment"
      aggregation_rule: "calculate pollutant mass from flow and concentration, reconcile whey losses with batch balance, and normalize to conforming product kg"
      quality_evidence: "calibration, sampling plan, laboratory accreditation or QA, manifests, treatment logs, and mass reconciliation"
    - protocol_id: cp_coproduct_and_allocation
      process_id: "liquid_whey_conditioning_onsite_effluent_management_shared_upstream_dairy_operations"
      flow_role: "co-product identity and allocation"
      record_type: "production, composition, sales, transfer, and allocation records"
      raw_fields: "output id; amount; composition/function; destination; price and currency where used; price period/geography; physical relation; subdivision evidence; allocation factor; factor sum"
      collection_method: "collect process-specific records and document the allocation hierarchy decision"
      unit: "kg, composition units, currency/kg, or physical driver"
      frequency: "each allocation period and material route change"
      temporal_coverage: "same period as shared inventory and outputs"
      site_scope: "all multifunctional operations linked to the whey dataset"
      aggregation_rule: "assign direct flows first, calculate reviewed factors for residual shared burdens, and require factors to sum to one within rounding tolerance"
      quality_evidence: "signed methodology decision, source records, price or physical-driver evidence, sensitivity result, and factor-sum check"
  calculation_rules:
    - id: normalize_reference_mass
      applies_to: "all inventory rows"
      rule: "normalized amount = reporting-period amount / conforming dispatched wet whey kg"
      inputs:
        - "dispatched wet whey mass"
        - "row amount"
      output: "amount per 1 kg reference whey"
      source_ids: []
    - id: close_whey_mass_balance
      applies_to: "recovery, conditioning, and storage"
      rule: "opening stock + wet whey inputs + incorporated materials = conforming whey + co-products + wastes/losses + closing stock; investigate unexplained difference and retain solids balance for concentrated routes"
      inputs:
        - "batch masses"
        - stocks
        - solids
        - co-products
        - wastes
      output: "wet-mass and solids-balance closure"
      source_ids:
        - codex-cxs-289-1995-whey-powders
        - fao-2013-milk-dairy-human-nutrition
    - id: calculate_concentration_factor
      applies_to: "concentrated liquid whey"
      rule: "concentration factor = feed wet mass / concentrate wet mass, cross-checked by feed and product solids mass after recorded losses"
      inputs:
        - "feed/product wet mass and solids fraction"
      output: "concentration factor and removed-water balance"
      source_ids: []
    - id: calculate_utility_intensity
      applies_to: "energy and water"
      rule: "sum route-attributable metered use plus documented shared allocation, convert to the declared unit, and divide by conforming product kg"
      inputs:
        - "utility records"
        - "allocation driver"
        - "product mass"
      output: "kWh, MJ, kg, or m3 per kg reference whey"
      source_ids: []
    - id: calculate_pollutant_release
      applies_to: "direct releases to water"
      rule: "pollutant kg = final-effluent volume x representative concentration x unit-conversion factor; use flow-weighted aggregation when multiple samples exist"
      inputs:
        - "flow meter"
        - "laboratory result"
        - "sampling coverage"
      output: "pollutant kg per kg reference whey"
      source_ids:
        - eu-2019-2031-fdm-bat
    - id: apply_allocation_hierarchy
      applies_to: "shared multifunctional operations"
      rule: "assign direct flows by subdivision; otherwise apply reviewed system expansion or a causal physical relation; use another relation only with documented rejection of prior steps and sensitivity"
      inputs:
        - "direct measurements"
        - functions
        - "physical driver"
        - "market values"
        - "output amounts"
      output: "allocated shared inventory and factor set"
      source_ids:
        - eu-2021-2279-environmental-footprint
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference whey and feedstock"
      requirement: "Preserve source process, species, sweet/acid status, composition basis, treatment state, temperature, concentration, and bulk/packaged state for every included product lot."
      evidence: "batch specification, laboratory results, and dispatch record"
    - id: dq_mass_and_stock
      applies_to: "all material flows"
      requirement: "Use calibrated mass or volume measurements, document density conversions, and reconcile stock, transfers, co-products, losses, and product at batch or reporting-period level."
      evidence: "calibration, inventory, batch, and reconciliation records"
    - id: dq_composition
      applies_to: "whey, co-products, and concentrated routes"
      requirement: "Use representative samples and documented methods for total solids or dry matter, pH or acidity, and material composition fields used in identity, mass balance, or allocation."
      evidence: "sampling plan, chain of custody, method, laboratory QA, and results"
    - id: dq_temporal_coverage
      applies_to: "foreground activity"
      requirement: "Use a representative continuous 12-month period or a complete declared campaign and include cleaning, start-up, shutdown, rejects, and abnormal events; justify exclusions."
      evidence: "production calendar, meter coverage, batch list, and incident log"
    - id: dq_completeness
      applies_to: "process map and inventory"
      requirement: "Cover every required process and every conditional process that occurred; include utilities, cleaning, packaging, product losses, wastewater, direct emissions, and off-site treatment links when material."
      evidence: "process-flow diagram, inclusion checklist, ledger reconciliation, and linked datasets"
    - id: dq_allocation
      applies_to: "shared dairy and treatment operations"
      requirement: "Retain direct-assignment evidence, hierarchy decision, driver data, allocation factors summing to one, and sensitivity where another relation such as economic value is used."
      evidence: "allocation workbook, source data, approval record, and sensitivity analysis"
    - id: dq_uuid_and_source_traceability
      applies_to: "database identities and external rules"
      requirement: "Use reviewed Tiangong UUIDs without dataset versions and retain stable external source ids for non-default boundary, allocation, process, and validation rules."
      evidence: "identity readback record, source register, and PCR conformance review"
validation_rules:
  - rule_id: validate_identity_and_scope
    applies_to: "reference product"
    rule: "Require the Whey UUID, Product flow type, CPC 3.0 code 22130, sweet/acid and source-process identity, wet-product state, composition basis, treatment, temperature, geography, and plant gate; reject powder and derived-ingredient products."
    source_ids:
      - codex-cxs-289-1995-whey-powders
      - fao-2013-milk-dairy-human-nutrition
  - rule_id: validate_reference_support
    applies_to: "quantitative reference"
    rule: "Require 1 kg wet whey, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and reference unit kg."
    source_ids: []
  - rule_id: validate_process_coverage
    applies_to: "foreground process map"
    rule: "Require recovery/receipt and storage/dispatch; require conditioning and on-site effluent management when those operations occurred; prohibit silent inclusion of drying or downstream powder manufacture."
    source_ids:
      - eu-2019-2031-fdm-bat
      - us-epa-ap42-9-6-1-cheese
  - rule_id: validate_mass_and_solids_balance
    applies_to: "whey feedstock, product, co-products, stocks, and losses"
    rule: "Require wet-mass closure and, for concentrated routes, solids closure; investigate unexplained differences and prohibit double-counting the same whey as product and wastewater."
    source_ids:
      - codex-cxs-289-1995-whey-powders
      - fao-2013-milk-dairy-human-nutrition
  - rule_id: validate_acid_whey_timing
    applies_to: "acid whey route"
    rule: "Require separation-to-conditioning time, holding conditions, and acidity or pH records sufficient to identify material change during storage."
    source_ids:
      - eu-2019-2031-fdm-bat
  - rule_id: validate_utilities_and_cleaning
    applies_to: "electricity, steam, hot water, natural gas, diesel, LPG, water, refrigerants, and cleaning substances"
    rule: "Require source records, unit conversions, allocation of shared services, temporal alignment, and cleaning-cycle coverage for each separately named exchange; no PCR default or numeric range substitutes for foreground data."
    source_ids:
      - eu-2019-2031-fdm-bat
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_atomic_inventory_flows
    applies_to: "all foreground exchanges"
    rule: "Require one card per actual stage-specific electricity exchange, thermal carrier, fuel, refrigerant species, water supply, processing aid, cleaning or disinfection substance, packaging material, product, co-product, waste stream, and elementary emission; reject collection labels and require a new specific card for any actual exchange not enumerated here."
    source_ids:
      - eu-2019-2031-fdm-bat
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_allocation
    applies_to: "multifunctional processes"
    rule: "Require the allocation hierarchy decision, direct assignments, selected driver, factors summing to one, source period/geography, and sensitivity where an economic or other fallback relation is used; reject undocumented zero-burden whey."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_wastewater_and_emissions
    applies_to: "wastes and direct releases"
    rule: "Require stream amount, destination, treatment link, representative sampling, calculation method, and exact elementary-flow identity before publication; do not accept pollutant concentrations without corresponding flow."
    source_ids:
      - eu-2019-2031-fdm-bat
published_dataset_profile:
  dataset_role: "unit_process foreground dataset for fluid whey recovery, conditioning, storage, and dispatch"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "fluid whey datasets with matching sweet/acid status, source dairy process and species, solids/composition basis, treatment and concentration state, temperature, packaging form, geography, time period, plant gate, and allocation method"
  excluded_use: "whey or acid whey powder; dry whey ingredients; whey protein concentrate or isolate sold dry; lactose; whey permeate powder; whey cheese; formulated beverages; routes with incompatible product state or undisclosed upstream allocation"
  required_metadata: "reference flow and UUIDs; CPC reference; source dairy process and species; sweet/acid status; wet mass and composition basis; pH/acidity; treatment and concentration state; temperature; bulk/packaged state; included processes; geography; period; allocation method; linked upstream and treatment datasets"
  required_quality_disclosure: "meter and laboratory coverage; mass and solids balance; cleaning/start-up/shutdown coverage; allocation factors and sensitivity; unresolved quantitative evidence for range-free important flows; unresolved non-reference UUIDs; atomic waste and emission completeness; data quality assessment"
  update_trigger: "material change in source dairy route, product identity, composition or concentration, processing technology, energy or water system, cleaning regime, allocation method or prices, treatment route, regulation, source evidence, geography, or data age"
data_sources:
  - id: "codex-cxs-289-1995-whey-powders"
    type: "standard"
    reference: "Codex Alimentarius, CXS 289-1995, Standard for Whey Powders, https://www.fao.org/input/download/standards/184/CXS_289e.pdf (retrieved 2026-08-10)"
    used_for: "authoritative definition of whey and acid whey as fluid milk products separated from curd; distinction between fluid whey and powders"
