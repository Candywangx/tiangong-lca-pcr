allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "Multi-output foreground processes"
    rule: "First avoid allocation by submetering and subdividing directly attributable operations; investigate system expansion only when the study goal and complete added functions support it."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_coproduct_status
    applies_to: "Whey, cream, permeate, recovered cheese, brine, and other output streams"
    rule: "Determine product, co-product, recyclable material, or waste status from documented quality, legal status, destination, and revenue or service evidence. Do not classify a recoverable stream as waste merely to avoid allocation."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019
  - rule_id: allocation_physical_then_other
    applies_to: "Residual shared burdens"
    rule: "When subdivision or justified system expansion is not possible, use a relevant causal physical relationship supported by site data. If no such relationship exists, use another documented relationship such as economic value, report the period and prices, and test material sensitivity. This PCR supplies no default factor."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_operations
    applies_to: "Cleaning, refrigeration, ripening rooms, utilities, storage, and on-site treatment"
    rule: "Prefer direct meters, occupied time, equipment load, volume, or another causal driver. Document the driver and ensure all allocation shares for the shared operation reconcile to the complete measured total."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019
  - rule_id: allocation_upstream_feedstocks
    applies_to: "Purchased milk, dairy ingredients, and cheese feedstocks"
    rule: "Do not recreate upstream animal-husbandry or milk allocation in this foreground PCR. Use representative upstream datasets consistent with the declared species, geography, technology, and allocation method, and disclose mismatches."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_brine_and_rework
    applies_to: "Recirculated brine and reworked cheese"
    rule: "Record gross input, recovery or recirculation, purge, carry-over, and stock change. Assign only the measured net requirement and treatment burden to output; do not treat recovered material as burden-free or double count it as a new input."
    source_ids:
      - eu-fdm-bat-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_identity_and_scope
      process_id: "receipt_and_scope_control"
      flow_role: "Product identity and CPC gate"
      record_type: "Supplier record, receipt record, recipe, product specification, and classification decision"
      raw_fields: "site; lot; supplier lot; animal species; species-share basis; material name; product designation; CPC code; reviewer; decision reference; decision date"
      collection_method: "Reconcile approved supplier and lot documents to the production order; retain the explicit reason CPC 22259 applies and named subclasses do not"
      unit: "document and kg or fraction"
      frequency: "Every received lot and every recipe or classification change"
      temporal_coverage: "All lots represented by the dataset"
      site_scope: "Each manufacturing site and product"
      aggregation_rule: "No averaging across unresolved species or CPC decisions; aggregate only accepted lots with the same declared classification basis"
      quality_evidence: "Signed or controlled classification record, supplier evidence, production order, and review trace"
    - protocol_id: cp_batch_materials_and_recipe
      process_id: "primary_cheesemaking_ripening_and_brining_processed_cheese_manufacture"
      flow_role: "Material and formulation inputs"
      record_type: "Scale ticket, batch sheet, inventory issue, tank level, and composition certificate"
      raw_fields: "lot; material; supplier lot; animal species where milk-derived; gross and net amount; concentration; solids; activity basis; rework; returned amount; incorporated state"
      collection_method: "Reconcile actual batch issues and returns to the production record; separate fresh, recovered, and recirculated material"
      unit: "kg, m3, or documented activity unit"
      frequency: "Every production lot"
      temporal_coverage: "All lots represented by the dataset"
      site_scope: "Process line and site"
      aggregation_rule: "Sum net actual use by material and normalize only after conforming output is measured"
      quality_evidence: "Calibrated scale or tank record, inventory reconciliation, certificate, and operator approval"
    - protocol_id: cp_product_output_and_state
      process_id: "primary_cheesemaking_ripening_and_brining_processed_cheese_manufacture_finishing_and_factory_gate"
      flow_role: "Intermediate and final product output"
      record_type: "Scale ticket, production report, quality release, storage record, and draining-method record"
      raw_fields: "lot; process; gross mass; net cheese mass; free-brine mass or inclusion; packaging mass; drainage method; product form; ripening or processing state; storage time and condition; conforming and rejected mass"
      collection_method: "Weigh at defined transfer and gate points; reconcile quality release and declared state to the same lot"
      unit: "kg, time, temperature, and documented state"
      frequency: "Every lot and transfer; storage by actual residence period"
      temporal_coverage: "All lots represented by the dataset"
      site_scope: "Process line, storage area, and site"
      aggregation_rule: "Sum only conforming output under the same reference convention; report other states separately"
      quality_evidence: "Scale calibration, release record, lot genealogy, draining instruction, and storage log"
    - protocol_id: cp_energy_and_refrigeration_records
      process_id: "primary_cheesemaking_ripening_and_brining_processed_cheese_manufacture_finishing_and_factory_gate_cleaning_and_on_site_treatment"
      flow_role: "Electricity, heat, cooling, steam, and fuels"
      record_type: "Submeter, utility meter, fuel issue, operating-hour log, and engineering allocation"
      raw_fields: "meter id; start and end reading; carrier; unit; equipment; operating time; product lot; storage occupancy; allocation driver; conversion factor"
      collection_method: "Prefer process submeters; otherwise reconcile site meter totals and allocate with a documented causal driver"
      unit: "kWh, MJ, kg, m3, or source unit"
      frequency: "Per batch where metered; otherwise no less frequent than the site accounting period with lot linkage"
      temporal_coverage: "Representative production periods covering actual operation and storage"
      site_scope: "Equipment, process area, and site"
      aggregation_rule: "Preserve carriers; subtract documented exports; allocate reconciled totals; normalize to conforming output"
      quality_evidence: "Meter calibration, invoices, fuel records, run logs, and allocation reconciliation"
    - protocol_id: cp_water_and_cleaning_records
      process_id: "primary_cheesemaking_cleaning_and_on_site_treatment"
      flow_role: "Process, cooling, cleaning water and agents"
      record_type: "Water submeter, dosing record, clean-in-place log, purchase and stock record"
      raw_fields: "water source; fresh, recycled, or condensate status; use; volume or mass; agent; concentration; cycle; recovery; meter id; lot or line"
      collection_method: "Meter or batch-dose by use; reconcile cleaning-agent purchases and stock changes; separate process and cleaning streams"
      unit: "m3, kg, and concentration"
      frequency: "Each production or cleaning cycle where available; otherwise accounting period with process linkage"
      temporal_coverage: "Representative cycles at each site"
      site_scope: "Process line, cleaning circuit, and site"
      aggregation_rule: "Sum by source and use; deduct only verified recirculation without double counting; allocate shared cleaning by documented driver"
      quality_evidence: "Meter calibration, dosing system record, clean-in-place log, and stock reconciliation"
    - protocol_id: cp_coproduct_waste_and_destination
      process_id: "receipt_and_scope_control_primary_cheesemaking_ripening_and_brining_processed_cheese_manufacture_finishing_and_factory_gate"
      flow_role: "Co-products, rework, rejects, wastes, brine purge, and destinations"
      record_type: "Scale, tank, dispatch, waste manifest, sales record, and rework log"
      raw_fields: "stream; product or waste status; mass or volume; solids or composition; destination; revenue if used; treatment; rework linkage; stock change"
      collection_method: "Measure at transfer; reconcile product, co-product, rework, waste, and stock movements to the same production period"
      unit: "kg, m3, composition, and currency when economic allocation is used"
      frequency: "Every lot or dispatch; reconcile each accounting period"
      temporal_coverage: "All represented production and accounting periods, including stock changes"
      site_scope: "All relevant process lines and site"
      aggregation_rule: "Aggregate by status and destination only after lot reconciliation; do not merge whey, brine, wastewater, and solid waste"
      quality_evidence: "Scale or tank evidence, dispatch document, legal status, destination receipt, and ledger reconciliation"
    - protocol_id: cp_packaging_and_gate_state
      process_id: "finishing_and_factory_gate"
      flow_role: "Packaging inventory and gate configuration"
      record_type: "Packaging bill of materials, issue and return record, unit count, unit-mass test, and finished-goods specification"
      raw_fields: "material; component; count; verified unit mass; gross issue; return; scrap; packaged state; product net mass; packaging level"
      collection_method: "Reconcile bill of materials to actual issues and returns; periodically verify unit mass"
      unit: "kg and item"
      frequency: "Every packaging configuration and production lot; unit-mass checks on controlled schedule"
      temporal_coverage: "All represented packaging configurations and production periods"
      site_scope: "Each line and site"
      aggregation_rule: "Calculate net installed packaging by material and normalize to net cheese mass; keep packaging outside reference mass"
      quality_evidence: "Controlled bill of materials, count reconciliation, scale test, and product specification"
    - protocol_id: cp_wastewater_and_direct_emissions
      process_id: "cleaning_and_on_site_treatment"
      flow_role: "Wastewater and direct elementary flows"
      record_type: "Flow meter, tank record, laboratory result, stack or discharge measurement, activity record, and factor record"
      raw_fields: "stream; point; flow; pH; temperature; measured parameter; concentration; load; sampling time; air, water, or soil compartment; activity; factor; treatment route"
      collection_method: "Use site monitoring at the most specific point; calculate only from collected activity and a documented factor when direct measurement is unavailable"
      unit: "m3, kg, concentration, and source unit"
      frequency: "At the applicable site monitoring frequency and linked to the production period"
      temporal_coverage: "Representative production and discharge periods, including normal and relevant abnormal operation"
      site_scope: "All relevant discharge and emission points"
      aggregation_rule: "Calculate loads from matched flow and concentration; reconcile treated and bypassed streams; allocate only after site total is complete"
      quality_evidence: "Meter and laboratory QA, sampling record, factor citation, treatment log, and discharge reconciliation"
  calculation_rules:
    - id: calc_reference_net_mass
      applies_to: "Final reference output"
      rule: "Net reference cheese mass = gross weighed unit or lot mass minus excluded packaging mass minus free brine excluded by the declared draining convention. If commercial net content uses another convention, report both masses and select one explicit reference convention."
      inputs:
        - "Gross mass"
        - "packaging mass"
        - "free-brine mass"
        - "draining method"
        - "conformity status"
      output: "kg net conforming cheese"
      source_ids:
        - codex-cxs-283-1978
        - eu-pef-2021-2279
    - id: calc_inventory_normalization
      applies_to: "Every inventory amount"
      rule: "Normalized amount = reconciled amount attributable to represented lots divided by net conforming reference cheese output for the same lots."
      inputs:
        - "Reconciled row amount"
        - "net conforming output"
        - "allocation share where applicable"
      output: "Row amount per 1 kg reference output"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_batch_mass_reconciliation
      applies_to: "Each production process"
      rule: "Reconcile input mass, output cheese, co-products, rework, waste, direct mass releases, evaporation or moisture change, and stock change. Report the residual and investigate it; this PCR supplies no default cheese yield."
      inputs:
        - "Batch material records"
        - "measured outputs"
        - waste
        - emissions
        - "stock change"
        - "moisture or evaporation evidence"
      output: "Process mass-balance table and unresolved residual"
      source_ids:
        - eu-fdm-bat-2019
        - eu-pef-2021-2279
    - id: calc_energy_conversion
      applies_to: "Utility records"
      rule: "Convert original energy or carrier units only with a cited factor appropriate to the carrier and condition; retain the original quantity and report each carrier separately."
      inputs:
        - "Meter or invoice quantity"
        - carrier
        - "conversion factor and source"
      output: "kWh or MJ plus preserved source quantity"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_water_and_wastewater_load
      applies_to: "Water and wastewater"
      rule: "Water or wastewater load = matched stream volume multiplied by measured concentration where load is not directly measured. Keep process, cooling, cleaning, brine, and condensate streams distinct."
      inputs:
        - "Stream volume"
        - concentration
        - "sampling period"
        - "density where mass conversion is used"
      output: "Stream quantity and pollutant load by period"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_shared_operation_allocation
      applies_to: "Shared utilities and support operations"
      rule: "Attributable amount = complete reconciled shared total multiplied by the documented causal allocation share; shares across all users shall sum to one for the same total and period."
      inputs:
        - "Shared total"
        - "allocation driver"
        - "all user shares"
        - "production period"
      output: "Attributable shared-operation amount"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_coproduct_allocation
      applies_to: "Residual multi-output burden"
      rule: "Apply the selected hierarchy in Section 7. Do not calculate an allocation factor until output status, quantities, physical relation, and any economic data are documented for the same representative period."
      inputs:
        - "Complete process inventory"
        - "output quantities and status"
        - "chosen relation"
        - "price period if relevant"
      output: "Documented allocation factors and sensitivity result"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_scope_identity
      applies_to: "PCR selection and reference product"
      requirement: "Every represented lot passes the CPC 22259 gate and retains animal-species and classification evidence. Unresolved mixed-species classification is excluded from aggregation."
      evidence: "Controlled classification decision, supplier evidence, recipe, and reviewer identity"
    - id: dq_product_state
      applies_to: "Reference output"
      requirement: "Fresh/unripened, ripened, mould-ripened, or processed state; brine and draining convention; ingredients and coatings; product form; packaging; and storage are complete and consistent across reference mass and inventory."
      evidence: "Product specification, batch record, label or release record, draining instruction, and packaging bill of materials"
    - id: dq_temporal_representativeness
      applies_to: "Foreground activity data"
      requirement: "The dataset reports dates, number of lots, production volume, operating modes, storage periods, and exceptional events. Seasonal or campaign differences are retained when material."
      evidence: "Lot genealogy, production calendar, meter periods, and representativeness assessment"
    - id: dq_technological_and_geographical_representativeness
      applies_to: "Site and route"
      requirement: "Declare manufacturing site, equipment route, capacity or operating mode, upstream dataset geography and technology, and any mismatch. Do not combine materially different fresh, ripened, or processed routes without separate results."
      evidence: "Process flow sheet, site record, route description, and upstream dataset metadata"
    - id: dq_measurement_and_reconciliation
      applies_to: "Material, energy, water, waste, and emission records"
      requirement: "Retain units, meter or scale identity, calibration or QA evidence, data transformations, allocation, and reconciliation residuals. Missing numerical values remain explicit data gaps and are not filled from Codex limits or EU BAT performance levels."
      evidence: "Calibration and laboratory QA, raw records, formulas, source citations, and reconciliation report"
    - id: dq_completeness
      applies_to: "Foreground processes"
      requirement: "Quantify all known material and energy inputs, products, co-products, waste, wastewater, and direct elementary flows for included processes, or document why a row is not applicable or remains a gap."
      evidence: "Completed process checklist, raw-field coverage matrix, and approved gap log"
    - id: dq_source_scope
      applies_to: "Use of standards and guidance"
      requirement: "Record which source provision supports identity, boundary, collection, or allocation. Do not extend fresh-cheese rules to ripened or processed cheese and do not use quality limits as LCI amounts."
      evidence: "Source-to-rule matrix and reviewer check"
validation_rules:
  - rule_id: validate_scope_gate
    applies_to: "Product category"
    rule: "Fail when animal-species evidence or the auditable classification decision is missing, when CPC 22259 is unresolved, or when the product is classifiable under CPC 22251, 22252, 22253, or 22254."
    source_ids:
      - unsd-cpc-3-0
      - codex-cxs-206-1999
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Fail unless the product flow UUID, Mass UUID, unit-group UUID, kg unit, 1 kg amount, and net-mass convention match Section 3. The word Cheese alone never satisfies scope."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_state_qualifiers
    applies_to: "Product state"
    rule: "Fail when ripening/processing state, brine and draining convention, incorporated ingredients and coatings, product form, packaging state, storage condition, lot, or site is absent. Apply CXS 221-2001 only to fresh/unripened product and CXS 283-1978 only within its scope."
    source_ids:
      - codex-cxs-283-1978
      - codex-cxs-221-2001
  - rule_id: validate_process_route
    applies_to: "Process inventory"
    rule: "Fail when a route process declared present lacks its detailed inventory, or when a detailed process is not linked to the process map and represented lots."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019
  - rule_id: validate_mass_and_flow_reconciliation
    applies_to: "Process and factory-gate balances"
    rule: "Fail when reference output is not measured, packaging or excluded free brine is included without disclosure, co-products or wastes are omitted, or the reported residual lacks investigation. No default yield is accepted."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019
  - rule_id: validate_foreground_quantities
    applies_to: "LCI quantities"
    rule: "Fail any category-wide default copied from a Codex product-quality provision, EU BAT performance level, or uncited assumption. Material, energy, water, recipe, yield, waste, and emission amounts require site and lot records or a transparent calculation from them."
    source_ids:
      - codex-cxs-206-1999
      - codex-cxs-283-1978
      - codex-cxs-221-2001
      - eu-fdm-bat-2019
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "Multi-output and shared operations"
    rule: "Fail when allocation is used without documenting attempts to avoid it, output status, method, data period, factors, reconciliation to the complete total, and sensitivity when a non-physical relationship is material."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_upstream_and_recursive_inputs
    applies_to: "Purchased milk, cheese, other inputs, and treatment services"
    rule: "Fail when a material input lacks a representative upstream dataset or when same-category cheese is recursively unfolded instead of linked once with its classification and species basis."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_source_scope
    applies_to: "Evidence use"
    rule: "Fail when a source is applied outside its stated product or installation scope, or when a quality, composition, permit, or BAT value is treated as an observed LCI quantity."
    source_ids:
      - codex-cxs-206-1999
      - codex-cxs-283-1978
      - codex-cxs-221-2001
      - eu-fdm-bat-2019
published_dataset_profile:
  dataset_role: "Product-specific foreground manufacturing dataset for one declared CPC 22259 cheese route and factory-gate state"
  downstream_use: "secondary_dataset for documented studies and background_dataset only when the user's product, species/classification basis, route, geography, technology, time, brine convention, and packaging state are sufficiently representative"
  allowed_use: "Factory-gate modelling of the declared fresh/unripened, ripened, mould-ripened, or processed CPC 22259 cheese; downstream life-cycle models that link separate upstream, distribution, use, and end-of-life datasets"
  excluded_use: "Any cheese classified to CPC 22251-22254; unresolved mixed-species cheese; plant-based substitutes; generic “all cheese” averages; use of Codex limits or EU BAT performance levels as observed inventory; undisclosed transfer across materially different product states or routes"
  required_metadata: "PCR id and version used; CPC decision and evidence; animal species and share basis; product and route state; brine and draining convention; recipe and incorporated ingredients; product form; packaging and reference-mass convention; site and geography; technology; represented dates and lots; storage; process map; upstream datasets; allocation; source versions"
  required_quality_disclosure: "Coverage by process and raw field; measured versus calculated values; meter, scale, laboratory, and calibration evidence; mass, energy, water, and waste reconciliation; allocation drivers and sensitivity; representativeness; data gaps; uncertainty; source-scope limits; deviations"
  update_trigger: "Change in animal species or CPC decision, recipe or product identity, fresh/ripened/processed route, brine or draining convention, packaging or reference-mass basis, site or technology, allocation or co-product destination, upstream dataset, material supplier, monitoring method, or represented period; or evidence that a cited source has materially changed"
