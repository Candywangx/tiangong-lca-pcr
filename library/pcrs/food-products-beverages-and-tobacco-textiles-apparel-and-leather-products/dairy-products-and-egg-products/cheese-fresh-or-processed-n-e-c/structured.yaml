system_boundary:
  rules:
    - rule_id: boundary_scope_gate
      applies_to: "PCR selection"
      rule: "Stop before modelling unless the retained evidence supports CPC 22259 and excludes classification to CPC 22251, 22252, 22253, and 22254. Mixed-species and other-species products require an auditable classification record."
      source_ids:
        - unsd-cpc-3-0
    - rule_id: boundary_foreground_extent
      applies_to: "Manufacturing foreground"
      rule: "Include all site operations causally required from receipt through conforming factory-gate cheese output, including applicable coagulation, whey separation, salting, brining, ripening, processing, finishing, packaging, cold storage, cleaning, and on-site treatment. Report process exclusions."
      source_ids:
        - eu-fdm-bat-2019
        - eu-pef-2021-2279
    - rule_id: boundary_recursive_cheese_input
      applies_to: "Same-category cheese input"
      rule: "Stop recursion at a purchased or transferred cheese input; link a separate upstream dataset and retain the input's species, classification, composition, amount, and allocation status."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_packaging_and_storage
      applies_to: "Factory-gate state"
      rule: "Include packaging installed and on-site storage used before the declared gate when present, but exclude packaging mass from the cheese reference mass. Declare brine and draining conventions separately."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_no_default_lci_from_standards
      applies_to: "Source use"
      rule: "Codex product definitions and EU BAT method or performance information shall not be converted into a universal yield, energy, water, recipe, emission, or waste value. Use site and lot records for quantities."
      source_ids:
        - codex-cxs-206-1999
        - codex-cxs-283-1978
        - codex-cxs-221-2001
        - eu-fdm-bat-2019
boundary_abstraction:
  declared_starting_condition: "Milk, dairy ingredients, cheese feedstocks, characterizing ingredients, processing aids, cleaning materials, packaging, water, and energy carriers as received at the manufacturing-site gate, with supplier identity and state declared"
  starting_condition_role: "Foreground manufacturing entry point; upstream production and delivery burdens are linked through separate datasets"
  product_classification_scope: "Only a product with auditable CPC 3.0 subclass 22259 evidence after excluding products classifiable to 22251, 22252, 22253, or 22254"
  recursive_input_rule: "When cheese in the same product category enters processed-cheese or blending operations, record it once as a purchased or transferred product input with its upstream dataset and declared species/classification basis; do not recursively unfold the same production inside this foreground package"
  upstream_dataset_requirement: "Separate representative upstream datasets are required for each milk or cheese feedstock, other material input, energy carrier, water supply, packaging material, transport service when in study scope, and waste-treatment service"
  disclosure: "Declare included unit processes; animal species and CPC decision; product route and state; free-brine and draining convention; ingredients and coatings; packaged state; on-site storage; shared operations; allocation choices; upstream dataset identities; exclusions; data gaps; and any deviation from this boundary"
