  - id: species_composition_basis
    applies_to: "Milk-derived inputs used to establish CPC scope"
    required_property_ref:
      name: "Mass or supplier composition basis"
      uuid: ""
    required_unit: "kg or documented fraction"
    rule: "Preserve supplier and batch evidence for animal species and the basis of each species share. Do not infer species from the generic flow name or product trade name."
  - id: energy_carrier_preservation
