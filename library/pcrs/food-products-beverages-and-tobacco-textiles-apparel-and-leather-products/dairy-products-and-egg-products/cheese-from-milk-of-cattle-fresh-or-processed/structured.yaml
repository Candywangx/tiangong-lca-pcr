validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Confirm exactly 1 kg net finished cheese uses product flow 221efbce-690d-492b-9d15-79d0ac862e35, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids: []
  - rule_id: validate_route_and_qualifiers
    applies_to: "dataset identity"
    rule: "Reject conformance when cattle-milk share, product form, route, moisture/FDM basis, ripening condition, formulation, packaging state, geography, or plant gate is missing."
    source_ids:
      - codex-cxs-283-1978-2024
  - rule_id: validate_process_completeness
    applies_to: "foreground process inventory"
    rule: "Require one applicable cheese-manufacturing route plus site utilities/cleaning/dispatch; every performed route operation and every material input, co-product, waste, and direct emission must be represented or explicitly justified as not applicable."
    source_ids:
      - us-epa-ap42-9-6-1-cheese
  - rule_id: validate_whey_and_allocation
    applies_to: "whey and other co-products"
    rule: "Require amount, composition basis, destination, product/waste classification, allocation decision, and allocation-factor sum; do not accept zero-burden recovered whey or undocumented economic allocation."
    source_ids:
      - eu-2019-2031-fdm-bat
      - eu-2021-2279-environmental-footprint
  - rule_id: validate_bat_context
    applies_to: "cheese-dominant installation"
    rule: "When applicability conditions are met, report—not silently convert—the annual energy and wastewater indicators per tonne raw materials and explain values outside 0.10-0.22 MWh/t and 0.75-2.5 m3/t respectively; these indicative values are QA context, not product-output limits."
    source_ids:
      - eu-2019-2031-fdm-bat
  - rule_id: validate_provisional_ranges
    applies_to: "reasoned-estimate ranges"
    rule: "Flag each provisional range for replacement or explicit methodology review; never substitute the range midpoint for missing foreground data."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process foreground data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "modelling cattle-milk cheese manufactured by a route, geography, product form, composition, ripening condition, and packaging state matching the dataset disclosures"
  excluded_use: "non-cattle cheese; plant-based analogues; farm-gate milk production; retail or consumer-stage claims; comparative assertions across unlike cheese forms without functional and compositional adjustment"
  required_metadata: "PCR id; reference-flow UUIDs; product and route qualifiers; plant geography; reporting period; raw-material origin; process map; upstream dataset links; allocation method; co-product destinations; packaging state; data-quality evidence"
  required_quality_disclosure: "temporal and site coverage; measurement and balance closure; shared-service allocation; proxy datasets; missing flow UUIDs; provisional ranges; BAT indicator applicability and variance explanations"
  update_trigger: "material change in formulation, milk origin, product form, process technology, ripening/holding, packaging, energy or water system, co-product destination, allocation method, geography, or data quality"
