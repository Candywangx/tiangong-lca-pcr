allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "multifunctional plant and shared operations"
    rule: "Avoid allocation where possible by unit-process subdivision, route-specific metering, or system expansion; collect inventory only for operations directly attributable to the declared cheese when subdivision is feasible."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_physical_relation
    applies_to: "inseparable cheese, whey, cream, and other co-products"
    rule: "If allocation cannot be avoided, use a documented causal physical relationship relevant to the co-product functions; do not select wet mass solely because it is convenient."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_other_relation
    applies_to: "multifunctional output without defensible physical relation"
    rule: "If no relevant physical relationship can be demonstrated, use an explicitly justified other relationship such as economic allocation, disclose price geography and averaging period, and provide a sensitivity result for material co-products."
    source_ids:
      - eu-2021-2279-environmental-footprint
  - rule_id: allocation_whey_status
    applies_to: "separated whey and acid whey"
    rule: "Classify recovered whey as a co-product when it has a further use or market destination and record its amount and destination; classify it as waste only when discarded to treatment under the declared conditions."
    source_ids:
      - eu-2019-2031-fdm-bat
      - us-epa-ap42-9-6-1-cheese
  - rule_id: allocation_rework
    applies_to: "internal rework"
    rule: "Return internally reworked cheese or curd to the batch mass balance without creating a co-product credit; disclose the rework quantity and associated additional utilities."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_natural_route_batch_balance
      process_id: "natural_cheese_manufacture"
      flow_role: "dairy inputs, ingredients, cheese, whey, and solid losses"
      record_type: "batch production and laboratory records"
      raw_fields: "batch id; cattle-milk kg; composition; ingredient kg; cheese kg; whey kg; reject kg; moisture/FDM; timestamps"
      collection_method: "calibrated tanks/scales reconciled with batch sheets and laboratory results"
      unit: "kg and composition units"
      frequency: "each batch"
      temporal_coverage: "representative continuous 12-month period or all batches in declared campaign"
      site_scope: "all included natural/fresh cheese lines"
