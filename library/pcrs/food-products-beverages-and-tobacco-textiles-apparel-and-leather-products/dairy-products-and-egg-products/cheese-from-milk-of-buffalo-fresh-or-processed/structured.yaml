      unit: "kg"
      frequency: "every batch or dispatch"
      temporal_coverage: "full reporting period"
      site_scope: "reporting facility and direct recipient"
      aggregation_rule: "sum separately by output state and destination; classify non-beneficial output as waste"
      quality_evidence: "calibrated meter or scale; dispatch note; recipient evidence"
    - protocol_id: cp_ripening_brining_records
      process_id: "ripening_brining"
