      raw_fields: "each input; milk species; mass; output; rework; temperature/time where used for process identity"
      collection_method: "reconcile issued formulation with measured outputs and residues"
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "all included processed-cheese batches"
      site_scope: "reporting facility"
      aggregation_rule: "aggregate only batches matching declared formulation and buffalo-only rule"
      quality_evidence: "approved formulation; calibrated scales; batch closure"
    - protocol_id: cp_packaging_records
      process_id: "packaging_factory_storage"
      flow_role: "packaging materials"
      record_type: "packaging issue, supplier specification, and reject record"
      raw_fields: "material; format; supplier lot; issued items or mass; returned items; rejects; item mass"
      collection_method: "reconcile packaging issues with packed output and rejects"
      unit: "kg or item"
      frequency: "each packaging lot with monthly reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "reporting facility"
      aggregation_rule: "convert counts using lot-specific mass and sum by material"
      quality_evidence: "supplier specification; measured item mass; stock reconciliation"
    - protocol_id: cp_waste_records
      process_id: "multiple"
      flow_role: "material losses and wastes"
      record_type: "waste transfer, scale, and destination record"
      raw_fields: "source process; material; state; mass; destination; recovery; date"
      collection_method: "measure at collection or dispatch and reconcile with batch or period balance"
      unit: "kg or m3"
      frequency: "each transfer with monthly reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "reporting facility and direct treatment destination"
      aggregation_rule: "aggregate by source, material, and treatment route without netting against inputs"
      quality_evidence: "scale or meter evidence; transfer note; treatment receipt"
    - protocol_id: cp_cleaning_treatment_records
      process_id: "cleaning_wastewater"
      flow_role: "cleaning and treatment inputs"
      record_type: "cleaning programme, dosing, meter, and stock record"
      raw_fields: "system; chemical; water; dose; operating cycle; stock movement; served processes"
      collection_method: "direct dosing and water metering or documented allocation"
      unit: "kg or m3"
      frequency: "every cleaning cycle or meter interval"
      temporal_coverage: "full reporting period"
      site_scope: "reporting facility"
      aggregation_rule: "aggregate by served system and allocate residual common cleaning using documented driver"
      quality_evidence: "calibration; stock reconciliation; cleaning log"
    - protocol_id: cp_wastewater_records
      process_id: "cleaning_wastewater"
      flow_role: "wastewater and residues"
      record_type: "flow meter, sample, laboratory, and treatment record"
      raw_fields: "discharge volume; sampling time; concentration; pollutant load; destination; sludge and residue mass"
      collection_method: "flow measurement and representative sampling appropriate to the discharge"
      unit: "m3, kg, or mg/L with load calculation"
      frequency: "continuous or permit/management frequency"
      temporal_coverage: "full reporting period with variability retained"
      site_scope: "reporting facility discharge and on-site treatment"
      aggregation_rule: "calculate loads from matched flow and concentration data; allocate with documented causal drivers"
      quality_evidence: "meter calibration; laboratory QA; sample representativeness; treatment reconciliation"
    - protocol_id: cp_refrigerant_records
      process_id: "packaging_factory_storage"
      flow_role: "refrigerant losses"
      record_type: "equipment inventory, service, purchase, recovery, and stock record"
      raw_fields: "refrigerant; equipment; opening stock; additions; recovery; closing stock; transfer"
      collection_method: "annual or reporting-period mass balance by refrigerant and equipment system"
      unit: "kg"
      frequency: "each service event and period close"
      temporal_coverage: "full reporting period"
      site_scope: "systems serving included operations"
      aggregation_rule: "calculate unrecovered loss and allocate only across served products with documented driver"
      quality_evidence: "service certificates; cylinder weights; inventory reconciliation"
    - protocol_id: cp_direct_emission_records
      process_id: "cleaning_wastewater"
      flow_role: "direct site emissions"
      record_type: "monitoring and operating record"
      raw_fields: "source; substance; compartment; measured value; flow; operating time; method; calculation factor"
      collection_method: "use applicable monitoring or calculation method and preserve original observations"
      unit: "kg and original measurement unit"
      frequency: "method- or permit-specific"
      temporal_coverage: "full reporting period"
      site_scope: "included site sources"
      aggregation_rule: "calculate period mass by substance, then attribute to served operations"
      quality_evidence: "method record; calibration; laboratory QA; applicability statement"
  calculation_rules:
    - id: calc_buffalo_origin_check
      applies_to: "all milk-derived inputs"
      rule: "List every milk-derived input by animal species. Applicability is buffalo-only when all such inputs are evidenced as buffalo. Any non-buffalo or unknown species result is a classification-review trigger, not a quantity to be silently included."
      inputs:
        - "supplier and batch animal-species records"
        - formulation
      output: "buffalo-only pass or mixed/unknown classification trigger"
      source_ids:
        - codex-cxs-206-1999
        - unsd-cpc-3-0
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = attributable reporting-period or batch amount / released net reference cheese mass on the declared basis"
      inputs:
        - "attributable amount"
        - "released net cheese mass"
      output: "amount per 1 kg reference cheese"
      source_ids:
        - eu-pef-2021
    - id: calc_net_cheese_mass
      applies_to: "reference product"
      rule: "net cheese mass = gross marketed unit mass - packaging mass - separately present free brine mass; use measured values for the same lot and declare any commercial convention that differs"
      inputs:
        - "gross unit mass"
        - "packaging mass"
        - "free brine mass"
      output: "kg net cheese"
      source_ids: []
    - id: calc_batch_mass_balance
      applies_to: "milk preparation, cheesemaking, ripening/brining, and processing"
      rule: "measured inputs + opening stock = measured outputs + closing stock + measured or reconciled losses; investigate unexplained imbalance rather than forcing a standard yield"
      inputs:
        - "batch input"
        - output
        - stock
        - "and loss records"
      output: "reconciled batch balance and unexplained difference"
      source_ids: []
    - id: calc_brine_balance
      applies_to: "brining"
      rule: "external brine inputs = make-up water + make-up salt + purchased brine; outputs and stock change shall separately identify product carry-over, purge, wastewater, recovery, and closing stock"
      inputs:
        - "brine composition"
        - make-up
        - purge
        - carry-over
        - "and stock records"
      output: "material-specific brine balance"
      source_ids: []
    - id: calc_utility_allocation
      applies_to: "common utilities"
      rule: "attributable utility = measured process use; for unmetered residuals, apply a disclosed causal driver over the same period and retain both facility total and allocation denominator"
      inputs:
        - meters
        - invoices
        - "operating driver"
        - "product output"
      output: "utility by process and product"
      source_ids:
        - eu-fdm-bat-2019
        - eu-pef-2021
    - id: calc_refrigerant_loss
      applies_to: "refrigeration systems"
      rule: "loss by refrigerant = opening stock + additions + received transfers - closing stock - recovered quantity - outgoing transfers, reconciled with service events"
      inputs:
        - "refrigerant stock and service records"
      output: "kg direct emission by refrigerant"
      source_ids:
        - eu-pef-2021
    - id: calc_wastewater_load
      applies_to: "wastewater"
      rule: "pollutant load shall be calculated from temporally matched discharge flow and measured concentration using the documented sampling and aggregation method; do not substitute a cheese quality or facility benchmark"
      inputs:
        - flow
        - concentration
        - "sampling interval"
      output: "kg pollutant by reporting period"
      source_ids:
        - eu-fdm-bat-2019
  data_quality_requirements:
    - id: dq_species_traceability
      applies_to: "milk and milk-derived inputs"
      requirement: "Trace every input to supplier and lot animal-species evidence; unknown or non-buffalo origin blocks exact use of this PCR pending classification determination."
      evidence: "supplier certificate; receiving record; formulation and lot link"
    - id: dq_state_traceability
      applies_to: "reference cheese"
      requirement: "Link the released mass to fresh/unripened, ripened, or processed state; brine/salt state; formulation; packaging; storage condition; and net-mass basis."
      evidence: "product specification; batch release; packaging and warehouse records"
    - id: dq_measurement
      applies_to: "foreground quantities"
      requirement: "Use calibrated meters or scales where available, preserve original units, and document all conversions and allocations."
      evidence: "calibration certificates; meter coverage; conversion record"
    - id: dq_temporal
      applies_to: "reporting period"
      requirement: "Cover a representative production period and the full ripening or storage duration attributable to released lots; disclose seasonal, campaign, shutdown, and product-mix effects."
      evidence: "production calendar; lot genealogy; reporting-period reconciliation"
    - id: dq_completeness
      applies_to: "foreground boundary"
      requirement: "Reconcile milk, ingredients, cheese, co-products, wastes, water, energy, brine, packaging, wastewater, and direct emissions; disclose missing streams and proxies."
      evidence: "mass and utility balances; completeness checklist; exception log"
    - id: dq_source_applicability
      applies_to: "external rules and benchmarks"
      requirement: "Record jurisdiction, installation threshold, product mix, process state, and other applicability conditions before using a source. Product-quality limits and BAT facility indicators shall not be treated as universal LCI amounts."
      evidence: "source applicability statement linked to each use"
    - id: dq_upstream
      applies_to: "linked datasets"
      requirement: "Prefer supplier-specific buffalo milk and material datasets when available; otherwise document geographic, temporal, and technological representativeness and proxy limitations."
      evidence: "dataset metadata; supplier linkage; proxy justification"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "Require product flow UUID 4b760369-5f64-47c7-b922-9dbe4b8abf98, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, reference unit kg, and reference amount 1 kg."
    source_ids: []
  - rule_id: validation_buffalo_only
    applies_to: "category applicability"
    rule: "Pass exact category applicability only when every milk and milk-derived input has buffalo-origin evidence."
    source_ids:
      - codex-cxs-206-1999
      - unsd-cpc-3-0
  - rule_id: validation_mixed_milk
    applies_to: "category applicability"
    rule: "If any non-buffalo or unknown-species milk-derived input exists, require a documented classification determination and do not report this PCR as an exact match until accepted."
    source_ids:
      - codex-cxs-206-1999
      - unsd-cpc-3-0
  - rule_id: validation_product_state
    applies_to: "reference product"
    rule: "Require declaration of fresh/unripened, ripened, or processed state; named variety or specification; salt/brine state; ingredients; packaging; storage condition; and net-mass basis."
    source_ids:
      - codex-cxs-283-1978
      - codex-cxs-221-2001
  - rule_id: validation_process_coverage
    applies_to: "process inventory"
    rule: "Require both required process modules and every conditional module triggered by the declared route, including brining, ripening, processed-cheese manufacture, packaging, storage, refrigeration, and on-site treatment when applicable."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validation_mass_balance
    applies_to: "each production route"
    rule: "Require reconciled batch or period mass balances with unexplained differences investigated and disclosed; reject substitution of a generic yield or loss factor."
    source_ids: []
  - rule_id: validation_allocation
    applies_to: "co-products and shared operations"
    rule: "Require subdivision evidence or a documented causal/allocation basis, co-product destination evidence, consistent reporting-period application, and sensitivity where residual allocation is material."
    source_ids:
      - eu-pef-2021
  - rule_id: validation_source_scope
    applies_to: "use of standards and BAT evidence"
    rule: "Require an applicability statement for every externally sourced constraint. Reject any use of Codex product-quality limits or EU FDM BAT facility indicators as universal recipe, yield, energy, water, wastewater, or emission values."
    source_ids:
      - codex-cxs-283-1978
      - codex-cxs-221-2001
      - eu-fdm-bat-2019
  - rule_id: validation_foreground_records
    applies_to: "quantitative inventory"
    rule: "Require site- and batch-specific records or an explicit PCR calculation rule for all material quantities. Missing records remain data gaps and shall not be replaced by undocumented defaults."
    source_ids:
      - eu-pef-2021
      - eu-fdm-bat-2019
  - rule_id: validation_inventory_completeness
    applies_to: "foreground dataset"
    rule: "Require milk and ingredients, product and co-products, water and utilities, brine, packaging, waste, wastewater, and direct-emission checks with skipped or non-applicable items reported explicitly."
    source_ids:
      - eu-fdm-bat-2019
published_dataset_profile:
  dataset_role: "Foreground production dataset suitable for publication as a secondary_dataset or background_dataset after review"
  downstream_use: "Factory-gate process datasets and lifecycle models for declared buffalo-only fresh/unripened, ripened, or processed cheese products"
  allowed_use: "Use for products matching buffalo-only origin, product state, formulation, brine, packaging, storage, geography, technology, and time represented by the dataset; broader use requires documented representativeness review"
  excluded_use: "Mixed-milk cheese without classification determination; cattle-, sheep-, goat-, or other non-buffalo cheese; non-cheese products; routes or market states not represented; direct use of Codex quality limits or BAT facility indicators as LCI defaults"
  required_metadata: "PCR id and version used; Tiangong reference flow UUID; CPC context; facility geography and technology; reporting period; animal-species evidence; product state and specification; salt/brine, ingredient, packaging, net-mass, and storage state; process coverage; upstream links; co-product status and allocation"
  required_quality_disclosure: "Primary-data coverage; calibration and reconciliation; temporal, geographic, and technological representativeness; missing flows; allocation and sensitivity; data-source applicability; proxy datasets; uncertainty and review status"
  update_trigger: "Change in milk species or supplier-origin evidence, formulation, cheese state, brine practice, packaging, technology, facility, allocation, co-product destination, upstream dataset, reporting period representativeness, or material water/energy/emission performance"
