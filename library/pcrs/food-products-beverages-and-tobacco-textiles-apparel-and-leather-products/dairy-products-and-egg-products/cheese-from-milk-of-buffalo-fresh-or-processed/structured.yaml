system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when buffalo milk and other purchased materials are received at the reporting cheese facility. It includes identity checks and reception, storage and preparation of milk, thermal treatment or standardisation when performed, coagulation and curd handling, whey separation, salting or brining, ripening, processed-cheese operations, packaging, factory storage, cleaning, refrigeration, on-site utility use, direct emissions, waste handling, and on-site wastewater treatment when these activities serve the declared product. Upstream production of buffalo milk, ingredients, energy carriers, water, packaging, and purchased services is represented by linked supplier-specific or appropriate secondary datasets. Distribution after the declared factory gate, retail, consumer use, and end-of-life are outside this foreground dataset unless a downstream lifecycle model adds them transparently."
      source_ids: []
    - rule_id: boundary_buffalo_origin
      applies_to: "all milk and milk-derived inputs"
      rule: "Include this product category only when supplier and batch evidence supports buffalo origin for every milk-derived input. Any non-buffalo input triggers an explicit classification determination before modelling proceeds."
      source_ids:
        - codex-cxs-206-1999
        - unsd-cpc-3-0
    - rule_id: boundary_route_state
      applies_to: "foreground process selection"
      rule: "Include only process modules actually used by the declared route, but do not omit ripening, brining, processing, packaging, cold storage, cleaning, refrigeration, waste, or wastewater activities when they occur."
      source_ids:
        - codex-cxs-283-1978
        - codex-cxs-221-2001
        - eu-fdm-bat-2019
    - rule_id: boundary_upstream_links
      applies_to: "purchased inputs and services"
      rule: "Represent production of received materials and purchased services with linked upstream datasets rather than duplicating them in the cheese factory foreground."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_bat_applicability
      applies_to: "application of EU FDM BAT evidence"
      rule: "Use EU FDM BAT requirements or performance information only when the reporting installation and operating basis fall within the Decision's stated scope and the cited dairy condition applies. Never transfer facility-level or product-quality values into a universal cheese LCI."
      source_ids:
        - eu-fdm-bat-2019
boundary_abstraction:
  declared_starting_condition: "Buffalo milk and all other milk-derived inputs received at the reporting facility, identified by supplier, lot, animal species, physical state, and quantity"
  starting_condition_role: "Upstream product inputs with linked production datasets; the cheese factory foreground starts at receipt"
  product_classification_scope: "Buffalo-only cheese in CPC 3.0 subclass 22252; the cheese state may be fresh/unripened, ripened, or processed when declared"
  recursive_input_rule: "Purchased buffalo cheese or curd used to make the reference product is recorded as an input with its own upstream dataset and is not recursively recreated inside this foreground dataset. Purchased mixed-species cheese or curd triggers classification determination before use of this PCR."
  upstream_dataset_requirement: "Link buffalo milk, purchased buffalo cheese/curd, other ingredients, energy, water, packaging, and external treatment or transport services to temporally, geographically, and technologically representative upstream datasets; disclose proxies"
