      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure the released reference cheese on the declared net-product basis. Exclude packaging mass and separately present free brine from the 1 kg cheese reference amount; inventory them separately. If commercial records use another basis, retain the original record and document the conversion."
  - id: measurement_milk_species
    applies_to: "milk and milk-derived inputs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record each animal species and supplier lot separately. Do not merge non-buffalo milk-derived material into a generic milk total; any non-buffalo quantity triggers the mixed-milk classification rule."
  - id: measurement_product_state
    applies_to: "reference product and intermediate cheese"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve the measured state at each weighing point and declare whether mass is before or after draining, salting/brining, ripening, processing, and packaging. Do not apply a standard moisture, yield, or retention factor."
  - id: measurement_brine
