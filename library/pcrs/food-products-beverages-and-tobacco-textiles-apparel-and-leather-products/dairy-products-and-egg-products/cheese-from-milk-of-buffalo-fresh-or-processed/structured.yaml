    required_property_ref:
      name: "Mass or volume with measured density"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Record make-up salt, make-up water, purchased brine, recirculated internal brine, purge, carry-over, and wastewater separately. Convert volume to mass only with batch- or period-specific density evidence."
  - id: measurement_energy
    applies_to: "electricity, fuels, steam, heat, cooling, and compressed air"
    required_property_ref:
      name: "Delivered energy or physical carrier quantity"
      uuid: ""
    required_unit: "kWh, MJ, kg, or m3 as recorded"
    rule: "Retain original meter or invoice units and conversion factors. Allocate common utilities only after separately metered process use has been exhausted; do not use a generic cheese-energy factor."
  - id: measurement_packaging
    applies_to: "primary, secondary, and tertiary packaging"
