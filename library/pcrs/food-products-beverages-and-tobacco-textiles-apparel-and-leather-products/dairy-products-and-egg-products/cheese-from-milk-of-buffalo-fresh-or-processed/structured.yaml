      unit: "kg, m3, kWh, or MJ"
      frequency: "every batch and brine intervention"
      temporal_coverage: "full ripening or brining duration for released lots"
      site_scope: "reporting facility"
      aggregation_rule: "link all records to originating and released lots; distinguish recirculation from external input"
