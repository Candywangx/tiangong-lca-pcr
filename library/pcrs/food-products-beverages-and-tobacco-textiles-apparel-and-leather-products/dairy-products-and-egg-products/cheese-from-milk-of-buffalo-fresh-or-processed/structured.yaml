allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared operations and utilities"
    rule: "Avoid allocation by separately metering or otherwise subdividing reception, cheesemaking, ripening/brining, processed-cheese manufacture, packaging, storage, cleaning, and treatment activities whenever the records permit."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_internal_recycling
    applies_to: "internal whey, curd, brine, rework, and recovered heat"
    rule: "Model internal recirculation once and do not create a co-product credit for material or energy that does not cross the product system boundary."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_coproduct_status
    applies_to: "whey and other milk-derived outputs"
    rule: "Treat an output as a co-product only when it leaves for documented beneficial use and has an upstream-recognised product function; otherwise model it as waste to its actual treatment route."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_residual_burdens
    applies_to: "cheese and co-products after subdivision"
    rule: "If subdivision or a defensible physical causal relation cannot resolve shared burdens, use a documented allocation basis consistent across the reporting period, disclose quantities and prices or physical parameters, and test sensitivity to an alternative relevant basis. Do not prescribe a universal whey or cheese allocation factor."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_waste_treatment
    applies_to: "waste and wastewater treatment"
    rule: "Assign treatment inputs, direct emissions, and residues to the generating processes where traceable; otherwise allocate the common system using measured causal drivers such as wastewater volume and pollutant load, and disclose the method."
    source_ids:
      - eu-fdm-bat-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_milk_origin_receipts
      process_id: "milk_reception_preparation"
      flow_role: "milk and milk-derived inputs"
      record_type: "supplier delivery, certificate, and receiving record"
      raw_fields: "supplier; lot; material; animal species; milk origin claim; mass; physical state; acceptance; date"
      collection_method: "reconcile receiving scale or calibrated meter with supplier documents and identity evidence"
      unit: "kg"
      frequency: "every delivery lot"
      temporal_coverage: "all lots in reporting period"
      site_scope: "all supplying sites and reporting facility"
      aggregation_rule: "sum accepted mass by material, species, lot, and state; never merge species before classification check"
      quality_evidence: "calibrated measurement; supplier certificate; lot traceability; exception log"
    - protocol_id: cp_ingredient_dosing_records
      process_id: "cheesemaking_separation"
      flow_role: "ingredients and processing aids"
      record_type: "recipe issue, dosing, and stock record"
      raw_fields: "batch; material; supplier lot; animal species where milk-derived; issued mass; returned mass; function"
      collection_method: "reconcile batch dosing with inventory movement and formulation"
      unit: "kg or original unit"
      frequency: "every batch"
      temporal_coverage: "representative production period including all declared products"
      site_scope: "reporting facility"
      aggregation_rule: "net issued quantity by batch and ingredient; preserve fate and milk species"
      quality_evidence: "approved formulation; scale calibration; stock reconciliation"
    - protocol_id: cp_water_records
      process_id: "milk_reception_preparation"
      flow_role: "preparation water"
      record_type: "meter, batch sheet, and invoice"
      raw_fields: "meter; start; end; batch; use; source; density if converted"
      collection_method: "direct meter preferred; documented allocation only for unmetered common supply"
      unit: "m3 or kg"
      frequency: "every batch or meter interval"
      temporal_coverage: "full reporting period"
      site_scope: "reporting facility"
      aggregation_rule: "subtract verified non-product uses, then normalize to released cheese"
      quality_evidence: "meter calibration; reconciliation; allocation record"
    - protocol_id: cp_water_energy_records
      process_id: "cheesemaking_separation"
      flow_role: "cheesemaking water and utilities"
      record_type: "meter and operating record"
      raw_fields: "utility; meter; start; end; batch; operating hours; carrier quantity"
      collection_method: "direct process metering or documented common-meter allocation"
      unit: "original meter unit"
      frequency: "batch, shift, or meter interval"
      temporal_coverage: "full reporting period"
      site_scope: "reporting facility"
      aggregation_rule: "aggregate by utility and process, then normalize to released cheese"
      quality_evidence: "calibration; invoices; meter coverage; allocation key"
    - protocol_id: cp_energy_utility_records
      process_id: "multiple"
      flow_role: "process utilities"
      record_type: "meter, fuel invoice, and operating record"
      raw_fields: "process; carrier; meter; start; end; purchase; stock change; conversion factor"
      collection_method: "reconcile submeter totals with facility purchases and stock changes"
      unit: "kWh, MJ, kg, or m3"
      frequency: "meter interval and monthly reconciliation"
      temporal_coverage: "full reporting period including seasonal storage"
      site_scope: "reporting facility"
      aggregation_rule: "process use first; allocate residual common use with documented causal driver"
      quality_evidence: "calibration; invoices; stock reconciliation; conversion source"
    - protocol_id: cp_batch_mass_balance
      process_id: "cheesemaking_separation"
      flow_role: "internal transfers and batch balance"
      record_type: "batch production record"
      raw_fields: "all material inputs; internal transfers; outputs; losses; start and end stock; state"
      collection_method: "weigh or meter each material at defined transfer points"
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "all included batches"
      site_scope: "reporting facility"
      aggregation_rule: "reconcile inputs, outputs, and stock change by batch before period aggregation"
      quality_evidence: "calibrated scales; batch closure; exception investigation"
    - protocol_id: cp_product_release_records
      process_id: "multiple"
      flow_role: "cheese outputs and reference product"
      record_type: "batch release and warehouse record"
      raw_fields: "batch; product; state; net mass; brine state; packaging; release date; disposition"
