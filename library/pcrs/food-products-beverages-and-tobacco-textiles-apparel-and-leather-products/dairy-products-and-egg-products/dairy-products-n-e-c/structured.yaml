allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Separately measurable unit operations and outputs"
    rule: "Avoid allocation by subdividing processes and assigning directly measured material and utility records to the operation or product that caused them whenever the records support subdivision."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_joint_process
    applies_to: "Unavoidable joint production"
    rule: "If subdivision is not feasible, use a documented physical relationship that reflects how inputs and outputs change with the products. If no defensible physical relationship exists, any other relationship requires explicit rationale, sensitivity analysis and manual_review; this PCR supplies no fixed allocation factor."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recovered_streams
    applies_to: "Recovered product, whey-derived stream, returned product and waste"
    rule: "Record mass, composition, destination and status before assigning burdens. A saleable or internally used output shall not be relabelled as waste to bypass allocation; treatment burdens and credits follow the declared downstream model."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: allocation_shared_services
    applies_to: "Shared utilities, cold storage, sanitation and wastewater treatment"
    rule: "Allocate shared services using contemporaneous metering or a documented causal driver such as run time, throughput, CIP cycle count or pollutant load. Production mass alone is permitted only when its causal adequacy is demonstrated."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_identity
      process_id: "feedstock_receipt_and_routing"
      flow_role: "Product classification and batch identity"
      record_type: "Product specification and batch record"
      raw_fields: "exact product name; supplier; animal source; physical state; composition basis; CPC rationale; route; batch id; receipt and dispatch timestamps"
      collection_method: "Link approved specifications, labels, certificates and production records to each represented batch"
      unit: "descriptive record"
      frequency: "Each batch and each specification change"
      temporal_coverage: "Same batch genealogy and reference period as the represented production"
      site_scope: "Each producing facility and product"
      aggregation_rule: "No averaging across products with different CPC classification or production routes"
      quality_evidence: "Approved specification, classification rationale, batch genealogy and reviewer sign-off"
    - protocol_id: cp_feedstock_receipt
      process_id: "feedstock_receipt_and_routing"
      flow_role: "Each received, accepted, and rejected dairy feedstock or ingredient"
      record_type: "Delivery, tank, vessel, bag, scale, sampling, spill, return, and transfer records"
      raw_fields: "atomic material identity; supplier; animal source where relevant; received mass; accepted mass; rejected mass; sampled mass; spill; return; transfer; batch id; destination"
      collection_method: "Measure or reconcile each named feedstock separately on the same receipt boundary"
      unit: "kg"
      frequency: "Each delivery and receipt batch"
      temporal_coverage: "Complete represented production period"
      site_scope: "Every receiving point and storage vessel serving the product"
      aggregation_rule: "Sum only the same material identity and compatible batches; keep each atomic material separate and normalize after reconciliation"
      quality_evidence: "Calibration, delivery ticket, certificate, receipt inspection, transfer record, rejection record, destination, and signed reconciliation"
    - protocol_id: cp_batch_material_balance
      process_id: "liquid_or_paste_product_manufacture"
      flow_role: "Each accepted feedstock, process water, bulk product, named co-product, and named waste"
      record_type: "Calibrated meter, scale, tank, formulation, transfer, waste, and hold-up records"
      raw_fields: "opening stock; each accepted material; water charged; bulk product; cream; skimmed milk; milk permeate; whey permeate; milk fat; off-spec product; purge; filtration residue; process wastewater; closing stock; calibration id"
      collection_method: "Collect each named exchange on a common batch or campaign boundary and reconcile mass after hold-up correction"
      unit: "kg"
      frequency: "Each batch or campaign"
      temporal_coverage: "Complete represented production period, including normal start-up and shutdown"
      site_scope: "Each producing facility and manufacturing route"
      aggregation_rule: "Sum only matching atomic flow identities across compatible batches; normalize reconciled totals to conforming facility-gate product mass"
      quality_evidence: "Calibration records, signed batch sheets, transfer records, waste destinations, reconciliation result, and explanation of material imbalance"
    - protocol_id: cp_batch_utility_records
      process_id: "liquid_or_paste_product_manufacture"
      flow_role: "Manufacturing electricity, purchased steam, purchased hot water, natural gas, diesel, LPG, and each refrigerant"
      record_type: "Meter, fuel, invoice, refrigerant service, and equipment operating records"
      raw_fields: "carrier identity; meter start and end; quantity; heating value; pressure; temperature; enthalpy; run time; heat recovery; allocation driver; refrigerant identity; opening charge; make-up; recovery; closing charge; transfer; emission factor identity"
      collection_method: "Prefer submetering; otherwise calculate each carrier separately from collected activity records with documented conversion and allocation"
      unit: "kWh; MJ; kg"
      frequency: "Each batch or campaign, with monthly reconciliation"
      temporal_coverage: "Same period as represented production"
      site_scope: "Each facility and relevant utility or refrigeration system"
      aggregation_rule: "Reconcile and allocate each carrier and refrigerant separately; avoid double counting recovered heat; normalize to conforming product"
      quality_evidence: "Meter calibration, invoices, fuel and service logs, equipment records, conversion or factor source, and allocation worksheet"
    - protocol_id: cp_finishing_and_dispatch
      process_id: "finishing_and_dispatch"
      flow_role: "Bulk input, finishing electricity, reference product, each packaging component, each packaging waste, and product waste"
      record_type: "Filler, bulk-loading, packaging BOM, issue, return, scale, meter, waste, and dispatch records"
      raw_fields: "bulk input; electricity; net released product; each packaging component identity; package count; component mass; issued; returned; unused; off-spec product; filler purge; each packaging waste; destination; batch id"
      collection_method: "Reconcile line input, electricity, net product, retained product, each packaging item, and each waste for the same batch"
      unit: "kg; kWh; item count with batch conversion"
      frequency: "Each batch or campaign"
      temporal_coverage: "Complete represented production period"
      site_scope: "Each facility and packaging or bulk-dispatch line"
      aggregation_rule: "Convert counts using measured component masses, keep every material-specific total separate, and normalize to net conforming product"
      quality_evidence: "Scale and meter calibration, approved packaging BOM, issue and return records, waste tickets, dispatch record, and line reconciliation"
    - protocol_id: cp_sanitation_records
      process_id: "sanitation_and_wastewater_routing"
      flow_role: "Process water, electricity, steam, hot water, each cleaning chemical, each wastewater stream, each residue, and each effluent emission"
      record_type: "CIP controller, water and energy meter, dosing, laboratory, discharge, sludge, and treatment records"
      raw_fields: "cycle id; equipment circuit; water; electricity; steam; hot water; chemical identity; concentration; dose; reuse; wastewater identity; discharge; pH; temperature; screenings; DAF sludge; biological sludge; effluent volume; BOD5; COD; TSS; total nitrogen; total phosphorus; destination"
      collection_method: "Capture cycle and treatment-batch records and match each atomic input or output to the represented equipment and period"
      unit: "kg; kWh; MJ; m3 retained before conversion; mg/L"
      frequency: "Each sanitation cycle, discharge event, sampling event, or treatment batch"
      temporal_coverage: "Same period as represented production, including changeovers and shutdown cleaning"
      site_scope: "Each facility, CIP circuit, discharge point, and treatment route"
      aggregation_rule: "Keep each chemical, wastewater, residue, and pollutant separate; convert units explicitly; aggregate attributable cycles and normalize to conforming product"
      quality_evidence: "Meter and sensor calibration, controller export, dosing record, laboratory result, discharge log, treatment ticket, and allocation worksheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground inventory rows"
      rule: "normalized amount = reconciled batch or campaign amount / net kg conforming final product released at the facility gate"
      inputs:
        - "reconciled atomic flow amount"
        - "net conforming product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_volume_to_mass
      applies_to: "Volume-based liquid records"
      rule: "mass = measured volume × density for the same material, temperature, and batch; retain unrounded inputs and conversion metadata"
      inputs:
        - "measured volume"
        - density
        - temperature
        - "batch id"
      output: "kg of one identified material"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_batch_mass_balance
      applies_to: "Receipt, manufacturing, and finishing"
      rule: "imbalance = opening stock + atomic received inputs - closing stock - conforming product - named co-products - named wastes; investigate rather than assigning the residual to an invented exchange"
      inputs:
        - stocks
        - "each input"
        - product
        - "each co-product"
        - "each waste"
      output: "reconciled mass balance and disclosed residual"
      source_ids:
        - eu-pef-2021-2279
        - eu-fdm-bat-2019-2031
    - id: calc_utility_allocation
      applies_to: "Shared electricity, steam, hot water, natural gas, diesel, and LPG"
      rule: "allocated carrier = measured total for that carrier × documented causal driver share; never combine carrier quantities before allocation"
      inputs:
        - "one carrier meter or issue total"
        - "run time"
        - throughput
        - "equipment demand"
        - "causal driver"
      output: "allocated kWh or MJ for one carrier"
      source_ids:
        - eu-pef-2021-2279
        - eu-fdm-bat-2019-2031
    - id: calc_fuel_co2
      applies_to: "Direct fuel combustion"
      rule: "fossil CO2 = recorded energy for one fuel × documented site, supplier, or regulatory fossil-carbon factor for that same fuel and period"
      inputs:
        - "fuel identity"
        - energy
        - factor
        - "factor source"
        - "validity period"
      output: "kg fossil CO2 for one fuel"
      source_ids:
        - eu-pef-2021-2279
        - eu-fdm-bat-2019-2031
    - id: calc_refrigerant_balance
      applies_to: "Each refrigeration circuit"
      rule: "loss to air = opening charge + make-up - recovery - closing charge - documented transfers, calculated separately for each refrigerant identity"
      inputs:
        - "refrigerant identity"
        - "opening charge"
        - make-up
        - recovery
        - "closing charge"
        - transfers
      output: "kg of one refrigerant emitted to air"
      source_ids:
        - eu-pef-2021-2279
        - eu-fdm-bat-2019-2031
    - id: calc_sanitation_allocation
      applies_to: "Shared CIP and sanitation cycles"
      rule: "allocate only attributable water, electricity, steam, hot water, each chemical, and each wastewater stream using circuit, cycle count, operating time, or measured load"
      inputs:
        - "cycle records"
        - "circuit mapping"
        - "each atomic input and output"
        - "production schedule"
      output: "allocated sanitation exchange amount"
      source_ids:
        - eu-fdm-bat-2019-2031
        - eu-pef-2021-2279
    - id: calc_effluent_load
      applies_to: "Each on-site effluent pollutant"
      rule: "pollutant mass = matched treated-effluent volume × laboratory concentration for the same sampling period, with explicit unit conversion"
      inputs:
        - "effluent volume"
        - "one pollutant concentration"
        - "sampling period"
        - "conversion factor"
      output: "kg of one pollutant to the receiving compartment"
      source_ids:
        - eu-fdm-bat-2019-2031
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and feedstock"
      requirement: "Demonstrate CPC 22290 inclusion for the exact product and exclusion from the named CPC 2221-2227 categories; a generic n.e.c. label or the Buttermilk flow name alone is insufficient."
      evidence: "Product specification, label, composition, route description, official CPC note, and classification review"
    - id: dq_temporal_alignment
      applies_to: "Foreground records"
      requirement: "Use one representative and disclosed production period; align material, utility, finishing, sanitation, and effluent records and explain abnormal or excluded periods."
      evidence: "Batch genealogy, production calendar, meter and laboratory periods, and exclusion log"
    - id: dq_measurement
      applies_to: "Measured and calculated amounts"
      requirement: "Identify instruments, calibration status, units, conversions, factors, and calculation lineage; preserve raw values and avoid premature rounding."
      evidence: "Calibration certificates, controller or meter exports, batch sheets, factor references, laboratory reports, and calculation workbook"
    - id: dq_atomic_flow_identity
      applies_to: "Every inventory card"
      requirement: "Each card shall identify one material, energy carrier, fuel, refrigerant, chemical, packaging component, product, co-product, waste, wastewater, residue, or elementary emission; applicability belongs in the amount rule and never in a collection-label Selected flow."
      evidence: "Atomic inventory review, approved BOM or formulation, utility map, chemical register, waste register, and emission register"
    - id: dq_completeness
      applies_to: "Foreground boundary"
      requirement: "Cover every known atomic input and output or retain evidence that the card is not applicable; add another concrete atomic card when an actual exchange is not represented rather than using an aggregate or selector."
      evidence: "Process flow diagram, BOM, formulation, utility and refrigerant registers, mass and water balances, waste tickets, emission monitoring, and completeness review"
    - id: dq_representativeness
      applies_to: "Linked upstream and treatment datasets"
      requirement: "Match geography, technology, temporal period, material identity, and product state where feasible; identify proxies and their expected influence."
      evidence: "Dataset metadata, selection rationale, data-quality assessment, and sensitivity result"
    - id: dq_uuid_resolution
      applies_to: "Tiangong identity references"
      requirement: "Store only a dual-verified exact public state100 UUID; otherwise leave the UUID blank and retain the row-level candidate and rejection reason in manifest review metadata."
      evidence: "Hybrid-search result, state100 direct read, and manifest unresolved-flow review"
validation_rules:
  - rule_id: validate_scope_identity
    applies_to: "Product classification"
    rule: "Fail conformance when the exact product is not demonstrated to fall within CPC 22290, is more specifically covered by CPC 2221-2227 or another category, or uses the Buttermilk UUID for a different product. Uncertain cases return manual_review."
    source_ids:
      - unsd-cpc-3-22290
      - codex-cxs-206-1999
      - codex-cxs-243-2003
  - rule_id: validate_reference_uuid
    applies_to: "Qualifying buttermilk reference flow"
    rule: "Require product flow a0a5374c-955b-4db5-9520-001165f8ddc0, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg only when the declared product is the qualifying buttermilk; other products require a product-specific flow or manual_review."
    source_ids:
      - unsd-cpc-3-22290
  - rule_id: validate_required_qualifiers
    applies_to: "Reference-flow metadata"
    rule: "Fail completeness when any required qualifier, production route, or market state is missing."
    source_ids:
      - codex-cxs-206-1999
      - eu-pef-2021-2279
  - rule_id: validate_process_boundary
    applies_to: "Foreground process map"
    rule: "Require all used operations, sanitation, and known outputs; explain each operation and atomic card marked not applicable."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: validate_atomic_inventory
    applies_to: "Every inventory card"
    rule: "Reject Selected flow values that are collections, selectors, alternatives, or placeholders. Require electricity, steam, hot water, every fuel, each refrigerant, each material and ingredient, every chemical, each packaging component, every product and co-product, each waste and wastewater, and each elementary emission to remain separate."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: validate_uuid_review_closure
    applies_to: "Non-reference inventory rows"
    rule: "Require exactly one manifest unresolved-flow review for every blank inventory UUID and no unresolved review for the verified reference row. Reject any UUID not supported by exact hybrid search and public state100 direct read."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "Batch or campaign inventory"
    rule: "Require reconciled material balances on a common period and investigation of material residuals; do not force residuals into unverified waste or product flows."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: validate_site_records
    applies_to: "Material, energy, water, packaging, chemical, waste, and emission amounts"
    rule: "Require site and batch or campaign foreground records for actual LCI values. Codex limits, quality criteria, and BAT performance levels are not acceptable substitutes."
    source_ids:
      - codex-cxs-206-1999
      - codex-cxs-243-2003
      - eu-fdm-bat-2019-2031
  - rule_id: validate_allocation
    applies_to: "Multi-output and shared processes"
    rule: "Require direct assignment or documented subdivision where feasible; otherwise require a defensible causal allocation method, inputs, outputs, and sensitivity record."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate production dataset for one declared CPC 22290 liquid or paste dairy product and route"
  downstream_use: "secondary_dataset or background_dataset in a process or lifecyclemodel when scope, geography, technology, temporal period, and product identity are compatible"
  allowed_use: "Product-specific modelling with the declared facility-gate boundary; aggregation only across compatible products and routes; use of the verified Buttermilk UUID only for a qualifying CPC 22290 buttermilk"
  excluded_use: "Representation of all dairy products n.e.c. with the Buttermilk flow; use for named CPC 2221-2227 products; substitution of Codex composition criteria or BAT performance levels for foreground LCI; use of a collection or selector as one inventory exchange; unsupported comparative claims"
  required_metadata: "canonical PCR id; CPC coordinate and inclusion rationale; product-specific flow UUID; all required qualifiers; facility geography; route and process diagram; batch or campaign period; net product mass; atomic BOM, utility, refrigerant, chemical, packaging, waste, and emission records; allocation method; upstream dataset references; treatment destinations; data-quality assessment"
  required_quality_disclosure: "Data coverage and gaps; meter and calibration evidence; mass, energy, refrigerant, and water balance results; representativeness; proxies; allocation sensitivity; excluded operations; not-applicable evidence; unresolved UUID reviews; classification or flow decisions under manual_review"
  update_trigger: "Product formulation, state, classification, route, equipment, energy system, refrigerant, supplier mix, packaging, sanitation chemistry, treatment route, or allocation changes materially; data age exceeds study requirements; an unresolved flow gains an exact public state100 identity; the official CPC, Codex, PEF, or applicable BAT source changes"
