product_category_identity:
  canonical_pcr_id: "pcr.food-products-beverages-and-tobacco-textiles-apparel-and-leather-products.dairy-products-and-egg-products.dairy-products-n-e-c"
  classification_refs: "CPC 3.0: 22290, Dairy products n.e.c."
  covered_products: "Qualifying fresh or preserved liquid or paste products consisting of milk constituents, with composition different from the natural product, not more specifically covered elsewhere and without other substances; categories listed by UNSD CPC 3.0 for 22290"
  excluded_products: "Products more specifically covered by CPC 2221-2227; fermented or acidified milk products in 2223; solid analogues; lactose and lactose syrup; coloured or flavoured lactose syrup; whey cheese; composition-equivalent reconstituted milk assigned to named milk or cream categories; products containing non-milk characterising substances"
  representative_product: "Buttermilk only when product-specific classification evidence places that buttermilk in CPC 22290; otherwise a product-specific CPC 22290 flow is mandatory"
  production_route: "Receipt and qualification of milk or milk-derived feedstock; route-specific separation, concentration, recombination, reconstitution or blending; conditional thermal treatment and cooling; bulk or packaged finishing; sanitation and wastewater routing"
  market_state: "Declared liquid or paste dairy product at the manufacturing facility gate, in bulk or packaged form, with temperature, preservation state, composition and batch identity stated"
functional_unit:
  what: "A declared liquid or paste dairy product that is demonstrably within CPC 3.0 subclass 22290"
  how_much: "1 kg net product mass at the manufacturing facility gate"
  how_well: "Meets the declared product specification and market state; the data package documents why the exact product is not more specifically covered elsewhere"
  how_long_or_cycle: "One declared production batch or campaign; no service duration is assigned"
  reference_flow_link: "The mass of conforming final product released at the facility gate; the Buttermilk flow below is used only for a qualifying CPC 22290 buttermilk, and all other covered products require a product-specific flow or manual_review"
system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate
      applies_to: "Foreground manufacturing system"
      rule: "Include receipt and qualification, route-specific liquid or paste product manufacture, conditional thermal treatment and cooling, finishing, sanitation, product losses, wastewater routing and facility-gate release."
      source_ids:
        - eu-pef-2021-2279
        - eu-fdm-bat-2019-2031
    - rule_id: boundary_route_specificity
      applies_to: "Product and process selection"
      rule: "Include only operations actually used for the declared product. Separation, membrane concentration, recombination, reconstitution, fermentation, drying and packaging are not interchangeable generic stages; absent operations shall be documented as not applicable."
      source_ids:
        - unsd-cpc-3-22290
        - codex-cxs-206-1999
        - codex-cxs-243-2003
    - rule_id: boundary_upstream_links
      applies_to: "Supplied milk, milk-derived constituents, water, energy, packaging and chemicals"
      rule: "Record supplied products as technosphere inputs and link appropriate upstream datasets; do not duplicate upstream production within the foreground process."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_outputs_complete
      applies_to: "Foreground outputs"
      rule: "Identify conforming product, co-products, recovered material, off-spec product, wastewater, other waste and direct elementary flows known to cross the boundary."
      source_ids:
        - eu-pef-2021-2279
        - eu-fdm-bat-2019-2031
    - rule_id: boundary_no_generic_performance_values
      applies_to: "Inventory authoring"
      rule: "Codex composition or quality criteria and BAT-associated performance or emission levels shall not be copied as generic LCI values. Actual site and batch records govern inventory amounts."
      source_ids:
        - codex-cxs-206-1999
        - codex-cxs-243-2003
        - eu-fdm-bat-2019-2031
boundary_abstraction:
  declared_starting_condition: "Qualifying milk or milk-derived feedstock accepted at the manufacturing receiving point, with supplier, product identity, mass, temperature, composition basis and batch or delivery reference declared"
  starting_condition_role: "Foreground gate-to-gate starting condition; upstream milk production and manufacture of supplied milk-derived constituents are linked background or secondary datasets"
  product_classification_scope: "Only the exact declared product demonstrated to be within CPC 3.0 subclass 22290; the n.e.c. label is not permission to absorb named products from CPC 2221-2227"
  recursive_input_rule: "A supplied input that itself belongs to CPC 22290 is recorded as a technosphere input with an upstream dataset and is not remanufactured conceptually inside the current foreground boundary"
  upstream_dataset_requirement: "Use temporally, geographically and technologically representative datasets for milk, milk-derived ingredients, utilities, packaging and treatment services; disclose proxies and data gaps"
  disclosure: "State product classification rationale, exact route, included and excluded operations, supplier boundary, co-product treatment, on-site versus off-site treatment, allocation choices, data period and all provisional estimates"
reference_flow_definition:
  reference_amount: "1 kg net mass"
  product_flow_ref:
    name: "Buttermilk"
    uuid: "a0a5374c-955b-4db5-9520-001165f8ddc0"
  flow_property_ref:
    uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
  unit_group_ref:
    uuid: "93a60a57-a4c8-11da-a746-0800200c9a66"
  reference_unit: "kg"
  required_qualifiers:
    - "exact product name and CPC 22290 inclusion rationale"
    - "milk animal source"
    - "liquid or paste state"
    - "composition and principal milk constituents"
    - "sweetened or unsweetened state"
    - "preservation and heat-treatment state"
    - "buttermilk production route when applicable"
    - "bulk or packaging format"
    - "product temperature at dispatch"
    - "facility geography"
    - "production batch and reference period"
reference_flows:
  []
measurement_rules:
  - id: reference_mass
    applies_to: "Reference product and normalized inventory"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record net conforming product mass in kg and normalize foreground amounts to 1 kg. Do not use package count, volume or gross shipping mass without a batch-specific conversion."
  - id: volume_to_mass_conversion
    applies_to: "Liquid quantities reported by volume"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert volume to mass only with density measured or documented for the same product, temperature and batch; retain source volume, density, temperature and calculation."
  - id: dry_matter_and_constituent_basis
    applies_to: "Solids, protein, lactose, fat or other constituent records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "State wet-mass, dry-matter or constituent basis explicitly. Do not treat a composition limit or quality specification as an inventory amount."
  - id: mass_balance_period
    applies_to: "Batch or campaign mass balance"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use a common batch or campaign boundary for inputs, conforming product, co-products, losses and waste; reconcile opening and closing hold-up when material."
process_map:
  - id: feedstock_receipt_and_routing
    name: "Feedstock receipt and classification routing"
    inclusion: "required"
    inclusion_condition: "Always"
    role: "Verify product and feedstock identity, receive and route the batch"
    quantitative_reference: "kg qualifying feedstock received per 1 kg conforming final product"
  - id: liquid_or_paste_product_manufacture
    name: "Liquid or paste product manufacture"
    inclusion: "required"
    inclusion_condition: "Always; unit operations are route-specific"
    role: "Perform only the declared separation, concentration, recombination, reconstitution, blending, thermal-treatment and cooling operations"
    quantitative_reference: "1 kg bulk qualifying product transferred to finishing"
  - id: finishing_and_dispatch
    name: "Finishing and facility-gate dispatch"
    inclusion: "required"
    inclusion_condition: "Always; packaging is conditional on the declared market state"
    role: "Release bulk or packaged conforming product and record packaging when used"
    quantitative_reference: "1 kg net conforming product at facility gate"
  - id: sanitation_and_wastewater_routing
    name: "Sanitation and wastewater routing"
    inclusion: "required"
    inclusion_condition: "Always; treatment steps depend on site configuration"
    role: "Record cleaning inputs and all routed wastewater and sanitation residues attributable to the product system"
    quantitative_reference: "Allocated batch sanitation records per 1 kg conforming product"
