allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Separation, formation, finishing, packaging, and shared utilities"
    rule: "First use process subdivision, separate meters, batch records, and route-specific inventories to avoid allocation wherever the directly attributable flows can be isolated."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_system_expansion_check
    applies_to: "Multi-functional processes"
    rule: "If subdivision is not possible, evaluate whether system expansion represents the additional co-product functions; report the expanded function and do not present an individual-product result as though no expansion occurred."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relationship
    applies_to: "Buffalo skim milk, buttermilk, recovered fat, and other co-products"
    rule: "When subdivision and system expansion are not applied, use a relevant, quantifiable physical relationship only when it reflects the causal relationship between inputs, outputs, and the functions provided; retain batch composition and mass evidence."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relationship
    applies_to: "Remaining multi-functionality"
    rule: "Use another relationship such as economic allocation only after documenting why subdivision, system expansion, and a relevant physical relationship are not applicable; use process-stage, geography, and reference-period-specific records and disclose sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_no_default_factor
    applies_to: "All co-product systems"
    rule: "This PCR provides no universal allocation factor: the selected method, co-product status, data sources, calculation, and consistency across upstream and foreground dairy stages must be disclosed for the actual facility and reference period."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_dairy_mass_traceability
      process_id: "receipt_and_storage_fat_separation_standardisation_butter_or_fat_formation_dehydration_fractionation_finishing_packaging_and_product_storage"
      flow_role: "Dairy input, intermediate, and product mass and identity"
      record_type: "Scale ticket, tank gauge, batch sheet, laboratory composition record, supplier certificate"
      raw_fields: "supplier; farm or processor; animal species; lot; product designation; gross and tare mass; net mass; wet/dry/fat/solids basis; sample time; test method; transfer time; destination"
      collection_method: "Calibrated scale or tank measurement linked to batch and species documentation"
      unit: "kg plus declared composition basis"
      frequency: "Every receipt, transfer, and finished batch"
      temporal_coverage: "Complete reference period, including start/end inventory"
      site_scope: "Each included facility, tank, and line"
      aggregation_rule: "Reconcile opening stock + receipts - transfers - rejects - closing stock by batch; normalize completed route to net product mass"
      quality_evidence: "Calibration status; chain-of-custody record; species declaration; sample and test record; reconciliation sign-off"
    - protocol_id: cp_energy_and_fuel
      process_id: "receipt_and_storage_fat_separation_standardisation_butter_or_fat_formation_dehydration_fractionation_finishing_packaging_and_product_storage_utilities_cleaning_wastewater"
      flow_role: "Electricity, fuel, heat, refrigeration, and compressed-air demand"
      record_type: "Submeter, main meter, invoice, fuel delivery, boiler or refrigeration log"
      raw_fields: "meter id; carrier; opening/closing reading; multiplier; fuel quantity; calorific or conversion basis; operating hours; process line; downtime; production mass"
      collection_method: "Prefer process submetering; otherwise shortest representative interval with documented causal allocation"
      unit: "source unit and normalized kWh, MJ, kg, or m3"
      frequency: "Continuous or each billing/production interval"
      temporal_coverage: "Complete reference period with inventory changes"
      site_scope: "Each included utility and production line"
      aggregation_rule: "Sum matched consumption, subtract documented exports, allocate shared service with a causal driver, normalize to net product"
      quality_evidence: "Meter calibration; invoice reconciliation; conversion source; operating log; allocation review"
    - protocol_id: cp_water_cip_ingredients
      process_id: "butter_or_fat_formation_dehydration_fractionation_finishing_utilities_cleaning_wastewater"
      flow_role: "Process water, ingredients, cleaning water, and chemicals"
      record_type: "Water meter, CIP log, dosing record, batch issue record"
      raw_fields: "stream; meter; cycle id; chemical or ingredient; concentration as purchased; dose; return/reuse; rinse endpoint; batch; line; product mass"
      collection_method: "Metered water and calibrated dosing or weighed issue linked to cycle and batch"
      unit: "m3 or kg"
      frequency: "Every batch or CIP cycle; continuous where metered"
      temporal_coverage: "Complete reference period including atypical cleaning"
      site_scope: "Each included line, CIP circuit, and utility area"
      aggregation_rule: "Sum by purpose and stream; deduct documented reuse only once; normalize to net product"
      quality_evidence: "Meter and dosing calibration; CIP trace; purchase reconciliation; reuse record; hygiene release"
    - protocol_id: cp_coproduct_waste_mass
      process_id: "receipt_and_storage_fat_separation_standardisation_butter_or_fat_formation_dehydration_fractionation_finishing_packaging_and_product_storage_utilities_cleaning_wastewater"
      flow_role: "Co-products, rejects, residues, sludge, and product losses"
      record_type: "Scale ticket, batch balance, waste manifest, recovery or sales record"
      raw_fields: "stream identity; mass; wet/dry basis; batch; destination; beneficial-use evidence; waste code where applicable; calculation inputs"
      collection_method: "Direct weighing preferred; otherwise documented mass balance from matched batch records"
      unit: "kg"
      frequency: "Every batch, shipment, or waste collection"
      temporal_coverage: "Complete reference period"
      site_scope: "Each included process and destination"
      aggregation_rule: "Sum separately by product, co-product, waste, and destination; do not net beneficial outputs against inputs"
      quality_evidence: "Scale calibration; destination receipt; mass-balance closure; classification approval"
    - protocol_id: cp_packaging_records
      process_id: "packaging_and_product_storage"
      flow_role: "Packaging inputs, reusable items, rejects, and packed output"
      record_type: "Purchasing, item specification, line issue, return, reject, and finished-goods record"
      raw_fields: "material; supplier; item mass; count; packaging level; recycled-content claim; reuse count; issued; returned; rejected; packed net product"
      collection_method: "Weigh representative item or use verified specification; reconcile counts and line issues"
      unit: "kg and count"
      frequency: "Every packaging run; specification change checked when it occurs"
      temporal_coverage: "Complete reference period"
      site_scope: "Each packaging line and product format"
      aggregation_rule: "Convert counts using verified item mass; subtract documented returns; report each material separately per net product"
      quality_evidence: "Item-mass sample; supplier specification; issue/return reconciliation; reject record"
    - protocol_id: cp_direct_emissions_effluent
      process_id: "packaging_and_product_storage_utilities_cleaning_wastewater"
      flow_role: "Refrigerant loss, wastewater flow and pollutants, and direct air emissions"
      record_type: "Refrigerant service log, effluent flow meter, laboratory result, stack test, fuel record, permit report"
      raw_fields: "substance; equipment or outlet; opening/closing stock; additions; recovery; flow; concentration; sample time; method; operating state; fuel use; factor source"
      collection_method: "Mass balance, direct monitoring, or calculation from temporally matched measured activity and approved factor"
      unit: "kg, m3, concentration unit, and kg load"
      frequency: "At each service event and at legally or technically appropriate monitoring intervals"
      temporal_coverage: "Matched to production reference period and operating state"
      site_scope: "Each in-scope equipment item, stack, and discharge point"
      aggregation_rule: "Calculate substance-specific mass; concentration × matched flow for water load; normalize only after temporal matching"
      quality_evidence: "Service invoice; chain of custody; laboratory accreditation; meter calibration; factor/version record; permit report"
  calculation_rules:
    - id: normalize_to_reference_product
      applies_to: "All quantitative inventory rows"
      rule: "normalized amount = matched foreground amount / matched net reference-product mass; preserve the unnormalized record and basis"
      inputs:
        - "foreground amount"
        - "net reference-product mass"
        - "batch or interval linkage"
      output: "amount per 1 kg net reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: dairy_batch_mass_balance
      applies_to: "Receipt, separation, formation, finishing, and packaging"
      rule: "opening inventory + inputs = outputs + closing inventory + measured losses + reconciled residual; investigate rather than silently distribute a material residual"
      inputs:
        - "opening and closing inventory"
        - "input/output/co-product/waste masses"
        - "composition basis"
      output: "signed batch balance and documented residual"
      source_ids: []
    - id: water_pollutant_load
      applies_to: "Direct releases to water"
      rule: "pollutant load = temporally matched effluent volume × concentration after unit conversion; report each substance separately"
      inputs:
        - flow
        - concentration
        - "sampling period"
        - "conversion factors"
      output: "pollutant mass by outlet and period"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: refrigerant_mass_balance
      applies_to: "Refrigeration equipment"
      rule: "release = opening stock + additions - recovered amount - closing stock - documented equipment transfer, with sign and stock reconciliation"
      inputs:
        - "refrigerant stock"
        - additions
        - recoveries
        - transfers
      output: "refrigerant mass released by substance"
      source_ids:
        - eu-fdm-bat-2019-2031
    - id: multifunctionality_decision
      applies_to: "Co-products and shared services"
      rule: "apply subdivision or system expansion first; if neither is applied, calculate burdens using a justified physical relationship, otherwise another disclosed relationship with sensitivity"
      inputs:
        - "process map"
        - "separate records"
        - "co-product quantities and properties"
        - "market data if used"
      output: "allocated or expanded inventory with method record"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_species_identity
      applies_to: "All dairy inputs and products"
      requirement: "Maintain lot-level evidence that dairy material is buffalo-only; any cattle, other-animal, or mixed-species lot is excluded from this PCR dataset."
      evidence: "Supplier declaration, chain of custody, receiving record, product specification, and applicable verification test"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Cover all applicable mapped processes and all material, energy, water, co-product, waste, direct-emission, packaging, and storage records for the reference period; explain omissions."
      evidence: "Process flow sheet, record inventory, meter list, mass and water balances, and completeness review"
    - id: dq_representativeness
      applies_to: "Foreground and upstream datasets"
      requirement: "Disclose technological, geographical, and time representativeness and precision; use higher-quality data for material processes and do not represent a cattle-milk proxy as exact buffalo data."
      evidence: "Data-quality assessment, dataset metadata, source record, and proxy justification"
    - id: dq_temporal_matching
      applies_to: "Activity and emission data"
      requirement: "Match production, utilities, inventories, wastewater, direct emissions, co-products, and waste to the same batch or defensible reporting interval."
      evidence: "Timestamped records, interval reconciliation, operating log, and normalization workbook"
    - id: dq_measurement_traceability
      applies_to: "Measured and calculated amounts"
      requirement: "Retain raw readings, calibration status, unit conversions, calculation formulas, factor identities and versions, reviewer, and correction history."
      evidence: "Calibration certificate, raw export, controlled calculation, factor reference, and review sign-off"
    - id: dq_no_generic_performance_values
      applies_to: "Product specifications and BAT evidence"
      requirement: "Do not use Codex composition or quality limits, or BAT-associated consumption or emission performance values, as a generic foreground LCI. Use site, batch, supplier, or approved factor records."
      evidence: "Source-use review and row-level evidence-kind audit"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The reference product flow UUID must be 554cfc76-a4ac-4cda-9e06-d60256918b58, the Mass UUID must be 93a60a56-a3c8-11da-a746-0800200b9a66, the Units of mass UUID must be 93a60a57-a4c8-11da-a746-0800200c9a66, and the unit must be kg, with no dataset versions appended."
    source_ids: []
  - rule_id: validate_buffalo_only_scope
    applies_to: "Product and dairy inputs"
    rule: "Every dairy input and the reference product must be documented as buffalo-only; reject cattle-milk, other-animal, mixed-species, and substitute-fat records from this PCR dataset."
    source_ids:
      - unsd-cpc-3-0-2025
      - codex-cxs-206-1999
  - rule_id: validate_product_route
    applies_to: "Product identity and process map"
    rule: "The declared product designation and actual route must select the applicable butter, milkfat, butter-oil, ghee, fractionation, recombination, salting, culturing, dehydration, packaging, and storage processes without treating a Codex permission as proof that a process occurred."
    source_ids:
      - codex-cxs-279-1971
      - codex-cxs-280-1973
  - rule_id: validate_reference_amount
    applies_to: "Quantitative inventory"
    rule: "The product output must equal 1 kg net product after normalization; packaging mass must remain separate and all wet, dry, fat, water, or solids conversions must retain batch-specific evidence."
    source_ids: []
  - rule_id: validate_process_and_record_coverage
    applies_to: "Foreground inventory"
    rule: "Every required and applicable conditional process must have linked foreground records for material, energy, water, co-products, wastes, direct emissions, packaging, and storage, or a documented non-applicability reason."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: validate_mass_and_stream_balance
    applies_to: "Dairy and water systems"
    rule: "Receipt-to-output dairy mass balances and separated water-stream balances must reconcile within a site-defined, documented measurement uncertainty; unexplained residuals are findings, not hidden allocations."
    source_ids:
      - eu-fdm-bat-2019-2031
  - rule_id: validate_allocation_hierarchy
    applies_to: "Multi-functional processes"
    rule: "The dataset must document subdivision and system-expansion checks before physical or other allocation, identify every co-product and shared service, and retain the selected relationship and sensitivity evidence."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_source_use
    applies_to: "Numerical and method claims"
    rule: "Every non-foreground numerical factor must identify its source and version; Codex composition or quality limits and BAT performance values must not appear as default LCI amounts."
    source_ids:
      - codex-cxs-279-1971
      - codex-cxs-280-1973
      - eu-fdm-bat-2019-2031
  - rule_id: validate_data_quality
    applies_to: "Dataset profile"
    rule: "Completeness, methodological consistency, technological, geographical and temporal representativeness, precision, documentation, nomenclature, and review status must be disclosed."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground unit-process or aggregated gate-to-gate dataset for a declared buffalo-milk butter or fat-product route"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA modelling of the declared CPC 22242 buffalo-milk product when species origin, product form, route, geography, technology, reference period, boundary, allocation, packaging, storage, and data quality are compatible"
  excluded_use: "Cattle-milk products; other-animal products; mixed-species products; generic dairy-fat averages presented as buffalo-specific; substitute-fat products; cradle-to-gate claims when required upstream buffalo milk datasets are absent; comparisons that ignore material boundary or allocation differences"
  required_metadata: "PCR id; Tiangong reference UUIDs; buffalo-only evidence; product designation and qualifiers; facility and geography; reference period; route and technology; included and excluded processes; upstream dataset links; co-products and allocation; packaging; storage; record coverage; normalization workbook; source and factor versions"
  required_quality_disclosure: "Completeness; methodological consistency; technological, geographical, and temporal representativeness; precision; measurement uncertainty; missing records; proxy use; mass and water balance results; allocation sensitivity; review status; deviations from this PCR"
  update_trigger: "Species-origin evidence changes; product or route change; material process, technology, energy, water, packaging, storage, waste treatment, co-product use, or allocation change; reference-period rollover; material data-quality improvement; source revision; or replacement of a provisional or proxy input with verified foreground or buffalo-specific data"
data_sources:
  - id: "unsd-cpc-3-0-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Explanatory Notes, subclass 22242, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (accessed 2026-08-12)"
    used_for: "Exact buffalo-milk category identity, included product forms, and exclusions of CPC 22241 and 22249"
  - id: "codex-cxs-279-1971"
    type: "standard"
