system_boundary:
  rules:
    - rule_id: buffalo_origin_boundary
      applies_to: "Product and dairy inputs"
      rule: "Include only lots documented as buffalo milk or buffalo-milk products; exclude cattle, other-animal, and mixed-species dairy inputs from this PCR dataset."
      source_ids:
        - unsd-cpc-3-0-2025
        - codex-cxs-206-1999
    - rule_id: foreground_gate_boundary
      applies_to: "Foreground facility"
      rule: "Include receiving, species and lot verification, storage, applicable separation or standardisation, fat concentration or churning, applicable finishing or dehydration, packaging, storage, cleaning, utilities, and on-site waste or wastewater operations through the declared facility gate."
      source_ids:
        - eu-fdm-bat-2019-2031
    - rule_id: upstream_link_boundary
      applies_to: "Purchased inputs"
      rule: "Link traceable upstream datasets for buffalo milk or buffalo-milk intermediates, energy carriers, process water, ingredients, cleaning agents, refrigerants, packaging, and outsourced treatment or transport when those activities are outside direct foreground control."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: direct_emission_boundary
      applies_to: "Foreground releases"
      rule: "Include measured or calculated direct releases to air and water, refrigerant losses, wastewater sent off site, residues, rejects, and packaging waste without converting Codex quality criteria or BAT performance levels into inventory values."
      source_ids:
        - eu-fdm-bat-2019-2031
    - rule_id: route_condition_boundary
      applies_to: "Product variants"
      rule: "Apply only the unit processes actually used for the declared product: churning for butter, near-total removal of water and non-fat solids for the CXS 280 product families, and any recombination, fractionation, salting, culturing, or ghee finishing that occurred."
      source_ids:
        - codex-cxs-279-1971
        - codex-cxs-280-1973
