allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Metered process inputs, wastes, and direct emissions"
    rule: "Assign data directly to the specific process stage and product flow wherever line- or equipment-specific records exist. Do not allocate packaging or ingredients that are directly attributable to one product."
    source_ids:
      - dairy-pefcr-2025
  - rule_id: allocation_dry_matter_joint_process
    applies_to: "Raw milk and inseparable joint separation burdens for cream and skimmed-milk co-products"
    rule: "When subdivision cannot resolve a joint dairy process, calculate each product allocation factor as (product mass x product dry-matter fraction) / sum(product mass x dry-matter fraction for all co-products). Use measured product-specific dry matter and retain the mass, dry-matter, period, and factor calculation."
    source_ids:
      - dairy-pefcr-2025
  - rule_id: allocation_partial_metering
    applies_to: "Facility totals with some directly assigned process data"
    rule: "Assign the detailed data first, subtract those assigned quantities from the same facility-period totals, and allocate only the remaining unassigned energy, water, cleaning agents, chemicals, and wastewater by co-product dry-matter output."
    source_ids:
      - dairy-pefcr-2025
  - rule_id: allocation_no_avoided_product_default
    applies_to: "Skimmed milk and other dairy co-products"
    rule: "Report co-products as positive outputs. Do not apply avoided-product substitution unless a separately declared study method requires it and provides a complete sensitivity result."
    source_ids:
      - dairy-pefcr-2025
  - rule_id: allocation_mass_balance_disclosure
    applies_to: "All allocation results"
    rule: "Allocation factors for a joint process must sum to 1 within documented rounding tolerance, and allocated quantities must reconcile to the unallocated total. Disclose any default dry-matter value as a data limitation."
    source_ids:
      - dairy-pefcr-2025
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_milk_and_composition
      process_id: "milk_receiving_and_separation"
      flow_role: "Raw milk and dairy composition"
      record_type: "Scale tickets, tank meters, laboratory results, supplier receipts"
      raw_fields: "receipt_id; supplier; milk_species; gross_mass; tare_mass; accepted_mass; receipt_temperature; milkfat_mass_fraction; dry_matter_fraction; sample_id; test_method; timestamp"
      collection_method: "Calibrated weighbridge or flow meter plus representative compositional sampling"
      unit: "kg; degrees C; % by mass"
      frequency: "Each receipt or tank lot"
      temporal_coverage: "All receipts represented by the dataset period"
      site_scope: "All suppliers and receiving points feeding the represented line"
      aggregation_rule: "Sum accepted mass; mass-weight composition; retain rejected receipts separately"
      quality_evidence: "Calibration certificates; chain of custody; laboratory QA; supplier reconciliation"
    - protocol_id: cp_product_coproduct_and_loss
      process_id: "milk_receiving_and_separation_pasteurization_and_cooling_filling_and_cold_storage"
      flow_role: "Cream, skimmed milk, and dairy losses"
      record_type: "Calibrated meters, tank levels, batch records, waste tickets"
      raw_fields: "batch_id; flow_role; opening_mass; inflow_mass; outflow_mass; closing_mass; milkfat_fraction; dry_matter_fraction; destination; timestamp"
      collection_method: "Batch or period mass and milk-solids reconciliation"
      unit: "kg; % by mass"
      frequency: "Each batch and monthly reconciliation"
      temporal_coverage: "Complete represented production period"
      site_scope: "All relevant tanks, separators, pasteurizers, fillers, and loss destinations"
      aggregation_rule: "Sum flows by role; calculate mass and solids imbalance before normalization"
      quality_evidence: "Meter calibration; signed batch record; destination ticket; reconciliation report"
    - protocol_id: cp_energy_records
      process_id: "milk_receiving_and_separation_pasteurization_and_cooling_filling_and_cold_storage_cleaning_and_wastewater"
      flow_role: "Electricity and thermal energy"
      record_type: "Submeters, utility invoices, fuel meters, equipment runtime"
      raw_fields: "meter_id; carrier; opening_reading; closing_reading; unit; net_calorific_value; equipment_power; runtime; production_line; storage_duration; period"
      collection_method: "Prefer line or equipment meters; otherwise documented same-period allocation"
      unit: "kWh; MJ; fuel unit"
      frequency: "Continuous or per batch, reconciled monthly"
      temporal_coverage: "Same period as represented output"
      site_scope: "Receiving, separator, pasteurizer, homogenizer, chiller, filler, cold store, and CIP serving the line"
      aggregation_rule: "Difference readings; convert fuel to MJ; assign direct meters first; allocate only remainder"
      quality_evidence: "Meter calibration; invoice match; conversion factor source; no overlapping meter hierarchy"
    - protocol_id: cp_heat_treatment_and_product_release
      process_id: "pasteurization_and_cooling"
      flow_role: "Heat treatment, cooling, and accepted cream"
      record_type: "Continuous recorder, batch chart, diversion log, product release record"
      raw_fields: "batch_id; product_fat; inlet_temperature; legal_or_validated_target; holding_temperature; holding_time; flow_diversion_events; phosphatase_or_equivalent_result; outlet_temperature; release_status"
      collection_method: "Validated time-temperature recorder and release review under HACCP"
      unit: "degrees C; seconds or minutes; pass/fail"
      frequency: "Every batch or continuous production run"
      temporal_coverage: "All reference product represented"
      site_scope: "Each pasteurizer and product route"
      aggregation_rule: "Accept only released mass; segregate diversion and rejected output"
      quality_evidence: "Calibration; validation study; signed release; deviation and corrective-action record"
    - protocol_id: cp_packaging_and_finished_product
      process_id: "filling_and_cold_storage"
      flow_role: "Packaging, finished product, and filling rejects"
      record_type: "Bill of materials, packaging issue/return record, checkweigher, warehouse release"
      raw_fields: "sku; package_component; material; issued_mass; returned_mass; reject_mass; filled_units; net_mass; bulk_flag; exit_temperature; release_time"
      collection_method: "Reconcile issued packaging and accepted net product by SKU"
      unit: "kg; count; degrees C"
      frequency: "Each batch or packaging campaign"
      temporal_coverage: "Complete represented production period"
      site_scope: "All filling lines and local warehouse releases in scope"
      aggregation_rule: "Net material use and accepted product mass; separate dairy and packaging waste"
      quality_evidence: "Supplier specification; checkweigher verification; stock reconciliation; release record"
    - protocol_id: cp_cleaning_water_chemicals_and_wastewater
      process_id: "cleaning_and_wastewater"
      flow_role: "Water, cleaning agents, and wastewater"
      record_type: "Water meters, CIP recipes, dosing logs, effluent meter and laboratory data"
      raw_fields: "water_source; meter_reading; reuse_volume; use_category; chemical_name; concentration; dose_mass; rinse_volume; wastewater_volume; COD_concentration; discharge_route; period"
      collection_method: "Metered balance plus recipe and effluent sampling"
      unit: "L or m3; kg; kg COD/m3"
      frequency: "Each CIP cycle where available; monthly reconciliation"
      temporal_coverage: "Same period as represented output"
      site_scope: "Process line and shared CIP or wastewater systems serving it"
      aggregation_rule: "Direct assignment first; allocate facility remainder per Section 7; calculate COD load as volume x concentration"
      quality_evidence: "Meter calibration; chemical stock reconciliation; laboratory QA; discharge invoice or permit record"
    - protocol_id: cp_refrigerant_inventory
      process_id: "pasteurization_and_cooling_filling_and_cold_storage"
      flow_role: "Direct refrigerant emissions"
      record_type: "Equipment register, service logs, purchase and recovery records"
      raw_fields: "equipment_id; refrigerant_type; opening_charge; additions; recovered_mass; closing_charge; service_date; served_zone; period"
      collection_method: "Refrigerant mass inventory reconciliation by equipment"
      unit: "kg refrigerant"
      frequency: "Each service event and annual closure"
      temporal_coverage: "Period overlapping represented output; disclose mismatch"
      site_scope: "Cooling equipment serving process and storage zones"
      aggregation_rule: "Calculate leakage; assign direct equipment first; allocate shared remainder by documented cooling service"
      quality_evidence: "Technician record; purchase/recovery evidence; charge verification; no negative leakage without correction"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground rows"
      rule: "normalized amount = same-period attributable amount / accepted net fresh-cream mass; convert the denominator to kg before division"
      inputs:
        - "Attributable flow amount"
        - "accepted net output mass"
      output: "Amount per 1 kg fresh cream"
      source_ids:
        - mass-balance-identity
    - id: calc_mass_and_solids_balance
      applies_to: "Separation, pasteurization, and filling"
      rule: "For each bounded process and period, reconcile opening inventory + inputs = outputs + closing inventory + measured losses for total mass; repeat for milkfat and dry matter where compositional data exist"
      inputs:
        - "Tank inventory"
        - "input/output mass"
        - milkfat
        - "dry matter"
        - "recorded losses"
      output: "Mass, milkfat, and dry-matter imbalance with explanation"
      source_ids:
        - mass-balance-identity
        - dairy-pefcr-2025
    - id: calc_dry_matter_allocation
      applies_to: "Joint dairy processing burdens"
      rule: "AF_i = (Q_i x DM_i) / sum(Q_j x DM_j) for all co-products; allocate only the joint or residual burden by AF_i"
      inputs:
        - "Co-product mass Q"
        - "product-specific dry-matter fraction DM"
        - "joint burden"
      output: "Product allocation factors and allocated quantities"
      source_ids:
        - dairy-pefcr-2025
    - id: calc_wastewater_cod_load
      applies_to: "Wastewater to treatment"
      rule: "COD load = wastewater volume x COD concentration, with compatible volume and concentration units"
      inputs:
        - "Metered wastewater volume"
        - "sampled COD concentration"
      output: "kg COD for the period and normalized kg COD/kg cream"
      source_ids:
        - dairy-pefcr-2025
    - id: calc_refrigerant_leakage
      applies_to: "Cooling equipment"
      rule: "leakage = opening charge + additions - recovered mass - closing charge; investigate negative or implausible values before allocation"
      inputs:
        - "Refrigerant inventory and service records"
      output: "kg refrigerant released by type"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity_and_composition
      applies_to: "Reference product and dairy flows"
      requirement: "Declare milk species, milkfat, dry matter, heat treatment, homogenization, package state, and reference flow UUID; composition must cover the represented products and co-products."
      evidence: "Product specification; laboratory results; Tiangong identity; batch release"
    - id: dq_temporal_alignment
      applies_to: "All foreground data"
      requirement: "Use the same production period for output, inputs, co-products, losses, utilities, wastewater, and allocation. Disclose any substituted or extrapolated period."
      evidence: "Meter periods; production ledger; reconciliation workbook"
    - id: dq_meter_hierarchy
      applies_to: "Energy, water, and material data"
      requirement: "Prefer product-line or equipment data; prevent double counting between submeter and parent meter; document the allocation of only the unassigned remainder."
      evidence: "Meter tree; invoice reconciliation; allocation record"
    - id: dq_mass_balance
      applies_to: "Dairy materials"
      requirement: "Quantify total mass and, where available, milkfat and dry-matter imbalance. Investigate discrepancies before accepting a dataset; do not hide imbalance as allocation."
      evidence: "Signed balance and corrective-action record"
    - id: dq_heat_treatment
      applies_to: "Pasteurized cream"
      requirement: "Retain validated time-temperature criteria and run-specific evidence. Record diversion, failed verification, rework, and rejected mass."
      evidence: "Recorder chart; validation; calibration; release and deviation logs"
    - id: dq_water_and_wastewater
      applies_to: "Water use and wastewater"
      requirement: "Distinguish potable, reclaimed, and recirculated water; preserve wastewater destination, volume, and COD measurement basis."
      evidence: "Water balance; hazard assessment; effluent laboratory report; discharge record"
    - id: dq_estimate_disclosure
      applies_to: "Provisional ranges and substituted data"
      requirement: "Every reasoned_estimate is a screening aid only. Replace it with foreground or reviewed source evidence, or disclose and explicitly accept it during methodology review before publication-critical use."
      evidence: "Data-gap register; reviewer decision; replacement evidence"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require exactly 1 kg of Cream, fresh e58b11a6-5d86-40a3-bed6-e365a95d0981 using the Mass property and Units of mass group UUIDs declared in Section 3."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "Foreground data package"
    rule: "Fail completeness when any required qualifier in Section 3 is absent or when the product falls within an excluded form."
    source_ids:
      - codex-cxs-288-1976
  - rule_id: validate_pasteurization_record
    applies_to: "Each represented production run"
    rule: "Require a valid time-temperature record and release evidence. Cream pasteurization below the declared validated minimum, unexplained diversion, or missing applicable phosphatase/equivalent verification is an error."
    source_ids:
      - codex-cxc-57-2004
      - eu-reg-853-2004
  - rule_id: validate_process_coverage
    applies_to: "Foreground inventory"
    rule: "Require all four processes in the Process Map, including cold storage, cleaning, wastewater, losses, and applicable refrigerant emissions; zero values require facility evidence."
    source_ids:
      - dairy-pefcr-2025
      - epa-dairy-effluent-guidelines
  - rule_id: validate_mass_balance
    applies_to: "Dairy material flows"
    rule: "Require total-mass reconciliation and reported milkfat/dry-matter reconciliation where data exist. Unexplained negative losses, missing co-products, or an undisclosed imbalance are errors."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_allocation
    applies_to: "Joint or shared burdens"
    rule: "Require direct assignment before allocation, measured output mass and dry matter, factors summing to 1 within rounding tolerance, and reconciliation of allocated quantities to the joint total."
    source_ids:
      - dairy-pefcr-2025
      - mass-balance-identity
  - rule_id: validate_activity_data
    applies_to: "Energy, water, chemicals, packaging, refrigerants, co-products, wastewater, and emissions"
    rule: "Require same-period foreground values or an explicit data gap. A missing record must not be silently converted to zero."
    source_ids:
      - dairy-pefcr-2025
  - rule_id: validate_estimate_status
    applies_to: "Every amount range"
    rule: "Treat a reasoned_estimate only as a replaceable screening range. It cannot establish legal compliance, an allowed production range, or publication-critical performance without reviewer acceptance."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground dairy-processing data package for physically separated fresh cream at the dairy facility gate"
  downstream_use: "secondary_dataset; background_dataset after review, publication, and linkage of required upstream datasets"
  allowed_use: "Product carbon-footprint or LCA modelling for a declared fresh-cream product, route, facility geography, production period, packaging state, and boundary; scenario comparison when allocation and data quality are consistent"
  excluded_use: "Raw, fermented, acidified, sweetened, whipped, frozen, concentrated, dried, sterilized, UHT, reconstituted, or recombined cream; legal food-safety certification; current PEF-conformity claim; cross-product comparative assertion without a compatible reviewed method"
  required_metadata: "PCR id and version; reference flow UUID; facility and geography; production period; milk species; milkfat and dry matter; heat treatment and validation; homogenization; package format; net mass; cold-chain exit; process coverage; allocation formula and factors; upstream datasets; data sources; estimation flags"
  required_quality_disclosure: "Meter coverage; composition sampling; mass/solids imbalance; heat-treatment evidence; allocation level; co-product dry matter; water and wastewater basis; refrigerant inventory; temporal/geographic representativeness; unresolved UUIDs; all provisional estimates and data gaps"
  update_trigger: "Change in milk source or species, product milkfat or formulation, separation or heat-treatment route, homogenization, packaging, refrigerant, energy system, wastewater route, allocation method, facility geography, production period, reference UUID, legal control criterion, or replacement evidence for an important flow"
data_sources:
  - id: "codex-cxs-288-1976"
    type: "standard"
    reference: "FAO/WHO Codex Alimentarius, CXS 288-1976, Standard for Cream and Prepared Creams, official PDF: https://www.fao.org/fao-who-codexalimentarius/sh-proxy/ua/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXS+288-1976%2FCXS_288e.pdf (retrieved 2026-08-10)"
    used_for: "Cream identity as a fluid fat-in-skimmed-milk emulsion obtained by physical separation; scope, product qualifiers, milkfat and heat-treatment disclosure"
