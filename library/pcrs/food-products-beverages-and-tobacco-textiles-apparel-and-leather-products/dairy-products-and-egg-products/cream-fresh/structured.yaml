    type: "official_guidance"
    reference: "FAO/WHO Codex Alimentarius, CXC 57-2004, Code of Hygienic Practice for Milk and Milk Products, official PDF: https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FStandards%252FCXC%2B57-2004%252FCXC_057e.pdf (retrieved 2026-08-10)"
    used_for: "Validated process controls; minimum 75 degrees C for 15 seconds for cream or equivalent; verification records; cold chain; water reuse; cleaning and sanitation"
