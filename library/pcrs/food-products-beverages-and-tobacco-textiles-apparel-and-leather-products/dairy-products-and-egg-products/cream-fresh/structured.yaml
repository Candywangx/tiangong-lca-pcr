measurement_rules:
  - id: reference_mass
    applies_to: "Reference fresh cream"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report net product mass. Convert volume records to mass only with a lot- or product-specific measured density and retain the density, temperature, sampling method, and conversion record."
  - id: milkfat_mass_fraction
    applies_to: "Raw milk, separated cream, skimmed milk co-product, and reference cream"
    required_property_ref:
      name: "Milkfat mass fraction"
      uuid: ""
    required_unit: "% by mass"
    rule: "Measure or obtain from verified compositional records for each representative batch or aggregation period; do not substitute a label category for a numeric mass fraction."
  - id: dry_matter_mass_fraction
    applies_to: "Reference cream and every dairy co-product used in allocation"
    required_property_ref:
      name: "Dry matter mass fraction"
      uuid: ""
    required_unit: "% by mass"
    rule: "Use product-specific measured or verified formulation data for dry-matter allocation. A default may be used only as an exceptional, disclosed fallback and must not support a current PEF-conformity claim."
  - id: energy_preservation
    applies_to: "Electricity and thermal energy"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh and MJ"
    rule: "Preserve electricity and thermal energy separately. Convert units with explicit factors and do not combine heat and electricity before linking the corresponding background energy datasets."
  - id: water_volume
    applies_to: "Process and cleaning water; wastewater"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3 or L"
    rule: "Preserve measured water and wastewater volumes by source and discharge route. Use 1 m3 = 1,000 L; do not infer wastewater mass from product mass without a measured or documented water balance."
