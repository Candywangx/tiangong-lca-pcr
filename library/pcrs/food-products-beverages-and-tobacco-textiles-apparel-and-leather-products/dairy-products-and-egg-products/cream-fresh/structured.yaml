    type: "method_factor"
    reference: "Conservation of total mass and constituent mass across a declared process boundary"
    used_for: "Mass, milkfat, dry-matter, refrigerant, and allocation reconciliation formulas; no empirical performance range"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:f5428a8629ae79392e7a913da45935e6d9dd0e91d8caf918253763f44fb6c61a"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5877"
      family: "system_boundary"
      span:
        start:
          offset: 5877
          line: 61
          column: 1
        end:
          offset: 9209
          line: 82
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Chilled raw milk accepted at the dairy processing facility gate with recorded mass, milk species, milkfat and dry-matter or total-solids information, receipt time, temperature, and supplier or upstream-dataset identity |\n| starting_condition_role | Foreground initial product input; upstream dairy farming and raw-milk production are outside the foreground boundary |\n| product_classification_scope | Fresh cream physically separated from milk and delivered as a refrigerated liquid product; excludes the product forms listed in Section 1 |\n| recursive_input_rule | If fresh cream from the same category enters as rework or transferred intermediate, record it as a distinct product input with quantity, composition, origin, and an upstream dataset; do not recursively recreate its prior production inside this PCR boundary |\n| upstream_dataset_requirement | Link raw milk, transferred dairy intermediates, electricity, thermal energy carriers, water supply, cleaning agents, refrigerants, packaging materials, transport, and off-site treatment to geographically and temporally representative datasets when those activities are in study scope |\n| disclosure | Declare facility location, production period, milk species, product milkfat and dry matter, heat-treatment and homogenization status, packaging state, cold-chain exit condition, included process modules, allocation method and factors, exclusions, data gaps, and every use of a provisional estimate |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `boundary_required_operations` | Dairy processing foreground | Include raw-milk receiving and separation, cream standardization, heat treatment, cooling, filling, refrigerated on-site storage, cleaning, product losses, wastewater dispatch, and applicable direct refrigerant emissions. An operation may be reported as zero only with facility evidence that it did not occur. | `dairy-pefcr-2025`; `epa-dairy-effluent-guidelines` |\n| `boundary_upstream_separation` | Raw milk and other incoming products | Stop foreground recursion at the declared facility-gate inputs and require linked upstream datasets; do not omit their upstream burdens from a cradle-to-gate or broader study. | `dairy-pefcr-2025` |\n| `boundary_heat_treatment` | Fresh cream heat treatment | Include the actual validated time-temperature treatment and associated heating and cooling. For cream pasteurization, use at least 75 degrees C for 15 seconds or a validated equivalent appropriate to product composition and applicable law; retain the validation record. | `codex-cxc-57-2004`; `eu-reg-853-2004` |\n| `boundary_cold_chain` | Intermediate and finished cream | Include on-site refrigeration until the declared facility-gate exit and record product temperature or equivalent refrigerated condition. Downstream refrigerated distribution is outside this foreground boundary unless explicitly added. | `codex-cxc-57-2004` |\n| `boundary_no_silent_cutoff` | Foreground activity data | Collect the mandatory material, energy, water, chemical, refrigerant, co-product, wastewater, and direct-emission fields. Any omitted item must be shown immaterial and disclosed; a data gap is not a zero flow. | `dairy-pefcr-2025` |\n\n"
      headings:
        - kind: "heading"
          span:
