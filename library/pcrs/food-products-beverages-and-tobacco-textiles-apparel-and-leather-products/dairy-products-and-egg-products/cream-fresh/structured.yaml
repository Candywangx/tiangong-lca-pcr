    used_for: "Legal-context heat-treatment alternatives, validation, and record expectations for milk and dairy products; facility-specific applicable law remains controlling"
  - id: "dairy-pefcr-2025"
    type: "standard"
    reference: "European Dairy Association, Product Environmental Footprint Category Rules for Dairy Products, Final PEFCR, February 2025: https://eda.euromilk.org/wp-content/uploads/2025/02/PEFCR-DairyProducts_update_final.pdf (retrieved 2026-08-10; document states validity through December 2025)"
    used_for: "Sector process inputs/outputs; mandatory company-specific activity data; meter hierarchy; co-product dry-matter allocation; technical evidence only, not a current PEF-conformity claim"
