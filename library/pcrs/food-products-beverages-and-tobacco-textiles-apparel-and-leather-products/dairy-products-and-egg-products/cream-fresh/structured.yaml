    type: "official_guidance"
    reference: "United States Environmental Protection Agency, Dairy Products Processing Effluent Guidelines, 40 CFR Part 405 overview: https://www.epa.gov/eg/dairy-products-processing-effluent-guidelines (retrieved 2026-08-10)"
    used_for: "Cleaning residues, spills, pasteurizer start-up/change-over losses, spoiled products, detergents, wastewater, BOD5, TSS, and pH inventory coverage"
