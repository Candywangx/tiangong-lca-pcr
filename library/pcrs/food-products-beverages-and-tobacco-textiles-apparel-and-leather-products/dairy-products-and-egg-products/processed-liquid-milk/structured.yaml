  calculation_rules:
    - id: calc_reference_normalisation
      applies_to: "all inventory rows"
      rule: "normalized amount = reporting-period amount attributable to the declared route divided by reporting-period net mass of released processed liquid milk"
      inputs:
        - "attributable amount"
        - "net released product mass"
      output: "amount per 1 kg reference flow"
      source_ids: []
    - id: calc_volume_to_mass
      applies_to: "milk records reported by volume"
      rule: "mass = measured volume multiplied by density measured or documented for the applicable material, temperature, composition, and period"
      inputs:
        - volume
        - density
        - temperature
        - composition
      output: "kg milk or liquid input"
      source_ids: []
    - id: calc_mass_and_solids_balance
      applies_to: "reception and standardisation"
      rule: "reconcile input mass and fat, protein, and total solids against products, co-products, wastes, stock change, and documented measurement uncertainty"
      inputs:
        - "source milk"
        - components
        - products
        - co-products
        - waste
        - "stock change"
        - composition
      output: "mass and component closure percentages"
      source_ids:
        - ifc-dairy-ehs-2007
    - id: calc_site_energy_intensity
      applies_to: "facility-level energy QA"
      rule: "specific energy = total delivered electricity plus delivered thermal energy converted to MWh divided by tonnes of raw materials; retain carrier-specific exchanges separately"
      inputs:
        - electricity
        - "thermal energy"
        - "raw-material mass"
      output: "MWh/tonne raw materials"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_wastewater_intensity
      applies_to: "facility-level wastewater QA"
      rule: "specific wastewater discharge = metered process-wastewater discharge divided by tonnes of raw materials"
      inputs:
        - "process wastewater volume"
        - "raw-material mass"
      output: "m3/tonne raw materials"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_refrigerant_loss
      applies_to: "refrigeration"
      rule: "emitted mass = opening charge plus additions minus closing charge minus recovered refrigerant, calculated separately for each species"
      inputs:
        - "inventory and service records"
      output: "kg refrigerant emitted by species"
      source_ids:
        - ifc-dairy-ehs-2007
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Product species, composition, treatment route, package, geography, storage condition, and net mass basis are complete and consistent with the reference flow."
      evidence: "approved product specification, label or bulk contract, release record"
    - id: dq_temporal_coverage
      applies_to: "foreground activity data"
      requirement: "Use at least 12 consecutive representative months unless the product is seasonal or campaign-based; explain downtime, abnormal production, and extrapolation."
      evidence: "dated meter extracts, production calendar, invoices, batch records"
    - id: dq_mass_balance
      applies_to: "milk and packaging"
      requirement: "Reconcile milk and primary packaging input, product, co-product, waste, stock change, and documented uncertainty before normalisation."
