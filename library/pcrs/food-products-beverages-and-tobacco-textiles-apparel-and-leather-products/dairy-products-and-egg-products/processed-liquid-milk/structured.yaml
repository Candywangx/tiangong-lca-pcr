system_boundary:
  rules:
    - rule_id: boundary_start_at_dairy_reception
      applies_to: "foreground system boundary"
      rule: "Include milk reception, acceptance measurement, chilled storage, applicable standardisation, heat treatment, homogenisation, cooling, filling, dairy-gate storage, cleaning, product losses, and process wastewater generated for the declared product route."
      source_ids:
        - ifc-dairy-ehs-2007
        - unsd-cpc-22110
    - rule_id: boundary_upstream_inputs
      applies_to: "upstream technosphere"
      rule: "Connect source milk, reconstitution ingredients where applicable, utilities, water, chemicals, packaging, and refrigerant supply through explicit upstream datasets; do not silently omit their production."
      source_ids:
        - ifc-dairy-ehs-2007
    - rule_id: boundary_downstream_exclusion
      applies_to: "downstream stages"
      rule: "Exclude distribution after the dairy gate, retail, consumer refrigeration, consumption, packaging end-of-life, and product end-of-life from the foreground process, while identifying them as downstream stages for a lifecycle model."
      source_ids:
        - idf-dairy-pefcr-2018
    - rule_id: boundary_losses_and_effluent
      applies_to: "losses and emissions"
      rule: "Include rejected milk, spills, separator residues, packaging scrap, cleaning chemicals, wastewater, treatment sludge, and direct refrigerant or combustion emissions when they cross the foreground boundary; disclose recovery, treatment, and destination."
      source_ids:
        - ifc-dairy-ehs-2007
    - rule_id: boundary_heat_route
      applies_to: "heat treatment"
      rule: "Record the actual treatment route and its time-temperature or equivalent validation records. Apply the legal food-safety criteria of the production jurisdiction and disclose the criteria used."
      source_ids:
        - eu-reg-853-2004
boundary_abstraction:
  declared_starting_condition: "Accepted milk at the dairy reception point, with supplier or source, animal species, quantity, temperature, composition, acceptance status, and lot or delivery time declared"
  starting_condition_role: "Foreground collection starts with reception, storage, and processing at the dairy; production of source milk is represented by a matched upstream dataset"
  product_classification_scope: "Unflavoured processed liquid milk within the reviewed semantic scope of CPC 3.0 22110, independent of the classification system used by a consuming dataset"
  recursive_input_rule: "When processed liquid milk or off-specification milk from the same category is used as rework, record it as a distinct technosphere input with origin and quantity, terminate recursion at its supplying dataset, and prevent double counting of its prior processing"
  upstream_dataset_requirement: "Use geographically, temporally, technologically, animal-species, and composition-matched datasets for raw or reconstituted milk components, electricity, fuels or steam, water, cleaning chemicals, refrigerants, and packaging materials"
  disclosure: "Declare source-milk route, facility geography, allocation boundary, included unit operations, bypassed or outsourced operations, heat-treatment and storage route, packaging scope, wastewater destination, and any process data shared with other dairy products"
