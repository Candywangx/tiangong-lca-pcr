allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "all shared dairy operations"
    rule: "First avoid allocation by submetering and subdividing unit operations, and assign directly measured packaging, heat-treatment, cleaning, storage, and waste-management records to the product route that causes them."
    source_ids:
      - iso-14044-2006
      - idf-dairy-pefcr-2018
  - rule_id: allocation_reconcile_milk_components
    applies_to: "standardisation and separation"
    rule: "Reconcile input and output mass plus fat, protein, and total solids before allocation. Cream and other saleable milk fractions are co-products; product losses and treatment residuals are not co-products unless a documented beneficial use makes them products."
    source_ids:
      - ifc-dairy-ehs-2007
  - rule_id: allocation_physical_relationship
    applies_to: "residual shared burdens"
    rule: "When subdivision cannot remove a shared burden, use a documented physical relationship that reflects the causal use of the operation, such as throughput, treatment time, cooling load, or retained milk solids. Do not default to total wet mass when it does not represent the causal relationship."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_other_relationship
    applies_to: "no defensible physical relationship"
    rule: "If no defensible physical relationship exists, use another documented relationship such as contemporaneous economic value, disclose price period and geography, and report a sensitivity check against a plausible alternative."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_no_avoided_burden_credit
    applies_to: "wastes and recovered materials"
    rule: "Do not credit avoided products inside the foreground dataset unless the declared LCA modelling framework explicitly requires substitution. Report recovery outputs and treatment destinations transparently for downstream modelling."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_milk_mass_and_composition
      process_id: "milk_reception_and_standardisation"
      flow_role: "source milk, intermediates, products, co-products"
      record_type: "weighbridge, calibrated flow meter, silo balance, laboratory record, batch record"
      raw_fields: "delivery mass or volume; density and temperature when converted; species; supplier; fat; protein; total solids; accepted or rejected mass; intermediate transfer; co-product mass"
      collection_method: "capture each delivery and production lot; reconcile daily mass and composition"
      unit: "kg; kg/kg; °C"
      frequency: "each delivery and lot, aggregated daily and monthly"
      temporal_coverage: "at least 12 consecutive representative months or the full campaign"
      site_scope: "all reception, storage, separation, and product lines serving the declared product"
      aggregation_rule: "sum masses after stock correction; calculate composition-weighted averages; normalize to released net product"
      quality_evidence: "calibration records, laboratory QA, stock reconciliation, rejection logs"
    - protocol_id: cp_utility_records
      process_id: "heat_treatment_and_filling"
      flow_role: "electricity and thermal carriers"
      record_type: "utility meter, submeter, invoice, fuel or steam meter"
      raw_fields: "carrier identity; meter start and end; fuel quantity; steam or heat quantity; electricity; production downtime; allocation driver"
      collection_method: "capture carrier-specific meters and reconcile with facility invoices"
      unit: "kWh; MJ; MWh; carrier unit"
      frequency: "continuous or shift, aggregated monthly"
      temporal_coverage: "at least 12 consecutive representative months or the full campaign"
      site_scope: "all meters serving reception, processing, filling, cold storage, and allocated utilities"
