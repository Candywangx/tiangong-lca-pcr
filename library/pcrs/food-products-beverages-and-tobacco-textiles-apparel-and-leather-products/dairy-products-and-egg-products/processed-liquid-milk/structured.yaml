    - id: dq_allocation
      applies_to: "shared operations and co-products"
      requirement: "Retain direct assignments, allocation driver values, allocation factors, price or physical data when used, and sensitivity result."
      evidence: "allocation worksheet and source records"
    - id: dq_source_dataset_match
      applies_to: "upstream datasets"
      requirement: "Document temporal, geographic, technological, species, composition, carrier, material, and treatment-route match; disclose proxies and their expected direction of bias."
      evidence: "dataset metadata and proxy justification"
    - id: dq_traceability
      applies_to: "all foreground records"
      requirement: "Trace every normalized value to an immutable source record, calculation rule, responsible person or system, and reporting period without embedding private credentials."
      evidence: "record identifiers, audit trail, QA approval"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The reference output UUID, Mass flow-property UUID, Units of mass unit-group UUID, reference unit kg, and fixed amount 1 kg must exactly match section 3 and the output row."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "dataset metadata"
    rule: "Reject an incomplete package when any required qualifier is absent, ambiguous, or inconsistent with the selected product flow and process route."
    source_ids:
      - unsd-cpc-22110
  - rule_id: validate_scope_exclusions
    applies_to: "product category"
    rule: "Reject raw milk, cream, concentrated or dried milk, sweetened, fermented, acidified, flavoured milk, and non-dairy alternatives from this PCR."
    source_ids:
      - unsd-cpc-22110
  - rule_id: validate_heat_treatment
    applies_to: "heat-treatment route"
    rule: "Require treatment route, time-temperature or equivalent validation, exception handling, applicable jurisdictional criterion, and lot release linkage; if EU criteria are claimed, verify them against Regulation (EC) No 853/2004."
    source_ids:
      - eu-reg-853-2004
  - rule_id: validate_mass_and_solids_closure
    applies_to: "milk processing"
    rule: "Flag unexplained imbalance in total milk mass or fat, protein, and total solids; the package must state closure, measurement uncertainty, stock change, and corrective action rather than forcing the balance."
    source_ids:
      - ifc-dairy-ehs-2007
  - rule_id: validate_energy_qa
    applies_to: "facility-level energy"
    rule: "For a facility where market milk is at least 80 percent of production, compare yearly specific delivered energy with 0.1 to 0.6 MWh per tonne of raw materials; values outside the indicative range require explanation, not automatic replacement."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validate_wastewater_qa
    applies_to: "facility-level wastewater"
    rule: "For a facility where market milk is at least 80 percent of production, compare yearly specific process-wastewater discharge with 0.3 to 3.0 m3 per tonne of raw materials; values outside the indicative range require boundary and meter review."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validate_coproduct_allocation
    applies_to: "standardisation and shared operations"
    rule: "Require co-product classification, direct assignment, allocation driver, factor totals, and sensitivity disclosure; allocation factors across outputs must sum to one for each shared burden."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_waste_destinations
    applies_to: "waste and effluent"
    rule: "Every reject, residue, packaging scrap, wastewater, sludge, and recovered stream must have a quantity, classification, and destination without double counting recovery and disposal."
    source_ids:
      - ifc-dairy-ehs-2007
  - rule_id: validate_no_double_counting
    applies_to: "foreground and upstream datasets"
    rule: "Verify that dairy reception and processing are not simultaneously embedded in the upstream milk dataset and repeated in the foreground, and that rework is not recursively expanded twice."
    source_ids: []
  - rule_id: validate_refrigerant_species
    applies_to: "refrigeration emissions"
    rule: "When refrigeration applies, require substance-specific inventory and elementary-flow identity; reject a generic refrigerant emission that obscures the actual species."
    source_ids:
      - ifc-dairy-ehs-2007
published_dataset_profile:
  dataset_role: "Foreground production dataset for processed liquid milk at the dairy gate"
  downstream_use: "May be published as a secondary_dataset or background_dataset after review, and may supply a downstream process or lifecyclemodel for distribution, retail, use, and end-of-life"
  allowed_use: "Attributional dairy-gate inventories and broader lifecycle models whose product composition, treatment route, package, geography, time, allocation, and upstream milk route match the dataset"
  excluded_use: "Raw-milk production; cream, concentrated, dried, sweetened, fermented, acidified, or flavoured milk; plant-based alternatives; unsupported comparison of unlike species, fat classes, treatments, packages, or allocation methods"
  required_metadata: "PCR id and version when published; product and required qualifiers; geography; reference year and reporting period; facility and technology description; included and outsourced operations; upstream dataset identities; allocation method; data owners; review status"
  required_quality_disclosure: "Primary-data coverage; meter and laboratory QA; mass and solids closure; co-product and waste handling; energy and wastewater QA comparisons; proxy datasets; uncertainty and sensitivity; unresolved identity or range limitations"
  update_trigger: "Material change in source milk or formulation, heat-treatment or filling technology, package, facility, utility mix, wastewater treatment, allocation method, legal food-safety requirements, Tiangong reference identities, or evidence used for QA ranges"
