allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "route-specific operations and directly attributable flows"
    rule: "Subdivide unit operations, meters, lots, and cleaning records so directly attributable inputs, outputs, and emissions remain assigned to the product or co-product that causes them."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relationship
    applies_to: "inseparable multifunctional processes"
    rule: "When subdivision is not possible, use a documented and quantifiable physical relationship that reflects the function causing the shared flows; explain why it is relevant to the outputs."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relationship_fallback
    applies_to: "shared flows without a defensible physical relationship"
    rule: "Use another relationship, such as economic allocation, only after documenting why subdivision and physical allocation are not feasible; use lot-, campaign-, market-, and process-stage-specific quantities and values and disclose sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_no_universal_factor
    applies_to: "butter, buttermilk, skim fractions, milk solids, residues, and other outputs"
    rule: "Do not apply one universal allocation factor across animal species, product forms, or routes. Codex composition limits, quality criteria, and EU BAT performance levels are not allocation factors or default LCI."
    source_ids:
      - codex-cxs-279-1971
      - codex-cxs-280-1973
      - eu-fdm-bat-2019-2031
  - rule_id: allocation_output_status
    applies_to: "recovered material, residue, waste, and co-product classification"
    rule: "Classify each output from auditable disposition and economic or legal status at the process gate. A material treated as waste receives its actual treatment burdens; a saleable output remains a co-product subject to the declared allocation rule."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_species_identity
      process_id: "milkfat_product_manufacturing"
