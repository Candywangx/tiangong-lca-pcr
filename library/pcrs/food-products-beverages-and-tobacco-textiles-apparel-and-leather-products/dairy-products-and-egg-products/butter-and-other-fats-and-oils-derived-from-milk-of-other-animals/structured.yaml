  calculation_rules:
    - id: normalize_to_reference_mass
      applies_to: "all foreground quantities"
      rule: "normalized quantity = compatible-period quantity / accepted net kg of declared reference product"
      inputs:
        - "cp_material_balance plus the applicable collection protocol"
      output: "quantity per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: close_material_balance
      applies_to: "milk-derived materials, ingredients, products, co-products, recovered materials, and losses"
      rule: "compare total input mass on declared bases with total output, recovery, evaporation or removed water, and loss mass; investigate and disclose unexplained imbalance before normalization"
      inputs:
