        - cp_waste_records
      output: "reviewed lot or campaign mass balance and disclosed residual"
      source_ids: []
    - id: calculate_direct_emissions
      applies_to: "direct site emissions not continuously measured"
      rule: "emission by substance and compartment = collected activity quantity multiplied by the documented applicable factor, adjusted only by evidenced control efficiency"
      inputs:
        - cp_direct_emissions
        - cp_utility_records
        - cp_water_and_wastewater
      output: "kg elementary flow per 1 kg reference product"
