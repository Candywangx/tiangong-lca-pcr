    - id: allocate_shared_inventory
      applies_to: "shared foreground inputs and emissions"
      rule: "apply the declared allocation hierarchy: subdivision first, then a relevant physical relationship, then a justified other relationship; retain numerator, denominator, period, and sensitivity data"
      inputs:
