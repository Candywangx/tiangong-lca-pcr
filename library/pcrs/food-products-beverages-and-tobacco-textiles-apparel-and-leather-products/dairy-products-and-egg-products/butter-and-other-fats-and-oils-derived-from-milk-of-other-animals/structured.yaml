      evidence: "calibration certificates, laboratory reports, calculation workbook, and eu-fdm-bat-2019-2031"
validation_rules:
  - rule_id: validate_reference_uuid
    applies_to: "reference flow"
    rule: "The reference product flow UUID shall be 57b3e5ff-3686-4435-96b5-9c09b765a0ac, the Mass property UUID shall be 93a60a56-a3c8-11da-a746-0800200b9a66, the Units of mass UUID shall be 93a60a57-a4c8-11da-a746-0800200c9a66, and the reference unit shall be kg."
    source_ids: []
  - rule_id: validate_species_gate
    applies_to: "product and milk-derived inputs"
    rule: "Confirm auditable source-species evidence for every milk-derived lot and confirm that no source is cattle or buffalo. Unknown, incomplete, or conflicting evidence returns manual_review rather than automatic conformity."
    source_ids:
      - unsd-cpc-3-0-22249
      - codex-cxs-206-1999
  - rule_id: validate_product_identity
    applies_to: "declared product form"
    rule: "Confirm that the product remains milk-derived butter or another milkfat product consistent with the declared Codex identity; do not use Codex composition limits or quality values as LCI quantities."
    source_ids:
      - codex-cxs-279-1971
      - codex-cxs-280-1973
      - codex-cxs-206-1999
  - rule_id: validate_boundary_and_route
    applies_to: "foreground process map"
    rule: "Confirm that every unit operation actually performed before the declared gate is included, that purchased inputs have upstream links, and that packaging and storage inclusion matches the gate declaration."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
  - rule_id: validate_inventory_provenance
    applies_to: "inventory rows"
    rule: "Confirm that every non-zero foreground amount resolves to a collection record or documented calculation and that no BAT performance value, Codex composition limit, or unsupported generic number is used as a default LCI."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
      - codex-cxs-279-1971
      - codex-cxs-280-1973
  - rule_id: validate_balances_and_double_counting
    applies_to: "material, water, energy, recovery, and transfer records"
    rule: "Confirm balance-period compatibility, investigate unexplained residuals, and verify that reused water, recovered product, internal transfers, and recursive same-category inputs are not double counted."
    source_ids:
      - eu-fdm-bat-2019-2031
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "multifunctional processes"
    rule: "Confirm the allocation hierarchy, driver, period, quantities, disposition evidence, and sensitivity disclosure; reject universal factors applied across species or routes without evidence."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_data_quality
    applies_to: "publication candidate"
    rule: "Confirm species traceability, route representativeness, geography, time coverage, completeness, calibration, analytical methods, source documentation, and disclosure of estimates, proxies, exclusions, and data gaps."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019-2031
published_dataset_profile:
  dataset_role: "foreground unit-process data package for manufacture of a declared other-animal milkfat product"
  downstream_use: "secondary_dataset; background_dataset; process and lifecyclemodel projections after validation"
  allowed_use: "Products demonstrably within CPC 3.0 22249 with matching source species, product form, production route, geography, period, gate, packaging state, storage condition, and allocation method"
  excluded_use: "Cattle-derived CPC 22241; buffalo-derived CPC 22242; unknown or unaudited species; non-dairy substitutes; undisclosed mixed-species products; routes or gates materially different from the represented system"
  required_metadata: "PCR id; reference UUIDs; source species and evidence references; product form; route; composition measurement basis where relevant; gate; packaging and storage state; geography; period; lot or campaign; process map; upstream links; allocation method"
  required_quality_disclosure: "Protocol coverage; technological, geographical, and temporal representativeness; completeness; calibration and analytical evidence; mass and water balance; allocation rationale; treatment routes; estimates, proxies, exclusions, unresolved gaps, and manual-review disposition"
  update_trigger: "Change in source species or evidence chain, product form, route, site, technology, formulation, allocation driver, gate, packaging, storage, upstream dataset, measurement basis, data period, or any material source or regulatory requirement"
data_sources:
  - id: "unsd-cpc-3-0-22249"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Explanatory Notes, subclass 22249, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-12)"
    used_for: "Category identity, included product forms, residual other-animal species gate, and explicit exclusion of cattle 22241 and buffalo 22242"
  - id: "codex-cxs-279-1971"
    type: "standard"
    reference: "Codex Alimentarius, CXS 279-1971, Standard for Butter, https://workspace.fao.org/sites/codex/Standards/CXS%20279-1971/CXS_279e.pdf (retrieved 2026-08-12)"
    used_for: "Butter identity, milk-derived raw-material boundary, and route-relevant ingredient context; composition and quality values are not used as default LCI"
  - id: "codex-cxs-280-1973"
    type: "standard"
    reference: "Codex Alimentarius, CXS 280-1973, Standard for Milkfat Products, https://workspace.fao.org/sites/codex/Standards/CXS%20280-1973/CXS_280e.pdf (retrieved 2026-08-12)"
    used_for: "Anhydrous milkfat, milkfat, butter-oil, and ghee identity and process-boundary interpretation; composition and quality values are not used as default LCI"
  - id: "codex-cxs-206-1999"
    type: "standard"
    reference: "Codex Alimentarius, CXS 206-1999, General Standard for the Use of Dairy Terms, https://workspace.fao.org/sites/codex/Standards/CXS%20206-1999/CXS_206e.pdf (retrieved 2026-08-12)"
    used_for: "Milk-product definitions, source-animal declaration, dairy-term identity, and mixed-species disclosure gate"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on Environmental Footprint methods, ELI: http://data.europa.eu/eli/reco/2021/2279/oj (retrieved 2026-08-12)"
    used_for: "Functional unit and reference-flow framing, company-specific data, system boundary, upstream datasets, multifunctionality hierarchy, completeness, data quality, verification, packaging, and transparent cut-off disclosure"
  - id: "eu-fdm-bat-2019-2031"
    type: "official_guidance"
    reference: "Commission Implementing Decision (EU) 2019/2031 establishing BAT conclusions for the food, drink and milk industries, ELI: http://data.europa.eu/eli/dec_impl/2019/2031/oj (retrieved 2026-08-12)"
    used_for: "Process-level collection of water, energy, raw materials, wastewater, waste gas, residues, monitoring, and cleaning records; BAT performance levels are not used as default LCI"
