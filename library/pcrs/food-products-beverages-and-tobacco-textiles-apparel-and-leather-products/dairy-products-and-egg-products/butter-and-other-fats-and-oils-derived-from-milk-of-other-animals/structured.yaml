      collection_method: "scale record, inventory reconciliation, and waste transfer documentation"
      unit: "kg"
      frequency: "every event or container dispatch"
      temporal_coverage: "representative production period"
      site_scope: "each site and treatment route"
      aggregation_rule: "aggregate by material and route, exclude recovered product already returned to process, and normalize to accepted output"
      quality_evidence: "scale calibration, transfer note, receiver evidence, and loss investigation"
    - protocol_id: cp_direct_emissions
      process_id: "milkfat_product_manufacturing"
      flow_role: "direct air, water, and soil emissions"
      record_type: "measurement or emission-calculation record"
      raw_fields: "substance; compartment; measured value or activity data; factor; factor source; control device; operating state; time interval"
      collection_method: "direct measurement where available, otherwise calculation from collected activity data using a documented factor"
      unit: "kg and parameter-specific units"
      frequency: "each monitoring or activity-data interval"
      temporal_coverage: "representative production period including normal variability"
      site_scope: "each emission point and site"
