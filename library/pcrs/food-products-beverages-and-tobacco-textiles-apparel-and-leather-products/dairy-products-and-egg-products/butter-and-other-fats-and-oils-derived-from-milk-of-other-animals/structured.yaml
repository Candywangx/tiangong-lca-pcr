      record_type: "supplier and receiving identity record"
      raw_fields: "supplier lot; source species; farm or chain-of-custody reference; milk-derived input form; receipt date; accepted or rejected status"
      collection_method: "reconcile supplier declaration and auditable origin evidence to each received lot; route any unknown, cattle, buffalo, or conflicting result to manual review"
      unit: "not applicable"
      frequency: "every received lot"
      temporal_coverage: "full production period"
      site_scope: "all supplying origins and receiving sites"
      aggregation_rule: "no aggregation across lots until every lot passes the species gate"
      quality_evidence: "signed supplier evidence, traceable origin record, receiving record, and review disposition"
    - protocol_id: cp_material_balance
      process_id: "milkfat_product_manufacturing"
      flow_role: "milk-derived inputs, ingredients, product, co-products, and transfers"
      record_type: "lot or campaign mass-balance record"
      raw_fields: "lot id; material id; source species where milk-derived; input mass; output mass; return; recovery; loss; moisture or composition basis; timestamp"
      collection_method: "calibrated scale, tank measurement, production record, and inventory reconciliation"
      unit: "kg"
      frequency: "each receipt, transfer, and output event"
      temporal_coverage: "each production lot or homogeneous campaign"
      site_scope: "each manufacturing and packaging site"
      aggregation_rule: "sum compatible records on one declared basis, investigate imbalance, then divide by accepted net reference-product mass"
      quality_evidence: "calibration record, lot genealogy, reconciliation approval, and basis-conversion record"
    - protocol_id: cp_utility_records
      process_id: "milkfat_product_manufacturing"
      flow_role: "electricity, purchased heat, steam, and fuels"
      record_type: "meter, invoice, or fuel issue record"
      raw_fields: "meter id; carrier; opening and closing readings; fuel quantity; heating-value basis; production period; allocation key; recovered heat"
      collection_method: "submetering preferred; otherwise reconcile site meter or invoice to operating records using a documented causal allocation key"
      unit: "kWh, MJ, kg, or m3"
      frequency: "continuous or each meter and fuel-reading interval"
      temporal_coverage: "representative production period covering seasonal operation"
      site_scope: "each site and attributable utility system"
      aggregation_rule: "aggregate by carrier and process, subtract documented exports or recovery, and normalize to accepted output"
      quality_evidence: "meter calibration, invoice reconciliation, operating-hour record, and allocation rationale"
    - protocol_id: cp_water_and_wastewater
      process_id: "milkfat_product_manufacturing"
      flow_role: "fresh water, reused water, and wastewater"
      record_type: "water meter, reuse log, and effluent record"
      raw_fields: "source; meter readings; use area; reuse volume; discharge volume; destination; relevant pH, temperature, COD or TOC, nitrogen, phosphorus, chloride, conductivity, and solids where monitored"
      collection_method: "direct metering and monitoring at the most appropriate process or site level, supported by a water balance"
      unit: "kg or m3 and parameter-specific units"
      frequency: "each meter interval and monitoring event"
      temporal_coverage: "representative production period"
      site_scope: "each site, water source, reuse loop, and discharge point"
      aggregation_rule: "keep fresh, reused, and discharged streams distinct; aggregate compatible records and normalize to accepted output"
      quality_evidence: "meter calibration, laboratory method, sampling record, and water-balance closure"
    - protocol_id: cp_cleaning_records
      process_id: "milkfat_product_manufacturing"
      flow_role: "cleaning and sanitation chemicals"
      record_type: "CIP or sanitation batch record"
      raw_fields: "chemical identity; concentration; dose; water volume; temperature; conductivity or pH where used; cycle id; equipment; recovered or discharged quantity"
      collection_method: "dosing-system log, stock reconciliation, and CIP control record"
      unit: "kg and m3"
      frequency: "every cleaning cycle or reconciled campaign"
      temporal_coverage: "representative production period"
      site_scope: "each cleaning circuit and site"
      aggregation_rule: "aggregate actual chemical and water use by included equipment and normalize to accepted output"
      quality_evidence: "dosing calibration, stock reconciliation, CIP trend, and exception log"
    - protocol_id: cp_waste_records
      process_id: "milkfat_product_manufacturing"
      flow_role: "product losses, residues, and waste"
      record_type: "waste transfer and production-loss record"
