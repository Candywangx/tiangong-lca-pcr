system_boundary:
  rules:
    - rule_id: species_scope_gate
      applies_to: "product identity and every milk-derived input"
      rule: "Include only products with auditable evidence that every source animal is neither cattle nor buffalo. Unknown species, incomplete mixed-species disclosure, or unaudited classification evidence requires manual_review."
      source_ids:
        - unsd-cpc-3-0-22249
        - codex-cxs-206-1999
    - rule_id: foreground_unit_operations
      applies_to: "declared manufacturing route"
      rule: "Include receiving and cold storage, fat separation or concentration when performed, churning and working for butter routes, heating, clarification, dehydration, fractionation, recombination, resolidification or flavour development when performed, direct process utilities, cleaning, product recovery, wastewater handling, and on-site waste handling."
      source_ids:
        - codex-cxs-279-1971
        - codex-cxs-280-1973
        - eu-fdm-bat-2019-2031
    - rule_id: upstream_linkage
      applies_to: "purchased milk-derived feedstocks, ingredients, packaging, energy, water, chemicals, and transport"
      rule: "Record each purchased input as a visible product flow and link it to a geographically and technologically representative upstream dataset; do not replace supplier activity data with a composition limit or BAT performance level."
      source_ids:
        - eu-pef-2021-2279
        - eu-fdm-bat-2019-2031
    - rule_id: direct_emissions_and_wastes
      applies_to: "foreground site"
      rule: "Record measured or calculated direct emissions, wastewater streams, product losses, residues, and wastes generated by included operations, together with treatment route and data provenance."
      source_ids:
        - eu-fdm-bat-2019-2031
        - eu-pef-2021-2279
    - rule_id: packaging_and_storage_gate
      applies_to: "packaged dispatch-gate product"
      rule: "Include primary, secondary, and tertiary packaging plus storage or refrigeration only when they occur before the declared gate; otherwise disclose their exclusion."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: no_silent_cutoff
      applies_to: "foreground inventory"
      rule: "Record all known inputs and outputs. Any exclusion shall be explicitly justified, quantified where possible, and reported as a data gap or downstream study-specific cut-off rather than silently omitted from the foreground package."
      source_ids:
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "receipt of an auditable species-identified milk-derived feedstock at the manufacturing site"
