  data_quality_requirements:
    - id: dq_species_traceability
      applies_to: "every milk-derived input"
      requirement: "Retain species evidence linked to each supplier lot. Unknown, conflicting, cattle, buffalo, or incompletely disclosed mixed-species evidence requires manual_review and prevents automatic PCR conformity."
      evidence: "cp_species_identity; supplier declaration; farm or chain-of-custody record; unsd-cpc-3-0-22249; codex-cxs-206-1999"
    - id: dq_technological_representativeness
