allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Multi-product dairy processing"
    rule: "First subdivide reception, cream preparation, butter manufacture, concentrated milkfat manufacture and packaging using process meters, batch records and transfer measurements so directly attributable inputs and outputs are assigned without allocation."
    source_ids:
      - fao-idf-dairy-lca-2010
      - fao-dairy-accounting
  - rule_id: allocation_internal_recycle
    applies_to: "Rework and recycled water or product"
    rule: "Keep internally recycled material inside the system and record only net external inputs and outputs; do not assign an avoided-product credit to internal recycle."
    source_ids:
      - fao-dairy-accounting
      - tetrapak-dairy-effluent
  - rule_id: allocation_buttermilk_and_nonfat_coproducts
    applies_to: "Buttermilk and separated non-fat phases with product status"
    rule: "After subdivision, allocate only residual shared burdens among saleable co-products. Use the governing programme method when one exists; otherwise apply a documented physical relation that reflects the production relationship, and test an economic alternative when the choice is material. Report quantities, factor basis, prices or composition data, reference period and sensitivity."
    source_ids:
      - fao-idf-dairy-lca-2010
  - rule_id: allocation_waste_boundary
    applies_to: "Wastewater, off-spec material and residues"
    rule: "A material is a co-product only when it has a documented beneficial use and product status. Otherwise model its treatment as waste and do not use revenue alone to erase treatment burdens."
    source_ids:
      - tetrapak-dairy-effluent
  - rule_id: allocation_upstream_consistency
    applies_to: "Upstream cattle-milk or cream datasets"
    rule: "Preserve the allocation method and co-product boundary disclosed by upstream dairy datasets; do not reallocate upstream burdens inside this foreground dataset without complete underlying inventory and an explicit sensitivity case."
    source_ids:
      - fao-idf-dairy-lca-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_dairy_material_receipt
      process_id: "reception_and_cream_preparation"
      flow_role: "Cattle milk; cattle-milk cream; cattle-milk butter"
      record_type: "Weighbridge, calibrated tank or mass-flow record plus certificate of analysis"
      raw_fields: "timestamp; supplier and origin; exact material identity; gross and tare or meter mass; milkfat; water or total solids; temperature; acceptance status; upstream dataset id"
      collection_method: "Record cattle milk, cattle-milk cream and cattle-milk butter as three separate receipt series and reconcile each accepted quantity to storage movement"
      unit: "kg and % m/m"
      frequency: "Each receipt"
      temporal_coverage: "At least one representative 12-month period or all campaigns in a shorter disclosed seasonal production period"
      site_scope: "Every included site and material source"
      aggregation_rule: "Sum each exact material separately; mass-weight composition within, but never across, material identities; retain each rejected material separately"
      quality_evidence: "Meter calibration; supplier certificate; laboratory result; intake and tank reconciliation"
    - protocol_id: cp_process_utilities
      process_id: "reception_and_cream_preparation"
      flow_role: "Electricity; purchased steam; purchased hot water; natural gas; diesel; LPG; carbon dioxide; nitrogen oxides; sulfur dioxide; PM2.5"
      record_type: "Sub-meter, invoice, fuel stock, operating log and emission measurement or calculation record"
      raw_fields: "process_id; exact energy or emission identity; meter start and end or stock movement; quantity; unit; fuel net calorific value when used; steam condition when used; operating time; line throughput; allocation driver; emission factor or measurement basis when used"
      collection_method: "Record electricity, purchased steam, purchased hot water, natural gas, diesel and LPG separately by process; record carbon dioxide, nitrogen oxides, sulfur dioxide and PM2.5 as four separate air-emission series"
      unit: "kWh, MJ, kg fuel, kg steam or kg emission"
      frequency: "Each batch or at least monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included process line and shared utility centre"
      aggregation_rule: "Convert each energy identity separately; subtract exports; allocate only residual shared use; calculate each named emission separately; normalize to conforming output"
      quality_evidence: "Meter calibration; invoice; stock reconciliation; conversion source; allocation worksheet; emission measurement or factor record"
    - protocol_id: cp_water_and_wastewater
      process_id: "reception_and_cream_preparation"
      flow_role: "Process water; sodium hydroxide; nitric acid; peracetic acid; wastewater"
      record_type: "Water and effluent meter, chemical issue record and treatment log"
      raw_fields: "process_id; exact exchange identity; intake or issue; internal recycle; discharge; quantity; unit; concentration for each CIP chemical; sampling point; destination"
      collection_method: "Record process water, sodium hydroxide, nitric acid, peracetic acid and wastewater as five separate series for every included process"
      unit: "kg or m3"
      frequency: "Daily or per campaign"
      temporal_coverage: "Same period as product output"
      site_scope: "Entire included dairy site with process allocation"
      aggregation_rule: "Keep each water or chemical identity and each process wastewater separate; do not double count recycle; allocate a shared discharge only by measured volume or documented load driver"
      quality_evidence: "Meter calibration; chemical issue reconciliation; water balance; laboratory report; treatment operator record"
    - protocol_id: cp_process_mass_balance
      process_id: "reception_and_cream_preparation"
      flow_role: "Prepared cattle-milk cream; prepared cattle-milk butter; cattle skim milk; rejected cattle milk; rejected cattle-milk cream; rejected cattle-milk butter; filter residue"
      record_type: "Tank, batch and transfer records"
      raw_fields: "exact exchange identity; opening stock; receipt; transfer mass; closing stock; reject mass; residue mass; milkfat; moisture"
      collection_method: "Reconcile each named material independently for every campaign and for monthly totals"
      unit: "kg and % m/m"
      frequency: "Each transfer and campaign"
      temporal_coverage: "Same period as product output"
      site_scope: "Each included site and line"
      aggregation_rule: "Preserve separate balances for prepared cream, prepared butter, skim milk, each rejected dairy material and filter residue; investigate rather than merge unexplained loss"
      quality_evidence: "Calibrated meters; signed batch record; reconciliation residual and investigation"
    - protocol_id: cp_butter_batch
      process_id: "butter_manufacture"
      flow_role: "Cattle-milk cream; starter culture; sodium chloride; formulation water; beta-carotene; cattle-milk butter; cattle-milk butterfat; buttermilk; off-spec butter; filter residue"
      record_type: "Churn or continuous-line batch record, ingredient issue record and laboratory result"
      raw_fields: "exact exchange identity; input mass; batch start and end; product or co-product mass; milkfat; moisture; reject or residue mass"
      collection_method: "Record each named butter input and output separately for every batch or continuous campaign and retain composition tests"
      unit: "kg and % m/m"
      frequency: "Each batch or campaign"
      temporal_coverage: "Same period as product output"
      site_scope: "Every butter line"
      aggregation_rule: "Reconcile total mass and milkfat while preserving one series per named input, product, co-product, waste and residue"
      quality_evidence: "Calibrated meters and scales; ingredient certificate; composition method; release record; mass and fat closure"
    - protocol_id: cp_concentrated_milkfat_batch
      process_id: "concentrated_milkfat_manufacture"
      flow_role: "Cattle-milk cream; cattle-milk butter; diatomaceous earth; anhydrous milkfat; butter oil; ghee; non-fat cattle-milk phase; condensate; wastewater; filter residue; off-spec concentrated milkfat"
      record_type: "Campaign flowmeter, tank, evaporator or separator record, filter-aid issue record and product laboratory result"
      raw_fields: "exact exchange identity; input mass and composition; product mass, milkfat and water; separated phase mass; condensate; reject; residue; operating time"
      collection_method: "Record every named input and output separately for each campaign and laboratory release lot"
      unit: "kg and % m/m"
      frequency: "Each campaign or lot"
      temporal_coverage: "Same period as product output"
      site_scope: "Every concentration line"
      aggregation_rule: "Reconcile total mass and milkfat while keeping anhydrous milkfat, butter oil, ghee, non-fat phase, condensate, wastewater, filter residue and reject as separate series"
      quality_evidence: "Flowmeter and scale calibration; laboratory result; campaign log; issue record; mass and fat closure"
    - protocol_id: cp_packaging_and_storage
      process_id: "product_packaging_and_storage"
      flow_role: "Unpacked butter; unpacked anhydrous milkfat; unpacked butter oil; unpacked ghee; aluminium foil; paperboard; LDPE film; HDPE pail; steel drum; released reference product; each off-spec product; each packaging waste"
      record_type: "Filler counter or scale, packaging issue log, warehouse and reject record"
      raw_fields: "exact product or packaging identity; unpacked input; packed net output; issued packaging mass; unused return; waste mass; reject mass; rework; storage time and temperature"
      collection_method: "Record each named product, packaging input, off-spec product and packaging waste as a separate series and reconcile each production lot to released warehouse quantity"
      unit: "kg product, kg packaging, hours and degrees Celsius"
      frequency: "Each lot"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included filling line and on-site store"
      aggregation_rule: "Net product excludes packaging; calculate consumption and waste separately for aluminium foil, paperboard, LDPE film, HDPE pail and steel drum; keep each product form separate"
      quality_evidence: "Scale calibration; packaging specification; batch release; warehouse movement and waste disposition"
    - protocol_id: cp_refrigerant_records
      process_id: "product_packaging_and_storage"
      flow_role: "R717 make-up; R717 emission; R134a make-up; R134a emission"
      record_type: "Maintenance and refrigerant stock record"
      raw_fields: "exact refrigerant; equipment; opening stock; purchase; recharge; recovery; closing stock; unrecovered loss; service area; process_id; period"
      collection_method: "Calculate R717 and R134a make-up separately and calculate unrecovered R717 and R134a emissions separately from reconciled stocks and service events"
      unit: "kg of the named refrigerant"
      frequency: "Each service event and annual reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "All refrigeration serving included processes"
      aggregation_rule: "Keep one series per refrigerant and per make-up or emission direction; allocate shared equipment only by documented cooling load or operating-time driver"
      quality_evidence: "Technician record; purchase and recovery certificate; stock reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All foreground inventory"
      rule: "normalized amount = period amount / net conforming saleable product mass; packaging mass is excluded from the denominator"
      inputs:
        - "period flow amount"
        - "released net product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - fao-dairy-accounting
    - id: calc_mass_balance
      applies_to: "Each process and route"
      rule: "opening stock + external inputs + internal transfers in = closing stock + product outputs + co-products + wastes + internal transfers out + quantified losses; report the residual and measurement uncertainty"
      inputs:
        - stock
        - input
        - output
        - transfer
        - "reject and loss records"
      output: "process mass-balance residual"
      source_ids:
        - fao-dairy-accounting
    - id: calc_milkfat_balance
      applies_to: "Reception, butter and concentrated milkfat routes"
      rule: "sum(input mass × input milkfat fraction) = sum(output mass × output milkfat fraction) + measured fat in waste and loss; report unexplained residual"
      inputs:
        - "mass and milkfat test results for all material streams"
      output: "milkfat-balance residual"
      source_ids:
        - codex-cxs-279-1971
        - codex-cxs-280-1973
        - fao-dairy-accounting
    - id: calc_energy_conversion
      applies_to: "Fuels, steam and purchased heat"
      rule: "convert each measured carrier with its disclosed lower or higher heating value or enthalpy convention; never mix conventions within the reported series and never count both steam and its generating fuel"
      inputs:
        - "carrier quantity"
        - "calorific value or steam enthalpy"
        - "efficiency only when converting delivered to useful heat"
      output: "MJ or kWh by carrier and process"
      source_ids:
        - fao-idf-dairy-lca-2010
    - id: calc_coproduct_allocation
      applies_to: "Residual shared burdens after subdivision"
      rule: "allocated burden to product i = residual shared burden × declared allocation factor i; factors shall sum to 1 across co-products and a material alternative allocation shall be reported as sensitivity"
      inputs:
        - "residual shared burden"
        - "product quantities"
        - "physical relation or economic values"
        - "reference period"
      output: "allocated residual burden and sensitivity result"
      source_ids:
        - fao-idf-dairy-lca-2010
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference flow and incoming dairy material"
      requirement: "Demonstrate cattle-milk origin, product form and applicable CXS 279 or CXS 280 composition for each represented product lot; do not use the anhydrous-milkfat UUID for ordinary butter without a form-specific identity resolution."
      evidence: "Product specification; supplier declaration; lot release; milkfat and moisture tests; selected Tiangong UUID"
    - id: dq_temporal_representativeness
      applies_to: "All foreground records"
      requirement: "Use a representative continuous 12-month period where production is year-round; a shorter period is allowed only when it covers the full declared seasonal campaign and seasonality is disclosed."
      evidence: "Meter and batch date coverage; production calendar; gap register"
    - id: dq_geographic_and_technical_scope
      applies_to: "Site and upstream datasets"
      requirement: "Match the actual country or region, cattle-milk supply and manufacturing technology; disclose proxies and assess material mismatch."
      evidence: "Site metadata; supplier origin; equipment and route records; dataset geography and technology"
    - id: dq_completeness
      applies_to: "Mass, milkfat, energy, water and waste inventories"
      requirement: "Reconcile process mass and milkfat balances, all utility meters and waste destinations; investigate unexplained residuals instead of forcing closure."
      evidence: "Signed balance worksheets; meter reconciliation; residual explanation; waste transfer evidence"
    - id: dq_hygiene_and_measurement_controls
      applies_to: "Product-contact water, ingredients and process control"
      requirement: "Retain evidence that water and ingredients meet specifications and that hygienic control measures, monitoring and corrective actions are validated for the declared route."
      evidence: "Potable-water tests; ingredient certificates; HACCP or equivalent records; calibration and corrective-action logs"
    - id: dq_allocation_transparency
      applies_to: "Multi-product operations"
      requirement: "Report subdivision, residual shared burdens, allocation method, factors, data year and sensitivity; upstream allocations remain separately disclosed."
      evidence: "Process map; sub-meter evidence; allocation workbook; price or composition evidence; sensitivity result"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "Reference flow"
    rule: "The dataset shall declare one covered product form, cattle-milk origin and all required qualifiers. The UUID 7f8eef6e-3ea0-4f74-bf72-c6f95af2c3fc is accepted only for anhydrous-milkfat or explicitly equivalent concentrated forms; ordinary butter requires a form-specific resolved UUID."
    source_ids:
      - codex-cxs-279-1971
      - codex-cxs-280-1973
  - rule_id: validation_reference_amount
    applies_to: "Quantitative reference"
    rule: "The net reference output shall equal exactly 1 kg on Mass property 93a60a56-a3c8-11da-a746-0800200b9a66 in kg from unit group 93a60a57-a4c8-11da-a746-0800200c9a66, excluding packaging."
    source_ids: []
  - rule_id: validation_product_composition
    applies_to: "Finished product"
    rule: "Butter shall have at least 80% m/m milkfat, no more than 16% m/m water and no more than 2% m/m milk solids-not-fat. Anhydrous milkfat or anhydrous butter oil shall have at least 99.8% m/m milkfat and no more than 0.1% m/m water; other CXS 280 forms shall satisfy their applicable declared limits."
    source_ids:
      - codex-cxs-279-1971
      - codex-cxs-280-1973
  - rule_id: validation_process_selection
    applies_to: "Process map"
    rule: "reception_and_cream_preparation and product_packaging_and_storage shall be included, and at least one of butter_manufacture or concentrated_milkfat_manufacture shall be included consistently with the declared product form."
    source_ids:
      - tetrapak-butter-handbook
      - tetrapak-amf-handbook
  - rule_id: validation_mass_and_fat_closure
    applies_to: "Foreground process records"
    rule: "Each included process shall report mass-balance and milkfat-balance residuals with measurement uncertainty and an explanation for material residuals; balance closure shall not be fabricated by inserting an unmeasured loss."
    source_ids:
      - fao-dairy-accounting
  - rule_id: validation_inventory_coverage
    applies_to: "Foreground inventory"
    rule: "Require one atomic exchange card for each used or generated identity: cattle milk, cattle-milk cream, cattle-milk butter, process water, each named ingredient or processing aid, each CIP chemical, electricity, purchased steam, purchased hot water, natural gas, diesel, LPG, R717 make-up, R134a make-up, each named product and co-product, wastewater, each solid or packaging waste, carbon dioxide, nitrogen oxides, sulfur dioxide, PM2.5, R717 emission and R134a emission. A selector or combined flow name shall fail validation; a genuinely absent exchange shall be documented as non-applicable rather than represented by an aggregate card."
    source_ids:
      - fao-idf-dairy-lca-2010
      - codex-cxc-57-2004
      - tetrapak-dairy-effluent
  - rule_id: validation_collection_links
    applies_to: "Collected and calculated inventory rows"
    rule: "Every row with collected_record or calculated_from_collection evidence shall reference an implemented collection protocol, and every calculated row shall identify its calculation rule or reproducible worksheet."
    source_ids: []
  - rule_id: validation_allocation
    applies_to: "Co-products and shared operations"
    rule: "Direct burdens shall be subdivided before allocation; residual allocation factors shall sum to 1, use one disclosed basis across the reporting period and include a sensitivity result when the method materially affects the product result."
    source_ids:
      - fao-idf-dairy-lca-2010
  - rule_id: validation_no_double_counting
    applies_to: "Utilities, recycle and upstream processes"
    rule: "Verify that purchased steam and boiler fuel, recycled water and fresh water, rework and new input, refrigerant loss assignments, and upstream dairy production are each counted once."
    source_ids:
      - fao-idf-dairy-lca-2010
      - fao-dairy-accounting
published_dataset_profile:
  dataset_role: "Site-specific foreground data package for a declared cattle-milk butter or milkfat product, publishable as a unit process or aggregated gate-to-gate dataset after review"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Attributional product LCA, supply-chain modelling, verified processor-gate comparison of like product forms, hotspot analysis and downstream food-system models when geography, technology, allocation and product specification are compatible"
  excluded_use: "Comparative assertions between unlike butter and concentrated-milkfat forms; nutrition or food-safety certification; claims outside the represented geography or period without representativeness review; consequential market modelling without an explicit reformulation"
  required_metadata: "PCR id and version state; product form and Tiangong flow identity; cattle-milk origin; CXS product specification; plant and geography; technology and route; reference period; system boundary; upstream datasets; allocation method and factors; packaging and storage state; data owners and review status"
  required_quality_disclosure: "Primary-data coverage; meter and test methods; mass and milkfat residuals; missing-flow UUIDs; proxy datasets; temporal, geographic and technology limitations; cut-offs; co-product sensitivity; uncertainty and reviewer findings"
  update_trigger: "Product-form or route change; supplier or cattle-milk origin change; material change in milkfat or moisture specification, energy system, packaging, co-product use or allocation; new form-specific Tiangong flow identity; reference data expiry; more representative 12-month foreground records; corrected mass or milkfat closure"
