measurement_rules:
  - id: reference_product_mass
    applies_to: "Reference product and all mass-normalized inventory"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure net saleable product mass excluding packaging and normalize every reported foreground amount to exactly 1 kg of the declared product form."
  - id: milkfat_and_moisture_basis
    applies_to: "Product identity and yield checks"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "% m/m"
    rule: "Report milkfat, water and milk-solids-not-fat on a mass basis using representative product testing; apply the limits for the declared CXS 279 or CXS 280 product and retain the test method and lot result."
  - id: energy_carrier_accounting
    applies_to: "Electricity, fuels, steam and refrigeration"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Preserve the metered carrier and unit; convert only with a disclosed factor, avoid double counting purchased steam and its generating fuel, and normalize energy to the same net product mass."
  - id: water_and_wastewater_accounting
    applies_to: "Process water, cleaning water and wastewater"
    required_property_ref:
      name: "Mass or volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Record measured volume with temperature or density assumptions when converted to mass; recycled water shall be separately identified and shall not be counted again as fresh intake."
process_map:
  - id: reception_and_cream_preparation
    name: "Reception and cream preparation"
    inclusion: "required"
    inclusion_condition: "Always; separation is conditional when whole cattle milk rather than cream is received"
    role: "Foreground material reception, storage, separation when applicable, pasteurization and temperature preparation"
    quantitative_reference: "kg prepared cream or declared dairy-fat feed transferred to product formation"
  - id: butter_manufacture
    name: "Butter manufacture by churning and working"
    inclusion: "conditional"
    inclusion_condition: "Include for ordinary butter, cultured butter, salted butter or butterfat made through cream churning"
    role: "Foreground butter formation and buttermilk separation"
    quantitative_reference: "kg unpacked butter or butterfat transferred to finishing"
  - id: concentrated_milkfat_manufacture
    name: "Concentrated milkfat manufacture"
    inclusion: "conditional"
    inclusion_condition: "Include for anhydrous milkfat, milkfat, anhydrous butter oil, butter oil or ghee"
    role: "Foreground fat concentration, phase separation and moisture removal from cream or butter"
    quantitative_reference: "kg unpacked concentrated milkfat transferred to finishing"
  - id: product_packaging_and_storage
    name: "Product filling, packaging and storage"
    inclusion: "required"
    inclusion_condition: "Always; packaging material is conditional for unpackaged bulk transfer"
    role: "Foreground finishing to saleable processor-gate product"
    quantitative_reference: "1 kg net saleable declared product"
