system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "core foreground package"
      rule: "Include receipt and storage, standardization, heat treatment and homogenization when used, fermentation or direct acidification, concentration or blending when used, cooling, filling or bulk dispatch, on-site cold storage, sanitation, direct emissions, product losses, waste, and wastewater up to the manufacturing dispatch gate."
      source_ids:
        - ifc-dairy-processing-ehs-2007
        - dairy-pefcr-2025
    - rule_id: boundary_upstream_links
      applies_to: "purchased inputs"
      rule: "Keep farming, raw-milk collection, inbound transport, ingredient manufacture, energy supply, packaging manufacture, and chemical manufacture outside the foreground operation but link them through explicit upstream datasets when included in study scope."
      source_ids:
        - ifc-dairy-processing-ehs-2007
        - dairy-pefcr-2025
    - rule_id: boundary_route_disclosure
      applies_to: "product identity"
      rule: "Distinguish microbial fermentation, direct acidification, combined routes, and post-fermentation heat treatment because these routes change required inputs, product claims, and storage conditions."
      source_ids:
        - codex-fermented-milks-243
        - codex-cream-288
        - ecfr-acidified-milk-131-111
    - rule_id: boundary_optional_downstream
      applies_to: "expanded studies"
      rule: "Distribution, retail, consumer refrigeration and use, food loss, and packaging end-of-life may be appended only as separately declared downstream modules and shall not be folded into the factory-gate foreground result."
      source_ids:
        - dairy-pefcr-2025
