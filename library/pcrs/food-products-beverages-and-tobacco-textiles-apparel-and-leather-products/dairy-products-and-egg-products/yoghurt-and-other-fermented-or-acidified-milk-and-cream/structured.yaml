allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "multi-output foreground operations"
    rule: "First use separate metering, subdivision, or batch-specific records to assign inputs, utilities, emissions, wastes, and packaging directly to the product that caused them."
    source_ids:
      - dairy-pefcr-2025
  - rule_id: allocation_dry_matter
    applies_to: "inseparable dairy co-products and shared dairy-processing burdens"
    rule: "When direct assignment is impossible, allocate raw-milk upstream burdens, shared energy, water, chemicals, and wastewater by each dairy output's measured dry-matter mass: allocation factor i = dry-matter fraction i x wet output mass i / sum of that product over all dairy outputs."
    source_ids:
      - dairy-pefcr-2025
  - rule_id: allocation_direct_materials
    applies_to: "product-specific ingredients and packaging"
    rule: "Assign formulation ingredients and packaging directly to the product using batch and bill-of-material records; do not distribute them across unrelated products."
    source_ids:
      - dairy-pefcr-2025
  - rule_id: allocation_losses
    applies_to: "waste and product loss"
    rule: "Assign a loss directly when its originating product or batch is known; otherwise apply the same documented shared-process allocation basis used for the operation that generated it."
    source_ids:
      - ifc-dairy-processing-ehs-2007
      - dairy-pefcr-2025
  - rule_id: allocation_disclosure
    applies_to: "all allocated inventory"
    rule: "Report the allocation level, data period, outputs, wet masses, dry-matter fractions, formula, resulting factors, and any deviation from direct assignment."
    source_ids:
      - dairy-pefcr-2025
