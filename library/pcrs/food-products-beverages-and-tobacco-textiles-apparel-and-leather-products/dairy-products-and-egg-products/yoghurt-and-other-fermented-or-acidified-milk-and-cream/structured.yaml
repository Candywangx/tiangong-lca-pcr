validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "The output flow UUID, Mass property UUID, Units of mass UUID, and normalized amount shall equal the declared reference-flow object and 1 kg net product."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "product identity"
    rule: "Reject a data package missing any required qualifier or failing to distinguish microbial fermentation, direct acidification, combined treatment, and post-fermentation heat treatment."
    source_ids:
      - codex-fermented-milks-243
      - codex-cream-288
      - ecfr-acidified-milk-131-111
  - rule_id: validate_route_inputs
    applies_to: "fermentation or acidification process"
    rule: "A microbial route shall identify culture and dose; a direct-acidification route shall identify acidifying substances and doses; absent route inputs shall not be invented."
    source_ids:
      - codex-fermented-milks-243
      - codex-cream-288
      - ecfr-acidified-milk-131-111
  - rule_id: validate_no_double_count
    applies_to: "utilities, cleaning, and losses"
    rule: "Reject duplicated utility, cleaning, product-loss, wastewater, or packaging quantities across unit-process records and shared facility totals."
    source_ids:
      - dairy-pefcr-2025
  - rule_id: validate_allocation
    applies_to: "multi-product facility data"
    rule: "Reject shared burdens without direct assignment evidence or a disclosed dry-matter allocation calculation whose factors sum to 1 within rounding tolerance."
    source_ids:
      - dairy-pefcr-2025
  - rule_id: validate_mass_balance
    applies_to: "batch and annual foreground inventory"
    rule: "Require a disclosed mass-balance residual; investigate and explain material imbalance rather than forcing the reference output to close."
    source_ids:
      - ifc-dairy-processing-ehs-2007
  - rule_id: validate_wastewater
    applies_to: "sanitation and wastewater"
    rule: "Require wastewater volume and treatment destination; when COD is material or required by the site plan, require representative measured concentration and calculated load."
    source_ids:
      - dairy-pefcr-2025
      - ifc-dairy-processing-ehs-2007
  - rule_id: validate_defaults
    applies_to: "all source-backed defaults"
    rule: "Fail publication-quality completeness if any Dairy PEFCR default remains without explicit justification, uncertainty disclosure, and a replacement plan."
    source_ids:
      - dairy-pefcr-2025
published_dataset_profile:
  dataset_role: "foreground data package for dairy manufacturing, suitable for publication as a secondary or background dataset after review"
  downstream_use: "secondary_dataset; background_dataset; input to process and lifecyclemodel projections"
  allowed_use: "Product-specific factory-gate modelling of fermented or acidified milk and cream; extension to broader life-cycle models through explicit upstream and downstream links"
  excluded_use: "Unqualified comparison between different dairy subcategories; direct use for non-dairy analogues; farm production; undisclosed consumer-stage or cradle-to-grave claims; compliance claims against an expired external PEFCR"
  required_metadata: "PCR id and version state; product designation and required qualifiers; facility geography; technology and route; reference period; boundary; data sources; upstream dataset links; allocation; default use; data quality"
  required_quality_disclosure: "Primary-data share and coverage; meter and sampling coverage; mass-balance residual; allocation factors; default or proxy values; geographic, temporal, and technological representativeness; exclusions and uncertainty"
  update_trigger: "Material formulation or route change; new heat treatment or concentration step; packaging or refrigerant change; facility or supplier change; allocation shift; reference data update; new reviewed category rule; data older than the declared representativeness window"
