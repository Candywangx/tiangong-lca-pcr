  calculation_rules:
    - id: normalize_to_reference_mass
      applies_to: "all inventory rows"
      rule: "normalized amount = attributed foreground amount / released net product mass"
      inputs:
        - "attributed amount"
        - "released net product mass"
      output: "amount per 1 kg released net product"
      source_ids:
        - dairy-pefcr-2025
    - id: calculate_dry_matter_allocation
      applies_to: "shared dairy-processing burdens"
      rule: "factor_i = dry_matter_fraction_i x wet_output_mass_i / sum(dry_matter_fraction_j x wet_output_mass_j); attributed amount_i = shared amount x factor_i"
      inputs:
        - "wet output masses"
        - "dry-matter fractions"
        - "shared amount"
      output: "allocation factor and attributed amount by output"
      source_ids:
        - dairy-pefcr-2025
    - id: calculate_refrigerant_loss
      applies_to: "refrigeration systems"
      rule: "emitted refrigerant = opening charge + additions - closing charge - recovered quantity; negative results require reconciliation and are not accepted"
      inputs:
        - "opening charge"
        - additions
        - "closing charge"
        - "recovered quantity"
      output: "kg refrigerant emitted before allocation"
      source_ids:
        - dairy-pefcr-2025
    - id: calculate_cod_load
      applies_to: "wastewater"
      rule: "COD load = wastewater volume x measured COD concentration with consistent L and mass units"
      inputs:
        - "discharge volume"
        - "COD concentration"
      output: "kg COD before allocation"
      source_ids:
        - dairy-pefcr-2025
        - ifc-dairy-processing-ehs-2007
    - id: reconcile_product_mass
      applies_to: "each batch and annual dataset"
      rule: "inputs = released product + separately recovered product + material waste + wastewater-borne product solids + inventory change, within a disclosed reconciliation tolerance"
      inputs:
        - "input masses"
        - outputs
        - losses
        - "stock change"
      output: "mass-balance residual and relative difference"
      source_ids:
        - ifc-dairy-processing-ehs-2007
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and route"
      requirement: "Identify product designation, species, formulation family, fat and dry-matter content, fermentation culture or acidifier, heat treatments, concentration, packaging status, and storage condition."
