measurement_rules:
  - id: reference_net_mass
    applies_to: "released reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report net released product mass only. Record packaging separately and exclude it from the 1 kg reference amount."
  - id: volume_to_mass
    applies_to: "milk, cream, liquid ingredients, water, and liquid wastes"
    required_property_ref:
      name: "Mass or volume with measured density"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Convert volume to mass only with density measured or verified for the actual material, composition, temperature, and period; retain original volume, density, temperature, and calculation."
  - id: composition_and_concentration
    applies_to: "dairy inputs, intermediate products, final product, and dairy co-products"
    required_property_ref:
      name: "mass fraction on a declared wet- or dry-matter basis"
      uuid: ""
    required_unit: "kg/kg or % by mass"
    rule: "Measure or obtain verified lot-specific values for the composition fields used in identity, mass balance, concentration control, or allocation. Do not infer composition from the generic Milk flow name."
  - id: sweetener_basis
    applies_to: "added sugars and other sweetening matter"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record each sweetener separately from purchase, dosing, or batch records and state whether its content is reported as ingredient mass, solids, or another verified analytical basis."
  - id: energy_carrier_separation
    applies_to: "electricity, fuels, steam, hot water, and cooling"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh, MJ, or another declared unit"
    rule: "Preserve each carrier as a separate exchange and retain conversion factors. Do not combine electricity and thermal energy before linking background datasets."
  - id: water_and_wastewater
    applies_to: "process water, cleaning water, recovered water, and wastewater"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3 or L"
    rule: "Keep source, use, recovery, and discharge measurement points distinct. Use 1 m3 = 1,000 L and do not infer wastewater quantity from product mass without collected records."
process_map:
  - id: receipt_and_preparation
    name: "Dairy-base receipt, identity control, standardization, and formulation"
    inclusion: "required"
    inclusion_condition: "Always include receipt and identity control; include separation, standardization, blending, reconstitution, or formulation when performed"
    role: "Establishes eligible product inputs and prepared mix"
    quantitative_reference: "Per measured kg of prepared dairy mix transferred onward"
  - id: qualifying_treatment
    name: "Concentration or sweetening, heat treatment, and cooling"
    inclusion: "required"
    inclusion_condition: "Include the actual concentration or added-sweetener route that qualifies the product for CPC class 2222; include heat treatment and cooling when performed"
    role: "Produces the declared non-solid CPC 22229 intermediate"
    quantitative_reference: "Per measured kg of treated intermediate"
  - id: filling_and_storage
    name: "Filling or bulk dispatch and factory-gate storage"
    inclusion: "required"
    inclusion_condition: "Always; packaging input is zero only for documented bulk dispatch"
    role: "Produces released reference product"
    quantitative_reference: "Per 1 kg net released product"
  - id: sanitation_and_effluent
    name: "Cleaning, sanitation, and wastewater management"
    inclusion: "required"
    inclusion_condition: "Include all attributable CIP, line cleaning, sanitation, wastewater collection, and on-site treatment"
    role: "Cross-cutting foreground support"
    quantitative_reference: "Per 1 kg net released product after direct assignment or allocation"
