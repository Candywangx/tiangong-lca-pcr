allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "all multi-output and shared operations"
    rule: "First avoid allocation through subdivision, separate metering, batch records, or expansion of the process description; directly assign product-specific ingredients, packaging, energy, losses, and treatment records."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_then_economic
    applies_to: "inseparable co-products and remaining shared burdens"
    rule: "When subdivision cannot resolve a shared burden, use a documented physical relationship reflecting the underlying process causality. If no defensible physical relationship exists, use a documented economic relationship and perform a sensitivity check."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_foreground_factors
    applies_to: "every allocated quantity"
    rule: "Derive quantities, composition, physical parameters, prices, and allocation factors from the same representative foreground period; no category-wide default factor is supplied by this PCR."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_positive_outputs
    applies_to: "dairy co-products and recovered materials"
    rule: "Record co-products as positive outputs with identity, amount, composition, destination, and economic status. Do not use avoided-product substitution unless the declared study method separately requires and documents it."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_reconciliation
    applies_to: "allocated results"
    rule: "Factors for each shared burden must sum to 1 within documented rounding tolerance, and allocated quantities must reconcile to the unallocated total."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_identity_and_mass
      process_id: "receipt_and_preparation"
      flow_role: "dairy base and accepted materials"
      record_type: "receiving, supplier, certificate, scale, tank, and inventory records"
      raw_fields: "product identity; supplier; species; lot; gross/net mass; composition; temperature; rejects; opening/closing inventory"
      collection_method: "calibrated scales or tanks reconciled to supplier and acceptance records"
      unit: "kg; composition unit"
      frequency: "each delivery and lot"
      temporal_coverage: "representative production period"
      site_scope: "all supplying points and receiving tanks"
      aggregation_rule: "accepted input plus inventory change, assigned to represented lots"
      quality_evidence: "calibration; certificates; acceptance log; reconciliation"
    - protocol_id: cp_formulation_records
      process_id: "receipt_and_preparation"
      flow_role: "sweeteners and formulation ingredients"
      record_type: "bill of materials, batch sheet, issue and return records"
      raw_fields: "ingredient identity; lot; issued mass; return; dose; formulation version; produced mass"
      collection_method: "reconcile warehouse issue and batch dosing to released lots"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative production period"
      site_scope: "all formulation lines"
      aggregation_rule: "net issued mass assigned directly to lots"
      quality_evidence: "approved formulation; scale calibration; batch sign-off"
    - protocol_id: cp_mass_and_solids_balance
      process_id: "receipt_and_preparation_qualifying_treatment"
      flow_role: "intermediates, co-products, water removal, and losses"
      record_type: "tank, meter, laboratory, inventory, recovery, and waste records"
      raw_fields: "opening/closing inventory; wet mass; composition; transfers; recovered water; co-products; losses"
      collection_method: "reconcile wet mass and measured composition across each bounded process"
      unit: "kg; kg solids; m3"
