  calculation_rules:
    - id: calc_normalization
      applies_to: "all inventory exchanges"
      rule: "normalized amount = attributed foreground amount / net released reference-product mass"
      inputs:
        - "attributed amount"
        - "net released mass"
      output: "amount per 1 kg net released product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "each bounded process"
      rule: "opening inventory + measured inputs = measured outputs + closing inventory + measured or calculated losses; report unresolved difference separately"
      inputs:
        - "input/output mass"
        - inventory
        - co-products
        - losses
      output: "mass-balance result and unresolved difference"
      source_ids:
        - eu-fdm-bref-2019
    - id: calc_solids_balance
      applies_to: "concentration, formulation, and allocation"
      rule: "apply the same balance structure to measured total solids or dry matter when solids are used for identity, control, or a physical allocation relationship"
      inputs:
        - "wet masses"
        - "measured solids fractions"
        - "ingredient solids"
        - losses
      output: "solids balance and unresolved difference"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_allocation
      applies_to: "residual shared burdens"
      rule: "attributed amount i = shared amount x documented factor i; factors are derived from same-period foreground physical or economic records and sum to 1"
      inputs:
        - "shared total"
        - "output records"
        - "factor basis"
      output: "attributed amount by output"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_refrigerant_loss
      applies_to: "refrigeration systems"
      rule: "emitted refrigerant = opening charge + additions - closing charge - recovered amount; reconcile negative or unexplained results"
      inputs:
        - charge
        - additions
        - "closing charge"
        - recovery
      output: "kg emitted by refrigerant species"
      source_ids:
        - eu-fdm-bref-2019
    - id: calc_direct_water_load
      applies_to: "direct wastewater discharge"
      rule: "discharged substance load = metered discharge volume x representative measured concentration using compatible units"
      inputs:
        - volume
        - concentration
        - conversion
      output: "kg substance emitted"
      source_ids:
        - eu-fdm-bref-2019
  data_quality_requirements:
    - id: dq_scope_identity
      applies_to: "product and reference flow"
      requirement: "Retain all five scope-gate decisions, actual commercial identity, exact product-flow UUID, and manual reviewer evidence whenever the representative Milk flow is replaced or rejected."
      evidence: "classification record; specification; ingredient list; flow metadata; signed review"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one coherent representative period and explain seasonality, shutdowns, abnormal lots, inventory carry-over, and substitutions."
      evidence: "dated meters; production calendar; exception log"
    - id: dq_technological
      applies_to: "process route"
      requirement: "Identify concentration, sweetening, heat-treatment, cooling, filling, storage, cleaning, recovery, and treatment technologies actually represented."
      evidence: "process flow diagram; equipment list; batch and operating records"
    - id: dq_geographical
      applies_to: "inputs and linked datasets"
      requirement: "Match dairy base, ingredients, energy, water, packaging, transport, and treatment datasets to the declared geography or justify every proxy."
      evidence: "supplier origin; dataset metadata; proxy rationale"
    - id: dq_completeness
      applies_to: "mass, solids, energy, water, waste, and emissions"
      requirement: "Reconcile process and facility records, disclose cut-offs and unresolved differences, and treat missing data as gaps rather than zeros."
      evidence: "signed balances; meter/invoice reconciliation; exclusion register"
    - id: dq_measurement
      applies_to: "collected and calculated values"
      requirement: "Retain instrument, calibration, sampling, analytical method, detection limit where relevant, formula, factor version, and responsible record owner."
      evidence: "calibration; laboratory QA; calculation workbook; audit trail"
    - id: dq_no_defaults
      applies_to: "all non-reference quantities"
      requirement: "Use foreground records or calculations from collected records. This PCR supplies no category-wide numerical inventory default or range for CPC 22229."
      evidence: "field-level provenance; collection protocol links; data-gap register"
    - id: dq_allocation
      applies_to: "co-products and shared operations"
      requirement: "Retain subdivision evidence, shared totals, factor basis, output data, calculation, sensitivity when required, and reconciliation."
      evidence: "allocation workbook; production and price records; sensitivity result"
validation_rules:
  - rule_id: validation_scope_path
    applies_to: "product category"
    rule: "Reject automatic applicability unless the product passes scope_gate_1_dairy_identity through scope_gate_5_nec_review and the recorded CPC path is 222 > 2222 > 22229."
    source_ids:
      - unsd-cpc-22229
      - codex-cxs-206-1999
      - codex-cxs-207-1999
  - rule_id: validation_named_exclusions
    applies_to: "classification decision"
    rule: "Reject evaporated milk, condensed milk, all solid-form milk or cream products, processed liquid milk, fresh cream, whey, fermented or acidified products, and non-dairy products from this PCR."
    source_ids:
      - unsd-cpc-22229
      - codex-cxs-206-1999
      - codex-cxs-207-1999
  - rule_id: validation_reference_flow_fit
    applies_to: "reference product identity"
    rule: "Permit Milk 84a8c346-2832-400b-a2a6-421ef7701958 only when the actual qualifying product is milk. For cream or another semantic mismatch, require a replacement flow UUID and manual review; otherwise fail identity completeness."
    source_ids:
      - unsd-cpc-22229
      - codex-cxs-206-1999
  - rule_id: validation_reference_quantity
    applies_to: "reference flow"
    rule: "Require exactly 1 kg net released product using Mass 93a60a56-a3c8-11da-a746-0800200b9a66, unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and kg; packaging mass is separate."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_required_qualifiers
    applies_to: "foreground package metadata"
    rule: "Fail completeness when any required qualifier in Section 3 is missing, ambiguous, or inconsistent with the declared product, scope gate, route, or actual product flow."
    source_ids:
      - unsd-cpc-22229
      - codex-cxs-206-1999
  - rule_id: validation_process_coverage
    applies_to: "foreground inventory"
    rule: "Require all four process-map rows and every applicable material, utility, packaging, cleaning, loss, waste, wastewater, co-product, and direct-emission record; a zero requires evidence and a missing record remains a gap."
    source_ids:
      - eu-fdm-bref-2019
      - eu-pef-2021-2279
  - rule_id: validation_foreground_only
    applies_to: "non-reference quantities"
    rule: "Reject publication-quality completeness when a non-reference amount is an unsupported default, proxy, or reasoned numerical estimate instead of a foreground record or calculation from collected records."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_balances
    applies_to: "mass and solids"
    rule: "Require same-period mass balances and, when used in identity or allocation, solids balances; report and explain unresolved differences and retained inventory."
    source_ids:
      - eu-fdm-bref-2019
      - eu-pef-2021-2279
  - rule_id: validation_allocation
    applies_to: "multi-output and shared operations"
    rule: "Require direct assignment first, a documented physical or economic factor basis for residual burdens, factors summing to 1 within rounding tolerance, reconciliation to shared totals, and sensitivity when economic allocation is used."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_no_double_count
    applies_to: "recovery, wastewater, utilities, and shared totals"
    rule: "Reject duplicate counting between internal transfers and final output, recovered water and purchased water, off-site wastewater treatment and direct water emissions, or assigned process data and residual facility totals."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bref-2019
published_dataset_profile:
  dataset_role: "Foreground factory-gate data package and product dataset for one specifically declared CPC 22229 milk or cream product"
  downstream_use: "May be used as a secondary_dataset or background_dataset after review and linkage to representative upstream dairy, ingredient, energy, material, transport, and treatment datasets; downstream lifecycle stages remain separate"
  allowed_use: "Attributional factory-gate modelling only for a product that passes the five gates and matches the declared milk/cream identity, concentration or sweetening route, composition, physical state, technology, geography, packaging, storage condition, period, and allocation method"
  excluded_use: "Generic representation of all milk and cream n.e.c.; use of the Milk UUID for cream; evaporated or condensed milk; solid, ordinary liquid, fresh-cream, whey, fermented, non-dairy, or unresolved products; comparative claims without equivalent identity, boundary, allocation, and data quality; cradle-to-consumer use without explicit downstream modules"
  required_metadata: "PCR id and version when assigned; all five gate results; actual product-flow UUID; representative-flow fit and reviewer; commercial product identity; species and dairy-base origin; composition and concentration/sweetening basis; route and technology; physical state; packaging; storage condition; facility; period; upstream dataset identities; included processes; allocation; data owner; review status"
  required_quality_disclosure: "Measurement and sampling coverage; mass and solids balances; foreground provenance; allocation factors and sensitivity; temporal, geographical, and technological representativeness; data gaps, proxies, exclusions, uncertainty, unresolved identities, and evidence supporting every zero or non-applicable operation"
  update_trigger: "Change in UNSD CPC scope or sibling structure; CXS dairy-term or powder boundary; Tiangong reference identity; product-flow fit; formulation, concentration, sweetening, heat-treatment, packaging, storage, utility, water, recovery, treatment, allocation, facility, or period; revised EU PEF or FDM method; new reviewed product-specific evidence"
