allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared operations and multiple products"
    rule: "First avoid allocation through process subdivision, route-specific metering, and separate lot records."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_direct_assignment
    applies_to: "Cleaning, treatment, cooling, packaging, and storage"
    rule: "Directly assign measured material, utility, waste, and emission records to the product route that caused them."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_shared_storage
    applies_to: "Shared chilled or ambient storage"
    rule: "Allocate storage electricity and refrigerant loss using occupied capacity multiplied by verified storage time; disclose any alternative causal driver."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_waste_default
    applies_to: "Broken egg, eggshell, sludge, and packaging scrap"
    rule: "Treat the stream as waste at the point generated and include its treatment. If a stream is sold or intentionally produced as a co-product, document the changed status, subdivide where possible, and apply a justified physical or economic allocation consistently."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_no_avoided_burden
    applies_to: "Recycling or valorisation claims"
    rule: "Do not credit avoided products inside the foreground inventory unless the governing study method explicitly requires substitution and the substituted product, quality, and factor are documented."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_receipt_grading_records
      process_id: "egg_receiving_grading"
      flow_role: "received, accepted, broken-egg, and shell-fragment mass"
      record_type: "weighbridge, scale, grader, and rejection log"
      raw_fields: "lot_id; species; supplier; incoming_condition; received_mass; accepted_mass; broken_egg_mass; shell_fragment_mass"
      collection_method: "Calibrated weighing reconciled to lot and grader records"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "representative continuous production period"
      site_scope: "all included receiving lines"
      aggregation_rule: "sum by lot, then normalize to final conforming mass"
      quality_evidence: "calibration records; lot reconciliation; rejection disposition"
    - protocol_id: cp_receiving_electricity
      process_id: "egg_receiving_grading"
      flow_role: "electricity"
      record_type: "submeter or equipment log"
      raw_fields: "meter_start; meter_end; production_time; lot_id"
      collection_method: "Submeter preferred; otherwise rated-load calculation with runtime"
      unit: "kWh"
      frequency: "each shift or lot"
      temporal_coverage: "same period as production mass"
      site_scope: "all included receiving/grading equipment"
      aggregation_rule: "subtract idle baseline and allocate by processed mass"
      quality_evidence: "meter calibration or equipment rating and runtime log"
    - protocol_id: cp_cleaning_material_records
      process_id: "shell_cleaning"
      flow_role: "eggs, water, detergent, sanitiser, and oil"
      record_type: "batch sheet, flow meter, dosing log, and scale"
      raw_fields: "route; egg_mass_in; water_in; chemical_product_mass; active_fraction; oil_mass"
      collection_method: "Meter or weigh each charged material; retain formulation and approval record"
      unit: "kg or m3"
      frequency: "each batch or shift"
      temporal_coverage: "same period as cleaning output"
      site_scope: "each cleaning line"
      aggregation_rule: "sum actual route inputs and normalize to cleaned output"
      quality_evidence: "meter calibration; supplier specification; dosing verification"
    - protocol_id: cp_cleaning_utility_records
      process_id: "shell_cleaning"
      flow_role: "electricity and steam"
      record_type: "utility submeter and steam log"
      raw_fields: "electricity; steam_mass; pressure; temperature; condensate_return"
      collection_method: "Meter utilities and calculate delivered steam energy from recorded state"
      unit: "kWh or MJ"
      frequency: "each shift"
      temporal_coverage: "same period as cleaning output"
      site_scope: "each cleaning line"
      aggregation_rule: "subtract idle use and normalize to cleaned output"
      quality_evidence: "utility invoices; meter calibration; steam-state record"
    - protocol_id: cp_cleaning_output_records
      process_id: "shell_cleaning"
      flow_role: "cleaned eggs, wastewater, sludge, broken eggs, and shell fragments"
      record_type: "scale, effluent meter, filter/sludge log, and rejection log"
      raw_fields: "cleaned_mass; wastewater_volume; sludge_wet_mass; sludge_dry_fraction; broken_egg_mass; shell_mass"
      collection_method: "Measure each output separately and retain treatment destination"
      unit: "kg or m3"
      frequency: "each batch or shift"
      temporal_coverage: "same period as cleaning inputs"
      site_scope: "each cleaning line"
      aggregation_rule: "mass/volume totals normalized to cleaned output"
      quality_evidence: "balance reconciliation; destination ticket; sampling record"
    - protocol_id: cp_treatment_recipe_records
      process_id: "in_shell_treatment"
      flow_role: "eggs and preservation recipe inputs"
      record_type: "treatment batch record and formulation sheet"
      raw_fields: "route; egg_mass_in; chemical_product_mass; active_fraction; oil_mass; recipe_id"
      collection_method: "Weigh each charge and link to the declared treatment route"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "same period as treated output"
      site_scope: "each treatment line"
      aggregation_rule: "sum by route and normalize to treated output"
      quality_evidence: "calibrated scales; approved recipe; lot traceability"
    - protocol_id: cp_treatment_utility_records
      process_id: "in_shell_treatment"
      flow_role: "water, electricity, steam, natural gas, and LPG"
      record_type: "flow meter, submeter, fuel meter, and batch controller"
      raw_fields: "water; electricity; steam_mass; steam_state; natural_gas; lpg; heating_value_basis; route; batch_id"
      collection_method: "Meter each utility and fuel separately"
      unit: "m3, kWh, MJ, or fuel purchase unit"
      frequency: "each batch or shift"
      temporal_coverage: "same period as treated output"
      site_scope: "each treatment line and heat source"
      aggregation_rule: "convert consistently and normalize by route output"
      quality_evidence: "meter calibration; invoice reconciliation; controller record"
    - protocol_id: cp_treatment_output_records
      process_id: "in_shell_treatment"
      flow_role: "treated eggs, wastewater, sludge, broken eggs, and shell fragments"
      record_type: "scale, effluent meter, sludge log, and rejection log"
      raw_fields: "treated_mass; wastewater_volume; sludge_wet_mass; sludge_dry_fraction; broken_egg_mass; shell_mass"
      collection_method: "Measure outputs separately and record destination"
      unit: "kg or m3"
      frequency: "each batch"
      temporal_coverage: "same period as treatment inputs"
      site_scope: "each treatment line"
      aggregation_rule: "sum by route and normalize to treated output"
      quality_evidence: "mass balance; treatment record; destination ticket"
    - protocol_id: cp_direct_combustion_emissions
      process_id: "in_shell_treatment"
      flow_role: "direct combustion emissions"
      record_type: "stack test or fuel-factor calculation"
      raw_fields: "fuel_type; fuel_quantity; heating_value_basis; emission_factor; factor_source; measured_concentration; flue_gas_volume"
      collection_method: "Prefer representative stack measurement; otherwise use documented fuel-specific factors"
      unit: "kg"
      frequency: "test campaign plus each production period"
      temporal_coverage: "representative operating states"
      site_scope: "each onsite combustor"
      aggregation_rule: "calculate each pollutant separately and normalize to treatment output"
      quality_evidence: "stack report or factor source; fuel-meter reconciliation"
    - protocol_id: cp_cooling_records
      process_id: "post_treatment_cooling"
      flow_role: "eggs, water, electricity, wastewater, and outlet temperature"
      record_type: "batch log, flow meter, submeter, and temperature recorder"
      raw_fields: "egg_mass_in; egg_mass_out; water_in; wastewater_out; electricity; inlet_temperature; outlet_temperature; time"
      collection_method: "Meter utilities and masses; continuously record critical time-temperature values"
      unit: "kg, m3, kWh, °C, and time"
      frequency: "each batch"
      temporal_coverage: "all cooling batches in reporting period"
      site_scope: "each cooling system"
      aggregation_rule: "normalize to cooled output"
      quality_evidence: "calibrated temperature recorder; meter calibration; batch release record"
    - protocol_id: cp_cooling_refrigerant_balance
      process_id: "post_treatment_cooling"
      flow_role: "refrigerant make-up and release"
      record_type: "refrigerant inventory and service log"
      raw_fields: "refrigerant_identity; opening_charge; additions; recoveries; closing_charge; equipment_id; allocation_basis"
      collection_method: "Annual or campaign mass balance by named refrigerant and equipment"
      unit: "kg"
      frequency: "each service event and reporting period"
      temporal_coverage: "full reporting period"
      site_scope: "cooling equipment only"
      aggregation_rule: "loss = opening + additions - recoveries - closing; allocate by causal equipment use"
      quality_evidence: "service invoices; recovery records; charge verification"
    - protocol_id: cp_packaging_material_records
      process_id: "packing_and_storage"
      flow_role: "each packaging component"
      record_type: "purchase, issue, bill-of-material, and supplier mass record"
      raw_fields: "component_identity; count; unit_mass; issued_mass; returned_mass; scrap_mass"
      collection_method: "Weigh or count each component separately and reconcile to inventory"
      unit: "kg"
      frequency: "each lot or shift"
      temporal_coverage: "same period as final product"
      site_scope: "all included packing lines"
      aggregation_rule: "incorporated mass = issued - returned - scrap"
      quality_evidence: "supplier specification; stock reconciliation; scale calibration"
    - protocol_id: cp_packing_energy_records
      process_id: "packing_and_storage"
      flow_role: "packing electricity"
      record_type: "submeter or equipment log"
      raw_fields: "meter_start; meter_end; runtime; product_mass"
      collection_method: "Submeter preferred; otherwise rated-load calculation"
      unit: "kWh"
      frequency: "each shift"
      temporal_coverage: "same period as packed output"
      site_scope: "included packing equipment"
      aggregation_rule: "subtract idle baseline and normalize to packed output"
      quality_evidence: "meter calibration or equipment rating and runtime"
    - protocol_id: cp_storage_energy_records
      process_id: "packing_and_storage"
      flow_role: "storage electricity"
      record_type: "room submeter and occupancy log"
      raw_fields: "electricity; storage_time; occupied_capacity; product_mass; room_id"
      collection_method: "Meter each storage room and record product occupancy-time"
      unit: "kWh and kg·h"
      frequency: "daily or shift"
      temporal_coverage: "full declared storage period"
      site_scope: "all included storage rooms"
      aggregation_rule: "allocate by occupied capacity × verified time"
      quality_evidence: "submeter calibration; inventory timestamps; room log"
    - protocol_id: cp_storage_refrigerant_balance
      process_id: "packing_and_storage"
      flow_role: "refrigerant make-up and release"
      record_type: "refrigerant inventory and service log"
      raw_fields: "refrigerant_identity; opening_charge; additions; recoveries; closing_charge; equipment_id; allocation_basis"
      collection_method: "Annual or campaign mass balance by named refrigerant and equipment"
      unit: "kg"
      frequency: "each service event and reporting period"
      temporal_coverage: "full reporting period"
      site_scope: "storage refrigeration only"
      aggregation_rule: "loss = opening + additions - recoveries - closing; allocate by occupied capacity-time"
      quality_evidence: "service invoices; recovery records; charge verification"
    - protocol_id: cp_packing_output_records
      process_id: "packing_and_storage"
      flow_role: "final product, packaging scrap, broken eggs, and shell fragments"
      record_type: "checkweigher, scrap scale, rejection log, and dispatch record"
      raw_fields: "product_mass; package_mass; each_scrap_mass; broken_egg_mass; shell_mass; dispatch_time"
      collection_method: "Measure every output stream separately and reconcile to packed input"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "same period as packing inputs"
      site_scope: "all included packing lines and storage rooms"
      aggregation_rule: "normalize to final marketable product mass"
      quality_evidence: "scale calibration; dispatch record; waste destination ticket"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory exchanges"
      rule: "normalized exchange = period exchange ÷ net kg of conforming reference product"
      inputs:
        - "exchange record"
        - "final product mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - iso-14044-2006
    - id: calc_count_mass
      applies_to: "Egg-count records"
      rule: "lot egg mass = measured sample or total lot net mass; use count only to reconcile, not as a generic mass factor"
      inputs:
        - count
        - "measured lot mass"
      output: "kg eggs"
      source_ids: []
    - id: calc_active_chemical
      applies_to: "Sodium hydroxide, sodium hypochlorite, sodium silicate, and other formulated chemicals"
      rule: "active mass = commercial product mass × supplier-declared active fraction; retain both commercial and active mass"
      inputs:
        - "product mass"
        - "active fraction"
      output: "kg active substance and kg commercial product"
      source_ids: []
    - id: calc_steam_energy
      applies_to: "Steam inputs"
      rule: "delivered heat = steam mass × difference between inlet steam enthalpy and returned condensate enthalpy; document state assumptions"
      inputs:
        - "steam mass"
        - pressure
        - temperature
        - "condensate state"
      output: "MJ delivered steam energy"
      source_ids: []
    - id: calc_storage_allocation
      applies_to: "Shared storage electricity and refrigerant loss"
      rule: "product share = product occupied capacity-time ÷ total occupied capacity-time"
      inputs:
        - "product mass or pallet positions"
        - "entry/exit time"
        - "room total"
      output: "allocated kWh or kg refrigerant loss"
      source_ids:
        - iso-14044-2006
    - id: calc_refrigerant_loss
      applies_to: "Each named refrigerant"
      rule: "loss = opening charge + additions - recovered amount - closing charge; report each refrigerant separately"
      inputs:
        - "charge and service records"
      output: "kg named refrigerant to air"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "Each process"
      rule: "closure = inputs - separately measured product outputs - waste outputs - retained or evaporated mass; investigate material unexplained residuals"
      inputs:
        - "all mass inputs and outputs"
      output: "balance closure and explanation"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and treatment route"
      requirement: "Preserve lot identity from incoming shell eggs through final product and declare species, route, shell condition, grade, and storage condition."
      evidence: "lot genealogy; batch and dispatch records"
    - id: dq_temporal
      applies_to: "Foreground records"
      requirement: "Cover representative production including start-up, normal operation, cleaning, changeover, and shutdown where they materially affect the route."
      evidence: "dated meters, batch records, and production schedule"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Reconcile all named material, utility, packaging, waste, refrigerant, and direct-emission records; do not hide an unmeasured item in an aggregated placeholder."
      evidence: "completeness checklist and process mass/energy reconciliation"
    - id: dq_treatment_validation
      applies_to: "Cooking, pasteurization, or preservation"
      requirement: "Retain the validated route specification, critical limits, monitoring results, deviations, corrective actions, and product-release decision."
      evidence: "approved validation study and batch controller records"
    - id: dq_measurement
      applies_to: "Scales, meters, and temperature recorders"
      requirement: "Use calibrated equipment suitable for the operating range and retain calibration status for the reporting period."
      evidence: "calibration certificates and verification checks"
    - id: dq_waste_destination
      applies_to: "Wastewater, sludge, eggshell, broken egg, and packaging scrap"
      requirement: "Identify each receiving treatment or recovery route and record wet/dry basis where relevant."
      evidence: "manifests, invoices, treatment contract, or onsite log"
    - id: dq_refrigerant
      applies_to: "Cooling and storage"
      requirement: "Identify the actual refrigerant by chemical or commercial blend and keep service-event mass balance; do not report a generic refrigerant."
      evidence: "equipment register, service log, purchase and recovery records"
    - id: dq_source_currency
      applies_to: "External method evidence"
      requirement: "Use the identified edition or DOI and disclose any jurisdictional departure from Codex cleaning or storage guidance."
      evidence: "source register and deviation note"
validation_rules:
  - rule_id: validate_scope
    applies_to: "Product identity"
    rule: "Fail if the final product is fresh untreated, not in shell, or peeled before the reference-flow gate."
    source_ids:
      - unsd-cpc-22300
  - rule_id: validate_reference_mass
    applies_to: "Reference flow"
    rule: "Confirm exactly 1 kg net marketable egg mass excluding packaging and verify count-to-mass conversion from lot records."
    source_ids: []
  - rule_id: validate_process_route
    applies_to: "Process map"
    rule: "Require receiving/grading, one declared in-shell treatment route, packaging/storage, and each conditionally applicable cleaning or cooling process."
    source_ids:
      - codex-cxc-15-1976
      - shenga-et-al-2010-in-shell-pasteurization
  - rule_id: validate_atomic_exchange
    applies_to: "Inventory rows"
    rule: "Reject any combined utility, fuel, chemical, packaging, waste, refrigerant, or emission row; every selected flow must be one resolvable exchange."
    source_ids: []
  - rule_id: validate_treatment
    applies_to: "Treatment batch"
    rule: "Confirm that monitored route conditions meet the approved cooking, pasteurization, or preservation specification and that deviations are excluded or corrected."
    source_ids:
      - codex-cxc-15-1976
      - shenga-et-al-2010-in-shell-pasteurization
  - rule_id: validate_mass_balance
    applies_to: "Each process"
    rule: "Check measured inputs against product, waste, retained, and released outputs and require an explanation for material imbalance."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_waste_emissions
    applies_to: "Foreground outputs"
    rule: "Confirm separate records and destinations for wastewater, sludge, broken egg, eggshell, packaging scrap, each refrigerant release, and each direct combustion emission that applies."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_bilingual_rows
    applies_to: "English and Chinese PCR"
    rule: "Confirm identical ordered process ids, row ids, directions, flow types, controlled values, and source ids; confirm that every non-UUID Chinese selected-flow name is an accurate translation."
    source_ids: []
  - rule_id: validate_range_evidence
    applies_to: "Quantitative ranges"
    rule: "Do not add an empirical range unless at least two independent original sources are boundary-, unit-, product-state-, and normalization-compatible, or an authoritative source explicitly prescribes an interval."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground processing dataset for preserved or cooked eggs retaining their shell"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product carbon footprint, LCA, supply-chain modelling, facility improvement, and route comparison when product qualifiers and system boundary match"
  excluded_use: "Fresh eggs, eggs not in shell, peeled cooked eggs, farm egg production, consumer cooking, or another treatment route without route-specific foreground data"
  required_metadata: "PCR id and version; species; supplier geography; incoming condition; route and route share; cleaning route; treatment validation basis; package components; storage condition and duration; allocation method; reference year; facility geography"
  required_quality_disclosure: "Meter coverage; calculated-versus-measured shares; unresolved Tiangong identities; mass-balance closure; treatment deviations; waste destinations; refrigerant identity and balance; source editions; data gaps"
  update_trigger: "Material change in species mix, treatment technology or recipe, energy source, cleaning permission or practice, package format, refrigeration system, storage duration, allocation, supplier geography, or validated safety target"
data_sources:
  - id: "unsd-cpc-22300"
    type: "official_guidance"
    reference: "United Nations Statistics Division. Central Product Classification detail, code 22300, “Eggs, in shell, preserved or cooked.” https://unstats.un.org/unsd/classifications/Econ/Detail/EN/1074/22300 (retrieved 2026-08-24)."
    used_for: "Category inclusion and exclusions; facility-gate product identity"
  - id: "codex-cxc-15-1976"
    type: "official_guidance"
    reference: "Codex Alimentarius. Code of Hygienic Practice for Eggs and Egg Products, CXC 15-1976. https://workspace.fao.org/sites/codex/Standards/CXC%2015-1976/CXC_015e.pdf (retrieved 2026-08-24)."
    used_for: "Receiving, sorting, grading, dry cleaning, washing, disinfection, drying, oiling, in-shell treatment, packaging, storage, segregation, and validation rules"
  - id: "shenga-et-al-2010-in-shell-pasteurization"
    type: "literature"
    reference: "Shenga, E.; Singh, R. P.; Yadav, A. S. Effect of pasteurization of shell egg on its quality characteristics under ambient storage. Journal of Food Science and Technology 47, 420–425. https://doi.org/10.1007/s13197-010-0069-2."
    used_for: "Intact-shell dry, moist-heat, and microwave pasteurization route evidence; treatment-condition and product-quality monitoring"
  - id: "chiozzi-et-al-2022-thermal-nonthermal"
    type: "literature"
    reference: "Chiozzi, V.; Agriopoulou, S.; Varzakas, T. Advances, Applications, and Comparison of Thermal (Pasteurization, Sterilization, and Aseptic Packaging) against Non-Thermal (Ultrasounds, UV Radiation, Ozonation, High Hydrostatic Pressure) Technologies in Food Processing. Applied Sciences 12(4), 2202. https://doi.org/10.3390/app12042202."
    used_for: "General thermal/non-thermal treatment classification and the need to collect treatment energy and water records; no egg-specific quantitative range"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006. Environmental management — Life cycle assessment — Requirements and guidelines. https://www.iso.org/standard/38498.html (confirmed current in 2022; retrieved 2026-08-24)."
    used_for: "Boundary consistency, subdivision, allocation hierarchy, inventory completeness, and mass-balance validation"
