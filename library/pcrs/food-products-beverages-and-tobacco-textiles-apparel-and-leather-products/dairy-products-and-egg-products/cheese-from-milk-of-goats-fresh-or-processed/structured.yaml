      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Express the reference amount as net saleable cheese mass. Exclude packaging. For cheese marketed in brine, declare and consistently apply either drained-cheese mass or cheese-plus-free-brine mass; do not combine the conventions."
  - id: goat_origin_mass
    applies_to: "all dairy inputs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record mass and animal origin by received lot. Dairy input from any non-goat species makes the dataset non-conforming to this PCR and requires reclassification."
  - id: ingredient_mass_basis
    applies_to: "salt, cultures, coagulants, emulsifying salts, additives, and characterizing ingredients"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record actual batch additions and identify whether each amount is as-purchased product mass, active constituent mass, solution mass, or dry-solids mass. Do not infer a recipe from a Codex permission or product-quality limit."
