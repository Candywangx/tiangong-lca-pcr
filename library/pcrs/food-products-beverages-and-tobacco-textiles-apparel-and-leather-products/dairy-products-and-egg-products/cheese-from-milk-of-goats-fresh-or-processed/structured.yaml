allocation_rules:
  - rule_id: allocation_subdivide_routes
    applies_to: "fresh, ripened, and processed product routes"
    rule: "Subdivide by product state, line, batch, and separately metered operation before allocating shared burdens. Do not average fresh, ripened, and processed routes unless the reporting dataset explicitly represents that production mix."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_direct_measurement
    applies_to: "directly attributable inputs and outputs"
    rule: "Assign goat milk, same-category cheese inputs, ingredients, brine, packaging, product losses, and route-specific utilities directly from batch or line records wherever possible."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019
  - rule_id: allocation_dairy_outputs
    applies_to: "whey, cream, and other useful dairy outputs"
    rule: "Classify each output from its documented destination. If it is a co-product, apply the hierarchy required by the governing study method after subdivision and disclose the selected physical, economic, or other causal relation with site-period data. If it is waste, assign treatment without co-product credit."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_services
    applies_to: "shared refrigeration, steam, water, sanitation, and effluent systems"
    rule: "Use submetered or engineering-causal allocation based on the service driver supported by facility records. If neither is available, disclose the fallback basis and test its influence; do not prescribe a universal mass or economic factor."
    source_ids:
      - eu-pef-2021-2279
      - eu-fdm-bat-2019
  - rule_id: allocation_no_species_blending
    applies_to: "mixed-species dairy inputs"
    rule: "Allocation cannot convert a mixed-species product into goat-milk cheese. Any non-goat dairy constituent makes this PCR inapplicable and requires reclassification."
    source_ids:
      - unsd-cpc-3-22254
      - codex-cxs-206-1999
  - rule_id: allocation_brine_and_packaging
    applies_to: "brine and packaging"
    rule: "Keep packaging outside the reference mass. Assign brine production and loss according to measured use and the declared drained-cheese or cheese-plus-free-brine convention, without double counting retained brine."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_dairy_material_lots
      process_id: "goat_milk_intake_and_preparation_curd_formation_and_drainage_route_specific_finishing"
      flow_role: "dairy material receipt and transfer"
      record_type: "supplier declaration, intake ticket, batch sheet, tank or scale record"
      raw_fields: "lot id; supplier; animal species; material identity; mass; composition or solids basis used; acceptance; source and destination; timestamp"
      collection_method: "calibrated tank, weighbridge, or scale plus lot reconciliation"
      unit: "kg"
      frequency: "each receipt and batch transfer"
      temporal_coverage: "all included lots in the reporting period"
      site_scope: "reporting dairy and included lines"
      aggregation_rule: "sum like-for-like material records, reconcile stock change, then normalize to released reference product"
      quality_evidence: "calibration records, supplier animal-origin declaration, batch genealogy, and reconciliation sign-off"
    - protocol_id: cp_process_utilities
      process_id: "all_production_processes"
      flow_role: "water, electricity, heat, refrigeration, and other utilities"
      record_type: "meters, submeters, invoices, fuel and refrigerant stock records"
      raw_fields: "meter id; carrier; opening and closing reading; purchase; stock change; process or line; operating time; allocation driver"
      collection_method: "calibrated meter where available; otherwise documented engineering allocation from facility totals"
      unit: "carrier-specific unit"
      frequency: "continuous, batch, shift, or invoice period"
      temporal_coverage: "representative period covering included production"
      site_scope: "reporting dairy and identified utility systems"
      aggregation_rule: "calculate net carrier use by period, subtract excluded uses, allocate causally, and normalize to released product"
      quality_evidence: "meter calibration, invoice reconciliation, allocation worksheet, and coverage statement"
    - protocol_id: cp_ingredients_and_additives
      process_id: "curd_formation_and_drainage_route_specific_finishing"
      flow_role: "cultures, coagulants, salt, brine, additives, and characterizing ingredients"
      record_type: "formulation, batch issue, dosing, stock, and brine-control records"
      raw_fields: "material id; supplier; lot; animal origin for dairy-derived inputs; issued mass or volume; concentration; density; active or solution basis; return; batch id"
      collection_method: "calibrated dosing system, scale, volume meter, and stock reconciliation"
      unit: "kg or m3"
      frequency: "each batch and replenishment"
      temporal_coverage: "all included lots"
      site_scope: "reporting dairy and included lines"
      aggregation_rule: "sum net additions by material and declared basis; convert only with recorded concentration or density"
      quality_evidence: "formulation approval, calibration, lot traceability, and stock reconciliation"
    - protocol_id: cp_byproduct_and_waste
      process_id: "all_production_processes"
      flow_role: "co-products, rejects, cheese losses, spent brine, and solid waste"
      record_type: "scale, tank, waste manifest, transfer, sales, and destination records"
      raw_fields: "output identity; mass or volume; moisture or solids basis where used; destination; classification as product or waste; timestamp; batch or period"
      collection_method: "measured transfer or calibrated container and inventory reconciliation"
      unit: "kg or m3"
      frequency: "each transfer or batch; at least each reporting period"
      temporal_coverage: "all included production and sanitation periods"
      site_scope: "reporting dairy and each destination route"
      aggregation_rule: "aggregate separately by material identity and destination, reconcile stock change, and normalize to released product"
      quality_evidence: "scale or meter calibration, transfer documents, destination evidence, and mass-balance review"
    - protocol_id: cp_finished_product_release
      process_id: "route_specific_finishing_packaging_cold_storage_dispatch"
      flow_role: "finished and saleable goat cheese"
      record_type: "batch, packing, warehouse, and release records"
      raw_fields: "product id; product state; goat-origin confirmation; batch; net mass; brine convention; ingredients; physical form; package configuration; storage duration; release status"
      collection_method: "calibrated checkweigher, scale, or tank plus warehouse reconciliation"
      unit: "kg"
      frequency: "each finishing and packing lot"
      temporal_coverage: "all released lots in reporting period"
      site_scope: "reporting dairy"
      aggregation_rule: "sum released net mass using one declared brine convention and exclude packaging mass"
      quality_evidence: "scale calibration, label or specification, release certificate, and batch genealogy"
    - protocol_id: cp_packaging_bom
      process_id: "packaging_cold_storage_dispatch"
      flow_role: "packaging materials"
      record_type: "packaging bill of materials, issue, return, and scrap records"
      raw_fields: "component id; material; unit mass; units issued; returns; scrap; packed product id; lot"
      collection_method: "verified component weights and material issue reconciliation"
      unit: "kg"
      frequency: "each package configuration and reporting period"
      temporal_coverage: "all included packing lots"
      site_scope: "reporting dairy and packing lines"
      aggregation_rule: "net component mass equals issued minus returned and separately recorded scrap; normalize to net released cheese"
      quality_evidence: "supplier specification, sampled component weights, issue records, and reconciliation"
    - protocol_id: cp_refrigerant_balance
      process_id: "packaging_cold_storage_dispatch"
      flow_role: "refrigerant input and emission"
      record_type: "equipment register, service log, purchase, recovery, and stock records"
      raw_fields: "equipment id; refrigerant identity; charge; additions; recovered mass; opening and closing stock; service date; operating scope"
      collection_method: "installation-specific refrigerant mass balance"
      unit: "kg"
      frequency: "each service event and annual or reporting-period reconciliation"
      temporal_coverage: "period aligned with included cheese production"
      site_scope: "refrigeration equipment serving included operations"
      aggregation_rule: "additions plus opening stock minus recovery, transfers, and closing stock; allocate only equipment serving the included scope"
      quality_evidence: "technician records, invoices, recovery documentation, and equipment register"
    - protocol_id: cp_sanitation_records
      process_id: "sanitation_and_effluent"
      flow_role: "cleaning water, chemicals, and energy"
      record_type: "cleaning-in-place cycle log, dosing, meter, and stock records"
      raw_fields: "circuit; cycle; water volume; chemical identity and concentration; dose; temperature; duration; energy carrier; linked production line"
      collection_method: "automated cycle log and calibrated meters or documented stock reconciliation"
      unit: "kg, m3, kWh, or MJ"
      frequency: "each cleaning cycle"
      temporal_coverage: "all cycles serving included production"
      site_scope: "reporting dairy and included sanitation circuits"
      aggregation_rule: "aggregate by circuit and input, exclude unrelated production, then allocate by documented causal service"
      quality_evidence: "cycle completion log, dosing calibration, meter calibration, and sanitation schedule"
    - protocol_id: cp_effluent_and_residuals
      process_id: "sanitation_and_effluent"
      flow_role: "wastewater, direct water emissions, and treatment residuals"
      record_type: "flow meter, sampling, laboratory, sludge, and transfer records"
      raw_fields: "outfall or route; volume; sample time; pollutant; concentration; analytical method; non-detect rule; residual mass; destination"
      collection_method: "calibrated flow measurement and representative sampling under applicable facility controls"
      unit: "m3, concentration unit, or kg"
      frequency: "continuous flow where available and scheduled sampling or each transfer"
      temporal_coverage: "period aligned with included production and representative operating conditions"
      site_scope: "reporting dairy, each outfall, and each treatment route"
      aggregation_rule: "calculate pollutant mass from matched flow and concentration; aggregate residuals by route; normalize to released product"
      quality_evidence: "meter calibration, chain of custody, laboratory quality control, sampling plan, and treatment records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground amounts"
      rule: "normalized amount = included process amount / released net cheese mass under the declared brine convention"
      inputs:
        - "applicable collection protocol"
        - cp_finished_product_release
      output: "flow amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_material_balance
      applies_to: "each batch and reporting period"
      rule: "reconcile opening inventory + receipts with transfers + released product + co-products + wastes + closing inventory; investigate material residuals rather than assigning them silently"
      inputs:
        - cp_dairy_material_lots
        - cp_ingredients_and_additives
        - cp_byproduct_and_waste
        - cp_finished_product_release
      output: "documented material-balance reconciliation"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_brine_basis
      applies_to: "brined products"
      rule: "calculate retained and spent brine separately from make-up and replenishment records; map retained brine to the reference mass only according to the declared mass convention"
      inputs:
        - cp_ingredients_and_additives
        - cp_finished_product_release
        - cp_byproduct_and_waste
      output: "brine input, retained amount, and spent-brine output without double counting"
      source_ids: []
    - id: calc_packaging_mass
      applies_to: "packaging"
      rule: "component mass = verified unit mass × net units consumed; sum by material and exclude all packaging from reference cheese mass"
      inputs:
        - cp_packaging_bom
        - cp_finished_product_release
      output: "kg packaging material per 1 kg reference product"
      source_ids: []
    - id: calc_refrigerant_emission
      applies_to: "refrigeration equipment"
      rule: "direct emission = opening refrigerant stock + purchases + additions received - closing stock - recovered or transferred refrigerant, restricted to included equipment and reconciled periods"
      inputs:
        - cp_refrigerant_balance
        - cp_finished_product_release
      output: "kg refrigerant emitted per 1 kg reference product"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_water_pollutant_mass
      applies_to: "direct discharge after on-site treatment"
      rule: "pollutant mass = matched discharged-water volume × representative measured concentration, applying the documented unit conversion and non-detect rule"
      inputs:
        - cp_effluent_and_residuals
        - cp_finished_product_release
      output: "kg pollutant per 1 kg reference product"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_observed_envelope
      applies_to: "site-specific QA ranges"
      rule: "lower and upper bounds are the minimum and maximum normalized observations from comparable included batches or periods after data-quality screening; report sample count and coverage"
      inputs:
        - "applicable collection protocol"
        - cp_finished_product_release
      output: "site-specific observed QA envelope, not a cross-site default"
      source_ids: []
  data_quality_requirements:
    - id: dq_goat_origin
      applies_to: "all dairy materials"
      requirement: "Animal species shall be traceable to each material lot; missing evidence or any non-goat dairy constituent makes the dataset non-conforming."
      evidence: "supplier declarations, specifications, labels, receiving records, and batch genealogy"
    - id: dq_product_state
      applies_to: "reference product and route"
      requirement: "The fresh or unripened, ripened, or processed state shall match the recorded operations, ingredients, ripening duration where applicable, and release specification."
      evidence: "product specification, batch route, ingredient issue, and release records"
    - id: dq_brine_mass_basis
      applies_to: "brined product"
      requirement: "The record shall identify brine make-up, retained brine, spent brine, and whether the reference mass is drained cheese or cheese plus free brine."
      evidence: "brine logs, concentration or density records, fill records, net-mass test, and calculation worksheet"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Coverage shall include all modelled lots and all relevant shifts, cleaning cycles, storage periods, utility systems, co-products, wastes, and direct releases, with gaps quantified and justified."
      evidence: "coverage matrix, meter and invoice reconciliation, production totals, and gap log"
    - id: dq_measurement
      applies_to: "measured and calculated values"
      requirement: "Measurement devices, conversions, allocation drivers, sampling methods, and laboratory results shall have current quality evidence appropriate to the reporting period."
      evidence: "calibration, method, chain-of-custody, laboratory QC, and calculation review records"
    - id: dq_temporal_geographic_technology
      applies_to: "representativeness"
      requirement: "The reporting period, facility geography, production technology, product state, package configuration, and cold-storage conditions shall represent the dataset claim."
      evidence: "production schedule, facility description, route declaration, and representativeness assessment"
    - id: dq_external_datasets
      applies_to: "upstream and treatment links"
      requirement: "Dataset identity, geography, technology, time, allocation, and substitution choices shall be disclosed; goat-milk datasets shall not be substituted with sheep- or generic mixed-milk data without an explicit non-conformance statement and reclassification."
      evidence: "dataset metadata and selection rationale"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm UUID e321b953-83b8-4428-9cce-3ac3aee6aae3, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg, with no dataset version stored."
    source_ids: []
  - rule_id: validate_goat_only
    applies_to: "all dairy inputs"
    rule: "Fail validation if animal origin is absent, if sheep or another non-goat dairy constituent occurs, or if a mixed-species product is represented without reclassification."
    source_ids:
      - unsd-cpc-3-22254
      - codex-cxs-206-1999
  - rule_id: validate_state_route
    applies_to: "product state and process map"
    rule: "Require exactly one declared product state and verify that the included process records support that fresh or unripened, ripened, or processed route."
    source_ids:
      - codex-cxs-283-1978
      - codex-cxs-221-2001
  - rule_id: validate_brine_ingredients_packaging
    applies_to: "reference qualifiers"
    rule: "Require the brine state and mass convention, characterizing ingredients and additives, and packaging state; reject packaging included in reference cheese mass or inconsistent drained and free-brine mass bases."
    source_ids:
      - codex-cxs-206-1999
      - codex-cxs-283-1978
      - codex-cxs-221-2001
  - rule_id: validate_no_standard_as_lci
    applies_to: "all quantities"
    rule: "Confirm that Codex product-quality or compositional provisions and EU BAT performance information were not copied as site yield, energy, water, recipe, salt, emission, or waste quantities. Values without direct quantitative evidence shall come from identified site or batch records."
    source_ids:
      - codex-cxs-283-1978
      - codex-cxs-221-2001
      - eu-fdm-bat-2019
  - rule_id: validate_mass_reconciliation
    applies_to: "material flows"
    rule: "Reconcile dairy inputs, ingredients, brine, reference product, co-products, wastes, and inventory changes for each applicable batch and reporting period; investigate unexplained residuals."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validate_allocation
    applies_to: "multifunctional and shared processes"
    rule: "Verify subdivision was attempted first, the selected allocation driver is supported by site-period evidence, and co-product or waste classification matches documented destination."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_temporal_coverage
    applies_to: "foreground data"
    rule: "Verify that utilities, sanitation, storage, effluent, product, co-product, and waste records cover the same included production period or have a documented reconciliation."
    source_ids:
      - eu-fdm-bat-2019
      - eu-pef-2021-2279
  - rule_id: validate_observed_ranges
    applies_to: "QA envelopes"
    rule: "Confirm every non-numeric observed range was calculated only from comparable site or batch records and includes sample count, period, product state, and route; do not use it as a cross-site allowed range or default."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process foreground dataset suitable, after review, for publication as a secondary_dataset or background_dataset"
  downstream_use: "process and lifecyclemodel construction for goat-milk cheese with matching state, route, brine convention, formulation, packaging, geography, technology, and gate"
  allowed_use: "Factory-gate datasets for exclusively goat-derived fresh or unripened, ripened, or processed cheese when all required qualifiers and foreground records are present"
  excluded_use: "Sheep-milk cheese; cattle-, buffalo-, other-animal-, or mixed-species cheese; non-dairy analogues; unverified animal origin; a different brine mass convention; a route or package state not represented by the data"
  required_metadata: "canonical PCR id; reference UUIDs; product state; cheese type and physical form; exclusive goat-origin evidence; preparation and heat-treatment route; brine state and mass convention; ingredients and additives; packaging; geography; technology; lot and reporting period; gate; upstream datasets; allocation; cut-offs"
  required_quality_disclosure: "protocol coverage; measured versus calculated values; observed-range sample counts; calibration and laboratory evidence; mass-balance residuals; meter and invoice reconciliation; missing data; allocation sensitivity; dataset representativeness and uncertainty"
  update_trigger: "Change in animal origin, product state, formulation, brining, ripening or processing route, package configuration, facility technology, utility or treatment system, allocation, upstream datasets, reference-mass convention, or material data-quality coverage"
