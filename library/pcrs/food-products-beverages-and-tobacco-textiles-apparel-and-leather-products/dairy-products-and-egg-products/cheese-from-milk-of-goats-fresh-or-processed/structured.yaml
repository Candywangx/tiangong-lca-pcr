    applies_to: "process water, formulated brine, retained brine, and spent brine"
    required_property_ref:
      name: "Volume or Mass"
      uuid: ""
    required_unit: "m3 or kg"
    rule: "Keep process water, brine make-up, brine retained in the declared product, and spent brine as separate records. Record salt concentration and density when converting between mass and volume."
  - id: energy_carrier_separation
    applies_to: "electricity, fuels, steam, hot water, and refrigeration"
    required_property_ref:
      name: "Energy or Mass"
      uuid: ""
    required_unit: "kWh, MJ, or carrier-specific unit"
    rule: "Preserve metered units and energy-carrier identity. Convert only with a documented factor and do not apply an industry-average energy intensity as a site value."
  - id: packaging_mass_separation
    applies_to: "primary, secondary, and transport packaging"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record packaging by material and component, normalized to 1 kg net cheese. Packaging mass is not part of the reference product mass."
  - id: lot_normalization
    applies_to: "all foreground flows"
    required_property_ref:
