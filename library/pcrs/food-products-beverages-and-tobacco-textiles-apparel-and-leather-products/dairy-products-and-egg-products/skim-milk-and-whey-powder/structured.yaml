system_boundary:
  rules:
    - rule_id: boundary_required_stages
      applies_to: "foreground_powder_manufacturing"
      rule: "Include feed receipt and conditioning, concentration, drying and powder finishing, containment or packaging, cleaning, and foreground waste or emission treatment when operated by or for the reporting site."
      source_ids:
        - eda-dairy-pefcr-2025
        - eu-fdm-bat-2019
    - rule_id: boundary_upstream_feed
      applies_to: "supplied_liquid_dairy_feed"
      rule: "Model production and transport of externally supplied skim milk, whey, acid whey, or raw milk through explicit upstream datasets; do not count those burdens again in foreground operations."
      source_ids:
        - eda-dairy-pefcr-2025
    - rule_id: boundary_route_specificity
      applies_to: "whey_and_acid_whey_routes"
      rule: "Identify whether the feed is whey or acid whey and include declared route-specific operations such as clarification, neutralisation, demineralisation, crystallisation, or membrane treatment only when they actually occur."
      source_ids:
        - codex-cxs-289-1995
    - rule_id: boundary_downstream_exclusion
      applies_to: "factory_gate_dataset"
      rule: "Exclude distribution, retail, consumer preparation, use, and end-of-life after the declared factory gate unless the study goal explicitly extends the boundary and reports those stages separately."
      source_ids:
        - eu-pef-method-2021
boundary_abstraction:
  declared_starting_condition: "The foreground begins when the declared liquid dairy feed is accepted at the powder-manufacturing site; raw milk separation is included only when performed by the reporting site."
  starting_condition_role: "Gate-to-gate foreground starting condition linked to an upstream dataset for the supplied skim milk, whey, acid whey, or raw milk."
  product_classification_scope: "Skimmed milk powder, whey powder, and acid whey powder within the semantic product boundary; classification code is supporting mapping context only."
  recursive_input_rule: "A purchased skim milk or whey powder used as an ingredient is recorded as an upstream product input with its own dataset and is not recursively manufactured inside this PCR unless it is physically reprocessed on site."
  upstream_dataset_requirement: "Require a geographically and temporally representative upstream dataset for each externally supplied liquid dairy feed and other material or energy input; disclose when a proxy is used."
  disclosure: "Declare feed type and origin, whether separation is foreground or upstream, powder type, whey acidity or modification, allocation level, included shared utilities, treatment location, packaging format, and excluded downstream stages."
