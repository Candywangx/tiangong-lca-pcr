allocation_rules:
  - rule_id: allocation_direct_assignment
    applies_to: "product_specific_processes_and_inputs"
    rule: "First assign metered process energy, materials, packaging, wastes, and emissions directly to the product and stage that causes them. Subdivide independently measured processes before applying allocation."
    source_ids:
      - eda-dairy-pefcr-2025
      - eu-pef-method-2021
  - rule_id: allocation_dry_matter
    applies_to: "joint_dairy_products"
    rule: "When direct assignment is not possible for a joint dairy operation, allocate raw dairy feed, transport burdens, and joint processing burdens in proportion to each co-product's measured dry matter output: share_i = DM_i × Q_i / sum(DM_j × Q_j)."
    source_ids:
      - eda-dairy-pefcr-2025
  - rule_id: allocation_factory_remainder
    applies_to: "whole_factory_or_shared_utility_data"
    rule: "Assign available product-specific data first, subtract those quantities from the verified factory total, then allocate only the remainder among covered co-products by measured dry matter output. Directly attributable packaging and ingredients are never included in this remainder."
    source_ids:
      - eda-dairy-pefcr-2025
  - rule_id: allocation_waste_and_rework
    applies_to: "rejected_product_rework_and_waste"
    rule: "Keep internally reworked material inside the mass balance without counting a second product. Record exported residues and wastes by actual destination; do not claim avoided burdens unless the downstream substitution scenario and quality equivalence are explicitly modelled and disclosed."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_feed_and_composition
      process_id: "feed_receipt_and_conditioning"
      flow_role: "Liquid feed, conditioned feed, and dairy co-products"
      record_type: "Delivery, transfer-meter, laboratory, and rejection records"
      raw_fields: "timestamp; supplier or upstream process; feed_type; wet_mass; dry_matter; fat; protein; moisture; acidity or pH; accepted_or_rejected; co_product_mass"
      collection_method: "Calibrated weighbridge, tank level or mass-flow meter matched to representative laboratory samples and lot identity"
      unit: "kg; mass fraction; pH"
      frequency: "Each delivery or transfer and each representative lot sample"
      temporal_coverage: "At least one representative operating year, with campaign-level traceability"
      site_scope: "All sites and lines in the dataset"
      aggregation_rule: "Sum accepted mass by route and lot; mass-weight composition; reconcile transfers, rejects, and co-products"
      quality_evidence: "Calibration, sampling method, laboratory result, supplier record, and lot reconciliation"
    - protocol_id: cp_processing_utilities
      process_id: "concentration_and_drying"
      flow_role: "Electricity, heat, fuels, water, condensate, and route-specific materials"
      record_type: "Meter, invoice, batch issue, operating-hour, and stock records"
      raw_fields: "meter_start; meter_end; fuel_or_steam_quantity; energy_unit; conversion_factor; water_withdrawal; condensate_reuse; material_issue; line; operating_time"
      collection_method: "Submeter preferred; otherwise documented allocation from a complete site meter using operating time and measured or rated load"
      unit: "kWh; MJ; kg; m3"
      frequency: "Continuous or per batch, aggregated monthly"
      temporal_coverage: "At least one representative operating year and all included campaigns"
      site_scope: "All included powder lines and shared utilities"
      aggregation_rule: "Sum by carrier and process; preserve original units; reconcile submeter totals to site totals before allocation"
      quality_evidence: "Meter identification, calibration, invoices, stock reconciliation, and allocation workbook"
    - protocol_id: cp_finished_powder
      process_id: "concentration_and_drying"
      flow_role: "Packable powder, off-specification powder, fines, and composition"
      record_type: "Dryer, silo, laboratory, rework, and waste records"
      raw_fields: "lot_id; powder_type; gross_powder_mass; accepted_mass; rejected_mass; recovered_fines; moisture; dry_matter; fat; protein; whey_pH_or_acidity"
      collection_method: "Calibrated silo or packaging scales matched to lot laboratory release and rework records"
      unit: "kg; mass fraction; pH"
      frequency: "Each production lot"
      temporal_coverage: "All lots in the representative period"
      site_scope: "All included drying and finishing lines"
      aggregation_rule: "Sum accepted and rejected mass separately; mass-weight composition; reconcile feed dry matter to powder, co-products, residues, wastewater, and measured losses"
      quality_evidence: "Scale calibration, release certificate, sample plan, and lot mass-balance sign-off"
    - protocol_id: cp_air_emissions
      process_id: "concentration_and_drying"
      flow_role: "Channelled drying dust"
      record_type: "Stack test or continuous monitor and gas-flow records"
      raw_fields: "source_id; control_device; concentration; dry_gas_flow; reference_conditions; operating_time; production_lot"
      collection_method: "Applicable standard stack method with matched gas flow and production period"
      unit: "mg/Nm3; Nm3; kg"
      frequency: "At least the legally applicable frequency; EU BAT comparator uses at least annual monitoring for dairy drying"
      temporal_coverage: "Representative operating conditions in the reporting period"
      site_scope: "Every included drying emission point"
      aggregation_rule: "Convert concentration and corrected gas volume to mass; subtract no recovered powder unless it is demonstrably returned before the emission point"
      quality_evidence: "Test report, method, accreditation, reference conditions, and operating-state record"
    - protocol_id: cp_packaging_and_dispatch
      process_id: "packaging_and_storage"
      flow_role: "Net product, packaging, packaging waste, and dispatch"
      record_type: "Filling-scale, bill-of-material, stock, waste, and dispatch records"
      raw_fields: "lot_id; filled_units; net_mass_per_unit; bulk_dispatch_mass; packaging_material; packaging_issue; packaging_stock_change; packaging_waste; dispatch_status"
      collection_method: "Calibrated filling or bulk scales with stock reconciliation"
      unit: "kg"
      frequency: "Each lot and dispatch"
      temporal_coverage: "All accepted lots in the representative period"
      site_scope: "All included packing lines and bulk silos"
      aggregation_rule: "Net product = accepted filled or bulk-dispatched powder excluding packaging; reconcile packaging issued to contained and waste mass"
      quality_evidence: "Scale calibration, bill of materials, dispatch record, and stock reconciliation"
    - protocol_id: cp_cleaning_and_wastewater
      process_id: "cleaning_and_wastewater"
      flow_role: "Cleaning water, agents, wastewater, sludge, and discharge"
      record_type: "CIP recipe, flow meter, chemical issue, wastewater meter, sample, and sludge records"
      raw_fields: "cleaning_event; process_line; water_withdrawal; reused_water; chemical_product; chemical_mass; wastewater_volume; pollutant_concentration; sludge_mass; sludge_dry_matter; destination"
      collection_method: "Event or area meter matched to CIP logs and representative wastewater samples"
      unit: "m3; kg; mg/L"
      frequency: "Each cleaning event or continuous meter, aggregated monthly"
      temporal_coverage: "At least one representative operating year"
      site_scope: "All included lines and shared treatment systems"
      aggregation_rule: "Sum gross and reused water separately; pollutant load = matched volume × concentration; allocate shared treatment after direct assignment"
      quality_evidence: "Meter calibration, CIP log, chemical stock balance, sample chain of custody, and treatment record"
  calculation_rules:
    - id: calc_reference_output
      applies_to: "Net saleable powder"
      rule: "Sum accepted net filled-unit mass and accepted bulk-dispatch mass; exclude packaging, rejected lots, rework not released, retained samples, and stock not transferred to the declared factory gate."
      inputs:
        - filled_units
        - net_mass_per_unit
        - bulk_dispatch_mass
        - dispatch_status
        - rejected_mass
        - retained_samples
      output: "kg net saleable powder and normalized 1 kg reference flow"
      source_ids:
        - codex-cxs-207-1999
        - codex-cxs-289-1995
    - id: calc_dry_matter_allocation
      applies_to: "Joint dairy co-products"
      rule: "For every joint operation, calculate AFi = DMi × Qi / sum(DMj × Qj) using matched wet mass and dry matter measurements for every co-product in the denominator."
      inputs:
        - co_product_mass
        - dry_matter
        - joint_process_total
      output: "product-specific allocation factor and allocated amount"
      source_ids:
        - eda-dairy-pefcr-2025
    - id: calc_dryer_dust
      applies_to: "Channelled drying dust"
      rule: "Emitted dust mass = measured concentration × corrected dry gas volume for the matched operating period, with explicit unit conversion and no subtraction of already emitted material."
      inputs:
        - concentration
        - dry_gas_flow
        - operating_time
        - reference_conditions
      output: "kg dust emitted and kg/kg reference powder"
      source_ids:
        - eu-fdm-bat-2019
    - id: calc_wastewater_load
      applies_to: "Treated or untreated wastewater discharge"
      rule: "Pollutant load = matched discharge volume × pollutant concentration; keep reused water and recovered condensate outside final discharge volume."
      inputs:
        - wastewater_volume
        - pollutant_concentration
        - reused_water
        - condensate_reuse
      output: "m3 discharge and kg pollutant per kg reference powder"
      source_ids:
        - eu-fdm-bat-2019
  data_quality_requirements:
    - id: dqr_identity_and_route
      applies_to: "All data packages"
      requirement: "Declare powder type, liquid feed type and origin, whey acidity or modification, process technology, packaging format, and the exact foreground starting condition."
      evidence: "Dataset metadata, process map, supplier or upstream dataset references, and lot records"
    - id: dqr_temporal_coverage
      applies_to: "Foreground activity data"
      requirement: "Use at least one representative operating year where seasonality and product mix affect shared utilities; preserve lot or campaign records and explain shutdowns, abnormal operation, and missing periods."
      evidence: "Dated meter, production, laboratory, maintenance, and dispatch records"
    - id: dqr_mass_balance
      applies_to: "Feed, co-products, powder, residues, and wastewater"
      requirement: "Close wet-mass and dry-matter balances at the most detailed measured process level; investigate and disclose unexplained differences instead of forcing closure by changing the saleable product amount."
      evidence: "Signed wet-mass and dry-matter reconciliation by lot, campaign, and annual total"
    - id: dqr_composition
      applies_to: "Saleable powder"
      requirement: "For skimmed milk powder, verify maximum milkfat 1.5% m/m, maximum water 5% m/m, and minimum milk protein in milk-solids-not-fat 34% m/m unless a stricter declared specification applies. For whey and acid whey powders, retain the applicable Codex composition and acidity results."
      evidence: "Laboratory release results and applicable product specification; codex-cxs-207-1999; codex-cxs-289-1995"
    - id: dqr_bat_comparison
      applies_to: "Powder-dominant dairy installation QA"
      requirement: "Where powder is at least 80% of production, retain annual raw-material throughput, total energy, and wastewater discharge so the unconverted EU BAT indicators of 0.2-0.5 MWh/t raw material and 1.2-2.7 m3/t raw material can be compared on their original basis. A value outside the interval is a review trigger, not automatic replacement or failure."
      evidence: "Annual site balance and eu-fdm-bat-2019"
    - id: dqr_data_gaps
      applies_to: "Missing or shared foreground data"
      requirement: "Identify every proxy, shared-meter allocation, unverified UUID, and default dry matter value; state its affected amount and sensitivity, and prioritise replacement with direct records."
      evidence: "Data-gap register, allocation workbook, sensitivity result, and reviewer sign-off"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference_product"
    rule: "Require exactly 1 kg net saleable powder with the Mass flow property, Units of mass unit group, kg reference unit, selected product-flow UUID, and all required qualifiers."
    source_ids:
      - codex-cxs-207-1999
      - codex-cxs-289-1995
  - rule_id: validate_route_scope
    applies_to: "product_and_process_identity"
    rule: "Reject a package that does not identify skimmed milk powder, whey powder, or acid whey powder and its liquid feed origin, or that includes an excluded concentrated protein, lactose, casein, infant-formula, or blended product without a reviewed scope extension."
    source_ids:
      - codex-cxs-207-1999
      - codex-cxs-289-1995
  - rule_id: validate_required_processes
    applies_to: "foreground_process_map"
    rule: "Require all four process-map entries and a quantitative record or explicit zero with reason for every conditional route-specific operation and every inventory row applicable to the site."
    source_ids:
      - eda-dairy-pefcr-2025
      - eu-fdm-bat-2019
  - rule_id: validate_mass_and_solids_balance
    applies_to: "foreground_inventory"
    rule: "Require wet-mass and dry-matter reconciliation across accepted feed, co-products, saleable powder, rework, wastes, wastewater solids, and measured losses; unresolved imbalance is a finding."
    source_ids:
      - eda-dairy-pefcr-2025
  - rule_id: validate_allocation
    applies_to: "shared_and_joint_operations"
    rule: "Require direct assignment before allocation, complete dry-matter denominators for every joint co-product, reconciliation of allocated remainders to the verified total, and disclosure of allocation factors."
    source_ids:
      - eda-dairy-pefcr-2025
      - eu-pef-method-2021
  - rule_id: validate_energy_water_and_emissions
    applies_to: "utilities_wastewater_and_drying_air"
    rule: "Require separate energy carriers, gross and reused water, final wastewater discharge, and measured drying dust where applicable. Compare installation BAT indicators only on their original raw-material basis."
    source_ids:
      - eu-fdm-bat-2019
  - rule_id: validate_composition
    applies_to: "released_product"
    rule: "Require lot evidence for the applicable Codex or declared stricter composition and acidity specification; off-specification material must not be counted as saleable reference output."
    source_ids:
      - codex-cxs-207-1999
      - codex-cxs-289-1995
published_dataset_profile:
  dataset_role: "Product-specific foreground powder-manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product and supply-chain LCA where geography, technology, powder type, feed origin, composition, allocation method, packaging, and temporal coverage are representative or adjusted transparently"
  excluded_use: "Unqualified comparison between skim milk and whey routes; substitution for whey protein concentrate, lactose, casein, infant formula, or other excluded products; use as a farm, cheese, casein, retail, consumer-use, or end-of-life dataset"
  required_metadata: "PCR id and version state; powder type; liquid feed type and upstream dataset; whey acidity or modification; geography; site and technology; reference period; net product mass; composition; packaging; process map; allocation factors; electricity and heat supply; water and wastewater boundary; emission controls"
  required_quality_disclosure: "Primary-data coverage; meter and laboratory methods; wet-mass and dry-matter balance; shared-data allocation; UUID gaps; proxy datasets; abnormal operation; BAT comparison basis; uncertainty and sensitivity for material gaps"
  update_trigger: "Material change in feed source or product mix, powder route or technology, composition, allocation, packaging, energy or water system, emission control, regulatory or Codex requirement, site boundary, or a new representative period"
