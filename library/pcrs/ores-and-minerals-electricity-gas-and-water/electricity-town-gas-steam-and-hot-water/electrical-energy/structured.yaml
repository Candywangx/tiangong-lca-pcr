  calculation_rules:
    - id: normalization
      applies_to: "all cards"
      rule: "Exchange = attributable period quantity / D. Reconcile inventories and cancel internal transfers before aggregation."
      inputs:
        - cp_output
        - "row-specific cp records"
      output: "per 1 MJ reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "production"
      rule: "D is independently calibrated metered accepted net electrical output MJ at the selected gate, positive after stock reconciliation;1 kWh =3.6 MJ. One dataset uses exactly one generation, storage or delivery output basis; never sum charging, gross generation, net export and delivery as outputs. Generation D equals actual metered net export; gross-minus-own-use may reproduce it only with matched meter boundaries and periods, keeping purchased auxiliaries as separate inputs and not subtracting them twice. Imported/resold electricity and internal transfers are identified independently. A mix uses each actual source contribution on the same net gate basis, with weights summing to1 and source losses/providers documented; do not multiply a source gross-output factor by net shares. Delivered electricity reconciles matched network input, accepted output, other exports, technical losses, theft/meter gaps and stock; input = D/(1-l) only for independently established matching loss fraction0<=l<1 and no unaccounted exports. Storage reconciles measured charging = discharged/other useful exports + measured electrical losses + actual stock increase on the same meter boundary; do not invent roundtrip efficiency, lifetime or avoided generation. Fuel energy is actual consumed mass times matched as-received NCV, or measured volume/density/calorific value at stated conditions; separate electrical MJ from thermal fuel MJ. Gas mass/standard volume conversion requires measured density/reference T/P, not assumed composition. Direct gas emissions use measured species/load or documented compatible activity factors; do not reuse purchased-electricity factors as onsite fuel emissions. Fossil/biogenic CO2, CH4,N2O and captured carbon are distinct; no assumed zero biomass/waste CO2. Useful steam heat = matched steam mass times supplied-minus-return enthalpy; hot-water heat uses actual mass and measured enthalpy difference, not total water mass as energy. Useful CHP heat and electricity stay separate co-products before declared allocation. Lifetime material/infrastructure quantities are assigned once over measured/justified expected accepted electrical throughput with sensitivity, never invented machine mass or output."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: representativeness
      applies_to: "dataset"
      requirement: "Use matching production and exchange periods, actual technology, geography and supplier state. Record startup, shutdown, seasonal variation and substitutions."
      evidence: "collection records"
    - id: identity_and_ranges
      applies_to: "all cards"
      requirement: "Unresolved identities and missing independent range evidence remain explicit. Do not replace measurement by a guessed industry range or by missing-as-zero."
      evidence: "manifest review metadata"
validation_rules:
  - rule_id: validate_reference
    applies_to: "final_product"
    rule: "Verify 1 MJ, positive D, product state, property/unit and every required qualifier. Each dataset fixes one product and route."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "site"
    rule: "D is independently calibrated metered accepted net electrical output MJ at the selected gate, positive after stock reconciliation;1 kWh =3.6 MJ. One dataset uses exactly one generation, storage or delivery output basis; never sum charging, gross generation, net export and delivery as outputs. Generation D equals actual metered net export; gross-minus-own-use may reproduce it only with matched meter boundaries and periods, keeping purchased auxiliaries as separate inputs and not subtracting them twice. Imported/resold electricity and internal transfers are identified independently. A mix uses each actual source contribution on the same net gate basis, with weights summing to1 and source losses/providers documented; do not multiply a source gross-output factor by net shares. Delivered electricity reconciles matched network input, accepted output, other exports, technical losses, theft/meter gaps and stock; input = D/(1-l) only for independently established matching loss fraction0<=l<1 and no unaccounted exports. Storage reconciles measured charging = discharged/other useful exports + measured electrical losses + actual stock increase on the same meter boundary; do not invent roundtrip efficiency, lifetime or avoided generation. Fuel energy is actual consumed mass times matched as-received NCV, or measured volume/density/calorific value at stated conditions; separate electrical MJ from thermal fuel MJ. Gas mass/standard volume conversion requires measured density/reference T/P, not assumed composition. Direct gas emissions use measured species/load or documented compatible activity factors; do not reuse purchased-electricity factors as onsite fuel emissions. Fossil/biogenic CO2, CH4,N2O and captured carbon are distinct; no assumed zero biomass/waste CO2. Useful steam heat = matched steam mass times supplied-minus-return enthalpy; hot-water heat uses actual mass and measured enthalpy difference, not total water mass as energy. Useful CHP heat and electricity stay separate co-products before declared allocation. Lifetime material/infrastructure quantities are assigned once over measured/justified expected accepted electrical throughput with sensitivity, never invented machine mass or output."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "handoff"
    rule: "Verify each applicable exchange, its provider or environmental compartment and final waste fate; identify skipped checks, unresolved identities, missing measurements and upstream gaps. Errors or unassessed mandatory coverage cannot be labelled complete."
    source_ids: []
