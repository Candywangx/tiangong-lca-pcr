allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide actual electricity generation, network transformation/storage and useful heat supply where possible. Retain unallocated CHP/waste-treatment inventories; demonstrate causal allocation or matched economic sensitivity when needed. Electricity and thermal output share only a justified allocation rule, not automatic equal-value MJ. Waste treatment as a service and generated electricity require actual upstream waste-status and burdens; supplied waste is not automatically a free fuel. Certificates do not physically displace grid output or remove infrastructure/fuel-cycle emissions. No automatic avoided-grid, heat, waste-disposal or storage credits; retain actual useful heat quantities separately."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
