system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Electrical energy supplied at one declared generation net-export gate, storage-discharge gate or transmission/distribution delivery meter, including actual fossil/biogenic fuel or waste combustion, nuclear, hydro/pumped storage, wind, ocean wave/tidal, solar photovoltaic/thermal, geothermal, ambient/waste-heat conversion and electrochemical fuel-cell routes; actual national/regional/supplier portfolios are included with measured source weights. Select one actual technology or documented mix, geography/year, AC/DC form, voltage/frequency and meter interface; these alternatives are not simultaneous mandatory operations. Generation-only ends at net export; delivered electricity includes actual transformation/network losses and infrastructure through that gate. Storage is not primary generation: retain charging electricity, own use, measured losses, stock change, lifetime throughput and actual returned electricity without avoided-grid credits. Record upstream fuel/material production, actual construction/replacement/decommissioning, development/land, water and wastes, direct emissions, outage/standby own use and declared control systems; do not omit infrastructure because operating fuel is absent. Electricity supply is distinct from transmission service sold alone, fuel/heat as reference product, certificates sold alone and consumer equipment manufacture. CHP heat co-products may exist but this PCR reference remains electricity. One representative CN high-voltage AC production-mix identity does not narrow this full category. All other voltage/DC/geography/single-technology/delivery states require compatible identities. Public EPD scope supports the technology list only, not unacquired full-document cutoff/other rules; route-specific data collection below is foreground methodology requiring actual site evidence."
      source_ids:
        - epd-electricity-scope
        - ipcc-stationary-2006
        - ghg-scope2-2015
        - epa-chp-output
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
