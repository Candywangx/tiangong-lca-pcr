system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "This PCR covers manufacture or recovery of one origin-qualified coal, water or producer gas at a measured delivery gate, excluding petroleum gas and natural gas. Distinguish air/oxygen/steam gasification, coal carbonisation and industrial recovered gases. For a coke-oven, distribution-gasworks or recovered steel-gas dataset, the corresponding narrower PCR supplies origin-specific upstream burden and treatment rules; do not create an additional gasification inventory for those origins. The gasification block here applies only to actual solid-feed gasification. Purification, storage and compression occur only where physically performed. A gas burned on site without a measured exported fuel transfer is a fuel input to heat/power production rather than a gas-product supply."
      source_ids:
        - netl-gasification-2002
        - un-energy-2024
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
