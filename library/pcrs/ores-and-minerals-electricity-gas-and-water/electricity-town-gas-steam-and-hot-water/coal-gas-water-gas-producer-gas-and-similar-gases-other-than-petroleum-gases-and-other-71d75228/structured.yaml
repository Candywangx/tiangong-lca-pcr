  calculation_rules:
    - id: normalization
      applies_to: "all cards"
      rule: "Exchange = attributable period quantity / D. Reconcile inventories and cancel internal transfers before aggregation."
      inputs:
        - cp_output
        - "row-specific cp records"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "production"
      rule: "Close dry gas mass and carbon balances using measured feed carbon, product composition, tar/char carbon, combustion and emissions. Record moisture/steam separately. Gas mass equals corrected volume times measured composition-dependent density at the same reference conditions. A producer-gas heating value or density cannot substitute for water gas, coke-oven gas or recovered gas. Cancel internal recycled gas and cooling-water loops."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: representativeness
      applies_to: "dataset"
      requirement: "Use matching production and exchange periods, actual technology, geography and supplier state. Record startup, shutdown, seasonal variation and substitutions."
      evidence: "collection records"
    - id: identity_and_ranges
      applies_to: "all cards"
      requirement: "Unresolved identities and missing independent range evidence remain explicit. Do not replace measurement by a guessed industry range or by missing-as-zero."
      evidence: "manifest review metadata"
validation_rules:
  - rule_id: validate_reference
    applies_to: "final_product"
    rule: "Verify 1 kg, positive D, product state, property/unit and every required qualifier. Each dataset fixes one product and route."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "site"
    rule: "Close dry gas mass and carbon balances using measured feed carbon, product composition, tar/char carbon, combustion and emissions. Record moisture/steam separately. Gas mass equals corrected volume times measured composition-dependent density at the same reference conditions. A producer-gas heating value or density cannot substitute for water gas, coke-oven gas or recovered gas. Cancel internal recycled gas and cooling-water loops."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "handoff"
    rule: "Verify each applicable exchange, its provider or environmental compartment and final waste fate; identify skipped checks, unresolved identities, missing measurements and upstream gaps. Errors or unassessed mandatory coverage cannot be labelled complete."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply origin- and composition-qualified fuel gas as a material/energy carrier"
  excluded_use: "Natural gas; refinery gas; petroleum hydrocarbon gases; standalone hydrogen; unmetered heat-only production"
  required_metadata: "site/year; origin and subtype; feedstock; gasifying agent; dry/wet basis; gas composition; pressure and temperature; density; net calorific value; parent burden allocation; cleaning technology; gate; own-use and losses; compressibility and gas-volume reference conditions; fossil/biogenic carbon share; applicable subtype PCR"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
