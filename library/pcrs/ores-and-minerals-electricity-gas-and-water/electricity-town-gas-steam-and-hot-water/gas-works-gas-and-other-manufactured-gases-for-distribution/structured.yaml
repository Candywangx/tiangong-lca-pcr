allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "joint operations"
    rule: "Prefer subdivision and independent metering to avoid allocation. Use system expansion only in a separate study declaring all expanded functions; do not combine allocation and substitution credits in a single-product supply dataset."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_physical
    applies_to: "gas; coke; tar; sulfur"
    rule: "Where subdivision is unavailable, document a defensible physical causal relationship with all co-products and parameters. Energy allocation needs evidence of fuel functions and a common gross/net calorific basis; never add gas volume and solid mass as an allocation basis."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_other
    applies_to: "joint operations"
    rule: "If a physical relationship cannot be supported, justify rejecting preceding methods and use relative economic value at a common period and market point if appropriate. Disclose prices, quantities, shares and sensitivity. Keep waste-treatment burdens with the generating process rather than treat disposal mass as co-product value."
    source_ids:
      - ec-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_gas
      process_id: "export"
      flow_role: "reference product"
      record_type: "meter and operating records"
      raw_fields: "outlet volume; T; absolute P; wet/dry basis; correction factors; stock; composition; calorific values; acceptance certificate"
      collection_method: "Calibrated flow meter and quality testing; retain the actual correction equations and method edition and recompute delivered quantities on common conditions."
      unit: "m3"
      frequency: "shift records with monthly reconciliation"
      temporal_coverage: "complete declared operating year"
      site_scope: "same site and route"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, tests, transfer notes and ledgers"
    - protocol_id: cp_feed
      process_id: "make"
      flow_role: "feedstock"
      record_type: "meter and operating records"
      raw_fields: "material receipts; stock; internal recycle; feedstock/thermal use; composition and moisture; gas metering conditions"
      collection_method: "Weighing, supplier records or gas meters; reconcile net external use with opening/closing stock and internal transfers."
      unit: "kg; m3"
      frequency: "shift records with monthly reconciliation"
      temporal_coverage: "complete declared operating year"
      site_scope: "same site and route"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, tests, transfer notes and ledgers"
    - protocol_id: cp_energy
      process_id: "make_clean_export"
      flow_role: "electricity; steam"
      record_type: "meter and operating records"
      raw_fields: "process electricity; steam mass and state; condensate return; own energy; purchased energy"
      collection_method: "Collect submeter electricity and steam mass; document attribution where submeters are unavailable and express electricity in MJ."
      unit: "MJ; kg"
      frequency: "shift records with monthly reconciliation"
      temporal_coverage: "complete declared operating year"
      site_scope: "same site and route"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, tests, transfer notes and ledgers"
    - protocol_id: cp_water
      process_id: "clean"
      flow_role: "fresh supplied water"
      record_type: "meter and operating records"
      raw_fields: "water mass; makeup; circulation; discharge; evaporation; meter error"
      collection_method: "Use mass measurement or volume with measured density to reconcile new supplied water; do not repeat internal circulation."
      unit: "kg"
      frequency: "shift records with monthly reconciliation"
      temporal_coverage: "complete declared operating year"
      site_scope: "same site and route"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, tests, transfer notes and ledgers"
    - protocol_id: cp_chemicals
      process_id: "clean"
      flow_role: "individual chemical"
      record_type: "meter and operating records"
      raw_fields: "formulation; concentration; net consumption; stock; supplier; sorbent sulfur loading"
      collection_method: "Weigh each chemical and reconcile purchases, withdrawals and stock; create distinct flows for different solution concentrations."
      unit: "kg"
      frequency: "shift records with monthly reconciliation"
      temporal_coverage: "complete declared operating year"
      site_scope: "same site and route"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, tests, transfer notes and ledgers"
    - protocol_id: cp_products
      process_id: "make_clean"
      flow_role: "individual co-product"
      record_type: "meter and operating records"
      raw_fields: "co-product mass; moisture; specification; fate; price; calorific value"
      collection_method: "Weigh and reconcile sales and stock; distinguish accepted sales, recycle and disposal."
      unit: "kg"
      frequency: "shift records with monthly reconciliation"
      temporal_coverage: "complete declared operating year"
      site_scope: "same site and route"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, tests, transfer notes and ledgers"
    - protocol_id: cp_waste
      process_id: "make_clean"
      flow_role: "individual waste"
      record_type: "meter and operating records"
      raw_fields: "waste mass; moisture; hazard classification; composition; transfer note; treatment operator"
      collection_method: "Weigh each waste and reconcile transfer notes; use measured density for liquids and disclose treatment boundaries."
      unit: "kg"
      frequency: "shift records with monthly reconciliation"
      temporal_coverage: "complete declared operating year"
      site_scope: "same site and route"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, tests, transfer notes and ledgers"
    - protocol_id: cp_emissions
      process_id: "make_clean_export"
      flow_role: "individual emitted substance"
      record_type: "meter and operating records"
      raw_fields: "release point; species; concentration; flow; time; detection limit; leaks; flares; capture"
      collection_method: "Determine each substance from monitoring, material balance or documented engineering estimates; retain all inputs and uncertainty, not product-gas composition as an emitted amount."
      unit: "kg"
      frequency: "shift records with monthly reconciliation"
      temporal_coverage: "complete declared operating year"
      site_scope: "same site and route"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, tests, transfer notes and ledgers"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Use the collection normalization stated above, attributable period total divided by net delivered volume; retain both unallocated totals and allocated quantities."
      inputs:
        - cp_gas
        - cp_feed
        - cp_energy
        - cp_water
        - cp_chemicals
        - cp_products
        - cp_waste
        - cp_emissions
      output: "exchange amount per reference flow"
      source_ids: []
    - id: electricity_conversion
      applies_to: "make_electricity; clean_electricity; export_electricity"
      rule: "1 kWh = 3.6 MJ; dimensional unit identity."
      inputs:
        - cp_energy
      output: "MJ electricity per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: route_quality
      applies_to: "foreground"
      requirement: "Retain actual flowsheet, all external exchanges, internal transfers and reasons for non-applicability; add atomic rows for additional materials and emissions."
      evidence: "flowsheet and ledgers"
    - id: volume_quality
      applies_to: "reference_gas"
      requirement: "Align conditions for delivery, incoming gas meters, holder stock and calorific values; prohibit comparison where conversion is not traceable."
      evidence: "cp_gas; cp_feed"
    - id: emission_quality
      applies_to: "cp_emissions"
      requirement: "Disclose monitoring coverage, detection limits, unmeasured species and estimate error; a total NOx measurement cannot be assigned in full to both NO and NO2."
      evidence: "monitoring and analytical records"
    - id: range_quality
      applies_to: "all inventory rows"
      requirement: "Collect actual quantities. This PCR supplies no generic inferred ranges or default emission factors; missing records are not zero. Engineering estimates in the data package must be marked modelled_estimate with justification and uncertainty."
      evidence: "collection protocols and gap disclosure"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_gas"
    rule: "Check route, delivery state, all required qualifiers and gas conditions; mere natural-gas distribution is outside scope."
    source_ids:
      - unsd-cpc-2025
      - iea-gasworks-2008
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Each row must agree with the same-period, same-condition 1 m3 accepted outlet gas; check properties, units, upstream compatibility, electricity conversion and steam state."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "foreground"
    rule: "Reconcile carbon, sulfur and energy ledgers with consistent moisture, stock and blend composition; do not repeat material inputs after converting them to energy. Explain non-closure by measurement or coverage evidence without invented tolerances."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "joint operations"
    rule: "Check same-period co-products, method selection, prices or physical parameters and all shares; do not duplicate burdens across supplier inputs, internal circulation and site manufacture."
    source_ids:
      - ec-pef-2021
  - rule_id: validate_completeness
    applies_to: "foreground"
    rule: "Expose unresolved UUIDs and identity, emitted-species, treatment and upstream-coverage gaps. Retain collection requirements where range evidence is insufficient; one case is not an industry range."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Gas works supply modelling at compatible product state and volume conditions; input to process or lifecyclemodel projections"
  excluded_use: "Complete delivery and combustion life cycle; natural gas extraction; pure hydrogen or chemical synthesis gas; cross-route comparisons without conversion"
  required_metadata: "all reference qualifiers; origins and upstream boundaries; flowsheet; allocation; internal transfers and stock; treatment destinations"
  required_quality_disclosure: "UUID and range gaps; estimates; monitoring coverage and errors; missing supply chains; excluded infrastructure, delivery and end-use stages"
  update_trigger: "material changes in feedstocks, route, supply quality, abatement, metering conditions or allocation market"
