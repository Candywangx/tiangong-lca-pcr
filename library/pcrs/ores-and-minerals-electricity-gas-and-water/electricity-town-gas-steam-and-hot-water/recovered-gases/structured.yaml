allocation_rules:
  - rule_id: allocation_upstream
    applies_to: "raw_bf; raw_bof"
    rule: "Obtain the producing-furnace burden allocated to each transferred gas through cp_upstream. Recovery does not establish zero burden or an avoided-emission credit. Disclose supplier allocation and assess uncertainty where burdens are unavailable."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "recovery"
    rule: "Assign dedicated meters directly. For remaining common conditioning services use a documented causal engineering driver, with measured driver totals and shares summing to one in cp_allocation. If no causal driver is defensible, state an economic allocation scenario using consistent-period revenues and provide sensitivity; never silently choose mass, volume or calorific value as universal allocation."
    source_ids: []
  - rule_id: allocation_outputs
    applies_to: "converter_gas; pressure_recovery_electricity; bf_dust; bf_sludge; bof_dust; bof_sludge"
    rule: "Treat independently exported gas/electricity as co-products where applicable. Determine dust/sludge product versus waste status from actual handover and quality records, and update the physical flow type accordingly. Do not credit recycling or pressure recovery twice; retain treatment responsibility."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_export
      process_id: "recovery"
      flow_role: "reference_gas; converter_gas"
      record_type: "Export meters and gas laboratory records"
      raw_fields: "Gas type; accepted dry mass; accepted dry volume; temperature; absolute pressure; water vapor; compressibility; composition; density; gross/net calorific value; delivery pressure"
      collection_method: "Reconcile calibrated export meters with representative gas sampling; obtain dry mass as corrected dry volume multiplied by measured density on that same state basis. Separate gas types and excluded flare diversion."
      unit: "m3; kg; MJ"
      frequency: "Continuous meters; routine composition sampling"
      temporal_coverage: "Same declared representative period, including startup and shutdown"
      site_scope: "Declared recovery center and handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; logs; source records; reconciliation and uncertainty"
    - protocol_id: cp_gas
      process_id: "recovery"
      flow_role: "raw_bf; raw_bof"
      record_type: "Furnace transfer records"
      raw_fields: "Source furnace; inlet volume/mass; state; contaminants; diverted fraction"
      collection_method: "Reconcile transfer meters and furnace operating logs on matching gas-state bases."
      unit: "m3; kg"
      frequency: "Continuous and each converter heat"
      temporal_coverage: "Same declared representative period, including startup and shutdown"
      site_scope: "Declared recovery center and handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; logs; source records; reconciliation and uncertainty"
    - protocol_id: cp_utilities
      process_id: "recovery"
      flow_role: "recovery_electricity; scrubber_water; cooling_deionised_water; purge_nitrogen; pressure_recovery_electricity"
      record_type: "Dedicated meter and supply records"
      raw_fields: "Meter id; exchange identity; gross input; self-consumption; exported output; allocation driver; unit conversion"
      collection_method: "Read dedicated electricity, water and nitrogen meters, reconciled to bills; use measured density if volume is converted to mass."
      unit: "kWh; MJ; kg; m3"
      frequency: "Continuous; reconcile monthly"
      temporal_coverage: "Same declared representative period, including startup and shutdown"
      site_scope: "Declared recovery center and handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; logs; source records; reconciliation and uncertainty"
    - protocol_id: cp_waste
      process_id: "recovery"
      flow_role: "bf_dust; bf_sludge; bof_dust; bof_sludge; scrubber_effluent"
      record_type: "Weighbridge, effluent meters and analyses"
      raw_fields: "Origin; mass/volume; moisture; dry solids; metals; cyanide; ammonia; destination; waste status"
      collection_method: "Measure each segregated waste at external-treatment handover; reconcile manifests and retained laboratory samples."
      unit: "kg; m3"
      frequency: "Each transfer and representative samples"
      temporal_coverage: "Same declared representative period, including startup and shutdown"
      site_scope: "Declared recovery center and handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; logs; source records; reconciliation and uncertainty"
    - protocol_id: cp_air
      process_id: "recovery"
      flow_role: "carbon_monoxide_air; carbon_dioxide_air"
      record_type: "Flare, vent and leak inventory"
      raw_fields: "Event duration; gas flow; composition; fossil fraction; flare operation; monitoring results; uncertainty"
      collection_method: "Use stack/vent monitoring or a documented event-level carbon balance; retain methods and uncertainties. Account for residual CO and inlet CO2 separately."
      unit: "kg"
      frequency: "Continuous or each event"
      temporal_coverage: "Same declared representative period, including startup and shutdown"
      site_scope: "Declared recovery center and handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; logs; source records; reconciliation and uncertainty"
    - protocol_id: cp_upstream
      process_id: "recovery"
      flow_role: "raw_bf; raw_bof"
      record_type: "Supplying-process and allocation dossier"
      raw_fields: "Supplier; source dataset; furnace boundary; allocation; gas transfer basis; unresolved burden"
      collection_method: "Obtain and verify a compatible supplying-process dataset and its gas allocation; do not infer burden from gas price alone."
      unit: "m3; kg"
      frequency: "Each supply basis revision"
      temporal_coverage: "Same declared representative period, including startup and shutdown"
      site_scope: "Declared recovery center and handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; logs; source records; reconciliation and uncertainty"
    - protocol_id: cp_allocation
      process_id: "recovery"
      flow_role: "recovery"
      record_type: "Shared-service attribution records"
      raw_fields: "Service; product; driver; measured totals; shares; revenues if used; sensitivity"
      collection_method: "Separate independently metered service totals; document residual allocation rationale and sum shares to one."
      unit: "dimensionless"
      frequency: "Each accounting period"
      temporal_coverage: "Same declared representative period, including startup and shutdown"
      site_scope: "Declared recovery center and handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; logs; source records; reconciliation and uncertainty"
    - protocol_id: cp_scope
      process_id: "recovery"
      flow_role: "recovery"
      record_type: "Equipment and exchange completeness register"
      raw_fields: "Unit operations; chemicals; emissions; water loops; omitted exchanges; upstream/treatment links"
      collection_method: "Walk down the actual recovery system; reconcile every physical crossing, and justify conditional absences and omissions."
      unit: "not applicable"
      frequency: "Each configuration revision"
      temporal_coverage: "Same declared representative period, including startup and shutdown"
      site_scope: "Declared recovery center and handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; logs; source records; reconciliation and uncertainty"
  calculation_rules:
    - id: normalize_records
      applies_to: "all inventory rows"
      rule: "For the same declared period, divide each attributable exchange total by accepted exported dry reference-gas mass; the reference output is 1 kg. Preserve numerator units and document allocation before division."
      inputs:
        - cp_export
        - cp_gas
        - cp_utilities
        - cp_waste
        - cp_air
        - cp_allocation
      output: "Exchange amount per reference flow"
      source_ids: []
    - id: correct_gas_volume
      applies_to: "raw_bf; reference_gas"
      rule: "Convert measured gas volume to the declared dry temperature/absolute-pressure basis using measured moisture and compressibility with a documented gas-state calculation or calibrated flow-computer record. Retain the complete conversion record."
      inputs:
        - cp_gas
        - cp_export
      output: "Dry gas volume at reference conditions"
      source_ids: []
    - id: gas_energy
      applies_to: "reference_gas; converter_gas"
      rule: "Multiply dry gas volume by its measured gross or net calorific value on the identical state basis; retain both results and never use an unrelated furnace-gas factor."
      inputs:
        - cp_export
