allocation_rules:
  - rule_id: allocation_separate
    applies_to: "all processes"
    rule: "Assign separately metered equipment and delivery loads directly before allocating shared generation burdens."
    source_ids: []
  - rule_id: allocation_chp
    applies_to: "heat_generation"
    rule: "For indivisible CHP common burdens use a declared physical allocation consistent with the study method. Collect net exported electricity, useful heat by grade and common fuel use; document why energy, exergy or another causal model represents the coupled process. Do not silently impose equal-value energy allocation across different heat grades."
    source_ids:
      - epa-chp-efficiency
  - rule_id: allocation_recovery
    applies_to: "imported_steam_heat"
    rule: "Recovered heat requires a stated upstream burden or cut-off agreement and linked source process. Avoided heat or electricity is a separate consequential comparison; never subtract it from attributional inventory without declaring system expansion."
    source_ids: []
  - rule_id: allocation_losses
    applies_to: "heat_delivery"
    rule: "Assign actual generation and network losses to heat delivered at the declared gate. Return condensate is internal recovery, not an automatic avoided-production credit."
    source_ids:
      - doe-steam-boiler-water
dataset_production:
  collection_protocols:
    - protocol_id: cp_heat
      process_id: "heat_delivery"
      flow_role: "thermal output and imported heat"
      record_type: "meter and state records"
      raw_fields: "carrier; gate; supplied and returned masses; pressure; temperatures; steam quality; supply and return enthalpy; net heat; make-up baseline enthalpy"
      collection_method: "Calibrated heat meter or thermodynamic integration; reconcile supplier heat meters and return-loop records"
      unit: "MJ"
      frequency: "continuous with monthly reconciliation"
      temporal_coverage: "same full declared operating period"
      site_scope: "declared heat supply gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; enthalpy method version; heat balance"
    - protocol_id: cp_energy
      process_id: "heat_generation"
      flow_role: "electrical input and output"
      record_type: "electricity meters"
      raw_fields: "meter id; process; gross generation; own use; imported and exported electricity; kWh"
      collection_method: "Submeter heaters, auxiliaries and network pumps; reconcile purchases and CHP generation"
      unit: "MJ"
      frequency: "continuous with monthly reconciliation"
      temporal_coverage: "same full declared operating period"
      site_scope: "site and included network"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; bills; no gross-net double count"
    - protocol_id: cp_fuel
      process_id: "heat_generation"
      flow_role: "individual fuel receipts and use"
      record_type: "fuel stock and meter records"
      raw_fields: "fuel identity; opening stock; receipts; closing stock; moisture; heating value; reference conditions"
      collection_method: "Reconcile meter or weighed receipts with stock change and supplier analyses for each fuel"
      unit: "kg or m3 as specified by row"
      frequency: "each receipt and monthly balance"
      temporal_coverage: "same full declared operating period"
      site_scope: "generation units inside foreground"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing; meter correction; fuel certificates"
    - protocol_id: cp_material
      process_id: "water_management"
      flow_role: "water and individual chemicals"
      record_type: "meter and dosing records"
      raw_fields: "make-up mass; return mass; chemical identity; delivered mass; concentration; stock change"
      collection_method: "Meter make-up separately from circulation; reconcile chemical dosing and purchase stocks"
      unit: "kg"
      frequency: "continuous water and each chemical batch"
      temporal_coverage: "same full declared operating period"
      site_scope: "water-conditioning system"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; dosing logs; recipe and assay"
    - protocol_id: cp_waste
      process_id: "water_management"
      flow_role: "blowdown and ash leaving site"
      record_type: "discharge and transfer records"
      raw_fields: "waste identity; mass; moisture; destination; treatment; discharged water composition"
      collection_method: "Meter discharges; weigh ash shipments; keep treatment manifests; exclude internal circulation"
      unit: "kg"
      frequency: "each transfer and monthly totals"
      temporal_coverage: "same full declared operating period"
      site_scope: "external waste exits"
      aggregation_rule: "per reference flow"
      quality_evidence: "discharge analyses; treatment and weighing records"
    - protocol_id: cp_emissions
      process_id: "heat_generation"
      flow_role: "individual air emissions"
      record_type: "stack tests; balances; leak logs"
      raw_fields: "chemical identity; compartment; stack concentration and flow; hours; fuel carbon; biogenic fraction; refrigerant charge and replacement"
      collection_method: "Integrate species-specific monitoring; if estimated retain site activity, validated factor, method and uncertainty; retain refrigerant stock balance"
      unit: "kg"
      frequency: "continuous where monitored; otherwise each test and monthly activity"
      temporal_coverage: "same full declared operating period"
      site_scope: "direct stack and fugitive sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "test reports; factor original source; mass-balance closure"
  calculation_rules:
    - id: heat_integration
      applies_to: "supplied_heat; imported_steam_heat"
      rule: "For each interval: supplied mass times supply specific enthalpy minus returned mass times return specific enthalpy minus net exported mass times baseline specific enthalpy; sum and divide by 1000 for kg and kJ/kg to yield MJ. Equal-mass closed loops reduce to mass times enthalpy difference; no-return steam uses the declared baseline."
      inputs:
        - cp_heat
      output: "net supplied heat in MJ"
      source_ids: []
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Divide the attributed period exchange total by net supplied heat in MJ; supplied_heat is 1 MJ. Apply the documented allocation before division."
      inputs:
        - cp_heat
        - cp_energy
        - cp_fuel
        - cp_material
        - cp_waste
        - cp_emissions
      output: "exchange per reference flow"
      source_ids: []
    - id: electric_conversion
      applies_to: "generation_power; delivery_power; chp_electricity"
      rule: "Multiply recorded kWh by 3.6 to obtain MJ."
      inputs:
        - cp_energy
      output: "electrical energy in MJ"
      source_ids: []
  data_quality_requirements:
    - id: quality_period
      applies_to: "all inventory rows"
      requirement: "Use one consistent full operating period and preserve seasonal operation, outages and startup."
      evidence: "meter and production logs"
    - id: quality_balance
      applies_to: "foreground"
      requirement: "Reconcile fuel, heat, water, stock and electricity balances; disclose residuals and measurement uncertainty without inventing a tolerance."
      evidence: "balance sheets and calibration"
    - id: quality_state
      applies_to: "supplied_heat"
      requirement: "No interchangeability across unmatched carrier, temperature, pressure, enthalpy baseline or gate."
      evidence: "state and supply agreement"
    - id: quality_emissions
      applies_to: "heat_generation"
      requirement: "Separate fossil and biogenic carbon; declare NOx reporting convention and particle size; estimates require traceable factors and local activity."
      evidence: "emission tests and site records"
    - id: quality_completeness
      applies_to: "all processes"
      requirement: "Add actual atomic exchanges absent from the common inventory and document route-specific absences; identify all unverified identities and missing range evidence."
      evidence: "site flow diagram and source review"
validation_rules:
  - rule_id: validate_reference
    applies_to: "supplied_heat"
    rule: "Require exactly 1 MJ output, all required qualifiers and the same denominator for every inventory row and collection protocol."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Check atomic exchange identity, flow type, product state, property, unit and public UUID support; an unresolved UUID remains explicit."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "foreground"
    rule: "Check period balances, allocation sums, double counting of purchased heat, imported/exported electricity and recycled water; unexplained residuals require correction or disclosure."
    source_ids: []
