allocation_rules:
  - rule_id: allocate_direct
    applies_to: "foreground burdens"
    rule: "First investigate subdivision or system expansion. Assign dedicated cooling, purification and recovery operations by separate metering when possible. An expanded-system result must disclose all functions and cannot masquerade as this single-gas reference."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocate_shared
    applies_to: "shared burdens"
    rule: "When earlier approaches cannot be applied, justify a relevant physical relationship. Use energy allocation only where it represents the shared process function; nonfuel products such as ammonium sulfate do not automatically share fuel-energy allocation. If physical causation is unavailable, justify an alternative relationship, with economic allocation using contemporaneous prices and quantities at the same separation stage. Retain sensitivity analysis and complete allocation fractions."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocate_interface
    applies_to: "raw gas and coproducts"
    rule: "Document the upstream coke/gas allocation and the downstream recovery allocation as distinct stages. Do not allocate an already assigned upstream burden twice. Record internal gas use as a transfer, not as a substitution credit. Waste is linked to its treatment; only supported marketable coproducts enter the coproduct allocation set."
    source_ids:
      - eu-environmental-footprint-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_gas
      process_id: "gas_dispatch"
      flow_role: "reference_gas"
      record_type: "meter and analysis"
      raw_fields: "mass or volume; temperature; absolute pressure; moisture; composition; density; LHV; accepted dry output; export and internal-use meters"
      collection_method: "Use calibrated gas meters and representative laboratory samples; reconcile dry/wet basis and matching density conditions, stock changes, exported and internal-delivered gas, vents and rejected gas"
      unit: "kg"
      frequency: "continuous meter; composition by representative campaign sampling"
      temporal_coverage: "same complete reporting period"
      site_scope: "declared gas-recovery plant"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original records; stock and meter reconciliation; sampling uncertainty"
    - protocol_id: cp_water
      process_id: "gas_cooling"
      flow_role: "cooling_water"
      record_type: "water meter"
      raw_fields: "supply; makeup; purge; loop stock change; density if volume metered"
      collection_method: "Meter external supplied cooling water and net makeup; keep internal circulation separate and reconcile volume-to-mass with measured conditions"
      unit: "kg"
      frequency: "continuous and monthly reconciliation"
      temporal_coverage: "same complete reporting period"
      site_scope: "declared gas-recovery plant"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original records; stock and meter reconciliation; sampling uncertainty"
    - protocol_id: cp_material
      process_id: "gas_cleaning"
