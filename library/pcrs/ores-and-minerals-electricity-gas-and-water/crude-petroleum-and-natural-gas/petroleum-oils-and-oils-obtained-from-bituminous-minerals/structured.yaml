allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared_operations"
    rule: "Use cp_allocation to separate directly metered crude-only, gas-only and shared operations before assigning shared burdens. Keep crude, gas and recovered products distinct; returned gas and water are internal flows."
    source_ids: []
  - rule_id: allocation_causal
    applies_to: "shared_burdens"
    rule: "Use documented process-specific causal relationships from cp_allocation. If no defensible physical relationship exists, use declared period revenue shares with actual product quantities and prices, and report a physical-allocation sensitivity. Do not assume one universal energy or mass fraction; no displacement credit for flaring or disposal."
    source_ids: []
  - rule_id: allocation_losses
    applies_to: "losses"
    rule: "Assign losses and treatment burdens to the operation that caused them, using the same declared allocation method as its products. Compare pre-allocation total balances and retain the unallocated inventory."
    source_ids: []
