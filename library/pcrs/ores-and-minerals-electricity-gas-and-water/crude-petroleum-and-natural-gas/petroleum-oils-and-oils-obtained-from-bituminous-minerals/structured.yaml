  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Divide period net exchange amount by same-period net crude output mass; assign shared burdens using cp_allocation first; reference output is 1 kg"
      inputs:
        - "exchange collection protocols"
        - cp_crude_dispatch
        - cp_allocation
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: gas_balance
      applies_to: "natural_gas_coproduct; methane"
      rule: "Reconcile recovered gas with export, internal fuel use, reinjection, venting and flaring; calculate species emissions only from measured composition and combustion efficiency, not total gas volume"
      inputs:
        - "gas meters"
        - "composition and fate records"
      output: "species emissions and gas balance"
      source_ids:
        - ifc-onshore-oil-gas-2007
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Confirm declared crude state, route and all required qualifiers; mineral feedstock or refined fuel cannot be the reference product"
      evidence: "product tests and gate records"
    - id: dq_completeness
      applies_to: "foreground"
      requirement: "Reconcile every actual exchange against the site process diagram; disclose estimates, uncertainty and recollection needs; missing data is not zero"
      evidence: "site balances, procurement, transfers and emissions"
    - id: dq_range
      applies_to: "important flows"
      requirement: "Use inferred empirical ranges only with at least two independent original-text-verified sources compatible in boundary and state; no external empirical range is prescribed here"
      evidence: "foreground records and source applicability analysis"
validation_rules:
  - rule_id: validate_reference
    applies_to: "crude_dispatch"
    rule: "Confirm reference output is 1 kg net crude and every row and collection aggregation uses the same gate, period and net-mass denominator"
    source_ids: []
  - rule_id: validate_balance
    applies_to: "foreground"
    rule: "Reconcile pre-allocation oil, gas, water and solids balances; disclose stock changes and measurement uncertainty; output mass must not duplicate assumed resource extraction"
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "direct_emissions"
    rule: "Reconcile combustion, flaring, venting and fugitive sources separately; species, mass units and air compartments must agree; NOx cannot be substituted by N2O"
    source_ids:
      - ifc-onshore-oil-gas-2007
  - rule_id: validate_uuid
    applies_to: "inventory"
    rule: "Check public flow identity, state, type, property and units for each row; unresolved identity remains a named exchange and cannot receive an unverified proxy UUID"
    source_ids: []
