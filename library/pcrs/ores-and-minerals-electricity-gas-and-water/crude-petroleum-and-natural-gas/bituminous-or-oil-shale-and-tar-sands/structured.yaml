allocation_rules:
  - rule_id: allocate_separate
    applies_to: "all inventory rows"
    rule: "First subdivide burdens using submeters and separate operation records; manage waste rock as waste without automatic co-product credits."
    source_ids: []
  - rule_id: allocate_joint
    applies_to: "all inventory rows"
    rule: "Allocate indivisible joint operations using documented physical causality; where no causal basis is established, use saleable raw-mineral dry mass in the same period and disclose moisture, total products, allocation shares and sensitivity; separately sold minerals require distinct descriptions."
    source_ids: []
  - rule_id: allocate_integrated
    applies_to: "mine-gate"
    rule: "Integrated oil-production facilities must isolate raw-mineral mining burdens with submeters; do not back-allocate retorting or bitumen-separation burdens into this raw-mineral dataset."
    source_ids:
      - usgs-oil-shale-2018
      - usgs-natural-bitumen-2003
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "The allocation procedure is this rule’s data-collection convention, not an LCA allocation standard prescribed by the geological or environmental documents above."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "mine_gate"
      flow_role: "reference product"
      record_type: "weighbridge and assay"
      raw_fields: "net handover mass; category; lot; moisture; grade; opening and closing stocks"
      collection_method: "Calibrated weighbridge and same-lot representative assays; separate handovers by mineral"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full declared period; cover seasonality"
      site_scope: "same deposit, route and handover"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, ledger and attribution records"
    - protocol_id: cp_energy
      process_id: "mine_gate"
      flow_role: "electricity"
      record_type: "meter"
      raw_fields: "meter readings; submeter attribution; onsite generation; voltage; supply region"
      collection_method: "Separate purchased and generated electricity; collect process meters and invoices"
      unit: "MJ"
      frequency: "each shift with monthly reconciliation"
      temporal_coverage: "full declared period; cover seasonality"
      site_scope: "same deposit, route and handover"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, ledger and attribution records"
    - protocol_id: cp_material
      process_id: "mine_gate"
      flow_role: "diesel; lubricant; ammonium_nitrate"
      record_type: "stock ledger"
      raw_fields: "receipts per material; opening/closing stocks; issue quantities; formulation; equipment"
      collection_method: "Reconcile net consumption by material stock and issue records; convert volume with measured density"
      unit: "kg"
      frequency: "daily with monthly reconciliation"
      temporal_coverage: "full declared period; cover seasonality"
      site_scope: "same deposit, route and handover"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, ledger and attribution records"
    - protocol_id: cp_resource
      process_id: "mine_gate"
      flow_role: "shale_resource; sand_resource"
      record_type: "survey and assay"
      raw_fields: "extracted volume; in-situ density; seam; grade; dilution; losses"
      collection_method: "Survey excavation and in-situ density; reconcile with product handover, waste rock and stocks"
      unit: "kg"
      frequency: "each survey period"
      temporal_coverage: "full declared period; cover seasonality"
      site_scope: "same deposit, route and handover"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, ledger and attribution records"
    - protocol_id: cp_air
      process_id: "mine_gate"
      flow_role: "co2; no2; pm10"
      record_type: "monitoring or activity model"
      raw_fields: "fuel and carbon content; equipment hours; factor source; particle size; receiving compartment; control efficiency"
      collection_method: "Retain measured emissions or source-by-source activity models with original public factor texts and uncertainty; do not use ambient concentration as emission mass"
      unit: "kg"
      frequency: "continuous or representative operations"
      temporal_coverage: "full declared period; cover seasonality"
      site_scope: "same deposit, route and handover"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, ledger and attribution records"
    - protocol_id: cp_water
      process_id: "site_management"
      flow_role: "water; groundwater; mine_water"
      record_type: "water meters and transfer records"
      raw_fields: "origin; abstraction; dewatering; reuse; stocks; discharge; treatment fate; samples"
      collection_method: "Build water balance from calibrated meters and transfer records; separate fresh abstraction from internal reuse"
      unit: "m3"
      frequency: "daily with monthly balance"
      temporal_coverage: "full declared period; cover seasonality"
      site_scope: "same deposit, route and handover"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, ledger and attribution records"
    - protocol_id: cp_waste
      process_id: "site_management"
      flow_role: "overburden; used_oil"
      record_type: "weighing and manifest"
      raw_fields: "waste mass; composition; hazard; receiver; transport; treatment route"
      collection_method: "Weighing or surveyed volume times measured density; retain disposal transfer and leakage records"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "full declared period; cover seasonality"
      site_scope: "same deposit, route and handover"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, ledger and attribution records"
    - protocol_id: cp_land
      process_id: "site_management"
      flow_role: "land"
      record_type: "GIS and mine plan"
      raw_fields: "land class; occupied area; dates; restoration; transformation type"
      collection_method: "Measure period-specific area*time with GIS and mine plans; separately record land transformation and restoration"
      unit: "m2*a"
      frequency: "annually and at major changes"
      temporal_coverage: "full declared period; cover seasonality"
      site_scope: "same deposit, route and handover"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, ledger and attribution records"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Divide attributable exchange totals by net raw-mineral handover mass for the same basis and period; reference product output is 1 kg."
      inputs:
        - "exchange totals"
        - cp_mass
        - "attribution records"
      output: "exchange amount per 1 kg reference flow"
      source_ids: []
    - id: dry_mass
      applies_to: "reference product"
      rule: "Dry mass = measured wet mass × (1 − same-lot wet-basis moisture mass fraction); all normalization for a dry-basis dataset uses dry mass consistently."
      inputs:
        - cp_mass
        - "paired moisture assay"
      output: "dry mass"
      source_ids: []
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "kWh × 3.6 = MJ; unit conversion, not an empirical energy-intensity factor."
      inputs:
        - cp_energy
        - kWh
      output: "MJ"
      source_ids: []
  data_quality_requirements:
    - id: quality_traceability
      applies_to: "all inventory rows"
      requirement: "Retain original records, units, attribution, time, site, technology and gaps; distinguish measurement from modelling."
      evidence: "collection protocols"
    - id: quality_balance
      applies_to: "mine-gate; site-management"
      requirement: "Reconcile raw mineral, waste rock, water and stock changes; investigate discrepancies without substituting arbitrary ranges."
      evidence: "cp_mass; cp_resource; cp_water; cp_waste"
    - id: quality_ranges
