system_boundary:
  rules:
    - rule_id: boundary_raw_mineral
      applies_to: "mine-gate"
      rule: "End the foreground boundary before any thermal conversion or bitumen separation; in-situ thermally recovered oils are not raw-mineral outputs."
      source_ids:
        - un-cpc-3-2025
        - usgs-oil-shale-2018
        - usgs-natural-bitumen-2003
    - rule_id: boundary_operations
      applies_to: "mine-gate; site-management"
      rule: "Include stripping, excavation, haulage, mechanical conditioning, pumping, waste-rock management and associated direct emissions; add separate atomic rows for actual additional chemicals."
      source_ids:
        - ifc-mining-2007
    - rule_id: boundary_lifecycle
      applies_to: "site-management"
      rule: "Attribute development and closure activities over documented lifetime production; disclose infrastructure and land transformation separately, without unexplained cutoffs."
      source_ids:
        - ifc-mining-2007
    - rule_id: boundary_water
      applies_to: "water; groundwater; mine_water"
      rule: "Record fresh abstraction, dewatering, reuse, stocks and discharge fate; do not count internal circulation as external abstraction; separate treatment transfers from direct environmental releases."
      source_ids:
        - ifc-mining-2007
boundary_abstraction:
