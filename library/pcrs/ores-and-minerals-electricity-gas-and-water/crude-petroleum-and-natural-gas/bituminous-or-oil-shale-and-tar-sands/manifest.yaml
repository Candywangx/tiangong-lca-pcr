  unresolved:
    inventory_flow_uuids:
      - row_id: "shale_resource"
        reason_code: "no_exact_candidate"
        explanation: "The public shale resource is not specifically kerogen-bearing oil shale; oil-emission candidates are wrong resource identities. No exact mass-based oil-shale resource was confirmed."
      - row_id: "sand_resource"
        reason_code: "no_exact_candidate"
        explanation: "The public oil-sand resources have Radioactivity reference properties and fixed bitumen grades. They do not establish a raw-sand Mass/kg resource flow."
      - row_id: "shale_output"
        reason_code: "no_exact_candidate"
        explanation: "Both bounded oil-shale searches returned infrastructure, chemical additive, road-asphalt or fuel products; none establishes a CPC12030 raw kerogen-bearing oil-shale product."
      - row_id: "sand_output"
        reason_code: "no_exact_candidate"
        explanation: "The candidates represent crude/refined oils, fuel, natural asphalt or paving asphalt mixtures; none establishes raw bitumen-bearing sands under CPC12030."
      - row_id: "no2"
        reason_code: "no_exact_candidate"
        explanation: "The nitrogen-dioxide search returned nitrite records, which are chemically distinct from NO2. The earlier NOx search returned N2O, also chemically distinct."
      - row_id: "pm10"
        reason_code: "no_exact_candidate"
        explanation: "The PM10 candidate is for urban high-stack emissions; other candidates are unspecified-size PM, soot or partial size bands. None establishes total PM10 to unspecified mine air."
      - row_id: "overburden"
        reason_code: "no_exact_candidate"
        explanation: "The search returned tungsten/uranium/sulfidic tailings, tailings mud or waste graphite, not barren mine waste rock with the declared disposal state."
      - row_id: "mine_water"
        reason_code: "no_exact_candidate"
        explanation: "The search returned solid mineral residues and tailings, not mine drainage water transferred to treatment by volume."
      - row_id: electricity
        reason_code: no_exact_candidate
        explanation: "The previous electricity UUID identifies waste-incineration generation at a provisional1-35kV gate and is not confirmed for this actual purchased site supply. Resolve a matching supplier/interface/geography/voltage/energy-property identity before dataset completion; retain measured electricity and its linked collection protocol."
    range_evidence_needs:
