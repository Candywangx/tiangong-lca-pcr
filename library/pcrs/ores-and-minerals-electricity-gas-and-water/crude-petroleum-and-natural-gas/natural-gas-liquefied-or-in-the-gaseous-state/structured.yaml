measurement_rules:
  - id: reference_basis
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is the positive accepted net gate-output total in kg. Exclude packaging and cancelled internal transfers. cp_output records D; every card uses per 1 kg reference flow."
  - id: conversion
    applies_to: "utility and material rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Retain raw readings. Electricity: 1 kWh = 3.6 MJ. Mass/volume conversion requires measured density, temperature and applicable pressure; retain water content and active chemical fraction."
  - id: category_balance
    applies_to: "production"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile resource/purchased feed, gas product, condensate, separated CO2, water, own-use combustion, flare, vents, stock change and measured shrinkage. Convert gas-volume meters to mass using matching measured composition, temperature, absolute pressure and compressibility; use measured LNG mass or density at loading conditions. Do not equate gas and LNG volumes. Recycled boil-off and fuel gas are internal observations, not additional product credits."
