system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "This PCR covers extracted natural gas after declared separation and conditioning, supplied in one specified gaseous or liquefied state at a metered gate. Distinguish an integrated field/LNG route from a standalone processing or liquefaction site receiving burden-bearing raw gas. Include actual compression, acid-gas removal, dehydration, mercury removal, liquefaction and boil-off recovery only where operated. A separately declared regasification terminal includes vaporization and cold/heat exchanges through its gaseous delivery gate. Transmission or shipping is included only if inside the disclosed gate boundary. Offshore field production needs its own evidence; onshore guidance cannot establish offshore operations."
      source_ids:
        - ifc-onshore-2007
        - ifc-lng-2017
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
