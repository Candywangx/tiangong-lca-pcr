allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Separate extraction, processing, liquefaction and terminal meters before assigning joint oil/gas/NGL burdens. Condensate is a distinct actual co-product with measured mass and composition. Own-use gas and recovered boil-off reduce net available supply but receive no avoided-fuel credit."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_gas_resource
      process_id: "recovery"
      flow_role: "gas_resource"
      record_type: "measurement_record"
      raw_fields: "period; site; amount; original unit; uncertainty; stock changes; route condition; allocation; D; product qualifiers"
      collection_method: "Measure the net matched-period gas mass by calibrated mass meter or composition-qualified gas volume with measured temperature, absolute pressure and compressibility. LNG uses loading mass or measured density at loading temperature. Reconcile stocks, separated liquids and internal transfers; retain conversion equations and uncertainty. cp_output independently records positive accepted gate mass D."
      unit: "kg"
      frequency: "Each meter interval or shipment; monthly reconciliation"
      temporal_coverage: "Complete year or justified representative production campaign"
      site_scope: "Metered processed gas or LNG at one declared supply gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original records; assay; balance residuals; uncertainty"
