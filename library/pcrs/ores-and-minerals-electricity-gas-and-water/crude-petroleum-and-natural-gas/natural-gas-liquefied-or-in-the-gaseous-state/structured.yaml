  calculation_rules:
    - id: normalization
      applies_to: "all cards"
      rule: "Exchange = attributable period quantity / D. Reconcile inventories and cancel internal transfers before aggregation."
      inputs:
        - cp_output
        - "row-specific cp records"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "production"
      rule: "Reconcile resource/purchased feed, gas product, condensate, separated CO2, water, own-use combustion, flare, vents, stock change and measured shrinkage. Convert gas-volume meters to mass using matching measured composition, temperature, absolute pressure and compressibility; use measured LNG mass or density at loading conditions. Do not equate gas and LNG volumes. Recycled boil-off and fuel gas are internal observations, not additional product credits."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: representativeness
      applies_to: "dataset"
      requirement: "Use matching production and exchange periods, actual technology, geography and supplier state. Record startup, shutdown, seasonal variation and substitutions."
      evidence: "collection records"
    - id: identity_and_ranges
      applies_to: "all cards"
      requirement: "Unresolved identities and missing independent range evidence remain explicit. Do not replace measurement by a guessed industry range or by missing-as-zero."
      evidence: "manifest review metadata"
validation_rules:
  - rule_id: validate_reference
    applies_to: "final_product"
    rule: "Verify 1 kg, positive D, product state, property/unit and every required qualifier. Each dataset fixes one product and route."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "site"
    rule: "Reconcile resource/purchased feed, gas product, condensate, separated CO2, water, own-use combustion, flare, vents, stock change and measured shrinkage. Convert gas-volume meters to mass using matching measured composition, temperature, absolute pressure and compressibility; use measured LNG mass or density at loading conditions. Do not equate gas and LNG volumes. Recycled boil-off and fuel gas are internal observations, not additional product credits."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "handoff"
    rule: "Verify each applicable exchange, its provider or environmental compartment and final waste fate; identify skipped checks, unresolved identities, missing measurements and upstream gaps. Errors or unassessed mandatory coverage cannot be labelled complete."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply composition-qualified natural gas as feedstock or fuel, without claiming useful-heat equivalence"
  excluded_use: "Manufactured coal gas; petroleum gas mixtures as separate products; standalone hydrogen; customer combustion; undisclosed transmission"
  required_metadata: "field/site and year; starting state; gas or LNG phase; composition and water; pressure; temperature; density measurement; net calorific value and basis; gas recovery and own use; gate; transport scope; refrigerant composition; allocation; offshore scope; measured sulfur/mercury where relevant; gas-volume reference conditions and compressibility; terminal heating route; water intake and return"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
data_sources:
  - id: "ifc-onshore-2007"
    type: "official_guidance"
    reference: "IFC, Environmental Health and Safety Guidelines for Onshore Oil and Gas Development, 30 April 2007, air and produced-water sections and Annex A, p.27. https://www.ifc.org/content/dam/ifc/doc/2000/2007-onshore-oil-gas-development-ehs-guidelines-en.pdf"
    used_for: "Formation-fluid separation, gas impurity removal, direct air sources and produced-water management; onshore scope only."
  - id: "ifc-lng-2017"
    type: "official_guidance"
    reference: "IFC, Environmental Health and Safety Guidelines for Liquefied Natural Gas Facilities, 11 April 2017, Annex A pp.21–22 and air-emissions section. https://www.ifc.org/content/dam/ifc/doc/mgrt/20170406-final-lng-ehs-guideline-april-2017.pdf"
    used_for: "Pretreatment, liquefaction, refrigerant systems and boil-off handling; no default consumption range."
  - id: "cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; no process quantities."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5, consolidated 30 December 2021. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Multifunctionality hierarchy; not a claim of complete PEF conformity."
