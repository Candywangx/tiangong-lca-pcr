system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Supply uranium AND thorium ores and concentrates at one declared mine, mineral-separation, category-confirmed ore-concentrate mill/loading gate or explicitly included plant-receipt gate. Cover actual uranium-bearing minerals/ores, physical uranium concentrates and documented compatible uranium ore concentrate (UOC), plus thorium-bearing monazite, thorite or other identified thorium ore and its compatible concentrates. Uranium is one representative, not the full category. Actual routes include uranium open-pit/underground extraction and appropriate crushing/grinding/sorting or physical concentration, thorium primary hard-rock recovery and monazite-bearing placer/mineral-sand dry mining/dredging/hydraulic recovery with actual spirals/gravity, drying, electrostatic or magnetic separation, and preparation of supplied qualified ore. Mixed heavy-mineral sand containing trace thorium is not automatically a thorium reference product; its accepted intended ore/concentrate identity must be confirmed. WCO section26.12 includes UOC/yellowcake and footnote65 moves UOC obtained by processes not normal to metallurgical industry to28.44. Therefore do not equate every concentrate with mechanically concentrated ore, or admit every chemically separated uranium/thorium compound. A chemically recovered ore-concentrate gate requires documented actual composition, processing, commodity/category and boundary review against CPC13000 and separately named CPC33610/33630; pending or contradictory classification cannot be labelled confirmed. Include actual conventional mill, heap or in situ leach, solid-liquid separation, solution recovery/precipitation and drying/calcining only when reaching an independently confirmed compatible ore-concentrate gate. An in situ route does not fabricate a mined-solid-ore intermediate. Chemical thorium oxide/nitrate/oxalate/hydroxide products require their own chemical-category review and are not forced stages of thorium mineral recovery. Further purified radioactive chemical products, uranium conversion to UF6/UO2, enrichment/isotope separation, fuel-pellet/element fabrication, reactor use and reprocessing lie outside this ore-concentrate gate. Every dataset fixes one accepted uranium or thorium product/grade/state and measures net whole-product output independently. Physical sorting and monazite separation are optional actual routes, never universal recovery or purity recipes."
      source_ids:
        - wco-uranium-thorium-2022
        - wco-uoc-boundary-2023
        - iaea-thorium-resources-2019
        - iaea-uranium-extraction-1993
        - iaea-uranium-development-1991
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
