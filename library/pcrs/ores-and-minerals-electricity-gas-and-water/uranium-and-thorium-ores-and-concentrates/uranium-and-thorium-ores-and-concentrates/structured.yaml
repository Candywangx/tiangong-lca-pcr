allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide separately metered uranium and thorium mineral recovery or downstream chemical stages first. Shared ore/mineral-sand recovery may jointly yield accepted monazite, zircon, ilmenite/rutile or another independently specified product; distinguish actual products from radioactive waste retained only for management. Use documented causal physical allocation if demonstrated, otherwise justified actual economic shares with measured quantities, observed prices/currency/period and sensitivity. Retain unallocated totals/output weights. Trace U/Th and radionuclide distributions as balance observations, not assumed valuable coproducts or automatic economic/avoided credits. Long-lived tailing/wellfield management and closure remain attributable with disclosed time scope, lifetime basis and uncertainty."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_uranium_resource
      process_id: "extraction"
      flow_role: "uranium_resource"
      record_type: "measurement_record"
      raw_fields: "period; site; amount; original unit; uncertainty; stock changes; route condition; allocation; D; product qualifiers"
      collection_method: "Match actual deposit/extracted material quantity and independently sampled elemental U or Th grade with isotope/mineral basis and stock changes; report geological resource kg of the specified element separately from whole ore kg. For in-situ extraction reconcile measured dissolved recovered element with wellfield solution and resource assessment. No pure-oxide or whole-ore grade inferred from natural isotope fraction."
      unit: "kg"
      frequency: "Each meter interval or shipment; monthly reconciliation"
      temporal_coverage: "Complete year or justified representative production campaign"
      site_scope: "One accepted uranium or thorium ore/concentrate, specified mineral or actual UOC composition, net whole-product as-received kg at fixed gate with measured moisture/grade/isotope basis; uranium ore is a representative only. Each thorium mineral concentrate or chemical UOC needs its own confirmed identity. Unresolved reference UUID and chemical-category questions remain candidate gaps, not purity or isotope defaults."
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original records; assay; balance residuals; uncertainty"
