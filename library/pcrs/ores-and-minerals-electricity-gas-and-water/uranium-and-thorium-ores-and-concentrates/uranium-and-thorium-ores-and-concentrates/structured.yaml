measurement_rules:
  - id: reference_basis
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is the positive accepted net gate-output total in kg. Exclude packaging and cancelled internal transfers. cp_output records D; every card uses per 1 kg reference flow."
  - id: conversion
    applies_to: "utility and material rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Retain raw readings. Electricity: 1 kWh = 3.6 MJ. Mass/volume conversion requires measured density, temperature and applicable pressure; retain water content and active chemical fraction."
  - id: category_balance
    applies_to: "production"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile independently measured accepted selected whole-product D, ore/feed, co-minerals/co-products, mineral or leach residues, water, dissolved streams, dust and stocks. kg_dry=kg_as_received*(1-free_moisture_fraction); U/Th elemental assays, mineral phase composition, hydration and oxide-equivalent reporting are separate measured fields, not D. An oxide-equivalent assay does not prove pure oxide product or fixed stoichiometry. Isotope fraction within U differs from isotope mass fraction of whole ore. Track water abstraction/recycle/discharge/seepage/evaporation with actual compartments. For in situ recovery use measured extracted dissolved U/Th and wellfield solution balance, not imaginary mined ore. Track each measured radionuclide independently with activity unit/reference date/decay and parent-daughter disequilibrium; no secular-equilibrium, radon-release, retained tailing-activity or dose default. Accepted output and grade are measured independently, never feed minus assumed waste or a fixed recovery yield."
