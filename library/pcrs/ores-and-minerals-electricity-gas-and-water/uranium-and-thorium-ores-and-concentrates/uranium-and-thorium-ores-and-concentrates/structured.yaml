published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply one independently accepted declared-grade uranium or thorium ore/concentrate at a confirmed compatible gate"
  excluded_use: "Separately classified purified uranium/thorium compounds or radioactive residues as ore reference; unreviewed chemical concentrate; conversion/enrichment/isotope separation; fuel pellets/elements, reactor use/reprocessing; generic mixed sand with no confirmed uranium/thorium ore identity; unrelated rare-earth mineral as proxy"
  required_metadata: "Uranium/thorium family; mineral/deposit/natural origin; ore versus mineral concentrate versus actual UOC composition; documented category/gate compatibility and chemical-processing review; primary/placer/mill/heap/in-situ/supplied route; accepted grade/size; U and Th assays on explicit dry or wet basis; isotope fractions within uranium separately from elemental uranium within whole ore; moisture/structural water; net independently measured positive D; radionuclide activity, disequilibrium and reference date; actual supplier/geography/voltage/period; water and residue compartments/fates; development/closure/cutoff/lifetime; joint outputs and allocation. No universal ore grade, U3O8 purity, isotope enrichment, yield, recipe or dose."
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
data_sources:
  - id: "wco-uranium-thorium-2022"
    type: "official_guidance"
    reference: "WCO HS Nomenclature2022 Chapter26, Note2 and heading2612, original PDFpp.1–2. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0526_2022e.pdf?la=en"
    used_for: "Both uranium and thorium ore/concentrate mineral categories and normal-metallurgical-process boundary; no new HS mapping."
  - id: "wco-uoc-boundary-2023"
    type: "official_guidance"
    reference: "WCO Strategic Trade Control Enforcement Implementation Guide2023, section26.12, original PDFp.60 / printedp.58 including footnote65. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/enforcement-and-compliance/tools-and-instruments/stce-implementation-guide/stce-implementation-guide-2023-en.pdf?la=en"
    used_for: "Uranium ore concentrate/yellowcake can belong to ore heading; processes not normal to metallurgical industry move UOC to28.44. Actual gate/category review required; no generic drum mass, purity or automatic chemical-product admission."
  - id: "iaea-thorium-resources-2019"
    type: "official_guidance"
    reference: "IAEA, Thorium Resources as Co- and By-products of Rare Earth Deposits, IAEA-TECDOC-1892,2019, section5.3.1.1–5.3.1.2, original PDFpp.39–40 / printedpp.30–31. https://www-pub.iaea.org/MTCD/Publications/PDF/TE-1892web.pdf"
    used_for: "Actual thorium-bearing monazite mineral-sand dry/wet extraction, spirals/gravity, drying/electrostatic/magnetic separation, co-minerals and separate downstream hydrometallurgy. No fixed Th content, purity, yield or dose."
  - id: "iaea-uranium-extraction-1993"
    type: "official_guidance"
    reference: "IAEA, Uranium Extraction Technology, Technical Reports Series359,1993, original PDFpp.54–56 / printedpp.35–37 Figure3.1 and PDFpp.63–64 / printedpp.44–45 Table4.2, sections3 and4.3. https://www-pub.iaea.org/MTCD/Publications/PDF/trs359_web.pdf"
    used_for: "Site-dependent uranium physical preconcentration/radiometric sorting and conditional acid/alkaline mill recovery, solid-liquid separation, IX/SX, precipitation/drying/calcining. Historical commercial limitations and mineralogy retained; no default recipe or recovery."
  - id: "iaea-uranium-development-1991"
    type: "official_guidance"
    reference: "IAEA, Guidebook on the Development of Projects for Uranium Mining and Ore Processing, IAEA-TECDOC-595,1991, original PDFpp.136,148 / printedpp.139,151, sections12.2.3 and14. https://www-pub.iaea.org/mtcd/publications/pdf/te_0595.pdf"
    used_for: "Actual uranium mine development/haulage/ventilation and water, dust, radon, radionuclide-bearing waste/closure; conditional lime/barium-chloride treatment. No historic pH, activity or consumption default."
  - id: "cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; no process quantities."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5, consolidated 30 December 2021. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Multifunctionality hierarchy; not a claim of complete PEF conformity."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:9e6fb015ac84a4566cee3088e193e009a695d18915d89a0c989c218da3cd9f2b"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_8644"
      family: "system_boundary"
      span:
        start:
          offset: 8644
          line: 55
          column: 1
        end:
          offset: 13937
          line: 74
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual identified geological uranium/thorium deposit with attributable mine/wellfield development and closure, or qualified external ore/mineral-concentrate lot with named upstream provider. Explicitly declare extraction versus supplied-feed operation, classification-confirmed ending gate, cutoff and equipment/wellfield lifetime-output allocation. Purchased ore is not zero-burden; internal recycling is not new supply. |\n| starting_condition_role | Resource or supplied feed; declare which |\n| product_classification_scope | Uranium and thorium ores and compatible concentrates, including identified thorium-bearing monazite/thorite mineral grades and documented category-compatible UOC; one declared whole-product grade/gate per dataset |\n| recursive_input_rule | Purchased same-category material carries a distinct supplier dataset; internal recycling is a balance observation, not a new external input or credit. |\n| upstream_dataset_requirement | Link feed, electricity, fuels, chemicals, infrastructure and waste-management burdens; disclose any missing coverage. |\n| disclosure | Uranium/thorium family; mineral/deposit/natural origin; ore versus mineral concentrate versus actual UOC composition; documented category/gate compatibility and chemical-processing review; primary/placer/mill/heap/in-situ/supplied route; accepted grade/size; U and Th assays on explicit dry or wet basis; isotope fractions within uranium separately from elemental uranium within whole ore; moisture/structural water; net independently measured positive D; radionuclide activity, disequilibrium and reference date; actual supplier/geography/voltage/period; water and residue compartments/fates; development/closure/cutoff/lifetime; joint outputs and allocation. No universal ore grade, U3O8 purity, isotope enrichment, yield, recipe or dose. |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_operations | site | Supply uranium AND thorium ores and concentrates at one declared mine, mineral-separation, category-confirmed ore-concentrate mill/loading gate or explicitly included plant-receipt gate. Cover actual uranium-bearing minerals/ores, physical uranium concentrates and documented compatible uranium ore concentrate (UOC), plus thorium-bearing monazite, thorite or other identified thorium ore and its compatible concentrates. Uranium is one representative, not the full category. Actual routes include uranium open-pit/underground extraction and appropriate crushing/grinding/sorting or physical concentration, thorium primary hard-rock recovery and monazite-bearing placer/mineral-sand dry mining/dredging/hydraulic recovery with actual spirals/gravity, drying, electrostatic or magnetic separation, and preparation of supplied qualified ore. Mixed heavy-mineral sand containing trace thorium is not automatically a thorium reference product; its accepted intended ore/concentrate identity must be confirmed. WCO section26.12 includes UOC/yellowcake and footnote65 moves UOC obtained by processes not normal to metallurgical industry to28.44. Therefore do not equate every concentrate with mechanically concentrated ore, or admit every chemically separated uranium/thorium compound. A chemically recovered ore-concentrate gate requires documented actual composition, processing, commodity/category and boundary review against CPC13000 and separately named CPC33610/33630; pending or contradictory classification cannot be labelled confirmed. Include actual conventional mill, heap or in situ leach, solid-liquid separation, solution recovery/precipitation and drying/calcining only when reaching an independently confirmed compatible ore-concentrate gate. An in situ route does not fabricate a mined-solid-ore intermediate. Chemical thorium oxide/nitrate/oxalate/hydroxide products require their own chemical-category review and are not forced stages of thorium mineral recovery. Further purified radioactive chemical products, uranium conversion to UF6/UO2, enrichment/isotope separation, fuel-pellet/element fabrication, reactor use and reprocessing lie outside this ore-concentrate gate. Every dataset fixes one accepted uranium or thorium product/grade/state and measures net whole-product output independently. Physical sorting and monazite separation are optional actual routes, never universal recovery or purity recipes. | `wco-uranium-thorium-2022`, `wco-uoc-boundary-2023`, `iaea-thorium-resources-2019`, `iaea-uranium-extraction-1993`, `iaea-uranium-development-1991` |\n| boundary_partition | all exchanges | Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases. |  |\n| boundary_completeness | inventory | Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished. |  |\n\n"
      headings:
