allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide extraction and distinct pyrite-recovery/drying/micronizing circuits where possible. Retain unallocated jointly mined copper/pyrite/other mineral inventory; use demonstrated physical causality or matched payable-grade/price economic allocation and sensitivity. One mixed pyrite concentrate with trace metals is one physical output, not simultaneous contained-metal output masses. Separate current joint tails, purchased mineral product and genuinely waste-classified old tails with documented upstream allocation/cut-off and actual recovery/rehabilitation burdens; neither historical tails nor idle equipment is automatically burden-free. Development/closure attributed once over measured lifetime output. No automatic credit for avoided acid drainage, tailings disposal, elemental sulfur, virgin pyrite or recycled water."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
