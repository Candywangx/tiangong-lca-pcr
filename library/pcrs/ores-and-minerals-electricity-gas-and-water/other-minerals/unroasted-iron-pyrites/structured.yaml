    rule: "D is independently weighed positive accepted net as-received unroasted mineral kg at selected gate, excluding packaging/rejects. Measure wet-basis free-water fraction w with0 <= w <1; dry mineral mass = D*(1-w). Measured dry-basis sulfur fraction gS with0 <= gS <=1 gives contained S kg = D*(1-w)*gS; keep D denominator. Distinguish total S, sulfide S, sulfate S and measured mineral phases; do not infer pure FeS2 content or recovery from theoretical sulfur/iron stoichiometry. Reconcile dry solids and Fe/S plus relevant impurities across feed, accepted grades, separate copper/other co-products, tails/rejects, dust, stock and actual oxidation/dissolution losses. Recovery uses matched dry feed/output masses and assays with stock corrections, never concentrate grade alone. Purchased sulfuric acid adds sulfur separately from geological sulfide; neutralization residues and measured sulfate transfers/releases retain species versus elemental-S basis. Reconcile new/recycled/evaporated/discharged water separately. Drying/handling must retain declared unroasted phase; oxidized/roasted output requires classification review. Stored stock, heat/moisture and actual sulfide loss are measured, not assumed zero or automatic SO2; downstream roasting/acid yield is outside."
