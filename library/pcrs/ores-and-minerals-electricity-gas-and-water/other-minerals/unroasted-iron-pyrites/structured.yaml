system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Supply of natural unroasted iron-pyrites mineral ore, mineral concentrate or powder at one declared mine, preparation/loading or expressly included delivery gate. Include actual surface/underground extraction and ore-only loading, or actual physical recovery from jointly mined mineral feed, freshly generated mineral-beneficiation tailings or independently identified old mineral-tailings stocks. Purchased ore/concentrate and waste-classified old tailings have separate provider/fate and upstream allocation or justified cut-off; they are not interchangeable zero-burden feeds. Actual crushing/screening/sorting, gravity/magnetic separation, grinding/flotation, thickening/filtering, free-water drying, pulverization/sizing and packaging are conditional on product and mineralogy, not mandatory flotation or a recipe copied from a copper-mine case. Retain unroasted iron-disulfide mineral identity with measured Fe/S, pyrite phase, impurity and moisture evidence. Other iron-disulfide mineral variants require independent category/phase confirmation; pyrrhotite, chalcopyrite and arsenopyrite are not automatically this product because they contain iron and sulfur. Natural pyrite recovered from geological mineral tailings may qualify with actual state/grade proof; synthetic iron disulfide, smelter slags, chemically precipitated sulfides, roasted pyrite/cinder, iron oxide concentrates, elemental sulfur, sulfur dioxide and sulfuric acid are different products. Roasting, chemical sulfur extraction, smelting and downstream steel/glass/abrasive-wheel manufacture lie outside the unroasted mineral gate. Include attributable mine development/rehabilitation, tailings, acid-drainage/water and dust controls, actual storage losses and explicitly agreed delivery through the selected gate."
      source_ids:
        - epa-pyrite-recovery-1994
        - wco-hs25-2022
        - ifc-mining-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
