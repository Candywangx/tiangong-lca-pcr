system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Supply of salt and pure sodium chloride, including actual rock salt, harvested solar salt, vacuum/open-pan salt, refined grades, declared aqueous NaCl solutions, table or denatured salt and actual anti-caking/free-flowing variants that retain salt product identity; also supply of sea water itself at a separately declared intake/loading or receipt gate. Each dataset fixes one accepted product state, route and gate, not a weighted mixture of solid salt and sea water. Salt routes include actual mining or solution extraction, sea/saline-water intake, solar concentration/harvesting, supplied-salt dissolution or washing, brine purification, mechanical evaporation/crystallization, dewatering/drying, additive dosing and packaging only where performed. Sea-water product supply includes actual marine abstraction, pumping, screening/filtration, storage and declared delivery without forcing concentration, evaporation, crystallization or desalination. Sea water remains mixed saline water, not pure NaCl or freshwater. Externally supplied sea water/brine is a product input with upstream provider, distinct from elementary marine-water abstraction; internal brine transfers cancel. Include attributable intake/pond/mine development, lifetime rehabilitation, controls, wastes and measured releases through the gate. Chloralkali, soda ash, desalinated fresh water, food formulation and downstream salt use are separate downstream product systems. Cultured NaCl crystals for optical or other separately classified articles and medicines are outside this bulk-material supply scope."
      source_ids:
        - bgs-salt-2006
        - usgs-salt-2018
        - wco-salt-2022
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
