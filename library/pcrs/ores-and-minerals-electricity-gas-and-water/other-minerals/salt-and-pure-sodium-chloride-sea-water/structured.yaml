allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide mine/intake, purification, evaporation and independently handled grades wherever possible. Retain unallocated inventories for actual joint NaCl, bittern and separately recovered calcium/magnesium/potassium salts; demonstrate physical causality or use matched economic allocation with price sensitivity when needed. Bittern or purification sludge is not automatically a saleable co-product; document composition, specification and actual fate. Account for recovered/purchased-brine supplier burdens and any justified cut-off, not zero burdens by origin. Allocate attributable intake/pond/well/mine development and closure once over measured lifetime accepted output; storage-cavern downstream use gives no automatic credit. No default avoided salt, chemical, desalinated-water or disposal credits."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
