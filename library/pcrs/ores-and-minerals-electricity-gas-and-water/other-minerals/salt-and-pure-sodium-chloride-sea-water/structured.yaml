published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply1 kg net accepted as-received product in one declared salt, NaCl solution or sea-water state; solution/sea-water kg is not dry salt kg"
  excluded_use: "Chlorine, caustic soda, soda ash and other chemical transformations; desalinated freshwater; other isolated mineral salts as the reference product; formulated foods or medicines, cultured/optical NaCl articles, downstream uses and transport-only services"
  required_metadata: "site/year; one product state and selected gate; actual rock/solution/solar/mechanical evaporation/refining/sea-water supply route; origin/geology or marine intake coordinates and season; accepted net mass and stocks/returns; salt free moisture and dry-basis NaCl assay; solution NaCl mass fraction; sea-water salinity method and ionic composition, not salinity as pure NaCl; measured density at temperature if volume conversion; grade/particle size; each actual additive and fraction; bulk/bagged/tank/pipeline; upstream provider and allocation; transport included; pond climate and measured water/ion balance; waste fate/discharge compartment; attributable lifetime development/closure. Representative UUID is only compatible ≥99.5% NaCl Product/Mass at plant, never all salts, brine or sea water"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
data_sources:
  - id: "bgs-salt-2006"
    type: "official_guidance"
    reference: "BGS, Highley, Bloodworth and Bate, Mineral Planning Factsheet: Salt, January 2006, original pp.6–7. https://nora.nerc.ac.uk/id/eprint/534431/1/mpf_salt.pdf"
    used_for: "Qualitative rock/solution extraction, brine purification and plant transport states; historical UK assays, yields, reserve recovery, waste totals and zero-waste claims are not general defaults."
  - id: "usgs-salt-2018"
    type: "official_guidance"
    reference: "USGS, Wallace P. Bolen, 2018 Minerals Yearbook: Salt, June2023 advance release, original PDF p.2 / printed63.1. https://pubs.usgs.gov/myb/vol1/2018/myb1-2018-salt.pdf"
    used_for: "Actual rock, solution-brine, solar and vacuum/open-pan routes and solar climate/season geography; USGS anhydrous brine statistics are not as-received solution mass. No historical capacities or intensities adopted."
  - id: "wco-salt-2022"
    type: "official_guidance"
    reference: "WCO HS Nomenclature2022 Chapter25, original PDF p.1 heading2501 and Notes1–2. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0525_2022e.pdf?la=en"
    used_for: "Salt, pure NaCl, aqueous solutions, anticaking/free-flowing variants and sea water product-state scope; no new HS mapping or production quantity."
  - id: "cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; no process quantities."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5, consolidated 30 December 2021. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Multifunctionality hierarchy; not a claim of complete PEF conformity."
