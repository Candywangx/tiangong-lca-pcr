measurement_rules:
  - id: reference_basis
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is the positive accepted net gate-output total in kg. Exclude packaging and cancelled internal transfers. cp_output records D; every card uses per 1 kg reference flow."
  - id: conversion
    applies_to: "utility and material rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Retain raw readings. Electricity: 1 kWh = 3.6 MJ. Mass/volume conversion requires measured density, temperature and applicable pressure; retain water content and active chemical fraction."
  - id: category_balance
    applies_to: "production"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is independently measured positive accepted net as-received kg of exactly the selected gate product, excluding packaging, rejects and returns; do not derive D from resource input or an assumed yield. Solid salt: dry solids = D*(1-w), with measured free-water fraction0 <= w <1; dry-basis NaCl fraction x gives NaCl mass D*(1-w)*x, with additives separately assayed. Solution: actual NaCl mass = D*c using measured as-received NaCl mass fraction c. Sea water: D = sum of independently metered shipment V times measured matching density rho if not directly weighed; temperature/salinity and composition matched to each batch; no default rho, salinity or NaCl fraction. Total dissolved-salt salinity is not NaCl assay. Keep D as denominator in every case and disclose dry/active equivalent only as supplementary qualifiers. Reconcile water and sodium/chloride or measured ionic balances, rainfall, measured pond evaporation/seepage, each co-salt/bittern, moisture, rejects and stock changes on consistent period/basis. Cancel internal circulating brine once. One dataset never sums solid salt, solution and sea water into D."
