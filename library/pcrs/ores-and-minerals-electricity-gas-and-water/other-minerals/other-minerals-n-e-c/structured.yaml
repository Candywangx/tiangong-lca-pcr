published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply1 kg accepted net as-received product of one qualifying mineral/magnesia family/state/gate, not1 kg contained carbon/silica/MgO-equivalent, one fiber count, or a manufactured article"
  excluded_use: "Other specifically categorized minerals; expanded/exfoliated perlite/vermiculite/chlorites, synthetic/intercalated/expanded graphite, fabricated electrodes/anode mixtures, synthetic silica/cultured quartz, magnesium metal/salts/hydroxide reference products, formulated refractories/articles; other unreviewed chemical/agglomerate gate. Explicitly admitted otherMgO is retained"
  required_metadata: "site/year; actual family/geological versus otherMgO precursor origin and provider; raw/prepared/calcined/sintered/fused/aqueousMgO gate and mineral phase/formula/hydration; free versus structural water and carbonate/organic loss; actual dry/as-received mineral/carbon/silica/MgO assay versus equivalent; siliceous-earth apparent specific gravity <=1 and method; graphite natural versus synthetic/intercalated state; unexpanded mineral state; asbestos type and fiber size/mass/count method; actual route and every reagent/admixture; common positive whole-product D and stocks/recovery; suppliers/voltage/heat/fuel/water; residues/releases/fates, construction/closure lifetime, co-products/allocation, packaging/delivery. Natural graphite Product/Mass reference identity remains unresolved: a generic graphite name does not confirm natural production. Every other family and MgO state requires its own confirmed product identity. Current CPC3 HS2022 correspondence and residual/admixture/thermal gate qualifications require review"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
