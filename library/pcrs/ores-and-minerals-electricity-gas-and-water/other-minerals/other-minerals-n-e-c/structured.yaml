system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Cover the complete other-minerals category: natural graphite powder/flakes/other natural forms; quartz distinct from silica sand/quartzite; siliceous fossil meals such as diatomite/kieselguhr/tripolite and similar siliceous earths qualifying at apparent specific gravity not more than1; natural magnesium carbonate(magnesite), fused magnesia, dead-burned(sintered) magnesia with or without qualifying small amounts of other oxides added before sintering, and other magnesium oxide whether or not pure, including actual caustic-calcined and synthetic MgO supply; asbestos(crocidolite and other actually identified asbestos minerals); mica crude/split/powder; natural steatite/talc in admitted crude/crushed/powder or rough-trimmed/merely rectangular-cut forms; feldspar; leucite, nepheline and nepheline syenite; unexpanded vermiculite, perlite and chlorites; another residual mineral only with individually reviewed identity and no more-specific-category assignment. Current CPC3 notes/detail give16390 title only; historical official CPC2.1 HS2012/2017 correspondences list250410/250490/250610/251200/251910/251990/252410/252490/252510/252520/252610/252620/252910/252930/253010. Use that and original HS2022 product-state evidence as a candidate full boundary, not a newly accepted current correspondence. The shared253090 chemical/other residual heading is not automatically swept into16390. Each dataset fixes one actual family/state/gate and net whole product mass. Distinct conditional routes include ore-only sorting/loading; actual crushing/grinding/sieving/washing/gravity/magnetic/flotation separation; controlled fiber separation for an identified asbestos mineral; splitting/grinding mica; talc/steatite preparation or admitted rough cut; and unexpanded mineral extraction/size preparation. Actual graphite chemical washing is admitted only where impurities are removed without changing graphite structure and the mineral gate qualifies under HS25Note1; do not infer natural origin from generic graphite, impose flotation universally, or prescribe a reagent recipe. Do not impose a universal uncalcined/physical-only restriction: HS2512 explicitly admits calcined siliceous fossil meals, and EPA describes natural-milled, straight-calcined(sintered) and actual soda-ash flux-calcined particle-agglomeration routes. Include the actual qualifying mineral product and apparent-gravity test; flux addition, sintering and crystalline-silica phase changes require their own measured gate/balance, not all manufactured agglomerates or filter articles. HS2519 explicitly admits fused, dead-burned/sintered and otherMgO whether pure; magnesia may have mineral, seawater/brine or supplied precursor origin and actual precipitation/recovery/washing/calcination/sintering/fusion route. OtherMgO is not excluded merely as a manufactured chemical; the actual MgO gate, feed provider, phase/composition and route are independently established, not a universal brine recipe or pure-MgO assumption. Actual aqueous recovery protocols require the plant reaction/precipitation and every reagent to be documented; a source reporting feed origins does not establish doses or universal processing. USGS OF01-341 explicitly describes actual magnesite crushing and grade-selected flotation/heavy-medium/kiln routes; separate caustic calcination and dead-burning circuits; and seawater/well-brine pretreatment followed by dry/slaked-lime Mg(OH)2 precipitation, thickening, freshwater washing, filtration, then direct calcination or calcination/pelletizing/dead-burning. These are historical route examples: adopt only the actual documented plant variant, not universal stage counts, furnace temperatures, reagent doses or fixed output grade. Any actual acid, dry lime, other reagent, pretreatment precipitate or release requires its own concrete exchange before dataset completion. Other families follow HSNote1 unless a specific exception applies. Unexpanded perlite/vermiculite/chlorites exclude expanded/exfoliated products; natural graphite excludes synthetic/intercalated/expanded carbon and finished electrodes/anode mixtures, while pure natural grades are not excluded solely by purity. Exclude separately categorized metal ores, chemical minerals, salt/sulphur/phosphates/pyrites, chalk/dolomite/clay/gypsum/building stone/sand/abrasives/gems, and magnesium metal/hydroxide/chloride/sulfate reference products, synthetic silica or cultured quartz, formulated binders/refractories and worked articles. Dolomite/brucite or magnesium hydroxide may be actual feed to an included MgO gate but do not become this category as independently sold feed. No automatic classification of another chemical/expanded/agglomerated/article gate. Include actual development/closure, infrastructure, preparation, admitted recovery/thermal routes, air/water/land controls, residues/storage/loading and expressly included delivery."
      source_ids:
        - wco-other-minerals-2022
        - unsd-other-minerals-scope-2026
        - epa-diatomite-processing-1995
        - usgs-magnesia-states-2023
        - usgs-magnesia-processing-2001
        - usgs-natural-graphite-2022
        - ifc-mining-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
