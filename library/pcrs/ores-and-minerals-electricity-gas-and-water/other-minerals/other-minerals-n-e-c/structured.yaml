      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_hierarchy | joint production | Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory. | `ef-allocation-2021` |\n| allocation_product | reference and co-products | Subdivide actual mineral family extraction/preparation and MgO aqueous/thermal states, retaining unallocated joint inventory and independently accepted grades/co-products. Assayed constituents within one sold mineral or MgO grade are not separate co-products; joint feldspar/quartz/mica or recovered magnesia/salt products require independent specification/mass/fate and supported physical causality or matched-period economic allocation with sensitivity. Recirculated dust/precipitate/wash water are internal transfers, not avoided virgin material credits. Rejects/captured dust and mother liquor are waste unless independently justified saleable product. Account supplier feed, precursor and external treatment burdens or justified cut-off; allocate lifetime infrastructure/development/closure once over measured accepted production. No automatic avoided chemical, filter-aid, expanded-mineral, refractory or waste-disposal credit. |  |\n| allocation_waste | waste and recycling | Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once. |  |\n\n"
