          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| validate_reference | final_product | Verify 1 kg, positive D, product state, property/unit and every required qualifier. Each dataset fixes one product and route. |  |\n| validate_balance | site | Independently weigh positive net accepted as-received whole product total D kg at one actual gate, excluding packaging/rejects/returns and matching stocks; every exchange uses the same D denominator. For measured wet-basis free-water fraction w,0 <= w <1, dry mass = D*(1-w). Measure moisture by a phase-preserving method; hydrate/dehydroxylation water, graphite organic contaminants, carbonate CO2 and thermal loss-on-ignition are not automatically free water. For actual dry-basis confirmed phase/species fraction g, contained species = D*(1-w)*g. Graphitic carbon fraction differs from total organic carbon/ash and synthetic carbon; silica assay does not alone identify quartz versus amorphous/opaline silica/cristobalite, nor talc/feldspar/perlite purity. MgO-equivalent from as-Mg is an analytical conversion: MgO-equivalent mass = Mg mass*M(MgO)/M(Mg); actual MgO phase/purity requires its own assay, not assumed conversion of all Mg. MgCO3/Mg(OH)2 feed uses independently measured composition, phase and matched Mg balance; calcined/sintered/fused output has independent D, hydration/carbonate/impurity and phase assays. Actual carbonate calcination CO2 is geological feed carbon distinct from fossil-fuel combustion; no universal stoichiometric yield or temperature. AqueousMgO recovery reconciles dissolved Mg in actual intake, precipitate, mother liquor, wash water, retained salts, product/waste and stocks using species-specific assays; seawater/brine mass is not Mg mass, internal precipitate transfer cancels. Mg(OH)2 precursor dehydroxylation water is a thermal phase-change output, not incoming free water; separately reconcile actual Mg, calcium, carbonate, sulfate, chloride and reaction water in pretreatment precipitates, wash filtrate, mother liquor and MgO product. Assay the actual precursor and output instead of assuming quantitative conversion or pure MgO. Actual flux-calcined diatomite reconciles mineral feed, sodium-carbonate flux, sintered/agglomerated phases, carbonate/water off-gas, rejected fines/dust and accepted output; verify apparent specific gravity with documented test, not particle density or unqualified bulk volume. Asbestos exchanges use measured net fiber mineral mass in kg with independent type/dimensions and microscopy/count metadata; fiber count/length/concentration alone is not kg, any count-to-mass conversion needs measured size/density distribution and independent uncertainty. Reconcile whole dry solid/mineral/Mg/carbon balances, each co-product, tailings/rejects/captured dust and losses, plus fresh/recycled/evaporated/discharged water. Recovery uses matched feed/output contained species after stocks, not product grade alone; no assumed purity, yield, dose, zero loss or resource-credit default. |  |\n| validate_coverage | handoff | Verify each applicable exchange, its provider or environmental compartment and final waste fate; identify skipped checks, unresolved identities, missing measurements and upstream gaps. Errors or unassessed mandatory coverage cannot be labelled complete. |  |\n\n"
