allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide actual mineral family extraction/preparation and MgO aqueous/thermal states, retaining unallocated joint inventory and independently accepted grades/co-products. Assayed constituents within one sold mineral or MgO grade are not separate co-products; joint feldspar/quartz/mica or recovered magnesia/salt products require independent specification/mass/fate and supported physical causality or matched-period economic allocation with sensitivity. Recirculated dust/precipitate/wash water are internal transfers, not avoided virgin material credits. Rejects/captured dust and mother liquor are waste unless independently justified saleable product. Account supplier feed, precursor and external treatment burdens or justified cut-off; allocate lifetime infrastructure/development/closure once over measured accepted production. No automatic avoided chemical, filter-aid, expanded-mineral, refractory or waste-disposal credit."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
