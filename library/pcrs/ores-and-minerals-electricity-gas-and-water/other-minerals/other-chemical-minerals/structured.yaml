published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply1 kg accepted net as-received product of one actual natural chemical-mineral family/state/gate, not1 kg pure BaSO4, BaCO3, CaF2, elemental boron/fluorine or B2O3 equivalent"
  excluded_use: "Manufactured salts/acids/oxides and HF/elemental fluorine; brine-separated borates; natural boric acid above85% H3BO3 dry weight; formulated mixtures/finished articles; minerals of another specific category; unreviewed residual or thermal identity"
  required_metadata: "site/year; actual family and geological origin; mineral phase/formula, raw/prepared/concentrate/calcined gate, residual no-other-category review; free water and structural water method; dry/as-received assay and impurities, BaSO4 versus BaCO3, CaF2 versus F, B versus B2O3 equivalent and natural H3BO3 criterion; actual thermal phase/mass losses; supplier/geography/voltage electricity and fuel/water origin; mine/preparation route and each actual reagent; stocks/co-products/residues/releases/fates; lifetime construction/closure and allocation; packaging/transport. Representative natural-barite Product/Mass UUID unresolved; a baryte elementary resource is not this product. Each other family gate needs its own confirmed natural product identity; current CPC3 HS2022 correspondence and residual family assignment require independent review"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
