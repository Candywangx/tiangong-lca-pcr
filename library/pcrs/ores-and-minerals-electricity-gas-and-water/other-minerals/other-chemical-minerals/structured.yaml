allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide family extraction, physical preparation, admitted thermal treatment and shared controls. Retain unallocated joint inventories and independently accepted co-output amounts/specifications; impurities within one accepted mineral are not separate co-products. Separate fluorspar/metal concentrates or barite/other recovered mineral products with actual causality, or matched period price/grade economic allocation and sensitivity when causality is unavailable. Rejects are waste unless independently established as saleable product with fate; purchased same-family feed carries upstream burden or justified cut-off. Attribute development/closure once over measured lifetime accepted outputs. No automatic avoided synthetic salt, acid, fertilizer, drilling fluid or waste-disposal credits."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
