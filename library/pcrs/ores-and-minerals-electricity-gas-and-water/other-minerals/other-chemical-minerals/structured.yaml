  calculation_rules:
    - id: normalization
      applies_to: "all cards"
      rule: "Exchange = attributable period quantity / D. Reconcile inventories and cancel internal transfers before aggregation."
      inputs:
        - cp_output
        - "row-specific cp records"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "production"
      rule: "Independently weigh positive accepted net as-received gate total D kg excluding packaging/rejects/returns and matching stocks; every exchange divides by the same selected-product D. For measured wet-basis free-water fraction w,0 <= w <1, dry mass = D*(1-w); use a phase-preserving moisture method, not ignition loss that removes hydrate water or carbonate CO2. For measured dry-basis actual mineral/species fraction g, contained species mass = D*(1-w)*g; state mineral formula/hydration and assay method. Barite is BaSO4, witherite BaCO3; assay reported as Ba converts to the declared species using molar-mass ratio only with confirmed speciation, not one interchangeable barium product. Fluorite is CaF2; as-F assay converts to CaF2 using M(CaF2)/(2*M(F)) only when that F is confirmed in fluorite; fluoride-ion/other F species are separate. Boron assay as-B2O3 equivalent is not actual oxide: elemental B mass = B2O3-equivalent mass*2*M(B)/M(B2O3), preserving assay basis and without asserting a borate mineral purity. Natural H3BO3 dry fraction gH <=0.85 requires measured species and geological origin; as-B alone cannot establish H3BO3 if other borates are present. Identify kieserite/epsomite and retained hydration independently; neither crystal-water release nor sulfate assay establishes free water or pure MgSO4. Actual admitted calcination uses independent input/output weighing, phases, free/structural water, carbonate CO2 and dust balances; no unchanged hydrate mass, fixed yield or assumed conversion. Recovery uses matched input/output contained identified species after stock correction, not output grade alone. Reconcile feed solids, accepted grades, actual co-products, waste rock/tails/dust, thermal losses and stocks, plus fresh/recycled/evaporated/discharged water separately. No empirical purity, yield, reagent dose or utility intensity defaults."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
      source_ids: []
