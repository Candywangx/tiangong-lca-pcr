system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Cover the full residual natural chemical-mineral category, not only barytes: natural barium sulphate (barite/barytes), natural barium carbonate (witherite), natural borates/concentrates (including actual colemanite, tincal, ulexite or another separately identified natural borate), qualifying naturally occurring boric acid, fluorspar, natural magnesium sulphates kieserite and epsomite, and other individually demonstrated qualifying natural chemical minerals such as strontianite or celestine. Residual coverage is open to an actual named geological chemical mineral only after confirming its identity/state and absence from another more specific mineral category; it is not all minerals under shared HS253090. Current CPC3 notes/detail name16190 without family explanation or current HS2022 correspondence; official CPC2.1 historical correspondences identify HS251110/251120/252800/252921/252922/253020 and shared253090. These and original HS2022 states support this candidate boundary, not a claimed current accepted HS mapping. Raw, sorted, washed, crushed, ground or physically concentrated mineral gates are distinct actual states. Barite washing/jigging/tabling/flotation/heavy-media/magnetic separation, colemanite physical concentration/grinding, and fluorspar physical concentration/dewatering are conditional examples, not one recipe applied to every family. Witherite, natural magnesium sulphates, natural boric acid and residual strontium minerals need their own actual mine/sorting/preparation and gate protocols; no unsupported common flotation, dissolution or crystallization route is imposed. HS25Note1 normally excludes calcination/roasting and crystallization, but heading2511 expressly admits natural witherite whether or not calcined excluding barium oxide; heading2528 admits natural borates/concentrates whether or not calcined and excludes borates separated from natural brine. Include actual admitted natural-mineral calcination with measured phase changes, crystal-water loss, fuel and emissions, not automatic synthetic-salt or oxide manufacture. Naturally occurring boric acid qualifies only with geological natural origin and not more than85% H3BO3 on independently measured dry weight; manufactured acid produced by reacting borate ore, or natural acid above this threshold, is outside this boundary. Strontianite may be calcined under HS25Note4 while strontium oxide is excluded; admissibility of another thermal state requires its own boundary review. Exclude synthetic/precipitated barium salts, manufactured refined borates/boric acid, brine-separated borates, HF/elemental fluorine/other manufactured fluoride chemicals, magnesium or strontium oxides and manufactured salts, formulated fertilizers/drilling fluids/chemical mixtures and finished articles. Other specifically categorized phosphates, pyrites, salt, sulphur, clay, gypsum, carbonate construction stone, graphite, feldspar/mica/talc and other nonchemical minerals use their own boundaries. Include actual development/rehabilitation, attributable infrastructure, extraction, preparation, admitted heat treatment, controls, storage/loading and expressly included receipt delivery; document lifetime attribution and upstream providers, never zero unknown burdens."
      source_ids:
        - wco-chemical-minerals-2022
        - unsd-chemical-minerals-scope-2026
        - usgs-barite-2022
        - usgs-fluorine-2017
        - eti-colemanite-preparation-2026
        - ifc-mining-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
