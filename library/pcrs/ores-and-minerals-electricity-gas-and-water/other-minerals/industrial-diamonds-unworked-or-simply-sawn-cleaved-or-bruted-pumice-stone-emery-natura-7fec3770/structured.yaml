    - id: normalization
      applies_to: "all cards"
      rule: "Exchange = attributable period quantity / D. Reconcile inventories and cancel internal transfers before aggregation."
      inputs:
        - cp_output
        - "row-specific cp records"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "production"
      rule: "Reconcile independently measured feed, accepted whole-product D, other accepted grades/co-minerals, waste rock, tailings/fines, dust, saw residue, water/evaporation and opening/closing stock on matched wet and dry-solids bases. kg_dry=kg_as_received*(1-free_moisture_fraction); mineral assay and structural water are separately measured, not subtracted as free water or substituted for whole-product D. Emery retains its natural phase mixture. Thermal treatment changes need actual mass/water/emission evidence, not a universal decomposition factor. Diamond metric carats convert kg=ct*0.0002; grams kg=g*0.001 for the same accepted parcels. Piece count cannot convert without measured paired weights. Measure accepted grade output independently, not as feed minus assumed waste or recovery."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
      source_ids: []
