allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Separate industrial/nonindustrial diamond parcels, abrasive size/performance grades and actually accepted co-minerals before reference normalization. Subdivide separately metered stages first; allocate genuinely shared mine/recovery burdens by a documented causal physical relationship when demonstrated, otherwise justified actual economic shares using independently measured quantities and matched observed prices/currency/period, with sensitivity. Retain unallocated totals and output weights. No invented gem price, universal recovery or hardness-based allocation. Unsold reject is waste by actual fate; neither sale nor a co-output name alone creates an avoided-product credit."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_diamond_resource
      process_id: "extraction"
      flow_role: "diamond_resource"
      record_type: "measurement_record"
      raw_fields: "period; site; amount; original unit; uncertainty; stock changes; route condition; allocation; D; product qualifiers"
      collection_method: "Identify actual natural deposit, mineral/rock phases and resource definition. Measure extracted resource mineral/rock kg with independently sampled grade and extraction/stock records and uncertainty; host ore kg and recovered product kg are separate fields, not interchangeable. Geological resource is not a purchased product and this protocol does not fix ore grade or recovery."
      unit: "kg"
      frequency: "Each meter interval or shipment; monthly reconciliation"
      temporal_coverage: "Complete year or justified representative production campaign"
      site_scope: "One accepted identified whole natural mineral/rock product and size/performance grade at a fixed gate; net as-received kg excludes packaging/rejected matter and has measured free moisture. Natural garnet is a representative only; diamond, pumice, mixed emery, corundum and other compatible grades require their own confirmed product identities. Natural origin, processing and thermal state are mandatory; unresolved product UUIDs prevent completed identity claims."
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original records; assay; balance residuals; uncertainty"
