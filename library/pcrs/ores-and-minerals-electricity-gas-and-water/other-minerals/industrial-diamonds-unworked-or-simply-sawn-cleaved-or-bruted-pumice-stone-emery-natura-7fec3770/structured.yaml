    source_ids: []
  - rule_id: validate_balance
    applies_to: "site"
    rule: "Reconcile independently measured feed, accepted whole-product D, other accepted grades/co-minerals, waste rock, tailings/fines, dust, saw residue, water/evaporation and opening/closing stock on matched wet and dry-solids bases. kg_dry=kg_as_received*(1-free_moisture_fraction); mineral assay and structural water are separately measured, not subtracted as free water or substituted for whole-product D. Emery retains its natural phase mixture. Thermal treatment changes need actual mass/water/emission evidence, not a universal decomposition factor. Diamond metric carats convert kg=ct*0.0002; grams kg=g*0.001 for the same accepted parcels. Piece count cannot convert without measured paired weights. Measure accepted grade output independently, not as feed minus assumed waste or recovery."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "handoff"
    rule: "Verify each applicable exchange, its provider or environmental compartment and final waste fate; identify skipped checks, unresolved identities, missing measurements and upstream gaps. Errors or unassessed mandatory coverage cannot be labelled complete."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply one independently accepted declared-grade natural industrial diamond or natural abrasive mineral/rock lot at the specified gate"
  excluded_use: "Nonindustrial gem reference products; synthetic/reconstructed diamonds; artificial/fused/sintered corundum or other manufactured abrasives; diamond/gem dust and powder or further worked diamonds as reference; formulated bonded/coated abrasive articles and cleaning preparations; jewellery; nonmatching sand/diatomaceous earth/aggregate categories; downstream use"
  required_metadata: "Natural origin; deposit/mineral or rock identity including emery phase mixture and garnet species; primary/placer/supplied route; actual processing and heat-treatment state; diamond industrial grade and permitted simple-cut state; accepted whole-product grade and size distribution; measured abrasive performance/contaminant specification where claimed; free moisture and structural-water basis; independent positive accepted D; gate/geography/period; provider/grid voltage; cutoff and equipment lifetime; outputs/allocation/waste fate. No assumed hardness, mineral purity, recovery, thermal recipe, price or yield."
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
data_sources:
  - id: "wco-natural-abrasives-2022"
    type: "official_guidance"
    reference: "WCO HS Nomenclature2022 Chapter25, Note1 and heading2513, original PDFpp.1,3. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0525_2022e.pdf?la=en"
    used_for: "Natural abrasive crude/washed/crushed/ground/powdered and physical concentration states; heading2513 expressly admits heat treatment. No new HS mapping or synthetic/article inclusion."
  - id: "wco-diamond-boundary-2022"
    type: "official_guidance"
    reference: "WCO HS Nomenclature2022 Chapter71, headings7102,7104,7105, original PDFpp.3–4. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/1471_2022e.pdf?la=en"
    used_for: "Natural industrial diamonds unworked or simply sawn/cleaved/bruted; synthetic diamonds and diamond dust/powder separately named."
  - id: "usgs-industrial-garnet-2006"
    type: "official_guidance"
    reference: "Evans and Moyle, U.S. Industrial Garnet, USGS Bulletin2209-L2006, original PDFp.15 / printedp.9, Barton Mines process paragraph. https://pubs.usgs.gov/bul/b2209-l/b2209l.pdf"
    used_for: "Conditional garnet crushing/sizing, gravity/heavy-media/flotation separation, drying and heat treatment; site evidence required for medium/reagent identities. No historical grade, recovery, price, temperature or intensity default."
  - id: "epa-natural-abrasives-1976"
    type: "official_guidance"
    reference: "EPA, Development Document for Interim Final Effluent Limitations Guidelines and Standards of Performance, Mineral Mining and Processing Industry, June1976, original PDFpp.80–81,124–125,213–214 / printedpp.71–72,117–118,206–207, Figures24,51. https://nepis.epa.gov/Exe/ZyPDF.cgi/2000JKPT.PDF?Dockey=2000JKPT.PDF"
    used_for: "Natural corundum and mixed-mineral emery identity, simple pumice surface mining/screen-crush, primary/placer garnet wet/dry preparation and water/residue routes. Historical US cases do not establish universal zero impact, recipes or present intensities; limited emery/corundum route detail requires actual site records."
  - id: "gia-diavik-2016"
    type: "literature"
    reference: "Shigley et al., Mining Diamonds in the Canadian Arctic: The Diavik Mine, Gems and Gemology Summer2016, original PDFpp.21–23 / printedpp.120–122, Figure20. https://www.gia.edu/doc/Summer-2016-Gems-Gemology-v5.pdf"
    used_for: "One primary natural-diamond host-rock recovery case: crush/scrub/screen, ferrosilicon DMS recycling, Xray and grease recovery and weighed sorted rough parcels. Industrial-grade partition must be measured; no case recovery/grade default or forced route for abrasives."
  - id: "nist-carat"
    type: "official_guidance"
    reference: "NIST Office of Weights and Measures, Precious Metals Conversion Information, first substantive paragraph, original snapshot1October2026. https://www.nist.gov/pml/owm/metric-si/unit-conversion/precious-metals-conversion-information"
    used_for: "1 metric carat=0.2g=200mg; mass conversion only, not quality, recovery or count conversion."
  - id: "cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; no process quantities."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5, consolidated 30 December 2021. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Multifunctionality hierarchy; not a claim of complete PEF conformity."
