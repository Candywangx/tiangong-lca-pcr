system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Supply of natural industrial diamonds, unworked or only simply sawn, cleaved or bruted, and pumice stone, emery, natural corundum, natural garnet and other confirmed natural abrasives at one declared recovery/preparation/loading gate or explicitly included plant-receipt gate. Natural non-diamond abrasives may be crude, washed, crushed, ground, powdered, sieved or physically concentrated; actual heat-treated natural abrasives are admitted by HS2513 and require declared treatment and retained natural identity. Do not transfer the diamond rough-state restriction to natural abrasive powder, or transfer abrasive powder admission to diamond dust/powder. Every dataset selects one identified whole product and accepted size/performance grade. Actual families have distinct primary quarry/host-rock or placer routes; pumice can use simple surface mining and screening/crushing, emery is a naturally mixed mineral rock rather than pure corundum, natural corundum needs its own ore and supplier identity, and garnet may require actual washing, jigs, gravity/density, magnetic or flotation concentration. Diamond DMS/Xray/grease recovery applies only to an actual appropriate natural-diamond circuit, not to all abrasives. Standalone preparation of externally supplied qualified natural materials is allowed with upstream extraction burdens carried by the supplier. Unworked diamonds do not force sawing/bruting; prepared abrasives do not force washing, flotation, drying or thermal treatment. Additional other natural abrasive varieties require confirmed category/state and a separate atomic mineral/resource/product row; natural novaculite abrasive stone is an example only when its actual category is confirmed, not a license to relabel industrial sand or diatomaceous earth. Synthetic/reconstructed diamonds and manufactured/fused/sintered abrasive minerals are outside this natural category; CPC34560 separately names unworked synthetic/reconstructed precious or semiprecious stones, while CPC38230/HS7105 separately name diamond/gem dust/powder and further worked industrial diamonds. Bonded grinding wheels, coated paper/cloth, abrasive formulations, cleaning preparations, polished gems, jewellery and downstream abrasive use lie beyond this mineral gate."
      source_ids:
        - wco-natural-abrasives-2022
        - wco-diamond-boundary-2022
        - usgs-industrial-garnet-2006
        - epa-natural-abrasives-1976
        - gia-diavik-2016
        - nist-carat
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
