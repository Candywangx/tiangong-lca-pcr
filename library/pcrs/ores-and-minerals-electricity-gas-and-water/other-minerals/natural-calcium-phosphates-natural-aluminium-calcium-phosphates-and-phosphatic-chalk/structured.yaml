allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide actual mineral-family extraction and independent ore preparation/accepted-grade circuits. Retain unallocated joint phosphate, saleable sand/carbonate and other actual co-products; demonstrate physical causality or use matched specification/price/period economic allocation with sensitivity. P and carbonate within one phosphatic-chalk product are compositional qualifiers, not simultaneous separate outputs. Recovered sand or carbonate is a co-product only with actual specification, separate mass and fate; rejected sludge is not automatically fertilizer or construction product. Supplied ore and old-tailings upstream allocation/cut-off require durable justification and actual recovery/rehabilitation burdens. Attribute development and closure once over measured lifetime accepted output. No automatic avoided fertilizer, phosphoric acid, virgin ore, tailings disposal or recycled-water credit."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
