measurement_rules:
  - id: reference_basis
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is the positive accepted net gate-output total in kg. Exclude packaging and cancelled internal transfers. cp_output records D; every card uses per 1 kg reference flow."
  - id: conversion
    applies_to: "utility and material rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Retain raw readings. Electricity: 1 kWh = 3.6 MJ. Mass/volume conversion requires measured density, temperature and applicable pressure; retain water content and active chemical fraction."
  - id: category_balance
    applies_to: "production"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is independently weighed positive accepted net as-received natural mineral kg at selected gate, excluding packaging/rejects. Measure wet-basis free-water fraction w,0 <= w <1: dry mineral mass = D*(1-w). For declared slurry use independently measured dry-mineral solids fraction s,0 < s <=1: dry mass = D*s, not both corrections. Crystal water/hydroxyls belonging to hydrated phases remain part of mineral mass; loss-on-ignition includes other losses and is not automatically free water. Laboratory free-water protocol must preserve confirmed phases and disclose method. Measured dry-basis elemental phosphorus fraction gP,0 <= gP <=1, gives contained P = dry mineral mass*gP. If reporting analytical P2O5 equivalent, declare fraction gE and molar-mass convention: gP = gE*(2*M(P)/M(P2O5)); inverse gE = gP*M(P2O5)/(2*M(P)). P2O5-equivalent is not free oxide, pure apatite, plant availability or an identical P mass. Use consistent laboratory atomic masses; no fixed assay or conversion from product name. Keep D denominator. Reconcile dry mineral, P, relevant Ca/Al/carbonate/F and impurities across feed, all accepted grades/co-products, rejects, tailings, captured dust, stock and measured dissolution/release losses. Recovery = matched output dry mass*gP / matched input dry mass*gP after stock reconciliation, never output grade alone. Account separately for reagent-introduced phosphorus, water makeup/reuse/evaporation/discharge and actual carbonate/phase changes; no assumed acid-production yield, calcination CO2 or fertilizer credit."
