    type: "official_guidance"
    reference: "Museum Wales, Mineral Database: Crandallite, original institutional page, snapshot1 October2026, formula/composition, verification, geological context and occurrence paragraphs. https://museum.wales/mineralogy-of-wales/database/?mineral=206&name=Crandallite"
    used_for: "Natural calcium aluminium phosphate hydroxide hydrate identity and mineralogical distinction; local occurrence is not industrial preparation, purity or yield evidence."
