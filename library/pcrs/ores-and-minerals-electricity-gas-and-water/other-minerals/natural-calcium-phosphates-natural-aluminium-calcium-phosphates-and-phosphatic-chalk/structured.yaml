system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Supply all three natural mineral families: natural calcium phosphates (including geologically confirmed apatite-bearing phosphate rock), natural aluminium calcium phosphates, and phosphatic chalk, in crude, washed, physically concentrated, ground or powdered form at one declared extraction, preparation/loading or expressly included receipt gate. Each dataset fixes one actual family, geological mineral assemblage, grade, route and accepted physical output; the phosphate-ore representative does not narrow this category or silently represent its other families. Integrated surface or underground extraction is conditional; standalone preparation starts from independently identified supplied natural mineral or qualified geological tailings with documented upstream burdens. Calcium-phosphate rock may be loaded directly or conditionally crushed, ground, screened, washed/deslimed, physically separated by gravity/magnetic/flotation, dewatered and free-water dried. Natural aluminium-calcium phosphate requires its own mineralogical identification (hydrated crandallite is an example, not all material or pure formula mass), actual weathered-rock/nodule/vein extraction or supplied feed, sorting, disaggregation/grinding and conditional washing or physical separation with phase preservation. Phosphatic chalk requires confirmed naturally phosphatic chalk and measured carbonate/phosphate assemblage; actual selective extraction or supplied chalk, disaggregation, washing/levigation, screening/grinding and conditional dewatering/free-water drying are documented independently. Do not impose the sedimentary US phosphate-rock flotation sequence on aluminium-calcium minerals or chalk. These latter routes are foreground collection alternatives, not externally established industry recipes. Chemical impurity washing qualifies only when it preserves mineral structure; record each actual reagent, dissolution loss and wastewater individually. Drying must remove free water while preserving the declared natural phases; crystal water and hydroxyl loss are not assumed moisture. Roasting, calcination, acidulation/leaching that transforms phosphate identity, synthetic/precipitated phosphates, phosphoric acid, elemental phosphorus, manufactured fertilizer/feed additive and downstream products are separate gates. Ordinary nonphosphatic chalk, carbonate products merely containing incidental phosphorus and finished chalk articles do not enter automatically. Include actual mine development/closure, water and waste management, dust, attributable infrastructure, storage losses and declared transport through the gate; never assume zero wet-route emissions or universal radioactivity."
      source_ids:
        - epa-phosphate-1993
        - museum-crandallite-2026
        - wco-hs25-2022
        - ifc-mining-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
