      record_type: "measurement_record"
      raw_fields: "period; site; amount; original unit; uncertainty; stock changes; route condition; allocation; D; product qualifiers"
      collection_method: "Measure dissolved orthophosphate with a traceable species-selective laboratory method and matched net receiving-water volume V m3; retain sample filtration, pH, speciation, background, compartment, period and uncertainty. If concentration cPO4 is mg/L on PO4 mass basis, released phosphate-ion kg = cPO4*V/1000. If verified orthophosphate concentration cP is mg/L as P, cPO4 = cP*M(PO4)/M(P) using declared consistent molar masses; inverse cP = cPO4*M(P)/M(PO4). Define which phosphate ionic/protonation species the selected Tiangong flow represents and convert its mass using that species molar mass before resolving identity; PO4-equivalent analytical reporting is not proof that all molecules are free PO4 ions. Do not convert dissolved total P to orthophosphate without measured speciation, or substitute P2O5-equivalent solids assay. Record other dissolved phosphorus species and particulate mineral P separately without double-counting one physical release; divide attributable phosphate-ion mass by the same positive D."
      unit: "kg"
      frequency: "Each meter interval or shipment; monthly reconciliation"
      temporal_coverage: "Complete year or justified representative production campaign"
      site_scope: "One accepted natural calcium-phosphate, aluminium-calcium-phosphate or phosphatic-chalk mineral grade with identified phases, free water/crystal-water distinction, dry-basis P and impurities, size and selected gate"
