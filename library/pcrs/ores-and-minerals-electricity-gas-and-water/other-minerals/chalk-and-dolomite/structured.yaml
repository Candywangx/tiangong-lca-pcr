  calculation_rules:
    - id: normalization
      applies_to: "all cards"
      rule: "Exchange = attributable period quantity / D. Reconcile inventories and cancel internal transfers before aggregation."
      inputs:
        - cp_output
        - "row-specific cp records"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "production"
      rule: "D is independently weighed positive accepted net as-received mineral-product kg at the stated gate, excluding packaging and rejects. Free-moisture mass fraction w has0 <= w <1; dry mineral solids = D*(1-w). For slurry measure dry solids fraction s with0 < s <=1 and dry solids = D*s; use one consistent free-water/solids basis, never both corrections. Retain D as inventory denominator and disclose dry-basis output as qualifier. Reconcile dry feed, all accepted grades/co-products, rejected fines, sludge, captured dust and stocks separately from new, recycled, evaporated and discharged water. Match actual carbonate phases and Ca/Mg/impurity assays on the same basis; reported CaO/MgO equivalents are not proof of free oxides or calcination. Loss-on-ignition includes potential carbonate decomposition and is not automatically moisture. Drying that changes carbonate identity requires product-boundary review and measured actual gases, not an assumed drying loss. Ordinary mechanical carbonate preparation produces no calcination CO2 or downstream carbonation credit; actual combustion, confirmed chemical loss or emissions are individually measured."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: representativeness
      applies_to: "dataset"
      requirement: "Use matching production and exchange periods, actual technology, geography and supplier state. Record startup, shutdown, seasonal variation and substitutions."
      evidence: "collection records"
    - id: identity_and_ranges
      applies_to: "all cards"
      requirement: "Unresolved identities and missing independent range evidence remain explicit. Do not replace measurement by a guessed industry range or by missing-as-zero."
      evidence: "manifest review metadata"
validation_rules:
  - rule_id: validate_reference
    applies_to: "final_product"
    rule: "Verify 1 kg, positive D, product state, property/unit and every required qualifier. Each dataset fixes one product and route."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "site"
    rule: "D is independently weighed positive accepted net as-received mineral-product kg at the stated gate, excluding packaging and rejects. Free-moisture mass fraction w has0 <= w <1; dry mineral solids = D*(1-w). For slurry measure dry solids fraction s with0 < s <=1 and dry solids = D*s; use one consistent free-water/solids basis, never both corrections. Retain D as inventory denominator and disclose dry-basis output as qualifier. Reconcile dry feed, all accepted grades/co-products, rejected fines, sludge, captured dust and stocks separately from new, recycled, evaporated and discharged water. Match actual carbonate phases and Ca/Mg/impurity assays on the same basis; reported CaO/MgO equivalents are not proof of free oxides or calcination. Loss-on-ignition includes potential carbonate decomposition and is not automatically moisture. Drying that changes carbonate identity requires product-boundary review and measured actual gases, not an assumed drying loss. Ordinary mechanical carbonate preparation produces no calcination CO2 or downstream carbonation credit; actual combustion, confirmed chemical loss or emissions are individually measured."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "handoff"
    rule: "Verify each applicable exchange, its provider or environmental compartment and final waste fate; identify skipped checks, unresolved identities, missing measurements and upstream gaps. Errors or unassessed mandatory coverage cannot be labelled complete."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply1 kg accepted net as-received chalk or uncalcined dolomite at a declared mineral gate; a slurry states its solids fraction and is not1 kg pure dry carbonate or oxide"
  excluded_use: "Calcined/sintered/agglomerated dolomite or dolime, dolomite ramming mixes and refractory articles; quick/slaked/hydraulic lime and cement; precipitated or chemically transformed calcium carbonate, coated/formulated mineral products, writing/drawing/tailors/billiard chalk; phosphatic chalk; separately classified aggregate, dimension stone or general calcareous feed; downstream use and transport-only services"
  required_metadata: "site/year; chalk or dolomite geological/mineral identity; actual quarry/underground/supplied-stock route; uncalcined phase and preparation; intended grade/product classification; particle size or block geometry; free moisture/slurry solids; dry-basis Ca/Mg carbonate and impurity assays with oxide-equivalent versus actual-oxide distinction; loss-on-ignition method; accepted output/stocks/returns; provider allocation; bagged or bulk; gate and explicitly included transport; water basin/discharge; waste fate and lifetime rehabilitation basis; representative UUID only compatible raw dolomite at a plant gate for glass-batch feed, not chalk or calcined dolomite"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
data_sources:
  - id: "bgs-dolomite-2006"
    type: "official_guidance"
    reference: "BGS, Highley, Bloodworth and Bate, Mineral Planning Factsheet: Dolomite, January2006, original PDF pp.6–7. https://nora.nerc.ac.uk/id/eprint/534435/1/mpf_dolomite.pdf"
    used_for: "Qualitative selective quarrying, raw crushing/screening/grading/handling, joint grades and distinction from calcined dolime and refractory products; no historical temperatures, yields, grade limits or market statistics."
  - id: "bgs-limestone-2006"
    type: "official_guidance"
    reference: "BGS, Harrison, Highley, Bloodworth and Bate, Mineral Planning Factsheet: Limestone, January2006, original PDF p.1 and pp.6–7. https://nora.nerc.ac.uk/id/eprint/534436/1/mpf_limestone.pdf"
    used_for: "Natural chalk carbonate identity; actual quarrying/crushing/grinding/classification versus separate lime calcination; no universal chalk purity, size or recipe."
  - id: "epa-crushed-stone-2004"
    type: "official_guidance"
    reference: "US EPA, AP-42 Section11.19.2 Crushed Stone Processing and Pulverized Mineral Processing, August2004, original PDF pp.1–5. https://www.epa.gov/sites/default/files/2020-10/documents/c11s1902.pdf"
    used_for: "Actual carbonate-rock preparation, dry/wet mineral grinding/classification and dust/water controls, conditional on site route; no historic size, capacity or emission-factor defaults."
