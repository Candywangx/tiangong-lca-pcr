allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide actual mining benches, raw-block sawing, powder preparation and independently handled grades. Retain unallocated joint mineral/aggregate/other recovered-product inventories; use measured physical causality or matched economic allocation and price sensitivity if necessary. Quality rejected for industrial use may be accepted aggregate or aglime only with confirmed specification/fate, not automatically waste or free co-product. Attribute supplier and old-stock upstream burdens or justified cut-off and actual rehabilitation; allocate lifetime development/closure once over measured accepted output. No automatic avoided virgin mineral, disposal or future carbon-uptake credits."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
