measurement_rules:
  - id: reference_basis
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is the positive accepted net gate-output total in kg. Exclude packaging and cancelled internal transfers. cp_output records D; every card uses per 1 kg reference flow."
  - id: conversion
    applies_to: "utility and material rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Retain raw readings. Electricity: 1 kWh = 3.6 MJ. Mass/volume conversion requires measured density, temperature and applicable pressure; retain water content and active chemical fraction."
  - id: category_balance
    applies_to: "production"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is independently weighed positive accepted net as-received mineral-product kg at the stated gate, excluding packaging and rejects. Free-moisture mass fraction w has0 <= w <1; dry mineral solids = D*(1-w). For slurry measure dry solids fraction s with0 < s <=1 and dry solids = D*s; use one consistent free-water/solids basis, never both corrections. Retain D as inventory denominator and disclose dry-basis output as qualifier. Reconcile dry feed, all accepted grades/co-products, rejected fines, sludge, captured dust and stocks separately from new, recycled, evaporated and discharged water. Match actual carbonate phases and Ca/Mg/impurity assays on the same basis; reported CaO/MgO equivalents are not proof of free oxides or calcination. Loss-on-ignition includes potential carbonate decomposition and is not automatically moisture. Drying that changes carbonate identity requires product-boundary review and measured actual gases, not an assumed drying loss. Ordinary mechanical carbonate preparation produces no calcination CO2 or downstream carbonation credit; actual combustion, confirmed chemical loss or emissions are individually measured."
