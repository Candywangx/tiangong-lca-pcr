system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Supply of natural chalk and uncalcined, unsintered dolomite at one declared quarry, preparation/loading or explicitly included plant-receipt gate. Cover crude and actually washed, crushed, screened, ground, powdered or physically concentrated mineral grades retaining their natural carbonate identity, and raw dolomite roughly trimmed or merely cut into rectangular blocks/slabs. Include actual selective surface or independently confirmed underground extraction, supplied-mineral preparation, dry/wet grinding and classification, conditional washing/flotation or other physical purification, dewatering, free-moisture drying, handling and packaging. Processes are actual-route conditions, not a universal chalk or dolomite recipe. Raw geological mineral lots may be homogenized only while retaining the same confirmed mineral product identity; separately identify every supplied lot and exchange. Formulated blends, coatings, chemically precipitated calcium carbonate, chemically transformed carbonate/oxide products and writing/drawing/tailors/billiard chalk are different products. Calcined/sintered/agglomerated dolomite and dolime belong to a separate product category; CPC3 separately names calcinated or agglomerated dolomite. Do not enlarge this raw-mineral boundary because the full HS dolomite heading also mentions calcined material. Phosphatic chalk, general calcareous chemical-manufacture stone, building-stone or construction aggregate reference products use their confirmed specific category; actual aggregate co-output is weighed and allocated rather than double-counted as chalk/dolomite output. Include attributable development/rehabilitation, waste, dust and water controls through the declared gate. Chemical-industry, glass, agriculture, lime/cement and refractory use are downstream of mineral supply, not mandatory foreground operations."
      source_ids:
        - bgs-dolomite-2006
        - bgs-limestone-2006
        - epa-crushed-stone-2004
        - wco-hs25-2022
        - ifc-construction-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
