measurement_rules:
  - id: reference_basis
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is the positive accepted net gate-output total in kg. Exclude packaging and cancelled internal transfers. cp_output records D; every card uses per 1 kg reference flow."
  - id: conversion
    applies_to: "utility and material rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Retain raw readings. Electricity: 1 kWh = 3.6 MJ. Mass/volume conversion requires measured density, temperature and applicable pressure; retain water content and active chemical fraction."
  - id: category_balance
    applies_to: "production"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is positive independently calibrated accepted net gemstone mass kg for exactly the selected mineral/variety and grade at gate, excluding gangue, free water, adhering grease, packaging, rejects and returns. Do not infer D from ore grade, ore input or theoretical recovery. Sum independently weighed accepted parcels with stock reconciliation. Metric1 ct=0.2g=0.0002kg,1g=0.001kg: D=sum accepted carats*0.0002 when the same parcels are weighed in metric carats; verify balance resolution/calibration and round only after aggregation. Count cannot convert to kg without measured parcel weights or actual grade/size-specific mean mass and its uncertainty; no generic gem size/weight. Reconcile feed, retained rough stones, co-grades, industrial stones, fragments/dust, host-rock rejects/tailings, internal rescreening and stocks, without equating host-rock dry mass to pure gems. Keep ore/water mass balances separate from the sparse gemstone mass balance and reconcile uncertainty/detection limits. Record actual sawing loss/breakage per variety and shape; no universal recovery or finished-gem yield."
