published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply 1 kg accepted net rough natural gemstone in one identified variety and grade at selected gate; retain measured metric carats and piece counts as supplementary characteristics, not interchangeable product quality"
  excluded_use: "Industrial diamonds as reference output; synthetic or reconstructed unworked stones; natural/cultured pearls; otherwise worked polished/faceted gems, beads, jewellery or mounted/strung articles; gem dust/powder as reference product; treated/formulated composite stones outside confirmed rough category; downstream use and transport-only services"
  required_metadata: "site/year and origin/custody; natural mineral/variety and nonindustrial status; actual primary/placer/supplied-stone route; grade, size distribution, piece count and net mass; unworked or actual simple saw/cleave/rough state; actual enhancement declaration and category check; product gate/transport included; measured gangue/water/grease exclusion; reject/breakage and stocks; supplier burden and economic/physical allocation; each consumable formulation; basin/discharge/waste fate; lifetime development/closure. Category Product/Mass UUID is only compatible natural rough plant state, not geology, pearls, synthetic or finished stones. Electricity identity is only CN1–35kV grid-average consumer supply when matched; other geographies/voltages/providers require distinct identities"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
data_sources:
  - id: "cpc-gems-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0 Explanatory Notes,30June2025, original PDFpp.61,164,189, subclasses16310/16320/34560/38210/38220. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Full rough natural precious/semiprecious category; synthetic/reconstructed unworked stones, pearls and further worked gems are separately named categories. No universal process route."
  - id: "wco-gems-2022"
    type: "official_guidance"
    reference: "WCO HS Nomenclature2022 Chapter71, original PDFp.3 headings7101–7104. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/1471_2022e.pdf?la=en"
    used_for: "Rough versus worked natural diamonds/coloured stones, industrial/nonindustrial distinction and separate pearls/synthetic stones. Classification boundaries only, no new HS mapping."
  - id: "ngja-gem-mining"
    type: "official_guidance"
    reference: "Sri Lanka National Gem and Jewellery Authority, Gemstone Mining Industry, original webpage snapshot1October2026, mining methods, mining areas, environmental friendly mining and rehabilitation paragraphs. https://ngja.gov.lk/gems/gemstone-mining-industry/"
    used_for: "Conditional coloured-gem pit/tunnel/placer/dredging, wash-water settling/reuse and separate overburden rehabilitation; Sri Lankan examples do not fix every gemstone route or imply zero impact."
  - id: "gia-diavik-2016"
    type: "literature"
    reference: "Shigley et al., Mining Diamonds in the Canadian Arctic: The Diavik Mine, Gems and Gemology Summer2016, original PDFpp.21–23 / printedpp.120–122, Figure20. https://www.gia.edu/doc/Summer-2016-Gems-Gemology-v5.pdf"
    used_for: "One primary-diamond case: crushing/scrubbing/sizing, ferrosilicon DMS recycling, Xray/grease recovery and weighed sorted rough parcels. No Diavik grade, recovery, intensity or gem-price default."
  - id: "nist-carat"
    type: "official_guidance"
    reference: "NIST Office of Weights and Measures, Precious Metals Conversion Information, first substantive paragraph, original snapshot1October2026. https://www.nist.gov/pml/owm/metric-si/unit-conversion/precious-metals-conversion-information"
    used_for: "Metric gemstone carat mass conversion0.2g /200mg; not precious-metal purity karat or a count-to-mass factor."
  - id: "cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; no process quantities."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5, consolidated 30 December 2021. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Multifunctionality hierarchy; not a claim of complete PEF conformity."
