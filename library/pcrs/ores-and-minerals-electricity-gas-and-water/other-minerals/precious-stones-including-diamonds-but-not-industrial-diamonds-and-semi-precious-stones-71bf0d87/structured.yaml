allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide actual benches/deposits, recovery lines and independently handled mineral/grade lots. Retain unallocated joint inventories for accepted gem varieties, grades and industrial-diamond co-output. Gem mass alone does not establish physical causality across radically different grades; use measured causal relationships where defensible, otherwise documented grade-specific gate prices, quantities, currency and period for economic allocation with price/quality sensitivity. Never invent gem prices or infer value from stone count. Recovered old-tailings or supplied stones carry actual supplier burdens or justified cut-off and collection/processing burdens, not automatic zero. Allocate attributable development, tailings rehabilitation and closure once over measured lifetime accepted outputs. Reject or unusable fragment is not a co-product merely because it may be sold; confirm spec/fate. No default avoided gemstone, aggregate, disposal or jewellery credits."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
