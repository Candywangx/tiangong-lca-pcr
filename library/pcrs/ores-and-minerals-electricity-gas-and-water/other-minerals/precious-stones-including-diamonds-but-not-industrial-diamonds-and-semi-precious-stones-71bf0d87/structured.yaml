system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Supply of natural precious and semi-precious stones, including nonindustrial diamonds, in an unworked, simply sawn/cleaved/bruted or roughly shaped state at one declared recovery, rough-preparation/loading or expressly included plant-receipt gate. Cover nonindustrial diamond and actual natural coloured-stone grades such as ruby/sapphire, emerald/aquamarine, quartz varieties, garnet, tourmaline, peridot, feldspar and opal; each dataset fixes an identified mineral/variety and accepted rough grade rather than averaging every stone. Actual routes include primary rock or pegmatite extraction, eluvial/residual/placer recovery, manual or mechanized washing/screening/sorting, conditionally appropriate host-rock liberation and concentration, and standalone preparation of supplied qualified natural stones. Primary-diamond dense-medium/Xray/grease recovery is one conditional route, not a recipe for fragile coloured crystals or every placer. Record actual deposit, grade-preserving recovery, supplies, water controls and attributable development/rehabilitation. Rough gate includes only actually performed simple sawing/cleaving/rough shaping; unworked product excludes absent operations. Faceting, polishing, drilling bead holes, final cabochon manufacture, mounting/stringing and finished jewellery are outside. Synthetic or reconstructed unworked gems are separately named CPC34560 and HS7104, not assumed natural because their chemistry resembles a stone; cultivated pearls and natural pearls have separate identities. Heat/dye/impregnation or other treatment exceeding the declared unworked/simple rough state requires a separate boundary/category review, not forced gemstone recovery. Industrial-diamond or abrasive grades are separately classified and may be joint outputs, not this reference product. Unsorted mixed diamond recovery must be graded and partitioned before claiming one accepted nonindustrial output."
      source_ids:
        - cpc-gems-2025
        - wco-gems-2022
        - ngja-gem-mining
        - gia-diavik-2016
        - nist-carat
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
