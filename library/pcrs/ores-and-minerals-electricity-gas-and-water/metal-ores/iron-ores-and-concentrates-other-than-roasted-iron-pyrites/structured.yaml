    - rule_id: boundary_extension
      applies_to: "lifecycle coverage"
      rule: "Exclude downstream agglomeration, smelting and customer transport from this gate inventory. Declare exploration, capital equipment, mine development, closure and post-closure coverage; include attributable long-term waste management or document an assessed omission, never silently assume zero."
