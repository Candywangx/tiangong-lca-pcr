allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "multiple saleable outputs"
    rule: "First investigate subdivision or system expansion. Prefer measured process-specific attribution; an expanded-system result must remain labelled as such. If unavoidable, use a justified underlying physical relationship, then a documented other relationship such as economic value."
    source_ids:
      - eu-ef-2021
  - rule_id: allocation_ore_grades
    applies_to: "lump, fines and concentrate"
    rule: "Do not allocate common mining burdens by contained Fe automatically. If economic allocation is justified, share_i = dry_mass_i * price_i / sum(dry_mass_j * price_j); use comparable net gate prices, same period and moisture basis, disclose price sensitivity and keep output-specific finishing burdens direct."
    source_ids:
      - eu-ef-2021
  - rule_id: allocation_waste
    applies_to: "tailings, overburden and waste rock"
    rule: "Disposal materials are not saleable co-products merely because they have mass. Retain attributable handling and treatment burdens. A demonstrated saleable recovered product requires a separate identity, specification, buyer evidence and justified allocation; do not add an unsupported avoided-production credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "finishing"
      flow_role: "saleable output and moisture"
      record_type: "weighing and assay"
      raw_fields: "batch; wet mass W; wet-basis moisture w; dry-basis Fe fraction f; size; impurities; stocks; gate receipts"
      collection_method: "Calibrated weighbridge or belt scale; matched lot moisture sampling and laboratory assay. Use ISO 3087 or a disclosed validated equivalent; the public ISO scope does not supply the complete laboratory procedure."
      unit: "kg; kg/kg"
      frequency: "each lot"
      temporal_coverage: "same declared reporting period"
      site_scope: "declared mine/plant; no unrelated production"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, source records, uncertainty and reconciliation"
    - protocol_id: cp_mining
      process_id: "mining"
      flow_role: "ore, explosive, overburden and rock"
      record_type: "mine production records"
      raw_fields: "pit or stope; ore tonnes; moisture; explosive issue; rock/soil volumes; density; stock change; destinations"
      collection_method: "Reconcile mine survey, calibrated scales, drilling/blast logs and issue records; convert surveyed volume with sampled material density."
      unit: "kg"
      frequency: "shift and blast"
      temporal_coverage: "same declared reporting period"
      site_scope: "declared mine/plant; no unrelated production"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, source records, uncertainty and reconciliation"
    - protocol_id: cp_beneficiation
      process_id: "beneficiation"
      flow_role: "feed, concentrate, grinding media and tailings"
      record_type: "plant mass balance"
      raw_fields: "feed and product weights; moisture; Fe assay; media additions and stocks; tailings slurry mass; solids fraction"
      collection_method: "Matched feed/product samples, scales and slurry density/solids tests; measure circulating middlings separately."
      unit: "kg; kg/kg"
      frequency: "shift and composite sample"
      temporal_coverage: "same declared reporting period"
      site_scope: "declared mine/plant; no unrelated production"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, source records, uncertainty and reconciliation"
    - protocol_id: cp_flotation
      process_id: "flotation"
      flow_role: "flotation feed, product, reagents and rejects"
      record_type: "reagent and plant records"
      raw_fields: "chemical name; CAS; formulation; concentration; issued mass; opening and closing stocks; concentrate and tailings solids"
      collection_method: "Verify safety data sheets and issue logs; weigh or meter each chemical separately; reconcile stage mass and assay."
      unit: "kg"
      frequency: "batch and shift"
      temporal_coverage: "same declared reporting period"
      site_scope: "declared mine/plant; no unrelated production"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, source records, uncertainty and reconciliation"
    - protocol_id: cp_utilities
      process_id: "site_services"
      flow_role: "electricity and diesel"
      record_type: "utility meters and fuel stock ledger"
      raw_fields: "meter kWh; voltage; diesel mass or litres; density; receipts; stocks; equipment hours; attribution shares"
      collection_method: "Dedicated meters and fuel records; reconcile whole-site totals to attributable activities and exclude contractor fuel already included in a service provider."
      unit: "MJ; kg"
      frequency: "daily, reconciled monthly"
      temporal_coverage: "same declared reporting period"
      site_scope: "declared mine/plant; no unrelated production"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, source records, uncertainty and reconciliation"
    - protocol_id: cp_water
      process_id: "site_services"
      flow_role: "withdrawal, purchased water, reuse and discharge"
      record_type: "water balance"
      raw_fields: "source; basin; inflow; purchased water; return water; discharge; evaporation; product/tailings retained water; stock change"
      collection_method: "Source and outfall meters with basin identification; retain a separate internal-circulation ledger."
      unit: "m3; kg"
      frequency: "daily and seasonal reconciliation"
      temporal_coverage: "same declared reporting period"
      site_scope: "declared mine/plant; no unrelated production"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, source records, uncertainty and reconciliation"
    - protocol_id: cp_waste
      process_id: "site_services"
      flow_role: "waste fate and treatment"
      record_type: "treatment and disposal ledger"
      raw_fields: "tailings solids; wet mass; sulfate/sulfide characterization; neutralizer; sludge; destination; storage; closure plan"
      collection_method: "Weighbridge, slurry measurements, treatment logs and receiving manifests; record on-site management inventories and assessed future requirements separately."
      unit: "kg"
      frequency: "transfer and monthly balance"
      temporal_coverage: "same declared reporting period"
      site_scope: "declared mine/plant; no unrelated production"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, source records, uncertainty and reconciliation"
    - protocol_id: cp_emissions
      process_id: "site_services"
      flow_role: "direct air and water releases"
      record_type: "monitoring or documented calculation"
      raw_fields: "source; substance; compartment; concentration; gas/liquid flow; operating hours; control; fuel carbon; factor source; detection limit"
      collection_method: "Representative stack, fugitive and outfall measurements; load = concentration * matched flow * time with explicit unit conversion. Fuel-carbon estimates require measured composition and oxidation assumptions."
      unit: "kg"
      frequency: "operating campaign and permit schedule"
      temporal_coverage: "same declared reporting period"
      site_scope: "declared mine/plant; no unrelated production"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, source records, uncertainty and reconciliation"
    - protocol_id: cp_land
      process_id: "site_services"
      flow_role: "land occupation"
      record_type: "survey and permit map"
      raw_fields: "polygon; land class; area; duration; overlapping boundary; reclamation state"
      collection_method: "GIS/survey polygons and mine plan; distinguish occupation from transformation and record each transformation land class separately."
      unit: "m2*a"
      frequency: "annual and land change"
      temporal_coverage: "same declared reporting period"
      site_scope: "declared mine/plant; no unrelated production"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, source records, uncertainty and reconciliation"
  calculation_rules:
    - id: dry_mass
      applies_to: "product and intermediate solids"
      rule: "dry_mass = W * (1 - w); D = sum(saleable dry mass); w is moisture fraction on wet mass, 0 <= w < 1. Reconcile production = dispatch + closing stock - opening stock + identified losses."
      inputs:
        - W
        - w
        - cp_product
      output: "dry_mass; D"
      source_ids:
        - iso-moisture-2020
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Normalized exchange = attributable reporting-period exchange / D; D is positive saleable dry-output mass in kg; final_product = 1 kg dry product. Never average batch intensities without mass weighting."
      inputs:
        - "period totals"
        - D
        - "allocation shares"
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: fe_recovery
      applies_to: "beneficiation and flotation"
      rule: "Contained Fe = dry solids mass * dry-basis Fe fraction; Fe recovery = Fe in recovered product / Fe in consumed feed, with stock changes and all exits reconciled."
      inputs:
        - "dry masses"
        - "Fe assays"
        - stocks
      output: "contained Fe; recovery"
      source_ids: []
    - id: water_reconcile
      applies_to: "site water ledger"
      rule: "External inflows = discharge + evaporation + water exported in product/waste + storage increase; internal return water cancels. Do not equate gross withdrawal with net consumption."
      inputs:
        - cp_water
        - moisture
        - stocks
      output: "water balance residual"
      source_ids:
        - ifc-mining-2007
    - id: energy_conversion
      applies_to: "site_electricity; site_diesel"
      rule: "Electricity MJ = metered kWh * 3.6; diesel kg = measured litres * batch density in kg/L; on-site generation inputs are recorded once and internal generated power is not purchased grid power."
      inputs:
        - cp_utilities
        - density
      output: "MJ; kg"
      source_ids: []
  data_quality_requirements:
    - id: quality_period
      applies_to: "all collection protocols"
      requirement: "Use one common representative reporting period, normally a full operating year as this PCR collection design; shorter campaigns require reason, seasonality and capacity disclosure."
      evidence: "period register; operating hours"
    - id: quality_identity
      applies_to: "each exchange"
      requirement: "Verify flow type, chemical identity, product form, compartment, reference property and bilingual official name; pending identities require resolution before publication."
      evidence: "supplier specification and identity records"
    - id: quality_uncertainty
      applies_to: "balance and estimates"
      requirement: "Retain scale/meter calibration, assay representativeness, density, factor provenance and uncertainty; explain residuals using measured uncertainties rather than a universal fixed tolerance."
      evidence: "calibration; assays; balance sheets"
    - id: quality_missing
      applies_to: "unmeasured conditional flows"
      requirement: "Distinguish absent, unmeasured, modelled and excluded exchanges; provide an estimate and source or a coverage gap, never an unsupported zero."
      evidence: "completeness register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference and final product"
    rule: "Require matching product UUID/form, 1 kg dry basis, all qualifiers, positive D and matched moisture/Fe assay. Wet-mass providers require explicit conversion."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "all stages"
    rule: "Check dry-solid, contained-Fe and water balances with stock changes and uncertainty; recovery fractions must lie between zero and one unless a documented balance correction resolves the discrepancy."
    source_ids: []
  - rule_id: validate_double_count
    applies_to: "utilities, intermediates and wastes"
    rule: "Cancel internal ore/concentrate/water transfers; reconcile the single utility ledger. Match waste outputs to one management fate and include treatment burdens; supplier emissions are not site direct releases."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "dataset handoff"
    rule: "Report checks performed/skipped, missing measurements, unresolved identities, omitted stages and upstream coverage. Errors or unassessed mandatory coverage cannot be labelled complete."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site-specific foreground gate inventory for the declared iron-ore product"
  downstream_use: "secondary_dataset; background_dataset after coverage and quality assessment"
  allowed_use: "Matched mineral feedstock supply to downstream preparation or ironmaking; separately labelled beneficiation-only use"
  excluded_use: "Unqualified comparison across grade/form/routes; pellet or steel production; cradle-to-gate claims for incomplete upstream coverage"
  required_metadata: "All reference qualifiers; inventory basis; route; gate; process coverage; providers; stock treatment; allocation shares; geography; time; land and waste-management scope"
  required_quality_disclosure: "Measured/modelled coverage; unresolved identities; uncertainty; balance residuals; water source/basin; chemical formulation; emission compartments; omissions and long-term treatment"
  update_trigger: "Changed orebody/grade, route, recovery, reagent formulation, utility supply, waste fate, gate or reporting-period representativeness"
data_sources:
  - id: "epa-iron-1994"
    type: "official_guidance"
    reference: "US EPA, EPA 530-R-94-030 (1994), Volume 3: Iron, §§1.4–1.5. https://archive.epa.gov/epawaste/nonhaz/industrial/special/web/pdf/iron.pdf"
    used_for: "Historical physical process descriptions: extraction, separation and tailings. Not current market shares, consumption factors, legal limits or universal grades."
  - id: "ifc-mining-2007"
    type: "official_guidance"
    reference: "IFC / World Bank Group, Environmental, Health, and Safety Guidelines for Mining (10 December 2007), §1.1 Water Use. https://www.ifc.org/content/dam/ifc/doc/2000/2007-mining-ehs-guidelines-en.pdf"
    used_for: "Mining water-balance and return-water distinctions; not iron-specific LCA consumption ranges."
  - id: "iso-moisture-2020"
    type: "standard"
    reference: "ISO 3087:2020, Iron ores — Determination of the moisture content of a lot, public scope/catalogue. https://www.iso.org/standard/72159.html"
    used_for: "Applicability of lot-moisture determination to natural and processed iron ores. Detailed laboratory method requires access to the actual standard or a validated equivalent."
  - id: "eu-ef-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I §4.5, consolidated 30 December 2021. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "General multifunctionality hierarchy; citation does not assert full PEF conformity."
