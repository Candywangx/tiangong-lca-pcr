        - ifc-mining-2007
    - rule_id: boundary_start
      applies_to: "purchased ore"
      rule: "A beneficiation-only package must retain the upstream ore link; it cannot claim cradle-to-gate coverage when extraction burdens are absent. Internal mined ore carries no second upstream ore provider."
