measurement_rules:
  - id: reference_basis
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is the positive accepted net gate-output total in kg. Exclude packaging and cancelled internal transfers. cp_output records D; every card uses per 1 kg reference flow."
  - id: conversion
    applies_to: "utility and material rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Retain raw readings. Electricity: 1 kWh = 3.6 MJ. Mass/volume conversion requires measured density, temperature and applicable pressure; retain water content and active chemical fraction."
  - id: category_balance
    applies_to: "production"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is independently weighed positive accepted net as-received mineral-product kg at the selected gate, excluding packaging, rejected material and cancelled transfers. Measure wet-basis free-moisture fraction w with0 <= w <1; dry mineral mass = D*(1-w). For each assayed precious-metal element j, explicitly record dry-basis assay a_j in g/t of dry mineral: contained element kg = D*(1-w)*a_j/1000000. If assay is a dimensionless mass fraction g_j, contained element kg = D*(1-w)*g_j; do not confuse percent, ppm, g/t or troy ounces. Keep D as the common inventory denominator, with separate element indicators. Reconcile dry solids and each assayed metal across feed, accepted mineral product, separate co-products, reject/tailings/dust and stocks, independently of new/circulating/evaporated/discharged water. Recovery requires matched feed/product mass and assays after stock adjustment, not concentrate grade or downstream bullion/refinery yield. Actual thermal/oxidative preparation requires measured phase, element, oxygen, bound/free water and offgas balance; chemical/gas exchange additions are mandatory where actual."
