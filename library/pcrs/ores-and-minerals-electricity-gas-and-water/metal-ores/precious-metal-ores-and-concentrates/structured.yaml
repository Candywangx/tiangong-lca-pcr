system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Supply of gold, silver and platinum-group mineral ores and concentrates at one declared mine, concentrator-loading or expressly included receipt gate. Platinum-group coverage includes platinum, palladium, rhodium, ruthenium, iridium and osmium-bearing mineral ores, rather than platinum alone. Cover lode and placer deposits, surface/underground mining and actual placer excavation/dredging, plus standalone preparation of supplied geological ore. Follow measured mineralogy: actual crushing, screening, washing, sorting, grinding, gravity, magnetic or dense-medium separation, flotation and concentrate thickening/filtration/drying are conditional; no universal gold cyanidation, PGM flotation recipe or recovery. Fix one actual mineral-product output and assayed metal suite. Mixed precious/base-metal mineral concentrates require confirmed category identity and joint-production allocation; a copper/nickel/lead/zinc concentrate does not become this category merely because it contains traces of precious metal. Actual thermal or oxidative mineral preparation belongs only where the output remains independently confirmed ore/mineral-concentrate feed, with phase/element/offgas balance and every actual chemical/gas exchange individually added. Do not classify every refractory-ore calcine as ore automatically. Dissolved leach solution, pregnant carbon/resin, amalgam, chemically precipitated metal/salt, smelting matte, anode slimes, dore/bullion and clean metallic gold/silver/PGM product gates are separate; commercial concentrate naming alone cannot establish mineral identity. Recycled jewellery, catalyst, electronic scrap and industrial residues need their own secondary-material methodology. Include actual development/closure, water/tailings/sediment/dust controls, handling and transport only through the selected mineral gate."
      source_ids:
        - bgs-platinum-2009
        - epa-gold-placer-1994
        - epa-gold-lode-1994
        - wco-hs26-2022
        - ifc-mining-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
