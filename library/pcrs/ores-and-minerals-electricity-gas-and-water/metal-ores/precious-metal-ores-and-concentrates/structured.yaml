allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide mines, mineral zones and independent separation circuits where possible; retain the full unallocated joint precious/base-metal inventory. Embedded Au/Ag/PGM in one bulk mineral concentrate are not multiple physical-output masses. Separately recovered copper, nickel or chromite mineral concentrate is weighed and assigned its own identity; actual payability, refining/treatment charges, prices and matched period support any justified economic allocation when physical causality is unavailable. Precious-metal assay alone is not an environmental-burden allocation formula. Supplied/old-stock geological feed retains supplier allocation or justified cut-off and actual rehabilitation burden. Development/closure is attributed once by measured lifetime accepted output. No automatic avoided-metal, disposal or internal-recycle credit."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
