published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply1 kg of accepted precious-metal mineral ore or concentrate in its declared state; individual contained precious metals are qualifiers, not1 kg refined metal"
  excluded_use: "Dore/bullion or clean metallic precious-metal products; smelting matte/anode slimes; leach solutions, pregnant carbon/resin, amalgam, precipitated chemical/metal products; recycled scrap/catalyst and industrial residue; another declared base-metal concentrate category; transport-only service"
  required_metadata: "site/year; geological/mineral identity and declared precious-metal category; Au/Ag/Pt/Pd/Rh/Ru/Ir/Os suite and each assay; lode/placer/surface/underground/dredging or supplied-stock route; actual gangue/sulfide/chromite/free-metal association and liberation; ore versus mineral concentrate and actual thermal/oxidative phase; free moisture, assay drying method, grain size and deleterious elements; dry-basis assay unit g/t or mass fraction for each element; chosen gate and transport; accepted output/stocks and measured recovery; water basin/return and sediment/waste fate; provider/joint-product allocation and lifetime development output; representative UUID only for compatible gold ore Product/Mass at plant, silver/PGM/concentrates and other states require separate identities"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
data_sources:
  - id: "bgs-platinum-2009"
    type: "official_guidance"
    reference: "British Geological Survey, Platinum Mineral Commodity Profile, September2009, original PDF pp.14–15. https://nora.nerc.ac.uk/id/eprint/8726/1/1278_Platinum_Profile.pdf"
    used_for: "Qualitative PGM ore comminution, actual magnetic/dense-medium separation, flotation and distinction from smelting/refining. No moisture cutoff, recovery, thermal setting or market default."
  - id: "epa-gold-placer-1994"
    type: "official_guidance"
    reference: "US EPA, Technical Resource Document Volume6 Gold Placers Part1, October1994, original PDF pp.18–19. https://archive.epa.gov/epawaste/nonhaz/industrial/special/web/pdf/placer1.pdf"
    used_for: "Actual placer excavation/washing/gravity concentration, tailings/settling/reclaimed-water route and mineral concentrate versus bullion gate; historic quantities and legal/technology-share claims not adopted."
  - id: "epa-gold-lode-1994"
    type: "official_guidance"
    reference: "US EPA, Technical Resource Document Volume2 Gold Chapter1, EPA530-R-94-013, August1994, original PDF pp.28–30. https://archive.epa.gov/epawaste/nonhaz/industrial/special/web/pdf/goldch1.pdf"
    used_for: "Qualitative lode mining, mineral flotation/gravity route and distinction from amalgamation/cyanidation metal recovery. No historic grade, recovery, national production or reagent-dose default."
  - id: "wco-hs26-2022"
    type: "official_guidance"
    reference: "WCO HS Nomenclature2022 Chapter26, original PDF pp.1–2, mineralogical Note2 and heading2616 silver/other precious-metal ores and concentrates. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0526_2022e.pdf?la=en"
    used_for: "Full precious-metal mineral ore/concentrate identity and separation from industrial residues/matte; no new HS mapping or quantity."
  - id: "ifc-mining-2007"
    type: "official_guidance"
    reference: "IFC, Environmental Health and Safety Guidelines for Mining, 10 December 2007, sections 1.1 and Annex A. https://www.ifc.org/content/dam/ifc/doc/2000/2007-mining-ehs-guidelines-en.pdf"
    used_for: "Mining water, wastes, emissions, development and closure; no product-specific default factors."
  - id: "cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; no process quantities."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5, consolidated 30 December 2021. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Multifunctionality hierarchy; not a claim of complete PEF conformity."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:5d98c45c9b8abac2613440f7f80064e811671f080d228d3294872c16f5ed5c98"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_7922"
      family: "system_boundary"
      span:
        start:
          offset: 7922
          line: 55
          column: 1
        end:
          offset: 12396
          line: 74
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual identified lode/placer geological deposit for integrated primary extraction, or supplied identified ore with provider/upstream burdens for standalone preparation; internal transfers cancel |\n| starting_condition_role | Resource or supplied feed; declare which |\n| product_classification_scope | Gold and silver mineral ores/concentrates; mineral ores/concentrates bearing Pt, Pd, Rh, Ru, Ir or Os; qualified lode/placer and normally prepared mineral feeds with declared actual category and metal suite |\n| recursive_input_rule | Purchased same-category material carries a distinct supplier dataset; internal recycling is a balance observation, not a new external input or credit. |\n| upstream_dataset_requirement | Link feed, electricity, fuels, chemicals, infrastructure and waste-management burdens; disclose any missing coverage. |\n| disclosure | site/year; geological/mineral identity and declared precious-metal category; Au/Ag/Pt/Pd/Rh/Ru/Ir/Os suite and each assay; lode/placer/surface/underground/dredging or supplied-stock route; actual gangue/sulfide/chromite/free-metal association and liberation; ore versus mineral concentrate and actual thermal/oxidative phase; free moisture, assay drying method, grain size and deleterious elements; dry-basis assay unit g/t or mass fraction for each element; chosen gate and transport; accepted output/stocks and measured recovery; water basin/return and sediment/waste fate; provider/joint-product allocation and lifetime development output; representative UUID only for compatible gold ore Product/Mass at plant, silver/PGM/concentrates and other states require separate identities |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_operations | site | Supply of gold, silver and platinum-group mineral ores and concentrates at one declared mine, concentrator-loading or expressly included receipt gate. Platinum-group coverage includes platinum, palladium, rhodium, ruthenium, iridium and osmium-bearing mineral ores, rather than platinum alone. Cover lode and placer deposits, surface/underground mining and actual placer excavation/dredging, plus standalone preparation of supplied geological ore. Follow measured mineralogy: actual crushing, screening, washing, sorting, grinding, gravity, magnetic or dense-medium separation, flotation and concentrate thickening/filtration/drying are conditional; no universal gold cyanidation, PGM flotation recipe or recovery. Fix one actual mineral-product output and assayed metal suite. Mixed precious/base-metal mineral concentrates require confirmed category identity and joint-production allocation; a copper/nickel/lead/zinc concentrate does not become this category merely because it contains traces of precious metal. Actual thermal or oxidative mineral preparation belongs only where the output remains independently confirmed ore/mineral-concentrate feed, with phase/element/offgas balance and every actual chemical/gas exchange individually added. Do not classify every refractory-ore calcine as ore automatically. Dissolved leach solution, pregnant carbon/resin, amalgam, chemically precipitated metal/salt, smelting matte, anode slimes, dore/bullion and clean metallic gold/silver/PGM product gates are separate; commercial concentrate naming alone cannot establish mineral identity. Recycled jewellery, catalyst, electronic scrap and industrial residues need their own secondary-material methodology. Include actual development/closure, water/tailings/sediment/dust controls, handling and transport only through the selected mineral gate. | `bgs-platinum-2009`, `epa-gold-placer-1994`, `epa-gold-lode-1994`, `wco-hs26-2022`, `ifc-mining-2007` |\n| boundary_partition | all exchanges | Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases. |  |\n| boundary_completeness | inventory | Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished. |  |\n\n"
