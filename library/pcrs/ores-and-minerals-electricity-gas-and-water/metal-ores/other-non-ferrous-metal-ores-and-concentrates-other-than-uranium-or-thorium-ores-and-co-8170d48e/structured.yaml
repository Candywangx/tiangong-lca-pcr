system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Cover the full residual other metal-ore/concentrate category: manganese, cobalt, lead, zinc, tin, chromium, tungsten, molybdenum, titanium, niobium, tantalum, vanadium, zirconium, antimony and other individually qualifying metallurgical ore families, including actual mercury, bismuth, beryllium, lithium or rare-earth ore only after mineralogical/processing and no-other-category review. Manganese and chromium are included here by the historical official correspondence despite everyday ferrous/nonferrous terminology; do not drop them by metal-use convention. Each dataset selects an actual geological deposit/ore assemblage, raw/prepared/concentrated or admissible roasted mineral state and mine/plant/loading or expressly included receipt gate. Raw ore-only sorting/loading, hard-rock crushing/grinding/classification and actual physical gravity/flotation/magnetic/electrostatic separation, mineral-sand recovery and dewatering/drying are distinct conditional routes. Sulphide Pb/Zn flotation is an evidenced route, not mandatory for oxidised ores or other families. Scheelite and wolframite require separate actual gravity/flotation/magnetic circuits; cassiterite, chromite, ilmenite/rutile/zircon, columbite/tantalite and other mineral assemblages require their own actual phase, liberation and separator protocols, not a universal sulphide recipe. Include actual normal-metallurgical mineral preparation while retaining the declared qualifying ore/concentrate gate. Explicitly include both unroasted and roasted molybdenum ores/concentrates under HS2613; actual roasting has a separate measured phase, moisture, sulphur, oxygen, dust and off-gas balance. No blanket unheated limit and no default roast conversion or yield. Another thermal treatment requires individual normal-metallurgical processing and product-gate review; synthetic rutile, purified oxide, salt, metal, alloy, carbide or intermediate chemical cannot be called ore merely because its element came from a mine. The HS26 mineralogical-species/normal-metallurgy definition admits qualifying ores even for nonmetallurgical intended use, not every mineral containing a trace metal. Ferruginous manganese qualification requires measured dry Mn at least20% under HS2602; this criterion does not impose that purity on all manganese deposits or ores, and ordinary iron ore is separate. Current CPC3 notes/detail name14290 without family explanation/current HS2022 correspondence; historical official CPC2.1 HS2012/2017 list includes260200,260500,260700,260800,260900,261000,261100,261310,261390,261400,261510,261590,261710,261790. Use this and original HS2022 as candidate semantic evidence, not a current accepted HS mapping. Exclude uranium/thorium ores, copper/nickel/aluminium/precious-metal reference products, iron ore, industrial slag/ash/sludge/matte, scrap and recycled-metal residues, smelting/refining/electrowinning, metal/chemical manufacture, formulated mixtures and finished articles. Associated excluded-family co-products from actual polymetallic circuits retain separate identities, burdens and allocation, never relabelled residual ore. Natural radioactivity within a permitted rare-earth mineral requires actual U/Th/radionuclide impurity characterization and fate; a uranium/thorium reference ore remains excluded. Include actual development/closure, infrastructure attribution, controls, water, residues, storage/loading and included delivery; supplied mineral feed carries its actual provider rather than duplicate extraction."
      source_ids:
        - wco-other-metal-ores-2022
        - unsd-other-ore-scope-2026
        - epa-leadzinc-beneficiation-1994
        - bgs-tungsten-beneficiation-2011
        - ifc-mining-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
