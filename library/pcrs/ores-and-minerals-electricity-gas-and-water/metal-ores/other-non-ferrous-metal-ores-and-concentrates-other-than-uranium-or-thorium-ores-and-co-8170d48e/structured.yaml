allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide actual mine/family and beneficiation/roasting circuits before allocating shared burdens. Retain unallocated joint ore inventory and independent accepted Mn/Co/Pb/Zn/Sn/Cr/W/Mo/Ti/Nb/Ta/V/Zr/Sb or other concentrates and any copper/nickel/precious co-products with their own identity and gate. Contained metals in one sold mixed concentrate are compositional assays, not separately sold outputs; mixed Nb-Ta concentrate is one actual product unless distinct accepted products are demonstrably recovered. Use physical causality where supported, otherwise consistent period/grade/price/currency economic allocation with sensitivity. Tailings/backfill are waste or managed internal placement unless independent saleable specification/fate justifies co-product; backfill does not automatically earn avoided aggregate/closure credits. Attribute lifetime development/closure once over measured accepted production; supplied feed links upstream burden or justified cut-off. No automatic avoided metal, fertilizer, synthetic chemical or waste-treatment credit."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
