published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply1 kg accepted net as-received ore/concentrate of one qualifying family and gate; not1 kg contained metal, pure mineral or assay oxide equivalent"
  excluded_use: "U/Th ores, copper/nickel/aluminium/precious-metal/iron reference ores, slag/ash/matte/sludge/scrap/recycled residues; smelted/refined metals/alloys, purified oxides/salts/intermediate chemicals/synthetic rutile, formulated mixtures and articles"
  required_metadata: "site/year; actual ore family/mineral assemblage/geological origin and deposit/provider; raw versus concentrate versus roast and gate; dry/as-received moisture and element/mineral assay, oxide-equivalent versus real phase; individual Mn/Co/Pb/Zn/Sn/Cr/W/Mo/Ti/Nb/Ta/V/Zr/Sb or other element impurities and speciation including natural U/Th/radionuclides where present; actual route and every reagent/formulation; reference whole-product D and matching stocks/recovery; utilities supplier/geography/voltage/fuel/water; development/closure lifetime, co-products/allocation, residues/releases/fate and transport/packaging. Zinc reference UUID ecb60d59-d9e3-4d96-958d-7b4453a8174f is Product/Mass primary GLO delivered-to-smelter only; another family, site-specific supply or plant gate needs its own compatible confirmed flow, no fixed Zn grade. Zinc-content-property flow cannot substitute for whole-product mass. Current CPC3 HS2022 correspondence and other-family/thermal gate assignment remain review needs"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
data_sources:
  - id: "wco-other-metal-ores-2022"
    type: "official_guidance"
    reference: "WCO HS Nomenclature2022 Chapter26, original pp1-2 Notes1/2 and headings2602,2605,2607–2611,2613–2615,2617. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0526_2022e.pdf?la=en"
    used_for: "Full mineral-ore families, ferruginous manganese criterion, roasted/unroasted molybdenum and distinction from smelting mattes/industrial residues. No current HS mapping or inventory factors."
  - id: "unsd-other-ore-scope-2026"
    type: "official_guidance"
    reference: "UNSD current CPC3.0 detail14290 and historical CPC2.1 detail14290, originals retrieved1 October2026. https://unstats.un.org/unsd/classifications/Econ/Detail/EN/2100/14290 ; https://unstats.un.org/unsd/classifications/Econ/Detail/EN/1074/14290"
    used_for: "Current category title and historical HS2012/2017 families. Current CPC3 notes/detail lack family explanation/HS2022 correspondences; historical evidence is not a current accepted mapping."
  - id: "epa-leadzinc-beneficiation-1994"
    type: "official_guidance"
    reference: "US EPA Technical Resource Document, Extraction and Beneficiation of Ores and Minerals Volume1 Lead-Zinc, EPA530-R-94-011, June1994, original pp21–23 printed1-14 to1-16, section1.4 and Table1-4. https://archive.epa.gov/epawaste/nonhaz/industrial/special/web/pdf/leadzinc.pdf"
    used_for: "Actual mining/milling/physical concentration distinction from smelting/refining, individual conditional reagent identities; no universal ore recipe, purity, dose or historical intensity."
  - id: "bgs-tungsten-beneficiation-2011"
    type: "literature"
    reference: "P. Pitfield and T. Brown, BGS Tungsten Mineral Commodity Profile, January2011, original pp9–10 Figure3 and Ore beneficiation. https://nora.nerc.ac.uk/id/eprint/17445/1/tungstenProfile%5B1%5D.pdf"
    used_for: "Distinct scheelite/wolframite gravity/flotation/magnetic/electrostatic routes and ore gate versus APT/metal/oxide manufacture. WO3-equivalent assay is not assumed real oxide or grade."
  - id: "ifc-mining-2007"
    type: "official_guidance"
    reference: "IFC, Environmental Health and Safety Guidelines for Mining, 10 December 2007, sections 1.1 and Annex A. https://www.ifc.org/content/dam/ifc/doc/2000/2007-mining-ehs-guidelines-en.pdf"
    used_for: "Mining water, wastes, emissions, development and closure; no product-specific default factors."
  - id: "cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; no process quantities."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5, consolidated 30 December 2021. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Multifunctionality hierarchy; not a claim of complete PEF conformity."
