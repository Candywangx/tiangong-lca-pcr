measurement_rules:
  - id: reference_basis
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is the positive accepted net gate-output total in kg. Exclude packaging and cancelled internal transfers. cp_output records D; every card uses per 1 kg reference flow."
  - id: conversion
    applies_to: "utility and material rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Retain raw readings. Electricity: 1 kWh = 3.6 MJ. Mass/volume conversion requires measured density, temperature and applicable pressure; retain water content and active chemical fraction."
  - id: category_balance
    applies_to: "production"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is independently calibrated positive net accepted as-received whole ore/concentrate mass kg at the selected gate excluding packaging/rejects/returns and reconciled with stocks. All cards use this same D. For measured wet-basis free-water fraction w,0 <= w <1, dry product mass = D*(1-w); preserve hydrate phases, distinguish structural water and carbonate/organic losses from free moisture. For measured dry-basis elemental assay gE,0 <= gE <=1, contained element mass = D*(1-w)*gE; retain D denominator rather than normalizing to contained Zn or another metal. For assay expressed as oxide-equivalent E_aO_b, contained element = dry mass*gOx*a*M(E)/M(E_aO_b); record species and molar masses. WO3/TiO2/ZrO2/Nb2O5/Ta2O5/V2O5/Cr2O3 equivalents are analytical conventions, not automatically actual oxide phases, mineral purity or smelting products. Mineral fraction requires independently identified phases and compositions, especially mixed Nb/Ta and variable wolframite/chromite assemblages; do not infer pure stoichiometric mineral from elemental assay alone. Geological resource cards record extracted contained element with its measured ore-grade basis, separately from purchased bulk ore mass, not a finished-metal product or duplicate ore resource. Reconcile metal-by-metal and bulk dry-solids feed, each accepted concentrate/co-product, tailings/waste rock/dust, stock changes and measured losses. Recovery = matched accepted output dry mass*element fraction / matched input dry mass*element fraction after stock corrections, not output grade alone; raw-ore-only gates have no invented concentrating yield. Actual roasting needs input/output phase-specific metal and sulfur assays, oxygen intake, water and SO2/dust/captured-residue balance with measured inventories; roasted Mo oxide-bearing mineral concentrate is not assumed pure MoO3 and no universal conversion is prescribed. Match fresh/recycled/evaporated/discharged water separately. No fixed assay, yield, reagent dose, fuel intensity, lost-metal zero or negative tailings credit."
