  calculation_rules:
    - id: normalization
      applies_to: "all cards"
      rule: "Exchange = attributable period quantity / D. Reconcile inventories and cancel internal transfers before aggregation."
      inputs:
        - cp_output
        - "row-specific cp records"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "production"
      rule: "D is positive accepted net as-received product mass in kg at the selected gate, excluding packaging and rejects. Record each stream moisture w and dry-solids mass m_dry = m_wet × (1 − w); assay grades on their stated basis. Contained-alumina mass is dry-solids mass times the matching dry-basis Al2O3 fraction, not the reference denominator. Reconcile dry ore, product, waste rock, wash fines, losses, stock changes and transferred water. Separate circulated wash water, new intake and measured return; no universal recovery, grade or density."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: representativeness
      applies_to: "dataset"
      requirement: "Use matching production and exchange periods, actual technology, geography and supplier state. Record startup, shutdown, seasonal variation and substitutions."
      evidence: "collection records"
    - id: identity_and_ranges
      applies_to: "all cards"
      requirement: "Unresolved identities and missing independent range evidence remain explicit. Do not replace measurement by a guessed industry range or by missing-as-zero."
      evidence: "manifest review metadata"
validation_rules:
  - rule_id: validate_reference
    applies_to: "final_product"
    rule: "Verify 1 kg, positive D, product state, property/unit and every required qualifier. Each dataset fixes one product and route."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "site"
    rule: "D is positive accepted net as-received product mass in kg at the selected gate, excluding packaging and rejects. Record each stream moisture w and dry-solids mass m_dry = m_wet × (1 − w); assay grades on their stated basis. Contained-alumina mass is dry-solids mass times the matching dry-basis Al2O3 fraction, not the reference denominator. Reconcile dry ore, product, waste rock, wash fines, losses, stock changes and transferred water. Separate circulated wash water, new intake and measured return; no universal recovery, grade or density."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "handoff"
    rule: "Verify each applicable exchange, its provider or environmental compartment and final waste fate; identify skipped checks, unresolved identities, missing measurements and upstream gaps. Errors or unassessed mandatory coverage cannot be labelled complete."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply 1 kg of specified aluminium ore or physical concentrate; no equivalence to 1 kg aluminium or alumina"
  excluded_use: "Alumina chemicals/refining; aluminium metal; calcined refractory bauxite; finished abrasives; customer conversion"
  required_metadata: "site/year; mineralogy; mining method; integrated/standalone start; raw/crushed/washed state; particle size; as-received moisture; dry-basis total and available alumina and reactive silica where relevant; gate; yield and rejects; water basin; waste fate; allocation; development and closure basis; representative UUID applies only to washed bauxite, with a distinct identity required for unwashed or other aluminium minerals"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
data_sources:
  - id: "iai-bauxite-mining-2026"
    type: "extension_guidance"
    reference: "International Aluminium Institute, The Aluminium Story, Mining: Process, web snapshot 1 October 2026, Mining: The process. https://alustory.international-aluminium.org/mining-refining/process-mining/"
    used_for: "Surface extraction, topsoil/overburden separation, optional crushing/washing and refinery handover; no universal grade or consumption."
  - id: "ifc-mining-2007"
    type: "official_guidance"
    reference: "IFC, Environmental Health and Safety Guidelines for Mining, 10 December 2007, sections 1.1 and Annex A. https://www.ifc.org/content/dam/ifc/doc/2000/2007-mining-ehs-guidelines-en.pdf"
    used_for: "Mining water, wastes, emissions, development and closure; no product-specific default factors."
  - id: "cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; no process quantities."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5, consolidated 30 December 2021. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Multifunctionality hierarchy; not a claim of complete PEF conformity."
