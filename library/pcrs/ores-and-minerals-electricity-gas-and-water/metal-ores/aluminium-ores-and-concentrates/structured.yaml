measurement_rules:
  - id: reference_basis
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is the positive accepted net gate-output total in kg. Exclude packaging and cancelled internal transfers. cp_output records D; every card uses per 1 kg reference flow."
  - id: conversion
    applies_to: "utility and material rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Retain raw readings. Electricity: 1 kWh = 3.6 MJ. Mass/volume conversion requires measured density, temperature and applicable pressure; retain water content and active chemical fraction."
  - id: category_balance
    applies_to: "production"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is positive accepted net as-received product mass in kg at the selected gate, excluding packaging and rejects. Record each stream moisture w and dry-solids mass m_dry = m_wet × (1 − w); assay grades on their stated basis. Contained-alumina mass is dry-solids mass times the matching dry-basis Al2O3 fraction, not the reference denominator. Reconcile dry ore, product, waste rock, wash fines, losses, stock changes and transferred water. Separate circulated wash water, new intake and measured return; no universal recovery, grade or density."
