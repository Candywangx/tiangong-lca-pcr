system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "This PCR covers aluminium-bearing ores and physically beneficiated concentrates at a declared mine or processing gate, with bauxite as the representative material. Include actual development, topsoil/overburden removal, extraction, handling, crushing, sizing and optional washing/dewatering through that gate. Distinguish integrated mining from standalone processing receiving burden-bearing ore. Not all bauxite is washed. Other aluminium minerals require their actual mineralogy, extraction and beneficiation evidence and distinct flow identities; they cannot inherit bauxite washing quantities. Exclude Bayer digestion/alumina refining, aluminium smelting, calcined refractory products, finished abrasives and downstream customer processing."
      source_ids:
        - iai-bauxite-mining-2026
        - ifc-mining-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
