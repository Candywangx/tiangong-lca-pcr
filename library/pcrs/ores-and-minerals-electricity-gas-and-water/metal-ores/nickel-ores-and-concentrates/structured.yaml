system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Supply of nickel mineral ores and concentrates at one declared mine, preparation/loading or explicitly included delivery gate. Cover sulfide ores, lateritic oxide/hydrous-silicate ores and other independently confirmed nickel-category mineral ores, including nickel-cobalt or nickel-copper-bearing grades. Surface and underground mining, standalone supplied-ore preparation and actual crushing, screening, washing/scrubbing, sorting, magnetic/gravity separation, grinding, flotation and concentrate thickening/filtration are conditioned on actual mineralogy and operation. Do not require flotation for laterite or ore-only output; distinguish limonite and saprolite and retain actual clay, moisture, Fe/Mg/Si and associated-metal evidence. Other mineral ores and novel routes require their own geological identity and actual process/exchange collection, not assumed sulfide intensities. Qualified thermal mineral-feed preparation is included only when the output still has confirmed ore/mineral-concentrate identity, with measured phase changes and sulfur/water/offgas balance. Smelting matte, ferronickel/nickel pig iron, dissolved leach solution, chemically precipitated mixed hydroxide/sulfide, nickel sulfate/oxide chemicals and refined nickel metal are separate products; commercial use of the word concentrate does not convert a precipitated chemical into mineral concentrate. Exclude recycled metal and industrial slag as mineral-ore feed; geological material recovered from old mine stocks retains its actual upstream/cut-off and rehabilitation burden. Include attributable development/closure, handling, tailings, water/air control and agreed transport only through the selected gate."
      source_ids:
        - bgs-nickel-2008
        - wco-hs26-2022
        - ifc-mining-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
