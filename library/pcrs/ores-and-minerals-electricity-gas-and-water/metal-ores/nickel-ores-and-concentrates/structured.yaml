    - protocol_id: cp_output
      process_id: "dispatch"
      flow_role: "final_product"
      record_type: "measurement_record"
      raw_fields: "period; site; amount; original unit; uncertainty; stock changes; route condition; allocation; D; product qualifiers"
      collection_method: "Independently weigh positive accepted net mineral kg D at selected gate with calibrated scale, reconciling packaging/returns/rejects and stock. Pair batch free moisture w and dry-basis Ni fraction g with mineral/horizon and Co/Cu assays. Dry mass = D*(1-w); contained nickel = D*(1-w)*g; retain D as denominator. State drying/assay method so laterite bound water is not silently treated as free water."
      unit: "kg"
      frequency: "Each meter interval or shipment; monthly reconciliation"
      temporal_coverage: "Complete year or justified representative production campaign"
      site_scope: "One accepted nickel mineral ore or concentrate grade at a stated loading/receipt gate, with measured free moisture, mineral phase and dry-basis nickel/associated-element assays"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original records; assay; balance residuals; uncertainty"
  calculation_rules:
    - id: normalization
      applies_to: "all cards"
      rule: "Exchange = attributable period quantity / D. Reconcile inventories and cancel internal transfers before aggregation."
      inputs:
        - cp_output
        - "row-specific cp records"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "production"
      rule: "D is independently weighed positive accepted net as-received mineral-product kg at the stated gate, excluding packaging, rejects and cancelled internal transfers. Measure wet-basis free-moisture fraction w with0 <= w <1; dry mineral mass = D*(1-w). Measure dry-basis nickel mass fraction g with0 <= g <=1; contained Ni kg = D*(1-w)*g, with D retained as inventory denominator. Bound water in laterite hydrous minerals is not free moisture; disclose drying assay method and thermal phase so dehydroxylation cannot silently redefine dry basis. Reconcile dry mineral solids and each Ni/Co/Cu component in feed, product, separated concentrates, tailings, rejects and stocks, separately from new/circulating/evaporated/discharged water. Recovery requires matched feed/output dry mass and assays after stock adjustment; neither concentrate grade nor refinery yield establishes mining recovery. Thermal preparation requires measured phase, water, sulfur and actual oxidation/offgas balances; additional actual gases and pollutants each separate."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: representativeness
      applies_to: "dataset"
      requirement: "Use matching production and exchange periods, actual technology, geography and supplier state. Record startup, shutdown, seasonal variation and substitutions."
      evidence: "collection records"
    - id: identity_and_ranges
      applies_to: "all cards"
      requirement: "Unresolved identities and missing independent range evidence remain explicit. Do not replace measurement by a guessed industry range or by missing-as-zero."
      evidence: "manifest review metadata"
validation_rules:
  - rule_id: validate_reference
    applies_to: "final_product"
    rule: "Verify 1 kg, positive D, product state, property/unit and every required qualifier. Each dataset fixes one product and route."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "site"
    rule: "D is independently weighed positive accepted net as-received mineral-product kg at the stated gate, excluding packaging, rejects and cancelled internal transfers. Measure wet-basis free-moisture fraction w with0 <= w <1; dry mineral mass = D*(1-w). Measure dry-basis nickel mass fraction g with0 <= g <=1; contained Ni kg = D*(1-w)*g, with D retained as inventory denominator. Bound water in laterite hydrous minerals is not free moisture; disclose drying assay method and thermal phase so dehydroxylation cannot silently redefine dry basis. Reconcile dry mineral solids and each Ni/Co/Cu component in feed, product, separated concentrates, tailings, rejects and stocks, separately from new/circulating/evaporated/discharged water. Recovery requires matched feed/output dry mass and assays after stock adjustment; neither concentrate grade nor refinery yield establishes mining recovery. Thermal preparation requires measured phase, water, sulfur and actual oxidation/offgas balances; additional actual gases and pollutants each separate."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "handoff"
    rule: "Verify each applicable exchange, its provider or environmental compartment and final waste fate; identify skipped checks, unresolved identities, missing measurements and upstream gaps. Errors or unassessed mandatory coverage cannot be labelled complete."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply1 kg of accepted nickel mineral ore or concentrate in its stated market condition; contained nickel is a separately calculated qualifier, not1 kg nickel metal"
  excluded_use: "Nickel/copper/cobalt smelting matte; ferronickel and nickel pig iron; metal or recycled scrap; industrial slags; leach solutions; chemically precipitated MHP/MSP, nickel sulfate/oxide chemicals; transport-only services or separately declared cobalt/copper/precious-metal reference categories"
  required_metadata: "site/year; geological/mineral ore identity; sulfide/laterite-limonite/laterite-saprolite or other confirmed route; surface/underground/supplied-stock route; ore or concentrate; actual preparation and thermal phase; dry-basis Ni, Co, Cu, Fe, Mg, Si, sulfur and relevant deleterious-element assays; free versus bound water; particle size; actual gate/transport; accepted mass and stocks; measured recovery; tailings/waste fate; water basin and return; joint-product/provider allocation and lifetime development output; representative UUID only for nickel-cobalt ore Product/Mass at a compatible plant gate; other ore grades and concentrates need their own exact identities"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
