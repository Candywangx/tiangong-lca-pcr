allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide actual mining zones, ore preparation and independently separated concentrates when possible. Retain unallocated nickel-copper-cobalt/precious-metal joint inventories and justify physical causality or matched economic allocation with actual payable assays, treatment charges, prices and sensitivity. Embedded metals in one bulk concentrate are not multiple physical output masses; count a separate copper/cobalt mineral concentrate only when actually recovered and weighed. Assign supplied/old-stock ore upstream allocation or justified cut-off and actual rehabilitation/transport burdens; no zero-burden assumption. Attribute development/closure once over measured lifetime accepted output; no automatic avoided-metal/disposal or internal-recycle credit."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
