      rule: "Exchange = attributable period quantity / D. Reconcile inventories and cancel internal transfers before aggregation."
      inputs:
        - cp_output
        - "row-specific cp records"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "production"
      rule: "D is independently weighed positive accepted net as-received mineral-product kg at the declared gate, excluding packaging, rejected material and cancelled transfers. Measure wet-basis free moisture w with0 <= w <1; dry mineral mass = D*(1-w). Measure dry-basis copper mass fraction g with0 <= g <=1; contained Cu kg = D*(1-w)*g. Retain D as the common inventory denominator; neither dry mineral kg nor contained Cu kg is substituted silently. Reconcile dry ore/concentrate/tailings/reject/stock solids and each measured metal component independently of water intake, recycle, evaporation and discharge. Calculate metal recovery only from matched input/output dry masses and assays after inventory adjustment; do not infer recovery from grade alone or import smelter yield. Thermal preparation needs phase-specific mass, sulfur and actual oxygen/offgas balances; all additional actual chemicals, gases and pollutants require separate cards."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
      source_ids: []
