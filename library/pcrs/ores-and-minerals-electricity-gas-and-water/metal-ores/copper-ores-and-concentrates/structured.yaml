published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply1 kg of qualified copper ore or mineral concentrate in its declared state; report contained copper separately without claiming equivalence to1 kg copper metal"
  excluded_use: "Smelting matte; blister/anode/cathode or cement copper; leach solutions and separated refined compounds; copper-industry slag/dross or recycled scrap; transport-only service; precious-metal or other-metal concentrates with a different declared category"
  required_metadata: "site/year; geological/mineralogical ore identity; sulfide/oxide/native/mixed route; surface/underground or supplied ore; ore versus concentrate and actual processing/thermal state; dry-basis Cu, sulfur, associated metals and deleterious-element assays; free moisture and grading; actual gate and transport inclusion; accepted output and stock; measured recovery and tailings fate; water source/basin/return; co-product classification, upstream provider and allocation; lifetime development output; representative UUID applies only to generic supplied copper ore, not grade-specific concentrate or geological elementary resource"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
data_sources:
  - id: "epa-copper-1994"
    type: "official_guidance"
    reference: "US EPA, Technical Resource Document: Extraction and Beneficiation of Ores and Minerals, Volume4 Copper, EPA530-R-94-031, August1994, PartA original PDF pp.31–34,48–49. https://archive.epa.gov/epawaste/nonhaz/industrial/special/web/pdf/copper1a.pdf"
    used_for: "Qualitative sulfide-ore crushing, grinding, flotation, concentrate dewatering and tailings/water route; named reagent candidates only. Historic plant dimensions and national consumption totals are not site factors."
  - id: "wco-hs26-2022"
    type: "official_guidance"
    reference: "WCO HS Nomenclature2022 Chapter26, original PDF pp.1–2, Note2 and heading2603. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0526_2022e.pdf?la=en"
    used_for: "Ore/concentrate mineral identity and separation from smelting matte and industrial slag/residue; no new HS mapping or process quantity."
  - id: "ifc-mining-2007"
    type: "official_guidance"
    reference: "IFC, Environmental Health and Safety Guidelines for Mining, 10 December 2007, sections 1.1 and Annex A. https://www.ifc.org/content/dam/ifc/doc/2000/2007-mining-ehs-guidelines-en.pdf"
    used_for: "Mining water, wastes, emissions, development and closure; no product-specific default factors."
  - id: "cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; no process quantities."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5, consolidated 30 December 2021. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Multifunctionality hierarchy; not a claim of complete PEF conformity."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:4254442e618d176757c58f1f20b337fe4ad4afee0fac5697c56119c08802e25c"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6816"
      family: "system_boundary"
      span:
        start:
          offset: 6816
          line: 55
          column: 1
        end:
          offset: 10677
          line: 74
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual copper-bearing geological deposit for integrated primary mining, or supplied identified burden-bearing ore for standalone concentration; internal mine-to-mill transfers cancel |\n| starting_condition_role | Resource or supplied feed; declare which |\n| product_classification_scope | Copper mineral ores and concentrates, including sulfide, oxide, native-copper and mixed-mineral ore states; confirmed copper-category bulk concentrates and qualified normally prepared mineral feeds |\n| recursive_input_rule | Purchased same-category material carries a distinct supplier dataset; internal recycling is a balance observation, not a new external input or credit. |\n| upstream_dataset_requirement | Link feed, electricity, fuels, chemicals, infrastructure and waste-management burdens; disclose any missing coverage. |\n| disclosure | site/year; geological/mineralogical ore identity; sulfide/oxide/native/mixed route; surface/underground or supplied ore; ore versus concentrate and actual processing/thermal state; dry-basis Cu, sulfur, associated metals and deleterious-element assays; free moisture and grading; actual gate and transport inclusion; accepted output and stock; measured recovery and tailings fate; water source/basin/return; co-product classification, upstream provider and allocation; lifetime development output; representative UUID applies only to generic supplied copper ore, not grade-specific concentrate or geological elementary resource |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_operations | site | Supply of copper ores and mineral concentrates at one declared mine, concentrator-loading or explicitly included delivery gate. Cover sulfide, oxide, native-copper and mixed mineral ores, surface or underground extraction, and standalone preparation of supplied ores. Follow actual crushing, sorting, gravity separation, grinding, flotation, thickening, filtration and drying rather than imposing sulfide flotation on oxide/native ores or on a run-of-mine product. Mixed-metal bulk concentrates require confirmed copper-category identity, mineral/metal assays and joint-product allocation; each dataset declares one actual output state. Include any actual thermal ore preparation only when its output remains a qualified ore/mineral-concentrate feed; record transformed phases and sulfur/offgas balance, with separate actual treatment and emission rows. This condition does not automatically classify a calcine as ore. Copper-bearing slag, dross and recycled scrap require separate secondary-material methodologies, not an ore identity inferred from copper content. Dissolution/leach solution, solvent extraction/electrowinning, cement copper, smelting matte, blister/anode/cathode copper and refined compounds are distinct downstream product gates. Do not use their yield or metal kilogram as the mineral-product denominator. Include attributable development, closure, handling, tailings/water/dust controls and transport only through the selected gate. | `epa-copper-1994`, `wco-hs26-2022`, `ifc-mining-2007` |\n| boundary_partition | all exchanges | Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases. |  |\n| boundary_completeness | inventory | Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished. |  |\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 163
              line: 8
              column: 1
            end:
              offset: 193
              line: 8
              column: 31
