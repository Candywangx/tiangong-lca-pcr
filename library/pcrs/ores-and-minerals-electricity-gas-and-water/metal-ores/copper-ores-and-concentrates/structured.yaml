allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide extraction, ore sorting, separate concentrate circuits and dispatch when possible. Retain joint bulk-concentrate and associated-metal inventories before allocation; contained-metal mass is not automatically physical causality. Justify actual physical relationship or economic allocation with matched grades, payable terms, treatment charges, prices and reporting period, without counting an embedded precious metal again as a separate physical output. Separate saleable molybdenum concentrate from copper mineral output; tailings do not become burden-free co-products merely because sold. Attribute development/closure once over measured lifetime accepted output. No automatic avoided-metal, avoided-disposal or internal-recycle credit."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
