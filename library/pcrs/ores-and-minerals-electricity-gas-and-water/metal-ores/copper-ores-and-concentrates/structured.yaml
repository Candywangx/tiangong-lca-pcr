system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Supply of copper ores and mineral concentrates at one declared mine, concentrator-loading or explicitly included delivery gate. Cover sulfide, oxide, native-copper and mixed mineral ores, surface or underground extraction, and standalone preparation of supplied ores. Follow actual crushing, sorting, gravity separation, grinding, flotation, thickening, filtration and drying rather than imposing sulfide flotation on oxide/native ores or on a run-of-mine product. Mixed-metal bulk concentrates require confirmed copper-category identity, mineral/metal assays and joint-product allocation; each dataset declares one actual output state. Include any actual thermal ore preparation only when its output remains a qualified ore/mineral-concentrate feed; record transformed phases and sulfur/offgas balance, with separate actual treatment and emission rows. This condition does not automatically classify a calcine as ore. Copper-bearing slag, dross and recycled scrap require separate secondary-material methodologies, not an ore identity inferred from copper content. Dissolution/leach solution, solvent extraction/electrowinning, cement copper, smelting matte, blister/anode/cathode copper and refined compounds are distinct downstream product gates. Do not use their yield or metal kilogram as the mineral-product denominator. Include attributable development, closure, handling, tailings/water/dust controls and transport only through the selected gate."
      source_ids:
        - epa-copper-1994
        - wco-hs26-2022
        - ifc-mining-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
