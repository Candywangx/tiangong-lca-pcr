system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "This PCR covers potable or non-potable bulk water suitable for a declared further use, including untreated freshwater abstraction, conventional treatment, membrane or thermal desalination and reclamation of used water. Fix the actual source, treatment train and quality. The supply gate may be the plant meter or a declared network handover; include network pumping, flushing and leakage only for that boundary. Raw seawater as a marketed product, steam/hot water, bottled beverages, carbonated mineral water, distilled-water chemical products and water unsuitable for further use are excluded. Wastewater-treatment service and usable reclaimed-water supply require separate burden and product declarations. For ion exchange, adsorption or additional reclamation steps, add the actual resin, regenerant, activated carbon, residual and pollutant exchanges individually; the candidate cards do not replace a plant audit."
      source_ids:
        - epa-water-2004
        - doe-desalination
        - doe-alternative-water
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Identified natural freshwater or seawater resource, supplied raw water, or traceable used-water feed for reclamation"
  starting_condition_role: "Resource or supplied feed; declare which"
  product_classification_scope: "Bulk liquid water meeting one declared further-use specification"
  recursive_input_rule: "Purchased same-category material carries a distinct supplier dataset; internal recycling is a balance observation, not a new external input or credit."
  upstream_dataset_requirement: "Link feed, electricity, fuels, chemicals, infrastructure and waste-management burdens; disclose any missing coverage."
  disclosure: "site, basin and year; source and salinity; untreated/treated/reclaimed state; intended further use and quality evidence; treatment train; meter temperature; plant/network gate; losses and stock change; residual fate; allocation; energy supply"
