measurement_rules:
  - id: reference_basis
    applies_to: "final_product"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "D is the positive accepted net gate-output total in m3. Exclude packaging and cancelled internal transfers. cp_output records D; every card uses per 1 m3 reference flow."
  - id: conversion
    applies_to: "utility and material rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Retain raw readings. Electricity: 1 kWh = 3.6 MJ. Mass/volume conversion requires measured density, temperature and applicable pressure; retain water content and active chemical fraction."
  - id: category_balance
    applies_to: "production"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Close source-water, product, concentrate, sludge water, backwash, reuse, evaporation, flushing, network losses and stock balances. D is accepted net m3 at the declared gate; record meter temperature. Convert chemical solution and wet sludge masses with measured concentration and moisture. Abstraction is not equal to consumption: disclose receiving basin and returned quantity/quality. Do not convert m3 to kg using an undocumented universal density."
