      inputs:
        - cp_output
        - "row-specific cp records"
      output: "per 1 m3 reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "production"
      rule: "Close source-water, product, concentrate, sludge water, backwash, reuse, evaporation, flushing, network losses and stock balances. D is accepted net m3 at the declared gate; record meter temperature. Convert chemical solution and wet sludge masses with measured concentration and moisture. Abstraction is not equal to consumption: disclose receiving basin and returned quantity/quality. Do not convert m3 to kg using an undocumented universal density."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
      source_ids: []
