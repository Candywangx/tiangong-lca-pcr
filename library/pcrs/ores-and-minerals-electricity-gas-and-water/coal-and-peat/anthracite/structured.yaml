allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared_processes"
    rule: "Prefer subdivision with submetered activities before allocation. For this attributional supply dataset, do not net avoided-product credits into the reference inventory; any system-expansion comparison is separate and disclosed."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: allocation_physical
    applies_to: "saleable_outputs"
    rule: "When subdivision cannot separate jointly produced grades, justify a causal physical allocation driver. Use same-basis saleable mass only when comparable grade/state demonstrates that mass tracks burdens; test an energy/value alternative for materially different grades."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: allocation_waste
    applies_to: "gangue_and_sludge"
    rule: "Do not allocate product burdens to wastes without economic value; include attributable treatment. If gangue, fines or captured methane are actually sold, collect quantities and gate values, reclassify as co-products and justify physical or, if unsupported, economic allocation consistently."
    source_ids:
      - ghg-product-standard-2011
