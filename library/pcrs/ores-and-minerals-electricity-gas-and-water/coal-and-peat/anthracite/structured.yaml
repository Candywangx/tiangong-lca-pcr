  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Divide attributable reporting-period exchange by accepted net anthracite output in kg; internal transfer pairs use identical measured quantity and cancel on consolidation."
      inputs:
        - "row-specific cp records"
        - cp_anthracite_output
        - "allocation worksheet"
      output: "Exchange per 1 kg reference flow"
      source_ids:
        - ghg-product-standard-2011
    - id: electricity_conversion
      applies_to: "electricity rows"
      rule: "Convert kWh readings to MJ by multiplying by 3.6 before period normalization."
      inputs:
        - kWh
      output: "MJ"
      source_ids:
        - un-ires-2018
  data_quality_requirements:
    - id: rank_state
      applies_to: "anthracite_output"
      requirement: "Verify anthracite rank, raw/washed status and same analytical basis; mass is not useful energy."
      evidence: "un-ires-2018"
    - id: completeness
      applies_to: "all inventory rows"
      requirement: "Perform site exchange audit, waste fate and water/coal balances; distinguish measured zero, absent route and missing observation."
      evidence: "ifc-mining-ehs-2007; cp records"
    - id: representativeness
      applies_to: "dataset"
      requirement: "Use matched production and exchange periods; disclose location, uncertainty, substitution and unmeasured closure burdens. No default industry range replaces collection."
      evidence: "cp records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference_flow"
    rule: "Verify net 1 kg output, all qualifiers, kg/MJ/m3 units and denominator consistency; compare dry and as-received values only after measured-moisture conversion."
    source_ids:
      - un-ires-2018
  - rule_id: validate_balance
    applies_to: "inventory"
    rule: "Reconcile feed, saleable grades, rejects, moisture changes, stocks and transfers. Identify missing emissions and waste treatment, and ensure no duplicate resource, fuel combustion or internal transfers."
    source_ids:
      - ifc-mining-ehs-2007
  - rule_id: validate_evidence
    applies_to: "dataset"
    rule: "Every nonzero exchange needs a compatible upstream dataset or direct emission/waste fate, collection evidence and reviewed identity. Keep unresolved identities and missing ranges explicit; do not publish a proxy as verified or impute zero from missing records."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply of declared grade and route anthracite to downstream LCA"
  excluded_use: "Customer useful heat, other coal ranks or transformed carbon products without additional modelling"
  required_metadata: "Reference qualifiers; site/year; boundary; route; source datasets; allocation; collection coverage"
  required_quality_disclosure: "Identity gaps; missing measurements/ranges; uncertainty; route absences; closure/capital coverage"
  update_trigger: "Changed mine/grade/route, moisture basis, energy supply, allocation or material monitoring results"
data_sources:
  - id: "un-ires-2018"
    type: "official_guidance"
    reference: "International Recommendations for Energy Statistics, United Nations, 2018, chapter III SIEC 011 (p. 27); chapter IV paragraphs 4.21–4.24 and 4.33–4.38 (pp. 44–47). https://unstats.un.org/unsd/energystats/methodology/documents/IRES-web.pdf. Retrieved 2026-10-01."
    used_for: "Anthracite rank and analytical basis; energy units and fuel-specific calorific values. PCR mass comparability and declared raw/washed state are authoring requirements; no default calorific-value range adopted"
  - id: "epa-ap42-coal-cleaning-1995"
    type: "official_guidance"
    reference: "11.10 Coal Cleaning, EPA AP-42, November 1995. https://www.epa.gov/sites/default/files/2020-10/documents/c11s10.pdf. Retrieved 2026-09-30."
    used_for: "Physical preparation and dust collection; no default factors adopted"
  - id: "ifc-mining-ehs-2007"
    type: "official_guidance"
    reference: "Environmental, Health, and Safety Guidelines, IFC, Mining, 10 December 2007. https://www.ifc.org/content/dam/ifc/doc/2000/2007-mining-ehs-guidelines-en.pdf. Retrieved 2026-09-30."
    used_for: "Mining water, waste and lifecycle coverage; no numeric limits adopted"
  - id: "ghg-product-standard-2011"
    type: "standard"
    reference: "Product Life Cycle Accounting and Reporting Standard, WRI/WBCSD, 2011, chapter 9. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf. Retrieved 2026-09-30."
    used_for: "Allocation hierarchy as a method reference, not a complete LCA impact method"
