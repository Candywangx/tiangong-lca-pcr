system_boundary:
  rules:
    - rule_id: boundary_coverage
      applies_to: "production"
      rule: "Include extraction where foreground, internal haulage, ventilation, dewatering, applicable preparation, storage/loading, pollution controls and attributable waste treatment. Collect development, closure and rehabilitation burdens attributable to output and disclose their amortization."
      source_ids:
        - ifc-mining-ehs-2007
    - rule_id: boundary_routes
      applies_to: "inventory"
      rule: "Omit conditional exchanges only with documented absence. Before dataset completion add separate atomic rows for actual non-diesel dryer fuels, other explosives, flocculants, used oil, overburden, land occupation/transformation and individual water/air pollutants. Do not substitute this minimum route inventory for a site audit."
      source_ids:
        - ifc-mining-ehs-2007
        - epa-ap42-coal-cleaning-1995
    - rule_id: boundary_partition
      applies_to: "emissions"
      rule: "Model purchased diesel supply without combustion when direct emissions are foreground. Exclude downstream customer transport/use; report capital equipment exclusions and test materiality. On-site treated water requires separate receiving-compartment discharges and species, not a wastewater emission to nature."
      source_ids:
        - ifc-mining-ehs-2007
