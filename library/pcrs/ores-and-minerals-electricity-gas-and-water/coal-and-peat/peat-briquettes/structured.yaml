    rule: "First subdivide using line meters, weighed production and thermal-supply records. Shared heat generation is assigned by measured delivered heat; electricity by submeter readings. Document any remaining allocation and test sensitivity."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: allocate_rework
    applies_to: "peat_reject"
    rule: "Internal fines recirculation receives no avoided-product credit. Treat discarded fines and ash as waste unless documented sale establishes a co-product; subdivision precedes allocation by demonstrated physical relationships; use a disclosed, justified economic relationship only when the physical basis cannot be established or used."
    source_ids:
      - ghg-product-standard-2011
