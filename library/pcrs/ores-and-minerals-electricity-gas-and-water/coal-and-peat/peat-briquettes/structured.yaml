      quality_evidence: "Calibration; scale tickets; test method; allocation log; balance closure"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Divide attributable reporting-period exchange totals by accepted net briquette mass in kg. The briquettes reference output is exactly 1 kg."
