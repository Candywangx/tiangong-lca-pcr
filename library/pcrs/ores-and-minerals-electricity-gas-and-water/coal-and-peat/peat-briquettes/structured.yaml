      raw_fields: "fuel peat mass and moisture; gas volume pressure and temperature; delivered heat; fuel carbon and sulfur; each measured emitted substance; fly ash; bottom ash"
      collection_method: "Use calibrated scales and meters, traceable supplier receipts and representative moisture tests; quantify actual emissions after controls by substance, air compartment and method. Preserve zero/absent and missing values separately."
      unit: "kg; MJ; m3 according to each row"
