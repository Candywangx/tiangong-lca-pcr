    - id: quality_complete
      applies_to: "all inventory rows"
      requirement: "Reconcile dry matter, water, energy and rejected material. Record actual additional fuels, water discharges, packaging components and emitted species as individual exchanges with their own identity checks; do not hide them in a total-material row. Explain missing values and unresolved flow identities."
      evidence: "cp_prepare; cp_dry; cp_finish; cp_boiler"
validation_rules:
  - rule_id: validate_basis
