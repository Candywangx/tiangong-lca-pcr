        - un-energy-peat-products-2024
    - rule_id: boundary_upstream
      applies_to: "peat_supply"
      rule: "Keep extraction and drainage burdens in a linked upstream dataset; do not assume burden-free peat or zero drainage emissions. IPCC national guidance informs upstream coverage, not a factory emission factor."
