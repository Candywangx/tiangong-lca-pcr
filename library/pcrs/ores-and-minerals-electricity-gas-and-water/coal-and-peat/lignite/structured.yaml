allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared_mine_operations"
    rule: "First isolate separately metered and directly attributable activities. Allocate shared mine operations by documented causal drivers such as material movement, pumping duty and equipment time; preserve raw totals and allocated fractions in cp_allocation."
    source_ids: []
  - rule_id: allocation_outputs
    applies_to: "coproducts_and_waste"
    rule: "Overburden, waste oil and discharged water are not coproducts merely because they leave the mine. For genuinely saleable co-extracted products, disclose the physical relationship; if no defensible subdivision or causal allocation exists, refer that dataset allocation to review. No automatic revenue share or substitution credit is prescribed."
    source_ids: []
  - rule_id: allocation_restoration
    applies_to: "mine_life"
    rule: "Attribute development and restoration from the declared mine-life plan to the corresponding recoverable output, including closure obligations. Disclose lifetime-output assumptions and sensitivities; do not burden only the final operating year or treat future reclamation as zero."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "gate_release"
      flow_role: "product"
      record_type: "weighing"
      raw_fields: "net dispatched mass; opening and closing stock; moisture; calorific value; ash; sulfur; particle size; sample date"
      collection_method: "Calibrated belt scale or weighbridge with tare and representative matched moisture/quality sampling; reconcile transfers and stock"
      unit: "kg"
      frequency: "Each dispatch and representative quality sample"
      temporal_coverage: "One complete declared annual period; lifetime activities separately disclosed"
      site_scope: "Declared mine and linked supporting areas"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, reconciliation and uncertainty; retain allocation evidence"
    - protocol_id: cp_mine_energy
      process_id: "mine_operations"
      flow_role: "electricity"
      record_type: "meter"
      raw_fields: "meter readings; equipment; voltage; supplier; on-site generation; operating hours"
      collection_method: "Use submeters and reconcile supplier invoices; separate gate meter and on-site generation fuels"
      unit: "MJ"
      frequency: "Continuous meter, monthly reconciliation"
      temporal_coverage: "One complete declared annual period; lifetime activities separately disclosed"
      site_scope: "Declared mine and linked supporting areas"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, reconciliation and uncertainty; retain allocation evidence"
    - protocol_id: cp_gate_energy
      process_id: "gate_release"
      flow_role: "electricity"
      record_type: "meter"
      raw_fields: "gate meter readings; equipment operating hours; conditioning state"
      collection_method: "Meter gate handling, allocating shared demand with operating records"
      unit: "MJ"
      frequency: "Continuous meter, monthly reconciliation"
