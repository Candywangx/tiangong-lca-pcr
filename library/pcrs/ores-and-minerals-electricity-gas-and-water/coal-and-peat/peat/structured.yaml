allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "foreground"
    rule: "Use dedicated site and route records before allocating common burdens; exclude internal peat rehandling from saleable output."
    source_ids: []
  - rule_id: allocation_common
    applies_to: "multiple_peat_grades"
    rule: "For inseparable common burdens of unagglomerated peat grades, use measured dry-matter output shares so moisture does not change burden share; disclose shares, rejected material and sensitivity to an alternative allocation. Preparation and closure burdens use documented lifetime recovered dry-matter production and reconcile annually. No avoided-product credit in the gate dataset."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "peat_production"
      flow_role: "peat mass"
      record_type: "weighing"
      raw_fields: "net gate mass; excavated mass; moisture fraction w; dry-matter stock change; rejects"
      collection_method: "Calibrated weighbridge or scales and representative paired moisture samples; record mass balance and stock surveys."
      unit: "kg"
      frequency: "Each lot; reconcile annually"
      temporal_coverage: "One complete representative year plus attributable establishment/closure"
      site_scope: "Source peatland and production gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; field records; model/factor provenance; boundary reconciliation"
    - protocol_id: cp_energy
      process_id: "peat_production"
      flow_role: "diesel and electricity records"
      record_type: "meter_log"
      raw_fields: "diesel kg; density for litre conversion; electricity kWh; equipment hours; contracted service boundary"
      collection_method: "Read calibrated meters, fuel receipts and stock changes; assign preparation, pumping and extraction without double counting."
      unit: "kg; kWh"
      frequency: "Monthly and production season"
      temporal_coverage: "One complete representative year plus attributable establishment/closure"
      site_scope: "Source peatland and production gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; field records; model/factor provenance; boundary reconciliation"
    - protocol_id: cp_land
      process_id: "peatland_management"
      flow_role: "land use"
      record_type: "survey"
      raw_fields: "area m2; occupation years; prior land state; converted area; active and inactive drained area; ditch widths and lengths"
      collection_method: "GIS survey and drainage history; verify mapped dates, ownership and restoration plan; retain production lifetime basis."
      unit: "m2; a"
      frequency: "Annually and each conversion"
      temporal_coverage: "One complete representative year plus attributable establishment/closure"
      site_scope: "Source peatland and production gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; field records; model/factor provenance; boundary reconciliation"
    - protocol_id: cp_ghg
      process_id: "peatland_management"
      flow_role: "peatland gases"
      record_type: "monitoring_model"
      raw_fields: "CO2-C; CH4; N2O-N; climate; nutrient class; flux intervals; ditch fraction; model and factors; production kg"
      collection_method: "Use seasonally representative chamber or flux monitoring, or document IPCC method tier and matched activity/factors. Separate conversion, soil loss and ditch flux; include nonproduction season."
      unit: "kg; m2; a"
      frequency: "Seasonal integration over full year"
      temporal_coverage: "One complete representative year plus attributable establishment/closure"
      site_scope: "Source peatland and production gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; field records; model/factor provenance; boundary reconciliation"
    - protocol_id: cp_water
      process_id: "peatland_management"
      flow_role: "drainage"
      record_type: "sampling"
      raw_fields: "discharge volume; DOC concentration; receiver; treatment-transfer mass; sample dates and storms"
      collection_method: "Measure discharge and flow-weighted DOC samples across season and storms; retain treatment receipts and receiving-water identity."
      unit: "kg; m3; mg/L"
      frequency: "Seasonal and storm-event coverage"
      temporal_coverage: "One complete representative year plus attributable establishment/closure"
      site_scope: "Source peatland and production gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; field records; model/factor provenance; boundary reconciliation"
    - protocol_id: cp_combustion
      process_id: "peat_production"
      flow_role: "combustion and dust"
      record_type: "monitoring_model"
      raw_fields: "diesel carbon; oxidation; CO2 factors; measured PM10; activity; controls; model uncertainty"
      collection_method: "Use fuel-carbon balance for CO2 and PM10-specific monitoring or validated site model. Add other actual combustion pollutants as separate atomic rows."
      unit: "kg"
      frequency: "Production-season records and annual reconciliation"
      temporal_coverage: "One complete representative year plus attributable establishment/closure"
      site_scope: "Source peatland and production gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; field records; model/factor provenance; boundary reconciliation"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Inventory intensity = attributable period exchange total / net gate peat output in kg; reference output is 1 kg. Both numerator and denominator refer to the same period and moisture state."
      inputs:
        - cp_mass
        - cp_energy
        - cp_land
        - cp_ghg
        - cp_water
        - cp_combustion
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: dry_matter_reconcile
      applies_to: "peat_resource, peat_output"
      rule: "Dry mass = wet mass * (1-w); resource dry mass plus opening stocks equals sold dry mass plus closing stocks plus accounted losses; report residual and sampling uncertainty."
      inputs:
        - cp_mass
      output: "dry-matter reconciliation"
      source_ids: []
    - id: ghg_activity
      applies_to: "soil_carbon_dioxide, peatland_methane, peatland_nitrous_oxide"
      rule: "Integrate observed flux * area * duration, or sum matched area * duration * applicable factor by stratum. Retain units and factor provenance; distinguish ditch area and soil surface to avoid overlap. Convert element-basis factors before normalization."
      inputs:
        - cp_ghg
        - cp_land
        - cp_mass
      output: "gas mass per reference flow"
      source_ids:
        - ipcc-wetlands-2013
    - id: doc_mass
      applies_to: "drainage_doc"
      rule: "DOC kg = sum(discharge m3 * DOC mg/L) * 0.001; normalize using normalize_period; retain sampling uncertainty and direct-discharge boundary."
      inputs:
        - cp_water
        - cp_mass
      output: "kg dissolved organic carbon per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_site
      applies_to: "all"
      requirement: "Match peat type, climate, drainage history and harvest technology; use a full representative year and disclose production variability."
      evidence: "cp_land; cp_mass; ipcc-wetlands-2013"
    - id: quality_balance
      applies_to: "all"
      requirement: "Reconcile energy invoices, production and stocks; report losses and missing exchange coverage explicitly. Add site-specific thermal drying or packaging only with identified individual exchanges and matching protocols."
      evidence: "cp_energy; cp_mass"
    - id: quality_carbon
      applies_to: "peatland_management"
      requirement: "Retain carbon-stock boundaries and model/factor version; disclose uncertainty and avoid treating extraction as instant release of all exported carbon."
      evidence: "cp_ghg; ipcc-wetlands-2006; ipcc-wetlands-2013"
validation_rules:
  - rule_id: validate_reference
    applies_to: "peat_output"
    rule: "Require 1 kg net gate peat, declared moisture and all reference qualifiers; do not compare wet and dry datasets as equivalent."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "all"
    rule: "Require every applicable atomic exchange, matching collection records and upstream links; unresolved UUIDs remain explicit. Absence needs physical evidence, not an invented zero."
    source_ids: []
  - rule_id: validate_carbon
