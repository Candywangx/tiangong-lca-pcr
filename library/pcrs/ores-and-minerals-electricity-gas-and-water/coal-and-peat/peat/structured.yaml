system_boundary:
  rules:
    - rule_id: boundary_production
      applies_to: "foreground"
      rule: "Include preparation, drainage maintenance, harvesting, drying, storage and loading; include on-site GHG and land occupation. Collect omitted actual fuels, chemicals, wastes and emissions as separate atomic exchanges before dataset acceptance."
      source_ids:
        - ipcc-wetlands-2006
    - rule_id: boundary_carbon
      applies_to: "peatland_management"
      rule: "Keep soil carbon loss, fuel combustion and exported peat carbon separate. Include land conversion and attributable drained inactive areas; disclose a site-specific post-extraction drainage/restoration scenario separately from annual operating inventory, including its allocation to recovered peat."
      source_ids:
        - ipcc-wetlands-2006
        - ipcc-wetlands-2013
    - rule_id: boundary_downstream
      applies_to: "gate"
      rule: "Exclude downstream peat combustion, horticultural oxidation, growing-media formulation and customer delivery. Do not treat exported carbon as an emission at the gate or award an automatic sequestration credit."
      source_ids:
        - ipcc-wetlands-2006
    - rule_id: boundary_water
      applies_to: "drainage_doc, drainage_effluent"
      rule: "Wastewater transferred to treatment and direct environmental DOC release are different destinations; do not count the same untreated DOC again as both treatment input and direct release. Quantify downstream DOC oxidation only in an explicitly separate scenario."
      source_ids:
        - ipcc-wetlands-2013
boundary_abstraction:
  declared_starting_condition: "Source peat deposit with documented prior land use and drainage history"
  starting_condition_role: "Natural resource entry; prior drainage remains attributable where caused by peat extraction"
  product_classification_scope: "Unagglomerated peat; CPC reference does not imply usable methodology for briquettes"
  recursive_input_rule: "Purchased peat is a product input requiring its own extraction dataset; do not replace it by an elementary extraction or recursively recreate its supplier"
  upstream_dataset_requirement: "Link geographically matched fuel and electricity production, external treatment and any purchased peat; avoid duplicate supplier extraction"
  disclosure: "Report active, preparation and inactive drained areas, historical conversion and restoration horizon; disclose all exclusions and carbon stocks exported"
