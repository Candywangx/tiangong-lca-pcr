allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "foreground burdens"
    rule: "Use separate meters and records to assign separable operations to coal grades and exported gas. Record allocation factors, quantities and rationale in cp_allocation. No avoided-product credit is assumed."
    source_ids: []
  - rule_id: allocation_joint
    applies_to: "joint coal outputs"
    rule: "For inseparable coal-grade outputs, justify the physical relationship before allocation; use net calorific energy when burdens follow energy-bearing coal production, with measured grade-specific mass and heating value. If unsuitable, disclose another justified basis and sensitivity. Do not allocate to waste solely because it contains carbon."
    source_ids: []
  - rule_id: allocation_gas
    applies_to: "mine_methane; mine_co2"
    rule: "Distinguish methane captured, used internally, exported and released. Retain joint-process burdens and explicit allocation separately from emission accounting; do not subtract captured quantities from already measured net releases."
    source_ids:
      - ipcc-fugitive-2019
