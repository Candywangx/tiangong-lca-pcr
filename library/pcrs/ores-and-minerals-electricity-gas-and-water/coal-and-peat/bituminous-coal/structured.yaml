  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Divide the attributable reporting-period quantity in its declared unit by net saleable reference-coal mass in kg for the same period. Internal transfers cancel in the integrated package; reference output is 1 kg."
      inputs:
        - "Measured exchange"
        - cp_gate_mass
        - cp_allocation
      output: "Amount per 1 kg reference flow"
      source_ids: []
    - id: methane_accounting
      applies_to: "mine_methane; prep_methane"
      rule: "Integrate source-specific flow and methane concentration over time with stated temperature, pressure, moisture and mass conversion. Distinguish measured net releases from gross estimates adjusted for documented recovery; add combustion products separately."
      inputs:
        - Monitoring
        - "capture/use/flare records"
      output: "Fossil methane mass to air"
      source_ids:
        - ipcc-fugitive-2019
  data_quality_requirements:
    - id: quality_coal
      applies_to: "saleable_coal"
      requirement: "Verify coal rank, quality and net gate mass; identify moisture and calorific bases with each assay."
      evidence: "Weighing and representative coal assays"
    - id: quality_coverage
      applies_to: "all inventory rows"
      requirement: "Retain positive, zero and missing records distinctly. Quantify uncertainty, monitoring gaps and estimation methods. Neither missing UUID nor absent literature range implies zero exchange."
      evidence: "Collection protocols and uncertainty ledger"
    - id: quality_water
      applies_to: "mine_water; prep_water; mine_effluent; prep_effluent"
      requirement: "Reconcile fresh supply, mine drainage, reuse, discharge and water retained in output; report discharge loads by pollutant where on-site treatment is modelled."
      evidence: "ifc-mining-2007"
validation_rules:
  - rule_id: validate_reference
    applies_to: "saleable_coal"
    rule: "Require all reference qualifiers and exactly 1 kg net reference output at declared moisture. Check EN/ZH inventory identity and denominator agreement."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "all inventory rows"
    rule: "Reconcile coal, water, energy and waste records across the same period. Investigate balance residuals against documented measurement uncertainty rather than an invented universal tolerance."
    source_ids:
      - ifc-mining-2007
  - rule_id: validate_emissions
    applies_to: "mine_methane; prep_methane; mine_co2; prep_co2"
    rule: "Reject double counting of gas capture, internal fuels or upstream electricity emissions. Verify atmospheric compartment and fossil origin; do not replace a missing species UUID with another chemical."
    source_ids:
      - ipcc-fugitive-2019
  - rule_id: validate_extensions
    applies_to: "foreground package"
    rule: "Verify each applicable site exchange, waste treatment and land contribution is included or explicitly justified; publish unresolved identity and range gaps with the dataset."
    source_ids:
      - ifc-mining-2007
published_dataset_profile:
  dataset_role: "Foreground production data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared mine-gate bituminous coal supply in material and energy supply chains"
  excluded_use: "Other coal ranks; coke or electricity production; downstream combustion; universal mining average without route evidence"
  required_metadata: "Reference qualifiers, period, region, gate, upstream links, unit conversions, allocation and completeness"
  required_quality_disclosure: "Measurement uncertainty, estimates, omitted processes, unresolved identities and range evidence, infrastructure and closure assumptions"
  update_trigger: "Change in seam, route, moisture/grade, methane management, energy supply, allocation or new verified measurements"
