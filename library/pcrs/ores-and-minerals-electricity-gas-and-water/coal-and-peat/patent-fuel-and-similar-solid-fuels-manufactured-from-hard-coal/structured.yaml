system_boundary:
  rules:
    - rule_id: boundary_manufacture
      applies_to: "manufacture"
      rule: "Include actual feed preparation, mixing, forming, conditioning, internal handling, losses and pollution control from receipt through the product gate. Drying and binder requirements depend on coal characteristics; do not assume a universal route."
      source_ids:
        - epa-coal-conversion-1979
    - rule_id: boundary_upstream
      applies_to: "foreground data package"
      rule: "Represent upstream supplies with linked datasets; received feed is not burden-free. Document delivery links. Post-gate distribution, combustion and packaging disposal belong to separately declared downstream scenarios."
      source_ids: []
    - rule_id: boundary_inventory
      applies_to: "manufacture"
      rule: "Record all actual external exchanges within the declared collection boundary. For other binders, fuels or packaging actually used, add specific atomic rows and collection records; never use category rows or assumed zeros. Capital-equipment construction is outside this operating package and must be disclosed."
      source_ids: []
