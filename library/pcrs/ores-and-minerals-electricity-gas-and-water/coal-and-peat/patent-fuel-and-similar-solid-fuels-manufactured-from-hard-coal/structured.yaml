allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "manufacture"
    rule: "Separate formulations using distinct campaigns, unit-operation measurements and operating time. Partition shared electricity with measured operating time and power; disclose and test alternatives when causality is not demonstrated."
    source_ids: []
  - rule_id: allocation_grade
    applies_to: "saleable_outputs"
    rule: "For multiple grades of the same fuel from one indivisible campaign, partition joint operating burdens by actual net saleable mass; disclose calorific differences and energy-allocation sensitivity."
    source_ids: []
  - rule_id: allocation_recycle
    applies_to: "internal_fines"
    rule: "Internal fines receive no avoided-burden credit; their rehandling and repressing energy remains included. Link waste treatment; declare product or waste status for any sold by-product and prevent duplicate credits."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "manufacture"
      flow_role: "finished_fuel"
      record_type: "weighing"
      raw_fields: "campaign; net finished mass; tare; moisture; ash; sulfur; NCV; acceptance"
      collection_method: "Weigh accepted fuel on calibrated scales excluding packaging; test representative same-campaign samples and record methods"
      unit: "kg"
      frequency: "batch and shift"
      temporal_coverage: "declared complete campaign including downtime and start-up"
      site_scope: "same plant and formulation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; weigh tickets; assay and acceptance records"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "material_inputs"
      record_type: "weighing"
      raw_fields: "individual flow; supplier; receipts and stock; dosing; moisture; recipe; packaging mass"
      collection_method: "Reconcile each material using weighing, dosing and opening/closing stock; volume-to-mass conversion requires measured density; divide campaign totals by same-period cp_output net finished mass to obtain the per-kg intensity."
      unit: "kg"
      frequency: "batch and campaign boundaries"
      temporal_coverage: "same period as cp_output"
      site_scope: "manufacturing boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh/supplier tickets; stock ledger; dosing; calibration"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "electricity_input; steam_input; dryer_gas"
      record_type: "metering"
      raw_fields: "meter start/end; steam pressure/temperature; gas temperature/pressure; same-period output; shared-load drivers"
      collection_method: "Meter electricity, steam and gas separately; convert electricity to MJ; reconcile purchase records and shared-load partition; divide campaign totals by same-period cp_output net finished mass to obtain the per-kg intensity."
      unit: "MJ; kg; m3"
      frequency: "shift and campaign"
      temporal_coverage: "same period as cp_output"
      site_scope: "manufacturing and pollution-control equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; invoices; operating time and partition evidence"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "coal_dust_disposal; process_wastewater"
      record_type: "waste_transfer"
      raw_fields: "individual waste mass; moisture/composition; destination; recycle amount; transfer records"
      collection_method: "Weigh coal dust and wastewater separately; reconcile transfer and recycle ledgers; wastewater volume conversion requires measured density; divide campaign totals by same-period cp_output net finished mass to obtain the per-kg intensity."
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "same period as cp_output"
      site_scope: "site exports"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "transfer records; water assay; destination; recycle ledger"
    - protocol_id: cp_air
      process_id: "manufacture"
      flow_role: "fossil_co2; fossil_co; nitrogen_dioxide; sulfur_dioxide; particulate_air"
      record_type: "emission_measurement"
      raw_fields: "species; release point; concentration; gas volume; hours; method; fuel carbon; fossil fraction; particle size; captured mass"
      collection_method: "Prefer monitoring; integrate species concentration times gas volume on matching temperature/pressure basis. CO2 may use a measured fuel-carbon balance with oxidation and non-CO2 carbon flows. Without a method or representative sample, do not enter zero; divide campaign totals by same-period cp_output net finished mass to obtain the per-kg intensity."
      unit: "kg"
      frequency: "representative modes and full operating duration"
      temporal_coverage: "same period as cp_output"
      site_scope: "site stack and fugitive releases"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "monitoring; calibration; carbon balance; mode representativeness; detection limits"
  calculation_rules:
    - id: campaign_intensity
      applies_to: "all inventory rows"
      rule: "Divide each campaign exchange total by same-period accepted net finished fuel mass; finished product row is fixed to 1 kg."
      inputs:
        - cp_output
        - cp_material
        - cp_energy
        - cp_waste
        - cp_air
      output: "exchange amount per 1 kg reference flow"
      source_ids: []
    - id: moisture_conversion
      applies_to: "bituminous_feed; anthracite_feed; finished_fuel"
      rule: "Dry mass equals wet mass times one minus wet-basis moisture fraction; diagnostic balance only, not a replacement gate denominator."
      inputs:
        - cp_output
        - cp_material
      output: "diagnostic dry mass"
      source_ids: []
  data_quality_requirements:
    - id: dq_formulation
      applies_to: "manufacture"
      requirement: "Declare coal rank, all actual binders/additives, formulation, route and controls; illustrative rows do not replace the actual recipe."
      evidence: "recipe ledger and supplier specification"
    - id: dq_representative
      applies_to: "all inventory rows"
      requirement: "Collect all operating modes, losses and recycle for the same period; disclose gaps and substitutions; distinguish missing from zero."
      evidence: "raw records and completeness ledger"
    - id: dq_energy
      applies_to: "finished_fuel"
      requirement: "Distinguish wet/dry and gross/net calorific bases; declare measured as-produced NCV per kg gate mass; embodied fuel energy is not manufacturing energy input."
      evidence: "same-batch tests and method disclosure"
validation_rules:
  - rule_id: validate_identity
    applies_to: "finished_fuel"
    rule: "Confirm manufactured hard-coal fuel and all qualifiers; reference amount and output row both equal 1 kg; packaging is outside the denominator."
    source_ids:
      - unsd-energy-questionnaire-2024
  - rule_id: validate_balance
    applies_to: "manufacture"
    rule: "Reconcile coal, binder, water, net product, recycle and exports; disclose moisture evaporation, stock change and balance residual; interpret with instrument uncertainty rather than an invented tolerance."
    source_ids: []
  - rule_id: validate_atomic
    applies_to: "all inventory rows"
    rule: "Each row represents one exchange or species; check unit, applicability, destination and evidence. Do not treat NOx-as-NO2 totals as NO2 or sum total particulate with its size fractions."
    source_ids: []
  - rule_id: validate_normalization
    applies_to: "all inventory rows"
    rule: "Check same period, formulation and per 1 kg reference flow denominator. Exclude later product combustion; do not repeat upstream purchased-steam combustion emissions on site."
    source_ids: []
published_dataset_profile:
  dataset_role: "Manufacturing foreground data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply processes for declared hard-coal fuel formulation and gate state, linked into later life-cycle models"
  excluded_use: "Unqualified heat-service equivalence, comparison across coal rank or binder, and brown-coal, charcoal or coke substitution"
  required_metadata: "Site; year; coal rank; formulation; moisture/NCV basis; boundary; collection period; allocation; upstream and treatment links"
  required_quality_disclosure: "Missing exchanges and identities; estimates; monitoring representativeness; uncertainty; balance residual; absence evidence"
  update_trigger: "Change in feed, recipe, equipment, heating source, controls or sales-moisture specification"
data_sources:
  - id: "unsd-cpc-3-structure-2025"
    type: "official_guidance"
    reference: "UNSD, Central Product Classification Version 3.0 Structure, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv ; rows 432-444; retrieved 2026-09-30"
    used_for: "Classification identity and neighbouring categories"
  - id: "unsd-energy-questionnaire-2024"
    type: "official_guidance"
