      temporal_coverage: "one full declared reporting period; lifetime horizon for cp_land"
      site_scope: "identified mine and included preparation site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; laboratory reports; transfer receipts; activity logs; method and uncertainty"
