allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared processes"
    rule: "Separate measured mine, preparation and loading operations before allocating; identify grades and recovered gas sold as distinct products."
    source_ids:
      - ghgp-product-2011
  - rule_id: allocation_basis
    applies_to: "residual common burden"
    rule: "Use a demonstrated physical relationship for remaining common burdens. For coal grades, justify mass or energy allocation from the actual process relationship and measured moisture/NCV; if no physical relationship is defensible, use documented economic allocation with consistent price periods and a sensitivity result."
    source_ids:
      - ghgp-product-2011
  - rule_id: allocation_waste
    applies_to: "waste treatment"
    rule: "Do not assign product revenue shares to discarded rock or treatment wastewater. Retain their management burdens with the causing production; disclose any genuine saleable by-product and avoid unsubstantiated displacement credits."
    source_ids:
      - ghgp-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_coal
      process_id: "handling"
      flow_role: "Coal mass and quality"
      record_type: "measurement and reconciled record"
      raw_fields: "mine; seam; rank evidence; dispatch gross and tare; stock opening and closing; raw coal mass; moisture; ash; sulfur; NCV; sampling basis"
      collection_method: "Calibrated weighbridge and stock surveys; representative paired laboratory samples with method identifiers."
      unit: "kg"
      frequency: "per batch/month; retain annual total"
      temporal_coverage: "one full declared reporting period; lifetime horizon for cp_land"
      site_scope: "identified mine and included preparation site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; laboratory reports; transfer receipts; activity logs; method and uncertainty"
