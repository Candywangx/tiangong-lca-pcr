  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows except land and the reference product"
      rule: "Divide each attributable period exchange by net saleable as-received coal produced in the same period; derive production from dispatch plus closing minus opening saleable stocks. Convert tonnes to kg before division."
      inputs:
        - cp_coal
        - cp_diesel
        - cp_materials
        - cp_water
        - cp_wastes
        - cp_mine_gas
        - cp_handling_gas
        - cp_combustion
        - cp_land
        - cp_mine_power
        - cp_conditioning_power
        - cp_handling_power
        - cp_mine_dust
        - cp_handling_dust
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: land_normalization
      applies_to: "mine_land_occupation; mine_land_transformation"
      rule: "Divide attributable occupation area-time or transformation area by cumulative saleable as-received coal over the matching mine production horizon; disclose future production assumptions and update against realized output."
      inputs:
        - cp_land
        - cp_coal
      output: "land exchange per 1 kg reference flow"
      source_ids: []
    - id: gas_activity_basis
      applies_to: "mine_methane; handling_methane"
      rule: "When an applicable gas model uses raw coal tonnes, calculate its gas total with that raw-coal activity first, then divide by saleable coal kg; never apply a raw-coal factor directly to saleable tonnes."
      inputs:
        - cp_mine_gas
        - cp_handling_gas
        - cp_coal
      output: "gas exchange per 1 kg reference flow"
      source_ids:
        - ipcc-coal-fugitives-2019
  data_quality_requirements:
    - id: rank_quality
      applies_to: "saleable_coal"
      requirement: "Verify rank and report each analytical basis; one heat-content value cannot substitute for rank evidence."
      evidence: "cp_coal; eia-coal-glossary"
    - id: mass_water_balance
      applies_to: "all inventory rows"
      requirement: "Reconcile coal, moisture, gangue, stocks and water separately; explain losses and measurement gaps."
      evidence: "cp_coal; cp_water; cp_wastes"
    - id: evidence_scope
      applies_to: "emissions"
      requirement: "Disclose model source, test conditions, mine route, controls and uncertainty; old US dust guidance supports process identification, not a universal industry benchmark."
      evidence: "cp_mine_dust; cp_handling_dust; epa-surface-coal-1998"
    - id: completeness
      applies_to: "foreground package"
      requirement: "Expand with actual site-specific atomic exchanges; record missing measurements and upstream coverage. Do not default unmeasured methane, water, rejects or combustion to zero."
      evidence: "activity logs; ifc-mining-2007"
    - id: range_evidence
      applies_to: "all inventory rows"
      requirement: "Collect foreground values. No external inventory range is prescribed because two independent boundary-compatible original sources have not established one for this product state and route."
      evidence: "Meters, assays, surveys and source applicability review"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Reject a reference other than 1 kg net as-received saleable sub-bituminous coal, or missing rank, moisture and gate qualifiers."
    source_ids:
      - eia-coal-glossary
  - rule_id: validate_balances
    applies_to: "foreground"
    rule: "Verify meter coverage, stock reconciliation, dry/wet basis and allocation sums. Check raw-coal versus saleable denominator in gas calculations and independently evaluate all applicable source classes."
    source_ids:
      - ipcc-coal-fugitives-2019
  - rule_id: validate_particles
    applies_to: "dust"
    rule: "Do not sum PM2.5 and inclusive PM10 as disjoint quantities; derive the 2.5–10 micrometre fraction only from compatible measurements/models."
    source_ids:
      - epa-surface-coal-1998
  - rule_id: validate_identity
    applies_to: "inventory"
    rule: "Every row must be atomic with a compatible property, unit and compartment. An unresolved UUID does not justify a proxy. Wastewater transfers require treatment links and pollutant-resolved final emissions in the completed dataset."
    source_ids:
      - ifc-mining-2007
  - rule_id: validate_disclosure
    applies_to: "dataset"
    rule: "Require explicit missing-data, conditional-route, closure and allocation disclosures; distinguish measured totals, estimates and external evidence."
    source_ids:
      - ghgp-product-2011
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "background_dataset"
  allowed_use: "Mine-gate coal supply for separately modelled transport, fuel use and energy systems of the declared rank"
  excluded_use: "Consumer electricity or heat; other coal ranks; thermally upgraded coal; undisclosed generic global coal"
  required_metadata: "All reference qualifiers; process and supplier links; methods; units; geography; time; allocation; land/closure scope"
  required_quality_disclosure: "Measured/modelled shares; completeness; unresolved flow identities; uncertainty; absent ranges; stock and water balances; cut-offs"
  update_trigger: "Rank/state change; mine route or source-control change; revised gas model; new meters; changed allocation, stock or closure assumptions"
