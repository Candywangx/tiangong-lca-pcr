  market_state: "Unagglomerated bulk coal at declared moisture and particle-size specification"
functional_unit:
  what: "Supply saleable sub-bituminous coal for subsequent fuel use"
  how_much: "1 kg net product at the mine gate"
  how_well: "Declared sub-bituminous rank, measured as-received moisture, ash, sulfur, net calorific value and particle-size distribution; no generic rank inferred from calorific value alone"
  how_long_or_cycle: "One declared production reporting period with corresponding storage duration before release"
  reference_flow_link: "saleable_coal"
system_boundary:
  rules:
    - rule_id: boundary_production
      applies_to: "foreground"
      rule: "Include seam access, topsoil/overburden operations, extraction, internal haulage, ventilation/dewatering, physical preparation, storage, dust control and loading through the declared mine gate."
      source_ids:
        - epa-surface-coal-1998
    - rule_id: boundary_reclamation
      applies_to: "mine"
      rule: "Include attributable progressive reclamation and a disclosed closure/aftercare scenario; retain land cover before and after mining, occupied area and duration. Inventory all actual site-specific transformation-from and rehabilitation exchanges separately."
      source_ids:
        - ifc-mining-2007
    - rule_id: boundary_gases
      applies_to: "mine; handling"
      rule: "Distinguish seam-gas release, mining and post-mining emissions, recovery and destruction. Include attributable oxidation, fires and closure emissions where relevant; a low-rank coal designation is not proof of zero methane."
      source_ids:
        - ipcc-coal-fugitives-2019
    - rule_id: boundary_links
      applies_to: "background"
      rule: "Include upstream supplies and subsequent management of foreground wastes through linked datasets. Do not count on-site combustion twice through a fuel-supply dataset that already includes use. Capital equipment and infrastructure require a separately disclosed inclusion/cut-off assessment."
      source_ids:
        - ghgp-product-2011
    - rule_id: boundary_exclusions
      applies_to: "downstream"
      rule: "Exclude consumer transport beyond the declared gate and consumer combustion; model them separately. Document any off-site preparation included before the gate. Thermal upgrading requires an extended reviewed inventory."
      source_ids:
        - eia-coal-mining
boundary_abstraction:
  declared_starting_condition: "Coal seam in situ at the identified mine; externally supplied inputs at their physical entry points"
