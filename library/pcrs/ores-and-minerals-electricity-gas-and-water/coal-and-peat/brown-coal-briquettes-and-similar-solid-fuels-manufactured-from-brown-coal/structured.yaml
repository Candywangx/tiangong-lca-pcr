allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared_operations"
    rule: "Separate burdens by metered operation, production line or batch first; internal recycle is not a co-product."
    source_ids:
      - ghg-product-standard
  - rule_id: allocation_shared
    applies_to: "shared_operations"
    rule: "Collect attributable burdens and physical driver records under cp_allocation; shared burdens without demonstrated physical causality must not be arbitrarily allocated by product mass. Disclose alternative allocation and sensitivity and require methodology review."
    source_ids:
      - ghg-product-standard
  - rule_id: allocation_waste
    applies_to: "lignite_reject"
    rule: "Link actual waste treatment without automatic substitution credit for waste or internal recycle. Retain reject and start/stop burdens in the released-product denominator."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "finishing"
      flow_role: "reference_product"
      record_type: "foreground production records"
      raw_fields: "batch; packaging tare; finished net mass; moisture; ash; net calorific value; form; release record"
      collection_method: "Calibrated weighing; representative same-batch sampling with analytical method and basis recorded; reconcile release and inventory"
      unit: "kg"
      frequency: "per batch and monthly reconciliation"
      temporal_coverage: "complete declared accounting period"
      site_scope: "same refining site and formulation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw ledger; boundary reconciliation; gaps and uncertainty"
    - protocol_id: cp_material
      process_id: "preparation_finishing"
      flow_role: "lignite_feed; subbit_feed; pitch_binder"
      record_type: "foreground production records"
      raw_fields: "batch; material identity; coal rank; receipts; moisture; stock changes; formulation"
      collection_method: "Reconcile weighing, delivery and formulation records for net external input; track internal recycle separately"
      unit: "kg"
      frequency: "per batch and monthly reconciliation"
      temporal_coverage: "complete declared accounting period"
      site_scope: "same refining site and formulation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw ledger; boundary reconciliation; gaps and uncertainty"
    - protocol_id: cp_energy
      process_id: "preparation_drying_finishing_packaging"
      flow_role: "electricity"
      record_type: "foreground production records"
      raw_fields: "meter readings; meter boundary; voltage; supplier; country; operation; accounting period"
      collection_method: "Read submeters and reconcile main meter and invoices; prevent repeated shared burdens; retain start/stop electricity"
      unit: "kWh"
      frequency: "per batch and monthly reconciliation"
      temporal_coverage: "complete declared accounting period"
      site_scope: "same refining site and formulation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw ledger; boundary reconciliation; gaps and uncertainty"
    - protocol_id: cp_heat
      process_id: "drying"
      flow_role: "drying_heat"
      record_type: "foreground production records"
      raw_fields: "heat meter; steam and returned condensate flows; temperature; pressure; enthalpy; supply losses and origin"
      collection_method: "Use calibrated heat meter; for steam reconcile measured flows and inlet/return enthalpies with documented property method; no default efficiency"
      unit: "MJ"
      frequency: "per batch and monthly reconciliation"
      temporal_coverage: "complete declared accounting period"
      site_scope: "same refining site and formulation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw ledger; boundary reconciliation; gaps and uncertainty"
    - protocol_id: cp_emissions
      process_id: "drying"
      flow_role: "dryer_vapor; plant_dust"
      record_type: "foreground production records"
      raw_fields: "vent flow; particulate concentration; operating hours; moisture balance; condensate fate; controls"
      collection_method: "Integrate monitored discharge with operating records; reconcile evaporated water with closed moisture ledger separating recovery and venting; disclose estimates and uncertainty for gaps"
      unit: "kg"
      frequency: "per batch and monthly reconciliation"
      temporal_coverage: "complete declared accounting period"
      site_scope: "same refining site and formulation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw ledger; boundary reconciliation; gaps and uncertainty"
    - protocol_id: cp_waste
      process_id: "finishing"
      flow_role: "lignite_reject"
      record_type: "foreground production records"
      raw_fields: "waste composition; net mass; fate; recycle quantity; transfer record; coal rank"
      collection_method: "Weigh lignite fragments sent for external treatment and reconcile transfers and internal recycle; do not mix ash into this flow"
      unit: "kg"
      frequency: "per batch and monthly reconciliation"
      temporal_coverage: "complete declared accounting period"
      site_scope: "same refining site and formulation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw ledger; boundary reconciliation; gaps and uncertainty"
    - protocol_id: cp_packaging
      process_id: "packaging"
      flow_role: "pe_film"
      record_type: "foreground production records"
      raw_fields: "film resin; net use; loss; product batch; packaging specification"
      collection_method: "Reconcile purchase, issue and stock ledgers for polyethylene film; record mass delivered with fuel and separate film-trim waste exchange"
      unit: "kg"
      frequency: "per batch and monthly reconciliation"
      temporal_coverage: "complete declared accounting period"
      site_scope: "same refining site and formulation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw ledger; boundary reconciliation; gaps and uncertainty"
    - protocol_id: cp_allocation
      process_id: "all_processes"
      flow_role: "shared_operations"
      record_type: "foreground production records"
      raw_fields: "shared burden; meters; batch; physical driver; assigned shares; co-products; sensitivity"
      collection_method: "Submeter first; retain engineering causality and reconcile all assigned shares; refer unsupported allocation for methodology review"
      unit: "original record unit"
      frequency: "per batch and monthly reconciliation"
      temporal_coverage: "complete declared accounting period"
      site_scope: "same refining site and formulation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw ledger; boundary reconciliation; gaps and uncertainty"
  calculation_rules:
    - id: normalize_records
      applies_to: "all inventory rows"
      rule: "Divide each attributable period exchange by released net fuel mass in the same period, retaining its numerator unit. Reference product itself is 1 kg."
      inputs:
        - cp_mass
        - cp_material
        - cp_energy
        - cp_heat
        - cp_emissions
        - cp_waste
        - cp_packaging
        - cp_allocation
      output: "exchange per 1 kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_state
      applies_to: "reference_product"
      requirement: "Moisture, formulation, rank and calorific value must match inventory batches; do not mix dry and as-received bases."
      evidence: "cp_mass; cp_material"
    - id: quality_complete
      applies_to: "all inventory rows"
      requirement: "Record period, calibration, start/stop, stocks and recycle; add every extra exchange present; missing data is not zero."
      evidence: "collection protocols and raw ledgers"
    - id: quality_range
      applies_to: "all inventory rows"
      requirement: "External empirical ranges require at least two independent original-verified boundary-compatible sources; current rules require collection instead of defaults."
      evidence: "source applicability and independence record"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference_product"
    rule: "Check 1 kg net fuel reference quantity, complete qualifiers and consistency with release batches and analytical basis."
    source_ids: []
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "All exchanges must use the same finished-product denominator; reconcile period, electricity conversion and heat handoff without duplicating recycle or utility-generation burdens."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "material_and_water"
    rule: "Reconcile dry-matter and moisture balances with packaging, waste, emissions, stock and recycle ledgers; investigate discrepancies beyond declared measurement uncertainty without an unverified default tolerance."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Do not substitute proxies for unresolved UUIDs; confirm actual geography, voltage, carrier, product state and emission compartment before dataset publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Fuel supply modelling with matching form, moisture and route, linked upstream and downstream"
  excluded_use: "Direct useful-heat equivalence; proxy for hard coal, peat, biomass or coke; unconditional full-life-cycle comparison"
  required_metadata: "Required qualifiers; metering boundaries; period; recycle; co-products; upstream/downstream links"
  required_quality_disclosure: "UUID and range gaps; meter and assay uncertainty; allocation; missing data; coverage"
  update_trigger: "Update when feed, formulation, moisture, utility supply, technology or packaging changes"
