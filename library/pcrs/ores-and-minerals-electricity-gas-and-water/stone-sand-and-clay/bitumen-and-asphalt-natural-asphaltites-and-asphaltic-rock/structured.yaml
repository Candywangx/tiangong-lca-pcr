system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Supply the full natural category: native bitumen/asphalt, solid asphaltites and naturally asphaltic rock. Each foreground dataset fixes one actual geological family, accepted product state and extraction/preparation/loading or expressly included receipt gate. Native lake asphalt can retain natural mineral matter; asphaltites include geologically confirmed gilsonite, glance pitch or grahamite examples; asphaltic rock is naturally binder-bearing rock, not manufactured aggregate/binder mixture. The representative natural lake-asphalt gate does not restrict coverage or substitute its identity for other families. Actual lake/surface digging, solid-vein surface/underground mining or asphaltic-rock quarrying are distinct conditional routes. Preparation may be ore-only sorting/loading; crushing, grinding and size separation of asphaltites or asphaltic rock; physical removal of extraneous stones; free-water dewatering/drying; or controlled heating/sifting of natural lake asphalt preserving the declared native binder/mineral identity. Purely physical recovery of native bitumen from a separately identified mineral feed requires its own recovery, water, residue and measured natural-binder gate evidence, not automatic inclusion of tar-sand crude-oil production. Raw oil shale and tar sands have a separate mineral category; an input provider may supply them for an explicitly declared native-bitumen recovery gate, but the unsplit raw ore cannot be relabelled natural binder. Solvent separation, hot-water recovery or heating is included only when actually used and identity remains native; identify every solvent chemically and document recovery and residuals, never infer plant solvent use from laboratory solubility or prescribe a recipe. Foreground protocols initialize family-specific asphaltite/rock routes where external current operating evidence is unavailable; no universal hot refinery route is imposed. Exclude petroleum-refinery bitumen/residues even if called asphalt, oxidised or chemically transformed binder, upgrading/cracking/retorting or fuel/coke production, synthetic asphalt, coal tar/pitch, formulated cutbacks/emulsions/modified binders, asphalt concrete and other manufactured mixtures or finished paving/roofing articles. Heating for water removal and physical separation is not petroleum distillation; chemical alteration or diluent/refinery blend changes the product boundary and requires review. Include actual development/closure, attributable infrastructure, air/water/land controls, residues, storage/handling losses and gate transport; no assumed zero emissions or avoided paving burden."
      source_ids:
        - wco-hs27-2022
        - usgs-native-bitumen-1957
        - tla-natural-preparation-2026
        - ifc-mining-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
