allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide distinct natural lake, asphaltite/rock extraction, preparation and independently recovered binder/mineral circuits. Retain unallocated joint inventories and separate actual accepted co-output masses. Native binder and insoluble mineral within one sold asphaltic rock/lake-asphalt product are compositional fractions, not two co-products. Rejected mineral is saleable only with independently confirmed specification/mass/fate. Use demonstrated physical causality or matched grade/price/period economic allocation and sensitivity where needed; supplied mineral carries upstream dataset or documented justified cut-off. Lifetime development/closure allocated once over measured accepted production. No automatic virgin petroleum-bitumen, road durability, fuel, waste-disposal or storage credits."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
