  calculation_rules:
    - id: normalization
      applies_to: "all cards"
      rule: "Exchange = attributable period quantity / D. Reconcile inventories and cancel internal transfers before aggregation."
      inputs:
        - cp_output
        - "row-specific cp records"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "production"
      rule: "D is independently weighed positive accepted net as-received product kg at the selected natural product gate, excluding packaging/rejects/returns and reconciling stocks. Measure wet-basis free-water fraction w,0 <= w <1: dry product mass = D*(1-w). Crystal water in retained minerals and volatile native organics are not automatically free water; use a phase-preserving method and separate moisture, extraction, ash and ignition-loss results. For measured dry-basis extractable native-binder fraction gB,0 <= gB <=1, contained method-defined binder kg = D*(1-w)*gB; keep D denominator. Record assay solvent, extraction method, residual solvent correction, mineral insolubles and uncertainty; extractable binder, total organic carbon, volatile matter and asphaltenes are different quantities. Do not substitute dry-rock mass for binder mass or assume pure binder from asphaltite name. For separately recovered native binder use its own weighed accepted D and matched moisture/residual mineral/solvent assays; recovery = matched output dry mass*binder fraction / matched input dry mass*binder fraction after stock corrections, not output grade alone. Natural mineral matter within lake asphalt or asphaltic rock is part of one accepted physical product, not separately counted product output. Reconcile dry native organics/mineral solids across feed, accepted grades, separately recovered co-products, rejected rock/tails, captured dust, stock and actual organic losses. Measure new/recycled/evaporated/discharged water and actual solvent makeup/recovery/residuals separately; test physical preservation versus cracking/oxidation and route identity after heating. No assumed yield, default binder fraction, laboratory-solvent plant consumption, avoided refinery bitumen or carbon-storage credit."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: representativeness
      applies_to: "dataset"
      requirement: "Use matching production and exchange periods, actual technology, geography and supplier state. Record startup, shutdown, seasonal variation and substitutions."
      evidence: "collection records"
    - id: identity_and_ranges
      applies_to: "all cards"
      requirement: "Unresolved identities and missing independent range evidence remain explicit. Do not replace measurement by a guessed industry range or by missing-as-zero."
      evidence: "manifest review metadata"
validation_rules:
  - rule_id: validate_reference
    applies_to: "final_product"
    rule: "Verify 1 kg, positive D, product state, property/unit and every required qualifier. Each dataset fixes one product and route."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "site"
    rule: "D is independently weighed positive accepted net as-received product kg at the selected natural product gate, excluding packaging/rejects/returns and reconciling stocks. Measure wet-basis free-water fraction w,0 <= w <1: dry product mass = D*(1-w). Crystal water in retained minerals and volatile native organics are not automatically free water; use a phase-preserving method and separate moisture, extraction, ash and ignition-loss results. For measured dry-basis extractable native-binder fraction gB,0 <= gB <=1, contained method-defined binder kg = D*(1-w)*gB; keep D denominator. Record assay solvent, extraction method, residual solvent correction, mineral insolubles and uncertainty; extractable binder, total organic carbon, volatile matter and asphaltenes are different quantities. Do not substitute dry-rock mass for binder mass or assume pure binder from asphaltite name. For separately recovered native binder use its own weighed accepted D and matched moisture/residual mineral/solvent assays; recovery = matched output dry mass*binder fraction / matched input dry mass*binder fraction after stock corrections, not output grade alone. Natural mineral matter within lake asphalt or asphaltic rock is part of one accepted physical product, not separately counted product output. Reconcile dry native organics/mineral solids across feed, accepted grades, separately recovered co-products, rejected rock/tails, captured dust, stock and actual organic losses. Measure new/recycled/evaporated/discharged water and actual solvent makeup/recovery/residuals separately; test physical preservation versus cracking/oxidation and route identity after heating. No assumed yield, default binder fraction, laboratory-solvent plant consumption, avoided refinery bitumen or carbon-storage credit."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "handoff"
    rule: "Verify each applicable exchange, its provider or environmental compartment and final waste fate; identify skipped checks, unresolved identities, missing measurements and upstream gaps. Errors or unassessed mandatory coverage cannot be labelled complete."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply1 kg accepted net as-received natural asphalt-category product of one identified family/state/gate; contained soluble native binder is a qualifier, not1 kg pure bitumen or1 kg finished paving mixture"
  excluded_use: "Petroleum-refinery bitumen and residues, coal tar/pitch, synthetic or oxidised/chemically transformed binder, pyrolysis/retorted/upgraded petroleum/fuels/coke; unseparated oil-shale/tar-sand reference products; diluted/emulsified/blended modified binder, asphalt concrete, manufactured mixtures and finished articles or transport-only services"
  required_metadata: "site/year; native geological origin and actual family; raw mineral versus mineral-bearing asphalt versus separated binder gate; deposit/provider and actual supplier mix; route, physical separation/heating and no chemical upgrading; free water versus crystal water/volatile organic loss; dry-basis method-defined extractable native binder, insoluble mineral/ash and other relevant impurities; laboratory method/solvent and plant solvent separately; mass/stock/recovery and accepted grade/use/size/thermal state; electricity supplier/geography/voltage and heat source; fuels/water source; residue/emission fate; lifetime development/closure and allocation; packaging/transport. Reference natural lake asphalt UUID unresolved; generic Asphalt refinery-origin record is incompatible despite classification label; every other natural gate requires its own confirmed flow identity"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
data_sources:
  - id: "wco-hs27-2022"
    type: "official_guidance"
    reference: "WCO HS Nomenclature2022 Chapter27, original PDF p.4 headings2713/2714/2715. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0527_2022e.pdf?la=en"
    used_for: "Natural bitumen/asphalt, asphaltites and asphaltic-rock identity versus petroleum residues and manufactured mixtures; oil-shale/tar-sand mineral gate separate. No new HS mapping or quantities."
  - id: "usgs-native-bitumen-1957"
    type: "literature"
    reference: "Kenneth G. Bell, Uranium in Petroleum and Rock Asphalt, USGS Trace Elements Investigations697, September1957, preliminary report, original PDF pp.16–21 (printed12–17), Definitions and sampling paragraphs. https://pubs.usgs.gov/tei/697/report.pdf"
    used_for: "Historical native asphalt, asphaltite and asphaltic-rock distinctions, including solid gilsonite/glance pitch/grahamite examples and host-mineral distinction. Preliminary terminology only, not modern intensity, solvent prescription, purity or radiological range."
  - id: "tla-natural-preparation-2026"
    type: "literature"
    reference: "Lake Asphalt of Trinidad and Tobago (1978) Limited, About Us, original first-party web page, snapshot1 October2026, natural-asphalt heating/sifting and purchased-refinery-product paragraphs. https://trinidadlakeasphalt.com/about-us/"
    used_for: "One natural lake-asphalt heating/sifting preparation route versus separately manufactured emulsions/coatings and purchased petroleum bitumen. No marketing performance claims, universal temperatures, composition, yield or doses."
  - id: "ifc-mining-2007"
    type: "official_guidance"
    reference: "IFC, Environmental Health and Safety Guidelines for Mining, 10 December 2007, sections 1.1 and Annex A. https://www.ifc.org/content/dam/ifc/doc/2000/2007-mining-ehs-guidelines-en.pdf"
    used_for: "Mining water, wastes, emissions, development and closure; no product-specific default factors."
  - id: "cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; no process quantities."
