      rule: "Exchange = attributable period quantity / D. Reconcile inventories and cancel internal transfers before aggregation."
      inputs:
        - cp_output
        - "row-specific cp records"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "production"
      rule: "D is positive accepted net as-received stone mass in kg at the declared gate, excluding packaging, reject pieces and returned product. Independently weigh net loads or validate piece/volume records against measured mass/density and actual shape; never assume a universal density or per-piece mass. Reconcile extracted/supplied stone, saleable stone, scrap, saw kerf/slurry solids, stock changes and dust. Measure moisture and solid fraction separately; circulated cutting water is not repeated new intake."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
      source_ids: []
