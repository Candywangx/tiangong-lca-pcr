system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "This PCR covers granite, sandstone and other non-calcareous monumental/building stone as quarry blocks or rough-cut blanks at one declared quarry or rough-processing gate. Distinguish integrated extraction from standalone processing of supplied burden-bearing stone. Include actual site development, extraction, cutting/splitting, sorting, storage/loading, water/waste/dust controls and attributable rehabilitation through the gate. Separate granite, sandstone and other stone types by actual quarry and cutting route. Bedding-controlled sandstone extraction and harder-rock sawing do not share a universal density, wire consumption, silica fraction, cutting rate or yield. Subsequent finishing, installation and building-service performance are separate datasets."
      source_ids:
        - ifc-construction-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
