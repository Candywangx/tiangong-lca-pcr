measurement_rules:
  - id: reference_basis
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is the positive accepted net gate-output total in kg. Exclude packaging and cancelled internal transfers. cp_output records D; every card uses per 1 kg reference flow."
  - id: conversion
    applies_to: "utility and material rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Retain raw readings. Electricity: 1 kWh = 3.6 MJ. Mass/volume conversion requires measured density, temperature and applicable pressure; retain water content and active chemical fraction."
  - id: category_balance
    applies_to: "production"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is independently weighed positive accepted net as-received mass in kg for the selected stone grade, excluding packaging, other saleable grades and rejects. Measure wet-basis moisture w with 0 <= w < 1; dry solids = D*(1-w), retaining D as normalization denominator. Volume-based records require measured bulk density, compaction and moisture for that grade. Reconcile raw dry mineral solids, selected grade, other saleable grades, filter fines/slurry, stocks and releases. Return crusher oversize and captured dust internally without counting them as new resource, duplicated purchased feed or automatic avoided output. Reconcile new water, intrinsic moisture, internal circulation, evaporation and actual discharge separately. For industrial residues reconcile incoming dry residue plus stone/additives and actual hydration uptake against qualified macadam, recovered metal, rejects, stocks and releases. Conditioning hydration or actual carbonation can change dry mass; measure it and disclose any actual atmospheric-carbon transfer separately, without a guessed uptake or permanence credit."
