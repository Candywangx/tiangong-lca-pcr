system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Supply of natural pebbles/gravel, broken or crushed stone and unbound macadam stone, stone granules/chippings and mechanically produced stone powder at one declared loading gate. Cover terrestrial or permitted aquatic gravel extraction, hard-rock quarrying, standalone processing of burden-bearing stone/gravel and compatible dimension-stone offcuts. Distinguish natural-gravel separation, staged rock crushing/screening and optional dry/wet fine grinding/classification, wet beneficiation, concentration and actual drying. Include raw unprocessed gravel only with declared state; do not impose crushing on every gravel route or grinding/drying on every aggregate. Manufactured stone fines remain mechanically reduced stone, not natural sand. This product gate excludes pavement construction and binder mixing. Use actual lithology, provenance and market state, not a universal aggregate composition. Include attributable development/rehabilitation, handling/loading, water, dust and waste management. Industrial-residue macadam of identified slag, dross or similar industrial waste is also covered, with or without compatible stone fractions, when it is actually supplied as qualified unbound aggregate. Declare residue-generating industry/process, incoming waste versus co-product status, upstream allocation/cut-off, actual cooling/conditioning, metal recovery, stock residence, grading, volume stability and applicable environmental-quality evidence. Capture conditioning runoff and actual pollutant species. Do not transfer steel-slag aging/composition to other residues, assume all residues are usable, or infer avoided disposal/metals-production credit. Tarred macadam/binder mixtures and raw metallurgical slag supplied for a different purpose remain separate products."
      source_ids:
        - epa-crushed-stone-2004
        - epa-sand-gravel-1995
        - ifc-construction-2007
        - wco-hs25-2022
        - fhwa-steel-slag-97148
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
