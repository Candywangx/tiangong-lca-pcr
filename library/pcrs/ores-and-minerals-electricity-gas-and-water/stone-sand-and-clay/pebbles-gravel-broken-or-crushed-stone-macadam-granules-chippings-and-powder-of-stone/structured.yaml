allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide gravel separation, each crushing/grinding route and grade-specific operations where practical. Retain unallocated inventory for jointly produced sieve grades and natural sand/gravel. Use demonstrated physical causality, with economic alternatives and sensitivity only when justified; the same as-received mass share can conceal moisture differences and needs disclosure. Offcut feed requires its supplier allocation/cut-off convention, not automatic zero burden. Attribute development and closure once over disclosed measured lifetime accepted output. Actual fines sold as stone powder have a declared product gate; disposal or internal return does not create an avoided-product credit. Industrial residue starts at a declared generating-process allocation/cut-off boundary with its actual transport, conditioning and quality-control burdens. Retain unallocated aggregate/metal recovery inventory and justify allocation; incoming waste does not remove foreground processing, and recovered metal does not automatically earn virgin-metal credit."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
