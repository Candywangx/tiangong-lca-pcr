  calculation_rules:
    - id: normalization
      applies_to: "all cards"
      rule: "Exchange = attributable period quantity / D. Reconcile inventories and cancel internal transfers before aggregation."
      inputs:
        - cp_output
        - "row-specific cp records"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "production"
      rule: "D is independently measured positive accepted net as-received sand mass in kg at the gate, excluding packaging and rejects. Record moisture fraction w on an explicitly stated wet basis, with 0 <= w < 1; dry solids = D*(1-w), not a second denominator. Convert dry-record quantity to as-received only using matched measured moisture; volumetric sales require measured loose/compacted bulk density and moisture, not a universal sand density. Reconcile raw mineral dry solids, accepted grades, separately sold gravel, fines/slimes, stocks and releases; separately reconcile new water, inherent moisture, internal recycled water, evaporation and discharge."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
      source_ids: []
