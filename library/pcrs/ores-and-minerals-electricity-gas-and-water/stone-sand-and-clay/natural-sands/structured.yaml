published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply 1 kg of qualified natural sand at declared moisture and grading; no equal-strength or end-use performance equivalence across grades"
  excluded_use: "Manufactured sand from nonsand rock; recycled concrete aggregate; gravel as reference product; coated/resin-bonded foundry sand; synthetic silica; sand-containing mortar/concrete/glass and extraction services"
  required_metadata: "site/year; terrestrial/river/lake/marine origin and permitted extraction reach; actual mineralogy and quartz/carbonate fractions; natural-grain provenance; extraction/processing route; sieve distribution and fines; purity and impurities; salinity/chloride; market grade; moisture and dry-solids basis; net loading gate; water source/return/basin; sediment and waste fate; allocation and lifetime-output basis"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
data_sources:
  - id: "epa-sand-gravel-1995"
    type: "official_guidance"
    reference: "US EPA, AP-42 section 11.19.1 Sand and Gravel Processing, November 1995, original PDF pp.1–3, process description and construction-sand diagram. https://www.epa.gov/sites/default/files/2020-10/documents/c11s19-1.pdf"
    used_for: "Natural construction and industrial sand extraction, washing, classification, dewatering and optional purification/drying; qualitative routes only, no historical size, moisture, solids or emission values adopted."
  - id: "ifc-construction-2007"
    type: "official_guidance"
    reference: "IFC, Environmental Health and Safety Guidelines for Construction Materials Extraction, 30 April 2007, sections 1.1 and Annex A. https://www.ifc.org/content/dam/ifc/doc/2000/2007-construction-materials-extraction-ehs-guidelines-en.pdf"
    used_for: "Quarry route, dust, water, waste and land scope; no universal consumption range."
  - id: "cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; no process quantities."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5, consolidated 30 December 2021. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Multifunctionality hierarchy; not a claim of complete PEF conformity."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:5b6311c631e629ed08398f6dfe3834c6a13d191601fd68bf59dd1d85453e47c7"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5320"
      family: "system_boundary"
      span:
        start:
          offset: 5320
          line: 55
          column: 1
        end:
          offset: 8319
          line: 74
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual natural sediment/mineral deposit for extraction, or supplied raw natural sand carrying upstream burden for standalone processing |\n| starting_condition_role | Resource or supplied feed; declare which |\n| product_classification_scope | Natural raw, washed/classified or dried construction/industrial mineral sands; each dataset fixes mineralogy, origin and gate state |\n| recursive_input_rule | Purchased same-category material carries a distinct supplier dataset; internal recycling is a balance observation, not a new external input or credit. |\n| upstream_dataset_requirement | Link feed, electricity, fuels, chemicals, infrastructure and waste-management burdens; disclose any missing coverage. |\n| disclosure | site/year; terrestrial/river/lake/marine origin and permitted extraction reach; actual mineralogy and quartz/carbonate fractions; natural-grain provenance; extraction/processing route; sieve distribution and fines; purity and impurities; salinity/chloride; market grade; moisture and dry-solids basis; net loading gate; water source/return/basin; sediment and waste fate; allocation and lifetime-output basis |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_operations | site | Natural mineral sand supplied at one declared extraction, washing/classification or industrial-beneficiation loading gate. Cover naturally occurring siliceous, calcareous and other mineral sands from land deposits and permitted river/lake/marine dredging, including raw, washed, classified or actually dried grades. Distinguish extraction-only, integrated mining/processing and standalone processing of supplied burden-bearing sand. Liberation of naturally cemented sand is included only with documented natural-grain origin; deliberate manufacture of sand from nonsand rock belongs to the crushed-stone category. Declare all actual screening, scrubbing, desliming, separation, dewatering, purification and drying operations, rather than requiring all routes. Include site development/rehabilitation, loading, water, dust and waste management. Downstream concrete, glass, foundry use and service performance are separate datasets. | `epa-sand-gravel-1995`, `ifc-construction-2007` |\n| boundary_partition | all exchanges | Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases. |  |\n| boundary_completeness | inventory | Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished. |  |\n\n"
