system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Natural mineral sand supplied at one declared extraction, washing/classification or industrial-beneficiation loading gate. Cover naturally occurring siliceous, calcareous and other mineral sands from land deposits and permitted river/lake/marine dredging, including raw, washed, classified or actually dried grades. Distinguish extraction-only, integrated mining/processing and standalone processing of supplied burden-bearing sand. Liberation of naturally cemented sand is included only with documented natural-grain origin; deliberate manufacture of sand from nonsand rock belongs to the crushed-stone category. Declare all actual screening, scrubbing, desliming, separation, dewatering, purification and drying operations, rather than requiring all routes. Include site development/rehabilitation, loading, water, dust and waste management. Downstream concrete, glass, foundry use and service performance are separate datasets."
      source_ids:
        - epa-sand-gravel-1995
        - ifc-construction-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
