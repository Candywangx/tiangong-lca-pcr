  calculation_rules:
    - id: normalization
      applies_to: "all cards"
      rule: "Exchange = attributable period quantity / D. Reconcile inventories and cancel internal transfers before aggregation."
      inputs:
        - cp_output
        - "row-specific cp records"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "production"
      rule: "D is positive accepted net as-received stone mass in kg at the declared gate, excluding packaging, reject pieces and returned product. Independently weigh net loads or validate piece/volume records against measured mass/density and actual shape; never assume a universal density or per-piece mass. Reconcile extracted/supplied stone, saleable stone, scrap, saw kerf/slurry solids, stock changes and dust. Measure moisture and solid fraction separately; circulated cutting water is not repeated new intake."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: representativeness
      applies_to: "dataset"
      requirement: "Use matching production and exchange periods, actual technology, geography and supplier state. Record startup, shutdown, seasonal variation and substitutions."
      evidence: "collection records"
    - id: identity_and_ranges
      applies_to: "all cards"
      requirement: "Unresolved identities and missing independent range evidence remain explicit. Do not replace measurement by a guessed industry range or by missing-as-zero."
      evidence: "manifest review metadata"
validation_rules:
  - rule_id: validate_reference
    applies_to: "final_product"
    rule: "Verify 1 kg, positive D, product state, property/unit and every required qualifier. Each dataset fixes one product and route."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "site"
    rule: "D is positive accepted net as-received stone mass in kg at the declared gate, excluding packaging, reject pieces and returned product. Independently weigh net loads or validate piece/volume records against measured mass/density and actual shape; never assume a universal density or per-piece mass. Reconcile extracted/supplied stone, saleable stone, scrap, saw kerf/slurry solids, stock changes and dust. Measure moisture and solid fraction separately; circulated cutting water is not repeated new intake."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "handoff"
    rule: "Verify each applicable exchange, its provider or environmental compartment and final waste fate; identify skipped checks, unresolved identities, missing measurements and upstream gaps. Errors or unassessed mandatory coverage cannot be labelled complete."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply 1 kg of qualified slate; no equivalence claim per installed area or service lifetime"
  excluded_use: "polished/coated finished tiles; installed roofing assemblies; engineered/reconstituted stone; aggregate outputs as the reference product"
  required_metadata: "site/year; geology and extraction method; integrated/standalone start; slaty-cleavage orientation; layer defects and inclusions; splitting thickness and rough dimensions; raw or semi-finished state; moisture; rejection reason; loading gate; net mass and stock change; cut/split losses; water source/return; waste fate; allocation; development/closure lifetime-output basis; representative UUID only for split/cut semi-finished slate, not raw quarry slabs or finished roof products"
  required_quality_disclosure: "Identity and measurement gaps; boundary coverage; uncertainty; allocation; temporal and geographical representativeness"
  update_trigger: "Changed product, route, yield, supply, waste fate, site or representative period"
data_sources:
  - id: "ifc-construction-2007"
    type: "official_guidance"
    reference: "IFC, Environmental Health and Safety Guidelines for Construction Materials Extraction, 30 April 2007, sections 1.1 and Annex A. https://www.ifc.org/content/dam/ifc/doc/2000/2007-construction-materials-extraction-ehs-guidelines-en.pdf"
    used_for: "Quarry route, dust, water, waste and land scope; no universal consumption range."
  - id: "nsc-slate-2009"
    type: "literature"
    reference: "Natural Stone Council / University of Tennessee Center for Clean Products, Slate Quarrying and Processing: A Life-Cycle Inventory, August 2009, printed pp.2–3 (PDF pp.5–6), retained original mirrored by Vermont Slate. https://vermontslateco.com/wp-content/uploads/2016/03/Slate-Quarrying-and-Processing-A-life-Cycle-Inventoty.pdf"
    used_for: "Slaty cleavage, quarry extraction, splitting, scrap and processing handover; historical survey intensities not adopted."
  - id: "cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; no process quantities."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5, consolidated 30 December 2021. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Multifunctionality hierarchy; not a claim of complete PEF conformity."
