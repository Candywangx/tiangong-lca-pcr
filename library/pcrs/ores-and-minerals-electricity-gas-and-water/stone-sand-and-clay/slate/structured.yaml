          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual rock deposit for integrated quarrying, or purchased raw stone for standalone rough processing |\n| starting_condition_role | Resource or supplied feed; declare which |\n| product_classification_scope | natural slate blocks, quarry slabs and simply split/cut semi-finished pieces |\n| recursive_input_rule | Purchased same-category material carries a distinct supplier dataset; internal recycling is a balance observation, not a new external input or credit. |\n| upstream_dataset_requirement | Link feed, electricity, fuels, chemicals, infrastructure and waste-management burdens; disclose any missing coverage. |\n| disclosure | site/year; geology and extraction method; integrated/standalone start; slaty-cleavage orientation; layer defects and inclusions; splitting thickness and rough dimensions; raw or semi-finished state; moisture; rejection reason; loading gate; net mass and stock change; cut/split losses; water source/return; waste fate; allocation; development/closure lifetime-output basis; representative UUID only for split/cut semi-finished slate, not raw quarry slabs or finished roof products |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_operations | site | This PCR covers natural slate blocks, quarry slabs and simply split/cut semi-finished pieces at one declared quarry or rough-processing gate. Distinguish integrated extraction from standalone processing of supplied burden-bearing stone. Include actual site development, extraction, cutting/splitting, sorting, storage/loading, water/waste/dust controls and attributable rehabilitation through the gate. Record extraction, first cutting, cleavage splitting and sorting separately. Neither natural cleavage nor a manual splitting operation implies zero quarry fuel or zero upstream burden. Subsequent finishing, installation and building-service performance are separate datasets. | `ifc-construction-2007`, `nsc-slate-2009` |\n| boundary_partition | all exchanges | Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases. |  |\n| boundary_completeness | inventory | Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished. |  |\n\n"
