allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide mining, grade purification, slurry dispatch and thermal conversion where possible. Retain unallocated inventories for jointly separated grades and mineral by-products; justify physical causality or economic alternatives with consistent quality/moisture/period sensitivity. Purchased refractory mineral or synthesis feed carries its own upstream burden; no automatic burden-free residue assumption. Charge development/closure once over disclosed lifetime accepted output. Internal grit/slurry/dust recycling receives no duplicate new feed or automatic avoided-product credit."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
