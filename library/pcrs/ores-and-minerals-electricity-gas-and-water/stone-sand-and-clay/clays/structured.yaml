    - id: physical_balance
      applies_to: "production"
      rule: "D is independently weighed positive accepted net as-received loading mass in kg of one selected product state, excluding packaging, rejects and other saleable grades. Slurry D includes declared carrier water; record solids fraction separately. Wet-basis free moisture w has 0 <= w < 1; free-moisture-corrected solids = D*(1-w). Do not treat mineral structural water or calcination loss as free moisture. Dry/slurry conversions require matched measured solids/density and actual state. Reconcile mineral/oxide solids, impurities/rejects, additives, stock and thermal transformation separately from new water, circulation, evaporation and discharge. Actual dehydroxylation/phase conversion may change mass; no universal yield or loss-on-ignition factor and no automatic calcination CO2 from aluminosilicate alone."
      inputs:
        - "Matched mass"
        - volume
        - "composition and stock measurements"
      output: "Balance residual and uncertainty"
