  classification_refs: "CPC 3.0:15400"
  covered_products: "Clay raw materials and HS 2507/2508 refractory raw minerals, uncalcined or actually calcined, at fixed mineral identity, grade, moisture/slurry solids and gate"
  excluded_products: "Expanded clays; shaped/fired bricks, tiles, ceramic or refractory articles; installed refractory systems; spent oily bleaching earth; bauxite/alumina as reference product; downstream formulated drilling mud/paint/cement and extraction services"
  representative_product: "Kaolin at the declared raw-material gate"
  production_route: "Deposit development and closure; Clay and refractory-mineral extraction; Mechanical preparation and grading; Wet purification and activation; Drying and refractory-raw-material thermal conversion; Water, residue and emissions management; Accepted mineral-product loading"
  market_state: "One actual clay or refractory raw-mineral grade at loading, stating raw/beneficiated/slurry/dried/calcined status and measured moisture/solids"
functional_unit:
  what: "Supply 1 kg of specified clay/refractory raw material in its declared market state; no performance equivalence between swelling clay, coating kaolin and refractory minerals"
  how_much: "1 kg"
  how_well: "site/year; clay species or refractory mineral/phase identity and origin; actual extraction and beneficiation/activation/thermal route; uncalcined/calcined/slurry state; particle distribution, mineral/oxide/impurity assays; moisture and solids; relevant brightness/plasticity/swelling/adsorption/refractory grade evidence; carbonate and organic carbon, structural water and loss-on-ignition basis; actual loading gate; water basin/return; residue fate; allocation and lifetime output"
  how_long_or_cycle: "One gate supply within a declared production period"
  reference_flow_link: "final_product"
system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Supply of kaolin/other kaolinic clays, bentonite, ball/fire/common clays and fuller’s earth, plus the refractory raw minerals andalusite, kyanite, sillimanite, mullite and chamotte/dinas earths within the CPC category defined through HS 2507/2508. Cover one declared raw, dry-ground, wet-beneficiated, slurry, dried or actually calcined raw-material gate, including actual refractory-raw-material thermal conversion where applicable. Expanded clay and downstream shaped/fired ceramic or refractory articles are excluded. Distinguish integrated deposit extraction from standalone processing of supplied burden-bearing mineral. Clay varieties do not share a universal composition, washing yield, swelling/plasticity, water demand, chemical treatment or calcination route. Record each actual excavation/hydraulic/underground route, crushing/milling, blunging/classification, magnetic/flotation/chemical purification, dewatering, drying, activation, thermal conversion, grading and loading without requiring every operation. Refractory mineral separation and supplied alumina/silica routes use actual feed and phase assays; HS identity does not establish a synthesis recipe. Include attributable development/closure and water/dust/waste controls through the gate."
      source_ids:
        - epa-clay-1995
        - wco-hs25-2022
        - ifc-mining-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
