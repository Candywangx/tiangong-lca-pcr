allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint production"
    rule: "Prefer process subdivision or defensible system expansion; otherwise use demonstrated physical causality. Use economic allocation only with consistent period, price, currency and sensitivity when physical causality is unavailable. Retain the unallocated inventory."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_product
    applies_to: "reference and co-products"
    rule: "Subdivide mineral extraction, grade preparation and optional delivery where possible. Retain unallocated joint-grade inventory and justify physical causality or economic alternative with matched quality/moisture/period. Industrial by-product gypsum carries a documented generating-process allocation/cut-off and actual conditioning/transport; neither disposal avoidance nor natural-gypsum substitution automatically creates credit. Attribute development/closure once over measured lifetime accepted output. Reject sold for another use is not automatically a burden-free co-product; internal recycle receives no duplicate new-supply burden."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and recycling"
    rule: "Classify each output by physical state and actual fate. A sale does not automatically make a residue a co-product; internal recycling receives no avoided-product credit. Apply treatment burdens once."
    source_ids: []
