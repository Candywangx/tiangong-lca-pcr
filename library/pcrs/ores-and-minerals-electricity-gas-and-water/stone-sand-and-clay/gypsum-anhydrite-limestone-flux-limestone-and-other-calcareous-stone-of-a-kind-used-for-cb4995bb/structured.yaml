system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "site"
      rule: "Supply of uncalcined gypsum, anhydrite, limestone flux and limestone/other calcareous stone of a kind used for lime or cement manufacture at one declared raw-mineral gate. Cover quarry or actual underground extraction and standalone preparation of supplied burden-bearing minerals, including raw or actually crushed, washed, dried or ground grades that retain the declared raw-mineral identity. Do not narrow this category to gypsum. Gypsum dihydrate and natural anhydrite are distinct mineral states; drying must not silently become plaster calcination. Limestone flux and calcareous chemical-manufacture feed use actual mineral/oxide/impurity and reactive-quality evidence rather than a universal pure-CaCO3 composition. Where an industrial by-product gypsum is actually supplied under this uncalcined category, confirm its identity/grade and generating-process allocation/cut-off, record actual receiving, dewatering/washing/drying and supplier burdens separately; natural-gypsum evidence cannot establish its purity or zero upstream burden. Include attributable development/closure, handling, controls and delivery only through the explicitly chosen gate. Exclude calcined plaster, lime, clinker/cement manufacture and finished gypsum articles."
      source_ids:
        - epa-gypsum-1993
        - epa-crushed-stone-2004
        - wco-hs25-2022
        - ifc-mining-2007
    - rule_id: boundary_partition
      applies_to: "all exchanges"
      rule: "Include actual conditioning, storage, handling and pollution controls through the declared gate. Account for attributable construction and closure with a disclosed lifetime-output basis or justified exclusion and sensitivity. Separate purchased fuel supply from foreground combustion and purchased treatment from site releases."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "inventory"
      rule: "Cards define individual likely exchanges and route conditions, not an exhaustive site audit. Add each actual absent chemical, waste, resource, land transformation and pollutant as its own row. Absence, measured zero and unknown must be distinguished."
      source_ids: []
