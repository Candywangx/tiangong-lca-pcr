    reference: "US EPA, AP-42 section 11.19.2 Crushed Stone Processing and Pulverized Mineral Processing, August 2004, original PDF pp.1–5. https://www.epa.gov/sites/default/files/2020-10/documents/c11s1902.pdf"
    used_for: "Actual limestone/calcareous-rock extraction, crushing/screening, grinding and dust controls; not lime/cement calcination or an assumed pure composition."
