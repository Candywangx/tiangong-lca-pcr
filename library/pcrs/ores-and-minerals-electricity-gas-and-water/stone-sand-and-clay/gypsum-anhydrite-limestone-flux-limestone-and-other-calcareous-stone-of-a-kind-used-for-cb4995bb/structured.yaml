measurement_rules:
  - id: reference_basis
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is the positive accepted net gate-output total in kg. Exclude packaging and cancelled internal transfers. cp_output records D; every card uses per 1 kg reference flow."
  - id: conversion
    applies_to: "utility and material rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Retain raw readings. Electricity: 1 kWh = 3.6 MJ. Mass/volume conversion requires measured density, temperature and applicable pressure; retain water content and active chemical fraction."
  - id: category_balance
    applies_to: "production"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is independently weighed positive accepted net as-received raw-mineral mass in kg at the declared gate, excluding packaging, returns and rejects. Measure wet-basis free moisture w with0 <= w <1; free-moisture-corrected mineral mass = D*(1-w), retaining D as reference denominator. Gypsum crystal water is part of its mineral phase, not free moisture; natural anhydrite is not assumed to have gypsum water content. Reconcile raw accepted mineral solids/phase, impurities, reject/slurry solids, stocks and dust separately from water intake/circulation/evaporation/discharge. Volume records require measured bulk density and moisture. Any observed dehydration or decarbonation triggers product-state and gate review, not automatic equivalence to raw gypsum or limestone."
