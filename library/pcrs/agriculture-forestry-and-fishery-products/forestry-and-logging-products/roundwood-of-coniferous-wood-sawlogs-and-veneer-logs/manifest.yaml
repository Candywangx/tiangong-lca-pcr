  unresolved_factual_evidence:
    - Resolve the applicable product-LCA method, accounting period, land/pool evidence or justified exclusions, and unique forest-carbon/upstream coverage ownership before completeness.
  unresolved_quantitative_evidence:
    status: foreground_evidence_required
    reason: Reasoned-estimate ranges are provisional non-enforcing prompts, not empirical defaults. Dataset completion requires actual quantities, applicable factors and uncertainty; conditional quantities are not assumed zero.
  unresolved_flow_identities:
    - row_id: conifer_seedlings
      reason: Returned plant seedling has an aquaculture-route qualifier; fruit/oil-palm/berry stock does not establish conifer nursery stock. Actual species, provenance, stock form and number-of-items support remain required.
    - row_id: conifer_seeds
      reason: Refined search returned tung, fruit and groundnut seed or wild edible nuts, not verified conifer forest-tree sowing seed. Fruit-seed candidate explicitly excludes forest-tree seed. Actual species/treatment required.
    - row_id: stand_watering_water
      reason: Several irrigation-water identities returned, including a withdrawal label and plant-gate water. Actual supplied source, grade/treatment and pumping boundary remain open; distinguish product supply from direct resource withdrawal and retain measured conversion if Mass-based.
    - row_id: stand_protection_product
      reason: No actual commercial formulation, active substance or concentration is established. Initial lookup completed but its candidate payload was lost in truncated capture; no unseen candidate is considered reviewed. Resolve the reported product without inventing a pesticide use.
    - row_id: felled_stems
      reason: Confirmed candidate is already delimbed at forest roadside. This card hands freshly felled stems over at forest site before extraction/preparation, so the gate and delimbing state are incompatible; Mass alone is not the rejection reason.
    - row_id: felled_stems_input
      reason: Confirmed candidate is already delimbed at forest roadside. This card hands freshly felled stems over at forest site before extraction/preparation, so the gate and delimbing state are incompatible; Mass alone is not the rejection reason.
    - row_id: prepared_shortwood_input
      reason: No exact ungraded raw-log handoff was verified at its actual forest-site/roadside gate. Other-use sorted roundwood excludes saw/pulp uses; dry wood and biomass are not the unsorted lot. Variable preparation gates require route-specific identity and measured mass/volume support.
    - row_id: landing_stems
      reason: Confirmed roadside-stem flow requires already delimbed stems. This tree-length route receives stems before landing delimbing/bucking and does not establish that actual delimbing state; do not change the route to fit the candidate.
    - row_id: landing_shortwood
      reason: No exact ungraded raw-log handoff was verified at its actual forest-site/roadside gate. Other-use sorted roundwood excludes saw/pulp uses; dry wood and biomass are not the unsorted lot. Variable preparation gates require route-specific identity and measured mass/volume support.
    - row_id: raw_stems_input
      reason: No exact ungraded raw-log handoff was verified at its actual forest-site/roadside gate. Other-use sorted roundwood excludes saw/pulp uses; dry wood and biomass are not the unsorted lot. Variable preparation gates require route-specific identity and measured mass/volume support.
    - row_id: prepared_logs
      reason: No exact ungraded raw-log handoff was verified at its actual forest-site/roadside gate. Other-use sorted roundwood excludes saw/pulp uses; dry wood and biomass are not the unsorted lot. Variable preparation gates require route-specific identity and measured mass/volume support.
    - row_id: removed_bark
      reason: Returned waste bark has a plant-gate debarking-residue identity, not a verified physically removed forest-roadside stream. Retain composition, origin and receiver evidence without changing waste role or gate.
    - row_id: removed_woody_trim
      reason: Refined candidates are plant-gate offcut, generic municipal wood waste or sawdust, not verified untreated forest-roadside logs/coarse pieces/trim. Treatment receiver and composition remain required; no saleable product is retyped as waste.
    - row_id: prepared_logs_input
      reason: No exact ungraded raw-log handoff was verified at its actual forest-site/roadside gate. Other-use sorted roundwood excludes saw/pulp uses; dry wood and biomass are not the unsorted lot. Variable preparation gates require route-specific identity and measured mass/volume support.
    - row_id: saw_veneer_log
      reason: No verified conifer sawlog/veneer raw-log flow at roadside survived intended-use checks. Other-use conifer roundwood explicitly excludes saw/veneer logs; veneer sheets, dry wood and non-conifer logs are not substitutes.
    - row_id: coproduct_pulp_panel
      reason: No verified conifer pulp/panel raw roundwood at roadside survived checks. Returned bamboo laminated lumber, modified poplar and other-use conifer roundwood have different material state/species/intended use; other-use flow excludes pulpwood.
    - row_id: coproduct_fuelwood
      reason: Returned roadside fuelwood is expressly non-coniferous; split firewood has a plant-gate processing scope. No conifer roadside fuel-log identity was verified.
    - row_id: rejected_wood
      reason: Refined candidates are plant-gate offcut, generic municipal wood waste or sawdust, not verified untreated forest-roadside logs/coarse pieces/trim. Treatment receiver and composition remain required; no saleable product is retyped as waste.
