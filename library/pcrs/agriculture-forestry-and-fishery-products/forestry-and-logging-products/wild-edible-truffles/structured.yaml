      raw_fields: "event_id; node; collector; site; species; wild-origin evidence; trip including failed; lot; grade; gross; tare; soil; accepted_net_mass; opening/closing stocks; returns; recipient/use; actual energy/material/service/provider/native_unit; inclusive supplier scope; animal assistance/feed/training/care/travel; asset/service period/replacement/termination; named emission substance/particle/compartment; measured quantity or activity and factor source"
      collection_method: "Weigh accepted net fresh whole fruiting bodies on calibrated scales after separate soil/tare determination. Pair dispatch and receipt records for every node; record unsuccessful searches, residence times and actual cooling, service invoices/meters/feed records, unique asset events and named emissions via measurement or documented activity-factor method. Reconcile species/source proof with acceptance. collection_services_specific_input: One collection-service umbrella records actual access/search/extraction, attributable approach and collected-load transfer, tools/vehicles and reusable collection assets. Actual trained-animal assistance includes attributable training, care and travel only when used, with observed service periods, replacement/termination and feed/provider-inclusion linkage. Record service-native units; h is only a service-time screen, not a tonne-kilometre conversion. Measure the attributable amount, retaining actual identity and destination; divide by the accepted net reference mass using cp_collection. Unknown is a data gap, not zero. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default. collection_emissions_specific_emission: Conditional direct-emission umbrella: require actual substance or particle size, receiving compartment, activity and measurement or factor method. Report combustion, service leaks or identified product moisture/respiration only when attributable and established; an unexplained mass deficit is not a pollutant or automatically water vapour. Do not duplicate emissions embedded in inclusive supplier services. Measure the attributable amount, retaining actual identity and destination; divide by the accepted net reference mass using cp_collection. Unknown is a data gap, not zero. This is a mandatory emission-identification requirement, not an aggregate elementary exchange. Identify every applicable substance and actual receiving compartment separately, with compatible units, measured activity or justified calculation method, parameter applicability and uncertainty. Preserve the original operation, period, allocation and final-reference normalization. Reconcile direct and indirect pathways and upstream coverage once; do not substitute total nitrogen, total combustion emissions or a generic pollutant for a named compound. Separately document actual environmental returns, with their material and destination, if relevant. Before dataset completeness create each required specific exchange, confirm a compatible UUID or explicitly retain its unresolved identity. Missing records do not establish zero or inapplicability. fao-truffle-harvesting collection_other_goods_specific_output: Only actual intended nonreference truffle grades or species sharing the declared trip leave with their state, use, recipient and measured amount. Record the joint-search burden decision; unrelated shared-trip products have their own non-overlapping system and service share. Do not invent other goods, classify disposed incidental matter as saleable output, or count collected_truffles again as an independent sale. Measure the attributable amount, retaining actual identity and destination; divide by the accepted net reference mass using cp_collection. Unknown is a data gap, not zero. This is a mandatory output-identification requirement, not an aggregate exchange. Preserve every actual co-product, reject, packaging waste and treatment stream in this operation. Before dataset completeness create separate cards for physically distinct streams, with actual material/state, quantity, destination and Product/Waste role. A genuinely mixed waste stream may remain one physically defined mixture with measured composition; do not invent separation or count its components again. Keep unlike units separate, retain the original allocation and reference normalization, and reconcile the output balance. Identify actual functions before co-product allocation; waste does not acquire a co-product share merely by having mass. Confirm a compatible UUID or explicitly retain its unresolved identity. Missing records never establish zero or exclusion. fao-truffle-harvesting collection_waste_specific_output: Actual rejected/damaged fruiting bodies, incidental matter sent to treatment and spent collection/animal-service materials leave to named external recipients. State identity, wet mass and event. Soil actually returned to nature belongs to collection_soil_return, not this waste exit; intended other truffle goods and retained stock are separate. Measure the attributable amount, retaining actual identity and destination; divide by the accepted net reference mass using cp_collection. Unknown is a data gap, not zero. This is a mandatory output-identification requirement, not an aggregate exchange. Preserve every actual co-product, reject, packaging waste and treatment stream in this operation. Before dataset completeness create separate cards for physically distinct streams, with actual material/state, quantity, destination and Product/Waste role. A genuinely mixed waste stream may remain one physically defined mixture with measured composition; do not invent separation or count its components again. Keep unlike units 