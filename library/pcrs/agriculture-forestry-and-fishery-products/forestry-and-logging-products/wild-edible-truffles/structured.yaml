validation_rules:
  - rule_id: reference_check
    applies_to: "fresh_truffles_handover"
    rule: "Reference name/link/state/gate and net calibrated mass must agree; the final output is 1 kg per 1 kg reference flow and no internal feed is fixed to this quantity."
    source_ids: []
  - rule_id: route_check
    applies_to: "all nodes"
    rule: "Verify actual node activations, bypass records, all incoming/outgoing handoffs, species/site origin and batches/periods. All rejected states require their producing-node route, recipient or retained stock; returns are linked to conditioning and cannot count twice as acceptance."
    source_ids: []
  - rule_id: closure_check
    applies_to: "all inventories"
    rule: "Reconcile wet truffle/soil/tare balances and stocks, actual output sets and attributed source-site/period/asset shares. Check inclusive supplier boundaries, failed trips, animal service duties and unique event ownership. Unknown mass deficit/absence is a disclosed gap, not a guessed emission, yield or zero."
    source_ids: []
  - rule_id: identity_range_check
    applies_to: "all cards"
    rule: "Every concrete exchange requires verified exact identity and support units; each Range has matching unit/basis/evidence. Provisional screens are non-enforcing, zero requires actual absence proof, and unknown state or unresolved support prevents final concrete use."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared fresh whole wild truffle primary-route process/lifecyclemodel projection"
  excluded_use: "Cultivated/inoculated orchard goods, processed states, unknown species/origin/gate, safety certification or automatic natural carbon credits"
  required_metadata: "PCR identity/version; species; site-season; wild proof; grade; net/tare/soil/moisture; primary gate; route activation; suppliers; batches and failed trips; periods; output/asset attribution"
  required_quality_disclosure: "Observed quantities and gaps; exact identities/support; scope of inclusive services; site/period completeness; ranges remain provisional and non-default"
  update_trigger: "Changed source management, species/state/gate, service technology, output markets, measured evidence or identity support"
data_sources:
  - id: "unsd-wild-truffles"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/03233"
    used_for: "Untended product classification context; not quantity defaults"
  - id: "fao-truffle-harvesting"
    type: "official_guidance"
    reference: "https://www.fao.org/4/y5489e/y5489e07.htm"
    used_for: "Targeted underground extraction, conditional trained assistance, source distinction; not current legal advice or universal practice"
  - id: "fao-fresh-fungi-handling"
    type: "official_guidance"
    reference: "https://www.fao.org/4/y5489e/y5489e09.htm"
    used_for: "Fresh handling and state distinction; no universal temperature/yield/shelf-life transferred"
  - id: "fao-agricultural-energy"
    type: "official_guidance"
    reference: "FAO Energy demand and consumption in African agriculture, Annex C case-study results, https://www.fao.org/4/v9766e/v9766e08.htm"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
  - id: "produce-cardboard-containers"
    type: "official_guidance"
    reference: "FAO, Prevention of post-harvest food losses, section 6.5.3. https://www.fao.org/4/t0073e/T0073E03.HTM"
    used_for: "Conditional cardboard container identity; actual food-contact suitability, grade, fibre composition, use and reuse require records."
  - id: "truffle-cleaning-wrapping"
    type: "handbook"
    reference: "TruffleHunter, Truffle Care Guide and FAQ. https://www.trufflehunter.co.uk/pages/truffle-care-guide ; https://www.trufflehunter.co.uk/pages/faq"
    used_for: "Supplier example of water cleaning and paper wrapping only when performed before this PCR gate; no storage temperature, duration or downstream consumer activity is prescribed."
