allocation_rules:
  - rule_id: output_attribution
    applies_to: "all intended outputs"
    rule: "Enumerate reference and every independently intended grade/species/downstream-use output with actual handover. First subdivide separately measured trip/node services; next use a demonstrated causal physical driver (e.g. search time, load-distance, cooling occupancy) for joint burdens; only when no physical driver is defensible use disclosed revenue shares from the same site-season. Record quantities, prices/period and uncertainty. No automatic substitution credit."
    source_ids: []
  - rule_id: trip_period_asset
    applies_to: "shared services"
    rule: "Attribute unsuccessful trips to the declared site-season effort serving actual intended products; do not divide by zero-output trips or drop them. Link asset/feed/training/care burdens to actual consuming nodes and service periods, including replacements and termination, and retain unique event keys. Sum each burden once over outputs and periods."
    source_ids: []
  - rule_id: reject_loops
    applies_to: "all rejects and returns"
    rule: "Off-spec/spoiled goods exit as actual other intended goods or actual waste; record producing node and recipient. Recleaning returns link handover/holding to conditioning with retained burdens and incremental inputs only. Do not count each passage as newly removed or accepted output. Waste disposal receives its actual attributable burden, never an automatic zero or recovered credit."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_collection
      process_id: "collection"
      flow_role: "Every actual card and net reference mass"
