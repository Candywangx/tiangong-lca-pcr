system_boundary:
  rules:
    - rule_id: source_ownership
      applies_to: "collection"
      rule: "Targeted search/extraction owns harvesting and natural removal together; do not invent managed biological production or add removal again at cleaning. Soil disturbance is documented separately from actually exported foreign matter."
      source_ids:
        - fao-truffle-harvesting
    - rule_id: conditional_route
      applies_to: "all nodes"
      rule: "Use actual lot events to activate cleaning/grading or fresh holding/cooling. Record the input/output state and handover when bypassed. Unknown intervention is not a bypass. Pack only actual materials and reuse; downstream distribution and consumer processing remain outside the primary gate."
      source_ids:
        - fao-fresh-fungi-handling
    - rule_id: owned_ledgers
      applies_to: "shared services"
      rule: "Declare batch/trip/season mode, each run/changeover, failed trips, source-site contributions, shared vehicles/tools/animal assistance/cold-room consumers and service periods. Record replacement and termination events. Inclusive purchased services own embedded feed, energy, care and emissions; direct ledgers cover only nonincluded responsibilities."
      source_ids:
        - fao-truffle-harvesting
boundary_abstraction:
  declared_starting_condition: "Untended fruiting bodies in their natural source for self-gathering, or documented already gathered purchased fresh feed"
  starting_condition_role: "Natural source to collector interface, or upstream technosphere handover; declared per source portion"
  product_classification_scope: "Fresh-primary truffle subset of CPC 03233; not all states or cultivation"
  recursive_input_rule: "Purchased already gathered same-category feed is a product input linked to non-overlapping upstream dataset; never regenerate its search/removal burden or truncate to zero"
  upstream_dataset_requirement: "Require matching wild origin, species/state/gate and documented prior removal/preparation/transport; report missing evidence rather than infer an orchard proxy"
  disclosure: "List all source sites/collectors, periods, actual node activations/bypasses, purchased fractions and inclusive suppliers; final acceptance always applies"
