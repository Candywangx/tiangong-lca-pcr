allocation_rules:
  - rule_id: a_output_hierarchy
    applies_to: "live cattle, milk, breeding stock, culled animals and exported manure"
    rule: "Partition directly measured product-specific records first. Enumerate each intended output and handover. If indivisible burdens remain, use an explicit PCR-specific physical causal relation; use economic allocation only when physical causality is not defensible, and disclose prices, period and sensitivity."
    source_ids:
      - fao-leap-large-ruminants-2016
      - fao-leap-nutrient-flows-2018
  - rule_id: a_residue_status
    applies_to: "manure, mortalities and biological losses"
    rule: "Treat exported manure as a co-product only with intentional recovery and a documented transfer; treat mortalities and unusable manure as waste or loss. Do not convert a residue to a product merely to obtain a credit."
    source_ids:
      - fao-leap-nutrient-flows-2018
  - rule_id: a_multi_period
    applies_to: "breeding stock, replacement animals, calves, growing and finishing phases"
    rule: "Index starting stock, births, purchases, sales, deaths, culls and ending stock by cohort-period. Attribute prior and current-period burdens once, reconcile stock change, and document replacement or termination treatment."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: a_shared_infrastructure
    applies_to: "shared housing, milking, feeding, pasture, water, energy and manure assets"
    rule: "Identify all consuming nodes and service periods; allocate measured service directly, then equipment hours, animal-days, live-mass-days or another documented causal driver. Fractions must sum to one and the shared burden must be counted once."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: a_route_separation
    applies_to: "coexisting grazing, mixed, dairy-linked, housed and feedlot variants"
    rule: "Keep route-specific feed, manure, infrastructure and emissions records separate. A portfolio average may be published only with production-weighted route shares and no duplicate animals or periods."
    source_ids:
      - fao-leap-large-ruminants-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_animal_events
      process_id: "herd_production"
      flow_role: "starting stock, births, transfers, deaths, culls and cattle sent to gate"
      record_type: "herd register, movement record, scale ticket, veterinary mortality record"
      raw_fields: "animal or cohort id; class; sex; purpose; breed; event; date; count; live mass; origin; destination; phase"
      collection_method: "electronic herd register and calibrated scale or documented representative weighing; Raw aggregation requirements: reconcile beginning stock + births + purchases = transfers + deaths + culls + ending stock by class and period. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head and kg"
      frequency: "each event"
      temporal_coverage: "complete cohort and reporting period"
      site_scope: "named farm, herd and cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "movement documents, scale calibration, signed herd register; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_and_grazing
      process_id: "herd_production"
      flow_role: "feed, forage and grazing intake"
      record_type: "purchase, ration, feed issue, pasture and residue records"
      raw_fields: "feed identity; source; as-fed mass; dry matter; nutrient or energy composition; leftovers; pasture area and period; cattle class"
      collection_method: "invoices, feed inventory, ration logs, pasture records and documented intake calculation; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output. feed_and_forage_input_specific_input: Operation herd_production: Record supplied feed separately from actual intake and losses, by identity, source, as-fed mass, dry matter, composition, cattle class and feeding period; grazing intake may be calculated from measured pasture and animal records. Denominator and scope requirements：per 1,000 kg farm-gate live cattle output and by cohort-period Raw quantity and calculation requirements: Use separate feed-supply, intake and loss ledgers under calc_feed_supply_and_intake. The quantity carrying feed-production burden includes in-boundary refusals, spoilage and uneaten feed; it is not reduced to animal intake. Retain source, species/cohort, phase and original mass/moisture basis. Calculate the final contribution with inventory_reference_normalization and stage_throughput_linkage exactly once. Original collection denominator kind: process_output. Original quantity method: Calculate the attributable final-package exchange under inventory_reference_normalization and stage_throughput_linkage using reconciled feed-supply records that retain in-boundary losses and their production burden. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg as-fed, kg dry matter, ha-day"
      frequency: "daily issue or period summary"
      temporal_coverage: "all feeding and grazing phases"
      site_scope: "feed store, pasture parcel, housing group and cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier specification, moisture result, inventory reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_water_records
      process_id: "herd_production_manure_management_farm_gate_transfer"
      flow_role: "drinking, cleaning, cooling and manure water"
      record_type: "meter, tank, pump runtime and allocation record"
      raw_fields: "source; purpose; opening and closing reads; volume; runtime; shared users; period"
      collection_method: "calibrated meter or documented pump/runtime calculation; Raw aggregation requirements: sum by purpose and allocate shared readings once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "m3 or kg"
      frequency: "daily, monthly or batch"
      temporal_coverage: "complete reporting period"
      site_scope: "source, process and consuming node"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration, bill and allocation worksheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_energy_and_infrastructure
      process_id: "herd_production_manure_management_farm_gate_transfer"
      flow_role: "energy and shared assets"
      record_type: "meter, invoice, fuel, equipment and asset register"
      raw_fields: "carrier; quantity; meter; equipment; service; users; operating hours; asset life; service period; allocation driver"
      collection_method: "submeter, invoice, tank record, runtime log and asset register; Raw aggregation requirements: direct meter assignment first; allocate residual shared amount once by documented causal driver. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again. Route-specific requirements: herd_energy_input_identification: Feeding, ventilation, pumping, cooling, shared milking, fencing and pasture machinery within the herd boundary; activate electricity only for electric equipment and diesel only for documented diesel machinery. Denominator and scope requirements：per 1,000 kg farm-gate live cattle output Raw quantity and calculation requirements: meter, invoice or equipment log by carrier, consuming node and service period Original collection denominator kind: process_output. (route-energy-fao) manure_energy_input_identification: Scraping, pumping, separation, aeration, storage, treatment and land application under farm control. Electricity applies only to actual electric drives; identify the actual power source of mobile spreading separately. Denominator and scope requirements：per kg manure handled and per 1,000 kg farm-gate live output Raw quantity and calculation requirements: carrier-specific meter, invoice or equipment log assigned to manure pathways Original collection denominator kind: process_output. (route-energy-fao) gate_energy_input_identification: Short holding, weighing and loading before farm-gate handover. Identify the actual handling equipment first; neither powered handling nor a fuel is assumed. Exclude post-transfer transport. Denominator and scope requirements：per 1,000 kg farm-gate live cattle output Raw quantity and calculation requirements: meter, invoice or equipment runtime assigned to gate operations Original collection denominator kind: reference_flow. (route-energy-fao) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route."
      unit: "kWh, MJ, L, kg, hours"
      frequency: "monthly and each major operation"
      temporal_coverage: "full reporting and asset service period"
      site_scope: "process, herd group and shared farm system"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices, meter calibration, equipment log, allocation worksheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_health_records
      process_id: "herd_production"
      flow_role: "animal-health products and interventions"
      record_type: "medicine register, purchase and treatment record"
      raw_fields: "product; active substance; dose; unit; animal class; count; date; reason; withdrawal status"
      collection_method: "farm treatment register and supplier record; Raw aggregation requirements: sum product quantity by identity and class; retain services separately. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again. animal_health_input_specific_input: Operation herd_production: Record medicines, vaccines, disinfectants and other health products actually used; veterinary services are recorded separately from physical products and are not the cattle reference product. Denominator and scope requirements：per treated cohort and per 1,000 kg farm-gate live output Raw quantity and calculation requirements: treatment and purchase records by product, dose, animal class and event Original collection denominator kind: process_output. Original quantity method: Calculate the attributable final-package exchange under inventory_reference_normalization and stage_throughput_linkage using the matched raw records. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "native product unit and event"
      frequency: "each treatment"
      temporal_coverage: "complete reporting period"
      site_scope: "herd, cohort and treatment group"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice, veterinarian or treatment record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_transport_records
      process_id: "herd_production"
      flow_role: "controlled inbound cattle and feed movements"
      record_type: "shipment and route record"
      raw_fields: "cargo; mass; origin; destination; mode; vehicle; loaded distance; empty return convention; control boundary"
      collection_method: "weigh ticket, delivery record and route log; Raw aggregation requirements: sum tonnes multiplied by loaded kilometres by cargo and mode. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "t, km, tkm"
      frequency: "each trip"
      temporal_coverage: "complete reporting period"
      site_scope: "controlled inbound route"
      aggregation_rule: "per reference flow"
      quality_evidence: "manifest, scale ticket and route evidence; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure_and_emissions
      process_id: "herd_production_manure_management"
      flow_role: "excretion, manure pathways, methane and nitrogen losses; required specific-emission identification and calculation"
      record_type: "animal, feed, manure, storage, treatment, recovery and application record"
      raw_fields: "animal category; population; days; intake; digestibility; volatile solids; nitrogen; system; storage days; climate; recovery; export; application; factor tier; substance name; receiving compartment; reported unit and elemental/compound basis; method and factor source; actual activity; period; quantity uncertainty; related existing exchanges"
      collection_method: "measurements plus IPCC-consistent calculation from collected activity data; Raw aggregation requirements: calculate by category-pathway-period; reconcile manure and nitrogen transfers; aggregate after retaining components. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again. unusable_manure_waste_specific_output: Record manure, sludge, bedding residue or treatment residue not intentionally transferred as a product, including actual fate and treatment destination. Denominator and scope requirements：per manure pathway and per 1,000 kg farm-gate live output Raw quantity and calculation requirements: measured or reconciled waste mass by pathway and destination Original collection denominator kind: process_output. Calculate the attributable final-package exchange under inventory_reference_normalization and stage_throughput_linkage using the matched raw records. This is a mandatory specific-output collection requirement, not a selected exchange. Preserve every actual waste, residue, reject and co-product from this operation. Create separate cards for physically distinct streams with actual material, composition/state, quantity, receiving route and Product/Waste role before dataset completeness; verify a compatible UUID or explicitly retain its unresolved identity. A genuinely mixed stream may remain one physically defined mixture supported by composition records; never invent separation or count its components again. Keep liquid and solid treatment quantities separate. Preserve original period, output balance, reference normalization and allocation rules; missing records do not establish zero or exclusion. mass-balance-identity; manure_nitrogen_losses_specific_emission: For each actual cattle-manure pathway, identify reported ammonia, nitrogen oxides, nitrate and other evidenced nitrogen species and their receiving media separately. Retain the original manure-pathway and live-output attribution. Reconcile nitrogen on a common elemental-N ledger: the non-overlapping sum of losses cannot exceed available manure N after exported and retained N; the original 0 to 1 fraction is a total N-budget check, not a compound emission factor. Do not count the same nitrogen twice across linked pathways. This is a mandatory identification and calculation requirement, not an exchange. Before dataset completeness, instantiate one concrete elementary card per actual substance and receiving compartment. Retain kg substance separately from kg elemental N; convert only from the method-reported basis using the documented composition or stoichiometric fraction of the identified species. Never equate all nitrogen with a chosen compound or add elemental-N and compound masses as separate releases. Preserve source activity, factor units, period, uncertainty, boundary and original normalization; link to an existing matching card instead of counting a duplicate. Verify a compatible UUID or explicitly register the concrete unresolved identity. Missing identity, method or activity evidence does not establish zero or justify omission."
      unit: "kg manure, kg VS, kg N, kg gas species; kg of each identified substance and kg N recorded separately"
      frequency: "monthly or management event"
      temporal_coverage: "every animal phase and manure pathway"
      site_scope: "barn, pasture, storage, treatment and field pathway"
      aggregation_rule: "per reference flow"
      quality_evidence: "laboratory or supplier data, logs, factor table and calculation workbook; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_outputs_and_allocation
      process_id: "herd_production_manure_management"
      flow_role: "intended outputs, handovers and attribution"
      record_type: "sales, milk, breeding, cull, manure export and allocation record"
      raw_fields: "product; quantity; property; handover; recipient; date; direct burden; shared pool; allocation driver; price if used"
      collection_method: "invoice, meter, scale and allocation worksheet; Raw aggregation requirements: direct assignment first; allocate only residual pools; shares sum to one. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again. exported_manure_product_specific_output: Treat manure as a product only when it is intentionally recovered and transferred with a measured quantity, composition, recipient, handover and upstream burden treatment. Denominator and scope requirements：per manure pathway and per 1,000 kg farm-gate live output after attribution Raw quantity and calculation requirements: measured exported mass with dry matter, nitrogen and other declared nutrient content Original collection denominator kind: process_output. Calculate the attributable final-package exchange under inventory_reference_normalization and stage_throughput_linkage using the matched raw records. This is a mandatory output-identification requirement, not an aggregate exchange. Preserve every actual co-product, reject, packaging waste and treatment stream in this operation. Before dataset completeness create separate cards for physically distinct streams, with actual material/state, quantity, destination and Product/Waste role. A genuinely mixed waste stream may remain one physically defined mixture with measured composition; do not invent separation or count its components again. Keep unlike units separate, retain the original allocation and reference normalization, and reconcile the output balance. Identify actual functions before co-product allocation; waste does not acquire a co-product share merely by having mass. Confirm a compatible UUID or explicitly retain its unresolved identity. Missing records never establish zero or exclusion. fao-leap-nutrient-flows-2018"
      unit: "product-specific"
      frequency: "each handover and reporting-period close"
      temporal_coverage: "complete period"
      site_scope: "all product nodes and recipients"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed handover, measured quantity, reviewed worksheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_gate_transfer
      process_id: "farm_gate_transfer"
      flow_role: "selection, pre-transfer weighing and handover"
      record_type: "selection list, calibrated scale ticket, health or market document and transfer record"
      raw_fields: "lot; animal class; sex; route; count; live mass; weighing time; scale; gut-fill or shrink convention; accept/reject; retained; destination; handover time"
      collection_method: "calibrated scale and signed transfer record; Raw aggregation requirements: reconcile input, accepted output, retained or returned cattle, rejects, deaths and measured loss. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again. Keep mutually exclusive accepted, retained/returned, other live transfers and deaths by animal/lot and time. Retain actual carcass mass and disposal evidence separately from live-weight change, excreta, water/carbon transfers and measurement uncertainty. Investigate unexplained residuals rather than turning them into waste; preserve non-carcass waste duties in their actual existing pathway records. Match preceding mortality and treatment records to prevent duplication."
      unit: "kg and head"
      frequency: "each transfer lot"
      temporal_coverage: "full gate operation"
      site_scope: "producing farm gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration, signed ticket and transfer document; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "herd_production"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "manure_management"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: c_normalize_reference
      applies_to: "all inventory rows"
      rule: "normalized amount = attributed process amount / accepted farm-gate live cattle mass on the declared weighing basis."
      inputs:
        - "attributed amount"
        - "accepted live mass"
      output: "amount per 1 kg reference output"
      source_ids:
        - reference-definition
    - id: c_herd_balance
      applies_to: "animal events"
      rule: "beginning animals + births + purchases = cattle sent to gate + other sales + deaths + culls + ending animals, separately by class and period; reconcile parallel live mass without mixing count and mass."
      inputs:
        - "animal-event counts and weights"
      output: "cohort-period balance and residual"
      source_ids:
        - mass-balance-identity
    - id: c_feed_dry_matter
      applies_to: "feed and forage"
      rule: "dry-matter intake = as-fed net intake multiplied by measured or supplier dry-matter fraction; retain each feed identity."
      inputs:
        - "gross issue"
        - leftovers
        - "dry-matter fraction"
      output: "kg dry matter by feed and class"
      source_ids:
        - fao-leap-large-ruminants-2016
    - id: c_enteric_ch4
      applies_to: "enteric methane"
      rule: "Apply the selected IPCC tier to collected category, population, days, intake or energy and diet records; sum category-period CH4 only after preserving inputs and factors."
      inputs:
        - "animal categories"
        - population-days
        - "feed or energy data"
        - "selected factors"
      output: "kg CH4 by category-period"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: c_manure_emissions
      applies_to: "manure methane and nitrogen emissions"
      rule: "Calculate by manure system, volatile solids, nitrogen, climate, storage and recovery; keep direct N2O, indirect N2O, NH3 and other species separate and avoid double counting exported nitrogen."
      inputs:
        - VS
        - N
        - "system shares"
        - time
        - climate
        - recovery
        - export
        - factors
      output: "kg named gas or loss species by pathway-period"
      source_ids:
        - ipcc-2019-livestock-manure
        - fao-leap-nutrient-flows-2018
    - id: c_transport_service
      applies_to: "controlled inbound transport"
      rule: "transport service = actual cargo mass in tonnes × loaded distance; include empty return only when not represented in provider data."
      inputs:
        - "cargo mass"
        - distance
        - mode
        - "return convention"
      output: "tonne-kilometres"
      source_ids:
        - mass-balance-identity
    - id: c_shared_attribution
      applies_to: "shared resources and assets"
      rule: "attributed amount = shared pool × documented service fraction; all consumer fractions for the service period sum to one."
      inputs:
        - "shared total"
        - consumers
        - "service periods"
        - "allocation driver"
      output: "amount by process, product and period"
      source_ids:
        - mass-balance-identity
    - id: c_gate_balance
      applies_to: "gate records and gate_rejects_and_losses"
      rule: "Reconcile animal counts using mutually exclusive accepted, retained/returned, other live transfers and deaths within matched lot/time records. Reconcile live mass separately, recording measured weight change and applicable feed/water, excreta or carbon transfers and uncertainty; investigate residuals without assigning them to waste. The carcass exchange uses documented actual carcass mass and fate only, reconciled with prior mortality records, then normalized once."
      inputs:
        - cp_gate_transfer
        - "matched mortality and weighing records"
      output: "animal-count and live-mass reconciliation; separately evidenced kg carcass"
      source_ids:
        - mass-balance-identity
    - id: calc_feed_supply_and_intake
      applies_to: "feed_and_forage_input"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - fao-feed-loss-accounting-2018
    - id: calc_manure_n2o_coverage
      applies_to: "manure_nitrous_oxide_air"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - ipcc-2019-livestock-manure
        - ipcc-managed-soils-2019
    - id: manure_nitrogen_losses_specific_emission
      applies_to: "manure_management"
      rule: "For each actual cattle-manure pathway, identify reported ammonia, nitrogen oxides, nitrate and other evidenced nitrogen species and their receiving media separately. Retain the original manure-pathway and live-output attribution. Reconcile nitrogen on a common elemental-N ledger: the non-overlapping sum of losses cannot exceed available manure N after exported and retained N; the original 0 to 1 fraction is a total N-budget check, not a compound emission factor. Do not count the same nitrogen twice across linked pathways. This is a mandatory identification and calculation requirement, not an exchange. Before dataset completeness, instantiate one concrete elementary card per actual substance and receiving compartment. Retain kg substance separately from kg elemental N; convert only from the method-reported basis using the documented composition or stoichiometric fraction of the identified species. Never equate all nitrogen with a chosen compound or add elemental-N and compound masses as separate releases. Preserve source activity, factor units, period, uncertainty, boundary and original normalization; link to an existing matching card instead of counting a duplicate. Verify a compatible UUID or explicitly register the concrete unresolved identity. Missing identity, method or activity evidence does not establish zero or justify omission."
      inputs:
        - cp_manure_and_emissions
      output: "separate substance/compartment emissions and elemental ledgers"
      source_ids:
        - fao-leap-nutrient-flows-2018
        - ipcc-2019-livestock-manure
        - mass-balance-identity
    - id: c_gate_carcass_availability
      applies_to: "gate_rejects_and_losses range QA"
      rule: "Q_carcass_gate = sum of documented actual mass for unique carcasses newly generated in this gate operation, excluding prior-phase carcasses and duplicate movements or treatment tickets. Q_accepted = measured accepted live output mass for the same lot and period, strictly positive. After the existing non-negative attribution and final-reference normalization, the carcass exchange in kg per kg accepted output must lie between 0 and Q_carcass_gate / Q_accepted. Use the range only to check independently recorded actual quantities; never generate an exchange from its upper bound or from a live-weight residual. Missing or incompatible carcass/output records make this QA unevaluable, not zero or a pass. A zero carcass amount requires documented absence; a lot with zero accepted output cannot normalize a 1 kg product dataset. Investigate mismatches and weighing uncertainty without clipping records to the bound."
      inputs:
        - cp_gate_transfer
        - "actual carcass event/mass/fate and accepted-output records"
      output: "site-specific QA upper bound in kg carcass/kg accepted live output"
      source_ids:
        - mass-balance-identity
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_manure_and_emissions
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference and all final exchanges"
      requirement: "Confirm the concrete flow type, direction, product or substance identity, farm or process gate, property, unit and support references before dataset release."
      evidence: "platform detail-read and support-reference review"
    - id: dq_route
      applies_to: "every represented route"
      requirement: "Declare the managed parent and the route delta in feed, topology, manure, infrastructure, calculation and validation; do not merge incompatible route records."
      evidence: "route description, housing/grazing records, process map"
    - id: dq_period
      applies_to: "animal phases and shared assets"
      requirement: "Cover the full attributed cohort or reporting period and link opening stock, replacements, births, events, outputs, termination and asset service periods."
      evidence: "herd register, calendar and allocation worksheet"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Include or justify not applicable for starting animals, feed, water, energy, health products, transport under control, intended outputs, mortalities, manure pathways and direct emissions."
      evidence: "completeness matrix and source records"
    - id: dq_mass_and_nitrogen
      applies_to: "cattle and manure"
      requirement: "Reconcile animal count/live mass and manure or nitrogen transfers without treating an unmeasured stock change as a sale or emission."
      evidence: "balances, scale records and calculation workbook"
    - id: dq_attribution
      applies_to: "multi-output and shared systems"
      requirement: "Retain direct assignments, shared pools, drivers, fractions and sensitivities; demonstrate that each burden, output and handover is counted once."
      evidence: "reviewed allocation worksheet"
validation_rules:
  - rule_id: v_reference_gate
    applies_to: "reference output"
    rule: "Reject a package unless 1 kg represents live *Bos* cattle weighed immediately before producing-farm ownership or control transfer with all required qualifiers; count alone is not acceptable."
    source_ids:
      - reference-definition
  - rule_id: v_route_delta
    applies_to: "grazing, mixed, dairy-linked, housed and feedlot variants"
    rule: "Require the managed parent and current evidence for changed topology, feed, manure, infrastructure, calculation or validation; reject label-only variants and unexplained aggregation of mutually exclusive periods."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: v_output_status
    applies_to: "every product, residue and loss"
    rule: "Require one classification as intended output, residue or waste and one actual handover or fate; milk, breeding stock, culls and exported manure are not automatic co-products."
    source_ids:
      - fao-leap-large-ruminants-2016
      - fao-leap-nutrient-flows-2018
  - rule_id: v_period_attribution
    applies_to: "all cohort phases and replacements"
    rule: "Require phase and period indexing, opening and ending stock, replacement and termination treatment, and no duplicate attribution of prior-period or starting-stock burdens."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: v_shared_infrastructure
    applies_to: "assets or services used by multiple nodes, products or periods"
    rule: "Require all consumers and service periods, one evidence-backed attribution decision, fractions summing to one, and no duplicate burden across milk, cattle, manure or other products."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: v_manure_and_emissions
    applies_to: "manure and direct emissions"
    rule: "Require animal category, manure pathway, VS and N basis, selected factor tier, climate or storage conditions, recovery and species-specific outputs; reject generic gas or nitrogen labels in final exchanges."
    source_ids:
      - ipcc-2019-livestock-manure
      - fao-leap-nutrient-flows-2018
  - rule_id: v_flow_binding
    applies_to: "all final exchanges"
    rule: "Expand unresolved conditional flow identities from actual records and verify every concrete UUID, property and unit. Keep unresolved identities blank; do not bind raw milk, veterinary service, buffalo, goat, beef, count-only ox or another near match as the live-cattle mass reference."
    source_ids:
      - reference-definition
  - rule_id: v_mass_balance
    applies_to: "herd, manure and gate records"
    rule: "Investigate animal, live-mass, manure and nitrogen balance residuals and disclose measurement uncertainty before secondary or background use."
    source_ids:
      - mass-balance-identity
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - fao-feed-loss-accounting-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - ipcc-2019-livestock-manure
      - ipcc-managed-soils-2019
  - rule_id: v_gate_waste_quantity
    applies_to: "gate waste and live-weight reconciliation"
    rule: "Reject assigning live-weight deficit, live returns or retained animals to carcass waste or its treatment amount. Require actual carcass mass, fate and responsibility, investigate unexplained residuals and exclude duplicate prior-phase mortality or treatment."
    source_ids:
      - mass-balance-identity
published_dataset_profile:
  dataset_role: "foreground cattle-production package that may become a secondary_dataset or background_dataset only after identity and methodology review"
  downstream_use: "input to downstream livestock, slaughter, food, leather, manure-use and agricultural lifecycle models beginning after the producing-farm gate"
  allowed_use: "live domestic *Bos* cattle on a declared mass, route, cohort-period and producing-farm-gate basis with complete attribution and quality disclosure"
  excluded_use: "buffalo or other bovines; meat, milk, hides, semen, embryos or services as the reference product; slaughterhouse-gate animals; count-only reference flows; unresolved or approximate UUID substitution"
  required_metadata: "cattle class; sex where material; purpose; breed where material; route variant; live-weight basis; geography; farm-gate handover; cohort and reporting period; phases; feed basis; manure systems; co-product handovers; shared assets; factor tiers"
  required_quality_disclosure: "record coverage, route and period representativeness, balance residuals, direct and shared attribution, provisional ranges, unresolved identities, factor sources and omissions"
  update_trigger: "changed route or gate, revised animal/feed/manure records, allocation or period treatment change, new emissions method, or a newly verified compatible reference identity"
data_sources:
  - id: "fao-leap-large-ruminants-2016"
    type: "official_guidance"
    reference: "FAO LEAP, *Environmental performance of large ruminant supply chains*, 2016, https://openknowledge.fao.org/handle/20.500.14283/i6494en"
    used_for: "Cattle supply-chain boundary, process decomposition, animal phases, feed records, co-products and allocation."
  - id: "fao-leap-nutrient-flows-2018"
    type: "official_guidance"
    reference: "FAO LEAP, *Nutrient flows and associated environmental impacts in livestock supply chains*, 2018, https://openknowledge.fao.org/handle/20.500.14283/ca1328en"
    used_for: "Manure and nutrient pathways, intended recovery, nitrogen balances and loss reporting."
  - id: "ipcc-2019-livestock-manure"
    type: "method_factor"
    reference: "IPCC, *2019 Refinement, Volume 4, Chapter 10: Emissions from Livestock and Manure Management*, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf"
    used_for: "Animal categories, activity records, enteric methane and manure methane and nitrogen-emission calculations."
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation-of-mass and conservation-of-nitrogen identities applied to measured foreground records."
    used_for: "Herd, transfer, manure, nitrogen, allocation-share and gate reconciliation."
  - id: "reference-definition"
    type: "method_factor"
    reference: "This PCR's 1 kg live-cattle producing-farm-gate reference definition and arithmetic normalization."
    used_for: "Reference normalization and gate validation."
  - id: "fao-feed-loss-accounting-2018"
    type: "official_guidance"
    reference: "[FAO 2018, Environmental performance of pig supply chains, section 11.2.2](https://www.fao.org/4/i8686en/I8686EN.pdf)"
    used_for: "Feed supply versus intake and waste burden, not animal parameters. Applying this accounting principle to the declared taxon is this PCR's methodological choice; no pig diet or emission factor is transferred."
  - id: "ipcc-managed-soils-2019"
    type: "official_guidance"
    reference: "[IPCC 2019 Refinement, Volume 4, Chapter 11](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf)"
    used_for: "Direct/indirect nitrogen pathways and coordination of manure storage with managed-soil emissions; select applicable species and management evidence."
  - id: "route-energy-fao"
    type: "official_guidance"
    reference: "FAO, Energy-smart food for people and climate (2011), Annex 2; and Energy use in agriculture and industry, Annex IV. https://www.fao.org/4/i2454e/i2454e00.pdf ; https://www.fao.org/4/Q1085e/q1085e0d.htm"
    used_for: "Equipment/carrier possibilities only; site records govern applicability. No intensity, fuel share or default recipe is adopted."
