allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Separable farm activities and outputs"
    rule: "Subdivide directly attributable activities before allocation. Assign milking, milk cooling, and milk-storage burdens entirely to milk; separately accounted animal-rearing or exported crop/energy activities do not enter the shared dairy allocation pool."
    source_ids:
      - idf-dairy-carbon-footprint-2022
  - rule_id: allocation_milk_live_animals
    applies_to: "Shared dairy-herd burdens between milk and live cattle"
    rule: "Apply the IDF 2022 biophysical net-energy method: AF_milk = (NE_L × M_FPCM) / ((NE_L × M_FPCM) + Σ(NE_G,i × M_liveweight,i)); use consistent period FPCM and live-weight sales, class-specific net energy for growth when available, and disclose every factor. The remaining fraction is assigned to live animals."
    source_ids:
      - idf-dairy-carbon-footprint-2022
  - rule_id: allocation_manure
    applies_to: "Manure leaving the farm"
    rule: "Classify manure explicitly. Treat manure with essentially no value at the boundary as a residue using cut-off; if it is a co-product, use disclosed economic allocation; if it is waste, assign its treatment burdens to the dairy system without an avoided-product credit."
    source_ids:
      - idf-dairy-carbon-footprint-2022
      - fao-leap-large-ruminants-2016
  - rule_id: allocation_internal_flows
    applies_to: "Internal milk, feed, and manure transfers"
    rule: "Cancel internal product transfers only after preserving their quantities and characteristics. Internal raw milk fed to calves reduces saleable output; internally produced feed and manure shall not receive duplicated upstream burdens."
    source_ids:
      - idf-dairy-carbon-footprint-2022
      - fao-leap-large-ruminants-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_herd_records
      process_id: "herd_and_feed_management"
      flow_role: "Herd structure, movements, live weight, mortality, and enteric parameters"
      record_type: "Animal register and herd-performance records"
      raw_fields: "animal_class; head_count; entry_date; exit_date; exit_reason; live_weight; body_weight; milk_yield; feed_digestibility; gross_energy_intake"
      collection_method: "Farm register, calibrated scales or documented weight estimation, and herd-system export"
      unit: "head; kg live weight; kg milk; MJ/head/day"
      frequency: "Continuous events, monthly summary"
      temporal_coverage: "At least one representative 12-month period; longer averaging when unstable"
      site_scope: "All cattle supporting reported milk"
      aggregation_rule: "Reconcile opening stock + births + purchases - sales - transfers - deaths = closing stock; aggregate animal-days"
      quality_evidence: "Register reconciliation, scale calibration or method, missing-event log, and system export"
    - protocol_id: cp_feed_records
      process_id: "herd_and_feed_management"
      flow_role: "Feed ration and bedding"
      record_type: "Purchase, mixing, inventory, grazing, and laboratory records"
      raw_fields: "material_id; origin; animal_class; as_fed_mass; dry_matter_fraction; opening_stock; closing_stock; feed_waste; bedding_mass"
      collection_method: "Weighbridge, invoices, mixer logs, feed analyses, grazing estimate, and stock reconciliation"
      unit: "kg as fed; kg dry matter; % dry matter"
      frequency: "Batch or daily, monthly summary"
      temporal_coverage: "Same representative period as milk and herd"
      site_scope: "All feed and bedding used by represented herd"
      aggregation_rule: "Inputs + opening stock - closing stock - losses; convert to dry matter and normalize by FPCM"
      quality_evidence: "Calibration, invoices, laboratory certificates, and reconciliation difference"
    - protocol_id: cp_herd_resource_records
      process_id: "herd_and_feed_management"
      flow_role: "Herd water and housing energy"
      record_type: "Meter, invoice, and equipment-operation records"
      raw_fields: "meter_id; carrier; opening_reading; closing_reading; invoice_quantity; equipment_hours; allocation_driver"
      collection_method: "Sub-meter preferred; otherwise site reconciliation with physical allocation"
      unit: "kg water; kWh; MJ; kg or L fuel"
      frequency: "Monthly"
      temporal_coverage: "Same representative period as milk"
      site_scope: "Herd housing and service areas, excluding separately metered milking"
      aggregation_rule: "Reconcile meters and invoices; preserve distinct carriers"
      quality_evidence: "Meter calibration, invoices, conversion factors, and allocation worksheet"
    - protocol_id: cp_manure_records
      process_id: "manure_management"
      flow_role: "Manure quantity, composition, route, treatment, export, and emissions"
      record_type: "Manure-management and nutrient-balance records"
      raw_fields: "animal_class; volatile_solids; nitrogen_excretion; bedding; dilution_water; management_system; climate; storage_duration; treatment; exported_mass; destination"
      collection_method: "Records, engineering balance, manure analysis, storage measurement, and method calculation"
      unit: "kg manure; kg volatile solids; kg N; days; kg product"
      frequency: "Event or batch, monthly summary"
      temporal_coverage: "Same period as herd and milk"
      site_scope: "Every manure route for all represented herd classes"
      aggregation_rule: "Reconcile generated, stored, treated, applied, exported, and disposed manure; calculate by route"
      quality_evidence: "Sampling, laboratory results, storage dimensions, receipts, balance closure, and factor provenance"
    - protocol_id: cp_on_farm_feed_records
      process_id: "on_farm_feed_production"
      flow_role: "Managed crop and pasture inputs, outputs, land, and nutrient losses"
      record_type: "Field-operation, harvest, grazing, and land records"
      raw_fields: "field_id; crop_or_pasture; area; seed; fertilizer; nutrient_content; manure_applied; crop_protection; fuel; electricity; irrigation; yield; dry_matter; residue; grazing_days; previous_land_use"
      collection_method: "Field logs, invoices, calibrated application records, yield measurement, grazing records, and spatial evidence"
      unit: "ha; kg; kg nutrient; MJ; kWh; kg water; kg dry matter"
      frequency: "Each operation and harvest"
      temporal_coverage: "Crop years supplying feed to milk period"
      site_scope: "All directly managed feed land and included contracted operations"
      aggregation_rule: "Allocate field inputs to harvested or grazed dry matter; retain crop, field, and year"
      quality_evidence: "Completeness, calibration, invoices, dry-matter tests, yield reconciliation, and land evidence"
    - protocol_id: cp_milking_records
      process_id: "milking_cooling_storage"
      flow_role: "Milking, cleaning, cooling, storage, water, energy, chemicals, and refrigerant"
      record_type: "Meter, dosing, service, and cleaning-cycle records"
      raw_fields: "electricity; fuel; water; cleaning_agent; dose; cleaning_cycles; refrigerant_type; refrigerant_added; tank_temperature"
      collection_method: "Sub-meter, invoice, dosing logs, controller, service records, and water balance"
      unit: "kWh; MJ; kg water; kg chemical; kg refrigerant; °C"
      frequency: "Daily or batch, monthly reconciliation"
      temporal_coverage: "Same period as milk output"
      site_scope: "All parlours, milk rooms, cooling, and farm storage"
      aggregation_rule: "Directly assign measured milking/cooling loads to milk and reconcile with site totals"
      quality_evidence: "Calibration, invoices, dosing checks, service certificates, temperature logs, and balance closure"
    - protocol_id: cp_milk_output_records
      process_id: "milking_cooling_storage"
      flow_role: "Physical milk, composition, internal use, rejected milk, wastewater, and saleable output"
      record_type: "Tank, processor receipt, laboratory, disposition, and water-balance records"
      raw_fields: "milk_mass; milk_volume; density; fat_percent; true_protein_percent; temperature; saleable_mass; calf_feed_mass; rejected_mass; wastewater; destination; timestamp"
      collection_method: "Calibrated tank or weigh record linked to laboratory composition, processor receipt, and water balance"
      unit: "kg; L; kg/L; % by mass; °C"
      frequency: "Each pickup or batch; representative composition testing"
      temporal_coverage: "Same period as herd and resource records, including seasonality"
      site_scope: "All produced milk, every disposition, and related wastewater"
      aggregation_rule: "Reconcile produced = saleable + internal use + rejected + inventory change; calculate FPCM by batch or period"
      quality_evidence: "Tank calibration, laboratory QA, receipts, density method, and mass-balance closure"
  calculation_rules:
    - id: calc_fpcm
      applies_to: "Physical raw cattle milk"
      rule: "FPCM (kg) = milk mass (kg) × [0.1226 × fat% + 0.0776 × true protein% + 0.2534]; apply composition values as percentages, calculate at the most representative batch or period resolution, and sum before normalization."
      inputs:
        - milk_mass
        - fat_percent
        - true_protein_percent
      output: "kg FPCM"
      source_ids:
        - idf-dairy-carbon-footprint-2022
    - id: calc_saleable_milk_balance
      applies_to: "Milk dispositions"
      rule: "total physical milk produced = saleable farm-gate milk + internal milk use + rejected milk + closing inventory - opening inventory; investigate unexplained imbalance and normalize only saleable output."
      inputs:
        - total_milk
        - saleable_milk
        - internal_use
        - rejected_milk
        - opening_inventory
        - closing_inventory
      output: "reconciled kg physical milk and kg FPCM"
      source_ids:
        - mass-balance-identity
        - idf-dairy-carbon-footprint-2022
    - id: calc_milk_allocation
      applies_to: "Shared dairy-herd burdens"
      rule: "AF_milk = (NE_L × M_FPCM) / ((NE_L × M_FPCM) + Σ(NE_G,i × M_liveweight,i)); AF_live_animals = 1 - AF_milk. Use IDF class-specific net-energy values or justified values and directly assign separable activities first."
      inputs:
        - M_FPCM
        - animal_class
        - M_liveweight_i
        - NE_L
        - NE_G_i
        - directly_attributable_burdens
      output: "disclosed allocation factors and allocated shared inventory"
      source_ids:
        - idf-dairy-carbon-footprint-2022
    - id: calc_enteric_ch4
      applies_to: "All represented cattle classes"
      rule: "Use the appropriate IPCC 2019 Refinement tier. Prefer Tier 2 when gross-energy intake, methane conversion, animal class, productivity, and diet data are available; otherwise use the most representative permitted factor and disclose the limitation."
      inputs:
        - animal_days
        - animal_class
        - "gross_energy_intake or emission_factor"
        - methane_conversion_factor
        - productivity
        - diet
      output: "kg CH4 from enteric fermentation"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: calc_manure_ch4
      applies_to: "Each manure route"
      rule: "Calculate manure CH4 from animal population, volatile-solids excretion, maximum methane-producing capacity, management-system fraction, methane conversion, and applicable recovery or oxidation terms."
      inputs:
        - animal_days
        - volatile_solids
        - manure_system_fraction
        - B0
        - MCF
        - recovery
        - oxidation
      output: "kg CH4 from manure management"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: calc_manure_n2o
      applies_to: "Each manure route"
      rule: "Calculate direct and indirect N2O from nitrogen excretion and management-system fractions; keep volatilized and leached nitrogen consistent with NH3, nitrate, and managed-soil calculations."
      inputs:
        - nitrogen_excretion
        - manure_system_fraction
        - direct_EF
        - volatilization_fraction
        - leaching_fraction
        - indirect_EF
      output: "kg N2O from manure management"
      source_ids:
        - ipcc-2019-livestock-manure
        - fao-leap-nutrient-flows-2018
    - id: calc_inventory_normalization
      applies_to: "All inventory rows"
      rule: "Divide period quantities by saleable farm-gate FPCM after internal-flow cancellation and allocation; preserve totals, period, and allocation factor for audit."
      inputs:
        - reporting_period_amount
        - saleable_FPCM
        - internal_flow_flag
        - allocation_factor
      output: "inventory amount per 1 kg FPCM"
      source_ids:
        - mass-balance-identity
        - idf-dairy-carbon-footprint-2022
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and classification"
      requirement: "Confirm cattle species, raw/unprocessed state, CPC 02211 scope, reference-flow UUID, farm-gate location, and saleable status."
      evidence: "Product specification, milk receipt, classification record, and TianGong identity confirmation"
    - id: dq_temporal
      applies_to: "All foreground records"
      requirement: "Use a common representative period of at least 12 months unless a shorter period demonstrably covers seasonality; disclose herd expansion, contraction, disruption, drought, or other non-steady conditions."
      evidence: "Dated herd, milk, feed, resource, field, and manure records plus representativeness statement"
    - id: dq_completeness
      applies_to: "Farm balances"
      requirement: "Reconcile milk dispositions, herd movements, feed inventory, water and energy totals, manure routes, and nitrogen flows; quantify missing coverage and omit no material herd class or manure route silently."
      evidence: "Reconciliation worksheets, closure differences, missing-data log, and corrective actions"
    - id: dq_measurement
      applies_to: "Metered, weighed, and laboratory data"
      requirement: "Retain equipment identity, calibration or verification, sampling method, laboratory method, density conversion, and estimation hierarchy."
      evidence: "Calibration certificates, laboratory QA, sampling records, invoices, and estimation rationale"
    - id: dq_geography_technology
      applies_to: "Upstream datasets and emission methods"
      requirement: "Match geography, production system, feed origin, electricity, fuel, climate, manure system, and animal productivity; disclose proxies."
      evidence: "Dataset metadata, supplier information, factor provenance, and proxy justification"
    - id: dq_consistency
      applies_to: "Allocation and direct-emission calculations"
      requirement: "Use one population and period across FPCM, live-weight outputs, enteric emissions, manure emissions, and allocation; keep directly assigned burdens outside the shared allocation pool."
      evidence: "Calculation workbook, factor version, source references, and independent formula check"
validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "Product identity"
    rule: "Fail when the reference product is not cattle milk, is processed beyond raw on-farm cooling/storage, lacks the declared farm gate, or does not use the confirmed reference-flow identity."
    source_ids:
      - idf-dairy-carbon-footprint-2022
  - rule_id: validate_reference_flow
    applies_to: "Functional unit and reference flow"
    rule: "Fail when physical milk mass, fat percentage, true-protein percentage, FPCM calculation, saleable status, or normalization to exactly 1 kg FPCM is missing or inconsistent."
    source_ids:
      - idf-dairy-carbon-footprint-2022
  - rule_id: validate_period_herd
    applies_to: "Temporal and herd coverage"
    rule: "Fail when herd classes, animal movements, milk output, feed, manure, and resource records do not share a representative period or opening and closing herd inventories cannot be reconciled."
    source_ids:
      - idf-dairy-carbon-footprint-2022
      - fao-leap-large-ruminants-2016
  - rule_id: validate_boundary
    applies_to: "Boundary completeness"
    rule: "Fail when material feed supply, directly managed feed production, enteric emissions, manure routes, managed-soil emissions, milking, cooling, water, energy, or milk losses are omitted without an applicability reason and data-gap disclosure."
    source_ids:
      - idf-dairy-carbon-footprint-2022
      - fao-leap-large-ruminants-2016
  - rule_id: validate_emissions
    applies_to: "Direct emissions"
    rule: "Fail when enteric or manure methods omit region, cattle category, productivity, diet or feed-energy basis, manure system, climate, factor source, or calculation tier needed by the method."
    source_ids:
      - ipcc-2019-livestock-manure
  - rule_id: validate_allocation
    applies_to: "Co-products and residues"
    rule: "Fail when directly attributable activities are allocated, live-animal outputs are omitted, IDF net-energy allocation inputs or factors are missing, manure classification is undeclared, or fractions do not sum to one within tolerance."
    source_ids:
      - idf-dairy-carbon-footprint-2022
      - fao-leap-large-ruminants-2016
  - rule_id: validate_internal_flows
    applies_to: "Internal milk, feed, and manure"
    rule: "Fail when internal flows are omitted before reconciliation, counted as both purchased and internally produced, or left in the aggregated inventory without cancellation."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_quality_disclosure
    applies_to: "Dataset publication readiness"
    rule: "Fail when the package lacks geography, production system, period, herd structure, milk composition, feed origin, manure systems, allocation, source/factor versions, proxy disclosure, important QA-range exceptions, or material data gaps."
    source_ids:
      - idf-dairy-carbon-footprint-2022
      - fao-leap-large-ruminants-2016
published_dataset_profile:
  dataset_role: "Foreground raw-cattle-milk production data package normalized to 1 kg FPCM at the farm gate"
  downstream_use: "May be published as a secondary_dataset or background_dataset for dairy processing, food-product, agricultural, and comparative supply-chain models when scope and quality are compatible"
  allowed_use: "Attributional farm-gate inventory, hotspot analysis within the declared farm system, supplier-specific or representative raw-milk input to downstream models, and scenario comparison using the same functional unit and allocation method"
  excluded_use: "Direct consumer or nutrition claims; processed-milk representation; non-cattle milk; consequential market-change claims; cross-study ranking with incompatible boundaries, allocation, geography, period, or data quality; use of provisional QA ranges as default inventory"
  required_metadata: "PCR id and version state; CPC reference; geography; farm production system; reporting period; herd classes and inventory change; raw-milk and FPCM output; fat and true-protein content; farm-gate temperature; feed origin; manure systems; land management; allocation method and factors; Tiangong identities; source and factor versions"
  required_quality_disclosure: "Primary-data coverage by inventory group; measurement and calibration evidence; temporal, geographic, and technological representativeness; mass/energy/nitrogen balance closure; proxies and missing data; emission tier and factors; allocation sensitivity; provisional QA-range exceptions"
  update_trigger: "Recalculate and republish when milk composition, herd productivity or structure, feed system, manure management, farm energy supply, land management, geography, reporting period, allocation method, reference identity, or a material source/factor changes enough to affect representativeness"
