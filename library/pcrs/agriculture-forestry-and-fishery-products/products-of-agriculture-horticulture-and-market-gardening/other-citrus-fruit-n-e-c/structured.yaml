allocation_rules:
  - rule_id: allocation_marketable_and_rejects
    applies_to: "shared orchard and conditioning outputs"
    rule: "Subdivide directly measured orchard and conditioning operations first. Allocate remaining shared burdens only among intended marketable fruit and independently evidenced co-products using a justified physical relationship. Discarded culls and trim receive no co-product share; retain their production and treatment burdens with the saleable outputs. Record the complete output set and shares summing to one; justify an economic fallback only when a physical relationship is unavailable."
    source_ids:
      - iso-14044-2006
      - fao-postharvest-handling-ae075e
  - rule_id: allocation_perennial_stand
    applies_to: "orchard establishment and replacement"
    rule: "Annualize establishment, replacement, and shared perennial assets over documented productive years and replacement events."
    source_ids:
      - fao-gap-framework-2003
      - iso-14067-2018
  - rule_id: allocation_reuse_packaging
    applies_to: "reusable crates and pallets"
    rule: "Allocate manufacture and cleaning by documented service count, loss rate, and represented campaign; record one-way packaging separately."
    source_ids:
      - fao-postharvest-handling-ae075e
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Rejected, returned, composted, treated, or discarded fruit remains a waste or loss flow unless separate sale and management evidence supports co-product treatment."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_orchard_management_records
      process_id: "orchard_management"
      flow_role: "orchard inputs, area, energy, land, and residues"
      record_type: "orchard log, meter, invoice, field record"
      raw_fields: "block; area; stand age; route; irrigation; electricity; fuel; residue; period"
      collection_method: "reconcile block records to meters and invoices; Raw aggregation and attribution: aggregate by block and period before output normalization crop_protection_input_specific_input: Operation orchard_management: Record crop-protection products or active substances by product, date, treated area, and label or prescription basis. Original quantity method: Reconcile purchase, stock, application, treated area, and label concentration for the represented period. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default. orchard_fuel_input_specific_input: Operation orchard_management: Record fuel for mowing, spraying, pruning, nutrient application, and internal orchard handling. Original quantity method: Use fuel records or equipment activity multiplied by a verified fuel-use rate, retaining fuel type. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg, m3, kWh, MJ, m2*a"
      frequency: "each operation and monthly close"
      temporal_coverage: "full represented productive period"
      site_scope: "each block or unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter or invoice and field-log reconciliation"
    - protocol_id: cp_nutrient_application_records
      process_id: "orchard_management"
      flow_role: "nutrient total and soil emissions"
      record_type: "label, purchase, stock, application, and soil record"
      raw_fields: "product; mass; N; P2O5; K2O; date; block; method; soil test"
      collection_method: "reconcile purchase and application to label or laboratory concentration; Raw aggregation and attribution: calculate nutrient equivalents by product before aggregation"
      unit: "kg product and kg nutrient"
      frequency: "each application and annual close"
      temporal_coverage: "full represented period"
      site_scope: "each block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "label or laboratory result and application log"
    - protocol_id: cp_harvest_yield_records
      process_id: "harvest"
      flow_role: "harvest lots, crates, losses, and hand-off"
      record_type: "harvest ticket, scale, crate, and fuel record"
      raw_fields: "lot; identity; block; date; gross; marketable; cull; loss; crates; fuel; gate"
      collection_method: "lot-level scale records reconciled to block yield; Raw aggregation and attribution: gross = marketable + cull + loss harvest_crate_input_specific_input: Record crates or field containers, including reuse count, cleaning, replacement, and loss assumptions. Allocate manufacture, cleaning, replacement, and loss by documented service count. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg, number, MJ"
      frequency: "every harvest lot"
      temporal_coverage: "full harvest campaign"
      site_scope: "each block and hand-off"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale and harvest ticket"
    - protocol_id: cp_primary_conditioning_records
      process_id: "primary_conditioning"
      flow_role: "water, electricity, packaging, output, rejects, wastewater"
      record_type: "pack-house log, meter, scale, issue and waste record"
      raw_fields: "lot; water; recirculation; electricity; packaging; output; reject; wastewater; gate"
      collection_method: "allocate shared records by handled fruit mass; Raw aggregation and attribution: reconcile input and output lots"
      unit: "m3, kWh, kg"
      frequency: "each lot or campaign close"
      temporal_coverage: "full conditioning period"
      site_scope: "each line or first packing site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter, scale, packaging, and waste record"
    - protocol_id: cp_declared_reference_handoff
      process_id: "declared_reference_handoff"
      flow_role: "actual accepted terminal product and paired transfer"
      record_type: "scale/lot/acceptance records"
      raw_fields: "species; state; grade; moisture/basis; gate; actual_terminal_process_id; actual_terminal_output_row_id; lot/transfer_id; gross/tare/net mass R; raw stage totals/throughputs; stocks, rejects and destinations"
      collection_method: "Weigh accepted net R at the existing gate; match exactly one actual terminal source of the same lot/state and reconcile all earlier losses and stocks. If conditional preparation is absent use the last actual included eligible product output, without inventing that preparation. Preserve original activity records and all required qualifiers."
      unit: "kg and native activity units"
      frequency: "each accepted lot"
      temporal_coverage: "matched production and handoff period"
      site_scope: "existing declared producer/primary gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated weighing, acceptance/grade records, lot chain, activation/bypass evidence and closed balances"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground rows"
      rule: "normalized amount = period or lot amount / marketable gate output × 1,000 kg"
      inputs:
        - "collected amount"
        - "gate output"
      output: "amount per reference output"
      source_ids:
        - iso-14067-2018
    - id: calc_nutrient_equivalent
      applies_to: "nutrient input total"
      rule: "nutrient equivalent = product mass × declared concentration"
      inputs:
        - "product mass"
        - "label or laboratory concentration"
      output: "kg N, kg P2O5, or kg K2O"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_perennial_attribution
      applies_to: "establishment and replacement"
      rule: "annual attributed amount = documented amount / declared attribution period, adjusted for area and period"
      inputs:
        - establishment
        - "stand age"
        - period
        - area
      output: "annualized orchard amount"
      source_ids:
        - fao-gap-framework-2003
        - iso-14067-2018
    - id: calc_soil_emissions
      applies_to: "soil nitrous oxide"
      rule: "apply declared factor or measurement to eligible nutrient and residue nitrogen after duplicate-basis removal"
      inputs:
        - "nutrient and residue nitrogen"
        - "factor or result"
      output: "emission amount"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_output_reconciliation
      applies_to: "harvest and conditioning"
      rule: "gross harvest = marketable + cull + trim + loss; investigate unexplained residuals"
      inputs:
        - "lot weights and fate records"
      output: "reconciled products and wastes"
      source_ids:
        - fao-postharvest-handling-ae075e
    - id: conditioning_reject_output_specific_exchanges
      applies_to: "primary_conditioning"
      rule: "Enumerate rejected citrus fruit, trimming residues and washing wastewater as separate actual streams. Measure each physical stream with its own composition, state, native unit, lot/period and destination; instantiate one atomic card per specific stream and boundary role. Distinguish waste transfer, purchased treatment and substance-specific discharge; do not treat a disposal service as the wastewater itself or duplicate treatment burdens. Keep stock, rework, marketed downgrade and discarded waste separate, and count physical mixtures once without also counting their components as additional exits. Retain the linked protocol and actual process attribution. Reconstruct each attributable raw numerator on its recorded stage basis, then normalize once to the matched accepted reference output. Missing identity, quantity, unit or destination blocks dataset completeness; absence requires evidence, not an assumed zero."
      inputs:
        - cp_primary_conditioning_records
      output: "Separate atomic exchanges; completeness required"
      source_ids:
        - fao-postharvest-handling-ae075e
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_nutrient_application_records
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_final_handoff_normalization
      applies_to: "all foreground quantities and actual route outputs"
      rule: "Let R be positive measured accepted final mass in kg for one matched species/state/grade/gate/period, excluding tare, rejects, co-products and held stock. Physical ledger = raw physical quantity/R * 1000 kg, without burden-allocation scaling. Attributable inventory contribution = attributable raw quantity/R * 1000 kg, preserving native numerator units and the existing output/period attribution. A local intensity q_i=Q_i/O_i first reconstructs Q_i=q_i*actual linked O_i; do not divide by R again after final normalization. Both handoff sides are the same measured event R/R*1000 kg, not another physical yield. Include only actual active operations; record and substantiate bypass. Missing/nonpositive R or an unlinked terminal record blocks a normalized complete result, not zero. Preserve original stage data and cancel paired internal transfers once."
      inputs:
        - cp_declared_reference_handoff
        - "original linked collection protocols"
      output: "native quantities per declared final reference"
      source_ids:
        - declared-handoff-measurement-definition
  data_quality_requirements:
    - id: quality_identity
      applies_to: "product and reference flow"
      requirement: "Declare citrus identity, variety group, route, grade, gate, and handling states remain explicit."
      evidence: "product specification and lot record"
    - id: quality_measurement
      applies_to: "quantities and units"
      requirement: "Use calibrated scales and meters where available; document estimates, moisture basis, conversion factors, and reuse assumptions."
      evidence: "calibration, meter, invoice, and calculation records"
    - id: quality_temporal
      applies_to: "orchard and harvest"
      requirement: "Cover the complete represented productive period and campaign, including repeated harvests and replacement events."
      evidence: "field calendar, harvest tickets, pack-house log"
    - id: quality_completeness
      applies_to: "inventory"
      requirement: "Reconcile water, nutrients, energy, fuel, packaging, product, rejects, residues, emissions, and withdrawal; explain missing streams."
      evidence: "mass balance and missing-data note"
    - id: quality_disclosure
      applies_to: "dataset metadata"
      requirement: "Disclose required qualifiers, water source and fate, nutrient and crop-protection basis, perennial allocation, and reject or residue destination."
      evidence: "completed dataset metadata and site records"
validation_rules:
  - rule_id: validate_reference_mass
    applies_to: "reference flow and gate output"
    rule: "The 1,000 kg reference output must use kg mass and reconcile to product identity, grade, handling state, and gate."
    source_ids:
      - iso-14067-2018
  - rule_id: validate_process_reconciliation
    applies_to: "harvest and conditioning"
    rule: "Gross harvest, marketable output, culls, trim, losses, rejects, and wastewater must reconcile or carry a documented residual."
    source_ids:
      - fao-postharvest-handling-ae075e
  - rule_id: validate_perennial_period
    applies_to: "orchard management"
    rule: "Stand age, productive area, period, establishment or replacement event, and annualization basis are required before normalization."
    source_ids:
      - fao-gap-framework-2003
  - rule_id: validate_flow_identity_resolution
    applies_to: "parameterized rows"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_qualifiers
    applies_to: "reference flow and metadata"
    rule: "Required qualifiers must include citrus identity, variety, geography, stand age, period, irrigation, nutrient and crop-protection basis, maturity or grade, conditioning, packaging, fates, and gate."
    source_ids:
      - fao-gap-framework-2003
      - fao-postharvest-handling-ae075e
  - rule_id: validate_final_handoff_bypass
    applies_to: "selected actual route and all conditional bypass states"
    rule: "Check both presence and absence of optional conditioning/packing/storage against actual records: exactly one required handoff reference persists, its source product/state/gate matches Section 3, active physical rows retain measured throughput, and inactive physical activities add no exchange. Require raw accepted mass, upstream closure, unique transfer pairing and single final normalization; an unexplained state or missing identity is not an assumed valid branch."
    source_ids:
      - declared-handoff-measurement-definition
published_dataset_profile:
  dataset_role: "Foreground agricultural production dataset for fresh other citrus fruit"
  downstream_use: "Secondary or background dataset after reference identity, gate, geography, period, and coverage finding are disclosed"
