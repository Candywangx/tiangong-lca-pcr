published_dataset_profile:
  dataset_role: "Foreground dataset for one raw sugar-crop product at its declared farm or primary-conditioning hand-off"
  downstream_use: "secondary_dataset; background_dataset after representativeness and identity review"
  allowed_use: "Crop-specific supply modelling with aligned species, part, purpose, market state, moisture, route, period, gate, and attribution"
  excluded_use: "Product comparisons that mix routes or states; syrup, sugar, extracted juice, fermented products, purified sweetener, or downstream manufacture"
  required_metadata: "crop branch; species/cultivar; plant part; purpose; geography; period; route; establishment/stand phase; area; harvest/tapping pattern; product mass; moisture; grade; hand-off; inputs; shared assets; allocation; unresolved identities"
  required_quality_disclosure: "primary-data share; UUID gaps; moisture and mass balance; range exceedances; provisional ranges; period and co-product attribution; field emissions method; source geography and technology limits"
  update_trigger: "verified reference UUID; new source-backed route/range evidence; changed product state, crop, gate, technology, concrete flow identity verification"
data_sources:
  - id: "src_unsd_cpc01809"
    type: "official_guidance"
    reference: "UNSD CPC 2.1, 01809, https://unstats.un.org/unsd/classifications/Econ/Detail/EN/1074/01809"
    used_for: "Listed crop examples and category boundary evidence"
  - id: "src_fao_sweet_sorghum_cultivation"
    type: "official_guidance"
    reference: "FAO, Sweet sorghum cultivation, https://www.fao.org/4/t4470e/t4470e05.htm"
    used_for: "Sorghum crop route and reported stalk trial yields"
  - id: "src_fao_sweet_sorghum_harvest"
    type: "official_guidance"
    reference: "FAO, Sweet sorghum harvest stage, https://www.fao.org/4/t4470e/t4470e07.htm"
    used_for: "Harvest timing and stalk sugar-content variability"
  - id: "src_fao_sugar_crops"
    type: "official_guidance"
    reference: "FAO, sugar-crop purpose distinctions, https://www.fao.org/4/x9892e/X9892e06.htm"
    used_for: "Distinguishing sugar-purpose sorghum from grain purpose"
  - id: "src_umaine_maple_2025"
    type: "official_guidance"
    reference: "University of Maine Cooperative Extension, Maple syrup production for the beginner, updated 2025, https://extension.umaine.edu/publications/7036e/"
    used_for: "Tapping, collection, seasonal yield and sugarbush records"
  - id: "src_ukys_stevia"
    type: "official_guidance"
    reference: "University of Kentucky Center for Crop Diversification, Stevia, https://ccd.uky.edu/sites/default/files/2024-11/ccd-cp-055_stevia.pdf"
    used_for: "Stevia harvest, leaf handling, drying, and moisture records"
  - id: "src_jecfa_stevia"
    type: "standard"
    reference: "FAO/JECFA, Steviol glycosides monograph, https://www.fao.org/fileadmin/templates/agns/pdf/jecfa/cta/63/Steviol.pdf"
    used_for: "Boundary distinction between harvested leaves and extracted sweetener"
  - id: "src_sweet_project_stevia_lca"
    type: "literature"
    reference: "SWEET project stevia cultivation and LCA case, https://pmc.ncbi.nlm.nih.gov/articles/PMC9839952/"
    used_for: "Region-specific planting density and dried-leaf yield case; not universal"
  - id: "src_ipcc_managed_soils"
    type: "method_factor"
    reference: "IPCC 2019 Refinement, Volume 4, Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "Managed-soil nitrogen-emission method inputs and uncertainty disclosure"
  - id: "declared-handoff-measurement-definition"
    type: "method_factor"
    reference: "This PCR, Sections 3, 6 and 8: measured net mass at the same state and gate is its own normalization denominator, giving a mass ratio of 1; handoff measurement adds no physical processing."
    used_for: "Same-stage and handoff measurement identities; a definition, not an observed yield, empirical default or external publication."
  - id: "ghg-protocol-product-standard-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), Chapter 9, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "General allocation hierarchy and comparable-gate economic basis. Applicability conditions and the explicit residual branch are this PCR's method convention; no product-specific causal coefficient, price or output quantity is prescribed by this source."
  - id: "review-ipcc-soils-2019"
    type: "official_guidance"
    reference: "IPCC 2019 Refinement, Volume 4, Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "Managed-soil direct/indirect N2O and lime/urea CO2 method context; factors require actual applicability and site activity, not a product default."
