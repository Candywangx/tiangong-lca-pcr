allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Inventory one crop branch only. If one stand or field produces multiple intended products in the declared period, first test subdivision by field, operation, harvest, or lot. If subdivision is not feasible, choose and justify a physical or economic allocation driver consistent with the question, document all products and hand-offs, and test a material alternative. Maple timber, sorghum grain, and stevia stems are co-products only when they are intentionally harvested and leave the process as useful products. Leaves, tops, roots, weeds, rejected material, sap leakage, and field losses are residues or waste unless a real use and hand-off are documented. Record multi-year assets and shared equipment once, allocate them by measured productive area, use, tap-season, or machine time, and prevent duplicate attribution across periods or outputs."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_maple_field_records
      process_id: "maple_sap_route"
      flow_role: "stand stock; nutrient products; irrigation; energy; raw sap"
      record_type: "stand, purchase, application, meter, and production records"
      raw_fields: "species; stand_id; trees_planted; replacements; taps; tap_dates; sap_mass_or_volume; density_basis; nutrients; irrigation; fuel; electricity; area; losses; co_products; gate"
      collection_method: "reconcile invoices, stand maps, meters, tapping log, and calibrated scale; Raw aggregation and attribution: aggregate by stand and tap-season; annualize establishment over declared productive periods"
      unit: "plant; kg; m3; kWh; ha"
      frequency: "each operation and each tap season"
      temporal_coverage: "complete represented tap season"
      site_scope: "each represented sugarbush"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier records; field maps; calibrated scale and meter checks"
    - protocol_id: cp_sorghum_field_records
      process_id: "sweet_sorghum_stalk_route"
      flow_role: "seed; nutrient products; irrigation; energy; crop protection; stalk output"
      record_type: "seed, field-operation, application, meter, and harvest records"
      raw_fields: "cultivar; crop_purpose; seed_mass; area; sowing_date; fertilizer_product; nutrient_analysis; irrigation; fuel; electricity; pesticide; harvest_date; stalk_mass; moisture; grain; residues; rejects; gate"
      collection_method: "reconcile invoices, field log, meters, application records, and calibrated harvest scale; Raw aggregation and attribution: aggregate by field and crop cycle; retain grain and stalk quantities separately"
      unit: "kg; m3; kWh; ha; mass fraction"
      frequency: "each operation and crop cycle"
      temporal_coverage: "complete represented crop cycle"
      site_scope: "each represented field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "seed labels; invoices; application log; calibrated scale; meter records"
    - protocol_id: cp_stevia_field_records
      process_id: "stevia_dried_leaf_route"
      flow_role: "planting stock; nutrient products; irrigation; energy; crop protection; dry leaves"
      record_type: "planting, field-operation, application, meter, drying-batch, and production records"
      raw_fields: "cultivar; planting_stock_type; plants; replacements; area; harvest_dates; fertilizer_product; nutrient_analysis; irrigation; fuel; electricity; pesticide; fresh_leaf_mass; dried_leaf_mass; moisture; drying_loss; residues; gate"
      collection_method: "reconcile field book, invoices, meters, dryer log, and calibrated scales; Raw aggregation and attribution: sum accepted dry leaves by harvest cycle; reconcile fresh input, dry output, moisture, rejects, and residues"
      unit: "plant; kg; m3; kWh; ha; mass fraction"
      frequency: "each operation and each harvest/drying batch"
      temporal_coverage: "complete represented harvest and drying cycle"
      site_scope: "each represented field and dryer"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "planting invoice; application log; calibrated scales; moisture test; dryer meter"
    - protocol_id: cp_declared_reference_handoff
      process_id: "declared_reference_handoff"
      flow_role: "reference_product_at_declared_handoff"
      record_type: "handoff weighing and acceptance records"
      raw_fields: "route, terminal_output_row_id, product_state, gate, lot, net_mass_kg, moisture_basis, acceptance, tare"
      collection_method: "Use calibrated scales or traceable weighing records; reconcile the actual terminal-operation handoff lot, accepted net mass, product state and moisture; exclude packaging tare and do not sum preceding-stage quantities."
      unit: "kg"
      frequency: "each handoff lot"
      temporal_coverage: "declared reporting period"
      site_scope: "declared handoff gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration or weighing tickets, acceptance and lot traceability"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "maple_sap_route"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage ; actual production nodes; soil/substrate route; climate/soil; nutrient product mass and composition; residue fate/N; relevant mineralisation/organic-soil/excreta activity; method/tier/equation/version; pathway factors and units; lime/urea; actual fuels; substance/compartment; supplier coverage; site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_maple_sap_mass
      applies_to: "maple"
      rule: "Convert sap volume to mass only with measured density or a disclosed screening conversion; retain raw volume."
      inputs:
        - volume
        - density
        - tap-season
      output: "kg raw sap"
      source_ids:
        - src_umaine_maple_2025
    - id: calc_sorghum_yield
      applies_to: "sweet sorghum"
      rule: "Divide accepted stalk mass by measured crop area only for area-yield comparison; do not infer stalk mass from grain yield."
      inputs:
        - "stalk mass"
        - area
        - moisture
      output: "kg/ha and kg reference flow"
      source_ids:
        - src_fao_sweet_sorghum_cultivation
        - src_fao_sweet_sorghum_harvest
    - id: calc_stevia_dry_matter
      applies_to: "stevia"
      rule: "Report fresh and dried leaf masses separately; calculate dry matter only from measured moisture and preserve drying losses."
      inputs:
        - "fresh mass"
        - "dried mass"
        - moisture
      output: "kg dried leaf and dry-matter fraction"
      source_ids:
        - src_ukys_stevia
    - id: calc_period_share
      applies_to: "perennial and multi-cut routes"
      rule: "Allocate stand establishment and shared assets across recorded productive periods using a declared lifetime/output or measured-use driver; do not count the same asset in multiple periods."
      inputs:
        - establishment
        - "productive years"
        - "period output"
        - "asset use"
      output: "period-specific attributed inventory"
      source_ids:
        - src_umaine_maple_2025
        - src_sweet_project_stevia_lca
    - id: calc_soil_emissions
      applies_to: "managed fields"
      rule: "If direct soil emissions are modelled, calculate them from reported nitrogen inputs, climate/soil conditions, and a declared inventory method; disclose factor and uncertainty. This PCR does not assign an unverified emission UUID or universal factor."
      inputs:
        - "nitrogen application"
        - "soil and climate data"
        - "selected method"
      output: "method-specific direct soil emissions"
      source_ids:
        - src_ipcc_managed_soils
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
    - id: calc_managed_environment_coverage
      applies_to: "actual managed-production nodes"
      rule: "For the actual owned managed-production node(s), require an applicability ledger for direct soil N2O, volatilisation/deposition-derived indirect N2O, leaching/runoff-derived indirect N2O, NH3/NOx and nutrient losses, plus actual liming/urea-use CO2. Primary calculation precedence is a representative pathway measurement, then a validated site/national method applicable to the crop, soil and management; otherwise use the compatible 2006 IPCC/2019-refined managed-soil equations and climate/input-specific factor selection for N2O and lime/urea CO2. Retain the exact edition, equation, tier, activity and factor units, climate and management applicability; no universal dose or emission factor is prescribed. Non-soil/protected routes need a method valid for their actual medium; do not force soil factors onto an inapplicable route. Use the same period/field N ledger for synthetic and organic additions, residues, actual relevant mineralisation/organic-soil and excreta pathways; demonstrate absent pathways rather than infer zero. Calculate direct and each indirect component separately, then assign each once to matching existing or new concrete cards; never add a total to its components. Convert N2O-N to molecular N2O by 44/28 once. NH3, NOx and nutrient/pesticide loss require an applicable measured or documented substance/fate model; total N/P or an unexplained balance residual is not a compound release. Keep actual receiving compartments and molecular versus elemental/reporting bases explicit; indirect formation does not remove the same N from the source ledger twice. Include actual local combustion releases separately using fuel-specific combustion-only methods; purchased electricity/heat/services retain upstream coverage once. Add one identity-specific exchange only for a supported release and reuse an existing matching card, with verified UUID or explicit unresolved identity. Missing applicable method/activity/factor/identity blocks completeness; it is not a justified zero. Attribute raw activity/release totals and normalize once to the matched accepted reference output."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids:
        - review-ipcc-soils-2019
  data_quality_requirements:
    - id: quality_route_identity
      applies_to: "all datasets"
      requirement: "Name one crop, species, plant part, purpose, market state, and hand-off; no unlike route mixing."
      evidence: "field map, crop records, product description, and scale records"
    - id: quality_product_state
      applies_to: "all datasets"
      requirement: "Report moisture, grade, rejected material, and mass basis; distinguish fresh, dried, and processed states."
      evidence: "calibrated scale, moisture test, sorting and batch records"
    - id: quality_inputs
      applies_to: "all datasets"
      requirement: "Reconcile seeds/stock, nutrient products, water, energy, and crop-protection applications to invoices, meters, and field logs; zero use must be explicit."
      evidence: "purchase records, application logs, field book, meters"
    - id: quality_range
      applies_to: "all datasets"
      requirement: "Compare each foreground amount with its card range; explain outliers and replace provisional estimates with local primary data. Ranges are screens, not allowed values."
      evidence: "range-check table, source or reasoned-estimate trace, corrective note"
    - id: quality_attribution
      applies_to: "shared and perennial systems"
      requirement: "Disclose period and co-product allocation, asset-use driver, and sensitivity for material choices."
      evidence: "allocation worksheet and output hand-offs"
