system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The conformance boundary is cradle-to-grave. Directly measured records may cover only selected nodes, but conformance requires all remaining stages to be supplied by compatible linked datasets/scenarios before final-reference normalisation. A short-boundary contribution is not a complete PCR-conforming product dataset."
      source_ids: []
    - rule_id: boundary_required_stages
      applies_to: "Product system"
      rule: "Conformance requires the complete cradle-to-grave system for one purchased fresh undyed stem, including propagation, cultivation, post-harvest, packing, distribution/retail, declared decorative use and material-specific end-of-life. A stage may be covered by a compatible linked dataset with an explicit coverage register instead of duplicate foreground expansion; it cannot be omitted from the completed system. Raw node records are contributions, not independently conforming PCR datasets."
      source_ids:
        - count-mass-water-balance
    - rule_id: boundary_cultivation_inputs
      applies_to: "Cultivation"
      rule: "Include propagation material, growing media, greenhouse or protected-cultivation infrastructure when used, irrigation water, fertilisers, plant-protection products, biological-control disclosure, CO2 enrichment, energy, fuels, field operations, direct emissions, land occupation, and land-use change where relevant."
      source_ids:
        - wur-floripefcr-2024
        - bsi-pas-2050-1-2012
    - rule_id: boundary_post_harvest
      applies_to: "Harvest to dispatch"
      rule: "Include harvesting, grading, trimming, washing or hydration, conditioning chemicals, phytosanitary treatment, cooling, cold storage, bunching or article assembly, packaging, on-site handling, product losses, wastewater, and wastes."
      source_ids:
        - wur-floripefcr-2024
    - rule_id: boundary_capital_goods
      applies_to: "Protected cultivation"
      rule: "Include greenhouse structures and cultivation-specific infrastructure through documented bill of materials, service life, occupied area, and production over that life; disclose any excluded capital goods."
      source_ids:
        - wur-floripefcr-2024
    - rule_id: boundary_cutoff_disclosure
      applies_to: "All stages"
      rule: "Do not omit a known material, energy, transport, waste, or direct-emission flow merely because it lacks data. Record it as unresolved, use a disclosed proxy, or justify exclusion against the applied study rule."
      source_ids:
        - ec-pef-method-2021
        - wur-floripefcr-2024
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "A complete reference system includes distribution/retail, the declared decorative-use scenario and all material-specific disposal routes. An upstream-only foreground dataset remains an intermediate contribution. Missing downstream loss, use or disposal evidence must be collected or represented by an explicit supported scenario; it is not zero. Keep all technical, geographic and temporal scenario choices in the dataset. Land occupation is measured area multiplied by attributable time, with land type; land transformation and carbon-stock change are separate evidence-dependent ledgers, not inferred from occupation."
      source_ids: []
    - rule_id: boundary_water_ownership
      applies_to: "Water supply and abstraction"
      rule: "Purchased water links provider abstraction/supply once; supplier withdrawal is not an extra foreground elementary input. Foreground-owned direct abstraction is a source-specific elementary input with local supply activity, and its internal delivered-water transfer cancels within the aggregate boundary. Keep source/delivery meters and losses separate; do not add a second external water purchase for an internal delivery."
      source_ids:
        - count-mass-water-balance
    - rule_id: boundary_luc_method
      applies_to: "Land transformation and carbon stocks"
      rule: "Use GHG Product Standard 2011 Appendix B for attributable direct land-use-change impacts. Keep occupation, establishment assets and LUC separate. Screen human-induced product-related conversions over the preceding H = max(20 years, one harvest period); plant service life is not automatically the harvest period. Use dated parcel history and the carbon pools before/after conversion, including biomass, dead organic matter and soil. A documented unchanged history can establish non-applicability; missing history cannot. Unknown parcel history requires a geographically and crop-compatible published land-history/LUC scenario under the same method, with proxy disclosure and uncertainty, or the LUC inventory remains incomplete."
      source_ids:
        - ghg-product-standard-2011
