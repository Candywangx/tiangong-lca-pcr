            basis:
              text: "per declared reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_end_of_life_scenario
              source_ids:
                - count-mass-water-balance
            ranges: []
      elementary:
        []
    outputs:
      product:
        []
      waste:
        []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "All multifunctional processes"
    rule: "First subdivide processes and use direct measurements for the flower crop, compartment, batch, article, or route. Apply allocation only to residual shared inputs or emissions."
    source_ids:
      - ec-pef-method-2021
      - wur-floripefcr-2024
  - rule_id: allocation_greenhouse_land_time
    applies_to: "Shared greenhouse cultivation"
    rule: "Allocate shared energy, cleaning, land occupation, and generic operations using crop-specific sub-metering where available; otherwise use occupied area integrated over growing time. Apply economic allocation only to remaining co-products that cannot be separated physically."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: allocation_chp_energy
    applies_to: "Combined heat and power"
    rule: "Apply allocation_chp_boundary to residual shared fuel and direct emissions using net useful delivered heat and electricity in MJ; retain measured efficiency and separately attribute purification burdens for recovered CO2 supplied to cultivation."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: allocation_rotation_inputs
    applies_to: "Organic fertiliser and green manure in rotations"
    rule: "Attribute directly traceable inputs to the receiving crop. For residual organic-fertilizer/green-manure burdens, use each crop's measured or evidenced expected uptake of the relevant available nutrient over the complete rotation: share = crop uptake / total rotation uptake. Retain nutrient species, availability, rotation period and uncertainty; do not assign the total application to every crop. If nutrient causality cannot be evidenced, apply allocation_complete_residual and disclose the proxy; never infer zero."
    source_ids:
      - count-mass-water-balance
      - ghg-product-standard-2011
  - rule_id: allocation_transport_physical
    applies_to: "Shared freight service by homogeneous route leg"
    rule: "For each constant-load leg, first separate the freight-service burden from passenger or other services using documented provider allocation. Within that freight boundary use actual payload-mass shares when mass-constrained and occupied cargo-volume shares when volume-constrained; record the actual limiting constraint and every consignment. Allocate the total leg service under calc_transport_work, not the shipment physical tonne-kilometres a second time. Do not convert volume to mass using an assumed density."
    source_ids:
      - count-mass-water-balance
  - rule_id: allocation_storage_volume_time
    applies_to: "Shared storage, auction, trade, and retail"
    rule: "Allocate utilities and leakage by occupied product volume multiplied by storage time."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: allocation_reuse_cycles
    applies_to: "Reusable buckets, trays, trolleys, and containers"
    rule: "Divide manufacture and end-of-life burdens by verified lifetime uses and include cleaning and return transport for each use."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: allocation_article_components
    applies_to: "Bouquets and similar articles"
    rule: "Normalize article-level burdens by measured flower-stem count for this PCR while retaining each non-floral component as a separate input; do not allocate accessory burdens away from the article."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: allocation_complete_residual
    applies_to: "all residual multifunctionality"
    rule: "First subdivide and directly meter, then use an evidenced causal physical driver. For genuine co-products without an evidenced causal physical relationship, residual economic share = own quantity*price / sum(quantity*price) for all co-products at the same hand-off and representative period. Record all outputs and shares sum to one. Disposal cost does not turn a waste into a co-product; generating burdens remain. A missing denominator/price makes the inventory incomplete, not single-output or zero burden. Do not allocate the raw physical balance."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: allocation_chp_boundary
    applies_to: "on-site CHP and recovered CO2"
    rule: "Subdivide directly attributable equipment burdens first. Split residual shared CHP burdens by this PCR's declared physical choice of net useful electricity and heat, both in MJ, retaining all useful internal and exported outputs. Gross generation/internal losses are not delivered energy. External PEF certification-specific allocation must be demonstrated separately. Keep CO2 purification/delivery burdens and carbon origin/release ownership separate without duplication."
    source_ids:
      - ghg-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_cultivation_materials
      process_id: "cultivation"
      flow_role: "Starting material, growing media, infrastructure, and cultivation materials"
      record_type: "Purchase, stock, supplier, and field records"
      raw_fields: "actual propagation species/state; each material/formulation; mass/count/volume; occupied area and time; crop cohort age/stage; establishment and non-bearing inputs; replacements; termination; asset bill of materials and life; lifetime accepted output; CO2 origin, supplied mass and release/fixation ledger"
      collection_method: "Reconcile purchases and stock; verify bills of materials and supplier specifications"
      unit: "item; kg; m3; m2-year"
      frequency: "Each receipt and annual reconciliation"
      temporal_coverage: "At least three recent years for annual or protected crops, or three recent crop cycles when shorter; steady-state representation for perennials"
      site_scope: "Every included farm and cultivation compartment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Invoices, stock sheets, supplier specifications, infrastructure records, and crop-area logs"
    - protocol_id: cp_water_records
      process_id: "cultivation"
      flow_role: "Irrigation and cultivation water"
      record_type: "Meter and water-source records"
      raw_fields: "actual source and resource compartment; supply versus own abstraction; source and delivery meters; opening/closing readings and storage; water carried by materials; make-up, discharge, evaporative and product-carried water; internal circulation; density and conditions if mass/volume converted ; meter owner and actual foreground abstraction/supply boundary; supplier withdrawal coverage; internal delivery cancellation"
      collection_method: "Read calibrated meters and reconcile water balance"
      unit: "m3"
      frequency: "Monthly and each crop cycle"
      temporal_coverage: "Same representative period as cultivation output"
      site_scope: "Every water source and included cultivation block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Meter calibration, bills, abstraction records, and water-balance check"
    - protocol_id: cp_fertiliser_records
      process_id: "cultivation"
      flow_role: "Fertilisers, manure, amendments, and nutrient inputs"
      record_type: "Application and composition records"
      raw_fields: "product; batch; applied mass; N/P/K composition; organic or synthetic origin; field or compartment; date"
      collection_method: "Reconcile application logs to purchase and stock records; verify composition"
      unit: "kg product; kg N; kg P; kg K"
      frequency: "Each application"
      temporal_coverage: "Same representative period as cultivation output"
      site_scope: "Every included field or compartment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Application logs, invoices, labels, laboratory or supplier composition"
    - protocol_id: cp_plant_protection_records
      process_id: "cultivation"
      flow_role: "Plant-protection and post-harvest treatment products"
      record_type: "Application records"
      raw_fields: "product; active ingredient; concentration; formulated amount; treated area or batch; date; application method ; application route (open field, greenhouse/substrate or post-harvest); each active-ingredient fraction and retained/collected stock; first-release fate ledger linked to cp_pesticide_fate"
      collection_method: "Record each application and calculate active-ingredient mass"
      unit: "kg product; kg active ingredient"
      frequency: "Each application"
      temporal_coverage: "Same representative period as cultivation output"
      site_scope: "Every included field, greenhouse, and post-harvest area"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Application logs, labels, invoices, and applicator calibration"
    - protocol_id: cp_energy_fuel_records
      process_id: "cultivation"
      flow_role: "Electricity, heat, fuels, CHP, and CO2 enrichment"
      record_type: "Meter, invoice, and operating records"
      raw_fields: "each actual carrier; raw quantity/unit; density or net calorific value if converted; local combustion versus purchased/inclusive service; submeter/equipment use; net useful CHP heat/electricity internally used and exported; shared-driver totals; matched stem output"
      collection_method: "Sub-meter where possible; otherwise reconcile facility totals and allocation drivers"
      unit: "kWh; MJ; kg; m3"
      frequency: "Monthly and each crop cycle"
      temporal_coverage: "Same representative period as cultivation output"
      site_scope: "Every included energy system and cultivation compartment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Meter calibration, invoices, fuel specifications, CHP logs, and allocation reconciliation"
    - protocol_id: cp_output_loss_records
      process_id: "cultivation_post_harvest"
      flow_role: "Harvested, saleable, rejected, and lost stems and biomass"
      record_type: "Harvest, grading, waste, and dispatch records"
      raw_fields: "node; lot; reporting dates; opening and closing stem stocks; receipts; accepted dispatch; other transfers; rejected stems; evidenced physical loss; actual water and biomass mass/moisture; final purchased stems; stage-to-final lot link"
      collection_method: "Count by batch and weigh representative stems and wastes"
      unit: "item; kg"
      frequency: "Each harvest and grading batch"
      temporal_coverage: "Same representative period as cultivation output"
      site_scope: "Every included crop, grade, and handling site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Batch tickets, scale records, grade reports, waste receipts, and mass/count balance"
    - protocol_id: cp_cultivation_emissions
      process_id: "cultivation"
      flow_role: "Direct emissions from cultivation"
      record_type: "Calculation workpaper linked to activity records"
      raw_fields: "actual mineral/organic N; residues; soil/climate/drainage; method/tier/version; factors and native species basis; direct and indirect pathway ownership; actual local fuels, lime/urea and CO2 enrichment; chemical-specific receiving compartment ; phosphorus input species, runoff/drainage concentration and volume, soluble versus particulate P, sediment mass/P fraction, crop removal and soil stock; model equations/version and region/soil/management applicability"
      collection_method: "Apply declared factor method to collected activity data"
      unit: "kg substance"
      frequency: "Each reporting period"
      temporal_coverage: "Same representative period as cultivation output"
      site_scope: "Every included field or compartment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Formula audit, source version, input traceability, and independent recalculation"
    - protocol_id: cp_post_harvest_records
      process_id: "post_harvest"
      flow_role: "Water, conditioning agents, energy, storage, refrigerants, and wastewater"
      record_type: "Batch, meter, stock, and maintenance records"
      raw_fields: "stem count; water; agent; energy; storage volume and time; refrigerant charge, additions, recovery; wastewater"
      collection_method: "Measure by batch or reconcile shared systems"
      unit: "item; m3; kg; kWh; m3-day"
      frequency: "Each batch; monthly for shared utilities"
      temporal_coverage: "Same representative period as processed output"
      site_scope: "Every included post-harvest site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Batch sheets, meters, invoices, maintenance logs, and utility reconciliation"
    - protocol_id: cp_packaging_dispatch_records
      process_id: "packaging_dispatch"
      flow_role: "Packaging, accessories, reusable containers, assembly, and dispatch"
      record_type: "Bill of materials and batch records"
      raw_fields: "material; mass; recycled content; article stem count; reuse cycles; cleaning; dispatch count; packaging waste"
      collection_method: "Weigh representative configurations and reconcile purchases and stock"
      unit: "item; kg; m3"
      frequency: "Each configuration and annual reconciliation"
      temporal_coverage: "Current configuration and representative reporting year"
      site_scope: "Every included packhouse or assembly site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Packaging specifications, scale records, purchase data, reuse logs, and batch reconciliation"
    - protocol_id: cp_distribution_records
      process_id: "distribution_retail"
      flow_role: "Transport, storage, auction, trade, retail, losses, and refrigerants"
      record_type: "Route, shipment, facility, and sales records"
      raw_fields: "origin and destination; mode; distance; fuel; load; mass and volume; storage volume and time; utility use; refrigerant; loss count and route ; per constant-load leg all eligible consignment gross payload masses excluding vehicle tare, occupied volumes, limiting constraint, loaded distance, provider passenger/freight allocation, service reference/factor unit, total service, allocated shares/quantity, actual utilisation, return and cooling coverage"
      collection_method: "Collect each route leg and reconcile facility activity"
      unit: "km; tkm; m3-week; kWh; kg; item"
      frequency: "Each shipment and monthly facility totals"
      temporal_coverage: "Representative reporting year with seasonal coverage"
      site_scope: "Every included route leg and facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Freight documents, telematics, utility bills, inventory records, sales and waste records"
    - protocol_id: cp_end_of_life_scenario
      process_id: "end_of_life"
      flow_role: "Flower and packaging treatment"
      record_type: "Composition and scenario records"
      raw_fields: "material mass; local collection share; composting; digestion; recycling; incineration; landfill; transport; recovery yield"
      collection_method: "Use measured composition and current geography-specific treatment evidence"
      unit: "kg; fraction"
      frequency: "Each product configuration; scenario review at least annually"
      temporal_coverage: "Current market and waste-management year"
      site_scope: "Declared consumer market"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Product disassembly record, official waste statistics, treatment evidence, and scenario checksum"
    - protocol_id: cp_consumer_use
      process_id: "consumer_use"
      flow_role: "Decorative use"
      record_type: "Measured or supported scenario"
      raw_fields: "purchased stems; species; vase and service life; decorative days; water-change count/volume; care formulation; energy; wastewater; destination ; actual received and discarded flower counts, mass, moisture and destinations; opening/closing stocks"
      collection_method: "Collect raw amounts for declared geography/configuration; scenario evidence states source, year and uncertainty"
      unit: "Item(s); day; m3; kg; kWh"
      frequency: "per configuration"
      temporal_coverage: "declared decorative period"
      site_scope: "declared consumer market"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Observation record or supported scenario"
    - protocol_id: cp_system_coverage
      process_id: "cultivation_post_harvest_packaging_dispatch_distribution_retail_consumer_use_end_of_life"
      flow_role: "Complete-system linkage"
      record_type: "Boundary register"
      raw_fields: "each stage; actual provider and gate; foreground/link role; lot/period; native output; raw burdens; incorporated loss; end market/use/fate; final purchased stems"
      collection_method: "Reconcile transfers and stage coverage before final-reference normalisation; missing final denominator retains raw contributions only"
      unit: "item; native activity units"
      frequency: "per system"
      temporal_coverage: "matched reporting period"
      site_scope: "complete linked system"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Provider boundaries, lot ledger and coverage register"
    - protocol_id: cp_pesticide_fate
      process_id: "cultivation_post_harvest"
      flow_role: "Named active-ingredient fate"
      record_type: "Application and compartment ledger"
      raw_fields: "ingredient/CAS and fraction; route; formulation/application mass; opening/closing stocks; exhaust flux/volume and concentrations; discharge volumes/concentrations; soil deposition; crop residues; collected waste; degradation products; model version/equations/parameters/conditions; actual recipient and later-treatment coverage"
      collection_method: "Apply the route-specific first-release mass balance in calc_pesticide_release; pair sampling with actual discharge/time; separate model convention from measured fate"
      unit: "kg ingredient; native concentration; m3; time; area"
      frequency: "each application/batch"
      temporal_coverage: "matched application and fate period"
      site_scope: "actual field/equipment/bath"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Sampling/calibration, application records, model and stock reconciliation"
    - protocol_id: cp_luc_history
      process_id: "cultivation"
      flow_role: "Direct land transformation"
      record_type: "Parcel history and carbon-pool ledger"
      raw_fields: "parcel/geography/area; prior/current land state; conversion cause/date; before/after biomass/dead-organic/soil carbon and units; transfer/pool boundaries; harvest period and H; period overlap; gas factors/activity; atmospheric-uptake eligibility; product beneficiaries and shares; supplier LUC coverage; proxy and uncertainty"
      collection_method: "Use boundary_luc_method screening and calc_luc_attribution; retain dated land records, compatible carbon-stock evidence or explicit permitted proxy; no absence inferred from missing history"
      unit: "m2; year; kg C; kg substance"
      frequency: "per event and annual review"
      temporal_coverage: "H-year event window and matched reporting period"
      site_scope: "each included parcel/supply"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Land register/maps, pool methods, dated event/period ledger and independent recalculation"
  calculation_rules:
    - id: calc_stem_normalization
      applies_to: "All process rows"
      rule: "normalized amount = attributed period or batch amount / conforming consumer-ready stems represented by that amount"
      inputs:
        - "attributed amount"
        - "conforming stem count"
      output: "amount per stem"
      source_ids:
        - wur-floripefcr-2024
    - id: calc_article_to_stems
      applies_to: "Bouquets and similar articles"
      rule: "amount per stem = article-level amount / measured qualifying flower-stem count; retain article identity and non-floral components"
      inputs:
        - "article amount"
        - "flower-stem count"
      output: "amount per stem-equivalent"
      source_ids:
        - wur-floripefcr-2024
    - id: calc_loss_scaling
      applies_to: "Successive life-cycle stages"
      rule: "Use calc_stage_stock_loss on paired lot/node ledgers. Where stock changes and route partitions have already been reconciled, upstream stems required for one purchased stem = 1 / product of non-overlapping retained fractions, each greater than zero and at most one. Apply a loss factor once; local measured intensities and upstream linked datasets must not contain the same loss twice."
      inputs:
        - "counted input"
        - output
        - "and loss by stage"
      output: "loss-adjusted upstream stem requirement"
      source_ids:
        - wur-floripefcr-2024
    - id: calc_three_period_average
      applies_to: "Cultivation"
      rule: "Use three representative years or three recent complete crop cycles where applicable; retain the declared temporal window and any justified shorter new-system period. Sum attributable raw activity across periods and divide by summed matching accepted purchased-stem output. Do not take an unweighted mean of annual per-stem intensities."
      inputs:
        - "period inputs"
        - "period outputs"
        - "stem counts"
      output: "representative cultivation inventory per stem"
      source_ids:
        - wur-floripefcr-2024
        - bsi-pas-2050-1-2012
    - id: calc_perennial_steady_state
      applies_to: "Perennial cut-flower systems"
      rule: "Represent the declared cohort and its productive life with measured development-stage areas, time, inputs and accepted outputs. Include establishment and non-bearing burdens and replacements using calc_perennial_cohort; a zero-output juvenile phase is not an excluded burden. Keep forecasts separately evidenced and disclose steady-state assumptions."
      inputs:
        - "stage area"
        - time
        - inputs
        - outputs
        - yields
      output: "steady-state inventory per stem"
      source_ids:
        - wur-floripefcr-2024
        - bsi-pas-2050-1-2012
    - id: calc_nutrient_mass
      applies_to: "Fertilisers and amendments"
      rule: "nutrient mass = applied product mass × documented nutrient mass fraction"
      inputs:
        - "product mass"
        - "N/P/K composition"
      output: "kg nutrient"
      source_ids:
        - wur-floripefcr-2024
    - id: calc_active_ingredient
      applies_to: "Plant-protection products"
      rule: "active-ingredient mass = formulated product mass × active-ingredient mass fraction"
      inputs:
        - "formulated mass"
        - concentration
      output: "kg active ingredient"
      source_ids:
        - wur-floripefcr-2024
    - id: calc_transport_work
      applies_to: "distribution_road_transport, distribution_air_transport, distribution_sea_transport"
      rule: "Split routes when loads or consignments change. Actual consignment work = payload tonnes * loaded km, excluding vehicle tare; retain this physical ledger. Total leg work = sum(actual consignment work). The linked service quantity is total leg work * the mass share or occupied-volume share fixed by allocation_transport_physical; shares across all eligible freight sum to one. For a volume-constrained leg this allocated service quantity is not the consignment physical tkm and is never presented as measured mass. Use a freight dataset/factor compatible with that same total-leg payload, utilisation, technology and provider allocation; otherwise obtain an explicit vehicle/leg burden and multiply by the same share, or retain a service-compatibility gap. Apply empty return, utilisation and refrigeration once within the chosen service boundary; do not multiply already actual payload by load factor again. Normalize the attributed service/burden once by matched purchased stems."
      inputs:
        - "Matched raw ledgers under collection protocols"
      output: "Native service/substance amount attributed per purchased stem"
      source_ids:
        - count-mass-water-balance
    - id: calc_reusable_packaging
      applies_to: "Reusable packaging"
      rule: "material burden per use = packaging manufacture and end-of-life burden / verified lifetime uses; add cleaning and return transport for the current use"
      inputs:
        - "packaging mass"
        - "reuse cycles"
        - cleaning
        - "return route"
      output: "packaging burden per stem"
      source_ids:
        - wur-floripefcr-2024
    - id: calc_dqr
      applies_to: "Data quality"
      rule: "Assess precision, time, geography, and technology representativeness for material activity data and direct elementary flows; retain criterion scores and evidence."
      inputs:
        - "activity and flow evidence"
        - "study context"
      output: "data-quality record"
      source_ids:
        - ec-pef-method-2021
        - wur-floripefcr-2024
    - id: calc_stage_stock_loss
      applies_to: "all stem hand-offs"
      rule: "On a matched lot and count basis, opening stock + receipts = accepted external dispatch + other transfers + rejected removals + evidenced physical losses + closing stock. Pair rework as one transfer; unexplained residual is not an automatic waste. Required upstream stems per purchased stem = 1 / product of measured retained fractions only where no stock/route mismatch exists; every denominator is positive. Otherwise use the complete measured node ledger."
      inputs:
        - "Linked collection protocols"
        - "species/material and matched output"
      output: "Evidenced quantities and reconciled ledgers"
      source_ids:
        - count-mass-water-balance
    - id: calc_water_components
      applies_to: "water-using stages"
      rule: "External water + material-carried inlet water + opening stock = product-carried water + liquid discharge + evidenced evaporation + other exported water + closing stock. Internal recirculation cancels. Metered external wastewater is not reduced by reuse/evaporation a second time; distinguish waste transferred to treatment from specific direct releases."
      inputs:
        - "Linked collection protocols"
        - "species/material and matched output"
      output: "Evidenced quantities and reconciled ledgers"
      source_ids:
        - count-mass-water-balance
    - id: calc_species_mass
      applies_to: "cultivation emissions"
      rule: "IPCC 2019 Refinement Volume 4 Chapter 11 Tier 1 is the default for applicable soil N2O and lime/urea CO2 pathways; Tier 2/3 requires a complete applicable regional/site method and activity record. For NH3 and nitrate, prefer pathway-specific measured species mass (concentration times measured discharge volume, or flux times area times time); otherwise apply a species-specific emissions model with declared version, equations, species basis and geographic/technical applicability, retaining the source of every factor and activity input. Total volatilized or leached N factors are not automatically NH3 or nitrate; unresolved species remain a gap, never zero. Use one declared regionally applicable method/tier and its actual N inputs and pathway factors. Species-specific N2O-N *44/28 gives N2O, NH3-N *17/14 gives NH3, nitrate-N *62/14 gives nitrate; measured compound mass is not reconverted. Total nutrient loss cannot be wholly assigned to one species; retain direct/indirect pathway ownership once. Local fuel/lime/urea fossil CO2 uses actual activity and compatible species factors; purchased-electricity/heat life-cycle CO2e is not local CO2 mass."
      inputs:
        - "Linked collection protocols"
        - "species/material and matched output"
      output: "Evidenced quantities and reconciled ledgers"
      source_ids:
        - count-mass-water-balance
        - ipcc-2019-managed-soils
    - id: calc_perennial_cohort
      applies_to: "cultivation and infrastructure"
      rule: "Include establishment, non-bearing periods, replacements and termination even when no current-year event occurs. Attribute their total supported burden in proportion to accepted output over the same cohort/asset service life; period burden = total burden * period accepted output / total accepted life output. Sum raw attributable burdens and stem outputs before deriving an intensity. Forecast future output only with a documented site-specific scenario and uncertainty; no default life/yield or zero historical burden.  LUC follows its separate fixed event/time attribution and is not amortised again by this cohort formula."
      inputs:
        - "Linked collection protocols"
        - "species/material and matched output"
      output: "Evidenced quantities and reconciled ledgers"
      source_ids:
        - count-mass-water-balance
    - id: calc_refrigerant_balance
      applies_to: "refrigeration equipment"
      rule: "For the same refrigerant and equipment, opening contained mass + charges = closing contained mass + recovered/removed mass + actual release, with documented transfers and uncertainty. Do not equate replacement purchases with leakage, assume a leak fraction, or report kg CO2e as refrigerant mass. Inclusive refrigerated transport datasets and local equipment inventories must not overlap."
      inputs:
        - "Linked collection protocols"
        - "species/material and matched output"
      output: "Evidenced quantities and reconciled ledgers"
      source_ids:
        - count-mass-water-balance
    - id: calc_phosphorus_release
      applies_to: "Cultivation phosphorus"
      rule: "Use a field/equipment-to-receiving-water boundary for phosphorus loss. Soluble P mass = sum(matched dissolved-P concentration * actual runoff/drainage volume); particulate P mass = exported dry sediment * evidenced particulate-P fraction. Retain concentration species/units; convert elemental P to phosphate only for an evidenced phosphate-specific fraction by 94.97/30.97, never for all total P, and never reconvert measured phosphate mass. Use a measured loss ledger first; otherwise a source-backed field/soil/management-compatible runoff/erosion mass-balance model with its explicit equations and actual P input, crop removal, retention, water/sediment and stock parameters. Unexplained P-balance residual is not discharge; missing parameters remain incomplete. Report separate named P/phosphate receiving-compartment cards, without also entering the same P application as a second emission or duplicating inclusive upstream fate."
      inputs:
        - cp_cultivation_emissions
        - "P species and physical water/sediment ledger"
      output: "kg of actual P species per purchased stem"
      source_ids:
        - ec-pef-method-2021
        - count-mass-water-balance
    - id: calc_pesticide_release
      applies_to: "Cultivation and post-harvest protection applications"
      rule: "For each actual active ingredient, applied mass = formulation mass * its mass fraction. Keep formulation manufacture as one upstream product input; active-ingredient bookkeeping is not another upstream purchase. Prefer an ingredient-specific first-release mass balance: opening contained stock + actual additions = closing stock + collected transfers + crop/material retention exported + evidenced degradation/transformation + releases to each actual air/water/soil compartment. Express the parent-ingredient balance on a parent-active-mass-equivalent basis; identify actual transformation products and their separate chemical mass/fate with documented stoichiometry, without assuming detoxification. Internal recirculation cancels; a balance residual is not an emission. Measure liquid release as the sum of time-matched concentration * discharged volume, air release as integrated substance mass flux * area * time (or concentration * exhaust volume), and soil release from supported deposition measurements or the declared mass-balance model. Models must close the same ingredient ledger with versioned equations, actual equipment/ventilation/drainage/application inputs and compatible measured or source-backed fate parameters; a regulatory worst-case concentration is not an inventory mass. For open-field applications only, absent more specific compatible fate data, adopt the dated PEF 2021 first-compartment convention of 0.90 soil, 0.09 air and 0.01 water times the actual field-applied active mass. Mark this as a modelled convention, not measured physical fate; do not simultaneously add later releases of that same applied mass. Do not use it for contained mixing residues, greenhouse/substrate systems or post-harvest baths. Those routes use the measured/modelled first-release ledger above; no undocumented universal fractions are permitted. Distinguish waste sent to treatment from direct environmental release, retain actual crop residues/collected liquid and assign treatment once. Missing a required fate parameter leaves an incomplete record under this fixed method, not permission to select zero or count all applied mass as released. Create separate named ingredient/compartment cards after actual ingredients are identified, never a generic pesticide-emissions card."
      inputs:
        - "Raw protocol ledgers"
      output: "Attributed native amounts"
      source_ids:
        - ec-pef-method-2021
        - count-mass-water-balance
    - id: calc_luc_attribution
      applies_to: "Attributable land-use-change events"
      rule: "For each event under boundary_luc_method, use H = max(20 years, one harvest period) and dated carbon stocks in the same area and pools. Signed CO2 amount = (carbon before - carbon after) * 44/12, preserving the native mass unit; convert tonnes to kg by 1000 explicitly if used. Exclude transfers already counted in harvested products, imported organic material or other processes; include conversion non-CO2 gases separately using compatible event activity and species factors, never as kg CO2e in a substance card. Attribute event amounts evenly over H years from the event: annual share = event amount/H, with evidenced reporting-period overlap; events outside the attribution window do not receive a new charge. Allocate that period share among actual beneficiary products under section 7 and divide once by matched final purchased stems. Keep positive release and eligible negative carbon-stock change in separate substance ledgers; uptake requires evidence of atmospheric origin and retained stock, not imported carbon or an automatic permanence credit. LUC is not spread again over plant/greenhouse life by calc_perennial_cohort. Unknown event date, pools or denominator needs supported proxy evidence under the declared method or blocks completeness; no automatic zero."
      inputs:
        - "Raw protocol ledgers"
      output: "Attributed native amounts"
      source_ids:
        - ghg-product-standard-2011
        - count-mass-water-balance
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Retain species or cultivar, grade, stem length, product form, article composition, production geography, cultivation system, harvest period, post-harvest treatment, packaging, cold-chain condition, and expected decorative life."
      evidence: "Product specification, batch record, and reference-flow metadata"
    - id: dq_temporal
      applies_to: "Cultivation"
      requirement: "Use three representative recent years for annual and protected systems or three consecutive recent cycles for crops shorter than a year; apply documented steady-state treatment to perennial systems."
      evidence: "Period coverage table and source-linked calculation"
    - id: dq_site_coverage
      applies_to: "Multi-site production"
      requirement: "Describe the population, technology, farm practice, climate zone, and capacity strata; document included sites and production coverage."
      evidence: "Site register, sampling rationale, and production-volume reconciliation"
    - id: dq_measurement
      applies_to: "Material activity data"
      requirement: "Prefer calibrated meters, verified invoices, batch counts, scales, and supplier specifications; preserve raw units and conversion factors."
      evidence: "Calibration, invoice, batch, scale, and specification records"
    - id: dq_completeness
      applies_to: "All required stages and flows"
      requirement: "Reconcile inputs, outputs, losses, stock changes, water, energy, and waste; list every unresolved or excluded flow with materiality rationale."
      evidence: "Completeness checklist and mass/count/utility balances"
    - id: dq_representativeness
      applies_to: "Foreground and secondary data"
      requirement: "Assess technological, geographical, temporal, and precision representativeness; disclose proxies and their expected direction of bias."
      evidence: "DQR workpaper and proxy register"
    - id: dq_source_traceability
      applies_to: "Calculated values and factors"
      requirement: "Store formula, source id and version, raw inputs, allocation driver, and calculation output so an independent reviewer can reproduce the value."
      evidence: "Calculation workpaper and cited source"
    - id: dq_uuid_readiness
      applies_to: "Tiangong identity"
      requirement: "Resolve each selected public flow, property, and unit-group UUID against the current Tiangong row before activation or publication; do not substitute a narrower flow."
      evidence: "Tiangong readback record retained outside PCR content"
    - id: starting_material_identity
      applies_to: "cultivation"
      requirement: "All actually used propagation lots, species and physical propagation states; reject purchased-cut-flower double cultivation. Collection protocol: cp_cultivation_materials."
      evidence: "Site records, specifications, raw measurements and identity readback; preserve unresolved gaps."
    - id: growing_media_materials_identity
      applies_to: "cultivation"
      requirement: "Every growing-medium constituent, support, container, greenhouse structure and infrastructure asset actually used; measured native quantities, service life and productive output. Collection protocol: cp_cultivation_materials."
      evidence: "Site records, specifications, raw measurements and identity readback; preserve unresolved gaps."
    - id: fertiliser_inputs_identity
      applies_to: "cultivation"
      requirement: "Every actual formulated fertilizer, organic amendment and lime product separately, with product mass and nutrient fractions. Collection protocol: cp_fertiliser_records."
      evidence: "Site records, specifications, raw measurements and identity readback; preserve unresolved gaps."
    - id: plant_protection_inputs_identity
      applies_to: "cultivation"
      requirement: "Require each actual formulation product input and each named active-ingredient/first-release-compartment elementary output under calc_pesticide_release and cp_pesticide_fate; ingredient bookkeeping does not create a second upstream product burden."
      evidence: "Site records, specifications, raw measurements and identity readback; preserve unresolved gaps."
    - id: other_cultivation_utilities_identity
      applies_to: "cultivation"
      requirement: "Each actual fuel, heat carrier and utility not represented by an applicable specific card. Collection protocol: cp_energy_fuel_records."
      evidence: "Site records, specifications, raw measurements and identity readback; preserve unresolved gaps."
    - id: post_harvest_water_agents_identity
      applies_to: "post_harvest"
      requirement: "Each actual hydration, preservation, sanitation and phytosanitary chemical, its concentration and separate supplied water. Collection protocol: cp_post_harvest_records."
      evidence: "Site records, specifications, raw measurements and identity readback; preserve unresolved gaps."
    - id: other_refrigerants_identity
      applies_to: "post_harvest; distribution_retail"
      requirement: "Each actual refrigerant formulation and its charge, recovery and species-specific release. R134a cards apply only where R134a is actually used. Collection protocol: cp_post_harvest_records; cp_distribution_records."
      evidence: "Site records, specifications, raw measurements and identity readback; preserve unresolved gaps."
    - id: packaging_materials_identity
      applies_to: "packaging_dispatch"
      requirement: "Every actual article accessory, filler, reusable bucket/tray/trolley and remaining packaging constituent; no assumed LDPE or cardboard recipe. Collection protocol: cp_packaging_dispatch_records."
      evidence: "Site records, specifications, raw measurements and identity readback; preserve unresolved gaps."
    - id: consumer_care_materials_identity
      applies_to: "consumer_use"
      requirement: "Every actual care product and reusable vase component attributable to the declared decorative use. Collection protocol: cp_consumer_use."
      evidence: "Site records, specifications, raw measurements and identity readback; preserve unresolved gaps."
    - id: all_waste_material_routes_identity
      applies_to: "end_of_life"
      requirement: "Each additional discarded material, destination-specific treatment service and real recovered product; foreground treatment emissions are distinct substance/compartment exchanges. Collection protocol: cp_end_of_life_scenario."
      evidence: "Site records, specifications, raw measurements and identity readback; preserve unresolved gaps."
validation_rules:
  - rule_id: validate_inventory_card_controls
    applies_to: "All process inventory cards"
    rule: "For every actual exchange retain material/substance, physical state, process gate, period and source/destination, including the receiving compartment when applicable. Confirm actual use and route; missing records do not establish non-applicability. Keep unverified identities unresolved rather than substituting a narrower or different material. For collected or calculated activity rows, collect native quantities under the linked protocol, reconcile matched node counts, stocks and material ledgers, and attribute shared activity using its measured driver. Apply calc_stem_normalization exactly once to the conforming purchased-stem denominator for the same complete system, period and scenario; do not divide already normalized amounts again. The fixed identity-reference output remains 1 Item(s); preserve the explicit LUC and consumer hand-off amount rules without adding another conversion. Adjacent nodes share the same physical hand-off record and cancel internal transfers on aggregation without adding product or treatment burdens twice. Reconcile on-site fuel combustion, purchased heat and enrichment CO2 with inclusive utility-service coverage; temporary plant uptake is not an automatic negative emission. For treatment services, any recovered product requires its own measured quantity and function; retain the no-duplicate-emissions and no-automatic-credit rules of validate_end_of_life_materials."
    source_ids:
      - count-mass-water-balance
  - rule_id: validate_product_identity
    applies_to: "Reference product"
    rule: "Fail conformance when species or cultivar, grade, product form, stem count for an article, cultivation system, production geography, and boundary are missing."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: validate_reference_flow
    applies_to: "Quantitative reference"
    rule: "Require one Item(s) at the consumer-purchase output delivered_stem, with the article stem count positive and accessories retained. Intermediate harvested, conditioned and dispatched counts follow the measured stock/loss ledger and are not fixed to one."
    source_ids:
      - wur-floripefcr-2024
      - lan-cut-flower-review-2022
  - rule_id: validate_reference_uuid
    applies_to: "Tiangong reference flow"
    rule: "Classification mapping accepts only this fresh-flower semantic scope; it is not current external-scheme certification or publication readiness. Verify actual dataset identity against species, fresh undyed state, hand-off and count-compatible property; otherwise retain unresolved status and do not claim full linking. Do not substitute Dyed flower. Activation/publication remain subject to their independent identity and methodology gates."
    source_ids: []
  - rule_id: validate_process_coverage
    applies_to: "Completed system and source contributions"
    rule: "Require all six mapped stages, including consumer_use and end_of_life, covered once by foreground records or identified compatible linked datasets. Verify their actual gates, physical transfers, period/lot matching, supplier coverage and allocation. A short-boundary farm, packhouse or retail dataset alone cannot claim conformance with this PCR or substitute its node output for delivered_stem. Missing downstream scenario, coverage or purchased-stem denominator blocks a completed system."
    source_ids:
      - count-mass-water-balance
  - rule_id: validate_required_inputs
    applies_to: "Cultivation"
    rule: "Require explicit rows or justified non-applicability for starting material, growing medium, cultivation materials, water, fertilisers, plant-protection products, energy, heating or cooling, infrastructure, direct emissions, output, and losses."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: validate_count_balance
    applies_to: "Stem transfers"
    rule: "Reconcile opening stocks, receipts, accepted dispatch, other transfers, rejected removals, physical loss and closing stocks under calc_stage_stock_loss; adjacent hand-offs share quantities, and post-use flowers also require mass/moisture reconciliation."
    source_ids: []
  - rule_id: validate_water_balance
    applies_to: "Water-using stages"
    rule: "Apply calc_water_components to external supply, material-carried water, discharge, evaporation and opening/closing water stocks, retaining measurement uncertainty; internal circulation is not another external input, and measured wastewater is not reduced twice."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "Shared processes"
    rule: "Require subdivision evidence or a cited allocation rule and measured driver; reject unexplained economic allocation where physical separation or causality is available."
    source_ids:
      - ec-pef-method-2021
      - wur-floripefcr-2024
  - rule_id: validate_temporal_coverage
    applies_to: "Cultivation"
    rule: "Require the representative period or an explicit exception consistent with annual, short-cycle, or perennial rules."
    source_ids:
      - wur-floripefcr-2024
      - bsi-pas-2050-1-2012
  - rule_id: validate_loss_scaling
    applies_to: "Downstream stages"
    rule: "Loss fractions are at least zero and strictly below one for a route delivering a positive final reference; retain positive output and matched stocks. Verify the full node ledger and stage-factor ownership rather than assigning a missing loss to zero."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: validate_source_traceability
    applies_to: "Calculated rows"
    rule: "Require every method factor, externally constrained rule, and non-default scenario to reference a listed source id; require every foreground calculated row to link to a collection protocol."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_data_quality
    applies_to: "Dataset profile"
    rule: "Require disclosed precision, time, geography, and technology representativeness and an explicit proxy register."
    source_ids:
      - ec-pef-method-2021
      - wur-floripefcr-2024
  - rule_id: validate_end_of_life_materials
    applies_to: "end_of_life"
    rule: "Treatment fractions for each actual material sum to one on the same time/geography basis; reconcile composition and moisture first. Treatment services are inputs, not recovered outputs; do not repeat service-included emissions. Missing fate evidence blocks completeness. Recovery/substitution credit is not automatic; an external scheme's circularity formula requires separate conformance evidence."
    source_ids:
      - count-mass-water-balance
  - rule_id: validate_pesticide_fate
    applies_to: "Actual protection products and releases"
    rule: "Verify every active ingredient from application to each first-release compartment or evidenced retention/collection/transformation. Enforce the declared route and method hierarchy; reject open-field default fractions for protected/contained/post-harvest systems, duplicate active-ingredient supply, double-counted later fate, unexplained balance residuals and regulatory concentrations presented as mass. Missing route/fate evidence blocks a complete inventory."
    source_ids:
      - ec-pef-method-2021
      - count-mass-water-balance
  - rule_id: validate_luc_attribution
    applies_to: "Land history, stocks and attribution"
    rule: "Require dated parcel/conversion history or the permitted explicit proxy, carbon pools and units, harvest-period evidence, H, event/period overlap, eligible gas/uptake ledgers, beneficiary shares and matched output. Reconcile linked supplier LUC coverage, land occupation and establishment inventories so each burden is counted once; reject zero inferred from missing history or an arbitrary plant-life amortisation."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: validate_transport_service
    applies_to: "Freight legs and allocated service quantities"
    rule: "Reconcile physical consignment tkm separately from allocated service tkm or vehicle/leg burden. Confirm the actual limiting constraint, eligible total payload/volume, shares summing to one and compatible provider/service boundary. The allocated quantities must sum to the complete freight-leg service, with no duplicated loading, return or refrigeration correction. A volume-constrained allocation cannot silently use individual physical tkm as its allocated amount."
    source_ids:
      - count-mass-water-balance
  - rule_id: validate_phosphorus_fate
    applies_to: "Cultivation P"
    rule: "Require soluble versus particulate P loss/retention evidence under calc_phosphorus_release for actual P inputs; verify the chosen field-to-water boundary, species/unit conversion and measured or modelled runoff/sediment inputs. Do not treat total applied P or an unexplained balance residual as measured phosphate release, or count both P application and the same receiving-water emission. Missing applicable fate evidence blocks completeness."
    source_ids:
      - ec-pef-method-2021
      - count-mass-water-balance
published_dataset_profile:
  dataset_role: "Complete cradle-to-grave cut-flower system per purchased stem; raw node contributions have no standalone PCR conformance"
  downstream_use: "secondary_dataset; background_dataset; input to process and lifecyclemodel projections"
  allowed_use: "Product-specific modelling for cut flowers and flower buds when the declared species, grade, cultivation route, geography, time, post-harvest treatment, packaging, distribution, loss, and boundary match the study"
  excluded_use: "Potted plants, planting material, seed, dried or artificial flowers, edible flowers sold as food, undisclosed generic global proxies, or comparison of unlike product specifications and decorative lives"
  required_metadata: "PCR id/version; full-stage coverage register with foreground/linked provider gates, lot/period and purchased-stem denominator; product qualifiers; raw node quantities; site and scenario evidence; pesticide route/fate; land history/LUC window and pools; freight constraint, physical and allocated service ledgers; sources/proxies and identity readback status"
  required_quality_disclosure: "Site and production coverage; collection period; measurement and calculation methods; data-quality criteria; unresolved flows; excluded processes; proxy data and direction of bias; allocation drivers; mass, count, water, and utility reconciliation"
  update_trigger: "Change in species or grade, cultivation technology, energy system, greenhouse infrastructure, water source, nutrient or plant-protection regime, post-harvest treatment, packaging, route or cold chain, loss pattern, waste treatment, source method, or any material input or emission"
data_sources:
  - id: "wur-floripefcr-2024"
    type: "standard"
    reference: "Broekema, R. et al. (2024), Product Environmental Footprint Category Rules for Cut Flowers and Potted Plants: Final version, Wageningen Economic Research Report 2024-023, DOI: 10.18174/549543, retrieved 2026-07-30"
    used_for: "Flower-specific functional unit and reference flow; life-cycle stages; mandatory company-specific data; allocation; temporal coverage; packaging, distribution, loss, data-quality, and end-of-life rules"
  - id: "ec-pef-method-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279, Annex I, sections 4.4.1.4-4.4.1.5 and general PEF method, https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30/eng"
    used_for: "Boundary, allocation and quality guidance; dated open-field pesticide first-compartment convention and phosphorus/compartment distinction. No current certification is asserted."
  - id: "bsi-pas-2050-1-2012"
    type: "standard"
    reference: "BSI PAS 2050-1:2012, Assessment of life cycle greenhouse gas emissions from horticultural products - Supplementary requirements for the cradle-to-gate stages, official BSI record, retrieved 2026-07-30"
    used_for: "Horticultural temporal averaging, perennial steady state, rotation allocation, land-use-change, and cradle-to-gate disclosure"
  - id: "lan-cut-flower-review-2022"
    type: "literature"
    reference: "Lan, Y.-C., Tam, V. W. Y., Xing, W., Datt, R., and Chen, Z. (2022), Life cycle environmental impacts of cut flowers: A review, Journal of Cleaner Production 369, 133415, DOI: 10.1016/j.jclepro.2022.133415"
    used_for: "Independent evidence for stem-count functional units, category variability, and the relevance of cultivation, post-harvest, consumer, energy, water, chemical, land-use, and waste stages"
  - id: "count-mass-water-balance"
    type: "method_factor"
    reference: "Conservation of item count, material, water and attributable burdens; explicit choices defined in this PCR"
    used_for: "Node, stock, loss and conversion consistency; no default quantity ranges"
  - id: "ghg-product-standard-2011"
    type: "standard"
    reference: "WRI/WBCSD Product Life Cycle Accounting and Reporting Standard (2011), Chapter 9 and Appendix B, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Allocation hierarchy and direct-LUC screening, carbon-stock calculation and temporal attribution; specific choices are declared in this PCR"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC 2019 Refinement, Volume 4, Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "Applicable direct/indirect soil-N and lime/urea CO2 pathways; not site quantity evidence"
  - id: "fsi-benchmarking-2024"
    type: "official_guidance"
    reference: "FSI FloriPEFCR Benchmarking Guidance, July 2024, https://fsi2030.com/wp-content/uploads/2024/07/20240701-FSI-FloriPEFCR-Benchmarking-guidance.pdf, sections 2-3"
    used_for: "Distinguish technical method evidence, tool benchmarking and formal scheme compliance; continued use is not inferred renewal"
