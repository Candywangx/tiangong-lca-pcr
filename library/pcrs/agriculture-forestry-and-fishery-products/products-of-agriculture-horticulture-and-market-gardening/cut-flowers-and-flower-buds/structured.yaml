system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default methodological boundary is cradle-to-grave. A foreground production dataset may stop at dispatch only when its shorter boundary is explicit and downstream users can attach the omitted stages without double counting."
      source_ids: []
    - rule_id: boundary_required_stages
      applies_to: "Product system"
      rule: "Include starting-material production and raw-material acquisition, cultivation and harvest, post-harvest handling, packaging, distribution, storage or auction and retail when applicable, consumer use assumptions, and end-of-life for the flowers and packaging. A shorter foreground boundary shall state every omitted downstream stage."
      source_ids:
        - wur-floripefcr-2024
        - lan-cut-flower-review-2022
    - rule_id: boundary_cultivation_inputs
      applies_to: "Cultivation"
      rule: "Include propagation material, growing media, greenhouse or protected-cultivation infrastructure when used, irrigation water, fertilisers, plant-protection products, biological-control disclosure, CO2 enrichment, energy, fuels, field operations, direct emissions, land occupation, and land-use change where relevant."
      source_ids:
        - wur-floripefcr-2024
        - bsi-pas-2050-1-2012
    - rule_id: boundary_post_harvest
      applies_to: "Harvest to dispatch"
      rule: "Include harvesting, grading, trimming, washing or hydration, conditioning chemicals, phytosanitary treatment, cooling, cold storage, bunching or article assembly, packaging, on-site handling, product losses, wastewater, and wastes."
      source_ids:
        - wur-floripefcr-2024
    - rule_id: boundary_capital_goods
      applies_to: "Protected cultivation"
      rule: "Include greenhouse structures and cultivation-specific infrastructure through documented bill of materials, service life, occupied area, and production over that life; disclose any excluded capital goods."
      source_ids:
        - wur-floripefcr-2024
    - rule_id: boundary_cutoff_disclosure
      applies_to: "All stages"
      rule: "Do not omit a known material, energy, transport, waste, or direct-emission flow merely because it lacks data. Record it as unresolved, use a disclosed proxy, or justify exclusion against the applied study rule."
      source_ids:
        - ec-pef-method-2021
        - wur-floripefcr-2024
