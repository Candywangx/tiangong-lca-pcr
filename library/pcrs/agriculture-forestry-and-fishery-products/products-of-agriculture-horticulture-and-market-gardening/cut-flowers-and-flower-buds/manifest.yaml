      reason_code: scope_or_property_mismatch
      explanation: Returned supplied CO2 identities concern welding proxy gas, a particular liquid/industrial gate, food carbonation or incompatible reference properties. None uniquely verifies the enrichment product at its actual delivery gate.
    - row_id: cultivation_water_withdrawal
      reason_code: source_identity_required
      explanation: Freshwater, groundwater, lake water and river water resource identities with volume support exist. The actual source required by this card is not known; generic freshwater cannot establish a groundwater/surface-water identity. The overly generic water row itself advises against its use.
    - row_id: cultivation_land_occupation
      reason_code: land_type_required
      explanation: Arable and greenhouse-arable occupation identities both exist; transformation-to/from rows are different exchanges. Actual cultivation land class is not specified and cannot be selected by ranking.
    - row_id: harvested_stems
      reason_code: no_compatible_candidate
      explanation: The returned flower identity is Dyed flower with a mass basis, not a counted fresh undyed stem at the declared hand-off. No compatible fresh-stem identity was verified in the initial/refinement results.
    - row_id: cultivation_biomass_waste
      reason_code: material_or_gate_mismatch
      explanation: Results are mixed kitchen/garden biowaste, other crop/wood/textile residues or already treated waste. No exact discarded-flower/flower-trimming waste at this transfer gate was verified.
    - row_id: cultivation_nitrous_oxide
      reason_code: receiving_subcompartment_required
      explanation: N2O air candidates exist for unspecified, urban, non-urban/high-stack, long-term and indoor compartments. The declared receiving subcompartment remains site-dependent; no arbitrary default is bound. Compound mass, not N2O-N, must be retained.
    - row_id: cultivation_ammonia
      reason_code: receiving_subcompartment_required
      explanation: Ammonia air candidates exist for several receiving subcompartments. Site evidence has not selected one; preserve NH3 compound mass and the receiving-compartment requirement.
    - row_id: cultivation_nitrate
      reason_code: receiving_subcompartment_required
      explanation: Nitrate candidates distinguish freshwater, seawater, unspecified water and long-term releases. Receiving water is not established; do not conflate nitrate-ion mass with nitrate-N.
    - row_id: cultivation_fossil_co2
      reason_code: receiving_subcompartment_required
