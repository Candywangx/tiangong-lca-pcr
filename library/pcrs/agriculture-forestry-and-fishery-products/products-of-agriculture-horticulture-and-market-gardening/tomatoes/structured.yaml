allocation_rules:
  - rule_id: allocation_accepted_and_rejected
    applies_to: "accepted tomatoes, downgraded fruit, and rejects"
    rule: "Allocate shared crop-cycle inputs first to declared accepted tomato output using measured mass reconciliation. Report downgraded and rejected fruit separately; use economic or physical allocation only when a documented productive recipient exists."
    source_ids:
      - iso-14044-2006
      - codex-cxs-293-2008
  - rule_id: allocation_multiple_varieties
    applies_to: "multiple tomato types, cultivars, or harvest campaigns"
    rule: "Keep types and campaigns separate when input regimes, route, grade, or market state differ. If aggregated, allocate shared operations by measured mass or another declared physical relationship and retain disaggregation evidence."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_reusable_packaging
    applies_to: "reusable crates, pallets, and containers"
    rule: "Allocate packaging burdens over documented reuse cycles and declared capacity or mass basis. Include return and loss records when attributable to the declared gate."
    source_ids:
      - iso-14044-2006
      - codex-cxs-293-2008
  - rule_id: allocation_residue_use
    applies_to: "crop residue, wash solids, and wastewater solids"
    rule: "Keep residue treatment and productive use separate from accepted product. Assign a credit only when recipient, intended use, substitution claim, and allocation method are documented."
    source_ids:
      - iso-14044-2006
      - fao-tomato-good-agricultural-practices
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "crop_establishment"
      flow_role: "seed, transplants, planting water, planting losses"
      record_type: "supplier lot, planting log, establishment log"
      raw_fields: "lot id; material form; mass or viable count; variety; planting date; area; unused and failed material"
      collection_method: "reconcile supplier records to planting-unit logs and retain lot documents; Raw aggregation and attribution: aggregate by planting campaign and production unit"
      unit: "kg, plant, seed, m3, ha"
      frequency: "each lot and planting event"
      temporal_coverage: "complete crop-cycle establishment period"
      site_scope: "each field, compartment, hydroponic unit, or substrate unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier invoice; planting log; lot traceability"
    - protocol_id: cp_irrigation_records
      process_id: "crop_establishment_or_crop_management"
      flow_role: "irrigation, fertigation water, source withdrawal, drainage"
      record_type: "meter record, water balance, fertigation log"
      raw_fields: "source; meter reading; delivered volume; rainfall; recirculation; drainage; discharge; area; date ; opening/closing cumulative readings, timestamps, meter location/unit/reset, external inflows/returns, supply losses, opening/closing water stock, field drainage separately"
      collection_method: "read meters or reconstruct a documented water balance and reconcile source and delivered volumes; Raw aggregation and attribution: sum by crop cycle and retain source and receiving-medium split ; Keep the supply-network and field balances separate under the water calculation rule."
      unit: "m3, mm, ha"
      frequency: "each irrigation event or daily total"
      temporal_coverage: "full crop cycle"
      site_scope: "each irrigation zone and production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration; water-balance closure; operator log"
    - protocol_id: cp_nutrient_records
      process_id: "crop_establishment_or_crop_management"
      flow_role: "nutrient products and calculated emissions"
      record_type: "invoice, label, nutrient plan, application log"
      raw_fields: "product; formulation; mass; nutrient concentration; date; area; application method; soil or drainage condition"
      collection_method: "reconcile purchase, storage, and application records; calculate nutrient equivalents; Raw aggregation and attribution: aggregate by product, nutrient, and crop cycle"
      unit: "kg product, kg N, kg P2O5, kg K2O"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "each production unit and nutrient zone"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "label or supplier specification; nutrient-plan review"
    - protocol_id: cp_crop_protection_records
      process_id: "crop_management"
      flow_role: "crop-protection products"
      record_type: "application log and supplier record"
      raw_fields: "product; active ingredient; concentration; mass or volume; date; treated area; application purpose"
      collection_method: "reconcile application logs with supplier records and crop-protection plan; Raw aggregation and attribution: aggregate by product and active ingredient per crop cycle crop_protection_input_specific_input: Operation crop_management: Crop-protection products cross the boundary when purchased and applied to the represented tomato crop. Record active ingredient and formulated product information separately. Original quantity method: Sum invoices and application logs by product, active ingredient, treated area, and crop cycle; preserve concentration and timing. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg, L, ha"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "each field, compartment, or crop zone"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "operator record; product label; application authorization"
    - protocol_id: cp_energy_records
      process_id: "crop_management"
      flow_role: "machinery fuel and production electricity"
      record_type: "fuel log, meter, invoice, equipment log"
      raw_fields: "carrier; quantity; meter; operation; equipment; production unit; date; allocation basis"
      collection_method: "read meters or reconcile delivery and equipment records to included operations; Raw aggregation and attribution: sum by carrier, operation, and crop cycle mobile_machinery_fuel_specific_input: Operation crop_management: Fuel for tractors, sprayers, harvest aids, forklifts, and other mobile machinery is recorded by operation and production unit. Original quantity method: Sum delivery records or machine fuel logs by operation; preserve fuel type and conversion basis. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "L, kg, kWh, MJ"
      frequency: "each delivery, meter period, or operation"
      temporal_coverage: "full crop cycle"
      site_scope: "each production unit and included service"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter record; invoice; conversion record"
    - protocol_id: cp_harvest_records
      process_id: "crop_management"
      flow_role: "accepted, downgraded, rejected, and harvested tomatoes"
      record_type: "harvest ticket, scale record, grading record"
      raw_fields: "date; lot; harvest round; gross mass; accepted mass; grade; rejected mass; packaging tare; gate state"
      collection_method: "use calibrated scale and lot-level grading reconciliation; Raw aggregation and attribution: sum harvest rounds and reconcile gross, accepted, rejected, and tare masses"
      unit: "kg, percent"
      frequency: "each harvest lot"
      temporal_coverage: "full harvest campaign"
      site_scope: "each field, compartment, and pack-house line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale check; grading record; lot traceability"
    - protocol_id: cp_residue_fate_records
      process_id: "crop_management"
      flow_role: "vines, roots, substrate residue, and crop residues"
      record_type: "residue log, contractor ticket, treatment record"
      raw_fields: "residue type; wet mass; moisture; date; fate; recipient; transport; treatment"
      collection_method: "weigh or calculate residue and retain fate evidence; Raw aggregation and attribution: aggregate by fate and crop cycle"
      unit: "kg, percent, km"
      frequency: "each removal or treatment event"
      temporal_coverage: "crop termination and residue handling period"
      site_scope: "each production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weighbridge or contractor record; recipient declaration"
    - protocol_id: cp_washing_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "washing water, wash solids, wastewater, and trimming rejects"
      record_type: "water meter, wash log, waste ticket, drain record"
      raw_fields: "lot; water in; reuse; discharge; solids; rejected fruit; date; line; treatment route"
      collection_method: "reconcile input water, reused water, discharged wastewater, solids, and product output; Raw aggregation and attribution: aggregate by tomato lot and gate period"
      unit: "m3, kg"
      frequency: "each lot or operating shift"
      temporal_coverage: "all included pre-gate conditioning"
      site_scope: "each washing or conditioning line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter record; waste ticket; mass-balance check"
    - protocol_id: cp_gate_energy_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "sorting, cooling, and packing electricity"
      record_type: "sub-meter, invoice, equipment log"
      raw_fields: "line; operation; kWh; date; lot throughput; allocation basis"
      collection_method: "allocate metered energy to included tomato throughput and retain line records; Raw aggregation and attribution: sum by operation and tomato lot"
      unit: "kWh, kg"
      frequency: "each shift or meter period"
      temporal_coverage: "all included pre-gate operations"
      site_scope: "each pack-house line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "sub-meter or invoice; throughput record"
    - protocol_id: cp_packaging_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "rigid packaging, crates, and pallets"
      record_type: "packaging specification, issue log, return log"
      raw_fields: "package type; material; tare; capacity; count; reuse cycles; return; loss; lot"
      collection_method: "reconcile package issue and return records to lot throughput and declared reuse basis; Raw aggregation and attribution: allocate by capacity or documented mass basis rigid_primary_packaging_specific_input: Operation harvest_and_gate_preparation: Reusable or single-use crates, cartons, trays, and other rigid primary packaging are recorded when supplied or consumed before the declared gate. Original quantity method: Record package type, mass, capacity, reuse cycles, return rate, and tomato lot assignment. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg, item, cycle"
      frequency: "each issue and return event"
      temporal_coverage: "full included gate period"
      site_scope: "each pack-house and transport route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier specification; issue and return log"
    - protocol_id: cp_transport_records
      process_id: "purchased_transport_to_gate"
      flow_role: "purchased road freight"
      record_type: "transport order, bill, route record"
      raw_fields: "material; loaded mass; origin; destination; distance; vehicle or service; return assumption; date"
      collection_method: "calculate tonne-kilometres from verified route and loaded mass; Raw aggregation and attribution: aggregate by material and tomato lot"
      unit: "tkm, kg, km"
      frequency: "each shipment"
      temporal_coverage: "all included pre-gate shipments"
      site_scope: "each route and declared gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "bill of lading; route record; mass record"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "crop_establishment"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_accepted_output
      applies_to: "accepted tomato reference flow"
      rule: "Sum net accepted tomato mass by harvest lot after grading and included washing or cooling, excluding package tare."
      inputs:
        - "harvest tickets"
        - "scale records"
        - "grade records"
        - "package tare"
      output: "kg accepted tomatoes"
      source_ids:
        - codex-cxs-293-2008
    - id: calc_mass_reconciliation
      applies_to: "harvest and gate preparation"
      rule: "Gross harvested mass = accepted mass + downgraded or rejected fruit + trim and foreign material + measured process loss; investigate unexplained residual."
      inputs:
        - "gross mass"
        - "accepted mass"
        - "reject mass"
        - trim
        - loss
        - "moisture basis"
      output: "reconciled tomato mass balance"
      source_ids:
        - mass-balance-identity
    - id: calc_nutrient_equivalents
      applies_to: "nutrient products"
      rule: "Nutrient mass = formulated product mass × documented nutrient concentration; retain product and nutrient bases separately."
      inputs:
        - "product mass"
        - "label or supplier concentration"
        - "application date"
      output: "kg N, kg P2O5, and kg K2O"
      source_ids:
        - fao-greenhouse-vegetables-2013
    - id: calc_water_balance
      applies_to: "irrigation and washing water"
      rule: "For each identified cumulative meter, period volume = closing reading - opening reading, corrected only for documented rollover/reset and the meter unit; preserve both readings, timestamps and meter location. Keep gross source withdrawal W and delivery D at different meter locations separate. For the supply-network boundary reconcile W + other external inflows = D + external return/discharge + distribution loss + closing stored water - opening stored water. Internal recirculation cancels within that boundary and is not another withdrawal or a negative gross source volume. Field drainage belongs to the separate field water balance and must not be added again to water already measured as delivered. Retain measured values and investigate the residual; do not derive zero use from missing readings."
      inputs:
        - "meter readings"
        - delivery
        - rainfall
        - recirculation
        - drainage
        - "storage change"
      output: "m3 source withdrawal and delivered water"
      source_ids:
        - fao-crop-evapotranspiration-56
    - id: calc_crop_cycle_normalization
      applies_to: "all crop-cycle amounts"
      rule: "Normalized amount = recorded or calculated amount ÷ accepted tomato output × 1,000 kg. Preserve production-unit and crop-cycle denominator."
      inputs:
        - "recorded amount"
        - "accepted output"
      output: "amount per 1,000 kg accepted tomatoes"
      source_ids:
        - mass-balance-identity
    - id: calc_nitrogen_emissions
      applies_to: "direct and indirect nitrogen emissions"
      rule: "Apply one declared IPCC-compatible or jurisdictional method to documented nitrogen inputs, soil or substrate conditions, drainage, and residue fate; do not sum overlapping factors."
      inputs:
        - "kg N applied"
        - "method factors"
        - drainage
        - "residue fate"
      output: "kg N2O, NH3, or nitrate loss by receiving medium"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_reusable_packaging
      applies_to: "reusable crates and pallets"
      rule: "Allocated packaging burden = item burden ÷ documented reuse cycles × tomato-lot share by capacity or declared mass basis."
      inputs:
        - "item mass"
        - "reuse cycles"
        - "lot capacity or mass"
        - "return and loss records"
      output: "kg packaging allocated to tomato lot"
      source_ids:
        - iso-14044-2006
    - id: calc_transport_service
      applies_to: "purchased road freight"
      rule: "Transport service = loaded mass in tonnes × verified route distance in kilometres; report return or backhaul assumption separately."
      inputs:
        - "shipment mass"
        - "route distance"
        - "service record"
      output: "tonne-kilometres"
      source_ids:
        - fao-tomato-good-agricultural-practices
    - id: seed_or_transplant_input_identity_and_fate
      applies_to: "crop_establishment"
      rule: "For the original seed_or_transplant_input collection role at this operation, identify the actual physical form, species/material, composition, state and supply/treatment boundary before creating exchanges. Each seed lot, transplant, crown, cutting, larval stage, formulation, coating, preservative or separated residue actually used/generated requires its own concrete card where relevant to this role; these examples are alternatives, not a required recipe. Retain existing collection records and route-specific source evidence. Count-based planting records require measured or supplier-supported mass-per-unit when matched to a mass-based provider; retain count and mass as linked attributes rather than two purchases. Do not merge separate husk/shell or separate agents. A real mixed stream requires composition and recipient evidence and is counted once. Before completeness, record every applicable amount and native unit, link a compatible verified UUID or explicitly unresolved identity, preserve stock/return attribution, and normalize the attributable raw quantity once to the accepted reference output. Missing records are not zero; aggregate ranges are not individual-input defaults."
      inputs:
        - cp_establishment_records
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_nutrient_records
        - cp_irrigation_records
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: rejected_tomato_output_identity_and_fate
      applies_to: "crop_management"
      rule: "The rejected_tomato_output collection role is mandatory when the original operation generates these materials. Record the actual material, composition, state, measured mass and destination separately for each physically distinct stream. Dust, chaff, grain, packaging and product rejects must not share one exchange merely because they arise at the same operation. A physically mixed stream may have one card only with its composition and treatment boundary documented. For downgraded produce, distinguish intended saleable co-products supported by recipient and use evidence from actual waste sent to treatment; a lower grade alone does not determine waste status or allocation. Keep on-site rework/internal returns and in-field retained biomass in reconciled internal ledgers instead of exporting them as waste. Create concrete product or waste cards as appropriate before completeness, with a compatible verified UUID or explicit unresolved identity; keep every attributable burden, do not credit unsubstantiated substitution, and do not count any stream twice. Normalize measured quantities once to the original accepted reference output. A missing identity, amount or destination blocks completeness; no aggregate default or numeric bound is inferred."
      inputs:
        - cp_harvest_records
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids:
        - codex-cxs-293-2008
        - usda-ams-tomato-grade-standard
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity_qualifiers
      applies_to: "reference flow and all product lots"
      requirement: "Declare tomato type, cultivar group, route, geography, gate, maturity, grade, and packaging state; retain evidence gap platform identity for later foreground resolution."
      evidence: "lot metadata; product specification; gate record"
    - id: quality_mass_closure
      applies_to: "harvest, rejects, residues, washing, and wastewater"
      requirement: "Close the product and process mass balance for each represented crop cycle or document the unexplained difference and its effect on normalized values."
      evidence: "calibrated scale; mass-balance worksheet; waste ticket"
    - id: quality_temporal_coverage
      applies_to: "crop-cycle inputs and outputs"
      requirement: "Cover the full planting-to-gate crop cycle and every harvest round; identify missing periods, substitutions, and averaging windows."
      evidence: "planting log; harvest log; meter periods"
    - id: quality_route_disclosure
      applies_to: "open-field, greenhouse, hydroponic, and substrate production"
      requirement: "Identify route, occupied area, infrastructure attribution, recirculation, heating, lighting, substrate, drainage, and crop-termination treatment whenever included."
      evidence: "production-unit record; equipment log; route declaration"
    - id: quality_nutrient_traceability
      applies_to: "nutrient inputs and nitrogen emissions"
      requirement: "Link each nutrient value to a product record, concentration, application log, and declared emission method; distinguish product mass from nutrient mass."
      evidence: "invoice; label; nutrient plan; calculation worksheet"
    - id: quality_water_traceability
      applies_to: "irrigation, withdrawal, washing, and drainage"
      requirement: "Identify source, meter or water-balance method, delivered volume, recirculation, drainage, discharge, and receiving medium."
      evidence: "meter record; water-balance closure; discharge record"
    - id: quality_reject_and_residue_fate
      applies_to: "downgraded fruit, crop residue, wash solids, and wastewater"
      requirement: "Record measured amount, moisture basis where relevant, destination, treatment, transport, and recipient evidence for every non-product stream."
      evidence: "waste ticket; contractor record; recipient declaration"
    - id: quality_energy_and_transport
      applies_to: "fuel, electricity, and purchased transport"
      requirement: "Retain carrier or service type, quantity, operation, route, date, meter or shipment evidence, and allocation basis."
      evidence: "invoice; meter record; bill of lading; route record"
validation_rules:
  - rule_id: validation_reference_mass
    applies_to: "reference flow and accepted output"
    rule: "Require 1,000 kg net accepted tomatoes as normalized reference amount and retain the platform-verified reference product identity for CPC 3.0 01234."
    source_ids:
      - codex-cxs-293-2008
  - rule_id: validation_mass_reconciliation
    applies_to: "harvest and gate-preparation inventory"
    rule: "Check that accepted output, downgraded or rejected fruit, residues, trim, wastewater solids, and process losses reconcile with gross harvested or received mass within documented measurement tolerance."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_crop_cycle_completeness
    applies_to: "crop establishment and crop management"
    rule: "Reject a dataset that omits a represented planting campaign, harvest round, or route-specific input without a justified zero or documented exclusion."
    source_ids:
      - fao-tomato-good-agricultural-practices
  - rule_id: validation_nutrient_basis
    applies_to: "nutrient products and emissions"
    rule: "Check product mass, nutrient concentration, nutrient amount, application timing, and declared emission method before accepting nitrogen, ammonia, or nitrate values."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validation_water_balance
    applies_to: "irrigation, source withdrawal, washing, and drainage"
    rule: "Check units, source, meter or balance period, delivered water, recirculation, discharge, and receiving medium; investigate negative or unexplained balances."
    source_ids:
      - fao-crop-evapotranspiration-56
  - rule_id: validation_gate_state
    applies_to: "reference product and process boundary"
    rule: "Check that washing, cooling, packaging, transport, and pack-house operations are included only when before the declared gate and disclosed in metadata."
    source_ids:
      - codex-cxs-293-2008
      - usda-ams-tomato-grade-standard
  - rule_id: validation_range_screen
    applies_to: "all important inventory rows"
    rule: "Compare site values with the row range or documented evidence. Values outside a range require an explanation, revised evidence, or an explicit scenario declaration."
    source_ids:
      - codex-cxs-293-2008
      - fao-greenhouse-vegetables-2013
  - rule_id: validation_residue_fate
    applies_to: "rejects and residues"
    rule: "Require a fate and destination for each rejected fruit, crop residue, wash solid, and wastewater stream; do not apply a credit without documented productive use."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground tomato production dataset that may be published as a secondary_dataset and used as a documented agricultural production input"
  downstream_use: "Downstream process and lifecyclemodel construction for fresh whole tomato supply at the same declared gate and compatible route, geography, period, and product qualifiers"
  allowed_use: "Comparative or attributional LCA when crop-cycle completeness, gate state, route, mass reconciliation, nutrient basis, water balance, and residue fate are disclosed"
  excluded_use: "Canned, dried, juiced, pureed, concentrated, cooked, retail, consumer, or materially different tomato routes without an explicit transformation or reallocation model"
  required_metadata: "canonical PCR id; reference amount; tomato type and cultivar group; geography; production route; planting and harvest dates; gate; maturity and grade; accepted, rejected, residue, and wastewater masses; irrigation source and method; nutrient basis; crop-protection program; energy and transport; packaging and reuse; platform identity resolution status"
  required_quality_disclosure: "temporal coverage; site and production-unit coverage; measurement and mass-balance closure; route and technology; water and nutrient evidence; residue fate; missing data; ranges used; allocation; uncertainty fields"
  update_trigger: "new production route, material changes in irrigation or fertigation, heating or lighting, crop-protection regime, grade or gate definition, packaging system, residue fate, source method, or verified product and flow identities"
