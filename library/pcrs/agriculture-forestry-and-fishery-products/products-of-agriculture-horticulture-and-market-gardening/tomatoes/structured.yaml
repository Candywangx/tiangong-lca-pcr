measurement_rules:
  - id: reference_tomato_mass
    applies_to: "reference product and harvest reconciliation"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Express the reference as net accepted tomato mass at the declared gate. Weigh harvested, marketable, downgraded, rejected, foreign material, and crop-residue streams separately."
  - id: crop_cycle_normalization
    applies_to: "field, greenhouse, hydroponic, and substrate routes"
    required_property_ref:
      name: "Area and mass"
      uuid: ""
    required_unit: "ha or m2; kg"
    rule: "Record each production unit and planting campaign separately, then normalize inputs and outputs to accepted mass from the same crop cycle."
  - id: nutrient_product_basis
    applies_to: "mineral fertilizers, fertigation products, manure, compost, and amendments"
    required_property_ref:
      name: "Product and nutrient mass"
      uuid: ""
    required_unit: "kg product; kg N, P2O5, or K2O"
    rule: "Give every actual fertilizer or amendment product its own card, retaining physical product mass, formulation, nutrient composition and application records. Nutrient quantities are not additional inputs of the same product; collection or group identifiers cannot substitute for a concrete flow identity."
  - id: irrigation_delivery_basis
    applies_to: "irrigation, fertigation carrier water, and source withdrawal"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Record delivered irrigation and source withdrawal separately and distinguish rainfall, recirculated solution, drainage, and discharge where modelled."
  - id: harvest_round_aggregation
    applies_to: "repeated-harvest tomato routes"
    required_property_ref:
      name: "Mass and time"
      uuid: ""
    required_unit: "kg and crop cycle"
    rule: "Sum each harvest round from the same planting and reconcile accepted fruit, downgraded fruit, field losses, and residues before normalization."
  - id: energy_carrier_conversion
    applies_to: "electricity, heating, pumping, and mobile machinery"
    required_property_ref:
      name: "Energy or carrier mass"
      uuid: ""
    required_unit: "kWh, MJ, L, or kg"
    rule: "Preserve measured carrier, operation, conversion factor, and production unit. Do not infer greenhouse heating from crop yield alone."
  - id: packaging_mass_basis
    applies_to: "crates, cartons, trays, films, pallets, and reusable containers"
    required_property_ref:
      name: "Mass or item count"
      uuid: ""
    required_unit: "kg or item"
    rule: "Record package mass or item count together with capacity, reuse cycles, return rate, and lot assignment when packaging is included before the gate."
