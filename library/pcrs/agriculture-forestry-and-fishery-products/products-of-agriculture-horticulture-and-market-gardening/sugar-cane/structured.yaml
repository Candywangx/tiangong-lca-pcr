allocation_rules:
  - rule_id: allocation_period_series
    applies_to: "plant cane and ratoons"
    rule: "Assign period-specific inputs directly. Amortize establishment, long-lived field preparation and termination across actual accepted output of the declared crop series; do not apply a universal ratoon count and do not allocate shared burdens again within each period."
    source_ids:
      - fao-sugarcane-water-2012
  - rule_id: allocation_outputs
    applies_to: "stalks and intended residue outputs"
    rule: "Enumerate every independently intended output and its hand-off. Use a documented physical relation when causal; otherwise use disclosed economic allocation. Residues without intended product status remain residue or waste and receive no avoided-burden credit by default."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_routes
    applies_to: "field-lots and harvest events"
    rule: "Link inputs, outputs, cleaning, changeover and shared machine operation to one field-lot event and allocate shared burdens once by measured operating time, area or throughput."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rework_reject
    applies_to: "off-spec cane and returned material"
    rule: "Retain prior burdens on reworked or downgraded cane, add only incremental operations, and count it once at its final exclusive destination; rejects cannot also be accepted output."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_cycle
      process_id: "field_production"
      flow_role: "crop series, land, planting, standing cane, failed biomass and stubble"
      record_type: "field register; scale; survey"
      raw_fields: "field; crop_series; period; plant_or_ratoon; area; establishment; termination; input_mass; output_mass; moisture"
      collection_method: "reconcile field register, harvest scale and area survey; Raw aggregation and attribution: retain period records; aggregate accepted outputs only after shared-burden attribution"
      unit: "ha; kg; %"
      frequency: "each event and period"
      temporal_coverage: "complete declared crop series"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "field map; dated register; calibrated scale; crop-series linkage"
    - protocol_id: cp_field_inputs
      process_id: "field_production"
      flow_role: "nutrient and crop-protection products"
      record_type: "invoice; application log; analysis"
      raw_fields: "field; period; product; amount; formulation; nutrient_analysis; date; treated_area"
      collection_method: "reconcile invoices and application records; retain every product once; Raw aggregation and attribution: sum by actual product and period; normalize after period attribution"
      unit: "kg; L; kg nutrient"
      frequency: "each application"
      temporal_coverage: "each plant or ratoon period"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice; label; analysis; applicator log"
    - protocol_id: cp_irrigation
      process_id: "field_production"
      flow_role: "irrigation withdrawal"
      record_type: "meter; pump log"
      raw_fields: "source_compartment; delivered_volume; conveyance_boundary; field; period"
      collection_method: "calibrated meter or documented pump calculation; Raw aggregation and attribution: sum delivered water by source and period"
      unit: "m3"
      frequency: "each irrigation"
      temporal_coverage: "each represented period"
      site_scope: "each field and source"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration; pump curve; log"
    - protocol_id: cp_operation_energy
      process_id: "all"
      flow_role: "fuel and electricity"
      record_type: "invoice; meter; machine log"
      raw_fields: "process; field_lot; period; route; carrier; amount; runtime; shared_operation"
      collection_method: "reconcile meter or invoice with machine hours; Raw aggregation and attribution: convert with documented factor and allocate shared use once"
      unit: "L; kg; kWh; MJ"
      frequency: "each operation"
      temporal_coverage: "establishment through hand-off"
      site_scope: "each field-lot and machine"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice; meter calibration; hour log"
    - protocol_id: cp_field_emissions
      process_id: "field_production"
      flow_role: "managed-soil and nitrogen losses"
      record_type: "calculation record"
      raw_fields: "N_by_source; residue_N; lime; urea; field_conditions; tier; factors; compartments"
      collection_method: "apply declared current method to collected field inputs; Raw aggregation and attribution: calculate by field-period before aggregation"
      unit: "kg N; kg emission"
      frequency: "each period"
      temporal_coverage: "each plant or ratoon period"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "method version; factor provenance; calculation sheet"
    - protocol_id: cp_harvest_lot
      process_id: "harvest"
      flow_role: "stalks, loss, technology and burn state"
      record_type: "scale; harvester monitor; sampling log"
      raw_fields: "field_lot; date; manual_or_mechanical; green_or_burnt; standing_mass; collected_mass; loss_mass; moisture; damage"
      collection_method: "weigh collected cane and use representative before/after or field-loss sampling; Raw aggregation and attribution: moisture-align and close inputs and outputs"
      unit: "kg; %"
      frequency: "each field-lot event"
      temporal_coverage: "each harvest period"
      site_scope: "each field-lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale calibration; sampling plan; route declaration"
    - protocol_id: cp_residue_routes
      process_id: "harvest"
      flow_role: "tops, trash, burn and stubble"
      record_type: "quadrant sample; scale; route log"
      raw_fields: "field_lot; fraction; wet_mass; dry_matter; N_content; retained; removed; burned; intended_use; disposal; stubble_area"
      collection_method: "representative sampling and exclusive destination reconciliation; Raw aggregation and attribution: assign every fraction to exactly one destination"
      unit: "kg; kg dry matter; ha"
      frequency: "each harvest event"
      temporal_coverage: "each harvest period"
      site_scope: "each field-lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "sampling plan; laboratory result; destination receipt; burn record"
    - protocol_id: cp_conditioning_lot
      process_id: "field_conditioning"
      flow_role: "inlet, accepted stalks, co-products, rejects, removed material and dust"
      record_type: "scale; lot log; sample"
      raw_fields: "lot; pass; inlet_mass; accepted_mass; coproduct_mass; reject_mass; removed_mass; moisture; destination; dust_measurement"
      collection_method: "weigh each inlet and outlet; sample moisture and foreign matter; Raw aggregation and attribution: sum passes without duplicating returned material; moisture-align mass balance"
      unit: "kg; %"
      frequency: "each lot and pass"
      temporal_coverage: "harvest to field hand-off"
      site_scope: "each lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale calibration; lot identity; acceptance record; destination evidence"
  calculation_rules:
    - id: calc_period_attribution
      applies_to: "shared establishment and termination"
      rule: "burden_to_period = shared_burden × accepted_period_mass / total_accepted_mass_in_declared_series; use another causal relation only when documented"
      inputs:
        - "shared burdens"
        - "accepted mass by period"
      output: "period-attributed burden"
      source_ids:
        - fao-sugarcane-water-2012
    - id: calc_mass_closure
      applies_to: "harvest and conditioning"
      rule: "moisture-aligned inputs = accepted output + intended outputs + retained material + losses + rejects + other exits ± measured stock change"
      inputs:
        - "all inlet and outlet masses"
        - moisture
      output: "mass-closure residual"
      source_ids:
        - mass-balance-identity
    - id: calc_residue_exclusivity
      applies_to: "tops, trash and stubble"
      rule: "total sampled residue = retained + intended removal + burned + recovered/disposed + stubble category, with mutually exclusive fractions"
      inputs:
        - "residue dry matter"
        - destinations
        - "N content"
      output: "residue mass and N by route"
      source_ids:
        - ipcc-managed-soils-2019
    - id: calc_soil_emissions
      applies_to: "managed-soil emissions"
      rule: "apply the declared current IPCC or accepted regional tier to collected nutrient products, crop-residue routes, lime, urea and site conditions; preserve gas and compartment identity"
      inputs:
        - "field input and residue records"
        - factors
      output: "species-specific emissions"
      source_ids:
        - ipcc-managed-soils-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Retain platform UUID, species or hybrid, agricultural-field hand-off, maturity, moisture, burn state, harvest method and acceptance condition."
      evidence: "flow record; lot acceptance"
    - id: dq_periods
      applies_to: "crop series"
      requirement: "Cover establishment, every included ratoon, final termination and every accepted harvest; identify missing or partial periods."
      evidence: "field register; crop-series reconciliation"
    - id: dq_routes
      applies_to: "harvest and residues"
      requirement: "Require mutually exclusive green/pre-burn state and exclusive residue destinations with mass and dry-matter evidence."
      evidence: "harvest log; sampling; destination records"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Report primary-data coverage, missing data, provisional estimates, scale and meter calibration, mass closure and Range exceptions."
      evidence: "coverage table; calibration; QA report"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require the stated product, Mass-property and Mass-unit-group UUIDs, 1 kg amount and all required qualifiers; reject a sucrose or processed-sugar interpretation."
    source_ids: []
  - rule_id: validate_period_series
    applies_to: "plant and ratoon periods"
    rule: "Require crop-series and period ids, establishment and termination boundaries, accepted output by period and one disclosed attribution of every shared burden; block missing or double-attributed periods."
    source_ids:
      - fao-sugarcane-water-2012
  - rule_id: validate_route_delta
    applies_to: "harvest alternatives"
    rule: "Require parent harvest activity, manual/mechanical state and exactly one green/pre-burn state for each event, plus current evidence for changed inputs, emissions, loss, residue and stubble requirements."
    source_ids:
      - sra-harvest-manual-2014
      - fao-cane-environment-1997
  - rule_id: validate_nutrient_cardinality
    applies_to: "each process"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_output_routes
    applies_to: "stalks, residue, stubble, loss and rejects"
    rule: "Require one exclusive hand-off or destination for every state and an explicit allocation decision for every independently intended output; prevent the same residue or cane from occupying two states."
    source_ids:
      - ipcc-managed-soils-2019
      - mass-balance-identity
  - rule_id: validate_rework
    applies_to: "off-spec material"
    rule: "Link every rejected state to rework, downgrade, recovery or disposal; retain prior burdens, add incremental work once and exclude it from accepted output until resolved."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_runs
    applies_to: "field-lots, events and passes"
    rule: "Link inputs, outputs, cleaning, changeover and shared operations to one period, event or pass and assign shared burdens once."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_ranges
    applies_to: "cards with ranges"
    rule: "For each supplied quantitative Range, verify lower/upper bounds, unit, basis, basis kind, evidence kind and source field in English, Chinese and projection. Flag missing important-flow ranges as candidate evidence gaps."
    source_ids:
      - mass-balance-identity
published_dataset_profile:
  dataset_role: "foreground production dataset for accepted mature harvested sugarcane stalks at the agricultural-field hand-off"
  downstream_use: "secondary_dataset; background_dataset after representativeness review"
  allowed_use: "LCA and footprint studies requiring fresh mature cane stalks at the declared agricultural-field hand-off"
  excluded_use: "sucrose, processed sugar, juice, syrup, molasses, ethanol, bagasse, seed cane, post-field transport or undisclosed factory processing"
  required_metadata: "geography; crop year; field and crop-series ids; plant/ratoon period; species or hybrid; establishment and termination; irrigation; management; green/pre-burn and manual/mechanical harvest; moisture; acceptance; residues; stubble; output destinations; allocation"
  required_quality_disclosure: "primary-data coverage by period; calibration; sampling; missing data; provisional ranges; route evidence; moisture-aligned mass closure; factor versions; period and output attribution; Range exceptions"
  update_trigger: "material change in platform identity, field hand-off, crop-series design, plant/ratoon mix, establishment, irrigation, nutrient concrete flow identity verification"
