  what: "Accepted mature harvested sugarcane stalks at the exact platform gate Natural mix, at agricultural fields"
  how_much: "1 kg"
  how_well: "Meets declared lot acceptance for variety or hybrid, maturity, moisture, burn status, harvest method, tops/leaves, foreign matter, damage and gross adhering soil"
