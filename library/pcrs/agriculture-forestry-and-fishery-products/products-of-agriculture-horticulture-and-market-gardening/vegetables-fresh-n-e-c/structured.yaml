system_boundary:
  rules:
    - rule_id: rule_residual_category_gate
      applies_to: "product identity and reference flow"
      rule: "Confirm that no narrower named CPC vegetable category applies before selecting this PCR; retain the species, cultivar, edible part, and route decision in dataset metadata."
      source_ids:
