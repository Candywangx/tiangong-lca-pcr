allocation_rules:
  - rule_id: rule_single_output_crop_allocation
    applies_to: "crop production with one declared marketable output"
    rule: "Assign the full crop-cycle inventory to the declared reference product when no intentional co-product or secondary marketed output is reported."
    source_ids:
      - iso-14044-2006
  - rule_id: rule_grade_output_allocation
    applies_to: "grading, sorting, and multiple marketed grades"
    rule: "Report every intentional marketed grade or co-product. Apply physical mass allocation as the default when outputs have comparable fresh-material function; use an explicitly justified alternative only when mass does not represent the relevant causal relationship."
    source_ids:
      - iso-14044-2006
      - fao-food-loss-waste-2019
  - rule_id: rule_residue_not_coproduct
    applies_to: "field residue, rejects, and non-marketed losses"
    rule: "Treat residues and rejects as waste or destination-specific material unless they are intentionally marketed or transferred as a declared co-product with its own hand-off."
    source_ids:
      - fao-food-loss-waste-2019
  - rule_id: rule_shared_input_allocation
    applies_to: "shared machinery, infrastructure, or utilities"
    rule: "Allocate shared records to the declared crop cycle and output set using documented area, time, mass, or activity drivers; retain the driver and contributing outputs."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_crop_area_yield
      process_id: "p_crop_production"
      flow_role: "area, crop-cycle output, and residue"
      record_type: "field and harvest records"
      raw_fields: "area; crop dates; cultivar; harvested mass; field residue; destination"
      collection_method: "farm records, weighbridge, calibrated measurement, and grower interview; Raw aggregation and attribution: aggregate by field and crop cycle, then reconcile to reported output"
      unit: "ha, kg, date"
      frequency: "every crop cycle"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each contributing field or production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "field map, weighbridge record, and crop-cycle log"
    - protocol_id: cp_crop_inputs
      process_id: "p_crop_production"
      flow_role: "seed, water, nutrient, energy, fuel, and calculated emissions; required specific-emission identification and calculation"
      record_type: "input and utility records"
      raw_fields: "product identity; amount; nutrient basis; water meter; electricity; fuel; application date; source; substance name; receiving compartment; reported unit and elemental/compound basis; method and factor source; actual activity; period; quantity uncertainty; related existing exchanges"
      collection_method: "invoices, application logs, meters, supplier declarations, and method calculation; Raw aggregation and attribution: allocate shared records by documented crop-cycle driver crop_fuel_specific_input: Fuel is recorded for tractors, pumps, heating, or other mobile or stationary crop-production equipment inside the boundary. Fuel issue, meter, or invoice record allocated to the declared crop cycle This is a mandatory specific-input collection requirement, not a selected exchange. Identify every actual formulation, carrier or independently supplied service from primary records, with physical identity, state, native quantity and supplier specifications. Create a separate concrete card for each actual input before dataset completeness; verify a compatible UUID or explicitly retain its unresolved identity. Product mass and contained active-substance mass are different ledgers: convert only using documented composition and never count both as two purchases. Finished feed and separately added ingredients must not duplicate its recipe. Distinguish fuel purchase, purchased electricity/heat and inclusive machinery services; charge only their actual boundaries once. Preserve the original operation, period, attribution and final-output normalization. Missing identity or records do not establish zero use; no universal component range or invented recipe is supplied. iso-14044-2006 crop_input_packaging_waste_specific_output: Packaging discarded from crop inputs is recorded when it crosses the foreground boundary as a separately managed waste stream. Weighed waste or supplier-packaging reconciliation This is a mandatory specific-output collection requirement, not a selected exchange. Preserve every actual waste, residue, reject and co-product from this operation. Create separate cards for physically distinct streams with actual material, composition/state, quantity, receiving route and Product/Waste role before dataset completeness; verify a compatible UUID or explicitly retain its unresolved identity. A genuinely mixed stream may remain one physically defined mixture supported by composition records; never invent separation or count its components again. Keep liquid and solid treatment quantities separate. Preserve original period, output balance, reference normalization and allocation rules; missing records do not establish zero or exclusion. fao-food-loss-waste-2019; crop_soil_nitrogen_loss_specific_emission: Reconcile crop-cycle nutrient inputs, crop removal, soil storage and the method-supported nitrogen-loss pathways for the actual vegetable crop. A residual nitrogen balance or retained soil N is not automatically an elementary emission to soil. Establish the actual substance and receiving medium before creating any release; retain original crop attribution and final fresh-vegetable normalization. This is a mandatory identification and calculation requirement, not an exchange. Before dataset completeness, instantiate one concrete elementary card per actual substance and receiving compartment. Retain kg substance separately from kg elemental N; convert only from the method-reported basis using the documented composition or stoichiometric fraction of the identified species. Never equate all nitrogen with a chosen compound or add elemental-N and compound masses as separate releases. Preserve source activity, factor units, period, uncertainty, boundary and original normalization; link to an existing matching card instead of counting a duplicate. Verify a compatible UUID or explicitly register the concrete unresolved identity. Missing identity, method or activity evidence does not establish zero or justify omission."
      unit: "kg, m3, kWh, MJ, kg nutrient; kg of each identified substance and kg N recorded separately"
      frequency: "each application or meter period"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each contributing field or production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, meter, application record, and factor-selection note"
    - protocol_id: cp_harvest_operations
      process_id: "p_harvest_capture"
      flow_role: "harvested output, harvest fuel, and losses"
      record_type: "harvest campaign records"
      raw_fields: "operation date; machinery or contractor; fuel or service; harvested mass; damage; field destination"
      collection_method: "harvest log, fuel issue, contractor record, and weighbridge; Raw aggregation and attribution: reconcile standing crop, harvested output, and loss destinations harvest_fuel_input_specific_input: Operation p_harvest_capture: Fuel or a declared harvest service crosses the boundary when machinery or contracted operations remove the product from the field. Original quantity method: Harvest-operation fuel or service record allocated to the campaign Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg, L, MJ, date"
      frequency: "each harvest event"
      temporal_coverage: "full harvest campaign"
      site_scope: "each harvest block or campaign"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "harvest log, scale record, and contractor invoice"
    - protocol_id: cp_conditioning_records
      process_id: "p_primary_conditioning"
      flow_role: "conditioning input, water, electricity, rejects, wastewater, and output"
      record_type: "batch and utility records"
      raw_fields: "batch id; input mass; water; electricity; reject mass; wastewater; output mass; treatment route"
      collection_method: "batch sheet, meters, scale, and wastewater record; Raw aggregation and attribution: reconcile input to output, rejects, and wastewater by batch"
      unit: "kg, m3, kWh"
      frequency: "each batch"
      temporal_coverage: "all included conditioning batches"
      site_scope: "each conditioning line or site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "batch sheet, scale calibration, meter record, and treatment receipt"
    - protocol_id: cp_grading_reconciliation
      process_id: "p_grading_sorting"
      flow_role: "grade outputs, rejects, and grading input"
      record_type: "grading and sales records"
      raw_fields: "batch id; input; accepted grade; secondary grade; reject; destination; sale status"
      collection_method: "grading log, scale, sales record, and destination record; Raw aggregation and attribution: reconcile input to all product outputs and rejects"
      unit: "kg, date"
      frequency: "each grading batch"
      temporal_coverage: "all included grading batches"
      site_scope: "each grading line or site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "grade log, scale record, and destination evidence"
    - protocol_id: cp_packaging_records
      process_id: "p_packaging_presentation"
      flow_role: "product input, packaging, electricity, rejects, and reference output"
      record_type: "packaging and dispatch records"
      raw_fields: "batch id; product input; material and mass; reuse status; electricity; reject; net output; hand-off; stream material/product identity; composition and contamination state; native quantity and unit; item-mass/density conversion evidence; lot; net product and packaging mass; reuse/rework; recipient; treatment route; matched reference output"
      collection_method: "packaging bill of materials, scale, meter, and dispatch record; Raw aggregation and attribution: report net product separately from packaging mass and reconcile rejects; packaging_rejects_specific_output: For each vegetable packaging batch, weigh or reconcile discarded packaging by actual material separately from rejected vegetable net mass. Retain species, product state, composition, packaging tare, actual destination and reuse status. A packaged-product reject may remain one exchange only if it is physically transferred as one documented composite stream with fruit/vegetable and packaging fractions evidenced; do not also export those fractions as independent waste exchanges. Reconcile input, accepted net product, rejects and stocks on the same batch scope. This is a mandatory collection and calculation requirement, not an inventory exchange. Before dataset completeness, create one physically specific card for each actual exported stream, including composition, state, native quantity/property, destination and evidenced product/waste role. Use only a compatible verified UUID, or explicitly register the concrete unresolved identity. Do not invent a packaging recipe, assume segregation, infer zero from missing evidence or omit a required stream. A real single mixed stream may remain one composition-defined identity only with collection/transfer evidence and compatible treatment; never duplicate it with its component exports. Keep separately handled liquid and solid streams distinct. Preserve original attribution, period, mass/water balances, reference denominator and treatment/service boundaries; link existing matching exchanges rather than count duplicates. Former aggregate ranges are not individual-stream defaults or limits."
      unit: "kg, kWh, date; kg separately for each stream; native liquid volume separately; count and mass distinct"
      frequency: "each packaged batch"
      temporal_coverage: "all included packaging batches"
      site_scope: "each packaging line or site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "packaging specification, scale calibration, utility record, and dispatch record"
  calculation_rules:
    - id: rule_normalize_to_reference_flow
      applies_to: "all inventory rows"
      rule: "normalized_amount = recorded_or_calculated_amount / net_marketable_reference_mass"
      inputs:
        - "row amount"
        - "net marketable reference mass"
      output: "amount per 1 kg reference fresh vegetable"
      source_ids:
        - iso-14044-2006
    - id: rule_calculate_crop_yield_reconciliation
      applies_to: "crop production and harvest"
      rule: "standing_crop = harvested_output + field_loss + residue + other_declared_destinations"
      inputs:
        - "field output"
        - "harvested mass"
        - losses
        - residues
        - destinations
      output: "reconciled crop-cycle output set"
      source_ids:
        - fao-crop-production-guidance-2016
        - fao-food-loss-waste-2019
    - id: rule_calculate_nutrient_basis
      applies_to: "fertilizer or soil amendment input"
      rule: "nutrient_basis = product_mass * declared_nutrient_fraction for each declared nutrient basis"
      inputs:
        - "product mass"
        - "supplier or laboratory nutrient fraction"
      output: "kg N, P, K, or organic nutrient"
      source_ids:
        - fao-fertilizer-code-of-conduct-2019
    - id: rule_calculate_crop_emissions
      applies_to: "crop elementary outputs"
      rule: "Apply the selected IPCC-compatible factor or measured value to the declared nutrient input, soil, climate, and management records; document factor hierarchy and units."
      inputs:
        - "nutrient input"
        - "management records"
        - "selected factor"
        - "measured emissions where available"
      output: "normalized substance-specific elementary flows"
      source_ids:
        - ipcc-2019-refinement-agriculture
    - id: rule_reconcile_grade_outputs
      applies_to: "grading and sorting"
      rule: "grading_input = marketable_grade + secondary_grade + reject + unaccounted_loss; unaccounted loss must be investigated or disclosed"
      inputs:
        - "grading input"
        - "all declared outputs"
        - reject
        - loss
      output: "complete grade-output reconciliation"
      source_ids:
        - fao-food-loss-waste-2019
    - id: rule_reconcile_packaged_output
      applies_to: "packaging and presentation"
      rule: "product_input = net_reference_output + packaging-process_product_loss + other_declared_product_destinations and packaging mass is reported separately"
      inputs:
        - "product input"
        - "net output"
        - losses
        - "package material"
      output: "net reference flow and package inventory"
      source_ids:
        - iso-14044-2006
    - id: crop_soil_nitrogen_loss_specific_emission
      applies_to: "p_crop_production"
      rule: "Reconcile crop-cycle nutrient inputs, crop removal, soil storage and the method-supported nitrogen-loss pathways for the actual vegetable crop. A residual nitrogen balance or retained soil N is not automatically an elementary emission to soil. Establish the actual substance and receiving medium before creating any release; retain original crop attribution and final fresh-vegetable normalization. This is a mandatory identification and calculation requirement, not an exchange. Before dataset completeness, instantiate one concrete elementary card per actual substance and receiving compartment. Retain kg substance separately from kg elemental N; convert only from the method-reported basis using the documented composition or stoichiometric fraction of the identified species. Never equate all nitrogen with a chosen compound or add elemental-N and compound masses as separate releases. Preserve source activity, factor units, period, uncertainty, boundary and original normalization; link to an existing matching card instead of counting a duplicate. Verify a compatible UUID or explicitly register the concrete unresolved identity. Missing identity, method or activity evidence does not establish zero or justify omission."
      inputs:
        - cp_crop_inputs
      output: "separate substance/compartment emissions and elemental ledgers"
      source_ids:
        - ipcc-2019-refinement-agriculture
    - id: packaging_rejects_specific_output
      applies_to: "p_packaging_presentation"
      rule: "For each vegetable packaging batch, weigh or reconcile discarded packaging by actual material separately from rejected vegetable net mass. Retain species, product state, composition, packaging tare, actual destination and reuse status. A packaged-product reject may remain one exchange only if it is physically transferred as one documented composite stream with fruit/vegetable and packaging fractions evidenced; do not also export those fractions as independent waste exchanges. Reconcile input, accepted net product, rejects and stocks on the same batch scope. This is a mandatory collection and calculation requirement, not an inventory exchange. Before dataset completeness, create one physically specific card for each actual exported stream, including composition, state, native quantity/property, destination and evidenced product/waste role. Use only a compatible verified UUID, or explicitly register the concrete unresolved identity. Do not invent a packaging recipe, assume segregation, infer zero from missing evidence or omit a required stream. A real single mixed stream may remain one composition-defined identity only with collection/transfer evidence and compatible treatment; never duplicate it with its component exports. Keep separately handled liquid and solid streams distinct. Preserve original attribution, period, mass/water balances, reference denominator and treatment/service boundaries; link existing matching exchanges rather than count duplicates. Former aggregate ranges are not individual-stream defaults or limits."
      inputs:
        - cp_packaging_records
      output: "actual stream-specific exchanges, destinations and nonduplicated mass balance"
      source_ids:
        - fao-food-loss-waste-2019
    - id: crop_reactive_n_emissions_specific_exchanges
      applies_to: "p_crop_production"
      rule: "Identify and calculate each actual ammonia and nitrogen-oxide species separately by receiving compartment. Instantiate one elementary card per substance and compartment before dataset completion. Retain the method-reported NOx convention; a mixed NOx or total-N quantity cannot be relabelled as one species. Convert species-specific elemental-N mass to compound mass only with the applicable stoichiometry; do not reconvert compound mass. Retain the linked protocol and actual process attribution. Reconstruct each attributable raw numerator on its recorded stage basis, then normalize once to the matched accepted reference output. Missing identity, quantity, unit or destination blocks dataset completeness; absence requires evidence, not an assumed zero."
      inputs:
        - cp_crop_inputs
      output: "Separate atomic exchanges; completeness required"
      source_ids:
        - ipcc-2019-refinement-agriculture
    - id: conditioning_wastewater_specific_exchanges
      applies_to: "p_primary_conditioning"
      rule: "Enumerate vegetable-conditioning wastewater, its treatment service and any actual environmental release as separate actual streams. Measure each physical stream with its own composition, state, native unit, lot/period and destination; instantiate one atomic card per specific stream and boundary role. Distinguish waste transfer, purchased treatment and substance-specific discharge; do not treat a disposal service as the wastewater itself or duplicate treatment burdens. Keep stock, rework, marketed downgrade and discarded waste separate, and count physical mixtures once without also counting their components as additional exits. Retain the linked protocol and actual process attribution. Reconstruct each attributable raw numerator on its recorded stage basis, then normalize once to the matched accepted reference output. Missing identity, quantity, unit or destination blocks dataset completeness; absence requires evidence, not an assumed zero."
      inputs:
        - cp_conditioning_records
      output: "Separate atomic exchanges; completeness required"
      source_ids:
        - fao-fresh-produce-hygiene-2003
    - id: crop_seed_or_propagule_identity_and_fate
      applies_to: "p_crop_production"
      rule: "For the original crop_seed_or_propagule collection role at this operation, identify the actual physical form, species/material, composition, state and supply/treatment boundary before creating exchanges. Each seed lot, transplant, crown, cutting, larval stage, formulation, coating, preservative or separated residue actually used/generated requires its own concrete card where relevant to this role; these examples are alternatives, not a required recipe. Retain existing collection records and route-specific source evidence. Count-based planting records require measured or supplier-supported mass-per-unit when matched to a mass-based provider; retain count and mass as linked attributes rather than two purchases. Do not merge separate husk/shell or separate agents. A real mixed stream requires composition and recipient evidence and is counted once. Before completeness, record every applicable amount and native unit, link a compatible verified UUID or explicitly unresolved identity, preserve stock/return attribution, and normalize the attributable raw quantity once to the accepted reference output. Missing records are not zero; aggregate ranges are not individual-input defaults."
      inputs:
        - cp_crop_inputs
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids:
        - fao-crop-production-guidance-2016
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_crop_inputs
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
  data_quality_requirements:
    - id: req_identity_qualifiers
      applies_to: "all datasets"
      requirement: "Declare species or cultivar, edible part, production route, geography, crop cycle, fresh state, grade or marketability, and first-market hand-off; document the residual-category decision."
      evidence: "dataset metadata, crop record, and classification review"
    - id: req_measurement_traceability
      applies_to: "all quantitative rows"
      requirement: "Prefer calibrated scales and meters, invoices, application logs, and supplier records; retain conversion factors and allocation drivers."
      evidence: "measurement records, calibration evidence, and supplier documentation"
    - id: req_temporal_coverage
      applies_to: "crop production and harvest"
      requirement: "Cover one complete crop cycle and harvest campaign; explain missing events, atypical weather, or off-season operations."
      evidence: "crop calendar, field log, and reporting-period statement"
    - id: req_mass_balance_completeness
      applies_to: "crop, conditioning, grading, and packaging"
      requirement: "Reconcile inputs, product outputs, co-products, residues, rejects, wastewater, and declared losses; investigate unexplained differences."
      evidence: "batch, grade, weighbridge, and dispatch reconciliations"
    - id: req_emission_method_disclosure
      applies_to: "calculated elementary flows"
      requirement: "State the factor or measurement method, nutrient basis, units, geography, climate or soil assumptions, and uncertainty or replacement plan."
      evidence: "calculation sheet, factor reference, and method note"
    - id: req_route_and_scope_disclosure
      applies_to: "conditional processes"
      requirement: "State whether conditioning, grading, packaging, storage, and distribution are included, and identify the first-market hand-off."
      evidence: "process map, site description, and hand-off record"
    - id: req_data_update_trigger
      applies_to: "published datasets"
      requirement: "Reassess the dataset after changes in cultivar, production technology, nutrient regime, irrigation regime, conditioning line, packaging format, geography, or applicable emission method."
      evidence: "change log and periodic review record"
