validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference_product"
    rule: "Confirm the reference output is 1,000 kg of flow 78bd12e1-801c-4f96-a880-dba39e22783c with Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass group 93a60a57-a4c8-11da-a746-0800200c9a66, and all required qualifiers."
    source_ids: []
  - rule_id: validation_product_quality
    applies_to: "grain_quality"
    rule: "For common wheat and durum wheat declared suitable for human-food processing within the scope of CXS 199-1995, verify measured moisture is not above 14.5% m/m. For every wheat type, retain the separately applicable destination quality and safety evidence and do not extend CXS 199-1995 to an excluded type."
    source_ids:
      - codex-cxs-199-1995
  - rule_id: validation_crop_coverage
    applies_to: "crop_cultivation"
    rule: "Require complete crop-cycle coverage for material and energy inputs, harvest outputs, residue management, and direct field emissions; every omission or proxy shall be disclosed."
    source_ids:
      - eu-pef-2021-2279
      - fao-leap-animal-feeds-2016
  - rule_id: validation_nitrogen_method
    applies_to: "managed_soil_emissions"
    rule: "Reconcile nitrogen activity data to the declared emission equations, identify the IPCC tier or regional method and factors, and check direct and indirect pathways for missing terms and double counting."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validation_mass_balance
    applies_to: "postharvest_conditioning"
    rule: "Require wet-mass and dry-matter balances across received grain, water addition or removal, product, co-products, wastes, and measured losses; investigate any unexplained difference."
    source_ids: []
  - rule_id: validation_allocation
    applies_to: "multifunctionality"
    rule: "Confirm direct assignment or subdivision was attempted before allocation, and retain the physical or economic allocation driver, period, factor, and sensitivity where allocation remains."
    source_ids:
      - eu-pef-2021-2279
      - fao-leap-animal-feeds-2016
  - rule_id: validation_reasoned_estimates
    applies_to: "provisional_ranges"
    rule: "Flag every reasoned_estimate as provisional and replace it with regional reviewed evidence before activation unless the review record explicitly accepts continued use."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production data package for non-seed wheat grain through the declared postharvest conditioning gate"
  downstream_use: "May be published as a secondary_dataset or background_dataset for process and lifecyclemodel construction after review"
  allowed_use: "Attributional modelling of declared wheat cultivation and conditioning routes with matching geography, period, technology, moisture basis, product quality, and allocation context"
  excluded_use: "Wheat seed production; flour or semolina manufacture; unidentified global substitution; comparative assertions where required qualifiers, representativeness, or allocation sensitivity are missing"
  required_metadata: "PCR id and version state; geography; crop season; field and lot coverage; cultivar or species; intended use; irrigation and tillage; rotation; moisture basis; grade; gate; process route; allocation; source and dataset versions"
  required_quality_disclosure: "Primary-data coverage; calibration status; mass and nutrient reconciliation; temporal, geographic, and technological representativeness; proxies; reasoned estimates; uncertainty; allocation sensitivity; unresolved UUIDs"
  update_trigger: "New reviewed regional evidence, revised Codex or IPCC rules, material technology or market-state change, UUID replacement, changed allocation practice, or evidence that a screening range is not representative"
