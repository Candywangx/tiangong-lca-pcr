    required_unit: "kg and % m/m moisture"
    rule: "Preserve measured as-received mass and moisture. If masses are converted to a common moisture basis, use dry matter conservation and retain both measured and converted values. For common wheat and durum wheat intended for human-food processing within its stated scope, validate the final lot against the 14.5% m/m maximum in codex-cxs-199-1995; otherwise apply the separately declared destination specification."
