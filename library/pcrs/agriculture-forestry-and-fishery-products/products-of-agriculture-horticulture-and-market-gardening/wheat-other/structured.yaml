        - fao-leap-animal-feeds-2016
    - rule_id: boundary_field_emissions
      applies_to: "direct_field_emissions"
      rule: "Include direct and indirect nitrogen emissions from managed soil, crop-residue nitrogen returned to soil, and CO2 from lime and urea when applicable; apply a declared IPCC tier or a reviewed regional method without double counting."
