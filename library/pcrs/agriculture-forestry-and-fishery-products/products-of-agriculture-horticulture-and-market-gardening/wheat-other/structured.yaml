  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all crop-cycle and process amounts"
      rule: "Normalized amount = recorded amount multiplied by 1,000 divided by net saleable reference-product mass in kg on the same moisture basis"
      inputs:
        - "recorded amount"
        - "net saleable grain mass"
        - "moisture basis"
      output: "amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_moisture_conversion
      applies_to: "grain mass conversion"
      rule: "Dry matter = as-received mass multiplied by one minus moisture fraction. Converted mass at target moisture = dry matter divided by one minus target moisture fraction."
      inputs:
        - "as-received mass"
        - "measured moisture"
        - "target moisture"
      output: "dry matter and explicitly labelled converted mass"
      source_ids:
