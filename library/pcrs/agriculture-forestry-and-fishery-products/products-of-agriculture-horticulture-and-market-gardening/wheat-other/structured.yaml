      applies_to: "managed-soil nitrogen emissions"
      rule: "Apply the declared IPCC tier equations to synthetic and organic N, crop-residue N, volatilization, deposition, leaching, and runoff activity data; convert N2O-N to N2O where required and prevent double counting across pathways."
      inputs:
        - "nitrogen activity fields"
        - "residue data"
        - "regional conditions"
        - "selected factors"
      output: "direct and indirect N2O and associated nitrogen-loss flows"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_lime_urea_co2
      applies_to: "lime and urea application"
      rule: "Calculate CO2 from collected lime and urea application amounts using the declared IPCC carbon-content or emission factors."
      inputs:
        - "lime type and mass"
        - "urea mass"
        - "selected factors"
      output: "kg CO2 per crop cycle"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_postharvest_mass_balance
      applies_to: "postharvest conditioning"
      rule: "Reconcile received dry matter with saleable-product dry matter, collected co-products, wastes, and measured losses; water addition and removal shall be reported separately from dry-matter loss."
      inputs:
        - "received and output masses"
        - moisture
        - "water addition"
        - "waste and co-product mass"
      output: "wet-mass and dry-matter balance with unexplained difference"
