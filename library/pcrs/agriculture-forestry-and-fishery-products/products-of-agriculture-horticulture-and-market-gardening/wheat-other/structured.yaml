allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "multifunctional_processes"
    rule: "Avoid allocation by subdividing cultivation and postharvest operations and assigning directly measured inputs, outputs, and emissions to the product or operation that causes them."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_crop_coproducts
    applies_to: "collected_straw_and_other_coproducts"
    rule: "Residue returned to soil receives no product allocation. When straw or another co-product leaves the field and subdivision is not possible, apply a documented physical relationship that reflects causality; if no defensible physical relationship exists, use economic allocation with geography- and period-specific prices and report sensitivity."
    source_ids:
      - eu-pef-2021-2279
      - fao-leap-animal-feeds-2016
  - rule_id: allocation_rotation
    applies_to: "shared_rotation_operations"
    rule: "Assign crop-specific operations directly. Allocate genuinely shared multi-crop or multi-year operations by the physical driver such as treated area, operation time, or measured use, and disclose the chosen driver and period."
    source_ids:
      - fao-leap-animal-feeds-2016
  - rule_id: allocation_waste
    applies_to: "postharvest_rejects"
    rule: "Treat material without an intended market or internal productive use as waste. If screenings or rejected grain are sold or used productively, reclassify them as product flows and apply the multifunctionality hierarchy."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_crop_inputs
      process_id: "crop_cultivation"
      flow_role: "Seed, fertiliser, amendment, crop-protection, irrigation, fuel, and electricity inputs"
      record_type: "invoices, issue logs, application logs, meters, field records"
      raw_fields: "product identity; quantity; nutrient or active-ingredient analysis; field area; date; operation; meter or invoice id"
      collection_method: "reconcile purchases and issues to field application and meter records"
      unit: "native unit plus kg, m3, kWh, or MJ after documented conversion"
      frequency: "each application or operation"
      temporal_coverage: "full declared crop cycle"
      site_scope: "every represented field or homogeneous field group"
      aggregation_rule: "sum by product and field, then normalize by net saleable grain yield"
      quality_evidence: "invoice or issue record, calibrated meter, application log, field map, and conversion factor source"
