allocation_rules:
  - rule_id: allocation_mass_balance_first
    applies_to: "all nodes"
    rule: "Complete physical and dry-matter balances before allocation; keep moisture loss, residues, field loss, rework, downgrade, rejects, and accepted seed visible."
    source_ids: []
  - rule_id: allocation_single_intended_product
    applies_to: "crop route"
    rule: "Accepted seed is the sole intended product by default. Residues and rejects retain burdens to their destination; any claimed co-product requires disclosed function and goal-consistent allocation."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rework loop"
    rule: "Retain burdens through return to separation, cleaning, drying, or grading; count returned mass once and exclude it from accepted output until it passes."
    source_ids: []
  - rule_id: allocation_run_period
    applies_to: "shared runs"
    rule: "Assign shared energy, cleaning, and changeover once with a disclosed causal driver; do not count run totals and lot shares together."
    source_ids: []
  - rule_id: allocation_multi_period
    applies_to: "perennial route"
    rule: "Separate establishment, production, replacement, and termination; attribute phases over evidenced productive output and prevent double attribution."
    source_ids:
      - fao-ecocrop-ricinus-communis
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_inputs
      process_id: "cultivation"
      flow_role: "nutrients and irrigation"
      record_type: "invoices, application logs, meters"
      raw_fields: "field_id; route; phase; product; composition; quantity; unit; date"
      collection_method: "reconcile purchase and field application; Raw aggregation and attribution: sum by field, material, period; retain zero-use"
      unit: "native unit plus kg"
      frequency: "every application"
      temporal_coverage: "crop cycle or productive period"
      site_scope: "every field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, meter, application, calibration"
    - protocol_id: cp_energy_records
      process_id: "all_nodes"
      flow_role: "fuels and electricity"
      record_type: "issues, meters, equipment logs"
      raw_fields: "process_id; run_id; carrier; quantity; unit; equipment; hours; driver"
      collection_method: "direct measurement or documented calculation; Raw aggregation and attribution: sum by carrier and node; allocate once"
      unit: "native unit and MJ"
      frequency: "each run or period"
      temporal_coverage: "complete foreground period"
      site_scope: "every field/facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, meter, log, factor"
    - protocol_id: cp_harvest_lots
      process_id: "harvest"
      flow_role: "capsules and field loss"
