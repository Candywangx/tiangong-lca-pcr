      collection_method: "weigh each state and link dispatch/rework; Raw aggregation and attribution: accepted only into reference output; rework once"
      unit: "kg and grade measure"
      frequency: "every lot"
      temporal_coverage: "all supplying lots"
      site_scope: "every site"
      aggregation_rule: "per declared reference flow"
