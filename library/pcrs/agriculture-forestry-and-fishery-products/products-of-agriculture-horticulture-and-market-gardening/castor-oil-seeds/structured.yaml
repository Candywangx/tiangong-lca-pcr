      raw_fields: "field_id; event_id; date; pattern; technology; mass; moisture; loss"
      collection_method: "weigh every lot; document loss sampling; Raw aggregation and attribution: sum events after moisture reconciliation"
      unit: "kg and % wet basis"
      frequency: "every event"
      temporal_coverage: "all pickings or terminal harvest"
      site_scope: "every field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, sample, trace"
    - protocol_id: cp_field_emissions
      process_id: "cultivation"
      flow_role: "substances"
      record_type: "measurements and calculations"
      raw_fields: "substance; compartment; activity; factor; result; unit; method"
      collection_method: "measure or use declared method; Raw aggregation and attribution: preserve identity and compartment"
      unit: "kg substance"
      frequency: "event or period"
      temporal_coverage: "full period"
      site_scope: "every field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "method, raw data, calculation"
    - protocol_id: cp_conditioning_lots
      process_id: "pod_seed_separation_drying_cleaning"
      flow_role: "seed, residues, moisture"
      record_type: "batch sheets and tests"
      raw_fields: "run_id; masses; moisture; residues; rejects; destination; technology ; all input/output water including rejects/residues; actual added/rain water; separate liquid exports; opening/closing water stock; moisture and density; supported evaporation"
      collection_method: "weigh inputs/outputs and sample moisture; Raw aggregation and attribution: reconcile wet and dry matter by run"
      unit: "kg and % wet basis"
      frequency: "every run/lot"
      temporal_coverage: "all supplying lots"
      site_scope: "every site"
