        - area
        - state
        - moisture
      output: "kg/ha/year"
      source_ids:
        - penn-state-hop-production
    - id: calc_grading_balance
      applies_to: "Harvest and grading"
      rule: "input minus unique accepted, downgraded, rejected, chaff and loss states; rework returns are transfers."
      inputs:
        - "all lot masses and state codes"
      output: "closure mass and ratio"
      source_ids:
        - mass-balance-identity
    - id: calc_drying_water
      applies_to: "Drying"
      rule: "Determine supported evaporation on a closed water-mass control volume: incoming material water + actual added water + opening water stock - water in all accepted/co-product/reject/residue exits - separate liquid discharge/exports - closing water stock. Use measured wet mass times wet-basis moisture for each material stream, and compatible density for liquid volumes. Internal recirculation cancels. Retain actual rain/rewetting where relevant; total fresh/dry mass difference is not all water. Independently support all terms and the evaporation pathway; investigate an unexplained or negative balance rather than force it into a vapour release or clip it to zero. Keep water quantities distinct from dry-solids loss and other volatiles. Attribute and normalize the evidenced water release once using the original matched final reference."
      inputs:
        - cp_drying_batch
        - "wet mass/moisture of all material streams"
        - "actual water additions/liquid exports"
        - "opening/closing water stocks and supported evaporation"
      output: "kg water to air"
      source_ids:
