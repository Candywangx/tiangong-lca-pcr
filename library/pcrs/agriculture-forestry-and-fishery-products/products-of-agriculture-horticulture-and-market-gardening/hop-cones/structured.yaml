      raw_fields: "yard_id; area; phase; cultivar; material_uuid; count; mass; installation_year; replacement_year; service_area; consuming_nodes; service_life"
      collection_method: "Physical inventory linked to mapped blocks; Raw aggregation and attribution: Attribute once across service area and periods"
      unit: "count; kg; ha; year"
      frequency: "Each installation or replacement"
      temporal_coverage: "Full declared scenario"
      site_scope: "Asset and serviced blocks"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Dated invoices, drawings, logs and photos"
    - protocol_id: cp_nutrient_inputs
