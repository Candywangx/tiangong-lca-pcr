allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "separately measured fields, operations, grades, or destinations"
    rule: "Prefer subdivision and direct assignment before allocation."
    source_ids: []
  - rule_id: allocation_single_output
    applies_to: "residues and rejects without an intended product function"
    rule: "Assign burdens to accepted yams and retain residues and rejects as Waste flows; do not credit avoided disposal without an explicit scenario."
    source_ids: []
  - rule_id: allocation_saleable_downgrade
    applies_to: "downgraded yams sold as intended product"
    rule: "Declare all intended outputs and use a justified physical or economic allocation only when subdivision is impracticable; report basis and sensitivity."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_seed_retention
    applies_to: "internally retained planting material"
    rule: "Record an internal Product-flow transfer and burden decision; prevent the same tuber mass and burden from being both current output and free next-cycle input."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_energy_inputs
      process_id: "cultivation_harvest_conditioning"
      flow_role: "planting material, fertilizer products, diesel, electricity"
      record_type: "invoice, issue log, meter, product analysis"
      raw_fields: "date, identity, quantity, unit, analysis, process, plot or lot"
      collection_method: "reconcile purchases and issues; preserve physical products before conversion; Raw aggregation and attribution: sum by product and process, then normalize"
      unit: "native unit and kg nutrient"
      frequency: "each event"
      temporal_coverage: "complete crop cycle"
      site_scope: "contributing farm and plots"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, labels, meter and issue logs"
    - protocol_id: cp_water_records
      process_id: "cultivation_and_conditioning"
      flow_role: "irrigation water, wash water, wastewater"
      record_type: "meter, pump log, vessel count, balance"
      raw_fields: "source, date, volume or mass, destination"
      collection_method: "meter preferred; otherwise calibrated pump-time or vessel count; Raw aggregation and attribution: sum by source and destination"
      unit: "m3 or kg"
      frequency: "each event"
      temporal_coverage: "crop cycle and conditioning"
      site_scope: "field and conditioning area"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration and balance check"
    - protocol_id: cp_field_area_and_yield
      process_id: "cultivation"
      flow_role: "area occupation and yield"
      record_type: "field map, plot register, harvest ticket"
      raw_fields: "plot, area, dates, harvest-ready mass"
      collection_method: "match surveyed area to plot harvest; Raw aggregation and attribution: include only plots entering package"
      unit: "ha, date, kg"
      frequency: "each plot and harvest"
      temporal_coverage: "complete crop cycle"
      site_scope: "every contributing plot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "map, register, calibrated scale"
    - protocol_id: cp_crop_mass_transfers
      process_id: "all_nodes"
      flow_role: "intermediate and accepted yam masses"
      record_type: "scale and transfer log"
      raw_fields: "time, origin, destination, gross, tare, net, lot, state"
      collection_method: "calibrated weighing at each hand-off; Raw aggregation and attribution: sum by state and reconcile"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "harvest through hand-off"
      site_scope: "all contributing lots"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration and traceability"
    - protocol_id: cp_reject_and_loss_records
      process_id: "harvest_conditioning_grading"
      flow_role: "damaged tubers, residues, downgraded yams, rejects"
      record_type: "sorted-bin weights and disposition logs"
      raw_fields: "role, reason, grade, mass, destination, lot"
      collection_method: "weigh every separated state; Raw aggregation and attribution: sum separately by identity and destination"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "harvest through grading"
      site_scope: "all contributing lots"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale, inspection, receiving evidence"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "attributable amount × 1,000 / net accepted-yam mass"
      inputs:
        - "attributable amount"
        - "accepted mass"
      output: "amount per 1,000 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_nutrient_equivalent
      applies_to: "fertilizer inputs"
      rule: "physical fertilizer mass × declared nutrient fraction; keep N, P2O5, and K2O separate"
      inputs:
        - "product mass"
        - analysis
      output: "kg nutrient"
      source_ids: []
    - id: calc_land_intensity
      applies_to: "field area"
      rule: "contributing area × 1,000 / harvest-ready tuber mass from the same plots"
      inputs:
        - ha
        - "kg tubers"
      output: "ha·crop_cycle per 1,000 kg tubers"
      source_ids:
        - iita-yam-yield-2020
    - id: calc_direct_n2o
      applies_to: "direct soil N2O"
      rule: "apply selected direct N2O-N factor, then multiply by 44/28"
      inputs:
        - "kg N input"
        - factor
      output: "kg N2O"
      source_ids:
        - ipcc-2006-managed-soils-n2o
    - id: calc_node_mass_balance
      applies_to: "harvest, conditioning, grading"
      rule: "input yam mass = yam Product outputs + yam Waste outputs + stock change + documented loss"
      inputs:
        - transfer
        - reject
        - "and stock records"
      output: "residual and completeness flag"
      source_ids:
        - mass-balance-identity
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_material_energy_inputs
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and intermediate states"
      requirement: "Preserve species or group, cultivar where known, lot, grade, and state; never merge other tuber crops into yam output."
      evidence: "lot records and buyer specification"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use one reporting period covering one complete crop cycle and every included harvest, conditioning, and grading event; no replacement or termination event occurs."
      evidence: "dated field and transfer records"
    - id: dq_mass_balance
      applies_to: "transfer nodes"
      requirement: "Reconcile accepted, downgraded, rejected, residue, wastewater, loss, and stock-change states without double counting."
      evidence: "node reconciliation"
    - id: dq_conditional_routes
      applies_to: "irrigation, washing, powered operations"
      requirement: "Record zero only after confirming the operation did not occur."
      evidence: "operation log and meter or invoice"
    - id: dq_range_use
      applies_to: "amount ranges"
      requirement: "Use ranges as screens; actual foreground records determine reported values, and regional examples are not universal limits."
      evidence: "range exception review"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The reference output shall be exactly 1,000 kg net accepted Yams flow with every required qualifier declared."
    source_ids: []
  - rule_id: validate_node_linkage
    applies_to: "process graph"
    rule: "Cultivation, harvest, conditioning, and grading transfer rows shall match by lot and mass basis."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_grade_completeness
    applies_to: "grading"
    rule: "Every incoming tuber mass shall be accepted, downgraded, rejected, stock change, or documented loss with a destination."
    source_ids:
      - fao-yam-postharvest
      - mass-balance-identity
  - rule_id: validate_conditional_inputs
    applies_to: "irrigation, washing, electricity, diesel"
    rule: "Zero is conforming only when records show the relevant operation or carrier was absent."
    source_ids: []
  - rule_id: validate_range_denominators
    applies_to: "all ranges"
    rule: "Each bound shall use its stated field, process-output, nitrogen-input, or reference-flow denominator; conditional ranges apply only when active."
    source_ids: []
  - rule_id: validate_no_extended_boundary
    applies_to: "dataset boundary"
    rule: "Curing, extended storage, packaging, and post-gate transport shall be excluded or represented as explicit downstream processes."
    source_ids:
      - fao-yam-postharvest
