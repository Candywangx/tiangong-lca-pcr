system_boundary:
  rules:
    - rule_id: boundary_managed_cultivation
      applies_to: "yam_cultivation"
      rule: "Include field establishment, management inputs, irrigation when used, field energy, and direct managed-soil emissions for the crop cycle."
      source_ids:
        - fao-quality-declared-yam-planting-material
        - iita-yam-yield-2020
    - rule_id: boundary_harvest_handoff
      applies_to: "yam_harvest"
      rule: "Treat lifting and field collection as a distinct hand-off; distinguish collected yams, damaged tubers, and uncollected loss."
      source_ids:
        - fao-yam-postharvest
    - rule_id: boundary_primary_conditioning
      applies_to: "yam_primary_conditioning"
      rule: "Include loose-soil removal, trimming, conditional washing, drainage, and air drying before grading; exclude storage undertaken to extend life."
      source_ids:
        - fao-yam-postharvest
    - rule_id: boundary_grading
      applies_to: "yam_grading"
      rule: "Reconcile conditioned tubers into accepted product, downgraded product, rejects, and physical loss."
      source_ids:
        - fao-yam-postharvest
        - mass-balance-identity
