allocation_rules:
  - rule_id: allocation_productive_year
    applies_to: "perennial orchard"
    rule: "Attribute annual operations directly to the declared productive year; annualize establishment, replanting, and shared perennial infrastructure over documented service life and productive area."
    source_ids: []
  - rule_id: allocation_grade_outputs
    applies_to: "grading"
    rule: "Use physical subdivision first. When multiple useful grades leave one inseparable batch, report each mass and apply an explicitly justified allocation consistent across the batch; do not classify useful downgraded nuts as waste."
    source_ids: []
  - rule_id: allocation_hulls_residues
    applies_to: "hulls and residues"
    rule: "Treat as residue without credit when discarded and without economic function; when sold or used as a co-product, disclose destination and apply a reviewed allocation or substitution scenario separately."
    source_ids: []
  - rule_id: allocation_shared_assets
    applies_to: "shared equipment and storage"
    rule: "Allocate by measured operating time, throughput, occupied area-time, or another causal driver; prevent the same annual or batch burden from entering both orchard and conditioning nodes."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "regraded or redried material"
    rule: "Return rework to the producing batch, include additional energy and loss once, and count output only when it reaches the accepted grade."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_orchard_inputs
      process_id: "orchard_production_harvest"
      flow_role: "establishment, nutrients, water, crop protection, energy"
      record_type: "invoices, field logs, meters, contractor records"
      raw_fields: "species, cultivar, block, productive area, tree age, input identity, formulation, assay, amount, unit, date, carrier, purpose"
      collection_method: "reconcile purchase and application records to blocks; Raw aggregation and attribution: sum by block and input, annualize establishment, divide by accepted terminal mass Route-specific requirements: field_energy_input_identification: Actual diesel orchard machinery for floor care, spraying, harvest or internal handling; establish nut species and equipment before activation. Raw activity or stage basis: per productive hectare and harvest year. (route-energy-fao) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route. agricultural_nutrient_inputs_specific_input: Operation orchard_production_harvest: Record each mineral fertilizer, organic fertilizer and nutrient-bearing amendment in its own concrete product card; preserve product, assay, event, and nutrient basis. Original quantity method: collect every applied product once and calculate declared nutrient quantities Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default. crop_protection_input_specific_input: Operation orchard_production_harvest: Record each actual formulation, active ingredient, concentration, and application event; no generic fixed identity is assigned. Original quantity method: measured formulation quantity by product and event Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "native units plus ha"
      frequency: "each event"
      temporal_coverage: "complete declared harvest year; establishment annualization period retained"
      site_scope: "every included orchard block and shared service"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, calibrated-meter records, application logs, area map, service-life evidence"
    - protocol_id: cp_harvest_records
      process_id: "orchard_production_harvest"
      flow_role: "harvest, accepted product, residues, rejects"
      record_type: "weigh tickets, harvest logs, sampling"
      raw_fields: "species, block, date, gross/tare, accepted mass, outer-hull state, moisture, grade, reject/residue class, fate"
      collection_method: "calibrated weighing and representative moisture sampling; Raw aggregation and attribution: sum accepted and non-product masses by lot; preserve species and state"
      unit: "kg, %, ha"
      frequency: "each lot"
      temporal_coverage: "complete harvest window"
      site_scope: "every included orchard block and collection point"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration certificates, lot IDs, moisture records, destination records"
    - protocol_id: cp_orchard_emissions
      process_id: "orchard_production_harvest"
      flow_role: "soil and nutrient emissions"
      record_type: "calculated foreground record"
      raw_fields: "N input by form, residues, soil/climate parameters, factor version, monitored loss where available"
      collection_method: "apply documented applicable method to cp_orchard_inputs; Raw aggregation and attribution: calculate by block then mass-weight to terminal product"
      unit: "kg substance"
      frequency: "each reporting year"
      temporal_coverage: "same harvest year and relevant lag specified by method"
      site_scope: "every included managed block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "factor source, calculation workbook, input reconciliation, reviewer check"
    - protocol_id: cp_conditioning_records
      process_id: "primary_hulling_drying"
      flow_role: "hulling, cleaning, drying, outputs, rejects, emissions"
      record_type: "batch sheets, scales, meters, fuel records, moisture tests"
      raw_fields: "species, lot, incoming mass/moisture/hull state, method, time, temperature, water, carrier, energy, accepted mass/moisture, hulls, rejects, fate"
      collection_method: "matched batch measurement and mass balance; Raw aggregation and attribution: reconcile dry matter and losses per batch, then throughput-weight Route-specific requirements: conditioning_energy_input_identification: Actual electric hulling equipment and drying fans, retaining separate operation records; determine any drying heat carrier from the actual heater. Raw activity or stage basis: per 1,000 kg accepted in-shell nuts. (route-energy-fao) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route."
      unit: "kg, %, m3, kWh, MJ"
      frequency: "each batch"
      temporal_coverage: "all batches represented by dataset"
      site_scope: "every included conditioning line/site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale and meter calibration, moisture method, batch IDs, fuel invoice, balance closure"
    - protocol_id: cp_grading_records
      process_id: "grading_packing"
      flow_role: "grades, rework, packaging, rejects, energy"
      record_type: "batch sheets, scale records, package specifications"
      raw_fields: "species, lot, incoming mass, grade criteria, accepted/downgraded/reject mass, rework, package identity/mass/reuse, energy, destination"
      collection_method: "matched grading-run reconciliation; Raw aggregation and attribution: sum by grade and destination; allocate shared runs by measured throughput Route-specific requirements: grading_energy_input_identification: Actual electric conveying, sorting, weighing and packing inside the gate. Raw activity or stage basis: per 1,000 kg packed nuts. (route-energy-fao) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route. packaging_input_specific_input: Operation grading_packing: Record the actual sack, liner, carton, crate, pallet, or other declared packaging; foreground records determine the one applicable packaging group and concrete exchange. Original quantity method: measured packaging placed with accepted product; reusable items use documented trip allocation Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg, item, kWh"
      frequency: "each run or lot"
      temporal_coverage: "all grading and packing runs represented"
      site_scope: "every included line/site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale calibration, grade inspection, package specification, lot linkage, balance closure"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "orchard_production_harvest"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "actual production nodes; soil/substrate route; climate/soil; nutrient product mass and composition; residue fate/N; relevant mineralisation/organic-soil/excreta activity; method/tier/equation/version; pathway factors and units; lime/urea; actual fuels; substance/compartment; supplier coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
    - protocol_id: cp_declared_reference_handoff
      process_id: "declared_reference_handoff"
      flow_role: "actual accepted terminal product and paired transfer"
      record_type: "scale/lot/acceptance records"
      raw_fields: "species; state; grade; moisture/basis; gate; actual_terminal_process_id; actual_terminal_output_row_id; lot/transfer_id; gross/tare/net mass R; raw stage totals/throughputs; stocks, rejects and destinations"
      collection_method: "Weigh accepted net R at the existing gate; match exactly one actual terminal source of the same lot/state and reconcile all earlier losses and stocks. If conditional preparation is absent use the last actual included eligible product output, without inventing that preparation. Preserve original activity records and all required qualifiers."
      unit: "kg and native activity units"
      frequency: "each accepted lot"
      temporal_coverage: "matched production and handoff period"
      site_scope: "existing declared producer/primary gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated weighing, acceptance/grade records, lot chain, activation/bypass evidence and closed balances"
  calculation_rules:
    - id: calc_area_normalization
      applies_to: "orchard flows"
      rule: "annual block total / accepted terminal mass from the same harvest year × 1,000"
      inputs:
        - "block input or emission"
        - "accepted terminal mass"
      output: "amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_establishment_annualization
      applies_to: "establishment and perennial assets"
      rule: "attributable quantity / documented productive service years, then allocate by productive area"
      inputs:
        - "establishment quantity"
        - "service life"
        - area
      output: "annual burden"
      source_ids: []
    - id: calc_batch_mass_balance
      applies_to: "conditioning and grading"
      rule: "incoming mass = accepted + downgraded + rejects + removed hulls + measured or calculated moisture loss ± closure error"
      inputs:
        - "matched batch masses and moisture"
      output: "reconciled batch inventory"
      source_ids:
        - mass-balance-identity
    - id: calc_dry_matter
      applies_to: "moisture conversion"
      rule: "as-received mass × (1 − moisture fraction on wet basis)"
      inputs:
        - mass
        - "measured moisture and basis"
      output: "dry matter mass"
      source_ids:
        - mass-balance-identity
    - id: calc_fossil_co2
      applies_to: "on-site drying combustion"
      rule: "fuel quantity × net calorific value × carbon factor × oxidation factor × 44/12 where factor is carbon mass"
      inputs:
        - "carrier record"
        - "selected factors"
      output: "kg fossil CO2"
      source_ids:
        - ipcc-2006-stationary-combustion
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_orchard_emissions
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_environment_coverage
      applies_to: "actual managed-production nodes"
      rule: "For the actual owned managed-production node(s), require an applicability ledger for direct soil N2O, volatilisation/deposition-derived indirect N2O, leaching/runoff-derived indirect N2O, NH3/NOx and nutrient losses, plus actual liming/urea-use CO2. Primary calculation precedence is a representative pathway measurement, then a validated site/national method applicable to the crop, soil and management; otherwise use the compatible 2006 IPCC/2019-refined managed-soil equations and climate/input-specific factor selection for N2O and lime/urea CO2. Retain the exact edition, equation, tier, activity and factor units, climate and management applicability; no universal dose or emission factor is prescribed. Non-soil/protected routes need a method valid for their actual medium; do not force soil factors onto an inapplicable route. Use the same period/field N ledger for synthetic and organic additions, residues, actual relevant mineralisation/organic-soil and excreta pathways; demonstrate absent pathways rather than infer zero. Calculate direct and each indirect component separately, then assign each once to matching existing or new concrete cards; never add a total to its components. Convert N2O-N to molecular N2O by 44/28 once. NH3, NOx and nutrient/pesticide loss require an applicable measured or documented substance/fate model; total N/P or an unexplained balance residual is not a compound release. Keep actual receiving compartments and molecular versus elemental/reporting bases explicit; indirect formation does not remove the same N from the source ledger twice. Include actual local combustion releases separately using fuel-specific combustion-only methods; purchased electricity/heat/services retain upstream coverage once. Add one identity-specific exchange only for a supported release and reuse an existing matching card, with verified UUID or explicit unresolved identity. Missing applicable method/activity/factor/identity blocks completeness; it is not a justified zero. Attribute raw activity/release totals and normalize once to the matched accepted reference output."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids:
        - review-ipcc-soils-2019
    - id: calc_final_handoff_normalization
      applies_to: "all foreground quantities and actual route outputs"
      rule: "Let R be positive measured accepted final mass in kg for one matched species/state/grade/gate/period, excluding tare, rejects, co-products and held stock. Physical ledger = raw physical quantity/R * 1000 kg, without burden-allocation scaling. Attributable inventory contribution = attributable raw quantity/R * 1000 kg, preserving native numerator units and the existing output/period attribution. A local intensity q_i=Q_i/O_i first reconstructs Q_i=q_i*actual linked O_i; do not divide by R again after final normalization. Both handoff sides are the same measured event R/R*1000 kg, not another physical yield. Include only actual active operations; record and substantiate bypass. Missing/nonpositive R or an unlinked terminal record blocks a normalized complete result, not zero. Preserve original stage data and cancel paired internal transfers once."
      inputs:
        - cp_declared_reference_handoff
        - "original linked collection protocols"
      output: "native quantities per declared final reference"
      source_ids:
        - declared-handoff-measurement-definition
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Botanical/common species, cultivar where material, lot, CPC residual eligibility, hard-shell state, outer-hull state, moisture, grade, and gate shall be explicit."
      evidence: "product specification, lot record, photographs or inspection record"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Reconcile productive area, harvest, each conditioning/grading batch, energy, water, rejects, and destinations for the declared period."
      evidence: "completeness checklist and mass-balance closure"
    - id: dq_temporal
      applies_to: "perennial route"
      requirement: "Use one representative harvest year or disclose a justified multi-year average; retain year-specific yield and input records before averaging."
      evidence: "dated records and averaging worksheet"
    - id: dq_measurement
      applies_to: "mass and moisture"
      requirement: "Use calibrated scales and a documented representative moisture method; disclose wet/dry basis and sampling frequency."
      evidence: "calibration and sampling records"
    - id: dq_route
      applies_to: "conditional operations"
      requirement: "Include only actual hulling, drying, grading, packing, rework, and storage activities and disclose inactive nodes."
      evidence: "process map, batch logs, gate statement"
validation_rules:
  - rule_id: validate_residual_identity
    applies_to: "reference product"
    rule: "Reject a dataset that does not name one cultivated species and demonstrate that it is not a named CPC nut leaf, wild nut, groundnut, shelled kernel, or mixed lot."
    source_ids: []
  - rule_id: validate_shell_state
    applies_to: "reference product"
    rule: "Reject when hard-shell integrity, outer-hull state, moisture basis, grade, or terminal gate is missing or internally inconsistent."
    source_ids: []
  - rule_id: validate_reference_mass
    applies_to: "terminal output"
    rule: "Accepted reference output shall equal 1,000 kg and shall exclude downgraded, rejected, and rework material not yet accepted."
    source_ids: []
  - rule_id: validate_route_activation
    applies_to: "conditional nodes"
    rule: "Hulling, drying, grading, packing, and their inputs/emissions shall be zero or absent when inactive; when active, matched batch records are required."
    source_ids: []
  - rule_id: validate_nutrient_binding
    applies_to: "orchard nutrients"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "harvest, conditioning, grading"
    rule: "Check accepted, downgraded, rejected, hull, residue, and moisture-loss terms against incoming mass and disclose closure error."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "all inventory cards"
    rule: "Flag values outside a range for review; provisional ranges are screens and shall not replace foreground evidence or act as production limits."
    source_ids: []
  - rule_id: validate_uuid_use
    applies_to: "fixed bindings"
    rule: "Confirm UUID, flow type, property, category, state, and gate; resolve parameterized cards to verified concrete UUIDs before process publication."
    source_ids: []
  - rule_id: validate_multi_period
    applies_to: "perennial burdens"
    rule: "Reject double attribution of establishment, replacement, or shared infrastructure across harvest years."
    source_ids: []
  - rule_id: validate_final_handoff_bypass
    applies_to: "selected actual route and all conditional bypass states"
    rule: "Check both presence and absence of optional conditioning/packing/storage against actual records: exactly one required handoff reference persists, its source product/state/gate matches Section 3, active physical rows retain measured throughput, and inactive physical activities add no exchange. Require raw accepted mass, upstream closure, unique transfer pairing and single final normalization; an unexplained state or missing identity is not an assumed valid branch."
    source_ids:
      - declared-handoff-measurement-definition
published_dataset_profile:
  dataset_role: "foreground product system for one declared residual cultivated nut species in shell"
  downstream_use: "secondary_dataset; background_dataset only when species, route, state, geography, and gate fit the receiving study"
  allowed_use: "comparative and supply-chain modelling within the declared species, state, technology, period, geography, and gate"
  excluded_use: "species-neutral averages without composition evidence; named CPC nuts; wild nuts; groundnuts; shelled kernels; processed nuts; substitution across wet/dry or farm/conditioning gates"
  required_metadata: "species, cultivar, origin, orchard system, productive area and age, harvest year, lot/aggregation, hull and shell state, moisture basis, grade, gate, process activation, allocation, packaging, UUID resolution"
  required_quality_disclosure: "coverage, measurement methods, missing data, range exceptions, batch mass-balance closure, multi-year averaging, shared-asset attribution, allocation choices, unresolved identities"
  update_trigger: "species/category correction, gate or route change, material technology change, new representative records, revised emission factors, material yield/moisture change, or verified identity change"
